base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/005.yaml
  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
translation:
  language: fr
  text: Mais une fois que Maccabée eut constitué une troupe, il devint dès lors impossible aux nations de lui résister, car la colère du Seigneur s’était changée en miséricorde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενόμενος ... ἐν συστήματι
  choice: une fois que Maccabée eut constitué une troupe
  rationale: L’expression indique que Maccabée en vint à agir au sein d’un groupe organisé. « Constitué une troupe » exprime naturellement le rassemblement d’une force combattante sans en préciser indûment la taille.
- source_word: ἀνυπόστατος
  choice: impossible ... de lui résister
  rationale: L’adjectif désigne quelqu’un contre qui l’on ne peut tenir ou résister. Cette tournure française en restitue clairement la force dans le contexte militaire.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: Le terme vise ici les peuples non juifs qui entourent la Judée. « Nations » reste proche du grec et évite de donner au mot une coloration technique étrangère au contexte.
- source_word: τῆς ὀργῆς
  choice: la colère
  rationale: « Colère » est le terme français courant et digne pour la vive désapprobation divine; il conserve la gravité du grec sans archaïsme.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le titre désigne ici le Dieu d’Israël; la majuscule rend cet emploi explicite.
- source_word: εἰς ἔλεον τραπείσης
  choice: s’était changée en miséricorde
  rationale: La formule conserve l’image grecque d’un passage de la colère à la miséricorde, sans expliciter davantage le mode de ce changement.
theological_decisions:
- issue: Relation causale du génitif absolu final et changement de la disposition divine
  choice: car la colère du Seigneur s’était changée en miséricorde
  alternative: la colère du Seigneur s’étant changée en miséricorde
  rationale: Dans le contexte, le génitif absolu explique le succès de Maccabée. « Car » rend cette valeur causale tout en préservant l’affirmation théologique tendue selon laquelle la colère divine devient miséricorde, sans préciser un agent ni proposer de système explicatif.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif est conservé; « dès lors » traduit ἤδη dans sa valeur de nouvel état acquis. Aucun archaïsme confessionnel ni vocabulaire militaire excessivement précis n’a été ajouté.
