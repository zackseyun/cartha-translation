base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
translation:
  language: fr
  text: Après avoir été humilié par ceux qui passaient pour les moins importants parmi les siens, il ôta, avec l’aide du Seigneur, son vêtement d’apparat et, tel un fugitif, traversa seul l’intérieur du pays. Il arriva à Antioche, après avoir connu une réussite sans pareille dans la destruction de son armée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est ironique : sa seule « réussite sans pareille » fut la destruction de sa propre armée.'
    reason: ironie lexicale et rhétorique
lexical_decisions:
- source_word: ταπεινωθεὶς
  choice: Humilié
  rationale: Le participe aoriste passif exprime l’abaissement honteux subi par Nicanor; « humilié » en conserve clairement la force passive et le renversement de situation.
- source_word: ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  choice: par ceux qu’il considérait comme les moins importants
  rationale: La tournure grecque est condensée. καθʼ αὑτόν peut marquer son propre jugement, et νομιζομένων ἐλαχίστων εἶναι désigne ceux qui passaient à ses yeux pour être de très peu d’importance. Cette lecture préserve l’ironie de sa défaite.
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  choice: avec l’aide du Seigneur
  rationale: 'Le datif instrumental se rattache naturellement à l’humiliation infligée à Nicanor: ceux qu’il méprisait l’ont abaissé avec l’aide du Seigneur. La place de l’expression dans la phrase française rend ce rapport explicite sans ajouter d’agent absent du grec.'
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  choice: il ôta son vêtement d’apparat
  rationale: ἀποθέμενος signifie « ayant ôté »; δοξική qualifie un vêtement éclatant qui manifeste le rang. « Vêtement d’apparat » est naturel et conserve cette dimension publique.
- source_word: διὰ τῆς μεσογείου
  choice: traversa … l’intérieur des terres
  rationale: μεσόγειος désigne ici la région intérieure, par opposition aux voies côtières ou maritimes. La traduction évite la confusion moderne avec la mer Méditerranée.
- source_word: δραπέτου τρόπον
  choice: tel un fugitif
  rationale: La locution signifie littéralement « à la manière d’un fugitif » ou d’un homme en fuite. Elle souligne le caractère honteux de sa retraite sans imposer le sens plus précis d’esclave fugitif.
- source_word: ἔρημον ἑαυτὸν ποιήσας
  choice: seul
  rationale: Littéralement, il se rend « solitaire » ou « isolé ». Dans le récit de sa fuite, « traversa seul » exprime cette solitude de façon concise et idiomatique.
- source_word: ἧκεν εἰς Ἀντιόχειαν
  choice: Il arriva à Antioche
  rationale: Rendu direct et naturel du verbe de mouvement ἥκω.
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: après avoir connu une réussite sans pareille dans la destruction de son armée
  rationale: La formulation conserve l’emploi manifestement ironique de εὐημερέω, « réussir/prospérer », ainsi que l’intensification ὑπὲρ ἅπαν, sans remplacer l’ironie du grec par une explication dans le corps du texte.
theological_decisions:
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: le seigneur
  rationale: Dans ce récit, κύριος désigne le Dieu d’Israël. La majuscule française marque ce titre divin sans développer davantage l’affirmation du grec.
- issue: Rattachement de τῇ τοῦ κυρίου βοηθείᾳ
  choice: L’aide du Seigneur est rattachée à l’humiliation de Nicanor par ses adversaires.
  alternative: Rattacher l’aide du Seigneur au fait que Nicanor ôte son vêtement d’apparat.
  rationale: Le datif suit immédiatement la proposition participiale décrivant son humiliation et en indique naturellement le moyen. Le rattachement au geste d’ôter son vêtement serait moins cohérent sémantiquement.
- issue: Ironie de εὐημερηκὼς dans la destruction de l’armée
  choice: conserver littéralement l’idée d’une « réussite sans pareille »
  alternative: 'expliciter: « n’ayant réussi qu’à faire détruire son armée »'
  rationale: Le grec produit une tension ironique en parlant de réussite à propos du désastre militaire. La traduction maintient cette tension et la note l’éclaire sans la résoudre dans le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque très participiale est divisée en deux phrases pour rester claire. « Vêtement d’apparat », « tel un fugitif » et « l’intérieur des terres » privilégient des expressions courantes sans effacer la honte et l’ironie du récit.
