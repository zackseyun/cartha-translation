revisions:
- from: Humilié, avec l’aide du Seigneur, par ceux qu’il considérait comme les moins importants, il ôta son vêtement d’apparat et, tel un fugitif, traversa seul l’intérieur des terres. Il arriva à Antioche, après avoir connu une réussite sans pareille dans la destruction de son armée.[a]
  to: Après avoir été humilié par ceux qui passaient pour les moins importants parmi les siens, il ôta, avec l’aide du Seigneur, son vêtement d’apparat et, tel un fugitif, traversa seul l’intérieur du pays. Il arriva à Antioche, après avoir connu une réussite sans pareille dans la destruction de son armée.[a]
  rationale: La révision retire l’interprétation non nécessaire selon laquelle Nicanor lui-même jugeait ces personnes insignifiantes et replace « avec l’aide du Seigneur » auprès de l’action d’ôter son vêtement, conformément à l’enchaînement grec. Elle conserve le registre narratif, l’isolement de la fuite, l’itinéraire par l’intérieur et l’ironie délibérée de la réussite liée à la destruction de l’armée.
