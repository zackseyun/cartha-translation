base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
translation:
  language: fr
  text: Mais Judas, appelé aussi Maccabée, et ceux qui étaient avec lui entraient secrètement dans les villages, appelaient leurs parents et, accueillant ceux qui étaient demeurés dans le judaïsme[a], rassemblèrent environ six mille personnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui étaient restés fidèles au mode de vie juif ». Ici, le mot grec traduit par « judaïsme » désigne l’identité religieuse juive et sa mise en pratique, par opposition aux pressions en faveur de l’hellénisation.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισπορευόμενοι λεληθότως
  choice: se rendaient discrètement… sans se faire remarquer
  rationale: Les deux expressions grecques soulignent conjointement le déplacement clandestin et le fait de passer inaperçus. La formulation française conserve ces deux nuances sans redondance maladroite.
- source_word: προσεκαλοῦντο
  choice: faisaient appel à
  rationale: Le moyen indique qu’ils appelaient des personnes à les rejoindre. Cette expression est naturelle et n’implique pas une conscription officielle.
- source_word: τοὺς συγγενεῖς
  choice: leurs proches
  rationale: Le terme désigne les parents ou les membres de la parenté. « Leurs proches » est actuel, inclusif et suffisamment large.
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  choice: ceux qui étaient restés attachés au judaïsme
  rationale: Le verbe exprime la permanence, tandis que Ἰουδαϊσμός désigne ici l’identité et la pratique religieuses juives face à la pression hellénisante. « Attachés » rend naturellement cette fidélité contextuelle, explicitée en note.
- source_word: προσλαμβανόμενοι
  choice: accueillaient
  rationale: Le participe décrit l’admission de ces personnes dans le groupe. « Accueillaient » évite la connotation militaire plus étroite d’« enrôlaient ».
- source_word: συνῆγον εἰς ἑξακισχιλίους
  choice: rassemblèrent ainsi environ six mille hommes
  rationale: La construction indique le total atteint. « Environ » convient au nombre narratif, et « hommes » explicite naturellement la composition probable de la force rassemblée, le grec employant toutefois seulement la forme masculine numérique.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: appelé aussi Maccabée
  rationale: La construction présente Maccabée comme autre nom ou surnom de Judas. La forme française traditionnelle est claire et naturelle.
theological_decisions:
- issue: Traduction de Ἰουδαϊσμός
  choice: le judaïsme
  alternative: le mode de vie juif
  rationale: « Judaïsme » est l’équivalent lexical direct et préserve la dimension à la fois religieuse et communautaire du terme. La note indique son sens contextuel sans réduire le mot à une seule de ces dimensions.
translation_notes:
  register: Français moderne, international et digne. Les phrases ont été légèrement segmentées pour rendre clairement la succession des actions, tout en préservant le mouvement narratif et la clandestinité exprimée par le grec.
