review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Judas Maccabée et les siens se déplacent clandestinement dans les villages, appellent leurs parents, accueillent ceux qui sont demeurés dans le judaïsme et réunissent un groupe de six mille. Toutefois, « hommes » ajoute une précision absente du grec : εἰς ἑξακισχιλίους donne seulement le total numérique du groupe. Il convient aussi de conserver plus clairement l''enchaînement participial : l''appel des parents et l''accueil des autres conduisent au rassemblement.'
  naturalness: Le français est moderne et fluide. « Se rendaient discrètement ... sans se faire remarquer » exprime naturellement la double idée de déplacement et de clandestinité. Une phrase unique avec des participes ou une coordination resserrée rend toutefois mieux la structure et le mouvement du récit sans nuire à la lisibilité.
  terminology: « Maccabée » et « judaïsme » sont appropriés. « Leurs proches » est possible, mais « leurs parents » rend plus directement συγγενεῖς au sens de membres de leur parenté. « Restés attachés au judaïsme » est interprétatif mais acceptable dans ce contexte ; « demeurés dans le judaïsme » est plus proche de ἐν τῷ Ἰουδαϊσμῷ et préserve l'ambiguïté entre appartenance et fidélité.
  issues:
  - severity: medium
    issue: Ajout de « hommes »
    rationale: Le grec εἰς ἑξακισχιλίους n'explicite pas le sexe des personnes réunies. Ajouter « hommes » restreint indûment le référent.
  - severity: low
    issue: « Leurs proches » est moins précis que συγγενεῖς
    rationale: « Proches » peut inclure des amis ou des relations non familiales, tandis que συγγενεῖς désigne la parenté ; « leurs parents » est plus fidèle en français courant.
  - severity: low
    issue: Segmentation qui affaiblit le lien syntaxique entre les actions et le total
    rationale: Le grec présente les actions participiales comme liées au rassemblement final. Une coordination plus compacte maintient ce rapport tout en restant naturelle.
