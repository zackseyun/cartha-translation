revisions:
- from: Mais Judas, appelé aussi Maccabée, et ses compagnons se rendaient discrètement dans les villages, sans se faire remarquer. Ils faisaient appel à leurs proches et accueillaient ceux qui étaient restés attachés au judaïsme[a]. Ils rassemblèrent ainsi environ six mille hommes.
  to: Mais Judas, appelé aussi Maccabée, et ceux qui étaient avec lui entraient secrètement dans les villages, appelaient leurs parents et, accueillant ceux qui étaient demeurés dans le judaïsme[a], rassemblèrent environ six mille personnes.
  rationale: La révision retire l'ajout non attesté « hommes », rend συγγενεῖς par « parents », et resserre la syntaxe afin de refléter l'enchaînement grec. « Environ » conserve une formulation narrative idiomatique pour le total, sans lui attribuer une précision que le contexte ne requiert pas.
