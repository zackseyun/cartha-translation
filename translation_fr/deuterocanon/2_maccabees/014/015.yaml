base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/015.yaml
  text: But when they heard of Nikanor’s advance and the attack of the Gentiles[a], they sprinkled dust upon themselves and implored the one who had established his people forever[c][b], and who always comes to the aid of his own portion with manifestation.
translation:
  language: fr
  text: Mais lorsqu’ils apprirent l’avancée de Nicanor et l’attaque des nations[a], ils se couvrirent de poussière et supplièrent celui qui avait établi son peuple pour toujours, et qui vient toujours, de manière manifeste, au secours de la part qui lui appartient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des païens » ou « des non-Juifs ». Le grec signifie littéralement « des nations » ; dans ce contexte, il désigne les peuples non juifs opposés aux Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « par une intervention manifeste ». Le grec peut évoquer une aide divine rendue clairement visible ou une manifestation divine.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: lorsqu’ils apprirent
  rationale: Le participe aoriste exprime ici la circonstance temporelle qui précède l’action principale; cette tournure est naturelle en français.
- source_word: ἔφοδον
  choice: l’avancée
  rationale: Le terme désigne un mouvement hostile. « Avancée » convient au contexte militaire et le distingue de l’attaque exprimée ensuite par ἐπίθεσιν.
- source_word: ἐπίθεσιν
  choice: l’attaque
  rationale: Traduction directe du mouvement offensif, distincte de l’avancée de Nicanor.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: « Nations » conserve le sens premier du grec et, dans ce contexte juif, désigne les peuples non juifs opposés à Israël.
- source_word: καταπασάμενοι γῆν
  choice: ils se couvrirent de poussière
  rationale: Cette formulation française naturelle rend le geste de répandre de la terre ou de la poussière sur soi en signe de détresse et de supplication.
- source_word: ἐλιτάνευσαν
  choice: supplièrent
  rationale: Le verbe exprime une requête instante; « supplièrent » en restitue clairement l’intensité.
- source_word: τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὐτοῦ λαόν
  choice: celui qui avait établi son peuple pour toujours
  rationale: « Établi » rend le sens constitutif de συστήσαντα, tandis que « pour toujours » conserve la portée durable de ἄχρι αἰῶνος.
- source_word: ἀεὶ δὲ ... ἀντιλαμβανόμενον
  choice: et qui vient toujours au secours
  rationale: Le participe présent décrit l’aide habituelle et constante de Dieu.
- source_word: μετʼ ἐπιφανείας
  choice: en manifestant sa présence
  rationale: La formule exprime une aide divine qui se rend manifeste. Cette traduction demeure intelligible sans réduire l’expression au seul sens d’une intervention visible.
- source_word: τῆς ἑαυτοῦ μερίδος
  choice: de la part qui lui appartient
  rationale: μερίς désigne une part attribuée et, ici, le peuple considéré comme la possession propre de Dieu; cette formulation conserve l’image sans employer un calque obscur.
theological_decisions:
- issue: Sens de τῶν ἐθνῶν dans le cadre juif du récit
  choice: des nations
  alternative: des païens / des non-Juifs
  rationale: « Nations » maintient l’ambiguïté lexicale du grec tout en permettant au contexte d’indiquer qu’il s’agit de peuples non juifs hostiles.
- issue: Portée de μετʼ ἐπιφανείας
  choice: en manifestant sa présence
  alternative: de manière éclatante / par une intervention manifeste
  rationale: Le choix conserve la possibilité d’une manifestation divine sans préciser indûment s’il s’agit d’une apparition personnelle ou d’une intervention rendue évidente.
- issue: Image covenantale de τῆς ἑαυτοῦ μερίδος
  choice: la part qui lui appartient
  alternative: son héritage / son propre lot
  rationale: La formulation préserve l’image du peuple comme part attribuée à Dieu, sans imposer « héritage », qui constitue une interprétation possible mais plus spécifique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure participiale descriptive du grec tout en évitant les calques difficiles. « Nicanor » suit la forme française traditionnelle du nom.
