review_pass:
  verdict: revise
  source_fidelity: La disposition d’hommes armés prêts aux emplacements stratégiques est bien rendue. Toutefois, « Puis » introduit une succession temporelle que le grec n’exprime pas explicitement, et « perfidie » peut restreindre κακουργία à la trahison, alors que le mot désigne plus largement un acte mauvais ou malveillant. La formulation révisée conserve également plus clairement l’idée qu’un tel acte pourrait provenir des ennemis.
  naturalness: Le français est globalement moderne et fluide. « Un acte malveillant » est plus neutre et plus large que « quelque perfidie », tout en restant naturel dans ce contexte. La suppression de « Puis » évite une liaison ajoutée au texte source.
  terminology: « Posta », « hommes armés », « points stratégiques » et « entretien » conviennent au registre et au contexte. « Acte malveillant » rend κακουργία sans imposer l’idée plus précise de déloyauté ou de trahison.
  issues:
  - severity: medium
    issue: « Puis » ajoute une progression temporelle explicite.
    rationale: Le grec coordonne les propositions par ponctuation, sans adverbe temporel; la traduction ne devrait pas présenter la discussion comme nécessairement postérieure au déploiement.
  - severity: medium
    issue: « Perfidie » est plus étroit que κακουργία.
    rationale: Dans ce contexte, κακουργία peut désigner un mauvais acte ou un acte malveillant de la part des ennemis, sans exiger que cet acte soit une trahison au sens strict.
  revised_text: Judas posta des hommes armés, prêts, aux points stratégiques, de peur qu’un acte malveillant ne survienne soudain de la part des ennemis. Ils eurent l’entretien qui convenait.[a]
  revised_footnotes:
  - marker: a
    text: Ou « ils s’entretinrent comme il convenait ». L’expression grecque est idiomatique et désigne un échange mutuel adapté à la circonstance.
    reason: lexical_alternative
  revision_rationale: La révision retire l’adverbe temporel non exprimé dans le grec et élargit « perfidie » en « acte malveillant », qui rend mieux l’indétermination de κακουργία. Le reste de la traduction, y compris la note sur l’expression idiomatique κοινολογίαν, est conservé.
