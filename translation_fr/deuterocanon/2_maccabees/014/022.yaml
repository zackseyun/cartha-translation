base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/022.yaml
  text: Judas stationed armed men[a], ready in strategic places, lest some treachery from the enemies should suddenly arise; and they held the fitting conference.
translation:
  language: fr
  text: Judas posta des hommes armés, prêts, aux points stratégiques, de peur qu’un acte malveillant ne survienne soudain de la part des ennemis. Ils eurent l’entretien qui convenait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils s’entretinrent comme il convenait ». L’expression grecque est idiomatique et désigne un échange mutuel adapté à la circonstance.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: posta
  rationale: Dans ce contexte militaire, le verbe désigne la disposition d’hommes en des lieux précis plutôt que le simple fait de donner un ordre.
- source_word: ἐνόπλους ἑτοίμους
  choice: des hommes armés, prêts
  rationale: Cette formulation conserve la désignation générale de personnes armées et exprime distinctement leur état de préparation, sans préciser qu’il s’agit nécessairement de soldats.
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  choice: aux points stratégiques
  rationale: Dans le cadre d’une mesure de sécurité militaire, ἐπικαίροις qualifie des emplacements avantageux ou décisifs.
- source_word: μή ποτε
  choice: de peur que… ne
  rationale: La tournure française exprime naturellement la précaution motivée par un danger éventuel.
- source_word: ἐκ τῶν πολεμίων
  choice: les ennemis ne se livrent
  rationale: La construction française transforme la source de l’acte redouté en sujet explicite, sans modifier l’identité de ses auteurs potentiels.
- source_word: ἐφνιδίως
  choice: soudain
  rationale: L’adverbe rend directement l’idée de soudaineté et, dans ce contexte, celle d’une action par surprise.
- source_word: κακουργία
  choice: quelque perfidie
  rationale: Le terme désigne ici un méfait hostile ou déloyal dans un contexte de rencontre sous tension; « perfidie » conserve cette nuance sans spécifier la forme exacte de l’acte.
- source_word: τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν
  choice: ils eurent l’entretien qui convenait
  rationale: Cette expression idiomatique rend à la fois l’échange mutuel désigné par κοινολογία et son caractère approprié à la situation.
