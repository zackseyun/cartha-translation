  terminology: « Nikanor » suit utilement la translittération grecque. « Dispositions prises » conserve l’indétermination de τὰ διεσταλμένα entre arrangements, clauses et accord. « Aucune injustice » préserve la portée morale et juridique de ἀδικέω.
