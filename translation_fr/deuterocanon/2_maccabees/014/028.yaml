base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
translation:
  language: fr
  text: Mais quand ces hommes se jetèrent devant Nikanor[a], celui-ci fut déconcerté et était contrarié à l’idée d’annuler les dispositions prises[b], alors que cet homme n’avait commis aucune injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se jeter aux pieds de Nikanor », en signe de supplication.
    reason: lexical_alternative
  - marker: b
    text: Ou « les conditions convenues » ou « l’accord conclu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  choice: vinrent se jeter devant
  rationale: Le participe de προσπίπτω évoque un mouvement physique par lequel on tombe ou se jette devant quelqu’un, souvent pour le supplier. Cette formulation conserve l’image sans rendre explicite ce que le contexte laisse implicite.
- source_word: συνεκέχυτο
  choice: fut déconcerté
  rationale: Le verbe exprime ici un trouble intérieur, une confusion ou un désarroi. « Fut déconcerté » est naturel en français moderne et convient au conflit dans lequel Nikanor se trouve placé.
- source_word: δυσφόρως ἔφερεν
  choice: supporta mal
  rationale: Cette locution signifie éprouver ou supporter quelque chose avec difficulté et déplaisir. « Supporta mal » en restitue sobrement la force idiomatique.
- source_word: τὰ διεσταλμένα
  choice: les dispositions prises
  rationale: Le participe substantivé désigne ce qui avait déjà été fixé, arrangé ou convenu. « Les dispositions prises » garde ouverte la question de savoir s’il s’agit de clauses formelles ou, plus largement, d’arrangements établis.
- source_word: ἀθετήσει
  choice: revenir sur
  rationale: Le verbe peut signifier rejeter, abolir, invalider ou ne pas respecter. Dans ce contexte relationnel, « revenir sur » exprime naturellement la répudiation des arrangements sans en préciser excessivement la forme juridique.
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  choice: alors que cet homme n’avait commis aucune injustice
  rationale: Le génitif absolu affirme que l’homme en question n’avait commis aucun tort. Cette traduction conserve la portée morale et juridique de ἀδικέω tout en limitant l’affirmation à la situation évoquée.
- source_word: Νικάνορι
  choice: Nikanor
  rationale: La forme « Nikanor » translittère directement le nom grec Νικάνωρ.
theological_decisions:
- issue: Portée de μηδὲν τἀνδρὸς ἠδικηκότος
  choice: Affirmation limitée selon laquelle cet homme n’avait commis aucune injustice
  alternative: « alors que cet homme n’avait fait de tort à personne »
  rationale: Le texte porte un jugement moral et juridique lié au cas présent. La traduction ne l’élargit pas en une déclaration générale d’innocence.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte reste accessible tout en conservant l’image corporelle de la supplication, le trouble de Nikanor et l’ambiguïté relative à la nature exacte des arrangements antérieurs.
