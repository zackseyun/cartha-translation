  yaml_path: translation/deuterocanon/2_maccabees/014/029.yaml
  text: But since it was not possible to oppose the king[a], he kept watching for an opportunity to accomplish it by a stratagem.
translation:
  language: fr
  text: Mais comme il ne pouvait s’opposer au roi, il guettait une occasion favorable pour réussir par un stratagème.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour accomplir [cela] par un stratagème ». Le grec ne précise pas l’objet du verbe « accomplir ».'
    reason: Précision sur l’objet implicite et indication d’une traduction plus formelle.
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Mais comme
  rationale: Rend à la fois la transition marquée par δέ et la valeur causale de ἐπεί dans un français naturel.
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι
  choice: s’opposer au roi
  rationale: Le datif dépend du verbe ἀντιπράσσω, qui signifie agir contre quelqu’un ou s’opposer à lui. Aucun équivalent distinct d’« ouvertement » n’est ajouté.
- source_word: οὐκ ἦν
  choice: il ne pouvait
  rationale: Cette formulation française idiomatique exprime l’impossibilité indiquée par la construction impersonnelle grecque, tout en gardant le sujet implicite du contexte.
- source_word: εὔκαιρον
  choice: le moment favorable
  rationale: L’adjectif neutre substantivé désigne le moment opportun ou favorable. Cette traduction conserve plus directement la nuance temporelle qu’« une occasion ».
- source_word: ἐτήρει
  choice: il guettait
  rationale: L’imparfait grec décrit une attente attentive et prolongée; « guettait » en rend à la fois la durée et l’intention.
- source_word: στρατηγήματι
  choice: par un stratagème
  rationale: Le terme désigne un procédé calculé ou une ruse tactique; « stratagème » en conserve la précision sans imposer une qualification morale supplémentaire.
- source_word: τοῦ ἐπιτελέσαι
  choice: pour parvenir à ses fins
  rationale: L’infinitif exprime ici le but et son objet demeure implicite. Cette tournure française naturelle laisse la nature exacte de ce qu’il voulait accomplir dépendre du contexte.
