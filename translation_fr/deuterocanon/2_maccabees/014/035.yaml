base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
translation:
  language: fr
  text: Toi, Seigneur, qui n’as besoin de rien[a], tu as bien voulu qu’un temple pour ta demeure vienne à exister parmi nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étant sans besoin de toutes choses », c’est-à-dire sans avoir besoin de quoi que ce soit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en nous ». Le grec peut avoir les deux sens ; dans ce contexte où il est question du temple, « parmi nous » paraît plus probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ὅλων ἀπροσδεὴς ὑπάρχων
  choice: qui n’as besoin de rien
  rationale: La tournure exprime naturellement en français l’absence totale de besoin. Le génitif τῶν ὅλων étend cette indépendance à toute chose; la note en donne la forme plus littérale.
- source_word: ηὐδόκησας
  choice: tu as bien voulu
  rationale: Cette expression rend à la fois le bon plaisir et la décision favorable exprimés par le verbe, dans un français actuel adapté à la prière.
- source_word: ναὸν
  choice: un temple
  rationale: Dans ce contexte, ναός désigne le sanctuaire conçu comme lieu de la présence divine; « temple » est le terme français le plus clair.
- source_word: τῆς σῆς σκηνώσεως
  choice: pour ta demeure
  rationale: La formule rend la fonction du temple comme lieu où Dieu demeure, sans introduire le vocabulaire plus marqué de la « tente » ou du « tabernacle ».
- source_word: ἐν ἡμῖν
  choice: parmi nous
  rationale: 'Avec la mention du temple, le sens collectif et local est le plus probable: le sanctuaire se trouve au milieu du peuple. Le sens possible « en nous » est conservé en note.'
- source_word: γενέσθαι
  choice: existe
  rationale: Le verbe γίνομαι signifie ici venir à l’existence ou être établi. « Existe » reste sobre et n’ajoute pas explicitement l’idée de construction, absente du grec.
theological_decisions:
- issue: L’autosuffisance divine exprimée par ἀπροσδεὴς τῶν ὅλων
  choice: qui n’as besoin de rien
  alternative: qui es indépendant de toutes choses
  rationale: La formulation affirme que Dieu n’a aucun besoin tout en maintenant qu’il a librement voulu une demeure parmi son peuple. Elle préserve ainsi la tension du texte sans la transformer en abstraction philosophique.
- issue: Le sens collectif ou intérieur de ἐν ἡμῖν
  choice: parmi nous
  alternative: en nous
  rationale: Le contexte explicite du temple favorise une présence au milieu de la communauté, mais le grec permet aussi formellement une lecture intérieure; cette possibilité est donc signalée en note.
- issue: Le rapport entre le temple et la demeure divine
  choice: un temple pour ta demeure
  alternative: un temple de ta demeure
  rationale: Le génitif grec associe étroitement le temple à la demeure de Dieu. Le français « pour ta demeure » exprime ce rapport de façon naturelle sans prétendre que Dieu aurait besoin du temple.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse directe de la prière. La phrase conserve l’opposition implicite entre l’absence de tout besoin chez Dieu et son libre choix d’avoir un temple au milieu de son peuple.
