base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
translation:
  language: fr
  text: Mais l’autre, comprenant que cet homme avait courageusement déjoué ses plans, se rendit au très grand et saint Temple[a]. Pendant que les prêtres offraient les sacrifices prescrits, il leur ordonna de lui livrer cet homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au grand et saint Temple ». Le grec emploie pour « grand » un superlatif (« le plus grand »), qui peut aussi avoir ici une valeur intensive et honorifique.
    reason: La formulation grecque permet soit un véritable superlatif, soit une description exaltée du Temple.
lexical_decisions:
- source_word: Συγνοὺς
  choice: comprenant
  rationale: Le participe aoriste exprime ici la prise de conscience qui précède l’action principale ; « comprenant » est naturel dans un récit français.
- source_word: ὁ ἕτερος
  choice: l’autre
  rationale: Le contexte identifie déjà le personnage opposé ; « l’autre » suffit en français sans ajouter un nom absent du grec.
- source_word: γενναίως ὑπὸ τοῦ ἀνδρὸς ἐστρατήγηται
  choice: que cet homme avait courageusement déjoué ses plans
  rationale: La tournure active rend naturellement en français le parfait passif grec. « Courageusement » conserve la valeur adverbiale de γενναίως, tandis que « déjoué ses plans » restitue la nuance stratégique de ἐστρατήγηται ; « ses plans » est une explicitation idiomatique minimale.
- source_word: παραγενόμενος
  choice: se rendit
  rationale: Exprime clairement le déplacement et l’arrivée au Temple dans la suite narrative.
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  choice: au très grand et saint Temple
  rationale: « Très grand » conserve la force superlative ou intensive de μέγιστον dans un français plus naturel que « le plus grand et saint Temple ». La majuscule identifie le Temple de Jérusalem.
- source_word: τῶν ἱερέων ... προσαγόντων
  choice: Pendant que les prêtres offraient
  rationale: Le génitif absolu est rendu par une proposition temporelle naturelle ; « offrir » convient au contexte sacrificiel.
- source_word: τὰς καθηκούσας θυσίας
  choice: les sacrifices prescrits
  rationale: καθηκούσας désigne ici les sacrifices requis ou dus ; « prescrits » met en valeur leur caractère cultuel réglé.
- source_word: ἐκέλευσεν παραδοῦναι τὸν ἄνδρα
  choice: il leur ordonna de lui livrer cet homme
  rationale: « Ordonner de livrer » garde la contrainte de l’ordre et le transfert de la personne recherchée. Les pronoms explicitent naturellement en français le destinataire et le bénéficiaire implicites.
theological_decisions:
- issue: Sens de ἱερόν pour le sanctuaire de Jérusalem
  choice: Temple
  alternative: sanctuaire ; enceinte du Temple
  rationale: ἱερόν peut désigner l’ensemble du complexe sacré. « Temple » est ici le terme français le plus naturel et ne tranche aucune question doctrinale sur ses différentes parties.
- issue: Force de μέγιστον appliqué au Temple
  choice: très grand
  alternative: le plus grand ; grand
  rationale: Le superlatif grec peut être strict ou fonctionner comme un intensif honorifique. « Très grand » préserve son emphase sans imposer une comparaison explicite.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est légèrement réorganisée pour éviter une longue phrase participiale et pour rendre clairement l’enchaînement des actions.
