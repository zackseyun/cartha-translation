translation:
  language: fr
  text: 'Il se rendit auprès du roi Démétrios en l’an cent cinquante et un, lui apportant une couronne d’or, une branche de palmier et, en plus de cela, ce qu’il était d’usage d’offrir : des rameaux du sanctuaire[a]. Ce jour-là, il resta tranquille[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure grecque est condensée et quelque peu elliptique. On peut aussi comprendre : « et, en plus de cela, les présents habituels provenant des rameaux du sanctuaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il eut du calme » ou « il resta tranquille ». Dans le contexte, cela peut signifier qu’il s’abstint ce jour-là de toute autre démarche ou accusation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς τὸν βασιλέα Δημήτριον
  choice: Il se rendit auprès du roi Démétrios
  rationale: Le mouvement exprimé par ἦλθεν avec πρός et l’accusatif est rendu naturellement en français par « se rendit auprès de ». La forme « Démétrios » reflète directement le nom grec.
- source_word: ὡς πρώτῳ καὶ ἑκατοστῷ καὶ πεντηκοστῷ ἔτει
  choice: en l’an cent cinquante et un
  rationale: Il s’agit d’une formule chronologique. L’emploi de ὡς ne nécessite pas ici l’ajout explicite d’une approximation.
- source_word: προσάγων αὐτῷ στέφανον χρυσοῦν
  choice: lui apportant une couronne d’or
  rationale: Le participe accompagne son arrivée et désigne ce qu’il apporte au roi. « Couronne d’or » convient au présent diplomatique ou honorifique.
- source_word: φοίνικα
  choice: une palme
  rationale: Dans ce contexte cérémoniel, φοῖνιξ désigne une branche de palmier. « Une palme » est idiomatique et digne en français.
- source_word: πρὸς δὲ τούτοις τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  choice: et, en plus de cela, les rameaux du sanctuaire qu’il était d’usage d’offrir
  rationale: La construction grecque est comprimée et elliptique. Cette formulation rattache prudemment l’idée de coutume aux rameaux tout en conservant leur lien génitif avec le sanctuaire.
- source_word: καὶ τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: Ce jour-là, il ne fit rien de plus
  rationale: L’expression idiomatique signifie qu’il resta tranquille ou s’abstint d’agir ce jour-là. La traduction contextuelle évite de suggérer qu’il garda seulement le silence verbal.
