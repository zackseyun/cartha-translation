  text: 'to Judah with letters: that he should capture Judas himself, scatter those with him, and appoint Alcimus as high priest of the greatest temple.'
translation:
  language: fr
  text: en Judée avec des lettres lui ordonnant de mettre à mort Judas lui-même, de disperser ceux qui étaient avec lui et d’établir Alcime grand prêtre du plus grand sanctuaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰούδᾳ
  choice: en Judée
  rationale: Le datif désigne ici la destination géographique de la mission; « Judée » est le nom moderne naturel de la région.
- source_word: ἐπιστολάς
  choice: avec des lettres lui ordonnant de
  rationale: Le contexte syntaxique donne aux lettres le contenu des infinitifs qui suivent; cette formulation française rend clairement leur fonction de mandat écrit.
- source_word: ἐπανελέσθαι
  choice: supprimer
  rationale: Dans ce contexte hostile, le moyen grec signifie éliminer ou mettre à mort, et non simplement capturer. « Supprimer » conserve une certaine réserve quant au procédé tout en exprimant l’issue visée.
- source_word: τοὺς δὲ σὺν αὐτῷ
  choice: ses compagnons
  rationale: Expression française naturelle pour « ceux qui étaient avec lui », sans préciser davantage leur statut.
- source_word: καταστῆσαι
  choice: établir
  rationale: Rend l’idée d’installer officiellement quelqu’un dans une charge.
- source_word: τοῦ μεγίστου ἱεροῦ
  choice: du plus grand sanctuaire
  rationale: Conserve le superlatif grec inhabituel et rend ἱερόν par « sanctuaire », terme qui englobe l’ensemble du lieu sacré.
theological_decisions:
- issue: Nature de l’action ordonnée contre Judas
  choice: supprimer Judas
  alternative: capturer Judas
  rationale: Le sens contextuel de ἐπανελέσθαι est l’élimination, probablement la mise à mort; « capturer » atténuerait indûment l’ordre.
- issue: Désignation du sanctuaire
  choice: le plus grand sanctuaire
  alternative: le grand Temple
  rationale: La traduction retenue préserve le superlatif μεγίστου sans identifier explicitement le lieu au-delà de ce que dit ce fragment.
translation_notes:
  register: Français moderne, clair et digne. Le fragment est rendu comme la suite syntaxique de la phrase précédente; aucune note n’est nécessaire.
