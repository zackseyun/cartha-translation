base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
translation:
  language: fr
  text: Mais, n’ayant pas atteint son but par ce coup, à cause de la hâte du combat[a], tandis que les foules forçaient l’entrée par les portes, il courut bravement sur la muraille et se précipita virilement[b] au milieu des foules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de l’urgence de l’affrontement ». Le grec évoque la hâte et la pression du combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « courageusement ». Le grec emploie un adverbe associé à une hardiesse conçue comme masculine.
    reason: source_nuance
lexical_decisions:
- source_word: τῇ δὲ πληγῇ μὴ κατευκτήσας
  choice: comme son coup n’avait pas atteint son but
  rationale: Le participe κατευκτήσας exprime l’accomplissement ou l’atteinte d’un objectif; avec πληγή, le contexte désigne le coup qu’il s’est porté et qui n’a pas produit le résultat recherché.
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  choice: à cause de la précipitation du combat
  rationale: ἀγών désigne ici l’affrontement violent, tandis que σπουδή évoque la hâte et la pression du moment. « Précipitation » explique naturellement pourquoi le coup a manqué son but.
- source_word: τῶν ὄχλων
  choice: les foules
  rationale: Le pluriel grec est conservé sans ajouter la nuance plus chargée de « populace » ou de « foule hostile ».
- source_word: ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  choice: se ruaient à l’intérieur des portes
  rationale: La formulation rend à la fois l’entrée énergique exprimée par εἰσβάλλω et la direction vers l’intérieur indiquée par ἔσω; θυρώματα désigne les portes ou portails de l’enceinte.
- source_word: ἀναδραμὼν γενναίως ἐπὶ τὸ τεῖχος
  choice: il courut courageusement jusqu’en haut de la muraille
  rationale: ἀνατρέχω indique une course vers le haut; τεῖχος est une muraille fortifiée. « Jusqu’en haut » rend le mouvement ascendant plus clairement que le simple « sur ».
- source_word: ἀπεκρήμνισεν ἑαυτὸν
  choice: se jeta de là
  rationale: Le verbe exprime le fait de se précipiter d’une hauteur. « De là » rend explicitement en français naturel le point de départ fourni par la muraille dans la proposition précédente.
- source_word: ἀνδρωδῶς
  choice: en homme de courage
  rationale: Cette expression préserve la coloration masculine explicite de l’adverbe, tout en restant plus naturelle en français moderne que « virilement ».
theological_decisions:
- issue: La qualification masculine ἀνδρωδῶς appliquée à son geste
  choice: en homme de courage
  alternative: courageusement
  rationale: Le grec associe explicitement la hardiesse à une manière d’agir masculine. La traduction conserve cette nuance historique sans approuver moralement le geste ni transformer le terme en affirmation doctrinale.
- issue: La nature du premier coup
  choice: son coup n’avait pas atteint son but
  alternative: sa blessure n’avait pas été mortelle
  rationale: Le grec peut évoquer le coup ou la blessure, mais il met surtout l’accent sur l’échec du résultat recherché. La formulation retenue conserve cette relative indétermination plutôt que de préciser sans nécessité la gravité médicale de la blessure.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve le mouvement rapide de l’original. « En homme de courage » maintient la nuance masculine du grec sans recourir à l’adverbe aujourd’hui marqué « virilement ».
