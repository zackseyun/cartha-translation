revisions:
- from: Mais comme son coup n’avait pas atteint son but, à cause de la précipitation du combat[a], et que les foules se ruaient à l’intérieur des portes, il courut courageusement jusqu’en haut de la muraille et se jeta de là, en homme de courage[b], au milieu des foules.
  to: Mais, n’ayant pas atteint son but par ce coup, à cause de la hâte du combat[a], tandis que les foules forçaient l’entrée par les portes, il courut bravement sur la muraille et se précipita virilement[b] au milieu des foules.
  rationale: La révision renforce le mouvement de chute exprimé par le grec, remplace une formulation française maladroite concernant les portes par un rendu idiomatique de l’irruption des foules, et conserve la nuance masculine de ἀνδρωδῶς dans une formulation plus fluide. Elle ne précise pas davantage la nature ni le résultat médical du premier coup.
