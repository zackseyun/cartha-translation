  verdict: revise
  source_fidelity: 'Le sens d’ensemble est fidèle : l’échec du premier coup, la pression du combat, l’irruption des foules, la montée sur la muraille et le geste final sont tous conservés. Toutefois, « se jeta de là » atténue la force descendante de ἀπεκρήμνισεν, et « à l’intérieur des portes » rend maladroitement ἔσω τῶν θυρωμάτων.'
  naturalness: Le français est globalement clair, mais « se ruaient à l’intérieur des portes » et l’incise « en homme de courage » sont peu naturels dans cette phrase narrative. Une formulation plus directe conserve mieux le rythme rapide du grec.
  terminology: « Muraille » rend bien τεῖχος. « Virilement » restitue explicitement la coloration masculine de ἀνδρωδῶς, avec une note qui en explicite la valeur sans caution morale. « Forçaient l’entrée par les portes » rend naturellement l’irruption exprimée par εἰσβάλλω et le passage des portes/portails.
  issues:
  - severity: medium
    issue: Rendu affaibli de ἀπεκρήμνισεν ἑαυτόν
    rationale: « Se jeta de là » ne dit pas assez explicitement qu’il se précipite vers le bas depuis une hauteur. Le verbe grec est plus énergique et implique la chute depuis la muraille.
  - severity: medium
    issue: Formulation peu idiomatique pour ἔσω τῶν θυρωμάτων εἰσβαλλόντων
    rationale: « Se ruaient à l’intérieur des portes » est lourd et ambigu en français. « Forçaient l’entrée par les portes » exprime plus naturellement le mouvement violent d’entrée au-delà des portes.
  - severity: low
    issue: « En homme de courage » est une incise peu naturelle
    rationale: L’expression préserve l’idée masculine, mais elle alourdit le mouvement narratif. « Virilement », accompagné d’une note de nuance, est plus concis et plus proche de l’adverbe grec.
