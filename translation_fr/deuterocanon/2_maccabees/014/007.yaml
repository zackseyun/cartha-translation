lexical_decisions:
- source_word: βασιλείαν
  choice: le royaume
  rationale: Dans ce contexte politique, « royaume » désigne naturellement le pouvoir royal et le territoire gouverné, sans réduire le terme à la seule royauté.
- source_word: εὐσταθείας
  choice: la stabilité
  rationale: Le nom exprime un état ferme, sûr et bien établi ; « stabilité » convient au contexte du royaume.
- source_word: τυχεῖν
  choice: parvienne à
  rationale: Avec le génitif εὐσταθείας, le verbe signifie atteindre ou obtenir un état. « Parvienne à » produit une formulation française naturelle tout en gardant l’idée d’aboutissement.
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: L’adverbe introduit ici une conséquence tirée de ce qui précède ; « C’est pourquoi » restitue clairement ce lien.
- source_word: ἀφελόμενος
  choice: ayant été privé de
  rationale: Dans le contexte de la déclaration personnelle d’Alkime, le participe exprime la dépossession subie. Cette tournure française conserve sa valeur circonstancielle sans préciser l’objet absent du fragment.
- source_word: προγονικήν
  choice: l’ancestrale
  rationale: L’adjectif féminin signifie « ancestrale » ou « héritée des ancêtres ». Il est exceptionnellement substantivé ici afin de reproduire honnêtement l’interruption du témoin sans inventer le nom féminin manquant.
