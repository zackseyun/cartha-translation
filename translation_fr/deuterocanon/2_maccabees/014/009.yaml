base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
translation:
  language: fr
  text: Puisque tu connais chacune de ces choses, ô roi, prends soin du pays et de notre peuple qui est accablé[a], conformément à la bienveillance prompte à se manifester dont tu fais preuve envers tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre peuple qui est assailli », « notre peuple qui est cerné ». Le participe grec peut évoquer le fait d’être entouré, assailli ou soumis à une forte pression.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque, rare, décrit une bienveillance facilement accessible, favorable ou prompte à se manifester envers autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα ... τούτων
  choice: chacune de ces choses
  rationale: Préserve le sens distributif de ἕκαστα avec τούτων, plutôt que de fondre les éléments en un simple « tout cela ».
- source_word: ἐπεγνωκώς
  choice: puisque tu connais
  rationale: Le participe parfait exprime une connaissance acquise et présente; cette tournure causale est naturelle en français et convient au contexte de l’appel.
- source_word: προσνοήθητι
  choice: prends soin de
  rationale: L’impératif demande au roi d’accorder une attention bienveillante au pays et au peuple; « prends soin de » restitue à la fois la considération et la sollicitude.
- source_word: χώρας
  choice: pays
  rationale: Dans cet appel politique, χώρα désigne le territoire concerné; « pays » convient au contexte et au français courant.
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  choice: notre peuple qui est accablé
  rationale: γένος désigne ici le peuple ou le groupe national. Le participe présent περιισταμένου évoque un peuple assailli, cerné par les difficultés ou soumis à une forte pression; « accablé » reste général sans préciser indûment la nature de l’épreuve.
- source_word: καθ᾽ ἣν ἔχεις ... φιλανθρωπίαν
  choice: conformément à la bienveillance ... que tu témoignes
  rationale: κατά indique la norme à laquelle l’orateur fait appel, tandis que φιλανθρωπία exprime une disposition humaine, favorable et bienveillante.
- source_word: εὐαπάντητον
  choice: toujours prête
  rationale: Cet adjectif rare qualifie une bienveillance facilement accessible, favorable ou prompte à se manifester. « toujours prête » en communique la disponibilité sans la réduire à la seule courtoisie.
- source_word: πρὸς ἅπαντας
  choice: à tous
  rationale: Exprime naturellement en français la direction universelle de la disposition du roi.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement royal suit le nombre singulier du grec sans introduire une distance absente du texte. « Ô roi » conserve l’apostrophe solennelle. Les notes préservent l’ambiguïté de περιισταμένου et la nuance inhabituelle de εὐαπάντητον.
