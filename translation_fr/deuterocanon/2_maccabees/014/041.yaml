review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le grec maintient le pluriel (« les foules ») et accumule deux verbes d’embrasement appliqués aux portes (ὑφάπτειν … φλέγειν). Le projet passe au singulier collectif et fusionne les deux verbes; cela atténue une insistance rhétorique présente dans la source. « Tourna son épée contre lui-même » interprète davantage ὑπέθηκεν ἑαυτῷ τὸ ξίφος, qui exprime plus littéralement le fait de placer/appliquer l’épée à soi.
  naturalness: La phrase révisée demeure naturelle en français international moderne. « Les foules » est un pluriel idiomatique dans un récit d’assaut, et « mettre le feu aux portes et les brûler » conserve volontairement l’intensification du grec sans devenir incompréhensible.
  terminology: « Porte de la cour », « s’emparer de la tour » et « encerclé de toutes parts » conviennent. « Appliqua l’épée contre lui-même » est sobre, plus proche du grec et ne surdétermine pas le geste. L’ajout de « Razis », identifié par le contexte immédiat, est acceptable pour lever l’ambiguïté en français.
  issues:
  - severity: medium
    issue: Le pluriel τῶν πληθῶν est rendu par le singulier « la foule ».
    rationale: Le singulier collectif français est possible, mais « les foules » préserve plus exactement le nombre et l’effet du texte source sans nuire au naturel.
  - severity: medium
    issue: Les deux verbes grecs ὑφάπτειν et φλέγειν sont réduits à « mettre le feu aux portes ».
    rationale: Même s’ils sont proches, la répétition verbale est explicite dans le grec et marque l’acharnement de l’assaut; il convient de la conserver.
  - severity: medium
    issue: « Tourna son épée contre lui-même » ne rend pas au plus près ὑπέθηκεν ἑαυτῷ τὸ ξίφος.
    rationale: « Tourner contre » décrit une orientation ou une intention; le grec décrit l’application ou la mise de l’épée à soi. Une formulation plus littérale conserve mieux l’ambiguïté du mouvement.
  revised_text: Mais, alors que les foules étaient sur le point de s’emparer de la tour, forçaient la porte de la cour et ordonnaient d’apporter du feu pour mettre le feu aux portes et les brûler, Razis, encerclé de toutes parts, appliqua l’épée contre lui-même.[a]
