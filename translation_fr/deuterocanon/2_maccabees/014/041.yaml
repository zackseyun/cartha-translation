base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
translation:
  language: fr
  text: Mais, alors que les foules étaient sur le point de s’emparer de la tour, forçaient la porte de la cour et ordonnaient d’apporter du feu pour mettre le feu aux portes et les brûler, Razis, encerclé de toutes parts, appliqua l’épée contre lui-même.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « appliqua l’épée à lui-même ». Autres traductions possibles : « se jeta sur son épée » ou « s’enfonça l’épée dans le corps ».'
    reason: La formulation grecque décrit l’action sans en préciser entièrement le mouvement.
lexical_decisions:
- source_word: τῶν ... πληθῶν
  choice: la foule
  rationale: Le pluriel grec peut désigner les gens rassemblés en masse. Le singulier collectif « la foule » est naturel en français et n’ajoute pas la nuance péjorative de « populace ».
- source_word: μελλόντων
  choice: était sur le point de
  rationale: Cette tournure exprime l’imminence de la prise de la tour, sans présenter celle-ci comme déjà accomplie.
- source_word: τὸν πύργον καταλαβέσθαι
  choice: s’emparer de la tour
  rationale: καταλαμβάνω désigne ici la prise de possession de la tour dans le cadre d’un assaut.
- source_word: τὴν αὐλαίαν θύραν
  choice: la porte de la cour
  rationale: αὐλαία qualifie ce qui appartient à la cour, et θύρα peut désigner une porte d’accès.
- source_word: βιαζομένων
  choice: forçait
  rationale: Le verbe exprime l’emploi de la force contre la porte; « forcer la porte » est idiomatique et précis.
- source_word: κελευόντων πῦρ προσάγειν
  choice: ordonnait d’apporter du feu
  rationale: La traduction conserve explicitement l’ordre de faire approcher du feu.
- source_word: τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  choice: pour mettre le feu aux portes
  rationale: Les deux expressions grecques voisines décrivent l’embrasement des portes. En français, une seule formulation évite une répétition maladroite sans ajouter une action distincte.
- source_word: περικάλυπτος γενόμενος
  choice: encerclé de toutes parts
  rationale: Dans ce contexte, l’expression indique que Razis est entièrement cerné, sans issue.
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  choice: tourna son épée contre lui-même
  rationale: Cette formulation française reste sobre et proche de l’idée d’appliquer ou de diriger l’épée contre soi, sans préciser davantage le geste que ne le fait le grec.
theological_decisions:
- issue: Description du geste par lequel Razis cherche à se donner la mort
  choice: tourna son épée contre lui-même
  alternative: se jeta sur son épée; s’enfonça l’épée dans le corps
  rationale: Le grec décrit le fait de placer ou d’appliquer l’épée contre soi sans détailler nettement le mouvement. Le choix retenu préserve cette réserve et évite aussi bien l’euphémisme que la surinterprétation mécanique.
translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Razis », fourni par le contexte immédiat, explicite le sujet en français afin d’éviter l’ambiguïté après le sujet collectif « la foule ». La phrase garde la progression rapide de l’assaut et se termine par un point, le point-virgule grec signalant ici la continuité du récit.
