  text: But when they quickly drew back[a], and a space opened up, he came into the middle of the courtyard.
translation:
  language: fr
  text: Mais, lorsqu’ils se furent rapidement écartés et qu’un espace se fut formé, il arriva au milieu de la cour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’espace ouvert ». Le terme grec peut désigner une cour ou un espace ouvert.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναποδισάντων
  choice: reculèrent
  rationale: Le verbe exprime un mouvement en arrière ou un retrait physique; « reculèrent » est naturel en français et n’ajoute pas la nuance militaire de « battirent en retraite ».
- source_word: ταχέως
  choice: rapidement
  rationale: Cet adverbe rend directement la vitesse soudaine du mouvement.
- source_word: γενομένου διαστήματος
  choice: comme un espace s’était ouvert
  rationale: Le génitif absolu indique qu’un intervalle s’est formé à la suite du recul des personnes présentes; cette tournure restitue clairement le lien circonstanciel.
- source_word: ἦλθεν κατὰ μέσον
  choice: il arriva au milieu
  rationale: La formulation conserve le verbe grec général « venir/arriver » sans préciser davantage le mode de sa chute, fourni par le contexte précédent.
- source_word: κενεῶνα
  choice: espace dégagé
  rationale: Le terme désigne un lieu vide ou ouvert. Dans ce contexte, « espace dégagé » s’accorde avec l’écartement de la foule tout en évitant d’imposer l’image architecturale d’une cour.
