  yaml_path: translation/deuterocanon/2_maccabees/014/021.yaml
  text: So they set a day on which they would come together privately; and from each side a sedan chair was brought forward[a], and seats were set out.
translation:
  language: fr
  text: Ils fixèrent donc un jour où ils se retrouveraient en privé au même endroit. De chaque côté, on apporta un siège à porteurs[a], puis on installa des sièges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec δίφραξ est rare et peut désigner une litière, une chaise à porteurs ou un autre siège transportable; la forme exacte reste incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάξαντο
  choice: ils fixèrent
  rationale: Le moyen de τάσσω exprime ici l’action de convenir d’une date ou de la fixer; « fixer un jour » est naturel en français moderne.
- source_word: κατʼ ἰδίαν
  choice: en privé
  rationale: La locution indique une rencontre à l’écart, non publique.
- source_word: ἥξουσιν εἰς τὸ αὐτό
  choice: ils se retrouveraient au même endroit
  rationale: Cette formulation conserve à la fois l’idée de rencontre et la valeur spatiale de εἰς τὸ αὐτό.
- source_word: παρʼ ἑκάστου
  choice: de chaque côté
  rationale: Dans le contexte d’une rencontre entre deux parties, ἕκαστος renvoie vraisemblablement à chacun des deux camps plutôt qu’à chaque individu.
- source_word: δίφραξ
  choice: siège à porteurs
  rationale: Ce terme rare semble désigner un siège transportable ou une litière; « siège à porteurs » reste compréhensible tout en évitant de préciser abusivement sa forme.
- source_word: ἔθεσαν δίφρους
  choice: on installa des sièges
  rationale: δίφρος peut désigner un siège, un tabouret ou une chaise; le terme générique « sièges » préserve cette indétermination.
