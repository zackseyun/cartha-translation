  text: But after three years[a], word came to those around Judas that Demetrius son of Seleucus had sailed into the harbor at Tripolis with a strong force and a fleet,
translation:
  language: fr
  text: 'Mais, après trois ans, la nouvelle parvint à ceux qui entouraient Judas : Démétrius, fils de Séleucus, était entré par mer en passant par le port de Tripolis, avec une armée puissante et une flotte.'
