lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Mais, au bout de trois ans
  rationale: μετά avec l’accusatif exprime ici le temps écoulé; δέ marque une transition légère, rendue naturellement par « Mais ».
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: ceux qui entouraient Judas apprirent
  rationale: Le verbe signifie littéralement « tomba sur », mais constitue ici un idiome signalant qu’une information parvint au groupe de Judas. Cette formulation française en transmet clairement le sens sans introduire explicitement un substantif absent du grec.
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  choice: Démétrios, fils de Séleucos
  rationale: La construction grecque article plus génitif indique la filiation. Les noms sont translittérés selon leur forme française usuelle issue du grec.
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  choice: était arrivé par mer au port de Tripoli
  rationale: Le participe εἰσπλεύσαντα désigne une arrivée en naviguant, tandis que διά avec le port peut exprimer le passage ou la voie d’entrée. La formulation française reste naturelle tout en conservant l’arrivée maritime au port situé à Tripoli.
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  choice: avec une puissante armée et une flotte
  rationale: Dans ce contexte militaire, πλῆθος désigne un corps nombreux de soldats; « armée » est plus clair en français que « multitude ». ἰσχυροῦ en souligne la puissance, et στόλος est rendu distinctement par « flotte ».
