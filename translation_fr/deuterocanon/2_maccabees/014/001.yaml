revisions:
- from: Mais, au bout de trois ans, ceux qui entouraient Judas apprirent que Démétrios, fils de Séleucos, était arrivé par mer au port de Tripoli avec une puissante armée et une flotte.
  to: 'Mais, après trois ans, la nouvelle parvint à ceux qui entouraient Judas : Démétrius, fils de Séleucus, était entré par mer en passant par le port de Tripolis, avec une armée puissante et une flotte.'
  rationale: La révision maintient le sens de l’idiome πληροφοatif (« la nouvelle parvint »), explicite sans lourdeur l’entrée maritime par le port, et emploie les formes françaises usuelles de Démétrius et de Tripolis. Aucun ajout interprétatif ou doctrinal n’est introduit.
