base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/026.yaml
  text: But Alcimus[a], perceiving the goodwill toward one another and learning of the agreements that had been made, came to Demetrius and said that Nicanor was favoring interests contrary to the state; for he had appointed Judas, the plotter against his kingdom[b], as successor.
translation:
  language: fr
  text: Mais Alcime, voyant leur bienveillance mutuelle et ayant pris connaissance des accords conclus[a], se rendit auprès de Démétrios et lui dit que Nicanor avait des vues contraires aux intérêts du royaume[b] ; car il avait désigné comme successeur Judas, qui conspirait contre le royaume de Démétrios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des conventions conclues » ; le terme grec peut désigner des accords, des arrangements ou des traités.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « pensait des choses étrangères aux affaires ». Dans ce contexte, l’expression constitue une accusation de déloyauté envers les intérêts du royaume.'
    reason: idiom_clarification
lexical_decisions:
- source_word: συνιδὼν
  choice: voyant
  rationale: Le participe exprime ici le constat lucide de la situation; « voyant » reste naturel tout en conservant la simplicité du grec.
- source_word: τὴν πρὸς ἀλλήλους εὔνοιαν
  choice: leur bienveillance mutuelle
  rationale: Cette formulation rend la disposition favorable réciproque sans surinterpréter le degré d’amitié entre les parties.
- source_word: τὰς γενομένας συνθήκας λαβὼν
  choice: ayant pris connaissance des accords conclus
  rationale: Dans ce contexte, λαβών indique qu’Alcime a reçu connaissance des accords; « accords conclus » rend clairement γενομένας συνθήκας.
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: poursuivait des intérêts étrangers aux affaires du royaume
  rationale: La formulation garde l’image grecque de ce qui est « étranger » tout en rendant intelligible l’accusation de déloyauté politique; « royaume » est fourni par le contexte monarchique.
- source_word: ἐπίβουλον τῆς βασιλείας αὐτοῦ
  choice: qui conspirait contre son royaume
  rationale: ἐπίβουλος désigne celui qui trame ou complote contre quelqu’un ou quelque chose; la relative est idiomatique en français.
- source_word: διάδοχον ἀπέδειξεν
  choice: avait désigné comme successeur
  rationale: « Désigné » rend la nomination ou la présentation officielle sans ajouter la nuance héréditaire qu’aurait « héritier ».
theological_decisions:
- issue: Portée politique de ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: « poursuivait des intérêts étrangers aux affaires du royaume »
  alternative: « pensait autrement au sujet des affaires » ou « agissait contre les intérêts de l’État »
  rationale: Le grec formule une accusation politique de manière comprimée. Le choix conserve son étrangeté métaphorique sans la réduire à une simple divergence d’opinion ni préciser excessivement la nature de la trahison.
- issue: Sens de διάδοχον appliqué à Judas
  choice: « désigné comme successeur »
  alternative: « établi comme héritier » ou « désigné comme remplaçant »
  rationale: « Successeur » correspond directement au terme grec et évite d’introduire une succession héréditaire absente du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles « Alcime », « Démétrios » et « Nicanor ». La phrase conserve la structure accusatoire du grec tout en explicitant sobrement ses idiomes politiques.
