  source_fidelity: 'Le sens général est bien rendu : Alcime constate la bonne entente et les accords, puis accuse Nicanor de tenir une ligne politiquement étrangère ou contraire aux intérêts du royaume et d’avoir désigné Judas pour la succession. Toutefois, dans « Judas, qui conspirait contre son royaume », le possessif français peut renvoyer à Nicanor, alors que αὐτοῦ renvoie à Démétrios, dont Judas menace la royauté. La référence doit être explicitée.'
  naturalness: Le français est globalement naturel et de registre narratif soutenu. « Avait des vues contraires aux intérêts du royaume » rend plus idiomatiquement l’accusation condensée ἀλλότρια φρονεῖν τῶν πραγμάτων, sans prétendre préciser la nature exacte de la déloyauté.
  terminology: Les formes Alcime, Démétrios, Nicanor et Judas conviennent. « Successeur » rend directement διάδοχος sans importer l’idée héréditaire d’« héritier ».
