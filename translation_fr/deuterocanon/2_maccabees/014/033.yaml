base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
translation:
  language: fr
  text: 'Tendant la main droite vers le Temple, il jura en ces termes : « Si vous ne me livrez pas Judas comme prisonnier, je réduirai ce sanctuaire de Dieu à une plaine, je démolirai l’autel et j’élèverai ici un temple magnifique consacré à Dionysos. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν
  choice: Tendant la main droite
  rationale: Rend concrètement le geste qui accompagne le serment; le français peut conserver l’article défini sans ajouter un possessif absent du grec.
- source_word: ἐπὶ τὸν νεών
  choice: vers le Temple
  rationale: Avec le verbe de geste, ἐπί a ici une valeur directionnelle. « Temple » désigne naturellement l’édifice sacré de Jérusalem; la majuscule contextuelle le distingue du temple païen annoncé ensuite.
- source_word: ὤμοσεν ταῦτα
  choice: il prononça ce serment
  rationale: Formulation française naturelle qui conserve l’idée explicite d’un serment introduisant les paroles suivantes.
- source_word: δέσμιον
  choice: comme prisonnier
  rationale: Préserve la valeur prédicative du terme sans imposer l’idée plus précise de chaînes matérielles.
- source_word: παραδῶτε
  choice: vous ne me livrez pas
  rationale: « Livrer » exprime clairement la remise de Judas aux mains d’un adversaire.
- source_word: τὸν τοῦ θεοῦ σηκόν
  choice: ce sanctuaire de Dieu
  rationale: « Sanctuaire » convient à σηκός et maintient une distinction lexicale avec νεώς, rendu par « Temple ».
- source_word: εἰς πεδίον ποιήσω
  choice: je réduirai … à un terrain découvert
  rationale: Conserve l’image grecque d’un édifice transformé en espace nu tout en restant idiomatique en français.
- source_word: τὸ θυσιαστήριον κατασκάψω
  choice: je démolirai l’autel
  rationale: « Autel » est l’équivalent usuel de θυσιαστήριον; « démolirai » rend ici la destruction exprimée par κατασκάπτω.
- source_word: ἱερὸν … τῷ Διονύσῳ
  choice: un temple … en l’honneur de Dionysos
  rationale: « Temple » est naturel pour un édifice cultuel consacré à Dionysos; « en l’honneur de » explicite sobrement la destination exprimée par le datif.
- source_word: ἐπιφανές
  choice: magnifique
  rationale: Rend le caractère remarquable, imposant ou prestigieux du temple projeté dans une formulation française naturelle.
theological_decisions:
- issue: Distinction des termes grecs relatifs aux espaces sacrés
  choice: νεώς est rendu par « Temple », σηκός par « sanctuaire » et ἱερόν par « temple » selon leur contexte.
  alternative: Employer uniformément « temple » pour les trois termes.
  rationale: La variation française reflète les nuances lexicales du grec sans créer une différence théologique artificielle; le contexte et la majuscule distinguent le Temple de Jérusalem du temple consacré à Dionysos.
- issue: Force de la menace εἰς πεδίον ποιήσω
  choice: Conserver l’image d’un sanctuaire réduit à un terrain découvert.
  alternative: Paraphraser par « je le raserai » ou « je le réduirai en ruines ».
  rationale: L’image concrète de l’espace rendu nu appartient au texte grec et accentue la menace de profanation et d’effacement du lieu sacré.
translation_notes:
  register: Français international moderne, digne et direct. La formulation garde la solennité menaçante du serment sans archaïsmes. « Dionysos » est la forme française courante du nom grec.
