    rationale: Cette expression désigne plus spontanément un terrain non couvert ou exposé qu’une plaine / une étendue nivelée. Elle atténue l’image de destruction complète contenue dans εἰς πεδίον ποιήσω.
  - severity: low
    issue: « il prononça ce serment » pour ὤμοσεν ταῦτα
    rationale: La formulation est possible, mais « il jura en ces termes » restitue plus directement le verbe grec et s’enchaîne plus naturellement avec la citation.
