base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: A certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
translation:
  language: fr
  text: Un certain Razis, l’un des anciens de Jérusalem, fut dénoncé[a] à Nicanor. C’était un homme dévoué à sa cité[b] et jouissant d’une excellente réputation ; en raison de sa bienveillance, on l’appelait « le père des Juifs ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut signalé ». Le verbe grec peut désigner une information transmise, mais le contexte permet le sens hostile de « dénoncé ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ami de sa cité », c’est-à-dire dévoué au bien de sa communauté civique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  choice: Razis
  rationale: Le nom propre est translittéré selon sa forme grecque usuelle en français.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Dans ce contexte, le terme désigne vraisemblablement des notables ou responsables reconnus de la communauté, plutôt que de simples hommes âgés.
- source_word: ἐμηνύθη
  choice: fut dénoncé
  rationale: Le verbe signifie que des renseignements furent transmis à Nicanor au sujet de Razis ; le contexte hostile favorise « dénoncé », sans exclure le sens plus neutre « signalé ».
- source_word: φιλοπολίτης
  choice: dévoué à sa cité
  rationale: Cette expression rend l’attachement au bien de la polis sans employer le terme potentiellement anachronique « patriote ».
- source_word: σφόδρα καλῶς ἀκούων
  choice: jouissant d’une excellente réputation
  rationale: L’expression idiomatique grecque décrit la très haute estime dont Razis bénéficiait.
- source_word: εὔνοιαν
  choice: bienveillance
  rationale: Le mot désigne une disposition favorable et généreuse, qui explique son titre honorifique.
- source_word: πατὴρ τῶν Ἰουδαίων
  choice: le père des Juifs
  rationale: La formule est conservée comme titre honorifique, sans suggérer une paternité biologique.
- source_word: προσαγορευόμενος
  choice: on l’appelait
  rationale: L’imparfait exprime naturellement en français l’appellation habituelle indiquée par le participe grec.
theological_decisions:
- issue: Description honorifique de Razis
  choice: Conserver directement les éloges civiques et communautaires du texte grec.
  alternative: Employer des formulations plus interprétatives telles que « patriote » ou « bienfaiteur de la nation ».
  rationale: Le grec présente Razis très favorablement ; la traduction maintient ce portrait sans lui ajouter une portée idéologique ou doctrinale absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe grecque très dense est répartie en deux phrases pour plus de clarté, sans perte de contenu. Les guillemets signalent que « le père des Juifs » est une appellation honorifique.
