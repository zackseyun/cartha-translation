base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/042.yaml
  text: wanting to die nobly rather than to fall into the hands of those criminals and be outrageously treated in a way unworthy of his own nobility[a].
translation:
  language: fr
  text: voulant mourir noblement plutôt que de tomber aux mains de ces criminels et de subir des outrages indignes de sa propre noblesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’être maltraité » ou « d’être humilié » ; le verbe grec peut désigner largement des traitements dégradants, et pas seulement des insultes verbales.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενῶς
  choice: noblement
  rationale: L’adverbe exprime une manière d’agir conforme à la noblesse ou à la dignité; « noblement » maintient aussi le lien lexical avec εὐγενείας.
- source_word: θέλων
  choice: voulant
  rationale: Le participe marque ici la volonté ou la résolution et s’intègre naturellement à la syntaxe fragmentaire du verset.
- source_word: ἀποθανεῖν
  choice: mourir
  rationale: Rendu direct et usuel de l’infinitif grec.
- source_word: ἤπερ
  choice: plutôt que de
  rationale: Cette locution exprime clairement la préférence entre mourir et subir les deux sorts évoqués ensuite.
- source_word: ἀλιτηρίοις
  choice: ces criminels
  rationale: Le terme désigne avec mépris des hommes coupables ou scélérats; « criminels » conserve sa forte valeur péjorative sans archaïsme.
- source_word: ὑποχείριος γενέσθαι
  choice: tomber aux mains de
  rationale: Cette expression française idiomatique rend l’idée de passer sous le pouvoir hostile d’autrui.
- source_word: τῆς ἰδίας εὐγενείας
  choice: sa propre noblesse
  rationale: Le choix préserve l’ambiguïté entre noblesse de condition et noblesse morale, ainsi que l’écho avec εὐγενῶς.
- source_word: ἀναξίως
  choice: indignes de
  rationale: La formulation relie naturellement le caractère déshonorant des outrages à sa noblesse, tout en conservant le jugement de valeur du grec.
- source_word: ὑβρισθῆναι
  choice: subir des outrages
  rationale: Le verbe peut désigner une humiliation insolente, des sévices ou des mauvais traitements; « subir des outrages » garde cette portée large et intense.
