base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/034.yaml
  text: 'After saying these things[a], he went away. But the priests, stretching out their hands toward heaven, were calling on the one who is always the champion of our nation, saying these things:'
translation:
  language: fr
  text: 'Après avoir dit cela, il s’en alla. Mais les prêtres, les mains tendues vers le ciel, invoquaient celui qui défend sans cesse notre nation[a], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui combat toujours pour notre nation » ; le terme grec désigne un défenseur qui lutte en faveur de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα δὲ εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe a ici une valeur temporelle et renvoie aux paroles précédentes ; cette formulation est naturelle en français tout en conservant l’enchaînement des actions.
- source_word: ἀπῆλθεν
  choice: il s’en alla
  rationale: Rend directement le mouvement de départ dans un registre narratif digne et courant.
- source_word: προτείναντες τὰς χεῖρας
  choice: tendirent les mains
  rationale: Conserve explicitement le geste de prière décrit par le grec, avec une coordination française fluide.
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: Exprime clairement la direction du geste sans suggérer que les mains pénètrent dans le ciel.
- source_word: ἐπεκαλοῦντο
  choice: invoquèrent
  rationale: Le verbe français convient à l’appel adressé à Dieu. Le passé simple s’intègre naturellement à la narration, sans qu’il soit nécessaire de reproduire mécaniquement l’aspect imperfectif grec.
- source_word: τὸν διὰ παντὸς ὑπέρμαχον
  choice: celui qui défend sans cesse
  rationale: ὑπέρμαχος désigne un défenseur, notamment dans un cadre de combat ; la tournure verbale reste claire et naturelle, tandis que « sans cesse » rend διὰ παντός.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: notre nation
  rationale: Préserve la dimension collective et nationale de ἔθνος dans ce contexte juif.
- source_word: ταῦτα λέγοντες
  choice: en disant
  rationale: Introduit directement la prière du verset suivant ; le complément « ceci » serait redondant et moins naturel devant les deux-points.
theological_decisions:
- issue: Description de Dieu comme τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: celui qui défend sans cesse notre nation
  alternative: le défenseur constant de notre nation ; celui qui combat toujours pour notre nation
  rationale: La formulation retenue garde la continuité exprimée par διὰ παντός et la nuance protectrice, voire martiale, de ὑπέρμαχος, sans introduire de titre doctrinal ni réduire le sens à une défense seulement juridique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit ; « invoquèrent » et « vers le ciel » restent accessibles. La répétition grecque de ταῦτα est allégée dans la seconde occurrence pour une introduction naturelle de la prière.
