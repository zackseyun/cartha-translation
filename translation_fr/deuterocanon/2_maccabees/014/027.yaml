  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
translation:
  language: fr
  text: Mais le roi entra en fureur et, exaspéré par les calomnies de cet homme profondément pervers, écrivit à Nicanor au sujet des accords[a], affirmant qu’il les supportait très mal et lui ordonnant d’envoyer sur-le-champ Maccabée à Antioche comme prisonnier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les conventions » ou « les conditions de paix ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Maccabée captif » ou « Maccabée lié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  choice: entra en fureur
  rationale: L’expression décrit le roi qui s’échauffe et se met en colère. « Entra en fureur » restitue cette montée émotionnelle avec force et naturel.
- source_word: πανπονήρου
  choice: profondément pervers
  rationale: Le composé intensifie fortement πονηρός. « Profondément pervers » conserve le jugement moral appuyé du grec sans tournure archaïque.
- source_word: διαβολαῖς
  choice: calomnies
  rationale: Dans ce contexte, le terme désigne des accusations malveillantes destinées à nuire; « calomnies » en exprime clairement la portée diffamatoire.
- source_word: ἐρεθισθεὶς
  choice: excité
  rationale: Le participe indique que les calomnies ont attisé la colère du roi. « Excité par » conserve cette relation causale, au sens d’incité ou poussé à réagir.
- source_word: συνθηκῶν
  choice: les accords
  rationale: Le pluriel grec désigne les arrangements ou conditions convenus entre les parties. « Les accords » respecte ce nombre et convient au contexte politico-militaire.
- source_word: φάσκων βαρέως φέρειν
  choice: Il lui déclara qu’il supportait très mal
  rationale: Cette formulation rend l’idiome signifiant éprouver un vif mécontentement ou prendre quelque chose très mal, tout en conservant la structure de discours rapporté.
- source_word: δέσμιον
  choice: comme prisonnier
  rationale: L’adjectif qualifie Maccabée comme captif ou détenu. « Comme prisonnier » est précis sans ajouter la présence matérielle de chaînes, que le grec n’impose pas.
- source_word: ἐξαποστέλλειν
  choice: d’envoyer
  rationale: Le verbe signifie envoyer ou expédier au loin. « Envoyer » est naturel en français, tandis que l’urgence est exprimée séparément.
- source_word: ταχέως
  choice: sur-le-champ
  rationale: Dans cet ordre royal, l’adverbe demande une exécution immédiate. « Sur-le-champ » exprime cette urgence avec un registre digne et courant.
theological_decisions:
- issue: Force du jugement moral dans πανπονήρου
  choice: cet homme profondément pervers
  alternative: cet homme tout à fait mauvais
  rationale: Le jugement moral très fort appartient explicitement au texte grec; il convient donc de le préserver sans l’atténuer ni l’amplifier par une interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La longue phrase grecque est divisée en deux phrases pour faciliter la lecture sans modifier les rapports logiques. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
