  text: He urged him to marry and have children; he married[a], settled down, and shared in common life.
translation:
  language: fr
  text: Il le pressa de se marier et d’avoir des enfants. Celui-ci se maria, s’établit et prit part à la vie commune.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prit part à la vie » ou « partagea la vie de tous ». L’expression grecque est quelque peu idiomatique et désigne probablement l’entrée dans la vie familiale et sociale ordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: encouragea
  rationale: Le verbe exprime ici une exhortation ou une vive incitation. « Encouragea » est naturel en français et convient à cette invitation à mener une vie familiale.
- source_word: γῆμαι
  choice: à se marier
  rationale: L’infinitif signifie simplement « se marier » ; cette formulation moderne évite le tour plus marqué « prendre femme ».
- source_word: παιδοποιήσασθαι
  choice: à avoir des enfants
  rationale: Le verbe désigne le fait d’engendrer une descendance. « Avoir des enfants » est idiomatique et ne durcit pas inutilement l’expression.
- source_word: ἐγάμησεν
  choice: se maria
  rationale: Traduction directe et naturelle de l’aoriste de γαμέω.
- source_word: εὐστάθησεν
  choice: s’établit
  rationale: Le verbe évoque le fait de devenir stable ou établi. Dans la séquence familiale, « s’établit » conserve ce sens sans imposer une interprétation trop précise.
- source_word: ἐκοινώνησεν βίου
  choice: prit part à la vie commune
  rationale: L’expression signifie littéralement participer ou avoir part à la vie. « Vie commune » préserve l’idée de participation à l’existence partagée, tout en laissant subsister l’indétermination de l’idiome grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « se marier » suit celle du grec. Le pronom « Celui-ci » clarifie le changement de sujet implicite après l’exhortation. La note conserve l’ambiguïté de l’expression finale.
