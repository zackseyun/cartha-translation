base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/045.yaml
  text: Yet still breathing and burning with rage[a], he rose up, though his blood was pouring out in streams and his wounds were severe, and running through the crowds, he stood upon a steep rock[b],
translation:
  language: fr
  text: Pourtant, respirant encore et brûlant de rage, il se releva, tandis que son sang jaillissait à flots[a] et que ses blessures étaient graves. Il traversa les foules en courant et se tint sur un rocher escarpé[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’adverbe grec peut aussi évoquer du sang jaillissant comme d’une source ou d’une fontaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « un rocher à pic » ou « une saillie rocheuse »; le terme grec décrit un rocher abrupt ou saillant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  choice: Pourtant, respirant encore
  rationale: ἔμπνους désigne littéralement celui qui a encore du souffle, donc qui est toujours en vie. « Respirant encore » conserve cette image physique, et « pourtant » rend la transition δέ dans ce contexte saisissant.
- source_word: πεπυρωμένος τοῖς θυμοῖς
  choice: brûlant de rage
  rationale: Le parfait passif πεπυρωμένος évoque le fait d’avoir été embrasé, ici métaphoriquement, tandis que θυμοῖς renvoie à l’emportement. Cette expression française restitue naturellement l’intensité de la colère.
- source_word: ἐξαναστὰς
  choice: il se releva
  rationale: Le participe aoriste exprime le fait de se remettre debout après sa chute et ses blessures. « Se releva » convient mieux au contexte que le simple « se leva ».
- source_word: φερομένων κρουνηδὸν τῶν αἱμάτων
  choice: tandis que son sang jaillissait à flots
  rationale: κρουνηδόν décrit un écoulement comparable à celui d’une source ou d’une fontaine. « Jaillissait à flots » garde à la fois la force et l’image sans devenir artificiel en français.
- source_word: δυσχερῶν τῶν τραυμάτων ὄντων
  choice: et que ses blessures étaient graves
  rationale: δυσχερής peut signifier pénible, difficile à supporter ou grave. Dans ce contexte corporel, « blessures graves » est clair, actuel et fidèle à leur sérieux.
- source_word: δρόμῳ τοὺς ὄχλους διελθών
  choice: Il traversa les foules en courant
  rationale: δρόμῳ marque ici la manière, « à la course », et le pluriel ὄχλους est conservé par « les foules ». La formulation française exprime directement le déplacement rapide.
- source_word: στὰς ἐπί τινος πέτρας ἀπορρώγος
  choice: se tint sur un rocher escarpé
  rationale: πέτρα désigne un rocher ou un escarpement; ἀπορρώγος suggère une masse rocheuse abrupte ou saillante. « Rocher escarpé » demeure lisible tout en préservant le relief dangereux du lieu.
