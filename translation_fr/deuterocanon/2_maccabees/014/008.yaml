lexical_decisions:
- source_word: τὴν ἀρχιερωσύνην
  choice: au sujet de la fonction de grand prêtre
  rationale: ἀρχιερωσύνη désigne la charge ou la dignité de grand prêtre. « Fonction de grand prêtre » est clair en français moderne et évite de désigner seulement la personne qui l’exerce.
- source_word: δεύτερον νῦν ἐλήλυθα
  choice: Je suis maintenant venu une seconde fois
  rationale: Cette formulation conserve à la fois la valeur temporelle de νῦν et la valeur ordinale de δεύτερον, sans réduire l’expression à un simple « je suis revenu ».
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ
  choice: des intérêts du roi
  rationale: Dans ce contexte politique, τὰ ἀνήκοντα désigne ce qui concerne le roi ou relève de ses intérêts. Cette traduction est naturelle sans préciser indûment la nature de ces affaires.
- source_word: γνησίως φρονῶν
  choice: je me préoccupe sincèrement
  rationale: γνησίως exprime la sincérité ou l’authenticité, tandis que φρονῶν indique une disposition d’esprit et une attention active. La formulation française rend les deux valeurs.
- source_word: τῶν ἰδίων πολιτῶν
  choice: mes propres concitoyens
  rationale: πολῖται signifie « concitoyens », et ἰδίων souligne qu’il s’agit des siens. La traduction conserve cette insistance sans introduire une notion ethnique absente du grec.
- source_word: στοχαζόμενος
  choice: je me soucie aussi de
  rationale: στοχάζομαι peut signifier viser, prendre en considération ou se préoccuper de quelqu’un. Ici, le verbe exprime le souci porté aux concitoyens, en parallèle avec les intérêts du roi.
- source_word: τῇ μὲν γὰρ τῶν προειρημένων
  choice: car, par la folie des hommes mentionnés plus haut…
  rationale: L’extrait grec s’interrompt au milieu d’une proposition causale qui se poursuit au verset suivant. La traduction garde donc une syntaxe ouverte et signale visuellement l’inachèvement.
