  text: 'I have now come a second time concerning the high priesthood: first[a], because I sincerely have in mind the interests of the king, and second, because I am also considering those of my own fellow citizens; for by the folly of the men mentioned before'
translation:
  language: fr
  text: 'Je suis maintenant venu une seconde fois au sujet de la fonction de grand prêtre : premièrement, parce que je me préoccupe sincèrement des intérêts du roi, et deuxièmement, parce que je me soucie aussi de mes propres concitoyens ; car, par la folie des hommes mentionnés plus haut…[a]'
