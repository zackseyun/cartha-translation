  text: Nicanor stayed on in Jerusalem and did nothing out of place[a]; and he dismissed the gathered crowds.
translation:
  language: fr
  text: Nicanor resta quelque temps à Jérusalem et ne fit rien de déplacé. Il renvoya les foules qui s’étaient rassemblées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les foules rassemblées comme un troupeau », voire « la populace rassemblée ». Le terme grec est péjoratif et présente ces gens comme une masse grégaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβεν
  choice: resta quelque temps
  rationale: L’imparfait exprime une présence qui se prolonge; cette formulation naturelle conserve l’idée qu’il demeura là durant un certain temps.
- source_word: ἔπραττεν οὐδὲν ἄτοπον
  choice: ne fit rien de déplacé
  rationale: ἄτοπος peut désigner ce qui est déplacé, inconvenant ou anormal. La traduction garde cette largeur de sens sans préciser indûment la nature d’un éventuel manquement.
- source_word: τοὺς δὲ συναχθέντας ἀγελαίους ὄχλους
  choice: les foules qui s’étaient rassemblées[a]
  rationale: La proposition relative rend naturellement le participe συναχθέντας. Le texte principal reste fluide, tandis que la note signale la nuance péjorative d’ἀγελαίους, qui compare les groupes humains à un troupeau.
- source_word: ἀπέλυσεν
  choice: dispersa
  rationale: Dans ce contexte, le verbe décrit le renvoi des foules assemblées, non la libération de prisonniers; « dispersa » exprime clairement le résultat politique et collectif.
