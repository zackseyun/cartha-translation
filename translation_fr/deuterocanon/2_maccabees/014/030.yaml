  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
translation:
  language: fr
  text: Mais Maccabée, discernant dans l’attitude de Nicanor envers lui que sa manière habituelle de le rencontrer était devenue plus rude, et comprenant que cette sévérité n’était pas pour le mieux[a], rassembla bon nombre de ses hommes et se tint caché de Nicanor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comprenant que cette sévérité ne venait pas des meilleures intentions ». L’expression grecque peut renvoyer soit aux intentions de Nicanor, soit au fait que cette sévérité ne relevait pas de la meilleure ligne de conduite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσθητήριον διεξαγαγόντος
  choice: discernant dans l’attitude de Nicanor
  rationale: La tournure grecque est difficile et décrit vraisemblablement une disposition rendue perceptible par le comportement de Nicanor. « Attitude » exprime naturellement en français ce que Maccabée observe et interprète.
- source_word: συνιδὼν
  choice: discernant
  rationale: Le participe indique une perception réfléchie plutôt qu’un simple constat visuel.
- source_word: τὰ πρὸς αὐτόν
  choice: envers lui
  rationale: Cette expression désigne l’attitude ou la conduite de Nicanor à l’égard de Maccabée.
- source_word: τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα
  choice: se montrait plus rude que lors de leurs rencontres habituelles
  rationale: Cette formulation conserve le comparatif et le cadre relationnel de la rencontre habituelle, tout en restant idiomatique en français.
- source_word: νοήσας
  choice: comprenant
  rationale: Le terme marque la conclusion que Maccabée tire du changement d’attitude observé.
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  choice: cette sévérité ne venait pas des meilleures intentions
  rationale: La traduction retient la lecture portant sur le mobile, mais signale en note l’autre possibilité idiomatique, qui porte sur l’issue ou la ligne de conduite.
- source_word: συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν
  choice: rassembla bon nombre de ses hommes
  rationale: La litote « pas peu » signifie un nombre appréciable; « bon nombre » la restitue naturellement dans le contexte militaire.
- source_word: συνεκρύπτετο τὸν Νικάνορα
  choice: se tint caché de Nicanor
  rationale: L’imparfait grec suggère une dissimulation qui se prolonge; « se tint caché » en conserve l’aspect duratif.
theological_decisions:
- issue: Ambiguïté de οὐκ ἀπὸ τοῦ βελτίστου
  choice: ne venait pas des meilleures intentions
  alternative: n’augurait rien de bon / n’était pas pour le mieux
  rationale: Le grec peut viser soit les motivations de Nicanor, soit le caractère défavorable de sa conduite ou de ses conséquences. Le texte principal choisit une lecture claire sans supprimer l’autre, conservée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Maccabée » suit la forme française traditionnelle; la syntaxe conserve la progression des perceptions et de la réaction tactique sans lourdeur excessive.
