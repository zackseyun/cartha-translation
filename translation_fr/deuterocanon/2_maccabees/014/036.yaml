  yaml_path: translation/deuterocanon/2_maccabees/014/036.yaml
  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
translation:
  language: fr
  text: Et maintenant, Seigneur, saint de toute sainteté[b], garde à jamais sans souillure cette maison[a], récemment purifiée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce Temple ». En grec, « cette maison » est une manière biblique courante de désigner le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque, inhabituelle, est littéralement proche de « saint de toute sainteté ». Elle peut aussi être comprise comme une formule intensive, par exemple « saint au-dessus de toute sainteté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε παντὸς ἁγιασμοῦ
  choice: toi qui es saint au-dessus de toute sainteté
  rationale: Le vocatif et le génitif forment une adresse intensive inhabituelle. Cette formulation française reste solennelle, intelligible et proche de l’idée d’une sainteté suprême, sans ajouter que Dieu serait explicitement la source de toute sainteté.
- source_word: κύριε
  choice: Seigneur
  rationale: Rendu français courant du titre divin κύριος dans une prière.
- source_word: διατήρησον
  choice: garde
  rationale: L’impératif demande à Dieu de préserver durablement l’état de pureté du sanctuaire.
- source_word: εἰς αἰῶνα
  choice: à jamais
  rationale: Expression idiomatique et digne pour une durée indéfinie dans le registre de la prière.
- source_word: ἀμίαντον
  choice: sans souillure
  rationale: Préserve la portée cultuelle de l’adjectif, qui qualifie la maison comme exempte de profanation ou d’impureté.
- source_word: τόνδε τὸν ... οἶκον
  choice: cette maison
  rationale: Conserve l’image biblique littérale de la « maison » pour désigner le sanctuaire; une note précise le sens contextuel.
- source_word: προσφάτως κεκαθερισμένον
  choice: récemment purifiée
  rationale: Rend à la fois la proximité temporelle indiquée par προσφάτως et l’état résultant exprimé par le parfait passif κεκαθερισμένον.
theological_decisions:
- issue: Désignation du sanctuaire par οἶκος
  choice: cette maison
  alternative: ce Temple
  rationale: Le grec dit littéralement « maison », désignation biblique habituelle du sanctuaire. La conserver respecte l’image source, tandis que la note évite toute ambiguïté.
- issue: Sens de l’adresse ἄγιε παντὸς ἁγιασμοῦ
  choice: toi qui es saint au-dessus de toute sainteté
  alternative: saint de toute sainteté; source de toute sainteté
  rationale: La construction grecque est condensée et son rapport génitif demeure inhabituel. Le choix exprime sa force intensive sans importer l’interprétation plus précise « source de toute sainteté », absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne, avec une syntaxe de prière. L’expression grecque inhabituelle sur la sainteté est rendue de façon intensive mais non dogmatiquement développée.
