review_pass:
  verdict: revise
  source_fidelity: « Éliminé » tend en français à suggérer une mise à mort ou une liquidation, alors que ἐπανελόμενον peut exprimer plus largement le fait d’écarter ou de supprimer des rivaux; « écarté » conserve mieux cette latitude. Le parfait infinitif κεκρατηκέναι est bien rendu par le plus-que-parfait « s’était rendu maître ».
  naturalness: La formulation est naturelle comme fragment dépendant du contexte précédent. La révision rend aussi sans ambiguïté le lien entre Lysias et Antiochos.
  terminology: « Pays » convient à χώρα dans ce contexte. « Tuteur » est un équivalent lexical recevable pour ἐπίτροπος; la note maintient l’alternative institutionnelle « régent ». « Antiochos » et « Lysias » sont des formes françaises usuelles.
  issues:
