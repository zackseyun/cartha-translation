  text: having gained control of the country, after overthrowing Antiochus and his guardian Lysias.
translation:
  language: fr
  text: s’était rendu maître du pays après avoir écarté Antiochos et Lysias, le tuteur d’Antiochos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lysias, le régent d’Antiochos ». Le terme grec peut désigner un tuteur, un administrateur ou, dans ce contexte, un régent.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκρατηκέναι
  choice: s’était rendu maître
  rationale: Le parfait infinitif exprime une prise de contrôle déjà accomplie. Cette tournure rend naturellement l’idée de maîtrise politique et militaire.
- source_word: τῆς χώρας
  choice: du pays
  rationale: Dans ce contexte politique, χώρα désigne le territoire ou le royaume concerné; « pays » est clair et naturel.
- source_word: ἐπανελόμενον
  choice: après avoir éliminé
  rationale: Le participe indique qu’Antiochos et Lysias ont été supprimés comme rivaux. « Éliminé » conserve une certaine latitude quant au moyen employé, tout en convenant au contexte dynastique violent.
- source_word: Ἀντίοχον
  choice: Antiochos
  rationale: Transcription française usuelle du nom grec.
- source_word: ἐπίτροπον
  choice: tuteur
  rationale: Le terme peut désigner un tuteur, un administrateur ou, dans ce cadre royal, un régent. « Tuteur » reste proche du sens lexical sans effacer la fonction politique, précisée en note.
- source_word: Λυσίαν
  choice: Lysias
  rationale: Transcription française usuelle du nom grec.
