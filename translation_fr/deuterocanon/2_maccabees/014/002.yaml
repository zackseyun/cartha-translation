    issue: « après avoir éliminé » est trop suggestif quant au moyen employé.
    rationale: Le grec ne précise pas ici le mode exact par lequel Antiochos et Lysias ont été écartés. « Écarté » garde le sens politique de ἐπανελόμενον sans imposer une lecture meurtrière.
  - severity: medium
    issue: « son tuteur Lysias » laisse grammaticalement incertain l’antécédent de « son ».
    rationale: Le possessif τούτου renvoie à Antiochos, non au sujet implicite de la proposition. Il convient de l’expliciter en français.
