lexical_decisions:
- source_word: βουλόμενος
  choice: voulant
  rationale: Le participe exprime l’intention qui motive l’action principale, sans exagérer la délibération.
- source_word: πρόδηλον ποιῆσαι
  choice: montrer ouvertement
  rationale: Cette tournure française naturelle rend l’idée de rendre manifeste ou publiquement évidente une disposition déjà présente.
- source_word: δυσμένειαν
  choice: l’hostilité
  rationale: Le terme désigne une disposition hostile ou une inimitié; « hostilité » convient au contexte politique et militaire sans la réduire à un sentiment de haine.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Rendu narratif direct et courant du verbe grec.
- source_word: στρατιώτας
  choice: soldats
  rationale: Le substantif désigne ici des militaires pris individuellement.
- source_word: ὑπὲρ τοὺς πεντακοσίους
  choice: plus de cinq cents
  rationale: Avec l’accusatif et un nombre, ὑπέρ exprime ici le dépassement numérique.
- source_word: συλλαβεῖν
  choice: pour l’arrêter
  rationale: Dans ce contexte, le verbe signifie saisir une personne afin de la placer sous garde; « arrêter » exprime naturellement cette finalité.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom renvoie à Razis, mentionné dans le contexte précédent.
