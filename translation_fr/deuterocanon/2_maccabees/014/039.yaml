  text: But Nikanor[a], wanting to make plain the hostility he had toward the Jews, sent more than five hundred soldiers to arrest him.
translation:
  language: fr
  text: Mais Nicanor, voulant montrer ouvertement l’hostilité qu’il éprouvait envers les Juifs, envoya plus de cinq cents soldats[a] pour l’arrêter.
  philosophy: optimal-equivalence
