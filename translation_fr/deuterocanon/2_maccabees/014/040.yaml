  text: For he thought that by arresting him he would bring disaster on these people[a].
translation:
  language: fr
  text: Car il pensait qu’en arrêtant cet homme, il attirerait le malheur sur ces gens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Car il lui sembla qu’en se saisissant de celui-là, il causerait une calamité à ces hommes. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: il pensait
  rationale: Dans ce contexte, le verbe exprime le jugement du sujet. « Il pensait » est naturel en français et convient à la construction infinitive.
- source_word: συλλαβών
  choice: en arrêtant
  rationale: Le participe désigne ici le fait de se saisir de quelqu’un pour le placer sous contrôle; « en arrêtant » rend clairement ce sens narratif.
- source_word: ἐκεῖνον
  choice: cet homme
  rationale: Le démonstratif renvoie avec insistance à l’individu précédemment mentionné; « cet homme » en conserve mieux la force qu’un simple pronom.
- source_word: τούτοις
  choice: sur ces gens
  rationale: Le datif désigne le groupe présent dans la scène. « Ces gens » est idiomatique et ne précise pas davantage que le contexte la composition du groupe.
- source_word: ἐνεργάσασθαι
  choice: il attirerait
  rationale: L’infinitif moyen signifie produire ou causer. Avec « le malheur sur », « attirerait » forme une expression française naturelle tout en conservant la valeur causative.
- source_word: συμφοράν
  choice: le malheur
  rationale: Le nom désigne un grave revers ou une calamité. « Le malheur » convient au registre narratif et garde l’idée de tort sérieux sans préciser sa forme.
