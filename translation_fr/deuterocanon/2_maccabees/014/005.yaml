base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
translation:
  language: fr
  text: Ce jour-là se passa dans le calme. Mais, ayant saisi une occasion qui servait sa propre folie[a], convoqué par Démétrios au conseil et interrogé sur l’attitude et le dessein des Juifs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ayant saisi une occasion comme auxiliaire de sa propre folie ». Le grec est condensé et présente métaphoriquement l’occasion comme servant son projet insensé.'
    reason: La métaphore de συνεργός est difficile à reproduire directement dans le corps du texte sans donner une tournure obscure ou artificielle.
lexical_decisions:
- source_word: τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: Ce jour-là se passa dans le calme
  rationale: L’expression grecque signifie littéralement que ce jour « eut du calme ». Cette tournure française naturelle conserve l’idée d’une journée sans trouble.
- source_word: καιρὸν δὲ λαβών
  choice: Mais il saisit une occasion
  rationale: καιρός désigne ici un moment opportun, et λαβών présente le personnage comme profitant activement de cette ouverture.
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  choice: propice à sa propre folie
  rationale: Le grec qualifie de manière condensée l’occasion de « collaboratrice » de sa folie. La formulation retenue exprime qu’elle servait son entreprise insensée sans durcir ἀνοία en pathologie mentale.
- source_word: προσκληθεὶς εἰς συνέδριον
  choice: Convoqué au conseil
  rationale: συνέδριον désigne un conseil ou une instance délibérante; « convoqué » convient au cadre officiel.
- source_word: ὑπὸ τοῦ Δημητρίου
  choice: par Démétrios
  rationale: Translittération française usuelle du nom grec Δημήτριος.
- source_word: ἐπερωτηθείς
  choice: il fut interrogé
  rationale: Le verbe désigne ici une question posée dans un cadre officiel; « interrogé » rend ce caractère plus précisément que le simple « questionné ».
- source_word: ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν
  choice: sur les dispositions et les projets
  rationale: La formulation garde distinctes la posture présente des Juifs et leurs intentions, tout en restant idiomatique en français.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Dans ce contexte, le terme désigne le peuple juif comme groupe ethnoreligieux et politique, non uniquement les habitants de la Judée.
theological_decisions:
- issue: Portée de οἱ Ἰουδαῖοι
  choice: les Juifs
  alternative: les Judéens
  rationale: Le contexte maccabéen vise ici le peuple juif dans son ensemble politique et religieux; « les Judéens » risquerait de réduire la référence à une origine géographique.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste ouverte par une virgule, conformément au texte source, qui se poursuit au verset suivant. Le pronom « il » conserve le lien contextuel avec le personnage déjà nommé.
