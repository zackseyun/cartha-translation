  text: But when the commander gave the order[a], he broke camp from there at once and joined battle with them near the village of Lessaou.
translation:
  language: fr
  text: Mais, sur l’ordre du commandant, il leva aussitôt le camp de là et engagea le combat avec eux près du village de Lessaou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « les affronta au village de Lessaou ». Le grec peut désigner plus directement un mouvement vers le village ou une action qui s’y déroule ; le verbe traduit par « engagea le combat » signifie littéralement « se mêler à » dans ce contexte militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαντος
  choice: sur l’ordre
  rationale: Le participe aoriste indique que la directive du chef déclenche immédiatement l’action; cette tournure française est naturelle et conserve le sens militaire.
- source_word: τοῦ ἡγουμένου
  choice: du commandant
  rationale: Dans ce contexte militaire, « commandant » exprime la fonction de direction sans lui attribuer une charge civile précise.
- source_word: ἀναζεύξας
  choice: il leva… le camp
  rationale: Le verbe appartient au vocabulaire militaire du départ d’un campement; « lever le camp » en rend concrètement le sens.
- source_word: συνμίσγει
  choice: engagea le combat avec eux
  rationale: Littéralement lié à l’idée de se mêler ou de se joindre, le verbe désigne ici une rencontre militaire; cette traduction rend clairement le contexte sans préciser l’issue du combat.
- source_word: ἐπὶ κώμην
  choice: près du village de
  rationale: ἐπί avec l’accusatif peut signaler un mouvement vers un lieu ou une action dans ses environs; « près du village » conserve prudemment cette souplesse contextuelle.
- source_word: Λεσσαού
  choice: Lessaou
  rationale: Translittération directe de la forme grecque du nom propre.
