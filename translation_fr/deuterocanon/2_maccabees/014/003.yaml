  yaml_path: translation/deuterocanon/2_maccabees/014/003.yaml
  text: But a certain Alcimus[a], who had formerly become high priest and had willingly defiled himself in the times of separation, realized that in no way was there safety for him, nor any longer access to the holy altar,
translation:
  language: fr
  text: Mais un certain Alcime, qui avait été grand prêtre auparavant et qui s’était volontairement souillé au temps de la séparation[a], comprit qu’il n’y avait pour lui aucun salut ni plus aucun accès au saint autel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «au temps de l’apostasie». Le grec parle littéralement des «temps de la séparation» ou de la «non-mixité»; l’expression peut désigner une période de souillure et de rupture religieuses.
    reason: Alternative lexicale permettant de préserver l’ambiguïté historique et religieuse de ἀμιξία.
lexical_decisions:
- source_word: Ἄλκιμος
  choice: Alcime
  rationale: Forme française traditionnelle et naturelle du nom grec Ἄλκιμος.
- source_word: προγεγονὼς ἀρχιερεύς
  choice: qui était devenu grand prêtre auparavant
  rationale: Cette formulation conserve la valeur verbale de γεγονώς ainsi que l’antériorité marquée par προ-.
- source_word: ἑκουσίως
  choice: volontairement
  rationale: L’adverbe indique qu’Alcime s’est souillé de son plein gré.
- source_word: μεμολυσμένος
  choice: s’était souillé
  rationale: Le plus-que-parfait rend l’acte antérieur et son résultat durable; «souillé» garde les dimensions rituelle et morale du terme.
- source_word: ἐν τοῖς τῆς ἀμιξίας χρόνοις
  choice: au temps de la séparation
  rationale: «Séparation» reste proche du sens littéral de ἀμιξία, sans imposer l’interprétation plus précise d’«apostasie».
- source_word: συννοήσας
  choice: comprit
  rationale: Le participe exprime la prise de conscience qui motive la suite; une forme verbale finie est naturelle en français.
- source_word: καθʼ ὁντιναοῦν τρόπον οὐκ ἔστιν αὐτῷ σωτηρία
  choice: qu’il n’y avait pour lui aucun moyen d’être sauvé
  rationale: La tournure restitue l’impossibilité exprimée par la locution et la négation, tout en laissant σωτηρία désigner ici le salut ou la délivrance dans la situation présente.
- source_word: πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος
  choice: qu’il n’avait plus accès au saint autel
  rationale: «Avoir accès» rend naturellement πρόσοδος, tandis que «plus» traduit ἔτι sous la portée de la négation.
theological_decisions:
- issue: Sens de ἀμιξία dans ce contexte historique et religieux
  choice: séparation
  alternative: apostasie; exclusion; refus de tout mélange
  rationale: Le grec désigne littéralement la non-mixité ou la séparation. Le contexte peut évoquer une période d’apostasie et de souillure religieuse, mais le texte principal conserve l’ambiguïté du terme et la note signale l’interprétation possible.
- issue: Portée de σωτηρία
  choice: être sauvé
  alternative: être en sécurité; trouver une délivrance
  rationale: Dans le contexte, le mot concerne probablement la préservation ou l’issue favorable d’Alcime plutôt que le salut doctrinal au sens étroit. «Être sauvé» conserve toutefois l’étendue sémantique du grec sans trancher artificiellement.
translation_notes:
  register: Français moderne, digne et accessible. La phrase demeure ouverte par une virgule parce que le verset grec se poursuit syntaxiquement. Le nom est donné sous sa forme française usuelle, «Alcime».
