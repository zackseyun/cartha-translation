revisions:
- from: Mais un certain Alcime, qui était devenu grand prêtre auparavant et qui s’était volontairement souillé au temps de la séparation[a], comprit qu’il n’y avait pour lui aucun moyen d’être sauvé et qu’il n’avait plus accès au saint autel,
  to: Mais un certain Alcime, qui avait été grand prêtre auparavant et qui s’était volontairement souillé au temps de la séparation[a], comprit qu’il n’y avait pour lui aucun salut ni plus aucun accès au saint autel,
  rationale: La révision évite de réduire σωτηρία à un salut doctrinal ou à un simple « moyen », tout en conservant son champ sémantique ouvert. Elle améliore aussi la naturalité de la désignation du statut antérieur d’Alcime et ajuste la note à la morphologie plurielle du grec.
