  text: For as long as Judas remains[a], it is impossible for affairs to attain peace.
translation:
  language: fr
  text: … une bienveillance sans égale. Car, tant que Judas est encore en vie[a], il est impossible que la situation parvienne à la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec transmis au début de cette proposition est difficile et son analyse est discutée. Dans le contexte, la clause signifie que la survie ou la présence persistante de Judas rend la paix impossible.
    reason: textual_variant
lexical_decisions:
- source_word: ἰσχρὰ
  choice: car, tant que
  rationale: 'La forme transmise est difficile et paraît corrompue ou fortement condensée. Avec περιὼν, le contexte exige une relation à la fois explicative et temporelle : la présence continue de Judas rend la paix impossible.'
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: περιὼν
  choice: reste en vie
  rationale: Le participe de περίειμι peut exprimer le fait de survivre ou de demeurer présent. « Reste en vie » rend clairement ici la survie de Judas comme obstacle politique persistant.
- source_word: ἀδύνατον
  choice: il est impossible
  rationale: Cette tournure impersonnelle restitue naturellement le prédicat grec.
- source_word: εἰρήνης
  choice: la paix
  rationale: Sens usuel du terme, sans préciser indûment s’il s’agit d’un état pacifique ou d’un accord politique.
- source_word: τυχεῖν
  choice: connaisse
  rationale: Dans l’expression française « connaître la paix », ce verbe rend idiomatiquement l’idée grecque d’obtenir ou d’atteindre la paix.
- source_word: τὰ πράγματα
  choice: la situation
  rationale: Le pluriel grec désigne ici l’ensemble des affaires ou la conjoncture politique. Le singulier collectif « la situation » est naturel en français et en conserve la portée générale.
