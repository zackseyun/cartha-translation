base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
translation:
  language: fr
  text: En effet, autrefois, il avait été poursuivi en justice pour son refus de se mêler aux autres[a], et avait risqué son corps et son âme pour le judaïsme, avec un dévouement sans réserve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans une affaire de non-association » ou « de séparation ». La formule grecque est condensée et semble relever du langage judiciaire. Elle désigne vraisemblablement le refus de se mêler à des pratiques étrangères, sans en préciser davantage la nature.'
    reason: lexical_alternative
  - marker: b
    text: Ici, le « judaïsme » ne désigne pas seulement une religion abstraite, mais aussi l’identité ancestrale et le mode de vie juifs maintenus sous la pression.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: autrefois
  rationale: Rend naturellement l’antériorité exprimée par le grec, sans tournure archaïque.
- source_word: τῆς ἀμιξίας κρίσις
  choice: quand la séparation faisait l’objet d’un procès
  rationale: La formule grecque est très condensée. « Séparation » conserve l’idée de non-mélange ou de refus des relations, tandis que « faisait l’objet d’un procès » maintient la probable dimension judiciaire de κρίσις.
- source_word: εἰσενηνεγμένος
  choice: il avait été mis en accusation
  rationale: Le participe parfait évoque ici le fait d’avoir été traduit en justice ou visé par une accusation; cette formulation française explicite sobrement le cadre judiciaire.
- source_word: Ἰουδαισμοῦ / ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: à cause du judaïsme / pour le judaïsme
  rationale: « Judaïsme » reprend directement le terme grec et conserve son ampleur historique, qui englobe identité, coutumes ancestrales et pratique religieuse.
- source_word: σῶμα καὶ ψυχὴν
  choice: son corps et son âme
  rationale: La traduction formelle garde la paire anthropologique emphatique du grec et exprime la totalité de la personne mise en danger.
- source_word: παραβεβλημένος
  choice: avait mis en péril
  rationale: Le verbe indique qu’il s’était exposé au danger; « mettre en péril » convient naturellement aux compléments « corps et âme ».
- source_word: μετὰ πάσης ἐκτενίας
  choice: avec un zèle sans réserve
  rationale: Cette expression communique l’intensité, l’application entière et l’engagement total indiqués par ἐκτένεια, sans surinterprétation.
theological_decisions:
- issue: Portée historique de Ἰουδαϊσμός
  choice: judaïsme
  alternative: mode de vie juif
  rationale: Le cognat français préserve la formulation grecque et n’enferme pas le terme dans la seule religion, la seule culture ou la seule appartenance ethnique.
- issue: Sens de ψυχή dans la paire σῶμα καὶ ψυχή
  choice: âme
  alternative: vie
  rationale: « Âme » respecte la paire lexicale explicite du grec et son effet de totalité, sans décider ici d’une anthropologie doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le caractère judiciaire et la répétition de « judaïsme », tout en signalant en note l’ambiguïté de la formule grecque relative à la séparation.
