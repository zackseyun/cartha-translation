  terminology: « Judaïsme », « corps et âme » et « pour le judaïsme » préservent utilement les termes et l’insistance du grec. « Dévouement sans réserve » exprime μετὰ πάσης ἐκτενίας sans charger le texte d’une connotation confessionnelle supplémentaire.
