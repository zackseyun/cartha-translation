  rationale: La révision restitue la fonction judiciaire de κρίσις et rattache directement la poursuite à l’ἀμιξία, sans introduire comme donnée explicite une accusation « à cause du judaïsme ». La note conserve l’ambiguïté lexicale et contextuelle de l’expression grecque. Le reste du verset maintient la répétition de « judaïsme », la paire « corps et âme » et l’intensité de l’engagement.
