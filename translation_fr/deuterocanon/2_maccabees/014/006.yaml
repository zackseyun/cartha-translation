  text: In reply he said[a], “Those among the Jews who are called Hasideans, whose leader is Judas Maccabaeus, keep feeding war and stirring up rebellion[b], not allowing
translation:
  language: fr
  text: 'Il répondit : « Ceux des Juifs que l’on appelle les Hassidéens[a], ayant à leur tête Judas Maccabée, ne cessent d’alimenter la guerre et de fomenter la révolte, sans permettre[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les soi-disant Hassidéens », si λεγόμενοι exprime ici une nuance de distance ou de mépris.'
    reason: lexical_alternative
  - marker: b
    text: La phrase grecque se poursuit au verset suivant. Ce verset se termine par « sans permettre » ; ce qui n’est pas permis n’est précisé que dans la suite.
    reason: incomplete_sentence
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Il répondit
  rationale: Cette tournure introduit une réponse à ce qui précède. « Il répondit » en restitue naturellement la fonction discursive en français.
- source_word: ἔφη
  choice: Il répondit
  rationale: Le verbe de parole est intégré à la formule introductive française sans lui ajouter une solennité absente du grec.
- source_word: Οἱ λεγόμενοι
  choice: ceux ... que l’on appelle
  rationale: Cette formulation conserve la valeur possiblement neutre de λεγόμενοι. La nuance plus distante ou dépréciative, « les soi-disant », est signalée en note.
- source_word: Ἀσιδαῖοι
  choice: Hassidéens
  rationale: Le terme désigne un groupe juif historique précis. La translittération usuelle évite d’introduire dans le texte une appréciation comme « les pieux ».
- source_word: ὧν ἀφηγεῖται
  choice: ayant à leur tête
  rationale: ἀφηγέομαι exprime ici le fait de conduire un groupe. Cette tournure française rend clairement la relation sans ajouter de titre officiel.
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Judas Maccabée
  rationale: Forme française courante du nom et du surnom historiques.
- source_word: πολεμοτροφοῦσιν
  choice: ne cessent d’alimenter la guerre
  rationale: Le choix conserve l’image vive du verbe composé, celle d’une guerre que l’on nourrit ou entretient, tout en produisant une phrase française naturelle.
- source_word: στασιάζουσιν
  choice: fomenter la révolte
  rationale: Le verbe évoque la sédition, les troubles de faction ou la rébellion. « Fomenter la révolte » exprime cette action dans un français accessible.
- source_word: οὐκ ἐῶντες
  choice: sans permettre
  rationale: Le participe exprime le refus de permettre quelque chose. Comme son complément ne vient que dans la suite de la phrase, la traduction demeure intentionnellement suspendue.
theological_decisions:
- issue: Nom du groupe Ἀσιδαῖοι
  choice: Hassidéens
  alternative: les pieux ; Assidéens
  rationale: Le mot fonctionne comme le nom d’un groupe historique. Le translittérer préserve cette précision et évite de transformer son nom en jugement favorable.
- issue: Nuance de Οἱ λεγόμενοι
  choice: ceux ... que l’on appelle
  alternative: les soi-disant
  rationale: Le participe peut être neutre ou marquer une certaine distance. Le contexte ne suffit pas à imposer la nuance dépréciative dans le texte principal ; celle-ci est donc conservée en note.
translation_notes:
  register: Français moderne, courant et digne. La métaphore d’« alimenter la guerre » est conservée. La fin suspendue respecte exactement la limite du verset et la syntaxe grecque, sans fournir prématurément le complément absent.
