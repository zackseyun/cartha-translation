base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/012.yaml
  text: And he immediately selected Nikanor[a], who had become commander of the elephants, and appointed him general over Judea, and sent him out.
translation:
  language: fr
  text: Il choisit aussitôt Nicanor, qui avait été commandant des éléphants, le nomma stratège de la Judée[a] et l’envoya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « général en Judée » ou « gouverneur militaire de la Judée ». Le titre grec peut désigner soit un commandant militaire, soit un responsable régional; ici, la fonction pouvait réunir ces deux aspects.
    reason: lexical_alternative
lexical_decisions:
- source_word: προχειρισάμενος
  choice: choisit
  rationale: Le participe exprime ici le choix d’un homme pour une mission; « choisit » évite de répéter l’idée de nomination portée ensuite par ἀναδείξας.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Rend clairement et naturellement la promptitude de l’action.
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  choice: qui avait été commandant des éléphants
  rationale: ἐλεφαντάρχης désigne l’officier responsable des éléphants de guerre; le plus-que-parfait situe cette fonction avant la nouvelle nomination sans affirmer qu’elle était encore en cours.
- source_word: στρατηγὸν
  choice: stratège
  rationale: Ce titre grec peut désigner un chef militaire aussi bien qu’un gouverneur régional doté de pouvoirs militaires; le calque français, attesté dans le vocabulaire historique, préserve cette amplitude.
- source_word: ἀναδείξας
  choice: nomma
  rationale: Le verbe indique la désignation officielle à une charge.
- source_word: ἐξαπέστειλεν
  choice: l’envoya
  rationale: Rend naturellement l’envoi en mission; en français, « envoya au loin » ou « dépêcha » ajouterait une nuance que le contexte immédiat n’exige pas.
