- from: Cependant, lorsque Nicanor apprit la vaillance des hommes qui entouraient Judas et leur courage dans les combats pour leur patrie, il hésita à trancher le différend dans le sang.[a]
  to: Toutefois, en apprenant la vaillance de ceux qui étaient avec Judas et leur courage dans les combats pour leur patrie, Nicanor se montrait réticent à régler le différend par le sang versé.[a]
