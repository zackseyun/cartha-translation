    issue: Aspect et nuance de ὑπευλαβεῖτο
    rationale: Le verbe est à l’imparfait et exprime ici une retenue ou une réticence. « Il hésita » présente plus facilement un acte ponctuel d’indécision.
  - severity: low
    issue: Rendu de διʼ αἵματος
    rationale: « Dans le sang » est possible, mais reste plus imagé et moins explicite quant au moyen. « Par le sang versé » garde l’ambiguïté de κρίσις tout en exprimant clairement l’idée de régler l’affaire par la violence meurtrière.
  - severity: low
    issue: Formulation d’une alternative dans la note
    rationale: « Rendre le jugement dans le sang » n’est pas idiomatique en français moderne. Une formulation avec « décider de l’affaire par le sang versé » est plus claire et reste proche du grec.
