  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
translation:
  language: fr
  text: Toutefois, en apprenant la vaillance de ceux qui étaient avec Judas et leur courage dans les combats pour leur patrie, Nicanor se montrait réticent à régler le différend par le sang versé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à décider de l’affaire par le sang versé » ou « à prononcer un jugement par le sang versé ». L’expression grecque peut évoquer la décision, le jugement ou le règlement du conflit au moyen de la violence meurtrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως δὲ
  choice: Cependant
  rationale: Marque naturellement en français le tournant concessif par rapport au contexte précédent.
- source_word: ἀκούων
  choice: lorsque ... apprit
  rationale: Le participe circonstanciel est rendu par une proposition temporelle fluide; « apprit » convient ici à une information reçue sur leur réputation.
- source_word: ἀνδραγαθίαν
  choice: vaillance
  rationale: Exprime la bravoure éprouvée, notamment guerrière, sans reproduire artificiellement l’étymologie masculine du grec.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: les hommes qui entouraient Judas
  rationale: Rend l’idiome désignant le groupe associé à Judas, tout en restant naturel et proche du grec.
- source_word: ἐν τοῖς περὶ τῆς πατρίδος ἀγῶσιν
  choice: dans les combats pour leur patrie
  rationale: Le contexte est militaire; « combats » rend clairement ἀγῶσιν, et « patrie » conserve la tonalité affective et collective de πατρίς.
- source_word: εὐψυχίαν
  choice: courage
  rationale: Équivalent français actuel et direct de la fermeté d’âme ou de la bravoure exprimée par le terme.
- source_word: ὑπευλαβεῖτο
  choice: il hésita
  rationale: Traduit la réserve prudente et la réticence du verbe sans lui attribuer explicitement de la peur.
- source_word: τὴν κρίσιν διʼ αἵματος ποιήσασθαι
  choice: à trancher le différend dans le sang
  rationale: Rend l’expression grecque de façon idiomatique en conservant à la fois l’idée de décision ou de règlement et celle d’une issue sanglante.
