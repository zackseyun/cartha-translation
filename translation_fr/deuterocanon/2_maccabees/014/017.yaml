  text: But Simon[a], the brother of Judas, had come to terms with Nicanor[c][b], though reluctantly, having stumbled because of the sudden speechlessness of his opponents.
translation:
  language: fr
  text: Mais Simon, le frère de Judas, avait engagé le combat contre Nicanor[a], mais il avait subi un léger revers à cause de la soudaine absence de parole de ses adversaires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’était mesuré à Nicanor ». Dans ce contexte militaire, le grec désigne vraisemblablement l’engagement du combat.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est difficile. Littéralement : « à cause de la soudaine absence de parole des adversaires ». Le terme peut désigner l’incapacité de parler, le silence, ou une stupeur qui laisse sans voix. « Un léger revers » rend l’adverbe grec, qui peut avoir ici le sens de « quelque peu » plutôt que son sens ordinaire de « lentement ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: συμβεβληκὼς ἦν τῷ Νικάνορι
  choice: avait affronté Nicanor
  rationale: Dans ce contexte narratif et avec le datif de la personne, συμβάλλω peut désigner une rencontre ou un engagement hostile. « Avait affronté » conserve une certaine latitude sans imposer l’idée d’un traité, que le grec n’exprime pas clairement ici.
- source_word: βραδέως
  choice: avait tardé
  rationale: Le sens premier est « lentement ». La formulation française rattache cette lenteur au revers exprimé par le participe suivant, conformément à l’ordre et à la syntaxe du grec, sans la transformer en réticence envers un accord supposé.
- source_word: ἐπταικώς
  choice: subi un revers
  rationale: πταίω signifie littéralement « trébucher », puis, au figuré, échouer ou connaître un revers. Dans un contexte d’affrontement, « subir un revers » rend naturellement la valeur figurée sans suggérer une faute morale.
- source_word: ἐφνίδιον ... ἀφασίαν
  choice: le désarroi soudain
  rationale: ἀφασία désigne littéralement l’impossibilité de parler ou la stupeur qui laisse sans voix. « Désarroi » donne ici un sens narratif possible tout en signalant en note le caractère difficile et inhabituel de l’expression.
- source_word: τῶν ἀντιπάλων
  choice: de ses adversaires
  rationale: ἀντίπαλοι désigne ceux du camp opposé. « Ses adversaires » est précis, courant et adapté au contexte de confrontation.
