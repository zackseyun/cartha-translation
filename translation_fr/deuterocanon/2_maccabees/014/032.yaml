  text: Mais comme ils affirmaient sous serment ne pas savoir où se trouvait celui qui était recherché,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « où se trouve celui qui est recherché ». Le grec emploie un participe passif substantivé et le présent dans le discours rapporté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... φασκόντων
  choice: comme ils affirmaient
  rationale: Le génitif absolu introduit la circonstance accompagnant la suite du récit. « Comme ils affirmaient » rend la valeur circonstancielle sans faire disparaître le verbe de déclaration.
- source_word: μεθʼ ὅρκων
  choice: sous serment
  rationale: Littéralement « avec des serments ». « Sous serment » est naturel en français et conserve la solennité de leurs affirmations sans imposer nécessairement un cadre judiciaire formel.
- source_word: μὴ γινώσκειν
  choice: ne pas savoir
  rationale: L’infinitif donne le contenu de leur affirmation et se construit naturellement en français après « affirmaient ».
- source_word: ποῦ ποτʼ ἐστίν
  choice: où se trouvait
  rationale: Le grec a littéralement « où il est », avec ποτε ajoutant une nuance indéfinie ou insistante. L’imparfait français convient au discours indirect régi par un verbe au passé; la variante littérale est signalée en note.
- source_word: ὁ ζητούμενος
  choice: celui qu’il recherchait
  rationale: Le participe substantivé signifie « celui qui est recherché ». Le contexte identifie Nicânor comme l’auteur de la recherche; la tournure active est naturelle en français et évite la lourdeur de « celui qui était recherché ».
