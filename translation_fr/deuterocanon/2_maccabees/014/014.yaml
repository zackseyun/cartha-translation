base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
translation:
  language: fr
  text: Mais ceux qui, en Judée, avaient chassé Judas rassemblaient en foule des gens des nations autour de Nicanor[a], pensant que les revers et les malheurs des Juifs leur apporteraient la prospérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre analyse de la construction condensée : « se joignaient en foule à Nicanor avec les nations ». Le grec ἔθνη signifie « nations » et peut, dans ce contexte juif, désigner les non-Juifs.'
    reason: La relation syntaxique entre ἔθνη (« nations »), συνέμιγνυν (« mêlaient, associaient ») et le datif « à Nicanor » est discutée. La note préserve l’ambiguïté sans imposer dans le texte principal une identité ethnique plus étroite.
lexical_decisions:
- source_word: οἱ ... ἐπὶ τῆς Ἰουδαίας πεφυγαδευκότες τὸν Ἰούδαν
  choice: ceux qui, en Judée, avaient chassé Judas
  rationale: Le parfait causatif de φυγαδεύω indique qu’ils avaient contraint Judas à fuir ou à partir. « Chassé » restitue cette force sans préciser au-delà du grec s’il s’agissait d’une expulsion officielle ou d’une fuite militaire. ἐπὶ τῆς Ἰουδαίας situe leur action en Judée.
- source_word: ἔθνη συνέμιγνυν ἀγεληδὸν τῷ Νικάνορι
  choice: se joignaient en masse à Nicanor avec les gens des nations[a]
  rationale: συνέμιγνυν exprime l’idée de se mêler ou de se joindre, tandis que ἀγεληδόν évoque un mouvement collectif massif. La construction avec ἔθνη et le datif τῷ Νικάνορι est condensée et admet plusieurs analyses; la formulation choisie reste naturelle tout en laissant cette relation ouverte.
- source_word: ἀτυχίας καὶ συμφοράς
  choice: les revers et les malheurs
  rationale: Les deux noms accumulent les idées de mauvaise fortune et de calamité. « Revers » et « malheurs » conservent la distinction sans alourdir le français.
- source_word: ἰδίας εὐημερίας
  choice: leur propre prospérité
  rationale: εὐημερία désigne la prospérité ou une situation florissante. « Leur propre » maintient explicitement l’opposition intéressée entre le malheur des Juifs et l’avantage espéré par leurs adversaires.
- source_word: δοκοῦντες ἔσεσθαι
  choice: pensant que ... feraient
  rationale: Le participe suivi de l’infinitif futur exprime leur attente. En français, « pensant que ... feraient leur propre prospérité » transmet naturellement l’idée que les malheurs des Juifs deviendraient la source de leur réussite.
theological_decisions:
- issue: Sens de ἔθνη dans ce contexte juif et construction avec συνέμιγνυν
  choice: les gens des nations, associés à ceux qui rejoignent Nicanor
  alternative: « ralliaient en masse les nations à Nicanor » ou « se joignaient en masse à Nicanor, venant des nations »
  rationale: ἔθνη peut désigner les nations en général ou les non-Juifs. La syntaxe grecque est assez comprimée pour ne pas déterminer avec certitude si les nations accompagnent le ralliement, en sont l’objet, ou précisent l’origine du groupe. Le texte principal évite d’imposer une identité ethnique plus précise que la source, et la note signale l’autre analyse grammaticale importante.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « En masse » conserve l’image collective de ἀγεληδόν sans employer le dépréciatif trop marqué « en troupeaux ». La phrase garde l’opposition rhétorique entre les malheurs des Juifs et la prospérité recherchée par leurs adversaires.
