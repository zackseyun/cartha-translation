  yaml_path: translation/deuterocanon/2_maccabees/014/024.yaml
  text: And he kept Judas continually before him[b][a]; he was inwardly drawn to the man.
translation:
  language: fr
  text: Il gardait constamment Judas auprès de lui[a] ; il était intérieurement attaché à cet homme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il avait toujours Judas en sa présence ». L’expression grecque peut évoquer aussi bien le fait de garder quelqu’un physiquement près de soi que celui de le maintenir constamment devant son attention.
    reason: lexical_alternative
  - marker: b
    text: Ou « il était intérieurement favorable à cet homme » ou « il éprouvait une profonde affection pour cet homme ». L’adverbe et le verbe grecs expriment ensemble une inclination intérieure bien établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχεν ... ἐν προσώπῳ
  choice: gardait ... auprès de lui
  rationale: L’expression évoque littéralement le fait d’avoir quelqu’un devant sa face, donc en sa présence, tout en pouvant suggérer qu’on le garde constamment à l’esprit ou sous son attention. « Gardait ... auprès de lui » est naturel en français et conserve d’abord l’image d’une proximité personnelle.
- source_word: διὰ παντός
  choice: constamment
  rationale: Cette locution marque la continuité ou la répétition régulière. « Constamment » convient au registre narratif sans imposer une lecture mécaniquement absolue.
- source_word: ψυχικῶς
  choice: au fond de lui
  rationale: Cet adverbe rare, formé sur ψυχή, décrit ici une disposition intérieure. « Au fond de lui » en restitue l’intériorité dans un français actuel, sans transformer le terme en simple intensif.
- source_word: προσεκέκλιτο
  choice: s’était attaché à
  rationale: La forme au plus-que-parfait exprime une inclination favorable déjà établie. « S’était attaché à » rend cette disposition durable, sans en faire une alliance officielle.
- source_word: τῷ ἀνδρί
  choice: à cet homme
  rationale: Le datif désigne l’objet de l’inclination. « À cet homme » reprend la désignation explicite de Judas et en conserve la légère insistance.
