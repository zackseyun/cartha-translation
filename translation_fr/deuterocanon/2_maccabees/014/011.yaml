  yaml_path: translation/deuterocanon/2_maccabees/014/011.yaml
  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
translation:
  language: fr
  text: Après que cet homme eut tenu de tels propos, les autres Amis[a], qui éprouvaient une certaine hostilité envers Judas, poussèrent aussitôt Démétrios encore davantage contre lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les autres amis ». Dans ce contexte, les « Amis » sont probablement des courtisans portant un titre officiel à la cour royale.'
    reason: cultural_note
  - marker: b
    text: Le verbe grec est rare. Il peut signifier qu’ils excitèrent davantage Démétrios, le dressèrent contre Judas ou accrurent son hostilité envers lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτων δὲ ῥηθέντων ὑπὸ τούτου
  choice: Après que cet homme eut tenu de tels propos
  rationale: Le génitif absolu situe l’action dans le temps. Cette formulation française naturelle conserve le renvoi légèrement distancié de τούτου à l’orateur précédent.
- source_word: θᾶττον
  choice: aussitôt
  rationale: L’adverbe exprime ici la promptitude de la réaction et se rattache naturellement au verbe principal.
- source_word: οἱ λοιποὶ φίλοι
  choice: les autres Amis
  rationale: Dans le contexte de la cour séleucide, φίλοι désigne probablement les membres d’un cercle royal portant le titre d’« Amis ». La majuscule signale ce sens institutionnel probable sans l’imposer silencieusement.
- source_word: δυσμενῶς ἔχοντες τι πρὸς τὸν Ἰούδαν
  choice: qui éprouvaient une certaine hostilité envers Judas
  rationale: L’expression indique une disposition défavorable dirigée contre Judas, tandis que τι en atténue ou en indétermine la mesure.
- source_word: προετετύρωμαν τὸν Δημήτριον
  choice: poussèrent Démétrios encore davantage contre lui
  rationale: Le verbe rare paraît décrire une aggravation de l’hostilité ou une incitation supplémentaire. La traduction garde ce mouvement sans préciser indûment s’il s’agit de colère, de préjugé ou d’aigreur.
