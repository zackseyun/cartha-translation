  text: But he suddenly fell to the ground and was enveloped in deep darkness[a]; and they picked him up and put him on a stretcher,
translation:
  language: fr
  text: Mais il tomba soudain à terre[a] et fut enveloppé d’épaisses ténèbres. On le souleva et le plaça sur une civière,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le texte grec de Swete, γῆν (« terre ») est répété trois fois. Il s’agit presque certainement d’une répétition de copiste ou de transcription ; la traduction retient le sens clair de l’expression : « à terre ».'
    reason: textual_variant
lexical_decisions:
- source_word: αἴφνω
  choice: soudain
  rationale: L’adverbe marque le caractère brusque et inattendu de la chute; « soudain » est naturel et fidèle.
- source_word: πεσόντα πρὸς τὴν γῆν
  choice: il tomba à terre
  rationale: Cette tournure française rend naturellement le mouvement de chute exprimé par le participe aoriste et la préposition πρός.
- source_word: πολλῷ σκότει
  choice: d’épaisses ténèbres
  rationale: La formule exprime une obscurité intense; « épaisses ténèbres » conserve la force de l’image dans un registre digne et courant.
- source_word: περιχυθέντα
  choice: fut enveloppé
  rationale: Le passif évoque quelque chose répandu tout autour de lui; « enveloppé » préserve cette image sans la surinterpréter.
- source_word: συναρπάσαντες
  choice: on le souleva
  rationale: Dans le contexte, le verbe décrit l’action de le prendre rapidement après sa chute; « souleva » convient à l’enchaînement avec sa mise sur une civière, sans la dureté possible de « saisir ».
- source_word: φορεῖον
  choice: civière
  rationale: Le terme désigne un dispositif servant à transporter une personne incapable de marcher; « civière » est l’équivalent moderne le plus clair.
- source_word: ἐνθέντες
  choice: le plaça sur
  rationale: Le participe signifie ici mettre ou déposer la personne sur le dispositif de transport; cette formulation est naturelle en français.
