  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
translation:
  language: fr
  text: Quant à Héliodore, après avoir offert un sacrifice à Dieu et fait de très grands vœux[a] à celui qui lui avait conservé la vie, il prit congé d’Onias[b], puis reprit la route[c] vers le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « adressé de très grandes prières » : le mot grec peut désigner des prières ou des vœux; le contexte du sacrifice favorise ici « vœux ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « salué Onias ». Le verbe grec peut aussi signifier « recevoir » ou « accueillir », mais le contexte du départ favorise le sens de prendre congé.
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe grec a une nuance militaire : il peut évoquer le fait de lever le camp ou de repartir en marche.'
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων
  choice: après avoir offert un sacrifice
  rationale: Le participe aoriste avec θυσίαν désigne l’offrande d’un sacrifice; cette formulation française restitue naturellement la succession des actions.
- source_word: εὐχὰς μεγίστας εὐξάμενος
  choice: fait de très grands vœux
  rationale: εὐχή peut désigner une prière ou un vœu. Le contexte sacrificiel favorise « vœux », tandis que « très grands » conserve la force de μεγίστας sans surtraduire le superlatif.
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  choice: à celui qui lui avait conservé la vie
  rationale: Le participe substantivé renvoie à Dieu, déjà nommé, comme à celui qui a assuré à Héliodore la continuation de sa vie après son péril mortel.
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  choice: il prit congé d’Onias
  rationale: ἀποδέχομαι possède plusieurs sens, dont recevoir, accueillir ou prendre congé. Le départ immédiat d’Héliodore rend ici le sens de prise de congé le plus cohérent.
- source_word: ἀνεστρατοπέδευσεν πρὸς τὸν βασιλέα
  choice: puis reprit la route vers le roi
  rationale: Le verbe a une coloration militaire et peut évoquer le fait de lever le camp ou de repartir. « Reprit la route » reste naturel tout en gardant davantage cette nuance que le simple « retourna ».
theological_decisions:
- issue: Référent de « celui qui lui avait conservé la vie »
  choice: La formule renvoie à Dieu comme celui qui a préservé la vie d’Héliodore.
  alternative: « celui qui lui avait accordé la vie », compris plus généralement comme le don de la vie
  rationale: La syntaxe rattache la formule à « Dieu », et le contexte immédiat de délivrance d’une mort imminente favorise l’idée de conservation de la vie, sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la séquence narrative des participes grecs sans lourdeur. « Quant à Héliodore » marque le contraste de δέ; « reprit la route » préserve discrètement la coloration militaire du dernier verbe.
