  yaml_path: translation/deuterocanon/2_maccabees/003/026.yaml
  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
translation:
  language: fr
  text: Mais deux autres jeunes hommes lui apparurent, remarquables par leur force, d’une beauté exceptionnelle à voir et resplendissants par leur tenue. Se tenant de part et d’autre de lui, ils le fouettaient sans relâche, lui infligeant de nombreux coups.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  choice: Mais deux autres
  rationale: ἕτεροι δύο désigne deux personnages supplémentaires, distincts du cavalier déjà mentionné ; δέ marque ici une légère transition narrative.
- source_word: ἐφάνησαν αὐτῷ
  choice: lui apparurent
  rationale: Le verbe a ici son sens intransitif courant, « apparaître », et le datif αὐτῷ est conservé par « lui ».
- source_word: νεανίαι
  choice: jeunes hommes
  rationale: Le terme désigne des hommes jeunes sans les identifier explicitement comme des anges ni leur attribuer un rôle militaire.
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς
  choice: remarquables par leur force
  rationale: ῥώμη évoque la force ou la vigueur physique, tandis que ἐκπρεπής indique ce qui se distingue nettement.
- source_word: κάλλιστοι δὲ τὴν δόξαν
  choice: d’une très grande beauté par leur apparence
  rationale: Le superlatif κάλλιστοι exprime une beauté exceptionnelle. Dans cette description visible, δόξα renvoie à l’apparence ou à la prestance, tout en gardant une nuance possible d’éclat.
- source_word: διαπρεπεῖς δὲ τὴν περιβολήν
  choice: resplendissants par leur tenue
  rationale: περιβολή désigne les vêtements ou la tenue ; διαπρεπής souligne leur caractère remarquable et splendide.
- source_word: οἵ καὶ παραστάντες ἐξ ἑκατέρου μέρους
  choice: Se tenant de part et d’autre de lui
  rationale: Le participe est rendu par une proposition participiale naturelle en français ; ἐξ ἑκατέρου μέρους signifie qu’ils se placent chacun d’un côté.
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  choice: ils le fouettaient sans relâche
  rationale: L’imparfait grec exprime une action prolongée ; μαστιγόω signifie fouetter ou flageller, et ἀδιαλείπτως indique qu’elle ne s’interrompt pas.
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  choice: lui infligeant de nombreux coups
  rationale: Le participe précise la manière dont ils le fouettent ; πληγαί désigne des coups, et ἐπιρρίπτω exprime ici le fait de les porter ou de les infliger.
theological_decisions:
- issue: Nature des personnages apparus
  choice: Les désigner comme « deux autres jeunes hommes »
  alternative: « deux anges » ou « deux êtres célestes »
  rationale: Le grec les appelle νεανίαι et décrit leur force, leur beauté et leur tenue, sans les identifier explicitement comme des anges dans ce verset. La traduction préserve cette retenue narrative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche de la progression grecque tout en évitant les tournures artificielles ; « fouettaient sans relâche » restitue clairement la durée et la violence de l’action.
