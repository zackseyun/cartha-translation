  verdict: revise
  source_fidelity: 'Le sens grec est globalement bien rendu : les deux personnages restent simplement des « jeunes hommes », leur force, leur beauté visible, leur tenue éclatante, leur position de part et d’autre d’Héliodore et le caractère continu de la flagellation sont tous préservés. La formulation de la beauté doit toutefois être ajustée : « par leur apparence » est peu idiomatique et peut donner à entendre une relation causale absente du grec.'
  naturalness: « D’une très grande beauté par leur apparence » est lourd et non naturel en français moderne. « D’une beauté exceptionnelle à voir » rend de façon fluide la beauté superlative et son caractère visible. Le reste du verset est clair, soutenu et accessible.
  terminology: « Jeunes hommes » respecte νεανίαι sans imposer une identification angélique. « Fouettaient sans relâche » restitue adéquatement μαστιγόω, l’imparfait et ἀδιαλείπτως. « Tenue » convient à περιβολή, et « resplendissants » exprime bien διαπρεπεῖς.
