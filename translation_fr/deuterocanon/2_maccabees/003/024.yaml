base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
translation:
  language: fr
  text: Mais alors qu’il se trouvait déjà là, à la salle du trésor, avec ses gardes[a], le Souverain des esprits et de toute autorité fit une grande manifestation[b], de sorte que tous ceux qui avaient osé venir[c], frappés de stupeur devant la puissance de Dieu, furent réduits à l’abattement et à la peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « porteurs de lance » ; il s’agit ici des hommes de son escorte armée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « provoqua une grande apparition ». Le grec souligne une intervention divine qui se manifeste de manière saisissante, sans en préciser ici la forme.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui avaient osé se rassembler ». Dans ce contexte, l’expression peut évoquer leur venue sur les lieux, sans désigner explicitement leur entrée dans la salle du trésor.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι
  choice: sur place
  rationale: Renvoie naturellement au lieu mentionné dans le récit et conserve la valeur locale de l’adverbe.
- source_word: δορυφόροις
  choice: gardes
  rationale: Le mot désigne littéralement des porteurs de lance, mais ici leur fonction est celle d’une escorte armée; « gardes » est clair et naturel.
- source_word: γάζοφυλάκιον
  choice: salle du trésor
  rationale: Désigne le local où sont conservées les richesses; cette formulation concrète convient au déplacement vers le trésor du Temple.
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: le Souverain des esprits et de toute autorité
  rationale: « Souverain » rend δυνάστης sans le confondre avec κύριος; « toute autorité » conserve la portée globale de πάσης ἐξουσίας.
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: produisit une manifestation éclatante
  rationale: Conserve l’idée d’une manifestation divine saisissante tout en donnant à μεγάλην une expression idiomatique en français.
- source_word: κατατολμήσαντας συνελθεῖν
  choice: ceux qui avaient osé s’y rendre
  rationale: Préserve l’audace exprimée par κατατολμάω sans imposer à συνελθεῖν le sens strict d’entrer; le contexte donne à « y » une orientation locale.
- source_word: καταπλαγέντας
  choice: frappés de stupeur
  rationale: Exprime le choc et l’effroi provoqués par l’intervention divine, sans réduire le terme à la seule terreur.
- source_word: τὴν τοῦ θεοῦ δύναμιν
  choice: devant la puissance de Dieu
  rationale: Rend directement l’objet ou la cause de leur saisissement dans un français idiomatique.
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  choice: tombèrent dans l’épuisement et la peur
  rationale: Le mouvement vers un état résultant est rendu par « tombèrent dans »; ἔκλυσις évoque l’effondrement des forces et δειλία la peur ou la lâcheté.
theological_decisions:
- issue: Titre divin ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: le Souverain des esprits et de toute autorité
  alternative: le Maître des esprits et de toute puissance
  rationale: La formulation maintient la souveraineté de Dieu sur les esprits et toute autorité, tout en distinguant δυνάστης de κύριος et ἐξουσία de la simple force.
- issue: Nature de l’ἐπιφάνεια divine
  choice: une manifestation éclatante
  alternative: une apparition grandiose
  rationale: « Manifestation » préserve le fait que le grec ne précise pas encore ici la forme exacte sous laquelle l’intervention devient visible; « apparition » risquerait de la déterminer davantage.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque est légèrement segmentée pour la lisibilité. « Salle du trésor » concrétise le lieu sans archaïsme; le titre divin demeure solennel. Les ambiguïtés de συνελθεῖν et d’ἐπιφάνεια sont conservées en notes.
