revisions:
- from: Mais alors qu’il était déjà arrivé sur place avec ses gardes[a], près de la salle du trésor, le Souverain des esprits et de toute autorité produisit une manifestation éclatante[b]. Ainsi, tous ceux qui avaient osé s’y rendre[c], frappés de stupeur devant la puissance de Dieu, tombèrent dans l’épuisement et la peur.
  to: Mais alors qu’il se trouvait déjà là, à la salle du trésor, avec ses gardes[a], le Souverain des esprits et de toute autorité fit une grande manifestation[b], de sorte que tous ceux qui avaient osé venir[c], frappés de stupeur devant la puissance de Dieu, furent réduits à l’abattement et à la peur.
  rationale: La révision restitue la localisation exprimée par κατά sans introduire l'idée de proximité, maintient l'ambiguïté de συνελθεῖν dans le texte et la note, et améliore quelques formulations françaises tout en conservant les choix terminologiques fondamentaux.
