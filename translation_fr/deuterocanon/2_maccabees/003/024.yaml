  source_fidelity: Le sens général est bien rendu, y compris le titre divin et l'effet de l'intervention. Toutefois, « près de la salle du trésor » affaiblit indûment κατά, qui situe Héliodore à la salle/au trésor plutôt qu'à proximité. « s’y rendre » introduit aussi une orientation locale plus définie que συνελθεῖν ne l'exige; « venir » préserve mieux l'ambiguïté du verbe.
  naturalness: Le français est globalement fluide et de registre narratif soutenu. « Produisit une manifestation » est toutefois moins idiomatique que « fit une grande manifestation », et « tombèrent dans l’épuisement » est moins naturel et moins précis que « furent réduits à l’abattement et à la peur ».
  terminology: « Souverain des esprits et de toute autorité » rend avec justesse δυνάστης et πάσης ἐξουσίας. « Salle du trésor » est acceptable, à condition de ne pas la présenter comme un simple lieu voisin. « Manifestation » conserve utilement l'indétermination de ἐπιφάνεια.
