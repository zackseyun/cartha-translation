revisions:
- from: Une certaine somme appartenait aussi à Hyrcan, fils de Tobias, un homme qui occupait une très haute position. L’impie Simon n’avait pas poussé la calomnie jusque-là. En tout, il y avait quatre cents talents d’argent et deux cents talents d’or[a].
  to: Il y avait aussi des fonds appartenant à Hyrcan, fils de Tobias, un homme de très haut rang. Simon l’impie n’avait pas poussé la calomnie jusque-là. En tout, il y avait quatre cents talents d’argent et deux cents talents d’or[a].
  rationale: La révision corrige sans risque la singularisation de l’indéfini pluriel grec en employant « des fonds », terme naturel dans le contexte financier. « Un homme de très haut rang » rend de façon concise et idiomatique ἀνδρὸς ἐν ὑπεροχῇ κειμένου, tandis que « Simon l’impie » conserve la qualification religieuse et morale de δυσσεβής. La nuance graduelle de οὐχ οὕτως est préservée par « jusque-là ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:37:59Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’appartenance à Hyrcan, son rang social, la caractérisation de Simon, la portée graduelle de la calomnie et les montants. Toutefois, « Une certaine somme » met au singulier un indéfini grec au pluriel (τινά), qui désigne plus naturellement une portion non précisée de fonds ou de dépôts. « Des fonds » conserve mieux l’indétermination et le référent financier contextuel.
  naturalness: Le français est globalement fluide et de registre approprié. « Il y avait aussi des fonds appartenant à… » est plus idiomatique dans un relevé de dépôts que « Une certaine somme appartenait aussi à… ». « Simon l’impie » est une apposition française naturelle et conserve la tonalité narrative.
  terminology: « Hyrcan », « Tobias », « impie », « talents d’argent » et « talents d’or » conviennent au français biblique moderne international. Le rétablissement de « talents » dans le second montant est justifié; la note explique adéquatement l’ellipse grecque.
  issues:
  - severity: low
    issue: Nombre et référent de τινά
    rationale: Le grec emploie l’indéfini neutre pluriel τινά, dans un contexte de dépôts monétaires. « Une certaine somme » singularise le référent; « des fonds » rend plus exactement une quantité ou des avoirs non précisés sans ajouter de détail.
  revised_text: Il y avait aussi des fonds appartenant à Hyrcan, fils de Tobias, un homme de très haut rang. Simon l’impie n’avait pas poussé la calomnie jusque-là. En tout, il y avait quatre cents talents d’argent et deux cents talents d’or[a].
