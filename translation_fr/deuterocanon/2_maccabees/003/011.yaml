  yaml_path: translation/deuterocanon/2_maccabees/003/011.yaml
  text: and some also belonging to Hyrcanus son of Tobias[a], a man of very high position. The ungodly Simon was not slandering to that extent. Altogether there were four hundred talents of silver and two hundred of gold.
translation:
  language: fr
  text: Il y avait aussi des fonds appartenant à Hyrcan, fils de Tobias, un homme de très haut rang. Simon l’impie n’avait pas poussé la calomnie jusque-là. En tout, il y avait quatre cents talents d’argent et deux cents talents d’or[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « deux cents d’or » ; le mot « talents » est sous-entendu d’après le membre précédent.'
    reason: Le français rétablit l’unité de mesure omise dans le second membre de la phrase grecque.
lexical_decisions:
- source_word: τινὰ δὲ καὶ
  choice: Une certaine somme appartenait aussi
  rationale: Le pronom indéfini désigne une partie non précisée des dépôts évoqués dans le contexte. « Une certaine somme » explicite naturellement en français ce référent financier implicite.
- source_word: Ὑρκανοῦ τοῦ Τωβίου
  choice: à Hyrcan, fils de Tobias
  rationale: Le génitif indique ici l’appartenance, puis le patronyme. « Fils de Tobias » rend la relation de manière idiomatique.
- source_word: σφόδρα ἀνδρὸς ἐν ὑπεροχῇ κειμένου
  choice: un homme qui occupait une très haute position
  rationale: La tournure décrit le rang ou la position sociale d’Hyrcan, non une posture physique. « Très » rend l’intensité de σφόδρα.
- source_word: οὐχ οὕτως διαβάλλων
  choice: n’avait pas poussé la calomnie jusque-là
  rationale: Cette formulation conserve la négation, la portée graduelle de οὕτως et le caractère malveillant ou mensonger de διαβάλλω, sans préciser davantage que le grec la mesure exacte de l’exagération.
- source_word: ὁ δυσσεβὴς Σίμων
  choice: L’impie Simon
  rationale: « Impie » conserve le jugement moral et religieux de δυσσεβής sans l’élargir à une qualification doctrinale particulière.
- source_word: τὰ δὲ πάντα
  choice: En tout, il y avait
  rationale: Rend naturellement la formule récapitulative qui introduit le montant total.
- source_word: ἀργυρίου τετρακόσια τάλαντα
  choice: quatre cents talents d’argent
  rationale: Expression française usuelle pour cette unité de poids et de valeur.
- source_word: χρυσίου δὲ διακόσια
  choice: deux cents talents d’or
  rationale: Le grec omet τάλαντα dans le second membre, mais le mot est clairement sous-entendu par le parallélisme; il est rétabli en français pour la clarté.
theological_decisions:
- issue: Qualification morale de Simon par δυσσεβής
  choice: l’impie Simon
  alternative: Simon, cet homme irréligieux
  rationale: « Impie » garde la dimension religieuse et morale du terme grec tout en restant bref et traditionnellement intelligible.
- issue: Portée de οὐχ οὕτως διαβάλλων
  choice: n’avait pas poussé la calomnie jusque-là
  alternative: ne présentait pas ainsi les faits de manière mensongère
  rationale: Le grec est elliptique et permet une nuance sur la mesure ou la manière de la dénonciation. Le choix retenu préserve cette tension sans transformer Simon en témoin fiable ni nier le jugement négatif porté sur lui.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de la structure comptable du grec tout en explicitant les éléments nécessaires à une lecture naturelle.
