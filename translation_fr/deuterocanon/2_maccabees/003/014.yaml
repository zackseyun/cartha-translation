  text: After setting a day[a], he went in to arrange the examination concerning these matters; and there was no small anxiety throughout the whole city.
translation:
  language: fr
  text: Après avoir fixé un jour, il entra pour organiser l’examen de ces affaires. Une vive angoisse régnait alors dans toute la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’angoisse n’était pas petite », tournure qui souligne son intensité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενος δὲ ἡμέραν
  choice: Après avoir fixé un jour
  rationale: Le participe aoriste moyen de τάσσω exprime ici l’établissement préalable d’un moment déterminé. « Fixé un jour » conserve le sens concret de ἡμέραν sans introduire une date déjà connue.
- source_word: εἰσῄει
  choice: il entra
  rationale: L’imparfait décrit l’entrée dans le cadre du récit. Le passé simple est naturel dans une narration française suivie et conserve le mouvement exprimé par le verbe.
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  choice: l’examen de ces affaires
  rationale: ἐπίσκεψις désigne ici une démarche officielle de vérification ou d’enquête. « Examen » garde cette portée administrative, tandis que « de ces affaires » rend naturellement περὶ τούτων.
- source_word: οἰκονομήσων
  choice: pour organiser
  rationale: Le participe futur marque le but de son entrée et οἰκονομέω indique la gestion ou l’organisation de la procédure.
- source_word: οὐ μικρὰ … ἀγωνία
  choice: une vive angoisse
  rationale: La litote grecque, littéralement « une angoisse non petite », exprime une détresse collective intense. « Vive angoisse » en transmet naturellement la force en français; la forme littérale est signalée en note.
- source_word: καθʼ ὅλην τὴν πόλιν
  choice: dans toute la ville
  rationale: κατά avec l’accusatif a ici une valeur distributive, et ὅλην souligne que l’angoisse s’étendait à la ville entière.
