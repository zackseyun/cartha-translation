  text: When the king asked Heliodorus who might be fit to be sent once more to Jerusalem[a], he said,
translation:
  language: fr
  text: 'Lorsque le roi demanda à Héliodore qui serait apte à être envoyé encore une fois à Jérusalem[a], celui-ci répondit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui serait apte à être envoyé encore une fois à Jérusalem » ; l’expression grecque souligne qu’il s’agit d’une nouvelle occasion unique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτήσαντος
  choice: demanda
  rationale: Le génitif absolu pose la circonstance de l'action du roi. « Demanda » est naturel et rend directement l'acte d'interroger Héliodore.
- source_word: ποῖός τις εἴη
  choice: qui serait
  rationale: Dans cette question indirecte, l'expression porte à la fois sur l'identité et sur la qualité de la personne recherchée. « Qui serait » conserve cette ouverture sans alourdir la phrase.
- source_word: ἐπιτήδειος
  choice: apte
  rationale: L'adjectif désigne une personne qui convient à la mission ou possède les qualités requises. « Apte » est précis et courant dans ce contexte.
- source_word: ἔτι ἅπαξ
  choice: encore une fois
  rationale: Cette expression marque une nouvelle occurrence, envisagée comme une occasion supplémentaire unique. « Encore une fois » en rend naturellement les deux éléments.
- source_word: διαπεμφθῆναι
  choice: à être envoyé
  rationale: L'infinitif passif indique l'envoi d'une personne en mission. Cette formulation respecte la voix passive du grec sans raideur excessive.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: Avec un verbe d'envoi, « à Jérusalem » est la tournure idiomatique en français.
- source_word: ἔφησεν
  choice: celui-ci répondit
  rationale: Le verbe signifie littéralement « dit », mais le contexte immédiat est celui d'une réponse à la question du roi. « Celui-ci » lève naturellement l'ambiguïté possible du pronom français et renvoie à Héliodore.
