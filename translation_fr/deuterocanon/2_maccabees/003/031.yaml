    text: 'Littéralement : « à celui qui gisait dans son dernier souffle » ; l’adverbe grec souligne l’extrême gravité de son état, c’est-à-dire qu’il était à l’article de la mort.'
    reason: lexical_alternative
  revision_rationale: La révision clarifie que la vie est accordée par le Très-Haut, objet de l’invocation d’Onias, conformément au sens contextuel de la phrase grecque. Elle remplace également une expression française moins naturelle par « à l’agonie » et améliore la lisibilité de la note tout en conservant l’image source du dernier souffle.
