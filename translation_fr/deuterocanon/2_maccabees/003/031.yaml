  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
translation:
  language: fr
  text: Mais aussitôt, quelques proches d’Héliodore pressèrent Onias d’invoquer le Très-Haut pour qu’il accorde la vie à celui qui gisait à l’agonie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à celui qui gisait dans son dernier souffle » ; l’adverbe grec souligne l’extrême gravité de son état, c’est-à-dire qu’il était à l’article de la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  choice: aussitôt
  rationale: L’adverbe exprime la rapidité et l’urgence de la démarche; « aussitôt » convient naturellement au récit.
- source_word: τινες τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  choice: quelques proches d’Héliodore
  rationale: Le substantif désigne des personnes qui fréquentaient habituellement Héliodore, donc ses familiers ou proches; cette formulation reste naturelle sans préciser indûment leur fonction.
- source_word: ἠξίουν
  choice: pressèrent
  rationale: Dans ce contexte, le verbe exprime une demande insistante. L’imparfait grec peut décrire l’action en cours, tandis que le passé simple français s’intègre mieux à la narration.
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  choice: d’invoquer le Très-Haut
  rationale: Dans un contexte religieux, ἐπικαλέομαι signifie invoquer ou faire appel à. « Le Très-Haut » conserve le titre divin grec.
- source_word: τὸ ζῆν χαρίσασθαι
  choice: et d’accorder la vie
  rationale: χαρίζομαι évoque un don accordé par grâce; l’expression signifie ici accorder la vie ou laisser vivre.
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  choice: à celui qui gisait, sur le point de rendre son dernier souffle
  rationale: La formulation rend l’image d’un homme étendu arrivé à l’extrême limite de la vie. « Gisait » restitue κειμένῳ et l’expression française indique clairement l’imminence de la mort.
theological_decisions:
- issue: Titre divin τὸν ὕψιστον
  choice: le Très-Haut
  alternative: le Dieu Très-Haut
  rationale: Le grec emploie le titre substantivé sans ajouter θεός; « le Très-Haut » préserve cette forme et son usage traditionnel en français.
- issue: Sujet implicite de χαρίσασθαι
  choice: Onias est grammaticalement celui que les proches pressent d’accorder la vie
  alternative: comprendre que le Très-Haut accorderait la vie à la suite de la prière d’Onias
  rationale: Les deux infinitifs dépendent directement de la demande adressée à Onias. La traduction conserve cette tension syntaxique sans introduire un changement explicite de sujet absent du grec.
translation_notes:
  register: Français international actuel, narratif et digne. Les noms suivent les formes françaises usuelles « Héliodore » et « Onias ». La formulation conserve l’enchaînement grec des deux infinitifs et explicite seulement l’idiome du dernier souffle dans une note.
