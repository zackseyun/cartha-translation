revisions:
- from: Mais aussitôt, quelques proches d’Héliodore pressèrent Onias d’invoquer le Très-Haut et d’accorder la vie à celui qui gisait, sur le point de rendre son dernier souffle.[a]
  to: Mais aussitôt, quelques proches d’Héliodore pressèrent Onias d’invoquer le Très-Haut pour qu’il accorde la vie à celui qui gisait à l’agonie.[a]
  rationale: La révision clarifie que la vie est accordée par le Très-Haut, objet de l’invocation d’Onias, conformément au sens contextuel de la phrase grecque. Elle remplace également une expression française moins naturelle par « à l’agonie » et améliore la lisibilité de la note tout en conservant l’image source du dernier souffle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les proches d’Héliodore demandent instamment à Onias d’invoquer le Très-Haut en faveur d’un homme à l’agonie. Toutefois, la coordination française actuelle (« d’invoquer … et d’accorder la vie ») attribue directement à Onias l’action d’accorder la vie. Dans le contexte et selon l’interprétation syntaxico-sémantique la plus naturelle du grec, l’octroi de la vie est demandé au Très-Haut, invoqué par Onias.'
  naturalness: Le français est fluide, narratif et de registre approprié. « À l’agonie » exprime plus naturellement l’état extrême décrit par ἐν ἐσχάτῃ πνοῇ que « sur le point de rendre son dernier souffle », tout en évitant une répétition lourde de « souffle ».
  terminology: « Héliodore », « Onias » et « le Très-Haut » sont des formes françaises usuelles et fidèles. « Invoquer le Très-Haut » convient bien à ἐπικαλέσασθαι τὸν ὕψιστον.
  issues:
  - severity: medium
    issue: Attribution ambiguë et trompeuse de « d’accorder la vie »
    rationale: La construction française fait grammaticalement d’Onias celui qui accorde la vie. Le sens contextuel de la prière, et la lecture usuelle de la construction grecque, demandent plutôt que le Très-Haut soit celui qui accorde la vie. « Pour qu’il accorde » rend cela explicitement sans ajout doctrinal.
  - severity: low
    issue: Note littérale peu idiomatique
    rationale: « tout à fait dans son dernier souffle » ne constitue pas une formulation française claire, même dans une note. La note peut signaler sobrement l’image grecque du dernier souffle et la force de l’adverbe sans prétendre à un mot-à-mot artificiel.
  revised_text: Mais aussitôt, quelques proches d’Héliodore pressèrent Onias d’invoquer le Très-Haut pour qu’il accorde la vie à celui qui gisait à l’agonie.[a]
  revised_footnotes:
