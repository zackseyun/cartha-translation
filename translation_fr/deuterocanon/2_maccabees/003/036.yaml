  text: And he testified to everyone about the works of the greatest God that he had seen with his own eyes[a].
translation:
  language: fr
  text: Et il témoignait à tous des œuvres du Dieu le plus grand qu’il avait vues de ses propres yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Dieu Très-Haut ». Le grec emploie ici le superlatif « le plus grand » (μεγίστου), et non le terme habituel signifiant « très haut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεμαρτύρει
  choice: il témoignait
  rationale: L’imparfait exprime un témoignage qui se prolonge ou se répète; « témoignait » conserve la dimension publique du verbe.
- source_word: πᾶσιν
  choice: devant tous
  rationale: Le datif désigne ici les destinataires ou l’auditoire. « Devant tous » est naturel en français et souligne le caractère public du témoignage.
- source_word: ἅπερ
  choice: des œuvres … qu’il
  rationale: La proposition relative est restructurée pour produire une phrase française naturelle tout en conservant les œuvres comme contenu du témoignage et objet de la vision.
- source_word: ὑπ’ ὄψιν
  choice: de ses propres yeux
  rationale: Cette expression rend la force de l’expérience visuelle directe indiquée par l’idiome grec.
- source_word: τεθεαμένος
  choice: avait vues
  rationale: Le participe parfait renvoie à une vision personnelle accomplie dont la portée demeure; le plus-que-parfait convient à l’antériorité en français.
- source_word: ἔργα
  choice: œuvres
  rationale: « Œuvres » correspond directement au terme grec et convient aux actions remarquables attribuées à Dieu.
- source_word: τοῦ μεγίστου θεοῦ
  choice: du Dieu très grand
  rationale: Cette formulation rend μέγιστος comme un superlatif de grandeur sans le confondre avec le titre traditionnel « le Dieu Très-Haut », qui traduirait normalement ὕψιστος.
theological_decisions:
- issue: Traduction de l’épithète divine μεγίστου θεοῦ
  choice: le Dieu très grand
  alternative: le Dieu Très-Haut
  rationale: Le grec emploie μέγιστος, « très grand / le plus grand », et non ὕψιστος, « très haut ». Le texte principal préserve donc la distinction lexicale, tandis que la note signale la formulation traditionnelle.
translation_notes:
  register: Français moderne, clair et digne. L’imparfait garde l’aspect continu ou répété du témoignage; « de ses propres yeux » restitue naturellement l’insistance sur le témoignage oculaire.
