base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/007.yaml
  text: After conferring with the king[a], Apollonius informed him about the money that had been reported to him. Then the king appointed Heliodorus, who was over the affairs of state[c][b], and sent him with orders to carry out the removal of the aforementioned money.
translation:
  language: fr
  text: Après s’être entretenu avec le roi[a], Apollonios l’informa au sujet des fonds qui lui avaient été signalés. Le roi choisit alors Héliodore, le responsable des affaires de l’État[b], et l’envoya avec ordre d’effectuer le retrait des fonds susmentionnés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir rencontré le roi » ou « après avoir consulté le roi ». Le participe grec évoque une rencontre ou un entretien officiel.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « celui qui était préposé aux affaires » : titre administratif d’un haut fonctionnaire chargé des affaires de l’État.'
    reason: cultural_note
  - marker: c
    text: Ou « d’effectuer l’emport des fonds mentionnés plus haut ». Le grec souligne l’exécution de leur retrait du lieu où ils étaient gardés.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμίξας
  choice: Après s’être entretenu avec
  rationale: Le participe exprime une rencontre comportant un échange avec le roi; cette formulation naturelle conserve à la fois la valeur temporelle et le caractère officiel de l’entretien.
- source_word: ἐνεφάνισεν
  choice: informa
  rationale: Dans ce contexte administratif, le verbe indique qu’Apollonios porte officiellement l’information à la connaissance du roi.
- source_word: μηνυθέντων
  choice: avait été signalé
  rationale: Le passif renvoie à l’argent précédemment porté à l’attention d’Apollonios, sans imposer la nuance plus accusatrice de « dénoncé ».
- source_word: χρημάτων
  choice: argent
  rationale: Le mot désigne ici les sommes ou fonds conservés dans le Temple; « argent » est clair et direct.
- source_word: προχειρισάμενος
  choice: choisit
  rationale: Le roi désigne Héliodore pour cette mission. « Choisit » rend le geste officiel sans suggérer nécessairement une nomination durable à une fonction.
- source_word: τὸν ἐπὶ τῶν πραγμάτων
  choice: le responsable des affaires de l’État
  rationale: La formule constitue un titre administratif désignant un haut fonctionnaire chargé des affaires gouvernementales.
- source_word: ἐκκομιδὴν ποιήσασθαι
  choice: faire enlever
  rationale: La locution signifie effectuer la sortie ou l’emport de l’argent depuis le lieu où il se trouve; « faire enlever » restitue aussi la dimension causative liée à l’ordre royal.
- source_word: προειρημένων
  choice: dont il avait été question
  rationale: Cette expression renvoie naturellement en français à l’argent déjà mentionné, tout en conservant le ton administratif.
