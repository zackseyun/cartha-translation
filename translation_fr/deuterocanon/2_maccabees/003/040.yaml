  text: And the matter concerning Heliodorus and the safeguarding of the treasury proceeded in this way[a].
translation:
  language: fr
  text: Ainsi se déroulèrent les événements concernant Héliodore et la protection du trésor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Les événements concernant Héliodore et la garde du trésor se passèrent ainsi. »'
    reason: Alternative lexicale pour τὰ καθʼ Ἡλιόδωρον, τήρησις et ἐχώρησεν.
lexical_decisions:
- source_word: τὰ ... καθʼ Ἡλιόδωρον
  choice: les événements concernant Héliodore
  rationale: Le neutre pluriel avec κατά désigne idiomatiquement ce qui concerne Héliodore, c’est-à-dire l’ensemble des événements relatés. « Les événements concernant Héliodore » convient au résumé conclusif du chapitre sans transformer l’expression en récit explicatif.
- source_word: γαζοφυλακίου
  choice: trésor
  rationale: Dans ce contexte lié au Temple, le terme désigne le trésor, éventuellement le local où il était conservé. « Trésor » est le rendu français le plus naturel et concis.
- source_word: τήρησιν
  choice: préservation
  rationale: Le nom exprime l’action de garder, de protéger ou de conserver. « Préservation » souligne que le trésor est demeuré intact, tout en conservant la portée abstraite du grec.
- source_word: οὕτως
  choice: ainsi
  rationale: L’adverbe renvoie à la manière dont les faits viennent d’être racontés et marque naturellement la conclusion de l’épisode.
- source_word: ἐχώρησεν
  choice: se déroulèrent
  rationale: Le verbe peut exprimer le fait d’avancer, de suivre son cours ou de tourner d’une certaine manière. Avec le sujet pluriel français « les événements », « se déroulèrent » restitue idiomatiquement le bilan narratif.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la fonction de conclusion narrative du grec. « Héliodore » suit la forme française traditionnelle du nom.
