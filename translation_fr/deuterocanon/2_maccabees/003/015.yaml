  source_fidelity: 'Le sens central est bien rendu : les prêtres sont devant l’autel, en vêtements sacerdotaux, et demandent au Ciel de préserver les biens confiés pour leurs déposants. La périphrase « le Ciel » respecte le grec εἰς οὐρανόν. Une légère révision améliore la représentation du participe aoriste (« s’étant jetés ») suivi de l’imparfait, qui décrit leur appel continu.'
  naturalness: La combinaison « se jetèrent à terre … et invoquaient » est compréhensible, mais elle mêle de façon un peu abrupte un passé simple ponctuel et un imparfait. « S’étant jetés à terre … faisaient appel » rend plus naturellement en français le rapport entre le geste préalable et la prière continue. « Faisaient appel au Ciel » est idiomatique et conserve la retenue du texte.
  terminology: « Vêtements sacerdotaux », « dépôts » et « biens intacts » conviennent au registre moderne et au contexte juridique. « Celui qui avait établi la loi concernant les dépôts » conserve la force législative de νομοθετήσαντα et le lien avec παρακαταθήκη, sans imposer une interprétation confessionnelle.
