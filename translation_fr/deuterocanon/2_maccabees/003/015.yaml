  text: But the priests[a], having thrown themselves down before the altar in their priestly robes, were calling out to heaven to the one who had given the law concerning deposits[b], that he should keep these things safe for those who had deposited them.
translation:
  language: fr
  text: Mais les prêtres, revêtus de leurs vêtements sacerdotaux, s’étant jetés à terre devant l’autel, faisaient appel au Ciel[a], à celui qui avait établi la loi concernant les dépôts[b], afin qu’il garde ces biens intacts pour ceux qui les avaient déposés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lançaient leur appel vers le ciel ». « Le Ciel » est une manière révérencielle de désigner Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de biens confiés au temple pour qu’ils y soient gardés en sécurité.
    reason: cultural_note
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  choice: se jetèrent à terre
  rationale: Cette formulation conserve le caractère vif et concret du geste, plutôt que de l’atténuer par le seul verbe « se prosterner ».
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  choice: invoquaient le Ciel
  rationale: L’imparfait rend l’action prolongée, tandis que « le Ciel » préserve la formulation révérencielle du grec sans la remplacer directement par « Dieu ».
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  choice: celui qui avait établi la loi concernant les dépôts
  rationale: « Établi la loi » maintient la portée juridique de νομοθετέω, et « concernant les dépôts » reste proche de la structure grecque.
- source_word: παρακαταθήκης
  choice: dépôts
  rationale: Le terme désigne ici des biens remis à la garde du temple. « Dépôts » conserve le sens juridique et permet de reprendre la même famille lexicale dans la suite du verset.
- source_word: τοῖς παρακαταθεμένοις
  choice: pour ceux qui les avaient déposés
  rationale: Cette traduction désigne clairement les personnes ayant confié les biens et maintient le lien lexical avec « dépôts ».
- source_word: ταῦτα σῶα διαφυλάξαι
  choice: afin qu’il conserve ces biens intacts
  rationale: « Conserve […] intacts » exprime à la fois la protection contre la perte et la préservation de tout dommage.
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  choice: revêtus de leurs habits sacerdotaux
  rationale: Cette expression naturelle et digne restitue la tenue cultuelle des prêtres sans recourir à un vocabulaire archaïque.
theological_decisions:
- issue: Périphrase révérencielle dans la prière
  choice: le Ciel
  alternative: Dieu
  rationale: Le grec mentionne explicitement « le ciel ». Conserver cette désignation respecte sa retenue révérencielle et évite d’expliciter davantage que le texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’imagerie physique du geste des prêtres, la nuance juridique du dépôt et la périphrase révérencielle « le Ciel ».
