  yaml_path: translation/deuterocanon/2_maccabees/003/032.yaml
  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
translation:
  language: fr
  text: Mais le grand prêtre, craignant que le roi ne s’imagine que les Juifs avaient commis quelque méfait contre Héliodore, offrit un sacrifice pour le rétablissement[a] de cet homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrance » ou « salut ». Le grec σωτηρία peut désigner le salut, la délivrance ou la préservation ; ici, il s’agit probablement du rétablissement physique d’Héliodore.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕποπτος ... γενόμενος
  choice: craignant
  rationale: Dans ce contexte, l’expression décrit l’inquiétude du grand prêtre devant ce que le roi pourrait conclure, et non le fait que le grand prêtre serait lui-même soupçonné.
- source_word: μή ποτε
  choice: que ... ne
  rationale: Après « craignant », cette tournure française exprime naturellement l’éventualité redoutée, sans donner au soupçon royal un caractère certain.
- source_word: διάλημψιν
  choice: s’imagine
  rationale: Le terme renvoie ici à l’idée ou à l’impression que le roi pourrait se former. « S’imagine » est naturel et conserve le caractère conjectural de cette conclusion.
- source_word: κακουργίαν τινά
  choice: quelque méfait
  rationale: « Méfait » rend une action mauvaise ou criminelle, tandis que « quelque » préserve l’indétermination de τινά.
- source_word: περὶ τὸν Ἡλιόδωρον
  choice: contre Héliodore
  rationale: Avec κακουργίαν, la préposition désigne ici Héliodore comme la personne visée par le méfait.
- source_word: ὑπὸ τῶν Ἰουδαίων συντετελέσθαι
  choice: les Juifs avaient commis
  rationale: La formulation active est idiomatique en français et rend le parfait infinitif comme une action supposée déjà accomplie.
- source_word: προσήγαγε θυσίαν
  choice: offrit un sacrifice
  rationale: Il s’agit de la formulation française usuelle pour l’acte sacrificiel.
- source_word: ὑπὲρ τῆς τοῦ ἀνδρὸς σωτηρίας
  choice: pour le rétablissement de cet homme
  rationale: Dans le contexte immédiat de l’effondrement physique d’Héliodore et de son retour à la vie, « rétablissement » exprime le sens contextuel probable de σωτηρία, tout en signalant en note son champ sémantique plus large.
theological_decisions:
- issue: Sens de σωτηρία dans un récit de restauration physique
  choice: rétablissement
  alternative: délivrance ou salut
  rationale: Le contexte immédiat concerne l’état corporel d’Héliodore après le jugement divin. « Rétablissement » convient donc au récit sans imposer un sens sotériologique, tandis que la note préserve l’amplitude du grec.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la réserve du grand prêtre et le caractère seulement possible de la conclusion du roi. Le marqueur de note est placé sur « rétablissement », terme auquel la note se rapporte.
