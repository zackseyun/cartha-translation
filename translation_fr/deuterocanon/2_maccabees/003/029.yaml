  text: And he[a], because of the divine power, lay speechless and deprived of all hope and salvation;
translation:
  language: fr
  text: Et lui, sous l’effet de la puissance divine, gisait sans pouvoir parler, privé de tout espoir et de toute délivrance[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout salut ». Le grec σωτηρία peut désigner le salut, la délivrance ou le fait d’échapper à un danger.
    reason: alternative lexicale
lexical_decisions:
- source_word: θείαν ἐνέργειαν
  choice: sous l’effet de la puissance divine
  rationale: ἐνέργεια désigne ici la puissance divine à l’œuvre. La tournure « sous l’effet de » exprime naturellement le lien causal indiqué par διά.
- source_word: ἄφωνος
  choice: sans voix
  rationale: ἄφωνος signifie privé de voix ou incapable de parler. « Sans voix » reste concis et convient à l’état physique décrit.
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  choice: privé de tout espoir et de toute possibilité d’être sauvé
  rationale: ἐστερημένος exprime la privation, tandis que σωτηρία peut désigner ici le salut, la délivrance ou le fait d’échapper au danger. Cette formulation privilégie le sens concret sans effacer la portée possible du terme.
- source_word: ἔρριπτο
  choice: gisait
  rationale: L’imparfait décrit l’état dans lequel il demeurait après avoir été terrassé. « Gisait » rend cet état de façon naturelle et digne.
theological_decisions:
- issue: Sens de σωτηρία dans ce récit de jugement divin
  choice: possibilité d’être sauvé
  alternative: salut ; délivrance
  rationale: Le contexte immédiat concerne la survie ou la délivrance physique d’Héliodore. La formulation retenue conserve le verbe « sauver », assez large pour refléter l’amplitude de σωτηρία, sans imposer exclusivement un sens doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. « Gisait » est légèrement soutenu mais courant dans un récit solennel. Le point-virgule conserve la continuité syntaxique du passage.
