    text: Ou « de la surveillance du marché » ou « de la réglementation du marché ». Le terme grec désigne une fonction civique de surveillance, de réglementation ou d’administration liée au marché.
    reason: Alternative lexicale pour ἀγορανομίας, dont le champ de sens couvre l’administration, la surveillance et la réglementation du marché.
  revision_rationale: La révision évite d’ajouter un pluriel non exprimé dans le grec et choisit « administration » comme rendu principal, avec les autres nuances lexicales en note. Elle remplace aussi une tournure inchoative par une formulation neutre qui ne surdétermine pas l’aspect du différend. Aucun changement de sens théologique ou institutionnel n’est introduit.
