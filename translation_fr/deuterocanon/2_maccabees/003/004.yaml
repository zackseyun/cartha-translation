revisions:
- from: Mais un certain Simon, de la tribu de Benjamin, avait été nommé responsable du Temple. Il entra en désaccord avec le grand prêtre au sujet de la réglementation des marchés dans la ville.[a]
  to: Mais un certain Simon, de la tribu de Benjamin, qui avait été nommé responsable du Temple, était en désaccord avec le grand prêtre au sujet de l’administration du marché dans la ville.[a]
  rationale: La révision évite d’ajouter un pluriel non exprimé dans le grec et choisit « administration » comme rendu principal, avec les autres nuances lexicales en note. Elle remplace aussi une tournure inchoative par une formulation neutre qui ne surdétermine pas l’aspect du différend. Aucun changement de sens théologique ou institutionnel n’est introduit.
