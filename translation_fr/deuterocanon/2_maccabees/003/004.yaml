  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
translation:
  language: fr
  text: Mais un certain Simon, de la tribu de Benjamin, qui avait été nommé responsable du Temple, était en désaccord avec le grand prêtre au sujet de l’administration du marché dans la ville.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la surveillance du marché » ou « de la réglementation du marché ». Le terme grec désigne une fonction civique de surveillance, de réglementation ou d’administration liée au marché.
    reason: Alternative lexicale pour ἀγορανομίας, dont le champ de sens couvre l’administration, la surveillance et la réglementation du marché.
lexical_decisions:
- source_word: προστάτης
  choice: responsable
  rationale: Le terme désigne ici une personne placée à la tête d’une institution dans une fonction de supervision ou de protection. « Responsable » exprime ce rôle officiel sans lui attribuer un titre sacerdotal ni une fonction militaire.
- source_word: τοῦ ἱεροῦ
  choice: du Temple
  rationale: ἱερόν désigne normalement l’ensemble du complexe du Temple, et non seulement le sanctuaire intérieur.
- source_word: καθεσταμένος
  choice: avait été nommé
  rationale: Le participe indique que Simon avait été établi officiellement dans cette fonction.
- source_word: διηχθῆναι
  choice: entra en désaccord
  rationale: Cette formulation rend l’idée de différend ou de conflit avec le grand prêtre sans exagérer le degré d’hostilité.
- source_word: ἀρχιερεῖ
  choice: le grand prêtre
  rationale: C’est la désignation française courante et précise de cette fonction juive.
- source_word: ἀγορανομίας
  choice: la réglementation des marchés
  rationale: Le nom grec renvoie à la surveillance et à la réglementation civiques liées au marché; le pluriel français désigne naturellement ce domaine administratif.
- source_word: κατὰ τὴν πόλιν
  choice: dans la ville
  rationale: La locution situe dans la ville le domaine où s’exerce cette réglementation, sans l’étendre explicitement à toute la ville.
theological_decisions:
- issue: Nature de la fonction de Simon par rapport au Temple
  choice: Simon est présenté comme un responsable officiellement nommé au Temple, sans titre sacerdotal.
  alternative: Simon serait le « protecteur » du Temple dans un sens patronal plus large.
  rationale: προστάτης associé à καθεσταμένος souligne une fonction officielle de supervision. Le verset ne dit pas que Simon était prêtre; la traduction n’importe donc aucune qualification sacerdotale.
translation_notes:
  register: 'Français international moderne, clair et digne. La longue structure participiale grecque est divisée en deux phrases pour une lecture naturelle, tout en conservant la succession logique : fonction officielle de Simon, puis différend avec le grand prêtre. La majuscule à « Temple » distingue ici le Temple de Jérusalem comme édifice déterminé.'
