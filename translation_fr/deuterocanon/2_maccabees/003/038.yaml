base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
translation:
  language: fr
  text: Si tu as un ennemi ou quelqu’un qui complote contre tes intérêts[a], envoie-le là-bas. Tu l’accueilleras à son retour après qu’il aura été fouetté — si toutefois il en réchappe[b] —, car une puissance de Dieu entoure réellement ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre tes affaires ».'
    reason: Alternative lexicale pour le sens large de πραγμάτων.
  - marker: b
    text: 'Littéralement : « s’il est même sauvé ». L’expression souligne le danger de rencontrer la puissance divine liée à ce lieu.'
    reason: Précision sur la force de ἐάνπερ καὶ διασωθῇ.
lexical_decisions:
- source_word: πολέμιον
  choice: ennemi
  rationale: Le terme désigne directement un adversaire personnel ; « ennemi » est naturel, clair et fidèle.
- source_word: πραγμάτων ἐπίβουλον
  choice: quelqu’un qui complote contre tes intérêts
  rationale: ἐπίβουλος exprime une intention hostile ou perfide, tandis que πράγματα désigne ici les affaires ou intérêts de la personne. Cette formulation française reste naturelle sans préciser indûment la nature du complot.
- source_word: πέμψον αὐτὸν ἐκεῖ
  choice: envoie-le là-bas
  rationale: L’impératif est rendu directement ; « là-bas » renvoie clairement au lieu évoqué dans le contexte.
- source_word: μεμαστιγωμένον
  choice: après qu’il aura été fouetté
  rationale: Le participe parfait passif présente la flagellation comme accomplie au moment du retour. La tournure choisie restitue cet aspect en français courant.
- source_word: προσδέξῃ
  choice: tu l’accueilleras à son retour
  rationale: Le verbe signifie recevoir ou accueillir ; le contexte implique le retour de celui qui a été envoyé. « À son retour » explicite naturellement cette relation sans modifier le sens.
- source_word: ἐάνπερ καὶ διασωθῇ
  choice: si toutefois il en réchappe
  rationale: Les particules renforcent le caractère incertain de la survie. « En réchapper » rend ici le sens contextuel de διασῴζω, sortir vivant d’un grave danger.
- source_word: διὰ τὸ ... εἶναί τινα θεοῦ δύναμιν
  choice: car une puissance de Dieu
  rationale: La formulation conserve l’indétermination de τινα et le génitif θεοῦ, sans transformer l’expression en affirmation doctrinale plus définie.
- source_word: περὶ τὸν τόπον
  choice: entoure réellement ce lieu
  rationale: περί avec l’accusatif a ici une valeur spatiale. « Entoure ce lieu » conserve cette image plus précisément qu’un simple « se trouve en ce lieu ».
- source_word: ἀληθῶς
  choice: réellement
  rationale: L’adverbe souligne que cette puissance est effective et non supposée.
theological_decisions:
- issue: Rendu de θεοῦ δύναμιν avec τινα dans l’affirmation concernant le lieu saint
  choice: une puissance de Dieu
  alternative: la puissance de Dieu ; une certaine puissance divine
  rationale: « Une puissance de Dieu » maintient à la fois le lien explicite avec Dieu et l’indétermination de τινα. Cela évite de convertir la phrase en une définition exhaustive de la présence divine.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond au singulier grec. La phrase a été divisée en deux pour alléger sa structure tout en conservant la progression et l’ironie menaçante de l’original.
