lexical_decisions:
- source_word: τοῦ δὲ ἀρχιερέως
  choice: Mais le grand prêtre ayant
  rationale: Le génitif absolu exprime la circonstance, tandis que δέ marque une légère transition ou opposition. La construction participiale française convient au fragment transmis.
- source_word: ὑποδείξαντος
  choice: ayant précisé
  rationale: Le verbe signifie ici indiquer ou faire clairement savoir. « Préciser » est naturel en français et rend l’explication formelle donnée par le grand prêtre.
- source_word: παρακαταθήκας
  choice: dépôts
  rationale: Le terme désigne des biens ou des sommes confiés à la garde de quelqu’un. « Dépôts » reste précis sans importer une catégorie juridique moderne telle que « fonds fiduciaires ».
- source_word: εἶναι
  choice: qu’il s’agissait de
  rationale: L’infinitif appartient au discours indirect. Cette tournure française idiomatique exprime clairement l’identification de la nature des fonds.
- source_word: χηρῶν τε καὶ ὀρφανῶν
  choice: appartenant à des veuves et à des orphelins
  rationale: Les génitifs indiquent très probablement les propriétaires des dépôts. « Appartenant à » explicite ce rapport tout en conservant en note la formulation plus littérale.
