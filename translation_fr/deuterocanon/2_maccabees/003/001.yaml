  text: While the holy city was inhabited in complete peace[a], and the laws were being observed in the best way because of Onias the high priest,
translation:
  language: fr
  text: Alors que la ville sainte était habitée dans une paix totale et que les lois étaient observées de façon exemplaire grâce au grand prêtre Onias,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῆς ἁγίας πόλεως
  choice: la ville sainte
  rationale: Équivalent français naturel et traditionnel, qui conserve la dimension religieuse de ἁγίας.
- source_word: κατοικουμένης μετὰ πάσης εἰρήνης
  choice: vivait dans une paix complète
  rationale: Le participe décrit l’état de la ville habitée; cette formulation française exprime naturellement la vie paisible de la cité sans la lourdeur de « était habitée ».
- source_word: τῶν νόμων
  choice: les lois
  rationale: Le pluriel grec est conservé et désigne collectivement les prescriptions juridiques et religieuses.
- source_word: ὅτι κάλλιστα συντηρουμένων
  choice: étaient observées de la meilleure manière
  rationale: « Observées » convient idiomatiquement aux lois, tandis que « de la meilleure manière » maintient la valeur superlative de κάλλιστα.
- source_word: διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  choice: grâce au grand prêtre Onias
  rationale: διά avec l’accusatif marque ici la cause; « grâce à » rend la causalité favorable suggérée par l’éloge narratif.
theological_decisions:
- issue: Portée causale de διά avec Onias
  choice: La paix de la ville et la bonne observance des lois sont attribuées au grand prêtre Onias.
  alternative: « par l’intermédiaire du grand prêtre Onias »
  rationale: Avec l’accusatif, διά exprime le plus naturellement la cause. « Grâce à » conserve également l’évaluation positive du contexte, sans ajouter de doctrine.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase reste ouverte par une virgule, conformément à la syntaxe du passage qui se poursuit au verset suivant. Le texte grec fourni semble tronqué après τοῦ ἀρχιερέως, mais l’unité syntaxique transmise permet cette traduction.
