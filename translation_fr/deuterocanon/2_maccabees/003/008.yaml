  text: So Heliodorus immediately set out on the journey[a], outwardly as though to inspect the cities of Coele-Syria and Phoenicia, but in reality to carry out the king’s purpose.
translation:
  language: fr
  text: Héliodore se mit donc aussitôt en route[a], en donnant l’impression qu’il allait inspecter les villes de Cœlé-Syrie et de Phénicie, mais en réalité pour exécuter le dessein du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte source comporte ici un « A » anormal avant le mot « roi » (βασιλέως), probablement dû à une erreur d’édition ou de transcription. La traduction suit le sens clair du contexte : « le dessein du roi ».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐθέως
  choice: aussitôt
  rationale: Rend directement la promptitude de l’action dans un français moderne et naturel.
- source_word: ἐποιεῖτο τὴν πορίαν
  choice: se mit en route
  rationale: Expression idiomatique qui restitue naturellement le départ en voyage suggéré par la tournure grecque.
- source_word: τῇ μὲν ἐμφάσει
  choice: en donnant l’impression
  rationale: Préserve le contraste explicite entre l’apparence et la réalité sans affirmer plus directement un prétexte mensonger.
- source_word: ὡς ... ἐφοδεῦσαι
  choice: qu’il allait inspecter
  rationale: ὡς avec l’infinitif exprime ici le but apparent; ἐφοδεύω évoque une tournée de visite ou d’inspection.
- source_word: τὰς κατὰ Κοίλην Συρίαν καὶ Φοινίκην πόλεις
  choice: les villes de Cœlé-Syrie et de Phénicie
  rationale: Conserve les noms géographiques historiques sous leur forme française usuelle.
- source_word: τῷ πράγματι δέ
  choice: mais en réalité
  rationale: Marque nettement l’opposition entre l’apparence affichée et le véritable objectif.
- source_word: τὴν ... πρόθεσιν ἐπιτελεῖν
  choice: exécuter le dessein
  rationale: « Dessein » rend la πρόθεσις royale avec dignité, tandis qu’« exécuter » exprime l’accomplissement concret indiqué par ἐπιτελεῖν.
- source_word: τοῦ A βασιλέως
  choice: du roi
  rationale: Le « A » isolé dans le texte fourni paraît être une anomalie éditoriale ou de transcription; le contexte donne clairement le sens « du roi ».
