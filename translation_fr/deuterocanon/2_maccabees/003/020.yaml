  text: And all of them[a], stretching out their hands toward heaven[b], were making supplication.
translation:
  language: fr
  text: Toutes, les mains tendues vers le ciel, adressaient leur supplication.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « supplication » désigne une demande instante; il n'implique pas nécessairement une « litanie » au sens liturgique plus tardif.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  choice: Toutes
  rationale: Le féminin pluriel renvoie très probablement aux femmes mentionnées dans le contexte immédiat. Le français permet de conserver ce renvoi par « Toutes » sans répéter explicitement « les femmes ».
- source_word: προτείνουσαι τὰς χεῖρας
  choice: les mains tendues
  rationale: Cette tournure française naturelle rend le participe simultané et le geste consistant à étendre ou lever les mains dans la prière.
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: « Vers » exprime l'orientation du geste. En français biblique courant, « le ciel » peut désigner à la fois l'espace céleste et la demeure divine, ce qui préserve la portée contextuelle sans la surinterpréter.
- source_word: ἐποιοῦντο
  choice: adressaient
  rationale: L'imparfait restitue l'action en cours. Avec « supplication », « adresser » est plus idiomatique que le calque « faire ».
- source_word: τὴν λιτανείαν
  choice: leur supplication
  rationale: Le nom désigne ici une prière instante ou une supplication, sans impliquer nécessairement une litanie au sens liturgique plus tardif. Le possessif est naturel en français.
theological_decisions:
- issue: Sens de οὐρανός dans un geste de prière
  choice: le ciel
  alternative: les cieux
  rationale: Le contexte présente un appel dirigé vers la sphère divine. « Le ciel » est la formulation française moderne la plus naturelle tout en gardant la polysémie du terme grec.
- issue: Portée de λιτανεία
  choice: supplication
  alternative: litanie
  rationale: « Litanie » évoquerait aujourd'hui une forme liturgique fixe ou répétitive que le grec n'impose pas ici. « Supplication » conserve l'idée d'une demande pressante.
translation_notes:
  register: Français moderne, naturel et digne. L'ordre détaché « Toutes, les mains tendues… » maintient le lien féminin avec le contexte antérieur et conserve l'action continue grâce à l'imparfait.
