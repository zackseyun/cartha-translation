  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
translation:
  language: fr
  text: Quant à eux, ils bénissaient le Seigneur, qui couvrait de gloire son propre lieu. Et le Temple, qui peu auparavant était rempli de crainte et d’agitation, se remplissait de joie et d’allégresse lorsque le Seigneur Tout-Puissant se manifesta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « apparut ». Le terme grec est associé à une manifestation divine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγουν
  choice: ils bénissaient
  rationale: L’imparfait grec exprime une action en cours; « bénissaient » conserve aussi le sens direct de la bénédiction adressée au Seigneur.
- source_word: παραδοξάζοντα
  choice: qui couvrait de gloire
  rationale: Le verbe rare évoque l’action de rendre glorieux ou remarquable. Cette formulation française est naturelle tout en maintenant le lien explicite avec la gloire.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: le lieu qui lui appartenait
  rationale: τόπος signifie littéralement « lieu »; la tournure indique qu’il s’agit du lieu propre au Seigneur, identifié ensuite comme le Temple.
- source_word: δέους καὶ ταραχῆς
  choice: de crainte et d’agitation
  rationale: « Crainte » rend δέος sans l’affaiblir, et « agitation » exprime le trouble collectif suggéré par ταραχή.
- source_word: ἱερόν
  choice: le Temple
  rationale: Dans ce contexte, ἱερόν désigne le complexe du Temple; la majuscule signale le Temple de Jérusalem sans ajouter d’interprétation.
- source_word: τοῦ παντοκράτορος ... κυρίου
  choice: le Seigneur Tout-Puissant
  rationale: Cette expression française usuelle conserve les deux éléments du titre divin et rend παντοκράτωρ par « Tout-Puissant ».
- source_word: ἐπιφανέντος
  choice: se manifesta
  rationale: Le verbe appartient au vocabulaire de la manifestation visible ou éclatante, notamment divine. « Se manifesta » en préserve la portée sans imposer une apparition corporelle.
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  choice: se remplissait de joie et d’allégresse
  rationale: L’imparfait passif décrit le changement d’état en cours; le doublet « joie et allégresse » restitue les deux noms grecs dans un registre digne et naturel.
theological_decisions:
- issue: Action divine envers le Temple dans παραδοξάζοντα τὸν ἑαυτοῦ τόπον
  choice: Le Seigneur couvre de gloire le lieu qui lui appartient.
  alternative: Le Seigneur rend merveilleux son propre lieu.
  rationale: La traduction conserve l’affirmation que l’intervention divine honore et glorifie le Temple, sans préciser au-delà du texte la manière dont cette gloire se manifeste.
- issue: Portée de ἐπιφανέντος κυρίου
  choice: « lorsque le Seigneur Tout-Puissant se manifesta »
  alternative: « lorsque le Seigneur Tout-Puissant apparut »
  rationale: « Se manifesta » rend la notion d’épiphanie divine et laisse ouverte la forme exacte de cette manifestation; la variante plus concrète est signalée en note.
translation_notes:
  register: Français international moderne, courant et digne. Les imparfaits maintiennent l’aspect duratif du récit. « Temple » est employé pour le complexe sacré de Jérusalem; « allégresse » conserve le parallélisme solennel sans rendre la phrase archaïque.
