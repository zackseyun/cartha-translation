revisions:
- from: Il rapporta que la salle du trésor à Jérusalem regorgeait de sommes d’argent immenses, au point que la masse des différents fonds était incalculable[a]. Il ajouta que ces fonds ne relevaient pas du compte des sacrifices[b], mais qu’ils pouvaient passer sous l’autorité du roi[c].
  to: Il rapporta que le trésor de Jérusalem était rempli d’immenses sommes d’argent, au point que le montant des divers dépôts était incalculable[a], et que ces fonds ne relevaient pas du compte des sacrifices[b], mais qu’il était possible qu’ils passent sous l’autorité du roi[c].
  rationale: La révision rétablit la dépendance de toutes les propositions au seul verbe « rapporta », améliore l’idiomaticité de l’expression relative aux dépôts et adopte « trésor », terme usuel pour le lieu de conservation. Elle conserve l’ambiguïté du λόγος des sacrifices et ne présente pas la prise de contrôle royale comme légitime ou effective.
