  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
translation:
  language: fr
  text: Il rapporta que le trésor de Jérusalem était rempli d’immenses sommes d’argent, au point que le montant des divers dépôts était incalculable[a], et que ces fonds ne relevaient pas du compte des sacrifices[b], mais qu’il était possible qu’ils passent sous l’autorité du roi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre ainsi : « le montant des divers dépôts était impossible à compter ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’ils ne faisaient pas partie du compte ou des dépenses liés aux sacrifices.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « passer sous le contrôle du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήγγειλεν
  choice: Il rapporta
  rationale: Le verbe désigne la transmission d’une information à une autorité; « rapporta » convient au contexte narratif.
- source_word: χρημάτων ἀμυθήτων
  choice: des sommes d’argent immenses
  rationale: χρήματα désigne ici l’argent ou les richesses, tandis que ἀμύθητος souligne une ampleur qui défie l’évaluation.
- source_word: γαζοφυλάκιον
  choice: la salle du trésor
  rationale: Le mot désigne le lieu où sont conservés les fonds et objets précieux; cette formulation évite de confondre le local avec l’institution financière.
- source_word: τὸ πλῆθος τῶν διαφόρων
  choice: la masse des différents fonds
  rationale: διαφόρων paraît désigner diverses sommes ou catégories de fonds confiés au trésor; « différents fonds » conserve cette pluralité sans préciser indûment leur statut juridique.
- source_word: ἀναρίθμητον
  choice: incalculable
  rationale: Le terme signifie littéralement impossible à compter; « incalculable » rend naturellement l’hyperbole en français moderne.
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  choice: ces fonds ne relevaient pas du compte des sacrifices
  rationale: προσήκειν exprime l’appartenance ou le rattachement, et λόγος peut désigner ici un compte, une rubrique ou une administration; la formulation préserve cette portée comptable sans nier toute association sacrée.
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  choice: passer sous l’autorité du roi
  rationale: L’expression indique le passage sous le pouvoir ou le contrôle du roi, sans affirmer que cette prise de contrôle serait légitime.
- source_word: ταῦτα
  choice: ces fonds
  rationale: Le pronom renvoie aux sommes mentionnées; l’explicitation française clarifie l’antécédent sans modifier le sens.
theological_decisions:
- issue: Nature des fonds conservés dans le Temple
  choice: Le texte les distingue du compte des sacrifices sans nier toute association avec le sanctuaire.
  alternative: Comprendre qu’il s’agissait de dépôts entièrement profanes et donc saisissables de plein droit.
  rationale: Le grec affirme seulement que les fonds ne se rattachaient pas au λόγος des sacrifices. Il ne tranche ni leur caractère sacré au sens large ni la légitimité d’une saisie royale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque longue est divisée en deux phrases pour la lisibilité, tout en maintenant l’enchaînement du rapport. « Salle du trésor » concrétise le lieu désigné par γαζοφυλάκιον; « compte des sacrifices » conserve l’ambiguïté administrative de λόγος.
