  text: But Heliodorus was carrying out what had been decided[a].
translation:
  language: fr
  text: Mais Héliodore mettait à exécution ce qui avait été décidé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exécutait ce qui avait été arrêté ».'
    reason: Variante lexicale reflétant le sens d’accomplissement de ἐπετέλει et celui de détermination préalable de τὸ διεγνωσμένον.
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais
  rationale: δέ introduit ici un léger contraste avec le contexte précédent; « Mais » rend naturellement cette transition adversative.
- source_word: Ἡλιόδωρος
  choice: Héliodore
  rationale: Forme française traditionnelle et courante du nom propre grec.
- source_word: τὸ διεγνωσμένον
  choice: ce qui avait été décidé
  rationale: Le participe parfait passif substantivé désigne une décision déjà arrêtée; le plus-que-parfait français préserve cette antériorité.
- source_word: ἐπετέλει
  choice: mettait à exécution
  rationale: L’imparfait grec présente l’action comme en cours dans le passé; cette expression rend l’idée d’appliquer concrètement une décision.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’imparfait conserve l’aspect duratif du grec, tandis que « avait été décidé » marque l’état résultant d’une décision antérieure.
