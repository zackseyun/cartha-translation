- from: 'Pendant que le grand prêtre accomplissait le rite d’expiation[a], les mêmes jeunes hommes apparurent de nouveau à Héliodore, revêtus des mêmes vêtements. Se tenant là, ils lui dirent : « Sois profondément reconnaissant envers le grand prêtre Onias, car c’est à cause de lui que le Seigneur t’a accordé, dans sa grâce, de rester en vie. »'
  to: 'Pendant que le grand prêtre accomplissait l’expiation[a], les mêmes jeunes hommes apparurent de nouveau à Héliodore, revêtus des mêmes vêtements. Debout, ils lui dirent : « Sois profondément reconnaissant envers Onias, le grand prêtre, car c’est à cause de lui que le Seigneur t’a fait la grâce de vivre. »'
  rationale: La révision retire l’explicitation non nécessaire « rite », rend τὸ ζῆν par « vivre » et exprime κεχάρισται par l’idiome français naturel « a fait la grâce de ». La note conserve « propitiation » comme possibilité sans définir de manière restrictive le terme grec disputé.
