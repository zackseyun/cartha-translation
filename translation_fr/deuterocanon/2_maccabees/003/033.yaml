  yaml_path: translation/deuterocanon/2_maccabees/003/033.yaml
  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
translation:
  language: fr
  text: 'Pendant que le grand prêtre accomplissait l’expiation[a], les mêmes jeunes hommes apparurent de nouveau à Héliodore, revêtus des mêmes vêtements. Debout, ils lui dirent : « Sois profondément reconnaissant envers Onias, le grand prêtre, car c’est à cause de lui que le Seigneur t’a fait la grâce de vivre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accomplissait la propitiation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  choice: accomplissait le rite d’expiation
  rationale: Le génitif absolu décrit l’action cultuelle menée par le grand prêtre. « Rite d’expiation » rend clairement ἱλασμός dans son contexte sacerdotal sans imposer une théorie particulière de la propitiation.
- source_word: οἱ αὐτοὶ νεανίαι
  choice: les mêmes jeunes hommes
  rationale: Cette formulation naturelle conserve le référent masculin et le lien explicite avec les personnages apparus auparavant.
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  choice: revêtus des mêmes vêtements
  rationale: « Revêtus » exprime l’état vestimentaire indiqué par le participe, tandis que « mêmes vêtements » maintient la continuité visuelle avec l’apparition précédente.
- source_word: στάντες
  choice: se tenant là
  rationale: Le participe indique qu’ils se tiennent debout au moment de parler. « Là » donne une tournure française naturelle sans ajouter qu’ils seraient précisément à côté d’Héliodore.
- source_word: Πολλὰ Ὀνία τῷ ἀρχιερεῖ χάριτας ἔχε
  choice: Sois profondément reconnaissant envers le grand prêtre Onias
  rationale: L’expression idiomatique appelle Héliodore à éprouver une grande gratitude envers Onias. Cette formulation française restitue l’intensité de πολλὰ plus naturellement qu’un calque du pluriel χάριτας.
- source_word: διὰ γὰρ αὐτὸν
  choice: car c’est à cause de lui
  rationale: διά avec l’accusatif exprime ici la cause; la tournure emphatique française conserve la mise en relief d’Onias.
- source_word: σοὶ κεχάρισται τὸ ζῆν
  choice: t’a accordé, dans sa grâce, de rester en vie
  rationale: κεχάρισται présente la survie comme une faveur gracieusement accordée. « Rester en vie » convient au contexte où Héliodore échappe à la mort.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Désignation divine française usuelle, naturelle ici comme sujet défini.
theological_decisions:
- issue: Portée cultuelle de ἱλασμός
  choice: rite d’expiation
  alternative: rite de propitiation; œuvre d’expiation
  rationale: « Expiation » conserve la portée sacrificielle et cultuelle du terme tout en restant compréhensible. L’ajout de « rite » précise qu’il s’agit ici d’un acte sacerdotal, sans trancher entre les différentes conceptions théologiques de son effet.
- issue: Nuance de faveur dans κεχάρισται
  choice: accordé, dans sa grâce
  alternative: accordé; fait la grâce de
  rationale: La traduction maintient l’idée que la vie est donnée comme une faveur divine, et non simplement permise, sans surcharger la phrase d’un vocabulaire doctrinal.
- issue: Rôle d’Onias dans διὰ ... αὐτόν
  choice: à cause de lui
  alternative: grâce à lui; par son intermédiaire
  rationale: La formulation conserve le rapport causal exprimé par le grec sans définir plus précisément si la prière, l’intercession ou le rite d’Onias constitue le moyen de cette faveur.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement segmentée pour la lisibilité. « Héliodore » et « Onias » suivent les formes françaises traditionnelles. Le discours direct reste solennel mais accessible.
