revisions:
- from: En raison de cette piété et de cette haine du mal, même les rois en vinrent à honorer ce lieu et à donner de l’éclat au sanctuaire par les dons les plus magnifiques qu’ils lui envoyaient.[a]
  to: En raison de la piété et de l’aversion pour le mal, il arrivait même que les rois honorent le lieu et donnent de l’éclat au sanctuaire par les dons les plus magnifiques qu’ils envoyaient.[a]
  rationale: La révision corrige principalement la représentation de l’imparfait συνέβαινεν. Elle conserve l’ambiguïté du référent de la piété et de l’aversion pour le mal, ainsi que l’idée que les présents royaux étaient envoyés au sanctuaire. La note demeure ancrée après la proposition concernée et explique l’alternative lexicale sans trancher au-delà du contexte.
