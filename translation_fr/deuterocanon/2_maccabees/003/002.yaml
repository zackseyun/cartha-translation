  text: Because of the piety and hatred of wickedness there, it came about that even the kings themselves honored the place and glorified the sanctuary with the finest gifts sent.
translation:
  language: fr
  text: En raison de la piété et de l’aversion pour le mal, il arrivait même que les rois honorent le lieu et donnent de l’éclat au sanctuaire par les dons les plus magnifiques qu’ils envoyaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par les offrandes les plus magnifiques qu’ils faisaient parvenir ». Le mot grec peut désigner des biens envoyés comme dons ou bienfaits ; la nuance exacte dépend du contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν
  choice: piété
  rationale: « Piété » exprime de façon concise le respect envers Dieu manifesté dans la conduite et convient au contexte du sanctuaire.
- source_word: μισοπονηρίαν
  choice: haine du mal
  rationale: Cette expression rend directement le composé grec, qui désigne l’aversion envers ce qui est mauvais, sans en restreindre la portée à une catégorie particulière de faute.
- source_word: συνέβαινεν
  choice: en vinrent à
  rationale: Cette tournure française naturelle exprime le résultat ou l’état de fait que présente l’imparfait grec.
- source_word: τιμᾶν
  choice: honorer
  rationale: Le verbe indique le respect public accordé par les rois à ce lieu.
- source_word: τὸν τόπον
  choice: ce lieu
  rationale: « Ce lieu » conserve la désignation révérencielle du site du Temple tout en assurant une référence naturelle en français.
- source_word: τὸ ἱερὸν
  choice: le sanctuaire
  rationale: « Sanctuaire » préserve la valeur sacrée de ἱερόν et le distingue de « ce lieu » dans le membre précédent.
- source_word: ἀποστολαῖς
  choice: les dons … qu’ils lui envoyaient
  rationale: Dans ce contexte, le terme désigne vraisemblablement des biens envoyés comme bienfaits au sanctuaire; la formulation française garde à la fois l’idée de don et celle d’envoi.
- source_word: ταῖς κρατίσταις
  choice: les plus magnifiques
  rationale: Le superlatif qualifie ici l’excellence des dons; « les plus magnifiques » convient à des bienfaits royaux et conserve leur éclat.
- source_word: δοξάζειν
  choice: donner de l’éclat
  rationale: Le verbe signifie ici conférer honneur ou splendeur. Cette traduction évite de répéter « honorer », déjà employé pour τιμᾶν.
theological_decisions:
- issue: Référent de la piété et de la haine du mal
  choice: Conserver les qualités sans leur attribuer explicitement un sujet personnel dans ce verset.
  alternative: Préciser qu’il s’agit des qualités du grand prêtre Onias ou de celles qui régnaient en ce lieu.
  rationale: Le segment grec fourni présente ces qualités comme la cause de l’honneur accordé au sanctuaire, mais ne nomme pas ici leur porteur. « Cette piété » et « cette haine du mal » marquent la continuité avec le contexte sans résoudre implicitement la question.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement causal du grec et distingue l’honneur rendu au lieu de l’éclat donné au sanctuaire. Les démonstratifs « cette » signalent que le verset poursuit la phrase ou l’idée précédente.
