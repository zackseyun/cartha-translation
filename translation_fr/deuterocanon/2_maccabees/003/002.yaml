review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les principaux termes et maintient la distinction entre l’honneur accordé au lieu (τιμᾶν) et l’éclat conféré au sanctuaire (δοξάζειν). Toutefois, « en vinrent à » suggère plus volontiers une évolution ponctuelle ou une arrivée à un résultat, alors que συνέβαινεν, à l’imparfait, présente l’état de choses comme un fait qui se produisait. « Il arrivait même que » restitue plus exactement cette valeur sans alourdir le français. Les démonstratifs « cette » ne sont pas nécessaires au grec et peuvent être évités tout en laissant le référent contextuel ouvert.
  naturalness: La phrase révisée est naturelle en français international moderne et conserve un registre digne. « Il arrivait même que les rois honorent » est plus idiomatique et plus proche de l’aspect verbal grec que « même les rois en vinrent à honorer ».
  terminology: « Piété », « aversion pour le mal », « lieu », « sanctuaire », « dons » et « donner de l’éclat » conviennent au contexte. « Aversion pour le mal » rend μισοπονηρίαν avec une force morale nette, sans imposer « méchanceté » ni une interprétation doctrinale. « Dons ... qu’ils envoyaient » conserve l’idée d’envois-bienfaits de ἀποστολαῖς; la note maintient l’alternative « offrandes ».
  issues:
  - severity: medium
    issue: Valeur de συνέβαινεν
    rationale: « En vinrent à » exprime habituellement un aboutissement ou un changement ponctuel. L’imparfait συνέβαινεν est mieux rendu ici par « il arrivait ... que », qui décrit le fait récurrent ou établi présenté par le grec.
  - severity: low
    issue: Démonstratifs non exprimés dans le grec
    rationale: « Cette piété » et « cette haine » sont possibles dans le contexte, mais « la piété » et « l’aversion pour le mal » restent plus près de l’énoncé grec et ne suggèrent pas inutilement un référent plus précisément déterminé.
