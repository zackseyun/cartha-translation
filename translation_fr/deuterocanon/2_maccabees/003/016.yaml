  yaml_path: translation/deuterocanon/2_maccabees/003/016.yaml
  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
translation:
  language: fr
  text: 'Il suffisait de voir l’aspect du grand prêtre pour en avoir l’esprit blessé[a] : son visage et son teint altéré laissaient voir l’angoisse qui habitait son âme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour en être profondément bouleversé ». Le grec emploie au sens figuré un verbe qui signifie « blesser » ou « transpercer ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’angoisse selon l’âme », c’est-à-dire l’angoisse intérieure de son âme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  choice: Il suffisait de voir
  rationale: La tournure grecque, elliptique et impersonnelle, décrit l’effet produit sur tout observateur. Cette formulation française en rend naturellement la portée générale.
- source_word: ἰδέαν
  choice: l’aspect
  rationale: Le mot désigne ici l’apparence visible du grand prêtre, notamment son expression et son maintien.
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  choice: en avoir l’esprit blessé
  rationale: Le verbe grec évoque littéralement une blessure, employée ici comme image de la vive détresse éprouvée par l’observateur; « esprit » rend διάνοια sans lui substituer « cœur ».
- source_word: ὄψις
  choice: visage
  rationale: Associé au teint altéré, le terme renvoie concrètement à ce qui se voit sur la figure du grand prêtre.
- source_word: χρόας παρηλλαγμένον
  choice: teint altéré
  rationale: χρόα désigne la couleur corporelle ou le teint, et le participe indique un changement sans en préciser la nature.
- source_word: ἐνέφαινεν
  choice: laissaient voir
  rationale: Le verbe signifie rendre manifeste ou montrer; cette expression fait ressortir que les signes extérieurs révélaient la détresse intérieure.
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  choice: l’angoisse qui habitait son âme
  rationale: ἀγωνία exprime une détresse intense, tandis que ψυχή désigne ici la vie intérieure. La formulation reste naturelle tout en conservant « âme ».
theological_decisions:
- issue: Portée anthropologique de ψυχή
  choice: âme
  alternative: être intérieur
  rationale: Dans ce contexte, ψυχή désigne l’intériorité du grand prêtre plutôt qu’une définition technique de la constitution humaine. « Âme » préserve néanmoins la résonance théologique et l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la blessure est conservée, mais intégrée dans une tournure idiomatique; « teint altéré » maintient l’imprécision du grec sur la nature exacte du changement.
