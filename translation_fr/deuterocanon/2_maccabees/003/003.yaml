  text: so that even Seleucus[a], the king of Asia[b], used to provide from his own revenues all the expenses that fell due for the services of the sacrifices.
translation:
  language: fr
  text: si bien que même Séleucos, le roi d’Asie[a], pourvoyait, sur ses propres revenus, à toutes les dépenses nécessaires au service des sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Asie » désigne, dans l’usage hellénistique, le royaume asiatique du souverain séleucide, et non l’ensemble du continent asiatique au sens moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ὥστε καὶ
  choice: si bien que… même
  rationale: Exprime la conséquence du contexte précédent tout en conservant la valeur emphatique de καί.
- source_word: Σέλευκον
  choice: Séleucos
  rationale: Transcription française usuelle du nom grec, qui reste proche de la forme source.
- source_word: τὸν τῆς Ἀσίας βασιλέα
  choice: le roi d’Asie
  rationale: Rendu direct du titre grec; une note précise son sens historique hellénistique.
- source_word: χορηγεῖν
  choice: pourvoyait… à
  rationale: Le verbe désigne ici le fait de fournir ou d’assumer les moyens financiers; l’imparfait convient à la valeur durative ou habituelle du contexte.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: sur ses propres revenus
  rationale: Préserve la nuance fiscale de πρόσοδοι et donne une formulation française naturelle.
- source_word: πάντα τὰ πρὸς τὰς λειτουργίας τῶν θυσιῶν ἐπιβάλλοντα δαπανήματα
  choice: à toutes les dépenses nécessaires au service des sacrifices
  rationale: «Dépenses nécessaires» rend naturellement les charges qui incombaient; le singulier collectif «service» exprime ici l’activité cultuelle sans introduire un jargon ecclésiastique tardif.
theological_decisions:
- issue: Terminologie cultuelle dans un récit historique deutérocanonique
  choice: Employer «service des sacrifices» dans un sens historique et cultuel sobre.
  alternative: «liturgie des sacrifices» ou «ministères des sacrifices»
  rationale: Le passage traite du financement royal des activités sacrificielles du Temple. «Service» conserve la portée cultuelle de λειτουργία sans lui imposer des connotations confessionnelles ou ecclésiastiques ultérieures.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant les calques peu naturels; l’imparfait présente le soutien financier comme une pratique suivie.
