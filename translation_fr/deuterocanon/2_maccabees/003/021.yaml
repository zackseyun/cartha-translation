- from: Quel spectacle pitoyable que toute cette foule prosternée, et que l’attente du grand prêtre[a], en proie à une profonde angoisse !—
  to: Pitoyables étaient la prostration de toute la foule et l’attente du grand prêtre[a], en proie à une grande angoisse —
  rationale: La révision aligne la syntaxe française sur les deux groupes nominaux coordonnés par le grec, retire une précision non exprimée et maintient l’incertitude imposée par la troncation du témoin fourni. Le tiret final continue de signaler que l’extrait s’interrompt en cours de phrase.
