lexical_decisions:
- source_word: ἐλεεινή
  choice: Quel spectacle pitoyable
  rationale: Cette tournure française naturelle restitue la valeur prédicative et exclamative de l’adjectif grec dans une phrase sans verbe exprimé.
- source_word: τοῦ πλήθους
  choice: toute cette foule
  rationale: « Foule » rend naturellement πλῆθος dans cette scène publique; « cette » rattache le groupe à la scène immédiate.
- source_word: παμμιγῆ
  choice: toute
  rationale: Dans ce contexte, l’adjectif souligne que la foule entière partage la même prostration; « toute » exprime cette totalité sans imposer le sens littéral possible de mélange.
- source_word: πρόπτωσιν
  choice: prosternée
  rationale: Le mot évoque le fait de tomber en avant ou de se prosterner. La formulation conserve l’image corporelle plutôt que de la réduire à un simple effondrement émotionnel.
- source_word: τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως
  choice: du grand prêtre, en proie à une profonde angoisse
  rationale: Cette expression rend l’intensité de μεγάλως et l’état d’extrême anxiété exprimé par ἀγωνιῶντος, dans un français actuel et digne.
- source_word: προσδο-
  choice: l’attente
  rationale: La ligne fournie s’interrompt après le début προσδο-. « Attente » est une restitution prudente du substantif vraisemblablement amorcé, sans prétendre déterminer une forme que l’extrait ne conserve pas entièrement.
