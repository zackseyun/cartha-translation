revisions:
- from: Lorsqu’il arriva à Jérusalem, il fut accueilli avec courtoisie par le grand prêtre de la ville. Il exposa ce qui avait été divulgué[a], expliqua la raison de sa présence et demanda si les choses étaient réellement ainsi.
  to: Lorsqu’il arriva à Jérusalem et fut accueilli avec courtoisie par le grand prêtre de la ville, il fit connaître la divulgation qui avait eu lieu[a], précisa le motif de sa présence et demanda si les choses étaient réellement ainsi.
  rationale: La correction conserve la syntaxe suivie du grec et distingue plus nettement le fait de faire connaître l’information déjà divulguée de celui de préciser le but de la venue. Elle rend explicitement la valeur événementielle de γεγονότος ἐμφανισμοῦ, tout en préservant en note l’ambiguïté lexicale de ἐμφανισμός.
