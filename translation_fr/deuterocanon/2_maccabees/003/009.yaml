  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
translation:
  language: fr
  text: Lorsqu’il arriva à Jérusalem et fut accueilli avec courtoisie par le grand prêtre de la ville, il fit connaître la divulgation qui avait eu lieu[a], précisa le motif de sa présence et demanda si les choses étaient réellement ainsi.
