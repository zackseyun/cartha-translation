    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενηθεὶς
  choice: Lorsqu’il arriva
  rationale: Le participe aoriste exprime ici une circonstance temporelle antérieure à l’action principale. Cette formulation est naturelle en français et conserve l’idée d’arrivée.
- source_word: φιλοφρόνως
  choice: avec courtoisie
  rationale: L’adverbe évoque un accueil cordial, bienveillant ou respectueux. « Avec courtoisie » convient au registre narratif sans exagérer la chaleur de l’accueil.
- source_word: ἀποδεχθεὶς
  choice: il fut accueilli
  rationale: Le participe passif signifie recevoir ou accueillir favorablement. Le passif français respecte la structure et le point de vue du grec.
- source_word: ἀνέθετο
  choice: Il exposa
  rationale: Dans ce contexte, le verbe désigne le fait de présenter ou de rapporter une affaire. « Exposa » garde le caractère formel de l’entretien.
- source_word: περὶ τοῦ γεγονότος ἐμφανισμοῦ
  choice: ce qui avait été divulgué[a]
  rationale: ἐμφανισμός peut désigner une mise au jour, une divulgation ou une manifestation. Le contexte antérieur favorise l’idée d’une information divulguée, tandis que la note conserve l’autre possibilité lexicale.
- source_word: καί τινος ἕνεκεν πάρεστι
  choice: la raison de sa présence
  rationale: La tournure indique le motif pour lequel il se trouve sur place. Cette formulation est concise et idiomatique.
- source_word: διεσάφησεν
  choice: expliqua
  rationale: Le verbe signifie rendre clair ou exposer explicitement. « Expliqua » convient naturellement à la suite des actions.
- source_word: ἐπυνθάνετο
  choice: demanda
  rationale: L’imparfait moyen exprime une demande de renseignements. « Demanda » est actuel et naturel, sans perdre l’idée d’enquête exprimée par le contexte.
- source_word: ταῖς ἀληθείαις
  choice: réellement
  rationale: Le datif est employé adverbialement pour insister sur la vérité factuelle de l’information.
- source_word: ταῦτα οὕτως ἔχοντα τυγχάνει
  choice: si les choses étaient réellement ainsi
  rationale: L’expression demande si la situation correspond effectivement à ce qui a été annoncé. La traduction préserve cette vérification sans ajouter de précisions absentes du grec.
