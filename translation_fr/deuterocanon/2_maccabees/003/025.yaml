  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
translation:
  language: fr
  text: Car un cheval leur apparut, portant un cavalier terrifiant et paré d’un magnifique harnachement[a]. S’élançant avec impétuosité, il frappa Héliodore de ses sabots de devant[b]. Celui qui le montait paraissait revêtu d’une armure d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « paré de splendides ornements » ; le terme grec désigne l’équipement ornemental du cheval.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec signifie littéralement « secouer » ou « agiter » et peut évoquer ici les sabots violemment lancés contre Héliodore.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: apparut
  rationale: 'L’aoriste passif de ὁράω a ici un sens intransitif : le cheval devient visible. « Apparut » rend naturellement la soudaineté de la manifestation sans en préciser la nature.'
- source_word: τις ἵππος
  choice: un cheval
  rationale: τις est indéfini dans ce contexte ; le français n’a pas besoin d’ajouter « un certain ».
- source_word: φοβερὸν ἔχων τὸν ἐπιβάτην
  choice: portant un cavalier terrifiant
  rationale: La tournure conserve le lien syntaxique entre le cheval et celui qui le monte ; « terrifiant » exprime le fait que φοβερός inspire la peur.
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  choice: paré d’un magnifique harnachement
  rationale: σαγή désigne ici l’équipement ornemental du cheval. « Harnachement » est plus large et plus sûr que « housse de selle », tandis que « magnifique » rend naturellement la valeur intensive du superlatif καλλίστῃ.
- source_word: φερόμενος δὲ ῥύδην
  choice: s’élançant avec impétuosité
  rationale: La formulation exprime à la fois la rapidité et la violence du mouvement, sans alourdir la phrase.
- source_word: ἔσεισεν
  choice: frappa
  rationale: Le sens premier est « secouer » ou « agiter », mais, avec les sabots comme moyen de l’action et Héliodore comme cible, le contexte décrit une attaque violente. La note conserve la nuance littérale.
- source_word: τὰς ἐμπροσθίους ὁπλάς
  choice: de ses sabots de devant
  rationale: ὁπλή désigne précisément le sabot, et ἐμπροσθίους les membres antérieurs. Cette expression est claire en français courant.
- source_word: ὁ δὲ ἐπικαθήμενος
  choice: Celui qui le montait
  rationale: Cette formulation garde la reprise descriptive du participe substantivé grec au lieu de répéter simplement « le cavalier ».
- source_word: χρυσῆν πανοπλίαν
  choice: une armure d’or
  rationale: πανοπλία désigne l’armure complète. « Armure d’or » est naturel et ne réduit pas nécessairement l’expression à une simple couleur dorée.
theological_decisions:
- issue: Nature de l’apparition dans cette scène de jugement au Temple
  choice: Présenter directement le cheval et son cavalier comme apparaissant et agissant dans le récit
  alternative: Qualifier explicitement la scène de vision ou de représentation symbolique
  rationale: Le grec raconte une apparition et une attaque en termes concrets, sans trancher explicitement entre manifestation physique et vision. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement segmentées pour rester naturelles et lisibles, tout en conservant l’enchaînement et les répétitions descriptives du grec.
