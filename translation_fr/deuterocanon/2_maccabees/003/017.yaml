  text: For a certain dread and bodily trembling had come over the man[a], by which the pain present in his heart was becoming evident to those who were watching.
translation:
  language: fr
  text: Car une sorte d’effroi et un tremblement du corps avaient saisi cet homme, laissant voir à ceux qui l’observaient la douleur qui habitait son cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’angoisse qui étreignait son cœur » ; le grec peut désigner une détresse intérieure aussi bien que la douleur au sens général.
    reason: lexical_alternative
lexical_decisions:
- source_word: περικεχύτο
  choice: avaient saisi
  rationale: Le plus-que-parfait rend l’état résultant du parfait grec, tandis que « saisir » exprime naturellement en français une émotion qui s’empare de quelqu’un.
- source_word: δέος τι
  choice: une sorte d’effroi
  rationale: « Effroi » traduit une peur intense; « une sorte de » conserve la nuance indéfinie et atténuante de τι.
- source_word: φρικασμὸς σώματος
  choice: un tremblement du corps
  rationale: Cette formulation claire maintient explicitement la manifestation physique du frisson ou tremblement.
- source_word: διʼ ὧν
  choice: laissant voir
  rationale: La tournure participiale rend naturellement le moyen par lequel l’état intérieur devenait manifeste; elle renvoie ensemble à l’effroi et au tremblement.
- source_word: πρόδηλον ἐγίνετο
  choice: laissant voir
  rationale: L’expression restitue la manifestation perceptible et progressive impliquée par l’imparfait ἐγίνετο.
- source_word: τοῖς θεωροῦσιν
  choice: à ceux qui l’observaient
  rationale: « Observer » conserve la valeur verbale du participe et convient aux témoins attentifs de la scène.
- source_word: τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος
  choice: la douleur qui habitait son cœur
  rationale: Cette expression française naturelle garde le cœur comme siège de la souffrance intérieure et rend ἐνεστὸς comme une douleur actuellement présente, sans imposer qu’elle soit seulement physique ou seulement émotionnelle.
