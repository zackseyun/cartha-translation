  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
translation:
  language: fr
  text: Car celui qui a sa demeure dans le ciel veille lui-même sur ce lieu[b] et lui vient en aide ; il frappe et fait périr ceux qui viennent pour faire du mal à ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: C’est-à-dire le Temple ; le grec dit plus littéralement « ce lieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίαν ἐπουράνιον ἔχων
  choice: qui a sa demeure dans le ciel
  rationale: Cette formulation naturelle conserve l’image grecque de la demeure céleste et rattache clairement le participe au sujet.
- source_word: ἐπόπτης
  choice: veille sur
  rationale: Le verbe français exprime la surveillance attentive impliquée par le nom grec, sans introduire un titre administratif peu naturel ici.
- source_word: βοηθός
  choice: lui vient en aide
  rationale: Cette expression rend le sens fondamental de celui qui porte secours, tout en restant distincte de l’idée de surveillance.
- source_word: ἐκείνου τοῦ τόπου
  choice: ce lieu
  rationale: Le grec dit littéralement « ce lieu »; le contexte désigne le Temple, mais la traduction ne précise pas davantage que le texte source.
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  choice: ceux qui viennent pour lui nuire
  rationale: La formulation rend la venue et la finalité nuisible exprimée par ἐπί avec le datif; le pronom renvoie naturellement au lieu.
- source_word: τύπτων ἀπόλλυσι
  choice: il frappe et fait périr
  rationale: Cette coordination française restitue clairement l’action violente du participe et son résultat destructeur, sans archaïsme.
theological_decisions:
- issue: Référent de αὐτός
  choice: Le sujet reste exprimé par « celui-là même », le contexte identifiant Dieu.
  alternative: Nommer explicitement Dieu comme celui qui demeure dans le ciel.
  rationale: Le grec souligne le sujet par αὐτός sans ajouter ici le nom de Dieu; la traduction préserve cette référence contextuelle et son emphase.
translation_notes:
  register: Français international moderne, digne et accessible. « Celui-là même » conserve l’emphase de αὐτός; « veille sur » évite le substantif administratif « surveillant » et forme avec « vient en aide » un couple naturel.
