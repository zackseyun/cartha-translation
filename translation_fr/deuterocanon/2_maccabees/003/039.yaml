  - severity: medium
    issue: Antécédent ambigu de « lui » dans « pour lui nuire »
    rationale: En français, « lui » peut renvoyer soit à celui qui demeure au ciel, soit à « ce lieu ». Une expression nominale explicite rend le référent cultuel intelligible sans ajouter au grec.
