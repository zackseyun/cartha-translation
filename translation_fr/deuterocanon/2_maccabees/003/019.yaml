translation:
  language: fr
  text: Les femmes, avec de la toile de sac nouée sous la poitrine[a], affluaient dans les rues[b]. Les vierges qui étaient enfermées, les unes accouraient vers les portes, les autres vers les remparts, et certaines se penchaient pour regarder par les fenêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La toile de sac, tissu grossier porté ici autour de la poitrine, était un signe de deuil et de détresse.
    reason: cultural_note
  - marker: b
    text: L’expression grecque signifie littéralement qu’elles « se multipliaient le long des rues ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι … σάκκους ὑπὸ τοὺς μαστούς
  choice: avec de la toile de sac nouée sous la poitrine
  rationale: Cette formulation conserve l’image concrète du grec — la toile de sac fixée sous les seins — tout en employant « poitrine », plus naturel et digne en français dans ce contexte de deuil.
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  choice: affluaient dans les rues
  rationale: Le grec signifie littéralement qu’elles « se multipliaient » le long des rues. « Affluaient » exprime naturellement leur présence en grand nombre et leur mouvement dans l’espace public.
- source_word: κατάκλειστοι
  choice: qui étaient tenues enfermées
  rationale: Le terme désigne des personnes enfermées ou gardées à l’intérieur. Cette traduction conserve la nuance d’une réclusion imposée sans préciser davantage sa cause.
- source_word: παρθένων
  choice: jeunes filles vierges
  rationale: « Vierges » préserve la précision de παρθένοι; l’ajout de « jeunes filles » donne en français une désignation personnelle naturelle plutôt qu’un substantif potentiellement abrupt.
- source_word: συνέτρεχον
  choice: accouraient
  rationale: Le verbe exprime une course empressée et convergente. « Accouraient » rend la hâte sans alourdir la phrase par un « ensemble » peu idiomatique.
- source_word: πυλῶνας
  choice: portes
  rationale: Dans ce cadre urbain, le mot désigne les portes ou grands passages d’accès; « portes » est clair et naturel.
- source_word: τείχη
  choice: remparts
  rationale: Le pluriel désigne ici les murailles défensives de la ville. « Remparts » explicite naturellement cette réalité urbaine.
- source_word: διὰ τῶν θυρίδων διεκύπτον
  choice: se penchaient pour regarder par les fenêtres
  rationale: Le verbe évoque le fait de se pencher depuis l’intérieur afin de regarder dehors; cette formulation rend à la fois le mouvement et l’observation continue.
