  text: And since he was unable to overcome Onias[a], he went to Apollonius son of Thrasaeus[b], who at that time was governor of Coele-Syria and Phoenicia.
translation:
  language: fr
  text: Comme il ne pouvait l’emporter sur Onias, il se rendit auprès d’Apollonios, fils de Thraséas[a], qui était alors gouverneur[b] de la Cœlé-Syrie et de la Phénicie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Apollonios de Thraséas » ; le génitif grec peut être lu comme un patronyme, rendu ici par « fils de Thraséas ».
    reason: lexical_alternative
  - marker: b
    text: Le titre grec peut désigner un général ou un gouverneur ; le contexte met ici l’accent sur l’autorité exercée sur une région.
    reason: lexical_alternative
lexical_decisions:
- source_word: νικήσαι
  choice: l’emporter sur
  rationale: Le verbe exprime ici le fait de prendre le dessus sur Onias dans leur opposition, sans suggérer nécessairement une défaite militaire.
- source_word: μὴ δυνάμενος
  choice: comme il ne pouvait
  rationale: Le participe circonstanciel indique naturellement la cause de la démarche qui suit.
- source_word: ἦλθεν πρὸς
  choice: il se rendit auprès de
  rationale: Cette tournure française rend le déplacement vers Apollonios dans un registre narratif digne et naturel.
- source_word: Ἀπολλώνιον Θρασαίου
  choice: Apollonios, fils de Thrasée
  rationale: Le génitif Θρασαίου s’interprète le plus naturellement comme un patronyme; la filiation est explicitée en français tout en étant signalée comme interprétative dans une note.
- source_word: τὸν ... στρατηγόν
  choice: qui était ... gouverneur
  rationale: Dans ce contexte hellénistique, le titre désigne vraisemblablement l’administrateur ayant autorité sur les deux régions, même s’il peut aussi désigner un chef militaire.
- source_word: κατʼ ἐκεῖνον τὸν καιρόν
  choice: alors
  rationale: « Alors » situe sobrement la fonction d’Apollonios au moment du récit.
- source_word: Κοίλης Συρίας καὶ Φοινίκης
  choice: de la Cœlé-Syrie et de la Phénicie
  rationale: « Cœlé-Syrie » et « Phénicie » sont les appellations françaises établies de ces régions historiques.
