  terminology: « Seigneur tout-puissant » rend convenablement παγκρατῆ κύριον. « Biens confiés » convient à τὰ πεπιστευμένα. La formulation révisée distingue les biens déposés de leurs déposants sans créer un référent non textuel pour « lui ».
