  source_fidelity: 'Le sens général est bien rendu : il s’agit d’un appel continu au Seigneur tout-puissant pour que les biens remis en dépôt soient conservés sains et saufs. Toutefois, « lui avaient remis » introduit un destinataire singulier qui n’est pas exprimé dans le grec et peut, en français, renvoyer indûment au Seigneur. Il faut éviter cet ajout contextuel dans le texte principal.'
