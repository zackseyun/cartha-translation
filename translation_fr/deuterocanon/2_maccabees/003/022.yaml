  text: So then they were calling on the all-powerful Lord to keep what had been entrusted to those who had made the deposit safe with all security[a].
translation:
  language: fr
  text: Ils invoquaient donc le Seigneur tout-puissant, afin qu’il préserve en parfaite sécurité les biens confiés pour ceux qui les avaient déposés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « les choses confiées à ceux qui les avaient confiées ». Il désigne les biens remis en dépôt et les personnes qui les avaient déposés.'
    reason: La construction participiale grecque est elliptique et répétitive; la note explique le lien entre les biens et leurs déposants sans ajouter de destinataire non exprimé.
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: ils invoquaient
  rationale: L’imparfait exprime une supplication en cours; « invoquer » convient naturellement à un appel adressé à Dieu.
- source_word: παγκρατῆ
  choice: tout-puissant
  rationale: Le terme désigne celui dont la puissance s’étend à tout; « tout-puissant » est clair, digne et traditionnel sans être archaïque.
- source_word: κύριον
  choice: Seigneur
  rationale: Titre révérenciel désignant Dieu; « Seigneur » est l’équivalent français normal de κύριος dans ce contexte.
- source_word: τὰ πεπιστευμένα
  choice: les biens confiés
  rationale: Le participe parfait substantivé désigne ici les biens remis en dépôt, comme l’indique le contexte.
- source_word: τοῖς πεπιστευκόσιν
  choice: par ceux qui les lui avaient remis
  rationale: Le participe parfait actif désigne les personnes ayant confié ces biens. La tournure française explicite la relation; « lui » renvoie au temple ou trésor dépositaire impliqué par le contexte, sans identifier Dieu comme destinataire du dépôt.
- source_word: σῶα διαφυλάσσειν
  choice: qu’il garde
  rationale: L’idée de conserver les biens intacts est rendue par « garder », tandis que la locution suivante exprime pleinement leur sécurité.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: en parfaite sécurité
  rationale: Cette formulation française naturelle conserve l’intensification de πάσης et l’idée de protection sûre.
theological_decisions:
- issue: Traduction du titre divin κύριον
  choice: Seigneur
  alternative: Maître
  rationale: Le mot vise Dieu comme destinataire de la prière; « Seigneur » conserve le titre religieux usuel sans ajouter de précision doctrinale.
- issue: Référent des biens confiés
  choice: les biens confiés par ceux qui les lui avaient remis
  alternative: ce qui avait été confié à ceux qui l’avaient confié
  rationale: La construction grecque distingue les biens déposés et leurs propriétaires déposants. Le français explicite ce rapport tout en signalant par une note l’ellipse contextuelle du lieu dépositaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement de la phrase grecque tout en évitant une répétition lourde de « confier ». « En parfaite sécurité » rend naturellement l’emphase finale.
