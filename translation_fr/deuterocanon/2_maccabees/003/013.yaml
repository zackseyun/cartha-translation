  text: But the other[a], because he had royal orders, kept insisting that these things were to be taken into the royal treasury.
translation:
  language: fr
  text: Mais l’autre, puisqu’il avait reçu des ordres royaux, soutenait avec insistance que ces biens devaient être transférés au trésor royal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au trésor du roi ». Dans ce contexte, le grec εἰς τὸ βασιλικόν désigne probablement le fisc ou le trésor royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δ᾽ ἕτερος
  choice: Mais l’autre
  rationale: La formule marque le contraste avec l’interlocuteur précédent sans ajouter un nom absent du grec.
- source_word: δι᾽ ἃς εἶχεν βασιλικὰς ἐντολάς
  choice: puisqu’il avait reçu des ordres royaux
  rationale: Le tour exprime la raison invoquée; «avait reçu» rend naturellement en français le fait qu’il détenait des ordres émanant du roi.
- source_word: πάντως ἔλεγεν
  choice: soutenait avec insistance
  rationale: L’imparfait ἔλεγεν et l’adverbe πάντως indiquent une affirmation persistante et appuyée.
- source_word: εἰς τὸ βασιλικὸν
  choice: au trésor royal
  rationale: Dans ce contexte de biens et de confiscation, le neutre substantivé désigne vraisemblablement le fisc ou trésor du roi.
- source_word: ἀναλημπτέα
  choice: devaient être transférés
  rationale: L’adjectif verbal exprime la nécessité; «transférés» rend la prise en charge au bénéfice du trésor sans suggérer seulement un déplacement matériel.
- source_word: ταῦτα
  choice: ces biens
  rationale: Le démonstratif pluriel renvoie aux valeurs dont il est question; «biens» explicite sobrement le référent financier en français.
