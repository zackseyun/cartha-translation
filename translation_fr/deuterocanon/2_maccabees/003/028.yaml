revisions:
- from: L’homme qui venait d’entrer dans la salle du trésor déjà mentionnée, au milieu d’une grande agitation et avec toute son escorte[a], était emporté, sans que personne puisse lui venir en aide, totalement terrassé[b] et ayant manifestement reconnu la puissance souveraine.
  to: L’homme qui venait d’entrer dans la salle du trésor déjà mentionnée, au milieu d’une grande agitation et avec toute son escorte[a], on l’emportait sans secours, entièrement réduit à l’impuissance[b], ayant manifestement reconnu la puissance souveraine.
  rationale: La révision conserve tous les éléments du grec et les deux ancres de note. Elle remplace une voix passive française moins idiomatique par l’impersonnel narratif, rend ἀβοήθητον par « sans secours » et explicite avec retenue l’état total exprimé par τοῖς ὅλοις καθεστῶτα. « Ayant manifestement reconnu » conserve la valeur de reconnaissance acquise de ἐπεγνωκότα sans imposer un développement théologique.
  reviewer_model: gpt-5.6-terra
