  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
translation:
  language: fr
  text: L’homme qui venait d’entrer dans la salle du trésor déjà mentionnée, au milieu d’une grande agitation et avec toute son escorte[a], on l’emportait sans secours, entièrement réduit à l’impuissance[b], ayant manifestement reconnu la puissance souveraine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec toute sa garde rapprochée ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est difficile ; elle décrit l’état d’un homme entièrement réduit à l’impuissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτι ... εἰσελθόντα
  choice: L’homme qui venait d’entrer
  rationale: L’article suivi du participe a une valeur substantivale et désigne Héliodore. « Venait d’entrer » rend naturellement ἄρτι avec le participe aoriste.
- source_word: μετὰ πολλῆς παραδρομῆς
  choice: au milieu d’une grande agitation
  rationale: παραδρομή évoque des déplacements empressés, une agitation pouvant aussi avoir un caractère ostentatoire. Cette formulation garde l’idée concrète sans imposer celle de faste.
- source_word: πάσης δορυφορίας
  choice: avec toute son escorte
  rationale: δορυφορία désigne une garde rapprochée ou une escorte armée. « Escorte » convient ici au groupe qui accompagne son entrée.
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  choice: la salle du trésor déjà mentionnée
  rationale: γαζοφυλάκιον peut désigner le trésor ou la pièce où il est conservé; προειρημένον est explicitement conservé par « déjà mentionnée ».
- source_word: ἔφερον
  choice: était emporté
  rationale: L’imparfait décrit la scène en cours. Le mouvement vers l’extérieur est implicite dans le contexte plutôt qu’exprimé par le verbe grec lui-même.
- source_word: ἀβοήθητον
  choice: sans que personne puisse lui venir en aide
  rationale: L’adjectif signifie « privé de secours, sans aide ». La tournure française exprime sa situation d’impuissance et l’inefficacité de son escorte.
- source_word: τοῖς ὅλοις καθεστῶτα
  choice: totalement terrassé
  rationale: Expression idiomatique difficile décrivant l’état complet d’abattement auquel il a été réduit. « Terrassé » convient à la scène sans préciser indûment la nature médicale de son état.
- source_word: φανερῶς
  choice: manifestement
  rationale: L’adverbe indique que cette reconnaissance était évidente.
- source_word: τὴν δυναστείαν
  choice: la puissance souveraine
  rationale: δυναστεία réunit les nuances de puissance et d’autorité dominatrice. Le choix conserve l’abstraction du grec.
- source_word: ἐπεγνωκότα
  choice: ayant manifestement reconnu
  rationale: ἐπιγινώσκω exprime ici une reconnaissance acquise par l’expérience de l’événement; le participe marque l’état résultant.
theological_decisions:
- issue: Référent de « la puissance souveraine »
  choice: Conserver l’expression abstraite sans ajouter explicitement « de Dieu »
  alternative: « la puissance souveraine de Dieu »
  rationale: Le contexte identifie cette puissance comme divine et protectrice du Temple, mais le verset emploie seulement δυναστεία. La traduction préserve cette retenue et laisse le contexte préciser le référent.
translation_notes:
  register: 'Français international actuel, digne et narratif. La syntaxe française réorganise légèrement la longue construction participiale grecque tout en gardant son contraste: entrée imposante, sortie dans une impuissance totale.'
