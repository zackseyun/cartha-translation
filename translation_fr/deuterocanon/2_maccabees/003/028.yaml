review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu et l’antécédent du participe substantivé est correctement identifié comme Héliodore. Toutefois, « était emporté » est peu naturel ici et affaiblit inutilement l’agent pluriel implicite de ἔφερον. « Totalement terrassé » est possible dans le contexte, mais « entièrement réduit à l’impuissance » rend plus directement l’état résultant exprimé par τοῖς ὅλοις καθεστῶτα, sans suggérer plus précisément le moyen par lequel il a été abattu.
  naturalness: La longue phrase est recevable, mais la construction passive « était emporté » sonne moins idiomatique que l’impersonnel narratif « on l’emportait ». « Sans secours » est une formulation concise, littéraire sans être archaïque, qui correspond à ἀβοήθητον.
  terminology: « Salle du trésor déjà mentionnée », « escorte » et « puissance souveraine » sont fidèles et cohérents. Le référent divin demeure, à bon droit, implicite dans ce verset.
  issues:
  - severity: low
    issue: Tour passive « était emporté »
    rationale: Le grec emploie un verbe actif pluriel dont l’agent n’est pas précisé. En français, « on l’emportait » maintient cette absence d’identification tout en étant plus naturel.
  - severity: low
    issue: « Totalement terrassé » interprète légèrement l’état décrit
    rationale: La formule grecque difficile indique avant tout une condition d’impuissance complète. Une formulation centrée sur cette condition est plus proche du texte et de la note explicative.
