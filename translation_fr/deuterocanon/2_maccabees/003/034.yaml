  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
translation:
  language: fr
  text: Mais toi, qui as été flagellé depuis le ciel, proclame à tous la puissance majestueuse de Dieu[a]. Après avoir dit ces paroles, ils devinrent invisibles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la grandeur de la puissance de Dieu ». L’expression grecque associe les notions de grandeur ou de majesté et de puissance.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils disparurent » ; littéralement, « ils devinrent invisibles » ou « non visibles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  choice: qui as été flagellé
  rationale: Le participe parfait passif présente Héliodore comme ayant subi une sévère flagellation dont les effets demeurent. « Flagellé » conserve la force physique et le registre solennel du grec.
- source_word: ἐξ οὐρανοῦ
  choice: depuis le ciel
  rationale: Cette formulation exprime l’origine céleste du châtiment sans expliciter davantage l’agent que ne le fait le grec.
- source_word: διάγγελλε
  choice: proclame
  rationale: L’impératif appelle une annonce publique et largement diffusée ; « proclame » en restitue la force.
- source_word: πᾶσι
  choice: à tous
  rationale: Le datif désigne les destinataires de la proclamation et garde ici sa portée générale.
- source_word: τὸ μεγαλεῖον … κράτος
  choice: la puissance majestueuse
  rationale: Cette expression française associe naturellement les deux notions grecques de grandeur ou majesté et de puissance, sans réduire l’une à l’autre.
- source_word: ἀφανεῖς ἐγένοντο
  choice: ils devinrent invisibles
  rationale: Le grec dit littéralement qu’ils devinrent non visibles. Cette traduction préserve la texture surnaturelle du récit plutôt que d’indiquer simplement leur départ.
theological_decisions:
- issue: Agent du châtiment exprimé par « depuis le ciel »
  choice: Conserver « depuis le ciel » sans ajouter « par Dieu »
  alternative: « flagellé par Dieu depuis le ciel » ou « châtié par le ciel »
  rationale: Le contexte implique une intervention divine, mais le grec n’en nomme pas explicitement l’agent dans cette expression. La traduction maintient cette retenue.
- issue: Disparition surnaturelle des personnages célestes
  choice: « ils devinrent invisibles »
  alternative: « ils disparurent » ou « ils s’évanouirent à la vue »
  rationale: La formulation retenue suit de près l’idée grecque de devenir non visible et n’ajoute aucun déplacement au récit.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « devinrent » convient au registre narratif biblique sans être archaïque ; « proclame » et « flagellé » préservent la solennité et la vigueur du grec.
