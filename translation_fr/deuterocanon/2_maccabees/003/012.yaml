base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/012.yaml
  text: and that to wrong those who had trusted in the holiness of the place[a], and in the majesty and inviolability of the temple honored throughout the whole world, was utterly impossible.
translation:
  language: fr
  text: et qu’il était absolument impossible de faire du tort à ceux qui avaient placé leur confiance dans la sainteté du lieu, ainsi que dans la majesté et l’inviolabilité[a] du temple honoré dans le monde entier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « droit d’asile » : protection sacrée et juridique dont jouissait le temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκησαί
  choice: faire du tort
  rationale: 'Cette expression française naturelle conserve la portée morale et juridique du verbe : agir injustement envers quelqu’un, sans suggérer nécessairement une atteinte physique.'
- source_word: τοὺς πεπιστευκότας
  choice: ceux qui avaient placé leur confiance
  rationale: Le participe parfait exprime une confiance déjà établie et durable; cette formulation convient aux compléments au datif qui désignent le caractère sacré et la protection du sanctuaire.
- source_word: ἁγιωσύνῃ
  choice: sainteté
  rationale: Le terme désigne le caractère saint ou sacré du lieu; « sainteté » en est l’équivalent direct et intelligible.
- source_word: σεμνότητι
  choice: majesté
  rationale: Dans ce contexte, le mot évoque la dignité auguste qui inspire le respect; « majesté » restitue ce registre élevé avec naturel.
- source_word: ἀσυλίᾳ
  choice: inviolabilité
  rationale: Le terme désigne l’immunité contre la saisie ou la profanation, avec une possible nuance de droit d’asile. « Inviolabilité » préserve ici son sens large, tandis que la note signale la nuance juridique.
- source_word: τετιμημένου
  choice: honoré
  rationale: Le participe parfait passif présente le temple comme jouissant d’un honneur reconnu et durable.
- source_word: κατὰ τὸν σύμπαντα κόσμον
  choice: dans le monde entier
  rationale: Cette tournure française courante conserve la portée universelle et rhétorique de l’expression grecque.
- source_word: παντελῶς ἀμήχανον εἶναι
  choice: était absolument impossible
  rationale: « Absolument » rend l’intensification de παντελῶς, et « impossible » exprime directement ἀμήχανον.
theological_decisions:
- issue: Faut-il rendre ἀσυλίᾳ par un terme explicitement lié au droit d’asile ?
  choice: inviolabilité
  alternative: droit d’asile; statut de lieu d’asile
  rationale: Le grec peut désigner expressément le privilège d’asile, mais il est ici coordonné à des qualités abstraites du temple. « Inviolabilité » maintient l’idée générale de protection juridico-sacrée sans réduire prématurément le sens; la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase garde sa forme de proposition coordonnée, conformément au contexte, et évite un vocabulaire confessionnel spécialisé.
