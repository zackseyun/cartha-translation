  verdict: revise
  source_fidelity: La traduction rend bien le mouvement collectif, l’urgence de l’imparfait ἐξεπήδων et le caractère imminent de la menace. Toutefois, « Ceux qui étaient dans les maisons » déplace légèrement ἐκ τῶν οἰκιῶν (« des maisons ») vers une localisation statique. « Être traité avec mépris » explicite de façon interprétative l’expression εἰς καταφρόνησιν ἔρχεσθαι; « tomber dans le mépris » en conserve mieux l’image et évite d’introduire un agent implicite.
  naturalness: La phrase révisée reste fluide dans un français international moderne. « Les gens sortaient des maisons » est plus naturel et plus fidèle que « Ceux qui étaient dans les maisons ».
  terminology: « Supplication publique » rend convenablement πανδήμῳ ἱκετείᾳ sans réduire la dimension solennelle de ἱκετεία ni préciser indûment le cadre. « Le lieu » conserve l’indétermination lexicale de τόπος; la note identifie sobrement le référent contextuel.
  issues:
