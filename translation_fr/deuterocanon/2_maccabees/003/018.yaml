  text: And those from the houses were rushing out in groups for a public supplication[a], because the place was about to come into contempt.
translation:
  language: fr
  text: Les gens sortaient des maisons, par groupes, pour une supplication publique, car le lieu[a] allait tomber dans le mépris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du Temple ou de son enceinte ; le grec dit simplement « le lieu ».
    reason: Précision du référent contextuel tout en conservant dans le texte principal le terme général du grec.
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  choice: Ceux qui étaient dans les maisons
  rationale: La tournure désigne collectivement les habitants qui sortent des maisons. Cette formulation naturelle n’ajoute pas le possessif « leurs », absent du grec.
- source_word: ἀγεληδὸν
  choice: par groupes
  rationale: L’adverbe évoque littéralement un déplacement en troupeaux ou en bandes. « Par groupes » conserve l’idée du mouvement collectif sans connotation animale déplacée.
- source_word: ἐξεπήδων
  choice: en sortaient précipitamment
  rationale: L’imparfait grec présente une action en cours, tandis que le verbe exprime une sortie vive et soudaine. « Sortaient précipitamment » rend cette urgence en français courant.
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  choice: pour une supplication de tout le peuple
  rationale: ἱκετεία désigne une supplication solennelle et pressante; πάνδημος indique ici qu’elle rassemble l’ensemble du peuple. La formulation retient à la fois la gravité et la dimension collective.
- source_word: διὰ τὸ μὴ μέλλειν
  choice: car … allait
  rationale: Dans cette construction contextuelle, l’expression présente l’atteinte redoutée comme imminente. « Allait » communique cette proximité de manière idiomatique.
- source_word: εἰς καταφρόνησιν ἔρχεσθαι
  choice: être traité avec mépris
  rationale: L’expression signifie littéralement « en venir au mépris ». La tournure choisie explicite naturellement que le lieu sacré est sur le point de subir un traitement méprisant.
- source_word: τὸν τόπον
  choice: le lieu
  rationale: Le grec emploie le terme général τόπος. Bien que le contexte désigne le Temple ou son enceinte, « le lieu » préserve le degré d’explicitation du texte source.
theological_decisions:
- issue: Référent de τὸν τόπον
  choice: « le lieu », compris dans le contexte comme le Temple ou son enceinte
  alternative: « le sanctuaire » ou « le Temple »
  rationale: Le contexte immédiat concerne le Temple de Jérusalem menacé de profanation, mais le grec conserve ici le terme général τόπος. Le texte principal maintient cette formulation sans imposer un terme plus précis.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement collectif et l’urgence du grec, tout en évitant les formulations littérales peu naturelles telles que « en troupeau » ou « venir dans le mépris ».
