    issue: Rendu de οἱ δὲ ἐκ τῶν οἰκιῶν
    rationale: « Ceux qui étaient dans les maisons » traduit une situation (« dans ») plutôt que le point de départ exprimé par ἐκ (« hors de, depuis »).
  - severity: low
    issue: Rendu de εἰς καταφρόνησιν ἔρχεσθαι
    rationale: « Allait être traité avec mépris » est possible contextuellement, mais introduit un traitement subi et donc un agent qui n’est pas exprimé. « Allait tomber dans le mépris » est plus proche de l’image grecque.
  revised_text: Les gens sortaient des maisons, par groupes, pour une supplication publique, car le lieu[a] allait tomber dans le mépris.
