base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
translation:
  language: fr
  text: Mais lui, ayant adopté une noble résolution digne de son âge, de l’éminente dignité de sa vieillesse, de la manière de vivre distinguée qu’il avait acquise et de sa conduite exemplaire depuis l’enfance — mieux encore, en conformité avec la Loi sainte établie par Dieu —, déclara sans détour qu’on l’envoie sans tarder dans l’Hadès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le séjour des morts ». Grec : « dans l’Hadès ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον
  choice: une noble résolution
  rationale: λογισμός désigne ici une décision mûrement réfléchie, et ἀστεῖος en souligne la qualité morale et honorable.
- source_word: ἀναλαβὼν
  choice: ayant pris
  rationale: Cette tournure française naturelle exprime le fait d’adopter fermement une résolution.
- source_word: ἄξιον τῆς ἡλικίας
  choice: digne de son âge
  rationale: La formulation conserve l’évaluation exprimée par ἄξιον et le sens courant de ἡλικία.
- source_word: τῆς τοῦ γήρους ὑπεροχῆς
  choice: de l’éminente dignité de sa vieillesse
  rationale: ὑπεροχή évoque l’éminence ou la supériorité; « dignité » rend ici la valeur honorable attachée au grand âge.
- source_word: τῆς ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  choice: de la conduite distinguée et remarquable qu’il s’était acquise
  rationale: πολιτεία renvoie ici à la conduite ou à la manière de vivre. La tournure cherche à conserver à la fois l’idée d’une qualité acquise (ἐπίκτητος) et celle d’une distinction manifeste (ἐπιφανής), sans réduire le terme à la citoyenneté.
- source_word: τῆς ἐκ παιδὸς καλλίστης ἀναστροφῆς
  choice: de son excellente manière de vivre depuis l’enfance
  rationale: ἀναστροφή désigne la conduite ou la manière de vivre; « depuis l’enfance » conserve la portée temporelle de ἐκ παιδός.
- source_word: μᾶλλον δὲ
  choice: ou plutôt
  rationale: La locution marque une reprise corrective qui présente la fidélité à la Loi comme le motif décisif.
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  choice: à la Loi sainte établie par Dieu
  rationale: νομοθεσία désigne la Loi ou l’institution législative, tandis que θεόκτιστος affirme son établissement par Dieu. La majuscule signale naturellement la Loi divine dans ce contexte.
- source_word: ἀκολούθως
  choice: conforme à
  rationale: Le terme exprime l’accord de la résolution avec la Loi.
- source_word: ἀπεφήνατο
  choice: se prononça sans détour
  rationale: Le moyen grec exprime une prise de position personnelle et nette; cette expression française en restitue le caractère explicite.
- source_word: ταχέως λέγων προπέμπειν εἰς τὸν ᾅδην
  choice: qu’on l’envoie sans tarder dans l’Hadès
  rationale: La formulation conserve l’ordre donné de le faire partir vers l’Hadès et rattache naturellement ταχέως à cet envoi, tout en évitant de confondre ᾅδης avec l’enfer du jugement final.
theological_decisions:
- issue: Sens de ᾅδης
  choice: l’Hadès
  alternative: le séjour des morts
  rationale: Le grec désigne le domaine des morts, non explicitement le lieu du châtiment final. Le terme translittéré préserve cette distinction, et la note en donne le sens au lecteur.
- issue: Origine divine de la νομοθεσία
  choice: la Loi sainte établie par Dieu
  alternative: la sainte législation donnée par Dieu
  rationale: Cette traduction maintient l’affirmation de l’origine ou de l’établissement divin de la Loi sans préciser davantage le mode de cette action.
- issue: Force corrective de μᾶλλον δὲ
  choice: ou plutôt
  alternative: bien plus
  rationale: « Ou plutôt » laisse entendre que les considérations humaines précédentes sont reprises et dépassées par le motif suprême de la fidélité à la Loi, sans les annuler entièrement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période et l’accumulation honorifique du grec sont conservées, avec une ponctuation qui en facilite la lecture. « Hadès » est explicité en note afin d’éviter l’assimilation à « enfer ».
