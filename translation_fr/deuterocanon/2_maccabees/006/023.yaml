revisions:
- from: 'Mais lui, ayant pris une noble résolution, digne de son âge, de l’éminente dignité de sa vieillesse, de la conduite distinguée et remarquable qu’il s’était acquise et de son excellente manière de vivre depuis l’enfance — ou plutôt, conforme à la Loi sainte établie par Dieu —, se prononça sans détour : qu’on l’envoie sans tarder dans l’Hadès[a].'
  to: Mais lui, ayant adopté une noble résolution digne de son âge, de l’éminente dignité de sa vieillesse, de la manière de vivre distinguée qu’il avait acquise et de sa conduite exemplaire depuis l’enfance — mieux encore, en conformité avec la Loi sainte établie par Dieu —, déclara sans détour qu’on l’envoie sans tarder dans l’Hadès[a].
  rationale: La révision conserve l’ensemble du contenu et de la progression rhétorique du grec, tout en corrigeant une suspension syntaxique et en améliorant le rendu de ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας. La note reste correctement ancrée à « Hadès » et maintient l’alternative lexicale sans orientation doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : résolution mûrie et noble, motifs liés à l’âge, à la réputation acquise, à la conduite depuis l’enfance, et surtout conformité à la Loi sainte d’origine divine. « Hadès » préserve justement le référent de ᾅδης sans l’assimiler à l’enfer. Une révision légère est néanmoins préférable : « conduite distinguée et remarquable » redouble ἐπιφανής et rend moins explicitement ἐπίκτητος ; la construction « — ou plutôt, conforme à … — » est également syntaxiquement suspendue en français.'
  naturalness: Le registre est soutenu et accessible, mais la période gagne en lisibilité avec « mieux encore, en conformité avec… » et avec une déclaration introduite directement par « déclara sans détour qu’on… ». « Sans tarder » rend naturellement ταχέως.
  terminology: « Noble résolution », « Loi sainte établie par Dieu » et « l’Hadès » sont appropriés. « Manière de vivre distinguée qu’il avait acquise » rend les deux qualificatifs de πολιτεία sans imposer le sens institutionnel de « citoyenneté ». « Conduite exemplaire depuis l’enfance » rend naturellement ἀναστροφή tout en maintenant la référence au comportement durable.
  issues:
  - severity: medium
    issue: Construction syntaxique ambiguë autour de « ou plutôt, conforme à la Loi… »
    rationale: Dans le texte grec, μᾶλλον δὲ et ἀκολούθως font de l’adhésion à la Loi le motif décisif de la déclaration. En français, l’adjectif isolé « conforme » peut sembler se rapporter de manière hésitante à « résolution » ou à « lui ». Une formulation adverbiale clarifie le lien sans ajouter de sens.
  - severity: low
    issue: « conduite distinguée et remarquable qu’il s’était acquise » est lourd et partiellement redondant
    rationale: ἐπίκτητος et ἐπιφανής appellent respectivement l’idée d’un statut ou mode de vie acquis et éminent. « Manière de vivre distinguée qu’il avait acquise » conserve ces deux éléments dans une formulation plus idiomatique.
  revised_text: Mais lui, ayant adopté une noble résolution digne de son âge, de l’éminente dignité de sa vieillesse, de la manière de vivre distinguée qu’il avait acquise et de sa conduite exemplaire depuis l’enfance — mieux encore, en conformité avec la Loi sainte établie par Dieu —, déclara sans détour qu’on l’envoie sans tarder dans l’Hadès[a].
  revised_footnotes:
  - marker: a
    text: 'Ou « dans le séjour des morts ». Grec : « dans l’Hadès ».'
    reason: lexical_alternative
