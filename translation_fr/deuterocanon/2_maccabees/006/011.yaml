revisions:
- from: D’autres encore s’étaient rassemblés dans les grottes des environs pour observer la semaine en secret[a]. Dénoncés à Philippe, ils furent tous livrés aux flammes, car, par respect pour l’honneur de ce jour si saint, ils se faisaient scrupule de se défendre.
  to: D’autres s’étaient rassemblés dans des grottes voisines pour observer secrètement la semaine[a] ; dénoncés auprès de Philippe, ils furent brûlés ensemble, parce que, par égard pour l’honneur de ce jour très saint, ils se faisaient scrupule de se défendre.
  rationale: La révision remplace une périphrase qui affaiblissait le verbe grec par « furent brûlés ensemble », tout en améliorant légèrement l’idiome de la dénonciation. Elle maintient la traduction littérale de « la semaine » dans le texte et la lecture contextuelle « sabbat » exclusivement en note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:38:14Z'
review_pass:
  verdict: revise
  source_fidelity: La structure, la référence à Philippe, l’observance secrète de « la semaine » et le motif religieux du refus de se défendre sont bien rendus. Toutefois, « tous livrés aux flammes » atténue et reformule inutilement συνεφλογίσθησαν, qui indique explicitement qu’ils furent brûlés ensemble. La version révisée restitue ce point directement et conserve la direction/collectivité de leur rassemblement.
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « Dénoncés auprès de Philippe » est plus idiomatique que « dénoncés à Philippe », et une seule phrase rend plus nettement la dépendance des participes grecs sans nuire à la lisibilité.
  terminology: « Observer la semaine » conserve volontairement le lexique inhabituel de ἑβδομάδα; la note explique avec justesse la probable référence au sabbat. « Se faisaient scrupule de se défendre » rend bien la retenue pieuse de εὐλαβῶς ἔχειν, sans imposer d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: « ils furent tous livrés aux flammes »
    rationale: Cette expression ne rend pas directement συνεφλογίσθησαν (« ils furent brûlés ensemble »). Le mot « tous » ne correspond pas exactement à la valeur du préfixe συν-, qui exprime l’action subie collectivement, et « livrés aux flammes » affaiblit le verbe explicite « brûler ».
  - severity: low
    issue: « Dénoncés à Philippe »
    rationale: Le sens est compréhensible, mais « dénoncés auprès de Philippe » est plus naturel en français pour le datif indiquant la personne à qui la dénonciation est faite.
  revised_text: D’autres s’étaient rassemblés dans des grottes voisines pour observer secrètement la semaine[a] ; dénoncés auprès de Philippe, ils furent brûlés ensemble, parce que, par égard pour l’honneur de ce jour très saint, ils se faisaient scrupule de se défendre.
