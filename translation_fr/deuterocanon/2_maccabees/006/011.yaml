base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/011.yaml
  text: But others[a], having gathered nearby in the caves to observe the week in secret, were informed against to Philip and were burned together, because they scrupled to defend themselves out of regard for the honor of that most holy day.
translation:
  language: fr
  text: D’autres s’étaient rassemblés dans des grottes voisines pour observer secrètement la semaine[a] ; dénoncés auprès de Philippe, ils furent brûlés ensemble, parce que, par égard pour l’honneur de ce jour très saint, ils se faisaient scrupule de se défendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour observer le sabbat en secret ». Le grec dit littéralement « observer la semaine en secret », mais le contexte renvoie probablement à l’observance du sabbat.'
    reason: Préserver à la fois la formulation grecque inhabituelle et son sens contextuel probable.
lexical_decisions:
- source_word: ἕτεροι
  choice: D’autres encore
  rationale: Marque naturellement en français le contraste indéfini avec le groupe précédent.
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  choice: s’étaient rassemblés dans les grottes des environs
  rationale: Rend le mouvement collectif de συνδρομόντες et la proximité exprimée par πλησίον, dans un français naturel.
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  choice: pour observer la semaine en secret
  rationale: Conserve la formulation grecque inhabituelle « la semaine » et rend ἄγειν par « observer » dans ce contexte religieux, sans substituer silencieusement « sabbat ».
- source_word: μηνυθέντες τῷ Φιλίππῳ
  choice: Dénoncés à Philippe
  rationale: Exprime clairement la communication hostile impliquée par le passif de μηνύω.
- source_word: συνεφλογίσθησαν
  choice: ils furent tous livrés aux flammes
  rationale: Restitue l’idée qu’ils furent brûlés ensemble, sans ajouter explicitement « vifs », absent du verbe grec.
- source_word: διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι αὐτοῖς
  choice: car ... ils se faisaient scrupule de se défendre
  rationale: Le tour français conserve la réserve religieuse de εὐλαβῶς et comprend l’aide à soi-même comme la défense de soi, conformément au contexte.
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  choice: par respect pour l’honneur de ce jour si saint
  rationale: Rend δόξα par « honneur » et σεμνοτάτης par une sainteté éminente, avec un registre digne mais courant.
theological_decisions:
- issue: Sens de τὴν ἑβδομάδα dans le contexte de persécution
  choice: la semaine
  alternative: le sabbat
  rationale: Le grec porte littéralement « la semaine », tandis que le contexte rend probable une référence à l’observance du sabbat. Le texte principal préserve la donnée lexicale et la note signale l’interprétation contextuelle.
- issue: Nature de l’action à laquelle les victimes renoncent
  choice: se défendre
  alternative: se porter secours à elles-mêmes
  rationale: βοηθῆσαι αὐτοῖς peut littéralement évoquer le fait de s’aider elles-mêmes; dans la scène, « se défendre » en exprime sobrement la portée concrète sans ajouter de doctrine.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe a été légèrement déployée en deux phrases pour assurer la clarté; la formulation conserve l’ambiguïté entre « semaine » et « sabbat » au moyen d’une note.
