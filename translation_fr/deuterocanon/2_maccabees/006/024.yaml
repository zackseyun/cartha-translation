  text: Οὐ γὰρ τῆς ἡμετέρας ἡλικίας ἄξιόν ἐστιν ὑποκριθῆναι, ἵνα πολλοὶ τῶν νέων ὑπολαβόντες Ἐλεάζαρον τὸν ἐνενηκονταετῆ μεταβεβληκέναι εἰς ἀλλοφυλισμόν,
