    issue: Conditionnel dans « il ne serait pas digne »
    rationale: 'ἄξιόν ἐστιν est au présent indicatif : Éléazar formule un jugement direct, non une éventualité conditionnelle. Il faut « il ne convient pas » ou « il n’est pas digne ».'
  - severity: low
    issue: « Au risque que » affaiblit légèrement le lien de conséquence redoutée
    rationale: La tournure est possible, mais « de crainte que » rend plus directement, dans ce contexte d’avertissement moral, l’effet que sa feinte pourrait produire chez les jeunes.
