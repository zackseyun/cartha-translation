base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/024.yaml
  text: For it is not worthy of our age to pretend[a], so that many of the young, supposing that Eleazar at ninety years of age has changed over to foreign ways,
translation:
  language: fr
  text: Car il ne convient pas, à notre âge, de feindre, de crainte que beaucoup de jeunes ne pensent qu’Éléazar, à quatre-vingt-dix ans, est passé aux coutumes étrangères[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à des usages étrangers » ; le grec évoque l’adoption d’un mode de vie étranger aux coutumes juives.
    reason: Propose une alternative pour ἀλλοφυλισμός et précise sa portée contextuelle sans employer de qualification polémique.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Car… ne… pas
  rationale: « Car » conserve la valeur explicative de γάρ et rattache ce raisonnement au contexte précédent.
- source_word: τῆς ἡμετέρας ἡλικίας
  choice: de notre âge
  rationale: ἡλικία désigne ici l’âge avancé ou l’étape de la vie. La formulation garde le possessif pluriel, qui relève d’une manière digne de parler de soi.
- source_word: ἄξιόν ἐστιν
  choice: il ne serait pas digne
  rationale: Cette tournure exprime la convenance morale attachée à la vieillesse. Le conditionnel s’accorde naturellement en français avec l’hypothèse de feindre envisagée puis rejetée.
- source_word: ὑποκριθῆναι
  choice: de feindre
  rationale: Dans ce contexte, le verbe signifie jouer un rôle ou simuler une conduite, ici une conformité extérieure trompeuse.
- source_word: ἵνα
  choice: au risque que
  rationale: La proposition indique la conséquence redoutée de cette feinte. « Au risque que » rend ce mouvement sans présenter l’égarement des jeunes comme le but recherché par Éléazar.
- source_word: πολλοὶ τῶν νέων
  choice: beaucoup de jeunes
  rationale: La formulation française reste générale comme le grec, sans limiter inutilement le groupe aux seuls jeunes hommes.
- source_word: ὑπολαβόντες
  choice: pensant
  rationale: Le participe décrit la conclusion erronée que les jeunes tireraient de l’apparence donnée par Éléazar.
- source_word: Ἐλεάζαρον τὸν ἐνενηκονταετῆ
  choice: Éléazar, à quatre-vingt-dix ans
  rationale: Cette formulation idiomatique conserve l’insistance sur son grand âge et sur l’influence exemplaire d’un ancien.
- source_word: μεταβεβληκέναι
  choice: est passé
  rationale: Le parfait présente comme accomplie la transition que les jeunes supposeraient. « Est passé » exprime clairement ce changement d’appartenance ou de conduite.
- source_word: εἰς ἀλλοφυλισμόν
  choice: aux coutumes étrangères
  rationale: Le nom renvoie à l’adoption d’usages non juifs. Cette expression est claire en français moderne sans recourir à un terme polémique ou confessionnel.
theological_decisions:
- issue: Sens de ἀλλοφυλισμός dans le récit du martyre juif
  choice: aux coutumes étrangères
  alternative: à un mode de vie non juif
  rationale: Le terme évoque l’abandon apparent des coutumes ancestrales au profit de pratiques étrangères. Le texte principal conserve la dimension culturelle et identitaire, tandis que la note explicite le contexte sans réduire le mot à une catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule, comme le segment grec fourni, puisqu’elle se poursuit au verset suivant. Le marqueur de note est placé après l’expression qu’il explique.
