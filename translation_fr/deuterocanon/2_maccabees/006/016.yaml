  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: fr
  text: C’est pourquoi il ne nous retire jamais sa miséricorde ; mais lorsqu’il corrige par le malheur, il n’abandonne pas son propre peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: C’est pourquoi
  rationale: Cette locution introduit naturellement en français la conclusion tirée du contexte précédent et conserve la valeur inférentielle du grec.
- source_word: οὐδέποτε
  choice: jamais
  rationale: Équivalent français direct et idiomatique de l’adverbe temporel nié.
- source_word: τὸν ἔλεον
  choice: sa miséricorde
  rationale: ἔλεος désigne la miséricorde ou la compassion. Le possessif, implicite dans le contexte, indique clairement qu’il s’agit de la miséricorde de Dieu.
- source_word: ἀφʼ ἡμῶν ἀφίστησιν
  choice: il ne nous retire
  rationale: La construction avec ἀπό exprime l’éloignement ou le retrait ; « retirer quelque chose à quelqu’un » est naturel en français et conserve ce mouvement.
- source_word: παιδεύων
  choice: même lorsqu’il nous corrige
  rationale: παιδεύω évoque ici une action éducative et corrective. « Corriger » rend ce sens sans réduire le terme à une simple instruction ni imposer l’idée d’un châtiment vindicatif.
- source_word: μετὰ συμφορᾶς
  choice: par le malheur
  rationale: συμφορά désigne un malheur, une calamité ou une détresse. « Par » exprime ici de façon naturelle le moyen ou la circonstance de la correction.
- source_word: οὐκ ἐγκαταλείπει
  choice: il n’abandonne pas
  rationale: « Abandonner » est un équivalent moderne et précis de ἐγκαταλείπω dans ce contexte.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: son propre peuple
  rationale: « Propre » restitue l’insistance possessive du pronom réfléchi ἑαυτοῦ.
theological_decisions:
- issue: Sens de παιδεύων appliqué à l’action divine
  choice: même lorsqu’il nous corrige
  alternative: tout en nous disciplinant
  rationale: Le verset présente le malheur comme une correction qui n’équivaut pas à l’abandon. « Corrige » maintient cette tension entre souffrance et fidélité divine, dans un français plus naturel que « discipliner » dans ce contexte.
- issue: Explicitation du possesseur de τὸν ἔλεον
  choice: sa miséricorde
  alternative: la miséricorde
  rationale: Bien que le grec emploie l’article, le contexte identifie sans ambiguïté la miséricorde comme celle de Dieu. Le possessif clarifie la phrase sans introduire de nouvelle affirmation doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. La structure antithétique est conservée : Dieu corrige par le malheur, mais ne retire jamais sa miséricorde et n’abandonne pas son peuple. Aucun archaïsme ni terme confessionnel marqué.'
