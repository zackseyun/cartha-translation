  source_fidelity: La première proposition rend fidèlement διόπερ, οὐδέποτε et ἀφʼ ἡμῶν ἀφίστησιν. La seconde conserve correctement l’idée que le malheur accompagne ou sert de moyen à la παιδεία et que Dieu n’abandonne pas son peuple. Toutefois, « même lorsqu’il » introduit une nuance concessive/éventuelle qui ne correspond pas précisément au δέ grec, lequel coordonne ici l’opposition (« mais ») avec le participe παιδεύων.
