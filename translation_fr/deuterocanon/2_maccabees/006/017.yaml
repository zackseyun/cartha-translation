- source_word: διʼ ὀλίγων
  choice: brièvement
  rationale: Expression idiomatique correspondant à « en peu de mots » et portant sur la manière de poursuivre.
- source_word: ἐλευστέον ἐπὶ τὴν διήγησιν
  choice: il nous faut maintenant passer au récit
