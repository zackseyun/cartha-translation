base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/014.yaml
  text: 'For he did not decide to deal with us as he does with the other nations: he waits patiently with them until they have reached the full measure of their sins[a], and then punishes them.'
translation:
  language: fr
  text: 'Car le Maître n’a pas décidé d’agir ainsi envers nous : dans sa patience, il attend, pour les autres nations, qu’elles aient atteint la pleine mesure de leurs péchés, puis il les punit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένει
  choice: il attend
  rationale: Le verbe exprime l’attente ou le report jusqu’à un moment déterminé; « attend » est direct et naturel en français moderne.
- source_word: μακροθυμῶν
  choice: dans sa patience
  rationale: Le participe qualifie l’attente du Maître et exprime sa patience ou sa longanimité; la locution française conserve ce lien de façon fluide.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: δεσπότης désigne ici Dieu comme maître ou souverain. « Le Maître » préserve le terme explicite du grec sans le confondre avec κύριος, couramment rendu par « Seigneur ».
- source_word: μέχρι τοῦ ... κολάσῃ
  choice: qu’elles aient atteint… puis il les punit
  rationale: La formulation rend la limite temporelle de l’attente et explicite naturellement en français la succession entre l’accomplissement des péchés et la punition.
- source_word: καταντήσαντας αὐτοὺς πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  choice: qu’elles aient atteint la pleine mesure de leurs péchés
  rationale: Cette expression idiomatique conserve l’idée que les péchés parviennent à leur plein accomplissement.
- source_word: κολάσῃ
  choice: il les punit
  rationale: « Punir » exprime directement l’action punitive du verbe grec et reste accessible au lectorat moderne.
- source_word: οὐ ... οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  choice: ne nous traite pas comme les autres nations
  rationale: Le grec formule de manière condensée que le Maître n’a pas décidé qu’il en serait ainsi pour nous. Cette traduction rend clairement la comparaison négative sans ajouter d’explication doctrinale.
theological_decisions:
- issue: Patience divine envers les nations et traitement différent d’Israël
  choice: Le verset oppose le long délai précédant la punition des autres nations au traitement différent réservé à « nous ».
  alternative: 'Traduire plus littéralement : « il n’a pas décidé qu’il en serait ainsi pour nous », sans expliciter dans la proposition principale la comparaison avec les autres nations.'
  rationale: La construction οὐ… καθάπερ… οὕτως… ἐφʼ ἡμῶν établit bien cette opposition. La traduction l’explicite seulement dans la mesure nécessaire à un français clair, sans définir ici la nature précise du traitement réservé à Israël.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe grecque condensée est réorganisée pour rendre le contraste immédiatement intelligible. « Le Maître » maintient la nuance de δεσπότης, tandis que « pleine mesure » restitue idiomatiquement l’idée d’accomplissement des péchés.
