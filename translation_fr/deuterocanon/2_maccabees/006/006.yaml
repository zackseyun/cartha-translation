  yaml_path: translation/deuterocanon/2_maccabees/006/006.yaml
  text: And it was permitted neither to keep the Sabbath[a], nor to observe the ancestral festivals, nor even simply to acknowledge being a Jew.
translation:
  language: fr
  text: Il n’était permis ni d’observer le sabbat, ni d’observer les fêtes ancestrales, ni même, tout simplement, de se déclarer juif[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Judéen », si le terme est compris dans un sens plus géographique et ethnique ; ici, l’interdiction du sabbat et des fêtes favorise « juif ».
    reason: Alternative lexicale pour Ἰουδαῖον.
lexical_decisions:
- source_word: ἦν
  choice: Il n’était permis
  rationale: Avec la série d’infinitifs négatifs, l’imparfait décrit ici la situation d’interdiction. Cette tournure est naturelle en français et explicite la force contextuelle de la construction.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ni ... ni ... ni même
  rationale: La triple coordination négative du grec est conservée; « même » rend en outre l’intensification de la dernière proposition.
- source_word: σαββατίζειν
  choice: observer le sabbat
  rationale: Le verbe désigne la pratique du sabbat. « Observer le sabbat » est une formulation française courante, claire et précise.
- source_word: πατρίους ἑορτὰς
  choice: les fêtes ancestrales
  rationale: Cette expression garde l’idée de fêtes religieuses reçues des ancêtres, sans réduire πατρίους à une simple coutume contemporaine.
- source_word: διαφυλάττειν
  choice: célébrer
  rationale: À propos de fêtes religieuses, « célébrer » exprime naturellement leur observance effective; le sens de maintien fidèle demeure perceptible dans le contexte.
- source_word: ἁπλῶς
  choice: tout simplement
  rationale: L’expression souligne qu’il était interdit jusqu’au simple fait de revendiquer cette identité.
- source_word: Ἰουδαῖον
  choice: juif
  rationale: Dans ce contexte de suppression du sabbat, des fêtes et de l’identité collective, le terme a une portée ethnique et religieuse que « juif » rend naturellement en français.
- source_word: ὁμολογεῖν εἶναι
  choice: se déclarer
  rationale: La tournure exprime la reconnaissance ou l’affirmation ouverte de son identité. « Se déclarer » est idiomatique et évite des connotations confessionnelles étrangères au contexte.
theological_decisions:
- issue: Portée de Ἰουδαῖον dans un contexte de persécution
  choice: juif
  alternative: Judéen
  rationale: Le contexte vise les pratiques et l’identité juives, et non la seule provenance géographique. La variante est néanmoins signalée afin de préserver la possible nuance ethnogéographique du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La triple structure négative est maintenue. Le marqueur de note est placé après « juif », le mot auquel porte réellement la variante lexicale.
