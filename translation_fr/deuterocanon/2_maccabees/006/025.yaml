  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
translation:
  language: fr
  text: eux aussi, à cause de mon hypocrisie[a] et pour une vie brève et passagère[b], seraient égarés par ma faute, et je m’attirerais la haine[c] et une tache sur ma vieillesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « feinte » ou « dissimulation » : le grec désigne ici une conduite simulée qui tromperait les observateurs.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « à cause du vivre bref et momentané » : il s’agit de préserver le peu de vie qui lui reste.'
    reason: lexical_alternative
  - marker: c
    text: Ou « l’horreur » ou « la répulsion » ; le mot grec peut désigner la haine ou l’aversion profonde dont quelqu’un est l’objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόκρισιν
  choice: hypocrisie
  rationale: 'Le terme désigne ici une conduite feinte : Éléazar donnerait extérieurement l’impression de se conformer, au risque de tromper ceux qui l’observent. « Hypocrisie » conserve la gravité morale du grec.'
- source_word: μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: pour une vie brève et passagère
  rationale: 'La préposition διά exprime ici le motif ou l’avantage recherché : préserver une vie qui ne durerait que peu. Cette formulation française est naturelle et maintient l’opposition entre survie éphémère et déshonneur durable.'
- source_word: πλανηθῶσιν
  choice: seraient égarés
  rationale: Le passif exprime le fait d’être induit en erreur ou détourné moralement par l’exemple d’Éléazar.
- source_word: διʼ ἐμέ
  choice: par ma faute
  rationale: La répétition causale signifie qu’Éléazar se reconnaîtrait responsable de leur égarement. « Par ma faute » rend cette responsabilité plus naturellement que le littéral « à cause de moi ».
- source_word: μύσος
  choice: le dégoût
  rationale: Le mot évoque une vive répulsion, voire l’abomination, plutôt qu’une simple hostilité. « Dégoût » garde cette nuance de répulsion publique.
- source_word: κηλῖδα τοῦ γήρως
  choice: une tache sur ma vieillesse
  rationale: Cette traduction conserve l’image concrète d’une souillure attachée à ses vieux jours et à leur réputation.
- source_word: κατακτήσωμαι
  choice: je m’attirerais
  rationale: Le moyen grec indique qu’il acquerrait ou ferait venir sur lui-même ce déshonneur. « Je m’attirerais » exprime clairement cette conséquence auto-infligée.
theological_decisions:
- issue: Portée morale de ὑπόκρισις dans le contexte du martyre
  choice: « hypocrisie »
  alternative: « feinte » ou « dissimulation »
  rationale: Le passage vise une fausse apparence de conformité qui compromettrait le témoignage d’Éléazar et égarerait autrui. Le terme fort respecte cet enjeu sans ajouter de catégorie doctrinale ultérieure.
- issue: Relation causale dans διὰ τὸ μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: « pour une vie brève et passagère »
  alternative: « à cause de cette vie brève et passagère »
  rationale: Dans le contexte, l’idée est qu’Éléazar commettrait cette feinte afin de conserver un court reste de vie. La traduction explicite ce but tout en gardant le caractère dérisoirement temporaire de l’avantage.
- issue: Force de la proposition finale
  choice: « je m’attirerais le dégoût et une tache sur ma vieillesse »
  alternative: « j’acquerrais l’opprobre et une tache dans ma vieillesse »
  rationale: Le moyen κατακτήσωμαι présente le déshonneur comme une conséquence qu’Éléazar ferait venir sur lui-même. La formulation préserve cette responsabilité personnelle sans surinterprétation.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase reste intégrée au raisonnement commencé dans le verset précédent. « Passagère » évite le calque peu naturel « momentanée », tandis que « vieillesse » conserve la portée pathétique et honorifique de γῆρας.
