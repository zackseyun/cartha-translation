  to: 'Mais, sur le point de mourir sous les coups, il gémit et dit : « Seigneur, toi qui possèdes la sainte connaissance, il est manifeste que, bien que j’aie pu échapper à la mort[a], j’endure dans mon corps de cruelles douleurs tandis qu’on me fouette ; mais dans mon âme, je souffre volontiers tout cela par crainte de lui[b]. »'
