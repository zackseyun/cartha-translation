base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
translation:
  language: fr
  text: 'Mais, sur le point de mourir sous les coups, il gémit et dit : « Seigneur, toi qui possèdes la sainte connaissance, il est manifeste que, bien que j’aie pu échapper à la mort[a], j’endure dans mon corps de cruelles douleurs tandis qu’on me fouette ; mais dans mon âme, je souffre volontiers tout cela par crainte de lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « être délivré de la mort » ; dans le contexte, il aurait pu éviter l’exécution en cédant aux exigences de ses bourreaux.
    reason: Précision lexicale et contextuelle sur ἀπολυθῆναι τοῦ θανάτου.
  - marker: b
    text: Ou « par respect révérencieux pour lui ». Le grec dit « crainte », terme qui peut désigner une crainte mêlée de profond respect envers Dieu.
    reason: Préservation de l’ambivalence théologique de φόβος.
lexical_decisions:
- source_word: μέλλων ... τελευτᾷν
  choice: sur le point de mourir
  rationale: Cette tournure française naturelle exprime nettement l’imminence portée par μέλλων avec l’infinitif.
- source_word: ταῖς πληγαῖς
  choice: sous les coups
  rationale: Le datif indique ici les circonstances ou le moyen de la mort; « sous les coups » conserve la violence de la scène sans préciser excessivement le rapport grammatical.
- source_word: ἀναστενάξας
  choice: il gémit
  rationale: Le verbe désigne un soupir profond ou un gémissement audible; « il gémit » convient au contexte de torture.
- source_word: Τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι φανερὸν ἐστὶν
  choice: Le Seigneur, qui possède la sainte connaissance, sait clairement
  rationale: Cette formulation rend idiomatiquement la construction au datif avec l’expression impersonnelle « il est manifeste », tout en conservant γνῶσις comme « connaissance » et son qualificatif « sainte ».
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  choice: bien que j’aie pu échapper à la mort
  rationale: Le participe a ici une valeur concessive. « Échapper à la mort » transmet naturellement l’idée d’être délivré ou épargné de la mort, sans affirmer dans le corps du texte les modalités précises.
- source_word: σκληρὰς ... ἀλγηδόνας
  choice: de cruelles douleurs
  rationale: « Cruelles » restitue la dureté de σκληράς et « douleurs » le sens direct de ἀλγηδόνας.
- source_word: κατὰ σῶμα ... κατὰ ψυχὴν
  choice: dans mon corps ... dans mon âme
  rationale: La formulation préserve le parallélisme et la distinction anthropologique explicite du grec.
- source_word: μαστιγούμενος
  choice: sous le fouet
  rationale: La tournure française est claire et digne, et exprime le supplice en cours sans alourdir la phrase par une forme passive.
- source_word: ἡδέως
  choice: volontiers
  rationale: Dans ce contexte, « volontiers » exprime une acceptation intérieure libre sans suggérer un plaisir pris à la douleur physique.
- source_word: διὰ τὸν αὐτοῦ φόβον
  choice: par crainte de lui
  rationale: « Crainte » maintient la force lexicale de φόβος tout en pouvant désigner, dans le registre biblique, une crainte révérencielle.
theological_decisions:
- issue: Sens de φόβος envers le Seigneur
  choice: crainte de lui
  alternative: respect révérenciel pour lui
  rationale: Le grec dit littéralement « crainte ». Le texte principal conserve cette force et l’ambivalence biblique du terme; une note signale sa nuance possible de révérence.
- issue: Portée de ψυχή en contraste avec σῶμα
  choice: âme
  alternative: être intérieur
  rationale: « Âme » préserve le contraste lexical explicite avec le corps sans réduire ψυχή à un simple état psychologique.
- issue: Nature de la délivrance possible de la mort
  choice: échapper à la mort
  alternative: être délivré de la mort
  rationale: La formulation conserve la possibilité d’éviter l’exécution sans inscrire directement dans le texte la condition narrative de cette possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de la déclaration est conservé, ainsi que le contraste entre le corps et l’âme. « Sous le fouet » évite l’archaïsme relatif de « flagellé » tout en restant adapté à la gravité du récit.
