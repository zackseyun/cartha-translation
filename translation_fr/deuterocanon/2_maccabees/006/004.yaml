  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
translation:
  language: fr
  text: En effet, le sanctuaire était rempli par les non-Juifs de débauche et de fêtes tapageuses. Ils s’y livraient sans honte avec des prostituées[a], s’approchaient de femmes dans les espaces sacrés[b] et apportaient même à l’intérieur des choses qui n’y avaient pas leur place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des courtisanes »; le grec peut désigner des femmes entretenues pour servir de compagnes sexuelles.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « s’approchaient de femmes » implique probablement une conduite sexuelle déplacée, mais l’expression grecque est moins explicite que « avaient des rapports avec des femmes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: sanctuaire
  rationale: Dans ce contexte, le terme désigne le Temple de Jérusalem en tant qu’espace sacré profané; « sanctuaire » conserve cette valeur cultuelle.
- source_word: ἀσωτίας
  choice: débauche
  rationale: Le mot évoque des excès moralement dissolus; « débauche » est actuel, clair et approprié au contexte.
- source_word: κώμων
  choice: fêtes tapageuses
  rationale: Le pluriel désigne des réjouissances bruyantes et débridées; cette formulation est naturelle en français moderne sans atténuer la profanation.
- source_word: ἐθνῶν
  choice: non-Juifs
  rationale: Dans ce récit juif, le mot désigne les peuples autres qu’Israël. « non-Juifs » rend clairement le contraste contextuel sans ajouter le jugement religieux que pourrait suggérer « païens ».
- source_word: θρασυνόντων
  choice: sans honte
  rationale: Le participe exprime une conduite effrontée et insolente; « sans honte » en restitue naturellement la manière en français.
- source_word: ἑταίρων
  choice: prostituées
  rationale: Dans l’usage hellénistique et dans ce contexte de débauche, ἑταῖραι désigne vraisemblablement des courtisanes ou prostituées plutôt que de simples compagnes.
- source_word: ἐν τοῖς ἱεροῖς
  choice: dans les espaces sacrés
  rationale: Le pluriel renvoie aux diverses zones sacrées du Temple sans permettre de préciser leur architecture; « espaces sacrés » préserve cette généralité.
- source_word: τερβόλων γυναιξὶ πλησιαζόντων
  choice: s’approchaient de femmes
  rationale: Malgré l’obscurité de τερβόλων, πλησιάζω signifie littéralement s’approcher. Le contexte suggère une conduite sexuelle déplacée, mais le texte principal n’explicite pas davantage que le grec.
- source_word: τὰ μὴ καθήκοντα
  choice: des choses qui n’y avaient pas leur place
  rationale: La formule reste volontairement générale et désigne ce qui ne convient pas au sanctuaire, sans préciser qu’il s’agit forcément d’objets interdits par une loi.
- source_word: ἔνδον εἰσφερόντων
  choice: apportaient même à l’intérieur
  rationale: Cette formulation conserve l’idée spatiale d’introduire quelque chose au-dedans du sanctuaire.
theological_decisions:
- issue: Sens de ἐθνῶν dans un contexte juif de profanation cultuelle
  choice: non-Juifs
  alternative: nations; païens
  rationale: « non-Juifs » fait ressortir le contraste ethnique et religieux propre au contexte, tout en évitant la connotation polémique plus forte de « païens ».
- issue: Degré d’explicitation sexuelle de πλησιαζόντων
  choice: s’approchaient de femmes
  alternative: avaient des rapports avec des femmes; fréquentaient des femmes
  rationale: Le contexte implique probablement une conduite sexuelle inconvenante, mais le verbe grec reste moins explicite qu’une mention directe de rapports sexuels. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe grecque très chargée est répartie en deux phrases pour gagner en clarté. Le registre demeure soutenu sans archaïsmes; les ambiguïtés concernant la conduite sexuelle et les objets inconvenants sont préservées.
