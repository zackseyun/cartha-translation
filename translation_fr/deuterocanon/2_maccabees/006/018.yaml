base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/018.yaml
  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
translation:
  language: fr
  text: Un certain Éléazar, l’un des principaux scribes, homme déjà avancé en âge et au très beau visage, était contraint, la bouche ouverte de force, à manger de la viande de porc[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chair de porc ».'
    reason: Précision sur la formulation concrète du grec ὕειον κρέας.
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  choice: Un certain Éléazar
  rationale: La tournure conserve l’introduction narrative indéfinie marquée par τις, tout en suivant la forme française usuelle du nom propre.
- source_word: τῶν πρωτευόντων γραμματέων
  choice: l’un des principaux scribes
  rationale: πρωτευόντων indique un rang éminent ou dirigeant; « principaux » est naturel et n’interprète pas γραμματεῖς comme « juristes » ou « docteurs de la Loi ».
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  choice: était déjà avancé en âge
  rationale: Cette formulation rend l’âge avancé avec sobriété et dignité, sans accentuer au-delà du grec.
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  choice: avait une très belle apparence
  rationale: Le grec souligne explicitement l’aspect visible du visage et emploie un superlatif. « Très belle apparence » reste naturel en français et évite d’introduire l’idée morale de noblesse.
- source_word: ἀναχαινόμενον
  choice: On lui ouvrait la bouche de force
  rationale: Le participe décrit une ouverture forcée de la bouche. La proposition française rend clairement la coercition physique sans atténuer la scène.
- source_word: ἠναγκάζετο φαγεῖν
  choice: pour le contraindre à manger
  rationale: « Contraindre » restitue la force du passif, tandis que l’imparfait conserve le caractère en cours de l’action.
- source_word: ὕειον κρέας
  choice: de la viande de porc
  rationale: La locution grecque désigne littéralement la chair d’un porc. « Viande de porc » est clair, moderne et plus proche de la forme explicite du grec que le simple nom alimentaire « porc ».
theological_decisions:
- issue: Désignation de la viande impure dans le contexte de la persécution
  choice: viande de porc
  alternative: chair de porc
  rationale: Le texte grec nomme la matière consommée sans expliciter ici la loi alimentaire. La traduction conserve ce référent précis sans ajouter d’explication doctrinale au corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. Le verset est réparti en deux phrases pour éviter une longue accumulation participiale tout en conservant l’enchaînement de la description et de la contrainte. Le marqueur [a] est placé après « viande de porc », expression qu’il précise.
