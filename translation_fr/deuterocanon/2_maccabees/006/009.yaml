base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/009.yaml
  text: But those who did not choose to adopt the Greek ways were to be slaughtered[a]. Thus one could see the present misery.
translation:
  language: fr
  text: Mais ceux qui refusaient d’adopter les coutumes grecques devaient être massacrés[a]. On pouvait donc voir la détresse du moment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « passer aux choses grecques », c’est-à-dire adopter largement les usages et les pratiques hellénistiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προαιρουμένους
  choice: ceux qui refusaient
  rationale: Le participe exprime une décision volontaire de ne pas consentir. « Refusaient » rend naturellement cette volonté dans le contexte d’un ordre coercitif.
- source_word: μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  choice: d’adopter les coutumes grecques
  rationale: L’expression signifie littéralement passer aux « choses grecques » et désigne largement les usages et pratiques hellénistiques, plutôt qu’un changement d’ethnie ou la seule adoption de la langue grecque.
- source_word: κατασφάζειν
  choice: devaient être égorgés
  rationale: Le verbe désigne une mise à mort violente et sanglante. « Être égorgés » conserve sa force plus nettement que le simple « être tués ».
- source_word: παρῆν οὖν ὁρᾶν
  choice: On pouvait donc voir
  rationale: Cette tournure impersonnelle indique ce qu’il était alors possible de constater; la formulation française est naturelle et proche de la structure grecque.
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  choice: la détresse qui régnait alors
  rationale: ἐνεστῶσαν qualifie une détresse présente, en cours. « Qui régnait alors » en exprime l’actualité dans le cadre du récit sans suggérer seulement son arrivée.
theological_decisions:
- issue: Portée de ἐπὶ τὰ Ἑλληνικά
  choice: l’adoption des coutumes grecques au sens large, incluant le mode de vie et les pratiques hellénistiques
  alternative: devenir Grecs sur le plan ethnique, ou adopter uniquement la langue grecque
  rationale: Le contexte concerne la conformité imposée aux pratiques hellénistiques, notamment culturelles et religieuses. La traduction conserve cette portée large sans ajouter explicitement la notion plus étroite d’apostasie.
translation_notes:
  register: Français international moderne, clair et digne. « Coutumes grecques » évite l’expression moins idiomatique « choses grecques ». « Égorgés » conserve la violence du verbe grec, tandis que la dernière proposition garde le caractère directement observable et présent de la détresse.
