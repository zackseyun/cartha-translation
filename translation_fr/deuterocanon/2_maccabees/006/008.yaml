revisions:
- from: 'Un décret fut aussi envoyé aux cités grecques voisines, sur la proposition de Ptolémée : elles devaient appliquer aux Juifs la même ligne de conduite et leur faire manger les entrailles des victimes sacrifiées[a],'
  to: Un décret fut aussi publié dans les cités grecques voisines, sur la proposition de Ptolémée, pour qu’elles appliquent aux Juifs la même politique et les contraignent à consommer des viandes sacrificielles[a],
  rationale: La révision corrige le sens lexical et contextuel de σπλαγχνίζειν. Dans 2 Maccabées 6, la mesure vise l’assimilation forcée aux pratiques cultuelles grecques; la peine infligée à ceux qui refusent est exprimée au verset suivant. Le texte révisé conserve donc la violence coercitive de l’ordre sans transformer l’infinitif en une description anatomique ou homicidaire.
