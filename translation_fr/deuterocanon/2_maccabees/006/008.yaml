  text: And a decree went out to the neighboring Greek cities[a], at the suggestion of Ptolemy, to follow the same policy against the Jews, and to kill them,
translation:
  language: fr
  text: Un décret fut aussi publié dans les cités grecques voisines, sur la proposition de Ptolémée, pour qu’elles appliquent aux Juifs la même politique et les contraignent à consommer des viandes sacrificielles[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec, apparenté au mot « entrailles », est employé ici dans un sens cultuel : contraindre à participer à la consommation de nourriture sacrificielle.'
    reason: Précise le sens contextuel de σπλαγχνίζειν sans réduire indûment l’expression aux seules entrailles ni lui attribuer le sens de « tuer ».
lexical_decisions:
- source_word: ψήφισμα
  choice: décret
  rationale: Le terme désigne une décision officielle promulguée par une autorité.
- source_word: ἐξῆλθεν εἰς
  choice: fut envoyé aux
  rationale: Dans ce contexte administratif, l’expression indique qu’un décret fut publié et transmis aux cités concernées.
- source_word: ἀστυγείτονας Ἑλληνίδας πόλεις
  choice: cités grecques voisines
  rationale: Cette formulation rend à la fois la proximité géographique et l’identité grecque, culturelle ou politique, de ces cités.
- source_word: Πτολεμαίου ὑποθεμένου
  choice: sur la proposition de Ptolémée
  rationale: Le génitif absolu présente Ptolémée comme celui qui proposa ou préconisa cette mesure.
- source_word: τὴν αὐτὴν ἀγωγὴν κατὰ τῶν Ἰουδαίων ἄγειν
  choice: appliquer aux Juifs la même ligne de conduite
  rationale: ἀγωγή désigne ici une manière d’agir ou une politique imposée; cette traduction conserve la portée administrative de l’expression.
- source_word: σπλαγχνίζειν
  choice: leur faire manger les entrailles des victimes sacrifiées
  rationale: Dans ce contexte cultuel, le verbe renvoie à la consommation des entrailles d’animaux sacrifiés. Cette lecture correspond à l’obligation faite aux Juifs de participer aux pratiques sacrificielles grecques et évite de confondre le verbe avec une mise à mort, laquelle est mentionnée au verset suivant.
theological_decisions:
- issue: Sens de σπλαγχνίζειν dans le contexte de la persécution religieuse
  choice: leur faire manger les entrailles des victimes sacrifiées
  alternative: les éventrer / les tuer
  rationale: Le verbe est formé sur σπλάγχνα, « entrailles », mais son emploi cultuel peut désigner le fait de manger les entrailles d’une victime sacrificielle. Le contexte immédiat porte sur l’imposition des coutumes grecques; la peine de mort pour ceux qui refusent est énoncée ensuite. La traduction retient donc la contrainte rituelle plutôt qu’un acte de mise à mort.
translation_notes:
  register: Français moderne, digne et accessible. « Cités » convient au cadre politique hellénistique; « ligne de conduite » exprime naturellement la politique prescrite. Le deux-points clarifie que le contenu du décret suit. La virgule finale est conservée parce que le verset se poursuit syntaxiquement au verset suivant.
