  revision_rationale: La révision corrige le sens lexical et contextuel de σπλαγχνίζειν. Dans 2 Maccabées 6, la mesure vise l’assimilation forcée aux pratiques cultuelles grecques; la peine infligée à ceux qui refusent est exprimée au verset suivant. Le texte révisé conserve donc la violence coercitive de l’ordre sans transformer l’infinitif en une description anatomique ou homicidaire.
