lexical_decisions:
- source_word: διόπερ
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conclusion forte introduite par διόπερ.
- source_word: ἀνδρείως
  choice: courageusement
  rationale: Rend directement l’idée de bravoure morale face à la mort.
- source_word: νῦν ἀλλάξας τὸν βίον
  choice: en quittant maintenant […] la vie
  rationale: ἀλλάσσω τὸν βίον désigne ici le fait de passer hors de la vie, donc de mourir; «quitter la vie» reste digne et naturel sans expliciter davantage que le grec.
- source_word: τοῦ […] γήρως ἄξιος
  choice: digne de mon grand âge
  rationale: «Grand âge» exprime ici naturellement la vieillesse honorable du locuteur; le possessif requis en français est implicite dans le contexte grec.
- source_word: φανήσομαι
  choice: je me montrerai
  rationale: Conserve la valeur de manifestation publique de φανήσομαι plutôt que de réduire le verbe à «je serai».
