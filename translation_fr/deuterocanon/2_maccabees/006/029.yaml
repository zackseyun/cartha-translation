- from: 'Ceux qui le conduisaient changèrent en hostilité la bienveillance qu’ils lui avaient témoignée peu auparavant, à cause des paroles qu’il venait de prononcer[a] : ils les prenaient, quant à eux, pour de la folie.'
  to: Ceux qui le conduisaient changèrent en hostilité la bienveillance qu’ils lui avaient témoignée peu auparavant, à cause des paroles mentionnées plus haut[a], qu’ils tenaient, eux, pour une folie.
  rationale: La révision évite de préciser indûment que les paroles ont été tout juste prononcées par Éléazar, tout en conservant le lien causal, l’opposition entre bienveillance et hostilité, et la distance narrative marquée par ὡς αὐτοὶ ὑπελάμβανον.
