  text: And the pressure of this evil was harsh and grievous for everyone[a].
translation:
  language: fr
  text: Cette épreuve était dure et pénible pour tous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’imposition de ce mal était sévère et difficile à supporter pour tous. »'
    reason: Alternative lexicale pour ἐπίστασις; elle rend plus explicitement l’idée d’une imposition oppressive et conserve la distinction entre les deux adjectifs grecs.
lexical_decisions:
- source_word: χαλεπὴ
  choice: dure
  rationale: L’adjectif exprime la rudesse ou la sévérité; « dure » est naturel en français et reste distinct de δυσχερής.
- source_word: δυσχερὴς
  choice: pénible
  rationale: Le terme évoque ce qui est difficile à supporter ou éprouvant; « pénible » conserve cette nuance sans répéter « dure ».
- source_word: τοῖς ὅλοις
  choice: pour tous
  rationale: Cette tournure française concise rend la portée collective et universelle de l’expression grecque.
- source_word: ἡ ἐπίστασις
  choice: la pression
  rationale: Dans ce contexte, le nom désigne l’action pesante ou l’imposition du mal décrit, plutôt qu’une simple connaissance; « pression » en restitue la force oppressive tout en laissant une note signaler l’autre nuance possible.
- source_word: τῆς κακίας
  choice: de ce mal
  rationale: κακία renvoie ici concrètement à la politique mauvaise et oppressive décrite dans le contexte; le démonstratif explicite ce renvoi sans en préciser excessivement la nature.
theological_decisions:
- issue: Référent de κακία dans le contexte
  choice: Une référence concrète au mal oppressif déjà décrit
  alternative: Le mal au sens abstrait, ou la méchanceté comme qualité personnelle
  rationale: Le récit porte sur la profanation et la persécution imposées. « Ce mal » conserve le lien contextuel sans introduire d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste accessible, tout en conservant les deux adjectifs grecs et l’ambiguïté relative de ἐπίστασις grâce à la note.
