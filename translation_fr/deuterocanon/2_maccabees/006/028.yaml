  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
translation:
  language: fr
  text: laissant ainsi aux jeunes un noble exemple de mourir de plein gré et courageusement pour les lois vénérables et saintes. Après avoir dit cela, il alla aussitôt au chevalet de torture[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « tambour » ; il s’agit ici d’un instrument de torture.
    reason: 'Précision lexicale : le sens littéral de τύμπανον serait trompeur sans indication de son emploi dans ce contexte.'
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  choice: aux jeunes
  rationale: Le datif désigne les bénéficiaires ou les destinataires de l’exemple et νέοις renvoie ici largement aux personnes jeunes, sans imposer une référence exclusivement masculine.
- source_word: ὑπόδειγμα γενναῖον
  choice: un noble exemple
  rationale: ὑπόδειγμα désigne un exemple ou un modèle, tandis que γενναῖον associe dignité morale et courage. « Noble exemple » conserve cette double nuance.
- source_word: καταλελοιπὼς
  choice: laissant ainsi
  rationale: Le participe parfait exprime un exemple laissé avec un effet durable. La tournure française s’intègre naturellement à la continuité syntaxique du verset.
- source_word: εἰς τὸ προθύμως καὶ γενναίως … ἀπευθανατίζειν
  choice: mourir de plein gré et courageusement
  rationale: L’infinitif intensif évoque le fait d’aller effectivement jusqu’à la mort. « Mourir » reste clair, tandis que « de plein gré » et « courageusement » rendent respectivement la disponibilité volontaire et la bravoure.
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  choice: pour les lois vénérables et saintes
  rationale: ὑπέρ indique ici la cause pour laquelle il meurt. « Vénérables » traduit la dignité suscitant le respect exprimée par σεμνῶν, et « saintes » rend directement ἁγίων.
- source_word: τοσαῦτα δὲ εἰπών
  choice: Après avoir dit cela
  rationale: Cette transition participiale est rendue dans un français actuel et naturel sans alourdir la phrase.
- source_word: ἐπὶ τὸ τύμπανον
  choice: au chevalet de torture
  rationale: τύμπανον signifie littéralement « tambour », mais désigne ici un appareil de supplice sur lequel la victime était étendue ou battue. « Chevalet de torture » communique clairement sa fonction, et la note conserve le terme littéral.
- source_word: εὐθέως ἦλθεν
  choice: il alla aussitôt
  rationale: εὐθέως marque l’immédiateté et ἦλθεν exprime ici le mouvement vers l’instrument de supplice.
theological_decisions:
- issue: La valorisation du martyre et de la Loi
  choice: Conserver « de plein gré et courageusement » ainsi que « lois vénérables et saintes ».
  alternative: Employer des termes moins évaluatifs, comme « résolument » et « lois respectées ».
  rationale: Le grec présente explicitement la mort d’Éléazar comme exemplaire et qualifie les lois de σεμναί et ἅγιαι. La traduction préserve cette appréciation morale et théologique sans l’atténuer ni l’amplifier.
translation_notes:
  register: Français international moderne, digne et accessible. Le début participial et la virgule finale sont maintenus parce que le verset s’inscrit dans une phrase qui déborde ses limites. Les deux adverbes grecs restent distincts, et le vocabulaire laudatif du texte source est conservé.
