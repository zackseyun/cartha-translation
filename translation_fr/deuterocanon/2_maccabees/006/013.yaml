base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/013.yaml
  text: For indeed[a], not allowing those who act impiously to go on for a long time, but immediately bringing punishments upon them, is a sign of great kindness.
translation:
  language: fr
  text: En effet, le fait de ne pas laisser ceux qui agissent avec impiété continuer longtemps, mais de les faire aussitôt tomber sous le coup des châtiments, est un signe d’une grande bonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  choice: le fait de ne pas laisser longtemps
  rationale: La tournure nominale rend l’infinitif grec employé comme sujet. « Ne pas laisser longtemps » reste naturel en français tout en gardant l’idée que les coupables ne sont pas laissés sans intervention durablement.
- source_word: τοὺς δυσσεβοῦντας
  choice: ceux qui agissent avec impiété
  rationale: Cette formulation conserve la valeur verbale du participe et décrit une conduite plutôt que d’attribuer seulement une identité statique.
- source_word: ἀλλʼ εὐθέως
  choice: mais ... aussitôt
  rationale: « Aussitôt » marque clairement le contraste entre l’absence d’un long délai et la rapidité du châtiment.
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  choice: tomber sous le coup des châtiments
  rationale: Cette expression française idiomatique conserve l’image de « tomber sous » et la force punitive de ἐπιτίμια, sans l’adoucir en simple discipline.
- source_word: μεγάλης εὐεργεσίας
  choice: d’une grande bonté
  rationale: « Bonté » exprime ici le bienfait ou la bienveillance manifestée par une intervention rapide, sans introduire le terme théologique plus spécifique de « miséricorde ».
- source_word: σημεῖόν ἐστιν
  choice: est le signe
  rationale: Rendu direct qui préserve la fonction probante de σημεῖον.
theological_decisions:
- issue: Exprimer que la rapidité du châtiment constitue elle-même un bienfait
  choice: Maintenir directement que le châtiment immédiat est le signe d’une grande bonté.
  alternative: Employer « miséricorde » pour εὐεργεσία ou « correction » pour ἐπιτίμια.
  rationale: Le grec unit sans l’atténuer la bonté divine et la réalité des châtiments. « Bonté » et « châtiments » préservent cette tension, sans durcir ni adoucir le propos par une interprétation confessionnelle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe nominale demeure assez proche du grec, tandis que « tomber sous le coup des châtiments » assure une lecture naturelle. Aucun appel de note n’est nécessaire, car l’ambiguïté lexicale ne compromet pas le sens principal.
