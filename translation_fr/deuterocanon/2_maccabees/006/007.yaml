base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/007.yaml
  text: And they were being led[a], under bitter compulsion, to the king’s monthly birthday observance for the sacrificial meal; and when a festival of Dionysus came, they were being forced, wearing ivy wreaths[b], to join the procession in honor of Dionysus.
translation:
  language: fr
  text: On les conduisait, sous une dure contrainte, à la célébration mensuelle de l’anniversaire du roi, pour prendre part au repas sacrificiel[a]. Et lorsqu’arrivait une fête de Dionysos, on les obligeait à participer à la procession en l’honneur de Dionysos, couronnés de lierre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour manger les entrailles — ou les parts — du sacrifice ». Le terme grec désigne ici la participation au rite par la consommation des parties offertes.'
    reason: lexical_alternative
  - marker: b
    text: Le lierre était associé au culte de Dionysos; il était notamment porté en couronnes ou en guirlandes lors des processions.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγον
  choice: On les conduisait
  rationale: L’imparfait exprime une pratique répétée dans ce contexte. La tournure indéfinie conserve l’absence d’agent explicite et le fait qu’ils étaient menés sous contrainte.
- source_word: μετὰ πικρᾶς ἀνάγκης
  choice: sous une dure contrainte
  rationale: La formule rend à la fois la coercition et son caractère pénible, dans un français actuel et digne.
- source_word: εἰς τὴν κατὰ μῆνα τοῦ βασιλέως γενέθλιον ἡμέραν
  choice: à la célébration mensuelle de l’anniversaire du roi
  rationale: κατὰ μῆνα indique une observance récurrente chaque mois; « célébration » rend naturellement la journée commémorative sans la réduire à une fête privée ordinaire.
- source_word: ἐπὶ σπλαγχνισμόν
  choice: pour prendre part au repas sacrificiel
  rationale: Dans ce cadre rituel, le terme renvoie à la consommation des entrailles ou parts de la victime offerte. La formulation principale communique clairement la participation cultuelle forcée, tandis que la note conserve la précision lexicale.
- source_word: Διονυσίων ἑορτῆς
  choice: une fête de Dionysos
  rationale: Cette traduction transparente évite d’imposer le nom technique d’une fête déterminée que le grec n’exige pas nécessairement.
- source_word: κισσοὺς ἔχοντες
  choice: couronnés de lierre
  rationale: Dans le culte de Dionysos, le lierre était porté en guirlande ou en couronne. Cette formulation naturelle explicite sobrement l’usage culturel suggéré par le contexte.
- source_word: πομπεύειν
  choice: participer à la procession
  rationale: Le verbe désigne la participation à une procession rituelle; cette expression en conserve le caractère cérémoniel.
- source_word: τῷ Διονύσῳ
  choice: en l’honneur de Dionysos
  rationale: Le datif indique ici l’orientation cultuelle de la procession. La formulation française exprime clairement cette relation sans ajout doctrinal.
theological_decisions:
- issue: Degré d’explicitation de la participation cultuelle forcée dans ἐπὶ σπλαγχνισμόν
  choice: pour prendre part au repas sacrificiel
  alternative: pour manger les entrailles — ou les parts — du sacrifice
  rationale: Le texte décrit une participation imposée à un rite païen. Le choix principal reste intelligible et préserve l’enjeu religieux, tandis que la note signale le sens plus concret et l’ambiguïté entre entrailles et portions sacrificielles.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Les imparfaits rendent le caractère répété de la contrainte. Le rythme en deux phrases clarifie les deux pratiques cultuelles imposées, tout en conservant leur parallélisme.
