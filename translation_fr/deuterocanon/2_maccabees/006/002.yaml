base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/002.yaml
  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
translation:
  language: fr
  text: de profaner aussi le temple de Jérusalem et de lui donner le nom de Zeus Olympien[a], et de donner au temple du Garizim, selon la condition des habitants du lieu[b], le nom de Zeus Hospitalier[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de le rebaptiser sous le nom de Zeus Olympien ». Le verbe grec peut désigner l’attribution d’un nom supplémentaire ou nouveau.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est elliptique ; on peut aussi comprendre : « selon ce qu’étaient les habitants du lieu ». Il ne dit pas explicitement qu’ils en avaient fait la demande.'
    reason: textual_ambiguity
  - marker: c
    text: 'Grec : « Zeus Xenios », c’est-à-dire Zeus considéré comme le protecteur des hôtes et des étrangers, ainsi que le garant de l’hospitalité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μολῦναι
  choice: profaner
  rationale: Le verbe exprime ici une souillure cultuelle. « Profaner » rend naturellement en français l’atteinte portée au caractère sacré du temple.
- source_word: νεὼ
  choice: temple
  rationale: Dans ce contexte, le terme désigne l’édifice cultuel de Jérusalem; « temple » est le terme français courant et précis.
- source_word: προσονομάσαι
  choice: donner le nom de
  rationale: Le verbe peut désigner l’attribution d’un nom supplémentaire ou nouveau. Cette formulation conserve cette latitude sans imposer le mécanisme exact de la redésignation.
- source_word: Διὸς Ὀλυμπίου
  choice: Zeus Olympien
  rationale: Le nom propre est translittéré et l’épithète divine est traduite selon son équivalent français usuel.
- source_word: Γαριζείν
  choice: Garizim
  rationale: Le toponyme est rendu selon sa forme française biblique courante. L’expression elliptique « celui du Garizim » renvoie au temple qui s’y trouvait.
- source_word: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: conformément à la situation des habitants du lieu
  rationale: La tournure grecque est comprimée et ambiguë. Cette traduction maintient son caractère circonstanciel sans préciser indûment s’il s’agit du statut, de la condition ou de l’usage des habitants.
- source_word: Διὸς ξενίου
  choice: Zeus Hospitalier
  rationale: Ξένιος est l’épithète de Zeus considéré comme protecteur des hôtes, des étrangers et des devoirs d’hospitalité. « Hospitalier » conserve la forme d’un titre divin, explicitée en note.
theological_decisions:
- issue: Traduction des titres de divinités païennes dans le récit de la profanation cultuelle
  choice: Zeus Olympien et Zeus Hospitalier
  alternative: Zeus Olympios et Zeus Xenios
  rationale: La traduction des épithètes permet au lecteur francophone de saisir la nature de la redésignation forcée, tout en maintenant clairement l’identité historique de Zeus.
- issue: Sens de καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: conformément à la situation des habitants du lieu
  alternative: comme l’avaient demandé les habitants du lieu; conformément à la condition des habitants du lieu; selon l’usage des habitants du lieu
  rationale: Le grec ne mentionne explicitement ni une demande ni une coutume. La formulation retenue préserve donc l’ambiguïté du rapport entre l’épithète et les habitants.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la coordination et l’ellipse du grec tout en répétant « donner » pour assurer la clarté. « Profaner » porte naturellement la valeur cultuelle de μολῦναι; les épithètes sont traduites plutôt que simplement translittérées.
