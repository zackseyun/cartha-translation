  text: But the altar was filled with unlawful things by those who had departed from the laws[a].
translation:
  language: fr
  text: Mais l’autel avait été rempli de choses interdites[a] par ceux qui s’étaient écartés des lois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’abominations » ou « de choses illicites ». Le grec désigne ce qui est défendu ou non permis, ici dans un contexte de profanation cultuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
  choice: l’autel
  rationale: « Autel » est le sens courant et suffit dans ce contexte, sans ajouter l’explicitation « autel des sacrifices ».
- source_word: ἀποδιεσταλμένοις
  choice: ceux qui s’étaient écartés de
  rationale: Cette formulation exprime la séparation d’avec les lois tout en évitant le terme plus interprétatif « apostats ».
- source_word: νόμων
  choice: des lois
  rationale: Le pluriel explicite du grec est conservé. Le contexte indique les lois juives, mais « ancestrales » n’est pas exprimé dans ce verset.
- source_word: ἀθεμίτοις
  choice: de choses interdites
  rationale: L’adjectif désigne ce qui n’est pas permis ou autorisé. « Choses » restitue naturellement en français le substantif implicite, sans renforcer indûment le terme en « abominations ».
- source_word: ἐπεπλήρωτο
  choice: était rempli
  rationale: 'L’imparfait passif français rend naturellement l’état résultant exprimé par le plus-que-parfait grec : l’autel se trouvait rempli.'
theological_decisions:
- issue: Faut-il rendre ἀθεμίτοις par un terme cultuel plus fort ?
  choice: choses interdites
  alternative: abominations ; choses illicites
  rationale: Le contexte est celui d’une profanation cultuelle, mais le mot grec désigne d’abord ce qui est défendu ou non permis. « Choses interdites » conserve cette portée juridico-religieuse sans imposer une qualification théologique plus forte.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suit de près le grec tout en restant naturelle ; le pluriel « lois » et l’indétermination de « choses interdites » sont conservés.
