base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
translation:
  language: fr
  text: C’est pourquoi j’exhorte ceux qui lisent ce livre[a] à ne pas se laisser abattre[b] par ces malheurs, mais à considérer que ces châtiments ne visent pas la destruction, mais la correction de notre peuple[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut signifier « rencontrer », « tomber sur » ou, dans ce contexte, « lire » ce livre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à ne pas perdre courage » ou « à ne pas être accablés ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot grec peut aussi désigner la discipline, la formation ou l’instruction corrective.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: j’exhorte
  rationale: Le verbe introduit ici un appel pressant du narrateur. « J’exhorte » en conserve la force dans un registre digne et actuel.
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  choice: ceux qui lisent ce livre
  rationale: Avec un livre pour complément, ἐντυγχάνω désigne naturellement ceux qui entrent en contact avec l’écrit, donc ses lecteurs. « Lisent » est plus idiomatique en français que le calque « rencontrent ».
- source_word: μὴ συντελεσθαι
  choice: à ne pas se laisser abattre
  rationale: Dans ce contexte, l’expression évoque le fait d’être intérieurement accablé ou poussé au découragement, plutôt qu’un simple achèvement matériel.
- source_word: διὰ τὰς συμφορὰς
  choice: par ces malheurs
  rationale: συμφοραί désigne de graves revers ou calamités. « Malheurs » est naturel en français et garde la gravité du contexte.
- source_word: λογίζεσθαι
  choice: à considérer
  rationale: Le verbe demande une appréciation réfléchie de la portée des châtiments.
- source_word: τὰς τιμωρίας
  choice: ces châtiments
  rationale: τιμωρία signifie punition ou peine. « Châtiments » convient au contexte solennel sans préciser dans le texte l’agent qui les inflige.
- source_word: μὴ πρὸς ὄλεθρον
  choice: ne visent pas la destruction
  rationale: πρὸς exprime ici l’orientation ou la finalité, et ὄλεθρος la ruine ou la destruction. « Ne visent pas » rend clairement cette valeur sans ajouter « sont destinés par Dieu ».
- source_word: ἀλλὰ πρὸς παιδείαν
  choice: mais la correction
  rationale: παιδεία associe correction, formation et instruction. « Correction » rend ici la dimension de châtiment formateur et maintient le contraste avec la destruction.
- source_word: τοῦ γένους ἡμῶν
  choice: de notre peuple
  rationale: γένος renvoie ici à la communauté juive envisagée comme groupe d’origine commune. « Notre peuple » est naturel et évite les connotations modernes trompeuses de « race ».
theological_decisions:
- issue: 'Finalité des souffrances : destruction ou correction'
  choice: Les châtiments sont présentés comme visant la correction du peuple plutôt que sa destruction.
  alternative: Comprendre παιδεία au sens plus général d’instruction ou d’éducation.
  rationale: Le contraste explicite μὴ πρὸς ὄλεθρον, ἀλλὰ πρὸς παιδείαν attribue aux épreuves une portée corrective et formatrice, non destructrice. La formulation ne précise pas davantage l’agent des châtiments et n’élargit donc pas le verset en une doctrine complète de la providence.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve l’appel direct du narrateur ainsi que l’opposition téléologique entre destruction et correction, sans expliciter un agent que ce verset ne nomme pas.
