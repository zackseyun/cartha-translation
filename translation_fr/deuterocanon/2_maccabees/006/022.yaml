  text: so that[a], after doing this, he might be released from death[b], and because of their long-standing friendship with him might receive kindness.
translation:
  language: fr
  text: afin qu’après avoir fait cela, il échappe à la mort[a] et que, en raison de l’amitié de longue date qui le liait à eux, il bénéficie de leur bienveillance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soit libéré de la mort », c’est-à-dire qu’il soit épargné de l’exécution.
    reason: lexical_alternative
  - marker: b
    text: Ou « reçoive un traitement humain »; le terme grec peut désigner la bonté, la bienveillance ou l’humanité manifestée envers quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but recherché; « afin que » en conserve clairement la valeur finale dans un français naturel et digne.
- source_word: τοῦτο πράξας
  choice: après avoir fait cela
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal; cette formulation la rend explicitement sans lourdeur.
- source_word: ἀπολυθῇ τοῦ θανάτου
  choice: il échappe à la mort
  rationale: Dans ce contexte d’exécution, ἀπολύω avec le génitif signifie être libéré ou épargné de la mort. « Échapper à la mort » est idiomatique et ne suggère pas une délivrance spirituelle ou posthume.
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  choice: en raison de l’amitié de longue date qui le liait à eux
  rationale: ἀρχαία désigne une relation ancienne ou durable, et πρὸς αὐτούς marque son orientation envers ces hommes. La tournure choisie garde le rapport grammatical sans inverser silencieusement le point de vue.
- source_word: τύχοι φιλανθρωπίας
  choice: il bénéficie de leur bienveillance
  rationale: τυγχάνω avec le génitif signifie obtenir ou recevoir; φιλανθρωπία désigne ici la bienveillance, la bonté ou un traitement humain. « Bénéficier de leur bienveillance » convient naturellement au contexte.
theological_decisions:
- issue: Portée de la délivrance de la mort
  choice: Comprendre la clause comme le fait d’échapper à l’exécution imminente.
  alternative: « être délivré de la mort » ou « être libéré de la condamnation à mort »
  rationale: Le contexte est narratif et judiciaire, non une affirmation sur le salut ou l’au-delà. La formulation retenue évite d’importer une portée doctrinale étrangère au passage.
- issue: Orientation de l’amitié ancienne
  choice: Présenter cette amitié comme celle qui liait Éléazar à ses interlocuteurs.
  alternative: « en raison de leur amitié de longue date pour lui »
  rationale: Le grec πρὸς αὐτούς signifie littéralement « envers eux » et se rapporte le plus naturellement à l’amitié d’Éléazar pour eux, tout en décrivant une relation réciproque. La traduction conserve cette orientation sans produire une expression française maladroite.
translation_notes:
  register: Français international moderne, fluide et digne. La structure finale du grec est conservée, tandis que les expressions idiomatiques évitent le calque. Les deux marqueurs de notes figurent dans le texte.
