  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
translation:
  language: fr
  text: Peu de temps après, le roi envoya un Athénien âgé pour contraindre les Juifs à abandonner les lois de leurs pères et à ne pas vivre selon les lois de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  choice: Peu de temps après
  rationale: Cette tournure française naturelle restitue exactement l’idée temporelle de « après peu de temps », sans lourdeur littérale.
- source_word: ἐξαπέστειλεν
  choice: envoya
  rationale: Le verbe signifie envoyer au-dehors ou dépêcher ; « envoya » est précis et naturel ici.
- source_word: γέροντι Ἀθηναῖον
  choice: un Athénien âgé
  rationale: γέρων décrit vraisemblablement l’âge de l’homme plutôt qu’une fonction officielle. Cette formulation évite de suggérer le titre d’« ancien ».
- source_word: ἀναγκάζειν
  choice: pour contraindre
  rationale: L’infinitif indique le but de l’envoi et exprime clairement la coercition.
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  choice: à abandonner les lois de leurs pères
  rationale: Dans ce contexte, μεταβαίνειν ἀπό désigne le fait de se détourner d’un cadre normatif. « Abandonner » en rend clairement la portée, tandis que « de leurs pères » conserve l’expression familiale du grec.
- source_word: τοῖς τοῦ θεοῦ νόμοις μὴ πολιτεύεσθαι
  choice: à ne plus vivre selon les lois de Dieu
  rationale: πολιτεύεσθαι concerne la conduite de la vie, avec une possible nuance civique. « Vivre selon » en exprime naturellement le sens général ; « ne plus » rend en français le changement de conduite imposé par le contexte.
theological_decisions:
- issue: Rendu de πατρίων
  choice: les lois de leurs pères
  alternative: les lois ancestrales ; les lois de leurs ancêtres
  rationale: Le grec emploie un adjectif à portée paternelle et ancestrale. Le choix retenu préserve cette texture familiale sans réduire l’expression à une tradition abstraite.
- issue: Portée de πολιτεύεσθαι sous les lois divines
  choice: vivre selon les lois de Dieu
  alternative: régler leur conduite sur les lois de Dieu ; organiser leur vie collective selon les lois de Dieu
  rationale: Le verbe peut comporter une nuance civique, mais désigne ici plus largement la manière de vivre. La formulation retenue ne limite donc pas indûment le propos à la seule vie politique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le parallélisme entre les lois héritées des pères et les lois de Dieu. Aucun appel de note n’est nécessaire, car les principales nuances peuvent être rendues directement dans le texte.
