  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
translation:
  language: fr
  text: Mais après l’avoir recraché, il s’avança comme doivent le faire ceux qui tiennent bon et résistent à ce qu’il n’est pas permis de goûter[a], même par amour de la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui persévèrent à se défendre contre ce qu’il n’est pas permis de goûter ». Le grec condense dans une construction difficile les idées de persévérance et de résistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προπτύσας
  choice: après l’avoir recraché
  rationale: Le participe aoriste indique qu’Éléazar expulse de sa bouche ce qu’on lui avait fait prendre. « Recracher » exprime naturellement cette action en français.
- source_word: καθʼ ὃν ἔδει τρόπον προσέρχεσθαι
  choice: il s’avança comme doivent le faire
  rationale: La tournure exprime la manière conforme à ce qui est nécessaire ou juste. Le verbe de mouvement est rendu explicitement pour donner une phrase française autonome, en accord avec le mouvement déjà engagé dans le contexte immédiat.
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  choice: ceux qui tiennent bon et repoussent
  rationale: ὑπομένω évoque la fermeté dans l’épreuve, tandis que ἀμύνομαι signifie repousser ou se défendre contre. La coordination française conserve les deux aspects sans réduire la formule à un simple choix intérieur.
- source_word: ὧν οὐ θέμις γεύσασθαι
  choice: ce qu’il n’est pas permis de goûter
  rationale: θέμις porte une force morale et religieuse, et γεύομαι désigne littéralement le fait de goûter. Cette formulation préserve les deux nuances.
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  choice: même par attachement à la vie
  rationale: φιλοστοργία désigne une affection ou un attachement profond et naturel. Dans ce contexte, l’idée est que le désir de rester en vie ne justifie pas de goûter l’aliment interdit.
theological_decisions:
- issue: Force éthique et religieuse de οὐ θέμις dans le récit du martyre juif
  choice: ce qu’il n’est pas permis de goûter
  alternative: ce qu’il est interdit de goûter
  rationale: « Il n’est pas permis » conserve la notion d’une limite fondée sur la loi et l’ordre religieux, sans préciser davantage que le grec la nature de cette interdiction.
- issue: Rapport entre la fermeté exprimée par ὑπομένοντας et la résistance exprimée par ἀμύνασθαι
  choice: ceux qui tiennent bon et repoussent
  alternative: ceux qui choisissent de résister
  rationale: Le grec associe l’endurance ferme à une réaction active. La traduction garde cette tension au lieu de fondre les deux verbes en une seule notion de décision.
translation_notes:
  register: Français international moderne, naturel et digne. « Recraché » est concret sans être familier; « tiennent bon et repoussent » rend lisible la construction grecque comprimée tout en en signalant l’ambiguïté en note.
