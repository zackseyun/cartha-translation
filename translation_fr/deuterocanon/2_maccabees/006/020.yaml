  naturalness: La phrase est globalement naturelle et digne. « Même par attachement à la vie » reste un peu elliptique en français moderne ; « même par amour de la vie » exprime plus idiomatiquement la concession causale portée par διὰ ... φιλοστοργία. La note actuelle contient « endurent de repousser », formulation peu naturelle.
  terminology: « Il n’est pas permis » maintient correctement la portée éthique et religieuse de θέμις sans la surinterpréter. « Tenir bon » restitue sobrement ὑπομένοντας. « Amour de la vie » est une formulation française usuelle pour φιλοστοργία πρὸς ζῆν, sans ajout doctrinal.
