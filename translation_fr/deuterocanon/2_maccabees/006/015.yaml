translation:
  language: fr
  text: afin que, lorsque nos péchés auront atteint leur terme[a], il[b] ne tire pas ensuite vengeance de nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « seront arrivés à leur terme ». L’expression peut désigner le moment où les péchés atteignent leur terme, leur limite ou leur pleine mesure.'
    reason: lexical_alternative
  - marker: b
    text: Le sujet « il » n’est pas exprimé en grec ; le contexte immédiat renvoie au Seigneur.
    reason: implicit_subject
lexical_decisions:
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Cette tournure rend naturellement en français la proposition de but et sa négation, en lien avec l’action du Seigneur évoquée dans le contexte immédiat.
- source_word: πρὸς τέλος
  choice: leur pleine mesure
  rationale: Avec ἀφικομένων, l’expression indique que les péchés atteignent un terme ou une limite. « Leur pleine mesure » communique ce sens sans réduire nécessairement τέλος à une simple fin chronologique.
- source_word: ἀφικομένων
  choice: auront atteint
  rationale: Le participe du génitif absolu exprime ici l’arrivée à une limite. Le futur antérieur convient en français après « lorsque » pour une action accomplie avant celle de la proposition principale envisagée.
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  choice: nos péchés
  rationale: Le possessif français restitue directement et naturellement le groupe grec.
- source_word: ὕστερον
  choice: ensuite
  rationale: Le terme marque une action ultérieure, par contraste avec la discipline exercée sans attendre dans le contexte.
- source_word: ἐκδικά
  choice: exerce sa vengeance contre
  rationale: Ce choix conserve la force judiciaire et rétributive du verbe, plus marquée que le simple verbe « punir », tout en restant intelligible en français moderne.
theological_decisions:
- issue: Le sujet divin du verbe est implicite dans la proposition grecque.
  choice: il n’exerce pas ensuite sa vengeance contre nous
  alternative: le Seigneur n’exerce pas ensuite sa vengeance contre nous
  rationale: Le contexte immédiat identifie le Seigneur comme acteur, mais le grec ne le nomme pas dans cette proposition. Le pronom « il », nécessaire en français, préserve cette économie sans ajouter un titre absent du verset.
- issue: La portée de πρὸς τέλος appliqué aux péchés
  choice: nos péchés auront atteint leur pleine mesure
  alternative: nos péchés seront arrivés à leur terme
  rationale: « Pleine mesure » exprime l’idée contextuelle d’une limite atteinte, tandis que la note conserve la formulation plus littérale et l’ambiguïté possible entre terme, limite et accomplissement.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste un fragment syntaxiquement rattaché au verset précédent. « Exerce sa vengeance » maintient la portée rétributive du grec sans employer une formulation excessivement archaïque.
