  source_fidelity: 'Le sens global est bien rendu : ἵνα μή introduit la finalité négative, le sujet divin demeure implicite, et ὕστερον marque l’action ultérieure. Toutefois, « exercer sa vengeance contre nous » est moins idiomatique et ajoute un possessif absent du grec. « Tirer vengeance de nous » rend plus directement ἐκδικά et conserve sa portée rétributive. « Atteint leur terme » préserve mieux l’image de πρὸς τέλος tout en laissant la note expliciter la possibilité de « pleine mesure ».'
