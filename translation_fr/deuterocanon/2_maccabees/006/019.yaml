  text: But he[a], choosing death with honor rather than life with defilement, went to the rack of his own accord,
translation:
  language: fr
  text: Mais lui, ayant choisi une mort honorable plutôt qu’une vie dans la souillure, s’avança de son plein gré vers l’instrument de torture[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « vers le tympanon », terme grec désignant un appareil de torture. Il est parfois rendu par « tambour » ou « roue », mais sa forme exacte demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ εὐκλείας θάνατον
  choice: une mort honorable
  rationale: εὐκλεία évoque l’honneur et la bonne réputation. « Une mort honorable » exprime naturellement en français le contraste recherché sans ajouter l’idée de gloire posthume.
- source_word: μετὰ μύσους βίον
  choice: une vie dans la souillure
  rationale: μύσος désigne une souillure à portée morale ou religieuse. « Dans la souillure » conserve cette force et reprend la construction parallèle avec μετά.
- source_word: ἀναδεξάμενος
  choice: choisissant
  rationale: Le participe indique ici l’acceptation délibérée de la mort proposée dans le contraste. « Choisissant » rend clairement cette résolution dans le contexte.
- source_word: αὐθαιρέτως
  choice: de son plein gré
  rationale: Cette expression française naturelle souligne que son mouvement est volontaire et procède de sa propre décision.
- source_word: ἐπὶ τὸ τύμπανον
  choice: vers le chevalet de torture
  rationale: Dans ce contexte, τύμπανον désigne un appareil de torture plutôt qu’un instrument de musique. « Chevalet de torture » en communique la fonction, tandis que la note signale l’incertitude sur sa forme exacte.
- source_word: προσῆγεν
  choice: s’avança
  rationale: Le verbe décrit son mouvement vers l’appareil. La forme pronominale française, éclairée par αὐθαιρέτως, évite de donner à tort l’impression qu’il y fut conduit passivement.
theological_decisions:
- issue: Portée de μύσος dans le récit du martyre
  choice: souillure
  alternative: déshonneur ; pollution
  rationale: « Souillure » maintient la dimension à la fois morale et religieuse du compromis envisagé, sans la réduire à la honte sociale ni préciser indûment une catégorie rituelle.
- issue: Identification du τύμπανον
  choice: chevalet de torture
  alternative: tambour ; roue de torture ; tympanon
  rationale: Le contexte impose un instrument de supplice, mais sa configuration exacte demeure incertaine. La traduction fonctionnelle assure l’intelligibilité, et la note préserve le terme grec ainsi que l’incertitude historique.
translation_notes:
  register: Français international moderne, digne et narratif. Le parallélisme entre la mort honorable et la vie dans la souillure est maintenu; « de son plein gré » souligne explicitement la volonté d’Éléazar.
