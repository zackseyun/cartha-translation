  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
translation:
  language: fr
  text: Car même si, pour le moment, j’échappe au châtiment infligé par des hommes[a], je n’échapperai pas aux mains du Tout-Puissant, ni vivant ni mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le châtiment venant des hommes ».'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, il ne peut échapper aux mains du Tout-Puissant ni durant sa vie ni par la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  choice: Car même si
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « même si » rend naturellement la concession portée par εἰ…καί.
- source_word: ἐπὶ τοῦ παρόντος
  choice: pour le moment
  rationale: Expression française courante qui maintient la limitation temporelle du grec.
- source_word: ἐξελοῦμαι
  choice: j’échappe
  rationale: Dans ce contexte, le moyen exprime le fait de se soustraire au châtiment; « échapper » est précis et idiomatique.
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  choice: au châtiment infligé par des hommes
  rationale: Cette formulation explicite sans surcharge la provenance humaine du châtiment et fait ressortir son contraste avec la puissance divine.
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  choice: aux mains du Tout-Puissant
  rationale: « Tout-Puissant » est l’équivalent français reconnu de παντοκράτωρ; l’image concrète des « mains » est conservée.
- source_word: οὔτε ζῶν οὔτε ἀποθανών
  choice: ni vivant ni mort
  rationale: La formulation brève restitue la polarité frappante du grec et affirme que la mort ne permet pas davantage d’échapper.
- source_word: ἐκφεύξομαι
  choice: je n’échapperai
  rationale: Le futur et l’idée de fuite hors d’une puissance qui saisit sont rendus naturellement; la double négation grecque est portée par « ni… ni ».
theological_decisions:
- issue: Traduction du titre παντοκράτωρ
  choice: le Tout-Puissant
  alternative: Celui qui gouverne tout
  rationale: Le titre traditionnel et intelligible « Tout-Puissant » exprime la souveraineté et la puissance divines sans ajouter le nom « Dieu », absent du grec.
- issue: Portée de οὔτε ζῶν οὔτε ἀποθανών
  choice: ni vivant ni mort
  alternative: ni de mon vivant ni après ma mort
  rationale: Le texte indique que la mort ne soustrait pas le locuteur aux mains divines. La traduction conserve cette affirmation et sa tension théologique sans développer une doctrine plus précise de l’au-delà.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le contraste rhétorique entre le châtiment humain, auquel il serait momentanément possible d’échapper, et les mains du Tout-Puissant, auxquelles ni la vie ni la mort ne permettent de se soustraire.
