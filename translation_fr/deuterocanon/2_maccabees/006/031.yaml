base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
translation:
  language: fr
  text: C’est ainsi donc qu’il quitta ce monde[a], laissant sa propre mort comme exemple de courage et comme mémorial de vertu[b], non seulement pour les jeunes, mais aussi pour la plupart de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il mourut ». Le grec emploie une expression plus élevée que le verbe ordinaire signifiant mourir.
    reason: lexical_alternative
  - marker: b
    text: « Vertu » peut aussi se rendre par « excellence morale ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μετήλλαξεν
  choice: il quitta ce monde
  rationale: Le verbe est ici un euphémisme élevé désignant la mort. Cette expression française conserve la dignité du récit tout en restant claire.
- source_word: τοῦτον τὸν τρόπον
  choice: ainsi
  rationale: La formule indique la manière et renvoie au récit précédent. « Ainsi » rend naturellement l'expression sans lourdeur.
- source_word: ὑπόδειγμα
  choice: exemple
  rationale: Le terme désigne un modèle présenté à l'imitation ; « exemple » est direct et courant.
- source_word: γενναιότητος
  choice: courage
  rationale: Dans le contexte de la mort volontairement assumée d'Éléazar, le mot exprime surtout la vaillance morale, rendue clairement par « courage ».
- source_word: μνημόσυνον
  choice: mémorial
  rationale: Le nom désigne ce qui garde durablement le souvenir ; « mémorial » préserve le registre solennel et commémoratif.
- source_word: ἀρετῆς
  choice: vertu
  rationale: Le terme évoque ici l'excellence morale. « Vertu » en conserve la portée éthique sans ajouter de catégorie doctrinale ultérieure.
- source_word: τοῖς νέοις
  choice: aux jeunes
  rationale: Le datif désigne les bénéficiaires de cet exemple ; la formulation est concise, inclusive et naturelle.
- source_word: τοῖς πλείστοις τοῦ ἔθνους
  choice: à la plupart des gens de sa nation
  rationale: ἔθνος renvoie ici au peuple juif. Cette formulation exprime clairement l'appartenance nationale sans que « la plupart de la nation » sonne abstrait en français.
- source_word: καταλιπών
  choice: laissant
  rationale: Le participe décrit l'héritage moral que sa mort constitue pour ceux qui restent.
theological_decisions:
- issue: Terminologie morale dans le récit d'un martyre
  choice: « courage » pour γενναιότης et « vertu » pour ἀρετή
  alternative: « noblesse » et « excellence morale »
  rationale: Ce couple exprime nettement la vaillance et la qualité morale attribuées à Éléazar, sans introduire de lecture doctrinale anachronique.
- issue: Expression euphémique de la mort
  choice: « il quitta ce monde »
  alternative: « il mourut »
  rationale: Le grec emploie une expression plus élevée que le verbe ordinaire « mourir » ; le français conserve ici cette tonalité solennelle.
- issue: Valeur exemplaire de la mort d'Éléazar
  choice: « laissant par sa mort un exemple »
  alternative: « laissant sa propre mort comme exemple »
  rationale: La formulation française exprime le moyen par lequel l'exemple est laissé, sans suggérer une doctrine particulière du martyre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la conclusion narrative. « Mémorial de vertu » maintient l'image grecque, même si elle est légèrement plus soutenue que la langue courante.
