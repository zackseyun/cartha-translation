  source_fidelity: 'Le sens général est bien rendu : les responsables, mus par la compassion et leur ancienne connaissance de l’homme, lui proposent une mise en scène avec une viande licite préparée par lui-même. Une légère révision améliore toutefois la force pragmatique de ἐκάλουν et clarifie en français la portée de l’ordre du roi.'
  naturalness: La phrase est fluide et de registre narratif soutenu. « L’invitèrent » paraît cependant trop atténué dans ce contexte, et la séquence « les viandes ... que le roi avait ordonné de manger » est syntaxiquement ambiguë en français.
  terminology: « Repas interdit », « compassion », « viande », « faire semblant » et « viandes provenant du sacrifice » sont appropriés. « Il lui était permis de consommer » rend de manière naturelle, dans ce contexte, ce qui lui convenait/était licite.
