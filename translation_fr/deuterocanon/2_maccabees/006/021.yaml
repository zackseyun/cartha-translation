base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
translation:
  language: fr
  text: Mais ceux qui étaient chargés du repas interdit[a], pris de compassion parce qu’ils connaissaient cet homme depuis longtemps, le prirent à part et l’exhortèrent à apporter de la viande qu’il lui était permis de consommer, préparée par ses propres soins, puis à faire semblant de manger les viandes provenant du sacrifice, dont le roi avait ordonné qu’il mange[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est elliptique et peut aussi se traduire par « les pratiques interdites ». Le contexte renvoie au repas imposé, composé de viandes sacrificielles défendues par la Loi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les viandes provenant du sacrifice »; il s’agit des viandes issues des sacrifices païens que le roi lui avait ordonné de manger.'
    reason: cultural_note
lexical_decisions:
- source_word: οἱ ... πρὸς τὰ παράνομα ... τεταγμένοι
  choice: ceux qui étaient chargés du repas interdit
  rationale: Le participe parfait passif indique des personnes affectées à une tâche. Dans le contexte immédiat, τὰ παράνομα désigne concrètement le repas contraire à la Loi, sans être assimilé à θυσία, qui apparaît plus loin.
- source_word: σπλαγχνισμοῦ ... διὰ τὴν ... γνῶσιν
  choice: pris de compassion parce qu’ils connaissaient cet homme depuis longtemps
  rationale: Cette formulation exprime explicitement la compassion indiquée par σπλαγχνισμοῦ et rattache naturellement ce sentiment à leur ancienne connaissance personnelle d’Éléazar.
- source_word: ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν ἐκάλουν
  choice: le prirent à part et l’invitèrent
  rationale: ἀπολαμβάνοντες ... κατʼ ἰδίαν décrit la mise à l’écart; ἐκάλουν introduit ici leur proposition pressante. « Invitèrent » reste naturel sans surcharger le degré d’insistance.
- source_word: κρέα, οἷς καθῆκον αὐτῷ χρᾶσθαι
  choice: de la viande qu’il lui était permis de consommer
  rationale: Dans ce contexte alimentaire et légal, « consommer » explicite χρᾶσθαι, tandis que « permis » rend la convenance normative de καθῆκον.
- source_word: διʼ αὐτοῦ παρασκευασθέντα
  choice: préparée par ses propres soins
  rationale: La formule indique que la viande serait préparée sous sa responsabilité, par opposition aux viandes sacrificielles imposées.
- source_word: ὑποκρῖναι
  choice: faire semblant
  rationale: Le verbe signifie ici feindre un acte, et non simplement répondre ou jouer un rôle.
- source_word: τῶν ἀπὸ τῆς θυσίας κρεῶν
  choice: les viandes provenant du sacrifice
  rationale: Le pluriel respecte κρεῶν et la provenance indiquée par ἀπὸ τῆς θυσίας, tout en conservant la distinction avec τὰ παράνομα.
- source_word: τὰ ὑπὸ τοῦ βασιλέως τεταγμένα
  choice: que le roi avait ordonné de manger
  rationale: Le contexte exige de comprendre l’ordre royal comme portant sur la consommation de ces viandes; l’ajout de « manger » rend l’ellipse claire en français.
theological_decisions:
- issue: Portée de τὰ παράνομα
  choice: le repas interdit
  alternative: les pratiques interdites / le sacrifice interdit
  rationale: Le contexte porte sur l’obligation de manger une nourriture défendue. « Repas interdit » est concret et intelligible, tout en évitant de confondre τὰ παράνομα avec θυσία, le sacrifice nommé ensuite.
- issue: Expression de la compassion dans σπλαγχνισμοῦ
  choice: rendre explicitement la compassion dans le texte
  alternative: ne l’évoquer que dans une note ou la fondre dans l’ancienne connaissance
  rationale: Le grec contient expressément l’idée de compassion. La conserver dans le corps du verset évite d’appauvrir la motivation des responsables.
- issue: Caractère licite de la viande apportée
  choice: qu’il lui était permis de consommer
  alternative: qu’il lui convenait d’utiliser
  rationale: Le contraste narratif porte sur la fidélité aux prescriptions alimentaires. La formulation française rend cette dimension sans préciser davantage la nature de la viande ni importer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la longue progression syntaxique du grec tout en clarifiant ses rapports logiques. « La Loi » dans la note renvoie au cadre alimentaire juif sans ajouter de précision doctrinale.
