base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/018.yaml
  text: Carried away by ancient conceit[a], they barred us from entry, falling short of our strength, by which we have goodwill toward all people.
translation:
  language: fr
  text: Emportés par une arrogance ancienne[a], ils nous ont interdit l’entrée, restant en deçà de notre puissance, par laquelle nous faisons preuve de bienveillance envers tous les êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Emportés par une arrogance héritée du passé », « emportés par un orgueil ancien » ou « poussés par un orgueil de longue date ». L’expression grecque est concise et peut évoquer une arrogance ancienne, durable ou héritée.
    reason: lexical_alternative
lexical_decisions:
- source_word: τύφοις φερόμενοι παλαιοτέροις
  choice: Emportés par une arrogance héritée du passé
  rationale: La tournure conserve la valeur passive de φερόμενοι et rend le pluriel compact τύφοις ainsi que la nuance temporelle de παλαιοτέροις sans suggérer simplement que l’arrogance serait celle de personnes âgées.
- source_word: εἶρξαν ἡμᾶς τῆς εἰσόδου
  choice: ils nous ont interdit l’entrée
  rationale: Avec le génitif, εἴργω exprime ici le fait d’empêcher l’accès. Cette formulation est concise et naturelle en français moderne.
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  choice: tout en restant bien en deçà de notre puissance
  rationale: λειπόμενοι marque une infériorité par rapport à ἀλκή. «Puissance» convient au ton royal et permet de maintenir le lien explicite avec la proposition relative qui suit.
- source_word: διʼ ἣν
  choice: grâce à laquelle
  rationale: Le relatif féminin renvoie à ἀλκή. La traduction garde ce lien et exprime la puissance comme le moyen ou le fondement de la bienveillance revendiquée.
- source_word: ἔχομεν … φιλανθρωπίαν
  choice: nous faisons preuve de bienveillance
  rationale: Cette expression française rend naturellement le fait d’avoir ou de manifester une disposition favorable envers autrui.
- source_word: πρὸς ἅπαντας ἀνθρώπους
  choice: envers tous les êtres humains
  rationale: ἀνθρώπους désigne ici l’humanité sans distinction de sexe; la formulation est exacte, inclusive et courante.
theological_decisions:
- issue: Lien entre la puissance royale et la bienveillance universelle
  choice: grâce à laquelle nous faisons preuve de bienveillance
  alternative: à cause de laquelle nous éprouvons de la bienveillance
  rationale: Le texte rattache explicitement διʼ ἣν à ἀλκή. La traduction préserve cette affirmation rhétorique, même si le rapport entre puissance et bienveillance peut paraître tendu, sans le réinterpréter moralement.
- issue: Portée générique de ἀνθρώπους
  choice: tous les êtres humains
  alternative: tous les hommes
  rationale: Le terme grec est générique dans ce contexte et ne vise pas uniquement les personnes de sexe masculin.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase garde le ton hautain de la proclamation royale et son association volontairement frappante entre puissance et bienveillance.
