base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
translation:
  language: fr
  text: Non seulement ils se sont détournés de l’ordre civique honorable[a], mais ils ont aussi en horreur, par la parole comme par le silence[b], les quelques-uns d’entre eux qui sont sincèrement bien disposés envers nous et, à chaque occasion, sous le prétexte le plus impie[c], ils se précipitent pour ruiner nos affaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi désigner « la citoyenneté honorable » ou « l’ordre civique estimé ». L’adjectif peut formellement se comprendre comme « déshonoré » ou « méprisé », mais le contexte accusateur favorise ici le sens positif.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la parole comme par le silence », ce qui peut désigner une hostilité aussi bien déclarée que tacite.'
    reason: clarification
  - marker: c
    text: 'Ou : « avec l’apparence la plus impie » ou « avec l’insinuation la plus impie » ; le terme grec peut désigner une manifestation, une apparence, une insinuation ou un prétexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεστρέψαντο
  choice: ils se sont détournés de
  rationale: Le moyen exprime ici un rejet volontaire ou le fait de se détourner d’un statut; cette formulation conserve l’image grecque sans affaiblir la portée accusatrice.
- source_word: τὴν ἄτιμητον πολιτίαν
  choice: cet inestimable statut civique
  rationale: πολιτεία désigne ici une condition ou organisation civique, possiblement la citoyenneté elle-même. « Statut civique » laisse cette étendue ouverte. ἄτιμητον est compris dans le contexte rhétorique comme « d’une valeur inestimable », tout en signalant en note son ambiguïté formelle.
- source_word: βδελύσσονται
  choice: ils ont en horreur
  rationale: Rend la forte répulsion exprimée par le verbe tout en gardant un registre digne et naturel.
- source_word: λόγῳ τε καὶ σιγῇ
  choice: par leurs paroles comme par leur silence
  rationale: Traduction proche de la construction grecque, qui maintient la tension entre hostilité exprimée et hostilité tacite.
- source_word: τοὺς ἐν αὐτοῖς ὀλίγους
  choice: les quelques-uns d’entre eux
  rationale: Rend directement l’idée d’une petite minorité au sein du groupe visé.
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  choice: qui sont sincèrement bien disposés envers nous
  rationale: διακεῖμαι avec πρός décrit une disposition favorable; γνησίως en souligne la sincérité sans imposer la notion plus forte de loyauté politique officielle.
- source_word: παρʼ ἕκαστα
  choice: à chaque occasion
  rationale: Expression idiomatique appropriée au sens contextuel de répétition dès qu’une occasion se présente.
- source_word: ἐφορμώμενοι
  choice: ils passent à l’attaque
  rationale: Le participe évoque un élan hostile ou un assaut; cette expression française en restitue la force mieux qu’un simple « poussés ».
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  choice: affichant la plus grande impiété
  rationale: ἐμφάσις peut désigner une manifestation, une apparence ou une insinuation. « Affichant » conserve ici l’idée de manifestation visible sans trancher en faveur du seul sens de « prétexte » ou d’« intention ».
- source_word: διὰ τάχους
  choice: rapidement
  rationale: L’expression marque la rapidité et porte naturellement en français sur le projet de ruine.
- source_word: ἡμᾶς καταστρέψαι τὰ πράγματα
  choice: afin de ruiner rapidement nos affaires
  rationale: καταστρέφω exprime le renversement ou la ruine, tandis que τὰ πράγματα désigne largement les affaires ou la situation politique du locuteur.
theological_decisions:
- issue: Valeur de ἄτιμητον appliqué à πολιτίαν
  choice: inestimable statut civique
  alternative: statut civique déshonoré ou méprisé
  rationale: La forme grecque peut formellement recevoir une valeur négative (« sans honneur », « méprisé »), mais l’accusation selon laquelle les destinataires ont rejeté un avantage civique se comprend plus naturellement avec le sens « inestimable » ou « précieux ». La note conserve explicitement l’autre possibilité au lieu de masquer l’ambiguïté.
- issue: Sens de ἐμφάσεως
  choice: manifestation d’impiété (« affichant la plus grande impiété »)
  alternative: prétexte très impie ou intention très impie
  rationale: Le substantif peut évoquer une manifestation, une apparence, une insinuation ou un prétexte. Le texte principal retient une formulation proche de l’idée de manifestation, et la note présente les autres lectures plausibles.
translation_notes:
  register: Français international moderne, digne et lisible. La longue période grecque est divisée en deux phrases pour plus de clarté, sans modifier la progression de l’accusation. Le vocabulaire politique reste volontairement assez large, et les ambiguïtés de ἄτιμητον et ἐμφάσεως sont conservées dans les notes.
