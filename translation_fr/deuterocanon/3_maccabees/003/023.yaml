  naturalness: La phrase révisée demeure idiomatique en français international moderne. « Ont en horreur » convient au registre soutenu. La coordination en une seule phrase conserve la progression du grec sans lourdeur excessive.
  terminology: « Ordre civique » couvre πολιτεία sans le réduire à la citoyenneté individuelle. « Sous le prétexte le plus impie » rend la valeur accusatrice de μετὰ ... ἐμφάσεως, tandis que la note conserve les autres possibilités. « Affaires » garde l’ampleur de τὰ πράγματα.
