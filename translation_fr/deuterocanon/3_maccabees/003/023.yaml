revisions:
- from: Non seulement ils se sont détournés de cet inestimable statut civique[a], mais ils ont aussi en horreur, par leurs paroles comme par leur silence[b], les quelques-uns d’entre eux qui sont sincèrement bien disposés envers nous. À chaque occasion, ils passent à l’attaque, affichant la plus grande impiété[c], afin de ruiner rapidement nos affaires.
  to: Non seulement ils se sont détournés de l’ordre civique honorable[a], mais ils ont aussi en horreur, par la parole comme par le silence[b], les quelques-uns d’entre eux qui sont sincèrement bien disposés envers nous et, à chaque occasion, sous le prétexte le plus impie[c], ils se précipitent pour ruiner nos affaires.
  rationale: La révision évite l’intensification non nécessaire de « inestimable », emploie un terme français plus large pour πολιτεία et restitue plus précisément la fonction rhétorique de ἐμφάσει. Les notes préservent les ambiguïtés lexicales sans imposer une lecture doctrinale ou historique particulière.
