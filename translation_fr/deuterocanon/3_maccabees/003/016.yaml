base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
translation:
  language: fr
  text: Après avoir attribué de très importants revenus aux temples des différentes villes, nous avons poursuivi notre route et sommes montés à Jérusalem pour honorer le temple de ceux qui n’ont jamais été vannés[a] et qui ne cessent jamais de se livrer à leur folie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque ainsi traduite est rare et difficile. Elle semble employer, de manière hostile, l’image de personnes qui n’ont pas été vannées, donc triées ou purifiées. Certains comprennent toutefois le mot dans un sens moins péjoratif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονείμαντες
  choice: Après avoir attribué
  rationale: Le participe aoriste exprime une action antérieure au verbe principal; « attribué » convient à la répartition administrative de revenus.
- source_word: προσόδους πλείστας
  choice: de très importants revenus
  rationale: πρόσοδοι désigne des revenus ou ressources financières, et πλείστας en souligne l’importance quantitative.
- source_word: τοῖς κατὰ πόλεσιν ἱεροῖς
  choice: aux temples des différentes villes
  rationale: Cette formulation rend naturellement la distribution locale exprimée par κατὰ πόλεσιν, tandis que ἱεροῖς désigne ici des temples ou sanctuaires.
- source_word: προηχθημεν
  choice: nous sommes même allés jusqu’à
  rationale: La forme exprime ici le fait d’aller plus loin ou de poursuivre la démarche; cette tournure française restitue à la fois la progression et l’emphase de καὶ.
- source_word: ἀναβάντες
  choice: monter à Jérusalem
  rationale: « Monter à Jérusalem » conserve l’idiome géographique traditionnel tout en restant naturel en français.
- source_word: τιμῆσαι
  choice: pour honorer
  rationale: L’infinitif indique le but du déplacement; « honorer » garde la nuance de respect cultuel sans ajouter celle d’adoration.
- source_word: τὸ ἱερὸν
  choice: le temple
  rationale: Dans ce contexte, ἱερόν renvoie au temple de Jérusalem; « temple » est plus clair que le terme plus large « sanctuaire ».
- source_word: ἀλητρίων
  choice: ceux qui n’ont jamais été vannés
  rationale: Le mot rare conserve ainsi son image agricole déroutante, comprise comme une désignation hostile de personnes qui n’auraient jamais été triées ou purifiées.
- source_word: μηδέποτε ληγόντων τῆς ἀνοίας
  choice: qui ne cessent jamais de s’adonner à leur folie
  rationale: La tournure française rend l’idée de ne jamais cesser ou se détourner de la folie; « folie » préserve la portée polémique sans connotation clinique nécessaire.
theological_decisions:
- issue: Référent et portée de τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας
  choice: La proposition décrit, sur un ton hostile, les personnes associées au temple de Jérusalem.
  alternative: Comprendre le groupe de mots en un sens favorable, par exemple « le temple des purs et de ceux qui ne cessent jamais leur dévotion » ou « des inébranlables et de ceux dont le zèle ne faiblit jamais ».
  rationale: Le génitif dépend naturellement de ἱερόν et désigne les fidèles par lesquels le temple est identifié. Le contexte polémique favorise une lecture insultante, mais la rareté de ἀλητρίων exige de signaler l’incertitude plutôt que de la masquer.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La phrase conserve la voix polémique du locuteur et l’étrangeté volontaire de l’image agricole, tout en fluidifiant l’enchaînement des participes grecs.
