review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’attribution de revenus aux sanctuaires urbains, la montée à Jérusalem, le but d’honorer le temple et la désignation polémique de ses adhérents. Toutefois, « nous sommes même allés jusqu’à » interprète καί comme une intensification (« même/jusqu’à ») et affaiblit la progression exprimée par προηχθημεν. « S’adonner à leur folie » est également plus interprétatif que le grec, qui dit simplement qu’ils ne cessent pas de leur folie.
  naturalness: Le français est globalement clair et d’un registre approprié. « Nous avons poursuivi notre route et sommes montés à Jérusalem » restitue plus naturellement la succession des mouvements sans introduire l’idée de mesure extrême. La formulation conservée pour l’image du vannage demeure volontairement étrange, comme le grec.
  terminology: « Revenus », « temples », « monter à Jérusalem » et « honorer » sont appropriés. « Vannés » préserve l’image agricole rare et hostile sans prétendre résoudre définitivement son sens. « Se livrer à la folie » rend plus directement la persistance dans l’ἀνοία.
  issues:
  - severity: medium
    issue: « même allés jusqu’à » surinterprète la coordination et le verbe de mouvement.
    rationale: καὶ marque ici la continuation/coordination, non nécessairement l’idée emphatique de « même » ou « aller jusqu’à ». προηχθημεν appelle plutôt « poursuivre notre route », « continuer » ou « nous avancer ».
  - severity: low
    issue: « s’adonner à leur folie » est légèrement explicatif.
    rationale: Le grec μηδέποτε ληγόντων τῆς ἀνοίας exprime le fait de ne jamais cesser de leur folie; « se livrer à » est possible, mais « s’adonner à » suggère une dévotion ou une pratique plus marquée.
