revisions:
- from: Ayant appris cela[a], l’homme impie entra dans une telle fureur que, non content de s’irriter contre ceux d’Alexandrie, il s’en prit encore plus durement à ceux des districts ruraux[b]. Il ordonna de les rassembler tous au plus vite en un même lieu et de leur ôter la vie par la mort la plus cruelle[c].
  to: Ayant appris cela[a], l’homme impie entra dans une telle fureur que, non content de s’irriter contre ceux d’Alexandrie, il s’en prit plus durement encore à ceux qui vivaient dans les campagnes environnantes[b]. Il ordonna de les rassembler tous au plus vite en un même lieu et de les faire périr par le sort le plus terrible[c].
  rationale: La révision ne modifie pas le sens du passage. Elle remplace une expression française redondante par « les faire périr par le sort le plus terrible », qui rend distinctement la périphrase « passer hors de la vie » et le terme μόρος. Elle emploie aussi une désignation plus naturelle des habitants de la χώρα.
