translation_notes:
  register: Français international moderne, soutenu mais accessible. La période grecque a été divisée en deux phrases pour assurer la lisibilité. « Non content de… » restitue naturellement la progression οὐ μόνον… ἀλλὰ καί, tandis que les notes signalent les principales ambiguïtés lexicales et syntaxiques.
