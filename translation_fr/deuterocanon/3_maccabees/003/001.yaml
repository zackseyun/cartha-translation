    issue: « Districts ruraux » est administratif et moins idiomatique.
    rationale: χώρα, opposé à Alexandrie, vise vraisemblablement les zones rurales ou les territoires environnants. « Les campagnes environnantes » communique ce contraste plus naturellement.
