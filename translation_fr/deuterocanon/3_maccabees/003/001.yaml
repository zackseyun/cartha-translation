  source_fidelity: La traduction rend correctement la réception de l'information, l'impiété, la fureur, le contraste Alexandrie/χώρα, l'urgence du rassemblement et l'intention meurtrière. Toutefois, « leur ôter la vie par la mort la plus cruelle » est tautologique en français et réduit μόρῳ (« sort, destin, manière de périr ») à « mort ». La révision conserve la périphrase grecque tout en évitant cette lourdeur.
  naturalness: Le français est globalement moderne et soutenu. « Ceux des districts ruraux » est compréhensible, mais « ceux qui vivent dans les campagnes environnantes » est plus naturel en français international sans perdre le contraste urbain/rural. La formulation finale révisée est plus idiomatique.
  terminology: « L’homme impie » restitue bien δυσσεβής. « Sort le plus terrible » maintient la portée de μόρῳ sans imposer exclusivement le sens de « mort ». Les notes sont ajustées pour correspondre exactement aux ancres et au texte révisé.
