  yaml_path: translation/deuterocanon/3_maccabees/003/001.yaml
  text: And when the impious man had taken this in[a], he became so enraged that he was angry not only with those in Alexandria, but also opposed those in the countryside more harshly; and after ordering that they quickly gather all together in one place[c][b], he intended to remove them from life by the cruelest fate.
translation:
  language: fr
  text: Ayant appris cela[a], l’homme impie entra dans une telle fureur que, non content de s’irriter contre ceux d’Alexandrie, il s’en prit plus durement encore à ceux qui vivaient dans les campagnes environnantes[b]. Il ordonna de les rassembler tous au plus vite en un même lieu et de les faire périr par le sort le plus terrible[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant reçu cette information ». Le participe grec peut désigner la réception d’une information, mais son sens reste plus large que le seul fait d’apprendre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui étaient dans la χώρα ». Par contraste avec Alexandrie, il s’agit probablement des habitants des territoires environnants, hors de la ville.
    reason: cultural_note
  - marker: c
    text: Littéralement « les faire passer hors de la vie par le sort le plus terrible ». Cette expression est une périphrase pour les mettre à mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβὼν
  choice: ayant appris cela
  rationale: Dans ce contexte, μεταλαμβάνω désigne vraisemblablement la réception d’une information. « Ayant appris cela » est naturel en français, tandis que la note conserve la portée plus large du grec.
- source_word: δυσσεβὴς
  choice: l’homme impie
  rationale: « Impie » préserve la caractérisation religieuse de δυσσεβής, plutôt que de la réduire à une méchanceté morale générale.
- source_word: ἐξεχόλησεν
  choice: entra dans une telle fureur
  rationale: Cette tournure rend l’intensité de la colère et introduit naturellement la proposition consécutive avec ὥστε.
- source_word: τοῖς κατὰ Ἀλεξάνδρειαν
  choice: ceux d’Alexandrie
  rationale: Formulation française concise qui désigne les personnes établies à Alexandrie sans ajouter explicitement leur identité, absente de cette proposition grecque.
- source_word: τοῖς ἐν τῇ χώρᾳ
  choice: ceux des districts ruraux
  rationale: L’opposition avec Alexandrie indique ici les territoires situés hors de la ville. « Districts ruraux » exprime ce contraste sans faire de χώρα un pays abstrait.
- source_word: βαρυτέρως ἐναντιοῦσθαι
  choice: il s’en prit encore plus durement à
  rationale: « S’en prendre à » exprime une hostilité active, et « encore plus durement » conserve la valeur comparative de βαρυτέρως.
- source_word: προστάξας σπεύδοντας συναγαγεῖν πάντας ἐπὶ τὸ αὐτό
  choice: il ordonna de les rassembler tous au plus vite en un même lieu
  rationale: La syntaxe grecque est condensée. Cette formulation rend l’ordre, l’urgence, la totalité des personnes visées et leur rassemblement dans un seul lieu, sans inventer l’identité des exécutants.
- source_word: χειρίστῳ μόρῳ
  choice: par la mort la plus cruelle
  rationale: Dans ce contexte d’exécution, μόρος désigne le sort mortel réservé aux victimes. « La mort la plus cruelle » transmet clairement la valeur superlative de χειρίστῳ.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: leur ôter la vie
  rationale: Le grec emploie une périphrase signifiant littéralement les faire passer hors de la vie. « Leur ôter la vie » reste légèrement périphrastique tout en étant immédiatement compréhensible.
