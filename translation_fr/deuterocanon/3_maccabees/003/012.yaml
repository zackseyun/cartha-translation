  yaml_path: translation/deuterocanon/3_maccabees/003/012.yaml
  text: 'King Ptolemy Philopator to the generals and soldiers throughout Egypt and in every place: greetings and good health[a].'
translation:
  language: fr
  text: 'Le roi Ptolémée Philopator, aux généraux et aux soldats dans toute l’Égypte, dans chaque localité[a] : salut et bonne santé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans chaque district » ou « localement » ; l’expression grecque peut désigner les différentes localités, affectations ou circonscriptions.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βασιλεὺς
  choice: Le roi
  rationale: Titre royal employé pour présenter l’expéditeur; l’article défini convient naturellement en français.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Ptolémée Philopator
  rationale: Le nom et l’épithète sont translittérés selon leur forme française traditionnelle.
- source_word: τοῖς ... στρατηγοῖς
  choice: aux généraux
  rationale: στρατηγοῖς désigne ici les chefs militaires; « généraux » est direct et naturel.
- source_word: καὶ στρατιώταις
  choice: et aux soldats
  rationale: Le terme désigne les personnes servant comme soldats, sans les réduire à l’idée collective de troupes.
- source_word: τοῖς κατʼ Αἴγυπτον
  choice: dans toute l’Égypte
  rationale: Cette formulation rend naturellement la portée géographique distributive de κατʼ Αἴγυπτον.
- source_word: καὶ κατὰ τόπον
  choice: et en chaque lieu
  rationale: Traduction volontairement proche de l’expression idiomatique grecque, qui peut viser les diverses localités, affectations ou circonscriptions.
- source_word: χαίρειν
  choice: salut
  rationale: Formule épistolaire grecque conventionnelle; « salut » conserve ici le ton officiel de l’adresse.
- source_word: καὶ ἐρρῶσθαι
  choice: et bonne santé !
  rationale: Souhait épistolaire de vigueur et de bien-être, rendu par une formule française concise et intelligible.
