base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/011.yaml
  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
translation:
  language: fr
  text: 'Ainsi donc, gonflé d’orgueil par sa réussite présente et ne discernant pas la puissance du Dieu le plus grand[a], mais s’imaginant qu’il resterait indéfiniment attaché à la même résolution, il écrivit contre eux la lettre suivante :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du Dieu le plus grand ». On pourrait aussi traduire : « du Dieu suprême ».'
    reason: La formulation française littérale est inhabituelle ; la note signale une traduction plus idiomatique sans confondre le grec avec le titre « Très-Haut ».
lexical_decisions:
- source_word: εὐημερίᾳ
  choice: réussite
  rationale: Le terme désigne une situation favorable ou florissante. « Réussite présente » convient au succès politique et circonstanciel évoqué, sans le réduire à la prospérité matérielle.
- source_word: γεγαυρωμένος
  choice: gonflé d’orgueil
  rationale: Cette expression française naturelle conserve l’image d’une personne enflée par l’arrogance.
- source_word: οὐ καθορῶν
  choice: ne discernant pas
  rationale: 'Le verbe exprime davantage qu’une absence de vision physique : il s’agit de ne pas reconnaître ni saisir la réalité de la puissance divine.'
- source_word: κράτος
  choice: puissance
  rationale: « Puissance » rend la force souveraine et agissante de Dieu sans préciser indûment s’il est question de domination ou de force.
- source_word: τοῦ μεγίστου θεοῦ
  choice: du Dieu le plus grand
  rationale: Cette formulation représente directement le superlatif grec μέγιστος, sans l’harmoniser avec le titre biblique distinct « Dieu Très-Haut ».
- source_word: ὑπολαμβάνων
  choice: s’imaginant
  rationale: Le participe introduit la supposition erronée du roi ; « s’imaginant » en souligne naturellement le caractère illusoire.
- source_word: διηνεκῶς
  choice: indéfiniment
  rationale: L’adverbe indique ici une continuité durable, non une éternité métaphysique. « Indéfiniment » préserve cette nuance.
- source_word: ἐν τῇ αὐτῇ διαμένειν βουλῇ
  choice: resterait indéfiniment attaché à la même résolution
  rationale: La tournure rend la persistance dans une intention ou une ligne de conduite arrêtée, tout en restant idiomatique en français.
- source_word: ἔγραφεν
  choice: il écrivit
  rationale: L’imparfait grec introduit l’acte de rédaction de la lettre ; le passé simple convient à la narration française écrite.
- source_word: κατʼ αὐτῶν
  choice: contre eux
  rationale: Le contexte hostile donne à κατά avec le génitif une valeur clairement adversative.
- source_word: ἐπιστολὴν τήνδε
  choice: la lettre suivante
  rationale: Le démonstratif annonce le contenu de la lettre qui vient immédiatement après ; « suivante » explicite naturellement cette fonction en français.
theological_decisions:
- issue: Traduction de τοῦ μεγίστου θεοῦ
  choice: du Dieu le plus grand
  alternative: du Dieu Très-Haut ; du Dieu suprême
  rationale: Le grec emploie le superlatif de μέγας, « grand », et non l’expression habituelle signifiant « Très-Haut ». La traduction retenue préserve cette formulation inhabituelle et sa tension possible, sans la remplacer par un titre théologique plus familier.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la longue progression syntaxique du grec tout en utilisant des articulations naturelles. « Gonflé d’orgueil » maintient l’image vive du texte ; « résolution » laisse ouverte la nuance entre intention arrêtée, décision et politique suivie.
