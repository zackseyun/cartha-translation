  text: concerning our campaign into Asia[a], which you yourselves also know, which by the unfailing alliance of the gods was brought, as was fitting, to its conclusion[b],
translation:
  language: fr
  text: Quant à notre campagne en Asie, que vous connaissez vous aussi, elle a été menée, comme il convenait, jusqu’à son terme grâce à l’alliance indéfectible des dieux[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce à l’alliance invincible des dieux ». L’adjectif grec évoque littéralement ce qui n’est ni faible ni défaillant, donc ce qui demeure ferme ou inébranlable.
    reason: Variante lexicale pour ἀρρωστῷ.
  - marker: b
    text: Ou « elle a été conduite jusqu’à son achèvement ».
    reason: Variante lexicale pour ἐπὶ τέλος ἀχθείσης.
lexical_decisions:
- source_word: ἐπιστρατείας
  choice: campagne
  rationale: Le nom désigne une expédition militaire; « campagne » est naturel, concis et conserve cette portée martiale.
- source_word: εἰς τὴν Ἀσίαν
  choice: en Asie
  rationale: Avec un verbe de mouvement implicite, εἰς exprime l’entrée ou la destination; en français, « mener une campagne en Asie » rend naturellement le déplacement vers la région sans suggérer qu’« Asie » est nécessairement l’adversaire.
- source_word: γενομένης ἡμῖν
  choice: que nous avons menée
  rationale: Cette formulation explicite idiomatiquement l’implication du locuteur dans la campagne, portée en grec par le participe et le datif ἡμῖν.
- source_word: ἧς ἴστε καὶ αὐτοί
  choice: que vous connaissez vous-mêmes
  rationale: « Vous-mêmes » conserve l’insistance de αὐτοί; dans ce contexte, καί renforce l’appel à la connaissance personnelle des destinataires.
- source_word: ἀρρωστῷ
  choice: indéfectible
  rationale: L’adjectif signifie littéralement « non faible, non défaillant »; appliqué à une alliance, « indéfectible » en exprime la fermeté durable sans imposer l’idée plus forte d’invincibilité.
- source_word: συμμαχίᾳ
  choice: alliance
  rationale: Le terme désigne une alliance, notamment militaire, ou le secours qui en découle; « alliance » préserve directement l’image du contexte.
- source_word: τῶν θεῶν
  choice: des dieux
  rationale: Le pluriel grec est explicite et doit être conservé dans le discours de ce souverain païen.
- source_word: κατὰ λόγον
  choice: comme il convenait
  rationale: L’expression peut évoquer ce qui est conforme à la raison, à l’attente ou à la convenance; ce choix préserve son appréciation normative sans la réduire à un plan précis.
- source_word: ἐπὶ τέλος ἀχθείσης
  choice: a été menée […] jusqu’à son terme
  rationale: La tournure conserve le sens passif de quelque chose conduit jusqu’à son achèvement et reste idiomatique en français.
theological_decisions:
- issue: Mention de divinités païennes dans le discours royal
  choice: des dieux
  alternative: de Dieu; grâce à l’aide divine
  rationale: Le grec porte explicitement le pluriel τῶν θεῶν. La traduction maintient donc la voix religieuse historique du souverain au lieu de la conformer à un langage monothéiste.
translation_notes:
  register: Français international actuel, soutenu mais accessible, adapté au ton d’une proclamation royale. La phrase reste ouverte par une virgule parce que le verset grec constitue un segment syntaxique poursuivi dans le contexte. Les appels de notes sont placés auprès des expressions grecques qu’ils éclairent.
