base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/020.yaml
  text: But we[a], having borne with their folly, and having been carried through with victory, and having met all the nations in Egypt with humanity[b], did what was fitting.
translation:
  language: fr
  text: Mais nous, ayant supporté patiemment leur folie[a], ayant été conduits à la victoire, et ayant rencontré avec humanité[b] tous les peuples en Égypte, nous avons fait ce qui convenait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant usé d’indulgence envers leur manque de jugement ». Le participe grec peut évoquer une attitude de patiente tolérance.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec bienveillance » ou « humainement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίᾳ
  choice: folie
  rationale: « Folie » exprime ici le défaut de jugement et la déraison, sans imposer un sens clinique.
- source_word: συμπεριενεχθέντες
  choice: après avoir supporté avec patience
  rationale: Cette formulation rend la valeur de tolérance patiente du participe passif, dans un français naturel.
- source_word: μετὰ νίκης
  choice: dans la victoire
  rationale: La formulation reste proche de l’expression grecque et conserve la rhétorique triomphale de la déclaration royale.
- source_word: διακομισθέντες
  choice: après avoir été conduits à bon port
  rationale: Le passif est conservé, tandis que « à bon port » traduit l’idée d’avoir été menés jusqu’au terme avec succès sans préciser indûment le trajet.
- source_word: τοῖς πᾶσιν ἔθνεσιν
  choice: tous les peuples
  rationale: Dans ce contexte, « peuples » est plus naturel que « nations » et n’introduit pas le contraste religieux que pourrait suggérer « païens ».
- source_word: φιλανθρώπως
  choice: avec humanité
  rationale: « Avec humanité » préserve la couleur rhétorique de l’adverbe grec, qui évoque une conduite bienveillante et civilisée.
- source_word: ἀπαντήσαντες
  choice: après avoir traité
  rationale: Le sens fondamental est celui d’une rencontre; dans cette construction, le français idiomatique demande une formulation exprimant la manière dont le roi affirme s’être comporté envers les peuples.
- source_word: εἰς τὴν Αἴγυπτον
  choice: une fois en Égypte
  rationale: Cette tournure restitue la valeur directionnelle de εἰς et le cadre égyptien sans produire l’expression française maladroite « vers l’Égypte » avec le verbe suivant.
- source_word: καθὼς ἔπρεπεν
  choice: comme il convenait
  rationale: Cette expression française formelle et naturelle rend le jugement de convenance contenu dans le grec.
theological_decisions:
- issue: Autoprésentation royale comme souverain victorieux et bienveillant
  choice: Rendre directement les affirmations à la première personne, sans signaler qu’elles seraient vraies ou ironiques.
  alternative: Reformuler le passage de façon à dénoncer une propagande ou à marquer explicitement une ironie.
  rationale: Le grec présente la justification du roi dans sa propre voix. La traduction doit préserver cette rhétorique sans lui ajouter un jugement extérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période participiale du grec est conservée sous une forme lisible; la répétition de « après avoir » maintient la progression de l’argument royal. « À bon port » rend idiomatiquement le passif de διακομισθέντες tout en évitant de préciser un déplacement que le verset ne décrit pas explicitement.
