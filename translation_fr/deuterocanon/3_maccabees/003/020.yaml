revisions:
- from: Mais nous, après avoir supporté avec patience[a] leur folie, après avoir été conduits à bon port dans la victoire et, une fois en Égypte, après avoir traité avec humanité[b] tous les peuples, nous avons agi comme il convenait.
  to: Mais nous, ayant supporté patiemment leur folie[a], ayant été conduits à la victoire, et ayant rencontré avec humanité[b] tous les peuples en Égypte, nous avons fait ce qui convenait.
  rationale: La révision rétablit « ayant rencontré » pour ἀπαντήσαντες et « en Égypte » comme cadre de cette rencontre. Elle remplace l'image ajoutée de « à bon port » par une formulation française qui maintient la voix passive et le caractère victorieux de l'affirmation sans préciser le trajet ou les circonstances. Les deux ancres de notes sont conservées et placées sur les expressions qu'elles éclairent.
