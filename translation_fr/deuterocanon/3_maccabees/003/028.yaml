  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
translation:
  language: fr
  text: Quiconque voudra les dénoncer recevra, en récompense, les biens de celui qui tombera sous le coup de la sanction[a], ainsi que deux mille drachmes prélevées sur le trésor royal, et il sera couronné de liberté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui fera l’objet d’un examen judiciaire » ; l’expression grecque peut désigner le fait d’être soumis à une reddition de comptes ou à une procédure officielle, ici dans le cadre d’un décret répressif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « couronné de liberté » ; cette expression signifie probablement que le dénonciateur recevrait la liberté en récompense, peut-être par affranchissement.
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  choice: les dénoncer
  rationale: Dans ce décret à caractère répressif, le verbe désigne le fait de livrer aux autorités des informations à charge, et non un simple signalement neutre.
- source_word: τὸν βουλόμενον
  choice: Quiconque voudra
  rationale: Le participe substantivé a une portée générale et constitue une invitation ouverte à la délation.
- source_word: ἐφʼ ᾧ
  choice: en récompense
  rationale: L’expression relie la dénonciation à l’avantage promis. Cette formulation rend naturellement en français le rapport de contrepartie sans alourdir la syntaxe.
- source_word: οὐσίαν
  choice: les biens
  rationale: Le terme renvoie ici au patrimoine matériel confisqué à la personne dénoncée.
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  choice: de celui qui tombera sous le coup de la sanction
  rationale: La formulation conserve l’idée d’une personne devenue passible d’une mesure officielle, tout en signalant en note que εὔθυνα peut aussi évoquer un examen ou une reddition de comptes judiciaire.
- source_word: λήμψεται
  choice: recevra
  rationale: Le futur moyen indique simplement que le dénonciateur obtiendra la récompense promise.
- source_word: ἐκ τοῦ βασιλικοῦ
  choice: prélevées sur le trésor royal
  rationale: L’adjectif substantivé désigne les fonds royaux; « trésor » explicite naturellement l’ellipse grecque.
- source_word: δραχμὰς δισχιλίας
  choice: deux mille drachmes
  rationale: Le maintien de l’unité monétaire historique évite un équivalent moderne trompeur.
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  choice: il sera couronné de la liberté
  rationale: Cette traduction préserve la métaphore honorifique de la couronne et l’ambiguïté sur la forme juridique précise de la liberté accordée.
theological_decisions:
- issue: Sens de « couronné de la liberté » dans le décret royal
  choice: Conserver littéralement l’image d’une personne couronnée de la liberté, probablement affranchie ou émancipée.
  alternative: « recevra la liberté en récompense » ou « sera affranchi »
  rationale: Le grec associe une image honorifique à un avantage juridique. La formulation retenue préserve cette tension sans décider si la liberté désigne précisément l’affranchissement, un statut civique ou un autre privilège.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste clair sans effacer l’ambiguïté de εὔθυνα, et l’image grecque de la couronne est conservée.
