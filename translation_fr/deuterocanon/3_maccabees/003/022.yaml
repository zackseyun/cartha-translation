revisions:
- from: Mais eux, s’attendant au contraire, ont, par leur méchanceté innée, repoussé ce qui est bon et se détournent sans cesse vers ce qui est vil,
  to: Mais ceux qui attendaient l’inverse et qui, dans leur méchanceté innée, avaient rejeté le bien, se tournaient sans cesse vers ce qui est vil,
  rationale: La correction remplace une expression française non idiomatique par « attendaient l’inverse », qui rend directement τοὐναντίον. Elle conserve l’opposition morale, l’antériorité suggérée par l’aoriste « avaient rejeté », l’action habituelle de διηνεκῶς, et la virgule finale requise par la continuité syntaxique avec le verset suivant.
