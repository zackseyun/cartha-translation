translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase demeure ouverte par une virgule, conformément au grec, puisqu’elle se poursuit au verset suivant. Le passage des participes aoristes au présent pour ἐκνεύοντες préserve la distinction entre le rejet accompli et l’orientation continue.
