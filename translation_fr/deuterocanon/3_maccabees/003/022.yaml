review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu, y compris l’opposition entre le bien et ce qui est moralement bas. Toutefois, « s’attendant au contraire » ne rend pas idiomatiquement τοὐναντίον avec ἐκδεχόμενοι : le grec signifie qu’ils attendaient « l’inverse / le contraire », non qu’ils s’attendaient « au contraire ».'
  naturalness: La formulation actuelle est globalement lisible, mais « s’attendant au contraire » est maladroite en français moderne. La révision emploie une construction relative naturelle tout en maintenant la phrase ouverte, comme dans le grec.
  terminology: « méchanceté innée », « le bien » et « ce qui est vil » rendent de manière adéquate κακοήθεια, τὸ καλόν et τὸ φαῦλον. « Le bien » est ici légèrement plus direct et idiomatique que « ce qui est bon », sans réduire la portée morale du neutre grec.
  issues:
  - severity: medium
    issue: « s’attendant au contraire »
    rationale: 'En français, « au contraire » est normalement un connecteur discursif (« en revanche »), et non le complément naturel de « s’attendre à ». τοὐναντίον désigne l’objet de leur attente : « l’inverse » ou « le contraire ».'
  - severity: low
    issue: Valeur participiale et phrase laissée en suspens
    rationale: « ont repoussé » donne une proposition indépendante au milieu d’une chaîne de participes dont le verbe principal se trouve au verset suivant. Une formulation relative avec plus-que-parfait rend l’antériorité de l’aoriste ἀπωσάμενοι et préserve mieux la dépendance syntaxique.
