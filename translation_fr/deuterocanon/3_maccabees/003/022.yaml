lexical_decisions:
- source_word: τούναντίον
  choice: au contraire
  rationale: Dans la construction avec ἐκδεχόμενοι, l’expression désigne ce qui est contraire à l’issue favorable attendue; « s’attendant au contraire » reste proche du grec tout en étant naturel.
- source_word: ἐκδεχόμενοι
  choice: s’attendant
  rationale: Le participe exprime l’attente ou l’anticipation; le français « s’attendant » rend ici cette disposition mentale.
- source_word: συμφύτῳ
  choice: innée
  rationale: Le terme signifie littéralement « qui a grandi avec » et qualifie donc une disposition présente dès l’origine.
- source_word: κακοηθείᾳ
  choice: méchanceté
  rationale: Le nom désigne un mauvais caractère ou une disposition malveillante; « méchanceté » conserve à la fois la portée morale et la lisibilité.
- source_word: τὸ καλόν
  choice: ce qui est bon
  rationale: Le neutre substantivé désigne le bien au sens moral; cette formulation est naturelle et garde la catégorie générale du grec.
- source_word: ἀπωσάμενοι
  choice: repoussé
  rationale: Le participe moyen évoque une mise à distance énergique; « repoussé » en préserve la force concrète.
- source_word: διηνεκῶς
  choice: sans cesse
  rationale: L’adverbe marque une orientation continue ou habituelle; « sans cesse » en exprime clairement la persistance.
- source_word: φαῦλον
  choice: ce qui est vil
  rationale: Le terme peut désigner ce qui est bas, mauvais ou sans valeur; « vil » conserve sa nuance morale et qualitative.
- source_word: ἐκνεύοντες
  choice: se détournent … vers
  rationale: Le participe décrit un mouvement de déviation ou d’inclination; « se détourner vers » préserve l’image paradoxale d’un écart orienté vers le mal.
