revisions:
- from: Nous avons ordonné que, dès l’arrivée de cette lettre, les personnes inscrites[a] soient aussitôt envoyées auprès de nous avec leurs femmes et leurs enfants, dans des liens de fer, enfermées de toutes parts, au milieu des outrages et des spoliations[b], à destination d’une fosse[c] irrémédiable et infamante, digne d’ennemis.
  to: Nous avons ordonné que, dès l’arrivée de cette lettre, les personnes inscrites[a], avec leurs femmes et leurs enfants, soient aussitôt envoyées auprès de nous, dans des liens de fer, enfermées de toutes parts, avec outrages et dépouillement[b], vers une fosse[c] irrémédiable et infamante, qui convient à des ennemis.
  rationale: La révision conserve le sens et le registre coercitif du grec, tout en corrigeant la relation de « avec » aux outrages et au dépouillement et en améliorant l’idiomaticité de la qualification finale de la fosse. Les trois ancres de notes sont conservées et chaque note demeure correctement liée au terme ou à l’expression qu’elle explique.
