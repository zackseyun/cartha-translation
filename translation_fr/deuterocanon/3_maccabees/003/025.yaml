base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
translation:
  language: fr
  text: Nous avons ordonné que, dès l’arrivée de cette lettre, les personnes inscrites[a], avec leurs femmes et leurs enfants, soient aussitôt envoyées auprès de nous, dans des liens de fer, enfermées de toutes parts, avec outrages et dépouillement[b], vers une fosse[c] irrémédiable et infamante, qui convient à des ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les personnes enregistrées » ou « portées sur la liste » ; le participe grec désigne des personnes officiellement inscrites dans un registre.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque associe les outrages ou traitements humiliants (ὕβρις) au dépouillement ou à la spoliation (σκυλμοί).
    reason: lexical_alternative
  - marker: c
    text: La « fosse » peut être comprise au sens propre ou comme une image saisissante d’un lieu de destruction et d’infamie.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: Nous avons ordonné
  rationale: Le parfait exprime un ordre déjà donné et toujours en vigueur. Cette formulation conserve l’autorité du décret dans un français naturel.
- source_word: ἅμα τῷ προσπεσεῖν τὴν ἐπιστολὴν τήνδε
  choice: dès l’arrivée de cette lettre
  rationale: La construction ἅμα τῷ suivie de l’infinitif marque l’immédiateté temporelle; προσπίπτω désigne ici l’arrivée ou la remise du document.
- source_word: αἰθωρεὶ
  choice: aussitôt
  rationale: L’adverbe renforce l’idée d’exécution immédiate, sans recourir à une tournure archaïque.
- source_word: τοὺς ἐννεμομένους
  choice: les personnes inscrites
  rationale: Le participe désigne des personnes officiellement portées sur une liste ou un registre. « Personnes » évite de préciser leur sexe au-delà de ce qu’impose grammaticalement le participe grec.
- source_word: σὺν ταῖς γυναιξὶ καὶ τέκνοις
  choice: avec leurs femmes et leurs enfants
  rationale: Dans ce contexte familial, γυναιξί désigne naturellement les épouses des personnes recensées; « femmes » est la formulation française courante.
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  choice: au milieu des outrages et des spoliations
  rationale: ὕβρις évoque des traitements humiliants et violents, tandis que σκυλμοί évoque le dépouillement ou le pillage. La coordination maintient les deux dimensions.
- source_word: ἀποστεῖλαι πρὸς ἡμᾶς
  choice: soient aussitôt envoyées auprès de nous
  rationale: L’infinitif dépend de l’ordre royal. La tournure passive rend clairement que les personnes visées doivent être acheminées jusqu’aux auteurs du décret.
- source_word: ἐν δεσμοῖς σιδηροῖς
  choice: dans des liens de fer
  rationale: Cette traduction conserve l’image générale de δεσμοί sans imposer plus précisément des chaînes ou des entraves.
- source_word: πάντοθεν κατακεκλεισμένους
  choice: enfermées de toutes parts
  rationale: Le participe parfait décrit un état de confinement complet, renforcé par πάντοθεν, « de tous côtés ».
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  choice: à destination d’une fosse irrémédiable et infamante, digne d’ennemis
  rationale: εἰς exprime la destination; βόθρος signifie littéralement « fosse » mais peut porter une valeur imagée. ἀνήκεστος signifie « sans remède, irrémédiable », δυσκλεής « infamant, de sinistre réputation », et πρέποντα δυσμενέσιν qualifie la fosse comme appropriée à des ennemis.
