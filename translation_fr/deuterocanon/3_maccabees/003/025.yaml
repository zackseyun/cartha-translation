review_pass:
  verdict: revise
  source_fidelity: 'Le sens du décret est bien rendu : ordre déjà émis, arrivée immédiate de la lettre, personnes inscrites accompagnées de leurs femmes et enfants, envoi sous liens de fer et confinement total, puis destination vers une fosse décrite comme irrémédiable, infamante et appropriée à des ennemis. Toutefois, « au milieu des outrages et des spoliations » atténue et spatialise de façon peu exacte le moyen ou les sévices qui accompagnent le transfert.'
  naturalness: Le français est globalement moderne et soutenu. « Avec outrages et dépouillement » est plus naturel dans le style administratif et menaçant du passage que « au milieu des outrages et des spoliations ». « Fosse ... qui convient à des ennemis » est plus idiomatique et plus directement lié au grec que « digne d’ennemis ».
  terminology: « inscrits », « liens de fer », « outrages », « dépouillement », « fosse », « irrémédiable » conservent les nuances pertinentes. Le singulier collectif « dépouillement » rend σκυλμοί sans perdre l’idée de spoliation. La note doit éviter d’ajouter la notion de violence, qui n’est pas explicitement portée par ὕβρις.
  issues:
  - severity: medium
    issue: Rendu de μετὰ ὕβρεως καὶ σκυλμῶν
    rationale: « Au milieu des » présente les outrages et les spoliations comme un environnement plutôt que comme les mauvais traitements accompagnant l’envoi. « Avec outrages et dépouillement » suit plus directement μετὰ avec génitif et conserve les deux termes.
  - severity: low
    issue: Formulation de πρέποντα δυσμενέσιν
    rationale: « Digne d’ennemis » est compréhensible, mais peut suggérer une valeur morale. « Qui convient à des ennemis » exprime plus précisément l’idée d’une fosse jugée appropriée pour des ennemis.
  - severity: low
    issue: 'Note b : ajout de « violents »'
    rationale: Ὕβρις désigne l’outrage, l’humiliation ou le traitement abusif; la violence peut être contextuellement possible mais n’est pas à imposer dans l’explication lexicale.
