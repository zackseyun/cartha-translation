base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/024.yaml
  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
translation:
  language: fr
  text: C’est pourquoi, pleinement convaincus par des preuves que ces gens nous sont hostiles à tous égards, et prenant nos précautions de peur que, si un trouble soudain venait à éclater par la suite, nous n’ayons sur nos arrières ces impies comme traîtres et ennemis barbares[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ennemis sauvages ». Ici, le grec « barbares » est une désignation péjorative dans la rhétorique du locuteur, et non nécessairement une indication ethnique précise.
    reason: Préciser la portée rhétorique et l’alternative lexicale de βαρβάρους.
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée du contexte précédent.
- source_word: τεκμηρίοις
  choice: par des preuves
  rationale: Le datif exprime le moyen; « preuves » conserve la force probante du terme.
- source_word: καλῶς πεπεισμένοι
  choice: pleinement convaincus
  rationale: Rend l’état de conviction ferme exprimé par le parfait et la valeur intensive de καλῶς.
- source_word: τούτους
  choice: ces gens
  rationale: Désigne le groupe visé sans ajouter de précision absente du grec.
- source_word: κατὰ πάντα
  choice: à tous égards
  rationale: Préserve la portée globale de l’accusation dans un registre soutenu mais courant.
- source_word: δυσνοεῖν ἡμῖν
  choice: nous sont hostiles
  rationale: Exprime clairement la disposition malveillante envers « nous » sans calquer lourdement le grec.
- source_word: προνοούμενοι
  choice: prenant nos précautions
  rationale: Dans ce contexte politique, le participe indique une prévoyance orientée vers la prévention d’un danger futur.
- source_word: μή ποτε ἐφνιδίου μετέπειτα ταραχῆς ἐνστάσης
  choice: de peur que, si des troubles soudains venaient à éclater par la suite
  rationale: Conserve l’appréhension, la soudaineté et la temporalité ultérieure, sans préciser indûment la nature des troubles.
- source_word: κατὰ νώτου
  choice: sur nos arrières
  rationale: Restitue l’image militaire d’une menace venant de derrière.
- source_word: δυσσεβεῖς
  choice: impies
  rationale: Terme religieux et polémique correspondant directement à l’accusation grecque.
- source_word: προδότας
  choice: traîtres
  rationale: Rend le sens politique et militaire de personnes qui trahissent.
- source_word: βαρβάρους πολεμίους
  choice: ennemis barbares
  rationale: Conserve l’épithète péjorative de la rhétorique du locuteur tout en restant naturel en français.
theological_decisions:
- issue: Maintien des désignations polémiques dans l’accusation royale
  choice: Conserver « impies », « traîtres » et « ennemis barbares » comme propos du locuteur.
  alternative: Atténuer en « irréligieux », « déloyaux » ou « ennemis féroces ».
  rationale: Le passage rapporte une accusation hostile; en adoucir le vocabulaire effacerait sa violence rhétorique. La traduction reproduit cette rhétorique sans la cautionner.
translation_notes:
  register: Français international moderne, digne et lisible. La longue structure participiale et la virgule finale sont maintenues parce que le verset poursuit une phrase qui s’achève dans la suite. Le vocabulaire polémique est présenté fidèlement comme celui du décret royal.
