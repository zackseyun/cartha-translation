  source_fidelity: 'La portée du décret, « un Juif », l’inaccessibilité du lieu, l’image du feu, l’universalité de πάσῃ θνητῇ φύσει et la permanence finale sont bien rendues. Toutefois, « que l’on cache entièrement » résout de manière trop précise et active la construction difficile τὸ σύνολον σκεπαζόμενος. De plus, « inutilisable par toute créature mortelle » peut suggérer que les créatures sont les agents qui rendent le lieu inutilisable, alors que le datif grec exprime les bénéficiaires concernés : le lieu est inutilisable pour elles.'
