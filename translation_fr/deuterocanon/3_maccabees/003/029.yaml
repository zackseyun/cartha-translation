  rationale: La révision préserve l’ambiguïté de la syntaxe grecque discutée, évite de présenter la dissimulation comme une action définie d’un sujet non exprimé, et corrige la relation du datif grec avec « pour ». « Sera en proie aux flammes » exprime l’état de destruction ardente de πυριφλεγής sans réduire le terme au seul acte d’incendier.
