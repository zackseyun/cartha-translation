  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
translation:
  language: fr
  text: Mais tout lieu où l’on découvrira un Juif alors qu’il est caché[a] deviendra inaccessible et sera en proie aux flammes, et il apparaîtra comme absolument inutilisable pour toute créature mortelle, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un Juif caché ». La construction grecque autour de τὸ σύνολον σκεπαζόμενος est difficile. Elle semble indiquer qu’il s’agit d’un Juif dissimulé, sans permettre de préciser avec certitude la fonction exacte de τὸ σύνολον.'
    reason: La syntaxe du texte transmis est incertaine ; la note signale l’ambiguïté sans lui imposer une résolution.
lexical_decisions:
- source_word: πᾶς ... τόπος
  choice: tout lieu
  rationale: Rend naturellement la portée distributive et générale du décret.
- source_word: οὗ ἐὰν φωραθῇ
  choice: où l’on découvrira
  rationale: Le verbe évoque la détection de ce qui était caché; le futur français convient à la formulation du décret.
- source_word: τὸ σύνολον σκεπαζόμενος
  choice: que l’on cache entièrement
  rationale: La construction grecque transmise est difficile. Cette traduction rattache τὸ σύνολον au participe et conserve l’idée d’une dissimulation complète sans prétendre lever toute l’ambiguïté.
- source_word: Ἰουδαῖος
  choice: un Juif
  rationale: Dans ce contexte, le mot désigne un membre du peuple juif persécuté, et non simplement un habitant de la Judée.
- source_word: ἄβατος
  choice: inaccessible
  rationale: Exprime qu’un lieu ne peut plus être abordé ou pénétré, avec un registre approprié au décret.
- source_word: πυριφλεγής
  choice: ravagé par le feu
  rationale: L’adjectif décrit un lieu livré aux flammes; cette formulation française exprime clairement l’état résultant sans le réduire au seul acte d’y mettre le feu.
- source_word: πάσῃ θνητῇ φύσει
  choice: par toute créature mortelle
  rationale: Préserve la portée large du grec, qui n’est pas explicitement limitée aux êtres humains.
- source_word: καθʼ ἅπαν ἄχρηστος
  choice: absolument inutilisable
  rationale: Rend l’intensification et l’idée d’une impossibilité totale d’usage.
- source_word: φανήσεται
  choice: il se révélera
  rationale: Conserve la valeur de manifestation de φαίνω tout en donnant une tournure française naturelle.
- source_word: εἰς τὸν ἀεὶ χρόνον
  choice: pour toujours
  rationale: Expression française directe et idiomatique de la permanence.
theological_decisions:
- issue: Désignation ethnique Ἰουδαῖος
  choice: un Juif
  alternative: un Judéen
  rationale: Le récit vise le peuple juif en tant que groupe ethnoreligieux persécuté; « Juif » est donc ici le terme français le plus clair.
- issue: Portée de πάσῃ θνητῇ φύσει
  choice: toute créature mortelle
  alternative: tout être humain
  rationale: Le grec a une formulation générale; la traduction ne la restreint pas silencieusement à l’humanité.
translation_notes:
  register: Français international moderne, digne et lisible. Le ton sévère et juridique du décret est conservé. La difficulté syntaxique du grec est signalée plutôt que résolue sans réserve.
