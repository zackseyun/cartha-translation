  text: Mais les Juifs gardaient envers les rois une bienveillance et une fidélité inébranlables ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Mais les Juifs
  rationale: δέ marque ici le contraste avec le contexte précédent ; « mais » le rend clairement, tandis que Ἰουδαῖοι désigne les Juifs.
- source_word: εὔνοιαν
  choice: bienveillance
  rationale: εὔνοια désigne une disposition favorable envers quelqu’un. « Bienveillance » conserve ce sens relationnel sans exagérer l’idée d’allégeance politique.
- source_word: πίστιν
  choice: fidélité
  rationale: Dans cette relation aux rois, πίστις exprime la constance et la loyauté, non la foi religieuse. « Fidélité » est naturel en français et reste proche de la portée du terme grec.
- source_word: ἀδιάστροφον
  choice: indéfectibles
  rationale: L’adjectif qualifie conjointement la bienveillance et la fidélité comme ne se laissant ni détourner ni altérer. Le pluriel français accorde naturellement le qualificatif aux deux noms.
- source_word: ἦσαν φυλάσσοντες
  choice: continuaient à faire preuve de
  rationale: La périphrase grecque associe l’imparfait de εἰμί au participe de φυλάσσω et exprime une conduite durable. Avec ces dispositions abstraites, cette tournure française est plus naturelle que « gardaient », tout en conservant l’idée de constance.
- source_word: πρὸς τοὺς βασιλεῖς
  choice: envers les rois
  rationale: πρός avec l’accusatif indique ici la relation à des personnes. « Envers » convient idiomatiquement aux dispositions exprimées, et le pluriel « les rois » respecte le grec.
theological_decisions:
- issue: Sens de πίστις dans un contexte politique et social
  choice: fidélité
  alternative: foi ; loyauté
  rationale: La relation explicitement orientée vers les rois exclut ici le sens religieux usuel de « foi ». « Fidélité » préserve l’idée de conduite fiable et constante ; « loyauté » serait également possible, mais légèrement plus politique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste initial, l’aspect duratif de la construction grecque et le pluriel explicite « les rois ». Le point-virgule final signale que le verset se poursuit syntaxiquement dans le contexte.
