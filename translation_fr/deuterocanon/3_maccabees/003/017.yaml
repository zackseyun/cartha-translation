review_pass:
  verdict: revise
  source_fidelity: Le contraste μέν ... δέ est conservé, de même que l’accueil seulement verbal de la présence du locuteur, l’empressement à entrer dans le Temple, et l’intention de l’honorer par des ἀναθήματα. « Agir de mauvaise foi » rend νόθως de façon idiomatique et sans l’affaiblir en simple manque de sincérité.
  naturalness: « Se sont montrés faux » est peu idiomatique en français moderne pour qualifier une conduite; « ont agi de mauvaise foi » est plus naturel. « Alors que nous désirions ardemment entrer » rend plus souplement la circonstance du génitif absolu que « lorsque nous avons vivement désiré ».
  terminology: « Temple » avec majuscule convient au sanctuaire juif déterminé dans ce contexte. « Offrandes » est recevable pour ἀναθήματα, et la note conserve utilement le sens de dons consacrés ou votifs.
