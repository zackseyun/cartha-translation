  text: But although they accepted our presence in word[a], in deed they were false, when we eagerly desired to enter into their temple and honor it with the most splendid and finest offerings[b],
translation:
  language: fr
  text: Mais eux, qui avaient accepté notre présence en paroles, ont agi de mauvaise foi dans les faits, alors que nous désirions ardemment entrer dans leur Temple et l’honorer par les offrandes les plus somptueuses et les plus belles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Le terme grec peut désigner des dons consacrés ou des offrandes votives déposées dans un sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ μὲν ... τῷ δὲ πράγματι
  choice: en paroles ... dans les faits
  rationale: Conserve l’antithèse rhétorique entre l’accueil exprimé et la conduite réelle, dans un français naturel.
- source_word: ἀποδεξάμενοι
  choice: acceptant
  rationale: Exprime le fait d’agréer ou de recevoir la présence du roi sans ajouter la chaleur affective que pourrait suggérer « accueillir favorablement ».
- source_word: παρουσίαν
  choice: présence
  rationale: Rend directement la présence personnelle ou la venue du souverain, tout en maintenant le point de vue du discours.
- source_word: νόθως
  choice: se sont montrés faux
  rationale: Restitue l’idée de fausseté ou de conduite non authentique, plus forte que la seule insincérité, sans employer l’adverbe peu naturel « faussement ».
- source_word: προθυμηθέντων ἡμῶν
  choice: lorsque nous avons vivement désiré
  rationale: Préserve l’empressement et la volonté exprimés par προθυμέομαι ainsi que la relation circonstancielle du génitif absolu.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν αὐτῶν
  choice: entrer dans leur Temple
  rationale: « Entrer dans » rend naturellement en français le mouvement marqué par εἰς; la majuscule identifie ici le sanctuaire juif particulier.
- source_word: τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  choice: par les offrandes les plus somptueuses et les plus belles
  rationale: Rend les présents consacrés au sanctuaire et maintient les deux qualificatifs intensifs sans les fusionner.
- source_word: τιμῆσαι
  choice: l’honorer
  rationale: Exprime clairement le but annoncé; le pronom renvoie au Temple.
theological_decisions:
- issue: Portée et tonalité de l’action projetée dans le Temple
  choice: Le locuteur affirme vouloir honorer le Temple juif au moyen d’offrandes, sans que la traduction approuve ni atténue cette prétention.
  alternative: « rendre hommage dans leur sanctuaire au moyen de dons votifs »
  rationale: Il s’agit d’une affirmation historique placée dans la bouche du locuteur. La formulation conserve son intention déclarée et la tension narrative sans commentaire doctrinal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure reste ouverte par une virgule finale, conformément à la syntaxe continue du passage source.
