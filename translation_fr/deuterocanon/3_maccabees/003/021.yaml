base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
translation:
  language: fr
  text: Dans ces circonstances, après avoir fait connaître à tous leurs compatriotes que nous ne leur gardions aucune rancune[a], et en raison de notre alliance ainsi que des innombrables affaires qui leur avaient été confiées dès le début en toute bonne foi, nous avons voulu changer leur condition, les juger dignes de la citoyenneté alexandrine et les faire participer à ce qui concerne le sanctuaire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que nous ne leur tenions pas rigueur » ou « notre indulgence » ; le terme grec désigne le fait de ne pas retenir les torts commis contre quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « aux choses qui concernent le sanctuaire » ; l’expression peut désigner de manière générale des privilèges ou des responsabilités liés au sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  choice: ne gardions aucune rancune
  rationale: Le nom désigne le fait de ne pas se souvenir des torts ni les tenir contre quelqu’un. Cette formulation française naturelle conserve l’idée de ne pas nourrir de ressentiment.
- source_word: πρὸς τοὺς ὁμοφύλους αὐτῶν ... ἅπασιν γνωρίσαντες
  choice: après avoir fait connaître à tous ... envers leurs compatriotes
  rationale: Le datif ἅπασιν dépend de γνωρίσαντες (« faire connaître à tous »), tandis que πρὸς τοὺς ὁμοφύλους αὐτῶν précise envers qui s’exerce l’absence de rancune. Cette construction suit directement la syntaxe grecque.
- source_word: συμμαχίαν
  choice: alliance
  rationale: Dans le cadre politique d’un décret royal, le terme évoque une alliance ou une association formelle plutôt qu’une simple amitié personnelle.
- source_word: τὰ πεπιστευμένα ... μύρια πράγματα
  choice: les innombrables affaires qui leur avaient été confiées
  rationale: Le participe parfait exprime des affaires ou responsabilités remises en confiance; « affaires » convient au contexte administratif et politique.
- source_word: μετὰ ἁπλότητος
  choice: en toute bonne foi
  rationale: ἁπλότης exprime ici la droiture, la franchise ou la sincérité avec laquelle ces affaires avaient été confiées, non la simplicité au sens d’absence de complexité.
- source_word: ἐξαλλοιῶσαι
  choice: changer leur condition
  rationale: Le verbe signifie changer ou rendre différent. La suite montre qu’il s’agit de leur statut civique; « condition » explicite sobrement ce cadre sans imposer l’idée d’une assimilation complète.
- source_word: πολιτίας ... Ἀλεξανδρέων
  choice: la citoyenneté alexandrine
  rationale: πολιτεία désigne ici le statut civique ou la citoyenneté des Alexandrins.
- source_word: καταξιῶσαι
  choice: les juger dignes de
  rationale: Cette expression conserve la valeur évaluative du verbe, plutôt que de le réduire à l’idée d’accorder un privilège.
- source_word: μετόχους ... καταστῆσαι
  choice: les faire participer
  rationale: La combinaison exprime l’établissement de personnes comme participants ou bénéficiaires; la tournure française est naturelle tout en préservant l’idée de partage.
- source_word: τῶν εἰς ἱερὸν
  choice: à ce qui concerne le sanctuaire
  rationale: La formule grecque est concise et son étendue exacte reste indéterminée. Cette traduction garde une référence large aux réalités, droits ou responsabilités liés au sanctuaire.
theological_decisions:
- issue: Portée des privilèges civiques et cultuels envisagés
  choice: Le texte présente une élévation de condition, l’accès à la citoyenneté alexandrine et une participation à ce qui concerne le sanctuaire, sans définir plus précisément leur portée.
  alternative: Comprendre soit une assimilation complète au corps civique alexandrin, soit exclusivement l’accès à une fonction cultuelle déterminée.
  rationale: Le grec nomme la citoyenneté alexandrine, puis emploie une expression comprimée à propos du sanctuaire. Il ne précise ni l’étendue juridique de l’intégration ni la nature exacte de la participation cultuelle; la traduction maintient donc cette ouverture.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période du décret royal est conservée tout en étant structurée par des coordinations naturelles. Le pluriel royal « nous » est maintenu. Les formulations évitent de préciser au-delà du grec la nature de la citoyenneté ou des droits liés au sanctuaire.
