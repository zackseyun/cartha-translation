revisions:
- from: Dans ces circonstances, après avoir fait connaître à tous que nous ne gardions aucune rancune[a] envers leurs compatriotes, et en raison tant de notre alliance que des innombrables affaires qui leur avaient été confiées dès le début en toute bonne foi, nous avons voulu changer leur condition, les juger dignes de la citoyenneté alexandrine et les faire participer à ce qui concerne le sanctuaire[b].
  to: Dans ces circonstances, après avoir fait connaître à tous leurs compatriotes que nous ne leur gardions aucune rancune[a], et en raison de notre alliance ainsi que des innombrables affaires qui leur avaient été confiées dès le début en toute bonne foi, nous avons voulu changer leur condition, les juger dignes de la citoyenneté alexandrine et les faire participer à ce qui concerne le sanctuaire[b].
  rationale: La révision corrige une ambiguïté syntaxique et une tournure de coordination non idiomatique, tout en conservant le sens, le registre administratif royal et l’ouverture sémantique du grec concernant les réalités liées au sanctuaire.
