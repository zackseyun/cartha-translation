  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
translation:
  language: fr
  text: Déjà, certains voisins, amis et partenaires d’affaires, prenant discrètement quelques personnes à part, donnaient des assurances qu’ils se joindraient à eux pour les défendre et qu’ils déploieraient tous leurs efforts pour leur venir en aide.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γείτονές
  choice: voisins
  rationale: Le nom désigne naturellement les personnes vivant à proximité et s’intègre à l’énumération des relations sociales.
- source_word: φίλοι
  choice: amis
  rationale: Le sens relationnel courant convient le mieux dans cette liste de personnes solidaires.
- source_word: συνπραγματευόμενοι
  choice: partenaires d’affaires
  rationale: Le participe désigne des personnes qui prennent part ensemble à des affaires ou transactions, sans exiger l’idée d’une association juridique formelle.
- source_word: μυστικῶς
  choice: discrètement
  rationale: L’adverbe exprime le caractère secret de la démarche; « discrètement » est naturel en français et convient à l’action de prendre quelqu’un à part.
- source_word: τινας ἐπισπώμενοι
  choice: prenant quelques personnes à part
  rationale: Cette formulation conserve la nuance de tirer ou d’attirer des personnes à l’écart sans imposer le sens plus interprétatif de « gagner à leur cause ».
- source_word: πίστεις ἐδίδουν
  choice: donnaient l’assurance
  rationale: L’expression idiomatique évoque des garanties ou engagements donnés; « donner l’assurance » en restitue clairement la force.
- source_word: συνασπίζειν
  choice: faire front avec eux pour les protéger
  rationale: Le verbe, formé sur le mot « bouclier », exprime une action défensive menée de concert. Cette tournure préserve les idées de solidarité et de protection dans un français naturel.
- source_word: πᾶν ἐκτενὲς
  choice: tous leurs efforts
  rationale: L’expression marque l’intensité et l’engagement total; cette formulation française rend le sens sans lourdeur littérale.
- source_word: προσιοίσεσθαι
  choice: déploieraient
  rationale: Dans cette construction, le futur infinitif annonce l’effort qu’ils promettaient de fournir; « déployer des efforts » est idiomatique.
- source_word: πρὸς ἀντίλημψιν
  choice: pour leur venir en aide
  rationale: ἀντίλημψις désigne l’aide ou le soutien; la locution choisie est claire, actuelle et adaptée au contexte.
