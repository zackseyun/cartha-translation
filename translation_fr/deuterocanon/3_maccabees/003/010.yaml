translation_notes:
  register: Français moderne international, digne et accessible. La syntaxe conserve la progression de la phrase grecque tout en évitant un calque lourd. Aucun pronom explicite n’apparaît après συνασπίζειν dans le grec; « avec eux » et « les » reprennent naturellement, d’après le contexte, les personnes menacées mentionnées dans le passage.
