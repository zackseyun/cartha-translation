  - severity: low
    issue: Ajout de « ainsi » dans la dernière phrase
    rationale: Le lien causal est contextuellement plausible, mais l’adverbe n’est pas exprimé par le grec; il peut être retiré pour une restitution plus sobre.
  - severity: low
    issue: « leur différence »
    rationale: Le possessif interprète la διάστασις comme leur particularité. « Leur divergence » reste plus près de l’idée de dissension ou de différend signalée par le texte.
