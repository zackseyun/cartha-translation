base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
translation:
  language: fr
  text: Mais ils ne cessaient de faire courir des rumeurs sur leur divergence en matière d’hommages et d’aliments[a], affirmant que ces gens ne se conformaient ni au roi ni à ses forces, qu’ils étaient hostiles et s’opposaient fortement aux affaires de l’État. Ils les rendirent l’objet d’une crainte considérable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prosternations et aliments », voire « adoration et aliments ». Le mot grec peut désigner aussi bien des marques de révérence envers une autorité que l’adoration religieuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils attachèrent à eux une crainte qui n’était pas ordinaire » ; autrement dit, ils les rendirent objets d’une crainte ou d’une suspicion considérable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάστασιν
  choice: différence
  rationale: Le terme exprime ici une divergence ou une séparation dans les pratiques. « Différence » rend la non-conformité dénoncée sans la transformer en révolte ouverte.
- source_word: προσκυνήσεων
  choice: hommages
  rationale: Le mot peut désigner des prosternations, des marques d’obéissance ou l’adoration. « Hommages » convient au cadre royal tout en laissant ouverte la dimension religieuse, explicitée en note.
- source_word: τροφῶν
  choice: aliments
  rationale: Le grec nomme simplement les aliments. Cette traduction évite d’introduire explicitement la notion plus interprétative de lois alimentaires.
- source_word: ἐθρύλουν
  choice: ne cessaient de faire courir des rumeurs
  rationale: L’imparfait indique une action persistante, tandis que le verbe évoque des propos répétés et diffusés, avec une nuance défavorable.
- source_word: ὁμοτρόπως ... γίνεσθαι
  choice: n’adoptaient la manière de vivre ni du roi ni de ses forces
  rationale: L’expression porte sur la conformité de conduite ou de mode de vie, et non seulement sur un accord intellectuel. Cette formulation reste naturelle en français.
- source_word: ταῖς δυνάμεσιν
  choice: ses forces
  rationale: Dans ce contexte royal et politique, le terme peut désigner les forces militaires ou, plus largement, les structures de puissance du roi. « Ses forces » préserve cette latitude.
- source_word: δυσμενεῖς
  choice: hostiles
  rationale: L’adjectif exprime une disposition ennemie active, au-delà d’une simple réserve.
- source_word: μέγα τι τοῖς πράγμασιν ἐναντιουμένους
  choice: s’opposaient fortement aux affaires de l’État
  rationale: τοῖς πράγμασιν vise ici les affaires publiques ou l’ordre politique. La formulation rend clairement la gravité politique de l’accusation.
- source_word: οὐ τῷ τυχόντι ... φόβῳ
  choice: une crainte considérable
  rationale: La tournure idiomatique signifie une crainte qui n’est ni légère ni ordinaire. « Considérable » restitue cette intensité en français courant.
- source_word: περιήψαντο
  choice: firent ainsi naître à leur égard
  rationale: Le verbe signifie littéralement attacher ou suspendre quelque chose à quelqu’un. Dans le contexte, les calomniateurs chargent les Juifs d’une réputation inquiétante et suscitent une vive crainte à leur égard.
theological_decisions:
- issue: Faut-il donner à προσκυνήσεων un sens exclusivement cultuel ou inclure les marques de révérence dues au pouvoir royal ?
  choice: hommages
  alternative: adoration ; prosternations
  rationale: Le contexte associe la particularité religieuse des Juifs à leur rapport au pouvoir royal. « Hommages » maintient l’ambiguïté entre révérence politique et acte religieux sans imposer un sens exclusivement cultuel.
- issue: Quel sens politique donner à τοῖς πράγμασιν ?
  choice: les affaires de l’État
  alternative: les affaires publiques ; l’ordre établi
  rationale: L’accusation présente ces gens comme une menace pour le roi et son royaume. « Affaires de l’État » explicite suffisamment cette portée politique sans identifier le terme à une institution plus précise que ne le fait le grec.
- issue: Comment rendre la crainte exprimée par περιήψαντο φόβῳ ?
  choice: une crainte suscitée à leur égard
  alternative: une crainte attachée à eux ; une crainte amenée sur eux
  rationale: La métaphore grecque demeure difficile à reproduire littéralement en français. Le contexte indique vraisemblablement que les rumeurs ont rendu les Juifs redoutables aux yeux du public ; la note conserve l’image du texte source et signale cette interprétation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été divisée en trois phrases pour rendre l’accumulation grecque lisible, tout en conservant la progression de la rumeur vers l’accusation politique puis vers la crainte publique.
