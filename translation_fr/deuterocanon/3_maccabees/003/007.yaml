revisions:
- from: Mais ils ne cessaient de faire courir des rumeurs sur leur différence en matière d’hommages et d’aliments[a]. Ils affirmaient que ces gens n’adoptaient la manière de vivre ni du roi ni de ses forces, qu’ils étaient hostiles et s’opposaient fortement aux affaires de l’État. Ils firent ainsi naître à leur égard une crainte considérable[b].
  to: Mais ils ne cessaient de faire courir des rumeurs sur leur divergence en matière d’hommages et d’aliments[a], affirmant que ces gens ne se conformaient ni au roi ni à ses forces, qu’ils étaient hostiles et s’opposaient fortement aux affaires de l’État. Ils les rendirent l’objet d’une crainte considérable[b].
  rationale: La révision remplace une formulation française maladroite par « ne se conformaient ni au roi ni à ses forces », qui rend l’accusation de non-conformité sans réduire le texte à une divergence d’opinion. Elle supprime l’adverbe non exprimé « ainsi » et formule la crainte comme une réputation inquiétante attachée à ces gens. Les ambiguïtés de προσκυνήσεις et la métaphore de περιήψαντο sont préservées par les notes.
