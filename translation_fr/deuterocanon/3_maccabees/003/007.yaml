review_pass:
  verdict: revise
  source_fidelity: La formulation « n’adoptaient la manière de vivre ni du roi ni de ses forces » est difficilement intelligible et donne l’impression qu’il s’agirait d’adopter le mode de vie personnel du roi ou de l’armée. Le grec exprime l’accusation de non-conformité à leur égard. La dernière phrase rend bien l’effet visé, mais « ainsi » n’est pas exprimé dans le grec et peut être omis. « Leur différence » est possible, mais « leur divergence » correspond plus directement à διάστασις dans ce contexte polémique.
  naturalness: Le français est généralement soutenu et accessible. Une phrase plus idiomatique pour la non-conformité alléguée est nécessaire. « Les rendirent l’objet d’une crainte considérable » exprime clairement que la crainte est attachée à ces personnes dans l’opinion publique, sans prétendre qu’elles-mêmes éprouvaient cette crainte.
  terminology: « Hommages » conserve de façon heureuse l’ambiguïté de προσκυνήσεις entre révérence publique et adoration. « Aliments », « ses forces », « hostiles » et « affaires de l’État » sont appropriés. La note a doit conserver l’alternative cultuelle et l’alternative gestuelle; la note b doit expliquer l’image sans imposer une lecture excessive.
