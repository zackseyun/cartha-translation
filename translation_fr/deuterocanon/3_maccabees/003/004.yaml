  yaml_path: translation/deuterocanon/3_maccabees/003/004.yaml
  text: But because they worshiped God and lived according to his law, they kept themselves separate in matters of food; for this reason some regarded them as hateful.
translation:
  language: fr
  text: Mais, parce qu’ils vénéraient Dieu et réglaient leur conduite selon leur loi, ils se tenaient à l’écart en matière de nourriture. Pour cette raison, certains les considéraient comme odieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβόμενοι
  choice: adoraient
  rationale: Dans ce contexte religieux, le participe exprime la vénération et le culte rendus à Dieu; « adoraient » est naturel et dignifié en français.
- source_word: τῷ τούτων νόμῳ
  choice: selon sa loi
  rationale: Le démonstratif pluriel renvoie vraisemblablement à Dieu selon le sens contextuel retenu par la tradition textuelle consultée; « sa loi » produit un français clair sans alourdir la phrase.
- source_word: πολιτευόμενοι
  choice: réglaient leur conduite
  rationale: Le verbe désigne ici une manière de vivre ou de se conduire selon une norme, plutôt qu’une activité politique au sens moderne.
- source_word: χωρισμὸν ἐποίουν
  choice: se tenaient à l’écart
  rationale: Rend l’idée concrète de séparation sociale sans suggérer nécessairement une rupture absolue.
- source_word: ἐπὶ τῷ κατὰ τὰς τροφάς
  choice: en matière de nourriture
  rationale: Expression générale concernant les pratiques alimentaires; elle évite de préciser au-delà du grec.
- source_word: ἀπεχθεῖς
  choice: odieux
  rationale: Conserve la force du terme, qui signifie haï ou détesté, et s’accorde avec « considéraient comme ».
theological_decisions:
- issue: Référent de τῷ τούτων νόμῳ
  choice: sa loi, c’est-à-dire la loi de Dieu
  alternative: leur loi
  rationale: Le texte transmis porte littéralement « la loi de ceux-ci », mais le contexte associe immédiatement le culte de Dieu et l’observance de la loi. La formulation retenue suit cette compréhension contextuelle sans introduire de désignation confessionnelle.
- issue: Nature de la séparation
  choice: séparation limitée aux pratiques alimentaires
  alternative: séparation sociale générale
  rationale: Le complément grec circonscrit explicitement la séparation au domaine de la nourriture; la traduction préserve cette limitation.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase garde le lien causal, la restriction au domaine alimentaire et le jugement hostile porté par certains.
