  text: 'Et voici en quels termes la lettre avait été rédigée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύπος
  choice: Voici comment
  rationale: Dans cette formule d’introduction au contenu d’une lettre, τύπος désigne sa teneur ou sa forme. La tournure française naturelle « Voici comment… » introduit fidèlement le texte qui suit sans imposer le sens plus étroit de « copie ».
- source_word: ἐγέγραπτο
  choice: avait été rédigée
  rationale: Le plus-que-parfait passif grec indique que la lettre se trouvait déjà mise par écrit. « Rédigée » convient en français au contenu d’une lettre et évite le calque lourd « avait été écrite ainsi ».
