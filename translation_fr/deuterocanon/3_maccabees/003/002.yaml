  yaml_path: translation/deuterocanon/3_maccabees/003/002.yaml
  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
translation:
  language: fr
  text: Pendant que ces affaires étaient administrées[a], une rumeur hostile circulait contre ce peuple auprès de personnes disposées à lui faire du mal. Une occasion leur était ainsi donnée de suivre leur intention[b], comme s’ils étaient empêchés de suivre leurs coutumes établies[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pendant que ces affaires étaient organisées » ou « gérées ».'
    reason: lexical_alternative
  - marker: b
    text: « Une occasion » peut aussi se traduire par « un prétexte » ou « une possibilité »; « intention » peut aussi être compris comme « disposition » ou « dessein ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « leurs règles établies », « leurs observances traditionnelles » ou « leurs usages traditionnels ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτων δὲ οἰκονομουμένων
  choice: Pendant que ces mesures étaient mises en œuvre
  rationale: Le participe οἰκονομουμένων évoque des affaires administrées, organisées ou menées à bien. « Ces mesures étaient mises en œuvre » est naturel en français et convient au contexte administratif sans préciser un agent absent du grec.
- source_word: φήμη δυσμενὴς ἐξέκειτο
  choice: une rumeur hostile se répandait
  rationale: φήμη peut désigner un bruit, une rumeur ou un rapport, tandis que δυσμενής marque l’hostilité. Avec ἐξέκειτο, « se répandait » rend idiomatiquement l’idée d’un bruit mis en circulation.
- source_word: κατὰ τοῦ γένους
  choice: contre ce peuple
  rationale: Dans ce contexte, γένος désigne collectivement le peuple juif. « Peuple » évite les connotations biologiques modernes de « race » et convient mieux que « nation » au français courant.
- source_word: ἀνθρώποις συμφρονοῦσιν εἰς κακοποίησιν
  choice: parmi des gens qui partageaient la même volonté de lui nuire
  rationale: συμφρονοῦσιν indique une communauté de pensée ou d’intention, et εἰς κακοποίησιν l’orientation vers le mauvais traitement ou le tort causé. La formulation française explicite naturellement leur accord malveillant sans limiter le tort à la violence physique.
- source_word: ἀφόρμης δὲ διδομένης εἰς διάθεσιν
  choice: Un prétexte leur était ainsi fourni pour mettre leur projet à exécution
  rationale: ἀφορμή peut être une occasion, une possibilité ou un prétexte. Dans ce contexte de rumeur hostile, « prétexte » est vraisemblable. διάθεσις peut évoquer une disposition, une intention ou un dessein; « mettre leur projet à exécution » rend le mouvement vers une action organisée, tout en signalant en note l’incertitude lexicale.
- source_word: ἀπὸ τῶν νομίμων
  choice: de suivre leurs usages traditionnels
  rationale: τὰ νόμιμα désigne des règles, observances ou coutumes établies. « Usages traditionnels » garde ensemble les dimensions coutumière et normative sans ajouter explicitement l’idée d’ancestralité.
- source_word: αὐτοὺς κωλύωνται
  choice: on les empêchait
  rationale: La tournure grecque est comprimée et son agent n’est pas exprimé clairement. Le français indéfini « on » conserve cette absence d’agent et rend αὐτούς par « les ».
theological_decisions:
- issue: Désignation collective du peuple juif par γένος
  choice: ce peuple
  alternative: cette nation; cette communauté; cette race
  rationale: « Ce peuple » exprime l’identité collective visée par la campagne hostile sans introduire une conception raciale moderne ni accentuer indûment le statut politique.
- issue: Valeur de ἀφορμή dans le contexte de l’hostilité antijuive
  choice: un prétexte
  alternative: une occasion; une possibilité d’agir
  rationale: La rumeur hostile paraît fournir un motif utilisable pour passer à l’action. « Prétexte » convient au contexte, mais le grec permet aussi une valeur plus neutre; cette possibilité est conservée dans la note.
- issue: Agent de l’empêchement allégué dans ὡς ἂν … αὐτοὺς κωλύωνται
  choice: 'agent laissé indéfini : « comme si on les empêchait »'
  alternative: comme si le peuple les empêchait; comme s’ils étaient empêchés
  rationale: La construction grecque ne nomme pas nettement l’agent. Le tour français avec « on » préserve l’allégation et l’ambiguïté au lieu d’attribuer explicitement l’empêchement au peuple juif.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase grecque très compacte est divisée en deux phrases pour rester claire. Les expressions « ce peuple », « lui nuire » et « on les empêchait » maintiennent les référents collectifs tout en évitant de résoudre abusivement l’agent de la dernière proposition.
