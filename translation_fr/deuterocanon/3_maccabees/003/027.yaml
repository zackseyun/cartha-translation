  rationale: La révision corrige la valeur du complément de supplices, restitue plus précisément la nuance d’« odieux » et améliore la formulation de la catégorie des nourrissons. Elle conserve le caractère indéfini de la personne juive visée, le ton du décret et l’ambiguïté historique sur la méthode exacte d’exécution.
