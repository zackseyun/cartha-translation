  terminology: « Maisonnée » est un bon choix pour πανοικίᾳ. « Au sein » convient aux nourrissons allaités. « Les plus odieux supplices » restitue mieux le superlatif ἐχθίσταις que « les plus cruels supplices », sans trancher au-delà du grec sur la procédure d’exécution.
