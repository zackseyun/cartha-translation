  text: But whoever shelters any of the Jews[a], from old man to infant, even to those at the breast, will be beaten to death with the most hateful tortures[b], together with his whole household.
translation:
  language: fr
  text: Mais quiconque cachera un Juif, du vieillard au tout-petit, même un nourrisson encore au sein[a], sera battu à mort dans les plus odieux supplices[b], avec toute sa maisonnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme grec rare désigne les nourrissons encore allaités ; on pourrait aussi traduire : « même les nourrissons ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec évoque une exécution brutale par coups. On traduit parfois plus techniquement : « sera assommé à coups de bâton » ou « sera supplicié sur la roue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεπάσῃ
  choice: cachera
  rationale: Dans cette menace légale, le verbe signifie couvrir ou dissimuler quelqu’un afin de le soustraire aux autorités. « Cachera » exprime naturellement cette idée en français.
- source_word: τινα τῶν Ἰουδαίων
  choice: l’un des Juifs
  rationale: 'Cette tournure rend la construction partitive et indéfinie du grec : n’importe quel membre du groupe visé.'
- source_word: ἀπὸ γεραιοῦ μέχρι νηπίου
  choice: depuis le vieillard jusqu’au tout-petit
  rationale: La formule déploie l’ensemble des âges. « Tout-petit » garde à νήπιον son sens de très jeune enfant sans le confondre avec le nourrisson précisé ensuite.
- source_word: καὶ μέχρι ὑπομαστιγίων
  choice: y compris ceux qui sont encore au sein
  rationale: Le terme rare désigne les enfants encore allaités. Cette formulation conserve l’image concrète tout en restant claire en français moderne.
- source_word: ἐχθίσταις βασάνοις
  choice: au milieu des plus cruels supplices
  rationale: Le superlatif exprime le caractère extrême et odieux des tourments. « Plus cruels » est naturel dans ce contexte de violence judiciaire, tandis que « supplices » convient au registre solennel.
- source_word: ὑποτυμπανισθήσεται
  choice: sera battu à mort
  rationale: Le verbe désigne une exécution brutale par coups, peut-être sur un instrument de supplice. La traduction communique le résultat et le moyen sans imposer une reconstitution technique incertaine.
- source_word: πανοικίᾳ
  choice: avec toute sa maisonnée
  rationale: Le terme englobe l’ensemble de la maison, potentiellement au-delà de la seule famille de sang. « Maisonnée » préserve cette portée.
