  source_fidelity: La couverture de σκεπάσῃ par « cachera », l’indéfini partitif, la progression des âges, la maisonnée et l’incertitude quant au procédé exact de ὑποτυμπανισθήσεται sont bien rendus. En revanche, « au milieu des » transforme le datif ἐχθίσταις βασάνοις en indication de lieu, alors qu’il exprime les supplices accompagnant ou caractérisant l’exécution. « Cruels » atténue aussi la nuance d’« odieux/détestables » de ἐχθίσταις.
