base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/006.yaml
  text: So then[a], the foreigners did not at all take into account the beneficence for which the nation was spoken of everywhere;
translation:
  language: fr
  text: Ainsi donc, les étrangers ne tinrent absolument aucun compte[a] de la bonne conduite de ce peuple, dont on parlait partout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne prirent absolument pas en considération ». Le verbe grec appartient littéralement au vocabulaire du calcul ou du dénombrement, mais il signifie ici que les étrangers n’accordèrent aucun poids à cette conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ... εὐπραξίαν
  choice: la bonne conduite
  rationale: Dans ce contexte, εὐπραξία désigne vraisemblablement les bonnes actions ou la conduite digne d’éloge attribuée au peuple, plutôt que sa prospérité. « Bonne conduite » conserve cette portée sans préciser indûment qu’il s’agirait uniquement de bienfaisance.
- source_word: περὶ τὸ γένος
  choice: de ce peuple
  rationale: γένος désigne ici le peuple juif comme groupe ethnique. « Ce peuple » est naturel en français moderne et évite les connotations contemporaines de « race ».
- source_word: ἐν πᾶσιν
  choice: partout
  rationale: Avec θρυλουμένην, l’expression évoque une réputation largement répandue, parmi tous ou en tous lieux. « Partout » restitue sobrement cette publicité.
- source_word: θρυλουμένην
  choice: dont on parlait
  rationale: Le participe indique que cette conduite était couramment évoquée ou largement rapportée. La tournure impersonnelle française préserve cette idée sans transformer la réputation en approbation formelle.
- source_word: οἱ ἀλλόφυλοι
  choice: les étrangers
  rationale: ἀλλόφυλοι désigne les personnes appartenant à un autre peuple. « Les étrangers » maintient ici le contraste ethnico-national sans importer le sens théologique parfois associé à « les païens ».
- source_word: οὐδαμῶς
  choice: absolument aucun
  rationale: La combinaison « ne… absolument aucun compte » rend l’intensité de la négation grecque οὐδαμῶς dans un français clair.
- source_word: διηριθμήσαντο
  choice: tinrent ... compte
  rationale: Bien que le verbe appartienne au champ lexical du calcul ou du dénombrement, il signifie ici ne pas prendre en considération ou ne donner aucun poids à un fait.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la nuance de réputation publique de θρυλουμένην et l’ambiguïté relative de εὐπραξία, sans la réduire à la seule prospérité ni à la seule bienfaisance.
