  text: And by adorning their way of life with the good conduct of the righteous, they had become well regarded by all people.
translation:
  language: fr
  text: En rehaussant leur manière de vivre par la bonne conduite des justes, ils étaient devenus estimés de tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ... εὐπραξίᾳ
  choice: par la conduite droite
  rationale: Le terme désigne ici une manière d’agir bonne et honorable. « Conduite droite » restitue naturellement sa portée éthique sans la réduire à la bienfaisance.
- source_word: τῶν δικαίων
  choice: des justes
  rationale: L’adjectif substantivé au pluriel désigne les personnes justes. « Des justes » conserve la formulation concise et sa portée morale et religieuse.
- source_word: κοσμοῦντες
  choice: En embellissant
  rationale: Le participe évoque littéralement le fait d’orner ou de mettre en valeur. « Embellissant » préserve cette métaphore appliquée à la manière de vivre.
- source_word: τὴν συναναστροφήν
  choice: leur manière de vivre
  rationale: Dans ce contexte social et éthique, le mot désigne la conduite habituelle ou le mode de vie plutôt que la seule fréquentation d’autrui.
- source_word: ἅπασιν ἀνθρώποις
  choice: de tous
  rationale: Le datif indique ici les personnes auprès desquelles ils avaient bonne réputation. « De tous » est idiomatique avec « jouir de l’estime » et garde la portée universelle du grec.
- source_word: εὐδόκιμοι
  choice: jouir de l’estime
  rationale: Le terme exprime une réputation favorable et l’approbation d’autrui. Cette tournure française rend clairement cet état social.
- source_word: καθειστήκεισαν
  choice: ils en étaient venus à
  rationale: Le plus-que-parfait exprime un état résultant déjà acquis. « Étaient venus à » en conserve la nuance d’aboutissement.
