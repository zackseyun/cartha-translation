  text: For so great an organization[a], lacking no knowledge, must not be overlooked.
translation:
  language: fr
  text: Car une organisation aussi considérable[a], qui n’ignorait rien, ne serait pas ainsi négligée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un ensemble constitué aussi considérable » ou « un corps organisé aussi considérable »; le mot grec peut désigner un ensemble formé en un tout, un corps ou une organisation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... παροραθήσεσθαι
  choice: ne passerait pas ... inaperçue
  rationale: Le futur passif à l’infinitif exprime qu’elle ne serait pas laissée hors de l’attention. La tournure française conserve cette valeur prospective sans introduire explicitement une obligation absente du verbe grec.
- source_word: γὰρ
  choice: car
  rationale: γάρ rattache cette proposition à ce qui précède en lui donnant une valeur explicative.
- source_word: οὕτω
  choice: ainsi
  rationale: οὕτω est rendu séparément par « ainsi », conformément à son sens adverbial, plutôt que fusionné avec l’adjectif de grandeur.
- source_word: τηλικοῦτο
  choice: aussi considérable
  rationale: Le terme indique une grandeur remarquable de taille, d’étendue ou d’importance; « considérable » maintient cette latitude.
- source_word: σύστημα
  choice: communauté
  rationale: Dans ce contexte humain et collectif, σύστημα désigne un ensemble constitué ou un corps organisé. « Communauté » est naturel en français, tandis que la note conserve les autres possibilités lexicales.
- source_word: μηδὲν ἠγνοηκός
  choice: qui n’ignorait rien
  rationale: Cette proposition relative rend directement le participe parfait de ἀγνοέω et préserve l’affirmation forte du grec sans la réinterpréter comme une simple absence de négligence.
