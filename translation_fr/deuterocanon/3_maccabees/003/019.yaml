  yaml_path: translation/deuterocanon/3_maccabees/003/019.yaml
  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: fr
  text: 'Ils rendent manifeste leur hostilité envers nous : seuls parmi les peuples, ils se montrent arrogants envers les rois et envers leurs propres bienfaiteurs, et ne veulent rien offrir de sincère.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυσμένειαν
  choice: hostilité
  rationale: Rend directement l’inimitié ou la disposition hostile exprimée par le terme grec.
- source_word: ἔκδηλον καθιστάντες
  choice: rendent ainsi manifeste
  rationale: Conserve la construction causative (« rendre évident/manifeste ») et rattache naturellement la proposition au contexte précédent.
- source_word: μονώτατοι τῶν ἐθνῶν
  choice: seuls parmi les peuples
  rationale: Exprime le superlatif intensif μονώτατοι sans lourdeur en français; « peuples » convient ici aux groupes nationaux.
- source_word: ὑψαυχνοῦντες
  choice: se montrent arrogants
  rationale: Le verbe évoque littéralement le fait de tenir la nuque haute, d’où une attitude hautaine ou arrogante.
- source_word: γνήσιον
  choice: de sincère
  rationale: Dans ce contexte relationnel, γνήσιος désigne ce qui est authentique, loyal ou sincère; cette traduction préserve la portée morale sans préciser indûment la nature de ce qui est offert.
- source_word: φέρειν
  choice: offrir
  rationale: Le sens littéral est « porter/apporter »; avec οὐδὲν γνήσιον, « offrir » donne en français une expression naturelle tout en gardant l’objet indéfini.
theological_decisions:
- issue: Portée de l’accusation contre les Juifs dans le décret royal
  choice: Conserver l’accusation telle qu’elle est formulée par le locuteur, sans l’endosser ni l’atténuer.
  alternative: Reformuler pour signaler explicitement qu’il s’agit de propagande mensongère.
  rationale: Le verset rapporte la rhétorique hostile du décret; la traduction doit préserver la voix narrative et laisser le contexte en permettre l’évaluation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le ton accusateur et officiel du décret, avec une ponctuation qui clarifie le lien entre la manifestation de l’hostilité et les griefs qui suivent.
