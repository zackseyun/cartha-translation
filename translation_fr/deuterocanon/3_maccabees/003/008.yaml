base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
translation:
  language: fr
  text: Mais les Grecs de la ville, qui n’avaient subi aucun tort, voyant le trouble inattendu au sujet des hommes et les attroupements désordonnés qui se formaient, n’avaient pas la force de leur venir en aide ; car leur état d’esprit les poussait à lancer un appel[a]. Certains, eux aussi, étaient en proie à l’agitation[b] et pensaient que tout cela changerait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur état d’esprit les poussait à supplier » ou « à encourager ». La construction grecque est très condensée, et παράκλησις peut désigner un appel, une supplication, une exhortation ou un encouragement.
    reason: lexical_alternative
  - marker: b
    text: Ou « étaient eux aussi entraînés dans le mouvement de la foule ». L’adverbe rare συνδρόμως peut évoquer aussi bien l’agitation intérieure que le fait d’être emporté par un mouvement collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  choice: Mais les Grecs qui habitaient la ville
  rationale: La tournure κατὰ τὴν πόλιν situe les Grecs dans la ville, tandis que δέ marque un léger contraste. Cette formulation est naturelle en français sans donner à κατά un sens distributif.
- source_word: οὐδὲν ἠδικημένοι
  choice: sans avoir subi aucun tort
  rationale: Le participe parfait passif indique qu’eux-mêmes n’avaient été victimes d’aucune injustice. « Subir un tort » conserve cette valeur passive.
- source_word: ταραχὴν ἀπροσδόκητον
  choice: le trouble inattendu
  rationale: ταραχή désigne un trouble, une agitation ou un tumulte. « Trouble » convient au contexte civique tout en restant sobre.
- source_word: περὶ τοὺς ἄνδρας
  choice: au sujet de ces hommes
  rationale: περί peut ici exprimer la référence plutôt qu’une localisation physique. « Au sujet de » maintient cette lecture sans préciser indûment la nature du trouble.
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  choice: les attroupements désordonnés qui se formaient
  rationale: συνδρομή évoque le fait d’accourir ensemble ou un rassemblement, et ἀπρόκοπος suggère quelque chose qui n’avance pas normalement, d’inefficace ou de désordonné. « Attroupements désordonnés » rend bien la scène collective.
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  choice: n’avaient pas la force de leur venir en aide
  rationale: ἔσθενον exprime la force ou la capacité. La traduction conserve explicitement cette nuance plutôt que de réduire la proposition à une simple impossibilité.
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  choice: car leur inclination les poussait à lancer un appel
  rationale: La construction grecque est comprimée et difficile. διάθεσις renvoie à l’état d’esprit ou à l’inclination, tandis que παράκλησις peut être un appel, une supplication, une exhortation ou un encouragement. Le rendu français garde le mouvement intérieur vers une intervention verbale sans en fixer excessivement la nature.
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  choice: Certains, eux aussi, étaient en proie à l’agitation
  rationale: L’adverbe rare συνδρόμως peut décrire un état de tumulte ou le fait d’être entraîné dans le mouvement collectif. « En proie à l’agitation » exprime cette perturbation sans choisir définitivement entre une nuance intérieure et sociale.
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  choice: pensaient que tout cela changerait
  rationale: μεταπίπτω signifie changer, tourner ou passer à un autre état. « Tout cela » reprend simplement ταῦτα sans préciser si le changement attendu serait favorable.
