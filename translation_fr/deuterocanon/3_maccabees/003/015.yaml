base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
translation:
  language: fr
  text: Nous avons estimé qu’il fallait prendre soin[b] des peuples qui habitent la Cœlé-Syrie et la Phénicie, non par la force de la lance[a], mais avec douceur et une grande bienveillance, après leur avoir volontiers fait du bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « par la force de la lance » : image militaire désignant un pouvoir exercé par la contrainte.'
    reason: cultural_note
  - marker: b
    text: Le verbe traduit par « prendre soin » peut aussi signifier « nourrir » ou « élever », comme on le ferait pour un enfant ; il applique ainsi une image paternaliste au traitement des peuples soumis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγησάμεθα
  choice: Nous avons estimé
  rationale: L’aoriste de ἡγέομαι exprime ici un jugement réfléchi ou une décision politique; « avons estimé » en garde la nuance délibérative dans un registre digne.
- source_word: μὴ βίᾳ δόρατος
  choice: non par la force de la lance
  rationale: La traduction conserve l’image militaire concrète de δόρυ plutôt que de la généraliser en « force des armes ».
- source_word: ἐπιεικείᾳ
  choice: avec douceur
  rationale: Dans le contraste avec la contrainte militaire, « douceur » rend naturellement l’idée de modération, de clémence ou de mansuétude portée par ἐπιείκεια.
- source_word: πολλῇ φιλανθρωπίᾳ
  choice: une grande bienveillance
  rationale: φιλανθρωπία désigne ici une disposition humaine et bienfaisante. « Bienveillance » est idiomatique en français et convient au langage d’une politique royale.
- source_word: τιθηνήσασθαι
  choice: prendre soin
  rationale: Le verbe évoque le fait de nourrir, d’élever ou de materner. « Prendre soin » demeure naturel en français tout en conservant la représentation paternaliste du traitement des peuples soumis; une note signale l’image plus précise.
- source_word: τὰ κατοικοῦντα ... ἔθνη
  choice: les peuples qui habitent
  rationale: « Peuples » rend ici ἔθνη sans suggérer nécessairement des États modernes, et la relative produit une formulation française naturelle.
- source_word: Κοίλην Συρίαν
  choice: la Cœlé-Syrie
  rationale: Il s’agit du nom géographique hellénistique traditionnel, translittéré sous sa forme française usuelle.
- source_word: εὖ ποιήσαντες ἀσμένως
  choice: en leur faisant volontiers du bien
  rationale: Cette formulation garde à la fois la valeur bienfaisante de εὖ ποιέω et la disposition volontaire ou joyeuse exprimée par ἀσμένως.
theological_decisions:
- issue: Paternalisme politique de τιθηνήσασθαι
  choice: Conserver l’idée de soin et expliciter en note l’image consistant à nourrir ou élever.
  alternative: les gouverner / les administrer
  rationale: Des termes purement administratifs effaceraient la rhétorique parentale ou nourricière du grec. La formulation retenue reste lisible sans résoudre ni approuver cette tension politique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’opposition rhétorique entre coercition militaire et bienveillance royale, ainsi que l’image paternaliste du grec sans adopter un vocabulaire administratif qui l’effacerait.
