review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement τούτων, ὁμοῦ, κολαθέντων, τὰ πράγματα et le cadre administratif. Toutefois, τελείως ne doit pas être absorbé dans « tout » et « les meilleures conditions » : il intensifie plus naturellement l’état exprimé par l’infinitif futur passif κατασταθήσεσθαι. La voix passive de cet infinitif mérite aussi d’être conservée autant que le permet le français. La construction avec λείψαμεν demeure exceptionnellement condensée dans le texte grec et doit être signalée sans la résoudre au-delà de ce que permet le texte.'
  naturalness: « Nous laisserons pour tout le temps à venir nos affaires s’établir » est lourd et « s’établir » transforme le passif grec en moyen/actif. « Nous laisserons nos affaires, pour l’avenir, être pleinement établies » reste formel, mais est intelligible et reproduit plus fidèlement la construction difficile. « En toute stabilité » et « dans le meilleur état » sont plus idiomatiques et correspondent aux deux substantifs grecs au singulier.
  terminology: « Punis », « nos affaires », « stabilité » et « meilleur état » conviennent au registre administratif et coercitif du passage. Aucun terme théologique particulier n’est en jeu. La référence personnelle par « ces gens » est acceptable dans le contexte.
  issues:
  - severity: medium
    issue: τελείως est omis comme élément sémantique autonome.
    rationale: Le texte grec comporte τελείως, qui qualifie naturellement l’établissement futur ; « tout le temps à venir » rend εἰς τὸν ἐπίλοιπον χρόνον, tandis que « les meilleures conditions » rend τῇ βελτίστῃ διαθέσει. Il faut rendre l’idée de manière explicite, par exemple « pleinement ».
  - severity: medium
    issue: La forme passive de κατασταθήσεσθαι est neutralisée.
    rationale: « Nos affaires s’établir » ne rend pas le futur passif infinitif. Une formulation française avec « être ... établies » préserve la voix et rend mieux la syntaxe comprimée, même si elle conserve volontairement une certaine raideur.
  - severity: low
    issue: La note reprend et accentue les insuffisances de la traduction principale.
    rationale: Elle omet également τελείως et donne « meilleure condition » sans rendre pleinement la construction ni le singulier administratif de διάθεσις. Elle doit signaler la difficulté de λείψαμεν et de l’infinitif passif sans proposer une paraphrase incomplète.
  revised_text: Car, si tous ces gens sont punis ensemble, nous laisserons nos affaires, pour l’avenir, être pleinement établies en toute stabilité et dans le meilleur état.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « nous laisserons nos affaires, pour le temps qui reste, être pleinement établies en stabilité et dans le meilleur état ». La construction grecque, avec « nous laisserons » suivi d’un infinitif futur passif, est condensée et quelque peu inhabituelle.'
    reason: lexical_alternative
