revisions:
- from: Car, si tous ces gens sont punis ensemble, nous laisserons pour tout le temps à venir nos affaires s’établir dans la stabilité et dans les meilleures conditions.[a]
  to: Car, si tous ces gens sont punis ensemble, nous laisserons nos affaires, pour l’avenir, être pleinement établies en toute stabilité et dans le meilleur état.[a]
  rationale: La révision restitue explicitement τελείως par « pleinement », conserve le passif de κατασταθήσεσθαι et améliore la formulation française de ἐν εὐσταθείᾳ et τῇ βελτίστῃ διαθέσει. Elle maintient la construction difficile liée à λείψαμεν au lieu d’imposer une interprétation plus fluide mais moins directement attestée.
