  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
translation:
  language: fr
  text: Car, si tous ces gens sont punis ensemble, nous laisserons nos affaires, pour l’avenir, être pleinement établies en toute stabilité et dans le meilleur état.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « nous laisserons nos affaires, pour le temps qui reste, être pleinement établies en stabilité et dans le meilleur état ». La construction grecque, avec « nous laisserons » suivi d’un infinitif futur passif, est condensée et quelque peu inhabituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτων
  choice: ces gens
  rationale: Le démonstratif désigne les personnes évoquées dans le contexte. « Ces gens » explicite naturellement la référence personnelle sans ajouter une précision absente du grec.
- source_word: ὁμοῦ
  choice: tous… ensemble
  rationale: Cette formulation rend à la fois la dimension collective et la totalité suggérées par l’adverbe.
- source_word: κολαθέντων
  choice: sont punis
  rationale: Dans ce contexte de politique royale coercitive, « punir » conserve le sens direct de κολάζω sans l’atténuer.
- source_word: λείψαμεν
  choice: nous laisserons
  rationale: La forme est rendue au plus près par un futur à la première personne du pluriel, en lien avec la proposition infinitive qui suit.
- source_word: εἰς τὸν ἐπίλοιπον χρόνον
  choice: pour tout le temps à venir
  rationale: L’expression désigne la durée future restante; cette formulation est claire et idiomatique en français.
- source_word: τελείως
  choice: omis comme adverbe autonome; exprimé par « tout » et « les meilleures conditions »
  rationale: Le grec est comprimé et la portée exacte de l’adverbe est incertaine. La traduction évite d’introduire la notion de « confiance », qui n’est pas lexicalement explicite, tout en conservant l’idée d’un résultat complet et durable.
- source_word: τὰ πράγματα
  choice: nos affaires
  rationale: Le terme désigne ici les affaires ou la situation du pouvoir royal; « nos affaires » convient à la voix administrative du locuteur.
- source_word: ἐν εὐσταθείᾳ
  choice: dans la stabilité
  rationale: La traduction conserve le substantif abstrait et l’idée d’un état ferme et stable.
- source_word: τῇ βελτίστῃ διαθέσει
  choice: dans les meilleures conditions
  rationale: διάθεσις concerne ici l’état ou l’organisation des affaires, non une disposition émotionnelle.
- source_word: κατασταθήσεσθαι
  choice: s’établir
  rationale: Le futur passif infinitif exprime l’entrée dans un état ordonné et stable. L’infinitif français avec « laisser » restitue la construction comprimée.
