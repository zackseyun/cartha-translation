  text: But they were persuaded against them all the more harshly[a], on the ground that they had been bribed as part of a scheme for escape, and it clearly happened that he was convinced of this.
translation:
  language: fr
  text: Mais ils se laissèrent d’autant plus convaincre de sévir durement contre eux, au motif que ceux-ci avaient été soudoyés en vue d’un plan d’évasion, et il apparut clairement que lui-même en était convaincu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe grecque est condensée et quelque peu difficile ici. La proposition finale peut aussi se rendre : « et il devint manifeste qu’il avait été convaincu à ce sujet ».'
    reason: ambiguïté syntaxique et solution de traduction alternative
lexical_decisions:
- source_word: ἐπείσθησαν
  choice: ils se laissèrent convaincre
  rationale: L’aoriste passif de πείθω est rendu par une tournure française naturelle qui conserve l’idée d’une persuasion subie, sans préciser qui en est l’auteur.
- source_word: αὐτοῖς σκληρότερον
  choice: de sévir plus durement contre eux
  rationale: La syntaxe grecque est très resserrée. Cette formulation exprime la portée défavorable du datif et la valeur comparative adverbiale de σκληρότερον, tout en restant intelligible en français.
- source_word: ὡς δεδωροκημένοις
  choice: sous prétexte que ceux-ci avaient été soudoyés
  rationale: ὡς présente ici le motif allégué plutôt qu’un fait garanti par le narrateur; le participe parfait passif exprime l’accusation selon laquelle ils avaient été achetés.
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  choice: dans le cadre d’un plan d’évasion
  rationale: μηχανή désigne un moyen concerté, un dispositif ou un plan; ἐκφυγή indique une fuite ou une évasion.
- source_word: συνεβῆ σαφῶς
  choice: il arriva manifestement
  rationale: La tournure impersonnelle garde la construction quelque peu gauche du grec; σαφῶς est rendu sans supprimer son rattachement syntaxique ambigu.
- source_word: αὐτὸν περὶ τούτου πιστωθῆναι
  choice: que lui-même en fut convaincu
  rationale: Le passif de πιστόω indique qu’il fut amené à tenir l’accusation pour certaine. « lui-même » marque le pronom αὐτόν sans identifier explicitement son référent.
