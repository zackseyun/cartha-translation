  text: even though most were still in the country—some still assembled in their houses[b][a], and others also in the place—since the situation had become impossible for all the generals over Egypt.
translation:
  language: fr
  text: bien que la plupart soient encore dans le pays — les uns toujours rassemblés dans leurs maisons, les autres aussi en ce lieu[a] —, la situation étant devenue impossible pour tous les commandants chargés de l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : « les autres aussi dans le lieu ». Il peut s’agir d’un endroit particulier ou d’un lieu public où ils étaient rassemblés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: bien que
  rationale: Introduit naturellement en français la concession exprimée par καίπερ.
- source_word: ὄντων ἔτι κατὰ τὴν χώραν τῶν πλειόνων
  choice: la plupart soient encore dans le pays
  rationale: Rend le génitif absolu et comprend τῶν πλειόνων comme désignant la majorité; « pays » conserve la portée géographique assez large de χώρα.
- source_word: τῶν μὲν κατὰ τὰς οἰκίας ἔτι συνεστηκότων
  choice: les uns toujours rassemblés dans leurs maisons
  rationale: Le balancement μὲν…δὲ est rendu par « les uns… les autres »; συνεστηκότων indique ici un rassemblement, tandis que le pluriel distributif des maisons est conservé.
- source_word: τῶν δὲ καὶ κατὰ τὸν τόπον
  choice: les autres aussi dans le lieu en question
  rationale: La formulation grecque est elliptique. « Le lieu en question » préserve la référence définie de τὸν τόπον sans préciser indûment la nature du lieu.
- source_word: ὡς ἀδυνάτου καθεστῶτος
  choice: car la situation était devenue impossible
  rationale: Rend la valeur causale probable de ὡς et l’état résultant exprimé par καθεστῶτος, en explicitant sobrement le sujet implicite.
- source_word: πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς
  choice: pour tous les commandants chargés de l’Égypte
  rationale: « Commandants » convient au sens administratif et militaire de στρατηγοί; « chargés de l’Égypte » exprime leur responsabilité sans suggérer nécessairement qu’il s’agit uniquement de généraux au sens moderne.
