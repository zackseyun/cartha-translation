  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : les parents sont confrontés à l’image de lacets mortels substitués aux couronnes nuptiales, et l’Hadès est conservé sans assimilation doctrinale au châtiment final. Toutefois, « car ils voyaient » transforme le participe circonstanciel grec en relation causale explicite, et « passaient dans les lamentations » est peu idiomatique.'
  naturalness: Le registre est globalement moderne et digne. « Passer ... en lamentations » et la reprise participiale « voyant déjà » sont plus naturels en français littéraire contemporain. « Parents » est plus exact que « proches » pour συγγενεῖς dans ce contexte, sans restreindre le terme à un sexe ou à un degré de parenté.
  terminology: « Nœuds coulants », « couronnes », « noces » et « Hadès » conviennent. La note conserve à juste titre l’ambiguïté lexicale de ᾅδης et ne lui impose pas le sens de châtiment final.
  issues:
  - severity: medium
    issue: Relation causale ajoutée par « car »
    rationale: Le grec ὁρῶντες est un participe circonstanciel (« voyant ») et n’énonce pas explicitement que leur vision de l’Hadès est la cause des lamentations. La causalité est possible contextuellement, mais ne doit pas être imposée dans le texte principal.
  - severity: low
    issue: « passaient dans les lamentations » est peu naturel
    rationale: Pour διῆγον ἐν θρήνοις, « passaient ... en lamentations » rend naturellement en français l’idée de passer les jours dans le deuil et les plaintes.
  - severity: low
    issue: « proches » est plus large et moins précis que συγγενεῖς
    rationale: En français moderne, « proches » peut désigner des amis ou des intimes. « Parents » exprime plus directement le lien de parenté visé par le grec.
