  to: Quant à leurs parents, ils avaient des nœuds coulants passés autour du cou en guise de couronnes. Bien qu’ils fussent dans toute la vigueur de la jeunesse, ils passaient les jours qui restaient de leurs noces en lamentations, au lieu de festoyer et de jouir de l’insouciance propre à la jeunesse, voyant déjà l’Hadès[a] étendu à leurs pieds.
  rationale: La révision ne modifie pas le sens. Elle remplace l’expression moins précise « leurs proches » par « leurs parents », rend plus idiomatiquement l’expression temporelle et les lamentations, et conserve la valeur circonstancielle du participe grec « voyant » sans ajouter le lien causal de « car ». La note est maintenue, car elle reflète correctement la portée non doctrinalement spécifiée de ᾅδης.
