base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/008.yaml
  text: And their relatives[a], with nooses wrapped around their necks instead of garlands, though in the full bloom of youth, spent the remaining days of their weddings in mourning instead of feasting and youthful ease, already seeing Hades lying at their feet.
translation:
  language: fr
  text: Quant à leurs parents, ils avaient des nœuds coulants passés autour du cou en guise de couronnes. Bien qu’ils fussent dans toute la vigueur de la jeunesse, ils passaient les jours qui restaient de leurs noces en lamentations, au lieu de festoyer et de jouir de l’insouciance propre à la jeunesse, voyant déjà l’Hadès[a] étendu à leurs pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mort » ou « le séjour des morts ». Le grec emploie Hadès et conserve l’image du monde des morts, sans désigner précisément le châtiment final.
    reason: Alternative lexicale et préservation de l’imagerie du texte source.
lexical_decisions:
- source_word: συγγενεῖς
  choice: proches
  rationale: Le terme désigne les personnes unies par la parenté. « Proches » est naturel en français et n’impose ni genre masculin ni degré précis de parenté.
- source_word: βρόχους
  choice: nœuds coulants
  rationale: Le mot évoque des boucles ou des lacets capables d’enserrer, ici vraisemblablement destinés à attacher ou étrangler. « Nœuds coulants » conserve l’image sinistre opposée aux couronnes nuptiales.
- source_word: ὡς ἀντὶ στεφέων
  choice: en guise de couronnes
  rationale: La formule marque une substitution ironique aux couronnes festives. « En guise de » restitue naturellement ὡς ἀντί, tandis que « couronnes » convient à l’usage nuptial antique.
- source_word: τοὺς αὐχένας περιπεπλεγμένοι
  choice: passés autour du cou
  rationale: Le participe décrit les nœuds qui encerclent leur cou. Cette formulation française est claire et concrète sans alourdir la phrase.
- source_word: μετὰ ἀκμαίας νεανικῆς ἡλικίας
  choice: dans la pleine vigueur de la jeunesse
  rationale: L’expression souligne l’apogée et la vitalité de leur jeune âge. La traduction en conserve à la fois l’idée d’âge et celle de vigueur.
- source_word: εὐωχίας
  choice: festoyer
  rationale: Dans le contexte nuptial, le terme renvoie aux banquets et aux réjouissances. « Festoyer » est vivant, actuel et précis.
- source_word: νεωτερικῆς ῥᾳθυμίας
  choice: jouir de l’insouciance de leur âge
  rationale: ῥᾳθυμία peut exprimer l’aisance, le relâchement ou une vie sans souci. Ici, la formulation rend la légèreté propre à la jeunesse sans lui attribuer nécessairement une faute morale.
- source_word: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας
  choice: les jours qui restaient de leurs noces
  rationale: Le pluriel γάμων renvoie ici aux noces ou aux festivités nuptiales qui s’étendaient sur plusieurs jours. Cette traduction reste proche du grec et naturelle en français.
- source_word: ἐν θρήνοις διῆγον
  choice: ils passaient dans les lamentations
  rationale: Le verbe signifie passer un laps de temps et θρῆνοι désigne des lamentations exprimées. La formulation conserve la force concrète du pluriel grec.
- source_word: παρὰ πόδας ἤδη τὸν ἅδην ὁρῶντες κείμενον
  choice: ils voyaient déjà l’Hadès étendu à leurs pieds
  rationale: Le texte personnifie ou spatialise l’Hadès comme une réalité imminente. « Étendu à leurs pieds » conserve l’image grecque plutôt que de la réduire à la simple proximité de la mort.
theological_decisions:
- issue: Traduction de ἅδην
  choice: l’Hadès
  alternative: la mort ; le séjour des morts
  rationale: Le grec emploie explicitement Ἅιδης, nom traditionnel du monde ou domaine des morts. Le conserver évite aussi bien de l’aplatir en « mort » que de l’identifier au châtiment final ; une note donne les équivalents interprétatifs possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque très longue est divisée en deux phrases pour la lisibilité, tout en maintenant les contrastes entre nœuds coulants et couronnes, lamentations et réjouissances nuptiales, jeunesse vigoureuse et mort imminente.
