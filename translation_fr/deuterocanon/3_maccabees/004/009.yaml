lexical_decisions:
- source_word: κατήχθησαν
  choice: furent emmenés
  rationale: Le passif aoriste de κατάγω peut exprimer le fait de conduire ou d’emmener vers le bas ou vers une destination. Faute de destination explicite en français, « furent emmenés » préserve le déplacement imposé sans en préciser indûment la direction.
- source_word: θηρίων τρόπον
  choice: comme des bêtes
  rationale: Rendu comparatif naturel qui conserve la déshumanisation exprimée par le grec.
- source_word: ἀγόμενοι
  choice: poussés
  rationale: Le verbe peut signifier « conduits », mais le rapprochement avec des bêtes et les entraves de fer justifie ici le terme coercitif « poussés », sans aller jusqu’à ajouter une violence non exprimée.
- source_word: σιδηροδέσμοις ἀνάγκαις
  choice: sous la contrainte de liens de fer
  rationale: Cette formulation garde à la fois la contrainte exprimée par ἀνάγκαις et la réalité matérielle de liens en fer exprimée par σιδηροδέσμοις.
- source_word: τοῖς ζυγοῖς τῶν πλοίων
  choice: aux jougs des navires
  rationale: « Jougs » conserve l’image animale de ζυγός, tout en laissant ouverte la possibilité qu’il s’agisse de pièces de charpente ou de barres du navire.
- source_word: προσηλωμένοι
  choice: attaché
  rationale: Le participe indique une fixation ferme et peut aller jusqu’au sens de « cloué ». « Attaché » évite de préciser un procédé que le contexte immédiat ne permet pas d’établir.
- source_word: τοὺς τραχήλους
  choice: le cou
  rationale: Le singulier distributif français est naturel après « les uns » et correspond aux cous des personnes concernées.
- source_word: ἀρρήκτοις
  choice: impossibles à briser
  rationale: Expression française claire et directe pour ce qui ne peut être rompu.
- source_word: κατησφαλισμένοι
  choice: solidement entravés
  rationale: Le participe exprime une mise en sûreté ou une fixation ferme. Associé aux pieds et aux fers, « solidement entravés » rend naturellement cette idée.
- source_word: πέδαις
  choice: fers
  rationale: πέδαι désigne précisément des entraves aux pieds. « Fers » est un terme français courant et exact dans ce contexte carcéral.
