  text: 'And they were brought down, driven like beasts by the compulsion of iron chains: some with their necks fastened to the yokes of the ships, and others with their feet secured in unbreakable fetters,'
translation:
  language: fr
  text: 'Ils furent emmenés, menés comme des bêtes sous la contrainte de liens de fer : les uns avaient le cou attaché aux jougs des navires[a], les autres avaient les pieds solidement entravés par des fers impossibles à briser.'
