base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
translation:
  language: fr
  text: Partout où ce décret parvenait, une célébration publique était organisée parmi les non-Juifs, avec des cris et de la joie[a], comme si la haine qui, depuis longtemps, bondissait déjà dans leurs pensées contre les Juifs se manifestait maintenant au grand jour avec assurance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une célébration aux frais de la collectivité ». Le terme grec peut désigner une fête publique ou collective et peut aussi impliquer un financement public.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie un participe rare et imagé, évoquant une haine déjà en mouvement, bondissante ou frémissante dans leurs pensées avant de se manifester ouvertement.
    reason: textual_difficulty
lexical_decisions:
- source_word: Πάντῃ δὲ ὅπου προσέπιπτεν
  choice: Partout où parvenait
  rationale: Rend naturellement la portée distributive de Πάντῃ ὅπου et l’idée du décret atteignant successivement différents lieux.
- source_word: πρόσταγμα
  choice: décret
  rationale: Désigne ici un ordre officiel; « décret » convient au registre administratif et narratif.
- source_word: δημοτελὴς
  choice: aux frais de la collectivité
  rationale: Le terme signifie proprement que la fête est financée sur les fonds publics; cette traduction conserve une précision que le simple adjectif « public » pourrait effacer.
- source_word: τοῖς ἔθνεσιν
  choice: les populations non juives
  rationale: Dans ce récit juif, ἔθνη désigne vraisemblablement les habitants non juifs plutôt que des nations politiques abstraites. Cette expression est claire en français moderne sans la coloration parfois technique de « païens ».
- source_word: εὐωχία
  choice: des festivités
  rationale: Le mot évoque une réjouissance comportant festin et célébration; le pluriel français s’accorde naturellement avec la répétition locale de ces événements.
- source_word: μετὰ ἀλαλαγμῶν καὶ χαρᾶς
  choice: avec des cris et des manifestations de joie
  rationale: Préserve l’intensité sonore de ἀλαλαγμοί et distingue les cris de l’expression générale de la joie.
- source_word: προκατεσκιρωμένης
  choice: nourrissaient depuis longtemps
  rationale: Le participe est rare et difficile; son image suggère une hostilité déjà active intérieurement. La formulation française transmet ce mouvement préalable sans imposer l’image peu intelligible d’une haine qui « danse ».
- source_word: κατὰ διάνοιαν
  choice: dans leurs pensées
  rationale: Situe la haine dans la disposition intérieure, en contraste avec sa manifestation publique ultérieure.
- source_word: μετὰ παρρησίας νῦν ἐκφαινομένης
  choice: se montrait désormais au grand jour, sans retenue
  rationale: Exprime conjointement la manifestation extérieure (ἐκφαινομένης) et la franchise ou liberté hardie (παρρησία) avec une tournure française naturelle.
theological_decisions:
- issue: Référent de τοῖς ἔθνεσιν
  choice: les populations non juives
  alternative: les nations / les païens
  rationale: Le contexte oppose les Juifs aux populations environnantes. « Populations non juives » conserve cette opposition sans faire des ἔθνη des États-nations ni leur attribuer explicitement une identité religieuse précise.
- issue: Référent des pronoms αὐτοῖς et implicite de l’hostilité
  choice: « elles » renvoie aux populations non juives; « contre les Juifs » explicite l’objet de la haine
  alternative: conserver seulement « en eux » et « contre eux »
  rationale: Le français exige ici une clarification pour éviter deux antécédents ambigus successifs. Le contexte narratif identifie les Juifs comme la cible du décret et de l’hostilité; l’explicitation ne tranche pas une question doctrinale.
- issue: Force de παρρησία
  choice: sans retenue
  alternative: avec assurance / ouvertement
  rationale: Dans ce contexte hostile, le terme décrit la libre expression publique d’une haine jusque-là intérieure. « Sans retenue » préserve cette hardiesse sans la valoriser.
translation_notes:
  register: Français international actuel, narratif et digne. La syntaxe a été divisée en deux phrases pour rendre lisible la longue construction grecque. Les expressions « aux frais de la collectivité » et « populations non juives » privilégient la précision sans technicisme confessionnel.
