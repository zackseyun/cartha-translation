  text: But this was the invincible working of the providence from heaven of the one helping the Jews[a].
translation:
  language: fr
  text: Mais c’était là l’action invincible de la providence de celui qui, du ciel, vient en aide aux Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un autre rattachement de « du ciel » : « l’action invincible de la providence venue du ciel de celui qui vient en aide aux Juifs ».'
    reason: L’expression grecque ἐξ οὐρανοῦ (« du ciel ») peut être rattachée soit à celui qui aide, soit à la providence.
lexical_decisions:
- source_word: ἐνέργεια
  choice: action
  rationale: Le nom désigne une activité efficace ou une puissance à l’œuvre. « action » est naturel en français et conserve cette idée sans introduire explicitement la notion de miracle.
- source_word: προνοίας
  choice: providence
  rationale: Dans ce contexte, le terme évoque la sollicitude souveraine et agissante de Dieu plutôt qu’une simple prévoyance humaine.
- source_word: τοῦ βοηθοῦντος
  choice: de celui qui vient en aide
  rationale: Le participe présent substantivé est rendu sans nommer explicitement Dieu, conformément à la formulation indirecte du grec.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Le terme désigne ici le peuple juif comme groupe ethnoreligieux, et non simplement les habitants de la Judée.
- source_word: ἐξ οὐρανοῦ
  choice: venue du ciel
  rationale: La tournure exprime l’origine céleste de la providence. L’accord avec « providence » suit l’enchaînement syntaxique le plus immédiat tout en laissant perceptible une possible autre relation.
- source_word: ἀνίκητον
  choice: invincible
  rationale: L’adjectif souligne que cette action providentielle ne peut être vaincue; « invincible » en conserve directement la force.
theological_decisions:
- issue: Référent de « celui qui vient en aide aux Juifs »
  choice: Référence implicite à Dieu, sans le nommer plus explicitement que le grec.
  alternative: « Dieu, qui vient en aide aux Juifs depuis le ciel »
  rationale: Le grec emploie un participe substantivé et ne nomme pas Dieu. La traduction préserve cette manière indirecte de le désigner.
- issue: Rattachement de ἐξ οὐρανοῦ
  choice: « venue du ciel » rattaché à la providence.
  alternative: « celui qui, du ciel, vient en aide aux Juifs »
  rationale: La place de l’expression grecque permet une certaine ambiguïté de rattachement. Le texte principal suit la lecture reflétée par la consultation anglaise, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la densité théologique et la désignation indirecte de Dieu présentes dans le grec.
