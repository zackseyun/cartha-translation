translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque a été divisée pour préserver la clarté sans perdre les rapports logiques. « Schédia », « hippodrome » et « enceinte » maintiennent le cadre historique; les ambiguïtés réelles de l’ouverture et de la dernière proposition sont signalées sans les résoudre dogmatiquement.
