  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
translation:
  language: fr
  text: 'Après qu’on les eut conduits au lieu appelé Schédia et que la traversée eut pris fin, conformément au décret du roi, celui-ci ordonna de les faire camper dans l’hippodrome[a] situé devant la ville. C’était un espace découvert, particulièrement propice à faire d’eux un exemple public : il était sous les yeux de tous ceux qui descendaient vers la ville et de ceux qui, partant de là, étaient envoyés en voyage dans le pays. Ainsi, ils ne pourraient avoir aucun contact avec les troupes du roi et ne seraient même pas jugés dignes d’une enceinte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un hippodrome était un terrain aménagé pour les courses de chevaux.
    reason: Précision historique et lexicale sur ἱππόδρομος.
  - marker: b
    text: La fin de la phrase grecque est difficile. Elle signifie probablement qu’on voulait les tenir à l’écart des troupes du roi et leur refuser même un lieu convenablement clos ou protégé.
    reason: La syntaxe et la portée exacte de περιβόλῳ sont ambiguës; la note conserve cette incertitude.
lexical_decisions:
- source_word: Πότιον
  choice: Après que
  rationale: La forme transmise est difficile. Dans la construction avec les génitifs absolus qui suivent, une transition temporelle naturelle restitue le sens sans attribuer au mot une nuance plus précise qu’on ne peut établir.
- source_word: Σχεδίαν
  choice: Schédia
  rationale: Le nom de lieu est translittéré selon l’usage français, avec un accent facilitant sa prononciation.
- source_word: ἀχθέντων
  choice: on les eut conduits
  rationale: Le participe aoriste passif exprime le fait qu’ils ont été amenés à cet endroit; « conduits » convient au déplacement forcé sans préciser indûment le moyen.
- source_word: τὸ παράπλου περαθέντος
  choice: la traversée eut pris fin
  rationale: παράπλους désigne ici un trajet par voie d’eau, et περαίνω son achèvement. « Traversée » reste naturel sans imposer mer ou fleuve.
- source_word: δεδογματισμένον
  choice: conformément au décret
  rationale: Le parfait passif renvoie à une décision royale officielle déjà arrêtée.
- source_word: ἱπποδρόμῳ
  choice: hippodrome
  rationale: Le terme désigne précisément un lieu destiné aux courses de chevaux et conserve la couleur historique du récit.
- source_word: παρεμβαλεῖν
  choice: faire camper
  rationale: Le verbe signifie établir dans un camp ou faire camper; le causatif français rend clairement l’ordre donné à leur sujet.
- source_word: ἁπλατῷ καθεστῶτι περιμέτρῳ
  choice: un espace découvert
  rationale: La formulation grecque est difficile, mais elle caractérise vraisemblablement le lieu comme ouvert et exposé plutôt que protégé par une enceinte.
- source_word: πρὸς παραδειγματισμὸν
  choice: pour faire d’eux un exemple public
  rationale: Le nom évoque une exposition exemplaire destinée à humilier ou à dissuader; « public » explicite la visibilité soulignée par la suite.
- source_word: ἄγαν εὐκαιροτάτῳ
  choice: particulièrement bien placé
  rationale: Cette formulation française idiomatique conserve l’intensification et la très grande convenance du lieu au but recherché.
- source_word: καταπορευομένοις
  choice: descendaient vers
  rationale: Le choix conserve la nuance directionnelle de κατα- tout en restant naturel en français.
- source_word: στελλομένοις πρὸς ἐκδημίαν
  choice: étaient envoyés en voyage
  rationale: Le passif de στέλλω exprime l’envoi, tandis que ἐκδημία indique un déplacement hors de son lieu de résidence.
- source_word: τὸ σύνολον καταξιῶσαι περιβόλῳ
  choice: ne seraient même pas jugés dignes de bénéficier d’une enceinte
  rationale: « Même pas » rend la force globale de τὸ σύνολον; l’expression présente l’enceinte comme une protection ou un logement clos qu’on refusait de leur accorder.
