  verdict: revise
  source_fidelity: La construction est globalement bien rendue, mais « âpre diligence » atténue la composante de hâte de σπουδή, et « zèle soutenu » ne rend pas suffisamment προσθεσία (« surcroît », effort ajouté). La note a interprète de façon trop exclusive une expression qui peut aussi évoquer l’étendue entière concernée. La formulation révisée conserve l’image du grec sans trancher cette nuance.
  naturalness: 'La révision emploie un français moderne et fluide : « empressement acharné » et « surcroît de zèle » sont plus idiomatiques et plus précis dans ce contexte administratif oppressant. La coordination finale rend clairement l’inachèvement pendant les quarante jours.'
  terminology: « Enregistrement » demeure un bon équivalent administratif de ἀπογραφή, sans imposer « recensement ». « Personnes » est plus neutre et plus naturel que « gens » dans ce registre. Les termes ne chargent pas φιλοτίμος d’une interprétation morale ou confessionnelle.
  issues:
  - severity: medium
    issue: « âpre diligence » ne reflète pas assez le sens d’empressement ou de hâte de σπουδή.
    rationale: σπουδή désigne ici une application pressée; « diligence » peut désigner le soin sans l’urgence. « Empressement acharné » conserve l’intensité pénible de πικρᾶς et la rapidité impliquée.
  - severity: medium
    issue: « un zèle soutenu » efface l’idée d’effort ajouté dans προσθεσία.
    rationale: La formule grecque comporte l’idée d’un supplément ou redoublement d’effort, qualifié par φιλοτίμου. « Un surcroît de zèle » restitue cette intensification sans imposer une motivation psychologique précise.
  - severity: low
    issue: La note a présente l’expression « des levers ... aux couchers » comme exclusivement temporelle.
    rationale: L’expression peut certes évoquer le travail du matin au soir, mais son imagerie peut également suggérer l’étendue totale concernée. La note doit conserver cette ouverture.
  revised_text: Ainsi, l’enregistrement de ces personnes se faisait avec un empressement acharné et un surcroît de zèle, du lever du soleil jusqu’à son coucher[a], et ne parvenait pas à son terme durant quarante jours[b].
