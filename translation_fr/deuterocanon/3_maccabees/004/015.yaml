  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
translation:
  language: fr
  text: Ainsi, l’enregistrement de ces personnes se faisait avec un empressement acharné et un surcroît de zèle, du lever du soleil jusqu’à son coucher[a], et ne parvenait pas à son terme durant quarante jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis les levers du soleil jusqu’aux couchers ». L’expression peut évoquer une activité poursuivie du matin au soir et, selon le contexte, l’étendue entière concernée.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « sans même parvenir à son terme au bout de quarante jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  choice: enregistrement
  rationale: Le nom désigne l’inscription de personnes sur une liste officielle. « Enregistrement » convient au contexte administratif sans imposer le sens plus précis de « recensement ».
- source_word: πικρᾶς σπουδῆς
  choice: avec une âpre diligence
  rationale: σπουδή peut exprimer l’empressement, la hâte ou l’application; πικρός en souligne ici le caractère pénible et dur. « Âpre diligence » conserve cette intensité sans rendre la tournure artificielle.
- source_word: φιλοτίμου προσθεσίας
  choice: un zèle soutenu
  rationale: La formule évoque une application supplémentaire, empressée et poussée par le désir de se distinguer. « Zèle soutenu » restitue naturellement l’effort intense, sans surinterpréter sa motivation.
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  choice: du lever du soleil jusqu’à son coucher
  rationale: Cette expression temporelle indique un travail poursuivi toute la journée et conserve l’image grecque.
- source_word: ἀνήνυτον λαμβάνουσα τὸ τέλος
  choice: sans parvenir à son terme
  rationale: La clause signifie que l’opération n’atteignait pas son achèvement; cette formulation française est naturelle et préserve l’idée d’inachèvement.
- source_word: ἐπὶ ἡμέρας τεσσεράκοντα
  choice: pendant quarante jours
  rationale: La préposition avec l’accusatif exprime ici la durée durant laquelle l’enregistrement demeura inachevé.
