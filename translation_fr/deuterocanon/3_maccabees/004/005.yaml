  yaml_path: translation/deuterocanon/3_maccabees/004/005.yaml
  text: For an old man was being led along[a], full of gray hair, bent over by the weakness in his feet that comes with age, driven by the violent force of being thrown down[c][b], making use of a swift march without any regard for all dignity.
translation:
  language: fr
  text: Car on emmenait un vieillard à l’abondante chevelure blanche, voûté par la faiblesse de ses jambes due à l’âge, poussé par le violent élan d’un renversement[a], et s’astreignant à une marche rapide[b], au mépris de toute dignité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est condensé et difficile. « Renversement » peut aussi évoquer une chute, le fait de trébucher, ou l’action violente de faire tomber quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut se comprendre plus littéralement comme « faisant usage d’une marche rapide » ; dans ce contexte, elle peut aussi suggérer une allure rapide imposée au vieillard.
    reason: translation_ambiguity
  - marker: c
    text: 'Ou : « sans la moindre pudeur » ou « sans aucun respect des convenances ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγετο
  choice: on emmenait
  rationale: L’imparfait passif décrit une action en cours et un déplacement imposé, sans préciser les agents.
- source_word: γέρων
  choice: un vieillard
  rationale: Le mot désigne ici un homme âgé, non le détenteur d’une fonction.
- source_word: πλήρης πολιᾶς πεπυκασμένος
  choice: à l’épaisse chevelure blanche
  rationale: L’expression souligne visiblement son grand âge; πεπυκασμένος évoque le fait d’être abondamment couvert, tandis que πολιᾶς désigne les cheveux blanchis ou grisonnants.
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν ἐπικύφων
  choice: voûté par la faiblesse de ses jambes due à l’âge
  rationale: νωθρίτης peut exprimer la lenteur, l’engourdissement ou la faiblesse; «faiblesse» convient naturellement à cette description de la fragilité physique. «Jambes» rend ici plus naturellement ποδῶν que le littéral «pieds».
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  choice: sous une poussée violente qui risquait de le faire tomber
  rationale: La formule grecque est très condensée. Elle associe une impulsion violente à l’idée de renversement ou de chute, sans permettre d’en fixer précisément le rapport syntaxique.
- source_word: πρὸς ὀξεῖαν καταχρώμενος πορείαν
  choice: il était contraint d’avancer à vive allure
  rationale: La formulation française fait ressortir le rythme anormalement rapide imposé au vieillard dans ce contexte coercitif. La valeur exacte de καταχρώμενος demeure difficile, d’où la note.
- source_word: ἁπάσης αἰδοῦς ἄνευ
  choice: sans le moindre égard pour sa dignité
  rationale: αἰδώς peut désigner la retenue, le respect, la pudeur ou le sens des convenances. Ici, la phrase dénonce l’absence totale d’égards envers ce vieillard.
