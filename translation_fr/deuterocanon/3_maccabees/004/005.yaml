  naturalness: Le français est globalement naturel et de registre narratif digne. Une phrase unique avec des participes coordonnés restitue mieux la progression descriptive du grec, sans devenir lourde. « Au mépris de toute dignité » est plus idiomatique et évite d’attribuer de façon trop explicite au vieillard lui-même le manque d’égards que le contexte présente comme subi.
  terminology: « Vieillard », « chevelure blanche », « voûté », « faiblesse », et « marche rapide » conviennent à un français international actuel. « Renversement » est maintenu dans le texte avec une note afin de ne pas choisir indûment entre chute, trébuchement et action de renverser.
