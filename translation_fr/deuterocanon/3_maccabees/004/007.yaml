  text: And as prisoners they were dragged by force in public until their embarkation onto the ship[a].
translation:
  language: fr
  text: Prisonniers, ils étaient traînés de force en public jusqu’à ce qu’on les fasse monter à bord du navire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à ce qu’on les mette dans le navire ». L’expression grecque évoque littéralement le fait de les faire entrer, voire de les pousser, dans le navire.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιοι
  choice: Prisonniers
  rationale: Le terme désigne des personnes liées ou détenues. Placé en tête, « Prisonniers » conserve sa valeur prédicative tout en restant naturel en français.
- source_word: δημοσίᾳ
  choice: en public
  rationale: Dans ce contexte de contrainte violente, l’adverbe décrit le caractère public et manifeste du traitement, plutôt qu’une prise en charge aux frais de l’État.
- source_word: μέχρι τῆς εἰς τὸ πλοῖον ἐμβολῆς
  choice: jusqu’à ce qu’on les fasse monter à bord du navire
  rationale: Cette formulation française exprime naturellement leur introduction forcée dans le navire. Une note signale la nuance plus littérale de mise ou de poussée à l’intérieur.
- source_word: εἵλκοντο
  choice: ils étaient traînés
  rationale: L’imparfait passif présente une action prolongée subie; « traînés » rend bien le déplacement brutal exprimé par le verbe.
- source_word: μετὰ βίας
  choice: de force
  rationale: Cette expression concise et idiomatique marque clairement la coercition violente sans l’amplifier.
