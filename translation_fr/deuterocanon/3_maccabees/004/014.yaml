  text: and that the whole nation should be registered by name[a], not for the previously indicated brief service according to their work, but, by being tortured with the ordered cruelties[b], to be utterly destroyed in the course of a single day.
translation:
  language: fr
  text: et que tout le peuple soit recensé nom par nom[a], non pour le bref service lié aux travaux, annoncé auparavant[b], mais afin d’être soumis aux tortures prescrites et entièrement exterminé en l’espace d’un seul jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leur nom », c’est-à-dire en inscrivant chaque personne individuellement.
    reason: lexical_alternative
  - marker: b
    text: 'La construction grecque est difficile. Elle semble opposer un bref service lié à des travaux, annoncé auparavant, au véritable projet : soumettre le peuple à la torture puis l’exterminer en un seul jour.'
    reason: textual_or_syntactic_note
lexical_decisions:
- source_word: ἀπογραφῆναι
  choice: soit recensé
  rationale: Le verbe désigne ici un enregistrement administratif officiel; « recenser » convient naturellement à l’inscription de tout un peuple.
- source_word: πᾶν τὸ φῦλον
  choice: tout le peuple
  rationale: Dans ce contexte, φῦλον désigne collectivement le peuple juif, et non une seule tribu. « Peuple » évite aussi la connotation étatique moderne de « nation ».
- source_word: ἐξ ὀνόματος
  choice: nom par nom
  rationale: Cette formulation française rend explicitement la portée individualisante et distributive de l’expression grecque.
- source_word: οὐκ εἰς τὴν ἔμπροσθεν βραχεῖ προδεδηλωμένην τῶν ἔργων κατὰ τρόπον λατρείαν
  choice: non pour le bref service lié aux travaux, annoncé auparavant
  rationale: La construction grecque est difficile. Cette traduction conserve l’idée d’un service de courte durée annoncé à l’avance, apparemment en rapport avec des travaux, sans préciser davantage la nature incertaine de ce service.
- source_word: στρεβλούμεντας
  choice: pour être torturé
  rationale: Le participe évoque la torture, notamment la torsion ou le chevalet, mais le terme général « torturé » évite de spécifier un instrument que le texte ne nomme pas.
- source_word: παρηγγελμέναις αἰκίαις
  choice: par les sévices prescrits
  rationale: « Sévices » exprime les mauvais traitements violents, tandis que « prescrits » conserve leur caractère ordonné officiellement.
- source_word: τὸ τέλος ἀφανίσαι
  choice: disparaître entièrement
  rationale: ἀφανίζω signifie faire disparaître ou anéantir, et τὸ τέλος souligne ici l’aboutissement complet. La formulation française préserve la visée d’extermination.
- source_word: μιᾶς ὑπὸ καιρὸν ἡμέρας
  choice: en l’espace d’un seul jour
  rationale: Cette expression rend naturellement la concentration de l’anéantissement dans la durée d’une journée unique.
