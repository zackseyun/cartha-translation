    issue: « disparaître entièrement » affaiblit l’agentivité destructive de ἀφανίσαι.
    rationale: Le grec exprime le fait de faire disparaître, détruire ou anéantir complètement; dans ce contexte de décret persécuteur, le français doit éviter de suggérer que le peuple disparaîtrait de lui-même.
  - severity: low
    issue: « être torturé par les sévices prescrits » est une collocation peu naturelle.
    rationale: Les sévices sont eux-mêmes des mauvais traitements; « être soumis aux tortures prescrites » exprime plus directement le participe στρεβλούμεντας et le caractère officiellement ordonné des αἰκίαι.
