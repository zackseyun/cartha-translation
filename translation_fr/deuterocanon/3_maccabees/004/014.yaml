review_pass:
  verdict: revise
  source_fidelity: Le sens général et l’opposition entre le prétexte de service et le dessein d’anéantissement sont bien rendus. Toutefois, « disparaître entièrement » présente l’extermination comme une disparition spontanée plutôt que comme l’action destructive exprimée par ἀφανίσαι. La formulation révisée conserve la relation entre torture prescrite et destruction totale, sans préciser davantage la syntaxe grecque difficile.
  naturalness: Le français est globalement naturel. « Être torturé par les sévices prescrits » est toutefois moins idiomatique et moins net que « être soumis aux tortures prescrites ». La révision améliore aussi l’enchaînement final.
  terminology: « Tout le peuple », « recensé nom par nom » et « sévices/tortures prescrits » conviennent au registre et au contexte. « Exterminés » rend clairement τὸ τέλος ἀφανίσαι dans ce contexte, sans ajouter de lecture doctrinale.
