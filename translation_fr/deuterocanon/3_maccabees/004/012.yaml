lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Lorsque cela se produisit
  rationale: La tournure introduit une circonstance temporelle; le faible δέ n’exige pas ici un contraste explicite en français.
- source_word: ἀκούσας
  choice: ayant appris
  rationale: Le participe aoriste exprime l’information reçue avant l’action principale, qui se poursuit au verset suivant. Le français conserve ainsi la structure suspendue du verset.
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  choice: ses compatriotes de la ville
  rationale: ὁμοεθνεῖς désigne les membres du même peuple. « Ses compatriotes » est naturel en français; le possessif, implicite dans le contexte grec, précise leur relation avec le sujet.
- source_word: κρυβῇ ἐκπορευομένους
  choice: sortaient en secret
  rationale: κρυβῇ a une valeur adverbiale et ἐκπορεύομαι indique ici le fait de sortir ou de partir de la ville.
- source_word: πυκνότερον
  choice: de plus en plus souvent
  rationale: Le comparatif adverbial indique le caractère plus fréquent des départs clandestins plutôt qu’une densité physique.
- source_word: ὑποδιδράσκειν
  choice: se dérobaient
  rationale: Le verbe évoque une fuite ou un retrait furtif. « Se dérober » maintient cette nuance clandestine sans affirmer davantage que le grec.
- source_word: τὴν … ταλαιπωρίαν
  choice: à cause de la détresse
  rationale: La leçon transmise étant difficile, cette formulation rend le lien causal que le contexte semble établir entre les départs et la souffrance des frères.
- source_word: τῶν ἀδελφῶν
  choice: de leurs frères
  rationale: La traduction directe préserve le vocabulaire de parenté et de solidarité collective sans le réduire explicitement à une catégorie interprétative.
- source_word: ἰχθεῖ
  choice: sens rendu par la relation « à cause de »
  rationale: La forme transmise est obscure dans ce contexte et ne permet pas une traduction lexicale assurée; le texte français suit le sens contextuel apparent tout en signalant la difficulté en note.
