    text: Le texte grec de l’expression rendue par « à cause de la détresse de leurs frères » est difficile, en particulier le mot transmis sous la forme ἰχθεῖ. La traduction suit le sens apparent du contexte plutôt qu’une formulation littérale qui resterait obscure.
