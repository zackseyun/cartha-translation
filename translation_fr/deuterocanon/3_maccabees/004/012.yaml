    issue: Le comparatif πυκνότερον est rendu par « de plus en plus souvent ».
    rationale: Cette expression française implique une augmentation progressive au fil du temps. Le grec comparatif indique « plus souvent » sans exiger cette progression.
  - severity: low
    issue: « Se dérobaient » est peu idiomatique dans cet emploi absolu.
    rationale: Le sens de retrait furtif est possible, mais « s’éclipsaient » est plus naturel en français moderne tout en conservant la discrétion suggérée par ὑποδιδράσκειν.
  revised_text: Lorsque cela se produisit, ayant appris que ses compatriotes de la ville sortaient en secret et s’éclipsaient plus souvent à cause de la détresse de leurs frères[a],
