  text: And when this happened[a], having heard that his fellow countrymen from the city were secretly going out and more frequently slipping away because of the misery of their brothers[c][b],
translation:
  language: fr
  text: Lorsque cela se produisit, ayant appris que ses compatriotes de la ville sortaient en secret et s’éclipsaient plus souvent à cause de la détresse de leurs frères[a],
  philosophy: optimal-equivalence
  footnotes:
