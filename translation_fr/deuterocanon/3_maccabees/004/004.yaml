revisions:
- from: Car les gouverneurs de chaque ville les faisaient emmener tous ensemble[a] avec une dureté amère et impitoyable. Ainsi, devant ces châtiments hors du commun, même certains de leurs ennemis, ayant sous les yeux ce qui éveillait la compassion commune à tous les êtres humains[b] et songeant à l’issue incertaine de la vie[c], pleuraient sur leur lamentable déportation.
  to: Car les commandants de chaque ville les envoyaient tous ensemble[a], avec une amertume impitoyable. Ainsi, outre ces châtiments extraordinaires, même certains de leurs ennemis, ayant sous les yeux la compassion humaine commune[b] et considérant l’issue incertaine de la vie[c], pleuraient sur leur lamentable déportation.
  rationale: La révision corrige la relation additive entre les châtiments et l'émotion des ennemis, restitue directement « la compassion commune » sans introduire une causalité absente du grec, et remplace un titre administratif trop déterminé par « commandants ». Elle maintient l'ambiguïté de « l'issue incertaine de la vie » et le caractère forcé du départ, signalé en note.
  reviewer_model: gpt-5.6-terra
