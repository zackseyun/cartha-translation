base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
translation:
  language: fr
  text: Car les commandants de chaque ville les envoyaient tous ensemble[a], avec une amertume impitoyable. Ainsi, outre ces châtiments extraordinaires, même certains de leurs ennemis, ayant sous les yeux la compassion humaine commune[b] et considérant l’issue incertaine de la vie[c], pleuraient sur leur lamentable déportation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les envoyaient au loin ». Le contexte indique qu’ils étaient emmenés de force.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la compassion communément partagée par les êtres humains; elle toucha même certains de leurs ennemis.
    reason: clarification
  - marker: c
    text: 'Ou : « la ruine imprévisible de la vie ». Le grec peut évoquer l’issue inconnue de la vie en général ou le sort incertain des déportés.'
    reason: ambiguity
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  choice: avec une dureté amère et impitoyable
  rationale: Cette formulation exprime l’amertume et l’absence de pitié qui caractérisent la disposition intérieure des responsables, sans alourdir le français par une traduction littérale de ψυχή.
- source_word: τῶν κατὰ πόλιν στρατηγῶν
  choice: les gouverneurs de chaque ville
  rationale: στρατηγός peut désigner un chef militaire ou un haut administrateur. Dans ce contexte d’action officielle menée ville par ville, « gouverneurs » rend naturellement la fonction civique, tout en évitant de supposer que seuls des généraux militaires sont visés.
- source_word: ὁμοθυμαδόν
  choice: tous ensemble
  rationale: L’adverbe souligne le caractère collectif et coordonné de leur transfert.
- source_word: ἐξαπεστέλλοντο
  choice: les faisaient emmener
  rationale: Le verbe signifie littéralement « envoyer au loin », mais le contexte indique un déplacement contraint. La tournure française conserve l’action imposée sans anticiper entièrement le substantif final « déportation ».
- source_word: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
  choice: devant ces châtiments hors du commun
  rationale: ἐξάλλοις qualifie des peines extraordinaires, excessives ou aberrantes. « Devant » laisse ouverte la nuance de circonstance ou de réaction portée ici par ἐπί.
- source_word: τὸν κοινὸν ἔλεον
  choice: ce qui éveillait la compassion commune à tous les êtres humains
  rationale: 'La traduction explicite l’expression grecque compacte : il s’agit de la compassion humaine partagée, assez forte pour toucher même certains ennemis.'
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  choice: l’issue incertaine de la vie
  rationale: ἄδηλος signifie « invisible, incertain » et καταστροφή peut désigner le dénouement, le renversement ou la ruine. Cette traduction naturelle préserve l’ambiguïté du grec quant à la vie envisagée et au caractère exact de son issue.
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  choice: leur lamentable déportation
  rationale: Le substantif désigne l’action de les envoyer au loin. « Déportation » communique clairement le caractère forcé du déplacement, tandis que « lamentable » rend son extrême misère.
theological_decisions:
- issue: La portée de « l’issue incertaine de la vie »
  choice: Maintenir une formulation générale sans préciser de qui est la vie
  alternative: « la ruine incertaine qui attendait leur existence »
  rationale: Le grec ne comporte pas ici de possessif explicite. La réflexion peut porter sur le sort des déportés ou, plus largement, sur l’instabilité de toute vie humaine; la traduction ne tranche pas silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase grecque très longue est divisée en deux phrases afin d’en préserver la progression logique sans produire une syntaxe pesante. Le vocabulaire garde la gravité du récit et évite les formulations confessionnelles.
