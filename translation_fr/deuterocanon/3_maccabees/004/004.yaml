review_pass:
  verdict: revise
  source_fidelity: La structure passive, l'action concertée, l'expulsion contrainte et les larmes des ennemis sont bien perçues. Toutefois, « devant ces châtiments » ne rend pas suffisamment la valeur additive de ἐπὶ ταῖς ἐξάλλοις τιμωρίαις (« outre / en plus de »), et l'explicitation de τὸν κοινὸν ἔλεον comme « ce qui éveillait » la compassion modifie l'image grecque de la compassion humaine prise en considération sous leurs yeux.
  naturalness: Le français est globalement fluide et d'un registre approprié. « Les commandants de chaque ville » est plus direct et moins interprétatif que « gouverneurs », tandis que « outre ces châtiments extraordinaires » rend la progression de la phrase avec naturel.
  terminology: « Déportation » est justifié par le contexte coercitif, à condition que la note conserve le sens littéral du verbe. « Commandants » convient ici à στρατηγοί sans imposer une fonction administrative précise. « Compassion humaine commune » restitue τὸν κοινὸν ἔλεον sans en faire seulement un effet produit par le spectacle.
  issues:
  - severity: medium
    issue: Valeur de ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
    rationale: « Devant ces châtiments hors du commun » présente les châtiments comme le spectacle immédiat des ennemis, alors que le grec les ajoute aux causes ou aux circonstances déjà accablantes. « Outre ces châtiments extraordinaires » préserve la valeur additive attestée par le contexte et l'audit anglais.
  - severity: medium
    issue: Rendu de τὸν κοινὸν ἔλεον
    rationale: « Ce qui éveillait la compassion commune » transforme le nom grec en une cause implicite de compassion. Le texte désigne plutôt la compassion commune, humaine, que certains ennemis prenaient en considération sous leurs yeux.
  - severity: low
    issue: Rendu de στρατηγῶν
    rationale: « Gouverneurs » spécifie une fonction civique que στρατηγοί ne requiert pas. « Commandants » demeure plus proche du titre et conserve l'ambiguïté militaire ou civique.
