base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
translation:
  language: fr
  text: Le roi, grandement et continuellement rempli de joie, organisait des banquets devant toutes les idoles[a], l’esprit bien loin de la vérité et la bouche profane, louant ces idoles sourdes, incapables de leur parler ou de leur venir en aide, mais proférant contre Dieu[b] des paroles inconvenantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en l’honneur de toutes les idoles ».'
    reason: lexical_alternative
  - marker: b
    text: Dans l’édition grecque utilisée, les mots traduits par « Dieu » sont placés entre crochets, ce qui signale une incertitude textuelle.
    reason: textual_variant
lexical_decisions:
- source_word: Μεγάλως δὲ καὶ διηνεκῶς … χαρᾷ πεπληρωμένος
  choice: profondément et continuellement rempli de joie
  rationale: Cette formulation conserve les deux adverbes, l’un marquant l’intensité et l’autre la durée, dans un français naturel et soutenu.
- source_word: συμπόσια
  choice: des banquets
  rationale: Le terme désigne des repas festifs comportant de la boisson; « banquets » convient au cadre royal et cultuel sans adopter le ton familier de « beuveries ».
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  choice: devant toutes les idoles
  rationale: « Devant » reste proche de la valeur spatiale ou cultuelle possible de ἐπί avec le génitif. Le sens plus interprétatif « en l’honneur de » est signalé en note.
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  choice: l’esprit bien loin de la vérité
  rationale: « Esprit » rend ici la disposition intérieure exprimée par φρήν, tandis que « bien loin de la vérité » restitue clairement l’éloignement marqué par πόρρω.
- source_word: βεβήλῳ στόματι
  choice: la bouche profane
  rationale: « Profane » préserve la portée religieuse de βέβηλος et l’image concrète de la bouche, sans explicitation doctrinale.
- source_word: κωφὰ
  choice: ces idoles sourdes
  rationale: Le grec emploie un adjectif neutre substantivé, littéralement « des choses sourdes ». La reprise explicite d’« idoles » est naturelle en français et garde intacte la raillerie contre leur impuissance.
- source_word: μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  choice: incapables de leur parler ou de leur venir en aide
  rationale: La formulation rend les deux incapacités des idoles et conserve αὐτοῖς, qui renvoie naturellement à ceux qui les honorent.
- source_word: εἰς δὲ [τὸν θεὸν]
  choice: tandis qu’il tenait contre Dieu
  rationale: Dans ce contexte hostile, εἰς associé au verbe de parole a une force adversative. « Contre Dieu » exprime cette opposition, tandis que la note conserve l’incertitude textuelle signalée par l’édition.
- source_word: τί μὴ καθήκοντα
  choice: des propos inconvenants
  rationale: Cette expression idiomatique traduit ce qui ne convient pas ou n’est pas séant, sans préciser davantage la nature des paroles.
theological_decisions:
- issue: Contraste entre la louange des idoles et les paroles du roi à l’égard de Dieu
  choice: tandis qu’il tenait contre Dieu des propos inconvenants
  alternative: mais il disait au sujet de Dieu des choses qui ne convenaient pas
  rationale: Le contexte et la construction εἰς … λαλῶν favorisent le sens hostile « contre ». La traduction maintient le contraste théologique du grec sans préciser le contenu des propos.
- issue: Impuissance des idoles
  choice: ces idoles sourdes, incapables de leur parler ou de leur venir en aide
  alternative: des choses sourdes, incapables de leur parler ou de les secourir
  rationale: 'L’explicitation de l’antécédent rend le français fluide, tout en préservant les deux traits du texte: elles n’entendent ou ne répondent pas et elles ne peuvent apporter aucun secours.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque, très chargée en participes, est répartie en deux phrases pour préserver la clarté sans perdre les rapports logiques. Les images de l’esprit éloigné de la vérité, de la bouche profane et des idoles sourdes sont conservées.
