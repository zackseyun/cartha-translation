base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/003.yaml
  text: What district[a], or city, or indeed what inhabited place at all, or what streets[b], were not filled with mourning and lamentation over them?
translation:
  language: fr
  text: Quel district, quelle ville, ou même quel lieu habité[a], quel qu’il soit, ou quelles rues n’étaient remplis de deuil[b] et de lamentations à leur sujet ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’adjectif grec traduit par « habité » est inhabituel dans ce témoin ; le sens paraît être celui de n’importe quel lieu où vivaient des gens.
    reason: textual_variant
  - marker: b
    text: Le mot traduit par « deuil » peut désigner plus précisément une manifestation rituelle de douleur, notamment le fait de se frapper la poitrine.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομός
  choice: district
  rationale: Dans l’usage hellénistique, νομός désigne couramment une circonscription administrative. « District » conserve ce sens sans imposer l’idée plus précise d’une province.
- source_word: πόλις
  choice: ville
  rationale: Terme civique ordinaire, rendu naturellement par « ville ».
- source_word: τὸ σύνολον
  choice: quel qu’il soit
  rationale: L’expression élargit ici la portée de la question à tout lieu habité sans exception; cette tournure française en restitue naturellement la force intensive.
- source_word: οἰκτιστὸς τόπος
  choice: lieu habité
  rationale: L’adjectif transmis est inhabituel, mais le contexte indique vraisemblablement un lieu où vivent des gens. La traduction reste proche de ce sens probable sans le préciser davantage.
- source_word: ἀγυιαί
  choice: rues
  rationale: Le mot désigne les voies publiques d’une localité; « rues » convient au contexte urbain.
- source_word: κοπετοῦ
  choice: deuil
  rationale: κόπετος évoque les manifestations de deuil, notamment les coups portés sur la poitrine. « Deuil » exprime naturellement le sens général, tandis que la note préserve la nuance concrète.
- source_word: γόων
  choice: lamentations
  rationale: Le terme souligne l’expression audible de la douleur. « Lamentations » maintient le registre digne et complète « deuil » sans se confondre avec lui.
- source_word: ἐπʼ αὐτοῖς
  choice: à leur sujet
  rationale: La préposition avec le datif indique ici les personnes qui sont l’objet ou l’occasion du deuil; la formulation française garde cette relation sans décider s’il s’agit strictement d’un deuil funèbre.
- source_word: οὐκ ἐνεπιπλῶντο
  choice: ne furent remplis
  rationale: Le passif exprime le fait que les différents lieux se remplissaient de manifestations de douleur. En français, l’accord au masculin pluriel avec la série coordonnée est grammatical et conserve la question rhétorique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure interrogative cumulative du grec est conservée, ainsi que la distinction entre le deuil manifesté et les lamentations audibles.
