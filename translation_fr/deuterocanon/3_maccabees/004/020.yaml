review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement λεγόντων (« affirmant »), μετὰ ἀποδείξεως (« preuves à l’appui »), χαρτηρία (« papyrus ») et ἐκλελοιπέναι (« étaient déjà épuisés »). Toutefois, le relatif grec ἐν οἷς, au pluriel, renvoie aux καλάμους (« roseaux »), et non au papyrus et aux roseaux pris ensemble.
  naturalness: Le français est clair, moderne et conserve convenablement le participe narratif dépendant du contexte précédent. La légère réorganisation proposée rend l’antécédent de « dont ils se servaient » sans ambiguïté tout en restant naturelle.
  terminology: « Papyrus » est historiquement précis. « Roseaux à écrire » est fidèle au grec; la note proposant « calames » est utile et appropriée.
  issues:
  - severity: medium
    issue: Portée ambiguë de « dont ils se servaient »
    rationale: Dans le grec, ἐν οἷς est pluriel et se rapporte aux seuls « roseaux à écrire » (τοὺς γραφικοὺς καλάμους). Placé après la coordination française, « dont ils se servaient » peut sembler qualifier aussi « le papyrus ». Une reformulation permet de préserver cette référence grammaticale.
  revised_text: affirmant, preuves à l’appui, que même le papyrus et les roseaux à écrire[a] dont ils se servaient étaient déjà épuisés.
  revised_footnotes:
  - marker: a
    text: Ou « les calames ». Le grec dit littéralement « les roseaux d’écriture ».
    reason: lexical_alternative
  revision_rationale: La révision supprime la virgule avant « dont ils se servaient », afin de rattacher plus naturellement la relative au groupe nominal immédiatement précédent, « les roseaux à écrire », conformément au pluriel grec ἐν οἷς. Le sens et le registre du projet sont autrement conservés.
