  text: asserting with proof that even the papyrus and the writing reeds they had been using had already run out[a].
translation:
  language: fr
  text: affirmant, preuves à l’appui, que même le papyrus et les roseaux à écrire[a] dont ils se servaient étaient déjà épuisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les calames ». Le grec dit littéralement « les roseaux d’écriture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγόντων
  choice: affirmant
  rationale: Le participe au génitif poursuit le compte rendu narratif et introduit une déclaration soutenue par des preuves ; « affirmant » rend mieux cette nuance que le simple « disant ».
- source_word: μετὰ ἀποδείξεως
  choice: preuves à l’appui
  rationale: Cette expression française naturelle rend l’idée de démonstration ou de preuve produite pour étayer l’affirmation.
- source_word: τὴν χαρτηρίαν
  choice: le papyrus
  rationale: Le terme désigne le matériau d’écriture en papyrus ; ce choix conserve la précision historique sans employer l’anachronique « papier ».
- source_word: τοὺς γραφικοὺς καλάμους
  choice: les roseaux à écrire
  rationale: Cette formulation reste proche du grec, littéralement « les roseaux d’écriture », tout en étant compréhensible en français moderne.
- source_word: ἐν οἷς ἐχρῶντο
  choice: dont ils se servaient
  rationale: L’imparfait exprime un usage continu dans le passé ; cette tournure française le restitue naturellement.
- source_word: ἐκλελοιπέναι
  choice: étaient déjà épuisés
  rationale: L’infinitif parfait exprime un épuisement déjà accompli au moment de l’affirmation ; « épuisés » convient aux fournitures mentionnées.
