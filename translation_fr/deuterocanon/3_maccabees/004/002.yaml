    rationale: Le composé exprime la plénitude ou l’intensité de la lamentation, non précisément le caractère « déchirant » du cri.
  - severity: low
    issue: « Venait d’être décrété » ajoute une valeur de passé récent.
    rationale: ἐπικριθεῖσαν est un participe aoriste passif et situe la décision comme antérieure à la lamentation, sans exiger l’idée française de « venir de ».
