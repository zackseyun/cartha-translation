  source_fidelity: 'Le sens fondamental est bien rendu : deuil inexprimable, clameur accompagnée de larmes, cœur consumé de gémissements et calamité officiellement prononcée contre les Juifs. Toutefois, « déchirant » ajoute une qualification absente du grec, et « venait d’être décrété » introduit une nuance de passé récent que le participe aoriste n’impose pas.'
  naturalness: 'La phrase actuelle comporte une rupture syntaxique après les deux-points : « le cœur embrasé ..., ils pleuraient ». Une subordonnée participiale (« tandis que, le cœur..., ils... ») permet de conserver l’image grecque tout en donnant une syntaxe française fluide.'
  terminology: « Deuil indicible », « gémissements », « désastre » et « décrété contre eux » conviennent au registre et au sens. « Immense clameur de lamentation » rend naturellement l’intensité rhétorique de πανόδυρτος sans ajouter l’idée spécifique de déchirement.
