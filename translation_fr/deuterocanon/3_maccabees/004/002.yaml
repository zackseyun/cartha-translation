translation_notes:
  register: Français moderne, digne et accessible, avec maintien de la rhétorique intense du grec. La syntaxe a été légèrement réorganisée pour rendre explicite que ce sont les Juifs qui se lamentent, tandis que l’image du cœur embrasé et le redoublement « contre toute attente… soudain » sont conservés.
