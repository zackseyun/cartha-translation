  text: But for the Jews there was unspeakable grief and an all-lamenting cry with tears, while their heart, burning on every side with groanings, bewailed the destruction unexpectedly and suddenly decreed against them.
translation:
  language: fr
  text: Mais pour les Juifs, c’était un deuil indicible et une immense clameur de lamentation, avec des larmes[a], tandis que, le cœur embrasé de toutes parts par les gémissements, ils déploraient le désastre qui avait été soudainement et contre toute attente décrété contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cri tout entier voué aux lamentations, avec des larmes ». Le grec emploie ici une expression rare, très rhétorique et condensée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλεκτον πένθος
  choice: un deuil indicible
  rationale: « Indicible » exprime ce qui ne peut être dit et conserve l’intensité rhétorique; « deuil » rend πένθος dans ce contexte de lamentation collective.
- source_word: πανόδυρτος ... βοή
  choice: un cri de lamentation déchirant
  rationale: Le rare composé πανόδυρτος intensifie la lamentation. Cette formulation naturelle en français garde la force affective sans recourir à un calque obscur.
- source_word: μετὰ δακρύων
  choice: mêlé de larmes
  rationale: Rend clairement l’accompagnement exprimé par μετά et évite la tournure moins idiomatique « avec des larmes ».
- source_word: στεναγμοῖς πεπυρωμένης πάντοθεν ... τῆς καρδίας
  choice: le cœur embrasé de toutes parts par les gémissements
  rationale: Conserve l’image ardente de πυρόω, la portée globale de πάντοθεν et le lien instrumental ou causal possible du datif στεναγμοῖς.
- source_word: ὀλοφυρομένων
  choice: ils pleuraient
  rationale: Le participe désigne une lamentation active. « Pleuraient » convient naturellement au français tout en restant distinct du simple fait de verser des larmes grâce au complément « le désastre ».
- source_word: ἀπροσδόκητον ἐξαίφνης
  choice: contre toute attente ... soudain
  rationale: Maintient les deux idées cumulées du grec — caractère imprévu et soudaineté — sans les fondre en une seule.
- source_word: ἐπικριθεῖσαν
  choice: venait ... d’être décrété contre eux
  rationale: « Décrété contre eux » préserve la nuance de décision officielle ou judiciaire; « venait d’être » intègre naturellement la soudaineté dans la phrase française.
- source_word: ὀλεθρίαν
  choice: le désastre
  rationale: Le substantif adjectival désigne ici une calamité destructrice. « Désastre » garde cette force tout en évitant de préciser indûment qu’il s’agit déjà d’une destruction accomplie.
