  text: Enraged[a], he ordered that these men too be treated in exactly the same way as those others, carefully, falling short in no way of their punishment.
translation:
  language: fr
  text: Dans sa fureur, il ordonna qu’on leur fasse subir, à eux aussi, exactement le même traitement qu’aux autres, en veillant à ce que leur châtiment ne soit en rien moindre que celui des autres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ordonna qu’on agisse avec eux aussi, avec soin, de la même manière qu’avec les autres, sans rester en rien en deçà du châtiment de ceux-ci ». La construction grecque avec τρόπων est inhabituelle, mais le sens général est que ce groupe devait subir le même châtiment que le précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διοργισθείς
  choice: Dans sa fureur
  rationale: Le participe aoriste exprime une colère intense. Cette tournure conserve cette force tout en s’intégrant naturellement au récit.
- source_word: προσέταξεν
  choice: il ordonna
  rationale: Rend directement l’acte de donner un ordre ayant autorité.
- source_word: καὶ τούτοις ὁμοῦ
  choice: à eux aussi
  rationale: Conserve la valeur additive de καί et renvoie naturellement au groupe présent.
- source_word: τὸν αὐτὸν τρόπων … ὡς ἐκείνοις ποιῆσαι
  choice: qu’on leur fasse subir […] exactement le même traitement qu’aux autres
  rationale: La construction grecque est formellement difficile, mais elle commande clairement un traitement identique à celui du groupe précédent. « Faire subir » convient au contexte punitif.
- source_word: ἐπιμελῶς
  choice: en veillant à ce que
  rationale: Dans ce contexte, l’adverbe décrit l’exécution soigneuse et rigoureuse de l’ordre; la tournure française le relie clairement à l’absence de tout allègement du châtiment.
- source_word: μὴ λειπομένους κατὰ μηδένα τρόπον
  choice: ne soit en rien moindre
  rationale: Exprime de façon idiomatique la double idée de ne pas rester en deçà et de ne le faire d’aucune manière.
- source_word: τῆς ἐκείνων τιμωρίας
  choice: que celui des autres
  rationale: τιμωρία désigne ici le châtiment; la comparaison explicite évite l’ambiguïté d’un pronom possessif français.
