  text: and with the dense planking above arranged so that[a], their eyes being darkened on every side, they might receive a transport fit for plotters throughout the whole voyage.
translation:
  language: fr
  text: On avait en outre disposé au-dessus d’eux un plafond de planches jointives afin que, plongés dans l’obscurité de tous côtés, ils soient emmenés pendant toute la traversée à la manière de conspirateurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils subissent pendant toute la traversée le traitement réservé à des hommes dangereux ». Le mot grec peut désigner des conspirateurs, des comploteurs ou, plus généralement, des hommes jugés dangereux.'
    reason: La construction ἀγωγὴν ἐπιβόλων et la portée exacte de ἐπιβόλων admettent plusieurs nuances.
lexical_decisions:
- source_word: καθύπερθε
  choice: au-dessus d’eux
  rationale: L’adverbe situe la structure qui recouvre les prisonniers; le complément « d’eux » est explicité naturellement en français d’après le contexte.
- source_word: πυκνῷ σανιδώματι
  choice: un plancher de planches serrées
  rationale: σανίδωμα désigne un assemblage ou revêtement de planches, tandis que πυκνός indique qu’elles sont rapprochées et ne laissent guère passer la lumière.
- source_word: διακειμένῳ
  choice: disposé
  rationale: Le participe décrit l’installation de ce plancher dans un but précis, exprimé par la proposition introduite par ὅπως.
- source_word: ὅπως πάντοθεν ἐσκοτισμένοι τοὺς ὀφθαλμούς
  choice: afin que, privés de lumière de tous côtés
  rationale: La formulation rend le but et la privation complète de lumière ou de vision sans imposer l’idée d’un aveuglement physique.
- source_word: ἀγωγήν
  choice: soient transportés
  rationale: Dans ce contexte maritime et carcéral, ἀγωγή désigne la manière dont ils sont emmenés; une tournure verbale est plus naturelle en français qu’un calque nominal.
- source_word: ἐπιβόλων
  choice: comme des conspirateurs
  rationale: Le terme est péjoratif et désigne des personnes qui trament un complot ou sont tenues pour dangereuses; « conspirateurs » conserve cette nuance.
- source_word: ἐν παντὶ τῷ κατάπλῳ
  choice: pendant toute la traversée
  rationale: κατάπλους désigne ici un trajet par mer; « traversée » rend ce sens de manière idiomatique.
