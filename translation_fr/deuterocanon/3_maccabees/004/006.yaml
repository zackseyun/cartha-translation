base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
translation:
  language: fr
  text: Quant aux jeunes femmes qui venaient d’entrer dans la chambre nuptiale pour partager la vie conjugale[a], ayant échangé la joie contre des lamentations, leur chevelure imprégnée de parfum souillée de poussière, elles étaient emmenées la tête découverte[b] et, toutes ensemble, entonnaient un chant funèbre au lieu des chants de noces, comme déchirées par des sévices étrangers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lit nuptial » pour « dans la chambre nuptiale » (γαμικὸν … παστόν).
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sans voile » ou « la tête découverte », ce qui constitue ici un signe d’humiliation publique.
    reason: cultural_note
  - marker: c
    text: Littéralement « par des sévices étrangers ». L’expression peut aussi évoquer des sévices associés à des personnes d’une autre nation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτι
  choice: venaient de
  rationale: Exprime naturellement en français la proximité immédiate de leur entrée dans la vie conjugale.
- source_word: πρὸς βίου κοινωνίαν
  choice: pour partager la vie conjugale
  rationale: Conserve l’idée de participation à une vie commune tout en rendant explicite le cadre matrimonial donné par le grec.
- source_word: γαμικὸν ... παστὸν
  choice: la chambre nuptiale
  rationale: Rend le sens usuel de παστός dans ce contexte sans réduire l’expression au seul lit conjugal.
- source_word: νεάνιδες
  choice: les jeunes femmes
  rationale: Traduction directe qui n’ajoute pas le terme interprétatif « jeunes mariées », le contexte nuptial étant déjà clair.
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  choice: elles reçurent les lamentations au lieu de la joie
  rationale: Préserve le renversement formulé par ἀντί et la nuance de ce qui leur échoit en partage.
- source_word: μυροβρεχῆ ... κόμην
  choice: les cheveux imprégnés de parfum
  rationale: Évoque clairement des cheveux imbibés d’huile parfumée sans imposer une substance précise.
- source_word: κόνει ... πεφυρμέναι
  choice: souillés de poussière
  rationale: Exprime le contraste humiliant entre la parure parfumée et la poussière qui la salit.
- source_word: ἀκαλύπτως
  choice: la tête découverte
  rationale: Rend clairement la manière dont elles sont emmenées et permet d’expliquer en note sa portée publique et humiliante.
- source_word: ἀγόμεναι
  choice: elles étaient emmenées
  rationale: Conserve la forme passive et la contrainte implicite sans amplifier le degré de violence.
- source_word: θρῆνον ... ἐξῆρχον
  choice: entonnaient un chant funèbre
  rationale: Le verbe indique qu’elles commencent ou conduisent la lamentation; « entonner » convient naturellement à un chant collectif.
- source_word: ὑμεναίων
  choice: chants de noces
  rationale: Désigne avec clarté les chants nuptiaux auxquels le chant funèbre est opposé.
- source_word: ὁμοθυμαδόν
  choice: toutes ensemble
  rationale: Restitue l’unité collective sans recourir à une tournure française archaïque.
- source_word: ὡς ἐσπαραγμέναι αἰκίαις ἀλλοεθνεῖσιν
  choice: comme déchirées par les mauvais traitements infligés par des étrangers
  rationale: Préserve l’image violente de σπαράσσω et rattache prudemment l’adjectif « étrangers » aux auteurs des sévices, tout en signalant l’ambiguïté en note.
