review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend bien la scène et ses oppositions. Une correction est toutefois indiquée pour la finale : αἰκίαις ἀλλοεθνεῖσιν qualifie directement les « sévices/cruautés » et ne doit pas être rendu de façon univoque comme des mauvais traitements « infligés par des étrangers ». « Sévices étrangers » conserve plus exactement la formulation et son ambiguïté relative.'
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « Ayant échangé la joie contre des lamentations » exprime plus idiomatiquement et plus fidèlement le participe μεταλαβοῦσαι que « elles reçurent les lamentations ». « Leur chevelure ... souillée de poussière » évite aussi une construction participiale un peu lourde.
  terminology: « Chambre nuptiale », « vie conjugale », « tête découverte », « chant funèbre » et « chants de noces » conviennent. « Sévices » rend αἰκίαις avec une force adéquate sans préciser indûment leur auteur.
  issues:
  - severity: medium
    issue: La traduction et la note c attribuent explicitement les sévices à des étrangers.
    rationale: Le grec porte littéralement αἰκίαις ἀλλοεθνεῖσιν, « par des sévices/cruautés étrangers », l’adjectif qualifiant αἰκίαις. La relation aux personnes d’une autre nation peut être comprise de diverses manières; il convient de ne pas la résoudre dans le texte.
  - severity: low
    issue: « elles reçurent les lamentations » affaiblit la construction active de μεταλαβοῦσαι.
    rationale: Le participe évoque le fait de prendre/embrasser des lamentations à la place de la joie. « Ayant échangé ... contre ... » rend clairement le contraste tout en restant naturel.
  revised_text: Quant aux jeunes femmes qui venaient d’entrer dans la chambre nuptiale pour partager la vie conjugale[a], ayant échangé la joie contre des lamentations, leur chevelure imprégnée de parfum souillée de poussière, elles étaient emmenées la tête découverte[b] et, toutes ensemble, entonnaient un chant funèbre au lieu des chants de noces, comme déchirées par des sévices étrangers[c].
