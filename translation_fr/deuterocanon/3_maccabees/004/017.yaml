base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/017.yaml
  text: But after the previously mentioned interval of time[a], the scribes reported to the king that it was no longer possible to carry out the registration of the Jews because of their countless multitude.
translation:
  language: fr
  text: Mais, après la période mentionnée plus haut, les scribes informèrent le roi qu’il n’était plus possible de procéder à l’enregistrement[a] des Juifs, en raison de leur multitude incalculable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au recensement ». Le grec ἀπογραφή peut désigner une inscription sur des listes, un enregistrement administratif ou un recensement.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mais, après
  rationale: μετά avec l’accusatif exprime la succession temporelle, tandis que δέ marque ici une transition narrative légèrement contrastive.
- source_word: τὸ προειρημένον τοῦ χρόνου διάστημα
  choice: la période mentionnée plus haut
  rationale: Cette formulation restitue le renvoi explicite à une durée déjà indiquée, dans un français naturel.
- source_word: προσηγγέλλον
  choice: informèrent
  rationale: Le verbe désigne une communication officielle adressée au roi. L’imparfait grec peut présenter le compte rendu dans son déroulement, mais le passé simple convient à la progression narrative française.
- source_word: οἱ γραμματεῖς
  choice: les scribes
  rationale: Le terme désigne ici des agents chargés des écrits et des registres; « scribes » reste direct, intelligible et historiquement approprié.
- source_word: μηκέτι ἰσχύειν
  choice: qu’il n’était plus possible
  rationale: L’expression indique l’impossibilité pratique de poursuivre l’opération, avec μηκέτι, « ne… plus ».
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  choice: de procéder au recensement des Juifs
  rationale: ἀπογραφή peut désigner une inscription, un enregistrement ou un recensement administratif; le contexte de dénombrement favorise « recensement », sans exclure l’idée d’inscription sur des listes.
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  choice: tant ils étaient nombreux
  rationale: Cette tournure française naturelle exprime la cause et conserve la force hyperbolique de la multitude dite littéralement « impossible à mesurer ».
