lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la succession narrative en français moderne.
- source_word: προσκαλεσάμενος
  choice: ayant fait appeler
  rationale: Rend l’antériorité du participe aoriste moyen et l’initiative du personnage, sans lourdeur excessive.
- source_word: Ἕρμωνα
  choice: Hermon
  rationale: Translittération française usuelle du nom propre grec.
- source_word: τὸν πρὸς τῇ τῶν ἐλεφάντων ἐπιμελείᾳ
  choice: le responsable des éléphants
  rationale: Expression concise et idiomatique qui conserve l’idée de charge administrative et de surveillance.
- source_word: βαρείᾳ μεμεστωμένος ὀργῇ
  choice: il était rempli d’une violente colère
  rationale: Le parfait exprime un état établi; « violente » communique ici l’intensité de βαρείᾳ plus naturellement que le calque « lourde ».
- source_word: καὶ χόλῳ
  choice: et d’une fureur
  rationale: Distingue χόλος de ὀργή tout en préservant le redoublement rhétorique des émotions hostiles.
- source_word: κατὰ πᾶν ἀμετά-
  choice: tout à fait implacable
  rationale: « Tout à fait » rend l’intensification de κατὰ πᾶν; « implacable » exprime naturellement, dans ce contexte, une fureur impossible à fléchir, tout en signalant en note que le mot source est tronqué.
