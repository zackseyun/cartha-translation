  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
translation:
  language: fr
  text: Ils ne passèrent pas tant les heures de la nuit à dormir qu’à imaginer toutes sortes de moqueries contre ces malheureux qui leur paraissaient pitoyables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre ceux qui leur semblaient de pauvres malheureux ». Le participe grec indique la manière dont ils les percevaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεχρίζαντο τὸν χρόνον τῆς νυκτός
  choice: passèrent les heures de la nuit
  rationale: Dans ce contexte, le verbe exprime l’emploi du temps nocturne. Cette tournure est naturelle en français et conserve le contraste entre les deux occupations.
- source_word: οὐχ οὕτως ... ὡς
  choice: ne ... pas tant ... que
  rationale: Cette construction française restitue directement la comparaison corrélative du grec sans transformer le contraste en opposition absolue.
- source_word: εἰς ὕπνον
  choice: à dormir
  rationale: L’infinitif français exprime naturellement l’activité à laquelle les heures de la nuit auraient pu être consacrées.
- source_word: παντοίως
  choice: toutes sortes de
  rationale: L’adverbe marque ici la diversité ou l’étendue des outrages imaginés; cette formulation s’accorde naturellement avec « moqueries ».
- source_word: μηχανᾶσθαι
  choice: imaginer
  rationale: Le verbe grec désigne le fait de concevoir ou de combiner intentionnellement quelque chose. « Imaginer » est clair et n’ajoute pas la nuance conspiratrice plus forte de « comploter ».
- source_word: τοῖς ταλαιπώροις δοκοῦσιν
  choice: contre ces malheureux qui leur paraissaient si pitoyables
  rationale: Le datif dépend de « moqueries » et désigne leurs cibles. « Paraissaient » maintient la nuance de perception portée par δοκοῦσιν, tandis que « pitoyables » exprime le regard méprisant ou objectivant sans en faire la voix du narrateur.
- source_word: ἐμπαιγμούς
  choice: moqueries
  rationale: Le nom peut désigner des actes de dérision, verbaux ou autres. Le pluriel français conserve la pluralité du grec et reste suffisamment large.
