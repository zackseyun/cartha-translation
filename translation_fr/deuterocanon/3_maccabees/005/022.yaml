  source_fidelity: La construction comparative « ne… pas tant… que… » rend correctement οὐχ οὕτως…ὡς, et « passèrent les heures de la nuit » exprime bien l’emploi du temps nocturne. « Imaginer toutes sortes de moqueries » restitue de façon fidèle μηχανᾶσθαι παντοίως ἐμπαιγμούς. « Contre » rend naturellement en français la cible hostile impliquée par les moqueries. Cependant, « si pitoyables » ajoute l’intensif « si », qui n’est pas exprimé par le grec.
