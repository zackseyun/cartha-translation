  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
translation:
  language: fr
  text: C’est pourquoi la ville est en proie à l’agitation à cause de cette attente[a] ; et, tandis que les rassemblements[b] s’y multiplient, elle court déjà souvent le risque d’être pillée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de cette anticipation » ; le terme grec désigne le fait d’attendre ce qui doit arriver et peut, dans ce contexte, suggérer une attente tendue.
    reason: lexical_alternative
  - marker: b
    text: Ou « les attroupements » ; le mot grec peut désigner des groupes qui se rassemblent et parfois des foules agitées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: C’est pourquoi
  rationale: Cette locution causale renvoie aux circonstances précédentes. « C’est pourquoi » est idiomatique en français et conserve ce lien logique.
- source_word: ἡ πόλις
  choice: la ville
  rationale: Le grec désigne formellement la ville, tout en incluant implicitement sa population. La traduction conserve cette image.
- source_word: διὰ τὴν προσδοκίαν
  choice: à cause de cette attente
  rationale: προσδοκία exprime l’attente ou l’anticipation. Le démonstratif français rattache naturellement cette attente à la situation évoquée dans le contexte.
- source_word: ὀχλεῖ
  choice: est en proie à l’agitation
  rationale: Dans ce contexte civique, le verbe évoque le trouble et l’effervescence collective. Cette formulation française est naturelle sans exagérer jusqu’à l’émeute.
- source_word: πληθύνουσα
  choice: se multiplient
  rationale: Le participe indique une augmentation. La tournure française fait des rassemblements le sujet grammatical tout en gardant la ville comme cadre, ce qui évite le calque peu naturel « la ville grandissant par des rassemblements ».
- source_word: συστροφαῖς
  choice: les rassemblements
  rationale: Le terme peut désigner des groupes qui se forment, des attroupements ou des foules. « Rassemblements » préserve ici une certaine neutralité quant à leur caractère.
- source_word: ἤδη
  choice: déjà
  rationale: L’adverbe présente le danger comme désormais actuel.
- source_word: κινδυνεύει
  choice: elle risque
  rationale: Rendu français direct et naturel du fait de courir un danger.
- source_word: πολλακὶς
  choice: souvent
  rationale: L’adverbe signifie « souvent » ou « à plusieurs reprises ». Son rattachement à l’idée de risque donne ici une formulation française plus naturelle que l’idée d’une ville déjà pillée plusieurs fois.
- source_word: διαρπασθῆναι
  choice: d’être pillée
  rationale: L’infinitif passif exprime la menace d’un pillage subi par la ville, sans qu’il soit nécessaire d’ajouter l’idée plus précise d’une destruction complète.
