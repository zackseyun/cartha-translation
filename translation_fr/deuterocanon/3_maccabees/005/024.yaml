  text: And the crowds throughout the city were gathering for the most pitiful spectacle[a], eagerly awaiting the morning.
translation:
  language: fr
  text: Les foules de toute la ville s’étaient rassemblées pour assister au spectacle le plus pitoyable[a] et attendaient le matin avec impatience.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour être témoins de la scène la plus lamentable ». Le grec θεωρία peut désigner soit l’action de regarder, soit le spectacle regardé.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πλήθη
  choice: les foules
  rationale: Le pluriel désigne de grands groupes de personnes. « Les foules » est naturel en français moderne et conserve l’idée d’une multitude assemblée.
- source_word: κατὰ τὴν πόλιν
  choice: de toute la ville
  rationale: Dans ce contexte, la tournure indique une répartition à travers la ville. « De toute la ville » s’intègre naturellement à « les foules » et exprime leur provenance étendue.
- source_word: συνῄθροιστο
  choice: s’étaient rassemblées
  rationale: Le plus-que-parfait rend l’état résultant d’un rassemblement déjà effectué, tandis que l’imparfait grec en souligne la durée; le contexte présente les foules réunies dans l’attente du matin.
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  choice: pour assister au spectacle le plus pitoyable
  rationale: θεωρία peut désigner soit l’action de regarder, soit ce qui est donné à voir. Cette formulation française garde la dimension d’une observation publique et le superlatif pathétique de οἰκτρότατην.
- source_word: προσδοκῶντα
  choice: attendaient
  rationale: Le participe exprime l’attente de ce qui doit survenir. Une proposition coordonnée est plus naturelle en français et conserve le rapport circonstanciel.
- source_word: τὴν πρωίαν
  choice: le matin
  rationale: Le terme désigne le matin sans imposer la précision plus étroite de « l’aube » ou du « point du jour ».
- source_word: μετὰ σπουδῆς
  choice: avec impatience
  rationale: La locution exprime l’empressement, le zèle ou la hâte. « Avec impatience » rend ici une attente empressée sans lui attribuer nécessairement une valeur positive.
