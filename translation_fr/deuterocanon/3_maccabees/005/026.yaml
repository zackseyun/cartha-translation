  yaml_path: translation/deuterocanon/3_maccabees/005/026.yaml
  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
translation:
  language: fr
  text: Mais les rayons du soleil ne se répandaient pas encore et, tandis que le roi recevait ses amis[a], Hermon s’avança et les appela à se mettre en route[b], indiquant que le roi était tout disposé et prêt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses courtisans ». Dans le langage des cours hellénistiques, les « amis » pouvaient constituer une catégorie officielle de compagnons du roi.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque signifie probablement qu’Hermon appela les personnes présentes à sortir ou à se mettre en route.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω δὲ ἡλίου βολαὶ κατεσπείροντο
  choice: Mais les rayons du soleil ne s’étaient pas encore répandus
  rationale: Le plus-que-parfait rend naturellement, dans ce récit au passé, l’action qui ne s’était pas encore produite; «rayons» exprime l’emploi imagé de βολαί, et «répandus» conserve l’idée de lumière semée ou dispersée.
- source_word: τοῦ βασιλέως τοὺς φίλους ἐκδεχόμενον
  choice: tandis que le roi recevait ses amis
  rationale: ἐκδέχομαι peut signifier attendre ou recevoir; avec τοὺς φίλους dans un cadre de cour, «recevait» convient à l’accueil des proches officiels du roi tout en préservant le sens littéral de φίλους.
- source_word: ὁ Ἕρμων παραστὰς
  choice: Hermon s’avança
  rationale: Le participe aoriste décrit l’entrée ou l’approche d’Hermon; «s’avança» est naturel et concis en français narratif.
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  choice: les appela à partir
  rationale: La formule indique qu’Hermon appelle les personnes présentes à sortir ou à se mettre en route. Le pronom «les», implicite en grec, clarifie le sens sans identifier davantage le groupe.
- source_word: ὑποδεικνὺς
  choice: indiquant
  rationale: Le participe introduit ce qu’Hermon fait comprendre pour motiver son appel.
- source_word: τὸ πρόθυμον τοῦ βασιλέως ἐν ἑτοίμῳ κεῖσθαι
  choice: que l’empressement du roi était à son comble
  rationale: πρόθυμον désigne l’ardeur ou l’empressement, tandis que l’expression ἐν ἑτοίμῳ κεῖσθαι indique qu’il est pleinement prêt ou disponible. La formulation française exprime naturellement une disposition pleinement mobilisée, sans transformer πρόθυμον en simple préparation matérielle.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative demeure proche du grec, tandis que «les appela à partir» évite le tour peu naturel «les convoqua au départ». Les deux notes signalent les nuances historiques et l’objet implicite de l’appel.
