  naturalness: Le français est globalement clair et de registre approprié. « Les rayons du soleil ne se répandaient pas encore » est plus fidèle à l’aspect verbal tout en restant naturel. « Le roi était tout disposé et prêt » restitue de façon idiomatique l’empressement et l’état de préparation sans suggérer que cet empressement aurait atteint un sommet.
  terminology: « Amis » conserve le terme grec tout en étant utilement éclairé par la note de cour. « Hermon » est une translittération cohérente. « Les appela à se mettre en route » exprime naturellement l’appel implicite à l’ἔξοδος, sans préciser indûment l’identité des personnes appelées.
