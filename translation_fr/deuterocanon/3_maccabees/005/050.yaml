  source_fidelity: La traduction rend correctement les secours antérieurs « du ciel », la prosternation unanime et la séparation des nourrissons d’avec les seins. Toutefois, « ayant aussi pris conscience » est un peu plus interprétatif et abstrait que συνιδόντες, qui peut être rendu directement par « voyant » dans ce contexte. L’explicitation « de leurs mères » est justifiée en français par le contexte de l’allaitement, mais le pluriel doit correspondre aux seins et aux nourrissons.
  naturalness: La phrase révisée reste fluide en français international moderne, conserve la coordination narrative et la virgule finale, requise parce que la phrase se poursuit au verset suivant. « Voyant aussi » est plus immédiat et naturel ici que « ayant aussi pris conscience ».
  terminology: « Secours », « du ciel », « face contre terre » et « nourrissons » sont appropriés. « Séparèrent les nourrissons des seins de leurs mères » conserve le verbe de séparation sans renforcer indûment le geste par « arrachèrent » ou « tirèrent ».
