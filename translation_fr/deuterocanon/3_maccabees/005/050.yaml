  text: Yet nevertheless[a], when they also saw the help from heaven that had come to them before, they all together threw themselves down face-first, and separated the infants from the breasts[b],
translation:
  language: fr
  text: Cependant, voyant aussi les secours qui leur étaient déjà venus du ciel[a], ils se jetèrent tous ensemble face contre terre et séparèrent les nourrissons des seins de leurs mères[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des interventions en leur faveur qui avaient eu lieu auparavant »; le grec évoque les aides ou les secours dont ils avaient déjà bénéficié.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « séparèrent les nourrissons des seins », c’est-à-dire qu’ils interrompirent leur allaitement.
    reason: literal_rendering
lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  choice: Cependant, ayant aussi
  rationale: Cette accumulation de connecteurs marque une transition appuyée. « Cependant » en restitue le contraste sans lourdeur, tandis que « aussi » rend καί.
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  choice: les secours qui leur étaient déjà venus
  rationale: ἀντιλήψεις désigne des aides ou interventions secourables; ἔμπροσθεν et γεγενημένας renvoient à des secours antérieurs dont ils avaient bénéficié. Cette formulation reste naturelle sans imposer le terme plus interprétatif de « délivrances ».
- source_word: ἐξ οὐρανοῦ
  choice: du ciel
  rationale: Rend littéralement l’origine céleste de l’aide et conserve l’allusion respectueuse à l’action divine sans ajouter un sujet divin absent du grec.
- source_word: συνιδόντες
  choice: ayant aussi pris conscience
  rationale: Le verbe peut exprimer une perception réfléchie ou une prise de conscience, et non seulement la vue physique. Le participe composé conserve son rapport antérieur à l’action principale.
- source_word: πρηνεῖς ὁμοθυμαδὸν ῥίψαντες ἑαυτούς
  choice: ils se jetèrent tous ensemble face contre terre
  rationale: « Se jetèrent » garde la vigueur du geste réflexif, « tous ensemble » exprime l’unité de l’action, et « face contre terre » rend clairement la posture πρηνεῖς.
- source_word: τὰ νήπια
  choice: les nourrissons
  rationale: Le contexte de l’allaitement montre qu’il s’agit de très jeunes enfants; « nourrissons » est précis et naturel en français.
- source_word: χωρίσαντες τῶν μαστῶν
  choice: retirèrent les nourrissons du sein de leur mère
  rationale: Le grec dit littéralement qu’ils séparèrent les nourrissons des seins. La formulation française explicite sobrement la relation maternelle nécessaire au sens et décrit naturellement l’interruption de l’allaitement.
theological_decisions:
- issue: Faut-il identifier explicitement Dieu comme l’auteur des secours célestes ?
  choice: du ciel
  alternative: de Dieu / du Seigneur qui est au ciel
  rationale: Le contexte implique une aide divine, mais le grec dit seulement « du ciel ». La traduction conserve cette formulation et n’ajoute aucun nom ou titre divin.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la virgule finale parce que le verset grec se poursuit syntaxiquement dans le suivant. Le tour très chargé des connecteurs grecs est allégé sans perdre la transition emphatique.
