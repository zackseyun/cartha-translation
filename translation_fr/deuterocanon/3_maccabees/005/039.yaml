  text: 'But the relatives who were reclining with him[a], marveling at his unstable state of mind[b], kept saying these things:'
translation:
  language: fr
  text: 'Mais les membres de sa famille qui partageaient son repas[a], étonnés de son état d’esprit changeant[b], disaient ceci :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui étaient à table avec lui ». Le grec évoque précisément l’usage antique selon lequel les convives mangeaient allongés à table.
    reason: cultural_note
  - marker: b
    text: Littéralement, « son esprit instable » ; l’expression décrit une disposition mentale changeante ou irrésolue.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανακείμενοι
  choice: qui étaient à table avec lui
  rationale: Le participe évoque le fait de partager un repas en étant allongé à table selon l’usage antique. Cette formulation française reste naturelle, tandis que la note conserve la précision culturelle.
- source_word: συγγενεῖς
  choice: les membres de sa famille
  rationale: Le terme désigne des personnes unies par la parenté. Cette expression est claire en français moderne et évite la tonalité vieillie de « parents » au sens large ou de « proches parents ».
- source_word: ἄσταθη
  choice: instable
  rationale: L’adjectif qualifie ici la pensée ou l’esprit comme changeant, irrésolu ou dépourvu de constance, sans préciser davantage la nature de cette instabilité.
- source_word: διάνοιαν
  choice: esprit
  rationale: Dans ce contexte, le nom désigne la disposition mentale. « Esprit » permet de conserver une formulation concise et proche du grec.
- source_word: θαυμάζοντες
  choice: étonnés
  rationale: Le participe exprime l’étonnement ou la stupéfaction. « Étonnés » demeure neutre et n’attribue pas à leur réaction une admiration positive.
- source_word: προεφέροντο
  choice: ne cessaient de dire
  rationale: L’imparfait grec présente une parole prolongée ou répétée. Cette tournure rend cet aspect tout en introduisant naturellement le discours qui suit.
- source_word: τάδε
  choice: ceci
  rationale: Le démonstratif annonce les paroles qui vont suivre. « Ceci » remplit naturellement cette fonction prospective en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure d’introduction au discours, tout en rendant naturellement l’imparfait duratif du grec. Les notes explicitent la posture antique du repas et la portée de l’expression mentale sans poser de diagnostic.
