translation:
  language: fr
  text: Hermon, le chef des éléphants, exécutait avec exactitude l’ordre reçu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « exécutait scrupuleusement l’ordre reçu » ou « exécutait dûment l’ordre reçu ». L’adverbe grec peut aussi évoquer une exécution ferme ou conforme à ce qui était requis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: le chef des éléphants
  rationale: Le composé désigne le responsable ou commandant chargé des éléphants. « Chef des éléphants » est clair, naturel et conserve la fonction précise.
- source_word: τὸ προσταγὲν
  choice: l’ordre reçu
  rationale: Le participe substantivé signifie littéralement « ce qui avait été commandé ». « L’ordre reçu » rend naturellement en français l’idée d’un ordre donné auparavant.
- source_word: ἀραρότως
  choice: fidèlement
  rationale: L’adverbe exprime ici une exécution ferme, exacte ou conforme à ce qui est requis. « Fidèlement » convient à l’accomplissement d’un ordre tout en laissant la note signaler les autres nuances possibles.
- source_word: συνετέλει
  choice: exécutait
  rationale: À l’imparfait, le verbe décrit l’accomplissement ou la mise à exécution de l’ordre. « Exécutait » respecte à la fois le contexte administratif et l’aspect verbal grec.
- source_word: Ἕρμων
  choice: Hermon
  rationale: Translittération française simple du nom grec Ἕρμων.
