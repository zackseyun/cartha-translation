  yaml_path: translation/deuterocanon/3_maccabees/005/006.yaml
  text: But the Jews[a], seeming to the nations to be deprived of every protection because of the necessity that surrounded them on every side with chains,
translation:
  language: fr
  text: Mais les Juifs, qui paraissaient aux yeux des nations privés de toute protection[a], à cause de la contrainte qui les encerclait de toutes parts, alors qu’ils étaient enchaînés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dépourvus de tout abri » (ou « de tout refuge »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκέπης
  choice: protection
  rationale: Le nom peut désigner un abri, une couverture ou, au sens figuré, une protection. Dans ce contexte de vulnérabilité apparente, « protection » rend naturellement le sens.
- source_word: ἔρημοι
  choice: privés de
  rationale: Construit avec le génitif πάσης σκέπης, le terme exprime l'absence ou le manque total; « privés de » convient au registre et au contexte.
- source_word: δοκοῦντες εἶναι
  choice: qui paraissaient
  rationale: La tournure indique une apparence ou une appréciation du point de vue des observateurs, sans affirmer que les Juifs étaient réellement sans protection.
- source_word: τοῖς ἔθνεσιν
  choice: aux yeux des nations
  rationale: Le datif marque ici le point de vue. « Aux yeux des nations » est idiomatique et évite d'imposer le sens confessionnel plus spécialisé de « païens ».
- source_word: ἀνάγκην
  choice: contrainte
  rationale: Dans le contexte de chaînes et d'encerclement, ἀνάγκη exprime moins une nécessité abstraite qu'une situation coercitive; « contrainte » conserve cette force.
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν
  choice: qui les enserrait de toutes parts dans les chaînes
  rationale: Cette formulation garde l'image spatiale d'un encerclement complet ainsi que la réalité de la captivité, dans un français naturel et soutenu.
- source_word: δεσμῶν
  choice: chaînes
  rationale: Le mot désigne des liens ou des chaînes; « chaînes » rend clairement l'image concrète de l'emprisonnement.
theological_decisions:
- issue: Protection réelle ou seulement apparente
  choice: Conserver explicitement le point de vue des nations par « paraissaient aux yeux des nations »
  alternative: « étaient privés de toute protection »
  rationale: Le grec δοκοῦντες εἶναι ne présente pas cette absence de protection comme un fait absolu; il maintient une tension entre l'apparence humaine et une éventuelle protection divine.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset étant syntaxiquement inachevé dans l'extrait fourni, la traduction conserve la virgule finale et la structure participiale qui appelle la suite.
