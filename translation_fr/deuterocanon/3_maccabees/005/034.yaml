  text: But each of the friends[a], looking grim, dismissed those who had gathered[b], each one to his own occupation.
translation:
  language: fr
  text: Mais chacun des amis, l’air sombre, se retirait discrètement[a] ; ils renvoyèrent les personnes rassemblées, chacune à son occupation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte une forme rare (ὑπεκρέων), et la transcription source est signalée comme présentant une légère anomalie. Le sens exact est incertain ; la traduction adopte ici, avec prudence, l’idée d’un retrait discret.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ καθ᾽ εἷς
  choice: chacun
  rationale: L’expression distributive désigne les membres du groupe pris individuellement.
- source_word: τῶν φίλων
  choice: des amis
  rationale: Le sens littéral est conservé; dans un cadre royal, le terme peut désigner des proches ou des dignitaires de la cour, sans que ce titre soit explicité ici.
- source_word: σκυθρωπῶς
  choice: l’air sombre
  rationale: Cette tournure française naturelle rend l’attitude visiblement morose ou renfrognée exprimée par l’adverbe.
- source_word: ὑπεκρέων
  choice: se retirait discrètement
  rationale: Cette forme rare paraît liée à ὑπεκρέω, «se retirer à la dérobée». La traduction maintient ce sens distinct plutôt que de lui attribuer la valeur de ἀπέλυαν.
- source_word: τοὺς συνθροισμένους
  choice: les gens rassemblés
  rationale: Le participe substantivé désigne les personnes qui avaient été réunies ou s’étaient rassemblées.
- source_word: ἀπέλυαν
  choice: ils renvoyaient
  rationale: Le verbe signifie ici congédier ou faire repartir. Le pluriel grec est préservé malgré la construction distributive au singulier qui précède.
- source_word: ἕκαστον ἐπὶ τὴν ἰδίαν ἀσχολίαν
  choice: chacun à ses propres occupations
  rationale: La formule exprime le retour individuel de chaque personne à ses activités ou affaires habituelles.
