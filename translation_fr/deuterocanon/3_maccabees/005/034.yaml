  naturalness: « Chacun des amis … tandis qu’ils » est lourd et l’antécédent de « ils » reste mal assuré en français. La révision garde les deux propositions distinctes, ce qui produit une phrase moderne et intelligible tout en laissant percevoir l’alternance singulier/pluriel du grec.
