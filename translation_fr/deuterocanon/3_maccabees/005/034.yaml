translation_notes:
  register: Français moderne, digne et narratif. La phrase conserve l’irrégularité de nombre du grec entre le sujet distributif singulier ὁ καθ᾽ εἷς et le verbe pluriel ἀπέλυαν, tout en la rendant intelligible par «tandis qu’ils». Aucun enjeu théologique particulier.
