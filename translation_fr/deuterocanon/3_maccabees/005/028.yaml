  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
translation:
  language: fr
  text: 'Mais c’était là l’action de Dieu, qui règne en maître sur tout : il avait mis l’oubli dans l’esprit de ceux qui avaient auparavant comploté contre lui[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom grec est au singulier : « contre lui ». Dans le contexte, on peut aussi comprendre : « contre eux », c’est-à-dire contre le peuple juif.'
    reason: Ambiguïté du référent de αὐτῷ.
lexical_decisions:
- source_word: ἐνέργεια
  choice: action
  rationale: Le nom désigne ici l’activité efficace de Dieu. « Action » est naturel en français et conserve l’idée d’une intervention opérante.
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  choice: de Dieu, qui règne en maître sur tout
  rationale: δεσποτεύω exprime l’exercice d’une souveraineté ou d’une maîtrise. Cette formulation rend la portée universelle de πάντα sans les connotations modernes trompeuses de « despote ».
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: de ceux qui avaient auparavant comploté contre lui
  rationale: μηχανάομαι évoque un dessein concerté, ici hostile. « Comploté » en restitue clairement le sens, tandis que « lui » respecte le singulier de αὐτῷ sans trancher silencieusement son référent.
- source_word: λήθην κατὰ διάνοιαν ἐντεθεικότος
  choice: il avait mis l’oubli dans l’esprit
  rationale: La proposition rend directement l’image de ἐντίθημι, « mettre dans », et situe l’oubli dans la pensée conformément à διάνοια. Elle conserve aussi l’action causale explicite attribuée à Dieu.
theological_decisions:
- issue: Causalité divine dans l’oubli des adversaires
  choice: Dieu met directement l’oubli dans leur esprit
  alternative: Dieu permet seulement leur oubli ou provoque indirectement leur confusion
  rationale: Le grec attribue explicitement l’événement à l’action de Dieu et emploie ἐντεθεικότος, « ayant mis dans ». La traduction ne réduit donc pas cette causalité à une simple permission.
- issue: Référent du pronom αὐτῷ
  choice: « contre lui », en conservant le pronom masculin singulier
  alternative: « contre eux » ou « contre son peuple », en comprenant le pronom comme une référence contextuelle collective aux Juifs
  rationale: La forme grecque est singulière, mais son antécédent peut être compris de plusieurs manières dans le contexte. Le texte principal en respecte la forme, et la note signale l’autre lecture sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. « C’était là » marque naturellement l’explication rétrospective; les deux-points clarifient le lien entre l’action de Dieu et l’oubli qu’il met dans les esprits.
