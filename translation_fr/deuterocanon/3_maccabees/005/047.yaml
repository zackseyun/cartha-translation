base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/047.yaml
  text: But he[a], filled with heavy wrath and impious in mind, rushed out with all his force along with the beasts[b], wanting with unfeeling heart and with the pupils of his eyes to look upon the painful and miserable destruction of those who had been marked out.
translation:
  language: fr
  text: Mais lui, rempli d’une violente colère et animé de pensées impies, s’élança de toute sa force avec les bêtes, voulant, le cœur insensible[b], contempler de ses propres yeux[a] la destruction douloureuse et misérable de ceux qui avaient été marqués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec les pupilles de ses yeux » ; l’expression souligne qu’il voulait voir lui-même, directement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le cœur non blessé » ou « non percé », c’est-à-dire probablement un cœur que la pitié ne pouvait toucher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργῇ βαρείᾳ γεμίσας
  choice: rempli d’une violente colère
  rationale: Littéralement « rempli d’une lourde colère » ; en français actuel, « violente » exprime naturellement l’intensité portée par βαρείᾳ.
- source_word: δυσσεβῆ φρένα
  choice: animé de pensées impies
  rationale: φρένα désigne ici la pensée ou la disposition intérieure, tandis que δυσσεβῆ conserve la dimension d’impiété envers Dieu.
- source_word: παντὶ τῷ βάρει
  choice: de toute sa force
  rationale: Dans ce mouvement impétueux, l’expression évoque toute la masse ou toute la puissance engagée, plutôt qu’un poids au sens strict.
- source_word: σὺν τοῖς θηρίοις
  choice: avec les bêtes
  rationale: « Bêtes » garde le caractère menaçant des animaux destinés à l’exécution.
- source_word: ἐξώρμησε
  choice: s’élança
  rationale: Le verbe exprime un départ soudain et vigoureux ; « s’élança » est naturel et dynamique.
- source_word: ἀτρώτῳ καρδίᾳ
  choice: le cœur insensible
  rationale: ἀτρώτῳ signifie littéralement « non blessé, non percé » ; dans ce contexte, le cœur reste inaccessible à la pitié. La note préserve l’image grecque.
- source_word: καὶ κόραις ὀφθαλμῶν
  choice: de ses propres yeux
  rationale: Littéralement « avec les pupilles de ses yeux » ; l’expression souligne qu’il veut assister personnellement et directement au spectacle.
- source_word: θεάσασθαι
  choice: contempler
  rationale: Le verbe indique un regard soutenu porté sur un spectacle ; « contempler » convient au registre narratif solennel.
- source_word: τὴν ἐπίπονον καὶ ταλαίπωρον ... καταστροφήν
  choice: la destruction douloureuse et misérable
  rationale: La double qualification grecque est maintenue sans atténuer la souffrance ni le caractère lamentable du désastre.
- source_word: τῶν προσεσημαμμένων
  choice: de ceux qui avaient été marqués
  rationale: Le parfait indique une marque ou une désignation déjà apposée ; la formulation conserve cette antériorité et l’ambiguïté sur sa nature exacte.
theological_decisions:
- issue: Portée morale et religieuse de δυσσεβῆ
  choice: pensées impies
  alternative: pensées mauvaises / esprit sans Dieu
  rationale: « Impies » préserve explicitement l’irrévérence religieuse du grec sans introduire de précision doctrinale étrangère au texte.
- issue: Sens figuré de ἀτρώτῳ καρδίᾳ
  choice: le cœur insensible
  alternative: le cœur non blessé / impassible
  rationale: Le contexte suggère un cœur que la pitié ne touche pas. La traduction rend ce sens probable, tandis que la note signale l’image littérale et maintient la tension lexicale.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste proche du mouvement de la phrase grecque, tout en évitant les calques peu naturels. Les deux images inhabituelles du grec sont rendues clairement dans le texte et documentées en notes.
