  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: fr
  text: 'Puis, après avoir fait venir Hermon sous la menace, il lui dit : « Combien de fois dois-je encore te donner des ordres au sujet de ces mêmes choses, le plus misérable des hommes ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ... Ἕρμωνα
  choice: Hermon
  rationale: Le nom propre est translittéré selon sa forme française usuelle, sans être traduit.
- source_word: προσκαλεσάμενος
  choice: il fit venir
  rationale: Le participe aoriste moyen indique qu’il convoque Hermon auprès de lui ; « fit venir » est naturel en français et conserve ce mouvement.
- source_word: μετὰ ἀπειλῆς
  choice: d’un ton menaçant
  rationale: Littéralement « avec menace » ; cette formulation française exprime naturellement la manière menaçante dont les paroles sont prononcées.
- source_word: Ποσάκις
  choice: Combien de fois
  rationale: Rend directement l’interrogation portant sur le nombre de répétitions et convient au ton de reproche.
- source_word: δεῖ σοι ... προστάττειν
  choice: faudra-t-il que je te donne des ordres
  rationale: δεῖ exprime la nécessité, tandis que προστάττειν désigne l’action d’ordonner ; le sujet « je » est fourni par le contexte du discours direct.
- source_word: περὶ τούτων αὐτῶν
  choice: au sujet de ces mêmes choses
  rationale: Cette traduction conserve l’insistance de αὐτῶν sur les choses déjà mentionnées sans préciser davantage leur nature.
- source_word: ἀθλιώτατε
  choice: misérable que tu es
  rationale: Le superlatif vocatif est une insulte forte. Cette tournure restitue l’intensité dans un français actuel et digne, sans lourdeur littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, soutenu mais accessible. La phrase garde le ton autoritaire et irrité du roi. La répétition de σοι dans le texte grec reçu paraît fautive ou redondante et n’est pas reproduite en français.
