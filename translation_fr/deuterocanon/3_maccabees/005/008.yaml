  text: to turn back the unholy plan against them[a], and to rescue them with a magnificent manifestation from the death ready at their feet.
translation:
  language: fr
  text: de renverser le projet impie dirigé contre eux et de les arracher, par une manifestation majestueuse[a], à la mort qui se tenait prête à leurs pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une apparition glorieuse » ou « une intervention majestueuse ». Le grec ἐπιφάνεια peut désigner une apparition frappante, souvent associée à un secours divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστρέψαι
  choice: renverser
  rationale: L’infinitif exprime ici l’inversion ou la mise en échec du projet hostile. « Renverser » est naturel et conserve la force du verbe grec.
- source_word: βουλὴν ἀνοσίαν
  choice: le projet impie
  rationale: βουλή désigne une intention arrêtée ou un projet, tandis que ἀνόσιος en souligne le caractère contraire à la sainteté et à la volonté divine. « Impie » préserve cette dimension religieuse.
- source_word: ῥύσασθαι
  choice: arracher
  rationale: Le verbe évoque une délivrance hors d’un danger immédiat. Avec « à la mort », « arracher » donne en français une expression vive et idiomatique.
- source_word: μεγαλομεροῦς ἐπιφανείας
  choice: par une manifestation majestueuse
  rationale: ἐπιφάνεια désigne une apparition ou manifestation frappante, ici associée au secours divin; μεγαλομερής en marque la grandeur. Cette formulation conserve le langage de manifestation sans préciser indûment sa forme.
- source_word: μόρου
  choice: la mort
  rationale: μόρος peut signifier le destin fatal ou la mort. Le contexte d’un péril imminent favorise le sens concret de « mort ».
- source_word: παρὰ πόδας ἐν ἑτοίμῳ
  choice: qui était là, toute prête à leurs pieds
  rationale: La formulation garde l’image spatiale vive du grec tout en exprimant clairement l’imminence du danger.
theological_decisions:
- issue: Nature de ἐπιφάνεια dans ce contexte
  choice: manifestation majestueuse
  alternative: apparition glorieuse; intervention majestueuse
  rationale: Le contexte attribue la délivrance à une action divine éclatante. « Manifestation » préserve l’idée d’une apparition notable sans en définir le mécanisme ni lui imposer un sens doctrinal technique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure infinitive du fragment source est conservée. L’image de la mort prête « à leurs pieds » est maintenue plutôt que remplacée par la seule notion abstraite d’imminence.
