  source_fidelity: 'Le sens général est fidèle : le projet impie est renversé et les personnes visées sont délivrées d’une mort imminente. « Renverser », « projet impie », « arracher » et « manifestation majestueuse » rendent convenablement les termes grecs. Toutefois, « qui était là » ajoute une indication déictique absente du grec, et l’imparfait « était » présente inutilement comme passée une menace que le grec décrit simplement comme prête et tout près.'
