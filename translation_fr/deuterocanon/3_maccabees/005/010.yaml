base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/010.yaml
  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
translation:
  language: fr
  text: Mais Hermon, après avoir fait boire les éléphants féroces[a], auxquels on avait fourni du vin en abondance et qui étaient saturés d’oliban[b], se présenta de bon matin à la cour pour en faire rapport au roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « impitoyables ». Le mot grec souligne leur caractère sans pitié.
    reason: lexical_alternative
  - marker: b
    text: L’« oliban » est la résine aromatique aussi couramment appelée « encens »; le grec désigne ici cette substance précise.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀνηλεῖς
  choice: féroces
  rationale: L’adjectif signifie littéralement « sans pitié » ou « impitoyables ». Appliqué à des éléphants destinés à tuer, « féroces » est naturel en français et exprime leur cruauté dangereuse sans abstraction excessive.
- source_word: ποτίσας
  choice: après avoir fait boire
  rationale: Le participe aoriste indique une action antérieure accomplie par Hermon et présente celui-ci comme celui qui donne à boire aux éléphants.
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  choice: une fois ceux-ci remplis par l’abondante provision de vin
  rationale: Cette formulation rend l’état résultant exprimé par le participe parfait et rattache clairement celui-ci aux éléphants. « Provision » conserve la nuance de fourniture ou de distribution portée par χορηγία.
- source_word: τοῦ λιβάνου μεμεστωμένους
  choice: saturés d’oliban
  rationale: λίβανος désigne précisément l’oliban, résine aromatique aussi appelée encens. « Saturés » rend l’idée d’être pleinement chargés ou imprégnés exprimée par μεστόω.
- source_word: ὄρθριος
  choice: de bon matin
  rationale: Expression française naturelle indiquant une arrivée tôt le matin, sans préciser indûment qu’il s’agit exactement de l’aube.
- source_word: αὐλήν
  choice: la cour
  rationale: Dans ce contexte royal, αὐλή peut désigner la cour ou l’enceinte palatiale. « La cour » préserve cette portée sans réduire le terme à une simple cour intérieure.
- source_word: προσαγγεῖλαι
  choice: pour en faire rapport
  rationale: L’infinitif exprime le but de la venue d’Hermon auprès du roi; « faire rapport » convient au cadre officiel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsme. La reprise « ceux-ci » lève l’ambiguïté grammaticale en indiquant que ce sont les éléphants, et non Hermon, qui sont remplis de vin et saturés d’oliban.
