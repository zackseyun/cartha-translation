  text: Then the king[a], having arranged the whole banquet according to the same rules, urged them to turn to rejoicing.
translation:
  language: fr
  text: Le roi, ayant organisé tout le banquet selon les mêmes règles[a], les encourageait à passer à la réjouissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les mêmes lois ». Le grec νόμοι peut désigner des lois, des règles ou des usages établis ; dans le contexte du banquet, le sens de règles pratiques est préférable.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ τοὺς αὐτοὺς νόμους
  choice: selon les mêmes règles
  rationale: κατά avec l’accusatif exprime ici la conformité. Dans le contexte de l’organisation d’un banquet, « règles » rend naturellement νόμοι sans donner au terme un sens excessivement juridique, tout en conservant αὐτούς (« mêmes »).
- source_word: συστησάμενος
  choice: ayant organisé
  rationale: Le participe aoriste indique une action préalable du roi, qui a mis en place ou ordonné le banquet. « Ayant organisé » est naturel en français moderne.
- source_word: πᾶν τὸ συμπόσιον
  choice: tout le banquet
  rationale: συμπόσιον désigne un banquet ou un festin, et πᾶν en souligne l’ensemble. « Tout le banquet » reste proche du grec et lisible.
- source_word: εἰς εὐφροσύνην τραπῆναι
  choice: à se livrer à la joie
  rationale: L’expression décrit le passage à un état de réjouissance. « Se livrer à la joie » restitue idiomatiquement ce mouvement sans imposer une nuance de simple divertissement.
- source_word: παρεκάλει
  choice: les encourageait
  rationale: παρακαλέω peut exprimer l’exhortation, l’encouragement ou l’invitation. Dans ce cadre festif, « encourageait » convient au ton; le pronom « les », implicite en grec, est nécessaire en français.
