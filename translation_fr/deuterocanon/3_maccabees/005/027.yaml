  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
translation:
  language: fr
  text: Mais, lorsqu’il eut reçu la nouvelle et fut frappé de stupeur devant cette issue contraire à la loi[a], entièrement dominé par son ignorance, il ne cessait de demander si ce qui avait été ordonné avait bien été mis à exécution pour lui avec empressement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant ce dénouement contraire à la loi » ou, plus littéralement, « devant cette sortie illégale ». Le mot grec peut désigner une sortie, un départ ou l’issue d’une affaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « si ce qui avait été consigné par écrit » ou « si le décret » avait été mis à exécution. Le grec peut aussi donner à ἔτι une nuance de « encore » ou de « déjà », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  choice: eut acquiescé
  rationale: Le participe aoriste moyen peut exprimer le fait d’accueillir, d’admettre ou d’approuver ce qui vient d’être dit. « Acquiescer » convient au contexte d’une réponse reconnue comme telle sans imposer l’idée d’une approbation officielle.
- source_word: καταπλαγέντος
  choice: fut frappé de stupeur
  rationale: Cette expression garde la force passive et le ton saisissant du verbe grec.
- source_word: ἀνόμῳ ἐξόδῳ
  choice: cette issue contraire à la loi
  rationale: ἔξοδος peut désigner une sortie, un dénouement ou une issue. Ici, « issue » rend naturellement le résultat surprenant, tandis que « contraire à la loi » conserve la portée de ἄνομος.
- source_word: κατὰ πάντα ἀγνωσίᾳ κεκρατημένος
  choice: entièrement dominé par son ignorance
  rationale: Le parfait passif de κρατέω avec le datif présente l’ignorance ou l’incompréhension comme exerçant une emprise complète sur le sujet.
- source_word: ἐπυνθάνετο
  choice: lui demanda à plusieurs reprises
  rationale: L’imparfait suggère une demande prolongée ou répétée; la formulation française en restitue l’aspect.
- source_word: τὸ διαγραμμένον
  choice: ce qui avait été prescrit
  rationale: Le participe parfait peut désigner ce qui a été consigné par écrit, fixé ou ordonné. « Prescrit » garde cette portée administrative sans préciser indûment la forme du document.
- source_word: ἔτι
  choice: déjà
  rationale: Dans une question portant sur l’accomplissement d’un ordre, ἔτι peut avoir une valeur temporelle proche de « déjà / à ce stade ». La note signale l’autre lecture possible.
- source_word: αὐτῷ
  choice: par lui
  rationale: Le datif peut marquer l’agent avec le parfait passif τετέλεσται. Le pronom renvoie probablement à « l’autre », mais son référent demeure moins explicite en grec qu’en français.
- source_word: μετὰ σπουδῆς
  choice: avec empressement
  rationale: σπουδή associe diligence, sérieux et hâte. « Avec empressement » convient à l’exécution pressante d’un ordre.
- source_word: τετέλεσται
  choice: avait été exécuté
  rationale: Le parfait passif exprime l’accomplissement d’une prescription. « Exécuté » est ici employé au sens de mettre un ordre à exécution.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « L’autre » restitue le changement de sujet suggéré par le génitif absolu grec; « le roi » explicite le sujet principal fourni par le contexte immédiat. La phrase conserve en note les ambiguïtés de ἔξοδος, ἔτι et αὐτῷ.
