lexical_decisions:
- source_word: τούτων
  choice: leur
  rationale: Le génitif démonstratif renvoie aux personnes mentionnées auparavant; le possessif est naturel en français.
- source_word: μὲν οὖν
  choice: Ainsi donc
  rationale: Cette tournure assure la transition et marque la conséquence ou la reprise du récit sans surcharger la phrase.
- source_word: λιτανία
  choice: supplication
  rationale: Le terme désigne une prière instante, une demande pressante; « supplication » en conserve la force pétitionnaire.
- source_word: ἐκτενῶς
  choice: avec ferveur
  rationale: L’adverbe peut exprimer l’intensité ou la durée. « Avec ferveur » rend naturellement ici l’intensité de la supplication, tout en signalant l’autre nuance possible en note.
- source_word: ἀνέβαινεν
  choice: montait
  rationale: L’imparfait grec présente une action en cours; l’imparfait français la restitue simplement et naturellement.
- source_word: εἰς τὸν οὐρανόν
  choice: jusqu’au ciel
  rationale: Dans le contexte d’une prière qui monte, « jusqu’au ciel » exprime idiomatiquement la direction et la destination.
