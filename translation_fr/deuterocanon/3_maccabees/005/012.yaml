  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
translation:
  language: fr
  text: Et, par l’action très douce et profonde du Souverain[a][b], il fut saisi, ayant été grandement mis en échec dans son dessein contraire à la loi et fortement déçu dans sa résolution inébranlable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Maître » ; le grec emploie δεσπότης, titre qui souligne l’autorité absolue.
    reason: alternative_reading
  - marker: b
    text: 'L’expression grecque est inhabituelle : elle décrit littéralement l’action du Souverain comme « très douce et profonde ». « Fut saisi » peut aussi se comprendre comme « fut retenu » ou « fut maîtrisé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστῳ καὶ βαθεῖ
  choice: extrêmement douce et profonde
  rationale: Le superlatif de ἡδύς exprime ici une douceur ou un caractère très agréable, tandis que βαθύς conserve l’image inhabituelle de la profondeur. Les deux adjectifs sont rattachés à ἐνεργείᾳ sans ajouter un substantif tel que « stupeur », absent du grec.
- source_word: κατεσχέθη
  choice: fut saisi
  rationale: Le passif de κατέχω peut évoquer le fait d’être saisi, retenu ou maîtrisé. « Fut saisi » garde la force de l’intervention tout en laissant ouverte la nature précise de l’état produit.
- source_word: ἐνεργείᾳ
  choice: par l’action
  rationale: Le datif indique le moyen; ἐνέργεια désigne une action efficace ou une puissance à l’œuvre. « Action » est naturel et non technique.
- source_word: δεσπότου
  choice: du Souverain
  rationale: δεσπότης souligne l’autorité absolue. « Souverain » convient comme titre divin et le distingue de κύριος, habituellement rendu par « Seigneur ».
- source_word: ἀθέσμου προθέσεως
  choice: son dessein contraire à la loi
  rationale: ἀθέσμος désigne ce qui transgresse la loi ou l’ordre établi; cette formulation préserve le sens juridique et moral sans le réduire à la seule impiété.
- source_word: πολὺ διεσφαλμένος
  choice: fut largement mis en échec
  rationale: διασφάλλω exprime ici l’échec ou le détournement du but poursuivi. La tournure française explicite naturellement que son dessein n’a pas abouti.
- source_word: ἀμεταθέτου λογισμοῦ
  choice: sa résolution inflexible
  rationale: λογισμός peut signifier pensée, raisonnement ou projet; dans ce parallèle avec πρόθεσις, « résolution » rend l’intention arrêtée, et « inflexible » la qualité de ce qui ne se laisse pas déplacer.
- source_word: μεγάλως διεψευσμένος
  choice: profondément déçue
  rationale: Le passif de διαψεύδω peut indiquer une attente déçue ou démentie. La formulation conserve l’idée que les événements ont contredit sa résolution avec force.
theological_decisions:
- issue: Titre divin δεσπότης
  choice: le Souverain
  alternative: le Maître
  rationale: Le choix fait ressortir l’autorité absolue attribuée à Dieu et maintient la distinction lexicale avec κύριος, sans introduire une formule confessionnelle particulière.
- issue: Nature de l’intervention divine
  choice: action extrêmement douce et profonde
  alternative: stupeur très agréable et profonde
  rationale: Le grec qualifie explicitement ἐνέργεια, « action », et ne contient aucun mot signifiant « stupeur » ou « sommeil ». La traduction n’explicite donc pas l’effet au-delà de ce que dit la source, malgré l’étrangeté volontaire de l’image.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La ponctuation en deux-points rend lisible la conséquence de l’intervention divine. L’image grecque inhabituelle est conservée sans importer la « stupeur » proposée par la couche anglaise.
