  text: And in addition[a], the attendants, going out at evening, bound the hands of those who were suffering, and contrived the rest of the nighttime security concerning them[b], thinking that they would together bring the race to the end of destruction.
translation:
  language: fr
  text: En outre, les préposés sortirent au soir, lièrent les mains de ceux qui souffraient et prirent les autres dispositions nécessaires pour les garder sous surveillance pendant la nuit, pensant mener ainsi le peuple tout entier à l’aboutissement de sa ruine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la fin de la phrase dit : « pensant recevoir ensemble pour le peuple l’aboutissement de la ruine ». La construction grecque est condensée ; elle exprime l’issue destructrice que les préposés espéraient obtenir pour le peuple pris dans son ensemble.'
    reason: La construction λήμψεσθαι ... πέρας τῆς ὀλεθρίας et la portée de ὁμοῦ sont syntaxiquement condensées et admettent des nuances d’analyse.
lexical_decisions:
- source_word: οἵ τε πρὸς τούτοις λειτουργοὶ
  choice: En outre, les agents chargés de cette tâche
  rationale: λειτουργοί désigne ici des exécutants au service de l’autorité, non des ministres du culte. πρὸς τούτοις est compris dans son contexte comme les rattachant à la tâche en question, tandis que τε assure la continuité du récit.
- source_word: κατὰ τὴν ἑσπέραν ἐξιόντες
  choice: sortirent à la tombée du soir
  rationale: La tournure restitue le déplacement exprimé par ἐξιόντες et situe naturellement l’action au soir.
- source_word: τὰς τῶν ταλαιπωρουμένων ... χεῖρας
  choice: les mains de ces malheureux
  rationale: Le participe substantivé désigne les personnes alors plongées dans la détresse. « Ces malheureux » est concis, digne et renvoie clairement aux prisonniers du contexte.
- source_word: ἐδέσμευον
  choice: lièrent
  rationale: Le verbe exprime directement l’action d’attacher ou de ligoter.
- source_word: τὴν τε λοιπὴν ἐμηχανῶντο περὶ αὐτοὺς ἀσφάλειαν ἔννυχον
  choice: organisèrent les autres mesures nécessaires pour les garder en sécurité pendant la nuit
  rationale: La phrase grecque est condensée. Elle évoque des dispositions supplémentaires destinées à maintenir les prisonniers sous bonne garde durant la nuit; « organisèrent » conserve l’idée de préparation délibérée sans produire une formulation française opaque.
- source_word: ὁμοῦ
  choice: tout entier ... ainsi
  rationale: Dans cette construction difficile, l’adverbe souligne le sort collectif et simultané du peuple. La formulation française rattache clairement cette totalité au groupe visé.
- source_word: τὸ φύλον
  choice: le peuple
  rationale: Le terme collectif vise ici le peuple juif dans son ensemble. « Peuple » est plus naturel et moins chargé de connotations modernes trompeuses que « race », tout en conservant la portée ethnique et collective.
- source_word: λήμψεσθαι ... πέρας τῆς ὀλεθρίας
  choice: atteindrait ... le terme de sa destruction
  rationale: La construction exprime l’aboutissement attendu de la destruction. « Atteindre le terme » conserve l’image grecque de πέρας sans transformer silencieusement la phrase en simple mention d’une « destruction complète ».
theological_decisions:
- issue: Portée collective de τὸ φύλον
  choice: le peuple tout entier
  alternative: la race entière / la nation entière
  rationale: Le passage vise collectivement le peuple juif. « Peuple » transmet cette référence sans introduire les ambiguïtés contemporaines de « race » ni les connotations politiques possibles de « nation ».
- issue: Sens de λήμψεσθαι ... πέρας τῆς ὀλεθρίας
  choice: atteindrait ainsi le terme de sa destruction
  alternative: subirait sa destruction complète
  rationale: Le grec conserve une image d’aboutissement ou de terme. La traduction choisie maintient cette formulation tendue et quelque peu inhabituelle au lieu de la résoudre entièrement en une paraphrase.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset emploie un vocabulaire administratif plutôt que cultuel et rend les deux expressions grecques les plus condensées dans un français intelligible, tout en signalant l’ambiguïté de la clause finale.
