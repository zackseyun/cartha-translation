revisions:
- from: En outre, les agents chargés de cette tâche sortirent à la tombée du soir, lièrent les mains de ces malheureux et organisèrent les autres mesures nécessaires pour les garder en sécurité pendant la nuit. Ils pensaient que le peuple tout entier atteindrait ainsi le terme de sa destruction[a].
  to: En outre, les préposés sortirent au soir, lièrent les mains de ceux qui souffraient et prirent les autres dispositions nécessaires pour les garder sous surveillance pendant la nuit, pensant mener ainsi le peuple tout entier à l’aboutissement de sa ruine[a].
  rationale: La révision corrige l’inversion contextuelle créée par « garder en sécurité », rétablit les préposés comme sujets de leur projet destructeur, et rend explicitement la portée collective de ὁμοῦ et τὸ φύλον. Elle conserve un français moderne, sobre et narratif, ainsi que l’ambiguïté syntaxique de la clause finale au moyen d’une note.
