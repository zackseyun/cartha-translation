  text: When the king considered this[a], and turned to drinking, he ordered those who had come to the banquet to recline around him.
translation:
  language: fr
  text: Après y avoir réfléchi, le roi se tourna vers la boisson et ordonna à ceux qui étaient venus au banquet de s’allonger à table autour de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière expression est difficile sur les plans textuel et syntaxique en grec. Elle semble indiquer que les invités devaient prendre place, en position allongée, par rapport au roi. On pourrait aussi traduire : « près de lui » ou « à une place située au-dessus de la sienne » à table.'
    reason: textual_variant
lexical_decisions:
- source_word: λογισάμενος
  choice: Après y avoir réfléchi
  rationale: Le participe aoriste moyen de λογίζομαι exprime ici une réflexion préalable sur ce qui vient d’être rapporté. Cette formulation naturelle conserve l’enchaînement temporel sans préciser davantage l’objet implicite.
- source_word: τραπεὶς εἰς τὸν πότον
  choice: se tourna vers la boisson
  rationale: La tournure marque le passage à l’activité de boire. « La boisson » rend πότος sans limiter explicitement le sens au vin ni accentuer indûment l’idée d’ivresse.
- source_word: παραγεγονότας
  choice: ceux qui étaient venus
  rationale: Le participe parfait garde à la fois l’idée de leur arrivée et celle de leur présence actuelle.
- source_word: ἐπὶ τὴν συμποσίαν
  choice: au banquet
  rationale: συμποσία désigne une réunion festive où l’on boit. « Banquet » est clair en français moderne et convient au contexte.
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  choice: de s’allonger à table autour de lui
  rationale: Le texte transmis est difficile, mais renvoie vraisemblablement à la posture allongée des convives et à leur position par rapport au roi. « À table » explicite l’usage antique sans imposer une reconstruction technique.
