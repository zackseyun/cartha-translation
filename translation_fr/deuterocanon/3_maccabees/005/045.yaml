  text: But the elephant-master[a], after bringing the beasts almost—as he had said—into a frenzied state by very fragrant drinks, with wine mixed with frankincense, and making them terrifyingly adorned with equipment[c][b],
translation:
  language: fr
  text: Mais le responsable des éléphants, après avoir presque amené[a] les bêtes, comme il l’avait dit, à un état de frénésie au moyen de breuvages très parfumés — du vin mêlé d’encens[b] —, et les avoir parées de façon terrifiante avec leur équipement[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme grecque ἀγιοχὼς est difficile sur les plans textuel et lexical dans ce témoin ; « après avoir amené » exprime le sens contextuel probable de l’action préparatoire du responsable envers les bêtes.
    reason: textual_variant
  - marker: b
    text: 'Ou : « du vin parfumé à l’encens ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « avec leurs ornements » ou « avec leur harnachement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: le responsable des éléphants
  rationale: Rend clairement la fonction de la personne chargée des éléphants, sans créer en français un titre technique peu naturel.
- source_word: τὰ θηρία
  choice: les bêtes
  rationale: Conserve le ton élevé et menaçant de θηρία tout en restant naturel en français moderne.
- source_word: σχεδόν
  choice: presque
  rationale: Équivalent adverbial direct, qui maintient la réserve exprimée par le grec.
- source_word: εἰς κατάστεμα μανιῶδες
  choice: à un état de frénésie
  rationale: Reproduit l’idée d’une condition caractérisée par la folie ou l’excitation violente, sans la surinterpréter.
- source_word: ἀγιοχὼς
  choice: après avoir amené
  rationale: La forme transmise est difficile; ce rendu exprime prudemment l’action préparatoire que le contexte attribue au responsable envers les éléphants.
- source_word: εὐωδεστάτοις πόμασιν
  choice: au moyen de breuvages très parfumés
  rationale: « Breuvages » convient au registre narratif, tandis que « très parfumés » préserve l’intensité et la dimension olfactive du superlatif.
- source_word: οἴνῳ λελιβανωμένῳ
  choice: du vin mêlé d’encens
  rationale: Rendu concret du vin traité avec du λίβανος, vraisemblablement de l’encens ou de l’oliban; une autre nuance possible est signalée en note.
- source_word: φοβερῶς κεκοσμημένα
  choice: les avoir parées de façon terrifiante
  rationale: Préserve à la fois l’idée d’ornement ou d’agencement de κοσμέω et l’effet propre à inspirer la peur exprimé par φοβερῶς.
- source_word: κατασκευαῖς
  choice: avec leur équipement
  rationale: Terme assez large pour désigner l’appareillage placé sur les éléphants sans préciser abusivement sa nature.
