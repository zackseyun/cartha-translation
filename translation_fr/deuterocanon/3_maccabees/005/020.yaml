  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
translation:
  language: fr
  text: 'Possédé d’une cruauté pire que celle de Phalaris[a], il dit : « Qu’ils soient reconnaissants pour le sommeil d’aujourd’hui[b] ; mais, une fois qu’ils auront été gardés en vie jusqu’au jour qui vient, prépare les éléphants de la même manière pour la destruction des Juifs sans loi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phalaris était, dans la tradition grecque, un tyran célèbre pour sa cruauté. La comparaison souligne ici l’extrême brutalité du roi.
    reason: cultural_note
  - marker: b
    text: L’expression grecque signifie qu’ils devaient considérer le sommeil qui leur était accordé aujourd’hui comme une faveur et en être reconnaissants. Elle ne signifie pas simplement qu’ils dormaient ce jour-là.
    reason: lexical_alternative
  - marker: c
    text: « Sans loi » traduit une épithète hostile placée dans la bouche du persécuteur ; on pourrait aussi traduire par « illégitimes » ou « impies ».
    reason: alternative_reading
lexical_decisions:
- source_word: τὴν ὠμότητα χείρονα Φαλάριδος ἐσχηκὼς
  choice: Animé d’une sauvagerie pire que celle de Phalaris
  rationale: La tournure rend l’état durable exprimé par le participe parfait ἐσχηκώς et conserve la force de ὠμότης ainsi que la comparaison culturelle avec Phalaris.
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  choice: qu’ils devaient savoir gré au sommeil de ce jour
  rationale: « Savoir gré à » restitue l’idiome χάριν ἔχειν avec son complément au datif, sans ajouter explicitement à qui appartient le sommeil ni résoudre entièrement la formulation grecque condensée.
- source_word: συντηρηθέντας
  choice: puisqu’ils ont été gardés en vie
  rationale: Dans le contexte d’une mise à mort différée, συντηρέω signifie ici préserver ou maintenir en vie; la tournure causale rend naturellement le participe circonstanciel en français.
- source_word: εἰς τὴν ὑποτέλλουσαν ἡμέραν
  choice: jusqu’au jour qui va poindre
  rationale: ὑποτέλλουσαν évoque le jour qui approche ou commence à poindre; cette traduction garde l’image temporelle sans réduire l’expression au simple « lendemain ».
- source_word: κατὰ τὸ ὅμοιον ἑτοίμασον τοὺς ἐλέφαντας
  choice: prépare les éléphants de la même manière
  rationale: L’impératif singulier est conservé, et « de la même manière » renvoie à la préparation antérieure des éléphants.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: afin d’anéantir
  rationale: La construction finale et le nom ἀφανισμός expriment la suppression totale; le verbe « anéantir » donne à la menace sa pleine force en français naturel.
- source_word: τῶν ἀθεμίτων Ἰουδαίων
  choice: ces Juifs impies
  rationale: ἀθέμιτος qualifie ce qui enfreint la loi divine, humaine ou coutumière. « Impies » convient à l’injure hostile du locuteur, tandis que « ces » marque naturellement en français le groupe visé sans ajouter une approbation narrative.
theological_decisions:
- issue: Épithète hostile appliquée aux Juifs
  choice: ces Juifs impies
  alternative: ces Juifs sans loi / ces Juifs qui méprisent la loi
  rationale: L’injure ἀθέμιτοι appartient aux paroles du persécuteur. Elle doit rester perceptible sans être présentée comme le jugement du narrateur; la mise en discours direct et la note le précisent.
- issue: Référent du « sommeil de ce jour »
  choice: conserver la formulation « sommeil de ce jour »
  alternative: le répit que leur accordait le sommeil de ce jour
  rationale: Le grec relie la gratitude au sommeil, mais n’explicite pas entièrement le rapport entre ce sommeil et la survie des condamnés. La traduction évite d’ajouter un « répit » absent du lexique tout en préservant la tension du passage.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le passage au discours direct clarifie naturellement l’impératif singulier grec. La violence et l’épithète hostile sont conservées comme éléments du discours du roi, sans les cautionner.
