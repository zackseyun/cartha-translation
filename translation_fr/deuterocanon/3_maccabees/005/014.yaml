  text: And when it was already nearly the middle of the sixth hour[a], the man appointed over the summonses, seeing those who had been summoned assembled in a mass, came up and signaled to the king.
translation:
  language: fr
  text: Quand la sixième heure était déjà presque à mi-parcours[a], l’homme chargé des convocations vit que les personnes convoquées étaient rassemblées en masse ; il s’approcha du roi et lui fit signe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « alors qu’on était déjà presque au milieu de la sixième heure ». Selon le décompte antique, cela se situe approximativement vers midi.'
    reason: cultural_note
lexical_decisions:
- source_word: μεσούσης δὲ ἤδη ἑκάτης ὥρας σχεδόν
  choice: Quand la sixième heure était déjà presque à mi-parcours
  rationale: Cette formulation conserve le système horaire antique et rend à la fois l’idée du milieu de l’heure, ἤδη (« déjà ») et σχεδόν (« presque »), sans convertir silencieusement l’indication en heure moderne.
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  choice: l’homme chargé des convocations
  rationale: τεταγμένος désigne une personne affectée ou préposée à une tâche ; « chargé des convocations » restitue le caractère administratif de κλήσεις sans préciser indûment qu’il s’agit d’un recensement ou d’un appel nominal.
- source_word: ἀθρόους τοὺς κλητούς
  choice: les personnes convoquées étaient rassemblées en masse
  rationale: κλητούς désigne ici ceux qui ont été convoqués par autorité, tandis que ἀθρόους souligne leur regroupement compact et collectif.
- source_word: προσελθὼν
  choice: il s’approcha du roi
  rationale: Le participe exprime une action préalable à celle du verbe principal ; une proposition coordonnée est naturelle en français.
- source_word: ἔνευσε ... τὸν βασιλέα
  choice: lui fit signe
  rationale: Le verbe indique un signe, éventuellement un mouvement de tête, sans permettre d’en déterminer précisément la forme ; « fit signe » préserve cette indétermination.
