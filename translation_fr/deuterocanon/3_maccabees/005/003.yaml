  text: So the one who had been given these orders turned to feasting[a], gathering those of his friends and of the army who were most hostile toward the Jews.
translation:
  language: fr
  text: Celui qui avait reçu ces ordres se tourna donc vers le banquet, après avoir rassemblé ceux de ses amis et de l’armée qui étaient les plus hostiles aux Juifs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὲν τάδε προσταχθεὶς
  choice: Celui qui avait reçu ces ordres
  rationale: L’expression articulaire désigne l’homme auquel les ordres précédents viennent d’être donnés. Cette formulation française naturelle conserve le sens passif et le renvoi au contexte.
- source_word: ἐτρέπετο
  choice: se tourna vers
  rationale: L’imparfait moyen exprime le fait de s’orienter ou de se consacrer à une activité. « Se tourna vers » préserve cette image sans alourdir la phrase.
- source_word: τὴν εὐωχίαν
  choice: les réjouissances
  rationale: Le nom évoque un banquet festif, avec nourriture et boisson. « Les réjouissances » convient au mouvement vers cette activité tout en gardant sa dimension conviviale.
- source_word: συναγαγὼν
  choice: après avoir rassemblé
  rationale: Le participe aoriste indique ici une action liée à l’action principale et vraisemblablement antérieure dans son déroulement. Cette tournure rend clairement la relation en français.
- source_word: τοὺς μάλιστα τῶν φίλων καὶ τῆς στρατιᾶς
  choice: ceux de ses amis et de l’armée qui étaient les plus
  rationale: La construction désigne une sélection parmi deux groupes, les amis et l’armée, déterminée par la disposition hostile exprimée ensuite.
- source_word: ἀπεχθῶς ἔχοντας πρὸς τοὺς Ἰουδαίους
  choice: hostiles aux Juifs
  rationale: L’idiome exprime une disposition d’inimitié. « Hostiles aux Juifs » est direct, actuel et n’intensifie pas indûment le grec.
