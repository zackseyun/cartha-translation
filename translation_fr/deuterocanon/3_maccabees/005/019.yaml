  text: But when the one who had pointed out that during the night the order had been carried through to completion[a], and their friends had borne witness to it,
translation:
  language: fr
  text: Mais lorsque celui qui avait indiqué que, pendant la nuit, l’ordre avait été exécuté jusqu’à son terme[a], et que leurs amis en avaient également témoigné,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le texte grec de Swete, la forme verbale traduite par « avait été exécuté » est difficile sur les plans textuel et morphologique. La proposition dans son ensemble indique toutefois clairement que, d’après ce qui fut rapporté, l’ordre avait été entièrement exécuté pendant la nuit.
