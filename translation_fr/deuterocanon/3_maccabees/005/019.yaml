  naturalness: La phrase doit rester syntaxiquement ouverte, puisque le verset se poursuit. « L’ordre avait été exécuté jusqu’à son terme » est une collocation française plus idiomatique. Le plus-que-parfait dans les deux propositions subordonnées exprime naturellement l’antériorité par rapport à la suite du récit, sans surinterpréter l’aspect des participes grecs.
