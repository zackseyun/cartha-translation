lexical_decisions:
- source_word: ὑποδείξαντος
  choice: avait indiqué
  rationale: Le verbe exprime ici le fait de faire savoir ou de signaler quelque chose. « Avait indiqué » en conserve la valeur sans en faire nécessairement une déclaration officielle.
- source_word: νυκτός
  choice: pendant la nuit
  rationale: Le génitif de temps désigne la période au cours de laquelle l’action s’est déroulée ; « pendant la nuit » est naturel et précis en français moderne.
- source_word: τὸ προσταγέν
  choice: l’ordre
  rationale: Le participe substantivé désigne ce qui avait été commandé. « L’ordre » rend de façon concise le caractère officiel de la consigne.
- source_word: ἐπὶ τέλος
  choice: à son terme
  rationale: Cette expression marque l’achèvement. « Mené à son terme » restitue l’idée d’exécution complète sans ajouter la notion de réussite.
- source_word: ἠγοχέναι
  choice: avait été mené
  rationale: La forme transmise est difficile sur les plans textuel et morphologique. Dans le contexte, elle indique néanmoins que l’action ordonnée avait été conduite jusqu’à son achèvement.
- source_word: προσμαρτυρησάντων
  choice: en eurent eux aussi témoigné
  rationale: Le composé exprime un témoignage qui vient s’ajouter à une première indication. « Eux aussi » fait ressortir cette valeur additive, tandis que « en témoigner » maintient la portée testimoniale du verbe.
- source_word: φίλων
  choice: amis
  rationale: « Amis » correspond au sens ordinaire du mot grec et laisse ouverte sa possible nuance d’entourage dans un cadre royal.
