    issue: « Rasades » pour δράκεσι
    rationale: δράξ signifie une poignée, et non une gorgée ou une rasade. Ce choix déplace concrètement le sens du texte.
  - severity: low
    issue: « Encens » pour λιβανωτοῦ
    rationale: Le terme grec vise spécifiquement l’oliban (frankincense), non l’encens en général.
  - severity: low
    issue: « Dès le lendemain » pour ὑπὸ τὴν ἐρχομένην ἡμέραν
    rationale: « Dès » ajoute une nuance d’immédiateté. « Pour le lendemain » exprime plus sobrement l’échéance prévue.
  - severity: low
    issue: Note littérale imprécise
    rationale: La note actuelle dit « pour aller à la rencontre », ajoutant un mouvement verbal absent du grec; elle peut présenter plus exactement l’expression nominale.
