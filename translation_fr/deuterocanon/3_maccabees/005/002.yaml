  to: Il ordonna que, pour le lendemain, on fasse boire tous les éléphants — au nombre de cinq cents — avec de copieuses poignées d’oliban, c’est-à-dire d’encens, et beaucoup de vin pur, puis que, rendus féroces par l’abondance de la boisson, on les amène pour la mise à mort des Juifs.[a]
