review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le grec δράξ (datif pluriel δράκεσι) désigne des poignées/quantités prises à la main, non des « rasades », et λιβανωτός est ici plus précisément l’oliban (encens). « Dès le lendemain » peut indûment suggérer une exécution immédiate; « pour le lendemain » rend mieux le repère temporel. La finalité meurtrière est bien contextuellement explicite, mais la note doit conserver la tournure imagée et comprimée de συνάντησις avec le μόρος des Juifs.
  naturalness: Le texte révisé reste narratif, moderne et lisible. « Faire boire ... avec de copieuses poignées d’oliban » conserve l’étrangeté matérielle du grec sans la normaliser en une boisson d’« encens ». « Vin pur » est l’équivalent français courant de vin non dilué.
  terminology: « Oliban » rend précisément λιβανωτός; l’apposition « encens » assure l’intelligibilité internationale. « Vin pur » rend ἀκράτος (non mêlé d’eau). « Mise à mort » exprime naturellement en français l’issue visée, sans imposer de lecture doctrinale.
  issues:
