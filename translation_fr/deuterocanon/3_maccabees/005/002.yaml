  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
translation:
  language: fr
  text: Il ordonna que, pour le lendemain, on fasse boire tous les éléphants — au nombre de cinq cents — avec de copieuses poignées d’oliban, c’est-à-dire d’encens, et beaucoup de vin pur, puis que, rendus féroces par l’abondance de la boisson, on les amène pour la mise à mort des Juifs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une rencontre avec le sort funeste des Juifs ». Cette formule grecque condensée exprime ici leur mise à mort projetée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Il ordonna
  rationale: L’aoriste de κελεύω exprime un ordre donné avec autorité; « ordonna » est naturel et précis.
- source_word: ὑπὸ τὴν ἐρχομένην ἡμέραν
  choice: dès le lendemain
  rationale: Cette expression temporelle vise le jour qui approche; dans le contexte narratif, « dès le lendemain » rend clairement le délai fixé.
- source_word: δαψιλέσι δράκεσι
  choice: de généreuses rasades
  rationale: δαψιλής indique l’abondance et δράξ désigne ici des quantités administrées à boire; « rasades » conserve l’idée de fortes portions de boisson.
- source_word: λιβανωτοῦ
  choice: d’encens
  rationale: λιβανωτός désigne l’encens, souvent plus précisément l’oliban; « encens » est le terme français courant et intelligible dans ce contexte de préparation liquide.
- source_word: οἴνῳ πλείονι ἀκράτῳ
  choice: une grande quantité de vin non coupé
  rationale: πλείονι marque une quantité importante et ἀκράτῳ un vin non mélangé à l’eau, détail significatif dans l’usage antique.
- source_word: ὄντας τὸν ἀριθμὸν πεντακοσίους
  choice: au nombre de cinq cents
  rationale: Formulation française naturelle qui conserve la précision explicative du participe grec.
- source_word: ἀγριωθέντας
  choice: rendus féroces
  rationale: Le participe passif indique que la boisson devait provoquer leur férocité.
- source_word: τῇ τοῦ πόματος ἀφθόνῳ χορηγίᾳ
  choice: par cette boisson abondamment fournie
  rationale: La tournure rend à la fois l’idée de boisson (πόμα) et celle d’une fourniture sans mesure (ἄφθονος χορηγία).
- source_word: εἰσαγαγεῖν
  choice: on les amène
  rationale: L’infinitif dépend de l’ordre initial et désigne l’introduction des animaux dans le lieu prévu.
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: pour causer la mort des Juifs
  rationale: La formule grecque, littéralement une rencontre avec leur sort mortel, désigne en contexte l’emploi des éléphants comme instruments de leur mise à mort.
theological_decisions:
- issue: Sens de μόρος dans la formule πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: pour causer la mort des Juifs
  alternative: à la rencontre du sort funeste des Juifs
  rationale: μόρος peut signifier le destin fatal, la mort ou la ruine. Le contexte indique une mise à mort projetée, mais une note conserve l’image et l’ambiguïté de la formulation grecque.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste soutenue sans archaïsme. « Vin non coupé » explicite naturellement le vin non mélangé d’eau; la note préserve l’image singulière de la dernière expression grecque.
