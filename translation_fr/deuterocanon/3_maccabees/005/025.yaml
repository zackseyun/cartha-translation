  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
translation:
  language: fr
  text: Mais les Juifs, unis dans une même âme pendant tout ce temps ininterrompu[a], tendaient les mains vers le ciel et, par des chants plaintifs, adressaient une supplication baignée de larmes au Dieu très grand, le priant de les secourir de nouveau sans tarder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est rare et très condensée ; elle peut aussi se traduire : « partageant une même âme durant ce temps indivisible ». Elle associe l’idée d’une durée continue à celle d’une profonde unité intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμερῆ
  choice: ininterrompu
  rationale: L’adjectif signifie littéralement « non divisé ». Appliqué à χρόνον, il évoque ici une durée continue, sans interruption; « ininterrompu » restitue ce sens en français naturel.
- source_word: ψυχοκοινούμενοι
  choice: unis d’une même âme
  rationale: Ce composé rare exprime une mise en commun ou une union au niveau de l’âme. La formulation conserve l’image de l’âme tout en exprimant clairement l’unité intérieure du groupe.
- source_word: πολυδάκρυν ἱκετίαν
  choice: une supplication baignée de larmes
  rationale: L’expression désigne une supplication accompagnée de larmes abondantes. « Baignée de larmes » en préserve la forte charge émotionnelle sans lourdeur.
- source_word: ἐν μέλεσιν γοεροῖς
  choice: par des chants plaintifs
  rationale: μέλη peut désigner des chants ou des mélodies, tandis que γοερός marque la lamentation. « Chants plaintifs » convient au contexte d’une prière collective chantée.
- source_word: τείνοντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: tendaient les mains vers le ciel
  rationale: La traduction garde directement le geste traditionnel de prière ainsi que son orientation vers le ciel.
- source_word: ἐδέοντο
  choice: le priant
  rationale: Le verbe exprime une demande instante. « Prier » s’intègre naturellement après « supplication », tout en évitant une répétition pesante.
- source_word: τοῦ μεγίστου θεοῦ
  choice: au Dieu très grand
  rationale: Le superlatif grec qualifie directement Dieu. « Dieu très grand » reste proche du texte sans introduire le titre distinct « Très-Haut » ni transformer l’expression en « Dieu suprême ».
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe demande une nouvelle intervention divine et laisse entendre que Dieu leur est déjà venu en aide.
- source_word: συντόμως
  choice: sans tarder
  rationale: Dans cette supplication urgente, l’adverbe demande une intervention prompte. « Sans tarder » rend cette urgence avec naturel.
theological_decisions:
- issue: Traduction de τοῦ μεγίστου θεοῦ
  choice: le Dieu très grand
  alternative: le Dieu Très-Haut; le Dieu suprême
  rationale: Le grec emploie le superlatif de μέγας, « grand », et non le titre habituellement rendu par « Très-Haut ». La traduction choisie conserve cette distinction et n’introduit aucun titre théologique absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement déployée pour rendre lisible la longue phrase grecque, tout en maintenant l’unité collective, les chants de lamentation, les larmes, le geste de prière et l’urgence de la demande.
