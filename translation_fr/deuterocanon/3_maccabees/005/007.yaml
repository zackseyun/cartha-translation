  text: They all called upon the almighty Lord[a], the sovereign over every dominion, their merciful God and Father, with tears and with an unceasing cry, begging him,
translation:
  language: fr
  text: Tous invoquèrent, avec des larmes et une clameur incessante, le Seigneur tout-puissant, qui règne sur tous les souverains, leur Dieu miséricordieux et leur Père[a], en le suppliant
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui exerce sa souveraineté sur tout détenteur du pouvoir ». Le grec emploie deux termes apparentés liés à l’exercice du pouvoir, soulignant la suprématie de Dieu sur tous les souverains.'
    reason: Alternative lexicale ; le grec associe un nom désignant un puissant ou un souverain et un verbe de la même famille.
lexical_decisions:
- source_word: παντοκράτορα
  choice: tout-puissant
  rationale: Titre divin consacré et naturel en français biblique moderne, exprimant la souveraineté et la puissance universelles.
- source_word: κύριον
  choice: le Seigneur
  rationale: Rend directement le titre divin κύριος selon l’usage biblique français.
- source_word: πάσης δυνάστην δυναστεύοντα
  choice: celui qui règne sur toute autorité
  rationale: La formulation garde l’idée de suprématie universelle et fait partiellement entendre le jeu grec sur des termes apparentés du domaine de la domination, sans produire une répétition peu naturelle en français.
- source_word: ἐλεήμονα
  choice: miséricordieux
  rationale: Équivalent direct qui conserve la tonalité religieuse et la qualité divine exprimée par le grec.
- source_word: θεὸν αὐτῶν καὶ πατέρα
  choice: leur Dieu miséricordieux et leur Père
  rationale: La répétition de « leur » clarifie naturellement en français que Dieu est aussi désigné comme leur Père, sans atténuer ce titre relationnel explicite.
- source_word: δυσκαταπαύστῳ βοῇ
  choice: d’un cri impossible à faire taire
  rationale: Rend la nuance propre de l’adjectif, qui décrit un cri difficile ou impossible à arrêter, plutôt que de l’aplatir en simple continuité temporelle.
- source_word: πάντες
  choice: Tous
  rationale: La position initiale maintient l’accent collectif porté par le grec.
- source_word: μετὰ δακρύων
  choice: avec larmes
  rationale: Formulation concise et digne qui conserve l’image concrète de la détresse.
- source_word: ἐπεκαλέσαντο
  choice: invoquèrent
  rationale: Verbe français précis et courant dans un contexte de prière adressée à Dieu.
- source_word: δεόμενοι
  choice: le suppliant
  rationale: Le participe exprime une demande pressante; cette construction conserve aussi le caractère syntaxiquement inachevé du verset source.
theological_decisions:
- issue: Restitution de l’accumulation des titres divins
  choice: le Seigneur tout-puissant, celui qui règne sur toute autorité, leur Dieu miséricordieux et leur Père
  alternative: le Seigneur tout-puissant et souverain de toute domination, leur Dieu miséricordieux et leur Père
  rationale: Le choix conserve la succession emphatique des désignations et maintient explicitement « Père », sans réduire l’ensemble à un seul titre synthétique.
- issue: Interprétation de πάσης dans la formule de souveraineté
  choice: toute autorité
  alternative: tout détenteur d’autorité / toute domination
  rationale: Le grec permet d’entendre soit les puissances ou autorités, soit ceux qui les détiennent. Le texte retient une expression française large et naturelle, tandis que la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue accumulation priante du grec et reste ouverte à la suite syntaxique introduite par « le suppliant ».
