review_pass:
  verdict: revise
  source_fidelity: La désignation divine et l’invocation sont fidèlement rendues. Toutefois, δυνάστης désigne plus directement un puissant, un souverain ou un détenteur du pouvoir qu’une « autorité » abstraite. La formulation révisée conserve donc le référent personnel et l’emphase du grec. δυσκαταπαύστῳ βοῇ exprime une clameur qu’on ne peut apaiser ou interrompre ; « clameur incessante » est une restitution idiomatique et suffisamment forte.
  naturalness: « Avec larmes » et « d’un cri impossible à faire taire » sont compréhensibles, mais paraissent respectivement elliptique et pesant en français international moderne. « Avec des larmes et une clameur incessante » est plus fluide tout en gardant le registre élevé et la construction suspendue du verset.
  terminology: « Seigneur tout-puissant », « Dieu miséricordieux » et « Père » conviennent au lexique biblique français moderne. « Qui règne sur tous les souverains » rend le sens personnel de πάσης δυνάστην et évite de confondre le souverain avec l’autorité ou la domination qu’il exerce.
  issues:
  - severity: medium
    issue: « toute autorité » rend δυνάστης de façon trop abstraite.
    rationale: Le mot grec vise normalement une personne puissante, un chef ou un souverain. Le contexte exprime la souveraineté de Dieu sur tous les détenteurs du pouvoir.
  - severity: low
    issue: La formulation de la clameur est peu naturelle.
    rationale: « D’un cri impossible à faire taire » est une paraphrase lourde. « Une clameur incessante » préserve l’urgence et l’idée d’une clameur qu’on ne peut arrêter.
