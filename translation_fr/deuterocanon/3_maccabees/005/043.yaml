  yaml_path: translation/deuterocanon/3_maccabees/005/043.yaml
  text: But if he should campaign against Judea[a], he would quickly make it level with fire and spear, and after burning their sanctuary—untrodden by us[b]—with fire, he would put a stop forever to those who perform sacrifice there.
translation:
  language: fr
  text: Mais s’il partait en campagne contre la Judée, il la raserait rapidement par le feu et la lance ; puis, après avoir rapidement incendié[b] leur sanctuaire — où il nous est interdit de pénétrer[a] —, il en finirait pour toujours avec ceux qui y offrent des sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que nous ne pouvons fouler » ; autre traduction possible : « inaccessible pour nous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec répète ici l’idée de rapidité : « après avoir rapidement incendié ». La forme grecque traduite par « incendié » présente une légère incertitude de transmission, mais le sens général est clair.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιστρατεύσαντα
  choice: s’il partait en campagne contre
  rationale: Le participe appartient au discours rapporté et présente une action militaire envisagée. « Partir en campagne contre » garde cette valeur sans la réduire à une seule bataille.
- source_word: ἰσόπεδον ... στήσεσθαι
  choice: il la raserait
  rationale: L’expression signifie rendre la Judée plane, au niveau du sol. « Raser » restitue naturellement en français l’idée de destruction totale.
- source_word: πυρὶ καὶ δόρατι
  choice: par le feu et la lance
  rationale: Les datifs indiquent les moyens de la dévastation et conservent l’image militaire du grec.
- source_word: διὰ τάχους
  choice: rapidement
  rationale: Cette expression souligne la rapidité de la destruction projetée.
- source_word: ἄβατον ἡμῖν
  choice: où il nous est interdit de pénétrer
  rationale: ἄβατον désigne un lieu où l’on ne peut ou ne doit pas entrer. Cette formulation française naturelle préserve le point de vue des non-Juifs exprimé par ἡμῖν.
- source_word: ναόν
  choice: sanctuaire
  rationale: ναός vise ici le sanctuaire proprement dit plutôt que l’ensemble du complexe du temple.
- source_word: πρῆσαντα / πρήσαντα
  choice: après avoir incendié
  rationale: Malgré une légère incertitude de transcription, le verbe exprime clairement l’action de mettre le feu.
- source_word: ἐν τάχει
  choice: après avoir incendié
  rationale: La seconde indication de rapidité est laissée implicite dans la tournure française afin d’éviter une répétition lourde ; l’idée d’urgence demeure portée par « rapidement » dans la proposition précédente.
- source_word: τῶν συντελούντων ἐκεῖ θυσίαν
  choice: ceux qui y accomplissent les sacrifices
  rationale: La formulation garde le sens concret de personnes qui mènent à bien le service sacrificiel, sans préciser davantage leur fonction.
- source_word: εἰς τὸν ἅπαντα χρόνον καταστήσειν
  choice: il mettrait fin pour toujours
  rationale: Cette expression rend la cessation définitive indiquée par le grec.
theological_decisions:
- issue: Sens de ἄβατον ἡμῖν
  choice: Le sanctuaire est présenté comme un lieu où le locuteur et les siens ne sont pas autorisés à pénétrer.
  alternative: « leur sanctuaire, inaccessible pour nous » ou, plus littéralement, « que nous ne pouvons fouler »
  rationale: Le grec conserve à la fois l’idée d’inaccessibilité sacrée et le point de vue extérieur du locuteur. La traduction ne précise pas au-delà du texte la raison exacte de l’interdiction.
- issue: Portée de ναός
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » respecte la portée plus étroite que peut avoir ναός et convient au contexte d’un espace interdit d’accès.
- issue: Objet de la cessation définitive
  choice: La menace vise « ceux qui y accomplissent les sacrifices ».
  alternative: Comprendre que le roi abolirait pour toujours le sacrifice lui-même.
  rationale: La syntaxe grecque porte formellement sur les personnes, τῶν συντελούντων, même si leur disparition implique aussi la cessation du culte sacrificiel. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde le ton violent et solennel de la menace rapportée. « Raser » est idiomatique pour ἰσόπεδον ... στήσεσθαι ; « accomplissent les sacrifices » reste volontairement proche du grec.
