  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
translation:
  language: fr
  text: Mais comme l’entretien continuait à s’éterniser, le roi fit appeler Hermon et, avec une menace amère, lui demanda pour quelle raison les Juifs avaient été épargnés, après avoir survécu au-delà du jour fixé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement, le grec peut se comprendre : « avaient été guéris (ou préservés), après avoir vécu/survécu au jour restant ou supplémentaire ». La formulation est condensée et difficile. Le texte principal l’interprète, selon le contexte, comme leur maintien en vie au-delà du jour qui leur avait été assigné.'
    reason: Préserve les possibilités lexicales de ἰάθησαν et l’ambiguïté de περιοῦσαν ἡμέραν, tout en expliquant l’interprétation contextuelle retenue.
lexical_decisions:
- source_word: ἐπὶ πλεῖον … προσκοπτούσης τῆς ὁμιλίας
  choice: comme l’entretien continuait à s’éterniser
  rationale: La tournure exprime la prolongation pénible ou contrariée de l’échange. « Continuait à s’éterniser » restitue cette nuance sans donner à προσκοπτούσης son sens concret de trébucher.
- source_word: προσκαλεσάμενος
  choice: fit appeler
  rationale: Le participe moyen indique que le roi fait venir Hermon auprès de lui. « Fit appeler » est naturel en français et convient à l’autorité royale.
- source_word: μετὰ πικρίας ἀπειλῆς
  choice: avec une menace acerbe
  rationale: Cette formulation conserve le singulier ἀπειλῆς et la dureté de πικρίας. « Acerbe » exprime ici une menace pleine d’amertume et d’hostilité.
- source_word: ἐπυνθάνετο τίνος ἕνεκεν αἰτίας
  choice: lui demanda pour quelle raison
  rationale: « Pour quelle raison » garde l’insistance de la formulation grecque, plus développée qu’un simple « pourquoi ».
- source_word: ἰάθησαν
  choice: avaient été épargnés
  rationale: Le sens ordinaire est « furent guéris », mais aucune maladie n’est en cause ici. Dans le contexte de l’exécution projetée, le passif désigne leur préservation de la mort.
- source_word: τὴν περιοῦσαν ἡμέραν περιβεβιωκότες
  choice: alors qu’ils avaient survécu au jour fixé
  rationale: 'La formulation grecque est condensée et difficile. Le texte principal exprime le sens narratif probable : les Juifs sont restés vivants au-delà du jour prévu pour leur destruction. La note conserve une traduction plus littérale possible.'
