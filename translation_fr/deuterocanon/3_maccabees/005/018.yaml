  rationale: La révision rend plus visible dans le texte l’idée de survie au-delà d’une échéance et reformule la note afin de ne pas présenter comme explicite dans le grec une précision qui relève du contexte. Le reste de la formulation est conservé, avec « amère », plus proche de πικρίας.
