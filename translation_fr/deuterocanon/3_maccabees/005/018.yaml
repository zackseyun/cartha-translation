    rationale: Le parfait participial περιβεβιωκότες est compris, conformément au contexte, comme une survie au-delà d’une échéance. « Survécu au jour fixé » peut seulement signifier avoir traversé ce jour vivant; « après avoir survécu au-delà du jour fixé » rend mieux l’interprétation adoptée.
  - severity: low
    issue: La note qualifie le jour de « prévu pour leur mort » avec plus de certitude que ne le permet la formulation grecque isolée.
    rationale: Le contexte narratif soutient cette compréhension, mais τὴν περιοῦσαν ἡμέραν demeure difficile. La note doit présenter « jour restant/supplémentaire » comme une possibilité littérale et décrire l’interprétation contextuelle sans la transformer en donnée explicite du grec.
