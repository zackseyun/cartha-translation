  text: Thus Hermon endured an unexpected and dangerous threat[a], and he was shaken in appearance and countenance.
translation:
  language: fr
  text: Ainsi, Hermon subit une menace inattendue et dangereuse, et il se troubla, ce qui se voyait à son apparence et à son visage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fut abattu dans son apparence et son visage » ou « il se contracta dans son apparence et son visage ». Le verbe grec peut évoquer une contraction visible, l’intimidation ou un bouleversement intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Marque avec concision la conséquence ou la manière liée à la situation précédente.
- source_word: ὁ Ἕρμων
  choice: Hermon
  rationale: Translittération française usuelle du nom propre grec.
- source_word: ἀπροσδόκητον
  choice: inattendue
  rationale: Exprime directement ce qui n’avait pas été prévu.
- source_word: ἐπικίνδυνον
  choice: dangereuse
  rationale: Conserve le sens de péril porté par l’adjectif grec.
- source_word: ὑπήνεγκεν
  choice: subit
  rationale: Rend naturellement en français l’idée d’avoir eu à supporter ou à subir la menace, sans suggérer nécessairement une résistance héroïque.
- source_word: ἀπειλήν
  choice: menace
  rationale: Équivalent direct et idiomatique du substantif grec.
- source_word: τῇ ὁράσει καὶ τῷ προσώπῳ
  choice: son aspect comme son visage
  rationale: Maintient les deux éléments grecs, l’apparence visible et le visage, sans les fondre entièrement.
- source_word: συνεστάλη
  choice: se décomposèrent
  rationale: Expression française naturelle décrivant une altération visible sous l’effet de la peur ou du trouble; elle préserve la dimension extérieure indiquée par les compléments, tout en laissant en note les sens plus physiques du verbe.
