  source_fidelity: Le sens de la menace « inattendue et dangereuse » est bien rendu. Toutefois, συνεστάλη a pour sujet Hermon, avec les datifs τῇ ὁράσει καὶ τῷ προσώπῳ qui situent la manifestation visible de son trouble. La formulation actuelle fait de « son aspect » et de « son visage » les sujets de « se décomposèrent », ce qui s’éloigne de cette construction et force une image peu adaptée.
