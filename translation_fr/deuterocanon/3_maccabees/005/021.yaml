  text: Quand le roi eut parlé, tous les présents donnèrent tous ensemble leur accord, volontiers et avec joie, puis chacun rentra chez lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσμένως ... μετὰ χαρᾶς
  choice: avec empressement et joie
  rationale: Rend les deux notions distinctes, la disposition volontaire et la joie, sans la redondance peu naturelle de « volontiers avec joie ».
- source_word: ὁμοῦ συναινέσαντες
  choice: donnèrent ensemble leur accord
  rationale: Conserve à la fois l'idée d'un accord commun exprimé par ὁμοῦ et celle du consentement portée par συναινέω.
- source_word: εἰς τὸν ἴδιον οἶκον ἕκαστος ἀνέλυσε
  choice: chacun rentra chez lui
  rationale: Expression française naturelle qui restitue le départ de chacun vers sa propre maison.
