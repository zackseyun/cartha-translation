  text: Then the friends and relatives[a], overjoyed, having regained confidence, stationed the forces in the most suitable places of the city for guard duty.
translation:
  language: fr
  text: Alors, transportés de joie, les amis et les proches se dispersèrent, puis, avec confiance[a], postèrent les forces aux endroits les plus appropriés de la ville afin d’en assurer la surveillance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec foi » ou « fidèlement ». Le grec dit littéralement « avec foi » (μετὰ πίστεως) et peut décrire leur confiance ou la fidélité avec laquelle ils agissaient.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιχαρεῖς
  choice: transportés de joie
  rationale: L’adjectif exprime une joie particulièrement intense; cette tournure est naturelle et digne en français moderne.
- source_word: ἀναλύσαντες
  choice: se dispersèrent
  rationale: Dans ce contexte, le participe indique vraisemblablement que les personnes quittent le rassemblement pour se répartir; « se dispersèrent » préserve ce mouvement sans lui attribuer l’idée absente de « reprendre confiance ».
- source_word: οἱ φίλοι καὶ συγγενεῖς
  choice: les amis et les proches
  rationale: « Proches » rend ici συγγενεῖς dans son sens familial et relationnel sans recourir à l’archaïsme « parents » au sens de membres de la parenté.
- source_word: μετὰ πίστεως
  choice: avec confiance
  rationale: Dans ce récit de déploiement défensif, πίστις peut désigner l’assurance ou la confiance avec laquelle ils agissent. Une note conserve les autres valeurs possibles, notamment « avec foi » et « fidèlement ».
- source_word: διέτασσον
  choice: postèrent
  rationale: Avec τὰς δυνάμεις et l’indication de lieux, le verbe décrit la mise en position organisée de forces.
- source_word: τὰς δυνάμεις
  choice: les forces
  rationale: Le terme reste assez large pour désigner les effectifs chargés de la sécurité sans préciser indûment qu’il s’agit de soldats réguliers.
- source_word: ἐπὶ τοὺς εὐκαιροτάτους τόπους
  choice: aux endroits les plus appropriés
  rationale: Le superlatif désigne les emplacements les plus favorables ou convenables; « appropriés » évite d’ajouter la nuance technique de « stratégiques ».
- source_word: πρὸς τὴν τήρησιν
  choice: afin d’en assurer la surveillance
  rationale: 'La préposition exprime le but du déploiement: garder ou surveiller la ville. Le pronom « en » reprend naturellement « la ville ».'
theological_decisions:
- issue: Sens de πίστις dans μετὰ πίστεως
  choice: avec confiance
  alternative: avec foi; fidèlement
  rationale: Le contexte narratif favorise ici l’idée d’assurance, mais le grec peut également évoquer la foi ou la fidélité. La note maintient cette tension lexicale sans imposer une lecture confessionnelle.
translation_notes:
  register: 'Français international moderne, clair et soutenu sans archaïsme. La phrase suit l’enchaînement grec: joie, dispersion, puis déploiement des forces. La ponctuation rend lisible la succession des actions tout en conservant en note l’ambiguïté de μετὰ πίστεως.'
