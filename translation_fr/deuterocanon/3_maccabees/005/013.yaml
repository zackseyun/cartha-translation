revisions:
- from: Les Juifs, ayant échappé à l’heure annoncée d’avance, suppliaient de nouveau le Saint, c’est-à-dire leur Dieu, lui qui se laisse volontiers fléchir[a], de manifester avec éclat la puissance de sa main aux nations orgueilleuses[b].
  to: Les Juifs, ayant échappé à l’heure qui avait été annoncée, suppliaient de nouveau le Saint, c’est-à-dire leur Dieu, celui qui est toujours prêt à se montrer favorable, de manifester de façon éclatante la puissance de sa main aux nations orgueilleuses[b].
  rationale: La révision conserve tous les éléments du grec et l’ambiguïté de ἔθνη. Elle reformule l’épithète εὐκατάλλακτον comme un second titre divin clairement relié au complément de « suppliaient », et elle supprime la note a devenue redondante, puisque le texte principal choisit une formulation idiomatique qui exprime directement la disposition favorable évoquée par le grec.
