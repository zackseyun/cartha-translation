  yaml_path: translation/deuterocanon/3_maccabees/005/013.yaml
  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
translation:
  language: fr
  text: Les Juifs, ayant échappé à l’heure qui avait été annoncée, suppliaient de nouveau le Saint, c’est-à-dire leur Dieu, celui qui est toujours prêt à se montrer favorable, de manifester de façon éclatante la puissance de sa main aux nations orgueilleuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « aux non-Juifs orgueilleux ». Le mot grec peut désigner les « nations » ou, dans l’usage juif, les « non-Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διαφυγόντες
  choice: ayant échappé
  rationale: Le participe exprime le fait d’avoir franchi avec succès un moment de danger. « Ayant échappé » conserve cette idée de délivrance.
- source_word: τὴν προσημανθεῖσαν ὥραν
  choice: l’heure annoncée d’avance
  rationale: Le participe προσημανθεῖσαν désigne une heure signalée ou annoncée au préalable; cette formulation évite de préciser sans nécessité qui l’avait fixée.
- source_word: τὸν ἅγιον ἤγουν θεὸν αὐτῶν
  choice: le Saint, c’est-à-dire leur Dieu
  rationale: Cette traduction maintient la valeur substantive de τὸν ἅγιον et rend explicitement la particule explicative ἤγουν.
- source_word: ἤξιουν
  choice: suppliaient
  rationale: L’imparfait grec présente une supplication en cours, tandis que le verbe exprime ici une demande pressante.
- source_word: τὸν εὐκατάλλακτον
  choice: lui qui se laisse volontiers fléchir
  rationale: L’adjectif substantivé décrit Dieu comme favorablement disposé à accueillir la supplication. La formulation conserve l’image grecque sans suggérer qu’il serait capricieux ou manipulable.
- source_word: μεγαλοφθενῶς
  choice: avec éclat
  rationale: Cet adverbe rare évoque une manifestation grandiose et noble; « avec éclat » convient naturellement à l’acte de manifester la puissance divine.
- source_word: χειρὸς κράτος
  choice: la puissance de sa main
  rationale: La traduction préserve l’image biblique concrète de la main comme expression de la puissance agissante.
- source_word: ἔθνεσιν ὑπερηφάνοις
  choice: aux nations orgueilleuses
  rationale: ἔθνη peut désigner les nations ou les non-Juifs. « Nations » conserve ici l’ambiguïté la plus large, et « orgueilleuses » rend ὑπερήφανοις.
theological_decisions:
- issue: La description de Dieu par εὐκατάλλακτον
  choice: lui qui se laisse volontiers fléchir
  alternative: lui qui est facile à apaiser; lui qui se montre favorable; dans sa grande bonté
  rationale: Le grec attribue directement à Dieu une disposition à accueillir favorablement la supplication. La traduction conserve cette tension et cette image relationnelle, plutôt que de la remplacer par une notion théologique plus abstraite.
- issue: La fonction de ἤγουν dans le titre divin
  choice: le Saint, c’est-à-dire leur Dieu
  alternative: leur Dieu saint; leur Dieu, autrement dit le Saint
  rationale: La particule est explicitement explicative. La rendre préserve la manière dont le texte identifie « le Saint » comme le Dieu des Juifs, sans fondre les deux expressions en un simple adjectif.
translation_notes:
  register: Français international moderne, digne et accessible. La structure explicative du titre divin est conservée, de même que l’image biblique de la puissance de la main. Les formulations archaïques telles que « païens » ou « imploraient qu’il daignât » ont été évitées.
