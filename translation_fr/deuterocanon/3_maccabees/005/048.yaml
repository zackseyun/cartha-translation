  text: But when the Jews saw the elephants coming out to the gate[a], and the dust from the advancing armed force and from the movement of the crowd, and heard a loud tumult,
translation:
  language: fr
  text: Mais lorsque les Juifs virent les éléphants sortir en direction de la porte, ainsi que la poussière soulevée par les troupes armées qui les suivaient et par la foule en marche, et qu’ils entendirent un tumulte retentissant,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mais lorsque
  rationale: Rend à la fois la transition narrative et la valeur temporelle de l’expression grecque.
- source_word: τῶν ἐλεφάντων ἐξιόντων
  choice: les éléphants sortir
  rationale: Conserve l’action concrète du génitif absolu dans une syntaxe française naturelle après « lorsque ».
- source_word: ἐπὶ πύλην
  choice: en direction de la porte
  rationale: Exprime le mouvement vers la porte sans affirmer qu’elle est déjà atteinte ni suggérer une attaque contre elle.
- source_word: τῆς ἑπομένης ἐνόπλου δυνάμεως
  choice: les troupes armées qui les suivaient
  rationale: Préserve explicitement l’idée que la force armée venait derrière les éléphants; le pluriel collectif « troupes » est idiomatique en français.
- source_word: τῆς τε τοῦ πλήθους πορείας
  choice: la foule en marche
  rationale: Rend πορεία comme déplacement organisé tout en évitant le tour lourd « la marche de la foule » dans la coordination.
- source_word: κονιορτόν
  choice: la poussière soulevée
  rationale: « Poussière » est le sens direct; « soulevée » explicite sobrement le rapport avec les déplacements mentionnés par les génitifs grecs.
- source_word: βαρυχῆ θόρυβον
  choice: un grondement retentissant
  rationale: « Grondement » restitue la profondeur et la résonance de βαρυχής, tandis que « retentissant » communique l’intensité sonore du tumulte sans employer l’expression peu naturelle « bruit lourd ».
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Désigne ici le peuple juif comme groupe ethnoreligieux en Égypte, non simplement les habitants de la Judée.
