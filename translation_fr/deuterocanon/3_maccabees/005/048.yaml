  register: Français international moderne, narratif et digne. La phrase reste volontairement inachevée par une virgule, comme le verset grec, qui forme la protase poursuivie au verset suivant. La structure a été légèrement réorganisée pour rendre sans ambiguïté les deux sources de la poussière.
