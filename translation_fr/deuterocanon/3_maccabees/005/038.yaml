  text: Arm the elephants even now for tomorrow[b][a], for the destruction of the Jews.
translation:
  language: fr
  text: Équipe dès maintenant les éléphants pour demain, en vue de la destruction des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Ici, le terme grec désigne plus probablement les Juifs au sens ethnique et religieux.
    reason: alternative_reading
lexical_decisions:
- source_word: καθόπλισον
  choice: Équipe les éléphants pour le combat
  rationale: L’impératif désigne l’équipement militaire et la préparation au combat. Cette formulation est plus naturelle en français que « arme les éléphants » tout en conservant la portée martiale.
- source_word: ἔτι καὶ νῦν
  choice: dès maintenant
  rationale: L’expression insiste sur l’immédiateté de l’ordre. « Dès maintenant » rend cette urgence avec naturel, sans introduire l’idée plus absolue de « sur-le-champ ».
- source_word: εἰς τὴν αὔριον
  choice: en vue de demain
  rationale: La tournure grecque présente le lendemain comme l’échéance visée par les préparatifs. « En vue de demain » conserve ce rapport final et temporel.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: afin d’anéantir
  rationale: ἀφανισμός évoque la destruction complète ou l’effacement. La tournure verbale « afin d’anéantir » est claire, forte et naturelle dans cet ordre militaire.
- source_word: τῶν Ἰουδαίων
  choice: les Juifs
  rationale: Dans ce contexte diasporique, le terme désigne le peuple juif comme groupe ethnique et religieux, plutôt que les seuls habitants de la Judée.
theological_decisions:
- issue: Portée de Ἰουδαῖοι dans un contexte hellénistique de diaspora
  choice: les Juifs
  alternative: les Judéens
  rationale: Le récit vise le peuple juif sous domination lagide, et non un groupe défini uniquement par son origine géographique. La note conserve néanmoins l’alternative lexicale possible.
translation_notes:
  register: Français international moderne, digne et direct. La formulation garde l’urgence de l’ordre et la violence explicite de son objectif, sans archaïsme ni atténuation.
