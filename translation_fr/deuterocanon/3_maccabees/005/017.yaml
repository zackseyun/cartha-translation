  text: And when this had happened, he urged them, having given themselves over to feasting, to devote the present occasion of the banquet, long honored, to gladness.
translation:
  language: fr
  text: Quand cela se fut produit, il les exhorta, après qu’ils se furent livrés au festin, à consacrer à la joie ce moment du banquet, honoré depuis longtemps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à réserver ce moment du banquet, honoré depuis longtemps, comme une part consacrée à la joie ». L’expression grecque traduite par « consacrer » est condensée; elle peut plus littéralement évoquer le fait de « mettre de côté » ou d’« assigner une part ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  choice: Quand cela se fut produit
  rationale: Le génitif absolu marque un fait antérieur accompli; cette formulation française en restitue naturellement la succession sans préciser davantage le référent.
- source_word: παρῄνει
  choice: il les exhorta
  rationale: Le verbe exprime un conseil pressant ou une exhortation; « exhorta » convient au registre narratif soutenu sans être obscur.
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς
  choice: à se livrer au festin
  rationale: La tournure rend l'idée de se consacrer aux réjouissances d'un repas, sans ajouter la notion péjorative d'excès que pourrait suggérer « débauche ».
- source_word: τὸ παρὸν τῆς συμποσίας
  choice: ce moment du banquet
  rationale: « Ce moment » restitue τὸ παρόν, tandis que « banquet » rend συμποσία de façon naturelle et digne dans ce contexte.
- source_word: ἐπὶ πολὺ γεραιρομένους
  choice: honoré depuis longtemps
  rationale: Cette expression conserve à la fois la valeur temporelle de ἐπὶ πολὺ et l'idée d'honneur portée par γεραιρομένους; l'accord suit « moment ».
- source_word: εἰς εὐφροσύνην καταθέσθαι μέρος
  choice: à consacrer à la joie
  rationale: L'expression grecque est condensée et idiomatique; cette traduction communique l'idée d'affecter ou de réserver une part à la réjouissance, tandis que la note conserve la formulation plus littérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé antérieur maintient clairement l'antériorité de l'événement; « festin », « banquet » et « joie » préservent le ton solennel sans archaïsme excessif. La syntaxe grecque de la dernière proposition étant condensée, la traduction principale privilégie la lisibilité et la note en conserve l'ambiguïté lexicale.
