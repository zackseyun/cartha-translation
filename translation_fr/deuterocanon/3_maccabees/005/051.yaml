  naturalness: Le français est globalement moderne, soutenu et naturel. « Ils poussèrent de très grands cris » convient au registre narratif. « En se manifestant » est plus direct et idiomatique que « en manifestant sa présence ».
  terminology: « Souverain de toutes choses » rend convenablement δυνάστης et l’extension universelle du génitif. « Hadès » conserve à juste titre le terme grec sans lui imposer une interprétation doctrinale.
