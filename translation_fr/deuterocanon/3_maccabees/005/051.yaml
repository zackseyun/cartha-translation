  text: They cried out very loudly[a], imploring the Sovereign of all to have mercy and visibly come to their aid, since they already stood at the gates of Hades.
translation:
  language: fr
  text: Ils poussèrent de très grands cris, suppliant le Souverain de toutes choses d’avoir pitié d’eux en se manifestant[a], car ils se trouvaient déjà aux portes de l’Hadès.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’avoir pitié d’eux par une manifestation ». L’expression grecque peut souligner que la compassion demandée devait se manifester ouvertement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ σφόδρα
  choice: Ils poussèrent de très grands cris
  rationale: Cette formulation française naturelle rend à la fois l’éclat collectif du verbe et la forte intensification de φωνῇ μεγάλῃ σφόδρα.
- source_word: τὸν τῆς ἁπάσης δυνάστην
  choice: le Souverain de toutes choses
  rationale: « Souverain » exprime l’autorité du δυνάστης; « de toutes choses » donne un complément compréhensible sans déterminer davantage le référent implicite de ἁπάσης.
- source_word: ἱκετεύοντες
  choice: suppliant
  rationale: Le participe exprime une demande instante et désespérée; « suppliant » conserve sa relation circonstancielle avec le cri.
- source_word: οἰκτείραι
  choice: d’avoir pitié d’eux
  rationale: Le verbe demande une compassion active. « Avoir pitié » reste proche du grec, et αὐτούς demeure explicitement son objet.
- source_word: μετὰ ἐπιφανείας
  choice: en manifestant sa présence
  rationale: La formule grecque signifie littéralement « avec manifestation/apparition ». Cette traduction reste intelligible en français tout en conservant l’idée d’une intervention divine rendue manifeste, sans ajouter explicitement le secours absent du texte.
- source_word: ἤδη πρὸς πύλας ᾅδου καθεστῶτας
  choice: ils se trouvaient déjà aux portes de l’Hadès
  rationale: « Se trouvaient » rend leur état ou position présente; « aux portes de l’Hadès » maintient l’image spatiale d’une mort imminente et conserve le terme grec.
theological_decisions:
- issue: Sens de μετὰ ἐπιφανείας dans la demande adressée à Dieu
  choice: en manifestant sa présence
  alternative: en leur venant visiblement en aide / par une manifestation
  rationale: Le grec associe la compassion demandée à une ἐπιφάνεια, apparition ou manifestation. Le choix retenu préserve le caractère visible de l’intervention sans transformer l’expression en une formulation abstraite ni expliciter excessivement la forme du secours.
- issue: Traduction de ᾅδου dans ce contexte judéo-grec
  choice: l’Hadès
  alternative: le séjour des morts / la mort
  rationale: Le texte emploie explicitement ᾅδης. Garder « Hadès » préserve l’image originale sans l’identifier à une conception doctrinale ultérieure ni la réduire à la seule mort.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme garde l’urgence de la scène. « Hadès » est conservé comme terme littéraire et biblique, et l’ambiguïté de μετὰ ἐπιφανείας est signalée en note.
