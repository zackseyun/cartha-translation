- from: Vers l’aube, alors que la ville était déjà bondée de foules innombrables dans tout l’hippodrome, il entra dans la cour[a] et pressa le roi d’agir dans l’affaire en cours.
  to: Vers l’aube, alors que la ville était déjà remplie de foules innombrables, jusque dans tout l’hippodrome, il entra dans la cour[a] et poussa le roi à agir dans l’affaire en cours.
  rationale: La révision clarifie le rapport entre la ville, les foules et l’hippodrome sans réduire la portée spatiale de κατά. Elle maintient l’approximation temporelle de « Vers l’aube », l’hyperbole de « foules innombrables », l’ambiguïté lexicale de αὐλή et la force exhortative de ὤτρυνε, tout en adoptant un registre narratif français plus homogène.
