    issue: Rattachement ambigu de « dans tout l’hippodrome »
    rationale: Dans le projet, ce complément suit « la ville était ... bondée » et suggère maladroitement que la ville est située dans l’hippodrome. Le grec associe les foules remplissant la ville à leur présence répartie dans l’hippodrome.
  - severity: low
    issue: Registre de « bondée »
    rationale: Le mot est compréhensible, mais légèrement familier pour une narration scripturaire moderne et digne; « remplie » restitue directement καταμεστωμένης.
  - severity: low
    issue: Alternative de note « dans le palais » trop large
    rationale: αὐλή peut, selon le contexte, renvoyer à l’enceinte ou à la cour royale, mais « palais » désigne plus naturellement l’édifice dans son ensemble.
