  yaml_path: translation/deuterocanon/3_maccabees/005/046.yaml
  text: Around dawn[a], when the city was already filled with innumerable crowds at the hippodrome, he entered the court and urged the king on concerning the matter at hand.
translation:
  language: fr
  text: Vers l’aube, alors que la ville était déjà remplie de foules innombrables, jusque dans tout l’hippodrome, il entra dans la cour[a] et poussa le roi à agir dans l’affaire en cours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la cour royale » ou « dans la cour intérieure » ; le grec αὐλή peut désigner la cour d’une résidence royale ou l’espace de la cour royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τὴν ἕω
  choice: Vers l’aube
  rationale: Expression temporelle situant l’action aux environs du point du jour; « vers » conserve l’approximation de περί dans un français naturel.
- source_word: πλήθεσιν ἀναριθμήτοις
  choice: de foules innombrables
  rationale: « Foules » rend le pluriel πλήθεσιν, tandis qu’« innombrables » préserve l’intensité hyperbolique de ἀναριθμήτοις.
- source_word: κατὰ τοῦ ἱπποδρόμου καταμεστωμένης
  choice: bondée … dans tout l’hippodrome
  rationale: « Bondée » exprime la saturation indiquée par καταμεστωμένης; « dans tout l’hippodrome » rend la portée spatiale ou distributive de κατά avec le génitif.
- source_word: εἰς τὴν αὐλήν
  choice: dans la cour
  rationale: αὐλή peut désigner la cour d’une résidence royale ou, selon le contexte, l’espace de la cour royale; le terme français conserve cette latitude.
- source_word: ἐπὶ τὸ προκείμενον
  choice: dans l’affaire en cours
  rationale: L’expression désigne la question ou l’affaire présente, littéralement ce qui est placé devant lui.
- source_word: ὤτρυνε
  choice: pressa … d’agir
  rationale: Le verbe signifie pousser, presser ou exhorter à l’action. Cette formulation garde sa force sans préciser indûment l’action elle-même.
