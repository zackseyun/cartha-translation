  source_fidelity: La traduction interprète κτίσμα comme « ordre », ce qui est possible dans le contexte, mais efface dans le texte l’image de la « création/chose créée » retenue par le grec et signalée par la piste anglaise. « Établi depuis toujours » ajoute aussi l’idée d’établissement et peut suggérer une durée éternelle plus forte que ἀπʼ αἰῶνος. Le reste rend correctement l’agent divin implicite, la portée de la volonté, la « part de sommeil » et l’envoi au roi.
  naturalness: La phrase française est globalement lisible et conserve la construction poétique. « Sous l’action de celui qui accorde… » est toutefois un peu pesant; une relative active est plus naturelle sans modifier les rapports syntaxiques.
  terminology: « Création du temps » conserve κτίσμα et son caractère poétique; « antique » rend sobrement ἀπʼ αἰῶνος. « Une part de sommeil » est fidèle à μέρος. Aucun titre divin n’est ajouté.
