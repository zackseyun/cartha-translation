  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
translation:
  language: fr
  text: Mais l’antique création du temps[a], qui se déploie harmonieusement dans la nuit et le jour par celui qui accorde le sommeil à tous ceux qu’il veut, envoya au roi une part de sommeil[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ordre du temps remontant aux âges anciens ». L’expression grecque, poétique et condensée, décrit la création ancienne du temps, manifestée dans la nuit et le jour.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « envoya une part de sommeil vers le roi » ou « dans le roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἀπʼ αἰῶνος κτίσμα χρόνου
  choice: l’ordre du temps établi depuis toujours
  rationale: κτίσμα désigne littéralement une chose créée, mais, avec χρόνου et la mention de la nuit et du jour, l’expression poétique évoque ici l’ordre créé du temps. « Établi depuis toujours » rend l’ancienneté exprimée par ἀπʼ αἰῶνος sans affirmer explicitement une éternité métaphysique.
- source_word: καλὸν ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  choice: qui se déploie avec beauté dans la nuit et le jour
  rationale: La formulation conserve la valeur esthétique de καλόν et l’image de quelque chose qui survient ou s’étend dans la succession de la nuit et du jour, sans imposer à ἐπιβαλλόμενον le sens plus précis d’« alterner ».
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν
  choice: sous l’action de celui qui accorde le sommeil à tous
  rationale: Le participe désigne le donateur et ὑπό marque ici l’agent. « Le sommeil », implicite dans cette proposition et exprimé ensuite, est explicité pour rendre la phrase intelligible en français.
- source_word: οἷς ἂν αὐτὸς θελήσῃ
  choice: à tous ceux qu’il veut
  rationale: Cette formulation restitue la discrétion du donateur exprimée par le subjonctif avec ἄν. En français, le pronom sujet porte naturellement l’accent de αὐτός dans ce contexte.
- source_word: ὕπνον μέρος
  choice: une part de sommeil
  rationale: « Une part » conserve l’image concrète de μέρος plutôt que de la réduire au simple indéfini « un peu de sommeil ».
- source_word: ἀπέστειλεν εἰς τὸν βασιλέα
  choice: envoya au roi
  rationale: La préposition εἰς signifie littéralement « vers/dans ». « Envoya au roi » demeure proche de la construction grecque, tandis que la note signale sa littéralité inhabituelle.
theological_decisions:
- issue: Référence implicite à Dieu dans τοῦ χαριζομένου πᾶσιν
  choice: celui qui accorde le sommeil à tous ceux qu’il veut
  alternative: Dieu, qui accorde le sommeil à tous ceux qu’il veut
  rationale: Le contexte désigne Dieu, mais le grec n’emploie ici aucun nom ni titre divin. La traduction garde donc la désignation participiale et évite d’ajouter « Dieu » dans le texte.
- issue: Portée de ἀπʼ αἰῶνος
  choice: établi depuis toujours
  alternative: éternel
  rationale: L’expression indique un ordre remontant à un passé immémorial. « Éternel » pourrait introduire une affirmation métaphysique plus forte que ne l’exige le grec.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La longue période et la personnification de l’ordre du temps sont conservées. La formulation reste poétique tout en clarifiant les rapports syntaxiques du grec.
