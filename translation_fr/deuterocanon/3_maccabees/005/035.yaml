  source_fidelity: 'Le texte rend fidèlement les éléments grecs essentiels : τὰ παρὰ τοῦ βασιλέως demeure volontairement large (« ce qui venait du roi »), le participe aoriste est bien situé antérieurement (« après avoir entendu »), l’imparfait ᾔνουν est conservé (« louaient »), et le parfait τετευχότες est adéquatement exprimé par « avaient obtenu ». « Le Dieu qui s’était manifesté » rend naturellement ἐπιφανῆ dans son contexte sans réduire Dieu à une formule théologique importée. La chaîne des titres θεὸν Κύριον, Βασιλέα τῶν βασιλευόντων est préservée.'
