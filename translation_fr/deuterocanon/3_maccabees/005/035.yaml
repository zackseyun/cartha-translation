  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
translation:
  language: fr
  text: De leur côté, les Juifs, après avoir entendu ce qui venait du roi, louaient le Dieu qui s’était manifesté, le Seigneur, le Roi de ceux qui règnent[a], puisqu’ils avaient obtenu de lui ce secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « le Roi des rois ». Le grec dit littéralement : « le Roi de ceux qui règnent ».'
    reason: Alternative lexicale préservant à la fois la forme grecque et la formule française usuelle.
lexical_decisions:
- source_word: οἱ τε Ἰουδαῖοι
  choice: De leur côté, les Juifs
  rationale: La particule τε relie la réaction des Juifs au récit qui précède. « De leur côté » rend cette articulation sans alourdir la phrase.
- source_word: τὰ παρὰ τοῦ βασιλέως
  choice: ce qui venait du roi
  rationale: Le neutre pluriel avec παρά désigne largement les paroles, le message ou les dispositions émanant du roi; cette formulation évite de préciser indûment qu’il s’agissait d’un décret.
- source_word: ἀκούσαντες
  choice: après avoir entendu
  rationale: Le participe a ici une valeur temporelle et situe la louange à la suite de ce que les Juifs ont entendu.
- source_word: ἐπιφανῆ
  choice: qui s’était manifesté
  rationale: Dans ce contexte de secours visible, l’adjectif qualifie Dieu comme s’étant rendu manifeste par son action. La tournure verbale est plus naturelle en français moderne que « le Dieu manifeste ».
- source_word: θεὸν Κύριον
  choice: le Dieu qui s’était manifesté, le Seigneur
  rationale: Les deux désignations sont conservées, avec « le Seigneur » en apposition à « Dieu ».
- source_word: Βασιλέα τῶν βασιλευόντων
  choice: le Roi de ceux qui règnent
  rationale: Le grec emploie le participe substantivé « ceux qui règnent », et non le nom « rois ». La traduction principale en préserve la nuance, tandis que la formule française traditionnelle figure en note.
- source_word: ᾔνουν
  choice: louaient
  rationale: L’imparfait grec présente la louange comme une action en cours; l’imparfait français en rend naturellement l’aspect.
- source_word: τῆσδε τῆς βοηθείας
  choice: ce secours
  rationale: βοήθεια désigne une aide ou un secours. « Secours » convient à l’intervention évoquée sans aller jusqu’au sens plus interprétatif de « délivrance ».
- source_word: τετευχότες
  choice: ils avaient obtenu
  rationale: Le participe parfait exprime un bien déjà acquis dont le résultat demeure; le plus-que-parfait français marque cet accomplissement antérieur.
theological_decisions:
- issue: Traduction de κύριος comme titre divin
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans cette suite de titres appliqués à Dieu, « le Seigneur » est la désignation révérencielle naturelle et établie, sans ajouter de précision doctrinale.
- issue: Formulation du titre Βασιλέα τῶν βασιλευόντων
  choice: le Roi de ceux qui règnent
  alternative: le Roi des rois
  rationale: Le texte grec dit littéralement « ceux qui règnent ». Le texte principal conserve cette forme participiale afin de ne pas la normaliser silencieusement en formule traditionnelle; l’équivalent idiomatique est signalé en note.
translation_notes:
  register: Français international moderne, courant et digne. La phrase garde la succession solennelle des titres divins tout en évitant le peu naturel « Dieu manifeste ». Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
