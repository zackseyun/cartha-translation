base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
translation:
  language: fr
  text: C’est pourquoi le roi, véritable Phalaris en tous points[a], rempli de déraison et ne tenant aucun compte des changements intérieurs[b] qui se produisaient en lui à l’égard de la surveillance des Juifs, fit résolument le serment absolument irréalisable de les envoyer sans délai dans l’Hadès[c], après qu’ils auraient été maltraités aux genoux et aux pieds par les bêtes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phalaris était un tyran dont la cruauté extrême était devenue proverbiale. Le texte compare le roi à lui.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « changements de l’âme ». Il peut s’agir de revirements intérieurs. L’expression suivante peut aussi désigner l’inspection, la visite ou la supervision des Juifs.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le séjour des morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée du récit précédent.
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  choice: le roi, véritable Phalaris en tous points
  rationale: Conserve l’allusion historique et la comparaison emphatique avec Phalaris, plutôt que de la réduire à l’adjectif « cruel ».
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  choice: rempli de déraison
  rationale: « Déraison » rend la conduite privée de jugement rationnel sans atténuer sa portée morale.
- source_word: τὰς ... μεταβολὰς τῆς ψυχῆς
  choice: les changements d’âme
  rationale: Reste proche de l’expression grecque et maintient son caractère intérieur sans la réduire à de simples changements d’avis.
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: en vue de la protection des Juifs
  rationale: Dans ce contexte narratif, ἐπισκοπή évoque une intervention attentive en faveur des Juifs; « en vue de » conserve la valeur orientée de πρός.
- source_word: παρ’ οὐδὲν ἡγούμενος
  choice: ne tenant aucun compte de
  rationale: Expression française idiomatique pour le fait de considérer une chose comme négligeable ou sans valeur.
- source_word: ἀτελέστατον ... ὅρκον
  choice: un serment absolument irréalisable
  rationale: Le superlatif de ἀτελής présente le serment comme impossible à mener à son terme, ce qui préserve l’ironie narrative.
- source_word: βεβαίως ὅρκον ὁρισάμενος
  choice: prononça résolument un serment
  rationale: Formulation française naturelle qui exprime la détermination ferme indiquée par βεβαίως et ὁρισάμενος.
- source_word: ἀνυπερθέτως
  choice: sans délai
  rationale: Rend clairement l’absence de report ou d’ajournement.
- source_word: πέμψειν εἰς ἅιδην
  choice: les enverrait ... dans l’Hadès
  rationale: Conserve l’imagerie grecque du domaine des morts sans lui substituer la notion théologiquement plus chargée d’enfer.
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  choice: les genoux et les pieds mutilés par les bêtes
  rationale: Exprime avec naturel les parties du corps atteintes et la violence de αἰκίζω, tout en gardant les bêtes comme agents.
theological_decisions:
- issue: Traduction de ἅιδης dans un récit grec deutérocanonique
  choice: l’Hadès
  alternative: le séjour des morts
  rationale: Le nom grec maintient l’univers conceptuel du texte et évite d’assimiler sans justification l’Hadès à l’enfer au sens théologique ultérieur.
- issue: Sens de πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: en vue de la protection des Juifs
  alternative: concernant la surveillance des Juifs
  rationale: Le contexte suggère des revirements intérieurs favorables à la préservation des Juifs; la traduction retient cette orientation tout en signalant en note la largeur sémantique possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque est conservée, ainsi que sa virgule finale, puisque le verset se poursuit syntaxiquement. Les images fortes et l’ambiguïté relative de ἐπισκοπή sont préservées sans ajouter de lecture confessionnelle.
