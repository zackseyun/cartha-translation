base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/029.yaml
  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
translation:
  language: fr
  text: Hermon et tous les Amis[a] montraient les bêtes et les forces armées. « Tout est prêt, ô roi, conformément à cette intention qui est la tienne[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans une cour hellénistique, les « Amis » pouvaient être les proches collaborateurs ou dignitaires du roi.
    reason: cultural_note
  - marker: b
    text: 'Ou : « conformément à ce projet qui est le tien »; le mot grec peut désigner une intention, un dessein ou un projet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  choice: montraient
  rationale: L’imparfait exprime une action en cours. Le singulier grec placé avant le sujet composé peut s’accorder avec son premier élément, mais le français naturel emploie ici le pluriel avec « Hermon et tous les Amis ».
- source_word: ὁ Ἕρμων
  choice: Hermon
  rationale: Translittération française simple du nom grec Ἕρμων.
- source_word: πάντες οἱ φίλοι
  choice: tous les Amis
  rationale: Le sens littéral est « tous les amis »; dans le cadre d’une cour hellénistique, le terme peut désigner les proches ou dignitaires royaux. La majuscule signale prudemment cet emploi possible sans le réduire à « courtisans ».
- source_word: τὰ θηρία
  choice: les bêtes
  rationale: « Bêtes » conserve la force inquiétante du terme dans ce contexte, où il s’agit des animaux destinés à l’exécution.
- source_word: τὰς δυνάμεις
  choice: les forces armées
  rationale: Au pluriel, δύναμις peut désigner des forces militaires. « Forces armées » reste assez large sans préciser leur composition.
- source_word: Ἡτοίμασται
  choice: Tout est prêt
  rationale: Le parfait passif singulier décrit un état présent résultant d’une préparation. « Tout est prêt » rend naturellement ce singulier récapitulatif après les bêtes et les forces.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Le vocatif direct est conservé dans un registre digne; « Majesté » serait plus interprétatif.
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  choice: conformément à cette intention qui est la tienne
  rationale: La formulation conserve à la fois la valeur de conformité de κατά, la nuance déictique de ἐκείνην et le sens volontaire mais assez large de πρόθεσις.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. La phrase grecque place un verbe singulier avant le sujet composé; le pluriel français explicite naturellement qu’Hermon et tous les Amis accomplissent l’action. Le discours direct est ponctué comme une nouvelle phrase, conformément au changement d’énonciateur suggéré par le vocatif.
