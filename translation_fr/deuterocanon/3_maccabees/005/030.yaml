  text: 'But he, filled with heavy anger at what had been said, because all his purpose concerning these things had been frustrated by the providence of God, spoke with threats, pressing the matter hard:'
translation:
  language: fr
  text: 'Mais lui, rempli d’une violente colère à cause de ce qui venait d’être dit, parce que la providence de Dieu avait mis en échec tout son dessein à ce sujet, déclara d’un ton pressant et menaçant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρεῖ χόλῳ
  choice: une violente colère
  rationale: L’expression désigne une colère intense et pesante; « violente colère » est idiomatique en français moderne sans atténuer la force du grec.
- source_word: πᾶν αὐτοῦ νόημα
  choice: tout son dessein
  rationale: νόημα peut désigner ici l’intention, le projet ou le dessein; « dessein » convient au contexte d’un projet délibéré tout en conservant une certaine amplitude.
- source_word: διεσκεδάσθαι
  choice: avait mis en échec
  rationale: Le parfait passif exprime que son projet a été dispersé, déjoué ou réduit à néant; « mis en échec » rend naturellement le résultat sans préciser un mécanisme absent du texte.
- source_word: ἐντείνων μετὰ ἀπειλῆς
  choice: d’un ton pressant et menaçant
  rationale: ἐντείνων suggère qu’il parle avec insistance ou tension, tandis que μετὰ ἀπειλῆς ajoute la menace; la formulation française restitue les deux aspects.
theological_decisions:
- issue: Action de la providence divine
  choice: la providence de Dieu avait mis en échec tout son dessein
  alternative: tout son dessein avait été mis en échec par la providence de Dieu
  rationale: La formulation active est naturelle en français et maintient explicitement la providence divine comme cause de l’échec, conformément au grec.
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve la tension du grec, son lien causal et les deux nuances finales d’insistance et de menace.
