  text: But just then[a], when the rooster had crowed at dawn, Hermon, having armed the beasts, was driving them on in the great colonnade.
translation:
  language: fr
  text: Mais à ce moment-là, le coq venait de chanter à l’aube, et Hermon, après avoir armé les bêtes, les mettait en mouvement dans la grande cour à colonnades[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le grand péristyle ». Le grec désigne un espace architectural bordé ou entouré de colonnes.'
    reason: Précision lexicale et solution architecturale alternative pour περιστύλιον.
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Mais à ce moment-là
  rationale: ἄρτι exprime l’immédiateté, tandis que δέ marque ici une transition légèrement adversative dans le récit.
- source_word: ἀλεκτρυὼν ἐκέκραγεν ὄρθρος
  choice: le coq venait de chanter à l’aube
  rationale: ἀλέκτρυων désigne le coq, ἐκέκραγεν son cri, et ὄρθρος situe la scène à l’aube. « Venait de chanter » rend naturellement en français l’action tout juste accomplie.
- source_word: τὰ θηρία
  choice: les bêtes
  rationale: θηρία désigne ici les animaux dangereux destinés à l’assaut; « bêtes » conserve la force menaçante sans préciser leur espèce au-delà du grec.
- source_word: καθωπλικὼς
  choice: après avoir armé
  rationale: Le participe de καθοπλίζω signifie armer ou équiper complètement. « Armé » conserve l’image forte et directe du grec, même si les bêtes sont vraisemblablement équipées pour l’attaque.
- source_word: διεκίνει
  choice: les mettait en mouvement
  rationale: διακινέω peut signifier remuer, faire circuler ou mettre en mouvement. Cette formulation préserve le sens actif sans ajouter une direction ou un but que le grec ne précise pas explicitement.
- source_word: ἐν τῷ μεγάλῳ περιστυλίῳ
  choice: dans la grande cour à colonnades
  rationale: περιστύλιον désigne un espace architectural entouré de colonnes. « Cour à colonnades » est clair en français moderne tout en conservant cette donnée architecturale.
- source_word: ὁ Ἕρμων
  choice: Hermon
  rationale: Translittération française naturelle du nom propre grec.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La formulation conserve l’immédiateté de la scène, l’image inhabituelle des bêtes « armées » et la relative neutralité de διακινέω.
