base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
translation:
  language: fr
  text: « Ô roi, jusqu’à quand vas-tu continuer à nous mettre à l’épreuve, en ordonnant déjà, pour la troisième fois, de les anéantir, puis en annulant de nouveau, dans l’affaire en cours et à la suite d’un revirement, les décisions que tu as prises[a] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les décrets que tu as promulgués ». Le grec peut désigner précisément les décisions officiellement décrétées par le roi, et non de simples choix personnels.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπειράζεις
  choice: vas-tu continuer à nous mettre à l’épreuve
  rationale: Le présent, associé à μέχρι τίνος (« jusqu’à quand »), exprime une action prolongée ou répétée. Cette tournure française restitue la durée et la force du reproche.
- source_word: προστάσσων
  choice: en ordonnant
  rationale: Le participe précise de quelle manière le roi met ses serviteurs à l’épreuve et conserve la force officielle de l’ordre royal.
- source_word: ἤδη τρίτον
  choice: maintenant, pour la troisième fois
  rationale: ἤδη marque le point désormais atteint, tandis que τρίτον indique qu’il s’agit de la troisième occurrence.
- source_word: αὐτοὺς ἀφανίσαι
  choice: de les anéantir
  rationale: Dans ce contexte, ἀφανίζω désigne la destruction complète des personnes visées. « Anéantir » exprime clairement cette violence sans ajouter d’interprétation.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: dans l’affaire en cours
  rationale: L’expression renvoie à la situation concrète qui fait l’objet des ordres royaux.
- source_word: ἐκ μεταβολῆς
  choice: à la suite d’un revirement
  rationale: La formule indique un changement de position ou d’intention. « Revirement » convient au contexte d’ordres royaux successivement donnés et annulés.
- source_word: ἀναλύων
  choice: en annulant
  rationale: Le verbe signifie ici défaire ou rendre sans effet ce qui avait été arrêté auparavant.
- source_word: τὰ σοὶ δεδογμένα
  choice: les décisions que tu as prises
  rationale: Le participe substantivé désigne ce qui a été décidé ou décrété par le roi. La formulation principale reste accessible, tandis que la note signale la nuance institutionnelle possible.
