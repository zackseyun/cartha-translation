  text: Βασιλεῦ, μέχρι τίνος ὡς ἡμᾶς διαπειράζεις, προστάσσων ἤδη τρίτον αὐτοὺς ἀφανίσαι, καὶ πάλιν ἐπὶ τῶν πραγμάτων ἐκ μεταβολῆς ἀναλύων τὰ Α σοὶ δεδογμένα;
