  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
translation:
  language: fr
  text: Et pourtant, sans l’affection suscitée par le rassemblement et la nécessité[a], tu aurais été privé de la vie au lieu de ces choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est concis et sa construction est difficile. συστροφή peut désigner un rassemblement, une association ou le fait d’être réunis; χρεία peut signifier « besoin » ou « nécessité ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au lieu de ces choses ». Le référent du démonstratif grec pluriel n’est pas précisé par la phrase elle-même.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: καίπερ εἰ μή
  choice: Et pourtant, si ce n’était
  rationale: καίπερ porte une nuance concessive et, associé à εἰ μή, introduit ici une condition irréelle. Cette tournure française restitue naturellement les deux valeurs.
- source_word: τὴν τῆς συστροφῆς στοργὴν
  choice: l’affection née de la fréquentation
  rationale: στοργή désigne une affection ou un attachement, tandis que συστροφή peut évoquer le fait de se fréquenter, de vivre ensemble ou de se rassembler. Dans cette adresse personnelle, « fréquentation » convient mieux qu’un rassemblement ponctuel, sans effacer l’ambiguïté lexicale.
- source_word: καὶ τῆς χρείας
  choice: et des services rendus
  rationale: χρεία peut signifier besoin, nécessité, utilité ou service. Dans le contexte d’une menace adressée à un serviteur, « services rendus » donne un sens naturel à la construction au génitif, tout en signalant en note l’autre lecture possible.
- source_word: τὸ ζῆν ἐστερήθης
  choice: tu aurais été privé de la vie
  rationale: L’infinitif substantivé τὸ ζῆν signifie littéralement « le fait de vivre »; avec le passif de στερέω, l’expression française « être privé de la vie » conserve la forme et la gravité de l’énoncé.
- source_word: ἀντὶ τούτων
  choice: à leur place
  rationale: ἀντί exprime la substitution. Le démonstratif pluriel τούτων peut renvoyer, selon le contexte, aux personnes visées plutôt qu’à des objets; « à leur place » le rend avec naturel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement conserve le singulier de la deuxième personne. La formulation principale privilégie le sens relationnel vraisemblable dans le contexte, tandis que les notes maintiennent ouvertes les ambiguïtés de συστροφή, χρεία et τούτων.
