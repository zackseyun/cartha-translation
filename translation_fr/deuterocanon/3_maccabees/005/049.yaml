revisions:
- from: 'Pensant que ce moment marquait pour eux l’ultime tournant de leur vie, l’aboutissement de leur attente si douloureuse[a], ils se laissèrent aller à la compassion et aux lamentations. Ils ne cessaient de s’embrasser, étreignaient leurs proches et se jetaient à leur cou[b] : les parents à celui de leurs enfants, et les mères à celui de leurs jeunes filles[c]. D’autres tenaient contre leur sein des nouveau-nés qui en tiraient une dernière fois du lait.'
  to: 'Pensant que ce moment marquait pour eux l’ultime tournant de leur vie, la fin de leur attente si douloureuse[a], ils se laissèrent aller à la pitié et aux lamentations. Ils ne cessaient de s’embrasser, étreignaient leurs proches et se jetaient à leur cou[b] : les parents au cou de leurs enfants, et les mères au cou de leurs jeunes filles[c]. D’autres tenaient contre leur sein des nouveau-nés qui tétaient pour la dernière fois.'
  rationale: La révision maintient le mouvement narratif et les ambiguïtés lexicales signalées, tout en corrigeant deux formulations françaises qui obscurcissaient le grec. Le parallélisme des embrassades familiales est rétabli sans modifier le sens. La dernière proposition emploie « tétaient pour la dernière fois », expression française naturelle pour des nourrissons qui « tirent le lait » au sein; elle conserve la portée funèbre anticipée de τελευταῖον.
