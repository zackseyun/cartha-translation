  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
translation:
  language: fr
  text: 'Pensant que ce moment marquait pour eux l’ultime tournant de leur vie, la fin de leur attente si douloureuse[a], ils se laissèrent aller à la pitié et aux lamentations. Ils ne cessaient de s’embrasser, étreignaient leurs proches et se jetaient à leur cou[b] : les parents au cou de leurs enfants, et les mères au cou de leurs jeunes filles[c]. D’autres tenaient contre leur sein des nouveau-nés qui tétaient pour la dernière fois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’issue de leur attente si misérable ». Le grec προσδοκία peut désigner l’attente, l’anticipation ou l’état de suspense devant ce qui va arriver.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tombaient sur les cous » : expression grecque décrivant le geste de se jeter dans les bras de quelqu’un sous le coup de l’affection ou de la douleur.'
    reason: cultural_note
  - marker: c
    text: Ou « jeunes femmes ». Dans cette succession de liens familiaux, il s’agit probablement des filles de ces mères.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  choice: l’ultime tournant de leur vie
  rationale: ῥοπή évoque un mouvement décisif ou un point de bascule; « tournant » conserve cette image, tandis que « ultime » rend ὑστάτην.
- source_word: δόξαντες
  choice: Pensant
  rationale: Le participe exprime leur perception de la situation sans affirmer que cette mort imminente se réalisera effectivement.
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  choice: l’aboutissement de leur attente si douloureuse
  rationale: τέλος peut désigner le terme ou l’issue; « aboutissement » convient ici à l’issue redoutée. προσδοκία conserve l’idée d’attente mêlée d’anticipation.
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  choice: ils se laissèrent aller à la compassion et aux lamentations
  rationale: La tournure rend le passage à ces manifestations émotionnelles. « Compassion » préserve οἶκτος sans le réduire à l’apitoiement sur soi, et « lamentations » rend le pluriel γόους.
- source_word: κατεφίλουν
  choice: Ils ne cessaient de s’embrasser
  rationale: L’imparfait et le préverbe intensif suggèrent une action répétée et fervente.
- source_word: περιπλεκόμενοι τοῖς συγγενέσιν
  choice: étreignaient leurs proches
  rationale: « Étreindre » exprime l’enlacement physique de περιπλέκομαι; « proches » convient naturellement aux membres de la parenté désignés par συγγενεῖς.
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  choice: se jetaient à leur cou
  rationale: Cette expression française naturelle conserve l’image et la valeur idiomatique de l’étreinte émue.
- source_word: νεάνισιν
  choice: leurs jeunes filles
  rationale: νεᾶνις signifie littéralement « jeune fille/jeune femme »; dans la série familiale, le possessif explicite la relation probable sans transformer le nom en terme technique de filiation.
- source_word: νεογνὰ ... βρέφη
  choice: des nouveau-nés
  rationale: Les deux mots grecs soulignent le très jeune âge; « nouveau-nés » transmet cette vulnérabilité sans la redondance peu naturelle de « bébés nouveau-nés ».
- source_word: τελευταῖον ἕλκοντα γάλα
  choice: qui en tiraient une dernière fois du lait
  rationale: ἕλκοντα a pour sujet les nourrissons et décrit l’action de tirer le lait au sein; τελευταῖον est rendu adverbialement, ce qui préserve l’ambiguïté entre une dernière tétée et la dernière avant la mort attendue.
