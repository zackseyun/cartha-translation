base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/031.yaml
  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
translation:
  language: fr
  text: Tous les parents qui étaient présents, ainsi que leurs enfants[a], ont préparé ce festin somptueux pour les bêtes sauvages, à la place des Juifs qui, comme cela a été démontré à mes ancêtres et à moi-même, ont fait preuve d’une fidélité entière, constante et irréprochable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est inhabituelle et signifie littéralement quelque chose comme « les descendants des enfants »; elle peut désigner plus largement les enfants ou descendants présents avec leurs parents.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « une foi entière et ferme » ou « une loyauté totale et constante ». Le grec peut aussi se comprendre ainsi : « les Juifs irréprochables, dont la fidélité entière et constante a été démontrée à mes ancêtres et à moi-même ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γονεῖς παρῆσαν
  choice: Tous les parents qui étaient présents
  rationale: Rend naturellement la totalité du groupe désigné par ὅσοι et le sens de présence exprimé par παρῆσαν.
- source_word: ἢ παίδων γόνοι
  choice: ainsi que leurs enfants
  rationale: L’expression grecque transmise est difficile et littéralement proche de « rejetons d’enfants ». Dans ce contexte, elle désigne vraisemblablement les enfants ou descendants présents avec les parents; la note conserve l’incertitude.
- source_word: θηρσὶν ἀγρίοις
  choice: pour les bêtes sauvages
  rationale: Le datif indique ici les bénéficiaires du festin; « bêtes sauvages » convient au ton tragique et élevé.
- source_word: ἐσκεύασαν δαψιλῆ θοῖναν
  choice: ont préparé ce festin somptueux
  rationale: Exprime la préparation d’un repas abondant tout en préservant l’ironie macabre de la scène.
- source_word: ἀντὶ τῶν ... Ἰουδαίων
  choice: à la place des Juifs
  rationale: 'ἀντί marque la substitution: les familles deviennent la nourriture destinée aux bêtes au lieu des Juifs.'
- source_word: ἀποδεδειγμένων
  choice: comme cela a été démontré
  rationale: Le participe parfait signale un fait établi par l’expérience aux yeux du roi et de ses ancêtres.
- source_word: ἀνεγκλήτων ... ὁλοσχερῆ βεβαίαν πίστιν ἔχων
  choice: ont fait preuve d’une fidélité entière, constante et irréprochable
  rationale: Dans ce contexte politique, πίστις désigne surtout la fidélité ou la loyauté éprouvée. La formulation française rattache naturellement ἀνεγκλήτων à cette conduite tout en rendant les qualificatifs ὁλοσχερῆ et βεβαίαν.
theological_decisions:
- issue: Sens de πίστις dans un contexte politique non doctrinal
  choice: fidélité
  alternative: foi; loyauté
  rationale: Le contexte évoque la fiabilité démontrée des Juifs envers le souverain et ses ancêtres, non principalement leur foi religieuse. « Fidélité » garde une plus grande amplitude que « loyauté », tandis que la note signale les autres valeurs possibles.
- issue: Portée grammaticale de ἀνεγκλήτων
  choice: irréprochable qualifie la fidélité manifestée
  alternative: les Juifs eux-mêmes sont irréprochables
  rationale: Le grec permet de comprendre le génitif comme qualifiant les Juifs, tandis que la proximité de la proposition sur leur πίστις autorise une formulation française centrée sur leur conduite. La note préserve l’autre rattachement.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le ton solennel et l’ironie macabre du festin, tout en clarifiant une syntaxe grecque dense sans effacer ses ambiguïtés.
