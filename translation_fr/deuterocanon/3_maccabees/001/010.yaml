  yaml_path: translation/deuterocanon/3_maccabees/001/010.yaml
  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
translation:
  language: fr
  text: Après s’être aussi émerveillé du bel ordre de l’enceinte sacrée[a], il songea à élaborer un plan pour entrer dans le sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici deux termes différents : ἱερόν pour l’ensemble de l’enceinte sacrée, et ναός pour le sanctuaire proprement dit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  choice: Après s’être aussi émerveillé
  rationale: Le participe aoriste exprime une action antérieure à la réflexion principale; « après s’être émerveillé » rend clairement cette relation sans exagérer l’émotion.
- source_word: εὐταξίαν
  choice: bel ordre
  rationale: Le nom désigne une disposition ordonnée et convenable; « bel ordre » conserve ici sa valeur positive dans un français naturel.
- source_word: ἱεροῦ
  choice: enceinte sacrée
  rationale: ἱερόν désigne largement l’ensemble du domaine sacré, par contraste avec ναός, le bâtiment saint proprement dit.
- source_word: ἐνεθυμήθη
  choice: il envisagea
  rationale: Le verbe évoque une réflexion intérieure; « envisagea » garde la nuance de délibération sans en faire une décision arrêtée.
- source_word: βουλεύσασθαι
  choice: de faire le projet
  rationale: L’infinitif ajoute une idée de délibération ou de planification, distincte du simple fait d’entrer.
- source_word: ναὸν
  choice: sanctuaire
  rationale: ναός désigne ici le bâtiment sacré proprement dit; « sanctuaire » le distingue de l’ensemble de l’enceinte sacrée.
- source_word: εἰσελθεῖν
  choice: d’entrer
  rationale: Rend directement l’infinitif de mouvement.
theological_decisions:
- issue: Distinction entre ἱερόν et ναός dans le même verset
  choice: Rendre ἱερόν par « enceinte sacrée » et ναός par « sanctuaire »
  alternative: Rendre les deux termes par « temple », ou rendre ἱερόν par « sanctuaire » et ναός par « temple »
  rationale: Le grec emploie délibérément deux noms différents. En français biblique courant, « enceinte sacrée » permet de désigner tout le complexe, tandis que « sanctuaire » désigne le bâtiment proprement dit, ce qui préserve le mouvement narratif vers son intérieur.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve l’antériorité du participe grec ainsi que la nuance délibérative de βουλεύσασθαι, tout en distinguant naturellement les deux espaces sacrés.
