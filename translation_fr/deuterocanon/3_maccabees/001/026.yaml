  naturalness: La coordination « Mais, enhardi, et après avoir… » est syntaxiquement heurtée en français moderne, notamment à cause des virgules qui isolent « enhardi » et du « et » redondant. Une formulation temporelle unifiée rend la phrase plus fluide sans rien ajouter.
