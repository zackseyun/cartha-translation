  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
translation:
  language: fr
  text: Mais certains dirent qu’il ne convenait pas d’agir ainsi[a], puisque ni les non-Juifs ni même tous les prêtres n’entraient, mais seulement le grand prêtre qui était à la tête de tous, et cela une fois par an. Pourtant, il ne se laissait nullement convaincre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il n’était pas convenable de faire cela ». Le grec souligne ce qui est approprié ou ne l’est pas.'
    reason: Alternative lexicale pour rendre la nuance de καθήκειν.
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  choice: qu’il ne convenait pas d’agir ainsi
  rationale: καθήκειν exprime ici ce qui convient ou est approprié. La tournure française rend naturellement l’action envisagée sans réduire l’objection à une simple interdiction juridique.
- source_word: τοῖς ἔθνεσιν
  choice: les non-Juifs
  rationale: Dans ce contexte d’accès au sanctuaire, ἔθνη désigne les personnes étrangères au peuple juif. « Les non-Juifs » est clair en français moderne et évite l’ambiguïté de « nations ».
- source_word: εἰσιέναι
  choice: entraient
  rationale: Le verbe signifie entrer dans un lieu. L’imparfait s’accorde avec la formulation française d’une pratique cultuelle habituelle, sans ajouter explicitement un verbe de permission.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: tous les prêtres
  rationale: Cette formulation conserve l’opposition entre l’ensemble des prêtres et le seul grand prêtre.
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  choice: seulement le grand prêtre qui les présidait tous
  rationale: προηγουμένῳ πάντων désigne celui qui est à la tête de tous. « Qui les présidait tous » restitue cette fonction de direction dans un français naturel, le pronom renvoyant aux prêtres.
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  choice: une fois par an
  rationale: Expression française usuelle qui restitue exactement la périodicité annuelle.
- source_word: οὐδαμῶς ἐπείθετο
  choice: il ne se laissait absolument pas convaincre
  rationale: Cette traduction conserve le sens passif ou moyen de πείθω et l’insistance de οὐδαμῶς, sans transformer la phrase en simple refus d’écouter.
theological_decisions:
- issue: Restrictions d’accès au sanctuaire
  choice: Présenter l’objection comme fondée sur la convenance cultuelle et sur une restriction progressive de l’accès, jusqu’au seul grand prêtre une fois par an.
  alternative: Formuler l’objection comme une interdiction générale ou strictement juridique.
  rationale: Le grec met en avant ce qui ne convient pas, puis justifie cette affirmation par les limites d’accès au sanctuaire. La traduction préserve cette progression sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Non-Juifs » privilégie l’intelligibilité courante; « grand prêtre » conserve la terminologie biblique reçue. La syntaxe reste narrative et évite les archaïsmes.
