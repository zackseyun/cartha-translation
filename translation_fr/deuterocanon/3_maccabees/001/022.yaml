  text: Along with these[a], those who had become emboldened concerning the citizens could no longer endure it when he pressed the matter completely and intended to carry out his purpose.
translation:
  language: fr
  text: En outre, ceux qui s’étaient enhardis au sujet des citoyens[a] ne le supportaient pas, alors qu’il insistait avec force et projetait de mener son dessein à exécution.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui s’étaient enhardis en faveur des citoyens ». L’expression grecque peut désigner soit le sujet à propos duquel ils s’étaient enhardis, soit leur engagement pour la cause des citoyens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύν τε τούτοις
  choice: Avec eux
  rationale: Rend sobrement la valeur additive et associative de σύν, tout en conservant le renvoi contextuel de τούτοις à des personnes ou à un groupe déjà mentionné.
- source_word: οἱ περὶ τῶν πολιτῶν θρασυνθέντες
  choice: ceux qui s’étaient enhardis au sujet des citoyens
  rationale: « S’étaient enhardis » exprime le fait d’être devenus hardis. « Au sujet des citoyens » maintient l’ambiguïté de περὶ, qui peut désigner le domaine de leur hardiesse ou suggérer qu’ils agissaient en faveur des citoyens.
- source_word: οὐκ ἠνείχοντο
  choice: ne pouvaient plus le supporter
  rationale: Cette formulation française naturelle rend l’aspect continu de l’imparfait et l’idée d’une situation devenue intolérable, sans préciser indûment l’objet sous-entendu.
- source_word: τέλεον αὐτοῦ ἐπικειμένου
  choice: puisqu’il insistait jusqu’au bout
  rationale: ἐπίκειμαι exprime ici une pression ou une insistance persistante; τέλεον en renforce le caractère total. « Jusqu’au bout » est idiomatique et évite le tour peu naturel « insistait complètement ».
- source_word: τὸ τῆς προθέσεως ἐκπληροῦν διανοουμένου
  choice: comptait mener son dessein à exécution
  rationale: La tournure rend à la fois l’intention délibérée exprimée par διανοουμένου et l’accomplissement concret de la πρόθεσις, sans lui donner une portée théologique étrangère au contexte.
