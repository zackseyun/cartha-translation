    rationale: τούτοις est au neutre pluriel et signifie ici « avec cela / en outre / avec ces choses », en liaison avec ce qui précède.
  - severity: medium
    issue: « puisqu’il insistait jusqu’au bout » ajoute une causalité et une borne temporelle.
    rationale: Le génitif absolu αὐτοῦ ἐπικειμένου est circonstanciel, et τέλεον intensifie l’insistance; le grec ne dit pas explicitement « jusqu’au bout » ni nécessairement « puisque ».
  - severity: low
    issue: « ne pouvaient plus le supporter » renforce légèrement l’imparfait négatif.
    rationale: οὐκ ἠνείχοντο exprime qu’ils ne supportaient pas / ne toléraient pas; « plus » peut être contextuellement possible, mais n’est pas requis par le verset.
  revised_text: En outre, ceux qui s’étaient enhardis au sujet des citoyens[a] ne le supportaient pas, alors qu’il insistait avec force et projetait de mener son dessein à exécution.
