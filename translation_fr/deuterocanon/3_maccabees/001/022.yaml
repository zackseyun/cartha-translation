  verdict: revise
  source_fidelity: La tournure « Avec eux » ne rend pas correctement τούτοις, neutre pluriel, qui renvoie à « ces choses / cela », non à un groupe de personnes. « Puisqu’il » impose en outre un rapport causal que le génitif absolu n’exprime pas nécessairement. « Jusqu’au bout » temporalise indûment l’adverbe τέλεον, qui intensifie ici la pression ou l’insistance.
  naturalness: Le français est globalement clair et de registre approprié. « En outre » est plus idiomatique et fidèle pour le connecteur, et « alors qu’il insistait avec force » rend naturellement la circonstance concomitante sans ajouter une conclusion temporelle ou causale.
  terminology: « Citoyens », « s’étaient enhardis », « dessein » et « mener à exécution » conviennent. La note conserve avec justesse l’ambiguïté de περὶ τῶν πολιτῶν et ne lui impose pas une interprétation partisane.
