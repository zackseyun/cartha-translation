  yaml_path: translation/deuterocanon/3_maccabees/001/021.yaml
  text: And varied was the plea of those who had gathered for this[b][a], concerning those who were being impiously handed over by him.
translation:
  language: fr
  text: La supplication de ceux qui s’étaient rassemblés dans ce but était variée[a], au sujet de ceux qui étaient livrés de manière impie par lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prenait des formes diverses ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de façon criminelle » ou « en violation de ce qui est sacré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποικίλη
  choice: diverses
  rationale: L’adjectif prédicatif indique que les supplications prenaient des formes variées; le pluriel produit une formulation française naturelle.
- source_word: δέησις
  choice: supplications
  rationale: Le terme désigne une demande pressante et solennelle, sans imposer qu’elle soit directement adressée à Dieu.
- source_word: συλλεγέντων
  choice: s’étaient rassemblés
  rationale: Cette tournure naturelle conserve la valeur antérieure de l’aoriste tout en laissant implicite l’agent éventuel du rassemblement.
- source_word: εἰς τοῦτο
  choice: dans ce but
  rationale: Rend clairement la valeur finale de l’expression grecque sans préciser davantage le but fourni par le contexte.
- source_word: ἐπὶ τοῖς ... κατεγχειρουμένοις
  choice: au sujet de ceux qu’il livrait
  rationale: «Au sujet de» conserve le rapport assez large de ἐπί avec le datif, qui peut désigner l’objet ou l’occasion des supplications.
- source_word: ἀνοσίως
  choice: d’une manière impie
  rationale: Préserve la portée morale et potentiellement religieuse de l’adverbe, qui évoque une conduite contraire à ce qui est sacré ou juste.
- source_word: κατεγχειρουμένοις
  choice: livrait
  rationale: Le verbe exprime la remise de personnes au pouvoir d’autrui; «livrer» est idiomatique et garde la force coercitive du grec.
- source_word: ὑπʼ ἐκείνου
  choice: il
  rationale: Le pronom renvoie naturellement en français à l’homme précédemment mentionné; la construction active évite une tournure passive lourde.
