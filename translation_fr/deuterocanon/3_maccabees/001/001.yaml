base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
translation:
  language: fr
  text: Philopator, ayant appris par ceux qui étaient revenus qu’Antiochos s’emparait des territoires placés sous son autorité, donna des ordres à toutes ses forces d’infanterie et de cavalerie, emmena avec lui sa sœur Arsinoé et se mit en route jusqu’à la région de Raphia, où ceux qui étaient avec Antiochos[a] avaient établi leur camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ceux autour d’Antiochos », expression qui peut désigner son entourage, son parti ou ses forces, Antiochos lui-même pouvant être inclus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ο ΔΕ
  choice: Philopator,
  rationale: δέ assure ici la progression du récit sans exiger un adverbe temporel explicite en français; la ponctuation et l’enchaînement narratif suffisent.
- source_word: Φιλοπάτωρ
  choice: Philopator
  rationale: Le nom ou titre personnel est translittéré selon l’usage français.
- source_word: παρὰ τῶν ἀνακομισθέντων
  choice: par ceux qui étaient revenus
  rationale: Le participe désigne ceux qui sont revenus; le grec ne les qualifie pas explicitement de messagers.
- source_word: τὴν γινομένην ... ἀφαίρεσιν ὑπὸ Ἀντιόχου
  choice: qu’Antiochos s’emparait
  rationale: La tournure verbale est naturelle en français et conserve l’idée d’une dépossession en cours portée par γινομένην.
- source_word: τῶν ἐπ᾽ αὐτοῦ κρατουμένων τόπων
  choice: des territoires placés sous son autorité
  rationale: La formule exprime le contrôle politique exercé par Philopator sans préciser davantage la nature juridique de cette domination.
- source_word: ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  choice: à toutes ses forces d’infanterie et de cavalerie
  rationale: Rendu militaire précis et idiomatique des troupes à pied et à cheval.
- source_word: τὴν ἀδελφὴν Ἀρσινόην συνπαραλαβών
  choice: emmena avec lui sa sœur Arsinoé
  rationale: Le verbe signifie prendre quelqu’un avec soi; «Arsinoé» suit la forme française traditionnelle du nom.
- source_word: ἐξώρμησεν
  choice: se mit en route
  rationale: Cette expression rend le départ en expédition sans accentuer indûment l’idée d’une marche militaire.
- source_word: μέχρι τῶν κατὰ Ῥαφίαν τόπων
  choice: jusqu’à la région de Raphia
  rationale: Rendu naturel de la zone située à Raphia ou dans ses environs.
- source_word: οἱ περὶ Ἀντίοχον
  choice: les hommes d’Antiochos
  rationale: Cette expression idiomatique désigne l’entourage, le parti ou les forces d’Antiochos, et peut inclure Antiochos lui-même.
- source_word: παρεμβεβλήκεισαν
  choice: avaient établi leur camp
  rationale: 'Le plus-que-parfait rend l’état résultant antérieur: ils avaient dressé leur camp et s’y trouvaient.'
