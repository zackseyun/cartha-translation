  text: And the multitude, as before, kept on with these men, pleading; but the elders around the king were trying in many ways to turn his arrogant mind away from the plot he had conceived.
translation:
  language: fr
  text: La foule continuait, comme auparavant, à les supplier. Mais les anciens qui entouraient le roi essayaient par divers moyens de détourner son esprit arrogant du complot qu’il avait médité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πλῆθος
  choice: la foule
  rationale: Rend naturellement le collectif grec désignant la masse des personnes présentes.
- source_word: ὡς ἔμπροσθεν
  choice: comme auparavant
  rationale: Reproduit directement la comparaison temporelle sans préciser davantage le contexte.
- source_word: τούτοις ἀνεστρέφετο δεόμενον
  choice: restait auprès d’eux et les suppliait
  rationale: ἀναστρέφομαι exprime ici le fait de demeurer ou de se tenir avec ces hommes; le participe δεόμενον indique les supplications continues de la foule.
- source_word: οἱ ... πρεσβύτεροι
  choice: les anciens
  rationale: Conserve le terme institutionnel ou honorifique sans le réduire explicitement à l’âge biologique.
- source_word: πολλαχῶς ἐπειρῶντο
  choice: essayaient par tous les moyens
  rationale: Formulation française idiomatique exprimant les tentatives multiples suggérées par l’adverbe.
- source_word: τὸν ἀγέρωχον αὐτοῦ νοῦν
  choice: son esprit arrogant
  rationale: Préserve le jugement négatif porté par ἀγέρωχος et la référence au dessein intérieur du roi.
- source_word: τῆς ἐντεθυμημένης ἐπιβουλῆς
  choice: du complot qu’il avait conçu
  rationale: ἐπιβουλή désigne un projet hostile ou perfide, tandis que ἐνθυμέομαι souligne qu’il a été médité ou conçu intérieurement.
