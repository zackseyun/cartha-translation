revisions:
- from: Quand le combat devint acharné et que la situation tourna davantage à l’avantage d’Antiochos, Arsinoé parcourut les rangs et exhorta vivement les soldats, avec compassion et larmes, les cheveux défaits, à combattre courageusement pour eux-mêmes, leurs enfants et leurs femmes. Elle promettait de donner à chacun, s’ils remportaient la victoire, deux mines d’or[a].
  to: Quand le combat devint acharné et que la situation tourna davantage à l’avantage d’Antiochos, Arsinoé parcourut les rangs et exhorta vivement les soldats, avec compassion et larmes, les cheveux défaits, à venir courageusement à leur propre secours ainsi qu’à celui de leurs enfants et de leurs femmes. Elle promettait de donner deux mines d’or à chacun des vainqueurs[a].
  rationale: La révision rétablit le sens premier de βοηθεῖν sans exclure le cadre militaire et reformule la promesse pour exprimer naturellement que chaque vainqueur recevrait deux mines d'or. Aucun changement de sens historique ou théologique n'est introduit.
