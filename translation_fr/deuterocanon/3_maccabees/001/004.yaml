base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
translation:
  language: fr
  text: Quand le combat devint acharné et que la situation tourna davantage à l’avantage d’Antiochos, Arsinoé parcourut les rangs et exhorta vivement les soldats, avec compassion et larmes, les cheveux défaits, à venir courageusement à leur propre secours ainsi qu’à celui de leurs enfants et de leurs femmes. Elle promettait de donner deux mines d’or à chacun des vainqueurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mine était une ancienne unité de poids et de valeur monétaire.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ καρτερᾶς μάχης
  choice: Quand le combat devint acharné
  rationale: Le génitif absolu pose la circonstance de fond; « acharné » exprime naturellement l’intensité de καρτερά dans un contexte militaire.
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  choice: la situation tourna davantage à l’avantage d’Antiochos
  rationale: « La situation » rend le sens large de πράγματα; « davantage » conserve μᾶλλον, tandis que la tournure française exprime le progrès des événements en faveur d’Antiochos.
- source_word: ἱκανῶς ... παρεκάλει
  choice: exhorta vivement
  rationale: Dans ce contexte, ἱκανῶς intensifie l’exhortation plutôt qu’il ne marque une simple suffisance.
- source_word: ἐπιπορευσαμένη τὰς δυνάμεις
  choice: parcourut les rangs
  rationale: La formule décrit son déplacement au milieu des forces armées; elle n’impose pas clairement l’idée d’une action répétée.
- source_word: μετὰ οἴκτου καὶ δακρύων
  choice: avec compassion et larmes
  rationale: Cette traduction conserve l’émotion de l’appel sans préciser indûment si la compassion est éprouvée par Arsinoé ou suscitée chez les soldats.
- source_word: τοὺς πλοκάμους λελυμένη
  choice: les cheveux défaits
  rationale: Expression française naturelle qui garde le geste visible de détresse ou de supplication.
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  choice: à combattre courageusement pour eux-mêmes, leurs enfants et leurs femmes
  rationale: Dans la situation militaire, « combattre pour » rend idiomatiquement l’appel à venir à leur propre secours et à celui de leurs familles, sans réduire l’action à la seule défense.
- source_word: νικήσασιν ἑκάστῳ δύο μνᾶς χρυσίου
  choice: de donner à chacun, s’ils remportaient la victoire, deux mines d’or
  rationale: Le participe aoriste exprime ici la condition attachée à la récompense; « mines » conserve l’unité antique plutôt que de proposer une conversion incertaine.
