review_pass:
  verdict: revise
  source_fidelity: Le sens global est bien rendu, y compris l'intensification du combat, l'avantage croissant d'Antiochos, l'appel émotionnel d'Arsinoé et la récompense en mines d'or. Toutefois, « combattre courageusement pour » interprète βοηθεῖν (« venir au secours de, aider ») de façon plus étroite que le grec. La formulation de la condition, « à chacun, s’ils remportaient la victoire », produit aussi une discordance entre le distributif singulier et le pronom pluriel.
  naturalness: Le français est moderne, clair et d'un registre approprié. « Parcourut les rangs » et « les cheveux défaits » sont naturels. Une légère réorganisation de la fin permet une phrase plus fluide et une condition de victoire non ambiguë.
  terminology: Les noms « Antiochos » et « Arsinoé » sont appropriés en français. « Mines d'or » conserve correctement l'unité antique sans conversion anachronique. La note culturelle est adéquate.
  issues:
  - severity: medium
    issue: « à combattre courageusement pour eux-mêmes, leurs enfants et leurs femmes »
    rationale: βουηθεῖν signifie d'abord « aider, porter secours »; le contexte militaire permet l'implication du combat, mais ne requiert pas de remplacer ce verbe par « combattre ». Une formulation conservant l'idée de secours est plus fidèle.
  - severity: low
    issue: « à chacun, s’ils remportaient la victoire »
    rationale: Le grec associe ἑκάστῳ au participe νικήσασιν, c'est-à-dire une récompense pour chaque vainqueur. En français, le singulier « chacun » suivi de « ils » est maladroit; « à chacun des vainqueurs » rend la relation clairement.
  revised_text: Quand le combat devint acharné et que la situation tourna davantage à l’avantage d’Antiochos, Arsinoé parcourut les rangs et exhorta vivement les soldats, avec compassion et larmes, les cheveux défaits, à venir courageusement à leur propre secours ainsi qu’à celui de leurs enfants et de leurs femmes. Elle promettait de donner deux mines d’or à chacun des vainqueurs[a].
