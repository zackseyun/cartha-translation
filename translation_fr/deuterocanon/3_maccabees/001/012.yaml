base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/012.yaml
  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
translation:
  language: fr
  text: 'Même après qu’on lui eut lu la Loi, il ne cessait pas pour autant de soutenir qu’il devait entrer. Il disait : « Même s’ils ont été privés de cet honneur, moi, je ne dois pas l’être[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour moi, il ne doit pas en être ainsi ». Le grec est elliptique : littéralement, « mais moi, il ne faut pas » ou « mais pour moi, cela ne doit pas être ».'
    reason: L’expression finale omet le complément implicite et permet plusieurs formulations françaises proches.
lexical_decisions:
- source_word: τοῦ ... νόμου
  choice: la Loi
  rationale: Dans ce contexte, νόμος désigne la règle religieuse juive qui venait d’être invoquée. La majuscule indique cette référence précise sans réduire le terme à une simple coutume.
- source_word: παραναγνωσθέντος
  choice: après qu’on lui eut lu
  rationale: Le participe évoque la lecture du texte devant l’intéressé. Cette formulation française rend naturellement l’antériorité et le fait que la Loi lui a été présentée oralement.
- source_word: οὐδ᾽ ὣς ἀπέλειπεν
  choice: il ne cessait pas pour autant
  rationale: La tournure garde à la fois la concession de οὐδ᾽ ὣς et la persistance durative exprimée par l’imparfait ἀπέλειπεν.
- source_word: προφερόμενος
  choice: de soutenir
  rationale: Ici, le participe décrit l’affirmation persistante d’une prétention. « Soutenir » est naturel et dignifié, sans accentuer indûment l’idée de répétition.
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  choice: qu’il devait entrer
  rationale: δεῖ exprime ici, dans la bouche du personnage, une nécessité revendiquée ou un droit allégué. « Devait entrer » conserve cette force sans imposer une nuance extérieure d’obligation.
- source_word: ἐστέρηνται
  choice: ont été privés
  rationale: Le parfait passif présente les personnes concernées comme se trouvant privées de cet honneur. Le passé composé passif est direct et fidèle en français moderne.
- source_word: ταύτης τῆς τιμῆς
  choice: de cet honneur
  rationale: « Honneur » rend directement τιμή et préserve la dimension de dignité ou de privilège attachée à l’accès.
- source_word: ἐμὲ δὲ οὐ δεῖ
  choice: moi, je ne dois pas l’être
  rationale: Le grec est elliptique et sous-entend le prédicat « être privé de cet honneur ». La traduction complète minimalement la phrase en français tout en signalant une autre lecture possible en note.
