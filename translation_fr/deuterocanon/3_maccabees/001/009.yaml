base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/009.yaml
  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
translation:
  language: fr
  text: Après avoir été conduit à Jérusalem, il offrit un sacrifice au Dieu fidèle[a], lui rendit grâce et fit encore quelque chose en faveur du lieu[b] ; de fait, lorsqu’il se trouva dans ce lieu[c], il fut frappé d’étonnement par sa dignité et sa piété,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Dieu digne de confiance ». L’adjectif grec peut exprimer la fidélité ou le fait d’être digne de confiance.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec reste indéterminé : il ne précise pas quel acte supplémentaire fut accompli en faveur du lieu.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire le site sacré de Jérusalem, probablement l’enceinte du Temple. Le grec dit simplement « le lieu ».
    reason: cultural_note
lexical_decisions:
- source_word: διακομισθεὶς
  choice: après avoir été conduit
  rationale: Le participe passif exprime un déplacement effectué sous la conduite ou par l’action d’autrui, et non une simple arrivée. Cette formulation reste naturelle sans préciser le moyen de transport.
- source_word: θύσας
  choice: il offrit un sacrifice
  rationale: Le verbe désigne explicitement un acte sacrificiel. La tournure française est claire et adaptée au contexte cultuel.
- source_word: τῷ πιστῷ θεῷ
  choice: au Dieu fidèle
  rationale: πιστός signifie ici « fidèle » ou « digne de confiance ». « Dieu fidèle » rend directement l’adjectif sans le remplacer par l’interprétation plus large « vrai Dieu ».
- source_word: χάριτας ἀποδιδοὺς
  choice: lui rendit grâce
  rationale: L’expression grecque signifie littéralement rendre ou témoigner des remerciements. « Rendre grâce » est idiomatique en français et convient au cadre religieux.
- source_word: τῶν ἑξῆς τι
  choice: encore quelque chose
  rationale: La formule est comprimée et indéfinie. La traduction conserve l’imprécision de τι ainsi que l’idée d’un acte supplémentaire, sans en inventer la nature.
- source_word: τῷ τόπῳ ποιήσας
  choice: fit ... en faveur du lieu
  rationale: Le datif indique vraisemblablement une action accomplie pour le lieu ou à son bénéfice. La formulation demeure volontairement générale comme le grec.
- source_word: τὸν τόπον
  choice: ce lieu
  rationale: Le contexte renvoie probablement au sanctuaire ou à l’enceinte du Temple, mais le grec emploie simplement τόπος. « Ce lieu » préserve cette retenue lexicale.
- source_word: τῇ σπουδαιότητι
  choice: sa dignité
  rationale: σπουδαιότης peut exprimer le sérieux, l’importance ou la dignité. Dans ce contexte sacré, « dignité » communique la valeur solennelle du lieu sans réduire le terme à sa splendeur matérielle.
- source_word: εὐσεβείᾳ
  choice: sa piété
  rationale: εὐσέβεια désigne la piété, la dévotion ou le respect religieux. Le choix littéral « piété » préserve l’expression grecque, même si son application au lieu demeure inhabituelle en français.
- source_word: καταπληγείς
  choice: il fut saisi d’étonnement
  rationale: Le verbe indique une impression forte pouvant aller jusqu’à la stupeur. Cette expression restitue son intensité sans ajouter explicitement la notion de crainte révérencielle.
theological_decisions:
- issue: Sens de πιστῷ appliqué à Dieu
  choice: le Dieu fidèle
  alternative: le Dieu digne de confiance ; le vrai Dieu
  rationale: « Fidèle » correspond directement au sens de πιστός et n’introduit pas l’affirmation distincte que porterait « vrai Dieu ». Une note signale l’autre nuance lexicale possible.
- issue: Identification du « lieu »
  choice: le lieu
  alternative: le Temple ; le sanctuaire
  rationale: Le contexte désigne vraisemblablement le site sacré de Jérusalem, mais le texte dit seulement τόπος. L’explicitation est donc réservée à une note.
- issue: Attribution de la piété au lieu
  choice: sa dignité et sa piété
  alternative: la dignité et la piété qui y régnaient ; son caractère digne et sacré
  rationale: Le grec coordonne σπουδαιότης et εὐσέβεια sans préciser davantage leur rapport au lieu. La traduction conserve cette formulation tendue plutôt que de la résoudre en « sainteté » ou de l’attribuer explicitement aux personnes présentes.
translation_notes:
  register: Français moderne, digne et accessible. Les participes grecs ont été répartis en propositions verbales pour éviter une période française pesante, tout en conservant la progression des actions. La virgule finale maintient le caractère syntaxiquement inachevé du verset grec, qui se poursuit dans le contexte.
