  text: Et de la clameur très dense et tendue qui montait des foules s’éleva un tumulte indescriptible.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυκνοτάτης
  choice: extrêmement compacte
  rationale: Le superlatif de πυκνός évoque ici à la fois la concentration de la foule et la masse sonore produite; « extrêmement compacte » conserve cette image inhabituelle.
- source_word: ἐμπόνου
  choice: pénible
  rationale: L’adjectif exprime l’effort, la peine ou la tension; appliqué à la clameur, « pénible » laisse entendre qu’elle est poussée avec effort, sans préciser davantage la nature de cette peine.
- source_word: τῶν ὄχλων
  choice: les foules
  rationale: Le pluriel grec est conservé dans une expression française courante.
- source_word: συναγομένης
  choice: faisaient monter
  rationale: Le participe signifie littéralement que la clameur se rassemble ou prend corps; « faisaient monter » rend naturellement son amplification collective.
- source_word: κραυγῆς
  choice: clameur
  rationale: κραυγή désigne un cri puissant; « clameur » convient à de nombreuses voix réunies.
- source_word: ἀνείκαστός
  choice: indescriptible
  rationale: Le terme désigne ce qui ne peut être représenté, comparé ou adéquatement imaginé; dans ce contexte sonore, « indescriptible » est naturel et fidèle.
- source_word: βοή
  choice: tumulte
  rationale: βοή désigne une forte manifestation vocale ou un vacarme. « Tumulte » distingue le résultat sonore de la « clameur » précédente tout en gardant l’idée d’un grand bruit collectif.
- source_word: τις
  choice: un
  rationale: L’indéfini grec nuance l’énoncé; en français, l’article indéfini suffit naturellement devant « tumulte indescriptible ».
