lexical_decisions:
- source_word: οἱ κατὰ τὴν πόλιν ἀπολειπόμενοι
  choice: Ceux qui étaient restés dans la ville
  rationale: Cette formulation naturelle conserve l’idée de personnes demeurées sur place, sans imposer le sens plus marqué d’un abandon délibéré.
- source_word: ταραχθέντες
  choice: furent bouleversés
  rationale: Le participe aoriste passif exprime l’agitation provoquée par les événements; « bouleversés » restitue cette réaction sans exagérer nécessairement l’idée de panique.
- source_word: ἐξεπήδησαν
  choice: se précipitèrent dehors
  rationale: Le verbe indique un mouvement soudain vers l’extérieur; cette expression française en préserve la vivacité.
- source_word: ἄδηλον τιθέμενοι τὸ γινόμενον
  choice: ne sachant pas clairement ce qui se passait
  rationale: La formulation conserve l’idée littérale qu’ils tenaient l’événement en cours pour obscur ou indéterminé, tout en restant idiomatique en français.
