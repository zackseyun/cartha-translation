base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
translation:
  language: fr
  text: Les mères et les nourrices[a], elles aussi, laissant leurs nouveau-nés, les unes dans leurs maisons, les autres dans les rues, affluaient sans se retourner vers le sanctuaire suprêmement élevé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nourrices allaitantes » ; le terme grec peut désigner spécialement des femmes qui allaitent des nourrissons.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple très élevé » ou « le sanctuaire souverainement exalté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νεογνά
  choice: nouveau-nés
  rationale: Le terme désigne de très jeunes enfants, probablement des nouveau-nés; cette formulation française est naturelle et conserve la force pathétique du passage.
- source_word: τιθηνοί
  choice: nourrices
  rationale: Le mot désigne des femmes chargées de nourrir et de soigner les petits enfants, souvent des nourrices allaitantes; « nourrices » convient au registre ancien sans être obscur.
- source_word: παραλείπουσαι
  choice: laissèrent
  rationale: Le participe exprime le fait de laisser derrière soi, sans imposer le jugement moral plus fort que véhiculerait « abandonnèrent ».
- source_word: ἄλλως καὶ ἄλλως
  choice: les unes… les autres…
  rationale: La tournure distributive est explicitée par les deux compléments qui suivent; cette formulation restitue naturellement la structure grecque.
- source_word: ἀγυιάς
  choice: rues
  rationale: Le terme renvoie ici aux voies publiques de la ville; « rues » est l'équivalent moderne le plus clair.
- source_word: ἀνεπιστρέπτως
  choice: sans se retourner
  rationale: Cette expression conserve l'image littérale d'un mouvement résolu, sans retour en arrière.
- source_word: πανυπέρτατον
  choice: suprêmement élevé
  rationale: Le composé intensif qualifie le sanctuaire comme élevé au plus haut degré; cette traduction préserve la rhétorique sans transformer l'adjectif en titre divin.
- source_word: ἱερόν
  choice: sanctuaire
  rationale: Le mot peut désigner le temple ou son enceinte sacrée; « sanctuaire » maintient cette latitude.
- source_word: ἠθροίζοντο
  choice: affluèrent
  rationale: L'imparfait grec dépeint un rassemblement collectif en cours; « affluèrent » rend naturellement le mouvement convergent vers le sanctuaire.
theological_decisions:
- issue: Sens de πανυπέρτατον ἱερόν
  choice: le sanctuaire suprêmement élevé
  alternative: le très-haut temple / le sanctuaire souverainement exalté
  rationale: La formule relève d'une rhétorique cultuelle intensive. La traduction choisie garde le superlatif tout en évitant de faire de « Très-Haut » un titre divin qui n'est pas explicitement appliqué ici.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe a été légèrement restructurée pour clarifier que les mères et les nourrices laissent les nouveau-nés en divers lieux avant de converger vers le sanctuaire; la note [a] conserve la nuance possible de l'allaitement et la note [b] l'ambiguïté de la formule cultuelle intensive.
