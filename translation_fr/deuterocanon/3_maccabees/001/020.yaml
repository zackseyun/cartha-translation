revisions:
- from: Quant aux mères et aux nourrices qui les accompagnaient[a], elles laissèrent leurs nouveau-nés, les unes dans les maisons, les autres dans les rues, et affluèrent sans se retourner vers le sanctuaire suprêmement élevé[b].
  to: Les mères et les nourrices[a], elles aussi, laissant leurs nouveau-nés, les unes dans leurs maisons, les autres dans les rues, affluaient sans se retourner vers le sanctuaire suprêmement élevé[b].
  rationale: La révision supprime l'ajout sémantique introduit par « qui les accompagnaient » et rend πρὸς τούτοις par « elles aussi ». Elle rétablit également l'aspect en cours du récit grec, tout en conservant les choix lexicaux sûrs et les deux ancres de note.
