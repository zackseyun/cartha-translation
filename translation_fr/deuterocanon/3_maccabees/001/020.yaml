    text: Ou « nourrices allaitantes » ; le terme grec peut désigner spécialement des femmes qui allaitent des nourrissons.
    reason: lexical_alternative
  - marker: b
    text: Ou « le temple très élevé » ou « le sanctuaire souverainement exalté ».
    reason: lexical_alternative
