  register: Français international moderne, narratif et digne. La construction grecque à l’accusatif avec infinitifs est reformulée naturellement, tout en maintenant le parallélisme entre l’anéantissement des adversaires et la capture de nombreux combattants. Le marqueur de note est placé après le terme qu’il explique.
