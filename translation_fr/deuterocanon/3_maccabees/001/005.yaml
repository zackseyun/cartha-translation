  text: And so it happened that the opponents were destroyed in hand-to-hand combat[a], and many were also captured as prisoners of war.
translation:
  language: fr
  text: C’est ainsi que les adversaires furent anéantis dans des combats au corps à corps, et que beaucoup furent aussi faits prisonniers de guerre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « captifs pris par la lance » ; expression militaire désignant des prisonniers de guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: C’est ainsi que
  rationale: Cette tournure française naturelle exprime l’issue indiquée par la formule narrative impersonnelle grecque, sans alourdir la phrase par « il arriva que ».
- source_word: ἀντιπάλους
  choice: les adversaires
  rationale: Le mot désigne ceux qui se trouvent opposés à l’autre camp; « adversaires » en conserve la portée sans imposer le collectif singulier « l’ennemi ».
- source_word: ἐν χειρονομίαις
  choice: dans des combats au corps à corps
  rationale: Dans ce contexte militaire, l’expression renvoie à des affrontements rapprochés; cette formulation est claire et idiomatique en français moderne.
- source_word: διαφθαρῆναι
  choice: furent anéantis
  rationale: En contexte de bataille, le verbe décrit la destruction des adversaires. « Anéantis » conserve cette force sans réduire explicitement le sens au seul fait d’être tués.
- source_word: πολλούς
  choice: beaucoup
  rationale: Rendu quantitatif direct et naturel, employé substantivement comme dans le grec.
- source_word: δοριαλώτους
  choice: prisonniers de guerre
  rationale: Ce terme militaire désigne littéralement des captifs pris par la lance; « prisonniers de guerre » en donne le sens idiomatique, tandis que l’image grecque est signalée en note.
- source_word: συλλημφθῆναι
  choice: furent faits prisonniers
  rationale: Le passif grec exprime la capture; cette tournure française s’accorde naturellement avec « prisonniers de guerre » et reste parallèle à « furent anéantis ».
