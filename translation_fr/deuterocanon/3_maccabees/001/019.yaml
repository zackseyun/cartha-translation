  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
translation:
  language: fr
  text: Nous avons foulé aux pieds la maison consacrée[a], comme sont foulées aux pieds les maisons des abominations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de la consécration ». On peut aussi comprendre : « la maison de la sainteté » ou « le sanctuaire ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec, très rare, peut aussi désigner des choses vouées à la destruction, maudites ou détestables.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν / καταπατοῦνται
  choice: avons foulé aux pieds / sont foulées aux pieds
  rationale: Cette formulation conserve l’image concrète et violente du piétinement ainsi que le parallèle entre l’aoriste actif et le présent passif grecs, sans réduire le geste à la seule idée de profanation.
- source_word: τὸν οἶκον τοῦ ἁγιασμοῦ
  choice: la maison consacrée
  rationale: « Maison » rend directement οἶκος, tandis que « consacrée » exprime naturellement en français la qualité sacrée indiquée par ἁγιασμός. La note conserve les formulations plus littérales et l’identification possible au sanctuaire.
- source_word: ὡς
  choice: comme
  rationale: « Comme » introduit simplement et fidèlement la comparaison.
- source_word: οἱ οἶκοι τῶν προσολοθρευμάτων
  choice: les maisons des abominations
  rationale: Cette traduction maintient le parallélisme des deux « maisons » et rend par « abominations » la forte valeur péjorative et probablement cultuelle du terme grec rare, tout en signalant son incertitude lexicale en note.
theological_decisions:
- issue: Identification explicite de la maison sacrée
  choice: la maison consacrée
  alternative: la maison de la consécration ; la maison de sainteté ; le sanctuaire ; le Temple
  rationale: Le grec présente l’édifice par une périphrase révérencielle plutôt que par le mot usuel pour « temple ». Le texte français garde « maison » et sa qualité sacrée sans imposer dans le corps du verset une identification plus explicite.
- issue: Sens du rare προσολοθρευμάτων
  choice: abominations
  alternative: choses vouées à la destruction ; choses maudites ; choses détestables
  rationale: Le contexte oppose la maison consacrée à des maisons associées à ce qui est odieux ou maudit. « Abominations » préserve la force cultuelle et morale du contraste, tandis que la note reconnaît l’incertitude du terme.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Fouler aux pieds » restitue l’image biblique avec naturel ; la répétition de « maisons » et de « foulées aux pieds » conserve le parallélisme accusateur du grec.
