  text: And after doing this, and distributing gifts to the sanctuaries, he made those under his rule confident.
translation:
  language: fr
  text: Après avoir fait cela et réparti des dons aux sanctuaires, il rendit confiants ceux qui étaient sous son autorité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  choice: Après avoir fait cela
  rationale: Le participe aoriste marque une action antérieure au verbe principal. « Après avoir fait cela » restitue clairement la succession et le démonstratif renvoie à l’action précédente.
- source_word: τοῖς τεμένεσι
  choice: entre les sanctuaires
  rationale: τέμενος désigne un lieu ou une enceinte consacrée. « Sanctuaires » conserve cette portée sans réduire le terme à un bâtiment cultuel précis; « entre » convient à la répartition de dons à plusieurs bénéficiaires.
- source_word: δωρεὰς ἀπονείμας
  choice: réparti des dons
  rationale: δωρεά désigne des dons ou bienfaits, tandis que ἀπονέμω exprime leur attribution ou leur distribution. Cette formulation reste naturelle et n’ajoute pas une nuance sacrificielle absente du grec.
- source_word: εὐθαρσεῖς
  choice: confiants
  rationale: L’adjectif décrit des personnes rassurées, pleines d’assurance ou de courage. « Confiants » rend ici l’état produit sans archaïsme.
- source_word: τοὺς ὑποτεταγμένους
  choice: ceux qui étaient sous son autorité
  rationale: Le participe parfait passif désigne ceux qui ont été placés sous une autorité. La formulation explicite le rapport de subordination sans imposer le statut politique plus précis de « sujets ».
- source_word: κατέστησεν
  choice: il rendit
  rationale: Dans cette construction, καθίστημι signifie faire entrer ou maintenir quelqu’un dans un certain état. « Il rendit confiants » reproduit ce sens causatif.
