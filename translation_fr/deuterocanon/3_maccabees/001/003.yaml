base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
translation:
  language: fr
  text: Alors qu’il le conduisait, Dôsithée, dit fils de Drimylos[a], Juif de naissance mais ayant ensuite changé de pratiques[b] et s’étant détourné des convictions de ses ancêtres, plaça dans la tente un homme sans importance[c], à sa place. Il arriva que cet homme subit le châtiment de celui-là[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dôsithée, appelé fils de Drimylos ». Le grec donne probablement un patronyme.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ayant changé les usages prescrits ». Il s’agit vraisemblablement des coutumes et observances religieuses héritées.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un homme inconnu » ou « un homme obscur ». « À sa place » est explicité d’après le contexte.'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « le châtiment de celui-là ». « Celui-là » renvoie à Dôsithée.'
    reason: ambiguity
lexical_decisions:
- source_word: διάγων
  choice: fit coucher
  rationale: La construction grecque est difficile, mais l’action principale est exprimée par κατέκλινεν. En français, « fit coucher » rend concrètement le placement du substitut dans la tente sans donner à διάγων une valeur autonome trop assurée.
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  choice: Dôsithée, celui qu’on appelait fils de Drimylos
  rationale: Le génitif Δριμύλου désigne très probablement un patronyme. La formulation conserve toutefois le caractère indirect de λεγόμενος, « appelé ».
- source_word: τὸ γένος Ἰουδαῖος
  choice: Juif de naissance
  rationale: τὸ γένος indique ici l’origine familiale ou ethnique, par contraste avec l’abandon ultérieur des usages ancestraux.
- source_word: μεταβαλὼν τὰ νόμιμα
  choice: avait ensuite changé de pratiques
  rationale: τὰ νόμιμα vise les usages normatifs et les observances héritées, et non simplement une législation abstraite. « Pratiques » est naturel et maintient la portée religieuse dans le contexte.
- source_word: τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  choice: s’était détourné des convictions de ses ancêtres
  rationale: ἀπαλλοτριόω exprime l’éloignement ou l’aliénation, tandis que δόγματα désigne ici les principes ou convictions transmis. La traduction reste actuelle sans introduire une catégorie doctrinale postérieure.
- source_word: ἄσημόν τινα
  choice: un homme sans importance
  rationale: ἄσημος peut désigner quelqu’un qui n’a ni marque distinctive ni renommée. « Sans importance » rend bien son insignifiance sociale, tout en signalant en note l’autre possibilité « inconnu ».
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  choice: fit coucher à sa place dans la tente
  rationale: κατακλίνω signifie faire étendre ou coucher. « À sa place » explicite la substitution imposée par le contexte, mais absente des mots grecs eux-mêmes; cette explicitation est donc signalée en note.
- source_word: ὃν συνέβη κομίσασθαι τὴν ἐκείνου κόλασιν
  choice: Il arriva que cet homme subit le châtiment destiné à Dôsithée
  rationale: συνέβη marque l’issue survenue, κομίσασθαι signifie ici recevoir ou subir, et ἐκείνου renvoie à Dôsithée. « Destiné à » exprime naturellement la substitution punitive, avec une note préservant le sens plus littéral de possession.
theological_decisions:
- issue: Caractérisation de l’abandon des traditions juives par Dôsithée
  choice: « avait ensuite changé de pratiques et s’était détourné des convictions de ses ancêtres »
  alternative: « avait changé les prescriptions et était devenu étranger aux doctrines ancestrales »
  rationale: Le grec porte une appréciation négative sur l’abandon d’usages et de convictions hérités. Le rendu choisi conserve cette force sans transformer νόμιμα en code légal abstrait ni δόγματα en système dogmatique tardif.
- issue: Nature du châtiment subi par le substitut
  choice: « le châtiment destiné à Dôsithée »
  alternative: « le châtiment de celui-ci »
  rationale: Le contexte présente l’homme placé dans la tente comme substitut de Dôsithée. « Destiné à » clarifie cette relation, tandis que la note conserve la formulation possessive plus littérale et son éventuelle ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement réorganisées pour éviter une longue accumulation participiale. Le nom Δωσίθεος est rendu « Dôsithée », forme française traditionnelle, et Δρίμυλος par « Drimylos », translittération claire. Toutes les explicitations contextuelles importantes sont signalées en note.
