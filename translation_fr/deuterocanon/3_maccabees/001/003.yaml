revisions:
- from: Dôsithée, celui qu’on appelait fils de Drimylos[a], Juif de naissance, mais qui avait ensuite changé de pratiques[b] et s’était détourné des convictions de ses ancêtres, fit coucher à sa place dans la tente un homme sans importance[c]. Il arriva que cet homme subit le châtiment destiné à Dôsithée[d].
  to: Alors qu’il le conduisait, Dôsithée, dit fils de Drimylos[a], Juif de naissance mais ayant ensuite changé de pratiques[b] et s’étant détourné des convictions de ses ancêtres, plaça dans la tente un homme sans importance[c], à sa place. Il arriva que cet homme subit le châtiment de celui-là[d].
  rationale: La révision rétablit la proposition participiale τοῦτον ... διάγων, omise dans le projet, en conservant son référent contextuel sous la forme non interprétative « le ». Elle rend κατέκλινεν par « plaça » et maintient en note l’explicitation contextuelle « à sa place ». Le possessif grec τὴν ἐκείνου κόλασιν est conservé dans le texte (« le châtiment de celui-là »), plutôt que résolu par « destiné à Dôsithée ».
