    issue: Omission de τοῦτον δὲ διάγων
    rationale: Le projet ne traduit pas le participe διάγων ni son objet τοῦτον. Même si le référent de τοῦτον dépend du verset précédent, il faut conserver la relation « tandis qu’il le conduisait/escortait », sans préciser qui est cet homme.
  - severity: low
    issue: « Fit coucher » peut indûment souligner une causation distincte
    rationale: κατέκλινεν décrit l’action de placer/coucher l’homme dans la tente. « Plaça » est plus naturel en français et ne perd pas l’implication narrative de substitution, qui reste signalée en note.
