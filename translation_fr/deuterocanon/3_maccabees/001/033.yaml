  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
translation:
  language: fr
  text: Ils avaient été formés à obtenir de l’aide[a]. Ils avaient en horreur ceux qui se détournaient d’eux, les considéraient comme des ennemis de la nation et les privaient de relations sociales ordinaires et d’avantages pratiques[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du soutien » ou « de l’assistance » pour « de l’aide » (ἀντιλήψεως).
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque évoque l’exclusion des relations sociales habituelles ainsi que des avantages ou facilités pratiques liés à la vie en communauté. La nuance exacte de εὐχρηστία demeure large.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνπαιδεῖς … καθηστήκεισαν
  choice: ils avaient été formés
  rationale: L’expression décrit un état acquis par une formation antérieure. « Avaient été formés » rend naturellement la valeur résultative du plus-que-parfait sans alourdir la phrase.
- source_word: ἀντιλήψεως τεύξεσθαι
  choice: à obtenir du soutien
  rationale: Avec le génitif, τεύγχανω exprime ici l’obtention; ἀντίληψις désigne largement l’aide, l’appui ou le soutien, sans préciser qu’il s’agit d’un secours matériel.
- source_word: ἀποχωροῦντας ἐξ αὐτῶν
  choice: ceux qui se détournaient d’eux
  rationale: Le participe évoque un éloignement du groupe. « Se détournaient d’eux » conserve la dimension relationnelle plutôt qu’un simple départ spatial.
- source_word: ἐβδελύσσοντο
  choice: avaient en horreur
  rationale: Cette expression française actuelle et digne restitue la forte répulsion exprimée par le verbe grec.
- source_word: πολεμίους τοῦ ἔθνους
  choice: des ennemis de la nation
  rationale: La formule garde la force politique et communautaire de πολέμιος et le sens collectif de ἔθνος.
- source_word: κοινῆς συναναστροφῆς
  choice: des relations ordinaires
  rationale: Le syntagme désigne la fréquentation et les rapports sociaux partagés au sein de la communauté; cette formulation est plus idiomatique que « association commune ».
- source_word: εὐχρηστίας
  choice: des services mutuels
  rationale: Dans ce contexte social, le terme renvoie à l’utilité pratique ou aux bons offices accessibles dans la vie commune. « Services mutuels » exprime cette participation bénéfique tout en laissant une note signaler l’incertitude lexicale.
- source_word: ἐστέροῦν
  choice: les privaient
  rationale: Le verbe signifie retirer ou refuser à quelqu’un ce dont il jouissait et régit ici les deux réalités sociales coordonnées.
theological_decisions:
- issue: Identité collective exprimée par ἔθνος
  choice: nation
  alternative: peuple
  rationale: « Nation » maintient la dimension collective et sociopolitique de l’identité juive dans ce passage, sans y ajouter une conception nationale moderne particulière.
- issue: Portée de κοινῆς συναναστροφῆς καὶ εὐχρηστίας
  choice: relations ordinaires et services mutuels
  alternative: vie sociale commune et utilité pratique
  rationale: Le grec décrit une exclusion des rapports sociaux habituels et des avantages pratiques de la vie communautaire. La traduction ne transforme pas cette exclusion sociale en catégorie ecclésiale ou doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase grecque longue est divisée en deux phrases pour plus de clarté. Les termes forts de rejet et d’hostilité sont conservés, tandis que la formulation de la dernière paire nominale privilégie un français idiomatique sans effacer son imprécision contextuelle.
