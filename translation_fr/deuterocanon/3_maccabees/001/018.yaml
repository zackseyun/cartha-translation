lexical_decisions:
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Rend naturellement en français la finalité négative exprimée par ἵνα μή.
- source_word: καυχήσωνται
  choice: ne se vantent pas
  rationale: Exprime l’affirmation orgueilleuse de soi tout en gardant un registre courant et digne.
- source_word: οἱ παράνομοι
  choice: ceux qui méprisent la Loi
  rationale: Préserve le rapport explicite à la loi contenu dans παράνομοι, avec une formulation française naturelle; la majuscule indique ici la Loi comme norme divine dans le contexte.
- source_word: ἐν θυμῷ αὐτῶν
  choice: dans leur fureur
  rationale: θυμός désigne ici une colère intense; « fureur » en conserve la force sans atténuation.
- source_word: μηδὲ
  choice: et n’… pas
  rationale: Coordonne naturellement en français le second élément de la finalité négative.
- source_word: ἀγαλλιάσωνται
  choice: n’exultent pas
  rationale: Conserve l’idée d’une jubilation démonstrative et le registre élevé du verbe grec.
- source_word: ἐν ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: dans l’arrogance de leur langue
  rationale: Traduction proche du grec qui maintient l’image vive de la langue pour désigner les paroles insolentes.
- source_word: λέγοντες
  choice: 'en disant :'
  rationale: Introduit directement la citation qui suit; les deux-points signalent que la phrase se poursuit au verset suivant.
theological_decisions:
- issue: Portée de παράνομοι
  choice: ceux qui méprisent la Loi
  alternative: les impies / les sans-loi
  rationale: Le choix évite d’élargir le terme au mal en général et conserve son orientation vers la transgression ou le rejet de la loi, sans lui imposer une qualification confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La structure finale, le parallélisme des deux verbes et l’image de la « langue » sont conservés. Le verset reste syntaxiquement ouvert sur la citation du verset suivant.
