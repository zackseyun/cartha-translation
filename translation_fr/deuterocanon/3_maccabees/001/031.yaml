base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/031.yaml
  text: But some, lightly despising the supports of the city's piety, readily gave themselves over, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: fr
  text: Mais certains, méprisant à la légère les appuis de la piété de la ville[a], se livraient volontiers, comme s’ils allaient avoir part à un grand prestige grâce à leur future association avec le roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fondements de la piété de la ville ». Le grec emploie l’image de structures de soutien.
    reason: lexical_alternative
  - marker: b
    text: Ou « grâce à leur future fréquentation du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: certains
  rationale: Désigne de manière indéfinie une partie de la population et marque naturellement le contraste avec l’ensemble.
- source_word: ἐπιπολαίως
  choice: avec désinvolture
  rationale: Exprime une attitude légère, irréfléchie et peu soucieuse, sans imposer un motif plus précis.
- source_word: στυγοῦντες
  choice: traitant ... avec désinvolture
  rationale: Dans cette construction, le rejet méprisant exprimé par le verbe est rendu conjointement avec l’adverbe; la formulation française évite l’association peu naturelle « méprisant légèrement ».
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  choice: les appuis de la piété de la ville
  rationale: Conserve la métaphore de structures qui soutiennent la piété civique sans préciser abusivement leur nature.
- source_word: εὐσεβείας
  choice: piété
  rationale: Rend la dévotion religieuse respectueuse dans son cadre civique hellénistique juif, sans la christianiser ni la réduire à la religion institutionnelle.
- source_word: εὐχερῶς
  choice: volontiers
  rationale: Met en valeur l’absence de résistance et le caractère volontaire de leur conduite.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: se livraient
  rationale: Préserve la valeur réfléchie et volontaire de l’expression grecque.
- source_word: ὡς
  choice: comme si
  rationale: Présente l’attente subjective des personnes plutôt qu’un résultat garanti par le narrateur.
- source_word: μεγάλης τινὸς ... εὐκλείας
  choice: un grand prestige
  rationale: Exprime la réputation honorable ou la distinction sociale attendue; « prestige » est naturel ici et évite les connotations théologiques de « gloire ».
- source_word: κοινωνήσοντες
  choice: allaient avoir part à
  rationale: Rend la participation anticipée exprimée par le participe futur.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: grâce aux relations qu’ils auraient avec le roi
  rationale: Rend l’idée d’une fréquentation ou association future avec le roi, sans exagérer son degré d’intimité.
theological_decisions:
- issue: Sens de εὐσέβεια dans un contexte civique et religieux du judaïsme hellénistique
  choice: piété
  alternative: religion; dévotion; respect de Dieu
  rationale: « Piété » garde ensemble la révérence religieuse et son implantation dans la vie de la ville, sans introduire un sens chrétien ultérieur ni réduire le terme aux institutions.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase grecque, tout en évitant des collocations artificielles. Les notes préservent la métaphore architecturale et l’ambiguïté de συναναστροφή.
