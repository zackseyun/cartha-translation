  - severity: low
    issue: La future relation avec le roi pourrait être formulée plus directement.
    rationale: « Les relations qu’ils auraient avec le roi » est compréhensible, mais « leur future association avec le roi » reflète plus nettement le substantif συναναστροφή et son participe futur ἐσομένης.
