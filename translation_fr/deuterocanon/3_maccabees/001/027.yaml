  yaml_path: translation/deuterocanon/3_maccabees/001/027.yaml
  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
translation:
  language: fr
  text: En voyant donc tout cela, ceux qui se trouvaient autour de lui en vinrent à invoquer, avec les nôtres[a], celui qui détient toute puissance, afin qu’il porte secours dans les circonstances présentes[b] et ne ferme pas les yeux sur cet acte sans loi et plein d’arrogance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « avec les nôtres » ; le grec laisse leur identité implicite. Il s’agit vraisemblablement des gens du peuple auquel appartient le narrateur.
    reason: Référent implicite de σὺν τοῖς ἡμετέροις.
  - marker: b
    text: Ou « qu’il vienne en aide aux personnes présentes » ; la forme grecque peut désigner soit les circonstances du moment, soit les personnes présentes.
    reason: Ambiguïté grammaticale et lexicale de τοῖς παροῦσιν.
lexical_decisions:
- source_word: ταῦτα
  choice: tout cela
  rationale: Le démonstratif pluriel renvoie aux événements qui viennent d’être observés. « Tout cela » est naturel en français tout en gardant ce lien rétrospectif.
- source_word: οἱ περὶ αὐτὸν ὄντες
  choice: ceux qui se trouvaient autour de lui
  rationale: Cette formulation reste proche du grec sans préciser indûment qu’il s’agit d’officiers ou de serviteurs.
- source_word: θεωροῦντες
  choice: en voyant
  rationale: Le participe exprime l’observation qui provoque leur réaction ; « en voyant » restitue simplement ce rapport.
- source_word: ἐτράπησαν εἰς τὸ ... ἐπικελεῦσθαι
  choice: en vinrent à invoquer
  rationale: La tournure marque leur passage à une nouvelle action. « Invoquer » convient à l’appel adressé à Dieu sans réduire celui-ci à une simple parole humaine.
- source_word: σὺν τοῖς ἡμετέροις
  choice: avec les nôtres
  rationale: Cette traduction conserve le caractère implicite du référent grec ; une note indique l’identification contextuelle probable.
- source_word: τὸν πὰν κράτος ἔχοντα
  choice: celui qui détient toute puissance
  rationale: Le grec décrit Dieu par son pouvoir universel plutôt que d’employer explicitement un titre divin fixe.
- source_word: τοῖς παροῦσιν
  choice: dans les circonstances présentes
  rationale: Le datif peut viser les réalités ou circonstances du moment. Cette lecture convient au contexte, tandis que l’autre possibilité est signalée en note.
- source_word: ἐπαμῦναι
  choice: venir en aide
  rationale: Le verbe signifie secourir ou défendre ; cette expression française conserve les deux nuances sans surtraduction.
- source_word: μὴ περιιδεῖν
  choice: ne pas fermer les yeux sur
  rationale: L’expression idiomatique rend l’idée de voir un mal sans intervenir, plus fortement qu’un simple manque d’attention.
- source_word: τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  choice: cet acte contraire à la loi et plein d’arrogance
  rationale: Cette formulation rend directement les deux qualificatifs tout en évitant l’expression peu naturelle « acte arrogant ».
theological_decisions:
- issue: Description divine τὸν πὰν κράτος ἔχοντα
  choice: celui qui détient toute puissance
  alternative: le Tout-Puissant
  rationale: La traduction conserve la formulation descriptive du grec et n’en fait pas artificiellement un titre divin consacré.
- issue: Référent de σὺν τοῖς ἡμετέροις
  choice: avec les nôtres
  alternative: avec les gens de notre peuple
  rationale: Le grec ne nomme pas le groupe. Le texte principal préserve cette implicitation et la note donne l’identification contextuelle probable.
- issue: Référent de τοῖς παροῦσιν
  choice: dans les circonstances présentes
  alternative: à ceux qui étaient présents
  rationale: La forme grecque permet les deux analyses. La lecture circonstancielle est retenue dans le texte, et l’ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression du grec, mais emploie des expressions françaises naturelles (« en vinrent à », « venir en aide », « ne ferme pas les yeux »). Les marqueurs de notes sont placés sur les segments grecs auxquels les variantes se rapportent.
