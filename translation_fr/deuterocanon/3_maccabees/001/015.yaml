  text: For your dwelling place is the heaven of heaven[b][a], unreachable by men.
translation:
  language: fr
  text: Car ta demeure est le ciel le plus élevé[a], inaccessible aux êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le ciel du ciel » ; cette tournure sémitisante désigne le ciel le plus élevé. On trouve aussi : « le ciel des cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: demeure
  rationale: Le nom désigne le lieu où quelqu’un habite. « Demeure » est naturel, digne et conserve ici le sens concret du lieu d’habitation de Dieu.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: le ciel le plus élevé
  rationale: L’expression littérale « le ciel du ciel » est une tournure sémitisante à valeur superlative. « Le ciel le plus élevé » en transmet clairement le sens tout en maintenant l’idée d’un domaine céleste suprême.
- source_word: ἀνέφικτος
  choice: inaccessible
  rationale: L’adjectif qualifie ce que l’on ne peut atteindre. « Inaccessible » exprime avec concision l’impossibilité, pour les humains, d’accéder à cette demeure.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Le pluriel désigne ici l’humanité en général, sans distinction de sexe. « Aux êtres humains » rend cette portée générique sans ambiguïté.
theological_decisions:
- issue: Portée de l’expression οὐρανὸς τοῦ οὐρανοῦ
  choice: le ciel le plus élevé
  alternative: le ciel du ciel ; le ciel des cieux
  rationale: La formulation évoque la demeure transcendante de Dieu. Le texte principal rend la valeur superlative probable de l’expression, tandis que la note conserve sa forme grecque inhabituelle sans en faire une formulation doctrinale plus précise que la source.
- issue: Référent générique de ἀνθρώποις
  choice: aux êtres humains
  alternative: aux hommes
  rationale: Le grec vise l’ensemble des humains, et non les seuls individus de sexe masculin. La traduction choisie rend explicitement cette extension.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase garde la sobriété et l’élévation d’une prière, tout en explicitant naturellement la portée générique de ἀνθρώποις.
