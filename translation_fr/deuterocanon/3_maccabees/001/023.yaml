  text: But when they cried out to make a rush for the weapons, and to die courageously under the ancestral law, they caused considerable turmoil in the place, and only with difficulty by the old men and the elders
translation:
  language: fr
  text: Mais, appelant à se précipiter vers les armes[b] et à mourir courageusement pour la loi ancestrale[c], ils provoquèrent une agitation considérable en ce lieu. Mais ce ne fut qu’à grand-peine, par les hommes âgés et les anciens…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait grec fourni s’interrompt ici au milieu de la phrase, après « les hommes âgés et les anciens ». La traduction conserve donc cette suspension sans ajouter les mots manquants.
    reason: textual_variant
  - marker: b
    text: Ou « se précipiter sur les armes », probablement pour s’en emparer.
    reason: lexical_alternative
  - marker: c
    text: Ou « sous la loi ancestrale ». L’expression grecque peut évoquer une mort motivée par la fidélité à la loi héritée.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: ils crièrent
  rationale: Rend directement la prise de parole forte et urgente exprimée par le participe aoriste, sans alourdir la phrase française.
- source_word: τὴν ὁρμὴν ... ποιήσασθαι
  choice: qu’il fallait se précipiter
  rationale: Exprime l’élan soudain de ὁρμή dans un français naturel; la tournure avec « qu’il fallait » restitue le contenu de leur cri sans imposer l’idée plus précise d’une attaque.
- source_word: ἐπὶ τὰ ὅπλα
  choice: vers les armes
  rationale: Avec ὁρμή, ἐπί indique ici vraisemblablement un mouvement en direction des armes, sans préciser explicitement s’il s’agit de les saisir.
- source_word: θαρραλέως
  choice: courageusement
  rationale: Conserve le registre solennel et l’idée de résolution devant la mort.
- source_word: ὑπὸ τοῦ πατρῴου νόμου
  choice: pour la Loi de leurs ancêtres
  rationale: Dans cette expression condensée, ὑπό se comprend naturellement comme indiquant la cause ou l’attachement motivant leur mort. « Loi de leurs ancêtres » est clair et préserve la dimension héritée de πατρῷος.
- source_word: τελευτᾷν
  choice: mourir
  rationale: Traduction directe et non interprétative de l’infinitif.
- source_word: ἱκανὴν ... τραχύτητα
  choice: une agitation considérable
  rationale: Dans ce contexte narratif, τραχύτης désigne une situation âpre et troublée; « agitation » rend l’effet collectif sans surinterpréter le degré de violence.
- source_word: μόλις
  choice: ce ne fut qu’à grand-peine
  rationale: Préserve l’idée qu’une action subséquente, absente de l’extrait fourni, ne s’accomplit qu’avec difficulté.
- source_word: γεραιῶν
  choice: hommes âgés
  rationale: Rend le sens lié à l’âge tout en maintenant la distinction avec πρεσβυτέρων.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Peut désigner des personnes reconnues comme responsables ou notables de la communauté; « anciens » maintient cette nuance et la distingue des simples hommes âgés.
theological_decisions:
- issue: Sens de πατρῷος νόμος
  choice: la Loi de leurs ancêtres
  alternative: la loi ancestrale
  rationale: La formulation désigne la Loi reçue en héritage par le peuple. La majuscule à « Loi » signale ce référent précis sans ajouter d’identification confessionnelle étrangère au texte.
- issue: Valeur de ὑπό dans ὑπὸ τοῦ πατρῴου νόμου
  choice: pour la Loi de leurs ancêtres
  alternative: sous la Loi de leurs ancêtres
  rationale: Le contexte évoque une mort acceptée par fidélité à la Loi; « pour » offre en français le sens le plus naturel tout en signalant en note l’ambiguïté de la relation grecque.
- issue: Inachèvement de l’extrait grec fourni
  choice: conserver la phrase suspendue avec des points de suspension et une note
  alternative: compléter la proposition à partir d’une autre édition ou d’une conjecture
  rationale: Le témoin fourni s’arrête après « les hommes âgés et les anciens ». Aucun complément absent de la source ne doit être ajouté.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe a été légèrement restructurée pour rendre clairement le contenu du cri. Les deux termes grecs relatifs à l’âge ou au statut sont distingués par « hommes âgés » et « anciens ». Les points de suspension rendent visible l’inachèvement matériel de l’extrait.
