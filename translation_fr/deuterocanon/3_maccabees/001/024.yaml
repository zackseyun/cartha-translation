translation:
  language: fr
  text: Après avoir fait demi-tour[a], ils revinrent à la même posture de supplication.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Après s’être détournés, ils revinrent au même état de supplication ». Le grec peut évoquer soit, plus concrètement, une posture, soit, plus généralement, un état ou une condition.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτραπέντες
  choice: Après avoir fait demi-tour
  rationale: Le participe aoriste passif, employé ici avec une valeur idiomatique, évoque un changement de direction sans préciser l’agent; cette formulation française conserve le lien temporel avec le verbe principal.
- source_word: παρῆσαν
  choice: ils reprirent
  rationale: Dans cette construction avec ἐπί suivi de l’accusatif, le verbe exprime l’arrivée ou le retour à une situation antérieure; « reprirent » rend naturellement cette reprise en français.
- source_word: στάσιν
  choice: posture
  rationale: στάσις peut désigner une position corporelle ou, plus largement, un état. « posture » préserve ici la possible dimension physique de leur attitude de prière.
- source_word: δεήσεως
  choice: supplication
  rationale: δέησις désigne une demande pressante adressée dans la prière; « supplication » en conserve l’intensité.
- source_word: ἐπὶ τὴν αὐτὴν ... στάσιν
  choice: la même posture
  rationale: L’expression signale la reprise d’une position ou condition déjà adoptée; la formulation française reste concise et conserve cette référence.
