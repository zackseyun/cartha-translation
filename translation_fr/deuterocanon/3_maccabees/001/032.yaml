  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
translation:
  language: fr
  text: Mais la plupart d’entre eux prirent courage, animés d’un noble esprit, et ne s’écartèrent pas de la piété[a] ; échangeant même leurs biens pour rester en vie, ils s’employèrent sans crainte à se libérer[b] des inscriptions officielles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur fidélité religieuse ». Le mot grec peut désigner la révérence, l’attachement à Dieu ou la piété.
    reason: lexical_alternative
  - marker: b
    text: La proposition grecque traduite par « ils s’employèrent sans crainte à se libérer » est difficile dans le texte transmis, en particulier à cause du verbe ἐτιμῶντο. La traduction en donne le sens actif probable sans prétendre résoudre entièrement la difficulté.
    reason: textual_variant
  - marker: c
    text: Les « inscriptions officielles » désignent ici la procédure administrative par laquelle on les enregistrait ou les plaçait sur des listes ; il ne s’agit pas nécessairement d’un recensement de population au sens moderne.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Mais la plupart d’entre eux
  rationale: La tournure exprime la majorité d’un groupe, tandis que δέ marque ici le contraste avec ce qui précède.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: puisèrent de la force dans leur noblesse de cœur
  rationale: ἐνίσχυσαν exprime l’affermissement ou la force acquise; γενναίᾳ ψυχῇ décrit une disposition intérieure noble et courageuse, sans employer « âme » dans un sens métaphysique.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: ne s’écartèrent pas de la piété
  rationale: διίστημι avec le génitif signifie s’éloigner ou se séparer de quelque chose. Dans ce contexte juif, εὐσέβεια désigne la fidélité révérencieuse envers Dieu.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: allant jusqu’à échanger leurs biens pour rester en vie
  rationale: χρήματα désigne les biens ou possessions; τε ajoute ici une nuance d’intensification, rendue par « allant jusqu’à »; περὶ τοῦ ζῇν indique la préservation de la vie.
- source_word: ἀδέως
  choice: sans crainte
  rationale: L’adverbe signifie sans peur, hardiment ou avec assurance. « Sans crainte » conserve directement cette nuance.
- source_word: ἐτιμῶντο ἑαυτοὺς ῥύσασθαι
  choice: ils s’employèrent à se soustraire
  rationale: La forme transmise ἐτιμῶντο est difficile dans cette construction. La traduction restitue prudemment l’idée probable d’un effort actif visant leur propre délivrance, sans attribuer au verbe une précision incertaine.
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: aux inscriptions officielles
  rationale: ἀπογραφή désigne une inscription, un enregistrement ou une mise sur liste par l’autorité. Le pluriel grec est conservé sémantiquement, et « officielles » évite l’idée trop étroite d’un recensement moderne.
theological_decisions:
- issue: Sens de εὐσέβεια dans un contexte de persécution juive
  choice: piété
  alternative: fidélité religieuse; attachement à Dieu
  rationale: « Piété » garde ensemble la révérence envers Dieu et la fidélité vécue, sans introduire de terminologie confessionnelle ultérieure.
- issue: Interprétation de la proposition difficile contenant ἐτιμῶντο
  choice: traduction idiomatique et prudente par « ils s’employèrent sans crainte à se soustraire »
  alternative: « ils estimaient devoir se délivrer »; « ils jugeaient bon de se soustraire »
  rationale: Le texte transmis est syntaxiquement difficile. Le choix retenu exprime l’effort actif qui paraît ressortir du contexte tout en signalant l’incertitude dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste initial, l’idée de courage intérieur, le coût matériel de la survie et le pluriel sémantique des procédures d’inscription, tout en évitant une formulation artificielle autour du verbe grec difficile.
