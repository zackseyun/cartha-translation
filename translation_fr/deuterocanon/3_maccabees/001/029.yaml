  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
translation:
  language: fr
  text: Car il semblait que non seulement les gens, mais même les murailles et le sol tout entier retentissaient[a], puisque tous préféraient alors la mort[b] à la profanation du lieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résonnaient ». Le verbe grec évoque un son qui retentit et se répercute.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie une image inhabituelle de changement, d’échange ou de substitution : littéralement, tous étaient « changés pour la mort » à la place de la profanation. La formulation exacte est métaphorique.'
    reason: lexical_alternative
  - marker: c
    text: Dans le contexte, « le lieu » désigne l’enceinte sacrée, probablement le secteur du Temple ; toutefois, le grec n’emploie pas ici le mot plus précis pour « Temple ».
    reason: cross_reference
lexical_decisions:
- source_word: δοκεῖν γὰρ ἦν
  choice: Car il semblait que
  rationale: Cette tournure impersonnelle rend naturellement l’expression grecque et conserve le lien explicatif introduit par γάρ.
- source_word: τοὺς ἀνθρώπους
  choice: les gens
  rationale: Dans cette scène collective, « les gens » rend le pluriel grec de façon naturelle, sans le limiter aux hommes de sexe masculin.
- source_word: τὰ τείχη
  choice: les murailles
  rationale: « Murailles » convient à des murs d’enceinte et maintient l’image saisissante du cadre bâti qui semble lui aussi résonner.
- source_word: τὸ πᾶν ἔδαφος
  choice: le sol tout entier
  rationale: ἔδαφος désigne ici la surface du sol; cette formulation conserve l’étendue totale exprimée par πᾶν.
- source_word: ἠχεῖν
  choice: retentissaient
  rationale: Le verbe évoque un son puissant qui résonne; « retentir » est idiomatique en français et s’applique naturellement aux gens, aux murailles et au sol dans cette personnification.
- source_word: ἅτε δὴ
  choice: puisque
  rationale: La conjonction française restitue la valeur explicative et causale de la combinaison grecque.
- source_word: τῶν πάντων
  choice: tous
  rationale: Le génitif absolu renvoie naturellement à l’ensemble des personnes présentes dans le contexte, tout en gardant la portée englobante de πάντων.
- source_word: τότε θάνατον ἀλλασσομένων
  choice: choisissaient alors la mort
  rationale: L’expression grecque est métaphorique et inhabituelle, évoquant un échange ou une substitution. Dans le contexte, elle signifie que tous acceptaient la mort comme terme de remplacement; « choisissaient » en communique le sens sans reproduire une construction française obscure.
- source_word: ἀντὶ τῆς τοῦ τόπου βεβηλώσεως
  choice: plutôt que la profanation du lieu
  rationale: ἀντί marque ici la substitution ou la préférence, et βεβήλωσις désigne une profanation. « Le lieu » respecte le terme général employé par le grec.
theological_decisions:
- issue: Référent de τοῦ τόπου
  choice: le lieu
  alternative: le Temple / le lieu saint
  rationale: Le contexte vise le sanctuaire, probablement l’enceinte du Temple, mais le texte grec dit seulement « le lieu ». La traduction conserve cette formulation sans introduire une précision absente de la source.
- issue: Sens de θάνατον ἀλλασσομένων ἀντί
  choice: choisissaient alors la mort plutôt que la profanation
  alternative: échangeaient alors la profanation du lieu contre la mort / étaient livrés à la mort au lieu de la profanation du lieu
  rationale: La construction d’ἀλλάσσω est rare et conserve une image d’échange. Le contexte favorise l’idée que tous préfèrent subir la mort plutôt que permettre ou subir la profanation, mais la note signale la métaphore et les autres formulations possibles sans imposer une lecture doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase garde l’amplification poétique selon laquelle les murailles et le sol participent au retentissement, tout en éclairant dans le corps du texte la métaphore grecque très inhabituelle de l’échange contre la mort.
