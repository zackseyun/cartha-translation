revisions:
- from: Mais les Juifs lui envoyèrent une délégation de la gérousie[a] et des anciens, chargée de le saluer, de lui apporter des présents d’hospitalité[b] et de se réjouir avec lui de ce qui s’était passé. Il en résulta qu’il fut encore plus désireux de se rendre auprès d’eux au plus vite.
  to: Mais lorsque les Juifs lui eurent envoyé, de la part de la gérousie[a] et des anciens, des délégués pour le saluer, lui apporter des présents d’hospitalité[b] et se réjouir de ce qui s’était passé, il en fut encore plus désireux de se rendre auprès d’eux au plus vite.
  rationale: La correction retire l’ajout interprétatif « avec lui » et rend explicitement le pluriel des envoyés. Le plus-que-parfait (« eurent envoyé ») exprime l’antériorité du génitif absolu, tandis que « il en fut encore plus désireux » rend l’issue introduite par συνέβη et l’intensification μᾶλλον sans alourdir le français.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:39:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'La distinction entre la gérousie et les anciens est bien maintenue, ainsi que le sens de ξένια et l’urgence de ὡς τάχιστα. Toutefois, « avec lui » n’a pas d’équivalent dans le grec : le complément ἐπὶ τοῖς συμβεβηκόσιν porte sur le motif de la réjouissance, sans préciser qu’elle est partagée avec le roi. La délégation au singulier masque aussi le pluriel personnel τοὺς ... κομιοῦντας.'
  naturalness: La révision emploie « délégués » au pluriel et une syntaxe française naturelle, tout en conservant le mouvement narratif de la longue phrase grecque.
  terminology: « Gérousie » est un terme français savant approprié pour préserver la différence entre γερουσία et πρεσβύτεροι. La note explique ce choix sans imposer « sénat ». « Présents d’hospitalité » rend convenablement ξένια.
  issues:
  - severity: medium
    issue: Ajout de « avec lui »
    rationale: Le grec ne comporte aucun complément indiquant que les envoyés devaient se réjouir avec le destinataire; il dit seulement qu’ils devaient se réjouir « de ce qui était arrivé ».
  - severity: low
    issue: « une délégation ... chargée » au singulier
    rationale: Le grec désigne des personnes au pluriel (τοὺς ... ἀσπασομένους, κομιοῦντας, χαρησομένους). « Des délégués » représente plus directement ce pluriel.
  revised_text: Mais lorsque les Juifs lui eurent envoyé, de la part de la gérousie[a] et des anciens, des délégués pour le saluer, lui apporter des présents d’hospitalité[b] et se réjouir de ce qui s’était passé, il en fut encore plus désireux de se rendre auprès d’eux au plus vite.
