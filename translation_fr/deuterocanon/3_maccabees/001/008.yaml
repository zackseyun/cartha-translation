base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
translation:
  language: fr
  text: Mais lorsque les Juifs lui eurent envoyé, de la part de la gérousie[a] et des anciens, des délégués pour le saluer, lui apporter des présents d’hospitalité[b] et se réjouir de ce qui s’était passé, il en fut encore plus désireux de se rendre auprès d’eux au plus vite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « gérousie » était un conseil institutionnel composé d’anciens; on pourrait aussi traduire par « conseil des anciens ».
    reason: lexical_alternative
  - marker: b
    text: Ces présents étaient liés aux usages d’accueil et à l’honneur accordé à un hôte.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεμψαμένων
  choice: envoyèrent une délégation
  rationale: Le génitif absolu marque une action antérieure ou circonstancielle. « Envoyèrent une délégation » exprime naturellement en français l’envoi de personnes, sans préciser davantage leur statut.
- source_word: γερουσίας
  choice: gérousie
  rationale: Le terme désigne un corps institutionnel d’anciens. Le conserver sous sa forme francisée évite de le confondre avec les « anciens » mentionnés séparément et de lui donner une coloration romaine avec « sénat ».
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Le groupe est maintenu distinct de la gérousie, conformément à la coordination grecque.
- source_word: τοὺς ἀσπασομένους αὐτόν
  choice: chargée de le saluer
  rationale: Cette formulation rend la fonction ou le but des envoyés dans un français fluide.
- source_word: ξένια
  choice: présents d’hospitalité
  rationale: Le choix conserve l’idée culturelle de présents offerts dans le cadre de l’accueil ou de l’honneur dû à un hôte.
- source_word: κομιοῦντας
  choice: apporter
  rationale: Dans le contexte, les envoyés apportent les présents au roi.
- source_word: ἐπὶ τοῖς συμβεβηκόσιν χαρησομένους
  choice: se réjouir avec lui de ce qui s’était passé
  rationale: « De ce qui s’était passé » préserve l’indétermination du grec. « Avec lui » explicite naturellement la portée circonstancielle de la démarche sans identifier les événements.
- source_word: συνέβη
  choice: il en résulta
  rationale: Le verbe introduit ici l’issue de la démarche; cette tournure française évite la lourdeur de « il arriva qu’il devint ».
- source_word: μᾶλλον ... προθυμηθῆναι
  choice: il fut encore plus désireux
  rationale: La formulation conserve la comparaison et la disposition volontaire exprimées par le grec.
- source_word: ὡς τάχιστα
  choice: au plus vite
  rationale: Expression française actuelle et digne qui rend l’urgence du superlatif adverbial.
- source_word: πρὸς αὐτοὺς παραγενέσθαι
  choice: se rendre auprès d’eux
  rationale: Cette expression rend l’idée d’arriver en leur présence avec un registre narratif naturel.
