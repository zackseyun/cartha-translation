  terminology: « Complot » et « villes voisines » conviennent. Pour παρακαλέσαι, « exhorter » représente bien l’usage politique et persuasif du verbe sans imposer le sens d’« appel »; la note maintient les autres possibilités. Aucun terme théologique particulier n’est en jeu.
