  text: But after gaining control of the plot[b][a], he decided to visit the neighboring cities and encourage them.
translation:
  language: fr
  text: Mais, après avoir pris le dessus sur le complot[a], il décida de se rendre dans les villes voisines pour les exhorter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir maîtrisé le complot » ou « après avoir triomphé du complot ». Le participe grec peut évoquer le fait de prendre le dessus sur un dessein hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour les encourager » ou « pour leur adresser un appel ». Le verbe grec peut signifier encourager, exhorter ou faire appel à quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρατήσας
  choice: après avoir déjoué
  rationale: Le participe aoriste exprime une action antérieure et κατακρατέω l’idée de prendre le dessus. Avec ἐπιβουλή, « déjouer » rend naturellement en français la victoire sur un dessein hostile, sans préciser les moyens employés.
- source_word: ἐπιβουλῆς
  choice: le complot
  rationale: ἐπιβουλή désigne ici un dessein hostile ou une machination. « Complot » est concis, courant et n’impose pas la notion plus précise de conspiration organisée.
- source_word: ἔκρινεν
  choice: il décida
  rationale: Avec un infinitif, κρίνω exprime ici une résolution plutôt qu’un jugement judiciaire. « Décida » est naturel et exact.
- source_word: τὰς πλησίον πόλεις
  choice: les villes voisines
  rationale: πλησίον marque la proximité géographique. « Villes voisines » est idiomatique en français moderne.
- source_word: ἐπελθὼν
  choice: se rendre dans
  rationale: Le participe indique le déplacement vers les villes. Intégré à la construction infinitive française, « se rendre dans » reste digne et naturel sans donner au déplacement un caractère officiel absent du grec.
- source_word: παρακαλέσαι
  choice: adresser un appel à leurs habitants
  rationale: παρακαλέω peut signifier exhorter, encourager ou faire appel à. « Adresser un appel » préserve cette amplitude; « leurs habitants » explicite sobrement les personnes visées par la métonymie « villes ».
