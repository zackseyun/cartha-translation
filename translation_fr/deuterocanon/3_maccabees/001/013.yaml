  text: And he inquired for what reason no one among those present had prevented him from entering any sanctuary[a].
translation:
  language: fr
  text: Et il demanda pour quelle raison personne parmi ceux qui étaient présents ne l’avait empêché d’entrer dans un sanctuaire quelconque[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une enceinte sacrée quelconque ». Le grec τέμενος peut désigner largement un lieu consacré, et pas seulement le bâtiment d’un temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπυνθάνετο
  choice: il demanda
  rationale: L’imparfait de πυνθάνομαι exprime ici une demande d’information. « Il demanda » est naturel en français moderne tout en conservant la valeur imperfective du récit.
- source_word: διὰ τίνα αἰτίαν
  choice: pour quelle raison
  rationale: Cette formulation rend explicitement l’idée de cause exprimée par αἰτία, sans la condenser en un simple « pourquoi ».
- source_word: εἰσερχόμενον
  choice: l’avait empêché d’entrer
  rationale: Le participe accusatif se rapporte à αὐτόν et s’intègre naturellement en français à la construction « empêcher quelqu’un d’entrer ».
- source_word: πᾶν τέμενος
  choice: quelque enceinte sacrée que ce soit
  rationale: Dans ce contexte négatif, πᾶν a une valeur distributive proche de « n’importe quelle ». « Enceinte sacrée » préserve le sens large de τέμενος, qui ne désigne pas nécessairement le seul bâtiment d’un temple.
- source_word: οὐθεὶς ἐκώλυσεν
  choice: personne… ne l’avait empêché
  rationale: κωλύω signifie empêcher ou faire obstacle. Le plus-que-parfait français situe naturellement cette absence d’intervention avant la demande rapportée.
- source_word: τῶν παρόντων
  choice: parmi ceux qui étaient présents
  rationale: Le génitif partitif désigne le groupe au sein duquel personne n’est intervenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « quelque… que ce soit » rend la portée de πᾶν sous la négation, tandis que la note signale l’alternative plus courante « sanctuaire ».
