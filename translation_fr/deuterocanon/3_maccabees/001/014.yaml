translation:
  language: fr
  text: Et quelqu’un dit inconsidérément que cela même était présenté à tort comme un prodige[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « était présenté comme une monstruosité »; ou, selon le contexte, « était monté en épingle de manière sensationnaliste ». Le verbe grec peut évoquer le fait de présenter quelque chose comme un prodige, une monstruosité ou un récit merveilleux; l’adverbe indique que cela se faisait de manière fautive ou abusive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρονοήτως
  choice: inconsidérément
  rationale: L’adverbe exprime l’absence de réflexion préalable. « Inconsidérément » convient au registre narratif et n’ajoute pas de jugement moral plus fort.
- source_word: ἔφη
  choice: déclara
  rationale: Le verbe signifie simplement « dire »; « déclara » rend naturellement ici l’introduction d’une affirmation, sans lui donner la force d’une proclamation solennelle.
- source_word: κακῶς
  choice: de façon extravagante
  rationale: L’adverbe qualifie τερατεύεσθαι négativement. Associé à ce verbe, il évoque une présentation abusive ou outrancière plutôt qu’une simple mauvaise exécution.
- source_word: αὐτὸ τοῦτο
  choice: cette affaire même
  rationale: La tournure conserve l’emphase du grec tout en donnant à τοῦτο un référent français naturel dans ce contexte.
- source_word: τερατεύεσθαι
  choice: était déformée de façon extravagante
  rationale: Le verbe peut évoquer le fait de présenter quelque chose comme un prodige, un présage ou une monstruosité. La traduction principale exprime une présentation outrancière sans réduire cette polysémie à la seule notion de présage; la note conserve les autres possibilités.
