base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: fr
  text: 'Mais, afin de ne pas se rendre odieux à tous par son hostilité, il donna cet ordre par écrit : « Cependant, si certains d’entre eux choisissent de vivre parmi les initiés aux rites[a], il leur accorde les mêmes droits civiques qu’aux Alexandrins. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi ceux qui ont été initiés aux mystères ». Le grec emploie le vocabulaire cultuel de l’initiation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Mais, afin de ne pas
  rationale: Conserve la valeur finale de ἵνα et la transition marquée par δέ dans un français naturel.
- source_word: τοῖς πᾶσιν
  choice: à tous
  rationale: Rend simplement la relation exprimée par le datif et maintient la portée universelle.
- source_word: ἐχθόμενος ... ἐχθαίνηται
  choice: se rendre odieux à tous par son hostilité
  rationale: Exprime le lien causal entre son attitude hostile et l’aversion qu’elle susciterait. Le jeu sur les mots grecs apparentés ne peut être reproduit exactement sans alourdir le français.
- source_word: ὑπέγραψεν
  choice: il donna cet ordre par écrit
  rationale: Rend la dimension administrative et écrite du verbe sans imposer le terme plus précis de « décret ».
- source_word: Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται
  choice: Cependant, si certains d’entre eux choisissent
  rationale: προαιρῶνται indique une décision volontaire; « certains » convient à τινες, tandis que « cependant » marque le δέ interne.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: parmi les initiés aux rites
  rationale: Préserve le vocabulaire cultuel de l’initiation tout en restant compréhensible et sans préciser indûment de quels cultes il s’agit.
- source_word: ἀναστρέφεσθαι
  choice: vivre
  rationale: Dans ce cadre social et religieux, le verbe désigne une manière de vivre ou de se comporter; « vivre parmi » est plus idiomatique que « se conduire parmi ».
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  choice: il leur accorde les mêmes droits civiques qu’aux Alexandrins
  rationale: Rend clairement le statut civique égal exprimé par ἰσοπολίτας, dans une formulation juridique naturelle en français.
theological_decisions:
- issue: Portée du vocabulaire d’initiation cultuelle
  choice: « les initiés aux rites » dans le texte principal
  alternative: « les initiés aux mystères »
  rationale: τελεταί et μεμυημένοις peuvent désigner les rites d’initiation des cultes à mystères, mais le texte ne précise pas ici un culte particulier. La traduction principale conserve donc l’ambiguïté, et la note signale l’autre rendu possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le ton administratif de l’ordre royal, tout en évitant un calque maladroit du grec.
