base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
translation:
  language: fr
  text: Mais un certain Théodote, résolu à exécuter le complot, prit les meilleures des armes ptolémaïques qui lui avaient été attribuées et fut conduit de nuit jusqu’à la tente de Ptolémée, afin de le tuer lui-même[a] et, par ce moyen, de mettre fin à la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de le tuer à lui seul ». Le grec peut souligner que Théodote comptait accomplir lui-même le meurtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπληρῶσαι τὴν ἐπιβουλήν
  choice: exécuter le complot
  rationale: Dans ce contexte d’assassinat, ἐκπληρῶσαι signifie mener à exécution, tandis que ἐπιβουλή désigne un dessein hostile. « Exécuter le complot » est naturel et précis.
- source_word: διανοηθείς
  choice: résolu à
  rationale: Le participe exprime ici une intention délibérée. « Résolu à » rend la détermination de Théodote sans alourdir la phrase.
- source_word: τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα
  choice: les meilleures des armes ptolémaïques qui lui avaient été attribuées
  rationale: La formulation conserve le superlatif τὰ κράτιστα, l’attribution antérieure des armes et leur caractère ptolémaïque.
- source_word: διεκομίσθη
  choice: se fit transporter
  rationale: Le verbe est au passif et suggère que Théodote fut transporté ou conduit. Le tour pronominal causatif est plus naturel en français que « fut transporté » tout en conservant cette nuance.
- source_word: νύκτωρ
  choice: de nuit
  rationale: Expression française concise et idiomatique correspondant à l’adverbe grec.
- source_word: ὡς μόνος κτεῖναι αὐτόν
  choice: afin de le tuer lui-même
  rationale: ὡς avec l’infinitif indique le but projeté. μόνος se rapporte le plus naturellement au sujet et souligne que Théodote entend accomplir lui-même le meurtre.
- source_word: ἐν τούτῳ διαλῦσαι τὸν πόλεμον
  choice: et, par ce moyen, de mettre fin à la guerre
  rationale: « Par ce moyen » rend la valeur instrumentale de ἐν τούτῳ, et « mettre fin à la guerre » exprime naturellement διαλῦσαι τὸν πόλεμον.
