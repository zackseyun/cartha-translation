  text: But since you were pleased to set your glory among your people Israel, you sanctified this place.
translation:
  language: fr
  text: Mais, puisque tu as jugé bon que ta gloire soit au milieu de ton peuple Israël, tu as sanctifié ce lieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Mais
  rationale: Marque le contraste avec ce qui précède de façon directe et naturelle.
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit ici le motif causal de l’action qui suit, tout en conservant le lien argumentatif du grec.
- source_word: εὐδόκησας
  choice: tu as bien voulu
  rationale: Rend à la fois le bon plaisir et la volonté favorable exprimés par εὐδοκέω, dans un français actuel et digne.
- source_word: τὴν δόξαν σου
  choice: ta gloire
  rationale: Conserve le terme biblique usuel pour la manifestation glorieuse de Dieu.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: au milieu de ton peuple Israël
  rationale: Rend naturellement ἐν avec un groupe humain et suggère la présence parmi le peuple sans imposer une interprétation plus précise.
- source_word: ἡγίασας
  choice: tu as sanctifié
  rationale: Préserve explicitement le vocabulaire cultuel de la sainteté et de la mise à part.
- source_word: τὸν τόπον τοῦτον
  choice: ce lieu
  rationale: Traduit τόπος sans préciser indûment qu’il s’agit du sanctuaire, même si le contexte peut l’indiquer.
theological_decisions:
- issue: Rapport entre la gloire divine au sein d’Israël et la sainteté du lieu
  choice: tu as sanctifié ce lieu
  alternative: tu as consacré ce lieu
  rationale: « Sanctifié » maintient le lien explicite avec la sainteté porté par ἁγιάζω, tandis que « consacré » pourrait mettre plus étroitement l’accent sur une cérémonie ou une affectation cultuelle.
- issue: Nuance de la présence de la gloire divine
  choice: établir ta gloire au milieu de ton peuple Israël
  alternative: mettre ta gloire dans ton peuple Israël
  rationale: Le grec ne comporte pas de verbe équivalent à « établir » après εὐδόκησας; celui-ci est fourni en français pour rendre intelligible la construction où le bon plaisir porte sur « ta gloire parmi ton peuple ». Cette formulation conserve l’idée d’une présence voulue sans la définir davantage.
translation_notes:
  register: Français moderne international, sobre et digne. Le tutoiement correspond à l’adresse directe à Dieu. « Sanctifié » est conservé malgré son registre biblique, car il demeure compréhensible et traduit précisément le vocabulaire de sainteté.
