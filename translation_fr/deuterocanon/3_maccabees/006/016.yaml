  yaml_path: translation/deuterocanon/3_maccabees/006/016.yaml
  text: But just as Eleazar was finishing his prayer[a], the king came along by the hippodrome with the beasts and all the tumult of his forces.
translation:
  language: fr
  text: Mais au moment même où Éléazar achevait sa prière, le roi s’avança le long de l’hippodrome avec les bêtes et tout le fracas menaçant de ses forces.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’arrogance tapageuse de ses forces ». L’expression grecque évoque le grondement bruyant et menaçant qui accompagne la puissance militaire du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λήγοντος ἄρτι
  choice: au moment même où … achevait
  rationale: Le génitif absolu associé à ἄρτι situe l’arrivée du roi à l’instant précis où la prière touche à sa fin.
- source_word: προσευχῆς
  choice: prière
  rationale: Équivalent français courant et direct de προσευχή dans ce contexte.
- source_word: παρῆγεν
  choice: s’avança
  rationale: Le verbe décrit ici le déplacement ou le défilé du roi; « s’avança » restitue naturellement cette progression sans préciser à tort qu’il passa simplement devant le lieu.
- source_word: κατὰ τὸν ἱππόδρομον
  choice: le long de l’hippodrome
  rationale: κατά avec l’accusatif a ici une valeur spatiale et indique un mouvement suivant l’hippodrome, sans imposer une distinction trop précise entre son intérieur et ses abords.
- source_word: θηρίοις
  choice: les bêtes
  rationale: Le terme désigne les animaux dangereux du récit; « bêtes » en conserve la tonalité inquiétante sans ajout explicatif.
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  choice: tout le fracas menaçant de ses forces
  rationale: φρύαγμα évoque un grondement, un tumulte ou une manifestation arrogante et menaçante; « fracas menaçant » rend à la fois la dimension sonore et l’intimidation, tandis que δύναμις désigne ici les forces militaires du roi.
