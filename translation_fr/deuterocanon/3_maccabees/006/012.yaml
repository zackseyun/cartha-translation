base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
translation:
  language: fr
  text: Mais toi, qui possèdes toute force et toute souveraineté, Infatigable[a], Éternel, regarde maintenant ! Aie pitié de nous, que des hommes sans loi, par leur violence insolente, arrachent sans raison à la vie[b], à la manière de comploteurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toi qui ne te lasses jamais » pour ἀπάναυε.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « étant retirés hors de la vie » ; dans ce contexte, il s’agit d’être mis à mort.
    reason: lexical_alternative
  - marker: c
    text: Ou « comme des conspirateurs ». Le grec peut évoquer la manière ou le prétexte de leur traitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλκήν
  choice: force
  rationale: Le terme désigne la force ou la puissance effective. « Force » convient au registre élevé de la prière et reste distinct de δυναστείαν.
- source_word: δυναστείαν
  choice: souveraineté
  rationale: Le mot évoque le pouvoir exercé et la domination. « Souveraineté » préserve cette nuance sans le confondre avec la force brute exprimée par ἀλκήν.
- source_word: ἀπάναυε
  choice: Infatigable
  rationale: Le vocatif est conservé comme titre divin parallèle à αἰώνιε. « Infatigable » exprime celui qui ne cesse pas et ne se lasse pas, dans une forme française concise et solennelle.
- source_word: αἰώνιε
  choice: Éternel
  rationale: Le vocatif est rendu par un titre divin direct et usuel en français, sans ajouter le nom « Dieu », absent à cet endroit du grec.
- source_word: ἐπίδε
  choice: regarde maintenant
  rationale: L’impératif exprime un appel pressant à porter le regard sur la détresse présente. Cette formulation reste brève et urgente.
- source_word: καθʼ ὕβριν
  choice: par la violence insolente
  rationale: ὕβρις associe arrogance, outrage et violence abusive. « Violence insolente » restitue à la fois la dimension morale et l’agression concrète.
- source_word: ἀνόμων
  choice: d’hommes sans loi
  rationale: Le génitif désigne les auteurs de la violence. « Hommes sans loi » conserve le sens concret de personnes qui transgressent la loi, sans généraliser en simple « méchants ».
- source_word: ἀλόγιστον
  choice: sans raison
  rationale: L’accusatif adverbial souligne le caractère insensé et déraisonnable de l’acte. « Sans raison » est naturel en français tout en maintenant cette accusation.
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  choice: arrache à la vie
  rationale: L’expression signifie littéralement être déplacé hors du fait de vivre et désigne ici la mise à mort. « Arrache à la vie » garde l’image de l’éloignement de la vie sans réduire le texte au seul verbe « tuer ».
- source_word: ἐν ἐπιβούλων τρόπῳ
  choice: à la manière de comploteurs
  rationale: ἐπίβουλος désigne ceux qui trament un dessein hostile. La formulation conserve l’ambiguïté du grec quant à la manière ou au prétexte de leur traitement.
theological_decisions:
- issue: Valeur des vocatifs ἀπάναυε et αἰώνιε
  choice: 'Les deux formes sont rendues comme des titres divins directs : « Infatigable, Éternel ».'
  alternative: Rattacher ἀπάναυε au verbe, au sens de « regarde sans relâche », ou expliciter « Dieu infatigable et éternel ».
  rationale: Le grec présente deux vocatifs successifs avant l’impératif. Les conserver comme titres respecte la structure de l’invocation et évite d’ajouter « Dieu » là où il n’est pas répété.
- issue: Portée de ἐκ τοῦ ζῆν μεθισταμένους
  choice: L’expression décrit des personnes arrachées à la vie, donc menacées de mise à mort.
  alternative: Comprendre une éviction de leur mode de vie ou traduire directement « que l’on met à mort ».
  rationale: Dans le contexte d’une exécution imminente, la mort est bien visée, mais la traduction garde l’image grecque d’un déplacement hors de la vie.
- issue: Rapport de ἐν ἐπιβούλων τρόπῳ aux victimes et à leur traitement
  choice: La formulation française « à la manière de comploteurs » maintient l’indétermination syntaxique.
  alternative: Expliciter « comme si nous étions des conspirateurs » ou faire porter l’expression sur la conduite perfide des persécuteurs.
  rationale: Le grec ne précise pas entièrement s’il s’agit du traitement réservé à de prétendus comploteurs ou d’une manière d’agir caractéristique de comploteurs. Il ne faut pas trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de l’invocation est conservé par les deux titres divins successifs et par des impératifs brefs. « Hommes sans loi » et « comploteurs » gardent les distinctions lexicales du grec sans introduire de vocabulaire confessionnel.
