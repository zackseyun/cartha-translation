  text: Ô Roi à la puissance immense, Très-Haut, Dieu tout-puissant, toi qui gouvernes toute la création avec compassion[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « avec des compassions » : le grec emploie le pluriel, qui peut évoquer les manifestations répétées de la compassion ou son abondance.'
