lexical_decisions:
- source_word: βασιλεῦ
  choice: Ô Roi
  rationale: Le vocatif ouvre une prière adressée directement à Dieu. « Ô Roi » conserve la solennité de l’invocation sans être obscur.
- source_word: μεγαλοκράτωρ
  choice: à la puissance immense
  rationale: Ce composé rare associe grandeur et puissance souveraine. La locution qualifie naturellement « Roi » et évite de le confondre avec παντοκράτωρ.
- source_word: ὕψιστε
  choice: Très-Haut
  rationale: Titre divin biblique usuel qui restitue le superlatif et la forme d’adresse directe.
- source_word: παντοκράτωρ
  choice: tout-puissant
  rationale: Équivalent français consacré de ce titre divin, distinct de la qualification précédente et immédiatement compréhensible.
- source_word: δέε
  choice: Dieu
  rationale: Dans le contexte, la forme transmise correspond à l’adresse vocative à Dieu; « Dieu tout-puissant » forme en français un titre naturel et solennel.
- source_word: τὴν πᾶσαν … κτίσιν
  choice: toute la création
  rationale: κτίσις désigne ici l’ensemble de l’ordre créé; cette formulation est fidèle, claire et idiomatique.
- source_word: διακυβερνῶν
  choice: gouvernes
  rationale: Le verbe évoque l’action de diriger ou de piloter. « Gouverner » convient au registre royal et à la portée cosmique de la prière.
- source_word: ἐν οἰκτιρμοῖς
  choice: avec compassion
  rationale: Cette expression rend naturellement en français la manière miséricordieuse dont Dieu gouverne. Une note signale que le grec emploie un pluriel concret et expressif.
theological_decisions:
- issue: Accumulation des titres divins dans l’invocation
  choice: Conserver explicitement la série « Ô Roi à la puissance immense, Très-Haut, Dieu tout-puissant »
  alternative: Réduire ou fusionner les titres en une seule appellation
  rationale: Le grec accumule volontairement les titres pour célébrer la grandeur et la souveraineté divines. Les maintenir préserve la force rhétorique et théologique de la prière.
- issue: Sens de παντοκράτωρ
  choice: tout-puissant
  alternative: souverain de tout
  rationale: Les deux nuances sont possibles, mais « tout-puissant » est le titre biblique français traditionnel et demeure clair; le gouvernement universel est ensuite exprimé par « gouvernes toute la création ».
translation_notes:
  register: Français international moderne, digne et adapté à une prière solennelle. Le participe grec est rendu par « toi qui gouvernes » afin de conserver l’adresse directe et d’éviter une tournure française pesante. La ponctuation finale reste ouverte, puisque le verset se poursuit.
