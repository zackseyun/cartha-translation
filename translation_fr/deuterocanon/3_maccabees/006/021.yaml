  text: And the beasts turned against the armed forces following them[a], and they trampled them and destroyed them.
translation:
  language: fr
  text: Alors les bêtes se retournèrent contre les troupes armées qui les accompagnaient[a] ; elles les piétinèrent et les détruisirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui marchaient à leur suite ». Le participe grec peut signifier « accompagner » ou « suivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: se retournèrent contre
  rationale: Le verbe actif, dont « les bêtes » est le sujet, décrit un changement de direction vers une nouvelle cible ; « contre » exprime naturellement l’hostilité confirmée par la suite.
- source_word: τὰ θηρία
  choice: les bêtes
  rationale: « Bêtes » conserve la force de θηρία et convient aux éléphants du récit, sans les réduire au terme plus neutre « animaux ».
- source_word: ἐπὶ
  choice: contre
  rationale: Avec ce mouvement suivi d’une attaque, ἐπί marque ici la direction hostile.
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  choice: les troupes armées qui les accompagnaient
  rationale: « Troupes armées » rend clairement ἔνοπλους δυνάμεις ; « accompagnaient » conserve le sens de συνεπομένας sans préciser davantage que le grec la relation exacte avec les bêtes.
- source_word: κατεπάτουν
  choice: piétinèrent
  rationale: Le verbe évoque l’action de fouler et d’écraser sous les pieds. Le passé simple donne au récit français une tenue digne, tandis que la coordination présente l’action dans sa progression narrative.
- source_word: ὠλέθρευον
  choice: anéantirent
  rationale: « Anéantirent » restitue la gravité de ὀλεθρεύω, qui désigne une destruction mortelle, avec plus de force que le simple « tuèrent ».
