  source_fidelity: 'Le sens est fidèlement rendu : les titres divins, la manifestation de la face sainte, l’ouverture des portes célestes, les deux anges glorifiés et l’exception concernant les Juifs sont tous conservés. Une formulation un peu plus directement liée à la structure grecque rend mieux le rapport entre les portes et la descente des anges.'
