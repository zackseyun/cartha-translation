base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/018.yaml
  text: Then the greatly glorious, almighty, and true God, revealing his holy face, opened the gates of heaven, from which two glorious angels of fearful appearance came down, visible to everyone except the Jews,
translation:
  language: fr
  text: Alors le Dieu souverainement glorieux, tout-puissant et véritable manifesta sa sainte face[a] et ouvrit les portes célestes, d’où descendirent deux anges glorifiés, à l’aspect terrifiant, visibles de tous sauf des Juifs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa sainte présence »; littéralement « sa sainte face ».
    reason: Alternative lexicale pour πρόσωπον, qui peut désigner la face ou, par extension, la présence.
lexical_decisions:
- source_word: μεγαλοδόξος
  choice: souverainement glorieux
  rationale: Le composé intensifie la gloire divine. « Souverainement glorieux » garde cette emphase dans un français élevé et naturel.
- source_word: παντοκράτωρ
  choice: tout-puissant
  rationale: Équivalent français consacré et idiomatique pour ce titre divin.
- source_word: ἀληθινὸς θεός
  choice: Dieu véritable
  rationale: Cette formulation naturelle conserve la portée contrastive de ἀληθινός.
- source_word: ἐπιφάνας
  choice: manifesta
  rationale: Avec « sa sainte face » comme complément, le verbe exprime le fait de rendre visible ou manifeste.
- source_word: τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: sa sainte face
  rationale: « Face » préserve l’image anthropomorphique concrète de πρόσωπον; « présence » demeure une possibilité de sens signalée en note.
- source_word: ἠνέῳξε τὰς οὐρανίους πύλας
  choice: ouvrit les portes célestes
  rationale: Rend directement l’adjectif οὐρανίους tout en restant idiomatique en français.
- source_word: δεδοξασμένοι
  choice: glorifiés
  rationale: Le participe parfait passif décrit les anges comme ayant été revêtus de gloire; « glorifiés » en conserve plus précisément la forme que « glorieux ».
- source_word: φοβεροειδεῖς
  choice: à l’aspect terrifiant
  rationale: Le composé désigne une apparence qui suscite la peur; cette tournure est claire, actuelle et digne.
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  choice: visibles de tous sauf des Juifs
  rationale: La proposition concerne leur manifestation perceptible et maintient explicitement l’exception formulée par le grec.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu dans τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: sa sainte face
  alternative: sa sainte présence
  rationale: Le texte grec emploie une image corporelle concrète. La traduction la conserve sans l’atténuer, tout en indiquant en note la valeur possible de « présence ».
- issue: Exception des Juifs dans la proposition de visibilité
  choice: visibles de tous sauf des Juifs
  alternative: manifestes à tous, excepté aux Juifs
  rationale: La traduction maintient sans explication ajoutée l’affirmation narrative selon laquelle les anges étaient perceptibles à tous sauf aux Juifs.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase conserve l’élévation des titres divins, l’image concrète de la face de Dieu et la cadence suspendue indiquée par la virgule finale du texte source.
