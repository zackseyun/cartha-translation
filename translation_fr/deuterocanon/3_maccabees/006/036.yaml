base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/036.yaml
  text: And having established a common ordinance concerning these things for all their community throughout their generations[a], they decreed that the previously mentioned days should be observed as days of rejoicing, not for the sake of drinking and gluttony, but because of the deliverance that had come to them through God.
translation:
  language: fr
  text: Après avoir fixé à ce sujet une règle commune, valable pour toute leur communauté de génération en génération, ils décidèrent de célébrer les jours mentionnés plus haut comme des jours de réjouissance, non pour boire et se livrer à la gloutonnerie, mais à cause de la délivrance qui leur était venue par l’intermédiaire des dieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte ici « des dieux ». Dans ce récit juif, on pourrait s’attendre à « de Dieu »; le pluriel peut refléter la formulation transmise ou un emploi particulier, mais il est conservé dans le texte.
    reason: La forme grecque crée une tension textuelle et théologique que la traduction ne doit pas effacer.
lexical_decisions:
- source_word: κοινὸν … θεσμὸν
  choice: une règle commune
  rationale: Cette expression restitue le caractère collectif et normatif de la décision dans un français actuel, sans donner à θεσμός un sens juridique trop technique.
- source_word: ὁρισάμενοι
  choice: après avoir fixé
  rationale: Le participe exprime l’établissement formel de la règle; la tournure temporelle française conserve son rapport avec le verbe principal.
- source_word: ἐπὶ πᾶσαν τὴν παροικίαν αὐτῶν
  choice: valable pour toute leur communauté
  rationale: παροικία désigne ici la communauté vivant en situation de résidence minoritaire. « Communauté » est naturel; « valable pour » explicite la portée de la règle indiquée par ἐπί.
- source_word: εἰς γενεάς
  choice: de génération en génération
  rationale: Cette expression idiomatique rend la continuité de l’observance au fil des générations.
- source_word: τὰς προειρημένας ἡμέρας
  choice: les jours mentionnés plus haut
  rationale: La traduction garde clairement le renvoi aux jours déjà indiqués dans le récit.
- source_word: ἄγειν … εὐφροσύνους
  choice: célébrer … comme des jours de réjouissance
  rationale: Avec des jours pour complément, ἄγειν signifie les observer ou les célébrer; εὐφροσύνους en précise le caractère joyeux.
- source_word: πότου
  choice: boire
  rationale: Le nom désigne l’action de boire, éventuellement avec l’idée d’excès. L’infinitif s’intègre naturellement à la construction française.
- source_word: λιχνείας
  choice: se livrer à la gloutonnerie
  rationale: Le terme évoque l’avidité et l’excès dans la nourriture; cette formulation conserve sa portée morale.
- source_word: σωτηρίας
  choice: délivrance
  rationale: Dans ce contexte narratif, le mot désigne un sauvetage concret face au danger tout en conservant sa dimension religieuse.
- source_word: τῆς διὰ θεῶν γενομένης αὐτοῖς
  choice: qui leur était venue par l’intermédiaire des dieux
  rationale: Cette traduction suit la forme plurielle θεῶν du texte grec fourni et conserve ainsi sa difficulté théologique au lieu de la corriger silencieusement.
theological_decisions:
- issue: La forme plurielle θεῶν dans un récit juif
  choice: par l’intermédiaire des dieux
  alternative: par l’intermédiaire de Dieu
  rationale: Le texte grec transmis par l’édition fournie porte sans ambiguïté morphologique le pluriel « des dieux ». Bien que le contexte juif puisse suggérer une référence au Dieu unique ou une anomalie de transmission, le texte principal conserve la forme attestée et la note expose la tension sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement juridique puis festif du grec, tout en évitant les archaïsmes comme « ordonnance » ou « susmentionnés ». Le marqueur [a] est placé immédiatement après l’expression concernée.
