  text: And they approached the king[a], asking for their release to their own homes.
translation:
  language: fr
  text: Ils s’adressèrent au roi et lui demandèrent de les laisser retourner chez eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retourner dans leurs propres lieux ». L’expression grecque peut désigner plus largement ce qui leur appartient, mais elle évoque probablement ici leur retour chez eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέτυχον
  choice: s’adressèrent à
  rationale: Le verbe peut exprimer le fait de rencontrer quelqu’un, de l’aborder ou de lui présenter une requête. Ici, « s’adressèrent au roi » rend naturellement l’audience et la démarche sans en faire nécessairement une pétition juridique formelle.
- source_word: τῷ βασιλεῖ
  choice: au roi
  rationale: Le datif désigne la personne à laquelle ils s’adressent ; « au roi » en est la traduction directe.
- source_word: τὴν ἀπόλυσιν αὐτῶν
  choice: de les laisser retourner
  rationale: ἀπόλυσις signifie libération, congé ou autorisation de partir. Dans ce contexte, la tournure verbale française exprime clairement qu’ils demandent l’autorisation de repartir, sans suggérer une émancipation juridique plus large.
- source_word: εἰς τὰ ἴδια
  choice: chez eux
  rationale: L’expression idiomatique désigne ce qui appartient en propre à quelqu’un et, dans un contexte de retour, son lieu ou son foyer. « Chez eux » est naturel en français moderne tout en conservant cette idée.
- source_word: αἰτούμενοι
  choice: lui demandèrent
  rationale: Le participe indique la teneur de leur démarche auprès du roi. La coordination en français rend la relation avec naturel et exactitude.
