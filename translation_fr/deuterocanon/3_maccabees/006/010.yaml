base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/010.yaml
  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
translation:
  language: fr
  text: Mais si, dans notre lieu d’exil[a], notre conduite a été mêlée à l’impiété, alors, après nous avoir délivrés de la main de nos ennemis, fais-nous périr de la mort que tu choisiras, Maître[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans notre colonie » ou « dans notre établissement » ; le mot grec peut désigner une colonie ou un établissement, mais il évoque probablement ici la vie de la communauté en exil.
    reason: lexical_alternative
  - marker: b
    text: Ou « Seigneur » ou « Souverain » ; le terme grec est δέσποτα, et non κύριος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  choice: l’impiété
  rationale: Le terme désigne un manque de respect envers Dieu ou une conduite contraire à la piété; « impiété » en conserve clairement la portée religieuse et morale.
- source_word: κατὰ τὴν ἀποικίαν
  choice: dans notre lieu d’exil
  rationale: ἀποικία peut désigner une colonie ou un établissement, mais le contexte évoque ici la vie de la communauté juive loin de sa patrie. Cette formulation préserve la dimension locale explicite sans suggérer une entreprise coloniale au sens moderne.
- source_word: ὁ βίος ἡμῶν
  choice: notre conduite
  rationale: βίος renvoie ici à la manière de vivre plutôt qu’à la seule existence; « conduite » exprime naturellement cette nuance éthique en français.
- source_word: ἐνέσχηκται
  choice: s’est engagée dans
  rationale: Le parfait exprime l’entrée dans un état d’implication durable. La formulation conserve cette idée sans préciser abusivement la nature de l’implication.
- source_word: ῥυσάμενος
  choice: après nous avoir délivrés
  rationale: Le participe aoriste indique une action antérieure à l’impératif principal; « après nous avoir délivrés » rend clairement cet enchaînement.
- source_word: ἀπὸ ἐχθρῶν χειρός
  choice: de la main de nos ennemis
  rationale: Cette expression biblique désigne la délivrance du pouvoir ennemi; le calque demeure idiomatique et intelligible en français.
- source_word: ᾧ προαιρῇ … μόρῳ
  choice: de la mort que tu choisiras
  rationale: Le relatif au datif associé à προαιρέω exprime le choix divin du genre de mort. La construction française réunit naturellement les deux éléments.
- source_word: δέσποτα
  choice: Maître
  rationale: δέσποτα exprime l’autorité absolue et se distingue de κύριος. « Maître » maintient cette distinction lexicale.
- source_word: ἀπόλεσον ἡμᾶς
  choice: fais-nous périr
  rationale: Dans cette prière, l’impératif demande à Dieu de mettre fin à leur vie plutôt que de les abandonner aux ennemis; cette traduction garde la force du verbe sans l’aplatir.
theological_decisions:
- issue: Titre d’adresse δέσποτα
  choice: Maître
  alternative: Seigneur; Souverain
  rationale: Le grec porte δέσποτα et non κύριος. « Maître » conserve cette différence et l’idée d’autorité absolue, sans importer un titre divin différent.
- issue: Sens de ἀποικία dans la prière de la diaspora
  choice: dans notre lieu d’exil
  alternative: dans notre colonie; dans notre établissement; durant notre séjour loin de la patrie
  rationale: Le contexte concerne une communauté vivant loin de sa patrie sous une puissance étrangère. « Lieu d’exil » communique ce cadre tout en évitant les connotations modernes trompeuses de « colonie ».
- issue: Demande de mort adressée à Dieu
  choice: fais-nous périr de la mort que tu choisiras
  alternative: mets-nous à mort de la manière que tu choisiras
  rationale: 'La formulation préserve la tension du texte: l’orant demande d’abord la délivrance des ennemis, puis accepte que Dieu le fasse périr si sa conduite est impie. Elle ne cherche pas à atténuer ou à expliquer cette demande.'
translation_notes:
  register: Français international moderne, digne et adapté à une prière solennelle. La syntaxe conserve l’ordre logique du grec, notamment l’antériorité de la délivrance, tout en restant naturelle. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
