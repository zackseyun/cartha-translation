base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
translation:
  language: fr
  text: Ceux qui, auparavant, les considéraient comme voués à la destruction et à être dévorés par les oiseaux[a], et qui les avaient inscrits avec joie, poussèrent de profonds gémissements en se couvrant de honte ; leur audace ardente[b] fut vigoureusement éteinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le participe grec rendu par « les considéraient comme voués » est difficile sur les plans textuel et syntaxique dans le témoin suivi par Swete. L’ensemble de la proposition indique clairement que ces gens considéraient auparavant les Juifs comme destinés à être détruits et livrés en pâture aux oiseaux.
    reason: textual_variant
  - marker: b
    text: 'Ou : « leur audace au souffle de feu ». L’image grecque évoque littéralement une audace « qui souffle le feu » et possède ici une forte valeur négative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὶν
  choice: Ceux qui, auparavant
  rationale: Cette formulation rend clairement la valeur temporelle de πρίν et souligne le renversement de situation.
- source_word: εἰς ὄλεθρον
  choice: voués à la destruction
  rationale: ὄλεθρος désigne la destruction ou la ruine ; « voués à » exprime ici le sort auquel ces gens destinaient les Juifs.
- source_word: οἰωνόβρωτους
  choice: à être dévorés par les oiseaux
  rationale: Ce composé rare décrit des corps livrés en pâture aux oiseaux ; la périphrase est claire et naturelle en français.
- source_word: ἐξεσθιέμενοι
  choice: les considéraient comme voués
  rationale: La forme transmise par le témoin de Swete est difficile sur les plans textuel et syntaxique. Cette traduction rend prudemment l'anticipation hostile indiquée par l'ensemble de la proposition sans imposer une reconstruction incertaine.
- source_word: ἀπογραφάμενοι
  choice: les avaient inscrits
  rationale: Le verbe appartient au vocabulaire de l'inscription ou de l'enregistrement officiel ; « inscrits » conserve cette nuance administrative.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Traduction directe et naturelle de l'expression grecque.
- source_word: κατεστέναξαν
  choice: poussèrent de profonds gémissements
  rationale: Le préverbe renforce l'idée de gémir ; cette expression française en restitue l'intensité.
- source_word: αἰσχύνην ἐφʼ ἑαυτοῖς περιβαλόμενοι
  choice: en se couvrant de honte
  rationale: La formulation conserve l'image de la honte dont on se revêt tout en restant idiomatique en français.
- source_word: πυρόπνουν τόλμαν
  choice: leur audace au souffle de feu
  rationale: Cette expression garde la métaphore saisissante de πυρόπνους et la hardiesse de τόλμα ; le contexte donne à cette audace une valeur nettement négative.
- source_word: ἀκμαίως ἐσβεσμένοι
  choice: fut vigoureusement étouffée
  rationale: Le verbe évoque l'extinction d'un feu et répond ainsi à l'image précédente ; « vigoureusement » rend la force adverbiale de ἀκμαίως sans lui donner à tort le sens de « complètement ».
