  text: And even the king’s body became seized with shuddering[b][a], and his heavy-hearted boldness was overcome by forgetfulness.
translation:
  language: fr
  text: Même le corps du roi fut pris de frissons, et l’oubli s’empara de son audace farouche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la confusion s’empara de son insolence sombre ». Le grec dit littéralement « l’oubli »; dans ce contexte, le mot peut évoquer une désorientation soudaine qui anéantit sa détermination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  choice: pris de frissons
  rationale: L’adjectif décrit un frémissement physique mêlé d’effroi; cette tournure conserve la réaction corporelle explicitée par σῶμα.
- source_word: σῶμα
  choice: corps
  rationale: Le grec nomme expressément le corps du roi et souligne ainsi la manifestation physique de sa peur.
- source_word: λήθη
  choice: oubli
  rationale: Le sens lexical premier est « oubli »; il reste dans le texte principal afin de préserver l’image grecque, tandis qu’une note signale la possible idée de désorientation.
- source_word: θράσος
  choice: audace
  rationale: Le mot peut désigner une hardiesse présomptueuse ou insolente. « Audace » conserve cette coloration négative mieux que « courage ».
- source_word: βαρύθυμον
  choice: farouche
  rationale: Dans ce contexte, le composé qualifie vraisemblablement une disposition sombre, dure ou intraitable. « Farouche » donne une expression française naturelle sans réduire le terme à la tristesse suggérée par un calque comme « au cœur lourd ».
- source_word: ἔλαβεν
  choice: s’empara de
  rationale: Le verbe signifie littéralement « prit, saisit ». En gardant λήθη comme sujet, « s’empara de » reproduit naturellement la construction et l’idée que l’oubli neutralise l’audace du roi.
