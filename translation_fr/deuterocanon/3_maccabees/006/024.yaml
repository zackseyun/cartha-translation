base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
translation:
  language: fr
  text: Vous avez surpassé les rois et dépassé les tyrans en cruauté. Et maintenant, vous cherchez même à me priver, moi, votre bienfaiteur, du pouvoir et de la vie[a], en tramant en secret des projets contraires aux intérêts du royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec πνεῦμα peut aussi signifier « souffle » ou « esprit ». Dans ce contexte, il peut désigner le souffle vital et, par extension, la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  choice: Vous avez surpassé les rois
  rationale: Le parfait, en parallèle avec « dépassé les tyrans », exprime le fait d’être allé au-delà des rois. Cette formulation française conserve la comparaison et la force de l’accusation.
- source_word: τυράννους ὑπερβεβήκατε ὠμότητι
  choice: dépassé les tyrans en cruauté
  rationale: La tournure comparative signifie qu’ils ont été plus loin que les tyrans sous le rapport de la cruauté. « Cruauté » rend clairement ὠμότης.
- source_word: ἐμὲ αὐτὸν
  choice: me priver, moi-même
  rationale: Le pronom disjoint « moi-même » maintient l’insistance indignée du grec.
- source_word: τὸν ὑμῶν εὐεργέτην
  choice: votre bienfaiteur
  rationale: « Bienfaiteur » est l’équivalent naturel du titre hellénistique εὐεργέτης et conserve sa portée personnelle et politique.
- source_word: ἐπιχειρεῖτε
  choice: vous cherchez ... à
  rationale: Cette expression française naturelle traduit une tentative en cours sans présumer qu’elle réussira.
- source_word: τῆς ἀρχῆς
  choice: du pouvoir
  rationale: Dans ce contexte politique, ἀρχή désigne le pouvoir ou l’autorité de gouverner.
- source_word: τοῦ πνεύματος
  choice: de la vie
  rationale: Associé à la perte du pouvoir et à un complot clandestin, πνεῦμα désigne vraisemblablement ici le souffle vital, donc la vie. Une note conserve les sens plus littéraux.
- source_word: μεθιστᾶν
  choice: priver
  rationale: Le verbe signifie faire quitter une position ou un état. En français, « priver du pouvoir et de la vie » rend naturellement les deux compléments.
- source_word: λάθρα μηχανώμενοι
  choice: en tramant en secret
  rationale: La formulation exprime à la fois l’élaboration hostile d’un complot et son caractère clandestin.
- source_word: τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  choice: des projets contraires aux intérêts du royaume
  rationale: Cette tournure idiomatique traduit ce qui n’est pas avantageux ou profitable au royaume, sans préciser davantage la nature des projets.
theological_decisions:
- issue: Sens de πνεῦμα dans l’accusation
  choice: vie
  alternative: esprit ou souffle
  rationale: Le contexte d’éviction politique et de complot rend probable une allusion à la mise à mort. Toutefois, comme πνεῦμα signifie littéralement « souffle » ou « esprit », la note préserve cette pluralité lexicale sans en tirer de conclusion anthropologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme accusateur de la première proposition est conservé; la syntaxe de la seconde est légèrement réorganisée pour rester naturelle en français.
