  yaml_path: translation/deuterocanon/3_maccabees/006/027.yaml
  text: Release[a], release the unjust bonds; send them away to their own homes in peace[b], setting aside what has been ordered.
translation:
  language: fr
  text: Déliez-les, défaites leurs liens injustes ; renvoyez-les en paix chez eux[a], en abandonnant les ordres qui avaient été donnés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers leur propre demeure ». Le grec peut désigner plus largement ce qui leur appartient ou le lieu qui est le leur.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce qui avait été ordonné ». Le grec désigne collectivement les prescriptions données auparavant.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύσατε
  choice: Déliez-les
  rationale: L’impératif pluriel de λύω exprime l’action de libérer ou de délier. Le pronom « les », implicite dans le contexte grec, rend la phrase naturelle en français et renvoie aux personnes détenues.
- source_word: ἐκλύσατε
  choice: défaites
  rationale: Ce second impératif renforce le premier et porte sur « les liens injustes ». « Défaites » conserve l’image concrète du déliement tout en évitant une répétition peu naturelle en français.
- source_word: ἄδικα δεσμά
  choice: leurs liens injustes
  rationale: δεσμά désigne des entraves ou des liens, au sens propre ou figuré, et ἄδικα les qualifie comme moralement et juridiquement iniques. Le possessif explicite le rapport contextuel avec les détenus.
- source_word: εἰς τὰ ἴδια
  choice: chez eux
  rationale: L’expression peut désigner ce qui appartient aux personnes, leur foyer ou leur propre lieu. « Chez eux » est l’expression française la plus naturelle dans ce contexte de retour après une libération, tandis qu’une note préserve l’étendue du grec.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Cette tournure française directe conserve l’idée d’un départ sans violence ni hostilité et le registre digne de l’original.
- source_word: ἐξαποστείλατε
  choice: renvoyez-les
  rationale: Le verbe signifie envoyer au loin ou laisser repartir. « Renvoyez-les » convient au retour des détenus chez eux sans suggérer nécessairement une expulsion hostile.
- source_word: τὰ προστεταγμένα
  choice: les ordres qui avaient été donnés
  rationale: Le participe parfait passif substantivé renvoie aux prescriptions déjà formulées. La tournure ne précise pas leur auteur et marque leur antériorité.
- source_word: παραιτησάμενοι
  choice: en abandonnant
  rationale: Le participe aoriste moyen exprime ici le fait de renoncer aux mesures antérieurement ordonnées ou de les laisser sans effet. « En abandonnant » reste naturel sans préciser excessivement la procédure d’annulation.
