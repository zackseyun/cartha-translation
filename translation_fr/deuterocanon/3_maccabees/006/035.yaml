    issue: Aspect verbal et relation syntaxique
    rationale: Le grec associe le participe aoriste συστησάμενοι (« après avoir formé/organisé ») à l’imparfait διῆγον (« passaient leur temps »). Les deux passés simples français présentent les actions comme coordonnées et ponctuelles, au lieu de marquer l’antériorité de la première et la durée de la seconde.
  - severity: low
    issue: Choix de « constituèrent »
    rationale: Le verbe est possible, mais « formé » est plus idiomatique pour un chœur et correspond sans surcharge au sens de συστησάμενοι.
