  yaml_path: translation/deuterocanon/3_maccabees/006/035.yaml
  text: And the Jews[a], as we said before, having formed the previously mentioned chorus, spent their time with feasting, in joyful thanksgivings and psalms[b],
translation:
  language: fr
  text: Les Juifs, comme nous l’avons dit plus haut, après avoir formé le chœur déjà mentionné[a], passaient leur temps à festoyer, au milieu de joyeuses actions de grâce[b] et de psaumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir organisé la troupe déjà mentionnée ». Le grec χορός peut désigner un chœur ou un groupe organisé qui chante et danse.
    reason: lexical_alternative
  - marker: b
    text: Ici, le terme grec rendu par « actions de grâce » désigne probablement la reconnaissance ou la louange, et non la confession des péchés.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  choice: Les Juifs
  rationale: Dans ce récit, Ἰουδαῖοι désigne la communauté ethnoreligieuse juive d’Égypte plutôt que les seuls habitants de la Judée.
- source_word: καθὼς προειρήκαμεν
  choice: comme nous l’avons dit plus haut
  rationale: Cette formulation naturelle conserve le renvoi rétrospectif explicite du narrateur.
- source_word: συστησάμενοι
  choice: constituèrent
  rationale: Le participe exprime ici l’organisation ou la formation du groupe; la coordination française rend naturellement son antériorité par rapport à l’activité qui suit.
- source_word: τὸν προειρημένον χορὸν
  choice: le chœur déjà mentionné
  rationale: χορὸς peut désigner un chœur ou une troupe chantant et dansant. « Chœur » convient au contexte des psaumes tout en maintenant l’image grecque; une note préserve l’ambiguïté.
- source_word: μετʼ εὐωχίας
  choice: à festoyer
  rationale: εὐωχία évoque les réjouissances d’un festin; le verbe français donne une expression actuelle et fluide.
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  choice: au milieu de joyeuses actions de grâce
  rationale: Dans ce contexte cultuel juif grec, ἐξομολόγησις désigne vraisemblablement l’action de grâce ou la louange, plutôt que la confession des péchés; ἱλαραῖς en souligne la joie.
- source_word: καὶ ψαλμοῖς
  choice: et de psaumes
  rationale: « Psaumes » est l’équivalent direct et usuel de ψαλμοῖς dans un cadre liturgique.
- source_word: διῆγον
  choice: passèrent leur temps
  rationale: Cette tournure rend la durée exprimée par l’imparfait grec sans alourdir la phrase.
theological_decisions:
- issue: Sens cultuel de ἐξομολόγησις
  choice: actions de grâce
  alternative: confessions
  rationale: Le contexte de célébration joyeuse et de psaumes favorise nettement le sens de reconnaissance ou de louange, tout en justifiant une note signalant la valeur lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale grecque est rendue par deux verbes coordonnés pour plus de naturel, tandis que les ambiguïtés de χορός et de ἐξομολόγησις sont conservées en notes.
