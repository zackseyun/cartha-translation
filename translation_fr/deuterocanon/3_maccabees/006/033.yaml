revisions:
- from: De même, le roi organisa lui aussi, à cette occasion, un grand banquet[a] et ne cessa d’adresser au ciel de solennelles actions de grâce pour la délivrance extraordinaire dont ils avaient bénéficié[b].
  to: De même, le roi lui aussi, tenant à cette occasion un grand banquet[a], rendait continuellement au ciel de grandes actions de grâce pour leur délivrance extraordinaire qui leur était survenue[b].
  rationale: La révision préserve la structure participiale et l’imparfait duratif du grec, remplace une intensification cérémonielle par une intensification d’ampleur, et conserve le caractère accompli de la délivrance. Les deux ancres de notes et leurs sens lexicaux sont maintenus.
