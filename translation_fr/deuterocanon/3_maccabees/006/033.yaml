  yaml_path: translation/deuterocanon/3_maccabees/006/033.yaml
  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
translation:
  language: fr
  text: De même, le roi lui aussi, tenant à cette occasion un grand banquet[a], rendait continuellement au ciel de grandes actions de grâce pour leur délivrance extraordinaire qui leur était survenue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « un banquet lourd » : expression désignant ici un banquet important ou abondant ; autre traduction possible : « un somptueux festin ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « pour leur salut extraordinaire qui leur était survenu ». Dans ce récit, « délivrance » souligne le sauvetage concret dont ils ont été l’objet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: De même
  rationale: Introduit naturellement en français le parallèle avec ce qui précède.
- source_word: περὶ τούτων
  choice: à cette occasion
  rationale: Dans le contexte du banquet, la préposition exprime l’occasion ou le motif lié aux événements précédents, plutôt qu’un simple sujet de discussion.
- source_word: συμπόσιον βαρὺ
  choice: un grand banquet
  rationale: συμπόσιον désigne un banquet; βαρύ, littéralement « lourd », en souligne ici l’importance ou l’abondance. « Grand banquet » conserve ce sens sans littéralisme obscur.
- source_word: ἀδιαλείπτως
  choice: ne cessa d’adresser
  rationale: Rend la continuité exprimée par l’adverbe et l’aspect duratif de l’imparfait dans un français naturel.
- source_word: εἰς οὐρανόν
  choice: au ciel
  rationale: Préserve la désignation grecque et sa probable valeur métonymique respectueuse, sans la remplacer explicitement par « à Dieu ».
- source_word: ἀνθωμολογεῖτο μεγαλομερῶς
  choice: de solennelles actions de grâce
  rationale: Dans ce contexte, le verbe exprime une reconnaissance reconnaissante; l’adverbe intensifie et élève la manière de rendre grâce. « Solennelles » convient au registre royal et festif.
- source_word: παραδόξῳ
  choice: extraordinaire
  rationale: Exprime ce qui dépasse l’attente et suscite l’étonnement, sans imposer le sens plus théologique de « miraculeuse ».
- source_word: γενηθείσῃ αὐτῶν σωτηρίᾳ
  choice: la délivrance […] dont ils avaient bénéficié
  rationale: σωτηρία désigne ici le sauvetage concret raconté dans le contexte; cette formulation française rend l’événement accompli exprimé par le participe γενηθείσῃ.
theological_decisions:
- issue: Sens de σωτηρία dans un récit de sauvetage
  choice: délivrance
  alternative: salut
  rationale: Le contexte immédiat célèbre le sauvetage historique du peuple. « Délivrance » communique ce sens concret tout en laissant subsister sa portée théologique éventuelle.
- issue: Référent de εἰς οὐρανόν
  choice: au ciel
  alternative: à Dieu
  rationale: Le grec nomme le ciel, vraisemblablement par métonymie respectueuse. La traduction maintient cette retenue au lieu d’expliciter un référent que le texte ne nomme pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite les lourdeurs du calque tout en conservant la continuité de l’action, le registre élevé des actions de grâce et l’ambiguïté respectueuse de « ciel ».
