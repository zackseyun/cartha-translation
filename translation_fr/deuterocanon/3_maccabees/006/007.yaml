base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/007.yaml
  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
translation:
  language: fr
  text: Toi, tu as ramené Daniel à la lumière, indemne, lui qui avait été jeté aux lions, à terre, comme pâture pour les bêtes, par des calomnies nées de l’envie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec comporte ici une expression difficile, littéralement « à terre » ou « sur le sol ». Elle est conservée plutôt que remplacée par une mention de la fosse du récit de Daniel.
    reason: textual_variant
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  choice: à cause d’accusations inspirées par l’envie
  rationale: διαβολαῖς désigne des accusations malveillantes ou des calomnies, tandis que le génitif φθόνου en indique vraisemblablement la source ou le caractère. Cette formulation française conserve les deux éléments sans trancher inutilement entre accusation et calomnie.
- source_word: λέουσι
  choice: devant les lions
  rationale: Le datif pluriel désigne les lions auxquels Daniel est livré. « Devant les lions » s’accorde naturellement avec l’image de quelqu’un jeté à terre, tout en évitant d’ajouter la fosse absente du grec.
- source_word: κατὰ γῆς
  choice: à terre
  rationale: La locution signifie littéralement « à terre/sur le sol ». Sa présence difficile dans le texte transmis est conservée sans harmonisation avec le récit de Daniel.
- source_word: ῥιφέντα
  choice: avait été jeté
  rationale: Le participe aoriste passif de ῥίπτω exprime une action violente antérieure au sauvetage; le plus-que-parfait est naturel dans la phrase française.
- source_word: θηρσὶ βορὰν
  choice: pour servir de nourriture aux bêtes
  rationale: βορά signifie nourriture ou proie, et θηρσί désigne les bêtes. La tournure exprime clairement le sort auquel Daniel était destiné.
- source_word: εἰς φῶς
  choice: à la lumière
  rationale: La traduction garde l’image du passage vers la lumière et sa portée de délivrance, sans la réduire à une simple formule signifiant « sauver ».
- source_word: ἀνήγαγες
  choice: tu as ramené
  rationale: ἀνάγω signifie faire monter ou ramener. Avec εἰς φῶς, « ramener à la lumière » est idiomatique et préserve à la fois le mouvement et l’image de délivrance.
- source_word: ἀσινῆ
  choice: sain et sauf
  rationale: L’adjectif signifie indemne, sans dommage. « Sain et sauf » est une expression française courante, claire et digne.
theological_decisions:
- issue: Allusion à la délivrance de Daniel parmi les lions
  choice: Conserver une adresse directe à Dieu et rappeler le sauvetage sans ajouter la « fosse aux lions ».
  alternative: Expliciter « la fosse aux lions » d’après le récit de Daniel.
  rationale: Le grec nomme Daniel, les lions et sa délivrance, mais pas la fosse. La traduction ne complète donc pas le texte à partir du récit connu.
- issue: Interprétation de la locution difficile κατὰ γῆς
  choice: La rendre par « à terre » et signaler la difficulté en note.
  alternative: L’omettre comme corruption ou la remplacer par « dans la fosse ».
  rationale: La locution appartient au texte grec fourni. La conserver respecte le témoin source et évite toute harmonisation silencieuse.
translation_notes:
  register: Français international moderne, naturel et digne. L’ouverture emphatique « Toi, tu » reflète le pronom grec exprimé σὺ dans une prière adressée directement à Dieu. La phrase conserve l’image de la lumière ainsi que l’étrangeté de « à terre », avec une note explicative.
