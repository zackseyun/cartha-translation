  naturalness: La phrase révisée est fluide en français moderne tout en conservant l’ordre logique et l’imagerie du grec. « Indemne » est plus direct et plus sobre que « sain et sauf » dans cette évocation solennelle.
  terminology: « Calomnies nées de l’envie » restitue διαβολαῖς φθόνου sans décider indûment si le génitif est subjectif ou descriptif. « Jeté aux lions » exprime le mouvement de livraison du datif λέουσι. « Comme pâture pour les bêtes » rend θηρσὶ βορὰν.
