  terminology: « Miséricorde » rend plus directement ἔλεος dans une invocation biblique. « Saints » reste ici une désignation descriptive des personnes consacrées d’Israël, sans imposer un sens ecclésiastique ultérieur. « Lignée » conserve la dimension de descendance de γένος; « nations » rend ἔθνη sans surinterpréter son opposition contextuelle à Israël.
