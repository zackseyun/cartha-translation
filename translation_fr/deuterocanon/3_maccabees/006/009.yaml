  to: Et maintenant, toi qui hais l’insolence, riche en miséricorde, juge de tous, manifeste-toi vite aux saints de la lignée d’Israël, qui subissent les outrages de nations abominables et sans loi.[a]
  rationale: La révision rétablit l’adresse directe « aux saints », remplace une expression française lourde par une formulation naturelle qui préserve la portée généalogique de γένος, et maintient la vigueur des mauvais traitements insolents exprimés par ὑβριζομένοις. Elle conserve l’ambiguïté contextuelle de ἔθνη sans introduire « païens » ou « Gentils ».
