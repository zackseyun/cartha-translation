base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
translation:
  language: fr
  text: Et maintenant, toi qui hais l’insolence, riche en miséricorde, juge de tous, manifeste-toi vite aux saints de la lignée d’Israël, qui subissent les outrages de nations abominables et sans loi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « apparais vite aux saints de la lignée d’Israël ». « Manifeste-toi » souligne la manifestation visible et secourable demandée par le grec. Le verbe rendu par « subissent les outrages » peut aussi évoquer des mauvais traitements insolents et humiliants.'
    reason: Précise les nuances de ἐπιφάνηθι et de ὑβριζομένοις sans modifier le sens du texte principal.
lexical_decisions:
- source_word: μισόβρι
  choice: toi qui détestes l’insolence
  rationale: Le rare composé vocatif désigne celui qui hait l’insolence, l’arrogance outrageante ou les sévices qui en procèdent. Cette formulation française conserve l’adresse directe et le sens actif sans créer une épithète artificielle.
- source_word: πολυέλεε
  choice: toi qui abondes en compassion
  rationale: Le composé exprime une grande abondance d’ἔλεος. « Compassion » convient ici à une prière sollicitant une intervention secourable et demeure naturel en français actuel.
- source_word: τῶν ὅλων δίκαστα
  choice: juge de tous
  rationale: La formule maintient la portée universelle de τῶν ὅλων tout en restant concise et naturelle.
- source_word: τάχος
  choice: sans tarder
  rationale: Employé adverbialement, le nom presse Dieu d’intervenir immédiatement. « Sans tarder » restitue naturellement cette urgence.
- source_word: ἐπιφάνηθι
  choice: manifeste-toi
  rationale: L’impératif demande une manifestation visible et salvatrice. « Manifeste-toi » rend cette nuance mieux que le seul « apparais », sans préciser la forme de l’intervention.
- source_word: τοῖς ἁγίοις Ἰσραὴλ γένους
  choice: en faveur des membres saints du peuple d’Israël
  rationale: Le substantif adjectival désigne les personnes consacrées à Dieu, tandis que γένος marque leur appartenance au peuple issu d’Israël. La formulation évite les connotations modernes de « race » et les associations ecclésiales possibles de « saints » employé seul.
- source_word: ὑπὸ ἐβδελυγμένων ἀνόμων ἐθνῶν
  choice: de nations abominables et sans loi
  rationale: Les deux qualificatifs fortement dénonciateurs sont conservés. Dans ce contexte, ἔθνη désigne des peuples non israélites, mais « nations » préserve le terme sans rendre cette implication plus explicite que le grec.
- source_word: ὑβριζομένοις
  choice: victimes des outrages
  rationale: Le verbe évoque un traitement insolent, humiliant ou violent, plus fort qu’un simple mauvais traitement. La tournure française conserve cette intensité et s’intègre clairement à la syntaxe.
theological_decisions:
- issue: Désignation de personnes d’Israël comme τοῖς ἁγίοις
  choice: les membres saints du peuple d’Israël
  alternative: les saints de la lignée d’Israël
  rationale: Le texte qualifie de saints ceux qui appartiennent au γένος d’Israël. La traduction conserve à la fois la consécration religieuse et l’identité collective, sans transformer « saints » en titre chrétien ultérieur.
- issue: Portée de γένος
  choice: peuple d’Israël
  alternative: lignée d’Israël
  rationale: γένος comporte une dimension de parenté, d’origine et d’appartenance collective. « Peuple » est ici idiomatique et n’efface pas le cadre ethnique explicite d’Israël; « lignée » demeure possible si l’on veut accentuer la descendance.
- issue: Sens de l’intervention demandée par ἐπιφάνηθι
  choice: manifeste-toi
  alternative: apparais
  rationale: La prière demande à Dieu de se rendre perceptible par son intervention. La traduction préserve cette portée sans définir le mode de la manifestation.
translation_notes:
  register: Français international moderne, digne et adapté à une prière solennelle. Les vocatifs grecs sont rendus par des relatives d’adresse naturelles en français. La phrase conserve la vigueur polémique du grec tout en évitant des formulations françaises artificielles ou inutilement archaïques.
