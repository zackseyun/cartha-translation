translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure introductive et les titres officiels conservent la dignité d’un décret royal. La formulation de la dernière proposition respecte le caractère elliptique du grec sans reprendre l’interprétation moins assurée de « compte rendu complet ».
