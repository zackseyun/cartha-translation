  yaml_path: translation/deuterocanon/3_maccabees/006/041.yaml
  text: 'And when the king agreed with them[a], he wrote them the following letter to the generals in each city[b], magnanimously setting out the full account:'
translation:
  language: fr
  text: 'Après avoir accédé à leur demande, le roi leur écrivit avec magnanimité la lettre ci-dessous, destinée aux stratèges de chaque ville[a] et au contenu détaillé :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « stratèges » étaient des responsables exerçant des fonctions militaires ou civiques ; selon le contexte, le terme peut aussi être rendu par « commandants » ou « gouverneurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συναινέσας
  choice: ayant donné son accord
  rationale: Le participe aoriste exprime l’assentiment du roi à la demande qui vient d’être formulée.
- source_word: ἔγραψεν αὐτοῖς
  choice: il leur écrivit
  rationale: Le datif αὐτοῖς désigne les bénéficiaires de l’écrit; cette tournure est naturelle et concise en français.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: la lettre reproduite ci-dessous
  rationale: ὑπογεγραμμένην désigne littéralement ce qui est écrit plus bas; la formulation française introduit naturellement la lettre qui suit.
- source_word: πρὸς τοὺς κατὰ πόλιν στρατηγούς
  choice: adressée aux stratèges de chaque ville
  rationale: στρατηγοί est conservé par « stratèges », titre pouvant recouvrir des responsabilités militaires et administratives; κατὰ πόλιν a une valeur distributive.
- source_word: μεγαλοψύχως
  choice: avec grandeur d’âme
  rationale: L’expression rend la noblesse ou la générosité d’esprit suggérée par l’adverbe sans réduire celui-ci à la seule générosité matérielle.
- source_word: τὴν ἐκτενῆ ἔχουσαν
  choice: témoignant … de son profond empressement
  rationale: La formule grecque est elliptique et qualifie la lettre par l’intensité ou le zèle qu’elle manifeste; cette traduction garde cette idée sans la transformer en simple longueur ou en récit détaillé.
