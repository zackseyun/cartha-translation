base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/013.yaml
  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
translation:
  language: fr
  text: Mais qu’aujourd’hui les nations tremblent devant ta puissance invincible, ô toi qui es honoré, toi qui as le pouvoir de sauver la descendance de Jacob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple de Jacob ». Le grec γένος peut désigner une lignée, une famille ou un peuple issu d’un ancêtre commun.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτηξάτω
  choice: qu[’elles] tremblent
  rationale: L’impératif aoriste exprime ici la peur qui saisit et fait reculer. « Trembler devant » rend naturellement cette réaction de crainte en français, sans préciser outre mesure s’il s’agit de terreur, de recul ou de soumission.
- source_word: ἔθνη
  choice: les nations
  rationale: Le terme désigne collectivement les peuples environnants. « Les nations » conserve cette portée sans imposer ici l’opposition théologique particulière que pourrait suggérer « les païens ».
- source_word: σὴν δύναμιν ἀνίκητον
  choice: ta puissance invincible
  rationale: δύναμις désigne la puissance ou la force, et ἀνίκητος ce qui ne peut être vaincu. Cette formulation est à la fois proche du grec et idiomatique.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent temporel direct et naturel.
- source_word: ἔντιμε
  choice: ô toi qui es honoré
  rationale: Le vocatif adjectival signifie « honoré, estimé ». La formulation maintient cette adresse divine inhabituelle sans la remplacer par un titre absent du grec.
- source_word: δυνάμεις ἔχων
  choice: toi qui possèdes la puissance nécessaire
  rationale: Le participe ἔχων est rendu comme une qualification de la personne interpellée, sans lui imposer une valeur causale explicite. Le pluriel δυνάμεις peut évoquer des capacités ou des moyens puissants; en français, le singulier collectif « puissance » convient ici, tandis que « nécessaire » explicite le rapport final avec le salut sans ajouter une cause.
- source_word: ἐπὶ σωτηρίαν
  choice: pour sauver
  rationale: La préposition avec l’accusatif indique ici la finalité ou l’orientation vers la délivrance. La tournure verbale est plus naturelle en français moderne que « pour le salut de » dans cette phrase.
- source_word: Ἰακὼβ γένους
  choice: la descendance de Jacob
  rationale: γένος peut désigner la lignée, la famille issue d’un ancêtre ou le peuple qui en descend. « Descendance » exprime clairement le lien généalogique collectif sans les connotations modernes de « race ».
theological_decisions:
- issue: Traduction de l’adresse divine ἔντιμε
  choice: ô toi qui es honoré
  alternative: ô toi qui es digne d’honneur ; ô toi qui es révéré
  rationale: Le grec emploie un adjectif d’honneur comme apostrophe directe à Dieu, et non un titre divin conventionnel. La traduction préserve cette étrangeté et n’introduit ni « Seigneur » ni un autre titre absent du texte.
- issue: Valeur de la proposition participiale δυνάμεις ἔχων
  choice: toi qui possèdes la puissance nécessaire pour sauver
  alternative: puisque tu as le pouvoir de sauver
  rationale: La construction participiale peut être comprise comme descriptive ou circonstancielle. La traduction retient une formulation descriptive afin de ne pas rendre explicitement causale une relation que le grec laisse implicite.
translation_notes:
  register: Prière élevée mais intelligible en français international moderne. L’apostrophe « ô toi qui es honoré » conserve le caractère inhabituel du grec. « Descendance » évite les connotations contemporaines problématiques de « race » tout en maintenant le sens généalogique.
