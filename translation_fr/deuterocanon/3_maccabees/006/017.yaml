  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
translation:
  language: fr
  text: Quand les Juifs virent cela, ils poussèrent un grand cri vers le ciel, si bien que même les cours voisines résonnèrent de leur cri[a], provoquant dans tout le camp une panique impossible à contenir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les espaces clos voisins résonnèrent à l’unisson ». Le terme grec peut désigner des cours ou d’autres espaces entourés, et le verbe évoque un son commun ou répercuté.
    reason: lexical_alternative
  - marker: b
    text: Ou « une terreur impossible à maîtriser dans tout le camp ». Le mot grec peut signifier l’effroi, la terreur ou la panique.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρήσαντες
  choice: Quand les Juifs virent cela
  rationale: Le participe aoriste exprime la circonstance préalable. « Virent cela » rend naturellement la perception visuelle tout en laissant l’objet implicite, comme en grec.
- source_word: μέγα … ἀνέκραξαν
  choice: ils poussèrent un grand cri
  rationale: μέγα est employé adverbialement pour intensifier ἀνέκραξαν. Cette tournure française exprime avec naturel la force de leur cri.
- source_word: εἰς οὐρανόν
  choice: vers le ciel
  rationale: La préposition marque ici la direction du cri. Le texte nomme le ciel sans expliciter Dieu comme destinataire.
- source_word: τοὺς παρακειμένους αὐλῶνας
  choice: les cours voisines
  rationale: παρακείμενος signifie « situé à proximité » et αὐλών peut désigner une cour ou un espace clos. « Cours voisines » convient au cadre et reste clair.
- source_word: συνηχήσαντας
  choice: résonnèrent avec eux
  rationale: Le participe exprime le fait de résonner ensemble ou à l’unisson. La formulation conserve la personnification grammaticale des cours et l’effet de réverbération.
- source_word: ἀκατάσχετον πτοήν
  choice: une panique impossible à contenir
  rationale: πτοή peut désigner l’effroi, la terreur ou la panique, tandis que ἀκατάσχετος signifie qu’on ne peut arrêter ou maîtriser. La traduction restitue les deux éléments.
- source_word: παντὶ τῷ στρατοπέδῳ
  choice: dans tout le camp
  rationale: Le datif indique le domaine touché par la panique; « dans tout le camp » est idiomatique et rend sa diffusion générale.
theological_decisions:
- issue: Portée religieuse implicite de εἰς οὐρανόν
  choice: vers le ciel
  alternative: vers Dieu
  rationale: Le contexte peut suggérer un appel à Dieu, mais le grec dit explicitement « ciel ». La traduction n’ajoute donc pas un destinataire qui demeure implicite.
- issue: Rapport causal entre l’écho et la panique
  choice: l’ensemble du cri répercuté provoque la panique
  alternative: les cours elles-mêmes provoquent la panique
  rationale: La syntaxe fait grammaticalement des αὐλῶνες le sujet de ποιῆσαι par l’intermédiaire du participe συνηχήσαντας, mais le sens causal tient à leur résonance. La formulation française préserve cet enchaînement sans attribuer littéralement une action autonome aux lieux.
translation_notes:
  register: Français international moderne, digne et accessible. La seconde phrase allège une longue construction grecque sans perdre le rapport de résultat introduit par ὥστε. Les deux marqueurs de notes figurent dans le texte.
