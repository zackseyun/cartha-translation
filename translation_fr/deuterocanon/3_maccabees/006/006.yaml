base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
translation:
  language: fr
  text: 'C’est toi qui as sauvé les trois compagnons en Babylonie, eux qui avaient volontairement livré leur vie au feu pour ne pas rendre un culte à ce qui est vide[a] : après avoir rafraîchi la fournaise ardente, tu les as tous sauvés, sans qu’il leur manque un seul cheveu[b], et tu as envoyé une flamme sur tous leurs adversaires.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ce qui est vide » désigne ici de faux objets de culte ; on pourrait aussi traduire « ce qui est vain » ou, de manière plus interprétative, « les idoles ».
    reason: alternative_reading
  - marker: b
    text: Littéralement, « jusqu’au cheveu », c’est-à-dire sans même perdre un cheveu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑταίρους
  choice: compagnons
  rationale: Le terme désigne des associés ou compagnons. Ce choix conserve l’allusion aux trois jeunes Juifs sans ajouter leurs noms ni les identifier plus explicitement que le grec.
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  choice: avaient volontairement livré leur vie au feu
  rationale: « Leur vie » rend ici ψυχή de façon idiomatique, tandis que « volontairement » préserve αὐθαιρέτως et « livré… au feu » le mouvement de l’expression grecque.
- source_word: τοῖς κενοῖς
  choice: à ce qui est vide
  rationale: Le substantif adjectival signifie littéralement ce qui est vide ou vain. La traduction maintient la qualification polémique des faux objets de culte sans remplacer le terme par « idoles ».
- source_word: διάπυρον ... κάμινον
  choice: la fournaise ardente
  rationale: Cette formulation française naturelle exprime l’intensité de διάπυρον et conserve l’image de la fournaise.
- source_word: δροσίσας
  choice: après avoir rafraîchi
  rationale: Le verbe évoque l’action de rendre frais, voire d’apporter une fraîcheur semblable à la rosée. « Rafraîchi » conserve mieux cette nuance que le simple « refroidi ».
- source_word: ἐρρύσω μέχρι τριχὸς ἁπάντων
  choice: tu les as tous préservés jusqu’au moindre cheveu
  rationale: La formulation garde l’image concrète et emphatique du grec, qui exprime une délivrance complète, sans la réduire au seul sens idiomatique « indemnes ».
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  choice: tu as envoyé une flamme sur tous leurs adversaires
  rationale: « Flamme » traduit précisément φλόγα, et « adversaires » rend la position hostile exprimée par ὑπεναντίοις.
- source_word: κατὰ τὴν Βαβυλωνίαν
  choice: en Babylonie
  rationale: La locution situe simplement l’événement dans la région de Babylonie.
theological_decisions:
- issue: Allusion au récit des trois compagnons dans la fournaise
  choice: Conserver « les trois compagnons » sans ajouter leurs noms ni développer le récit.
  alternative: Les identifier explicitement par leurs noms ou employer « les trois jeunes hommes ».
  rationale: Le grec suppose que le lecteur reconnaît le récit, mais ne donne ni noms ni explication. La traduction préserve cette allusion implicite.
- issue: Sens cultuel de τοῖς κενοῖς
  choice: Rendre littéralement par « ce qui est vide ».
  alternative: Traduire interprétativement par « les idoles » ou « de vaines idoles ».
  rationale: Les objets visés sont bien de faux objets de culte, mais le grec les caractérise comme « vides ». Garder cette métaphore préserve sa force théologique sans surinterprétation.
- issue: Portée de la délivrance exprimée par μέχρι τριχὸς
  choice: Conserver l’image « jusqu’au moindre cheveu ».
  alternative: Employer seulement « indemnes » ou « sans aucun mal ».
  rationale: L’image grecque souligne la protection totale de Dieu. Une traduction explicite mais imagée transmet à la fois le sens et la forme rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forme d’une adresse priante à Dieu, l’enchaînement des actes divins et les images fortes du grec, tout en employant une syntaxe française naturelle.
