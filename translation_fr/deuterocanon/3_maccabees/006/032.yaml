base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
translation:
  language: fr
  text: Après avoir achevé leur chant de lamentation, tout empreint de douleur, ils entonnèrent un chant ancestral[a], louant Dieu, le Sauveur d’Israël et l’auteur de prodiges. Puis, rejetant toute plainte et tout cri de douleur, ils organisèrent des danses[b], en signe d’une joie paisible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le chant de leurs pères ». Le terme grec désigne ce qui appartient aux ancêtres ou à leur tradition.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des chœurs ». Le mot grec peut désigner des groupes qui chantent ou qui dansent ; le contexte de réjouissance favorise ici l’idée de danses collectives.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλήξαντες
  choice: Après avoir mis fin
  rationale: Le participe aoriste marque une action achevée avant ἀνέλαβον et établit clairement la succession des événements.
- source_word: θρήνων πανόδυρτον μέλος
  choice: la mélodie toute de deuil de leurs lamentations
  rationale: « Mélodie » conserve l’image musicale de μέλος, tandis que « toute de deuil » rend la forte intensité de πανόδυρτον et « lamentations » celle de θρήνων.
- source_word: ἀνέλαβον
  choice: ils entonnèrent
  rationale: Dans le contexte d’un chant, « entonner » exprime naturellement l’idée de commencer ou de reprendre un chant.
- source_word: ᾠδὴν πάτριον
  choice: un chant ancestral
  rationale: πάτριον désigne ce qui appartient aux pères ou à la tradition des ancêtres; « ancestral » est précis et naturel en français moderne.
- source_word: σωτῆρα
  choice: le sauveur
  rationale: Rend directement le titre σωτήρ sans ajout doctrinal.
- source_word: τερατοποιὸν
  choice: l’auteur de prodiges
  rationale: Le composé désigne celui qui accomplit des prodiges; cette formulation est claire, digne et idiomatique.
- source_word: αἰνοῦντες
  choice: louant
  rationale: Équivalent courant et exact du verbe de louange dans un contexte doxologique.
- source_word: οἰμωγὴν ... καὶ κωκυτὸν
  choice: toute plainte et tout cri de douleur
  rationale: La paire grecque désigne deux manifestations audibles du chagrin; la traduction conserve leur intensité sans devenir artificielle.
- source_word: ἀπωσάμενοι
  choice: rejetant
  rationale: Le participe moyen exprime l’action résolue d’écarter ou de repousser les manifestations du deuil.
- source_word: χοροὺς συνίσταντο
  choice: ils formèrent des rondes
  rationale: χορός peut désigner un chœur ou un groupe dansant; le contexte festif favorise la danse, et « rondes » rend concrètement des danses collectives sans supprimer l’ambiguïté, signalée en note.
- source_word: εὐφροσύνης εἰρηνικῆς σημεῖον
  choice: en signe d’une joie paisible
  rationale: 'Cette formulation restitue les trois éléments: σημεῖον, εὐφροσύνη et le qualificatif εἰρηνικός.'
theological_decisions:
- issue: Référent des titres « sauveur d’Israël » et « auteur de prodiges »
  choice: Les deux titres qualifient directement Dieu.
  alternative: Faire de « sauveur d’Israël » une désignation indépendante ou développer son sens doctrinal.
  rationale: La construction grecque place σωτῆρα et τερατοποιὸν en apposition à θεόν; la traduction conserve cette identification sans explicitation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve le contraste marqué entre les lamentations et la célébration, ainsi que le mouvement musical du texte grec. Les ambiguïtés réelles de πάτριον et χορούς sont signalées sans alourdir le corps du verset.
