revisions:
- from: Après avoir mis fin à la mélodie toute de deuil de leurs lamentations, ils entonnèrent un chant ancestral[a], louant Dieu, le sauveur d’Israël et l’auteur de prodiges. Puis, rejetant toute plainte et tout cri de douleur, ils formèrent des rondes[b], en signe d’une joie paisible.
  to: Après avoir achevé leur chant de lamentation, tout empreint de douleur, ils entonnèrent un chant ancestral[a], louant Dieu, le Sauveur d’Israël et l’auteur de prodiges. Puis, rejetant toute plainte et tout cri de douleur, ils organisèrent des danses[b], en signe d’une joie paisible.
  rationale: 'La révision corrige une expression française non naturelle tout en préservant les composantes du grec : un chant (μέλος) de lamentation (θρήνων), intensément douloureux (πανόδυρτον). Elle évite également de faire de χοροί des danses nécessairement circulaires. Les notes maintiennent les ambiguïtés lexicales pertinentes sans présenter une paraphrase comme une traduction littérale.'
