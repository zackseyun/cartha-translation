    issue: Formulation « la mélodie toute de deuil de leurs lamentations »
    rationale: Cette construction n’est pas idiomatique en français et obscurcit le rapport entre μέλος, θρήνων et πανόδυρτον. Une formulation telle que « leur chant de lamentation, tout empreint de douleur » est claire et fidèle.
  - severity: low
    issue: « Des rondes » pour χορούς
