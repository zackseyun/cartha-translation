  text: and Jonah[a], who was wasting away in the belly of the sea-fed monster, you brought forth unharmed in abundance to all his own people, Father[b],
translation:
  language: fr
  text: et Jonas, qui dépérissait dans le ventre du monstre marin[a] nourri par les profondeurs, tu l’as généreusement montré intact[b] à tous les siens, Père,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grande créature marine » ou « grand poisson ». Le grec désigne une grande créature de la mer ; « baleine » serait plus précis que le texte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sans marque », c’est-à-dire sans blessure ou sans dommage.
    reason: lexical_alternative
lexical_decisions:
- source_word: βυθοτρεφοῦς
  choice: nourri dans les profondeurs
  rationale: Le composé évoque une créature nourrie par les profondeurs ou qui y vit. Cette formulation conserve l’image grecque sans la réduire à une simple indication de lieu.
- source_word: κήτους
  choice: monstre marin
  rationale: κῆτος désigne une grande créature marine, éventuellement monstrueuse. « Monstre marin » garde l’ampleur du terme sans imposer l’identification plus précise de « baleine ».
- source_word: ἐν γαστρὶ κήτους
  choice: dans le ventre du monstre marin
  rationale: γαστήρ signifie ici naturellement « ventre »; la tournure demeure claire et proche de l’image grecque.
- source_word: τηκόμενον
  choice: qui dépérissait
  rationale: Le participe exprime l’idée de se consumer, de fondre ou de dépérir. « Dépérissait » rend le péril physique dans un français naturel.
- source_word: ἀφθόνῳ
  choice: dans ta générosité
  rationale: La forme évoque ce qui est abondant, sans réserve ou généreux. Sa relation syntaxique est comprimée dans le grec; la traduction la rattache prudemment à l’action divine sans transformer l’expression en quantité matérielle.
- source_word: ἀσήμαντον
  choice: intact
  rationale: Le mot signifie littéralement « sans marque » et, dans ce contexte, « sans blessure ». « Intact » conserve à la fois l’idée d’absence de marque et celle d’une délivrance sans dommage.
- source_word: πᾶσιν οἰκείοις
  choice: aux yeux de tous les siens
  rationale: οἰκεῖοι peut désigner les proches, les gens de la maison ou ceux qui appartiennent au cercle de quelqu’un. Avec ἀναδείξας, la formule française exprime naturellement la manifestation publique devant eux.
- source_word: ἀναδείξας
  choice: tu l’as fait reparaître
  rationale: Le verbe signifie montrer, manifester ou faire apparaître. « Faire reparaître » convient à la sortie de Jonas et préserve la dimension de manifestation.
- source_word: πάτερ
  choice: Père
  rationale: Le vocatif est rendu par l’apostrophe directe et sobre « Père ».
theological_decisions:
- issue: Identification de la créature de Jonas
  choice: Conserver le terme large « monstre marin ».
  alternative: grand poisson; baleine
  rationale: Le grec κῆτος n’impose ni l’espèce précise d’une baleine ni la formulation plus familière de « grand poisson ». La traduction évite donc une harmonisation avec une tradition particulière.
- issue: Relation syntaxique de ἀφθόνῳ
  choice: Rattacher prudemment l’idée à la générosité de l’action divine.
  alternative: avec abondance; ouvertement; sans réserve
  rationale: La construction grecque est elliptique ou comprimée. « Dans ta générosité » conserve la valeur d’abondance ou de libéralité sans prétendre lever entièrement l’ambiguïté.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La phrase conserve la forme d’une prière et son mouvement participial, tout en évitant une tournure artificielle. « Tous les siens » laisse ouverte l’étendue du groupe: famille, maisonnée ou proches.'
