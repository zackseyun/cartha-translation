  naturalness: Le français est moderne et le ton de prière est conservé. « Tu l’as fait reparaître » est possible, mais « tu l’as montré » rend plus directement ἀναδείξας et s’enchaîne plus naturellement avec « à tous les siens ».
  terminology: « Monstre marin » convient à κῆτος et évite de préciser indûment « baleine ». « Intact » restitue bien ἀσήμαντον dans ce contexte. « Tous les siens » préserve utilement l’ouverture de οἰκεῖοι entre proches, maisonnée et gens de son entourage.
