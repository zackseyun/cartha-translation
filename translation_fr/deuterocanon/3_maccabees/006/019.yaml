  yaml_path: translation/deuterocanon/3_maccabees/006/019.yaml
  text: And they rose up[a], and filled the force of their adversaries with confusion and cowardice[b], and bound them with immovable fetters.
translation:
  language: fr
  text: Ils se dressèrent contre eux[a], remplirent la force de leurs adversaires de trouble et de lâcheté[b], et les lièrent avec des entraves inamovibles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils leur résistèrent » ; le verbe grec peut exprimer le fait de prendre position contre des adversaires ou de leur résister.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « remplirent la force de leurs adversaires de trouble et de lâcheté ». Le dernier terme peut aussi évoquer la timidité ou le manque de courage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: se dressèrent contre eux
  rationale: Le verbe ἀνθίστημι exprime le fait de prendre position contre quelqu’un ou de lui résister. « Se dressèrent contre eux » conserve à la fois l’image vive et le sens d’opposition.
- source_word: δύναμιν τῶν ὑπεναντίων
  choice: les forces de leurs adversaires
  rationale: Dans ce contexte, δύναμις désigne collectivement la force armée adverse plutôt qu’une puissance abstraite. Le pluriel français « les forces » est naturel dans un cadre militaire.
- source_word: ταραχῆς καὶ δειλίας
  choice: de confusion et de peur
  rationale: ταραχή évoque le trouble ou le désarroi, tandis que δειλία peut désigner la peur, la timidité ou la lâcheté. « Peur » évite d’introduire inutilement un jugement moral sur les adversaires.
- source_word: ἀκινήτοις ... πέδαις
  choice: avec des entraves impossibles à déplacer
  rationale: πέδαι désigne des entraves, notamment pour les pieds, et ἀκίνητος souligne leur caractère fixe ou inamovible. La formulation française garde cette image sans transformer explicitement l’expression en « liens impossibles à rompre ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe coordonnée du grec est conservée, tout en employant « les forces » au pluriel, expression militaire naturelle en français. Les formulations évitent de préciser l’identité des sujets ou la nature exacte de l’intervention au-delà de ce que dit le verset.
