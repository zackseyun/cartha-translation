base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
translation:
  language: fr
  text: Qui donc a ainsi, au mépris de toute loi, cerné de sévices ceux qui, dès le commencement, ont surpassé toutes les nations à tous égards par leur bienveillance envers nous[a], et qui, à maintes reprises, se sont montrés dans les pires dangers auxquels les humains sont exposés[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se distinguent de toutes les nations à tous égards » ; le verbe grec peut signifier « différer de » ou, dans ce contexte, « surpasser » ou « exceller ».
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque traduite par « les pires dangers auxquels les humains sont exposés » est difficile. Elle peut désigner les dangers les plus graves rencontrés dans les affaires humaines, ou les dangers auxquels les êtres humains sont exposés.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Qui donc a
  rationale: Le pronom interrogatif introduit une question rhétorique. « donc » en fait naturellement ressortir la force en français sans identifier la personne visée.
- source_word: τοὺς ἐξ ἀρχῆς
  choice: ceux qui, depuis le commencement
  rationale: L’article substantivé désigne un groupe dont la conduite remonte à l’origine de la relation évoquée. La formulation conserve la portée temporelle sans préciser davantage cette origine.
- source_word: εὐνοίᾳ πρὸς ἡμᾶς
  choice: par leur bienveillance envers nous
  rationale: εὔνοια exprime la bienveillance ou les bonnes dispositions. La préposition « par » rend ici la nuance de domaine ou de qualité selon laquelle ce groupe se distingue.
- source_word: κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  choice: surpassent toutes les nations à tous égards
  rationale: Dans cette comparaison, διαφέρω peut exprimer la supériorité, même si son sens plus neutre de « différer » demeure possible. « à tous égards » rend κατὰ πάντα.
- source_word: πλεονάκις
  choice: à maintes reprises
  rationale: L’adverbe indique une répétition fréquente; cette expression convient au registre rhétorique et dignifié du passage.
- source_word: τοὺς ... ἐπιδειγμένους
  choice: qui ... se sont montrés
  rationale: Le participe moyen de ἐπιδείκνυμι peut signifier « se montrer » ou « faire ses preuves ». La traduction conserve la valeur réfléchie sans préciser une qualité qui reste implicite.
- source_word: χειρίστους ... κινδύνους
  choice: les pires dangers
  rationale: χειρίστους est le superlatif de κακός et qualifie des dangers extrêmes. « les pires dangers » en donne une traduction directe et courante.
- source_word: ἀνθρώπων
  choice: que connaissent les humains
  rationale: Le génitif dépendant de « dangers » est difficile à définir exactement. Cette formulation l’interprète avec prudence comme les dangers propres à la condition ou aux affaires humaines.
- source_word: οὕτως ἀθέσμως
  choice: au mépris de toute loi
  rationale: ἀθέσμως qualifie ce qui viole la loi, les usages ou le droit. Cette locution française transmet clairement sa force morale et juridique; l’intensité de οὕτως ressort de la tournure rhétorique globale.
- source_word: περιέβαλεν αἰκίαις
  choice: a ... cerné de sévices
  rationale: περιβάλλω évoque littéralement le fait d’entourer ou d’envelopper, tandis que αἰκίαι désigne des mauvais traitements, outrages ou sévices. La formulation conserve l’image frappante du grec.
