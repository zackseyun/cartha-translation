revisions:
- from: Qui donc a, au mépris de toute loi, cerné de sévices ceux qui, depuis le commencement, surpassent toutes les nations à tous égards par leur bienveillance envers nous[a] et qui, à maintes reprises, se sont montrés face aux pires dangers que connaissent les humains[b] ?
  to: Qui donc a ainsi, au mépris de toute loi, cerné de sévices ceux qui, dès le commencement, ont surpassé toutes les nations à tous égards par leur bienveillance envers nous[a], et qui, à maintes reprises, se sont montrés dans les pires dangers auxquels les humains sont exposés[b] ?
