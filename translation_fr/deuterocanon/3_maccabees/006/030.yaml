base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
translation:
  language: fr
  text: Puis le roi fit venir dans la ville le responsable des revenus et lui ordonna de fournir aux Juifs, pendant sept jours, du vin et toutes les autres provisions nécessaires à un festin. Il décida qu’au lieu même où ils avaient pensé subir la destruction, ils célébreraient leur délivrance[a] dans une joie sans réserve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur salut ». Le terme grec peut désigner le salut ou la délivrance ; ici, il évoque leur sauvetage face à la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐπὶ τῶν προσόδων
  choice: le responsable des revenus
  rationale: Cette expression désigne un fonctionnaire chargé des recettes ou revenus. Cette formulation moderne conserve le sens administratif sans lui attribuer un titre technique plus précis que le grec.
- source_word: προσκαλεσάμενος
  choice: fit venir
  rationale: Le participe exprime une action antérieure à l’ordre royal. « Fit venir » rend naturellement l’idée de convocation dans ce contexte.
- source_word: οἴνους
  choice: du vin
  rationale: Bien que le grec emploie le pluriel, le français courant utilise ici naturellement le nom massif au singulier.
- source_word: τὰ λοιπὰ πρὸς εὐωχίαν ἐπιτήδεια
  choice: toutes les autres provisions nécessaires à un festin
  rationale: ἐπιτήδεια désigne les fournitures ou provisions, tandis que πρὸς εὐωχίαν en précise la destination festive. « Toutes » explicite la totalité impliquée par τὰ λοιπά dans une tournure française naturelle.
- source_word: χορηγεῖν
  choice: fournir
  rationale: L’infinitif dépend de l’ordre donné par le roi et évoque une fourniture officielle. La construction « ordonna de fournir » est claire et directe en français.
- source_word: κρίνας
  choice: Il avait décidé
  rationale: Le participe exprime la résolution réfléchie du roi. Une nouvelle phrase allège la longue syntaxe grecque tout en conservant le lien logique et temporel.
- source_word: ἔδοξαν
  choice: ils avaient pensé
  rationale: Dans le contexte, le verbe décrit ce que les Juifs croyaient devoir subir. « Avaient pensé » préserve cette perception sans transformer leur attente en certitude.
- source_word: τὸν ὄλεθρον ἀναλαμβάνειν
  choice: trouver la mort
  rationale: La formulation grecque signifie littéralement recevoir ou subir la destruction. « Trouver la mort » transmet naturellement en français la menace fatale dans ce contexte.
- source_word: σωτήρια ἀγαγεῖν
  choice: célébreraient leur délivrance
  rationale: L’expression désigne la célébration d’un salut ou d’une délivrance. Le contexte immédiat est celui d’un sauvetage face à une destruction imminente.
- source_word: ἐν εὐφροσύνῃ πάσῃ
  choice: dans une joie complète
  rationale: La formule souligne la plénitude de la réjouissance. Cette traduction garde l’intensité de πάσῃ dans un registre digne et accessible.
theological_decisions:
- issue: Traduction de σωτήρια dans ce récit deutérocanonique
  choice: délivrance
  alternative: salut
  rationale: Le contexte immédiat concerne le sauvetage des Juifs menacés de mort et sa célébration. « Délivrance » rend clairement cet événement sans effacer la portée salvatrice du terme grec; « salut » demeure une traduction possible.
translation_notes:
  register: Français international moderne, digne et narratif. La longue période grecque est divisée en deux phrases pour la lisibilité, sans modifier les rapports logiques. Le vocabulaire administratif reste général afin de ne pas surinterpréter la fonction officielle.
