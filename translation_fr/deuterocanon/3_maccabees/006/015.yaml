base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
translation:
  language: fr
  text: 'Qu’il soit montré à toutes les nations que tu es avec nous, Seigneur, et que tu n’as pas détourné ton visage de nous. Mais, comme tu l’as dit : « Même lorsqu’ils étaient dans le pays de leurs ennemis, je ne les ai pas délaissés »[a], accomplis-le ainsi, Seigneur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette parole fait écho au langage de l’alliance selon lequel Dieu n’abandonne pas son peuple, même dans le pays de ses ennemis. Le verbe grec peut aussi se traduire par « négligés » ou « ignorés ».
    reason: cross_reference
  - marker: b
    text: 'Ou : « mène cela à son accomplissement, Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  choice: Qu’il soit montré
  rationale: L’impératif aoriste passif exprime une demande et conserve la forme passive du grec.
- source_word: πᾶσιν ἔθνεσιν
  choice: à toutes les nations
  rationale: Rendu direct et naturel de ἔθνεσιν, sans imposer ici le sens plus marqué de « non-Juifs ».
- source_word: μεθʼ ἡμῶν εἶ
  choice: tu es avec nous
  rationale: Cette formulation idiomatique préserve le langage de présence divine et sa portée d’alliance.
- source_word: οὐκ ἀπέστρεψας τὸ πρόσωπόν σου ἀφʼ ἡμῶν
  choice: tu n’as pas détourné de nous ton visage
  rationale: Le maintien de « visage » conserve l’image biblique explicite et sa résonance de faveur ou de défaveur.
- source_word: ὑπεριδον
  choice: je ne les ai pas délaissés
  rationale: « Délaisser » exprime ici le fait de ne pas abandonner ou négliger le peuple en territoire ennemi, sans la force affective excessive de « mépriser ».
- source_word: καθὼς εἶπας
  choice: comme tu l’as dit
  rationale: Introduit naturellement en français la parole divine citée tout en gardant la valeur comparative de καθώς.
- source_word: οὕτως ἐπίτελεσον
  choice: accomplis-le ainsi
  rationale: « Accomplis » rend l’idée de mener à son terme, tandis que « ainsi » conserve explicitement οὕτως et « le » renvoie à la parole citée.
theological_decisions:
- issue: Traduction de κύριε
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette prière, κύριε est un titre divin; « Seigneur » est le rendu français usuel et digne.
- issue: Présentation de la parole relative au pays des ennemis
  choice: Discours direct entre guillemets
  alternative: Discours indirect paraphrasé
  rationale: Le grec εἶπας introduit naturellement une citation directe. Cette présentation préserve l’appel à une parole antérieure de Dieu sans en préciser davantage la provenance ou l’interprétation.
- issue: Portée de οὐδὲ dans la citation
  choice: Même lorsqu’ils étaient dans le pays de leurs ennemis
  alternative: Pas même lorsqu’ils étaient dans le pays de leurs ennemis
  rationale: Avec le verbe déjà négatif (« je ne les ai pas délaissés »), « même lorsqu’ils étaient » donne un français clair et restitue la force inclusive de οὐδὲ sans créer une double négation ambiguë.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à la prière biblique. La métaphore du visage est conservée, ainsi que la forme directe de la citation et l’appel final à son accomplissement.
