base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
translation:
  language: fr
  text: Regarde la descendance d’Abraham, les enfants de Jacob, qui a été sanctifié[a], ton peuple, ta part sanctifiée, qui périt injustement comme des étrangers dans une terre étrangère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les enfants sanctifiés de Jacob ». La formulation grecque est condensée, et « sanctifié » peut se rapporter aux enfants plutôt qu’à Jacob.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπιδε
  choice: Regarde
  rationale: Dans cette prière, l’impératif appelle Dieu à porter son regard et son attention sur son peuple. « Regarde » est direct, digne et naturel en français moderne.
- source_word: σπέρμα
  choice: descendance
  rationale: Le terme désigne collectivement les descendants d’Abraham ; « descendance » conserve ce sens collectif sans le calque peu naturel « semence ».
- source_word: ἡγιασμένου
  choice: qui a été sanctifié
  rationale: Cette formulation rend la valeur accomplie et passive du participe grec tout en le rattachant à Jacob, conformément à la lecture principale retenue. L’autre rattachement possible est signalé en note.
- source_word: τέκνα Ἰακώβ
  choice: les enfants de Jacob
  rationale: « Enfants » ne restreint pas indûment le groupe aux seuls fils et correspond au sens large de τέκνα.
- source_word: μερίδος ἡγιασμένης σου
  choice: qui est ta part sanctifiée
  rationale: La construction grecque est condensée. Cette formulation comprend μερίδος comme une apposition décrivant le peuple comme la part appartenant à Dieu, tout en conservant le vocabulaire répété de la sanctification.
- source_word: λαὸν
  choice: peuple
  rationale: « Peuple » est le terme français courant et approprié dans ce contexte d’appartenance collective à Dieu.
- source_word: ἐν ξένῃ γῇ
  choice: sur une terre étrangère
  rationale: Expression française naturelle qui préserve le cadre d’exil et d’éloignement.
- source_word: ξένως
  choice: comme des étrangers
  rationale: Le rendu exprime leur condition d’étrangers plutôt que l’adverbe français ambigu « étrangement ».
- source_word: ἀδίκως
  choice: injustement
  rationale: Le mot marque explicitement l’injustice de la destruction qu’ils subissent.
- source_word: ἀπολλύμενον
  choice: en train de périr
  rationale: La périphrase rend l’aspect continu du participe présent et l’urgence pathétique de la prière.
theological_decisions:
- issue: Rattachement de ἡγιασμένου dans la formule condensée ἐφ’ ἡγιασμένου τέκνα Ἰακώβ
  choice: 'Rattacher le participe à Jacob : « les enfants de Jacob qui a été sanctifié »'
  alternative: 'Rattacher le participe aux enfants : « les enfants sanctifiés de Jacob »'
  rationale: Le rattachement à Jacob respecte étroitement l’ordre des mots et la forme grammaticale du participe dans ce texte difficile. Comme le rattachement aux enfants demeure plausible, l’ambiguïté est conservée dans une note plutôt que résolue silencieusement.
- issue: Rapport entre μερίδος ἡγιασμένης σου et λαὸν
  choice: 'Comprendre l’expression comme une apposition : « ton peuple qui est ta part sanctifiée »'
  alternative: « ton peuple sanctifié qui t’est attribué »
  rationale: Le génitif μερίδος suggère la part ou portion appartenant à Dieu. Le rendu principal garde cette image d’appartenance sans imposer la notion plus précise d’un tirage au sort.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve le ton pressant d’une supplication, la répétition du vocabulaire de sanctification et l’ambiguïté syntaxique réelle du grec, documentée en note.
