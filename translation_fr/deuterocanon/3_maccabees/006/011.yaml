base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
translation:
  language: fr
  text: 'Que ceux dont la pensée est vaine[b] ne bénissent pas les choses vaines[a] à l’occasion de la destruction de tes bien-aimés, en disant : « Même leur Dieu ne les a pas délivrés[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vanités », voire « les idoles ». Le grec dit littéralement « les choses vaines » et peut avoir ici une portée polémique.
    reason: lexical_alternative
  - marker: b
    text: Ou « les esprits vains ». Le grec forme un jeu de mots avec « les choses vaines ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ne les a pas sauvés » ou « ne les a pas secourus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  choice: Que ... ne bénissent pas
  rationale: Le subjonctif français rend naturellement l’impératif grec à la troisième personne dans cette prière, sans transformer la phrase en ordre directement adressé aux adversaires.
- source_word: τοῖς ματαίοις
  choice: les choses vaines
  rationale: Cette formulation conserve la portée générale de l’adjectif substantivé et son écho avec ματαιόφρονες, sans préciser abusivement qu’il s’agit d’idoles.
- source_word: οἱ ματαιόφρονες
  choice: les esprits vains
  rationale: Le composé désigne des personnes dont la pensée est vaine. « Les esprits vains » garde un registre digne et permet de reproduire le jeu lexical avec « les choses vaines ».
- source_word: ἐπὶ τῇ ... ἀπωλείᾳ
  choice: devant la destruction
  rationale: ἐπί avec le datif indique ici l’occasion qui suscite leur bénédiction ou leur triomphe. « Devant » reste naturel tout en évitant de trancher trop fortement entre « à cause de » et « à la vue de ».
- source_word: τῶν ἠγαπημένων σου
  choice: ceux que tu aimes
  rationale: Cette expression française courante transmet clairement que ces personnes sont aimées de Dieu, tout en conservant l’adresse directe « tu ».
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  choice: Même leur Dieu ne les a pas délivrés
  rationale: « Même » placé en tête restitue la force de οὐδέ. « Délivrer » rend le sens de sauvetage d’ἐρύομαι dans un français biblique actuel et intelligible.
theological_decisions:
- issue: Faut-il comprendre ματαίοις comme une désignation précise des idoles ou, plus généralement, de choses vaines ?
  choice: les choses vaines
  alternative: les idoles
  rationale: Dans un contexte polémique juif, le mot peut viser les idoles, mais le grec du verset ne les nomme pas explicitement. La formulation générale préserve cette possibilité sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme « esprits vains / choses vaines » conserve autant que possible le jeu de mots grec, malgré une légère étrangeté rhétorique voulue.
