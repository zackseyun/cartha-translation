    rationale: Cette formulation suggère « en présence de » plutôt que l’occasion ou le motif sur lequel porte l’exultation. « à l’occasion de la destruction » est plus fidèle et naturel.
  - severity: low
    issue: « les esprits vains »
    rationale: Le grec vise des personnes caractérisées par une pensée vaine; l’expression française est rhétoriquement possible mais moins idiomatique que « ceux dont la pensée est vaine ».
