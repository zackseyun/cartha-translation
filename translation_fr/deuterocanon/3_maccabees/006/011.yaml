review_pass:
  verdict: revise
  source_fidelity: La prière prohibitive (« Que ... ne ... pas ») rend bien μή avec l’impératif de troisième personne. « Les choses vaines » conserve à juste titre l’indétermination de τοῖς ματαίοις et son écho avec ματαιόφρονες. En revanche, « devant la destruction » exprime surtout une situation spatiale ou temporelle et ne rend pas suffisamment ἐπὶ avec le datif, qui marque ici l’occasion ou le motif de leur exaltation. « À l’occasion de la destruction » restitue ce rapport sans surinterpréter le texte. « Tes bien-aimés » rend de façon plus resserrée le participe passif parfait ἠγαπημένων.
  naturalness: « Les esprits vains » est compréhensible mais peu idiomatique pour désigner des personnes en français moderne. « Ceux dont la pensée est vaine » est naturel, soutenu et fidèle au composé grec. La construction révisée demeure fluide tout en préservant le parallélisme rhétorique avec « choses vaines ».
  terminology: « Bénissent » préserve εὐλογησάτωσαν sans imposer le sens plus spécifique de culte idolâtre. « Délivrés » est un bon équivalent moderne et biblique de ἐρύσατο. La note c doit cependant proposer des alternatives sous une forme grammaticalement complète dans la phrase française.
