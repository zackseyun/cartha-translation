  text: And they all feasted[a], being supplied by the king, until the fourteenth day, on which they also made their petition concerning their release.
translation:
  language: fr
  text: 'Ils festoyaient, le roi pourvoyant à tous leurs besoins, jusqu’au quatorzième jour. Ce jour-là, ils présentèrent aussi une requête au sujet de leur libération.[a]


    [a] Ou « ils firent une démarche en vue de leur libération ». Le terme grec peut désigner une requête ou un appel officiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils firent une démarche en vue de leur libération ». Le terme grec peut désigner une requête ou un appel officiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐωχοῦντο
  choice: festoyèrent
  rationale: Le verbe évoque la participation à un banquet ou à des repas de fête. « Festoyèrent » conserve ce sens concret et joyeux.
- source_word: πάνθʼ
  choice: tous
  rationale: La forme élidée a ici une valeur collective et renvoie à l’ensemble des personnes concernées.
- source_word: ὑπὸ τοῦ βασιλέως χορηγούμενοι
  choice: aux frais du roi
  rationale: Le participe indique que le roi pourvoyait à ce qui était nécessaire. Cette formulation française naturelle exprime la prise en charge royale sans en préciser indûment les modalités.
- source_word: μέχρι τῆς τεσσαρεσκαιδεκάτης
  choice: jusqu’au quatorzième jour
  rationale: L’ordinal féminin sous-entend vraisemblablement « jour » dans le contexte; le nom est explicité pour la clarté.
- source_word: ἐν ᾗ
  choice: Ce jour-là
  rationale: Le relatif reprend le quatorzième jour. Une nouvelle phrase avec « Ce jour-là » rend le lien temporel clair et naturel en français.
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  choice: ils présentèrent aussi une requête
  rationale: L’expression peut désigner une démarche, un recours ou une requête adressée à une autorité. « Présentèrent une requête » rend bien son caractère officiel sans supposer nécessairement une audience.
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  choice: au sujet de leur libération
  rationale: Cette formulation suit la valeur de περί et rend ἀπόλυσις par « libération », terme adapté à la situation décrite.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Festoyèrent » conserve la couleur du banquet, tandis que « aux frais du roi » traduit naturellement la prise en charge exprimée par le participe grec. La note maintient l’étendue sémantique de ἐντυχία.
