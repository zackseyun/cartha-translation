revisions:
- from: Dans ces circonstances aussi, le Maître de toutes choses manifesta glorieusement sa miséricorde et les délivra tous ensemble sans qu’ils trébuchent.[a][b]
  to: Dans ces circonstances aussi, ayant glorieusement manifesté sa miséricorde, le Souverain de toutes choses les délivra tous ensemble, sans qu’ils trébuchent.[a][b]
  rationale: La révision remplace « Maître » par « Souverain », qui correspond plus étroitement au titre grec δυνάστης, et restitue explicitement la participiale ἐπιφάνας. Elle conserve l’ambiguïté contextuelle de « sans qu’ils trébuchent » et la double nuance possible de « tous ensemble », signalées par les notes aux mêmes ancres.
