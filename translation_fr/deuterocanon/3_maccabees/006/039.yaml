  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
translation:
  language: fr
  text: Dans ces circonstances aussi, ayant glorieusement manifesté sa miséricorde, le Souverain de toutes choses les délivra tous ensemble, sans qu’ils trébuchent.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans trébucher » ; dans ce contexte, l’expression peut signifier qu’ils furent délivrés sans subir de dommage.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’un même cœur ». Le grec peut exprimer aussi bien l’action collective que l’unité d’intention.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς καὶ
  choice: Dans ces circonstances aussi
  rationale: Le relatif renvoie aux événements précédents. « Dans ces circonstances » rend ce lien naturellement sans préciser davantage l’antécédent, et « aussi » traduit la continuité marquée par καί.
- source_word: μεγαλοδόξως
  choice: glorieusement
  rationale: L’adverbe qualifie la manifestation de la miséricorde et conserve le registre élevé du grec.
- source_word: ἐπιφάνας τὸ ἔλεος αὐτοῦ
  choice: manifesta sa miséricorde
  rationale: Avec « sa miséricorde » comme objet, ἐπιφάνας exprime ici le fait de rendre manifeste. Le passé simple convient au récit français et évite une tournure participiale pesante.
- source_word: ὁ τῶν πάντων δυνάστης
  choice: le Maître de toutes choses
  rationale: δυνάστης désigne celui qui détient autorité et puissance. « Maître » préserve ce titre de souveraineté sans le confondre avec παντοκράτωρ, traditionnellement rendu par « Tout-Puissant ».
- source_word: ἀπταίστους
  choice: sans qu’ils trébuchent
  rationale: La formulation conserve l’image littérale de l’absence de faux pas ou de chute, tout en laissant entendre, dans le contexte, une délivrance sans dommage.
- source_word: ἐρρύσατο
  choice: délivra
  rationale: Le verbe désigne l’action d’arracher quelqu’un à un danger. « Délivra » est naturel dans le registre biblique moderne.
- source_word: ὁμοθυμαδόν
  choice: tous ensemble
  rationale: Dans cette construction, l’adverbe peut décrire une délivrance collective, tout en pouvant aussi évoquer l’unité de cœur; l’autre nuance est signalée en note.
theological_decisions:
- issue: Rendu du titre divin ὁ τῶν πάντων δυνάστης
  choice: le Maître de toutes choses
  alternative: le souverain de tous; le puissant maître de toutes choses
  rationale: Le grec emploie δυνάστης, titre d’autorité et de puissance, et non παντοκράτωρ. La traduction évite donc d’introduire le titre théologiquement plus déterminé « le Tout-Puissant ».
- issue: Portée de ἀπταίστους dans la délivrance
  choice: sans qu’ils trébuchent
  alternative: sains et saufs; sans dommage
  rationale: Le sens contextuel peut être celui d’une délivrance sans dommage, mais le maintien de l’image préserve l’ambiguïté expressive du grec au lieu de la résoudre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple soutient le registre littéraire sans archaïsme marqué. Les notes conservent les deux principales ambiguïtés lexicales du grec.
