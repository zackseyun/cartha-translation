  text: La foule entière des petits enfants et de leurs parents te supplie en larmes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκετεύει
  choice: te supplient
  rationale: Le verbe exprime une demande pressante et humble. « Supplient » conserve l’intensité et la dignité de l’appel; le singulier grec s’accorde avec le sujet collectif πλῆθος, tandis que le français emploie naturellement le pluriel avec les deux groupes coordonnés.
- source_word: τὸ πᾶν πλῆθος
  choice: la foule entière
  rationale: Cette formulation rend à la fois l’idée collective de πλῆθος et l’insistance de πᾶν sur la totalité, dans un français actuel et soutenu.
- source_word: τῶν νηπίων
  choice: des petits enfants
  rationale: νήπια désigne de très jeunes enfants sans imposer ici la restriction plus étroite que pourrait suggérer « nourrissons ».
- source_word: οἱ τούτων γονεῖς
  choice: leurs parents
  rationale: Le possessif reprend clairement les petits enfants et produit une expression française naturelle.
- source_word: μετὰ δακρύων
  choice: en larmes
  rationale: L’expression restitue de façon idiomatique l’accompagnement émotionnel exprimé par la locution grecque, tout en gardant l’image explicite des larmes.
