base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
translation:
  language: fr
  text: Père, toi qui as fait périr Pharaon, l’ancien souverain de cette Égypte, alors qu’il s’était élevé avec une arrogance impie et une langue présomptueuse, multipliant les actes d’insolence[a], lui et son armée orgueilleuse, engloutis par la mer[b], et qui as fait resplendir sur le peuple d’Israël la lumière de ta miséricorde[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formule grecque est difficile ; on pourrait aussi traduire : « accumulant les actes téméraires ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « engloutis par la mer » ; l’expression vise Pharaon avec son armée.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « la lumière de la miséricorde » ; le grec conserve une image explicite de rayonnement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Père
  rationale: Vocatif direct de la prière, rendu naturellement et solennellement en français moderne.
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  choice: l’ancien souverain de cette Égypte
  rationale: « Ancien souverain » restitue πρὶν et δυνάστην sans renforcer indûment la nuance en « tyran » ; le démonstratif « cette » est conservé.
- source_word: πληθύνοντα θράμασιν
  choice: multipliant les actes d’insolence
  rationale: La tournure grecque est difficile ; cette traduction conserve l’idée d’une profusion croissante d’actes audacieux et insolents.
- source_word: ἐπαρθέντα ἀνόμῳ θράσει
  choice: lorsqu’il s’était élevé avec une arrogance impie
  rationale: « S’était élevé » garde la métaphore de l’exaltation orgueilleuse ; « impie » exprime ici une audace contraire à l’ordre divin plutôt qu’une simple illégalité civile.
- source_word: γλώσσῃ μεγαληγόμονι
  choice: une langue présomptueuse
  rationale: La formulation préserve l’image concrète de la langue et le sens d’un discours grandiloquent et vantard.
- source_word: σὺν τῇ ὑπερηφάνῳ στρατιᾷ
  choice: avec son armée orgueilleuse
  rationale: Rend directement στρατιά et ὑπερήφανος ; le possessif est explicité d’après le contexte.
- source_word: ποντοβρόχους ἀπώλεσας
  choice: as fait périr … engloutis par la mer
  rationale: La construction française relie le verbe principal à Pharaon et à son armée tout en conservant l’image frappante du composé grec « avalés par la mer ».
- source_word: φέγγος ἐπιφάνας ἐλέους
  choice: as fait resplendir … la lumière de ta miséricorde
  rationale: Conserve explicitement la métaphore lumineuse ; le possessif « ta » rend naturel en français le rapport entre la miséricorde et le Dieu invoqué.
- source_word: Ἰσραὴλ γένει
  choice: sur le peuple d’Israël
  rationale: « Peuple » restitue γένος dans ce contexte collectif sans les connotations modernes de « race ».
theological_decisions:
- issue: Le jugement de Pharaon et la miséricorde envers Israël forment une seule longue invocation contrastée.
  choice: Maintenir les deux actions divines dans une même phrase ample, avec les images de l’engloutissement et de la lumière.
  alternative: Scinder la phrase ou réduire « la lumière de la miséricorde » à « faire miséricorde ».
  rationale: La syntaxe et les images grecques mettent en regard le jugement contre l’oppresseur orgueilleux et la miséricorde manifestée à Israël ; les conserver évite d’aplanir cette tension.
translation_notes:
  register: Français international moderne, digne et adapté à une prière solennelle. La période ample du grec est préservée, mais les participes sont ordonnés pour rester intelligibles. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal, au voisinage des expressions concernées.
