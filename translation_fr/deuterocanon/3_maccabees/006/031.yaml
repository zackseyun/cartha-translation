base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
translation:
  language: fr
  text: Alors, ceux qui auparavant étaient couverts d’opprobre et se trouvaient près de l’Hadès — ou plutôt, y avaient déjà posé le pied[a] — organisèrent, au lieu d’un sort amer et difficile à boire, un festin de délivrance[b]. Remplis de joie, ils répartirent en places de banquet le lieu même qui avait été préparé pour leur chute et leur tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avaient déjà posé le pied sur lui ». Cette image signifie qu’ils étaient pour ainsi dire déjà morts. « Près de l’Hadès » peut aussi se comprendre comme « près de la mort » ou « près du tombeau ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner une beuverie, un festin arrosé ou, dans certains contextes, un récipient à boire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπονείδιστοι
  choice: couverts d’opprobre
  rationale: Exprime l’état de honte publique et les outrages subis, avec un registre digne et intelligible.
- source_word: πλησίον τοῦ ᾅδου
  choice: près de l’Hadès
  rationale: Conserve le terme explicite ᾅδης et l’image grecque du séjour des morts, sans la réduire d’emblée à la mort ou au tombeau.
- source_word: ἐπʼ αὐτῷ βεβηκότες
  choice: y avaient déjà posé le pied
  rationale: Le parfait de βαίνω avec ἐπί porte l’image saisissante de personnes ayant déjà mis le pied sur l’Hadès, donc tenues pour presque mortes.
- source_word: μόρου
  choice: sort
  rationale: μόρος désigne ici le sort funeste ou la destinée mortelle; « sort » préserve une certaine amplitude sémantique sans imposer « mort ».
- source_word: πικροῦ καὶ δυσαπότικου
  choice: amer et difficile à boire
  rationale: Maintient la métaphore de la boisson, qui prépare le contraste avec κῶθων.
- source_word: κῶθωνα σωτήριον
  choice: un festin où l’on buvait pour célébrer leur délivrance
  rationale: Dans le contexte des places de repas, κῶθων désigne vraisemblablement une réjouissance arrosée plutôt qu’un simple récipient; σωτήριον caractérise cette fête comme liée au salut ou à la délivrance.
- source_word: συστησάμενοι
  choice: organisèrent
  rationale: Rend naturellement le participe moyen indiquant qu’ils arrangèrent eux-mêmes cette célébration.
- source_word: εἰς πτῶσιν αὐτοῖς καὶ τάφον ἡτοιμασμένον
  choice: qui avait été préparé pour leur chute et leur tombeau
  rationale: Conserve le double tableau sombre du renversement et du tombeau, ainsi que le but hostile de la préparation.
- source_word: κλισίας κατεμέρισαν
  choice: ils répartirent en places où s’allonger pour le repas
  rationale: κλισία renvoie aux emplacements ou couches sur lesquels les convives s’allongeaient; cette formulation rend la scène sans suggérer des lits modernes.
- source_word: πλήρεις χαρμονῆς
  choice: remplis de joie
  rationale: Traduction directe et naturelle du profond renversement émotionnel.
theological_decisions:
- issue: Traduction de ᾅδης
  choice: l’Hadès
  alternative: la mort / le séjour des morts / le tombeau
  rationale: Le grec nomme explicitement l’Hadès. Garder ce mot préserve l’image du texte et évite de fixer une interprétation doctrinale plus étroite, tandis que la note en explique la valeur idiomatique.
- issue: Portée de σωτήριον
  choice: pour célébrer leur délivrance
  alternative: salutaire / qui apporte le salut
  rationale: Le terme peut évoquer le salut ou la délivrance. Dans cette scène de libération concrète et de banquet, « délivrance » est naturel tout en laissant intacte la tonalité salvatrice.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase grecque très dense est divisée en deux pour rester intelligible. Les images de la boisson, de l’Hadès et des places de repas sont conservées sans archaïsme excessif.
