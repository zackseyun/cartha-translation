  to: Alors, ceux qui auparavant étaient couverts d’opprobre et se trouvaient près de l’Hadès — ou plutôt, y avaient déjà posé le pied[a] — organisèrent, au lieu d’un sort amer et difficile à boire, un festin de délivrance[b]. Remplis de joie, ils répartirent en places de banquet le lieu même qui avait été préparé pour leur chute et leur tombeau.
