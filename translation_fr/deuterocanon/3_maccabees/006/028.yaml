base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/028.yaml
  text: Release the sons of the almighty[a], heavenly, living God[b], who from the time of our ancestors until now has brought unimpeded stability with glory to our affairs.
translation:
  language: fr
  text: Libérez les fils[a] du Dieu tout-puissant, céleste et vivant, qui, depuis le temps de nos ancêtres jusqu’à aujourd’hui, assure à nos affaires une stabilité sans entrave[b], accompagnée de gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants ». Le grec dit précisément « les fils ».
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « une sécurité sans obstacle » ou « une prospérité stable ». Le grec souligne un état ferme qui se maintient sans être entravé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσατε
  choice: Libérez
  rationale: L’impératif pluriel ordonne directement la mise en liberté; « Libérez » est naturel et conserve la force immédiate du grec.
- source_word: τοὺς υἱοὺς
  choice: les fils
  rationale: Le grec emploie explicitement le masculin pluriel υἱούς. « Les fils » en garde la précision sans l’élargir silencieusement à « les enfants ».
- source_word: τοῦ παντοκράτορος
  choice: du Dieu tout-puissant
  rationale: « Tout-puissant » est le titre divin français consacré et rend avec justesse παντοκράτωρ.
- source_word: ἐπουρανίου
  choice: céleste
  rationale: Cet adjectif qualifie Dieu dans une suite de titres; « céleste » est ici digne, clair et plus fluide que « qui est au ciel ».
- source_word: θεοῦ ζῶντος
  choice: Dieu … vivant
  rationale: « Dieu vivant » est la tournure biblique française usuelle et conserve la portée du participe grec.
- source_word: ἀφʼ ἡμετέρων μέχρι τοῦ νῦν προγόνων
  choice: depuis le temps de nos ancêtres jusqu’à aujourd’hui
  rationale: Cette formulation explicite en français la continuité temporelle exprimée de manière comprimée en grec, sans modifier son point de départ ni son terme présent.
- source_word: ἀπαραπόδιστον εὐστάθειαν
  choice: une stabilité sans entrave
  rationale: « Stabilité » garde le sens central de fermeté ou de bon ordre, tandis que « sans entrave » exprime l’absence d’obstacle sans surinterpréter le bienfait comme une prospérité matérielle.
- source_word: μετὰ δόξης
  choice: accompagnée de gloire
  rationale: Cette formulation rattache naturellement la gloire à la stabilité accordée, tout en conservant le substantif δόξα.
- source_word: προφέρει
  choice: assure
  rationale: Le présent « assure » rend l’action continue de Dieu jusqu’au moment présent et convient à l’idée de procurer durablement de la stabilité aux affaires du royaume.
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: à nos affaires
  rationale: « Nos affaires » préserve l’étendue de πράγματα — affaires, situation ou administration — sans préciser indûment « royaume » ou « État ».
theological_decisions:
- issue: Suite des titres divins παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: du Dieu tout-puissant, céleste et vivant
  alternative: du Dieu vivant, tout-puissant et céleste
  rationale: La traduction maintient distinctement les trois qualificatifs du texte grec tout en ajoutant seulement la coordination nécessaire à un français naturel; elle n’introduit aucune interprétation doctrinale supplémentaire.
- issue: Portée du terme filial υἱούς
  choice: les fils
  alternative: les enfants
  rationale: Le choix conserve le terme masculin précis de la source. La variante plus générale est signalée sans être substituée au texte grec.
- issue: Nature du bienfait divin exprimé par εὐστάθεια
  choice: une stabilité sans entrave
  alternative: une sécurité sans obstacle
  rationale: « Stabilité » laisse ouverte la portée politique, administrative ou générale du terme et évite de réduire le bienfait à la sécurité ou à la prospérité.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des qualificatifs divins est conservé autant que le permet la syntaxe française. Le présent « assure » exprime mieux que le passé composé la continuité indiquée par « depuis… jusqu’à aujourd’hui ».
