base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
translation:
  language: fr
  text: Des copies furent préparées pour eux[a], du vingt-cinquième jour de Pachôn au quatrième jour d’Épiphi[b], pendant quarante jours. Puis ils fixèrent leur destruction du cinquième au septième jour d’Épiphi, soit trois jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut évoquer la copie de textes ou la préparation de documents officiels ; le verset ne précise pas ce qui était copié ou préparé.
    reason: lexical_alternative
  - marker: b
    text: Pachôn et Épiphi sont des noms de mois égyptiens employés ici pour dater les mesures administratives.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀντιγράφονται
  choice: Des copies furent établies
  rationale: Le passif renvoie naturellement à l’établissement de copies ou de documents écrits. Cette formulation conserve l’objet indéterminé du grec sans préciser qu’il s’agissait d’ordres ou de listes.
- source_word: αὐτοῖς
  choice: à leur intention
  rationale: Le datif désigne les personnes concernées sans les nommer de nouveau. « À leur intention » rend naturellement cette relation tout en maintenant le référent implicite.
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν καὶ εἰκάδος
  choice: du vingt-cinq Pachôn
  rationale: L’expression grecque désigne le vingt-cinquième jour du mois égyptien de Pachôn.
- source_word: ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  choice: au quatre Épiphi
  rationale: Rendu calendaire naturel en français moderne, avec translittération du nom de mois égyptien.
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  choice: pendant quarante jours
  rationale: La préposition avec l’accusatif exprime ici la durée de la période.
- source_word: συνίστανται
  choice: ils fixèrent
  rationale: Dans ce contexte administratif, le verbe exprime l’action d’arrêter ou d’organiser officiellement ce qui devait avoir lieu.
- source_word: τὴν ἀπώλειαν
  choice: leur destruction
  rationale: Le terme désigne ici la mise à mort collective projetée. « Destruction » garde la force du grec sans expliciter davantage le mode envisagé.
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης
  choice: du cinq au sept Épiphi
  rationale: La formulation reproduit clairement la plage de dates, les deux jours extrêmes étant compris dans les trois jours indiqués ensuite.
- source_word: ἡμέραις τρισίν
  choice: sur trois jours
  rationale: Le datif indique l’étendue temporelle prévue; « sur trois jours » est idiomatique et correspond au calcul inclusif du cinq au sept.
