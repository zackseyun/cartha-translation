translation_notes:
  register: Français international moderne, sobre et digne. Les dates sont formulées selon l’usage français (« le vingt-cinq Pachôn », « le quatre Épiphi »). Les présents narratifs grecs sont rendus au passé simple pour assurer la continuité du récit, sans supprimer l’ambiguïté documentaire de Ἀντιγράφονται.
