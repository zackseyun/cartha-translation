lexical_decisions:
- source_word: ἀκούσας
  choice: lorsqu’il entendit
  rationale: Le participe aoriste fournit la circonstance temporelle de l’action principale ; cette tournure est naturelle en français.
- source_word: κραυγῆς
  choice: les clameurs
  rationale: Le nom désigne un cri puissant ou collectif ; le pluriel français rend naturellement le tumulte public suggéré par le contexte.
- source_word: συνιδὼν
  choice: les vit
  rationale: Le verbe exprime ici le fait de voir et de constater la situation ; « les vit » reste direct et idiomatique.
- source_word: πρηνεῖς
  choice: prosternés
  rationale: Le terme signifie étendus face contre terre. « Prosternés » conserve cette posture dans un registre narratif digne et concis.
- source_word: ἅπαντας
  choice: tous
  rationale: Le mot embrasse sans exception l’ensemble du groupe déjà mentionné.
- source_word: εἰς τὴν ἀπώλειαν
  choice: voués à la destruction
  rationale: Cette formulation exprime leur orientation vers une destruction imminente sans préciser davantage l’agent ni le mécanisme.
- source_word: δακρύσας
  choice: il pleura
  rationale: Le participe indique qu’il versa des larmes ; la proposition française rend clairement cette action liée à la menace.
- source_word: μετʼ ὀργῆς
  choice: de colère
  rationale: La formulation associe étroitement les larmes à la colère, conformément à la proximité syntaxique du grec, sans supprimer cette tension émotionnelle.
- source_word: τοῖς φίλοις
  choice: ses amis
  rationale: Le sens lexical de base est conservé, tandis que la possible valeur officielle de « membres de l’entourage royal » est signalée en note.
- source_word: διηπείλει
  choice: menaça
  rationale: L’imparfait grec présente la menace dans le déroulement narratif ; le passé simple français convient à la narration, sans alourdir le texte par une expression durative.
- source_word: λέγων
  choice: en disant
  rationale: Cette formule introduit naturellement le discours direct qui suit.
