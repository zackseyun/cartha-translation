  text: For when he heard the outcry[a], and saw all of them prostrate for destruction, he wept in anger and threatened his friends, saying,
translation:
  language: fr
  text: 'Car, lorsqu’il entendit la clameur et les vit tous prosternés, voués à la destruction, il pleura de colère et menaça ses amis[a] en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « amis » peut aussi désigner les membres de l’entourage royal ou les courtisans.
