  yaml_path: translation/deuterocanon/3_maccabees/006/029.yaml
  text: So he said these things[a]; but they, having been released in a moment, blessed their holy Savior God[b], having just escaped death.
translation:
  language: fr
  text: Il fit donc ce choix. Quant à eux, libérés en un instant[a], ils bénissaient leur Dieu saint et sauveur[b], tout juste échappés à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans délai ». L’expression grecque désigne un intervalle extrêmement bref.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur saint Dieu et sauveur ». Le grec réunit étroitement les termes « saint », « sauveur » et « Dieu », sans en préciser entièrement le rapport syntaxique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: prononça
  rationale: Dans ce contexte de discours, le verbe signifie qu’il énonça les paroles précédentes. « Prononça ces paroles » est naturel et garde un registre digne.
- source_word: ἐν ἀμερεῖ χρόνῳ
  choice: en un instant
  rationale: L’expression idiomatique désigne un laps de temps extrêmement bref; « en un instant » en rend clairement l’immédiateté.
- source_word: λυθέντες
  choice: libérés
  rationale: Le participe passif indique qu’ils ont été délivrés de leurs liens ou de leur situation de contrainte; « libérés » convient au contexte sans préciser davantage le moyen.
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  choice: leur Dieu saint et sauveur
  rationale: Cette formulation française réunit étroitement les qualificatifs appliqués à Dieu, tout en restant naturelle. La note signale l’ambiguïté syntaxique réelle de cette suite de termes.
- source_word: ηὐλόγουν
  choice: bénissaient
  rationale: Le verbe est le terme biblique courant pour bénir Dieu; « bénissaient » conserve cette valeur plutôt que de la réduire à la seule louange.
- source_word: ἄρτι
  choice: tout juste
  rationale: L’adverbe souligne que leur délivrance de la mort venait immédiatement de se produire.
- source_word: τὸν θάνατον ἐκπεφυγότες
  choice: après avoir tout juste échappé à la mort
  rationale: Le participe parfait exprime une fuite menée à son terme dont l’effet demeure; cette tournure française restitue l’action accomplie et son caractère tout récent.
theological_decisions:
- issue: Sens de σωτῆρα appliqué à Dieu dans ce récit
  choice: sauveur
  alternative: libérateur
  rationale: « Sauveur » conserve toute la portée du terme grec et convient à une délivrance divine face à la mort, sans ajouter de précision doctrinale étrangère au passage.
- issue: Rapport syntaxique entre ἅγιον, σωτῆρα et θεὸν
  choice: leur Dieu saint et sauveur
  alternative: leur saint Sauveur, Dieu
  rationale: Le grec présente une suite compacte de désignations dont le rapport exact peut se comprendre de plusieurs façons. Le texte principal garde leur unité, tandis que la note préserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide, les participes grecs sont rendus sans lourdeur, et le vocabulaire biblique « bénissaient » et « sauveur » est conservé.
