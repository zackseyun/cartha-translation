  source_fidelity: 'La première proposition n’est pas fidèle au grec : ἐξέλεξεν signifie « choisit / fit un choix », et non « prononça ». Le reste rend bien l’opposition μὲν…δέ, la libération rapide, la bénédiction de Dieu et l’échappée toute récente à la mort. « Tout juste échappés à la mort » restitue plus directement le participe parfait avec ἄρτι.'
