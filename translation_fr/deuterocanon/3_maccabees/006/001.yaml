revisions:
- from: 'Un certain Éléazar, homme éminent parmi les Juifs du pays, était déjà parvenu à un âge avancé et se distinguait par toutes les vertus dans sa conduite. Après avoir fait taire les anciens qui l’entouraient afin d’invoquer le Dieu saint,[a] il pria ainsi :'
  to: 'Un certain Éléazar, homme éminent parmi les Juifs du pays, était déjà parvenu à un âge avancé et se distinguait par toutes les vertus qui marquaient sa vie. Après avoir apaisé les anciens qui l’entouraient afin d’invoquer le Dieu saint, il pria ainsi :'
  rationale: 'La révision remplace une précision excessive par « apaisé » et supprime la note, car elle attribuait à καταστείλας un sens (« exhorter ») absent du texte grec. La construction conserve le déroulement grec : Éléazar apaise les anciens, invoque le Dieu saint et prie.'
