  text: 'A certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: fr
  text: 'Un certain Éléazar, homme éminent parmi les Juifs du pays, était déjà parvenu à un âge avancé et se distinguait par toutes les vertus qui marquaient sa vie. Après avoir apaisé les anciens qui l’entouraient afin d’invoquer le Dieu saint, il pria ainsi :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίσημος
  choice: éminent
  rationale: Exprime la distinction et la notoriété du personnage dans un registre digne et naturel.
- source_word: τῶν ἀπὸ τῆς χώρας Ἰουδαίων
  choice: parmi les Juifs du pays
  rationale: Rend l’appartenance au groupe et l’origine ou l’implantation locale sans surcharger la phrase.
- source_word: ἐν πρεσβείῳ τὴν ἡλικίαν ἤδη λελογχώς
  choice: était déjà parvenu à un âge avancé
  rationale: Restitue idiomatiquement l’idée d’avoir atteint la vieillesse.
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  choice: se distinguait par toutes les vertus dans sa conduite
  rationale: Évite le calque peu naturel « orné » tout en conservant la portée morale de ἀρετή et son rapport à la manière de vivre.
- source_word: καταστείλας
  choice: Après avoir fait taire
  rationale: Dans ce contexte précédant une prière publique, le verbe indique qu’Éléazar calme l’assemblée ou lui impose le silence.
- source_word: τὸν ἅγιον θεόν
  choice: le Dieu saint
  rationale: Conserve l’article, le nom divin et la qualification explicite du grec.
theological_decisions:
- issue: Sujet implicite de l’infinitif ἐπικαλεῖσθαι
  choice: Éléazar fait taire les anciens afin d’invoquer lui-même le Dieu saint.
  alternative: Éléazar fait taire ou exhorte les anciens pour qu’ils invoquent le Dieu saint.
  rationale: Le sujet grammatical principal reste Éléazar, et la coordination avec « il pria » favorise l’interprétation où il se prépare lui-même à invoquer Dieu. La syntaxe grecque permet néanmoins une autre compréhension, signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase grecque très longue est divisée en deux pour améliorer la lisibilité sans modifier sa progression. Le marqueur δέ n’est pas rendu par un « Or » mécanique, puisqu’il assure ici une transition narrative légère.
