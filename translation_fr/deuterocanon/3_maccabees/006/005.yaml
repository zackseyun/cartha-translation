base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
translation:
  language: fr
  text: C’est toi qui as brisé Sennachérib, le redoutable roi des Assyriens[a], devenu arrogant à cause de ses forces innombrables, lui qui avait déjà pris toute la terre sous sa main par la lance[b] et s’était élevé contre ta ville sainte, proférant des paroles outrageantes avec vantardise et insolence. C’est toi, Maître[c], qui l’as brisé, en manifestant clairement ta puissance à de nombreuses nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le roi oppressif des Assyriens » ou « le puissant roi des Assyriens » ; le mot grec peut évoquer ce qui est pesant, terrible ou puissant.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avait déjà pris toute la terre sous sa main par la lance ».'
    reason: lexical_alternative
  - marker: c
    text: Le titre grec est ici « Maître » (despotēs), et non le terme plus courant traduit par « Seigneur » (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναριθμήτοις δυνάμεσιν
  choice: ses forces innombrables
  rationale: Dans ce contexte militaire, δυνάμεις désigne les forces armées, tandis que ἀναρίθμητος signifie qu’elles sont impossibles à dénombrer.
- source_word: γαυρωθέντα
  choice: devenu arrogant
  rationale: Le participe exprime l’orgueil hautain suscité par la puissance militaire de Sennachérib.
- source_word: βαρὺν
  choice: redoutable
  rationale: Appliqué au roi assyrien, l’adjectif évoque une figure pesante, terrible ou oppressive. « Redoutable » conserve cette force sans trancher exclusivement en faveur de la puissance ou de l’oppression.
- source_word: δόρατι τὴν πᾶσαν ὑποχείριον ἤδη λαβόντα γῆν
  choice: Il avait déjà, par la lance, placé toute la terre sous sa main
  rationale: La formulation garde l’image concrète de la lance et l’idiome de la domination « sous la main », tout en adoptant une syntaxe française naturelle.
- source_word: μετεωρισθέντα ἐπὶ τὴν ἁγίαν σου πόλιν
  choice: s’était élevé contre ta ville sainte
  rationale: Cette formulation conserve à la fois le mouvement hostile contre la ville et la nuance d’élévation orgueilleuse.
- source_word: βαρέα λαλοῦντα
  choice: tenant des propos accablants
  rationale: βαρέα qualifie ici des paroles lourdes, dures ou outrageantes. « Accablants » maintient leur gravité sans les préciser comme des menaces.
- source_word: κόμπῳ καὶ θράσει
  choice: avec vantardise et insolence
  rationale: Le binôme rend l’ostentation orgueilleuse et l’audace effrontée de son discours.
- source_word: ἔθραυσας
  choice: as brisé
  rationale: Le verbe dépeint une défaite décisive. « Brisé » est fort, digne et proche de l’image grecque.
- source_word: ἔκδηλον δεικνὺς ἔθνεσιν πολλοῖς τὸ σὸν κράτος
  choice: qui as ainsi manifesté ta puissance à de nombreuses nations
  rationale: Le participe est rattaché à l’action principale et en explicite le résultat. κράτος désigne ici la puissance effectivement démontrée.
theological_decisions:
- issue: Titre divin δέσποτα
  choice: Maître
  alternative: Seigneur ; Souverain
  rationale: « Maître » préserve la distinction avec κύριος et rend l’autorité absolue exprimée par δέσποτα, sans introduire une interprétation confessionnelle.
- issue: Lien du participe ἔκδηλον δεικνύς avec ἔθραυσας
  choice: Le rendre par une proposition relative explicitant le résultat de l’action divine
  alternative: 'Conserver un participe français : « manifestant ainsi ta puissance »'
  rationale: La proposition relative évite un participe pendant et restitue clairement que, par la défaite de Sennachérib, Dieu a rendu sa puissance manifeste aux nations, sans ajouter de détail historique.
- issue: Allusion historique à l’attaque de la ville sainte
  choice: Traduire directement sans identifier ni développer l’événement
  alternative: Préciser Jérusalem ou ajouter les circonstances rapportées ailleurs
  rationale: Le grec dit seulement « ta ville sainte » et suppose l’allusion connue ; la traduction ne doit pas importer des éléments narratifs absents.
translation_notes:
  register: Français international moderne, soutenu mais accessible, adapté au registre d’une prière solennelle. La répétition « C’est toi » reflète l’insistance du double σύ grec. Les phrases ont été légèrement segmentées afin de rendre intelligible la longue période grecque sans en perdre la progression.
