revisions:
- from: C’est toi qui as brisé Sennachérib, le redoutable roi des Assyriens[a], devenu arrogant à cause de ses forces innombrables. Il avait déjà, par la lance, placé toute la terre sous sa main[b] et s’était élevé contre ta ville sainte, tenant des propos accablants avec vantardise et insolence. C’est toi, Maître[c], qui as ainsi manifesté ta puissance à de nombreuses nations.
  to: C’est toi qui as brisé Sennachérib, le redoutable roi des Assyriens[a], devenu arrogant à cause de ses forces innombrables, lui qui avait déjà pris toute la terre sous sa main par la lance[b] et s’était élevé contre ta ville sainte, proférant des paroles outrageantes avec vantardise et insolence. C’est toi, Maître[c], qui l’as brisé, en manifestant clairement ta puissance à de nombreuses nations.
  rationale: La révision rétablit « pris » pour λαβόντα, améliore le rendu idiomatique de βαρέα λαλοῦντα κόμπῳ καὶ θράσει, et restitue la construction grecque où « toi, Maître » reprend avec insistance le sujet de « tu as brisé » avant le participe « en manifestant ». Aucune identification supplémentaire de la ville sainte ni aucun détail historique extérieur n’est ajouté.
