  terminology: « Places fortes » rend bien ὀχυρώματα. « Maison » rend οἰκία sans introduire l’intensité affective de « foyer ». La formulation « avec fidélité » ne transforme pas πίστις en affirmation doctrinale et une note conserve les possibilités « dans la foi », « en confiance » et « avec loyauté ».
