  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
translation:
  language: fr
  text: Qui a éloigné de leur maison ceux qui tenaient avec fidélité les places fortes de notre pays[a], et a rassemblé chacun ici sans raison ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La syntaxe grecque est difficile. La traduction comprend « ceux qui tenaient avec fidélité les places fortes de notre pays ». On peut aussi rattacher « nous » à « retenaient/gardaient » : « ceux qui nous retenaient dans la foi, en confiance ou avec loyauté ».'
    reason: ambiguïté_syntaxique_et_lexicale
lexical_decisions:
- source_word: τίς
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique directe.
- source_word: τοὺς κρατήσαντας
  choice: ceux qui tenaient
  rationale: Le participe aoriste substantivé désigne ceux qui occupaient ou gardaient les places fortes; « tenaient » conserve la valeur concrète de κρατέω sans préciser indûment leur fonction.
- source_word: ἡμῶν … τὰ τῆς χώρας ὀχυρώματα
  choice: les places fortes de notre pays
  rationale: Malgré l’ordre hyperbatique, ἡμῶν se comprend naturellement avec χώρας; ὀχυρώματα désigne des lieux fortifiés ou défensifs.
- source_word: ἐν πίστει
  choice: fidèlement
  rationale: Dans ce contexte de service rendu au pays, la locution exprime vraisemblablement la fidélité ou la loyauté, non une affirmation doctrinale sur la foi; l’adverbe français est naturel tout en gardant cette nuance.
- source_word: τῆς οἰκίας ἀποστήσας
  choice: a arraché à leur foyer
  rationale: Le génitif dépend naturellement du verbe de séparation; οἰκία évoque ici le domicile. « Arracher » rend la séparation imposée, sans développer davantage la manière.
- source_word: ἕκαστον
  choice: les a tous
  rationale: Le singulier distributif signifie littéralement « chacun »; après « ceux qui », le français idiomatique « les a tous » en conserve la portée collective et individuelle.
- source_word: ἀλόγως
  choice: sans raison
  rationale: L’adverbe peut signifier de manière déraisonnable ou injustifiée; « sans raison » préserve l’accusation sans choisir entre absence de motif et irrationalité.
- source_word: ἤθροισεν ἐνθάδε
  choice: les a tous rassemblés ici
  rationale: ἀθροίζω exprime le rassemblement, et ἐνθάδε désigne explicitement le lieu où parle le locuteur.
theological_decisions:
- issue: Sens de πίστις dans la locution ἐν πίστει
  choice: fidèlement
  alternative: dans la foi; avec loyauté; en toute confiance
  rationale: Le contexte porte sur la manière dont ces personnes tenaient les fortifications du pays. La valeur de fidélité ou loyauté convient mieux que le sens religieux de « foi », tout en respectant la polysémie du terme.
- issue: Construction difficile et ordre des mots
  choice: Rattacher τῆς οἰκίας à ἀποστήσας et ἡμῶν à χώρας
  alternative: Rattacher « maison » aux fortifications ou comprendre ἡμῶν comme complément de κρατήσαντας
  rationale: 'Cette analyse donne une construction grecque cohérente: des personnes fidèles tenaient les places fortes du pays, puis furent éloignées de leur foyer et rassemblées ici. La difficulté du texte est néanmoins signalée en note.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la force de la question rhétorique. « Places fortes », « foyer » et « sans raison » offrent un registre digne sans archaïsme.
