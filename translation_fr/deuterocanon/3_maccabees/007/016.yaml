base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
translation:
  language: fr
  text: Mais ceux qui étaient restés attachés à Dieu jusqu’à la mort, après avoir obtenu une délivrance complète[a], quittèrent la ville, couverts de toutes sortes de fleurs au parfum exquis. Dans la joie et les acclamations, ils rendaient grâce à Dieu, le Dieu de leurs pères, le saint Sauveur d’Israël[c], avec des louanges et des hymnes aux multiples mélodies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir joui d’un salut complet ». Ici, le grec σωτηρία peut désigner la délivrance concrète tout en appartenant au vocabulaire plus large du salut.
    reason: lexical_alternative
  - marker: b
    text: Le sens précis du rare mot grec traduit par « aux multiples mélodies » est incertain ; il peut évoquer des hymnes pleinement déployés, aux mélodies variées, ou faisant appel à toute la gamme musicale.
    reason: textual_or_lexical_ambiguity
  - marker: c
    text: Ou « le saint Libérateur d’Israël ». Le grec σωτήρ peut désigner aussi bien un sauveur qu’un libérateur.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  choice: étaient restés attachés à Dieu jusqu’à la mort
  rationale: Le parfait de ἔχω exprime ici une fidélité maintenue, non la possession littérale de Dieu. « Jusqu’à la mort » conserve la limite extrême indiquée par le grec sans affirmer que ces personnes sont effectivement mortes.
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν ἐσχηκότες
  choice: après avoir obtenu une délivrance complète
  rationale: Dans ce récit de préservation face à une menace mortelle, σωτηρία désigne d’abord la délivrance concrète. « Complète » rend l’intensité de παντελής.
- source_word: ἀνέζευξαν ἐκ τῆς πόλεως
  choice: ils quittèrent la ville
  rationale: ἀναζεύγνυμι évoque le fait de lever le camp ou de se mettre en route. La formulation française exprime naturellement le départ hors de la ville.
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  choice: couverts de toutes sortes de fleurs au parfum exquis
  rationale: Le participe évoque des personnes parées ou couvertes de fleurs; le superlatif εὐωδέστατος est rendu idiomatiquement par « au parfum exquis ».
- source_word: μετʼ εὐφροσύνης καὶ βοῆς
  choice: dans la joie et les acclamations
  rationale: εὐφροσύνη désigne la joie festive et βοή un cri collectif et sonore. Dans cette procession, « acclamations » convient mieux que le plus indéterminé « cris ».
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  choice: par des louanges et des hymnes aux riches mélodies
  rationale: αἶνοι désigne des louanges. Le rare παμμελέτοις semble souligner la plénitude ou la richesse musicale des hymnes; la traduction reste évocatrice sans préciser indûment le mode d’exécution.
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν
  choice: à Dieu, le Dieu de leurs pères
  rationale: La répétition explicite en français clarifie que les désignations finales sont en apposition et conserve la formule ancestrale du grec.
- source_word: ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  choice: le saint Sauveur d’Israël
  rationale: σωτήρ peut désigner celui qui délivre et fonctionner comme un titre divin. « Sauveur » maintient à la fois le lien avec le secours raconté et la solennité théologique de la formule.
theological_decisions:
- issue: Rapport entre σωτηρία et σωτήρ dans un récit de délivrance
  choice: Rendre σωτηρία par « délivrance » et σωτήρ par « Sauveur »
  alternative: Employer « salut » et « Sauveur », ou « délivrance » et « libérateur » dans les deux expressions apparentées
  rationale: Le premier terme décrit directement le sauvetage historique, tandis que le second appartient à une désignation divine solennelle. Ce choix conserve les deux dimensions sans réduire l’une à l’autre.
- issue: Portée de μέχρι θανάτου
  choice: Conserver « jusqu’à la mort » sans affirmer un décès effectif
  alternative: « Même face à la mort » ou « au péril de leur vie »
  rationale: Le grec présente la mort comme la limite extrême de leur attachement à Dieu. La traduction formelle préserve cette tension dans un contexte où ils ont survécu.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe grecque très chargée est répartie en deux phrases pour assurer la lisibilité, tout en conservant la procession, la louange et les appositions divines. Les majuscules de « Sauveur » et d’« Israël » marquent le caractère titulaire sans introduire de particularisme confessionnel.
