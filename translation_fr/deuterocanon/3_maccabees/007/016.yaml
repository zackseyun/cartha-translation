  to: Mais ceux qui étaient restés attachés à Dieu jusqu’à la mort, après avoir obtenu une délivrance complète[a], quittèrent la ville, couverts de toutes sortes de fleurs au parfum exquis. Dans la joie et les acclamations, ils rendaient grâce à Dieu, le Dieu de leurs pères, le saint Sauveur d’Israël[c], avec des louanges et des hymnes aux multiples mélodies[b].
  rationale: La révision remplace une interprétation musicale trop spécifique de παμμελέτοις par une formulation française idiomatique qui conserve sa portée possiblement extensive et l’incertitude signalée en note. Elle simplifie aussi l’attaque de la phrase. L’ordre final a été légèrement réagencé afin que l’action de grâce soit clairement adressée à Dieu, tout en conservant les deux titres appositionnels du grec.
