base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/018.yaml
  text: There they held a saving banquet[a], since the king had generously supplied each of them with everything for the journey, all the way to his own house.
translation:
  language: fr
  text: Là, ils célébrèrent un banquet de délivrance[a], car le roi avait généreusement fourni à chacun tout ce qui était nécessaire pour le voyage, jusqu’à sa propre maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un banquet salutaire » ou « un festin de délivrance ». Le grec rattache explicitement cette célébration à leur salut ou à leur délivrance.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότον
  choice: banquet
  rationale: Le nom peut désigner une beuverie ou un festin où l’on boit. Dans ce contexte de célébration collective, « banquet » exprime naturellement l’événement sans le réduire à la boisson.
- source_word: σωτήριον
  choice: de délivrance
  rationale: L’adjectif rattache explicitement le banquet au salut ou à la délivrance dont ils viennent de bénéficier. Cette formulation garde ce lien sans préciser indûment l’agent de la délivrance.
- source_word: ἐποίησαν πότον
  choice: ils célébrèrent un banquet
  rationale: Littéralement, ils « firent » un banquet. « Célébrèrent un banquet » est idiomatique en français et rend la dimension festive du contexte.
- source_word: χορηγήσαντος
  choice: avait fourni
  rationale: Le participe indique que le roi a pourvu à leurs besoins, à ses frais; le caractère cordial ou libéral de cette fourniture est rendu par l’adverbe.
- source_word: εὐψύχως
  choice: généreusement
  rationale: L’adverbe évoque une disposition empressée et de bon cœur. Avec l’idée de fournir des ressources, « généreusement » convient au français courant.
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  choice: tout ce qui était nécessaire pour le voyage
  rationale: L’expression désigne l’ensemble des moyens requis pour parvenir à destination. « Pour le voyage » est naturel, tandis que la proposition finale précise que la destination est le domicile de chacun.
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: Le datif singulier a une valeur distributive et souligne que chaque personne a reçu les provisions requises.
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  choice: jusqu’à sa propre maison
  rationale: La formule indique que la prise en charge s’étendait jusqu’au domicile personnel de chacun; le singulier français conserve la distribution introduite par « chacun ».
theological_decisions:
- issue: Portée de σωτήριον
  choice: banquet de délivrance
  alternative: banquet salutaire
  rationale: « De délivrance » conserve le rapport explicite entre la fête et leur sauvetage, sans transformer le banquet lui-même en moyen de salut ni imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le singulier distributif de l’original après « chacun » et évite de préciser au-delà du grec la nature théologique de la délivrance.
