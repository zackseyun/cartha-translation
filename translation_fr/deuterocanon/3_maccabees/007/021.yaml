  text: each one to his former place[a], having obtained authority among their enemies with glory and fear[b], their whole body of possessions having been shaken by none.
translation:
  language: fr
  text: chacun regagna sa place d’autrefois[a], ayant acquis, parmi leurs ennemis, une autorité avec gloire et crainte[b], sans que personne ait porté atteinte à l’ensemble de leurs biens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : littéralement, « chacun vers l’antérieure ». Il peut s’agir de la place, de la demeure ou de la situation qu’ils avaient auparavant.'
    reason: lexical_alternative
  - marker: b
    text: Ou « avec honneur et crainte ». Le grec ne précise pas si cette crainte était éprouvée par leurs ennemis ou si elle accompagnait leur nouvelle position.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Rend directement le singulier distributif grec, même si la suite reprend le groupe au pluriel.
- source_word: εἰς τὴν ἔμπροσθεν
  choice: regagna sa place d’autrefois
  rationale: L’expression grecque est elliptique et désigne vraisemblablement le lieu ou la situation antérieure de chacun. « Regagna » explicite en français le mouvement impliqué par εἰς et par le contexte.
- source_word: ἐν τοῖς ἐχθροῖς
  choice: parmi leurs ennemis
  rationale: Conserve la valeur relationnelle ou sociale de ἐν avec le datif, sans imposer exclusivement l’idée d’une domination exercée « sur » les ennemis.
- source_word: ἐξουσίαν ἐσχηκότες
  choice: ayant acquis de l’autorité
  rationale: Le parfait de ἔχω décrit une autorité désormais détenue; « acquis » exprime ce résultat en français naturel.
- source_word: μετὰ δόξης καὶ φόβου
  choice: avec gloire et crainte
  rationale: Maintient les deux noms grecs sans préciser artificiellement qui éprouve la crainte ni si φόβος signifie plutôt respect craintif ou peur.
- source_word: τὸ σύνολον
  choice: quoi que ce soit
  rationale: Pris avec la négation et le génitif des biens, le tour renforce l’idée qu’aucune part de leurs possessions ne leur a été enlevée; le français reformule cette totalité de manière idiomatique.
- source_word: ὑπὸ μηδενὸς διασεισθέντες
  choice: sans que personne ne leur ait extorqué
  rationale: διασείω peut désigner le fait d’arracher ou d’extorquer des biens par intimidation, sens bien adapté à la construction passive avec le génitif τῶν ὑπαρχόντων.
- source_word: τῶν ὑπαρχόντων
  choice: de leurs biens
  rationale: Le neutre pluriel substantivé désigne couramment les biens ou possessions d’une personne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la reprise collective au pluriel après « chacun ». Elle maintient l’ambiguïté de l’expression elliptique εἰς τὴν ἔμπροσθεν et celle de φόβος, tout en rendant διασείω selon son sens attesté d’extorsion de biens.
