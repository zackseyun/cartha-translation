  source_fidelity: La conclusion « sans que personne ne leur ait extorqué quoi que ce soit » impose indûment à διασείω le sens spécialisé d’extorquer. Dans cette construction, le verbe conserve plus sûrement l’idée générale d’être ébranlé, troublé ou subi une atteinte; le texte vise l’intégrité de leurs biens, sans préciser le mode d’une éventuelle atteinte. « Sans que personne ait porté atteinte à l’ensemble de leurs biens » rend cette portée sans la restreindre à l’extorsion. Le reste préserve convenablement l’ellipse de εἰς τὴν ἔμπροσθεν, le sens relationnel possible de ἐν τοῖς ἐχθροῖς et l’ambiguïté de φόβος.
