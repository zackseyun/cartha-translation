  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
translation:
  language: fr
  text: Ce jour-là, ils tuèrent plus de trois cents hommes et célébrèrent aussi ce jour dans l’allégresse et la joie, après avoir maîtrisé les profanes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin de la phrase grecque est difficile. « Après avoir maîtrisé les profanes » peut aussi se traduire par « après s’être emparés des impies » ou « après avoir mis la main sur les profanes ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  choice: ils tuèrent
  rationale: Dans ce récit, l’aoriste de ἀναιρέω signifie clairement « tuer » ; ce choix est direct, moderne et conserve la violence de l’action.
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  choice: plus de trois cents hommes
  rationale: ὑπέρ avec l’accusatif exprime ici un dépassement numérique, et ἄνδρας désigne explicitement des hommes.
- source_word: ἣν καὶ ἤγαγον εὐφροσύνην μετὰ χαρᾶς
  choice: et célébrèrent aussi ce jour dans l’allégresse et la joie
  rationale: Le relatif féminin ἣν renvoie naturellement à ἡμέραν, tandis que ἄγω avec εὐφροσύνην exprime ici la célébration. La formulation française rend l’idée sans reproduire servilement l’expression grecque « conduire l’allégresse ».
- source_word: βεβήλους
  choice: les profanes
  rationale: Employé substantivement, βεβήλους caractérise ces personnes comme profanes ou irrévérencieuses du point de vue du narrateur, sans ajouter une qualification doctrinale plus précise.
- source_word: χειρωσάμενοι
  choice: après avoir maîtrisé
  rationale: Le participe de χειρόω peut signifier mettre sous sa main, s’emparer de ou maîtriser. « Maîtrisé » conserve l’idée de domination sans imposer un geste physique particulier.
theological_decisions:
- issue: Caractérisation religieuse exprimée par βεβήλους
  choice: les profanes
  alternative: les impies
  rationale: « Les profanes » demeure proche du lexème grec et conserve le jugement religieux du narrateur sans renforcer celui-ci en « sans Dieu ».
- issue: Rapport entre la célébration et la maîtrise des profanes dans la proposition finale difficile
  choice: 'une succession circonstancielle : « après avoir maîtrisé les profanes »'
  alternative: 'une relation causale : « parce qu’ils avaient vaincu les impies »'
  rationale: La syntaxe grecque transmise est abrupte. Le participe aoriste permet d’exprimer une action antérieure, mais ne suffit pas à établir explicitement une causalité ; la traduction évite donc d’ajouter « parce que ».
translation_notes:
  register: Français international moderne, courant et digne. « Dans l’allégresse et la joie » garde les deux termes grecs proches, εὐφροσύνη et χαρά, tandis que « célébrèrent ce jour » explicite naturellement l’idiome et le référent du pronom relatif.
