  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : transfert sous contrainte, traitement comme des esclaves puis comme des conspirateurs, absence de procédure et tentative de mise à mort. Toutefois, « Ils s’étaient revêtus » introduit un plus-que-parfait absent du participe grec, qui est lié à l’action principale. Une construction participiale française maintient mieux la relation syntaxique et rhétorique.'
  naturalness: Le français est globalement naturel et soutenu. « Après les avoir conduits enchaînés » est plus idiomatique que « Ils les firent aussi descendre enchaînés », tout en gardant la direction de κατάγω sans spécifier de lieu. « Sans aucune instruction ni enquête » restitue de manière naturelle le doublet procédural.
  terminology: « Esclaves », « conspirateurs », « tuer » et « loi des Scythes » sont justes et conservent respectivement la déshumanisation, l’accusation de complot, la portée létale et l’ambiguïté de νόμος. La note culturelle formule prudemment la valeur rhétorique de la référence aux Scythes.
