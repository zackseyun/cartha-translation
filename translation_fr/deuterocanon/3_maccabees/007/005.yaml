base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/005.yaml
  text: These men[a], after bringing them down in chains with abuse, as servants—or rather, as conspirators—attempted to destroy them without any hearing or examination[c][b], having clothed themselves in a savagery more brutal than the law of the Scythians.
translation:
  language: fr
  text: Après les avoir conduits enchaînés, au milieu de mauvais traitements[a], comme des esclaves — ou plutôt comme des conspirateurs[b] —, ils tentèrent de les tuer sans aucune instruction ni enquête, revêtus d’une cruauté plus sauvage que la loi des Scythes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous les vexations » ou « au milieu des brutalités » ; le grec évoque des traitements pénibles, humiliants ou violents.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement « comme des esclaves — ou plutôt comme des conspirateurs » : la seconde expression renchérit en les présentant comme des auteurs de complots hostiles.'
    reason: lexical_alternative
  - marker: c
    text: Ici, « loi » peut aussi avoir le sens de « coutume ». Dans la rhétorique grecque ancienne, les Scythes étaient souvent évoqués comme un exemple de férocité extrême.
    reason: cultural_note
lexical_decisions:
- source_word: δεσμίους
  choice: enchaînés
  rationale: Le terme désigne des personnes liées ou détenues. « Enchaînés » conserve ici son sens concret et la violence de la scène.
- source_word: καταγαγόντες
  choice: firent descendre
  rationale: Le participe de κατάγω garde une valeur directionnelle, « faire descendre » ou « conduire vers le bas », sans préciser une destination que le verset ne nomme pas.
- source_word: μετὰ σκυλμῶν
  choice: au milieu de mauvais traitements
  rationale: Le pluriel évoque les vexations, violences ou humiliations subies pendant le transfert. Cette formulation française reste naturelle sans réduire le sens à des paroles injurieuses.
- source_word: ὡς ἀνδράποδα
  choice: comme des esclaves
  rationale: ἀνδράποδον désigne une personne réduite en esclavage, notamment comme butin. « Esclaves » maintient la force déshumanisante du terme.
- source_word: μᾶλλον δὲ ὡς ἐπιβούλους
  choice: ou plutôt comme des conspirateurs
  rationale: μᾶλλον δέ corrige et renchérit sur la première comparaison. « Conspirateurs » rend l’idée de personnes soupçonnées de tramer un complot hostile.
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  choice: sans le moindre interrogatoire ni examen de leur cas
  rationale: Les deux noms appartiennent au champ de l’enquête et de l’examen judiciaire. La traduction conserve le doublet tout en exprimant clairement l’absence totale de procédure.
- source_word: ἐπεχείρησαν ἀνελεῖν
  choice: tentèrent de les tuer
  rationale: ἐπιχειρέω marque une tentative, tandis que ἀναιρέω signifie ici mettre à mort. « Tuer » est plus précis en français moderne que l’euphémisme « faire disparaître ».
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  choice: plus sauvage encore que la loi des Scythes
  rationale: « Loi » traduit formellement νόμος, qui peut aussi désigner une coutume. La comparaison rhétorique avec les Scythes est maintenue sans être domestiquée.
- source_word: ἐνπεπηρμένοι ὠμότητα
  choice: s’étaient revêtus d’une cruauté
  rationale: La forme grecque est difficile, mais elle décrit l’appropriation ou l’imprégnation d’une cruauté extrême. « Se revêtir » préserve l’image vigoureuse plutôt que de l’aplatir en simple disposition psychologique.
theological_decisions:
- issue: Rendu du langage déshumanisant dans ὡς ἀνδράποδα
  choice: comme des esclaves
  alternative: comme des captifs
  rationale: Le mot ne désigne pas seulement des prisonniers, mais des êtres humains traités comme propriété servile. Le rendre explicitement évite d’atténuer la violence morale du texte.
- issue: Portée de νόμος dans la comparaison avec les Scythes
  choice: la loi des Scythes
  alternative: la coutume des Scythes
  rationale: Le sens « coutume » est possible, mais « loi » conserve l’ambiguïté et l’étrangeté rhétorique du grec sans imposer une interprétation culturelle unique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la progression accusatrice du grec, le contraste « esclaves — ou plutôt conspirateurs », l’absence de toute procédure et l’image finale de la cruauté dont les persécuteurs se revêtent.
