  - severity: low
    issue: Enchaînement de καταγαγόντες
    rationale: « Ils les firent aussi descendre » est possible, mais « après les avoir conduits » rend plus naturellement en français le participe aoriste et évite de surcharger « aussi », dont la portée grecque n’est pas à isoler ainsi.
