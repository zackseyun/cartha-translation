base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
translation:
  language: fr
  text: Tenant compte du fait qu’il a toujours combattu à nos côtés comme un père pour ses fils[a], ainsi que de la bienveillance ferme qu’ils témoignent, en amis, envers nous et nos ancêtres, nous les avons, à juste titre, entièrement dégagés de toute accusation, quelle qu’elle soit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a toujours été notre allié, comme un père qui combat pour ses fils ». Le participe grec peut évoquer le combat mené aux côtés de quelqu’un ou, plus largement, l’aide apportée par un allié.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque finale est très insistante ; littéralement, elle accumule les idées de totalité, de cause et de manière. La traduction en donne le sens juridique global : ils sont complètement dégagés de toute accusation possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς πατέρα ὑπὲρ υἱῶν
  choice: comme un père pour ses fils
  rationale: ὡς introduit ici une comparaison, tandis que ὑπέρ exprime l’action en faveur de quelqu’un. Le possessif « ses » est naturellement impliqué par l’image paternelle.
- source_word: διὰ παντὸς συμμαχοῦντα
  choice: a toujours combattu à nos côtés
  rationale: διὰ παντός marque la continuité, et συμμαχέω désigne le fait de combattre avec quelqu’un ou, plus largement, de lui prêter assistance comme allié. Le choix retient la nuance militaire sans exclure l’idée d’alliance.
- source_word: τήν ... βεβαίαν ... εὔνοιαν
  choice: la bienveillance constante
  rationale: εὔνοια désigne une disposition favorable ou bienveillante; βεβαίαν en souligne la fermeté et la stabilité. « Constante » est naturel en français et convient au contexte relationnel.
- source_word: τοῦ φίλου
  choice: en amis
  rationale: Le génitif condensé caractérise vraisemblablement la bienveillance comme celle d’un ami. Le pluriel s’accorde naturellement avec le sujet « ils » tout en conservant la valeur relationnelle de l’expression grecque.
- source_word: ἣν ἔχουσιν ... πρὸς ἡμᾶς καὶ τοὺς προγόνους ἡμῶν
  choice: qu’ils témoignent ... envers nous et nos ancêtres
  rationale: ἔχειν εὔνοιαν πρός signifie avoir ou nourrir de la bienveillance envers quelqu’un. « Témoigner de la bienveillance envers » rend cette relation idiomatiquement en français.
- source_word: ἀναλογιζόμενοι
  choice: Considérant ... et prenant en compte
  rationale: Le participe indique que ces éléments fondent la décision. La variation française évite une répétition lourde tout en gardant la nuance de réflexion délibérée.
- source_word: δικαίως
  choice: à juste titre
  rationale: L’adverbe indique que la décision est tenue pour juste ou fondée. « À juste titre » est clair et idiomatique.
- source_word: ἀπολελύκαμεν
  choice: nous les avons ... dégagés
  rationale: Le parfait exprime une décision accomplie dont l’effet demeure. Dans ce contexte juridique, « dégager de toute accusation » traduit une libération ou décharge complète sans imposer le sens technique plus étroit d’un acquittement judiciaire.
- source_word: πάσης καθʼ ὁντινοῦν αἰτίας τρόπον
  choice: entièrement dégagés de toute accusation, quelle qu’elle soit
  rationale: L’expression grecque est fortement cumulative et insiste sur l’exhaustivité. Cette formulation française transmet la décharge complète de tout motif possible d’accusation sans reproduire maladroitement l’empilement syntaxique grec.
