theological_decisions:
- issue: Identité implicite du libérateur
  choice: Conserver la désignation «celui qui délivre Israël» sans expliciter «Dieu» ou «le Seigneur».
  alternative: «Béni soit Dieu, le libérateur d’Israël» ou «Béni soit le Seigneur, qui délivre Israël».
  rationale: Le contexte peut identifier le référent, mais le verset grec ne contient ici aucun nom divin; l’ajouter résoudrait une ellipse que le texte laisse implicite.
