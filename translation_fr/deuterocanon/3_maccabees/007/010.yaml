base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
translation:
  language: fr
  text: Après avoir reçu cette lettre, ils ne s’empressèrent pas de partir immédiatement[a]. Ils demandèrent plutôt au roi que les membres du peuple juif qui avaient délibérément transgressé la loi du saint Dieu reçoivent par leur intermédiaire[b] le châtiment qui leur était dû.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de reprendre immédiatement le chemin du retour ». Le mot grec peut désigner le départ ou le retour, selon le point de vue adopté.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « subissent de leurs mains le châtiment qui leur était dû ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  choice: Après avoir reçu cette lettre
  rationale: Le participe aoriste exprime une circonstance antérieure à l’action principale. « Après avoir reçu » restitue naturellement cette relation temporelle; δέ marque ici une transition légère qu’il n’est pas nécessaire de rendre séparément.
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  choice: ils ne s’empressèrent pas de partir immédiatement
  rationale: σπουδάζω exprime l’empressement ou la hâte, tandis que εὐθέως indique l’immédiateté. Dans le contexte, ἄφοδος désigne l’action de quitter les lieux, tout en pouvant être envisagée comme un retour; cette autre nuance est signalée en note.
- source_word: προσηξίωσαν τὸν βασιλέα
  choice: Ils demandèrent plutôt au roi
  rationale: Le verbe exprime ici une requête adressée au roi. « Demandèrent » est naturel et suffisamment soutenu; « plutôt » rend le contraste introduit par ἀλλά.
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  choice: les membres du peuple juif
  rationale: γένος désigne ici un groupe d’origine ou d’appartenance. « Peuple juif » rend clairement la dimension collective et ethnique sans employer le français moderne potentiellement trompeur « race juive ».
- source_word: τὸν ἅγιον θεὸν
  choice: le Dieu saint
  rationale: L’adjectif qualifie Dieu dans cette construction. L’ordre « le Dieu saint » est naturel en français et conserve la valeur descriptive de l’expression.
- source_word: αὐθαιρέτως παραβεβηκότας
  choice: qui avaient délibérément transgressé
  rationale: αὐθαιρέτως souligne le caractère volontaire de l’acte, et le participe parfait παραβεβηκότας une transgression accomplie qui demeure pertinente. « Délibérément transgressé » conserve la portée morale et juridique.
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  choice: reçoivent par leur intermédiaire le châtiment qui leur était dû
  rationale: τυγχάνω avec le génitif signifie ici recevoir ou subir; διά avec le génitif du pronom a une valeur instrumentale. La formulation française conserve cette médiation sans préciser davantage l’identité référentielle du pronom.
theological_decisions:
- issue: Rapport entre « le Dieu saint » et sa loi
  choice: Présenter les personnes visées comme des membres du peuple juif ayant volontairement transgressé la loi du Dieu saint.
  alternative: Reformuler en termes explicites d’apostasie ou développer l’identité de Dieu.
  rationale: Le grec condamne une violation volontaire de la loi au sein du peuple juif, mais ne formule pas ici une doctrine plus développée. La traduction conserve donc l’affirmation du texte sans l’élargir.
- issue: Référent de διʼ αὐτῶν (« par leur intermédiaire »)
  choice: Maintenir le pronom sans en expliciter le référent.
  alternative: Traduire « de leurs mains » ou nommer explicitement le groupe chargé du châtiment.
  rationale: Le grec emploie un pronom dont le référent dépend du contexte narratif. L’expliciter dans le corps du texte résoudrait une ambiguïté que le verset lui-même laisse subsister.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. La syntaxe a été légèrement restructurée en deux phrases pour rester claire. Tous les marqueurs de note figurent dans le texte principal.
