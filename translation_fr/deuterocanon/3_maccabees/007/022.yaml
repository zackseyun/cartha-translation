  yaml_path: translation/deuterocanon/3_maccabees/007/022.yaml
  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
translation:
  language: fr
  text: Tous recouvrèrent tous leurs biens d’après le registre officiel[a], de sorte que ceux qui détenaient quoi que ce soit le leur rendirent avec la plus grande crainte, car le grand Dieu avait pleinement accompli de grandes choses pour leur délivrance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’après l’inventaire » ou « d’après le relevé officiel » ; le grec peut désigner un enregistrement administratif de personnes ou de biens.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour leur salut ». Le terme grec peut désigner aussi bien un sauvetage concret que le salut dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἑαυτῶν πάντες ἐκομίσαντο
  choice: Ils récupérèrent tous la totalité de leurs biens
  rationale: Le moyen ἐκομίσαντο exprime ici le fait de reprendre ou de recevoir ce qui leur appartenait. La formulation conserve l’insistance conjointe de πάντα et πάντες sans lourdeur excessive.
- source_word: ἐξ ἀπογραφῆς
  choice: d’après le registre
  rationale: ἀπογραφή désigne un relevé administratif de personnes ou de biens. « D’après le registre » rend vraisemblablement l’idée que la restitution s’effectue sur la base du relevé officiel, tout en laissant ouvertes les nuances d’inventaire et d’enregistrement.
- source_word: τοὺς ἔχοντάς τι
  choice: ceux qui en détenaient une partie
  rationale: Le pronom τι a une portée indéfinie et renvoie à une part quelconque des biens mentionnés. « Détenaient » convient à une possession qui ne leur appartenait pas nécessairement.
- source_word: μετὰ φόβου μεγίστου
  choice: avec la plus grande crainte
  rationale: Cette traduction garde la force du superlatif μεγίστου et le sens direct de φόβος, qui évoque ici davantage la peur que le simple respect.
- source_word: ἀποδοῦναι αὐτοῖς
  choice: la leur rendirent
  rationale: ἀποδίδωμι exprime la restitution de ce qui appartenait aux destinataires. Le singulier « la » reprend naturellement « une partie » en français.
- source_word: τὰ μεγαλεῖα
  choice: des actes puissants
  rationale: Le substantif désigne les grandes manifestations ou actions de Dieu. « Actes puissants » conserve la grandeur et la dimension divine sans imposer le sens plus précis de « miracles ».
- source_word: ποιήσαντος τελέως
  choice: avait pleinement accompli
  rationale: Le génitif absolu présente l’action divine comme la cause ou le fondement de la restitution, tandis que τελέως en souligne le caractère complet et effectif.
- source_word: ἐπὶ σωτηρίᾳ αὐτῶν
  choice: pour leur délivrance
  rationale: Dans ce contexte narratif de sauvetage concret et de rétablissement, « délivrance » rend le sens immédiat de σωτηρία tout en conservant sa portée théologique.
theological_decisions:
- issue: Sens de σωτηρία dans un récit de sauvetage historique
  choice: délivrance
  alternative: salut
  rationale: Le contexte met au premier plan l’intervention concrète de Dieu en faveur du peuple. « Salut » demeure possible et plus large théologiquement, mais risquerait ici d’orienter le lecteur vers une notion doctrinale plus générale que ne l’exige le récit.
- issue: Nature des μεγαλεῖα accomplis par Dieu
  choice: actes puissants
  alternative: prodiges
  rationale: Le grec célèbre la grandeur des actions divines sans les qualifier nécessairement de miracles au sens strict. La traduction retenue évite de préciser davantage que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase maintient l’insistance du grec sur la restitution complète, la forte crainte des détenteurs et l’action décisive de Dieu, sans archaïsmes ni précision confessionnelle ajoutée.
