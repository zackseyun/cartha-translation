revisions:
- from: 'Ils récupérèrent tous la totalité de leurs biens d’après le registre[a] : ceux qui en détenaient une partie la leur rendirent avec la plus grande crainte, car le grand Dieu avait pleinement accompli des actes puissants pour leur délivrance[b].'
  to: Tous recouvrèrent tous leurs biens d’après le registre officiel[a], de sorte que ceux qui détenaient quoi que ce soit le leur rendirent avec la plus grande crainte, car le grand Dieu avait pleinement accompli de grandes choses pour leur délivrance[b].
  rationale: La révision corrige la limitation injustifiée de τι à « une partie » et rend l’objet de la restitution plus clairement. Elle conserve l’ambiguïté administrative de ἀπογραφή, la force de φόβου μεγίστου, ainsi que le sens concret de σωτηρία dans ce contexte, sans exclure sa portée plus large en note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:39:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens général sont bien rendus : restitution intégrale des biens, crainte extrême des détenteurs, et action salvatrice de Dieu. Toutefois, « une partie » restreint indûment le τι grec, qui signifie « quoi que ce soit » / « quelque chose », sans impliquer une portion seulement. La formulation révisée conserve cette indétermination.'
  naturalness: Le français est globalement clair et de registre approprié. « Tous récupérérèrent tous leurs biens » reproduit l’insistance grecque de façon plus nette que « Ils récupérèrent tous la totalité ». « Ce qu’ils détenaient » rend la restitution explicite et naturelle sans ajouter de précision.
  terminology: « Registre officiel » convient à ἀπογραφή tout en évitant de trancher entre inventaire, enregistrement et relevé administratif. « Délivrance » convient au sens narratif de σωτηρία; la note préserve l’alternative « salut ». « Grandes choses » est une expression française idiomatique et suffisamment ample pour τὰ μεγαλεῖα.
  issues:
  - severity: medium
    issue: « ceux qui en détenaient une partie » restreint le sens de τοὺς ἔχοντάς τι.
    rationale: Le pronom indéfini τι ne désigne pas nécessairement « une partie » des biens, mais toute chose ou tout bien détenu. Cette restriction peut exclure à tort celui qui détenait l’ensemble d’un bien.
  - severity: low
    issue: « la leur rendirent » dépend d’un antécédent féminin singulier (« une partie ») qui n’est pas imposé par le grec.
    rationale: Une fois la restriction « une partie » supprimée, il est préférable d’expliciter l’objet restitué par « ce qu’ils détenaient ».
  revised_text: Tous recouvrèrent tous leurs biens d’après le registre officiel[a], de sorte que ceux qui détenaient quoi que ce soit le leur rendirent avec la plus grande crainte, car le grand Dieu avait pleinement accompli de grandes choses pour leur délivrance[b].
