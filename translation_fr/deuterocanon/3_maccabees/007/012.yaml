base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/012.yaml
  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
translation:
  language: fr
  text: Après avoir reconnu qu’ils disaient vrai et les avoir encouragés, il leur accorda pleine autorisation afin qu’ils puissent anéantir ceux qui avaient transgressé la loi de Dieu, dans tous les lieux relevant de son royaume, avec hardiesse[a], sans aucune autorité ni surveillance royale[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec assurance », « librement » ou « ouvertement ».
    reason: Le grec μετὰ παρρησίας peut exprimer la hardiesse, l’assurance, la franchise ouverte ou la liberté d’action.
  - marker: b
    text: 'La fin de la phrase peut aussi se comprendre ainsi : « sans aucune autorisation ni inspection royale », ce qui souligne l’absence de participation directe du pouvoir royal à l’exécution de cette mesure.'
    reason: ἐξουσία peut désigner l’autorité ou l’autorisation, et ἐπίσκεψις la surveillance ou l’inspection.
lexical_decisions:
- source_word: τἀληθὲς αὐτοὺς λέγειν
  choice: qu’ils disaient vrai
  rationale: L’adjectif neutre substantivé τἀληθές, complément de λέγειν, désigne ici le fait de dire la vérité. La tournure française « dire vrai » est naturelle et fidèle.
- source_word: παραδεξάμενος
  choice: après avoir admis
  rationale: Le participe indique que le roi reconnaît leur déclaration comme véridique. « Admettre » conserve cette idée sans suggérer une simple réception matérielle.
- source_word: παραινέσας
  choice: les avoir exhortés
  rationale: Le verbe peut signifier conseiller, encourager ou exhorter. Dans ce contexte, « exhorter » exprime l’incitation active qui précède l’autorisation, sans préciser davantage son contenu.
- source_word: ἄδειαν πάντων
  choice: une entière liberté
  rationale: ἄδεια désigne la liberté ou la permission, et πάντων en souligne l’étendue. Cette formulation rend le caractère complet de l’autorisation tout en restant idiomatique.
- source_word: τοὺς παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: ceux qui avaient transgressé la loi de Dieu
  rationale: Le participe parfait décrit des personnes ayant enfreint la loi et demeurant caractérisées par cette transgression. Le plus-que-parfait français en conserve la valeur antérieure.
- source_word: ἐξολεθρεύσωσιν
  choice: anéantir
  rationale: Le verbe exprime une destruction complète. « Anéantir » en maintient la force sans remplacer l’action par un terme atténué tel que « punir ».
- source_word: κατὰ πάντα τὸν ὑπὸ τῆς βασιλείας αὐτοῦ τόπον
  choice: partout dans le territoire soumis à son royaume
  rationale: La formulation restitue l’étendue distributive de l’action dans tout l’espace relevant du royaume, dans un français plus naturel qu’un calque de « chaque lieu ».
- source_word: μετὰ παρρησίας
  choice: avec assurance
  rationale: παρρησία peut désigner l’assurance, la hardiesse ou la liberté ouverte d’agir. « Avec assurance » préserve cette nuance sans imposer l’idée d’une action nécessairement publique.
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  choice: sans aucune autorité ni surveillance royale
  rationale: La traduction suit directement les deux noms grecs, tout en conservant l’ambiguïté entre l’absence d’autorité royale exercée et l’absence d’autorisation royale particulière.
theological_decisions:
- issue: Présentation morale et théologique de la violence envers les transgresseurs
  choice: Conserver l’affirmation directe selon laquelle ils reçoivent la liberté d’anéantir ceux qui ont transgressé la loi de Dieu.
  alternative: Atténuer l’action par « punir », « écarter » ou une autre paraphrase.
  rationale: Le grec emploie le verbe fort ἐξολεθρεύω. La traduction ne doit ni adoucir la violence du passage ni lui ajouter une justification théologique absente du texte.
- issue: Tension entre l’autorisation donnée par le roi et l’absence finale d’autorité royale
  choice: Maintenir la formulation littérale et signaler son autre compréhension possible en note.
  alternative: Résoudre la tension en traduisant explicitement « sans intervention ni supervision du roi ».
  rationale: Le rapport exact entre l’autorisation générale donnée au début et l’expression finale demeure susceptible de plusieurs lectures. Il convient de ne pas trancher silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe participiale grecque est rendue par « Après avoir… », et le vocabulaire conserve la gravité juridique et violente du passage sans ajout confessionnel.
