  to: Après avoir reconnu qu’ils disaient vrai et les avoir encouragés, il leur accorda pleine autorisation afin qu’ils puissent anéantir ceux qui avaient transgressé la loi de Dieu, dans tous les lieux relevant de son royaume, avec hardiesse[a], sans aucune autorité ni surveillance royale[b].
  rationale: La révision ne modifie pas le sens du passage. Elle privilégie des équivalents français modernes qui rendent plus précisément l’autorisation officielle (ἄδεια πάντων), l’encouragement (παραινέσας) et l’étendue distributive de l’action. La tension textuelle entre la permission initialement accordée et l’absence finale d’autorité ou de surveillance royale est maintenue, sans harmonisation doctrinale ou interprétative.
