review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’insistance de αὐτοὶ τε, l’imparfait itératif des deux verbes et la portée exemplaire/publicitaire possible de μετὰ παραδειγματισμῶν. Toutefois, « qui leur tombait sous la main » suggère une capture ou une domination qui n’est pas explicitement exprimée par ἐμπεσόντα, lequel évoque plus sobrement la rencontre fortuite. De plus, « qui faisait partie des souillés » transforme le génitif τῶν μεμιαμμένων en identification directe du compatriote aux « souillés », alors que le grec le présente comme leur ὁμοεθνής (« compatriote des gens souillés »).
  naturalness: La phrase est globalement fluide et de registre approprié. « Tout compatriote des gens souillés qu’ils rencontraient en chemin » est plus naturel que le tour initial tout en restant proche de la syntaxe et de l’ambiguïté relationnelle du grec.
  terminology: « Souillés » préserve utilement l’ambivalence rituelle et morale de μεμιαμμένων. « Mettre à mort » convient à ἀναιρέω dans ce contexte. « Pour servir d’exemple » est une restitution idiomatique prudente de παραδειγματισμοί; la note conserve les nuances de châtiment exemplaire, d’avertissement public et de déshonneur.
  issues:
  - severity: medium
    issue: Surinterprétation de ἐμπεσόντα
    rationale: « Leur tombait sous la main » peut évoquer le fait de tomber à leur pouvoir. Le participe peut désigner quelqu’un qu’ils rencontrent ou sur qui ils tombent en chemin, sans préciser une capture.
  - severity: medium
    issue: Rapport grammatical de τῶν μεμιαμμένων et ὁμοεθνῆ
    rationale: « Faisait partie des souillés » assimile directement le compatriote au groupe des souillés. Le grec dit plus littéralement un compatriote des personnes souillées; la relation exacte doit demeurer non surinterprétée.
