  text: They themselves also killed along the road any compatriot of the defiled people who had fallen in with them[a], and they did away with them as examples.
translation:
  language: fr
  text: Eux aussi tuaient, en chemin, tout compatriote des gens souillés qu’ils rencontraient ; ils le mettaient à mort pour servir d’exemple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en leur infligeant des châtiments exemplaires » ou « en les exposant publiquement à la honte ». L’expression grecque peut souligner l’avertissement public ou le déshonneur associé à leur mise à mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ τε
  choice: Eux-mêmes aussi
  rationale: Cette formulation conserve à la fois l’insistance portée par αὐτοί et la valeur connective de τε.
- source_word: τὸν ἐμπεσόντα
  choice: qui leur tombait sous la main
  rationale: Dans ce contexte de rencontre en chemin suivie d’une mise à mort, l’expression rend naturellement l’idée de quelqu’un qui tombe entre leurs mains, sans faire de cette nuance une certitude absolue.
- source_word: τῶν μεμιαμμένων ὁμοεθνῆ
  choice: tout compatriote qui faisait partie des souillés
  rationale: Le singulier grec a une valeur distributive. Le génitif est compris comme partitif, tandis que « souillés » garde la possible portée rituelle ou morale de μεμιαμμένων.
- source_word: κατὰ τὴν ὁδὸν
  choice: en chemin
  rationale: Expression française naturelle qui conserve le cadre du déplacement indiqué par le grec.
- source_word: ἀπέκτεννον
  choice: tuaient
  rationale: L’imparfait français reflète l’imparfait grec et suggère une action répétée.
- source_word: μετὰ παραδειγματισμῶν
  choice: pour servir d’exemple
  rationale: Cette expression restitue la fonction d’avertissement public du terme, tout en signalant en note ses nuances possibles de châtiment exemplaire et de déshonneur public.
- source_word: ἀνήρουν
  choice: mettaient à mort
  rationale: Le verbe a ici un sens létal. La formulation garde la reprise expressive du grec après « tuaient », plutôt que de l’effacer.
