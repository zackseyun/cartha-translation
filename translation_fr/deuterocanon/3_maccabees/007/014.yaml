revisions:
- from: Eux-mêmes aussi tuaient, en chemin, tout compatriote qui faisait partie des souillés et qui leur tombait sous la main ; ils le mettaient à mort pour servir d’exemple.[a]
  to: Eux aussi tuaient, en chemin, tout compatriote des gens souillés qu’ils rencontraient ; ils le mettaient à mort pour servir d’exemple.[a]
  rationale: La révision remplace l’expression qui impliquait potentiellement une mise à leur pouvoir par « qu’ils rencontraient » et reformule le lien entre le compatriote et les « souillés » de manière plus fidèle à la construction grecque. Elle conserve le singulier distributif, les imparfaits répétés, la tonalité moderne et la note lexicale existante.
