  text: asserting that our affairs would never be secure because of the hostility these people have toward the nations[a], until this is accomplished.
translation:
  language: fr
  text: affirmant que nos affaires ne seraient jamais stables, à cause de l’hostilité que ces gens nourrissent envers les nations[a], jusqu’à ce que cela soit accompli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les non-Juifs ». Le grec peut désigner « les nations », « les peuples » ou, dans l’usage juif, « les non-Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προφερόμενοι
  choice: affirmant
  rationale: Le participe introduit l’argument avancé publiquement. « Affirmant » est naturel et n’implique pas à lui seul que l’accusation soit mensongère.
- source_word: μηδέποτε
  choice: jamais
  rationale: Rend directement la négation absolue du grec.
- source_word: εὐσταθήσειν
  choice: ne connaîtraient jamais la stabilité
  rationale: Le verbe exprime ici la stabilité ou la fermeté de la situation collective. Cette tournure française convient à « nos affaires » sans réduire le sens à la seule sécurité.
- source_word: τὰ πράγματα ἡμῶν
  choice: nos affaires
  rationale: L’expression vise la situation et les intérêts publics de la communauté ou du royaume, et non de simples choses particulières.
- source_word: διʼ ἣν ἔχουσιν οὗτοι πρὸς τὰ ἔθνη δυσμένειαν
  choice: à cause de l’hostilité que ces gens nourrissent envers les nations
  rationale: « Hostilité » rend δυσμένεια, tandis que « nourrissent envers » restitue idiomatiquement ἔχουσιν… πρὸς. « Ces gens » conserve la valeur démonstrative sans ajouter de précision absente du grec.
- source_word: μέχρι ἂν συντελεσθῇ τοῦτο
  choice: jusqu’à ce que cela soit mené à bien
  rationale: La formule exprime l’achèvement de ce qui vient d’être proposé, tout en maintenant l’imprécision du démonstratif τοῦτο.
theological_decisions:
- issue: Sens de τὰ ἔθνη
  choice: les nations
  alternative: les non-Juifs / les peuples
  rationale: « Les nations » reste proche du grec et préserve sa portée collective. Dans l’usage juif hellénistique, l’expression peut aussi désigner spécifiquement les non-Juifs; cette possibilité est signalée en note sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure un fragment syntaxiquement rattaché au contexte précédent, comme dans la source. Le démonstratif final reste volontairement indéterminé.
