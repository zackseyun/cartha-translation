  yaml_path: translation/deuterocanon/3_maccabees/007/017.yaml
  text: When they arrived at Ptolemais[a], which is called Rose-bearing because of the nature of the place, where the fleet waited for them for seven days by their common decision,
translation:
  language: fr
  text: Lorsqu’ils arrivèrent à Ptolémaïs, appelée « la Porteuse de roses »[a] en raison de la particularité du lieu, la flotte les y attendit pendant sept jours, selon leur décision commune,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui porte des roses » ou « porteuse de roses ». Le grec ῥοδοφόρον est un surnom descriptif de Ptolémaïs, lié à la particularité du lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενηθέντες
  choice: Lorsqu’ils arrivèrent
  rationale: Le participe aoriste introduit ici la circonstance temporelle de l’action principale ; cette tournure est naturelle en français tout en conservant sa valeur.
- source_word: Πτολεμαΐδα
  choice: Ptolémaïs
  rationale: Translittération française traditionnelle du nom de lieu grec.
- source_word: τὴν ὀνομαζομένην
  choice: appelée
  rationale: Rend simplement la désignation attribuée à la ville.
- source_word: διὰ τὴν τοῦ τόπου ἰδιότητα
  choice: en raison de la particularité du lieu
  rationale: ἰδιότης désigne la qualité propre ou distinctive du lieu, sans préciser davantage sa nature.
- source_word: ῥοδοφόρον
  choice: Porte-Roses
  rationale: L’adjectif composé signifie littéralement « qui porte des roses » et fonctionne comme un surnom descriptif de Ptolémaïs.
- source_word: ἐν ᾗ
  choice: y
  rationale: Le relatif locatif renvoie à Ptolémaïs ; « y » évite en français une relative lourde ou ambiguë.
- source_word: προσέμεινεν αὐτοὺς
  choice: les y attendit
  rationale: Avec αὐτούς comme complément, προσμένω exprime ici l’idée de rester sur place dans l’attente de quelqu’un.
- source_word: ὁ στόλος
  choice: la flotte
  rationale: Dans ce contexte maritime, στόλος désigne l’ensemble des navires.
- source_word: κατὰ κοινὴν αὐτῶν βουλήν
  choice: selon leur décision commune
  rationale: La formule exprime une résolution ou un projet arrêté en commun ; le possessif demeure référentiellement ambigu comme en grec.
- source_word: ἡμέρας ἑπτά
  choice: pendant sept jours
  rationale: L’accusatif marque la durée.
