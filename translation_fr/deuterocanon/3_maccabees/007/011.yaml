  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le participe introduit une déclaration, les personnes visées ont transgressé les prescriptions divines « à cause du ventre », et la négation porte sur elles ainsi que sur les prescriptions royales. Toutefois, « pour satisfaire leur ventre » est peu idiomatique et explicite davantage que le grec l’image du ventre ; « par appétit » est plus naturel tout en étant expliqué par une note littérale. « Être favorable à » rend plus naturellement εὐνοεῖν avec les deux datifs, y compris les décrets.'
  naturalness: La phrase révisée est fluide en français international moderne. « Ne seraient jamais favorables ni à … ni aux décrets du roi » permet de conserver la construction compacte et un peu inhabituelle du grec sans produire la collocation moins naturelle « témoigner de bienveillance aux décrets ».
  terminology: « Prescriptions divines » rend avec sobriété τὰ θεῖα προστάγματα ; « décrets du roi » convient à τοῖς τοῦ βασιλέως προστάγμασιν. La note conserve explicitement l’image concrète du « ventre » et l’ambiguïté signalée dans la piste d’audit anglaise.
  issues:
  - severity: low
    issue: « pour satisfaire leur ventre »
    rationale: Cette expression est moins naturelle en français et présente l’action comme le fait de rassasier le ventre. Le grec dit littéralement « à cause du ventre », c’est-à-dire sous l’effet de l’appétit ; « par appétit » rend ce sens sans ajouter l’idée de satisfaction.
  - severity: low
    issue: « témoigner de bienveillance … aux décrets »
    rationale: Bien que défendable comme calque du datif grec, cette association est raide en français. « Être favorable à des décrets » est idiomatique et conserve la possibilité d’une disposition favorable envers eux.
