  text: declaring that they should never show favor either to those who[a], for the sake of their belly, had transgressed the divine commandments[b], or to the king’s decrees.
translation:
  language: fr
  text: déclarant qu’ils ne seraient jamais favorables ni à ceux qui, par appétit[a], avaient transgressé les prescriptions divines, ni aux décrets du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause du ventre ». L’expression peut aussi se comprendre comme « pour satisfaire leur appétit » ou « pour de la nourriture ».'
    reason: lexical_alternative
  - marker: b
    text: La fin de la phrase grecque est très condensée. Elle peut aussi être comprise comme visant des personnes qui se conformaient aux décrets du roi, plutôt que les décrets eux-mêmes.
    reason: alternative_reading
lexical_decisions:
- source_word: προφερόμενοι
  choice: déclarant
  rationale: Le participe introduit ici la teneur d’une prise de position exprimée publiquement; « déclarant » convient au contexte formel sans ajouter une nuance absente du grec.
- source_word: τοὺς γαστρὸς ἕνεκεν
  choice: ceux qui, pour satisfaire leur ventre
  rationale: La formulation conserve l’image concrète du « ventre » tout en rendant naturellement en français l’idée d’agir sous l’impulsion de l’appétit corporel.
- source_word: τὰ θεῖα παραβεβηκότας προστάγματα
  choice: avaient transgressé les commandements divins
  rationale: παραβαίνω exprime la transgression ou la violation, tandis que θεῖα προστάγματα désigne des prescriptions tenues pour divines. « Commandements divins » garde la solennité de l’expression.
- source_word: μηδέποτε εὐνοήσειν
  choice: ne témoigneraient jamais de bienveillance
  rationale: εὐνοέω désigne une disposition favorable envers quelqu’un ou quelque chose. Cette tournure française reste assez large pour s’appliquer aux deux compléments transmis par le texte grec.
- source_word: μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: ni aux décrets du roi
  rationale: Le datif est conservé comme second complément de l’idée de bienveillance. « Décrets » convient à des prescriptions royales, tout en laissant apparaître la construction inhabituelle du grec.
theological_decisions:
- issue: Référent et portée de μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: 'La proposition est rendue comme un second complément de « témoigner de la bienveillance » : ni envers les transgresseurs, ni envers les décrets royaux.'
  alternative: Le membre final pourrait viser les personnes qui se conformaient aux décrets du roi plutôt que les décrets eux-mêmes.
  rationale: Le texte grec transmis est condensé et sa coordination est maladroite. La traduction suit directement les datifs présents sans introduire dans le corps du verset un groupe de personnes qui n’y est pas explicitement exprimé; une note signale toutefois l’autre compréhension possible.
translation_notes:
  register: Français international moderne, digne et lisible. L’image du ventre est conservée, mais intégrée dans une tournure idiomatique. La construction inhabituelle du dernier membre demeure perceptible et son ambiguïté est explicitée en note.
