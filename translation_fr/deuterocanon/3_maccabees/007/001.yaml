  source_fidelity: La formule d’en-tête et les destinataires sont globalement bien rendus. Toutefois, « de toute l’Égypte » explicite et renforce indûment la possible valeur distributive de κατʼ Αἴγυπτον ; le grec désigne plus sobrement les stratèges situés ou exerçant en Égypte. « Généraux d’Égypte » conserve le titre militaire sans imposer une fonction de gouvernement territorial.
  naturalness: Le français est clair et convient à un acte officiel. « Généraux d’Égypte » est plus direct et moins interprétatif que « gouverneurs militaires de toute l’Égypte ».
