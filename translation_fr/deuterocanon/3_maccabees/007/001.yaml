  yaml_path: translation/deuterocanon/3_maccabees/007/001.yaml
  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
translation:
  language: fr
  text: 'Le roi Ptolémée Philopator, aux généraux d’Égypte et à tous ceux qui sont chargés des affaires : salut et bonne santé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se réjouir et être en bonne santé » ; dans une lettre grecque, il s’agit d’une formule conventionnelle de salutation et de vœu de bien-être.'
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς
  choice: Le roi
  rationale: Le nom sans article sert de titre royal dans l’en-tête de la lettre ; en français, l’article défini est naturel.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Ptolémée Philopator
  rationale: Le nom et l’épithète sont translittérés selon leur forme française usuelle, sans traduire l’épithète.
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  choice: aux gouverneurs militaires de toute l’Égypte
  rationale: Dans l’Égypte ptolémaïque, στρατηγοί peut désigner des responsables à la fois militaires et administratifs. « Gouverneurs militaires » rend cette fonction, tandis que « de toute l’Égypte » exprime la nuance distributive possible de κατʼ Αἴγυπτον.
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  choice: à tous ceux qui sont chargés des affaires
  rationale: Le participe τεταγμένοις indique des personnes établies ou affectées à une responsabilité ; cette formulation conserve le caractère administratif général de πράγματα sans le préciser indûment.
- source_word: χαίρειν καὶ ἐρρῶσθαι
  choice: salut et bonne santé
  rationale: Il s’agit d’une formule épistolaire conventionnelle associant salutation et vœu de bien-être ; une traduction idiomatique convient mieux que les infinitifs littéraux « se réjouir et être fort ».
theological_decisions: []
translation_notes:
  register: Style officiel et épistolaire, dans un français moderne et digne. « Gouverneurs militaires » évite de réduire στρατηγοί au seul grade moderne de général tout en conservant sa dimension militaire.
