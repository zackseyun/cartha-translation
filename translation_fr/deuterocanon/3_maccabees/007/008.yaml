  yaml_path: translation/deuterocanon/3_maccabees/007/008.yaml
  text: And we have ordered each and every one to return to his own home[a], with absolutely no one in any way harming them[b], nor insulting them over the things that happened contrary to reason.
translation:
  language: fr
  text: Nous avons aussi ordonné à chacun de les faire tous rentrer chez eux[a], sans que personne leur cause le moindre tort, de quelque manière que ce soit, ni ne leur fasse de reproches au sujet de ce qui s’est produit de façon déraisonnable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les faire retourner dans leurs propres lieux » ou « les faire retourner vers ce qui leur appartient ». Le grec εἰς τὰ ἴδια peut désigner le domicile, le lieu propre ou les biens propres.
    reason: lexical_alternative
  - marker: b
    text: Ou « contre toute raison ». La locution grecque qualifie ce qui s’est produit comme déraisonnable, sans préciser davantage.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: nous avons ordonné
  rationale: Le parfait exprime un ordre déjà donné et toujours en vigueur; « ordonné » conserve la force officielle du verbe.
- source_word: ἑκάστῳ πάντας … ἐπιστρέφειν
  choice: à chacun de les faire tous retourner
  rationale: ἑκάστῳ est le destinataire au datif de l’ordre, tandis que πάντας est naturellement le complément de l’infinitif transitif ἐπιστρέφειν. Cette analyse évite de fondre à tort les deux termes en un simple « chacun ».
- source_word: εἰς τὰ ἴδια
  choice: chez eux
  rationale: L’expression désigne ce qui appartient en propre à quelqu’un et, dans ce contexte de retour, très probablement son domicile ou son lieu d’origine; la note maintient l’étendue lexicale.
- source_word: ἐν παντὶ τρόπῳ
  choice: de quelque manière que ce soit
  rationale: Cette tournure idiomatique exprime une interdiction sans exception quant à la manière.
- source_word: μηθενὸς αὐτοὺς τὸ σύνολον καταβλάπτοντος
  choice: sans que personne ne leur cause le moindre tort
  rationale: Le génitif absolu pose une interdiction générale; τὸ σύνολον renforce la négation, rendue naturellement par « le moindre ».
- source_word: μήτε ὀνειδίζοντος
  choice: ni ne leur adresse de reproches
  rationale: ὀνειδίζω peut signifier reprocher, couvrir de reproches ou insulter. Le choix retenu convient au fait de leur imputer les événements passés sans suraccentuer l’injure verbale.
- source_word: περὶ τῶν γεγενημένων παρὰ λόγον
  choice: au sujet de ce qui s’est produit contre toute raison
  rationale: Le parfait renvoie aux événements accomplis encore présents à l’esprit; « contre toute raison » conserve le jugement porté par παρὰ λόγον sans en préciser abusivement la cause.
