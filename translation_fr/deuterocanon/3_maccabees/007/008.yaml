  source_fidelity: La structure grecque distingue ἑκάστῳ (« à chacun »), destinataire de l’ordre, et πάντας (« tous »), complément de l’infinitif ἐπιστρέφειν, pris ici au sens transitif de « faire revenir/rentrer ». Le projet conserve cette distinction, contrairement à la piste anglaise qui la neutralise, mais sa formulation française actuelle est pesante. La finale παρὰ λόγον qualifie ce qui s’est produit comme déraisonnable; « de façon déraisonnable » le rend sans imposer une explication des événements.
  naturalness: « À chacun de les faire tous retourner chez eux » est compréhensible, mais peu idiomatique en français moderne. « À chacun de les faire tous rentrer chez eux » est plus naturel tout en gardant les deux groupes distincts. La coordination négative est également rendue plus fluide par « ni ne leur fasse de reproches ».
  terminology: « Ordonner », « le moindre tort » et « faire des reproches » conviennent au registre administratif et à ὀνειδίζοντος. « Chez eux » est une contextualisation raisonnable de εἰς τὰ ἴδια; la note conserve l’alternative plus large. Aucun terme théologique n’est en cause.
