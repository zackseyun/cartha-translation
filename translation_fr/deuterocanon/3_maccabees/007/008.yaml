    rationale: La séquence « à chacun de les faire tous retourner » reproduit utilement la distinction grammaticale grecque, mais « faire tous rentrer » est l’expression française plus idiomatique pour ordonner le retour de l’ensemble du groupe.
  - severity: low
    issue: Portée de παρὰ λόγον à expliciter dans la note
    rationale: La note actuelle est globalement juste, mais l’alternative « de manière déraisonnable » doit être présentée comme qualifiant la survenue des événements, non comme une précision doctrinale ou causale.
