base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/006.yaml
  text: But we[a], after threatening them more harshly on account of these things, in keeping with the clemency we have toward all people, scarcely granted them their lives, and, recognizing that the heavenly God had surely defended the Jews[b],
translation:
  language: fr
  text: Mais nous, après les avoir menacés plus sévèrement à cause de ces faits, leur avons à peine accordé la vie, conformément à la clémence dont nous faisons preuve envers tous les êtres humains ; et, ayant reconnu que le Dieu céleste[a] avait assurément défendu les Juifs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu du ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σκληρότερον διαπειλησάμενοι
  choice: après les avoir menacés plus sévèrement
  rationale: Le participe aoriste marque une action antérieure, tandis que le comparatif et le verbe composé expriment une menace accrue.
- source_word: ἐπὶ τούτοις
  choice: à cause de cela
  rationale: La préposition avec le datif renvoie ici aux faits précédemment évoqués et indique leur motif, non une comparaison.
- source_word: ἐπιείκειαν
  choice: clémence
  rationale: Dans ce contexte royal et judiciaire, « clémence » rend la modération ou l’indulgence exercée envers des personnes menacées de mort.
- source_word: μόγις τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: leur avons tout juste accordé la vie
  rationale: « Tout juste » conserve l’idée de concession difficile ou réticente, et « accordé la vie » reste proche de l’expression grecque tout en étant intelligible en français.
- source_word: ἐπουράνιον θεόν
  choice: le Dieu céleste
  rationale: Cette formulation conserve directement la valeur adjectivale de ἐπουράνιον et le registre élevé du passage.
- source_word: ἐγνωκότες
  choice: ayant reconnu
  rationale: Le participe parfait exprime une constatation désormais acquise à la suite des événements.
- source_word: ἀσφαλῶς ὑπερησπικότα
  choice: avait assurément défendu
  rationale: « Assurément » exprime ici la certitude ou le caractère manifeste de l’intervention, et le plus-que-parfait situe cette défense avant sa reconnaissance.
theological_decisions:
- issue: Traduction de ἐπουράνιον θεόν dans la lettre royale
  choice: le Dieu céleste
  alternative: le Dieu du ciel
  rationale: Le choix principal préserve la construction adjectivale du grec sans imposer une formule théologique différente ; l’autre traduction est idiomatique et possible.
- issue: Degré d’explicitation de τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: leur avons tout juste accordé la vie
  alternative: nous leur avons tout juste laissé la vie sauve
  rationale: Le texte principal reste proche de l’idiome grec. L’alternative est plus courante en français, mais explicite davantage l’idée d’épargner.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue phrase et sa finale suspendue sont conservées, puisque le verset se poursuit syntaxiquement. La tension rhétorique entre les menaces sévères et la clémence revendiquée n’est pas atténuée.
