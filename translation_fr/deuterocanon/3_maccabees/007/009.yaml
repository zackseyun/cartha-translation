base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: fr
  text: Sachez en effet que, si nous tramons quelque mauvais dessein contre eux ou les affligeons de quelque manière que ce soit, nous aurons contre nous, pour tirer vengeance de ces actes, non pas un homme, mais le Dieu Très-Haut, maître de toute puissance, à tous égards, inéluctablement et pour toujours. Portez-vous bien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκετε
  choice: Sachez-le
  rationale: Impératif présent rendu naturellement en français tout en conservant la force de l’avertissement.
- source_word: κακοτεχνήσωμεν πονηρόν
  choice: tramons quelque mauvais dessein
  rationale: Exprime l’idée de concevoir avec ruse une action malveillante, sans lourdeur littérale.
- source_word: ἐπιλυπήσωμεν αὐτοὺς τὸ σύνολον
  choice: si nous leur causons la moindre peine
  rationale: 'τὸ σύνολον intensifie ici la portée négative : leur causer une peine quelconque, même minime.'
- source_word: τὸν πάσης δεσπόζοντα δυνάμεως θεὸν ὕψιστον
  choice: le Dieu Très-Haut, souverain de toute puissance
  rationale: Conserve le titre divin et la souveraineté exprimée par δεσπόζοντα, avec une syntaxe française claire.
- source_word: ἐρρῶσθε
  choice: Portez-vous bien
  rationale: Formule épistolaire de clôture, plus idiomatique que « Adieu » ou « Salut » dans ce registre.
theological_decisions:
- issue: Dieu comme adversaire et vengeur
  choice: ce n’est pas un homme que nous aurons pour adversaire, mais le Dieu Très-Haut… qui vengera ces actes
  alternative: nous aurons contre nous, pour tirer vengeance de ces actes, non pas un homme, mais le Dieu Très-Haut
  rationale: Préserve l’opposition emphatique οὐκ ἄνθρωπον, ἀλλὰ… θεὸν et le rôle judiciaire de Dieu sans atténuer l’énoncé.
- issue: Portée de l’inéluctabilité
  choice: En toute circonstance, nous ne pourrons jamais lui échapper
  alternative: nous l’aurons inéluctablement contre nous en tout et pour toujours
  rationale: Le grec κατὰ πᾶν ἀφεύκτως διὰ παντός accumule des expressions dont l’articulation exacte est dense; la traduction garde à la fois l’universalité, l’impossibilité d’échapper et la durée.
translation_notes:
  register: Français moderne, digne et accessible. La longue période grecque est divisée en deux phrases pour rendre clairement l’avertissement, tout en maintenant son emphase et sa tension judiciaire.
