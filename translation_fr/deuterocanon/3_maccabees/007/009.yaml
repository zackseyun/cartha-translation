revisions:
- from: 'Sachez-le, en effet : si nous tramons quelque mauvais dessein contre ces gens, ou si nous leur causons la moindre peine, ce n’est pas un homme que nous aurons pour adversaire, mais le Dieu Très-Haut, souverain de toute puissance, qui vengera ces actes. En toute circonstance, nous ne pourrons jamais lui échapper. Portez-vous bien.'
  to: Sachez en effet que, si nous tramons quelque mauvais dessein contre eux ou les affligeons de quelque manière que ce soit, nous aurons contre nous, pour tirer vengeance de ces actes, non pas un homme, mais le Dieu Très-Haut, maître de toute puissance, à tous égards, inéluctablement et pour toujours. Portez-vous bien.
  rationale: 'Une correction est nécessaire afin de préserver la syntaxe et l’accent de l’avertissement grec : l’opposition « non pas un homme, mais le Dieu Très-Haut » dépend de « nous aurons contre nous », et la vengeance est le but de cette opposition. La formulation révisée rend également l’intensification de τὸ σύνολον et la triple insistance finale sans résoudre de manière excessive l’ordre dense des modifieurs grecs.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:39:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'La révision rétablit la structure centrale du grec : Dieu Très-Haut n’est pas seulement présenté comme celui « qui vengera », mais comme l’adversaire que les auteurs de l’injustice auront contre eux « pour tirer vengeance ». Elle conserve aussi les trois intensifs finaux : portée totale, caractère inéluctable et permanence.'
  naturalness: Le français proposé reste moderne et fluide, tout en gardant le ton solennel d’un avertissement officiel. « Les affligeons de quelque manière que ce soit » rend plus exactement l’adverbe grec que « la moindre peine ».
  terminology: « Dieu Très-Haut » rend θεὸν ὕψιστον et « maître de toute puissance » rend de façon naturelle δεσπόζοντα πάσης δυνάμεως, sans ajout doctrinal. « Portez-vous bien » convient à la clôture épistolaire ἐρρῶσθε.
  issues:
  - severity: medium
    issue: La relation syntaxique entre Dieu, l’opposition et la vengeance est modifiée.
    rationale: 'Le texte grec dit que « nous aurons contre nous », pour vengeance, « non pas un homme, mais le Dieu Très-Haut ». Le draft transforme cette construction en une relative : Dieu « qui vengera ces actes », ce qui atténue l’image explicite de Dieu comme adversaire.'
  - severity: medium
    issue: La traduction de τὸ σύνολον est trop restrictive.
    rationale: « La moindre peine » introduit l’idée de petitesse; τὸ σύνολον signifie plutôt « entièrement / de quelque manière que ce soit / en aucune façon », renforçant l’idée d’affliger ces personnes, quelle qu’en soit la manière.
  - severity: low
    issue: Les intensifs conclusifs sont insuffisamment conservés.
    rationale: « En toute circonstance, nous ne pourrons jamais lui échapper » exprime l’inéluctabilité, mais ne rend pas explicitement διὰ παντός, « pour toujours », et dissocie inutilement cet élément de « nous aurons contre nous ».
  revised_text: Sachez en effet que, si nous tramons quelque mauvais dessein contre eux ou les affligeons de quelque manière que ce soit, nous aurons contre nous, pour tirer vengeance de ces actes, non pas un homme, mais le Dieu Très-Haut, maître de toute puissance, à tous égards, inéluctablement et pour toujours. Portez-vous bien.
  revised_footnotes: []
