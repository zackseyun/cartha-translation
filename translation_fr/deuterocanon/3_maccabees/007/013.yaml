  yaml_path: translation/deuterocanon/3_maccabees/007/013.yaml
  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
translation:
  language: fr
  text: 'Alors les prêtres de ce peuple-là et toute la foule, après l’avoir acclamé[a] comme il convenait, s’écrièrent : « Alléluia ! »[b] Puis ils partirent dans la joie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « l’ » renvoie très probablement à Dieu ; le grec ne répète pas explicitement le nom.
    reason: alternative_reading
  - marker: b
    text: Ou « Hallelujah » ; le grec conserve une acclamation liturgique d’origine hébraïque.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  choice: après l’avoir acclamé
  rationale: Le participe évoque une louange publique et appuyée. « Acclamer » restitue cette dimension collective sans imposer un acte liturgique plus précis que le grec.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier est conservé sans remplacer explicitement son référent par « Dieu », bien que celui-ci soit le référent le plus probable dans le contexte.
- source_word: ὡς πρέπει ἦν
  choice: comme il convenait
  rationale: Cette tournure française naturelle garde l’idée de ce qui était approprié et le ton digne de l’expression grecque.
- source_word: οἱ τούτων ἱερεῖς
  choice: les prêtres de ces derniers
  rationale: « Ces derniers » conserve la valeur démonstrative de τούτων tout en renvoyant naturellement au groupe mentionné dans le contexte.
- source_word: πᾶν τὸ πλῆθος
  choice: toute la foule
  rationale: Cette formulation rend à la fois la totalité exprimée par πᾶν et le caractère collectif de πλῆθος en français courant.
- source_word: ἐπιφωνήσαντες
  choice: s’écrièrent
  rationale: Le verbe décrit une exclamation prononcée à haute voix ; « s’écrièrent » convient au registre narratif et introduit naturellement l’acclamation.
- source_word: ἀλληλουιά
  choice: Alléluia
  rationale: Il s’agit d’une acclamation liturgique d’origine hébraïque. « Alléluia » est sa forme française traditionnelle et immédiatement reconnaissable.
- source_word: μετὰ χαρᾶς
  choice: dans la joie
  rationale: La formulation conserve le substantif χαρά et exprime naturellement l’état dans lequel le groupe repart.
- source_word: ἀνέλυσαν
  choice: se retirèrent
  rationale: Dans le contexte d’un rassemblement qui s’achève, le verbe indique que les participants partent ou se dispersent. « Se retirèrent » convient à l’ensemble des prêtres et de la foule.
theological_decisions:
- issue: Référent de αὐτόν
  choice: Le texte conserve le pronom sous la forme « l’ » et l’accompagne d’une note.
  alternative: Rendre explicitement « Dieu ».
  rationale: Le contexte désigne très probablement Dieu, mais le grec emploie seulement un pronom. La traduction préserve donc cette implicitation et signale le référent probable en note.
- issue: Traduction de ἀλληλουιά
  choice: Alléluia
  alternative: Louez Yah ; Hallelujah
  rationale: La translittération française reçue préserve la fonction d’acclamation cultuelle et évite de développer dans le texte une étymologie que le grec lui-même laisse sous forme translittérée.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe participiale grecque est rendue par « après… », tandis que la succession des actions reste claire. Le démonstratif de τούτων est maintenu par « ces derniers » sans employer la tournure potentiellement péjorative « ces gens ».
