  source_fidelity: 'Le rendu respecte la syntaxe et la progression du grec : louange de « lui », acclamation « Alléluia », puis départ joyeux. Le pronom objet demeure justement implicite quant à son référent. En revanche, « les prêtres de ces derniers » ne rend pas clairement οἱ τούτων ἱερεῖς : « ces derniers » suppose en français une série antérieure d’éléments et devient opaque hors de ce cadre. « Se retirèrent » peut aussi suggérer une retraite plutôt qu’un simple départ à la fin d’un rassemblement.'
  naturalness: La phrase est globalement naturelle et de registre digne. « Les prêtres de ce peuple-là » est plus idiomatique et compréhensible que « les prêtres de ces derniers », tout en gardant une valeur démonstrative. « Partirent dans la joie » rend simplement et naturellement la conclusion du rassemblement.
  terminology: « Acclamé », « comme il convenait », « toute la foule », « s’écrièrent » et « Alléluia » conviennent. « Alléluia » est la forme liturgique française usuelle. La note sur le pronom et celle sur l’acclamation sont appropriées et leurs ancres restent correctement placées.
