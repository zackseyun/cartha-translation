  text: And after they had been brought down in peace[a], with the fitting thanksgivings[b], there also they resolved to keep these days as joyful ones for the whole time of their sojourning.
translation:
  language: fr
  text: Après avoir été ramenés en paix, avec les actions de grâce appropriées, là aussi ils décidèrent de célébrer ces jours comme des jours de joie pendant toute la durée de leur séjour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne le séjour de personnes qui vivent en terre étrangère, comme résidents étrangers ou temporaires; il n’implique pas nécessairement un exil imposé.
    reason: cultural_note
lexical_decisions:
- source_word: καταχθέντες
  choice: Après avoir été ramenés
  rationale: Le participe passif de κατάγω exprime ici le fait d’être conduit ou ramené vers le lieu de résidence. « Ramenés » rend naturellement le mouvement de retour sans préciser davantage la destination.
- source_word: μετʼ εἰρήνης
  choice: en paix
  rationale: Cette expression décrit les conditions paisibles et sûres de leur retour.
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  choice: au milieu des actions de grâce qui convenaient
  rationale: Dans ce contexte festif, ἐξομολόγησις désigne vraisemblablement l’action de grâce ou la louange plutôt que la confession des péchés. La tournure conserve l’idée d’actes de reconnaissance appropriés à la circonstance.
- source_word: ἔστησαν
  choice: ils décidèrent
  rationale: Avec l’infinitif ἄγειν, le verbe exprime ici une résolution prise ou établie; « décidèrent » est idiomatique en français.
- source_word: ἄγειν τὰς ἡμέρας
  choice: de célébrer ces jours
  rationale: ἄγειν appliqué à des jours de fête signifie les observer ou les célébrer. « Célébrer » convient particulièrement à l’adjectif εὐφροσύνους.
- source_word: ἐπὶ τὸν τῆς παροικίας αὐτῶν χρόνον
  choice: pendant tout le temps où ils séjourneraient en terre étrangère
  rationale: παροικία évoque la résidence de personnes vivant ailleurs que dans leur patrie, souvent comme étrangers établis, sans impliquer nécessairement un exil officiellement imposé.
- source_word: εὐφροσύνους
  choice: dans la joie
  rationale: L’adjectif qualifie ces jours comme joyeux. La locution française « célébrer ces jours dans la joie » en restitue naturellement la valeur prédicative.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement du grec tout en évitant le calque peu naturel « conduits vers le bas ». Une seule note explicite la nuance culturelle de παροικία; l’ambiguïté de ἐξομολόγησις est rendue dans le choix contextuel « actions de grâce ».
