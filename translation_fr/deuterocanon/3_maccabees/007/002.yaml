- from: Nous-mêmes et nos enfants nous portons bien, le grand Dieu faisant aboutir pour nous les décrets[a] conformément à nos intentions[b].
  to: Nous-mêmes et nos enfants, nous nous portons bien, le grand Dieu dirigeant pour nous les prescriptions[a], selon ce que nous souhaitons[b].
  rationale: La révision remplace une formulation qui ajoutait l’idée d’aboutissement par « dirigeant », plus proche de κατευθύνοντος. Elle emploie « prescriptions » pour προστάγματα afin de ne pas surdéterminer la nature ni le détenteur des ordres, et conserve l’ambiguïté de la juxtaposition entre l’action divine et la volonté des locuteurs.
