  yaml_path: translation/deuterocanon/3_maccabees/007/002.yaml
  text: And we ourselves and our children are well[a], as the great God directs his commands for us, just as we choose.
translation:
  language: fr
  text: Nous-mêmes et nos enfants, nous nous portons bien, le grand Dieu dirigeant pour nous les prescriptions[a], selon ce que nous souhaitons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ordres » ou « les injonctions ». Le grec ne précise pas explicitement à qui appartiennent ces prescriptions.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme nous le décidons » ou « selon notre choix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρώμεθα
  choice: nous portons bien
  rationale: Dans ce contexte épistolaire, la forme exprime idiomatiquement le fait d’être en bonne condition; «nous portons bien» est naturel en français sans limiter le propos à la seule santé physique.
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
  choice: nous-mêmes et nos enfants
  rationale: La tournure conserve l’insistance portée par αὐτοὶ et rend τέκνα par le terme inclusif «enfants».
- source_word: κατευθύνοντος
  choice: faisant aboutir
  rationale: Le verbe peut signifier diriger, guider droit ou faire réussir. Avec des décrets royaux comme complément, «faire aboutir» exprime naturellement l’action favorable de Dieu.
- source_word: τοῦ μεγάλου θεοῦ
  choice: le grand Dieu
  rationale: Rendu direct de l’expression honorifique grecque, avec son accent révérencieux.
- source_word: τὰ προστάγματα
  choice: les décrets
  rationale: Le nom désigne des prescriptions ou ordres édictés. Dans le contexte d’une lettre royale, «décrets» convient mieux que «commandements», qui pourrait laisser croire à tort qu’il s’agit nécessairement des commandements de Dieu.
- source_word: ἡμῖν
  choice: pour nous
  rationale: Le datif indique ici que l’action favorable s’exerce en faveur des locuteurs.
- source_word: καθὼς προαιρούμεθα
  choice: conformément à nos intentions
  rationale: προαιρέομαι exprime une décision délibérée, une intention ou un choix. Cette formulation française est naturelle et conserve la volonté humaine juxtaposée à l’action divine.
theological_decisions:
- issue: Rapport entre la direction divine et la volonté humaine dans καθὼς προαιρούμεθα
  choice: Maintenir côte à côte l’action du grand Dieu et les intentions des locuteurs
  alternative: «comme nous le choisissons» ou «selon notre décision»
  rationale: Le grec juxtapose l’action efficace de Dieu et la volonté délibérée des humains sans préciser leur articulation. La traduction ne transforme cette tension ni en déterminisme strict ni en autonomie humaine.
- issue: Identité du détenteur des προστάγματα
  choice: Ne pas ajouter de possessif dans le texte principal
  alternative: «ses commandements» ou «nos décrets»
  rationale: Le grec dit littéralement «les décrets» et le datif ἡμῖν ne détermine pas explicitement leur possesseur. Le contexte royal favorise des décrets émanant des locuteurs, mais l’absence de possessif préserve la formulation de la source.
translation_notes:
  register: Français international actuel, digne et lisible. La construction participiale conserve la progression serrée du grec, tandis que «nous portons bien» reprend une formule épistolaire naturelle. Les notes signalent les ambiguïtés réelles sans alourdir le verset.
