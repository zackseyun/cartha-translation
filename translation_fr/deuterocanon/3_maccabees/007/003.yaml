base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/003.yaml
  text: Some of our friends[a], being more constantly at our side out of malice, persuaded us that the Jews under our rule, after being gathered together in groups[b], should be punished with unusual penalties as rebels.
translation:
  language: fr
  text: Certains de nos amis, qui, par malveillance, se tenaient plus assidûment à nos côtés, nous ont persuadés de rassembler en groupes[a] les Juifs placés sous notre autorité et de leur infliger, en tant que révoltés, des peines inhabituelles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en corps organisés » ou « en associations ». Le terme grec peut désigner un ensemble constitué ou une association ; sa portée précise ici reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « des peines extraordinaires ». Le grec qualifie ces peines d’étranges, d’inhabituelles ou de hors du commun.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλων
  choice: amis
  rationale: Dans un contexte royal, le terme peut désigner des proches ou des membres de la cour, mais « amis » conserve le sens ordinaire sans préciser indûment une fonction officielle.
- source_word: κατὰ κακοήθειαν
  choice: par malveillance
  rationale: La locution exprime une conduite ou une motivation issue de la méchanceté et de la mauvaise volonté.
- source_word: πυκνότερον ἡμῖν παρακείμενοι
  choice: se tenaient plus assidûment à nos côtés
  rationale: παράκειμαι exprime ici la proximité, tandis que le comparatif πυκνότερον évoque une présence plus fréquente ou plus soutenue.
- source_word: συνέπεισαν ἡμᾶς
  choice: nous ont persuadés
  rationale: Le verbe composé signifie convaincre, gagner quelqu’un à une proposition ou l’amener à agir.
- source_word: τοὺς ὑπὸ τὴν βασιλείαν Ἰουδαίους
  choice: les Juifs soumis à notre règne
  rationale: La formule désigne les Juifs placés sous l’autorité politique du roi qui parle.
- source_word: συναθροίσαντας
  choice: de rassembler
  rationale: 'Le participe aoriste actif s’accorde grammaticalement avec le sujet implicite de l’infinitif, c’est-à-dire le « nous » persuadé : le roi et ses agents doivent rassembler les Juifs avant de les punir.'
- source_word: τὰ συστήματα
  choice: en groupes
  rationale: σύστημα peut désigner un ensemble constitué, un corps organisé ou une association. « En groupes » reste naturel tout en laissant la note signaler la nuance institutionnelle possible.
- source_word: κολάζεσθαι
  choice: de les punir
  rationale: Le moyen/passif peut ici se rendre naturellement comme une action punitive exercée par l’autorité royale contre les Juifs rassemblés.
- source_word: ξενιζούσαις ... τιμωρίαις
  choice: par des châtiments inhabituels
  rationale: L’expression décrit des peines étranges, hors du commun ou extraordinaires; « inhabituels » conserve cette idée sans l’exagérer.
- source_word: ἀποστάντων
  choice: comme des révoltés
  rationale: Le participe aoriste évoque la défection ou la révolte dans ce contexte politique. La formulation préserve le statut accusatoire attribué aux Juifs sans introduire une apostasie religieuse.
theological_decisions:
- issue: Portée de ἀποστάντων
  choice: révolte ou défection politique
  alternative: apostasie religieuse
  rationale: Le contexte est celui d’une mesure punitive prise par un souverain à l’encontre de sujets de son royaume. Le sens politique est donc préférable, sans exclure que le terme puisse ailleurs avoir une portée religieuse.
- issue: Sens de τὰ συστήματα
  choice: groupes, avec mention en note de corps organisés ou associations
  alternative: communautés ou corps collectifs
  rationale: Le nom peut désigner une structure organisée, mais sa valeur exacte dans cette phrase demeure incertaine. Le texte principal privilégie une formulation compréhensible et la note préserve l’ambiguïté.
- issue: Construction de συναθροίσαντας
  choice: 'participe actif renvoyant au roi et à ses agents : « de rassembler »'
  alternative: 'sens passif contextuel : « après qu’ils eurent été rassemblés »'
  rationale: La forme grecque est un accusatif masculin pluriel actif, qui s’accorde naturellement avec le sujet implicite de κολάζεσθαι après συνέπεισαν ἡμᾶς. La traduction française respecte cette syntaxe au lieu de fournir un passif absent de la forme.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période administrative du grec est conservée sous une forme fluide. Les notes [a] et [b] rendent visibles les deux principales incertitudes lexicales.
