revisions:
- from: Après avoir aussi gravé ces faits sur une stèle[a] et établi un lieu de prière à l’endroit du banquet, ils repartirent sains et saufs, libres et transportés de joie. Par terre, par mer et par les fleuves, ils regagnèrent leur pays en toute sécurité, sur l’ordre du roi[b].
  to: Après avoir aussi fait inscrire ces faits sur une stèle[a] et établi un lieu de prière sur le site du banquet, ils se mirent en route, indemnes, libres et débordants de joie, ramenés sains et saufs par terre, par mer et par les fleuves, sur l’ordre du roi[b].
  rationale: La révision supprime l’ajout non nécessaire de « leur pays » et rétablit le rapport syntaxique entre le départ et le fait d’être ramenés sains et saufs. Elle garde le caractère commémoratif de la stèle et du lieu de prière, l’intensité de la joie, le pluriel de « fleuves » et l’attribution explicite à l’ordre du roi, sans introduire d’agent divin dans cette proposition.
  reviewer_model: gpt-5.6-terra
