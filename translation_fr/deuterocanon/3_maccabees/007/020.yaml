review_pass:
  verdict: revise
  source_fidelity: La structure participiale et les éléments principaux sont globalement bien rendus. Toutefois, « ils regagnèrent leur pays » transforme le participe ἀνασωζόμενοι en proposition principale, ajoute « leur pays », absent du grec, et affaiblit le lien avec ἀνέλυσαν (« ils partirent / se mirent en route »). La révision conserve la direction de retour suggérée par ἀνα- sans spécifier de destination.
  naturalness: 'La phrase révisée reste naturelle en français international moderne tout en conservant la période et la répétition expressive du grec : ils sont à la fois « indemnes » au départ et « ramenés sains et saufs » durant leur trajet.'
  terminology: « Stèle », « lieu de prière », « libres » et « sur l’ordre du roi » sont précis et adaptés. « Faire inscrire » rend clairement la mise par écrit sur une stèle, tout en maintenant en note la nuance possible de consécration ou d’exposition solennelle de ἀνιερώσαντες.
