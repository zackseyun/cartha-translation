base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/020.yaml
  text: After also inscribing these things on a pillar[a], and establishing a place of prayer at the site of the banquet, they departed unharmed, free, and overflowing with joy, being brought safely back by land and sea and rivers, by the king’s command[b],
translation:
  language: fr
  text: Après avoir aussi fait inscrire ces faits sur une stèle[a] et établi un lieu de prière sur le site du banquet, ils se mirent en route, indemnes, libres et débordants de joie, ramenés sains et saufs par terre, par mer et par les fleuves, sur l’ordre du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les ayant consacrés sur une stèle » ; le verbe grec peut évoquer aussi bien leur exposition publique que leur consécration solennelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « étant préservés sains et saufs par terre, par mer et par les fleuves ». Le participe grec souligne leur préservation au cours du voyage, sans préciser explicitement ici l’agent de cette protection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιερώσαντες
  choice: gravé ces faits
  rationale: Avec ἐν στήλῃ, le participe désigne vraisemblablement la consignation publique et solennelle des événements sur un monument; « gravé » rend concrètement cette action sans exclure sa portée dédicatoire.
- source_word: στήλῃ
  choice: stèle
  rationale: « Stèle » désigne précisément un monument dressé, souvent porteur d’une inscription, et reste compréhensible en français courant.
- source_word: κατὰ τὸν τῆς συμποσίας τόπον
  choice: à l’endroit du banquet
  rationale: La préposition a ici une valeur locale et rattache le lieu de prière au site où le banquet s’était tenu.
- source_word: προσευχῆς … καθιδρύσαντες
  choice: établi un lieu de prière
  rationale: καθιδρύω suggère une installation durable; le génitif προσευχῆς caractérise naturellement le lieu comme destiné à la prière.
- source_word: ἀνέλυσαν
  choice: ils repartirent
  rationale: Le verbe signifie ici quitter les lieux ou se mettre en route; « repartirent » convient au contexte de retour sans forcer à lui seul la destination.
- source_word: ἀσινεῖς
  choice: sains et saufs
  rationale: Cette expression française naturelle rend l’absence de dommage ou de blessure.
- source_word: ἐλεύθεροι
  choice: libres
  rationale: Le terme souligne directement leur liberté retrouvée après la menace et les contraintes subies.
- source_word: ὑπέρχαρεις
  choice: transportés de joie
  rationale: Le composé exprime une joie particulièrement intense; cette tournure en restitue la force dans un registre digne et actuel.
- source_word: ἀνασωζόμενοι
  choice: ils regagnèrent leur pays en toute sécurité
  rationale: Le participe exprime le fait d’être ramenés ou de revenir sains et saufs. « Leur pays » explicite légèrement la direction suggérée par ἀνα-, tout en plaçant en note une formulation moins directionnelle.
- source_word: διὰ τε γῆς καὶ θαλάσσης καὶ ποταμῶν
  choice: par terre, par mer et par les fleuves
  rationale: La formulation conserve les trois voies de déplacement et respecte le pluriel ποταμῶν.
- source_word: τῇ τοῦ βασιλέως ἐπιταγῇ
  choice: sur l’ordre du roi
  rationale: ἐπιταγή désigne un ordre ayant autorité; « sur l’ordre du roi » est direct et idiomatique.
theological_decisions:
- issue: Caractère religieux et commémoratif de l’inscription et du lieu de prière
  choice: Présenter l’inscription sur la stèle et l’établissement du lieu de prière comme des actes publics et durables.
  alternative: Comprendre l’action comme une simple désignation temporaire du lieu ou comme la consécration de l’inscription elle-même.
  rationale: La stèle et le verbe καθιδρύω favorisent une action commémorative durable, mais la note maintient l’éventuelle nuance de consécration portée par ἀνιερόω.
- issue: Agent et portée de ἀνασωζόμενοι
  choice: Exprimer leur retour en sécurité sous l’effet pratique de l’ordre royal, sans nommer explicitement Dieu dans cette proposition.
  alternative: Rendre plus passivement « ils furent préservés en sécurité », ce qui laisse entièrement indéterminés l’agent et la direction.
  rationale: Le contexte général relève de la délivrance divine, tandis que cette proposition associe explicitement le voyage à l’ordre du roi. La traduction préserve cette tension sans ajouter de sujet divin absent du grec.
translation_notes:
  register: Français international moderne, fluide et digne. La longue période grecque est divisée en deux phrases pour la lisibilité. « Stèle » conserve la précision historique; « transportés de joie » restitue l’intensité sans emphase archaïque.
