    issue: Ajout de « leur pays » et réorganisation de la proposition finale
    rationale: Le grec ne mentionne aucun pays. De plus, ἀνασωζόμενοι est un participe rattaché à ἀνέλυσαν, non un nouveau verbe principal. La formulation initiale introduit donc une précision contextuelle non exprimée et modifie la structure du texte.
  - severity: low
    issue: 'Note b : formulation et ponctuation à corriger'
    rationale: La note commence par un guillemet isolé et sa formulation « à travers terres, mers et fleuves » est moins idiomatique. Elle doit présenter l’alternative sans créer d’ambiguïté formelle.
  revised_text: Après avoir aussi fait inscrire ces faits sur une stèle[a] et établi un lieu de prière sur le site du banquet, ils se mirent en route, indemnes, libres et débordants de joie, ramenés sains et saufs par terre, par mer et par les fleuves, sur l’ordre du roi[b].
