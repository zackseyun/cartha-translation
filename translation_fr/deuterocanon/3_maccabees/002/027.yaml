  verdict: revise
  source_fidelity: Le projet rend correctement le dessein arrêté (προέθετο), le caractère public (δημοσίᾳ), la stèle, la localisation générale et l’inscription. Toutefois, « couvrir la nation d’opprobre » transforme l’idée explicite de répandre/diffuser un reproche contre elle (διαδοῦναι ψόγον κατὰ τοῦ ἔθνους). De plus, « fit graver » introduit une médiation absente de l’aoriste actif ἐκόλαψεν (« il grava »).
  naturalness: La phrase révisée reste fluide et soutenue dans un français moderne international. « Répandre publiquement l’opprobre contre la nation » conserve la concision et le mouvement de l’original sans ajouter un contenu précis aux accusations. « Il grava » est direct et naturel dans le cadre d’une inscription officielle.
  terminology: '« Nation », « opprobre », « stèle » et « inscription » sont appropriés. La note sur στήλη est ajustée : « pierre commémorative » suggère une fonction mémorielle non exprimée par le grec, tandis que « pierre dressée » est une alternative plus neutre. La note sur αὐλή préserve à bon droit l’incertitude entre cour, cour de palais et enceinte.'
  issues:
