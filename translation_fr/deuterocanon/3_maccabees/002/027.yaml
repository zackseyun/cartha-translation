    issue: « couvrir publiquement la nation d’opprobre »
    rationale: Cette expression signifie surtout infliger la honte à la nation. Le grec exprime explicitement la diffusion publique d’un ψόγος dirigé contre elle ; la révision maintient cette image de propagation et la relation marquée par κατά.
  - severity: medium
    issue: « il y fit graver »
    rationale: 'ἐκόλαψεν est actif : le texte dit qu’il grava une inscription, sans indiquer qu’il l’a fait exécuter par un tiers. Une traduction directe évite cet ajout.'
  - severity: low
    issue: 'Note a : « une pierre commémorative »'
    rationale: « Commémorative » ajoute une finalité que στήλη n’implique pas nécessairement. « Pierre dressée » rend l’alternative matérielle sans cette précision.
