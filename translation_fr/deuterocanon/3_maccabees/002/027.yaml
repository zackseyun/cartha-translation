  text: He publicly proposed to spread reproach against the nation; having set up a stele on the tower by the court, he engraved an inscription
translation:
  language: fr
  text: Il décida de répandre publiquement l’opprobre contre la nation ; après avoir dressé une stèle[a] sur la tour près de la cour[b], il y grava une inscription.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pierre dressée » ou « un monument ». Le grec désigne un monument érigé, souvent en pierre, qui peut porter une inscription.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « cour » peut aussi désigner la cour d’un palais ou une enceinte ; le grec ne permet pas à lui seul d’en préciser exactement la nature.
    reason: cultural_note
lexical_decisions:
- source_word: προέθετο
  choice: il décida
  rationale: Le moyen de προτίθημι exprime ici une intention arrêtée ou un dessein. « Il décida » est naturel en français et évite le sens moderne de « proposer » à autrui.
- source_word: δημοσίᾳ
  choice: publiquement
  rationale: L’adverbe indique que l’action ou la publication devait se faire au grand jour.
- source_word: διαδοῦναι ψόγον κατὰ τοῦ ἔθνους
  choice: couvrir publiquement la nation d’opprobre
  rationale: Cette formulation idiomatique rend l’idée de répandre contre la nation un blâme déshonorant, sans réduire ψόγος à une simple critique.
- source_word: ἔθνους
  choice: la nation
  rationale: Le terme désigne ici collectivement le peuple juif ; « nation » conserve cette dimension collective.
- source_word: στήλην
  choice: une stèle
  rationale: Le mot désigne un monument dressé, généralement en pierre, destiné à porter une inscription ; « stèle » est le terme français précis.
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  choice: sur la tour située près de la cour
  rationale: Cette traduction conserve le rapport spatial exprimé par κατά sans préciser indûment qu’il s’agit d’une cour palatiale.
- source_word: ἐκόλαψεν γραφὴν
  choice: il y fit graver une inscription
  rationale: Le contexte monumental donne à γραφή le sens d’« inscription », tandis que ἐκόλαψεν évoque son incision. « Fit graver » est une tournure française naturelle, le roi étant l’auteur institutionnel de l’acte.
