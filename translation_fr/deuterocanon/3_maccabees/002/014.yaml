translation:
  language: fr
  text: Car ta demeure est le ciel des cieux[a], inaccessible aux êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le ciel du ciel ». Ou : « le plus haut des cieux ». Le grec conserve une expression d’origine sémitique désignant le ciel suprême, demeure transcendante de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: demeure
  rationale: Le nom désigne le lieu où quelqu’un habite. « Demeure » est naturel, digne et conserve ici le sens concret de lieu d’habitation.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: le ciel du ciel
  rationale: Cette traduction conserve l’expression superlative d’origine sémitique et sa résonance biblique, malgré son caractère inhabituel en français. Les formulations plus idiomatiques figurent en note.
- source_word: ἀνέφικτος
  choice: inaccessible
  rationale: L’adjectif signifie qu’on ne peut atteindre ou accéder à quelque chose. « Inaccessible » exprime précisément cette impossibilité dans un registre soutenu mais courant.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Le pluriel grec désigne ici l’humanité en général, sans limitation aux hommes de sexe masculin. « Êtres humains » rend explicitement cette portée générique.
theological_decisions:
- issue: Expression superlative οὐρανὸς τοῦ οὐρανοῦ
  choice: le ciel du ciel
  alternative: le ciel des cieux ; le plus haut des cieux
  rationale: La formulation littérale préserve l’étrangeté et la portée théologique de l’expression grecque, qui présente la demeure divine comme transcendante, sans réduire celle-ci à une simple paraphrase explicative.
- issue: Portée générique de ἀνθρώποις
  choice: aux êtres humains
  alternative: aux hommes
  rationale: Le terme grec vise ici tous les humains. La traduction choisie rend cette portée sans introduire une restriction masculine absente du sens.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec, tandis que « aux êtres humains » communique sans ambiguïté la portée générique du terme source.
