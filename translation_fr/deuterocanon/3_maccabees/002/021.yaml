  yaml_path: translation/deuterocanon/3_maccabees/002/021.yaml
  text: There the God who watches over all[a], the holy forefather among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness[b],
translation:
  language: fr
  text: Là, Dieu qui veille sur tous, le saint Ancêtre parmi les saints[a], après avoir entendu la supplication conforme à la loi, fouetta celui qui était grandement enflé d’insolence et d’audace,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le saint Ancêtre dans les lieux saints ». Le grec peut désigner ici soit les saints, soit les lieux ou réalités saintes.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐνταῦθα
  choice: Alors
  rationale: Dans le fil narratif, l’adverbe marque ici le moment où Dieu intervient; « Alors » est naturel en français sans exclure entièrement la nuance liée à la scène.
- source_word: ὁ πάντων ἐπόπτης θεός
  choice: Dieu qui veille sur tous
  rationale: ἐπόπτης désigne celui qui observe ou surveille; cette formulation française conserve l’idée de vigilance divine et la portée de πάντων.
- source_word: προπάτωρ
  choice: Ancêtre
  rationale: Le mot signifie littéralement « ancêtre » ou « aïeul ». La majuscule signale son emploi exceptionnel comme titre divin sans ajouter l’idée de souveraineté, absente du terme grec.
- source_word: ἅγιος ἐν ἁγίοις
  choice: le saint Ancêtre parmi les saints
  rationale: Le datif pluriel peut désigner des êtres saints ou des lieux saints. La lecture personnelle s’intègre bien à la série d’épithètes, tandis que l’ambiguïté réelle est conservée en note.
- source_word: τῆς ἐνθέσμου λιτανείας
  choice: la supplication conforme à la Loi
  rationale: λιτανεία est une supplication instante; ἐνθέσμου indique qu’elle est conforme à ce qui est établi ou prescrit. « Conforme à la Loi » est plus clair en français actuel que « légale » dans ce contexte religieux.
- source_word: ἐμάστιξεν
  choice: frappa comme d’un fouet
  rationale: Le verbe signifie littéralement fouetter ou flageller. Cette expression garde l’image vive tout en permettant son emploi figuré pour une intervention punitive de Dieu.
- source_word: τὸν ὕβρει καὶ θράσει μεγάλως ἐπηρμένον
  choice: l’homme que l’arrogance et l’audace avaient démesurément enflé d’orgueil
  rationale: La formulation conserve l’image d’élévation ou de gonflement contenue dans ἐπηρμένον, ainsi que la réprobation morale portée par ὕβρις et θράσος.
theological_decisions:
- issue: Le titre divin προπάτωρ
  choice: Ancêtre
  alternative: Aïeul; Ancêtre primordial
  rationale: Le grec attribue à Dieu un titre ancestral inhabituel. « Ancêtre » en restitue directement la force familiale sans introduire une qualification comme « souverain » qui ne figure pas dans le mot source.
- issue: Le sens de ἅγιος ἐν ἁγίοις
  choice: saint ... parmi les saints
  alternative: saint dans les lieux saints
  rationale: Le grec permet de comprendre ἁγίοις comme masculin (« les saints ») ou neutre (« les lieux saints », « les choses saintes »). La lecture personnelle convient à l’enchaînement des titres divins, mais la lecture locative demeure possible et figure en note.
- issue: La valeur de ἐνθέσμου
  choice: conforme à la Loi
  alternative: légitime; conforme aux prescriptions
  rationale: La traduction garde le lien avec une norme établie sans préciser de manière confessionnelle la nature exacte de cette norme.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste assez proche du grec, notamment avec « après avoir entendu », tandis que les expressions idiomatiques évitent un calque obscur. Le titre inhabituel « Ancêtre » est conservé et clarifié par le contexte et la note.
