  source_fidelity: La traduction de κατεπατήσαμεν / καταπατοῦνται par « avons foulé aux pieds » / « sont foulées aux pieds » est fidèle et préserve la répétition. « La demeure consacrée » rend convenablement τὸν οἶκον τοῦ ἁγιασμοῦ dans un français naturel. En revanche, τῶν προσολυμίων désigne les habitants de Jérusalem (les Jérusalémites) dans le texte grec fourni ; il ne peut pas être rendu par « des abominations ».
  naturalness: Le registre est sobre et naturel. La répétition de « demeure(s) » conserve le lien lexical de οἶκος et convient au contexte cultuel et urbain. « Les habitants de Jérusalem » est plus international et transparent que « les Jérusalémites ».
  terminology: « Demeure consacrée » exprime la qualité sacrée de la première demeure sans imposer « Temple » au texte. Aucun terme théologique ne justifie une correction conjecturale du gentilé grec transmis.
