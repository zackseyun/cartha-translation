translation:
  language: fr
  text: Nous avons foulé aux pieds la demeure consacrée, comme sont foulées aux pieds les demeures des habitants de Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεπατήσαμεν
  choice: nous avons foulé aux pieds
  rationale: Rend concrètement καταπατέω et conserve la confession à la première personne du pluriel.
- source_word: τὸν οἶκον τοῦ ἁγιασμοῦ
  choice: la demeure consacrée
  rationale: « Demeure » garde l’image de οἶκος tout en convenant au Temple; « consacrée » exprime naturellement en français la valeur cultuelle de ἁγιασμός sans employer l’expression peu idiomatique « maison de la sanctification ».
- source_word: ὡς
  choice: comme
  rationale: Introduit simplement et naturellement la comparaison.
- source_word: οἱ οἶκοι
  choice: les demeures
  rationale: Conserve le lien lexical avec le premier οἶκος et évite de préciser arbitrairement « temples ».
- source_word: τῶν προσολυμίων
  choice: des abominations
  rationale: Le mot imprimé dans les données fournies est obscur et paraît corrompu; le contexte et la leçon grecque attendue προσοχθισμάτων donnent le sens d’objets cultuels abominables. La difficulté textuelle est signalée en note plutôt que dissimulée.
- source_word: καταπατοῦνται
  choice: sont foulées aux pieds
  rationale: Le passif et la répétition du même verbe sont maintenus, car ils structurent la comparaison.
theological_decisions:
- issue: Identification de la première « demeure » comme le Temple
  choice: la demeure consacrée
  alternative: le Temple saint
  rationale: La formulation choisie laisse le référent cultuel apparaître sans remplacer directement οἶκος par « Temple » ni effacer le substantif ἁγιασμός.
- issue: Sens de τῶν προσολυμίων dans le texte transmis
  choice: des abominations
  alternative: des habitants de Jérusalem
  rationale: L’interprétation « habitants de Jérusalem » n’est ni morphologiquement sûre ni cohérente avec l’opposition cultuelle du passage. La lecture « abominations », probablement représentée par προσοχθισμάτων dans la tradition textuelle, rend la comparaison entre le sanctuaire consacré et les lieux de cultes abhorrés, tout en faisant l’objet d’une note explicite.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « foulé(es) aux pieds » reproduit l’insistance grecque. « Demeure consacrée » reste accessible tout en conservant la coloration cultuelle; la note rend visible l’incertitude majeure du texte source.
