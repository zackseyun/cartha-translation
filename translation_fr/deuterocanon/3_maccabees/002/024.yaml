    issue: Valeur de ἐπιτιμηθείς rendue comme une concession explicite
    rationale: '« Bien qu’il eût été réprimandé » impose une relation concessive. Le participe aoriste passif peut être rendu de façon plus neutre et proche par « après avoir été réprimandé ». '
  - severity: low
    issue: « Menace amère » est peu idiomatique
    rationale: Pour une menace, πικρά désigne naturellement une dureté ou une sévérité. « Menace sévère » est plus naturel tout en préservant la force du grec.
  - severity: low
    issue: La durée implicite de ἐν χρόνῳ est sous-traduite
    rationale: « Quelque temps plus tard » rend explicitement l’idée temporelle présente dans l’expression grecque.
