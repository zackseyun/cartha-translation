  text: But after some time[a], when he had recovered himself, he in no way came to regret it when he was rebuked; rather, having issued a bitter threat[b], he departed.
translation:
  language: fr
  text: Mais quelque temps plus tard, après s’être ressaisi[a], il n’éprouva absolument aucun regret[b] après avoir été réprimandé. Mais, après avoir proféré une menace sévère, il partit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir repris ses esprits ». La tournure grecque indique probablement qu’il retrouva son calme après l’épisode précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il ne revint absolument pas sur sa décision ». L’expression grecque peut évoquer aussi bien l’absence de remords que le refus de changer d’avis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χρόνῳ δὲ ὕστερον
  choice: Mais plus tard
  rationale: Cette tournure situe l’action à un moment ultérieur; « mais » rend la légère valeur adversative de δέ sans alourdir la phrase.
- source_word: ἀναλεξάμενος αὐτόν
  choice: après s’être ressaisi
  rationale: Dans le contexte de l’épisode précédent, la tournure est le plus naturellement comprise comme indiquant que le roi retrouve ses esprits ou sa maîtrise de lui-même.
- source_word: οὐδαμῶς εἰς μετάμελον ἦλθεν
  choice: il n’éprouva absolument aucun regret
  rationale: L’expression signifie littéralement qu’il ne « vint » nullement au regret. La formulation française garde l’insistance de οὐδαμῶς tout en restant naturelle.
- source_word: ἐπιτιμηθείς
  choice: bien qu’il eût été réprimandé
  rationale: Le participe aoriste passif indique qu’une réprimande lui a été adressée. La valeur concessive convient à l’opposition entre cette réprimande et son absence totale de regret.
- source_word: μετὰ ἀπειλῆς δὲ πικρᾶς θέμενος
  choice: Au contraire, après avoir proféré une menace amère
  rationale: θέμενος signifie ici « avoir formulé/proféré », tandis que πικρά conserve l’image d’une menace « amère », c’est-à-dire dure et hostile. « Au contraire » explicite l’opposition portée par δέ dans le contexte.
- source_word: ἀνέλυσεν
  choice: il se retira
  rationale: Dans ce récit, le verbe désigne le fait de partir ou de se retirer; « se retira » convient au registre narratif et à la situation.
