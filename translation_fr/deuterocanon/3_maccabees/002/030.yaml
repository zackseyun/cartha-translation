revisions:
- from: 'Mais, pour ne pas paraître odieux à tous, il ajouta par écrit : « Si toutefois certains d’entre eux choisissent de vivre parmi ceux qui ont été initiés selon les rites[a], il leur accorde les mêmes droits civiques qu’aux Alexandrins. »'
  to: 'Mais, pour ne pas paraître odieux à tous, il ajouta par écrit : « Mais si certains d’entre eux choisissent de vivre parmi les initiés aux rites[a], il fait d’eux des citoyens jouissant des mêmes droits que les Alexandrins. »'
  rationale: La révision rend plus explicitement la valeur civique et statutaire de ποιεῖ ... ἰσοπολίτας, tout en conservant un français moderne. Elle simplifie aussi la désignation des personnes initiées et maintient l’alternative « mystères » en note, sans identifier indûment les rites concernés.
