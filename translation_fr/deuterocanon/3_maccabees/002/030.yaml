base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: fr
  text: 'Mais, pour ne pas paraître odieux à tous, il ajouta par écrit : « Mais si certains d’entre eux choisissent de vivre parmi les initiés aux rites[a], il fait d’eux des citoyens jouissant des mêmes droits que les Alexandrins. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « initiés aux mystères ». Le grec emploie ici le vocabulaire cultuel de l’initiation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεχθόμενος
  choice: odieux
  rationale: Avec φαίνηται, « paraître odieux » exprime naturellement en français la manière dont il risquait d’être perçu, sans transformer le participe en sentiment actif d’hostilité.
- source_word: ὑπέγραψεν
  choice: il ajouta par écrit
  rationale: Dans le contexte d’un décret, le verbe désigne l’ajout écrit d’une disposition; cette formulation conserve le sens documentaire sans imposer un terme administratif trop technique.
- source_word: προαιρῶνται
  choice: choisissent
  rationale: Le verbe marque une décision volontaire ou une préférence délibérée; « choisissent » est clair et fidèle.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: parmi ceux qui ont été initiés selon les rites
  rationale: La formulation maintient le vocabulaire cultuel de l’initiation et le rapport de κατὰ τελετὰς aux rites, sans préciser indûment de quels mystères il s’agit.
- source_word: ἀναστρέφεσθαι
  choice: vivre
  rationale: Dans cette construction avec un groupe de personnes, le verbe peut évoquer à la fois la fréquentation, la conduite et le mode de vie; « vivre parmi » est naturel et garde une portée assez large.
- source_word: ἰσοπολίτας
  choice: les mêmes droits civiques
  rationale: Le terme exprime l’égalité de statut civique. En français moderne, « accorder les mêmes droits civiques » rend plus clairement sa force juridico-politique que le calque « faire citoyens égaux ».
- source_word: Ἀλεξανδρεῦσι
  choice: qu’aux Alexandrins
  rationale: 'Le datif établit ici la norme d’égalité civique: les personnes concernées reçoivent un statut égal à celui des Alexandrins.'
- source_word: ποιεῖ
  choice: il leur accorde
  rationale: Dans le langage juridique du décret, ποιεῖ décrit l’octroi effectif d’un statut. Le présent est conservé dans la citation.
theological_decisions:
- issue: Langage cultuel d’initiation dans un récit juif hellénistique
  choice: initiés selon les rites
  alternative: initiés aux mystères
  rationale: Le grec emploie explicitement le vocabulaire des rites et de l’initiation. La traduction retenue en préserve la portée cultuelle tout en évitant de désigner plus précisément un culte à mystères que ne le fait le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours rapporté garde le présent juridique du décret. La légère rupture entre le passé narratif (« ajouta ») et le présent de la disposition (« accorde ») reflète le grec.
