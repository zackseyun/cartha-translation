base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/016.yaml
  text: Do not punish us for their uncleanness[a], nor call us to account for profanation, lest the lawless boast in their wrath and exult in the pride of their tongue, saying[b],
translation:
  language: fr
  text: 'Ne nous punis pas pour leur impureté[a] et ne nous tiens pas pour responsables d’une profanation[b], de peur que les hommes sans loi ne se vantent dans leur fureur et n’exultent dans l’orgueil de leur langue, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne nous punis pas dans leur impureté ». Le verbe grec peut exprimer l’exercice de la justice ou la vengeance ; la préposition peut aussi avoir un sens circonstanciel, « dans » ou « au milieu de ».
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Ou « ne nous demande pas compte d’une profanation ». Le terme désigne le fait de traiter comme ordinaire ce qui est saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδίκησῃς
  choice: punis
  rationale: Dans cette prière adressée à Dieu, le verbe exprime l’exercice d’une justice rétributive contre les suppliants. « Punir » est naturel en français et évite de suggérer une vindicte personnelle, tout en signalant en note le sens possible de vengeance.
- source_word: ἀκαθαρσίᾳ
  choice: impureté
  rationale: Le terme peut désigner une impureté rituelle ou morale. « Impureté » conserve ce registre religieux sans l’alourdir.
- source_word: εὐθύνῃς
  choice: demande pas compte
  rationale: 'Le verbe a ici une nuance judiciaire : exiger des comptes ou tenir quelqu’un pour responsable. Cette formulation restitue cette nuance en français courant.'
- source_word: βεβηλώσει
  choice: profanation
  rationale: Le nom désigne le fait de traiter comme commun ce qui est saint. « Profanation » le distingue de l’impureté mentionnée auparavant.
- source_word: παράνομοι
  choice: ceux qui transgressent la Loi
  rationale: Le mot désigne ceux qui agissent contre la loi. Cette formulation garde la force morale et juridique du grec, tout en évitant le sens moderne plus étroit de « hors-la-loi ».
- source_word: θυμῷ αὐτῶν
  choice: leur fureur
  rationale: θυμός peut exprimer la colère intense, la rage ou l’emportement. « Fureur » convient au registre élevé et au contexte d’hostilité.
- source_word: καυχήσωνται
  choice: se vantent
  rationale: Le verbe signifie se glorifier ou se vanter. Ce choix le distingue du verbe suivant, qui exprime une joie triomphante.
- source_word: ἀγαλλιάσωνται
  choice: exultent
  rationale: Le verbe dénote une joie intense et triomphante. « Exulter » conserve le ton solennel de la prière.
- source_word: ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: l’orgueil de leur langue
  rationale: La traduction conserve l’image concrète et saisissable de la langue comme organe d’une parole arrogante.
theological_decisions:
- issue: Le référent de τούτων et la responsabilité des suppliants pour l’impureté ou la profanation d’autrui
  choice: 'Comprendre τούτων comme renvoyant à des personnes hostiles : « leur impureté » ; les suppliants demandent à ne pas subir de châtiment à cause de leur conduite.'
  alternative: 'Comprendre τούτων de façon plus abstraite : « l’impureté de ces choses » ou « cette impureté ».'
  rationale: Le contraste entre « nous » et « ceux qui transgressent la Loi » favorise un référent personnel. La formulation « à cause de » rend la relation sans préciser indûment si les suppliants sont contaminés par autrui ou simplement tenus responsables de ses actes.
- issue: Le rapport de βεβήλωσις aux suppliants
  choice: 'Traduire sans possessif explicite : « d’une profanation », afin de ne pas attribuer silencieusement l’acte aux suppliants ou à leurs adversaires.'
  alternative: « de leur profanation », en reliant explicitement la profanation aux personnes désignées par τούτων.
  rationale: Le grec n’exprime pas ici de possessif avec βεβηλώσει. La traduction préserve donc l’ambiguïté concernant l’auteur précis de la profanation.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la prière et ses images sont conservés. « Ceux qui transgressent la Loi » explicite la valeur de παράνομοι sans introduire de précision confessionnelle ; la majuscule indique ici la Loi comme norme religieuse dans ce contexte.
