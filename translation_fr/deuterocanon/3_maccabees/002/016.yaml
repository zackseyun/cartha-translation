  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la supplication demande à Dieu de ne pas exercer de jugement contre « nous » en relation avec l’impureté d’« eux », ni de leur demander des comptes en relation avec une profanation. Le contraste avec οἱ παράνομοι et la double conséquence (« se vanter », « exulter ») sont préservés. « À cause de » est possible pour ἐν, mais « pour » est plus direct et naturel dans cette prière, sans lever l’ambiguïté exacte de la préposition grecque.'
  naturalness: La phrase est globalement digne et claire. « Ne nous demande pas compte d’une profanation » est toutefois moins idiomatique en français moderne que « ne nous tiens pas pour responsables d’une profanation ». « Les hommes sans loi » restitue plus directement παράνομοι que la périphrase « ceux qui transgressent la Loi », laquelle peut suggérer une Loi identifiée et définie que le grec ne précise pas.
  terminology: « Impureté », « profanation », « fureur », « se vanter » et « exulter » sont justes et maintiennent les distinctions lexicales du grec. La note a doit présenter « ne nous punis pas dans leur impureté » comme une possibilité de traduction de ἐν, plutôt que l’expression française peu naturelle « tirer vengeance de nous au milieu de leur impureté ».
