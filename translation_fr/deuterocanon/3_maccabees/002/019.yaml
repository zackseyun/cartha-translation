  yaml_path: translation/deuterocanon/3_maccabees/002/019.yaml
  text: Let your mercies quickly come before us[a]; and put praise in the mouth of those who have fallen and whose souls are crushed[b], having made peace for us.
translation:
  language: fr
  text: Que tes compassions prennent vite les devants[a] ! Mets des paroles de louange dans la bouche de ceux qui sont tombés et dont l’âme est brisée[b], ayant fait la paix pour nous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi se rendre par « devancer » ou « venir au-devant ». Le texte grec ne précise pas qui ou quoi les compassions devancent.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ceux qui sont tombés et qui ont été brisés quant à leur âme ».'
    reason: literal_rendering
  - marker: c
    text: 'Ou : « en faisant la paix pour nous » ou « après avoir fait la paix pour nous ». Le participe aoriste grec peut présenter cette action comme liée à la demande ou comme accomplie auparavant.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: προκαταλαβέτωσαν
  choice: prennent vite les devants
  rationale: Le verbe exprime l’idée de devancer ou d’anticiper. Comme le texte grec fourni n’exprime aucun complément tel que « nous », cette tournure française conserve le mouvement du verbe sans ajouter un objet absent.
- source_word: οἰκτιρμοί
  choice: compassions
  rationale: Le pluriel grec désigne les manifestations de la compassion divine. « Compassions » garde ce pluriel et convient au registre de la prière.
- source_word: αἰνέσεις
  choice: paroles de louange
  rationale: Le grec emploie un pluriel. « Paroles de louange » sonne naturellement avec l’image de la bouche tout en évitant le tour français plus raide « des louanges dans la bouche ».
- source_word: καταπεπτωκότων
  choice: ceux qui sont abattus
  rationale: Le participe parfait décrit des personnes tombées et demeurant dans un état d’accablement. « Abattus » rend ici ce sens sans imposer l’idée d’une chute uniquement physique.
- source_word: συντετριμμένων τὰς ψυχάς
  choice: dont l’âme est brisée
  rationale: Cette formulation naturelle conserve explicitement ψυχή, « âme », ainsi que l’image forte de l’écrasement ou du brisement intérieur.
- source_word: ποιήσας ἡμῖν εἰρήνην
  choice: en établissant la paix pour nous
  rationale: Le participe aoriste est rattaché à la demande adressée à Dieu. « En établissant » conserve la subordination participiale tout en exprimant une action divine qui rend possible la louange.
theological_decisions:
- issue: Complément implicite de προκαταλαβέτωσαν
  choice: ne pas ajouter « nous » dans le texte principal
  alternative: « Que tes compassions viennent vite au-devant de nous »
  rationale: Dans le texte grec fourni, contrairement à une formule apparentée du Psaume 78.8 LXX, aucun ἡμᾶς n’est exprimé. L’absence est respectée plutôt que comblée silencieusement.
- issue: Terme anthropologique ψυχή
  choice: âme
  alternative: être intérieur
  rationale: « Âme » traduit directement ψυχή et préserve l’image du texte sans définir une anthropologie technique.
- issue: Valeur de ποιήσας
  choice: 'action associée à la requête : « en établissant »'
  alternative: 'action antérieure : « après avoir établi »'
  rationale: L’aoriste participial peut être compris comme antérieur, mais, dans cette prière, il peut aussi accompagner la demande principale. Le texte principal garde ce lien sans transformer le participe en impératif autonome.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. Le tutoiement correspond à l’adresse directe à Dieu. La ponctuation distingue les deux demandes, tandis que les notes préservent les ambiguïtés lexicales et participiales du grec.
