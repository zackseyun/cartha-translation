  terminology: « Compassions » préserve le pluriel de οἰκτιρμοί; « paroles de louange » rend bien αἰνέσεις dans l'image de la bouche; « âme » traduit explicitement ψυχή sans imposer une anthropologie doctrinale. « Faire la paix » maintient l'image de ποιεῖν εἰρήνην plus près que « établir », tout en pouvant être éclairé par note.
