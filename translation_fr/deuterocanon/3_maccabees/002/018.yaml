  text: wipe away our sins[a], and scatter our errors[c][b], and let your mercy shine forth at this hour.
translation:
  language: fr
  text: Efface nos péchés[a], disperse nos égarements[b], et fais resplendir ta miséricorde en cette heure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fais disparaître nos péchés » ; le verbe grec évoque le fait d’essuyer ou d’effacer.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut aussi désigner nos erreurs, nos folies ou nos défaillances.
    reason: lexical_alternative
  - marker: c
    text: Ou « à cette heure » ; on peut aussi traduire la proposition précédente par « manifeste ta miséricorde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάλειψον
  choice: Efface
  rationale: L’impératif exprime l’action d’essuyer ou d’effacer complètement. « Efface » conserve l’image tout en étant naturel dans une prière française.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: nos péchés
  rationale: « Péchés » garde la portée morale et religieuse habituelle de ἁμαρτία dans cette confession.
- source_word: διασκέδασον
  choice: disperse
  rationale: Le verbe signifie éparpiller ou disperser. « Disperse » préserve cette métaphore appliquée aux égarements.
- source_word: τὰς ἀμβλακίας ἡμῶν
  choice: nos égarements
  rationale: Le terme rare ἀμβλακία peut désigner des erreurs, des sottises ou des défaillances coupables. « Égarements » convient au contexte pénitentiel sans réduire le sens à une erreur intellectuelle.
- source_word: ἐπίφανον
  choice: fais resplendir
  rationale: L’impératif peut signifier faire apparaître ou manifester, avec une nuance lumineuse. « Fais resplendir » conserve cette image épiphanique.
- source_word: τὸ ἔλεός σου
  choice: ta miséricorde
  rationale: « Miséricorde » rend le sens de ἔλεος dans une supplication adressée à Dieu et appartient à un français religieux actuel et intelligible.
- source_word: κατὰ τὴν ὥραν ταύτην
  choice: en cette heure
  rationale: Cette formulation directe garde à la fois la précision temporelle et l’urgence solennelle de la prière.
theological_decisions:
- issue: Rapport entre ἁμαρτίας et ἀμβλακίας
  choice: Rendre les deux termes distinctement par « péchés » et « égarements ».
  alternative: Employer « péchés » et « erreurs », ou assimiler les deux à des fautes.
  rationale: Le grec accumule deux mots différents. Les distinguer préserve la texture de la confession sans leur attribuer une différence doctrinale technique.
- issue: Force imagée de ἐπίφανον appliqué à la miséricorde divine
  choice: Conserver l’image lumineuse avec « fais resplendir ».
  alternative: Traduire plus sobrement par « manifeste » ou « fais paraître ».
  rationale: Le choix retenu respecte la valeur possible de manifestation éclatante sans définir la manière dont la miséricorde intervient.
translation_notes:
  register: Prière solennelle en français moderne international. Les impératifs restent directs et parallèles ; le vocabulaire est digne, accessible et conserve les images d’effacement, de dispersion et de lumière.
