  naturalness: 'Le français du projet est globalement naturel et de registre approprié. La révision simplifie toutefois la succession « ... contre ... : tu l’as mis ... et ... », dont le rapport syntaxique est moins net, en une phrase fluide qui conserve l’ordre logique des actions.'
  terminology: « Audacieux », « réduit en esclavage », « peuple saint », « châtiments », « puissance » et « force » conviennent. La répétition de « fait connaître » est conservée, ainsi que la distinction lexicale entre puissance et force.
