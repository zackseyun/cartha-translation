  to: C’est toi qui as fait connaître ta puissance après avoir mis à l’épreuve l’audacieux Pharaon[a], qui avait réduit en esclavage ton peuple saint, Israël, par de nombreux et divers châtiments[b] ; par ces châtiments, tu as fait connaître ta grande force.
