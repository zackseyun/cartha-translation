  yaml_path: translation/deuterocanon/3_maccabees/002/005.yaml
  text: You made known your power against the bold Pharaoh, when he had enslaved your holy people Israel, testing him with varied and many punishments; by these you made known your great might.
translation:
  language: fr
  text: C’est toi qui as fait connaître ta puissance après avoir mis à l’épreuve l’audacieux Pharaon[a], qui avait réduit en esclavage ton peuple saint, Israël, par de nombreux et divers châtiments[b] ; par ces châtiments, tu as fait connaître ta grande force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arrogant Pharaon ». Le terme grec peut désigner une audace insolente ou présomptueuse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’ayant mis à l’épreuve par des châtiments divers et nombreux ». Cette expression peut évoquer les jugements successifs par lesquels Pharaon a été éprouvé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρασὺν
  choice: audacieux
  rationale: Le terme exprime ici une hardiesse à nuance défavorable. « Audacieux » préserve cette nuance sans imposer le sens plus explicite d’« arrogant » ou d’« insolent ».
- source_word: καταδουλωσάμενον
  choice: avait réduit en esclavage
  rationale: Le participe désigne l’action antérieure de Pharaon et exprime clairement l’asservissement d’Israël.
- source_word: λαόν σου τὸν ἅγιον Ἰσραήλ
  choice: ton peuple saint, Israël
  rationale: La formulation conserve explicitement λαός et ἅγιος, tandis qu’« Israël » est présenté en apposition.
- source_word: ποικίλαις καὶ πολλαῖς
  choice: nombreux et variés
  rationale: Les deux adjectifs sont maintenus afin de préserver l’insistance grecque, dans un ordre naturel en français.
- source_word: δοκιμάσας
  choice: tu l’as mis à l’épreuve
  rationale: Cette expression conserve l’idée littérale d’éprouver ou de tester, au lieu de la réduire à celle de punir; le pronom renvoie à Pharaon.
- source_word: τιμωρίαις
  choice: châtiments
  rationale: Le mot désigne ici des sanctions divines; « châtiments » convient au registre digne de la prière et au contexte des plaies d’Égypte.
- source_word: ἐγνώρισας
  choice: as fait connaître
  rationale: La même expression est retenue aux deux occurrences pour préserver la répétition et la valeur factitive du verbe.
- source_word: δύναμιν
  choice: puissance
  rationale: Le terme évoque la puissance divine effectivement manifestée dans le jugement.
- source_word: κράτος
  choice: force
  rationale: « Force » maintient une distinction lexicale avec δύναμις, rendu par « puissance », tout en exprimant la vigueur souveraine de Dieu.
- source_word: ἐφʼ αἷς
  choice: par eux
  rationale: Le pronom reprend naturellement les châtiments, considérés comme le moyen par lequel Dieu a fait connaître sa grande force.
theological_decisions:
- issue: Référent et portée des deux occurrences de ἐγνώρισας
  choice: Les deux verbes décrivent Dieu faisant connaître publiquement sa puissance et sa force au moyen des châtiments infligés à Pharaon.
  alternative: Comprendre l’une des occurrences dans le sens plus simple de « connaître » ou varier la traduction par « montrer ».
  rationale: Dans cette prière, l’Exode est rappelé comme une manifestation publique de la puissance divine. La répétition française respecte celle du grec sans introduire un changement de sens.
- issue: Nuance morale de θρασὺν
  choice: audacieux
  alternative: arrogant; insolent; présomptueux
  rationale: Le contexte donne au mot une valeur négative, mais « audacieux » laisse cette condamnation découler du récit plutôt que de la renforcer explicitement.
- issue: Sens de δοκιμάσας associé aux châtiments
  choice: mis à l’épreuve par des châtiments
  alternative: puni de châtiments; éprouvé au moyen de sanctions
  rationale: La traduction garde la tension du grec entre mise à l’épreuve et punition, sans réduire le participe à une simple action punitive.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la forme de l’adresse à Dieu et la répétition rhétorique du grec. Les marqueurs [a] et [b] figurent dans le texte principal.
