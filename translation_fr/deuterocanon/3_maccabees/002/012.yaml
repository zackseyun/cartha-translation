  text: 'But look now, holy King: because of our many and great sins we are being oppressed, and we have been subjected to our enemies, and we are left in weakness.'
translation:
  language: fr
  text: Mais voici maintenant, ô Roi saint, à cause de nos péchés nombreux et graves, nous sommes accablés, nous avons été soumis à nos ennemis et nous demeurons sans force.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  choice: Mais maintenant
  rationale: Dans cette prière, la formule introduit avec insistance le contraste avec ce qui précède. Une traduction littérale par « voici » serait possible, mais moins naturelle ici en français.
- source_word: ἅγιε Βασιλεῦ
  choice: ô Roi saint
  rationale: Le vocatif est rendu explicitement par « ô », dans un registre de prière digne et naturel.
- source_word: καταπονούμεθα
  choice: nous sommes accablés
  rationale: Le verbe exprime l'idée d'être durement éprouvé, opprimé ou épuisé; « accablés » conserve cette ampleur sans surspécifier la forme de la détresse.
- source_word: ὑπετάγημεν
  choice: nous avons été soumis
  rationale: Le passif aoriste indique qu'ils ont été placés sous l'autorité ou la domination de leurs ennemis.
- source_word: παρείμεθα ἐν ἀδυναμίαις
  choice: nous demeurons sans force
  rationale: L'expression décrit un état d'affaiblissement ou d'impuissance. Cette formulation française est naturelle tout en gardant la portée générale du pluriel grec.
theological_decisions:
- issue: Lien entre les péchés du peuple et sa détresse
  choice: à cause de nos péchés nombreux et graves
  alternative: en raison de nos nombreux et grands péchés
  rationale: Le rapport causal explicite du grec est conservé sans atténuer la confession collective ni ajouter une interprétation doctrinale.
translation_notes:
  register: 'Français international moderne, solennel mais accessible. La syntaxe coordonnée du grec est légèrement fluidifiée sans supprimer la progression: accablement, soumission aux ennemis, absence de force.'
