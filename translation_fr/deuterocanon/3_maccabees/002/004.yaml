base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/004.yaml
  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
translation:
  language: fr
  text: Tu as consumé par le feu et le soufre les habitants de Sodome qui agissaient avec arrogance et que leurs actes mauvais avaient rendus méconnaissables[a], faisant d’eux un exemple pour ceux qui viendraient après.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est condensé et difficile. Le mot traduit par « méconnaissables » signifie normalement « non manifestes, indistincts ». Certains comprennent toutefois ici : « devenus manifestes — ou notoires — par leurs méfaits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερηφανίαν ἐργαζομένους
  choice: qui agissaient avec arrogance
  rationale: La tournure exprime une conduite habituelle marquée par l’orgueil et l’insolence. Cette formulation est naturelle en français tout en conservant la portée morale du grec.
- source_word: Σοδομίτας
  choice: les habitants de Sodome
  rationale: L’ethnique désigne ici les gens de Sodome. « Les habitants de Sodome » évite les connotations spécialisées que « Sodomites » peut avoir en français moderne.
- source_word: ἀδήλους ταῖς κακίαις γενομένους
  choice: que leurs actes mauvais avaient rendus méconnaissables
  rationale: Le sens ordinaire de ἄδηλος est « non manifeste, indistinct, méconnaissable ». La construction grecque est condensée et difficile ; cette traduction suit le texte transmis sans adopter silencieusement le sens conjectural « notoires ».
- source_word: πυρὶ καὶ θείῳ
  choice: par le feu et le soufre
  rationale: « Soufre » est l’équivalent français courant et précis de θείον, tout en conservant l’écho du jugement de Sodome.
- source_word: κατέφλεξας
  choice: as consumé
  rationale: Le verbe indique une destruction complète par le feu. « Consumer » rend cette intensité dans un registre digne et naturel.
- source_word: παράδειγμα
  choice: un exemple
  rationale: Le mot désigne un cas donné en exemple ; dans ce contexte de jugement, sa valeur d’avertissement ressort sans ajout explicatif.
- source_word: τοῖς ἐπιγινομένοις
  choice: pour ceux qui viendraient après
  rationale: Le participe désigne les personnes postérieures, sans imposer la précision interprétative « générations ».
theological_decisions:
- issue: Décrire le jugement de Sodome sans importer des interprétations doctrinales ultérieures
  choice: Le texte présente les habitants de Sodome comme arrogants et auteurs d’actes mauvais.
  alternative: Préciser une catégorie particulière de péché non nommée dans ce verset.
  rationale: Le grec mentionne l’arrogance et les actes mauvais en général. La traduction n’ajoute aucune identification doctrinale ou culturelle absente du verset.
- issue: Interprétation de la formule difficile ἀδήλους ταῖς κακίαις γενομένους
  choice: Retenir le sens lexical ordinaire de ἄδηλος, « rendus méconnaissables », et signaler l’incertitude en note.
  alternative: Traduire « devenus notoires par leurs méfaits » ou « manifestes par leur méchanceté ».
  rationale: Le texte grec transmis paraît tendu, puisque ἄδηλος signifie normalement « non visible, indistinct ». Il convient de préserver cette difficulté plutôt que de la résoudre silencieusement.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la forme d’une prière adressée directement à Dieu. « Habitants de Sodome » est préféré à « Sodomites » afin d’éviter une connotation moderne étrangère au propos explicite du verset.
