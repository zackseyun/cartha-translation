review_pass:
  verdict: revise
  source_fidelity: La proposition principale et les autres participes sont bien rendus. Toutefois, « que leurs actes mauvais avaient rendus méconnaissables » transforme γενομένους (« étant/devenus ») en une construction passive causative et ne rend pas clairement le datif ταῖς κακίαις. Le texte transmis est difficile; il convient de conserver son sens ordinaire sans le lisser dans le texte courant.
  naturalness: « Rendus méconnaissables » appliqué aux habitants de Sodome est peu naturel et suggère une altération de leur apparence ou de leur identité. « Devenus obscurs par leurs méfaits » suit plus directement le grec, tout en demeurant volontairement étrange, difficulté explicitée en note.
  terminology: « Habitants de Sodome », « arrogance », « feu et soufre », « exemple » et « ceux qui viendraient après » sont des choix justes, modernes et exempts de connotations ajoutées. « Méfaits » est plus idiomatique que « actes mauvais » dans ce contexte.
  issues:
  - severity: medium
    issue: La formule « que leurs actes mauvais avaient rendus méconnaissables » ne respecte pas exactement la syntaxe de ἀδήλους ταῖς κακίαις γενομένους.
    rationale: γενομένους est un participe de γίνομαι, « devenus/étant devenus », et non un passif signifiant « rendus ». Le datif ταῖς κακίαις est rendu plus fidèlement par « par leurs méfaits ». La leçon transmise reste sémantiquement malaisée et doit être signalée plutôt que résolue sans note.
  revised_text: Tu as consumé par le feu et le soufre les habitants de Sodome, qui pratiquaient l’arrogance et étaient devenus obscurs par leurs méfaits[a], faisant d’eux un exemple pour ceux qui viendraient après.
  revised_footnotes:
  - marker: a
    text: 'Le grec est condensé et difficile. Le mot traduit par « obscurs » signifie habituellement « non manifestes, inconnus ou indistincts ». Plusieurs comprennent néanmoins la phrase, probablement à la lumière d’une leçon ou d’une interprétation différente, comme : « devenus manifestes » ou « notoires par leurs méfaits ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace une tournure passive et causalement surinterprétée par une formulation qui suit la valeur de γενομένους et du datif ταῖς κακίαις. Elle maintient dans le texte la difficulté de la leçon grecque transmise et fournit en note l’interprétation contextuelle plus fluide, sans l’imposer.
