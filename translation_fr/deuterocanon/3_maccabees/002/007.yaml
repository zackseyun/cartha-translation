  text: Eux aussi, lorsqu’ils virent les œuvres de ta main, te louèrent, toi, le Tout-Puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ καὶ
  choice: Eux aussi
  rationale: Cette tournure reprend un groupe déjà mentionné et conserve la valeur additive de καί dans un français naturel.
- source_word: συνιδόντες
  choice: lorsqu’ils virent
  rationale: Le participe aoriste de συνοράω exprime ici la perception ou la constatation; la proposition temporelle rend clairement son rapport avec le verbe principal.
- source_word: ἔργα σῆς χειρός
  choice: les œuvres de ta main
  rationale: Cette formulation conserve l’anthropomorphisme biblique de la main comme expression de l’action divine, sans le réduire explicitement à la puissance.
- source_word: ἤνεσάν σε
  choice: te louèrent
  rationale: Le verbe αἰνέω signifie couramment louer; le pronom maintient l’adresse directe du grec.
- source_word: τὸν παντοκράτορα
  choice: toi, le Tout-Puissant
  rationale: « Le Tout-Puissant » est l’équivalent français établi du titre παντοκράτωρ; « toi » explicite naturellement l’apposition au pronom objet σε.
theological_decisions:
- issue: Rendu du titre divin παντοκράτωρ
  choice: le Tout-Puissant
  alternative: le Souverain de tout
  rationale: Le choix retenu exprime la puissance universelle de Dieu et respecte l’emploi traditionnel du titre sans ajouter de précision doctrinale absente du grec.
translation_notes:
  register: Français moderne, digne et accessible. La structure participiale grecque est rendue par une proposition temporelle naturelle; l’image biblique de « ta main » et l’apposition solennelle du titre divin sont conservées.
