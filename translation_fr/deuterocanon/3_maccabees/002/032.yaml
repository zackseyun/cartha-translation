  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
translation:
  language: fr
  text: Mais la plupart d’entre eux, animés d’un noble courage, ne s’écartèrent pas de la piété et, échangeant leurs biens pour sauver leur vie, estimaient avec assurance pouvoir se soustraire aux registres d’inscription[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit des registres officiels mentionnés dans le contexte, utilisés pour identifier les Juifs soumis aux mesures oppressives du roi.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Mais la plupart
  rationale: πλεῖστοι désigne ici la majorité du groupe et δέ marque le contraste avec ceux qui ont cédé dans le contexte précédent.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: affermis par un noble courage
  rationale: Le datif exprime la disposition intérieure dans laquelle ils se montrèrent forts. « Noble courage » rend naturellement γενναία ψυχή sans faire de ψυχή une affirmation sur la nature métaphysique de l’âme.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: ne s’écartèrent pas de la piété
  rationale: διίστημι avec le génitif exprime l’éloignement ou la séparation. « Piété » désigne ici la fidélité religieuse envers Dieu, et non une simple moralité.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: Échangeant leurs biens contre leur vie
  rationale: χρήματα couvre les ressources ou les biens, pas seulement l’argent liquide. L’expression décrit le prix consenti afin de préserver la vie. La ponctuation en deux phrases évite de présenter cet échange comme le moyen même d’abandonner la piété, lecture que la syntaxe grecque n’impose pas et que le contexte rend peu probable.
- source_word: ἀδέως ἐτιμῶντο
  choice: ils estimaient pouvoir, sans crainte
  rationale: Le moyen ἐτιμῶντο exprime leur propre appréciation ou estimation; il ne requiert pas l’idée de « se juger dignes ». ἀδέως indique l’absence de crainte ou le sentiment de sécurité.
- source_word: ἑαυτοὺς ῥύσασθαι ἐκ τῶν ἀπογραφῶν
  choice: se soustraire aux listes d’inscription
  rationale: ῥύομαι signifie délivrer, préserver ou tirer hors de; ἀπογραφαί désigne les inscriptions ou recensements officiels. « Se soustraire » convient à leur tentative d’échapper à l’enregistrement.
theological_decisions:
- issue: Sens de εὐσέβεια dans un contexte de persécution des Juifs
  choice: piété
  alternative: fidélité envers Dieu; attachement religieux
  rationale: « Piété » conserve le sens d’une dévotion religieuse concrète sans introduire de terminologie confessionnelle ultérieure.
- issue: Rapport entre l’échange des biens et l’abandon de la piété
  choice: 'deux propositions successives : ils restent attachés à la piété tout en donnant leurs biens pour préserver leur vie'
  alternative: ils n’abandonnent pas leur piété en échangeant leurs biens contre la vie
  rationale: Le τε attaché à τὰ χρήματα et le contexte favorisent l’enchaînement de deux actions plutôt qu’une construction où l’échange constituerait le moyen d’abandonner la piété. La formulation retenue respecte néanmoins la proximité syntaxique des idées.
- issue: Valeur de ἐτιμῶντο
  choice: estimaient pouvoir
  alternative: se jugeaient dignes de; tenaient pour honorable de
  rationale: Le moyen peut exprimer une évaluation personnelle, mais le grec ne tranche pas nettement entre estimation pratique et valorisation honorifique. « Estimaient pouvoir » évite d’ajouter une notion explicite de mérite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif biblique sans archaïsmes. La phrase grecque a été divisée en deux pour clarifier l’enchaînement tout en préservant sa tension entre fidélité religieuse, sauvegarde de la vie et tentative d’échapper à l’inscription officielle.
