revisions:
- from: Mais la plupart, affermis par un noble courage, ne s’écartèrent pas de la piété. Échangeant leurs biens contre leur vie, ils estimaient pouvoir, sans crainte, se soustraire aux listes d’inscription[a].
  to: Mais la plupart d’entre eux, animés d’un noble courage, ne s’écartèrent pas de la piété et, échangeant leurs biens pour sauver leur vie, estimaient avec assurance pouvoir se soustraire aux registres d’inscription[a].
  rationale: La révision rend l’action active d’ἐνίσχυσαν par « animés d’un noble courage », conserve « piété » pour εὐσέβεια et maintient, dans une seule phrase, le rapport syntaxique entre fidélité religieuse, échange des biens pour préserver la vie et tentative d’échapper aux registres. « Avec assurance » rend ἀδέως sans introduire l’idée plus spécifique d’absence de peur comme état psychologique. « Estimaient pouvoir » demeure une solution prudente pour la valeur évaluative de ἐτιμῶντο, sans imposer « se juger dignes ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:39:17Z'
review_pass:
  verdict: revise
  source_fidelity: La construction participiale doit rester étroitement liée à la persévérance dans la piété et à la tentative d’échapper aux registres. La division actuelle en deux phrases peut faire de l’échange des biens une action simplement successive et insuffisamment reliée à la proposition principale. « Affermis par » rend en outre l’actif ἐνίσχυσαν comme un passif.
  naturalness: Le français est globalement clair et de registre approprié, mais « affermis par un noble courage » est moins idiomatique que « animés d’un noble courage » et la phrase révisée rétablit plus naturellement les liens logiques du grec.
  terminology: « Piété » convient pour εὐσέβεια. « Biens » rend bien χρήματα. « Registres d’inscription » désigne de façon plus naturelle les ἀπογραφαί officielles que « listes d’inscription », sans prétendre décider s’il s’agit techniquement d’un recensement ou d’une simple liste.
  issues:
  - severity: medium
    issue: Valeur active de ἐνίσχυσαν
    rationale: Le verbe est actif et décrit le fait qu’ils prirent force/courage; « affermis » le transforme en participe passif et suggère un agent qui les aurait affermis.
  - severity: medium
    issue: Lien syntaxique de ἀντικαταλλασσόμενοι
    rationale: Le participe présent est intégré à la même séquence que « ne s’écartèrent pas de la piété » et « estimaient pouvoir ». La séparation en une nouvelle phrase affaiblit ce lien et autorise une lecture trop indépendante.
  - severity: low
    issue: Désignation des ἀπογραφαί
    rationale: « Registres d’inscription » conserve l’idée de documents administratifs officiels et s’accorde avec la note culturelle, tout en restant plus idiomatique en français.
  revised_text: Mais la plupart d’entre eux, animés d’un noble courage, ne s’écartèrent pas de la piété et, échangeant leurs biens pour sauver leur vie, estimaient avec assurance pouvoir se soustraire aux registres d’inscription[a].
  revised_footnotes:
