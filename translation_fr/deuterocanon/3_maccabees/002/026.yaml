base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
translation:
  language: fr
  text: Non seulement il était rongé par des débauches éhontées, mais il poussa l’audace au point que des calomnies se répandaient dans les localités[a] et que beaucoup de ses amis, tendant tous leurs efforts vers le projet du roi[b], se conformaient eux aussi à sa volonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les lieux ». L’expression peut aussi désigner les régions ou les districts.'
    reason: La portée géographique de ἐν τοῖς τόποις reste générale et peut recevoir plusieurs formulations françaises.
  - marker: b
    text: 'Ou : « poussant à la réalisation du projet du roi ». Le participe grec exprime un effort dirigé vers ce projet, sans préciser davantage la manière dont il s’exerce.'
    reason: Le sens exact de ἐντείνοντας peut osciller entre l’effort orienté vers le projet et l’action destinée à le faire avancer.
lexical_decisions:
- source_word: ἐδηκέσθη
  choice: était rongé
  rationale: Le verbe évoque littéralement une morsure ou quelque chose qui ronge. « Était rongé » conserve cette image tout en exprimant naturellement l’emprise intérieure du vice.
- source_word: ἀναισχύστοις ἀσελγείαις
  choice: par des débauches éhontées
  rationale: Cette formulation garde le pluriel, la forte condamnation morale et l’idée d’une conduite débridée dépourvue de honte.
- source_word: ἐπὶ τοσοῦτον θράσους προῆλθεν
  choice: il poussa l’audace au point que
  rationale: La tournure française restitue l’escalade exprimée par le mouvement en avant et le degré extrême de hardiesse insolente.
- source_word: δυσφημίας
  choice: des calomnies
  rationale: Le terme désigne ici des paroles malveillantes ou diffamatoires. « Calomnies » convient au contexte social et politique sans introduire l’idée plus précise de blasphème.
- source_word: ἐν τοῖς τόποις
  choice: dans les différentes localités
  rationale: Cette traduction est plus naturelle que le littéral « dans les lieux », tout en laissant ouverte l’étendue géographique exacte; une note signale cette indétermination.
- source_word: συνίστασθαι
  choice: s’organisaient
  rationale: L’infinitif peut évoquer quelque chose qui se constitue, se met en place ou est suscité. « S’organisaient » conserve l’idée d’une activité diffamatoire prenant forme, plutôt que celle d’une simple diffusion.
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  choice: tendant tous leurs efforts vers le projet du roi
  rationale: La formulation préserve l’image d’un effort soutenu orienté vers l’intention arrêtée du roi, sans transformer explicitement les amis en auteurs du projet.
- source_word: ἕπεσθαι τῇ ἐκείνου θελήσει
  choice: se conformaient eux aussi à sa volonté
  rationale: « Se conformer à » rend naturellement l’idée de suivre la volonté de quelqu’un. Le possessif renvoie au roi, antécédent le plus proche et le plus vraisemblable.
theological_decisions:
- issue: Force de la caractérisation morale du souverain
  choice: « des débauches éhontées »
  alternative: « des comportements immoraux »
  rationale: Le grec emploie un vocabulaire fortement réprobateur. La traduction en conserve la vigueur sans ajouter de catégorie doctrinale absente du texte.
- issue: Référent de ἐκείνου dans la dernière proposition
  choice: 'Le pronom renvoie au roi : « sa volonté ».'
  alternative: Le rattacher à un autre homme implicitement évoqué.
  rationale: Le roi est l’antécédent explicite qui domine immédiatement la proposition. Cette lecture est syntaxiquement la plus naturelle, tout en n’engageant aucune doctrine particulière.
- issue: Nature des δυσφημίαι
  choice: « calomnies » au sens de propos diffamatoires
  alternative: « blasphèmes »
  rationale: Le contexte ne donne pas explicitement à ces paroles une cible divine. Traduire par « blasphèmes » préciserait indûment leur nature religieuse.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase longue du grec est conservée sous une forme fluide. « Rongé », « débauches éhontées » et « poussa l’audace » maintiennent la vigueur rhétorique du passage; les notes préservent les deux principales ambiguïtés lexicales sans alourdir le texte.
