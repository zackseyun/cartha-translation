  - severity: low
    issue: Valeur de καί affaiblie
    rationale: Dans μὴ καὶ τὸ ζῆν ἐκλείπῃ, καί a le sens de « même ». « La vie elle-même » est possible, mais « même la vie » est plus direct et plus proche du grec.
