  text: Therefore his friends and bodyguards[a], seeing the acute distress that had come upon him, hurried to set matters straight[b], fearing that even his life might fail.
translation:
  language: fr
  text: C’est pourquoi ses amis et ses gardes du corps, voyant le malaise aigu qui s’était emparé de lui[a], prirent des mesures pour y remédier, car ils craignaient que même la vie ne vienne à lui manquer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voyant le mal aigu qui l’avait saisi ». Le grec évoque un état soudain et grave sans en préciser exactement la nature.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que même le vivre ne vienne à manquer », c’est-à-dire qu’il ne meure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de la scène précédente.
- source_word: φίλοι
  choice: amis
  rationale: Conserve le sens premier du terme grec sans imposer le sens plus spécialisé de « courtisans », bien que le contexte soit royal.
- source_word: σωματοφύλακες
  choice: gardes du corps
  rationale: Équivalent français direct et idiomatique du terme grec désignant ceux qui protègent personnellement le souverain.
- source_word: ὀξεῖαν ἰδόντες τὴν καταλαβοῦσαν αὐτόν
  choice: voyant la grave crise qui s’était emparée de lui
  rationale: La construction présente comme aiguë ou violente la condition soudaine qui a saisi le roi, sans en préciser la nature. « Crise » rend cette indétermination de façon naturelle.
- source_word: εὔθυναν
  choice: prirent des mesures pour y remédier
  rationale: Le verbe signifie ici redresser ou corriger la situation. Cette formulation française exprime l’action corrective sans ajouter de mesure précise absente du grec.
- source_word: φοβούμενοι
  choice: car ils craignaient
  rationale: Transforme le participe causal en proposition française fluide tout en conservant le motif de leur intervention.
- source_word: μὴ καὶ τὸ ζῆν ἐκλείπῃ
  choice: que la vie elle-même ne l’abandonne
  rationale: Préserve l’image grecque d’une vie qui vient à manquer ou cesse, plutôt que de l’aplatir entièrement en « qu’il meure ».
