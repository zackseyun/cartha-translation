  text: There the God who watches over all[a], the holy ancestor among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness,
translation:
  language: fr
  text: Là, le Dieu qui veille sur tous, l’ancêtre saint parmi les saints[a], ayant entendu la supplication légitime, flagella celui qui s’était démesurément enflé d’insolence et d’audace,
  philosophy: optimal-equivalence
  footnotes:
