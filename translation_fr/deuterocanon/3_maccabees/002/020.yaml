lexical_decisions:
- source_word: Ἐνταῦθα
  choice: Alors
  rationale: Dans ce récit, l’adverbe peut désigner le point de la scène où Dieu intervient. « Alors » rend naturellement en français cette articulation narrative tout en gardant une possible nuance locale.
- source_word: ὁ πάντων ἐπόπτης θεὸς
  choice: Dieu, qui veille sur tous
  rationale: ἐπόπτης désigne celui qui regarde, surveille ou veille. La tournure verbale est naturelle et exprime la vigilance souveraine de Dieu sans employer le terme institutionnel « surveillant ».
- source_word: προπάτωρ
  choice: ancêtre
  rationale: Le mot désigne littéralement un ancêtre ou aïeul. « Ancêtre » conserve l’étrange épithète familiale du grec sans la remplacer par la formule plus familière mais absente « Dieu de nos pères ».
- source_word: ἅγιος ἐν ἁγίοις
  choice: saint ... parmi les saints
  rationale: Cette lecture rattache l’expression à la description personnelle de Dieu et demeure proche de sa syntaxe condensée. La possibilité cultuelle « dans les lieux/choses saints » est signalée en note.
- source_word: εἰσακούσας
  choice: entendit
  rationale: Le participe aoriste indique que Dieu entend favorablement la prière avant d’intervenir. Une coordination par un verbe conjugué donne ici un français plus fluide sans modifier la relation logique.
- source_word: εὐθέσμου λιτανείας
  choice: cette supplication conforme à la Loi
  rationale: λιτανεία est une prière instante; εὔθεσμος évoque ce qui est conforme à la loi, à la règle ou au bon ordre. « Conforme à la Loi » garde la portée normative dans un langage naturel.
- source_word: ἐμάστιξεν
  choice: frappa comme d’un fouet
  rationale: Le verbe signifie littéralement fouetter ou flageller et peut décrire figurément un châtiment divin. Cette formulation conserve l’image vive tout en restant claire en français moderne.
- source_word: ὕβρει καὶ θράσει
  choice: d’insolence et d’audace
  rationale: ὕβρις exprime l’arrogance outrageante; θράσος désigne ici une hardiesse présomptueuse. « Audace » porte plus clairement cette valeur négative que « hardiesse ».
- source_word: μεγάλως ἐπηρμένον
  choice: s’était démesurément enflé
  rationale: Le participe évoque quelqu’un qui s’est élevé ou gonflé d’orgueil; μεγάλως en marque l’intensité. « Démesurément enflé » préserve cette image.
theological_decisions:
- issue: Titre ancestral appliqué à Dieu
  choice: Conserver l’épithète inhabituelle « ancêtre »
  alternative: « Dieu de nos pères » ou « père de nos ancêtres »
  rationale: Le grec porte θεὸς καὶ προπάτωρ et non la formule traditionnelle « Dieu de nos pères ». La traduction évite donc d’introduire une formulation théologique plus connue mais non exprimée.
- issue: Sens de ἅγιος ἐν ἁγίοις
  choice: « saint ... parmi les saints »
  alternative: « saint dans les lieux saints » ou « saint dans les choses saintes »
  rationale: La syntaxe permet de comprendre l’expression comme une qualification personnelle de Dieu parmi les êtres saints, mais une nuance cultuelle ou locale demeure réellement possible et doit être conservée en note.
- issue: Nature du châtiment divin exprimé par ἐμάστιξεν
  choice: Maintenir l’image du fouet sans préciser la forme concrète du châtiment
  alternative: « punit » ou « frappa »
  rationale: Le texte emploie une métaphore punitive forte, mais ne décrit pas encore ici son mécanisme. La traduction ne doit ni l’aplatir en « punit », ni en faire nécessairement une flagellation matérielle.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase garde la virgule finale du verset source, qui se poursuit syntaxiquement au verset suivant. « Ancêtre » est volontairement inhabituel afin de préserver l’épithète grecque; la note maintient l’ambiguïté de l’expression cultuelle.
