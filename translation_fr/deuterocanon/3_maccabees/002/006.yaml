  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
translation:
  language: fr
  text: Et lorsqu’il le poursuivit avec des chars et une foule nombreuse[a], tu le submergeas dans les profondeurs de la mer ; mais ceux qui avaient mis leur confiance en toi, toi qui règnes sur toute la création[b], tu les fis passer sains et saufs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ce verset fait allusion à l’Exode : le poursuivant égyptien fut englouti dans la mer, tandis que le peuple de Dieu la traversa sain et sauf.'
    reason: cross_reference
  - marker: b
    text: 'Autre traduction : « toi, le souverain de toute la création ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδιώξαντα
  choice: se lança à sa poursuite
  rationale: Le participe exprime une poursuite active et hostile. Cette tournure française en restitue l’élan sans expliciter l’identité du poursuivant.
- source_word: σὺν ἅρμασιν καὶ ὄχλων πλήθει
  choice: avec des chars et une foule nombreuse
  rationale: « Chars » traduit directement ἅρμασιν, tandis que « une foule nombreuse » rend naturellement l’idée de masse contenue dans ὄχλων πλήθει.
- source_word: ἐπέκλυσας
  choice: tu le submergeas
  rationale: Le verbe évoque l’action des eaux qui recouvrent entièrement. « Submerger » convient précisément au contexte maritime et à l’acte de jugement.
- source_word: βάθει θαλάσσης
  choice: dans les profondeurs de la mer
  rationale: La formule garde la dimension locative et l’image du gouffre marin, sans trancher excessivement entre lieu et moyen.
- source_word: ἐμπιστεύσαντας ἐπὶ σοὶ
  choice: ceux qui avaient mis leur confiance en toi
  rationale: Cette expression française rend le fait de placer sa confiance en quelqu’un et conserve la nuance personnelle de la construction grecque.
- source_word: τῷ τῆς ἁπάσης κτίσεως δυναστεύοντι
  choice: qui exerces ta souveraineté sur toute la création
  rationale: Le participe δυναστεύοντι désigne l’exercice effectif de la domination. La proposition relative se rattache clairement au « toi » qui désigne Dieu.
- source_word: σώους διεκόμισας
  choice: tu les fis passer sains et saufs
  rationale: La traduction réunit l’idée de passage ou de traversée portée par διακομίζω et celle de préservation sans dommage exprimée par σώους.
theological_decisions:
- issue: Identification de l’allusion historique et biblique
  choice: Conserver dans le texte les pronoms sans nommer le poursuivant ni les personnes délivrées.
  alternative: Insérer explicitement « Pharaon » et « Israël ».
  rationale: Le grec évoque l’Exode sans nommer ici les protagonistes. Garder cette référence implicite respecte la formulation de la source, tandis que la note peut éclairer l’allusion.
- issue: Expression de la domination universelle de Dieu
  choice: « qui exerces ta souveraineté sur toute la création »
  alternative: « le souverain de toute la création »
  rationale: La relative conserve la valeur verbale de δυναστεύω et son rattachement grammatical à Dieu, sans ajouter de titre doctrinal absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit solennel enchâssé dans une prière. Les référents implicites du grec sont maintenus, et les deux marqueurs de note figurent dans le texte.
