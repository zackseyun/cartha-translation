  yaml_path: translation/deuterocanon/3_maccabees/002/002.yaml
  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
translation:
  language: fr
  text: Car c’est toi qui as créé toutes choses et qui domines sur tout. Tu es un souverain juste[a], et tu juges ceux qui font quoi que ce soit avec insolence et arrogance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un souverain équitable ». Le grec δίκαιος peut exprimer tant la justice dans le jugement que la droiture morale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  choice: Car c’est toi qui
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que la tournure clivée « c’est toi qui » rend l’insistance du pronom explicite σὺ dans un français naturel.
- source_word: ὁ κτίσας τὰ πάντα
  choice: as créé toutes choses
  rationale: Le participe aoriste substantivé garde ici sa force verbale. « Toutes choses » restitue la portée globale de τὰ πάντα et convient au registre élevé de la prière.
- source_word: τῶν ὅλων ἐπικρατῶν
  choice: qui domines sur tout
  rationale: ἐπικρατέω exprime l’exercice d’une maîtrise ou d’un pouvoir. « Dominer sur » conserve cette nuance active sans introduire un titre théologique absent du grec.
- source_word: δυνάστης
  choice: souverain
  rationale: Le nom désigne celui qui détient et exerce le pouvoir. « Souverain » est digne, actuel et plus précis ici que « puissant ».
- source_word: δίκαιος
  choice: juste
  rationale: En français, « juste » exprime naturellement à la fois la rectitude morale et l’équité judiciaire de Dieu, surtout devant κρίνεις.
- source_word: τοὺς ... τι πράσσοντας
  choice: ceux qui agissent
  rationale: Le participe désigne ceux dont la conduite se caractérise par l’insolence et l’arrogance. « Agissent » est naturel en français; le τι indéfini n’exige pas ici le calque peu idiomatique « font quelque chose ».
- source_word: ὕβρει
  choice: avec insolence
  rationale: Dans cette association avec ἀγερωχία, ὕβρις évoque une conduite outrageusement présomptueuse; « insolence » en restitue clairement la portée morale.
- source_word: ἀγερωχίᾳ
  choice: arrogance
  rationale: Le terme désigne la hauteur et l’orgueil dominateur. « Arrogance » est moderne, clair et distinct d’« insolence ».
- source_word: κρίνεις
  choice: tu juges
  rationale: « Juger » préserve la portée judiciaire générale de κρίνω sans imposer le résultat plus fort de « condamner ».
theological_decisions:
- issue: Rendu de δίκαιος appliqué au souverain qui juge
  choice: juste
  alternative: droit; souverain qui agit avec justice
  rationale: « Juste » garde en français la largeur morale et judiciaire de δίκαιος sans réduire le terme à la seule impartialité juridique. La note signale une reformulation possible plutôt qu’une divergence doctrinale.
translation_notes:
  register: Français international moderne, digne et adapté à une prière. La structure en deux phrases évite une période trop lourde tout en conservant l’enchaînement logique du grec.
