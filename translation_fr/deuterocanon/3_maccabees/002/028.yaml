base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and servant status[c][b], and let those who object be taken by force and put to death.
translation:
  language: fr
  text: Que personne parmi ceux qui n’offrent pas de sacrifices n’entre dans leurs sanctuaires[a]. Que tous les Juifs soient soumis à un enregistrement administratif[b] et réduits à la condition d’esclaves, et que ceux qui s’y opposent soient emmenés de force et mis à mort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs lieux sacrés ». Le grec peut désigner des sanctuaires ou, plus largement, des réalités sacrées.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut désigner plus précisément une inscription administrative de la population à des fins de contrôle ou d’imposition.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « retirés de la vie » ou « écartés de la vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδένα τῶν μὴ θυόντων
  choice: Que personne parmi ceux qui n’offrent pas de sacrifices
  rationale: Dans le contexte d’un décret, l’infinitif a valeur impérative. Le participe présent désigne ceux qui ne participent pas aux sacrifices cultuels.
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν εἰσιέναι
  choice: n’entre dans leurs sanctuaires
  rationale: 'Avec εἰσιέναι, l’expression est naturellement comprise dans un sens spatial : entrer dans les lieux sacrés. τὰ ἱερά garde toutefois une certaine amplitude sémantique, signalée en note.'
- source_word: λαογραφίαν
  choice: recensement
  rationale: Le terme désigne l’inscription officielle de la population, notamment à des fins de contrôle administratif ou fiscal. « Recensement » est clair sans préciser abusivement la finalité.
- source_word: οἰκετικὴν διάθεσιν
  choice: condition d’esclaves
  rationale: L’expression impose un statut propre aux serviteurs domestiques ou aux esclaves. Cette formulation restitue clairement l’abaissement juridique et social sans limiter le texte à une forme précise d’esclavage domestique.
- source_word: ἀχθῆναι
  choice: soient soumis… et réduits
  rationale: Le passif de ἄγω exprime ici l’imposition de deux états. Deux verbes français coordonnés rendent naturellement les compléments, qui appellent des constructions différentes.
- source_word: ἀντιλέγοντας
  choice: ceux qui s’y opposent
  rationale: Le verbe peut exprimer la contradiction ou la résistance. « S’y opposent » convient au contexte coercitif sans réduire le sens à un simple refus verbal.
- source_word: βίᾳ φερομένους
  choice: soient emmenés de force
  rationale: La formule décrit une saisie ou un déplacement forcé. Cette traduction conserve à la fois le mouvement et la contrainte.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: mis à mort
  rationale: Littéralement, l’expression signifie faire passer quelqu’un hors de la vie. « Mis à mort » en restitue clairement le sens idiomatique.
theological_decisions:
- issue: Portée sociale de οἰκετικὴν διάθεσιν
  choice: condition d’esclaves
  alternative: condition servile / servitude domestique
  rationale: Le grec évoque un statut d’assujettissement comparable à celui des esclaves de maison. « Condition d’esclaves » préserve la violence sociale du décret tout en évitant de préciser un régime institutionnel que le verset ne décrit pas.
- issue: Référent de τὰ ἱερά
  choice: leurs sanctuaires
  alternative: leurs choses saintes / leurs rites sacrés
  rationale: La présence du verbe « entrer » favorise le sens spatial de lieux ou d’enceintes sacrés, mais la polysémie du substantif est conservée dans une note plutôt que supprimée.
translation_notes:
  register: Français international actuel, digne et direct. La formulation garde le style prescriptif du décret par la répétition de « Que… ». « Condition d’esclaves » évite l’euphémisme, tandis que les notes préservent les ambiguïtés lexicales réelles.
