  source_fidelity: 'Le sens général du décret est fidèlement rendu : exclusion des non-sacrifiants, enregistrement et abaissement au statut d’esclaves des Juifs, puis mise à mort des opposants. « Sanctuaires » est une interprétation spatiale recevable de τὰ ἱερά avec εἰσιέναι, et la note conserve l’amplitude du terme. « Recensement » est possible pour λαογραφία, bien que le mot grec souligne plutôt l’inscription/enregistrement administratif. La note c doit toutefois être corrigée : τοῦ ζῇν μεταστῆσαι signifie littéralement « retirer/faire sortir de la vie », et non un passif « écartés de la vie ».'
  naturalness: Le français est moderne, clair et conserve efficacement le ton prescriptif par la répétition de « Que ». « Soumis au recensement » est intelligible, mais « enregistrement administratif » reflète plus précisément l’acte imposé et évite d’évoquer seulement l’opération statistique d’un recensement. « Réduits à la condition d’esclaves » est naturel et suffisamment explicite.
  terminology: « Sanctuaires », « sacrifices », « condition d’esclaves » et « mis à mort » sont appropriés au registre et au contexte. « Condition d’esclaves » évite d’atténuer la coercition sociale de οἰκετικὴ διάθεσις sans imposer une reconstruction institutionnelle trop précise.
