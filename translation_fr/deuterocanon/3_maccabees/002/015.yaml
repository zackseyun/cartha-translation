  text: But since you were pleased to display your glory among your people Israel[a], you have sanctified this place.
translation:
  language: fr
  text: Mais puisque tu as voulu manifester ta gloire au milieu de ton peuple Israël[a], tu as sanctifié ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « tu as pris plaisir à ta gloire au milieu de ton peuple Israël ». Le grec peut conserver le nom « ta gloire » comme complément de « tu as pris plaisir » ; le texte principal en exprime le sens probable dans un français naturel.'
    reason: alternative de traduction lexicale et syntaxique
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec ce qui précède; « Mais » est l’adversatif français le plus direct.
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit ici le fondement de l’appel adressé à Dieu; la valeur causale convient mieux que la valeur temporelle possible.
- source_word: εὐδόκησας
  choice: tu as pris plaisir
  rationale: Rend le sens favorable et affectif de εὐδοκέω tout en conservant la construction avec le complément nominal « ta gloire ».
- source_word: τὴν δόξαν σου
  choice: à ta gloire
  rationale: Conserve directement le groupe nominal grec plutôt que d’expliciter une manifestation de la gloire que le texte ne formule pas expressément.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: au milieu de ton peuple Israël
  rationale: Exprime naturellement la sphère relationnelle ou communautaire indiquée par ἐν.
- source_word: ἡγίασας
  choice: tu as sanctifié
  rationale: « Sanctifier » est précis, digne et courant dans le registre biblique; il maintient l’acte de rendre ou de déclarer sacré.
- source_word: τὸν τόπον τοῦτον
  choice: ce lieu
  rationale: Équivalent direct et naturel désignant le sanctuaire dans le contexte.
theological_decisions:
- issue: Rapport entre le bon plaisir de Dieu, sa gloire et Israël
  choice: tu as pris plaisir à ta gloire au milieu de ton peuple Israël
  alternative: tu as voulu manifester ta gloire au milieu de ton peuple Israël
  rationale: Le grec présente explicitement « ta gloire » comme complément de εὐδόκησας, sans verbe signifiant « manifester ». La traduction principale préserve cette formulation compacte et sa tension; la note fournit l’interprétation dynamique probable.
- issue: Portée de ἡγίασας appliqué au lieu
  choice: tu as sanctifié ce lieu
  alternative: tu as consacré ce lieu
  rationale: « Sanctifié » maintient le lien lexical avec la sainteté sans préciser davantage si l’accent porte sur la consécration cultuelle ou sur le fait de rendre saint.
translation_notes:
  register: Français international moderne, dans un registre de prière digne. Le tutoiement correspond à l’adresse directe à Dieu. La formulation principale reste proche de la syntaxe grecque afin de ne pas transformer en certitude l’interprétation « manifester ta gloire ».
