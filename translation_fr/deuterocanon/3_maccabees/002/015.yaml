  source_fidelity: Le grec porte littéralement « tu as pris plaisir à ta gloire dans/au milieu de ton peuple Israël ». Toutefois, εὐδοκέω avec l’accusatif de « gloire » dans ce contexte peut exprimer le bon plaisir divin de manifester cette gloire. La formulation française actuelle, « prendre plaisir à sa gloire », est trop opaque et risque d’être comprise comme une autosatisfaction abstraite plutôt que comme l’action évoquée dans la prière. « Tu as voulu manifester ta gloire » rend le sens contextuellement le plus probable, tandis que la note conserve la possibilité plus littérale.
  naturalness: « Mais puisque tu as voulu manifester ta gloire au milieu de ton peuple Israël » est idiomatique en français moderne international et garde le registre digne de la prière. « Tu as sanctifié ce lieu » est naturel dans un registre biblique et rend précisément ἡγίασας.
  terminology: « Manifester ta gloire » respecte le vocabulaire biblique de la gloire divine sans imposer une lecture doctrinale. « Sanctifié » conserve le lien avec la sainteté et ne réduit pas indûment le terme à une seule nuance institutionnelle telle que « consacré ». « Israël » est correctement employé comme apposition à « ton peuple ».
