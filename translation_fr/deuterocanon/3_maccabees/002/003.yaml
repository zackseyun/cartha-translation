base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/003.yaml
  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
translation:
  language: fr
  text: Tu as détruit ceux d’autrefois qui s’étaient livrés à l’injustice — parmi eux se trouvaient des géants qui se fiaient à leur force et à leur audace[a] — en faisant venir sur eux une masse d’eau démesurée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « témérité » ou « insolence » ; le terme grec peut désigner ici une assurance hardie et arrogante.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une eau sans mesure » ; il s’agit des eaux dévastatrices du déluge.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  choice: ceux d’autrefois
  rationale: L’expression a ici un sens temporel et désigne les êtres humains d’une époque ancienne. « Ceux d’autrefois » est naturel et fidèle.
- source_word: ἀδικίαν ποιήσαντας
  choice: qui s’étaient livrés à l’injustice
  rationale: Le participe aoriste désigne ceux qui ont pratiqué ce qui est injuste ou mauvais. Cette formulation française exprime une conduite caractérisée par l’injustice sans la réduire à un seul acte judiciaire.
- source_word: γίγαντες
  choice: des géants
  rationale: « Géants » est le sens direct du terme grec dans cette évocation du monde antérieur au déluge. Une traduction comme « hommes puissants » en atténuerait inutilement la portée.
- source_word: ῥώμῃ
  choice: leur force
  rationale: Le mot désigne la vigueur ou la puissance physique. « Force » convient naturellement avec le verbe « se fier à ».
- source_word: θράσει
  choice: leur audace
  rationale: Dans ce contexte de méchanceté et de jugement, le terme suggère une hardiesse téméraire, voire insolente. « Audace » conserve cette nuance sans la rendre plus précise que le grec.
- source_word: πεποιθότες
  choice: qui se fiaient à
  rationale: Le participe parfait exprime une confiance établie. « Se fier à » rend clairement cette assurance placée dans leur propre force et leur audace.
- source_word: διέφθειρας
  choice: Tu as détruit
  rationale: Le verbe indique ici une destruction décisive accomplie par Dieu.
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  choice: en faisant venir sur eux une masse d’eau démesurée
  rationale: Le participe précise le moyen de la destruction. « Masse d’eau démesurée » reste proche de l’image grecque tout en évitant l’expression peu naturelle « une eau sans mesure ».
theological_decisions:
- issue: Identification des êtres jugés comme la génération ancienne du déluge comprenant des géants
  choice: Conserver explicitement « géants » et l’image d’une eau démesurée
  alternative: Généraliser en « hommes puissants » et expliciter « le déluge »
  rationale: Le verset évoque clairement le jugement du déluge, mais emploie lui-même γίγαντες et ἀμέτρητον ὕδωρ. La traduction préserve ces termes sans harmoniser davantage le texte avec un récit de la Genèse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure de la prière adressée à Dieu ainsi que le lien instrumental entre l’arrivée des eaux et la destruction. Les tirets isolent l’incise sur les géants sans rompre le mouvement de la phrase.
