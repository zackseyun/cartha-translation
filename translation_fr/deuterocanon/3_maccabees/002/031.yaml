base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/031.yaml
  text: But some[a], lightly despising the foundations of the city's piety, readily gave themselves up, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: fr
  text: Mais certains, dans leur légèreté, méprisèrent les appuis de la piété de la ville[a] et se livrèrent volontiers, espérant acquérir une grande renommée grâce à leurs relations à venir avec le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les soutiens de la dévotion de la ville » ou « les fondements de la piété de la ville ». Le grec emploie, au sens figuré, un terme désignant des bases ou des supports.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: certains
  rationale: Désigne de manière indéfinie une partie de la population; « certains » est naturel et précis en français.
- source_word: ἐπιπολαίως
  choice: dans leur légèreté
  rationale: Exprime une attitude superficielle, irréfléchie ou désinvolte; cette tournure française qualifie naturellement le mépris qui suit sans préciser indûment leur motivation.
- source_word: στυγοῦντες
  choice: méprisèrent
  rationale: Le verbe peut signifier haïr ou abhorrer, mais, associé à ἐπιπολαίως, il évoque ici surtout un rejet méprisant. Le passé simple convient au registre narratif.
- source_word: ἐπιβάθρας
  choice: appuis
  rationale: Le terme désigne littéralement des bases, supports ou points d’appui. « Appuis » conserve la métaphore sans imposer l’image plus précise de fondations.
- source_word: τὰς τῆς πόλεως εὐσεβείας
  choice: les appuis de la piété de la ville
  rationale: εὐσέβεια renvoie à la piété ou à la dévotion religieuse établie dans la ville. La formulation maintient la relation génitive et la dimension civico-religieuse.
- source_word: εὐχερῶς
  choice: volontiers
  rationale: Marque la facilité et l’empressement avec lesquels ils agissent; « volontiers » met naturellement en relief leur consentement.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: se livrèrent
  rationale: La construction réfléchie indique qu’ils se donnent ou se remettent eux-mêmes, volontairement. « Se livrer » conserve cette implication personnelle sans expliciter à qui ils se livrent.
- source_word: κοινωνήσοντες
  choice: allaient avoir part à
  rationale: Le participe futur exprime la participation qu’ils espéraient obtenir; la tournure garde à la fois l’idée de partage et la perspective future.
- source_word: εὐκλείας
  choice: un grand renom
  rationale: Le mot désigne la bonne réputation, la célébrité honorable ou le renom public. « Renom » évite la charge théologique que pourrait prendre « gloire ».
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: grâce aux relations qu’ils auraient avec le roi
  rationale: συναναστροφή désigne la fréquentation ou les relations sociales, et ἐσομένης les présente comme futures. La formulation française exprime leur attente sans suggérer une amitié intime.
theological_decisions:
- issue: Sens de εὐσεβείας dans un contexte religieux civique
  choice: la piété de la ville
  alternative: les pratiques pieuses de la ville / la religion de la ville
  rationale: « Piété » préserve la nuance morale et religieuse du grec, sans réduire le terme à une institution ni préciser quelles observances sont en vue.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre historique. La métaphore architecturale est conservée, tandis que la proposition finale garde la nuance d’une attente intéressée plutôt que d’affirmer qu’ils obtiendraient effectivement ce renom.
