  to: Mais certains, dans leur légèreté, méprisèrent les appuis de la piété de la ville[a] et se livrèrent volontiers, espérant acquérir une grande renommée grâce à leurs relations à venir avec le roi.
  rationale: La révision remplace une comparaison française susceptible de porter une nuance contrefactuelle par une expression directe de l’espérance qui motive leur conduite. Elle améliore aussi l’idiomaticité de l’expression relative à la renommée et à la relation future avec le roi, tout en conservant le sens, le registre historique et la métaphore architecturale du texte grec.
