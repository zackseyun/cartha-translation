  source_fidelity: La tournure « profitant de notre abaissement » attribue à cet homme l’idée de tirer avantage de la détresse du peuple, alors que ἐν δὲ τῇ ἡμετέρᾳ καταπτώσει situe plus sobrement l’action « dans/notre abaissement ». De plus, dans le projet, « sur la terre » est syntaxiquement rattaché à « a été désigné », tandis que le grec qualifie le « lieu saint » comme étant sur la terre. La révision corrige ces deux points sans lever l’ambiguïté de ἀναδεδειγμένον.
