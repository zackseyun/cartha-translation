  terminology: « Insolent et profane », « cherche à outrager » et « lieu saint » restituent bien le registre et les contrastes du grec. « Désigné par le nom de ta gloire » conserve de façon acceptable la formulation condensée et solennelle, avec une note qui signale l’alternative « manifesté ».
