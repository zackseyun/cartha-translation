  text: But in our downfall this bold and profane man is attempting to insult the holy place on earth appointed by the name of your glory[a].
translation:
  language: fr
  text: Mais, dans notre abaissement, cet homme insolent et profane cherche à outrager le lieu saint sur la terre, désigné par le nom de ta gloire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le lieu saint sur la terre, manifesté par le nom de ta gloire ».'
    reason: Le participe grec peut signifier aussi bien « désigné » que « manifesté » ou « montré publiquement ».
lexical_decisions:
- source_word: καταπτώσει
  choice: abaissement
  rationale: Le nom évoque une chute ou un état d’effondrement. Ici, « notre abaissement » exprime naturellement la situation de faiblesse et d’humiliation du peuple sans suggérer nécessairement sa destruction totale.
- source_word: θρασὺς
  choice: insolent
  rationale: Dans ce contexte hostile, le terme désigne une audace effrontée plutôt qu’un simple courage. « Insolent » restitue clairement cette valeur péjorative.
- source_word: βέβηλος
  choice: profane
  rationale: Le mot caractérise celui qui méprise le sacré. « Profane » maintient le contraste lexical et théologique avec « le lieu saint ».
- source_word: ἐπιτηδεύει
  choice: cherche à
  rationale: Avec l’infinitif, le verbe indique une entreprise délibérée et poursuivie. « Cherche à » rend cette intention active dans un français actuel.
- source_word: καθυβρίσαι
  choice: outrager
  rationale: Le verbe intensif exprime un traitement marqué par l’arrogance, le mépris et la profanation. « Outrager » convient mieux à un lieu sacré que le plus faible « insulter ».
- source_word: ἀναδεδειγμένον
  choice: a été désigné
  rationale: Le parfait passif peut exprimer une désignation officielle ou publique. « A été désigné » est naturel et conserve cette nuance sans imposer l’idée plus interprétative de manifestation.
- source_word: τῷ ὀνόματι τῆς δόξης σου
  choice: par le nom de ta gloire
  rationale: Cette formulation garde la structure inhabituelle et solennelle du grec ainsi que la distinction entre le nom et la gloire, au lieu de les fondre dans « ton nom glorieux ».
- source_word: ἅγιον τόπον
  choice: le lieu saint
  rationale: Le grec parle largement d’un lieu sacré, dans le contexte du temple, sans employer ici un terme technique désignant le sanctuaire intérieur.
theological_decisions:
- issue: Identification et portée du lieu sacré
  choice: « le lieu saint » renvoie au temple de Jérusalem sans préciser une partie intérieure du sanctuaire
  alternative: « le sanctuaire » pourrait faire entendre une référence plus étroite ou plus technique
  rationale: τόπος reste un terme général. Le contexte permet d’identifier le temple, mais la traduction ne doit pas restreindre le référent au sanctuaire intérieur.
- issue: Rapport entre le lieu, le nom et la gloire de Dieu
  choice: conserver la formule « désigné par le nom de ta gloire »
  alternative: « consacré à ton nom glorieux » ou « où ton nom glorieux a été proclamé »
  rationale: Le datif et le participe admettent plusieurs nuances. La traduction retenue préserve la formulation condensée et l’ambiguïté du grec sans expliquer à sa place la manière dont le nom divin désigne le lieu.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « profitant de notre abaissement » explicite la valeur circonstancielle naturelle de ἐν sans ajouter de causalité forte. Le vocabulaire « profane », « outrager » et « lieu saint » conserve le contraste sacré-profane du grec.
