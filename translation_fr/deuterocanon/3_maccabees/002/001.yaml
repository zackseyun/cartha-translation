base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
translation:
  language: fr
  text: Seigneur, Seigneur, roi des cieux et maître de toute la création, saint parmi les saints[a], seul souverain, Tout-Puissant, prête-nous attention, à nous qui sommes opprimés par un homme[b] impie et profane, gonflé d’insolence et de puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « saint parmi les êtres saints ». Littéralement : « saint dans les saints » ; l’expression grecque est concise et liturgique.'
    reason: lexical_alternative
  - marker: b
    text: Le grec ne dit pas explicitement « un homme », mais les mots au masculin singulier désignent une seule personne hostile.
    reason: supplied_word
lexical_decisions:
- source_word: Κύριε, Κύριε
  choice: Seigneur, Seigneur
  rationale: Le vocatif divin répété est conservé, ainsi que sa solennité liturgique.
- source_word: βασιλεῦ τῶν οὐρανῶν
  choice: roi des cieux
  rationale: « Des cieux » garde le pluriel grec tout en étant naturel en français biblique moderne.
- source_word: δέσποτα πάσης τῆς κτίσεως
  choice: maître de toute la création
  rationale: « Maître » exprime l’autorité souveraine de δεσπότης sans le confondre avec κύριος, rendu par « Seigneur ».
- source_word: ἅγιε ἐν ἁγίοις
  choice: saint parmi les saints
  rationale: Cette formulation naturelle conserve la tournure dense et liturgique ainsi que l’ambiguïté possible de ἅγιοι, qui peut désigner des êtres saints.
- source_word: μόναρχε
  choice: seul souverain
  rationale: Le choix souligne l’unicité de l’autorité divine sans évoquer principalement une institution politique humaine.
- source_word: παντοκράτωρ
  choice: Tout-Puissant
  rationale: Titre divin français traditionnel, clair et propre à rendre l’idée de puissance et de domination universelles.
- source_word: πρόσχες ἡμῖν
  choice: prête attention à nous
  rationale: L’impératif demande directement que Dieu porte son attention sur les suppliants, sans introduire explicitement l’idée d’écoute.
- source_word: καταπονουμένοις
  choice: qui sommes opprimés
  rationale: Le participe exprime une souffrance exercée sous une forte pression hostile; « opprimés » convient au contexte de persécution.
- source_word: ἀνοσίου καὶ βεβήλου
  choice: impie et profane
  rationale: 'Les deux adjectifs restent distincts : le premier marque l’irrévérence ou l’impiété, le second la profanation de ce qui est sacré.'
- source_word: θράσει καὶ σθένει πεφρυασμένου
  choice: gonflé d’insolence et de puissance
  rationale: « Gonflé » préserve l’image de πεφρυασμένου; « insolence » rend la hardiesse présomptueuse de θράσος et « puissance » la force de σθένος.
theological_decisions:
- issue: Accumulation des titres divins dans l’invocation
  choice: Conserver distinctement « Seigneur… roi… maître… saint… seul souverain… Tout-Puissant »
  alternative: Réduire ou uniformiser plusieurs titres sous un même équivalent français
  rationale: L’accumulation est un élément rhétorique et théologique de la prière; distinguer les titres préserve les nuances du grec.
- issue: Interprétation de ἅγιε ἐν ἁγίοις
  choice: « saint parmi les saints » dans le texte, avec une variante en note
  alternative: « saint au milieu des êtres saints » ou « saint dans les lieux saints »
  rationale: La syntaxe grecque est concise et permet plusieurs compréhensions. Le texte principal retient une lecture naturelle sans exclure les autres possibilités.
- issue: Sujet humain sous-entendu après ὑπό
  choice: Ajouter « un homme » et le signaler en note
  alternative: Employer une tournure abstraite ou laisser les adjectifs substantivés sans nom exprimé
  rationale: Le grec ne donne pas de nom, mais les formes masculines singulières désignent une personne hostile précise. L’ajout rend la phrase française claire sans transformer l’implicite en donnée non signalée.
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsmes marqués. La répétition initiale et l’enchaînement des titres sont maintenus. Les majuscules de « Seigneur » et « Tout-Puissant » signalent des titres divins usuels; « souverain » reste en minuscule dans la suite syntaxique.
