revisions:
- from: Mais une fois transféré en Égypte[a], il s’enfonça davantage dans la méchanceté, sous l’influence des compagnons de beuverie[b] et des proches déjà mentionnés, étrangers à tout ce qui est juste[c],
  to: Mais, une fois transféré en Égypte[a], il aggravait encore sa méchanceté par l’entremise de ses compagnons de boisson[b] et de ses associés déjà mentionnés, séparés de toute justice[c],
  rationale: La révision restitue plus directement l’accroissement continu de la méchanceté, rend διά par un moyen sans surinterprétation psychologique, applique explicitement « déjà mentionnés » aux deux catégories de personnes et retire la notion non attestée d’excès. La virgule finale est conservée, car la phrase grecque demeure syntaxiquement ouverte vers le verset suivant.
