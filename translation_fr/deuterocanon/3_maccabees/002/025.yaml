  text: But after he had been conveyed to Egypt[a], and was increasing his wickedness through the previously mentioned drinking companions and associates, who had been estranged from all justice[c][b],
translation:
  language: fr
  text: Mais, une fois transféré en Égypte[a], il aggravait encore sa méchanceté par l’entremise de ses compagnons de boisson[b] et de ses associés déjà mentionnés, séparés de toute justice[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transporté en Égypte ». Le participe grec souligne son transfert dans ce pays sans en préciser le moyen.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « compagnons de boisson » ; le terme désigne ceux qui boivent ensemble.
    reason: cultural_note
  - marker: c
    text: Ou « séparés de tout ce qui est juste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακομισθεὶς
  choice: une fois transféré
  rationale: Le participe aoriste passif exprime le transfert en Égypte sans préciser le moyen de transport. « Une fois transféré » conserve la voix passive et la valeur circonstancielle.
- source_word: ἐπαύξων
  choice: il s’enfonça davantage
  rationale: Le participe présent indique que sa conduite mauvaise s’accentue. Cette formulation française naturelle rend l’aggravation progressive sans suggérer qu’il augmente une quantité abstraite.
- source_word: κακίας
  choice: dans la méchanceté
  rationale: κακία désigne ici largement la corruption morale ou la conduite mauvaise, plutôt qu’un acte isolé de malveillance.
- source_word: προαποδεδειγμένων
  choice: déjà mentionnés
  rationale: Le terme renvoie à des personnes indiquées auparavant dans le récit. « Déjà mentionnés » restitue clairement cette référence rétrospective.
- source_word: συνποτῶν
  choice: compagnons de beuverie
  rationale: Le mot désigne littéralement ceux qui boivent ensemble. « Compagnons de beuverie » garde la dimension conviviale et la coloration moralement négative du contexte.
- source_word: ἑταίρων
  choice: proches
  rationale: ἑταῖροι désigne des compagnons ou membres de l’entourage. « Proches » convient au contexte de cour sans imposer l’idée d’une amitié authentique.
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  choice: étrangers à tout ce qui est juste
  rationale: Le parfait passif exprime un état établi de séparation. La tournure conserve la portée générale de παντὸς δικαίου et reste idiomatique en français.
