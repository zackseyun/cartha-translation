    issue: Nuance de ἐπαύξων κακίας
    rationale: « S’enfoncer dans la méchanceté » décrit une dégradation personnelle, tandis que le grec exprime plus directement le fait d’accroître ou d’aggraver sa méchanceté.
  - severity: medium
    issue: Rendu de διά et portée de « déjà mentionnés »
    rationale: « Sous l’influence de » impose une causalité psychologique moins directe que l’instrumentalité de διά. De plus, dans le grec, προαποδεδειγμένων qualifie les compagnons de boisson comme les associés; la formulation française doit lever toute ambiguïté sur cette portée.
  - severity: low
    issue: Connotation ajoutée par « beuverie » et sa note
    rationale: Le terme συνπόται signifie d’abord « compagnons de boisson ». Ni le mot ni le contexte immédiat n’exigent l’idée d’excès que « beuverie » et « partageaient ses excès » introduisent.
