  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
translation:
  language: fr
  text: Car, lorsque nos pères[a] étaient affligés à maintes reprises, tu leur es venu en aide dans leur abaissement et tu les as délivrés de grands maux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». Le grec dit littéralement « nos pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de grands malheurs » ou « de grandes calamités ». Ici, le mot grec traduit par « maux » peut désigner des situations gravement nuisibles, et non seulement le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Car
  rationale: La locution introduit ici le motif invoqué dans la prière. « Car » restitue naturellement sa valeur explicative en français.
- source_word: πλεονάκις καὶ
  choice: à maintes reprises
  rationale: πλεονάκις exprime la répétition. Le καί a une valeur additive ou intensive difficile à isoler sans alourdir le français; l’expression « à maintes reprises » rend avec naturel l’insistance de l’ensemble.
- source_word: θλιβέντων
  choice: étaient dans la détresse
  rationale: Le participe passif de θλίβω décrit des personnes éprouvées, pressées ou accablées. « Dans la détresse » conserve la généralité du grec et convient au registre de la prière.
- source_word: τῶν πατέρων ἡμῶν
  choice: nos pères
  rationale: Le grec dit littéralement « nos pères » et désigne les générations antérieures. Cette formulation traditionnelle reste claire; « nos ancêtres » est signalé en note.
- source_word: ἐβοήθησας αὐτοῖς
  choice: tu leur es venu en aide
  rationale: βοηθέω signifie aider ou accourir au secours. Cette tournure française est naturelle, digne et légèrement plus expressive que « tu les as aidés ».
- source_word: ἐν τῇ ταπεινώσει
  choice: dans leur abaissement
  rationale: ταπείνωσις peut désigner l’humiliation, l’abaissement ou la condition misérable. « Abaissement » préserve l’image d’une condition basse sans répéter « détresse ».
- source_word: ἐρρύσω
  choice: tu les as délivrés
  rationale: ῥύομαι exprime l’action d’arracher à un danger ou de délivrer. « Délivrés » convient au registre biblique tout en gardant le sens concret du contexte.
- source_word: ἐκ μεγάλων κακῶν
  choice: de grands maux
  rationale: κακά peut désigner des maux, des malheurs ou des calamités, et pas seulement le mal moral. « Grands maux » reste proche du grec et demeure idiomatique en français.
theological_decisions:
- issue: Désignation des générations antérieures
  choice: nos pères
  alternative: nos ancêtres
  rationale: πατέρων est explicitement le pluriel de « père ». Le texte principal conserve cette forme genrée sans exclure son sens ancestral plus large, indiqué en note.
- issue: Portée de κακῶν dans le récit de délivrance
  choice: de grands maux
  alternative: de grands malheurs ou de grandes calamités
  rationale: Dans ce contexte, κακῶν renvoie vraisemblablement à des situations nuisibles ou désastreuses plutôt qu’au seul mal moral. « Maux » préserve toutefois l’étendue sémantique et l’ambiguïté du terme grec.
translation_notes:
  register: Français international moderne, clair et digne, avec tutoiement de prière. La phrase conserve le mouvement causal du grec, distingue la détresse (θλίβω) de l’abaissement (ταπείνωσις) et évite de réduire κακά au seul mal moral.
