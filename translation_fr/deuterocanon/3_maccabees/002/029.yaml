  text: and that those who registered should also be branded on the body with the ivy-leaf emblem of Dionysus by fire[c][b][a], and should also be enrolled in his reduced status of authority.
translation:
  language: fr
  text: que ceux qui se faisaient inscrire[a] soient aussi marqués au feu, sur le corps, d’une feuille de lierre, signe distinctif de Dionysos[b], et qu’ils soient également inscrits d’avance dans une condition restreinte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui étaient inscrits » ou « ceux qui s’inscrivaient ».'
    reason: lexical_alternative
  - marker: b
    text: La feuille de lierre était un signe associé au culte de Dionysos ; elle devait ici être imprimée sur le corps comme marque d’identification.
    reason: cultural_note
  - marker: c
    text: L’expression grecque est condensée et son sens exact demeure incertain. Elle peut évoquer une condition civique limitée, une capacité juridique réduite ou, plus généralement, un statut inférieur.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπογραφομένους
  choice: ceux qui se faisaient inscrire
  rationale: Le participe moyen-passif peut désigner ceux qui se font inscrire ou ceux qui sont inscrits. La tournure retenue exprime naturellement l’inscription administrative sans trancher en faveur d’une participation entièrement volontaire.
- source_word: χαράσσεσθαι … διὰ πυρός
  choice: soient marqués au feu
  rationale: Avec « par le feu », le verbe désigne une marque corporelle brûlée, proche d’une marque au fer. « Marqués au feu » reste près de la formulation grecque sans préciser un instrument que le texte ne nomme pas.
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  choice: du signe distinctif de Dionysos, une feuille de lierre
  rationale: παράσημον indique une marque distinctive ou un emblème, et κισσόφυλλον en précise la forme. Cette formulation conserve à la fois la fonction identificatrice et le symbole cultuel explicite.
- source_word: προκαταχωρίσαι
  choice: soient également inscrits d’avance
  rationale: Le verbe évoque l’entrée préalable ou officielle dans une catégorie ou un registre. « Inscrits d’avance » conserve la valeur du préfixe προ- tout en restant intelligible.
- source_word: προσυνεσταλμένην αὐθεντίαν
  choice: la catégorie au statut restreint
  rationale: 'La locution est condensée et incertaine : συνεσταλμένην suggère une condition réduite ou limitée, tandis qu’αὐθεντία peut évoquer autorité, qualité ou statut. La traduction indique prudemment une catégorie administrative de rang restreint.'
theological_decisions:
- issue: Marque cultuelle liée à Dionysos
  choice: Nommer explicitement Dionysos et la feuille de lierre qui lui sert de signe distinctif.
  alternative: Parler seulement d’une marque païenne ou religieuse.
  rationale: Le grec nomme Dionysos et son symbole; les conserver restitue le caractère historique et religieux précis de la mesure sans l’atténuer ni l’amplifier.
- issue: Sens administratif de προσυνεσταλμένην αὐθεντίαν
  choice: Employer « catégorie au statut restreint » et signaler l’incertitude en note.
  alternative: « condition civique limitée », « capacité juridique réduite » ou « autorité diminuée ».
  rationale: Le contexte suggère une infériorisation administrative ou sociale, mais la formulation grecque ne permet pas de déterminer avec certitude s’il s’agit précisément de citoyenneté, de capacité juridique ou d’autorité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la forme d’une disposition officielle. « Marqués au feu » rend la violence concrète de la mesure sans ajouter l’image non exprimée d’un fer rouge; la note préserve l’ambiguïté du vocabulaire administratif final.
