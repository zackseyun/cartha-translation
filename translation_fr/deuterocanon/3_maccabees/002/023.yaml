lexical_decisions:
- source_word: ταχέως
  choice: rapidement
  rationale: L’adverbe exprime la rapidité de l’action; « rapidement » en conserve directement la valeur temporelle.
- source_word: αὐτὸν
  choice: le
  rationale: Pronom personnel masculin singulier à l’accusatif, renvoyant à l’homme mentionné dans le contexte.
- source_word: ἐξείλκυαν
  choice: traînèrent… dehors
  rationale: Le verbe composé désigne l’action de tirer quelqu’un hors d’un lieu, avec une nuance de contrainte que « traîner dehors » rend naturellement en français.
- source_word: ὑπερβάλλοντι
  choice: extrême
  rationale: Le participe adjectival qualifie la peur comme dépassant la mesure ordinaire; « extrême » transmet cette intensité sans lourdeur.
- source_word: καταπεπληγμένοι
  choice: saisis
  rationale: Le participe parfait nominatif pluriel décrit l’état durable des personnes qui accomplissent l’action, frappées ou profondément affectées par la peur. « Saisis » est idiomatique et conserve cet état résultant.
- source_word: φόβῳ
  choice: peur
  rationale: Terme courant pour la peur; son intensité est apportée par ὑπερβάλλοντι.
