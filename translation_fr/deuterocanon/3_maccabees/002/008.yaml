revisions:
- from: Toi, ô Roi, qui as créé la terre sans limites ni mesure, tu as choisi cette ville et sanctifié ce lieu pour ton nom — pour toi qui n’as besoin de rien de ce qui existe[b] —, et tu l’as rendu glorieux par une manifestation majestueuse[a], en l’établissant pour la gloire de ton nom grand et digne d’honneur.
  to: Toi, ô Roi, qui as créé la terre sans limites ni mesure, tu as choisi cette ville et sanctifié ce lieu pour ton nom, toi qui n’as besoin de rien de ce qui existe[b], et tu l’as rendu glorieux par une manifestation majestueuse[a], en l’établissant pour la gloire de ton grand nom, digne d’honneur.
  rationale: La révision remplace « pour toi » par une apposition directe, qui représente plus exactement le datif d’adresse grec et évite de créer un second complément de but en français. Elle améliore aussi l’ordre des adjectifs se rapportant au nom et nuance la note sur la syntaxe disputée, sans résoudre l’ambiguïté ni introduire θεός dans le texte traduit.
