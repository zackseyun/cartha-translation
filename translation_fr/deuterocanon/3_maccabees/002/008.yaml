base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
translation:
  language: fr
  text: Toi, ô Roi, qui as créé la terre sans limites ni mesure, tu as choisi cette ville et sanctifié ce lieu pour ton nom, toi qui n’as besoin de rien de ce qui existe[b], et tu l’as rendu glorieux par une manifestation majestueuse[a], en l’établissant pour la gloire de ton grand nom, digne d’honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par une apparition majestueuse » ; l’expression grecque peut désigner une manifestation divine visible.
    reason: lexical_alternative
  - marker: b
    text: La construction grecque est difficile. Le texte peut se comprendre comme « toi qui n’as besoin de rien de ce qui existe » ; certains comprennent plutôt τῶν ἁπάντων comme « de tous », ce qui conduit à une tournure telle que « toi qui n’as besoin de rien, [Dieu] de tous ». Le mot « Dieu » n’apparaît pas explicitement dans le grec.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεῦ
  choice: ô Roi
  rationale: Le vocatif direct conserve le ton solennel de la prière sans archaïsme excessif.
- source_word: κτίσας
  choice: qui as créé
  rationale: Cette proposition relative rend naturellement en français le participe aoriste tout en reliant la création aux actions principales.
- source_word: τὴν ἀπέρατον καὶ ἀμέτρητον γῆν
  choice: la terre sans limites ni mesure
  rationale: La formulation conserve les deux qualificatifs intensifs et le cadre cosmique de γῆ.
- source_word: ἐξελέξω
  choice: tu as choisi
  rationale: « Choisir » exprime directement l’élection de la ville sans ajouter de technicité doctrinale.
- source_word: ἡγίασας
  choice: sanctifié
  rationale: Le verbe français exprime clairement la mise à part comme sainte et convient au registre biblique actuel.
- source_word: εἰς σὸν ὄνομα
  choice: pour ton nom
  rationale: La formulation garde l’idée de destination et de consécration au nom divin.
- source_word: τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: pour toi qui n’as besoin de rien de ce qui existe
  rationale: 'Le génitif τῶν ἁπάντων est compris comme complément de ἀπροσδεεῖ : Dieu n’a besoin d’aucune chose. Cette lecture évite d’ajouter le nom « Dieu », absent du grec.'
- source_word: παρεδόξασας
  choice: tu l’as rendu glorieux
  rationale: Cette expression rend la valeur causative et intensive du verbe tout en reprenant le champ lexical de la gloire.
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  choice: par une manifestation majestueuse
  rationale: « Manifestation » préserve la possible nuance d’épiphanie visible, et « par » rend naturellement la valeur instrumentale possible de ἐν.
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  choice: en l’établissant
  rationale: La formulation française rend de manière concise la construction grecque, qui évoque l’établissement ou la fondation du lieu.
- source_word: πρὸς δόξαν τοῦ μεγάλου καὶ ἐντίμου ὀνόματός σου
  choice: pour la gloire de ton nom grand et digne d’honneur
  rationale: « Pour » exprime le but; « digne d’honneur » restitue ἐντίμου sans confondre le nom honoré avec l’acte de l’honorer.
theological_decisions:
- issue: Construction de τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: « pour toi qui n’as besoin de rien de ce qui existe »
  alternative: « toi qui n’as besoin de rien, Dieu de tous »
  rationale: Le grec ne contient pas le mot « Dieu » dans cette proposition. Le génitif τῶν ἁπάντων peut dépendre de ἀπροσδεεῖ et désigner l’ensemble des choses dont Dieu n’a aucun besoin. Une note signale toutefois la difficulté syntaxique au lieu de présenter cette analyse comme certaine.
- issue: Nature de l’ἐπιφάνεια
  choice: « manifestation majestueuse »
  alternative: « apparition majestueuse »
  rationale: « Manifestation » maintient ouverte la question de savoir si le texte désigne une apparition divine visible ou, plus largement, une révélation éclatante de la présence divine.
translation_notes:
  register: Français international moderne, solennel et adapté à une prière. La syntaxe a été légèrement réorganisée pour rester naturelle, tout en conservant l’adresse directe, les répétitions théologiques autour du nom et de la gloire, ainsi que l’ambiguïté des deux expressions grecques difficiles.
