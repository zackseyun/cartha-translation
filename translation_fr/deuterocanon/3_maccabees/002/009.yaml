base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/009.yaml
  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
translation:
  language: fr
  text: Et parce que tu aimes la maison d’Israël, tu as promis que, si nous nous détournons[a], si la détresse nous atteint et si nous venons dans notre lieu[b] pour te supplier, tu écouteras notre supplication.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « si notre détournement se produit ». Le mot grec peut désigner le fait de se détourner, une défection ou, selon le contexte, une apostasie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « notre lieu ». Le contexte peut désigner le lieu consacré, probablement le Temple, mais le grec transmis ne dit pas explicitement « sanctuaire ».'
    reason: textual_clarity
lexical_decisions:
- source_word: ἀγαπῶν
  choice: dans ton amour pour
  rationale: Le participe se rapporte au destinataire divin, comme le confirme le verbe à la deuxième personne ἐπηγγείλω. Cette tournure française exprime naturellement la circonstance, sans imposer une valeur strictement causale.
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: la maison d’Israël
  rationale: Expression biblique consacrée qui conserve la portée collective et historique de οἶκος.
- source_word: ἐπηγγείλω
  choice: tu as promis
  rationale: Il s’agit de la deuxième personne du singulier de l’aoriste moyen de ἐπαγγέλλομαι, et non de la première personne. La prière s’adresse à Dieu.
- source_word: ἀποστροφή
  choice: un revers
  rationale: Dans ce contexte de détresse collective, « revers » rend naturellement l’idée d’un retournement défavorable, tout en laissant une note signaler les autres nuances possibles du nom grec.
- source_word: καταλάβῃ
  choice: atteignait
  rationale: Le verbe décrit ici la détresse qui rejoint ou saisit le peuple; « atteindre » est clair et idiomatique.
- source_word: στενοχωρία
  choice: la détresse
  rationale: Rend la pression, l’affliction ou la situation pénible évoquée par le terme grec sans en préciser indûment la nature.
- source_word: τὸν τόπον ἡμῶν
  choice: notre lieu
  rationale: La formulation inhabituelle du grec est conservée. Le contexte peut viser le Temple ou le lieu consacré, mais le texte transmis ne dit pas explicitement « sanctuaire ».
- source_word: δεηθῶμεν
  choice: pour te supplier
  rationale: Le verbe désigne une prière de demande pressante; « supplier » en conserve la force et permet de rendre distinctement le nom apparenté qui suit.
- source_word: εἰσακούσῃ τῆς δεήσεως ἡμῶν
  choice: tu écouterais notre supplication
  rationale: εἰσακούσῃ est à la deuxième personne du singulier et signifie écouter favorablement une demande. Le conditionnel français s’intègre naturellement à la promesse rapportée au passé.
theological_decisions:
- issue: Personne grammaticale du locuteur et du destinataire
  choice: « tu as promis […] tu écouterais »
  alternative: « j’ai promis […] j’écouterais »
  rationale: Les formes grecques ἐπηγγείλω et εἰσακούσῃ sont à la deuxième personne du singulier dans cette adresse à Dieu. La lecture à la première personne de la couche anglaise ne correspond pas à la morphologie du texte source.
- issue: Sens de ἀποστροφή
  choice: « un revers » dans le texte, avec les autres possibilités en note
  alternative: « un détournement », « une défection » ou « une apostasie »
  rationale: Le mot peut évoquer un retournement, un fait de se détourner ou une défection. Le contexte associe ce phénomène à une détresse collective et à une prière au lieu consacré; « revers » convient sans transformer le passage en énoncé doctrinal technique.
- issue: Identification de « notre lieu »
  choice: conserver « notre lieu »
  alternative: expliciter « ce lieu », « le Temple » ou « le sanctuaire »
  rationale: Bien que le contexte puisse faire penser au Temple, l’expression grecque transmise est τὸν τόπον ἡμῶν. L’explicitation dans le corps du texte résoudrait une difficulté que la source laisse subsister.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle a été légèrement régularisée par la répétition de « si ». Les deuxièmes personnes imposées par la morphologie grecque sont maintenues malgré la couche anglaise auditée, signalée comme présentant un décalage majeur.
