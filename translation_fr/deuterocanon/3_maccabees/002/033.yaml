  yaml_path: translation/deuterocanon/3_maccabees/002/033.yaml
  text: And they remained hopeful of obtaining help, and they loathed those who were withdrawing from among them, and judged them as enemies of the nation, and deprived them of common association and support.
translation:
  language: fr
  text: Ils restaient pleins d’espoir d’obtenir du secours ; ils avaient en horreur ceux qui les quittaient, les jugeaient ennemis de la nation et les privaient des relations et du soutien communs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐέλπιδές τε καθιστήκεισαν
  choice: Ils gardaient bon espoir
  rationale: Rend l’état durable exprimé par le plus-que-parfait périphrastique, dans un français naturel.
- source_word: ἀντιλήμψεως τεύξασθαι
  choice: d’obtenir du secours
  rationale: ἀντίλημψις désigne ici une aide ou un secours attendu; «obtenir» reflète τεύξασθαι.
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  choice: ceux qui se désolidarisaient d’eux
  rationale: Le verbe marque l’éloignement d’avec le groupe; cette formulation conserve la dimension sociale sans préciser indûment la forme du départ.
- source_word: ἐβδελύσσοντο
  choice: avaient en horreur
  rationale: Expression forte correspondant à l’aversion indiquée par le grec, dans un registre digne et actuel.
- source_word: ὡς πολεμίους τοῦ ἔθνους ἔκρινον
  choice: les considéraient comme des ennemis de la nation
  rationale: Traduction directe de la qualification portée contre eux, sans ajouter une nuance judiciaire non nécessaire.
- source_word: τῆς κοινῆς συναναστροφῆς καὶ εὐχρηστίας ἐστέρουν
  choice: les excluaient des relations et de l’entraide communes
  rationale: συναναστροφή renvoie aux rapports ou à la fréquentation sociale; εὐχρηστία, terme contextuellement délicat, est compris comme l’aide ou le soutien utile au sein de la communauté.
theological_decisions:
- issue: Nature du secours attendu
  choice: du secours
  alternative: de la protection
  rationale: Le grec ne nomme pas explicitement l’agent ni la forme de l’aide; la traduction préserve cette indétermination.
- issue: Portée de εὐχρηστία
  choice: l’entraide commune
  alternative: les services communs / l’utilité commune
  rationale: Dans ce contexte d’exclusion communautaire, «entraide» donne un sens intelligible sans introduire une notion confessionnelle de communion.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions grecques de coordination sont légèrement allégées pour la fluidité, tandis que la progression — espoir, aversion, jugement, exclusion — demeure intacte.
