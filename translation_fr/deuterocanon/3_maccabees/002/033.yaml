  naturalness: Le français est fluide et d’un registre narratif approprié. Une phrase coordonnée rend mieux l’enchaînement insistant des quatre actions dans le grec, sans alourdir le texte.
  terminology: « Secours », « avaient en horreur » et « ennemis de la nation » sont justes. « Soutien commun » préserve l’ouverture de εὐχρηστία mieux que « entraide », qui peut suggérer une réciprocité absente du terme grec.
