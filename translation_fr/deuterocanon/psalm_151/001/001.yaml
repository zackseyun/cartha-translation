  yaml_path: translation/deuterocanon/psalm_151/001/001.yaml
  text: I was small among my brothers, and younger in my father's house; I was shepherding my father's sheep.
translation:
  language: fr
  text: J’étais petit[a] parmi mes frères et plus jeune dans la maison de mon père ; je faisais paître les moutons de mon père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peu important » ; le mot grec peut renvoyer à la taille, à l’âge ou au rang.
    reason: Signaler l’étendue sémantique réelle de Μικρός sans résoudre artificiellement son ambiguïté.
lexical_decisions:
- source_word: Μικρός
  choice: petit
  rationale: Le grec peut évoquer la petite taille, le jeune âge ou une position modeste. « Petit » conserve cette ouverture sans imposer une seule interprétation.
- source_word: νεώτερος
  choice: plus jeune
  rationale: Le comparatif grec signifie littéralement « plus jeune » ; il ne faut pas le transformer sans nécessité en superlatif (« le plus jeune »).
- source_word: ἔποιμαινον
  choice: je faisais paître
  rationale: L’imparfait exprime une activité habituelle ou continue, et « faire paître » rend précisément l’action pastorale.
- source_word: πρόβατα
  choice: moutons
  rationale: Terme français courant et naturel pour le petit bétail ovin désigné ici.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La coordination et l’imparfait suivent de près le mouvement du grec, tandis que « plus jeune » préserve explicitement la forme comparative.
