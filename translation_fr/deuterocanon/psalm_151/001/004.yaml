base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/004.yaml
  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
translation:
  language: fr
  text: Il a lui-même envoyé son messager[a], m’a pris du milieu des brebis de mon père et m’a oint de l’huile de son onction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son ange ». Le mot grec peut désigner soit un messager humain, soit un être angélique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Il a lui-même
  rationale: Le pronom grec est emphatique ; « lui-même » conserve cette insistance dans un français naturel.
- source_word: ἐξαπέστειλεν
  choice: a envoyé
  rationale: Dans ce contexte, « envoyer » rend naturellement le verbe composé grec ; « dépêcher » serait possible, mais introduirait une nuance administrative peu adaptée.
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: son messager
  rationale: ἄγγελος peut désigner un messager humain ou un ange. Le contexte de l’onction de David favorise ici « messager », sans effacer l’autre sens possible, signalé en note.
- source_word: ἦρέν με
  choice: m’a pris
  rationale: Le verbe signifie littéralement prendre ou soulever. Ici, « m’a pris du milieu de » exprime naturellement le retrait et le choix de David parmi les brebis.
- source_word: ἐκ τῶν προβάτων τοῦ πατρός μου
  choice: du milieu des brebis de mon père
  rationale: Cette formulation garde le sens concret de πρόβατα, « brebis », tout en explicitant avec naturel l’idée de provenance ou de retrait d’entre elles.
- source_word: ἔχρισέν με
  choice: m’a oint
  rationale: « Oindre » est l’équivalent précis de χρίω et préserve le lien royal et consécratoire avec l’onction.
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  choice: de l’huile de son onction
  rationale: La préposition grecque a ici une valeur instrumentale. « Oindre de l’huile » est idiomatique en français et la construction « de son onction » conserve le génitif du texte.
theological_decisions:
- issue: Sens de ἄγγελος dans le récit de l’onction de David
  choice: messager
  alternative: ange
  rationale: Le mot grec autorise les deux sens. Le cadre narratif de l’onction de David par un envoyé de Dieu favorise un messager humain ; la note maintient cependant l’ambiguïté lexicale réelle sans imposer une identification dans le texte.
translation_notes:
  register: Français moderne, sobre et digne. « Oint » et « onction » sont conservés parce qu’ils rendent précisément le vocabulaire grec et sa portée royale ou consécratoire ; le reste de la phrase demeure courant et immédiatement compréhensible.
