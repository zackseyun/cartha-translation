  text: My hands made an instrument[a]; my fingers fashioned a lyre.
translation:
  language: fr
  text: Mes mains ont fabriqué un instrument[a] ; mes doigts ont façonné une lyre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un instrument de musique ». Le grec emploie ici un terme général, avant de nommer une lyre dans le second membre.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ χεῖρές μου
  choice: Mes mains
  rationale: Équivalent direct et naturel du groupe possessif grec, sans ajouter une emphase absente du texte.
- source_word: ἐποίησαν
  choice: ont fabriqué
  rationale: Le verbe ποιέω exprime ici la fabrication concrète d’un objet ; « fabriquer » convient mieux que le très général « faire » et maintient un contraste naturel avec « façonner ».
- source_word: ὄργανον
  choice: un instrument
  rationale: Dans ce contexte musical, ὄργανον désigne un instrument, tout en restant plus général que ψαλτήριον dans le membre parallèle.
- source_word: οἱ δάκτυλοί μου
  choice: mes doigts
  rationale: Traduction directe et idiomatique du pluriel grec.
- source_word: ἥρμοσαν
  choice: ont façonné
  rationale: ἁρμόζω peut évoquer l’ajustement ou l’assemblage. Dans ce contexte de confection, « façonner » produit un français naturel sans réduire le geste au seul accordage.
- source_word: ψαλτήριον
  choice: une lyre
  rationale: Le mot désigne un ancien instrument à cordes pincées. « Lyre » est clair pour le lectorat moderne, tandis que « psaltérion » conserve plus directement le terme traditionnel.
