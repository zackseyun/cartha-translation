  text: And who will report[a] to my Lord? The Lord himself[b], he himself hears.
translation:
  language: fr
  text: Et qui informera[a] mon Seigneur ? Le Seigneur lui-même, c’est lui qui entend[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « annoncera à mon Seigneur » ou « déclarera à mon Seigneur ». Le verbe grec peut signifier « annoncer », « rapporter » ou « déclarer ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec répète le pronom pour insister : littéralement, « Le Seigneur lui-même, lui-même entend ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: qui
  rationale: Le pronom interrogatif introduit une question rhétorique ; « qui » est l’équivalent français direct et naturel.
- source_word: ἀναγγελεῖ
  choice: l’annoncera
  rationale: Le futur de ἀναγγέλλω exprime l’action de faire connaître, d’annoncer ou de rapporter quelque chose. « L’annoncera » conserve le futur et reste naturel en français ; le pronom « l’ » explicite seulement le complément sous-entendu en grec.
- source_word: τῷ κυρίῳ μου
  choice: à mon Seigneur
  rationale: « Seigneur » préserve le titre κύριος et assure la continuité avec sa seconde occurrence dans le verset.
- source_word: αὐτὸς Κύριος, αὐτός
  choice: Le Seigneur lui-même, c’est lui
  rationale: Cette formulation française rend la double insistance produite par la répétition de αὐτός sans créer une tournure artificielle.
- source_word: εἰσακούει
  choice: entend
  rationale: Le verbe peut évoquer une écoute attentive ou favorable. « Entend » conserve ici la formulation la plus large sans préciser indûment la réponse du Seigneur.
theological_decisions:
- issue: Traduction des deux occurrences de κύριος
  choice: Seigneur / Le Seigneur
  alternative: maître / le Maître
  rationale: Le contexte présente κύριος d’abord avec un possessif, puis comme titre emphatique du sujet qui entend. « Seigneur » maintient cette valeur de titre et la cohérence entre les deux occurrences, sans imposer une distinction absente du grec.
- issue: Portée de εἰσακούει
  choice: entend
  alternative: écoute favorablement / exauce
  rationale: Le grec peut suggérer une écoute favorable, mais le simple présent « entend » préserve l’ouverture sémantique et évite d’affirmer explicitement l’exaucement.
translation_notes:
  register: Français moderne, international et digne. La question rhétorique reste concise. La tournure disloquée « c’est lui qui » restitue naturellement en français l’emphase répétée du grec.
