  text: I went out to meet the foreigner[a], and he cursed me by his idols[b];
translation:
  language: fr
  text: Je suis sorti à la rencontre de l’étranger[a], et il m’a maudit par ses idoles[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Philistin ». Le grec dit littéralement « l’étranger » ou « l’homme d’un autre peuple », terme souvent employé dans la Septante pour désigner les Philistins.
    reason: alternative_reading
  - marker: b
    text: Ou « au nom de ses idoles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Je suis sorti
  rationale: L’aoriste de ἐξέρχομαι exprime ici le mouvement du locuteur qui sort pour aller à la rencontre de son adversaire. « Je suis sorti » respecte clairement la première personne du singulier.
- source_word: εἰς συνάντησιν
  choice: à la rencontre de
  rationale: Cette tournure idiomatique indique le but du déplacement. « À la rencontre de » est naturel en français et conserve la nuance d’un face-à-face.
- source_word: τῷ ἀλλοφύλῳ
  choice: l’étranger
  rationale: ἀλλόφυλος désigne littéralement quelqu’un d’un autre peuple. Dans la Septante, le terme sert souvent à désigner un Philistin, mais le rendu générique préserve le choix lexical du texte grec.
- source_word: ἐπικατηράσατό με
  choice: il m’a maudit
  rationale: Le verbe signifie appeler une malédiction sur quelqu’un. Le français « maudire » en donne ici une expression concise et exacte.
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: par ses idoles
  rationale: La préposition ἐν peut exprimer ici le moyen ou la sphère de l’invocation. « Par ses idoles » reste proche du grec, tandis que le sens plus explicite « au nom de ses idoles » est signalé en note.
theological_decisions:
- issue: Identification de ἀλλόφυλος dans le contexte de David et Goliath
  choice: l’étranger
  alternative: le Philistin
  rationale: Bien que le contexte permette d’identifier Goliath comme Philistin, le grec emploie un terme plus large, signifiant une personne d’un autre peuple. Le texte principal conserve cette généralité et la note donne l’identification contextuelle.
- issue: Valeur de ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: par ses idoles
  alternative: au nom de ses idoles
  rationale: La formulation grecque peut évoquer une malédiction prononcée en faisant appel aux idoles. Le texte principal maintient une formulation relativement formelle sans imposer une explicitation unique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple et narrative. « L’étranger » préserve la formulation grecque sans effacer l’allusion contextuelle au Philistin, et les deux notes rendent visibles les principales ambiguïtés lexicales.
