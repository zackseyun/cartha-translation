lexical_decisions:
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel désigne ici les frères de David.
- source_word: καλοί
  choice: beaux
  rationale: Associé à μεγάλοι dans une description physique, le terme évoque naturellement une apparence avantageuse plutôt qu’une qualité morale.
- source_word: μεγάλοι
  choice: grands
  rationale: Le mot signifie littéralement « grands » ou « de grande taille ». « Grands » conserve cette largeur de sens tout en évoquant naturellement la stature dans ce contexte.
- source_word: οὐκ εὐδόκησεν
  choice: n’a pas pris plaisir en eux
  rationale: Cette formulation rend l’idée d’agrément ou de satisfaction sans transformer le verbe en un acte explicite de choix ou de rejet.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le titre grec désigne ici le Dieu d’Israël ; « le Seigneur » est la formulation française naturelle et traditionnelle.
theological_decisions:
- issue: Nature du regard porté par le Seigneur sur les frères de David
  choice: Le Seigneur n’a pas pris plaisir en eux.
  alternative: Le Seigneur ne les a pas choisis.
  rationale: Le verbe εὐδοκέω exprime le plaisir, l’agrément ou l’approbation, mais ne signifie pas explicitement « choisir ». La traduction évite donc d’importer la formulation de 1 Samuel 16.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme descriptif « beaux et grands » reste concis, tandis que la tournure concernant le Seigneur préserve la retenue théologique du grec.
