  text: My brothers were handsome and tall, but the Lord did not take pleasure in them[a].
translation:
  language: fr
  text: Mes frères étaient beaux et de grande taille, mais le Seigneur ne les a pas agréés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne s’est pas complu en eux » ou « n’a pas pris plaisir en eux ».'
