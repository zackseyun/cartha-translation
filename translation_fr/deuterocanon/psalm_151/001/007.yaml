    issue: Ajout de « ainsi »
    rationale: Le grec coordonne les deux actions par καί (« et ») sans marquer explicitement une conséquence logique.
  - severity: low
    issue: 'Note b : « hors des fils d’Israël »'
    rationale: ἐξ υἱῶν signifie littéralement « de parmi les fils d’Israël » / « des fils d’Israël » ; « hors de » est ici une glose française moins exacte.
  - severity: low
    issue: « l’épée qu’il portait »
    rationale: Cette formulation peut décrire l’épée sans exprimer aussi nettement que David la tire de la personne de l’adversaire. « qu’il avait sur lui » préserve mieux la portée de παρ’ αὐτοῦ.
  revised_text: Mais moi, j’ai tiré l’épée qu’il avait sur lui et je l’ai décapité[a] ; j’ai ôté l’opprobre qui pesait sur les fils d’Israël[b].
