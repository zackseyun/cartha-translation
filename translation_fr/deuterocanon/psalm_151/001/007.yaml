translation:
  language: fr
  text: Mais moi, j’ai tiré l’épée qu’il avait sur lui et je l’ai décapité[a] ; j’ai ôté l’opprobre qui pesait sur les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je lui ai tranché la tête ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de parmi les fils d’Israël » ; « les fils d’Israël » est une expression collective traditionnelle désignant Israël.'
    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  choice: j’ai tiré
  rationale: Le participe aoriste moyen désigne ici l’action de tirer une arme. La tournure française est naturelle et conserve la succession narrative.
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  choice: l’épée qu’il portait
  rationale: παρ’ αὐτοῦ situe l’arme auprès de lui ou en sa possession. « Qu’il portait » reste proche de cette image sans ajouter explicitement l’idée d’appartenance contenue dans « sa propre épée ».
- source_word: ἀπεκεφάλισα
  choice: je l’ai décapité
  rationale: Le verbe signifie directement « décapiter ». Ce choix est précis, actuel et digne ; la note donne une formulation plus concrète.
- source_word: ἦρα ὄνειδος
  choice: j’ai ôté la honte qui pesait
  rationale: αἴρω avec ὄνειδος exprime le retrait d’un opprobre. « Ôter la honte qui pesait » rend clairement en français la construction grecque et son sens figuré.
- source_word: ἐξ υἱῶν Ἰσραήλ
  choice: sur les fils d’Israël
  rationale: Le grec dit littéralement « hors des fils d’Israël », c’est-à-dire que la honte est retirée de leur communauté. Avec « pesait », « sur » produit une expression française naturelle tout en conservant le collectif masculin du texte.
theological_decisions:
- issue: Expression collective genrée υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  alternative: le peuple d’Israël
  rationale: Le texte grec emploie explicitement le masculin pluriel « fils ». La traduction le préserve, tandis qu’une note explique sa valeur collective traditionnelle sans le neutraliser dans le corps du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le contraste initial ἐγὼ δέ est rendu par « Mais moi ». La ponctuation relie explicitement le geste à la délivrance de la honte sans imposer une interprétation théologique supplémentaire.
