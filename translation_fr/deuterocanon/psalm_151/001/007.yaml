- from: Mais moi, j’ai tiré l’épée qu’il portait et je l’ai décapité[a] ; ainsi, j’ai ôté la honte qui pesait sur les fils d’Israël[b].
  to: Mais moi, j’ai tiré l’épée qu’il avait sur lui et je l’ai décapité[a] ; j’ai ôté l’opprobre qui pesait sur les fils d’Israël[b].
  rationale: La révision retire l’inférence ajoutée par « ainsi », emploie « opprobre » pour rendre directement ὄνειδος, et précise sans surtraduire que l’épée était sur l’adversaire. Les deux ancres de note demeurent placées sur les expressions qu’elles éclairent.
