base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: fr
  text: L’ange de la Présence, qui allait devant le camp d’Israël, prit les tablettes des divisions des années depuis le temps de la création, celles de la Loi et du Témoignage, celles des semaines de leurs jubilés, année par année dans leur totalité, et celles des jubilés, année par année, depuis le jour de la création jusqu’au jour où les cieux, la terre et toutes leurs créatures seront renouvelés selon les puissances du ciel et selon toute la création de la terre, jusqu’à ce que le sanctuaire de Yahweh soit créé à Jérusalem, sur le mont Sion, et que tous les luminaires soient renouvelés pour apporter guérison, paix et bénédiction à tous les élus d’Israël. Et qu’il en soit ainsi dès ce jour-là et pendant tous les jours de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: l’ange de la Présence
  rationale: Rend littéralement l’expression guèze « ange de la face/présence » tout en employant la formulation française consacrée et intelligible.
- source_word: ጸላተ፡ ዘክፋሌ፡ ዓመታት
  choice: les tablettes où sont réparties les années
  rationale: Préserve l’idée de tablettes consignant la division ou répartition chronologique des années, dans un français naturel.
- source_word: ሕገ፡ ወለስምዕ
  choice: la Loi et le Témoignage
  rationale: Conserve les deux termes distincts et leur portée solennelle sans explicitation doctrinale.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: les semaines de leurs jubilés
  rationale: Le possessif du texte est maintenu; « semaines » rend les groupes de sept associés aux jubilés.
- source_word: ኀይላቲሆሙ፡ ለሰማይ
  choice: les puissances du ciel
  rationale: Traduction formelle qui laisse ouverte la question de savoir s’il s’agit des forces, des ordres ou des corps célestes.
- source_word: መቅደሰ፡ እግዚአብሔር
  choice: le sanctuaire de Yahweh
  rationale: « Sanctuaire » traduit le lieu sacré; le nom divin est rendu par « Yahweh » conformément à la couche POB auditée.
- source_word: ኵሉ፡ ብርሃናት
  choice: tous les luminaires
  rationale: Dans ce contexte cosmique, « luminaires » exprime mieux que « lumières » les corps lumineux célestes.
- source_word: ኅሩያነ፡ እስራኤል
  choice: les élus d’Israël
  rationale: Rend directement ceux qui sont choisis, sans préciser davantage l’identité ou le mode d’élection.
theological_decisions:
- issue: Nature du renouvellement cosmique
  choice: « seront renouvelés »
  alternative: « seront créés de nouveau »
  rationale: Le verbe exprime ici le renouvellement; cette traduction évite d’imposer une destruction suivie d’une création ex nihilo.
- issue: Création du sanctuaire
  choice: « jusqu’à ce que le sanctuaire de Yahweh soit créé »
  alternative: « jusqu’à ce que le sanctuaire de Yahweh soit établi »
  rationale: Le texte emploie le verbe de création; la formulation inhabituelle est conservée afin de ne pas en atténuer la portée eschatologique.
- issue: Fonction du renouvellement des luminaires
  choice: « pour apporter guérison, paix et bénédiction »
  alternative: « pour la guérison, la paix et la bénédiction »
  rationale: L’infinitif final exprime naturellement en français la finalité indiquée par le texte, sans définir comment les luminaires y contribuent.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La très longue période de la source est conservée dans sa progression, mais articulée par deux phrases pour assurer la lisibilité. Les répétitions chronologiques et la tension entre renouvellement cosmique et création du sanctuaire sont maintenues.
