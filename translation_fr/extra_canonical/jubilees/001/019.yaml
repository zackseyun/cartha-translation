review_pass:
  verdict: revise
  source_fidelity: Le projet rend fidèlement la prière, les désignations parallèles « ton peuple et ton héritage », l'identification des ennemis comme « les nations », leur domination et l'incitation à pécher. Toutefois, « de sorte qu’ils marchent » présente la marche dans l'égarement comme un résultat affirmé de l'abandon, plutôt que comme la situation redoutée que la prière demande à Dieu de ne pas permettre. La révision conserve l'image de la marche tout en rendant clairement cette portée prohibitive.
  naturalness: Le français est globalement naturel et d'un registre approprié. « Aux mains de » est moins idiomatique ici que « entre les mains de », et « dominent sur eux » est calqué sur la source ; « exercent leur domination sur eux » est plus naturel en français moderne sans modifier le sens.
  terminology: « Seigneur », « Dieu », « peuple », « héritage », « nations », « miséricorde » et le tutoiement conviennent au registre biblique français moderne. « Égarement » préserve la portée morale de l'expression source sans surinterprétation.
  issues:
  - severity: medium
    issue: Valeur de « de sorte qu’ils marchent »
    rationale: Cette locution exprime normalement une conséquence effective en français et peut faire de l'abandon divin la cause du comportement. « Ne permets pas que ... marchent » rend la requête sans imposer une causalité non nécessaire.
  - severity: low
    issue: Formulation de la remise aux ennemis et de leur domination
    rationale: « Entre les mains de » et « exercent leur domination sur » sont les formulations françaises usuelles et maintiennent le singulier « main » implicite et le sens de souveraineté hostile.
