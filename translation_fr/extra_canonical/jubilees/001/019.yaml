  yaml_path: translation/extra_canonical/jubilees/001/019.yaml
  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: fr
  text: 'Il pria et dit : « Seigneur, mon Dieu, ne permets pas que ton peuple et ton héritage marchent dans l’égarement de leur cœur. Ne les livre pas entre les mains de leurs ennemis, les nations, de peur qu’elles n’exercent leur domination sur eux et ne les amènent à pécher contre toi. Que ta miséricorde, Seigneur, s’élève sur ton peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝበከ፡ ወርስትከ
  choice: ton peuple et ton héritage
  rationale: Reproduit les deux désignations parallèles du texte guèze sans les fusionner.
- source_word: በሐዊር፡ በስሕተተ፡ ልቦሙ
  choice: de sorte qu’ils marchent dans l’égarement de leur cœur
  rationale: Conserve l’image source de la marche et rend ስሕተት par « égarement », terme naturel qui garde sa portée morale.
- source_word: አሕዛብ
  choice: les nations
  rationale: Préserve l’apposition qui identifie les ennemis comme les nations, sans ajouter une qualification théologique.
- source_word: ከመ፡ ኢይኰንንዎሙ
  choice: de peur qu’elles ne dominent sur eux
  rationale: Rend la proposition finale négative et le sens de domination du verbe dans ce contexte.
- source_word: ይትለዐል፡ ... ምሕረትከ
  choice: Que ta miséricorde ... s’élève
  rationale: Conserve l’image verticale et la forme de prière du texte source, plutôt que de l’aplatir en « accorde ».
theological_decisions:
- issue: Rapport entre l’abandon divin et la marche dans l’égarement
  choice: de sorte qu’ils marchent dans l’égarement de leur cœur
  alternative: pour marcher dans l’égarement de leur cœur
  rationale: La construction source peut exprimer le résultat ou la conséquence redoutée. Le français choisi reste intelligible sans suggérer que Dieu leur commanderait de s’égarer.
- issue: Agent de l’incitation au péché
  choice: les nations ... ne les amènent à pécher contre toi
  alternative: les nations ... ne les fassent pécher contre toi
  rationale: Maintient l’action causative des ennemis tout en évitant d’effacer la responsabilité humaine impliquée par « pécher ».
translation_notes:
  register: Français moderne, digne et accessible. Tutoiement divin conforme au registre biblique français courant. Syntaxe légèrement solennelle dans la prière, avec maintien des images du texte guèze.
