  yaml_path: translation/extra_canonical/jubilees/001/007.yaml
  text: and they will know that I have been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give the land that flows with milk and honey.’ And they will eat and be satisfied.
translation:
  language: fr
  text: 'Et ils sauront que j’ai été avec eux. Et toi, mets par écrit toutes les paroles que je te fais connaître aujourd’hui, car je connais leur rébellion et leur nuque raide avant de les faire entrer dans le pays au sujet duquel j’ai juré à leurs pères, à Abraham, Isaac et Jacob, en disant : « À votre descendance, je donnerai le pays où coulent le lait et le miel. » Ils mangeront et seront rassasiés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀለው፡ ኮንኩ፡ ምስሌሆሙ
  choice: j’ai été avec eux
  rationale: Rend directement l’expression d’existence et de présence, sans ajouter l’intensif « vraiment » absent du texte.
- source_word: ምረተሙ
  choice: leur rébellion
  rationale: Le contexte deutéronomique et le sens du terme désignent l’insoumission ou la rébellion du peuple.
- source_word: ክሳዶሙ፡ ደቡበ
  choice: leur raideur de nuque
  rationale: Conserve l’image sémitique traditionnelle de l’obstination, intelligible en français biblique moderne.
- source_word: ለዘርእክሙ
  choice: à votre descendance
  rationale: « Descendance » rend naturellement le collectif « semence » sans imposer une lecture singulière.
- source_word: ምድረ፡ እንተ፡ ትውሕዝ፡ ሐሊበ፡ ወመዓረ
  choice: le pays où coulent le lait et le miel
  rationale: Formulation française naturelle qui préserve l’image et l’article défini du texte source.
- source_word: ወይበልዑ፡ ወይጸግቡ
  choice: Ils mangeront et seront rassasiés
  rationale: Reproduit les deux verbes coordonnés et leur valeur future.
theological_decisions:
- issue: Objet du serment divin
  choice: « le pays que j’ai juré de donner à leurs pères »
  alternative: « le pays au sujet duquel j’ai prêté serment à leurs pères »
  rationale: L’ajout de « donner » est explicité par la citation qui suit et produit un français idiomatique sans changer le contenu du serment.
- issue: Chronologie de la connaissance divine
  choice: « avant même de les faire entrer »
  alternative: « avant de les faire entrer »
  rationale: « Même » met naturellement en relief la connaissance préalable exprimée par la construction, sans faire de cette prescience une explication doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « raideur de nuque » maintient l’imagerie biblique tout en évitant une paraphrase interprétative. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
