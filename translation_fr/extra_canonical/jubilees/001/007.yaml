  to: 'Et ils sauront que j’ai été avec eux. Et toi, mets par écrit toutes les paroles que je te fais connaître aujourd’hui, car je connais leur rébellion et leur nuque raide avant de les faire entrer dans le pays au sujet duquel j’ai juré à leurs pères, à Abraham, Isaac et Jacob, en disant : « À votre descendance, je donnerai le pays où coulent le lait et le miel. » Ils mangeront et seront rassasiés.'
