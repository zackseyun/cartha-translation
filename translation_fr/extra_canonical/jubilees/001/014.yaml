  text: And they will forget all my law and all my commandments and all my judgments, and they will go astray as to new moons
translation:
  language: fr
  text: Ils oublieront toute ma loi, tous mes commandements et tous mes jugements, et ils s’égareront à propos des nouvelles lunes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le segment conservé s’arrête ici au milieu d’une énumération ; la suite mentionne les sabbats.
    reason: Signaler la coupure de segmentation qui explique la fin abrupte du verset sans ajouter la suite au texte principal.
lexical_decisions:
- source_word: ይረስዑ
  choice: ils oublieront
  rationale: Rend directement le verbe guèze exprimant l’oubli, avec la valeur future donnée par le contexte.
- source_word: ሕግየ
  choice: ma loi
  rationale: « Loi » est le terme français courant et digne pour la législation divine.
- source_word: ትእዛዝየ
  choice: mes commandements
  rationale: Conserve la distinction lexicale avec « loi » et exprime des prescriptions données avec autorité.
- source_word: ፍትሕየ
  choice: mes règles de justice
  rationale: Le terme peut désigner des jugements, des décisions ou des ordonnances justes ; cette formulation garde sa dimension juridique et morale sans suggérer seulement des verdicts judiciaires.
- source_word: ይስሕቱ
  choice: ils s’égareront
  rationale: Exprime naturellement l’idée de dévier ou de se tromper, sans préciser au-delà du texte la nature exacte de l’égarement.
- source_word: ሠርቀ
  choice: nouvelles lunes
  rationale: Dans ce contexte cultuel et calendaire, le terme renvoie aux nouvelles lunes ; la fin abrupte du segment laisse cependant ouverte sa relation exacte avec la suite.
theological_decisions:
- issue: Portée de « loi », « commandements » et « règles de justice »
  choice: Maintenir les trois expressions distinctes
  alternative: Les regrouper sous une formule générale telle que « toutes mes prescriptions »
  rationale: La triple formulation du texte source doit rester visible et ne pas être harmonisée selon une conception théologique particulière de la Loi.
- issue: Nature de l’égarement concernant les nouvelles lunes
  choice: « s’égareront au sujet des nouvelles lunes »
  alternative: « négligeront les nouvelles lunes » ou « fixeront mal les nouvelles lunes »
  rationale: Le segment transmis ne précise pas exactement en quoi consiste l’erreur ; la traduction conserve cette ambiguïté.
translation_notes:
  register: Français moderne international, clair et digne. La répétition de « tous/toutes » est conservée pour refléter l’insistance du texte source. La ponctuation finale évite la virgule fautive de la segmentation anglaise antérieure.
