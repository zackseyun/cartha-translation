lexical_decisions:
- source_word: በኵሉ፡ ልብየ፡ ወበኵሉ፡ ነፍስየ
  choice: de tout mon cœur et de toute mon âme
  rationale: Rend directement la double expression sémitique, en conservant la première personne indiquée par les suffixes possessifs.
- source_word: ለበረከት፡ ወአኮ፡ ለመርገም
  choice: une bénédiction et non une malédiction
  rationale: Préserve l’antithèse explicite et sa formulation nominale.
- source_word: ርእሰ፡ ወአኮ፡ ዘነበ
  choice: la tête et non la queue
  rationale: Conserve l’image biblique traditionnelle sans l’expliciter ni en réduire la portée métaphorique.
- source_word: መቅደስየ
  choice: mon sanctuaire
  rationale: Le terme désigne un lieu saint ou sanctuaire ; le possessif divin doit être maintenu.
- source_word: ማእከሎሙ
  choice: au milieu d’eux
  rationale: Traduction naturelle qui conserve l’idée de présence centrale parmi le peuple.
- source_word: እኀድር፡ ምስሌሆሙ
  choice: j’habiterai avec eux
  rationale: Rend le verbe de demeure et la relation d’accompagnement sans ajouter d’interprétation théologique.
theological_decisions:
- issue: Portée de l’image « tête et non queue »
  choice: Maintien littéral de la métaphore
  alternative: Ils occuperont le premier rang et non le dernier
  rationale: La formulation imagée renvoie à un langage biblique reconnaissable et peut porter plusieurs nuances ; l’expliciter résoudrait indûment cette richesse.
- issue: Nature du sanctuaire
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » reste plus large et n’impose pas une identification architecturale ou historique précise.
