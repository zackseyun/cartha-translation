  text: and they will turn to foreign gods, to those who cannot deliver them from any of their distress.
translation:
  language: fr
  text: Ils se tourneront vers des dieux étrangers, qui ne pourront les délivrer d’aucune de leurs détresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትመየጡ፡ ኀበ
  choice: se tourneront vers
  rationale: Rend naturellement en français le mouvement d’orientation ou de ralliement exprimé par le verbe avec la préposition.
- source_word: አምላክ፡ ነኪር
  choice: des dieux étrangers
  rationale: « Étrangers » conserve le sens de ce qui est autre ou étranger, ici appliqué à des divinités.
- source_word: ኢያድኅንዎሙ
  choice: ne pourront les délivrer
  rationale: Le verbe exprime le salut ou la délivrance; avec la négation et la relative, le français idiomatique emploie « ne pourront » pour marquer leur incapacité.
- source_word: እምኵሉ፡ ምንዳቤሆሙ
  choice: d’aucune de leurs détresses
  rationale: 'Sous la portée de la négation, « tout » a ici une valeur distributive totale: ces dieux ne les délivreront d’aucune détresse. Cette formulation évite de suggérer une délivrance partielle.'
theological_decisions:
- issue: Nature des « dieux étrangers »
  choice: Conserver l’appellation sans commentaire interprétatif
  alternative: Préciser qu’il s’agit d’idoles ou de faux dieux
  rationale: Le texte les appelle des dieux étrangers; ajouter « idoles » ou « faux » expliciterait une appréciation théologique qui n’est pas lexicalement formulée dans ce verset.
- issue: Portée de la négation avec « tout »
  choice: « d’aucune de leurs détresses »
  alternative: « de toutes leurs détresses »
  rationale: Dans cette construction négative, le sens contextuel est une incapacité totale à délivrer, non l’échec à délivrer de la totalité tout en laissant ouverte une délivrance partielle.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et suit étroitement la structure du guèze, tout en rendant explicitement en français la portée naturelle de la négation.
