base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/009.yaml
  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: fr
  text: Et ce témoignage sera entendu comme un témoignage contre eux. Car ils oublieront tous mes commandements, tout ce que je leur prescris, et ils suivront les nations, leurs impuretés et leurs pratiques honteuses. Ils serviront leurs dieux, qui deviendront pour eux une pierre d’achoppement, une affliction, une détresse et un piège.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: témoignage
  rationale: Le terme désigne ici une attestation appelée à témoigner contre le peuple; « témoignage » conserve sa portée juridique et solennelle.
- source_word: ይረስዑ
  choice: ils oublieront
  rationale: Rend directement l’idée de ne plus garder en mémoire ni observer les commandements.
- source_word: የሐውሩ፡ ድኅረ
  choice: ils suivront
  rationale: L’expression littérale « marcher derrière » signifie adopter la voie ou les pratiques de quelqu’un; « suivre » est naturel en français tout en conservant l’image conceptuelle.
- source_word: ርኵሶሙ
  choice: leurs impuretés
  rationale: Conserve le champ de l’impureté, potentiellement cultuelle et morale, sans en restreindre le sens.
- source_word: ኀሣሮሙ
  choice: leurs pratiques honteuses
  rationale: Exprime la honte ou l’infamie attachée aux actes des nations; « pratiques » explicite naturellement la référence implicite aux comportements.
- source_word: ማዕቅፈ
  choice: pierre d’achoppement
  rationale: Rend l’idée d’un obstacle qui fait tomber, dans un registre biblique encore intelligible.
- source_word: ምንዳቤ፡ ወፃዕር፡ ወመሥገርት
  choice: affliction, détresse et piège
  rationale: Maintient l’accumulation de trois conséquences distinctes et la progression vers l’image finale du piège.
theological_decisions:
- issue: Référent de « ils deviendront pour eux »
  choice: « leurs dieux, qui deviendront pour eux »
  alternative: « ces choses deviendront pour eux »
  rationale: Le pluriel reprend le référent immédiatement précédent, « leurs dieux », tout en évitant d’ajouter une interprétation confessionnelle.
- issue: Portée de l’oubli des commandements
  choice: Conserver « oublieront » sans le remplacer par « désobéiront »
  alternative: « ils désobéiront à tous mes commandements »
  rationale: Le texte formule l’infidélité comme un oubli; cette image théologique doit être préservée plutôt que résolue en simple désobéissance.
