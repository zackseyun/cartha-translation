base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/010.yaml
  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: fr
  text: Beaucoup périront ; ils seront faits prisonniers et tomberont aux mains de l’ennemi, parce qu’ils auront abandonné mes prescriptions, mes commandements, les fêtes de mon alliance, mes sabbats et les choses saintes que j’ai consacrées pour moi au milieu d’eux, ainsi que mon tabernacle et mon sanctuaire, que j’ai consacrés pour moi au milieu du pays afin d’y établir mon nom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሐጐሉ፡ ብዙኃን
  choice: Beaucoup périront
  rationale: Rend directement le verbe de perte ou de destruction et le sujet « beaucoup », dans un français naturel.
- source_word: ይትአኀዙ፡ ወይወድቁ፡ ውስተ፡ እደ፡ ፀር
  choice: ils seront faits prisonniers et tomberont aux mains de l’ennemi
  rationale: « Faits prisonniers » exprime ici la saisie dans un contexte de défaite, tandis que « tomber aux mains de » conserve l’image de la main ennemie.
- source_word: ሥርዐትየ፡ ወትእዛዝየ
  choice: mes prescriptions, mes commandements
  rationale: Distingue les deux termes normatifs sans les réduire tous deux à « lois ».
- source_word: በዓላት፡ ኪዳንየ
  choice: les fêtes de mon alliance
  rationale: Suit la relation nominale retenue par le texte édité et la lecture de consultation, tout en restant idiomatique en français.
- source_word: ቅድሳትየ
  choice: les choses saintes
  rationale: Préserve la portée assez générale du pluriel, plutôt que de la restreindre sans preuve à des objets ou à des lieux sacrés.
- source_word: ደብተራየ፡ ወመቅደስየ
  choice: mon tabernacle et mon sanctuaire
  rationale: Conserve deux désignations cultuelles distinctes, avec leur vocabulaire biblique français usuel.
- source_word: ከመ፡ አሢም፡ ስምየ፡ ላዕሌሁ
  choice: afin d’y établir mon nom
  rationale: Exprime naturellement l’idée de placer le nom sur le sanctuaire, sans développer la formule en une doctrine plus précise de la présence divine.
theological_decisions:
- issue: Rapport entre les fêtes et l’alliance
  choice: « les fêtes de mon alliance »
  alternative: « mes fêtes et mon alliance »
  rationale: L’absence de conjonction devant « mon alliance » favorise une relation de dépendance avec « fêtes » ; la formulation retenue suit cette syntaxe sans ajouter une catégorie séparée.
- issue: Portée de « choses saintes »
  choice: Maintien de la formule générale « les choses saintes »
  alternative: « les objets sacrés » ou « mes lieux saints »
  rationale: Le terme source est général ; une précision matérielle ou spatiale résoudrait indûment son extension.
- issue: Référent singulier du lieu où le nom est établi
  choice: « y établir mon nom »
  alternative: « établir mon nom sur le sanctuaire »
  rationale: L’adverbe « y » garde une certaine souplesse quant au référent exact du pronom singulier source, qui peut viser le sanctuaire ou l’ensemble cultuel évoqué.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période du texte source est conservée, avec un point-virgule pour en clarifier le mouvement. Le vocabulaire cultuel traditionnel (« alliance », « sabbats », « tabernacle », « sanctuaire ») est maintenu parce qu’il est précis et largement intelligible.
