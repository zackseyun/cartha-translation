  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: fr
  text: Ils se construiront des hauts lieux, des bosquets sacrés et des images sculptées. Chacun se prosternera devant sa propre erreur, et ils sacrifieront leurs enfants aux démons et à toute œuvre de l’erreur de leur cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  choice: hauts lieux
  rationale: Le contexte cultuel et le texte de consultation soutiennent le sens de lieux de culte élevés, plutôt qu’un rendu littéral incertain.
- source_word: አመ
  choice: bosquets sacrés
  rationale: Dans cette série d’objets cultuels, le terme désigne vraisemblablement des bosquets ou poteaux associés au culte; « sacrés » explicite leur fonction sans préciser une divinité.
- source_word: ወግልፎ
  choice: images sculptées
  rationale: Rend naturellement un objet taillé ou sculpté destiné au culte.
- source_word: ስሒት / ስሕተት
  choice: erreur / égarement
  rationale: Le champ sémantique est celui de l’erreur et de la déviation. La variation française évite une répétition lourde tout en conservant le lien conceptuel.
- source_word: አጋንንት
  choice: démons
  rationale: Équivalent direct et courant du terme guèze dans ce contexte religieux.
- source_word: ግብረ
  choice: œuvres
  rationale: Le pluriel français convient à l’expression englobante « toutes les œuvres » et conserve l’idée d’actes produits par le cœur égaré.
theological_decisions:
- issue: Nature de « sa propre erreur »
  choice: Chacun se prosternera devant sa propre erreur
  alternative: Chacun se prosternera devant sa propre idole
  rationale: Le texte nomme l’erreur ou l’égarement, non explicitement une idole. Le rendre par « idole » résoudrait indûment la métaphore et réduirait sa portée.
- issue: Rapport entre le cœur égaré et les œuvres
  choice: œuvres inspirées par l’égarement de leur cœur
  alternative: œuvres de l’erreur de leur cœur
  rationale: Le rendu choisi est idiomatique en français et exprime le rapport de provenance ou d’impulsion sans introduire une doctrine particulière.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La syntaxe est répartie en deux phrases pour la lisibilité, tout en maintenant l’accumulation solennelle des pratiques cultuelles condamnées.
