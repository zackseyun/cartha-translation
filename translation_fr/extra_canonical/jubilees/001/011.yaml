    issue: La formulation « toutes les œuvres inspirées par l’égarement de leur cœur » interprète et pluralise la dernière expression.
    rationale: Le texte et l’audit anglais portent « toute œuvre de l’erreur de leur cœur ». « Inspirées par » transforme le rapport génitif en causalité psychologique explicite, tandis que le pluriel n’est pas nécessaire. Un rendu plus direct préserve mieux la formulation et son ambiguïté.
  revised_text: Ils se construiront des hauts lieux, des bosquets sacrés et des images sculptées. Chacun se prosternera devant sa propre erreur, et ils sacrifieront leurs enfants aux démons et à toute œuvre de l’erreur de leur cœur.
