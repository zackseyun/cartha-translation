  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: fr
  text: Et tous sauront que je suis le Dieu d’Israël, le Père de tous les enfants de Jacob et le roi sur le mont Sion pour l’éternité. Sion et Jérusalem seront saintes.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወያእምር፡ ኵሉ
  choice: Et tous sauront
  rationale: Rend directement le futur et le sujet collectif du guèze dans un français naturel.
- source_word: አምላከ፡ እስራኤል
  choice: le Dieu d’Israël
  rationale: Équivalent formel et idiomatique du titre divin.
- source_word: አብ፡ ለኵሎሙ፡ ደቂቀ፡ ያዕቆብ
  choice: le Père de tous les enfants de Jacob
  rationale: Préserve le lien familial explicite et la portée de «tous».
- source_word: ንጉሥ፡ በደብረ፡ ጽዮን
  choice: le roi sur le mont Sion
  rationale: Conserve l’image de la royauté exercée sur le mont Sion.
- source_word: ለዓለመ፡ ዓለም
  choice: pour l’éternité
  rationale: Expression française digne et concise pour la durée perpétuelle indiquée par la formule guèze.
- source_word: ቅድስት
  choice: saintes
  rationale: L’adjectif est mis au pluriel en français puisqu’il qualifie Sion et Jérusalem ensemble.
theological_decisions:
- issue: Coordination des titres divins
  choice: Dieu d’Israël, Père… et roi…
  alternative: répéter l’article devant chaque titre ou restructurer en plusieurs propositions
  rationale: La coordination conserve l’enchaînement du texte source sans ajouter de distinction théologique.
- issue: Sainteté de Sion et de Jérusalem
  choice: seront saintes
  alternative: sera sainte
  rationale: Le texte nomme deux lieux coordonnés; le pluriel français explicite naturellement que la sainteté concerne les deux.
translation_notes:
  register: Français international moderne, simple et digne. La structure reste proche du guèze tout en évitant une formulation artificielle. Aucun ajout provenant d’une version élargie n’a été retenu.
