translation:
  language: fr
  text: et je serai leur Dieu, et eux aussi seront mon peuple, en vérité et en justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ
  choice: Dieu
  rationale: Le terme guèze désigne ici Dieu dans la formule d’alliance « leur Dieu ».
- source_word: ሕዝብየ
  choice: mon peuple
  rationale: Rend directement le nom « peuple » avec le suffixe possessif de première personne.
- source_word: በአማን
  choice: dans la vérité
  rationale: La préposition በ est conservée et አማን exprime ici la vérité ou la fidélité; « vérité » maintient le parallélisme nominal avec « justice » sans exclure la nuance de fidélité.
- source_word: በጽድቅ
  choice: dans la justice
  rationale: Rend la construction prépositionnelle et le sens moral ou relationnel de ጽድቅ.
theological_decisions:
- issue: Formule réciproque d’alliance
  choice: « je serai leur Dieu, et eux aussi seront mon peuple »
  alternative: « je deviendrai leur Dieu, et ils deviendront mon peuple »
  rationale: Le futur français exprime naturellement la relation promise, tandis que « devenir » imposerait une nuance de changement d’état qui n’est pas nécessaire.
- issue: Sens de አማን
  choice: « vérité »
  alternative: « fidélité »
  rationale: Le mot peut couvrir vérité, sûreté et fidélité. « Vérité » suit le témoignage fourni et préserve l’ambiguïté sémantique plutôt que de réduire le terme à la seule fidélité d’alliance.
translation_notes:
  register: Français international moderne, simple et digne. La coordination emphatique « eux aussi » reflète ወእሙንቱኒ. L’extrait source se prolonge par « ወኢ*የኀድ », apparemment le début de la proposition suivante; il n’est pas intégré puisque le verset anglais audité et la segmentation demandée s’arrêtent après « justice ».
