  terminology: « Loi », « Témoignage », « semaines », « jubilés » et « siècles de l’éternité » préservent les termes et le registre du passage. Le possessif de « leurs jubilés » suit l’audit anglais tout en restant volontairement non interprétatif. La note sur l’aspect de « je te fais connaître » est pertinente.
