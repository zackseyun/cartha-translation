  to: 'Et moi, je mettrai par écrit pour toi tout ce que je te fais connaître[a] sur cette montagne : ce qui est premier, ce qui est dernier et ce qui doit arriver, dans toutes les divisions des jours — dans la Loi, dans le Témoignage et dans les semaines de leurs jubilés —, pour toujours, jusqu’à ce que je descende et demeure avec eux dans tous les siècles de l’éternité. »'
