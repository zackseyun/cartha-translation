  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
translation:
  language: fr
  text: 'Et moi, je mettrai par écrit pour toi tout ce que je te fais connaître[a] sur cette montagne : ce qui est premier, ce qui est dernier et ce qui doit arriver, dans toutes les divisions des jours — dans la Loi, dans le Témoignage et dans les semaines de leurs jubilés —, pour toujours, jusqu’à ce que je descende et demeure avec eux dans tous les siècles de l’éternité. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que je te ferai connaître ».'
    reason: L’imparfait éthiopien peut avoir ici une valeur présente ou future ; le contexte favorise une révélation en cours, mais la nuance future reste possible.
lexical_decisions:
- source_word: እጽሐፍ
  choice: je mettrai par écrit
  rationale: Rend naturellement en français le futur du verbe « écrire », tout en explicitant l’acte de consignation.
- source_word: ኵሎ፡ ዘንተ፡ ነገረ
  choice: tout ce que
  rationale: Le syntagme désigne l’ensemble des choses exposées; cette formulation évite le trop étroit « toutes ces paroles ».
- source_word: አየድዐከ
  choice: je te fais connaître
  rationale: L’imparfait éthiopien exprime ici une action en cours; le présent français préserve cet aspect sans en faire une action déjà achevée.
- source_word: ዘቀዳሚ፡ ወዘደኃሪ
  choice: ce qui est au commencement, ce qui est à la fin
  rationale: Conserve le contraste temporel entre le premier et le dernier sans le réduire à une simple énumération.
- source_word: ዙፋቤ፡ መዋዕል
  choice: divisions des jours
  rationale: Expression technique du système chronologique des Jubilés, gardée de manière formelle.
- source_word: ሕግ፡ ወስምዕ
  choice: la Loi et le Témoignage
  rationale: Conserve les deux termes religieux distincts et leur portée technique, avec les majuscules usuelles en français biblique.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: les semaines de leurs jubilés
  rationale: Traduit littéralement l’organisation des jubilés en unités de sept, sans interprétation supplémentaire.
- source_word: በኵሉ፡ ዓለመ፡ ዓለም
  choice: dans tous les siècles de l’éternité
  rationale: Préserve l’expression emphatique et solennelle de durée illimitée.
theological_decisions:
- issue: Moment de la révélation exprimé par አየድዐከ
  choice: je te fais connaître
  alternative: je t’ai fait connaître
  rationale: La forme imperfective soutient une révélation en cours sur la montagne; la traduction ne transforme donc pas cette action en fait entièrement accompli.
- issue: Rapport des divisions des jours avec la Loi et le Témoignage
  choice: établies dans la Loi et dans le Témoignage
  alternative: des jours dans la Loi et dans le Témoignage
  rationale: « Établies » explicite sobrement le lien syntaxique tout en laissant intacte l’idée que la structure temporelle est consignée ou prescrite dans ces deux témoins autoritatifs.
- issue: Descente et habitation divines
  choice: jusqu’à ce que je descende et demeure avec eux
  alternative: jusqu’à ma descente pour demeurer avec eux
  rationale: La formulation verbale conserve directement les deux actions du texte et ne précise ni leur mode ni leur accomplissement théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la longue progression solennelle du texte source, avec une ponctuation qui en clarifie les unités chronologiques. Les termes techniques « Loi », « Témoignage », « semaines » et « jubilés » sont maintenus sans harmonisation confessionnelle.
