revisions:
- from: Crée pour eux un esprit droit, et ne laisse pas l’esprit de Béliar les dominer, les accuser devant toi et les détourner de tout chemin de justice, de peur qu’ils ne périssent loin de ta face. Pourtant, ils sont ton peuple et ton héritage, eux que tu as délivrés de la main de l’Égypte par ta grande puissance. Crée pour eux…
  to: Crée pour eux un esprit droit, et ne permets pas que l’esprit de Béliar domine sur eux, pour les accuser devant toi et les détourner de tout chemin de justice, afin qu’ils périssent de devant ta face. Pourtant, ils sont ton peuple et ton héritage, eux que tu as délivrés de la main de l’Égypte par ta grande puissance. Crée pour eux…
  rationale: Révision limitée à une restitution plus précise de « de devant ta face » et à une syntaxe qui relie explicitement l’accusation et le détournement à l’action de l’esprit de Béliar. La suspension finale est maintenue, car l’extrait s’interrompt au milieu de la phrase.
