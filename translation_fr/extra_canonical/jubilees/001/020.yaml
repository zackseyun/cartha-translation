base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: fr
  text: Crée pour eux un esprit droit, et ne permets pas que l’esprit de Béliar domine sur eux, pour les accuser devant toi et les détourner de tout chemin de justice, afin qu’ils périssent de devant ta face. Pourtant, ils sont ton peuple et ton héritage, eux que tu as délivrés de la main de l’Égypte par ta grande puissance. Crée pour eux…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ
  choice: un esprit droit
  rationale: Rend directement l’idée d’un esprit juste ou droit, dans un français naturel et biblique sans surinterprétation.
- source_word: መንፈሰ፡ ቤልሖር
  choice: l’esprit de Béliar
  rationale: Conserve le nom propre traditionnel et la distinction entre cet esprit et l’« esprit droit ».
- source_word: ወኢይኰንንዎሙ
  choice: ne laisse pas … les dominer
  rationale: Le contexte exprime une prière pour que l’esprit de Béliar n’exerce pas son pouvoir sur eux; la tournure causative française reste claire.
- source_word: ለአስተዋድዮቶሙ፡ ቅድሜከ
  choice: les accuser devant toi
  rationale: Suit le sens judiciaire retenu par l’édition et la consultation anglaise, tout en gardant une formulation concise.
- source_word: ወለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡ ጽድቅ
  choice: et les détourner de tout chemin de justice
  rationale: Exprime l’éloignement hors des voies justes sans introduire l’image plus spécifique d’un piège.
- source_word: እምቅድመ፡ ገጽከ
  choice: loin de ta face
  rationale: Préserve l’image sémitique de la face divine tout en exprimant idiomatiquement la séparation.
- source_word: እምእዴ፡ ግብጽ
  choice: de la main de l’Égypte
  rationale: Conserve la métonymie traditionnelle de la « main », qui désigne le pouvoir oppresseur de l’Égypte.
theological_decisions:
- issue: Identité et action de l’esprit de Béliar
  choice: Conserver « l’esprit de Béliar » et coordonner domination, accusation et détournement.
  alternative: Interpréter Béliar comme Satan en le nommant explicitement, ou faire de l’accusation une simple conséquence indépendante.
  rationale: Le texte nomme Béliar et lui attribue plusieurs actions; remplacer ce nom par une identification théologique explicite résoudrait indûment une question que le passage laisse ouverte.
- issue: Formule « loin de ta face »
  choice: Maintenir l’image de la face divine.
  alternative: Paraphraser par « loin de ta présence » ou « sous ton regard ».
  rationale: La formulation garde la force relationnelle et judiciaire de l’expression source sans préciser si la disparition est physique, cultuelle ou eschatologique.
translation_notes:
  register: Français international moderne, digne et lisible, avec quelques images bibliques conservées (« chemin de justice », « ta face », « main de l’Égypte »). La dernière proposition demeure inachevée avec des points de suspension, puisque l’extrait source se poursuit au verset suivant.
