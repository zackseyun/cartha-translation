  yaml_path: translation/extra_canonical/jubilees/001/022.yaml
  text: and they will not listen until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,
translation:
  language: fr
  text: et ils n’écouteront pas jusqu’à ce qu’ils reconnaissent[a] leur péché et les péchés de leurs pères. Après cela, ils reviendront à moi en toute droiture, de tout leur cœur et de toute leur âme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prennent conscience de » ou « connaissent » leur péché.'
    reason: Le verbe guèze peut exprimer le fait de savoir, de connaître ou de reconnaître ; le contexte favorise « reconnaître » sans exclure la nuance de prise de conscience.
lexical_decisions:
- source_word: ይሰምዑ
  choice: ils écouteront
  rationale: Le verbe signifie littéralement « entendre », mais, dans ce contexte de refus, « écouter » exprime naturellement l’idée d’obéir ou de prêter attention sans la surinterpréter.
- source_word: ያአምሩ
  choice: ils reconnaissent
  rationale: Le verbe peut signifier « savoir », « connaître » ou « reconnaître ». Devant « leurs péchés », « reconnaître » convient au contexte de prise de conscience et de retour à Dieu.
- source_word: ይትመየጡ
  choice: ils reviendront
  rationale: Le verbe exprime ici un retour vers Dieu; « reviendront » conserve à la fois le mouvement relationnel et la portée repentante du passage.
- source_word: ርቱዕ
  choice: droiture
  rationale: Le terme désigne ce qui est droit ou juste. « En toute droiture » reste proche de la formulation source et préserve sa portée morale.
theological_decisions:
- issue: Rapport entre la reconnaissance des péchés et le retour à Dieu
  choice: 'Conserver la succession explicite : ils reconnaissent leurs péchés, puis reviennent à Dieu.'
  alternative: Fondre les deux actions dans une paraphrase générale de repentance.
  rationale: Le texte distingue les étapes et introduit le retour par « après cela »; les fusionner réduirait la tension et la progression du passage.
- issue: « Leurs pères »
  choice: Conserver « leurs pères ».
  alternative: Employer « leurs ancêtres ».
  rationale: « Pères » correspond directement au terme source et maintient la dimension familiale et générationnelle sans préciser davantage la portée.
translation_notes:
  register: Français international moderne, naturel et digne. La proposition initiale « leur cou », vestige probable de la fin du verset précédent selon la coupure de chapitre, n’est pas intégrée ici. La coordination et la ponctuation finale conservent le lien avec la suite du discours.
