  text: and I will cut off the foreskin of their heart and the foreskin of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from following me from that day and forever.
translation:
  language: fr
  text: Je retrancherai le prépuce de leur cœur[a] et le prépuce du cœur de leur descendance. Je créerai pour eux un esprit saint et je les purifierai, afin que, dès ce jour et pour toujours, ils ne cessent pas de me suivre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « j’ôterai l’incirconcision de leur cœur » ; littéralement : « le prépuce de leur cœur ».'
    reason: Signaler l’équivalence métaphorique entre le prépuce et l’incirconcision du cœur tout en conservant dans le texte l’image littérale.
  - marker: b
    text: 'Littéralement : « ils ne se détournent pas de derrière moi » ; autre traduction possible : « ils ne se détournent pas de moi ».'
    reason: Préserver l’image spatiale de l’expression guèze et son sens idiomatique de cesser de suivre quelqu’un.
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ፡ (qʷəlfata ləbbomu)
  choice: le prépuce de leur cœur
  rationale: Le nom désigne littéralement le prépuce ou l’incirconcision et reprend la métaphore biblique de la circoncision du cœur. « Prépuce » conserve cette image forte sans l’atténuer en simple « enveloppe ».
- source_word: ዘርኦሙ፡ (zarʾomu)
  choice: leur descendance
  rationale: Ce terme collectif désigne leur semence, c’est-à-dire leurs descendants. « Descendance » est naturel en français moderne et conserve la portée collective.
- source_word: መንፈሰ፡ ቅዱሰ፡ (manfasa qəddusa)
  choice: un esprit saint
  rationale: La construction est indéfinie et peut désigner un esprit rendu saint ou l’action divine associée à l’Esprit saint. La minuscule et l’article indéfini préservent cette ambiguïté au lieu d’imposer une identification doctrinale.
- source_word: እምድኅሬየ፡ (ʾəm-dəḫreya)
  choice: renoncent à me suivre
  rationale: L’expression signifie littéralement « de derrière moi » dans un contexte de détournement. Le français idiomatique « renoncer à me suivre » exprime clairement l’abandon de la marche à la suite de Dieu.
theological_decisions:
- issue: Métaphore de la circoncision du cœur
  choice: retrancher le prépuce de leur cœur
  alternative: ôter l’enveloppe de leur cœur
  rationale: La formulation retenue maintient l’image corporelle et l’écho scripturaire de la circoncision intérieure, que l’alternative eupémistique affaiblirait.
- issue: Identité de l’« esprit saint »
  choice: un esprit saint
  alternative: l’Esprit Saint
  rationale: Le texte ne force pas explicitement une lecture personnelle et définie. La traduction conserve donc l’indétermination grammaticale et théologique.
- issue: Détournement « de derrière » Dieu
  choice: ne renoncent plus à me suivre
  alternative: ne se détournent plus de moi
  rationale: Le choix principal rend la dimension de marche à la suite de Dieu contenue dans l’expression spatiale, tandis que l’alternative reste possible mais moins précise.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « prépuce » est maintenue parce qu’elle reproduit l’insistance du texte source. « Descendance » évite l’ambiguïté moderne de « semence ». Le segment final ወትትሉ, vraisemblablement rattaché à la suite par la division du chapitre, n’est pas intégré au verset conformément au témoin éditorial fourni et à la validation de découpage.
