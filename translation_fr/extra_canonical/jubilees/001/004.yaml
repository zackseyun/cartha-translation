  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
translation:
  language: fr
  text: Le septième jour, il appela Moïse du milieu de la nuée. L’aspect de la gloire de Yahweh était comme[a] un feu ardent au sommet de la montagne. Moïse resta sur la montagne quarante jours et quarante nuits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la gloire de Yahweh apparut comme ».'
    reason: Préserve l’autre analyse possible de la forme guèze et de la syntaxe de la proposition.
lexical_decisions:
- source_word: ርእዩ፡ ስብሐተ፡ እግዚአብሔር
  choice: L’aspect de la gloire de Yahweh
  rationale: Le syntagme est rendu avec « aspect », substantif théophanique qui préserve la structure de la source et l’ambiguïté signalée par la tradition textuelle, plutôt qu’avec une simple forme verbale « apparut ».
- source_word: እማእከለ፡ ደመና
  choice: du milieu de la nuée
  rationale: « Nuée » convient au registre théophanique tout en restant clair en français biblique moderne.
- source_word: ከመ፡ እሳት፡ ዘያነድድ
  choice: comme un feu ardent
  rationale: Cette formulation naturelle conserve la comparaison et l’idée d’un feu qui brûle intensément.
- source_word: እግዚአብሔር
  choice: Yahweh
  rationale: Le nom divin est translittéré conformément à la valeur référentielle du texte et à la politique suivie dans la couche de consultation.
- source_word: ውስተ፡ ርእሰ፡ ደብር
  choice: au sommet de la montagne
  rationale: Rend directement la localisation littérale « sur la tête/le sommet de la montagne » dans un français idiomatique.
theological_decisions:
- issue: Relation syntaxique entre l’aspect, la gloire et la comparaison avec le feu
  choice: « L’aspect de la gloire de Yahweh était comme… »
  alternative: « La gloire de Yahweh apparut comme… »
  rationale: Le texte peut être compris avec un substantif signifiant « aspect/apparence » ou selon une lecture verbale. Le texte principal suit la structure nominale, tandis que la note conserve l’autre possibilité sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » et « gloire » maintiennent le registre théophanique biblique; « resta » est plus naturel ici que la répétition de « était », sans ajouter d’interprétation.
