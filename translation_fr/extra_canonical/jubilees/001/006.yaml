  yaml_path: translation/extra_canonical/jubilees/001/006.yaml
  text: 'today for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they are in all their judgments and in all their deeds,'
translation:
  language: fr
  text: '« aujourd’hui[a], pour leurs générations, sur le mont Sinaï. Il en sera ainsi : lorsque tout ce qui a été dit à leur sujet leur arrivera, ils sauront que je suis plus juste qu’eux dans tous leurs jugements et dans toutes leurs actions, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en rattachant « aujourd’hui » à la proposition précédente : « pour leurs générations, sur le mont Sinaï ».'
    reason: Le segment guèze commence par « aujourd’hui », mais la coupure de verset rend son rattachement syntaxique à la proposition précédente possible.
lexical_decisions:
- source_word: ዮም
  choice: aujourd’hui
  rationale: Rend explicitement l’adverbe temporel présent au début du segment guèze, tout en signalant en note l’incertitude possible de son rattachement syntaxique.
- source_word: ይመጽእ፡ ኵሉ፡ ዝነገር፡ ላዕሌሆሙ
  choice: quand tout ce qui a été annoncé à leur sujet s’accomplira
  rationale: Le sens littéral est celui de tout ce qui a été dit venant sur eux. « S’accomplira » exprime naturellement en français la réalisation des événements annoncés, sans imposer qu’ils soient tous uniquement des malheurs.
- source_word: ጻድቅ፡ እምኔሆሙ
  choice: plus juste qu’eux
  rationale: La construction comparative est conservée, y compris sa formulation théologiquement frappante, plutôt que d’être atténuée en une simple affirmation de la justice divine.
- source_word: ፍትሖሙ
  choice: leurs jugements
  rationale: Conserve le champ judiciaire du terme et le suffixe possessif pluriel du texte source.
- source_word: ምግባሮሙ
  choice: leurs actions
  rationale: Expression française courante qui rend les actes ou la conduite désignés par le terme guèze.
theological_decisions:
- issue: Comparaison entre la justice divine et celle des destinataires
  choice: « je suis plus juste qu’eux »
  alternative: « je suis juste, contrairement à eux »
  rationale: Le texte source présente une comparaison explicite. La traduction la maintient sans la reformuler selon une conception théologique préalable de la justice divine.
- issue: Nature des événements annoncés
  choice: « tout ce qui a été annoncé à leur sujet s’accomplira »
  alternative: « toutes ces choses fondront sur eux »
  rationale: Le guèze permet l’image de choses qui viennent sur les destinataires, mais ne précise pas ici que chacune est punitive. La formulation retenue préserve l’idée d’accomplissement prophétique sans surinterprétation.
translation_notes:
  register: Français international actuel, digne et lisible. Les tournures ont été fluidifiées sans effacer le caractère prophétique du passage ni la comparaison inhabituelle concernant la justice.
