translation:
  language: fr
  text: '« un cœur pur et un esprit saint, et ne permets pas qu’ils soient pris au piège de leurs péchés, dès maintenant et pour toujours. » Le SEIGNEUR dit à Moïse : « Je connais leur opposition, leurs pensées et leur nuque raide, et ils n’écouteront pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ንጹሐ
  choice: un cœur pur
  rationale: Rend directement l’expression guèze par une formulation française naturelle et bibliquement reconnaissable.
- source_word: መንፈሰ፡ ቅዱሰ
  choice: un esprit saint
  rationale: Conserve l’indétermination de l’expression et évite d’imposer ici une identification doctrinale explicite avec « l’Esprit Saint ».
- source_word: ኢይትዐቀጹ
  choice: ne permets pas qu’ils soient pris au piège
  rationale: Exprime la valeur d’enchevêtrement ou de capture du verbe dans le contexte d’une prière adressée à Dieu.
- source_word: ተዋሥኦቶሙ
  choice: leur opposition
  rationale: Préserve l’idée de résistance ou de contradiction sans la réduire à une simple différence d’opinion.
- source_word: ሕሊናሆሙ
  choice: leurs pensées
  rationale: Équivalent large et naturel qui conserve la référence à leur disposition mentale.
- source_word: ይቡሰ
  choice: leur raideur de nuque
  rationale: Maintient l’image sémitique de l’obstination plutôt que de la remplacer entièrement par une abstraction comme « entêtement ».
theological_decisions:
- issue: Statut de « l’esprit saint »
  choice: un esprit saint
  alternative: l’Esprit Saint
  rationale: Le texte demande ou évoque un esprit caractérisé par la sainteté sans obliger grammaticalement à y voir le nom propre d’une personne divine.
- issue: Responsabilité humaine et protection divine face au péché
  choice: ne permets pas qu’ils soient pris au piège de leurs péchés
  alternative: qu’ils ne se laissent pas prendre au piège de leurs péchés
  rationale: La construction s’inscrit dans une demande adressée à Dieu, tout en conservant les péchés des personnes comme le piège qui les menace.
translation_notes:
  register: Français international moderne, digne et accessible. « SEIGNEUR » représente le titre divin. L’image de la « raideur de nuque » est volontairement conservée malgré son caractère légèrement marqué, car elle porte une métaphore biblique significative.
