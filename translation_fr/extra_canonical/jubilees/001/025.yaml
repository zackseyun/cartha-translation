  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: fr
  text: Et tout ange et tout esprit sauront que ceux-ci sont mes enfants, que moi, je suis leur Père dans la droiture et la justice, et que je les aime.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ መላእክ፡ ወኵሉ፡ መንፈስ፡
  choice: tout ange et tout esprit
  rationale: Reproduit la distributivité et le parallélisme du guèze, tout en restant naturel en français.
- source_word: ውሉድየ፡
  choice: mes enfants
  rationale: Le terme désigne les enfants ou descendants; «mes enfants» convient au contexte où Dieu se présente comme leur Père.
- source_word: አቡሆሙ፡
  choice: leur Père
  rationale: Rend directement la relation paternelle exprimée par le texte; la majuscule signale ici la désignation divine sans ajouter de contenu.
- source_word: በርቶዕ፡ ወበጽድቅ፡
  choice: dans la droiture et la justice
  rationale: Conserve les deux notions éthiques distinctes ainsi que leur coordination.
- source_word: ወአፈቅርሙ፡
  choice: et que je les aime
  rationale: Traduction directe du verbe d’amour avec son objet pluriel.
theological_decisions:
- issue: Lien syntaxique de «dans la droiture et la justice»
  choice: Rattachement à l’affirmation «je suis leur Père»
  alternative: Rattachement implicite à la manière dont Dieu aime ses enfants
  rationale: L’ordre du texte place l’expression immédiatement après «leur Père»; la traduction maintient cette proximité et ne résout pas davantage la portée possible de la formule.
translation_notes:
  register: Français moderne, digne et accessible. La reprise emphatique «que moi, je suis» reflète le pronom indépendant du guèze sans alourdir excessivement la phrase.
