  text: La gloire du Seigneur était sur le mont Sinaï, et la nuée le couvrit pendant six jours. Puis il l’appela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: La gloire du Seigneur
  rationale: Rend directement le syntagme guèze désignant la gloire du Seigneur, dans la continuité du vocabulaire biblique français courant.
- source_word: ውስተ፡ ደብረ፡ ሲና
  choice: était sur le mont Sinaï
  rationale: Le texte transmis présente une proposition nominale; l’ajout de « était » est nécessaire en français naturel, et « sur » rend ici ውስተ dans son contexte spatial.
- source_word: ጸለሎ፡ ደመና
  choice: la nuée le couvrit
  rationale: « Nuée » conserve le registre biblique associé à la manifestation divine; le pronom masculin renvoie naturellement au mont Sinaï.
- source_word: ስዱሰ፡ ዕለተ
  choice: pendant six jours
  rationale: Expression temporelle idiomatique et fidèle à la durée indiquée.
- source_word: ወጸውዖ
  choice: Puis il l’appela
  rationale: Le verbe porte un sujet et un objet pronominaux masculins. « Puis » marque l’enchaînement narratif du waw sans alourdir le français.
theological_decisions:
- issue: Référent du sujet dans « il l’appela »
  choice: Maintenir le pronom « il » sans expliciter « le Seigneur »
  alternative: Puis le Seigneur l’appela
  rationale: La forme guèze encode le pronom mais ne répète pas explicitement le nom divin; la traduction préserve cette formulation tout en laissant le contexte identifier le sujet.
- issue: Référent de l’objet dans « la nuée le couvrit »
  choice: Employer « le », renvoyant au mont Sinaï
  alternative: Employer « la », renvoyant à la gloire
  rationale: Le contexte et le parallèle d’Exode 24 favorisent le mont comme référent, mais l’antécédent grammatical peut rester légèrement ouvert dans le texte source. Le choix retenu donne un français lisible sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » est conservé pour sa valeur biblique établie; la syntaxe demeure concise et narrative.
