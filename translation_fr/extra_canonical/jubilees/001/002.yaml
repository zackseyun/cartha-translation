  yaml_path: translation/extra_canonical/jubilees/001/002.yaml
  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: fr
  text: 'Le seizième jour de ce mois-là, le Seigneur parla à Moïse en ces termes : « Monte vers moi sur la montagne. Je te donnerai les deux tables de pierre, celles de la loi et du commandement que j’ai écrits, afin que tu les enseignes. » Moïse monta donc sur la montagne du Seigneur et y demeura.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze fourni dit littéralement que Moïse « monta sur la montagne du Seigneur et demeura ». Il ne mentionne ici ni la gloire du Seigneur ni le nom de Sinaï.
    reason: Signaler une différence substantielle entre la source guèze transmise et la couche anglaise de consultation, sans importer dans le corps du texte des mots absents de la source.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Dans le texte guèze fourni, ce titre divin signifie « Seigneur »; rendre ici « Yahvé » supposerait un nom divin hébreu qui n’apparaît pas explicitement dans la source transmise.
- source_word: ዕረግ፡ ኀቤየ፡ ውስተ፡ ደብር
  choice: Monte vers moi sur la montagne
  rationale: Reproduit le mouvement d’ascension et la destination exprimés par le guèze, dans un français naturel.
- source_word: ክልኤተ፡ ጽላተ፡ እብን
  choice: les deux tables de pierre
  rationale: Équivalent français biblique courant et fidèle à l’expression guèze.
- source_word: ዘሕግ፡ ወዘትእዛዝ
  choice: celles de la loi et du commandement
  rationale: Maintient les deux substantifs coordonnés de la source sans les fusionner ni résoudre leur relation exacte.
- source_word: ታስብዎሙ
  choice: afin que tu les enseignes
  rationale: Rend la finalité pédagogique du verbe dans ce contexte; le pronom pluriel renvoie à ce qui a été écrit sur les tables.
- source_word: ወኀደረ
  choice: et y demeura
  rationale: Le verbe signifie rester, séjourner ou demeurer. Cette traduction conserve le sens de la forme guèze sans ajouter de sujet absent.
theological_decisions:
- issue: Représentation du nom divin
  choice: le Seigneur
  alternative: Yahvé
  rationale: La traduction suit d’abord la forme guèze effectivement fournie, እግዚአብሔር (« Seigneur »), plutôt que de reconstruire silencieusement un éventuel antécédent hébreu.
- issue: Fin du verset et présence de la gloire divine
  choice: Moïse demeure sur la montagne
  alternative: « la gloire du Seigneur demeura sur le mont Sinaï »
  rationale: Le texte guèze cité attribue le verbe final à Moïse et ne contient ni « gloire » ni « Sinaï ». L’ajout présent dans la couche anglaise n’est donc pas introduit dans le texte français.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la cadence narrative et le vocabulaire biblique courant, tout en évitant les archaïsmes. La relation entre « la loi » et « le commandement » reste volontairement ouverte, conformément au guèze.
