  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: fr
  text: J’enverrai auprès d’eux des témoins afin de leur rendre témoignage, mais ils n’écouteront pas. Ils tueront aussi les témoins, chasseront ceux qui recherchent la Loi, bouleverseront tout et commenceront à faire le mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕተ
  choice: des témoins / les témoins
  rationale: Le terme désigne des témoins; sa reprise dans la proposition suivante est conservée.
- source_word: ከመ፡ አስምዕ፡ ሎሙ
  choice: afin de témoigner contre eux
  rationale: La construction exprime le but de l’envoi. « Contre eux » rend ici la portée accusatrice du témoignage dans le contexte du refus annoncé.
- source_word: ሕገ
  choice: la Loi
  rationale: Le substantif désigne la loi; la majuscule indique ici l’ensemble normatif révélé, sans ajouter de précision confessionnelle.
- source_word: ያፀርዑ
  choice: bouleverseront
  rationale: Ce choix restitue l’idée de renverser ou de mettre sens dessus dessous, tout en restant naturel en français.
- source_word: ይዌልእ፡ ለገቢረ፡ እኩይ
  choice: se mettront à faire le mal
  rationale: Rend explicitement l’aspect inchoatif (« commencer à ») et l’expression « faire le mal ».
theological_decisions:
- issue: Portée du témoignage divin
  choice: témoigner contre eux
  alternative: leur rendre témoignage / témoigner auprès d’eux
  rationale: Le contexte judiciaire et leur refus d’écouter favorisent une valeur accusatrice, sans préciser davantage le contenu du témoignage.
- issue: Référent de la loi
  choice: la Loi
  alternative: la loi
  rationale: La majuscule signale la Loi comme norme révélée dans le cadre du récit, sans l’identifier à une formulation canonique particulière.
translation_notes:
  register: Français international moderne, clair et digne. Les propositions coordonnées gardent la progression insistante du texte source, avec une syntaxe allégée pour une lecture naturelle.
