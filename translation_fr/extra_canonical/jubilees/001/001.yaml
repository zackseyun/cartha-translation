lexical_decisions:
- source_word: ወኮነ
  choice: Et il arriva
  rationale: Reproduit la formule narrative sémitique d’ouverture dans un français biblique naturel et digne.
- source_word: በቀዳሚ፡ ዓመት
  choice: la première année
