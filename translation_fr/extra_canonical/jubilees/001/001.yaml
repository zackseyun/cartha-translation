  choice: des enfants d’Israël
  rationale: Conserve la désignation traditionnelle et collective, immédiatement compréhensible dans ce registre.
- source_word: እምነ፡ ግብጽ
  choice: hors d’Égypte
  rationale: Rend le mouvement depuis l’Égypte avec une tournure française idiomatique associée à « départ ».
- source_word: በወርኅ፡ ሣልስ
  choice: au troisième mois
  rationale: Traduction directe qui préserve l’indétermination du jour dans ce fragment.
theological_decisions:
