  to: 'Le Seigneur lui fit connaître ce qui était au commencement et ce qui devait venir : le récit de la division de tous les jours de la loi et du témoignage. Il dit : « Prends à cœur tout ce que je te dis sur cette montagne et écris-le dans un livre, afin que leurs générations voient que je ne les ai pas abandonnés à cause de tout le mal qu’ils ont commis en transgressant l’ordonnance que j’établis entre moi et toi. »'
  rationale: La révision rétablit la relation causale du texte sans tenter de l’harmoniser ou de l’interpréter doctrinalement. Elle retire l’explicitation non requise de la succession des générations et emploie « ordonnance » pour la prescription établie entre Dieu et Moïse. Aucun appel de note n’est présent ni requis.
