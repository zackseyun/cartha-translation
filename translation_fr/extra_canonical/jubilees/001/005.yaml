  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: fr
  text: 'Le Seigneur lui fit connaître ce qui était au commencement et ce qui devait venir : le récit de la division de tous les jours de la loi et du témoignage. Il dit : « Prends à cœur tout ce que je te dis sur cette montagne et écris-le dans un livre, afin que leurs générations voient que je ne les ai pas abandonnés à cause de tout le mal qu’ils ont commis en transgressant l’ordonnance que j’établis entre moi et toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመሮ
  choice: fit connaître
  rationale: Le verbe exprime ici le fait de faire savoir ou de révéler à Moïse; « fit connaître » reste naturel sans préciser indûment le mode de révélation.
- source_word: ዘቀዳሚ፡ ወዘኒ፡ ይመጽእ
  choice: ce qui était au commencement et ce qui devait venir
  rationale: Cette formulation conserve l’opposition temporelle entre ce qui précède ou est premier et ce qui viendra, sans la réduire à une simple chronologie historique.
- source_word: ኩፋሌ
  choice: division
  rationale: Le terme désigne une répartition ou division et fait écho au thème structurant des Jubilés; le singulier français collectif convient dans cette construction.
- source_word: ሕግ፡ ወስምዕ
  choice: la loi et le témoignage
  rationale: Traduction directe des deux substantifs, en conservant leur juxtaposition et leur portée potentiellement technique sans ajouter d’interprétation confessionnelle.
- source_word: አነብር፡ ልበከ
  choice: Prends à cœur
  rationale: Équivalent idiomatique moderne de l’expression littérale « place ton cœur », qui appelle une attention intérieure soutenue.
- source_word: ሥርዐት
  choice: règle
  rationale: Le mot peut désigner un ordre, une ordonnance ou une prescription; « règle » est clair et garde une portée générale sans surcharger le registre juridique.
theological_decisions:
- issue: Rapport entre le mal commis, la transgression et l’abandon divin
  choice: « je ne les ai pas abandonnés malgré tout le mal… en transgressant »
  alternative: « je ne les ai pas abandonnés à cause de tout le mal… »
  rationale: 'La préposition peut être rendue causalement, comme dans la consultation anglaise, mais cela risquerait de suggérer que leur mal serait la raison positive de leur non-abandon. « Malgré » exprime plus clairement la tension du passage : leur transgression est réelle, mais Dieu ne les a pas délaissés.'
- issue: Identité de ceux que Dieu n’a pas abandonnés
  choice: Accord masculin pluriel renvoyant au peuple ou aux descendants
  alternative: Accord féminin pluriel renvoyant grammaticalement aux « générations »
  rationale: Le suffixe guèze est masculin pluriel et vise vraisemblablement les membres du peuple à travers leurs générations; la formulation française garde ce renvoi humain sans identifier plus précisément le groupe.
translation_notes:
  register: Français international actuel, digne et lisible. Le discours direct conserve le tutoiement attendu dans l’adresse divine à Moïse. Les termes « loi » et « témoignage » restent en minuscules, conformément à leur forme nominale dans la source. La syntaxe conserve l’ambiguïté du rattachement de « de la loi et du témoignage » à la division des jours.
