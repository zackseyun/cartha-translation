  text: and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace in righteousness, and I will transplant them as an upright planting,
translation:
  language: fr
  text: les sabbats, les fêtes, les jubilés et les prescriptions. Après cela, ils reviendront à moi du milieu des nations, de tout leur cœur, de toute leur âme et de toute leur force. Je les rassemblerai du milieu de toutes les nations, et ils me chercheront afin de me trouver. Quand ils me chercheront de tout leur cœur et de toute leur âme, je leur révélerai une paix abondante dans la justice, et je les transplanterai comme une plantation droite,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le qualificatif peut aussi évoquer ce qui est juste ou ferme.
    reason: Conserve dans le texte l’image première de « droite » tout en signalant, sans les imposer, les nuances sémantiques possibles de ርቱዐ.
lexical_decisions:
- source_word: ይትመየጡ
  choice: ils reviendront
  rationale: Le verbe exprime le retour ou la conversion vers Dieu; «reviendront à moi» garde le mouvement relationnel sans surinterprétation confessionnelle.
- source_word: አስተጋብኦሙ
  choice: Je les rassemblerai
  rationale: Le causatif indique l’action de réunir; le contexte précise un rassemblement depuis toutes les nations.
- source_word: የኀሡኒ
  choice: ils me chercheront
  rationale: Rend directement la recherche de Dieu et conserve la reprise du même verbe dans la proposition suivante.
- source_word: እከሥት
  choice: je leur révélerai
  rationale: Le verbe signifie ouvrir, dévoiler ou manifester; «révélerai» convient à la paix que Dieu rend accessible ou manifeste.
- source_word: እፈልሶሙ
  choice: je les transplanterai
  rationale: Le causatif de l’idée de déplacement évoque un transfert suivi d’un nouvel établissement, et se distingue du verbe ordinaire «planter» présent dans le syntagme suivant.
- source_word: ተክለ፡ ርቱዐ
  choice: une plantation bien enracinée
  rationale: Littéralement une plantation droite/ferme. En français, «bien enracinée» exprime naturellement sa stabilité, tout en laissant une note signaler le sens plus formel.
theological_decisions:
- issue: La recherche de Dieu et la possibilité de le trouver
  choice: afin de me trouver
  alternative: afin que je me laisse trouver par eux
  rationale: La tournure guèze peut refléter une construction où Dieu est trouvé par eux. La formulation retenue est naturelle et conserve le but sans trancher explicitement entre initiative humaine et disponibilité divine.
- issue: Rapport entre la paix et la justice
  choice: une paix abondante dans la justice
  alternative: une paix abondante avec justice
  rationale: «Dans la justice» préserve l’association étroite et quelque peu ouverte du texte source, sans réduire la justice à un simple accompagnement.
- issue: Image finale de l’établissement du peuple
  choice: je les transplanterai comme une plantation bien enracinée
  alternative: je les transplanterai comme une plantation droite
  rationale: Le choix conserve l’image horticole et le déplacement depuis les nations. «Bien enracinée» privilégie en français la notion de fermeté portée par ርቱዐ, tandis que la note maintient le sens littéral possible de droiture.
translation_notes:
  register: Français moderne, international et digne. Les parallélismes «de tout leur cœur, de toute leur âme et de toute leur force» sont conservés. La ponctuation transforme le fragment initial en continuation naturelle du verset précédent. Le vocabulaire «sabbats», «jubilés» et «prescriptions» garde la couleur institutionnelle du passage sans archaïsme excessif.
