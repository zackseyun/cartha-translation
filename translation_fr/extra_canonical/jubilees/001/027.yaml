  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: fr
  text: 'Et il dit à l’ange de la Présence : « Écris pour Moïse depuis le commencement de la création jusqu’au temps où mon sanctuaire sera édifié au milieu d’eux pour les siècles des siècles, et le Seigneur apparaîtra aux yeux de tous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: l’ange de la Présence
  rationale: Rend littéralement le titre éthiopien « ange de la face/présence » dans une formulation française consacrée et intelligible.
- source_word: እምቀዳሚ፡ ፍጥረት
  choice: depuis le commencement de la création
  rationale: Conserve le point de départ temporel exprimé par le guèze sans explicitation supplémentaire.
- source_word: ይትሐነጽ፡ መቅደስየ
  choice: mon sanctuaire sera édifié
  rationale: Le passif du verbe « bâtir » est maintenu; « sanctuaire » rend le lieu sacré sans le réduire nécessairement au bâtiment du Temple.
- source_word: ለዓለመ፡ ዓለማት
  choice: pour les siècles des siècles
  rationale: Reproduit l’expression emphatique de durée indéfinie dans une tournure française biblique, claire et digne.
- source_word: ያስተርኢ፡ እግዚአብሔር፡ ለዐይን፡ ኵሉ
  choice: le Seigneur apparaîtra aux yeux de tous
  rationale: Suit directement le sens de la proposition guèze et préserve son caractère universel.
theological_decisions:
- issue: Lien temporel de la dernière proposition
  choice: « et où le Seigneur apparaîtra »
  alternative: « et le Seigneur apparaîtra »
  rationale: La reprise de « où » donne en français une articulation naturelle avec « jusqu’au temps » tout en conservant la coordination et sans préciser davantage le rapport chronologique.
- issue: Titre divin እግዚአብሔር
  choice: le Seigneur
  alternative: Dieu
  rationale: « Le Seigneur » est l’équivalent traditionnel et formel du titre divin guèze employé ici; la traduction évite d’identifier plus précisément le référent que ne le fait le texte.
translation_notes:
  register: Français international moderne, au registre biblique digne mais accessible. La syntaxe suit étroitement la progression du texte guèze, avec une ponctuation qui facilite la lecture à voix haute.
