  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: fr
  text: Leurs âmes s’attacheront à moi et à tous mes commandements, et ils mettront mes commandements en pratique. Je serai leur Père, et ils seront mes enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ
  choice: leur âme
  rationale: Le nom est au singulier avec un possesseur pluriel; le singulier collectif du guèze est conservé naturellement en français.
- source_word: ትእዛዝየ
  choice: mes commandements
  rationale: Rend directement l’idée d’ordres divins faisant autorité et maintient la répétition du texte source.
- source_word: ይገብሩ
  choice: mettront … en pratique
  rationale: Dans ce contexte, le verbe exprime l’accomplissement concret des commandements; cette tournure est plus idiomatique que « feront mes commandements ».
- source_word: አበ / ውሉደ
  choice: père / enfants
  rationale: Conserve sans ajout l’image familiale et relationnelle du texte.
theological_decisions:
- issue: Relation d’alliance exprimée par la paternité et la filiation
  choice: Je serai leur père, et ils seront mes enfants.
  alternative: Je deviendrai leur Père, et ils deviendront mes fils.
  rationale: La formulation choisie préserve l’affirmation relationnelle sans introduire une nuance doctrinale de transformation; « enfants » rend le pluriel de manière inclusive et naturelle.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « mes commandements » est maintenue parce qu’elle structure la phrase source. L’extrait guèze fourni se poursuit par des mots relevant vraisemblablement de la division versifiée suivante; le présent texte suit la limite attestée pour Jubilés 1.24 dans la couche de consultation.
