  text: before my eyes. And I will hide my face from them, and I will deliver them into the hand of the nations for captivity and for plunder and for devouring, and I will uproot them from the midst of the land, and I will scatter them among the nations.
translation:
  language: fr
  text: devant mes yeux. Je leur cacherai mon visage et je les livrerai entre les mains des nations, pour qu’ils soient emmenés en captivité, pillés et dévorés. Je les déracinerai[a] du milieu du pays et je les disperserai parmi les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les arracherai ».
    reason: Le verbe peut exprimer l’arrachement ou l’éradication ; la note signale cette nuance sans affaiblir « déracinerai » dans le texte.
lexical_decisions:
- source_word: አኀብእ ገጽየ
  choice: je leur cacherai mon visage
  rationale: Rend directement l’idiome guèze, qui exprime le retrait de la faveur ou de la protection divine sans expliciter davantage.
- source_word: ውስተ እደ አሕዛብ
  choice: aux mains des nations
  rationale: Conserve l’image sémitique de la remise au pouvoir des nations, naturelle et intelligible en français biblique moderne.
- source_word: ለፂዋዌ ወለኀብለ ወለተበልዖ
  choice: pour qu’ils soient emmenés en captivité, pillés et dévorés
  rationale: Préserve la série de trois malheurs et la force du dernier terme, sans réduire « dévorés » à une simple paraphrase.
- source_word: አቤስሎሙ
  choice: je les déracinerai
  rationale: Le verbe porte ici une idée forte d’éradication ou d’arrachement; « déraciner » convient aussi à la mention du pays.
- source_word: እዘርዎሙ
  choice: je les disperserai
  rationale: Équivalent français direct du verbe exprimant la dispersion.
theological_decisions:
- issue: Sens de « cacher mon visage »
  choice: Maintien de l’expression imagée
  alternative: Je leur retirerai ma faveur / ma protection
  rationale: Le texte source ne précise pas si l’image vise surtout la faveur, la présence ou la protection; la formulation littérale préserve cette amplitude théologique.
- issue: Force de l’image « dévorés »
  choice: Conserver « dévorés »
  alternative: anéantis / détruits
  rationale: La métaphore vive du texte peut évoquer la destruction sans que la traduction tranche son degré ou son mode.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le rythme cumulatif du jugement divin tout en évitant une lourdeur excessive. Le fragment initial en minuscule reflète la continuité du verset avec le contexte précédent.
