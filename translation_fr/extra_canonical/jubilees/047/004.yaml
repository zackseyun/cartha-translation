  text: And in those days Tarmuth[4], the daughter of Pharaoh, came to bathe in the river, and she heard your voice as you were weeping, and she said to her maidservants,
translation:
  language: fr
  text: 'En ces jours-là, Tarmout[a], fille de Pharaon, se rendit au fleuve pour s’y baigner. Elle entendit ta voix tandis que tu pleurais et dit à ses servantes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’extrait guèze, la numérotation des lignes est décalée. Le récit se poursuit sans interruption, et cette phrase correspond au verset 4 selon la suite du chapitre.
    reason: segmentation_note
lexical_decisions:
- source_word: ታርሙት
  choice: Tarmout
  rationale: Translittération française naturelle du nom propre guèze, sans l’assimiler à un nom différent.
- source_word: ወጽአት
  choice: descendit
  rationale: Dans le contexte d’un déplacement vers le fleuve, « descendit » rend idiomatiquement le mouvement exprimé par le verbe.
- source_word: ትትሐፀብ
  choice: pour s’y baigner
  rationale: Rend la valeur réfléchie et finale de l’expression, avec reprise naturelle du fleuve par « y ».
- source_word: እንዘ፡ ትበኪ
  choice: tandis que tu pleurais
  rationale: Conserve l’adresse à Moïse à la deuxième personne et la simultanéité de l’action.
- source_word: ለዕብራዊያቲሃ
  choice: à ses servantes
  rationale: Le terme désigne ici les femmes de son entourage; « servantes » convient au cadre de la fille de Pharaon et à la suite narrative.
