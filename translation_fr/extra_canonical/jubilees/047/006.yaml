  yaml_path: translation/extra_canonical/jubilees/047/006.yaml
  text: '...to bring you, and he brought you to her. And she took you out of the basket and had compassion on you. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will rear him and nurse him?”'
translation:
  language: fr
  text: '… pour t’amener, et il t’amena auprès d’elle. Elle te retira de la corbeille et eut compassion de toi. Ta sœur lui dit : « Dois-je aller appeler pour toi une des femmes hébreues, qui l’élèvera et l’allaitera ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤፍቅ
  choice: corbeille
  rationale: Désigne ici le contenant d’où l’enfant est retiré ; « corbeille » est naturel en français et convient au contexte de Moïse.
- source_word: መሐረተከ
  choice: eut compassion de toi
  rationale: Rend directement l’idée de compassion ou de pitié exprimée par le verbe guèze.
- source_word: ታሐፅኖ
  choice: l’élèvera
  rationale: Le premier des deux verbes décrit la prise en charge et l’éducation de l’enfant ; cette traduction le distingue du verbe suivant, qui porte précisément sur l’allaitement.
- source_word: ታጠብዎ
  choice: l’allaitera
  rationale: Dans ce contexte, le verbe signifie faire téter ou allaiter, et non laver.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase initiale demeure fragmentaire, comme dans l’extrait source, et commence donc par des points de suspension. Les deux actions finales, élever et allaiter, sont conservées distinctement.
