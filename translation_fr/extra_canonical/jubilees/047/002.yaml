revisions:
- from: Ce fut un temps de détresse pour les enfants d’Israël. Pharaon, roi d’Égypte, donna à leur sujet l’ordre de jeter dans le fleuve tous leurs enfants, tout garçon qui naîtrait.
  to: Ce fut un temps de détresse pour les enfants d’Israël. Pharaon, roi d’Égypte, ordonna à leur sujet qu’on jette dans le fleuve tous leurs enfants, tout garçon qui naissait.
  rationale: 'Révision limitée à la syntaxe française et à la valeur du relatif : « qu’on jette » rend l’ordre de manière naturelle sans imposer d’exécutant, et « qui naissait » évite la nuance prospective du conditionnel. Le sens, la portée masculine de la victime et l’absence du nom « Nil » sont conservés.'
  reviewer_model: gpt-5.6-terra
