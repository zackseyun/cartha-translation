  text: That was a time of affliction upon the children of Israel, and Pharaoh, king of Egypt, commanded concerning them that they should throw all their children, every male that was born, into the river.
translation:
  language: fr
  text: Ce fut un temps de détresse pour les enfants d’Israël. Pharaon, roi d’Égypte, ordonna à leur sujet qu’on jette dans le fleuve tous leurs enfants, tout garçon qui naissait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ምንዳቤ
  choice: un temps de détresse
  rationale: Rend naturellement l’idée d’une période d’affliction ou d’oppression sans en atténuer la gravité.
- source_word: ውሉደ፡ እስራኤል
  choice: les enfants d’Israël
  rationale: Expression biblique claire et formellement proche de la désignation collective du texte source.
- source_word: ንጉሠ፡ ግብጽ፡ ፈርዖን
  choice: Pharaon, roi d’Égypte
  rationale: Conserve les deux titres et adopte un ordre naturel en français.
- source_word: ይግድፉ
  choice: jeter
  rationale: Reproduit l’action directe et violente prescrite par l’ordre royal.
- source_word: ውሉዶሙ፡ ኵሎ፡ ርሰ፡ ዘተወልደ
  choice: tous leurs enfants, tout garçon qui naîtrait
  rationale: Maintient la formulation générale « leurs enfants » puis la précision masculine du texte, sans réduire d’emblée le premier terme à « fils ».
- source_word: ፈለግ
  choice: le fleuve
  rationale: Dans le contexte égyptien, le terme désigne le Nil sans que le nom propre soit explicitement présent dans le texte source.
