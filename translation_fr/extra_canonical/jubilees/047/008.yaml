  language: fr
  text: 'Elle lui dit : « Va. » La jeune fille alla appeler ta mère, Yokébed, et te remit à ta mère.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትቤላ፡ ሑሪ
  choice: 'Elle lui dit : « Va. »'
  rationale: Rend directement le discours et l’impératif féminin du texte guèze.
- source_word: ወሖረት
  choice: La jeune fille alla
  rationale: Le verbe est au féminin. Le sujet explicite « la jeune fille » est repris du contexte immédiat afin d’éviter une succession ambiguë de pronoms féminins en français.
- source_word: ለእምከ፡ ለአዮካቤድ
  choice: ta mère, Yokébed
  rationale: Conserve l’adresse à Moïse et transcrit le nom sous sa forme française courante.
- source_word: ወወሀበታ
  choice: elle te confia à elle
  rationale: Le sens de base est « elle te donna à elle » ; « confia » exprime naturellement ici la remise de l’enfant aux soins de sa mère sans changer l’action.
