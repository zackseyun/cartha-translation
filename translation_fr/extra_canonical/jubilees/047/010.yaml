  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: fr
  text: Tu restas à la cour du roi pendant trois semaines d’années, jusqu’au jour où tu sortis de la cour du roi et vis un Égyptien frapper ton compatriote, l’un de tes frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐጸድ፡ መንግሥት
  choice: la cour du roi
  rationale: Rend naturellement l’expression guèze désignant l’enceinte ou la cour royale, tout en conservant la répétition du texte source.
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመተ
  choice: trois semaines d’années
  rationale: Conserve la manière jubilaire de compter par groupes de sept ans, soit vingt et un ans, sans remplacer l’expression par une simple conversion.
- source_word: ካልእከ፡ ዘእምነ
  choice: ton compatriote
  rationale: Dans ce contexte, l’expression désigne un autre membre du peuple de Moïse; « compatriote » est clair et naturel, tandis que la suite explicite le lien fraternel.
- source_word: ይዘብጦ
  choice: frapper
  rationale: Reproduit l’action en cours sans préciser davantage sa violence ni anticiper la suite du récit.
theological_decisions:
- issue: Relation entre « compatriote » et « l’un de tes frères »
  choice: Conserver les deux désignations
  alternative: Réduire à « l’un de tes frères »
  rationale: Le texte juxtapose l’appartenance au même peuple et la fraternité; maintenir les deux préserve son insistance sans y ajouter une interprétation confessionnelle.
translation_notes:
  register: Français moderne, international et digne. Tutoiement maintenu puisque le récit s’adresse directement à Moïse. Syntaxe légèrement solennelle, mais immédiatement compréhensible.
