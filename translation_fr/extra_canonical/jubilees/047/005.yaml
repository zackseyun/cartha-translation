  yaml_path: translation/extra_canonical/jubilees/047/005.yaml
  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
translation:
  language: fr
  text: En ces jours-là, Tarmout[a], fille du pharaon, sortit pour se baigner dans le fleuve. Elle entendit ta voix tandis que tu pleurais et dit à ses servantes de te faire sortir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nom donné à la fille du pharaon dans le livre des Jubilés ; il correspond à Thermouthis chez Josèphe (Antiquités judaïques 2.224).
    reason: Contexte historique et identification du nom propre.
lexical_decisions:
- source_word: ታርሙት
  choice: Tarmout
  rationale: Translittération française naturelle du nom geʿez de la fille du pharaon, avec « ou » pour rendre la voyelle /u/.
- source_word: ለአዕጋሪቲሃ
  choice: à ses servantes
  rationale: Désigne les femmes qui accompagnaient et servaient la fille du pharaon ; « servantes » est précis et naturel en français moderne.
- source_word: ያውፅኣከ
  choice: de te retirer de l’eau
  rationale: Le verbe signifie « faire sortir, retirer ». Le complément « de l’eau » est explicité naturellement d’après le lieu immédiatement mentionné, le fleuve, sans introduire de panier absent du verset.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement est conservé parce que la fille du pharaon s’adresse ici à Moïse dans le récit. « Le pharaon » suit l’usage français courant pour le titre. La syntaxe a été légèrement segmentée en deux phrases pour une lecture naturelle.
