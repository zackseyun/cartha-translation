  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
translation:
  language: fr
  text: Ils continuèrent à les jeter pendant sept mois, jusqu’au jour où tu naquis. Ta mère te cacha pendant trois mois, mais on la découvrit à cause de toi. Elle te fabriqua une corbeille, l’enduisit de poix et d’asphalte, puis la déposa parmi les roseaux, au bord du fleuve. Elle t’y plaça pendant sept jours. Ta mère venait la nuit pour t’allaiter et, pendant la journée, Miriam veillait sur toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze dit simplement que Miriam veillait sur l’enfant pendant la journée; il ne mentionne ici ni qu’elle était sa sœur ni qu’elle le protégeait des oiseaux.
    reason: textual_clarification
lexical_decisions:
- source_word: ሤፍተ (sēfta)
  choice: corbeille
  rationale: Désigne ici le petit contenant flottant préparé pour l’enfant; « corbeille » est naturel en français et convient au contexte sans lui donner la taille d’une embarcation.
- source_word: ፒሳ ወአስፋልጠ (pisa wa-asfalṭa)
  choice: poix et asphalte
  rationale: Rend distinctement les deux matériaux d’imperméabilisation mentionnés dans le texte.
- source_word: ታጠብወከ (taṭabbweka)
  choice: t’allaiter
  rationale: Le verbe exprime ici l’action de nourrir l’enfant au sein.
- source_word: ትዐቅበከ (teʿeqebeka)
  choice: veillait sur toi
  rationale: Restitue l’idée de garder et protéger sans préciser un danger que le texte guèze fourni ne nomme pas.
theological_decisions:
- issue: Identification de Miriam
  choice: Miriam
  alternative: Miriam, ta sœur
  rationale: Le texte source nomme Miriam mais ne comporte pas, dans ce verset, le terme « sœur »; l’identification familiale n’est donc pas ajoutée au corps du texte.
- issue: Objet ou danger associé à la garde diurne
  choice: Miriam veillait sur toi
  alternative: Miriam, ta sœur, te protégeait des oiseaux
  rationale: La mention des oiseaux n’apparaît pas dans le texte guèze fourni. La traduction conserve donc la formulation générale de la garde.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement est conservé parce que le locuteur s’adresse directement à Moïse. La syntaxe reste proche de l’enchaînement du guèze tout en évitant les lourdeurs littérales.
