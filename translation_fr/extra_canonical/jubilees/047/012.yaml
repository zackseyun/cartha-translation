  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
translation:
  language: fr
  text: 'Ton frère.[a] Il se mit en colère et s’indigna, puis dit : « Qui t’a établi chef et juge sur nous ? Veux-tu me tuer comme tu as tué l’Égyptien hier ? » Alors tu pris peur et tu t’enfuis à cause de cette affaire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset commence dans le texte guèze par les mots isolés « Ton frère », qui semblent poursuivre la phrase précédente.
    reason: textual_note
lexical_decisions:
- source_word: ተምዐዐ፡ ወተቈጥዐ
  choice: se mit en colère et s’indigna
  rationale: Les deux verbes coordonnés expriment la colère et l’indignation; leur maintien préserve l’intensification du texte sans réduire le second à l’idée d’une querelle mutuelle.
- source_word: መልአከ፡ ወመኰንነ
  choice: chef et juge
  rationale: Le premier terme désigne ici une personne investie d’autorité; « chef » est naturel en français et conserve sa distinction par rapport à « juge ».
- source_word: ወሚመ፡ ትቀትለኒ፡ ትፈቅድ
  choice: Veux-tu me tuer, moi aussi
  rationale: La formulation rend l’intention interrogée et la particule additive/intensive associée à « moi », en français idiomatique.
- source_word: እምቅድመ፡ ዝንቱ፡ ነገር
  choice: à cause de cette affaire
  rationale: Dans ce contexte, l’expression indique que la révélation de l’homicide provoque la peur et la fuite; « affaire » conserve la portée assez large de ነገር.
