- source_word: ወቀተልኮ፡ ወኀባእኮ፡ ውስተ፡ ኆፃ
  choice: Tu le tuas et le cachas dans le sable
  rationale: Rend directement les deux verbes à la deuxième personne du singulier et conserve le pronom objet masculin ainsi que le lieu explicite.
- source_word: ወበሳኒታ፡ ዕለት
  choice: Le deuxième jour
  rationale: Expression temporelle simple et naturelle, fidèle à l’ordinal du texte guèze.
- source_word: ፪እንዘ፡ ይትበአሱ፡ እምውሉደ፡ እስራኤል
