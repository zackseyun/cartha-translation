  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
translation:
  language: fr
  text: 'Tu le tuas et le cachas dans le sable. Le deuxième jour, tu trouvas deux des fils d’Israël qui se battaient, et tu dis à celui qui était en tort : « Pourquoi frappes-tu ? »'
