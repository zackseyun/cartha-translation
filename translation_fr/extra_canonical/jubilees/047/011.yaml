- source_word: ዘይትአገሎ
  choice: celui qui était en tort
  rationale: Exprime sans surinterprétation l’homme présenté comme fautif ou injuste dans l’affrontement.
- source_word: ለምንት፡ ትዘብጥ
  choice: Pourquoi frappes-tu ?
  rationale: Le texte fourni s’arrête au verbe « frapper » sans objet exprimé; la traduction n’ajoute donc pas « ton compagnon ».
