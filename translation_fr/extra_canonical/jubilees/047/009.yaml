  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
translation:
  language: fr
  text: Un salaire fut versé, et elle t’allaita.[a] Après cela, quand tu eus grandi, on te conduisit auprès de la fille du pharaon, et tu devins son fils. Ton père Amram t’enseigna l’écriture. Lorsque tu eus accompli trois semaines d’années,[b] il te fit entrer à la cour.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle prit soin de toi » ou « elle t’éleva ».'
    reason: Le verbe guèze peut désigner l’allaitement aussi bien que les soins et l’éducation donnés à un jeune enfant.
  - marker: b
    text: 'Littéralement : « trois semaines », c’est-à-dire trois périodes de sept ans, soit vingt et un ans.'
    reason: La précision « d’années » est implicite dans le système chronologique du livre des Jubilés.
  - marker: c
    text: 'Ou : « dans l’enceinte » ; dans ce contexte, il s’agit vraisemblablement de la cour royale.'
    reason: Le terme source peut désigner concrètement une enceinte ou une cour, et contextuellement la cour du pharaon.
lexical_decisions:
- source_word: ዐስበ
  choice: Un salaire fut versé
  rationale: Le terme renvoie à une rémunération ou à un salaire, conformément au contexte de l’allaitement de Moïse en Exode 2. La tournure passive française conserve l’absence de sujet explicite dans cette proposition très brève.
- source_word: ሐፀነተከ
  choice: elle t’allaita
  rationale: La forme a un sujet féminin et peut désigner le fait de nourrir, allaiter ou élever un enfant. « T’allaita » convient au contexte immédiat tout en signalant l’autre nuance en note.
- source_word: ልሂቀከ
  choice: quand tu eus grandi
  rationale: Rend la croissance ou l’arrivée à un âge plus avancé, sans introduire la sœur de Moïse, qui n’est pas nommée ici.
- source_word: ወሰዱከ
  choice: on te conduisit
  rationale: La forme plurielle indéfinie est rendue naturellement en français par « on » ; « conduisit auprès de » exprime le transfert vers la fille du pharaon.
- source_word: መጽሐፈ
  choice: l’écriture
  rationale: Le nom peut évoquer un écrit ou un livre ; avec le verbe « enseigner », « l’écriture » donne en français le sens contextuel le plus naturel.
- source_word: ሠለስተ፡ ሱባዔ
  choice: trois semaines d’années
  rationale: Littéralement « trois semaines », mais la chronologie jubilaire emploie ici des semaines d’années, soit vingt et un ans.
- source_word: ዐጸደ
  choice: la cour
  rationale: Le mot désigne une enceinte ou une cour ; dans ce contexte lié à la maison du pharaon, « la cour » préserve aussi la possible connotation royale.
theological_decisions: []
