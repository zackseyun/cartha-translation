  yaml_path: translation/extra_canonical/jubilees/047/007.yaml
  text: And she said to her, “Go.” And she went and called your mother Jochebed, and she gave her wages, and she nursed you.
translation:
  language: fr
  text: 'Elle lui dit : « Va. » La jeune fille alla appeler ta mère Yokébed. La fille du pharaon lui donna un salaire, et elle t’allaita.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑሪ
  choice: Va
  rationale: Impératif féminin singulier, rendu directement et naturellement en français.
- source_word: ለእምከ፡ ለአዮካቤድ
  choice: ta mère, Yokébed
  rationale: Conserve l’adresse à Moïse et l’apposition du nom maternel; la virgule clarifie naturellement l’apposition en français.
- source_word: ዐስበ
  choice: un salaire
  rationale: Le terme désigne une rémunération ou des gages; « un salaire » est clair et idiomatique.
- source_word: ወሐፀነተከ
  choice: et elle t’allaita
  rationale: Dans ce contexte, le verbe décrit les soins d’une nourrice, en particulier l’allaitement.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le sujet implicite de « donna » est explicité comme « la fille du pharaon » afin d’éviter une ambiguïté artificielle en français, tandis que « elle t’allaita » renvoie naturellement à Yokébed.
