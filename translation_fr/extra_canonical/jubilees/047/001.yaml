  text: And in the seventh week, in the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.
translation:
  language: fr
  text: Dans la septième semaine, en sa septième année, du quarante-septième jubilé, ton père vint du pays de Canaan, et tu naquis dans la quatrième semaine, en sa sixième année, du quarante-huitième jubilé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: semaine
  rationale: Dans le système chronologique des Jubilés, le terme désigne ici une période de sept ans; « semaine » conserve la terminologie structurante du livre.
- source_word: ኢዮቤልዉ
  choice: jubilé
  rationale: Terme chronologique désignant un cycle jubilaire; rendu français établi et transparent.
- source_word: ድረ፡ ከናአን
  choice: pays de Canaan
  rationale: Rend naturellement la provenance géographique exprimée par le texte guèze.
- source_word: መጽአ፡ አቡከ
  choice: ton père vint
  rationale: Préserve l'adresse directe à Moïse ainsi que l'ordre narratif du texte.
- source_word: ተወለድከ
  choice: tu naquis
  rationale: Rendu direct du verbe à la deuxième personne, dans un registre narratif digne et courant.
theological_decisions:
- issue: Hiérarchie des unités chronologiques
  choice: « durant la septième semaine, la septième année »
  alternative: « durant la septième semaine de la septième année »
  rationale: 'Les deux indications sont coordonnées: l''année se situe dans la semaine d''années, elle n''en constitue pas le cadre supérieur. La formulation choisie évite d''inverser la hiérarchie jubilé > semaine > année et demeure parallèle à la seconde date.'
translation_notes:
  register: Français international moderne, narratif et digne. La répétition des unités temporelles est maintenue afin de préserver la précision de la formule chronologique du texte source.
