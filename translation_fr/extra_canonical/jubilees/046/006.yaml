  text: ses ossements, le jour où ils sortiraient du pays d’Égypte. Il leur fit prêter serment au sujet de ses ossements, car il savait que les Égyptiens ne le feraient plus sortir pour l’ensevelir au pays de Canaan. En effet, Makmaron, roi de Canaan, alors qu’il résidait au pays d’Assur, combattit dans la vallée contre le roi de…[a]
