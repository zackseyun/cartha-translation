lexical_decisions:
- source_word: አዕፅምቲሁ
  choice: ses ossements
  rationale: Rend littéralement le pluriel possessif et conserve le vocabulaire funéraire solennel.
- source_word: በመዋዕለ፡ እመ፡ ይወፅኡ
  choice: le jour où ils sortiraient
  rationale: La proposition vise le moment futur de la sortie d’Égypte du point de vue de Joseph; le conditionnel français exprime naturellement ce futur dans le passé.
- source_word: አምሐሎሙ
  choice: Il leur fit prêter serment
  rationale: 'Rend la valeur causative du verbe: Joseph impose un serment aux personnes concernées.'
- source_word: አይድኅሙ
  choice: ne… plus
  rationale: Le verbe porte l’idée de répétition ou de retour; «ne… plus» convient au contexte où un nouveau transfert du corps est exclu.
- source_word: አውፅኦተ፡ ወቀቢሮተ
  choice: l’emporteraient… pour l’ensevelir
  rationale: Conserve les deux actes, faire sortir/emporter puis enterrer, dans un français fluide.
- source_word: ምድረ፡ አሱር
  choice: au pays d’Assur
  rationale: «Assur» conserve la forme historique et l’ambiguïté possible entre territoire et désignation assyrienne, plutôt que de moderniser automatiquement en «Assyrie».
- source_word: በቈላ
  choice: dans la vallée
  rationale: Sens topographique usuel du terme dans ce contexte.
theological_decisions:
- issue: Référent des Égyptiens et transport des ossements
  choice: «les Égyptiens ne l’emporteraient plus pour l’ensevelir»
  alternative: «les Égyptiens ne feraient pas de nouveau sortir ses ossements pour les ensevelir»
  rationale: La formulation retenue suit les pronoms personnels du texte et n’explicite pas davantage que la source la relation entre Joseph et ses ossements.
- issue: Fin matériellement incomplète du verset fourni
  choice: Signaler l’interruption par des points de suspension et une note
  alternative: Compléter la phrase à partir du verset suivant ou d’une autre édition
  rationale: La source transmise s’arrête après «le roi de»; compléter introduirait du contenu absent des données fournies.
translation_notes:
  register: Français international moderne, digne et narratif. Le fragment initial est conservé comme continuation de la phrase précédente. «Pays d’Assur» maintient la coloration historique; le nom propre Makmaron est translittéré conformément à l’édition.
