  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
translation:
  language: fr
  text: 'Il les opprima et dit aux Égyptiens : « Voyez, le peuple des enfants d’Israël est plus nombreux et plus puissant que nous. Allons ! Agissons avec habileté à son égard avant qu’il ne se multiplie, et opprimons-le par des travaux forcés, de peur qu’une guerre ne survienne contre nous et qu’ils ne nous combattent eux aussi[a], ne se joignent à nos ennemis et ne sortent de notre pays, car leur cœur et leur visage sont tournés vers le pays de Canaan. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze de cette séquence est difficile et l’édition le signale par un astérisque. L’articulation précise entre la guerre, le combat contre les Égyptiens et le ralliement aux ennemis demeure incertaine.
    reason: Préserve l’ambiguïté syntaxique et textuelle de la source sans omettre la mention explicite du combat.
lexical_decisions:
- source_word: ያሕምሞሙ / ናሕምሞሙ
  choice: Il les opprima / opprimons-le
  rationale: Le même verbe est rendu de façon cohérente par « opprimer », qui exprime ici une action coercitive plutôt qu’une simple souffrance infligée.
- source_word: ለሰብአ፡ ግብጽ
  choice: aux Égyptiens
  rationale: Formulation française naturelle pour « aux gens d’Égypte », sans modifier le référent collectif.
- source_word: ልህቁ፡ ወበዝኁ
  choice: plus nombreux et plus puissant
  rationale: Rend les deux comparatifs appliqués au peuple collectif; le singulier « puissant » s’accorde avec « peuple ».
- source_word: ንጥበብ፡ ላዕሌሆሙ
  choice: Agissons avec habileté à son égard
  rationale: Conserve l’idée de conduite avisée ou rusée sans introduire une nuance confessionnelle.
- source_word: ዘእንበለ፡ ይብዝኁ
  choice: avant qu’il ne se multiplie
  rationale: ዘእንበለ exprime ici l’antériorité (« avant que »), et non simplement la crainte (« de peur que »).
- source_word: በቅኔ
  choice: par des travaux forcés
  rationale: Dans ce contexte d’asservissement, cette expression française communique mieux le service imposé que le terme abstrait « servitude ».
- source_word: ይወፅኡ፡ እምድርነ
  choice: sortiront de notre pays
  rationale: Le verbe ወፅአ signifie « sortir »; la traduction évite l’harmonisation avec « monter » en Exode 1.10.
- source_word: ልቦሙ፡ ወገጾሙ
  choice: leur cœur et leur visage
  rationale: Conserve l’image double et concrète du texte guèze plutôt que de la réduire à leur seule intention.
theological_decisions:
- issue: Relation entre la venue de la guerre, le combat des Israélites et leur ralliement aux ennemis
  choice: Conserver les éléments successifs du texte, avec « qu’eux aussi ne nous combattent » puis « Sinon »
  alternative: Omettre la proposition difficile sur le combat, comme dans la couche anglaise consultative
  rationale: Le texte guèze transmis contient explicitement la proposition ወእሙንቱኒ፡ ዘእንበለ፡ ይጽብኡነ, malgré une articulation syntaxique difficile; la conserver évite d’effacer une donnée de la source.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde son urgence rhétorique. « Enfants d’Israël » est retenu comme désignation collective naturelle, et les images propres au texte (« leur cœur et leur visage ») sont préservées.
