    rationale: Le texte de base contient explicitement le verbe « combattre contre nous ». La note peut signaler l’incertitude de la construction, mais le texte courant ne doit ni présenter « Sinon » comme certain ni déplacer cette proposition dans une chaîne causale non établie.
