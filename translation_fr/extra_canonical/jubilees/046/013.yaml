  naturalness: Le français est généralement moderne, clair et d’un registre approprié. La série de subjonctifs après « de peur que » est naturelle et permet de représenter prudemment la construction difficile, sans le « Sinon » abrupt et interprétatif.
  terminology: « Enfants d’Israël », « opprima », « travaux forcés », « ennemis » et « pays de Canaan » sont appropriés. « Leur cœur et leur visage » préserve utilement l’imagerie concrète du guèze.
