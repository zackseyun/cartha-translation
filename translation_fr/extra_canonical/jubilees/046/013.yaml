revisions:
- from: 'Il les opprima et dit aux Égyptiens : « Voyez, le peuple des enfants d’Israël est plus nombreux et plus puissant que nous. Allons ! Agissons avec habileté à son égard avant qu’il ne se multiplie, et opprimons-le par des travaux forcés, avant que la guerre ne nous atteigne et qu’eux aussi ne nous combattent[a]. Sinon, ils se joindront à nos ennemis et sortiront de notre pays, car leur cœur et leur visage sont tournés vers le pays de Canaan. »'
  to: 'Il les opprima et dit aux Égyptiens : « Voyez, le peuple des enfants d’Israël est plus nombreux et plus puissant que nous. Allons ! Agissons avec habileté à son égard avant qu’il ne se multiplie, et opprimons-le par des travaux forcés, de peur qu’une guerre ne survienne contre nous et qu’ils ne nous combattent eux aussi[a], ne se joignent à nos ennemis et ne sortent de notre pays, car leur cœur et leur visage sont tournés vers le pays de Canaan. »'
  rationale: La révision remplace « Sinon » par une coordination prudente sous « de peur que », conserve la mention du combat présente dans le guèze et maintient ensemble les conséquences redoutées. Elle ne tranche pas, dans le texte courant, l’articulation disputée de la séquence signalée par l’édition.
