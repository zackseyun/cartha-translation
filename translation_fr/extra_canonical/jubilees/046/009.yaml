  text: in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field, in the double cave in the mountain,
translation:
  language: fr
  text: dans le pays d’Égypte. Tous ses frères moururent après lui. Le roi d’Égypte partit combattre le roi de Canaan, au quarante-septième jubilé, pendant la deuxième semaine, la deuxième année. Les fils d’Israël emportèrent tous les ossements des fils de Jacob, sauf ceux de Joseph, et les ensevelirent dans la campagne[a], dans la grotte double, dans la montagne,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le désert » ou « dans un lieu inhabité ».
    reason: Le guèze ገዳም peut désigner la campagne, le désert ou un lieu inhabité; le contexte ne tranche pas entièrement.
lexical_decisions:
- source_word: ወወፅአ፡ ንጉሠ፡ ግብጽ፡ ከመ፡ ይትቃተል
  choice: Le roi d’Égypte partit combattre
  rationale: Rend naturellement le mouvement exprimé par « sortit » et le but marqué par « afin de combattre », sans alourdir la phrase française.
- source_word: ሱባዔ
  choice: semaine
  rationale: Conserve le terme chronologique propre au système des Jubilés; l’année est ensuite précisée séparément dans le texte.
- source_word: አዕፅምቲሆሙ፡ ለውሉደ፡ ያዕቆብ
  choice: les ossements des fils de Jacob
  rationale: Le pronom possessif pluriel est repris par le complément explicatif « des fils de Jacob »; « ossements » convient au registre funéraire.
- source_word: ገዳም
  choice: campagne
  rationale: Le mot peut désigner un espace non habité, la campagne ou le désert. « Campagne » reste naturel ici sans imposer le rapport de possession « champ de la grotte », que la répétition de ውስተ ne soutient pas.
- source_word: በዐት፡ ዘካዕበት
  choice: grotte double
  rationale: Traduction formelle de « grotte/caverne qui est double », sans substituer un nom propre absent de la formulation transmise.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition de « dans » reflète les deux occurrences de ውስተ et évite de transformer la campagne en complément possessif de la grotte. La virgule finale conserve le caractère syntaxiquement inachevé de l’extrait source fourni.
