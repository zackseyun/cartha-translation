  text: Egypt and killed him there; and he pursued after them to Egypt, as far as the entrance of Eromon. But he could not enter, because another new king had arisen over Egypt, stronger than he, and he returned to the land of Canaan, and the gate of Egypt was shut, and there was none who went out and none who came in to Egypt.
translation:
  language: fr
  text: 'en Égypte et le tua là. Puis il les poursuivit jusqu’en Égypte, jusqu’à l’entrée d’Éromôn. Mais il ne put y entrer, car un autre roi, un nouveau roi, avait pris le pouvoir sur l’Égypte et était plus puissant que lui. Il retourna au pays de Canaan, et la porte de l’Égypte fut fermée : personne ne sortait ni n’entrait en Égypte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዴገነ፡ ድኅሬሆሙ፡ ለግብጽ
  choice: Puis il les poursuivit jusqu’en Égypte
  rationale: Le pronom pluriel de ድኅሬሆሙ est conservé par « les », tandis que ለግብጽ indique ici la destination de la poursuite.
- source_word: አንቀጸ፡ ኤሮሞን
  choice: l’entrée d’Éromôn
  rationale: « Entrée » rend naturellement አንቀጽ dans ce contexte géographique; le nom propre est translittéré sans identification conjecturale.
- source_word: ነግሠ፡ ካልእ፡ ሐዲስ፡ ንጉሥ፡ ለግብጽ
  choice: un autre roi, un nouveau roi, avait pris le pouvoir sur l’Égypte
  rationale: La formulation maintient à la fois « autre » et « nouveau », présents dans la source, et exprime idiomatiquement l’accession au pouvoir.
- source_word: ወገብአ፡ ምድረ፡ ከናአን
  choice: Il retourna au pays de Canaan
  rationale: ገብአ signifie ici « retourner », et non « prendre possession ».
- source_word: ወተዐጽወ፡ አንቀጸ፡ ግብጽ
  choice: la porte de l’Égypte fut fermée
  rationale: La forme verbale est passive; la traduction évite donc d’attribuer explicitement la fermeture au personnage précédent.
- source_word: ወአልቦ፡ ዘይወፅእ፡ ወአልቦ፡ ዘይበውእ
  choice: personne ne sortait ni n’entrait
  rationale: Cette tournure française actuelle conserve le parallélisme et le sens absolu des deux propositions négatives.
