  rationale: Expression temporelle naturelle en français, sans préciser davantage le sujet implicite.
- source_word: ከመ፡ ይስዱ
  choice: d’emporter
  rationale: Le verbe indique l’action de porter ou d’emporter; « emporter » convient au mouvement sous-entendu, sans ajouter l’objet absent de cet extrait.
