  yaml_path: translation/extra_canonical/jubilees/046/003.yaml
  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
translation:
  language: fr
  text: les fils d’Israël pendant toute la vie de Joseph. Joseph mourut à l’âge de cent dix ans. Il avait vécu dix-sept ans au pays de Canaan, dix ans au service, trois ans en prison et quatre-vingts ans sous l’autorité du pharaon, roi d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቱ፡ ለዮሴፍ
  choice: pendant toute la vie de Joseph
  rationale: Rend naturellement l’expression temporelle littérale « tous les jours de la vie de Joseph » sans en modifier la portée.
- source_word: ወልደ፡ ምእት፡ ወዓሠርቱ፡ ዓመት
  choice: à l’âge de cent dix ans
  rationale: L’expression guèze indique l’âge de Joseph à sa mort; cette formulation est claire et idiomatique en français.
- source_word: እንዘ፡ ይትቀነይ
  choice: au service d’autrui
  rationale: Le verbe évoque le fait de servir ou d’être assujetti. Cette formulation conserve l’idée sans préciser dans le texte une personne que l’extrait ne nomme pas.
- source_word: ውስተ፡ ቤተ፡ ሞቅሕ
  choice: en prison
  rationale: Équivalent français courant de l’expression littérale « dans la maison de détention ».
- source_word: ታሕተ፡ ሤመቱ፡ ለፈርዖን
  choice: sous l’autorité du pharaon
  rationale: Rend la relation hiérarchique du texte complet attesté, plutôt que de réduire la proposition à un simple séjour en Égypte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le début demeure un fragment syntaxique, comme dans la délimitation fournie du verset, afin de ne pas inventer le contenu de la proposition précédente. La dernière proposition suit le texte guèze complet signalé par la révision critique, dont l’extrait reproduit dans les données est tronqué après « quatre-vingts ans ».
