lexical_decisions:
- source_word: አብራም
  choice: Amram
  rationale: Le texte guèze transmis porte littéralement « Abram », mais le père de l’interlocuteur dans ce contexte est Amram. L’émendation contextuelle est retenue dans le corps du texte, tandis que la leçon manuscrite est conservée en note.
- source_word: ወተረፈ
  choice: resta
  rationale: Rend directement l’idée de demeurer ou rester avec un groupe.
- source_word: ወሞአ
  choice: vainquit
  rationale: Le verbe guèze ሞአ signifie vaincre, triompher ou l’emporter sur ; « vainquit » convient naturellement à l’affrontement entre deux rois.
theological_decisions:
- issue: Identification du père de l’interlocuteur
  choice: Amram dans le texte avec une note signalant « Abram »
  alternative: Abram dans le corps du texte
  rationale: Cette présentation évite une confusion généalogique manifeste sans dissimuler la forme effectivement attestée dans la source guèze.
translation_notes:
  register: Français moderne, sobre et narratif. « Puis » assure une transition naturelle sans modifier la relation fondamentale entre les deux propositions ; les titres royaux sont rendus simplement.
