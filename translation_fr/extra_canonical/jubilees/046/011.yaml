  text: Hebron; and your father Amram remained with them. And the king of Canaan defeated the king of Egypt.
translation:
  language: fr
  text: Hébron ; et Amram[a], ton père, resta avec eux. Puis le roi de Canaan vainquit le roi d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
