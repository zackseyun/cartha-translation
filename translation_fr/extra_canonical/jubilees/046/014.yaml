  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
translation:
  language: fr
  text: 'Il établit sur eux des chefs de corvée pour les opprimer par des corvées. Ils bâtirent pour Pharaon des villes fortifiées : Pitom et Ramsès. Ils bâtirent aussi toutes les murailles et toutes les levées de terre qui étaient tombées.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui s’étaient écroulées ».'
    reason: Le verbe final signifie littéralement « tomber » ; appliqué à des constructions, il peut aussi se comprendre comme un effondrement.
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  choice: chefs de corvée
  rationale: L’expression désigne des responsables imposant le travail dû; « chefs de corvée » est naturel en français et correspond au contexte d’oppression.
- source_word: ያሕምምዎሙ፡ በቅኔ
  choice: les accabler par des travaux forcés
  rationale: Le verbe exprime l’affliction ou la souffrance, tandis que le complément indique une condition de service contraint; cette formulation restitue les deux éléments sans lourdeur.
- source_word: አህጉረ፡ ጽኑዓተ
  choice: villes fortifiées
  rationale: Littéralement, il s’agit de villes fortes ou solidement défendues; « villes fortifiées » est l’équivalent français courant.
- source_word: ጥቆመ፡ … ዐረፋተ
  choice: murailles … ouvrages de défense
  rationale: Les deux termes désignent des éléments distincts des fortifications. « Ouvrages de défense » conserve une portée assez large là où l’identification architecturale précise du second terme reste incertaine.
- source_word: ወደቀ
  choice: s’étaient écroulés
  rationale: Le verbe signifie tomber; appliqué à des constructions, « s’écrouler » est idiomatique et exprime clairement leur état de ruine.
