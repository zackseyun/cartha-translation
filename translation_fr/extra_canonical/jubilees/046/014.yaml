  terminology: Les noms Pitom et Ramsès suivent l’usage français. « Levées de terre » est plus précis et moins interprétatif que « ouvrages de défense » pour l’équivalent de « embankments », tout en restant intelligible. Aucun choix confessionnel n’est impliqué.
