  rationale: La révision évite d’expliciter dans le texte principal une reconstruction seulement inférée du contexte, aligne la dernière paire de termes sur le sens attesté par l’audit anglais, et conserve une note brève à l’ancre existante pour l’alternative idiomatique concernant l’état des constructions.
