base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
translation:
  language: fr
  text: 'Après la mort de Jacob, les fils d’Israël se multiplièrent dans le pays d’Égypte et devinrent un peuple nombreux. Ils étaient tous unis de cœur : chacun aimait son frère et venait en aide à son frère. Ils se multiplièrent abondamment et se multiplièrent à l’extrême, pendant dix semaines d’années en tout[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire soixante-dix ans.
    reason: Explique au lecteur moderne la durée exprimée par l’idiome « dix semaines d’années » sans remplacer la formulation du texte.
lexical_decisions:
- source_word: ውሉደ፡ እስራኤል
  choice: les fils d’Israël
  rationale: Rend directement l’expression guèze et conserve la désignation traditionnelle du peuple.
- source_word: ዕሩያነ፡ በአልቦሙ
  choice: unis de cœur
  rationale: Exprime naturellement en français l’accord intérieur indiqué par le texte, plutôt qu’une simple proximité extérieure.
- source_word: ይትራዳእ፡ ብእሲ፡ ምስለ፡ እኁሁ
  choice: chacun venait en aide à son frère
  rationale: Évite le calque peu naturel « un homme aidait son frère » tout en conservant la réciprocité fraternelle.
- source_word: ወበዝኁ፡ ፈድፋደ፡ ወበዝኁ፡ ጥቀ
  choice: Ils se multiplièrent en très grand nombre
  rationale: Le verbe « se multiplier » est répété avec deux intensificateurs. La formulation française en rassemble l’effet sans introduire l’idée étrangère de devenir forts.
- source_word: ዐሠርተ፡ ሱባዔ፡ ዓመታት፡ ኵሎ
  choice: dix semaines d’années en tout
  rationale: Conserve l’unité chronologique propre au texte et rend explicitement ኵሎ par « en tout ».
theological_decisions:
- issue: Mention de Joseph dans la durée finale
  choice: Ne pas ajouter « durant tous les jours de Joseph »
  alternative: « durant tous les jours de Joseph, pendant dix semaines d’années »
  rationale: Cette mention figure dans la couche anglaise de consultation, mais elle n’apparaît pas dans le texte guèze fourni. La traduction suit donc prioritairement le témoin source sans compléter silencieusement le verset.
- issue: Nature de l’unité des Israélites
  choice: « unis de cœur »
  alternative: « tous égaux dans leur cœur »
  rationale: Le contexte décrit leur amour et leur entraide mutuels. « Unis de cœur » transmet cette harmonie intérieure sans en faire une affirmation doctrinale ou sociale plus large.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure inaugurale a été allégée en « Après la mort de Jacob » plutôt que calquée par « Et il arriva que ». Le parallélisme de l’amour et de l’entraide fraternels est conservé, tandis que la répétition intensive finale est rendue dans une phrase française naturelle.
