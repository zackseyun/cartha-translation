- source_word: ያሐስሙ፡ ላዕሌሆሙ
  choice: ils les opprimaient
  rationale: L’expression décrit une conduite dure exercée contre eux. « Opprimer » restitue naturellement cette idée dans le contexte de travaux forcés.
- source_word: ወመጠነ … ከማሁ
  choice: et plus… plus…
  rationale: La construction corrélative indique une progression proportionnelle. Le second membre restant inachevé dans l’extrait, les points de suspension en préservent la suspension.
