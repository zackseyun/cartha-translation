lexical_decisions:
- source_word: ወሞተ፡ ዮሴፍ፡
  choice: Joseph mourut
  rationale: Rend directement la proposition narrative au passé simple, registre naturel et digne pour un récit ancien.
- source_word: በዘአርብዓ፡ ወስድስቱ፡ ኢዮቤልው፡
  choice: au cours du quarante-sixième jubilé
  rationale: Préserve le repère chronologique du texte tout en évitant de suggérer que Joseph mourut durant toute la période.
- source_word: በሱባዔ፡ ሳድስ፡
  choice: pendant la sixième semaine
  rationale: Conserve littéralement le système calendaire des Jubilés sans ajouter « d’années », absent du texte fourni.
- source_word: በካልእ፡ ዓመት፡
  choice: la deuxième année
  rationale: Rend le rang ordinal de l’année à l’intérieur de la semaine mentionnée.
- source_word: ወቀበርዎ፡
  choice: et on l’enterra
  rationale: Le sujet est indéterminé et pluriel dans la source; le pronom français « on » le restitue naturellement sans identifier les agents.
