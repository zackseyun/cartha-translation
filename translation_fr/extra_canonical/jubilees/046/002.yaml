  yaml_path: translation/extra_canonical/jubilees/046/002.yaml
  text: And there was no adversary and nothing evil through all the days of Joseph's life that he lived after his father Jacob, because all Egypt honored him.
translation:
  language: fr
  text: Il n’y eut ni adversaire[a] ni aucun mal pendant tous les jours de la vie que Joseph vécut après celle de son père Jacob[b], car toute l’Égypte l’honorait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Satan ».'
    reason: Le mot guèze peut être compris comme un nom commun, « adversaire », ou comme le nom « Satan ».
  - marker: b
    text: 'Ou : « pendant toute la vie de Joseph après celle de son père Jacob ».'
    reason: Le groupe temporel peut être rattaché à « vécut » ou, plus directement, à « la vie ».
lexical_decisions:
- source_word: ሰይጣን
  choice: adversaire
  rationale: Le terme peut désigner un adversaire ou Satan. Dans ce contexte général de paix et d’absence de mal, « adversaire » conserve le sens fonctionnel sans imposer l’identification à un être personnel.
- source_word: ያከብ
  choice: l’honorait
  rationale: Le verbe exprime l’idée d’accorder du poids, de la considération ou de l’honneur. L’imparfait convient à la situation durable décrite pendant la vie de Joseph.
theological_decisions:
- issue: Identification de ሰይጣን
  choice: Traduire par « adversaire » et signaler « Satan » en note.
  alternative: Traduire directement par « Satan ».
  rationale: La forme permet les deux lectures. Le texte ne contraint pas suffisamment à comprendre ici le nom propre; la note préserve donc l’ambiguïté théologique et lexicale.
- issue: Sens de « après son père Jacob »
  choice: Conserver la formulation elliptique du texte source.
  alternative: Expliciter « après la mort de son père Jacob ».
  rationale: L’explicitation est vraisemblable, mais elle ajoute « la mort de », absent du guèze. La traduction maintient la tension syntaxique et la note indique une autre manière de rattacher le groupe.
translation_notes:
  register: Français moderne, digne et accessible. La répétition source autour des « jours de la vie » est rendue de façon lisible sans supprimer la proposition relative « que Joseph vécut ». L’expression inhabituelle « après son père Jacob » est conservée afin de ne pas introduire explicitement la mort de Jacob.
