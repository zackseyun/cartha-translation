  yaml_path: translation/extra_canonical/jubilees/019/024.yaml
  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
translation:
  language: fr
  text: Que Dieu soit mon Dieu, celui de ma descendance, de Jacob et de sa descendance, pour toujours.[a] Et qu’en sa descendance soient bénis mon nom et le nom de mes pères — Sem, Noé, Hénoch, Mahalalel, Énosh et Seth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que Dieu soit à moi et à ma descendance, à Jacob et à sa descendance, pour toujours. »'
    reason: La tournure possessive/relationnelle du guèze est difficile à reproduire directement en français ; la note conserve sa forme plus littérale.
lexical_decisions:
- source_word: እግዚአብሔር፡ ኪያየ
  choice: Que Dieu soit mon Dieu
  rationale: Le verbe ይኩን est jussif (« qu’il soit »), et ኪያየ exprime ici la relation personnelle (« à moi / mien »). « Mon Dieu » rend naturellement cette relation en français sans omettre እግዚአብሔር.
- source_word: ወዘርእየ፡ ለያዕቆብ፡ ወለዘርኡ
  choice: et celui de ma descendance, celui de Jacob et de sa descendance
  rationale: La construction enchaîne les personnes auxquelles Dieu doit appartenir; « celui de » restitue en français l’ellipse du verbe et évite de faire à tort de la descendance le sujet.
- source_word: ኵሎ፡ መዋዕለ
  choice: pour toujours
  rationale: Expression temporelle signifiant littéralement « tous les jours », employée au sens de permanence.
- source_word: ዘርእ
  choice: descendance
  rationale: Conserve le sens collectif de « semence/postérité » dans un français moderne et digne.
- source_word: ይትባረክ
  choice: soient bénis
  rationale: Forme passive/jussive accordée en français avec les deux sujets coordonnés « mon nom » et « le nom de mes pères ».
theological_decisions:
- issue: Relation exprimée entre Dieu, le locuteur, Jacob et leurs descendances
  choice: Dieu est présenté comme « mon Dieu et celui de… »
  alternative: « ma descendance appartienne à Jacob et à sa descendance »
  rationale: Le texte commence explicitement par « Dieu », sujet de ይኩን (« qu’il soit »). La traduction retenue préserve cette syntaxe et n’introduit pas une relation de propriété dont la descendance serait le sujet.
- issue: Référent de « sa descendance » dans la seconde phrase
  choice: Conserver « sa descendance »
  alternative: Expliciter « la descendance de Jacob »
  rationale: Le pronom du texte peut être compris d’après le dernier antécédent masculin, mais l’explicitation résoudrait une ambiguïté que le texte source laisse formellement ouverte.
translation_notes:
  register: Français international moderne, clair et solennel. Les noms propres suivent les formes françaises bibliques usuelles. Le parallélisme de la bénédiction est conservé, ainsi que l’ambiguïté possible du pronom « sa ».
