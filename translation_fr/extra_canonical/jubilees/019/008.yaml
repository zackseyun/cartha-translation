lexical_decisions:
- source_word: መዋዕለ፡ ሕይወታ
  choice: la durée de la vie
  rationale: L’expression signifie littéralement « les jours de sa vie »; en français actuel, « la durée de la vie » restitue naturellement le total d’années évoqué par le contexte.
- source_word: ዝመከራ፡ ዓሥር
  choice: la dixième épreuve
  rationale: Le substantif dérivé de la racine « éprouver » désigne ici une mise à l’épreuve; le numéral ordinal est rendu explicitement.
- source_word: በዘተመከረ፡
  choice: par laquelle Abraham fut éprouvé
  rationale: La forme passive conserve la répétition rhétorique entre « épreuve » et « fut éprouvé ». Le nom Abraham, présent dans la couche anglaise et requis par le contexte de la phrase, explicite le sujet sous-entendu dans l’extrait guèze fourni.
theological_decisions:
- issue: Nature de l’événement désigné par la racine « éprouver »
  choice: épreuve
  alternative: tentation
  rationale: « Épreuve » préserve l’idée d’une mise à l’épreuve sans suggérer nécessairement une incitation morale au mal.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le caractère fragmentaire du début et la virgule finale, puisque le verset fourni se rattache manifestement aux unités voisines.
