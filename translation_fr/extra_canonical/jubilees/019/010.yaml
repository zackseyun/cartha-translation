  text: And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, the son of Nahor, Abraham’s brother, the sister of Laban, and the daughter of Bethuel; and Bethuel was the son of Milcah, the wife of Nahor, Abraham’s brother.
translation:
  language: fr
  text: La quatrième année de cette période, Abraham prit une femme pour son fils Isaac. Elle s’appelait Rébecca. Elle était fille de Betouël, fils de Nahor, frère d’Abraham, sœur de Laban et fille de Betouël. Betouël était fils de Milka, femme de Nahor, frère d’Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓመት፡ ራብዕ፡ ሎቱ
  choice: La quatrième année de cette période
  rationale: Le pronom renvoie à une période précédemment mentionnée; «de cette période» rend le lien sans prétendre préciser davantage l’antécédent.
- source_word: ነሥአ፡ ለይስሐቅ፡ ወልዱ፡ ብእሲተ
  choice: Abraham prit une femme pour son fils Isaac
  rationale: La tournure française explicite naturellement le sujet fourni par le contexte tout en conservant l’idée qu’Abraham choisit ou obtint une épouse pour Isaac.
- source_word: ርብቃ
  choice: Rébecca
  rationale: Forme française biblique courante du nom.
- source_word: ባቱኤል
  choice: Betouël
  rationale: Transcription française biblique usuelle, adaptée à la forme présente dans le texte guèze.
- source_word: ሜልካ
  choice: Milka
  rationale: Forme française biblique courante.
theological_decisions:
- issue: Généalogie répétitive et apparemment difficile
  choice: Conserver «fille de Betouël» à deux reprises et rendre littéralement Betouël comme fils de Nahor puis fils de Milka.
  alternative: Harmoniser ou condenser en présentant Rébecca comme petite-fille de Milka.
  rationale: Le texte source répète la filiation et formule une généalogie difficile; la traduction ne la corrige pas silencieusement et préserve la tension textuelle.
translation_notes:
  register: Français moderne, clair et digne. La longue généalogie a été divisée en phrases courtes sans supprimer ses répétitions ni harmoniser ses difficultés.
