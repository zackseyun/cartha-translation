  text: And in the sixth week, in its second year, Rebekah bore to Isaac two sons, Jacob and Esau. And Jacob was smooth and upright, but Esau was a fierce man, and a man of the field,
translation:
  language: fr
  text: Durant la sixième semaine, en sa deuxième année, Rébecca donna à Isaac deux fils, Jacob et Ésaü. Jacob était lisse et droit, tandis qu’Ésaü était un homme farouche, un homme des champs.
