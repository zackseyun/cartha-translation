lexical_decisions:
- source_word: በሱባዔ፡ ሳድስ፡ በክልኤ፡ ዓመት
  choice: Durant la sixième semaine, en sa deuxième année
  rationale: 'Rend explicitement la structure chronologique jubilaire : la deuxième année de la sixième semaine d’années.'
- source_word: ልሙጽ
  choice: lisse
  rationale: Reproduit le sens physique de « lisse », sans harmoniser avec le portrait de Jacob dans d’autres traditions textuelles.
- source_word: ሬትዕ
  choice: droit
  rationale: Conserve la qualification morale de droiture avec un terme français simple et digne.
- source_word: ድሩክ
  choice: farouche
  rationale: Le mot exprime ici la rudesse ou le caractère farouche, et non le fait d’être velu ; ce choix évite une harmonisation avec la Genèse.
- source_word: ሐቃላዊ
  choice: un homme des champs
  rationale: Expression naturelle qui conserve l’image d’un homme associé à la vie des champs.
theological_decisions:
- issue: Description contrastée de Jacob et d’Ésaü
  choice: Conserver « lisse et droit » pour Jacob et « farouche » pour Ésaü
  alternative: Harmoniser avec Genèse 25 en traduisant Ésaü par « velu » ou en modifiant le portrait moral de Jacob
  rationale: Le texte guèze fourni présente ses propres qualificatifs ; la traduction respecte cette forme sans importer une lecture issue d’un passage parallèle.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe source tout en étant naturelle ; aucune note n’est nécessaire puisque « farouche » traduit directement ድሩክ sans variante suffisamment probable à signaler.
