lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Introduit la raison donnée dans le contexte.
- source_word: አእምር
  choice: je sais
  rationale: Rend directement le verbe de connaissance à la première personne.
- source_word: ያኀሪ
  choice: choisira
  rationale: Le futur français correspond à la forme verbale et préserve l’idée d’une élection divine.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et intelligible du titre divin guèze.
- source_word: ሎቱ
  choice: pour lui-même
  rationale: Conserve la valeur du pronom datif renvoyant au Seigneur.
- source_word: ለሕዝብ
  choice: comme son peuple
  rationale: Exprime naturellement en français la relation prédicative indiquée par le guèze, sans réduire « peuple » à un simple collectif indéfini.
theological_decisions:
- issue: Rapport entre l’individu choisi et le peuple
  choice: « le choisira pour lui-même comme son peuple »
  alternative: « le choisira pour qu’il devienne un peuple qui lui appartienne »
  rationale: La formulation retenue conserve la tension du texte, qui parle d’un individu en termes de peuple, probablement en vue de sa descendance, sans expliciter cette interprétation dans le corps du verset.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la syntaxe et de l’ambiguïté conceptuelle de la source tout en étant naturelle.
