  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
translation:
  language: fr
  text: Il aime Ésaü plus que Jacob, mais je vois la juste affection que tu portes à Jacob. Continue encore à lui témoigner de la bienveillance, et que tes yeux soient tournés vers lui avec amour, car il sera désormais une bénédiction sur la terre, à travers toutes les générations de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያፈቅሮ፡ ለዔሳው፡ እም፡ ያዕቆብ
  choice: Il aime Ésaü plus que Jacob
  rationale: 'La préposition comparative እም exprime ici la préférence : « plus que ».'
- source_word: መፍቀሪተ፡ ጽድቅ፡ ያዕቆብሃ
  choice: la juste affection que tu portes à Jacob
  rationale: Rend l’expression littérale « affection de justice » dans un français naturel sans en affaiblir la valeur morale.
- source_word: አሡንዮ፡ ላዕሌሁ
  choice: lui témoigner de la bonté
  rationale: Exprime une bienveillance active et continue envers Jacob.
- source_word: ወይኩና፡ አዕይንትኪ፡ ላዕሌሁ፡ ለፍቅር
  choice: que tes yeux veillent sur lui avec amour
  rationale: Conserve l’image des yeux posés sur Jacob tout en explicitant naturellement l’attention bienveillante en français.
theological_decisions:
- issue: Nature de la bénédiction associée à Jacob
  choice: il sera une bénédiction sur la terre
  alternative: il sera béni sur la terre
  rationale: La formulation consultée présente Jacob comme une source de bénédiction, et non seulement comme le bénéficiaire d’une bénédiction ; cette tension est conservée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative initiale et l’image sémitique des yeux tournés vers Jacob sont maintenues dans une formulation idiomatique.
