revisions:
- from: Il aime Ésaü plus que Jacob, mais je vois la juste affection que tu portes à Jacob. Continue donc à lui témoigner de la bonté ; que tes yeux veillent sur lui avec amour, car, dès maintenant et dans toutes les générations de la terre, il sera une bénédiction sur la terre.
  to: Il aime Ésaü plus que Jacob, mais je vois la juste affection que tu portes à Jacob. Continue encore à lui témoigner de la bienveillance, et que tes yeux soient tournés vers lui avec amour, car il sera désormais une bénédiction sur la terre, à travers toutes les générations de la terre.
