  - marker: a
    text: Plus loin dans le chapitre, la formulation relative au pays est textuellement difficile. Le sens paraît être qu’Abraham ne se plaignit pas au sujet de la promesse du pays, bien qu’il ait dû y demander un lieu de sépulture.
