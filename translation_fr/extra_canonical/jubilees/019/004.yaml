lexical_decisions:
- source_word: ትዕግሥተ፡ መንፈስ
  choice: patience intérieurement
  rationale: L’expression associe la « patience » à l’« esprit ». En français courant, « intérieurement » restitue naturellement cette disposition intime sans donner à « esprit » un sens technique absent du contexte.
- source_word: ደቂቀ፡ ኬጢ
  choice: les fils de Heth
  rationale: Cette désignation traditionnelle d’un groupe humain est conservée, conformément au contexte biblique de l’acquisition d’un lieu de sépulture.
theological_decisions:
- issue: Nature de la patience d’Abraham
  choice: Il garda patience intérieurement
  alternative: Il fut patient en esprit
  rationale: La formulation choisie conserve l’idée d’une disposition intérieure sans préciser si « esprit » désigne ici la psychologie humaine ou une réalité spirituelle plus technique.
translation_notes:
  register: Français moderne, sobre et digne. « Les fils de Heth » maintient la désignation biblique traditionnelle; la première proposition privilégie une tournure française naturelle tout en conservant la patience comme disposition intérieure.
