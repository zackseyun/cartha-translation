  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
translation:
  language: fr
  text: En cela, Abraham fut trouvé fidèle et patient d’esprit. Il ne prononça aucune parole au sujet de la promesse concernant le pays, que le Seigneur avait déclaré lui donner, à lui et à sa descendance après lui. Pourtant, il demanda là un lieu où y ensevelir sa défunte, car il fut trouvé fidèle, et il fut inscrit comme ami du Seigneur sur les tablettes célestes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦቱ
  choice: En cela
  rationale: Conserve le renvoi au contexte précédent et l’idée qu’Abraham fut reconnu fidèle dans cette épreuve.
- source_word: ዕጉሠ፡ መንፈስ
  choice: patient d’esprit
  rationale: Rend directement la qualité intérieure de patience ou d’endurance sans la réduire à une simple attitude calme.
- source_word: ንባብ፡ ዘበምድር
  choice: la promesse concernant le pays
  rationale: Dans le contexte de ce que le Seigneur avait déclaré donner, « promesse » exprime naturellement la portée de la parole, tandis que « concernant » évite de confondre la promesse avec le pays lui-même.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: Équivalent français collectif naturel de « semence » dans un contexte généalogique.
- source_word: መካነ፡ አስተብቍዐ
  choice: un lieu où ensevelir
  rationale: Exprime en français courant la demande d’un emplacement funéraire.
- source_word: ቤድኖ
  choice: sa morte
  rationale: Le nom est ici au féminin singulier et renvoie à Sara; cette formulation conserve la référence concrète au corps de la défunte.
- source_word: ተጽሕፈ፡ ዐርከ
  choice: il fut inscrit comme ami
  rationale: Le verbe passif masculin a Abraham pour sujet; « inscrit » convient au contexte des tablettes célestes.
theological_decisions:
- issue: Titre divin
  choice: le Seigneur
  alternative: YHWH / l’Éternel
  rationale: Rend dignement le titre divin guèze sans introduire une tradition confessionnelle particulière ni une vocalisation du nom divin.
- issue: Nature de la parole sur le pays
  choice: la promesse concernant le pays
  alternative: la parole concernant le pays
  rationale: Le contexte explicite un don divin futur à Abraham et à sa descendance; « promesse » en restitue la force, sans préciser davantage les modalités théologiques.
- issue: Statut d’Abraham comme ami
  choice: il fut inscrit comme ami du Seigneur
  alternative: il lui fut écrit le titre d’ami du Seigneur
  rationale: Suit la grammaire du passif masculin et conserve l’image céleste d’une reconnaissance consignée.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe reste proche du texte source tout en évitant les calques lourds. « Sa morte » est volontairement concret et marqué, conformément au féminin singulier du texte et au contexte de la mort de Sara.
