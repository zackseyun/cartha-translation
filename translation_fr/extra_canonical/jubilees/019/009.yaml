    issue: « sa morte »
    rationale: Bien que cette formulation cherche à reproduire le féminin singulier du guèze, elle n’est pas d’un usage naturel en français moderne international. « Sa défunte » garde la même référence concrète à Sara et le même nombre, sans modifier le sens.
