  text: And in the first year of the first week in the fifty-eighth jubilee[1], Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for another week of years.
translation:
  language: fr
  text: La première année de la première semaine du cinquante-huitième jubilé[1], Abraham revint et habita en face d’Hébron — c’est-à-dire Qiryath-Arba — pendant une autre semaine d’années.
