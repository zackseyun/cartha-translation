lexical_decisions:
- source_word: ፶ወ፰
  choice: cinquante-huitième
  rationale: Le nombre guèze donné est formé de 50 et 8, soit 58.
- source_word: አንጻረ
  choice: en face de
  rationale: Cette expression conserve le rapport spatial précis de vis-à-vis, plutôt que le sens plus vague de « près de ».
- source_word: ቀርያታርቦቅ
  choice: Qiryath-Arba
  rationale: Transcription française reconnaissable du nom biblique, conforme à l’identification explicative du texte.
- source_word: ሱባዔ፡ ዓመት
  choice: semaine d’années
  rationale: Ce rendu préserve la terminologie calendaire caractéristique du livre au lieu de la réduire à « sept ans ».
theological_decisions:
- issue: Terminologie calendaire des Jubilés
  choice: « semaine » et « jubilé » sont conservés comme unités calendaires
  alternative: Expliciter systématiquement en nombres d’années
  rationale: Le texte articule son récit selon ces unités porteuses de sens; les convertir ferait disparaître cette structure.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit étroitement la structure temporelle du guèze tout en restant naturelle; « pendant » explicite sans excès la durée exprimée à la fin du verset.
