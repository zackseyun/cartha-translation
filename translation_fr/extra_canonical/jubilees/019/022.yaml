lexical_decisions:
- source_word: ውሉድየ (wəludəya)
  choice: mes fils
  rationale: Rend directement le nom pluriel avec le suffixe possessif de première personne; le fragment achève une phrase commencée dans le contexte précédent.
- source_word: እስከ ለዓለም (ʾəska laʿālam)
  choice: pour toujours
  rationale: Expression française naturelle correspondant à la durée indéfinie exprimée par «jusqu’à l’éternité».
- source_word: ዘርኡ (zarʾu)
  choice: sa descendance
  rationale: Dans ce contexte généalogique, «descendance» restitue le sens collectif de «semence» sans archaïsme inutile.
- source_word: ይከውን ዘይመልእ (yəkawən za-yəmallaʾ)
  choice: soit celle qui remplira
  rationale: Conserve la construction «qu’elle soit celle qui…» du texte source et son orientation prospective, plutôt que de la réduire au simple verbe «remplisse».
- source_word: ኵላ ምድረ (kwəllā mədr)
  choice: toute la terre
  rationale: Équivalent direct et idiomatique de l’expression désignant l’ensemble de la terre.
theological_decisions:
- issue: Portée de la bénédiction et de la promesse concernant la descendance
  choice: Maintenir deux souhaits parallèles introduits par «que»
  alternative: 'Transformer le second en affirmation prédictive: «sa descendance remplira toute la terre»'
  rationale: Les formes verbales permettent une nuance volitive dans la continuité de «qu’il soit béni»; cette formulation préserve la tension entre bénédiction prononcée et accomplissement futur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle «soit celle qui» est conservée afin de refléter la construction relative du guèze. La dernière forme እመ du segment fourni paraît amorcer la proposition suivante et n’est donc pas intégrée à ce verset.
