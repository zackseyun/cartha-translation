  text: and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned warfare.
translation:
  language: fr
  text: 'et velu. Jacob habitait dans des tentes. Les jeunes gens grandirent : Jacob apprit l’écriture, mais Ésaü ne l’apprit pas, car il était un homme des champs et un chasseur, et il apprit l’art de la guerre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምጽላላት
  choice: tentes
  rationale: Le terme désigne des abris ou tentes; « sous des tentes » rend naturellement le mode de vie évoqué.
- source_word: መጽሐፈ
  choice: l’écriture
  rationale: Dans la construction avec « apprit », le mot renvoie à l’écriture ou aux lettres, plutôt qu’à un livre précis.
- source_word: ሐቃላዊ
  choice: des champs
  rationale: L’adjectif qualifie Ésaü comme homme de plein champ ou de campagne; « homme des champs » conserve cette caractérisation biblique.
- source_word: ነዓዊ
  choice: chasseur
  rationale: Le terme désigne celui qui chasse.
- source_word: ፀብአ
  choice: l’art de la guerre
  rationale: Dans « apprit », le substantif renvoie à la guerre comme pratique ou savoir-faire; cette formulation est idiomatique et plus précise que « apprit la guerre ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le fragment initial « et velu » est conservé parce que le verset fourni commence au milieu de la description précédente. Le contraste entre Jacob lettré et Ésaü formé à la chasse et à la guerre est maintenu sans ajout interprétatif.
