  text: and Adam. And they shall be to establish heaven and to strengthen the earth and to renew all.
translation:
  language: fr
  text: et Adam. Et ils seront destinés à établir le ciel, à affermir la terre et à renouveler toutes choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሳርረ፡ ሰማይ
  choice: à établir le ciel
  rationale: L’infinitif précédé de ለ- exprime ici la fonction ou le but; la racine ሳርረ porte le sens de fonder ou d’établir.
- source_word: ለአጽንዖ፡ ምድር
  choice: à affermir la terre
  rationale: «Affermir» restitue l’idée de rendre ferme ou solide tout en conservant un registre digne et naturel.
- source_word: ለኀድሶ፡ ኵሉ
  choice: à renouveler toutes choses
  rationale: Le substantif collectif ኵሉ signifie littéralement «tout»; en français, «toutes choses» exprime naturellement cette portée globale sans en préciser indûment le référent.
theological_decisions:
- issue: Référent et portée de ኵሉ («tout»).
  choice: toutes choses
  alternative: tout
  rationale: La formulation conserve la portée universelle et l’indétermination du texte sans introduire une notion doctrinale particulière.
translation_notes:
  register: Français moderne, international et soutenu. Le fragment initial «et Adam» est conservé malgré son caractère syntaxiquement dépendant, puisqu’il prolonge le contexte antérieur. «Ils serviront à» rend idiomatiquement la valeur fonctionnelle des trois infinitifs parallèles.
