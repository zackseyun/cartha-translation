  yaml_path: translation/extra_canonical/jubilees/019/027.yaml
  text: and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God from above the firmament bless you and give you all the blessings with which he blessed Adam and Enoch and Noah and Shem; and whatever he has spoken to me and whatever he said he would give me, may it rest upon you and upon your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not come upon you or upon your seed, to turn you away from following the LORD, who is your God from now and forever. And may the Lord God be a father to you, and you be his firstborn son, and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau, but Isaac loved Esau much more than Jacob.
translation:
  language: fr
  text: 'Il l’embrassa, le bénit et dit : « Jacob, mon fils bien-aimé, toi que mon âme aime, que Dieu, du haut du firmament,[b] te bénisse et t’accorde toutes les bénédictions dont il a béni Adam, Hénok, Noé et Sem.[a] Que tout ce qu’il m’a annoncé et tout ce qu’il a dit qu’il me donnerait repose sur toi et sur ta descendance pour toujours, aussi longtemps que le ciel demeurera au-dessus de la terre. Que les esprits de Mastéma ne viennent pas sur toi ni sur ta descendance pour vous détourner de suivre le SEIGNEUR,[d] qui est ton Dieu dès maintenant et pour toujours. Que le Seigneur Dieu soit pour toi un père,[c] et que tu sois son fils premier-né pour tous les peuples, à jamais. Va en paix, mon fils. »


    Tous deux sortirent ensemble de chez Abraham. Rébecca aimait Jacob de tout son cœur et de toute son âme, bien plus qu’Ésaü ; mais Isaac aimait Ésaü bien plus que Jacob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La ponctuation ou la tradition textuelle permet aussi de comprendre : « Adam, Hénok et Noé ; et que tout ce qu’il m’a annoncé… »'
    reason: Signale l’alternative de délimitation transmise par la tradition éditoriale autour de la mention de Sem.
  - marker: b
    text: 'On pourrait aussi traduire plus librement : « que le Dieu Très-Haut te bénisse ».'
    reason: Indique l’équivalent dynamique traditionnel de l’expression cosmologique littérale.
  - marker: c
    text: 'Littéralement : « Que le Seigneur, ton Dieu, soit un père pour toi » est également possible selon le rattachement des mots.'
    reason: Préserve l’ambiguïté syntaxique de la séquence guèze autour de « Seigneur », « Dieu » et « père ».
  - marker: d
    text: 'Littéralement : « pour vous éloigner de derrière le SEIGNEUR », c’est-à-dire pour vous détourner de le suivre.'
    reason: Explique la métaphore spatiale et de fidélité du texte source sans introduire l’image non explicite de la voie.
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት፡
  choice: Dieu, du haut du firmament
  rationale: Conserve l’image cosmologique précise du guèze (« Dieu depuis/du-dessus du firmament ») plutôt que de la réduire au titre « Dieu Très-Haut ».
- source_word: ዘርእከ፡
  choice: ta descendance
  rationale: Rend le nom collectif « semence, postérité » en français naturel tout en conservant sa portée collective.
- source_word: መናፍስተ፡ መስቴማ፡
  choice: les esprits de Mastéma
  rationale: Translittère le nom propre Mastéma et maintient le pluriel explicite « esprits ».
- source_word: እምድኅረ፡ እግዚአብሔር፡
  choice: de la voie du SEIGNEUR
  rationale: 'Littéralement « de derrière le Seigneur » : l’expression évoque le fait de marcher à sa suite. « De la voie » préserve cette métaphore en français idiomatique.'
- source_word: እግዚአብሔር፡ አምላከ፡ አበ፡
  choice: Que le Seigneur Dieu soit pour toi un père
  rationale: Reproduit les deux désignations divines et la relation paternelle exprimées dans la source.
theological_decisions:
- issue: Durée de la bénédiction liée aux « jours du ciel sur la terre »
  choice: aussi longtemps que le ciel demeurera au-dessus de la terre
  alternative: selon les jours du ciel au-dessus de la terre
  rationale: Exprime naturellement l’idiome de durée sans en faire une affirmation métaphysique plus précise que le texte.
- issue: Relation entre Jacob, la filiation première-née et le peuple
  choice: que tu sois son fils premier-né, pour le peuple, à jamais
  alternative: que tu sois son fils premier-né, et qu’il soit un père pour le peuple à jamais
  rationale: La syntaxe de la dernière proposition est elliptique et difficile. Le texte principal rattache prudemment « pour le peuple » au rôle de Jacob sans compléter silencieusement un verbe ou un sujet absent.
- issue: Action des esprits de Mastéma
  choice: s’en prennent ni à toi ni à ta descendance pour vous détourner
  alternative: ne viennent ni sur toi ni sur ta descendance pour vous détourner
  rationale: « S’en prendre à » rend en français actuel la venue hostile « sur » quelqu’un, sans nier la formulation plus littérale signalée implicitement par la structure.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours de bénédiction garde une cadence solennelle sans archaïsmes. « SEIGNEUR » distingue le titre divin dans la formule de fidélité, tandis que « Seigneur Dieu » suit directement la double désignation du guèze.
