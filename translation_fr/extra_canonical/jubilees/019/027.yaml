    issue: « pour vous détourner de la voie du SEIGNEUR »
    rationale: Le texte source dit littéralement éloigner « de derrière le Seigneur », soit détourner de le suivre. « La voie » est une image connexe mais non exprimée; elle doit être remplacée par une formulation qui conserve le verbe suivre.
  - severity: low
    issue: « ne s’en prennent ni à toi »
    rationale: Cette expression interprète la venue « sur » Jacob et sa descendance comme une agression. « Ne viennent pas sur » conserve plus exactement l’image du texte, sans nuire à l’intelligibilité.
  - severity: medium
    issue: « pour le peuple »
    rationale: Le guèze porte « à/pour tous les peuples ». Le singulier français omet « tous » et réduit la portée de l’expression. La construction demeurant elliptique, la révision conserve cette prudence sans ajouter de rôle théologique déterminé.
