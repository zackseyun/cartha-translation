  source_fidelity: Révision nécessaire pour rendre explicitement la relation « détourner de suivre le SEIGNEUR », présente dans le guèze (et retenue par l’audit anglais), plutôt que d’introduire « la voie ». La venue hostile des esprits est rendue plus près du texte par « ne viennent pas sur ». La dernière proposition doit conserver le pluriel « tous les peuples » et son ellipse syntaxique.
  naturalness: Le français révisé reste moderne, solennel et fluide. « Se détourner de suivre » est idiomatique dans ce registre, et « pour tous les peuples » permet de traduire le pluriel sans imposer une interprétation confessionnelle de la relation syntaxique.
  terminology: Les noms Jacob, Hénok, Noé, Sem, Rébecca, Ésaü et Mastéma sont conservés. « SEIGNEUR » rend le titre divin dans la formule de fidélité, tandis que « Seigneur Dieu » maintient la double désignation du guèze. « Descendance » rend correctement le collectif « semence ».
  issues:
