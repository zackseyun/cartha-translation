  text: than Esau. And he said to her, “My daughter, keep my son Jacob, for he will be in my place on the earth, and for a blessing in the midst of the sons of men, and for all the seed of Shem.”
translation:
  language: fr
  text: 'qu’Ésaü. Il lui dit : « Ma fille, veille sur mon fils Jacob, car il sera à ma place sur la terre, pour être une bénédiction parmi les êtres humains et pour toute la descendance de Sem. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቀቢ
  choice: veille sur
  rationale: L’impératif exprime l’idée de garder, protéger ou prendre soin ; « veille sur » est naturel en français et convient à l’adresse affectueuse.
- source_word: ህየንቴየ
  choice: il prendra ma place
  rationale: L’expression signifie littéralement « à ma place » ; avec ይከውን, le futur idiomatique français « prendra ma place » restitue clairement le sens.
- source_word: ለበረከት
  choice: une bénédiction
  rationale: Rend directement le nom « bénédiction » sans préciser indûment s’il s’agit de recevoir ou d’apporter cette bénédiction.
- source_word: ውሉደ፡ ሰብእ
  choice: les êtres humains
  rationale: Équivalent moderne et inclusif de l’expression littérale « les fils des hommes », ici employée collectivement pour l’humanité.
- source_word: ዘርኡ፡ ሴም
  choice: la descendance de Sem
  rationale: « Descendance » traduit naturellement le collectif « semence/postérité » en français moderne.
theological_decisions:
- issue: Rapport de Jacob à la bénédiction
  choice: « il sera une bénédiction »
  alternative: « pour une bénédiction »
  rationale: La construction source demeure concise et peut exprimer la fonction ou le résultat ; la formulation retenue est naturelle sans développer le mécanisme théologique.
- issue: Dernier membre concernant Sem
  choice: « et pour toute la descendance de Sem »
  alternative: « et pour la gloire de toute la descendance de Sem »
  rationale: Le mot « gloire » est absent du texte guèze fourni ; il ne doit donc pas être introduit dans le texte français.
translation_notes:
  register: Français international actuel, digne et lisible. Le verset commence par un fragment dépendant du contexte précédent (« qu’Ésaü »), conservé afin de respecter la délimitation fournie. Ponctuation française des dialogues appliquée.
