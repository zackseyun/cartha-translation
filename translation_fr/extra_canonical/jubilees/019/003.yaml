  text: And Abraham went to weep for her and to bury her, and we tested him to see if his spirit was patient, and he did not become violent in the speech of his mouth.
translation:
  language: fr
  text: Abraham alla la pleurer et l’ensevelir. Nous le mîmes à l’épreuve pour voir si son esprit était patient[a] ; il ne s’emporta pas dans ses paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’il gardait la maîtrise de lui-même ».'
    reason: La tournure source peut exprimer la patience, la retenue ou la maîtrise intérieure.
lexical_decisions:
- source_word: ይብክያ
  choice: pleurer sur elle
  rationale: Rend directement l’idée de pleurer ou de se lamenter à son sujet, dans un français naturel adapté au contexte funéraire.
- source_word: ይቅበራ
  choice: l’ensevelir
  rationale: Le verbe signifie l’enterrer ou lui donner une sépulture ; « ensevelir » convient au registre narratif et funéraire.
- source_word: ወመከርኖ (lecture textuelle corrigée)
  choice: Nous le mîmes à l’épreuve
  rationale: Cette lecture, attestée par la révision critique fournie, correspond au thème de la mise à l’épreuve d’Abraham et corrige la forme corrompue du texte transmis dans la requête.
- source_word: ይትነገሥ፡ መንፈሱ
  choice: si son esprit demeurait patient
  rationale: Conserve la formulation anthropologique du texte et l’idée d’une maîtrise patiente éprouvée dans le deuil.
- source_word: እይት… (fin tronquée dans l’extrait)
  choice: il ne s’emporta pas dans les paroles de sa bouche
  rationale: Suit la restitution contextuelle attestée par la couche anglaise auditée, tout en employant une expression française naturelle qui garde l’idée d’absence de réaction violente en parole.
theological_decisions:
- issue: La mort de Sara comme mise à l’épreuve d’Abraham
  choice: Maintenir explicitement « Nous le mîmes à l’épreuve »
  alternative: Comprendre le passage comme un simple souvenir de Sara
  rationale: La lecture corrigée du verbe et le contexte de Jubilés présentent l’événement comme une épreuve de la patience d’Abraham ; la traduction n’ajoute toutefois ni numéro ni identification dogmatique de cette épreuve.
- issue: Nature de la patience d’Abraham
  choice: « son esprit demeurait patient »
  alternative: « il gardait la maîtrise de lui-même »
  rationale: La formulation retenue préserve la référence explicite à l’esprit et évite de réduire la notion à une seule interprétation psychologique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase a été divisée en deux pour alléger la coordination sans modifier la progression narrative. Le « nous » est conservé sans identifier davantage ses référents. L’extrait guèze fourni étant corrompu à un endroit et tronqué à la fin, la traduction tient compte de la lecture corrigée et de la restitution documentées dans les données de révision.
