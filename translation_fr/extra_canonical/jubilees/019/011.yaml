translation:
  language: fr
  text: Abraham prit pour lui une troisième femme, nommée Ketoura, parmi les filles des serviteurs de sa maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ፡ ሣልስተ
  choice: une troisième femme
  rationale: Rend directement l’expression guèze et conserve l’ordre ordinal sans préciser davantage le statut matrimonial.
- source_word: ኬጡራ
  choice: Qetoura
  rationale: Translittération française moderne du nom biblique, proche de la forme sémitique et courante dans plusieurs traductions françaises.
- source_word: እምነ፡ አዋልደ፡ ልደ፡ ቤቱ
  choice: parmi les filles des serviteurs de sa maison
  rationale: Préserve la relation explicite entre les filles, les serviteurs et la maison d’Abraham, sans réduire l’expression à « ses servantes ».
theological_decisions:
- issue: Statut et rang de Qetoura
  choice: « une troisième femme »
  alternative: « sa troisième épouse » ou « une troisième concubine »
  rationale: Le texte source la qualifie de troisième femme sans employer ici un terme imposant « concubine »; « une » préserve aussi la formulation plutôt que de transformer explicitement l’expression en classement possessif.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « prit pour lui » garde une légère couleur ancienne correspondant à l’acte matrimonial du récit, tandis que « nommée » évite la lourdeur de « et son nom était ».
