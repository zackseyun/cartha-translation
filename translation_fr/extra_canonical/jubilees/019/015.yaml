  yaml_path: translation/extra_canonical/jubilees/019/015.yaml
  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: fr
  text: Toutes ses actions étaient violentes. Abraham aimait Jacob, mais Isaac aimait Ésaü. Abraham vit la conduite d’Ésaü et comprit que c’est en Jacob que son nom et sa descendance seraient appelés.[a] Il appela Rébecca et lui ordonna, au sujet de Jacob, car il savait qu’elle aimait Jacob bien davantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que son nom et sa descendance seraient appelés en Jacob ». Le sens probable est que le nom et la lignée d’Abraham se prolongeraient par Jacob.'
    reason: La formule source est concise et ambiguë en français. La note conserve la construction littérale et indique prudemment son sens contextuel probable, sans le substituer au texte.
lexical_decisions:
- source_word: ግብሩ / ግብሮ
  choice: actions / conduite
  rationale: Le terme désigne les actes ou la manière d’agir. La variation française évite une répétition pesante tout en gardant le même champ sémantique.
- source_word: ድሩክ
  choice: violentes
  rationale: Dans ce contexte moral, le mot qualifie les actes d’Ésaü comme rudes, féroces ou violents; « violentes » est naturel et suffisamment fort sans surinterprétation.
- source_word: ይጼዋዕ
  choice: seraient perpétués
  rationale: Le sens littéral est « seraient appelés », mais la formule « son nom et sa descendance seraient appelés en Jacob » est obscure en français. « seraient perpétués » exprime naturellement la continuité du nom et de la lignée, tandis qu’une note conserve la formulation littérale.
- source_word: አዘዘ
  choice: lui donna ses instructions
  rationale: Le verbe signifie ordonner ou prescrire. Cette formulation garde l’idée d’une directive adressée à Rébecca sans préciser indûment son contenu, absent du verset.
- source_word: ፈድፋደ
  choice: bien davantage
  rationale: L’intensif marque une nette préférence affective; « bien davantage » rend cette comparaison de manière idiomatique.
theological_decisions:
- issue: Continuité du nom et de la descendance d’Abraham « en Jacob »
  choice: « c’est en Jacob que son nom et sa descendance seraient perpétués »
  alternative: « son nom et sa descendance seraient appelés en Jacob »
  rationale: Le texte associe à Jacob la continuité du nom et de la lignée d’Abraham. La traduction principale communique cette idée sans définir plus précisément le mécanisme théologique; la note signale l’expression littérale et son ambiguïté.
- issue: Préférences familiales opposées
  choice: « Abraham aimait Jacob, mais Isaac aimait Ésaü »
  alternative: « Abraham avait de l’affection pour Jacob, et Isaac pour Ésaü »
  rationale: Le verbe source exprime directement l’amour. « mais » rend le contraste manifeste entre les deux préférences sans ajouter de jugement doctrinal.
translation_notes:
  register: Français international moderne, courant et digne. Les phrases restent proches de la structure du guèze, avec une légère explicitation idiomatique de la formule concernant le nom et la descendance. Le marqueur [a] figure bien dans le texte principal.
