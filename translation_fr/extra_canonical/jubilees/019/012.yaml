  text: 'for Hagar had died before Sarah. And she bore him six sons: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah, in two weeks of years.'
translation:
  language: fr
  text: 'car Agar était morte avant Sara. Elle lui donna six fils : Zimran, Yoqshân, Medân, Madiân, Yishbaq et Shouah, au cours de deux semaines d’années.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire quatorze ans.
    reason: Explique au lecteur moderne l’expression chronologique « deux semaines d’années » sans effacer dans le texte la terminologie caractéristique du livre.
lexical_decisions:
- source_word: ሞተት፡ አጋር፡ እምቅድመ፡ ሳራ
  choice: Agar était morte avant Sara
  rationale: Rend directement l’antériorité exprimée par እምቅድመ, avec le plus-que-parfait naturel dans ce contexte narratif.
- source_word: ወወለደት፡ ሎቱ፡ ውሉደ፡ ስድስተ
  choice: Elle lui donna six fils
  rationale: Expression française naturelle correspondant à « elle enfanta pour lui six enfants/fils »; les six noms masculins et la tradition parallèle justifient « fils ».
- source_word: ዝንበርሃ፡ ወያክስንሃ፡ ወማዳይሃ፡ ወማዳንሃ፡ ወኢየዘቦቅሃ፡ ወሱሂያሃ
  choice: Zimran, Yoqshân, Medân, Madiân, Yishbaq et Shouah
  rationale: Translittérations françaises lisibles qui maintiennent les distinctions entre les six noms et restent proches des formes sémitiques attestées dans la tradition biblique.
- source_word: በክልኤ፡ ሱባዔ፡ ዓመት
  choice: au cours de deux semaines d’années
  rationale: 'Conserve le mode de calcul propre aux Jubilés : deux unités de sept ans, sans remplacer dans le texte l’expression traditionnelle par une simple équivalence numérique.'
