  text: 'And he bowed down to them again, and after this he buried his dead in the double cave. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years.'
translation:
  language: fr
  text: 'Il se prosterna de nouveau devant eux. Après cela, il ensevelit sa défunte dans la grotte double. La durée totale de la vie de Sara fut de cent vingt-sept ans : deux jubilés et quatre semaines d’années.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካዕበ
  choice: de nouveau
  rationale: Rend explicitement l’idée de répétition (« encore, une seconde fois ») présente dans le guèze.
- source_word: ቤድኖ
  choice: sa défunte
  rationale: Le terme désigne ici la morte qu’Abraham doit ensevelir; « sa défunte » est naturel et conserve le lien personnel sans ajouter son nom.
- source_word: ባዓት፡ ዘካዕበት
  choice: la grotte double
  rationale: Traduction formelle de l’expression guèze; elle préserve la désignation traditionnelle sans la remplacer par un nom propre absent du verset.
- source_word: ክልኤ፡ ኢዮቤልዉ፡ ወአርባዕቱ፡ ሱባዔ
  choice: deux jubilés et quatre semaines d’années
  rationale: 'Conserve le calcul chronologique propre au livre : 2 × 49 ans plus 4 × 7 ans = 126 ans, selon le mode de comptage exprimé par le texte.'
