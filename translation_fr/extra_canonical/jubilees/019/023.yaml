  text: If a man can count the sand of the earth, then his seed also will be counted. And all the blessings with which he blessed me
translation:
  language: fr
  text: Si un homme peut compter le sable de la terre, alors sa descendance aussi pourra être comptée. Et toutes les bénédictions par lesquelles il m’a béni…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይክል፡ ሰብእ፡ ኈልቆ፡ ኖላ፡ ምድር
  choice: Si un homme peut compter le sable de la terre
  rationale: Rend directement la proposition conditionnelle et conserve l’image biblique du sable innombrable.
- source_word: ዘርኡሂ
  choice: sa descendance aussi
  rationale: ዘር signifie littéralement « semence », mais « descendance » exprime naturellement ici le sens généalogique; la particule additive est rendue par « aussi ».
- source_word: ይትኌለቍ
  choice: pourra être comptée
  rationale: Conserve la forme passive et le parallélisme avec « peut compter ».
- source_word: ወኵሉን፡ በረከት
  choice: Et toutes les bénédictions
  rationale: Reproduit la coordination et le pluriel collectif du texte source.
- source_word: እለ፡ ባረከኒ
  choice: dont il m’a béni
  rationale: Le verbe porte un sujet masculin singulier non exprimé, « il », et l’objet « me »; le nom divin n’est pas explicite dans ce segment.
theological_decisions:
- issue: Identité du sujet de ባረከኒ
  choice: il m’a béni
  alternative: le Seigneur m’a béni
  rationale: Le guèze dit littéralement « il m’a béni » sans nommer explicitement le Seigneur. La traduction préserve cette référence implicite plutôt que de résoudre l’ambiguïté.
translation_notes:
  register: Français moderne, international et digne. La phrase finale reste suspendue, conformément au fragment fourni, qui se poursuit manifestement dans le contexte suivant.
