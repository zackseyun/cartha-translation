  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: fr
  text: En bénédiction sur la terre, dès maintenant et pour toutes les générations de la terre. Que tes mains soient fortes et que ton cœur se réjouisse de ton fils Jacob, car je l’ai aimé bien plus que tous les autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት
  choice: pour qu’il soit une bénédiction
  rationale: Le syntagme introduit une finalité ou un résultat et dépend du contexte précédent; l’ajout du pronom « il » permet une formulation française naturelle sans préciser davantage un référent absent du verset fourni.
- source_word: እምይእዜ ወእስከ ኵሉ ትውልደ ምድር
  choice: dès maintenant et dans toutes les générations de la terre
  rationale: Rend littéralement la progression temporelle, du présent à l’ensemble des générations terrestres.
- source_word: ይጽንዓ እደዊኪ
  choice: Que tes mains soient fortes
  rationale: Conserve l’image corporelle et la valeur exhortative ou optative du texte.
- source_word: ትትፈሣሕ ልብኪ
  choice: que ton cœur se réjouisse
  rationale: Expression française naturelle qui maintient le cœur comme siège de la joie.
- source_word: ፈድፋደ እምኵሎሙ
  choice: bien plus que tous les autres
  rationale: Exprime le comparatif intensif et rend explicite en français que le groupe comparé est constitué de personnes, sans tenter de les identifier.
theological_decisions:
- issue: Nature de la préférence accordée à Jacob
  choice: « je l’ai aimé bien plus que tous les autres »
  alternative: « je l’ai préféré à tous les autres »
  rationale: Le verbe source exprime l’amour; la traduction conserve ce langage théologiquement chargé plutôt que de le réduire à une simple préférence ou à un choix.
- issue: Référent de la bénédiction dans la proposition initiale
  choice: emploi de « il » sans identification supplémentaire
  alternative: identifier explicitement Jacob ou sa descendance
  rationale: Le fragment fourni dépend syntaxiquement du contexte antérieur. La traduction reste lisible tout en évitant de résoudre sans preuve l’identité du référent.
translation_notes:
  register: Français international moderne, digne et accessible. Les images sémitiques des mains fortes et du cœur qui se réjouit sont conservées. Aucun marqueur de note n’est nécessaire.
