revisions:
- from: Il parla avec les fils de Heth afin qu’ils lui donnent un lieu où ensevelir son mort. Le Seigneur lui accorda la faveur de tous ceux qui le voyaient. Il adressa humblement sa requête aux fils de Heth, et ils lui donnèrent le terrain de la grotte double, qui se trouve en face de Mamré —
  to: Il parla avec les fils de Heth afin qu’ils lui donnent un lieu où enterrer son défunt. Le Seigneur lui accorda faveur auprès de tous ceux qui le voyaient. Il sollicita avec courtoisie les fils de Heth, et ils lui donnèrent le terrain de la double grotte, qui se trouve en face de Mamré —
  rationale: La révision clarifie la construction relationnelle de « faveur auprès de tous », remplace une expression française peu naturelle par « son défunt », et rend la demande courtoise de façon plus directe. Le tiret final est conservé, puisque l’extrait source s’interrompt après la relative introduite par « qui ».
  reviewer_model: gpt-5.6-terra
