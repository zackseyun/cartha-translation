  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
translation:
  language: fr
  text: Il parla avec les fils de Heth afin qu’ils lui donnent un lieu où enterrer son défunt. Le Seigneur lui accorda faveur auprès de tous ceux qui le voyaient. Il sollicita avec courtoisie les fils de Heth, et ils lui donnèrent le terrain de la double grotte, qui se trouve en face de Mamré —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ኬጥ
  choice: les fils de Heth
  rationale: Rend littéralement l’expression généalogique traditionnelle, désignant le peuple avec lequel Abraham négocie.
- source_word: መካነ
  choice: un lieu
  rationale: Le terme désigne ici un emplacement destiné à la sépulture.
- source_word: ቤድኖ
  choice: son mort
  rationale: Conserve la formulation sobre et concrète du substantif guèze, qui désigne le défunt ou le corps mort.
- source_word: ሞገሰ
  choice: la faveur
  rationale: Exprime l’accueil favorable accordé par Dieu à Abraham auprès de ceux qui le voient.
- source_word: በየውሀት
  choice: humblement
  rationale: L’adverbe traduit l’idée de douceur, d’humilité ou de courtoisie dans la manière de présenter la demande.
- source_word: ምድረ፡ ባዓት፡ ዘካዕበት
  choice: le terrain de la grotte double
  rationale: Suit la formulation descriptive du guèze sans remplacer celle-ci par le nom traditionnel « Makpéla », absent du texte fourni.
- source_word: መምብሬም
  choice: Mamré
  rationale: Forme française usuelle du toponyme biblique.
theological_decisions:
- issue: Nom divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « Le Seigneur » est une restitution française traditionnelle et largement intelligible du titre divin, sans imposer une convention confessionnelle particulière.
- issue: Agent de la faveur reçue par Abraham
  choice: Le Seigneur lui accorda la faveur de tous ceux qui le voyaient
  alternative: Le Seigneur lui donna grâce devant tous ceux qui le voyaient
  rationale: Conserve explicitement l’action divine et la tournure relationnelle du texte tout en employant un français naturel.
translation_notes:
  register: Français moderne, digne et accessible. La coordination a été répartie en trois phrases pour éviter une période excessivement lourde, sans modifier la progression du récit. Le tiret final conserve le caractère manifestement continu de la phrase source, qui s’achève ici sur une proposition relative incomplète ou poursuivie au verset suivant.
