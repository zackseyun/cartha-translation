  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይቀውም
  choice: qui se lèvera
  rationale: Le verbe exprime littéralement l’idée de se tenir debout, de se lever ou de subsister. « Se lèvera » reste naturel en français tout en préservant cette amplitude mieux que l’interprétation plus précise « se distinguera ».
- source_word: እምኵሎሙ፡ አሕዛብ
  choice: parmi toutes les nations
  rationale: Rend directement la provenance ou la position au sein de l’ensemble des nations, sans ajouter de distinction ethnique ou théologique.
- source_word: እለ፡ ዲበ፡ ገጸ፡ ምድር
  choice: qui sont à la surface de la terre
  rationale: Reproduit l’expression sémitique « sur la face de la terre » dans un français actuel et digne.
- source_word: ወናሁ
  choice: Et voici
  rationale: « Voici » rend la particule présentative ናሁ plus directement que « maintenant », tout en marquant la transition du discours.
- source_word: ይስሐቅ፡ ወልድየ
  choice: Isaac, mon fils
  rationale: Traduction directe du nom propre suivi de l’apposition possessive.
theological_decisions:
- issue: Portée de ዘይቀውም
  choice: qui se lèvera
  alternative: qui se distinguera
  rationale: Le texte peut évoquer le fait de se lever, de subsister ou d’occuper une place éminente. La formulation retenue ne réduit pas cette tension à la seule idée de distinction.
translation_notes:
  register: 'Français international moderne, fluide et digne. Le caractère fragmentaire de l’extrait est conservé : il commence par une proposition relative et s’achève sans ponctuation forte, puisque le contexte fourni se poursuit manifestement.'
