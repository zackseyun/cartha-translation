  text: a priesthood and a holy people. And he went on his way, and he rejoiced and blessed the Creator of all because we had told him.
translation:
  language: fr
  text: un sacerdoce et un peuple saint. Puis il poursuivit son chemin. Il se réjouit et bénit le Créateur de toutes choses à cause de ce que nous lui avions dit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « Il se réjouit et bénit le Seigneur pour tout ce que nous lui avions dit. »'
    reason: La tradition de rendu antérieure comprend autrement le titre divin et le rattachement de « tout » ainsi que de la proposition finale.
lexical_decisions:
- source_word: ክህነት (kəhnät)
  choice: sacerdoce
  rationale: Le nom collectif désigne ici le sacerdoce, plutôt qu’un simple groupe de prêtres.
- source_word: ሕዝበ፡ ቅዱሰ (ḥəzba qǝddusa)
  choice: un peuple saint
  rationale: Rendu direct et naturel du syntagme nominal.
- source_word: ለፈጣሬ፡ ኵሉ (la-faṭāri kwellu)
  choice: le Créateur de toutes choses
  rationale: Conserve le titre divin précis et rattache « tout » au Créateur, conformément à la lecture source attestée par la révision critique.
- source_word: ዘነገርናሁ (za-nagarnāhu)
  choice: à cause de ce que nous lui avions dit
  rationale: Exprime la valeur causale probable tout en gardant en français le contenu de la parole non spécifié.
theological_decisions:
- issue: Titre divin dans la bénédiction
  choice: le Créateur de toutes choses
  alternative: le Seigneur
  rationale: Le titre « Créateur » est lexicalement plus précis et évite de substituer un titre théologique différent.
- issue: Lien syntaxique de ዘነገርናሁ
  choice: cause de la joie et de la bénédiction
  alternative: 'objet de la bénédiction : « pour tout ce que nous lui avions dit »'
  rationale: La lecture causale correspond à l’analyse critique la plus récente, mais l’autre rattachement demeure suffisamment plausible pour être signalé.
translation_notes:
  register: Français moderne, digne et accessible. « Poursuivit son chemin » évite une tournure pesante; « sacerdoce » conserve la valeur collective. Le marqueur de note est placé dans le texte principal.
