  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: fr
  text: Ils se souillèrent, se livrèrent à la débauche dans leur chair et commirent l’impureté sur la terre. Ainsi, le Seigneur exercera son jugement sur les lieux où ils ont agi selon l’impureté de Sodome, comme il a jugé Sodome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትራኩሱ
  choice: se souillèrent
  rationale: Rend directement l’idée de souillure ou de contamination morale, dans un français naturel et digne.
- source_word: ይዜምዉ
  choice: se livrèrent à la débauche
  rationale: Le verbe exprime une conduite sexuelle illicite; « débauche » est compréhensible aujourd’hui sans réduire indûment le terme à une forme précise d’immoralité sexuelle.
- source_word: በሥጋሆሙ
  choice: dans leur chair
  rationale: Conserve l’expression corporelle du texte source et sa portée théologique possible, sans l’expliciter davantage.
- source_word: ይገብሩ፡ ርኵሰ
  choice: commirent l’impureté
  rationale: Formulation française idiomatique qui préserve le substantif répété « impureté » et la dimension morale du propos.
- source_word: ኵነኔ
  choice: son jugement
  rationale: Le contexte indique l’exercice d’un jugement divin; le possessif français rattache naturellement celui-ci au Seigneur.
- source_word: በመካናት
  choice: sur les lieux
  rationale: Correspond au pluriel « lieux/endroits » sans préciser davantage leur nature.
theological_decisions:
- issue: Nature exacte de la faute sexuelle
  choice: se livrèrent à la débauche dans leur chair
  alternative: commirent la fornication dans leur chair
  rationale: Le choix retient la dimension sexuelle et corporelle sans imposer une catégorie juridique ou confessionnelle plus étroite que le texte.
- issue: Rapport entre les lieux jugés et Sodome
  choice: sur les lieux où ils ont agi selon l’impureté de Sodome
  alternative: sur les lieux qui ont agi comme Sodome dans son impureté
  rationale: La formulation maintient l’ambiguïté du référent personnel derrière « ils », tout en évitant d’attribuer littéralement une action morale aux lieux.
- issue: Comparaison finale avec le jugement de Sodome
  choice: comme il a jugé Sodome
  alternative: ainsi qu’il l’a condamnée
  rationale: La répétition de « juger » conserve le parallélisme et n’explicite pas le verdict au-delà du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « impureté » et de « Sodome » est conservée pour respecter la structure rhétorique du passage; aucun marqueur de note n’est requis.
