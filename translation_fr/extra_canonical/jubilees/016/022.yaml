  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
translation:
  language: fr
  text: Lors de cette fête[a], il fut le premier à célébrer la fête des Cabanes sur la terre. Pendant ces sept jours, il offrit[b] chaque jour sur l’autel, pour le Seigneur, deux taureaux, deux béliers, sept moutons et un bouc en sacrifice pour le péché,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour cette fête »; cette expression peut se rattacher à la phrase précédente.'
    reason: La préposition guèze በ et la coupure du verset permettent une autre compréhension syntaxique.
  - marker: b
    text: 'Ou : « il apporta chaque jour sur l’autel ».'
    reason: Le verbe signifie littéralement « faire approcher » ou « présenter » et sert couramment à parler d’une offrande.
lexical_decisions:
- source_word: በዛቲ፡ በዓል
  choice: Lors de cette fête
  rationale: La préposition በ exprime ici naturellement le cadre temporel (« lors de », « pendant »), tandis que ዛቲ désigne « cette » fête.
- source_word: መጻላት
  choice: la fête des Cabanes
  rationale: Le terme désigne la fête des huttes ou abris; « fête des Cabanes » est une appellation française courante, claire et digne.
- source_word: ያቀርብ
  choice: il offrit
  rationale: Le verbe signifie littéralement « faire approcher, présenter » et, dans le contexte sacrificiel de l’autel, se rend naturellement par « offrir ».
- source_word: አልህምተ፡ ክልኤተ ወአብሐኩ፡ ክልኤተ ወአባግዐ፡ ሰብዐተ
  choice: deux taureaux, deux béliers, sept moutons
  rationale: Traduction directe des catégories d’animaux et de leurs nombres, sans harmonisation avec une autre liste sacrificielle.
- source_word: መሐስአ፡ ጠሊ፡ አሐደ
  choice: un bouc
  rationale: L’expression précise un caprin mâle; « bouc » est le terme français naturel et exact.
theological_decisions:
- issue: Valeur sacrificielle de ያቀርብ
  choice: « il offrit »
  alternative: « il apporta » ou « il présenta »
  rationale: Le contexte de l’autel donne au verbe sa valeur cultuelle, mais une note conserve son sens concret de présentation.
- issue: Désignation du sacrifice final
  choice: « en sacrifice pour le péché »
  alternative: « pour le péché »
  rationale: L’ajout de « sacrifice » explicite en français la fonction cultuelle sans modifier la portée théologique de l’expression.
translation_notes:
  register: Français international moderne, au registre narratif digne et accessible. « Fête des Cabanes » privilégie une désignation courante; la répétition distributive du guèze est rendue naturellement par « chaque jour ». La virgule finale est conservée, car le verset fourni s’interrompt au milieu de la liste sacrificielle.
