  yaml_path: translation/extra_canonical/jubilees/016/026.yaml
  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: fr
  text: Il bénit son Créateur, qui l’avait créé au sein de sa génération, car il l’avait créé selon son bon plaisir. En effet, il savait et discernait que de lui sortirait une plante de justice pour les générations éternelles, et de lui une descendance sainte, afin qu’elle soit semblable à celui qui a tout fait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትዝምዱ፡
  choice: au sein de sa génération
  rationale: Rend l’idée de parenté ou de génération dans un français naturel, sans préciser davantage le rapport exact.
- source_word: በሥምረቱ፡
  choice: selon son bon plaisir
  rationale: Conserve à la fois l’idée de volonté favorable et la portée théologique de l’expression guèze.
- source_word: ወጠየቀ፡
  choice: et discernait
  rationale: Associé à « savait », ce verbe exprime ici une connaissance examinée ou clairement perçue, sans imposer la nuance plus forte de certitude absolue.
- source_word: ተከለ፡ ጽድቅ፡
  choice: une plante de justice
  rationale: Préserve la métaphore agricole explicite du texte source et son caractère traditionnel.
- source_word: ዘርእ፡ ቅዱስ፡
  choice: une descendance sainte
  rationale: « Descendance » restitue naturellement le sens collectif de « semence » appliqué à une lignée humaine.
- source_word: ለዘገብረ፡ ኵሎ።
  choice: à celui qui a tout fait
  rationale: Le texte comporte bien ኵሎ, « tout »; cette formulation française évite l’ajout plus explicite mais non nécessaire de « toutes choses ».
theological_decisions:
- issue: Référent de ከማሁ (« semblable à lui »)
  choice: « semblable à celui qui a tout fait »
  alternative: « semblable à lui, qui a tout fait »
  rationale: La formulation retenue relie naturellement le pronom au Créateur tout en suivant la construction du guèze, sans ajouter la notion plus interprétative d’« image ».
- issue: Nature de la « plante de justice » et de la « descendance sainte »
  choice: Conserver les images et expressions du texte sans les identifier explicitement
  alternative: Les interpréter comme une lignée particulière ou une figure messianique
  rationale: Le verset annonce une postérité juste et sainte, mais ne précise pas ici son identification théologique.
translation_notes:
  register: Français moderne, digne et lisible. La répétition « de lui » et la métaphore « plante de justice » sont maintenues afin de préserver la structure et l’imagerie du texte source.
