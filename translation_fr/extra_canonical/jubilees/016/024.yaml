  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
translation:
  language: fr
  text: 'Matin et soir, il faisait brûler de l’encens odorant : de l’oliban, du galbanum, du stacté, du nard, de la myrrhe, de la casse et du costus, soit sept aromates. Il les offrait tous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠናይ ለመዐዛ
  choice: odorant
  rationale: Rend naturellement l’idée d’une odeur agréable dans le contexte de l’encens.
- source_word: ስኂነ
  choice: oliban
  rationale: Désigne l’encens-franc (frankincense) comme substance aromatique précise; « oliban » évite de le confondre avec le mélange entier appelé encens.
- source_word: ቅንአተ
  choice: galbanum
  rationale: Équivalent français usuel de cette gomme-résine aromatique.
- source_word: ማየ ልብን
  choice: stacté
  rationale: Identification traditionnelle de l’aromate; le terme français spécialisé conserve la distinction avec l’oliban.
- source_word: ናርድስ
  choice: nard
  rationale: Transcription française courante de cet aromate.
- source_word: ከርቤ
  choice: myrrhe
  rationale: Équivalent français établi.
- source_word: ሰንበልተ
  choice: casse
  rationale: Identification retenue par la couche de consultation et placée avant le costus conformément à l’ordre du texte guèze.
- source_word: ኵስተ
  choice: costus
  rationale: Nom français de cette substance aromatique; l’ordre source est conservé.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Il faisait brûler » exprime une pratique répétée matin et soir. La liste suit strictement l’ordre du guèze; la formulation finale maintient à la fois l’offrande collective des sept substances et la pureté du mélange.
