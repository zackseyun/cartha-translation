base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
translation:
  language: fr
  text: Isaac seul deviendra une descendance sainte[a]. Il ne sera pas compté parmi les nations, car il sera la part du Très-Haut. Toute sa descendance est échue en partage à Dieu, afin qu’elle devienne pour le Seigneur, parmi tous les peuples, un peuple qui lui appartienne, et qu’elle devienne un royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Isaac deviendra une descendance sainte. »'
    reason: Le mot rendu par « seul » peut marquer l’unicité de façon plus ou moins appuyée dans la construction.
lexical_decisions:
- source_word: ይስሐቅኒ፡ አሐዱ
  choice: Isaac seul
  rationale: Le nom Isaac est explicite, et አሐዱ apporte ici une nuance d’unicité ou d’exclusivité qu’il convient de conserver.
- source_word: ዘርእ፡ ቅዱስ
  choice: une descendance sainte
  rationale: ዘርእ désigne ici la postérité ou la lignée, plutôt qu’une semence au sens concret.
- source_word: ኢይትኌለቍ፡ ወስተ፡ አሕዛብ
  choice: Il ne sera pas compté parmi les nations
  rationale: Traduction directe de l’idée d’être dénombré ou classé parmi les nations.
- source_word: ለመክፈልተ፡ ልዑል
  choice: la part du Très-Haut
  rationale: Préserve le vocabulaire de partage et le titre divin sans explicitation doctrinale.
- source_word: ውስተ፡ ዘይመልከ፡ አምላክ፡ ወረደ
  choice: est échue en partage à Dieu
  rationale: Rend de façon idiomatique en français l’image d’un lot ou d’une part attribuée à Dieu.
- source_word: ሕዝበ፡ ትርሲት
  choice: un peuple qui lui appartienne
  rationale: Exprime naturellement la notion d’un peuple acquis comme possession ou héritage, sans suggérer une possession matérielle ordinaire.
- source_word: መንግሥተ
  choice: un royaume
  rationale: Le terme désigne un royaume ou une royauté; «royaume» convient au contexte collectif.
theological_decisions:
- issue: Exclusivité d’Isaac dans la descendance sainte
  choice: Isaac seul
  alternative: Isaac deviendra une descendance sainte
  rationale: La présence de አሐዱ soutient l’emphase exclusive, tout en justifiant une note signalant une lecture moins appuyée.
- issue: Rapport entre Dieu et la descendance d’Isaac
  choice: sa descendance est échue en partage à Dieu
  alternative: sa descendance est tombée sous le domaine de Dieu
  rationale: Le choix conserve l’image du partage attestée par le contexte, sans développer une doctrine particulière de l’élection.
- issue: Peuple de possession
  choice: un peuple qui lui appartienne
  alternative: un peuple en possession
  rationale: La formulation retenue est claire en français moderne et maintient le lien d’appartenance au Seigneur.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit la progression du guèze tout en évitant les calques obscurs. Les futurs sont maintenus pour la promesse, tandis que l’attribution de la descendance à Dieu est rendue comme un fait déjà arrêté.
