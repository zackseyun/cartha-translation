  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: fr
  text: Tous deux éprouvèrent une très grande joie. Il bâtit là un autel au Seigneur, qui l’avait béni et l’avait réjoui dans le pays où il séjournait. Et, au cours de ce mois, il célébra pendant sept jours une fête de joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ
  choice: Tous deux
  rationale: Rend explicitement le duel et préserve la référence aux deux personnages du contexte.
- source_word: ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: une très grande joie
  rationale: Reproduit l’intensification du substantif « joie » par « grande » et « très ».
- source_word: ምሥዋዐ
  choice: un autel
  rationale: Terme cultuel courant et précis pour la construction élevée au Seigneur.
- source_word: በምድረ፡ ፍልሰቱ
  choice: dans le pays où il séjournait
  rationale: Exprime naturellement en français la terre du séjour temporaire, sans préciser indûment exil ou résidence permanente.
- source_word: ገብረ፡ በዓለ፡ ፍሥሓ
  choice: il célébra … une fête de joie
  rationale: « Célébrer une fête » est l’équivalent idiomatique de « faire une fête » en français moderne, tout en conservant le motif répété de la joie.
- source_word: በዝ፡ ወርኅ፡ ሰቡዐ፡ መዋዕለ
  choice: au cours de ce mois … pendant sept jours
  rationale: Conserve les deux indications temporelles et leur portée naturelle.
theological_decisions:
- issue: Identité de celui qui bénit et réjouit
  choice: Le relatif « qui » renvoie au Seigneur
  alternative: Faire de ces participes une proposition indépendante ou laisser l’antécédent moins net
  rationale: La syntaxe du passage qualifie le Seigneur comme celui qui l’avait béni et réjoui; cette relation est conservée sans ajout doctrinal.
- issue: Nature du séjour dans le pays
  choice: « le pays où il séjournait »
  alternative: « la terre de son exil » ou « la terre de sa migration »
  rationale: Le choix maintient l’idée de résidence non permanente sans imposer la connotation plus forte d’un exil forcé.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « joie » est maintenue parce qu’elle structure le verset source. Le passé simple porte les actions narratives, tandis que le plus-que-parfait marque les bienfaits divins antérieurs.
