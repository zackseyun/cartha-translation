  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
translation:
  language: fr
  text: Il agit envers Sara comme il l’avait dit. Elle devint enceinte et mit au monde un fils au troisième mois, au milieu du mois, au moment que le Seigneur avait indiqué à Abraham ; il naquit lors de la fête des prémices de la moisson.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሳራ
  choice: pour Sara
  rationale: Le préfixe datif ለ- est rendu naturellement par « pour », tout en nommant explicitement Sara comme dans le texte guèze.
- source_word: በወርኅ፡ ሣልስ
  choice: au troisième mois
  rationale: Traduction directe de l’indication chronologique.
- source_word: በመንፈቀ፡ ወርኅ
  choice: au milieu du mois
  rationale: Rend littéralement l’idée de la moitié ou du milieu du mois sans préciser un jour absent du texte.
- source_word: በበዓለ፡ ቀዳሜ፡ ማእረር
  choice: lors de la fête des prémices de la moisson
  rationale: Cette formulation française claire restitue la fête liée aux premiers produits de la récolte.
- source_word: ተወልደ
  choice: il naquit
  rationale: Le verbe est au masculin singulier et ne nomme pas explicitement Isaac ; le pronom renvoie sans ambiguïté au fils qui vient d’être mentionné.
theological_decisions:
- issue: Identité du fils à la fin du verset
  choice: il naquit
  alternative: Isaac naquit
  rationale: Le contexte identifie le fils, mais le texte source emploie seulement un verbe masculin singulier ; ne pas ajouter le nom préserve la formulation attestée.
- issue: Agent implicite dans la première proposition
  choice: Il fit pour Sara ce qu’il avait dit
  alternative: Le Seigneur fit pour Sara ce qu’il avait dit
  rationale: Le référent divin ressort du contexte et de la suite, mais le nom divin n’est pas explicitement répété dans cette proposition ; le pronom conserve cette structure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement la progression du guèze, avec un point-virgule pour rendre lisible la dernière indication festive sans ajouter d’information.
