  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
translation:
  language: fr
  text: 'Elle conçut un fils. Au septième mois, nous revînmes auprès de Sara et nous trouvâmes Sara enceinte[a]. Nous le bénîmes et lui annonçâmes tout ce qui avait été ordonné à son sujet : il ne mourrait pas avant d’avoir engendré six fils et de les voir avant sa mort, et qu’en Isaac un nom et une descendance seraient appelés pour lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant conçu devant nous ». L’expression peut aussi être comprise dans un sens temporel : « ayant conçu avant notre arrivée ».'
    reason: Préserve l’ambiguïté de ቅድሜነ sans imposer dans le texte une interprétation temporelle.
  - marker: b
    text: 'Ou, plus littéralement : « qu’en Isaac un nom et une descendance seraient appelés pour lui ».'
    reason: La tournure « appelés pour lui » reproduit un idiome dont le sens précis reste condensé en français.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Elle conçut un fils
  rationale: Rend directement l’ouverture guèze, sans introduire l’annonce à Abraham absente du texte source.
- source_word: በወርኅ፡ ሳብዕ
  choice: Au septième mois
  rationale: Rattaché au retour auprès de Sara, conformément à l’ordre des mots et au sens le plus probable.
- source_word: ቅድሜነ
  choice: avant notre arrivée
  rationale: Formulation française naturelle de l’expression littérale « devant nous », comprise ici temporellement par rapport au retour des visiteurs.
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: et de les avoir vus avant sa mort
  rationale: Le complément implicite renvoie aux six fils; la proposition conserve explicitement l’idée de les voir avant de mourir.
- source_word: ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: un nom et une descendance seraient appelés siens
  rationale: Conserve le verbe « appeler » et l’association du nom et de la descendance à Abraham, tout en restant intelligible en français.
theological_decisions:
- issue: La promesse liée à Isaac
  choice: « en Isaac, un nom et une descendance seraient appelés siens »
  alternative: « par Isaac, son nom serait perpétué et une descendance lui serait donnée »
  rationale: La formulation retenue préserve l’idiome et l’ambiguïté du texte au lieu d’expliciter théologiquement la manière dont le nom et la descendance se rattachent à Abraham.
translation_notes:
  register: Français moderne, narratif et digne. Les temps du récit et du discours indirect sont harmonisés; la répétition « avant… avant » est maintenue pour reproduire les deux repères temporels distincts du texte source.
