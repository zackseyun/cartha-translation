  text: But Lot we saved, because God remembered Abraham and brought him out from the midst of the overthrow.
translation:
  language: fr
  text: Mais nous avons sauvé Loth, parce que Dieu s’est souvenu d’Abraham et l’a fait sortir du milieu de la destruction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሎጥ
  choice: Loth
  rationale: Forme française traditionnelle et courante du nom biblique de Lot.
- source_word: ናድኅኖ
  choice: nous avons sauvé
  rationale: Rend la première personne du pluriel et le sens de délivrance du verbe, sans remplacer le sujet implicite par Dieu.
- source_word: እስመ
  choice: parce que
  rationale: Exprime clairement le rapport causal introduit par la conjonction guèze.
- source_word: ተዘከሮ
  choice: s’est souvenu de
  rationale: Conserve l’expression biblique du souvenir divin sans l’interpréter comme un simple rappel mental.
- source_word: አውፅኦ
  choice: l’a fait sortir
  rationale: Le suffixe objet renvoie naturellement à Loth; la tournure causative est conservée.
- source_word: እማእከለ
  choice: du milieu de
  rationale: Traduction directe de la locution spatiale; elle maintient l’image d’une extraction hors de la catastrophe.
theological_decisions:
- issue: Sujet du salut de Loth
  choice: Maintien de « nous avons sauvé »
  alternative: « Dieu a sauvé Loth »
  rationale: La forme verbale est à la première personne du pluriel, vraisemblablement dans la voix des êtres angéliques du contexte; l’attribuer directement à Dieu effacerait cette distinction narrative.
- issue: Souvenir de Dieu
  choice: Formulation littérale « Dieu s’est souvenu d’Abraham »
  alternative: « Dieu a tenu compte d’Abraham »
  rationale: La formulation traditionnelle préserve la tension et l’imagerie théologiques du texte sans expliquer excessivement la nature du souvenir divin.
translation_notes:
  register: Français international moderne, clair et digne. « Mais » assure le contraste narratif; « destruction » rend naturellement l’idée du renversement catastrophique de Sodome. Aucun marqueur de note n’est nécessaire.
