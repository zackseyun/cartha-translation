  source_fidelity: 'Le sens général et la syntaxe des verbes sont bien rendus : les actions sont au masculin singulier, le jugement est passif, et le dernier verbe est actif. « Cette époque » traduit correctement l’expression temporelle. La fin doit toutefois éviter un possessif français qui ferait naturellement de la descendance celle du sujet implicite (« il »), alors que la semence visée est celle de l’homme mentionné.'
  naturalness: 'Le français est globalement soutenu et naturel. « Aucune de ses descendances » n’est pas idiomatique : « descendance » est normalement un nom collectif non comptable dans cet emploi. « Il fut ordonné et décrété » est aussi plus direct et plus naturel que « un ordre fut donné et un décret prononcé ».'
  terminology: « Tablettes célestes », « descendance », « jugement » et « condamnation » conviennent au registre et au vocabulaire du passage. « Déraciner » conserve l’image d’éradication du texte source.
