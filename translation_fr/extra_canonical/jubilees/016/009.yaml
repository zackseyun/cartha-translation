base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
translation:
  language: fr
  text: depuis les jours d’Adam jusqu’à cette époque[a], car un homme avait couché avec ses filles. Et voici qu’il fut ordonné et décrété, au sujet de toute sa descendance, sur les tablettes célestes, qu’il devait les faire disparaître et les déraciner, que leur jugement devait être exécuté comme celui de Sodome, et qu’il ne devait laisser subsister aucun descendant de cet homme sur la terre au jour de la condamnation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « jusqu’alors » ou « jusqu’à ce temps-là ».
    reason: La tournure temporelle guèze peut recevoir ces formulations proches.
  - marker: b
    text: Le sujet de « il devait » n’est pas exprimé dans le texte ; les verbes sont au masculin singulier et renvoient vraisemblablement à Dieu.
    reason: La note préserve l’implicite grammatical et l’ambiguïté formelle du texte source.
lexical_decisions:
- source_word: አሜሁ (ʾamēhu)
  choice: à cette époque
  rationale: L’expression est ici temporelle et renvoie à l’époque en question, plutôt qu’à « son époque », formulation trop littérale et ambiguë en français.
- source_word: ተአዘዘ ወተቈረጸ
  choice: un ordre fut donné et un décret prononcé
  rationale: Cette paire de passifs exprime à la fois le commandement et la décision arrêtée; « décret » convient mieux que « écrit » au second verbe.
- source_word: ዘርአ
  choice: descendance
  rationale: Dans ce contexte généalogique, « descendance » rend naturellement l’idée de semence ou de postérité.
- source_word: ያአትትሙ ወይሠርዎሙ
  choice: il devait les faire disparaître et les déraciner
  rationale: Les verbes sont à la troisième personne masculine du singulier. « Faire disparaître » et « déraciner » conservent l’image d’une élimination totale de la lignée.
- source_word: ኵነኔ
  choice: jugement / condamnation
  rationale: Le terme désigne le jugement avec une issue punitive. « Jugement » convient pour la comparaison avec Sodome, tandis que « condamnation » rend naturellement la formule finale.
theological_decisions:
- issue: Sujet implicite des verbes à la troisième personne masculine du singulier
  choice: Conserver « il » dans le texte et préciser en note qu’il s’agit vraisemblablement de Dieu
  alternative: Nommer directement Dieu dans le corps du texte
  rationale: Le guèze marque un sujet masculin singulier sans le nommer. La traduction respecte cette forme tout en aidant le lecteur sans introduire explicitement un nom absent du texte.
- issue: Modalité du jugement inscrit sur les tablettes célestes
  choice: Employer « devait » et une tournure passive pour le jugement
  alternative: Employer une série d’impératifs ou de futurs catégoriques
  rationale: Cette formulation rend le contenu de l’ordre et du décret tout en respectant le passif de « leur jugement devait être exécuté ».
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe conserve la solennité judiciaire du passage. Le début est maintenu comme un fragment dépendant du contexte précédent, conformément au verset source fourni.
