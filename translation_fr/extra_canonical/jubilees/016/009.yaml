- from: 'depuis les jours d’Adam jusqu’à cette époque[a], car un homme avait couché avec ses filles. Et voici qu’un ordre fut donné et un décret prononcé au sujet de toute sa descendance sur les tablettes célestes : il devait les faire disparaître et les déraciner, leur jugement devait être exécuté comme celui de Sodome, et il ne devait laisser subsister aucune de ses descendances sur la terre au jour de la condamnation.[b]'
  to: depuis les jours d’Adam jusqu’à cette époque[a], car un homme avait couché avec ses filles. Et voici qu’il fut ordonné et décrété, au sujet de toute sa descendance, sur les tablettes célestes, qu’il devait les faire disparaître et les déraciner, que leur jugement devait être exécuté comme celui de Sodome, et qu’il ne devait laisser subsister aucun descendant de cet homme sur la terre au jour de la condamnation.[b]
  rationale: La révision corrige l’emploi non naturel de « descendances » et l’ambiguïté référentielle qui en découle dans la dernière proposition. Elle resserre également la paire initiale de passifs. Les verbes singuliers, le passif de l’exécution du jugement et le caractère implicite du sujet sont conservés, conformément au texte guèze et à l’audit anglais.
