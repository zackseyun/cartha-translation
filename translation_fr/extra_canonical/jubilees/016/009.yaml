    rationale: Le pluriel de « descendance » est inapproprié ici et le possessif peut se rattacher au sujet implicite des verbes, plutôt qu’à l’homme dont la lignée est condamnée. « Aucun descendant de cet homme » restitue clairement le référent sans modifier le sens.
