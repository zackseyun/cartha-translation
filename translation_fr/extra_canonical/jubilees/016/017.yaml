  text: And we blessed him and told him everything that had been decreed concerning him, that he would not die until he had begotten six more sons and seen them before he died; but in Isaac his name and seed would be called.
translation:
  language: fr
  text: 'Nous l’avons béni et lui avons annoncé tout ce qui avait été décrété à son sujet : il ne mourrait pas avant d’avoir engendré six autres fils et de les avoir vus avant sa mort ; mais c’est par Isaac que son nom et sa descendance seraient perpétués.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « en Isaac son nom et sa descendance seront appelés ». Cette expression indique que son nom et sa lignée se perpétueraient par Isaac.
    reason: La note conserve l’expression proche de la source tout en expliquant l’idiome dans un français clair, sans expliciter une exclusion absolue des autres lignées.
lexical_decisions:
- source_word: ወባረክናሁ
  choice: Nous l’avons béni
  rationale: Rend directement le verbe sémitique « bénir » et conserve le sujet angélique pluriel du contexte.
- source_word: ወዜነውናሁ
  choice: et lui avons annoncé
  rationale: Le verbe signifie faire savoir ou annoncer ; « annoncé » convient au registre narratif et prophétique.
- source_word: ኵሎ፡ ዘተአዘዘ፡ ሎቱ
  choice: tout ce qui avait été décrété à son sujet
  rationale: Préserve l’idée d’une décision ordonnée d’avance sans préciser indûment qui l’a inscrite ou promulguée.
- source_word: ስድስተ፡ ውሉደ
  choice: encore six fils
  rationale: Le contexte vise les six fils qu’Abraham engendrera encore ; « fils » rend ici naturellement le pluriel désignant ses enfants mâles.
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: et de les avoir vus avant sa mort
  rationale: L’objet implicite renvoie aux six fils immédiatement mentionnés ; il ne faut pas ajouter « les fils d’Isaac ».
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: mais c’est en Isaac que son nom et sa descendance seraient appelés
  rationale: Conserve la formulation sémitique et son ambiguïté quant à la portée exacte de « nom » et de « descendance ».
theological_decisions:
- issue: Portée de l’élection associée à Isaac
  choice: Conserver « c’est en Isaac que son nom et sa descendance seraient appelés »
  alternative: 'Expliciter : « seule la lignée d’Isaac porterait son nom »'
  rationale: Le texte associe l’appel du nom et de la descendance à Isaac, mais ne formule pas explicitement l’exclusion absolue de toute autre lignée ; l’explicitation résoudrait une tension que la source laisse subsister.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe prophétique est conservée tout en étant allégée par les deux-points. Le pronom « les » reprend sans ajout les six fils mentionnés.
