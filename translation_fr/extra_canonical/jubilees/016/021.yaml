  text: près de l’autel qu’il avait bâti au Puits du Serment. Et il construisit des huttes pour lui-même et pour ses serviteurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐላ
  choice: Serment
  rationale: Le nom signifie « serment »; « Puits du Serment » restitue le toponyme de façon intelligible en français.
- source_word: ምጽላላተ
  choice: huttes
  rationale: Le terme désigne des abris ou cabanes temporaires; « huttes » convient ici et maintient le lien avec la fête des Huttes sans ajouter au texte fourni la suite absente du verset.
- source_word: አግብርቲሁ
  choice: ses serviteurs
  rationale: Rend le pluriel possessif désignant les personnes à son service, dans un registre biblique naturel.
theological_decisions:
- issue: Fragment initial et délimitation du verset
  choice: Conserver l’ouverture fragmentaire « près de l’autel »
  alternative: Importer la proposition précédente sur la fête de réjouissance
  rationale: Le témoin guèze fourni commence par un complément dépendant du contexte antérieur. Ajouter la proposition du verset précédent corrigerait la syntaxe aux dépens de la délimitation et du texte source transmis.
- issue: Fin traditionnellement attribuée au verset
  choice: Ne traduire que le texte guèze fourni
  alternative: Ajouter la phrase sur la fête des Huttes et sa première célébration sur terre
  rationale: Cette phrase est signalée par la révision comme absente de l’extrait source fourni; elle ne peut donc pas être intégrée à cette traduction sans preuve textuelle incluse dans la demande.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe initialement fragmentaire est volontairement préservée parce que l’extrait guèze commence au milieu d’une phrase. « Puis » rend naturellement la coordination narrative sans créer de contenu nouveau.
