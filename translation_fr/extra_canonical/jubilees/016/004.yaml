  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
translation:
  language: fr
  text: Et son nom, Isaac, fut inscrit sur les tablettes célestes. Lorsque nous revînmes auprès d’elle au moment fixé, elle conçut et mit au monde un fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽሑፍ፡ ስሙ
  choice: son nom fut inscrit
  rationale: Le passif et le possessif de ስሙ (« son nom ») sont conservés dans une formulation française naturelle.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Cette expression rend directement l’image des « tablettes du ciel » tout en suivant l’usage français courant dans le livre des Jubilés.
- source_word: ገባእነ
  choice: nous revînmes
  rationale: Le verbe exprime ici le retour plutôt qu’une simple venue, en accord avec le contexte de la promesse faite à Sara.
- source_word: በጊዜ፡ ሰዓት
  choice: au moment fixé
  rationale: La tournure source, littéralement liée au « temps » et à « l’heure », désigne idiomatiquement le moment déterminé d’avance.
theological_decisions:
- issue: Inscription préalable du nom d’Isaac
  choice: « son nom, Isaac, fut inscrit »
  alternative: '« il fut inscrit sur les tablettes célestes : Isaac »'
  rationale: Le texte identifie explicitement le nom inscrit sans préciser davantage la portée théologique de cette inscription; la traduction n’ajoute donc aucune notion de prédestination.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre littéraire du récit sans être archaïque; la syntaxe reste claire pour un lectorat général.
