  text: the covenant that is established forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would conceive a son.
translation:
  language: fr
  text: 'l’alliance établie pour toujours. La sixième année de la quatrième semaine, nous sommes venus auprès d’Abraham, au Puits du Serment, et nous lui sommes apparus, comme nous l’avions dit à Sara : nous reviendrions auprès d’elle, et elle concevrait un fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን
  choice: l’alliance
  rationale: Le terme guèze désigne une alliance ou un pacte; « alliance » est le terme français naturel dans ce contexte biblique.
- source_word: ተሠርዐት
  choice: établie
  rationale: Cette forme passive exprime l’idée de ce qui a été institué ou fixé; « établie » reste précis et idiomatique.
- source_word: ለዓለም
  choice: pour toujours
  rationale: L’expression indique une durée perpétuelle; « pour toujours » est clair en français moderne.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Puits du Serment
  rationale: Traduction du nom descriptif, en conservant son lien avec le serment prêté dans le récit.
- source_word: ወአስተርአይናሁ
  choice: et nous lui sommes apparus
  rationale: La forme verbale exprime le fait de se montrer ou d’apparaître à Abraham.
- source_word: ንገብአ፡ ኀቤሃ
  choice: nous reviendrions auprès d’elle
  rationale: Le retour est orienté vers Sara; le conditionnel français convient au discours indirect après un verbe au passé.
theological_decisions:
- issue: Nature et durée de l’alliance
  choice: « l’alliance établie pour toujours »
  alternative: « l’alliance ordonnée pour l’éternité »
  rationale: La formulation retenue rend l’institution durable de l’alliance sans introduire une nuance doctrinale supplémentaire.
- issue: Dernière proposition concernant Sara
  choice: « elle concevrait un fils »
  alternative: « elle aurait conçu un fils »
  rationale: Le contexte annonce une conception future; le conditionnel présent rend cette valeur sans transformer l’annonce en action déjà accomplie.
translation_notes:
  register: Français international moderne, digne et lisible. Le verset commence comme la continuation syntaxique du verset précédent. La chronologie en semaines est conservée littéralement, conformément au système propre au livre des Jubilés.
