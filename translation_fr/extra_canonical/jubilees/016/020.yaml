  register: 'Français international moderne, clair et digne. Les deux propositions principales sont séparées pour éviter une phrase excessivement longue, sans modifier leur enchaînement. L’imparfait implicite possible de l’anglais de consultation n’est pas retenu : les formes verbales guèzes sont rendues naturellement comme des actions accomplies dans le récit.'
