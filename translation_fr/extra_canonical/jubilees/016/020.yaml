  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: fr
  text: Il bâtit là un autel à Yahvé, qui l’avait délivré et l’avait réjoui dans le pays où il séjournait. En ce mois, il célébra pendant sept jours une fête de joie près de l’autel qu’il avait bâti au Puits du Serment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à Beer-Shéba »; le nom signifie « Puits du Serment ».'
    reason: Le texte guèze traduit littéralement le toponyme plutôt que de le translittérer.
lexical_decisions:
- source_word: ምሥዋዐ ፡ ለእግዚአብሔር
  choice: un autel à Yahvé
  rationale: « Autel » rend directement ምሥዋዕ, tandis que le nom divin est rendu par « Yahvé », conformément au contexte et à la couche de consultation auditée.
- source_word: ፈላስነቱ
  choice: où il séjournait
  rationale: Cette formulation naturelle exprime le séjour temporaire d’Abraham comme résident étranger, sans suggérer nécessairement un exil forcé ni une errance sans demeure.
- source_word: ገብረ ፡ በዓለ ፡ ትፍሥሕት
  choice: il célébra […] une fête de joie
  rationale: Le verbe littéral « faire » prend ici le sens idiomatique de célébrer une fête; « fête de joie » conserve la répétition sémantique de la source.
- source_word: በዐዘቅተ ፡ መሐላ
  choice: au Puits du Serment
  rationale: Rend le sens littéral de l’expression guèze, calque du nom hébreu Beer-Shéba, tout en préservant sa portée narrative.
