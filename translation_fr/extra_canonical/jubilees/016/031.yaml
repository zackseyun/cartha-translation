  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: fr
  text: Abraham prit des branches de palmier et des fruits de beaux arbres. Chaque jour, il faisait sept fois le tour de l’autel avec les branches ; et le matin, il louait son Dieu et lui rendait grâce pour tout, avec joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ፀበርት
  choice: des branches de palmier
  rationale: Cette expression désigne ici des rameaux ou branches de palmier ; « branches de palmier » est clair et naturel en français.
- source_word: ፍሬ፡ ዕፀ፡ ሠናይ
  choice: des fruits de beaux arbres
  rationale: Rendu formel de l’expression guèze, sans préciser une espèce d’arbre que le texte ne nomme pas.
- source_word: የዐውድ፡ ምሥዋዐ
  choice: il faisait … le tour de l’autel
  rationale: Exprime naturellement l’action répétée de tourner autour de l’autel.
- source_word: ይሴብሕ፡ ወይጌኒ
  choice: il louait … et lui rendait grâce
  rationale: Conserve les deux actes distincts de louange et d’action de grâce.
- source_word: በፍሥሓ
  choice: avec joie
  rationale: Formulation idiomatique correspondant au sens adverbial de l’expression.
