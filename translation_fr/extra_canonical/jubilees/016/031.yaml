translation_notes:
  register: Français international moderne, fluide et digne. La répétition quotidienne est conservée sans ajouter « chaque jour » après « sept fois ». Le possessif de « son Dieu » reste fidèle au texte, et le pronom « lui » rend explicite en français le destinataire de l’action de grâce.
