  text: Sara rit, parce qu’elle avait entendu que nous avions parlé avec Abraham de cette parole, et nous la reprîmes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስሐቀት
  choice: rit
  rationale: Rend directement le parfait du verbe « rire » dans un français naturel.
- source_word: እስመ
  choice: parce que
  rationale: Conserve ici la valeur causale de la conjonction, plutôt qu’une simple valeur temporelle.
- source_word: ተናገርነ፡ ዘንተ፡ ቃለ፡ ምስለ፡ አብርሃም
  choice: nous avions adressé cette parole à Abraham
  rationale: Le plus-que-parfait marque naturellement l’antériorité par rapport à ce que Sara avait entendu; « adresser cette parole à » exprime idiomatiquement le fait de parler avec Abraham sans suggérer une simple conversation.
- source_word: ዘለፍናሃ
  choice: nous la reprîmes
  rationale: « Reprendre » transmet l’idée de réprimande ou de correction, dans un registre digne mais courant.
theological_decisions:
- issue: Identité du « nous »
  choice: Maintien du pluriel « nous » sans explicitation
  alternative: Identifier les locuteurs comme des anges ou comme Dieu accompagné d’anges
  rationale: Le verset ne précise pas lui-même le référent; l’expliciter résoudrait une ambiguïté narrative que la source conserve.
