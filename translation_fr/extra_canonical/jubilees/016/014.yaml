  text: Abraham circoncit son fils le huitième jour ; il fut le premier à être circoncis conformément à l’ordonnance établie pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከበቦ አብርሃም ለወልዱ
  choice: Abraham circoncit son fils
  rationale: Rend directement le verbe de circoncision, avec Abraham comme sujet et « son fils » comme complément.
- source_word: እመ ሳምንት
  choice: le huitième jour
  rationale: Expression idiomatique française correspondant au moment prescrit de la circoncision.
- source_word: ውእቱ ቀዳሚ ተከበበ
  choice: il fut le premier à être circoncis
  rationale: Conserve l’affirmation et la voix passive du texte source.
- source_word: በከመ ሥርዓት ዘተሠርዓ ለዘለዓለም
  choice: conformément à l’ordonnance établie pour toujours
  rationale: Le syntagme complet attesté dans l’édition poursuit l’extrait fourni après በከመ ; cette traduction préserve à la fois l’idée de conformité, le décret établi et sa permanence.
theological_decisions:
- issue: Portée temporelle de l’ordonnance
  choice: pour toujours
  alternative: à jamais
  rationale: « Pour toujours » exprime sans atténuation la permanence affirmée par ለዘለዓለም, sans ajouter d’interprétation sur son application théologique.
translation_notes:
  register: Français moderne, clair et digne. Le point-virgule maintient le lien étroit entre l’acte d’Abraham et l’affirmation qui suit. Le mot « Isaac » placé au début de l’extrait guèze semble appartenir à la fin du contexte précédent selon la délimitation verset par verset retenue ; il n’est donc pas répété ici.
