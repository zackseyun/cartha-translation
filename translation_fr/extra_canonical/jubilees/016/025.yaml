  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: fr
  text: Il célébra cette fête pendant sept jours, se réjouissant de tout son cœur et de toute son âme, lui et tous ceux qui étaient dans sa maison. Il n’y avait avec lui aucun étranger ni aucun incirconcis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ዘንተ፡ በዓለ
  choice: célébra cette fête
  rationale: Littéralement « fit cette fête » ; « célébra » exprime naturellement en français l’accomplissement rituel d’une fête.
- source_word: ሰቡዐ፡ መዋዕለ
  choice: pendant sept jours
  rationale: Rend directement la durée indiquée par le texte guèze.
- source_word: እንዘ፡ ይትፌሣሕ
  choice: se réjouissant
  rationale: Conserve la construction circonstancielle et le sens de joie festive.
- source_word: በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ
  choice: de tout son cœur et de toute son âme
  rationale: Formulation française claire et formellement proche du parallélisme de la source.
- source_word: እለ፡ ውስተ፡ ቤቱ
  choice: ceux qui étaient dans sa maison
  rationale: Préserve le sens collectif du foyer sans le réduire à la seule famille biologique.
theological_decisions:
- issue: Identité des personnes exclues de la célébration
  choice: aucun étranger ni aucun incirconcis
  alternative: aucun homme d’une autre nation ni aucun homme non circoncis
  rationale: La formulation retenue conserve les deux catégories distinctes attestées par la tradition textuelle, sans les interpréter ni les fusionner.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « tout son cœur et toute son âme » est maintenue pour préserver le parallélisme et l’intensité du texte.
