  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
translation:
  language: fr
  text: afin d’expier par lui le péché, pour lui-même et pour sa descendance. Pour un sacrifice de bien-être, il offrit sept béliers, sept chevreaux, sept moutons et sept boucs[a], avec leurs offrandes de céréales et leurs libations. Il fit fumer toute leur graisse sur l’autel, comme une offrande de choix pour le Seigneur, au parfum agréable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture : « sept taureaux, sept béliers, sept moutons et sept boucs »'
    reason: Préserve la variante signalée dans la piste d’audit anglaise concernant l’identification de la liste des animaux.
lexical_decisions:
- source_word: ያስተስሪ፡ ቦቱ
  choice: obtenir par lui l’expiation
  rationale: Rend à la fois l’idée d’expiation et le pronom instrumental « par lui/par cela », tout en restant naturel en français.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: Le terme désigne ici la postérité; « descendance » est clair et digne en français moderne.
- source_word: መሥዋዕተ፡ መድኀኒት
  choice: sacrifice de communion
  rationale: Expression sacrificielle apparentée à une offrande de salut ou de bien-être; « communion » préserve sa dimension relationnelle sans la réduire à la santé physique.
- source_word: አብሐኩ
  choice: béliers
  rationale: Suit l’identification lexicale du nom animal dans cette liste, sans importer la lecture « taureaux » suggérée par d’autres listes sacrificielles.
- source_word: መሐስአ
  choice: chevreaux
  rationale: Rend le deuxième groupe d’animaux par de jeunes caprins conformément à l’analyse lexicale fournie.
- source_word: ቍጻጼቶሙ
  choice: offrandes de vin
  rationale: Rend idiomatiquement les libations associées aux sacrifices; le vin est implicite dans l’usage cultuel.
- source_word: የዐጥን
  choice: fit fumer
  rationale: Le verbe sacrificiel évoque la combustion produisant de la fumée; cette formulation est plus précise que le simple « brûla ».
- source_word: ጽንሓሐ፡ ኅሩየ
  choice: d’une odeur qui lui était agréable
  rationale: Rend naturellement en français la formule cultuelle de l’arôme choisi ou agréé.
theological_decisions:
- issue: Rapport entre le sacrifice et l’expiation
  choice: « obtenir par lui l’expiation du péché »
  alternative: « expier par lui le péché »
  rationale: La formulation conserve l’instrument exprimé par ቦቱ et évite de préciser au-delà du texte le mécanisme théologique de l’expiation.
- issue: Sens de l’offrande dite መድኀኒት
  choice: « sacrifice de communion »
  alternative: « sacrifice de bien-être » ou « sacrifice de salut »
  rationale: Le terme peut évoquer salut, paix ou bien-être; « communion » est une désignation cultuelle française intelligible qui ne tranche pas en faveur d’une lecture exclusivement physique ou sotériologique.
- issue: Destinataire de l’odeur agréable
  choice: « qui lui était agréable »
  alternative: « d’une odeur agréable »
  rationale: Le pronom renvoie au Seigneur nommé dans la proposition et explicite seulement le rapport grammatical, sans ajouter une doctrine de l’acceptation sacrificielle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase commence comme la continuation syntaxique du verset précédent. Les termes sacrificiels sont rendus de façon cohérente et sans archaïsmes inutiles.
