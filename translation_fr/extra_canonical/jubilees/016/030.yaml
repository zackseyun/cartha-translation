base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/030.yaml
  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
translation:
  language: fr
  text: 'C’est une prescription perpétuelle pour toutes leurs générations, année après année. Aucune limite de jours ne lui est fixée, car elle est établie à jamais pour Israël : ils doivent la célébrer, habiter dans des huttes, porter des couronnes sur leurs têtes et prendre des rameaux feuillus et des branches de saule.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም
  choice: une prescription perpétuelle
  rationale: « Prescription » rend le sens normatif de ሕግ, tandis que « perpétuelle » exprime naturellement la durée indiquée par ዘለዓለም.
- source_word: በትውልዶሙ፡ በኵሉ፡ ዓመት፡ ወዓመት
  choice: pour leurs générations, année après année
  rationale: Cette formulation conserve à la fois la succession des générations et la répétition annuelle explicites dans le texte.
- source_word: ምጽላል
  choice: huttes
  rationale: Dans le contexte de la fête, le terme désigne des abris temporaires ou huttes; « huttes » reste clair et traditionnel sans ajouter de précision absente du texte.
- source_word: አክሊላተ
  choice: couronnes
  rationale: Traduction directe du pluriel désignant des couronnes portées sur la tête.
- source_word: ዐጽቀ፡ ቈጽል
  choice: rameaux feuillus
  rationale: Rend l’association d’un élément ligneux ou rameau avec le feuillage sans harmonisation supplémentaire.
- source_word: ውኩሓ
  choice: branches de saule
  rationale: Le mot désigne des saules; « branches de saule » s’accorde naturellement avec le verbe « prendre » et n’ajoute pas la mention d’un ruisseau, absente du guèze.
theological_decisions:
- issue: Portée temporelle de la prescription
  choice: Aucune limite de jours ne lui est fixée
  alternative: Elle n’a pas de fin
  rationale: La formulation retenue suit de près l’expression concrète « limite de jours » et évite d’en réduire la portée à une paraphrase interprétative.
- issue: Valeur de ላዕለ፡ እስራኤል
  choice: établie pour toujours pour Israël
  alternative: imposée pour toujours à Israël
  rationale: « Pour Israël » préserve une certaine neutralité entre destination et obligation, alors que « imposée à » durcirait inutilement la nuance.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement réorganisée pour être naturelle, tout en conservant la répétition annuelle, la formule inhabituelle de la « limite de jours » et la liste rituelle. Aucune harmonisation avec Lévitique 23.40 (« du torrent ») n’a été introduite.
