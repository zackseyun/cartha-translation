  to: 'C’est une prescription perpétuelle pour toutes leurs générations, année après année. Aucune limite de jours ne lui est fixée, car elle est établie à jamais pour Israël : ils doivent la célébrer, habiter dans des huttes, porter des couronnes sur leurs têtes et prendre des rameaux feuillus et des branches de saule.'
