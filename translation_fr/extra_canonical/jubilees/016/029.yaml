  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: fr
  text: C’est pourquoi il est prescrit sur les tablettes célestes, au sujet d’Israël, qu’ils célèbrent avec joie la fête des Tentes pendant sept jours, au septième mois, fête qui est agréée devant le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: il est prescrit
  rationale: Le verbe exprime ici une disposition établie ou ordonnée; « il est prescrit » restitue naturellement sa portée normative.
- source_word: ጽላተ፡ ሰማይ
  choice: les tables célestes
  rationale: Traduction directe de l’expression désignant les tablettes célestes sur lesquelles les ordonnances sont inscrites.
- source_word: በዓለ፡ መጸለት
  choice: la fête des Tentes
  rationale: Littéralement, la fête des abris ou huttes; « fête des Tentes » est une désignation française claire et courante.
- source_word: ሰቡዐ፡ መዋዕለ
  choice: pendant sept jours
  rationale: Rend explicitement et idiomatiquement la durée de la célébration.
- source_word: በፍሥሓ
  choice: avec joie
  rationale: Correspond au sens de joie, allégresse ou réjouissance.
- source_word: ዘይትወከፍ፡ በቅድመ፡ እግዚአብሔር
  choice: afin d’être agréés devant le Seigneur
  rationale: Le verbe est au relatif et porte l’idée d’être reçu ou accepté; la formulation française conserve la relation à l’observance précédente.
theological_decisions:
- issue: Portée de l’acceptation devant le Seigneur
  choice: afin d’être agréés devant le Seigneur
  alternative: une célébration agréée devant le Seigneur
  rationale: La formulation retenue préserve l’orientation verbale vers les célébrants sans préciser davantage la nature théologique de cet agrément.
translation_notes:
  register: Français moderne, digne et accessible. « Fête des Tentes » est préféré à « fête des Huttes » ou au terme confessionnel « Souccot ». La syntaxe garde la solennité de l’ordonnance tout en restant naturelle.
