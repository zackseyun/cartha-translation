  - severity: low
    issue: « tables célestes » est imprécis en français.
    rationale: Dans ce contexte scripturaire, « tablettes célestes » désigne plus clairement les tablettes sur lesquelles l’ordonnance est inscrite et correspond à l’usage établi.
