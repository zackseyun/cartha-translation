base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/016.yaml
  text: And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, and we announced to him all the things which he had spoken concerning him, that he would surely do them.
translation:
  language: fr
  text: 'Nous revînmes au septième mois et trouvâmes Sara enceinte. Nous bénîmes Abraham et lui fîmes connaître tout ce qui lui avait été ordonné : il ne mourrait pas avant d’avoir engendré six fils et de les avoir vus de son vivant ; mais c’est en Isaac que son nom et sa descendance seraient perpétués.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mais en Isaac son nom et sa descendance seront appelés ».'
    reason: La tournure source est un idiome de filiation et de continuité de la lignée ; la note en préserve la forme littérale.
lexical_decisions:
- source_word: ወተመየጥነ፡ በወርኅ፡ ሳብዕ
  choice: Nous revînmes au septième mois
  rationale: Rend directement le retour des messagers et l’indication temporelle du texte guèze.
- source_word: ወረከብናሃ፡ ለሳራ፡ ፀንሰተ፡ ቅድሜነ
  choice: et trouvâmes Sara enceinte, comme nous l’avions annoncé
  rationale: Le sens général est que les messagers trouvent Sara enceinte conformément à leur annonce antérieure. La formulation française explicite naturellement cette relation sans reprendre littéralement l’expression guèze difficile « devant nous ».
- source_word: ወባረክናሁ፡ ወዜነውናሁ
  choice: Nous bénîmes Abraham et lui fîmes connaître
  rationale: Les suffixes masculins renvoient naturellement à Abraham, destinataire de l’annonce dans le contexte immédiat.
- source_word: ኵሎ፡ ዘተአዘዘ፡ ሎቱ
  choice: tout ce qui avait été décrété à son sujet
  rationale: Le passif exprime ce qui a été ordonné ou fixé pour Abraham ; « décrété » conserve la force du propos sans identifier explicitement l’agent.
- source_word: ከመ፡ ኢይመውት፡ እስከ፡ ይወልድ፡ ስድስተ፡ ውሉደ
  choice: il ne mourrait pas avant d’avoir encore engendré six fils
  rationale: Rend la limite temporelle et le nombre précis ; « encore » reflète que ces six fils s’ajoutent aux fils déjà nés.
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: mais c’est en Isaac que son nom et sa descendance seraient perpétués
  rationale: « Être appelé » est ici une formule de continuité du nom et de la lignée ; « seraient perpétués » en donne le sens idiomatique tout en conservant l’accent exclusif sur Isaac.
theological_decisions:
- issue: Référent de l’objet dans « nous le bénîmes » et « nous lui annonçâmes »
  choice: Abraham
  alternative: le Seigneur
  rationale: Les suffixes masculins successifs et le contexte de l’annonce adressée à Abraham favorisent Abraham. Traduire « nous bénîmes le Seigneur » perturberait la chaîne référentielle et ne correspondrait pas à la suite du texte.
- issue: Portée de la promesse concernant Isaac
  choice: Le nom et la descendance d’Abraham sont perpétués en Isaac
  alternative: Son nom et sa descendance seraient appelés en Isaac
  rationale: La traduction choisie communique l’idiome de filiation sans développer une doctrine confessionnelle ni supprimer la distinction entre les autres fils d’Abraham et la lignée rattachée à Isaac.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset est traduit dans son intégralité d’après le texte guèze fourni, y compris les précisions sur les six fils et sur Isaac, absentes de la couche anglaise de consultation. Les pronoms ont été désambiguïsés seulement là où le contexte l’exige pour une lecture naturelle.
