  text: He overthrew it. And he and his daughters also committed sin upon the earth, such as had not been on the earth.
translation:
  language: fr
  text: Il la renversa. Lui et ses filles commirent aussi, sur la terre, un péché tel qu’il n’y en avait encore jamais eu sur la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Lui aussi commit sur la terre un péché, ainsi que ses filles, tel qu’il n’y en avait encore jamais eu sur la terre. »'
    reason: La syntaxe guèze permet de rattacher séparément « aussi » à l’homme puis à ses filles, plutôt que de former directement un sujet coordonné.
lexical_decisions:
- source_word: ገፍታአ
  choice: Il la renversa
  rationale: Le verbe exprime ici le renversement ou la destruction et son complément pronominal renvoie au lieu mentionné dans le contexte précédent; la tournure française conserve ce lien sans répéter l’antécédent.
- source_word: ኀጢአተ
  choice: un péché
  rationale: Le nom désigne une faute ou un péché; « un péché » convient au registre religieux du passage tout en restant courant.
- source_word: ዲበ ምድር
  choice: sur la terre
  rationale: Rend directement la préposition et le nom, y compris leur répétition emphatique dans la proposition comparative.
- source_word: ዘአኮ ዲበ ምድር
  choice: tel qu’il n’y en avait encore jamais eu sur la terre
  rationale: Formulation française naturelle de l’idée littérale « qui n’était pas sur la terre »; « encore jamais » explicite la valeur temporelle impliquée par la comparaison sans préciser la nature du péché.
theological_decisions:
- issue: Répartition grammaticale de la faute entre l’homme et ses filles
  choice: « Lui et ses filles commirent aussi […] un péché »
  alternative: « Lui aussi commit […] un péché, ainsi que ses filles »
  rationale: La coordination du sujet est la lecture française la plus naturelle, mais la succession des particules peut aussi se rattacher séparément à l’homme et à ses filles; l’autre analyse est donc signalée en note sans modifier la responsabilité commune.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « sur la terre » est conservée parce qu’elle appartient à l’emphase du texte source. Le passé simple maintient un registre narratif digne sans archaïsme lexical.
