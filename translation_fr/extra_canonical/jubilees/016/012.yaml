  text: From there he moved and dwelt by the Well of the Oath. And in the middle of the sixth month the Lord visited Sarah
translation:
  language: fr
  text: De là, il s’établit près du Puits du Serment. Au milieu du sixième mois, le Seigneur visita Sara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: De là
  rationale: Rend directement l’indication de provenance et assure la continuité narrative.
- source_word: ወኀደረ
  choice: il partit et s’établit
  rationale: Dans ce contexte de déplacement puis de résidence, cette formulation française naturelle exprime l’installation indiquée par le verbe, en lien avec « De là ».
- source_word: ኀበ፡ ዐዘቅት፡ መሐላ
  choice: près du Puits du Serment
  rationale: Rend le toponyme littéralement et évite la confusion avec le Chêne de Mamré.
- source_word: ወበመንፈቀ፡ ወርኅ፡ ሳድስ
  choice: Au milieu du sixième mois
  rationale: Reproduction claire et formellement fidèle de l’indication temporelle.
- source_word: ሐወጻ
  choice: intervint en faveur de
  rationale: Le verbe de visitation divine implique ici une action bienveillante envers Sara; cette formulation reste naturelle en français sans réduire le sens à une simple visite.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et digne du titre divin guèze.
theological_decisions:
- issue: Sens de la visitation divine envers Sara
  choice: le Seigneur intervint en faveur de Sara
  alternative: le Seigneur visita Sara
  rationale: « Intervint en faveur de » communique la portée effective et bienveillante de la visitation dans ce contexte, tandis que « visita » risquerait d’évoquer en français moderne une simple rencontre sociale.
translation_notes:
  register: Français international moderne, narratif et digne. Le toponyme est traduit littéralement; aucune note n’est nécessaire puisque le guèze soutient « Puits du Serment » et non « Chêne de Mamré ».
