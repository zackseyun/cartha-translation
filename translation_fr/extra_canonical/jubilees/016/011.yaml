  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: fr
  text: Il habita entre Qadesh et Shour, dans les montagnes de Guérar. Au milieu du cinquième mois, il partit de là et s’établit au Puits du Serment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Beer-Shéba.
    reason: Identifie le nom géographique couramment connu derrière l’expression « Puits du Serment ».
lexical_decisions:
- source_word: ኀደረ (ḫadara)
  choice: habita / s’établit
  rationale: Le verbe exprime le fait de demeurer ou de s’installer. La variation française évite une répétition pesante tout en conservant le même sens.
- source_word: ማእከለ (maʾkala)
  choice: entre
  rationale: Avec Qadesh et Shour, le terme indique une position située entre deux lieux.
- source_word: አደባረ (ʾadbara)
  choice: montagnes
  rationale: Le pluriel guèze désigne des montagnes ou une région montagneuse; le pluriel concret est conservé.
- source_word: በመንፈቀ ወርኅ ኃምስ
  choice: au milieu du cinquième mois
  rationale: 'Rend directement l’expression temporelle guèze: à la moitié ou au milieu du cinquième mois.'
- source_word: Well of the Oath (consultation text; continuation not fully legible in the supplied Geʽez excerpt)
  choice: Puits du Serment
  rationale: Traduit le sens traditionnel du toponyme Beer-Shéba au lieu de le remplacer silencieusement par sa forme translittérée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des graphies françaises usuelles. La première phrase est traduite directement du texte guèze fourni; pour la fin du verset, dont l’extrait guèze transmis paraît tronqué ou altéré après « cinquième mois », la couche anglaise auditée sert de témoin de consultation.
