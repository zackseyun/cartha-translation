base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
translation:
  language: fr
  text: 'Elle conçut un fils. En ce mois-là, le Seigneur exécuta son jugement contre Sodome, Gomorrhe, Adma[a] et toute la région du Jourdain. Il les brûla avec du feu et du soufre et les détruisit jusqu’à ce jour, comme je viens de te faire connaître toutes leurs actions : ils étaient extrêmement pervers et pécheurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze porte « Dom », peut-être une forme altérée du nom « Adma ».
    reason: Signaler explicitement la leçon du texte source et l’incertitude de son identification, tout en conservant « Adma » comme identification probable dans le corps du texte.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Elle conçut un fils
  rationale: Rend explicitement la proposition initiale du texte guèze, absente de certaines traditions de traduction.
- source_word: ወለዶም
  choice: Adma[a]
  rationale: Le guèze porte « Dom », vraisemblablement une forme textuellement altérée du nom d’Adma; « Tsoar » ne convient ni lexicalement ni au récit, puisque cette ville fut épargnée.
- source_word: ለኵሉ፡ አደያመ፡ ዮርዳኖስ
  choice: toutes les plaines du Jourdain
  rationale: « Plaines » conserve l’image géographique du bassin ou district du Jourdain et le pluriel du texte.
- source_word: ወአውዐዮሙ፡ በእሳት፡ ወበተይ
  choice: Il les embrasa par le feu et le soufre
  rationale: Formulation française naturelle qui maintient les deux moyens de destruction nommés par le texte.
- source_word: ናሁ፡ አይዳዐኩ፡ ኵሎ፡ ምግባሮሙ
  choice: je viens de te faire connaître toutes leurs actions
  rationale: Rend à la fois l’idée temporelle de « maintenant/voici » et le verbe de déclaration ou de révélation, sans les omettre.
- source_word: ፀዋጋን፡ ወኃጥኣን፡ ጥቀ
  choice: extrêmement pervers et pécheurs
  rationale: Conserve les deux qualifications morales ainsi que l’intensif final.
theological_decisions:
- issue: Rapport entre la révélation des actions et le jugement moral porté sur les habitants
  choice: 'comme je viens de te faire connaître toutes leurs actions : ils étaient extrêmement pervers et pécheurs'
  alternative: selon toutes leurs actions, parce qu’ils étaient entièrement sans loi et pécheurs
  rationale: Le texte contient explicitement un verbe à la première personne signifiant « je t’ai fait connaître » ainsi qu’un marqueur de présent. Les deux-points préservent le lien quelque peu tendu entre la déclaration de leurs actions et leur qualification morale sans imposer une relation causale absente.
translation_notes:
  register: Français international moderne, digne et lisible. « Exécuta son jugement » conserve la dimension judiciaire; « jusqu’à ce jour » maintient la formule temporelle du texte source. Le pronom singulier « te » suit l’adresse individuelle du guèze.
