  text: And she was afraid and denied that she had laughed because of the word. And we told her the name of her son, as it had been ordained.
translation:
  language: fr
  text: Elle eut peur et nia avoir ri à cause de la parole. Et nous lui fîmes connaître le nom de son fils, comme cela avait été établi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርት
  choice: eut peur
  rationale: Rend directement le verbe éthiopien exprimant la peur, dans un français narratif naturel.
- source_word: ሐሰወት
  choice: nia
  rationale: Dans ce contexte, le verbe signifie qu’elle déclara faussement ne pas avoir ri, d’où le français idiomatique « nia ».
- source_word: በእንተ፡ ቃል
  choice: à cause de cette parole
  rationale: Préserve le lien causal exprimé par la préposition et garde « parole » pour ቃል, sans préciser davantage le référent.
- source_word: ነገርናሃ
  choice: nous lui indiquâmes
  rationale: Le verbe signifie dire ou faire connaître; « indiquâmes » convient naturellement avec l’objet « le nom » et conserve le sujet pluriel.
- source_word: ሥሩዕ
  choice: fixé
  rationale: Exprime ce qui a été établi, prescrit ou ordonné, sans ajouter explicitement un agent absent du texte.
theological_decisions:
- issue: Référent du pluriel « nous »
  choice: Conserver « nous » sans identifier les locuteurs
  alternative: Identifier les locuteurs comme des anges ou des messagers
  rationale: Le verset emploie la première personne du pluriel, mais n’en précise pas ici l’identité; l’expliciter résoudrait une donnée contextuelle que le texte laisse implicite.
- issue: Agent de ce qui a été fixé
  choice: Employer la tournure impersonnelle « comme cela avait été fixé »
  alternative: « comme Dieu l’avait ordonné »
  rationale: Le texte qualifie le nom comme établi ou ordonné sans nommer explicitement l’agent; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans archaïsmes lexicaux. Aucun marqueur de note n’est requis.
