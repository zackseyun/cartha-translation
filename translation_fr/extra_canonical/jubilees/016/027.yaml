  text: And he blessed and rejoiced, and he called the name of this feast the feast of the Lord, a joy
translation:
  language: fr
  text: Il bénit et se réjouit, et il donna à cette fête le nom de « fête du Seigneur, une joie »[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « fête du Seigneur, joie ».'
    reason: Le guèze termine par le substantif « joie » en apposition, sans préciser davantage son rapport syntaxique avec le nom de la fête.
lexical_decisions:
- source_word: ባረከ
  choice: bénit
  rationale: Rend directement le verbe sémitique « bénir » dans un registre biblique naturel.
- source_word: ተፈሥሐ
  choice: se réjouit
  rationale: Exprime l’action de se réjouir sans réduire le terme à un simple sentiment passager.
- source_word: ጸውዐ፡ ስማ
  choice: donna … le nom de
  rationale: Formulation française naturelle pour l’expression littérale « appela le nom de ».
- source_word: በዓለ፡ እግዚአብሔር
  choice: fête du Seigneur
  rationale: Conserve le titre divin et le rapport génitival du texte source.
- source_word: ፍሥሓ
  choice: joie
  rationale: Conserve le substantif final en apposition, sans lui ajouter un article absent du texte source.
theological_decisions:
- issue: Rapport syntaxique du substantif final « joie » avec le nom de la fête
  choice: 'Le conserver comme une apposition dans l’expression citée : « fête du Seigneur, joie »'
  alternative: « fête du Seigneur, une joie » ou « joyeuse fête du Seigneur »
  rationale: Le texte place « joie » à la fin sans expliciter son rapport syntaxique. L’apposition préserve cette ambiguïté et évite de transformer le substantif en adjectif.
translation_notes:
  register: Français moderne, digne et lisible. La tournure « donna à cette fête le nom de » évite le calque maladroit « appela le nom », tandis que l’expression citée conserve l’apposition abrupte et l’ambiguïté réelle du guèze.
