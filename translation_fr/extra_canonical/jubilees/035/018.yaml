base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/018.yaml
  text: and neither will seek evil against his brother, but only love, so that you may prosper, my sons, and be honored in the midst of the land, and no enemy may rejoice over you, and you may become a blessing and a mercy before the eyes of all who love you.”
translation:
  language: fr
  text: Que ni l’un ni l’autre ne cherche à faire du mal à son frère, mais qu’ils n’aient entre eux que de l’amour, afin que vous prospériez, mes fils, et que vous soyez honorés au milieu du pays ; qu’aucun ennemi ne se réjouisse à vos dépens, et que vous deveniez une bénédiction et une miséricorde aux yeux de tous ceux qui vous aiment. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይኅሥሥ፡ እኩየ
  choice: ne cherche à faire du mal
  rationale: Rend naturellement en français la recherche ou l’intention du mal exprimée par le texte guèze.
- source_word: ተፋቅሮ
  choice: de l’amour
  rationale: Exprime l’amour réciproque demandé aux deux frères.
- source_word: ወትሣረሑ
  choice: afin que vous prospériez
  rationale: Le contexte porte sur le bien-être et la réussite des fils; «prospériez» conserve cette portée sans la réduire à la richesse.
- source_word: በማእከለ፡ ምድር
  choice: au milieu du pays
  rationale: Traduction formellement proche; «pays» est plus idiomatique ici que «terre», tout en laissant ouverte l’étendue géographique.
- source_word: ለበረከት፡ ወለምሕረት
  choice: une source de bénédiction et de miséricorde
  rationale: L’ajout idiomatique «source de» clarifie en français la fonction bénéfique exercée envers ceux qui les aiment, sans identifier les fils à des notions abstraites.
theological_decisions:
- issue: Sens de «bénédiction et miséricorde» appliqué aux frères
  choice: une source de bénédiction et de miséricorde
  alternative: une bénédiction et une miséricorde
  rationale: La formulation retenue évite une identification ontologique maladroite et conserve le sens instrumental ou bénéfique probable du passage.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la forme d’une exhortation maternelle et le parallélisme du texte source, avec une syntaxe légèrement réorganisée pour la clarté.
