  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: fr
  text: 'Il le tuera après ta mort. Et tu sais tout ce qu’il a fait depuis le jour où son frère Jacob est parti pour Harrân jusqu’à aujourd’hui : de tout son cœur, il nous a abandonnés et il a fait…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቅትሎ
  choice: Il le tuera
  rationale: Le verbe est rendu au futur avec son complément pronominal, conformément à la syntaxe du passage.
- source_word: መጠነ፡ ገብረ
  choice: tout ce qu’il a fait
  rationale: La tournure guèze, littéralement proche de « toute la mesure de ce qu’il a fait », est exprimée en français naturel sans perdre l’idée de totalité.
- source_word: ሖረ
  choice: est parti
  rationale: Rend simplement le mouvement vers Harrân; « est allé » serait également possible, mais « est parti » convient au contexte du départ.
- source_word: በኵሉ፡ ልቡ
  choice: de tout son cœur
  rationale: Conserve l’expression idiomatique et son intensité.
- source_word: ኀደገነ
  choice: il nous a abandonnés
  rationale: Le verbe exprime ici le fait de laisser ou d’abandonner; ce choix garde la force relationnelle sans ajouter une nuance confessionnelle.
theological_decisions:
- issue: Référents des pronoms masculins
  choice: Conserver « il » et « le » sans nommer les personnages
  alternative: Expliciter les noms d’Ésaü ou de Jacob
  rationale: Le verset isolé n’explicite pas tous les référents; les nommer résoudrait une ambiguïté que le texte source laisse au contexte.
- issue: Phrase inachevée en fin de verset
  choice: Maintenir « et il a fait… »
  alternative: Compléter la proposition à partir du verset suivant
  rationale: Le texte fourni s’arrête sur le verbe « il a fait »; les points de suspension signalent honnêtement cette continuité sans importer du contenu absent.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est fluide tout en conservant les pronoms ambigus du texte source et la rupture finale du verset.
