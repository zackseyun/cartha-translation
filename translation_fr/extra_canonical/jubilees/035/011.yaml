  yaml_path: translation/extra_canonical/jubilees/035/011.yaml
  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
translation:
  language: fr
  text: 'Il a agi avec méchanceté envers nous : il a rassemblé tes troupeaux et pillé sous tes yeux tous tes biens. Et tandis que nous lui réclamons avec insistance ce qui nous appartient, il se comporte comme s’il nous faisait miséricorde.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩየ፡ መሪዕቶከ
  choice: il a agi avec méchanceté envers nous
  rationale: Rend l’adverbe « méchamment » avec le verbe d’action sous-entendu ou exprimé par le contexte, sans réduire la formule à un simple adjectif.
- source_word: አስተጋብአ፡ ወኵሎ፡ ጥሪትከ
  choice: il a rassemblé tes troupeaux
  rationale: Le verbe causatif évoque le fait de réunir ou rassembler, et ጥሪት désigne ici le bétail ou les troupeaux.
- source_word: ሄደ፡ እምቅድመ፡ ገጽከ
  choice: pillé sous tes yeux tous tes biens
  rationale: En guèze, ሄደ signifie ici « piller, dépouiller », non « aller »; እምቅድመ ገጽከ est rendu idiomatiquement par « sous tes yeux ».
- source_word: ናስተበቍዕ፡ ወንስእሎ
  choice: nous lui réclamons avec insistance
  rationale: Les deux verbes coordonnés expriment une demande pressante; cette formulation française conserve l’intensité sans redondance artificielle.
- source_word: ይሬሲ፡ ከመ፡ ዘብእሲ፡ ዘይምሕረነ
  choice: il se comporte comme s’il nous faisait miséricorde
  rationale: 'Préserve l’ironie de la comparaison : celui qui retient leurs biens prend l’attitude d’un bienfaiteur compatissant.'
theological_decisions:
- issue: Sens de la miséricorde dans la proposition finale
  choice: comme s’il nous faisait miséricorde
  alternative: comme un homme qui a pitié de nous
  rationale: La tournure retenue garde le vocabulaire biblique de la miséricorde et fait entendre l’ironie sans affirmer que sa compassion est réelle.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve l’accusation, le parallélisme des actes et l’ironie finale, tout en évitant une lecture amharique anachronique de ሄደ.
