  yaml_path: translation/extra_canonical/jubilees/035/006.yaml
  text: 'And she said to him, “My son, all my days I have not seen in you any deed of crookedness, but only uprightness. Yet I will tell you the truth, my son: I shall die in this year, and I shall not live beyond this year, for I saw in a dream the day of my death, that I would not live beyond one hundred and fifty-five years.”'
translation:
  language: fr
  text: 'Et elle lui dit : « Mon fils, de toute ma vie, je n’ai vu chez toi aucun acte pervers, mais seulement de la droiture. Pourtant, je vais te dire la vérité, mon fils : je mourrai cette année et je ne vivrai pas au-delà de cette année, car j’ai vu en rêve le jour de ma mort : je ne vivrai pas au-delà de cent cinquante-cinq ans. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ጠዋየ
  choice: action tortueuse
  rationale: Rend littéralement l’idée d’un acte marqué par la torsion morale, tout en restant intelligible en français moderne.
- source_word: ርቱዐ
  choice: droiture
  rationale: Préserve le contraste explicite avec ce qui est tortueux et exprime une conduite moralement droite.
- source_word: ኢይትዐደው፡ ዛተ፡ ዓመተ፡ በሕይወትየ
  choice: je ne vivrai pas au-delà de cette année
  rationale: Formulation française naturelle qui conserve l’idée de ne pas dépasser cette année dans sa vie.
- source_word: ኢየሐዩ፡ ፈድፋደ፡ እምእት፡ ወኃምሳ፡ ወኀምስ
  choice: je ne vivrai pas au-delà de cent cinquante-cinq ans
  rationale: Reproduit la limite d’âge annoncée dans le rêve sans rendre la tournure source artificiellement.
