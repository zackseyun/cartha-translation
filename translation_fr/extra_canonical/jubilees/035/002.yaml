  yaml_path: translation/extra_canonical/jubilees/035/002.yaml
  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: fr
  text: 'Jacob lui dit : « Je ferai tout ce que tu m’as ordonné, car cette affaire sera pour moi un honneur, une grandeur et une justice devant Dieu, afin que je les honore. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: tout ce que tu m’as ordonné
  rationale: Le verbe s’adresse à une femme au singulier et porte un suffixe objet de première personne ; « ordonné » conserve la force du commandement.
- source_word: ዝንቱ ፡ ነገር
  choice: cette démarche
  rationale: Dans ce contexte, « démarche » rend naturellement l’idée de « cette affaire/chose » sans ajouter de contenu provenant du verset précédent.
- source_word: ክብረ ፡ ወዕበየ
  choice: un honneur et une grandeur
  rationale: La formulation maintient les deux substantifs distincts du texte geʿez, malgré le caractère légèrement inhabituel de « grandeur » en français.
- source_word: ወጽድቀ ፡ ቅድመ ፡ እግዚአብሔር
  choice: ainsi qu’un acte de justice devant Dieu
  rationale: « Acte de justice » exprime ici plus naturellement en français la qualité juste de l’action tout en conservant la formule « devant Dieu ».
- source_word: ከመ ፡ አክብሮሙ
  choice: afin que je les honore
  rationale: Cette traduction garde la proposition finale introduite par ከመ et le pronom masculin pluriel, sans préciser l’identité des personnes visées.
theological_decisions:
- issue: Rapport entre la justice devant Dieu et le fait d’honorer les personnes visées
  choice: afin que je les honore
  alternative: en les honorant
  rationale: La proposition finale conserve la relation grammaticale explicite du geʿez et évite de réduire cette relation à une simple explication instrumentale.
translation_notes:
  register: Français moderne, digne et accessible. Le verset est strictement limité à la réponse de Jacob en Jubilés 35:2 ; aucun élément narratif du verset 1 n’est réintroduit.
