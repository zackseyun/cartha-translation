base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/021.yaml
  text: And I myself ask you that you admonish Jacob concerning me and concerning my children, for I know that he will surely reign over me and over my children, because on the day my father blessed him he made him high and me low.
translation:
  language: fr
  text: 'Je te demande aussi d’exhorter Jacob à mon sujet[a] et au sujet de mes enfants, car je sais qu’il régnera certainement sur moi et sur mes enfants : le jour où mon père l’a béni, il l’a élevé et m’a abaissé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en ma faveur et en faveur de mes enfants ».'
    reason: La préposition guèze peut signifier aussi bien « au sujet de » que « en faveur de » dans ce contexte.
lexical_decisions:
- source_word: ትገሥጽዮ (təgaśśəṣiyo)
  choice: d’exhorter
  rationale: Le verbe exprime une admonestation ou une ferme recommandation. « Exhorter » conserve cette force sans imposer l’idée d’une réprimande pour une faute déjà commise.
- source_word: ነጊሠ፡ ይነግሥ (nagiśa yənägəś)
  choice: il régnera certainement
  rationale: La construction associant deux formes de la même racine intensifie ou assure l’action; « certainement » rend cette insistance en français naturel.
- source_word: ረሰየ፡ ልዑለ / ትሑተ (rasaya lə‘ula / təḥuta)
  choice: il l’a élevé et m’a abaissé
  rationale: Cette formulation restitue l’opposition verticale « haut / bas » sous une forme idiomatique, tout en conservant le contraste de rang entre Jacob et Ésaü.
theological_decisions:
- issue: Portée de la domination future de Jacob
  choice: « régnera certainement sur moi et sur mes enfants »
  alternative: « sera certainement roi sur moi et sur mes enfants »
  rationale: Le texte exprime l’exercice futur de la royauté ou de la domination sans préciser une institution politique; le verbe « régner » préserve cette tension sans ajouter un titre royal explicite.
- issue: Sens de la préposition በእንቲአየ / በእንተ
  choice: « à mon sujet et au sujet de mes enfants »
  alternative: « en ma faveur et en faveur de mes enfants »
  rationale: La préposition peut indiquer le sujet concerné ou la personne en faveur de laquelle l’exhortation est faite. Le texte principal retient le sens relationnel le moins interprétatif et la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Exhorter » maintient le ton solennel de la demande d’Ésaü; les formulations plus archaïques comme « admonester » ont été évitées. Le parallélisme final est rendu par les verbes opposés « élevé » et « abaissé ».
