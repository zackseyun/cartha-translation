  text: And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.
translation:
  language: fr
  text: 'La sixième année de cette semaine[a], Isaac appela ses deux fils, Ésaü et Jacob. Ils vinrent auprès de lui, et il leur dit : « Mes fils, je vais prendre le chemin de mes pères, vers la demeure éternelle où se trouvent mes pères. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de cette période de sept ans ».
    reason: Dans la chronologie des Jubilés, le mot traduit par « semaine » désigne une période de sept ans; le démonstratif renvoie à la période en cours.
lexical_decisions:
- source_word: ውስተ፡ ፍኖተ፡ አበውየ
  choice: prendre le chemin de mes pères
  rationale: Reproduit naturellement l’image du départ vers la mort sans la réduire à une simple affirmation comme « je vais mourir ».
- source_word: ውስተ፡ ቤት፡ ዘለዓለም
  choice: vers la demeure éternelle
  rationale: « Demeure » rend ici ቤት de façon idiomatique dans un contexte funéraire, tandis que « éternelle » conserve la portée de ዘለዓለም.
- source_word: ኀበ፡ ሀለዉ፡ ህየ፡ አበውየ
  choice: où se trouvent mes pères
  rationale: Conserve l’affirmation spatiale du texte guèze sans préciser davantage la nature de l’au-delà.
theological_decisions:
- issue: Nature de la « demeure éternelle » et état des ancêtres
  choice: Conserver l’image de la demeure où se trouvent les pères
  alternative: Paraphraser par « la tombe » ou « le séjour des morts »
  rationale: Le texte emploie une formulation imagée et ne nomme pas explicitement la tombe ni le séjour des morts; la traduction préserve donc cette tension eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée du guèze est légèrement allégée, tout en maintenant la solennité du discours d’Isaac et l’imagerie funéraire du texte.
