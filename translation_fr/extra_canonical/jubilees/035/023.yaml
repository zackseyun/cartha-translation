  choice: en présence d’Ésaü
  rationale: Littéralement « devant les yeux d’Ésaü » ; l’expression française naturelle conserve l’idée que l’appel a lieu ouvertement devant lui.
- source_word: ተሐበይኒ
  choice: Crois-moi
  rationale: La forme est comprise à partir de la racine exprimant la foi ou la confiance ; « Crois-moi » convient au contexte de l’engagement solennel et évite l’ancienne lecture erronée « cache-moi ».
- source_word: ኢይወፅእ፡ እምኔየ፡ ወእምውሉድየ፡ እኩይ
  choice: aucun mal ne viendra de moi ni de mes enfants
  rationale: Rend directement l’image source du mal qui « sort » de Jacob ou de ses descendants, dans un français idiomatique.
- source_word: ወኢይቀድም፡ ምንተኒ፡ ዘእንበለ፡ ተፋቅሮ
  choice: et je ne serai le premier en rien, sauf dans l’amour
  rationale: Préserve la première personne et l’idée d’être le premier, sans transformer la proposition en une affirmation impersonnelle.
