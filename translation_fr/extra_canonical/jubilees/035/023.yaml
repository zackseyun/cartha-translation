  text: And she called Jacob before Esau’s eyes and instructed him according to the words that she had spoken with Esau. And he said, “I will do your pleasure. Trust me that no evil may come out from me or from my children against Esau, and I will not be first in anything except in love.”
translation:
  language: fr
  text: 'Elle appela Jacob en présence d’Ésaü et lui donna ses instructions conformément à ce qu’elle avait dit à Ésaü. Jacob répondit : « Je ferai ce que tu désires. Crois-moi : aucun mal ne viendra de moi ni de mes enfants contre Ésaü, et je ne serai le premier en rien, sauf dans l’amour. »'
