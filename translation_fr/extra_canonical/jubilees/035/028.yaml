- source_word: ታፈቅሩ አኅዊክሙ
  choice: aimez-vous les uns les autres
  rationale: Rend naturellement en français l’exhortation réciproque adressée aux fils.
- source_word: ከመ ብእሲ ዘያፈቅር ነፍሶ
  choice: que chacun aime son frère comme sa propre vie
  rationale: « Chacun » exprime la valeur distributive de ብእሲ; ነፍሶ désigne ici sa vie ou sa propre personne, et « sa propre vie » conserve l’image du texte.
- source_word: ወእንዘ የኀሥሥ ብእሲ
  choice: et cherche
  rationale: Le nom ብእሲ est le sujet de « chercher », non son objet. En français, le sujet « chacun » reste naturellement sous-entendu dans la coordination; la proposition se poursuit au verset suivant.
