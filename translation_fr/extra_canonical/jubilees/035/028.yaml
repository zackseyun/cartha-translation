  language: fr
  text: '« Mes fils, aimez-vous les uns les autres : que chacun aime son frère comme sa propre vie, et que chacun cherche[a]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase se poursuit au verset suivant ; littéralement : « et qu’un homme cherche… »'
    reason: Le découpage du verset interrompt la proposition après le verbe, et le sujet explicite ብእሲ (« un homme ») ne doit pas être pris pour son objet.
