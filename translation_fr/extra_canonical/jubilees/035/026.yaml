  text: Bury me near Abraham my father in the double cave in the field of Ephron the Hittite, which Abraham acquired as a burial place there in the land of Canaan. In the tomb which I dug for myself there, bury me.
translation:
  language: fr
  text: Enterrez-moi près d’Abraham, mon père, dans la grotte double, dans le champ d’Éfron le Hittite, qu’Abraham a acquis au pays de Canaan comme lieu de sépulture. Enterrez-moi là, dans le tombeau que j’ai creusé pour moi-même.
