    issue: Direction de l’action divine insuffisamment rendue
    rationale: « Afin que Yahvé accomplisse pour vous » ne reflète pas explicitement le sens de « faire venir sur vous » (ከመ፡ ያምጽእ፡ ... ላዕሌክሙ). La reformulation proposée conserve cette orientation sans modifier le sens.
  revised_text: 'Et voici ce que je vous ordonne, mes fils : pratiquez la justice et la droiture sur la terre, afin que Yahvé fasse venir sur vous tout ce que Yahvé a déclaré qu’il ferait pour Abraham et sa descendance.'
