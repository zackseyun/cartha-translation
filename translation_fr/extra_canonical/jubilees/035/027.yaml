  yaml_path: translation/extra_canonical/jubilees/035/027.yaml
  text: 'And I command you, my sons: do righteousness and uprightness on the earth, so that Yahweh may bring upon you all that Yahweh said he would do for Abraham and for his seed.'
translation:
  language: fr
  text: 'Et voici ce que je vous ordonne, mes fils : pratiquez la justice et la droiture sur la terre, afin que Yahvé fasse venir sur vous tout ce que Yahvé a déclaré qu’il ferait pour Abraham et sa descendance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: la justice et la droiture
  rationale: Le binôme guèze associe la conduite juste à la rectitude; cette formulation française conserve les deux notions sans les confondre.
- source_word: ይገበር
  choice: accomplisse
  rationale: Dans la proposition relative, le verbe signifie littéralement « faire »; « accomplir » rend naturellement l’exécution des paroles promises.
- source_word: ለዘርኡ
  choice: pour sa descendance
  rationale: Le terme « semence » désigne ici collectivement la postérité d’Abraham; « descendance » est clair et naturel en français moderne.
- source_word: እግዚአብሔር
  choice: Yahvé
  rationale: Le titre divin guèze correspond ici, dans la tradition textuelle consultée, au nom divin rendu par « Yahweh » dans la couche anglaise auditée; « Yahvé » est la forme française courante.
theological_decisions:
- issue: Rapport entre la conduite prescrite et l’accomplissement de la promesse
  choice: « afin que Yahvé accomplisse pour vous »
  alternative: « pour que Yahvé fasse venir sur vous »
  rationale: La traduction maintient le lien final exprimé par le texte sans préciser si l’obéissance est une cause méritoire, une condition d’alliance ou le cadre de l’accomplissement.
- issue: Bénéficiaires de la parole faite à Abraham
  choice: « tout ce qu’il a déclaré qu’il ferait pour Abraham et pour sa descendance »
  alternative: « tout ce que Yahvé a dit à Abraham et à sa descendance »
  rationale: La syntaxe source présente Abraham et sa descendance comme bénéficiaires de ce que Dieu ferait; la formulation retenue évite de les transformer en simples destinataires du discours.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif « pratiquez » est idiomatique pour une conduite durable; la répétition du nom divin est allégée par un pronom sans perte de référent.
