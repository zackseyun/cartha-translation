  yaml_path: translation/extra_canonical/jubilees/035/020.yaml
  text: And Jacob my brother—I love him more than all flesh, and I have no brother in all the earth except him alone. And this is no great thing for me, that I should love him, for he is my brother, and together we were sown in your womb, and together we came out from your belly. And if I do not love my brother, whom shall I love?
translation:
  language: fr
  text: 'Quant à Jacob, mon frère, je l’aime plus que toute autre personne. Je n’ai pas d’autre frère sur toute la terre que lui seul. Il n’y a rien d’extraordinaire à ce que je l’aime, puisqu’il est mon frère : ensemble, nous avons été semés dans ton sein, et ensemble, nous sommes sortis de ton ventre. Si je n’aime pas mon frère, qui donc aimerai-je ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥጋ (śəga)
  choice: personne
  rationale: L’expression littérale « toute chair » désigne ici l’ensemble des êtres humains. « Toute autre personne » restitue naturellement le sens comparatif en français moderne.
- source_word: ተዘራእነ (tazaraʾna)
  choice: nous avons été semés
  rationale: La métaphore de l’ensemencement dans le sein maternel est conservée, car elle est concrète, intelligible et propre au texte source.
- source_word: ከርሥኪ (karśəki)
  choice: ton sein
  rationale: Dans ce contexte de conception, le terme renvoie au sein maternel; ce choix garde la dignité du registre sans introduire un vocabulaire médical.
- source_word: ኅንብርትኪ (ḫənbərtəki)
  choice: ton ventre
  rationale: Le terme corporel est rendu directement et naturellement, tout en maintenant le parallélisme entre conception et naissance.
