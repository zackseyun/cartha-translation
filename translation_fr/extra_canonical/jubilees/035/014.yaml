  yaml_path: translation/extra_canonical/jubilees/035/014.yaml
  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
translation:
  language: fr
  text: Et maintenant, mon cœur est troublé à cause de tous ses actes. Ni lui ni sa descendance ne seront sauvés, car ils sont de ceux qui seront détruits de la terre et qui seront déracinés de sous le ciel, parce qu’il a abandonné le Dieu d’Abraham et qu’il a suivi ses femmes et…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሀወክ
  choice: est troublé
  rationale: Rend naturellement l’idée d’un cœur agité ou bouleversé, sans en préciser excessivement la cause émotionnelle.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: Équivalent français courant et digne de « semence » au sens généalogique.
- source_word: ይትሐጐሉ
  choice: disparaîtront
  rationale: Le verbe exprime ici la perdition ou la disparition; ce choix respecte la construction « de la terre » sans introduire une image d’arrachement.
- source_word: ይሤረዉ
  choice: seront déracinés
  rationale: Conserve l’image concrète d’un arrachement et corrige l’inversion verbale relevée dans une version anglaise antérieure.
- source_word: ኀደገ
  choice: a abandonné
  rationale: Dans ce contexte d’infidélité religieuse, « abandonner » restitue mieux la force du verbe que le simple « laisser ».
- source_word: ሖረ፡ ድኅረ
  choice: est allé après
  rationale: Préserve l’expression source et son sens de suivre ou de rechercher, sans expliciter ce que le fragment ne précise pas.
theological_decisions:
- issue: Portée de la condamnation de l’homme et de sa descendance
  choice: Ni lui ni sa descendance ne seront sauvés
  alternative: Il n’y aura de salut ni pour lui ni pour sa descendance
  rationale: La formulation conserve l’affirmation catégorique du texte sans définir la nature ou la durée du salut en question.
- issue: Infidélité envers le Dieu d’Abraham
  choice: le Dieu d’Abraham
  alternative: son Dieu, celui d’Abraham
  rationale: Suit directement le texte guèze et évite d’ajouter une relation possessive non explicitée.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « ce sont eux qui… et qui… » maintient l’insistance du texte. Les points de suspension signalent que la source fournie s’interrompt au milieu de la phrase après le second « après ».
