  text: And you, do not fear for Jacob, for Jacob’s guardian is great and mighty and honored, and more praised than Esau’s guardian.” And Rebekah sent and called Esau, and he came to her. And she said to him, “My son, I ask one request from you; say that you will do it, my son.”
translation:
  language: fr
  text: 'Et toi, ne crains pas pour Jacob, car le gardien de Jacob est grand, puissant et honoré, et il est plus digne de louange que le gardien d’Ésaü. Rébecca envoya appeler Ésaü, qui vint auprès d’elle. Elle lui dit : « Mon fils, je te fais une demande : dis que tu le feras, mon fils. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቃቢሁ (ʿaqābihu)
  choice: le gardien de
  rationale: Rend le nom désignant celui qui garde ou protège, sans préciser davantage l’identité ou la nature de ce gardien.
- source_word: ወአኩት፡ እምዐቃቢሁ፡ ለዔሳው
  choice: et il est plus digne de louange que le gardien d’Ésaü
  rationale: Conserve la valeur comparative et le sens de louange de አኩት, au lieu de l’assimiler à la puissance déjà exprimée par ኃያል.
- source_word: ወለአኮት፡ ርብቃ፡ ወጸውዐተ፡ ለዔሳው
  choice: Rébecca envoya chercher Ésaü et le fit appeler
  rationale: Rend les deux actions coordonnées, « envoyer » et « appeler », et évite de rattacher à tort le terme précédent à une louange prononcée par Rébecca.
- source_word: ስእለት፡ ብየ
  choice: j’ai une demande à te faire
  rationale: Formulation française naturelle pour une requête unique adressée à quelqu’un.
theological_decisions:
- issue: Identité du « gardien » de Jacob et de celui d’Ésaü
  choice: Maintenir le terme général « gardien »
  alternative: Préciser « ange gardien » ou identifier une puissance céleste particulière
  rationale: Le texte parle de gardiens sans expliciter ici leur identité; la traduction ne doit pas résoudre cette ambiguïté théologique.
- issue: Comparaison entre les gardiens
  choice: « plus digne de louange »
  alternative: « plus puissant »
  rationale: Le texte distingue déjà la puissance de la qualité exprimant la louange; traduire les deux par la puissance effacerait cette tension lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « mon fils » est conservée, de même que le terme sobre « gardien », afin de respecter le ton familial et l’ambiguïté du texte source.
