  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: fr
  text: 'Et toi, mon fils, tu connais, depuis le jour de ta naissance jusqu’à aujourd’hui, toute ma conduite et tout ce qui est dans mon cœur : j’aime profondément ton père.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: mon fils
  rationale: Le nom ወልድ (« fils »), assorti du suffixe possessif de première personne, établit clairement que la locutrice s’adresse à son fils.
- source_word: ምግባርየ
  choice: toute ma conduite
  rationale: ምግባር peut désigner les actes ou la conduite dans son ensemble. « Conduite » convient au parallèle entre le comportement extérieur de la locutrice et ce qui se trouve dans son cœur.
- source_word: ዘውስተ ልብየ
  choice: tout ce qui est dans mon cœur
  rationale: Traduction directe et naturelle de l’expression désignant les dispositions intérieures de la locutrice, sans en restreindre la portée aux seules pensées ou émotions.
- source_word: አፈቅሮ
  choice: j’aime
  rationale: Le verbe exprime ici l’amour de la locutrice pour le père de son interlocuteur.
- source_word: ጥቀ
  choice: profondément
  rationale: L’adverbe intensifie fortement le verbe aimer. « Profondément » rend cette intensité dans un français naturel et digne.
