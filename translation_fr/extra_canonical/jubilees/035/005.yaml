lexical_decisions:
- source_word: አክብር
  choice: honorer
  rationale: Rend directement le verbe « honorer, respecter » dans un français naturel et digne.
- source_word: አበየ፡ ወእኅየየ
  choice: mon père et mon frère
  rationale: Le guèze nomme explicitement le père et le frère ; « ma mère » ne correspond pas au texte transmis.
- source_word: ጥውየተ
  choice: perversité
  rationale: Le terme évoque ce qui est tortueux ou moralement dévoyé ; « perversité » conserve cette portée morale sans ajouter une faute précise.
theological_decisions:
- issue: Identification du second proche à honorer
  choice: mon frère
  alternative: ma mère
  rationale: La leçon guèze ወእኅየየ signifie « et mon frère » ; elle doit être maintenue malgré la formule biblique plus familière « père et mère ».
