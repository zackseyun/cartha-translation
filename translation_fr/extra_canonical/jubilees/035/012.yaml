  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: fr
  text: Il est plein d’amertume contre toi parce que tu as béni Jacob, ton fils intègre et droit. En effet, il n’y a en lui aucun mal, mais seulement de la bonté. Depuis le jour où il est venu de Harân jusqu’à aujourd’hui, il ne nous a privés de rien, car chaque jour, tout nous parvient au moment voulu. Il se réjouit de tout son cœur chaque fois que nous recevons de sa main, et il nous bénit. Depuis le jour où il est venu de Harân jusqu’à aujourd’hui, il ne s’est pas séparé de nous. Il habite constamment avec nous dans la maison et nous honore.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርር፡ ላዕሌከ
  choice: Il est plein d’amertume contre toi
  rationale: Rend le verbe exprimant l’amertume avec son complément dirigé contre la personne, dans un français naturel sans réduire le sens à une simple colère.
- source_word: ፍጹማዊ፡ ወፈትዐ
  choice: intègre et droit
  rationale: Le premier terme évoque l’intégrité ou l’irréprochabilité, et le second la droiture; cette paire conserve leur portée morale distincte.
- source_word: አልቦ፡ እኩየ፡ ዘአንበበ፡ ኂሩትነ
  choice: il n’y a en lui aucun mal, mais seulement de la bonté
  rationale: 'Suit la correction attestée par le contexte et la révision anglaise: le propos oppose entièrement le mal à la bonté présente en Jacob, sans introduire le possessif «notre».'
- source_word: ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ
  choice: il ne nous a privés de rien
  rationale: Expression idiomatique française qui conserve l’idée de ne rien avoir fait manquer aux membres de la famille.
- source_word: ኵሉ፡ ይመጽእ፡ ለነ፡ በበጊዜሁ፡ ኵሉ፡ ዕለት
  choice: chaque jour, tout ce dont nous avons besoin nous arrive au moment voulu
  rationale: Explicite légèrement le «tout» contextuel afin d’éviter une formulation française obscure, tout en gardant les notions de régularité quotidienne et de moment approprié.
- source_word: ንነሥእ፡ እምእዴሁ
  choice: nous recevons quelque chose de sa main
  rationale: «Recevoir de sa main» est naturel en français et convient mieux au contexte bienveillant que «prendre de sa main».
- source_word: ዘልፈ፡ ውስተ፡ ቤት
  choice: constamment avec nous dans la maison
  rationale: Conserve l’idée de résidence continue au sein de la maisonnée.
- source_word: ያከብረነ
  choice: nous honore
  rationale: Traduction directe du verbe exprimant l’honneur ou le respect accordé aux parents.
theological_decisions:
- issue: Qualification morale de Jacob
  choice: «il n’y a en lui aucun mal, mais seulement de la bonté» comme affirmation du personnage dans le récit
  alternative: Atténuer en «il ne fait aucun mal» ou absolutiser cette phrase en doctrine d’une perfection sans péché
  rationale: La traduction préserve la formulation forte du texte et sa fonction rhétorique, sans lui ajouter une portée doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, digne et fluide. Le discours familial reste direct; les répétitions chronologiques du texte source sont conservées, tandis que certaines constructions sont légèrement explicitées pour rester immédiatement compréhensibles.
