revisions:
- from: 'Il est plein d’amertume contre toi parce que tu as béni Jacob, ton fils intègre et droit. En effet, il n’y a en lui aucun mal, mais seulement de la bonté. Depuis le jour où il est revenu de Harân jusqu’à aujourd’hui, il ne nous a privés de rien : chaque jour, tout ce dont nous avons besoin nous arrive au moment voulu. Il se réjouit de tout son cœur chaque fois que nous recevons quelque chose de sa main, et il nous bénit. Depuis le jour où il est revenu de Harân jusqu’à aujourd’hui, il ne s’est pas séparé de nous. Il habite constamment avec nous dans la maison et nous honore.»'
  to: Il est plein d’amertume contre toi parce que tu as béni Jacob, ton fils intègre et droit. En effet, il n’y a en lui aucun mal, mais seulement de la bonté. Depuis le jour où il est venu de Harân jusqu’à aujourd’hui, il ne nous a privés de rien, car chaque jour, tout nous parvient au moment voulu. Il se réjouit de tout son cœur chaque fois que nous recevons de sa main, et il nous bénit. Depuis le jour où il est venu de Harân jusqu’à aujourd’hui, il ne s’est pas séparé de nous. Il habite constamment avec nous dans la maison et nous honore.»
  rationale: La révision retire l’implication non attestée d’un « retour » depuis Harân et les explicitations superflues, tout en préservant le rythme, la répétition chronologique et la tonalité élogieuse du discours direct. Aucune note n’est nécessaire.
