base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/015.yaml
  text: their uncleanness and after their error, he and his children. And you tell me to make him swear that he will not kill Jacob his brother. Even if he swears, he will not keep his oath, nor will he do anything but evil. And if he desires to kill Jacob his brother, he will be given into Jacob’s hand, and he will not escape from his hand, for he will fall into his hand.
translation:
  language: fr
  text: leur impureté et à la suite de leur égarement, lui et ses fils. Et toi, tu me dis de lui faire jurer qu’il ne tuera pas Jacob, son frère. Même s’il le jure, il ne sera pas fidèle à son serment et ne fera rien d’autre que le mal. Et s’il veut tuer Jacob, son frère, il sera livré entre les mains de Jacob et n’échappera pas à sa main, car il tombera entre ses mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵሶን
  choice: leur impureté
  rationale: Rend directement le nom possessivé « leur impureté »; le début abrupt est conservé puisque le verset commence au milieu d’une phrase.
- source_word: ስሕተቶን
  choice: leur égarement
  rationale: « Égarement » exprime ici l’idée d’erreur ou de déviation sans préciser indûment sa nature.
- source_word: እምሕሱ
  choice: lui faire jurer
  rationale: Le causatif est rendu explicitement et naturellement en français.
- source_word: ኢይሄሱ፡ በመሐላሁ
  choice: il ne sera pas fidèle à son serment
  rationale: Formulation française naturelle qui conserve l’idée de ne pas tenir l’engagement juré.
- source_word: ዘእንበለ፡ እኩይ
  choice: rien d’autre que le mal
  rationale: Reproduit la construction exclusive de la source sans la transformer en opposition abstraite entre bien et mal.
- source_word: ውስተ፡ እዴ፡ ያዕቆብ፡ ይትወሀብ
  choice: il sera livré entre les mains de Jacob
  rationale: Conserve l’image sémitique de la main comme pouvoir tout en employant une tournure française idiomatique.
theological_decisions:
- issue: Certitude de la défaite d’Ésaü s’il tente de tuer Jacob
  choice: 'Conserver les futurs affirmatifs : « il sera livré », « n’échappera pas », « tombera »'
  alternative: Les atténuer en possibilités ou en menaces conditionnelles
  rationale: Le texte présente ces conséquences comme certaines dans le cadre de l’hypothèse, sans expliquer leur mécanisme ni ajouter une intervention divine explicite.
