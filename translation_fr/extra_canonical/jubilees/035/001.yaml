  yaml_path: translation/extra_canonical/jubilees/035/001.yaml
  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: fr
  text: Au cours de la première année de la première semaine du quarante-cinquième jubilé, Rébecca appela Jacob, son fils, et lui donna des instructions concernant son père et son frère, afin qu’il les honore tous les jours de sa vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዐቶ
  choice: appela
  rationale: Rend directement le verbe guèze exprimant l’action d’appeler ou de faire venir quelqu’un.
- source_word: ወአዘዘቶ
  choice: et lui donna des instructions
  rationale: Le verbe peut signifier ordonner, prescrire ou instruire. Cette formulation naturelle conserve ici l’idée d’une directive maternelle sans en durcir inutilement le ton.
- source_word: በእንተ
  choice: au sujet de
  rationale: Correspond au sens relationnel « concernant, à propos de », répété pour le père et le frère.
- source_word: ያክብሮሙ
  choice: qu’il les honore
  rationale: Préserve le sens d’honorer ou de traiter avec respect; le pronom pluriel renvoie au père et au frère.
- source_word: ኵሎ
  choice: tous les jours de sa vie
  rationale: Le texte fourni se termine littéralement sur une forme signifiant « tout/entier », tandis que la formulation complète attestée par la tradition éditoriale et reflétée dans la couche de consultation est « tous les jours de sa vie »; cette restitution donne une phrase cohérente.
