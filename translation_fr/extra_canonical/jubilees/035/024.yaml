  yaml_path: translation/extra_canonical/jubilees/035/024.yaml
  text: And they ate and drank, she and her sons, that night; and she died in that night, in the third year of the seventh week of the forty-first jubilee. And her two sons, Esau and Jacob, buried her in the double cave near Sarah, the mother of their father.
translation:
  language: fr
  text: Cette nuit-là, elle mangea et but avec ses fils. Elle mourut cette même nuit, âgée de trois jubilés, d’une semaine et d’un an[a]. Ses deux fils, Ésaü et Jacob, l’ensevelirent dans la grotte double, près de Sara, la mère de leur père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Soit 155 ans : trois jubilés de 49 ans, plus sept ans et un an.'
    reason: Explicite pour le lecteur moderne le calcul sous-jacent sans remplacer dans le corps du texte la manière ancienne d’exprimer l’âge.
lexical_decisions:
- source_word: ይእቲ፡ ወውሉዳ
  choice: elle … avec ses fils
  rationale: Rend naturellement la construction « elle et ses fils » tout en gardant Rébecca comme sujet principal.
- source_word: ሠለስተ፡ አዮቤልዉ፡ ወሱባዔ፡ አሐዱ፡ ወዓመት፡ አሐዱ
  choice: âgée de trois jubilés, d’une semaine et d’un an
  rationale: 'La formule éthiopienne indique ici l’âge de Rébecca : trois périodes de 49 ans, plus sept ans, plus un an.'
- source_word: ባዐት፡ እንተ፡ ክልኤ
  choice: la grotte double
  rationale: Traduction transparente et formellement proche de l’expression « grotte qui est double », sans ajouter un nom de lieu absent du texte.
- source_word: ቀበርዋ
  choice: l’ensevelirent
  rationale: Terme funéraire français digne et courant, correspondant au fait de déposer le corps dans la tombe.
theological_decisions:
- issue: Nature de l’indication chronologique concernant la mort de Rébecca
  choice: La comprendre comme son âge au moment de sa mort
  alternative: La comprendre comme une date dans le calendrier des jubilés
  rationale: La syntaxe immédiate donne une somme d’unités — trois jubilés, une semaine et un an — qui correspond à 155 ans et décrit naturellement la durée de sa vie. Cette lecture suit le texte guèze fourni plutôt que la formulation chronologique divergente de la couche anglaise.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « cette nuit-là / cette même nuit » conserve l’insistance du texte source tout en restant naturelle. « Grotte double » préserve la désignation du guèze sans harmonisation géographique implicite.
