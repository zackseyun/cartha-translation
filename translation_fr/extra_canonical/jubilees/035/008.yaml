  yaml_path: translation/extra_canonical/jubilees/035/008.yaml
  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
translation:
  language: fr
  text: 'Ses dents étaient solides, et aucune maladie ne l’avait atteinte durant tous les jours de sa vie. Jacob lui dit : « Heureux suis-je, ma mère, si le nombre de mes jours approche celui des jours de ta vie et si ma force me reste ainsi, à la mesure de la tienne ! Tu ne mourras pas[a], car c’est en vain que tu me parles de ta mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne meurs pas. »'
    reason: Conserve l’autre interprétation traditionnelle de la forme verbale, bien que l’indicatif futur convienne mieux à sa morphologie et au contexte.
lexical_decisions:
- source_word: አስናኒሃኒ፡ ጽኑዕ
  choice: Ses dents étaient solides
  rationale: Rend directement l’idée de dents fortes ou fermes dans un français naturel, sans ajouter explicitement « encore », absent du texte.
- source_word: ሕማም፡ ኢበከፋ
  choice: aucune maladie ne l’avait atteinte
  rationale: Exprime naturellement qu’aucune maladie n’était venue sur elle au cours de sa vie.
- source_word: ብፁዕ፡ አነ
  choice: Heureux suis-je
  rationale: Conserve la tournure emphatique et le sens de bénédiction ou de bonheur du terme guèze.
- source_word: ቀርበ፡ መዋዕልየ፡ ለመዋዕለ፡ ሕይወትኪ
  choice: si le nombre de mes jours approche celui des jours de ta vie
  rationale: Le mot « nombre » explicite en français la comparaison de longévité sous-entendue par les « jours », sans en modifier le sens.
- source_word: ይሄስ፡ ኀይለየ፡ ላዕሌየ
  choice: si ma force me reste
  rationale: Rend l’idée que la force demeure sur Jacob dans une formulation française idiomatique.
- source_word: በጸው
  choice: en vain
  rationale: Préserve le jugement de Jacob selon lequel les paroles de sa mère au sujet de sa mort sont sans fondement ou sans effet.
theological_decisions:
- issue: Valeur de la forme verbale relative à la mort de Rébecca
  choice: Tu ne mourras pas
  alternative: Ne meurs pas
  rationale: 'La forme verbale se comprend le plus naturellement comme un imparfait indicatif négatif : Jacob rassure sa mère au vu de sa vigueur. L’autre lecture est conservée en note afin de ne pas masquer la variante d’interprétation.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme du discours de Jacob tout en évitant des calques peu naturels. Le point d’exclamation après la comparaison de force marque l’élan de la déclaration sans transformer la dernière phrase en commandement.
