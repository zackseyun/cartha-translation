  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
translation:
  language: fr
  text: 'Isaac lui dit : « Moi aussi, je connais et je vois la conduite de Jacob envers nous : il nous honore de tout son cœur. J’ai aimé Ésaü plus que Jacob, parce qu’Ésaü était né le premier ; mais maintenant, j’aime Jacob plus qu’Ésaü, car Ésaü a rendu ses œuvres très mauvaises[a] et il n’y a aucune justice en lui. En effet, toutes ses voies ne sont qu’injustice et violence, et il n’y a aucune justice autour de lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il a multiplié le mal dans ses œuvres ».'
    reason: La tournure guèze associe un verbe d’accroissement à l’action de rendre mauvaises ses œuvres ; la note conserve une formulation plus littérale.
  - marker: b
    text: 'Ou, au sens idiomatique : « et il n’y a absolument aucune justice en lui ».'
    reason: Le dernier mot signifie littéralement « autour de lui », mais peut renforcer l’idée d’une absence totale.
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ፡ ዘምስሌነ
  choice: la conduite de Jacob envers nous
  rationale: « Conduite » rend naturellement ግብር dans ce contexte, tandis que ዘምስሌነ indique son comportement à l’égard de ses parents.
- source_word: በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ
  choice: il nous honore de tout son cœur
  rationale: Suit étroitement l’ordre et le sens de la proposition guèze tout en restant idiomatique en français.
- source_word: አፍቀርክዎ፡ ለዔሳው፡ ቀደሙ፡ እምነ፡ ያዕቆብ
  choice: J’ai aimé Ésaü plus que Jacob
  rationale: Dans cette construction, ቀደሙ exprime la préférence antérieure accordée à Ésaü, expliquée ensuite par sa primogéniture.
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  choice: il a rendu ses œuvres très mauvaises
  rationale: አብዝኀ fonctionne ici comme intensif plutôt que comme simple comparatif, et la formulation conserve la valeur active de l’expression.
- source_word: ዐመፃ፡ ወግፍዕ
  choice: injustice et violence
  rationale: Ces termes rendent la transgression ou l’iniquité et l’oppression violente sans ajouter de précision doctrinale.
- source_word: አውዶ
  choice: autour de lui
  rationale: Préserve l’élément spatial explicite de la dernière proposition, au lieu de le supprimer comme simple redondance.
theological_decisions:
- issue: Nature du jugement porté sur Ésaü
  choice: Conserver les affirmations absolues du texte sur l’absence de justice dans sa conduite
  alternative: Les atténuer en parlant seulement d’une conduite généralement mauvaise
  rationale: Le texte formule délibérément un jugement catégorique ; l’adoucir résoudrait une tension morale que la traduction doit préserver.
- issue: Référent du sujet après la comparaison entre Jacob et Ésaü
  choice: Employer « celui-ci » pour identifier Ésaü
  alternative: Répéter immédiatement le nom « Ésaü »
  rationale: Le guèze repose sur la continuité référentielle. « Celui-ci » évite une ambiguïté française sans ajouter d’interprétation théologique.
translation_notes:
  register: Français moderne, international et digne. Syntaxe claire, sans archaïsmes ; répétition de « justice » conservée pour respecter l’insistance du texte source.
