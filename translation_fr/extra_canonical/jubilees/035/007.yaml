  yaml_path: translation/extra_canonical/jubilees/035/007.yaml
  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: fr
  text: « Et voici, j’ai accompli tous les jours de ma vie que j’avais à vivre. » Jacob rit à cause des paroles de sa mère, car sa mère lui avait dit qu’elle mourrait ; pourtant, elle demeurait en face de lui, elle avait encore ses forces et n’avait pas faibli, car elle allait et venait, et elle voyait,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: j’ai achevé tous les jours de vie
  rationale: Rend directement l’idée d’avoir mené à leur terme tous les jours de sa vie, dans un français naturel et digne.
- source_word: ወበሐቀ፡ ያዕቆብ
  choice: Jacob rit
  rationale: Le verbe exprime le rire; le contexte précise ensuite que les paroles de sa mère en sont la cause.
- source_word: ትነብር፡ አንጻሪሁ
  choice: elle se tenait devant lui
  rationale: Conserve l’idée qu’elle demeurait présente en face de Jacob sans imposer la posture plus précise « assise ».
- source_word: ኀይላ፡ ላዕሌሃ
  choice: elle avait toute sa force
  rationale: Littéralement, sa force était « sur elle »; la formulation française exprime naturellement qu’elle était encore pleinement vigoureuse.
- source_word: ትበውእ፡ ወትወፅእ
  choice: elle allait et venait
  rationale: Équivalent idiomatique de « entrer et sortir », décrivant une activité ordinaire et autonome.
- source_word: ወትሬኢ
  choice: et elle voyait encore
  rationale: Le verbe signifie « voir ». « Encore » explicite ici la persistance de cette faculté dans la série des signes de vigueur, sans préciser d’objet absent du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La répétition source autour de la force est légèrement variée (« toute sa force », « vigueur ») pour éviter une lourdeur artificielle. La ponctuation française clarifie l’enchaînement tout en conservant le contraste entre l’annonce de la mort et la vigueur persistante de la mère.
