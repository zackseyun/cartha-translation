  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: fr
  text: 'Elle entra chez Isaac et lui dit : « Je te demande une seule chose : fais jurer Ésaü de ne pas tramer de mal contre Jacob et de ne pas le poursuivre avec hostilité. Car tu connais la pensée d’Ésaü : il est cruel depuis sa jeunesse, et il n’y a en lui aucune bonté, car il désire… »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte source fourni s’interrompt après « car il désire » ; la fin de la phrase n’est pas conservée ici.
    reason: Signaler clairement que la suspension finale reflète l’état de l’extrait source et non un effet stylistique libre.
lexical_decisions:
- source_word: አሐተ፡ ስእለተ፡ አስተበቍዕ፡ በኀቤከ
  choice: Je te demande une seule chose
  rationale: Formulation française naturelle qui conserve l’idée d’une unique requête adressée avec insistance.
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  choice: de ne pas tramer de mal contre Jacob
  rationale: Le verbe exprime ici la conception ou la préparation d’un mal contre quelqu’un, plutôt qu’une simple haine intérieure.
- source_word: ወኢይስድዶ፡ በጸልኢ
  choice: et de ne pas le poursuivre avec hostilité
  rationale: Rend distinctement l’action de poursuivre et la manière hostile indiquée par le complément.
- source_word: ሕሊናሁ፡ ለዔሳው
  choice: les pensées d’Ésaü
  rationale: Le terme peut désigner la pensée, l’intention ou la disposition intérieure ; le pluriel français reste naturel sans réduire le sens à une seule intention.
- source_word: ጸዋን፡ ውእቱ፡ እምንእሱ
  choice: il est cruel depuis sa jeunesse
  rationale: « Cruel » exprime la dureté morale attribuée à Ésaü, et « depuis sa jeunesse » rend la valeur temporelle du texte.
- source_word: ወአልቦ፡ ላዕሌሁ፡ ኂሩተ
  choice: et il n’y a en lui aucune bonté
  rationale: Traduction directe et idiomatique du constat d’absence de bonté en Ésaü.
- source_word: እስመ፡ ይፈቅድ
  choice: car il désire…
  rationale: Le témoin fourni s’interrompt après un verbe de désir ou de volonté ; la traduction maintient cette incomplétude.
theological_decisions:
- issue: Portée du jugement moral porté sur Ésaü
  choice: Conserver l’énoncé absolu « il n’y a en lui aucune bonté »
  alternative: L’atténuer en « il n’a aucune bonne intention »
  rationale: Le texte source formule un jugement général sur la bonté en lui ; l’atténuer limiterait sans fondement explicite sa portée aux seules intentions présentes.
- issue: Complément absent après « il désire »
  choice: Signaler l’interruption par des points de suspension
  alternative: Compléter la phrase d’après le contexte ou un autre témoin
  rationale: Le passage source transmis dans la demande s’arrête à cet endroit ; aucun complément ne doit être introduit par conjecture dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste ferme sans archaïsmes. « Entra chez Isaac » rend naturellement le mouvement vers l’endroit où il se trouve. La ponctuation et la note préservent l’inachèvement matériel de l’extrait.
