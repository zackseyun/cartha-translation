translation:
  language: fr
  text: 'c’est ce qui est dans mon cœur : durant tous mes jours, je pense au bien de tous. Et pourquoi ne ferais-je pas cela ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une autre forme du texte poursuit : « Pourquoi ne ferais-je pas cela, afin d’honorer mon père et mon frère ? »'
    reason: Cette suite correspond à une forme textuelle plus longue, mais les mots relatifs à l’honneur rendu au père et au frère ne figurent pas dans le texte guèze fourni.
lexical_decisions:
- source_word: ውስተ፡ ልብየ
  choice: dans mon cœur
  rationale: Rend directement l’expression guèze désignant le for intérieur, dans un français naturel et digne.
- source_word: ኵሎ፡ መዋዕለ
  choice: tous les jours de ma vie
  rationale: Explicite idiomatiquement la totalité des jours du locuteur sans en modifier le sens.
- source_word: እሐሊ፡ ሠናየ፡ ለኵሉ
  choice: je pense au bien de tous
  rationale: Préserve l’idée de penser ou d’envisager ce qui est bon pour tous, plutôt que de la transformer en simple sentiment bienveillant.
- source_word: አፎ፡ ኢይገብር
  choice: pourquoi ne ferais-je pas
  rationale: La question rhétorique est rendue sous une forme idiomatique française, conforme au sens contextuel de l’interrogatif.
- source_word: ዘንተ፡ ነገረ
  choice: cela
  rationale: Le démonstratif français reprend naturellement l’action évoquée; une traduction littérale par « cette chose » serait lourde.
