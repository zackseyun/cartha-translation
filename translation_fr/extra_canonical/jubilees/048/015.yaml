  yaml_path: translation/extra_canonical/jubilees/048/015.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
translation:
  language: fr
  text: Et le quatorzième jour, le quinzième, le seizième, le dix-septième et le dix-huitième, le prince Mastéma fut lié et emprisonné derrière les enfants d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኩነነ፡ ማእቲማ
  choice: le prince Mastéma
  rationale: Le titre désigne ici un gouvernant ou un chef. « Prince » conserve la dignité du titre traditionnel sans ajouter une fonction absente du texte.
- source_word: አቡረ፡ ወዐዐወ
  choice: fut lié et emprisonné
  rationale: Les deux verbes expriment successivement l’entrave et la détention; leur coordination est conservée.
- source_word: እምድኅሬሆሙ፡ ለውሉደ
  choice: derrière les enfants d’Israël
  rationale: Cette formulation garde l’indication spatiale inhabituelle du guèze au lieu de l’interpréter comme une simple séparation ou une incapacité à poursuivre.
theological_decisions:
- issue: Titre de Mastéma
  choice: prince
  alternative: chef / gouverneur
  rationale: Le texte attribue un rang à Mastéma, mais ne précise pas ici la nature exacte de son autorité. « Prince » préserve cette indétermination.
translation_notes:
  register: Français moderne, digne et direct. La répétition chronologique des cinq jours est maintenue, tout comme l’expression volontairement énigmatique « derrière les enfants d’Israël ». Les premiers mots du segment guèze fourni, qui achèvent manifestement la phrase précédente, ne sont pas intégrés à ce verset.
