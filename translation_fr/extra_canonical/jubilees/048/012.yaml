  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
translation:
  language: fr
  text: Le quatorzième jour, le quinzième, le seizième, le dix-septième et le dix-huitième, l’ange Mastéma fut lié et empêché de poursuivre les enfants d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአክ
  choice: ange
  rationale: Le guèze መልአክ désigne un ange ou un messager. Dans ce contexte, « ange » est le sens direct et naturel, sans introduire le titre interprétatif « prince ».
- source_word: ተእስረ
  choice: fut lié
  rationale: Le passif exprime l’action de lier ou d’enchaîner Mastéma; « fut lié » conserve l’image concrète du texte.
- source_word: ተዐግሠ
  choice: empêché
  rationale: Le verbe indique que Mastéma fut retenu ou contenu. Avec le complément « de poursuivre », « empêché » rend clairement en français le résultat de cette contrainte.
- source_word: ደቂቀ እስራኤል
  choice: les enfants d’Israël
  rationale: Cette expression traditionnelle reste claire en français moderne et traduit directement la filiation collective exprimée par le guèze.
theological_decisions:
- issue: Désignation de Mastéma
  choice: l’ange Mastéma
  alternative: le prince Mastéma
  rationale: Le texte source emploie explicitement le terme courant pour « ange » ou « messager »; « prince » ajouterait un rang qui n’est pas exprimé ici.
translation_notes:
  register: Français international moderne, sobre et digne. L’énumération est légèrement allégée en français tout en conservant chacun des cinq jours et leur ordre. Les deux verbes passifs distincts du guèze sont maintenus par « fut lié et empêché ».
