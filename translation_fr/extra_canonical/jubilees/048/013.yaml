  terminology: « enfants d’Israël » convient au registre scripturaire et reste transparent. « Seigneur Dieu » rend adéquatement le titre divin. « endurcit leur cœur » conserve l’image source; « les rendit obstinés » rend l’affermissement de leur résistance.
