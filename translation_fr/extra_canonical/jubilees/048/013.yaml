translation:
  language: fr
  text: Il vint en aide aux Égyptiens, afin qu’ils poursuivent les enfants d’Israël. Il endurcit leur cœur et les rendit obstinés. Cela fut décidé par le Seigneur Dieu, afin qu’il les anéantisse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይርድእዎሙ
  choice: Il aida
  rationale: Le verbe exprime l’idée d’aider ou de secourir; le passé simple convient au registre narratif.
- source_word: ይደግኑ፡ ድኅሬሆሙ
  choice: qu’ils poursuivent
  rationale: L’expression indique le fait de se lancer à la suite de quelqu’un, ici dans une poursuite hostile.
- source_word: ለውሉደ፡ እስራኤል
  choice: les enfants d’Israël
  rationale: Rend formellement l’expression sémitique traditionnelle sans la limiter aux enfants au sens d’âge.
- source_word: ጸጽንዐ፡ አልባቢሆሙ
  choice: J’endurcis leur cœur
  rationale: Conserve l’image anthropologique du cœur et la première personne du texte source.
- source_word: አንየሎሙ
  choice: les rendis obstinés
  rationale: Exprime l’affermissement dans une attitude de résistance.
- source_word: ተኀስየ፡ እምኀበ
  choice: Ce dessein vint de
  rationale: Formulation française naturelle pour une construction indiquant qu’une résolution ou un dessein fut conçu de la part de quelqu’un.
- source_word: ይምሐጾሙ
  choice: qu’il les anéantisse
  rationale: Rend la force du verbe de destruction tout en conservant le pronom objet pluriel non explicité.
theological_decisions:
- issue: Alternance entre la troisième et la première personne
  choice: Conserver « Il aida » puis « J’endurcis »
  alternative: Harmoniser tous les verbes à la troisième personne
  rationale: Le texte fourni présente cette alternance; l’harmoniser résoudrait silencieusement une tension textuelle ou narrative authentique.
- issue: Agent du dessein destructeur
  choice: « Ce dessein vint du Seigneur Dieu »
  alternative: « Le Seigneur Dieu conçut ce dessein »
  rationale: La formulation retenue reste proche de la construction source et évite d’expliciter davantage que le texte le rapport entre Dieu et le dessein.
- issue: Référent du pronom final
  choice: Conserver « les » sans identifier explicitement son référent
  alternative: Écrire « les Égyptiens »
  rationale: Le texte source emploie un pronom; conserver cette forme respecte l’enchaînement et son éventuelle ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La traduction suit la ligne guèze fournie, laquelle est signalée comme correspondant positionnellement au verset 17, plutôt que le fragment anglais de consultation, qui ne correspond pas à son contenu.
