base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
translation:
  language: fr
  text: Le prince Mastéma se dressa contre toi et chercha à te livrer entre les mains de Pharaon. Il vint en aide aux magiciens d’Égypte, qui s’opposèrent à toi et agirent devant toi. Nous leur permîmes certes de faire le mal, mais nous ne leur permîmes pas d’accomplir des guérisons par leurs mains.[a] Cependant, le Seigneur les frappa de plaies funestes, et ils ne purent plus résister, car nous les avions rendus incapables d’accomplir le moindre signe d’enchantement. Par tous ces signes et ces prodiges, le prince Mastéma fut couvert de honte. Puis, lorsqu’il reprit des forces, il cria aux Égyptiens de se lancer à ta poursuite avec toute la puissance de l’Égypte, avec leurs chars, leurs chevaux et toute la multitude du peuple égyptien. Alors je me tins entre les Égyptiens et Israël, et nous délivrâmes Israël de sa main et de celle de son peuple. Le Seigneur les fit sortir au milieu de la mer, comme sur la terre ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ils pratiquèrent certes leurs arts, et nous leur permîmes de les accomplir de leurs mains. » Le texte transmis est difficile à cet endroit ; il semble toutefois opposer le mal permis aux guérisons qui leur furent interdites.'
    reason: Signaler la variante de traduction antérieure et la difficulté textuelle, tout en retenant la lecture qui rend le contraste lexical et la négation probables du guèze.
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: le prince Mastéma
  rationale: « Prince » rend le titre de Mastéma dans un français naturel et concorde avec son rôle de puissance hostile.
- source_word: ወይረድኡ፡ ሥረያቲሆሙ፡ ለግብጽ
  choice: Il vint en aide aux magiciens d’Égypte
  rationale: Le groupe verbal exprime l’assistance apportée aux praticiens égyptiens; « magiciens » est le terme courant dans le contexte de l’Exode.
- source_word: በቍስል፡ እኩይ
  choice: de plaies terribles
  rationale: Littéralement « d’une plaie mauvaise »; l’expression française traduit ici la gravité funeste plutôt qu’une qualité morale des plaies.
- source_word: ሕሱደ፡ ትእምርተ
  choice: le moindre signe d’enchantement
  rationale: La formulation garde la référence aux signes trompeurs ou magiques et traduit la portée emphatique de « même un seul signe ».
- source_word: ተአምር፡ ወመንክር
  choice: signes et prodiges
  rationale: Couple biblique français établi, correspondant aux deux termes distincts de la source.
theological_decisions:
- issue: Permission accordée aux magiciens et limitation de leurs actes
  choice: « Nous leur avons certes permis de faire le mal, mais nous ne leur avons pas permis d’opérer des guérisons »
  alternative: « Ils pratiquèrent certes leurs arts, et nous leur permîmes de les accomplir de leurs mains »
  rationale: Le texte guèze présente vraisemblablement un contraste explicite entre le mal permis et la guérison non permise. La traduction conserve cette tension sans identifier davantage le « nous » ni élaborer une doctrine de la permission divine.
- issue: Identité du locuteur à la première personne du pluriel
  choice: Maintien de « nous » sans explicitation
  alternative: Remplacer par « Dieu leur permit » ou préciser un groupe angélique
  rationale: La source alterne « je », « nous » et « le Seigneur ». Expliciter l’identité du pluriel résoudrait une ambiguïté narrative et théologique que le texte laisse ouverte.
- issue: Référent du pronom dans la délivrance
  choice: « Israël » est répété
  alternative: « nous le délivrâmes »
  rationale: La répétition évite l’ambiguïté de genre en français tout en conservant Israël comme bénéficiaire collectif de la délivrance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les tournures bibliques usuelles (« entre les mains de », « signes et prodiges », « terre ferme ») sont conservées sans archaïsmes. Le tutoiement suit l’adresse singulière à Moïse dans la source.
