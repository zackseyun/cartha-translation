  yaml_path: translation/extra_canonical/jubilees/048/014.yaml
  text: And all the people whom he had brought out pursued after Israel, and the Lord God cast them into the midst of the sea, into the depths of the abyss, beneath the children of Israel, just as the people of Egypt had cast their children into the river; He took vengeance on a million of them, and one thousand mighty men were destroyed, and those who pursued them perished because of envy.
translation:
  language: fr
  text: '[…] qui était à sec[a]. Tous ceux qu’il avait fait sortir se lancèrent à la poursuite d’Israël. Alors le Seigneur Dieu les précipita au milieu de la mer, dans les profondeurs de l’abîme, sous les fils d’Israël, tout comme les Égyptiens avaient jeté leurs enfants dans le fleuve. Il exerça sa vengeance contre un million d’entre eux ; mille hommes puissants furent anéantis, et ceux qui les poursuivaient périrent à cause de leur jalousie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « qui était à sec » semblent achever la phrase du verset précédent ; le texte transmis les place au début de ce segment.
    reason: Le segment guèze fourni commence par une proposition relative sans antécédent interne, tandis que la couche anglaise consultée l’omet.
lexical_decisions:
- source_word: እንተ፡ የብስ
  choice: '[…] qui était à sec'
  rationale: Le syntagme signifie littéralement « qui était sec/à sec » et paraît achever une proposition commencée dans le contexte précédent. Les points de suspension signalent honnêtement ce raccord sans inventer d’antécédent.
- source_word: ይደግኑ፡ ድኅሬሆሙ፡ ለእስራኤል
  choice: se lancèrent à la poursuite d’Israël
  rationale: Rend naturellement l’idée de poursuivre derrière Israël, avec le mouvement offensif exprimé par le contexte.
- source_word: ወረዎሙ
  choice: les précipita
  rationale: Le verbe signifie jeter ou faire descendre avec force ; « précipita » convient au jugement dans la mer et maintient le parallèle avec les enfants jetés dans le fleuve.
- source_word: ውስተ፡ መዓምቅቲሃ፡ ሰቀላይ
  choice: dans les profondeurs de l’abîme
  rationale: Conserve à la fois l’expression des profondeurs et le substantif « abîme », sans omettre ce dernier.
- source_word: ወረዉ፡ ውሉዶሙ፡ ሰብአ፡ ግብጽ
  choice: les Égyptiens avaient jeté leurs enfants
  rationale: Le sujet est le peuple d’Égypte et le complément « leurs enfants » ; la tournure active préserve le parallèle de rétribution.
- source_word: ፈለገ
  choice: le fleuve
  rationale: Dans ce contexte égyptien et exodique, le nom commun désigne le fleuve, c’est-à-dire le Nil, sans que le texte source le nomme explicitement.
- source_word: ምእተ፡ አልፈ
  choice: un million
  rationale: La notation correspond à cent fois dix mille, soit 1 000 000.
- source_word: ዐሠርተ፡ ምእተ
  choice: mille
  rationale: La notation correspond à dix fois cent, soit 1 000.
- source_word: በእንተ፡ ሕሱዳ
  choice: à cause de leur jalousie
  rationale: Rend directement la cause indiquée par le texte, sans en atténuer la portée morale.
theological_decisions:
- issue: Parallèle de rétribution entre la noyade des poursuivants et les enfants jetés dans le fleuve
  choice: 'Employer deux verbes actifs parallèles : Dieu « les précipita » et les Égyptiens « avaient jeté leurs enfants ».'
  alternative: Comprendre que les enfants des Égyptiens étaient eux-mêmes descendus dans le fleuve.
  rationale: La syntaxe guèze soutient le peuple d’Égypte comme sujet du jet de ses enfants ; ce rendu conserve donc la logique explicite de justice rétributive sans l’amplifier.
- issue: Référent de « leurs enfants »
  choice: Conserver le possessif « leurs » sans préciser l’identité ethnique des enfants.
  alternative: Écrire « les enfants d’Israël » pour expliciter le récit de l’Exode.
  rationale: Le texte dit littéralement « leurs enfants » après « les Égyptiens ». Une explicitation résoudrait une tension référentielle réelle que la traduction doit préserver.
- issue: Agent de la vengeance
  choice: « Il tira vengeance », avec Dieu comme référent contextuel.
  alternative: 'Formulation passive : « vengeance fut tirée ».'
  rationale: Le verbe source est personnel et le sujet contextuel le plus proche est le Seigneur Dieu ; la formulation française garde ce lien sans ajout doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. « Fils d’Israël » garde la désignation traditionnelle du peuple ; « hommes puissants » conserve la valeur de ኀያላን sans la réduire nécessairement à des soldats. Le point-virgule clarifie l’enchaînement des deux nombres, dont la transmission est inhabituelle mais intelligible.
