revisions:
- from: 'Tu parlerais au roi d’Égypte devant tous ses serviteurs et devant son peuple. Et tout arriva à ta parole : dix grands et terribles jugements frappèrent le pays d’Égypte, afin que tu les exécutes.'
  to: 'Tu parlerais au roi d’Égypte devant tous ses serviteurs et devant son peuple. Et tout se produisit selon ta parole : dix grands et terribles jugements frappèrent le pays d’Égypte, afin que tu les exécutes.'
  rationale: La seule correction nécessaire remplace « tout arriva à ta parole » par « tout se produisit selon ta parole », qui rend plus exactement la relation exprimée par le guèze et est idiomatique en français moderne. Le reste du texte, notamment l’agent actif de l’exécution des jugements, est maintenu.
