  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
translation:
  language: fr
  text: 'Tu parlerais au roi d’Égypte devant tous ses serviteurs et devant son peuple. Et tout se produisit selon ta parole : dix grands et terribles jugements frappèrent le pays d’Égypte, afin que tu les exécutes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትናገር
  choice: Tu parlerais
  rationale: La forme verbale de deuxième personne est rendue directement; le conditionnel s’accorde naturellement avec la perspective rétrospective du contexte transmis par la version de consultation.
- source_word: ላእካኒሁ
  choice: ses serviteurs
  rationale: Dans un cadre royal, le terme désigne les serviteurs ou dignitaires du roi; « serviteurs » conserve la formulation biblique sans spécialisation excessive.
- source_word: በቃልከ
  choice: à ta parole
  rationale: Traduction formelle qui préserve le rôle causal ou instrumental attribué à la parole de Moïse.
- source_word: ዐሥሩ፡ ኵነኔ፡ ዐበይት፡ ወጸዋጋት
  choice: dix grands et terribles jugements
  rationale: « Jugements » conserve la dimension judiciaire; « terribles » exprime la gravité du second qualificatif sans réduire les événements au seul sens de fléaux.
- source_word: መጽአ፡ ውስተ፡ ምድረ፡ ግብጽ
  choice: frappèrent le pays d’Égypte
  rationale: Le sens littéral est « vinrent dans/sur le pays d’Égypte »; « frappèrent » est un français naturel pour des jugements qui s’abattent sur un pays.
- source_word: ከመ፡ ትግበር
  choice: afin que tu les exécutes
  rationale: La forme active à la deuxième personne du singulier est maintenue et rapporte l’action à Moïse; le pronom « les » reprend explicitement les jugements.
theological_decisions:
- issue: Agent de l’exécution des jugements
  choice: afin que tu les exécutes
  alternative: afin qu’ils soient exécutés
  rationale: Le verbe guèze est actif et à la deuxième personne masculine singulière. La traduction conserve donc l’agence attribuée à Moïse, sans la transformer en passif ni nier que Dieu demeure, dans le récit, la source ultime des jugements.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « devant… devant… » et l’expression « à ta parole » sont conservées pour respecter la solennité et la structure du texte source.
