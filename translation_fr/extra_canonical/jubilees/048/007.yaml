    issue: Rendu de « à ta parole »
    rationale: La préposition source exprime ici la conformité ou l’accord avec la parole de Moïse (« selon ta parole »), non une tournure française inhabituelle telle que « arriva à ta parole ». La révision améliore simultanément la fidélité et l’idiomaticité.
