  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
translation:
  language: fr
  text: Il les brûla au feu. Et tout fut remis entre tes mains afin que tu le fasses avant qu’il ne soit fait, et tu étais présent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውዐዮሙ፡ በእሳት
  choice: Il les brûla par le feu
  rationale: Rend directement le verbe causatif avec son complément pronominal et l’instrument exprimé par በእሳት.
- source_word: ኵሉ፡ ተፈነወ፡ በእዴከ
  choice: tout fut remis entre tes mains
  rationale: La tournure passive suivie de « dans ta main » exprime la remise ou la mise à disposition; le pluriel idiomatique français « entre tes mains » est naturel.
- source_word: ከመ፡ ትግበር
  choice: afin que tu l’accomplisses
  rationale: Conserve la valeur finale de ከመ avec le verbe « faire/accomplir »; le pronom reprend l’ensemble confié.
- source_word: ዘእንበለ፡ ይትገበር
  choice: avant que cela ne soit fait
  rationale: Rend l’emploi temporel de እንበለ avec le subjonctif, plutôt que l’interprétation « rien ne fut fait sans toi ».
- source_word: ወሀለወከ
  choice: et tu étais présent
  rationale: Traduit explicitement le verbe d’existence ou de présence et le suffixe de deuxième personne.
theological_decisions:
- issue: Portée de l’action attribuée au destinataire
  choice: Conserver la formulation selon laquelle tout lui fut remis pour qu’il l’accomplisse
  alternative: Atténuer en disant que tout passa simplement par son intermédiaire
  rationale: Le texte source associe directement la remise « entre tes mains » au but exprimé par « afin que tu accomplisses »; il ne faut pas réduire cette tension théologique.
- issue: Interprétation de ዘእንበለ፡ ይትገበር
  choice: « avant que cela ne soit fait »
  alternative: « rien ne fut fait sans toi »
  rationale: La construction est ici comprise temporellement, conformément à l’analyse philologique fournie, et la proposition finale « tu étais présent » demeure distincte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de la structure guèze tout en évitant un calque maladroit; « accomplir » porte mieux que « faire » la solennité du contexte.
