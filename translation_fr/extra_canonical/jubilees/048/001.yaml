base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/001.yaml
  text: And in the sixth year of the third week of the forty-ninth jubilee[1], you departed and lived in the land of Midian for five weeks of years and one year, and you returned to Egypt in the second week, in the second year, in the fiftieth jubilee.
translation:
  language: fr
  text: La sixième année de la troisième semaine du quarante-neuvième jubilé[a], tu partis habiter au pays de Madian pendant cinq semaines d’années et un an. Puis tu retournas en Égypte la deuxième année de la deuxième semaine du cinquantième jubilé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La chronologie est condensée et quelque peu difficile dans le texte éthiopien. L’expression « cinq semaines d’années et un an » est conservée afin de respecter le système calendaire du livre des Jubilés.
    reason: segmentation_note
lexical_decisions:
- source_word: ሖርከ፡ ወነበርከ
  choice: tu partis habiter
  rationale: Rend les deux verbes, « partir/aller » et « demeurer », dans une tournure française naturelle sans supprimer l’idée d’un séjour.
- source_word: ምድረ፡ ምድያም
  choice: au pays de Madian
  rationale: Formulation française courante et digne pour « la terre/le pays de Madian ».
- source_word: ፭ሱባዔ፡ ወዓመተ፡ አሐደ
  choice: pendant cinq semaines d’années et un an
  rationale: Conserve littéralement l’unité chronologique propre au livre des Jubilés, tout en ajoutant « pendant » pour clarifier qu’il s’agit d’une durée.
- source_word: ወገባእከ
  choice: Puis tu retournas
  rationale: Le verbe guèze signifie ici « revenir/retourner » plutôt que simplement « entrer »; « puis » marque naturellement la progression du récit.
theological_decisions:
- issue: Formule chronologique de la fin du verset
  choice: la deuxième année de la deuxième semaine du cinquantième jubilé
  alternative: dans la deuxième semaine, dans la deuxième année, dans le cinquantième jubilé
  rationale: La formulation retenue exprime naturellement en français l’emboîtement des unités calendaires sans modifier leur contenu. La fin complète est attestée par la révision textuelle fournie, bien que l’extrait guèze affiché soit tronqué après « dans la semaine ».
translation_notes:
  register: Français international moderne, clair et soutenu. Le tutoiement est conservé puisque le récit s’adresse directement à Moïse. Les formules calendaires propres aux Jubilés sont maintenues plutôt que normalisées en nombre d’années.
