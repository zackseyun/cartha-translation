  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
translation:
  language: fr
  text: En chemin[a], au lieu où l’on passait la nuit, il te rencontra. N’a-t-il pas voulu de toutes ses forces te tuer et délivrer les Égyptiens de ta main, lorsqu’il vit que tu avais été envoyé pour accomplir cela et tirer vengeance contre [l’Égypte][b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut désigner le fait de rencontrer quelqu’un ou d’aller à sa rencontre; dans ce contexte, il peut évoquer une confrontation hostile. Comparer l’épisode d’Exode 4.24, survenu pendant le voyage.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi évoquer une rétribution ou un jugement. Dans le texte guèze cité, la phrase s’interrompt après « contre »; « l’Égypte » est restitué d’après le contexte.
    reason: lexical_and_textual_note
lexical_decisions:
- source_word: ትትቄበሎ (de ተቀበለ)
  choice: il vint à ta rencontre
  rationale: Le verbe exprime la rencontre ou l’affrontement. Cette formulation conserve le sens fondamental sans introduire l’idée non attestée d’une accusation; le caractère hostile ressort de la suite.
- source_word: አኮሁ
  choice: N’a-t-il pas voulu
  rationale: La particule introduit ici une question rhétorique, qu’il faut maintenir plutôt que transformer en affirmation.
- source_word: በኵሉ ኃይሉ
  choice: de toutes ses forces
  rationale: Expression française naturelle qui rend littéralement l’idée d’employer toute sa puissance.
- source_word: ያድኅኖሙ
  choice: délivrer
  rationale: Le verbe signifie sauver ou délivrer; « délivrer les Égyptiens de ta main » convient au contexte d’une menace ou d’un pouvoir exercé sur eux.
- source_word: ወበቀለ ላዕለ
  choice: exercer le jugement contre
  rationale: Le champ lexical peut évoquer la vengeance ou la rétribution. « Exercer le jugement » communique ici une sanction judiciaire sans réduire le passage à une vengeance personnelle.
theological_decisions:
- issue: Nature de l’action exercée contre l’Égypte
  choice: exercer le jugement contre l’Égypte
  alternative: tirer vengeance de l’Égypte
  rationale: Le guèze comporte une notion de vengeance ou de rétribution. Dans ce contexte de mission divine, « jugement » préserve la dimension judiciaire, tandis que la note signale la nuance plus littérale possible.
- issue: Identité du sujet hostile
  choice: maintien du pronom « il »
  alternative: nommer Mastéma ou le Seigneur
  rationale: Le verset fourni emploie un sujet pronominal dont l’antécédent dépend du contexte immédiat. Le nommer ici résoudrait une référence que ce verset laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est conservé conformément aux formes de deuxième personne du texte source. La syntaxe rhétorique et l’ambiguïté du sujet pronominal sont maintenues.
