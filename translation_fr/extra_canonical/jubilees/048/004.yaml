  yaml_path: translation/extra_canonical/jubilees/048/004.yaml
  text: But I delivered you from his hand, and you did the signs and wonders which you were sent to do in Egypt against Pharaoh and against all his house and against his servants and against his people.
translation:
  language: fr
  text: Mais je t’ai délivré de sa main, et tu as accompli les signes et les prodiges que tu avais été envoyé accomplir en Égypte contre Pharaon, contre toute sa maison, contre ses serviteurs et contre son peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባላሕኩከ
  choice: je t’ai délivré
  rationale: Le verbe exprime ici le fait d’arracher ou de délivrer quelqu’un de la main d’un adversaire; cette formulation française conserve l’image et le sens.
- source_word: ተአምረ፡ ወመንክረ
  choice: les signes et les prodiges
  rationale: Rendu biblique français courant qui maintient les deux termes distincts du guèze.
- source_word: ገበርከ / ትግበር
  choice: tu as accompli / accomplir
  rationale: « Accomplir » est naturel en français avec « signes et prodiges » et rend le verbe « faire » sans lourdeur.
- source_word: ላዕለ
  choice: contre
  rationale: La préposition répétée introduit les personnes visées par les signes et prodiges; « contre » préserve cette orientation adversative.
- source_word: ቤቱ
  choice: sa maison
  rationale: Conserve le sens collectif de la maisonnée ou de la cour de Pharaon sans le réduire à un bâtiment.
theological_decisions:
- issue: Relation entre l’envoi de Moïse et les signes à accomplir
  choice: « que tu avais été envoyé accomplir »
  alternative: « pour lesquels tu avais été envoyé afin de les accomplir »
  rationale: La formulation retenue conserve le lien explicite entre la mission et l’accomplissement des signes, tout en restant grammaticale et naturelle en français.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « contre » est maintenue devant chaque groupe afin de refléter la structure emphatique de la source. Le mot initial « Égyptiens », manifestement rattaché à la phrase du verset précédent dans cette édition, n’est pas intégré au texte de ce verset.
