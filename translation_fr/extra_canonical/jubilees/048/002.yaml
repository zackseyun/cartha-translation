  yaml_path: translation/extra_canonical/jubilees/048/002.yaml
  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
translation:
  language: fr
  text: De nouveau, dans la deuxième année du cinquantième jubilé, tu sais[a] ce qui t’a été dit sur le mont Sinaï, ainsi que ce que le prince Mastéma voulait te faire lorsque tu retournais en Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu sauras ».'
    reason: La forme verbale éthiopienne peut être comprise au présent ou au futur.
  - marker: b
    text: 'Ou : « lorsque tu entrais en Égypte ».'
    reason: Le verbe peut désigner soit un retour, soit une entrée; le contexte favorise ici le retour.
lexical_decisions:
- source_word: ታአምር (tāʾammer)
  choice: tu sais
  rationale: La forme imperfective peut avoir une valeur présente ou future, mais le contexte fait appel à ce que Moïse connaît déjà au sujet d’événements passés.
- source_word: ፈቀደ፡ ይግበር፡ ምስሌከ (faqada yəgbar məsleka)
  choice: voulait te faire
  rationale: Cette formulation naturelle conserve l’idée de l’action que Mastéma désirait accomplir à l’égard de Moïse, sans préciser davantage que la source la nature de cette action.
- source_word: ትገብእ፡ ግብጸ (təgabəʾ Gəbṣa)
  choice: tu retournais en Égypte
  rationale: Le verbe ገብአ peut exprimer l’entrée ou le retour; dans ce contexte narratif, il désigne le retour de Moïse en Égypte depuis Madian.
- source_word: መኰንን፡ መስተማ (makwannen Mastēma)
  choice: le prince Mastéma
  rationale: « Prince » rend le titre de rang ou d’autorité, tandis que « Mastéma » conserve le nom propre traditionnel.
theological_decisions:
- issue: Valeur temporelle de ታአምር
  choice: 'présent : « tu sais »'
  alternative: 'futur : « tu sauras »'
  rationale: L’ange rappelle à Moïse des paroles et des événements déjà connus; le présent convient donc mieux tout en signalant l’autre possibilité en note.
- issue: Sens de l’action de Mastéma envers Moïse
  choice: « voulait te faire »
  alternative: « voulait faire contre toi » ou « voulait faire de toi »
  rationale: Le texte indique une action projetée envers Moïse sans en expliciter ici le résultat; une formulation neutre préserve cette indétermination.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse singulière faite à Moïse. « Mont Sinaï » et « Mastéma » suivent les formes françaises usuelles.
