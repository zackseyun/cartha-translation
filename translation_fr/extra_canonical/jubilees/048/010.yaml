base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/010.yaml
  text: And all the people whom he brought out pursued after them[10], after Israel, and Yahweh our God cast them into the midst of the sea, into its depths, beneath the sons of Israel, just as the people of Egypt had cast their sons into the river. A thousand thousand and ten thousand mighty men were destroyed because of one nursing infant of the children of your people whom they had thrown into the river.
translation:
  language: fr
  text: Sur la terre ferme, tout le peuple qu’il avait fait sortir les poursuivit[a], Israël. Alors Yahweh notre Dieu les précipita au milieu de la mer, dans ses profondeurs, sous les fils d’Israël, tout comme les Égyptiens avaient précipité leurs fils dans le fleuve. Mille milliers et dix milliers de guerriers puissants périrent à cause d’un seul nourrisson parmi les enfants de ton peuple, qu’ils avaient jeté dans le fleuve.
  philosophy: optimal-equivalence
