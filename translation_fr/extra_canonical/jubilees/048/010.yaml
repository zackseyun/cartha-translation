revisions:
- from: Et tout le peuple qu’il avait fait sortir se lança à leur poursuite[a], à la poursuite d’Israël. Alors Yahweh notre Dieu les précipita au milieu de la mer, dans ses profondeurs, sous les fils d’Israël, tout comme les Égyptiens avaient précipité leurs fils dans le fleuve. Mille milliers et dix milliers de guerriers puissants périrent à cause d’un seul nourrisson parmi les enfants de ton peuple, qu’ils avaient jeté dans le fleuve.
  to: Sur la terre ferme, tout le peuple qu’il avait fait sortir les poursuivit[a], Israël. Alors Yahweh notre Dieu les précipita au milieu de la mer, dans ses profondeurs, sous les fils d’Israël, tout comme les Égyptiens avaient précipité leurs fils dans le fleuve. Mille milliers et dix milliers de guerriers puissants périrent à cause d’un seul nourrisson parmi les enfants de ton peuple, qu’ils avaient jeté dans le fleuve.
  rationale: La seule correction nécessaire est le rétablissement de « Sur la terre ferme », correspondant à l’expression initiale de la ligne guèze. La formulation de la poursuite est légèrement simplifiée afin de rester naturelle en français tout en maintenant l’apposition explicative « Israël », qui reflète la reprise du nom dans la source. Le reste du texte, y compris les formulations potentiellement inhabituelles, est conservé afin de ne pas harmoniser ni interpréter au-delà du témoin.
