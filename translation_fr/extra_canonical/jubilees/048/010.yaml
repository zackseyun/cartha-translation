review_pass:
  verdict: revise
  source_fidelity: La traduction rend globalement la poursuite, la submersion des poursuivants, la comparaison avec les enfants jetés dans le fleuve et le nombre emphatique des hommes puissants. Toutefois, elle omet እንተ፡ የብስ (« sur la terre ferme / sur le sol sec »), élément présent au début de la ligne source. Le tour « sous les fils d’Israël » conserve volontairement la localisation inhabituelle du texte plutôt que de l’interpréter.
  naturalness: Le français est narratif et intelligible. « Tout le peuple ... se lança » est possible, mais « tout le peuple ... poursuivit » est plus direct et plus proche du verbe source. L’ajout de « Sur la terre ferme » rétablit l’élément omis sans surinterpréter son rattachement syntaxique, qui peut dépendre du contexte précédent.
  terminology: « Yahweh notre Dieu », « fils d’Israël », « fleuve » et « nourrisson » conviennent. « Mille milliers et dix milliers » préserve la formulation numérique emphatique du témoin. « Guerriers puissants » est une contextualisation recevable de « hommes puissants » dans ce récit militaire.
  issues:
  - severity: medium
    issue: Omission de l’expression initiale relative au sol sec
    rationale: Le guèze commence par እንተ፡ የብስ, littéralement « sur la terre ferme / sur le sol sec ». Le texte français ne rend pas cet élément. Comme le début peut être syntaxiquement rattaché au contexte antérieur, une reprise brève en tête de verset conserve l’information sans prétendre résoudre entièrement la segmentation.
