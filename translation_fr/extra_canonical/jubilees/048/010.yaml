    reason: segmentation_note
lexical_decisions:
- source_word: ይደግኑ፡ ድኅሬሆሙ፡ ለእስራኤል
  choice: se lança à leur poursuite, à la poursuite d’Israël
  rationale: Rend explicitement la reprise du complément présente dans le guèze, tout en gardant une syntaxe française naturelle.
- source_word: እግዚአብሔር፡ አምላክ
  choice: Yahweh notre Dieu
  rationale: Le contexte et la couche de consultation indiquent la lecture avec possessif; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- source_word: ወረዎሙ
  choice: les précipita
  rationale: Le verbe exprime ici le fait de faire descendre ou de jeter dans la mer; « précipita » convient au mouvement violent décrit.
- source_word: ምእተ፡ አልፈ፡ … ወዐሠርተ፡ ምእተ
  choice: mille milliers et dix milliers
  rationale: Conserve les nombres formulés de manière emphatique dans la source sans les normaliser en un total moderne.
- source_word: ዐይሠ፡ ኀያላን
  choice: guerriers puissants
  rationale: Dans le contexte de l’armée égyptienne, cette expression française transmet plus clairement le sens martial que le seul « hommes puissants ».
- source_word: ሕሱዳ
  choice: nourrisson
  rationale: Désigne un très jeune enfant encore allaité; « nourrisson » est naturel et précis en français moderne.
theological_decisions:
- issue: Sens rétributif de la destruction de l’armée égyptienne
  choice: à cause d’un seul nourrisson
  alternative: en compensation pour un seul nourrisson
  rationale: La préposition causale est conservée sans expliciter davantage le mécanisme théologique de rétribution, laissant subsister la tension du texte.
- issue: Identification du nom divin
  choice: Yahweh notre Dieu
  alternative: le Seigneur notre Dieu
  rationale: La traduction garde le nom propre divin et évite de le substituer par un titre confessionnel traditionnel.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « à leur poursuite, à la poursuite d’Israël » préserve l’explicitation de la source. Les grands nombres restent littéraux afin de ne pas effacer leur formulation emphatique.
