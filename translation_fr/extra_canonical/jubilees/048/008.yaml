  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
translation:
  language: fr
  text: Par son intermédiaire, il vengea Israël.[a] Le SEIGNEUR fit tout cela pour Israël, conformément à la disposition qu’il avait établie avec Abraham, afin de se venger d’eux comme ils avaient réduit les Israélites en esclavage par la force.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par lui, il exerça la vengeance en faveur d’Israël. »'
    reason: Cette formulation fait ressortir plus explicitement la valeur bénéficiaire de la préposition devant « Israël ».
  - marker: b
    text: 'Ou : « comme ils les avaient asservis avec violence ».'
    reason: Le dernier terme peut évoquer la violence ou la contrainte de l’asservissement; cette formulation le rend sans réduire le sens à la seule force physique.
lexical_decisions:
- source_word: ቦቱ
  choice: Par son intermédiaire
  rationale: Rend la valeur instrumentale de « par lui » dans un français naturel, sans identifier explicitement le référent masculin.
- source_word: በቀለ፡ ለእስራኤል
  choice: il vengea Israël
  rationale: Exprime l’action accomplie en faveur d’Israël, plutôt qu’une proposition de but.
- source_word: ሥርዐቱ
  choice: la disposition
  rationale: « Disposition » conserve l’idée d’un ordre ou arrangement établi sans introduire le terme théologiquement plus chargé « alliance ».
- source_word: ተካየደ፡ ምስለ፡ አብርሃም
  choice: qu’il avait établie avec Abraham
  rationale: Formulation française naturelle pour la disposition mise en vigueur ou conclue avec Abraham.
- source_word: ቀነይዎሙ
  choice: avaient réduit les Israélites en esclavage
  rationale: Le verbe désigne précisément l’assujettissement ou la mise en servitude; l’explicitation « les Israélites » évite une succession obscure de pronoms en français.
- source_word: በግፍዕ
  choice: par la force
  rationale: Rend l’idée de contrainte violente ou injuste dans une expression française courante.
theological_decisions:
- issue: Nature de ce qui fut établi avec Abraham
  choice: disposition
  alternative: alliance
  rationale: Le terme guèze ሥርዐት renvoie ici à une disposition, un ordre ou une ordonnance; « alliance » préciserait indûment sa nature.
- issue: Référent et sujet de la première proposition
  choice: Conserver « son » et « il » sans les identifier
  alternative: Nommer Moïse comme intermédiaire et Dieu comme sujet
  rationale: Le texte du verset emploie des formes pronominales; la traduction préserve ce lien contextuel sans ajouter les noms absents de la proposition.
- issue: Rapport entre la vengeance et l’asservissement
  choice: comme
  alternative: parce que
  rationale: በከመ marque une correspondance ou une proportion entre les actes, et non seulement leur cause.
translation_notes:
  register: Français international moderne, sobre et digne. « SEIGNEUR » reproduit le nom divin du texte source. La syntaxe conserve la comparaison entre la vengeance et l’asservissement tout en explicitant « les Israélites » pour assurer la lisibilité.
