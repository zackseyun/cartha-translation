lexical_decisions:
- source_word: ጠባቂት
  choice: le jugement
  rationale: Le terme est rendu ici par « jugement », conformément au sens judiciaire ou punitif du contexte, sans préciser davantage la forme de la sanction.
- source_word: ዘገደፉ
  choice: qu’ils avaient projeté
  rationale: Le plus-que-parfait conserve l’antériorité de leur dessein; « projeter » exprime une action conçue à l’avance sans ajouter l’idée plus marquée de complot.
- source_word: ማእከለ፡ ፈለገ
  choice: au milieu du fleuve
  rationale: Traduction directe de l’expression spatiale; « fleuve » convient au contexte du Nil.
- source_word: እምውሉደ፡ ሕዝብከ
  choice: contre les enfants de ton peuple
  rationale: Le contexte exige une relation hostile; « enfants de ton peuple » préserve l’expression collective et l’adresse à la deuxième personne.
theological_decisions:
- issue: Nature du jugement
  choice: jugement
  alternative: châtiment
  rationale: « Jugement » maintient l’ambivalence entre décision judiciaire et peine exécutée, au lieu de réduire le terme à son seul effet punitif.
