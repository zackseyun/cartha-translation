revisions:
- from: 'Et le SEIGNEUR exerça contre eux une grande vengeance en faveur d’Israël : il les frappa par le sang, les grenouilles, les moustiques, les mouches venimeuses[a] et de mauvais ulcères qui éclataient en cloques ; il frappa leur bétail par la mort et par des grêlons — ainsi, il détruisit tout ce qui poussait pour eux —, puis par les sauterelles, qui dévorèrent ce que la grêle leur avait laissé, par les ténèbres et par la mort de tous leurs premiers-nés, tant des humains que des animaux. Et le SEIGNEUR exerça sa vengeance contre tous leurs dieux.'
  to: 'Et le SEIGNEUR exerça contre eux une grande vengeance à cause d’Israël : il les frappa de sang, de grenouilles, de moucherons, de taons[a] et d’ulcères mauvais produisant des cloques ; il fit mourir leur bétail et les frappa de grêlons — par lesquels il détruisit tout ce qui poussait chez eux —, de sauterelles qui dévorèrent ce que la grêle leur avait laissé, de ténèbres et de la mort de leurs premiers-nés, humains et animaux. Et le SEIGNEUR exerça sa vengeance contre tous leurs dieux.'
  rationale: La révision restitue la valeur causale de « à cause d’Israël », rétablit la nuance des insectes sans ajouter l’idée de venin, et rend la syntaxe française plus naturelle. Elle maintient l’ambiguïté zoologique en note, conserve la répétition de « vengeance » et ne modifie ni l’ordre ni la portée générale des plaies.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T22:07:45Z'
review_pass:
  verdict: revise
  source_fidelity: La préposition በእንተ exprime plus directement le motif (« à cause d’Israël ») que l’idée d’intérêt (« en faveur d’Israël »). La série des insectes distingue les petits insectes piqueurs (rendus plus exactement par « moucherons », conformément à l’audit anglais « gnats ») et les « dog-flies »; « mouches venimeuses » ajoute indûment la notion de venin. Le reste de l’énumération des plaies, y compris la destruction de la végétation par la grêle, les sauterelles, les ténèbres, la mort des premiers-nés et le jugement sur les dieux, est préservé.
  naturalness: Le texte révisé conserve la longue période énumérative tout en évitant les tours peu idiomatiques « frapper par » et « mauvais ulcères qui éclataient en cloques ». « Il fit mourir leur bétail » rend naturellement l’expression « [frapper] leur bétail de mort », et « ulcères mauvais produisant des cloques » reste proche du texte sans formulation médicale artificielle.
  terminology: « SEIGNEUR » convient au registre biblique retenu. « Vengeance » rend de façon cohérente le terme répété. « Taons » est un choix français naturel pour l’insecte traditionnellement identifié à des mouches nuisibles, mais la note doit signaler que le guèze signifie littéralement « mouches à chien » et que l’identification reste incertaine.
  issues:
  - severity: medium
    issue: « en faveur d’Israël » affaiblit ou déplace la relation causale.
    rationale: በእንተ est employé au sens de « à cause de / en raison de ». « À cause d’Israël » préserve cette valeur sans surinterpréter le but de l’action.
  - severity: medium
    issue: « moustiques » et « mouches venimeuses » ne reflètent pas précisément la distinction lexicale de la série.
    rationale: L’audit anglais rend le premier terme par « gnats » et le suivant par « dog-flies ». « Moucherons » est plus proche du premier; « venimeuses » ajoute un trait absent du second. « Taons » est proposé avec une note d’incertitude.
  - severity: low
    issue: Certaines formulations françaises sont raides ou imprécises.
    rationale: « Frapper par » est moins idiomatique que « frapper de »; des ulcères ne « éclatent » pas naturellement « en cloques ». La révision améliore ces points sans modifier le contenu.
