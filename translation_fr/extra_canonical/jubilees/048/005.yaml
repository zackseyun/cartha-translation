  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: fr
  text: 'Et le SEIGNEUR exerça contre eux une grande vengeance à cause d’Israël : il les frappa de sang, de grenouilles, de moucherons, de taons[a] et d’ulcères mauvais produisant des cloques ; il fit mourir leur bétail et les frappa de grêlons — par lesquels il détruisit tout ce qui poussait chez eux —, de sauterelles qui dévorèrent ce que la grêle leur avait laissé, de ténèbres et de la mort de leurs premiers-nés, humains et animaux. Et le SEIGNEUR exerça sa vengeance contre tous leurs dieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « mouches à chien ». L’identification exacte de ces insectes est incertaine ; on traduit aussi par « essaims de mouches » ou « mouches canines ».
    reason: Le terme guèze comporte l’appellation littérale « mouches à chien », mais ne permet pas une identification zoologique assurée. La note justifie « taons » sans présenter ce choix comme certain.
lexical_decisions:
- source_word: በቀለ፡ ዐቢየ
  choice: une grande vengeance
  rationale: Rend directement l’expression guèze désignant une vengeance ou rétribution de grande ampleur.
- source_word: በቍርነነዓን
  choice: les moustiques
  rationale: Choix courant pour le petit insecte piqueur de la série des plaies, sans imposer une identification zoologique trop précise.
- source_word: በትነንያ
  choice: les mouches venimeuses
  rationale: Le terme désigne une catégorie incertaine de mouches ou insectes nuisibles ; la traduction conserve l’idée traditionnelle de nuisance tout en signalant l’incertitude en note.
- source_word: እኩይ፡ ቍስል
  choice: de mauvais ulcères
  rationale: Reproduit la qualification négative du mal cutané et emploie un terme français naturel dans le contexte des plaies.
- source_word: ዐንጸዐንጺ
  choice: cloques
  rationale: Rend les éruptions ou boursouflures produites par les ulcères.
- source_word: አብነ፡ በረድ
  choice: des grêlons
  rationale: Traduction concrète de « pierres de grêle », idiomatique en français.
- source_word: ዘይሠርፅ፡ ሎሙ
  choice: tout ce qui poussait pour eux
  rationale: Conserve le sens agricole général de ce qui croissait à leur bénéfice, plutôt que de réduire le référent aux seules récoltes.
- source_word: በኵሮሙ
  choice: tous leurs premiers-nés
  rationale: Le suffixe renvoie collectivement aux premiers-nés des Égyptiens ; « tous » explicite naturellement la portée collective en français.
theological_decisions:
- issue: Le motif de la vengeance divine
  choice: « exerça contre eux une grande vengeance » et « exerça sa vengeance »
  alternative: « leur infligea un grand châtiment »
  rationale: Le texte répète le vocabulaire de la vengeance ; le conserver respecte sa force théologique sans l’atténuer en simple punition.
- issue: La vengeance en faveur d’Israël
  choice: « en faveur d’Israël »
  alternative: « à cause d’Israël »
  rationale: La préposition source peut exprimer le motif ou l’intérêt. « En faveur de » indique que l’action répond au sort d’Israël sans trancher davantage la nuance causale.
- issue: Jugement contre les dieux égyptiens
  choice: « contre tous leurs dieux »
  alternative: « sur tous leurs dieux »
  rationale: Le français « contre » exprime clairement l’objet du jugement tout en gardant la portée théologique du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération et ses reprises sont conservées, avec une ponctuation qui en clarifie la progression. Le nom divin est rendu par « le SEIGNEUR » conformément à l’usage biblique français.
