  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
translation:
  language: fr
  text: Là, Sichem, fils de Hamor le Hivite et prince du pays, vit Dina, fille de Jacob. Il s’empara d’elle, coucha avec elle et la souilla. Elle était une jeune fille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, la dernière proposition indique que Dina était une jeune fille ; le verset 3 précise qu’elle avait douze ans.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰከበ፡ ምስሌሃ
  choice: coucha avec elle
  rationale: Rend directement l’expression guèze « il coucha avec elle » dans un français naturel et digne, sans atténuer le contexte de contrainte indiqué par le verbe précédent.
- source_word: ወአርኰሳ
  choice: et la souilla
  rationale: Le verbe exprime l’idée de souiller, profaner ou rendre impur. « La souilla » préserve le vocabulaire de la souillure, important dans le contexte de Jubilés 30, plutôt que d’importer la formulation « l’humilia » de Genèse 34.
- source_word: ወይእቲሰ፡ ንስቲት
  choice: Or, elle était encore une jeune fille
  rationale: « Jeune fille » convient au registre narratif moderne; « encore » fait ressortir sa jeunesse sans employer « petite fille », qui pourrait suggérer un âge plus bas que celui précisé au verset suivant.
- source_word: መኰንነ፡ ምድር
  choice: prince du pays
  rationale: Rend le titre de chef ou gouvernant du territoire par la formulation française traditionnelle et intelligible « prince du pays ».
theological_decisions:
- issue: Nature de l’acte commis contre Dina
  choice: s’empara d’elle… et la souilla
  alternative: la prit… et l’humilia
  rationale: La traduction conserve à la fois la contrainte exprimée dans le récit et le lexique explicite de souillure du texte guèze, sans harmoniser celui-ci avec une formulation différente de Genèse 34.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la clarté. La formule « la souilla » est volontairement conservée en raison du lexique précis du texte source et du thème de l’impureté dans le chapitre.
