base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/007.yaml
  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
translation:
  language: fr
  text: 'Ainsi, qu’il n’y ait personne en Israël qui souille une vierge israélite. Si un homme en Israël veut donner sa fille, ou même sa sœur, à un homme issu de la descendance des nations, qu’il soit mis à mort : qu’on le lapide, car il a commis une infamie en Israël. Quant à la femme[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset 8, où est énoncé ce qui doit être fait à la femme.
    reason: 'La division en versets coupe une construction grammaticale : « la femme » est placée en tête comme objet de la proposition suivante.'
lexical_decisions:
- source_word: ለአርኵሶ
  choice: qui souille
  rationale: Le verbe exprime l’action de rendre impur ou de déshonorer. « Souiller » conserve à la fois la force morale et la portée sociale du terme sans préciser au-delà du texte la nature exacte de l’acte.
- source_word: ድንግለ፡ እስራኤላዊት
  choice: une vierge israélite
  rationale: Rendu direct du nom « vierge » accompagné de l’adjectif d’appartenance à Israël.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: issu des nations
  rationale: Littéralement « de la semence des nations ». « Issu des nations » restitue naturellement l’idée d’origine ethnique sans conserver une tournure française artificielle.
- source_word: ሞተ፡ ለይሙት
  choice: qu’il soit mis à mort
  rationale: La construction emphatique « qu’il meure de mort » indique une condamnation certaine à mort; cette formulation française en garde la force juridique.
- source_word: ኀፍረተ
  choice: une infamie
  rationale: Le terme renvoie à la honte et à l’acte déshonorant. « Infamie » convient au registre judiciaire et communautaire du passage.
- source_word: ወለብእሲትሂ
  choice: Quant à la femme, elle aussi
  rationale: Le préfixe introduit la femme comme élément détaché, repris par la proposition du verset suivant; la particule finale est conservée par « elle aussi ».
theological_decisions:
- issue: Portée de l’interdiction initiale
  choice: « qu’il n’y ait personne en Israël qui souille une vierge israélite »
  alternative: « qu’une vierge israélite ne soit pas souillée en Israël »
  rationale: La formulation retenue suit la lecture personnelle attestée par la couche de consultation tout en gardant le sens général du guèze. Elle évite d’identifier explicitement la souillure à une catégorie d’acte non nommée ici.
- issue: Rattachement de la femme à la sanction
  choice: Laisser « Quant à la femme, elle aussi » en suspens vers le verset suivant
  alternative: Rattacher la femme à la lapidation ou à l’infamie du présent verset
  rationale: La construction grammaticale présente la femme comme l’objet anticipé de la proposition suivante. La rattacher à la lapidation modifierait le sens et résoudrait à tort la syntaxe.
translation_notes:
  register: 'Français international moderne, solennel mais accessible. Les impératifs juridiques sont rendus avec « qu’il… » et « qu’on… ». La virgule finale est volontaire : elle signale que la syntaxe se poursuit au verset suivant, conformément au texte source.'
