  yaml_path: translation/extra_canonical/jubilees/030/022.yaml
  text: and they brought it all to Jacob their father. And he spoke with them about their having destroyed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of Yahweh was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob, because dread had fallen on them.
translation:
  language: fr
  text: Ils apportèrent tout à Jacob, leur père. Celui-ci leur parla de la destruction de la ville[a], car il avait peur des habitants du pays, les Cananéens et les Perizzites. La terreur de Yahweh s’empara de toutes les villes situées autour de Sichem, et elles ne se mirent pas à poursuivre les fils de Jacob, car l’épouvante était tombée sur elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du fait qu’ils avaient tué la ville ».'
    reason: La source emploie le verbe « tuer » avec « la ville » comme complément, une métonymie désignant vraisemblablement la mise à mort de ses habitants.
lexical_decisions:
- source_word: ቀተሉ፡ ሀገረ
  choice: la destruction de la ville
  rationale: Littéralement, l’expression dit qu’ils « tuèrent la ville ». Le français naturel rend cette métonymie par « destruction de la ville », tout en signalant la formulation littérale en note.
- source_word: ግርማ፡ እግዚአብሔር
  choice: la terreur de Yahweh
  rationale: « Terreur » correspond à l’effroi inspiré par Dieu dans ce contexte; « Yahweh » rend explicitement le nom divin conformément à l’usage éditorial.
- source_word: ሰሰዲደ
  choice: poursuivre
  rationale: Le verbe exprime ici l’action de se lancer à la poursuite des fils de Jacob.
- source_word: ድንጋፄ
  choice: l’épouvante
  rationale: Ce terme renforce l’idée de peur paralysante et permet de distinguer lexicalement cette seconde expression de « la terreur de Yahweh ».
theological_decisions:
- issue: Action attribuée à la terreur de Yahweh
  choice: 'Conserver l’attribution directe : « La terreur de Yahweh s’empara… »'
  alternative: « Yahweh répandit la terreur… »
  rationale: La formulation retenue suit de plus près la syntaxe de la source sans expliciter davantage le mode de l’action divine.
- issue: Référent grammatical des villes
  choice: Employer « elles » pour les villes qui ne poursuivent pas
  alternative: Expliciter « leurs habitants »
  rationale: La source conserve la métonymie des villes pour leurs habitants; la traduction la préserve afin de ne pas résoudre silencieusement cette figure.
translation_notes:
  register: Français international moderne, narratif et digne. « Celui-ci » évite une succession lourde de « et il »; les noms « Cananéens », « Perizzites » et « Sichem » suivent les formes françaises bibliques usuelles.
