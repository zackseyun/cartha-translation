  yaml_path: translation/extra_canonical/jubilees/030/011.yaml
  text: And you, Moses, command the children of Israel and testify to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations.
translation:
  language: fr
  text: 'Et toi, Moïse, donne cet ordre aux enfants d’Israël et avertis-les solennellement : qu’ils ne donnent aucune de leurs filles aux nations et qu’ils ne prennent pas, parmi les filles des nations, des femmes pour leurs fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዝዞሙ
  choice: donne cet ordre
  rationale: Le verbe exprime le fait d’ordonner ou de prescrire; cette tournure française garde la force impérative tout en restant naturelle.
- source_word: ደቂቀ፡ እስራኤል
  choice: les enfants d’Israël
  rationale: Formule traditionnelle et transparente correspondant littéralement aux « fils/enfants d’Israël ».
- source_word: አስምዕ፡ ላዕሌሆሙ
  choice: avertis-les solennellement
  rationale: L’expression causative liée à l’écoute, construite avec « sur/contre eux », peut avoir la valeur idiomatique de témoigner auprès d’eux ou de les adjurer. Ici, l’avertissement solennel rend naturellement sa fonction sans suggérer un procès.
- source_word: አሕዛብ
  choice: les nations
  rationale: Choix formel qui conserve la désignation collective des peuples non israélites sans introduire le terme plus chargé de « païens ».
- source_word: አይንሥኡ
  choice: qu’ils ne prennent pas
  rationale: Le verbe signifie « prendre »; le complément explicite que la prise vise des femmes destinées à leurs fils.
theological_decisions:
- issue: Portée de l’interdiction matrimoniale
  choice: Conserver la formulation ethnique et collective « les nations »
  alternative: Expliciter « les peuples étrangers » ou « les païens »
  rationale: Le texte interdit ici les unions avec les filles des nations; il ne donne pas dans ce verset de qualification religieuse plus précise. La traduction évite donc d’ajouter une interprétation confessionnelle.
- issue: Valeur de አስምዕ፡ ላዕሌሆሙ
  choice: « avertis-les solennellement »
  alternative: « témoigne devant eux » ou, littéralement, « fais-le-leur entendre »
  rationale: L’idiome porte une force d’attestation ou d’admonestation. Le choix retenu préserve la gravité du commandement dans un français courant et digne.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure parallèle « qu’ils ne donnent… et qu’ils ne prennent pas… » reproduit la symétrie du texte guèze. « Parmi les filles des nations » est maintenu près de « des femmes » pour rendre clairement l’origine des épouses.
