  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: fr
  text: Dina, leur sœur. Et ainsi, désormais, on ne doit pas souiller une fille d’Israël ; car il a été décrété dans le ciel contre eux que tous les hommes de Sichem soient détruits par l’épée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አይትገበር
  choice: qu’une telle chose ne se fasse plus
  rationale: La forme négative exprime une interdiction ou une prescription générale; «une telle chose» reprend naturellement l’acte évoqué dans le contexte.
- source_word: ለአርኵሶ
  choice: qu’on ne souille pas
  rationale: Le verbe renvoie à l’action de rendre impur ou de profaner; «souiller» conserve ici la gravité morale et corporelle du terme.
- source_word: ወለተ፡ እስራኤል
  choice: une fille d’Israël
  rationale: Traduction formelle de l’expression, désignant une femme appartenant au peuple d’Israël.
- source_word: ተሠርዐ
  choice: il a été décrété
  rationale: Le terme évoque ce qui a été établi, fixé ou ordonné; «décrété» convient à une décision céleste solennelle.
- source_word: ያጥፍእዎሙ
  choice: seraient exterminés
  rationale: Le verbe signifie faire disparaître ou détruire. «Exterminés» rend la destruction totale du groupe sans atténuer la violence du texte.
- source_word: ዐደወ፡ ሴቄማ
  choice: tous les hommes de Sichem
  rationale: L’expression désigne les gens ou hommes de Sichem; dans ce contexte guerrier, «les hommes de Sichem» est précis et naturel.
theological_decisions:
- issue: Portée du décret céleste
  choice: décrété contre eux que tous les hommes de Sichem seraient exterminés
  alternative: ordonné à leur sujet de détruire tous les hommes de Sichem
  rationale: La formulation retenue conserve l’idée d’une décision céleste dirigée contre les coupables sans préciser davantage l’agent humain de son exécution.
- issue: Valeur normative de l’interdiction
  choice: qu’une telle chose ne se fasse plus
  alternative: cela ne doit plus être fait
  rationale: Le tour au subjonctif garde la force prescriptive du texte tout en restant idiomatique et solennel en français.
translation_notes:
  register: Français moderne, clair et digne. La ponctuation distingue l’interdiction générale de sa justification céleste. Aucun marqueur de note n’est requis.
