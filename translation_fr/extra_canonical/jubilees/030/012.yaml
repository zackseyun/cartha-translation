  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
translation:
  language: fr
  text: 'car c’est une abomination devant le SEIGNEUR. C’est pourquoi j’ai écrit pour toi, dans les paroles de la Loi, tous les actes que les habitants de Sichem[a] ont commis contre Dina, et comment les fils de Jacob ont parlé, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « de Sichem » ; les formes plurielles du texte renvoient aux habitants de la ville.
    reason: Le guèze emploie le nom Sichem avec des pronoms et des verbes au pluriel, ce qui permet une lecture collective qu’il convient de signaler.
lexical_decisions:
- source_word: ምኑን
  choice: une abomination
  rationale: Le nom guèze désigne une chose abominable ou odieuse ; la tournure nominale conserve la force du texte.
- source_word: እግዚአብሔር
  choice: le SEIGNEUR
  rationale: Rendu traditionnel et digne du titre divin guèze, sans introduire un nom propre absent de la forme source.
- source_word: ቃለ፡ ሕግ
  choice: les paroles de la Loi
  rationale: Reproduit les deux éléments du syntagme, « parole » et « loi », dans un français intelligible.
- source_word: ሴቄማ
  choice: les habitants de Sichem
  rationale: Le nom de lieu est accompagné de formes verbales et pronominales plurielles ; il désigne donc ici collectivement les gens de Sichem.
- source_word: ላዕለ፡ ዲና
  choice: contre Dina
  rationale: Dans ce contexte d’actes commis au préjudice de Dina, « contre » exprime naturellement la relation portée par la préposition.
theological_decisions:
- issue: Qualification de l’acte devant Dieu
  choice: « une abomination devant le SEIGNEUR »
  alternative: « abominable aux yeux du SEIGNEUR »
  rationale: La formulation nominale suit de plus près le texte et évite d’atténuer sa qualification juridique et morale.
translation_notes:
  register: Français moderne, soutenu mais accessible. La phrase reste ouverte par les deux-points, puisque « en disant » introduit les paroles rapportées au verset suivant. La majuscule à « Loi » marque ici le corpus légal mentionné, et non une simple règle.
