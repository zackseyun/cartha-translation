  yaml_path: translation/extra_canonical/jubilees/030/013.yaml
  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
translation:
  language: fr
  text: « Nous ne donnerons pas notre fille à un homme qui a un prépuce, car c’est une honte pour nous. » C’est aussi une honte pour Israël, pour ceux qui donnent leurs filles[a] et pour ceux qui prennent femme parmi les filles des nations, car c’est impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour ceux qui donnent » ; l’objet « leurs filles » est sous-entendu.'
    reason: La formulation guèze omet l’objet du verbe « donner » ; il est explicité dans le texte principal pour obtenir un français naturel.
lexical_decisions:
- source_word: ቍልፈተ
  choice: prépuce
  rationale: Rend directement le terme anatomique guèze et conserve la référence explicite à l’incirconcision.
- source_word: ጽእለት
  choice: honte
  rationale: Exprime naturellement en français l’idée d’opprobre ou de déshonneur dans ce contexte.
- source_word: አሕዛብ
  choice: nations
  rationale: Conserve le terme collectif traditionnel sans le restreindre à une ethnie précise.
- source_word: ርኵስ
  choice: impur
  rationale: Préserve la catégorie de pureté exprimée par le texte, sans la réduire à la seule immoralité.
theological_decisions:
- issue: Portée de l’impureté finale
  choice: « car c’est impur »
  alternative: « car elles sont impures » ou « car une telle union est impure »
  rationale: Le référent grammatical ou conceptuel demeure peu explicite; la formulation retenue conserve cette ambiguïté au lieu d’identifier l’impureté aux femmes elles-mêmes ou de définir précisément l’acte visé.
- issue: Changement de locuteur après la première phrase
  choice: Guillemets limités à la première phrase
  alternative: Présenter tout le verset comme un discours continu sans guillemets
  rationale: La première phrase reprend la déclaration des fils de Jacob, tandis que la suite constitue un commentaire normatif; la ponctuation rend perceptible cette transition.
translation_notes:
  register: Français moderne, courant et digne. La citation directe est nettement délimitée, tandis que la seconde phrase conserve le ton normatif du passage. L’expression « prendre femme parmi » restitue sans lourdeur l’idée de choisir une épouse parmi les filles des nations.
