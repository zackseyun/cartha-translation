base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/016.yaml
  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
translation:
  language: fr
  text: 'C’est pourquoi je t’ai donné cet ordre : « Rends ce témoignage à Israël : vois ce qui est arrivé aux Sichémites et à leurs fils. Ils ont été livrés entre les mains des deux fils de Jacob, qui les ont tués violemment[a]. Cela leur a été compté comme justice et inscrit en leur faveur comme justice. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze est difficile. Il peut évoquer la détresse ou la souffrance; certaines traditions textuelles pourraient aussi soutenir « par l’épée ». Le sens général est que les Sichémites ont été mis à mort avec violence.
    reason: lexical_alternative
lexical_decisions:
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: Rends ce témoignage
  rationale: La tournure associe le causatif « faire entendre/attester » au nom « témoignage ». « Rends ce témoignage » restitue naturellement l’idée d’une attestation solennelle adressée à Israël.
- source_word: ለሰቂሞን፡ ወለውሉዱ
  choice: aux Sichémites et à leurs fils
  rationale: 'Cette formulation suit la compréhension collective retenue par la tradition textuelle consultée : les gens de Sichem et leurs descendants, plutôt qu’un seul individu nommé Sichem.'
- source_word: በፃዕር
  choice: dans les tourments
  rationale: Le terme difficile évoque la peine, la souffrance ou la détresse. « Dans les tourments » conserve la violence du contexte sans imposer une précision absente du texte.
- source_word: ወተጽሕፎሙ፡ ለጽድቅ
  choice: consigné en leur faveur comme justice
  rationale: Le verbe signifie « écrire » ou « inscrire » et le datif marque ici l’avantage ou le compte porté en leur faveur. « Consigné » évite de suggérer qu’un message leur aurait été écrit.
theological_decisions:
- issue: L’évaluation positive du massacre des Sichémites
  choice: Cela leur a été compté comme justice
  alternative: Cela fut considéré comme une action juste de leur part
  rationale: La traduction conserve sans l’atténuer la tension théologique propre au texte, qui présente l’acte des fils de Jacob comme porté à leur compte au titre de justice.
- issue: Répétition de « justice » dans les deux propositions finales
  choice: comme justice … comme justice
  alternative: comme justice … comme un acte juste
  rationale: La répétition reflète le parallélisme et le vocabulaire du guèze; elle ne doit pas être harmonisée au prix de la structure emphatique du texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le discours direct est ponctué clairement; le tutoiement singulier correspond à l’adresse faite à Moïse. La formulation conserve la répétition et la tension morale du texte source.
