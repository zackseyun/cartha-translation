  yaml_path: translation/extra_canonical/jubilees/030/020.yaml
  text: And on the day when Jacob's sons killed Shechem, a record was written for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.
translation:
  language: fr
  text: 'Le jour où les fils de Jacob tuèrent les habitants de Sichem, un document fut consigné en leur faveur dans le ciel : ils avaient accompli la justice, la droiture et la vengeance contre les pécheurs. Cette mention fut inscrite à titre de bénédiction.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐርገ፡ ሎሙ፡ መጽሐፍ (ʿarga lomu maṣḥaf)
  choice: un écrit fut porté en leur faveur dans le ciel
  rationale: L’expression dit littéralement qu’un écrit ou document « monta » pour eux. « Fut porté » conserve ce mouvement vers le ciel tout en étant naturel en français et en indiquant que l’écrit témoigne en leur faveur.
- source_word: ሰቂማነ (saqimāna)
  choice: les habitants de Sichem
  rationale: La forme désigne ici collectivement les gens de Sichem, et non le seul personnage nommé Sichem.
- source_word: ጽድቀ፡ ወርትዐ (ṣǝdqa wa-rǝtʿa)
  choice: ce qui est juste et droit
  rationale: Le binôme associe justice et droiture; une formulation adjectivale idiomatique évite l’abstraction lourde de « justice et rectitude » sans effacer les deux notions.
- source_word: ወበቀለ፡ ላዕለ፡ ኃጥአን (wa-baqala laʿla ḫaṭṭāʾān)
  choice: exercé la vengeance contre les pécheurs
  rationale: Le verbe exprime une vengeance ou rétribution dirigée contre ceux qui sont qualifiés de pécheurs. La traduction conserve le jugement moral explicite du texte.
- source_word: ወተጽሕፈ፡ ለበረከት (wa-taṣǝḥfa la-barakat)
  choice: Cela fut inscrit comme une bénédiction
  rationale: Le passif « fut inscrit » rend directement le verbe d’écriture; « comme une bénédiction » exprime la destination ou la valeur favorable de l’inscription.
theological_decisions:
- issue: Évaluation céleste de la violence des fils de Jacob
  choice: Conserver sans atténuation l’affirmation que leur acte fut jugé juste, droit et digne de bénédiction.
  alternative: Reformuler pour prendre ses distances avec cette évaluation ou présenter seulement le fait historique.
  rationale: Le verset formule explicitement une approbation céleste. La traduction doit préserver cette tension avec d’autres récits et jugements bibliques sans l’harmoniser ni l’endosser par un commentaire ajouté.
- issue: Nature de l’écrit céleste
  choice: Rendre le mouvement de l’écrit vers le ciel dans le texte et signaler en note une formulation possible centrée sur son enregistrement céleste.
  alternative: Dire uniquement « un écrit fut inscrit pour eux dans le ciel ».
  rationale: Le texte guèze fourni emploie ዐርገ, « monter », tandis que la tradition de rendu et la séquence immédiate peuvent conduire à expliciter l’idée d’un enregistrement céleste. La note préserve cette variation sans remplacer la lecture directe.
translation_notes:
  register: Français international moderne, digne et lisible. « Écrit » rend la pièce ou mention consignée sans suggérer nécessairement un livre entier. La formulation conserve le langage judiciaire et la tension théologique du passage.
