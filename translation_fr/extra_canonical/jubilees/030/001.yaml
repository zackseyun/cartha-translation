  text: And in the first year of the sixth week[1], he went up to Salem, east of Shechem, in peace, in the fourth month.
translation:
  language: fr
  text: La première année de la sixième semaine[a], il monta à Salem, à l’est de Sichem, en paix, au quatrième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du verset présente des difficultés de délimitation textuelle. Le texte éthiopien situe l’événement dans la première année de la sixième semaine et rapporte le déplacement de Jacob vers Salem, dans la région à l’est de Sichem.
    reason: segmentation_note
lexical_decisions:
- source_word: ሰሌማሃ
  choice: Salem
  rationale: Le terme est rendu comme un nom de lieu, conformément à sa forme dans le texte éthiopien et à sa localisation à l’est de Sichem.
- source_word: ጽባሒሁ፡ ለሰቂማ
  choice: à l’est de Sichem
  rationale: Cette formulation française naturelle conserve la relation géographique exprimée par le texte source.
- source_word: ሱባዔ
  choice: semaine
  rationale: Dans la chronologie des Jubilés, le mot désigne une période de sept ans; «semaine» préserve la terminologie structurante du livre sans l’expliciter dans le corps du texte.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: Conserver le pronom «il»
  alternative: Nommer explicitement Jacob
  rationale: Le contexte identifie Jacob, mais son nom n’apparaît pas dans la proposition transmise; le pronom respecte donc la formulation du texte sans ajouter une explicitation interprétative.
- issue: Rapport entre Salem et l’expression «en paix»
  choice: Conserver à la fois le nom de lieu «Salem» et l’expression «en paix»
  alternative: Comprendre Salem comme une indication de l’arrivée saine et sauve
  rationale: Le texte éthiopien présente Salem comme le lieu situé à l’est de Sichem tout en conservant séparément l’idée de paix; la traduction ne fusionne pas ces éléments.
translation_notes:
  register: Français international moderne, sobre et digne. «Sichem» et «Salem» suivent les formes françaises bibliques usuelles. La chronologie est rendue littéralement, tandis que l’ordre des compléments est légèrement ajusté pour produire une phrase française naturelle.
