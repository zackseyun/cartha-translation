base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
translation:
  language: fr
  text: ou s’il en a donné une parmi ses filles à un homme de l’une quelconque des nations. Car c’est fléau sur fléau[a] et malédiction sur malédiction ; tout jugement, tout fléau et toute malédiction viendront. S’il fait une telle chose, ou s’il ferme les yeux sur ceux qui commettent l’impureté, sur ceux qui souillent le sanctuaire du SEIGNEUR et sur ceux qui profanent son saint nom, tout le peuple sera jugé collectivement pour toute impureté et toute profanation. Il n’y aura aucune partialité, et de la main de cette personne ne seront acceptés ni fruit, ni sacrifice, ni offrande consumée, ni graisse, ni parfum d’agréable odeur. Il en sera ainsi de tout homme ou de toute femme en Israël qui souille son sanctuaire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ce verset est exceptionnellement dense et semble condenser plusieurs déclarations juridiques et cultuelles. La traduction en conserve l’enchaînement : impureté, culpabilité collective, absence de partialité et rejet des offrandes.'
    reason: segmentation_note
lexical_decisions:
- source_word: መቅሠፍት (maqśaft)
  choice: fléau
  rationale: Le terme désigne une calamité ou un châtiment dévastateur. « Fléau » conserve ici la force punitive du mot et le parallélisme avec « malédiction ».
- source_word: ርኵስ / ርኵሰ (rǝkus)
  choice: impureté
  rationale: Dans ce contexte légal et cultuel, le terme renvoie à ce qui rend impur plutôt qu’à une simple saleté matérielle.
- source_word: ያረኵሱ፡ መቅደሶ
  choice: souillent le sanctuaire
  rationale: Cette formulation naturelle en français conserve la dimension cultuelle de la profanation du lieu saint.
- source_word: ነሢአ፡ ገጽ
  choice: partialité
  rationale: L’expression littérale évoque le fait de « recevoir le visage » ; son sens idiomatique est celui du favoritisme ou de la partialité.
- source_word: ትምዐዘ፡ መዐዛ፡ ሠናይ
  choice: parfum d’agréable odeur
  rationale: La tournure garde l’image cultuelle de l’odeur plaisante associée à une offrande agréée.
theological_decisions:
- issue: Responsabilité collective du peuple
  choice: « tout le peuple sera jugé collectivement »
  alternative: « chacun dans le peuple sera jugé »
  rationale: Le texte associe explicitement l’ensemble du peuple au jugement résultant de l’impureté tolérée. La traduction maintient cette tension sans la réduire à une responsabilité purement individuelle.
- issue: Rejet des offrandes
  choice: 'Formulation passive : « ne seront acceptés »'
  alternative: « le SEIGNEUR ne recevra pas »
  rationale: Le texte exprime le non-agrément des dons sans devoir expliciter grammaticalement Dieu comme sujet ; la formulation retenue conserve cette réserve.
- issue: Référent de « son sanctuaire » dans la dernière phrase
  choice: Maintien du possessif « son »
  alternative: « le sanctuaire du SEIGNEUR »
  rationale: Le référent divin ressort du contexte, mais le possessif de la source est préservé afin de ne pas sur-expliciter.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions solennelles (« fléau sur fléau », « malédiction sur malédiction ») sont maintenues. « SEIGNEUR » rend le titre divin dans un registre biblique courant, sans introduire une interprétation confessionnelle.
