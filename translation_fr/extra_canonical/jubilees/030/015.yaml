  to: ou s’il en a donné une parmi ses filles à un homme de l’une quelconque des nations. Car c’est fléau sur fléau[a] et malédiction sur malédiction ; tout jugement, tout fléau et toute malédiction viendront. S’il fait une telle chose, ou s’il ferme les yeux sur ceux qui commettent l’impureté, sur ceux qui souillent le sanctuaire du SEIGNEUR et sur ceux qui profanent son saint nom, tout le peuple sera jugé collectivement pour toute impureté et toute profanation. Il n’y aura aucune partialité, et de la main de cette personne ne seront acceptés ni fruit, ni sacrifice, ni offrande consumée, ni graisse, ni parfum d’agréable odeur. Il en sera ainsi de tout homme ou de toute femme en Israël qui souille son sanctuaire.
