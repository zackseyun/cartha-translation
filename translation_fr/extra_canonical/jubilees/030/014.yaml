  text: And it is abominable for Israel. And Israel will not be cleansed from this uncleanness, who has a wife from the daughters of the nations,
translation:
  language: fr
  text: Cela est abominable pour Israël. Israël ne sera pas purifié de cette impureté, si un homme a pour femme une fille des nations,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምኑን
  choice: abominable
  rationale: Le terme exprime une chose odieuse ou abominable; « abominable » conserve la force morale et cultuelle du guèze.
- source_word: ኢይነጽሕ
  choice: ne sera pas purifié
  rationale: Le verbe renvoie à la purification ou à l’état de pureté; le passif français rend naturellement la forme et le contexte.
- source_word: ርኵስ
  choice: impureté
  rationale: Le mot désigne ici une souillure ou impureté, vraisemblablement à portée rituelle et morale.
- source_word: ዘቦ፡ ብእሲት
  choice: tant qu’un homme aura pour femme
  rationale: La construction relative avec « avoir » indique qu’un homme a une femme; « tant que » explicite le lien avec la non-purification sans réduire la phrase à une simple existence de femme.
- source_word: እም
  choice: une fille des nations
  rationale: Le texte conservé s’interrompt après la préposition « de/parmi »; le contexte transmis et la couche anglaise attestent l’expression « des filles des nations ». Le singulier français s’accorde avec « femme ».
theological_decisions:
- issue: Nature de l’impureté
  choice: Conserver « impureté » sans préciser si elle est exclusivement rituelle, morale ou communautaire.
  alternative: Employer « souillure » ou qualifier explicitement l’impureté de rituelle.
  rationale: Le vocabulaire permet plusieurs dimensions qui se recouvrent; une précision doctrinale fermerait indûment cette tension.
- issue: Relation syntaxique de la proposition relative
  choice: Rendre la persistance de la situation par « tant qu’un homme aura pour femme ».
  alternative: « celui qui a pour femme » ou « s’il a pour femme ».
  rationale: Le fragment relie la non-purification à la possession d’une épouse issue des nations; cette formulation est claire en français tout en évitant l’ancien contresens « s’il y a une femme ».
translation_notes:
  register: Français international moderne, digne et accessible. « Les nations » est conservé comme désignation collective biblique des peuples non israélites. La virgule finale signale que la phrase se poursuit au verset suivant ou dans le fragment source.
