  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
translation:
  language: fr
  text: 'C’est pourquoi on inscrit pour lui, sur les tablettes célestes, un témoignage de faveur[a] : bénédiction et justice devant le Dieu de tous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Geʿez : ስምዐ ፡ ሞገስ (semʿa mogas), expression qui désigne une attestation formelle de faveur, d’approbation ou de grâce.'
    reason: lexical_choice
lexical_decisions:
- source_word: ይጽሕፉ
  choice: on inscrit
  rationale: Rend l’actif pluriel geʿez par une tournure indéfinie naturelle en français, sans identifier explicitement les agents, que le texte ne nomme pas.
- source_word: ስምዐ ፡ ሞገስ
  choice: un témoignage de faveur
  rationale: Conserve l’idée d’une attestation formelle d’approbation ou de grâce, plutôt que de réduire l’expression au seul fait d’être agréé.
- source_word: ጽላተ ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Expression claire et naturelle qui préserve l’image concrète d’un registre céleste.
- source_word: ጽድቀ
  choice: justice
  rationale: Équivalent direct qui maintient la portée morale et théologique du terme sans la préciser davantage.
- source_word: አምላከ ፡ ኵሉ
  choice: le Dieu de tous
  rationale: Suit la construction génitive du geʿez et en conserve la portée universelle.
theological_decisions:
- issue: Identité de ceux qui inscrivent le témoignage
  choice: on inscrit
  alternative: ils inscrivent
  rationale: Le verbe source est au pluriel, mais ses sujets ne sont pas nommés. La tournure française indéfinie préserve cette indétermination sans introduire explicitement des anges rédacteurs.
- issue: Rapport de « bénédiction et justice » au témoignage
  choice: deux éléments explicitant le contenu du témoignage après deux-points
  alternative: une proposition autonome coordonnée
  rationale: La syntaxe nominale permet de les lire comme le contenu inscrit; les deux-points rendent ce rapport tout en conservant la concision et une certaine ouverture syntaxique.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise, respecte la structure nominale du geʿez et n’ajoute ni sujet angélique explicite ni interprétation confessionnelle.
