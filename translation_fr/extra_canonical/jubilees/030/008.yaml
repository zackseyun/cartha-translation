  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
translation:
  language: fr
  text: 'On la brûlera au feu, parce qu’elle a déshonoré le nom de la famille de son père, et elle sera retranchée d’Israël. Qu’il ne se trouve en Israël ni homme qui se livre à l’immoralité sexuelle ni personne impure, durant tous les jours des générations de la terre[a], car Israël est saint pour le Seigneur. Tout homme qui le profane sera mis à mort : on le lapidera à coups de pierres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « durant toutes les générations de la terre ».'
    reason: Signale une formulation française plus idiomatique possible, tout en maintenant dans le texte principal le mot « jours » attesté par le guèze.
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: On la brûlera par le feu
  rationale: Le suffixe objet féminin est rendu explicitement par « la »; « par le feu » conserve la formulation emphatique de la source.
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: elle a profané le nom de la maison de son père
  rationale: Rend directement la notion de profanation et maintient l’expression familiale de la source.
- source_word: ትሠረው፡ እምእስራኤል
  choice: elle sera retranchée d’Israël
  rationale: « Retranchée » exprime l’exclusion ou l’éradication sans préciser au-delà de ce que dit le verbe source.
- source_word: ዘማ
  choice: homme qui se livre à l’immoralité sexuelle
  rationale: Formulation française actuelle et intelligible pour une personne coupable d’inconduite sexuelle, sans employer l’archaïque « fornicateur ».
- source_word: ወርኵስ
  choice: ni aucune personne impure
  rationale: Conserve le sens d’impureté tout en évitant de présumer si elle est rituelle, morale ou les deux.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: durant tous les jours des générations de la terre
  rationale: Préserve expressément መዋዕለ, « jours », ainsi que l’idiome temporel caractéristique du livre.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et naturel du titre divin présent dans le texte guèze.
- source_word: ሞተ፡ ለይሙት
  choice: sera mis à mort
  rationale: Rend l’infinitif absolu emphatique comme une sentence certaine, dans un français naturel.
- source_word: በእብን፡ ይውግርዎ
  choice: on le lapidera à coups de pierres
  rationale: « Lapider » communique l’action, tandis que « à coups de pierres » préserve l’élément nominal explicite de la source.
theological_decisions:
- issue: Référent du pronom dans « qui le profane »
  choice: le pronom masculin « le », renvoyant vraisemblablement à Israël
  alternative: « qui se profane » ou « qui profane sa sainteté »
  rationale: La syntaxe de la source et la phrase précédente favorisent Israël comme référent. La traduction conserve le pronom plutôt que d’expliciter une interprétation théologique.
- issue: Nature de l’impureté
  choice: « personne impure » sans qualification
  alternative: « personne rituellement impure » ou « personne souillée moralement »
  rationale: Le terme source ne tranche pas ici de manière certaine entre les dimensions rituelle et morale; l’ambiguïté est donc maintenue.
translation_notes:
  register: Français international moderne, digne et direct. Le registre juridique et solennel du passage est conservé sans archaïsmes inutiles. Le marqueur [a] figure dans le texte principal.
