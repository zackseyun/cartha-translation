base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/017.yaml
  text: And the seed of Levi was chosen for the priesthood and to be Levites, that they might minister before the LORD as we do at all times[17]. And Levi and his sons will be blessed forever, because he was zealous to execute righteousness and judgment and vengeance on all who rose up against Israel.
translation:
  language: fr
  text: La descendance de Lévi fut choisie pour le sacerdoce et pour être lévites[a], afin qu’ils servent devant le Seigneur comme nous le faisons en tout temps[b]. Lévi et ses fils seront bénis pour toujours, parce qu’il a mis tout son zèle à accomplir la justice, à rendre le jugement et à exercer la vengeance contre tous ceux qui s’élevaient contre Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour le sacerdoce et pour les lévites ».'
    reason: Préserver l’ambiguïté syntaxique de la seconde expression tout en donnant dans le texte principal son sens fonctionnel probable.
  - marker: b
    text: Dans le cadre de la révélation du livre des Jubilés au Sinaï, le « nous » exprime la perspective du locuteur angélique et de ceux qui servent continuellement devant Dieu.
    reason: Éclairer la perspective narrative de la première personne du pluriel sans la remplacer dans le texte.
lexical_decisions:
- source_word: ዘርአ፡ ሌዊ
  choice: la descendance de Lévi
  rationale: Rend naturellement le nom collectif « semence de Lévi » tout en conservant sa portée généalogique.
- source_word: ለክህነት፡ ወለሌዋውያን
  choice: pour le sacerdoce et pour servir comme lévites
  rationale: Le premier terme désigne le sacerdoce; le second, littéralement « pour les lévites », indique vraisemblablement la fonction ou la qualité de lévites. La formulation française évite de suggérer que la descendance aurait été choisie au bénéfice d’un autre groupe.
- source_word: ይትለአኩ
  choice: servent
  rationale: Le verbe exprime ici le service cultuel accompli devant Dieu; « servir » est clair et digne en français courant.
- source_word: ቀንአ
  choice: a mis tout son zèle
  rationale: Conserve l’idée de zèle ardent sans ajouter une interprétation affective ou doctrinale.
- source_word: ጽድቀ፡ ወኵነኔ፡ ወበቀለ
  choice: la justice, le jugement et la vengeance
  rationale: Maintient les trois notions distinctes du texte guèze, y compris la tension créée par l’association de la justice et de la vengeance.
theological_decisions:
- issue: Identité du « nous » dans « comme nous le faisons »
  choice: Conserver la première personne du pluriel et l’expliquer en note.
  alternative: Remplacer par une paraphrase telle que « comme les anges le font ».
  rationale: Le texte présente explicitement un « nous ». Le cadre narratif permet de l’identifier à la voix angélique, mais cette identification ne doit pas être insérée silencieusement dans le corps du verset.
- issue: Qualification de l’action de Lévi
  choice: Conserver « justice », « jugement » et « vengeance » sans atténuation.
  alternative: Reformuler en termes généraux, par exemple « défendre la justice ».
  rationale: Le texte évalue favorablement l’acte de Lévi tout en employant un vocabulaire fort. Une généralisation effacerait une tension théologique et morale réelle du passage.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme ternaire « accomplir la justice, rendre le jugement et exercer la vengeance » préserve la structure et la force du texte source. « Seigneur » est employé comme titre divin sans introduire dans le corps du verset une équivalence confessionnelle plus marquée.
