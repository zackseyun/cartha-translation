  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
translation:
  language: fr
  text: Elle avait douze ans. Il demanda au père et aux frères de Dina de la lui donner pour femme. Jacob et ses fils se mirent en colère à cause des hommes de Sichem, parce qu’ils avaient souillé Dina, leur sœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐደወ፡ ሰቂማ
  choice: les hommes de Sichem
  rationale: Le terme ዐደወ est compris ici comme une forme construite plurielle désignant les « hommes de » Sichem, et non la ville elle-même.
- source_word: አርኰስዋ
  choice: avaient souillé
  rationale: Rend le verbe exprimant la souillure ou la profanation de Dina sans atténuer la gravité du texte.
- source_word: ትትወሀብ፡ ሎቱ፡ ብእሲተ
  choice: de la lui donner pour femme
  rationale: Formulation française naturelle qui conserve l’idée qu’elle soit donnée à l’homme comme épouse.
