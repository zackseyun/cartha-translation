  source_fidelity: 'Le sens général est fidèle au guèze : l’infamie commise en Israël, la remise des coupables aux fils de Jacob, leur destruction par l’épée et la finalité négative sont tous conservés. « Exterminent » rend de façon défendable la force du verbe de destruction. Une légère révision rend toutefois plus précisément le démonstratif « ceci » et la dernière proposition.'
