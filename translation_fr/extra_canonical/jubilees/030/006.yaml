  text: because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob's sons so that they might destroy them with the sword and do this to them, and so that it might not be done again,
translation:
  language: fr
  text: parce qu’ils avaient commis une infamie en Israël. Et le SEIGNEUR les livra entre les mains des fils de Jacob, afin qu’ils les exterminent par l’épée et leur fassent cela, et afin que cela ne se fasse plus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀፍረተ
  choice: une infamie
  rationale: Le terme désigne ici un acte honteux et déshonorant; « infamie » conserve sa force morale dans un français naturel et digne.
- source_word: መጠዎሙ
  choice: les livra
  rationale: Dans ce contexte, le verbe exprime la remise des coupables au pouvoir des fils de Jacob; « livra » rend naturellement cette action.
- source_word: ይሠርውዎሙ
  choice: qu’ils les exterminent
  rationale: Le verbe ሠረወ peut signifier déraciner, supprimer ou anéantir. « Exterminer » restitue mieux que « tuer » l’idée d’une destruction complète, explicitée ici par « par l’épée ».
- source_word: ይግበሩ፡ ላዕሌሆሙ፡ ዝንተ
  choice: leur fassent ainsi
  rationale: Cette formulation garde la référence démonstrative assez générale du guèze sans préciser davantage l’acte ni lui imposer une interprétation judiciaire.
- source_word: ኢይኩን
  choice: que cela ne se reproduise plus
  rationale: La tournure négative exprime le but que pareille chose n’advienne plus; le français idiomatique « ne se reproduise plus » préserve ce sens.
theological_decisions:
- issue: Nature de l’action confiée aux fils de Jacob
  choice: « qu’ils les exterminent par l’épée »
  alternative: « qu’ils exécutent sur eux le jugement par l’épée »
  rationale: Le texte source emploie un verbe de destruction ou d’éradication, non un terme explicite pour le jugement. La traduction évite donc d’ajouter une qualification judiciaire, tout en conservant la violence du propos.
- issue: Portée de la clause finale
  choice: « afin que cela ne se reproduise plus »
  alternative: Expliciter « en Israël » ou « envers une vierge israélite »
  rationale: L’extrait guèze fourni s’arrête à une formulation inachevée et générale. La traduction n’importe pas dans ce verset des précisions tirées du contexte adjacent.
translation_notes:
  register: Français international moderne, narratif et digne. « SEIGNEUR » représente le nom divin selon la convention éditoriale. La syntaxe répétitive des propositions finales est maintenue afin de refléter la structure du texte source, sans expansion contextuelle.
