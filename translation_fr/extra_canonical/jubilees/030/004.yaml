  - severity: medium
    issue: Ambiguïté de « dans les souffrances »
    rationale: Placée après « ils les tuèrent », cette expression peut décrire l’état des agresseurs. Le tourment renvoie vraisemblablement aux victimes, encore souffrantes après leur circoncision.
