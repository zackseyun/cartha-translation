  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
translation:
  language: fr
  text: 'Ils leur parlèrent de façon trompeuse, agirent perfidement envers eux et les égarèrent. Puis Siméon et Lévi entrèrent dans Sichem à l’improviste et exécutèrent le jugement contre tous les hommes de Sichem. Ils tuèrent tous les hommes qu’ils y trouvèrent et n’en laissèrent aucun : ils les tuèrent tous alors qu’ils souffraient encore[a], parce qu’ils avaient déshonoré Dina, leur sœur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la souffrance » ou « dans le tourment », vraisemblablement pendant qu’ils souffraient encore de leur circoncision. Il ne s’agit pas ici de la formule « au tranchant de l’épée ».'
    reason: Signaler la lecture propre au texte guèze et empêcher une harmonisation indue avec Genèse 34.
lexical_decisions:
- source_word: በአኩይ
  choice: avec malveillance
  rationale: Rend l’idée d’une parole animée par de mauvaises intentions sans limiter le sens à une seule forme de tromperie.
- source_word: ኀብለይዎሙ
  choice: les trompèrent
  rationale: Exprime l’action perfide exercée contre les hommes de Sichem dans un français naturel.
- source_word: ግብተ
  choice: à l’improviste
  rationale: Conserve l’idée d’une entrée soudaine ou inattendue, plutôt que d’ajouter une précision tactique absente du texte.
- source_word: ገብሩ፡ ኵነኔ
  choice: exécutèrent le jugement
  rationale: Reproduit la formulation judiciaire du guèze, malgré la tension morale que crée son application au massacre.
- source_word: በ፵ዐር
  choice: dans les souffrances
  rationale: Le texte transmis paraît refléter በጻዕር, « dans la souffrance, le tourment », probablement en rapport avec les douleurs de la circoncision; il ne faut pas harmoniser avec la formule de Genèse 34 sur le tranchant de l’épée.
- source_word: ገመፉ
  choice: avaient déshonoré
  rationale: Rend l’atteinte honteuse commise contre Dina dans le contexte immédiat du récit.
theological_decisions:
- issue: Qualification judiciaire du massacre
  choice: exécutèrent le jugement
  alternative: se vengèrent
  rationale: Le substantif guèze signifie « jugement/condamnation ». La traduction conserve cette présentation théologique du récit sans l’atténuer ni l’approuver explicitement.
- issue: Cause finale et référence à Dina
  choice: parce qu’ils avaient déshonoré Dina, leur sœur
  alternative: parce qu’ils avaient commis un outrage
  rationale: Le nom et le lien familial sont explicités par le contexte narratif et la tradition textuelle consultée; cette formulation évite une conclusion française tronquée tout en conservant le motif donné par le récit.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions relatives à la totalité des hommes tués sont maintenues pour préserver l’insistance du texte. « Sichem » désigne ici la ville; « les hommes de Sichem » évite l’ambiguïté avec le personnage du même nom.
