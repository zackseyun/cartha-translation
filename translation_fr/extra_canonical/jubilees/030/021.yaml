  text: And they brought out Dinah their sister from the house of Shechem, and they plundered everything that was in Shechem—their sheep and their cattle and their donkeys and all their possessions and all their wealth, and they brought everything to Jacob their father.
translation:
  language: fr
  text: 'Ils firent sortir Dina, leur sœur, de la maison de Sichem. Ils emportèrent comme butin tout ce qui se trouvait à Sichem : leurs moutons, leurs bovins, leurs ânes, toutes leurs richesses et tous leurs biens. Puis ils apportèrent le tout à Jacob, leur père.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፄወዉ
  choice: prirent comme butin
  rationale: Le verbe exprime l’action de piller ou d’emporter comme butin; cette formulation française est naturelle et conserve la force du terme.
- source_word: መራዕዮሙ
  choice: leurs troupeaux
  rationale: Le nom désigne vraisemblablement les troupeaux ou le bétail collectif, après l’énumération des moutons, bovins et ânes.
- source_word: ንዋዮሙ
  choice: leurs biens
  rationale: Le terme renvoie aux possessions ou aux richesses; « biens » évite une répétition lourde et couvre la valeur matérielle du mot.
- source_word: አምጽኡ ኵሎ ኀበ ያዕቆብ አቡሆሙ
  choice: ils apportèrent le tout à Jacob, leur père
  rationale: Rend explicitement la proposition finale du guèze, qui ne doit pas être omise.
