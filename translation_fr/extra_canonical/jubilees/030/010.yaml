  terminology: « Souiller », « lapidé », « retranché », « expiation » et « Molek » conviennent au registre scripturaire. « Retranché » conserve l’idiome d’élimination/exclusion sans déterminer indûment sa modalité. Le nom « Molek » est cohérent avec la graphie déjà retenue et avec l’usage français courant.
