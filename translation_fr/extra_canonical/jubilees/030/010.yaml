  yaml_path: translation/extra_canonical/jubilees/030/010.yaml
  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
translation:
  language: fr
  text: Quiconque la souille sera mis à mort[a] et lapidé. Cette loi n’est limitée par aucun nombre de jours, et il n’y a ni remise ni expiation ; l’homme qui a souillé une fille au milieu de tout Israël sera retranché, car il a donné de sa semence à Molek[b] et a commis le mal en la souillant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mourra de mort », formule emphatique exprimant la certitude de la peine.'
    reason: translation_clarity
  - marker: b
    text: La mention de Molek surgit abruptement dans ce contexte. Le texte guèze la conserve ; elle peut établir une analogie plus large entre l’usage illicite de la descendance et la souillure cultuelle.
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ፡ ሞተ፡ ለይሙት
  choice: Quiconque la souille sera mis à mort
  rationale: Rend la construction emphatique de mort (« qu’il meure de mort ») par la formule juridique française naturelle « sera mis à mort », sans atténuer la sanction.
- source_word: ወበእብን፡ ይትወገር
  choice: et lapidé
  rationale: Littéralement « frappé/lancé avec des pierres » ; « lapidé » exprime clairement et dignement le mode d’exécution.
- source_word: ወአልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: Cette loi n’est limitée par aucun nombre de jours
  rationale: Préserve l’idée inhabituelle d’absence de limite temporelle, sans la normaliser en une formule plus générale comme « demeure à jamais ».
- source_word: ኅድገተ፡ ወኵሉ፡ ስርየተ
  choice: ni remise ni aucune expiation
  rationale: Distingue la remise ou le pardon de l’expiation, comme le fait la formulation guèze.
- source_word: ይሤረው
  choice: doit être retranché
  rationale: Le passif exprime l’élimination ou l’arrachement. « Retranché » conserve l’idiome biblique d’exclusion radicale sans ajouter « immédiatement » ni préciser au-delà du texte le moyen de cette élimination.
- source_word: እምውስተ፡ ዘርኡ፡ ወሀቦ፡ ለሞሎክ
  choice: il a livré de sa descendance à Molek
  rationale: Rend littéralement « il a donné de sa semence à Molek » en français naturel, tout en préservant l’allusion cultuelle abrupte.
theological_decisions:
- issue: Portée de la clause concernant Molek
  choice: Conserver la clause dans le corps du texte et signaler son caractère abrupt en note
  alternative: L’omettre, la déplacer ou l’expliquer directement comme une simple comparaison
  rationale: Le texte guèze l’atteste. Son rapport précis avec la souillure d’une fille reste tendu et ne doit pas être résolu par une interprétation confessionnelle ou harmonisante.
- issue: Sens de la sanction exprimée par ይሤረው
  choice: « doit être retranché »
  alternative: « doit être mis à mort sur-le-champ » ou « doit être déraciné »
  rationale: « Retranché » préserve l’image biblique et la voix passive. La variante « sur-le-champ » ajoute une notion absente, tandis que « déraciné » serait plus littérale mais moins naturelle ici.
translation_notes:
  register: Français international moderne, juridique et solennel sans archaïsmes inutiles. Les répétitions sémantiques importantes du guèze sont conservées lorsque le français le permet, et l’étrangeté de la clause sur Molek n’est pas effacée.
