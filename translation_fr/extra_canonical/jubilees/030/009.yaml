lexical_decisions:
- source_word: ተሠርዐ
  choice: a été établi
  rationale: Le verbe exprime ici l’idée de fixer ou d’ordonner une prescription; « établi » conserve cette portée normative dans un français naturel.
- source_word: ተጽሕፈ
  choice: écrit
  rationale: Rend directement le passif du verbe « écrire » et maintient son parallélisme avec « établi ».
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Formulation naturelle qui préserve l’image traditionnelle de tablettes appartenant au domaine céleste.
- source_word: ኵሉ፡ ዘርአ፡ እስራኤል
  choice: toute la descendance d’Israël
  rationale: « Descendance » traduit le sens collectif de « semence » sans l’étrangeté que produirait un calque littéral en français moderne.
theological_decisions:
- issue: Portée normative de l’inscription céleste
  choice: « a été établi et écrit »
  alternative: « a été ordonné et écrit »
  rationale: « Établi » préserve le caractère fixé et normatif du texte sans préciser davantage si l’action désigne un décret, une institution ou une mise en ordre.
translation_notes:
  register: Français moderne, digne et accessible. La tournure conserve le parallélisme du guèze et les deux passifs, tout en employant « descendance » comme collectif idiomatique.
