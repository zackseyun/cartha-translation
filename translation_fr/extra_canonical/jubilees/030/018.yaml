translation:
  language: fr
  text: Ainsi, ils inscrivent sur les tablettes célestes, en témoignage pour lui, la bénédiction et la justice devant le Dieu de tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዐርጉ
  choice: ils inscrivent
  rationale: Le verbe signifie littéralement « faire monter », mais, avec les tablettes célestes comme destination et dans ce contexte d’enregistrement céleste, « inscrivent » exprime naturellement le sens visé.
- source_word: ሎቱ
  choice: en sa faveur
  rationale: Rend la valeur bénéficiaire de « pour lui » et précise que l’inscription constitue un témoignage favorable.
- source_word: በስምዐ
  choice: comme témoignage
  rationale: Conserve cet élément explicite du texte guèze, absent de la formulation anglaise de consultation.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Expression consacrée et intelligible pour les registres célestes dans le livre des Jubilés.
- source_word: በረከተ፡ ወጽድቀ
  choice: la bénédiction et la justice
  rationale: Traduction directe des deux substantifs, sans réduire la « justice » à une simple approbation ou à un mérite particulier.
- source_word: ለአምላከ፡ ኵሉ
  choice: le Dieu de tous
  rationale: Préserve la portée universelle et la formulation concise du titre divin.
theological_decisions:
- issue: Nature de l’inscription céleste
  choice: Maintenir « la bénédiction et la justice » comme contenu inscrit en faveur de Lévi
  alternative: Paraphraser comme une déclaration selon laquelle Lévi est béni et déclaré juste
  rationale: La formulation nominale du texte garde ouverte la relation exacte entre bénédiction, justice et témoignage céleste, sans imposer une construction doctrinale.
- issue: Fonction du témoignage
  choice: Inclure explicitement « comme témoignage »
  alternative: L’omettre comme dans le texte anglais de consultation
  rationale: Le terme est présent dans la source guèze et contribue au cadre judiciaire et céleste du passage.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la solennité du registre céleste tout en évitant le calque peu naturel « faire monter sur les tablettes ».
