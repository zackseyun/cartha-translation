  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: fr
  text: Le Seigneur vit la terre, et voici qu’elle était corrompue. Toute chair avait corrompu son ordre, et tous ceux qui étaient sur la terre avaient fait le mal sous ses yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሰነት / አማሰነት
  choice: était corrompue / avait corrompu
  rationale: Le champ lexical répété de la corruption est conservé afin de rendre l’écho interne du texte et son lien avec la dégradation de la terre.
- source_word: ኵሉ፡ ዘሤጋ
  choice: toute chair
  rationale: Rend formellement l’expression sémitique désignant l’ensemble des êtres de chair, sans la réduire explicitement à la seule humanité.
- source_word: ሥርዓታ
  choice: son ordre
  rationale: Le terme désigne un ordre, une règle ou une ordonnance; «son ordre» préserve ici l’idée d’un ordre propre ou assigné que toute chair a perverti, plutôt que de l’aplatir en «voie».
- source_word: ቅድመ፡ አዕይንቲሁ
  choice: sous ses yeux
  rationale: Expression française naturelle qui conserve l’image de ce qui se fait devant le regard du Seigneur.
theological_decisions:
- issue: Nature de l’ordre corrompu par toute chair
  choice: son ordre
  alternative: sa voie
  rationale: Le texte permet de comprendre un ordre propre, établi ou normatif, sans préciser davantage son origine. La formulation retenue préserve cette tension et le thème de l’ordre créationnel sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. «Et voici» conserve la force discursive du texte source; la répétition de «corrompue/corrompu» est intentionnelle.
