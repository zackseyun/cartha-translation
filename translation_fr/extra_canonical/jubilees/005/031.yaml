  text: And the waters receded from upon the earth in the fifth week, in its seventh year; and on the seventeenth day in the second month the earth was dry.
translation:
  language: fr
  text: Et les eaux se retirèrent de la surface de la terre dans la cinquième semaine, en sa septième année. Le dix-septième jour du deuxième mois, la terre était sèche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነጽፈ፡ ማያት
  choice: Les eaux se retirèrent
  rationale: Le verbe exprime ici le retrait ou la diminution des eaux; « se retirèrent » est naturel en français et convient au contexte du déluge.
- source_word: አመልዐልተ፡ ምድር
  choice: de la surface de la terre
  rationale: Rend l’idée des eaux qui se retirent de dessus la terre sans la formulation française peu naturelle « d’au-dessus de la terre ».
- source_word: በሱባዔ፡ ኃምስ፡ በሳብዕ፡ ዓመት፡ ሎቱ
  choice: pendant la cinquième semaine, en sa septième année
  rationale: Conserve explicitement les deux unités du système chronologique des Jubilés et le pronom possessif du texte.
- source_word: የብሰት፡ ምድር
  choice: la terre était sèche
  rationale: Traduction directe et idiomatique de l’état d’assèchement de la terre.
