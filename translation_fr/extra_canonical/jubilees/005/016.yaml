  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
translation:
  language: fr
  text: Il ne fait preuve d’aucune partialité et n’accepte aucun pot-de-vin lorsqu’il déclare qu’il jugera chacun. Même si quelqu’un lui donnait tout ce qui est sur la terre, il ne ferait preuve d’aucune partialité, ne l’accepterait pas et ne recevrait rien de sa main, car il est un juge juste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነሥእ ገጸ
  choice: fait preuve de partialité
  rationale: L’expression guèze, littéralement liée au fait de « prendre le visage », désigne dans un contexte judiciaire le favoritisme ou la partialité.
- source_word: ይነሥእ ሕሊና
  choice: accepte un pot-de-vin
  rationale: Dans ce contexte judiciaire, le terme désigne un don destiné à infléchir le jugement; « pot-de-vin » exprime clairement cette fonction en français moderne.
- source_word: ይትሜጠው እምእዴሁ
  choice: ne recevrait rien de sa main
  rationale: Le verbe signifie recevoir, prendre ou accepter; le complément implicite est rendu par « rien », conformément à la négation et au contexte.
- source_word: መኰንን ጽድቅ
  choice: un juge juste
  rationale: Rend directement le titre judiciaire et la qualité de justice, dans un français naturel et digne.
theological_decisions:
- issue: Impartialité du juge divin
  choice: Conserver les affirmations absolues d’impartialité et d’incorruptibilité
  alternative: Atténuer en parlant seulement d’équité générale
  rationale: Le texte insiste explicitement sur l’impossibilité d’influencer le jugement, même par le don de tout ce qui existe sur terre.
- issue: Portée distributive du jugement
  choice: « il jugera chacun »
  alternative: « il exécutera le jugement sur chacun »
  rationale: « Jugera chacun » est naturel en français et conserve la portée individuelle du texte sans ajouter une nuance punitive qui n’est pas nécessaire.
translation_notes:
  register: Français international moderne, clair et soutenu. La répétition de « partialité » est conservée parce qu’elle structure l’insistance du passage. Aucun marqueur de note n’est requis puisque la dernière révision lève l’ancienne ambiguïté concernant le verbe « recevoir ».
