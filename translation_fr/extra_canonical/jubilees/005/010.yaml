  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
translation:
  language: fr
  text: Leurs pères regardaient, et après cela, ils furent enchaînés dans les profondeurs de la terre pour toujours, jusqu’au jour du grand jugement, pour le jugement sur tous ceux qui ont corrompu leurs voies et leurs œuvres devant le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « jusqu’au jour du grand jugement, où le jugement s’abattra sur tous ceux qui ont corrompu leurs voies et leurs œuvres devant le Seigneur ».'
    reason: La relation syntaxique entre les deux occurrences de « jugement » peut être rendue de façon finale ou par une proposition relative; les deux rendus conservent la portée du jugement « sur tous ».
lexical_decisions:
- source_word: ወአበዊሆሙሰ፡ ይኔጽሩ
  choice: Leurs pères regardaient
  rationale: Rend directement le sujet, l’imparfait duratif et le verbe de vision, sans préciser davantage l’objet du regard, absent du texte.
- source_word: ተአስሩ
  choice: ils furent enchaînés
  rationale: Le passif exprime leur mise aux liens; « enchaînés » est naturel et concret en français.
- source_word: ውስተ፡ መዓምቅቲሃ፡ ለምድር
  choice: dans les profondeurs de la terre
  rationale: Conserve l’image spatiale et le pluriel du texte guèze.
- source_word: እስከ፡ ለዓለም
  choice: pour toujours
  rationale: Expression idiomatique française correspondant à la durée indéfinie exprimée par le guèze.
- source_word: ዲበ፡ ኵሎሙ
  choice: s’abattra sur tous
  rationale: Préserve la force directionnelle de « sur/contre » portée par ዲበ dans le contexte du jugement.
- source_word: አማሰኑ፡ ፍኖቶሆሙ፡ ወምግባሪሆሙ
  choice: ont corrompu leurs voies et leurs œuvres
  rationale: Maintient les deux objets distincts et le vocabulaire moral du texte source.
theological_decisions:
- issue: Rapport syntaxique entre le grand jugement et le jugement sur tous les corrupteurs
  choice: où le jugement s’abattra sur tous ceux qui…
  alternative: pour le jugement de tous ceux qui…
  rationale: Cette formulation rattache naturellement la seconde mention du jugement au jour annoncé et conserve la force de la préposition « sur », sans identifier davantage les agents ni résoudre des questions théologiques implicites.
- issue: Référent de « leurs pères » et des pronoms pluriels
  choice: Conserver les référents implicites
  alternative: Expliciter les groupes d’êtres concernés à partir du contexte antérieur
  rationale: Le verset isolé ne nomme pas ces référents; les expliciter importerait une interprétation contextuelle dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme narratif est conservé, ainsi que la répétition de « jugement », importante dans le texte source. Le marqueur de note [a] figure dans le texte principal.
