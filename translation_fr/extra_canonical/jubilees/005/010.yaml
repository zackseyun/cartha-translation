    rationale: Cette tournure transforme la construction nominale répétitive du source en proposition relative et introduit un futur. « pour le jugement sur tous » préserve plus directement la répétition et la force directionnelle de la préposition, tandis que la note conserve l’autre analyse possible.
  - severity: low
    issue: La note alternative ne rend pas la valeur directionnelle de « sur »
    rationale: « Le jugement de tous » peut être compris comme un jugement que tous rendent ou possèdent. L’alternative doit conserver « sur tous ».
