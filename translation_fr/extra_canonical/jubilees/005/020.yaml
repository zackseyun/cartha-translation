  text: And the Lord said that He would destroy everything that is on the dry land, from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth.
translation:
  language: fr
  text: 'Et le Seigneur dit qu’il détruirait tout ce qui se trouvait sur la terre ferme : les êtres humains, le bétail, les animaux sauvages, les oiseaux du ciel et tout ce qui se déplace sur la terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይደመስስ
  choice: qu’il détruirait
  rationale: Verbe actif à la troisième personne dans un discours indirect après « dit » ; le conditionnel français exprime naturellement le futur dans le passé.
- source_word: የብስ
  choice: la terre ferme
  rationale: Rend le domaine sec ou ferme, par opposition aux eaux, sans le réduire au simple mot « terre ».
- source_word: እሰብእ
  choice: les êtres humains
  rationale: Expression inclusive et naturelle pour l’humanité.
- source_word: እንስሳ
  choice: le bétail
  rationale: Dans cette énumération opposée aux animaux sauvages, le terme désigne naturellement les animaux domestiques.
- source_word: አራዊት
  choice: les animaux sauvages
  rationale: Distingue clairement cette catégorie du bétail.
- source_word: አዕዋፈ፡ ሰማይ
  choice: les oiseaux du ciel
  rationale: Conserve l’expression traditionnelle et l’image du texte source.
- source_word: ዘይትሐወስ፡ ውስተ፡ ምድር
  choice: tout ce qui se déplace sur la terre
  rationale: Reproduit la catégorie générale des créatures qui se meuvent sur terre sans la préciser indûment.
theological_decisions:
- issue: Discours direct ou indirect et agent de la destruction
  choice: 'Discours indirect actif : « le Seigneur dit qu’il détruirait »'
  alternative: 'Discours direct passif : « Que soit détruit tout ce qui… »'
  rationale: La forme verbale guèze est active à la troisième personne et gouverne « tout » comme objet ; elle présente donc le Seigneur comme sujet de l’action annoncée.
translation_notes:
  register: Français international moderne, digne et accessible. L’énumération est légèrement resserrée pour rester naturelle, tout en conservant toutes les catégories du texte guèze.
