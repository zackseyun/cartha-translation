  text: And concerning their sons, a word went out from before his face that they should be struck down with the sword and removed from under heaven.
translation:
  language: fr
  text: Quant à leurs fils, une parole sortit de devant sa face afin qu’ils soient frappés à coups d’épée et ôtés de dessous le ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዲበ፡ ውሉዶሙ፡
  choice: Quant à leurs fils
  rationale: Rend directement la tournure thématique « au sujet de leurs fils » dans un français naturel et digne.
- source_word: ወፅአ፡ ቃል፡ እምቅድመ፡ ገጹ፡
  choice: une parole sortit de devant sa face
  rationale: Conserve l’image formelle de la parole émanant de devant sa face, sans expliciter l’identité du référent ni atténuer l’anthropomorphisme.
- source_word: ይምሐጾሙ፡ በሰይፍ፡
  choice: être frappés par l’épée
  rationale: Le verbe maḥaṣa exprime l’action de frapper; cette formulation maintient l’image précise de l’épée plutôt que de généraliser en « exterminer ».
- source_word: ወያሰስሎሙ፡ እምታሕተ፡ ሰማይ።
  choice: et retranchés de dessous le ciel
  rationale: « Retranchés » exprime leur suppression ou leur enlèvement, tandis que « de dessous le ciel » préserve la spatialité et la solennité de la formule source.
theological_decisions:
- issue: Référent du possessif dans « sa face »
  choice: Conserver « sa face » sans ajouter « Dieu »
  alternative: « de devant la face de Dieu »
  rationale: Le texte fourni emploie un pronom; nommer explicitement Dieu résoudrait une référence que le verset laisse implicite.
- issue: Portée de la sentence
  choice: « ils devaient être frappés… et retranchés »
  alternative: « afin qu’on les frappe… et qu’on les enlève »
  rationale: La formulation retenue exprime le contenu du décret sans identifier un agent d’exécution absent de la proposition source.
translation_notes:
  register: Français moderne, soutenu mais accessible. La syntaxe conserve la solennité du décret et l’expression imagée « de devant sa face », tout en évitant des équivalents excessivement interprétatifs comme « exterminés » ou « détruits ».
