review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, notamment la préservation du référent implicite dans « sa face » et la distinction entre frapper et ôter. Toutefois, « retranchés » interprète plus fortement le second verbe, qui signifie d’abord « ôter/enlever », et « par l’épée » peut suggérer l’agent plutôt que le moyen.
  naturalness: « De dessous le ciel » et « de devant sa face » ont une coloration biblique acceptable, mais « frappés à coups d’épée » est plus idiomatique et rend mieux le moyen. La tournure « afin qu’ils soient » exprime plus exactement le contenu visé par la parole/décret que « ils devaient être ».
  terminology: « Ôtés » conserve la portée non spécifiée du verbe ge’ez, sans imposer « retranchés », « exterminés » ou « détruits ». Aucun terme théologique n’est ajouté.
  issues:
  - severity: medium
    issue: « retranchés » est plus interprétatif que nécessaire.
    rationale: Le verbe ያሰስሎሙ renvoie à l’action d’ôter ou d’enlever. « Retrancher » peut légitimement évoquer une élimination définitive, nuance que la formulation plus littérale ne doit pas imposer.
  - severity: low
    issue: « frappés par l’épée » est moins précis quant au rôle instrumental de l’épée.
    rationale: La préposition ge’ez በ marque naturellement le moyen; « à coups d’épée » le rend clairement en français moderne.
  - severity: low
    issue: La note propose comme variante ce qui est plus proche du sens lexical du second verbe que le texte principal.
    rationale: En adoptant « ôtés », aucune note n’est nécessaire; elle évite aussi de surcharger un verset bref sans variante textuelle signalée.
