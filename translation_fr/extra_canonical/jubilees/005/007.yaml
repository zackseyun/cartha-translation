  rationale: La révision conserve l’image source d’une parole qui sort « de devant sa face », sans identifier le référent implicite. Elle rend ምሐጸ par « frappés » et አሰሰለ par « ôtés », en maintenant l’imagerie spatiale « de dessous le ciel » sans renforcer indûment la sentence par « retranchés ».
