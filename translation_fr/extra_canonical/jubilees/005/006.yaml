  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
translation:
  language: fr
  text: Quant à ses anges qu’il avait envoyés sur la terre, il fut extrêmement irrité contre eux[a], au point de les dépouiller de toute leur autorité. Il nous[b] dit de les lier dans les profondeurs de la terre. Les voilà liés dans ces profondeurs et mis à part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « il fut extrêmement irrité contre eux et les dépouilla de toute leur autorité ».'
    reason: ambiguity
  - marker: b
    text: Le « nous » est celui du narrateur angélique et de ceux auxquels Dieu confie la mission de lier les anges rebelles.
    reason: cross_reference
lexical_decisions:
- source_word: ተምዐ፡ ፈድፋደ
  choice: il entra dans une très grande colère
  rationale: Rend l’intensité de l’expression guèze dans un français actuel et digne.
- source_word: ይሠርዎሙ፡ እምኵሉ፡ ሥልጣኖሙ
  choice: les dépouiller de toute leur autorité
  rationale: « Dépouiller de » exprime naturellement la privation complète de leur pouvoir ou domaine d’autorité, sans suggérer un déracinement matériel.
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: les profondeurs de la terre
  rationale: Traduction directe de l’expression spatiale désignant les régions profondes ou souterraines de la terre.
- source_word: ማእከሎሙ
  choice: au milieu de ces profondeurs
  rationale: Le suffixe pluriel renvoie vraisemblablement aux « profondeurs »; la répétition explicite évite que le français ne le rapporte aux anges.
- source_word: ብሕትዋን
  choice: séparés des autres
  rationale: Rend l’idée d’une mise à part ou d’un isolement; « des autres » explicite seulement le complément implicite nécessaire en français.
theological_decisions:
- issue: Lien entre la colère divine et la perte d’autorité des anges
  choice: au point de les dépouiller
  alternative: il entra dans une très grande colère contre eux et les dépouilla
  rationale: La construction source permet une relation de conséquence ou de finalité sans en préciser entièrement la syntaxe; « au point de » conserve ce lien sans introduire un ordre divin absent du texte.
- issue: Identité du locuteur dans « il nous dit »
  choice: maintien de la première personne du pluriel
  alternative: il dit aux anges de les lier
  rationale: Le « nous » appartient au cadre narratif révélatoire du livre et ne doit pas être remplacé par une identification interprétative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation reste proche de la structure guèze tout en clarifiant les référents pronominaux qui seraient opaques en français.
