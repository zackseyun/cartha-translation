lexical_decisions:
- source_word: ባሕቲቱ
  choice: seul
  rationale: L’adverbe exprime l’exclusivité de Noé parmi ses contemporains; sa position après « Noé » est naturelle en français.
- source_word: ረከበ፡ ሞገሰ
  choice: trouva grâce
  rationale: Cette tournure française consacrée rend directement l’expression sémitique sans en réduire le sens à une simple approbation.
- source_word: በቅድመ፡ አዕይንቲሁ
  choice: aux yeux
  rationale: L’expression corporelle du texte guèze est conservée; elle signifie « au regard de » tout en maintenant l’image originale.
- source_word: ለእግዚአብሔር
  choice: du Seigneur
  rationale: Rend le titre divin guèze de manière traditionnelle, claire et digne.
theological_decisions:
- issue: Nature de la faveur accordée à Noé
  choice: « trouva grâce »
  alternative: « obtint la faveur »
  rationale: « Trouva grâce » préserve la formulation biblique et ne précise pas indûment si cette faveur découle d’un mérite, d’un choix divin ou des deux.
translation_notes:
  register: Français moderne, sobre et biblique. La phrase suit de près la structure du guèze tout en restant idiomatique.
