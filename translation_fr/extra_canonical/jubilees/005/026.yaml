  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: fr
  text: Les eaux s’élevèrent de quinze coudées au-dessus de la terre. Elles montèrent au-dessus de toutes les hautes montagnes, et l’arche fut soulevée de terre et flotta à la surface des eaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቀ / ተለዐለ
  choice: s’élevèrent / montèrent
  rationale: Ces verbes expriment la montée et l’élévation des eaux; la variation française évite une répétition pesante tout en conservant la progression du texte.
- source_word: ዐሠርት፡ ወኃምስተ፡ በእመት
  choice: de quinze coudées
  rationale: Rend littéralement la mesure ancienne indiquée par le guèze.
- source_word: ኵሉ፡ ደብር፡ ነዋኅ
  choice: toutes les hautes montagnes
  rationale: Conserve le caractère totalisant de «toutes» et la qualification de hauteur.
- source_word: ታቦት
  choice: l’arche
  rationale: Terme français établi pour l’embarcation de Noé dans le récit du déluge.
- source_word: ተንሰፈ
  choice: flotta
  rationale: Exprime naturellement en français le mouvement de l’arche portée par les eaux.
- source_word: ዲበ፡ ገጸ፡ ማያት
  choice: à la surface des eaux
  rationale: Rend l’expression littérale «sur la face des eaux» dans un français moderne et naturel.
theological_decisions:
- issue: Rapport entre les quinze coudées et la terre
  choice: quinze coudées au-dessus de la terre
  alternative: les eaux montèrent de quinze coudées sur la terre
  rationale: La syntaxe du texte associe la mesure à l’élévation des eaux au-dessus de la terre, sans ajouter d’explication harmonisante sur la hauteur des montagnes.
translation_notes:
  register: Français moderne, international et digne; syntaxe claire, vocabulaire traditionnel seulement là où il demeure courant («arche», «coudées»).
