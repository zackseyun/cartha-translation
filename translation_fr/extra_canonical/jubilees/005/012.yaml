  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
translation:
  language: fr
  text: Et il fit pour toutes ses œuvres une nature nouvelle et juste[a], afin que, dans toute leur nature, elles ne pèchent jamais, mais qu’elles soient toutes justes, chacune selon son espèce, tous les jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette proposition est difficile tant sur le plan textuel que sur celui du sens. La traduction conserve l’idée d’une création renouvelée et rendue juste selon chaque espèce, sans la réduire à une affirmation générale.
    reason: textual_variant
lexical_decisions:
- source_word: ገብረ
  choice: donna
  rationale: Le verbe signifie littéralement « fit ». Dans cette construction, « donna … une nature » rend naturellement en français l’action créatrice ou rénovatrice sans alourdir la phrase.
- source_word: ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ
  choice: une nature nouvelle et juste
  rationale: Préserve le double qualificatif du texte guèze et son idée difficile d’une constitution ou d’une nature renouvelée et juste.
- source_word: እይረብቡ
  choice: qu’elles ne pèchent jamais
  rationale: Rend la négation du péché dans la proposition finale, avec « jamais » pour la portée temporelle exprimée ensuite par « pour toujours » dans la source.
- source_word: በበ፡ ትዝምዳ
  choice: chacune selon son espèce
  rationale: Rend la distribution selon la parenté, la catégorie ou l’espèce créée, sans généraliser en simple conformité morale.
- source_word: ኵሉ፡ መዋዕለ
  choice: tous les jours
  rationale: Traduction formellement proche de l’expression temporelle finale, dont la formulation demeure quelque peu abrupte.
theological_decisions:
- issue: Portée de la transformation de la création
  choice: « une nature nouvelle et juste » appliquée à toutes les œuvres
  alternative: « un ordre nouveau et juste »
  rationale: Le choix conserve la formulation concrète et la tension théologique d’une rénovation intrinsèque, sans la réduire à une simple organisation extérieure.
- issue: Absence future de péché
  choice: « afin qu’elles ne pèchent jamais »
  alternative: « afin qu’elles ne se corrompent jamais »
  rationale: Le contexte et le verbe soutiennent le langage du péché; la traduction ne résout pas la question de la manière dont des œuvres non humaines pourraient être concernées.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve la solennité et certaines aspérités du texte source, notamment « chacune selon son espèce » et « tous les jours ».
