  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
translation:
  language: fr
  text: Tout cela a été établi et inscrit sur les tables célestes, et il n’y a aucune injustice ; et tous ceux qui s’écartent de la voie qui leur a été fixée pour qu’ils y marchent—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርዐ (śarʿa)
  choice: a été établi / a été fixée
  rationale: 'Le même verbe est conservé par deux formulations françaises proches, adaptées à leurs compléments respectifs : une décision est « établie » et une voie est « fixée ». Les passifs rendent naturellement le sens sans ajouter un sujet divin absent de la formulation explicite.'
- source_word: ጽላተ፡ ሰማይ (ṣəlāta samāy)
  choice: les tables célestes
  rationale: Rend directement l’expression désignant les tables du ciel, tout en conservant le terme traditionnel et intelligible « tables ».
- source_word: ዐመፃ (ʿamaṣā)
  choice: injustice
  rationale: Le terme peut désigner l’injustice ou l’iniquité. « Injustice » convient ici à l’affirmation portant sur l’ordre et le jugement consignés.
- source_word: ተዐደዉ፡ እምፍኖተ (taʿaddawu ʾəm-fənota)
  choice: s’écartent de la voie
  rationale: Exprime le mouvement hors du chemin prescrit sans surinterpréter le verbe comme une doctrine technique de transgression.
- source_word: ይሖሩ፡ ባቲ (yəḫoru bāti)
  choice: qu’ils y marchent
  rationale: Préserve l’image concrète de la marche dans une voie et le pronom locatif féminin renvoyant à celle-ci.
theological_decisions:
- issue: Rapport entre l’absence d’injustice et ceux qui quittent la voie
  choice: 'Séparer les deux propositions : « il n’y a aucune injustice. Quant à tous ceux… »'
  alternative: « il n’y a aucune injustice pour tous ceux qui s’écartent… »
  rationale: La conjonction introduisant « tous ceux » ne signifie pas « pour ». La séparation évite de laisser entendre que leur écart serait exempt d’injustice ou qu’ils ne subiraient aucune injustice.
- issue: Agent de l’établissement
  choice: Employer le passif sans nommer l’agent
  alternative: « Dieu a établi »
  rationale: Le contexte peut impliquer Dieu, mais le nom divin n’apparaît pas ici. Le passif français conserve cette discrétion du texte.
- issue: Proposition suspendue à la fin du verset
  choice: Terminer par un tiret cadratin
  alternative: Clore par un point ou compléter la phrase à partir du verset suivant
  rationale: Le texte s’interrompt sur le groupe sujet dont la suite vient au verset suivant. Le tiret signale la continuité sans importer les mots du verset 14.
translation_notes:
  register: Français moderne, clair et digne. « Quant à » permet de relancer naturellement la proposition suspendue après l’affirmation autonome sur l’injustice. Le parallélisme lexical de ሠርዐ est maintenu sémantiquement par « établi » et « fixée », plutôt que par une répétition française lourde ou ambiguë.
