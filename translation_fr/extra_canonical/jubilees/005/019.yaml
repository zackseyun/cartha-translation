  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
translation:
  language: fr
  text: Mais tous ceux qui, avant le Déluge[a], avaient corrompu leur conduite et leurs desseins ne reçurent aucune faveur, à l’exception de Noé seul. Car une faveur lui fut accordée pour ses fils[b], qu’il sauva des eaux du Déluge à cause de lui, puisque son cœur était juste dans toute sa conduite, conformément à ce qui lui avait été ordonné, et qu’il ne s’écarta en rien de ce qui avait été prescrit pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « avant le Déluge » traduit de manière interprétative une tournure difficile qui mentionne les « eaux du Déluge ». Le sens général est que, dans cette génération, personne d’autre que Noé ne reçut un regard favorable.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour le bien de ses fils ». La tournure indique que la faveur accordée à Noé leur profitait, et non qu’elle lui était accordée à cause d’eux.'
    reason: lexical_clarification
lexical_decisions:
- source_word: አማሰኑ፡ ፍኖዊሆሙ፡ ወምክርሙ
  choice: avaient corrompu leur conduite et leurs desseins
  rationale: Rend les deux objets distincts, « voies/conduite » et « conseil/projets », dans un français naturel et soutenu.
- source_word: ተነሥአ፡ ገጸ
  choice: reçut faveur
  rationale: L’expression idiomatique évoque un regard favorable; « faveur » convient mieux ici que « partialité ».
- source_word: በእንተ፡ ውሉዱ
  choice: en faveur de ses fils
  rationale: 'Préserve le sens de bénéfice ou de représentation: la faveur accordée à Noé profite à ses fils, lesquels sont ensuite sauvés à cause de lui.'
- source_word: ጻድቅ፡ ይእቲ፡ ልቡ
  choice: son cœur était juste
  rationale: Conserve l’anthropologie et la formulation morale du texte sans la réduire à une simple sincérité.
- source_word: ኢተዐደወ
  choice: il ne s’écarta en rien
  rationale: Exprime la non-déviation par rapport à ce qui lui avait été prescrit.
theological_decisions:
- issue: Fondement de la délivrance des fils de Noé
  choice: ses fils sont sauvés « à cause de lui »
  alternative: Noé reçoit faveur à cause de ses fils
  rationale: La succession des propositions distingue la faveur accordée à Noé en faveur de ses fils et le salut de ceux-ci à cause de Noé; cette tension causale doit être conservée.
- issue: Justice du cœur et obéissance
  choice: maintenir les deux affirmations distinctes
  alternative: les fusionner en une déclaration générale de fidélité
  rationale: Le texte associe la justice intérieure de Noé à sa conformité aux commandements sans définir explicitement leur rapport causal.
translation_notes:
  register: Français international moderne, digne et accessible. « Déluge » conserve le terme biblique traditionnel; « conduite » évite la raideur de « voies » tout en gardant la portée morale. La répétition de « faveur » est maintenue pour refléter celle de la source.
