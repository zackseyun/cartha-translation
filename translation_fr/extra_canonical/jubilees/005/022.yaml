  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
translation:
  language: fr
  text: Noé construisit l’arche en tout point comme Dieu le lui avait ordonné, au cours du vingt-sixième jubilé d’années, dans la cinquième semaine, la cinquième année.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ኖኅ፡ ታቦተ
  choice: Noé construisit l’arche
  rationale: Le verbe ገብረ signifie littéralement « faire »; avec « l’arche », « construisit » est l’équivalent français naturel et précis.
- source_word: በኵሉ
  choice: en tout point
  rationale: Cette expression conserve l’idée d’une exécution complète, sous tous les rapports.
- source_word: በከመ፡ አዘዞ
  choice: comme Dieu le lui avait ordonné
  rationale: አዘዞ est une forme active signifiant « il le lui ordonna ». Le sujet implicite est Dieu dans le contexte; le plus-que-parfait français situe naturellement l’ordre avant la construction.
- source_word: በዕሥራ፡ ወስድስቱ፡ ኢዮቤልው፡ ዓመታት
  choice: au cours du vingt-sixième jubilé d’années
  rationale: Le texte porte bien « vingt-six », et non « vingt-sept ». « Jubilé d’années » préserve la formulation chronologique propre au livre.
- source_word: በኃምስ፡ ሱባዔ፡ በኃምስ፡ ዓመት
  choice: dans la cinquième semaine, la cinquième année
  rationale: « Semaine » désigne ici une semaine d’années; la formulation concise reflète le système chronologique du texte.
theological_decisions:
- issue: Sujet implicite du verbe « ordonner »
  choice: Dieu
  alternative: « comme il le lui avait ordonné » ou « comme cela lui avait été ordonné »
  rationale: La forme source est active et comporte Noé comme objet. Nommer Dieu en français évite une ambiguïté artificielle tout en respectant le référent contextuel, sans rendre le verbe au passif.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la précision du système calendaire des Jubilés tout en employant une syntaxe naturelle.
