  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
translation:
  language: fr
  text: 'Et s’ils n’y marchent pas, un jugement est écrit pour toute créature et toute lignée. Il n’y a rien dans le ciel ni sur la terre, dans la lumière ni dans les ténèbres, dans le séjour des morts ni dans l’abîme ni dans le lieu de ténèbres[a] : tous leurs jugements sont fixés, écrits et gravés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’énumération — ciel, terre, lumière, ténèbres, séjour des morts, abîme et lieu de ténèbres — embrasse symboliquement l’ensemble du cosmos. La triple expression « fixés, écrits et gravés » conserve l’image de jugements établis et consignés.
    reason: cultural_note
lexical_decisions:
- source_word: ኢሖሩ፡ ባቲ
  choice: ne suivent pas cette voie
  rationale: Littéralement « ne marchent pas en elle ». En français courant, « suivre cette voie » conserve l’image de la conduite tout en rendant explicite l’antécédent féminin implicite du contexte.
- source_word: ትዝምድ
  choice: lignée
  rationale: Le terme désigne un groupe apparenté, une parenté ou une espèce. « Lignée » préserve ici l’idée de catégories de créatures liées entre elles sans imposer la taxonomie moderne.
- source_word: ሲኦል
  choice: séjour des morts
  rationale: Cette expression française rend le shéol comme domaine des morts sans l’identifier automatiquement à l’enfer au sens théologique ultérieur.
- source_word: መጽልም
  choice: lieu obscur
  rationale: Le nom désigne un lieu de ténèbres. « Lieu obscur » évite de répéter exactement « ténèbres » tout en conservant le champ lexical de l’obscurité.
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  choice: fixés, écrits et gravés
  rationale: La triple formulation est conservée afin de restituer l’image de décisions établies et inscrites de manière durable.
theological_decisions:
- issue: Sens de ሲኦል
  choice: séjour des morts
  alternative: Shéol / enfer
  rationale: « Séjour des morts » garde la portée cosmologique du terme sans introduire les connotations doctrinales plus tardives d’« enfer »; la translittération « Shéol » serait moins immédiatement accessible.
- issue: Référent de « leurs jugements »
  choice: tous leurs jugements
  alternative: tout est fixé
  rationale: Le texte transmis, vraisemblablement à lire ኵነኔሆሙ malgré une corruption graphique, maintient le vocabulaire judiciaire. La traduction conserve donc explicitement « jugements » plutôt que de généraliser en « tout ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe cumulative de l’énumération cosmologique et la triple image juridique finale ont été préservées, avec un allègement idiomatique des prépositions.
