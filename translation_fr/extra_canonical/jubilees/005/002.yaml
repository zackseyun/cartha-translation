  yaml_path: translation/extra_canonical/jubilees/005/002.yaml
  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: fr
  text: L’iniquité se multiplia sur la terre, et toute chair corrompit sa voie, depuis les humains jusqu’au bétail, aux bêtes sauvages, aux oiseaux et à tout ce qui se meut sur la terre. Tous corrompirent leurs voies et leurs ordonnances, et ils commencèrent à se dévorer les uns les autres. L’iniquité se multiplia sur la terre, et toute imagination des pensées de tous les êtres humains était ainsi mauvaise tous les jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: révolte contre la loi
  rationale: Le terme désigne ici la transgression ou le mépris de l’ordre légal, et non simplement un désordre abstrait. Cette formulation naturelle conserve la dimension volontaire de « lawlessness ».
- source_word: ኵሉ ዘሥጋ
  choice: toute chair
  rationale: Expression biblique collective englobant les êtres de chair; son maintien préserve le registre et le lien avec le récit du déluge.
- source_word: ፍኖት
  choice: voie
  rationale: Rend l’image de la conduite ou de la manière de vivre sans la réduire à un comportement ponctuel.
- source_word: ሥርዐት
  choice: l’ordre qui leur avait été assigné
  rationale: Le mot peut désigner l’ordre, la règle ou l’organisation prescrite. L’ajout explicatif fait comprendre qu’il s’agit de l’ordre propre à chaque catégorie de créatures.
- source_word: ይትበልዑ በበይናቲሆሙ
  choice: se dévorer les uns les autres
  rationale: Le contexte de corruption généralisée appelle le sens concret et violent de consommation mutuelle.
- source_word: ሕሊና አእምሮ
  choice: les pensées conçues
  rationale: Le binôme associe conception intérieure et pensée; cette traduction française concise conserve l’idée du produit de l’esprit.
- source_word: እጓለ እመሕያው
  choice: les êtres humains
  rationale: L’expression traditionnelle « enfants des hommes » désigne collectivement l’humanité. Une formulation moderne évite ici une lecture exclusivement masculine.
- source_word: ኵሉ መዋዕለ
  choice: chaque jour
  rationale: L’expression indique une continuité quotidienne, proche de « tous les jours » ou « constamment ».
theological_decisions:
- issue: Portée de « toute chair »
  choice: Conserver l’expression collective « toute chair » puis détailler humains et animaux.
  alternative: Remplacer directement par « tous les êtres vivants ».
  rationale: Le tour biblique maintient la solidarité de l’ensemble du monde animé dans la corruption sans imposer une définition théologique plus étroite.
- issue: Nature de la corruption des créatures
  choice: Traduire à la fois la corruption de leurs voies et celle de l’ordre assigné.
  alternative: Parler seulement de corruption morale.
  rationale: Le texte étend le dérèglement au comportement et à l’ordre propre des créatures; il ne faut pas réduire cette tension à la seule culpabilité humaine.
- issue: Anthropologie inclusive
  choice: Rendre l’expression idiomatique par « tous les êtres humains ».
  alternative: Conserver « tous les enfants des hommes ».
  rationale: Le sens collectif inclut toute l’humanité; la formulation moderne transmet cette portée sans ajouter de distinction doctrinale.
translation_notes:
  register: Français moderne, international et digne, avec maintien de l’expression biblique « toute chair ». Le parallélisme et la répétition de la révolte contre la loi sont conservés. La phrase est segmentée pour rester claire à la lecture publique.
