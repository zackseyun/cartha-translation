revisions:
- from: La révolte contre la loi s’accrut sur la terre, et toute chair corrompit sa voie, depuis les humains jusqu’au bétail, aux animaux sauvages, aux oiseaux et à tout ce qui se déplace sur la terre. Tous corrompirent leurs voies et l’ordre qui leur avait été assigné. Ils commencèrent à se dévorer les uns les autres. La révolte contre la loi s’accrut sur la terre, et toutes les pensées conçues par tous les êtres humains furent ainsi mauvaises, chaque jour.
  to: L’iniquité se multiplia sur la terre, et toute chair corrompit sa voie, depuis les humains jusqu’au bétail, aux bêtes sauvages, aux oiseaux et à tout ce qui se meut sur la terre. Tous corrompirent leurs voies et leurs ordonnances, et ils commencèrent à se dévorer les uns les autres. L’iniquité se multiplia sur la terre, et toute imagination des pensées de tous les êtres humains était ainsi mauvaise tous les jours.
  rationale: La révision conserve la structure répétitive et le registre biblique du passage, corrige la coordination française, restitue le pluriel de « ordonnances » et évite les ajouts interprétatifs. « Toute imagination des pensées » garde volontairement l’intensité du binôme source; « êtres humains » transmet la portée collective de l’expression sans masculin générique.
