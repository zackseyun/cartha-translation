  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
translation:
  language: fr
  text: Au quatrième mois, les sources du grand abîme furent fermées[a], et les écluses du ciel furent fermées. Au début du septième mois, toutes les ouvertures des abîmes de la terre s’ouvrirent, et les eaux commencèrent à descendre dans l’abîme inférieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation peut sembler paradoxale : après la fermeture des sources du grand abîme, les ouvertures des abîmes de la terre s’ouvrent, puis les eaux commencent à descendre dans l’abîme inférieur. La traduction conserve cette succession cosmologique sans chercher à l’harmoniser.'
    reason: textual_variant
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: les sources du grand abîme
  rationale: Rend l’expression cosmologique de manière traditionnelle et intelligible, en conservant le singulier « grand abîme ».
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: les écluses du ciel
  rationale: Expression française naturelle qui préserve l’image d’ouvertures célestes contrôlant les eaux.
- source_word: በሠርቀ፡ ወርኀ፡ ሳብዕ
  choice: Au début du septième mois
  rationale: Rend naturellement l’indication temporelle sans imposer la précision plus interprétative de « nouvelle lune ».
- source_word: አፈወ፡ መዓምቅተ፡ ምድር
  choice: toutes les ouvertures des abîmes de la terre
  rationale: « Ouvertures » exprime naturellement les « bouches » par lesquelles l’eau peut s’écouler, tout en maintenant la cosmologie du texte.
- source_word: ቀላይ፡ ታሕቲት
  choice: l’abîme inférieur
  rationale: Préserve la distinction spatiale explicite du texte entre les profondeurs terrestres et l’abîme situé en dessous.
theological_decisions:
- issue: Séquence cosmologique apparemment paradoxale
  choice: Conserver la fermeture des sources, puis l’ouverture des profondeurs pour permettre la descente des eaux
  alternative: Harmoniser les deux actions ou présenter la seconde ouverture comme une simple conséquence de la première
  rationale: Le texte distingue ces étapes; la traduction maintient cette tension sans reconstruire un mécanisme cosmologique absent de la formulation source.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué; les termes cosmologiques sont conservés plutôt que rationalisés.
