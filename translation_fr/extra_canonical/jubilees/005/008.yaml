  text: And he said, “My spirit shall not abide upon man forever, for they too are flesh; and their days shall be one hundred and twenty years.”
translation:
  language: fr
  text: 'Et il dit : « Mon esprit ne demeurera pas sur l’être humain pour toujours, car eux aussi sont chair ; leurs jours seront de cent vingt ans. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነብር (yənabbər)
  choice: demeurera
  rationale: Rend le sens de rester ou demeurer, tout en conservant le registre solennel de la déclaration.
- source_word: ዲበ (diba)
  choice: sur
  rationale: Traduit directement la préposition guèze « sur », sans l’harmoniser avec la formulation traditionnelle « dans l’être humain ».
- source_word: ሰብእ (sabʾ)
  choice: l’être humain
  rationale: Reproduit le singulier collectif du terme source dans un français moderne et inclusif.
- source_word: እሙንቱኒ (ʾəmuntu-ni)
  choice: eux aussi
  rationale: L’enclitique -ni exprime explicitement l’idée de « aussi » ou « également ».
- source_word: ሥጋ (śəga)
  choice: chair
  rationale: Conserve le terme concret et théologiquement chargé de la source, sans le paraphraser par « mortels ».
- source_word: መዋዕሊሆሙ (mawaʿəlihomu)
  choice: leurs jours
  rationale: Maintient l’expression sémitique de la durée de vie plutôt que de l’expliciter.
theological_decisions:
- issue: Rapport de l’esprit divin à l’être humain
  choice: « sur l’être humain »
  alternative: « dans l’être humain »
  rationale: La source guèze emploie diba, « sur », et non une préposition signifiant « dans » ; la traduction préserve donc cette représentation sans harmonisation avec Genèse 6.3 dans d’autres traditions textuelles.
- issue: Portée de la limite de cent vingt ans
  choice: « leurs jours seront de cent vingt ans »
  alternative: « il leur reste cent vingt ans »
  rationale: La formulation demeure ambiguë entre une limite de longévité et un délai avant le jugement, comme le texte source ; elle ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. Le passage du singulier collectif « l’être humain » au pluriel « eux » conserve la tension grammaticale et référentielle de la source. Le point-virgule distingue les deux affirmations sans préciser artificiellement leur lien logique.
