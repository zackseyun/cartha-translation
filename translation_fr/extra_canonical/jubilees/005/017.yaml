  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: fr
  text: Quant aux enfants d’Israël, il a été écrit et établi que, s’ils reviennent à lui dans la justice, il pardonnera toutes leurs transgressions et remettra tous leurs péchés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: les enfants d’Israël
  rationale: Rend littéralement l’expression filiale traditionnelle tout en restant naturelle dans un registre biblique français.
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: il a été écrit et établi
  rationale: Préserve les deux verbes passifs, le premier relatif à l’inscription et le second à l’établissement ou à l’ordonnance.
- source_word: ተመይጡ፡ ኀቤሁ
  choice: ils reviennent à lui
  rationale: Exprime le mouvement de retour vers Dieu sans expliciter davantage la notion de repentance.
- source_word: በጽድቅ
  choice: dans la justice
  rationale: Conserve la portée morale et théologique de « justice » sans la réduire à la sincérité ou à la droiture.
- source_word: የኀድግ፡ ኵሎ፡ አበሳሆሙ
  choice: il pardonnera toutes leurs transgressions
  rationale: « Pardonner » rend naturellement l’idée de laisser ou remettre, tandis que « transgressions » distingue ce terme du mot suivant pour les péchés.
- source_word: ይስሬ፡ ኵሎ፡ ኀጢአቶሙ
  choice: remettra tous leurs péchés
  rationale: « Remettre » maintient le parallélisme avec le pardon tout en évitant une répétition française plate.
theological_decisions:
- issue: Condition du pardon
  choice: s’ils reviennent à lui dans la justice
  alternative: s’ils se repentent devant lui avec droiture
  rationale: La formulation retenue conserve l’image source du retour vers Dieu et l’expression « dans la justice », sans transformer implicitement celles-ci en terminologie confessionnelle plus précise.
- issue: Référent du pronom divin
  choice: à lui / il, sans majuscule
  alternative: à Lui / Il
  rationale: Le référent divin ressort du contexte; les minuscules suivent l’usage courant du français moderne sans affaiblir le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La structure solennelle et le parallélisme de la source sont conservés, avec une ponctuation adaptée à la lecture française.
