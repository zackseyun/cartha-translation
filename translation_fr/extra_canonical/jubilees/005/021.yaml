lexical_decisions:
- source_word: አዘዞ፡ ለኖኅ
  choice: il ordonna à Noé
  rationale: Rend directement le verbe « ordonner » et son destinataire, tout en conservant le sujet pronominal tel qu’il apparaît dans le verset isolé.
- source_word: ይግበር፡ ሎቱ፡ ታቦተ
  choice: de se construire une arche
  rationale: Littéralement « qu’il fasse pour lui une arche » ; la tournure pronominale est naturelle en français et conserve l’idée que Noé doit la préparer pour lui-même.
- source_word: ከመ፡ ይድኀኖ
  choice: afin d’être sauvé
  rationale: Exprime la finalité et respecte la forme passive du salut, sans préciser un agent que le texte ne nomme pas ici.
- source_word: ማየ፡ አይኅ
  choice: les eaux du Déluge
  rationale: Rend l’expression « eaux du déluge » dans un français biblique courant ; la majuscule identifie l’événement particulier.
theological_decisions:
- issue: Agent du salut de Noé
  choice: être sauvé
  alternative: se sauver
  rationale: La formulation passive préserve l’idée du texte source sans attribuer explicitement le salut à l’action autonome de Noé ni nommer un agent absent de la proposition.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la sobriété du guèze et le référent implicite du pronom « il », déterminé par le contexte précédent.
