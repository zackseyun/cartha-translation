  text: And the fountains of the deep also sent up waters until the whole world was full of water.
translation:
  language: fr
  text: Et les sources de l’abîme firent elles aussi monter leurs eaux, jusqu’à ce que le monde entier soit rempli d’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ
  choice: les sources de l’abîme
  rationale: L’expression désigne les fontaines ou sources des profondeurs. « Abîme » restitue naturellement en français le réservoir profond associé au récit du déluge.
- source_word: ያዐርጉ፡ ማያተ
  choice: firent monter leurs eaux
  rationale: Le verbe exprime un mouvement ascendant; cette formulation conserve la causalité du texte et le pluriel possessif attendu avec « sources ».
- source_word: ኵሉ፡ ዓለም
  choice: le monde entier
  rationale: Rend directement la totalité exprimée par « tout » et « monde », sans réduire d’avance la portée géographique de l’énoncé.
- source_word: መልአ … ማየ
  choice: soit rempli d’eau
  rationale: Reproduit l’image selon laquelle le monde atteint un état de plénitude d’eau, dans une syntaxe française fluide après « jusqu’à ce que ».
theological_decisions:
- issue: Portée de « tout le monde »
  choice: le monde entier
  alternative: toute la terre
  rationale: Le texte peut évoquer le monde habité ou la terre dans son ensemble. « Le monde entier » préserve l’ampleur de l’affirmation sans ajouter une interprétation géographique ou doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « eau/eaux » est conservée, car elle appartient à l’insistance concrète du texte source.
