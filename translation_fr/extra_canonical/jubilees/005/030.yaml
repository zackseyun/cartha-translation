- source_word: አስተርአየ / አስተርአየት
  choice: apparurent / apparut
  rationale: Le verbe exprime le fait de devenir visible; la formulation française conserve la répétition et accorde le verbe avec chaque sujet.
- source_word: ምድር
  choice: la terre
  rationale: Le terme peut désigner la terre ou le sol; « la terre » préserve ici l’ampleur et l’ambiguïté du texte source.
