  text: And he said, “I will destroy man and all flesh upon the face of the earth, which I created.”
translation:
  language: fr
  text: 'Et il dit : « Je détruirai l’être humain et toute chair sur la face de la terre, que j’ai créée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቤ
  choice: il dit
  rationale: Rend directement le verbe narratif guèze au parfait, sans surinterpréter sa valeur discursive.
- source_word: አይመሰለ
  choice: je détruirai
  rationale: Dans ce contexte de jugement, le verbe exprime l’anéantissement ou l’effacement ; le futur français restitue la décision annoncée.
- source_word: ሰብእ
  choice: l’être humain
  rationale: Choix collectif et inclusif pour le terme désignant l’humanité, plus naturel en français moderne que « l’homme » dans ce sens générique.
- source_word: ኵሉ ዘሥጋ
  choice: toute chair
  rationale: Conserve l’expression sémitique traditionnelle et sa portée englobante pour les êtres de chair.
- source_word: በመልዕልተ ገጸ ምድር
  choice: sur la face de la terre
  rationale: Le préfixe በ- indique ici la position « sur », non le mouvement « de dessus » ; cette traduction évite l’harmonisation avec Genèse 6.7.
- source_word: ዘፈጠርኩ
  choice: que j’ai créée
  rationale: La relative se rattache grammaticalement à « la terre », nom féminin singulier immédiatement antécédent dans le texte transmis.
theological_decisions:
- issue: Référent de la proposition relative « que j’ai créée »
  choice: Accord avec « la terre »
  alternative: Rattachement à « toute chair » ou à l’ensemble « l’être humain et toute chair »
  rationale: L’antécédent immédiat ምድር (« terre ») et la forme relative singulière favorisent le rattachement à la terre ; la traduction garde cette syntaxe sans développer une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et lisible. « Toute chair » est maintenu pour préserver l’imagerie biblique, tandis que « l’être humain » évite l’ambiguïté contemporaine de « l’homme » employé au sens générique.
