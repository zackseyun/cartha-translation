  text: It has been written and ordained that mercy will be shown to all who turn from all their error[a], once each year.
translation:
  language: fr
  text: Il a été écrit et établi que miséricorde sera accordée à tous ceux qui se détournent de toutes leurs fautes, une fois chaque année.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « une fois chaque année » peut refléter la théologie calendaire des Jubilés, où l’expiation ou la miséricorde reviennent périodiquement. La périodicité demeure explicite plutôt que d’être généralisée.
    reason: cross_reference
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  choice: Il a été écrit et établi
  rationale: Les deux formes passives sont conservées. « Établi » rend l’idée d’une disposition fixée sans la connotation principalement impérative que pourrait avoir « ordonné » en français.
- source_word: ይትመሐር፡
  choice: il sera fait miséricorde
  rationale: La tournure impersonnelle exprime la miséricorde promise tout en évitant d’ajouter un sujet explicite absent de la formulation transmise.
- source_word: ተመይጡ፡ እምኵሉ፡ ጌጋዮሙ፡
  choice: se détournent de toutes leurs fautes
  rationale: « Se détournent » traduit le mouvement de retour ou d’abandon, tandis que « fautes » rend le champ de l’erreur et de l’égarement moral sans le réduire à une catégorie doctrinale particulière.
- source_word: ምዕረ፡ ለለ፡ ዓመት።
  choice: une fois chaque année
  rationale: La périodicité annuelle est maintenue explicitement, conformément à la formulation du texte et à son possible arrière-plan calendaire.
theological_decisions:
- issue: Agent de la miséricorde
  choice: Employer la tournure impersonnelle « il sera fait miséricorde »
  alternative: « Dieu fera miséricorde » ou « il leur fera miséricorde »
  rationale: Le texte ne nomme pas explicitement l’agent dans cette phrase; la traduction ne l’ajoute donc pas.
- issue: Portée de la condition
  choice: « tous ceux qui se détournent de toutes leurs fautes »
  alternative: « tous ceux qui se repentent de tous leurs péchés »
  rationale: La formulation retenue conserve l’image du détournement et le vocabulaire plus large de la faute ou de l’erreur, sans expliciter davantage la notion de repentance.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « il sera fait miséricorde » garde une légère solennité biblique tout en restant intelligible; elle préserve aussi l’absence d’agent explicite dans la source.
