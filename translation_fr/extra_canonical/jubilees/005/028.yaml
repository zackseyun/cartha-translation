lexical_decisions:
- source_word: ሖረት
  choice: poursuivit sa route
  rationale: Le verbe exprime le mouvement de l’arche; cette formulation naturelle évite le littéralisme peu idiomatique « alla » tout en conservant l’enchaînement avec son arrêt.
- source_word: አዕረፈት
  choice: vint reposer
  rationale: Rend l’idée que l’arche atteint son lieu de repos; « reposer » convient au mouvement qui prend fin sans ajouter de précision absente du texte.
- source_word: ዲበ፡ ርእሰ
  choice: au sommet de
  rationale: Littéralement « sur la tête de »; dans ce contexte topographique, l’expression désigne naturellement le sommet.
- source_word: ሉባር
  choice: Loubâr
  rationale: Translittération française du nom propre guèze, avec accent circonflexe pour signaler la voyelle longue de la forme transmise.
- source_word: አድባረ፡ አራራት
  choice: montagnes d’Ararat
  rationale: Conserve le pluriel du texte source et le toponyme traditionnel Ararat.
