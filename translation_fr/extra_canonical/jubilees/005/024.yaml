  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
translation:
  language: fr
  text: Le Seigneur ouvrit sept écluses du ciel et les ouvertures des sources du grand abîme — sept ouvertures en tout[a] —, et les écluses déversèrent l’eau du ciel pendant quarante jours et quarante nuits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sept bouches en nombre ». Le guèze désigne ainsi les ouvertures des sources du grand abîme et souligne leur nombre précis.'
    reason: cultural_note
lexical_decisions:
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: écluses du ciel
  rationale: Rend l’image d’ouvertures célestes qui libèrent les eaux, dans un français biblique clair et naturel.
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: les ouvertures des sources du grand abîme
  rationale: 'Préserve les éléments distincts du guèze : les ouvertures, les sources et le grand abîme.'
- source_word: በሰብዑ፡ አፈወ፡ በኍልቍ
  choice: sept ouvertures en tout
  rationale: Expression française naturelle qui conserve le dénombrement explicite; l’image littérale des « bouches » est signalée en note.
- source_word: ይውርዱ፡ ማየ፡ እምሰማይ
  choice: déversèrent l’eau du ciel
  rationale: Exprime avec naturel le mouvement descendant et abondant des eaux depuis le ciel.
theological_decisions:
- issue: Représentation cosmologique du déluge
  choice: Conserver les « écluses du ciel », les « sources » et le « grand abîme »
  alternative: Réduire l’ensemble à une description générale de pluies diluviennes
  rationale: Le texte présente délibérément plusieurs réservoirs et ouvertures cosmiques; les conserver évite d’aplanir son imagerie.
translation_notes:
  register: Français moderne, international et digne, avec une imagerie biblique conservée. La ponctuation en incise clarifie que « sept ouvertures en tout » précise le nombre des ouvertures du grand abîme.
