  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
translation:
  language: fr
  text: Il y entra dans la sixième année[a], au deuxième mois, à la nouvelle lune du deuxième mois, jusqu’au seizième jour. Il entra dans l’arche, lui et tout ce que nous lui avions amené, et le Seigneur la ferma de l’extérieur, le soir du dix-septième jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation chronologique de ce verset est difficile. La « sixième année » appartient vraisemblablement au système chronologique des Jubilés. La mention de la nouvelle lune, puis des seizième et dix-septième jours, situe l’entrée dans l’arche et sa fermeture peu avant le commencement du déluge.
    reason: segmentation_note
lexical_decisions:
- source_word: በሳድስ፡ ሎቱ
  choice: dans la sixième année
  rationale: Le guèze porte explicitement « sixième », dans la continuité de la chronologie propre au livre; il ne faut pas harmoniser avec la six-centième année de Genèse 7.
- source_word: በሠርቅ
  choice: à la nouvelle lune
  rationale: Le terme calendérique désigne la nouvelle lune; cette traduction conserve le vocabulaire caractéristique des Jubilés plutôt que de le réduire à « premier jour ».
- source_word: ዘአባእነ፡ ሎቱ
  choice: tout ce que nous lui avions amené
  rationale: Conserve la première personne du pluriel du verbe causatif et le pronom datif, malgré le changement soudain de voix narrative.
- source_word: ዐጸዎ፡ እግዚአብሔር፡ እንተ፡ አፍአሁ
  choice: le Seigneur la ferma de l’extérieur
  rationale: Rend directement l’action divine et l’indication spatiale « de l’extérieur ».
- source_word: በዐሡሩ፡ ወሰብዑ፡ ምሴተ
  choice: le soir du dix-septième jour
  rationale: Exprime naturellement en français la date ordinale et le moment du soir.
theological_decisions:
- issue: Rapport avec la six-centième année de Noé en Genèse 7
  choice: sixième année
  alternative: six-centième année
  rationale: La leçon guèze est « sixième » et relève de la chronologie interne des Jubilés; une harmonisation avec la Genèse modifierait le texte source.
- issue: Agent de la fermeture de l’arche
  choice: le Seigneur
  alternative: Dieu
  rationale: Reproduit le titre divin présent dans le texte sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe a été légèrement segmentée pour la lisibilité, tout en conservant l’étrangeté de la chronologie et le brusque « nous » du récit.
