base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: fr
  text: Lorsque les humains commencèrent à se multiplier sur la surface de la terre et que des filles leur naquirent, les anges de Dieu les virent, au cours d’une certaine année de ce jubilé, et constatèrent qu’elles étaient belles à regarder. Ils prirent pour femmes toutes celles qu’ils choisirent ; elles leur donnèrent des enfants, et ceux-ci furent les géants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: les humains
  rationale: L’expression guèze traditionnelle signifie littéralement « les enfants des hommes / de l’humanité ». « Les humains » restitue naturellement le référent collectif en français moderne sans marquage exclusivement masculin.
- source_word: መላእክተ፡ እግዚአብሔር
  choice: les anges de Dieu
  rationale: Traduction directe du syntagme guèze, conforme au témoin fourni ; elle ne remplace pas « anges » par une harmonisation avec Genèse 6.
- source_word: ሠናያት፡ ለርእይ
  choice: belles à regarder
  rationale: Rend l’idée visuelle explicite de beauté agréable à la vue, tout en conservant la formulation concrète de la source.
- source_word: ነሥእዎን፡ ሎሙ፡ አንስቲያ
  choice: Ils prirent pour femmes
  rationale: Expression française naturelle qui garde le sens matrimonial de « prendre [des femmes] pour eux-mêmes ».
- source_word: ረዐይት
  choice: les géants
  rationale: Le terme désigne ici les géants ; ce choix suit le sens contextuel du récit sans ajouter d’identification interprétative telle que « Nephilim ».
theological_decisions:
- issue: Identité des êtres qui prennent les femmes
  choice: les anges de Dieu
  alternative: les fils de Dieu
  rationale: Le texte guèze fourni porte explicitement « anges de Dieu ». La traduction conserve cette lecture propre à Jubilés plutôt que de l’harmoniser avec une autre forme textuelle de Genèse 6.
- issue: Référent final des géants
  choice: « ceux-ci » renvoie aux enfants nés de ces unions
  alternative: formulation susceptible de renvoyer aux anges
  rationale: La syntaxe et le déroulement narratif identifient les enfants comme les géants ; le démonstratif français rend ce lien sans développer davantage leur nature.
- issue: Choix des femmes
  choice: toutes celles qu’ils choisirent
  alternative: parmi toutes celles qu’ils choisirent
  rationale: La formulation conserve la portée potentiellement distributive de la source et son écho scripturaire, sans préciser si le choix fut limité par autre chose que leur volonté.
translation_notes:
  register: Français international moderne, narratif et digne. La longue période de la source est légèrement structurée par la ponctuation pour rester lisible, sans supprimer ses enchaînements. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
