  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: fr
  text: Il envoya une épée parmi eux, afin que chacun tue son compagnon. Ils commencèrent alors à s’entretuer, jusqu’à ce qu’ils tombent tous sous l’épée et soient effacés de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ
  choice: une épée
  rationale: Le nom est sans possessif explicite dans le texte guèze; l’indéfini respecte cette forme et évite d’ajouter « son épée ».
- source_word: ቢጹ
  choice: son compagnon
  rationale: Rend l’idée du compagnon ou du semblable sans la connotation biblique particulière que pourrait introduire « prochain ».
- source_word: ይቅትሉ ዝንቱ ዘንተ
  choice: s’entretuer
  rationale: Expression française naturelle pour l’action réciproque « se tuer l’un l’autre ».
- source_word: ተደምሰሱ እምነ ምድር
  choice: soient rayés de la terre
  rationale: Conserve l’image d’une disparition totale de la surface de la terre, tout en restant idiomatique en français moderne.
theological_decisions:
- issue: Identité du sujet de « envoya »
  choice: Conserver le pronom « Il » sans explicitation
  alternative: Nommer Dieu comme sujet
  rationale: Le verset fourni n’explicite pas le référent; le nommer résoudrait une référence contextuelle au-delà du texte de ce verset.
- issue: Agentivité dans la destruction mutuelle
  choice: Maintenir à la fois l’envoi de l’épée et l’action réciproque des êtres concernés
  alternative: Présenter leur mort comme une exécution divine directe
  rationale: Le texte juxtapose ces deux aspects; la traduction préserve cette tension sans l’expliquer ni l’atténuer.
translation_notes:
  register: Français international moderne, narratif et digne. La structure reste proche du guèze, avec une légère segmentation en deux phrases pour la clarté. Aucun marqueur de note n’est requis.
