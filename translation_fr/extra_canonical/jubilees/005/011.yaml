  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: fr
  text: Et il les fit tous disparaître de leurs lieux, et il n’en resta pas un seul qu’il n’eût jugé selon toute leur méchanceté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ
  choice: Et il les extermina
  rationale: Le verbe exprime une destruction complète. « Extermina » rend cette force dans un registre narratif digne, sans ajouter le moyen de la destruction.
- source_word: ኵሉ፡ እመካኖሙ
  choice: tous de leurs lieux
  rationale: Cette formulation conserve la référence explicite à leurs lieux et l’étrangeté relative du tour source, plutôt que de l’aplanir en « partout » ou « de la terre ».
- source_word: ወኢተርፈ፡ አሐዱ፡ እምኔሆሙ
  choice: et il n’en resta pas un seul
  rationale: Rend naturellement en français l’idée qu’aucun d’entre eux ne subsista.
- source_word: ዘአኰነነ
  choice: qu’il n’eût jugé
  rationale: Le subjonctif plus-que-parfait s’accorde avec la construction négative « pas un seul que » et marque que le jugement accompagne ou précède l’extermination.
- source_word: በኵሉ፡ እኪዮሙ
  choice: selon toute leur méchanceté
  rationale: « Méchanceté » rend le mal moral collectif; « selon » préserve l’idée que le jugement correspond à l’ensemble de leurs actes mauvais.
theological_decisions:
- issue: Rapport entre jugement et destruction
  choice: Conserver les deux actions distinctes et leur articulation sans expliciter davantage leur chronologie.
  alternative: Traduire comme si la destruction constituait elle-même tout le jugement.
  rationale: Le texte nomme à la fois la destruction et le jugement; la traduction ne doit ni les confondre ni imposer une construction théologique absente de la formulation source.
translation_notes:
  register: Français moderne, soutenu mais accessible. La tournure « de leurs lieux » est volontairement proche de la source; « qu’il n’eût jugé » maintient avec précision la relation temporelle et logique, dans un registre littéraire adapté à un texte ancien.
