  text: And on the twenty-seventh thereof he opened the ark and sent out from it beasts and cattle and birds and everything that moves.
translation:
  language: fr
  text: Et le vingt-septième jour de ce mois-là, il ouvrit l’arche et en fit sortir les bêtes sauvages, les animaux domestiques, les oiseaux et tout ce qui se déplace.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ዕሥራ፡ ወሰብዑ፡ ሎቱ
  choice: le vingt-septième jour de ce mois-là
  rationale: La tournure éthiopienne indique le vingt-septième jour de la période déjà mentionnée. L’ajout de « jour » et « de ce mois-là » rend explicite en français naturel le référent implicite de « thereof » dans la couche anglaise.
- source_word: አርኀዋ፡ ለታቦት
  choice: il ouvrit l’arche
  rationale: Traduction directe et naturelle du verbe « ouvrir » avec l’arche comme objet.
- source_word: ወፈነወ፡ እምውስቴታ
  choice: et en fit sortir
  rationale: Le verbe peut signifier envoyer ou laisser partir. Dans le contexte de l’arche, « fit sortir » exprime naturellement le mouvement depuis son intérieur sans ajouter l’idée d’une mission.
- source_word: አራዊተ፡ ወእንስሳ
  choice: les bêtes sauvages, les animaux domestiques
  rationale: Cette distinction conserve les deux catégories animales du texte, plutôt que de les fondre dans un terme générique.
- source_word: ወአዕዋፈ፡ ወዘይትነወስ
  choice: les oiseaux et tout ce qui se déplace
  rationale: « Oiseaux » rend directement la première catégorie; « tout ce qui se déplace » garde la portée générale et le mouvement exprimés par la dernière formule.
