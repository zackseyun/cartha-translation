  text: Concerning all, he will judge the great according to his greatness, and the small according to his smallness, and each one according to his way.
translation:
  language: fr
  text: Quant à tous, il jugera le grand selon sa grandeur, le petit selon sa petitesse, et chacun selon sa conduite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዐቢይ፡ በከመ፡ ዐበየ
  choice: le grand selon sa grandeur
  rationale: Reproduit le parallélisme et la répétition étymologique du guèze sans préciser indûment la nature de la grandeur.
- source_word: ወለንኡስሂ፡ በከመ፡ ንእሰ
  choice: le petit selon sa petitesse
  rationale: Conserve la symétrie avec « le grand selon sa grandeur » et l’indétermination du texte source.
- source_word: ፍኖቱ
  choice: sa conduite
  rationale: Le nom peut désigner la voie ou le chemin au sens concret ou figuré ; dans ce contexte judiciaire, « conduite » exprime naturellement la manière de vivre tout en restant proche du sens figuré.
- source_word: ይኴንኖ
  choice: il jugera
  rationale: Rend directement le verbe de jugement et conserve la valeur future donnée par la forme contextuelle.
theological_decisions:
- issue: Critère du jugement
  choice: Conserver les trois formulations parallèles sans les expliquer
  alternative: Expliciter un jugement proportionné au rang, aux capacités ou aux œuvres de chacun
  rationale: Le texte affirme une proportion entre la personne et le jugement, mais n’en définit pas précisément le fondement ; une explicitation résoudrait une ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et accessible. La structure ternaire du guèze est maintenue, ainsi que l’opposition entre le grand et le petit. « À l’égard de tous » est retenu pour rendre l’ouverture thématique sans lourdeur excessive.
