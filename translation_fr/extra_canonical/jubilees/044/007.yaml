  text: And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.
translation:
  language: fr
  text: Ses fils et les fils de ses fils se mirent en route. Ils placèrent leur père et leurs biens sur des chariots. Israël partit du Puits du Serment[a], le seizième jour de ce troisième mois, et se rendit en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Beer-Shéba.
    reason: Donne au lecteur le toponyme biblique usuel tout en conservant dans le texte principal le sens exprimé par le guèze.
lexical_decisions:
- source_word: ወተንሥኡ
  choice: se mirent en route
  rationale: Le verbe signifie littéralement « se levèrent », mais, dans ce récit de départ, cette formulation française exprime naturellement la mise en mouvement.
- source_word: ውሉዱ፡ ወውሉደ፡ ውሉዱ
  choice: ses fils et les fils de ses fils
  rationale: Conserve la formulation généalogique explicite du guèze plutôt que de la réduire au seul mot « descendants ».
- source_word: ወአጽዐኑ
  choice: firent monter leur père et chargèrent leurs biens
  rationale: Le verbe évoque le fait de placer ou charger sur un moyen de transport; la tournure française distingue naturellement les personnes des biens.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Puits du Serment
  rationale: Traduit le sens du toponyme tel qu’il apparaît dans le texte, tout en signalant en note son nom usuel.
- source_word: ብሔረ፡ ግብጽ
  choice: en Égypte
  rationale: Rend idiomatiquement « vers/au pays d’Égypte » sans alourdir la phrase.
