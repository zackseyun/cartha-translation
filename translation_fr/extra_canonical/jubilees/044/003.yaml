  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
translation:
  language: fr
  text: 'Alors qu’il envisageait d’envoyer dire à Joseph de venir auprès de lui et de ne pas descendre lui-même, il resta là sept jours, afin de savoir par une vision s’il devait rester ou descendre.[a] Il célébra la fête de la récolte des prémices avec du vieux grain, car, dans tout le pays de Canaan, il n’y avait pas même une poignée de semence dans le sol : la famine sévissait parmi toutes les bêtes sauvages, le bétail, les oiseaux et aussi les humains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze transmis est difficile dans cette phrase. Il semble indiquer que Jacob attendit sept jours une vision qui lui montrerait s’il devait rester ou descendre, et qu’il célébra la fête avec du vieux grain alors qu’il n’y avait plus de semence dans le pays.
    reason: textual_variant
lexical_decisions:
- source_word: ይልአክ፡ ለዮሴፍ፡ ከመ፡ ይምጻእ፡ ኀቤሁ
  choice: d’envoyer chercher Joseph pour qu’il vienne auprès de lui
  rationale: Exprime naturellement en français le projet de faire venir Joseph, tout en restant proche de la construction guèze « envoyer à Joseph afin qu’il vienne auprès de lui ».
- source_word: ሰቡዐ፡ ዕለተ
  choice: sept jours
  rationale: Rendu direct de la durée indiquée.
- source_word: ይርአይ፡ ራእየ
  choice: voir dans une vision
  rationale: Conserve explicitement le moyen visionnaire sans préciser davantage sa nature.
- source_word: በዓለ፡ ማእረረ፡ ቀዳሚ፡ ፍሬ
  choice: la fête de la récolte des prémices
  rationale: Préserve à la fois « fête », « récolte » et « prémices », présents dans le texte source.
- source_word: እምሥርናይ፡ ብሉይ
  choice: du grain de l’année précédente
  rationale: 'Rend le sens de « vieux grain » dans un français clair : il s’agit du grain conservé de la récolte antérieure.'
- source_word: ዐባር
  choice: la famine
  rationale: Le terme désigne la famine et doit être exprimé dans la dernière proposition.
- source_word: አራዊት፡ ለእንሳ፡ ወለአዕዋፍ፡ ወለሰብእኒ
  choice: toutes les bêtes, sur le bétail, sur les oiseaux et aussi sur les humains
  rationale: Maintient les quatre groupes et la portée universelle de la famine.
theological_decisions:
- issue: Fonction de la vision attendue
  choice: « afin de voir dans une vision s’il devait rester ou descendre »
  alternative: Préciser qu’il attendait une confirmation divine
  rationale: Le texte mentionne une vision et l’alternative rester/descendre, mais n’explicite pas davantage l’interprétation théologique de cette vision.
- issue: Nature de la fête
  choice: « la fête de la récolte des prémices »
  alternative: « la fête des Prémices » comme titre cultuel fixé
  rationale: La formulation descriptive préserve les éléments lexicaux du guèze sans imposer une identification liturgique plus précise que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement clarifiée pour être naturelle, tout en conservant l’hésitation de Jacob, l’attente d’une vision, la mention complète de la fête et l’effet général de la famine.
