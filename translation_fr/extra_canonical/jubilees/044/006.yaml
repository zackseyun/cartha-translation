  yaml_path: translation/extra_canonical/jubilees/044/006.yaml
  text: I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hands on your eyes. Do not fear; go down into Egypt.”
translation:
  language: fr
  text: 'Je descendrai avec toi et je te ferai assurément remonter. Tu seras enterré dans ce pays, et Joseph posera ses mains[a] sur tes yeux. N’aie pas peur : descends en Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une tradition textuelle parallèle lit « sa main » ; le texte traduit porte le pluriel « ses mains ».
    reason: Situe correctement la variante de nombre tout en préservant la lecture plurielle du guèze.
lexical_decisions:
- source_word: እወርድ፡ ምስሌከ
  choice: Je descendrai avec toi
  rationale: Reproduit directement la promesse de présence divine exprimée par le verbe « descendre » et la préposition « avec ».
- source_word: አወጽአከ
  choice: je te ferai aussi remonter
  rationale: Le causatif exprime l’action de faire sortir ou remonter; « remonter » conserve le mouvement opposé à la descente en Égypte et convient au contexte.
- source_word: በዛቲ፡ ምድር
  choice: dans ce pays
  rationale: Dans ce contexte géographique, « pays » est plus naturel en français que « terre », tout en conservant le démonstratif.
- source_word: እዴሁ፡ ዲበ፡ አዕይንቲከ
  choice: ses mains sur tes yeux
  rationale: Le pluriel « mains » préserve la lecture attestée dans la tradition textuelle reflétée ici; l’expression désigne le geste de fermer les yeux du défunt.
- source_word: ኢትፍራህ፡ ረድ
  choice: 'N’aie pas peur : descends'
  rationale: Rend les deux impératifs sans ajouter de lien causal absent du texte.
theological_decisions:
- issue: Portée de la promesse « te faire remonter »
  choice: Conserver la formulation personnelle sans préciser si elle vise Jacob, sa dépouille ou sa descendance
  alternative: Expliciter un retour de la descendance d’Israël hors d’Égypte
  rationale: Le texte maintient une tension entre la promesse faite à Jacob et l’annonce immédiate de son ensevelissement; la traduction ne doit pas résoudre cette ambiguïté.
- issue: Présence divine en Égypte
  choice: Traduire littéralement « Je descendrai avec toi »
  alternative: Paraphraser par « Je serai avec toi en Égypte »
  rationale: Le langage spatial fait écho à l’ordre de descendre en Égypte et doit être conservé.
translation_notes:
  register: Français international moderne, digne et direct. Le discours divin conserve son parallélisme et ses images spatiales. La ponctuation française clarifie la dernière exhortation sans en modifier la force.
