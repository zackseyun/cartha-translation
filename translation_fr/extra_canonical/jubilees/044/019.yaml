  text: 'And sons were born to Joseph in Egypt before his father came into Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.'
translation:
  language: fr
  text: 'Avant que son père n’arrive en Égypte, Joseph y eut deux fils, que lui donna Aséneth, fille de Potiphar, prêtre d’Héliopolis : Manassé et Éphraïm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተወልዱ፡ ለዮሴፍ
  choice: Joseph y eut deux fils
  rationale: Rend naturellement en français la tournure passive guèze « furent engendrés/nés à Joseph », le nombre étant explicité à la fin du segment source.
- source_word: ዘእንበለ፡ ይባእ፡ አቡሁ፡ ውስተ፡ ግብፅ
  choice: Avant que son père n’arrive en Égypte
  rationale: Conserve la relation temporelle et le mouvement vers l’Égypte sans donner à « entrer » un relief inutile.
- source_word: ዘወለደት፡ ሎቱ
  choice: que lui donna
  rationale: Expression française naturelle pour « qu’elle lui enfanta », sans modifier la filiation maternelle.
- source_word: አስኔት
  choice: Aséneth
  rationale: Forme française traditionnelle et reconnaissable du nom propre.
- source_word: ጶጢፋራ
  choice: Potiphar
  rationale: Transcription française biblique usuelle du nom transmis par le texte.
- source_word: ካህን፡ ዘኤልዮጶሊስ
  choice: prêtre d’Héliopolis
  rationale: Rend directement le titre cultuel et le toponyme du texte source.
- source_word: ምናሴ፡ ወኤፍሬም፡ ፪
  choice: Manassé et Éphraïm
  rationale: Les deux noms rendent déjà explicite le total final « deux » ; l’intégrer dans « deux fils » évite une finale comptable peu naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été réorganisée pour éviter une longue relative ambiguë et pour rattacher sans équivoque Aséneth à la naissance des deux fils, tout en conservant les données du guèze.
