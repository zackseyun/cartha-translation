lexical_decisions:
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: Onze
  rationale: Rend directement le nombre composé guèze « dix et un », qui achève manifestement le décompte précédent.
- source_word: ኵሉ፡ ነፍስ፡ ዘራሔል
  choice: Toutes les personnes de Rachel
  rationale: Dans ce contexte généalogique, ነፍስ désigne des personnes comptées; la formulation conserve le lien littéral avec Rachel sans préciser davantage la nature de ce lien.
- source_word: ዐሠርቱ፡ ወአርባዕቱ
  choice: au nombre de quatorze
  rationale: Expression française naturelle du total indiqué par le guèze « dix et quatre ».
- source_word: ወውሉደ፡ ባላ፡ ላእከታ
  choice: 'Et les fils de Bilha, sa servante :'
  rationale: ውሉደ désigne ici les fils ou descendants introduits dans la liste; ላእከታ signifie « sa servante » et non « moururent ». Le deux-points restitue la fonction introductive de la proposition fragmentaire.
