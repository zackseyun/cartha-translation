  text: 'Et les fils que Bilha, l’esclave de Rachel, la femme de Jacob, enfanta à Jacob : Dan et Nephtali.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላእከታ
  choice: l’esclave
  rationale: Le terme désigne ici une servante en condition de dépendance; « esclave » rend explicitement ce statut sans l’atténuer.
- source_word: ብእሲቱ፡ ለያዕቆብ
  choice: femme de Jacob
  rationale: 'Cette expression qualifie Rachel, conformément à la syntaxe du passage : Bilha est l’esclave de Rachel, laquelle est la femme de Jacob.'
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: qu’elle donna à Jacob
  rationale: Le verbe signifie littéralement « enfanta pour Jacob »; en français naturel, « donna à Jacob » conserve l’idée d’une descendance attribuée à Jacob dans cette construction familiale.
theological_decisions:
- issue: Statut de Bilha et relation avec Jacob
  choice: « l’esclave de Rachel […] qu’elle donna à Jacob »
  alternative: « la servante de Rachel […] qu’elle enfanta à Jacob »
  rationale: La traduction ne masque pas le statut servile de Bilha, tout en évitant de présenter l’expression comme une qualification théologique ou morale de la relation.
translation_notes:
  register: Français moderne, sobre et digne. La structure généalogique concise est conservée; l’apposition « femme de Jacob » est rattachée sans ambiguïté à Rachel.
