  text: 'And Israel set out from Add a footnote: "Ge''ez reads *Haran*, a likely scribal error for *Hebron*.", from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.'
translation:
  language: fr
  text: Israël partit de Harân[a], de sa maison, à la nouvelle lune du troisième mois. Il prit le chemin du Puits du Serment et, le septième jour de ce mois, il offrit un sacrifice au Dieu de son père Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze lit « Harân », probablement par erreur de copiste pour « Hébron ».
    reason: 'La leçon transmise est géographiquement difficile : Jacob part ici de sa demeure en Canaan et passe par Beer-Shéba en route vers l’Égypte; Hébron convient au contexte.'
lexical_decisions:
- source_word: ተንሥአ
  choice: partit
  rationale: Le verbe signifie littéralement « se lever », mais, avec le complément de provenance et le mouvement qui suit, il exprime ici le départ.
- source_word: ካራን
  choice: Harân
  rationale: Le texte guèze transmis porte Harân. Cette leçon est conservée dans le corps du texte, tandis que la difficulté contextuelle est signalée en note.
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: à la nouvelle lune du troisième mois
  rationale: « Lever du mois » désigne idiomatiquement la nouvelle lune, c’est-à-dire le commencement du mois.
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  choice: le chemin du Puits du Serment
  rationale: Rendu formel du toponyme descriptif correspondant à Beer-Shéba, sans remplacer silencieusement sa forme sémantique par le nom hébreu usuel.
- source_word: ሦዐ፡ መሥዋዕተ
  choice: offrit un sacrifice
  rationale: Expression française naturelle qui conserve explicitement l’acte sacrificiel.
theological_decisions:
- issue: Désignation de Dieu par rapport à Isaac
  choice: au Dieu de son père Isaac
  alternative: à Dieu, le Dieu de son père Isaac
  rationale: Le guèze présente directement « le Dieu de son père Isaac »; la formulation retenue en conserve la relation d’alliance sans ajouter une apposition absente.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe a été légèrement réorganisée afin de rattacher sans ambiguïté « le septième jour » à l’offrande. Le marqueur [a] figure immédiatement après la leçon textuellement incertaine.
