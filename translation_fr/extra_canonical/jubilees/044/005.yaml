  text: And he said to him, “I am the God of your fathers, the God of Abraham and Isaac. Do not fear; go down into Egypt, for there I will make you into a great nation.”
translation:
  language: fr
  text: 'Il lui dit : « Je suis le Dieu de tes pères[a], le Dieu d’Abraham et d’Isaac. N’aie pas peur ; descends en Égypte, car là-bas je ferai de toi une grande nation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton père ».
    reason: La forme textuelle peut être comprise au singulier, mais la mention explicite d’Abraham et d’Isaac favorise le pluriel retenu dans le texte.
lexical_decisions:
- source_word: አምላከ፡ አቡከ
  choice: le Dieu de tes pères
  rationale: Le contexte explicite immédiatement Abraham et Isaac et la tradition textuelle de Jubilés soutient ici le pluriel; la possibilité d’un singulier est néanmoins signalée en note.
- source_word: ኢትፍራህ
  choice: N’aie pas peur
  rationale: Expression française naturelle et directe correspondant à l’interdiction de craindre.
- source_word: ወሪደ፡ ግብጽ
  choice: de descendre en Égypte
  rationale: Conserve l’image géographique et narrative traditionnelle de la descente en Égypte.
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስየከ
  choice: je ferai de toi une grande nation
  rationale: Rend idiomatiquement la transformation promise de Jacob en un grand peuple, avec « nation » adapté au contexte généalogique.
theological_decisions:
- issue: Singulier ou pluriel dans « le Dieu de ton/tes père(s) »
  choice: tes pères
  alternative: ton père
  rationale: La mention coordonnée d’Abraham et d’Isaac favorise le pluriel dans Jubilés, sans effacer la forme susceptible d’être comprise ou transmise au singulier.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse divine individuelle à Jacob; la formulation conserve la solennité de la promesse sans archaïsme.
