  text: And Asudi, and Iyak, and Solomon were six. And they died in the year they entered Egypt, and there remained to Dan
translation:
  language: fr
  text: Asudi, Iyak et Salomon étaient au nombre de six. Ils moururent l’année où ils entrèrent en Égypte, et il resta à Dan…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase se poursuit vraisemblablement au verset suivant. Autre traduction possible, mais moins conforme à la construction guèze : « et Dan resta ».'
    reason: La proposition finale est syntaxiquement suspendue à la fin du verset, tandis que la tradition antérieure comprend parfois Dan comme sujet.
lexical_decisions:
- source_word: አሱዲ፡ ወኢያክ፡ ወስሎሞን
  choice: Asudi, Iyak et Salomon
  rationale: Les noms propres sont transcrits au plus près du guèze, sauf Salomon, dont la forme française est bien établie.
- source_word: ሲድስቱ
  choice: étaient au nombre de six
  rationale: Cette tournure française exprime naturellement le nombre collectif tout en conservant le lien avec le contexte précédent.
- source_word: በዓመተ፡ ቦኡ፡ በግብጽ
  choice: l’année où ils entrèrent en Égypte
  rationale: Rend directement l’indication temporelle du texte source.
- source_word: ወተርፈ፡ ለዳን
  choice: et il resta à Dan
  rationale: Le verbe est intransitif et la préposition marque Dan comme bénéficiaire ou possesseur, non comme sujet. La formulation volontairement suspendue respecte la coupure du verset.
theological_decisions:
- issue: Identité du sujet de « resta »
  choice: 'Sujet impersonnel ou reporté : « il resta à Dan »'
  alternative: « et Dan resta »
  rationale: La construction guèze avec ለ (« à/pour ») indique que Dan n’est vraisemblablement pas le sujet. Traduire « Dan resta » résoudrait indûment l’ambiguïté grammaticale et contextuelle.
translation_notes:
  register: Français moderne, digne et lisible. Le passé simple convient au registre narratif. La syntaxe inachevée de la dernière proposition est conservée afin de respecter la délimitation du verset et la construction du texte source.
