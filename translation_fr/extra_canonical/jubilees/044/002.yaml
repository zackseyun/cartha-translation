lexical_decisions:
- source_word: ተዘከረ
  choice: se souvint
  rationale: Rend directement le verbe de mémoire au passé narratif, dans un français naturel et digne.
- source_word: ሕልመ፡ ዘርእየ
  choice: du rêve qu’il avait eu
  rationale: Littéralement « le rêve qu’il avait vu » ; en français courant, on dit plus naturellement « avoir un rêve ». Le plus-que-parfait marque clairement l’antériorité.
- source_word: በቤቴል
  choice: à Béthel
  rationale: Transcription française traditionnelle du nom de lieu, avec la préposition locative appropriée.
- source_word: ፈርሀ
  choice: eut peur
  rationale: Exprime simplement et naturellement la peur éprouvée par Jacob, sans ajouter de motif.
- source_word: ፈደ፡ ውስተ፡ ግብጽ
  choice: de descendre en Égypte
  rationale: Conserve le mouvement géographique et narratif exprimé par « descendre », avec l’usage français « en Égypte ».
theological_decisions:
- issue: Rapport entre le rêve de Béthel et la peur de Jacob
  choice: Maintenir une simple coordination sans expliciter de lien causal
  alternative: « et, à cause de cela, il eut peur… »
  rationale: Le texte juxtapose le souvenir du rêve et la peur de descendre en Égypte sans préciser explicitement que le premier cause la seconde.
translation_notes:
