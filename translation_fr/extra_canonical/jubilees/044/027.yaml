  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
translation:
  language: fr
  text: 'Toutes les personnes issues de Jacob qui entrèrent en Égypte étaient au nombre de soixante-dix. Ce sont donc ses fils et les fils de ses fils : tous ceux qui moururent en Égypte étaient au nombre de soixante-quinze[a], à l’exclusion de Joseph et de ses deux fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le calcul du chapitre n’est pas simple : il parle de soixante-dix personnes entrées en Égypte, puis de soixante-quinze fils et petits-fils morts en Égypte. Le texte exclut Joseph et ses deux fils de cette dernière mention.'
    reason: cross_reference
lexical_decisions:
- source_word: መንፈስ (manfas)
  choice: personnes
  rationale: Dans ce dénombrement généalogique, le terme désigne les individus comptés, selon un emploi sémitique comparable à « âmes » ; « personnes » est naturel et exact en français moderne.
- source_word: ውሉደ፡ ውሉዱ
  choice: les fils de ses fils
  rationale: Rend formellement la relation généalogique exprimée par le guèze, sans la généraliser en « descendants ».
- source_word: ሰብዓ / ሰብዓ፡ ወኃምስቱ
  choice: soixante-dix / soixante-quinze
  rationale: Conserve tels quels les deux totaux distincts du texte source au lieu de chercher à les harmoniser.
theological_decisions:
- issue: Écart apparent entre les totaux de soixante-dix et de soixante-quinze
  choice: Maintenir les deux chiffres dans le corps du texte et signaler la difficulté en note
  alternative: Harmoniser le premier total avec le second ou expliquer l’écart directement dans la traduction
  rationale: Le texte présente délibérément les deux nombres ; les résoudre dans la traduction supprimerait une tension textuelle authentique.
translation_notes:
  register: Français international moderne, clair et digne. « Personnes de la famille de Jacob » évite l’expression aujourd’hui obscure « âmes de Jacob », tandis que « les fils de ses fils » préserve la formulation généalogique du texte.
