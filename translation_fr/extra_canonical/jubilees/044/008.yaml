  yaml_path: translation/extra_canonical/jubilees/044/008.yaml
  text: And Israel sent Judah before him to his son Joseph, so that he might examine the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was the best of the land of Egypt, and near to him, for all of them and for their livestock.
translation:
  language: fr
  text: Israël envoya Juda devant lui auprès de son fils Joseph, afin qu’il examine[a] le pays de Goshen. C’était là, en effet, que Joseph avait dit à ses frères de venir habiter, pour qu’ils soient près de lui. Cette région était la meilleure partie[b] du pays d’Égypte et elle était proche de lui, pour eux tous comme pour leurs troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le reconnaisse »; selon une autre interprétation : « le prépare ».'
    reason: Le verbe guèze privilégie l’idée d’examiner ou de reconnaître, mais la tradition parallèle de Genèse 46.28 a aussi conduit au sens « préparer ».
  - marker: b
    text: 'Autre traduction possible : « elle était bonne dans le pays d’Égypte ».'
    reason: La construction peut être comprise comme une appréciation simple, même si le contexte et l’usage idiomatique favorisent le sens superlatif retenu dans le texte.
lexical_decisions:
- source_word: ያስተዳሉ (yāstadāllu)
  choice: qu’il examine
  rationale: Le verbe exprime ici l’idée d’examiner, de reconnaître ou d’inspecter le pays; « examine » suit le choix lexical guèze sans harmoniser avec la formulation « préparer » de certaines versions de Genèse 46.28.
- source_word: ሠናይት (śannāyt)
  choice: la meilleure partie
  rationale: Dans ce contexte, l’adjectif qualifie Goshen comme une région particulièrement bonne, voire la meilleure partie du pays d’Égypte; l’ajout de « partie » rend naturellement en français le référent territorial implicite.
- source_word: ለእንስሳሂ (la-’ənsəsāhi)
  choice: pour leurs troupeaux
  rationale: Le terme désigne les animaux domestiques; « troupeaux » est le rendu français naturel dans le contexte du déplacement de la famille de Jacob.
theological_decisions: []
translation_notes:
