  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
translation:
  language: fr
  text: '[Voici les noms des fils de Bilha, la servante] de Rachel, femme de Jacob, qu’elle enfanta à Jacob : Dan et Nephtali. Voici les noms de leurs enfants qui vinrent avec eux en Égypte : les fils de Dan : Hushim et Samon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘወለደት
  choice: qu’elle enfanta
  rationale: Le verbe est actif et féminin ; ce choix conserve l’attribution de la maternité à Bilha, rétablie par le complément entre crochets, plutôt que de faire de Rachel la mère de Dan et Nephtali.
- source_word: ውሉዶሙ
  choice: leurs enfants
  rationale: Rend le pluriel avec suffixe possessif et prépare naturellement l’énumération des descendants venus en Égypte.
- source_word: ሑሲም
  choice: Houshim
  rationale: Transcription française claire du nom propre guèze, conforme à l’usage biblique francophone courant.
- source_word: ሳሞን
  choice: Samon
  rationale: Transcription directe du nom propre tel qu’il figure dans le témoin guèze.
theological_decisions:
- issue: Identité de la mère de Dan et Nephtali malgré le début tronqué du segment guèze fourni
  choice: Rétablir entre crochets Bilha comme sujet de « qu’elle enfanta »
  alternative: 'Traduire passivement : « À Rachel… naquirent Dan et Nephtali »'
  rationale: Le féminin singulier actif ዘወለደት appelle un antécédent féminin. Le contexte généalogique identifie Bilha, servante de Rachel, comme mère de Dan et Nephtali ; les crochets signalent honnêtement que ces mots ne figurent pas dans le segment transmis ici.
translation_notes:
  register: Français moderne, international et digne. La syntaxe généalogique reste proche du guèze tout en étant naturelle. Les crochets et la note préservent la transparence textuelle ; les noms suivent des formes lisibles en français.
