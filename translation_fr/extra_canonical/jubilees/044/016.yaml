  text: 'And the sons of Zilpah[16], Leah’s maidservant, whom she bore to Jacob: Gad and Asher. And these are the names of their sons who came with him into Egypt. The sons of Gad: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli—seven.'
translation:
  language: fr
  text: 'Les fils de Zilpa, la servante de Léa, femme de Jacob, qu’elle enfanta à Jacob, étaient Gad et Aser. Voici les noms de leurs fils qui entrèrent avec lui en Égypte : les fils de Gad étaient Tsephon, Haggui, Shouni, Etsbôn, Éri, Arodi et Areéli[a] : sept en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le découpage fourni, un nom de cette liste est partiellement masqué. « Areéli » suit la restitution la plus probable d’après la tradition guèze et la liste parallèle de la Genèse.
    reason: Incertitude matérielle du texte source fourni.
lexical_decisions:
- source_word: ላእከታ
  choice: servante
  rationale: Le terme désigne ici la servante attachée à Léa; « servante » est naturel et dignifié en français moderne.
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: qu’elle donna à Jacob
  rationale: Dans ce contexte généalogique, cette formulation française rend naturellement l’idée que Zilpa donna ces fils à Jacob, sans alourdir la phrase par une répétition de « enfanter ».
- source_word: ቦኡ፡ ምስሌሁ፡ ውስተ፡ ግብፅ
  choice: entrèrent avec lui en Égypte
  rationale: Rend directement le mouvement exprimé par le verbe guèze et conserve le référent masculin singulier, Jacob.
- source_word: ሰማረቱ
  choice: sept en tout
  rationale: Le texte conclut la liste par son total; l’ajout de « en tout » produit une tournure idiomatique sans modifier le sens.
