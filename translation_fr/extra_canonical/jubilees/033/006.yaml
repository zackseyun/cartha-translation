- source_word: ፈድፋደ
  choice: Elle refusa catégoriquement
  rationale: Le terme exprime ici un refus énergique; cette formulation française conserve son intensité tout en restant naturelle dans le contexte.
- source_word: ወአነገረት ፡ ወኢለመኑሂ ፡ ሰብአ
  choice: et n’en parla à personne
  rationale: La proposition signifie qu’elle ne le rapporta à aucun être humain; « n’en parla à personne » est idiomatique et ne surcharge pas le texte d’un objet explicite absent.
- source_word: ወኀሠሣ
  choice: et la chercha
  rationale: 'La forme verbale a un sujet masculin singulier et un objet féminin singulier : Jacob est le sujet et la femme l’objet.'
- source_word: ትቤሎ
  choice: elle lui dit
  rationale: La forme indique un sujet féminin singulier s’adressant à un objet masculin singulier.
