  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: fr
  text: Et Jacob ne s’approcha plus d’elle, parce que Ruben l’avait souillée. Et tout homme qui découvre la couverture de son père[a] — son acte est très mauvais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression imagée qui peut désigner la femme ou la couche du père. Comparer le langage biblique qui parle de « découvrir la nudité » d’un proche.
    reason: La traduction conserve l’image de la « couverture » sans imposer un seul référent à une expression euphémistique et potentiellement polysémique.
lexical_decisions:
- source_word: አቀረበ
  choice: s’approcha
  rationale: Le verbe exprime l’idée de s’approcher; dans ce contexte conjugal, le français conserve l’euphémisme du texte source sans expliciter davantage la relation sexuelle.
- source_word: አርኩሳ
  choice: avait souillée
  rationale: Ce rendu garde la forte notion de profanation ou d’impureté attachée à l’acte de Ruben, avec un plus-que-parfait naturel après le verbe principal au passé.
- source_word: ዘይከሥት
  choice: qui découvre
  rationale: Le verbe signifie dévoiler ou mettre à découvert; « découvre » préserve l’image et son caractère juridique et sexuel.
- source_word: ክዳነ
  choice: ce qui couvre son père
  rationale: Le substantif désigne une couverture ou ce qui couvre. La formulation française maintient l’image corporelle et l’allusion sexuelle sans la réduire à une interprétation unique.
theological_decisions:
- issue: Sens de l’expression « découvrir ce qui couvre son père »
  choice: Conserver l’euphémisme imagé dans le texte et l’éclairer en note.
  alternative: Traduire directement par « couche avec la femme de son père » ou « déshonore le lit de son père ».
  rationale: L’expression peut désigner la femme ou la couche du père et fait écho au langage biblique du dévoilement de la nudité. Une explicitation dans le corps du texte supprimerait cette polysémie et son lien intertextuel.
- issue: Nature du jugement moral final
  choice: « commet un acte très mauvais »
  alternative: « son affaire est très mauvaise » ou « son acte est un très grand mal ».
  rationale: Cette formulation exprime naturellement en français que le jugement porte sur l’action, sans ajouter une qualification doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. « S’approcha » et « découvre » conservent les euphémismes sexuels du texte. La virgule finale signale que la phrase se poursuit dans le verset suivant ou dans le découpage éditorial.
