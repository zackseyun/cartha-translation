  text: in her house. And he lay with her, and she awoke and saw him, and behold, Reuben was lying with her in the bed. And she uncovered the edge of her covering and seized him and cried out, and she recognized that it was Reuben.
translation:
  language: fr
  text: dans sa maison. Il se coucha avec elle. Elle s’éveilla, le vit, et voici que Ruben était couché avec elle dans le lit. Elle découvrit le pan de son vêtement[a], le saisit et poussa un cri. Elle reconnut que c’était Ruben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son aile ». Le terme peut désigner un pan ou un bord de vêtement, ou plus généralement une pièce de tissu; le référent exact est incertain.'
    reason: Préserve le sens littéral et l’ambiguïté du terme sans imposer « couverture ».
lexical_decisions:
- source_word: ወሰከበ ፡ ምስሌሃ
  choice: Il coucha avec elle
  rationale: L’expression signifie littéralement « il se coucha avec elle » et, dans ce contexte, peut avoir une portée sexuelle. La formulation française conserve cette tension sans l’expliciter davantage.
- source_word: ወርእየቶ
  choice: le vit
  rationale: Le suffixe objet masculin singulier est rendu explicitement par « le ».
- source_word: ምስካብ
  choice: lit
  rationale: Le terme désigne ici le lieu où l’on couche; « lit » est naturel et précis dans le contexte.
- source_word: ክንፋ
  choice: le pan de sa couverture
  rationale: Le mot signifie littéralement « aile » et peut désigner par extension un bord ou un pan de vêtement ou de couverture; le contexte du lit favorise « couverture ».
- source_word: ወአእመረቶ
  choice: Elle reconnut
  rationale: Le verbe exprime ici le fait de savoir ou reconnaître l’identité de l’homme; « reconnut » convient au contexte immédiat.
theological_decisions:
- issue: Portée de « coucha avec elle »
  choice: Conserver la formulation « coucha avec elle »
  alternative: « eut des relations avec elle » ou « s’allongea auprès d’elle »
  rationale: La source permet une expression chargée sexuellement sans détailler explicitement l’acte. La traduction préserve cette ambiguïté et la gravité narrative.
translation_notes:
  register: Français moderne, narratif et digne. Le début fragmentaire « dans sa maison » est conservé parce qu’il figure dans le segment source, même s’il se rattache probablement à la phrase du verset précédent. « Et voici que » maintient le relief narratif de la particule de présentation.
