  text: Elle eut honte devant lui, retira la main qu’elle avait posée sur lui, et il s’enfuit. Elle se lamenta à ce sujet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተኀፍረት እምኔሁ
  choice: eut honte devant lui
  rationale: Rend la honte éprouvée en sa présence sans introduire l’idée plus causale « à cause de lui ».
- source_word: ኀደገት እዴሃ እምላዕሌሁ
  choice: retira la main qu’elle avait posée sur lui
  rationale: Exprime naturellement le retrait de sa main de dessus lui; l’ajout relatif explicite en français la relation spatiale sans modifier l’action.
- source_word: ጐየ
  choice: s’enfuit
  rationale: Le verbe indique la fuite plutôt qu’un simple départ ou une course.
- source_word: ትላሑ
  choice: se lamenta
  rationale: Conserve l’expression forte du chagrin indiquée par le verbe.
- source_word: በእንተዝ ነገር
  choice: à cause de cette affaire
  rationale: Rend littéralement la relation causale et le terme général « affaire/chose » sans ajouter d’intensité absente du texte.
