  text: And Jacob was very angry with Reuben because he had lain with Bilhah, because he had uncovered his father’s skirt.
translation:
  language: fr
  text: Jacob se mit très en colère contre Ruben, parce qu’il avait couché avec Bilha, parce qu’il avait découvert le vêtement de son père.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la couverture de son père ».'
    reason: Signale une possibilité lexicale de ክዳን sans substituer une interprétation sexuelle ou juridique à l’expression imagée du texte.
lexical_decisions:
- source_word: ወተምዐ ፡ ያዕቆብ ፡ ጥቀ ፡ ላዕለ ፡ ሮቤል
  choice: Jacob entra dans une grande colère contre Ruben
  rationale: Rend l’intensité de ጥቀ (« beaucoup, fortement ») dans un français naturel et digne.
- source_word: ሰከበ ፡ ምስለ ፡ ባላን
  choice: il avait couché avec Bilha
  rationale: Expression française courante correspondant au sens sexuel contextuel de « coucher avec ».
- source_word: ከሠተ ፡ ክዳነ ፡ አቡሁ
  choice: avait ainsi découvert le pan du vêtement de son père
  rationale: ክዳን désigne un vêtement ou une couverture, non un lit. « Le pan du vêtement » conserve l’image idiomatique et son écho aux interdits bibliques, tandis que « ainsi » explicite le rapport entre l’acte et l’image sans en effacer la tension.
theological_decisions:
- issue: Nature de l’expression « découvrir le vêtement de son père »
  choice: Conserver l’image du vêtement dans le texte
  alternative: Interpréter directement par « profaner le lit de son père »
  rationale: Le guèze emploie explicitement ክዳን (« vêtement, couverture »). L’image évoque l’idiome biblique de l’atteinte sexuelle aux droits conjugaux du père; une paraphrase par « lit » résoudrait l’allusion au prix d’une moindre précision lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent les formes françaises usuelles. La répétition causale du guèze est rendue par « et avait ainsi » afin d’éviter une lourdeur tout en préservant le lien explicatif.
