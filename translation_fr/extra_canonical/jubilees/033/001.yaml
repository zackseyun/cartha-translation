lexical_decisions:
- source_word: ሖረ
  choice: partit / se rendit
  rationale: Le verbe exprime le déplacement (« aller »). Deux formulations françaises naturelles sont employées selon le contexte, sans modifier le sens.
- source_word: ኀደረ
  choice: campa
  rationale: Dans ce contexte d’étape et de déplacement, le verbe désigne le fait de passer la nuit ou d’établir son camp; « campa » restitue naturellement l’idée.
- source_word: መንገለ ደቡብ
  choice: au sud de
  rationale: Cette expression spatiale indique la direction ou la position au sud; la formulation française est concise et idiomatique.
- source_word: መግደላደራፋፍ
  choice: Migdal-Éder
  rationale: Le toponyme est translittéré sous sa forme biblique française reconnaissable.
- source_word: ኀበ አቡሁ
  choice: auprès de son père
  rationale: La préposition indique un mouvement vers la personne; « auprès de » rend ici une arrivée auprès du père plus naturellement que le littéral « vers ».
