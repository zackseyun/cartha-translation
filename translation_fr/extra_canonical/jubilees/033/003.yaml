  source_fidelity: 'Le texte rend correctement les éléments essentiels du guèze : Bilha est « la servante de Rachel », elle est la concubine du père de Ruben, elle se baigne dans un lieu retiré, Ruben se cache, entre de nuit dans sa maison et la trouve endormie seule dans son lit. La note onomastique signale à juste titre que la forme transmise dans ce passage est « Balan », tandis que le contexte identifie Bilha. « S’éprit d’elle » interprète toutefois « il l’aima » comme un amour soudain ou passionnel, nuance qui n’est pas explicitement portée par le verbe source.'
