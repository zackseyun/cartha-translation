  terminology: « Servante », « concubine », « maison », « endormie » et « lit » sont appropriés. « À l’écart » restitue naturellement le lieu caché/retiré sans calque pesant. Le nom principal « Bilha » est justifiable pour l’identification narrative, à condition de conserver la note sur la leçon « Balan ».
