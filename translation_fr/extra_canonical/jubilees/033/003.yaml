translation:
  language: fr
  text: la servante de Rachel, concubine de son père, qui se baignait à l’écart, et il l’aima. Il se cacha, puis, la nuit, il entra dans la maison de Bilha[a] et la trouva endormie, seule dans son lit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte éthiopien porte ici « Balan », forme probablement altérée du nom de Bilha.
    reason: La forme onomastique du texte source diffère du nom attendu d’après le contexte narratif ; le texte principal emploie Bilha pour identifier clairement la personne tout en signalant la variante.
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  choice: la servante de Rachel
  rationale: Le syntagme désigne explicitement la servante de Rachel, c’est-à-dire Bilha; il ne faut pas le réduire au seul nom de Rachel.
- source_word: ዐቅብተ ፡ አቡሁ
  choice: concubine de son père
  rationale: Rend directement l’apposition qui précise le statut de Bilha.
- source_word: እንዘ ፡ ትትሐፀብ ፡ በማይ ፡ በኅቡእ
  choice: qui se baignait à l’écart
  rationale: Formulation française naturelle qui conserve l’idée d’un bain pris dans un lieu caché ou retiré; la mention explicite de l’eau est idiomatiquement contenue dans « se baignait ».
- source_word: ወአፍቀራ
  choice: et il s’éprit d’elle
  rationale: Exprime un attachement amoureux ou désirant sans atténuer le verbe en simple appréciation.
- source_word: ወተኀቢኦ
  choice: Il se cacha
  rationale: Traduction directe du verbe réfléchi.
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  choice: seule dans son lit
  rationale: 'Respecte l’ordre sémantique du guèze: elle dormait dans son propre lit, seule; aucune seconde mention de sa maison n’est ajoutée.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le début fragmentaire est conservé parce que le verset poursuit syntaxiquement la phrase précédente. « À l’écart » évite le calque lourd « dans un lieu caché ». La répétition douteuse de « nuit » signalée entre crochets dans l’édition n’est pas reproduite.
