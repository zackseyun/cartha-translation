  text: 'His deed is very evil, for he is abominable before the LORD. Because of this it is written and ordained on the heavenly tablets that a man must not lie with his father’s wife and must not uncover his father’s skirt, because it is unclean. They must surely die together—the man who lies with his father’s wife and the woman also—for they have done an unclean deed on the earth. And let there be no uncleanness before our God among the people whom he has chosen for himself as a kingdom. And again it is written a second time: “Cursed be the one who lies with his father’s wife, because he has uncovered his father’s shame.” And let all the holy ones of the LORD say, “So be it, so be it.” And you, Moses, command the children of Israel that they keep this word, for it is a sentence of death, and it is unclean, and there is no atonement forever to atone for the man who has done this, except to put him to death and kill him and stone him and uproot him from the midst of the people of our God.
    For there shall not remain alive for a single day on the earth any man who does this in Israel, for he is abominable and unclean. And let them not say, “Reuben was allowed to live and forgiveness was granted after he lay with his father’s concubine, and she too, though she had a husband, and though Jacob his father was still alive.” For until that time the ordinance and the judgment and the law had not been fully revealed for all; but in your days it is as the law of the times and of the days, and as an everlasting law for the everlasting generations. And for this law there is no completion of days, and no forgiveness for it, except that both of them be uprooted from the midst of the people; on the day on which they did it they shall kill them. And you, Moses, write it down for Israel, that they may keep it and not do according to this matter and not sin with a sin unto death, because the Judge, the LORD our God, is one who does not show partiality and does not accept bribes. And tell
    them this word of the ordinance, that they may hear and be on guard and watch themselves and not be destroyed and rooted out from the land. For all who do it on the earth are unclean and defiled and polluted and contaminated before our God. And there is no greater sin than the sexual impurity that they commit on the earth, for Israel is a holy people to the LORD its God, and a people of inheritance, and a priestly people, and a kingdom people, and a planted people; and no such uncleanness is to be seen in the midst of the holy people. And in the third year of this week Jacob and all his sons went and dwelt in the house of Abraham, near Isaac his father and Rebekah his mother. And these are the names of the sons of Jacob: the firstborn, Reuben; and Simeon; and Levi; and Judah; and Issachar; and Zebulun, the sons of Leah; and the sons of Rachel, Joseph and Benjamin; and the sons of Bilhah, Dan and Naphtali; and the sons of Zilpah, Gad and Asher; and Dinah, the only daughter of Leah, the
    daughter of Jacob. And they went and bowed down to Isaac and Rebekah, and when they saw them they blessed Jacob and all his sons. And Isaac rejoiced greatly because he saw the sons of Jacob his younger son, and he blessed them.'
translation:
  language: fr
  text: 'Son acte est très mauvais, car il est odieux devant le SEIGNEUR.[a] C’est pourquoi il est écrit et décrété sur les tablettes célestes qu’un homme ne doit pas coucher avec la femme de son père ni découvrir la couverture de son père,[b] car c’est impur. Ils seront tous deux mis à mort : l’homme qui couche avec la femme de son père, et la femme aussi, car ils ont commis un acte impur sur la terre. Qu’aucune impureté ne subsiste donc devant notre Dieu au milieu du peuple qu’il s’est choisi pour en faire un royaume.


    Il est encore écrit une seconde fois : « Maudit soit celui qui couche avec la femme de son père, car il a découvert la honte de son père. » Et que tous les saints du SEIGNEUR disent : « Qu’il en soit ainsi ! Qu’il en soit ainsi ! » Quant à toi, Moïse, ordonne aux fils d’Israël d’observer cette parole, car cet acte mérite la mort et il est impur. Il n’existe à jamais aucun pardon pour l’homme qui l’a commis, sinon de le mettre à mort, de le tuer, de le lapider et de l’arracher du milieu du peuple de notre Dieu.


    En effet, aucun homme qui commet un tel acte en Israël ne restera vivant sur la terre, ne serait-ce qu’un seul jour, car il est odieux et impur. Qu’ils ne disent pas : « Ruben a été laissé en vie et il a reçu le pardon après avoir couché avec la concubine de son père ; elle aussi est restée en vie, alors qu’elle avait un mari et que Jacob, père de Ruben, vivait encore. » Jusqu’à cette époque, en effet, l’ordonnance, le jugement et la loi n’avaient pas encore été pleinement révélés à tous. Mais, en tes jours, cette prescription est établie comme une loi pour les temps et les jours, comme une loi perpétuelle pour les générations perpétuelles. Cette loi ne connaîtra aucun terme, et il n’y aura désormais aucun pardon pour cet acte : tous deux devront être arrachés du milieu du peuple ; le jour même où ils l’auront commis, on les mettra à mort.


    Quant à toi, Moïse, mets cela par écrit pour Israël, afin qu’ils l’observent, qu’ils ne commettent pas un tel acte et ne se rendent pas coupables d’un péché qui mène à la mort. Car le Juge, le SEIGNEUR notre Dieu, ne fait preuve d’aucune partialité et n’accepte aucun pot-de-vin. Fais-leur connaître cette ordonnance, afin qu’ils l’entendent, se tiennent sur leurs gardes, veillent sur eux-mêmes et ne soient ni détruits ni arrachés du pays. En effet, tous ceux qui commettent cet acte sur la terre sont impurs, souillés, profanés et contaminés devant notre Dieu. Il n’existe pas de péché plus grave que l’inconduite sexuelle à laquelle ils se livrent sur la terre. Car Israël est un peuple saint pour le SEIGNEUR son Dieu, un peuple qui lui appartient en héritage, un peuple de prêtres, un peuple royal et un peuple qu’il a planté. Une telle impureté ne doit pas paraître au milieu du peuple saint.


    La troisième année de cette semaine-là, Jacob partit avec tous ses fils et ils s’établirent dans la maison d’Abraham, près d’Isaac, son père, et de Rébecca, sa mère. Voici les noms des fils de Jacob : Ruben, le premier-né, puis Siméon, Lévi, Juda, Issacar et Zabulon, les fils de Léa ; Joseph et Benjamin, les fils de Rachel ; Dan et Nephtali, les fils de Bilha ; Gad et Aser, les fils de Zilpa ; et Dina, fille de Léa et unique fille de Jacob. Ils allèrent se prosterner devant Isaac et Rébecca. Quand ceux-ci les virent, ils bénirent Jacob et tous ses fils. Isaac éprouva une très grande joie en voyant les fils de Jacob, son fils cadet, et il les bénit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il est abominable devant le SEIGNEUR ».'
    reason: « Odieux » est naturel en français moderne; « abominable » reflète plus directement le vocabulaire traditionnel de l’abomination.
  - marker: b
    text: 'Littéralement : « découvrir la couverture de son père ». Cette image désigne ici le fait de coucher avec la femme de son père ; le texte emploie ensuite un autre mot, rendu par « honte ».'
    reason: La note explicite l’image et préserve la distinction lexicale entre ኪዳነተ, « couverture », et ኀፍረተ, « honte ».
lexical_decisions:
- source_word: እኩይ ፡ ነገሩ ፡ ጥቀ
  choice: Son acte est très mauvais
  rationale: 'Rend explicitement l’énoncé initial omis dans une version antérieure : « son acte/affaire est très mauvais ».'
- source_word: ምኑን
  choice: odieux
  rationale: Terme français naturel et fort pour ce qui est tenu en abomination, sans réduire le mot à la seule impureté rituelle.
- source_word: ኪዳነተ ፡ አቡሁ
  choice: le pan du vêtement de son père
  rationale: Conserve l’image concrète de la couverture ou du vêtement du père et la distingue de ኀፍረተ, « honte », employé ensuite.
- source_word: ኀፍረተ ፡ አቡሁ
  choice: la honte de son père
  rationale: Préserve la variation lexicale intentionnelle du texte source après l’image du vêtement.
- source_word: ስርየተ
  choice: moyen d’expiation / pardon
  rationale: Le contexte emploie la notion à la fois pour l’expiation de la faute et pour le pardon accordé ; le français varie selon la syntaxe sans effacer ce champ sémantique.
- source_word: ኢይነሥእ ፡ ገጸ
  choice: ne fait preuve d’aucune partialité
  rationale: Rend l’idiome judiciaire de façon claire en français moderne.
- source_word: ኢይነሥእ ፡ ሕልያነ
  choice: n’accepte aucun pot-de-vin
  rationale: Le contexte judiciaire appelle le sens de présent corrupteur plutôt que celui, neutre, de cadeau.
- source_word: ሕዝበ ፡ ጥዕት
  choice: un peuple qu’il a planté
  rationale: Maintient la métaphore distinctive de la plantation au lieu de l’aplanir en une idée générale d’établissement.
theological_decisions:
- issue: Statut de la prescription inscrite sur les tablettes célestes
  choice: Conserver les affirmations absolues du texte sur la peine, l’expiation et la perpétuité de la loi
  alternative: Les atténuer ou les harmoniser avec une doctrine canonique ultérieure du pardon
  rationale: La traduction doit préserver la théologie propre au livre des Jubilés et sa tension interne, sans importer une harmonisation confessionnelle.
- issue: « Saints du SEIGNEUR »
