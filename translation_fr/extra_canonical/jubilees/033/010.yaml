revisions:
- from: 'Son acte est très mauvais, car il est odieux devant le SEIGNEUR.[a] C’est pourquoi il est écrit et décrété sur les tablettes célestes qu’un homme ne doit pas coucher avec la femme de son père ni relever le pan du vêtement de son père,[b] car c’est impur. Ils seront tous deux mis à mort : l’homme qui couche avec la femme de son père, et la femme aussi, car ils ont commis un acte impur sur la terre. Qu’aucune impureté ne subsiste donc devant notre Dieu au milieu du peuple qu’il s’est choisi pour en faire un royaume.


    Il est encore écrit une seconde fois : « Maudit soit celui qui couche avec la femme de son père, car il a découvert la honte de son père. » Et que tous les saints du SEIGNEUR disent : « Qu’il en soit ainsi ! Qu’il en soit ainsi ! » Quant à toi, Moïse, ordonne aux fils d’Israël d’observer cette parole, car cet acte mérite la mort et il est impur. Il n’existe à jamais aucun moyen d’expiation pour l’homme qui l’a commis, sinon de le mettre à mort, de le tuer, de le lapider et de l’arracher du milieu du peuple de notre Dieu.


    En effet, aucun homme qui commet un tel acte en Israël ne restera vivant sur la terre, ne serait-ce qu’un seul jour, car il est odieux et impur. Qu’ils ne disent pas : « Ruben a été laissé en vie et il a reçu le pardon après avoir couché avec la concubine de son père ; elle aussi est restée en vie, alors qu’elle appartenait à un mari et que Jacob, père de Ruben, vivait encore. » Jusqu’à cette époque, en effet, l’ordonnance, le jugement et la loi n’avaient pas encore été pleinement révélés à tous. Mais, de ton vivant, cette prescription est établie comme une loi pour tous les temps et tous les jours, comme une loi perpétuelle pour les générations éternelles. Cette loi ne connaîtra aucun terme, et il n’y aura désormais aucun pardon pour cet acte : tous deux devront être arrachés du milieu du peuple ; le jour même où ils l’auront commis, on les mettra à mort.


    Quant à toi, Moïse, mets cela par écrit pour Israël, afin qu’ils l’observent, qu’ils ne commettent pas un tel acte et ne se rendent pas coupables d’un péché qui mène à la mort. Car le Juge, le SEIGNEUR notre Dieu, ne fait preuve d’aucune partialité et n’accepte aucun pot-de-vin. Fais-leur connaître cette ordonnance, afin qu’ils l’entendent, se tiennent sur leurs gardes, veillent sur eux-mêmes et ne soient ni détruits ni arrachés du pays. En effet, tous ceux qui commettent cet acte sur la terre sont impurs, souillés, profanés et contaminés devant notre Dieu. Il n’existe pas de péché plus grave que l’inconduite sexuelle à laquelle ils se livrent sur la terre. Car Israël est un peuple saint pour le SEIGNEUR son Dieu, un peuple qui lui appartient en héritage, un peuple de prêtres, un peuple royal et un peuple qu’il a planté. Une telle impureté ne doit pas paraître au milieu du peuple saint.


    La troisième année de cette semaine-là, Jacob partit avec tous ses fils et ils s’établirent dans la maison d’Abraham, près d’Isaac, son père, et de Rébecca, sa mère. Voici les noms des fils de Jacob : Ruben, le premier-né, puis Siméon, Lévi, Juda, Issacar et Zabulon, les fils de Léa ; Joseph et Benjamin, les fils de Rachel ; Dan et Nephtali, les fils de Bilha ; Gad et Aser, les fils de Zilpa ; et Dina, fille de Léa et unique fille de Jacob. Ils allèrent se prosterner devant Isaac et Rébecca. Quand ceux-ci les virent, ils bénirent Jacob et tous ses fils. Isaac éprouva une très grande joie en voyant les fils de Jacob, son fils cadet, et il les bénit.'
