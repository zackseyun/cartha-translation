  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: fr
  text: '« Je ne suis pas pure pour toi, car j’ai été souillée loin de toi : Ruben m’a souillée et a couché avec moi pendant la nuit, alors que je dormais. Je ne m’en suis pas rendu compte jusqu’à ce qu’il ait soulevé le pan de mon vêtement et ait couché avec moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንጽሕተ
  choice: pure
  rationale: Dans ce contexte conjugal et sexuel, « pure » rend naturellement l’idée de pureté ou d’intégrité exprimée par le terme guèze.
- source_word: ተገመዝኩ / አርኩሰኒ
  choice: j’ai été souillée / m’a souillée
  rationale: La répétition française conserve le parallélisme et la gravité de deux verbes guèzes proches exprimant la profanation ou la souillure.
- source_word: እምኔከ
  choice: loin de toi
  rationale: Rend directement la séparation spatiale ou relationnelle indiquée par la préposition, sans préciser davantage une éventuelle notion d’infidélité.
- source_word: ከሠተ ክነፍየ
  choice: il soulève le pan de mon vêtement
  rationale: La locution désigne littéralement l’action de découvrir ou d’ouvrir son « aile »; en contexte vestimentaire, « le pan de mon vêtement » est clair tout en conservant l’image.
- source_word: ወኢያእመርኩ
  choice: je ne m’en suis pas rendu compte
  rationale: Exprime ici l’absence de perception ou de conscience de l’acte, plutôt qu’un simple manque de connaissance abstraite.
theological_decisions:
- issue: Nature de la souillure
  choice: Conserver le vocabulaire de pureté et de souillure sans l’interpréter doctrinalement.
  alternative: Traduire en termes exclusivement moraux, comme « coupable » ou « infidèle ».
  rationale: Le texte décrit une atteinte sexuelle subie pendant le sommeil; il ne faut ni imputer une faute à la femme ni effacer le langage ancien de pureté.
- issue: Degré de consentement
  choice: Rendre explicitement qu’elle dormait et ne s’est rendu compte de rien avant l’acte décrit.
  alternative: Employer une formulation susceptible de laisser entendre une participation consciente.
  rationale: La syntaxe source souligne son sommeil et son ignorance; la traduction doit préserver ces éléments sans ajouter une qualification juridique moderne.
translation_notes:
  register: Français moderne, digne et narratif. La répétition de « souillée » et « couche avec moi » est maintenue afin de respecter l’insistance du texte source; « le pan de mon vêtement » évite l’ambiguïté peu naturelle de « mon aile » ou de « ma jupe ».
