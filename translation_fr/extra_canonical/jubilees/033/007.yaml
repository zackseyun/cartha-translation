  source_fidelity: 'Le projet préserve l’essentiel du guèze : la pureté/souillure, la séparation d’avec l’interlocuteur, l’identification de Ruben, le sommeil de la femme, son absence de conscience et l’image du pan du vêtement. La répétition de l’acte est également conservée. La formulation révisée rend plus directement la simultanéité du sommeil avec l’acte.'
