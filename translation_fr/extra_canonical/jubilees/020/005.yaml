  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
translation:
  language: fr
  text: le Très-Haut, prosternez-vous devant lui et espérez en sa présence en tout temps. Faites devant lui ce qui est droit et juste, afin qu’il vous dirige et vous accorde sa miséricorde, qu’il fasse descendre pour vous la pluie du matin et du soir[a], qu’il bénisse tout le travail que vous accomplissez sur la terre et qu’il bénisse votre grain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « pluie du matin et du soir » peut évoquer les pluies saisonnières données au moment opportun, souvent appelées « pluie précoce et pluie tardive ».
    reason: Précision sur une expression agricole susceptible d’être comprise soit littéralement selon les moments de la journée, soit comme une formule relative aux pluies saisonnières.
lexical_decisions:
- source_word: ልዑለ
  choice: le Très-Haut
  rationale: Le terme désigne ici Dieu comme « Très-Haut ». Le texte fourni commence au milieu d’une construction syntaxique; la traduction conserve donc ce début en continuation plutôt que d’ajouter un verbe absent.
- source_word: ወስግዱ፡ ሎቱ
  choice: prosternez-vous toujours devant lui
  rationale: Le verbe exprime une prosternation ou un acte d’adoration; « se prosterner devant » restitue concrètement le geste sans atténuer sa portée cultuelle.
- source_word: ወትስፈዉ፡ ገጸ፡ ዚአሁ
  choice: mettez en tout temps votre espérance en sa présence
  rationale: Le verbe ተስፋ porte l’idée d’espérer. « En sa présence » rend naturellement l’expression littérale liée à sa « face » tout en conservant sa dimension relationnelle.
- source_word: ያርትዕ፡ ርእስክሙ
  choice: qu’il vous rende droits
  rationale: ርእስክሙ, littéralement « vos têtes », fonctionne comme un réfléchi (« vous-mêmes »), et non comme « votre chemin ». Le verbe reprend la notion de droiture exprimée juste avant.
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ
  choice: la pluie du matin et du soir
  rationale: Traduction directe de la formulation temporelle du guèze, sans la remplacer dans le texte par la formule interprétative « pluie précoce et pluie tardive ».
- source_word: እክልከ
  choice: votre grain
  rationale: Le nom désigne le grain ou les céréales; « votre grain » respecte le singulier collectif du texte.
theological_decisions:
- issue: Sens de l’action divine dans ያርትዕ፡ ርእስክሙ
  choice: qu’il vous rende droits
  alternative: qu’il vous dirige
  rationale: Les deux sens sont possibles pour le verbe, mais le parallélisme avec « pratiquez la droiture » favorise ici l’idée de rendre droits. La traduction évite « qu’il dirige votre chemin », car « chemin » n’apparaît pas dans le texte source.
- issue: Expression de la recherche ou de l’espérance devant Dieu
  choice: mettez en tout temps votre espérance en sa présence
  alternative: cherchez sa face en tout temps
  rationale: Le lexème guèze exprime plus directement l’espérance que la recherche. La formulation retenue conserve cette nuance sans transformer « sa face » en une simple quête.
translation_notes:
  register: Français international moderne, digne et accessible. L’ouverture demeure volontairement syntaxiquement dépendante, puisque le texte guèze fourni commence par « le Très-Haut » sans le verbe qui régirait ce groupe. Les impératifs pluriels sont conservés. Le marqueur de note est placé immédiatement après l’expression qu’il explique.
