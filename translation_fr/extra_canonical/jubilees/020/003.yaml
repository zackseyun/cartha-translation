  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
translation:
  language: fr
  text: 'ainsi que le jugement de Sodome : comment ses habitants furent jugés à cause de leur méchanceté, de leur inconduite sexuelle, de leur impureté et de la corruption qui régnait parmi eux. Ils moururent à cause de leur inconduite sexuelle. Vous aussi, gardez-vous de toute inconduite sexuelle, de toute impureté et de toute souillure du péché, afin de ne pas livrer votre nom à la malédiction, votre vie entière à l’opprobre et tous vos fils à la destruction par l’épée,[a] afin que vous ne deveniez pas maudits comme Sodome et que tous ceux qui resteront de vous ne deviennent pas maudits comme les fils de Gomorrhe. Je vous l’atteste, mes enfants : aimez-le.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et que tous vos fils ne périssent pas par l’épée » ; le texte présente toutefois « à la destruction » comme le troisième complément parallèle de « livrer ».'
    reason: La construction nominale de la source peut être reformulée verbalement en français, mais le texte principal en préserve le parallélisme.
  - marker: b
    text: Le pronom « le » renvoie vraisemblablement au Dieu du ciel, mentionné dans le verset suivant.
    reason: Le suffixe masculin singulier est explicite dans la source, mais son référent n’apparaît pas à l’intérieur de ce verset.
lexical_decisions:
- source_word: ዝሙት
  choice: inconduite sexuelle
  rationale: Le terme désigne une conduite sexuelle illicite. « Inconduite sexuelle » est clair en français moderne tout en restant assez large pour ne pas réduire le sens à un acte particulier.
- source_word: ርኵስ
  choice: impureté
  rationale: Conserve le champ sémantique de l’impureté morale ou rituelle sans préciser indûment laquelle est visée.
- source_word: ሙስና
  choice: corruption / destruction
  rationale: 'Le même terme admet ici deux réalisations contextuelles : « corruption » dans la liste initiale des fautes, puis « destruction » dans la conséquence parallèle à la malédiction et à l’opprobre.'
- source_word: ፃማነ፡ ኀጢአት
  choice: souillure du péché
  rationale: Rend l’idée d’une contamination ou souillure produite par le péché dans une expression française naturelle et digne.
- source_word: አሰምዕ
  choice: Je vous l’atteste
  rationale: Le verbe est compris comme une forme à la première personne, « j’atteste / je témoigne », et non comme l’impératif « écoutez ».
- source_word: አፍቅርዎ
  choice: aimez-le
  rationale: Le suffixe objet masculin singulier est conservé. Son référent apparaît vraisemblablement dans le verset suivant, sans être explicité ici.
theological_decisions:
- issue: Nature de l’inconduite de Sodome
  choice: Employer le terme général « inconduite sexuelle »
  alternative: Préciser une catégorie particulière d’actes sexuels
  rationale: Le texte éthiopien emploie un terme large; une précision supplémentaire importerait une interprétation théologique non explicitée par ce verset.
- issue: Référent de « aimez-le »
  choice: Conserver le pronom sans expliciter son référent
  alternative: Écrire « aimez Dieu » ou « aimez le Dieu du ciel »
  rationale: Le suffixe masculin est présent dans la source, tandis que son antécédent se trouve probablement au verset suivant. L’ambiguïté créée par la division versifiée doit être préservée plutôt que résolue silencieusement.
- issue: Structure de la menace
  choice: Maintenir trois compléments parallèles de « livrer »
  alternative: 'Transformer le troisième en proposition verbale : « que tous vos fils périssent par l’épée »'
  rationale: La syntaxe source coordonne le nom, la vie et les fils comme objets soumis respectivement à la malédiction, à l’opprobre et à la destruction.
translation_notes:
  register: Français international moderne, digne et accessible. Le passage commence en continuité syntaxique avec le verset précédent. Le parallélisme de l’exhortation et la répétition de « inconduite sexuelle » sont conservés. « Opprobre » est légèrement soutenu, mais précis et usuel dans un registre biblique contemporain.
