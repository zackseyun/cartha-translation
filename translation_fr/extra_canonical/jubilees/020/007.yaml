  text: your flocks. And you will be a blessing on the earth, and all the nations of the earth will desire you,
translation:
  language: fr
  text: vos troupeaux. Vous serez une bénédiction sur la terre, et tous les peuples de la terre vous désireront[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous aimeront ».'
    reason: Le verbe guèze ፈተወ peut exprimer l’amour ou le désir ; la note conserve cette alternative lexicale.
lexical_decisions:
- source_word: አባግዒከ
  choice: vos troupeaux
  rationale: Le nom désigne les moutons ou, collectivement, le petit bétail; « troupeaux » convient naturellement à ce fragment tout en maintenant son lien avec le contexte précédent.
- source_word: ትከውኑ፡ በበረከት
  choice: vous serez une bénédiction
  rationale: Cette formulation française naturelle rend l’idée de devenir ou d’être une bénédiction sans reproduire maladroitement la construction prépositionnelle du guèze.
- source_word: አሕዛበ፡ ምድር
  choice: les peuples de la terre
  rationale: « Peuples » rend le collectif አሕዛብ sans lui imposer exclusivement le sens politique moderne de « nations ».
- source_word: ይፈትዉክሙ
  choice: vous aimeront
  rationale: Le verbe peut exprimer l’amour, l’affection ou le désir; « aimeront » est ici le sens relationnel le plus naturel, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Portée de la promesse envers les peuples de la terre
  choice: Conserver « tous les peuples de la terre vous aimeront »
  alternative: « toutes les nations de la terre vous désireront »
  rationale: Le texte présente une promesse universelle sans en préciser le mécanisme ni la portée théologique; la traduction n’ajoute donc aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. Le début fragmentaire et la virgule finale sont conservés parce que ce verset fourni constitue un segment de phrase lié au contexte adjacent. Le pronom « vous » maintient sans lourdeur la valeur plurielle du suffixe verbal.
