  yaml_path: translation/extra_canonical/jubilees/020/004.yaml
  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: fr
  text: le Dieu du ciel, attachez-vous à tous ses commandements et ne suivez ni leurs idoles ni leur impureté. Ne vous faites pas de dieux en métal fondu ni d’images sculptées, car ils ne sont que néant et il n’y a en eux aucun esprit. Ils sont l’œuvre de mains humaines, et tous ceux qui mettent leur confiance en eux mettent leur confiance dans le néant. Ne leur rendez pas de culte et ne vous prosternez pas devant eux. Mais rendez un culte au Dieu
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትጸመዱ
  choice: attachez-vous
  rationale: Rend l’idée de s’attacher fermement à quelque chose, ici à l’ensemble des commandements divins.
- source_word: ርኵሶሙ
  choice: leur impureté
  rationale: Conserve le sens cultuel et moral d’impureté sans le réduire à la saleté physique.
- source_word: አማልክተ፡ ሰብክ
  choice: dieux en métal fondu
  rationale: Exprime naturellement en français des divinités fabriquées par coulage du métal.
- source_word: ግልፈዋተ
  choice: images sculptées
  rationale: Désigne des représentations taillées ou gravées, dans une formulation française courante.
- source_word: ከንቱ
  choice: néant
  rationale: Préserve la forte affirmation de vacuité et d’inanité des idoles.
- source_word: መንፈስ
  choice: esprit
  rationale: Maintient le terme large et potentiellement polysémique du texte source plutôt que de préciser « souffle » ou « vie ».
- source_word: ግብረ፡ እደው
  choice: l’œuvre de mains humaines
  rationale: Rend l’idiome de manière claire tout en explicitant que les mains sont celles des humains.
- source_word: አምልኩ
  choice: rendez un culte
  rationale: Dans ce contexte anti-idolâtre, le verbe désigne le service cultuel plutôt qu’un simple service ordinaire.
theological_decisions:
- issue: Nature de l’absence dans les idoles
  choice: « il n’y a en eux aucun esprit »
  alternative: « il n’y a en elles aucun souffle de vie »
  rationale: La traduction retenue conserve l’ambiguïté de መንፈስ et évite d’imposer une interprétation exclusivement vitaliste.
- issue: Portée de l’impureté associée aux idoles
  choice: « leur impureté »
  alternative: « leurs pratiques impures »
  rationale: Le substantif abstrait du texte est maintenu afin de ne pas préciser sans fondement si l’expression vise les objets, les rites ou leurs effets moraux.
- issue: Valeur de l’acte commandé envers Dieu et interdit envers les idoles
  choice: « rendre un culte »
  alternative: « servir »
  rationale: Le contexte, renforcé par l’interdiction de se prosterner, favorise le sens cultuel, sans introduire de terminologie confessionnelle particulière.
