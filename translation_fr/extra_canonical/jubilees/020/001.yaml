base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
translation:
  language: fr
  text: Au cours du quarante-deuxième jubilé, la première année de la septième semaine, Abraham appela Ismaël et ses douze fils, Isaac et ses deux fils, ainsi que les six fils de Qetoura et leurs enfants. Il leur ordonna de garder la voie du Seigneur, de pratiquer la justice, que chacun aime son frère, qu’il soit ainsi au milieu de tous les peuples et qu’ils marchent ensemble dans la pratique du droit et de la justice sur la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset est syntaxiquement dense en guèze. Elle semble exhorter chacun à l’amour fraternel et à une conduite publique marquée par le droit et la justice au milieu de tous les peuples.
    reason: segmentation_note
lexical_decisions:
- source_word: ፍኖተ፡ እግዚአብሔር
  choice: la voie du Seigneur
  rationale: Rend directement l’expression « voie du Seigneur » tout en conservant son sens éthique de conduite.
- source_word: ጽድቀ
  choice: la justice
  rationale: Le terme désigne ici une conduite juste; « justice » est naturel et maintient le registre biblique.
- source_word: ፍትሕ
  choice: le droit
  rationale: Distingue ce terme de ጽድቅ dans le binôme final et exprime l’idée de jugement ou d’équité conforme au droit.
- source_word: ይሖሩ
  choice: en marchant
  rationale: Conserve l’image source de la marche comme manière de vivre, signalée par la révision critique.
- source_word: ቢጾ
  choice: comme des frères
  rationale: Le mot peut désigner le compagnon ou le prochain; dans cette exhortation familiale, l’expression fraternelle est naturelle sans limiter nécessairement l’application au lien biologique.
theological_decisions:
- issue: Portée de l’exhortation parmi tous les humains
  choice: au milieu de tous les peuples
  alternative: parmi tous les hommes
  rationale: La formulation conserve la dimension publique et universelle de la conduite prescrite sans ajouter de précision doctrinale.
- issue: Variation grammaticale entre le singulier distributif et le pluriel
  choice: de s’aimer chacun comme des frères et de se conduire ainsi… en marchant ensemble
  alternative: qu’ils s’aiment les uns les autres et se conduisent ainsi
  rationale: Le français garde la valeur distributive de « chacun » tout en rendant naturellement le passage du singulier source au pluriel dans la dernière proposition.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les idiomes bibliques « voie du Seigneur » et « marcher », tout en clarifiant avec retenue la syntaxe dense de la dernière partie.
