lexical_decisions:
- source_word: ማኅፀነ
  choice: le sein maternel
  rationale: Le terme désigne le sein ou la matrice. Cette formulation conserve l’image corporelle tout en restant naturelle en français et évite de rattacher à tort ce nom au verbe « bénir » qui suit.
- source_word: ዘርአ፡ ከርሥከ
  choice: la descendance issue de ton corps
  rationale: Littéralement « la semence de ton ventre/corps » ; « descendance issue de ton corps » transmet clairement le sens humain sans effacer l’origine corporelle de l’expression.
- source_word: ዘርአ፡ ምድርከ
  choice: la semence de ta terre
  rationale: Le rendu garde le parallélisme lexical de « semence » et laisse ouverte la référence aux graines, aux récoltes ou aux produits du sol.
- source_word: መራዕየ
  choice: les troupeaux
  rationale: Le mot pastoral désigne des animaux rassemblés en troupeaux. Sa répétition est conservée, plutôt que d’introduire ici l’idée plus générale de « progéniture ».
- source_word: አልህምቲከ
  choice: ton bétail
  rationale: Terme collectif naturel en français pour les animaux domestiques concernés.
theological_decisions:
- issue: Objet du verbe « bénir »
  choice: Le verbe commence une nouvelle proposition dont « la descendance issue de ton corps » est le premier objet.
  alternative: « qu’il bénisse ton sein maternel et la descendance issue de ton corps »
  rationale: Dans le texte guèze, « le sein maternel » précède le verbe et appartient vraisemblablement à la proposition précédente ; le rattacher à « bénir » modifierait la syntaxe attestée.
- issue: Référent implicite du sujet verbal
  choice: « qu’il bénisse », avec un pronom masculin singulier implicite renvoyant à Dieu dans le contexte.
  alternative: Répéter explicitement « Dieu »
  rationale: Le source porte une troisième personne singulière sans répéter le nom divin ; le pronom conserve cette économie et n’ajoute rien au texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule rend visible la frontière syntaxique au début du fragment. La fin demeure volontairement inachevée afin de respecter la coupure de la source.
