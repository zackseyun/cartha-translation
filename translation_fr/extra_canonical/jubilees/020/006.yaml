  text: et ton ventre[a] ; qu’il bénisse la descendance de tes entrailles et la semence de ta terre, les troupeaux de ton bétail et les troupeaux de[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et ton ventre » achèvent vraisemblablement la proposition commencée dans le passage précédent ; ils ne sont pas l’objet du verbe « bénir » qui suit.
    reason: La coupure fournie commence au milieu d’une phrase et pourrait autrement entraîner un rattachement syntaxique erroné.
  - marker: b
