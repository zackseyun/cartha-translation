  text: And that they should circumcise their sons according to the covenant that was established with them[a], and that they should not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded; and that we should keep ourselves from all fornication and uncleanness, and that we should put away from among us every act of fornication and uncleanness. And if a woman among you commits harlotry, or even a daughter, burn her with fire, and let them not commit fornication after their eyes and after their heart, and let them not take wives for themselves from the daughters of Canaan, for the seed of Canaan will be uprooted from the land. And he told them of the judgment of the Watchers[a],
translation:
  language: fr
  text: Il leur recommanda de circoncire leurs fils conformément à l’alliance conclue avec eux[a], de ne pas s’en écarter, ni à droite ni à gauche, d’aucune voie que le Seigneur avait prescrite. Nous devons nous garder de toute immoralité sexuelle et de toute impureté, et éliminer du milieu de nous toute pratique d’immoralité sexuelle et d’impureté. Si une femme parmi vous, ou même une fille, se livre à l’immoralité sexuelle, brûlez-la par le feu[b]. Qu’elles ne se livrent pas à l’immoralité sexuelle selon leurs yeux et leur cœur, et qu’ils ne prennent pas pour femmes des filles de Canaan, car la descendance de Canaan sera déracinée du pays. Il leur fit connaître le jugement des Veilleurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation de ce témoin est concise; la mention de la circoncision se comprend dans le cadre de l’alliance conclue avec Abraham.
    reason: lexical_alternative
  - marker: b
    text: 'L’ordre est formulé explicitement et sur un ton juridique dans le texte guèze : « brûlez-la par le feu ».'
    reason: cultural_note
  - marker: c
    text: Les « Veilleurs » sont les êtres célestes rebelles dont le châtiment est raconté dans la tradition hénochique.
    reason: cross_reference
lexical_decisions:
- source_word: ይክስቡ፡ ውሉዶሙ፡ በኪዳን
  choice: circoncire leurs fils conformément à l’alliance
  rationale: Le contexte de l’alliance abrahamique et le sens du verbe soutiennent la circoncision, bien que la formulation du témoin soit concise.
- source_word: ዝሙት / ዘመወት / ይዘምዋ
  choice: immoralité sexuelle / se livrer à l’immoralité sexuelle
  rationale: La répétition française conserve le lien lexical insistant entre le nom et les formes verbales de la même racine guèze, sans employer le terme aujourd’hui étroit « fornication ».
- source_word: ይሤረዉ
  choice: sera déracinée
  rationale: Le verbe signifie arracher ou déraciner; l’image végétale convient particulièrement à « la descendance », littéralement « la semence », de Canaan.
- source_word: ረዓይት
  choice: les Veilleurs
  rationale: Désignation traditionnelle des êtres célestes rebelles dans la littérature hénochique; la majuscule signale qu’il s’agit d’un groupe déterminé.
theological_decisions:
- issue: Passage de la troisième personne à la première personne du pluriel
  choice: « Il leur recommanda aussi de nous garder »
  alternative: Harmoniser en « de se garder »
  rationale: La source passe réellement de « leurs fils » à une forme de première personne plurielle; cette tension énonciative est préservée plutôt que nivelée.
- issue: Portée de la condamnation à être brûlée
  choice: Conserver l’ordre explicite « brûlez-la par le feu » sans atténuation
  alternative: Paraphraser ou présenter le feu comme une destruction non judiciaire
  rationale: Le guèze est explicite et adopte un ton juridique sévère; la traduction ne doit ni adoucir ni développer la nature précise de la peine.
- issue: Référence aux Veilleurs
  choice: « jugement prononcé contre les Veilleurs »
  alternative: « jugement des Veilleurs », potentiellement ambigu
  rationale: Le contexte désigne le châtiment subi par les Veilleurs, non un jugement qu’ils exerceraient; la formulation française clarifie la relation grammaticale sans ajouter de doctrine.
translation_notes:
  register: Français international moderne, digne et accessible. « Seigneur » rend le titre divin du texte; « immoralité sexuelle » maintient la précision sexuelle et la répétition de la racine sans l’archaïsme ni le sens moderne restreint de « fornication ». Les changements de personne et la dureté juridique du passage sont conservés.
