    rationale: Le guèze interdit de se détourner « de ceci » et « d’aucune voie que Dieu a commandée ». « Mais de suivre toutes les voies » transforme l’interdiction en injonction positive et remplace « aucune » par « toutes ».
  - severity: medium
    issue: Construction française avec le changement de personne
    rationale: « Il leur recommanda … de nous garder » est grammaticalement possible mais très maladroit, car « nous » ne peut naturellement désigner ni le narrateur ni « eux » sous ce verbe. Une nouvelle proposition indépendante conserve la première personne plurielle attestée sans produire cette collision syntaxique.
  - severity: medium
    issue: Rendu de « une femme … ou même une fille »
    rationale: 'La formulation actuelle fait de « l’une de vos filles » une précision identifiante de « femme ». La source coordonne plutôt deux cas : une femme parmi vous, ou même une fille.'
  - severity: low
    issue: Accord du pronom dans l’interdiction suivant la peine
    rationale: Le contexte immédiat vise une femme ou une fille; « qu’elles ne se livrent pas » rend cette référence plus nettement que le masculin générique « qu’ils ».
