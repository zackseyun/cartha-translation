revisions:
- from: Il leur recommanda de circoncire leurs fils conformément à l’alliance conclue avec eux[a], de ne s’en écarter ni à droite ni à gauche, mais de suivre toutes les voies que le Seigneur avait prescrites. Il leur recommanda aussi de nous garder de toute immoralité sexuelle et de toute impureté, et d’éliminer du milieu de nous toute pratique immorale et impure. Si une femme parmi vous se livre à l’immoralité sexuelle, même s’il s’agit de l’une de vos filles, brûlez-la par le feu[b]. Qu’ils ne se livrent pas à l’immoralité sexuelle en suivant leurs yeux et leur cœur, et qu’ils ne prennent pas pour femmes des filles de Canaan, car la descendance de Canaan sera déracinée du pays. Il leur fit aussi connaître le jugement prononcé contre les Veilleurs[c].
  to: Il leur recommanda de circoncire leurs fils conformément à l’alliance conclue avec eux[a], de ne pas s’en écarter, ni à droite ni à gauche, d’aucune voie que le Seigneur avait prescrite. Nous devons nous garder de toute immoralité sexuelle et de toute impureté, et éliminer du milieu de nous toute pratique d’immoralité sexuelle et d’impureté. Si une femme parmi vous, ou même une fille, se livre à l’immoralité sexuelle, brûlez-la par le feu[b]. Qu’elles ne se livrent pas à l’immoralité sexuelle selon leurs yeux et leur cœur, et qu’ils ne prennent pas pour femmes des filles de Canaan, car la descendance de Canaan sera déracinée du pays. Il leur fit connaître le jugement des Veilleurs[c].
  rationale: La révision restaure la portée négative de la clause relative aux voies prescrites, distingue clairement « une femme » et « une fille », et conserve le passage source à la première personne plurielle dans une phrase française naturelle. Elle maintient la répétition lexicale sexuelle, le ton légal sévère sans l’interpréter, l’image de déracinement et l’ambiguïté contrôlée de « jugement des Veilleurs ».
