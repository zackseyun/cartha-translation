  text: to Isaac his son. And Ishmael and his sons and the sons of Keturah and their children went together and settled from Paran as far as the entrance to Babylon, in all the land that faces eastward.
translation:
  language: fr
  text: à Isaac, son fils. Ismaël et ses fils, les fils de Qetoura et leurs enfants allèrent ensemble et s’établirent de Paran jusqu’à l’entrée de Babylone, dans tout le pays qui fait face à l’orient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅቡረ
  choice: ensemble
  rationale: Rend directement l’idée d’un déplacement et d’une installation en commun.
- source_word: እምፋርሞን
  choice: depuis Paran
  rationale: Le toponyme est rendu sous sa forme française biblique courante; la préposition marque le point de départ.
- source_word: እስከ፡ ምብዋአ፡ ባቢሎን
  choice: jusqu’à l’entrée de Babylone
  rationale: Conserve l’expression spatiale de la source sans préciser artificiellement s’il s’agit d’une porte, d’une frontière ou d’un accès.
- source_word: ገጸ፡ ጽባሕ
  choice: fait face à l’orient
  rationale: Expression française naturelle et digne qui garde l’image littérale d’un territoire tourné vers le levant.
