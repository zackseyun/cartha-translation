review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement ገዳም (« le désert »), ተደመሩ (« se mêlèrent / se joignirent ») et, surtout, ተጸምደ comme un passif de jonction plutôt que comme « fut appelé ». Toutefois, « leur nom fut associé : Arabes et Ismaélites » laisse en français un rapport syntaxique trop elliptique entre le nom et les deux ethnonymes. « Leur nom fut joint à celui des Arabes et des Ismaélites » explicite sobrement la relation de combinaison contenue dans le guèze, sans adopter l’émendation « on les appela ».'
  naturalness: « Ceux-ci se mêlèrent à ceux-là » est naturel dans un registre narratif soutenu et conserve la distinction des deux groupes. La révision de la dernière proposition rend la formulation idiomatique et intelligible en français moderne, tout en maintenant le caractère fragmentaire initial du verset.
  terminology: « Arabes » et « Ismaélites » sont les équivalents français établis pour les désignations collectives. Aucun terme théologique particulier ne requiert d’ajustement.
  issues:
  - severity: medium
    issue: 'Relation insuffisamment explicitée dans « leur nom fut associé : Arabes et Ismaélites »'
    rationale: Le guèze présente l’idée que leur nom fut joint/associé en rapport avec « Arabes et Ismaélites ». En français, les deux-points peuvent donner l’impression que ces mots constituent simplement une nouvelle appellation, ce qui rapproche inutilement la lecture de l’ancienne émendation « fut appelé ». Une construction avec « à celui des » rend la jonction nominale sans surinterprétation.
