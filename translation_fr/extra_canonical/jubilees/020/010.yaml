translation:
  language: fr
  text: le désert. Ceux-ci se mêlèrent à ceux-là, et leur nom fut joint à celui des Arabes et des Ismaélites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible, suivant une ancienne émendation : « et on les appela Arabes et Ismaélites ». Le texte guèze conservé exprime littéralement l’idée que leur nom « fut joint » ou « fut associé ».'
    reason: Signale l’ancienne émendation tout en maintenant dans le texte la leçon manuscrite, qui exprime une jonction plutôt qu’une simple dénomination.
lexical_decisions:
- source_word: ገዳም
  choice: le désert
  rationale: Rend directement le nom guèze désignant le désert; le fragment poursuit syntaxiquement le verset précédent.
- source_word: ተደመሩ
  choice: se mêlèrent
  rationale: Exprime l’idée que les deux groupes se joignirent ou se mélangèrent, en accord avec la construction réciproque « ceux-ci… à ceux-là ».
- source_word: ተጸምደ
  choice: fut associé
  rationale: Conserve le sens manuscrit de « joindre/associer » plutôt que l’émendation « fut appelé », tout en produisant un français naturel.
- source_word: ዓረበ ወእስማዔላዊያን
  choice: Arabes et Ismaélites
  rationale: Transcrit les deux désignations collectives sans les fusionner en une appellation moderne.
