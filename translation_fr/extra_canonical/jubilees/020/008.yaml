  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
translation:
  language: fr
  text: Et l’on bénira vos enfants en mon nom, afin qu’ils soient bénis comme je le suis. Puis il donna des présents à Ismaël, à ses fils et aux fils de Qetoura, et il les envoya loin d’Isaac, son fils ; et il lui donna tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይባርኩ
  choice: l’on bénira
  rationale: Le verbe au pluriel a un sujet non exprimé ; le pronom indéfini « l’on » conserve cette indétermination sans inventer un référent.
- source_word: ውሉድክሙ
  choice: vos enfants
  rationale: Rend le nom « enfants/descendants » avec le suffixe de deuxième personne du pluriel.
- source_word: ሀብተ
  choice: des présents
  rationale: Dans le contexte du partage des biens d’Abraham, le terme désigne des dons matériels ; « présents » est naturel et distingue ces dons de la totalité réservée à Isaac.
- source_word: ወፈነዎሙ፡ እምይስሐቅ
  choice: il les éloigna d’Isaac
  rationale: Reproduit l’idée d’un envoi loin d’Isaac, sans préciser une destination absente du texte.
- source_word: ወኵሎ፡ ወሀቦ
  choice: mais à celui-ci, il donna tout
  rationale: Rend à la fois « tout » et le suffixe objet masculin singulier de ወሀቦ ; « celui-ci » renvoie naturellement à Isaac malgré la coupure abrupte du verset.
theological_decisions:
- issue: Identité du bénéficiaire de « il donna tout »
  choice: « à celui-ci », avec Isaac comme antécédent contextuel
  alternative: '« il lui donna tout », ou conserver une fin plus abrupte : « mais il donna tout »'
  rationale: Le verbe guèze porte un suffixe objet masculin singulier. Le contexte immédiat pointe vers Isaac ; la traduction conserve le pronom plutôt que de remplacer explicitement celui-ci par son nom.
- issue: Sujet de la bénédiction initiale
  choice: 'Sujet indéfini : « l’on bénira »'
  alternative: « ils béniront »
  rationale: Le texte ne nomme pas le sujet. Une tournure indéfinie française préserve cette ambiguïté au lieu de rattacher arbitrairement le verbe à un groupe précis.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste claire tout en maintenant l’indétermination du sujet initial et la légère tension du pronom final. « Qetoura » suit une translittération française courante du nom biblique.
