translation:
  language: fr
  text: … des jours devant Dieu.[a] Joseph se souvint de cette affaire et consentit à coucher avec elle.[b] Elle le supplia pendant une année, puis une deuxième, mais il refusa de l’écouter. Et elle s’en assura.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte fourni commence par un fragment qui semble appartenir à la phrase précédente.
    reason: Signaler un probable décalage dans le découpage des versets sans omettre les mots présents dans la source.
  - marker: b
    text: Le texte guèze porte littéralement « consentit à coucher avec elle ». Il se peut qu’une négation ait disparu de la transmission, puisque la suite dit que Joseph refusa de l’écouter.
    reason: Préserver la leçon effectivement fournie tout en avertissant le lecteur de sa tension avec le contexte.
  - marker: c
    text: Le dernier verbe, isolé à la fin de l’extrait, peut aussi se comprendre par « elle vérifia », « elle établit » ou, si le sujet est masculin, « il s’en assura ». La phrase paraît se poursuivre au verset suivant.
    reason: Le sens exact, le sujet et le rattachement syntaxique de ወአጠየቀ sont incertains dans ce segment tronqué.
lexical_decisions:
- source_word: መዋዕለ፡ ቅድመ፡ እግዚአብሔር
  choice: … des jours devant Dieu
  rationale: Rend littéralement le fragment « jours devant Dieu ». Les points de suspension signalent que le texte fourni commence au milieu d’une proposition, vraisemblablement à cause d’un découpage de verset.
- source_word: ወአፈቀደ፡ ይስክብ፡ ምስሌሃ
  choice: et consentit à coucher avec elle
  rationale: አፈቀደ exprime ici le fait de vouloir, permettre ou consentir, et ይስክብ ምስሌሃ signifie « coucher avec elle ». La traduction suit le texte guèze transmis, malgré la tension avec la proposition suivante.
- source_word: ወአስተብቍዐቶ፡ ዓመተ፡ አሐደ፡ ወካልአ
  choice: Elle le supplia pendant une année, puis une deuxième
  rationale: Le suffixe masculin de አስተብቍዐቶ désigne Joseph comme objet; le sujet implicite est naturellement la femme. « Puis une deuxième » rend l’expression distributive « une année et une autre/seconde ».
- source_word: ወአበየ፡ ሰሚዐ
  choice: mais il refusa de l’écouter
  rationale: አበየ signifie « refuser » et ሰሚዐ « entendre/écouter ». « Mais » explicite l’opposition logique portée par la succession des propositions.
- source_word: ወአጠየቀ
  choice: Et elle s’en assura
  rationale: Le verbe final isolé peut exprimer l’idée de vérifier, établir ou s’assurer de quelque chose. Le féminin est retenu d’après le sujet contextuel le plus proche, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Contradiction apparente concernant la réaction de Joseph
  choice: Traduire positivement አፈቀደ par « consentit »
  alternative: « ne consentit pas » ou « refusa »
  rationale: Le texte guèze fourni ne porte pas de négation devant አፈቀደ. Ajouter « ne… pas » harmoniserait le récit, mais corrigerait silencieusement la source et supprimerait une réelle difficulté textuelle.
- issue: Sujet du dernier verbe
  choice: « elle »
  alternative: « il » ou une formulation impersonnelle
  rationale: Le guèze ne marque pas ici explicitement le sujet. Le contexte immédiat favorise la femme, mais cette attribution reste incertaine et est donc documentée.
translation_notes:
  register: Français international moderne, sobre et narratif. Les formulations restent dignes et accessibles. Les points de suspension et les notes rendent visibles les deux problèmes de segmentation, au début et à la fin, tandis que la difficulté textuelle centrale n’est pas harmonisée silencieusement.
