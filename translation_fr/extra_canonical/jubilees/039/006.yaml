review_pass:
  verdict: revise
  source_fidelity: 'Le segment initial est bien rendu comme un fragment, et ወአፈቀደ est affirmatif dans le texte guèze fourni : il faut donc conserver une formulation positive, malgré le « refused » de la piste anglaise et la tension narrative qui en résulte. ወአስተብቍዐቶ et ወአበየ፡ ሰሚዐ sont correctement compris comme l’insistance de la femme puis le refus de Joseph. Le dernier verbe isolé demeure syntaxiquement et sémantiquement incertain dans cet extrait tronqué; une note est justifiée.'
  naturalness: « Voulut coucher avec elle » rend plus directement la valeur de volonté/désir de አፈቀደ que « consentit à coucher avec elle », qui suggère davantage l’acquiescement à une demande. « Une seconde année » est idiomatique et plus fluide que « puis une deuxième ».
  terminology: « Dieu », « Joseph » et le vocabulaire narratif sont appropriés au français international moderne. Aucune normalisation théologique n’est introduite. La note sur la contradiction doit signaler le conflit textuel sans avancer l’hypothèse non démontrable qu’une négation aurait disparu de la transmission.
  issues:
  - severity: medium
    issue: Nuance de ወአፈቀደ
    rationale: « Consentit » est possible dans certains contextes, mais « voulut » reflète plus précisément le sens usuel de ce verbe dans cette construction et évite d’ajouter l’idée d’un consentement donné à l’initiative de la femme.
  - severity: medium
    issue: Note b conjecturale
    rationale: Affirmer qu’une négation « a disparu de la transmission » dépasse les données du segment fourni. La note peut constater la divergence avec la suite et avec l’audit anglais, sans proposer une cause textuelle non établie.
  - severity: low
    issue: Formulation temporelle
    rationale: « Une seconde année » est une tournure plus naturelle et plus nette que « une deuxième » pour rendre « une année et une autre ».
  revised_text: … des jours devant Dieu.[a] Joseph se souvint de cette affaire et voulut coucher avec elle.[b] Elle le supplia pendant une année, puis pendant une seconde année, mais il refusa de l’écouter. Et elle s’en assura.[c]
  revised_footnotes:
  - marker: a
    text: Le texte fourni commence par un fragment qui semble appartenir à la phrase précédente.
    reason: Signaler un probable décalage dans le découpage des versets sans omettre les mots présents dans la source.
  - marker: b
    text: 'Le texte guèze fourni est affirmatif : littéralement, « voulut coucher avec elle ». Cette leçon contraste avec le refus exprimé dans la proposition suivante et avec la piste anglaise, qui porte « refusa » ici.'
    reason: Préserver la leçon du texte source fourni et documenter la divergence sans introduire une négation absente.
  - marker: c
    text: Le dernier verbe, isolé à la fin de l’extrait, peut aussi se comprendre par « elle vérifia », « elle établit » ou, si le sujet est masculin, « il s’en assura ». La phrase paraît se poursuivre au verset suivant.
    reason: Le sens exact, le sujet et le rattachement syntaxique de ወአጠየቀ sont incertains dans ce segment tronqué.
  revision_rationale: La révision conserve la leçon affirmative du guèze, conformément à la priorité donnée à la source, mais remplace « consentit » par « voulut », plus exact lexicalement. Elle améliore la fluidité temporelle et reformule la note critique afin qu’elle décrive la tension attestée sans spéculer sur une omission dans la transmission. Les ancres a, b et c restent toutes présentes et correspondent aux notes.
