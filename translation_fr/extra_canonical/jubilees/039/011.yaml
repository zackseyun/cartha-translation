  text: There in the prison, the LORD gave Joseph favor and mercy before the chief of the keepers of the prison-house[a], because he saw that the LORD was with him, and everything
translation:
  language: fr
  text: Là, dans la prison, le SEIGNEUR accorda à Joseph faveur et compassion auprès du chef des gardiens de la prison[a], car il vit que le SEIGNEUR était avec lui, et tout…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre emploie la même racine signifiant « garder » que précédemment; dans ce contexte, il désigne le responsable de la prison plutôt qu’une fonction dans la maison de Potiphar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ
  choice: Là, dans la prison
  rationale: Rend explicitement l’indication de lieu initiale, omise dans une version antérieure, dans un français naturel.
- source_word: ሞገሰ
  choice: faveur
  rationale: Exprime l’accueil favorable ou la grâce dont Joseph bénéficie auprès du responsable de la prison.
- source_word: ምሕረተ
  choice: compassion
  rationale: Conserve la distinction avec « faveur » et rend l’idée de miséricorde ou de bonté compatissante.
- source_word: ሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ
  choice: chef des gardiens de la prison
  rationale: Rend le titre selon son contexte carcéral tout en conservant le vocabulaire de la garde.
- source_word: ወኵሎ
  choice: et tout…
  rationale: Le texte fourni s’interrompt sur cette expression; les points de suspension signalent honnêtement l’inachèvement sans compléter le sens par conjecture.
theological_decisions:
- issue: Référent du sujet de « il vit »
  choice: Maintien du pronom ambigu « il »
  alternative: « car le chef vit » ou « car celui-ci vit »
  rationale: Le sujet n’est pas nommé à cet endroit dans le texte fourni; le français conserve donc cette légère ambiguïté au lieu de la résoudre silencieusement.
- issue: Traduction du nom divin እግዚአብሔር
  choice: SEIGNEUR
  alternative: Dieu ou Seigneur
  rationale: Cette forme française solennelle suit l’usage biblique courant et demeure cohérente aux deux occurrences du verset.
translation_notes:
  register: Français international moderne, sobre et biblique. La syntaxe reste accessible, et l’interruption finale du texte source est conservée visiblement plutôt que réparée par conjecture.
