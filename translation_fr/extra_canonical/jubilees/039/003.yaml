  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
translation:
  language: fr
  text: dans la maison de l’Égyptien, à cause de Joseph.[a] Tout ce qu’il faisait, le Seigneur le faisait réussir. L’Égyptien remit tout entre les mains de Joseph, car il voyait que le Seigneur était avec lui et que tout ce qu’il faisait, le Seigneur le faisait réussir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette expression poursuit probablement la phrase du verset précédent. On peut aussi ponctuer : « dans la maison de l’Égyptien à cause de Joseph, et tout ce qu’il faisait, le Seigneur le faisait réussir ».'
    reason: Le début du verset est un groupe prépositionnel sans verbe explicite; sa liaison syntaxique avec le contexte précédent ou avec la proposition suivante demeure ambiguë.
lexical_decisions:
- source_word: ይሴርሖ (yǝsärḥo)
  choice: le faisait réussir
  rationale: Le verbe exprime ici le fait de donner réussite ou prospérité à ce qui est entrepris. Cette tournure française est naturelle et conserve Dieu comme agent de la réussite.
- source_word: ኀደገ … ኵሎ፡ በእዴሁ፡ ለዮሴፍ
  choice: remit tout entre les mains de Joseph
  rationale: Reproduit l’image sémitique de la responsabilité confiée à la main de Joseph, tout en restant idiomatique en français.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Titre divin traditionnel et intelligible correspondant à la désignation guèze dans ce contexte.
- source_word: ምስሌሁ
  choice: était avec lui
  rationale: Rend directement l’idée de présence et d’accompagnement divins sans en préciser davantage la nature.
theological_decisions:
- issue: Agent de la réussite de Joseph
  choice: Le Seigneur est explicitement maintenu comme celui qui fait réussir ses actes.
  alternative: « Joseph réussissait dans tout ce qu’il faisait »
  rationale: La formulation du texte source attribue directement la réussite à l’action divine; une simple description du succès de Joseph atténuerait cette affirmation.
- issue: Portée de « tout » confié à Joseph
  choice: « remit tout entre les mains de Joseph »
  alternative: « lui confia tous ses biens »
  rationale: Le texte dit littéralement « tout » et ne précise pas « ses biens »; la traduction préserve cette légère indétermination.
translation_notes:
  register: Français moderne, international et digne. La minuscule initiale signale que l’ouverture poursuit vraisemblablement la phrase du verset précédent. La répétition finale est conservée conformément au témoignage textuel consulté, malgré le caractère tronqué de l’extrait guèze fourni après « et tout ».
