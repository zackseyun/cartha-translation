  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: fr
  text: Jacob habita dans le pays où son père avait séjourné, au pays de Canaan. Voici la descendance de Jacob. Joseph avait dix-sept ans lorsqu’on le fit descendre en Égypte, et Potiphar, officier[a] du pharaon et chef des gardes, l’acheta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut aussi signifier « eunuque »; dans les cours royales, il pouvait servir de titre à un haut fonctionnaire sans nécessairement indiquer son état physique.
    reason: Préserve l’ambiguïté lexicale du titre de Potiphar au lieu de la résoudre silencieusement.
lexical_decisions:
- source_word: ፍልሰተ፡ አቡሁ
  choice: où son père avait séjourné
  rationale: Rend naturellement l’idée du séjour de son père dans un pays où il résidait comme étranger, sans alourdir la phrase par « pays des séjours ».
- source_word: ትዝምደ፡ ያዕቆብ
  choice: la descendance de Jacob
  rationale: Conserve la formule généalogique tout en employant un français moderne et intelligible.
- source_word: አውረድዎ
  choice: on le fit descendre
  rationale: Préserve le mouvement traditionnel exprimé par le verbe « faire descendre », avec un sujet indéfini correspondant au pluriel verbal de la source.
- source_word: ኅፅዉ
  choice: officier
  rationale: Dans ce contexte de cour, le terme désigne vraisemblablement une fonction officielle; « officier » communique ce rôle sans affirmer que Potiphar était littéralement castré.
