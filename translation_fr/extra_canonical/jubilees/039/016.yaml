- source_word: ሊቀ፡ ሐበዝት
  choice: le chef des boulangers
  rationale: Rend directement le titre de celui qui dirige les boulangers.
- source_word: ነገርዎ፡ ለዮሴፍ
  choice: ils le racontèrent à Joseph
  rationale: Le verbe signifie qu’ils rapportèrent ou racontèrent la chose à Joseph; le pronom français « le » reprend naturellement le rêve évoqué.
