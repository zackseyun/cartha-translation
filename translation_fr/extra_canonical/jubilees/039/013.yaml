  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: fr
  text: Il resta là deux ans. En ce temps-là, le pharaon, roi d’Égypte, se mit en colère contre ses deux eunuques, le chef des échansons et le chef des boulangers, et il les fit mettre en prison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤቱ፡ ሕፁዋኒሁ
  choice: ses deux officiers
  rationale: Le terme désigne des fonctionnaires de cour et peut aussi évoquer des eunuques. « Officiers » rend naturellement leur fonction sans affirmer qu’ils avaient nécessairement été castrés.
- source_word: ሊቀ፡ መዛርት
  choice: le chef des échansons
  rationale: Désigne le responsable des serviteurs chargés du vin et de la boisson royale; « échanson » est le terme français consacré dans ce contexte de cour.
- source_word: ሊቀ፡ ሐበዝት
  choice: le chef des boulangers
  rationale: Rend directement le titre du responsable des boulangers de la cour.
- source_word: ተምዐዐ
  choice: se mit en colère
  rationale: Exprime l’entrée dans un état de colère, conformément à la valeur verbale du texte.
