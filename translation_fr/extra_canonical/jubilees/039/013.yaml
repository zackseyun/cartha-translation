translation_notes:
  register: Français moderne, clair et digne. Le terme traditionnel « échansons » est conservé pour la précision du titre de cour; « officiers » évite de trancher inutilement l’ambiguïté de ሕፁዋኒሁ entre fonctionnaires de cour et eunuques.
