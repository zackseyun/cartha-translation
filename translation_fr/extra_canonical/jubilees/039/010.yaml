  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: fr
  text: Et l’Égyptien vit le vêtement de Joseph et la barre de la porte brisée. Il entendit le récit de sa femme, puis il fit mettre Joseph dans la prison, à l’endroit où étaient détenus les prisonniers du roi. Et Joseph resta là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  choice: l’Égyptien
  rationale: Reproduit directement la désignation ethnique du personnage sans l’identifier davantage que ne le fait le texte.
- source_word: ልብሶ፡ ለዮሴፍ
  choice: le vêtement de Joseph
  rationale: Rend littéralement le vêtement appartenant à Joseph, laissé comme preuve dans le récit.
- source_word: ማዕጾ፡ ስቡረ
  choice: la barre de la porte brisée
  rationale: Le contexte et la version de consultation appuient le sens concret de barre ou verrou de porte; l’accord français rattache «brisée» à «barre».
- source_word: ነገረ፡ ብእሲቱ
  choice: le récit de sa femme
  rationale: «Récit» restitue sobrement les paroles ou la version des faits donnée par la femme.
- source_word: ቤተ፡ ሞቅሕ
  choice: la prison
  rationale: Expression naturelle en français moderne pour la maison de détention, sans lourdeur littérale.
- source_word: ወሀሎ
  choice: Et Joseph resta là
  rationale: Le verbe exprime sa présence ou son maintien en ce lieu. Le sujet explicite évite l’ambiguïté du pronom français tout en n’ajoutant pas «en prison».
