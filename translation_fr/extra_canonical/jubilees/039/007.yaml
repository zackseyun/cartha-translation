    rationale: « Loin d’elle » exprime le résultat de la fuite, tandis que l’expression source signifie plus précisément qu’il court dehors « de devant sa face ». « Hors de sa présence » conserve mieux cette formulation.
  - severity: low
    issue: Conjonction finale affaiblie
    rationale: Le dernier mot commence par « et ». « Et elle vit… » préserve la continuité syntaxique du récit mieux que « Alors elle vit… ».
