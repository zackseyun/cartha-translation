  to: Elle le saisit dans la maison pour le contraindre à coucher avec elle[a]. Elle ferma les portes de la maison et le saisit, mais il laissa son vêtement dans sa main, brisa la barre de la porte et s’enfuit au-dehors, hors de sa présence. Et elle vit…
