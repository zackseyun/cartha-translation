  text: And she seized him in the house to force him to lie with her[a], and she shut the doors of the house and seized him, but he left his garment in her hand and broke the door-bar and ran outside from before her face. And she saw
translation:
  language: fr
  text: Elle le saisit dans la maison pour le contraindre à coucher avec elle[a]. Elle ferma les portes de la maison et le saisit, mais il laissa son vêtement dans sa main, brisa la barre de la porte et s’enfuit au-dehors, hors de sa présence. Et elle vit…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La narration est très condensée : elle ferme les portes, le saisit, puis il abandonne son vêtement, brise la barre de la porte et s’enfuit. L’ordre précis des actions peut refléter la segmentation resserrée du texte éthiopien.'
    reason: segmentation_note
lexical_decisions:
- source_word: ወአንዘተ
  choice: Elle le saisit
  rationale: Le verbe, présent deux fois dans le texte, signifie ici qu’elle s’empare de Joseph; les deux occurrences sont conservées.
- source_word: ከመ፡ ትትበአስ፡ ይስክብ፡ ምስሌሃ
  choice: pour le contraindre à coucher avec elle
  rationale: Cette formulation naturelle rend le but coercitif exprimé par la proposition et préserve explicitement l’absence de consentement.
- source_word: ዐጸወት፡ ኆኅተ፡ ቤት
  choice: Elle ferma les portes de la maison
  rationale: Le pluriel «portes» suit la forme du texte guèze, sans le réduire à une seule porte.
- source_word: ወኀደገ፡ ልብሶ፡ ውስተ፡ እዴሃ
  choice: mais il laissa son vêtement entre ses mains
  rationale: «Mais» explicite sobrement le contraste narratif; «entre ses mains» est idiomatique en français et respecte le sens de la locution source.
- source_word: ወሰበረ፡ ማዕጾ
  choice: brisa la barre de la porte
  rationale: Le substantif désigne le dispositif de fermeture ou la barre; cette traduction rend le moyen concret par lequel il sort.
- source_word: ወጐየ፡ አፍአ፡ እምቅድመ፡ ገጻ
  choice: s’enfuit dehors, loin d’elle
  rationale: «S’enfuit dehors» rend la fuite vers l’extérieur; «loin d’elle» transpose naturellement l’expression littérale «de devant son visage».
- source_word: ወርእየት
  choice: Alors elle vit…
  rationale: Le dernier verbe est conservé malgré son complément reporté au verset suivant; les points de suspension signalent cette phrase inachevée sans inventer d’objet.
theological_decisions:
- issue: Nature coercitive de la scène
  choice: «pour le contraindre à coucher avec elle»
  alternative: «afin qu’il couche avec elle»
  rationale: Le contexte verbal décrit une saisie physique; la traduction ne doit ni atténuer cette contrainte ni suggérer le consentement de Joseph.
- issue: Fin suspendue du verset
  choice: «Alors elle vit…»
  alternative: omettre la proposition ou lui fournir un complément
  rationale: Le texte source se termine par un verbe de vision sans objet exprimé dans ce segment. La traduction conserve cette tension syntaxique au lieu de supprimer le verbe ou d’anticiper le verset suivant.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de «saisit» est maintenue parce qu’elle correspond à deux occurrences distinctes dans le texte source. La fin suspendue est signalée typographiquement afin de respecter la coupure du verset.
