translation:
  language: fr
  text: « J’ai élevé la voix, et il a couru, laissant son vêtement dans ma main quand je l’ai saisi, puis il a brisé la porte[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la barre de la porte ».
    reason: Le nom guèze désigne principalement la porte, mais peut être compris ici comme son dispositif de fermeture.
lexical_decisions:
- source_word: አልዐልኩ፡ ቃለየ
  choice: J’ai élevé la voix
  rationale: Rend directement l’expression guèze, avec une tournure française naturelle.
- source_word: ጐየ
  choice: il s’est enfui
  rationale: Dans ce contexte d’accusation, le verbe exprime une fuite plutôt qu’une simple course.
- source_word: ኀደገ፡ ልብሶ፡ ውስተ፡ እዴየ
  choice: en laissant son vêtement dans ma main
  rationale: Conserve l’image concrète et l’enchaînement du texte source.
- source_word: በጊዜ፡ አንተ፡ አኀዝክዎ
  choice: lorsque je l’ai saisi
  rationale: Le pronom de première personne est requis par la forme verbale; le pronom indépendant présent dans l’édition paraît textuellement difficile et n’est pas reproduit comme un « tu » incohérent dans le discours.
- source_word: ሰበረ፡ ማዕጾ
  choice: il a brisé la porte
  rationale: ማዕጾ désigne normalement une porte; « briser » préserve la force du verbe source sans substituer « barre de porte » dans le corps du texte.
