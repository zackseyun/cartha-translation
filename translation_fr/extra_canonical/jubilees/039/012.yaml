  revision_rationale: La révision retire une explicitation contextuelle qui altérait l’ambiguïté de la source, tout en conservant une formulation française naturelle. Elle remplace aussi le pronom final ambigu par « tout », afin que l’achèvement attribué au SEIGNEUR porte clairement sur l’œuvre accomplie par Joseph.
