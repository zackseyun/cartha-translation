  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: fr
  text: Tout ce que Joseph faisait, le SEIGNEUR le faisait réussir. Le chef des gardiens de la prison lui confia tout et ne savait rien de ce qui était avec lui[a], car Joseph faisait tout, et le SEIGNEUR menait tout à son terme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne savait rien de ce qui était avec lui ». Le référent de « lui » n’est pas précisé par la tournure concise du guèze.'
    reason: Préserve dans le texte la formulation proche de la source et signale sans la trancher l’ambiguïté du pronom.
lexical_decisions:
- source_word: ይሴርሖ
  choice: le faisait réussir
  rationale: Le verbe exprime ici l’idée de faire prospérer ou réussir ce qui est entrepris; cette formulation est naturelle en français et conserve l’action attribuée au SEIGNEUR.
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: le chef des gardiens de la prison
  rationale: 'Rend explicitement la fonction composée: le responsable des gardiens du lieu de détention.'
- source_word: ይፈጽም
  choice: le menait à bonne fin
  rationale: Le verbe signifie accomplir, achever ou mener à son terme. «Menait à bonne fin» restitue cette nuance sans simplement répéter l’idée de réussite du début du verset.
theological_decisions:
- issue: Rapport entre l’activité de Joseph et l’action du SEIGNEUR
  choice: «Joseph faisait tout, et le SEIGNEUR le menait à bonne fin»
  alternative: «Joseph faisait tout, et le SEIGNEUR accomplissait tout»
  rationale: La traduction maintient côte à côte l’action réelle de Joseph et l’efficacité décisive du SEIGNEUR, sans réduire l’une à l’autre ni préciser davantage leur articulation.
- issue: Identification du sujet au début du verset
  choice: Nommer Joseph dans «Tout ce que Joseph faisait»
  alternative: Conserver le seul pronom «il»
  rationale: Le contexte et la dernière proposition identifient Joseph comme l’agent humain. Son nom évite en français une ambiguïté artificielle avec le SEIGNEUR.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme entre le travail de Joseph et l’action du SEIGNEUR, tout en clarifiant les référents nécessaires à une lecture naturelle.
