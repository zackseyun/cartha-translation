  text: And that woman saw that he would not lie with her, and she accused him before his master, saying, “Your Hebrew servant, whom you love, wanted to force me[a] so as to lie with me; and it happened that when
translation:
  language: fr
  text: 'Et cette femme vit qu’il ne voulait pas coucher avec elle, et elle l’accusa devant son maître en disant : « Ton esclave hébreu, que tu aimes, a voulu me contraindre[a] à coucher avec lui. Et il arriva que, lorsque… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « me contraindre » peut aussi avoir le sens plus général de « m’agresser » ou de « se moquer de moi » ; cependant, les mots qui suivent indiquent ici une accusation de tentative de contrainte sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: አይስክብ፡ ምስሌሃ
  choice: il ne voulait pas coucher avec elle
  rationale: Rend naturellement en français le refus exprimé dans la proposition, tout en conservant le sens sexuel explicite de « coucher avec ».
- source_word: ጠየቀተ፡ ቅድመ፡ እግዚአ
  choice: elle l’accusa devant son maître
  rationale: La scène décrit une plainte portée contre Joseph auprès de son maître ; « accusa » exprime clairement la fonction de l’acte.
- source_word: ገብርከ፡ ዕብራዊ
  choice: ton serviteur hébreu
  rationale: « Serviteur » garde le statut subordonné sans durcir inutilement le terme en « esclave » ; l’ordre français est naturel.
- source_word: ዘታፈቅር
  choice: que tu aimes
  rationale: Traduction directe qui préserve l’accusation personnelle adressée au maître.
- source_word: ይትዐገላኒ
  choice: me contraindre
  rationale: Le verbe peut désigner une contrainte, une agression ou une humiliation ; dans ce contexte, la proposition finale « à coucher avec lui » oriente vers une contrainte sexuelle sans exiger un terme plus explicite que la source.
- source_word: ወኮነ፡ ሶበ
  choice: Et il arriva que, lorsque…
  rationale: Conserve la proposition inachevée telle qu’elle apparaît dans la délimitation fournie du verset.
theological_decisions:
- issue: Nature exacte de l’accusation portée contre Joseph
  choice: « a voulu me contraindre à coucher avec lui »
  alternative: « a voulu m’agresser » ou « a voulu se moquer de moi »
  rationale: Le champ lexical permet une formulation plus générale, mais la mention immédiate de coucher avec elle donne à l’accusation une portée sexuelle. La note conserve néanmoins l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste proche de la source. La fin suspendue est volontairement conservée, puisque le texte fourni s’interrompt après « lorsque ».
