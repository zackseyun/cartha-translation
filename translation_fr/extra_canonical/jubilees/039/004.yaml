  text: And Joseph was handsome in appearance and very good to look at, and his master's wife lifted up her eyes and saw Joseph and loved him, and asked him
translation:
  language: fr
  text: Joseph était beau et très agréable à regarder. La femme de son maître leva les yeux, vit Joseph, s’éprit de lui et le sollicita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pria avec insistance ». Le contenu de sa demande n’est pas précisé dans ce verset.
    reason: Le verbe source désigne une requête ou supplication pressante; « sollicita » préserve l’implicite mais peut nécessiter une clarification.
lexical_decisions:
- source_word: ሠናይ፡ ራእዮ፡ ወላህይ፡ ራእዮ፡ ጥቀ
  choice: beau et très agréable à regarder
  rationale: Rend les deux descriptions coordonnées de l’apparence de Joseph, tout en conservant la valeur intensive de ጥቀ (« très ») dans un français naturel.
- source_word: አንሥአት፡ አዕይንቲሃ
  choice: leva les yeux
  rationale: Conserve l’image concrète et l’expression sémitique du texte source, qui reste idiomatique en français.
- source_word: አፍቀረቶ
  choice: s’éprit de lui
  rationale: Exprime ici l’attirance amoureuse de la femme pour Joseph sans réduire le verbe à un simple constat visuel.
- source_word: አስተብቍዐቶ
  choice: le sollicita
  rationale: Rend l’idée d’une demande pressante tout en laissant son contenu implicite, comme dans ce verset.
