  text: For Pharaoh, the chief of the guards. And he appointed Joseph over all his house, and the blessing of the LORD came to be.
translation:
  language: fr
  text: Le chef des gardes de Pharaon[a] établit Joseph sur toute sa maison, et la bénédiction du Seigneur advint.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte commence par une expression elliptique : littéralement, « de/pour Pharaon, chef des gardes ». La traduction explicite le titulaire de cette fonction comme sujet de l’action suivante, sans lui ajouter de nom.'
    reason: Préserver l’ellipse initiale tout en assurant une syntaxe française claire.
  - marker: b
    text: Littéralement, « et la bénédiction du Seigneur fut » ou « advint ». L’extrait ne précise ni sur qui ni sur quoi elle advint.
    reason: Conserver l’incomplétude de la proposition source sans ajouter un lieu ou un bénéficiaire.
lexical_decisions:
- source_word: ለፈርዖን፡ ሊቀ፡ ዐቀብት
  choice: Chef des gardes de Pharaon
  rationale: La construction exprime la fonction de chef des gardes attachée à Pharaon. Le français réordonne naturellement les éléments sans ajouter de nom absent du texte fourni.
- source_word: ወሤሞ፡ ለዮሴፍ፡ ዲበ፡ ኵሉ፡ ቤቱ
  choice: il établit Joseph sur toute sa maison
  rationale: « Établir sur » conserve l’idée d’une nomination à l’autorité, tandis que « maison » garde la portée potentiellement domestique et administrative de ቤት.
- source_word: ወኮነት፡ በረከተ፡ እግዚአብሔር
  choice: et la bénédiction du Seigneur fut là
  rationale: Le rendu demeure proche de la proposition existentielle du texte guèze. « Fut là » produit un français intelligible sans préciser un bénéficiaire ou un lieu que l’extrait ne nomme pas.
theological_decisions:
- issue: Rendu du nom divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « Le Seigneur » est le rendu français courant et digne du terme guèze, sans introduire une convention confessionnelle particulière.
- issue: Portée de la bénédiction divine
  choice: ne pas ajouter « sur la maison de l’Égyptien à cause de Joseph »
  alternative: expliciter le lieu et la cause d’après une forme textuelle plus longue ou le contexte
  rationale: L’extrait source fourni s’arrête après l’énoncé de la bénédiction. Le projet conserve cette tension textuelle au lieu d’importer des précisions absentes.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve les ellipses du texte transmis tout en donnant à la phrase une syntaxe française lisible.
