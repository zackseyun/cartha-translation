  terminology: « Le Seigneur », « Dieu Très-Haut », « condamnation à mort » et « livres éternels » conviennent. « Relations sexuelles » communique clairement, dans un français moderne, l’acte interdit sans importer de qualification confessionnelle supplémentaire.
