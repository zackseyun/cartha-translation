  source_fidelity: 'Le sens général est fidèle : Joseph se préserve, se souvient du Seigneur et de l’instruction patriarcale, l’interdit vise les relations avec une femme ayant un mari, et le jugement céleste ainsi que l’inscription dans les livres éternels sont maintenus. La finale በኵሉ exprime toutefois la continuité (« sans cesse ») plutôt que « pour toujours », déjà largement porté par « éternels ».'
