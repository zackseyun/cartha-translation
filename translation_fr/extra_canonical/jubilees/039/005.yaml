  yaml_path: translation/extra_canonical/jubilees/039/005.yaml
  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
translation:
  language: fr
  text: 'pour coucher avec elle. Mais il veilla sur son âme, se souvint du Seigneur et des paroles que Jacob, son père, avait l’habitude de réciter, tirées des paroles d’Abraham[a] : aucun homme ne doit avoir de relations sexuelles avec une femme mariée, car une condamnation à mort a été décrétée contre lui dans le ciel, devant le Dieu Très-Haut, et son péché est inscrit contre lui dans les livres éternels, sans cesse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La mention des paroles d’Abraham que Jacob avait coutume de réciter est un développement caractéristique du livre des Jubilés : elle rattache le refus de Joseph à un enseignement patriarcal transmis, et non à sa seule conviction personnelle.'
    reason: cross_reference
lexical_decisions:
- source_word: አመጠወ፡ ነፍሶ፡
  choice: il veilla sur son âme
  rationale: La tournure exprime la préservation ou la garde de soi; cette formulation conserve l’image anthropologique du texte tout en restant intelligible en français.
- source_word: ይዜሙ፡
  choice: avoir de relations sexuelles
  rationale: Dans ce contexte d’union avec une femme mariée, le verbe désigne une conduite sexuelle illicite. Cette expression moderne évite l’ambiguïté actuelle de « fornication » tout en laissant la qualification découler du contexte.
- source_word: ብእሲት፡ እንተ፡ ባቲ፡ ምት፡
  choice: une femme mariée
  rationale: La séquence signifie littéralement une femme à laquelle appartient un mari, c’est-à-dire une femme ayant un mari.
- source_word: ኵነኔ፡ ሞት፡
  choice: une condamnation à mort
  rationale: Rend directement l’idée d’un jugement ou verdict de mort, plutôt que la seule notion abstraite de peine.
- source_word: መጻሕፍት፡ ዘለዓለም፡
  choice: les livres éternels
  rationale: Conserve l’expression apocalyptique littérale du texte source.
- source_word: በኵሉ፡
  choice: pour toujours
  rationale: Le terme final exprime la permanence ou la continuité; aucune mention supplémentaire du Seigneur ne figure à cet endroit dans le guèze.
theological_decisions:
- issue: Force normative de ከመ፡ አልቦ፡ መነሂ፡ ... ዘይዜሙ፡
  choice: aucun homme ne doit avoir de relations sexuelles
  alternative: il n’est aucun homme qui ait des relations sexuelles
  rationale: Bien que la forme soit littéralement descriptive, son emploi dans l’enseignement patriarcal transmis fonctionne comme une interdiction. La formulation retenue rend cette valeur prescriptive sans ajouter une doctrine particulière.
- issue: Localisation et autorité du jugement
  choice: décrétée contre lui dans le ciel, devant le Dieu Très-Haut
  alternative: décrétée pour lui dans les cieux en présence du Dieu Très-Haut
  rationale: La traduction maintient ensemble le décret céleste et sa formulation devant Dieu, sans préciser davantage l’agent ni le mécanisme du jugement.
- issue: Inscription du péché
  choice: son péché est inscrit à son encontre
  alternative: le péché monte à son sujet
  rationale: Dans le contexte des livres éternels, la notion d’inscription rend le sens judiciaire transmis par la tradition textuelle, tandis qu’une traduction strictement étymologique par « monte » serait obscure en français.
translation_notes:
  register: Français international moderne, digne et accessible. « Veilla sur son âme » préserve l’image sémitique; « femme mariée » et « relations sexuelles » rendent clairement le contexte sans vocabulaire archaïque. Le marqueur [a] apparaît dans le texte.
