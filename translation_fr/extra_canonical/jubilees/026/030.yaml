  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
translation:
  language: fr
  text: 'Il cria d’une voix très forte et pleine d’amertume, et dit à son père : « Bénis-moi, moi aussi, mon père ! » Son père lui répondit : « Ton frère est venu par ruse et il a pris tes bénédictions. » Il dit : « Maintenant, je comprends pourquoi on l’a appelé Jacob[a] : il m’a supplanté par deux fois. D’abord, il a pris mon droit d’aînesse, et maintenant, il a pris ma bénédiction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte associe ici le nom « Jacob » à l’idée de saisir par le talon ou de supplanter.
    reason: Le jeu de mots fondé sur le nom hébreu n’est pas directement perceptible en français.
lexical_decisions:
- source_word: በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ
  choice: d’une voix très forte et pleine d’amertume
  rationale: Rend l’intensité de « voix grande et très amère » dans un français naturel, sans affaiblir la détresse exprimée.
- source_word: በሕብል
  choice: par ruse
  rationale: Exprime le moyen trompeur ou frauduleux indiqué par le terme guèze, tout en restant idiomatique.
- source_word: በረከታቲከ
  choice: tes bénédictions
  rationale: Conserve le pluriel explicite de la forme source, malgré le singulier employé plus loin.
- source_word: አዐቀጸኒ
  choice: il m’a supplanté
  rationale: Maintient l’idée de déposséder quelqu’un en prenant sa place et permet de conserver l’écho étymologique traditionnel avec le nom Jacob.
- source_word: ልደተየ
  choice: mon droit d’aînesse
  rationale: Dans ce contexte, le mot désigne le statut et les droits attachés à la primogéniture, non simplement la naissance.
theological_decisions:
- issue: Variation entre le pluriel « tes bénédictions » et le singulier « ma bénédiction »
  choice: Conserver les nombres grammaticaux distincts du texte source
  alternative: Uniformiser les deux occurrences au singulier
  rationale: L’uniformisation harmoniserait indûment le passage et effacerait une variation réelle du guèze.
- issue: Lien entre le nom Jacob et l’action de supplanter
  choice: Conserver « supplanté » et signaler le jeu de mots en note
  alternative: Remplacer par « trompé » ou « évincé » sans note
  rationale: Le passage établit lui-même un rapport interprétatif entre le nom et l’action; la note préserve ce rapport sans présenter l’étymologie comme univoque.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition insistante « moi aussi » est conservée, tandis que les tournures trop littérales sont légèrement idiomatisées. Le pluriel « tes bénédictions » puis le singulier « ma bénédiction » suivent précisément le texte guèze.
