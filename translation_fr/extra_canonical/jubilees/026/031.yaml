  language: fr
  text: 'Il dit : « Ne m’as-tu pas réservé une bénédiction, mon père ? » Isaac répondit à Ésaü : « Voici, je l’ai établi seigneur sur toi, et je lui ai donné tous ses frères pour serviteurs ; et avec abondance… »[a]'
