  text: And he smelled the fragrant smell of his garments and blessed him and said, “Look, the smell of my son is like the smell of a field.”
translation:
  language: fr
  text: 'Il sentit l’odeur parfumée de ses vêtements, le bénit et dit : « Voici, l’odeur de mon fils est comme l’odeur d’un champ. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጼና፡ መዐዛ፡ አልባሲሁ፡
  choice: l’odeur parfumée de ses vêtements
  rationale: La formulation conserve à la fois ጼና (« odeur ») et መዐዛ (« parfum, fragrance ») sans produire en français la lourdeur de « l’odeur du parfum ».
- source_word: ናሁ፡
  choice: Voici
  rationale: Équivalent français digne et direct de la particule présentative, qui attire l’attention sur la déclaration suivante.
- source_word: ገዳም፡
  choice: un champ
  rationale: Dans ce contexte, le terme désigne un espace rural ou champêtre; « un champ » restitue naturellement l’image sans ajouter une qualification absente du texte.
