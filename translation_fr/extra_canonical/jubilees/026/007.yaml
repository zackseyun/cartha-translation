  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
translation:
  language: fr
  text: 'Jacob dit à Rébecca, sa mère : « Mère, ne me manquera-t-il pas quelque chose de tout ce que mange mon père et qui lui plaît ?[a] Mais j’ai peur, ma mère, qu’il reconnaisse ma voix et veuille me toucher. Tu sais bien que j’ai la peau lisse, tandis qu’Ésaü, mon frère, est velu. À ses yeux, je passerai pour quelqu’un qui se moque de lui ; je ferai ce qu’il ne m’a pas ordonné, il se mettra en colère contre moi, et j’attirerai sur moi une malédiction au lieu d’une bénédiction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début du verset est difficile. On peut aussi comprendre : « Mon père ne reconnaît-il pas tout ce qu’il mange et ne le distingue-t-il pas ? »'
    reason: textual_difficulty
lexical_decisions:
- source_word: ኢይምሕክ
  choice: ne me manquera-t-il pas quelque chose
  rationale: Cette tournure difficile est comprise comme exprimant un manque, conformément au sens idiomatique signalé par l’examen du guèze, plutôt que comme un verbe de reconnaissance.
- source_word: ወያሠምሮ
  choice: et qui lui plaît
  rationale: Le verbe dérive de ሠምረ, « plaire, être agréable », et se rapporte à ce que le père mange.
- source_word: ይፍቅድ፡ ይገሥሠኒ
  choice: veuille me toucher
  rationale: ይፍቅድ exprime ici la volonté ou le désir, et ይገሥሠኒ signifie « me toucher » ; Jacob craint qu’Isaac cherche à vérifier son identité par le toucher.
- source_word: ልሙጽ … ጸጓር
  choice: j’ai la peau lisse … est velu
  rationale: Cette formulation française naturelle conserve le contraste physique direct entre Jacob et Ésaü.
- source_word: ከመ፡ ዘያስተአኪ
  choice: pour quelqu’un qui se moque de lui
  rationale: Le choix conserve l’idée d’une tromperie perçue comme une dérision ou une moquerie envers Isaac.
theological_decisions:
- issue: Nature de la conséquence redoutée par Jacob
  choice: une malédiction au lieu d’une bénédiction
  alternative: la malédiction et non la bénédiction
  rationale: La formulation retenue exprime clairement l’opposition du texte sans préciser davantage l’origine ou le mécanisme de la malédiction.
- issue: Colère d’Isaac
  choice: il se mettra en colère contre moi
  alternative: il me réprimandera
  rationale: Le verbe est rendu par la colère, conformément au sens contextuel retenu, sans atténuer la réaction redoutée.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement fluidifiée, notamment par « Tu sais bien » et « À ses yeux », tout en conservant la progression de la crainte de Jacob et l’ambiguïté du premier membre grâce à une note.
