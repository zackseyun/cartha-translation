    issue: Futur antérieur injustifié dans « j’aurai fait ce qu’il ne m’a pas ordonné »
    rationale: Le texte présente Jacob comme redoutant qu’il fasse un acte non commandé, puis qu’Isaac se mette en colère et qu’une malédiction lui advienne. Le futur antérieur français suggère que l’acte sera déjà accompli avant la réaction, une nuance temporelle qui n’est pas nécessairement portée par le source. « Je ferai ce qu’il ne m’a pas ordonné » est plus fidèle et plus direct.
