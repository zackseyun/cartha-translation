- from: 'Jacob dit à Rébecca, sa mère : « Mère, ne me manquera-t-il pas quelque chose de tout ce que mange mon père et qui lui plaît ?[a] Mais j’ai peur, ma mère, qu’il reconnaisse ma voix et veuille me toucher. Tu sais bien que j’ai la peau lisse, tandis qu’Ésaü, mon frère, est velu. À ses yeux, je passerai pour quelqu’un qui se moque de lui ; j’aurai fait ce qu’il ne m’a pas ordonné, il se mettra en colère contre moi, et j’attirerai sur moi une malédiction au lieu d’une bénédiction. »'
  to: 'Jacob dit à Rébecca, sa mère : « Mère, ne me manquera-t-il pas quelque chose de tout ce que mange mon père et qui lui plaît ?[a] Mais j’ai peur, ma mère, qu’il reconnaisse ma voix et veuille me toucher. Tu sais bien que j’ai la peau lisse, tandis qu’Ésaü, mon frère, est velu. À ses yeux, je passerai pour quelqu’un qui se moque de lui ; je ferai ce qu’il ne m’a pas ordonné, il se mettra en colère contre moi, et j’attirerai sur moi une malédiction au lieu d’une bénédiction. »'
