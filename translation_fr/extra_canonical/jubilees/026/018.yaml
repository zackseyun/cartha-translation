  text: And Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so he blessed him.
translation:
  language: fr
  text: Et Isaac ne le reconnut pas, car ses mains étaient velues comme celles de son frère Ésaü ; il le bénit donc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin de le bénir » plutôt que « il le bénit donc ».'
    reason: La construction guèze peut être comprise comme exprimant soit le résultat, soit le but.
lexical_decisions:
- source_word: ኢያእመረ (ʾiyāʿmara)
  choice: ne le reconnut pas
  rationale: Dans cette scène d’identification, « reconnaître » rend naturellement le sens contextuel de « connaître, identifier ».
- source_word: ጸጓር (ṣagwār)
  choice: velues
  rationale: L’adjectif décrit les mains comme couvertes de poils, à l’image de celles d’Ésaü.
- source_word: ከመ ይባርኮ (kama yəbārko)
  choice: il le bénit donc
  rationale: 'Dans la progression narrative, la construction exprime vraisemblablement le résultat : Isaac ne le reconnut pas et, par conséquent, le bénit. L’ambiguïté possible avec une nuance de but est conservée en note.'
theological_decisions:
- issue: Valeur de ከመ suivi du subjonctif
  choice: 'résultat : « il le bénit donc »'
  alternative: 'but : « afin de le bénir »'
  rationale: Le contexte narratif favorise la conséquence, sans exclure grammaticalement une lecture finale ; aucune interprétation théologique supplémentaire n’est imposée.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve le « Et » initial du texte source et emploie un point-virgule pour rendre clairement l’enchaînement causal et narratif.
