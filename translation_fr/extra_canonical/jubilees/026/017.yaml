  text: “The voice is Jacob’s voice[17], but the hands are Esau’s hands.” And he did not recognize him, because it was a turning from heaven to remove his spirit,
translation:
  language: fr
  text: « La voix est celle de Jacob, mais les mains sont celles d’Ésaü. » Et il ne le reconnut pas, car c’était un détournement venu du ciel pour écarter son esprit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car c’était une déviation venue du ciel pour détourner son esprit ». Le sens précis de la dernière proposition, notamment celui du verbe rendu par « écarter », est incertain.'
    reason: ambiguïté lexicale et syntaxique
lexical_decisions:
- source_word: ቃል፡ ቃለ፡ ያዕቆብ
  choice: La voix est celle de Jacob
  rationale: Reproduit naturellement en français l’identification littérale de la voix de Jacob.
- source_word: እደው፡ እደወ፡ ዔሳው
  choice: les mains sont celles d’Ésaü
  rationale: Conserve le parallélisme avec la première proposition et l’identification des mains d’Ésaü.
- source_word: ሚጠት
  choice: un égarement
  rationale: Le nom désigne une action de détourner, une déviation ou un égarement; « égarement » garde ici la forme nominale et l’idée d’une perception déviée.
- source_word: እምሰማይ
  choice: venu du ciel
  rationale: Rend explicitement l’origine céleste indiquée par la préposition, sans préciser davantage l’agent.
- source_word: ለአሕልፎ፡ መንፈሱ
  choice: pour détourner son esprit
  rationale: Rend la valeur causative et finale de l’expression tout en préservant l’ambiguïté de « son esprit ».
theological_decisions:
- issue: Origine céleste de la non-reconnaissance
  choice: un égarement venu du ciel
  alternative: un égarement de la part du ciel
  rationale: La formulation retenue affirme l’origine céleste présente dans le guèze sans identifier explicitement Dieu comme agent ni développer une doctrine de la causalité divine.
- issue: Référent et sens de « son esprit »
  choice: son esprit
  alternative: son discernement
  rationale: Le texte peut viser l’esprit, la perception ou la faculté de reconnaissance d’Isaac. La traduction formelle conserve l’ambiguïté au lieu de la résoudre.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme de la déclaration est conservé. La tournure finale reste volontairement proche du guèze malgré son caractère inhabituel, avec une note signalant une autre possibilité.
