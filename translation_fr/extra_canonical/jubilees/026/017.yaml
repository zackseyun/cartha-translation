  source_fidelity: La citation initiale rend fidèlement le parallélisme du guèze. Dans la dernière proposition, ሚጠት est plus directement un « détournement / déviation » qu’un « égarement », qui décrit plus volontiers l’état d’une personne. La construction nominale, l’origine céleste et la finalité doivent rester explicites. « Détourner son esprit » est possible, mais « écarter son esprit » rend plus nettement la valeur de ለአሕልፎ (« faire passer / enlever / écarter ») sans fixer le référent de « son esprit ».
  naturalness: La formulation révisée demeure lisible dans un français narratif moderne. « Un détournement venu du ciel » est volontairement quelque peu inhabituel, comme l’expression source, mais elle est plus exacte et moins interprétative qu’« un égarement ».
  terminology: Jacob et Ésaü sont correctement orthographiés et la reprise « celle de / celles de » conserve bien le contraste. « Esprit » préserve l’ambiguïté du terme guèze et ne doit pas être remplacé par « discernement », qui l’interpréterait.
