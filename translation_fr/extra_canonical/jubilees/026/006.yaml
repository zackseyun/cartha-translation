  yaml_path: translation/extra_canonical/jubilees/026/006.yaml
  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: fr
  text: '« Maintenant, mon fils, écoute ce que je t’ordonne : va dans ton troupeau, prends-moi deux bons chevreaux, et je les préparerai pour ton père en un plat comme il l’aime. Tu l’apporteras à ton père, il mangera et te bénira devant le Seigneur avant de mourir, et tu seras béni. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማዕ፡ ወልድየ፡ ቃልየ፡ ዘአነ፡ እኤዝዘከ
  choice: mon fils, écoute ce que je t’ordonne
  rationale: Rend naturellement l’expression sémitique « écoute ma parole que je t’ordonne » tout en conservant l’appel direct et l’idée d’obéissance.
- source_word: ውስተ፡ መርዔትከ
  choice: dans ton troupeau
  rationale: Le possessif du texte source est conservé ; « troupeau » est le terme français courant adapté au contexte.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  choice: deux beaux chevreaux bien tendres
  rationale: « Chevreaux » précise qu’il s’agit de jeunes caprins ; « beaux » et « bien tendres » rendent les qualificatifs du texte sans la lourdeur d’un calque.
- source_word: መብልዐ፡ ለአቡከ፡ ዘከመ፡ ያፈቅር
  choice: pour ton père un plat comme il l’aime
  rationale: « Un plat » est plus idiomatique que « de la nourriture » dans ce contexte de préparation culinaire, et conserve l’idée de ce que le père apprécie.
- source_word: ይባርከ፡ ቅድመ፡ እግዚአብሔር
  choice: te bénira devant le Seigneur
  rationale: Conserve l’acte de bénédiction ainsi que sa dimension explicitement accomplie devant Dieu.
theological_decisions:
- issue: Rapport entre la bénédiction paternelle et Dieu
  choice: te bénira devant le Seigneur
  alternative: te bénira en présence du Seigneur
  rationale: La formulation retenue suit de près la préposition du texte et maintient la tension entre l’acte du père et l’autorité divine, sans préciser davantage leur rapport.
- issue: Conséquence finale de la bénédiction
  choice: Ainsi, tu seras béni
  alternative: et tu seras béni
  rationale: « Ainsi » exprime naturellement le lien de conséquence présent dans l’enchaînement, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent directs, le vocabulaire culinaire est naturel, et la répétition de « ton père » est conservée pour respecter l’insistance du texte source.
