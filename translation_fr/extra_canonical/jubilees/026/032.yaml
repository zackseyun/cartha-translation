  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: fr
  text: '« Je l’ai soutenu avec du blé, du vin et de l’huile. Et pour toi, que puis-je faire maintenant, mon fils ? » Ésaü dit à son père Isaac : « N’as-tu donc qu’une seule bénédiction, mon père ? Bénis-moi, moi aussi, mon père ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጽናዕክዎ
  choice: je l’ai pourvu
  rationale: Dans ce contexte, le verbe exprime l’idée d’affermir ou de soutenir quelqu’un au moyen du blé, du vin et de l’huile. « Pourvu » rend naturellement en français l’octroi de ces ressources, sans reprendre maladroitement l’image d’un affermissement matériel.
- source_word: ስርናይ፡ ወወይን፡ ወቅብዕ
  choice: de blé, de vin et d’huile
  rationale: Traduction directe et idiomatique des trois produits mentionnés.
- source_word: አሐቲኑ፡ ከመ፡ በረከት
  choice: N’as-tu donc qu’une seule bénédiction
  rationale: La tournure interrogative souligne qu’Ésaü demande s’il n’existe qu’une bénédiction disponible. « Donc » restitue naturellement son étonnement et sa détresse, sans surinterprétation.
- source_word: ባርከኒ፡ ኪያየኒ
  choice: Bénis-moi, moi aussi
  rationale: Le redoublement pronominal met en relief la demande personnelle d’Ésaü et correspond à l’insistance de « moi aussi ».
theological_decisions:
- issue: Nature et nombre de la bénédiction paternelle
  choice: Conserver la formulation « qu’une seule bénédiction »
  alternative: Paraphraser comme si Isaac ne pouvait prononcer aucune autre bénédiction
  rationale: Le texte exprime la question désespérée d’Ésaü sans définir exhaustivement la nature, l’efficacité ou l’irrévocabilité de la bénédiction. La traduction préserve cette tension.
translation_notes:
  register: Français moderne, international et digne. Le dialogue conserve l’émotion et l’insistance d’Ésaü, tandis que la première phrase privilégie une formulation naturelle correspondant au soutien matériel assuré par le blé, le vin et l’huile.
