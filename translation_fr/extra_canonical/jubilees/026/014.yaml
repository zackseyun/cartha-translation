  text: And Jacob said, “Because your God brought it before me.”
translation:
  language: fr
  text: 'Jacob répondit : « Parce que ton Dieu l’a amené devant moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤ፡ ያዕቆብ፡
  choice: Jacob répondit
  rationale: La formule signifie littéralement « et Jacob dit ». Dans cet échange dialogué, « répondit » est naturel en français et rend correctement la fonction du verbe introducteur.
- source_word: ዘ
  choice: Parce que
  rationale: La particule introduit ici la cause ou l’explication donnée par Jacob.
- source_word: አርጐዐኒ፡
  choice: l’a amené devant moi
  rationale: Le verbe exprime l’idée de faire venir ou d’amener jusqu’au locuteur. Cette formulation française reste directe tout en conservant l’expression spatiale du texte.
- source_word: አምላክከ፡
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne du singulier est conservé sans transformer l’expression en « le Seigneur », ce qui préserverait moins exactement la formulation source.
- source_word: ቅድሜየ።
  choice: devant moi
  rationale: Rend littéralement la relation spatiale « devant/en présence de moi ».
theological_decisions:
- issue: Attribution de l’événement à Dieu
  choice: « ton Dieu l’a amené »
  alternative: « Dieu me l’a fait trouver »
  rationale: Le texte attribue directement l’arrivée de l’objet à « ton Dieu ». La traduction n’explicite ni providence, ni miracle, ni découverte fortuite, afin de préserver la sobriété du texte.
translation_notes:
  register: Français moderne, clair et digne. Le tour « l’a amené devant moi » conserve la proximité formelle de la source, même s’il est légèrement plus sémitisant que « me l’a apporté ».
