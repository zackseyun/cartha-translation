  text: full, which the LORD has blessed. And may the LORD give you—and multiply you—from the dew of heaven and from the dew of the earth[23], and abundance of grain and oil may he multiply for you. Let them serve you,
translation:
  language: fr
  text: plein, que le Seigneur a béni. Que le Seigneur te donne — et te multiplie — de la rosée du ciel et de la rosée de la terre[a] ; qu’il multiplie pour toi le blé et l’huile en abondance. Qu’ils te servent,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « rosée de la terre » est inhabituelle ; d’après le parallèle de la Genèse, on pourrait attendre « fertilité de la terre ». La traduction suit ici le texte guèze sans l’harmoniser.
    reason: alternative_reading
lexical_decisions:
- source_word: ምሉእ (mǝluʾ)
  choice: plein
  rationale: L’adjectif signifie simplement « plein » et se rattache à un nom du verset précédent ; aucune mention de bénédiction ne doit être ajoutée à ce terme.
- source_word: ጠለ (ṭalla)
  choice: rosée
  rationale: Le même mot est employé pour le ciel et pour la terre ; la traduction conserve cette répétition inhabituelle au lieu d’harmoniser le second emploi avec Genèse 27.
- source_word: ስርናይ (sǝrnāy)
  choice: blé
  rationale: Terme courant désignant le blé ou, plus largement, le grain ; « blé » convient ici au registre concret de la bénédiction.
- source_word: ቅብእ (qǝbʾ)
  choice: huile
  rationale: Le nom désigne l’huile, notamment l’huile d’onction ; le contexte agricole appelle le terme général « huile ».
- source_word: ይትቀነዩ ለከ (yǝtqanayu laka)
  choice: Qu’ils te servent
  rationale: Le sujet n’est pas exprimé dans le texte guèze. Le pronom conserve cette indétermination sans ajouter « des peuples » d’après le parallèle de la Genèse.
theological_decisions:
- issue: Sujet de « qu’ils te servent »
  choice: Maintenir le sujet implicite sous la forme « ils »
  alternative: « Que des peuples te servent »
  rationale: Le texte source ne nomme ni peuples ni nations ; expliciter ce sujet harmoniserait indûment le passage avec Genèse 27.29.
- issue: Formule « rosée de la terre »
  choice: Conserver littéralement la formulation guèze
  alternative: « fertilité de la terre » ou « graisse de la terre »
  rationale: La formulation est étrange mais intelligible et témoigne du texte transmis ; elle ne doit pas être corrigée selon le parallèle biblique.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « rosée » et l’indétermination du dernier sujet sont volontairement préservées. Les tirets signalent l’incise difficile « et te multiplie » attestée entre crochets dans l’édition source.
