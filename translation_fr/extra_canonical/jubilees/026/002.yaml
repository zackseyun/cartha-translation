  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
translation:
  language: fr
  text: Et maintenant, prends ton équipement de chasse, ton carquois et ton arc. Va dans la campagne, chasse et attrape du gibier pour moi, mon fils. Prépare-moi un plat comme je l’aime et apporte-le-moi, afin que je mange et que je te bénisse avant de mourir.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንዋየ፡ ነፃዊከ
  choice: ton équipement de chasse
  rationale: Rend naturellement l’expression désignant le matériel ou les instruments du chasseur, sans la limiter aux seules armes nommées ensuite.
- source_word: ምትኃደከ፡ ወቀስትከ
  choice: ton carquois et ton arc
  rationale: Correspond aux deux objets explicitement nommés dans le texte guèze.
- source_word: ሐቅለ
  choice: dans la campagne
  rationale: Le terme désigne le champ ou l’espace ouvert; dans ce contexte de chasse, «la campagne» est plus idiomatique en français que «le champ».
- source_word: ወነዐው፡ ሊተ፡ ወአንዝ፡ ሊተ
  choice: chasse et attrape du gibier pour moi
  rationale: Conserve les deux verbes distincts, «chasser» et «prendre/attraper», conformément à la nuance relevée dans la révision.
- source_word: መብልዐ
  choice: un plat
  rationale: Le contexte appelle de la nourriture préparée; «un plat» est naturel et précis en français moderne.
- source_word: ዘከመ፡ ታፈቅር፡ ነፍስየ
  choice: comme je l’aime
  rationale: Rend idiomatiquement la tournure littérale «comme mon âme aime», où «âme» fonctionne comme pronom personnel intensif.
- source_word: ወተባርከ፡ ነፍስየ
  choice: et que je te bénisse
  rationale: La tournure guèze signifie littéralement «et que mon âme te bénisse»; le français courant exprime naturellement le sujet par «je».
theological_decisions:
- issue: 'Sujet de la bénédiction: «mon âme»'
  choice: que je te bénisse
  alternative: que mon âme te bénisse
  rationale: Ici, «mon âme» est une manière sémitique de désigner la personne elle-même, non une affirmation doctrinale sur une composante distincte de l’être humain. Le rendu idiomatique évite une étrangeté sans modifier le sens.
translation_notes:
  register: Français moderne, international et digne. Syntaxe légèrement segmentée pour la clarté orale, tout en conservant l’enchaînement des impératifs et les deux actions successives de chasse et de capture.
