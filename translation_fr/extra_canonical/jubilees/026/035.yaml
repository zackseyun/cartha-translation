  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
translation:
  language: fr
  text: '« Et ta descendance sera déracinée de sous le ciel. » Ésaü prit Jacob en haine à cause de la bénédiction dont son père l’avait béni, et il se dit en son cœur : « Maintenant, que s’approchent les jours du deuil de mon père ; alors je tuerai Jacob, mon frère. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ፡
  choice: ta descendance
  rationale: Le terme désigne la postérité ou la lignée ; « descendance » est naturel en français moderne et conserve le sens collectif.
- source_word: ይሢሮ፡
  choice: sera déracinée
  rationale: Le verbe exprime l’arrachement ou l’extirpation ; « déracinée » préserve l’image concrète de la suppression totale.
- source_word: ይትሜአክ፡
  choice: prit … en haine
  rationale: Cette tournure française rend l’hostilité durable exprimée par le verbe tout en restant digne et intelligible.
- source_word: ይእዜኒ፡
  choice: maintenant
  rationale: Conserve explicitement le marqueur temporel présent dans le texte guèze.
- source_word: ይብጻሕ፡
  choice: que s’approchent
  rationale: Le verbe signifie arriver, atteindre ou s’approcher ; cette formulation maintient l’idée que les jours de deuil se rapprochent.
- source_word: መዋዕለ፡ ላሐ፡
  choice: les jours du deuil
  rationale: Rend directement l’expression relative à la période de lamentation après la mort du père.
theological_decisions:
- issue: Rapport entre la bénédiction paternelle et la haine d’Ésaü
  choice: « à cause de la bénédiction dont son père l’avait béni »
  alternative: « au sujet de la bénédiction que son père lui avait donnée »
  rationale: La formulation retenue conserve la répétition étymologique du texte et présente la bénédiction comme le motif de la haine sans ajouter d’interprétation.
- issue: Moment envisagé pour le meurtre de Jacob
  choice: Les jours du deuil doivent d’abord s’approcher, puis Ésaü tuera Jacob
  alternative: Comprendre qu’Ésaü souhaite hâter la mort de son père
  rationale: Le texte associe le projet meurtrier aux jours de deuil du père, mais n’affirme pas explicitement qu’Ésaü veut provoquer sa mort ; la traduction évite donc cette implication.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La construction « se dit en son cœur » conserve l’intériorité explicite du texte source. « Alors » explicite légèrement la succession logique entre le deuil attendu et le meurtre projeté, sans modifier le sens.
