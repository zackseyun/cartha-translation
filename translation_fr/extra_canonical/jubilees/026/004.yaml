  text: And Esau went to the open country to hunt, and to catch, and to bring it to his father.
translation:
  language: fr
  text: Ésaü alla dans la campagne pour chasser, capturer du gibier et l’apporter à son père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገዳመ (gadāma)
  choice: dans la campagne
  rationale: Dans ce contexte de chasse, le terme désigne l’espace non cultivé ou les terres ouvertes; « dans la campagne » est naturel en français moderne.
- source_word: ያሥግር (yāśger)
  choice: chasser
  rationale: Le premier verbe exprime l’action de poursuivre le gibier.
- source_word: የአንዝ (yeʾānəz)
  choice: capturer du gibier
  rationale: Le verbe signifie saisir ou prendre. L’ajout explicatif « du gibier » fournit en français le complément sous-entendu par la séquence de chasse, sans le confondre avec « chercher ».
- source_word: ያምጽእ (yāmṣeʾ)
  choice: l’apporter
  rationale: Rend le mouvement consistant à amener la prise auprès du père; le pronom reprend naturellement « du gibier ».
