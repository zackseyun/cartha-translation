lexical_decisions:
- source_word: ተደመ፡ ይስሐቅ፡ ድማመ፡ ዐቢየ፡ ጥቀ
  choice: Isaac fut saisi d’un très grand tremblement
  rationale: Rend l’expression intensive du guèze, qui associe le verbe à un nom de même champ sémantique et ajoute « très grand », tout en restant idiomatique en français.
- source_word: መኑ፡ ውእቱ፡ ዝንቱ
  choice: Qui est donc celui
  rationale: Conserve le présent et la tournure démonstrative du texte source, ainsi que la force interrogative de « donc ».
- source_word: ዘነዐወ፡ ወአሥገረ
  choice: qui a chassé et pris du gibier
  rationale: Préserve les deux verbes distincts du guèze, sans réduire l’action à la seule chasse.
- source_word: ወበላዕኩ፡ እምኵሉ
  choice: J’ai mangé de tout
  rationale: Traduction naturelle qui maintient la portée globale de « tout ».
- source_word: ወባረክዎ
  choice: et je l’ai béni
  rationale: Le suffixe objet masculin singulier est rendu explicitement par « l’ ».
theological_decisions:
- issue: Nature et intensité de la réaction d’Isaac
  choice: fut saisi d’un très grand tremblement
  alternative: trembla d’un très grand tremblement
  rationale: La formulation retenue transmet l’intensité exceptionnelle de la réaction sans imposer une interprétation doctrinale de sa cause.
- issue: Maintien des deux actions liées à la chasse
  choice: a chassé et pris du gibier
  alternative: a chassé du gibier
  rationale: Le guèze présente deux verbes distincts; les conserver évite d’harmoniser silencieusement le passage avec une forme plus courte de Genèse 27.33.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la vive interrogation d’Isaac et l’intensité répétitive du guèze, tout en évitant une tournure artificiellement archaïque.
