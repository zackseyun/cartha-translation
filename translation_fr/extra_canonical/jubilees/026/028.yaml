translation:
  language: fr
  text: 'comme tu me l’avais ordonné. » Isaac fut saisi d’un très grand tremblement et dit : « Qui est donc celui qui a chassé et pris du gibier[a], puis me l’a apporté, et j’ai mangé de tout avant ton arrivée, et je l’ai béni ? »'
