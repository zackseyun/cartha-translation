  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: fr
  text: 'Jacob entra chez son père et dit : « Je suis ton fils. J’ai fait comme tu me l’as dit. Lève-toi, assieds-toi et mange de ce que j’ai chassé, mon père, afin que ton âme me bénisse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቦአ፡ ያዕቆብ፡ ኀበ፡ አቡሁ
  choice: Jacob entra auprès de son père
  rationale: Rend directement le mouvement vers l’intérieur et auprès du père, dans un français naturel et digne.
- source_word: አነ፡ ወልድከ
  choice: Je suis ton fils
  rationale: Conserve l’affirmation sobre du texte guèze sans préciser ici l’identité du fils.
- source_word: ገበርኩ፡ በከመ፡ ትቤለኒ
  choice: J’ai fait comme tu me l’as dit
  rationale: Traduction idiomatique et fidèle de l’accomplissement de l’ordre paternel.
- source_word: እምዘ፡ አሰገርኩ
  choice: de ce que j’ai chassé
  rationale: Le verbe désigne ici le produit de la chasse; cette formulation conserve l’action revendiquée par Jacob.
- source_word: ከመ፡ ትባርከኒ፡ ነፍስከ
  choice: afin que ton âme me bénisse
  rationale: Préserve l’expression anthropologique littérale et sa portée affective ou volitive, sans la réduire à « afin que tu me bénisses ».
theological_decisions:
- issue: Sens de « ton âme » dans la demande de bénédiction
  choice: afin que ton âme me bénisse
  alternative: afin que tu me bénisses de tout ton cœur
  rationale: La formulation littérale maintient la tension et la conception du texte source sans imposer une interprétation psychologique particulière.
translation_notes:
  register: Français international moderne, fluide et solennel sans archaïsmes. La syntaxe impérative est conservée, ainsi que l’adresse filiale « mon père ».
