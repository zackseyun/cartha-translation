  text: 'Il dit : « Est-ce bien toi, mon fils Ésaü ? » Il dit : « Je suis ton fils. » Il dit : « Apporte-le-moi, et je mangerai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንተኑ
  choice: Est-ce bien toi
  rationale: La particule interrogative emphatique -ኑ est rendue par « bien », ce qui conserve la demande de confirmation dans un français naturel.
- source_word: አቅርብ፡ ሊተ
  choice: Approche-le de moi
  rationale: L’impératif signifie littéralement faire approcher ou apporter près du locuteur. Le pronom « le » reprend naturellement le mets sous-entendu par le contexte.
- source_word: ወእብላዕ
  choice: et je mangerai
  rationale: Le verbe à la première personne est rendu simplement au futur, conformément à la succession exprimée par la coordination.
