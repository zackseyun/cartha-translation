translation:
  language: fr
  text: sera ta demeure[a], et de la rosée du ciel, d’en haut. Tu vivras par ton épée et tu serviras ton frère. Et il arrivera que, lorsque tu te révolteras et ôteras le joug de ton cou, alors tu commettras un péché complet, qui mène à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de la phrase dépend du verset précédent. Le texte est difficile et sa formulation diffère sensiblement de Genèse 27.40 ; il comporte notamment ici l’idée d’un péché menant à la mort.
    reason: textual_variant
lexical_decisions:
- source_word: ንብረትከ
  choice: ta demeure
  rationale: Le nom peut désigner l’habitation ou le lieu de résidence; « demeure » convient à la syntaxe fragmentaire héritée du verset précédent.
- source_word: በመጥባኅትከ
  choice: par ton épée
  rationale: Rend l’instrument ou le moyen de subsistance de façon naturelle, en accord avec le contexte de la bénédiction d’Ésaü.
- source_word: አበይከ
  choice: tu te révolteras
  rationale: Le verbe est à la deuxième personne masculine du singulier et peut exprimer le refus ou la rébellion; cette lecture évite l’erreur qui introduisait « ton père ».
- source_word: አስሰልከ
  choice: ôteras
  rationale: 'Deuxième personne masculine du singulier: le sujet reste « tu »; le complément est simplement « le joug ».'
- source_word: አበሳ፡ ኵሎ
  choice: un péché complet
  rationale: Le qualificatif de totalité porte sur le nom singulier « péché »; il ne signifie pas nécessairement « tous les péchés ».
- source_word: ለሞት
  choice: qui mène à la mort
  rationale: Exprime naturellement en français la relation « pour/jusqu’à la mort » sans déterminer davantage la nature de cette mort.
theological_decisions:
- issue: Le péché et la mort dans la dernière proposition
  choice: « un péché complet, qui mène à la mort »
  alternative: « tout péché jusqu’à la mort »
  rationale: La formulation retenue respecte le singulier et conserve le lien théologiquement tendu entre le péché et la mort, sans l’assimiler explicitement à une catégorie doctrinale ultérieure.
- issue: Rapport avec Genèse 27.40
  choice: Conserver la lecture propre au texte guèze
  alternative: Harmoniser avec « lorsque tu t’affranchiras, tu briseras son joug »
  rationale: Le texte fourni comporte une formulation plus dure et ne doit pas être normalisé silencieusement d’après le parallèle de la Genèse.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur prophétique est conservé. « Mais » marque naturellement le tournant de la dernière proposition; aucune précision confessionnelle n’est ajoutée.
