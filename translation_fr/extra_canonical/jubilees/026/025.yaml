- source_word: ወፅአ፡ ያዕቆብ፡ እምይስሐቅ፡ አቡሁ
  choice: Jacob fut sorti de chez Isaac, son père
  rationale: « De chez Isaac » exprime clairement en français le départ d’auprès de son père sans ajouter un lieu absent du texte.
- source_word: continuation après አቡሁ[፡
  choice: celui-ci se cacha
  rationale: La fin transmise au-delà de la coupure de l’extrait atteste cette action; « celui-ci » identifie Jacob, dernier sujet nommé, sans répétition lourde.
theological_decisions:
- issue: Portée de la malédiction et de la bénédiction
  choice: Conserver les formulations passives « sera maudit » et « sera béni »
  alternative: Expliciter Dieu comme auteur de la malédiction et de la bénédiction
  rationale: Le texte ne nomme pas explicitement l’agent; le passif préserve cette retenue et évite une précision théologique ajoutée.
- issue: Identification de celui qui se cache
  choice: Rendre le sujet par « celui-ci », renvoyant à Jacob
  alternative: Employer « Jacob se cacha »
  rationale: Le référent contextuel est Jacob, mais le pronom démonstratif conserve davantage la continuité du récit sans sur-explicitation.
