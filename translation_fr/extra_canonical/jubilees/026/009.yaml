  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: fr
  text: Jacob écouta sa mère Rébecca. Il partit, prit deux beaux chevreaux bien gras, puis les apporta à sa mère. Celle-ci en prépara un plat comme son père l’aimait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰምዐ፡ ... ቃለ
  choice: écouta
  rationale: La tournure guèze « entendre/écouter la voix de » exprime ici le fait de suivre la consigne; « écouta » reste naturel sans expliciter davantage l’obéissance.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ
  choice: deux jeunes chèvres
  rationale: Rend l’expression désignant deux jeunes caprins dans un français courant; « chevreaux » serait également possible, mais la formulation choisie suit sobrement le genre lexical du texte.
- source_word: ሠናያነ፡ ወስቡሓነ
  choice: belles et grasses
  rationale: 'Conserve les deux qualifications du guèze: bonnes/belles et grasses, ce dernier trait indiquant leur aptitude culinaire.'
- source_word: መብልዐ
  choice: un plat
  rationale: Dans ce contexte de préparation culinaire, « un plat » est plus idiomatique que le sens générique « nourriture ».
- source_word: ዘከመ፡ ያፈቅር
  choice: comme son père l’aimait
  rationale: Le verbe signifie « aimer »; le référent masculin implicite est Isaac dans le contexte immédiat, rendu par « son père » pour éviter une ambiguïté artificielle en français.
