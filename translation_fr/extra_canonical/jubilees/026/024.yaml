  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
translation:
  language: fr
  text: Que les nations et les peuples se prosternent devant toi.[a] Sois le maître de tes frères, et que les fils de ta mère se prosternent devant toi. Que toute la bénédiction dont Dieu m’a béni et dont il a béni Abraham, mon père, soit pour toi et pour ta descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début du texte guèze est abrupt : littéralement, « Nations, et que des peuples se prosternent devant toi ». Le mot « nations » pourrait être lié à la proposition du verset précédent.'
    reason: Signaler une ambiguïté réelle créée par la syntaxe et la délimitation du verset, tout en traduisant tous les mots conservés dans la source.
lexical_decisions:
- source_word: አሕዛብ … ሕዝብ
  choice: les nations et les peuples
  rationale: Rend les deux termes présents dans le texte guèze, malgré la syntaxe abrupte du début du verset.
- source_word: እግዚአ
  choice: le maître
  rationale: Dans l’expression « sois maître de tes frères », le terme exprime l’autorité humaine plutôt qu’un titre divin.
- source_word: እግዚአብሔር
  choice: Dieu
  rationale: Correspond ici au nom divin guèze sans introduire artificiellement la forme « le SEIGNEUR ».
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Expression française naturelle qui conserve le sens collectif de « semence, postérité ».
theological_decisions:
- issue: Portée de la bénédiction transmise à Jacob
  choice: « toute la bénédiction […] soit pour toi et pour ta descendance »
  alternative: Reformuler comme une déclaration certaine ou comme plusieurs bénédictions
  rationale: Le souhait exprimé par le jussif est maintenu, ainsi que le singulier collectif « bénédiction », sans préciser davantage son accomplissement.
translation_notes:
  register: Français international moderne, digne et accessible. Les formes de souhait sont rendues par « que » suivi du subjonctif; « fils de ta mère » conserve la formulation familiale précise du texte.
