  text: 'Rébecca, sa mère, lui dit : « Que ta malédiction soit sur moi, mon fils ! Écoute seulement ma voix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላዕሌየ፡ መርገምከ
  choice: Que ta malédiction retombe sur moi
  rationale: Rend l’ordre nominal emphatique de l’éthiopien (« sur moi, ta malédiction ») ainsi que sa valeur optative, dans un français naturel et solennel.
- source_word: ዳእሙ
  choice: seulement
  rationale: Conserve la restriction introduite par « mais/seulement » sans alourdir la réplique.
- source_word: ስማዕ፡ ቃልየ
  choice: Écoute seulement ma voix
  rationale: Traduit formellement « écoute ma voix », idiome qui signifie suivre ce que dit la locutrice, tout en préservant l’image du texte source.
theological_decisions:
- issue: Portée de la malédiction évoquée
  choice: Que ta malédiction retombe sur moi
  alternative: Je prends sur moi ta malédiction
  rationale: 'La formulation optative préserve la tension du texte : Rébecca accepte que la malédiction éventuelle soit dirigée contre elle, sans transformer ses paroles en explication doctrinale ou en garantie explicite.'
translation_notes:
  register: Français international moderne, direct et digne. La tournure « retombe sur moi » est idiomatique sans effacer l’image spatiale du guèze; « ma voix » conserve la formulation sémitique reconnaissable.
