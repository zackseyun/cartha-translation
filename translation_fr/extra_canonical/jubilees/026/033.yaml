  text: And Esau raised his voice and wept. And Isaac answered and said to him, “Look, away from the dew of the earth
translation:
  language: fr
  text: 'Ésaü éleva la voix et pleura. Isaac lui répondit : « Voici, loin de la rosée de la terre…[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte fourni s’interrompt au milieu de la déclaration d’Isaac.
    reason: Signaler honnêtement que le verset source transmis est incomplet et que la traduction ne doit pas en reconstruire la suite.
lexical_decisions:
- source_word: ወአንሥአ፡ ዔሳው፡ ቃሎ
  choice: Ésaü éleva la voix
  rationale: Rend directement l’idiome guèze, naturel et solennel en français.
- source_word: ወበከየ
  choice: et pleura
  rationale: Traduction simple et fidèle de l’action.
- source_word: ወአውሥአ፡ ይስሐቅ፡ ወይቤሎ
  choice: Isaac lui répondit
  rationale: Le guèze emploie une formule redondante, littéralement « répondit et lui dit » ; le français courant exprime naturellement l’ensemble par « lui répondit ».
- source_word: ናሁ
  choice: Voici
  rationale: Conserve la fonction présentative et l’allure solennelle du terme.
- source_word: እምጠለ፡ ምድር
  choice: loin de la rosée de la terre
  rationale: Dans ce contexte, እም marque l’éloignement ou la séparation plutôt qu’une simple provenance ; « loin de » préserve ce sens sans compléter la phrase tronquée.
theological_decisions:
- issue: Sens de la bénédiction concernant la rosée
  choice: loin de la rosée de la terre
  alternative: de la rosée de la terre
  rationale: Le contexte distingue le sort d’Ésaü de la bénédiction accordée à Jacob. La valeur séparative de እም est donc retenue, tout en évitant d’ajouter un contenu absent de l’extrait.
translation_notes:
  register: Français moderne, clair et digne. La redondance sémitique « répondit et dit » est allégée sans perte de sens. Les points de suspension indiquent l’interruption matérielle de l’extrait, explicitée par la note.
