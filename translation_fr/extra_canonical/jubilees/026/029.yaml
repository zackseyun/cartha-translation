lexical_decisions:
- source_word: ቡሩከ፡ ይኩን፡
  choice: Béni soit-il
  rationale: Rend directement la formule de bénédiction au jussif, dans un français naturel et solennel.
- source_word: ወኵሉ፡ ዘርኡ፡
  choice: lui et toute sa descendance
  rationale: ዘር (« semence, postérité ») désigne ici collectivement les descendants ; « descendance » est idiomatique en français moderne.
- source_word: እስከ፡ ለዓለም።
  choice: pour toujours
  rationale: Expression française courante qui conserve la portée temporelle indéfinie de la formule.
- source_word: ወኮነ፡ ሶበ፡ ሰምዐ፡
  choice: Lorsqu’Ésaü entendit
  rationale: La tournure guèze littérale « et il arriva, lorsque » sert de transition narrative ; le français la rend naturellement par « lorsqu’… », sans perte événementielle significative.
- source_word: ነገረ፡ አቡሁ፡ ይስሐቅ፡
  choice: les paroles de son père Isaac
  rationale: Conserve le sens de « paroles » et l’apposition identifiant le père comme Isaac.
theological_decisions:
- issue: Portée de la bénédiction sur le personnage et sa postérité
  choice: lui et toute sa descendance
  alternative: toute sa descendance sera également bénie
  rationale: La coordination du texte source est conservée sans développer ni préciser la nature de la bénédiction.
translation_notes:
  register: Français international moderne, digne et lisible. La bénédiction garde une forme solennelle, tandis que la transition narrative est légèrement idiomatisée. La virgule finale est maintenue parce que le verset s’achève au milieu de la phrase.
