revisions:
- from: 'Ésaü, son frère, revint de la chasse. Lui aussi prépara un plat, l’apporta à son père et lui dit : « Que mon père se lève et mange du gibier que j’ai rapporté, afin que tu me bénisses de toute ton âme. »'
  to: 'Ésaü, son frère, revint de la chasse. Lui aussi prépara un plat, l’apporta à son père et dit à son père : « Que mon père se lève et mange de mon gibier, afin que ton âme me bénisse. »'
  rationale: La révision conserve le récit et le registre du projet, tout en rétablissant la syntaxe et l’ambiguïté anthropologique de la formule « ton âme me bénisse ». Elle supprime aussi l’explicitation non nécessaire « que j’ai rapporté ».
