  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: fr
  text: 'Ésaü, son frère, revint de la chasse. Lui aussi prépara un plat, l’apporta à son père et dit à son père : « Que mon père se lève et mange de mon gibier, afin que ton âme me bénisse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምነዓዊሁ
  choice: de la chasse
  rationale: Le terme désigne ici l’activité ou l’expédition de chasse dont Ésaü revient.
- source_word: መብልዐ
  choice: un plat
  rationale: Le mot désigne de la nourriture préparée; « un plat » est naturel dans ce contexte et évite la lourdeur de « nourriture ».
- source_word: እመሥገርትየ
  choice: du gibier que j’ai rapporté
  rationale: L’expression renvoie au produit de la chasse d’Ésaü; cette formulation française rend clairement le lien sans supposer que le père doit manger toute la prise.
- source_word: ነፍስከ
  choice: de toute ton âme
  rationale: Conserve l’expression sémitique et son intensité personnelle plutôt que de supprimer « âme ».
theological_decisions:
- issue: La bénédiction exprimée avec « ton âme »
  choice: afin que tu me bénisses de toute ton âme
  alternative: afin que ton âme me bénisse
  rationale: La formulation retenue reste fidèle à la présence de « âme » tout en étant intelligible en français moderne; elle n’attribue pas à l’âme une action indépendante de la personne.
translation_notes:
  register: Français moderne, narratif et digne. Le discours filial à la troisième personne (« Que mon père… ») est conservé, car il reflète la déférence de l’original.
