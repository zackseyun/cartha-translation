  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
translation:
  language: fr
  text: Rébecca prit les vêtements de choix de son fils aîné Ésaü, qui se trouvaient auprès d’elle dans la maison, et elle en revêtit Jacob, son fils cadet. Puis elle plaça les peaux des jeunes chevreaux sur ses mains et sur la partie nue de son cou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ... ዘይትፈተው
  choice: les vêtements désirables
  rationale: Rend le participe exprimant ce qui est apprécié ou désirable sans préciser indûment qu’il s’agit des « plus beaux » vêtements.
- source_word: ዘይሌህቅ
  choice: aîné
  rationale: Le terme oppose ici Ésaü, le fils plus âgé, à Jacob qualifié ensuite de plus jeune.
- source_word: መሓስአ፡ ጠሊ
  choice: les peaux des jeunes chevreaux
  rationale: Rend directement le groupe nominal guèze, dans le contexte du déguisement de Jacob.
- source_word: ዕርቃነ፡ ክሳዱ
  choice: la partie découverte de son cou
  rationale: Conserve l’idée de nudité ou d’absence de couverture appliquée à la zone du cou.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La coordination du second membre est rendue par « Puis » pour une narration naturelle, sans introduire le « depuis » issu de l’ancienne analyse fautive de ወእምእስቲ.
