  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
translation:
  language: fr
  text: 'Rébecca appela son fils Jacob et lui dit : « Écoute, j’ai entendu Isaac, ton père, parler à ton frère Ésaü. Il lui disait : “Va chasser du gibier pour moi, prépare-moi un plat et apporte-le-moi, afin que je mange et que je te bénisse devant le Seigneur avant de mourir.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ
  choice: Écoute
  rationale: Interjection attirant l’attention; « Écoute » est naturel dans ce contexte de discours rapporté.
- source_word: አሰግር፡ ሊተ
  choice: Va chasser du gibier pour moi
  rationale: Le verbe désigne ici l’action de chasser ou de prendre du gibier; il doit être distingué du verbe ultérieur signifiant « apporter ».
- source_word: መብልዐ
  choice: un plat
  rationale: Le nom désigne de la nourriture ou un mets préparé; « un plat » convient au contexte sans préciser une recette.
- source_word: ወአብእ፡ ሊተ
  choice: et apporte-le-moi
  rationale: Rend explicitement le second verbe, « apporter », sans le confondre avec l’action de chasser.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: devant le Seigneur
  rationale: Traduction formelle de l’expression indiquant que la bénédiction est prononcée en présence de Dieu.
theological_decisions:
- issue: La bénédiction prononcée « devant le Seigneur »
  choice: que je te bénisse devant le Seigneur
  alternative: que je te bénisse avec l’approbation du Seigneur
  rationale: La traduction conserve la formulation relationnelle et son éventuelle tension théologique, sans interpréter « devant » comme une approbation divine.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct imbriqué est conservé. « Écoute » est préféré à « Voici » pour une interpellation orale naturelle; « Seigneur » traduit le titre divin sans introduire une forme confessionnelle particulière.
