  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
translation:
  language: fr
  text: Nous lui avons donné un travail et lui avons appris à faire tout ce qui convenait à la culture[a]. Il cultivait le jardin. Il était nu, ne le savait pas et n’en avait pas honte. Il protégeait le jardin des oiseaux, des bêtes sauvages et du bétail, en récoltait les fruits et les mangeait, puis mettait de côté pour lui-même ce qui restait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous l’avons instruit en tout ce qui convenait à la culture ».'
    reason: La construction peut être comprise soit avec l’infinitif « à faire », soit comme une instruction portant sur l’ensemble de ce qui convient à la culture.
lexical_decisions:
- source_word: ምግባረ
  choice: un travail
  rationale: Le nom désigne ici une tâche ou une activité confiée à Adam; « un travail » est naturel en français et garde le lien avec la culture du jardin.
- source_word: ገቢሮተ፡ ኵሉ፡ ዘይስተርኢ፡ ለቅኔ
  choice: à faire tout ce qui convenait à la culture
  rationale: La formulation rend explicitement l’infinitif « faire » et comprend ቅኔ dans son contexte comme le travail ou le service lié à la culture, tout en signalant en note une autre analyse possible.
- source_word: ይትቀነይ
  choice: cultivait le jardin
  rationale: Le verbe exprime ici l’activité de travail ou de culture. L’objet « le jardin », implicite dans la continuité du passage, donne une phrase française claire sans modifier le sens.
- source_word: አራዊት
  choice: bêtes sauvages
  rationale: Ce terme désigne les animaux sauvages et se distingue ainsi de እንስሳ, rendu par « bétail ».
- source_word: ያነብር፡ ተረፎ፡ ሎቱ
  choice: mettait de côté pour lui-même ce qui restait
  rationale: Cette traduction conserve à la fois l’idée de réserver le reste et le bénéficiaire explicite « pour lui-même ».
theological_decisions:
- issue: La connaissance de la nudité avant la honte
  choice: « Il était nu, mais ne le savait pas et n’en avait pas honte »
  alternative: « Il était nu, sans en avoir conscience ni en éprouver de honte »
  rationale: La formulation retenue suit directement la succession des propositions du texte sans expliquer théologiquement la nature de cette absence de connaissance.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions sémitiques sont légèrement fluidifiées, sans effacer la progression du texte. « Jardin » est repris dans la deuxième phrase pour éviter en français un emploi absolu peu naturel de « cultiver ».
