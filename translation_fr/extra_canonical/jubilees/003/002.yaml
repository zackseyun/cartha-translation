lexical_decisions:
- source_word: ወሰመዮሙ፡ አዳም፡ ለኵሎሙ
  choice: Adam leur donna à tous un nom
  rationale: Rend naturellement en français l’acte par lequel Adam nomme chacun d’eux, tout en conservant l’universalité de « tous ».
- source_word: በበ፡ አስማቲሆሙ
  choice: à chacun le sien
  rationale: La construction distributive exprime que chacun reçoit son nom propre ; cette formulation évite le calque lourd « chacun selon son nom ».
- source_word: ወበከመ፡ …
  choice: et le nom qu’il leur donna resta le leur
  rationale: Le texte fourni est tronqué après cette expression, mais la suite attestée par la couche de consultation signifie que le nom attribué devint ou demeura leur nom. La formulation française en restitue le sens sans raideur.
