  yaml_path: translation/extra_canonical/jubilees/003/022.yaml
  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: fr
  text: Il mangea, ses yeux s’ouvrirent et il vit qu’il était nu. Il prit des feuilles de figuier, les cousit ensemble, s’en fit un vêtement et couvrit sa nudité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ
  choice: Il mangea
  rationale: Rend explicitement la proposition initiale, omise dans une ancienne révision anglaise mais bien présente dans le texte guèze.
- source_word: ወተርኅወ፡ አዕይንቲሁ
  choice: ses yeux s’ouvrirent
  rationale: Expression française naturelle qui conserve l’image et la valeur passive/intransitive du texte source.
- source_word: ቈጽለ፡ በለስ
  choice: des feuilles de figuier
  rationale: Équivalent précis et idiomatique de l’expression guèze.
- source_word: ምርአ
  choice: un vêtement
  rationale: Le terme désigne ici ce qui sert à se couvrir; « vêtement » reste naturel sans préciser davantage une forme que le texte n’explicite pas.
- source_word: ኀፍረቶ
  choice: sa nudité
  rationale: Dans ce contexte, le mot renvoie à la partie honteuse ou à la honte liée à la nudité; « nudité » exprime clairement le référent sans formulation archaïque.
theological_decisions:
- issue: Rapport entre nudité et honte
  choice: couvrit sa nudité
  alternative: couvrit sa honte
  rationale: Le contexte corporel favorise « nudité », tandis que l’idée de honte demeure implicite; cette formulation évite une abstraction peu naturelle en français.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition des coordinations du guèze est légèrement allégée pour obtenir une phrase française fluide, sans supprimer aucune action.
