  yaml_path: translation/extra_canonical/jubilees/003/009.yaml
  text: And after forty days had been completed for Adam in the land where he had been created, we brought him into the garden of Eden, that he might till it and keep it; but his wife was brought in after eighty days, and after this she entered into the garden of Eden.
translation:
  language: fr
  text: Après que les quarante jours prescrits pour Adam se furent écoulés sur la terre où il avait été créé, nous le fîmes entrer dans le jardin d’Éden pour qu’il le cultive et le garde. Quant à sa femme, elle y fut introduite au bout de quatre-vingts jours[a] ; après cela, elle entra dans le jardin d’Éden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils y firent entrer sa femme au bout de quatre-vingts jours ».'
    reason: Le verbe guèze est à la troisième personne du pluriel ; dans ce contexte, ce pluriel peut être compris comme impersonnel et rendu par un passif en français.
lexical_decisions:
- source_word: ተፈጸመ
  choice: eurent été accomplis
  rationale: Rend l’idée d’une période prescrite arrivée à son terme, tout en conservant la tournure passive du guèze.
- source_word: ምድር
  choice: pays
  rationale: Dans ce contexte, le terme désigne la terre ou région où Adam fut créé ; « pays » évite de confondre ce lieu avec la matière dont il fut formé.
- source_word: ይትቀነይ
  choice: cultive
  rationale: Le verbe peut évoquer le service ou le travail ; appliqué au jardin et associé à sa garde, « cultiver » est naturel et conforme au contexte.
- source_word: ይዕቀባ
  choice: garde
  rationale: Conserve directement la notion de veiller sur le jardin et de le protéger.
- source_word: ገነት፡ ኤዶም
  choice: jardin d’Éden
  rationale: Forme française courante et claire du nom traditionnel du lieu.
theological_decisions:
- issue: Agent de l’entrée de la femme dans le jardin
  choice: Sa femme, elle, y fut amenée
  alternative: ils y amenèrent sa femme
  rationale: Le pluriel guèze peut fonctionner comme un passif impersonnel. Le passif français préserve l’absence d’agent explicitement identifié sans introduire un groupe indéterminé.
- issue: Rapport entre les délais de quarante et quatre-vingts jours
  choice: au bout de quatre-vingts jours
  alternative: à quatre-vingts jours
  rationale: Le texte présente des durées distinctes avant l’admission d’Adam et de sa femme ; la formulation n’ajoute aucune explication doctrinale à cette différence.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la succession temporelle et la légère répétition du texte source entre le fait d’être amenée au jardin et celui d’y entrer.
