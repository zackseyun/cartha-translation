  yaml_path: translation/extra_canonical/jubilees/003/008.yaml
  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
translation:
  language: fr
  text: Durant la première semaine, Adam fut créé[a], et la côte qui devint sa femme fut formée ; durant la deuxième semaine, elle lui fut présentée. C’est pourquoi le commandement fut donné d’observer, dans l’impureté, sept jours pour un garçon et deux semaines pour une fille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le chapitre met en rapport l’entrée différée d’Adam et de la femme dans l’Éden avec les périodes ultérieures d’impureté après la naissance d’un garçon ou d’une fille.
    reason: Renvoi contextuel expliquant la logique du passage sans l’intégrer au corps du texte.
lexical_decisions:
- source_word: ገቦ ብእሲቱ
  choice: la côte qui devint sa femme
  rationale: Le texte désigne littéralement « la côte, sa femme ». Cette formulation française conserve le lien entre la côte et la femme tout en restant naturelle et sans laisser entendre que la côte elle-même est une personne.
- source_word: አርአዮ ኪያሃ ሎቱ
  choice: il la lui présenta
  rationale: Le verbe signifie faire voir ou montrer. « Présenta » rend naturellement la scène où la femme est amenée à Adam, sans préciser explicitement un sujet que la forme verbale laisse implicite.
- source_word: ትእዛዝ
  choice: le commandement
  rationale: Rend le sens d’une prescription normative et maintient le lien avec la législation évoquée dans le contexte.
- source_word: ለዐቂብ
  choice: d’observer
  rationale: Le verbe exprime l’idée de garder ou respecter une période prescrite ; « observer » est idiomatique en français pour une durée rituelle.
- source_word: ርኵስን
  choice: dans l’impureté
  rationale: Terme rituel correspondant à l’état d’impureté, sans y ajouter une qualification morale.
theological_decisions:
- issue: Lien entre le récit de création et les périodes d’impureté après une naissance
  choice: Conserver explicitement le rapport causal « C’est pourquoi » et les durées différenciées
  alternative: Présenter ces durées comme une simple comparaison narrative
  rationale: Le texte établit lui-même un fondement étiologique entre les semaines de création/présentation et la prescription rituelle ; la traduction ne doit ni supprimer ni renforcer ce lien.
- issue: Sujet de « il la lui présenta »
  choice: Maintenir le pronom implicite « il » sans l’identifier dans le texte
  alternative: Écrire « Dieu la présenta à Adam »
  rationale: Le contexte permet vraisemblablement d’identifier Dieu comme sujet, mais la forme française préserve la relative implicitation du texte source et évite une explicitation non indispensable.
- issue: Portée morale de l’impureté
  choice: Employer le terme rituel neutre « impureté »
  alternative: Employer « souillure » ou suggérer une faute morale
  rationale: Le passage concerne un statut rituel lié à l’accouchement, non une culpabilité morale.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif scripturaire. « Deux semaines de jours » conserve l’expression sémitique marquée du texte au lieu de la réduire silencieusement à « quatorze jours ».
