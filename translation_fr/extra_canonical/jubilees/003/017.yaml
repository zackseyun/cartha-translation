  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
translation:
  language: fr
  text: 'pour lui-même et pour sa femme, et il mettait en réserve ce qui devait être conservé. Au terme des sept années qu’il avait passées là — sept années exactement —, dans le deuxième mois, le dix-septième jour[a], le serpent vint et s’approcha de la femme. Il lui dit : « Dieu vous a-t-il ordonné : “Vous ne mangerez d’aucun arbre du jardin” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La date est donnée avec précision : le deuxième mois, le dix-septième jour, après sept années entières passées en Éden. Le livre des Jubilés intègre régulièrement de telles indications chronologiques à la structure de sa révélation.'
    reason: cultural_note
lexical_decisions:
- source_word: ወያነብር፡ ዘይትዐቀብ
  choice: et il mettait en réserve ce qui devait être conservé
  rationale: Rend le verbe de dépôt ou de mise en réserve et la forme passive indiquant ce qui est gardé, tout en conservant le caractère fragmentaire du début du verset.
- source_word: ሰብዓቱ፡ … ዓመት / ሰብዓተ፡ ዓመተ
  choice: sept années … sept années exactement
  rationale: Les mots guèzes écrits en toutes lettres signifient « sept »; les signes ፳፮ et ፳፯ appartiennent à l’apparat de l’édition et ne sont pas les nombres vingt-six et vingt-sept du texte.
- source_word: ጥንቁቀ
  choice: exactement
  rationale: Exprime la précision ou l’accomplissement intégral de la période.
- source_word: አርዌ፡ ምድር
  choice: le serpent
  rationale: Dans ce contexte édénique, l’expression désigne le serpent; « serpent de la terre » serait inutilement lourd en français.
- source_word: እምኵሉ፡ ዕፀ
  choice: d’aucun arbre
  rationale: 'Conserve la portée provocatrice de la question du serpent: l’interdiction est présentée comme s’étendant à tous les arbres.'
theological_decisions:
- issue: Portée de la négation dans la question du serpent
  choice: « Vous ne mangerez d’aucun arbre du jardin »
  alternative: « Vous ne mangerez pas de tout arbre du jardin »
  rationale: La formulation choisie est naturelle en français et garde le sens rhétorique selon lequel Dieu aurait interdit tous les arbres, sans corriger la déformation mise dans la bouche du serpent.
- issue: Identification du locuteur divin
  choice: « Dieu vous a-t-il commandé »
  alternative: « Vous a-t-il commandé »
  rationale: L’identification explicite est requise par le contexte transmis et évite en français une référence pronominale obscure, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le début demeure syntaxiquement lié au verset précédent, comme dans la source. La répétition chronologique est conservée, car elle est intentionnelle. Le marqueur de note est placé après la date à laquelle la note se rapporte.
