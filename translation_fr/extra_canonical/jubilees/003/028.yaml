  source_fidelity: Le texte français rend correctement l’expulsion de « toute chair » hors du jardin et la dispersion selon les catégories propres à chaque créature. Toutefois, le verbe source est au passif (« fut expulsée/chassée ») et ne porte pas explicitement le sujet divin à cet endroit; « Il renvoya » introduit un agent et affaiblit légèrement l’idée d’expulsion. La formule « selon leur création » est plus proche de ፍጥረቶሙ que « selon sa forme », sans trancher indûment sa nuance exacte.
  naturalness: La formulation est claire et naturelle. « Toute créature vivante » est plus idiomatique en français moderne que « tout être de chair », tout en conservant la portée collective de l’expression sémitisante « toute chair ».
  terminology: « Jardin d’Éden », « espèce » et « créatures vivantes » conviennent au registre. « Selon leur création » maintient la distinction textuelle d’avec « selon leur espèce » et correspond mieux au substantif dérivé de « créer/former ».
