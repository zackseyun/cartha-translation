  text: And he sent out from the garden of Eden all flesh that was in the garden of Eden, and all flesh was scattered, each according to its kind and according to its form, to the places that had been created for them.
translation:
  language: fr
  text: Toute créature vivante qui se trouvait dans le jardin d’Éden en fut expulsée, et toutes les créatures vivantes furent dispersées, chacune selon son espèce et selon sa création, vers les lieux qui avaient été créés pour elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ዘሥጋ
  choice: tout être de chair / tous les êtres de chair
  rationale: L’expression guèze signifie littéralement « toute chair ». En français courant, « tout être de chair » conserve l’idée de l’ensemble des créatures vivantes sans laisser entendre qu’il s’agit seulement de chair matérielle.
- source_word: በበ፡ ዘመዶሙ
  choice: chacun selon son espèce
  rationale: Le terme désigne ici la catégorie ou l’espèce à laquelle appartient chaque créature; cette formulation est naturelle dans un contexte de création.
- source_word: በበ፡ ፍጥረቶሙ
  choice: selon sa forme
  rationale: Le nom dérivé de la racine « créer, former » peut évoquer la constitution ou la forme créée. « Forme » suit l’attestation source et préserve sa distinction avec « espèce ».
- source_word: ውስተ፡ መካን፡ ዘተፈጥረ፡ ሎሙ
  choice: vers les lieux qui avaient été créés pour eux
  rationale: Le pluriel français « les lieux » rend naturellement la destination propre assignée aux différentes créatures; le plus-que-parfait situe leur création avant leur dispersion.
theological_decisions:
- issue: Sujet implicite de « renvoya »
  choice: Conserver le pronom « Il » sans ajouter « Dieu »
  alternative: Expliciter « Dieu les renvoya »
  rationale: Le verbe guèze porte un sujet masculin singulier implicite dont l’antécédent ressort du contexte. Ne pas le nommer évite une explicitation absente du texte immédiat.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « tout être de chair / tous les êtres de chair » reflète la reprise insistante du texte source, tandis que « qui s’y trouvait » évite une répétition française pesante de « jardin d’Éden ».
