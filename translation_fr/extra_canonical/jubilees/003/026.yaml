  yaml_path: translation/extra_canonical/jubilees/003/026.yaml
  text: And on that day on which Adam went out from the garden[a], he burned incense as a sweet fragrance—frankincense, galbanum, stacte, and spices—in the morning with the rising of the sun, from the day when he covered his shame.
translation:
  language: fr
  text: 'Ce jour-là, lorsqu’Adam sortit du jardin, il brûla de l’encens comme parfum agréable : de l’oliban, du galbanum, du stacté et des aromates[a], le matin, au lever du soleil, dès le jour où il avait couvert sa nudité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification précise de certains aromates de cette liste est incertaine ; le sens général est celui d’un encens au parfum agréable, offert au lever du soleil après qu’Adam eut couvert sa nudité.
    reason: textual_variant
lexical_decisions:
- source_word: ዐጠነ
  choice: il fit brûler […] de l’encens
  rationale: Le verbe exprime l’action d’offrir ou de faire fumer de l’encens ; cette formulation est naturelle en français et conserve la dimension cultuelle sans la surinterpréter.
- source_word: ለመዐዛ፡ ሠናይ
  choice: en parfum agréable
  rationale: Rend littéralement l’idée d’une odeur bonne ou agréable, dans un registre biblique clair et digne.
- source_word: ስኂነ
  choice: oliban
  rationale: Nom français précis de l’encens résineux traditionnellement identifié ici comme le frankincense.
- source_word: ቀንአተ
  choice: galbanum
  rationale: Conserve l’identification traditionnelle de cette résine aromatique, tout en signalant en note la difficulté textuelle de la liste.
- source_word: ማየ፡ ልብን
  choice: stacté
  rationale: Suit l’identification traditionnelle d’un aromate liquide ou résineux employé dans l’encens, sans prétendre que le détail lexical est entièrement assuré.
- source_word: ኀፍረቶ
  choice: sa nudité
  rationale: Dans ce contexte, le terme désigne les parties honteuses ou la nudité qu’Adam vient de couvrir ; « nudité » est idiomatique et non euphémisant.
theological_decisions:
- issue: Nature de l’acte accompli par Adam
  choice: « il fit brûler […] de l’encens »
  alternative: « il offrit de l’encens »
  rationale: Le texte décrit l’action de faire fumer l’encens, mais ne précise pas explicitement tout le cadre rituel d’un sacrifice ; la traduction évite donc d’ajouter une théologie sacrificielle non formulée.
- issue: Point de départ temporel de l’offrande
  choice: « dès le jour où il avait couvert sa nudité »
  alternative: « à partir du jour où il couvrit sa honte »
  rationale: « Dès le jour où » rend la valeur initiale de እምዕለተ tout en gardant la relation temporelle légèrement inhabituelle du texte, sans la supprimer.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire cultuel reste accessible ; les noms techniques des aromates sont conservés parce qu’ils appartiennent à l’énumération du texte source, avec une note signalant leur incertitude.
