  text: And he awakened Adam from his sleep, and when Adam awoke, he rose on the sixth day and brought her to him.
translation:
  language: fr
  text: Puis Dieu réveilla Adam de son sommeil. Quand Adam se réveilla, il se leva, le sixième jour, et Dieu la lui amena.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነቅሆ (ʾanaqqəho)
  choice: réveilla
  rationale: Le verbe causatif exprime le fait de tirer Adam de son sommeil; « réveilla » est précis et naturel.
- source_word: እምነዋሙ (ʾəm-näwāmu)
  choice: de son sommeil
  rationale: Rend directement la provenance exprimée par la préposition et le nom « sommeil ».
- source_word: ተንሥአ (tanśəʾa)
  choice: se leva
  rationale: Conserve le sens concret de se mettre debout après le réveil.
- source_word: በዕለት ሣድስት (ba-ʿəlat śādəs(t))
  choice: le sixième jour
  rationale: Formulation française idiomatique correspondant à l’indication temporelle du texte.
- source_word: አብጽሓ ኀቤሁ (ʾabṣəḥā ḫabehu)
  choice: la lui amena
  rationale: Le suffixe féminin désigne la femme et « vers lui » désigne Adam; « amena » rend naturellement le mouvement causé vers une personne.
theological_decisions:
- issue: Identité du sujet qui réveille Adam et lui amène la femme
  choice: Répéter « Dieu » dans les deux propositions concernées
  alternative: Employer seulement « il », comme dans le texte guèze lorsque l’antécédent est fourni par le contexte précédent
  rationale: Le contexte immédiat identifie le Seigneur Dieu comme agent. En français, après la mention d’Adam, un simple « il la lui amena » ferait probablement d’Adam le sujet grammatical et obscurcirait le sens.
translation_notes:
  register: Français international moderne, narratif et digne. Les sujets sont explicités pour éviter une ambiguïté référentielle artificielle en français, sans ajouter d’interprétation doctrinale.
