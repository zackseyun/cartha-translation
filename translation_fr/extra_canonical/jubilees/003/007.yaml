  rationale: Rend directement les deux termes sexués du guèze dans un français naturel et digne.
- source_word: ዘየኀድግ
  choice: quittera
  rationale: Le verbe exprime l’idée de laisser ou d’abandonner; « quittera » convient au contexte familial sans surinterprétation.
- source_word: ይጻመር፡ ምስለ
  choice: s’attachera à
  rationale: Exprime l’union étroite indiquée par le verbe et sa construction, tout en reprenant la formulation française consacrée et intelligible.
- source_word: ሥጋ፡ አሐደ
  choice: une seule chair
  rationale: Conserve l’image corporelle et relationnelle du texte, ainsi que sa portée théologique ouverte.
theological_decisions:
- issue: Nature de l’unité de l’homme et de la femme
  choice: seront un
  alternative: formeront une seule réalité
  rationale: La formulation brève préserve l’affirmation du texte sans préciser indûment la nature de cette unité.
- issue: Portée de « une seule chair »
  choice: traduction littérale sans explication dans le corps du texte
  alternative: une seule union
  rationale: L’expression peut porter plusieurs dimensions — corporelle, conjugale et familiale — qu’une paraphrase réduirait.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « C’est pourquoi » est conservée parce qu’elle structure explicitement les deux affirmations du guèze.
