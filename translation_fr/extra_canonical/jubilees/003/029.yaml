lexical_decisions:
- source_word: ባሕቲቱ
  choice: seul
  rationale: Rend directement l’idée d’exclusivité appliquée à Adam.
- source_word: ይክድን
  choice: de quoi couvrir
  rationale: Exprime naturellement en français la faculté ou le moyen accordé à Adam pour se couvrir, sans préciser davantage ce moyen.
- source_word: ኀፍረቶ
  choice: sa nudité
  rationale: Le terme désigne littéralement sa honte, mais, dans ce contexte où Adam couvre son corps, « sa nudité » restitue clairement la réalité visée en français courant.
- source_word: አራዊት ወእንስሳ
  choice: les bêtes sauvages et les animaux domestiques
  rationale: Conserve la distinction entre les animaux sauvages et le bétail ou les animaux domestiques.
theological_decisions:
- issue: Référent du sujet implicite de « il donna »
  choice: Conserver le pronom « il », dont le référent divin ressort du contexte
  alternative: Répéter explicitement « Dieu »
  rationale: Le texte source emploie une forme verbale à sujet implicite; ne pas ajouter le nom divin préserve sa formulation tout en restant intelligible dans le contexte.
- issue: Portée de « parmi toutes les bêtes sauvages et les animaux domestiques »
  choice: Rattacher le groupe à « Adam seul » pour marquer son caractère unique parmi les créatures
  alternative: Le rattacher à l’acte de lui donner le moyen de se couvrir
  rationale: L’ordre français retenu évite un complément flottant, tout en signalant en note l’ambiguïté syntaxique réelle du guèze.
