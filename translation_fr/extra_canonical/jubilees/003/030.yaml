  text: Therefore it was commanded on the heavenly tablets concerning all those who know the judgment of the law, that they should cover their shame and should not uncover themselves as the nations uncover themselves.
translation:
  language: fr
  text: C’est pourquoi il fut ordonné sur les tablettes célestes, au sujet de tous ceux qui connaissent le jugement de la Loi, qu’ils couvrent leur honte et ne se découvrent pas comme les nations se découvrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተ፡ ዝንቱ
  choice: C’est pourquoi
  rationale: Cette locution introduit ici la conséquence normative du récit précédent.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Rend littéralement l’expression guèze et conserve la terminologie caractéristique du livre des Jubilés.
- source_word: ፍትሐ፡ ሕግ
  choice: le droit de la Loi
  rationale: Préserve les deux composantes de l’expression, le jugement ou droit et la loi, sans les réduire à un simple commandement.
- source_word: ኀፍረቶሙ
  choice: leur nudité
  rationale: Dans ce contexte vestimentaire, le terme désigne les parties honteuses ou la nudité; «leur nudité» est naturel et digne en français.
- source_word: አሕዛብ
  choice: les nations
  rationale: Équivalent biblique courant qui laisse ouverte la portée ethnique et religieuse du terme.
theological_decisions:
- issue: Portée de «ceux qui connaissent le droit de la Loi»
  choice: Conserver la formulation descriptive sans identifier explicitement ce groupe à Israël ou à une catégorie confessionnelle.
  alternative: Traduire «tous ceux qui connaissent le jugement prescrit par la Loi».
  rationale: Le texte lie connaissance, droit/jugement et Loi, mais ne précise pas davantage l’identité du groupe; la traduction maintient cette ouverture.
- issue: Nature de l’ordre inscrit sur les tablettes célestes
  choice: Employer l’impersonnel «il fut ordonné».
  alternative: Employer «Dieu ordonna».
  rationale: Le sujet divin n’est pas exprimé dans cette phrase; l’impersonnel préserve la forme du texte sans ajouter un agent explicite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition «se découvrent» est conservée afin de reproduire le contraste explicite du texte source; «nudité» évite à la fois l’euphémisme obscur et une formulation inutilement crue.
