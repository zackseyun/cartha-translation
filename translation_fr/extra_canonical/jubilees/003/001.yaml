base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
translation:
  language: fr
  text: 'Durant les six jours de la deuxième semaine, nous avons amené à Adam, par la parole du Seigneur, toutes les bêtes sauvages, tous les animaux domestiques, tous les oiseaux, tout ce qui se déplace sur la terre et tout ce qui se déplace dans les eaux, selon leurs espèces et selon leurs formes : les bêtes sauvages le premier jour, les animaux domestiques le deuxième jour, les oiseaux le troisième jour, tout ce qui se déplace sur la terre le quatrième jour, et ce qui se déplace dans les eaux le cinquième jour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰዱስ፡ መዋዕል
  choice: Durant les six jours
  rationale: Le syntagme guèze indique une période de six jours, et non « le deuxième jour »; cette lecture correspond aussi à l’énumération de plusieurs jours dans la suite du verset.
- source_word: በቃለ፡ እግዚአብሔር
  choice: sur l’ordre du Seigneur
  rationale: Littéralement « par la parole du Seigneur »; dans ce contexte, la parole est le commandement qui fait amener les animaux à Adam. La formulation française retenue exprime naturellement cette valeur instrumentale.
- source_word: አራዊተ
  choice: bêtes sauvages
  rationale: Ce terme est distingué ici de እንስሳ et désigne les animaux non domestiques.
- source_word: እንስሳ
  choice: animaux domestiques
  rationale: Dans l’opposition avec les bêtes sauvages, ce terme renvoie au bétail ou, plus largement, aux animaux domestiques; la formulation choisie est claire et inclusive en français moderne.
- source_word: በበ፡ ዘመዶሙ ወበበ፡ አምሳሎሙ
  choice: selon leurs espèces et selon leurs formes
  rationale: Rend les deux expressions distributives sans les confondre et conserve la distinction entre catégorie d’appartenance et apparence.
theological_decisions:
- issue: Portée temporelle de l’ouverture du verset
  choice: « Durant les six jours de la deuxième semaine »
  alternative: « Le deuxième jour de la deuxième semaine »
  rationale: Le texte guèze porte « durant les six jours »; l’autre lecture ne convient ni à la syntaxe de la source ni à l’action répartie sur plusieurs jours.
- issue: Agent derrière « nous avons amené »
  choice: Conserver la première personne du pluriel sans identifier explicitement les locuteurs
  alternative: Ajouter « nous, les anges »
  rationale: Le verset emploie simplement « nous »; identifier les locuteurs dans le corps du texte ajouterait une précision interprétative absente de cette phrase.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition structurante de « tout ce qui se déplace » et la répartition jour par jour sont conservées. Aucun marqueur de note n’est requis.
