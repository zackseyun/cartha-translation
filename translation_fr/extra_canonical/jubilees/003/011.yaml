  text: until she completes these days for a male. But for a female, two weeks, like the first two weeks, in her uncleanness, and sixty-six days she shall remain in the blood of her purification.
translation:
  language: fr
  text: jusqu’à ce qu’elle ait achevé ces jours pour un garçon. Mais pour une fille, deux semaines, comme les deux premières semaines, dans son impureté, et elle restera soixante-six jours dans le sang de sa purification.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቡዓተ
  choice: semaines
  rationale: Le terme désigne des périodes de sept jours; « semaines » est l’expression française naturelle dans le contexte des prescriptions de purification.
- source_word: በርኵሳ
  choice: dans son impureté
  rationale: Le nom porte un suffixe possessif féminin singulier, rendu par « son »; « impureté » conserve le vocabulaire rituel du passage.
- source_word: ደመ፡ ንጽሓ
  choice: le sang de sa purification
  rationale: Cette formulation maintient l’expression concrète et cultuelle de la source ainsi que le suffixe possessif féminin sur « purification ».
- source_word: ትንበር
  choice: elle restera
  rationale: Le verbe exprime le fait de demeurer ou rester dans cet état pendant la durée indiquée.
theological_decisions:
- issue: Nature rituelle de l’impureté et de la purification
  choice: Conserver « impureté » et « purification » sans explication doctrinale
  alternative: Employer des termes médicaux ou paraphraser comme une période de rétablissement
  rationale: La source reprend le langage cultuel de la loi de purification; une médicalisation en modifierait la portée.
translation_notes:
  register: 'Français moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour éviter une phrase elliptique peu naturelle, tout en conservant les durées, les comparaisons et les possessifs féminins de la source. La limite du verset est respectée: le total de quatre-vingts jours appartient au verset suivant.'
