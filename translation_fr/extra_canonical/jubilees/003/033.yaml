lexical_decisions:
- source_word: አሐዱ
  choice: un
  rationale: Le terme signifie littéralement « un ». Le fragment ne fournit pas assez de contexte pour préciser s’il exprime l’unité ou le fait d’être seul ; la traduction conserve donc cette ambiguïté, malgré la syntaxe fragmentaire.
- source_word: ምድረ፡ ፍጥረቶሙ
  choice: le pays de leur création
  rationale: Rend directement « le pays/la terre de leur création » sans transformer l’expression en une localisation plus explicite.
- source_word: ወሰመያ፡ አዳም፡ ስመ፡ ብእሲቱ፡ ሔዋ
  choice: Adam donna à sa femme le nom d’Ève
  rationale: Formulation française naturelle correspondant à l’expression sémitique « Adam appela le nom de sa femme Ève ».
- source_word: ወአኮኑ
  choice: et ils n’avaient pas…
  rationale: Le dernier mot amorce une proposition négative dont le complément manque dans l’extrait fourni ; les points de suspension signalent cette coupure.
theological_decisions:
- issue: Sens de አሐዱ dans un fragment initial incomplet
  choice: Conserver littéralement « un »
  alternative: « seuls » ou « ils ne faisaient qu’un »
  rationale: Le contexte transmis ici ne permet pas de trancher entre solitude et unité sans ajouter une interprétation.
translation_notes:
  register: Français moderne, sobre et digne. La tournure inhabituelle « … un dans le pays… » est maintenue afin de ne pas résoudre artificiellement l’ambiguïté d’un extrait guèze incomplet.
