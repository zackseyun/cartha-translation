  yaml_path: translation/extra_canonical/jubilees/003/023.yaml
  text: And the Lord cursed the serpent and was angry with it forever. And he was also angry with the woman, because she listened to the voice of the serpent and ate; and he said to her, “I will greatly multiply your sorrow and your pain; in sorrow you shall bear children, and your desire shall be for your husband, and he will rule over you.”
translation:
  language: fr
  text: 'Le Seigneur maudit le serpent et resta irrité contre lui pour toujours. Il fut aussi irrité contre la femme, parce qu’elle avait écouté la voix du serpent et mangé. Il lui dit : « Je multiplierai grandement ta peine et ta douleur ; c’est dans la peine que tu mettras des enfants au monde. Ton désir se portera vers ton mari[a], et lui dominera sur toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme rendu par « désir » peut aussi évoquer un retour ou une orientation vers le mari.
    reason: Signaler une ambiguïté lexicale du guèze sans trancher entre des interprétations discutées.
lexical_decisions:
- source_word: ተምዕዖ
  choice: resta irrité contre
  rationale: Le verbe exprime la colère ou l’irritation envers quelqu’un. « Resta irrité » rend naturellement en français la portée durable précisée par « pour toujours ».
- source_word: ኀዘንኪ ወለፃዕርኪ
  choice: ta peine et tes douleurs
  rationale: Le premier terme désigne la peine ou l’affliction, le second la souffrance ou le labeur pénible. La traduction conserve les deux notions sans les fondre.
- source_word: ለዲ ውሉደ
  choice: tu mettras des enfants au monde
  rationale: L’expression renvoie à l’enfantement. Cette formulation moderne et digne restitue le sens sans lourdeur littérale.
- source_word: ኀበ ምትኪ ምግባእኪ ውእቱ
  choice: Ton désir se portera vers ton mari
  rationale: La tournure éthiopienne indique une orientation ou un mouvement vers le mari. « Désir » suit le sens probable dans ce contexte tout en évitant une formulation française obscure telle que « ton retour ».
- source_word: ይኴነኪ
  choice: dominera sur toi
  rationale: Le verbe exprime ici l’exercice d’une autorité ou domination sur la femme ; « dominera sur toi » garde la force et la tension du texte.
theological_decisions:
- issue: Nature de la parole adressée à la femme
  choice: Présenter la domination du mari comme faisant partie de la déclaration divine après la transgression
  alternative: La reformuler comme un commandement normatif ou comme une approbation divine
  rationale: Le texte rapporte ce qui arrivera sans demander au traducteur d’en faire un idéal moral ou une prescription universelle.
- issue: Sens de l’orientation de la femme vers son mari
  choice: « Ton désir se portera vers ton mari »
  alternative: « Tu retourneras vers ton mari »
  rationale: Le contexte parallèle à Genèse 3:16 et le sens probable de la formule favorisent « désir », mais la traduction conserve l’idée directionnelle grâce à « se portera vers ».
translation_notes:
  register: Français international moderne, lisible et digne. Le rythme narratif est conservé, avec une ponctuation qui clarifie la succession de la faute, de la colère et de la déclaration. Aucun terme confessionnel propre à une tradition n’est ajouté.
