  yaml_path: translation/extra_canonical/jubilees/003/024.yaml
  text: And to Adam also he said, “Because you listened to the voice of your wife and ate from that tree from which I commanded you not to eat, cursed shall the ground be on your account. It shall produce thorns and thistles for you, and you shall eat your bread by the sweat of your face until you return to the ground from which you were taken; for you are earth, and to the earth you shall return.”
translation:
  language: fr
  text: 'Il dit aussi à Adam : « Parce que tu as écouté la voix de ta femme et que tu as mangé de cet arbre dont je t’avais ordonné de ne pas manger, le sol sera maudit à cause de toi. Il fera pousser pour toi des épines et des chardons, et tu mangeras ta verdure à la sueur de ton visage, jusqu’à ce que tu retournes au sol d’où tu as été tiré ; car tu es terre, et à la terre tu retourneras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲትከ
  choice: ta femme
  rationale: Le terme désigne ici l’épouse d’Adam ; « femme » est naturel en français et conserve le lien lexical avec le récit.
- source_word: ምድር
  choice: le sol / la terre
  rationale: Le même mot guèze désigne la terre ou le sol. « Sol » convient lorsqu’il est question de sa malédiction et de l’origine corporelle d’Adam, tandis que « terre » rend avec naturel la formule finale sans introduire le mot « poussière », absent du texte.
- source_word: እከዋከ፡ ወአሜካሳ
  choice: des épines et des chardons
  rationale: Cette paire végétale traditionnelle rend les deux plantes nuisibles distinctes indiquées par le texte.
- source_word: ሣዕስቲከ
  choice: ton pain
  rationale: Dans ce contexte de subsistance obtenue par le travail pénible, la tradition textuelle et la couche de consultation soutiennent « pain », expression idiomatique et immédiatement intelligible.
- source_word: በሐፈ፡ ገጽከ
  choice: à la sueur de ton visage
  rationale: Rend formellement l’image corporelle du texte, plutôt que de l’aplanir en « à la sueur de ton front ».
theological_decisions:
- issue: Motif de la malédiction du sol
  choice: « le sol sera maudit à cause de toi »
  alternative: « le sol sera maudit par ta faute »
  rationale: « À cause de toi » conserve la relation causale sans accentuer l’interprétation morale au-delà du texte.
- issue: Nature terrestre d’Adam
  choice: « car tu es terre »
  alternative: « car tu es poussière »
  rationale: Le guèze emploie ici le terme ordinaire pour la terre, non un terme spécifique pour la poussière ; la formulation retenue préserve cette donnée et l’écho avec le retour à la terre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle du jugement est conservée, avec des enchaînements naturels et sans vocabulaire confessionnel ajouté.
