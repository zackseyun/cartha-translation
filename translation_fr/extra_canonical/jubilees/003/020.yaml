  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
translation:
  language: fr
  text: La femme vit que l’arbre était agréable[a] et plaisant à regarder, et que son fruit était bon à manger. Elle en prit et mangea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot geʿez ʾaddām est ici un adjectif signifiant « agréable » ou « plaisant » ; il ne s’agit pas du nom propre Adam.
    reason: lexical_choice
lexical_decisions:
- source_word: አዳም
  choice: agréable
  rationale: Rend ici l’adjectif geʿez ʾaddām, qui exprime ce qui est plaisant ou délectable, et non le nom propre Adam.
- source_word: ያሠምር፡ ለዐይን
  choice: plaisant à regarder
  rationale: Formulation française naturelle qui conserve l’idée d’un arbre agréable à l’œil.
- source_word: ለበሊዕ
  choice: à manger
  rationale: Rend simplement et naturellement l’expression indiquant que le fruit était bon comme nourriture.
- source_word: ወነሥአት፡ እምኔሁ፡ ወበልዐት
  choice: Elle en prit et mangea
  rationale: Conserve la succession brève des actions dans un français idiomatique.
