  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: fr
  text: 'C’est pourquoi la règle de ces jours-là fut établie pour celle qui met au monde un garçon ou une fille : elle ne touchera rien de saint et n’entrera pas dans le sanctuaire jusqu’à ce que…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ
  choice: C’est pourquoi
  rationale: Rend le lien causal ou inférentiel avec le contexte précédent.
- source_word: ተሠርዐ
  choice: fut établie
  rationale: Exprime l’instauration normative indiquée par le verbe guèze.
- source_word: ፍትሖን
  choice: la règle
  rationale: Terme courant et digne qui conserve ici le sens d’ordonnance ou de prescription.
- source_word: ለተባዕት፡ ወለአንስት
  choice: un garçon ou une fille
  rationale: Rend naturellement en français la distinction entre enfant mâle et enfant femelle dans le contexte de l’accouchement.
- source_word: ኵሎ፡ ቅዱሰ
  choice: rien de saint
  rationale: La négation avec l’expression englobante se rend idiomatiquement ainsi en français.
- source_word: መቅደስ
  choice: le sanctuaire
  rationale: Conserve le vocabulaire cultuel sans préciser indûment temple ou lieu particulier.
- source_word: እስከ፡ አመ
  choice: jusqu’au jour où…
  rationale: Préserve la proposition inachevée qui se poursuit au verset suivant.
theological_decisions:
- issue: Nature de la prescription après l’accouchement
  choice: 'Formulation juridique neutre : « la règle »'
  alternative: « la loi » ou « l’ordonnance »
  rationale: Évite de charger le texte d’une catégorie confessionnelle tout en conservant son caractère normatif.
- issue: Sainteté et accès cultuel
  choice: « ne touchera rien de saint et n’entrera pas dans le sanctuaire »
  alternative: Expliciter une notion d’impureté rituelle
  rationale: Le verset formule des interdictions sans nommer ici explicitement l’impureté ; la traduction ne l’ajoute donc pas.
translation_notes:
  register: Français international moderne, clair et digne. Le futur normatif convient à une prescription. Les points de suspension signalent que la phrase demeure syntaxiquement inachevée à la fin du verset et continue dans le suivant.
