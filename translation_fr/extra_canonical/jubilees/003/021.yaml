  text: for food; and she took from it and ate. And she covered her shame with fig leaves first, and she gave to Adam, and he ate.
translation:
  language: fr
  text: comme nourriture ; elle en prit et mangea. Elle couvrit d’abord sa nudité avec des feuilles de figuier, puis elle en donna à Adam, et il mangea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበሊዕ
  choice: pour nourriture
  rationale: Rend l’expression finale du membre de phrase précédent comme une indication de destination ou d’usage alimentaire.
- source_word: እምኔሁ
  choice: en
  rationale: Le pronom français « en » reprend naturellement l’arbre ou son fruit après le verbe « prit ».
- source_word: ኀፍረታ
  choice: sa nudité
  rationale: Le terme peut désigner la honte ou les parties honteuses ; dans ce contexte de couverture par des feuilles, « sa nudité » exprime clairement le sens concret sans lourdeur.
- source_word: በቈጽለ፡ በለስ
  choice: avec des feuilles de figuier
  rationale: Traduction directe et idiomatique de « feuilles de figuier ».
- source_word: ዘቀዳሚ
  choice: d’abord
  rationale: Conserve la valeur temporelle de « premièrement/d’abord » et indique qu’elle se couvrit avant de donner du fruit à Adam.
theological_decisions:
- issue: Nature de ce qu’Ève couvre
  choice: sa nudité
  alternative: sa honte
  rationale: « Nudité » correspond mieux au geste concret consistant à se couvrir de feuilles, tout en laissant subsister l’association entre nudité et honte présente dans le terme source.
translation_notes:
  register: Français moderne, courant et digne. La coordination simple conserve le rythme narratif, tandis que « d’abord » et « puis » rendent explicite l’ordre des actions indiqué par le texte guèze.
