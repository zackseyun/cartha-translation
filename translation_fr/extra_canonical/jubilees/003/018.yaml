  text: …of the garden God commanded you, saying, ‘Do not eat from it.’ And she said to him, “From all the fruit of the trees of the garden God said to us, ‘Eat’; but from the fruit of the tree that is in the middle of the garden,”
translation:
  language: fr
  text: '« …du jardin, Dieu vous a donné cet ordre : “N’en mangez pas.” » Et elle lui dit : « Dieu nous a dit : “Mangez de tous les fruits des arbres du jardin.” Mais quant au fruit de l’arbre qui est au milieu du jardin… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዘዘክሙ
  choice: vous a commandé
  rationale: Rend directement le verbe « commander » et le pronom pluriel de deuxième personne.
- source_word: ኢትብልዑ፡ እምኔሁ
  choice: N’en mangez pas
  rationale: Expression française naturelle qui conserve l’interdiction et la référence pronominale à l’arbre ou à son fruit.
- source_word: ወትቤሎ
  choice: Et elle lui répondit
  rationale: Le verbe signifie littéralement « elle lui dit » ; « répondit » explicite naturellement la fonction dialogique sans modifier le contenu.
- source_word: ብልዑ
  choice: Mangez
  rationale: Conserve la forme impérative du texte transmis.
- source_word: ዘማእከለ፡ ገነት
  choice: qui est au milieu du jardin
  rationale: Traduction directe de la proposition localisant l’arbre au centre ou au milieu du jardin.
theological_decisions:
- issue: Forme positive de l’ordre de manger
  choice: « Mangez de tous les fruits… »
  alternative: « Vous pouvez manger de tous les fruits… »
  rationale: La source transmise emploie un impératif ; la traduction le préserve au lieu de l’atténuer en simple permission.
- issue: Fragment aux limites du verset
  choice: Conserver l’ouverture et la fin fragmentaires
  alternative: Compléter les phrases d’après le contexte de la Genèse ou déplacer les segments vers les versets voisins
  rationale: L’extrait guèze fourni commence au milieu d’une parole et s’arrête avant l’achèvement de la réponse. Il ne faut ni omettre le texte attesté ni importer un complément absent.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets imbriqués clarifient le dialogue. Les points de suspension indiquent les coupures réelles de l’extrait, non une hésitation ajoutée.
