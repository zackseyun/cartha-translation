  text: And he recognized her and said to her, “This now is bone from my bones and flesh from my flesh. This one shall be called my woman, because she was taken from her man.”
translation:
  language: fr
  text: 'Il la reconnut[a] et lui dit : « Cette fois, voici l’os de mes os et la chair de ma chair. Celle-ci sera appelée ma femme, car elle a été tirée de son homme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il la connut ».'
    reason: Le verbe peut se traduire littéralement par « connaître », mais cette expression pourrait ici être comprise à tort comme une allusion à des relations sexuelles.
lexical_decisions:
- source_word: አእመራ (ʾaʾmerā)
  choice: Il la reconnut
  rationale: Le verbe signifie ici qu’Adam reconnaît qui elle est et son lien avec lui. « Il la connut » risquerait, en français biblique, d’évoquer à tort une relation sexuelle, que le récit situe plus tard.
- source_word: ዝንቱ፡ ይእዜ (zəntu yəʾəze)
  choice: Cette fois, voici
  rationale: Cette formulation naturelle conserve l’idée emphatique et temporelle de « maintenant/cette fois » tout en introduisant la déclaration d’Adam.
- source_word: ዐጽም፡ እምዐጽምየ፡ ወሥጋ፡ እምሥጋየ
  choice: l’os de mes os et la chair de ma chair
  rationale: Traduction formelle de l’expression de parenté et d’identité corporelle, avec maintien du singulier « os » attesté par le guèze.
- source_word: ብእሲትየ (bəʾəsitye)
  choice: ma femme
  rationale: Le terme féminin est ici assorti d’un suffixe de première personne. « Ma femme » rend à la fois le genre et le lien exprimé, sans tenter de reproduire un jeu morphologique impossible en français.
- source_word: እምብእሲሃ (ʾəmbəʾəsiha)
  choice: de son homme
  rationale: Le texte guèze exprime littéralement la provenance depuis « son homme ». Cette tournure conserve le parallélisme lexical femme/homme et la tension du texte, même si elle est moins idiomatique que « de l’homme ».
theological_decisions:
- issue: Sens du verbe de connaissance appliqué à la femme
  choice: reconnut
  alternative: connut
  rationale: Le contexte immédiat est la présentation de la femme nouvellement formée à Adam. « Reconnut » évite de suggérer une union sexuelle anticipée sans supprimer l’acte de discernement exprimé par le verbe.
- issue: Relation exprimée entre la femme et l’homme
  choice: ma femme / son homme
  alternative: femme / homme
  rationale: Les suffixes possessifs du guèze ont été conservés. Ils expriment le rapport réciproque du passage sans qu’une doctrine matrimoniale supplémentaire soit ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence solennelle de la déclaration est conservée. « Cette fois, voici » rend l’emphase du texte sans archaïsme marqué; « tirée » maintient l’image de provenance corporelle.
