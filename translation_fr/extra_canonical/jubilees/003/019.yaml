  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
translation:
  language: fr
  text: 'Dieu nous a dit : « Ne mangez pas de ce fruit et n’y touchez pas, de peur que vous ne mouriez. » Alors le serpent dit à la femme : « Vous ne mourrez certainement pas, car Dieu sait que, le jour où vous en mangerez, vos yeux s’ouvriront, vous serez comme des dieux[a] et vous connaîtrez le bien[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des êtres divins » ; le pluriel peut aussi, selon l’interprétation, renvoyer à Dieu.'
    reason: Préserver l’ambiguïté interprétative de አማልክት sans remplacer dans le texte le pluriel source par une lecture théologique déterminée.
  - marker: b
    text: Le texte s’arrête ici à « le bien » ; il n’ajoute pas « et le mal ».
    reason: Signaler la portée exacte de la dernière expression sans ajouter au texte source.
lexical_decisions:
- source_word: ኢትብልዑ፡ እምኔሁ፡ ወኢትልከፍዎ
  choice: Vous ne devez pas en manger ni y toucher
  rationale: Rend les deux interdictions coordonnées de façon naturelle, sans omettre l’interdiction de toucher.
- source_word: አኮ፡ ሞተ፡ ዘትመውቱ
  choice: Vous ne mourrez certainement pas
  rationale: La construction nie avec insistance la mort annoncée; cette formulation conserve l’emphase du serpent.
- source_word: ይትረኀዉ፡ አዕይንቲክሙ
  choice: vos yeux s’ouvriront
  rationale: Traduction directe et idiomatique de l’expression.
- source_word: ከመ፡ አማልክት
  choice: comme des dieux
  rationale: Conserve le pluriel morphologique du guèze et l’ambiguïté référentielle, signalée en note.
- source_word: ወታአምሩ፡ ሠናየ
  choice: et vous connaîtrez le bien
  rationale: Le verbe est une forme finie coordonnée (« et vous connaîtrez »), et ሠናየ désigne ici « le bien ».
theological_decisions:
- issue: Sens de አማልክት
  choice: des dieux
  alternative: Dieu / des êtres divins
  rationale: Le texte source porte un pluriel; la traduction ne tranche pas silencieusement entre Dieu, des dieux ou des êtres divins.
- issue: Portée de « connaître le bien »
  choice: vous connaîtrez le bien
  alternative: connaissant le bien
  rationale: La forme verbale est finie et coordonnée; la traduction évite de compléter par « le bien et le mal », absent du texte fourni.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct est conservé, ainsi que le passage du pluriel (« nous », « vous ») au singulier référentiel « la femme ». Les notes rendent visibles les ambiguïtés réelles sans alourdir le corps du texte.
