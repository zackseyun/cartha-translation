  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
translation:
  language: fr
  text: 'Et le Seigneur nous dit : « Il n’est pas bon que l’homme soit seul. Faisons-lui une aide qui lui corresponde. » Le Seigneur notre Dieu fit tomber sur lui un profond sommeil, et il s’endormit. Il prit, parmi ses os, un os pour la femme ; et cette côte, prise d’entre ses os, fut à l’origine de la femme[a]. Il forma de la chair à sa place et façonna la femme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus librement : « et il en fit la femme ».'
    reason: Signale une reformulation possible de la proposition difficile sur la côte comme formation ou origine de la femme, tout en maintenant dans le texte principal la structure plus complète du guèze.
lexical_decisions:
- source_word: ዘከማሁ
  choice: qui lui corresponde
  rationale: L’expression signifie littéralement « qui soit comme lui ». « Qui lui corresponde » exprime naturellement en français l’idée d’une aide semblable et adaptée à l’homme, sans suggérer une simple identité.
- source_word: ህድመተ
  choice: un profond sommeil
  rationale: Le terme désigne ici le sommeil lourd provoqué par Dieu, conformément au contexte de la création de la femme.
- source_word: ዐጽመ፡ አሐደ
  choice: un os
  rationale: Le texte dit explicitement « un os », et non « une côte », dans cette première proposition.
- source_word: ገቦ
  choice: côte
  rationale: Dans la proposition suivante, le texte emploie le mot précis désignant le côté ou la côte ; la traduction conserve donc la progression « un os » puis « cette côte ».
- source_word: ፍጥረት
  choice: fut à l’origine de
  rationale: Le nom peut évoquer la création, la formation ou l’origine. Cette formulation rend la relation exprimée dans le texte tout en restant naturelle en français.
- source_word: ሐነጸ
  choice: forma / façonna
  rationale: Le verbe signifie littéralement « bâtir, construire ». Ces deux verbes français préservent l’image d’une action délibérée de formation sans produire une tournure artificielle.
theological_decisions:
- issue: Sens de l’aide « comme lui »
  choice: une aide qui lui corresponde
  alternative: une aide semblable à lui
  rationale: La traduction retenue conserve l’idée de correspondance et de similitude sans introduire de hiérarchie ou de doctrine étrangère au passage.
- issue: Pluriel divin dans « faisons »
  choice: conserver « Faisons-lui »
  alternative: « Je lui ferai »
  rationale: Le texte source emploie le pluriel et rapporte que le Seigneur parle « à nous ». Cette tension narrative est conservée sans en imposer une interprétation théologique.
- issue: Rapport entre l’os, la côte et la formation de la femme
  choice: conserver les deux désignations et la proposition sur l’origine de la femme
  alternative: simplifier en « il prit une côte et en fit la femme »
  rationale: La formulation retenue évite de supprimer la répétition et la proposition explicite du guèze selon laquelle la côte fut la formation ou l’origine de la femme parmi les os de l’homme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement allégée, mais les répétitions significatives du texte source — notamment « un os », « cette côte » et « parmi ses os » — sont conservées.
