  to: 'Et le Seigneur nous dit : « Il n’est pas bon que l’homme soit seul. Faisons-lui une aide qui lui corresponde. » Le Seigneur notre Dieu fit tomber sur lui un profond sommeil, et il s’endormit. Il prit, parmi ses os, un os pour la femme ; et cette côte, prise d’entre ses os, fut à l’origine de la femme[a]. Il forma de la chair à sa place et façonna la femme.'
