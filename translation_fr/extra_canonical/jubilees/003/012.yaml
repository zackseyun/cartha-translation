  text: And they shall be eighty days in all. And when she had completed these eighty days, we brought her into the garden of Eden, for it is holier than all the earth, and every tree that is planted in it is holy.
translation:
  language: fr
  text: La durée totale sera de quatre-vingts jours. Lorsqu’elle eut achevé ces quatre-vingts jours, nous la fîmes entrer dans le jardin d’Éden, car il est plus saint que toute la terre, et tout arbre qui y est planté est saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውና፡ ኵሎን፡ ሰማንያ፡ መዋዕለ
  choice: En tout, cela fera quatre-vingts jours
  rationale: Rend explicitement la première proposition du guèze, notamment l’idée de totalité exprimée par ኵሎን, sans l’omettre.
- source_word: አባእናሃ
  choice: nous la fîmes entrer
  rationale: Le causatif à la première personne du pluriel signifie que les locuteurs la font entrer ou l’introduisent, plutôt qu’ils ne se contentent de l’accompagner.
- source_word: ቅድስት፡ ይእቲ፡ እምኵሉ፡ ምድር
  choice: il est plus saint que toute la terre
  rationale: La tournure comparative du guèze est conservée et le pronom français reprend naturellement « le jardin d’Éden ».
- source_word: ወኵሉ፡ ዕፀ፡ ዘትከል
  choice: et tout arbre qui y est planté
  rationale: Traduction proche de la proposition relative; « y » explicite en français le lieu compris dans le contexte.
theological_decisions:
- issue: Degré de sainteté attribué au jardin d’Éden
  choice: plus saint que toute la terre
  alternative: le plus saint de toute la terre
  rationale: La formulation comparative préserve la relation exprimée par le texte sans transformer inutilement le jardin en superlatif absolu.
translation_notes:
  register: Français moderne, narratif et digne. Le passé antérieur « eut achevé » marque clairement l’antériorité immédiate par rapport au passé simple « fîmes entrer », tandis que le futur de la première phrase conserve la perspective normative ou prospective du contexte.
