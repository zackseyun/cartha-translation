base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/010.yaml
  text: 'Therefore the commandment was written on the heavenly tablets concerning her who gives birth: if she bears a male, she shall remain in her uncleanness seven days, according to the first seven days, and thirty-three days she shall remain in the blood of purification; she shall touch nothing holy, and she shall not enter the sanctuary until she completes these days for a male child.'
translation:
  language: fr
  text: 'C’est pourquoi le commandement fut écrit sur les tablettes célestes au sujet de celle qui enfante : si elle met au monde un garçon, elle restera sept jours dans son impureté, comme durant les sept premiers jours, puis elle restera trente-trois jours dans le sang de sa purification. Elle ne touchera rien de saint et n’entrera pas dans le sanctuaire jusqu’à ce qu’elle ait achevé ces jours prescrits pour un garçon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: tablettes célestes
  rationale: Rend directement l’expression guèze désignant les tablettes du ciel, motif propre au livre des Jubilés.
- source_word: ተባዕተ
  choice: un garçon
  rationale: Dans le contexte d’un enfant mis au monde, le français courant « garçon » est plus naturel que « mâle », tout en conservant la distinction sexuelle du texte.
- source_word: ርኵሳ
  choice: son impureté
  rationale: Conserve la catégorie rituelle exprimée par le guèze sans l’atténuer ni lui donner une valeur morale.
- source_word: ደመ፡ ንጽሓ
  choice: le sang de sa purification
  rationale: Traduction formellement proche qui préserve la formulation rituelle et son lien avec Lévitique 12.
- source_word: መቅደስ
  choice: le sanctuaire
  rationale: Équivalent usuel et précis du lieu saint dans ce contexte rituel.
theological_decisions:
- issue: Nature de l’impureté après l’accouchement
  choice: Employer le vocabulaire rituel « impureté » et « purification »
  alternative: Reformuler en termes d’hygiène ou de faute morale
  rationale: Le passage traite d’un statut cultuel; il ne faut ni le médicaliser ni suggérer une culpabilité morale absente du texte.
- issue: Portée de la dernière expression
  choice: « ces jours prescrits pour un garçon »
  alternative: « ces jours qui concernent un enfant mâle »
  rationale: La formulation retenue conserve le rattachement des jours à la naissance d’un garçon et explicite sobrement leur caractère réglementaire, sans omettre la clause finale du guèze.
