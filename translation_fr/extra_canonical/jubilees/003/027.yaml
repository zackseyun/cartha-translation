translation:
  language: fr
  text: Ce jour-là, les bouches de toutes les bêtes sauvages, de tout le bétail, de tous les oiseaux, de tout ce qui marche et de tout ce qui se déplace furent fermées à la parole, car tous se parlaient les uns aux autres, d’une seule lèvre et d’une seule langue.
