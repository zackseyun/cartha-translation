  rationale: Dans cette énumération, le terme contraste avec les bêtes sauvages et désigne vraisemblablement les animaux domestiques.
- source_word: ተፈጽመ፡ አፈ ... እምነቢብ
  choice: la bouche ... fut fermée à la parole
  rationale: Rend l’idée que leur faculté de parler prit fin, tout en conservant l’image concrète de la bouche au singulier collectif.
- source_word: ክንፈረ፡ አሐደ፡ ወልሳነ፡ አሐደ
