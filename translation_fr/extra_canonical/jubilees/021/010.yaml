  source_fidelity: La libation (ሞጻሕቱ) et l’offrande de céréales (ኅብስተ፡ ጽንሓሕ) sont toutes deux conservées, conformément au guèze et à la correction de l’audit anglais. La défense de consommer la viande avant le coucher du soleil du deuxième jour est également préservée. En revanche, « jusqu’au troisième jour » peut en français signifier qu’il est permis de la conserver pendant ce délai, alors que le texte interdit d’en laisser pour le troisième jour.
  naturalness: Le registre cultuel est juste et accessible. « En parfum agréable, comme offrande » est toutefois syntaxiquement lourd et « premiers ancêtres » peu naturel. La révision maintient l’ellipse cultuelle du texte tout en employant des formulations françaises plus nettes.
  terminology: « Libation », « offrande de céréales », « agréable odeur », « agréée » et « porteront leur péché » sont des équivalents appropriés et cohérents pour un français biblique moderne. « Chose profane » conserve l’interprétation cultuelle retenue sans introduire une doctrine particulière.
