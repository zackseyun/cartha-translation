  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
translation:
  language: fr
  text: 'Et avec sa libation, pour une agréable odeur, une offrande de céréales au Seigneur.[a] Mange sa chair ce jour-là et le deuxième jour. Que le soleil ne se couche pas sur elle le deuxième jour avant qu’elle ne soit mangée, et n’en laisse rien pour le troisième jour, car elle n’est pas agréée : c’est une chose profane, qui ne doit pas être mangée. Tous ceux qui en mangeront porteront leur péché. Car c’est ainsi que je l’ai trouvé écrit dans le livre de mes ancêtres d’autrefois, dans les paroles d’Hénoch et dans les paroles de Noé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La portée exacte de « pour une agréable odeur » entre la libation et l’offrande de céréales demeure ambiguë dans la formulation guèze.
    reason: Préserve sans la trancher l’ambiguïté syntaxique de la première proposition, tout en maintenant explicitement les deux offrandes.
lexical_decisions:
- source_word: ሞጻሕቱ
  choice: sa libation
  rationale: Le terme désigne l’offrande liquide qui accompagne le sacrifice; il doit être conservé en plus de l’offrande de céréales mentionnée ensuite.
- source_word: ለመዓዛ፡ ሠናይ
  choice: en parfum agréable
  rationale: Expression sacrificielle traditionnelle, rendue de manière naturelle et digne en français.
- source_word: ኅብስተ፡ ጽንሓሕ
  choice: offrande de céréales
  rationale: Littéralement une offrande de pain ou de farine; « offrande de céréales » exprime clairement la catégorie cultuelle sans la confondre avec la libation.
- source_word: እኩይ፡ ኅሩየ
  choice: une chose profane
  rationale: Dans ce contexte cultuel, l’expression désigne une viande devenue impropre ou sacrilège plutôt qu’une simple chose moralement mauvaise.
- source_word: ኃጢአተ፡ ሎሙ፡ ይነሥኡ
  choice: porteront leur péché
  rationale: Conserve l’image juridique et théologique du fait d’assumer la culpabilité liée à la transgression.
- source_word: መጽሐፈ፡ አበዊየ፡ ቀደምት
  choice: le livre de mes premiers ancêtres
  rationale: Respecte le singulier « livre » et rattache naturellement l’adjectif aux ancêtres d’autrefois.
theological_decisions:
- issue: Statut de la viande sacrificielle au troisième jour
  choice: '« elle n’est pas agréée : c’est une chose profane »'
  alternative: « elle n’est pas acceptable, car c’est une chose mauvaise consacrée »
  rationale: La formulation retenue maintient le cadre cultuel sans introduire l’idée contradictoire d’une chose à la fois mauvaise et consacrée.
- issue: Responsabilité de celui qui mange
  choice: « porteront leur péché »
  alternative: « seront coupables »
  rationale: La traduction formelle préserve la métaphore biblique et la tension entre acte, culpabilité et conséquence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le vocabulaire sacrificiel est précis; les phrases longues de la source ont été légèrement segmentées pour la lisibilité, sans résoudre les ambiguïtés théologiques.
