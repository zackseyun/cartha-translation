  yaml_path: translation/extra_canonical/jubilees/021/001.yaml
  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
translation:
  language: fr
  text: 'Au cours de la sixième année de la septième semaine de ce jubilé, Abraham appela son fils Isaac et lui donna cet ordre : « J’ai vieilli, je ne connais pas le jour de ma mort et je suis rassasié de jours[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comblé de jours » ; c’est-à-dire parvenu à un âge avancé.'
    reason: L’expression littérale est idiomatique et peut évoquer à la fois la longévité et une vie arrivée à sa pleine mesure.
lexical_decisions:
- source_word: ጸውዐ
  choice: appela
  rationale: Rend directement le verbe guèze « appeler » dans ce contexte narratif.
- source_word: ወአዘዞ
  choice: et lui donna ses instructions
  rationale: Exprime naturellement en français l’idée d’ordonner ou de prescrire à Isaac, sans durcir inutilement le ton.
- source_word: ረሳዕኩ
  choice: J’ai vieilli
  rationale: Reproduit simplement l’énoncé à la première personne sur la vieillesse d’Abraham.
- source_word: ጸገብኩ፡ መዋዕልየ
  choice: je suis rassasié de jours
  rationale: Préserve la première personne du verbe et l’image sémitique de la satiété appliquée à une longue vie.
theological_decisions:
- issue: Portée de l’expression finale concernant les jours d’Abraham
  choice: je suis rassasié de jours
  alternative: mes jours sont accomplis
  rationale: Le guèze emploie un verbe à la première personne signifiant être rassasié ou comblé. La traduction retenue conserve cette construction et n’affirme pas plus directement que la durée fixée de sa vie est arrivée à son terme.
translation_notes:
  register: Français international moderne, narratif et digne. L’expression biblique « rassasié de jours » est conservée pour respecter l’image du texte source, avec une note explicative. La formule chronologique reste concise et n’ajoute pas « d’années », absent ici et redondant dans le contexte.
