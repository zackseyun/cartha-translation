translation:
  language: fr
  text: son alliance.[a] Et toi aussi, mon fils, garde son commandement, son ordonnance et son jugement, et ne marche pas à leur suite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « son alliance » paraissent conclure la phrase du verset précédent dans le fil du passage, mais ils figurent au début du segment source fourni.
    reason: Signaler une probable anomalie de découpage sans omettre le texte source.
  - marker: b
    text: Le texte dit littéralement « derrière eux » ; le référent de « eux » n’apparaît pas dans ce segment, probablement tronqué par le découpage du verset.
    reason: Préserver et expliquer l’ambiguïté créée par la segmentation.
lexical_decisions:
- source_word: ኪዳኖ
  choice: son alliance
  rationale: Le nom ኪዳን avec suffixe possessif signifie « son alliance ». Bien qu’il semble achever la phrase du verset précédent, il est traduit puisqu’il figure dans le segment source fourni.
- source_word: ትእዛዞ
  choice: son commandement
  rationale: Le terme est au singulier avec suffixe possessif masculin singulier ; le singulier est donc conservé.
- source_word: ሥርዐቶ
  choice: son ordonnance
  rationale: « Ordonnance » rend le sens de prescription ou de règle établie tout en maintenant le registre juridique de l’énumération.
- source_word: ኵነኔሁ
  choice: son jugement
  rationale: Le singulier et le suffixe possessif du texte guèze sont conservés ; « jugement » maintient la troisième catégorie juridique sans l’assimiler aux deux précédentes.
- source_word: ወኢትሖር፡ ድኅሬሆሙ
  choice: et ne marche pas à leur suite
  rationale: Cette formulation conserve l’image de la marche et le pronom pluriel du guèze, sans fournir un antécédent absent du segment transmis.
theological_decisions:
- issue: Nombre des trois termes juridiques
  choice: son commandement, son ordonnance et son jugement
  alternative: ses commandements, ses ordonnances et ses jugements
  rationale: Les trois formes guèzes sont morphologiquement singulières. Les mettre au pluriel généraliserait le propos au-delà de la forme du texte source.
- issue: Référent du pronom final pluriel
  choice: à leur suite
  alternative: à la suite des idoles
  rationale: Le segment fourni ne nomme pas explicitement les référents. Même si la suite textuelle perdue par le découpage peut les préciser, les introduire ici résoudrait silencieusement une lacune de segmentation.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « mon fils » conserve l’adresse paternelle ; « ne marche pas à leur suite » garde l’image sémitique sans devenir artificielle. La ponctuation ferme le segment malgré son caractère vraisemblablement tronqué.
