  source_fidelity: 'Le français rend fidèlement les éléments distincts du guèze : Dieu vivant, saint, fidèle et juste ; absence de partialité (« prendre le visage ») et de réception de présents ; jugement contre ceux qui transgressent les commandements et contre ceux qui méprisent. La distinction essentielle entre favoritisme et présents est bien préservée, conformément à l’audit anglais. « Son alliance » correspond au complément attesté par la tradition textuelle et l’audit, tandis que la note signale honnêtement qu’il n’est pas répété dans l’extrait guèze fourni, lequel s’interrompt après « ceux qui méprisent ».'
