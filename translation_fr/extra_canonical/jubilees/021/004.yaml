base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/004.yaml
  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
translation:
  language: fr
  text: 'la volonté de celui qui m’a créé. Car il est le Dieu vivant ; il est saint, fidèle et juste par-dessus tout. Chez lui, il n’y a ni favoritisme ni acceptation de présents[a], car il est un Dieu juste : il exerce le jugement sur tous ceux qui transgressent ses commandements et sur ceux qui méprisent son alliance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’accepte aucun pot-de-vin ».
    reason: Le mot peut désigner un présent et, dans ce contexte judiciaire, plus précisément un cadeau corrupteur.
  - marker: b
    text: Littéralement, le texte dit ici « ceux qui méprisent » ; « son alliance » est sous-entendu.
    reason: Le complément du dernier verbe n’apparaît pas explicitement dans la portion guèze fournie, bien qu’il soit compris dans la tradition et le contexte.
lexical_decisions:
- source_word: ፈቃዱ፡ ለዘፈጠረኒ
  choice: la volonté de celui qui m’a créé
  rationale: Rend directement le syntagme fragmentaire qui poursuit la phrase précédente, sans en faire artificiellement une phrase autonome.
- source_word: አምላክ፡ ሕያው
  choice: le Dieu vivant
  rationale: Formulation française naturelle et fidèle à l’expression guèze.
- source_word: ምእመን
  choice: fidèle
  rationale: Conserve la qualité morale et relationnelle exprimée par le terme, aux côtés de « saint » et « juste ».
- source_word: ነሢአ፡ ገጽ
  choice: favoritisme
  rationale: Littéralement lié au fait de « prendre le visage », l’expression désigne la partialité fondée sur la personne ; « favoritisme » est clair en français moderne.
- source_word: ነሢአ፡ ሕልያን
  choice: acceptation de présents
  rationale: Distingue cette seconde expression de la partialité et rend l’idée de cadeaux susceptibles d’influencer le jugement.
- source_word: ገባሬ፡ ኵነኔ
  choice: il exerce le jugement
  rationale: Rend l’idée d’accomplir ou d’exécuter le jugement dans une formulation française digne et naturelle.
- source_word: ይትዐደዉ፡ ትእዛዞ
  choice: transgressent ses commandements
  rationale: Respecte le verbe de transgression et le sens du terme désignant le commandement ou les commandements.
- source_word: ይሜንኑ
  choice: méprisent
  rationale: Préserve la seconde action distincte, plus forte qu’une simple transgression, sans la fondre dans le premier membre.
theological_decisions:
- issue: Impartialité divine et corruption du jugement
  choice: « ni favoritisme ni acceptation de présents »
  alternative: « ni acception de personnes ni acceptation de pots-de-vin »
  rationale: 'Le texte distingue deux réalités : la partialité envers les personnes et la réception d’un don. La formulation retenue reste accessible tout en conservant cette distinction.'
- issue: Objet de « méprisent » dans le dernier membre
  choice: « méprisent son alliance » avec note
  alternative: « méprisent » sans complément explicite
  rationale: Le complément « son alliance » est compris dans la tradition textuelle et le contexte, mais n’est pas répété explicitement dans la portion guèze fournie ; la note signale cette ellipse au lieu de masquer la difficulté.
translation_notes:
  register: Français international moderne, clair et digne. Le fragment initial est maintenu comme continuation syntaxique du verset précédent. Les deux expressions judiciaires sont nettement distinguées, et la répétition de « il est » conserve le rythme solennel du texte source sans alourdir excessivement la phrase.
