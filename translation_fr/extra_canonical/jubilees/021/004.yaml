  terminology: « Dieu vivant », « fidèle », « juste », « favoritisme », « présents », « jugement », « transgressent » et « alliance » sont des choix précis et adaptés au français international moderne. « Méprisent » conserve la force du second verbe et évite de le confondre avec « transgressent ».
