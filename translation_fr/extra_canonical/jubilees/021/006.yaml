  text: vers des choses impures, ni vers des images sculptées, ni vers des images en métal fondu. Et ne mangez aucun sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለርኩሳን
  choice: vers des choses impures
  rationale: Le préfixe ለ- exprime ici l’orientation, tandis que l’adjectif pluriel substantivé désigne des choses impures sans préciser davantage leur nature.
- source_word: ለገሊፎ
  choice: à la suite d’images sculptées
  rationale: ገሊፎ renvoie à ce qui est taillé ou sculpté; « images sculptées » conserve la catégorie concrète sans introduire explicitement le terme interprétatif « idoles ».
- source_word: ለስብክ
  choice: à la suite d’images fondues
  rationale: Le terme désigne des objets produits par fonte; la formulation française maintient le parallèle avec les images sculptées.
- source_word: ወኢትብልዑ፡ ወኢምዝተኒ
  choice: Et ne mangez aucun sang
  rationale: L’interdiction porte sur le sang, et le dernier élément renforce son caractère exhaustif; « aucun » rend cette nuance explicitement et naturellement.
theological_decisions:
- issue: Identification des objets impurs et des images
  choice: Conserver « choses impures », « images sculptées » et « images fondues »
  alternative: Traduire globalement par « idoles »
  rationale: Le texte distingue plusieurs expressions. Les réduire au seul mot « idoles » résoudrait une ambiguïté que la source laisse ouverte.
translation_notes:
  register: Fragment syntaxiquement rattaché à la proposition précédente, d’où l’initiale en minuscule. Langue actuelle et digne; répétition de « à la suite de » maintenue pour refléter le parallélisme de la source.
