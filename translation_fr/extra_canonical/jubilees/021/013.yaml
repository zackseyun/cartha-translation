base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/013.yaml
  text: '[called] arsatna and besem[13]; but from among these woods place under the sacrifice upon the altar those proven in appearance. And do not place any split or dark wood, but hard and clean wood, without blemish, sound and freshly grown; and do not place old wood[13], because its fragrance has gone out.'
translation:
  language: fr
  text: '[appelés] arsatna et bésem[a]. Parmi ces bois, place sous le sacrifice, sur l’autel, ceux qui ont été éprouvés quant à leur aspect[b]. Ne mets aucun bois fendu ou sombre, mais du bois dur et pur, sans défaut, sain et de pousse récente. Ne mets pas non plus de vieux bois, car son parfum s’en est allé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms arsatna et bésem sont difficiles à identifier. Le texte pourrait conserver des appellations botaniques régionales ou altérées.
    reason: lexical_alternative
  - marker: b
    text: 'Le texte est difficile. Autre traduction possible : « place sous le sacrifice ceux qui ont été reconnus à leur aspect ».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: አርሳትነ ወቤስም
  choice: arsatna et bésem
  rationale: Ces noms de plantes sont obscurs et leur identification botanique demeure incertaine. La translittération évite de leur attribuer arbitrairement des espèces précises.
- source_word: ንቁዐ ወፈዋነ
  choice: fendu ou sombre
  rationale: La traduction conserve les deux qualificatifs du texte guèze. « Sombre » rend le second sans introduire l’idée non exprimée d’un bois noirci par un processus.
- source_word: ጽኑዓነ ወንጹሐ
  choice: dur et pur
  rationale: « Dur » convient à la qualité physique du bois, tandis que « pur » maintient la possible portée cultuelle de ንጹሐ sans la réduire à la seule propreté matérielle.
- source_word: ንደስተ ተከለ
  choice: de pousse récente
  rationale: Cette formulation française naturelle exprime un bois nouvellement poussé ou récemment formé, en contraste explicite avec le vieux bois.
- source_word: ምትነኒ
  choice: parfum
  rationale: Dans le contexte des bois destinés à l’autel, « parfum » rend naturellement l’odeur aromatique qui s’est dissipée.
theological_decisions:
- issue: Portée de la pureté exigée pour le bois de l’autel
  choice: pur
  alternative: propre
  rationale: « Pur » préserve la tension entre qualité matérielle et aptitude rituelle, sans imposer une interprétation confessionnelle particulière.
translation_notes:
  register: Français moderne, digne et accessible. La structure impérative et le vocabulaire sacrificiel sont conservés. Les noms botaniques incertains sont translittérés, et l’ambiguïté de la formule relative à l’aspect est signalée en note.
