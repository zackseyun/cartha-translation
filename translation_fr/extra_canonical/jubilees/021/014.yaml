  text: its fragrance, because there is no longer fragrance upon it as at first. Other than these woods, do not place any other, because its fragrance is distinct, and the odor of its fragrance goes up to heaven.
translation:
  language: fr
  text: son parfum, car il n’y a plus de parfum sur lui comme auparavant. À part ces bois, ne dépose aucun autre bois, car son parfum est particulier, et la senteur de son parfum monte jusqu’au ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛሁ
  choice: son parfum
  rationale: Le nom désigne ici le parfum ou l’odeur agréable, et le suffixe possessif de troisième personne est explicite.
- source_word: ከመ፡ ቀዳማዊ
  choice: qu’auparavant
  rationale: Rend naturellement la comparaison « comme au commencement / comme autrefois » sans en préciser excessivement le référent.
- source_word: ዕፀው
  choice: bois
  rationale: Dans ce contexte de matières aromatiques destinées à être déposées ou brûlées, « bois » convient mieux que le terme générique « plantes » ou « arbres ».
- source_word: ፍሉጥ
  choice: particulier
  rationale: Le mot peut exprimer ce qui est connu, reconnu ou distinct; « particulier » conserve ici l’idée d’un parfum qui se distingue, sans introduire une connaissance personnelle.
- source_word: ፄና፡ መዐዛሁ
  choice: la senteur de son parfum
  rationale: La formulation préserve le redoublement du texte source entre odeur/senteur et parfum, tout en restant idiomatique en français.
theological_decisions:
- issue: Portée céleste de la fumée ou du parfum sacrificiel
  choice: monte jusqu’au ciel
  alternative: s’élève dans le ciel
  rationale: La traduction conserve simplement l’image cultuelle du texte, sans préciser si elle implique réception, agrément ou présence divine.
translation_notes:
  register: Français moderne, digne et accessible. Le fragment initial est maintenu comme continuation syntaxique du verset précédent. La répétition de « parfum » est volontaire afin de respecter l’insistance du guèze.
