  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: fr
  text: Mets du sel sur toutes tes offrandes, et que le sel de l’alliance ne manque à aucune d’elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: tes offrandes
  rationale: Le terme désigne ce qui est offert en sacrifice; «offrandes» convient naturellement ici et conserve la portée cultuelle sans surspécifier le type de sacrifice.
- source_word: ትደይ፡ ፄወ
  choice: mets du sel
  rationale: Rend directement l’injonction de placer ou mettre du sel sur les offrandes.
- source_word: ፄወ፡ ኪዳን
  choice: le sel de l’alliance
  rationale: Reproduit la construction source et son association théologique explicite entre le sel et l’alliance.
- source_word: ወኢይደሪዕ
  choice: et que … ne manque
  rationale: Cette tournure injonctive française exprime naturellement l’interdiction ou l’exigence négative du texte.
- source_word: ውስተ፡ ኵሉ
  choice: dans aucune d’elles
  rationale: 'Dans le contexte des offrandes au pluriel, la négation française «aucune» rend le sens distributif final: le sel ne doit manquer à aucune offrande.'
theological_decisions:
- issue: Sens de «sel de l’alliance»
  choice: Conserver littéralement «le sel de l’alliance»
  alternative: Expliciter comme «le sel qui symbolise l’alliance»
  rationale: Le texte affirme l’expression sans expliquer le rapport entre le sel et l’alliance; l’explicitation imposerait une interprétation absente de la source.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif «mets» et la tournure «que … ne manque» préservent la force prescriptive du verset; aucun archaïsme ni ajout interprétatif.
