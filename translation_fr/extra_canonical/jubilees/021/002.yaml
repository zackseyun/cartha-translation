  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: fr
  text: Et voici, j’ai cent soixante-quinze ans. Durant tous les jours de ma vie, je me suis souvenu du Seigneur et j’ai cherché de tout mon cœur à faire sa volonté.
