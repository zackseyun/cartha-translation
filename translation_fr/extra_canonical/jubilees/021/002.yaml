lexical_decisions:
- source_word: ወናሁ
  choice: Et voici
  rationale: Conserve le marqueur discursif emphatique du guèze dans une tournure biblique claire et encore compréhensible.
- source_word: ወልደ፡ ምእት፡ ወሰብዓ፡ ወኃምስቱ፡ ዓመት
  choice: j’ai cent soixante-quinze ans
  rationale: Rend directement l’expression d’âge, avec le nombre écrit en toutes lettres conformément au registre littéraire.
- source_word: በኵሉ፡ መዋዕለ፡ ሕይወትየ
  choice: Durant tous les jours de ma vie
  rationale: Reproduit l’étendue temporelle de l’original tout en restant idiomatique en français.
- source_word: ሀሎኩ፡ እንዘ፡ እዜከር፡ ለእግዚአብሔር
  choice: je me suis souvenu du Seigneur
  rationale: Rend le verbe « se souvenir » sans l’affaiblir en simple attention mentale; l’auxiliaire ሀሎኩ et la construction circonstancielle expriment ici une conduite maintenue dans la durée.
- source_word: እንዘ፡ አኀሥሥ፡ በኵሉ፡ ልብየ
  choice: j’ai cherché de tout mon cœur
  rationale: Préserve l’idée de recherche ou d’effort orienté, ainsi que l’engagement du cœur entier.
- source_word: ከመ፡ እግበር፡ ፈቃደቲሁ
  choice: à faire sa volonté
  rationale: Traduction naturelle et précise de la proposition finale exprimant le but de la recherche.
theological_decisions:
- issue: Portée de « se souvenir du Seigneur »
  choice: Maintenir l’expression concrète « je me suis souvenu du Seigneur »
  alternative: « je suis resté attentif au Seigneur » ou « j’ai gardé le Seigneur présent à l’esprit »
  rationale: Le texte source emploie explicitement le champ lexical du souvenir. La traduction n’impose pas une interprétation doctrinale particulière de ce souvenir.
