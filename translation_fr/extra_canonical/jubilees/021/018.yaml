translation:
  language: fr
  text: Prends garde, mon fils, au sang ; prends grand soin de le recouvrir de terre. Et n’en mange absolument pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብ፡ … በደም
  choice: Prends garde […] au sang
  rationale: Rend l’impératif de vigilance et son complément de façon naturelle et solennelle en français.
- source_word: ጥቀ
  choice: avec le plus grand soin
  rationale: Restitue la forte valeur intensive de l’adverbe, qui porte sur le second impératif.
- source_word: ደፍኖ፡ ውስተ፡ ምድር
  choice: à le couvrir dans la terre
  rationale: Suit le texte guèze, qui parle de couvrir le sang dans la terre, sans ajouter « de poussière ».
- source_word: ወኢትብልዖ፡ እንከ
  choice: Et n’en mange absolument pas
  rationale: Le pronom français « en » reprend naturellement le sang, tandis que « absolument pas » exprime la force emphatique de እንከ dans cette interdiction négative.
theological_decisions:
- issue: Portée de l’interdiction alimentaire
  choice: Conserver l’interdiction absolue visant le sang
  alternative: Traduire simplement « Et n’en mange pas »
  rationale: La formulation retenue préserve l’emphase du texte sans ajouter d’explication doctrinale ni élargir son référent.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition du verbe guèze est rendue par « prends garde » puis « veille » afin de rester naturelle tout en conservant l’insistance.
