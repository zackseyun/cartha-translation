base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/015.yaml
  text: Keep this command and do it[15], my son, so that you may walk rightly in all your deeds. And at all times be pure in your body, and wash yourself with water before you go up to offer on the altar; and wash your hands and your feet before you approach the altar; and when you have finished offering, return.
translation:
  language: fr
  text: Garde ce commandement et mets-le en pratique[15], mon fils, afin d’agir avec droiture dans tout ce que tu fais. En tout temps, garde ton corps pur et lave-toi avec de l’eau avant de monter présenter une offrande sur l’autel. Lave-toi aussi les mains et les pieds avant de t’approcher de l’autel. Quand tu auras fini de présenter l’offrande, retourne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: Dans les données sources fournies, la numérotation passe du verset 15 au verset 17 ; aucun segment guèze distinct ne correspond à un verset 16.
    reason: segmentation_note
lexical_decisions:
- source_word: ዑቅ፡ ዛተእዛዘ፡ ወገብራ
  choice: Garde ce commandement et mets-le en pratique
  rationale: Rend distinctement l’impératif « garder » et l’appel à « faire » le commandement, dans un français naturel.
- source_word: ታርትዕ፡ በኵሉ፡ ግብርከ
  choice: afin d’agir avec droiture dans tout ce que tu fais
  rationale: Le verbe exprime l’idée de rectitude; cette formulation conserve la portée morale appliquée à l’ensemble des actes.
- source_word: ኩን፡ ንጹሐ፡ በሥጋከ
  choice: garde ton corps pur
  rationale: Le guèze dit littéralement « sois pur dans ton corps »; la formulation française est claire sans spiritualiser la pureté corporelle.
- source_word: ለአዕርጎ፡ ውስተ፡ ምሥዋዕ
  choice: monter présenter une offrande sur l’autel
  rationale: Préserve le mouvement ascendant et explicite l’objet implicite de l’action sacrificielle; « présenter une offrande » est idiomatique et digne.
- source_word: ግባእ
  choice: retourne
  rationale: L’impératif de ገብአ exprime ici le retour, plutôt que l’entrée, laquelle serait normalement rendue par un autre verbe.
theological_decisions:
- issue: Nature de la pureté exigée
  choice: garde ton corps pur et lave-toi avec de l’eau
  alternative: sois pur spirituellement
  rationale: Le texte mentionne explicitement le corps et les ablutions; la traduction ne transforme donc pas une prescription rituelle corporelle en notion uniquement spirituelle.
- issue: Action accomplie sur l’autel
  choice: présenter une offrande
  alternative: offrir sur l’autel
  rationale: L’offrande est implicite dans la construction; elle est explicitée seulement pour produire une phrase française complète, sans préciser indûment le type de sacrifice.
translation_notes:
  register: Français international actuel, clair et digne. Le tutoiement et l’adresse « mon fils » conservent le ton direct de l’exhortation paternelle. Les répétitions relatives à l’autel et aux ablutions sont maintenues puisqu’elles structurent la prescription rituelle.
