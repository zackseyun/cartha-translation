  text: blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.
translation:
  language: fr
  text: … du sang, car c’est la vie ; ne mange aucun sang. N’accepte aucun présent au sujet de quelque sang humain que ce soit, de peur que ce sang ne soit versé impunément, sans jugement[a] ; car c’est le sang versé qui souille la terre, et la terre ne peut être purifiée du sang d’un être humain que par le sang de celui qui l’a versé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se comprendre : « de peur qu’il ne soit versé en vain, sans jugement ».'
    reason: Le sens adverbial couvre les nuances « en vain », « sans motif » et, dans ce contexte judiciaire, « impunément ».
lexical_decisions:
- source_word: ነፍስ
  choice: vie
  rationale: Le terme signifie littéralement « âme » ou « vie » ; dans l’interdit alimentaire concernant le sang, « vie » exprime naturellement le sens contextuel sans introduire une anthropologie particulière.
- source_word: ሕልያነ
  choice: présent
  rationale: Le contexte judiciaire vise un don ou avantage accepté à propos d’un homicide ; « présent » conserve cette idée sans préciser au-delà du texte s’il s’agit formellement d’un pot-de-vin.
- source_word: በከ
  choice: impunément
  rationale: L’adverbe peut évoquer ce qui arrive en vain, gratuitement ou sans conséquence ; associé à « sans jugement », il indique ici qu’un sang humain ne doit pas être versé sans sanction judiciaire.
- source_word: ያንጥኦ
  choice: souille
  rationale: Le verbe décrit l’effet polluant ou profanateur du sang versé sur la terre ; « souille » convient au registre rituel et moral du passage.
- source_word: ነጺሐ
  choice: être purifiée
  rationale: Le terme exprime la purification ou le fait de devenir pur, en contraste direct avec la souillure de la terre.
theological_decisions:
- issue: Rapport entre le sang et la vie
  choice: « car il est la vie »
  alternative: « car il est l’âme »
  rationale: « Vie » rend le sens fonctionnel de ነፍስ dans ce contexte alimentaire et évite de trancher une question doctrinale sur la nature de l’âme.
- issue: Rétribution pour le sang versé
  choice: « par le sang de celui qui l’a versé »
  alternative: Paraphraser comme une prescription explicite de peine capitale
  rationale: La formulation source est conservée sans développer ses implications juridiques ou théologiques au-delà de ce qui est affirmé.
- issue: Valeur de ይትከዐው በከ
  choice: « qu’il ne soit versé impunément »
  alternative: « qu’il ne soit réclamé de toi »
  rationale: Le verbe désigne le sang qui est versé ou répandu, tandis que l’adverbe évoque l’absence de conséquence ; l’ancienne analyse comme une réclamation « de toi » n’est pas soutenue par la morphologie.
translation_notes:
  register: Français moderne, digne et direct. Les répétitions du mot « sang » sont maintenues parce qu’elles structurent l’argument. L’ellipse initiale est signalée par des points de suspension, puisque le texte fourni commence au milieu d’une proposition.
