    issue: Ajout de « versé » dans « le sang versé d’un être humain »
    rationale: Le Ge’ez parle d’un présent « concernant tout sang humain »; il ne qualifie pas ici ce sang de « versé ». L’effusion est énoncée ensuite (« de peur que ce sang ne soit versé… »). Il convient de ne pas anticiper ni de restreindre cette formulation.
