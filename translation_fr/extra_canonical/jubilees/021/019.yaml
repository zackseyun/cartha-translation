  to: … du sang, car c’est la vie ; ne mange aucun sang. N’accepte aucun présent au sujet de quelque sang humain que ce soit, de peur que ce sang ne soit versé impunément, sans jugement[a] ; car c’est le sang versé qui souille la terre, et la terre ne peut être purifiée du sang d’un être humain que par le sang de celui qui l’a versé.
