  text: and to walk uprightly in all his paths. My soul hated idols, that I might observe to do
translation:
  language: fr
  text: et à marcher avec droiture dans toutes ses voies. Mon âme détestait les idoles, afin que je veille à accomplir[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset suivant, qui précise ce qu’Abraham veille à accomplir.
    reason: Le verset se termine sur une proposition volontairement inachevée; la note évite que cette fidélité à la division du texte soit prise pour une lacune.
lexical_decisions:
- source_word: አርትዕ፡ ሐዊረ
  choice: marcher avec droiture
  rationale: Rend naturellement l’idée de régler ou rendre droite sa marche, sans réduire l’expression à une simple rectitude abstraite.
- source_word: በኵሉ፡ ፍናዊሁ
  choice: dans toutes ses voies
  rationale: Conserve l’image biblique des « voies » et le possessif masculin du texte source.
- source_word: ጣዖተ፡ ጸልአት፡ ነፍስየ
  choice: Mon âme détestait les idoles
  rationale: Suit de près la construction emphatique du guèze tout en restant idiomatique en français moderne.
- source_word: ከመ፡ እትዐቀብ፡ ለገቢረ
  choice: afin que je veille à accomplir
  rationale: Préserve le sens positif de vigilance en vue d’agir et la préposition orientée vers l’action; n’introduit pas à tort l’idée de se garder de fabriquer les idoles.
theological_decisions:
- issue: Objet non exprimé du verbe « accomplir » à la fin du verset
  choice: 'Maintenir la proposition ouverte: « afin que je veille à accomplir »'
  alternative: Compléter par « sa volonté » ou rendre « afin de me garder de les fabriquer »
  rationale: Le texte guèze place l’objet ou le complément de l’action dans la suite. L’ajouter ici résoudrait artificiellement l’enjambement, tandis que l’interprétation négative inverse le mouvement de la proposition.
translation_notes:
  register: Français international moderne, digne et accessible. L’image traditionnelle de la marche et des voies est conservée. La fin suspendue respecte la syntaxe transversale des versets du texte source.
