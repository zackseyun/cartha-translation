  text: Lave-toi les mains et les pieds. Qu’aucun sang ne soit visible sur vous ni sur vos vêtements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትሐፀብ
  choice: Lave-toi
  rationale: Le verbe est rendu par un impératif réfléchi naturel en français; le singulier correspond à l’adresse individuelle indiquée par les suffixes de «tes mains» et «tes pieds».
- source_word: እደዊከ፡ ወእገሪከ
  choice: les mains et les pieds
  rationale: Traduction directe des deux parties du corps; avec «Lave-toi», les articles définis sont idiomatiques en français.
- source_word: ኢያስተርኢ
  choice: ne soit visible
  rationale: Rend l’idée passive de paraître ou d’être vu sans ajouter une action absente du texte.
- source_word: ኵሉ፡ ደም
  choice: aucune trace de sang
  rationale: Dans cette construction négative, l’expression signifie qu’aucun sang ne doit être visible; «trace de sang» donne un français naturel tout en conservant la portée totale.
- source_word: በውስተ፡ አልባሲክሙ
  choice: sur vos vêtements
  rationale: Le contexte visuel appelle «sur» en français; le suffixe pluriel est conservé par «vos».
theological_decisions:
- issue: Alternance du singulier et du pluriel dans l’adresse
  choice: Conserver «Lave-toi» puis «sur vous / vos vêtements»
  alternative: Uniformiser toute la phrase au singulier ou au pluriel
  rationale: Le texte guèze passe de suffixes singuliers pour les mains et les pieds à des formes plurielles dans la seconde proposition. Cette variation est préservée plutôt que corrigée silencieusement.
translation_notes:
  register: Français moderne, clair et digne. La légère rupture entre le singulier et le pluriel reflète délibérément la morphologie du texte source.
