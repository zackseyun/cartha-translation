  terminology: « Seigneur », « sacrifice de délivrance », « graisse », « entrailles » et « reins » sont cohérents et précis dans ce contexte. « Sacrifice de délivrance » préserve la portée de መሥዋዕተ፡ መድኃኒት sans imposer l’équivalence technique confessionnelle « sacrifice de paix ».
