  source_fidelity: 'Le texte français suit fidèlement le guèze : l’impératif (« Tu mettras »), la graisse sacrificielle, le feu sur l’autel, les entrailles/parties internes et les deux reins sont tous conservés. La finale « et toute[a] » rend correctement ወኵሎ (« et tout/toute ») sans lui attribuer le sens fautif de « tous les deux » et sans compléter artificiellement un segment qui se poursuit au verset 9.'
