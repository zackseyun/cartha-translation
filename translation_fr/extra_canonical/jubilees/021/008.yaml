  text: 'the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails, and all the fat that is on the inward parts, and the two kidneys, and all'
translation:
  language: fr
  text: 'le Seigneur. Tu mettras sur le feu qui est sur l’autel la graisse du sacrifice de délivrance : la graisse qui couvre les entrailles, toute la graisse qui se trouve à l’intérieur, les deux reins et toute[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset se termine au milieu de la phrase; celle-ci se poursuit au verset 9.
    reason: La segmentation du chapitre coupe après ወኵሎ, « et tout/toute », dont le complément apparaît dans la suite.
lexical_decisions:
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: sacrifice de délivrance
  rationale: Rend directement l’expression guèze désignant un sacrifice associé au salut ou à la délivrance, sans l’assimiler d’office à une catégorie sacrificielle confessionnelle plus précise.
- source_word: ስብሐ
  choice: graisse
  rationale: Terme rituel concret répété dans le passage; la répétition est conservée.
- source_word: ከርሥ
  choice: entrailles
  rationale: Désigne les organes internes ou viscères; « entrailles » convient au contexte sacrificiel.
- source_word: ክሊአ፡ ኵልያት
  choice: les deux reins
  rationale: Reproduit explicitement le nombre deux et le nom anatomique.
- source_word: ወኵሎ
  choice: et toute
  rationale: Le mot signifie « tout / toute » et ouvre ici une expression interrompue par la délimitation du verset; il ne signifie pas « tous les deux ».
theological_decisions:
- issue: Nature du sacrifice désigné par መሥዋዕተ፡ መድኃኒት
  choice: sacrifice de délivrance
  alternative: sacrifice de salut / sacrifice de paix
  rationale: « Délivrance » maintient la valeur sotériologique large de መድኃኒት sans identifier silencieusement ce sacrifice à une catégorie technique particulière.
- issue: Phrase inachevée à la fin du segment
  choice: conserver « et toute »
  alternative: compléter par « tous les deux » ou reformuler pour fermer la phrase
  rationale: Le guèze porte bien « et tout/toute »; la suite syntaxique appartient au verset suivant selon cette segmentation. La tension textuelle ne doit pas être artificiellement résolue.
translation_notes:
  register: Français moderne, clair et digne, avec conservation de la répétition rituelle. Le début du verset reprend une phrase commencée auparavant, et la fin demeure volontairement suspendue conformément à la source et à la segmentation fournie.
