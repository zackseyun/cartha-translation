  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
translation:
  language: fr
  text: Tu enlèveras la graisse qui les recouvre, celle qui est sur les entrailles, ainsi que le foie avec les rognons. Puis tu offriras tout cela, avec son offrande, en parfum agréable, bien accueilli devant le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናቅፅ
  choice: entrailles
  rationale: Le terme désigne les parties internes, notamment les intestins; « entrailles » convient au contexte sacrificiel.
- source_word: ኵልያት
  choice: rognons
  rationale: Dans le registre sacrificiel français, « rognons » rend naturellement les reins de l’animal.
- source_word: ለመዐዛ፡ ሠናይ፡ ዘይሠጠው
  choice: comme un parfum agréable et bien accueilli
  rationale: Cette formulation conserve à la fois l’idée de bonne odeur et celle d’accueil favorable exprimées par la source.
- source_word: መሥዋዕቱ
  choice: son offrande de grain
  rationale: Le contexte et la tradition textuelle comprennent ici une offrande accompagnant le sacrifice; « offrande de grain » précise naturellement sa nature sans employer l’ancien terme « oblation ».
theological_decisions:
- issue: Portée de l’acceptation devant Dieu
  choice: bien accueilli devant le Seigneur
  alternative: agréé par le Seigneur
  rationale: La formulation retenue préserve la distinction entre le parfum agréable et son accueil favorable devant Dieu, sans surinterpréter le mécanisme sacrificiel.
translation_notes:
  register: Français moderne, digne et accessible. Syntaxe impérative naturelle; vocabulaire sacrificiel courant, avec « rognons » plutôt que « reins » pour éviter une lecture anatomique humaine.
