revisions:
- from: Tu enlèveras la graisse qui les recouvre, celle qui est sur les entrailles, ainsi que le foie avec les rognons. Puis tu offriras tout cela avec son offrande de grain, comme un parfum agréable et bien accueilli devant le Seigneur.
  to: Tu enlèveras la graisse qui les recouvre, celle qui est sur les entrailles, ainsi que le foie avec les rognons. Puis tu offriras tout cela, avec son offrande, en parfum agréable, bien accueilli devant le Seigneur.
