  text: the blood of wild animals and of cattle and of every bird that flies in the sky. And if you slaughter a sacrifice as an acceptable peace offering, slaughter it and pour out its blood on the altar; and all the fat of your offering you shall offer up on the altar, together with fine flour mixed with oil; and with its drink offering you shall offer it all together on the altar as an offering of a pleasing fragrance before
translation:
  language: fr
  text: Quant au sang des animaux sauvages, du bétail et de tout oiseau qui vole dans le ciel. Si tu immoles un sacrifice de paix[a] agréé, immole-le et répands son sang sur l’autel. Tu feras monter sur l’autel toute la graisse de ton offrande, avec de la fleur de farine pétrie à l’huile et avec sa libation. Tu offriras le tout ensemble sur l’autel comme une offrande au parfum agréable devant…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de communion ».
    reason: Cette expression cultuelle peut être rendue par « sacrifice de paix » ou, selon la terminologie française adoptée, par « sacrifice de communion ».
lexical_decisions:
- source_word: አርዌ፡ ወዘእንስሳ
  choice: animaux sauvages, du bétail
  rationale: Distingue les bêtes sauvages du bétail domestique, conformément aux deux catégories du texte guèze.
- source_word: ጽንሓሐ፡ ሰላም
  choice: sacrifice de paix
  rationale: Rend directement la terminologie sacrificielle liée à la paix ou au bien-être, tout en signalant en note l’équivalent français « sacrifice de communion ».
- source_word: ዘይሰጠው
  choice: agréé
  rationale: Exprime l’idée de ce qui est accepté ou agréé, sans introduire à tort la notion d’action de grâce.
- source_word: ጽንሑክ
  choice: ton offrande
  rationale: Conserve le suffixe possessif de deuxième personne du singulier présent dans le guèze.
- source_word: ታዐርግ
  choice: tu feras monter / tu offriras
  rationale: Le verbe évoque ce que l’on fait monter sur l’autel; la seconde occurrence est rendue idiomatiquement par « offriras » pour éviter une répétition lourde.
- source_word: ሞ፟ጻሕቱ
  choice: sa libation
  rationale: Désigne l’offrande liquide accompagnant le sacrifice.
- source_word: መዐዛ፡ ሠናይ
  choice: parfum agréable
  rationale: Formule cultuelle naturelle en français pour une odeur tenue pour plaisante ou favorable.
theological_decisions:
- issue: Nature de l’offrande de paix
  choice: sacrifice de paix agréé
  alternative: sacrifice d’action de grâce
  rationale: Le texte associe explicitement le sacrifice à la paix et le qualifie d’agréé; il ne contient pas le terme propre à l’action de grâce.
- issue: Expression de l’élévation sur l’autel
  choice: tu feras monter sur l’autel
  alternative: tu feras fumer sur l’autel
  rationale: « Faire monter » préserve l’image verbale du guèze sans préciser au-delà du texte le procédé rituel, tandis que « faire fumer » serait plus interprétatif.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement singulier conforme à l’adresse du texte. La syntaxe conserve le caractère prescriptif du passage. Les points de suspension finaux signalent que la phrase du témoin fourni s’interrompt après « devant » et se poursuit dans le contexte suivant.
