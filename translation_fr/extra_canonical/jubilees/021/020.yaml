base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/020.yaml
  text: And do not accept a bribe or a present for human blood; blood for blood is to be rendered before the Lord, the Most High God. And it will be a good protection for you, so that you may be kept from every evil and so that he may save you from every death. For I see, my son, all the works of the children of men, that all their sin and evil and all their deeds are uncleanness and abomination and defilement, and there is no righteousness with them. Take care not to walk in their ways and not to tread in their paths, and do not sin a sin leading to death before the Most High God, lest he hide his face from you and give you into the hand of your enemies and root you out from the earth, and your seed from under heaven, and destroy your name and your seed from all the earth. Turn away from all their deeds and from all their uncleanness, and keep the charge of the Most High God, and do his will and be upright in everything. And he will bless you in all your deeds, and he will raise up from
    you a plant of righteousness in all the earth throughout all generations of the earth. And my name and your name will not be forgotten under heaven forever. Go, my son, in peace. May the Most High God, my God and your God, strengthen you to do his will; and may he bless all your seed and the remnant of your seed for everlasting generations with every righteous blessing, so that you may become a blessing on all the earth.” And he went out from before him rejoicing.
translation:
  language: fr
  text: 'N’accepte ni pot-de-vin ni présent au sujet du sang d’un être humain : sang pour sang doit être rendu devant le Seigneur, le Dieu Très-Haut. Cela sera pour toi une bonne protection, afin que tu sois préservé de tout mal et qu’il te sauve de toute mort. Car je vois, mon fils, toutes les œuvres des humains : tout leur péché et leur mal, et toutes leurs actions, ne sont qu’impureté, abomination et souillure ; il n’y a aucune justice parmi eux. Garde-toi de suivre leurs voies et de marcher dans leurs sentiers. Ne commets pas, devant le Dieu Très-Haut, un péché qui mène à la mort, de peur qu’il ne détourne de toi son visage, ne te livre aux mains de tes ennemis[a], ne t’arrache de la terre, ni ta descendance de dessous le ciel, et ne fasse disparaître ton nom et ta descendance de toute la terre. Sépare-toi de toutes leurs actions et de toutes leurs impuretés. Observe les exigences du Dieu Très-Haut, fais sa volonté et conduis-toi avec droiture en toutes choses. Il te bénira dans toutes
    tes actions et fera surgir de toi une plante de justice sur toute la terre, au fil de toutes les générations de la terre. Mon nom et le tien ne tomberont jamais dans l’oubli sous le ciel. Va en paix, mon fils. Que le Dieu Très-Haut, mon Dieu et ton Dieu, te fortifie pour accomplir sa volonté ! Qu’il bénisse toute ta descendance et le reste de ta descendance, de génération en génération pour toujours, par toute bénédiction juste, afin que tu deviennes une bénédiction sur toute la terre. » Puis il sortit de devant lui dans la joie.'
  philosophy: optimal-equivalence
  footnotes:
