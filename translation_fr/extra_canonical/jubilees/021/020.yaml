  - severity: medium
    issue: « sang pour sang doit être offert »
    rationale: « Offert » incline vers une offrande rituelle. Le texte prescrit que le sang soit rendu pour le sang devant Dieu, sans résoudre explicitement la question du cadre judiciaire ou cultuel.
  - severity: low
    issue: « Observe ce que le Dieu Très-Haut t’a confié »
    rationale: Le pronom et le passé composé ajoutent l’idée d’une remise personnelle au fils. Le source demande de garder la charge/exigence du Dieu Très-Haut.
