    reason: textual_variant
lexical_decisions:
- source_word: ሕልያነ፡ ወአምኃ
  choice: pot-de-vin ni présent
  rationale: Les deux noms désignent respectivement un don corrupteur et un présent; la coordination négative française rend naturellement l’interdiction.
- source_word: ደመ፡ በደም
  choice: sang pour sang
  rationale: Conserve la formule distributive et sa force judiciaire sans préciser au-delà du texte le mécanisme exact de rétribution.
- source_word: ዑቃቤሁ፡ ሠናይ
  choice: une bonne protection
  rationale: ዑቃቤ exprime la garde, la préservation ou la protection, et non un mémorial.
- source_word: ኵሉ፡ ግብረ፡ አጓለ፡ እመሕያው
  choice: toutes les œuvres des humains
  rationale: Formulation moderne et inclusive pour l’expression traditionnelle « enfants des hommes », tout en conservant le sens collectif.
- source_word: ኃጢአት፡ ... ለሞት
  choice: un péché qui mène à la mort
  rationale: Préserve le rapport littéral entre péché et mort sans imposer une catégorie doctrinale ultérieure.
- source_word: ተክለ፡ ጽድቅ
  choice: une plante de justice
  rationale: Maintient l’image végétale du texte, potentiellement chargée d’une portée dynastique ou eschatologique, sans l’expliciter.
- source_word: ኢይትረመም
  choice: ne tomberont jamais dans l’oubli
  rationale: Rend idiomatiquement l’idée de ne pas être oublié, avec la durée exprimée par la suite de la phrase.
theological_decisions:
- issue: Sens de « sang pour sang »
  choice: Conserver la formule concise « sang pour sang doit être offert »
  alternative: Expliciter comme peine capitale ou expiation cultuelle
  rationale: Le passage exige une restitution devant Dieu, mais la formulation transmise ne tranche pas clairement entre cadre judiciaire, sacrificiel ou les deux.
- issue: Le péché menant à la mort
  choice: Traduction descriptive, sans majuscule ni terme technique
  alternative: Employer une catégorie doctrinale comme « péché mortel »
  rationale: La traduction garde la gravité théologique de l’expression sans importer une classification confessionnelle.
- issue: La plante de justice
  choice: Préserver la métaphore
  alternative: Interpréter directement comme une lignée juste ou un descendant messianique
  rationale: La métaphore peut viser une descendance juste et recevoir une portée plus large; le texte ne justifie pas de résoudre cette tension.
- issue: « Observer la garde » de Dieu
  choice: « Observe ce que le Dieu Très-Haut t’a confié »
  alternative: « Observe les commandements »
  rationale: Cette formulation restitue l’idée de charge ou dépôt à garder sans réduire explicitement le référent à un corpus légal déterminé.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions rhétoriques, les avertissements solennels et les métaphores majeures sont conservés, tandis que la syntaxe est légèrement allégée pour une lecture naturelle. Le marqueur [a] figure dans le texte principal.
