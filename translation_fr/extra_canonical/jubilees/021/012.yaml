base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/012.yaml
  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
translation:
  language: fr
  text: 'tes offrandes devant le Seigneur. Veille aussi au bois destiné au sacrifice : n’apporte pour l’autel que les essences suivantes[a] : cyprès, sapin, amandier, pin, pin résineux, cèdre, genévrier, clématite, olivier, myrte, laurier et cèdre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs essences est incertaine; le texte énumère douze noms et mentionne le cèdre deux fois.
    reason: Les anciens noms botaniques ne peuvent pas tous être identifiés avec certitude, et la répétition de « cèdre » pourrait surprendre le lecteur.
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: tes offrandes
  rationale: Le nom désigne ici ce qui est offert en sacrifice; le suffixe de deuxième personne est rendu par « tes ».
- source_word: ዕፀወ፡ መሥዋዕት
  choice: le bois destiné au sacrifice
  rationale: Rend naturellement la relation entre « bois » et « sacrifice/offrande » sans confondre ce dernier avec l’autel.
- source_word: ምሥዋዕ
  choice: l’autel
  rationale: Ce terme apparenté mais distinct de መሥዋዕት désigne ici le lieu du sacrifice, donc l’autel.
- source_word: ዲበ፡ ዝንቱ
  choice: que les essences suivantes
  rationale: Dans le contexte de l’injonction, l’expression introduit les bois autorisés; cette formulation française évite le contresens qui ferait de la liste une série de bois interdits.
- source_word: ቍጲርሳን፡ … ወቄዳር
  choice: cyprès, sapin, amandier, pin, pin résineux, cèdre, genévrier, clématite, olivier, myrte, laurier et cèdre
  rationale: Suit les identifications botaniques retenues par l’édition et la couche de consultation auditée, tout en conservant la répétition finale de « cèdre » présente dans la tradition source.
theological_decisions:
- issue: Portée de l’interdiction concernant le bois de l’autel
  choice: 'La liste indique les essences permises : « n’apporte … que »'
  alternative: Comprendre la liste comme les essences interdites
  rationale: La construction contextuelle et la révision fondée sur le guèze indiquent une restriction aux bois énumérés, plutôt qu’une interdiction de ces mêmes bois.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif singulier et la continuité syntaxique avec le verset précédent sont conservés. « Essences » évite l’ambiguïté de « bois » devant une liste d’arbres, tandis que la note signale l’incertitude botanique réelle.
