  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: fr
  text: Et Isaac bénit le Dieu de son père Abraham, qui n’avait pas retiré sa miséricorde et sa justice au fils de son serviteur Isaac.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: bénit
  rationale: Rend directement le verbe guèze exprimant l’action de bénir.
- source_word: ምሕረተ
  choice: miséricorde
  rationale: Conserve la portée religieuse et relationnelle du terme, plutôt qu’un simple « bonté ».
- source_word: ጽድቀ
  choice: justice
  rationale: Préserve le sens théologique large du terme, qui peut aussi évoquer la droiture ou la fidélité juste.
- source_word: አኀደገ
  choice: avait retiré
  rationale: Dans la construction négative, exprime l’idée de ne pas ôter ou refuser quelque chose à quelqu’un.
- source_word: እምወልደ፡ ገብሩ፡ ይስሐቅ
  choice: au fils de son serviteur Isaac
  rationale: Suit la relation génitivale du texte source, même si la désignation d’Isaac à la troisième personne après qu’il a été nommé comme sujet produit une tension narrative authentique.
theological_decisions:
- issue: Rapport entre la miséricorde et la justice divines
  choice: « sa miséricorde et sa justice »
  alternative: « son amour fidèle et sa droiture »
  rationale: La formulation retenue garde les deux notions distinctes et leur tension théologique sans les fondre dans une paraphrase interprétative.
- issue: Référence à Isaac comme « fils de son serviteur »
  choice: Conserver littéralement Isaac comme fils du serviteur de Dieu
  alternative: Reformuler pour identifier explicitement Abraham comme le serviteur
  rationale: Le texte guèze nomme Isaac dans cette expression; l’explicitation d’Abraham corrigerait ou interpréterait silencieusement le texte transmis.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe reste proche du texte source et conserve l’étrangeté de la référence finale à Isaac plutôt que de la résoudre conjecturalement.
