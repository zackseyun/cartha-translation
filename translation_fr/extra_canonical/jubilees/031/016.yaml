  yaml_path: translation/extra_canonical/jubilees/031/016.yaml
  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
translation:
  language: fr
  text: Dieu mettra dans leur bouche de quoi bénir toute la descendance du bien-aimé.[a] Quant à toi, ta mère t’a donné le nom de Lévi, et c’est en vérité qu’elle t’a donné ce nom. Tu seras attaché au Seigneur et tu seras le compagnon de tous les fils de Jacob. Que sa table soit à toi ; toi et tes fils, vous en mangerez. Et ta table sera pleine pour toutes les générations,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de celui qui est aimé ».
    reason: Le guèze emploie une désignation substantivée dont le référent n’est pas explicité dans ce verset.
lexical_decisions:
- source_word: ይትወሀብ፡ ውስተ፡ አፉሆሙ
  choice: mettra dans leur bouche
  rationale: Rend naturellement l’expression guèze tout en conservant l’image concrète de paroles données par Dieu.
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: toute la descendance du bien-aimé
  rationale: « Descendance » rend ዘርእ sans limiter le sens aux seules semences physiques ; le substantif « bien-aimé » maintient la formulation relationnelle du texte.
- source_word: ኪያከ
  choice: Quant à toi
  rationale: Reproduit la mise en relief du pronom indépendant sans lui attribuer à tort une valeur causale.
- source_word: እምከ፡ ስመከ፡ ሌዊን፡ ወበአማን፡ ጸውዑት፡ ስመከ
  choice: ta mère t’a donné le nom de Lévi, et c’est en vérité qu’elle t’a donné ce nom
  rationale: Conserve explicitement « ta mère », la répétition de l’acte de nommer et la valeur adverbiale de በአማን.
- source_word: አጸቶ፡ ለእግዚአብሔር
  choice: attaché au Seigneur
  rationale: Exprime l’union ou l’attachement annoncé, tout en laissant perceptible le jeu implicite avec le nom Lévi.
- source_word: ሱታፌ
  choice: compagnon
  rationale: Rend l’idée de participation et d’association sans préciser davantage la nature de ce lien.
- source_word: ማእዳ፡ ለከ፡ ትኩን
  choice: Que sa table soit à toi
  rationale: Garde la tournure optative et l’image de la table appartenant désormais au destinataire.
- source_word: ትምላእ
  choice: sera abondamment garnie
  rationale: Dans le contexte d’une table, cette formulation française exprime plus naturellement l’idée qu’elle sera pleine.
theological_decisions:
- issue: Portée de « bien-aimé »
  choice: le bien-aimé
  alternative: l’aimé / celui qui est aimé
  rationale: La traduction conserve le titre ou qualificatif sans identifier explicitement son référent ni lui imposer une interprétation confessionnelle.
- issue: Lien de Lévi avec le Seigneur
  choice: attaché au Seigneur
  alternative: uni au Seigneur
  rationale: « Attaché » préserve à la fois le lien étroit et l’éventuel jeu étymologique avec Lévi, sans définir ce lien comme une union d’ordre particulier.
- issue: Nature de l’association avec les fils de Jacob
  choice: compagnon
  alternative: participant / associé
  rationale: Le choix garde ouverte la nature exacte de la participation annoncée.
translation_notes:
  register: Français international actuel, digne et lisible. La répétition concernant l’attribution du nom est volontairement conservée, car elle appartient à la rhétorique du texte source. La virgule finale signale que la phrase se poursuit dans le verset suivant selon la présentation fournie.
