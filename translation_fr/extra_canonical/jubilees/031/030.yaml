  text: And may he prosper all that you do, all for which you have prayed in prayer.” And he said to Rebekah, “Go with Jacob your son.” And Rebekah went with Jacob her son, and Deborah with her, and they came to
translation:
  language: fr
  text: 'Qu’il fasse réussir tout ce que tu feras, tout ce pour quoi tu as prié. » Puis il dit à Rébecca : « Va avec Jacob, ton fils. » Rébecca partit avec Jacob, son fils, accompagnée de Déborah, et ils arrivèrent à…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይሥመር
  choice: Qu’il fasse réussir
  rationale: Le verbe exprime l’idée de faire prospérer ou réussir; cette formulation française conserve la valeur de souhait portée par le contexte.
- source_word: ዘገብረ፡ ኵሎ
  choice: tout ce que tu entreprendras
  rationale: Littéralement « tout ce que tu fais/feras »; « entreprendras » est naturel en français dans une bénédiction portant sur les actions à venir.
- source_word: ለዘጸለይከ፡ ጸሎተ
  choice: tout ce pour quoi tu as prié
  rationale: La construction répète en guèze le verbe et le nom de la prière. Le français évite la lourdeur « prié en prière » sans introduire l’idée absente de vœu.
- source_word: ወአድኪ
  choice: ton fils
  rationale: La forme transmise semble être une erreur graphique/OCR pour ወልድኪ, comme le confirment le contexte et la révision textuelle fournie.
- source_word: ወዲቦራ፡ ምስሌሃ
  choice: accompagnée de Déborah
  rationale: Rend naturellement « et Déborah avec elle » tout en maintenant que Déborah accompagne Rébecca.
theological_decisions:
- issue: Agent implicite de la réussite
  choice: Conserver « il » sans expliciter son identité
  alternative: Dire explicitement « Dieu »
  rationale: Le sujet masculin est implicite ou contextuel dans le passage; le nommer « Dieu » résoudrait une référence que ce verset ne formule pas lui-même.
- issue: Nature de l’acte cultuel
  choice: Traduire par la prière
  alternative: Traduire par un vœu
  rationale: Le lexème source relève de la prière et ne justifie pas l’importation de la notion distincte de vœu.
translation_notes:
  register: Français international moderne, digne et fluide. La répétition idiomatiquement lourde du guèze autour de « prier/prière » est allégée sans perte de sens. La fin demeure volontairement suspendue, puisque l’extrait source s’arrête après « ils arrivèrent à ».
