  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
translation:
  language: fr
  text: et la sainteté. Qu’il les rende grands à travers tous les âges. Ils seront princes, juges et chefs pour toute la descendance des fils de Jacob. Ils proclameront la parole du Seigneur avec justice et rendront tous ses jugements avec justice. Ils feront connaître ses voies à Jacob et ses sentiers à Israël[a]. La bénédiction du Seigneur sera dans leur bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression rendue par « ses sentiers à Israël » est textuellement difficile. On peut aussi y comprendre un sens plus fort, comme « ses ordonnances » ou « sa discipline pour Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለቅዱስ
  choice: et la sainteté
  rationale: Le texte transmis commence au milieu d’une phrase; la formulation nominale et la continuité avec le contexte précédent sont conservées sans compléter ce qui manque.
- source_word: ውስተ፡ ኵሉ፡ ዓለማት
  choice: à travers tous les âges
  rationale: Rend l’expression temporelle au pluriel dans un français naturel, sans la réduire au seul monde spatial.
- source_word: መኳንንተ፡ ወመሳፍንተ፡ ወመላእክተ
  choice: chefs, juges et princes
  rationale: Conserve la série de trois fonctions dirigeantes tout en employant des termes français actuels et dignes; le troisième terme peut désigner des chefs ou des princes selon le contexte.
- source_word: ቃሎ፡ ለእግዚአብሔር
  choice: la parole du Seigneur
  rationale: Traduction directe de l’expression possessive, conforme au registre biblique français.
- source_word: በጽድቅ
  choice: avec justice
  rationale: Exprime ici la manière droite et juste de parler et de juger; la répétition de la source est maintenue.
- source_word: ፍኖቶ፡ ለያዕቆብ፡ ወአስርኖ፡ ለእስራኤል
  choice: ses voies à Jacob et ses sentiers à Israël
  rationale: Préserve le parallélisme de la formulation reçue tout en signalant en note la difficulté lexicale du second membre.
- source_word: በረከተ፡ ለእግዚአብሔር
  choice: La bénédiction du Seigneur
  rationale: Suit la construction nominale de la source sans ajouter l’idée qu’elle serait « donnée ».
theological_decisions:
- issue: Référent des pronoms dans « ses jugements », « ses voies » et « ses sentiers »
  choice: Référer les possessifs au Seigneur
  alternative: Les rattacher au groupe sacerdotal qui parle et juge
  rationale: Le Seigneur est l’antécédent théologique et grammatical le plus naturel après « la parole du Seigneur », mais la traduction ne développe pas davantage cette relation.
- issue: Nature des fonctions attribuées à la descendance
  choice: Conserver trois fonctions générales de gouvernement
  alternative: Employer des titres ecclésiastiques ou angéliques spécialisés
  rationale: Le passage présente une série de dignités sans imposer ici une structure confessionnelle précise; des termes généraux évitent d’importer une doctrine particulière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le fragment initial est volontairement conservé comme continuation de la phrase précédente. Les répétitions de « avec justice » et la structure parallèle sont maintenues pour refléter la rhétorique de la source.
