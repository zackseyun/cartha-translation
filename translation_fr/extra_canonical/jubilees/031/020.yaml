base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
translation:
  language: fr
  text: et en toi se trouvera le salut d’Israël. Et le jour où tu siégeras sur le trône de la gloire de ta justice[a], il y aura une grande paix pour toute la descendance des fils du bien-aimé. Béni soit celui qui te bénit ! Tous ceux qui te haïssent et te font souffrir, ainsi que ceux qui te maudissent, seront déracinés et anéantis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « sur le trône glorieux de ta justice ».'
    reason: La construction guèze qui associe le trône, la gloire et la justice est compacte et permet cette autre formulation.
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: le salut d’Israël
  rationale: Rend directement le substantif « salut/délivrance » et son complément.
- source_word: ትነብር፡ ውስተ፡ መንበረ
  choice: tu siégeras sur le trône
  rationale: Dans un contexte royal, « siéger » exprime naturellement le fait de s’asseoir ou de demeurer sur un trône.
- source_word: ክብር፡ ጽድቅከ
  choice: la gloire de ta justice
  rationale: Conserve la chaîne nominale dense de la source sans réduire ክብር à un simple adjectif.
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: toute la descendance des fils du bien-aimé
  rationale: Préserve les éléments « descendance », « fils » et « bien-aimé », conformément à la lecture du guèze et sans introduire « pour toujours ».
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: seront déracinés et anéantis
  rationale: Reproduit les deux images successives de suppression complète.
theological_decisions:
- issue: Rapport entre gloire, trône et justice
  choice: sur le trône de la gloire de ta justice
  alternative: sur le trône glorieux de ta justice
  rationale: La formulation retenue maintient la densité et l’ambiguïté de la construction nominale au lieu de faire de « gloire » un adjectif.
- issue: Identification du « bien-aimé »
  choice: du bien-aimé
  alternative: de ses fils pour toujours
  rationale: Le texte transmis soutient « bien-aimé »; aucune identité précise n’est ajoutée et la correction « pour toujours » n’est pas retenue.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur convient au cadre prophétique de la bénédiction. « Siéger » garde la nuance royale, tandis que « te font souffrir » exprime clairement l’affliction sans archaïsme.
