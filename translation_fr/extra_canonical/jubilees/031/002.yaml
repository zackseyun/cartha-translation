  text: the foreign gods that are among you.' And they gave him the foreign gods, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and destroyed them, and hid them under the oak that was in the land of Shechem.
translation:
  language: fr
  text: « les dieux étrangers qui sont parmi vous. » Ils lui donnèrent les dieux étrangers, ainsi que ce qu’ils portaient aux oreilles et autour du cou, et les idoles que Rachel avait volées à Laban, son frère.[a] Elle donna tout à Jacob, qui les brûla, les broya, les détruisit et les cacha sous le chêne[b] qui se trouvait dans le territoire de Sichem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze porte « son frère »; d’après le récit biblique, Laban était le père de Rachel.
    reason: textual_difficulty
  - marker: b
    text: Le nom de l’arbre peut aussi être rendu par « térébinthe »; l’espèce exacte désignée par le terme guèze est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማእከሌክሙ
  choice: parmi vous
  rationale: Le suffixe est à la deuxième personne du pluriel; le début du verset achève donc la parole de Jacob commencée au verset précédent.
- source_word: ወዘውስተ፡ እዘኒሆሙ፡ ወዘውስተ፡ ክሳውዲሆሙ
  choice: ce qu’ils portaient aux oreilles et autour du cou
  rationale: Cette formulation naturelle conserve les deux emplacements corporels sans préciser indûment la nature exacte des bijoux ou objets.
- source_word: ድርዋስ
  choice: chêne
  rationale: « Chêne » est une équivalence traditionnelle plausible, mais l’espèce exacte demeure incertaine et est signalée en note.
- source_word: ምድረ፡ ሰቂሞን
  choice: territoire de Sichem
  rationale: Rend l’idée géographique de « terre/pays de Sichem » dans un français courant, sans identifier Sichem uniquement à la ville.
theological_decisions:
- issue: Lien de parenté entre Rachel et Laban
  choice: son frère
  alternative: son père
  rationale: Bien que Laban soit ailleurs présenté comme le père de Rachel, le texte guèze fourni porte explicitement « son frère ». La traduction conserve cette difficulté textuelle au lieu de la corriger silencieusement.
- issue: Suite des actions de Jacob contre les objets cultuels
  choice: les brûla, les broya, les détruisit et les cacha
  alternative: les brûla, les broya et les cacha
  rationale: Les quatre verbes du texte source sont conservés, y compris « les détruisit », absent de certaines versions antérieures.
translation_notes:
  register: Français moderne, digne et lisible. Les parallélismes verbaux sont maintenus, tandis que les expressions relatives aux oreilles et au cou sont légèrement explicitées pour être idiomatiques. Le guillemet initial signale que le verset commence par la fin d’une parole entamée au verset précédent.
