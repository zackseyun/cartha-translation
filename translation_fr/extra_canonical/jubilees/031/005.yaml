  text: and let me see him before I die.” And Jacob went to his father Isaac and to his mother Rebekah, to the house of his father Abraham. And he took with him two of his sons, Levi and Judah.
translation:
  language: fr
  text: « et que je le voie avant de mourir. » Jacob se rendit auprès de son père Isaac et de sa mère Rébecca, dans la maison de son père Abraham. Il emmena avec lui deux de ses fils, Lévi et Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእርአዮ
  choice: et que je le voie
  rationale: Rend la forme verbale à la première personne dans la continuité d’un souhait ou d’une demande commencé au verset précédent.
- source_word: ዘእንበለ እሙት
  choice: avant de mourir
  rationale: Expression française naturelle correspondant au sens temporel « avant que je meure ».
- source_word: ሖረ
  choice: se rendit
  rationale: Traduit le mouvement vers les personnes nommées avec un registre narratif digne et courant.
- source_word: ውስተ ቤቱ ለአቡሁ አብርሃም
  choice: dans la maison de son père Abraham
  rationale: Conserve littéralement la désignation d’Abraham comme « son père », sans la remplacer par « grand-père » ni résoudre la relation généalogique.
- source_word: ነሥአ ምስሌሁ
  choice: emmena avec lui
  rationale: Dans ce contexte de déplacement accompagné, cette formulation rend naturellement l’idée de prendre des personnes avec soi.
- source_word: ክልኤተ እምውሉዱ
  choice: deux de ses fils
  rationale: Préserve la construction partitive du texte source.
theological_decisions:
- issue: Abraham est appelé « père » de Jacob
  choice: son père Abraham
  alternative: son grand-père Abraham
  rationale: Le texte guèze emploie explicitement « père ». La traduction conserve cette formulation familiale ancienne et son éventuelle portée ancestrale, au lieu de la normaliser.
