    issue: L’appel à se lever n’est pas exprimé directement.
    rationale: Le guèze contient un cohortatif signifiant « levons-nous », suivi de la montée à Béthel. « Puis partons et montons » transmet le déplacement mais affaiblit cette première action.
  - severity: low
    issue: « Je l’ai prié » est légèrement imprécis en français.
    rationale: La source dit littéralement que Jacob a prié « à lui ». « Je lui ai adressé une prière » maintient le référent pronominal et rend explicitement l’acte de prier.
  - severity: low
    issue: « Les gens de sa maison » est moins précis et moins naturel que « les membres de sa maison ».
    rationale: Le syntagme désigne l’ensemble de la maisonnée; « membres de sa maison » le rend naturellement sans registre archaïque.
