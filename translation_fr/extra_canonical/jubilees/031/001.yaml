  text: And on the new moon of the month Jacob spoke to all the people of his house, saying, “Purify yourselves and change your garments, and let us rise and go up to Bethel, where I prayed to him in the day when I fled from the face of Esau my brother, and he was with me and brought me back into this land in peace. And put away
translation:
  language: fr
  text: 'À la nouvelle lune[a], Jacob dit à tous les membres de sa maison : « Purifiez-vous, changez de vêtements, levons-nous et montons à Béthel, où je lui ai adressé une prière le jour où j’ai fui devant Ésaü, mon frère. Il a été avec moi et m’a ramené en paix dans ce pays. Débarrassez-vous[b]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au lever du mois », c’est-à-dire à la nouvelle lune ou au premier jour du mois. Certains ont compris : « dans le premier mois ».'
    reason: La locution guèze désigne normalement la nouvelle lune, mais une ancienne interprétation divergente mérite d’être signalée.
  - marker: b
    text: La phrase se poursuit au verset suivant, qui précise ce dont ils doivent se débarrasser.
    reason: Le verset se termine au milieu de l’ordre donné par Jacob; les points de suspension signalent que son complément appartient au verset suivant.
lexical_decisions:
- source_word: በሠርቀ፡ ወርኅ፡
  choice: À la nouvelle lune du mois
  rationale: La locution désigne le commencement lunaire du mois, plutôt que « dans le premier mois ».
- source_word: ንጽሑ፡
  choice: Purifiez-vous
  rationale: L’impératif pluriel exprime une purification, probablement rituelle, sans la réduire à une simple propreté.
- source_word: ወወልጡ፡ አልባሲክሙ፡
  choice: changez de vêtements
  rationale: Rend directement l’impératif et son complément dans un français naturel.
- source_word: ንዕርግ፡ ቤቴል፡
  choice: montons à Béthel
  rationale: Conserve le mouvement ascendant exprimé par le verbe.
- source_word: ጐየይኩ፡ እምገጸ፡ ዔሳው፡ እኁየ፡
  choice: j’ai fui loin d’Ésaü, mon frère
  rationale: « Loin de » rend idiomatiquement la fuite hors de la présence ou de la face d’Ésaü.
- source_word: ወሜጠኒ፡
  choice: m’a ramené
  rationale: 'Le verbe indique un retour causé : il a fait revenir Jacob, et non simplement l’a amené.'
- source_word: ወአስስሉ፡
  choice: Débarrassez-vous
  rationale: Il s’agit d’un impératif pluriel qui poursuit les paroles de Jacob; son complément se trouve dans le verset suivant.
theological_decisions:
- issue: Référent du pronom dans « je l’ai prié »
  choice: Conserver le pronom « l’ »
  alternative: Expliciter « j’ai prié Dieu »
  rationale: Le texte source emploie un pronom; ne pas expliciter préserve sa forme et évite un ajout, même si le référent divin ressort du contexte.
- issue: Présence et retour accordés à Jacob
  choice: « Il a été avec moi et m’a ramené »
  alternative: Employer une formulation impersonnelle ou atténuée
  rationale: La formulation personnelle du texte attribue ces actions au même référent divin et doit être maintenue.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste ouvert sur le plan syntaxique, puisque le dernier impératif reçoit son complément dans le verset suivant. « Les gens de sa maison » inclut naturellement l’ensemble de la maisonnée sans coloration archaïque.
