lexical_decisions:
- source_word: ይትሀወኩ
  choice: seront ébranlés
  rationale: Le verbe exprime ici l’agitation ou le bouleversement. « Être ébranlé » conserve la force de l’image et la répétition du texte source.
- source_word: አሕዛብ
  choice: nations
  rationale: Ce terme désigne les nations ou peuples étrangers; « nations » convient au parallélisme avec ሕዝብ.
- source_word: ሕዝብ
  choice: peuples
  rationale: Le pluriel français naturel rend la portée collective de l’expression et maintient la distinction avec « nations ».
- source_word: ብከ
  choice: En toi
  rationale: La préposition peut exprimer « en toi » ou « par toi ». « En toi » préserve ici la formulation et l’ambiguïté instrumentale ou locative du texte.
- source_word: ረድኤተ
  choice: le secours
  rationale: « Secours » rend dignement l’idée d’aide ou d’assistance dans un contexte de bénédiction.
theological_decisions:
- issue: Rapport entre le destinataire et le secours de Jacob
  choice: En toi sera le secours de Jacob
  alternative: Par toi viendra le secours de Jacob
  rationale: La traduction retenue n’impose pas une lecture strictement instrumentale et conserve la tension de la préposition guèze ብከ.
