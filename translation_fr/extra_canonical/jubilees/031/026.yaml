  terminology: « prière », « Seigneur », « autel » et « sacrifice » sont justes et cohérents. La note conserve à bon droit « prière » dans le texte, conformément au lexique explicite du guèze, tout en signalant avec prudence l’interprétation contextuelle possible du vœu.
