  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
translation:
  language: fr
  text: Au matin, Jacob raconta à son père Isaac la prière qu’il avait adressée au Seigneur[a], la vision qu’il avait eue, comment il avait construit un autel et que tout était prêt pour que le sacrifice soit offert devant le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze emploie ici des mots liés à la prière. Toutefois, le contexte immédiat — Béthel, l’autel, le sacrifice et l’avertissement d’Isaac de ne pas tarder — peut indiquer qu’il s’agit du vœu de Jacob.
    reason: Signaler l’autre compréhension suggérée par le contexte sans remplacer le sens lexical explicite du guèze.
lexical_decisions:
- source_word: ጸሎተ፡ ዘጸለየ
  choice: la prière qu’il avait adressée
  rationale: Rend directement le nom et le verbe de la même famille liés à la prière, tout en évitant en français la répétition peu naturelle « la prière qu’il avait priée ».
- source_word: ወሬአየ፡ ዘርእየ
  choice: la vision qu’il avait eue
  rationale: Le texte associe un nom lié à la vision au verbe « voir »; cette formulation française restitue naturellement l’idée de ce que Jacob avait vu.
- source_word: ኀነጸ፡ ምሥዋዐ
  choice: avait construit un autel
  rationale: Correspond au verbe « construire/édifier » et au nom « autel ».
- source_word: ድልው
  choice: était prêt
  rationale: Exprime l’état de préparation de l’ensemble nécessaire au sacrifice.
- source_word: ለመሥዋዕት፡ ለገቢር
  choice: pour offrir le sacrifice
  rationale: Formulation française idiomatique qui conserve l’action de faire/accomplir le sacrifice.
theological_decisions:
- issue: La prière ou le vœu de Jacob
  choice: « la prière qu’il avait adressée au Seigneur » dans le texte
  alternative: « le vœu qu’il avait fait au Seigneur »
  rationale: Les termes guèzes conservés sont explicitement de la famille lexicale de la prière. Le contexte de Béthel, de l’autel et du sacrifice peut toutefois évoquer le vœu de Jacob; cette possibilité est donc signalée en note plutôt qu’introduite dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la succession narrative du guèze, mais emploie des tournures françaises naturelles. La conjonction finale isolée du texte fourni n’est pas traduite, puisqu’elle semble appartenir à la suite ou constituer un résidu textuel incomplet.
