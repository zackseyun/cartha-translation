  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les quatre éléments rapportés par Jacob : la prière adressée au Seigneur, la vision vue, la construction de l’autel et la préparation du sacrifice. La formulation finale actuelle (« tout était prêt pour offrir le sacrifice ») peut toutefois faire de Jacob le sujet implicite de « offrir », alors que le guèze présente la préparation en vue de l’accomplissement du sacrifice. Une tournure passive conserve mieux cette nuance.'
