  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
translation:
  language: fr
  text: 'Et cela lui fut compté comme justice[a]. Pendant la nuit, Jacob raconta tout à son père : comment le Seigneur lui avait témoigné une grande miséricorde, avait fait prospérer toutes ses voies et l’avait protégé de tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze imprimé fourni porte littéralement : « Et la justice passa vers lui. » La traduction suit vraisemblablement une leçon corrigée signifiant « fut compté », selon la formule biblique traditionnelle.'
    reason: Signaler sans la dissimuler la différence entre la leçon imprimée fournie et la correction textuelle retenue.
lexical_decisions:
- source_word: ጽድቀ
  choice: justice
  rationale: Conserve le terme biblique de la justice dans la formule traditionnelle « compté comme justice ».
- source_word: እግዚአ ብሔር
  choice: le Seigneur
  rationale: Rend le titre divin guèze de manière usuelle et fidèle, sans le généraliser en « Dieu ».
- source_word: ሣህለ፡ ዐቢየ
  choice: une grande miséricorde
  rationale: Exprime naturellement l’idée d’une faveur compatissante abondante tout en conservant le registre religieux du terme.
- source_word: ኵሎ፡ ፍኖቲሁ
  choice: tout ce qu’il entreprenait
  rationale: Rend idiomatiquement « toutes ses voies » dans ce contexte de réussite accordée par le Seigneur.
- source_word: እምኵሉ
  choice: de tout
  rationale: Préserve l’expression générale du texte sans ajouter « mal » ou « danger ».
theological_decisions:
- issue: Formule initiale et variante du texte guèze imprimé
  choice: Et cela lui fut compté comme justice
  alternative: Et la justice passa jusqu’à lui
  rationale: 'La leçon corrigée ተኈለቈ correspond à la formule biblique « fut compté comme justice ». Toutefois, l’édition fournie porte ተኀለፈ, « passa » : cette donnée textuelle réelle est signalée en note plutôt que supprimée.'
- issue: Agent de la réussite et de la protection
  choice: le Seigneur demeure le sujet des trois actions
  alternative: Jacob aurait lui-même fait réussir ses entreprises
  rationale: La continuité syntaxique et sémantique rattache naturellement la miséricorde, la réussite et la protection à l’action du Seigneur.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation évite le calque peu naturel « faire prospérer toutes ses voies », tout en conservant le caractère global de l’action divine et l’indétermination finale de « de tout ».
