  text: For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly your sons.”
translation:
  language: fr
  text: '« Car ils te ressemblent. » Jacob lui confirma qu’ils étaient bien ses fils. Isaac dit alors : « Maintenant, je vois qu’ils sont vraiment tes fils. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስሉከ
  choice: ils te ressemblent
  rationale: Rend directement le verbe « ressembler » et le pronom masculin singulier de deuxième personne.
- source_word: ውሉዱ
  choice: ses fils
  rationale: Dans ce contexte, le terme désigne les fils de Jacob présentés à Isaac. « Fils » conserve le lien de parenté exprimé par le texte sans le remplacer par « petits-fils ».
- source_word: በአማን / አማን
  choice: bien / vraiment
  rationale: Ces deux formulations françaises naturelles rendent l’insistance répétée sur la véracité ou la certitude.
theological_decisions:
- issue: Lien de parenté entre Jacob et les deux jeunes hommes
  choice: tes fils
  alternative: tes petits-fils
  rationale: Le texte guèze les identifie par rapport à Jacob comme ses fils. « Petits-fils » exprimerait leur lien avec Isaac, mais modifierait le point de vue grammatical et affaiblirait le raisonnement fondé sur leur ressemblance avec Jacob.
translation_notes:
  register: Français moderne, narratif et digne. Les noms de Jacob et d’Isaac remplacent ponctuellement des pronoms afin de rendre clairement les changements de locuteur sans alourdir le dialogue.
