  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
translation:
  language: fr
  text: 'Il avait prié afin qu’à son arrivée, il le fasse monter sur un âne.[a] Isaac dit à son fils Jacob : « Je ne peux pas venir avec toi, car je suis vieux et je ne peux pas supporter le voyage. Va en paix, mon fils, car j’ai aujourd’hui cent soixante-cinq ans. Je ne peux désormais plus voyager. Fais monter ta mère sur une bête de somme, puis pars. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il avait prié et, quand il serait arrivé, il le ferait monter sur un âne. »'
    reason: La relation syntaxique entre la prière, l’arrivée et l’action exprimée à l’imperfectif/subjonctif demeure ambiguë dans la formulation transmise.
lexical_decisions:
- source_word: ጸለየ
  choice: Il avait prié
  rationale: Le verbe signifie « prier » ; le plus-que-parfait français maintient le lien rétrospectif suggéré par le contexte transmis.
- source_word: ይጽዐኖ፡ ዲበ፡ አድግ
  choice: il le fasse monter sur un âne
  rationale: L’imperfectif/subjonctif est rendu dans une proposition de but, tandis que le pronom masculin de la source est conservé sans en préciser le référent.
- source_word: ተዐግሦ፡ በፍኖት
  choice: supporter le voyage
  rationale: Expression française naturelle qui conserve l’idée d’endurer les difficultés du trajet.
- source_word: ፻ወ፷ወ፭ዓመት
  choice: cent soixante-cinq ans
  rationale: Restitution directe du nombre éthiopien.
- source_word: ጻዐና፡ ለአምካ
  choice: Fais monter ta mère sur une bête de somme
  rationale: Le complément « ta mère » doit être explicitement conservé ; « bête de somme » rend naturellement la monture sous-entendue dans cette injonction.
- source_word: ወትሖር
  choice: puis pars
  rationale: La forme vise Jacob à la deuxième personne ; elle lui ordonne de partir, plutôt que de laisser partir sa mère seule.
