review_pass:
  verdict: revise
  source_fidelity: 'La séquence narrative et les référents sont correctement rendus : elle entend l’annonce de l’arrivée de Jacob, l’embrasse, reconnaît ses deux fils, puis les embrasse et les bénit. Toutefois, la préposition finale ብክሙ se rend plus directement par « en vous » que par « par vous », conformément à la formulation du texte et à l’audit anglais. Le verbe « dit » doit aussi être conservé plutôt que transformé en « demanda », même si la réplique est interrogative.'
  naturalness: 'Le français est naturel, moderne et d’un registre narratif approprié. « Elle entendit : » est une introduction de discours plus sobre et plus proche du texte que « Elle entendit dire ». « Lui dit » suivi d’une question est parfaitement idiomatique en français littéraire et narratif.'
  terminology: « Descendance d’Abraham », « sera honorée » et « une bénédiction » rendent adéquatement les termes généalogiques et bénédictionnels sans surcharge doctrinale. Le pluriel est à juste titre maintenu pour les deux fils. « En vous » préserve la portée volontairement concise de la formule source.
  issues:
  - severity: medium
    issue: La bénédiction finale est traduite « Par vous ».
    rationale: La préposition guèze ብክሙ, comme le relève aussi l’audit anglais (« In you »), s’exprime ici de manière plus immédiate par « en vous ». « Par vous » impose plus nettement une idée instrumentale qui n’est pas nécessaire.
  - severity: low
    issue: « Lui demanda » remplace « lui dit ».
    rationale: Le source emploie le verbe dire ; la forme interrogative de la citation ne requiert pas de changer le verbe narratif. « Lui dit » est fidèle et naturel.
  revised_text: 'Elle entendit : « Voici que Jacob, ton fils, est arrivé. » Elle l’embrassa. Puis elle vit ses deux fils, les reconnut et lui dit : « Ceux-ci sont-ils tes fils, mon fils ? » Elle les serra dans ses bras, les embrassa et les bénit en disant : « En vous, la descendance d’Abraham sera honorée, et vous deviendrez une bénédiction. »'
