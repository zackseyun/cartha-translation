  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: fr
  text: 'Elle entendit : « Voici que Jacob, ton fils, est arrivé. » Elle l’embrassa. Puis elle vit ses deux fils, les reconnut et lui dit : « Ceux-ci sont-ils tes fils, mon fils ? » Elle les serra dans ses bras, les embrassa et les bénit en disant : « En vous, la descendance d’Abraham sera honorée, et vous deviendrez une bénédiction. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰምዐት
  choice: Elle entendit dire
  rationale: Le verbe signifie « entendre » ; l’ajout idiomatique de « dire » introduit naturellement en français l’annonce citée qui suit, sans en préciser l’auteur.
- source_word: ዘርአ፡ አብርሃም
  choice: la descendance d’Abraham
  rationale: « Descendance » rend naturellement le collectif « semence » dans ce contexte généalogique.
- source_word: ይክበር
  choice: sera honorée
  rationale: Conserve le sens passif lié à l’honneur ou à la gloire, sans le remplacer par une formulation interprétative comme « deviendra grande ».
- source_word: ብክሙ
  choice: Par vous
  rationale: Le suffixe est pluriel et vise les deux fils ; « par vous » rend ici le moyen ou l’intermédiaire exprimé par la préposition.
- source_word: ለበረከት
  choice: une bénédiction
  rationale: Expression française directe et traditionnelle qui conserve la valeur nominale du texte source.
theological_decisions:
- issue: Portée de la bénédiction finale
  choice: « vous deviendrez une bénédiction » sans complément géographique
  alternative: « vous deviendrez une bénédiction sur la terre »
  rationale: Le texte guèze fourni ne comporte pas ici de complément équivalent à « sur la terre » ; celui-ci n’est donc pas ajouté.
- issue: Nombre des destinataires dans la bénédiction
  choice: 'Pluriel : « Par vous… vous deviendrez »'
  alternative: 'Singulier collectif : « En toi… tu deviendras »'
  rationale: Les formes guèzes pertinentes sont plurielles et renvoient aux deux fils que la femme vient d’embrasser et de bénir.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions du texte sont conservées lorsqu’elles structurent la scène, tandis que « Puis » clarifie sobrement l’enchaînement. Aucun nom non présent dans le verset n’est ajouté.
