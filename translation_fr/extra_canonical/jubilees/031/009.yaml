  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
translation:
  language: fr
  text: 'Il passa ses bras autour du cou de Jacob, son fils,[a] et pleura sur son cou. Le voile qui obscurcissait les yeux d’Isaac se dissipa ; il vit les deux fils de Jacob, Lévi et Juda, et dit : « Ceux-ci sont-ils tes fils, mon fils ? »'
