  text: And he went up on the new moon of the seventh month, to Bethel. And he built an altar in the place where he had lodged, and he set up there a pillar, and he sent to his father Isaac that he should come to him.
translation:
  language: fr
  text: À la nouvelle lune du septième mois[a], il monta à Béthel. Il bâtit un autel à l’endroit où il avait passé la nuit, y dressa une stèle et envoya dire à son père Isaac de venir auprès de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au début du septième mois » ou « le premier jour du septième mois ».
    reason: Le terme éthiopien peut désigner le lever de la nouvelle lune et, par extension, le commencement du mois.
lexical_decisions:
- source_word: ሠርቀ፡ ወርኅ፡ ሳብዕ (śarqa warḫ sābʿ)
  choice: à la nouvelle lune du septième mois
  rationale: La construction désigne le commencement, ou la nouvelle lune, du septième mois; aucun mot signifiant « année » ne figure dans le texte.
- source_word: ኖመ (noma)
  choice: avait passé la nuit
  rationale: Le verbe exprime le fait de dormir ou de séjourner pour la nuit; cette formulation est naturelle en français et convient au contexte.
- source_word: ሐውልተ (ḥawəlta)
  choice: une stèle
  rationale: Le terme désigne une pierre dressée ou un monument; « stèle » rend clairement cet objet cultuel sans l’assimiler à une colonne architecturale.
- source_word: ፈነወ፡ ኀበ፡ አቡሁ (fanawa ḫaba ʾabuhu)
  choice: fit dire à son père
  rationale: Littéralement, il « envoya vers son père »; en contexte, il lui transmet une demande, ce que cette tournure idiomatique exprime sans ajouter de messager explicite.
- source_word: ከመ፡ ይምጻእ፡ ኀቤሁ (kama yəmṣaʾ ḫabehu)
  choice: de venir le rejoindre
  rationale: Rend naturellement la proposition finale « afin qu’il vienne vers lui ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition locative littérale « à l’endroit où il avait passé la nuit là » est allégée conformément à l’usage naturel du français. Le sujet reste pronominal, comme dans la source et le contexte immédiat.
