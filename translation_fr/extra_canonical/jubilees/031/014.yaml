  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
translation:
  language: fr
  text: et tes enfants, à travers tous les âges. Que le Seigneur t’accorde, à toi et à ta descendance, une grande intelligence[a], pour la gloire. Qu’il vous fasse approcher de lui, toi et ta descendance, parmi tous les êtres de chair, afin d’accomplir le service dans son sanctuaire comme les anges de la Présence et comme les saints. Tels qu’ils sont, telle sera la descendance de tes enfants, pour la gloire et la grandeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande compréhension » ; littéralement, « grandeur du cœur ».
    reason: Le terme guèze désigne ici l’intelligence ou la compréhension, tout en étant formé sur le vocabulaire du cœur ; la note rend compte de cette possibilité littérale sans remplacer le sens contextuel principal.
lexical_decisions:
- source_word: ዐባየ፡ ልባዌ
  choice: une grande intelligence
  rationale: Le nom guèze ልባዌ désigne l’intelligence ou la compréhension, même s’il appartient à la famille lexicale du « cœur ». Cette traduction rend son sens propre sans perdre l’intensité de ዐባየ.
- source_word: ያቅርብ፡ ኀቤሁ
  choice: qu’il vous fasse approcher de lui
  rationale: La tournure causative exprime l’action divine qui introduit le destinataire et sa descendance dans la proximité de Dieu.
- source_word: ይትአለክ፡ ውስተ፡ መቅደሱ
  choice: afin d’exercer le service dans son sanctuaire
  rationale: Le contexte du sanctuaire appelle un vocabulaire cultuel; « exercer le service » reste naturel tout en évitant de réduire l’expression à un service profane.
- source_word: መላእክተ፡ ገጽ
  choice: les anges de la Présence
  rationale: Littéralement « anges de la Face »; « Présence » rend ici l’idée de ceux qui se tiennent devant Dieu et correspond à l’expression religieuse consacrée en français.
- source_word: ዘሥጋ
  choice: les êtres de chair
  rationale: La formule désigne l’ensemble des créatures humaines ou mortelles. « Êtres de chair » conserve l’image concrète du texte sans la limiter arbitrairement.
theological_decisions:
- issue: Nature de la proximité accordée par Dieu
  choice: qu’il vous fasse approcher de lui
  alternative: qu’il vous amène près de lui
  rationale: Cette formulation préserve à la fois l’initiative divine et la proximité cultuelle, sans préciser davantage le statut sacerdotal implicite.
- issue: Identification des « saints »
  choice: comme les saints
  alternative: comme les êtres saints
  rationale: Le texte ne précise pas explicitement s’il s’agit d’anges ou d’humains sanctifiés; la formulation retenue conserve cette ambiguïté.
- issue: Finalité exprimée par « pour la gloire »
  choice: pour la gloire
  alternative: pour leur gloire
  rationale: Le guèze ne fournit pas de possessif explicite. La traduction conserve donc la formulation ouverte plutôt que d’assigner la gloire à Dieu ou aux descendants.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme de la bénédiction et le registre cultuel sont conservés; les répétitions de « toi et ta descendance » reflètent la structure emphatique de la source.
