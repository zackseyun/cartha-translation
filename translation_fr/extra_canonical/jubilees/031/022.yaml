  text: He had seen the sons of Jacob his son truly. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night[22], and they ate and drank.
translation:
  language: fr
  text: Il avait véritablement vu les fils de Jacob, son fils. Puis il sortit d’entre ses pieds[a], tomba à terre et se prosterna devant lui. Il les bénit et passa cette nuit-là près d’Isaac, son père. Ils mangèrent et burent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression littérale « sortir d’entre ses pieds » est obscure. Elle semble indiquer qu’il s’éloigna de la présence immédiate d’Isaac avant de se prosterner.
    reason: segmentation_note
lexical_decisions:
- source_word: ውሉደ፡ ለያዕቆብ፡ ወልዱ፡
  choice: les fils de Jacob, son fils
  rationale: Conserve la relation exprimée par le texte guèze sans ajouter de noms ni réorganiser les référents pronominaux.
- source_word: ዘበጽድቅ
  choice: véritablement
  rationale: Dans cette construction, l’expression liée à « justice/vérité » fonctionne vraisemblablement comme un adverbe signifiant « réellement, en vérité »; « dans la justice » serait peu naturel et obscurcirait le sens en français.
- source_word: ወወድቀ፡ ወሰገደ፡ ሎቱ፡
  choice: tomba à terre et se prosterna devant lui
  rationale: Rend distinctement la chute au sol et le geste de prosternation, sans préciser indûment s’il s’agit d’adoration ou d’un hommage respectueux.
- source_word: ወአዕረፈ፡ ህየ፡ ቅሩበ፡ ይስሐቅ፡ አቡሁ፡ በይእቲ፡ ሌሊት፡
  choice: passa cette nuit-là près d’Isaac, son père
  rationale: « Passa cette nuit-là » exprime naturellement l’idée de demeurer ou se reposer sur place pendant la nuit, tout en conservant la proximité avec Isaac.
theological_decisions:
- issue: Valeur de ሰገደ dans ce contexte familial
  choice: se prosterna devant lui
  alternative: l’adora
  rationale: Le verbe peut désigner l’adoration ou une prosternation d’hommage. Le contexte ne justifie pas d’imposer une lecture cultuelle.
- issue: Sens de ዘበጽድቅ
  choice: véritablement
  alternative: dans la justice
  rationale: La valeur adverbiale « en vérité » convient mieux à la syntaxe et au contexte, mais la traduction évite d’en tirer une affirmation doctrinale sur la justice des personnages.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure obscure « d’entre ses pieds » est conservée dans le texte afin de ne pas effacer l’incertitude de la source, puis expliquée en note. Les pronoms restent proches du guèze, malgré une certaine ambiguïté de leurs référents.
