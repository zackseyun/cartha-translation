lexical_decisions:
- source_word: አማን
  choice: Vraiment
  rationale: Rend l’affirmation emphatique du guèze de manière naturelle et digne en français moderne.
- source_word: ውሉድየ
  choice: mes enfants
  rationale: Le nom signifie « enfants » ou « fils », avec le suffixe possessif de première personne ; « enfants » conserve la portée non spécifiée du terme.
- source_word: ተመይጠ
  choice: se tourna vers eux
  rationale: Exprime le mouvement de se retourner ; « vers eux » explicite naturellement en français la direction suggérée par la suite de l’action.
- source_word: ሰዐሞሙ
  choice: les embrassa
  rationale: Rend le verbe « embrasser » avec son objet pronominal pluriel.
- source_word: ሐቀፎሙ
  choice: les serra dans ses bras
  rationale: Formulation française courante et précise pour l’action d’enlacer ou d’étreindre.
