  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: fr
  text: '« Et maudit soit tout peuple qui te maudit ! » Puis il dit à Juda : « Que le Seigneur te donne force et puissance, afin que tu foules aux pieds tous ceux qui te haïssent. Sois le chef des fils de Jacob, toi et l’un de tes fils. Que ton nom et le nom de tes fils parcourent et sillonnent toute la terre et ses régions. Alors les nations te craindront. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ
  choice: peuple
  rationale: Le terme désigne ici un peuple ou un groupe humain ; « peuple » maintient la distinction avec አሕዛብ, rendu ensuite par « nations ».
- source_word: እግዚአ ብሔር
  choice: le Seigneur
  rationale: Rendu français traditionnel et naturel du titre divin présent dans la source.
- source_word: ኀይለ፡ ወጽንዐ
  choice: force et puissance
  rationale: Conserve le doublet de qualités étroitement apparentées sans les fusionner.
- source_word: ትኪዶሙ
  choice: tu foules aux pieds
  rationale: Exprime l’image concrète de domination véhiculée par le verbe, plutôt qu’un vague « vaincre ».
- source_word: መኰንነ
  choice: chef
  rationale: Le terme désigne un dirigeant ou gouvernant ; « chef » est naturel et évite d’imposer un titre royal absent du texte.
- source_word: ዘየሐውር፡ ወዘያንሶሱ
  choice: parcourent et sillonnent
  rationale: Préserve les deux verbes de mouvement et l’idée d’une circulation étendue dans le monde.
- source_word: አሕዛብ
  choice: les nations
  rationale: Rend le pluriel désignant les peuples étrangers et le distingue de ሕዝብ au début du verset.
- source_word: እምቅድመ፡ ገጽከ
  choice: devant toi
  rationale: Expression française idiomatique correspondant littéralement à « devant ta face », sans perdre l’idée de présence.
theological_decisions:
- issue: Nature de l’autorité accordée à Juda et à l’un de ses descendants
  choice: « Sois le chef des fils de Jacob, toi et l’un de tes fils »
  alternative: « Sois souverain… » ou « règne… »
  rationale: « Chef » conserve une autorité réelle sans préciser davantage que la source s’il s’agit d’une royauté, d’une primauté tribale ou d’une autre fonction dirigeante.
- issue: Portée de la diffusion du nom de Juda et de ses fils
  choice: Conserver l’image du nom qui « parcourt et sillonne » la terre
  alternative: Interpréter par « devienne célèbre »
  rationale: La formulation figurée de la source est maintenue afin de ne pas réduire son ambiguïté à la seule renommée.
- issue: Réaction des nations
  choice: « trembleront devant toi »
  alternative: « te craindront »
  rationale: « Trembler » donne en français une expression forte de crainte tout en restant compatible avec le contexte de puissance et de domination.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe de bénédiction est conservée, avec des formulations naturelles. Les parallélismes et doublets de la source sont maintenus lorsque leur répétition porte du sens.
