  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
translation:
  language: fr
  text: 'et posa sa main gauche sur Juda[a]. Puis il se tourna d’abord vers Lévi et commença à le bénir. Il lui dit : « Que le Dieu de tous, le Seigneur de tous les âges, te bénisse'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « et Juda de sa main gauche » ; le verbe « posa » est sous-entendu d’après la phrase précédente.
    reason: Signaler l’ellipse et la construction littérale du guèze, tout en évitant que Juda soit pris à tort pour le sujet de l’action.
lexical_decisions:
- source_word: በፀጋማዊ፡ እዴሁ፡
  choice: sa main gauche
  rationale: Rend directement l’expression guèze désignant la main gauche, en explicitant l’ellipse verbale grâce au contexte immédiat.
- source_word: ቀዲሙ
  choice: d’abord
  rationale: Exprime naturellement la priorité accordée à Lévi sans répéter inutilement cette idée dans la proposition suivante.
- source_word: ኵሉ፡ ዓለማት
  choice: tous les âges
  rationale: Préserve la portée temporelle de ዓለማት et correspond au sens de l’ensemble des époques, plutôt qu’au seul monde spatial.
theological_decisions:
- issue: Portée de « Dieu de tous »
  choice: le Dieu de tous
  alternative: le Dieu de tout
  rationale: Le guèze permet une formulation générale. « De tous » conserve la possible référence à tous les êtres sans restreindre explicitement le sens aux personnes ni le transformer en abstraction.
- issue: Titre « Seigneur de tous les âges »
  choice: le Seigneur de tous les âges
  alternative: le Seigneur de tous les mondes
  rationale: Le contexte doxologique et la consultation anglaise appuient la valeur temporelle, tout en maintenant un titre universel sans ajout doctrinal.
translation_notes:
  register: Français moderne, naturel et digne. La syntaxe elliptique initiale est clarifiée à partir du contexte, tandis qu’une note conserve la forme littérale. Le fragment reste ouvert à la fin, conformément au texte fourni.
