  text: And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from the chamber to the door of the chamber to kiss Jacob and embrace him, for her spirit had revived when...
translation:
  language: fr
  text: Il vint auprès de son père Isaac et de sa mère Rébecca. Rébecca sortit de la chambre et alla jusqu’à la porte de la chambre pour embrasser Jacob et le serrer dans ses bras, car son esprit s’était ranimé au moment où…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait guèze fourni s’achève sur une expression signifiant « au moment où »; la proposition se poursuit dans la suite du récit.
    reason: Signaler que la phrase inachevée reflète la limite de l’extrait source et non une lacune ajoutée par la traduction.
lexical_decisions:
- source_word: ኀበ
  choice: auprès de / jusqu’à
  rationale: La préposition exprime ici un mouvement vers une personne ou un lieu; la formulation française varie selon le complément afin de rester naturelle.
- source_word: ማኅፈድ
  choice: chambre
  rationale: Ce terme désigne ici une pièce intérieure. Le même choix est conservé lors de ses deux occurrences pour rendre la répétition du texte source.
- source_word: ትስዐሞ
  choice: embrasser
  rationale: Le verbe signifie donner un baiser; en français moderne, « embrasser » convient naturellement dans ce contexte familial.
- source_word: ትሕቀፎ
  choice: le serrer dans ses bras
  rationale: Cette expression distingue clairement l’étreinte du baiser déjà exprimé par « embrasser ».
- source_word: ሐይወ፡ መንፈሳ
  choice: son esprit s’était ranimé
  rationale: La traduction garde la mention explicite de l’esprit et rend l’idée d’un retour à la vie ou à la vigueur.
- source_word: በጊዜ
  choice: au moment où…
  rationale: Dans cette position, l’expression introduit une proposition temporelle qui se poursuit au-delà de l’extrait fourni; elle ne doit donc pas être artificiellement transformée en phrase achevée.
