translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « chambre » est volontaire afin de préserver celle du texte guèze. Le plus-que-parfait situe le retour à la vigueur de Rébecca avant l’action décrite par la proposition temporelle qui suit.
