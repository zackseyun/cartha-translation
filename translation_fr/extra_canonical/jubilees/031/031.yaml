revisions:
- from: '… Juda. Il se réjouit et bénit le Dieu de ses pères, Abraham et Isaac. Il dit : « Maintenant, je sais qu’il y a pour moi une espérance éternelle, ainsi que pour mes descendants, devant le Dieu de tous. » Voilà ce qui fut établi au sujet de tous les deux, et on l’inscrirait pour eux comme un témoignage éternel de justice[a] sur les tablettes célestes, conformément à la bénédiction qu’Isaac leur avait donnée.'
  to: 'Juda se réjouit et bénit le Dieu de ses pères, Abraham et Isaac. Il dit : « Maintenant, je sais qu’il y a pour moi une espérance éternelle, ainsi que pour mes descendants, devant le Dieu de tous. » Ainsi fut-il établi à leur sujet, et cela leur fut consigné comme un témoignage éternel de justice sur les tablettes célestes, de même qu’Isaac les avait bénis.'
  rationale: 'La révision suit en priorité le segment guèze fourni : elle rétablit Juda comme sujet de « se réjouit », conserve l’espérance pour Jacob et sa descendance devant le Dieu de tous, maintient le dual sans identifier les deux personnes au-delà du contexte, et rend l’inscription au singulier sans conditionnel. La note proposée n’est pas nécessaire : le texte principal « témoignage éternel de justice » conserve déjà, en français, l’ouverture sémantique du syntagme source.'
  reviewer_model: gpt-5.6-terra
