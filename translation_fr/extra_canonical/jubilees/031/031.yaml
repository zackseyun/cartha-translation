  text: Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and it was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac blessed them.
translation:
  language: fr
  text: 'Juda se réjouit et bénit le Dieu de ses pères, Abraham et Isaac. Il dit : « Maintenant, je sais qu’il y a pour moi une espérance éternelle, ainsi que pour mes descendants, devant le Dieu de tous. » Ainsi fut-il établi à leur sujet, et cela leur fut consigné comme un témoignage éternel de justice sur les tablettes célestes, de même qu’Isaac les avait bénis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተስፋ፡ ዘለዓለም (tasfā za-laʿālam)
  choice: une espérance éternelle
  rationale: Rend directement le nom « espérance » et l’expression temporelle « pour toujours », dans un français naturel.
- source_word: ወለውሉድየሂ (wa-la-wəludayahi)
  choice: ainsi que pour mes descendants
  rationale: Le terme désigne la descendance ou les enfants au sens générationnel ; « descendants » convient au contexte de la promesse.
- source_word: በእንተ፡ ክልኤሆሙ (baʾənta kəlʾehomu)
  choice: au sujet de tous les deux
  rationale: Conserve la référence duale explicite sans identifier davantage les deux personnes dans ce segment.
- source_word: በስምዕ፡ ዘለዓለም (ba-səmʿ za-laʿālam)
  choice: comme un témoignage éternel
  rationale: « Témoignage » est le sens contextuel de ስምዕ ; ዘለዓለም en exprime la permanence.
- source_word: ጽድቅ (ṣədq)
  choice: de justice
  rationale: Évite d’omettre le substantif source et maintient l’ambiguïté entre le caractère juste du témoignage et son rapport à la justice.
- source_word: ጽላተ፡ ሰማይ (ṣəllāta samāy)
  choice: les tablettes célestes
  rationale: Expression cosmologique récurrente des Jubilés ; « célestes » est plus idiomatique que « du ciel ».
theological_decisions:
- issue: Portée de l’espérance
  choice: pour moi… ainsi que pour mes descendants
  alternative: j’ai, moi et mes enfants, une espérance éternelle
  rationale: La formulation retenue suit les relations syntaxiques du guèze et ne précise pas la nature sotériologique, dynastique ou eschatologique de l’espérance.
- issue: Rapport entre « témoignage » et « justice »
  choice: un témoignage éternel de justice
  alternative: un témoignage juste et éternel
  rationale: Le génitif français garde mieux ouverte la relation sémantique exprimée par le texte, au lieu de réduire « justice » à un simple adjectif qualitatif.
- issue: Référent de l’inscription
  choice: on l’inscrirait pour eux
  alternative: ils seraient inscrits
  rationale: Le pronom singulier renvoie naturellement à ce qui a été établi ou au témoignage, sans faire des deux personnes l’objet direct de l’inscription.
translation_notes:
  register: Français moderne, digne et lisible. Le texte source fourni commence au milieu d’une proposition par la mention de Juda ; l’ellipse initiale est donc signalée plutôt que comblée à partir de la seule couche anglaise. Le conditionnel « inscrirait » reflète la forme verbale transmise, dont la valeur exacte est moins nette que ne le laisse entendre la consultation anglaise.
