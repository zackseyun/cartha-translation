  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
translation:
  language: fr
  text: Puisque tu m’as vu vivant, et que moi aussi je t’ai vu, mon fils, prospère et accomplis le vœu que tu as fait. Ne tarde pas à t’acquitter de ton vœu, car tu auras à en rendre compte. Maintenant, hâte-toi de l’accomplir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  choice: Puisque
  rationale: Dans ce contexte, la locution introduit le motif ou la circonstance (« puisque », « du fait que »), sans qu’il soit nécessaire de suppléer « le jour où ».
- source_word: ተስፋሕ፡
  choice: prospère
  rationale: Rend l’impératif exprimant la réussite ou la prospérité, tout en conservant la concision du texte source.
- source_word: ግበር፡ ጸሎተ፡
  choice: accomplis le vœu
  rationale: Le verbe signifie littéralement « faire »; avec « vœu », « accomplir » est l’expression française naturelle pour mener à exécution l’engagement pris.
- source_word: አታጕንዲ፡ ጸሎተከ፡
  choice: Ne tarde pas à t’acquitter de ton vœu
  rationale: Exprime naturellement en français l’interdiction de différer l’exécution du vœu.
- source_word: ትትኀሠሥ፡ ጸሎተ፡
  choice: tu auras à en rendre compte
  rationale: Le passif du verbe « chercher, réclamer » indique ici que le vœu sera exigé de lui; cette formulation préserve l’idée de reddition de comptes sans préciser indûment qui l’exigera.
- source_word: ጕጕአ፡ ትግበራ፡
  choice: hâte-toi de l’accomplir
  rationale: Reproduit l’exhortation pressante à mettre immédiatement le vœu à exécution.
theological_decisions:
- issue: Agent implicite de la reddition de comptes
  choice: tu auras à en rendre compte
  alternative: on te réclamera l’accomplissement de ce vœu
  rationale: Le texte ne nomme pas explicitement Dieu ni un autre agent. La formulation retenue conserve cette indétermination tout en exprimant la responsabilité attachée au vœu.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « vœu » et d’« accomplir » est maintenue en partie pour refléter l’insistance du texte, tandis que « t’acquitter de » évite une lourdeur excessive.
