lexical_decisions:
- source_word: ለክልኤሆሙ፡ ኀቡረ
  choice: tous les deux ensemble
  rationale: Rend explicitement le duel « les deux » ainsi que l’idée d’être ensemble, dans une formulation française naturelle.
- source_word: መንፈሰ፡ ትንቢት
  choice: un esprit de prophétie
  rationale: Traduction formellement proche qui conserve l’expression et son éventuelle portée théologique sans l’expliciter davantage.
- source_word: ወረደ፡ ውስተ፡ አፉሁ
  choice: descendit dans sa bouche
  rationale: Préserve l’image concrète et inhabituelle du texte source plutôt que de la normaliser en « vint sur lui » ou « lui inspira des paroles ».
- source_word: በየማናዊ
  choice: de la main droite
  rationale: Rend l’instrument ou le côté droit indiqué par le guèze; le français idiomatique emploie ici l’article défini.
theological_decisions:
- issue: Nature de l’« esprit de prophétie »
  choice: un esprit de prophétie
  alternative: l’Esprit de prophétie
  rationale: La graphie et l’expression ne permettent pas d’imposer sans ambiguïté une identification personnelle ou divine; la minuscule et l’article indéfini préservent cette ouverture.
- issue: Image de la descente dans la bouche
  choice: descendit dans sa bouche
  alternative: vint sur ses lèvres / lui donna de prophétiser
  rationale: La traduction retient l’image corporelle du texte et évite d’en résoudre l’interprétation.
translation_notes:
  register: Français international moderne, digne et lisible. Le fragment initial dépend syntaxiquement du verset précédent; il est donc maintenu avec une minuscule. « Alors » marque naturellement la transition vers la nouvelle proposition sans alourdir la succession de coordinations.
