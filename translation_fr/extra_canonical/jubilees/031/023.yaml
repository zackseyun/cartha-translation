  text: '[With joy.] And he placed the two sons of Jacob, one at his right hand and one at his left,'
translation:
  language: fr
  text: '[Avec joie.][a] Puis il plaça[b] les deux fils de Jacob, l’un à sa droite et l’autre à sa gauche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « Avec joie » semblent compléter la dernière phrase du verset 22, mais ils figurent au début du texte source transmis pour ce verset.
    reason: verse_boundary_ambiguity
  - marker: b
    text: Ou « fit s’installer »; le verbe peut évoquer le fait de faire reposer ou coucher quelqu’un.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: በፍሥሐ
  choice: Avec joie
  rationale: Rend directement le syntagme adverbial « dans/avec la joie ». Les crochets signalent que ces mots, bien qu’ils figurent au début de la chaîne source fournie pour ce verset, semblent compléter la phrase du verset précédent.
- source_word: ወአኖመ
  choice: Puis il plaça
  rationale: Dans ce contexte, le causatif du verbe associé au repos ou au coucher décrit la disposition des deux fils de part et d’autre de Jacob. « Plaça » donne naturellement le sens contextuel; « Puis » restitue la progression narrative portée par la conjonction.
- source_word: በየማኑ፡ ወአሐደ፡ በፀጋሙ
  choice: l’un à sa droite et l’autre à sa gauche
  rationale: Formulation française idiomatique qui conserve exactement l’opposition droite-gauche du texte guèze.
theological_decisions:
- issue: Rattachement de « avec joie » au verset 22 ou au verset 23
  choice: Conserver l’expression au début du verset 23 entre crochets, avec une note
  alternative: La déplacer à la fin du verset 22
  rationale: La chaîne source assignée au verset 23 commence par cette expression, mais sa syntaxe et son sens indiquent vraisemblablement qu’elle achève la bénédiction mentionnée au verset précédent. Les crochets et la note préservent à la fois la donnée textuelle fournie et l’incertitude de la division en versets.
- issue: Valeur du verbe ወአኖመ
  choice: il plaça
  alternative: il les fit se coucher / s’installer
  rationale: Le contexte met surtout en relief la position respective des deux fils. « Plaça » est clair et naturel sans imposer une posture que le passage ne développe pas; la note conserve toutefois la nuance plus littérale possible.
translation_notes:
  register: Français international moderne, simple et digne. La coordination narrative est rendue par « Puis » pour éviter une succession lourde de « et », tandis que la structure équilibrée « l’un… l’autre… » conserve le rythme de la source.
