  yaml_path: translation/extra_canonical/jubilees/031/017.yaml
  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
translation:
  language: fr
  text: Que ta table soit pleine, et que ta nourriture ne te fasse jamais défaut. Que tous ceux qui te haïssent tombent devant toi, et que tous tes adversaires soient déracinés et périssent. Et celui qui te bénit,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማዕድከ፡ ምልእተ
  choice: ta table soit bien garnie
  rationale: Rend naturellement en français l’image de la table pleine, dans le cadre d’une bénédiction d’abondance.
- source_word: ወኢይሕፀፅ፡ እክልከ
  choice: que ta nourriture ne manque jamais
  rationale: Exprime clairement le souhait que les vivres ne viennent pas à manquer; « jamais » est précisé par la formule temporelle qui suit.
- source_word: ለኵሉ፡ ዓለማት
  choice: dans tous les siècles
  rationale: Conserve la portée temporelle forte et la tournure solennelle du pluriel éthiopien.
- source_word: ቅድሜከ፡ ይደቁ
  choice: tombent devant toi
  rationale: Reproduit directement l’image de la chute des ennemis devant le destinataire.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: soient déracinés et disparaissent
  rationale: Préserve les deux verbes et leur progression, du déracinement à la disparition.
- source_word: ወዘይባርከከ
  choice: Quant à celui qui te bénit,
  rationale: Le texte du verset s’achève sur un groupe sujet dont le prédicat vient au verset suivant; « Quant à » signale naturellement cette suspension sans compléter indûment la phrase.
theological_decisions:
- issue: Proposition finale inachevée à la limite du verset
  choice: Quant à celui qui te bénit,
  alternative: Et béni soit celui qui te bénit,
  rationale: Le guèze de ce verset ne contient que « et celui qui te bénit »; ajouter ici « béni soit » anticiperait le prédicat du verset 18 et modifierait la division textuelle.
translation_notes:
  register: Français moderne, digne et accessible. La structure de bénédiction est rendue par le subjonctif optatif. La fin demeure volontairement suspendue afin de respecter la limite du verset et la syntaxe qui se poursuit au verset suivant.
