  source_fidelity: Révision mineure nécessaire. Le sens général est bien rendu, y compris la suspension finale qui respecte la limite du verset. Toutefois, « bien garnie » interprète légèrement « pleine », et l’association de « jamais » avec « dans tous les siècles » est redondante et peu naturelle en français.
  naturalness: Le français est globalement clair et d’un registre approprié. « Que ta table soit pleine » est plus direct et plus fidèle à l’image source. « Ne te fasse jamais défaut » est idiomatique et exprime la continuité visée sans la lourdeur de la double indication temporelle.
  terminology: « Table », « nourriture », « adversaires », « déracinés » et « bénit » conviennent. La coordination finale doit conserver le simple « Et », présent dans le texte guèze, plutôt que l’encadrement interprétatif « Quant à ».
