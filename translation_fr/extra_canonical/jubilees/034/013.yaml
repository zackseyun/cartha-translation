  text: And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.
translation:
  language: fr
  text: 'Il porta le deuil toute cette nuit-là, car on lui avait apporté le vêtement le soir. Il fut pris de fièvre de chagrin à cause de sa mort et dit : « Une bête sauvage a dévoré Joseph. » Tous les gens de sa maison portèrent le deuil avec lui ce jour-là ; ils restèrent dans la douleur et pleurèrent avec lui toute la journée.'
