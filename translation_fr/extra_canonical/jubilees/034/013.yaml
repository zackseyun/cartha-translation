  choice: Il porta le deuil
  rationale: Le verbe exprime ici le deuil et les lamentations de Jacob, plutôt qu’une simple tristesse intérieure.
- source_word: ሰርከ
  choice: le soir
  rationale: Rend directement l’indication temporelle du texte guèze.
- source_word: አርዌ፡ ጸዋገ
  choice: une bête sauvage
  rationale: Expression naturelle qui conserve l’idée d’un animal féroce ou sauvage sans préciser son espèce.
- source_word: የሐምሙ፡ ወይላሐዉ
  choice: ils restèrent dans la douleur et pleurèrent
  rationale: 'Préserve les deux aspects coordonnés du texte : l’affliction éprouvée et sa manifestation par les lamentations.'
