  to: 'Il porta le deuil toute cette nuit-là, car on lui avait apporté le vêtement le soir. Il fut pris de fièvre de chagrin à cause de sa mort et dit : « Une bête sauvage a dévoré Joseph. » Tous les gens de sa maison portèrent le deuil avec lui ce jour-là ; ils restèrent dans la douleur et pleurèrent avec lui toute la journée.'
  rationale: Révision limitée de l’expression causale décrivant la fièvre, afin de préserver le lien du texte entre l’affliction de Jacob et la mort présumée de Joseph, sans faire des pleurs eux-mêmes la cause explicite.
