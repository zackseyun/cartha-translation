  register: Français international moderne, digne et narratif. Le référent implicite de « on lui avait apporté » a été explicité par « le vêtement » d’après le contexte immédiat, afin d’éviter une formulation française obscure. La répétition du deuil et des pleurs est maintenue, car elle appartient à l’insistance rhétorique du texte source.
