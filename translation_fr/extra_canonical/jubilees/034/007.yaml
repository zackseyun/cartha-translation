  text: six thousand men who carried weapons. And he killed them in the descent of Shechem, and pursued those who fled, and killed them with the edge of the sword, and he killed Ares and Taphu and Seragan.
translation:
  language: fr
  text: six mille hommes qui portaient des armes. Il les tua dans la descente de Sichem[a], poursuivit ceux qui s’enfuyaient et les passa au fil de l’épée. Il tua aussi Arès, Taphou et Seregan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la sortie de Sichem ».'
    reason: Le terme guèze peut désigner une sortie ou, en contexte topographique, une descente.
lexical_decisions:
- source_word: እለ፡ ይጸውሩ፡ አበይፍተ
  choice: qui portaient des armes
  rationale: Rend directement la proposition relative guèze dans un français naturel, sans préciser indûment le type d’armes.
- source_word: በውስተ፡ ጸአተ፡ ዘሴቄም
  choice: dans la descente de Sichem
  rationale: ጸአተ exprime littéralement une sortie ou un mouvement vers le bas; dans ce contexte topographique, « descente » convient mieux que « plaine ».
- source_word: በአፈ፡ ሰይፍ
  choice: au fil de l’épée
  rationale: Équivalent français idiomatique de l’expression sémitique littérale « par la bouche de l’épée ».
- source_word: አሬስ፡ ወለታፉ፡ ወለሴሬጋን
  choice: Arès, Taphou et Séragan
  rationale: Translittération francisée et cohérente des trois noms propres.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La première proposition reste en minuscule puisqu’elle constitue manifestement la suite syntaxique du verset précédent. La répétition des verbes a été légèrement allégée sans supprimer la succession des actions.
