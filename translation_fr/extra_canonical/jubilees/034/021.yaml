  yaml_path: translation/extra_canonical/jubilees/034/021.yaml
  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
translation:
  language: fr
  text: La femme de Benjamin était Iyasaka. Siméon changea d’avis[a] et prit une autre femme de Mésopotamie, comme ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi se comprendre par « se repentit », « le regretta » ou, plus littéralement, « revint » ; le sens est que Siméon prit une autre femme de Mésopotamie, comme ses frères.
    reason: alternative_reading
lexical_decisions:
- source_word: ኢያስካ
  choice: Iyasaka
  rationale: Translittération directe du nom propre guèze, sans lui substituer une forme conjecturale.
- source_word: ተመይጠ
  choice: changea d’avis
  rationale: Le verbe exprime fondamentalement l’idée de se retourner ou de revenir; dans ce contexte, cette expression française relie naturellement ce changement à la décision matrimoniale de Siméon tout en évitant de lui imposer d’emblée un sens religieux.
- source_word: ካልእተ
  choice: une deuxième femme
  rationale: Le terme signifie «deuxième» ou «autre»; avec «femme», le contexte indique que Siméon en prit une seconde.
- source_word: ሜስጶጦምያ
  choice: Mésopotamie
  rationale: Forme géographique française courante correspondant au nom présent dans le texte source.
theological_decisions:
- issue: Portée morale ou religieuse du changement de Siméon
  choice: changea d’avis
  alternative: se repentit / le regretta
  rationale: Le texte permet une idée de retour, de regret ou de repentir, mais ne précise pas explicitement qu’il s’agit d’une repentance religieuse. La traduction principale conserve donc une formulation contextuelle non confessionnelle, et la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe nominale de la première proposition est rendue par «était». «Changea d’avis» offre une lecture naturelle sans effacer les autres nuances possibles, conservées en note.
