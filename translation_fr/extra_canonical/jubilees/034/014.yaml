  source_fidelity: Le guèze dit littéralement que ses fils et ses filles se levèrent pour le consoler, puis qu’il ne fut pas consolé « à cause de / au sujet de son fils ». Le projet est fidèle dans l’ensemble, mais « refusa » explicite une intention qui n’est pas formulée aussi directement par la forme négative du texte guèze.
