  text: and Selo and Amanisker and Gagaas. And he recovered his built[8], and prevailed over them, and imposed tribute on them, so that they gave him tribute, a fifth of the produce of their land. And he built
translation:
  language: fr
  text: 'ainsi que Sélo, Amanisker et Gagaas. Il récupéra son troupeau, l’emporta sur eux et leur imposa un tribut : ils lui remirent comme tribut un cinquième des produits de leur terre. Puis il construisit[a]…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La forme des noms des deux lieux construits, donnés dans la suite du texte, est incertaine; « Robel » et « Tamnatarès » sont des translittérations provisoires de l’éthiopien.
    reason: textual_variant
lexical_decisions:
- source_word: መራዕይሁ (meraʿiyhu)
  choice: son troupeau
  rationale: Le nom renvoie naturellement au bétail ou au troupeau sous la garde de quelqu’un. Cette traduction conserve le sens concret du guèze plutôt que le terme plus large « possessions ».
- source_word: ዐብየ፡ ላዕሌሆሙ (ʿabya lāʿlēhomu)
  choice: l’emporta sur eux
  rationale: L’expression indique qu’il devint puissant ou supérieur à eux; « l’emporta sur eux » rend cette domination sans préciser indûment s’il s’agit d’une bataille particulière.
- source_word: ፀባሕተ (ṣebaḥta)
  choice: tribut
  rationale: Dans ce contexte de soumission politique et de prélèvement régulier, « tribut » est le terme français naturel et précis.
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ
  choice: un cinquième des produits de leur terre
  rationale: Rend l’idée d’une cinquième part du fruit ou rendement agricole de leur territoire dans un français actuel.
- source_word: ሐነጸ (ḥanaṣa)
  choice: construisit
  rationale: Le verbe signifie bâtir ou construire. La phrase étant interrompue à cet endroit dans l’extrait fourni, les points de suspension signalent que son complément se trouve dans la suite textuelle.
