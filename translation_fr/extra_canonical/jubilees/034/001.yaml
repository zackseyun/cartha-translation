  yaml_path: translation/extra_canonical/jubilees/034/001.yaml
  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
translation:
  language: fr
  text: La sixième année de cette semaine, de ce quarante-quatrième jubilé, Jacob envoya ses fils faire paître leurs moutons, avec leurs serviteurs, dans le pâturage de Sichem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: semaine
  rationale: Rend directement le terme désignant une période de sept ans dans la chronologie des Jubilés, sans ajouter « d’années », absent du texte.
- source_word: ይርዐዩ፡ አባግዒሆሙ
  choice: faire paître leurs moutons
  rationale: Expression française naturelle qui conserve le verbe de pâture et le possessif pluriel du texte.
- source_word: ወአግብርቲሆሙኒ፡ ምስሌሆሙ
  choice: accompagnés de leurs serviteurs
  rationale: Le suffixe possessif pluriel de አግብርቲሆሙ impose « leurs serviteurs »; la formulation française indique clairement qu’ils partent avec les fils.
- source_word: ውስተ፡ ጸአተ፡ ሴቄም
  choice: dans les pâturages de Sichem
  rationale: « Pâturages » restitue idiomatiquement le lieu où les troupeaux paissent; « Sichem » est la forme française traditionnelle du toponyme.
