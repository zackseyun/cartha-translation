- source_word: ወዜነዉዎ፡ ለያዕቆብ
  choice: Ils en informèrent Jacob
  rationale: Le verbe signifie annoncer, rapporter ou informer ; le pronom objet implicite est rendu par « en » en français naturel.
- source_word: ናሁ
  choice: Voici que
  rationale: Cette particule de présentation attire l’attention sur ce qui suit sans supprimer la valeur discursive de « voici ».
- source_word: ነገሥተ፡ አሞሬዎን
  choice: les rois des Amorites
  rationale: Rendu direct du pluriel « rois » suivi du nom de peuple au génitif.
