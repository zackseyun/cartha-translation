  text: '1. ወበሳድስ፡ ዓመት፡ ለዝ፡ ሱባዔ፡ እምዝንቱ፡ ዘአርብዓ፡ ወረባዕቱ፡'' እዮቤልው፡ ፈነዎሙ፡ ያዕቆብ፡ ለውሉዱ፡'' ይርዐዩ፡ አባግዒሆሙ፡'' ወአግብርቲሆሙኒ፡'' ምስሌሆሙ፡ ውስተ፡ ጸአተ፡ ሴቄም"።''

    2. ወተጋብኡ፡ ላዕሌሆሙ፡ ሱባዔቲሆሙ፡ ነገሥተ፡ አሞሬዎን፡ ከመ፡ ይቅትልዎሙ፡ ኀብኢኦሙ፡''

    3. ታሕተ፡ አም፡ ወከመ፡ ይማህርኩ፡ እንስሳሆሙ። ወያዕቆብ፡ ወሌዊ፡'' ወይሁዳ፡ ወዮሴፍ፡ ሀለዉ፡ ውስተ፡ ቤት፡ ኀበ፡ ይስሐቅ፡ አቡሆሙ፡ እስመ፡ ኖንዝና፡" መንፈሱ፡ ወስእኑ፡ ኀዲጎተ፡

    4. ወብንያም፡ ውእቱ፡ ዘይኄእስ፡ ወ"በእግዚአ፡ ነበረ፡" *ኀበ፡ አቡሁ።" ወመጽኡ፡ ነገሥተ፡ ታፉ፡" ወነገሥተ፡ አሬስ፡ ወነገሥተ፡ ሴራጋን፡" ወነገሥተ፡ ሴሎ፡ ወነገሥተ፡ ጋአስ፡" ወንጉሠ፡ ቤተርን፡ ወንጉሠ፡ ማአኒሳኬር፡" ወኵሎሙ፡ እለ፡ ይነብሩ፡ ውስተዝ፡" ደብር፡" እለ፡ ይነብሩ፡ ውስተ፡

    5. አም፡" ምድረ፡ ከናዓን። ወዜነዉዎ፡ ለያዕቆብ፡ *እንዘ፡ ይብሉ፡" ከመ፡'' ናሁ፡ ነገሥተ፡ አሞሬዎን፡

    6. ዐገትዎሙ፡ ለውሉድከ፡ ወመራዕዮሙሂ፡" ተማህጠኑ። ወተንሥአ፡ እምነ፡ ቤቱ፡ ውእቱ፡ ወሠለስቲሆሙ፡ ውሉዱ፡" ወኵሎሙ፡ ደቂ፡ አቡሁ፡ ወደቁ፡ ወሖረ፡" ላዕሌሆሙ፡" በስሳ፡

    7. ምእት፡" ዕደ፡ እለ፡ ይጸውሩ፡ አበይፍተ። ወቀተሎሙ፡" በውስተ፡ ጸአተ፡ ዘሴቄም"፡" ወዴገነ፡" እለ፡ ጐዩ፡ ወቀተሎሙ፡" በአፈ፡ ሰይፍ፡ ወቀተሎሙ፡" ለአሬስ፡ ወለታፉ፡" ወለሴሬጋን፡"

    8. ወለሴሎ፡" ወለአማኒስኬር፡" ወለጋጋአስ። ወአስተጋብአ፡ መራዕይሁ፡" ወዐብየ፡ ላዕሌሆሙ፡" ወሠርዐ፡ ፀባሕተ፡ ላዕሌሆሙ፡ ከመ፡ የሀብዎ፡ ጸባሕተ፡ ኀምስተ፡ ፍሬ፡ ምድርሙ፡ ወሐነጸ፡

    9. *ርቤአሃ፡ ወትምናታሬስሃ።" ወተመይጠ፡ በሰላም፡ ወገብረ፡ ምስሌሆሙ፡ ሰላመ፡ ወኮንዎ፡

    10. አግብርተ፡ እስከ፡ አመ፡ ዕለተ፡ ወረዱ፡ ውእቱ፡ ወውሉዱ፡ ውስተ፡" ግብጽ። ወበሳብዕ፡ ዓመት፡ ዘዝ፡ ሱባዔ፡ ፈነወ፡" ዮሴፍሃ፡ ከመ፡ ያእምር፡ ሰላሞሙ፡ ለአኀዊሁ፡ እምቤቱ፡ ውስተ፡ ምድረ፡"

    11. ሴቄም"፡" ወረከቦሙ፡ በምድረ፡ ዶታኤም።" ወሐብበይዎ፡ ወገብሩ፡ ላዕሌሁ፡'' ምክረ፡ ከመ፡ ይቅ ትልዎ፡ ወተመይጦሙ፡" ሣጥዎ፡ ለነጋዲተ፡" እስማዒላዊያን፡ ወአውረድዎ፡ ግብጸ፡" ወአከበይዎ፡" ለኢጥፋራ፡ ሐፀወ፡ ፈርዖን፡ ሊቀ፡ ዐቀብት፡ ሣውዕ፡ ዘሀገረ፡ ኤሌው። ወውሉደ፡ ያዕቆብ፡ ፲፪ ዘብሑ፡ ዳቤላ፡ ጠሊ፡ ወጸንቀቀ፡ ልብሱ፡ ለዮሴፍ፡ በደም፡ ወፈነዉ፡ ኀበ፡ ያዕቆብ፡ አቡሆሙ፡ አመ፡ ዐሡሩ፡ ለወርኀ፡ ሳብዕ። ወበሐወ፡ ኵላ፡ ይእቲ፡ ሌሊተ፡ እስመ፡ ሰርከ፡ እምጽኡ፡ ፲፫ ሎቱ፡ ኪያሁ፡ ወፈጸነ፡ በላህ፡ ሞቶ፡ ወይቤ፡ ከመ፡ አርዌ፡ ጸዋገ፡ በልዖ፡ ለዮሴፍ፡ ወላሐዉ፡ ምስሌሁ፡ ኵሉ፡ ሰብአ፡ ቤቱ፡ በዛቲ፡ ዕለት፡ *ወሀለዉ፡ እንዘ፡ የሐምሙ፡ ወይላሐዉ፡ ምስሌሁ፡ ኵላ፡ ይእቲ፡ ዕለት። ወተንሥኡ፡ ውሉዱ፡ ወወለቱ፡ ከመ፡ ይናዝዝዎ፡ ወኢተናዘዘ፡ በእንተ፡ ፲፬ ወልዱ። ወበውእቱ፡ ዕለት፡ ሰምዐት፡ ባላን፡ ከመ፡ ተሐጕለ፡ ዮሴፍ፡ ወእንዘ፡ ትለሐዎ፡ ሞተት፡ ፲፭ ወይእቲ፡ ሀለወት፡ ትነብር፡ ውስተ፡ ቀፍራቲፍ፡ ወዳኖኒ፡ ወለቱ፡ ሞተት፡ እምድኅረ፡ ተሐጕለ፡ ዮሴፍ። ወበጽሑ፡ ለእስራኤል፡ ዝንቱ፡ ሠለስቱ፡ ላህ፡ በወርኀ፡ አሐዱ። ወቀበርዋ፡ ፲፮ ለባላን፡ አንጻረ፡ *መቃብረ፡ ራሔል፡ ወዳናሃኒ፡ ወለተ፡ ቀበሩ፡ ህየ። ወሀሎ፡ እንዘ፡ ይላሑ፡ ፲፯ ድኅሬሁ፡ ለዮሴፍ፡ ዓመተ፡ አሐደ፡ ወአነገሐ፡ እስመ፡ ይቤ፡ እረድ፡ ውስተ፡ መቃብር፡ እንዘ፡

