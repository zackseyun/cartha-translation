base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
translation:
  language: fr
  text: à Sichem, et il les trouva dans le pays de Dothan. Ils agirent avec perfidie envers lui et projetèrent de le tuer ; mais, ayant changé d’avis, ils le vendirent à des marchands ismaélites, le firent descendre en Égypte et le vendirent à Potiphar, officier de Pharaon, chef des gardes et prêtre de la ville d’Héliopolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐብበይዎ
  choice: Ils agirent avec perfidie envers lui
  rationale: Le verbe guèze exprime ici l’idée d’agir avec tromperie ou perfidie, et non celle de haïr.
- source_word: ምክረ
  choice: projetèrent
  rationale: Le nom désigne un dessein ou un plan; la tournure verbale française rend naturellement «ils firent un plan contre lui».
- source_word: ሊቀ፡ ዐቀብት
  choice: chef des gardes
  rationale: La locution signifie littéralement «chef des gardes»; elle ne reprend pas le titre plus familier «chef des cuisiniers» attesté dans une autre tradition textuelle de la Genèse.
- source_word: ሣውዕ፡ ዘሀገረ፡ ኤሌው
  choice: prêtre de la ville d’Héliopolis
  rationale: Le guèze présente Potiphar comme prêtre de la ville appelée Élew, correspondant à Héliopolis.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’ouverture fragmentaire «à Sichem» est conservée, car le verset poursuit la phrase précédente. Les répétitions de coordination du guèze sont légèrement allégées sans modifier la succession des événements.
