  register: Français international moderne, narratif et digne. Les répétitions guèzes de « le nom de la femme de… » sont légèrement allégées après la première occurrence pour obtenir une énumération naturelle, sans modifier les relations généalogiques. Les noms propres sont francisés avec des graphies lisibles tout en restant proches des formes guèzes.
