    issue: Formulation ambiguë de l’expression matrimoniale
    rationale: « Prirent des femmes » est un calque possible, mais en français moderne il peut suggérer une prise ou un enlèvement. « Prirent chacun une femme » maintient le lexique du texte tout en explicitant naturellement le sens matrimonial distributif.
  - severity: low
    issue: Rendu peu idiomatique de l’origine de Melka
    rationale: « Elle était d’entre les filles d’Aram » est grammaticalement possible, mais opaque et légèrement discordant. « Issue des filles d’Aram » rend plus nettement la provenance/ascendance sans résoudre indûment l’expression généalogique.
