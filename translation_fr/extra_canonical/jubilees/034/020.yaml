  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: fr
  text: Après la disparition de Joseph[a], les fils de Jacob prirent chacun une femme. La femme de Ruben s’appelait Ada, et celle de Siméon, Adiba, une Cananéenne. La femme de Lévi s’appelait Melka ; elle était issue des filles d’Aram, de la descendance des fils de Térah. La femme de Juda s’appelait Bethasouël, une Cananéenne ; celle d’Issacar, Hizéqa ; celle de Zabulon, Ni‘aman ; celle de Dan, Égla ; celle de Nephtali, Rasoua, originaire de Mésopotamie ; celle de Gad, Maka ; celle d’Aser, Iyona ; celle de Joseph, Aséneth, une Égyptienne ; et celle de Benjamin, Iyasaka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après que Joseph eut été perdu » ; l’expression décrit sa disparition du point de vue de sa famille.'
    reason: Préserver la nuance du verbe sans laisser entendre que le texte affirme ici la mort de Joseph.
  - marker: b
    text: Dans l’extrait guèze fourni, le texte s’interrompt après « et le nom de… ». Le nom de la femme de Benjamin, Iyasaka, est conservé d’après la suite attestée dans l’édition consultée par la couche anglaise.
    reason: Signaler avec transparence que la dernière proposition dépasse le point exact où s’arrête l’extrait source transmis.
lexical_decisions:
- source_word: ተሐጕለ፡ ዮሴፍ
  choice: la disparition de Joseph
  rationale: Le verbe exprime le fait que Joseph était perdu ou avait disparu. « Disparition » rend naturellement le point de vue de sa famille sans affirmer qu’il était mort.
- source_word: ነሥኡ፡ … አንስትያ
  choice: prirent des femmes
  rationale: Rend directement l’idiome sémitique signifiant qu’ils se marièrent, tout en conservant la tournure sobre du texte.
- source_word: እምአዋልደ፡ አራም
  choice: d’entre les filles d’Aram
  rationale: Conserve l’expression généalogique du texte, qui peut désigner les femmes issues du groupe d’Aram.
- source_word: እንተ፡ ሜስጶጦምያ
  choice: originaire de Mésopotamie
  rationale: Formulation française naturelle indiquant la provenance de Rasoua.
- source_word: ግብጻዊት
  choice: une Égyptienne
  rationale: Le substantif/adjectif féminin indique l’origine égyptienne d’Aséneth ; l’article indéfini convient naturellement en français.
