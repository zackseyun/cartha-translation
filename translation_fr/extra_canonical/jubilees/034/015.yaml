  source_fidelity: 'Le récit est globalement fidèle : Bilha apprend la perte présumée de Joseph, le pleure, puis meurt à Qafratef; la mort de Dina est ensuite située après celle de Joseph. Toutefois, le possessif de la dernière proposition renvoie dans la source à Jacob (Dina est sa fille), non à Bilha.'
  naturalness: Le français est sobre et naturel. « Après que Joseph eut péri » est un peu plus exact et plus cohérent que « après la disparition de Joseph », tout en gardant la perspective narrative selon laquelle Joseph est tenu pour mort.
  terminology: « Bilha », « Joseph », « Dina » et « Qafratef » conviennent. La note textuelle est bien ancrée immédiatement après le toponyme incertain.
  issues:
  - severity: medium
    issue: Référent ambigu et probablement erroné de « sa fille »
    rationale: 'Après « Bilha », « Dina, sa fille » se comprend normalement comme la fille de Bilha en français. Le possessif masculin de la source et le contexte narratif désignent Jacob : Dina est la fille de Jacob. Il faut expliciter ce référent afin de ne pas introduire une relation absente du texte.'
  revised_text: Ce jour-là, Bilha apprit que Joseph avait péri. Tandis qu’elle le pleurait, elle mourut à Qafratef[a]. Dina, la fille de Jacob, mourut elle aussi après que Joseph eut péri.
  revised_footnotes:
  - marker: a
    text: La vocalisation du nom de lieu « Qafratef » est incertaine; il pourrait s’agir d’un toponyme altéré au cours de la transmission éthiopienne.
    reason: textual_variant
  revision_rationale: La révision explicite que Dina est la fille de Jacob, conformément au référent masculin de la source et au contexte, et évite ainsi l’attribution fautive de Dina à Bilha. Elle remplace aussi le nom abstrait « disparition » par une formulation verbale qui reflète directement le verbe source, sans prétendre que Joseph est réellement mort.
