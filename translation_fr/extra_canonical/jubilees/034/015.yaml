  text: And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef[15], and Dinah his daughter also died after Joseph had perished.
translation:
  language: fr
  text: Ce jour-là, Bilha apprit que Joseph avait péri. Tandis qu’elle le pleurait, elle mourut à Qafratef[a]. Dina, la fille de Jacob, mourut elle aussi après que Joseph eut péri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La vocalisation du nom de lieu « Qafratef » est incertaine; il pourrait s’agir d’un toponyme altéré au cours de la transmission éthiopienne.
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕለ
  choice: avait péri / disparition
  rationale: Le verbe exprime ici la perte ou la disparition de Joseph, tenu pour mort. « Avait péri » convient à ce que Bilha apprend; « disparition » évite d’affirmer de nouveau sa mort réelle dans la dernière proposition.
- source_word: ትለሐዎ
  choice: elle le pleurait
  rationale: Rend naturellement l’action de se lamenter ou de mener deuil à cause de Joseph.
- source_word: ቀፍራቲፍ
  choice: Qafratef
  rationale: Translittération prudente d’un toponyme éthiopien dont la vocalisation et la forme sont incertaines.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le découpage en deux phrases clarifie la succession des événements sans modifier leur rapport temporel. Le possessif de « sa fille » est conservé tel que le présente la source, malgré une possible ambiguïté de référent.
