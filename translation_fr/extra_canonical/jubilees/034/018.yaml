  to: C’est pourquoi il fut prescrit aux fils d’Israël de s’affliger le dixième jour du septième mois[a], le jour où la nouvelle concernant Joseph parvint à Jacob, son père, et de faire ce jour-là l’expiation pour eux-mêmes avec un chevreau. Ils devaient le faire le dixième jour du septième mois, une fois par an, à cause de leurs péchés, car ils avaient attristé l’affection que leur père portait à Joseph, son fils.
