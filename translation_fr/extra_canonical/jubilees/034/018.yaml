  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
translation:
  language: fr
  text: C’est pourquoi il fut prescrit aux fils d’Israël de s’affliger le dixième jour du septième mois[a], le jour où la nouvelle concernant Joseph parvint à Jacob, son père, et de faire ce jour-là l’expiation pour eux-mêmes avec un chevreau. Ils devaient le faire le dixième jour du septième mois, une fois par an, à cause de leurs péchés, car ils avaient attristé l’affection que leur père portait à Joseph, son fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le chapitre rattache l’affliction annuelle du dixième jour du septième mois au vêtement ensanglanté de Joseph et au deuil de Jacob. Il présente ainsi l’origine de l’observance du jour des Expiations (Yom Kippour).
    reason: cross_reference
lexical_decisions:
- source_word: ይሕመሙ
  choice: s’affliger
  rationale: Rend l’idée d’une affliction volontaire et rituelle sans préciser au-delà du texte la forme concrète de cette pratique.
- source_word: ያስተስርዩ
  choice: faire l’expiation pour eux-mêmes
  rationale: Conserve la valeur cultuelle de l’expiation ainsi que la tournure réfléchie du texte source.
- source_word: ጠሊ
  choice: chevreau
  rationale: Désigne ici un jeune caprin offert dans le cadre de l’expiation; « chevreau » est naturel et précis en français.
- source_word: ምሕረቶ
  choice: affection
  rationale: Dans ce contexte familial, le mot renvoie au tendre attachement du père; « affection » convient mieux que le sens habituel de « miséricorde ».
theological_decisions:
- issue: Lien entre le récit de Joseph et le rite annuel d’expiation
  choice: Conserver explicitement le lien narratif sans identifier le jour dans le corps du verset par son nom liturgique ultérieur.
  alternative: Traduire ou expliciter directement « le jour des Expiations » ou « Yom Kippour ».
  rationale: Le texte fixe la date, l’affliction et l’expiation, mais ne donne pas lui-même ici le nom liturgique du jour; l’identification est donc réservée à la note.
- issue: Contenu de la nouvelle concernant Joseph
  choice: « la nouvelle concernant Joseph »
  alternative: « la nouvelle de la mort de Joseph »
  rationale: Le geʿez ne dit pas explicitement que la nouvelle annonçait sa mort; la formulation retenue préserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de la date est conservée parce qu’elle structure le texte source; la seconde occurrence est intégrée dans une nouvelle phrase pour éviter une période excessivement lourde.
