  source_fidelity: 'Le sens fondamental est bien rendu : Jacob se lamente pour Joseph durant une année sans interruption et déclare qu’il descendra dans la tombe en pleurant son fils. Toutefois, « porter le deuil » désigne plus volontiers l’observance d’un deuil que l’action continue de se lamenter, et « sans s’arrêter » est moins précis que « sans cesser ».'
