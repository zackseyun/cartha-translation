  rationale: Le verbe exprime ici le deuil ou la lamentation de Jacob après la disparition de Joseph ; cette tournure est naturelle et digne en français.
- source_word: መቃብር
  choice: la tombe
  rationale: Le terme désigne la tombe ou le lieu de sépulture. « La tombe » conserve l’image concrète du texte sans lui imposer une interprétation plus abstraite du séjour des morts.
