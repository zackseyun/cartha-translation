  choice: en pleurant
  rationale: La construction circonstancielle décrit Jacob descendant dans la tombe tout en se lamentant ; « en pleurant » rend cette valeur avec naturel.
- source_word: ወልድየ
  choice: mon fils
  rationale: Traduction directe du nom accompagné du suffixe possessif de première personne.
