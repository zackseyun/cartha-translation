revisions:
- from: Leur péché fut d’avoir affligé la compassion de leur père à cause de Joseph, son fils. Ce jour fut institué afin qu’ils s’affligent en ce jour à cause de leurs péchés, de toutes leurs transgressions et de toutes leurs fautes, et qu’ils se purifient en ce jour, une fois par an.
  to: Leur péché fut d’avoir causé du chagrin à la compassion de leur père au sujet de Joseph, le fils de leur père. Ce jour fut institué afin qu’ils s’affligent en ce jour à cause de leurs péchés, de toutes leurs transgressions et de toutes leurs fautes, et qu’ils se purifient en ce jour, une fois par an.
  rationale: 'La révision se limite à la première proposition : elle clarifie que Joseph est le fils du père et emploie une tournure française plus naturelle pour le chagrin causé à sa compassion. Elle préserve l’expression abstraite « la compassion de leur père », sans ajouter « cœur » ni imposer une interprétation doctrinale de la purification annuelle.'
