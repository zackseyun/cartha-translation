  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: fr
  text: Leur péché fut d’avoir causé du chagrin à la compassion de leur père au sujet de Joseph, le fils de leur père. Ce jour fut institué afin qu’ils s’affligent en ce jour à cause de leurs péchés, de toutes leurs transgressions et de toutes leurs fautes, et qu’ils se purifient en ce jour, une fois par an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃጢአቶሙ (ḫaṭiʾātomu)
  choice: leur péché / leurs péchés
  rationale: Le premier emploi est singulier et désigne leur faute envers leur père; le second, dans la proposition commémorative, est rendu au pluriel selon le sens collectif et la couche de consultation auditée.
- source_word: አኅዘኑ (ʾaḥzanu)
  choice: avoir affligé
  rationale: Rend directement l’idée de causer du chagrin, dans un registre digne et naturel.
- source_word: ምሕረተ፡ አቡሆሙ (mǝḥrata ʾabuhomu)
  choice: la compassion de leur père
  rationale: Conserve le terme abstrait « compassion » du guèze, malgré la tournure inhabituelle, plutôt que de l’aplanir en « leur père » ou d’introduire « cœur » sans appui explicite.
- source_word: ተሠርዐት (taśarʿat)
  choice: fut institué
  rationale: Exprime l’établissement normatif de ce jour; « ordonné » serait possible mais moins naturel ici en français.
- source_word: ይሕዝኑ (yǝḥzanu)
  choice: qu’ils s’affligent
  rationale: Maintient le lien lexical et thématique avec le chagrin qu’ils avaient causé à leur père.
- source_word: አበሳሆሙ (ʾabasāhomu)
  choice: leurs transgressions
  rationale: Désigne des offenses ou manquements; « transgressions » distingue ce terme de « péchés » et de « fautes » dans l’énumération.
theological_decisions:
- issue: Nature de la purification annuelle
  choice: qu’ils se purifient
  alternative: qu’ils fassent l’expiation
  rationale: La formulation retenue n’impose pas une interprétation sacrificielle ou doctrinale plus précise que le texte de consultation; elle garde l’accent sur la purification liée à cette observance annuelle.
- issue: Objet du chagrin du père
  choice: la compassion de leur père
  alternative: le cœur de leur père
  rationale: Le choix préserve l’expression théologiquement et littérairement singulière du texte guèze au lieu de la normaliser silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « en ce jour » est conservée pour refléter l’insistance rituelle du passage. L’extrait guèze fourni s’interrompt après ወበእንተ፡ ኵሉ፡ (« et à cause de tout… »); la fin de la phrase est donc formulée à partir de la couche anglaise auditée, sans ajouter de précision confessionnelle.
