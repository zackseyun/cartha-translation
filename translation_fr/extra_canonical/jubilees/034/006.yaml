  language: fr
  text: « Ils ont encerclé tes fils et se sont emparés de leurs troupeaux. » Alors il se leva et sortit de chez lui avec ses trois fils, tous les serviteurs de son père et les serviteurs de sa propre maison, puis il marcha contre eux avec six mille hommes.
