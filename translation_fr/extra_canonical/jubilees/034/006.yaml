- source_word: ወኵሎሙ ደቂ አቡሁ ወደቂ ቤቱ
  choice: tous les serviteurs de son père et les serviteurs de sa propre maison
  rationale: Conserve les deux groupes distincts signalés par la source au lieu de les confondre.
- source_word: በስሳ [ምእት]
  choice: avec six mille hommes
  rationale: Suit la lecture numérique établie, « soixante centaines », et explicite qu’il s’agit des hommes accompagnant l’expédition.
