lexical_decisions:
- source_word: ታሕተ፡ አም
  choice: sous les arbres
  rationale: Rend le syntagme qui clôt la proposition commencée au verset précédent, conformément au découpage transmis.
- source_word: ይማህርኩ፡ እንስሳሆሙ
  choice: s’emparer de leur bétail
  rationale: Exprime naturellement en français l’action hostile visant les animaux des adversaires.
- source_word: ኀበ፡ ይስሐቅ፡ አቡሆሙ
  choice: auprès d’Isaac, leur père
  rationale: « Auprès de » convient ici à la présence des fils dans la maison avec leur père et évite une tournure française pesante.
- source_word: ኖንዝና፡ መንፈሱ
  choice: son esprit était affligé
  rationale: Conserve la mention explicite de l’esprit et traduit l’état de profonde peine sans le préciser davantage.
- source_word: ስእኑ፡ ኀዲጎተ
  choice: ils ne pouvaient pas le quitter
  rationale: Reproduit directement l’incapacité des fils à laisser Isaac dans cet état.
theological_decisions:
- issue: Sens de « son esprit »
  choice: Maintien de l’expression « son esprit était affligé »
  alternative: « il était profondément affligé »
  rationale: La formulation source distingue explicitement l’esprit de la personne; la conserver préserve sa portée anthropologique sans l’interpréter.
