translation:
  language: fr
  text: sous les arbres et pour s’emparer de leur bétail. Mais Jacob, Lévi, Juda et Joseph étaient dans la maison auprès d’Isaac, leur père, parce que son esprit était affligé et qu’ils ne pouvaient pas le quitter.
