  text: Robel and Tamnatares. And he returned in peace and made peace with them, and they became his
translation:
  language: fr
  text: Robel et Tamnatarès. Il revint en paix, fit la paix avec eux, et ils devinrent les siens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze comporte un suffixe signifiant « lui » ; le statut précis de leur relation avec lui n’est pas indiqué dans cet extrait.
    reason: Le suffixe final doit être conservé dans le sens, sans en déduire qu’ils sont nécessairement des serviteurs ou des tributaires.
lexical_decisions:
- source_word: ወተመይጠ፡ በሰላም
  choice: Il revint en paix
  rationale: Rend directement le verbe de retour et le complément de manière, dans un français naturel et fidèle.
- source_word: ወገብረ፡ ምስሌሆሙ፡ ሰላመ
  choice: fit la paix avec eux
  rationale: Conserve l’expression sémitique compréhensible en français et sa relation explicite avec le groupe concerné.
- source_word: ወኮንዎ
  choice: et ils devinrent siens
  rationale: Le suffixe objet masculin singulier -wo renvoie à « lui »; « devinrent siens » préserve la relation exprimée sans ajouter ici un nom tel que « serviteurs » ou « tributaires ».
theological_decisions:
- issue: Nature exacte de la relation finale
  choice: ils devinrent siens
  alternative: ils devinrent ses serviteurs / ses tributaires
  rationale: Le texte transmis marque une relation à son égard, mais l’extrait ne nomme pas explicitement leur statut; il convient de ne pas préciser davantage.
translation_notes:
  register: Français moderne, digne et accessible. Les noms propres suivent une translittération lisible; la formulation finale conserve l’inachèvement sémantique apparent du passage sans supprimer le suffixe relationnel guèze.
