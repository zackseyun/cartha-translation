  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
translation:
  language: fr
  text: 'Ils vinrent auprès de Joseph et se prosternèrent tous devant lui, le visage contre terre. Joseph leur dit : « Vous avez mal agi. » Ils répondirent : « Que pouvons-nous dire ? Comment pourrions-nous nous disculper ? Notre Seigneur a découvert leur faute[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur faute ». D’après le contexte, il pourrait s’agir de la faute des hommes qui parlent, donc de « notre faute »; la formulation « la faute de tes serviteurs » se trouve aussi dans la tradition parallèle.'
    reason: Signaler la discordance entre le suffixe guèze de troisième personne du pluriel et le sens attendu dans le contexte, sans la résoudre silencieusement.
lexical_decisions:
- source_word: ሰገዱ (sagadu)
  choice: se prosternèrent
  rationale: Le verbe exprime une prosternation ou un hommage corporel, précisé ici par « le visage contre terre ».
- source_word: እኩየ፡ ገበርክሙ
  choice: Vous avez mal agi
  rationale: Rend naturellement l’idée d’avoir fait le mal sans renforcer le texte par une qualification plus précise.
- source_word: ንትዋቀስ
  choice: nous disculper
  rationale: Dans ce contexte judiciaire, le verbe évoque l’action de se défendre ou de se déclarer innocent.
- source_word: እግዚእነ
  choice: Notre Seigneur
  rationale: Le possessif est explicitement à la première personne du pluriel. La majuscule suit le contexte de l’allusion à Dieu, tout en conservant le titre « Seigneur ».
- source_word: አበሳሆሙ
  choice: leur faute
  rationale: Le nom porte dans le texte fourni un suffixe de troisième personne du pluriel, littéralement « leur faute »; cette forme difficile est conservée plutôt que corrigée silencieusement d’après le contexte.
theological_decisions:
- issue: Référent de « notre Seigneur »
  choice: Notre Seigneur, compris comme Dieu
  alternative: notre seigneur, compris comme Joseph
  rationale: La forme signifie « notre Seigneur » et le parallèle narratif de Genèse 44.16 oriente vers Dieu. La majuscule rend cette lecture probable sans remplacer le titre par « Dieu ».
- issue: Personne grammaticale dans la dernière proposition
  choice: leur faute
  alternative: notre faute / la faute de tes serviteurs
  rationale: Le texte guèze transmis dans la demande porte un suffixe de troisième personne plurielle. Bien que le contexte favorise une référence aux frères eux-mêmes, une correction dans le corps du texte effacerait une difficulté réelle de la source fournie.
translation_notes:
  register: Français moderne, sobre et narratif. « Se prosternèrent » et « le visage contre terre » conservent la dignité et la précision du geste; « nous disculper » rend clairement la nuance judiciaire. La difficulté pronominale finale est maintenue dans le texte et explicitée en note.
