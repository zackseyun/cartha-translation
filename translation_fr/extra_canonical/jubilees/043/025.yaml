  text: over all the land of Egypt. And their father did not believe them, for his mind was stunned. But when he saw the wagons that Joseph had sent, the life of his spirit was renewed, and he said, "It is enough for me if Joseph is alive. I will go down and see him before I die."
translation:
  language: fr
  text: 'sur tout le pays d’Égypte. Leur père ne les crut pas, car son esprit était frappé de stupeur. Mais lorsqu’il vit les chariots que Joseph avait envoyés, la vie de son esprit se renouvela, et il dit : « Il me suffit que Joseph soit vivant. Je descendrai le voir avant de mourir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደንገፀ፡ በሕሊናሁ
  choice: son esprit était frappé de stupeur
  rationale: Rend l’état de saisissement ou d’engourdissement intérieur exprimé par le verbe et le terme désignant la pensée, sans réduire le sens à une simple hésitation.
- source_word: ሰረገላተ
  choice: les chariots
  rationale: Terme naturel et historiquement approprié pour les véhicules envoyés par Joseph.
- source_word: ተሐደሰት፡ ሕይወተ፡ መንፈሱ
  choice: la vie de son esprit se renouvela
  rationale: Conserve l’expression inhabituelle mais signifiante du guèze, au lieu de la remplacer par une paraphrase telle que « il reprit courage ».
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ
  choice: Il me suffit
  rationale: Exprime idiomatiquement en français l’idée de suffisance portée par la formule, sans ajouter de référent absent.
- source_word: እረድ
  choice: Je descendrai
  rationale: Préserve le mouvement géographique traditionnel vers l’Égypte et la formulation explicite de la source.
theological_decisions:
- issue: Rapport entre la vie et l’esprit du père
  choice: la vie de son esprit se renouvela
  alternative: il reprit courage
  rationale: La traduction retient la formulation anthropologique de la source et sa possible tension entre « vie » et « esprit », plutôt que de l’interpréter exclusivement comme un regain émotionnel.
