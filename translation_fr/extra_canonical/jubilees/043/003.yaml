  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
translation:
  language: fr
  text: 'Quand ils furent partis de là, Joseph dit à l’intendant de sa maison : « Poursuis-les, cours et rattrape-les. Tu leur diras : “Au lieu du bien, vous m’avez rendu le mal ; vous m’avez volé la coupe d’argent dans laquelle mon seigneur boit.” Puis ramène-moi leur plus jeune frère et ramène-le vite, avant que j’entre dans mon jugement[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin du verset est difficile dans cette division du texte. Elle semble exprimer l’ordre pressant de ramener aussitôt le plus jeune frère avant que l’affaire ne soit jugée ; le sens exact de l’expression traduite par « entrer dans mon jugement » reste incertain.
    reason: segmentation_note
lexical_decisions:
- source_word: ለብእሲ፡ ቤቱ
  choice: à l’intendant de sa maison
  rationale: Littéralement « à l’homme de sa maison » ; dans ce contexte, il s’agit du responsable de la maison de Joseph. « Intendant » est naturel et précis en français.
- source_word: ደግፎሙ፡ ሩጽ፡ ወተአንዞሙ
  choice: Poursuis-les, cours et rattrape-les
  rationale: Conserve les trois impératifs successifs et leur effet d’urgence, sans introduire l’idée absente de « se lever ».
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ
  choice: Au lieu du bien, vous m’avez rendu le mal
  rationale: ህየንተ signifie « au lieu de » ; la formulation maintient l’opposition directe entre le bien et le mal.
- source_word: ሠረቅክሙኒ
  choice: vous m’avez volé
  rationale: Le suffixe de première personne est explicitement rendu par « m’ ».
- source_word: ወአገብአ፡ ሊተ፡ ለአኁሆሙ፡ ዘይንእስ
  choice: Puis ramène-moi leur plus jeune frère
  rationale: 'La troisième personne « leur » est conservée : cette proposition est un ordre de Joseph à l’intendant, et non la suite des paroles que celui-ci doit adresser aux frères.'
- source_word: ዘእንበለ
  choice: avant que
  rationale: Rend le sens temporel « avant », plutôt qu’une finalité négative telle que « de peur que ».
- source_word: ውስተ፡ ምኵናንየ
  choice: j’entre en jugement
  rationale: Traduction proche de l’expression littérale « entrer dans mon jugement », formulée de manière intelligible en français tout en signalant son incertitude en note.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. Les impératifs brefs conservent l’urgence du guèze. Les limites de la citation ont été respectées : les paroles destinées aux frères s’arrêtent après la mention de la coupe, puis Joseph reprend son ordre à l’intendant.'
