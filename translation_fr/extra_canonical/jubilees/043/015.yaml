  text: And he could no longer restrain himself, and told them that he was Joseph. And he spoke with them in the Hebrew language.
translation:
  language: fr
  text: Il ne put plus se contenir[a] et leur révéla qu’il était Joseph. Puis il leur parla en hébreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le texte guèze conservé porte : « Il se contint ». Le contexte semble toutefois appeler la négation : « Il ne put plus se contenir ».'
    reason: Préserver la lecture du texte transmis tout en rendant le sens contextuellement probable, parallèle à Genèse 45.1.
lexical_decisions:
- source_word: ተዐገሦ
  choice: Il ne put plus se contenir
  rationale: La forme guèze signifie littéralement « il se contint », mais le contexte de la révélation de Joseph et le parallèle de Genèse 45.1 exigent vraisemblablement un sens négatif; l’ambiguïté textuelle est signalée en note.
- source_word: ነገሮሙ
  choice: leur révéla
  rationale: Le verbe signifie « leur dit/annonça ». « Leur révéla qu’il était Joseph » rend naturellement l’annonce de son identité sans ajouter de contenu.
- source_word: በከመ፡ ልሳነ፡ ዕብራይስጥ
  choice: en hébreu
  rationale: Expression idiomatique correspondant à « dans la langue hébraïque »; la formulation concise est naturelle en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Se contenir » conserve l’idée de maîtrise de soi; « en hébreu » évite le calque plus lourd « dans la langue hébraïque ».
