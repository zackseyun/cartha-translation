  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
translation:
  language: fr
  text: Notre père l’aime, et sa vie est liée à la sienne. Lorsque nous irons auprès de ton serviteur, notre père, si le garçon n’est pas avec nous, il mourra, et nous accablerons notre père d’un chagrin qui le mènera à la mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሱኒ፡ እስርት፡ እምነፍስዝ
  choice: sa vie est liée à la sienne
  rationale: Rend naturellement l’image de la vie — ou de l’âme — du père attachée à celle du garçon, sans préciser davantage le référent que ne le fait le texte.
- source_word: ወሬዛ
  choice: le garçon
  rationale: Désigne ici le jeune Benjamin; « le garçon » est clair, courant et fidèle au contexte.
- source_word: ይመውት
  choice: il mourra
  rationale: Le texte porte simplement un verbe à la troisième personne, sans substantif équivalent à « le vieillard »; le contexte désigne le père.
- source_word: ንቀጽዕ
  choice: nous accablerons
  rationale: Le verbe signifie affliger ou faire souffrir. « Accabler de chagrin » convient au contexte sans importer le verbe différent « faire descendre » du passage parallèle de la Genèse.
- source_word: በሐዘን፡ እስክ
  choice: de chagrin jusqu’à la mort
  rationale: Conserve l’idée d’une affliction poussée jusqu’à la mort, telle qu’elle ressort de la leçon transmise et de la continuité du passage.
theological_decisions: []
