  text: And he ran after them and spoke to them according to this word. And they said to him, "Far be it from your servants to do this thing, and to steal from your lord's house any money or gold. The money that we found before in our sacks we, your servants, brought back from the land
translation:
  language: fr
  text: 'Il courut après eux et leur parla ainsi. Ils lui répondirent : « Loin de tes serviteurs l’idée de faire une chose pareille et de dérober quoi que ce soit de la maison de ton maître, de l’argent ou de l’or ! L’argent que nous avions trouvé auparavant dans nos sacs, nous, tes serviteurs, l’avons rapporté du pays… »[a]'
