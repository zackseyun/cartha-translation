    reason: Signaler honnêtement la coupure éditoriale du verset sans compléter le texte à partir du passage parallèle.
lexical_decisions:
- source_word: በከመ፡ ዝንቱ፡ ነገር
  choice: leur rapporta ces paroles
  rationale: Rend naturellement la formule « selon cette parole », c’est-à-dire conformément au message ou aux paroles qui précèdent.
- source_word: ሐሰ፡ ሎሙ፡ ለአግብርቲከ
  choice: Loin de tes serviteurs l’idée de
  rationale: Expression française actuelle et digne qui conserve le rejet énergique exprimé par la formule guèze.
- source_word: ምነተኒ፡ ንዋየ፡ ወወርቀኒ
  choice: quelque bien que ce soit, argent ou or
  rationale: ንዋይ peut désigner les biens, la richesse ou l’argent; cette formulation évite de l’harmoniser indûment avec « argent-métal » dans Genèse 44:8, tout en conservant l’énumération du texte.
- source_word: ዘረከብነ፡ ቀዳሙ፡ ውስተ፡ አኅጢነ
  choice: L’argent que nous avions trouvé auparavant dans nos sacs
  rationale: Le contexte immédiat précise la nature du bien trouvé et le retour antérieur; le plus-que-parfait exprime clairement l’antériorité.
