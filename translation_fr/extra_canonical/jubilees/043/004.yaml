revisions:
- from: 'Il courut après eux et leur rapporta ces paroles. Ils lui répondirent : « Loin de tes serviteurs l’idée de faire une chose pareille et de voler dans la maison de ton maître quelque bien que ce soit, argent ou or ! L’argent que nous avions trouvé auparavant dans nos sacs, nous, tes serviteurs, l’avons rapporté du pays… »[a]'
  to: 'Il courut après eux et leur parla ainsi. Ils lui répondirent : « Loin de tes serviteurs l’idée de faire une chose pareille et de dérober quoi que ce soit de la maison de ton maître, de l’argent ou de l’or ! L’argent que nous avions trouvé auparavant dans nos sacs, nous, tes serviteurs, l’avons rapporté du pays… »[a]'
  rationale: 'La révision corrige deux nuances de sens sans modifier la portée du texte : l’intendant s’adresse directement aux frères, et ceux-ci nient avoir dérobé de l’argent ou de l’or provenant de la maison de leur maître. La suspension finale et sa note sont maintenues.'
