  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
translation:
  language: fr
  text: Descendez vite, vous et vos maisonnées, afin de ne pas être anéantis par la famine et de ne pas être accablés à cause de vos biens. Car Dieu m’a envoyé devant vous pour assurer la survie[a], afin qu’ils vivent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour préserver un reste »; l’expression peut aussi signifier plus généralement « pour la préservation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ፍጡነ፡ ረዱ
  choice: Descendez vite
  rationale: Rend directement l’adverbe « vite » et l’impératif pluriel « descendez », dans un français naturel.
- source_word: አብያቲከሙ
  choice: vos maisonnées
  rationale: Le terme désigne ici les maisons au sens collectif des foyers et de leurs membres, plutôt que les seuls bâtiments.
- source_word: ኢትትሐጐሉ፡ በዐባር
  choice: ne pas être anéantis par la famine
  rationale: Exprime la destruction ou la consommation causée par la famine, sans confondre ce verbe avec celui de la proposition suivante.
- source_word: ኢትትከዙ
  choice: ne pas être accablés
  rationale: Le verbe signifie être triste, affligé ou dans la détresse, et non périr.
- source_word: ለሠሪዕ
  choice: pour assurer la survie
  rationale: Formulation contextuelle qui conserve l’idée de préservation; la possibilité plus spécifique d’un « reste » est signalée en note.
- source_word: ይሕየዉ
  choice: qu’ils vivent
  rationale: Respecte la troisième personne du pluriel et la valeur non causative du verbe guèze.
theological_decisions:
- issue: Référent du pluriel final
  choice: afin qu’ils vivent
  alternative: afin qu’il vous garde en vie
  rationale: La forme guèze est à la troisième personne du pluriel et signifie littéralement « qu’ils vivent »; elle ne justifie ni un sujet divin singulier ni une construction causative.
- issue: Portée de ለሠሪዕ
  choice: pour assurer la survie
  alternative: pour préserver un reste
  rationale: Le contexte favorise la survie ou la préservation, mais la nuance possible de « reste » ne doit pas être transformée en affirmation doctrinale explicite; elle demeure en note.
translation_notes:
  register: Français international moderne, clair et digne. « Maisonnées » conserve la dimension collective de « maisons ». La finale garde le pluriel quelque peu énigmatique de la source au lieu de l’expliciter par une paraphrase.
