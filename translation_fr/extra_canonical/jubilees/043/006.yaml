translation:
  language: fr
  text: '« Nous serons les esclaves de notre seigneur. » Il leur dit : « Il n’en sera pas ainsi. Seul l’homme chez qui je l’ai trouvé… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ
  choice: nous serons les serviteurs
  rationale: Le verbe exprime ici le fait de servir ou d’être assujetti; « serviteurs » garde la dignité du registre tout en rendant clairement la proposition de soumission.
- source_word: ለእግዚእነ
  choice: de notre seigneur
  rationale: Rend littéralement le rapport à « notre seigneur », sans imposer une référence divine; la minuscule convient au maître humain dans le contexte.
- source_word: አኮ፡ ከማሁ
  choice: Non, pas ainsi
  rationale: Expression de refus suivie du rejet de la proposition formulée par les frères.
- source_word: በኀበ፡ ብእሲ
  choice: l’homme chez qui
  rationale: La préposition locale est naturellement rendue en français par « chez qui ».
- source_word: ዘረከብክዎ
  choice: je l’ai trouvé
  rationale: La forme verbale est active, à la première personne du singulier, avec un objet pronominal; elle ne doit pas être transformée en passif.
- source_word: ኪያሁ፡ ባሕቲቶ
  choice: seul
  rationale: La combinaison emphatique isole explicitement cet homme de tous les autres.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Serviteurs » a été retenu plutôt que « esclaves » pour conserver l’amplitude contextuelle du terme sans atténuer l’idée de soumission. Le fragment demeure inachevé, conformément au découpage du verset fourni.
