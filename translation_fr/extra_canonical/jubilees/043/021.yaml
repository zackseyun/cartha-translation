  text: and over all the land of Egypt. And tell my father of all my honor and of all that has been given to me."
translation:
  language: fr
  text: « et sur tout le pays d’Égypte. Faites connaître à mon père toute ma gloire et tout ce qui m’a été donné. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክብረየ
  choice: toute ma gloire
  rationale: Le nom ክብር peut désigner l’honneur, la gloire ou la dignité. Dans ce contexte, il évoque le rang élevé et le prestige de Joseph en Égypte; « gloire » conserve cette ampleur sans ajouter de précision absente du texte.
- source_word: ዜንውዎ፡ ለአቡየ
  choice: Racontez à mon père
  rationale: Le verbe signifie rapporter ou raconter. Cette formulation française exprime naturellement le contenu que les frères doivent communiquer au père.
- source_word: ዘመጠነ፡ ወሀበኒ
  choice: ce qu’il m’a attribué et donné
  rationale: 'La traduction conserve les deux verbes du guèze: l’idée d’attribuer ou d’allouer, puis celle de donner. Elle évite l’expansion interprétative en « richesse » ou en « grandeur ».'
theological_decisions:
- issue: Identité du sujet implicite de « il m’a attribué et donné »
  choice: Maintenir le pronom « il » sans identifier son référent
  alternative: Préciser « Dieu m’a attribué et donné » ou « le pharaon m’a attribué et donné »
  rationale: La forme verbale indique un sujet masculin singulier, mais le fragment fourni ne le nomme pas. Identifier ce sujet résoudrait indûment une ambiguïté du texte.
translation_notes:
  register: Français international moderne, fluide et digne. Le début fragmentaire (« et sur tout le pays d’Égypte ») est conservé, puisqu’il poursuit syntaxiquement le verset précédent. Le discours direct est ponctué selon l’usage français.
