  naturalness: '« Racontez à mon père toute ma gloire » n’est pas idiomatique : en français, on raconte quelque chose à quelqu’un, mais l’on informe quelqu’un de son honneur/de sa gloire ou on le lui fait connaître. « Faites connaître à mon père… » est naturel, soutenu sans être archaïque, et convient au contexte.'
