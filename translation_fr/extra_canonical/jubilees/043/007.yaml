  text: I will take him as a servant, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
translation:
  language: fr
  text: « Je le prendrai comme esclave, et vous, retournez en paix chez vous. » Puis ils fouillèrent leurs bagages, en commençant par l’aîné et en finissant par le plus jeune, et on le trouva dans le sac de Benjamin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እነሥእ፡ ገብረ
  choice: Je le prendrai comme esclave
  rationale: Le verbe est à la première personne du singulier et à la voix active; ገብረ désigne ici la condition servile.
- source_word: ተአትዉ፡ በሰላም፡ ቤቲክሙ
  choice: retournez en paix chez vous
  rationale: Formulation française naturelle qui conserve l’idée d’aller paisiblement vers ses maisons.
- source_word: ይፈትኑ፡ ውስተ፡ ንዋዮሙ
  choice: ils fouillèrent leurs bagages
  rationale: Dans ce contexte, le verbe exprime une recherche ou inspection parmi leurs effets; « bagages » est idiomatique en français.
- source_word: እምዘ፡ ይልህቅ፡ ቀደሙ፡ ወፈጸሙ፡ በኀበ፡ ዘይንእስ
  choice: en commençant par l’aîné et en finissant par le plus jeune
  rationale: Reproduit explicitement l’ordre de la fouille, du plus âgé au plus jeune.
- source_word: ወተረክበ፡ ውስተ፡ ሐስለ፡ ብንያም
  choice: et l’objet fut trouvé dans le sac de Benjamin
  rationale: Le passif est conservé. L’ajout minimal de « l’objet » évite un sujet impersonnel obscur sans préciser au-delà de ce que donne ce verset.
theological_decisions:
- issue: Statut imposé à Benjamin
  choice: Je le prendrai comme esclave
  alternative: Il sera pris comme esclave
  rationale: La forme guèze est active à la première personne; le français ne doit pas transformer la déclaration de Joseph en passif.
translation_notes:
  register: Français moderne, international et digne. Discours direct ferme, suivi d’un récit fluide. « Esclave » rend clairement la condition servile; « serviteur » l’atténuerait dans ce contexte.
