  text: And he embraced their necks and wept[16], but they did not recognize him, and they also wept. And he said to them,
translation:
  language: fr
  text: 'Il les serra dans ses bras et pleura contre leur cou ; mais eux ne le reconnurent pas[a] et se mirent eux aussi à pleurer. Et il leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le fait qu’ils ne le reconnaissent pas peut traduire soit leur stupeur persistante, soit une reconnaissance complète encore retardée au moment où Joseph révèle son identité.
    reason: alternative_reading
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳውዲሆሙ
  choice: Il les prit dans ses bras, pleura sur leur cou
  rationale: Le verbe exprime l’action d’étreindre, et ክሳውዲሆሙ désigne leur cou au pluriel distributif. Cette formulation naturelle conserve les deux gestes successifs.
- source_word: ኢያእመርዎ
  choice: ils ne le reconnurent pas
  rationale: Dans ce contexte de dévoilement d’identité, « reconnaître » rend mieux le sens que le simple « connaître », tout en préservant la difficulté narrative.
- source_word: አንከ፡ ይብከዩ
  choice: se mirent aussi à pleurer
  rationale: « Aussi » traduit la réciprocité indiquée par አንከ ; la tournure idiomatique française exprime leur réaction sans ajouter de cause.
- source_word: ወይቤሎሙ
  choice: Puis il leur dit
  rationale: Formule introductive de discours laissée ouverte, comme dans la source.
theological_decisions:
- issue: Non-reconnaissance persistante après le dévoilement de Joseph
  choice: mais eux ne le reconnurent pas
  alternative: mais ils ne l’avaient pas reconnu
  rationale: Le texte source présente une négation verbale directe dans la séquence narrative. Le passé simple maintient cette tension au lieu de la déplacer explicitement vers un état antérieur.
translation_notes:
  register: Français international moderne, narratif et digne. « Prendre dans ses bras » évite la raideur de « embrasser leurs cous », tandis que « sur leur cou » conserve l’image corporelle de la source. Le marqueur [a] est placé après la proposition de pleurs afin de correspondre à la note transmise tout en éclairant la difficulté de la proposition suivante.
