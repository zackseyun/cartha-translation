  to: 'Joseph conçut un plan pour connaître leurs pensées, pour voir s’il y avait entre eux une pensée de paix. Il dit à l’homme qui était à la tête de sa maison : « Remplis de grain tous leurs sacs, remets leur argent au milieu de leurs sacs, puis dépose ma coupe d’argent, celle dont je bois, dans le sac du plus jeune. » Ensuite, il les laissa partir.'
