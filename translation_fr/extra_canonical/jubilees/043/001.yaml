  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
translation:
  language: fr
  text: 'Joseph conçut un plan pour connaître leurs pensées, pour voir s’il y avait entre eux une pensée de paix. Il dit à l’homme qui était à la tête de sa maison : « Remplis de grain tous leurs sacs, remets leur argent au milieu de leurs sacs, puis dépose ma coupe d’argent, celle dont je bois, dans le sac du plus jeune. » Ensuite, il les laissa partir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለየ፡ ... ሕሊና
  choice: conçut un plan
  rationale: La construction associe l’idée de penser ou concevoir à un dessein; cette formulation française exprime naturellement l’élaboration intentionnelle d’un moyen d’éprouver les frères.
- source_word: ያአምር፡ ሕሊናሆሙ
  choice: pour découvrir leurs pensées
  rationale: Rend le but du plan et conserve le champ mental de ሕሊና, sans réduire le sens à une simple connaissance factuelle.
- source_word: ሕሊና፡ ሰላም
  choice: des intentions pacifiques
  rationale: Littéralement, une « pensée de paix »; l’expression française choisie transmet le sens relationnel tout en gardant ouverte la question de leur disposition intérieure.
- source_word: ወርቆሙኒ፡ አግብእ፡ ሎሙ
  choice: remets leur argent
  rationale: Le verbe exprime le retour ou la restitution; « remets » évite l’harmonisation avec le simple « mets » de Genèse 44:1.
- source_word: ማእከለ፡ መዋዲቶሙ
  choice: au milieu de leurs bagages
  rationale: Le texte porte des formes plurielles possessives; « bagages » conserve le sens général du contenant, tandis que la note signale une autre traduction possible.
- source_word: ኮራ፡ ዘብሩር
  choice: la coupe d’argent
  rationale: Traduction directe de la matière de la coupe, avec l’apposition française naturelle.
- source_word: ፈነዎሙ
  choice: il les laissa partir
  rationale: Rend l’idée de renvoyer ou laisser partir dans ce contexte narratif.
theological_decisions:
- issue: Nature de la disposition recherchée chez les frères
  choice: « des intentions pacifiques »
  alternative: « une pensée de paix »
  rationale: La formulation retenue est idiomatique en français tout en préservant l’idée que Joseph cherche à discerner leur disposition mutuelle, sans préciser davantage sa portée morale ou théologique.
