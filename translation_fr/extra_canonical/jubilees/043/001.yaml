  - severity: low
    issue: Note [a] redondante et inversant inutilement le rapport entre texte et variante
    rationale: Le texte principal emploie « bagages », tandis que la note propose « sacs », qui est la restitution contextuellement plus précise. Il est préférable de mettre « sacs » dans le texte et de supprimer cette note non nécessaire.
  - severity: low
    issue: Paraphrase légèrement explicative de la pensée de paix
    rationale: « Des intentions pacifiques » est acceptable, mais « une pensée de paix » préserve mieux la répétition et la formulation mentale du guèze, sans interpréter davantage la disposition des frères.
