  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your servant, remain alone instead of the boy as a servant to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your servant, our father. And if I do not bring him back, your servant will bear the blame before our father all our days.’
translation:
  language: fr
  text: Que moi, ton serviteur, je reste seul à la place du garçon, comme esclave de mon seigneur, et que le jeune homme parte avec ses frères. Car je me suis porté garant de lui auprès de ton serviteur, notre père[a]. Si je ne le ramène pas, moi, ton serviteur, j'en porterai la responsabilité devant notre père tous les jours de ma vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze transmis est condensé et irrégulier dans cette clause, où figurent les expressions « ton serviteur » et « notre père ». La traduction en conserve la formulation sans trancher entièrement la relation syntaxique. Le parallèle de Genèse 44.32-33 éclaire le contexte — Juda s’est porté garant du jeune homme — mais ne permet pas de régulariser avec certitude tous les détails du texte transmis.
    reason: segmentation_note
lexical_decisions:
- source_word: ገብርከ / ገብረ
  choice: ton serviteur / comme esclave
  rationale: Le terme guèze désigne une personne au service ou sous l’autorité d’une autre. «Serviteur» convient à la formule de déférence adressée au seigneur, tandis que «esclave» exprime clairement l’offre de Juda de demeurer à la place du garçon.
- source_word: ይኅደር (forme transmise irrégulièrement dans le passage)
  choice: je reste seul
  rationale: Le contexte et la comparaison avec Genèse 44.33 indiquent que Juda demande à demeurer sur place à la place du garçon; «seul» rend l’élément emphatique du texte transmis.
- source_word: ህየንቴሁ ለሕፃን
  choice: à la place du garçon
  rationale: Rend directement la substitution proposée par Juda.
- source_word: ወሬዛ
  choice: le jeune homme
  rationale: Désignation naturelle de Benjamin dans ce contexte, en variation avec «le garçon».
- source_word: ተሀበይክዎ
  choice: je me suis porté garant de lui
  rationale: Le sens contextuel est celui de se constituer caution ou garant pour Benjamin, conformément au discours de Juda en Genèse 44.32.
- source_word: ይሌብከ
  choice: je porterai cette faute
  rationale: Exprime l’idée de supporter durablement la culpabilité ou le blâme si Benjamin n’est pas ramené.
- source_word: ኵሎነ መዋዕለ
  choice: tous les jours de notre vie
  rationale: Formule idiomatique française qui conserve la portée collective et durable du guèze.
theological_decisions:
- issue: Statut proposé par Juda
  choice: comme esclave de mon seigneur
  alternative: comme serviteur de mon seigneur
  rationale: «Esclave» maintient la gravité concrète de la substitution offerte, sans réduire le terme à une simple politesse.
- issue: Nature de la responsabilité de Juda
  choice: je porterai cette faute devant notre père
  alternative: j’en serai coupable devant notre père
  rationale: «Porter cette faute» préserve l’image de la charge durable sans préciser davantage la nature juridique ou morale de la culpabilité.
translation_notes:
  register: Français moderne, digne et accessible. La distinction entre «serviteur», dans les formules de déférence, et «esclave», dans l’offre de substitution, conserve à la fois le registre de cour et la force de l’engagement de Juda.
