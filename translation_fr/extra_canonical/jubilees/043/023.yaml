  text: And he gave all of them changes of garments and silver[23]. And to their father also he sent garments and silver.
translation:
  language: fr
  text: Il leur donna à tous des vêtements de rechange[a] et de l’argent. À leur père aussi, il envoya des vêtements et de l’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze peut aussi se traduire par « vêtements variés » ou « vêtements de couleur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: አልባሰ፡ ኅብር
  choice: des vêtements de rechange
  rationale: L’expression guèze associe « vêtements » à un terme pouvant désigner la variété, la couleur ou le changement. Dans ce contexte parallèle à Genèse 45.22, « vêtements de rechange » restitue naturellement l’expression idiomatique sans exclure les autres nuances, signalées en note.
- source_word: ብሩረ
  choice: de l’argent
  rationale: Le terme désigne ici le métal précieux ou une quantité d’argent remise avec les vêtements; le français « argent » conserve cette portée.
- source_word: ፈነወ
  choice: il envoya
  rationale: Rend directement le verbe guèze exprimant l’envoi, en maintenant la distinction avec le don mentionné dans la première phrase.
