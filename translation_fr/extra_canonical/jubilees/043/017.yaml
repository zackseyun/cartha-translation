  text: Do not weep over me, but hurry and bring my father to me, and you see that it is my mouth that speaks, and the eyes of my brother Benjamin also see. For behold, this is the second year of the famine,
translation:
  language: fr
  text: Ne pleurez pas sur moi. Hâtez-vous d’amener mon père auprès de moi. Vous voyez[a] que c’est bien ma bouche qui parle, et les yeux de mon frère Benjamin le voient aussi. Car voici la deuxième année de famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous verrez ».'
    reason: La forme verbale peut recevoir une valeur présente ou future ; le contexte immédiat favorise le présent sans exclure entièrement le futur.
lexical_decisions:
- source_word: ኢትብከዩ፡ ላዕሌየ
  choice: Ne pleurez pas sur moi
  rationale: Rend directement l’interdiction et la préposition, dans un français naturel et digne.
- source_word: ወአፍጥኑ፡ ወእምጽእዎ፡ ለአቡየ፡ ኀቤየ
  choice: Hâtez-vous plutôt d’amener mon père auprès de moi
  rationale: « Hâtez-vous » conserve l’urgence de አፍጥኑ; « plutôt » exprime naturellement en français le contraste pragmatique avec l’ordre négatif précédent, sans ajouter une nouvelle idée.
- source_word: ወትሬእዩ
  choice: Vous voyez
  rationale: L’imparfait éthiopien peut avoir une valeur présente ou future; le présent convient ici à la constatation immédiate.
- source_word: ዘይነብብ፡ አፉየ
  choice: que c’est bien ma bouche qui vous parle
  rationale: La tournure emphatique française reproduit l’identification de « ma bouche » comme celle qui parle; « vous » explicite seulement les destinataires déjà présents dans la scène.
- source_word: ወአዕይንቲሁኒ፡ ለአኁየ፡ ብንያም፡ ይሬእያ
  choice: et les yeux de mon frère Benjamin le voient aussi
  rationale: Conserve l’image concrète des yeux de Benjamin et la particule additive « aussi », tout en donnant au verbe un complément français naturel.
- source_word: እስመ፡ ናሁ፡ ዝንቱ፡ ካልእ፡ ዓም፡ ዘዐባር
  choice: Car voici la deuxième année de famine
  rationale: Rend እስመ par « car », ናሁ par « voici », et traduit directement l’expression temporelle sans introduire les cinq années restantes absentes du texte fourni.
