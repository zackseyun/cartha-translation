  yaml_path: translation/extra_canonical/jubilees/043/002.yaml
  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
translation:
  language: fr
  text: 'Il fit ce que Joseph lui avait dit : il remplit de céréales tous leurs sacs, remit leur argent[a] dans leurs sacs et plaça la coupe dans le sac de Benjamin. Quand le jour se leva, ils partirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur or ».'
    reason: La traduction principale rend la fonction monétaire du terme, tandis que la note préserve son sens lexical concret.
lexical_decisions:
- source_word: ሲሊተ
  choice: céréales
  rationale: Le terme désigne ici du grain destiné à l’alimentation; « céréales » est naturel en français moderne et convient au contexte des provisions.
- source_word: ወርቆሙ
  choice: leur argent
  rationale: Le sens lexical premier est « leur or », mais l’objet est ici la somme remise en paiement; « leur argent » exprime naturellement sa fonction dans le récit, avec une note conservant la forme littérale.
- source_word: ኮራ
  choice: la coupe
  rationale: Le contexte parallèle du récit de Joseph désigne le récipient placé dans le sac de Benjamin; « coupe » est le terme français courant et précis.
- source_word: አሕስሊሆሙ / ሐስለ
  choice: leurs sacs / le sac
  rationale: Le terme désigne les contenants utilisés pour transporter les céréales; « sac » rend clairement le référent et respecte l’alternance pluriel-singulier.
