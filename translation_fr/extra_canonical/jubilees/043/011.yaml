  to: 'Et Juda dit : « Je t’en prie, mon seigneur, permets à ton serviteur de dire un mot à l’oreille de mon seigneur. Sa mère a mis au monde deux frères pour ton serviteur, notre père.[a] L’un est parti et s’est perdu, et personne ne l’a retrouvé. Lui seul est resté de sa mère, et ton serviteur… »'
  rationale: La révision explicite l’enfantement attesté dans le source et améliore l’idiomaticité de l’expression « à l’oreille », tout en préservant « deux frères », la formulation inhabituelle de la relation familiale et l’inachèvement de la phrase. La note conserve l’alternative interprétative sans l’imposer au texte principal.
