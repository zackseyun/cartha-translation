  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
translation:
  language: fr
  text: 'Et Juda dit : « Je t’en prie, mon seigneur, permets à ton serviteur de dire un mot à l’oreille de mon seigneur. Sa mère a mis au monde deux frères pour ton serviteur, notre père.[a] L’un est parti et s’est perdu, et personne ne l’a retrouvé. Lui seul est resté de sa mère, et ton serviteur… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Notre père, ton serviteur, a eu deux fils d’une même mère. »'
    reason: La construction guèze mentionne littéralement « sa mère », « deux frères » et l’enfantement, mais elle peut aussi s’entendre, dans un français familial plus idiomatique, comme désignant deux fils nés de la même mère.
lexical_decisions:
- source_word: ሳዕሌየ፡ እግዚኦ
  choice: Je t’en prie, mon seigneur
  rationale: Rend la supplication respectueuse dans un français naturel et digne.
- source_word: አትናገር፡ ገብርከ፡ ቃለ፡ ውስተ፡ እዝነ፡ እግዚእየ
  choice: permets à ton serviteur de dire un mot aux oreilles de mon seigneur
  rationale: Conserve l’image sémitique de la parole portée aux oreilles du supérieur, tout en explicitant naturellement la valeur permissive de la demande.
- source_word: ክልኤተ፡ አኀወ፡ ወለደት፡ እሙ
  choice: Sa mère a donné deux frères
  rationale: 'Préserve les éléments lexicaux précis du guèze : « sa mère », le verbe d’enfantement et « deux frères », sans les remplacer dans le texte principal par « deux fils d’une même mère ».'
- source_word: ወፅአ፡ ወተገደፈ
  choice: est parti et s’est perdu
  rationale: Rend littéralement la sortie puis la disparition/perte, sans préciser une mort que le passage ne formule pas explicitement.
- source_word: ባሕቲቱ፡ ተረፈ፡ እምእሙ
  choice: Lui seul est resté de sa mère
  rationale: Maintient la formulation concise et légèrement inhabituelle du texte source, qui souligne qu’il est l’unique survivant restant de cette mère.
theological_decisions:
- issue: Sort du frère disparu
  choice: s’est perdu
  alternative: est mort / a été déchiré
  rationale: Le guèze de ce segment exprime la perte ou la disparition et ajoute que personne ne l’a retrouvé; la traduction ne résout donc pas la situation en affirmant explicitement sa mort.
- issue: Lien familial dans la proposition sur les deux frères
  choice: Sa mère a donné deux frères à ton serviteur, notre père
  alternative: Notre père, ton serviteur, a eu deux fils d’une même mère
  rationale: Le choix principal suit de près la syntaxe et le lexique attestés, malgré une formulation moins idiomatique; la variante explique le sens familial possible sans remplacer le témoignage du texte.
translation_notes:
  register: Français international moderne, respectueux et narratif. Le tutoiement hiérarchique avec « mon seigneur » et « ton serviteur » conserve la rhétorique de cour. Les points de suspension signalent que le segment source s’achève sur une proposition incomplète (« et ton serviteur »).
