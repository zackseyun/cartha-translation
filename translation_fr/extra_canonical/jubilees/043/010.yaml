  text: his servants. Look, we are servants to our lord, we and our donkeys also." And Joseph said to them, "God forbid that I should do this[10]. You, go to your houses; but your youngest brother shall be my servant, because you have done evil. Did you not know that a man surely divines with his cup, as I do?
translation:
  language: fr
  text: 'ses esclaves. « Voici, nous sommes les esclaves de notre seigneur, nous et même nos ânes. » Joseph leur dit : « Que Dieu me garde d’agir ainsi[a] ! Vous, retournez chez vous ; mais votre plus jeune frère sera mon esclave, car vous avez fait le mal. Ne saviez-vous pas qu’un homme pratique bel et bien la divination avec sa coupe, comme je le fais ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule guèze traduite par « Que Dieu me garde d’agir ainsi ! » est difficile. Dans le contexte, Joseph refuse énergiquement la proposition selon laquelle tous deviendraient esclaves et déclare que le plus jeune frère restera son esclave.
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / ቅኔየ
  choice: esclaves / mon esclave
  rationale: Ces termes désignent ici une condition de servitude, non de simples domestiques ou employés ; « esclave » maintient la force sociale et juridique du passage.
- source_word: አእዱጊነሂ
  choice: même nos ânes
  rationale: Le suffixe inclusif et la particule additive sont rendus naturellement par « et même », en conservant l’offre emphatique des frères.
- source_word: እኑክሙ
  choice: votre plus jeune frère
  rationale: Dans le contexte narratif, le terme vise le cadet des frères, celui chez qui la coupe a été trouvée.
- source_word: ያስተቀስም
  choice: pratique bel et bien la divination
  rationale: Le verbe évoque explicitement la divination ; « bel et bien » restitue l’intensification de la construction.
- source_word: ጽዋዖ
  choice: avec sa coupe
  rationale: Le nom signifie « sa coupe » ; la préposition instrumentale est exprimée naturellement en français par « avec ».
theological_decisions:
- issue: Formule difficile après « Dieu » dans la réponse de Joseph
  choice: « Que Dieu me garde d’agir ainsi ! »
  alternative: « Dieu a empêché cela ; j’ai eu peur » ou une traduction plus littérale des formes conservées
  rationale: Le texte guèze transmis est difficile et paraît corrompu ou altéré. Le contexte exige une récusation énergique de la proposition selon laquelle tous deviendraient esclaves. La traduction retient ce sens contextuel sans faire de la formule une affirmation doctrinale plus précise, et signale l’incertitude en note.
- issue: Joseph et la divination
  choice: Conserver l’affirmation « comme moi » sans l’atténuer
  alternative: Présenter Joseph comme faisant seulement semblant de pratiquer la divination
  rationale: Le texte attribue directement la pratique au locuteur et ne précise pas ici s’il s’agit d’une réalité ou d’une mise en scène. La traduction préserve cette tension narrative et théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le début fragmentaire « ses esclaves » est conservé parce que le découpage du verset commence au milieu d’une phrase. Les dialogues restent directs, et le vocabulaire de l’esclavage ainsi que celui de la divination ne sont pas adoucis.
