lexical_decisions:
- source_word: ስርናየ
  choice: blé
  rationale: Le terme guèze désigne ici le grain ou le froment; « blé » convient naturellement au contexte du ravitaillement.
- source_word: ይበፍር
  choice: distribuait
  rationale: Le verbe exprime ici l’action de fournir ou distribuer le blé; cette formulation claire respecte le contexte.
- source_word: ይኴንን
  choice: gouvernait
  rationale: Le verbe signifie exercer l’autorité, gouverner ou juger. « Gouvernait » conserve la portée politique générale sans ajouter de titre.
