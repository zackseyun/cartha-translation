  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: fr
  text: 'Elle lui parla en ces termes : « Mon fils, ne prends pas pour femme l’une des filles de Canaan, comme l’a fait ton frère Ésaü, qui a pris deux femmes parmi les filles de Canaan. Par toute leur conduite impure, elles ont rempli mon esprit d’amertume. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ
  choice: ne prends pas pour femme
  rationale: Rend naturellement en français l’expression littérale « ne prends pas pour toi une femme », dans son sens matrimonial.
- source_word: እም፡ አዋልደ፡ ከናአን
  choice: l’une des filles de Canaan
  rationale: « Filles de Canaan » désigne ici les femmes cananéennes; « l’une des » explicite sobrement la valeur partitive de la préposition.
- source_word: ወእምረርዋ፡ ለመንፈሰያ
  choice: elles ont rempli mon esprit d’amertume
  rationale: Conserve l’image de l’amertume et le terme « esprit », tout en adoptant une tournure française actuelle et digne.
- source_word: በኵሉ፡ ምግባሮሙ፡ ርኵስ
  choice: par toute leur conduite impure
  rationale: Rend le sens collectif de leurs actes ou de leur comportement, qualifiés d’impurs, sans ajouter d’interprétation confessionnelle.
