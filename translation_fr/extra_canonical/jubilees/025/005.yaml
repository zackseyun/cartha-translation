  terminology: « Prendre pour femme », « la maison de mon père », « la parenté de mon père », « le Dieu Très-Haut », « descendance juste » et « postérité sainte » conviennent. Ils préservent le caractère familial et le parallélisme sans surcharge doctrinale.
