  source_fidelity: 'La traduction rend fidèlement l’exhortation, l’origine familiale requise de l’épouse, la bénédiction du Dieu Très-Haut et le parallélisme final. Cependant, « quelqu’un » neutralise indûment le référent féminin explicite : le texte parle à deux reprises d’une femme/épouse. La répétition textuelle de « la maison de mon père » est raisonnablement régularisée dans le corps du texte, à condition d’être signalée en note.'
