  text: And now[a], my son, listen to my voice and do the will of your mother, and do not take for yourself a wife from the daughters of this land; rather, from my father’s house and from my father’s kindred you shall take a wife for yourself. And God Most High will bless you, and your children will be a righteous offspring and a holy seed.
translation:
  language: fr
  text: Et maintenant[a], mon fils, écoute ma voix et fais la volonté de ta mère. Ne prends pas pour femme l’une des filles de ce pays, mais prends pour femme une femme issue de la maison de mon père et de la parenté de mon père. Et le Dieu Très-Haut te bénira, et tes enfants formeront une descendance juste et une postérité sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte source présente une répétition autour de « la maison de mon père », qui peut relever d’une insistance stylistique ou d’un problème local de découpage du texte.
    reason: segmentation_note
lexical_decisions:
- source_word: ብእሲተ
  choice: femme / pour femme
  rationale: Le terme désigne ici une épouse; la tournure française «prendre pour femme» rend naturellement l’expression matrimoniale répétée.
- source_word: ዝምድር
  choice: ce pays
  rationale: Rend le démonstratif et «terre/pays» dans un français courant, sans préciser une région non nommée.
- source_word: ቤተ፡ አቡየ
  choice: la maison de mon père
  rationale: Conserve l’image familiale et dynastique de la source.
- source_word: ዘመደ፡ አቡየ
  choice: la parenté de mon père
  rationale: «Parenté» exprime le groupe familial élargi sans le réduire à la famille immédiate.
- source_word: ትውልደ፡ ጽድቅ
  choice: une descendance juste
  rationale: Préserve le lien entre génération/descendance et justice, avec une formulation française intelligible.
- source_word: ዘርአ፡ ቅዱሰ
  choice: une postérité sainte
  rationale: Évite de répéter «descendance» tout en conservant le sens collectif de «semence» et sa qualification de sainteté.
theological_decisions:
- issue: Titre divin አምላከ፡ ልዑል
  choice: le Dieu Très-Haut
  alternative: Dieu, le Très-Haut
  rationale: La forme retenue est naturelle et conserve intégralement le titre sans ajout confessionnel.
- issue: Valeur de ጽድቅ appliqué à la descendance
  choice: juste
  alternative: de justice
  rationale: «Juste» garde l’ambiguïté entre qualité morale et conformité à la justice divine, sans l’expliciter doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition littérale probablement perturbée a été régularisée dans le corps du verset et signalée en note; le parallélisme «descendance juste / postérité sainte» a été conservé.
