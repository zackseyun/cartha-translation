  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
translation:
  language: fr
  text: Car je me souviens de la parole d’Abraham, notre père[a], car il m’a ordonné de ne pas prendre femme parmi les filles de Canaan, mais de prendre femme pour moi dans la descendance de la maison de mon père et dans ma parenté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qu’Abraham, notre père, m’a dit, car il m’a ordonné ».'
    reason: L’expression « la parole d’Abraham » peut aussi être comprise de façon plus idiomatique comme une référence à ce qu’Abraham a dit ; la formulation conserve la relation explicative exprimée dans le texte source.
lexical_decisions:
- source_word: ነገረ፡ አብርሃም፡ አቡነ
  choice: la parole d’Abraham, notre père
  rationale: Conserve le substantif « parole » et la relation explicite à Abraham, plutôt que de transformer d’emblée l’expression en discours indirect.
- source_word: እምአወልደ፡ ከናአን
  choice: parmi les filles de Canaan
  rationale: Rend naturellement la provenance exprimée par la préposition et le pluriel « filles ».
- source_word: እምዘርአ፡ ቤተ፡ አቡየ
  choice: dans la descendance de la maison de mon père
  rationale: Préserve les deux éléments de l’expression source, « descendance » et « maison de mon père », sans les réduire à la seule famille.
- source_word: ወእምዘመድየ
  choice: et dans ma parenté
  rationale: « Parenté » rend le groupe familial ou clanique désigné, sans le restreindre à des parents immédiats.
theological_decisions:
- issue: Relation syntaxique entre le souvenir de la parole d’Abraham et son commandement
  choice: deux-points suivis de « il m’a ordonné »
  alternative: « car il m’a ordonné »
  rationale: Le deux-points rend explicative la seconde proposition en français tout en maintenant l’ambiguïté entre le contenu de la parole rappelée et la raison pour laquelle elle est évoquée; il évite aussi une répétition lourde de « car ».
translation_notes:
  register: Français moderne, digne et accessible. « Prendre femme » est maintenu comme tournure biblique claire et concise; « pour moi » conserve l’insistance du texte source.
