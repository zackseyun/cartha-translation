  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
translation:
  language: fr
  text: C’est pourquoi j’ai veillé sur mon esprit[a], afin de ne pas pécher et de ne pas me souiller dans toute ma conduite, tous les jours de ma vie ; car c’est à cause de la débauche et de l’inconduite sexuelle qu’Abraham, mon père, m’a donné de nombreux commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « afin que je ne me souille pas et que toute ma conduite ne soit pas corrompue ».'
    reason: Alternative lexicale et syntaxique permise par le texte guèze.
lexical_decisions:
- source_word: ተዐቀብኩ፡ በመንፈስየ
  choice: j’ai veillé sur mon esprit
  rationale: Rend l’idée de garder ou préserver son être intérieur, dans un français naturel, sans exclure la nuance réflexive.
- source_word: ኢየአብስ፡ ወኢይማስን፡ በኵሉ፡ ፍናውየ
  choice: afin de ne pas pécher et de ne pas me souiller dans toute ma conduite
  rationale: Conserve les deux propositions négatives et la dimension morale de souillure ; « conduite » exprime idiomatiquement l’image des voies.
- source_word: ምርዐት፡ ወዝሙት
  choice: la débauche et l’inconduite sexuelle
  rationale: 'Distingue deux termes voisins : comportement licencieux et faute sexuelle, sans archaïsme ni précision excessive.'
- source_word: አብዝኀ፡ ... አዝዘትየ
  choice: m’a donné de nombreux commandements
  rationale: Reproduit directement l’idée d’instructions ou prescriptions nombreuses données par Abraham.
theological_decisions:
- issue: Portée de la garde morale
  choice: '« veillé sur mon esprit » suivi de deux conséquences : ne pas pécher et ne pas se souiller'
  alternative: « je me suis gardé de me souiller et de corrompre toute ma conduite »
  rationale: Le texte permet une autre répartition syntaxique des verbes et compléments. Le corps du verset suit la lecture principale de la couche anglaise auditée, tandis que la note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Inconduite sexuelle » évite l’archaïsme de « fornication » tout en préservant la portée sexuelle explicite ; « toute ma conduite » est plus naturel que « toutes mes voies » dans ce contexte.
