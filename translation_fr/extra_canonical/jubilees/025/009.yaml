- from: C’est pourquoi j’ai veillé sur mon esprit[a], afin de ne pas pécher et de ne pas me souiller dans toute ma conduite, tous les jours de ma vie ; car, au sujet de la débauche et de l’inconduite sexuelle, Abraham, mon père, m’a donné de nombreux commandements.
