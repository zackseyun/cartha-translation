  rationale: La révision restitue explicitement le rapport de cause introduisant les commandements d’Abraham. Elle reformule aussi la note afin de conserver l’alternative de lecture attestée par la piste d’audit anglaise, sans modifier inutilement le sens de la proposition initiale.
