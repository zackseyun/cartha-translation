  text: For all their conduct is fornication and impurity, and there is no righteousness with them, for it is evil.
translation:
  language: fr
  text: Car toute leur conduite est débauche et souillure, et il n’y a chez eux aucune justice, car c’est mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ምግባሮሙ
  choice: toute leur conduite
  rationale: Rend naturellement l’idée globale de l’ensemble de leurs actes ou de leur comportement.
- source_word: ዝሙት
  choice: débauche
  rationale: Le terme désigne ici une conduite sexuelle illicite ; « débauche » convient au registre général et collectif du passage.
- source_word: ምርጓት
  choice: souillure
  rationale: Conserve la notion d’impureté morale sans la limiter explicitement à un seul type d’acte.
- source_word: ጽድቀ
  choice: justice
  rationale: Correspond au champ de la droiture et de la conformité morale, tout en gardant la formulation théologique traditionnelle.
- source_word: እኩይ
  choice: mauvaise
  rationale: L’adjectif est accordé à « conduite », antécédent naturel en français, et exprime le jugement moral final.
theological_decisions:
- issue: Référent du pronom final dans « car elle est mauvaise »
  choice: La conduite collective mentionnée au début
  alternative: Traduire impersonnellement « car c’est mal » ou rapporter le jugement au groupe
  rationale: Le texte source laisse une certaine tension référentielle. L’accord féminin avec « conduite » produit un français naturel sans ajouter un sujet théologique absent.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « n’est que » exprime le caractère englobant de l’énoncé source sans alourdir la phrase.
