  text: '"Do not fear, mother; be assured that I will do your will and walk in uprightness, and I will never corrupt my ways."'
translation:
  language: fr
  text: '« N’aie pas peur, ma mère ; crois-moi : je ferai ta volonté, je marcherai dans la droiture et je ne corromprai jamais mes voies. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍርሂ
  choice: N’aie pas peur
  rationale: Impératif négatif féminin singulier, rendu naturellement en français moderne.
- source_word: ትእመኒ
  choice: Sois certaine
  rationale: Impératif féminin exprimant l’assurance ou la confiance; cette tournure convient à l’adresse faite à la mère.
- source_word: ፈቃደኪ
  choice: ce que tu veux
  rationale: Le nom « volonté » avec suffixe féminin peut se rendre idiomatiquement ainsi sans modifier le sens.
- source_word: በርትዕ አሐውር
  choice: je marcherai dans la droiture
  rationale: Conserve l’image biblique de la marche et la valeur morale de la rectitude.
- source_word: ኢያማስን ፍናውየ ለዓለም
  choice: jamais je ne corromprai ma conduite
  rationale: Rend la négation durable « pour toujours/jamais », le verbe de corruption et le pluriel idiomatique « mes voies » par « ma conduite » en français naturel.
theological_decisions: []
