  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
translation:
  language: fr
  text: 'Et malgré tout ce qu’il m’a ordonné[a], voici vingt-deux ans qu’Ésaü insiste auprès de moi et me presse, en me disant : « Mon frère, prends pour femme l’une des sœurs de mes deux femmes. » Mais moi, je n’ai pas voulu faire comme lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation du texte éthiopien est difficile. Les « vingt-deux ans » semblent désigner la longue période durant laquelle Ésaü a fait pression sur Jacob.
    reason: clarification_of_source_syntax
lexical_decisions:
- source_word: ወምስለ፡ ኵሉ፡ ዘአዘዘኒ
  choice: Et malgré tout ce qu’il m’a ordonné
  rationale: Rend la tournure concessive signalée par le contexte tout en conservant explicitement le verbe « ordonner », présent dans le guèze.
- source_word: ዕሥራ፡ ወክልኤተ፡ ዓመተ
  choice: voici vingt-deux ans que
  rationale: Exprime naturellement en français la durée prolongée indiquée par l’accusatif temporel.
- source_word: ይትኃአዘኒ፡ ወያበዝኀ
  choice: insiste auprès de moi et me presse
  rationale: Conserve les deux verbes et leur idée cumulative de sollicitation répétée et pressante.
- source_word: እኁየ
  choice: Mon frère
  rationale: Équivalent direct et naturel de l’adresse fraternelle.
- source_word: ንሣእ፡ ብእሲተ
  choice: prends pour femme
  rationale: La formulation française explicite naturellement le sens matrimonial de « prendre une femme ».
- source_word: አሐተ፡ እኅትነ፡ ለአንስቲያየ፡ ክልኤቲ
  choice: l’une des sœurs de mes deux femmes
  rationale: Préserve la relation familiale et la référence aux deux épouses d’Ésaü sans surinterprétation.
- source_word: ወአነኒ፡ ኢይፈቅድ፡ እግበር፡ ከመ፡ ገብረ፡ ውእቱ
  choice: Mais moi, je n’ai pas voulu faire comme lui
  rationale: Maintient le contraste emphatique sur le locuteur et la comparaison finale avec la conduite d’Ésaü.
theological_decisions:
- issue: Identité du sujet de « il m’a ordonné »
  choice: Conserver le pronom « il » sans identifier davantage son référent
  alternative: Nommer explicitement Isaac, Dieu ou un autre référent contextuel
  rationale: Le verset fourni ne nomme pas le sujet; l’expliciter résoudrait une ambiguïté que le texte source laisse ouverte.
- issue: Portée des vingt-deux ans
  choice: Les rattacher à l’insistance prolongée d’Ésaü
  alternative: Les rattacher au commandement mentionné dans la proposition initiale
  rationale: La syntaxe et la progression du verset favorisent une durée durant laquelle Ésaü exerce ses pressions, mais une note signale la difficulté de la formulation.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition du discours (« en me parlant et en disant ») est condensée en « en me disant » pour éviter une lourdeur non idiomatique, tandis que les deux verbes décrivant la pression d’Ésaü sont conservés.
