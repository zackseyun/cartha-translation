  text: I swear before you all the days of my life that I will not take a wife for myself from the daughters of the seed of Canaan, and that I will not act wickedly as Esau did.
translation:
  language: fr
  text: Je jure devant toi que, toute ma vie, je ne prendrai pas pour femme l’une des filles de la descendance de Canaan et que je ne ferai pas le mal comme Ésaü l’a fait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሕለ፡ አነ፡ እም፡ ቅድሜኪ
  choice: Je te le jure
  rationale: Rend naturellement la formule de serment prononcée devant l’interlocutrice, sans alourdir le français par un calque.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: tous les jours de ma vie
  rationale: Expression française courante qui conserve l’étendue temporelle explicite du guèze.
- source_word: ኢይንሣእ፡ ሊተ፡ ብእሲተ
  choice: je ne prendrai pas pour femme
  rationale: Conserve l’idiome sémitique du mariage dans une formulation française claire et digne.
- source_word: እምአዋልደ፡ ዘርአ፡ ከናአን
  choice: l’une des filles de la descendance de Canaan
  rationale: « Descendance » rend ici זרע/ዘርእ au sens généalogique; « l’une des » explicite naturellement en français la valeur partitive de la construction.
- source_word: ወኢያአኪ፡ ገቢረ
  choice: et je ne ferai pas le mal
  rationale: Le verbe ያአኪ porte explicitement l’idée de mal agir; cette traduction évite de neutraliser cette composante sémantique.
- source_word: በከመ፡ ገብረ፡ ዔሳው
  choice: comme Ésaü l’a fait
  rationale: Reproduit la comparaison avec l’acte d’Ésaü sans préciser davantage la nature de sa faute.
theological_decisions:
- issue: Évaluation morale de la conduite d’Ésaü
  choice: je ne ferai pas le mal comme Ésaü l’a fait
  alternative: je ne ferai pas comme Ésaü
  rationale: L’alternative est plus neutre, mais elle omet la valeur négative explicite du verbe guèze ያአኪ. La traduction retenue conserve cette évaluation sans ajouter une doctrine ou identifier plus précisément le mal commis.
translation_notes:
  register: Français international moderne, naturel et digne. Le serment est formulé directement; la syntaxe reste accessible tout en conservant la référence généalogique à Canaan et la condamnation explicite de l’action d’Ésaü.
