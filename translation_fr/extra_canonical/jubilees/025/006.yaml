  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
translation:
  language: fr
  text: 'Alors Jacob parla à Rébecca, sa mère, et lui dit : « Voici, je suis maintenant âgé de neuf semaines d’années[a]. Je n’ai pas connu de femme, je n’en ai touché aucune, je ne me suis fiancé à personne et je n’envisage pas de prendre pour femme l’une des filles de Canaan. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Neuf semaines d’années » équivaut à soixante-trois ans ; le texte conserve toutefois la manière de compter propre au livre des Jubilés.
    reason: cultural_note
lexical_decisions:
- source_word: ተስዓተ፡ ሱባዔ፡ ዓመት
  choice: neuf semaines d’années
  rationale: Conserve l’idiome chronologique propre au livre des Jubilés; la note en explicite la valeur.
- source_word: ኢያአምር
  choice: Je n’ai pas connu de femme
  rationale: Préserve l’euphémisme biblique « connaître » dans son sens sexuel sans le rendre plus explicite que la source.
- source_word: ወአገስስኩ
  choice: je n’en ai touché aucune
  rationale: Rend directement le verbe désignant le fait de toucher, avec un pronom renvoyant aux femmes.
- source_word: ወአፈፃርኩ
  choice: je ne me suis pas fiancé
  rationale: Restitue le membre de phrase relatif aux fiançailles, absent de certaines versions antérieures.
- source_word: ወኢይሔሊኒ፡ እንሣእ
  choice: je n’envisage pas de prendre
  rationale: Conserve la nuance explicite de pensée, de considération ou d’intention, plutôt qu’un simple futur.
- source_word: እምአዋልደ፡ ከናአን
  choice: l’une des filles de Canaan
  rationale: Formulation française naturelle qui conserve l’expression collective traditionnelle.
theological_decisions:
- issue: Portée de « connaître une femme »
  choice: Maintien de l’euphémisme biblique
  alternative: « Je n’ai jamais eu de relations avec une femme »
  rationale: La formulation retenue préserve le registre scripturaire et l’ambiguïté contrôlée de l’expression source, tandis que le contexte et les propositions suivantes en éclairent le sens.
- issue: Intention matrimoniale de Jacob
  choice: « je n’envisage pas de prendre »
  alternative: « je ne prendrai pas »
  rationale: Le verbe source exprime la pensée ou l’intention; un futur catégorique supprimerait cette nuance lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression du guèze, notamment dans la série des quatre déclarations de Jacob, tout en évitant une lourdeur excessive.
