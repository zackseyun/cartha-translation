  yaml_path: translation/extra_canonical/jubilees/025/008.yaml
  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: fr
  text: J’avais appris auparavant que des filles étaient nées à Laban, ton frère, et j’avais jeté mon dévolu sur elles, afin de prendre pour femme l’une d’entre elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕኩ፡ እምቀዲሙ
  choice: J’avais appris auparavant
  rationale: Le verbe « entendre » a ici le sens naturel d’« apprendre une nouvelle ». Le plus-que-parfait situe cette information avant la décision évoquée ensuite, tandis qu’« auparavant » rend explicitement እምቀዲሙ.
- source_word: አዋልደ
  choice: des filles
  rationale: Rend directement le pluriel du terme guèze.
- source_word: አንበርኩ፡ ልብየ፡ ከመ
  choice: j’avais porté mon choix sur elles
  rationale: L’expression littérale « placer mon cœur sur elles » indique ici une intention arrêtée ou une préférence matrimoniale; la formulation française conserve cette orientation sans suggérer un sentiment romantique absent du texte.
- source_word: እንሣእ፡ እምኔሆን፡ ብእሲተ
  choice: prendre pour femme l’une d’entre elles
  rationale: Le guèze exprime la prise d’une épouse « parmi elles »; « l’une d’entre elles » rend clairement qu’une seule femme est envisagée.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation évite le calque peu naturel « mettre mon cœur sur elles » tout en conservant la chronologie et l’intention matrimoniale du texte.
