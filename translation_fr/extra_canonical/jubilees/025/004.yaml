  text: But I[a], my son, love you exceedingly, and my heart and my affection will bless you at all times, by day and in the watches of the night.
translation:
  language: fr
  text: Mais moi, mon fils, je t’aime immensément, et mon cœur ainsi que mon affection te béniront en tout temps, le jour et pendant les veilles de la nuit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fin de la phrase est difficile à segmenter dans le texte source; elle semble désigner la totalité du temps par les deux pôles « le jour » et « les veilles de la nuit ».
    reason: segmentation_note
lexical_decisions:
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ
  choice: je t’aime immensément
  rationale: Rend l’intensification cumulative du verbe « aimer » par une formulation française naturelle et forte.
- source_word: ልብየ፡ ወምሕረትየ
  choice: mon cœur ainsi que mon affection
  rationale: Conserve les deux termes coordonnés sans les fondre; « affection » exprime ici l’attachement tendre plutôt qu’une notion doctrinale de miséricorde.
- source_word: ይባርከከ
  choice: te béniront
  rationale: Le sujet coordonné appelle naturellement le pluriel en français, tout en maintenant l’image selon laquelle le cœur et l’affection prononcent ou portent la bénédiction.
- source_word: በኵሉ፡ ጊዜ
  choice: en tout temps
  rationale: Équivalent français direct, digne et courant.
- source_word: ዕለት፡ ወዐቃቤ፡ ለያልይ
  choice: le jour et pendant les veilles de la nuit
  rationale: Rend la succession jour-nuit comme un mérisme temporel, tout en conservant explicitement l’image des veilles nocturnes.
