  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: fr
  text: 'Isaac dit à son père : « Père ! » Celui-ci répondit : « Me voici, mon fils. » Isaac lui dit : « Voici le feu, le couteau et le bois ; mais où est le mouton pour l’holocauste, père ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጥባሕት
  choice: couteau
  rationale: Le terme désigne ici l’instrument destiné à l’abattage sacrificiel ; « couteau » est naturel et précis dans ce contexte.
- source_word: በግዕ
  choice: mouton
  rationale: Le mot désigne un ovin sans préciser nécessairement son sexe ; « mouton » préserve cette généralité, contrairement à « agneau » ou « bélier ».
- source_word: ጽንሓሕ
  choice: holocauste
  rationale: Le terme renvoie à une offrande entièrement brûlée. « Holocauste » est l’expression biblique française consacrée et reste compréhensible dans ce cadre.
theological_decisions:
- issue: Nature de l’animal sacrificiel
  choice: mouton
  alternative: agneau
  rationale: Le texte guèze emploie le terme général pour un ovin ; il ne convient pas d’ajouter une précision d’âge porteuse d’associations théologiques absentes du verset.
translation_notes:
  register: Français moderne, courant et digne. La répétition filiale de « père » est conservée, ainsi que la progression concrète « le feu, le couteau et le bois ». « Celui-ci répondit » évite une succession lourde de pronoms tout en gardant clairement Abraham comme interlocuteur.
