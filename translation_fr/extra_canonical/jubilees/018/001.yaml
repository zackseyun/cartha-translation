  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
translation:
  language: fr
  text: 'Le SEIGNEUR dit à Abraham : « Abraham, Abraham ! » Il répondit : « Me voici. » Dieu dit : « Prends ton fils, ton bien-aimé que tu aimes, Isaac, va au pays élevé[a] et offre-le en sacrifice[b] sur l’une des montagnes que je te montrerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la haute terre » ou « le pays élevé ».'
    reason: Signale la tournure géographique inhabituelle de ምድር፡ ልዐልት sans la transformer en nom propre.
  - marker: b
    text: 'Littéralement : « fais-le monter » ; dans ce contexte, l’expression désigne l’action d’offrir en sacrifice.'
    reason: Préserve l’image verbale du texte source tout en expliquant la traduction contextuelle.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: le SEIGNEUR
  rationale: Rend le titre divin de manière traditionnelle, claire et digne en français.
- source_word: ፍቁረከ፡ ዘታፈቅር
  choice: ton bien-aimé que tu aimes
  rationale: Conserve la répétition affective du guèze au lieu de la lisser.
- source_word: ምድር፡ ልዐልት
  choice: le haut pays
  rationale: Le nom « pays » est qualifié par un adjectif féminin signifiant « élevé/haut » ; cette formulation française préserve la valeur adjectivale.
- source_word: ወአዕርጎ
  choice: offre-le en sacrifice
  rationale: Le causatif lié à l’idée de faire monter désigne ici l’offrande sacrificielle ; la formulation est naturelle en français et adaptée au contexte.
- source_word: እፄይዐከ
  choice: je te montrerai
  rationale: Rend directement la proposition relative future portant sur la montagne choisie par Dieu.
theological_decisions:
- issue: Identification du sujet dans la seconde parole divine
  choice: Dieu dit
  alternative: Il dit
  rationale: Le sujet demeure le SEIGNEUR ; répéter « Dieu » évite en français que le pronom soit momentanément rapporté à Abraham, sans introduire de distinction théologique.
- issue: Nature de l’offrande d’Isaac
  choice: offre-le en sacrifice
  alternative: fais-le monter
  rationale: Le contexte est sacrificiel, mais la formulation n’ajoute ni accomplissement effectif ni interprétation doctrinale au commandement.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition « Abraham, Abraham » et l’expression affective redondante sont maintenues. Les marqueurs [a] et [b] figurent dans le texte principal.
