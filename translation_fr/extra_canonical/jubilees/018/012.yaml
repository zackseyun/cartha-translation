lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: le prince Mastéma
  rationale: « Prince » rend le titre መኰንን, tandis que « Mastéma » est conservé comme nom propre.
- source_word: ትገፍረ
  choice: fut couvert de honte
  rationale: Cette tournure naturelle exprime l’humiliation ou la confusion indiquée par le verbe.
- source_word: አሐዱ፡ በሐኵ
  choice: un bélier
  rationale: L’article indéfini français rend naturellement le numéral አሐዱ dans ce contexte de présentation.
- source_word: አኀዝ፡ በዕፀው፡ በአቅርንቲሁ
  choice: était retenu par les cornes dans le fourré
  rationale: La formulation suit les rapports syntaxiques de la source tout en restant idiomatique en français.
- source_word: አዕረገ፡ ለጽንሓሕ
  choice: l’offrit en holocauste
  rationale: « Holocauste » est le terme français biblique usuel pour un sacrifice entièrement consumé.
- source_word: ህየንተ፡ ወልዱ
  choice: à la place de son fils
  rationale: Rend directement l’idée de substitution sans explicitation théologique supplémentaire.
theological_decisions:
- issue: La fonction de Mastéma
  choice: Conserver « prince Mastéma » comme titre et nom propre
  alternative: « le prince de Mastéma » ou une paraphrase démonologique
  rationale: La source présente መስተማ comme le nom associé directement au titre; une paraphrase ajouterait une interprétation absente du verset.
- issue: La substitution sacrificielle
  choice: « à la place de son fils »
  alternative: « en remplacement de son fils »
  rationale: La formulation retenue préserve simplement et explicitement la relation substitutive de la source, sans en développer la portée doctrinale.
translation_notes:
  register: Français moderne, international et digne, avec une cadence biblique légère. « Voici que » conserve la valeur présentative de ወናሁ sans produire l’archaïsme marqué de « et voici ». Aucun marqueur de note n’est requis.
