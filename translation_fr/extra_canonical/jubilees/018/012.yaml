  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: fr
  text: 'Et le prince Mastéma fut couvert de honte. Abraham leva les yeux et regarda : voici qu’un bélier était retenu par les cornes dans le fourré. Abraham alla prendre le bélier et l’offrit en holocauste à la place de son fils.'
