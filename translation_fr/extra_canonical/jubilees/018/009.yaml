  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: fr
  text: 'Et je me tins devant lui et devant le prince Mastéma. Le Seigneur dit : « Dis-lui de ne pas porter la main sur l’enfant et de ne rien lui faire, car je sais maintenant qu’il craint Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቆምኩ
  choice: je me tins
  rationale: Rend le parfait « je me tins / je me tenais debout » dans un registre narratif digne et naturel.
- source_word: መስተማ
  choice: Mastéma
  rationale: Translittération française usuelle du nom propre.
- source_word: ኢያውርድ፡ እዴሁ፡ ላዕለ፡ ሕፃን
  choice: de ne pas porter la main sur l’enfant
  rationale: Expression française idiomatique qui conserve le geste menaçant exprimé par la tournure guèze.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: il craint Dieu
  rationale: Rend directement la formule religieuse « craignant Dieu », sans explicitation confessionnelle.
theological_decisions:
- issue: La déclaration divine « maintenant je sais »
  choice: je sais maintenant
  alternative: j’ai reconnu maintenant
  rationale: Conserve la tension théologique et la temporalité explicite du texte au lieu de les atténuer ou de les expliquer.
- issue: Référent du pronom dans « Dis-lui »
  choice: Dis-lui
  alternative: Ordonne-lui
  rationale: Maintient le pronom et l’ambiguïté référentielle du texte source sans identifier explicitement son destinataire.
translation_notes:
  register: Français international moderne, narratif et digne. Ponctuation clarifiée sans ajout interprétatif; « le Seigneur » rend le titre divin du texte.
