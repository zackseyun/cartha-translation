  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
translation:
  language: fr
  text: 'Et je lui dis : « Ne porte pas la main sur l’enfant et ne lui fais rien, car je sais maintenant que tu crains Dieu et que tu ne m’as pas refusé ton fils, ton premier-né. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእቤሎ
  choice: Et je lui dis
  rationale: 'La forme guèze est à la première personne du singulier : le narrateur angélique rapporte ses propres paroles.'
- source_word: አትፈኑ፡ እዴከ፡ ዲበ፡ ሕፃን
  choice: Ne porte pas la main sur l’enfant
  rationale: Cette tournure française naturelle rend l’interdiction littérale d’étendre ou d’envoyer la main sur l’enfant sans en atténuer la menace.
- source_word: ወአትግበር፡ ምንተኒ፡ ዲቤሁ
  choice: et ne lui fais aucun mal
  rationale: Le sens littéral est « ne fais rien contre/sur lui » ; dans ce contexte, « aucun mal » exprime clairement l’interdiction sans suggérer toute forme d’action quelconque.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: tu crains Dieu
  rationale: Conserve l’expression biblique de la crainte de Dieu et sa portée théologique sans la réduire à la peur ni l’expliciter en simple respect.
- source_word: ወኢምሕከ
  choice: tu ne m’as pas refusé
  rationale: Rend le verbe au sens de retenir ou soustraire quelqu’un à un autre ; « refuser » est idiomatique et garde la relation exprimée par « de moi ».
- source_word: 'በዘረከ (lecture éditoriale corrigée : በኵረከ)'
  choice: ton premier-né
  rationale: La leçon imprimée de l’édition Charles est « ton premier-né » ; « ta descendance », suggéré par le texte OCR fourni, provient d’une erreur de reconnaissance signalée par la révision critique.
theological_decisions:
- issue: Sens de « craindre Dieu »
  choice: Conserver « tu crains Dieu »
  alternative: « tu respectes Dieu » / « tu révères Dieu »
  rationale: La formulation traditionnelle reste intelligible en français moderne et préserve la tension biblique entre crainte, révérence et obéissance.
- issue: Identité du locuteur à la première personne
  choice: « je lui dis »
  alternative: « il lui dit »
  rationale: La morphologie guèze et le cadre narratif où l’ange de la Présence parle à Moïse soutiennent la première personne, même si le récit parallèle de la Genèse emploie une narration à la troisième personne.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe garde le rythme solennel du discours biblique, tandis que « porter la main sur » et « ne lui faire aucun mal » évitent un calque peu naturel. Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
