  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
translation:
  language: fr
  text: 'Il vit le lieu de loin. Il arriva jusqu’au puits d’eau[a] et dit à ses serviteurs : « Restez ici avec les ânes. Le garçon et moi, nous irons, nous nous prosternerons et nous reviendrons vers vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fosse d’eau ».
    reason: Le terme guèze peut désigner un puits aménagé ou une fosse servant de réserve d’eau.
lexical_decisions:
- source_word: መካነ (makāna)
  choice: le lieu
  rationale: Rend directement le terme guèze désignant un lieu ou un endroit, sans préciser davantage sa nature.
- source_word: ዐዘቅተ፡ ማይ (ʿazaqta māy)
  choice: le puits
  rationale: L’expression signifie littéralement un puits ou une fosse d’eau. « Le puits » est l’équivalent français naturel dans ce contexte, tandis que la note conserve l’autre nuance possible.
- source_word: ለደቁ (la-daqqu)
  choice: à ses serviteurs
  rationale: Dans ce récit, le terme désigne les jeunes gens qui accompagnent Abraham et le servent ; « serviteurs » exprime clairement leur fonction en français.
- source_word: አድግት (ʾadəgt)
  choice: les ânes
  rationale: Le mot guèze est au pluriel. Cette forme est conservée sans harmonisation avec la formulation au singulier de Genèse 22:5 dans d’autres traditions textuelles.
- source_word: ወሕፃን (wa-ḥəṣān)
  choice: le garçon
  rationale: Le terme désigne ici Isaac comme enfant ou jeune garçon ; « le garçon » est naturel et maintient la perspective narrative d’Abraham.
- source_word: ወሰጊደነ (wa-sagidana)
  choice: pour nous prosterner
  rationale: Le verbe exprime l’action de se courber ou se prosterner, souvent dans l’adoration. Cette traduction conserve le geste concret sans surinterpréter.
theological_decisions:
- issue: La déclaration d’Abraham selon laquelle lui et le garçon reviendront
  choice: « nous reviendrons vers vous »
  alternative: « je reviendrai vers vous »
  rationale: Le guèze emploie explicitement une forme à la première personne du pluriel. La traduction préserve cette tension narrative et théologique sans expliquer comment Abraham envisage le retour d’Isaac.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du mouvement du texte source tout en évitant les enchaînements répétitifs peu naturels en français. Le pluriel « les ânes » suit explicitement le guèze.
