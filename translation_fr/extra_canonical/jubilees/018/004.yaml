  source_fidelity: 'La traduction rend bien les éléments essentiels du guèze : le lieu aperçu de loin, le puits/la fosse d’eau, les serviteurs, les ânes au pluriel, le garçon, la prosternation et le retour au pluriel. Toutefois, « jusque-là » introduit une précision spatiale qui n’est pas exprimée dans le texte source. La coordination des verbes est aussi mieux conservée par trois futurs coordonnés que par une tournure finale (« pour nous prosterner »).'
