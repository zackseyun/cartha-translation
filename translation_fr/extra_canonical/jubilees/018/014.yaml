  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: fr
  text: Et le SEIGNEUR appela Abraham par son nom une seconde fois depuis le ciel, comme il me l’avait montré, afin que nous parlions au nom du SEIGNEUR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዖ፡ እግዚአብሔር፡ ለአብርሃም፡ በስሙ
  choice: Et le SEIGNEUR appela Abraham par son nom
  rationale: Rend directement l’appel adressé à Abraham et l’expression « par son nom », dans un ordre naturel en français.
- source_word: ዳግመ፡ እምሰማይ
  choice: une seconde fois depuis le ciel
  rationale: Conserve la répétition indiquée par ዳግመ et l’origine céleste exprimée par እምሰማይ.
- source_word: በከመ፡ አስተረአየኒ
  choice: comme il me l’avait montré
  rationale: Préserve la comparaison et la première personne du complément sans expliciter ce qui avait été montré.
- source_word: ከመ፡ ንትናገር፡ በስመ፡ እግዚአብሔር
  choice: afin que nous parlions au nom du SEIGNEUR
  rationale: Rend la valeur finale possible de ከመ et maintient le pluriel « nous » ainsi que la formule « au nom du SEIGNEUR ».
theological_decisions:
- issue: Référent de « il » dans « comme il me l’avait montré »
  choice: Maintenir le pronom sans identifier explicitement son référent
  alternative: Remplacer « il » par « le SEIGNEUR » ou un autre acteur nommé
  rationale: Le texte source conserve un référent pronominal; l’expliciter résoudrait une ambiguïté que le verset ne tranche pas directement.
- issue: Valeur de ከመ devant « nous parlions »
  choice: afin que
  alternative: de sorte que / pour que
  rationale: La formulation finale est naturelle et correspond à la lecture de la couche de consultation, tout en évitant d’ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « SEIGNEUR » en petites capitales typographiques simulées par des capitales, conformément à l’usage biblique courant pour le nom divin. La structure inhabituelle de la proposition sur le narrateur est conservée plutôt que lissée par paraphrase.
