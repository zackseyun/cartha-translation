  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: fr
  text: Il construisit l’autel et plaça le bois sur l’autel. Puis il lia Isaac, son fils, et le déposa sur le bois qui était sur l’autel. Il étendit alors la main pour prendre le couteau afin d’immoler Isaac, son fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዕ
  choice: autel
  rationale: Le terme désigne ici l’autel construit par Abraham, conformément au contexte sacrificiel.
- source_word: አሰረ
  choice: lia
  rationale: Rend directement l’action d’attacher Isaac, sans préciser davantage la manière.
- source_word: መጥባሕተ
  choice: couteau
  rationale: Désigne l’instrument tranchant destiné à l’immolation; « couteau » est naturel et précis en français courant.
- source_word: ይዝብሖ
  choice: égorger
  rationale: Le verbe exprime une mise à mort sacrificielle par égorgement; ce choix conserve la force concrète du texte.
theological_decisions:
- issue: Nature de l’acte projeté contre Isaac
  choice: égorger Isaac
  alternative: sacrifier Isaac
  rationale: Le texte nomme concrètement l’acte de mise à mort plutôt que de l’interpréter par le terme plus général « sacrifier ».
translation_notes:
  register: Français moderne, sobre et narratif. La répétition « Isaac, son fils » est conservée pour maintenir l’insistance affective et théologique du texte. Les phrases sont légèrement segmentées pour assurer une lecture naturelle sans supprimer la succession précise des gestes.
