  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: fr
  text: 'Et il dit : « Dieu verra lui-même le mouton pour l’offrande brûlée, mon fils. » Puis il s’approcha du lieu de la montagne du SEIGNEUR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሬኢ፡ ሎቱ
  choice: verra lui-même
  rationale: La tournure rend le verbe « voir » avec le pronom datif réfléchi, sans expliciter davantage l’idée possible de pourvoir.
- source_word: በግዐ
  choice: le mouton
  rationale: Le nom guèze désigne ici un ovin; « mouton » conserve la formulation concrète sans imposer « agneau » ou « bélier ».
- source_word: ለጽንሓሕ
  choice: pour l’offrande brûlée
  rationale: Cette expression sacrificielle désigne une offrande consumée par le feu; cette traduction reste intelligible et proche de la formulation source.
- source_word: ደብረ፡ እግዚአብሔር
  choice: la montagne du SEIGNEUR
  rationale: Rend directement le syntagme nominal et représente le nom divin selon l’usage français courant en petites capitales.
theological_decisions:
- issue: Sens de « Dieu verra lui-même »
  choice: Conserver le verbe « voir »
  alternative: « Dieu pourvoira lui-même »
  rationale: Le contexte peut suggérer que Dieu fournira la victime, mais le texte emploie le verbe « voir »; la traduction préserve donc l’ambiguïté théologique et l’écho au récit de la Genèse.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du guèze tout en évitant une tournure artificielle; aucun marqueur de note n’est requis.
