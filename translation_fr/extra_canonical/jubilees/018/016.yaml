  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: fr
  text: Et par ta descendance, toutes les nations de la terre seront bénies, parce que tu as écouté ma voix. Et j’ai fait savoir à tous que tu m’es fidèle en tout ce que je t’ai dit. Va en paix. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘርእከ
  choice: par ta descendance
  rationale: Le nom ዘርእ désigne la semence ou la descendance. « Descendance » est naturel en français moderne tout en conservant la valeur collective et l’ambiguïté quant à son étendue.
- source_word: ይትባረኩ
  choice: seront bénies
  rationale: Le passif exprime directement la bénédiction reçue par les nations, sans expliciter un agent que le texte laisse implicite.
- source_word: ዘሰማዕከ፡ ቃለ፡ ዚአየ
  choice: parce que tu as écouté ma voix
  rationale: « Écouter la voix » restitue l’expression source et implique ici l’obéissance sans remplacer l’image par une formulation purement interprétative.
- source_word: አይደዐኩ፡ ለኵሉ
  choice: J’ai ainsi fait savoir à tous
  rationale: Rend le causatif « j’ai fait connaître » et ለኵሉ « à tous ». « Ainsi » marque naturellement le lien avec l’épreuve qui a manifesté la fidélité d’Abraham.
- source_word: ምእመን
  choice: fidèle
  rationale: Le terme qualifie Abraham comme digne de confiance et constant envers Dieu; « fidèle » convient au registre relationnel du passage.
- source_word: ሖር፡ በሰላም
  choice: Va en paix
  rationale: Formule française directe et traditionnelle correspondant à l’impératif suivi de « en paix ».
theological_decisions:
- issue: Portée de « descendance »
  choice: Maintien du collectif « ta descendance » sans identification supplémentaire
  alternative: « ton descendant » ou une explicitation messianique
  rationale: La forme source peut avoir une valeur collective et ne tranche pas ici explicitement en faveur d’un individu; la traduction préserve cette tension.
- issue: Sens de l’écoute de la voix divine
  choice: « tu as écouté ma voix »
  alternative: « tu as obéi à ma voix »
  rationale: La formulation littérale conserve la métaphore biblique, tandis que le contexte permet au lecteur de comprendre l’obéissance impliquée.
- issue: Agent de la bénédiction
  choice: Passif « seront bénies »
  alternative: « se béniront » ou « je bénirai »
  rationale: Le passif de la source ne précise pas davantage l’agent et ne doit pas être transformé en réflexif ou en déclaration divine explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la source sans raideur; aucune note n’est nécessaire, et aucun marqueur de note n’apparaît donc dans le texte.
