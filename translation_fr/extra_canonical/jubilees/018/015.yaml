  yaml_path: translation/extra_canonical/jubilees/018/015.yaml
  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
translation:
  language: fr
  text: 'Et il dit : « J’ai juré par moi-même, déclare le Seigneur : puisque tu as fait cela et que tu ne m’as pas refusé ton fils, ton premier-né, celui que tu aimes, je te bénirai certainement et je multiplierai abondamment ta descendance comme les étoiles du ciel et comme le sable qui est au bord de la mer ; ta descendance prendra possession des villes de ses ennemis. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በርእስየ መሐልኩ
  choice: J’ai juré par moi-même
  rationale: Rend directement la formule de serment réflexive guèze dans un français naturel et solennel.
- source_word: ወልደከ
  choice: ton fils
  rationale: Correspond au sens ordinaire de « fils » et maintient le lien direct avec Abraham.
- source_word: 'በዘረከ (lecture corrigée : በኵረከ)'
  choice: ton premier-né
  rationale: Le texte numérique paraît comporter une erreur de lecture ; la leçon attendue signifie « ton premier-né », conformément à la source éditoriale et à la révision critique fournie.
- source_word: ዘአፍቀርከ
  choice: celui que tu aimes
  rationale: Exprime naturellement le participe relatif « celui que tu as aimé/aimes » sans réduire l’expression à un simple adjectif.
- source_word: ባርኮ እባርከከ
  choice: je te bénirai certainement
  rationale: L’infinitif absolu avec le verbe conjugué intensifie l’affirmation ; « certainement » conserve cette force sans calque maladroit.
- source_word: አበዝኆ አበዝኆ
  choice: je multiplierai abondamment
  rationale: La répétition emphatique est rendue par un adverbe intensif idiomatique.
- source_word: ዘርአከ
  choice: ta descendance
  rationale: Le nom collectif désigne ici la postérité ; « descendance » est plus clair que « semence » en français moderne.
- source_word: ይወርሱ
  choice: prendra possession de
  rationale: Le verbe exprime l’héritage ou la prise de possession ; cette formulation préserve les deux nuances dans le contexte des villes ennemies.
theological_decisions:
- issue: Titre divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « Le Seigneur » est une désignation française traditionnelle, intelligible et non confessionnelle, qui évite de fixer ici une rétroversion hébraïque non explicitée par la forme guèze.
- issue: Statut d’Isaac comme « premier-né »
  choice: Conserver explicitement « ton premier-né »
  alternative: Omettre le terme ou le rendre par « ta descendance »
  rationale: La leçon corrigée fournie porte ce sens. La tension possible avec d’autres traditions généalogiques doit être préservée plutôt que résolue silencieusement.
- issue: Promesse concernant les villes ennemies
  choice: « prendra possession des villes de ses ennemis »
  alternative: « héritera des villes de ses ennemis »
  rationale: La formulation choisie communique clairement l’acquisition promise sans imposer une lecture technique de l’héritage.
translation_notes:
  register: Français international moderne, digne et lisible. Les intensifications sémitiques sont rendues idiomatiquement tout en conservant leur force. La syntaxe garde le caractère solennel de l’oracle sans devenir archaïque.
