  text: And Abraham went to his servants, and they arose and went together to Beer-sheba, and Abraham dwelt by the Well of the Oath.
translation:
  language: fr
  text: Abraham alla auprès de ses serviteurs. Ils se levèrent et allèrent ensemble à Bersabée, et Abraham demeura auprès du Puits du Serment.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቁ
  choice: ses serviteurs
  rationale: Dans ce contexte, le terme désigne les jeunes hommes ou serviteurs qui accompagnaient Abraham; « serviteurs » exprime naturellement leur fonction en français.
- source_word: በርስሕ
  choice: Bersabée
  rationale: Transcription française traditionnelle du toponyme Beer-Sheba, attestée dans les versions bibliques françaises.
- source_word: ዐዘቅት፡ መሐላ
  choice: le Puits du Serment
  rationale: Rend le nom explicatif guèze, littéralement associé au puits et au serment, tout en conservant sa valeur de désignation géographique.
- source_word: ኀደረ
  choice: demeura
  rationale: Le verbe indique qu'Abraham séjourna ou s'établit en ce lieu; « demeura » conserve cette portée sans préciser indûment la durée.
