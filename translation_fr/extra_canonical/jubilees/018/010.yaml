  text: And I called to him from heaven and said to him, “Abraham, Abraham.” And he was terrified and said, “Here I am.”
translation:
  language: fr
  text: 'Alors, du ciel, je l’appelai et lui dis : « Abraham, Abraham ! » Il fut saisi de terreur[a] et répondit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
