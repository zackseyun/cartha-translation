lexical_decisions:
- source_word: ጸዋዕክዎ፡ እምሰማይ
  choice: du ciel, je l’appelai
  rationale: Rend directement l’appel adressé à Abraham depuis le ciel, dans un ordre naturel en français.
- source_word: ወይገብዕ
  choice: il fut saisi de terreur
  rationale: Le verbe exprime ici l’effroi ou le recul provoqué par la voix soudaine, plutôt que la hâte.
- source_word: ነየ፡ አነ
  choice: Me voici
  rationale: Formule française biblique courante et naturelle pour une réponse de disponibilité à un appel.
theological_decisions:
- issue: Réaction d’Abraham à la voix céleste
  choice: il fut saisi de terreur
  alternative: il se hâta
  rationale: La lecture exprimant l’effroi préserve l’expansion narrative propre au texte guèze et évite d’effacer la tension de la scène.
