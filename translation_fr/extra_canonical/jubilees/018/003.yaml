  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: fr
  text: Il se leva de bon matin, sella son âne et prit avec lui deux serviteurs ainsi que son fils Isaac. Il fendit le bois pour l’holocauste et se rendit au lieu le troisième jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: de bon matin
  rationale: Expression française naturelle qui rend l’idée d’une action accomplie tôt le matin.
- source_word: አድጎ
  choice: son âne
  rationale: Le terme désigne ici l’animal de bât qu’Abraham selle.
- source_word: ደቂቀ
  choice: serviteurs
  rationale: Dans ce contexte, le mot désigne les jeunes hommes au service d’Abraham; « serviteurs » est clair et idiomatique.
- source_word: መሥዋዕተ፡ ሰፀረ
  choice: le bois destiné à l’holocauste
  rationale: La construction renvoie au bois préparé pour le sacrifice entièrement consumé; cette formulation évite de donner l’impression que le bois lui-même est l’offrande.
- source_word: ውስተ፡ መካን
  choice: vers le lieu
  rationale: Rend littéralement la destination sans préciser un lieu que le verset ne nomme pas.
theological_decisions:
- issue: Nature du sacrifice
  choice: holocauste
  alternative: offrande consumée
  rationale: « Holocauste » est un terme biblique français courant pour un sacrifice entièrement brûlé et ne résout aucune tension théologique du récit.
- issue: Rapport de « le troisième jour » avec la syntaxe
  choice: Le troisième jour…
  alternative: il arriva au lieu le troisième jour
  rationale: Le texte guèze fourni semble placer cette expression au début de l’unité suivante; la ponctuation conserve cette ambiguïté de découpage au lieu d’ajouter un verbe absent.
translation_notes:
  register: Français international moderne, simple et digne. La coordination sémitique répétée est allégée sans supprimer l’ordre narratif. La fin reste ouverte afin de respecter le découpage signalé par la source guèze.
