  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: fr
  text: Il prit le bois destiné à l’offrande et le chargea sur Isaac, son fils. Il prit dans sa main le feu et le couteau, et tous deux allèrent ensemble jusqu’à cet endroit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ፡ መሥዋዕት
  choice: le bois destiné à l’offrande
  rationale: Rend littéralement la relation entre « bois » et « offrande » tout en produisant une expression naturelle en français.
- source_word: አስከሞ
  choice: le chargea sur
  rationale: Exprime l’action de placer le bois sur Isaac comme une charge à porter.
- source_word: መጥባሕት
  choice: le couteau
  rationale: Désigne ici l’instrument tranchant destiné au sacrifice; « couteau » est clair et idiomatique.
- source_word: ኅቡረ፡ ክልኤሆሙ
  choice: tous deux allèrent ensemble
  rationale: Conserve l’insistance du texte sur les deux personnages cheminant de concert.
- source_word: እስክ፡ ውእቱ፡ መካን
  choice: jusqu’à cet endroit
  rationale: Préserve la valeur terminative de እስክ (« jusqu’à ») et le démonstratif associé à « endroit ».
