  text: And thus it is ordained and written on the heavenly tablets concerning Israel and his seed, that they should keep this festival seven days with festal joy.
translation:
  language: fr
  text: Ainsi, il est prescrit et écrit sur les tablettes célestes, au sujet d’Israël et de sa descendance, qu’ils célèbrent cette fête pendant sept jours dans une joie festive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la joie d’une fête » ; le mot « fête » apparaît une seconde fois dans le texte source.'
    reason: Signaler la répétition lexicale explicite du guèze, que l’expression française « joie festive » rend de manière idiomatique.
lexical_decisions:
- source_word: ሤሩዕ፡ ውእቱ፡ መጽሐፍ
  choice: il est prescrit et écrit
  rationale: Rend les deux notions coordonnées d’ordonnance et de mise par écrit, sans réduire l’une à l’autre.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Formulation naturelle en français qui conserve l’image concrète des tablettes du ciel.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: Équivalent collectif moderne de « sa semence », ici au sens des descendants d’Israël.
- source_word: ለገቢረ፡ ዛቲ፡ በዓል
  choice: qu’ils célèbrent cette fête
  rationale: Dans ce contexte cultuel, « faire cette fête » signifie l’observer ou la célébrer.
- source_word: በፍሥሓ፡ በዓል
  choice: dans une joie festive
  rationale: Conserve à la fois la joie et la seconde occurrence explicite du terme « fête », tout en restant idiomatique en français.
theological_decisions:
- issue: Portée de l’ordonnance céleste
  choice: Conserver la formulation impersonnelle « il est prescrit et écrit »
  alternative: « Dieu a prescrit et fait écrire »
  rationale: Le texte affirme l’inscription normative sur les tablettes célestes sans nommer explicitement l’agent; il ne faut pas l’ajouter.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve la solennité juridique et cultuelle du passage, tandis que « joie festive » évite une répétition maladroite sans effacer le second emploi de « fête ».
