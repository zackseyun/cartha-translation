  text: And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.
translation:
  language: fr
  text: Il célébra cette fête chaque année pendant sept jours, dans la joie, et il l’appela « fête du Seigneur », selon les sept jours pendant lesquels il était parti et revenu en paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር፡ ዛተ፡ በዓለ
  choice: Il célébra cette fête
  rationale: Le verbe « faire » appliqué à une fête se rend naturellement en français par « célébrer », sans modifier le sens.
- source_word: በኵሉ፡ ዓመታት
  choice: chaque année
  rationale: Expression distributive indiquant une célébration annuelle répétée.
- source_word: ሰቡዐ፡ ዕለተ
  choice: pendant sept jours
  rationale: Rend directement la durée de la fête.
- source_word: በፍሥሓ
  choice: dans la joie
  rationale: Conserve explicitement la manière joyeuse de la célébration dans un français digne et courant.
- source_word: በዓለ፡ እግዚአብሔር
  choice: fête du Seigneur
  rationale: Rend le nom divin guèze selon l’usage français courant, sans ajouter de précision absente de la source.
- source_word: ሖረ፡ ወተመይጠ፡ በሰላም
  choice: il était parti et revenu en paix
  rationale: Préserve les deux mouvements successifs et l’issue paisible.
theological_decisions:
- issue: Lien entre les sept jours de fête et les sept jours du voyage
  choice: « en souvenir des sept jours durant lesquels »
  alternative: « conformément aux sept jours pendant lesquels »
  rationale: Le guèze በከመ marque une correspondance. « En souvenir de » explicite naturellement ici la fonction commémorative suggérée par le contexte, tout en maintenant le rapport entre les deux périodes de sept jours.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au récit écrit. Les guillemets français distinguent clairement le nom donné à la fête.
