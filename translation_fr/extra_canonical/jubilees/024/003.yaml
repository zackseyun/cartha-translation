  yaml_path: translation/extra_canonical/jubilees/024/003.yaml
  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
translation:
  language: fr
  text: 'Jacob fit cuire un plat de lentilles, et Ésaü vint du champ, affamé. Il dit à Jacob, son frère : « Donne-moi de ce plat de blé[a]. » Jacob lui répondit : « Vends-moi ton droit d’aînesse[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze dit ici « plat de blé », alors que le plat préparé par Jacob vient d’être décrit comme un plat de lentilles. « Blé » peut aussi désigner plus largement une céréale.
    reason: Signaler sans l’harmoniser la discordance lexicale présente dans la source.
  - marker: b
    text: La formulation guèze précise que ce droit est celui du premier-né.
    reason: Signaler l’explicitation liée à la première naissance derrière l’expression française usuelle « droit d’aînesse ».
lexical_decisions:
- source_word: ብርስን
  choice: lentilles
  rationale: Le terme désigne les lentilles; il qualifie le plat préparé par Jacob.
- source_word: ርኁብ
  choice: affamé
  rationale: Rend directement l’état d’Ésaü à son retour des champs, dans un français naturel.
- source_word: ሥርናይ
  choice: blé
  rationale: Le terme signifie « blé » ou, plus largement, « céréale ». Le rendre par « blé » préserve la différence textuelle surprenante avec les lentilles de la première phrase, sans harmonisation.
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  choice: ton droit d’aînesse
  rationale: Expression française courante qui rend le statut ou privilège attaché à la première naissance, plutôt qu’un ordre temporel signifiant « d’abord ».
theological_decisions:
- issue: Nature de ce qu’Ésaü doit vendre
  choice: droit d’aînesse
  alternative: rang de premier-né
  rationale: « Droit d’aînesse » exprime naturellement en français le statut et les prérogatives du premier-né, tout en évitant d’ajouter une définition théologique ou juridique absente du texte.
- issue: Discordance entre le plat préparé et le plat demandé
  choice: Conserver « lentilles » puis « blé »
  alternative: Harmoniser les deux occurrences en « lentilles »
  rationale: La source guèze présente deux termes différents. La traduction conserve cette tension textuelle authentique et la signale en note plutôt que de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, simple et digne. Le récit conserve ses enchaînements brefs. Le fragment placé avant « Jacob » dans l’extrait fourni appartient vraisemblablement au contexte précédent selon la délimitation du verset et n’est donc pas inclus.
