revisions:
- from: 'Jacob fit cuire un plat de lentilles, et Ésaü revint des champs, affamé. Il dit à son frère Jacob : « Donne-moi de ce plat de blé[a]. » Jacob lui répondit : « Vends-moi ton droit d’aînesse[b]. »'
  to: 'Jacob fit cuire un plat de lentilles, et Ésaü vint du champ, affamé. Il dit à Jacob, son frère : « Donne-moi de ce plat de blé[a]. » Jacob lui répondit : « Vends-moi ton droit d’aînesse[b]. »'
  rationale: La révision retire l’idée non exprimée d’un retour d’Ésaü et rétablit le singulier « du champ ». Elle conserve la divergence voulue entre lentilles et blé/céréale, ainsi que « droit d’aînesse », tout en rendant la note associée plus prudente.
