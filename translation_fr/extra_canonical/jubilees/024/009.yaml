  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: fr
  text: 'Le SEIGNEUR lui apparut et lui dit : « Ne descends pas en Égypte. Habite dans le pays que je t’indiquerai, et séjourne dans ce pays. Je serai avec toi et je te bénirai, car à toi… »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte source fourni pour ce verset s’interrompt après « car à toi »; la phrase se poursuit dans la suite du passage.
    reason: Signaler l’inachèvement de l’extrait sans compléter la proposition au-delà du texte gé’ez fourni.
lexical_decisions:
- source_word: አስተርአዮ
  choice: lui apparut
  rationale: Rend naturellement en français la forme éthiopienne exprimant l’apparition du Seigneur à Isaac.
- source_word: ኢትረድ፡ ግብጸ
  choice: Ne descends pas en Égypte
  rationale: Conserve l’image géographique traditionnelle du verbe « descendre » plutôt que de la remplacer par le plus général « aller ».
- source_word: ንበር
  choice: Habite
  rationale: Exprime l’établissement ou la résidence demandée, tout en restant distinct du verbe suivant relatif au séjour comme étranger.
- source_word: ፍልስ
  choice: séjourne
  rationale: Préserve l’idée d’un séjour sans suggérer nécessairement une installation permanente; le contexte d’Isaac comme résident étranger reste perceptible.
- source_word: እሄሉ፡ ምስሌከ
  choice: Je serai avec toi
  rationale: Traduction directe et idiomatique de la promesse de présence divine.
- source_word: እባርከከ
  choice: je te bénirai
  rationale: Conserve le vocabulaire biblique courant et la portée ouverte de la bénédiction.
theological_decisions:
- issue: Désignation divine እግዚአብሔር
  choice: le SEIGNEUR
  alternative: Dieu / le Seigneur
  rationale: « le SEIGNEUR » suit la convention biblique française pour le nom divin dans ce récit parallèle à Genèse 26, sans développer une interprétation confessionnelle.
- issue: Promesse divine laissée inachevée par l’extrait source
  choice: car c’est à toi…
  alternative: compléter la phrase à partir des versets suivants ou d’une autre édition
  rationale: Le texte fourni s’interrompt après « car à toi ». La traduction conserve cette limite documentaire au lieu de reconstruire silencieusement la suite.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient au discours direct divin dans le registre biblique français. « Habite » et « séjourne » maintiennent la distinction entre résidence et séjour comme étranger. La ponctuation et les points de suspension rendent visible le caractère tronqué de l’extrait.
