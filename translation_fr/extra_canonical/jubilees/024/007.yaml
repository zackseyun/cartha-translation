  text: Jacob grandit et observa le commandement de son père, mais Ésaü le rejeta. Il y eut une famine dans le pays, et il vint
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አህቀ
  choice: grandit
  rationale: Le verbe exprime ici le fait de grandir ou d’atteindre la maturité, plutôt que de devenir grand en rang ou en puissance.
- source_word: ኀለወ
  choice: observa
  rationale: Le verbe signifie garder ou observer un commandement.
- source_word: ዐበየ
  choice: rejeta
  rationale: Dans le texte corrigé attesté par l’édition, le verbe décrit le refus d’Ésaü d’observer le commandement.
- source_word: ረኃብ
  choice: famine
  rationale: Le contexte et le texte éditorial restitué désignent une famine touchant le pays.
- source_word: ምድር
  choice: pays
  rationale: « Pays » est le terme français naturel dans la formule biblique relative à une famine, tout en restant compatible avec « terre ».
theological_decisions:
- issue: Identité de celui qui observe puis de celui qui rejette le commandement
  choice: Jacob observe le commandement de son père, tandis qu’Ésaü le rejette.
  alternative: Jacob s’écarte du commandement de son père.
  rationale: La lecture alternative dépend d’un texte source corrompu par OCR et inverse le sens du passage. Le texte de l’édition de Charles porte qu’il observa le commandement de son père, mais qu’Ésaü refusa.
- issue: Clause finale inachevée
  choice: Conserver « et il vint » sans compléter la destination.
  alternative: Préciser de manière conjecturale où ou vers qui il vint.
  rationale: L’extrait fourni s’arrête sur une proposition inachevée; la traduction ne doit pas importer la suite du verset ni résoudre artificiellement le référent du pronom.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique. La fin demeure volontairement suspendue, conformément à l’extrait source transmis.
