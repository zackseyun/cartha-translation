  text: By your seed all the nations of the earth will be covenant.[a] And now your father obeyed my voice and kept my charge and my commandments and my laws and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him
translation:
  language: fr
  text: « Par ta descendance, toutes les nations de la terre seront bénies[a], parce que ton père a écouté ma voix et observé mes prescriptions, mes commandements, mes lois, mes ordonnances et mon alliance.[b] Et maintenant, écoute ma voix et habite dans ce pays. » Il habita à Guérar pendant trois semaines d’années. Et Abimélec donna un ordre à son sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe « seront bénies » est sous-entendu dans le texte transmis ici et se comprend d’après le contexte.
    reason: textual_ellipsis
  - marker: b
    text: Le texte énumère cinq termes juridiques distincts, dont les sens se recoupent en partie; ils sont tous conservés dans la traduction.
    reason: segmentation_note
lexical_decisions:
- source_word: በዘርእከ
  choice: Par ta descendance
  rationale: Rend l’instrumental በ- et le nom collectif « descendance » sans imposer ici un référent individuel.
- source_word: ሰምዐ … ቃለ
  choice: a écouté ma voix
  rationale: En contexte d’obéissance, « écouter » exprime naturellement en français la réponse effective à la parole divine tout en restant proche de l’expression source.
- source_word: ዑቃቤየ / ትእዛዛትየ / ሕገጊየ / ሥርዐትየ / ኪዳንየ
  choice: mes prescriptions, mes commandements, mes lois, mes ordonnances et mon alliance
  rationale: Conserve les cinq éléments distincts et leur ordre, malgré leur proximité sémantique.
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመት
  choice: trois semaines d’années
  rationale: Reproduit l’unité chronologique propre aux Jubilés, soit trois périodes de sept ans, sans la convertir silencieusement en vingt et un ans.
- source_word: አዘዘ … በእንቲአሁ
  choice: donna des ordres à son sujet
  rationale: La formulation demeure ouverte quant au contenu des ordres, qui se poursuit dans le verset suivant.
theological_decisions:
- issue: Portée de « descendance »
  choice: Conserver le collectif « descendance »
  alternative: « descendant » au singulier
  rationale: Le terme source peut fonctionner collectivement; le verset ne justifie pas à lui seul de trancher en faveur d’une identification individuelle.
- issue: Bénédiction des nations
  choice: « seront bénies », avec note signalant l’ellipse
  alternative: Omettre le verbe ou traduire littéralement une phrase incomplète
  rationale: Le sens est fourni par la construction et le contexte immédiat, mais l’ajout nécessaire en français est rendu transparent par une note.
- issue: Nature de ኪዳንየ
  choice: « mon alliance »
  alternative: « mon pacte »
  rationale: « Alliance » est le terme français courant et digne pour une relation d’engagement divin, sans ajout confessionnel.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La parole directe est ponctuée clairement. « Semaines d’années » est conservé comme expression technique du livre et « Abimélek » suit une graphie française courante.
