  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
translation:
  language: fr
  text: Après la mort d’Abraham, le Seigneur bénit Isaac, son fils. Isaac partit d’Hébron, se rendit au Puits de la Vision[a] et s’y établit, la première année de la troisième semaine de ce jubilé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom de lieu est traduit littéralement du guèze par « Puits de la Vision ». Il correspond probablement au lieu mentionné dans la Genèse, mais le texte principal n’adopte pas sa forme traditionnelle plus développée.
    reason: cross_reference
lexical_decisions:
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Rend de manière traditionnelle et naturelle le titre divin guèze dans ce contexte narratif.
- source_word: ወተንሥአ፡ እምኬብሮን
  choice: Isaac partit d’Hébron
  rationale: Le sens contextuel est celui d’un départ; la répétition explicite d’« Isaac » évite en français toute ambiguïté après « son fils ».
- source_word: ዐዘቅተ፡ ራእይ
  choice: Puits de la Vision
  rationale: Traduction littérale du nom de lieu guèze, sans importer dans le texte principal une forme traditionnelle plus développée.
- source_word: ኀደረ
  choice: s’y établit
  rationale: Exprime naturellement le fait de demeurer ou de s’installer dans le lieu indiqué.
- source_word: በዓመት፡ አሐዱ፡ ዘሣልስ፡ ሱባዔ
  choice: la première année de la troisième semaine
  rationale: Reproduit la formule chronologique propre au système de semaines d’années du livre.
theological_decisions:
- issue: Identification du possesseur dans « Isaac, son fils »
  choice: Conserver « Isaac, son fils » après la mention d’Abraham
  alternative: « son fils Isaac »
  rationale: L’apposition suit de près l’ordre du guèze et laisse le lien filial attaché à Abraham sans reformulation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La formule d’ouverture a été allégée en « Après la mort d’Abraham » pour éviter un tour archaïque, tandis que la chronologie jubilaire et le nom de lieu littéral sont conservés.
