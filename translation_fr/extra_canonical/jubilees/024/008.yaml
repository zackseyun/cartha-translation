  yaml_path: translation/extra_canonical/jubilees/024/008.yaml
  text: Isaac was going to go down to Egypt in the second year of this week, and he went to Gerar, to Abimelech king of the Philistines.
translation:
  language: fr
  text: Isaac se disposait à descendre en Égypte[a] dans la deuxième année de cette semaine. Il alla à Guérar, auprès d’Abimélek, roi des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « allait descendre en Égypte ».'
    reason: La forme verbale peut se rendre par une tournure exprimant soit l’intention, soit l’imminence de l’action.
lexical_decisions:
- source_word: ይረድ
  choice: se disposait à descendre
  rationale: La forme imperfective exprime ici une action envisagée ou imminente, et non une descente effectivement accomplie; la suite précise qu’Isaac alla à Guérar.
- source_word: በካልእ፡ ዓመት፡ ዘዝ፡ ሱባዔ
  choice: dans la deuxième année de cette semaine
  rationale: Rend directement « deuxième année » et le démonstratif « cette », sans substituer l’interprétation contextuelle « sixième » au texte guèze.
- source_word: ወሖረ
  choice: Il alla
  rationale: Le parfait marque le déplacement effectivement accompli vers Guérar, en contraste avec la descente projetée en Égypte.
- source_word: ኀበ፡ አቤሜሌክ
  choice: auprès d’Abimélek
  rationale: Rend la préposition de direction vers une personne dans un français naturel.
theological_decisions:
- issue: Isaac est-il réellement descendu en Égypte ?
  choice: La traduction présente la descente en Égypte comme un projet imminent.
  alternative: « Isaac descendit en Égypte »
  rationale: L’alternative ferait d’une intention une action accomplie et entrerait en tension avec le mouvement suivant vers Guérar.
translation_notes:
  register: Français international moderne, narratif et digne. « Se disposait à » distingue clairement le projet de descendre en Égypte du déplacement effectivement accompli vers Guérar. La syntaxe a été légèrement réordonnée pour identifier naturellement Abimélek comme roi des Philistins.
