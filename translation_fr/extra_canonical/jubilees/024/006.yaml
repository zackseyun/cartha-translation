  yaml_path: translation/extra_canonical/jubilees/024/006.yaml
  text: '"Swear to me today." And he swore to him. And Jacob gave Esau his brother bread and stew, and he ate until he was satisfied. And Esau sold his birthright. Therefore his name was called Edom, because of the wheat stew that Jacob gave him in exchange for his birthright.'
translation:
  language: fr
  text: « Jure-le-moi aujourd’hui. » Et Ésaü le lui jura. Jacob donna alors à son frère Ésaü du pain et un ragoût. Ésaü mangea jusqu’à satiété, puis il vendit son droit d’aînesse. C’est pourquoi on l’appela Édom, à cause du ragoût de blé que Jacob lui avait donné en échange de son droit d’aînesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐል፡ ሊተ፡ ዮም
  choice: Jure-le-moi aujourd’hui
  rationale: Rend directement l’impératif, le complément « à moi » et l’indication temporelle du guèze.
- source_word: ተብሰለ
  choice: ragoût
  rationale: Le terme désigne ici un mets cuit; « ragoût » est naturel en français et convient au contexte sans préciser des ingrédients absents à la première occurrence.
- source_word: መጠ
  choice: vendit
  rationale: Le verbe exprime une vente ou une cession, et non le mépris; « vendit » maintient la transaction explicite du texte.
- source_word: ቀዳሙ፡ ትውልዶ
  choice: droit d’aînesse
  rationale: Expression française consacrée et intelligible pour le statut ou privilège attaché à la première naissance.
- source_word: ስርናይ
  choice: blé
  rationale: Le mot guèze signifie « blé »; le traduire par « lentilles » ou ajouter « rouge » harmoniserait indûment ce passage avec Genèse 25.
theological_decisions:
- issue: Nature de l’acte d’Ésaü envers son droit d’aînesse
  choice: il vendit son droit d’aînesse
  alternative: il méprisa son droit d’aînesse
  rationale: Le texte guèze de ce verset décrit la vente; la formulation de Genèse 25:34 sur le mépris ne doit pas remplacer le verbe effectivement attesté ici.
- issue: Identification du mets associé au nom Édom
  choice: ragoût de blé
  alternative: ragoût de lentilles rouges
  rationale: Le texte source nomme explicitement le blé et ne contient aucun adjectif signifiant « rouge »; la tension avec le récit canonique est donc conservée.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe sémitique « son nom fut appelé » est idiomatiquement rendue par « on l’appela ». Le sujet « Ésaü » est explicité dans la seconde phrase pour éviter une ambiguïté pronominale en français.
