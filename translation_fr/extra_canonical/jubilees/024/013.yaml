lexical_decisions:
- source_word: ሞተ፡ ለይሙት
  choice: qu’il soit mis à mort
  rationale: La tournure associe le nom verbal « mort » à un verbe jussif, exprimant avec force la condamnation à mort. Cette formulation française naturelle en conserve la portée sans ajouter « certainement », absent comme adverbe distinct.
- source_word: በፍልስጥኤም
  choice: en Philistie
  rationale: Le terme désigne ici le territoire, et non simplement le peuple philistin.
- source_word: አህቀ
  choice: prospéra
  rationale: Dans ce contexte narratif, le verbe indique la réussite ou la prospérité d’Isaac.
- source_word: ጥሪት፡ ብዙኅ
  choice: de nombreux biens
  rationale: « Biens » rend largement les possessions ou la propriété, tandis que « nombreux » conserve la quantité exprimée par le guèze.
