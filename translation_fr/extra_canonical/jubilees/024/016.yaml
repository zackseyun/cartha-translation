revisions:
- from: 'après la mort d’Abraham, et les remplirent de terre. Abimélek dit à Isaac : « Éloigne-toi de nous, car tu es devenu beaucoup plus puissant que nous. » Isaac partit de là la première année de la septième semaine et campa dans la vallée de Guérar. On creusa de nouveau les puits que les serviteurs d’Abraham, son père, avaient creusés et que les Philistins avaient bouchés après la mort de son père Abraham. On leur donna les noms que son père Abraham leur avait donnés. Les serviteurs d’Isaac creusèrent un puits dans l’oued et y trouvèrent de l’eau vive. Les bergers de Guérar se querellèrent avec les bergers d’Isaac en disant : « Cette eau est à nous ! » Isaac appela ce puits Dispute, parce qu’ils s’étaient disputés avec nous. Ils creusèrent un autre puits, au sujet duquel on se querella aussi, et il l’appela Hostilité. Il partit de là et creusa un autre puits. On ne se querella pas à son sujet, et il l’appela Large Espace. Isaac dit : « Maintenant, le SEIGNEUR nous a fait de la place,
    et nous porterons du fruit dans le pays. »


    De là, il monta au Puits du Serment, la première année de la première semaine du quarante-quatrième jubilé. Le SEIGNEUR lui apparut cette nuit-là, à l’aube du premier jour du premier mois, et lui dit : « Je suis le Dieu d’Abraham, ton père. N’aie pas peur, car je suis avec toi. Je te bénirai et je multiplierai abondamment ta descendance comme le sable de la terre, à cause d’Abraham, mon serviteur. » Là, Isaac bâtit un autel à l’endroit où son père Abraham en avait d’abord bâti un. Il invoqua le nom du SEIGNEUR et offrit un sacrifice au Dieu d’Abraham, son père. Ils creusèrent un puits et trouvèrent de l’eau vive.


    Les serviteurs d’Isaac creusèrent un autre puits, mais ne trouvèrent pas d’eau. Ils vinrent annoncer à Isaac qu’ils n’avaient pas trouvé d’eau. Isaac dit : « Aujourd’hui, j’ai prêté serment aux Philistins, et voilà ce qui nous est arrivé. » Il appela donc cet endroit Puits du Serment, parce que c’est là qu’il avait prêté serment à Abimélek, à Ahouzzath, le compagnon de celui-ci, et à Pikol, le chef de son armée. Ce jour-là, Isaac comprit qu’il avait prêté serment sous la contrainte afin de faire la paix avec eux.


    Ce même jour, Isaac maudit les Philistins et dit : « Que les Philistins soient maudits, livrés à la fureur et à l’indignation parmi toutes les nations ! Que le SEIGNEUR les livre au mépris, à la malédiction, à la fureur et à l’indignation, entre les mains de nations pécheresses, entre les mains des Kittim ! Quant à ceux qui échapperont à l’épée de l’ennemi et aux Kittim, qu’un peuple juste les déracine dans le jugement, de dessous le ciel[a], car, de génération en génération, ils seront les ennemis de mes enfants et les haïront sur la terre. Il ne leur restera aucun survivant, personne qui échappe au jour où s’exercera le jugement avec fureur. En effet, toute la descendance des Philistins est vouée à être détruite, déracinée et supprimée de la terre. Il ne restera plus à ces gens de Kaftor ni reste ni descendance sur la terre.


    « Même si l’un d’eux monte jusqu’au ciel, on l’en fera descendre ; s’il s’enfonce dans la terre, on l’en arrachera ; s’il se cache parmi les nations, on l’en déracinera ; et s’il descend au Shéol, là aussi son châtiment augmentera, et il n’y trouvera aucune paix. S’il part en captivité, ceux qui cherchent à lui ôter la vie le tueront en chemin. Il ne lui restera ni nom ni descendance sur toute la terre, car il ira à la malédiction éternelle. »


    Ainsi en est-il écrit et décrété à son sujet sur les tablettes célestes : au jour du jugement, on agira ainsi envers lui afin qu’il soit déraciné de la terre.'
