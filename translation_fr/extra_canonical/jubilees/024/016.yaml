  text: after Abraham died, and filled them with earth. And Abimelech said to Isaac, "Go away from us, for you have become much mightier than we." And Isaac departed from there in the first year of the seventh week and camped in the valley of Gerar. And they dug again the wells of water that the servants of Abraham his father had dug, and that the Philistines had stopped up after Abraham his father died; and they called their names by the names that Abraham his father had called them. And Isaac's servants dug a well in the wadi and found living water. And the shepherds of Gerar quarreled with Isaac's shepherds, saying, "The water is ours." And Isaac called the name of that well Contention, because they contended with us. And they dug another well, and they quarreled over that one also, and he called its name Hostility. And he moved on from there and dug another well, and they did not quarrel over it, and he called its name Broad Place. And Isaac said, "Now the LORD has made room for us,
    and we will be fruitful in the land." And he went up from there to the Well of the Oath in the first year of the first week in the forty-fourth jubilee. And the LORD appeared to him that night, at dawn on the first day of the first month, and said to him, "I am the God of Abraham your father. Do not fear, for I am with you, and I will bless you and greatly multiply your seed like the sand of the earth, for the sake of Abraham my servant." And he built there an altar where Abraham his father had first built one, and he called on the name of the LORD, and he offered sacrifice to the God of Abraham his father. And they dug a well and found living water. And Isaac's servants dug another well and did not find water, and they came and told Isaac that they had not found water. And Isaac said, "On this day I have sworn to the Philistines, and this thing has happened to us." And he called the name of that place Well of the Oath, because there he swore to Abimelech and to Ahuzzath his companion
    and to Phicol the captain of his army. And Isaac knew on that day that he had sworn under compulsion, to make peace with them. And on that day Isaac cursed the Philistines and said, "Cursed be the Philistines with wrath and indignation among all the nations. May the LORD give them over for reproach and for cursing and for wrath and for indignation into the hand of sinful nations, into the hand of the Kittim. And those who escape from the sword of the enemy and from the Kittim, let a righteous people root them out in judgment from under heaven, because they will be enemies and haters of my children in their generations upon the earth. And there will not be left to them any survivor or anyone who escapes in the day of wrathful judgment. For all the seed of the Philistines is destined for destruction and uprooting and removal from the earth, and there will no longer remain for these Caphtorim a remnant or seed upon the earth. For even if he goes up to heaven, from there he will be brought
    down; and if he sinks into the earth, from there he will be dragged away; and if he hides among the nations, from there he will be rooted out; and if he goes down into Sheol, there also his judgment will increase, and there will be no peace for him there. And if he goes into captivity, by the hand of those who seek his life on the highways they will kill him, and there will be left for him neither name nor seed in all the earth, for he will go into eternal curse." And thus it is written and ordained concerning him on the heavenly tablets, to do to him on the day of judgment, so that he should be rooted out from the earth.
translation:
  language: fr
  text: 'après la mort d’Abraham, et les remplirent de terre. Abimélek dit à Isaac : « Éloigne-toi de nous, car tu es devenu beaucoup plus puissant que nous. » Isaac partit de là la première année de la septième semaine et campa dans la vallée de Guérar. On creusa de nouveau les puits que les serviteurs d’Abraham, son père, avaient creusés et que les Philistins avaient bouchés après la mort de son père Abraham. On leur donna les noms que son père Abraham leur avait donnés. Les serviteurs d’Isaac creusèrent un puits dans l’oued et y trouvèrent de l’eau vive. Les bergers de Guérar se querellèrent avec les bergers d’Isaac en disant : « Cette eau est à nous ! » Isaac appela ce puits Dispute, parce qu’ils s’étaient disputés avec nous. Ils creusèrent un autre puits, au sujet duquel on se querella aussi, et il l’appela Hostilité. Il partit de là et creusa un autre puits. On ne se querella pas à son sujet, et il l’appela Large Espace. Isaac dit : « Maintenant, le SEIGNEUR nous a fait de la place,
    et nous porterons du fruit dans le pays. »


    De là, il monta aux Puits du Serment, la première année de la première semaine du quarante-quatrième jubilé. Le SEIGNEUR lui apparut cette nuit-là, à l’aube du premier jour du premier mois, et lui dit : « Je suis le Dieu d’Abraham, ton père. N’aie pas peur, car je suis avec toi. Je te bénirai et je multiplierai abondamment ta descendance comme le sable de la terre, à cause d’Abraham, mon serviteur. » Là, Isaac bâtit un autel à l’endroit où son père Abraham en avait d’abord bâti un. Il invoqua le nom du SEIGNEUR et offrit un sacrifice au Dieu d’Abraham, son père. Ils creusèrent un puits et trouvèrent de l’eau vive.


    Les serviteurs d’Isaac creusèrent un autre puits, mais ne trouvèrent pas d’eau. Ils vinrent annoncer à Isaac qu’ils n’avaient pas trouvé d’eau. Isaac dit : « Aujourd’hui, j’ai prêté serment aux Philistins, et voilà ce qui nous est arrivé. » Il appela cet endroit Puits du Serment, parce que c’est là qu’il avait prêté serment à Abimélek, à Ahouzzath, le compagnon de celui-ci, et à Pikol, le chef de son armée. Ce jour-là, Isaac comprit qu’il avait prêté serment sous la contrainte afin de faire la paix avec eux.


    Ce même jour, Isaac maudit les Philistins et dit : « Que les Philistins soient maudits, livrés à la fureur et à l’indignation parmi toutes les nations ! Que le SEIGNEUR les livre au mépris, à la malédiction, à la fureur et à l’indignation, entre les mains de nations pécheresses, entre les mains des Kittim ! Quant à ceux qui échapperont à l’épée de l’ennemi et aux Kittim, qu’un peuple juste les déracine dans le jugement, de dessous le ciel[a], car, de génération en génération, ils seront les ennemis de mes enfants et les haïront sur la terre. Il ne leur restera aucun survivant, personne qui échappe au jour où s’exercera le jugement avec fureur. En effet, toute la descendance des Philistins est vouée à être détruite, déracinée et supprimée de la terre. Il ne restera plus à ces gens de Kaftor ni reste ni descendance sur la terre.


    « Même si l’un d’eux monte jusqu’au ciel, on l’en fera descendre ; s’il s’enfonce dans la terre, on l’en arrachera ; s’il se cache parmi les nations, on l’en déracinera ; et s’il descend au Shéol, là aussi son châtiment augmentera, et il n’y trouvera aucune paix. S’il part en captivité, ceux qui cherchent à lui ôter la vie le tueront en chemin. Il ne lui restera ni nom ni descendance sur toute la terre, car il tombera sous une malédiction éternelle. »


    Ainsi en est-il écrit et décrété à son sujet sur les tablettes célestes : au jour du jugement, on agira ainsi envers lui afin qu’il soit déraciné de la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte imprimé présente ici une forme fautive. La correction probable donne « dans le jugement » ; sans cette correction, on pourrait traduire : « qu’un peuple juste les déracine de dessous le ciel ».'
    reason: Signaler une correction textuelle vraisemblable sans dissimuler l’incertitude de la leçon transmise.
lexical_decisions:
- source_word: ማየ፡ ሕይወ፡ (māya ḥəyw)
  choice: eau vive
  rationale: Expression littérale désignant une eau jaillissante ou courante; « eau vive » conserve l’image traditionnelle tout en restant intelligible en français.
- source_word: ስፍሐ፡ (səfḥā)
  choice: Large Espace
  rationale: Le nom du puits repose sur l’idée d’espace accordé; une traduction sémantique préserve le lien avec la déclaration qui suit.
- source_word: ዘርእ፡ (zarʾ)
  choice: descendance
  rationale: Dans ce contexte généalogique, « descendance » rend naturellement le sens collectif sans la coloration biologique de « semence ».
- source_word: ሲኦል፡ (Siʾol)
  choice: Shéol
  rationale: Le terme désigne ici le monde des morts; sa translittération conserve la référence ancienne sans l’identifier automatiquement à l’enfer.
- source_word: ኪጢኤም፡ (Kiṭiʾem)
  choice: Kittim
  rationale: Conservation du nom ethnique traditionnel, dont l’identification historique précise peut varier selon le contexte.
- source_word: መሐላ፡ (maḥālā)
  choice: Puits du Serment
