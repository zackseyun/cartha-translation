  source_fidelity: 'La traduction suit globalement avec précision le texte guèze et conserve, à juste titre, l’ouverture fragmentaire. La correction conjecturale de « dans le jugement » est explicitement signalée. Une correction est requise pour le toponyme ዐዘቅተ፡ መሐላ, littéralement « Puits du Serment » au pluriel : le guèze emploie le pluriel tant pour le lieu où Isaac monte que pour le nom donné au lieu.'
  naturalness: Français moderne, soutenu et généralement fluide. « Qu’un peuple juste les déracine dans le jugement, de dessous le ciel » reste un peu calqué, mais convient au registre solennel et à la formulation disputée, que la note documente. « Il tombera sous une malédiction éternelle » est plus naturel que « il ira à la malédiction éternelle » tout en gardant le sens.
  terminology: Les choix « eau vive », « descendance », « Shéol », « Kittim » et « SEIGNEUR » sont cohérents. Les noms personnels sont recevables en français. Les noms étiologiques de puits sont correctement traduits; « Puits du Serment » doit toutefois être mis au pluriel conformément au texte source.
  issues:
  - severity: medium
    issue: Toponyme rendu au singulier
    rationale: Le texte guèze porte ዐዘቅተ፡ መሐላ (« puits [pluriel] du serment ») dans les deux occurrences. Le français doit donc avoir « aux Puits du Serment » puis « Puits du Serment » comme nom de lieu pluriel.
  - severity: low
    issue: Formulation finale peu idiomatique
    rationale: « Il ira à la malédiction éternelle » reproduit de près l’anglais mais est moins naturel en français. « Il tombera sous une malédiction éternelle » exprime sans ajout doctrinal l’issue formulée par le guèze.
