lexical_decisions:
- source_word: መእተ፡ ስዊተ
  choice: au centuple
  rationale: Rend l’expression indiquant une récolte multipliée par cent, dans un français naturel et fidèle au contexte agricole.
- source_word: ዐብየ፡ ይስሐቅ፡ ፈድፋደ
  choice: Isaac devint extrêmement puissant
  rationale: Le verbe exprime la grandeur ou la croissance, renforcée par l’adverbe; « puissant » convient ici à la prospérité considérable d’Isaac sans limiter le sens à sa taille.
- source_word: ቀንኡ፡ ላዕሌሁ
  choice: le jalousèrent
  rationale: Traduit directement l’envie ou la jalousie dirigée contre Isaac.
- source_word: ዐዘቅተ
  choice: puits
  rationale: Terme contextuellement précis pour les ouvrages creusés par les serviteurs d’Abraham.
- source_word: ደፈንዎ
  choice: les bouchèrent
  rationale: Exprime clairement l’action de combler ou d’obstruer les puits.
