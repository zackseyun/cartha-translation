translation:
  language: fr
  text: parmi les Philistins, et il récolta au centuple. Isaac devint très grand, et les Philistins le jalousèrent. Tous les puits que les serviteurs d’Abraham avaient creusés du vivant d’Abraham, les Philistins les bouchèrent.
