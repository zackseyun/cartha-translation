  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
translation:
  language: fr
  text: À ta descendance, je donnerai tout ce pays, et je confirmerai le serment que j’ai fait à Abraham, ton père. Je multiplierai ta descendance comme les étoiles du ciel, et je donnerai à ta descendance tout ce pays. Et ils seront bénis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils se béniront ». Le texte fourni s’arrête ici; il ne contient pas encore les mots « toutes les nations de la terre ».
    reason: La dernière forme verbale est ambiguë entre un sens passif et réfléchi, et l’extrait source s’arrête à cet endroit par rapport au contexte continu.
lexical_decisions:
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Le terme désigne collectivement la postérité; «descendance» conserve ce sens collectif et l’écho des promesses patriarcales dans un français actuel.
- source_word: አቀውም፡ መሐላየ
  choice: je confirmerai le serment
  rationale: Le verbe exprime l’idée d’établir ou de rendre ferme; «confirmer» est naturel en français tout en préservant la force juridique de la formule.
- source_word: ይትባረኩ
  choice: ils seront bénis
  rationale: La forme peut être comprise comme passive ou réfléchie; le passif offre ici une lecture française naturelle sans ajouter le sujet développé qui ne figure pas dans l’extrait guèze.
theological_decisions:
- issue: Valeur de la dernière forme verbale ይትባረኩ
  choice: ils seront bénis
  alternative: ils se béniront
  rationale: La morphologie permet une nuance passive ou réfléchie. Le texte principal retient le passif, tandis que la note préserve l’autre possibilité sans compléter la phrase à partir du verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « tout ce pays » et de « ta descendance » est conservée pour respecter la structure solennelle du texte source.
