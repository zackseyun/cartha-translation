  to: les filles des nations. Et s’il en est une parmi ses filles qu’il donne à un homme d’entre les nations, car c’est fléau sur fléau et malédiction sur malédiction, tous ces fléaux et toutes ces malédictions viendront s’il agit ainsi et s’il ferme les yeux sur ceux qui commettent l’impureté, sur ceux qui souillent le sanctuaire du Seigneur et sur ceux qui profanent son saint nom. Tout le peuple sera jugé ensemble pour toute impureté et toute profanation.
