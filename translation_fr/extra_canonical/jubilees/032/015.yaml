base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
translation:
  language: fr
  text: les filles des nations. Et s’il en est une parmi ses filles qu’il donne à un homme d’entre les nations, car c’est fléau sur fléau et malédiction sur malédiction, tous ces fléaux et toutes ces malédictions viendront s’il agit ainsi et s’il ferme les yeux sur ceux qui commettent l’impureté, sur ceux qui souillent le sanctuaire du Seigneur et sur ceux qui profanent son saint nom. Tout le peuple sera jugé ensemble pour toute impureté et toute profanation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ፡ አሕዛብ
  choice: les filles des nations
  rationale: Reproduit directement le syntagme guèze, qui poursuit manifestement la phrase du contexte précédent.
- source_word: እምአዋልዲሁ
  choice: l’une de ses filles
  rationale: Le suffixe est à la troisième personne masculine du singulier (« ses »), et non à la deuxième personne.
- source_word: መቅሠፍት
  choice: fléau
  rationale: Conserve le sens de calamité ou châtiment sans préciser une forme particulière telle qu’une épidémie.
- source_word: ርኵሰ
  choice: impureté
  rationale: Rend le vocabulaire de souillure rituelle et morale de façon suffisamment large.
- source_word: መቅደሶ
  choice: sanctuaire
  rationale: Terme naturel et précis pour le lieu saint de Dieu.
- source_word: ይጌምኑ
  choice: profanent
  rationale: Exprime l’atteinte portée au caractère sacré du nom divin.
- source_word: ኅቡረ
  choice: collectivement
  rationale: Préserve l’idée que le peuple est jugé ensemble, comme un tout.
theological_decisions:
- issue: Portée collective du jugement
  choice: Le peuple tout entier sera jugé collectivement
  alternative: Tous les membres du peuple seront jugés
  rationale: Le guèze souligne le peuple dans son ensemble et le jugement commun; la formulation retenue conserve cette tension de responsabilité collective sans l’expliquer ni l’atténuer.
- issue: Nom divin
  choice: le Seigneur
  alternative: YHWH / l’Éternel
  rationale: Le texte guèze emploie le titre divin usuel; « le Seigneur » le rend sans importer une reconstruction ou une tradition confessionnelle particulière.
- issue: Rapport causal introduit par እስመ
  choice: car c’est fléau sur fléau
  alternative: ce sera fléau sur fléau
  rationale: Conserve à la fois la conjonction causale et la copule présente du texte source, sans ajouter « sur lui ».
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe répétitive des propositions introduites par « sur ceux qui » conserve l’accumulation solennelle du texte. Le début demeure un fragment (« les filles des nations »), puisqu’il dépend du contexte précédent dans la source.
