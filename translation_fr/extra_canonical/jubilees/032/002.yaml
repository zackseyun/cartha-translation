base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
translation:
  language: fr
  text: Jacob se leva de bon matin, le quatorzième jour de ce mois. Il donna le dixième de tout ce qui l’avait accompagné, depuis les êtres humains jusqu’aux animaux, depuis l’or jusqu’à tous les biens. Il l’apporta et donna le dixième de tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጌሰ፡ ያዕቆብ፡ በነግህ
  choice: Jacob se leva de bon matin
  rationale: Rend naturellement l’action matinale exprimée par le texte guèze, dans un registre narratif digne et courant.
- source_word: ወዐሠረ፡ እምኵሉ
  choice: Il donna le dixième de tout
  rationale: Exprime clairement l’idée de la dîme sans employer un verbe français rare ou trop technique.
- source_word: እምሰብእ፡ እስከ፡ እንስሳ
  choice: depuis les êtres humains jusqu’aux animaux
  rationale: Conserve l’étendue explicite et surprenante de l’énumération, sans en atténuer la portée.
- source_word: ወአብአ
  choice: Il l’apporta
  rationale: Le causatif du verbe « entrer » signifie ici faire entrer ou apporter, et non « prendre ».
- source_word: ንዋይ
  choice: biens
  rationale: Terme français large et naturel pour l’ensemble des possessions ou ressources matérielles.
theological_decisions:
- issue: Portée de ce qui est soumis au dixième
  choice: Maintenir « depuis les êtres humains jusqu’aux animaux »
  alternative: Interpréter cette formule comme une simple mention des serviteurs et du bétail
  rationale: Le texte énumère explicitement les êtres humains et les animaux; la traduction préserve cette tension sans imposer une explication.
- issue: Sens cultuel de l’action finale
  choice: « Il l’apporta et donna le dixième de tout »
  alternative: « Il l’offrit en dîme »
  rationale: La formulation retenue reste proche des verbes du texte et évite de préciser silencieusement le lieu, le destinataire ou le rite exact.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « donna le dixième de tout » est conservée parce qu’elle reflète l’insistance du texte source. L’expression initiale « à Dieu » du témoin fourni paraît clore la phrase précédente, conformément à la délimitation du verset attestée par la couche de consultation.
