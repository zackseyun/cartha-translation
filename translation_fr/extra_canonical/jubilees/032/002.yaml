  verdict: revise
  source_fidelity: Le projet rend correctement la date, le fait que Jacob se lève tôt, l’étendue de l’énumération (« des êtres humains aux animaux », « de l’or à tous les biens »), ainsi que ወአብአ par « apporta » plutôt que « prit ». La répétition de l’acte de donner le dixième est conservée. « Ce qui était venu avec lui » est toutefois un calque peu idiomatique et légèrement imprécis en français narratif; « tout ce qui l’avait accompagné » exprime plus naturellement le mouvement indiqué sans ajouter d’interprétation cultuelle.
