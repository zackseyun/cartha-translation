  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
translation:
  language: fr
  text: 'En ces jours-là, Rachel devint enceinte de Benjamin. Jacob compta ses fils en commençant par lui[a] : Lévi échut comme part au SEIGNEUR, et son père le revêtit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à partir de lui », c’est-à-dire de Benjamin.'
    reason: Clarifie le référent masculin et conserve la nuance du guèze እምኔሁ.
lexical_decisions:
- source_word: ፀንሰት
  choice: devint enceinte
  rationale: Rend naturellement le verbe guèze exprimant la conception ou la grossesse.
- source_word: እምኔሁ
  choice: en commençant par lui
  rationale: Conserve le détail narratif selon lequel le décompte commence par Benjamin, indispensable à la logique qui fait de Lévi le dixième.
- source_word: ዐርገ
  choice: échut
  rationale: Dans le contexte d’un décompte aboutissant à une part attribuée, « échut » exprime idiomatiquement le résultat sans gommer l’image du texte source.
- source_word: በመክፈሊተ፡ እግዚአብሔር
  choice: comme part au SEIGNEUR
  rationale: Exprime l’attribution de Lévi à la part du Seigneur dans un français clair et soutenu.
- source_word: አልበሱ
  choice: le revêtit
  rationale: Préserve le sens concret et potentiellement cultuel de l’habillement, sans préciser un vêtement absent du texte.
theological_decisions:
- issue: Lien entre le décompte des fils et l’élection de Lévi
  choice: Maintenir explicitement que Jacob commence son décompte par Benjamin
  alternative: Omettre « en commençant par lui » et écrire simplement que Jacob compta ses fils
  rationale: Le détail source préserve la logique de Lévi compté comme dixième et attribué au Seigneur, sans ajouter d’explication doctrinale au corps du verset.
- issue: Nature de la « part du Seigneur »
  choice: « Lévi échut comme part au SEIGNEUR »
  alternative: « Lévi devint la dîme du SEIGNEUR »
  rationale: La formulation retenue conserve l’image de la part ou du lot sans expliciter davantage que le texte guèze.
translation_notes:
  register: Français international moderne, digne et lisible. « SEIGNEUR » représente le nom divin dans la formule source. La ponctuation explicite le rapport logique entre le décompte et le fait que Lévi échoit au Seigneur.
