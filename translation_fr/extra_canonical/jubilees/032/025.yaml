  yaml_path: translation/extra_canonical/jubilees/032/025.yaml
  text: And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road, above her tomb.
translation:
  language: fr
  text: Rachel mourut là et fut enterrée dans le pays d’Éphrata, c’est-à-dire Bethléem. Jacob éleva sur le tombeau de Rachel une stèle, sur le chemin, au-dessus de sa tombe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተት
  choice: mourut
  rationale: Rend directement le verbe guèze au parfait, dans un registre narratif naturel et digne.
- source_word: ተቀብረት
  choice: fut enterrée
  rationale: Conserve la valeur passive du verbe et convient au français courant.
- source_word: ምድረ ኤፍራታ
  choice: le pays d’Éphrata
  rationale: Rend ምድር par « pays » plutôt que « terre », ici au sens de territoire ou région.
- source_word: ኀነጸ
  choice: dressa
  rationale: Bien que le verbe puisse signifier « construire », « dresser » est idiomatique en français avec une stèle et exprime l’érection du monument.
- source_word: ሐውልተ
  choice: une stèle
  rationale: Désigne clairement un monument commémoratif dressé sur une tombe; plus précis ici que « colonne ».
- source_word: ውስተ ፍኖት
  choice: au bord du chemin
  rationale: Le contexte appelle une indication de situation liée au chemin; cette formulation est naturelle sans alourdir la phrase.
- source_word: መቃብር / መቃብሪሃ
  choice: tombe / tombeau
  rationale: La légère variation française évite une répétition pesante tout en conservant le même référent funéraire.
