base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
translation:
  language: fr
  text: Leurs royaumes étaient Karnaïm, Ashtaroth, Édréi, Misour et Béon. Le SEIGNEUR les détruisit à cause de leurs mauvaises actions, car ils étaient extrêmement mauvais. Il établit à leur place les Amorites, qui étaient mauvais et pécheurs. Aujourd’hui, aucun peuple n’a achevé tous les péchés qui étaient les leurs[a], et eux ne sont plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’a achevé tous leurs péchés ».'
    reason: La construction du texte source est inhabituelle. La traduction conserve l’idée de totalité et le possessif pluriel collectif sans déterminer davantage l’antécédent de la conclusion suivante.
lexical_decisions:
- source_word: አሕጐሎሙ (ʾaḥgʷalomu)
  choice: les détruisit
  rationale: Le verbe exprime ici la destruction ou la ruine, et non simplement un jugement.
- source_word: ጸዋጋን፡ ጥቀ (ṣawāgān ṭəqē)
  choice: extrêmement mauvais
  rationale: Rend l’intensification portée par ጥቀ tout en conservant le jugement moral du texte.
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: Il établit à leur place les Amorites
  rationale: Le causatif signifie faire demeurer ou installer; «établit» est naturel en français dans ce contexte territorial.
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: n’a mené jusqu’au bout tous leurs péchés
  rationale: Conserve à la fois l’idée d’achèvement exprimée par ፈጸመ et la totalité explicitement marquée par ኵሎ, sans ajouter la notion interprétative de «mesure».
- source_word: ወአልቦሙ
  choice: et eux ne sont plus
  rationale: Reproduit la brève conclusion existentielle et garde le pronom sans en préciser artificiellement l’antécédent.
theological_decisions:
- issue: Nature de l’action divine
  choice: Le SEIGNEUR les détruisit
  alternative: Le SEIGNEUR les jugea
  rationale: Le sens lexical du verbe guèze est «détruire, ruiner»; «juger» atténuerait et modifierait l’action décrite.
- issue: Formulation de l’accomplissement des péchés
  choice: mené jusqu’au bout tous leurs péchés
  alternative: comblé la mesure de leurs péchés
  rationale: La seconde formulation introduirait une image théologique de mesure qui n’est pas explicitement présente dans le texte source.
translation_notes:
  register: Français moderne, digne et accessible. Les noms propres suivent une translittération française lisible. Les phrases ont été légèrement segmentées pour la clarté, tandis que l’étrangeté de la dernière affirmation et l’ambiguïté de ses pronoms sont préservées.
