  verdict: revise
  source_fidelity: 'Le sens principal est fidèlement rendu : le verbe guèze désigne la destruction, l’intensif moral est conservé, et l’installation des Amorites « à leur place » est bien exprimée. La totalité de « tous leurs péchés » est également maintenue, sans introduire l’image interprétative d’une « mesure » des péchés. La conclusion conserve volontairement son référent quelque peu abrupt.'
  naturalness: La phrase « aucun peuple n’a mené jusqu’au bout tous leurs péchés » est peu idiomatique et présente une discordance entre le singulier « aucun peuple » et le possessif pluriel « leurs ». « Achever tous les péchés qui étaient les leurs » est naturel en français tout en gardant le possessif pluriel collectif du texte.
  terminology: « Le SEIGNEUR », « détruisit », « Amorites », « mauvais et pécheurs » et « Édréi » conviennent au registre biblique moderne. « Karnaïm » s’aligne sur la forme retenue dans la piste d’audit anglaise et évite une variation non justifiée avec « Qarnaïm ».
