  to: Leurs royaumes étaient Karnaïm, Ashtaroth, Édréi, Misour et Béon. Le SEIGNEUR les détruisit à cause de leurs mauvaises actions, car ils étaient extrêmement mauvais. Il établit à leur place les Amorites, qui étaient mauvais et pécheurs. Aujourd’hui, aucun peuple n’a achevé tous les péchés qui étaient les leurs[a], et eux ne sont plus.
  rationale: La révision corrige la seule difficulté réelle de français dans la dernière phrase. Elle conserve « détruisit », conformément au sens de አሕጐሎሙ, préserve « tous » pour ኵሎ, et ne transforme pas l’expression en « combler la mesure des péchés ». « Et eux ne sont plus » maintient la brièveté et l’ambiguïté référentielle du texte.
