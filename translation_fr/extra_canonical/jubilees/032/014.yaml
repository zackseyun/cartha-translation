base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: fr
  text: et ainsi en sera-t-il de tes enfants à travers tous les âges. Que le Seigneur te donne, à toi et à ta descendance, la grandeur de cœur pour sa gloire. Qu’il vous fasse approcher de lui, toi et ta descendance, d’entre tous les êtres de chair, afin qu’ils servent dans son sanctuaire[a], comme les anges de la Présence et comme les saints. À leur ressemblance, la descendance de tes enfants sera pour la gloire et la grandeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe est à la troisième personne du pluriel : « afin qu’ils servent ». Il se rapporte vraisemblablement à la descendance, bien que la construction puisse associer Jacob et sa descendance à l’approche de Dieu.'
    reason: Préserver la personne grammaticale du texte source et rendre transparente l’ambiguïté du rattachement syntaxique.
lexical_decisions:
- source_word: ወውሉደከ፡ በኵሉ፡ ዓለማት
  choice: et ainsi en sera-t-il de tes enfants dans tous les siècles
  rationale: La formulation conserve le lien avec le contexte précédent et rend ዓለማት par une expression temporelle naturelle et solennelle.
- source_word: ዐበየ፡ ልበየ
  choice: un cœur magnanime
  rationale: Littéralement lié à la grandeur du cœur, le syntagme désigne une disposition intérieure élevée; « magnanime » préserve cette image sans suggérer simplement l’intelligence.
- source_word: ያቅርብ፡ ኀቤሁ፡ እምኵሉ፡ ዘሥጋ
  choice: qu’il te fasse approcher de lui, toi et ta descendance, parmi tous les êtres de chair
  rationale: Cette traduction conserve l’idée d’élection et d’approche cultuelle parmi l’ensemble des mortels, sans expliciter davantage le rapport syntaxique.
- source_word: ይትአዘዙ፡ ውስተ፡ መቅደሱ
  choice: afin qu’ils servent dans son sanctuaire
  rationale: Le verbe est à la troisième personne du pluriel et renvoie principalement à la descendance; « servir » convient au contexte cultuel sans surspécifier une fonction sacerdotale.
- source_word: መላእክተ፡ ገጽ
  choice: les anges de la Présence
  rationale: Expression technique traditionnelle qui rend littéralement les anges associés à la face ou présence divine.
- source_word: ለክብር፡ ወለዕበይ
  choice: glorieuse et grande
  rationale: La tournure adjectivale est idiomatique en français tout en conservant les deux notions de gloire et de grandeur.
theological_decisions:
- issue: Sujet de l’action de servir dans le sanctuaire
  choice: « afin qu’ils servent », avec la descendance comme référent principal
  alternative: « afin que vous serviez » ou « afin que tu serves »
  rationale: La forme guèze ይትአዘዙ est à la troisième personne du pluriel. La traduction respecte cette donnée grammaticale tout en signalant en note la légère difficulté de rattachement créée par la succession de « toi et ta descendance ».
- issue: Nature du service sanctuaire
  choice: « servent »
  alternative: « exercent le ministère »
  rationale: « Servir » maintient l’étendue sémantique du verbe et évite d’imposer une conception confessionnelle ou une fonction institutionnelle précise.
- issue: Désignation des êtres célestes
  choice: « anges de la Présence » et « saints »
  alternative: « anges de la Face » et « êtres saints »
  rationale: La première expression est consacrée et intelligible dans la littérature du judaïsme ancien; « saints » conserve l’ambiguïté du texte quant à leur identité exacte.
translation_notes:
  register: Français moderne, digne et accessible, avec tutoiement conforme au discours direct ancien. « Le Seigneur » est employé pour እግዚአብሔር. La syntaxe reste légèrement solennelle afin de respecter le caractère de bénédiction du passage.
