revisions:
- from: et ainsi en sera-t-il de tes enfants dans tous les siècles. Que le Seigneur te donne, à toi et à ta descendance, un cœur magnanime pour sa gloire. Qu’il te fasse approcher de lui, toi et ta descendance, parmi tous les êtres de chair, afin qu’ils servent dans son sanctuaire[a], comme les anges de la Présence et comme les saints. À leur ressemblance, la descendance de tes enfants sera glorieuse et grande.
  to: et ainsi en sera-t-il de tes enfants à travers tous les âges. Que le Seigneur te donne, à toi et à ta descendance, la grandeur de cœur pour sa gloire. Qu’il vous fasse approcher de lui, toi et ta descendance, d’entre tous les êtres de chair, afin qu’ils servent dans son sanctuaire[a], comme les anges de la Présence et comme les saints. À leur ressemblance, la descendance de tes enfants sera pour la gloire et la grandeur.
  rationale: La révision rétablit l’idée d’être tiré d’entre toute chair, conserve plus littéralement la « grandeur de cœur » et rend la finale par les substantifs abstraits du texte. Elle maintient le pluriel source de « ils servent » et la note qui signale la difficulté de rattachement, sans résoudre l’ambiguïté de façon doctrinale.
