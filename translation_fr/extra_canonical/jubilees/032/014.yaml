    text: 'Le verbe est à la troisième personne du pluriel : « afin qu’ils servent ». Il se rapporte vraisemblablement à la descendance, bien que la construction puisse associer Jacob et sa descendance à l’approche de Dieu.'
    reason: Préserver la personne grammaticale du texte source et rendre transparente l’ambiguïté du rattachement syntaxique.
