  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
translation:
  language: fr
  text: Conformément à la prière qu’il avait faite, selon laquelle il devait prélever la dîme avec leurs sacrifices et leurs offrandes de vin.[a] Quand le feu l’eut consumé, il fit brûler dessus de l’encens dans le feu. Puis, comme sacrifice de délivrance, il offrit deux taureaux, quatre béliers, quatre moutons, quatre boucs et quatre agneaux d’un an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « leurs sacrifices et leurs offrandes de vin » traduit les suffixes pluriels du texte guèze ; leur référent n’est pas explicité.
    reason: ambiguïté grammaticale réelle du texte source
lexical_decisions:
- source_word: የዐሥር
  choice: prélever la dîme
  rationale: Rend le verbe dérivé de « dix » dans son sens cultuel de donner ou mettre à part le dixième.
- source_word: ጥዓሕቶሙ
  choice: leurs offrandes de vin
  rationale: Expression française naturelle pour les libations cultuelles; le suffixe guèze est bien à la troisième personne du pluriel.
- source_word: ስኂነ
  choice: encens
  rationale: Le terme désigne ici une substance aromatique brûlée; « encens » est clair et adapté au contexte cultuel.
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: sacrifice de délivrance
  rationale: Conserve le sens transparent de salut, secours ou délivrance sans assimiler indûment cette offrande à une catégorie sacrificielle biblique plus précise.
- source_word: አበዋረ
  choice: taureaux
  rationale: Désigne ici des bovins mâles offerts en sacrifice.
- source_word: አብሓከ
  choice: béliers
  rationale: Rend les ovins mâles adultes dans une terminologie sacrificielle française courante.
- source_word: አባግዐ፡ ዘዘ፡ ዓመት
  choice: agneaux d’un an
  rationale: Rend littéralement l’indication d’âge attachée aux ovins.
theological_decisions:
- issue: Nature du « sacrifice de délivrance »
  choice: sacrifice de délivrance
  alternative: sacrifice de salut
  rationale: « Délivrance » garde la portée concrète de መድኃኒት et évite de fixer une interprétation sotériologique particulière.
- issue: Référent des suffixes pluriels dans les sacrifices et les offrandes de vin
  choice: leurs sacrifices et leurs offrandes de vin
  alternative: ses sacrifices et ses offrandes de vin
  rationale: Le texte guèze porte explicitement des suffixes de troisième personne du pluriel; l’ambiguïté de leur référent est conservée plutôt que corrigée en singulier.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe fragmentaire initiale est maintenue comme continuation du verset précédent. Les termes cultuels restent précis sans archaïsmes inutiles. Le marqueur [a] figure dans le texte principal.
