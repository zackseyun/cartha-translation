base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/019.yaml
  text: all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule over all the nations as they desire; and after this they will draw the whole earth to themselves and inherit it.
translation:
  language: fr
  text: tous les êtres humains. Je donnerai à ta descendance toute la terre qui est sous le ciel. Ils domineront sur toutes les nations comme ils le voudront ; après cela, ils attireront à eux toute la terre[a] et en hériteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils rassembleront toute la terre ».'
    reason: Le verbe guèze peut être compris au sens de rassembler ou de réunir, tandis que le contexte permet l’idée de faire converger la terre vers eux.
lexical_decisions:
- source_word: ውሉደ፡ ሰብእ
  choice: les êtres humains
  rationale: Littéralement « les enfants des hommes » ; dans ce fragment qui poursuit la phrase précédente, « les êtres humains » exprime naturellement l’ensemble de l’humanité en français moderne.
- source_word: ለዘርእከ
  choice: à ta descendance
  rationale: « Descendance » rend le nom collectif désignant la postérité sans imposer un nombre ou un référent plus précis.
- source_word: ይኴንኑ፡ ውስተ፡ ኵሉ፡ አሕዛብ
  choice: ils domineront sur toutes les nations
  rationale: Le verbe exprime ici l’exercice d’une autorité ou d’une domination ; « sur » rend clairement la relation aux nations.
- source_word: ያስተጋብኡ
  choice: ils attireront à eux
  rationale: Le causatif peut évoquer l’action de rassembler ou de faire converger. Dans le contexte de domination puis d’héritage, « attireront à eux » conserve l’idée de regroupement orienté vers eux sans réduire l’expression à un déplacement matériel de la terre.
- source_word: ይወርስዋ
  choice: en hériteront
  rationale: Le verbe signifie recevoir ou posséder en héritage, et le suffixe reprend « toute la terre » ; le pronom « en » donne une formulation française concise et naturelle.
theological_decisions:
- issue: Étendue et caractère de la domination promise à la descendance
  choice: Conserver les expressions absolues « toute la terre » et « toutes les nations » ainsi que « comme ils le voudront »
  alternative: Atténuer la portée en parlant d’une influence parmi les nations ou en qualifiant leur volonté
  rationale: Le texte source formule une domination universelle sans restriction explicite. La traduction ne doit ni l’atténuer ni lui ajouter une justification théologique absente du verset.
translation_notes:
  register: Français moderne, digne et accessible. Le début reste volontairement un fragment, car le verset poursuit la phrase précédente. Les nombres présents dans l’édition source sont des appels d’apparat et ne font pas partie du texte biblique.
