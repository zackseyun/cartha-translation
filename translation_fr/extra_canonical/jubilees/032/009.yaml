base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
translation:
  language: fr
  text: 'C’est un témoignage de joie, comme cette joie.[a] Autrefois, on appelait le pays de Galaad « pays des Rephaïm », parce que c’est le pays des Rephaïm. Des Rephaïm y naquirent : des géants qui mesuraient dix coudées, neuf coudées, huit coudées, et jusqu’à sept coudées.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « témoignage de joie comme cette joie ». La formulation du texte transmis est inhabituelle.'
    reason: Préserver la difficulté et l’ambiguïté syntaxiques de la proposition guèze.
  - marker: b
    text: Le texte énumère des tailles allant de dix à sept coudées. Le premier nombre est parfois mal lu comme « neuf » dans la transmission imprimée ou numérisée.
    reason: Signaler la difficulté graphique/OCR concernant ዐሥር (« dix ») et justifier l’énumération complète.
lexical_decisions:
- source_word: ፍሥሐተ
  choice: joie
  rationale: Le terme guèze désigne ici la joie; ses deux occurrences sont rendues de manière cohérente sans les confondre avec ስምዕ, « témoignage ».
- source_word: ስምዕ
  choice: témoignage
  rationale: Sens direct du substantif dans la proposition initiale.
- source_word: ገለአድ
  choice: Galaad
  rationale: Forme française biblique courante du toponyme Gilead.
- source_word: ረፋኤም / ራፋኤም
  choice: Rephaïm
  rationale: Translittération française biblique usuelle du nom de ce peuple ancien.
- source_word: ረዐይት
  choice: géants
  rationale: Dans le contexte, le terme qualifie les Rephaïm par leur stature extraordinaire.
- source_word: በአመት
  choice: coudées
  rationale: Le contexte des nombres et de la taille exige une unité de longueur; la tradition textuelle et la consultation anglaise soutiennent « coudées », malgré la forme transmise qui peut littéralement évoquer l’année.
theological_decisions:
- issue: Nature de la première proposition
  choice: « témoignage de joie »
  alternative: « ordonnance comme témoignage perpétuel »
  rationale: Le texte guèze fourni porte explicitement ፍሥሐተ (« joie ») et ስምዕ (« témoignage »); la traduction conserve cette formulation inhabituelle plutôt que d’importer une reconstruction absente du témoin cité.
- issue: Identification des Rephaïm
  choice: Conserver le nom ethnique « Rephaïm » puis les qualifier de géants
  alternative: Traduire directement le nom par « géants »
  rationale: Cette solution maintient la distinction du texte entre le peuple nommé et la description de sa stature, sans ajouter d’identification doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé d’habitude est rendu naturellement par « Autrefois, on appelait ». La répétition de « pays des Rephaïm » est conservée, tout comme l’étrangeté de l’ouverture, afin de ne pas lisser le témoin source.
