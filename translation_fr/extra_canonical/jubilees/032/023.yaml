  text: in joy. And Jacob arranged his two sons[23], one on his right hand and one on his left, and it was counted to him as righteousness. And Jacob told everything to his father in the night, how the LORD had dealt with him in great mercy and how he had prospered all his way and protected him from all evil. And Isaac blessed the God of his father Abraham, who had not withheld mercy and righteousness from the son of his servant Isaac. And in the morning Jacob told his father Isaac the prayer that he had prayed to the LORD, and the vision that he had seen, and how he had built an altar, and all that was prepared for sacrifice to offer before the LORD according to how he had prayed, and how he had come to carry him on a donkey. And Isaac said to Jacob, "My son, I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred and sixty-five years old today. I am no longer able to travel; set your mother on a beast and let her go with
    you. And I know, my son, that you came on my account, and this day is blessed, on which you have seen me alive and I also have seen you, my son. Prosper and perform the prayer that you have prayed, and do not delay your prayer, for it is sought out, and now quickly do it, and may he who has done everything grant success to the prayer for which you have prayed." And he said to Rebekah, "Go with Jacob your son." And Rebekah went with Jacob her son, and Deborah was with her, and they came to Bethel. And Jacob remembered the prayer with which his father had blessed him, and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be raised for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them." And he stayed that night in Bethel, and Levi dreamed
    that they had appointed and ordained him priest of the Most High God, him and his sons forever. And he awoke from his sleep and blessed the LORD. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons, and Levi came up in the LORD’s portion, and his father clothed him with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and eighteen rams and forty-nine sheep and seven lambs and twenty-one kids.
translation:
  language: fr
  text: 'dans la joie. Jacob plaça ses deux fils[a], l’un à sa droite et l’autre à sa gauche, et cela lui fut compté comme justice. Pendant la nuit, Jacob raconta tout à son père : comment le Seigneur avait usé envers lui d’une grande bonté, comment il avait fait réussir tout son voyage et l’avait gardé de tout mal. Isaac bénit alors le Dieu de son père Abraham, qui n’avait pas refusé sa bonté et sa justice au fils de son serviteur Isaac.


    Au matin, Jacob raconta à son père Isaac la prière qu’il avait adressée au Seigneur, la vision qu’il avait eue, comment il avait construit un autel, tout ce qu’il avait préparé pour offrir un sacrifice devant le Seigneur conformément à sa prière, et comment il était venu pour le transporter sur un âne. Isaac dit à Jacob : « Mon fils, je ne peux pas venir avec toi, car je suis vieux et ne peux pas supporter le voyage. Va en paix, mon fils, car j’ai aujourd’hui cent soixante-cinq ans. Je ne peux désormais plus voyager. Fais monter ta mère sur une bête et qu’elle parte avec toi. Je sais, mon fils, que tu es venu à cause de moi. Béni soit ce jour où tu m’as vu encore vivant et où, moi aussi, je t’ai vu, mon fils. Prospère et accomplis ce que tu as demandé dans ta prière. Ne tarde pas à l’accomplir, car cette prière est recherchée. Accomplis-la donc maintenant sans tarder, et que celui qui a tout réalisé fasse réussir ce que tu as demandé dans ta prière. »


    Puis il dit à Rébecca : « Pars avec ton fils Jacob. » Rébecca partit avec son fils Jacob, accompagnée de Déborah, et ils arrivèrent à Béthel. Jacob se souvint de la prière par laquelle son père l’avait béni, lui et ses deux fils, Lévi et Juda. Il se réjouit et bénit le Dieu de ses pères, Abraham et Isaac. Il dit : « Je sais maintenant que j’ai une espérance éternelle devant le Dieu de tous, et mes enfants aussi. Ainsi en a-t-il été décidé au sujet de ces deux fils, et cela sera inscrit pour eux comme témoignage éternel sur les tablettes célestes, conformément à la bénédiction qu’Isaac leur a donnée. »


    Il passa cette nuit-là à Béthel. Lévi rêva qu’on l’avait établi et consacré prêtre du Dieu Très-Haut, lui et ses fils, pour toujours. À son réveil, il bénit le Seigneur.


    Le quatorzième jour de ce mois, Jacob se leva de bon matin et donna la dîme de tout ce qui était venu avec lui, depuis les personnes jusqu’au bétail, depuis l’or jusqu’à tous les biens : il préleva la dîme de tout. En ces jours-là, Rachel devint enceinte de Benjamin. Jacob compta ses fils, et Lévi monta et descendit dans la part du Seigneur. Son père le revêtit des vêtements sacerdotaux et lui remplit les mains. Le quinzième jour de ce mois, Jacob apporta sur l’autel, comme sacrifices pris parmi le bétail, quatorze taureaux, dix-huit béliers, quarante-neuf moutons, sept agneaux et onze chevreaux.'
