    Puis il dit à Rébecca : « Pars avec ton fils Jacob. » Rébecca partit avec son fils Jacob, accompagnée de Déborah, et ils arrivèrent à Béthel. Jacob se souvint de la prière par laquelle son père l’avait béni, lui et ses deux fils, Lévi et Juda. Il se réjouit et bénit le Dieu de ses pères, Abraham et Isaac. Il dit : « Je sais maintenant que j’ai une espérance éternelle devant le Dieu de tous, et mes enfants aussi. Ainsi en a-t-il été décidé au sujet de ces deux fils, et cela sera inscrit pour eux comme témoignage éternel sur les tablettes célestes, conformément à la bénédiction qu’Isaac leur a donnée. »


    Il passa cette nuit-là à Béthel. Lévi rêva qu’on l’avait établi et consacré prêtre du Dieu Très-Haut, lui et ses fils, pour toujours. À son réveil, il bénit le Seigneur.


    Le quatorzième jour de ce mois, Jacob se leva de bon matin et donna la dîme de tout ce qui était venu avec lui, depuis les personnes jusqu’au bétail, depuis l’or jusqu’à tous les biens : il préleva la dîme de tout. En ces jours-là, Rachel devint enceinte de Benjamin. Jacob compta ses fils, et Lévi échut comme part au Seigneur. Son père le revêtit des vêtements sacerdotaux et lui remplit les mains. Le quinzième jour de ce mois, Jacob apporta sur l’autel, comme sacrifices pris parmi le bétail, quatorze taureaux, dix-huit béliers, quarante-neuf moutons, sept agneaux et onze chevreaux.'
