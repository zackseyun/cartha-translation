lexical_decisions:
- source_word: ወተብቈ፡ ሎቱ፡ ጽድቀ
  choice: et cela lui fut compté comme justice
  rationale: Rend directement la formule de comptabilisation de la justice sans en préciser davantage la portée théologique.
- source_word: ሣህለ፡ ዐቢየ
  choice: une grande bonté
  rationale: « Bonté » exprime ici la faveur miséricordieuse dans un français naturel et digne.
- source_word: ይጽዐኖ፡ ዲበ፡ አድግ
  choice: pour le transporter sur un âne
  rationale: Le suffixe objet masculin désigne Isaac comme la personne que Jacob voulait faire monter ou transporter, et non Jacob comme cavalier.
- source_word: ጻዕና፡ ለአምካ፡ ወትሖር፡ ምስሌከ
  choice: Fais monter ta mère sur une bête et qu’elle parte avec toi
  rationale: Conserve l’ordre explicite donné à Jacob de faire voyager Rébecca avec lui.
- source_word: ወይዕርጕ፡ ሎሙ፡ በስምዕ፡ ዘለዓለም፡ ውስተ፡ ጽላተ፡ ሰማይ
  choice: cela sera inscrit pour eux comme témoignage éternel sur les tablettes célestes
  rationale: « Inscrit » explicite naturellement l’image d’un témoignage élevé ou déposé sur des tablettes, sans modifier sa fonction mémorielle.
- source_word: ወመልአ፡ እደዊሁ
  choice: et lui remplit les mains
  rationale: Maintient l’idiome rituel de consécration sacerdotale plutôt que de le remplacer par une interprétation.
- source_word: መሓስዐ፡ ጠሊ፡ ዐሥራ፡ ወአሐደ
  choice: onze chevreaux
  rationale: Le texte guèze fourni indique littéralement « dix et un »; cette leçon est suivie plutôt que le chiffre vingt et un de la couche anglaise.
theological_decisions:
- issue: Nature de la justice comptée à Jacob
  choice: 'Formulation non interprétative : « cela lui fut compté comme justice »'
  alternative: Préciser que son geste fut considéré comme une action juste
  rationale: Le texte conserve une tension entre acte concret, jugement divin et formule théologique; la traduction ne tranche pas.
- issue: Statut sacerdotal de Lévi et de ses descendants
  choice: « établi et consacré prêtre du Dieu Très-Haut, lui et ses fils, pour toujours »
  alternative: Limiter la durée ou harmoniser avec une tradition canonique ultérieure
  rationale: La portée héréditaire et perpétuelle du rêve est affirmée par le passage et doit être conservée.
- issue: Expression rituelle « remplir les mains »
  choice: Conserver l’idiome littéral
  alternative: Traduire uniquement par « le consacra »
  rationale: L’expression possède une teneur cultuelle propre; l’explication par le contexte sacerdotal suffit sans effacer l’image.
translation_notes:
  register: Français international actuel, narratif et digne. Les répétitions caractéristiques du récit ancien sont conservées lorsqu’elles structurent le passage. Le nom divin est rendu par « le Seigneur » et les termes cultuels par un vocabulaire accessible, tout en maintenant l’idiome technique « remplir les mains ».
