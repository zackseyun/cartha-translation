base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
translation:
  language: fr
  text: 'Béni soit quiconque te bénit, et que tout peuple qui te maudit soit maudit. À Juda, il dit : « Que le Seigneur te donne force et puissance pour fouler aux pieds tous ceux qui te haïssent. Sois un chef, toi et l’un de tes fils, sur les fils de Jacob. Que ton nom et le nom de tes fils se répandent et soient proclamés sur toute la terre et dans toutes les régions.[a] Alors les nations trembleront devant toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur toute la terre et dans toutes les villes » ; le terme peut désigner des régions, des territoires ou des villes.'
    reason: Le nom guèze አህጉር possède une gamme géographique qui ne se laisse pas réduire avec certitude à un seul équivalent français.
lexical_decisions:
- source_word: ቡሩክ
  choice: Béni soit
  rationale: Rend naturellement la formule de bénédiction, dont le référent est précisé par la proposition relative qui suit.
- source_word: ኵሉ፡ ሕዝብ
  choice: tout peuple
  rationale: Conserve la formulation collective du guèze plutôt que de la réduire à un simple pronom individuel.
- source_word: ኃይለ፡ ወጽንዐ
  choice: force et puissance
  rationale: Maintient le parallélisme des deux noms exprimant vigueur et fermeté.
- source_word: ትኪዶሙ
  choice: fouler aux pieds
  rationale: Reproduit l’image concrète de domination portée par le verbe.
- source_word: መኰንነ
  choice: un chef
  rationale: Le terme désigne un gouvernant ou dignitaire; « chef » reste clair et n’impose pas un titre royal plus précis.
- source_word: ዘየሐውር፡ ወዘያንበቡ
  choice: se répandent et soient proclamés
  rationale: Rend les deux verbes coordonnés, l’un évoquant la circulation du nom et l’autre sa proclamation ou sa mention publique.
- source_word: አህጉር
  choice: régions
  rationale: Choix large adapté au contexte géographique; le terme peut aussi désigner des territoires ou des villes.
- source_word: እምቅድመ፡ ገጽከ
  choice: devant toi
  rationale: Expression française naturelle correspondant littéralement à « devant ta face ».
theological_decisions:
- issue: Portée de la bénédiction initiale
  choice: quiconque te bénit
  alternative: celui qui te bénit
  rationale: « Quiconque » exprime clairement la portée générale sans modifier le contenu de la formule.
- issue: Nature de l’autorité promise à Juda et à sa descendance
  choice: Sois un chef
  alternative: Sois un prince / gouverne
  rationale: Le texte affirme une autorité sans préciser ici une royauté; « chef » préserve cette latitude.
- issue: Transmission de l’autorité
  choice: toi et l’un de tes fils
  alternative: toi, et un de tes descendants
  rationale: La formulation conserve la singularité et le vocabulaire filial du texte, sans identifier davantage le descendant concerné.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct reste ouvert, puisqu’il se poursuit au verset suivant. La répétition « ton nom et le nom de tes fils » est conservée pour sa valeur solennelle.
