base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
translation:
  language: fr
  text: 'Voici donc ce qui est prescrit en Israël au sujet de la souillure d’une vierge israélite[a] : si un homme en Israël veut donner sa fille, ou même sa sœur, à un homme issu des nations, il sera mis à mort ; on le lapidera à coups de pierres, parce qu’il a commis une infamie en Israël ; et la femme…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet d’une vierge israélite qui a été souillée ».'
    reason: La construction guèze peut être comprise soit nominalement (« la souillure de… »), soit comme désignant la vierge qui a subi la souillure.
lexical_decisions:
- source_word: አርኵሰ፡ ድንግል፡ እስራኤላዊት
  choice: la souillure d’une vierge israélite
  rationale: Rend la construction nominale du guèze et conserve explicitement « vierge » et « israélite ». Une autre analyse possible est signalée en note.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: issu des nations
  rationale: Conserve l’image de l’origine ou de la descendance exprimée par « semence », tout en employant une formulation française naturelle ; « nations » garde la catégorie ethnique du texte.
- source_word: ሞተ፡ ለይሙት
  choice: il sera mis à mort
  rationale: Rend l’intensification sémitique de la condamnation à mort sans calque maladroit en français.
- source_word: ኀፍረተ
  choice: une infamie
  rationale: Exprime l’acte honteux et déshonorant dans un registre juridique et solennel adapté au contexte.
theological_decisions:
- issue: Portée de l’expression initiale sur la souillure
  choice: au sujet de la souillure d’une vierge israélite
  alternative: au sujet d’une vierge israélite qui a été souillée
  rationale: La traduction principale suit de près la formulation nominale du guèze, tandis que la note préserve l’analyse passive possible sans trancher silencieusement.
- issue: Fin syntaxiquement inachevée du verset fourni
  choice: et la femme aussi…
  alternative: compléter la peine à partir du verset suivant ou d’une reconstruction
  rationale: Le témoin cité s’interrompt après « et la femme aussi » ; les points de suspension signalent honnêtement que la phrase continue, sans importer ici un complément absent de l’extrait.
translation_notes:
  register: Français moderne, international et digne. La tournure juridique « ce qui est prescrit » et le passif « sera mis à mort » rendent le caractère normatif du passage. « Nations » est préféré à « païens » afin de ne pas ajouter une qualification religieuse absente du terme source. La suspension finale respecte le caractère incomplet de l’extrait transmis.
