base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/022.yaml
  text: It is ordained for them that they should do it and be recorded as friends. But if they transgress and act in all its ways with uncleanness, they shall be recorded on the heavenly tablets as adversaries, and they shall be blotted out from the book of life and recorded in the book of those who will be destroyed and with those who
translation:
  language: fr
  text: Il est ordonné à leur sujet qu’ils le fassent et qu’ils soient inscrits comme amis. Mais s’ils transgressent et commettent toute sorte d’impureté, ils seront inscrits sur les tablettes célestes comme ennemis. Ils seront effacés du livre de vie et inscrits dans le livre de ceux qui périront, et avec ceux qui…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le fragment source fourni s’interrompt ici au milieu de la phrase.
    reason: Signaler fidèlement que la proposition finale est inachevée dans le segment transmis, sans la compléter par conjecture.
lexical_decisions:
- source_word: ሤሠርዐት፡ ሎሙ
  choice: Il leur est prescrit
  rationale: Rend la tournure passive ou impersonnelle du guèze sans introduire un sujet divin qui n’est pas exprimé.
- source_word: ወይጸሐፉ፡ አዕርክተ
  choice: et d’être inscrits comme amis
  rationale: Préserve le passif et le contraste lexical décisif entre « amis » ici et « ennemis » dans la proposition suivante.
- source_word: ሰርኵስ
  choice: avec impureté
  rationale: Expression française naturelle qui conserve la notion morale et rituelle d’impureté sans la préciser davantage.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Équivalent traditionnel et concret de l’image des registres célestes.
- source_word: ጸላእተ
  choice: ennemis
  rationale: Rend directement l’opposition avec « amis »; « adversaires » serait également possible, mais moins symétrique en français.
- source_word: መጽሐፈ፡ ሕይወት
  choice: le livre de vie
  rationale: Rend littéralement l’expression et conserve sa portée théologique sans interprétation ajoutée.
- source_word: እለ፡ ይትሐጐሉ
  choice: ceux qui périront
  rationale: Exprime la destruction ou la perdition annoncée tout en gardant le futur du texte.
theological_decisions:
- issue: Statut des personnes dans les registres célestes
  choice: « inscrits comme amis » puis « inscrits […] comme ennemis »
  alternative: « enregistrés parmi les amis » puis « enregistrés comme adversaires »
  rationale: La formulation retenue maintient le parallélisme et la tension théologique explicites dans le guèze, sans expliquer la nature de cette amitié ou inimitié.
- issue: Sujet de la prescription initiale
  choice: 'Tournure impersonnelle : « Il leur est prescrit »'
  alternative: « Il leur ordonna »
  rationale: Le texte fourni ne nomme pas explicitement l’agent; la tournure impersonnelle évite de l’identifier arbitrairement.
translation_notes:
  register: Français moderne, international et digne. La répétition d’« inscrits » est conservée afin de faire entendre le motif judiciaire des registres célestes. « Se conduisent » rend naturellement l’idée d’agir ou de marcher dans des voies, tandis que l’ellipse finale respecte l’état incomplet du texte fourni.
