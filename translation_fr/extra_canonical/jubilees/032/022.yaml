revisions:
- from: Il leur est prescrit de le faire et d’être inscrits comme amis. Mais s’ils transgressent et se conduisent avec impureté dans toutes ses voies, ils seront inscrits sur les tablettes célestes comme ennemis. Ils seront effacés du livre de vie et inscrits dans le livre de ceux qui périront, avec ceux qui…[a]
  to: Il est ordonné à leur sujet qu’ils le fassent et qu’ils soient inscrits comme amis. Mais s’ils transgressent et commettent toute sorte d’impureté, ils seront inscrits sur les tablettes célestes comme ennemis. Ils seront effacés du livre de vie et inscrits dans le livre de ceux qui périront, et avec ceux qui…[a]
