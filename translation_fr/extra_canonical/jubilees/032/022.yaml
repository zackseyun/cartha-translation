  source_fidelity: La tournure initiale et l’opposition « amis / ennemis » rendent correctement le guèze et suivent l’audit anglais. Cependant, « se conduisent avec impureté dans toutes ses voies » donne à « ses voies » un antécédent peu clair et ne rend pas nettement l’idée de « commettre/pratiquer l’impureté de toute manière » (cf. le sens de la construction correspondante dans l’édition de Charles).
  naturalness: Le français est généralement moderne et digne. La reformulation proposée est plus idiomatique, précise et fluide, sans introduire d’interprétation.
