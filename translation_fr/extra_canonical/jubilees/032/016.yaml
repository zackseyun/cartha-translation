base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
translation:
  language: fr
  text: Le Seigneur mettra cela dans leur bouche, afin qu’ils bénissent toute la descendance du bien-aimé. Ta mère t’a appelé Lévi et, en vérité, elle t’a appelé ainsi pour que tu sois uni à Dieu et que tu sois le compagnon de tous les fils de Jacob. Que sa table soit la tienne ; toi et tes fils en mangerez, et pour tous…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte conservé se termine ici par une proposition inachevée : littéralement « et pour tous » ou « et à tous ».'
    reason: Signaler fidèlement l’inachèvement du texte source sans le compléter ni attribuer avec certitude « tous » à l’action de manger.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Rend le titre divin guèze de manière traditionnelle, claire et digne en français.
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: toute la descendance du bien-aimé
  rationale: « Descendance » rend naturellement le sens collectif de « semence » ; le génitif est conservé sans identifier davantage le bien-aimé.
- source_word: እምከ
  choice: ta mère
  rationale: Le terme signifie explicitement « ta mère » et renvoie au récit où Léa donne son nom à Lévi.
- source_word: ሌዊሃ
  choice: Lévi
  rationale: Forme française habituelle du nom biblique.
- source_word: አጸቁ
  choice: sois uni
  rationale: Préserve le jeu étymologique sur le nom de Lévi, associé au fait d’être attaché ou uni.
- source_word: ሱታፌ
  choice: compagnon
  rationale: Rend l’idée de participation, d’association ou de compagnonnage sans la réduire à une fonction précise.
- source_word: ማእዳ
  choice: table
  rationale: Correspondance directe et contextuellement naturelle.
theological_decisions:
- issue: Destinataire de l’union exprimée par le jeu sur le nom de Lévi
  choice: uni à Dieu
  alternative: attaché au Seigneur
  rationale: Suit la construction et le sens étymologique indiqués par le texte, sans développer une doctrine sacerdotale implicite.
- issue: Référent de « sa table »
  choice: Conserver le pronom « sa »
  alternative: Expliciter « la table de Dieu »
  rationale: Le texte présente un pronom dont le référent peut sembler moins immédiat ; l’expliciter supprimerait une ambiguïté réelle.
- issue: Fin syntaxiquement inachevée du verset
  choice: Conserver l’inachèvement avec des points de suspension et une note
  alternative: Compléter conjecturalement la proposition
  rationale: Le témoin fourni se termine par « et pour tous », sans complément permettant de reconstruire sûrement la suite.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier est conservé parce que l’adresse vise Lévi. La ponctuation clarifie les propositions tout en préservant l’ambiguïté de « sa table » et l’inachèvement final.
