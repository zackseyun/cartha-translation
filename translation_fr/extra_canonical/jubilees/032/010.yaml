base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
translation:
  language: fr
  text: 'Celui qui profane sera mis à mort : il sera lapidé. Cette loi n’est soumise à aucune limite de temps ; il n’y a ni pardon ni expiation. Mais l’homme qui a profané sa fille sera retranché du milieu de tout Israël, parce qu’il a donné de sa descendance à Moloch et a péché en le profanant.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze porte un pronom masculin : « en le profanant ». Son référent est incertain. Certains comprennent : « en la profanant », en référence à sa fille.'
    reason: Préserver l’accord grammatical du texte source et signaler l’ambiguïté réelle de l’antécédent.
lexical_decisions:
- source_word: ዘያረኵስ
  choice: Celui qui profane
  rationale: Le verbe exprime l’action de rendre impur ou de profaner. « Profaner » convient au contexte cultuel lié à Moloch tout en conservant l’objet implicite.
- source_word: ወበእብን፡ ይትወገር
  choice: il sera lapidé
  rationale: Rend naturellement en français l’expression littérale « il sera frappé/lancé avec une pierre », sans reproduire le pléonasme sémitique.
- source_word: አልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: Cette loi n’est limitée par aucun nombre de jours
  rationale: Conserve l’image d’une « mesure de jours » tout en exprimant clairement le caractère non temporaire de la loi.
- source_word: ይሤረው
  choice: ne soit retranché
  rationale: Le verbe est compris comme un passif à la troisième personne du singulier, ayant « l’homme » pour sujet. « Retrancher » garde la portée judiciaire et communautaire de l’expression.
- source_word: ወሀቦ፡ ለሞሎክ
  choice: il a donné … à Moloch
  rationale: Traduction directe qui ne précise pas au-delà du texte la nature exacte du rite ou du sacrifice.
- source_word: በአርኵሶ
  choice: en le profanant
  rationale: Le suffixe objet est masculin singulier dans le texte guèze. Le pronom français maintient cette donnée grammaticale malgré l’incertitude sur son antécédent.
theological_decisions:
- issue: Nature de l’acte associé à Moloch
  choice: « il a donné de sa descendance à Moloch »
  alternative: « il a sacrifié un de ses enfants à Moloch »
  rationale: Le texte dit « donner » et « de sa descendance » ; il ne faut pas expliciter en « sacrifice » ce que ce verset ne formule pas directement.
- issue: Portée de l’absence de remise ou d’expiation
  choice: Maintien de la formulation absolue du verset
  alternative: L’atténuer par une explication doctrinale ou contextuelle
  rationale: La traduction préserve la tension théologique du texte sans l’harmoniser avec d’autres passages.
- issue: Référent du suffixe final masculin
  choice: « en le profanant » avec note
  alternative: « en la profanant », en référence à la fille
  rationale: Le suffixe guèze est masculin ; son référent demeure incertain et ne doit pas être silencieusement remplacé par un féminin.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe solennelle convient à une prescription judiciaire, tandis que « sera lapidé » et « ne soit retranché » évitent un littéralisme pesant. Le nom « Moloch » suit la forme traditionnelle française correspondant au guèze.
