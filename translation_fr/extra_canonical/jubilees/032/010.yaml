  naturalness: Le français est globalement clair et de registre approprié. « Cette loi n’est limitée par aucun nombre de jours » est toutefois assez lourd ; « n’est soumise à aucune limite de temps » est plus idiomatique. « a commis le mal » est moins naturel que « a péché » pour le verbe source dans ce contexte.
  terminology: « Profaner », « lapidé », « retranché », « expiation », « descendance » et « Moloch » conviennent. La note conserve à juste titre l’ambiguïté du pronom objet masculin final, sans lui attribuer un référent certain.
