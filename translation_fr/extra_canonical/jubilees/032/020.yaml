base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
translation:
  language: fr
  text: Et par toi se trouvera le salut d’Israël. Le jour où tu siégeras sur le trône de la gloire de ta justice[a], il y aura une grande paix pour toute la descendance des fils du Bien-Aimé[b]. Celui qui te bénira sera béni, et tous ceux qui te haïssent et te font souffrir, ainsi que ceux qui te maudissent, seront détruits et retranchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « En ce jour-là, tu demeureras sur le trône de la gloire de ta justice. Il y aura une grande paix… »'
    reason: Préserve l’alternative de construction temporelle et le sens possible de « demeurer », sans déplacer « ta justice » dans la proposition suivante.
  - marker: b
    text: 'Littéralement : « la descendance des fils du Bien-Aimé ». Le « Bien-Aimé » n’est pas identifié explicitement ici.'
    reason: Préserve l’ambiguïté du titre substantivé et évite la lecture grammaticalement différente « ses fils bien-aimés ».
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: le salut d’Israël
  rationale: Rend directement le groupe nominal guèze et conserve sa portée collective et théologique sans la préciser davantage.
- source_word: ትነብር፡ ውስተ፡ መንበረ
  choice: tu siégeras sur le trône
  rationale: Dans ce contexte royal, « siéger » exprime naturellement le fait de prendre place ou de demeurer sur un trône.
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: la descendance des fils du Bien-Aimé
  rationale: Préserve la construction où « le Bien-Aimé » fonctionne comme un substantif ou un titre, plutôt que de transformer le syntagme en « ses fils bien-aimés ».
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: seront déracinés et disparaîtront
  rationale: Reproduit les deux images successives de suppression et de perte, avec une formulation française claire et énergique.
theological_decisions:
- issue: Identité du « Bien-Aimé »
  choice: Employer « le Bien-Aimé » sans identifier explicitement la personne visée
  alternative: ses fils bien-aimés
  rationale: La construction source présente vraisemblablement « le Bien-Aimé » comme un substantif; expliciter son identité ou en faire un simple adjectif résoudrait indûment l’ambiguïté.
- issue: Relation entre le trône, la gloire et la justice
  choice: « le trône de la gloire de ta justice »
  alternative: « le trône glorieux de ta justice » ou « le trône de gloire; ta justice… »
  rationale: La chaîne nominale du guèze permet plusieurs rattachements. Le texte principal conserve la structure reçue sans réduire « gloire » à un simple adjectif; la note signale l’autre analyse syntaxique importante.
translation_notes:
  register: Français international moderne, digne et lisible. « Siéger » maintient le cadre royal; « Bien-Aimé » est capitalisé comme titre possible. La coordination finale est légèrement explicitée par « mais » pour rendre le contraste naturel en français sans modifier le contenu.
