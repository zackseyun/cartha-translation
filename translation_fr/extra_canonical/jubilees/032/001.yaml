  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
translation:
  language: fr
  text: 'Juda vit et se réjouit[a]. Il bénit le Dieu de ses pères, Abraham et Isaac. Il dit : « Maintenant, je sais que j’ai une espérance éternelle devant le Dieu de tous, et mes enfants aussi. Ainsi en a-t-il été décidé au sujet de tous les deux, et cela sera inscrit pour eux comme témoignage éternel sur les tablettes célestes, conformément à la bénédiction qu’Isaac leur a donnée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Juda se réjouit. » Le texte guèze fourni paraît altéré à cet endroit ; la mention qu’il « vit » repose sur une restitution textuelle ancienne et largement attestée.'
    reason: Signaler honnêtement que « vit » dépend d’une correction du texte transmis, tout en conservant dans le corps la lecture soutenue par les éditions et traductions critiques.
lexical_decisions:
- source_word: ተፈሥሐ
  choice: se réjouit
  rationale: Le verbe exprime directement la joie; cette formulation est naturelle et digne en français moderne.
- source_word: ተስፋ፡ ዘለዓለም
  choice: une espérance éternelle
  rationale: Rend littéralement l’idée d’une espérance durable à jamais sans préciser davantage son contenu théologique.
- source_word: ሥሩዕ
  choice: il en a été décidé
  rationale: Le terme évoque ce qui est fixé, établi ou ordonné; la tournure impersonnelle conserve l’agent non exprimé.
- source_word: በስምዕ፡ ዘለዓለም
  choice: comme témoignage éternel
  rationale: Reproduit la valeur juridique et mémorielle de « témoignage » ainsi que sa permanence.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Expression technique récurrente dans les Jubilés, rendue de façon formelle et intelligible.
theological_decisions:
- issue: Portée de l’espérance devant Dieu
  choice: « j’ai une espérance éternelle devant le Dieu de tous, et mes enfants aussi »
  alternative: « il y a pour moi et mes enfants une espérance éternelle auprès du Dieu de tous »
  rationale: La formulation retenue suit la syntaxe personnelle du texte et ne définit pas la nature de cette espérance.
- issue: Agent de ce qui est établi
  choice: tournure impersonnelle « il en a été décidé »
  alternative: « Dieu l’a ordonné »
  rationale: Le texte ne nomme pas explicitement l’agent; il ne convient donc pas de l’ajouter.
- issue: Référent de « tous les deux »
  choice: maintien de « tous les deux » sans explicitation
  alternative: nommer les deux personnes d’après le contexte élargi
  rationale: Le verset isolé ne les identifie pas explicitement; conserver le pronom préserve la dépendance contextuelle et évite une résolution interprétative.
translation_notes:
  register: Français international contemporain, sobre et solennel. La syntaxe reste proche du guèze tout en évitant les tournures archaïques. Le discours direct est ponctué selon l’usage français moderne.
