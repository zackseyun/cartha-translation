base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: fr
  text: Ne donnons pas notre fille à un homme incirconcis, car il est pour nous un déshonneur. Il est aussi un déshonneur pour Israël, pour ceux qui donnent leurs filles et pour ceux qui prennent femme parmi les filles des nations, car il est impur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘቦ፡ ቍልፈተ፡
  choice: incirconcis
  rationale: L’expression guèze signifie littéralement « qui a un prépuce »; « incirconcis » en transmet naturellement et précisément le sens en français.
- source_word: ጽእለት፡
  choice: déshonneur
  rationale: Le terme exprime l’opprobre ou la honte; « déshonneur » convient au registre familial et collectif du verset.
- source_word: እምአዋልደ፡ አሕዛብ፡
  choice: parmi les filles des nations
  rationale: Cette formulation conserve l’expression collective du texte et le mouvement indiquant que les femmes sont prises au sein des nations.
- source_word: ርኩስ፡
  choice: impur
  rationale: Le terme désigne ce qui est impur ou souillé; la traduction garde sa portée sans préciser arbitrairement si l’impureté est rituelle, morale ou les deux.
theological_decisions:
- issue: Référent de l’impureté dans la proposition finale
  choice: « cela est impur »
  alternative: « il est impur » ou « elles sont impures »
  rationale: Le texte permet de rattacher l’impureté à la pratique évoquée dans son ensemble. Le neutre « cela » préserve cette portée sans déclarer explicitement impures les personnes concernées.
- issue: Explicitation de ce que donnent « ceux qui donnent »
  choice: « ceux qui donnent leurs filles »
  alternative: « ceux qui donnent »
  rationale: Le contexte matrimonial rend l’objet sous-entendu clair. Son explicitation produit un français naturel tout en maintenant la réciprocité entre donner une fille et prendre femme parmi les nations.
translation_notes:
  register: Français moderne, international et digne. La formulation évite le littéralisme peu naturel « un homme qui a un prépuce », tout en gardant le vocabulaire identitaire du passage. Le second membre est légèrement explicité pour rendre en français l’ellipse du guèze.
