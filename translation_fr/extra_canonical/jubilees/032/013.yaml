  verdict: revise
  source_fidelity: 'La traduction rend correctement l’interdit matrimonial, « incirconcis », l’opprobre et la référence aux filles des nations. Toutefois, le dernier prédicat guèze est au masculin singulier (ውእቱ … ርኩስ, « il est impur ») et reprend le même référent masculin que dans le premier membre : l’homme incirconcis. « Cela est impur » transforme ce référent personnel masculin en une pratique abstraite et ne conserve donc pas au plus près la syntaxe et la référence du texte source.'
  naturalness: Le français est globalement naturel et de registre approprié. La formulation révisée remplace les conditionnels « ce serait » par le présent, conformément aux assertions du texte après l’exhortation, et rend explicite sans lourdeur l’objet matrimonial sous-entendu.
