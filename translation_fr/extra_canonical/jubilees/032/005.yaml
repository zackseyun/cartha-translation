  yaml_path: translation/extra_canonical/jubilees/032/005.yaml
  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
translation:
  language: fr
  text: 'du pays de Galaad. Jacob cacha ses intentions à Laban et ne lui dit rien. La septième année, pendant la quatrième semaine, Jacob se dirigea vers Galaad le vingt et unième jour du premier mois. Laban se lança à sa poursuite et le rattrapa à la montagne de Galaad, le treizième jour du troisième mois. Mais le SEIGNEUR ne lui permit pas de faire du mal à Jacob, car il lui était apparu en rêve pendant la nuit, et Laban en informa Jacob. Le quinzième de ces jours-là, Jacob donna un banquet pour Laban et pour tous ceux qui étaient venus avec lui. Ce jour-là, Jacob prêta serment à Laban, et Laban fit de même envers Jacob : aucun des deux ne passerait vers l’autre avec de mauvaises intentions, sur la montagne,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
  choice: Jacob cacha ses intentions à Laban
  rationale: L’expression dit littéralement que Jacob « cacha son cœur » à Laban. En français moderne, « cacher ses intentions » restitue naturellement l’idée sans donner à entendre qu’il dissimulait ses émotions.
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: Jacob se dirigea vers Galaad
  rationale: Le suffixe directionnel de ገለአድሃ indique un mouvement vers Galaad; « se dirigea vers » conserve ce sens sans ajouter l’idée d’un départ depuis Galaad.
- source_word: በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ፡ ወአሚሩ
  choice: le vingt et unième jour du premier mois
  rationale: La séquence désigne le premier mois et le vingt et unième jour, et non le premier jour d’un mois ni une dixième année.
- source_word: በወርኅ፡ ሣልስ፡ አመ፡ ዐሡሩ፡ ወሠሉሱ
  choice: le treizième jour du troisième mois
  rationale: 'La construction parallèle indique le mois puis le quantième du mois : troisième mois, treizième jour.'
- source_word: ገብረ፡ ያዕቆብ፡ ግዝአ
  choice: Jacob donna un banquet
  rationale: « Donner un banquet » est une formulation française actuelle et digne pour l’action d’organiser un repas festif.
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ፡ በእኩይ
  choice: aucun des deux ne franchirait la limite vers l’autre avec de mauvaises intentions
  rationale: Cette formulation exprime le passage de l’un vers l’autre dans un but mauvais, tout en rendant explicite en français le caractère réciproque du serment.
theological_decisions:
- issue: Identité de celui qui apparaît dans le rêve et de celui qui reçoit l’apparition
  choice: « le SEIGNEUR… car il lui était apparu »
  alternative: Nommer explicitement Laban comme bénéficiaire du rêve
  rationale: Le contexte fait naturellement du SEIGNEUR le sujet de l’apparition et de Laban son bénéficiaire, mais le texte emploie des pronoms. La traduction conserve cette forme sans développer ni harmoniser avec le récit de la Genèse.
- issue: Sujet de ወነገሮ et destinataire du récit
  choice: « Laban le raconta à Jacob »
  alternative: « le SEIGNEUR parla à Laban au sujet de Jacob »
  rationale: La syntaxe présente Laban comme sujet et Jacob comme destinataire. Cette lecture suit directement le guèze plutôt qu’une harmonisation avec Genèse 31. Le pronom « le » renvoie naturellement au rêve ou à l’apparition.
- issue: Nom divin እግዚአብሔር
  choice: SEIGNEUR
  alternative: Dieu
  rationale: « SEIGNEUR » est la convention française digne et reconnaissable pour ce titre divin, sans introduire une précision confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les dates ont été formulées sans ambiguïté comme des jours de mois. La phrase initiale et la finale restent fragmentaires parce que le verset fourni commence et se termine au milieu d’une phrase; aucune matière absente de la source n’a été ajoutée pour les compléter.
