  yaml_path: translation/extra_canonical/jubilees/032/004.yaml
  text: He put on priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,
translation:
  language: fr
  text: 'Il revêtit les vêtements sacerdotaux et reçut l’investiture.[a] Le quinzième jour de ce mois, il amena à l’autel du bétail : quatorze taureaux, vingt-huit béliers, quarante-neuf moutons, sept agneaux et vingt et un chevreaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il remplit ses mains », expression rituelle désignant l’installation dans la fonction sacerdotale.'
    reason: Clarifier un idiome sacerdotal source que le français littéral rendrait opaque.
lexical_decisions:
- source_word: አልባሰ፡ ክህነት
  choice: Il revêtit les vêtements sacerdotaux
  rationale: Le verbe signifie « vêtir/revêtir » et ክህነት renvoie ici à la prêtrise; la formulation française explicite naturellement les vêtements, comme l’exige le contexte rituel.
- source_word: መልአ፡ እደዊሁ
  choice: reçut l’investiture
  rationale: Littéralement « il remplit ses mains », expression technique d’installation ou de consécration sacerdotale. La traduction idiomatique évite en français un calque obscur tout en conservant le sens rituel.
- source_word: ውስተ፡ ምሥዋዕ
  choice: à l’autel
  rationale: Rend directement la destination du mouvement sans ajouter « en sacrifices », absent du texte source.
- source_word: እምአልህምት
  choice: parmi le gros et le petit bétail
  rationale: Le terme collectif introduit les animaux domestiques ensuite énumérés; cette formulation française couvre naturellement bovins, ovins et caprins.
- source_word: አስዋረ
  choice: taureaux
  rationale: Désigne ici des bovins mâles destinés à l’offrande; « taureaux » est précis et courant.
- source_word: አብሓኩ
  choice: béliers
  rationale: Rend les ovins mâles adultes distincts des moutons et des agneaux de la suite.
- source_word: መሓስዐ፡ ጠሊ
  choice: chevreaux
  rationale: L’expression désigne de jeunes caprins; « chevreaux » est le terme français naturel.
theological_decisions:
- issue: Sens rituel de « remplir les mains »
  choice: reçut l’investiture
  alternative: remplit ses mains
  rationale: L’expression est une formule sacerdotale technique. Le choix retenu en communique le sens sans imposer une théologie confessionnelle particulière; une note conserve le littéralisme de l’original.
- issue: Statut sacrificiel des animaux
  choice: ne pas ajouter « comme sacrifices »
  alternative: il amena à l’autel, pour les offrir en sacrifice
  rationale: Le contexte rend l’offrande probable, mais le texte dit seulement qu’il les amena à l’autel. La traduction préserve cette économie et n’explicite pas davantage que la source.
translation_notes:
  register: Français moderne, international et digne. Syntaxe fluide, vocabulaire rituel accessible. L’énumération et les nombres sont conservés exactement; aucun complément sacrificiel absent de la source n’est ajouté.
