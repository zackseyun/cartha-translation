translation:
  language: fr
  text: Cela a été établi, et rien ne doit en être gardé de cette année pour l’année qui vient. En effet, le grain se mange au cours de son année, jusqu’aux jours de la récolte du grain de l’année, et le vin jusqu’au temps où…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte source fourni s’interrompt ici au milieu de la phrase.
    reason: Signaler honnêtement que la fin suspendue vient de la délimitation du texte source et non d’un choix stylistique.
lexical_decisions:
- source_word: ተኀርየ
  choice: Cela a été prescrit
  rationale: Le verbe exprime ici ce qui a été choisi, fixé ou ordonné. « Prescrit » rend naturellement en français la force normative du contexte sans surinterpréter l’agent.
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  choice: et rien ne doit en être gardé
  rationale: La tournure nie la possibilité ou la permission d’en laisser en réserve; elle ne parle ni d’un manque ni d’un nombre d’années restant à quelqu’un.
- source_word: እምዝ፡ ዓመት፡ ለዓመት፡ ለዘይመጽእ
  choice: de cette année pour l’année suivante
  rationale: Rend directement le mouvement temporel de l’année présente vers celle qui vient, dans un français courant.
- source_word: ዘርእ
  choice: le grain
  rationale: Le terme peut désigner la semence ou le produit en grains. Puisqu’il est mangé et récolté, « grain » convient mieux ici que « semence ».
- source_word: ሐፊረ
  choice: récolte
  rationale: Le mot désigne l’action de recueillir ou rassembler la production; « récolte » est idiomatique dans ce contexte agricole.
- source_word: አመ
  choice: au temps où
  rationale: Cette conjonction temporelle signifie « quand » ou « au temps où », et non « l’année de ».
theological_decisions:
- issue: Force normative de la première proposition
  choice: « Cela a été prescrit »
  alternative: « Cela a été choisi »
  rationale: Le contexte expose une règle concernant la consommation et la conservation des produits. « Prescrit » conserve la notion de décision arrêtée sans préciser indûment qui l’a promulguée.
translation_notes:
  register: Français international moderne, clair et digne. Les nombres éthiopiens ፳፮, ፳፯ et ፳፰ ont été reconnus comme des appels de notes de l’édition Charles de 1895, et non comme des éléments du texte biblique; ils ne sont donc pas traduits.
