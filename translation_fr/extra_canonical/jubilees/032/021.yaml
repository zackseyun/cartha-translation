  text: And he went up into heaven[21]. And he saw in a vision of the night, and behold, an angel was descending from heaven, and in his hands were tablets, and he gave them to Jacob, and he read them and learned everything written in them that would happen to him and to his children through all the ages. And he showed him everything written on the tablets and said to him, "Do not build this place, and do not make it an eternal sanctuary, and do not dwell here, for this is not the place. Go to the house of Abraham your father, and dwell with Isaac your father until the day of your father's death. For in Egypt you will die in peace, and in this land you will be buried in honor in the tomb of your fathers, with Abraham and Isaac. Do not fear, for as you have seen and read, so shall everything be. And you also, write down everything as you have seen and read." And Jacob said, "Lord, how shall I remember everything that I have read and seen?" And he said to him, "I will make you remember everything."
    And he went up from him, and he awoke from his sleep and remembered everything that he had read and seen, and he wrote down all the matters that he had read and seen[21]. And there he celebrated one additional day, and he observed it according to all that they sacrifice in former days, and he called its name Addition, because that day had been added, and they had formerly called them a feast. And thus he showed that it should be so, and it is written on the heavenly tablets concerning this, that it was revealed to him that he should observe it and add it to the seven days of the feast. And its name was called Addition, because it is added to the feast days according to the number of the days of the year. And on the night of the thirteenth of this month Deborah, Rebekah's nurse, died, and they buried her below the city, under the oak by the river, and they called the name of that place Deborah's River, and the oak, the Oak of the Mourning of Deborah. And Rebekah went and entered her house
    to Isaac her father, and Jacob sent by her hand rams and sheep, that she might bring them to his father's house. And he said to her, "Let us go to every place, and do not travel with you." And Jacob blessed the God of Isaac his father and the God of Abraham, the father of his father, and he arose and loaded his wives and his children and took all his possessions and crossed the river and arrived.
translation:
  language: fr
  text: 'Il monta au ciel. Dans une vision nocturne, Jacob vit un ange qui descendait du ciel, tenant des tablettes entre ses mains. L’ange les lui donna ; Jacob les lut et apprit tout ce qui y était écrit sur ce qui lui arriverait, à lui et à ses descendants, au cours de tous les âges. L’ange lui montra tout ce qui était écrit sur les tablettes et lui dit : « Ne bâtis rien en ce lieu, n’en fais pas un sanctuaire éternel et ne demeure pas ici, car ce n’est pas le lieu. Va dans la maison d’Abraham, ton père, et demeure auprès d’Isaac, ton père, jusqu’au jour de sa mort. En effet, tu mourras en paix en Égypte, puis tu seras enseveli avec honneur dans ce pays, dans le tombeau de tes pères, avec Abraham et Isaac. N’aie pas peur : tout arrivera comme tu l’as vu et lu. Toi aussi, mets par écrit tout ce que tu as vu et lu. » Jacob dit : « Seigneur, comment me souviendrai-je de tout ce que j’ai lu et vu ? » Il lui répondit : « Moi, je te ferai souvenir de tout. »


    Puis l’ange remonta loin de lui. Jacob se réveilla de son sommeil et se souvint de tout ce qu’il avait lu et vu. Il mit par écrit tout ce qu’il avait lu et vu. Là, il célébra un jour supplémentaire et y offrit des sacrifices comme durant tous les jours précédents. Il donna à ce jour le nom de « Jour ajouté », parce que ce jour avait été ajouté ; quant aux jours précédents, il les appela « la fête ». C’est ainsi qu’il montra que cela devait se faire. Il est écrit sur les tablettes célestes, à ce sujet, qu’il lui fut révélé qu’il devait célébrer ce jour et l’ajouter aux sept jours de la fête. Ce jour fut appelé « Jour ajouté », parce qu’il s’ajoute aux jours de la fête, conformément au compte des jours de l’année.[a]


    Dans la nuit du treizième jour de ce mois, Débora, la nourrice de Rébecca, mourut. On l’ensevelit au-dessous de la ville, sous le chêne qui se trouvait près du cours d’eau. On appela ce lieu « le cours d’eau de Débora », et le chêne, « le chêne du deuil de Débora ».[b]


    Rébecca partit et retourna chez elle, auprès d’Isaac, son père.[c] Jacob envoya par son intermédiaire des béliers et des brebis, afin qu’elle les conduise à la maison de son père. Il lui dit : « Allons partout ; où que tu ailles, j’irai avec toi. »[d] Jacob bénit le Dieu d’Isaac, son père, et le Dieu d’Abraham, père de son père. Puis il se mit en route : il fit monter ses femmes et ses enfants sur leurs bêtes, prit tous ses biens, traversa le cours d’eau et arriva à destination.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression rend un terme signifiant « ajout » ou « supplément ». Le passage l’explique comme le nom du jour ajouté aux sept jours de la fête.
    reason: cultural_note
  - marker: b
    text: Le mot rendu par « deuil » repose sur la lecture traditionnelle d’une forme vraisemblablement altérée dans le manuscrit ; elle correspond au nom « Chêne des Pleurs » connu en Genèse 35.8.
    reason: textual_variant
  - marker: c
    text: Le texte transmis appelle ici Isaac « son père », bien que Rébecca soit son épouse. La formulation, probablement perturbée au cours de la transmission, a été conservée plutôt que corrigée sans preuve textuelle.
    reason: textual_variant
  - marker: d
    text: Les propositions concernant le déplacement de Rébecca et les paroles qui suivent sont syntaxiquement difficiles dans le texte transmis. Cette traduction suit au plus près les pronoms et la suite des actions, sans prétendre lever toutes les incertitudes.
    reason: textual_variant
lexical_decisions:
- source_word: ተውሳክ
  choice: « Jour ajouté »
  rationale: Le nom vient de la racine exprimant l’ajout ou le supplément. Cette formulation rend à la fois le nom propre donné au jour et l’explication étymologique du passage.
- source_word: ይሠውዑ
  choice: « offrit des sacrifices »
  rationale: Le verbe désigne explicitement l’action de sacrifier ; une formulation générale comme « faire » affaiblirait le sens.
- source_word: 'ኀሐ (lecture corrigée : ኀዘነ)'
  choice: « deuil »
  rationale: La forme transmise paraît corrompue, mais la lecture traditionnelle et le contexte toponymique soutiennent le sens de deuil ou de lamentation.
- source_word: ሰሌዳት / ጽላተ፡ ሰማይ
  choice: « tablettes / tablettes célestes »
  rationale: Conserve l’image matérielle de documents célestes inscrits, structurante dans le livre des Jubilés.
- source_word: በኵሉ፡ ዓለማት
  choice: « au cours de tous les âges »
  rationale: Le pluriel renvoie ici aux temps ou âges successifs, plutôt qu’au monde spatial.
theological_decisions:
- issue: Identité de celui qui monte au ciel au début du passage
  choice: « Il monta au ciel »
  alternative: « L’ange monta au ciel »
  rationale: Le sujet est implicite dans l’extrait et dépend du contexte précédent. La traduction conserve cette anaphore sans ajouter une identification absente de la phrase source.
- issue: Lien d’Abraham avec Jacob
  choice: « Abraham, ton père »
  alternative: « Abraham, le père de ton père »
  rationale: Le texte guèze porte directement « Abraham, ton père ». Le langage ancestral biblique permet d’appeler un ancêtre « père » ; il ne faut pas harmoniser silencieusement.
- issue: Prédiction de la mort et de l’ensevelissement de Jacob
  choice: Mort en Égypte, ensevelissement dans ce pays avec Abraham et Isaac
  alternative: Reformulation harmonisée avec le récit de la Genèse
  rationale: La traduction maintient la distinction géographique et la tension narrative exprimées par le texte.
translation_notes:
  register: Français international actuel, narratif et digne. Les répétitions caractéristiques du récit ont été partiellement conservées, notamment « lu et vu » et les explications du nom du jour. Les passages textuellement perturbés n’ont pas été harmonisés avec la Genèse ni avec une reconstruction confessionnelle.
