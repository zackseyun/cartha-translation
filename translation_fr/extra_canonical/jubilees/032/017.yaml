  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
translation:
  language: fr
  text: 'tout homme ou toute femme en Israël qui profane son sanctuaire. C’est pourquoi je t’ai donné cet ordre : « Fais entendre ce témoignage à Israël : vois ce qui est arrivé à Sichem et à ses fils, comment ils ont été livrés entre les mains des deux fils de Jacob, qui les ont tués dans la souffrance[a]. Cela leur a été compté comme justice et inscrit en leur faveur comme justice. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la douleur ». Le terme source peut décrire la souffrance au moment de leur mort sans préciser davantage s’il s’agit de la manière ou de la circonstance.'
    reason: Préserve la nuance lexicale de በፃዕር et évite de présenter les « tourments » comme un fait explicitement énoncé.
lexical_decisions:
- source_word: ያረኵስ፡ መቅደሶ
  choice: qui profane son sanctuaire
  rationale: Le verbe exprime la souillure ou la profanation; « profaner » convient au contexte sacré. Le possessif masculin singulier du texte est conservé sans expliciter davantage son référent.
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: Fais entendre ce témoignage
  rationale: Le causatif « fais entendre » rend le verbe, tandis que « témoignage » préserve la portée testimoniale du nom apparenté et l’écho entre les deux termes.
- source_word: ሰቂሞን
  choice: Sichem
  rationale: Forme française traditionnelle et intelligible du nom propre biblique Shechem.
- source_word: ተውህበት፡ ውስተ፡ እዴ፡ ክልኤሆሙ፡ ደቂቀ፡ ያዕቆብ
  choice: ils ont été livrés entre les mains des deux fils de Jacob
  rationale: Rend directement le passif « ont été donnés/livrés » et adapte naturellement en français l’expression sémitique au singulier « dans la main ».
- source_word: በፃዕር
  choice: dans les tourments
  rationale: Le terme guèze désigne la douleur, la souffrance ou le tourment, et non l’épée. La formulation conserve la manière ou la circonstance douloureuse de leur mort sans surinterpréter.
- source_word: ወኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  choice: Cela leur a été compté comme justice et inscrit en leur faveur comme justice
  rationale: La répétition de « justice » est maintenue, ainsi que la distinction entre l’imputation et l’inscription consignées dans le texte.
theological_decisions:
- issue: Référent de « son sanctuaire »
  choice: Conserver « son sanctuaire »
  alternative: Préciser « le sanctuaire de Dieu » ou « son propre sanctuaire »
  rationale: Le possessif du texte source est authentiquement susceptible de plusieurs lectures contextuelles; aucune précision théologique absente du verset n’est ajoutée.
- issue: Qualification de l’acte des fils de Jacob
  choice: Traduire littéralement qu’il leur fut compté et inscrit comme justice
  alternative: Atténuer la formule ou la paraphraser comme une simple approbation
  rationale: Le texte porte une tension morale et théologique explicite. La traduction la conserve sans défendre ni corriger le jugement exprimé.
- issue: Destinataire ou portée du témoignage
  choice: « à Israël »
  alternative: « au sujet d’Israël » ou « contre Israël »
  rationale: La préposition peut marquer la direction ou la portée. Dans le contexte d’une proclamation destinée au peuple, « à Israël » est naturel tout en évitant d’imposer une valeur accusatoire.
translation_notes:
  register: Français international moderne, digne et lisible. La citation conserve le ton solennel de l’ordre et la répétition rhétorique du texte source. Le début fragmentaire est maintenu, puisque le verset fourni poursuit syntaxiquement le contexte précédent.
