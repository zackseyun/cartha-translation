base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/024.yaml
  text: And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.
translation:
  language: fr
  text: Il arriva au pays d’Éphrata et y demeura. Rachel enfanta de nuit un fils et l’appela « Fils de ma douleur », car elle avait souffert en accouchant ; mais son père l’appela Benjamin. C’était le onzième jour du huitième mois, dans la première année de la sixième semaine de ce jubilé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  choice: y demeura
  rationale: Le verbe peut exprimer le fait de séjourner ou de passer la nuit. « Y demeura » conserve l’idée générale du séjour sans imposer une durée précise.
- source_word: ወልደ ሕማምየ
  choice: Fils de ma douleur
  rationale: Traduction transparente du nom explicatif donné par Rachel, en conservant le lien direct avec sa souffrance lors de l’accouchement.
- source_word: ዐጸበታ
  choice: elle avait souffert
  rationale: Le contexte de l’enfantement appelle ici l’idée de détresse ou de douleur éprouvée par Rachel.
- source_word: ብንያም
  choice: Benjamin
  rationale: Forme française traditionnelle et largement reconnue du nom propre transmis par le guèze.
- source_word: ኢዮቤልው
  choice: jubilé
  rationale: Terme chronologique caractéristique du livre, désignant un cycle jubilaire.
