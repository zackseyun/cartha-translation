    issue: « débauche sexuelle » pour ዘማ
    rationale: Cette expression est maladroite et peut évoquer une dépravation généralisée plutôt que la fornication/immoralité sexuelle visée par le terme et par l'audit anglais.
  - severity: medium
    issue: Omission de « tout homme » dans la dernière proposition
    rationale: Le texte source porte explicitement ኵሉ፡ ሰብእ (« tout homme »). « Quiconque » neutralise cette précision lexicale.
  - severity: low
    issue: Référent potentiellement ambigu de « le » dans « Quiconque le profane »
    rationale: Après « le SEIGNEUR », le pronom masculin peut être momentanément rattaché au mauvais antécédent en français. Reprendre « Israël » clarifie le référent contextuel sans ajouter de sens.
