  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: fr
  text: On la brûlera au feu, parce qu’elle a profané le nom de la maison de son père, et elle sera retranchée d’Israël. Qu’aucune fornication ni aucune impureté ne se trouve en Israël durant tous les jours des générations de la terre, car Israël est saint pour le SEIGNEUR. Tout homme qui profanera Israël mourra certainement ; on le lapidera à coups de pierres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: On la brûlera par le feu
  rationale: Le suffixe objet féminin est rendu explicitement par « la »; la formulation conserve l’image et la valeur future du guèze.
- source_word: አርኰሰት፡ ስመ፡ ቤተ፡ አቡሃ
  choice: elle a profané le nom de la maison de son père
  rationale: « Profaner » rend le champ cultuel et moral du verbe sans réduire l’expression à un simple déshonneur social.
- source_word: ትሠረው፡ እምእስራኤል
  choice: elle sera retranchée d’Israël
  rationale: « Retranchée » exprime naturellement l’élimination de la communauté impliquée par l’image de déracinement.
- source_word: ዘማ፡ ወርኵስ
  choice: débauche sexuelle ni aucune impureté
  rationale: « Débauche sexuelle » explicite le sens sexuel de ዘማ dans un français actuel, tandis qu’« impureté » préserve la portée large, notamment rituelle ou morale, de ርኵስ.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: tous les jours des générations de la terre
  rationale: La tournure inhabituelle de la source est conservée afin de ne pas réduire sa portée temporelle à une simple formule telle que « pour toujours ».
- source_word: ሞተ፡ ለይሙት
  choice: mourra certainement
  rationale: L’infinitif absolu accompagné du verbe conjugué marque l’insistance; l’adverbe français en restitue la force.
- source_word: በእብን፡ ይውግርዎ
  choice: qu’on le lapide à coups de pierres
  rationale: Cette formulation française naturelle conserve à la fois l’action de lapider et la mention explicite des pierres.
theological_decisions:
- issue: Référent de l’objet dans « quiconque le profane »
  choice: Employer le pronom masculin « le », renvoyant naturellement à Israël
  alternative: 'Traduire sans objet explicite : « quiconque profane »'
  rationale: Le contexte immédiat fait d’Israël, masculin en français, le référent le plus probable, mais la traduction n’ajoute pas de complément doctrinal tel que « l’alliance » ou « la sainteté ».
- issue: Nom divin እግዚአብሔር
  choice: le SEIGNEUR
  alternative: Dieu
  rationale: La forme guèze est traditionnellement un titre divin; « le SEIGNEUR » maintient le registre biblique et suit la représentation de la couche de consultation sans imposer une vocalisation du nom divin.
- issue: Portée de la sainteté d’Israël
  choice: « Israël est saint pour le SEIGNEUR »
  alternative: « Israël est consacré au SEIGNEUR »
  rationale: « Saint pour » garde le prédicat explicite de la source et sa tension entre qualité de sainteté et appartenance consacrée, sans choisir exclusivement l’une des deux nuances.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les impératifs juridiques sont rendus par « que » suivi du subjonctif, tandis que les futurs initiaux restent au futur. La répétition sémitique liée à la lapidation est légèrement naturalisée sans atténuer la sanction.
