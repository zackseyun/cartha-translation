  text: We left them so that they might be subject before Satan on the earth. And the remedy for all their diseases...
translation:
  language: fr
  text: Nous les avons laissés afin qu’ils soient soumis devant Satan sur la terre. Et le remède à toutes leurs maladies…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte fourni s’interrompt ici au milieu de la phrase.
    reason: Le dernier groupe nominal guèze est syntaxiquement incomplet; les points de suspension et la note signalent cette lacune sans inventer la suite.
lexical_decisions:
- source_word: አተርፍነ
  choice: Nous les avons laissés
  rationale: Le verbe à la première personne du pluriel signifie ici « nous avons laissé/épargné ». Le complément « les » est repris du contexte, sans ajouter explicitement « un dixième », absent du segment guèze fourni.
- source_word: ይትኰነኑ
  choice: qu’ils soient soumis
  rationale: Cette forme passive exprime l’idée d’être assujettis ou placés sous autorité; « soumis » conserve cette valeur sans préciser davantage la nature de l’assujettissement.
- source_word: ቅድመ፡ ሰይጣን
  choice: devant Satan
  rationale: Traduction formelle de la préposition « devant/en présence de ». Une lecture fonctionnelle « sous l’autorité de Satan » est possible, mais résoudrait l’expression plus qu’elle ne le fait dans la source.
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ
  choice: Et le remède à toutes leurs maladies…
  rationale: ወፈውሰ est compris comme le nom « remède/guérison » avec la conjonction, et non comme « nous avons guéri ». Le segment transmis s’achève sur un groupe nominal incomplet.
theological_decisions:
- issue: Relation des êtres concernés à Satan
  choice: « soumis devant Satan »
  alternative: « soumis à Satan » ou « sous l’autorité de Satan »
  rationale: La formulation retenue préserve la préposition littérale « devant » et l’ambiguïté de la relation, au lieu d’expliciter une autorité que le texte ne formule pas directement.
- issue: Quantité des êtres laissés
  choice: Ne pas préciser « un dixième »
  alternative: « Nous avons laissé un dixième d’entre eux »
  rationale: Même si le contexte précédent peut fournir cette quantité, elle ne figure pas dans le segment source fourni; l’ajouter dans le corps du verset constituerait une explicitation.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du guèze lorsque cela est nécessaire pour préserver l’ambiguïté. Le fragment final est marqué par des points de suspension et expliqué en note.
