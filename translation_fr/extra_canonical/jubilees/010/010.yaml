  text: And he said, “Let a tenth of them remain before him, and let nine parts descend into the place of judgment.”
translation:
  language: fr
  text: 'Et il dit : « Qu’un dixième d’entre eux reste devant lui, et que les neuf dixièmes restants descendent dans le lieu du jugement. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ዓሥራተሙ (contexte immédiat : “leur dixième” / “un dixième d’entre eux”)'
  choice: un dixième d’entre eux
  rationale: Rend clairement la proportion du groupe tout en conservant l’idée de partage présente dans le passage.
- source_word: መካነ፡ ደይን
