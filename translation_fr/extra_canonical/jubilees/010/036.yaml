  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: fr
  text: Il habita dans le pays de Médie, près des frères de sa femme, jusqu’à ce jour. Il donna à son lieu d’habitation et à celui de ses fils le nom de Médie, du nom de Madaï, leur père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ሜድቂን
  choice: le pays de Médie
  rationale: Rend le nom géographique traditionnel par sa forme française usuelle.
- source_word: አኀወ፡ ብእሲቱ
  choice: les frères de sa femme
  rationale: Le substantif est pluriel dans la source guèze; «près de» traduit naturellement la proximité.
- source_word: ምገባሪሁ፡ ወምገባረ፡ ውሉዱ
  choice: le lieu où il demeurait et où demeuraient ses fils
  rationale: Formulation française naturelle qui conserve les deux lieux de résidence coordonnés, celui de l’homme et celui de ses fils.
- source_word: እስመ፡ ማዳይ፡ አቡሆሙ
  choice: d’après Madaï, leur père
  rationale: Exprime l’attribution du nom à Madaï sans ajouter d’explication absente de la source.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit, tandis que l’imparfait décrit la résidence. La formule «jusqu’à ce jour» est conservée dans son ambiguïté référentielle traditionnelle.
