  text: And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”
translation:
  language: fr
  text: Qu’ils ne dominent pas les esprits des vivants, car toi seul connais leur jugement, et qu’ils n’aient aucun pouvoir sur les fils des justes, dès maintenant et pour toujours. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናፍስት / notion sous-jacente de «spirits»
  choice: les esprits
  rationale: Conserve le vocabulaire spirituel du contexte démonologique sans préciser artificiellement s’il s’agit ici de la vie intérieure ou d’êtres spirituels.
- source_word: «rule over»
  choice: dominent sur
  rationale: Rend directement l’idée d’autorité et de maîtrise, dans une formulation française claire et solennelle.
- source_word: «sons of the righteous»
