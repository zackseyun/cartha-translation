  text: And he prayed before the Lord his God, and said, “God of the spirits of all flesh, who have shown mercy to me and saved me and my sons from the waters of the flood, and have not caused me to perish as you caused the sons of perdition to perish—
translation:
  language: fr
  text: 'Il pria devant le Seigneur son Dieu et dit : « Dieu des esprits de toute chair, toi qui as eu pitié de moi, qui m’as sauvé, moi et mes fils, des eaux du déluge, et qui ne m’as pas fait périr comme tu as fait périr les fils de perdition — »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: God of the spirits of all flesh
  choice: Dieu des esprits de toute chair
  rationale: Conserve la formulation sémitique et son écho scripturaire, sans préciser de manière indue le rapport entre les esprits et les êtres de chair.
- source_word: shown mercy
