    issue: « mortier » remplace « argile »
    rationale: Le texte source et l’audit anglais portent « argile ». « Mortier » interprète et normalise le matériau de construction, alors que le texte identifie de façon singulière l’argile à l’asphalte.
  - severity: medium
    issue: « dont ils les enduisaient » affaiblit le sens de liaison/maçonnerie
    rationale: Le verbe français « enduire » décrit normalement un revêtement. Le contexte et l’audit anglais (« with which they plastered/cemented them ») concernent le matériau employé pour joindre les briques.
  revised_text: Ils se mirent à bâtir et, au cours de la quatrième semaine, ils fabriquèrent des briques au feu ; les briques leur servirent de pierres, et l’argile avec laquelle ils les cimentaient était de l’asphalte qui sort de la mer et des sources d’eau du pays de Shinéar.
