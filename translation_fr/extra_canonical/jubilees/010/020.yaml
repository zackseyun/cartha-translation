revisions:
- from: Ils commencèrent à bâtir. La quatrième semaine, ils firent cuire des briques au feu ; les briques leur tinrent lieu de pierre, et le mortier dont ils les enduisaient était de l’asphalte provenant de la mer et des sources d’eau du pays de Shinéar.
  to: Ils se mirent à bâtir et, au cours de la quatrième semaine, ils fabriquèrent des briques au feu ; les briques leur servirent de pierres, et l’argile avec laquelle ils les cimentaient était de l’asphalte qui sort de la mer et des sources d’eau du pays de Shinéar.
  rationale: 'La révision conserve le déroulement narratif et les termes établis du projet, mais rétablit « argile » pour le mot explicitement présent dans la source. Elle remplace aussi « enduire » par « cimenter », qui exprime mieux l’emploi du matériau entre les briques. Aucune note n’est nécessaire : la formulation, bien qu’étrange sur le plan matériel, traduit cette particularité sans la résoudre ni l’harmoniser.'
