  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: fr
  text: Ils se mirent à bâtir et, au cours de la quatrième semaine, ils fabriquèrent des briques au feu ; les briques leur servirent de pierres, et l’argile avec laquelle ils les cimentaient était de l’asphalte qui sort de la mer et des sources d’eau du pays de Shinéar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሕንጹ
  choice: bâtir
  rationale: Rend naturellement le verbe exprimant l’action de construire.
- source_word: በሱባዔ፡ ራብዕ
  choice: La quatrième semaine
  rationale: Conserve le repère chronologique explicite du texte.
- source_word: ንንፈሱ፡ በእሳት
  choice: ils firent cuire des briques au feu
  rationale: Exprime idiomatiquement en français la fabrication de briques par le feu, conformément au contexte.
- source_word: ከመ፡ እብን
  choice: leur tinrent lieu de pierre
  rationale: Préserve la comparaison fonctionnelle entre les briques et la pierre.
- source_word: ፀቡር
  choice: mortier
  rationale: Dans ce contexte de maçonnerie et d’enduit, « mortier » est plus clair et naturel que le sens générique « argile ».
- source_word: አስፋሌጦስ
  choice: asphalte
  rationale: Transcription lexicale directe désignant le bitume naturel employé dans la construction.
- source_word: ዘይወፅእ፡ እምነ፡ ባሕር፡ ወእምአንቅዐተ
  choice: provenant de la mer et des sources d’eau
  rationale: Conserve la double origine indiquée par le texte source.
