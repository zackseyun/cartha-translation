  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
translation:
  language: fr
  text: Vous avez habité dans la rébellion[a] ; dans la rébellion, tes enfants tomberont, et tu seras déraciné pour toujours. Ne demeure pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot rendu par « rébellion » est aussi compris par certains comme « ta demeure » ou « ton habitation ». Selon cette lecture : « Vous avez habité dans ta demeure ; dans ta demeure, tes enfants tomberont… » Le passage présente déjà une alternance entre le pluriel (« vous avez habité ») et le singulier (« tes », « tu »).'
    reason: Signaler l’interprétation lexicale concurrente sans l’adopter et sans masquer l’alternance de nombre présente dans le texte.
lexical_decisions:
- source_word: በሀከከ
  choice: dans la rébellion
  rationale: Le nom est compris ici au sens de « rébellion » ou « sédition », conformément à l’analyse lexicale retenue dans la révision critique. Sa répétition est conservée.
- source_word: ኀደርክሙ
  choice: vous avez habité
  rationale: La forme accomplie et le suffixe de deuxième personne du pluriel sont rendus explicitement, sans les transformer en futur.
- source_word: ይወድቁ
  choice: tomberont
  rationale: Rend simplement l’idée de chute au futur, sans préciser si elle est physique, politique ou punitive.
- source_word: ትሴር
  choice: tu seras déraciné
  rationale: Le passif exprime l’arrachement ou l’éradication ; « déraciné » conserve l’image sans en déterminer davantage la portée.
- source_word: ኢትኅደር
  choice: Ne demeure pas
  rationale: La défense finale est traduite littéralement et reste abrupte comme dans le texte source.
theological_decisions:
- issue: Alternance entre destinataire pluriel et singulier
  choice: Conserver « vous avez habité », puis « tes enfants » et « tu seras déraciné »
  alternative: Uniformiser tout le verset au singulier
  rationale: Le texte guèze présente lui-même ce changement de nombre. Le conserver évite de résoudre silencieusement une difficulté textuelle ou référentielle.
- issue: Portée de la chute et du déracinement
  choice: Ne pas expliciter la nature du jugement
  alternative: Paraphraser comme une destruction politique, territoriale ou spirituelle
  rationale: Le texte ne tranche pas cette question ; une formulation sobre préserve sa tension.
translation_notes:
  register: Français moderne, digne et direct. La répétition de « dans la rébellion » ainsi que l’alternance inhabituelle entre le pluriel « vous » et le singulier « tes/tu » sont volontairement conservées, car elles reflètent le texte source.
