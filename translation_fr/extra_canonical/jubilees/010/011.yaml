  text: 'He knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and a tenth of them'
translation:
  language: fr
  text: 'Il savait qu’ils ne marchaient pas avec droiture et ne s’efforçaient pas d’agir avec justice.[a] Nous avons agi conformément à toute sa parole : nous avons lié dans le lieu du jugement tous les êtres mauvais qui se montraient cruels, et un dixième d’entre eux…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du verset éthiopien est difficile. Le premier membre peut aussi évoquer une marche « avec force » ou « avec fermeté », et le second une conduite ou un effort « dans la justice ». La traduction suit le sens général du passage sans masquer cette incertitude.
    reason: textual_difficulty
lexical_decisions:
- source_word: ያአምር
  choice: Il savait
  rationale: Rend directement le verbe initial à la troisième personne, sans réintroduire la proposition du verset précédent absente du texte fourni.
- source_word: ዘየሐውሩ
  choice: qu’ils ne marchaient pas
  rationale: Conserve l’image sémitique de la marche comme conduite, naturelle aussi en français biblique courant.
- source_word: በጽድቅ
  choice: pour la justice
  rationale: « Justice » garde la portée morale et théologique de ṣədq sans la réduire à la seule rectitude personnelle.
- source_word: ይጸውጉ
  choice: se montraient cruels
  rationale: Reproduit l’idée de cruauté ou de violence attribuée aux êtres mauvais sans surspécifier leur identité.
- source_word: መካነ፡ ደይን
  choice: le lieu du jugement
  rationale: Traduction formelle de l’expression désignant le lieu où s’exerce le jugement.
- source_word: ወዓሥራተሙ
  choice: ainsi qu’un dixième d’entre eux
  rationale: Rend explicitement la fraction finale tout en conservant son rattachement syntaxique difficile à la suite du contexte.
theological_decisions:
- issue: Nature de la droiture et de la justice dans la première phrase
  choice: 'Conserver deux formulations distinctes : « avec droiture » et « pour la justice »'
  alternative: Fusionner les deux membres en une affirmation générale sur leur mauvaise conduite
  rationale: Le parallélisme du texte source porte une tension lexicale qu’il convient de préserver malgré sa difficulté.
- issue: Identification des « êtres mauvais »
  choice: Ne pas les nommer « démons » ou « esprits » dans le corps du verset
  alternative: Les expliciter comme esprits mauvais d’après le contexte
  rationale: Le segment fourni emploie une désignation adjectivale substantivée; l’explicitation contextuelle risquerait d’ajouter au texte.
- issue: Lien du dixième avec le jugement
  choice: Maintenir la mention finale sans expliquer ici son sort précis
  alternative: Préciser que le dixième fut laissé libre ou soumis à Mastéma d’après la suite du récit
  rationale: Le verset isolé s’arrête sur cette fraction; compléter son sens avec le verset suivant résoudrait indûment la suspension du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme est conservé, de même que la suspension contextuelle autour du « dixième », tout en donnant au verset une syntaxe française complète.
