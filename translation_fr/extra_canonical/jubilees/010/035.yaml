  yaml_path: translation/extra_canonical/jubilees/010/035.yaml
  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
translation:
  language: fr
  text: Cette terre fut appelée Canaan. Japhet et ses fils partirent vers la mer et s’établirent dans le territoire qui leur était attribué. Madaï vit le pays du bord de mer, mais celui-ci ne lui plut pas. Il demanda alors une part de territoire à Élam, Assour et Arpakshad, les frères de sa femme[a], et il s’y établit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction éthiopienne est quelque peu heurtée. Le pluriel « les frères de sa femme » semble désigner collectivement Élam, Assour et Arpakshad comme ceux auxquels Madaï demanda une part de territoire.
    reason: segmentation_note
lexical_decisions:
- source_word: ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን
  choice: Cette terre fut appelée Canaan
  rationale: Rend directement la proposition passive et le démonstratif, dans un français naturel et digne.
- source_word: መንገለ፡ ባሕር
  choice: vers la mer
  rationale: Conserve le sens directionnel de መንገለ et le sens ordinaire de ባሕር.
- source_word: ምድረ፡ መክፈልቶሙ
  choice: le territoire qui leur était attribué
  rationale: Exprime l’idée de la terre constituant leur part ou leur lot sans alourdir la phrase.
- source_word: ምድረ፡ ባሕር
  choice: le pays du bord de mer
  rationale: Formulation géographique naturelle qui garde le lien littéral entre la terre et la mer.
- source_word: አኀወ፡ ብእሲቱ
  choice: les frères de sa femme
  rationale: አኀወ est pluriel; Élam, Assour et Arpakshad sont donc présentés collectivement comme les frères de sa femme.
theological_decisions:
- issue: Identification des personnes sollicitées par Madaï
  choice: Élam, Assour et Arpakshad sont tous les trois ceux à qui Madaï demande une part de territoire et sont apposés à « les frères de sa femme ».
  alternative: Rattacher spécialement Arpakshad seul à la parenté matrimoniale, ou lire « le frère de sa femme » au singulier.
  rationale: La syntaxe éthiopienne est quelque peu heurtée, mais le pluriel አኀወ soutient le rattachement collectif des trois noms à « les frères de sa femme ».
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsmes. Les noms propres suivent des formes françaises courantes. La répétition finale « il s’y établit » est conservée parce qu’elle correspond à une proposition explicite du texte source.
