  text: from the land of Shinar[28]. And Ham and his sons went into the land that was apportioned to him, which he acquired.
translation:
  language: fr
  text: du pays de Shinéar.[a] Puis Cham et ses fils se rendirent dans le pays qui lui était échu en partage et dont il prit possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset commence au milieu d’une phrase poursuivie du verset précédent.
