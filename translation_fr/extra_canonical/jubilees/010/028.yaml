lexical_decisions:
- source_word: እምድረ፡ ሲናአር
  choice: du pays de Shinéar
  rationale: Rend littéralement la provenance exprimée par እም- (« de, depuis ») et conserve la forme biblique française usuelle du toponyme.
- source_word: ወሖሩ፡ ካም፡ ወውሉዱ
  choice: Puis Cham et ses fils se rendirent
  rationale: Le verbe ሖረ signifie « aller »; « se rendirent » est naturel dans un récit de déplacement. « Puis » marque ici la progression narrative portée par ወ- sans alourdir la phrase.
- source_word: እንተ፡ አሕዝት፡ ሎቱ
  choice: qui lui était échu en partage
  rationale: La tournure indique que le pays lui revient ou lui est attribué; cette formulation évite l’idée injustifiée d’une prise illégitime et convient au contexte du partage des terres.
- source_word: ዘረከበ
  choice: dont il prit possession
  rationale: Rend explicitement le second prédicat, lié à l’obtention ou à la réception effective du territoire, tout en distinguant l’attribution du pays de sa prise de possession.
theological_decisions:
- issue: Caractère légitime ou illégitime de l’occupation du territoire par Cham
  choice: Présenter le pays comme échu à Cham en partage, puis occupé par lui
  alternative: « qu’il s’était approprié » ou « qu’il avait saisi pour lui-même »
  rationale: Le texte décrit ici le territoire reçu par Cham; une formulation évoquant une usurpation anticiperait indûment l’action de Canaan dans le contexte suivant.
translation_notes:
  register: Français international moderne, narratif et digne. Le début fragmentaire est conservé parce que la délimitation du verset rattache « du pays de Shinéar » à la phrase précédente.
