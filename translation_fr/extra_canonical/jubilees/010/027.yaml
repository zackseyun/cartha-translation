  text: And it was between Asshur and Babylon, in the land of Shinar; and he called its name Overthrow, in the fourth week, in the first year at its beginning, in the thirty-fourth jubilee, they were dispersed.
translation:
  language: fr
  text: Cela se trouvait entre Assour et Babylone, dans le pays de Shinéar. Il lui donna le nom d’« Effondrement »[a]. Au commencement de la première année de la quatrième semaine du trente-quatrième jubilé, ils furent dispersés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ruine » ou « Renversement ».'
    reason: Le nom éthiopien ደቀት peut exprimer la chute, la ruine ou le renversement; la note conserve cette latitude lexicale.
lexical_decisions:
- source_word: ውእቱ፡ ማእከለ፡ አሱር፡ ወባቢሎን
  choice: Cela se trouvait entre Assour et Babylone
  rationale: Le pronom éthiopien ne précise pas ici le genre de son antécédent; « cela » évite d’en introduire un sans contexte tout en rendant naturellement la localisation exprimée par « entre ».
- source_word: ምድረ፡ ሰናአር
  choice: le pays de Shinéar
  rationale: « Pays » rend le terme désignant la terre ou le territoire, et « Shinéar » est la forme française traditionnelle et reconnaissable du toponyme.
- source_word: ደቀት
  choice: Effondrement
  rationale: Le mot désigne une chute, une ruine ou un renversement. « Effondrement » conserve la valeur sémantique du nom donné au lieu plutôt que de le traiter comme un nom opaque.
- source_word: በመቅደመ፡ ዚአሁ
  choice: Au commencement
  rationale: La locution signifie « à son commencement »; intégrée à la formule chronologique française, elle se rapporte naturellement à la première année.
- source_word: በ፴ሳባ፡ ወአርባዕቱ፡ እዮቤልው
  choice: du trente-quatrième jubilé
  rationale: Le texte porte explicitement trente et quatre, soit le trente-quatrième jubilé.
- source_word: ተዘርዉ
  choice: ils furent dispersés
  rationale: Le passif préserve l’absence d’agent exprimé dans la source et le sens de dispersion.
