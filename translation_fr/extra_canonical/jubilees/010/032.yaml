  yaml_path: translation/extra_canonical/jubilees/010/032.yaml
  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: fr
  text: « Maudit sois-tu, et maudit seras-tu plus que tous les fils de Noé, par la malédiction sous laquelle nous nous sommes liés par serment[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze fourni s’arrête après « par serment ». La traduction anglaise consultée ajoute : « devant le saint juge et devant Noé, notre père », mots qui ne figurent pas dans l’extrait source présenté ici.'
    reason: Signaler avec transparence l’écart entre l’extrait guèze fourni et la traduction anglaise consultée, sans introduire dans le corps du texte des mots absents du témoin présenté.
lexical_decisions:
- source_word: ርጉም፡ አንተ፡ ወርጉመ፡ ትከውን
  choice: Maudit sois-tu, et maudit seras-tu
  rationale: Conserve le parallélisme emphatique et la distinction entre l’état présent et la portée future de la malédiction, dans un français solennel mais clair.
- source_word: እምኵሎሙ፡ ውሉደ፡ ኖኅ
  choice: plus que tous les fils de Noé
  rationale: La préposition እም devant un ensemble peut exprimer ici une comparaison superlative; « plus que » rend naturellement cette valeur sans l’affaiblir en simple appartenance au groupe.
- source_word: በመርገም፡ እንተ፡ ተማራዕነ፡ በመሐላ
  choice: par la malédiction sous laquelle nous nous sommes liés par serment
  rationale: Rend le moyen ou fondement exprimé par በ, ainsi que l’engagement collectif et solennel associé au serment.
theological_decisions:
- issue: Portée comparative de la malédiction
  choice: plus que tous les fils de Noé
  alternative: parmi tous les fils de Noé
  rationale: Le tour guèze soutient la lecture comparative attestée par la couche de consultation anglaise; cette formulation préserve la sévérité particulière de la malédiction sans ajouter d’interprétation doctrinale.
- issue: Finale plus longue de la couche anglaise de consultation
  choice: Ne pas intégrer « devant le saint juge et devant Noé, notre père » au corps du verset
  alternative: Ajouter cette proposition d’après la version anglaise POB
  rationale: Cette proposition n’apparaît pas dans le texte guèze fourni. La traduction suit donc prioritairement le témoin original présenté et signale l’écart en note.
translation_notes:
  register: Registre solennel et direct. L’inversion « maudit seras-tu » maintient la force formulaire de l’original tout en restant intelligible en français moderne. Le début de l’extrait guèze fourni (« dans le territoire de Sem… ») paraît appartenir au contexte immédiatement antérieur et n’a pas été intégré au verset 10:32 tel qu’il est délimité par la référence et la couche de consultation.
