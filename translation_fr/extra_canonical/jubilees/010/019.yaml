  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: fr
  text: 'Car ils partirent du pays d’Ararat vers l’est, en direction de Shinéar. À son époque, ils bâtirent la ville et la tour, en disant : « Venez, montons par elle jusqu’au ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈለሱ
  choice: ils quittèrent… et partirent
  rationale: Le verbe exprime un déplacement ou une migration depuis un lieu; cette formulation naturelle conserve à la fois le départ et le mouvement.
- source_word: መንገለ፡ ጽባሕ
  choice: vers l’est
  rationale: L’expression signifie littéralement « du côté du levant/matin » et désigne ici la direction orientale.
- source_word: ሰናአር
  choice: Shinéar
  rationale: Forme française traditionnelle et reconnaissable du nom géographique biblique.
- source_word: ማኅፈድ
  choice: tour
  rationale: Dans ce contexte de construction urbaine et d’ascension vers le ciel, le terme correspond à la tour du récit de Shinéar.
- source_word: ንዕርግ
  choice: montons
  rationale: Rend directement l’exhortation à monter, dans un français actuel et soutenu sans archaïsme.
- source_word: ቦቱ
  choice: par elle
  rationale: Conserve le pronom instrumental ou locatif renvoyant vraisemblablement à la tour, sans expliciter davantage que le texte.
theological_decisions:
- issue: Moyen envisagé pour atteindre le ciel
  choice: « montons par elle jusqu’au ciel »
  alternative: « montons-y dans le ciel » ou « montons grâce à elle au ciel »
  rationale: La formulation maintient la tour comme moyen probable de l’ascension tout en préservant la légère ambiguïté syntaxique du texte.
- issue: Référent de « de son temps »
  choice: Maintien du pronom singulier sans identification
  alternative: Nommer explicitement un personnage selon le contexte précédent
  rationale: Le fragment source porte un suffixe masculin singulier; l’identifier ici ajouterait une précision absente du verset fourni.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement segmentée pour la lisibilité, tout en conservant l’enchaînement causal, les noms propres et l’ambiguïté des pronoms du texte guèze.
