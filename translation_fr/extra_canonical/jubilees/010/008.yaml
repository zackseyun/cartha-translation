  text: And the Lord our God told us to bind all of them.
translation:
  language: fr
  text: Et le Seigneur notre Dieu nous a dit de les enchaîner tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር፡ አምላክነ
  choice: le Seigneur notre Dieu
  rationale: Rend le titre divin et le possessif collectif dans un français biblique naturel et digne.
- source_word: አሰርነ
  choice: enchaîner
  rationale: Dans le contexte de l’emprisonnement des esprits mauvais, « enchaîner » exprime plus précisément l’action de lier et de maintenir captif que le simple « lier ».
