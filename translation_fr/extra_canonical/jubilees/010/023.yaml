  text: And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.
translation:
  language: fr
  text: 'Le Seigneur descendit, et nous descendîmes avec lui, pour voir la ville et la tour que les fils des hommes avaient bâties. Il brouilla toutes leurs langues, si bien qu’ils ne comprenaient plus la parole les uns des autres, et ils cessèrent de bâtir la ville et la tour. C’est pourquoi tout le pays de Shinéar fut appelé Babel[a] : car c’est là que le Seigneur brouilla toutes les langues des fils des hommes, et c’est de là qu’ils furent dispersés dans leurs pays, chacun selon sa langue et selon son peuple.'
  philosophy: optimal-equivalence
