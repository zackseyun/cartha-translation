revisions:
- from: 'Au trente-troisième jubilé, la première année de la deuxième semaine, Péleg prit pour femme Lomna, fille de Shinéar. Elle lui donna un fils la quatrième année de cette semaine. Il l’appela Réou, car il dit : « Voici que les êtres humains sont devenus mauvais en suivant un conseil mauvais : ils veulent se bâtir une ville et une tour dans le pays de Shinéar[a]. »'
  to: 'Dans le trente-troisième jubilé, la première année de la deuxième semaine, Péleg prit pour femme Lomna, fille de Shinéar. Elle lui donna un fils la quatrième année de cette semaine. Il donna à son fils le nom de Réou, car il dit : « Voici que les êtres humains sont devenus mauvais par un mauvais dessein : se bâtir une ville et une tour dans le pays de Shinéar[a]. »'
  rationale: La révision maintient les repères calendaires et les noms, conserve la restitution nécessaire de « Shinéar », et rend le rapport entre le mauvais conseil/dessein et le fait de bâtir sans ajouter une modalité de volonté. La formule de nomination est rendue explicitement pour éviter toute ambiguïté pronominale.
