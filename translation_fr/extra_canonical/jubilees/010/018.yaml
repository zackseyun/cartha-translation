  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
translation:
  language: fr
  text: 'Dans le trente-troisième jubilé, la première année de la deuxième semaine, Péleg prit pour femme Lomna, fille de Shinéar. Elle lui donna un fils la quatrième année de cette semaine. Il donna à son fils le nom de Réou, car il dit : « Voici que les êtres humains sont devenus mauvais par un mauvais dessein : se bâtir une ville et une tour dans le pays de Shinéar[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte conservé s’achève littéralement par « dans le pays de… » ; « Shinéar » est restitué d’après la forme construite du nom et le contexte immédiat.
    reason: Le découpage du verset semble avoir rejeté le complément du nom au verset suivant, tandis que la morphologie guèze appelle un complément génitif.
lexical_decisions:
- source_word: ፋሌክ
  choice: Péleg
  rationale: Forme française biblique usuelle du nom propre Peleg.
- source_word: ሎምና
  choice: Lomna
  rationale: Translittération naturelle en français du nom éthiopien.
- source_word: ሲናአር
  choice: Shinéar
  rationale: Forme française reconnaissable du toponyme biblique Shinar, adaptée à la phonologie et à l’usage français.
- source_word: ራገው
  choice: Réou
  rationale: Forme française biblique usuelle du nom Reu.
- source_word: ውሉደ፡ ሰብእ
  choice: les êtres humains
  rationale: Rend l’expression littérale « les enfants des hommes » en français moderne inclusif et naturel sans en modifier le référent collectif.
- source_word: በምክረ፡ ዐግ
  choice: en suivant un conseil mauvais
  rationale: Conserve l’idée d’un conseil ou dessein marqué par le mal, tout en exprimant naturellement le rapport causal en français.
- source_word: ሀገረ፡ ወማኅፈደ
  choice: une ville et une tour
  rationale: Correspond au couple traditionnel et contextuellement assuré du récit de Babel.
theological_decisions:
- issue: Nature du mal des êtres humains et rapport avec leur projet de construction
  choice: '« sont devenus mauvais en suivant un conseil mauvais : ils veulent se bâtir… »'
  alternative: « sont devenus mauvais par le conseil du mal pour se bâtir… »
  rationale: La formulation choisie conserve le lien entre leur corruption et le mauvais conseil, sans transformer le texte en affirmation doctrinale plus précise sur l’origine personnelle ou métaphysique du mal. Les deux-points rendent intelligible que le projet de bâtir constitue le contenu de ce conseil.
translation_notes:
  register: Français moderne, digne et accessible. Les repères calendaires propres au livre des Jubilés sont conservés. Le fragment initial « génération pour le jour du jugement » paraît appartenir au verset précédent et n’est donc pas intégré. La répétition du champ lexical du mal est maintenue, mais formulée avec une syntaxe française naturelle.
