  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
translation:
  language: fr
  text: Ils la construisirent pendant quarante-trois ans. Sa largeur était de 204 coudées[a], et une brique avait une hauteur d’un tiers de coudée ; la hauteur de la tour atteignait 5 433 coudées et deux palmes, et douze stades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mesures de la tour dans le texte éthiopien sont particulièrement difficiles à interpréter ; certains nombres ou certaines unités ont peut-être été altérés au cours de la transmission. Les chiffres transmis sont conservés ici aussi littéralement que possible, mais les dimensions exactes restent incertaines.
    reason: textual_variant
