  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
translation:
  language: fr
  text: 'Cham, son père, ainsi que Koush et Mitsraïm, ses frères, lui dirent : « Tu t’es établi dans un pays qui ne t’appartient pas et qui ne t’est pas revenu par le sort. N’agis pas ainsi ! Car si tu le fais, toi et tes fils, vous tomberez dans ce pays et serez maudits à cause de votre rébellion. En effet, c’est par rébellion que tu t’y es établi, et c’est par rébellion que tes fils tomberont ; tu seras déraciné pour toujours. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait guèze fourni s’interrompt avant la fin du verset. Les derniers mots, « tu seras déraciné pour toujours », sont restitués d’après la tradition textuelle représentée par l’édition consultée et sa traduction.
    reason: Signaler de façon transparente que la conclusion dépasse l’extrait source transmis, sans masquer la restitution éditoriale.
lexical_decisions:
- source_word: ኀደርከ
  choice: tu t’es établi
  rationale: Le verbe exprime ici l’installation ou la résidence durable dans un territoire.
- source_word: በዕፁ
  choice: par le sort
  rationale: Rend l’idée d’un territoire attribué par tirage au sort, essentielle au partage des terres dans le contexte.
- source_word: በሀከከ
  choice: à cause de votre rébellion
  rationale: Le terme renvoie à un comportement de contestation ou de révolte ; « rébellion » conserve la force morale et la répétition argumentative du passage.
- source_word: ትወድቁ
  choice: vous tomberez / tomberont
  rationale: Traduction formelle du verbe « tomber », dont la portée précise—défaite, ruine ou mort—reste volontairement ouverte.
theological_decisions:
- issue: Nature de la malédiction et de la chute
  choice: Conserver « maudits » et « tomber » sans explicitation
  alternative: Interpréter la chute comme une mort, une défaite ou une dépossession
  rationale: Le texte associe jugement territorial, malédiction et rébellion sans préciser entièrement le mécanisme ; la traduction préserve cette tension.
- issue: Responsabilité liée à l’occupation du territoire
  choice: Rendre la répétition de « rébellion »
  alternative: Varier avec « désobéissance » ou « insoumission »
  rationale: La répétition souligne que l’établissement illégitime et sa conséquence procèdent du même acte de révolte.
translation_notes:
  register: Français international actuel, digne et accessible. Les noms propres suivent les formes françaises usuelles « Cham », « Koush » et « Mitsraïm ». La syntaxe directe conserve l’avertissement solennel et les répétitions structurantes du texte.
