  text: And the Lord our God said to us[22], “Look, they are one people, and this they have begun to do; and now nothing will be withheld from them. Come, let us go down and confuse their tongues, so that one will not hear another’s speech, and they will be scattered into cities and nations, and one purpose will no longer remain with them until the day of judgment.”
translation:
  language: fr
  text: 'Et le Seigneur notre Dieu nous déclara[a] : « Voici, ils sont un seul peuple, et c’est là ce qu’ils ont commencé à faire. Désormais, rien de ce qu’ils envisagent de faire ne leur sera refusé. Allons, descendons et brouillons leurs langues, afin que l’un ne comprenne pas la parole de l’autre. Ils seront dispersés dans les pays et parmi les nations, et ils n’auront plus une même résolution jusqu’au jour du jugement. »'
  philosophy: optimal-equivalence
