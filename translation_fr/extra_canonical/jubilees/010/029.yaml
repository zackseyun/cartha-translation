translation_notes:
  register: Français international moderne, narratif et digne. « Levant » et « couchant » sont maintenus dans l’énoncé des frontières pour refléter l’imagerie directionnelle de la source, tandis que « à l’ouest » est employé dans la phrase précédente pour plus de clarté.
