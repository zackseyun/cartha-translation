base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: fr
  text: Dans le partage qui lui revenait au pays du sud.[a] Canaan vit que le pays du Liban, jusqu’au torrent d’Égypte, était extrêmement bon. Il n’alla pas dans le pays qui lui était échu en héritage, à l’ouest de la mer, mais il s’établit dans le pays du Liban, depuis le côté du levant jusqu’au côté du couchant, depuis la frontière du Jourdain jusqu’à la frontière de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du verset forme un fragment qui paraît achever la phrase précédente dans le découpage du texte transmis.
    reason: Signale honnêtement la difficulté syntaxique et versificatoire sans supprimer les mots présents dans la source.
lexical_decisions:
- source_word: በመክፈልቱ፡ ውስተ፡ ምድረ፡ ደቡብ
  choice: Dans le partage qui lui revenait au pays du sud
  rationale: Rend le fragment initial relatif au partage ou lot territorial, tout en conservant son caractère syntaxiquement incomplet dans le découpage transmis.
- source_word: መሐዘ፡ ግብጽ
  choice: torrent d’Égypte
  rationale: « Torrent » correspond au cours d’eau saisonnier servant de limite géographique; cette désignation traditionnelle n’implique pas nécessairement le Nil.
- source_word: ሠናይ፡ ይእቲ፡ ጥቀ
  choice: était extrêmement bon
  rationale: Conserve l’évaluation fortement intensifiée du texte guèze.
- source_word: ምድረ፡ ርስት
  choice: le pays qui lui était échu en héritage
  rationale: Exprime à la fois le territoire reçu en lot et sa qualité d’héritage.
- source_word: መንገለ፡ ዐረብ፡ ባሕር
  choice: à l’ouest, vers la mer
  rationale: Rend l’orientation occidentale associée à la mer sans identifier plus précisément celle-ci que ne le fait le texte.
- source_word: እምጽባሕ፡ ወእምዐረብ
  choice: depuis le côté du levant jusqu’au côté du couchant
  rationale: Traduit littérairement les orientations exprimées par le lever et le coucher du soleil, dans un français géographique naturel et digne.
