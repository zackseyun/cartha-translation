lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: un vent puissant
  rationale: Rend directement le syntagme guèze désignant un vent grand ou puissant, dans un français naturel et digne.
- source_word: ማኅፈድ
  choice: la tour
  rationale: Dans le contexte du récit de Babel, le terme désigne la tour, plutôt qu’un entrepôt ou un grenier.
- source_word: ውስተ፡ ማኅፈድ
  choice: contre la tour
  rationale: La préposition, combinée au mouvement du vent et au renversement qui suit, exprime ici la direction hostile vers la tour.
- source_word: ወገፍታአ፡ ውስተ፡ ምድር
  choice: et la renversa à terre
  rationale: Le suffixe objet renvoie à la tour; « à terre » restitue idiomatiquement le complément indiquant son abattement sur le sol.
- source_word: ወናሁ
  choice: Et voici,
  rationale: Conserve la formule déictique finale et sa suspension, puisque la phrase se poursuit vraisemblablement dans le contexte suivant.
