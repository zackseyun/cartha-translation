lexical_decisions:
- source_word: ሊባኖስ
  choice: le Liban
  rationale: Nom géographique usuel en français, avec l’article requis par l’usage moderne.
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ
  choice: depuis Hamat jusqu’à l’entrée de l’Égypte
  rationale: Rend directement les limites géographiques exprimées par « depuis… jusqu’à… » et conserve la formule traditionnelle « l’entrée de l’Égypte ».
- source_word: ውእቱ፡ ወውሉዱ
  choice: lui et ses descendants
  rationale: Le pronom masculin et le suffixe possessif renvoient à Canaan, non au territoire; « descendants » convient mieux que le littéral « fils » dans ce contexte généalogique prolongé.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: jusqu’à ce jour
  rationale: Expression temporelle française naturelle et fidèle.
- source_word: ወበእንተዝ
  choice: Et c’est pourquoi
  rationale: Conserve le lien causal et le caractère inachevé de la proposition, qui se poursuit dans le contexte suivant.
