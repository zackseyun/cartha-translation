  text: It is between Asshur and Babylon in the land of Shinar[25]. And they called its name Overthrow.
translation:
  language: fr
  text: Il se trouve entre Assour et Babylone, dans le pays de Shinéar. Ils lui donnèrent le nom d’« Écroulement »[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom traduit par « Écroulement » évoque un nom de ruine après l’effondrement de la tour. La forme sous-jacente est incertaine dans la tradition éthiopienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእቱ፡ ማእከለ
  choice: Il se trouve entre
  rationale: La tournure guèze indique la situation de la tour entre deux lieux; « se trouve » donne en français une phrase naturelle sans ajouter de précision absente du texte.
