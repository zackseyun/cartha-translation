revisions:
- from: 'Alors Mastéma, le chef des esprits, vint et dit : « Seigneur créateur, laisse certains d’entre eux demeurer devant moi. Qu’ils écoutent ma voix et fassent tout ce que je leur dirai. Car si tu ne m’en laisses pas quelques-uns, je ne pourrai pas exercer l’autorité de ma volonté sur les fils des hommes. En effet, ils servent à corrompre et à égarer avant mon jugement, car la méchanceté des fils des hommes est grande. »'
  to: 'Alors Mastéma, le chef des esprits, vint et dit : « Seigneur, Créateur, laisse-m’en quelques-uns devant moi. Qu’ils écoutent ma voix et fassent tout ce que je leur dirai. Car, si tu ne m’en laisses pas quelques-uns, je ne pourrai pas mettre à exécution le pouvoir de ma volonté sur les fils des hommes. En effet, ils servent à corrompre et à égarer avant mon jugement, car la méchanceté des fils des hommes est grande. »'
  rationale: Révision limitée à la ponctuation vocative, à une formulation française plus fluide de la demande initiale et à la restitution idiomatique de « the power of my will ». Aucun ajout interprétatif ni note n’est nécessaire.
