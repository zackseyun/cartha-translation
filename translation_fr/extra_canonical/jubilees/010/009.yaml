  text: And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”
translation:
  language: fr
  text: 'Alors Mastéma, le chef des esprits, vint et dit : « Seigneur, Créateur, laisse-m’en quelques-uns devant moi. Qu’ils écoutent ma voix et fassent tout ce que je leur dirai. Car, si tu ne m’en laisses pas quelques-uns, je ne pourrai pas mettre à exécution le pouvoir de ma volonté sur les fils des hommes. En effet, ils servent à corrompre et à égarer avant mon jugement, car la méchanceté des fils des hommes est grande. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: Mastéma
