translation:
  language: fr
  text: Les démons impurs commencèrent à égarer les enfants des fils de Noé, à les faire tomber dans l’erreur et à les détruire.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: démons impurs (attesté par la couche de consultation; le texte guèze fourni ne contient pas directement le v. 2)
  choice: les démons impurs
  rationale: Rend distinctement la nature démoniaque et l’impureté, dans un français courant et digne.
- source_word: enfants des fils de Noé
  choice: les enfants des fils de Noé
  rationale: Conserve la formulation généalogique précise plutôt que de la réduire à «descendants de Noé».
