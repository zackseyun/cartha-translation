  yaml_path: translation/extra_canonical/jubilees/010/024.yaml
  text: And the Lord sent a mighty wind against the tower, and it threw it down upon the earth.
translation:
  language: fr
  text: Le Seigneur envoya un vent puissant contre la tour, et le vent la renversa à terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ (nafāsa ʿabiya)
  choice: un vent puissant
  rationale: Rend directement le nom « vent » et l’adjectif « grand/puissant » dans un français naturel et digne.
- source_word: ውስተ፡ ማኅፈድ (westa maḥfed)
  choice: contre la tour
  rationale: Dans ce contexte de destruction, « contre » exprime naturellement le mouvement hostile du vent dirigé vers la tour; « dans la tour » serait trop littéral et moins clair en français.
