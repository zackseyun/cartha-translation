  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: fr
  text: Car il l’aimait plus que tous ses fils. Et Noé s’endormit avec ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ
  choice: il
  rationale: Le pronom indépendant à l’accusatif signifie « lui »; en français, avec « aimer », il se rend naturellement par le pronom objet « l’ ». Son référent reste implicite comme dans le texte guèze.
- source_word: ያፈቅር
  choice: aimait
  rationale: Le verbe exprime ici l’amour ou l’affection; l’imparfait convient au cadre narratif passé.
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: plus que tous ses fils
  rationale: Cette formulation restitue directement le comparatif renforcé et l’ensemble des fils.
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: Puis Noé reposa avec ses ancêtres
  rationale: L’expression funéraire idiomatique signifie que Noé mourut et rejoignit ses prédécesseurs. « Reposa avec ses ancêtres » conserve l’image tout en étant intelligible en français moderne.
theological_decisions:
- issue: Référent du pronom ኪያሁ
  choice: Maintenir le pronom « l’ » sans nommer son référent
  alternative: Expliciter « Sem » d’après le contexte antérieur
  rationale: Le verset transmis porte un pronom, non un nom propre. Garder cette anaphore préserve la formulation et l’ambiguïté formelles du texte source sans introduire « Arpaxad », que le guèze ne dit pas.
- issue: Expression de la mort de Noé
  choice: « reposa avec ses ancêtres »
  alternative: « mourut » ou « s’endormit avec ses pères »
  rationale: Le choix conserve la métaphore traditionnelle de la mort sans laisser entendre un sommeil ordinaire ni employer le masculin générique « pères » au sens étroit.
translation_notes:
  register: Français international moderne, sobre et narratif. La tournure « reposa avec ses ancêtres » garde la dignité et l’image funéraire de l’original; le référent du pronom n’est pas ajouté au texte.
