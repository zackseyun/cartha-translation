  text: But bless me and my sons, that we may increase and multiply and fill the earth.
translation:
  language: fr
  text: Mais bénis-moi, ainsi que mes fils, afin que nous croissions, nous multipliions et remplissions la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: « bénir » (le lemme guèze du verset cible n’apparaît pas dans l’extrait fourni)
  choice: bénis-moi
  rationale: L’impératif français restitue directement la demande adressée à Dieu dans la couche de consultation anglaise.
- source_word: « croître / multiplier / remplir » (le texte guèze du verset cible n’apparaît pas dans l’extrait fourni)
  choice: croissions, nous multipliions et remplissions
  rationale: La triple formulation est conservée, avec des subjonctifs naturels après « afin que ».
theological_decisions:
