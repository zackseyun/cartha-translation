lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: lieu du jugement
  rationale: Rend directement le syntagme nominal fragmentaire sans ajouter de verbe absent du texte guèze.
- source_word: ወለአሐዱ፡ እምኔነ
  choice: Et l’un de nous
  rationale: Reproduit simplement la coordination et la désignation indéfinie du locuteur.
- source_word: ንምሀር፡ ለኖኅ
  choice: Enseignons à Noé
  rationale: Le jussif inclusif est rendu naturellement par l’impératif français à la première personne du pluriel.
- source_word: ኵሎ፡ ፈውሶሙ
  choice: tous les remèdes contre leurs maux
  rationale: Le possessif guèze est ambigu hors contexte; cette formulation française conserve l’idée de remèdes qui leur correspondent sans suggérer que les agents mauvais possèdent ces remèdes.
- source_word: እስመ
  choice: car
  rationale: Rend la conjonction causale qui ouvre une proposition poursuivie au verset suivant.
theological_decisions:
- issue: Nature du « lieu du jugement »
  choice: Conserver le fragment nominal « lieu du jugement »
  alternative: « Et le lieu du jugement fut établi »
  rationale: Aucun verbe correspondant à « fut établi » n’apparaît dans le segment guèze fourni; compléter la phrase imposerait une interprétation non attestée.
- issue: Référent des remèdes
  choice: « les remèdes contre leurs maux »
  alternative: « tous leurs remèdes »
  rationale: Le contexte immédiat concerne les afflictions causées par les esprits; la formulation retenue reste intelligible tout en évitant de résoudre plus précisément que nécessaire la relation exprimée par le suffixe.
translation_notes:
  register: Français international moderne, sobre et digne. Le caractère fragmentaire du début et de la fin est maintenu; aucun verbe n’est ajouté à « lieu du jugement ».
