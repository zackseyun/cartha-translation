base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/013.yaml
  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: fr
  text: Nous avons fait connaître à Noé tous leurs remèdes, afin qu’ils soient guéris par les plantes de la terre. Noé mit par écrit dans un livre tout ce que nous lui avions enseigné, toutes sortes de remèdes curatifs, et les esprits furent retenus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገርናሁ
  choice: Nous avons indiqué à Noé
  rationale: Le verbe signifie ici « dire, faire connaître »; « indiqué » rend naturellement la transmission d’un savoir pratique.
- source_word: አስሕተትሙ
  choice: tous leurs remèdes
  rationale: Le terme renvoie aux moyens de soin ou médicaments; le possessif pluriel est conservé sans préciser un référent que le verset isolé laisse implicite.
- source_word: ዕፀወ፡ ምድር
  choice: les plantes de la terre
  rationale: Rend le sens concret de la végétation terrestre employée pour guérir, sans moderniser en « médicaments ».
- source_word: ትዝምደ፡ ፈውሳት
  choice: toutes sortes de remèdes curatifs
  rationale: Exprime l’idée des diverses catégories ou compositions de traitements consignées par Noé.
- source_word: ተዐጸዉ፡ መናፍስት
  choice: les esprits furent contenus
  rationale: Le passif évoque des esprits retenus, enfermés ou empêchés d’agir; « contenus » préserve cette largeur sémantique.
theological_decisions:
- issue: Qualification morale des esprits
  choice: les esprits
  alternative: les esprits mauvais
  rationale: Le texte fourni dit simplement « les esprits »; l’adjectif « mauvais » ne doit pas être ajouté à partir du contexte ou d’une tradition interprétative.
- issue: Portée de la restriction imposée aux esprits
  choice: furent contenus
  alternative: furent empêchés de poursuivre les fils de Noé
  rationale: Le complément précisant contre qui ou quoi ils sont retenus n’apparaît pas dans le texte source fourni; la traduction n’en ajoute donc aucun.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit de près la progression du guèze tout en restant naturelle. Le référent de « leurs » et la nature exacte de la contrainte imposée aux esprits demeurent volontairement non explicités.
