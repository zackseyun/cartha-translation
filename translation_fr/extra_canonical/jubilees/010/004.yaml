base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/004.yaml
  text: for your grace has been great toward me, and great is your mercy toward my life—let your grace be magnified over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.
translation:
  language: fr
  text: Car ta grâce envers moi a été grande, et grande est ta miséricorde pour ma vie. Que ta grâce soit magnifiée[a] sur mes fils, et ne laisse pas les esprits mauvais dominer sur eux, de peur qu’ils ne les fassent disparaître de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que ta grâce devienne grande ».'
    reason: Cette variante rend plus littéralement le même radical que dans « ta grâce […] a été grande »; « soit magnifiée » en exprime naturellement la valeur jussive.
lexical_decisions:
- source_word: ʿ-b-y (racine du verbe correspondant à « être grand »)
  choice: a été grande / soit magnifiée
