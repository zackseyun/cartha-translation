  to: Dix-neuf jubilés, deux semaines d’années et cinq ans. Durant sa vie sur terre, il surpassa les fils des hommes[a], à l’exception d’Hénoch, en raison de la justice dans laquelle il était parfait. En effet, Hénoch fut établi comme témoignage[b] pour les générations du monde, afin de relater toutes les œuvres de génération en génération jusqu’au jour du jugement.
