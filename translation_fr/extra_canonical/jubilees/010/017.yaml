  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
translation:
  language: fr
  text: Dix-neuf jubilés, deux semaines d’années et cinq ans. Durant sa vie sur terre, il surpassa les fils des hommes[a], à l’exception d’Hénoch, en raison de la justice dans laquelle il était parfait. En effet, Hénoch fut établi comme témoignage[b] pour les générations du monde, afin de relater toutes les œuvres de génération en génération jusqu’au jour du jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation est particulièrement dense. Dans ce contexte chronologique, elle peut signifier qu’il surpassa les autres humains par la durée de sa vie, Hénoch excepté.
    reason: alternative_reading
  - marker: b
    text: Le terme peut aussi se rendre, selon la fonction envisagée, par « témoin ».
    reason: lexical_ambiguity
lexical_decisions:
- source_word: እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ
  choice: Dix-neuf jubilés, deux semaines d’années et cinq ans
  rationale: Conserve le système chronologique propre aux Jubilés et explicite que les « semaines » sont des périodes d’années.
- source_word: ዘአፈድፈደ፡ ሐዩዎ፡ ዲበ፡ ምድር
  choice: Durant sa vie sur terre, il surpassa
  rationale: Rend le comparatif du texte sans préciser dans le corps du verset si la supériorité porte exclusivement sur la longévité, point que la formulation guèze laisse dense.
- source_word: ውሉደ፡ ሰብእ
  choice: les fils des hommes
  rationale: Maintient l’expression anthropologique traditionnelle du texte source dans un français intelligible et digne.
- source_word: ስምዕ
  choice: témoin
  rationale: Le terme renvoie au champ lexical du témoignage; « témoin » produit ici une syntaxe française naturelle tout en exprimant la fonction attribuée à Hénoch.
- source_word: ግብረ
  choice: les œuvres
  rationale: Rend le sens large d’actes ou d’actions sans limiter le passage aux seuls méfaits.
theological_decisions:
- issue: Nature de la supériorité sur les autres humains
  choice: Le texte principal dit simplement qu’il « surpassa » les fils des hommes.
  alternative: Préciser qu’il les surpassa par la durée de sa vie.
  rationale: Le contexte chronologique favorise une référence à la longévité, mais la construction transmise est compacte; la traduction conserve donc l’ambiguïté plutôt que de l’imposer au lecteur.
- issue: Fonction d’Hénoch
  choice: Hénoch est « établi comme témoin » pour les générations.
  alternative: Hénoch est « établi comme témoignage » ou « signe ».
  rationale: « Témoin » correspond au champ sémantique de ስምዕ et s’accorde avec l’activité de raconter les œuvres; « signe » serait lexicalement moins exact.
translation_notes:
  register: Français international moderne, fluide et digne. Les termes propres au cadre chronologique de l’œuvre (« jubilés », « semaines d’années ») sont conservés. La syntaxe reste accessible sans effacer l’ambiguïté du passage sur la longévité.
