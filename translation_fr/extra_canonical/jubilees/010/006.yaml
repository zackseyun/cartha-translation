  yaml_path: translation/extra_canonical/jubilees/010/006.yaml
  text: And you know how your Watchers, the fathers of these spirits, acted in my days. As for these spirits that are living, imprison them and hold them fast in the place of judgment, and do not let them bring corruption upon the sons of your servant, O my God, for these are malignant and were created in order to destroy.
translation:
  language: fr
  text: Et tu sais comment tes Veilleurs, les pères de ces esprits, ont agi de mon temps. Quant aux esprits qui sont encore en vie, emprisonne-les et retiens-les fermement dans le lieu du jugement. Ne les laisse pas semer la corruption parmi les fils de ton serviteur, ô mon Dieu, car ils sont malfaisants et ont été créés pour détruire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Watchers
  choice: Veilleurs
  rationale: Terme traditionnel et intelligible pour désigner les êtres angéliques appelés « Watchers » dans la littérature hénochique; la majuscule signale un groupe déterminé.
- source_word: spirits that are living
  choice: esprits qui sont encore en vie
