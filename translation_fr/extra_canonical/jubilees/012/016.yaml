  text: two weeks of years[a]. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains. And he was there alone, sitting and observing, and a word came into his heart, and he said[a], “All the signs of the stars and their signs...
translation:
  language: fr
  text: 'deux semaines d’années.[a] La cinquième année de la sixième semaine, Abram resta éveillé pendant la nuit, au début[b] du septième mois, pour observer les étoiles depuis le soir jusqu’à l’aube, afin de voir ce que serait l’année quant aux pluies. Il était là seul, assis à observer. Alors une parole lui vint au cœur, et il dit : « Tous les signes des étoiles et leurs signes… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, une « semaine » désigne une période de sept ans. Le livre des Jubilés compte régulièrement le temps en jubilés, en semaines d’années et en années.
    reason: cultural_note
  - marker: b
    text: L’expression peut désigner plus précisément l’apparition de la lune qui marque le commencement du septième mois, c’est-à-dire la nouvelle lune.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: semaines d’années
  rationale: Expression chronologique désignant des périodes de sept ans; la formulation conserve l’image du texte source.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: au début du septième mois
  rationale: ሠርቀ ወርኅ peut évoquer le lever ou l’apparition du mois, donc plus précisément le commencement marqué par la nouvelle lune; le texte principal retient une formulation naturelle sans éliminer cette nuance, signalée en note.
- source_word: ከመ፡ ያበይነ፡ ከዋክብተ
  choice: pour observer les étoiles
  rationale: Le contexte décrit Abram veillant et examinant les étoiles; « observer » restitue naturellement cette activité suivie.
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: ce que serait l’année quant aux pluies
  rationale: Rend littéralement l’idée de déterminer le comportement ou le caractère de l’année sous le rapport des précipitations, sans ajouter une prédiction météorologique plus précise que le texte.
- source_word: መጽአ፡ ውስተ፡ ልቡ፡ ቃል
  choice: une parole lui vint au cœur
  rationale: Conserve l’expression intérieure du texte et son ambiguïté quant à l’origine de la parole.
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  choice: Tous les signes des étoiles et leurs signes…
  rationale: Suit la répétition énigmatique de la source au lieu de la lisser; les points de suspension indiquent que la phrase se poursuit au verset suivant.
theological_decisions:
- issue: Origine de la parole venue au cœur d’Abram
  choice: une parole lui vint au cœur
  alternative: Dieu lui parla dans son cœur
  rationale: La source ne nomme pas explicitement Dieu à cet endroit; la traduction préserve cette indétermination.
- issue: Nature de l’observation astrale d’Abram
  choice: observer les étoiles… afin de voir ce que serait l’année quant aux pluies
  alternative: pratiquer l’astrologie pour prévoir les pluies
  rationale: La traduction décrit l’action sans lui imposer une qualification théologique ou technique absente de la formulation source.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe chronologique a été légèrement fluidifiée. Les marqueurs [a] et [b] sont distincts et placés à leurs points d’ancrage respectifs. La répétition finale, difficile mais présente dans le guèze, est volontairement conservée.
