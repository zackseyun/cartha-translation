base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/025.yaml
  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
translation:
  language: fr
  text: 'Le Seigneur Dieu [dit] : « Ouvre-lui la bouche et les oreilles, afin qu’il entende et qu’il parle avec sa bouche dans la langue qui a été révélée, car elle a disparu de la bouche de tous les humains depuis le jour du renversement. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière expression fait probablement allusion à la perte de la langue originelle après le jugement associé à Babel. Le guèze emploie une formule condensée : « depuis le jour du renversement ».'
    reason: cross_reference
lexical_decisions:
- source_word: ፍታሕ
  choice: Ouvre
  rationale: Impératif singulier, conformément à la forme guèze, plutôt qu’un jussif « que… ouvre ».
- source_word: በልሳን፡ እንተ፡ ታስተርኢ
  choice: dans la langue qui a été révélée
  rationale: Rend la proposition relative et sa valeur accomplie sans préciser davantage l’identité de cette langue.
- source_word: አዐረፈ
  choice: a disparu
  rationale: Dans ce contexte, le verbe indique que la langue a cessé d’être employée parmi les humains; « a disparu » est naturel en français tout en gardant ce sens.
- source_word: ድቀት
  choice: renversement
  rationale: Conserve le caractère condensé et relativement indéterminé du terme, sans identifier explicitement l’événement à Babel dans le corps du texte.
theological_decisions:
- issue: Sujet parlant et verbe introducteur absents du texte fourni
  choice: Le Seigneur Dieu [dit]
  alternative: Que le Seigneur Dieu ouvre
  rationale: L’impératif ፍታሕ appelle un destinataire singulier; l’ajout entre crochets rend explicite le verbe introducteur requis par le contexte tout en signalant qu’il n’apparaît pas dans le texte guèze fourni.
- issue: Identification du « jour du renversement »
  choice: Maintien de la formule dans le texte, avec explication prudente en note
  alternative: depuis la confusion de Babel
  rationale: Le texte ne nomme pas Babel; la traduction préserve donc l’allusion et évite de résoudre dans le corps du verset une référence qui reste implicite.
translation_notes:
  register: Français moderne, international et digne. La répétition « parle de sa bouche » est conservée parce qu’elle reflète celle du texte source. Les guillemets signalent la parole directe, et les crochets indiquent un verbe introducteur suppléé d’après le contexte.
