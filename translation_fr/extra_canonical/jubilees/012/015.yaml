  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: fr
  text: avant son père Térah. Ils l’enterrèrent à Our des Chaldéens. Térah quitta Our des Chaldéens, lui et ses fils, pour se rendre au pays du Liban et au pays de Canaan. Il s’établit au pays de Harrân, et Abram habita avec Térah, son père, à Harrân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቀበርዎ
  choice: On l’enterra
  rationale: Le verbe signifie « enterrer ». Le sujet implicite est indéterminé ou contextuel; « on » le préserve naturellement en français, tandis que le pronom objet singulier est rendu par « l’ ».
- source_word: ወወፅአ
  choice: quitta
  rationale: Littéralement « sortit de ». Dans ce récit de migration, « quitta » exprime naturellement le départ depuis Our sans modifier le sens.
- source_word: ይምጽኡ
  choice: pour se rendre
  rationale: La construction exprime le but du départ, littéralement « afin qu’ils viennent ». « Pour se rendre » est idiomatique en français et convient à une destination géographique.
- source_word: ምድረ፡ ሊባኖስ
  choice: au pays du Liban
  rationale: Rend explicitement ምድር, « terre/pays », tout en conservant le toponyme.
- source_word: ወኀደረ
  choice: Il s’établit
  rationale: Le verbe peut évoquer le fait de demeurer ou de séjourner. Ici, « s’établit » rend clairement l’installation de Térah à Harrân.
- source_word: ወኀደረ፡ አብራም
  choice: Abram habita
  rationale: Pour Abram, le même verbe est rendu par « habita », puisque la proposition précise qu’il demeurait avec son père.
- source_word: ካራን
  choice: Harrân
  rationale: Forme française usuelle du nom biblique, avec accent circonflexe pour guider la prononciation.
theological_decisions:
- issue: Référent du pronom dans « on l’enterra »
  choice: Conserver le pronom masculin singulier sans nommer le défunt
  alternative: Expliciter le nom du personnage à partir du contexte précédent
  rationale: Le verset commence au milieu d’une phrase et la source ne répète pas ici le nom du défunt. L’expliciter importerait dans le verset une information extérieure à son texte immédiat.
- issue: Sujet de l’installation à Harrân
  choice: Rapporter « Il s’établit » à Térah
  alternative: Employer un pluriel collectif, « ils s’établirent »
  rationale: La forme verbale guèze est singulière et la proposition suivante distingue Abram, qui habite avec son père. Le singulier reflète donc au mieux la syntaxe transmise.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’ouverture fragmentaire du verset (« avant Térah, son père »), due au découpage du chapitre, ainsi que l’enchaînement géographique de la source. Les répétitions utiles des noms propres sont maintenues pour éviter toute ambiguïté.
