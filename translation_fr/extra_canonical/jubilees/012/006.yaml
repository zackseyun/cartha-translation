review_pass:
  verdict: revise
  source_fidelity: Le début dépend bien de la phrase précédente et la restitution entre crochets évite d’ajouter « honte ». La dernière proposition exprime la contrainte de servir ou d’obéir. Toutefois, le pronom singulier « le » rend son antécédent incertain et peut faire croire que Térah est contraint de servir un seul objet; le texte vise plus naturellement le peuple mentionné.
  naturalness: Le français est globalement clair et d’un registre approprié. « Que puis-je faire face à un peuple » est moins fidèle à la tournure interrogative que « Que puis-je faire pour un peuple », et « m’a obligé à le servir » est moins naturel et moins précis que « m’a contraint à le servir ».
  terminology: « fabriquer », « adorer » et « tromperie » conviennent au contexte idolâtre. « Confusion du cœur » est intelligible, mais « égarement du cœur » rend plus naturellement la désorientation intérieure sans réduire le cœur à l’intellect.
  issues:
  - severity: medium
    issue: Référent ambigu de « le servir »
    rationale: Après les idoles au pluriel et avant « un peuple », le pronom singulier « le » est ambigu. La reprise explicite de « ce peuple » indique que le service/obéissance est imposé par le peuple, conformément à la construction de la phrase.
  - severity: low
    issue: « face à un peuple » reformule inutilement la relation « pour/avec un peuple »
    rationale: « Que puis-je faire pour un peuple » conserve plus directement la question de Térah et son dilemme à l’égard du peuple.
