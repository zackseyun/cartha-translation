  yaml_path: translation/extra_canonical/jubilees/012/006.yaml
  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
translation:
  language: fr
  text: '« [Ils sont une tromperie][a] pour ceux qui les fabriquent, et un égarement du cœur pour ceux qui les adorent. Ne les adore pas. » Son père lui répondit : « Moi aussi, je le sais, mon fils. Mais que puis-je faire pour un peuple qui m’a contraint à le servir[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots entre crochets sont sous-entendus d’après le verset précédent.
    reason: Le texte guèze commence par « pour ceux qui les fabriquent » et dépend syntaxiquement de la proposition précédente.
  - marker: b
    text: 'Ou : « qui m’a contraint à obéir à ce peuple ».'
    reason: Le verbe guèze peut exprimer le service, la soumission ou l’obéissance; la note explicite le référent du pronom.
lexical_decisions:
- source_word: ይገብርዎሙ
  choice: les fabriquent
  rationale: Le verbe exprime ici l’action de faire ou fabriquer les idoles.
- source_word: ከሕተት፡ ልብ
  choice: une confusion du cœur
  rationale: Rend directement l’expression guèze sans réduire le « cœur » à la seule pensée ou aux émotions.
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: les adorent / Ne les adore pas
  rationale: « Adorer » est le terme français naturel pour le culte rendu aux idoles et conserve la répétition de la source.
- source_word: እትአዘዝ
  choice: m’a obligé à le servir
  rationale: Le verbe renvoie à l’obéissance, la soumission ou le service; dans ce contexte, la forme causative indique que le peuple a contraint le père à se mettre à son service.
theological_decisions:
- issue: Complément implicite au début du verset
  choice: '[Ils sont une tromperie]'
  alternative: Commencer par « pour ceux qui les fabriquent » sans proposition principale
  rationale: Le début prolonge syntaxiquement la pensée du verset précédent. Les crochets signalent honnêtement le complément restitué, sans introduire la notion non attestée de « honte ».
- issue: Nature du service imposé au père
  choice: « un peuple qui m’a obligé à le servir »
  alternative: « un peuple qui m’a contraint à lui obéir »
  rationale: Le choix principal suit le sens contextuel de service tout en conservant en note la nuance possible de soumission ou d’obéissance.
translation_notes:
  register: Français international moderne, naturel et digne. La structure du dialogue et la répétition du verbe « adorer » sont conservées; les crochets rendent visible le seul complément fourni par le contexte précédent.
