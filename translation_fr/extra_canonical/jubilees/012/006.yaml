revisions:
- from: '« [Ils sont une tromperie][a] pour ceux qui les fabriquent, et une confusion du cœur pour ceux qui les adorent. Ne les adore pas. » Son père lui répondit : « Moi aussi, je le sais, mon fils. Mais que puis-je faire face à un peuple qui m’a obligé à le servir[b] ? »'
  to: '« [Ils sont une tromperie][a] pour ceux qui les fabriquent, et un égarement du cœur pour ceux qui les adorent. Ne les adore pas. » Son père lui répondit : « Moi aussi, je le sais, mon fils. Mais que puis-je faire pour un peuple qui m’a contraint à le servir[b] ? »'
  rationale: La révision conserve la restitution contextuelle signalée par des crochets et la portée non confessionnelle du passage. Elle améliore la formulation française de l’égarement intérieur et clarifie que la contrainte concerne le service ou l’obéissance exigé par le peuple, sans trancher au-delà de ce que permet le verbe guèze.
