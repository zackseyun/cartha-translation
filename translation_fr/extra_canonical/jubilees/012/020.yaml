- from: 'Délivre-moi du pouvoir des esprits mauvais qui dominent les pensées du cœur humain, et ne les laisse pas me détourner de toi, mon Dieu. Affermis-moi, moi et ma descendance, pour toujours, afin que nous ne nous égarions plus, dès maintenant et à jamais.» Puis il dit:'
