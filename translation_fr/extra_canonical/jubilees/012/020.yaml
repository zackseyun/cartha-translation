  yaml_path: translation/extra_canonical/jubilees/012/020.yaml
  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
translation:
  language: fr
  text: 'Délivre-moi du pouvoir des esprits mauvais qui dominent les pensées du cœur humain, et ne les laisse pas me détourner de toi, mon Dieu. Affermis-moi, moi et ma descendance, pour toujours, afin que nous ne nous égarions pas, dès maintenant et à jamais. » Et il dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእዴ
  choice: du pouvoir
  rationale: Littéralement «de la main»; en français courant, «du pouvoir» exprime naturellement l’idée d’emprise ou de domination.
- source_word: መናፍስት እኩያን
  choice: les esprits mauvais
  rationale: Rend directement le syntagme guèze sans ajouter de qualification doctrinale.
- source_word: ይስልጡ
  choice: dominent
  rationale: Exprime l’autorité ou l’emprise exercée par ces esprits.
- source_word: ውስተ ሕሊና ልበ ሰብእ
  choice: les pensées du cœur humain
  rationale: Conserve l’anthropologie du «cœur» tout en rendant ሕሊና par «pensées» dans un français intelligible.
- source_word: አይስሕቱኒ እምድኅሬከ
  choice: ne les laisse pas me détourner de toi
  rationale: Le verbe exprime l’égarement; la tournure française restitue l’idée de quitter la suite de Dieu sans surcharger le texte.
- source_word: ወትረሰየኒ
  choice: Affermis-moi
  rationale: Rend l’idée d’établir solidement ou de rendre ferme.
- source_word: ኪያየ ወዘርእየ
  choice: moi et ma descendance
  rationale: ኪያየ est le pronom accusatif indépendant «moi», en apposition au suffixe objet du verbe; il ne signifie pas «devant toi».
- source_word: ዘርእየ
  choice: ma descendance
  rationale: Dans ce contexte généalogique, «descendance» est plus naturel et précis que le littéral «semence».
- source_word: ወይቤ
  choice: 'Puis il dit:'
  rationale: Conserve la formule narrative finale qui introduit la suite du discours.
theological_decisions:
- issue: Action des esprits mauvais sur l’intériorité humaine
  choice: «qui dominent les pensées du cœur humain»
  alternative: «qui règnent sur la pensée du cœur de l’homme»
  rationale: La traduction garde l’affirmation forte du texte sur leur emprise, sans l’atténuer ni développer une doctrine de la possession.
- issue: Portée de l’affermissement demandé
  choice: «Affermis-moi, moi et ma descendance, pour toujours»
  alternative: «Établis-moi et ma descendance devant toi pour toujours»
  rationale: Le guèze ኪያየ signifie «moi» et introduit l’objet composé; le texte ne contient pas «devant toi».
- issue: Sujet implicite de l’égarement final
  choice: «afin que nous ne nous égarions plus»
  alternative: «afin que je ne m’égare plus»
  rationale: La demande englobe immédiatement le locuteur et sa descendance; le pluriel français rend cette extension, conformément à la consultation anglaise, sans résoudre davantage la relation grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire conserve les images bibliques du cœur et de la descendance, tandis que «du pouvoir» explicite idiomatiquement l’expression «de la main». La phrase finale demeure ouverte afin de s’enchaîner au verset suivant.
