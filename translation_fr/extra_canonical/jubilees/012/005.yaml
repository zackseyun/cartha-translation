  yaml_path: translation/extra_canonical/jubilees/012/005.yaml
  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
translation:
  language: fr
  text: Il n’y a pas d’esprit en eux, car ils sont l’œuvre de mains. Vous les portez sur vos épaules, et d’eux ne vous vient aucune aide, sinon une grande honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈስ
  choice: esprit
  rationale: Rend directement le terme guèze désignant ici le souffle ou l’esprit absent des idoles, sans préciser davantage une ambiguïté réelle.
- source_word: ግብረ፡ እደው
  choice: l’œuvre de mains humaines
  rationale: Expression française naturelle qui conserve l’idée littérale d’un ouvrage fabriqué par des mains; « humaines » explicite seulement le référent idiomatique.
- source_word: መታክፍቲሆሙ
  choice: vos épaules
  rationale: Sens anatomique direct du terme dans la proposition où les destinataires portent les idoles.
- source_word: ረድኤት
  choice: aide
  rationale: Équivalent courant et précis pour le secours ou l’assistance que les idoles sont incapables de fournir.
- source_word: ዘእንበለ፡ ሐሳር፡ ዐቢይ
  choice: mais seulement une grande honte
  rationale: Rend la tournure exceptive et le résultat négatif sans ajouter l’idée non attestée d’un fardeau.
theological_decisions:
- issue: Nature de l’absence de « መንፈስ » dans les idoles
  choice: « Il n’y a pas d’esprit en eux »
  alternative: « Ils n’ont aucun souffle de vie »
  rationale: La formulation retenue préserve l’étendue sémantique de መንፈስ et évite de trancher entre esprit, souffle et vie.
- issue: Relation finale entre absence d’aide et honte
  choice: « et ils ne peuvent vous apporter aucune aide, mais seulement une grande honte »
  alternative: « et de leur part vous ne recevez aucune aide, si ce n’est une grande honte »
  rationale: La formulation française exprime naturellement le contraste du texte tout en maintenant que le seul résultat associé aux idoles est la honte.
translation_notes:
  register: Français moderne, international et digne. Syntaxe claire destinée à la lecture publique. Aucun ajout correspondant à « ils sont un fardeau pour vous », absent du texte guèze.
