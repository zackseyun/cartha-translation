  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: fr
  text: 'La parole du Seigneur lui parvint par ma main : « Quitte ton pays, ta parenté et la maison de ton père, et va vers le pays que je te montrerai. Je ferai de toi un peuple grand et nombreux, et je te bénirai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር
  choice: La parole du Seigneur
  rationale: Rend directement l’expression guèze désignant la parole divine, dans un registre biblique clair et naturel.
- source_word: በእዴየ
  choice: par ma main
  rationale: Conserve l’image littérale de la médiation par la « main », plutôt que de l’interpréter comme « par mon intermédiaire ».
- source_word: ፃእ
  choice: Quitte
  rationale: Dans ce contexte de départ hors du pays, « quitte » exprime naturellement l’impératif « sors » sans perdre sa force.
- source_word: ትዝምድከ
  choice: ta parenté
  rationale: Terme collectif adapté aux liens de famille ou de clan, distinct de la maison paternelle mentionnée ensuite.
- source_word: ሕዝበ፡ ዐቢየ፡ ወብዙኃ
  choice: un peuple grand et nombreux
  rationale: 'Préserve les deux qualificatifs du texte source : grandeur et multitude.'
theological_decisions:
- issue: Identité du locuteur dans « par ma main »
  choice: Maintien de la première personne sans explicitation
  alternative: « par l’intermédiaire de l’ange » ou identification explicite du narrateur
  rationale: Le verset présente une médiation à la première personne, mais l’extrait seul ne justifie pas d’identifier davantage le locuteur.
- issue: Objet de la promesse
  choice: « un peuple grand et nombreux »
  alternative: « une grande et nombreuse nation »
  rationale: Le guèze emploie un terme pouvant désigner un peuple; « peuple » préserve cette portée sans imposer la notion politique moderne de nation.
translation_notes:
  register: Français international moderne, digne et accessible. Ponctuation réorganisée pour la fluidité française; la coordination du discours divin et l’image « par ma main » sont conservées.
