lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: Il raconta cela
  rationale: Rend naturellement le démonstratif « cela » et le verbe « raconter/dire », sans surcharger le français par « cette affaire ».
- source_word: ለክልኤ፡ አሐዊሁ
  choice: à ses deux frères
  rationale: Conserve explicitement le nombre deux et la relation fraternelle.
- source_word: ወተምዑ፡ ላዕሌሁ
  choice: Ils se mirent en colère contre lui
  rationale: Exprime la réaction hostile indiquée par le verbe et la préposition, dans un français courant et digne.
- source_word: ወአርመሙ
  choice: et gardèrent le silence
  rationale: Le verbe est à la troisième personne du pluriel; le sujet reste donc les deux frères.
- source_word: በሱባዔ፡ ካልእ
  choice: durant la deuxième semaine d’années
  rationale: « Semaine d’années » explicite l’unité chronologique jubilaire sans la confondre avec une semaine de jours.
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ
  choice: Abram prit une femme pour lui
  rationale: Suit de près la construction source tout en restant idiomatique en français.
- source_word: ወስማ፡ ሶራ
  choice: Elle s’appelait Saraï
  rationale: Formulation française naturelle pour « et son nom était »; « Saraï » suit la forme biblique française usuelle du nom à ce stade du récit.
- source_word: ወሰተ
  choice: et était fille de…
  rationale: Le segment source s’interrompt après l’amorce de la filiation; les points de suspension préservent cette coupure sans compléter conjecturalement le texte.
