  text: so that they worship them and praise them. Be silent, my son, lest they kill you.” And he spoke these words to his two brothers, and they were angry with him, and he remained silent.
translation:
  language: fr
  text: « afin qu’ils les adorent et les louent. Garde le silence, mon fils, de peur qu’ils ne te tuent. » Il adressa[a] ces paroles à ses deux frères ; ils se mirent en colère contre lui, et il garda le silence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il dit ces paroles ».'
    reason: Le verbe peut se rendre plus littéralement par « dire » ; « adressa » explicite naturellement en français la présence des destinataires.
lexical_decisions:
- source_word: ያምልክዎሙ (yāmləkwomu)
  choice: qu’ils les adorent
  rationale: Le verbe exprime le culte rendu aux objets évoqués ; le pronom pluriel est conservé.
- source_word: ይስብሕዎሙ (yəsabbəḥwomu)
  choice: et les louent
  rationale: « Louer » restitue directement l’idée de célébration ou de glorification, avec le même antécédent pluriel.
- source_word: አርምም (ʾarməm)
  choice: Garde le silence
  rationale: Impératif naturel en français, plus idiomatique ici que « sois silencieux ».
- source_word: ከመ፡ አይቅትሉከ (kama ʾayqətəluka)
  choice: de peur qu’ils ne te tuent
  rationale: La tournure finale-préventive est rendue sans affirmer que la mise à mort aura nécessairement lieu.
- source_word: ዘንተ፡ ነገረ፡ ለ፪አኃዊሁ (zanta nagara la-kəlʾe ʾaḫāwihu)
  choice: Il adressa ces paroles à ses deux frères
  rationale: La formulation française exprime naturellement le verbe de parole, son contenu démonstratif et ses destinataires.
- source_word: ወተምዑ፡ ሎቱ (wa-tamʿu lotu)
  choice: ils se mirent en colère contre lui
  rationale: La construction marque une réaction hostile dirigée contre lui ; « se mirent en colère » convient au déroulement narratif.
- source_word: ወአርመመ (wa-ʾarmama)
  choice: et il garda le silence
  rationale: Le même champ lexical que l’impératif précédent est maintenu afin de montrer qu’il suit le conseil reçu.
theological_decisions:
- issue: Nature du culte rendu aux objets évoqués
  choice: « adorent » et « louent »
  alternative: « servent » et « célèbrent »
  rationale: Le vocabulaire cultuel fort du guèze est conservé sans atténuer la critique de l’idolâtrie ni préciser davantage l’identité des objets.
- issue: Force de la proposition « de peur qu’ils ne te tuent »
  choice: Risque ou conséquence redoutée
  alternative: « sinon ils te tueront »
  rationale: La construction source exprime une prévention ; la traduction évite de transformer le danger en prédiction certaine.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement convient au discours d’un père à son fils. La ponctuation française et les guillemets français clarifient la fin du discours direct. La fin du verset suit la continuation guèze signalée dans les données de révision, puisque le texte source affiché s’interrompt au milieu de la phrase après « et il dit ».
