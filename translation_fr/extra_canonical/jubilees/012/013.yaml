  text: And they arose in the night and wanted to rescue their gods from the midst of the fire. And Haran rushed
translation:
  language: fr
  text: Ils se levèrent pendant la nuit et voulurent sauver leurs dieux du milieu du feu. Harân s’élança[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Harân se précipita »; cette dernière proposition semble ouvrir le verset suivant.
    reason: Le sens du verbe admet plusieurs nuances de mouvement rapide, et la segmentation transmise rattache ici le début de l’action poursuivie au verset suivant.
lexical_decisions:
- source_word: ያድኅኑ
  choice: sauver
  rationale: Le verbe exprime ici l’action de délivrer ou d’arracher leurs dieux au feu; « sauver » est naturel et conserve l’ironie implicite sans l’accentuer.
- source_word: አማልክቲሆሙ
  choice: leurs dieux
  rationale: Rend directement le pluriel avec le suffixe possessif.
- source_word: ሰረረ
  choice: s’élança
  rationale: Le verbe évoque un mouvement vif, comme bondir ou se précipiter; « s’élança » convient au contexte et à la phrase laissée en suspens.
- source_word: አራን
  choice: Harân
  rationale: Il s’agit du personnage biblique habituellement nommé Harân en français; l’aspiration initiale est restituée selon l’identification traditionnelle du nom.
theological_decisions:
- issue: Désignation des idoles comme « dieux »
  choice: leurs dieux
  alternative: leurs idoles
  rationale: Le texte source dit littéralement « leurs dieux ». Cette formulation préserve l’ironie narrative et n’introduit pas une interprétation explicative absente du texte.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient le registre narratif. La proposition finale demeure inachevée, conformément au découpage fourni, avec une note signalant la probable continuité avec le verset suivant.
