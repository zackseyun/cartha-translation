  yaml_path: translation/extra_canonical/jubilees/012/026.yaml
  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: fr
  text: Et j’ouvris sa bouche, ses oreilles et ses lèvres, et je commençai à parler avec lui en hébreu, la langue de la création. Il prit les livres de ses pères, qui étaient écrits en hébreu, les recopia et, dès lors, commença à les étudier. Je lui fis connaître tout ce qu’il ne parvenait pas à comprendre, et il les étudia pendant les six mois de pluie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዕብራይስጥ
  choice: en hébreu
  rationale: Rend directement le nom de la langue indiqué par le guèze.
- source_word: በልሳነ፡ ፍጥረታት
  choice: la langue de la création
  rationale: Conserve l’expression traditionnelle et sa portée cosmologique sans l’expliciter ni la réduire à une simple langue originelle.
- source_word: ደገሞን
  choice: les recopia
  rationale: Dans le contexte de livres écrits en hébreu, le verbe exprime vraisemblablement l’action de reproduire ou copier les textes.
- source_word: ስድስተ፡ ወርኀ፡ ዘናም
  choice: les six mois de pluie
  rationale: Restitue naturellement la période saisonnière désignée littéralement par les six mois de pluie.
theological_decisions:
- issue: Nature de « la langue de la création »
  choice: Conserver la formulation « la langue de la création »
  alternative: « la langue originelle de la création » ou une identification explicative avec l’hébreu primordial
  rationale: Le texte associe l’hébreu à cette désignation, mais il convient de préserver la formulation propre du récit sans ajouter une doctrine linguistique plus précise.
- issue: Agent de la révélation et de l’enseignement
  choice: Maintenir la première personne « je » sans identifier le locuteur dans ce verset isolé
  alternative: Nommer l’ange ou le narrateur céleste
  rationale: L’identité dépend du contexte précédent et ne doit pas être importée dans le verset.
