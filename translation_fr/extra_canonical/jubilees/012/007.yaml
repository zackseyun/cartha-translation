  text: before them? And if I speak the truth to them, they will kill me, for their souls cling to them.
translation:
  language: fr
  text: devant eux ? Et si je leur dis la vérité[a], ils me tueront, car leur âme est attachée à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est juste » ; littéralement, « la justice » ou « la droiture ».'
    reason: Le terme guèze ጽድቀ peut aussi évoquer la justice ou la droiture ; la note maintient cette ambiguïté lexicale, tandis que « la vérité » convient au contexte de parole.
lexical_decisions:
- source_word: ጽድቀ
  choice: la vérité
  rationale: Le nom peut désigner la justice ou la droiture, mais, avec le verbe « dire » et dans ce contexte de dénonciation susceptible d’entraîner la mort, « dire la vérité » est l’expression française la plus naturelle.
- source_word: ተለውት፡ ነፍሶሙ፡ ኀቤሆሙ
  choice: ils leur sont attachés de toute leur âme
  rationale: Cette formulation naturelle conserve l’image de l’âme qui s’attache à eux, tout en rendant clairement en français l’intensité de cet attachement.
theological_decisions:
- issue: Sens de ጽድቀ dans l’expression relative à la parole
  choice: la vérité
  alternative: la justice / ce qui est juste
  rationale: Le contexte favorise une affirmation vraie adressée aux idolâtres, sans exclure la nuance morale de justice; celle-ci est signalée en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. Le fragment initial est maintenu comme la fin interrogative d’une phrase commencée au verset précédent. La dernière proposition est formulée idiomatiquement sans effacer l’image source de l’attachement de l’âme.
