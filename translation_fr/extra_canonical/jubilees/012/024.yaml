  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
translation:
  language: fr
  text: '« Je serai Dieu pour toi, pour ton fils, pour le fils de ton fils et pour toute ta descendance. Ne crains pas, dès maintenant et jusqu’à toutes les générations de la terre : je suis ton Dieu. » Et il me dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እከውንከ፡ … አምላከ፡
  choice: Je serai ton Dieu
  rationale: Rend la construction « je serai/deviendrai pour toi Dieu » en français naturel, sans ajouter de titre divin absent du texte.
- source_word: ወለወልድከ፡ ወለወልደ፡ ወልድከ፡
  choice: celui de ton fils, du fils de ton fils
  rationale: Conserve la progression généalogique explicite et le singulier du texte source.
- source_word: ወለኵሉ፡ ዘርእከ፡
  choice: et de toute ta descendance
  rationale: « Descendance » exprime naturellement le sens collectif de « semence/postérité » en français moderne.
- source_word: ኢትፍራህ፡ እምይእዜ፡
  choice: N’aie plus peur désormais
  rationale: Traduit l’interdiction de craindre à compter de maintenant dans une formulation française courante.
- source_word: ወይቤለኒ፡
  choice: Puis il me dit
  rationale: Le sujet n’est pas nommé dans la proposition source; le pronom évite d’ajouter « le Seigneur Dieu ».
theological_decisions:
- issue: Identité du locuteur dans la dernière proposition
  choice: il
  alternative: le Seigneur Dieu
  rationale: Le guèze ne donne ici qu’un sujet verbal de troisième personne; nommer explicitement le Seigneur Dieu constituerait un ajout interprétatif.
- issue: Portée temporelle de ወእስከ፡ ኵሉ፡ ትዝምደ፡ ምድር፡
  choice: pour toutes les générations de la terre
  alternative: pour toujours, à travers toutes les générations de la terre
  rationale: Le texte comporte « jusqu’à » et « toutes les générations », mais aucun terme indépendant signifiant « pour toujours »; la traduction évite donc cet ajout tout en produisant un français intelligible.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond au singulier de l’adresse. La répétition « ton Dieu… je suis ton Dieu » est maintenue, ainsi que la transition finale qui ouvre la parole suivante.
