  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
translation:
  language: fr
  text: 'Cette nuit-là, il dit : « Mon Dieu, Dieu Très-Haut, toi seul es Dieu pour moi. Tu as tout créé, et tout ce qui existe est l’œuvre de tes mains. Je t’ai choisi, toi et ta souveraineté[a]. Délivre-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction proposée d’après la forme transmise : « ta louange ». Le texte est incertain; une lecture corrigée signifie « ton autorité » ou « ta souveraineté ».'
    reason: La forme guèze fournie semble fautive ou corrompue, tandis que la lecture critique reconnue soutient « souveraineté »; la note préserve l’incertitude textuelle.
lexical_decisions:
- source_word: በይእቲ፡ ሌሊት፡
  choice: Cette nuit-là
  rationale: Rend naturellement l’expression temporelle littérale « en cette nuit-là ».
- source_word: አምላከ፡ ልዑል፡
  choice: Dieu Très-Haut
  rationale: Correspond au titre divin guèze tout en conservant sa dignité traditionnelle en français.
- source_word: አንተ፡ ባሕቲትከ፡ ሊተ፡ አምላክ፡
  choice: toi seul es Dieu pour moi
  rationale: Préserve à la fois l’exclusivité exprimée par « seul » et la relation personnelle marquée par « pour moi ».
- source_word: ኵሎ፡ ፈጠርከ፡
  choice: Tu as tout créé
  rationale: Rend avec concision la totalité de la création sans ajouter de catégorie absente du texte.
- source_word: ወግብረ፡ እደዊከ፡ ኵሉ፡ ኮነ፡ ዘሀሎ፡
  choice: et tout ce qui existe est l’œuvre de tes mains
  rationale: Reproduit l’image concrète des mains divines et la portée universelle de l’énoncé.
- source_word: ወመሰክንከ፡
  choice: et ta souveraineté[a]
  rationale: Le texte fourni paraît refléter une forme fautive ou corrompue; la lecture textuelle reconnue ወመኰንንከ désigne le gouvernement, l’autorité ou la souveraineté. « Souveraineté » convient au registre et au parallélisme avec le choix de Dieu.
- source_word: አድኅነኒ፡
  choice: Délivre-moi
  rationale: Rend directement la demande finale de salut ou de délivrance.
theological_decisions:
- issue: Portée de l’affirmation « toi seul es Dieu pour moi »
  choice: Conserver « pour moi »
  alternative: « toi seul es Dieu »
  rationale: Le pronom datif du texte source est significatif. Le conserver évite de transformer silencieusement une confession personnelle en formulation ontologique plus absolue.
- issue: Objet associé au choix de Dieu
  choice: « ta souveraineté »
  alternative: « ta louange »
  rationale: La lecture « souveraineté » repose sur la correction textuelle reconnue du terme transmis et s’accorde avec les anciennes traductions critiques; l’autre lecture est signalée en note afin de ne pas masquer la difficulté du texte fourni.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de la phrase guèze, mais la ponctuation et les reprises sont adaptées à un français naturel. Le marqueur de note [a] figure immédiatement après le terme concerné.
