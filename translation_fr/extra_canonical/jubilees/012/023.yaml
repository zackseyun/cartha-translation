  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: fr
  text: Je rendrai ton nom grand, et tu seras béni sur la terre ; en toi, toutes les nations de la terre seront bénies. Ceux qui te bénissent, je les bénirai, et ceux qui te maudissent, je les maudirai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐቢ፡ ስመከ
  choice: Je rendrai ton nom grand
  rationale: Rend directement le causatif « je ferai grand » appliqué au nom, dans une formulation française naturelle et digne.
- source_word: ትከውን፡ ቡሩከ
  choice: tu seras béni
  rationale: Conserve la valeur passive du guèze et évite de transformer la proposition en impératif ou en simple état de bonheur.
- source_word: ውስተ፡ ምድር
  choice: sur la terre
  rationale: Expression française idiomatique correspondant à la localisation terrestre indiquée par le texte.
- source_word: ይትባረኩ፡ ብከ
  choice: seront bénies en toi
  rationale: Maintient le passif et la relation exprimée par « en/par toi », sans trancher davantage la nuance médiatrice.
- source_word: አሕዛበ፡ ምድር
  choice: les nations de la terre
  rationale: « Nations » convient au sens collectif des peuples et correspond à l’usage biblique français courant.
- source_word: ይረግሙከ / እረግሞሙ
  choice: te maudissent / je les maudirai
  rationale: Reproduit la correspondance verbale nette entre l’action humaine et la réponse divine.
theological_decisions:
- issue: Sens de la bénédiction des nations « en toi »
  choice: Maintien de « en toi » avec un verbe passif
  alternative: « par toi, toutes les nations… se béniront » ou « seront bénies »
  rationale: Le texte guèze soutient naturellement le passif et la préposition « en/par » ; « en toi » préserve la formulation et son ouverture théologique sans imposer une interprétation réflexive.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme et les répétitions du texte source sont conservés ; la ponctuation clarifie les deux mouvements du verset.
