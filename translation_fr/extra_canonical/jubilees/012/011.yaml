lexical_decisions:
- source_word: ስሞ፡ ሎጥ
  choice: du nom de Lot
  rationale: Le groupe signifie littéralement « son nom, Lot » et achève la proposition commencée au verset précédent (« il l’appela… »). Cette formulation française conserve ce lien syntaxique sans créer une nouvelle phrase indépendante.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: prit femme
  rationale: L’expression signifie que Nahor prit une femme pour lui-même, c’est-à-dire qu’il se maria. « Prit femme » reste naturel dans le registre biblique tout en suivant de près la formulation source.
