translation:
  language: fr
  text: … du soleil et de la lune, tout est dans la main du Seigneur. Pourquoi est-ce que je cherche ? S’il le veut…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ
  choice: … du soleil et de la lune
  rationale: Les préfixes ለ- marquent ici une relation qui se poursuit depuis le contexte précédent; les points de suspension signalent que le segment commence au milieu de la phrase.
- source_word: ኵሉ፡ በእዴ፡ እግዚአብሔር
  choice: Tout est entre les mains du Seigneur
  rationale: Rend naturellement l’idée que la totalité évoquée relève du pouvoir ou de l’autorité du Seigneur, sans ajouter les « signes » ni les « étoiles » absents du segment.
- source_word: ለምንት፡ አነ፡ እትኃሠሥ
  choice: Pourquoi chercherais-je ?
  rationale: Le conditionnel français exprime naturellement la question délibérative du locuteur tout en conservant le sens de « chercher ».
- source_word: በእመ፡ ፈቀደ
  choice: S’il le veut…
  rationale: Traduit la proposition conditionnelle qui ouvre vraisemblablement la phrase suivante; les points de suspension préservent le caractère tronqué du verset.
theological_decisions:
- issue: Portée de la souveraineté divine
  choice: « Tout est entre les mains du Seigneur »
  alternative: « Tous sont dans la main du Seigneur »
  rationale: La formulation française choisie conserve l’affirmation générale de l’autorité divine sans déterminer artificiellement le référent exact de « tout ».
- issue: Rattachement de « s’il le veut »
  choice: En faire le début d’une nouvelle phrase inachevée
  alternative: 'Le rattacher à la question précédente : « Pourquoi continuerais-je à chercher, s’il le veut ? »'
  rationale: La segmentation et la syntaxe indiquent que la condition commence la suite plutôt qu’elle ne complète la question précédente; la ponctuation maintient cette tension textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Les points de suspension au début et à la fin rendent explicitement les deux frontières fragmentaires dues au découpage du verset.
