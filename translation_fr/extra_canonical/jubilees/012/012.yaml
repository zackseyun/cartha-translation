  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: fr
  text: Dans la soixantième année de la vie d’Abram, c’est-à-dire la quatrième année de la quatrième semaine, Abram se leva pendant la nuit et brûla la maison des idoles. Il brûla tout ce qui se trouvait dans la maison, sans que personne le sache.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓመት፡ ዘስሳ፡ ዘሕይወቱ፡ አብራም
  choice: Dans la soixantième année de la vie d’Abram
  rationale: Rend directement l’indication chronologique guèze dans un français naturel et soutenu.
- source_word: ውእቱ፡ ሱባዔ፡ ራብዕ፡ በዓመት፡ ራብዕ፡ ሎቱ
  choice: c’est-à-dire la quatrième année de la quatrième semaine
  rationale: Le texte situe l’événement dans la quatrième semaine, en sa quatrième année; l’ordre français est ajusté pour éviter la lourdeur tout en conservant les deux éléments calendaires.
- source_word: ተንሥአ፡ አብራም፡ በሌሊት
  choice: Abram se leva pendant la nuit
  rationale: « Se leva » conserve le verbe narratif, et « pendant la nuit » exprime clairement le cadre temporel.
- source_word: ቤተ፡ ጣዖታት
  choice: la maison des idoles
  rationale: Traduction formelle du syntagme, sans préciser s’il s’agit d’un temple ou d’un bâtiment domestique.
- source_word: ወአውዐየ፡ ኵሎ፡ በውስተ፡ ቤት
  choice: Il brûla tout ce qui se trouvait dans la maison
  rationale: Explicite naturellement en français la portée de « tout à l’intérieur de la maison » sans ajout interprétatif.
- source_word: ወሰብእ፡ አልቦ፡ ዘአእመረ
  choice: sans que personne le sache
  rationale: Rend idiomatiquement la proposition « et il n’y eut personne qui le sut », le pronom renvoyant à l’acte.
