  text: He causes it to rain in the morning and in the evening; and if he wills, he does not make it come down. And everything is in his hand." And he prayed
translation:
  language: fr
  text: « Il fait pleuvoir le matin et le soir ; et, s’il le veut, il ne la fait pas tomber. Tout est dans sa main. » Puis il pria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « Puis il pria » peuvent être rattachés au début du verset suivant.
    reason: La segmentation du passage peut varier, bien que ces mots figurent à la fin du segment source fourni.
lexical_decisions:
- source_word: ያዘንም
  choice: Il fait pleuvoir
  rationale: Le verbe exprime ici le fait de provoquer la pluie ; aucun conditionnel ne précède cette première proposition.
- source_word: ነግሀ፡ ወሰርከ
  choice: le matin et le soir
  rationale: Rendu direct et naturel des deux indications temporelles coordonnées.
- source_word: ወእመ፡ ፈቀደ፡ ኢያወርድ
  choice: et, s’il le veut, il ne la fait pas tomber
  rationale: Le conditionnel porte sur la proposition négative. Le pronom « la » reprend naturellement la pluie en français.
- source_word: ወኵሉ፡ ውስተ፡ እዴሁ
  choice: Tout est dans sa main
  rationale: Conserve le singulier concret du texte guèze sans développer l’image.
- source_word: ወጸለየ
  choice: Puis il pria
  rationale: Traduit l’élément narratif final du segment ; « Puis » rend naturellement la coordination dans la succession du récit.
theological_decisions:
- issue: Portée de « s’il le veut »
  choice: La condition porte uniquement sur le fait de ne pas faire tomber la pluie.
  alternative: Rattacher aussi la condition au premier énoncé sur la pluie.
  rationale: Dans le texte guèze, ወእመ፡ ፈቀደ፡ vient après la première proposition et introduit la proposition négative.
- issue: Image de la souveraineté divine
  choice: Tout est « dans sa main ».
  alternative: Tout est « entre ses mains » ou « en son pouvoir ».
  rationale: Le singulier et l’image corporelle du texte source sont conservés, sans explicitation doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La formulation demeure proche de la syntaxe et des images du guèze, tout en évitant une répétition peu naturelle de « la pluie ».
