revisions:
- from: 'Et il dit[a] : « Retournerai-je à Our des Chaldéens, eux qui cherchent ma face pour que je retourne auprès d’eux ? Et que ferai-je ici, en ce lieu ? Rends droit devant toi le juste chemin par la main de ton serviteur, afin qu’il le suive, et ne me laisse pas marcher dans l’égarement de mon cœur, mon Dieu. » Lorsqu’il eut fini de parler et de prier, voici que quelqu’un fut envoyé.'
  to: 'Et il dit[a] : « Retournerai-je à Our des Chaldéens, eux qui cherchent ma face pour que je retourne auprès d’eux ? Et que ferai-je ici, en ce lieu ? Aplanis devant toi le juste chemin par la main de ton serviteur, afin qu’il l’accomplisse, et ne me laisse pas marcher dans l’égarement de mon cœur, mon Dieu. » Il finit de parler, pria, et voici que quelqu’un fut envoyé.'
  rationale: 'La révision remplace « suivre » par « accomplir » afin de conserver l’action active, mais non spécifiée, attribuée au serviteur. Elle rétablit aussi la coordination des actions finales. La note est légèrement corrigée : elle ne doit pas reformuler « devant toi » en « devant lui », car le suffixe du texte source est bien de deuxième personne ; l’ambiguïté de cette expression est ainsi laissée dans le texte traduit plutôt que résolue doctrinalement.'
