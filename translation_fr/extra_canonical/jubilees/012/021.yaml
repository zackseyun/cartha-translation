  - severity: low
    issue: « Lorsqu’il eut fini de parler et de prier »
    rationale: Le texte coordonne « il finit de parler », « il pria », puis « voici, [quelqu’un] fut envoyé ». La reformulation actuelle fusionne et subordonne les deux premières actions.
