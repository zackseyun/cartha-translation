  yaml_path: translation/extra_canonical/jubilees/012/021.yaml
  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
translation:
  language: fr
  text: 'Et il dit[a] : « Retournerai-je à Our des Chaldéens, eux qui cherchent ma face pour que je retourne auprès d’eux ? Et que ferai-je ici, en ce lieu ? Aplanis devant toi le juste chemin par la main de ton serviteur, afin qu’il l’accomplisse, et ne me laisse pas marcher dans l’égarement de mon cœur, mon Dieu. » Il finit de parler, pria, et voici que quelqu’un fut envoyé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le milieu de ce verset est difficile à interpréter dans le texte guèze tel qu’il est segmenté. La traduction conserve l’idée qu’Abram demande à Dieu d’aplanir le juste chemin devant lui et de ne pas le laisser suivre l’égarement de son propre cœur.
    reason: segmentation_note
lexical_decisions:
- source_word: ገጽየ
  choice: ma face
  rationale: 'Le nom signifie littéralement « ma face ». Cette expression, certes inhabituelle en français, est conservée parce que le contexte l’explique aussitôt : ils veulent qu’Abram retourne auprès d’eux.'
- source_word: እግባእ
  choice: je retourne
  rationale: Le verbe exprime ici le retour, et non simplement l’entrée ou le déplacement vers quelqu’un.
- source_word: ፍኖተ፡ ርቱዐ
  choice: le juste chemin
  rationale: Rend directement l’idée d’un chemin droit ou juste, au sens de la conduite qu’Abram demande à Dieu de lui indiquer.
- source_word: ይግበር
  choice: afin qu’il le suive
  rationale: La forme est active, « qu’il fasse », avec le serviteur comme sujet. En français, « suivre le chemin » exprime naturellement l’action visée sans transformer le verbe en passif.
- source_word: ተፈነወ
  choice: quelqu’un fut envoyé
  rationale: Le passif signifie « fut envoyé » sans sujet explicitement nommé dans ce verset ; « quelqu’un » préserve cette indétermination.
theological_decisions:
- issue: Qui se tient devant Dieu dans la demande concernant le chemin
  choice: « devant toi »
  alternative: « devant moi »
  rationale: 'Le suffixe de በቅድሜከ est de deuxième personne : le texte demande que le juste chemin soit rendu droit « devant toi », formulation théologiquement tendue mais textuellement attestée.'
- issue: Rapport entre l’action divine et celle du serviteur
  choice: Dieu rend le chemin droit, et son serviteur doit le suivre
  alternative: « qu’il soit accompli par la main de ton serviteur »
  rationale: Cette formulation maintient à la fois la requête adressée à Dieu et la forme active du verbe appliqué au serviteur, sans imposer une doctrine particulière de la providence ou de la volonté humaine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la prière reste légèrement solennelle. L’expression littérale « cherchent ma face » est maintenue en raison de son appui direct dans le guèze, tandis que « afin qu’il le suive » explicite idiomatiquement l’action du serviteur sur le chemin.
