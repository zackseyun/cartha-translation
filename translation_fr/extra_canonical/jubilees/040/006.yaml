  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: fr
  text: 'Le Seigneur accorda à Joseph faveur et bienveillance aux yeux de Pharaon. Pharaon dit à ses serviteurs : « Nous ne trouverons pas un homme aussi sage et intelligent que celui-ci, car l’Esprit du Seigneur est avec lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞገሰ፡ ወምሕረተ
  choice: faveur et bienveillance
  rationale: Le binôme guèze exprime la faveur et une disposition miséricordieuse ou bienveillante. « Bienveillance » est naturel en français dans ce contexte de faveur accordée devant un souverain.
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለፈርዖን
  choice: aux yeux de Pharaon
  rationale: Conserve l’idiome sémitique intelligible en français, qui signifie que Joseph bénéficie de l’approbation de Pharaon.
- source_word: ጠቢበ፡ ወማእምረ
  choice: sage et intelligent
  rationale: Rend distinctement les deux qualités, la sagesse et le discernement ou l’intelligence, sans les fusionner.
- source_word: መንፈሰ፡ እግዚአብሔር
  choice: l’Esprit du Seigneur
  rationale: Rend littéralement l’expression du texte source et conserve sa portée théologique sans la réduire à une simple aptitude.
theological_decisions:
- issue: Nature de la présence divine auprès de Joseph
  choice: « l’Esprit du Seigneur est avec lui »
  alternative: « un esprit divin est avec lui »
  rationale: Le guèze porte explicitement « Esprit du Seigneur » et non une formule indéfinie. La traduction maintient donc cette identification sans développer davantage son sens.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche de la progression du texte guèze, tandis que la ponctuation française clarifie le passage du récit au discours direct.
