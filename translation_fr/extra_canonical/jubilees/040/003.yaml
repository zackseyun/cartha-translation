  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
translation:
  language: fr
  text: Alors le chef des échansons se souvint de Joseph et parla de lui au roi. Celui-ci le fit sortir de la prison, et Joseph raconta devant lui ses deux rêves.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: le chef des échansons
  rationale: Le titre désigne le responsable des serviteurs chargés de servir les boissons royales; «chef des échansons» est précis, traditionnel et intelligible dans ce contexte de cour.
- source_word: ቤተ፡ ሞቅሕ
  choice: la prison
  rationale: L’expression signifie littéralement «maison de détention / des liens». «La prison» en donne naturellement le sens en français moderne.
- source_word: ክልኤሆሙ፡ ሕለመሁ
  choice: ses deux rêves
  rationale: ክልኤሆሙ exprime les deux ensemble, et le suffixe -ሁ de ሕለመሁ marque explicitement le possessif masculin singulier, «ses».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Les sujets implicites ont été explicités («Celui-ci», «Joseph») pour éviter l’ambiguïté référentielle créée en français par une succession de pronoms masculins.
