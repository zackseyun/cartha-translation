  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: fr
  text: 'Il l’établit comme second dans tout son royaume, lui donna autorité sur toute l’Égypte et le fit monter sur le second char de Pharaon. Il le revêtit d’habits de fin lin, lui mit au cou un collier d’or, et l’on proclamait devant lui : « El, El ! » et « Abrer ! »[a] Il lui remit l’anneau-sceau, l’établit à la tête de toute sa maison, l’éleva en dignité et lui dit : « Ce n’est que par le trône que je serai plus grand que toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « El, El » et « Abrer » transcrivent des acclamations dont le sens exact est incertain.
    reason: Préserver l’incertitude lexicale du texte source sans imposer une interprétation conjecturale.
lexical_decisions:
- source_word: ሤሞ፡ ዳግመ
  choice: l’établit comme second
  rationale: Rend directement l’idée d’une nomination au deuxième rang dans le royaume.
- source_word: አኰነኖ
  choice: lui donna autorité
  rationale: Exprime l’établissement de Joseph comme gouverneur ou dirigeant sans surcharger le titre.
- source_word: ልብሰ፡ ቢሶስ
  choice: habits de fin lin
  rationale: Le terme désigne le byssus, textile de lin fin et prestigieux ; la formulation française courante en communique le sens.
- source_word: ማዕተቤ
  choice: anneau-sceau
  rationale: Le contexte royal indique un anneau servant de sceau et conférant l’autorité déléguée.
- source_word: መንበር፡ ባሕቲቱ
  choice: que par le trône
  rationale: Conserve la restriction portant uniquement sur le trône, dans un français naturel.
theological_decisions:
- issue: Sens des acclamations « El, El » et « Abrer »
  choice: Conserver les formes translittérées dans le texte et signaler leur obscurité en note
  alternative: Traduire conjecturalement ces expressions comme des titres ou des injonctions honorifiques
  rationale: Le sens précis de ces acclamations est incertain ; les traduire résoudrait artificiellement une ambiguïté réelle du témoin guèze.
- issue: Supériorité de Pharaon limitée au trône
  choice: « Je ne serai plus grand que toi que par le trône »
  alternative: « Ce n’est que sur le trône que je serai plus grand que toi »
  rationale: La formulation retenue préserve la forte élévation de Joseph tout en maintenant l’unique réserve de l’autorité royale suprême.
translation_notes:
  register: Français moderne, digne et accessible. Les enchaînements narratifs ont été allégés sans perdre la succession des actes royaux. « Pharaon » est employé sans article, conformément à l’usage biblique français courant.
