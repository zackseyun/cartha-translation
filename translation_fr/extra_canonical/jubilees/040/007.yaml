  to: 'Il l’établit comme second dans tout son royaume, lui donna autorité sur toute l’Égypte et le fit monter sur le second char de Pharaon. Il le revêtit d’habits de fin lin, lui mit au cou un collier d’or, et l’on proclamait devant lui : « El, El ! » et « Abrer ! »[a] Il lui remit l’anneau-sceau, l’établit à la tête de toute sa maison, l’éleva en dignité et lui dit : « Ce n’est que par le trône que je serai plus grand que toi. »'
