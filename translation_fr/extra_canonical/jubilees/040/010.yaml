  text: And the king called Joseph’s name Pontifans,^a and he gave Joseph as wife the daughter of Potiphar, the daughter of Sawes^b of Heliopolis, chief of the guards.
translation:
  language: fr
  text: Le roi donna à Joseph le nom de Pontifans[a] et lui donna pour femme la fille de Potiphar, fille de Sawes[b] d’Héliopolis, chef des gardes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la forme « Psonthomphanès », notamment par rapprochement avec la tradition grecque de Genèse 41.45.
    reason: Signaler une autre forme traditionnelle du nom sans remplacer la leçon guèze.
  - marker: b
    text: La forme guèze « Sawes » paraît provenir du mot grec signifiant « prêtre », mais le texte transmis la traite comme un nom propre.
    reason: Expliquer la difficulté textuelle et préserver la leçon effective du guèze.
lexical_decisions:
- source_word: ጸውዐ፡ ንጉሥ፡ ስሞ፡ ለዮሴፍ
  choice: Le roi donna à Joseph le nom de
  rationale: Rend naturellement en français la formule « le roi appela le nom de Joseph », tout en conservant l’acte officiel d’attribution d’un nouveau nom.
- source_word: ጶንጢፋንስ
  choice: Pontifans
  rationale: Translittération fidèle de la forme guèze propre au texte des Jubilés, sans l’harmoniser avec la Septante de Genèse 41.45.
- source_word: ብእሲተ፡ ለዮሴፍ
  choice: pour femme
  rationale: Le substantif et la construction indiquent que la femme est donnée à Joseph comme épouse.
- source_word: ሳውፅ
  choice: Sawes
  rationale: Le texte guèze présente cette forme comme un nom propre; la traduction ne l’émende donc pas silencieusement en « prêtre ».
- source_word: ሊቀ፡ ዐቀብት
  choice: chef des gardes
  rationale: Traduction directe du titre guèze, en accord avec la syntaxe transmise.
theological_decisions:
- issue: Rapport avec Genèse 41.45 et sa tradition grecque
  choice: Conserver les formes textuelles Pontifans et Sawes
  alternative: Harmoniser avec Psonthomphanès et traduire Sawes par « prêtre »
  rationale: La traduction privilégie le témoignage guèze fourni et signale les variantes sans corriger le texte selon un passage parallèle.
- issue: Rattachement du titre « chef des gardes »
  choice: Maintenir la succession syntaxique après « Sawes d’Héliopolis »
  alternative: Réorganiser la phrase pour rattacher explicitement le titre à Potiphar
  rationale: Le guèze transmis laisse le titre en fin de proposition; la traduction évite de résoudre plus nettement que la source son rattachement exact.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure généalogique inhabituelle du texte (« fille de Potiphar, fille de Sawes ») au lieu de la normaliser d’après la Genèse.
