  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
translation:
  language: fr
  text: 'Et il leur arriva exactement comme il le leur avait expliqué : Pharaon rétablit le grand échanson dans sa fonction, mais fit mettre à mort le boulanger, comme Joseph le leur avait expliqué. Le grand échanson laissa Joseph dans la prison après que Joseph lui avait fait savoir ce qui allait arriver[a] ; il ne se souvint pas de faire connaître à Pharaon ce que Joseph lui avait dit, car il avait oublié.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « … dans la prison, bien que Joseph lui eût fait savoir ce qui allait arriver. »'
    reason: La conjonction አመ se comprend d’abord dans un sens temporel (« après que/lorsque »), mais le contexte permet aussi la relation concessive retenue par une partie de la tradition de traduction.
lexical_decisions:
- source_word: ፈከረ
  choice: annoncer
  rationale: Dans ce contexte, le verbe désigne l’explication annonçant l’issue des rêves. « Annoncer » restitue naturellement en français à la fois l’interprétation et sa portée prédictive.
- source_word: ሊቀ፡ መዘርት
  choice: chef des échansons
  rationale: Le syntagme porte explicitement le titre de chef ; « échanson » est le terme français courant et digne pour l’officier chargé de la boisson royale.
- source_word: ሐባዚ
  choice: boulanger
  rationale: Le texte guèze dit simplement « le boulanger », sans le titre « chef » présent pour l’échanson ; ne pas ajouter ce titre évite une harmonisation avec la Genèse.
- source_word: ወረሰዮ
  choice: laissa
  rationale: Le verbe signifie ici « laisser » ou « placer », et non « oublier » ; l’oubli est exprimé distinctement à la fin du verset par ረስዐ.
- source_word: አይድዖ
  choice: lui eût fait savoir
  rationale: La forme causative indique que Joseph avait informé l’échanson de ce qui arriverait, plutôt que le simple fait que l’échanson le savait.
- source_word: ረሳዐ
  choice: oublia
  rationale: Rend directement le verbe final qui donne la raison de l’absence de démarche auprès de Pharaon.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. Le plus-que-parfait du subjonctif après « bien que » maintient ici une cadence narrative digne ; le pronom « celui-ci » clarifie que Joseph est celui qui avait informé l’échanson. La répétition d’« annoncé » reflète celle du verbe source, tandis que le nom de Joseph n’apparaît explicitement que dans la seconde occurrence, comme en guèze.
