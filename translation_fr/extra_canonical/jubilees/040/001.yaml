  to: 'Et il leur arriva exactement comme il le leur avait expliqué : Pharaon rétablit le grand échanson dans sa fonction, mais fit mettre à mort le boulanger, comme Joseph le leur avait expliqué. Le grand échanson laissa Joseph dans la prison après que Joseph lui avait fait savoir ce qui allait arriver[a] ; il ne se souvint pas de faire connaître à Pharaon ce que Joseph lui avait dit, car il avait oublié.'
