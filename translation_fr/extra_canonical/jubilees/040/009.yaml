  yaml_path: translation/extra_canonical/jubilees/040/009.yaml
  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
translation:
  language: fr
  text: Et le pays d’Égypte prospéra sous les yeux du pharaon grâce à Joseph, car le Seigneur était avec lui et lui accorda faveur et miséricorde auprès de tous ceux de sa génération[a], aux yeux de tous ceux qui le connaissaient et de tous ceux qui entendaient parler de lui. Le royaume du pharaon était bien ordonné, et il n’y avait ni adversaire ni mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès de tous ses proches ».
    reason: Le mot guèze ዘመድ peut renvoyer à la génération ou à la parenté; la variante préserve cette ambiguïté lexicale.
lexical_decisions:
- source_word: ወትሠናአወት
  choice: prospéra
  rationale: Le verbe exprime ici une situation devenue bonne, florissante ou prospère; « prospéra » convient au résultat attribué à Joseph.
- source_word: በቅድሜሁ ለፈርዖን
  choice: sous les yeux du pharaon
  rationale: Rend naturellement l’idée de « devant/en présence du pharaon » sans suggérer une antériorité temporelle.
- source_word: በእንተ ዮሴፍ
  choice: grâce à Joseph
  rationale: Exprime la cause positive indiquée par la préposition dans ce contexte.
- source_word: ሞገሰ ወምሕረተ
  choice: faveur et miséricorde
  rationale: Conserve les deux notions distinctes du texte source dans un registre biblique clair.
- source_word: ላዕለ ኵሎሙ ዘመዱ
  choice: auprès de tous ceux de sa génération
  rationale: « Auprès de » est idiomatique avec « accorder faveur »; ዘመድ peut désigner la génération ou les proches, ambiguïté signalée en note.
- source_word: ወረጐዐት መንግሥተ ፈርዖን
  choice: Le royaume du pharaon était bien ordonné
  rationale: Rend l’idée de stabilité, de calme et de bon ordre du royaume.
- source_word: አልቦ ሰይጣነ ወአልቦ እኩየ
  choice: il n’y avait ni adversaire ni mal
  rationale: Préserve le parallélisme et distingue un adversaire de la présence du mal, sans personnifier indûment le second terme.
theological_decisions:
- issue: Sens de ሰይጣነ
  choice: adversaire
  alternative: Satan
  rationale: Le terme fonctionne ici comme un nom commun dans une description politique de la stabilité du royaume; la traduction évite d’introduire sans nécessité une référence au diable.
- issue: Nature de እኩየ
  choice: mal
  alternative: méchant / mauvais individu
  rationale: La forme permet une lecture abstraite; le contexte et le parallélisme soutiennent « mal », tout en évitant de transformer le terme en être personnel.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du texte source tout en étant fluide; « le pharaon » est employé comme titre, conformément à l’usage français courant.
