  yaml_path: translation/extra_canonical/jubilees/040/002.yaml
  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: fr
  text: En ces jours-là, Pharaon fit, au cours d’une même nuit, deux rêves au sujet de la famine qui devait s’abattre sur toute la terre. Il se réveilla, convoqua tous les interprètes de rêves qui se trouvaient en Égypte ainsi que les devins, et leur raconta ses deux rêves, mais ils furent incapables de les comprendre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለመ፡ ... ሕለመ፡ ክልኤተ
  choice: fit [...] deux rêves
  rationale: Rend directement l’action de rêver et le nombre de rêves, dans un français naturel.
- source_word: በአሐቲ፡ ሌሊት
  choice: au cours d’une même nuit
  rationale: Exprime clairement que les deux rêves eurent lieu pendant une seule nuit.
- source_word: ነገረ፡ ረኃብ
  choice: au sujet de la famine
  rationale: Conserve la tournure indiquant que les rêves concernaient la famine.
- source_word: ዘይከውን፡ ዲበ፡ ኵሉ፡ ምድር
  choice: qui devait s’abattre sur toute la terre
  rationale: Rend l’événement futur et la préposition « sur » avec une formulation française idiomatique, sans restreindre la portée de « toute la terre ».
- source_word: መፈክራነ፡ ሕልም
  choice: interprètes de rêves
  rationale: Désigne naturellement les spécialistes chargés d’expliquer les rêves.
- source_word: ረቅይተ
  choice: devins
  rationale: Terme français courant pour des praticiens de la divination, distingués ici des interprètes de rêves.
- source_word: ወአክሀሉ፡ አእምሮ
  choice: mais ils furent incapables de les comprendre
  rationale: Suit le sens littéral d’une incapacité à comprendre, plutôt que d’ajouter explicitement l’idée de faire connaître une interprétation.
theological_decisions:
- issue: Portée de « toute la terre »
  choice: toute la terre
  alternative: tout le pays
  rationale: Le substantif peut désigner la terre ou un pays selon le contexte; la formulation large du texte est conservée afin de ne pas réduire silencieusement l’étendue annoncée de la famine.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement resserrée pour la fluidité, tout en conservant la succession des actions et la distinction entre interprètes de rêves et devins.
