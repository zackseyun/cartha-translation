base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
translation:
  language: fr
  text: « Maintenant, que Pharaon établisse des administrateurs dans tout le pays d’Égypte, et qu’ils amassent du grain dans les entrepôts des villes[a], dans chaque ville, pendant les jours des années d’abondance[b]. Ce grain servira de réserve pour les sept années de famine, et le pays ne périra pas devant la famine, car elle sera extrêmement dure. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les maisons des villes »; autre traduction possible : « dans les villes ».'
    reason: Le mot « maisons » est présent dans le guèze, mais le contexte indique qu’il s’agit de bâtiments servant au stockage.
  - marker: b
    text: Expression qui peut aussi se traduire simplement par « pendant les années d’abondance ».
    reason: Le texte dit littéralement « pendant les jours des années d’abondance », tournure conservée dans le texte principal.
lexical_decisions:
- source_word: መኰንነ
  choice: des administrateurs
  rationale: Le terme désigne ici des responsables nommés par Pharaon pour organiser la collecte; « administrateurs » est naturel en français et convient à leur fonction.
- source_word: ይዝግቡ
  choice: qu’ils amassent du grain
  rationale: Le verbe exprime la mise en réserve. « Du grain » explicite naturellement en français l’objet sous-entendu par le contexte de famine et de stockage.
- source_word: በቤተ፡ አህጉር
  choice: dans les entrepôts des villes
  rationale: Littéralement « dans les maisons des villes »; dans le contexte, ces bâtiments sont des lieux de stockage. « Entrepôts » conserve le référent concret omis par une simple traduction « dans les villes ».
- source_word: በመዋዕለ፡ ዓመታት፡ ዘጽጋብ
  choice: pendant les jours des années d’abondance
  rationale: Cette formulation conserve l’expression sémitique et guèze « les jours des années », tout en restant intelligible en français.
- source_word: ሲሳተ
  choice: réserve
  rationale: Le mot désigne ici des provisions destinées à assurer la subsistance pendant la famine.
- source_word: ኀያል፡ ይከውን፡ ጥቀ
  choice: elle sera extrêmement dure
  rationale: Littéralement, la famine sera « très forte »; « extrêmement dure » exprime idiomatiquement en français son intensité dévastatrice.
