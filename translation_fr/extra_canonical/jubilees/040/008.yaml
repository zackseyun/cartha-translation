  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
translation:
  language: fr
  text: 'Joseph parcourut tout le pays d’Égypte. Tous les dignitaires du pharaon l’aimaient, ainsi que tous les serviteurs du pharaon et tous ceux qui accomplissaient le travail du roi, parce qu’il se conduisait avec droiture : il n’y avait en lui ni orgueil, ni arrogance du cœur, ni favoritisme, et il n’acceptait aucun présent destiné à corrompre[a]. En effet, il jugeait avec droiture tous les peuples de la terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun pot-de-vin ».'
    reason: « Pot-de-vin » exprime plus directement le don reçu pour influencer un jugement.
  - marker: b
    text: 'Ou : « tous les peuples du pays ».'
    reason: Le terme guèze ምድር peut désigner la terre au sens large ou, selon le contexte, un pays.
lexical_decisions:
- source_word: መበለ
  choice: parcourut
  rationale: Dans ce contexte, le verbe décrit le déplacement de Joseph à travers l’Égypte; « parcourut » est naturel et conserve l’idée de circulation dans tout le pays.
- source_word: መኳንንቲሁ፡ ለፈርዖን
  choice: les dignitaires du pharaon
  rationale: « Dignitaires » rend naturellement les hauts responsables ou princes attachés au pharaon sans imposer un titre administratif trop précis.
- source_word: እለ፡ ይገብሩ፡ ግብረ፡ ንጉሥ
  choice: ceux qui étaient au service du roi
  rationale: Formulation idiomatique correspondant littéralement à ceux qui accomplissent le travail du roi.
- source_word: ርቱዐ፡ የሐውር
  choice: il se conduisait avec droiture
  rationale: L’expression associe la marche ou la conduite à la rectitude morale; cette tournure française restitue l’idiome.
- source_word: አሢሦተ፡ ገጽ
  choice: favoritisme
  rationale: L’expression liée au « visage » désigne le fait de favoriser certaines personnes, plutôt qu’une attitude hautaine.
- source_word: ነሢአ፡ ሕልያነ
  choice: il n’acceptait aucun présent corrupteur
  rationale: Le syntagme signifie recevoir des dons susceptibles d’influencer le jugement, c’est-à-dire des présents corrupteurs ou pots-de-vin.
- source_word: ይኴንን
  choice: il jugeait
  rationale: Rend directement l’exercice du jugement attribué à Joseph.
theological_decisions:
- issue: Portée de « tous les peuples de la terre/du pays »
  choice: tous les peuples du pays
  alternative: tous les peuples de la terre
  rationale: Le dernier mot ምድር peut signifier « terre » ou « pays ». Le contexte immédiat est l’administration de l’Égypte, mais l’expression peut avoir une portée plus large; une note préserve cette ambiguïté.
- issue: Nature des dons refusés
  choice: présent corrupteur
  alternative: pot-de-vin
  rationale: « Présent corrupteur » garde l’image d’un don reçu tout en explicitant sa fonction dans un contexte judiciaire; « pot-de-vin » serait plus direct mais plus familier.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, avec un vocabulaire institutionnel courant. La série des défauts est rendue clairement, et les deux ambiguïtés lexicales pertinentes sont conservées en notes.
