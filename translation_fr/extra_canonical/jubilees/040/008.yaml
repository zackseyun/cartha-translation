  source_fidelity: 'Le sens général suit fidèlement le guèze : Joseph parcourt l’Égypte, est aimé de l’entourage royal, marche avec droiture, ne fait preuve ni d’orgueil ni de favoritisme, ne reçoit pas de dons corruptifs et juge avec équité. « Favoritisme » rend correctement l’expression idiomatique liée au « visage », et « n’acceptait aucun présent corrupteur » rend bien le refus de présents/pots-de-vin. Pour la dernière expression, « tous les peuples de la terre » préserve plus directement la portée universelle du texte et de la piste d’audit anglaise; une note peut signaler la possibilité contextuelle de « pays ».'
  naturalness: Le français est moderne, clair et de registre approprié. Toutefois, « tous ses serviteurs » laisse inutilement ambigu le référent possessif (Joseph ou le pharaon). « Tous les serviteurs du pharaon » est plus net. « Présent corrupteur » est compréhensible mais légèrement moins idiomatique au singulier après « aucun »; « aucun présent destiné à corrompre » est plus naturel tout en restant soutenu.
  terminology: « Dignitaires du pharaon », « droiture », « favoritisme » et « jugeait avec droiture » conviennent. « Pot-de-vin » demeure une bonne variante en note, mais ne doit pas remplacer nécessairement la formulation soutenue du texte. « Peuples de la terre » conserve l’ambiguïté et l’ampleur de ምድር sans restreindre d’emblée la phrase à l’Égypte.
