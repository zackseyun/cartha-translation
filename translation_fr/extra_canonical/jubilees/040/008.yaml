revisions:
- from: 'Joseph parcourut tout le pays d’Égypte. Tous les dignitaires du pharaon l’aimaient, ainsi que tous ses serviteurs et tous ceux qui étaient au service du roi, parce qu’il se conduisait avec droiture : il n’y avait en lui ni orgueil, ni arrogance du cœur, ni favoritisme, et il n’acceptait aucun présent corrupteur[a]. En effet, il jugeait avec droiture tous les peuples du pays[b].'
  to: 'Joseph parcourut tout le pays d’Égypte. Tous les dignitaires du pharaon l’aimaient, ainsi que tous les serviteurs du pharaon et tous ceux qui accomplissaient le travail du roi, parce qu’il se conduisait avec droiture : il n’y avait en lui ni orgueil, ni arrogance du cœur, ni favoritisme, et il n’acceptait aucun présent destiné à corrompre[a]. En effet, il jugeait avec droiture tous les peuples de la terre[b].'
  rationale: La révision explicite que les serviteurs sont ceux du pharaon et choisit « peuples de la terre » dans le texte principal afin de ne pas restreindre la portée de ምድር. La note conserve l’interprétation contextuelle « pays ». La formulation relative aux présents est légèrement idiomatisée sans modifier le sens judiciaire du syntagme.
