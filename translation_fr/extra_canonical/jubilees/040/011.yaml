lexical_decisions:
- source_word: ቆመ፡ ኀበ፡ ፈርዖን
  choice: se présenta devant Pharaon
  rationale: Littéralement « se tint devant Pharaon » ; dans ce contexte de comparution officielle, « se présenta devant » est naturel en français tout en conservant le sens.
- source_word: ወልደ፡ ሠላሳ፡ ክረምተ
  choice: il avait trente ans
  rationale: L’expression, littéralement « fils de trente saisons des pluies », est un idiome guèze indiquant l’âge.
- source_word: ወበዐሰተ
  choice: Et l’année où
  rationale: La forme transmise paraît fautive ou corrompue ; le contexte et la révision source indiquent vraisemblablement ወበዐመተ, « et dans l’année où ». La traduction retient cette lecture probable sans supprimer la première proposition.
