  yaml_path: translation/extra_canonical/jubilees/040/013.yaml
  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
translation:
  language: fr
  text: Joseph rassembla les vivres de chaque ville dans cette ville même[a], jusqu’à ce qu’elle soit pleine de grain, au point qu’on ne pouvait plus le compter ni le mesurer, tant il y en avait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une ville, dans une ville »; autrement compris : « de ville en ville ».'
    reason: La construction guèze est concise et peut sembler ambiguë, mais le contexte favorise l’entreposage des vivres de chaque ville dans cette même ville.
lexical_decisions:
- source_word: ሲሳተ፡ (sisāta)
  choice: les vivres
  rationale: Le terme désigne ici les denrées ou provisions recueillies pendant les années d’abondance; « vivres » est naturel et conserve cette portée générale.
- source_word: ለሀገር፡ ውስተ፡ ሀገር፡ (la-hagar wəsta hagar)
  choice: de chaque ville dans cette ville même
  rationale: La tournure distributive indique que les vivres destinés à une ville étaient entreposés dans cette même ville, plutôt qu’acheminés d’une ville à l’autre.
- source_word: መልአ፡ ስርናየ፡ (mal’a sərnāya)
  choice: qu’elle soit pleine de grain
  rationale: Rend directement le verbe « être plein/rempli » et le nom « grain », sans anticiper la proposition suivante sur l’impossibilité de compter et de mesurer.
- source_word: ይስእኑ፡ ኍልቈቶ፡ ወሰፈረ፡ (yəs’ənu ḫʷəlqʷato wa-safara)
  choice: on ne pouvait plus le compter ni le mesurer
  rationale: Le même verbe d’incapacité régit les deux opérations. Le pronom indéfini « on » exprime naturellement en français le sujet humain générique du pluriel guèze.
- source_word: እምነ፡ ብዝኁ፡ (’əmna bəzḫu)
  choice: tant il y en avait
  rationale: Formulation française idiomatique exprimant que l’impossibilité de compter et de mesurer venait de la très grande abondance.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la progression du texte source — collecte, remplissage, puis impossibilité de compter et de mesurer — tout en employant « on » pour éviter en français un pronom pluriel sans antécédent explicite.
