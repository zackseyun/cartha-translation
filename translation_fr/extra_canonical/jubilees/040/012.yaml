revisions:
- from: 'Cette année-là, Isaac mourut. Tout arriva comme Joseph l’avait annoncé au sujet de l’interprétation des deux rêves, exactement comme il le lui avait dit : il y eut sept années d’abondance dans tout le pays d’Égypte, et la terre d’Égypte produisit à profusion, une mesure en rapportant mille huit cents.'
  to: 'Cette année-là, Isaac mourut. Tout arriva comme Joseph l’avait annoncé au sujet de l’interprétation de ses deux rêves, comme il l’avait dit : il y eut sept années d’abondance dans tout le pays d’Égypte, et la terre d’Égypte produisit à profusion ; une mesure en produisait mille huit cents.'
  rationale: La révision supprime un pronom datif artificiellement ambigu, préserve la double formulation d’accomplissement présente dans le texte, et rend explicitement le rapport « une mesure / mille huit cents mesures » sans interprétation doctrinale ni ajout contextuel.
