  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: fr
  text: 'Cette année-là, Isaac mourut. Tout arriva comme Joseph l’avait annoncé au sujet de l’interprétation de ses deux rêves, comme il l’avait dit : il y eut sept années d’abondance dans tout le pays d’Égypte, et la terre d’Égypte produisit à profusion ; une mesure en produisait mille huit cents.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ
  choice: mourut
  rationale: Rend directement le verbe guèze « mourir » dans un registre narratif digne et naturel.
- source_word: ፍካሬ
  choice: interprétation
  rationale: Le terme désigne ici l’explication ou l’interprétation des rêves de Pharaon.
- source_word: ሰብዐቱ፡ ክረምት፡ ዘጽጋብ
  choice: sept années d’abondance
  rationale: Expression française naturelle qui conserve le sens agricole de satiété et de prospérité.
- source_word: ወፈርየት ... ብዙኀ
  choice: produisit à profusion
  rationale: Restitue l’idée d’une fertilité ou d’un rendement exceptionnel sans alourdir la phrase.
- source_word: አሐቲ፡ መስፈርት፡ ዐሠርተ፡ ወሰመትነ፡ ምእተ፡ መስፈረ
  choice: une mesure en rapportant mille huit cents
  rationale: Conserve explicitement le rendement numérique très élevé attesté par le texte source.
theological_decisions:
- issue: Accomplissement de l’interprétation prophétique de Joseph
  choice: Tout arriva comme Joseph l’avait annoncé
  alternative: La parole de Joseph s’accomplit
  rationale: Cette formulation suit la construction narrative du guèze sans ajouter une qualification théologique explicite à l’annonce de Joseph.
- issue: Référent du pronom dans « comme il le lui avait dit »
  choice: conserver le pronom « lui »
  alternative: préciser « comme il l’avait dit à Pharaon »
  rationale: Le texte fourni emploie un pronom et le contexte immédiat permet de comprendre Pharaon ; conserver cette forme évite d’expliciter silencieusement un nom absent du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement fluidifiée, tout en conservant les répétitions structurantes, le lien entre les rêves et leur accomplissement, ainsi que le chiffre remarquable de mille huit cents.
