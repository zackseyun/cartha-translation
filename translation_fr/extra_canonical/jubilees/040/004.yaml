  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
translation:
  language: fr
  text: 'Il déclara devant le pharaon que ses deux rêves n’en formaient qu’un, puis il lui dit : « Sept années d’abondance viendront dans tout le pays d’Égypte. Après cela[a] viendront sept années de famine, une famine comme il n’y en a jamais eu sur toute la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après elles », c’est-à-dire après ces sept années.
    reason: Le texte guèze porte littéralement un démonstratif singulier, « après cela », tandis que le contexte permet de rapporter l’expression aux sept années.
lexical_decisions:
- source_word: ክልኤሆሙ፡ ሕለመሁ፡ አሐዱ፡ እሙንቱ
  choice: ses deux rêves n’en formaient qu’un
  rationale: Rend naturellement en français l’affirmation guèze selon laquelle les deux rêves sont un, sans effacer leur distinction ni leur unité de sens.
- source_word: ጽጋብ
  choice: abondance
  rationale: Le terme désigne ici la prospérité ou l’abondance alimentaire opposée à la famine.
- source_word: ወእምድኅረዝ
  choice: Après cela
  rationale: Suit le démonstratif singulier du texte source plutôt que de le remplacer dans le corps du texte par un pluriel contextuel.
- source_word: ዘአኮ፡ ከማሁ፡ ረኃብ
  choice: une famine comme il n’y en a jamais eu
  rationale: Formulation française idiomatique qui conserve l’idée d’une famine sans précédent comparable.
