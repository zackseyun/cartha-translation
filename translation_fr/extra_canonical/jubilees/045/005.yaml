  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: fr
  text: Joseph et ses frères mangèrent du pain devant leur père et burent du vin. Jacob éprouva une joie immense, car il vit Joseph manger avec ses frères et boire devant lui. Il bénit le Créateur de toutes choses, qui l’avait préservé et qui avait préservé pour lui ses douze fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: du pain
  rationale: Rend directement le terme guèze désignant le pain, ici employé dans le cadre du repas.
- source_word: ተፈሥሐ፡ ... ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: éprouva une joie immense
  rationale: Expression française naturelle qui conserve l’intensification de la joie (« une très grande joie ») sans lourdeur.
- source_word: ፈጣሪ፡ ኵሉ
  choice: le Créateur de toutes choses
  rationale: Restitue le titre divin de manière claire et digne; « toutes choses » exprime ici naturellement la totalité créée.
- source_word: ዐቀቦ፡ ወዐቀበ፡ ሎቱ
  choice: l’avait préservé et lui avait conservé
  rationale: Maintient la répétition du même radical et la distinction entre la préservation de Jacob et celle de ses fils pour lui.
theological_decisions:
- issue: Référent du premier complément dans « qui l’avait préservé »
  choice: Jacob
  alternative: Joseph
  rationale: Le pronom objet masculin singulier renvoie le plus naturellement à Jacob, sujet immédiat de la bénédiction, tandis que la proposition suivante concerne ses douze fils. La formulation française conserve toutefois le pronom du texte source sans explicitation interprétative.
translation_notes:
  register: Français international moderne, narratif et digne. Le parallélisme du repas et la répétition liée à la préservation sont conservés, tandis que l’intensification sémitique de la joie est rendue idiomatiquement.
