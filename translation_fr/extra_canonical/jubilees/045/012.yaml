  text: And Joseph took for the king a fifth of everything that was produced, and four parts he left to them for food and for seed.
translation:
  language: fr
  text: Joseph préleva pour le roi un cinquième de tout ce qui était produit[a], et il leur laissa les quatre autres parts pour leur nourriture et pour les semailles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un autre rattachement possible : « un cinquième de tout ce qui était produit pour le roi ».'
    reason: La place du complément « pour le roi » permet formellement un autre rattachement, bien que le contexte favorise le prélèvement effectué au profit du roi.
lexical_decisions:
- source_word: ነሥአ
  choice: préleva
  rationale: Le verbe signifie littéralement « prendre » ; dans ce contexte fiscal, « prélever » exprime naturellement l’action de Joseph sans ajouter d’idée étrangère.
- source_word: ኃምስቶ
  choice: un cinquième
  rationale: Rend directement la fraction indiquée par le texte.
- source_word: ራብዕተ፡ እደ
  choice: les quatre autres parts
  rationale: Expression littéralement liée à « quatre parts » ; « autres » explicite en français qu’il s’agit des quatre parts restantes après le prélèvement d’un cinquième.
- source_word: ሲሲት
  choice: nourriture
  rationale: Terme courant et précis pour ce qui est destiné à être consommé.
- source_word: ዘርእ
  choice: semailles
  rationale: Dans ce contexte agricole, le mot désigne la semence conservée pour ensemencer les cultures suivantes.
