lexical_decisions:
- source_word: ዐባር
  choice: famine
  rationale: Le terme désigne la famine; le pluriel français n’est pas nécessaire dans l’expression naturelle «années de famine».
- source_word: ለአሕዛብ፡ ዘውስተ፡ ምድረ
  choice: aux peuples qui se trouvaient dans le pays
  rationale: Rend explicitement le pluriel አሕዛብ et la relative locative sans réduire le terme à un collectif singulier.
- source_word: ዘርአ፡ ወሲሳተ
  choice: des semences et des provisions
  rationale: «Semences» convient à ce qui doit être semé; «provisions» conserve la portée distincte du second nom sans le limiter à la nourriture.
- source_word: በሳምን፡ ዓመት
  choice: la huitième année
  rationale: ሳምን signifie «huitième»; cela correspond aussi à l’année suivant les sept années de famine.
- source_word: መልአ፡ ፈለግ፡ ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: le fleuve avait débordé sur tout le pays d’Égypte
  rationale: Dans ce contexte hydrologique, «avait débordé sur» exprime naturellement le fait que le fleuve avait couvert ou rempli le territoire.
