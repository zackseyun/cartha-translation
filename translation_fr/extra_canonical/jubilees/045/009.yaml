  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
translation:
  language: fr
  text: Les années de famine prirent fin. Joseph donna aux gens qui se trouvaient dans le pays des semences et des provisions, afin qu’ils ensemencent la terre la huitième année, car le fleuve avait débordé sur tout le pays d’Égypte.
