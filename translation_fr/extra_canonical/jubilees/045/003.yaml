  text: '...his father Jacob in the land of Goshen, and he embraced his father''s neck and wept. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac, be blessed—he who has shown mercy and compassion."'
translation:
  language: fr
  text: '… son père Jacob, au pays de Goshen, et il se jeta au cou de son père et pleura. Israël dit à Joseph : « Que je meure maintenant, puisque je t’ai vu. Et maintenant, béni soit le Seigneur, le Dieu d’Israël, le Dieu d’Abraham et le Dieu d’Isaac, lui qui a fait preuve de miséricorde et de compassion. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐቀፈ፡ ክሳደ፡ አቡሁ
  choice: Il serra son père dans ses bras, le cou entouré
  rationale: La construction exprime littéralement l’étreinte du cou de son père. Cette formulation française conserve l’image tout en restant naturelle, sans préciser davantage la posture.
- source_word: እሙት፡ ይእዜሰ
  choice: Maintenant, je peux mourir
  rationale: Rend l’acceptation de la mort exprimée dans ce contexte en français idiomatique, sans en faire un ordre adressé à autrui.
- source_word: ይትባረክ፡ እግዚአብሔር
  choice: béni soit le Seigneur
  rationale: Conserve la formule de bénédiction et rend le titre divin እግዚአብሔር par la forme française biblique usuelle « le Seigneur ».
- source_word: ዘአክአለ፡ ምሕረተ፡ ወሣህሎ
  choice: lui qui a manifesté miséricorde et compassion
  rationale: 'Suit le sens positif retenu par la révision auditée : Dieu a fait preuve de bonté miséricordieuse et de compassion, plutôt qu’il ne les a simplement « pas retenues ».'
theological_decisions:
- issue: Identification et bénédiction de Dieu
  choice: « le Seigneur, le Dieu d’Israël, le Dieu d’Abraham et le Dieu d’Isaac »
  alternative: Employer le nom divin « l’Éternel »
  rationale: « Le Seigneur » reflète directement le titre du texte guèze et évite d’introduire une reconstruction du tétragramme qui n’apparaît pas sous cette forme dans la source immédiate.
- issue: Nature de l’action miséricordieuse
  choice: « a manifesté miséricorde et compassion »
  alternative: « n’a pas refusé miséricorde et compassion »
  rationale: La formulation affirmative est plus directement soutenue par le lexème verbal transmis et préserve l’affirmation théologique sans importer une nuance négative absente.
translation_notes:
  register: Français international moderne, digne et accessible. L’ouverture fragmentaire est conservée par des points de suspension, car le groupe « son père Jacob » dépend vraisemblablement d’un verbe situé dans le segment précédent. Les noms propres suivent les formes françaises bibliques courantes.
