  text: And Joseph made it a statute for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.
translation:
  language: fr
  text: Joseph en fit une loi pour le pays d’Égypte, qui subsiste jusqu’à ce jour. Israël vécut dix-sept ans dans le pays d’Égypte. La durée totale de sa vie fut de trois jubilés, soit cent quarante-sept ans. Il mourut la quatrième année de la cinquième semaine du quarante-cinquième jubilé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ
  choice: une loi
  rationale: Le terme désigne ici une règle ou prescription établie pour le pays; « loi » est naturel en français moderne tout en conservant sa portée officielle.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: qui subsiste jusqu’à ce jour
  rationale: La formule signifie littéralement « jusqu’à ce jour »; l’ajout de « qui subsiste » explicite naturellement que la loi demeure en vigueur.
- source_word: እስራኤል
  choice: Israël
  rationale: Le contexte biographique montre que ce nom désigne ici le patriarche Jacob, appelé Israël; le texte source est conservé sans substitution.
- source_word: ሠለስቱ፡ እዮቤሌውስ፡ ምእት፡ ወአርብዓ፡ ወሰብዓቱ፡ ዓመት
  choice: trois jubilés, soit cent quarante-sept ans
  rationale: '« soit » rend clairement l’apposition explicative: trois jubilés correspondent à 147 ans dans le système chronologique de l’ouvrage.'
- source_word: ሱባዔ
  choice: semaine
  rationale: Dans la chronologie des Jubilés, le terme désigne une période de sept ans; « semaine » préserve la terminologie structurante du livre.
theological_decisions:
- issue: Identité d’Israël
  choice: Conserver « Israël »
  alternative: Employer « Jacob »
  rationale: Le texte source nomme explicitement Israël. Remplacer ce nom par Jacob résoudrait inutilement une désignation pourtant claire dans son contexte.
- issue: Nature de la prescription de Joseph
  choice: « une loi »
  alternative: « un statut » ou « une ordonnance »
  rationale: « Loi » transmet la force normative du terme sans introduire une catégorie juridique ou confessionnelle plus précise que le texte.
