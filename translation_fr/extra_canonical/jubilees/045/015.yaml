  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
translation:
  language: fr
  text: Il les bénit et donna à Joseph une double part dans le pays. Et il s’endormit avec ses pères et fut enseveli dans la grotte de Makpéla[a], au pays de Canaan, près d’Abraham, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la grotte double ». Il s’agit de la grotte funéraire ancestrale appelée ailleurs Makpéla.'
    reason: cross_reference
lexical_decisions:
- source_word: ባረኮሙ
  choice: Il les bénit
  rationale: Le suffixe objet pluriel est rendu directement par « les ».
- source_word: ክልኤተ፡ መክፈሊተ
  choice: une double part
  rationale: L’expression désigne deux parts, naturellement rendues en français par « une double part ».
- source_word: ኖመ፡ ምስለ፡ አበዊሁ
  choice: il reposa avec ses pères
  rationale: La formule funéraire littérale « dormit avec ses pères » est rendue par l’expression française digne et intelligible « reposa avec ses pères », sans expliciter davantage la mort.
- source_word: በዐት፡ ዘካዕበት
  choice: la grotte de Makpéla
  rationale: Le guèze signifie littéralement « la grotte double » et correspond au lieu ancestral connu sous le nom de Makpéla ; le nom propre est retenu dans le texte et le sens littéral signalé en note.
- source_word: ቅሩበ፡ አብርሃም፡ አቡሁ
  choice: près d’Abraham, son père
  rationale: Cette formulation conserve la relation spatiale exprimée par le texte et l’apposition « son père », malgré la tension narrative possible.
theological_decisions:
- issue: Formule décrivant la mort
  choice: « il reposa avec ses pères »
  alternative: « il dormit avec ses pères »
  rationale: La traduction choisie préserve la valeur funéraire traditionnelle sans suggérer inutilement un sommeil physique ordinaire ni développer une doctrine de l’au-delà.
- issue: Identification de « son père »
  choice: Conserver « Abraham, son père »
  alternative: Corriger ou expliciter la relation généalogique
  rationale: Le texte source rattache grammaticalement « son père » à Abraham. La traduction conserve cette difficulté au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe fluide, avec maintien des formules anciennes porteuses de sens et des tensions présentes dans la source.
