  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
translation:
  language: fr
  text: dans le tombeau qu’il s’était creusé dans la grotte double, au pays d’Hébron. Il donna tous ses livres ainsi que les livres de ses pères à son fils Lévi, afin qu’il les conserve et les renouvelle[a] pour ses enfants jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Les renouveler » peut désigner le fait de préserver ces livres en les recopiant, en les restaurant ou en les transmettant de nouveau aux générations suivantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: መቃብር
  choice: tombeau
  rationale: Rend directement le lieu de sépulture dans un registre narratif digne et naturel.
- source_word: ዘካዕበት
  choice: double
  rationale: Conserve le sens littéral traditionnel de la qualification de la grotte, sans l’identifier explicitement à un nom propre absent de ce segment.
- source_word: መጻሕፍቲሁ / መጻሕፍተ፡ አበዊሁ
  choice: ses livres / les livres de ses pères
  rationale: Maintient la distinction entre les écrits qui lui appartiennent et ceux transmis par ses ancêtres.
- source_word: ይዕቀቦን
  choice: les conserve
  rationale: Exprime la garde et la préservation des livres.
- source_word: ያሐድሶን
  choice: les renouvelle
  rationale: 'Préserve l’image lexicale du renouvellement et son ambiguïté quant au moyen concret : recopier, restaurer ou transmettre à nouveau.'
- source_word: ለውሉዱ
  choice: pour ses enfants
  rationale: Reproduit le sens descendant ou familial sans préciser davantage le référent du possessif, qui reste naturellement rattaché à Lévi.
