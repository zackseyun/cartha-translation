  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: fr
  text: de la part de son serviteur Jacob. « C’est une grande chose pour moi d’avoir vu ton visage alors que je suis encore vivant, car la vision que j’ai eue à Béthel s’est véritablement réalisée. Béni soit le Seigneur, mon Dieu, pour les siècles des siècles, et béni soit son nom ! »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ሊተ
  choice: C’est pour moi une grande joie
  rationale: Littéralement « grand pour moi » ; dans ce contexte de retrouvailles, cette formulation française exprime naturellement l’importance heureuse de l’événement sans alourdir la phrase.
- source_word: ዘርኢኩ፡ ገጸከ
  choice: d’avoir vu ton visage
  rationale: Conserve l’image sémitique du « visage » plutôt que de la réduire à « t’avoir revu ».
- source_word: አማን፡ ሀለወ
  choice: s’est véritablement accomplie
  rationale: Rend l’idée que la vision s’est avérée réelle ou confirmée par les événements ; « accomplie » convient naturellement à une vision devenue réalité.
- source_word: ለዓለመ፡ ዓለም
  choice: pour les siècles des siècles
  rationale: Formule française traditionnelle et digne qui reproduit l’intensification temporelle de l’expression guèze.
theological_decisions:
- issue: Forme de la bénédiction divine
  choice: Béni soit le Seigneur, mon Dieu
  alternative: Que le Seigneur, mon Dieu, soit béni
  rationale: La tournure retenue préserve la force doxologique du texte tout en restant naturelle en français, sans ajouter d’interprétation doctrinale.
- issue: Réalisation de la vision de Béthel
  choice: s’est véritablement accomplie
  alternative: a été véritablement établie
  rationale: « Accomplie » indique que les événements ont confirmé la vision, sans préciser davantage le mécanisme ni résoudre au-delà du texte la relation entre vision et réalisation.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe conserve la solennité de la bénédiction et l’image de « voir ton visage », tout en évitant un calque peu naturel de « grand pour moi ».
