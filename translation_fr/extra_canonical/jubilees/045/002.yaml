  text: fourth, in the second year of the third week of the forty-second[2] jubilee. And Joseph came to receive him.
translation:
  language: fr
  text: le quatrième[a], dans la deuxième année de la troisième semaine du quarante-deuxième[b] jubilé. Et Joseph vint le recevoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire « le quatrième mois »; le début de la phrase se trouve dans le verset précédent en raison du découpage des versets.
    reason: verse_segmentation
  - marker: b
    text: Le texte guèze porte littéralement « quarante-deuxième » (፵ወ፪), bien que la chronologie interne du livre des Jubilés exige le quarante-cinquième jubilé.
    reason: textual_variant
lexical_decisions:
- source_word: ራብዕ
  choice: le quatrième
  rationale: L’adjectif ordinal signifie « quatrième » et se rattache vraisemblablement au mois mentionné dans le verset précédent; il ne faut pas ajouter « année », qui contredirait « dans la deuxième année ».
- source_word: በካልእ፡ ዓመት፡ ዘሰብዓ፡ ሣልስ
  choice: dans la deuxième année de la troisième semaine
  rationale: Rend directement la structure chronologique du guèze tout en conservant la terminologie propre au système jubilaire.
- source_word: ዘ፵ወ፪ እዮቤልው
  choice: du quarante-deuxième jubilé
  rationale: Suit le nombre effectivement attesté dans le texte guèze, malgré la difficulté chronologique interne.
- source_word: ወመጽአ፡ ዮሴፍ፡ ይትቀበል
  choice: Et Joseph vint le recevoir
  rationale: Conserve la conjonction initiale, le mouvement exprimé par « vint » et le pronom objet implicite dont l’antécédent se trouve dans le contexte.
