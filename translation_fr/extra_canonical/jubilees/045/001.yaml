  text: And Israel entered the land of Egypt, into the land of Goshen, at the new moon of the fourth month.
translation:
  language: fr
  text: Israël entra dans le pays d’Égypte, dans la région de Goshen, à la nouvelle lune.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lors de l’apparition de la lune ». La nouvelle lune marquait le début du mois. Le texte guèze fourni ne précise pas « du quatrième mois ».'
    reason: La note conserve l’image calendaire de l’original et signale l’absence, dans le texte source fourni, de la précision présente dans la couche anglaise consultative.
lexical_decisions:
- source_word: ወቦአ፡ እስራኤል፡
  choice: Israël entra
  rationale: Le verbe guèze exprime l’entrée; le passé simple convient au registre narratif français et conserve l’ordre du récit.
- source_word: ውስተ፡ ብሔረ፡ ግብጽ፡
  choice: dans le pays d’Égypte
  rationale: « Pays » rend naturellement le terme territorial, tandis qu’« Égypte » conserve le nom géographique.
- source_word: ውስተ፡ ምድረ፡ ጌሤም፡
  choice: dans la région de Goshen
  rationale: La répétition de « dans » est conservée; « région » évite en français la lourdeur de « terre » tout en désignant le territoire de Goshen.
- source_word: አመ፡ ሠርቀ፡ ወርኅ፡
  choice: au début du mois
  rationale: L’expression signifie littéralement la montée ou l’apparition de la lune, d’où le commencement du mois lunaire. Le texte guèze fourni ne comporte pas « du quatrième mois ».
