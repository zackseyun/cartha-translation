  yaml_path: translation/extra_canonical/jubilees/045/014.yaml
  text: And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and he made known to them what would come upon them in later days.
translation:
  language: fr
  text: Avant de mourir, Israël bénit ses fils et leur raconta tout ce qui leur arriverait dans le pays d’Égypte ; il leur fit aussi connaître ce qui leur adviendrait dans les derniers jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘእንበለ፡ ይሙት
  choice: Avant de mourir
  rationale: Rend naturellement la proposition temporelle guèze tout en conservant son rapport à la mort prochaine d’Israël.
- source_word: ባረኮሙ
  choice: bénit
  rationale: Équivalent direct du verbe exprimant la bénédiction.
- source_word: ኵሎ፡ ዘኮነ፡ ይረክቦሙ
  choice: tout ce qui leur arriverait
  rationale: Restitue la totalité et la valeur prospective de ce qui devait les atteindre.
- source_word: አይድዖሙ (lecture corrigée de እይድያሙ)
  choice: il leur fit aussi connaître
  rationale: Suit la correction textuelle signalée, qui rétablit un second verbe déclaratif et le parallélisme de la phrase.
- source_word: በደኃሪ፡ መዋዕል
  choice: dans les derniers jours
  rationale: Expression eschatologique traditionnelle mais encore intelligible, plus fidèle que le simple « plus tard ».
- source_word: ይመጽእ፡ ላዕሌሆሙ
  choice: leur adviendrait
  rationale: Conserve l’idée de quelque chose venant sur eux sans produire en français une tournure pesante.
theological_decisions:
- issue: Portée eschatologique de « dans les derniers jours »
  choice: Conserver « dans les derniers jours »
  alternative: « dans les temps à venir » ou « par la suite »
  rationale: Le texte distingue le séjour en Égypte d’un horizon ultérieur et emploie une formule susceptible d’avoir une portée eschatologique ; il convient de ne pas l’atténuer.
translation_notes:
  register: Français moderne, clair et digne. Le point-virgule met en relief les deux actes de révélation parallèles. « Advienne » évite la répétition immédiate d’« arriver » tout en préservant le sens.
