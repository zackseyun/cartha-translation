  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
translation:
  language: fr
  text: En effet, pendant les sept années de famine, le fleuve n’avait pas débordé[a] et n’avait pas irrigué le pays, sauf en quelques endroits près de ses rives. Mais cette fois, il déborda ; les Égyptiens ensemencèrent le pays et récoltèrent une très grande quantité de blé cette année-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’était pas monté ».
    reason: Le verbe « remplir » appliqué au fleuve peut évoquer soit la montée des eaux, soit leur débordement.
lexical_decisions:
- source_word: ዐባር
  choice: famine
  rationale: Le contexte des sept années et la tradition textuelle indiquent la famine, rendue en français courant et précis.
- source_word: ኢመልአ / መልአ
  choice: n’avait pas débordé / déborda
  rationale: Le verbe signifie littéralement « remplir » et, appliqué au fleuve, décrit sa crue ou son débordement ; cette formulation conserve l’image hydrologique.
- source_word: ወኢሰቀየ
  choice: n’avait pas irrigué
  rationale: Le verbe ሰቀየ exprime l’action d’abreuver ou d’irriguer, et non simplement celle de monter.
- source_word: ግብጽ
  choice: les Égyptiens
  rationale: Le nom « Égypte » fonctionne ici comme collectif sujet de l’action de semer ; le français naturel explicite les habitants sans changer le sens.
- source_word: ሥርናየ
  choice: blé
  rationale: Le terme désigne spécifiquement le blé ou, plus largement, le grain ; « blé » convient au contexte agricole tout en restant idiomatique.
