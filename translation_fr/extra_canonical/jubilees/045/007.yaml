lexical_decisions:
- source_word: ሴሰዮሙ
  choice: pourvut aux besoins de
  rationale: Le verbe exprime l’action de nourrir ou d’entretenir. Cette tournure française naturelle permet de conserver un seul prédicat régissant le père, les frères et le bétail.
- source_word: ጥሪቶሙ
  choice: tout leur bétail
  rationale: Dans ce contexte, le terme désigne les animaux possédés par la famille, plutôt qu’un vague « tout ce qui leur appartenait ».
- source_word: በከመ፡ የአክሎሙ
  choice: en leur donnant ce qui leur suffisait
  rationale: Rend explicitement l’idée de suffisance exprimée par le texte, sans suggérer l’abondance.
- source_word: ለሰብዐቱ፡ ዓመታት፡ ዐባር
  choice: pendant les sept années de famine
  rationale: Traduction directe et idiomatique de la durée et de la famine.
