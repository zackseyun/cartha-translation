  yaml_path: translation/extra_canonical/jubilees/045/006.yaml
  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
translation:
  language: fr
  text: Joseph donna à son père et à ses frères une propriété afin qu’ils habitent dans le pays de Goshen, à Ramsès et dans tout son territoire, dont il assurait l’administration devant le pharaon.[a] Israël et ses fils s’établirent dans le pays de Goshen, la meilleure partie du pays d’Égypte. Israël avait cent trente ans lorsqu’il entra en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il gouvernait devant le pharaon » ou « qu’il administrait en présence du pharaon » ; l’expression peut décrire l’exercice de son autorité devant le pharaon ou à son service.'
    reason: Le verbe signifie gouverner ou administrer. La portée relationnelle de « devant le pharaon » reste ambiguë et ne doit pas être réduite à une approbation ni explicitée comme une délégation.
lexical_decisions:
- source_word: ሀብተ
  choice: une propriété
  rationale: Le nom désigne ici un bien ou domaine accordé à la famille de Joseph; « propriété » rend naturellement cette possession foncière.
- source_word: ይኅደሩ / ኀደረ
  choice: habitent / s’établirent
  rationale: Le même champ verbal exprime le fait de demeurer; la variation française distingue naturellement le but de l’installation et sa réalisation.
- source_word: ምሥናይሃ
  choice: la meilleure partie
  rationale: Dans ce contexte, le terme qualifie Goshen comme la portion la plus favorable du pays d’Égypte.
- source_word: ይኴንን
  choice: gouvernait
  rationale: Le verbe ኰነነ signifie gouverner ou administrer; il ne signifie pas « approuver ».
theological_decisions:
- issue: Rapport de Joseph au pharaon dans la proposition relative
  choice: « qu’il gouvernait devant le pharaon »
  alternative: « qu’il gouvernait sous l’autorité du pharaon »
  rationale: La traduction conserve le sens gouvernemental du verbe et rend formellement በቅድሜሁ ለፈርዖን, sans transformer explicitement la relation en délégation d’autorité.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises courantes. « Le pharaon » est employé comme titre; la formulation garde l’ambiguïté de la relation institutionnelle sans reprendre la lecture non étayée « comme cela avait été approuvé ».
