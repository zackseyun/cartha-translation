  to: Joseph donna à son père et à ses frères une propriété afin qu’ils habitent dans le pays de Goshen, à Ramsès et dans tout son territoire, dont il assurait l’administration devant le pharaon.[a] Israël et ses fils s’établirent dans le pays de Goshen, la meilleure partie du pays d’Égypte. Israël avait cent trente ans lorsqu’il entra en Égypte.
