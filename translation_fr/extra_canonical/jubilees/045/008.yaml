  text: And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and he acquired the people, their livestock, and everything for Pharaoh.
translation:
  language: fr
  text: Le pays d’Égypte souffrit à cause de la famine, et Joseph acquit pour le pharaon tout le pays d’Égypte en échange de céréales ; il acquit aussi pour le pharaon les habitants, leur bétail et tout le reste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐመተ
  choice: souffrit
  rationale: Le verbe exprime ici la détresse que la famine fait subir au pays; « souffrit » est naturel et garde la personnification du territoire.
- source_word: በእክል
  choice: en échange de céréales
  rationale: La préposition et le nom indiquent le moyen ou la contrepartie de l’acquisition; « céréales » convient mieux que le singulier collectif « grain » en français courant.
- source_word: ሰብአኒ
  choice: ainsi que les habitants
  rationale: ሰብእ désigne les gens, et la particule -ኒ ajoute l’idée de « aussi »; dans ce contexte territorial, « les habitants » est idiomatique.
- source_word: እንስሳሆሙኒ
  choice: leur bétail
  rationale: Le terme désigne les animaux qui leur appartiennent, avec la particule additive -ኒ; « bétail » convient au contexte économique.
- source_word: ኵሎ አጥሪየ
  choice: tous leurs biens
  rationale: 'La forme est textuellement difficile: አጥሪየ peut être comprise en lien avec l’acquisition, mais la coordination finale se prête aussi au sens de l’ensemble des biens. La note conserve l’autre analyse possible.'
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Le pharaon » suit l’usage français naturel; la phrase est divisée en deux pour éviter une coordination trop lourde tout en conservant la progression du texte source.
