  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: fr
  text: Après que Jacob se fut levé pour partir en Mésopotamie, l’esprit de Rébecca s’attrista au sujet de son fils, et elle pleura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥአ
  choice: se fut levé
  rationale: Rend le verbe « se lever » dans une proposition temporelle antérieure, en français naturel et soutenu.
- source_word: ሰሐዊረ
  choice: pour partir
  rationale: Exprime le mouvement envisagé vers la Mésopotamie sans alourdir la phrase par une tournure littérale.
- source_word: መስጶጦሚያ
  choice: Mésopotamie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom géographique.
- source_word: ሐዘነ፡ መንፈሰ፡ ርብቃ
  choice: l’esprit de Rébecca s’attrista
  rationale: Conserve explicitement « l’esprit » et le présente comme sujet de l’affliction, conformément à la formulation de la source.
- source_word: ድኅረ፡ ወልዳ
  choice: au sujet de son fils
  rationale: Rend la relation de chagrin concernant le fils sans transformer implicitement la phrase en deuil après sa mort.
- source_word: ወትበኪ
  choice: et elle pleura
  rationale: Traduction directe et naturelle de l’action de pleurer.
theological_decisions:
- issue: Sens de « l’esprit de Rébecca »
  choice: Conserver la mention explicite de son esprit
  alternative: Rébecca s’attrista
  rationale: La source distingue l’esprit de Rébecca de sa personne prise globalement; la traduction préserve cette anthropologie sans l’interpréter davantage.
- issue: Nature du chagrin éprouvé pour le fils
  choice: « au sujet de son fils »
  alternative: « à cause de son fils » ou « sur son fils »
  rationale: Cette formulation préserve la relative indétermination de la relation exprimée et évite de suggérer soit un reproche causal, soit un deuil funèbre.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé antérieur « se fut levé » convient à la narration littéraire et marque clairement l’antériorité; « partir » est plus idiomatique ici que « aller » tout en conservant l’idée du déplacement.
