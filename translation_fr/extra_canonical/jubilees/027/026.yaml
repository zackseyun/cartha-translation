  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
translation:
  language: fr
  text: Ta descendance sera comme la poussière de la terre, et tu t’étendras vers la mer[a], vers l’est, vers le nord et vers le sud. Tous les pays des nations seront bénis en toi et en ta descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mer désigne ici la direction de l’ouest.
    reason: Le texte source dit littéralement « la mer » dans une série de points cardinaux; la note explicite l’idiome sans le remplacer dans le corps du texte.
lexical_decisions:
- source_word: ዘርእከ (zarʾaka)
  choice: ta descendance
  rationale: Le nom désigne ici la postérité d’une personne. « Descendance » est naturel en français et conserve la valeur collective du terme.
- source_word: ባሕር (bāḥr)
  choice: la mer
  rationale: Le texte guèze nomme littéralement « la mer ». Cette formulation préserve l’image directionnelle traditionnelle au lieu de la remplacer directement par « l’ouest ».
- source_word: በሐውርተ አሕዛብ (baḥāwrta ʾaḥzāb)
  choice: les pays des nations
  rationale: Le pluriel ሐውርት renvoie ici à des pays ou territoires, et non à des familles. « Nations » rend አሕዛብ sans imposer une lecture ethnique plus précise.
theological_decisions:
- issue: Portée de la bénédiction
  choice: seront bénis
  alternative: se béniront
  rationale: La forme verbale du texte est rendue passivement, sans transformer la bénédiction reçue en formule réflexive ni préciser son mécanisme.
- issue: Double médiation de la bénédiction
  choice: en toi et en ta descendance
  alternative: par toi et par ta descendance
  rationale: « En » conserve la formulation et la tension théologique du texte, sans décider si la relation doit être comprise comme instrumentale.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle de la bénédiction est conservée, avec une syntaxe naturelle et sans archaïsmes.
