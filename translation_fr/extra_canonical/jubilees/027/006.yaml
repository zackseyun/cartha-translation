  yaml_path: translation/extra_canonical/jubilees/027/006.yaml
  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: fr
  text: 'Jacob dit à Rébecca, sa mère : « Regarde, tu sais que mon père est devenu vieux et qu’il ne voit plus, car ses yeux se sont affaiblis. Si je le quitte, ce sera mal à ses yeux, parce que je l’aurai abandonné et que je me serai éloigné de vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ፡ ታእምሪ
  choice: Tu sais
  rationale: Dans ce contexte, ናሁ attire l’attention sur un fait connu de Rébecca; « Tu sais » rend naturellement l’ensemble sans ajouter un « voici » lourd en français.
- source_word: ረሰአ፡ አቡየ
  choice: mon père est devenu vieux
  rationale: Rend directement l’idée du vieillissement exprimée par le texte guèze.
- source_word: ክቡዳ፡ አዕይንቲሁ
  choice: ses yeux se sont affaiblis
  rationale: Expression française naturelle qui conserve l’image des yeux devenus lourds ou déficients et explique qu’il ne voit plus.
- source_word: ኀደግዎ / አኀድጎ
  choice: je le quitte / je l’aurai abandonné
  rationale: 'Le même champ verbal est rendu selon le contexte : d’abord l’éventualité de quitter Isaac, puis le reproche plus fort d’avoir délaissé ou abandonné celui-ci.'
- source_word: ወአሐውር፡ እምኔክሙ
  choice: et que je serai parti loin de vous
  rationale: Conserve le mouvement d’éloignement et le pluriel du suffixe final, qui renvoie à « vous » plutôt qu’à Rébecca seule.
theological_decisions:
- issue: Nature morale du départ de Jacob
  choice: « ce sera mal à ses yeux »
  alternative: « il le prendra mal »
  rationale: La formulation retenue préserve l’évaluation subjective d’Isaac explicitement marquée par « à ses yeux », sans transformer cette réaction en jugement moral absolu.
- issue: Référent du pluriel final
  choice: « loin de vous »
  alternative: « loin de toi »
  rationale: Le suffixe guèze est pluriel. La traduction maintient cette donnée, malgré l’adresse immédiate à Rébecca et l’ambiguïté possible concernant le groupe visé.
translation_notes:
  register: Français moderne, international et digne. Syntaxe claire, avec maintien de la répétition causale et de la tension entre le départ envisagé et le sentiment d’abandon qu’il provoquerait chez Isaac.
