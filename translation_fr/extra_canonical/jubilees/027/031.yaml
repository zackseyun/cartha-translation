  yaml_path: translation/extra_canonical/jubilees/027/031.yaml
  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: fr
  text: et que je retourne en paix à la maison de mon père, alors le Seigneur sera mon Dieu. Cette pierre que j’ai dressée comme stèle, en signe dans ce lieu, sera la maison du Seigneur. Et de tout ce que tu me donneras, je t’en donnerai assurément un dixième, mon Dieu.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአትመየጥ
  choice: et que je retourne
  rationale: Le verbe exprime le retour; la tournure avec «que» conserve son intégration à la condition commencée dans le contexte précédent.
- source_word: በሰላም
  choice: en paix
  rationale: Rend directement l’idée de retour sain et sauf, tout en conservant la formulation traditionnelle et ouverte de «paix».
- source_word: ሐውልተ፡ ለትእምርት
  choice: comme stèle, en signe
  rationale: «Stèle» rend l’objet dressé, tandis que «en signe» conserve explicitement sa fonction mémorielle ou symbolique.
- source_word: ቤተ፡ እግዚአብሔር
  choice: la maison du Seigneur
  rationale: Traduction formelle de l’expression, sans préciser s’il s’agit ici d’un sanctuaire, d’un lieu sacré ou d’une institution cultuelle.
- source_word: አሡር፡ ለከ
  choice: je te donnerai certainement le dixième
  rationale: Rend l’engagement de remettre la dîme et la force emphatique de la construction verbale.
theological_decisions:
- issue: Portée conditionnelle de «le Seigneur sera mon Dieu»
  choice: «alors le Seigneur sera mon Dieu»
  alternative: «le Seigneur sera mon Dieu» sans «alors»
  rationale: «Alors» rend le lien avec la condition formulée dans ce verset et les précédents, sans expliquer ni atténuer la tension théologique de la déclaration.
- issue: Identification de la pierre à la maison du Seigneur
  choice: conserver «cette pierre… sera la maison du Seigneur»
  alternative: expliciter «ce lieu deviendra un sanctuaire du Seigneur»
  rationale: La formulation source établit une identification frappante; l’expliciter résoudrait indûment son caractère symbolique ou cultuel.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle, la répétition du titre divin et la tension entre la pierre dressée et la «maison du Seigneur» sont préservées. Guillemets fermants inclus, le verset achevant un discours direct commencé auparavant.
