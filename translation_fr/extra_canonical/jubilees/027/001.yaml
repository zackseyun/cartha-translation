revisions:
- from: 'L’affaire d’Ésaü, son fils aîné, fut révélée à Rébecca dans un rêve. Rébecca envoya chercher Jacob, son fils cadet, et lui dit : « Écoute, ton frère Ésaü nourrit de la rancune contre toi et veut te tuer. »'
  to: 'L’affaire d’Ésaü, son fils aîné, fut rapportée à Rébecca dans un rêve. Rébecca envoya appeler Jacob, son fils cadet, et lui dit : « Voici, ton frère Ésaü nourrit de la rancune contre toi pour te tuer. »'
  rationale: Révision légère visant une fidélité plus précise au passif guèze et à la double action par laquelle Rébecca fait appeler Jacob. Le sens hostile du verbe est maintenu conformément au témoin guèze et à l’audit anglais; aucune note n’est nécessaire, car le texte français ne choisit pas l’idiome alternatif « se consoler à ton sujet ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T21:25:47Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement ነገሩ par « l’affaire », les qualifications d’Ésaü et de Jacob, ainsi que ይትቄየመከ par l’idée de rancune. Elle évite à juste titre la rétroversion de l’idiome hébreu du parallèle de Genèse. Toutefois, « fut révélée » est un peu plus marqué que le passif non spécifiquement révélatoire « fut rapportée / fut annoncée », et « envoya chercher » ne rend pas aussi explicitement la séquence « envoya et appela ».
  naturalness: Le français est globalement fluide et de registre narratif moderne. « Voici » correspond plus directement et naturellement à l’interjection ናሁ dans ce contexte que « Écoute ». « Envoya appeler » est idiomatique tout en conservant l’idée que Rébecca fit venir Jacob.
  terminology: Les noms Ésaü, Rébecca et Jacob sont conformes à l’usage biblique français. « Nourrit de la rancune contre toi » exprime bien l’hostilité persistante du verbe guèze. La tournure finale « pour te tuer » conserve la relation de but exprimée par ከመ sans surinterpréter le texte.
  issues:
  - severity: low
    issue: « fut révélée » surdétermine légèrement l’acte de communication.
    rationale: Le guèze indique que l’affaire fut dite/rapportée à Rébecca en rêve, sans caractériser explicitement cette communication comme une « révélation ». « Fut rapportée » préserve mieux cette neutralité.
  - severity: low
    issue: « envoya chercher Jacob » atténue la double action « envoya et appela ».
    rationale: « Envoya appeler Jacob » est une formulation française naturelle qui maintient plus clairement l’initiative de Rébecca et l’appel de Jacob.
  - severity: low
    issue: « Écoute » est un rendu moins direct de ናሁ.
    rationale: Dans cette formule d’avertissement, « Voici » rend plus près l’attention attirée par l’interjection, sans changement de registre.
  revised_text: 'L’affaire d’Ésaü, son fils aîné, fut rapportée à Rébecca dans un rêve. Rébecca envoya appeler Jacob, son fils cadet, et lui dit : « Voici, ton frère Ésaü nourrit de la rancune contre toi pour te tuer. »'
  revised_footnotes: []
