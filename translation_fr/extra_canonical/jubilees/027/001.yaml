  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
translation:
  language: fr
  text: 'L’affaire d’Ésaü, son fils aîné, fut rapportée à Rébecca dans un rêve. Rébecca envoya appeler Jacob, son fils cadet, et lui dit : « Voici, ton frère Ésaü nourrit de la rancune contre toi pour te tuer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተነግረ ... በሕልም
  choice: fut révélée ... dans un rêve
  rationale: Le passif signifie que l’information fut communiquée à Rébecca; « révélée » convient naturellement au cadre onirique sans préciser qui en est l’auteur.
- source_word: ነገሩ
  choice: L’affaire
  rationale: Le terme renvoie ici à ce qui concerne Ésaü plutôt qu’à des paroles explicitement citées.
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: aîné / cadet
  rationale: Ces choix rendent naturellement en français la distinction entre le fils plus grand/âgé et le plus petit/jeune.
- source_word: ይትቄየመከ
  choice: nourrit de la rancune contre toi
  rationale: Le verbe guèze exprime le fait de garder rancune ou d’être vindicatif; cette traduction évite de rétrovertir l’idiome hébreu parallèle « se console à ton sujet ».
- source_word: ከመ፡ ይቅትልከ
  choice: et veut te tuer
  rationale: Dans ce contexte, la proposition exprime la visée meurtrière de la rancune; cette formulation est claire et idiomatique en français.
theological_decisions:
- issue: Origine de la révélation onirique
  choice: 'Employer un passif sans agent : « fut révélée »'
  alternative: « Dieu révéla » ou « on raconta »
  rationale: Le texte ne nomme pas explicitement l’auteur de la communication; le passif préserve cette indétermination.
- issue: Rapport au parallèle de Genèse 27.42
  choice: Traduire directement le verbe guèze par l’idée de rancune
  alternative: « se console à ton sujet »
  rationale: Le témoin guèze emploie un verbe de rancune ou d’hostilité et ne reproduit pas l’idiome hébreu; la traduction suit donc la source fournie.
translation_notes:
  register: Français international moderne, narratif et digne. « Écoute » rend l’interpellation ናሁ de façon naturelle; la coordination est légèrement fluidifiée sans supprimer le contenu du verset.
