review_pass:
  verdict: revise
  source_fidelity: 'Le texte guèze décrit Jacob rêvant cette nuit-là : une échelle est établie sur la terre, son sommet atteint le ciel, les anges de Dieu y montent et y descendent, et Dieu se tient « sur elle / en elle ». La traduction rend correctement les éléments principaux, y compris « Dieu » et « sur elle ». Toutefois, « en descendaient » est moins fidèle au même repère spatial que le guèze et que la première proposition (« y montaient ») ; « y descendaient » est préférable. La note proposant « au-dessus d’elle » est trop affirmative au regard de ውስቴታ, qui soutient directement « sur elle » ou éventuellement « en elle », non « au-dessus ».'
  naturalness: Le français est naturel, moderne et d’un registre approprié. « Cette nuit-là, il fit un rêve » est fluide. La répétition narrative de « voici que » est bien dosée. Employer « y montaient et y descendaient » produit un parallélisme plus net et évite l’ambiguïté de « en descendaient ».
  terminology: « échelle », « anges de Dieu » et « Dieu » sont exacts et cohérents. « était dressée sur la terre » rend bien l’idée d’une échelle établie/placée. « Dieu se tenait sur elle » respecte le sens spatial le plus directement attesté. La note ne doit pas privilégier une alternative insuffisamment fondée par le guèze.
  issues:
  - severity: medium
    issue: Repère spatial non parallèle dans « y montaient et en descendaient »
    rationale: Le pronom guèze renvoie dans les deux verbes à l’échelle. En français, « y montaient et y descendaient » conserve explicitement le même complément locatif et le parallélisme de la source.
  - severity: medium
    issue: 'Note « Ou : au-dessus d’elle » insuffisamment soutenue'
    rationale: La forme ውስቴታ signifie directement « en elle / sur elle ». « Au-dessus d’elle » reflète une harmonisation interprétative avec des traditions parallèles plutôt qu’une alternative lexicale directe ; la présenter comme équivalent textuel risque de masquer cette distinction.
  revised_text: 'Cette nuit-là, il fit un rêve : voici qu’une échelle était dressée sur la terre et que son sommet atteignait le ciel. Des anges de Dieu y montaient et y descendaient, et voici que Dieu se tenait sur elle.'
  revised_footnotes: []
  revision_rationale: La révision remplace « en descendaient » par « y descendaient » pour rendre le parallélisme spatial du guèze. Elle retire la note sur « au-dessus d’elle », car cette formulation n’est pas une alternative directement portée par ውስቴታ et introduit une interprétation issue de la scène parallèle. Aucun autre changement de sens n’est nécessaire.
