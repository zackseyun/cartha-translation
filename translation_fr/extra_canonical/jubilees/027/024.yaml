revisions:
- from: 'Cette nuit-là, il fit un rêve : voici qu’une échelle était dressée sur la terre et que son sommet atteignait le ciel. Des anges de Dieu y montaient et en descendaient, et voici que Dieu se tenait sur elle.[a]'
  to: 'Cette nuit-là, il fit un rêve : voici qu’une échelle était dressée sur la terre et que son sommet atteignait le ciel. Des anges de Dieu y montaient et y descendaient, et voici que Dieu se tenait sur elle.'
  rationale: La révision remplace « en descendaient » par « y descendaient » pour rendre le parallélisme spatial du guèze. Elle retire la note sur « au-dessus d’elle », car cette formulation n’est pas une alternative directement portée par ውስቴታ et introduit une interprétation issue de la scène parallèle. Aucun autre changement de sens n’est nécessaire.
  reviewer_model: gpt-5.6-terra
