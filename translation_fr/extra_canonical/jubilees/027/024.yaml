  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
translation:
  language: fr
  text: 'Cette nuit-là, il fit un rêve : voici qu’une échelle était dressée sur la terre et que son sommet atteignait le ciel. Des anges de Dieu y montaient et y descendaient, et voici que Dieu se tenait sur elle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዓርግ
  choice: échelle
  rationale: Le nom désigne ici le moyen vertical reliant la terre au ciel; « échelle » correspond au contexte du songe et à la tradition textuelle parallèle.
- source_word: ትክልት
  choice: était dressée
  rationale: Cette forme exprime quelque chose d’établi ou de placé debout; « était dressée » est naturel en français et conserve l’image verticale.
- source_word: እግዚአብሔር
  choice: Dieu
  rationale: Dans les deux occurrences, le terme désigne Dieu; ce choix convient notamment au syntagme « anges de Dieu » et assure la cohérence interne du verset.
- source_word: ውስቴታ
  choice: sur elle
  rationale: Le pronom renvoie grammaticalement à l’échelle; la préposition peut exprimer une position sur ou en elle, et « sur elle » suit au plus près la formulation guèze sans introduire « au-dessus ».
theological_decisions:
- issue: Position de Dieu par rapport à l’échelle
  choice: Dieu se tenait sur elle
  alternative: Dieu se tenait au-dessus d’elle
  rationale: Le guèze ውስቴታ soutient plus directement « sur elle / en elle » que « au-dessus d’elle ». La note signale néanmoins l’autre compréhension possible de la scène sans la substituer au texte principal.
translation_notes:
  register: Français moderne, clair et digne. « Voici que » conserve la force narrative de ወናሁ sans répéter lourdement la formule à chaque proposition; sa seconde occurrence est maintenue avant l’apparition de Dieu. Le féminin des pronoms renvoie explicitement à « l’échelle ».
