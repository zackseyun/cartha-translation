    rationale: « Arriver en un certain lieu » est un calque inhabituel. « Arriver à un certain endroit » est naturel et conserve la valeur indéfinie de መካነ፡ መሴየ.
  - severity: low
    issue: La formulation du détour suggère une destination plus fortement que le source
    rationale: « Pour se rendre à l’ouest de la route » peut faire entendre qu’il avait pour but d’atteindre un lieu. « S’écarta de son chemin vers l’ouest de la route » rend le mouvement tout en préservant l’ambiguïté syntaxique, documentée par la note.
