  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
translation:
  language: fr
  text: Jacob partit du Puits du Serment pour aller à Harrân, la première année de la deuxième semaine du quarante-quatrième jubilé. Il arriva à Louz, qui se trouve dans la région montagneuse, c’est-à-dire Béthel, à la nouvelle lune du premier mois de cette semaine. Le soir, il arriva à un certain endroit et, cette nuit-là, il s’écarta de son chemin vers l’ouest de la route[a]. Il dormit là, car le soleil s’était couché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens de l’expression guèze est difficile. Autre traduction possible : « il s’écarta de son chemin cette nuit-là ».'
    reason: La syntaxe de l’expression directionnelle peut être comprise comme précisant un déplacement vers l’ouest de la route, mais une lecture plus générale, sans indication de direction, est aussi attestée.
lexical_decisions:
- source_word: ዐዘቆተ፡ መሐላ
  choice: Puits du Serment
  rationale: Rend le nom descriptif guèze de Beer-Shéba tout en conservant son caractère toponymique.
- source_word: ሐራን
  choice: Harrân
  rationale: Translittération française courante du toponyme ancien.
- source_word: ሱባዔ
  choice: semaine
  rationale: Le terme désigne ici une unité chronologique de sept ans dans le comput des Jubilés; «semaine» préserve la formulation propre au livre.
- source_word: ሠርቀ፡ ወርኅ
  choice: nouvelle lune
  rationale: Expression calendaire désignant le commencement du mois.
- source_word: መካነ፡ መሴየ
  choice: un certain lieu
  rationale: Reflète la valeur indéfinie du syntagme sans l’identifier davantage.
- source_word: እምፍኖቱ
  choice: son chemin
  rationale: Le suffixe de troisième personne masculin singulier justifie le possessif.
- source_word: እንተ፡ ዐረበን፡ ለመንገደ
  choice: pour se rendre à l’ouest de la route
  rationale: Conserve l’indication directionnelle présente dans le texte guèze, tout en signalant en note la difficulté syntaxique.
