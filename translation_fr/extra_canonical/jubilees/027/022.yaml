revisions:
- from: Jacob partit du Puits du Serment pour aller à Harrân, la première année de la deuxième semaine du quarante-quatrième jubilé. Il arriva à Louz, qui se trouve dans la montagne, c’est-à-dire Béthel, à la nouvelle lune du premier mois de cette semaine. Le soir, il arriva en un certain lieu et, cette nuit-là, il quitta son chemin pour se rendre à l’ouest de la route[a]. Il dormit là, car le soleil s’était couché.
  to: Jacob partit du Puits du Serment pour aller à Harrân, la première année de la deuxième semaine du quarante-quatrième jubilé. Il arriva à Louz, qui se trouve dans la région montagneuse, c’est-à-dire Béthel, à la nouvelle lune du premier mois de cette semaine. Le soir, il arriva à un certain endroit et, cette nuit-là, il s’écarta de son chemin vers l’ouest de la route[a]. Il dormit là, car le soleil s’était couché.
  rationale: Révision stylistique limitée pour un français moderne plus naturel et pour éviter que la tournure du détour ne surinterprète le mouvement comme l’atteinte délibérée d’une destination. La note conserve explicitement l’ambiguïté textuelle et son ancrage demeure immédiatement après l’expression concernée.
