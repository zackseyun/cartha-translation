  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: fr
  text: Le Dieu Très-Haut le gardera de tout mal et sera avec lui, car il ne l’abandonnera pas tous les jours de sa vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: Le Dieu Très-Haut
  rationale: Rend directement le titre divin composé, dans un ordre naturel en français.
- source_word: የዐቅቦ
  choice: le gardera
  rationale: Le verbe exprime l’idée de garder ou protéger; « gardera » conserve la formulation sobre du texte.
- source_word: እምኵሉ፡ እኩይ
  choice: de tout mal
  rationale: Reproduit la portée générale de « tout mal » sans préciser s’il s’agit du mal moral, du malheur ou du danger.
- source_word: ወይሄሉ፡ ምስሌሁ
  choice: et sera avec lui
  rationale: Traduction directe de la présence divine exprimée dans la source.
- source_word: እስመ፡ ኢየኀድጎ
  choice: car il ne l’abandonnera pas
  rationale: Conserve le lien causal et le sens de ne pas laisser ou abandonner.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: de toute sa vie
  rationale: Littéralement « tous ses jours »; l’expression française naturelle « de toute sa vie » en communique ici la durée entière.
theological_decisions:
- issue: Nature de la protection promise
  choice: de tout mal
  alternative: de tout malheur
  rationale: Le terme source reste assez large; « mal » préserve l’ambiguïté entre adversité, danger et mal au sens général.
- issue: Durée de la présence et de la fidélité divines
  choice: de toute sa vie
  alternative: tous les jours de sa vie
  rationale: La formulation retenue exprime naturellement l’ensemble des jours de l’intéressé sans ajouter une idée d’éternité.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase conserve le parallélisme de la promesse: protection, présence et non-abandon.'
