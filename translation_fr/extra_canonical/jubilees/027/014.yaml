  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
translation:
  language: fr
  text: Qu’il te donne les bénédictions de mon père Abraham, à toi et à ta descendance après toi, afin que tu hérites du pays où tu séjournes et de tout le pays que Dieu a donné à Abraham. Va, mon fils, en paix. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከታቲሁ
  choice: les bénédictions
  rationale: La forme guèze est plurielle et porte un suffixe possessif; le français rend donc « les bénédictions de mon père Abraham », sans harmoniser avec le singulier du parallèle de la Genèse.
- source_word: ዘርእከ
  choice: ta descendance
  rationale: « Descendance » rend naturellement le nom collectif « semence/postérité » en français moderne.
- source_word: ትረሰ
  choice: tu prennes possession
  rationale: Cette expression rend l’idée d’hériter et d’entrer en possession du pays, avec un français idiomatique.
- source_word: ምድረ፡ ፍልሰትከ
  choice: le pays où tu séjournes
  rationale: Rend le territoire du séjour comme résident étranger, sans suggérer qu’il s’agit déjà de sa propriété.
- source_word: በሰላም
  choice: en paix
  rationale: Expression française directe et naturelle correspondant à la formule de départ.
theological_decisions:
- issue: Nombre de la bénédiction d’Abraham
  choice: les bénédictions
  alternative: la bénédiction
  rationale: Le pluriel attesté par le texte guèze est conservé, malgré le singulier du parallèle canonique de Genèse 28.4.
- issue: Portée de l’héritage territorial
  choice: le pays où tu séjournes et tout le pays que Dieu a donné à Abraham
  alternative: fusionner les deux expressions en un seul territoire
  rationale: La coordination du texte source est maintenue afin de ne pas effacer une éventuelle distinction ou amplification.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la bénédiction paternelle tout en évitant les archaïsmes comme « postérité » et « terre de tes pérégrinations ».
