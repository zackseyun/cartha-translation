  source_fidelity: Le pluriel « les bénédictions » rend correctement በረከታቲሁ, et la double référence au pays du séjour et à tout le pays donné à Abraham est conservée. Toutefois, « prendre possession » explicite et infléchit le sens de ትረሰ (« hériter ») ; « hériter » est à la fois plus direct et plus fidèle au texte source.
