  to: Qu’il te donne les bénédictions de mon père Abraham, à toi et à ta descendance après toi, afin que tu hérites du pays où tu séjournes et de tout le pays que Dieu a donné à Abraham. Va, mon fils, en paix. »
  rationale: La révision remplace une explicitation interprétative par le verbe français « hériter », qui correspond directement au verbe source, et ajuste légèrement la ponctuation de l’adresse finale. Le pluriel « bénédictions » et la coordination des deux expressions territoriales sont maintenus.
