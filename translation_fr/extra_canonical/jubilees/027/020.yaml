  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
translation:
  language: fr
  text: « Ne crains rien pour lui, ma sœur, car il est droit dans sa conduite,[a] c’est un homme irréprochable et fidèle, et il ne sera pas abandonné. Ne pleure pas. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans sa voie » ou « sur son chemin ».
    reason: Le guèze emploie un nom singulier désignant la voie ou le chemin ; la traduction principale en donne le sens moral idiomatique.
lexical_decisions:
- source_word: ሪትዕ
  choice: droit
  rationale: Rend naturellement l’idée de rectitude morale exprimée par le terme guèze.
- source_word: በፍኖቱ
  choice: dans sa conduite
  rationale: Le nom est au singulier (« dans sa voie »). « Dans sa conduite » conserve ce sens tout en étant idiomatique en français.
- source_word: ፍጹም ውእቱ ብእሲ
  choice: c’est un homme irréprochable
  rationale: « Irréprochable » exprime ici l’intégrité ou l’absence de faute, sans suggérer une perfection absolue.
- source_word: ምእመን
  choice: fidèle
  rationale: Équivalent direct qui préserve la portée possible de fiabilité et de fidélité.
- source_word: ወኢይትገደፍ
  choice: et il ne sera pas abandonné
  rationale: Conserve explicitement le verbe omis dans une version antérieure et son sens passif futur.
theological_decisions:
- issue: Agent implicite de l’abandon
  choice: il ne sera pas abandonné
  alternative: Dieu ne l’abandonnera pas
  rationale: Le texte ne nomme pas l’agent; la tournure passive préserve cette indétermination et évite d’expliciter une interprétation théologique.
translation_notes:
  register: Français international moderne, simple et digne. Le discours direct est ponctué selon l’usage français. La répétition des propositions du texte source est légèrement lissée sans supprimer aucun élément de sens.
