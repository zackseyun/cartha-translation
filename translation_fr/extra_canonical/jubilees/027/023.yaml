  text: And he took one of the stones of that place and put it under that tree, and he was traveling alone, and he slept.
translation:
  language: fr
  text: Il prit une des pierres de cet endroit et la plaça sous cet arbre. Il voyageait seul[a], puis il s’endormit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « marchait seul ».'
    reason: Le verbe guèze የሐውር peut désigner le fait d’aller, de marcher ou de voyager. « Voyageait » convient au contexte, tandis que la note préserve une autre compréhension possible.
lexical_decisions:
- source_word: የሐውር (yaḥawwer)
  choice: il voyageait
  rationale: Le verbe peut signifier aller, marcher ou voyager. Dans le contexte du déplacement de Jacob vers Harân, « voyageait » exprime naturellement le trajet sans le réduire au seul fait de marcher.
- source_word: ኖመ (noma)
  choice: il s’endormit
  rationale: Le verbe signifie dormir; dans cette suite narrative, l’inchoatif français « s’endormit » est naturel et marque le passage du voyage au sommeil.
- source_word: ውእቱ ዕፅ (wəʾətu ʿəṣ)
  choice: cet arbre
  rationale: Le démonstratif est conservé par « cet », plutôt que nivelé en article défini.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La coordination guèze est rendue par deux phrases et « puis » afin d’éviter une succession lourde de « et », tout en préservant l’ordre narratif.
