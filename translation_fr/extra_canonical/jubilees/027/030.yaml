  text: And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,
translation:
  language: fr
  text: 'Jacob pria le Seigneur en disant : « Si le Seigneur est avec moi, s’il me garde sur ce chemin que je parcours et me donne du pain à manger et des vêtements pour me vêtir,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሎተ
  choice: cette prière
  rationale: Le nom signifie « prière ». Avec ጸለየ, la répétition sémitique « pria une prière » est rendue naturellement en français par « adressa cette prière ».
- source_word: ለእግዚአብሔር
  choice: au Seigneur
  rationale: Le datif indique le destinataire de la prière; « Seigneur » est l’équivalent français traditionnel et intelligible.
- source_word: ፍኖት
  choice: chemin
  rationale: Le terme désigne une voie ou un chemin; « chemin » convient au contexte du voyage de Jacob.
- source_word: ዐቀበኒ
  choice: me garde
  rationale: Le verbe exprime l’action de garder, protéger ou préserver; « me garde » conserve la formulation biblique sans surinterpréter.
- source_word: ኅብስተ
  choice: du pain
  rationale: Le terme désigne le pain et, par extension, la nourriture; le choix littéral préserve le parallélisme concret du texte.
- source_word: ልብሰ
  choice: des vêtements
  rationale: Le nom peut désigner un vêtement ou l’habillement; le pluriel idiomatique français exprime naturellement ce qui est nécessaire pour se vêtir.
theological_decisions:
- issue: Valeur de la condition introduite par እመ (« si »)
  choice: Conserver « Si le Seigneur est avec moi »
  alternative: « Puisque le Seigneur est avec moi » ou « Que le Seigneur soit avec moi »
  rationale: La source formule explicitement une condition. La traduction maintient la tension du vœu de Jacob sans transformer celle-ci en affirmation certaine ni en simple souhait.
- issue: Répétition conditionnelle devant le verbe « garder »
  choice: « s’il me garde »
  alternative: « et me garde »
  rationale: La répétition de « si » rend plus clairement en français que les actions coordonnées demeurent dans la portée de la condition, tout en respectant le sens de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure redondante littérale « pria une prière » est idiomatisée, tandis que la structure conditionnelle et les images concrètes du pain, du chemin et des vêtements sont conservées. Le verset restant syntaxiquement ouvert sur la suite, la virgule finale est maintenue.
