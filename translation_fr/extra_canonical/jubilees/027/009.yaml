lexical_decisions:
- source_word: ወቦአት
  choice: entra
  rationale: Rend directement le verbe guèze au passé dans un récit, avec Rébecca comme sujet.
- source_word: ገእዝኩ፡ ሕይወትየ
  choice: J’ai pris ma vie en dégoût
  rationale: Conserve l’expression forte et concrète du texte source sans l’affaiblir en simple mécontentement.
- source_word: እምክልኤሆን፡ አዋልደ፡ ኬጥ
  choice: à cause des deux filles de Heth
  rationale: Préserve le nombre explicite « deux » et francise traditionnellement le nom ethnique ኬጥ par « Heth ».
- source_word: እለ፡ ነሥአ፡ ዔሳው፡ ሎቱ፡ አንስትያ
  choice: qu’Ésaü a prises pour femmes
  rationale: Rend l’idée qu’Ésaü les a prises pour lui-même comme épouses, dans un français naturel et fidèle.
