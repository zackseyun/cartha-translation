  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: fr
  text: Et voici, je serai avec toi et je te garderai partout où tu iras, et je te ramènerai en paix dans ce pays. Car je ne t’abandonnerai pas avant d’avoir accompli tout ce que je t’ai dit.
