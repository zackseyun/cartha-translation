lexical_decisions:
- source_word: ወነየ
  choice: Et voici
  rationale: Rend la particule présentative avec un registre biblique digne mais encore courant.
- source_word: እዐቅበከ
  choice: je te garderai
  rationale: Conserve l’idée de protection et de préservation exprimée par le verbe guèze.
- source_word: በኵለን፡ ወእዴ፡ ሖርከ
  choice: partout où tu iras
  rationale: Formulation française naturelle qui restitue la portée distributive du syntagme.
- source_word: ወአገብአከ
  choice: je te ramènerai
  rationale: Exprime le retour causatif vers le pays indiqué.
- source_word: በሰላም
  choice: en paix
  rationale: Traduction directe qui peut évoquer à la fois la paix et le retour sain et sauf, sans surinterprétation.
- source_word: ኢየኀድገከ
  choice: je ne t’abandonnerai pas
  rationale: « Abandonner » rend ici naturellement l’idée de ne pas laisser ou délaisser la personne.
theological_decisions:
- issue: Durée de la présence et de la protection divines
  choice: avant d’avoir accompli tout ce que je t’ai dit
  alternative: jusqu’à ce que j’aie accompli tout ce que je t’ai dit
  rationale: La formulation retenue restitue la limite temporelle littérale sans laisser entendre que l’abandon suivra nécessairement l’accomplissement de la promesse.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement est maintenu conformément à l’adresse divine singulière. La structure répétitive en « je » préserve la solennité et l’insistance de la promesse.
