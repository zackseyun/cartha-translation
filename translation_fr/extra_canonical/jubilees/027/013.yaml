  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: fr
  text: Que Dieu Tout-Puissant te bénisse, te rende fécond et te multiplie, et que tu deviennes une assemblée de nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰዳይ
  choice: Dieu Tout-Puissant
  rationale: Le syntagme reprend le titre divin « Dieu Shaddaï »; la traduction traditionnelle et intelligible « Dieu Tout-Puissant » convient au registre biblique français.
- source_word: ያልህቀ
  choice: te rende fécond
  rationale: Le verbe exprime l'idée de faire fructifier ou rendre fécond; cette formulation naturelle conserve la causalité du texte.
- source_word: ያብዝኀከ
  choice: te multiplie
  rationale: Le choix garde le parallélisme biblique entre fécondité et multiplication ainsi que l'adresse au singulier.
- source_word: መክብበ፡ አሕዛብ
  choice: une assemblée de nations
  rationale: « Assemblée » rend le sens collectif du premier terme, tandis que « nations » préserve la portée plurielle et ethnique de አሕዛብ.
theological_decisions:
- issue: Valeur du titre divin Shaddaï
  choice: Dieu Tout-Puissant
  alternative: Dieu Shaddaï
  rationale: Le sens traditionnel est rendu dans le corps du texte sans imposer une interprétation plus précise de l'étymologie discutée du titre.
- issue: Nature du collectif promis
  choice: une assemblée de nations
  alternative: une communauté de peuples
  rationale: « Assemblée de nations » reste proche du texte source et de l'écho biblique, sans préciser indûment la forme politique ou religieuse de ce collectif.
translation_notes:
  register: Français international moderne, digne et accessible; syntaxe de bénédiction conservée, avec parallélisme biblique et tutoiement singulier.
