    issue: Ajout de « quelqu’un » dans « j’enverrai quelqu’un te chercher ».
    rationale: Le guèze coordonne « j’enverrai » et « je te ramènerai/ferai revenir » sans objet explicite pour le premier verbe. L’explicitation d’un messager est plausible contextuellement, mais elle ajoute un élément non exprimé et n’est pas nécessaire en français.
  - severity: low
    issue: La note alternative introduit « ton frère ».
    rationale: Bien que le référent soit fourni par le contexte, le verset emploie ici un pronom implicite et « sa colère » ; une note textuelle devrait éviter d’ajouter ce nom lorsqu’il n’est pas requis pour expliquer l’alternative.
