  rationale: La révision supprime l’ajout interprétatif d’un messager et conserve la coordination des deux verbes à la première personne. Elle adopte une expression française plus idiomatique pour le fait de détourner/abandonner sa colère, tout en maintenant le frère implicite comme sujet et la colère comme objet. La note conserve l’ambiguïté d’analyse signalée par l’historique éditorial, sous une forme strictement fidèle au texte du verset.
