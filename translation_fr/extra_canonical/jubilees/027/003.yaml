  text: and until he turns his anger away from you and he forgets all that you did to him. Then I will send and bring you back from there.”
translation:
  language: fr
  text: jusqu’à ce qu’il cesse d’être en colère contre toi[a] et qu’il oublie tout ce que tu lui as fait. Alors, je t’enverrai et je te ferai revenir de là. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « jusqu’à ce que sa colère se détourne de toi ».'
    reason: Signale l’analyse qui fait de « colère » le sujet du verbe, sans ajouter de référent nominal absent de la formulation du verset.
lexical_decisions:
- source_word: የኀድግ፡ መዐተ፡ እምኔከ
  choice: il détourne de toi sa colère
  rationale: Le nom « colère » fonctionne comme objet du verbe, tandis que le sujet masculin singulier renvoie au frère évoqué dans le contexte. Cette formulation respecte cette syntaxe tout en restant naturelle en français.
- source_word: ይረስዕ፡ ኵሎ፡ ዘመጠነ፡ ረሰይኮ
  choice: qu’il oublie tout ce que tu lui as fait
  rationale: Rendu direct de l’oubli portant sur la totalité des actes accomplis envers lui.
- source_word: ፈነውየ፡ አቄብለከ
  choice: j’enverrai quelqu’un te chercher et je te ferai revenir
  rationale: La juxtaposition des verbes « envoyer » et « ramener/faire venir » implique naturellement l’envoi d’un messager chargé de faire revenir Jacob; l’explicitation évite en français une coordination obscure.
- source_word: እምህየ
  choice: de là
  rationale: Expression spatiale simple qui renvoie au lieu où Jacob séjournera.
theological_decisions:
- issue: Sujet du détournement de la colère
  choice: 'Le frère est le sujet implicite : « il détourne… sa colère »'
  alternative: 'Faire de la colère le sujet : « la colère de ton frère se détourne de toi »'
  rationale: La morphosyntaxe du guèze présente « colère » comme l’objet du verbe et non comme son sujet. Le choix maintient donc l’agent masculin implicite sans ajouter son identité dans le corps du texte.
translation_notes:
  register: Français moderne, international et digne. La tournure « détourner de toi sa colère » conserve l’image de la source sans lourdeur excessive; « j’enverrai quelqu’un te chercher » explicite sobrement l’action implicite du messager.
