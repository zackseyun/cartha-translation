  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: fr
  text: Car je sais qu’il réussira dans toutes ses démarches, partout où il ira, jusqu’à ce qu’il revienne auprès de nous en paix et que nous le voyions en paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አአምር
  choice: je sais
  rationale: Rend directement le verbe de connaissance à la première personne.
- source_word: ይሤራኅ፡ ፍኖዊሁ
  choice: il fera réussir sa route
  rationale: Conserve l’image de la route tout en exprimant naturellement en français l’idée causative de réussite ou de prospérité.
- source_word: በኵሉ፡ ውእደ፡ ሖረ
  choice: partout où il ira
  rationale: Expression française naturelle correspondant à l’étendue indéfinie des déplacements.
- source_word: እስከ፡ አመ
  choice: jusqu’au jour où
  rationale: Rend la limite temporelle explicitement et avec fluidité.
- source_word: ይገብእ፡ በሰላም፡ ኀቤነ
  choice: il reviendra vers nous en paix
  rationale: Préserve le mouvement de retour vers le groupe parlant et la répétition emphatique de « en paix ».
- source_word: ወንሬእዮ፡ በሰላም
  choice: et où nous le reverrons en paix
  rationale: Le contexte du retour justifie « reverrons », plus idiomatique que « verrons », sans changer le sens.
