revisions:
- from: Car je sais qu’il fera réussir sa route partout où il ira, jusqu’au jour où il reviendra vers nous en paix et où nous le reverrons en paix.
  to: Car je sais qu’il réussira dans toutes ses démarches, partout où il ira, jusqu’à ce qu’il revienne auprès de nous en paix et que nous le voyions en paix.
  rationale: La révision évite la construction causative et peu naturelle « faire réussir sa route », tout en conservant le sens de réussite dans tous ses déplacements ou entreprises. Elle restitue plus sobrement la subordonnée temporelle et le verbe « voir », et maintient la répétition significative de « en paix ».
