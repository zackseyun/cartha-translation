  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: fr
  text: 'Jacob se réveilla de son sommeil et dit : « Vraiment, ce lieu est la maison du Seigneur, et je ne le savais pas. » Il eut peur et dit : « Que ce lieu est redoutable ! Ce n’est rien d’autre que la maison du Seigneur, et c’est la porte du ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: Vraiment
  rationale: Rend naturellement l’affirmation forte du guèze sans ajouter une nuance doctrinale.
- source_word: ግሩም
  choice: redoutable
  rationale: Conserve l’association de crainte et de grandeur inspirant le respect, renforcée par la mention explicite de la peur.
- source_word: አንቀጸ፡ ሰማይ
  choice: la porte du ciel
  rationale: Traduction directe de l’expression nominale et formulation biblique naturelle en français.
theological_decisions:
- issue: Désignation divine dans እግዚአብሔር
  choice: le Seigneur
  alternative: Dieu
  rationale: Dans ce passage, le terme guèze désigne le Seigneur; ce choix suit la valeur lexicale et évite d’introduire un nom divin absent de la forme transmise.
- issue: Identification du lieu à la maison du Seigneur
  choice: 'affirmation directe : « ce lieu est la maison du Seigneur »'
  alternative: « la maison du Seigneur est en ce lieu »
  rationale: Préserve la formulation identitaire forte du texte sans en atténuer la tension théologique.
translation_notes:
  register: Français moderne, international et digne. Syntaxe fluide tout en conservant la répétition solennelle de « ce lieu » et « la maison du Seigneur ».
