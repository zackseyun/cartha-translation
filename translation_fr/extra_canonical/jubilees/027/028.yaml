  revised_text: 'Jacob se réveilla de son sommeil et dit : « Vraiment, ce lieu est la maison du Seigneur, et je ne le savais pas. » Il eut peur et dit : « Que ce lieu est redoutable ! Ce n’est rien d’autre que la maison du Seigneur, et c’est la porte du ciel. »'
