  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: fr
  text: 'Il parla à Jacob et dit : « Je suis le Seigneur, le Dieu d’Abraham, ton père, et le Dieu d’Isaac. La terre sur laquelle tu es couché, endormi, je te la donnerai, à toi et à ta descendance après toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Rendu français traditionnel et intelligible du titre divin dans ce contexte.
- source_word: ትነውም
  choice: tu es couché
  rationale: Conserve l’idée de la position allongée exprimée par le verbe, sans alourdir la phrase par « couché endormi ».
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Rend naturellement en français le nom collectif signifiant la postérité ou la semence.
- source_word: እምድኅሬከ
  choice: après toi
  rationale: Traduction directe qui préserve la formulation temporelle du texte guèze.
theological_decisions:
- issue: Identification d’Abraham comme père de Jacob
  choice: Abraham, ton père
  alternative: Abraham, ton ancêtre
  rationale: Le texte source emploie explicitement « père »; cette formulation biblique peut aussi désigner un ancêtre et ne doit pas être discrètement harmonisée avec la généalogie immédiate.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe solennelle du discours divin est conservée, avec une dislocation légère (« La terre…, je la donnerai ») qui reste idiomatique et met en relief l’objet de la promesse.
