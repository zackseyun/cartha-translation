  - severity: low
    issue: Construction dativale peu naturelle.
    rationale: « Donner à toi » est grammaticalement possible dans une tournure emphatique, mais « je te la donnerai » est plus idiomatique tout en conservant l’emphase par « à toi et à ta descendance ».
