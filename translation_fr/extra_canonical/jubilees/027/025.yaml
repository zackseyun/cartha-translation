  source_fidelity: Le projet rend fidèlement l’identification divine, « Abraham, ton père », la promesse de la terre et la descendance. Toutefois, le verbe guèze, confirmé par l’audit anglais (« are lying asleep »), inclut l’état de sommeil; « tu es couché » n’en conserve que la position.
