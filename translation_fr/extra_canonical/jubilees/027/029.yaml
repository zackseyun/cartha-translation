  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: fr
  text: Jacob se leva de bon matin, prit la pierre qu’il avait placée près de sa tête et la dressa comme une stèle servant de signe ; puis il versa de l’huile sur son sommet. Il donna à ce lieu le nom de Béthel, mais auparavant cette région s’appelait Louz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: de bon matin
  rationale: Expression française naturelle qui rend l’idée de se lever tôt le matin.
- source_word: ኀበ፡ ርእሱ
  choice: près de sa tête
  rationale: Rend littéralement la relation spatiale sans préciser davantage la fonction de la pierre.
- source_word: ሐውልተ፡ ለትእምርት
  choice: une stèle servant de signe
  rationale: « Stèle » traduit le monument de pierre dressé, tandis que « servant de signe » conserve explicitement sa fonction dans le texte guèze.
- source_word: ዲበ፡ ርእሱ
  choice: sur son sommet
  rationale: Le terme « tête » désigne ici naturellement la partie supérieure de la stèle en français.
- source_word: ቤቴል
  choice: Béthel
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu biblique.
- source_word: ሉዛ
  choice: Louz
  rationale: Transcription française biblique usuelle du toponyme Luz.
- source_word: ብሔር
  choice: région
  rationale: Dans ce contexte géographique, le mot désigne la contrée ou la région plutôt qu’un peuple.
