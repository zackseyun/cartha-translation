  text: Rise and go to Mesopotamia, to the house of Bethuel, your mother’s father, and take for yourself a wife from there, from the daughters of Laban, your mother’s brother.
translation:
  language: fr
  text: Lève-toi, va en Mésopotamie, dans la maison de Bethouel, le père de ta mère, et prends pour toi, de là, une femme parmi les filles de Laban, le frère de ta mère.
