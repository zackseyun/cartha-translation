translation:
  language: fr
  text: Il lui ouvrit les yeux, et elle vit un puits d’eau. Elle alla, remplit l’outre d’eau et lui donna à boire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከሠተ፡ አዕይንቲሃ
  choice: Il lui ouvrit les yeux
  rationale: Le verbe est à la troisième personne du masculin singulier, tandis que le suffixe de « yeux » renvoie à une femme. « Il lui ouvrit les yeux » respecte cette distinction sans expliciter un sujet absent de la proposition guèze.
- source_word: ዐዘቅተ፡ ማይ
  choice: un puits
  rationale: L’expression désigne une excavation ou un puits contenant de l’eau ; « un puits » est ici naturel et conforme au contexte.
- source_word: ዝቃ
  choice: l’outre
  rationale: Le nom désigne un récipient en peau destiné notamment au transport de l’eau.
- source_word: ወአስተየቶ
  choice: et lui donna à boire
  rationale: 'Cette formulation rend directement le causatif : elle fit boire le bénéficiaire masculin.'
theological_decisions:
- issue: Identité du sujet masculin de « ouvrit »
  choice: Conserver le pronom « Il » sans ajouter « Dieu »
  alternative: « Dieu lui ouvrit les yeux »
  rationale: Le contexte peut identifier le sujet à Dieu, mais le texte fourni ne le nomme pas dans ce verset. Le pronom préserve donc la formulation et l’implicite de la source.
translation_notes:
  register: Français moderne, simple et digne. La succession des actions est conservée, avec une ponctuation naturelle. Aucune note n’est nécessaire, car la morphologie guèze établit clairement que le sujet du premier verbe est masculin et que les verbes suivants ont un sujet féminin.
