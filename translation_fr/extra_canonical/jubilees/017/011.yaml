  yaml_path: translation/extra_canonical/jubilees/017/011.yaml
  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
translation:
  language: fr
  text: 'Elle s’éloigna à une portée d’arc, car elle disait : « Que je ne voie pas mourir mon enfant ! » Puis elle s’assit et pleura. Un ange de Dieu, l’un des saints, lui dit : « Pourquoi pleures-tu, Agar ? Lève-toi, prends l’enfant et tiens-le par la main, car Dieu a entendu ta voix et a vu l’enfant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ
  choice: à une portée d’arc
  rationale: L’expression indique littéralement la distance d’un tir à l’arc; cette formulation conserve la mesure concrète et l’écho à Genèse 21.16.
- source_word: ሕፃን / ኅፃን
  choice: enfant
  rationale: Terme naturel en français pour le jeune Ismaël dans ce contexte, sans préciser davantage son âge.
- source_word: አሐዱ፡ እምቅዱሳን
  choice: l’un des saints
  rationale: Rend directement l’apposition qui identifie l’ange comme appartenant aux saints, sans l’effacer ni l’interpréter comme un humain.
- source_word: አንዝዮ፡ በእዴኪ
  choice: tiens-le de ta main
  rationale: Conserve la mention explicite de la main présente dans le guèze, malgré une tournure légèrement marquée en français.
- source_word: ወርእዮ፡ ለሕፃን
  choice: et a vu l’enfant
  rationale: Traduit la déclaration explicite selon laquelle Dieu a vu l’enfant, sans l’assimiler à une autre formulation du récit parallèle.
theological_decisions:
- issue: Identité de l’ange comme « l’un des saints »
  choice: Conserver « l’un des saints »
  alternative: « l’un des êtres saints » ou omission de l’apposition
  rationale: Le texte source contient cette qualification. La conserver respecte son langage céleste tout en évitant d’imposer une angélologie plus précise.
- issue: Perception divine de la détresse
  choice: « Dieu a entendu ta voix et a vu l’enfant »
  alternative: « Dieu a entendu la voix de l’enfant »
  rationale: Le guèze dit explicitement « ta voix » puis « a vu l’enfant »; la traduction ne doit pas harmoniser silencieusement avec Genèse 21.17.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit littéraire. « À une portée d’arc » préserve l’image précise du texte; « tiens-le de ta main » garde volontairement la formulation concrète du guèze. Aucun ajout du parallèle de Genèse 21.16, tel que « en face de lui », n’a été introduit.
