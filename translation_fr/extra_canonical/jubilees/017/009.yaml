  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
translation:
  language: fr
  text: Il prit du pain et une outre d’eau, les mit sur l’épaule d’Agar et lui confia l’enfant, puis il la renvoya.[a] Elle partit et erra dans le désert de Bersabée. Quand l’eau de l’outre fut épuisée, l’enfant eut soif, ne put plus marcher et tomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze coordonne de manière condensée les provisions et l’enfant ; la traduction explicite que les provisions sont placées sur l’épaule d’Agar et que l’enfant lui est confié.
    reason: Préserve et explique la syntaxe compacte du texte source tout en évitant de suggérer que l’enfant est lui-même placé sur l’épaule.
lexical_decisions:
- source_word: አስከማ፡ (ʾaskamā)
  choice: les chargea sur l’épaule
  rationale: Le verbe exprime l’action de charger ou de faire porter sur l’épaule; cette traduction conserve ce détail concret du guèze.
- source_word: ፈነዋ፡ (fanawā)
  choice: il la renvoya
  rationale: Le suffixe objet est féminin singulier et renvoie à Agar, non à Agar et l’enfant ensemble.
- source_word: ተንገገ፡ (tangagā)
  choice: erra
  rationale: Le verbe décrit une marche désorientée ou errante dans le désert.
- source_word: ተፈጸመ፡ ማይ፡
  choice: l’eau … fut épuisée
  rationale: Rend littéralement l’idée que l’eau arriva à son terme, dans un français naturel.
- source_word: ስእነ፡ ሐዊረ፡
  choice: ne put plus marcher
  rationale: Exprime l’incapacité de poursuivre la marche; « plus » convient au contexte narratif sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Outre » et « Bersabée » sont conservés comme termes bibliques courants. La construction potentiellement rude du texte source est clarifiée avec mesure, tandis que son ambiguïté est signalée en note.
