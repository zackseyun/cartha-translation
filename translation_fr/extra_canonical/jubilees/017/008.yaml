- source_word: ወነገሀ፡ አብርሃም፡ በነግህ
  choice: Abraham se leva de bon matin
  rationale: L’expression associe le verbe de lever matinal à l’indication adverbiale « au matin »; « de bon matin » est idiomatique et conserve l’idée d’une action précoce.
