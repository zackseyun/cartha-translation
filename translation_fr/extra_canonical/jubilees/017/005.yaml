  text: …and her son, for the son of this servant woman will not be an heir with my son Isaac.” And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
translation:
  language: fr
  text: … ainsi que son fils, car le fils de cette servante n’héritera pas avec mon fils Isaac. » Cette parole peina profondément Abraham, à cause de sa servante et de son fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወልዳ፡ እስመ፡
  choice: … ainsi que son fils, car
  rationale: 'Le début du verset prolonge la phrase du verset précédent : « et son fils », puis introduit la raison par « car ». Les points de suspension signalent ce raccord.'
- source_word: ወልዳ፡ ለዛ፡ ወሰት፡
  choice: le fils de cette servante
  rationale: « Servante » rend naturellement le statut subordonné exprimé par ወሰት sans durcir inutilement le français en « esclave ».
- source_word: ኢይወርስ፡
  choice: n’héritera pas
  rationale: Le verbe désigne ici l’accès à l’héritage; le futur français convient à l’affirmation rapportée.
- source_word: ወማኅዘነ፡ ውእቱ፡ ቃል፡
  choice: Cette parole peina profondément
  rationale: La tournure conserve « la parole / l’affaire » comme sujet tout en donnant un français idiomatique et en exprimant l’intensité de la peine.
- source_word: በቅድመ፡ አዕይንተ፡ አብርሃም፡
  choice: Abraham
  rationale: L’expression littérale « devant les yeux d’Abraham » est un idiome indiquant son appréciation ou son émotion; elle est intégrée naturellement au verbe « peina ».
- source_word: በእንተ፡ አመቱ፡ ወበእንተ፡ ወልዱ፡
  choice: à cause de sa servante et de son fils
  rationale: La répétition de « à cause de » dans la source est légèrement allégée sans supprimer les deux motifs distincts de sa peine.
theological_decisions:
- issue: Identité du « fils » dans la dernière proposition
  choice: son fils
  alternative: le fils de la servante
  rationale: La source dit littéralement « son fils » en relation avec Abraham. Cette formulation préserve le lien filial et la tension narrative sans explicitation interprétative.
- issue: Valeur de la déclaration sur l’héritage
  choice: n’héritera pas avec
  alternative: ne partagera pas l’héritage avec
  rationale: La formulation directe suit le verbe source et évite de préciser la nature juridique ou théologique de l’héritage au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset est rendu comme la suite syntaxique du précédent; le parallélisme final « sa servante et son fils » est conservé.
