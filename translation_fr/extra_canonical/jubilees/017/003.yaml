  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
translation:
  language: fr
  text: Il se souvint de la parole que le Seigneur lui avait adressée[a] le jour où Lot s’était séparé de lui. Il se réjouit, car le Seigneur lui avait donné une descendance sur la terre afin qu’il hérite de la terre[b], et il bénit le Créateur de toute sa bouche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de sa parole qu’il lui avait dite »; les pronoms renvoient, dans le contexte, au Seigneur et à Abraham.'
    reason: La source emploie des suffixes pronominaux dont les référents sont contextuels.
  - marker: b
    text: Le pronom peut viser Abraham en lien avec sa descendance, ou la « semence » considérée collectivement.
    reason: Préserve l’ambiguïté grammaticale et théologique du sujet masculin singulier de « hériter ».
  - marker: c
    text: Expression littérale qui souligne que sa bénédiction fut pleine et entière.
    reason: Explique une tournure sémitique conservée dans le texte principal.
lexical_decisions:
- source_word: ቃሎ (qālo)
  choice: la parole
  rationale: Le nom est au singulier et porte un suffixe possessif; « la parole » convient ici à la promesse divine rappelée à Abraham.
- source_word: ዘርአ (zar’a)
  choice: une descendance
  rationale: Le terme signifie littéralement « semence », mais désigne collectivement la postérité; « descendance » est naturel et précis en français moderne.
- source_word: ይረሳ (yərasa)
  choice: qu’il hérite
  rationale: La forme vient de la racine ወረሰ, « hériter »; elle ne signifie pas « couvrir ».
- source_word: ፈጣሪ (faṭāri)
  choice: le Créateur
  rationale: Rend directement le titre divin du texte guèze, sans ajout doctrinal.
- source_word: በኵሉ፡ አፉሁ (bakwel(l)u afuhu)
  choice: de toute sa bouche
  rationale: Conserve l’image corporelle emphatique de la source plutôt que de la remplacer silencieusement par « de tout son cœur ».
theological_decisions:
- issue: Identité du locuteur de la parole rappelée
  choice: « la parole que le Seigneur lui avait adressée »
  alternative: « sa parole, qu’il lui avait adressée »
  rationale: Les suffixes de la source sont pronominaux, mais le contexte et la reprise explicite du Seigneur dans la proposition suivante indiquent une promesse divine faite à Abraham. La note signale la forme littérale.
- issue: Sujet de « hériter »
  choice: Conserver le pronom masculin singulier « il »
  alternative: « afin que sa descendance hérite de la terre »
  rationale: La forme verbale guèze est au masculin singulier et ne précise pas davantage si l’héritier envisagé est Abraham représenté par sa postérité ou la « semence » prise collectivement. Le français conserve cette tension au lieu de substituer explicitement « sa descendance ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste fluide tout en conservant le singulier « parole », le motif de l’héritage et l’image inhabituelle « de toute sa bouche ».
