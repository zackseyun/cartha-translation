  text: that he should send them away from him. And the Lord said to Abraham, “Do not let it be grievous in your sight because of the boy and because of the servant woman. Whatever Sarah says to you, listen to her voice and do it.”
translation:
  language: fr
  text: 'qu’il les éloigne de lui. Alors le Seigneur dit à Abraham : « Que cela ne soit pas pénible à tes yeux à cause du garçon et à cause de la servante. Tout ce que Sara te dira, écoute sa voix et fais-le. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  choice: qu’il les éloigne de lui
  rationale: Le verbe à valeur subjonctive/imperfective poursuit la proposition du verset précédent plutôt que de rapporter ici une action accomplie.
- source_word: ሕፃን
  choice: garçon
  rationale: Dans ce contexte, le terme désigne Ismaël; « garçon » est naturel et conserve la référence à son jeune âge.
- source_word: ወለት
  choice: servante
  rationale: Le terme désigne ici Agar dans sa condition subordonnée. « Servante » reste exact et digne sans ajouter une qualification absente du texte.
- source_word: ስማዕ፡ ቃለ
  choice: écoute sa voix
  rationale: Cette formulation conserve l’expression concrète de la source et son écho scripturaire, tout en demeurant intelligible en français.
theological_decisions:
- issue: Rapport syntaxique avec le verset précédent
  choice: Commencer par « qu’il les éloigne de lui »
  alternative: « Il les éloigna de lui »
  rationale: 'La morphologie verbale et le déroulement narratif indiquent que le fragment achève la pensée précédente: Abraham éprouve de la peine à l’idée de les renvoyer; l’action effective suit la parole divine.'
- issue: Portée de l’ordre divin
  choice: « écoute sa voix et fais-le »
  alternative: « obéis-lui »
  rationale: La traduction maintient les deux impératifs distincts de la source et évite de condenser ou d’interpréter davantage leur portée.
translation_notes:
  register: Français moderne, clair et digne. La phrase initiale est volontairement dépendante, car le découpage du verset intervient au milieu de la syntaxe amorcée au verset précédent. Le parallélisme « à cause du garçon et à cause de la servante » est conservé.
