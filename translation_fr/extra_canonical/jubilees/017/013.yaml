  text: her child. And she arose and went toward the wilderness of Paran. And the child grew, and he became an archer, and the Lord was with him, and his mother took for him a wife from the daughters of Egypt.
translation:
  language: fr
  text: son enfant.[a] Elle se leva et partit en direction du désert de Paran. L’enfant grandit et devint archer. Le Seigneur fut avec lui, et sa mère lui prit pour femme une des filles d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset commence par les derniers mots d’une phrase entamée au verset précédent.
    reason: La division des versets coupe vraisemblablement la phrase après son complément « son enfant »; cette note prévient une lecture erronée de ce fragment comme une proposition indépendante.
lexical_decisions:
- source_word: ሕፃና (ḥəṣānā)
  choice: son enfant
  rationale: La forme suffixée signifie « son enfant » et constitue vraisemblablement le complément du dernier verbe du verset précédent; elle ne contient pas le verbe « grandir ».
- source_word: መንገለ (mangala)
  choice: en direction de
  rationale: Le terme indique une orientation ou un mouvement vers un lieu, plutôt qu’une présence à l’intérieur de celui-ci.
- source_word: አሀቀ (ʾahāqa)
  choice: grandit
  rationale: Le verbe décrit la croissance de l’enfant dans la proposition suivante.
- source_word: ነዳፌ (nadāfē)
  choice: archer
  rationale: Le nom désigne celui qui manie ou tire à l’arc.
- source_word: ነሥአት፡ ሎቱ (naśʾat lotu)
  choice: lui prit pour femme
  rationale: Cette tournure française naturelle conserve l’idée que sa mère prit ou choisit une épouse pour lui.
theological_decisions:
- issue: Présence divine auprès de l’enfant
  choice: Le Seigneur fut avec lui
  alternative: Dieu fut avec lui
  rationale: Le nom divin እግዚአብሔር est rendu par « le Seigneur », sans expliciter davantage la nature de cette présence.
translation_notes:
  register: Français moderne, clair et digne. Le début fragmentaire est conservé au lieu d’être artificiellement transformé en phrase complète; la note signale la coupure due à la division des versets.
