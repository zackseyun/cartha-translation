  text: And she bore him a son and he called his name Nabaioth, for she said, “The Lord is near to me.”
translation:
  language: fr
  text: 'Elle lui enfanta un fils, et il l’appela Nebayoth, car elle dit : « Le Seigneur est proche de moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለደት፡ ሎቱ፡ ወልደ
  choice: Elle lui donna un fils
  rationale: Rend la naissance et le bénéficiaire exprimé par « à lui » dans un français naturel, sans perdre le changement de sujet qui suit.
- source_word: ወጸውዐ፡ ስሞ፡ ናቤዮት
  choice: et il l’appela Nebayot
  rationale: 'Le verbe est au masculin singulier : « il » est donc explicité afin de distinguer celui qui nomme de la mère qui enfante. « L’appela » restitue naturellement l’expression sémitique littérale « appela son nom » ; « Nebayot » suit une forme française moderne du nom.'
- source_word: ቅሩብ፡ እግዚአብሔር፡ ሊተ
  choice: Le Seigneur est proche de moi
  rationale: Traduction directe de l’énoncé expliquant le nom, avec « Seigneur » pour le titre divin et sans préciser davantage la nature de cette proximité.
theological_decisions:
- issue: Nature de la proximité du Seigneur
  choice: est proche de moi
  alternative: s’est approché de moi / m’est venu en aide
  rationale: Le texte affirme une proximité sans en définir le sens précis. La traduction conserve cette ouverture au lieu de l’interpréter comme une intervention particulière.
- issue: Identité de la personne qui donne le nom
  choice: il l’appela
  alternative: elle l’appela / et l’appela
  rationale: La forme masculine du verbe guèze indique un sujet masculin, tandis que le verbe précédent et « elle dit » ont un sujet féminin. Le changement de sujet est donc rendu explicitement.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du texte source tout en évitant le calque « il appela son nom ». Le discours direct conserve au présent l’explication donnée par la mère.
