  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
translation:
  language: fr
  text: 'Sara vit Ismaël plaisanter et danser, tandis qu’Abraham se réjouissait d’une grande joie. Elle devint jalouse d’Ismaël et dit à Abraham : « Chasse cette servante[a] et son fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette esclave » ; le terme désigne une femme en condition servile.
    reason: La variante précise la portée sociale du terme sans employer dans le texte principal une formulation inutilement dure.
lexical_decisions:
- source_word: ይትዋነይ፡ ወይዘፍን
  choice: plaisanter et danser
  rationale: Les deux verbes décrivent les gestes joyeux d’Ismaël; cette formulation française conserve les deux actions sans les réduire à une notion unique.
- source_word: ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  choice: se réjouissait d’une grande joie
  rationale: La répétition étymologique et l’intensification du guèze sont conservées dans une tournure française solennelle et intelligible.
- source_word: ወቀንአት
  choice: devint jalouse
  rationale: Le verbe exprime ici la jalousie ou l’envie de Sara envers Ismaël; « devint jalouse » suit directement la relation explicitée par le complément.
- source_word: ስድድ
  choice: Chasse
  rationale: L’impératif demande l’expulsion de la servante et de son fils; « chasse » rend la force du commandement.
- source_word: ዛተ፡ ወሰተ
  choice: cette servante
  rationale: Le texte transmis est problématique à cet endroit, mais la lecture sous-jacente reconnue désigne une servante; ce terme préserve le statut social pertinent dans le récit.
theological_decisions:
- issue: Motif de la réaction de Sara
  choice: Elle devint jalouse d’Ismaël
  alternative: Elle fut irritée contre Ismaël
  rationale: La traduction conserve la jalousie explicitement attribuée à Sara sans l’harmoniser avec d’autres versions du récit ni lui substituer une justification théologique.
- issue: Nature des gestes d’Ismaël
  choice: plaisanter et danser
  alternative: se moquer et danser
  rationale: Le contexte festif et le sens verbal permettent une activité joyeuse; « plaisanter » évite d’introduire sans nécessité une moquerie hostile, tout en laissant perceptible une possible nuance équivoque.
translation_notes:
  register: Français international moderne, digne et accessible. Le contraste entre la joie d’Abraham et la jalousie de Sara est maintenu. La répétition « se réjouissait d’une grande joie » reproduit volontairement l’intensité du guèze.
