  text: And the Lord said to him, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your beloved son whom you love, Isaac, and go into the high land, and offer him there on one of the mountains that I will show you.” And he rose early in the morning and saddled his donkey and took two of his young servants with him, and Isaac his son; and he split the wood of the offering and went to the place on the third day, and he saw the place from afar. And he came to a well of water, and he said to his young servants, “Stay here with the donkey, and I and the boy will go on, and when we have worshiped we will return to you.” And he took the wood of the sacrifice and laid it on Isaac his son, and he took in his hand the fire and the knife. And the two of them went together to that place.
translation:
  language: fr
  text: Il se souvint de la parole qu’il avait prononcée le jour où Lot s’était séparé de lui, et il se réjouit, car le Seigneur lui avait donné une descendance sur la terre afin qu’elle hérite de la terre. De toute sa bouche, il bénit le Créateur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከረ
  choice: se souvint
  rationale: Rend directement le verbe de mémoire au parfait narratif.
- source_word: ዘርአ
  choice: une descendance
  rationale: Le terme désigne ici la postérité promise plutôt qu’une semence au sens concret.
- source_word: ይረሳ
  choice: qu’elle hérite
  rationale: Exprime l’idée de recevoir en possession héréditaire.
- source_word: ምድር
  choice: terre / pays
  rationale: La première occurrence indique le cadre terrestre, tandis que la seconde vise vraisemblablement le territoire promis; la variation française préserve cette nuance contextuelle.
- source_word: ፈጣሪ
  choice: le Créateur
  rationale: Titre divin correspondant littéralement à celui qui crée.
- source_word: በኵሉ፡ አፉሁ
  choice: de toute sa bouche
  rationale: Conserve l’expression emphatique et concrète de la source plutôt que de la remplacer par « de tout son cœur ».
theological_decisions:
- issue: Référent de la descendance héritière
  choice: Accord pronominal collectif avec « descendance »
  alternative: 'Reformuler au pluriel: « pour que ses descendants héritent »'
  rationale: Préserve le caractère collectif du singulier « descendance » sans préciser davantage l’identité ou l’étendue de la postérité.
- issue: Désignation divine finale
  choice: « le Créateur »
  alternative: « son Créateur » ou « Dieu »
  rationale: La source emploie le titre défini « Créateur » sans possessif explicite; la traduction n’ajoute donc ni possessif ni autre nom divin.
translation_notes:
  register: Français moderne, narratif et digne. Le brouillon suit la ligne guèze fournie, identifiée comme le verset 3 dans les métadonnées, plutôt que le texte anglais de consultation, qui correspond manifestement à un autre passage.
