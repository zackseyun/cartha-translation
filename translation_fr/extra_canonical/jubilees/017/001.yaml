revisions:
- from: Le Seigneur savait qu’Abraham était fidèle dans toutes ses épreuves. En effet, il l’avait mis à l’épreuve dans son pays et par la famine ; il l’avait mis à l’épreuve par les richesses des rois ; il l’avait encore mis à l’épreuve au sujet de sa femme, lorsqu’elle lui fut enlevée, ainsi que par la circoncision ; et il l’avait mis à l’épreuve au sujet d’Ismaël et d’Agar, sa servante, lorsqu’il les renvoya. Dans tout ce par quoi il l’avait mis à l’épreuve, Abraham fut trouvé fidèle. Son âme ne s’impatienta pas et il ne tarda pas à agir, car il était fidèle et aimait le Seigneur.
  to: Le Seigneur savait qu’Abraham était fidèle dans toutes ses épreuves. En effet, il l’avait mis à l’épreuve dans son pays et par la famine ; il l’avait mis à l’épreuve par les biens des rois ; il l’avait encore mis à l’épreuve par sa femme, lorsqu’elle fut emmenée, ainsi que par la circoncision ; et il l’avait mis à l’épreuve par Ismaël et Agar, sa servante, lorsqu’il les renvoya. Dans tout ce par quoi il l’avait mis à l’épreuve, Abraham fut trouvé fidèle. Son âme ne s’impatienta pas et il ne tarda pas à agir, car il était fidèle et ami du Seigneur.
  rationale: 'Révision limitée afin de restituer plus précisément la relation exprimée par la répétition du verbe « éprouver » : les personnes et événements énumérés sont rendus par « par », plutôt que par « au sujet de ». La conclusion est ajustée en « ami du Seigneur » pour refléter la forme nominale du source dans un français moderne naturel. Aucun ajout interprétatif ni doctrinal n’est introduit.'
