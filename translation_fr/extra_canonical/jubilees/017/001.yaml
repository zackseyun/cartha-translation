base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: fr
  text: Le Seigneur savait qu’Abraham était fidèle dans toutes ses épreuves. En effet, il l’avait mis à l’épreuve dans son pays et par la famine ; il l’avait mis à l’épreuve par les biens des rois ; il l’avait encore mis à l’épreuve par sa femme, lorsqu’elle fut emmenée, ainsi que par la circoncision ; et il l’avait mis à l’épreuve par Ismaël et Agar, sa servante, lorsqu’il les renvoya. Dans tout ce par quoi il l’avait mis à l’épreuve, Abraham fut trouvé fidèle. Son âme ne s’impatienta pas et il ne tarda pas à agir, car il était fidèle et ami du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምንዳቤሁ
  choice: ses épreuves
  rationale: Le contexte est dominé par le verbe répété « mettre à l’épreuve » ; « épreuves » exprime à la fois les difficultés subies et leur fonction de test.
- source_word: አመከሮ
  choice: il l’avait mis à l’épreuve
  rationale: Cette formulation française rend clairement l’action de tester Abraham et permet de conserver la répétition structurante du texte source.
- source_word: ብዕለ፡ ነገሥት
  choice: les richesses des rois
  rationale: Traduction directe qui préserve l’expression du texte sans préciser de quelle manière ces richesses constituèrent une épreuve.
- source_word: ነፍሱ፡ ወኢተአገተት
  choice: Son âme ne s’impatienta pas
  rationale: Conserve explicitement « son âme » et rend l’idée d’absence d’impatience sans la réduire à une simple émotion passagère.
- source_word: መፍቀሬ፡ እግዚአብሔር
  choice: aimait le Seigneur
  rationale: Expression naturelle en français moderne pour « amoureux/ami du Seigneur », sans introduire un titre théologique supplémentaire.
theological_decisions:
- issue: Rapport entre la connaissance du Seigneur et les épreuves d’Abraham
  choice: « Le Seigneur savait… En effet, il l’avait mis à l’épreuve »
  alternative: « Le Seigneur reconnut… parce qu’il l’avait éprouvé »
  rationale: Le texte affirme la connaissance divine tout en énumérant les épreuves ; la traduction conserve cette tension sans suggérer que Dieu aurait acquis une connaissance auparavant absente.
- issue: Sujet de l’envoi d’Ismaël et d’Agar
  choice: « lorsqu’il les renvoya » avec Abraham comme sujet contextuel
  alternative: « lorsqu’il les eut renvoyés » ou une tournure passive
  rationale: La syntaxe et le récit visent naturellement Abraham, mais la formulation reste sobre et n’ajoute aucune motivation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « mis à l’épreuve » est volontairement maintenue comme trait rhétorique du passage. Les phrases sont légèrement segmentées pour la lisibilité sans modifier la progression du texte.
