  text: And his mother took him and cast him under an olive tree, and she went and sat opposite, at a distance.
translation:
  language: fr
  text: Sa mère le prit et le jeta sous un olivier[a]. Puis elle alla s’asseoir en face, à quelque distance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous un olivier » ; le guèze emploie le numéral « un », qui peut aussi avoir une valeur indéfinie.'
    reason: Signale la présence du numéral dans le guèze sans introduire la nuance restrictive de « un seul ».
lexical_decisions:
- source_word: ወነሥአቶ፡ እሙ፡
  choice: Sa mère le prit
  rationale: Rend directement le verbe « prendre » et le sujet « sa mère », avec le pronom objet masculin.
- source_word: ወገደፈቶ፡
  choice: et le déposa
  rationale: Le verbe peut exprimer l’action de jeter, laisser ou déposer. Dans ce contexte maternel, « déposa » conserve l’idée de mise à l’écart sans suggérer nécessairement un geste violent.
- source_word: ታኅተ፡ አሐቲ፡ እልያስ፡
  choice: sous un olivier
  rationale: Le numéral « un » peut avoir ici une valeur indéfinie; cette formulation est naturelle en français. La variante plus numérale est signalée en note.
- source_word: ወሖረት፡ ወነበረት፡ አንጻር፡ መጠነ፡
  choice: Puis elle alla s’asseoir en face, à quelque distance
  rationale: Rend la succession « elle alla et s’assit », la position opposée et l’indication d’éloignement, dans un français idiomatique.
