lexical_decisions:
- source_word: በይስሐቅ
  choice: par Isaac
  rationale: La préposition peut être rendue littéralement par « en Isaac », mais « par Isaac » exprime naturellement en français l’idée que la lignée reconnue passera par lui.
- source_word: ስም፡ ወዘርእ
  choice: un nom et une descendance
  rationale: Conserve les deux substantifs du texte guèze, sans réduire l’expression au seul motif biblique de la descendance.
- source_word: ይጼዋዕ፡ ለከ
  choice: seront appelés pour toi
  rationale: Maintient le verbe « appeler » et la valeur du bénéficiaire, ainsi que l’accord de sens avec les deux éléments coordonnés.
- source_word: ወልደስ፡ ለዛ፡ ወለት
  choice: au fils de cette servante
  rationale: « Servante » est un terme français courant et digne; il évite de durcir inutilement le statut en « esclave » lorsque le lexème peut désigner une femme de service.
theological_decisions:
- issue: Sens de l’expression concernant Isaac
  choice: c’est par Isaac qu’un nom et une descendance seront appelés pour toi
  alternative: en Isaac une descendance portera ton nom
  rationale: La formulation retenue préserve explicitement « nom » et « descendance » ainsi que le verbe « appeler », sans harmoniser le texte avec une formulation canonique plus familière.
- issue: Clause finale inachevée
  choice: Quant au fils de cette servante,
  alternative: Quant au fils de cette servante, je ferai aussi de lui une nation
  rationale: Le segment fourni s’arrête après l’introduction du fils; la virgule conserve cette continuité syntaxique sans importer la suite d’un autre témoin ou verset.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase finale demeure volontairement suspendue, conformément au découpage de la source fournie.
