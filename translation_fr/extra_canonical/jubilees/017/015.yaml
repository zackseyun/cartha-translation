  to: 'Quand je l’ai appelé. Et il arriva que, durant la septième semaine, dans la première année, le premier mois de ce jubilé, le douzième jour de ce mois, des paroles furent prononcées au ciel au sujet d’Abraham : il était fidèle dans tout ce qu’il disait, il aimait le Seigneur et, dans toute épreuve, il demeurait fidèle.'
  rationale: La révision conserve la rupture phrastique initiale et la première personne du verbe, puis restitue plus directement l’arrivée de « paroles » au ciel. Elle ne désigne ni Dieu ni des anges comme locuteurs et conserve l’ambiguïté du texte concernant la scène céleste. La répétition de « fidèle » et le sens d’« épreuve » sont maintenus.
