  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
translation:
  language: fr
  text: 'Quand je l’ai appelé. Et il arriva que, durant la septième semaine, dans la première année, le premier mois de ce jubilé, le douzième jour de ce mois, des paroles furent prononcées au ciel au sujet d’Abraham : il était fidèle dans tout ce qu’il disait, il aimait le Seigneur et, dans toute épreuve, il demeurait fidèle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: je l’ai appelé
  rationale: La forme verbale est à la première personne du singulier avec un objet masculin singulier ; elle doit donc être distinguée de « il l’avait appelé ».
- source_word: ኮነ፡ ቃላት፡ በሰማያት
  choice: au ciel, on parla
  rationale: Littéralement, « des paroles eurent lieu au ciel ». Cette tournure française naturelle conserve l’idée d’une délibération ou déclaration céleste sans préciser des locuteurs que le texte ne nomme pas.
- source_word: መሃይምን / ምእመነ
  choice: fidèle / demeurait fidèle
  rationale: Le texte répète le champ lexical de la fidélité à propos d’Abraham ; la reprise française préserve cette insistance.
- source_word: ምንዳቤ
  choice: épreuve
  rationale: Le contexte décrit les mises à l’épreuve d’Abraham ; « épreuve » restitue mieux ce sens que « souffrance » ou « affliction ».
theological_decisions:
- issue: Nature des paroles prononcées au ciel
  choice: « au ciel, on parla d’Abraham »
  alternative: « des paroles s’élevèrent au ciel au sujet d’Abraham »
  rationale: Le passif indéfini évite d’identifier artificiellement Dieu, les anges ou une assemblée céleste comme locuteurs, tout en conservant la scène céleste.
- issue: Portée de « fidèle dans tout ce qu’il disait »
  choice: Conserver la formulation sans l’expliquer
  alternative: « fidèle à toute parole qui lui était adressée »
  rationale: La syntaxe transmise rattache naturellement l’action de parler à Abraham, mais la formulation demeure inhabituelle. La traduction suit le texte fourni plutôt que de résoudre la difficulté par une interprétation théologique.
translation_notes:
  register: Français international actuel, digne et lisible. La ponctuation maintient « Quand je l’ai appelé » comme phrase distincte, conformément au texte transmis, malgré son lien narratif abrupt avec le contexte précédent.
