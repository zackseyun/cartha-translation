  text: which they shed in the midst of the earth, He destroyed everything; and I and you, my children, and all who entered with us into the ark were left. And now, behold, I see before me your deeds, that you are not walking in righteousness, for you have begun to walk in the path of corruption, and you are separating, each one from his neighbor, and are jealous of one another, and are not united together.
translation:
  language: fr
  text: '« À cause de ce qu’ils avaient répandu au milieu de la terre, il détruisit tout. Il ne resta que moi, vous, mes enfants, et tous ceux qui étaient entrés avec nous dans l’arche. Et maintenant, voici que je vois devant moi vos œuvres : vous ne marchez pas dans la justice, car vous avez commencé à suivre le chemin de la corruption. Vous vous séparez les uns des autres, vous êtes jaloux les uns des autres et vous n’êtes pas unis. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘከዐዉ
  choice: ce qu’ils avaient répandu
  rationale: Le verbe signifie « verser, répandre » et renvoie vraisemblablement au sang mentionné dans le contexte précédent.
- source_word: ደምሰሰ፡ ኵሎ
  choice: il le détruisit entièrement
  rationale: ደምሰሰ exprime la destruction ou l’effacement, et ኵሎ signifie « tout, entièrement » plutôt que « eux tous ».
- source_word: ዘተሐውሩ፡ በጽድቅ
  choice: vous ne marchez pas dans la justice
  rationale: L’imparfait guèze décrit ici une conduite présente ou continue; « marcher dans la justice » conserve l’image éthique de la source.
- source_word: በፍኖተ፡ ሙስና
  choice: le chemin de la corruption
  rationale: ፍኖት est au singulier et désigne un chemin ou une voie; « corruption » rend la dégradation morale exprimée par ሙስና.
- source_word: ከመ፡ ኢትሄልዉ፡ ኅቡረ
  choice: vous ne vivez pas dans l’unité
  rationale: La tournure signifie littéralement qu’ils ne sont pas ensemble; cette formulation naturelle exprime leur manque d’unité sans en préciser excessivement la forme.
theological_decisions:
- issue: Sujet implicite de « détruisit »
  choice: il
  alternative: Dieu
  rationale: La source porte un sujet verbal masculin implicite. Le pronom préserve le lien contextuel sans ajouter explicitement le nom divin.
- issue: Image de la marche morale
  choice: marcher dans la justice / suivre le chemin de la corruption
  alternative: se conduire avec justice / adopter une conduite corrompue
  rationale: Le maintien de l’image du chemin respecte le parallélisme et la texture métaphorique de la source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement fluidifiée, notamment par « Il ne resta que… », tout en conservant les images de la marche, du chemin et de l’unité.
