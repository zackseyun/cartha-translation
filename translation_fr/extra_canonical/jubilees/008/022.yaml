base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/022.yaml
  text: all the land of Eden, and all the land of the Erythraean Sea, and all the land of the east, and India, and on the Erythraean Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the north, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea beyond the mountains of Asshur toward the north—a blessed and spacious land, and all that is in it is very good.
translation:
  language: fr
  text: 'tout le pays d’Éden, tout le pays de la mer Érythrée, tout le pays de l’Orient et l’Inde, ainsi que les régions de la mer Érythrée et de ses montagnes ; tout le pays du Bashân, tout le pays du Liban et les îles de Kaphtor ; toutes les montagnes du Senir et de l’Amana, les montagnes d’Assour au nord ; tout le pays d’Élam, d’Assour et de Babylone, ainsi que Suse et la Médie ; toutes les montagnes de l’Ararat et toute la région située au-delà de la mer, par-delà les montagnes d’Assour, en direction du nord : un pays béni et vaste, où tout est très bon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኤዶም
  choice: Éden
  rationale: Forme française traditionnelle et immédiatement reconnaissable du toponyme.
- source_word: ባሕረ ኤርትራ
  choice: mer Érythrée
  rationale: Désignation géographique ancienne, préférable à une identification moderne plus étroite comme « mer Rouge ».
- source_word: ህንድ
  choice: Inde
  rationale: Équivalent géographique français courant.
- source_word: ካፍቶር
  choice: Kaphtor
  rationale: Translittération biblique française qui préserve le toponyme ancien sans l’identifier de façon spéculative.
- source_word: አሱር
  choice: Assour
  rationale: Conserve la forme du toponyme ancien plutôt que de l’assimiler partout à l’entité politique plus tardive appelée Assyrie.
- source_word: ሱሳን
  choice: Suse
  rationale: Forme française usuelle du nom de la ville antique.
- source_word: ማዳይ
  choice: Médie
  rationale: Rend le nom géographique collectif par sa forme française historique courante.
- source_word: ቡርክት፡ ወስፍሕት
  choice: béni et vaste
  rationale: Expression naturelle et digne qui conserve les deux qualités du pays.
theological_decisions:
- issue: Évaluation finale du territoire
  choice: « où tout est très bon »
  alternative: « et tout ce qui s’y trouve est très bon »
  rationale: La formulation retenue exprime fidèlement l’évaluation positive sans lui ajouter une portée doctrinale étrangère au contexte géographique.
- issue: Orientation des montagnes d’Assour
  choice: « au nord »
  alternative: « au sud »
  rationale: La lecture gé’éz signalée par la révision textuelle indique le nord; l’ancienne traduction « au sud » n’est donc pas retenue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’énumération géographique est structurée par des points-virgules afin de rester lisible sans réduire l’effet cumulatif du texte source. Les toponymes anciens sont conservés sous leurs formes françaises usuelles ou translittérées avec prudence.
