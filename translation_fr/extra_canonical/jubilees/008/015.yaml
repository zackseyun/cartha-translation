    issue: La note a propose « vers l’ouest d’Afra » comme variante.
    rationale: La séquence éthiopienne exprime la direction vers l’ouest et l’arrivée à Afra (« vers l’ouest, jusqu’à/vers Afra »), non une localisation à l’ouest d’Afra. Cette variante est donc trompeuse et doit être retirée.
  - severity: low
    issue: La note b signale une ambiguïté qui n’exige pas de note dans la traduction française.
    rationale: « Les eaux du fleuve Guihon » rend naturellement la juxtaposition « eaux–Guihon–fleuve » sans décider d’une question doctrinale ou historique. La variante proposée est possible comme reformulation très littérale, mais n’apporte pas d’information textuelle nécessaire au lecteur.
  revised_text: Cette mer est appelée la langue de la mer d’Égypte. De là, elle se dirige vers le nord, vers l’embouchure de la Grande Mer, au bord des eaux ; puis elle va vers l’ouest jusqu’à Afra et poursuit son cours jusqu’à proximité des eaux du fleuve Guihon, au nord des eaux du Guihon.
