  yaml_path: translation/extra_canonical/jubilees/008/015.yaml
  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
translation:
  language: fr
  text: Cette mer est appelée la langue de la mer d’Égypte. De là, elle se dirige vers le nord, vers l’embouchure de la Grande Mer, au bord des eaux ; puis elle va vers l’ouest jusqu’à Afra et poursuit son cours jusqu’à proximité des eaux du fleuve Guihon, au nord des eaux du Guihon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልሳነ፡ ባሕረ፡ ገብጽ
  choice: la langue de la mer d’Égypte
  rationale: Rend littéralement l’image géographique « langue de mer » sans la remplacer par un terme interprétatif comme « golfe ».
- source_word: አፉሃ፡ ለባሕር፡ ዐቢይ
  choice: l’embouchure de la Grande Mer
  rationale: Le terme désigne littéralement la « bouche » de la mer ; « embouchure » conserve l’image géographique dans un français naturel.
- source_word: ዐረብ
  choice: l’ouest
  rationale: Dans ce contexte d’itinéraire frontalier, le mot indique la direction occidentale.
- source_word: ዐፍራ
  choice: Afra
  rationale: Translittération prudente du toponyme, dont l’identification demeure incertaine.
- source_word: ጊዮን
  choice: Guihon
  rationale: Emploie la forme française biblique courante du nom géographique.
