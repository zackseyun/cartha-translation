base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
translation:
  language: fr
  text: Et, la sixième année, elle lui enfanta un fils, et il lui donna le nom de Péleg[a], car, en ses jours, lorsqu’il naquit, les fils de Noé commencèrent à se partager la terre entre eux. C’est pourquoi il lui donna le nom de Péleg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom Péleg (geʿez : ፋሌክ, Fālēk) évoque la racine hébraïque פלג (plg), « diviser, partager », en lien avec le partage de la terre mentionné dans ce verset.'
    reason: lexical_choice
lexical_decisions:
- source_word: ፋሌክ
  choice: Péleg
  rationale: Emploie la forme biblique française courante du nom patriarcal et conserve, en note, le jeu étymologique avec la division de la terre.
- source_word: ይትካፈሉ
  choice: se partager
  rationale: Le verbe exprime ici une répartition entre les fils de Noé; « se partager la terre » est naturel en français et garde la valeur de division ou de partage.
- source_word: ደቂቀ፡ ኖኅ
  choice: les fils de Noé
  rationale: Rend directement la relation généalogique exprimée par le texte et correspond au contexte du partage entre les descendants immédiats de Noé.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition finale du nom est conservée conformément au texte source; la tournure « à l’époque où il naquit » maintient le lien temporel sans lever artificiellement sa légère ambiguïté.
