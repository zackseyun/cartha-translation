base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: fr
  text: La terre fut remplie de violence. Après cela, ils péchèrent contre les bêtes, les oiseaux, tout ce qui se déplace et tout ce qui marche sur la terre, et du sang fut versé en abondance sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: violence
  rationale: Le terme désigne ici la violence ou l’injustice violente; « violence » convient naturellement au contexte de l’effusion de sang.
- source_word: አበሱ
  choice: ils péchèrent
  rationale: Le verbe exprime l’idée de commettre une faute ou un péché; le passé simple maintient le registre narratif et solennel.
- source_word: አራዊት
  choice: les bêtes
  rationale: Ce terme collectif désigne les animaux terrestres, souvent les bêtes sauvages; « les bêtes » préserve sa portée générale.
- source_word: ዐዋፍ
  choice: les oiseaux
  rationale: Équivalent direct et courant du nom collectif désignant les créatures ailées.
- source_word: ዘይትሐወስ
  choice: tout ce qui se déplace
  rationale: La formulation conserve la catégorie générale des êtres qui se meuvent sans la réduire arbitrairement aux reptiles.
- source_word: ዘያንሶሱ
  choice: tout ce qui marche
  rationale: Le choix distingue cette catégorie de la précédente et rend explicitement le mouvement sur la terre.
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  choice: beaucoup de sang fut répandu
  rationale: Cette tournure idiomatique française conserve l’image source et sa construction passive.
theological_decisions:
- issue: Nature du péché commis contre les animaux
  choice: Conserver « ils péchèrent contre » sans préciser la forme du péché
  alternative: Interpréter comme violence, corruption ou relations contre nature
  rationale: Le texte ne définit pas explicitement la faute; la traduction préserve donc l’ambiguïté et évite d’importer une interprétation doctrinale ou narrative.
translation_notes:
  register: Français moderne, clair et digne, avec un passé simple adapté au récit ancien. La répétition de « sur la terre » est conservée parce qu’elle structure et souligne le texte source.
