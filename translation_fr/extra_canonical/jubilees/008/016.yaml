base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/016.yaml
  text: And it goes toward the border of this river, and it goes toward the east until it approaches the garden of Eden, toward its north, to the north, and from the east of all the land of Eden, and to all the east, and it turns within the east and comes until it approaches the east of the mountain whose name is
translation:
  language: fr
  text: Elle se dirige vers la limite de ce fleuve, puis vers l’est, jusqu’à s’approcher du jardin d’Éden, vers son nord, vers le nord. Depuis l’est de tout le pays d’Éden, vers tout l’est, elle tourne à l’intérieur de l’est et va jusqu’à s’approcher du côté est de la montagne appelée…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንገበ፡ ድንጋጉ፡ ለዝ፡ ፈለግ
  choice: vers la limite de ce fleuve
  rationale: መንገበ exprime ici la direction (« vers »), tandis que ድንጋጉ désigne sa limite ou sa frontière, et non un chemin ni un nom propre.
- source_word: ጽባሕ
  choice: l’est / l’Orient
  rationale: Le terme désigne l’est. « L’Orient » est retenu lorsque le texte semble envisager une vaste région, et « l’est » lorsqu’il indique simplement une direction ou un côté.
- source_word: መንገበ፡ ሰሜኑ፡ ለሰሜን
  choice: du côté nord, vers le nord
  rationale: La formulation conserve les deux indications septentrionales du guèze sans les fondre en « nord-est ».
- source_word: እምጽባሒሃ፡ ለኵላ፡ ምድረ፡ ኤዶም
  choice: Partant de l’est de tout le pays d’Éden
  rationale: La préposition እም (« depuis, à partir de ») doit être conservée; le suffixe renvoie au côté est du pays d’Éden.
- source_word: መንገበ፡ ጽባሒሁ፡ ለደብር
  choice: du côté est de la montagne
  rationale: La construction situe l’approche par rapport au côté oriental de la montagne; elle ne signifie pas simplement « vers la montagne à l’est ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et géographique. La répétition des points cardinaux est maintenue parce qu’elle appartient à la délimitation du territoire. Le verset étant syntaxiquement inachevé dans l’extrait fourni (« la montagne appelée… »), les points de suspension préservent cette continuité avec le verset suivant.
