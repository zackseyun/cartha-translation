  rationale: Expression anaphorique signifiant « à son sujet » ou « à ce propos »; la tournure française « en parla » est naturelle et maintient le référent implicite.
theological_decisions:
- issue: Lecture de ወአነገረ
  choice: et en parla
  alternative: et n’en parla pas
  rationale: Le texte guèze fourni porte la forme affirmative « et il parla/raconta ». La lecture négative suppose une correction conjecturale en ወኢነገረ; elle est donc signalée en note plutôt qu’introduite dans le texte principal.
- issue: Segmentation du verset
  choice: Conserver des points de suspension au début et à la fin
  alternative: Reconstituer le contexte à partir des versets voisins
  rationale: Le segment fourni commence par la fin d’une phrase antérieure et s’interrompt après le début de la suivante. Les points de suspension rendent cette situation sans importer de texte extérieur à la source donnée.
