lexical_decisions:
- source_word: ትእምረ፡ ሰማይ
  choice: les signes du ciel
  rationale: Rend directement l’expression guèze désignant les signes ou phénomènes célestes, sans préciser s’il s’agit de présages ou de constellations.
- source_word: ወጸሐፋ
  choice: Il le mit par écrit
  rationale: Le verbe signifie qu’il écrivit ou consigna la chose; le pronom objet est conservé sans identifier davantage son référent, absent de ce segment.
- source_word: በእንቲአሃ
