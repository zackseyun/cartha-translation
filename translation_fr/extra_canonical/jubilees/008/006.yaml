  language: fr
  text: 'Car il avait dit : « Oui, j’ai été envoyé. » La quatrième année, Shéla naquit et grandit. Il prit pour femme Melka, fille de Kébed, frère de son père, la première année de la cinquième semaine du trente et unième jubilé.'
