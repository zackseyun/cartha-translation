  text: And he blessed the God of gods, who had put the word of the Lord in his mouth.
translation:
  language: fr
  text: Et il bénit le Dieu des dieux, qui avait mis dans sa bouche la parole du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: il bénit
  rationale: Rend directement le verbe geʽez au parfait, avec un passé simple adapté au registre narratif.
- source_word: አምላክ፡ አማልክት
  choice: le Dieu des dieux
  rationale: Conserve la construction superlative et solennelle du texte source sans en atténuer la formulation.
- source_word: ወደየ፡ ውስተ፡ አፉሁ
  choice: avait mis dans sa bouche
  rationale: Exprime naturellement en français l’action antérieure désignée par la relative geʽez.
- source_word: ንባበ፡ እግዚአብሔር
  choice: la parole du Seigneur
  rationale: « Parole » rend ici le discours ou message placé dans la bouche, tandis que « Seigneur » est l’équivalent français traditionnel et intelligible du titre divin.
theological_decisions:
- issue: Sens de « Dieu des dieux »
  choice: Conserver littéralement « le Dieu des dieux »
  alternative: « le Dieu suprême »
  rationale: La formulation source garde une tension possible sur la portée du mot « dieux »; la remplacer par un titre interprétatif résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le premier mot fourni, ተፈጥረ (« fut créé »), est traité comme la fin résiduelle du verset précédent conformément à la segmentation attestée par la couche de consultation et n’est donc pas intégré à JUB.8.28.
