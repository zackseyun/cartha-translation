base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
translation:
  language: fr
  text: 'et le Seigneur pour toujours. Il sut qu’une part de bénédiction et une bénédiction étaient échues à Sem et à ses fils pour toutes les générations, à jamais : tout le pays d’Édom, tout le pays de la mer Rouge, tout le pays de l’Orient et de l’Inde, ainsi que la mer Rouge et ses montagnes, tout le pays du Bashân, tout le pays du Liban et les îles de Kaftor, toutes les montagnes du Senir et de l’Amana, les montagnes d’Assour au sud, tout le pays d’Élam, d’Assour et de Babylone, Suse et la Médie, toutes les montagnes de l’Ararat, et toute la région située au-delà de la mer et au-delà des montagnes d’Assour, vers le nord.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ
  choice: une part bénie et une bénédiction
  rationale: Rend les deux éléments distincts, « part de bénédiction » et « bénédiction », sans introduire l’idée non attestée d’une part « vaste ».
- source_word: እስከ፡ ለዓለም
  choice: pour toujours
  rationale: Expression temporelle idiomatique en français, ici rattachée au fragment qui clôt la phrase précédente.
- source_word: ምድረ፡ ጽባሕ
  choice: le pays de l’Orient
  rationale: Le terme désigne l’est ou l’orient; « Orient » convient au registre géographique de l’énumération.
- source_word: ኤርትራ
  choice: la mer Rouge
  rationale: Dans cette tradition géographique, le nom renvoie à la mer Érythrée, rendue ici par l’appellation française courante « mer Rouge ».
- source_word: ከፍቸር
  choice: Kaftor
  rationale: Translittération française reconnaissable du toponyme biblique, sans identification géographique conjecturale.
- source_word: አሱር
  choice: Assour
  rationale: Conserve le toponyme ancien et évite de le confondre automatiquement avec l’ensemble politique plus tardif de l’Assyrie.
theological_decisions:
- issue: Nature de l’héritage attribué à Sem
  choice: « une part bénie et une bénédiction »
  alternative: « une part vaste et bénie »
  rationale: Le texte source exprime à la fois la part bénie et la bénédiction; il ne contient pas clairement l’adjectif « vaste ».
- issue: Durée de l’attribution à Sem et à ses descendants
  choice: « pour toutes les générations, à jamais »
  alternative: « pour les générations éternelles »
  rationale: La formulation retenue garde la portée durable du texte tout en restant naturelle en français, sans développer une doctrine particulière de l’éternité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le fragment initial a été conservé parce qu’il figure dans le segment guèze fourni, même s’il clôt manifestement la phrase du verset précédent. Les noms géographiques anciens sont maintenus sous des formes françaises usuelles ou des translittérations prudentes.
