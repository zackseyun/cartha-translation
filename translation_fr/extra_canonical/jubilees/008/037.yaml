  text: Before the altar that is accepted. And in the fifth year make a release, so that you may release it.
translation:
  language: fr
  text: Devant l’autel qui est agréé. Et la cinquième année, faites une remise[a], afin que vous le laissiez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte transmis lit littéralement « ils firent une remise ». L’impératif « faites » suppose probablement une correction de graphie, en accord avec la deuxième personne du pluriel dans la suite.
    reason: textual_variant
  - marker: b
    text: Ou « afin que vous le relâchiez » ou « le libériez ».
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ምሥዋዕ
  choice: autel
  rationale: Le nom guèze désigne ici l’autel, à distinguer de መሥዋዕት, « offrande, sacrifice ».
- source_word: ዘይትወከፍ
  choice: qui est agréé
  rationale: La forme passive exprime ce qui est reçu ou accepté; « agréé » convient au contexte cultuel sans préciser qui l’agrée.
- source_word: ኅድገተ
  choice: une remise
  rationale: Le terme peut évoquer une remise, une libération ou le fait de laisser; « remise » conserve la portée institutionnelle sans déterminer excessivement son objet.
- source_word: ታሕድግዎ
  choice: afin que vous le libériez
  rationale: La forme est à la deuxième personne du pluriel et comporte un objet masculin singulier; « libériez » rend le sens de relâcher, avec une note signalant l’autre nuance possible.
theological_decisions:
- issue: Discordance de personne entre ገበሩ et ታሕድግዎ
  choice: 'Traduire ገበሩ comme l’impératif probablement visé: « faites »'
  alternative: « ils firent une remise, afin que vous le libériez »
  rationale: La graphie transmise correspond normalement à « ils firent », mais la deuxième personne plurielle du verbe suivant et le contexte injonctif soutiennent fortement la lecture impérative ግበሩ. La note conserve toutefois la forme effectivement transmise.
translation_notes:
  register: Français moderne, sobre et cultuel. La formulation fragmentaire de la première phrase est conservée, car elle appartient au texte source fourni; aucune liaison absente du guèze n’a été ajoutée.
