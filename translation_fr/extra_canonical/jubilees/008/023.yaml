  text: and a man his neighbor. And everyone sold himself to do iniquity and to shed much blood.
translation:
  language: fr
  text: et chacun son prochain. Tous se vendirent pour commettre l’injustice et répandre beaucoup de sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: et chacun son prochain
  rationale: Le texte guèze forme ici un segment elliptique, littéralement proche de « et un homme, son prochain ». La formulation française conserve cette ellipse et le lien avec ce qui précède, sans ajouter un verbe absent du segment transmis.
- source_word: ኵሉ፡ ተሰይጠ
  choice: Tous se vendirent
  rationale: Le verbe exprime l’idée de se vendre ou de se livrer soi-même. « Se vendirent » préserve l’image forte du texte source.
- source_word: ይግበር፡ ዐመፃ
  choice: pour commettre l’injustice
  rationale: La construction indique le but; ዐመፃ désigne l’iniquité, la violence injuste ou la transgression. « L’injustice » reste large et naturel en français.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: répandre beaucoup de sang
  rationale: L’expression correspond à l’image de verser ou répandre du sang en abondance. La traduction conserve cette formulation concrète.
theological_decisions:
- issue: Portée morale de ዐመፃ
  choice: l’injustice
  alternative: l’iniquité
  rationale: « Injustice » rend la faute morale et la violence sociale sans imposer une terminologie confessionnelle; « iniquité » serait possible mais plus archaïque.
