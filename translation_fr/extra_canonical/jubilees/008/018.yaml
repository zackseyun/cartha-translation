  text: For Shem and for his sons to possess it forever, for his generations forever. And Noah rejoiced because this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy, for he said, “Blessed be the Lord God of Shem, and may he dwell...
translation:
  language: fr
  text: 'pour que Sem et ses fils la possèdent à jamais, de génération en génération. Noé se réjouit de ce que cette part était échue à Sem et à ses fils. Il se souvint de tout ce qu’il avait dit de sa bouche en prophétie, car il avait dit : « Béni soit le Seigneur, Dieu de Sem, et qu’il demeure… »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte source fourni s’interrompt après « qu’il demeure » ; le sujet du verbe n’y est pas exprimé explicitement.
    reason: Signaler honnêtement que la phrase est inachevée dans l’extrait disponible et préserver l’ambiguïté du sujet.
lexical_decisions:
- source_word: ለእኂዞታ
  choice: pour que […] la possèdent
  rationale: 'L’infinitif ge’ez porte un suffixe pronominal féminin singulier : il exprime directement l’idée de « la posséder », la part ou la terre ayant été décrite auparavant.'
- source_word: መክፈልት
  choice: part
  rationale: Le terme désigne ici la portion attribuée lors du partage du territoire. « Part » est naturel en français et conserve ce sens distributif.
- source_word: ወፅአ
  choice: était échue
  rationale: Le verbe signifie littéralement « sortit ». Dans le contexte d’un partage, « échoir à » rend idiomatiquement l’attribution par lot sans ajouter de détail absent du texte.
- source_word: በትንቢት
  choice: en prophétisant
  rationale: Cette formulation restitue la valeur circonstancielle de l’expression et donne un français courant, tout en maintenant explicitement le caractère prophétique des paroles de Noé.
- source_word: ይትባረክ
  choice: Béni soit
  rationale: Le jussif passif est rendu par la formule française consacrée et grammaticalement équivalente.
theological_decisions:
- issue: Référent du sujet implicite de ወይኅድር (« et qu’il demeure »)
  choice: Conserver le pronom « il » sans identifier davantage le sujet
  alternative: Expliciter « que Dieu demeure » ou attribuer le verbe à un autre personnage selon la suite de Genèse 9:27
  rationale: Le fragment ge’ez fourni ne nomme pas le sujet et s’interrompt immédiatement après le verbe. Le pronom français préserve cette indétermination sans résoudre artificiellement la tension.
- issue: Titre divin እግዚአብሔር አምላኩ ለሴም
  choice: « le Seigneur, Dieu de Sem »
  alternative: « le Seigneur, le Dieu de Sem »
  rationale: La formulation retenue suit de près l’apposition du texte source et reste digne et naturelle en français, sans ajouter un article absent de la construction.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. La syntaxe initiale conserve le lien avec la phrase commencée au verset précédent. « De génération en génération » rend naturellement la durée transgénérationnelle, tandis que « à jamais » maintient l’insistance du texte.
