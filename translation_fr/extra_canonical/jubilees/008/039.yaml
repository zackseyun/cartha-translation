  terminology: « Prescrire » convient pour le verbe de commandement, mais la cohérence lexicale requiert de l’employer également pour l’adresse de Noé à ses enfants. « Rendre témoignage » est une restitution idiomatique défendable de አስምዐ; la note préserve à juste titre la lecture plus littérale.
