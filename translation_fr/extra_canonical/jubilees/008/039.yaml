base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
translation:
  language: fr
  text: Il m’a prescrit tout ce que ses pères lui avaient prescrit. Et moi aussi, je vous prescris, mes enfants, comme Hénoch avait prescrit à son fils au cours des premiers jubilés. De son vivant, dans la septième génération, il prescrivit et rendit témoignage[a] à son fils et aux enfants de son fils, jusqu’au jour de sa mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit entendre [ses paroles] ».'
    reason: Le verbe guèze peut désigner soit un témoignage solennel, soit, plus littéralement, le fait de faire entendre quelque chose.
lexical_decisions:
- source_word: አዘዘ / እኤዝዘክሙ
  choice: prescrire / donner mes prescriptions
  rationale: Le verbe exprime le fait d’ordonner ou de transmettre des commandements. « Prescrire » et « donner mes prescriptions » conservent cette force tout en évitant une répétition française trop lourde.
- source_word: በቀዳሚ፡ እዮቤልውሳት
  choice: au cours des premiers jubilés
  rationale: Cette formulation garde le pluriel du texte guèze et son repère chronologique sans réduire arbitrairement l’expression à un seul jubilé.
- source_word: አስምዐ
  choice: rendit témoignage
  rationale: Le causatif du verbe « entendre » peut, dans ce contexte d’exhortation solennelle, signifier faire entendre, attester ou témoigner. « Rendit témoignage » restitue l’emploi idiomatique probable, tandis que la note conserve le sens plus littéral.
- source_word: ለውሉደ፡ ውሉዱ
  choice: aux enfants de son fils
  rationale: Traduction directe de la relation généalogique exprimée, plutôt que le terme plus condensé « petits-enfants ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition autour des prescriptions est partiellement conservée parce qu’elle structure la transmission entre les générations. L’expression potentiellement obscure « les premiers jubilés » est maintenue afin de préserver le repère chronologique propre à l’ouvrage.
