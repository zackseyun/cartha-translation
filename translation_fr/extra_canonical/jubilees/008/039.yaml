  verdict: revise
  source_fidelity: 'La structure générale et les repères chronologiques du guèze sont bien représentés, y compris « les premiers jubilés », « la septième génération » et la transmission au fils puis aux enfants de celui-ci. Toutefois, le même verbe አዘዘ / እኤዝዘክሙ est rendu de façon inutilement disparate : « je vous donne mes prescriptions » affaiblit et reformule le commandement direct du texte.'
