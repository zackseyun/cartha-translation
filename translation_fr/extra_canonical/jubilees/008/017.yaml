lexical_decisions:
- source_word: ራፋ
  choice: Rafa
  rationale: Toponyme conservé par translittération; dans le découpage fourni, il termine vraisemblablement l’énoncé géographique précédent.
- source_word: ወይወርድ
  choice: Puis elle descend
  rationale: Le verbe exprime un mouvement descendant; «elle» reprend naturellement la limite ou ligne géographique implicite dans le contexte.
- source_word: መንገበ፡ ጽንፉ፡ ለመጻእ፡ ጢና፡ ፈለገ
