base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
translation:
  language: fr
  text: Ce sont les fils de Noé. Au vingt-huitième jubilé et la septième semaine, tandis que Noé prescrivait aux enfants de ses fils les règles, les commandements et tout ce qu’il connaissait de la justice,[a] il exhorta ses fils à pratiquer la justice, à couvrir la nudité de leur corps, à bénir celui qui les avait créés, à honorer leur père et leur mère, à s’aimer les uns les autres et à se préserver de l’immoralité sexuelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte éthiopien se lit littéralement : « tandis que Noé prescrivait… il exhorta ses fils ». Selon une autre lecture ou correction proposée, on peut comprendre : « Noé commença à prescrire… puis il exhorta ses fils » ; la ponctuation de la phrase est alors différente.'
    reason: La forme እንዘ se comprend normalement « tandis que »; une lecture corrigée, attestée dans la tradition de traduction, donne « commença à ».
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ፡
  choice: les règles, les commandements
  rationale: Distingue les deux termes, le premier désignant ce qui est établi ou ordonné, le second un commandement explicite.
- source_word: ፍትሐ፡
  choice: la justice
  rationale: Conserve le champ juridique et moral du terme sans le réduire à une simple connaissance du bien.
- source_word: ወአስምዐ፡ ላዕለ፡ ውሉዱ፡
  choice: il exhorta solennellement ses fils
  rationale: Rend naturellement en français l’idée d’un témoignage ou avertissement pressant adressé aux fils, dans une série d’injonctions morales.
- source_word: ኃፍረተ፡ ሥጋሆሙ፡
  choice: la nudité de leur corps
  rationale: Le sens littéral est la « honte de leur chair »; l’expression vise ici les parties honteuses ou la nudité corporelle.
- source_word: አሐዱ፡ አሐዱ፡ ቢጾ፡
  choice: à aimer chacun son prochain
  rationale: ቢጽ désigne un compagnon, un semblable ou un prochain plutôt qu’un frère biologique; « chacun son prochain » préserve la construction distributive.
- source_word: ዝሙት፡
  choice: l’immoralité sexuelle
  rationale: Terme englobant les conduites sexuelles illicites; cette formulation française est plus large et plus claire que le seul « adultère ».
theological_decisions:
- issue: Relation entre justice morale et commandements transmis par Noé
  choice: Maintenir « justice », « règles » et « commandements » comme notions distinctes
  alternative: Fusionner l’ensemble sous « la Loi »
  rationale: Le texte juxtapose plusieurs termes et ne les identifie pas explicitement à une codification religieuse particulière.
- issue: Portée de ቢጾ
  choice: « son prochain »
  alternative: « son frère »
  rationale: Le lexème peut désigner le compagnon ou le semblable; « prochain » évite d’imposer une relation familiale absente du mot source.
- issue: Portée de ዝሙት
  choice: « immoralité sexuelle »
  alternative: « fornication »
  rationale: Le choix retenu garde la portée générale du terme sans lui attribuer une définition confessionnelle plus étroite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période du texte source est conservée tout en étant structurée par une ponctuation claire. « Nudité du corps » et « immoralité sexuelle » restent dignes et compréhensibles sans archaïsme.
