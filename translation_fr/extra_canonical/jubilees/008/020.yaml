revisions:
- from: Ce sont là les fils de Noé. Au vingt-huitième jubilé, dans sa septième semaine, tandis que Noé prescrivait aux enfants de ses fils les règles, les commandements et tout ce qu’il connaissait de la justice,[a] il exhorta solennellement ses fils à pratiquer la justice, à couvrir la nudité de leur corps, à bénir celui qui les avait créés, à honorer leur père et leur mère, à aimer chacun son prochain et à se garder eux-mêmes de l’immoralité sexuelle.
  to: Ce sont les fils de Noé. Au vingt-huitième jubilé et la septième semaine, tandis que Noé prescrivait aux enfants de ses fils les règles, les commandements et tout ce qu’il connaissait de la justice,[a] il exhorta ses fils à pratiquer la justice, à couvrir la nudité de leur corps, à bénir celui qui les avait créés, à honorer leur père et leur mère, à s’aimer les uns les autres et à se préserver de l’immoralité sexuelle.
  rationale: La révision conserve la lecture du texte éthiopien reçue, signalée par la note, sans imposer la correction « commença à ». Elle explicite le repère « et la septième semaine », évite l’intensification de « solennellement », et rend plus naturellement l’amour mutuel ainsi que la préservation de soi face à l’immoralité sexuelle.
