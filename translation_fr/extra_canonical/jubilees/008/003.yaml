base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
translation:
  language: fr
  text: Son père lui apprit à écrire. Il partit ensuite chercher un endroit où il pourrait s’emparer d’une ville. Il trouva un écrit que les anciens avaient gravé dans la roche. Il lut ce qui y était écrit et le recopia. Il découvrit ainsi que cet écrit contenait l’enseignement des Veilleurs, au moyen duquel ils observaient les présages du soleil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ
  choice: à écrire / un écrit
  rationale: Le nom désigne ici d’abord l’écriture comme savoir enseigné, puis un document écrit découvert dans la roche; la variation française rend naturellement ces deux emplois contextuels.
- source_word: ይእኅዝ
  choice: s’emparer de
  rationale: Le verbe exprime l’idée de prendre ou saisir; «s’emparer de» conserve la force du texte sans l’atténuer en simple établissement.
- source_word: ዘቈረጹ
  choice: avaient gravé
  rationale: Dans le contexte d’un texte taillé dans la roche, «graver» rend idiomatiquement l’action de couper ou inciser.
- source_word: ወአዕለዎ
  choice: et le recopia
  rationale: Le verbe indique la copie ou la transcription du document, et non sa seule compréhension.
- source_word: ትጉሃን
  choice: les Veilleurs
  rationale: Terme traditionnel désignant les êtres angéliques appelés «Watchers» dans la littérature hénochique; la majuscule signale qu’il s’agit d’un groupe déterminé.
- source_word: ሰገለ፡ ፀሓይ
  choice: les présages du soleil
  rationale: La formulation conserve la référence divinatoire aux signes ou présages solaires, sans préciser une méthode que le texte ne donne pas.
theological_decisions:
- issue: Nature de l’enseignement des Veilleurs
  choice: «l’enseignement des Veilleurs»
  alternative: «la doctrine des Vigilants»
  rationale: «Veilleurs» est clair et bien établi en français pour ce groupe de la tradition hénochique, tandis que «enseignement» reste neutre quant à sa valeur ou à son autorité.
- issue: Rapport aux présages solaires
  choice: «au moyen duquel ils observaient les présages du soleil»
  alternative: «qui leur servait à interpréter les signes du soleil»
  rationale: «Observaient» suit de plus près la formulation transmise et évite d’ajouter explicitement l’idée d’interprétation, même si elle peut être impliquée.
translation_notes:
  register: 'Français moderne, narratif et digne. Les répétitions lourdes de la construction guèze sont légèrement resserrées sans supprimer les étapes du récit: apprentissage, recherche, découverte, lecture, copie et identification du contenu.'
