base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
translation:
  language: fr
  text: La pensée et le désir de l’être humain conçoivent sans cesse ce qui est vain et mauvais, et le Seigneur effaça tout de la surface de la terre à cause de leurs mauvaises actions et à cause du sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: La pensée et le désir de l’être humain
  rationale: Rend les deux noms coordonnés (« pensée » et « désir/volonté ») et emploie « être humain » au sens générique.
- source_word: ይኄሊ
  choice: conçoivent
  rationale: Exprime l’activité mentale indiquée par le verbe (« penser, imaginer, concevoir »), plutôt qu’un simple état moral.
- source_word: ከንተ፡ ወእኩየ
  choice: ce qui est vain et mauvais
  rationale: Conserve les deux éléments du texte, la vanité/futilité et le mal, sans réduire l’expression à « étaient mauvais ».
- source_word: በኵሉ፡ መዋዕል
  choice: sans cesse
  rationale: Expression française naturelle pour « tous les jours/continuellement » dans ce contexte.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እምነ፡ ገጸ፡ ምድር
  choice: et le Seigneur effaça tout de la surface de la terre
  rationale: Suit la structure et la portée globale du texte source; « effaça » restitue l’idée de suppression/destruction.
- source_word: ወበእንተ፡ ደም
  choice: et à cause du sang versé
  rationale: « Sang versé » explicite en français idiomatique la valeur accusatrice de « sang » dans ce contexte, tout en signalant en note la formulation littérale.
theological_decisions:
- issue: Portée de la corruption humaine
  choice: conçoivent sans cesse ce qui est vain et mauvais
  alternative: étaient mauvais continuellement
  rationale: Le choix retenu préserve le verbe d’activité mentale et le terme « vain » présents dans le guèze, sans transformer la phrase en affirmation ontologique plus générale.
- issue: Référence au sang
  choice: le sang versé
  alternative: le sang
  rationale: La formulation principale est naturelle et contextuellement intelligible; la note maintient la possibilité de lire le substantif de façon strictement littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination au singulier (« la pensée et le désir ») prend naturellement un verbe au pluriel. Le rendu conserve la répétition causale « à cause de… et à cause de… » ainsi que la tension entre vanité et mal.
