  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
translation:
  language: fr
  text: Au vingt-neuvième jubilé[a], pendant la première semaine, la première année de celle-ci, Arpakshad prit pour femme Rasoueya, fille de Sousan, fille d’Élam, et elle lui enfanta[b]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La leçon imprimée peut se comprendre comme « quarante-neuvième », mais la chronologie du récit indique « vingt-neuvième ».
    reason: Signaler honnêtement la difficulté textuelle du chiffre et le fondement de la correction retenue.
  - marker: b
    text: La phrase se poursuit au verset suivant, qui nomme l’enfant.
    reason: Expliquer pourquoi la proposition demeure syntaxiquement inachevée à la limite du verset.
lexical_decisions:
- source_word: በ፬ሥራ፡ ወተስዐቱ፡ እዮቤልው
  choice: Au vingt-neuvième jubilé
  rationale: Le texte édité paraît présenter une erreur de lecture ou d’impression dans le chiffre; la chronologie du livre et la révision critique indiquent le vingt-neuvième jubilé, tandis que la leçon visible peut suggérer « quarante-neuvième ».
- source_word: በሱባዔ፡ ቀዳሚ፡ በቀዳሚሁ
  choice: pendant la première semaine, la première année de celle-ci
  rationale: Rend la séquence temporelle littéralement tout en explicitant que « sa première » désigne l’année de la semaine.
- source_word: ነሥአ፡ ሎቱ፡ አርፋክስድ፡ ብእሲተ
  choice: Arpakshad prit pour femme
  rationale: Formulation française naturelle correspondant à l’idiome « prit pour lui une femme ».
- source_word: ራሱእያ
  choice: Rasoueya
  rationale: Transcription française lisible du nom guèze, sans l’angliciser.
- source_word: ወለተ፡ ሱሳን፡ ወለተ፡ ኤላም
  choice: fille de Sousan, fille d’Élam
  rationale: Conserve la chaîne généalogique et son éventuelle ambiguïté syntaxique au lieu de la reformuler comme une relation masculine non exprimée.
- source_word: ወወለደት፡ ሎቱ
  choice: et elle lui enfanta…
  rationale: Le complément de l’enfantement se trouve manifestement dans le verset suivant; les points de suspension signalent cette coupure sans supprimer les mots du texte.
