base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
translation:
  language: fr
  text: Car je vois, et voici que les démons ont commencé à vous égarer, vous et vos enfants. Et maintenant, je crains qu’après ma mort vous ne répandiez du sang humain sur la terre et que vous ne soyez, vous aussi, détruits de la surface de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋንንት
  choice: les démons
  rationale: Correspond directement au pluriel guèze et conserve la désignation spirituelle négative du texte.
- source_word: አበሱተ፡ ወጠኑ
  choice: ont commencé à vous égarer
  rationale: Rend l’idée d’une action corruptrice déjà commencée, avec une formulation française naturelle adaptée au contexte.
- source_word: ትክዐዉ፡ ደመ፡ ሰብእ
  choice: vous ne répandiez du sang humain
  rationale: Traduit l’expression concrète « verser le sang de l’homme » sans l’atténuer en une simple mention de violence.
- source_word: ትደመሰሱ
  choice: vous ne soyez […] effacés
  rationale: Conserve l’image forte de suppression ou d’anéantissement, reprise par la formule « de la surface de la terre ».
theological_decisions:
- issue: Rôle des démons dans l’égarement
  choice: Les démons ont commencé à égarer les destinataires et leurs enfants.
  alternative: Les démons ont commencé à pécher contre eux ou à les corrompre.
  rationale: Le contexte exprime une influence conduisant à la faute; « égarer » préserve cette causalité sans préciser un mécanisme doctrinal.
- issue: Portée de la crainte après la mort du locuteur
  choice: La phrase exprime la crainte que les descendants versent du sang et subissent eux-mêmes la destruction.
  alternative: La présenter comme une prédiction certaine.
  rationale: La construction dépend du verbe « craindre »; la formulation française conserve donc la modalité de crainte plutôt que de transformer l’énoncé en prophétie catégorique.
translation_notes:
  register: Français international moderne, digne et direct. Le tour « je crains que… ne » emploie le ne explétif standard; il n’introduit pas de négation. La répétition finale de « terre » est maintenue pour conserver l’écho rhétorique de la source.
