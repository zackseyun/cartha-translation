base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
translation:
  language: fr
  text: Car il craignait d’en parler à Noé, de peur que celui-ci ne s’irrite contre lui à cause de cela. Au cinquième jubilé, dans la première semaine, la première année, il prit pour femme Melka, fille de Madaï, fils de Japhet. La quatrième année de cette semaine, il engendra un fils et l’appela Sala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይፈርህ
  choice: il craignait
  rationale: Rend directement le verbe de crainte tout en conservant la valeur narrative du contexte.
- source_word: ኢይትመዐዐ፡ ላዕሌሁ
  choice: de peur que celui-ci ne s’irrite contre lui
  rationale: Le tour français exprime naturellement la crainte d’une réaction hostile; «celui-ci» identifie Noé sans lever davantage l’ambiguïté des pronoms.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: il prit pour femme
  rationale: Formule française actuelle et digne correspondant à l’expression idiomatique «prendre une femme pour soi».
- source_word: ወሊደ፡ ወልደ
  choice: il engendra un fils
  rationale: Le verbe guèze est au masculin singulier et présente le personnage masculin comme sujet; «engendra» conserve la formulation généalogique.
- source_word: ሳላ
  choice: Sala
  rationale: Translittération française proche de la forme guèze, sans imposer une harmonisation confessionnelle avec une autre tradition textuelle.
theological_decisions:
- issue: Sujet du verbe de naissance
  choice: il engendra un fils
  alternative: elle lui donna un fils
  rationale: La morphologie masculine singulière du texte source soutient explicitement le sujet masculin; l’autre lecture n’est donc pas retenue dans le texte.
- issue: Référent de la quatrième année
  choice: la quatrième année de cette semaine
  alternative: la quatrième année de celui-ci / la quatrième année
  rationale: Dans la formule chronologique, le pronom renvoie naturellement à la semaine jubilaire; l’explicitation en français évite une obscurité accidentelle sans modifier la chronologie.
translation_notes:
  register: Français international moderne, narratif et digne. Les formules chronologiques restent visibles, tandis que leur syntaxe est légèrement explicitée pour être immédiatement intelligible. Les noms propres suivent au plus près les formes du texte guèze.
