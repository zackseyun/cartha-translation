base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/038.yaml
  text: You, in righteousness and uprightness, shall be righteous, and all your plantings shall prosper. For thus Enoch, the father of your father, commanded Methuselah his son, and Methuselah his son Lamech, and Lamech...
translation:
  language: fr
  text: Vous, dans la justice et la droiture, vous serez justes, et toutes vos plantations prospéreront. Car c’est ainsi qu’Hénoch, le père de votre père, ordonna à Mathusalem, son fils, et Mathusalem à Lamek, son fils, et Lamek…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽድቅ፡ ወበርትዕ
  choice: dans la justice et la droiture
  rationale: Conserve les deux qualités coordonnées du guèze, dans une formulation française naturelle et digne.
- source_word: ወትጸድቁ
  choice: vous serez justes
  rationale: Rend distinctement le verbe correspondant à la justice, sans le fondre dans le groupe prépositionnel précédent.
- source_word: ወይረተው፡ ኵሉ፡ ተክሊክሙ
  choice: et tout ce que vous planterez prospérera
  rationale: Exprime naturellement en français l’idée collective de l’ensemble des plantations et leur réussite.
- source_word: አዘዘ
  choice: donna ses instructions
  rationale: Restitue l’idée de prescrire ou d’ordonner dans le cadre d’une transmission familiale, sans dureté artificielle.
- source_word: አቡሁ፡ ለአቡክሙ
  choice: le père de votre père
  rationale: Préserve explicitement la relation généalogique formulée dans le texte source, sans la confondre avec Mathusalem.
theological_decisions:
- issue: Lien entre justice morale et prospérité des plantations
  choice: Maintenir les deux affirmations successives sans expliciter un rapport causal
  alternative: 'Traduire comme une promesse conditionnelle : « si vous êtes justes…, alors… »'
  rationale: Le texte les coordonne mais n’énonce pas explicitement une condition; la traduction conserve cette tension.
- issue: Chaîne de transmission patriarcale
  choice: Conserver Hénoch comme « le père de votre père » et Mathusalem comme « son fils »
  alternative: Identifier directement Mathusalem comme « votre père »
  rationale: Les deux relations sont exprimées séparément dans le guèze et ne doivent pas être fusionnées.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La reprise « Vous…, vous serez » conserve l’insistance de l’adresse plurielle. Les points de suspension signalent que l’extrait source s’interrompt après « et Lamek ».
