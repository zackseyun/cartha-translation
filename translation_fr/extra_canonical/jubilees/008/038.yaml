  source_fidelity: 'La chaîne généalogique est correctement distinguée : Hénoch est « le père de votre père », Mathusalem est son fils, puis Lamek est le fils de Mathusalem. En revanche, « tout ce que vous planterez » transforme le nom collectif « vos plantations » en une action future et en modifie légèrement la portée. « Ordonna » rend plus directement le verbe de commandement que « donna ses instructions ».'
