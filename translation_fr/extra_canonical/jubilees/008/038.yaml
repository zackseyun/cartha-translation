  terminology: « Justice », « droiture », « justes », « Hénoch », « Mathusalem » et « Lamek » sont appropriés. Aucun terme théologique ne requiert de note. Les points de suspension sont justifiés, car l’extrait source fourni s’interrompt après « et Lamek ».
