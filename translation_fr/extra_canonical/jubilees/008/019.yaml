base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
translation:
  language: fr
  text: '« … que le Seigneur demeure dans la demeure de Sem. »[a] Et il sut que le jardin d’Éden est le Saint des saints et la demeure du Seigneur, que le mont Sinaï est au milieu du désert, et que le mont Sion est au centre du nombril de la terre[b] : tous trois furent créés comme des lieux saints se faisant face.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset guèze commence par un fragment qui achève la bénédiction formulée au verset précédent ; « que le Seigneur demeure » en reprend la valeur de souhait.
    reason: Le texte principal doit signaler que le fragment dépend de la bénédiction optative antérieure, plutôt que de le lire comme une affirmation autonome.
  - marker: b
    text: 'Littéralement : « au milieu du nombril de la terre » ; l’expression désigne un centre cosmographique.'
    reason: La métaphore et la syntaxe du texte source sont inhabituelles et pourraient autrement sembler être une erreur de formulation.
  - marker: c
    text: 'La dernière proposition est difficile ; on pourrait aussi comprendre : « tous trois, l’un en face de l’autre, sont saints ».'
    reason: La syntaxe de la conclusion admet plusieurs analyses, qu’il convient de ne pas masquer.
lexical_decisions:
- source_word: ቅድስተ፡ ቅዱሳን
  choice: le Saint des saints
  rationale: Expression superlative cultuelle, conservée sous sa forme biblique française consacrée.
- source_word: ማኅደሩ፡ ለእግዚአብሔር
  choice: la demeure du Seigneur
  rationale: Rend directement l’idée du lieu où réside le Seigneur, tout en faisant écho à la « demeure de Sem ».
- source_word: ማእከለ፡ ሕንብርት፡ ለምድር
  choice: au centre du nombril de la terre
  rationale: Conserve l’image cosmographique inhabituelle du texte guèze et sa construction emboîtée plutôt que de la réduire au simple « centre de la terre ».
- source_word: መንጸረ
  choice: se faisant face
  rationale: Rend la relation spatiale de vis-à-vis entre les trois lieux sans préciser artificiellement leur disposition.
theological_decisions:
- issue: Valeur verbale du fragment initial
  choice: « … le Seigneur [habite] dans la demeure de Sem. »
  alternative: « Le Seigneur habita dans la demeure de Sem. »
  rationale: Le texte du verset commence par un fragment sans verbe qui poursuit la bénédiction optative du verset précédent. Les points de suspension signalent la continuité et les crochets indiquent le verbe fourni par le contexte, évitant d’en faire à tort une déclaration au passé.
- issue: Statut sacré des trois lieux
  choice: « tous trois furent créés comme des lieux saints »
  alternative: « ces trois lieux sont saints »
  rationale: La formulation retenue préserve l’affirmation d’une création ou constitution originelle de ces trois lieux en lieux saints, sans harmonisation doctrinale.
- issue: Identification du sujet de « il sut »
  choice: Maintien du pronom « il »
  alternative: « Noé sut »
  rationale: Le guèze emploie une forme verbale à la troisième personne sans nommer ici le sujet. Le pronom conserve cette dépendance au contexte précédent.
translation_notes:
  register: Français moderne, digne et lisible. Les expressions bibliques « le Saint des saints » et « la demeure du Seigneur » sont conservées. Le fragment initial reste explicitement rattaché au verset précédent, tandis que l’image étrange du « nombril de la terre » est maintenue plutôt que normalisée.
