  text: But you will go to your fathers in peace, and you will be buried at a good old age.
translation:
  language: fr
  text: Mais toi, tu rejoindras tes pères en paix, et tu seras enterré après une heureuse vieillesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐውር፡ ኀበ፡ አበዊከ
  choice: tu rejoindras tes pères
  rationale: Littéralement « tu iras vers tes pères ». « Rejoindre ses pères » restitue naturellement en français l’idée de mourir et d’être réuni aux ancêtres, sans l’expliciter davantage.
- source_word: በሰላም
  choice: en paix
  rationale: Rend directement l’expression guèze et conserve sa portée paisible sans préciser si elle concerne les circonstances de la mort ou l’état du défunt.
- source_word: ወትትቀበር
  choice: et tu seras enterré
  rationale: Traduction directe de la forme passive exprimant la mise au tombeau.
- source_word: በርእስ፡ ሠናይ
  choice: après une heureuse vieillesse
  rationale: L’expression correspond à l’idée d’un âge avancé favorable ou accompli. Cette formulation est idiomatique en français et indique que l’ensevelissement survient au terme d’une longue vie.
theological_decisions:
- issue: Sens de « aller vers ses pères »
  choice: Conserver l’image traditionnelle sous la forme « rejoindre tes pères »
  alternative: « tu mourras en paix »
  rationale: La source distingue le départ vers les ancêtres de l’ensevelissement. La traduction préserve cette image et son éventuelle portée théologique sans la réduire à une simple périphrase de la mort.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au singulier. Aucun archaïsme ni terme confessionnel n’a été ajouté.
