  text: 'des Cananéens, en possession perpétuelle, et pour être ton Dieu et celui de ta descendance après toi. » Et il dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከናናዊያን
  choice: des Cananéens
  rationale: Rend directement l’ethnonyme guèze et conserve le raccord syntaxique avec le contexte précédent.
- source_word: ለእኂዝ፡ ለዓለም
  choice: comme possession perpétuelle
  rationale: Exprime l’idée d’une possession durable pour toujours dans un français naturel et digne.
- source_word: ለከዊነ፡ ለከ፡ አምላከ
  choice: pour être ton Dieu
  rationale: Conserve la construction infinitive du texte source sans introduire une nuance hypothétique.
- source_word: ለዘርእከ፡ እምድኅሬከ
  choice: celui de ta descendance après toi
  rationale: « Descendance » rend le collectif « semence » en français moderne, tandis que « celui de » explicite naturellement que Dieu est aussi le Dieu de cette descendance.
- source_word: ወይቤ
  choice: 'Et il dit :'
  rationale: Le passé simple convient au registre narratif biblique moderne et le deux-points signale que la parole se poursuit au verset suivant.
theological_decisions:
- issue: Relation exprimée par « être Dieu »
  choice: pour être ton Dieu et celui de ta descendance
  alternative: afin que je sois Dieu pour toi et pour ta descendance
  rationale: La formulation retenue préserve l’infinitif du guèze, évite d’ajouter un sujet ou une modalité absents de ce fragment et exprime clairement la relation d’alliance.
translation_notes:
  register: Français international moderne, sobre et narratif. Le fragment initial demeure syntaxiquement rattaché au verset précédent, conformément au découpage fourni. Aucun marqueur de note n’est requis.
