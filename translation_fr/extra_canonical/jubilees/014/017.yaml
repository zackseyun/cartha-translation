  text: And in the fourth generation they will return here, for the sin of the Amorites is not complete until now.”
translation:
  language: fr
  text: À la quatrième génération, ils reviendront ici, car le péché des Amorites n’est pas encore arrivé à son comble[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’est pas accompli jusqu’à présent » ; autre traduction possible : « n’est pas encore complet » .'
    reason: Signaler la formulation temporelle explicite du guèze et préserver l’éventail de sens du verbe « accomplir, achever ».
lexical_decisions:
- source_word: በትውልድ፡ ራብዕ
  choice: à la quatrième génération
  rationale: Rend directement l’expression temporelle guèze tout en suivant l’usage naturel du français.
- source_word: ይትመየጡ፡ ዝየ
  choice: ils reviendront ici
  rationale: 'Le verbe exprime le retour, et ዝየ désigne explicitement le lieu présent : « ici ».'
- source_word: ኃጢአቶሙ፡ ለአሞሬዎን
  choice: le péché des Amorites
  rationale: Conserve le singulier collectif du texte source sans préciser davantage la nature de la faute.
- source_word: ኢተፈጸመ
  choice: n’est pas encore arrivé à son comble
  rationale: Expression française idiomatique qui traduit l’idée d’un péché pas encore parvenu à son plein accomplissement.
- source_word: እስከ፡ ይእዜ
  choice: encore
  rationale: Dans ce contexte, « encore » transmet naturellement la limite temporelle « jusqu’à présent », explicitée dans la note.
theological_decisions:
- issue: Degré d’accomplissement du péché des Amorites
  choice: n’est pas encore arrivé à son comble
  alternative: n’est pas accompli jusqu’à présent
  rationale: La formulation retenue préserve l’idée que leur péché n’a pas atteint son plein degré, sans expliquer pourquoi ni résoudre la tension morale du délai annoncé.
translation_notes:
  register: Français moderne, clair et digne. La tournure « arriver à son comble » évite le calque peu naturel « être complété » tout en conservant l’image d’une faute qui n’a pas encore atteint sa pleine mesure.
