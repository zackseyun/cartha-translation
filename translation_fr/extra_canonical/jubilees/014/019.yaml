  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: fr
  text: 'Ce jour-là, le Seigneur conclut une alliance avec Abram en disant : « Je donnerai ce pays à ta descendance, depuis le fleuve d’Égypte jusqu’au grand fleuve, l’Euphrate. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳነ
  choice: une alliance
  rationale: Le terme désigne une alliance solennelle; cette formulation française est naturelle et précise dans ce contexte.
- source_word: ተካየደ
  choice: conclut
  rationale: Avec « alliance », le français idiomatique emploie « conclure une alliance », ce qui rend l’acte d’établissement exprimé par la source.
- source_word: ለዘርእከ
  choice: à ta descendance
  rationale: Le nom collectif « descendance » conserve l’idée de postérité sans imposer un singulier individuel ni un genre.
- source_word: ፈለገ፡ ግብጽ
  choice: le fleuve d’Égypte
  rationale: Traduction directe de la désignation géographique de la source, sans identifier davantage le cours d’eau.
- source_word: ፈለገ፡ ዐቢይ፡ ፈለገ፡ ኤውፍራጢስ
  choice: le grand fleuve, l’Euphrate
  rationale: Préserve l’apposition et l’emphase de la source tout en restant naturelle en français.
theological_decisions:
- issue: Rendu du nom divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « Le Seigneur » est le rendu français courant et interconfessionnel du titre divin dans la source guèze; il évite de rétrovertir avec certitude un tétragramme hébreu absent du texte fourni.
- issue: Portée de « descendance »
  choice: Conserver un collectif non spécifié
  alternative: ta postérité / tes descendants
  rationale: La source emploie « semence » au sens collectif. « Descendance » maintient cette amplitude et ne tranche pas une éventuelle lecture individuelle ou plurielle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement la source tout en employant les collocations françaises naturelles. Aucun marqueur de note n’est nécessaire.
