translation:
  language: fr
  text: âgée de trois ans, une chèvre de trois ans, un bélier de trois ans, une tourterelle et un pigeon. » Il prit tous ces animaux au milieu du mois[a] et demeurait auprès de
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « au milieu du mois » figure explicitement dans le texte guèze. Elle est conservée, car le livre des Jubilés indique souvent les dates avec soin dans ses repères liturgiques et chronologiques.
    reason: cultural_note
lexical_decisions:
- source_word: ዘሠለስቱ፡ ዓመት፡
  choice: âgée de trois ans
  rationale: Ce syntagme ouvre le segment mais qualifie l’animal mentionné au verset précédent; le féminin maintient ce lien syntaxique malgré la coupure de verset.
- source_word: ጠሌ፡ ዘሠለስቱ፡ ዓመት፡
  choice: une chèvre de trois ans
  rationale: « Chèvre » rend naturellement l’animal sacrificiel féminin correspondant au contexte de Genèse 15, sans ajouter de précision absente du texte.
- source_word: በገዐ፡ ዘሠለስቱ፡ ዓመት፡
  choice: un bélier de trois ans
  rationale: Le terme désigne ici un bélier; l’âge est répété explicitement dans le guèze.
- source_word: መን ጢጠ፡ ወርግብ
  choice: une tourterelle et un pigeon
  rationale: Rendu direct des deux oiseaux, sans introduire l’âge du pigeon, qui n’est pas exprimé dans ce segment.
- source_word: በመንፈቀ፡ ወርኅ፡
  choice: au milieu du mois
  rationale: La locution temporelle est explicite et conserve la précision chronologique caractéristique du livre.
- source_word: ይነብር፡ ኀበ፡
  choice: demeurait auprès de
  rationale: Le verbe exprime une situation durable, tandis que la préposition appelle le complément placé dans le verset suivant; « auprès de » préserve cet enchaînement.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le début et la fin restent volontairement syntaxiquement ouverts, car la division des versets sépare « âgée de trois ans » de l’animal qualifié au verset précédent et « auprès de » de son complément au verset suivant.
