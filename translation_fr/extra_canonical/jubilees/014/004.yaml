lexical_decisions:
- source_word: ዘይወፅእ፡ እምከርሥከ
  choice: celui qui sortira de ton propre corps
  rationale: L’expression guèze désigne littéralement celui qui sort du ventre ou des entrailles d’Abraham; « propre corps » exprime naturellement en français la descendance biologique sans préciser davantage.
- source_word: ይወርሰከ
  choice: héritera de toi
  rationale: Conserve la construction du texte source et l’idée successorale, sans remplacer celle-ci par une formulation explicative telle que « sera ton héritier ».
- source_word: ወአውፅኦ፡ አፍአ
  choice: Puis il le fit sortir dehors
  rationale: Rend directement le mouvement causatif vers l’extérieur; la légère redondance reste naturelle et reflète celle du texte.
- source_word: ነጽር
  choice: Regarde
  rationale: Impératif direct et courant correspondant à l’ordre de porter le regard, la suite de la phrase se trouvant manifestement au verset suivant.
