  source_fidelity: Le guèze dit littéralement qu’à l’exclusion de tout autre, celui qui « sortira de ton ventre/de tes entrailles » héritera d’Abraham, puis que Dieu le conduisit dehors et lui donna l’ordre de regarder. La formulation « de ton propre corps » atténue l’image anatomique précise du texte. « Il le fit sortir dehors » ajoute une redondance française inutile à l’expression source.
  naturalness: « De tes entrailles » est une expression française biblique claire et toujours compréhensible dans un registre moderne soutenu. « Sera ton héritier » rend idiomatiquement le verbe avec suffixe personnel, dont le sens est successoral; « héritera de toi » est possible mais sensiblement moins naturel en français. « Il le fit sortir » rend naturellement le causatif sans le pléonasme « sortir dehors ».
  terminology: Le terme « entrailles » préserve l’image de descendance issue du ventre sans introduire explicitement « fils ». « Héritier » exprime le statut successoral visé sans imposer d’interprétation théologique supplémentaire.
