  text: all these, and poured out their blood upon the altar, and divided them in the middle, and placed them opposite one another, face to face; but the birds he did not divide. And birds came down upon the pieces,
translation:
  language: fr
  text: tous ces animaux, puis il répandit leur sang sur l’autel. Il les partagea par le milieu et plaça les moitiés les unes en face des autres, face à face ; mais il ne partagea pas les oiseaux. Et des oiseaux descendirent sur les morceaux.
