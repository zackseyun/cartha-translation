lexical_decisions:
- source_word: ነፈቆሙ
  choice: Il les partagea par le milieu
  rationale: Le verbe exprime l’action de diviser en deux; cette formulation française est naturelle tout en conservant précisément le geste décrit.
- source_word: አንጻራቲሆሙ፡ በበገጾሙ
  choice: plaça chaque moitié en face de l’autre
  rationale: Littéralement, les éléments sont disposés les uns vis-à-vis des autres, face contre face. «Chaque moitié» explicite seulement le référent issu de la division précédente.
- source_word: አዕዋፍ
  choice: des oiseaux
  rationale: Le terme désigne les oiseaux sans préciser ici leur espèce; l’indétermination du guèze est conservée.
- source_word: ክፍሉ
  choice: les morceaux
  rationale: Dans ce contexte sacrificiel, le mot renvoie aux parties découpées et disposées; «morceaux» est l’équivalent français idiomatique.
theological_decisions:
- issue: Lien avec le récit d’alliance d’Abraham en Genèse 15
  choice: Conserver la description concrète sans harmonisation explicite
  alternative: Employer mot pour mot le vocabulaire d’une traduction française particulière de Genèse 15
  rationale: Le passage évoque clairement Genèse 15, mais la traduction doit représenter le texte guèze de Jubilés sans lui imposer les choix d’une autre version biblique.
translation_notes:
  register: Français international moderne, narratif et digne. Le début demeure syntaxiquement lié au verset précédent, conformément au fragment source «tous ces…». Aucune note n’est nécessaire.
