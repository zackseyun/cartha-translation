lexical_decisions:
- source_word: ይከልኦሙ
  choice: les chassa
  rationale: Le verbe exprime ici l’action d’écarter ou de repousser les oiseaux loin des animaux partagés.
- source_word: ኢየኀድጎ
  choice: ne permit pas
  rationale: La tournure négative signifie qu’Abram ne les laissa pas accomplir l’action suivante.
- source_word: ይልከፍዎሙ
  choice: d’y toucher
  rationale: Le verbe désigne le fait de toucher ou d’atteindre; le pronom français « y » renvoie naturellement aux animaux ou morceaux mentionnés dans le contexte précédent.
- source_word: ሶበ፡ ዐርበት፡ ፀሐይ
  choice: au coucher du soleil
  rationale: Rend naturellement la proposition temporelle littérale « lorsque le soleil se couchait » tout en conservant le caractère inachevé de la phrase.
