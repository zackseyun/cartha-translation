translation:
  language: fr
  text: 'les étoiles. Et il lui dit : « Ainsi sera ta descendance. » Abram crut au Seigneur, et cela lui fut compté comme justice.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Le terme désigne la postérité ou descendance; ce choix naturel en français conserve ici le sens collectif.
- source_word: ወአምኖ
  choice: Abram crut
  rationale: Le verbe signifie « croire » ou « avoir foi ». Le sujet implicite est Abram, explicité en français pour éviter l’ambiguïté entre les deux protagonistes.
- source_word: ለእግዚአብሔር
  choice: au Seigneur
  rationale: Le complément du verbe croire désigne le Seigneur; la formulation française « croire au Seigneur » reste proche de la construction source.
- source_word: ወተኈለቍ
  choice: et cela lui fut compté
  rationale: Le passif exprime l’idée d’imputer, compter ou tenir pour; « cela » reprend naturellement la foi d’Abram sans préciser explicitement l’agent.
- source_word: ጽድቀ
  choice: comme justice
  rationale: Le substantif signifie « justice »; la tournure conserve la densité théologique et le lien traditionnel avec Genèse 15.6.
theological_decisions:
- issue: Référent implicite dans « il crut »
  choice: Expliciter Abram comme sujet
  alternative: « Et il crut au Seigneur »
  rationale: La succession de pronoms masculins peut être confuse en français. Nommer Abram clarifie la syntaxe sans résoudre une tension théologique.
- issue: Agent de l'imputation
  choice: Conserver le passif sans nommer Dieu comme agent
  alternative: « le Seigneur le lui compta comme justice »
  rationale: Le texte source emploie une forme passive; préserver ce passif évite d'ajouter un agent grammatical absent.
- issue: Ce qui est compté comme justice
  choice: Employer le neutre « cela »
  alternative: « sa foi lui fut comptée comme justice »
  rationale: Le texte ne répète pas explicitement « foi ». « Cela » maintient l'anaphore sans développer une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. Le fragment initial « les étoiles » est conservé, car le verset fourni commence au terme d'une phrase amorcée au verset précédent. Ponctuation et explicitation minimale du sujet adaptées à la lisibilité contemporaine.
