  text: And he said to him, “I am the LORD who brought you out from Ur of the Chaldeans, so that I might give you this land to inherit it.”
translation:
  language: fr
  text: 'Et il lui dit : « Je suis le Seigneur qui t’ai fait sortir d’Our des Chaldéens, afin de te donner ce pays en héritage[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « ce pays en héritage » suivent la fin complète du verset dans l’édition de Charles ; l’extrait guèze fourni s’interrompt après « pays » en raison du découpage.
    reason: Signaler avec transparence que la traduction de la fin du verset s’appuie sur le texte complet de l’édition indiquée, plutôt que sur l’extrait tronqué.
lexical_decisions:
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: le Seigneur
  rationale: Rend le titre divin guèze dans un français biblique courant et digne, sans introduire dans le texte un nom divin absent de cette forme source.
- source_word: አውፃእኩከ (ʾawṣāʾkuka)
  choice: je t’ai fait sortir
  rationale: 'Reproduit le causatif et la première personne du verbe : le Seigneur est celui qui a fait sortir Abram.'
- source_word: ምድረ ዛቲ (mədrä zāti)
  choice: ce pays
  rationale: « Pays » convient naturellement à une terre territoriale promise, tandis que le démonstratif est conservé par « ce ».
- source_word: ትረሳ (təräsa)
  choice: en héritage
  rationale: Exprime la finalité d’hériter ou de recevoir en possession sans surcharger la formulation française.
theological_decisions:
- issue: Identification du locuteur divin
  choice: Je suis le Seigneur
  alternative: Je suis l’Éternel
  rationale: Le guèze porte le titre divin እግዚአብሔር ; « le Seigneur » en est une traduction directe et non confessionnelle.
- issue: Nature du don de la terre
  choice: te donner ce pays en héritage
  alternative: te donner ce pays pour que tu en prennes possession
  rationale: La formulation retenue conserve le motif biblique de l’héritage tout en laissant intacte la relation entre don divin et possession humaine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du texte source, avec une formulation idiomatique adaptée à la lecture publique.
