  text: and your reward will be exceedingly great.” And he said[a], “Lord, Lord, what will you give me? For I go childless, and the son of Maseq, the son of my maidservant, is Damascus."”
translation:
  language: fr
  text: '« Et ta récompense sera extrêmement grande. » Il dit : « Seigneur, Seigneur, que me donneras-tu ? Moi, je m’en vais sans enfant, et le fils de Maseq, le fils de ma servante, c’est Damas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation guèze est très condensée : elle dit littéralement « c’est Damas » et ne mentionne pas ici le nom Éliézer. Un rapprochement avec Éliézer de Damas en Genèse 15,2 est possible, mais le texte guèze ne donne pas ce nom.'
    reason: Signaler la difficulté textuelle et le rapprochement possible avec Genèse 15,2 sans harmoniser silencieusement le texte ni présenter l’identification comme certaine.
lexical_decisions:
- source_word: ይፈደፍድ፡ ጥቀ
  choice: sera extrêmement grande
  rationale: Cette expression intensive décrit une récompense qui sera très grande; la tournure française conserve l’intensité sans lourdeur.
- source_word: አሐውር፡ ዘእንበለ፡ ውሉድ
  choice: je m’en vais sans enfant
  rationale: Rend directement l’idée de marcher ou de poursuivre sa vie sans descendance, tout en restant naturel en français.
- source_word: ወልደ፡ ማሴቅ
  choice: le fils de Maseq
  rationale: Conserve le nom Maseq tel qu’il figure dans le texte guèze, sans l’harmoniser avec une autre forme textuelle.
- source_word: ወልደ፡ አመትየ
  choice: le fils de ma servante
  rationale: Traduit littéralement la relation exprimée par le guèze et préserve la répétition de « fils ».
- source_word: ውእቱ፡ ደማስቆስ
  choice: c’est Damas
  rationale: Reproduit la lecture effective du guèze, qui donne une copule suivie de « Damas » et ne contient pas ici le nom Éliézer.
theological_decisions:
- issue: Identification de l’héritier domestique
  choice: Ne pas ajouter le nom « Éliézer » dans le texte principal.
  alternative: Traduire ou compléter par « Éliézer de Damas » d’après Genèse 15.2.
  rationale: Le témoin guèze fourni omet le nom Éliézer. L’ajouter harmoniserait le passage et masquerait une particularité textuelle réelle; une note suffit à éclairer l’allusion probable.
