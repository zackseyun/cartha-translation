  text: And he awoke from his sleep and arose, and the sun had set, and there was a flame. And behold, a smoking furnace and a torch of fire passed between the pieces.
translation:
  language: fr
  text: Il se réveilla de son sommeil et se leva. Le soleil s’était couché, et il y eut une flamme. Et voici qu’un four fumant et une torche de feu passèrent entre les morceaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነድ፡ ኮነ፡
  choice: et il y eut une flamme
  rationale: Le nom ነድ désigne ici une flamme; cette traduction suit le texte guèze sans l’harmoniser avec la mention de l’obscurité en Genèse 15:17.
- source_word: እቶን፡ ይጤይስ፡
  choice: un four fumant
  rationale: Rend directement l’image d’un four ou fourneau qui fume, dans une formulation française concise.
- source_word: ወበልባስ፡ እሳት፡
  choice: et une torche de feu
  rationale: Conserve les deux éléments de l’expression source, la torche et le feu, ainsi que son imagerie distincte de la flamme précédente.
- source_word: ማእከለ፡ ክፍል፡
  choice: entre les morceaux
  rationale: Le contexte sacrificiel permet de comprendre ክፍል comme les morceaux ou parts séparés, tandis que ማእከለ exprime le passage au milieu d’eux.
theological_decisions:
- issue: Rapport avec Genèse 15:17
  choice: Conserver « il y eut une flamme »
  alternative: « il fit sombre » ou « l’obscurité tomba »
  rationale: Le texte guèze fourni porte explicitement le terme signifiant « flamme »; une formulation évoquant l’obscurité importerait la leçon de Genèse au lieu de traduire Jubilés.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les actions principales, tandis que le plus-que-parfait marque que le coucher du soleil était déjà accompli. La répétition des images de feu est conservée, car elle appartient au texte source.
