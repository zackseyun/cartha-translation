  source_fidelity: Le texte guèze enchaîne « il crut qu’il aurait une descendance, et elle n’enfantait pas » sans marquer explicitement une concession. « Bien qu’elle n’enfantât pas » interprète ce lien comme concessif; la simple coordination conserve mieux la formulation source. La fin « Et elle la prit, » reproduit correctement le sujet implicite et le suffixe objet féminin, dont le référent est Agar dans la suite.
  naturalness: La révision emploie un français narratif moderne et soutenu. « Elle n’enfantait pas » est plus naturel dans ce contexte que l’imparfait du subjonctif après « bien que », tout en gardant l’aspect non ponctuel du texte. « Conseilla Abram » et « Va vers Agar » sont recevables dans ce registre biblique.
  terminology: « Descendance » rend bien le collectif guèze pour « semence/postérité », et « bâtir une descendance » maintient délibérément l’image du verbe source. « Saraï » est la forme française usuelle du nom avant le changement de nom dans le récit; elle correspond aussi au Sarai de la piste anglaise. Abram et Agar sont conservés.
