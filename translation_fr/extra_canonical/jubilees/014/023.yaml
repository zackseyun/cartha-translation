  text: And Abram rejoiced, and he told this whole matter to Sarai his wife, and he believed that he would have offspring, though she was not bearing. And Sarai advised Abram her husband and said to him, “Go in to Hagar, my Egyptian maidservant; perhaps I may build up offspring for you from her.” And Abram listened to the voice of Sarai his wife and said to her, “Do so.” And she took her,
translation:
  language: fr
  text: 'Abram se réjouit et raconta toute cette affaire à Saraï, sa femme. Il crut qu’il aurait une descendance, et elle n’enfantait pas. Saraï conseilla alors Abram, son mari, et lui dit : « Va vers Agar, ma servante égyptienne. Peut-être pourrai-je, par elle, te bâtir une descendance. » Abram écouta Saraï, sa femme, et lui répondit : « Fais ainsi. » Et elle la prit[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset suivant. Le pronom féminin « la » annonce Agar.
    reason: Le verset s’achève sur une proposition incomplète; le suffixe objet féminin du guèze renvoie proleptiquement à Agar.
lexical_decisions:
- source_word: ዘርእ፡ / ዘርአ፡
  choice: descendance
  rationale: Rend naturellement le sens collectif de « semence, postérité » dans ce contexte de promesse et de procréation.
- source_word: ባእ፡ ኀበ፡ አጋር፡
  choice: Va vers Agar
  rationale: Conserve avec dignité l’euphémisme biblique désignant l’union sexuelle, sans l’expliciter davantage que le texte source.
- source_word: አሐንጽ፡
  choice: te bâtir une descendance
  rationale: Préserve la métaphore de la construction présente dans le verbe guèze, tout en indiquant que la descendance envisagée serait celle d’Abram.
- source_word: ሰአኪትየ፡
  choice: ma servante
  rationale: Terme français courant et approprié au statut domestique d’Agar dans le récit.
theological_decisions:
- issue: Rapport entre la foi d’Abram et la stérilité de Sara
  choice: Il crut qu’il aurait une descendance, bien qu’elle n’enfantât pas.
  alternative: Il crut qu’il aurait une descendance, et elle n’enfantait pas.
  rationale: « Bien que » exprime la tension contextuelle sans résoudre la manière dont la promesse devait s’accomplir; la formulation reste fidèle au contraste du passage.
- issue: Métaphore de Sara qui « bâtit » une descendance
  choice: Peut-être pourrai-je, par elle, te bâtir une descendance.
  alternative: Peut-être aurai-je par elle des enfants pour toi.
  rationale: Le choix principal maintient l’image source et évite d’effacer une tension significative avec la formulation traditionnelle de Genèse 16.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent les formes françaises usuelles « Abram », « Sara » et « Agar ». L’imparfait du subjonctif « enfantât » est soutenu mais reste transparent et convient au registre scripturaire; la dernière virgule est conservée pour signaler que la phrase continue au verset suivant.
