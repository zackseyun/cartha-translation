  text: And that day passed, and Abram offered up the pieces and the birds and their grain offerings and their drink offerings, and fire consumed them.
translation:
  language: fr
  text: Ce jour-là passa. Abram présenta les morceaux, les oiseaux, leurs offrandes de céréales et leurs libations, et le feu les consuma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ
  choice: présenta
  rationale: Le verbe signifie littéralement « faire monter » et, dans ce contexte sacrificiel, désigne l’action d’offrir ou de présenter sur l’autel. « Présenta » reste naturel sans ajouter explicitement un autel absent du texte.
- source_word: ክፍላተ
  choice: les morceaux
  rationale: Rend le pluriel « parties/morceaux » et maintient le lien avec les animaux partagés lors de l’alliance.
- source_word: አዕዋፈ
  choice: les oiseaux
  rationale: Équivalent direct et non spécialisé du terme guèze.
- source_word: መሥዋዕቶሙ
  choice: leurs offrandes de céréales
  rationale: Dans l’association cultuelle avec ሞጻሕቶሙ, le terme correspond vraisemblablement aux offrandes végétales accompagnant les libations; cette formulation préserve la précision rituelle et évite la redondance de « leurs sacrifices » après les morceaux et les oiseaux.
- source_word: ሞጻሕቶሙ
  choice: leurs libations
  rationale: Terme cultuel français courant pour des offrandes liquides versées.
- source_word: በልዐቶሙ፡ እሳት
  choice: le feu les consuma
  rationale: Rend naturellement l’image littérale selon laquelle le feu les mangea, dans un registre biblique digne.
theological_decisions:
- issue: Nature de መሥዋዕቶሙ
  choice: offrandes de céréales
  alternative: sacrifices
  rationale: La coordination avec les libations favorise une lecture cultuelle précise, probablement celle d’une offrande végétale, plutôt qu’un terme générique qui ferait double emploi avec les victimes déjà mentionnées.
- issue: Référent du pronom dans « le feu les consuma »
  choice: Maintien du pluriel non explicité
  alternative: Préciser que le feu consuma toutes les offrandes
  rationale: Le texte source laisse le référent au contexte; la traduction conserve cette portée sans la résoudre davantage.
translation_notes:
  register: Français international moderne, sobre et biblique. La syntaxe reste proche de la succession narrative du guèze, tout en évitant une tournure artificielle. Aucun marqueur de note n’est requis.
