  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
translation:
  language: fr
  text: Sara prit Agar, sa servante égyptienne, et la donna pour femme à Abram, son mari.[a] Il s’unit à elle ; elle devint enceinte et mit au monde un fils, auquel il donna le nom d’Ismaël. C’était la cinquième année de cette semaine-là, et cette année était la quatre-vingt-sixième année de la vie d’Abram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « et la donna à Abram, son mari, afin qu’elle soit sa femme ».'
    reason: La construction de la source peut être rendue soit par « pour femme », soit par une proposition finale plus explicite.
lexical_decisions:
- source_word: ሶራ
  choice: Sara
  rationale: Forme française traditionnelle du nom, conforme au personnage visé avant son changement de nom.
- source_word: ለአጋር፡ ለአአታ፡ ግብጻዊት
  choice: Agar, sa servante égyptienne
  rationale: Rend le nom, la relation de service et l’origine égyptienne dans un français naturel.
- source_word: ወወሀበታ፡ ለአብራም፡ ለምታ፡ ትኩኖ፡ ብእሲተ
  choice: et la donna pour femme à Abram, son mari
  rationale: Conserve explicitement à la fois le statut d’Abram comme mari de Sara et le fait qu’Agar lui est donnée comme femme.
- source_word: ወቦአ፡ ኀቤሃ
  choice: Il s’unit à elle
  rationale: Équivalent français actuel et digne de l’idiome littéral « entrer vers elle », qui désigne ici une relation sexuelle.
- source_word: ወጸውዐ፡ ስሞ፡ ይስማዔል
  choice: auquel il donna le nom d’Ismaël
  rationale: Rend naturellement l’acte de nommer sans modifier le sujet masculin exprimé par le texte.
- source_word: በዓመተ፡ ኃምስ፡ ዘዘሰብዐ
  choice: la cinquième année de cette semaine-là
  rationale: Préserve le système chronologique propre aux Jubilés, où une « semaine » désigne un cycle de sept ans.
- source_word: ዓመት፡ ሰማንያ፡ ወስድስቱ፡ ዓም፡ በሕይወተ፡ አብራም
  choice: la quatre-vingt-sixième année de la vie d’Abram
  rationale: Reproduit précisément l’âge chronologique donné dans la source.
theological_decisions:
- issue: Statut d’Agar auprès d’Abram
  choice: « la donna pour femme à Abram, son mari »
  alternative: « la donna à Abram, son mari, afin qu’elle soit sa femme »
  rationale: 'La formulation retenue conserve la tension du récit : Abram est le mari de Sara, tandis qu’Agar lui est donnée comme femme, sans imposer une qualification confessionnelle supplémentaire.'
- issue: Sujet de l’attribution du nom Ismaël
  choice: 'Abram est maintenu comme sujet : « il donna »'
  alternative: 'Formulation passive : « on lui donna le nom »'
  rationale: Le verbe guèze est au masculin singulier et le sujet discursif immédiat est Abram ; la traduction ne l’efface pas au profit de la tradition parallèle de Genèse 16:11.
translation_notes:
  register: Français international moderne, narratif et digne. « Il s’unit à elle » évite le calque archaïque « il entra vers elle ». La ponctuation répartit la longue coordination guèze en phrases lisibles sans perdre l’enchaînement du récit. Le marqueur [a] figure dans le texte principal.
