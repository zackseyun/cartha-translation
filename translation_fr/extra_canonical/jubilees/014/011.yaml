lexical_decisions:
- source_word: ድራይ፡ ዘማምሬ
  choice: le chêne de Mamré
  rationale: Rend naturellement le nom de l’arbre associé à Mamré dans ce fragment, conformément au sens transmis par l’édition et au contexte traditionnel du lieu.
- source_word: ቅሩበ፡ ኬብሮን
  choice: près d’Hébron
  rationale: Expression française courante et précise pour indiquer la proximité géographique.
- source_word: ሐነጸ፡ ምሥዋዐ
  choice: construisit un autel
  rationale: Reproduit directement l’action de bâtir ou d’ériger un autel, dans un registre narratif digne et naturel.
- source_word: ወዘብሐ
  choice: et offrit un sacrifice
  rationale: Dans le contexte immédiat de l’autel, cette formulation exprime clairement l’acte sacrificiel sans le réduire au seul geste d’égorger.
theological_decisions:
- issue: Nature exacte de ce qui est sacrifié
  choice: offrit un sacrifice
  alternative: sacrifia / égorgea une victime
  rationale: Le texte ne nomme pas ici la victime. La formulation retenue conserve cette absence de précision tout en rendant explicitement la portée cultuelle du verbe après la construction de l’autel.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit ancien; « il y construisit » évite une répétition lourde de « là » et rattache clairement l’autel au lieu mentionné.
