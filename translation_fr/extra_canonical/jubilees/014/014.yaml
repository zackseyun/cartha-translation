  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: fr
  text: 'Un profond sommeil tomba sur Abram. Et voici, une grande terreur de ténèbres tomba sur lui. Il fut dit à Abram : « Sache avec certitude que ta descendance vivra comme étrangère dans un pays qui ne sera pas le sien ; ils la réduiront en servitude et la maltraiteront pendant quatre cents ans. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድንጋፄ
  choice: un profond sommeil
  rationale: Dans ce contexte parallèle à Genèse 15:12, le terme désigne l’assoupissement profond qui saisit Abram.
- source_word: ግርማ፡ ዐቢይ፡ ጽልመት
  choice: une grande terreur, accompagnée de ténèbres
  rationale: Cette formulation naturelle conserve les deux éléments du syntagme guèze, la grande terreur et les ténèbres, sans les confondre.
- source_word: አእምሮ፡ አእምር
  choice: Sache avec certitude
  rationale: La répétition emphatique du verbe « savoir » exprime une connaissance certaine.
- source_word: ዘርእከ
  choice: ta descendance
  rationale: « Descendance » rend naturellement le collectif « semence » en français moderne.
- source_word: ፈላሴ
  choice: séjournera en étrangère
  rationale: Le mot qualifie la descendance comme étrangère ou résidente immigrée; cette tournure préserve l’idée d’un séjour hors de son propre pays.
- source_word: ይቀንይዎሙ
  choice: la réduiront en servitude
  rationale: Le verbe indique l’asservissement; le pronom collectif renvoie à la descendance.
- source_word: ያሐምምዎሙ
  choice: la maltraiteront
  rationale: Le verbe exprime le fait de faire souffrir ou d’affliger; « maltraiter » est clair et idiomatique.
theological_decisions:
- issue: Identité du locuteur dans « il fut dit à Abram »
  choice: On dit à Abram
  alternative: Dieu dit à Abram
  rationale: Le texte emploie une tournure impersonnelle et ne nomme pas explicitement Dieu dans ce verset; la traduction conserve cette retenue.
- issue: Référent du sujet de l’asservissement
  choice: Ses habitants la réduiront en servitude
  alternative: ils les réduiront en servitude
  rationale: Le guèze laisse le sujet pronominal implicite et emploie des formes plurielles pour la descendance collective. L’explicitation minimale « ses habitants » rend le sens probable sans identifier un peuple précis.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée du texte source est légèrement lissée, tout en maintenant l’effet solennel de « Et voici ». Le collectif « descendance » est repris au singulier afin d’éviter l’alternance française peu naturelle entre « elle » et « eux ».
