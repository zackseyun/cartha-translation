  to: 'Un profond sommeil tomba sur Abram. Et voici, une grande terreur de ténèbres tomba sur lui. Il fut dit à Abram : « Sache avec certitude que ta descendance vivra comme étrangère dans un pays qui ne sera pas le sien ; ils la réduiront en servitude et la maltraiteront pendant quatre cents ans. »'
  rationale: La révision retire l’ajout non justifié « ses habitants » et conserve l’indétermination du sujet pluriel du texte source. Elle améliore également deux formulations françaises tout en préservant le caractère collectif de « descendance » et le registre solennel du passage.
