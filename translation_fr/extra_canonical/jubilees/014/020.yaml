  text: the Kenites, and the Kenizzites, and the Kadmonites, and the Perizzites, and the Rephaim, and the Rakites[a], and the Avvites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: fr
  text: les Qénites, les Qenizzites, les Qadmonites, les Perizzites, les Rephaïm, les Rakites[a], les Avvites, les Amorites, les Cananéens, les Guirgashites et les Jébusites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’ethnonyme rendu par « Rakites » reproduit la forme du texte guèze. Il pourrait correspondre à un peuple connu sous une autre forme dans des traditions parallèles ; la traduction évite de l’harmoniser.
    reason: textual_variant
lexical_decisions:
- source_word: ለራኬዎን
  choice: les Raqites
  rationale: Translittère la forme ethnique transmise par le guèze (Raqēwōn) sans l’harmoniser avec les Arqites d’autres traditions.
- source_word: ለራፋኤዎን
  choice: les Rephaïm
  rationale: Conserve le nom ethnique biblique traditionnel, avec sa forme plurielle reçue en français.
- source_word: ለገር ጌሴዎን
  choice: les Guirgashites
  rationale: Emploie la forme française biblique usuelle correspondant à l’ethnonyme transmis.
