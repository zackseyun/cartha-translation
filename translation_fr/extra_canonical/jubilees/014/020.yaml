translation_notes:
  register: Énumération sobre et solennelle. Les répétitions de la conjonction guèze sont rendues par la ponctuation française et un « et » avant le dernier élément, conformément à l’usage naturel du français moderne. Les ethnonymes bibliques courants suivent les formes françaises établies; la forme rare Raqites demeure proche du guèze.
