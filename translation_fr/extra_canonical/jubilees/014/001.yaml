  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
translation:
  language: fr
  text: 'Après ces événements, dans la quatrième année de cette semaine, à la nouvelle lune[a] du troisième mois, la parole du SEIGNEUR fut adressée à Abram dans un rêve : « N’aie pas peur, Abram. Je suis ton protecteur, et ta récompense sera très grande. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme guèze peut signifier « au lever » ou « au commencement » ; dans le système calendaire des Jubilés, il désigne souvent la nouvelle lune, c’est-à-dire le commencement du mois.
    reason: cultural_note
lexical_decisions:
- source_word: ነገር (nagar)
  choice: événements
  rationale: Le terme peut désigner une chose, une affaire ou un événement. Au pluriel idiomatique, « après ces événements » rend naturellement la formule narrative sans la confondre avec l’indication calendérique qui suit.
- source_word: በሠርቀ (ba-śarqa)
  choice: à la nouvelle lune
  rationale: Le mot évoque le lever ou le commencement; dans le cadre calendérique des Jubilés, il désigne ici le début du mois, compris comme la nouvelle lune.
- source_word: ቃለ፡ እግዚአብሔር (qāla ʾEgziʾabḥēr)
  choice: la parole du SEIGNEUR
  rationale: Cette formulation conserve l’expression théologique traditionnelle et rend le nom divin par « SEIGNEUR » en petites capitales typographiques simulées.
- source_word: ሕልም (ḥelm)
  choice: rêve
  rationale: Équivalent direct et naturel du terme guèze.
- source_word: ሞገስከ (mogaska; continuation attestée du verset complet)
  choice: ton protecteur
  rationale: Le choix suit le sens contextuel de protection, sans imposer l’image plus précise de « bouclier » lorsque le témoin guèze est rendu par un terme fonctionnel.
- source_word: ዐስብከ፡ ዐቢይ፡ ጥቀ (ʿasbeka ʿabiy ṭəq; continuation attestée du verset complet)
  choice: ta récompense sera très grande
  rationale: Rend directement l’idée d’une récompense d’une grandeur exceptionnelle et maintient l’écho à Genèse 15.1.
theological_decisions:
- issue: Nature de la protection divine
  choice: « Je suis ton protecteur »
  alternative: « Je suis ton bouclier »
  rationale: « Protecteur » exprime le sens sans durcir la métaphore ni importer automatiquement la formulation d’une autre tradition textuelle.
- issue: Lien entre protection et récompense
  choice: Deux affirmations coordonnées dans une même parole divine
  alternative: Faire de Dieu lui-même la très grande récompense d’Abram
  rationale: La syntaxe retenue préserve la distinction explicite entre « ton protecteur » et « ta récompense », sans trancher davantage leur relation théologique.
translation_notes:
  register: Français international moderne, narratif et digne. « N’aie pas peur » est plus courant que « Ne crains pas » tout en gardant la solennité de l’oracle. La transcription guèze fournie s’interrompt après « Je suis lui »; la fin de la phrase est rétablie d’après la continuation du verset complet signalée dans les données de révision et contrôlée par la couche de consultation anglaise.
