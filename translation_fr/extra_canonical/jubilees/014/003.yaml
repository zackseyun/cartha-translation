  text: Eliezer—he will inherit me, and to me you have not given seed.” And he said to him, “This one will not inherit you,”
translation:
  language: fr
  text: '« Éliézer, c’est lui qui héritera de moi, et tu ne m’as pas donné de descendance. » Il lui dit : « Celui-ci n’héritera pas de toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይወርሰኒ
  choice: héritera de moi
  rationale: Rend directement le verbe « hériter » avec le suffixe de première personne, dans un français naturel.
- source_word: ዘርአ
  choice: descendance
  rationale: Le terme signifie littéralement « semence », mais désigne ici une postérité humaine ; « descendance » exprime clairement ce sens en français moderne.
- source_word: ኢይወርስከዝ
  choice: Celui-ci n’héritera pas de toi
  rationale: Conserve la désignation démonstrative et la négation catégorique du texte source.
theological_decisions:
- issue: Nature de l’héritage
  choice: héritera de moi / n’héritera pas de toi
  alternative: sera mon héritier / ne sera pas ton héritier
  rationale: La formulation verbale préserve au plus près la répétition du verbe dans le guèze sans préciser indûment la nature de l’héritage.
translation_notes:
  register: Français moderne, digne et accessible. La tournure emphatique « Éliézer, c’est lui » restitue le nom suivi du pronom renforcé dans le texte source. Aucun marqueur de note n’est nécessaire.
