  text: And I will also judge the nation to whom they will be enslaved, and after this they will come out from there with much property.
translation:
  language: fr
  text: Je jugerai aussi la nation qu’ils serviront, puis ils en sortiront avec de nombreux biens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ፡
  choice: aussi la nation
  rationale: L’enclitique -ኒ exprime ici l’idée d’addition (« aussi »), tandis que ሕዝብ désigne la nation ou le peuple concerné.
- source_word: ይትቀነዩ፡
  choice: qu’ils serviront
  rationale: L’imparfait éthiopien se comprend comme futur dans cette prophétie. Le verbe peut exprimer le service ou l’assujettissement; « serviront » préserve cette latitude sans imposer une formulation passive.
- source_word: እፈትሖሙ፡
  choice: je jugerai
  rationale: Dans ce contexte judiciaire, le verbe désigne l’action de rendre justice ou de prononcer un jugement contre la nation oppressive.
- source_word: ጥሪት፡ ብዙኅ።
  choice: de nombreux biens
  rationale: ጥሪት désigne les possessions, les richesses ou les biens; « de nombreux biens » est naturel et suffisamment large en français.
theological_decisions:
- issue: Nature du rapport à la nation étrangère
  choice: qu’ils serviront
  alternative: à laquelle ils seront asservis
  rationale: Le texte évoque un service sous domination, mais la formulation choisie conserve l’ambiguïté lexicale entre servir et être asservi, sans atténuer le contexte d’oppression.
translation_notes:
  register: Français moderne, clair et digne. Le futur est maintenu dans toute la prophétie; « puis » rend naturellement la succession exprimée par « après cela ».
