  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
translation:
  language: fr
  text: Et ce jour-là, nous avons conclu l’alliance avec Abram[a], comme nous l’avions conclue avec Noé en ce mois. Abram la renouvela sous la forme d’une fête et d’une prescription pour lui, à perpétuité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La première personne du pluriel (« nous avons conclu l’alliance ») appartient au cadre de médiation céleste du livre des Jubilés. Il s’agit vraisemblablement de la voix du narrateur angélique dans la révélation faite à Moïse.
    reason: cross_reference
lexical_decisions:
- source_word: ተካየድነ፡ ኪዳነ
  choice: nous avons conclu l’alliance
  rationale: La tournure guèze exprime l’établissement formel d’une alliance; « conclure une alliance » est naturel et digne en français moderne.
- source_word: ሐደሶ
  choice: la renouvela
  rationale: Le verbe signifie « renouveler »; le pronom renvoie à l’alliance mentionnée immédiatement auparavant.
- source_word: በበዓል፡ ወለሥርዓት
  choice: sous la forme d’une fête et d’une prescription
  rationale: Cette formulation conserve les deux catégories du texte, la célébration festive et la règle établie, sans les fondre.
- source_word: እስከ፡ ለዓለም
  choice: à perpétuité
  rationale: Expression française idiomatique qui rend la durée indéfinie ou permanente de la formule guèze.
theological_decisions:
- issue: Sujet à la première personne du pluriel dans « nous avons conclu »
  choice: Conserver « nous » et l’expliquer en note
  alternative: Remplacer par « Dieu conclut » ou « l’alliance fut conclue »
  rationale: Le texte source emploie explicitement la première personne du pluriel. La conserver respecte le cadre narratif céleste des Jubilés et évite d’identifier plus précisément les acteurs que ne le fait ce verset.
- issue: Rapport entre la fête, la prescription et le renouvellement de l’alliance
  choice: Conserver les deux compléments coordonnés sans préciser davantage leur portée
  alternative: Interpréter que la fête elle-même devient une ordonnance éternelle
  rationale: La syntaxe permet une certaine tension quant au rapport exact entre l’alliance renouvelée, la fête et la prescription; la traduction ne doit pas la résoudre artificiellement.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. « Abram » est conservé conformément au stade du récit. La ponctuation en deux phrases allège une longue coordination tout en maintenant la progression du texte source.
