base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
translation:
  language: fr
  text: Car je sais, et désormais je te le ferai connaître — non de mon propre cœur, car le livre est écrit devant moi, et les divisions des jours[a] sont fixées sur les tablettes célestes — afin qu’ils n’oublient pas les fêtes de l’alliance et ne suivent pas les fêtes des nations, à la suite de leur égarement et de leur ignorance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les divisions des temps ».
    reason: Le terme signifie littéralement « jours », mais peut désigner les temps ou périodes dans ce contexte calendérique.
lexical_decisions:
- source_word: አየድዐከ
  choice: je te le ferai connaître
  rationale: Rend naturellement la forme causative adressée à la deuxième personne du singulier.
- source_word: ተሠርዐ
  choice: est fixée
  rationale: Exprime l’idée d’une disposition établie ou ordonnée, sans suggérer ici un commandement verbal.
- source_word: ክፋሌሁ፡ ለመዋዕል
  choice: la répartition des jours
  rationale: Préserve le sens littéral de « jours » et l’accent calendérique précis du contexte.
- source_word: የሐውሩ፡ በበዓላት፡ አሕዛብ
  choice: ne suivent pas les fêtes des nations
  rationale: « Suivre » rend idiomatiquement l’image de marcher selon ces fêtes, tout en conservant l’opposition cultuelle.
- source_word: ድኅረ፡ ስሕተቶሙ፡ ወድኅረ፡ ኢያእምርቶሙ
  choice: entraînés par leur égarement et leur ignorance
  rationale: Rend en français naturel la relation exprimée par la répétition de « derrière/après », comprise comme le fait d’aller à la suite de l’erreur et de l’ignorance.
theological_decisions:
- issue: Statut céleste du calendrier
  choice: « est fixée sur les tablettes célestes »
  alternative: « a été ordonnée sur les tablettes célestes »
  rationale: Conserve l’affirmation d’un ordre céleste objectif sans introduire un vocabulaire confessionnel plus marqué.
- issue: Identité de « leur » dans la finale
  choice: Maintien du pronom « leur » sans explicitation
  alternative: « l’égarement et l’ignorance des nations »
  rationale: Le référent peut être compris d’après le contexte, mais le texte ne doit pas être explicité au point de supprimer son ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, digne et lisible. La longue articulation de la phrase source est conservée, avec des tirets pour clarifier l’incise. Le vocabulaire calendérique reste concret et précis.
