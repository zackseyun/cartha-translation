  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: fr
  text: Noé et ses fils jurèrent de ne manger aucun sang qui se trouve dans quelque chair que ce soit, et il conclut une alliance devant le Seigneur Dieu, pour toujours, à travers toutes les générations de la terre, en ce mois-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐኩ
  choice: jurèrent
  rationale: Le verbe exprime la prestation d’un serment; le pluriel français s’accorde avec Noé et ses fils.
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ፡ ዘበኵሉ፡ ሥጋ
  choice: ne manger aucun sang qui se trouve dans quelque chair que ce soit
  rationale: Cette formulation restitue l’interdiction absolue et la relation du sang à toute chair, dans un français naturel.
- source_word: ተካየደ፡ ኪዳነ
  choice: il conclut une alliance
  rationale: « Conclure une alliance » est l’expression française idiomatique correspondant à l’établissement solennel d’une alliance.
- source_word: ለዓለም፡ በኵሉ፡ ትውልደ፡ ምድር
  choice: pour toujours, de génération en génération sur la terre
  rationale: La traduction conserve à la fois la perpétuité de l’alliance et son extension à toutes les générations terrestres.
- source_word: በዝንቱ፡ ወርኅ
  choice: en ce mois-là
  rationale: Le démonstratif renvoie au mois évoqué dans le contexte narratif; « ce mois-là » rend ce renvoi plus naturellement en français.
theological_decisions:
- issue: Sujet singulier de l’établissement de l’alliance après un sujet pluriel
  choice: il conclut une alliance
  alternative: ils conclurent une alliance
  rationale: Le texte source passe au verbe singulier après « Noé et ses fils »; la traduction préserve cette variation en faisant de Noé le sujet implicite, sans harmoniser silencieusement au pluriel.
- issue: Titre divin እግዚአብሔር፡ አምላክ
  choice: le Seigneur Dieu
  alternative: l’Éternel Dieu
  rationale: Le texte guèze emploie un titre divin et non une transcription explicite du tétragramme; « le Seigneur Dieu » évite d’importer le nom divin.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde la solennité du serment et de l’alliance sans archaïsmes; la variation du pluriel au singulier dans les sujets verbaux est conservée.
