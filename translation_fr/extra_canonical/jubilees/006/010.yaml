    rationale: Le guèze በኵሉ፡ ትውልደ፡ ምድር signifie littéralement « à travers toutes les générations de la terre ». La formulation actuelle « de génération en génération sur la terre » peut donner à « sur la terre » une portée adverbiale et n’explicite pas que les générations sont celles de la terre.
  revised_text: Noé et ses fils jurèrent de ne manger aucun sang qui se trouve dans quelque chair que ce soit, et il conclut une alliance devant le Seigneur Dieu, pour toujours, à travers toutes les générations de la terre, en ce mois-là.
