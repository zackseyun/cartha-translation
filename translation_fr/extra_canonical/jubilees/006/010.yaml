  source_fidelity: 'Le serment de Noé et de ses fils, l’interdiction de manger du sang, le titre « le Seigneur Dieu », la permanence et la référence au mois sont bien rendus. Toutefois, « de génération en génération sur la terre » ne rend pas assez précisément « à travers toutes les générations de la terre » : « sur la terre » paraît se rattacher au verbe ou à la durée plutôt qu’aux générations.'
  naturalness: Le français est globalement clair et de registre approprié. « À travers toutes les générations de la terre » est à la fois plus naturel et plus exact que « de génération en génération sur la terre ».
  terminology: « Alliance » convient pour ኪዳን, et « le Seigneur Dieu » rend adéquatement le titre divin sans introduire le tétragramme. « Jurèrent » conserve correctement la valeur solennelle du verbe.
