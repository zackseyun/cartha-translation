  text: And you, command the children of Israel not to eat any blood, so that their name and their seed may be before Yahweh our God always.
translation:
  language: fr
  text: Et toi, ordonne aux fils d’Israël de ne manger aucun sang, afin que leur nom et leur descendance soient toujours devant Yahweh notre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: les fils d’Israël
  rationale: Rend littéralement l’expression guèze tout en conservant la désignation collective biblique traditionnelle.
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ
  choice: de ne manger aucun sang
  rationale: Conserve le verbe concret « manger » et la portée exhaustive de ኵሎ, ici naturellement exprimée par « aucun ».
- source_word: ስሞሙ፡ ወዘርኦሙ
  choice: leur nom et leur descendance
  rationale: « Nom » est maintenu tel quel; « descendance » rend naturellement ዘርእ, la postérité ou semence familiale.
- source_word: እግዚአብሔር፡ አምላክነ
  choice: Yahweh notre Dieu
  rationale: Rend le nom divin selon la politique éditoriale de la POB et traduit explicitement « notre Dieu ».
- source_word: ኵሎ፡ መዋዕለ
  choice: toujours
  rationale: Expression idiomatique française correspondant à « tous les jours / à jamais » dans ce contexte.
theological_decisions:
- issue: Lien entre l’interdiction du sang et la permanence devant Dieu
  choice: afin que leur nom et leur descendance demeurent toujours devant Yahweh
  alternative: pour que leur nom et leur descendance soient toujours devant Yahweh
  rationale: « Demeurent » explicite avec naturel la continuité impliquée par la tournure existentielle, sans préciser davantage la nature de cette présence ni résoudre sa tension théologique.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l’adresse emphatique « Et toi » et la relation finale du texte source. Aucun marqueur de note n’est requis.
