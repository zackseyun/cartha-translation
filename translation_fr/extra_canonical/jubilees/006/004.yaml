  text: All the days of the earth, seedtime and harvest shall not cease; cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.
translation:
  language: fr
  text: Tant que la terre durera, les semailles et la moisson ne cesseront pas ; le froid et la chaleur, l’été et l’hiver, le jour et la nuit ne changeront pas leur ordre et ne cesseront jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: Tous les jours que durera la terre
  rationale: Rend naturellement en français la valeur temporelle de l’expression, littéralement « tous les jours de la terre », sans la rattacher artificiellement à « semailles ».
- source_word: ዘርእ፡ ወማእረር
  choice: les semailles et la moisson
  rationale: Correspond aux deux saisons ou activités agricoles désignées par le texte.
- source_word: አይትኀደግ / ኢይትኀደጉ
  choice: ne cesseront pas / ne cesseront jamais
  rationale: Le verbe exprime ici la non-interruption ; la dernière occurrence est renforcée par « pour toujours ».
- source_word: ቍር፡ ወሙቀት
  choice: le froid et la chaleur
  rationale: Traduction directe de la paire climatique.
- source_word: ሐጋይ፡ ወክረምት
  choice: l’été et l’hiver
  rationale: Rend la paire saisonnière traditionnelle, conformément au contexte et à l’usage de la source consultée.
- source_word: ኢይወልጡ፡ ሥርዓቶሙ
  choice: ne changeront pas leur ordre
  rationale: Préserve explicitement l’idée d’un ordre établi que ces cycles ne modifieront pas.
theological_decisions:
- issue: Durée de la promesse concernant les cycles terrestres
  choice: « Tous les jours que durera la terre » et « ne cesseront jamais »
  alternative: « Tous les jours de la terre » et « ne cesseront pas pour l’éternité »
  rationale: La formulation française distingue la durée du monde terrestre et le renforcement final, tout en conservant la tension du texte entre horizon terrestre et expression de permanence.
translation_notes:
  register: Français moderne, international et digne. La ponctuation sépare la première affirmation agricole de l’énumération des cycles naturels, tout en conservant une seule phrase fluide.
