  yaml_path: translation/extra_canonical/jubilees/006/018.yaml
  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: fr
  text: 'Et toute cette fête fut célébrée dans le ciel depuis le jour de la création jusqu’aux jours de Noé : vingt-six jubilés et cinq semaines d’années. Noé et ses fils l’observèrent pendant sept jubilés et une semaine d’années, jusqu’au jour de la mort de Noé. Depuis le jour de la mort de Noé jusqu’aux jours d’Abraham, ses fils la corrompirent et mangèrent du sang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓል
  choice: fête
  rationale: Rend naturellement le nom désignant une célébration ou fête religieuse.
- source_word: ኢዮቤልዉ
  choice: jubilé
  rationale: Conserve l’unité chronologique propre au livre, soit une période de quarante-neuf ans.
- source_word: ሱባዔ፡ ዓመት / ሱባዔ፡ ዓመታት
  choice: semaine d’années
  rationale: Expression française intelligible qui préserve le sens technique d’un groupe de sept années.
- source_word: ዐቀብዋ
  choice: l’observèrent
  rationale: Dans le contexte d’une fête, « observer » exprime le respect et la célébration prescrite.
- source_word: ውሉዱ
  choice: ses descendants
  rationale: Le terme peut désigner les enfants ou la postérité; la période allant jusqu’à Abraham favorise ici le sens collectif de descendants.
- source_word: ይበልዑ፡ ደመ
  choice: mangèrent du sang
  rationale: Traduction directe de l’expression, sans l’atténuer ni l’interpréter comme une simple consommation de viande non saignée.
theological_decisions:
- issue: Célébration céleste de la fête avant Noé
  choice: « fut célébrée dans le ciel »
  alternative: « était observée au ciel »
  rationale: La formulation conserve l’affirmation explicite du texte sans préciser qui, dans le ciel, célébrait la fête.
- issue: Identité de ceux qui corrompirent la fête après la mort de Noé
  choice: « ses descendants »
  alternative: « ses fils »
  rationale: Le passage couvre les générations jusqu’à Abraham; « descendants » rend cette extension possible sans imposer que seuls les fils immédiats de Noé soient visés.
- issue: Objet de la corruption
  choice: « la corrompirent »
  alternative: « ils se corrompirent »
  rationale: La morphologie et le contexte transmis soutiennent un objet féminin renvoyant à la fête ou à son observance; la traduction garde ce lien.
translation_notes:
  register: Français international moderne, sobre et digne. Les termes chronologiques propres aux Jubilés sont conservés, avec une syntaxe claire. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
