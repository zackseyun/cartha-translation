  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: fr
  text: C’est pourquoi il est prescrit et écrit sur les tablettes célestes qu’ils célèbrent la fête des Semaines en ce mois, une fois par an, afin de renouveler l’alliance chaque année.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: il est prescrit
  rationale: Le verbe exprime ici l’idée d’une disposition établie ou ordonnée; « prescrit » convient naturellement à une ordonnance cultuelle.
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Rend littéralement l’expression guèze et conserve le motif propre au livre des Jubilés.
- source_word: በዓል፡ ዘሱባዔ
  choice: la fête des Semaines
  rationale: Désignation traditionnelle et intelligible de la fête, correspondant au sens de « semaines ».
- source_word: ለሐዲስ፡ ኪዳን
  choice: afin de renouveler l’alliance
  rationale: Rend la finalité exprimée par le texte sans préciser davantage l’identité des parties à l’alliance.
theological_decisions:
- issue: Statut de l’ordonnance sur les tablettes célestes
  choice: « il est prescrit et écrit »
  alternative: « cela fut ordonné et écrit »
  rationale: La formulation impersonnelle française conserve l’autorité céleste affirmée par le texte sans identifier explicitement un auteur non nommé.
- issue: Renouvellement annuel de l’alliance
  choice: Conserver « renouveler l’alliance chaque année »
  alternative: « commémorer l’alliance chaque année »
  rationale: Le texte parle bien de renouvellement; « commémorer » atténuerait indûment sa portée théologique.
translation_notes:
  register: Français moderne, clair et digne. La répétition « une fois par an… chaque année » est maintenue, car elle reflète l’insistance du texte source.
