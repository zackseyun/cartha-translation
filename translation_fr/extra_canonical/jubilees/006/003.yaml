  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: fr
  text: 'Le Seigneur sentit l’agréable parfum et conclut avec lui une alliance : il n’y aurait plus jamais d’eaux de déluge pour détruire la terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጼነወ
  choice: respira
  rationale: Le verbe guèze exprime ici l’action de sentir ou respirer une odeur; « respira » conserve l’image concrète et solennelle du texte.
- source_word: መዐዛ፡ ሠናየ
  choice: le parfum agréable
  rationale: Rend littéralement l’idée d’une odeur bonne ou plaisante dans un français naturel.
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ
  choice: conclut avec lui une alliance
  rationale: Formulation française idiomatique pour l’établissement d’une alliance avec Noé.
- source_word: ማየ፡ አይኅ
  choice: les eaux du déluge
  rationale: Reproduit la construction « eaux du déluge » sans réduire l’expression au seul mot « déluge ».
- source_word: ዘያማስን፡ ምድረ
  choice: ne détruiraient plus jamais la terre
  rationale: Exprime la finalité négative et définitive de l’alliance en français courant.
theological_decisions:
- issue: Anthropomorphisme divin
  choice: Le Seigneur respira le parfum agréable
  alternative: Le Seigneur agréa le parfum agréable
  rationale: Le texte décrit concrètement Dieu sentant l’odeur; la traduction conserve cette image au lieu de l’interpréter comme une simple acceptation.
- issue: Portée de la promesse
  choice: les eaux du déluge ne détruiraient plus jamais la terre
  alternative: il n’y aurait plus jamais d’eaux de déluge pour détruire la terre
  rationale: La formulation garde la promesse centrée sur la destruction de la terre par les eaux du déluge, sans l’élargir à toute forme de jugement ou d’inondation.
translation_notes:
  register: Français international moderne, digne et accessible. « Le Seigneur » traduit le titre divin; la syntaxe reste fluide tout en préservant les images et la portée du texte guèze.
