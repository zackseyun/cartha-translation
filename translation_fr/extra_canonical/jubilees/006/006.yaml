  text: And behold, I have given you all the beasts and everything that flies and everything that moves on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.
translation:
  language: fr
  text: Et voici, je vous ai donné toutes les bêtes, tout ce qui vole, tout ce qui se déplace sur la terre, les poissons dans les eaux, et tout cela comme nourriture. De même que les plantes vertes, je vous ai tout donné à manger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊተ
  choice: les bêtes
  rationale: Désigne collectivement les animaux, avec une formulation naturelle et digne en français.
- source_word: ዘይሰርር
  choice: ce qui vole
  rationale: Le verbe renvoie au fait de voler et inclut les créatures volantes; cette valeur corrige l'omission signalée dans une version antérieure.
- source_word: ዘይትሐወስ
  choice: ce qui se déplace
  rationale: Rend le mouvement des créatures sur la terre sans introduire l'idée distincte de «vivre».
- source_word: ለሲሲት
  choice: pour nourriture
  rationale: Exprime la destination alimentaire de l'ensemble énuméré.
- source_word: ሐምለ፡ ሣዕር
  choice: les plantes vertes
  rationale: Expression idiomatique correspondant à la végétation herbacée verte et faisant écho au langage de la Genèse.
- source_word: ትብልዑ
  choice: à manger
  rationale: Traduction directe et naturelle du verbe «manger» dans cette construction.
theological_decisions:
- issue: Étendue du don alimentaire après le déluge
  choice: Conserver l'affirmation globale selon laquelle les animaux énumérés sont donnés comme nourriture, en parallèle avec les plantes vertes.
  alternative: Restreindre «pour nourriture» au seul élément immédiatement voisin ou préciser des catégories alimentaires permises.
  rationale: La syntaxe présente un don général destiné à l'alimentation; ajouter des restrictions absentes du verset importerait une interprétation théologique.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition source est légèrement ordonnée pour une lecture naturelle, tout en conservant l'énumération des bêtes, des créatures volantes, de celles qui se déplacent sur terre et des poissons.
