  text: And there will be those who will assuredly make observations of the moon, for it corrupts the seasons.
translation:
  language: fr
  text: Et il y aura des gens qui observeront assurément la lune, car elle corrompt les saisons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውኑ
  choice: Et il y aura
  rationale: Le préfixe ወ- est coordinatif (« et »), tandis que la forme verbale exprime l’existence à venir.
- source_word: ያስተሐይጹ፡ ወርኀ፡ በሑያጼ
  choice: qui observeront attentivement la lune
  rationale: Cette tournure rend en français naturel l’idée d’une observation délibérée et minutieuse de la lune, sans la lourdeur de « faire des observations de la lune ».
- source_word: እስመ
  choice: car
  rationale: La conjonction introduit explicitement la cause.
- source_word: ታማስን
  choice: elle corrompt
  rationale: Le verbe est plus fort que « perturber » et peut signifier corrompre, ruiner ou détruire; « corrompt » conserve ici la vigueur polémique du texte.
- source_word: ጊዜያተ
  choice: les saisons
  rationale: Dans le contexte calendérique, le pluriel désigne les temps fixés ou saisons; « saisons » reste concis et conforme au contexte.
theological_decisions:
- issue: Force de l’accusation portée contre l’observation lunaire
  choice: « elle corrompt les saisons »
  alternative: « elle perturbe les saisons »
  rationale: Le choix retenu préserve la force du verbe guèze sans atténuer la tension calendérique du passage.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe demeure proche de la structure guèze tout en évitant une expression artificielle comme « faire des observations de la lune ».
