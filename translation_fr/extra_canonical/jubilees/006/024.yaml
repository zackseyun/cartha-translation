  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
translation:
  language: fr
  text: et une prescription servant de témoignage pour toujours.[a] Noé les institua pour lui-même comme des fêtes, pour les générations à perpétuité,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme témoignage pour toujours ».'
    reason: La relation syntaxique entre « prescription » et « témoignage » peut se rendre de manière fonctionnelle ou plus littérale.
lexical_decisions:
- source_word: ሥርዓት (śərʿāt)
  choice: prescription
  rationale: Rend le nom désignant une règle ou ordonnance établie, sans lui donner une coloration juridique excessivement moderne.
- source_word: ስምዕ (səmʿ)
  choice: témoignage
  rationale: Correspond au sens de témoignage ou attestation dans cette formule.
- source_word: በዓላት (baʿālāt)
  choice: fêtes
  rationale: Terme français naturel pour des célébrations périodiques instituées.
- source_word: ለትውልድ፡ ዘለዓለም
  choice: pour toutes les générations à venir
  rationale: Exprime naturellement la continuité perpétuelle indiquée par la formule guèze, sans le calque maladroit « pour les générations éternelles ».
theological_decisions:
- issue: Lien syntaxique de « témoignage pour toujours »
  choice: « servant de témoignage pour toujours »
  alternative: « comme témoignage pour toujours »
  rationale: La formulation retenue relie clairement la prescription à sa fonction testimoniale, tout en signalant en note la construction plus littérale possible.
- issue: Pronom « pour lui-même »
  choice: conservé
  alternative: omettre le pronom par fluidité
  rationale: Le guèze contient explicitement ሎቱ (« pour lui »); sa conservation évite d'effacer une possible nuance selon laquelle Noé institue ces fêtes dans son propre cadre d'observance.
translation_notes:
  register: Français moderne, digne et accessible. La phrase commence en minuscule et se termine par une virgule parce que le segment fourni paraît poursuivre les versets adjacents. Le marqueur [a] figure dans le texte principal.
