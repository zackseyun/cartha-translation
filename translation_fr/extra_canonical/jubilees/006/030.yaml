  text: And all the days of the commandments are fifty-two weeks of days, and all of them make a complete year. Thus it is inscribed and ordained on the heavenly tablets, and there is no neglecting a single year, from year to year.
translation:
  language: fr
  text: Tous les jours des commandements constituent au total cinquante-deux semaines de jours, et tous ensemble forment une année complète. Il est ainsi inscrit et établi sur les tablettes célestes, et aucune année ne doit être négligée, d’une année à l’autre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዛት
  choice: commandements
  rationale: Le terme guèze est au pluriel; le français conserve ce nombre sans le réduire à un commandement unique.
- source_word: ሰንበታት፡ መዋዕል
  choice: semaines de jours
  rationale: Dans ce contexte calendaire, le pluriel de «sabbat» désigne des cycles de sept jours; «semaines de jours» restitue à la fois le sens et la formulation explicite de la source.
- source_word: ተቈርፀ፡ ወተሠርዐ
  choice: inscrit et établi
  rationale: 'Conserve l’ordre des deux verbes: le premier évoque une inscription gravée ou fixée, le second une disposition établie ou ordonnée.'
- source_word: ተዐድዎ
  choice: laisser passer
  rationale: Le verbe peut exprimer l’idée de passer outre, omettre ou transgresser; «laisser passer» convient à une année dans ce contexte et préserve cette nuance sans surinterprétation juridique.
theological_decisions:
- issue: Autorité et permanence du calendrier céleste
  choice: «inscrit et établi sur les tablettes célestes»
  alternative: «décrété sur les tablettes célestes»
  rationale: La traduction maintient les deux actes distincts de la source, inscription et établissement, sans les fusionner en une formulation doctrinalement plus forte.
translation_notes:
  register: Français moderne, digne et accessible. La tournure inhabituelle «semaines de jours» est conservée parce qu’elle appartient à la formulation calendaire du texte source.
