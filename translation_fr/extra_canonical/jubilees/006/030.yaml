revisions:
- from: Tous les jours des commandements comptent cinquante-deux semaines de jours, et leur ensemble forme une année complète. C’est ainsi que cela est inscrit et établi sur les tablettes célestes, et il ne faut laisser passer aucune année, d’année en année.
  to: Tous les jours des commandements constituent au total cinquante-deux semaines de jours, et tous ensemble forment une année complète. Il est ainsi inscrit et établi sur les tablettes célestes, et aucune année ne doit être négligée, d’une année à l’autre.
  rationale: 'Révision limitée à la syntaxe et à l’idiomaticité françaises : elle clarifie le rapport entre les jours, les cinquante-deux semaines et l’année, remplace une reprise démonstrative lourde par une construction impersonnelle, et restitue avec davantage de neutralité le refus de négliger une année.'
  reviewer_model: gpt-5.6-terra
