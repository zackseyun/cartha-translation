  text: Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made man.
translation:
  language: fr
  text: Celui qui verse le sang d’un être humain, son sang sera versé par un être humain, car Dieu a fait l’être humain à sa ressemblance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Adam».
    reason: La forme ለአዳም peut être lue comme le nom propre Adam, bien qu’elle ait ici vraisemblablement une portée générique.
lexical_decisions:
- source_word: ሰብእ (sabʾ)
  choice: un être humain
  rationale: Le terme désigne ici une personne humaine; cette formulation moderne conserve la portée générique et évite que «homme» soit compris comme exclusivement masculin.
- source_word: ይትከዐው (yǝtkäʿaw)
  choice: sera versé
  rationale: Le passif rend directement la correspondance judiciaire formulée dans la proposition source.
- source_word: በምስለ (ba-mǝslä)
  choice: à sa ressemblance
  rationale: Rend le motif théologique du texte guèze sans le remplacer par le terme voisin «image».
- source_word: ለአዳም (la-ʾAdam)
  choice: l’être humain
  rationale: 'Dans cette reprise de Genèse 9.6, Adam a une valeur générique: l’humanité, plutôt que le seul personnage nommé Adam.'
theological_decisions:
- issue: Agent humain de l’effusion du sang
  choice: «par un être humain»
  alternative: «par l’être humain» ou une tournure impersonnelle
  rationale: La formulation conserve explicitement l’agent introduit par la préposition guèze et ne tranche pas davantage la question de l’autorité ou du mécanisme de la sanction.
- issue: Sens de ለአዳም
  choice: Valeur générique dans le texte principal
  alternative: Nom propre «Adam»
  rationale: Le contexte et l’allusion à Genèse 9.6 rattachent la raison donnée à la dignité de tout être humain, tout en signalant l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition «verse / versé» est maintenue afin de préserver le parallélisme solennel du texte source; «être humain» assure une portée clairement générique.
