  source_fidelity: 'La structure et les termes essentiels sont bien représentés : alliance avec les fils d’Israël, ce mois-ci, sur la montagne, serment, sang, paroles de l’alliance, Dieu et durée perpétuelle. Toutefois, après « je t’ai dit », le conditionnel (« tu conclurais », « tu répandrais ») transforme plus facilement l’instruction solennelle du texte en simple futur rapporté ou en prédiction. Le futur direct rend mieux la force injonctive conservée par la version anglaise et par la formulation source.'
  naturalness: Le français est globalement clair et de registre approprié. Une ponctuation en discours direct allège la longue période et donne à l’adresse une formulation française plus naturelle. « Asperger de sang » exprime le geste rituel sans l’ambiguïté potentiellement violente de « répandre du sang sur eux ».
  terminology: « Alliance », « fils d’Israël », « serment », « Dieu » et « paroles de l’alliance » sont des choix justes. « Asperger de sang » est préférable ici pour le rite visé, tout en évitant de spécifier un mode d’application au-delà de l’image du sang appliqué sur eux.
