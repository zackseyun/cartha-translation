base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: fr
  text: 'C’est pourquoi je t’ai dit : toi aussi, tu concluras une alliance avec les fils d’Israël, en ce mois, sur la montagne, avec un serment ; tu les aspergeras de sang à cause de toutes les paroles de l’alliance que Dieu a conclue avec eux pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትካየድ፡ ኪዳነ
  choice: tu conclurais une alliance
  rationale: L’expression associe le verbe de conclusion/établissement au nom « alliance »; « conclure une alliance » est naturel et précis en français.
- source_word: ደቂቀ፡ እስራኤል
  choice: les fils d’Israël
  rationale: Rendu formel de l’expression généalogique traditionnelle, sans la réduire au seul sens d’« Israélites ».
- source_word: ምስለ፡ ማሕላ
  choice: avec un serment
  rationale: Préserve le moyen ou l’accompagnement exprimé par « avec » et le sens juridique et solennel de « serment ».
- source_word: ደመ
  choice: du sang
  rationale: Le nom est rendu sans article défini, conformément à son caractère non spécifié dans la proposition.
- source_word: እግዚአብሔር
  choice: Dieu
  rationale: Dans ce texte guèze, le terme peut fonctionner comme désignation divine; « Dieu » suit le contexte et évite d’imposer le tétragramme absent de la forme transmise.
- source_word: ለኵሉ፡ መዋዕል
  choice: pour toujours
  rationale: Expression française naturelle pour la durée littérale « pour tous les jours », qui désigne ici une validité perpétuelle.
theological_decisions:
- issue: Identité grammaticale de celui qui conclut l’alliance
  choice: « que Dieu a conclue avec eux »
  alternative: « qui a été conclue avec eux » ou « que le Seigneur a conclue avec eux »
  rationale: Le texte transmis nomme explicitement እግዚአብሔር comme sujet; le rendre par « Dieu » conserve cette attribution sans introduire un nom divin plus spécifique.
- issue: Application du sang
  choice: « tu répandrais du sang sur eux »
  alternative: « tu les aspergerais de sang »
  rationale: Le verbe transmis peut évoquer l’effusion ou l’aspersion. « Répandre du sang sur eux » reste proche de la formulation source et ne précise pas davantage le geste rituel.
- issue: Rapport entre le sang et les paroles de l’alliance
  choice: « à cause de toutes les paroles de l’alliance »
  alternative: « en raison de toutes les clauses de l’alliance »
  rationale: « Paroles » conserve le lexème général et laisse ouverte la portée exacte—déclarations, prescriptions ou clauses—sans la résoudre juridiquement.
translation_notes:
  register: Français international moderne, solennel mais accessible. La longue coordination de la source est conservée tout en étant ponctuée pour rester lisible. Le futur dans le passé (« tu conclurais », « tu répandrais ») découle naturellement de « je t’ai dit que ».
