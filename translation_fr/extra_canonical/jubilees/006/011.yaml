    rationale: « Tu conclurais » et « tu répandrais » affaiblissent la valeur directive/solennelle de l’énoncé. Le futur direct, introduit par deux-points, conserve plus nettement l’instruction adressée à la deuxième personne.
  - severity: low
    issue: « répandrais du sang sur eux »
