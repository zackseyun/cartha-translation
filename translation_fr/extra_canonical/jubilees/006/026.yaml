lexical_decisions:
- source_word: ወባቲ
  choice: Ce jour-là
  rationale: Littéralement « et en elle / à ce moment-là » ; dans ce contexte chronologique, « Ce jour-là » donne en français naturel la référence à la date précédemment mentionnée.
- source_word: የብሰት
  choice: s’assécha
  rationale: Rend directement l’idée que la terre devint sèche.
- source_word: ወአርኀወ
  choice: il ouvrit
  rationale: Le texte exprime l’action d’ouvrir sans nommer explicitement ici le complément ; la traduction n’en ajoute donc aucun.
- source_word: በሠርቀ፡ ወርኅ
  choice: À la nouvelle lune
  rationale: L’expression désigne le lever ou commencement du mois et, dans la tradition textuelle de ce passage, sa nouvelle lune.
- source_word: አፈ፡ መዓምቅቲሃ፡ ለቀላይ፡ ታሕቲት
  choice: les bouches des profondeurs de l’abîme inférieur
  rationale: Conserve l’image concrète des « bouches » ainsi que l’enchaînement spatial du texte guèze, sans le réduire à une formulation interprétative.
- source_word: ተርኅወ
  choice: furent ouvertes
  rationale: Le passif est explicitement présent dans le texte source et doit être conservé malgré la proposition inachevée.
theological_decisions:
- issue: Complément implicite de « il ouvrit »
  choice: Ne pas préciser ce qui fut ouvert
  alternative: Ajouter « l’arche », « la fenêtre » ou « sa couverture »
  rationale: Le complément n’est pas exprimé dans l’extrait guèze ; l’ajouter trancherait une ambiguïté que le texte fourni laisse ouverte.
- issue: Fin incomplète de la proposition
  choice: Conserver « de… » et signaler la lacune de l’extrait
  alternative: Compléter la phrase d’après un contexte ou un témoin non fourni
  rationale: Le texte source communiqué s’interrompt après la préposition génitivale ; aucune restitution conjecturale ne doit être introduite dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure fluide tout en conservant les images bibliques de la « nouvelle lune », des « bouches » et de « l’abîme ». Le point-virgule clarifie la succession des actions sans effacer leur coordination.
