  text: Ce jour-là, la terre s’assécha ; il ouvrit et vit la terre. À la nouvelle lune du quatrième mois, les bouches des profondeurs de l’abîme inférieur furent fermées. À la nouvelle lune du septième mois furent ouvertes toutes les bouches de…[a]
