  text: so that they became for him a memorial. And on the new moon of the first month it was said to him that he should make the ark,
translation:
  language: fr
  text: jusqu’à ce qu’ils deviennent pour lui un mémorial. Lors de la nouvelle lune du premier mois, il lui fut dit de construire l’arche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዝካረ
  choice: un mémorial
  rationale: Le terme guèze désigne ce qui sert de souvenir ou de commémoration; « mémorial » conserve ici la formulation concrète et solennelle.
- source_word: በሠርቀ፡ ወርኅ
  choice: à la nouvelle lune
  rationale: L’expression renvoie au commencement visible du mois, traditionnellement rendu par « nouvelle lune ».
- source_word: ታቦተ
  choice: l’arche
  rationale: Dans le contexte de Noé, le mot désigne l’arche à construire; l’article défini est naturel en français et l’identifie comme l’arche bien connue du récit.
- source_word: ይግበር
  choice: construire
  rationale: Le verbe signifie littéralement « faire »; avec l’arche comme objet, « construire » exprime naturellement l’action visée.
theological_decisions:
- issue: Référent du pluriel « ils »
  choice: Conserver le pronom « ils » sans explicitation
  alternative: Nommer les éléments évoqués dans le contexte précédent
  rationale: Le verset isolé ne fournit pas explicitement l’antécédent; conserver le pronom respecte la continuité et évite d’imposer une identification.
- issue: Formulation passive de l’ordre reçu
  choice: « il lui fut dit »
  alternative: « Dieu lui dit »
  rationale: La source emploie une tournure passive et ne nomme pas ici l’agent; la traduction préserve cette réserve.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de la source tout en employant l’expression idiomatique « construire l’arche ».
