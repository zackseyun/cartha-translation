  yaml_path: translation/extra_canonical/jubilees/006/029.yaml
  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
translation:
  language: fr
  text: 'Pour les fêtes et les commémorations, à jamais ; telles sont leurs prescriptions. Elles sont inscrites[a] sur les tablettes célestes : treize semaines, chacune d’une à l’autre, pour leurs commémorations, de la première à la deuxième, de la deuxième à la troisième et de la troisième à la quatrième.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elles sont consignées ».
    reason: Le verbe peut évoquer l’action d’enregistrer ou de porter par écrit sur les tablettes célestes.
lexical_decisions:
- source_word: ለበዓላት፡ ለተዝካር፡ እስከ፡ ለዓለም
  choice: Pour les fêtes et pour qu’elles soient commémorées à jamais
  rationale: Rend la destination exprimée par les prépositions et le sens mémoriel durable de ተዝካር, dans un français naturel.
- source_word: ሥርዓት
  choice: ordre
  rationale: Le terme désigne ici une ordonnance ou un agencement fixé; « ordre » conserve ces deux nuances sans surinterprétation institutionnelle.
- source_word: ያዐርገዎን፡ ውስተ፡ ጽላት፡ ሰማይ
  choice: Elles sont inscrites sur les tablettes célestes
  rationale: L’imparfait ge’ez est rendu au présent, et « inscrites » convient au contexte des tablettes tout en maintenant l’idée d’un enregistrement.
- source_word: ዓሥሩ፡ ወሠላስ፡ ሰንበታት
  choice: treize semaines
  rationale: Traduction directe du nombre et de l’unité temporelle.
- source_word: አሐቲ፡ አሐቲ፡ እምኔሆን፡ እምዛቲ፡ ውስተ፡ ዛቲ
  choice: de l’une à l’autre
  rationale: Expression concise qui préserve la relation distributive entre les quatre dates.
theological_decisions:
- issue: Statut de l’ordre festif
  choice: tel est leur ordre
  alternative: ainsi sont-elles prescrites
  rationale: « Ordre » traduit ሥርዓት sans préciser qui ordonne ni introduire une formulation confessionnelle plus forte que la source.
- issue: Temps verbal de l’inscription céleste
  choice: Elles sont inscrites
  alternative: Elles furent inscrites
  rationale: Le présent reflète l’imparfait ge’ez signalé par la révision, tout en laissant ouverte la portée temporelle de l’inscription.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation explicite la structure difficile de la première proposition sans effacer la séquence des intervalles de treize semaines.
