  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
translation:
  language: fr
  text: Il plaça la graisse sur l’autel. Il prit un bœuf, un bélier, un mouton, des chevreaux, du sel, une tourterelle et un jeune pigeon. Il offrit un holocauste sur l’autel et déposa sur eux une offrande mêlée d’huile. Il aspergea du vin, mit de l’encens sur le tout et fit monter une odeur agréable au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ፡ ሥብሐ
  choice: plaça la graisse
  rationale: Dans ce contexte sacrificiel, le causatif « faire monter » désigne l’action de mettre la graisse sur l’autel; « plaça » donne en français courant le sens contextuel sans confondre cette première action avec l’holocauste mentionné ensuite.
- source_word: ነዝኀ፡ ወይነ
  choice: aspergea du vin
  rationale: Le verbe ነዝኀ exprime l’action d’asperger ou de disperser; cette traduction respecte le verbe guèze au lieu de l’assimiler à une libation versée.
- source_word: ጽንሓሐ
  choice: holocauste
  rationale: Le terme désigne ici une offrande entièrement brûlée; « holocauste » est le terme sacrificiel français établi et demeure compréhensible dans ce registre.
- source_word: መዐዛ፡ ሠናየ፡ ዘያሠምር
  choice: une odeur agréable, agréée
  rationale: La formulation conserve à la fois le caractère plaisant de l’odeur et son acceptation devant Dieu, sans fondre les deux idées.
theological_decisions:
- issue: Désignation divine እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte porte le titre guèze « Seigneur » et non une indication explicite du tétragramme; « le Seigneur » évite donc d’introduire un nom divin absent de la source.
- issue: Relation de l’offrande mêlée d’huile aux victimes
  choice: déposa sur eux
  alternative: déposa par-dessus une offrande
  rationale: Le pronom pluriel de la source est conservé afin de ne pas préciser davantage quels éléments antérieurs il reprend.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire sacrificiel traditionnel (« autel », « holocauste », « offrande », « encens ») est maintenu, tandis que la syntaxe reste directe et accessible.
