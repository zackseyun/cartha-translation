  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: fr
  text: Mais vous ne mangerez pas la chair avec sa vie, avec son sang. En effet, la vie de toute chair est dans le sang, afin que votre sang, pour vos vies, ne soit pas réclamé. De la main de tout homme, de la main de tout être vivant, je réclamerai le sang de l’homme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሱ
  choice: sa vie
  rationale: Dans cette interdiction alimentaire, le terme désigne ici le principe vital associé au sang; «vie» rend naturellement le sens contextuel sans imposer «esprit».
- source_word: ነፍሰ
  choice: la vie
  rationale: Le mot peut désigner l’âme, la personne ou la vie; la proposition «est dans le sang» favorise nettement «vie».
- source_word: ይትኀሠሥ / አኀሥሦ
  choice: soit réclamé / je réclamerai
  rationale: La répétition de la racine exprimant la demande ou l’exigence est conservée, avec le sens judiciaire de demander compte du sang versé.
- source_word: እዴ
  choice: la main
  rationale: La formulation concrète de la source est maintenue plutôt que remplacée par «à chacun» ou «de la part de».
- source_word: አኀሥሦ
  choice: tout être vivant
  rationale: Dans ce contexte parallèle à Genèse 9:5, le terme vise les créatures vivantes, vraisemblablement les animaux; «être vivant» préserve une portée plus large.
theological_decisions:
- issue: Rapport entre la vie et le sang dans l’interdiction
  choice: «avec sa vie, c’est-à-dire avec son sang»
  alternative: «avec son âme, avec son sang»
  rationale: Le texte met les deux expressions en apposition. «C’est-à-dire» explicite ce lien en français courant sans identifier métaphysiquement l’âme au sang.
- issue: Finalité de la clause sur le sang humain
  choice: «afin que votre sang, pour vos vies, ne soit pas réclamé»
  alternative: «de peur que le sang de vos vies ne soit réclamé»
  rationale: Cette formulation conserve la clause finale négative et l’expression difficile de la source, sans résoudre entièrement la tension entre prévention et reddition de comptes.
- issue: Responsabilité des humains et des êtres vivants
  choice: conserver les deux catégories distinctes
  alternative: harmoniser avec une formulation plus explicite telle que «de tout animal et de tout homme»
  rationale: L’ordre et les catégories de la source guèze sont respectés, même s’ils diffèrent de certaines formes connues de Genèse 9:5.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve volontairement la solennité et certaines aspérités juridiques du passage, notamment «de la main de» et «réclamer le sang».
