  source_fidelity: La traduction rend correctement l’interdiction de consommer la chair avec son sang, l’affirmation que la vie de toute chair est dans le sang, ainsi que la double responsabilité attribuée à l’être humain et à tout être vivant. Toutefois, « c’est-à-dire » transforme en explication non ambiguë une juxtaposition que le texte source maintient, et il convient de l’éviter. La formulation finale conserve délibérément l’expression difficile « votre sang, pour vos vies », sans la résoudre doctrinalement.
  naturalness: Le français est globalement clair et d’un registre biblique moderne. La répétition « avec sa vie, avec son sang » est plus fidèle et plus sobre que l’explicitation par « c’est-à-dire ». La construction « de la main de » est inhabituelle en français courant, mais elle est ici justifiée par la fidélité à la formulation juridique concrète du texte.
  terminology: « Vie », « sang », « chair », « être vivant » et « réclamer » conviennent. « Être vivant » préserve la généralité de l’anglais d’audit et évite de réduire sans nécessité le référent aux seuls animaux. « Réclamer » maintient utilement la répétition de l’idée d’exiger ou de demander compte.
