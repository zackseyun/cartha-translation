  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: fr
  text: 'C’est pourquoi je te donne cet ordre et je t’en rends témoignage, afin que tu leur en rendes témoignage. Car, après ta mort, tes enfants le corrompront : ils ne feront pas de l’année une année de trois cent soixante-quatre jours seulement. C’est pourquoi ils se tromperont au sujet des nouvelles lunes, des saisons, des sabbats et des fêtes, et ils mangeront tout le sang avec toute chair.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout le sang avec toute chair ». Le sens précis de cette formule condensée est incertain.'
    reason: La tournure est inhabituelle en français comme dans la traduction littérale et peut évoquer soit la consommation de chair avec son sang, soit une généralisation ; la note conserve l’ambiguïté.
lexical_decisions:
- source_word: እኤዝዘከ
  choice: je te donne cet ordre
  rationale: Rend directement le verbe « ordonner, commander » dans un français naturel et digne.
- source_word: አስምዕ ... ታስምዕ
  choice: je témoigne auprès de toi ... tu témoignes auprès d’eux
  rationale: Conserve la répétition et la portée testimoniale, possiblement covenantale, du causatif de ሰምዐ, sans l’affaiblir en simple transmission d’information.
- source_word: ያማስኑ
  choice: le corrompront
  rationale: Le pronom renvoie vraisemblablement à l’ordre calendaire ou à son observance évoqués dans le contexte; la formulation française maintient ce référent implicite.
- source_word: ዓመተ ... ምእተ ወስሳ ወረቡዐ መዋዕለ ባሕቲተከ
  choice: de l’année exactement trois cent soixante-quatre jours
  rationale: Exprime le total calendaire et la valeur restrictive de « seulement » sans suggérer que l’année serait supprimée.
- source_word: ሠርቀ
  choice: nouvelles lunes
  rationale: Dans cette liste calendaire, le terme désigne les nouvelles lunes, avec leur fonction de repères calendaires.
- source_word: ጊዜ
  choice: saisons
  rationale: « Saisons » convient au contexte des temps fixés du calendrier tout en préservant la portée générale du terme.
- source_word: ደመ ምስለ ኵሉ ሥጋ
  choice: tout le sang avec toute chair
  rationale: Traduction volontairement proche de la formulation source, qui évite d’ajouter « toutes sortes de » absent du texte.
theological_decisions:
- issue: Portée testimoniale de አስምዐ
  choice: témoigne auprès de toi ... témoignes auprès d’eux
  alternative: fais connaître à toi ... fais connaître à eux
  rationale: Le choix retenu préserve la solennité juridique ou covenantale possible ainsi que le parallélisme du texte.
- issue: Référent de « le corrompront »
  choice: maintenir le pronom implicite « le »
  alternative: expliciter « le calendrier » ou « cet ordre »
  rationale: Le référent exact n’est pas nommé dans ce verset; l’expliciter résoudrait une ambiguïté que le texte source laisse subsister.
- issue: Clause finale sur le sang et la chair
  choice: tout le sang avec toute chair
  alternative: toutes sortes de sang avec toutes sortes de chair
  rationale: La formulation littérale garde la tension et l’étrangeté de l’énoncé sans introduire une catégorisation absente de la source.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « témoigner » et les termes calendaires ont été conservés. « Nouvelles lunes » est préférable à « nouveaux mois » pour préserver l’image et le contexte ancien.
