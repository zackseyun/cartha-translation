  terminology: « Nouvelles lunes », « saisons », « sabbats » et « fêtes » conviennent dans ce contexte calendaire. La formule « tout le sang avec toute chair » doit rester littérale, avec une note signalant son obscurité, afin de ne pas imposer une interprétation.
