  to: 'C’est pourquoi je te donne cet ordre et je t’en rends témoignage, afin que tu leur en rendes témoignage. Car, après ta mort, tes enfants le corrompront : ils ne feront pas de l’année une année de trois cent soixante-quatre jours seulement. C’est pourquoi ils se tromperont au sujet des nouvelles lunes, des saisons, des sabbats et des fêtes, et ils mangeront tout le sang avec toute chair.[a]'
