  source_fidelity: 'Le sens général suit fidèlement le guèze et la chaîne d’audit anglaise : ordre solennel, témoignage transmis, corruption ultérieure de l’observance calendaire, année de 364 jours, puis erreur relative aux repères cultuels et clause finale volontairement littérale. La formulation « exactement » ajoute toutefois une précision absente du texte, dont la restriction est rendue par « seulement ».'
