  yaml_path: translation/extra_canonical/jubilees/006/037.yaml
  text: Therefore years will come upon them when they disturb the order, and they will make a day of testimony an abominable day, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.
translation:
  language: fr
  text: 'C’est pourquoi des années viendront où ils bouleverseront l’ordre : ils feront d’un jour de témoignage un jour abominable[a], et d’un jour impur un jour de fête. Ils confondront tous les jours saints avec les jours impurs, et le jour impur avec le jour saint, car ils se tromperont au sujet des mois, des sabbats, des fêtes et des jubilés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ils feront d’un jour abominable un jour de témoignage ».'
    reason: La tradition de traduction antérieure inverse les deux éléments, bien que la syntaxe guèze favorise le texte principal.
lexical_decisions:
- source_word: ያማስኑ
  choice: bouleverseront l’ordre
  rationale: Le verbe exprime ici l’idée de déranger ou corrompre l’ordonnancement du calendrier; cette formulation naturelle rend l’objet implicite d’après le contexte.
- source_word: ዕለተ፡ ስምዐ
  choice: jour de témoignage
  rationale: Rend littéralement le groupe construit guèze et conserve la terminologie religieuse du passage.
- source_word: ምግንተ
  choice: jour abominable
  rationale: Le terme qualifie le jour comme odieux ou répréhensible; « abominable » préserve la forte réprobation du texte.
- source_word: ይደምሩ
  choice: confondront
  rationale: Dans ce contexte calendaire, le sens est de mêler les catégories du saint et de l’impur, et non simplement de les additionner.
- source_word: ኢዮቤል
  choice: jubilés
  rationale: Terme traditionnel et intelligible pour les cycles jubilaires.
theological_decisions:
- issue: Direction de la transformation entre le jour de témoignage et le jour abominable
  choice: ils feront d’un jour de témoignage un jour abominable
  alternative: ils feront d’un jour abominable un jour de témoignage
  rationale: La syntaxe guèze présente « jour de témoignage » comme ce qui est transformé et « abominable » comme son résultat ou attribut; cela maintient aussi le parallélisme avec l’élévation suivante d’un jour impur en jour de fête.
- issue: Nature de l’erreur calendaire
  choice: ils se tromperont au sujet des mois, des sabbats, des fêtes et des jubilés
  alternative: ils égareront les mois, les sabbats, les fêtes et les jubilés
  rationale: Le verbe indique qu’ils errent dans leur calcul ou leur observance; la traduction évite d’attribuer aux unités calendaires elles-mêmes une action ou un déplacement.
translation_notes:
  register: Français international moderne, fluide et digne. Le vocabulaire cultuel (« impur », « saint », « sabbats », « jubilés ») est conservé sans surinterprétation confessionnelle.
