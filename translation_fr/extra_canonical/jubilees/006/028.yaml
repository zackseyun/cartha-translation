  text: the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.
translation:
  language: fr
  text: Les sommets des montagnes apparurent, et Noé se réjouit. C’est pourquoi il les institua pour lui-même comme fêtes commémoratives à perpétuité, et c’est ainsi qu’elles furent instituées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስቲ፡ አድባር
  choice: les sommets des montagnes
  rationale: Rend directement l’expression guèze désignant les têtes ou sommets des montagnes.
- source_word: ተፈሥሐ
  choice: se réjouit
  rationale: Traduction naturelle du verbe exprimant la joie.
- source_word: ሠርዓን
  choice: il les institua
  rationale: Le verbe renvoie ici à l’établissement ou à l’ordonnance de célébrations; « institua » convient au registre législatif et cultuel.
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም
  choice: comme fêtes commémoratives à perpétuité
  rationale: La suite authentique du verset, absente de l’extrait segmenté mais attestée par la révision fournie, associe les fêtes au souvenir durable; cette formulation française restitue les trois éléments sans lourdeur.
- source_word: ወከማሁ፡ ሠርዓዋ
  choice: et c’est ainsi qu’elles furent instituées
  rationale: Conserve la conclusion récapitulative et sa voix passive, sans préciser un agent que le texte ne nomme pas.
theological_decisions:
- issue: Fonction des fêtes
  choice: fêtes commémoratives à perpétuité
  alternative: fêtes à perpétuité
  rationale: La leçon complète comprend ለተዝካር, « pour le souvenir/commémoration »; l’omettre supprimerait une fonction explicite des fêtes.
- issue: Référent du pronom pluriel dans « il les institua »
  choice: conserver « les » sans explicitation
  alternative: les dates / ces jours
  rationale: Le référent dépend du contexte précédent et l’ambiguïté grammaticale ne doit pas être résolue artificiellement dans ce seul verset.
translation_notes:
  register: Français moderne, digne et accessible. « À perpétuité » maintient la force normative de « pour toujours » dans un registre naturel; « fêtes commémoratives » évite la tournure plus lourde « fêtes pour servir de mémorial ».
