  text: And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and appointed times and sabbaths, and they will go wrong as to the whole order of the years.
translation:
  language: fr
  text: Tous les enfants d’Israël oublieront et ne trouveront pas le chemin des années. Ils oublieront les nouvelles lunes, les temps fixés et les sabbats, et ils se tromperont sur tout l’ordre des années.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ እስራኤል
  choice: les enfants d’Israël
  rationale: Rend directement l’expression filiale traditionnelle tout en restant naturelle en français biblique moderne.
- source_word: ፍኖተ፡ ዓመታት
  choice: le chemin des années
  rationale: Conserve la métaphore du « chemin » appliquée au calcul ou au déroulement des années, sans réduire son ambiguïté.
- source_word: ሠርቀ
  choice: les nouvelles lunes
  rationale: Dans ce contexte calendaire, le terme désigne les nouvelles lunes, repères du calendrier.
- source_word: ጊዜ
  choice: les temps fixés
  rationale: Exprime ici des temps déterminés ou rendez-vous calendaires, plutôt que de simples saisons naturelles.
- source_word: ሰንበተ
  choice: les sabbats
  rationale: Translittération française consacrée du terme religieux et calendaire.
- source_word: ኵሎ፡ ሥርዐተ፡ ዘዓመታት
  choice: tout l’ordre des années
  rationale: Préserve l’idée d’un agencement calendaire complet et normatif.
- source_word: ይጌግዩ
  choice: ils se tromperont sur
  rationale: Rend l’idée d’égarement ou d’erreur en l’appliquant naturellement à l’ordre calendaire en français.
theological_decisions:
- issue: Nature des « temps » mentionnés
  choice: temps fixés
  alternative: fêtes fixées / saisons
  rationale: Le contexte est calendaire et peut inclure les rendez-vous cultuels, mais le texte ne justifie pas de limiter explicitement le mot aux seules fêtes.
- issue: Sens du « chemin des années »
  choice: maintien de la métaphore
  alternative: le calcul des années / le calendrier
  rationale: La formulation source est métaphorique; l’expliciter comme « calendrier » résoudrait indûment la portée exacte de l’expression.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition d’« oublieront » est maintenue, tandis que la phrase est divisée en deux pour plus de clarté. Aucun marqueur de note n’est requis.
