  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: fr
  text: 'comme un commandement pour eux : un seul jour par an, durant ce mois, ils célébreront la fête. Car c’est la fête des Semaines et la fête des Prémices. Elle est de deux sortes et possède une double nature.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዝ
  choice: commandement
  rationale: Rend directement l’idée d’une prescription obligatoire.
- source_word: በዓለ፡ ሱባዔያት
  choice: fête des Semaines
  rationale: Nom traditionnel et transparent de la fête, correspondant littéralement au guèze.
- source_word: በዓለ፡ ቀዳሜ፡ ፍሬ
  choice: fête des Prémices
  rationale: Rend le nom cultuel formé sur « premier fruit » dans un français biblique courant.
- source_word: ክልኤ፡ ዐጽፍት … ወለክልኤ
  choice: de deux sortes et possède une double nature
  rationale: Préserve la répétition insistante de l’idée de dualité sans réduire les deux expressions à une seule.
theological_decisions:
- issue: Relation entre la fête des Semaines et celle des Prémices
  choice: Les deux appellations sont coordonnées et renvoient à la même célébration.
  alternative: Y voir deux fêtes distinctes.
  rationale: Le singulier repris dans la dernière phrase et la formulation identificatrice soutiennent une fête portant deux caractères ou noms.
translation_notes:
  register: Français moderne, digne et accessible. Les noms officiels des fêtes sont capitalisés. La tournure finale conserve la tension et la répétition du texte source, malgré son caractère quelque peu énigmatique.
