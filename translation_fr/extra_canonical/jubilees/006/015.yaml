  text: Et il donna à Noé et à ses fils un signe qu’il n’y aurait plus jamais de déluge sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእምርተ
  choice: un signe
  rationale: Le terme guèze désigne un signe ou une marque; «un signe» rend naturellement le sens dans ce contexte d’alliance.
- source_word: አይኅ
  choice: déluge
  rationale: Dans ce contexte, le mot renvoie à la grande inondation; «déluge» est clair, traditionnel et naturel en français.
- source_word: ዳግመ
  choice: plus jamais
  rationale: Associé à la négation, l’adverbe signifie qu’un tel déluge ne se reproduira pas.
- source_word: ዲበ፡ ምድር
  choice: sur la terre
  rationale: Rend directement la relation spatiale exprimée par le guèze, sans préciser indûment si «terre» désigne le sol ou le monde habité.
theological_decisions:
- issue: Fonction du signe
  choice: pour qu’il n’y ait plus jamais de déluge
  alternative: comme signe qu’il n’y aurait plus jamais de déluge
  rationale: La formulation conserve la construction finale du texte source sans identifier explicitement le signe ni développer sa fonction au-delà de ce que dit le verset.
