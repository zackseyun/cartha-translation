  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: fr
  text: Mais Abraham seul l’observa. Isaac, Jacob et ses enfants l’observèrent jusqu’à ton époque. À ton époque, les fils d’Israël l’oublièrent, jusqu’à ce que je le renouvelle pour eux sur cette montagne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቀበ / ዐቀብዋ
  choice: observa / observèrent
  rationale: Le verbe exprime l’idée de garder ou respecter une prescription; « observer » est naturel en français pour une fête ou une ordonnance.
- source_word: ባሕቲቱ
  choice: seul
  rationale: Rend directement l’idée qu’Abraham fut le seul à maintenir cette observance.
- source_word: መዋዕሊከ
  choice: ton époque
  rationale: Littéralement « tes jours »; « ton époque » transmet ici clairement le sens temporel en français moderne.
- source_word: ውሉደ እስራኤል
  choice: les fils d’Israël
  rationale: Conserve l’expression collective traditionnelle tout en restant immédiatement compréhensible.
- source_word: ኀይስክዎሙ
  choice: je l’ai renouvelé pour eux
  rationale: Suit le sens de restauration ou renouvellement de l’observance transmis par le texte et son contexte.
- source_word: ደብር
  choice: montagne
  rationale: Désigne ici la montagne de la révélation; le français courant « montagne » convient sans ajouter un nom absent du verset.
theological_decisions:
- issue: Référent de « l’ »
  choice: Maintien du pronom sans explicitation
  alternative: Nommer explicitement la fête ou l’alliance évoquée dans le contexte
  rationale: Le verset grec/éthiopien dépend du contexte immédiat; expliciter ici risquerait de trancher au-delà de sa formulation propre.
- issue: Portée de « ses enfants »
  choice: Conserver « ses enfants » après « Isaac, Jacob »
  alternative: Écrire « les enfants de Jacob »
  rationale: Le possessif source est conservé afin de ne pas sur-expliciter son antécédent, même si Jacob est le référent le plus naturel.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « À ton époque » est maintenue pour refléter la structure du texte source; « observer » convient au contexte d’une ordonnance cultuelle.
