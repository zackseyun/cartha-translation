  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
translation:
  language: fr
  text: 'Et toi, ordonne aux enfants d’Israël d’observer les années selon ce décompte : trois cent soixante-quatre jours, et ce sera une année complète. Elle ne déplacera pas son temps par rapport à ses jours ni à ses fêtes. En effet, tout s’y produira conformément à leur témoignage, et ils n’omettront aucun jour ni ne déplaceront aucune fête.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእንተኒ
  choice: Et toi
  rationale: Conserve le pronom indépendant emphatique adressé à Moïse.
- source_word: ይዕቀቡ፡ ዓመታተ
  choice: compter les années
  rationale: Dans ce contexte calendaire, exprime naturellement l’idée d’observer et de tenir les années selon le calcul prescrit.
- source_word: በዝ፡ ኍልቍ
  choice: selon ce calcul
  rationale: Rend le sens de dénombrement ou de comput calendaire.
- source_word: ፍጹመ፡ ዓመተ
  choice: une année complète
  rationale: Traduction directe de l’expression qualifiant l’année de complète ou achevée.
- source_word: ኢያማስን / ኢያማስኑ
  choice: ne décalera pas / ne décaleront aucune
  rationale: Le verbe décrit ici le dérèglement du calendrier et des fêtes; « décaler » est clair en français moderne tout en respectant l’alternance singulier-pluriel.
- source_word: ይበጽሕ
  choice: arrivera
  rationale: Préserve le sens général de parvenir ou arriver, appliqué à l’occurrence des temps calendaires.
- source_word: ወኢየኀልፉ፡ ዕለተ
  choice: ils n’omettront aucun jour
  rationale: Exprime clairement qu’aucun jour ne sera laissé de côté dans le comput.
theological_decisions:
- issue: Référent du singulier dans « elle ne décalera pas »
  choice: L’année complète
  alternative: Le calcul
  rationale: Le féminin français reprend naturellement « une année complète » et respecte la forme verbale guèze au singulier sans transformer le sujet en pluriel.
- issue: Référent de « leur témoignage »
  choice: Conserver le pluriel possessif sans l’expliciter
  alternative: Identifier explicitement les jours ou les fêtes
  rationale: Le référent exact demeure quelque peu ambigu dans la source; la traduction ne doit pas résoudre artificiellement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement dépliée pour rendre intelligible le raisonnement calendaire, tout en conservant l’emphase initiale sur « toi », le nombre précis de jours, le singulier du premier verbe négatif et le pluriel final.
