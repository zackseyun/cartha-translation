  source_fidelity: La première injonction porte sur l’observance des années, non sur leur simple comptage. La révision restitue « observer ». Elle conserve aussi le singulier de la proposition concernant l’année et ne précise pas le référent pluriel, ambigu, de « leur témoignage ». « Tout s’y produira » rend le locatif pluriel sans le remplacer par l’interprétatif « en son temps ».
  naturalness: Le texte proposé est compréhensible, mais « compter les années » et « le temps fixé » sont respectivement réducteur et ajouté au texte. « Cela constituera » est moins direct que « ce sera ». La formulation révisée demeure fluide en français international tout en gardant la logique calendaire du passage.
  terminology: « Enfants d’Israël », « fêtes » et « année complète » conviennent. « Observer les années selon ce décompte » rend avec davantage de fidélité l’instruction de garder/observer les années selon le calcul prescrit.
