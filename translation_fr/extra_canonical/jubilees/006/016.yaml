  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: fr
  text: Il plaça son arc dans la nuée comme signe de l’alliance éternelle, afin que les eaux du déluge ne reviennent jamais sur la terre pour la détruire, tant que durera la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ
  choice: son arc
  rationale: Le terme guèze désigne l’arc; dans ce contexte céleste et conformément au récit du déluge, il évoque l’arc-en-ciel sans qu’il soit nécessaire d’expliciter davantage.
- source_word: ደመና
  choice: la nuée
  rationale: Rend le terme désignant le nuage avec un registre digne et biblique, tout en restant compréhensible en français moderne.
- source_word: ለትእምርተ፡ ኪዳን፡ ዘለዓለም
  choice: comme signe de l’alliance éternelle
  rationale: Suit directement la construction du texte et conserve le vocabulaire d’alliance.
- source_word: ማየ፡ አይኅ
  choice: les eaux du déluge
  rationale: Rend littéralement l’expression composée «eaux du déluge».
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: tant que durera la terre
  rationale: Expression française naturelle pour l’idée littérale de «tous les jours de la terre», c’est-à-dire pendant toute sa durée.
theological_decisions:
- issue: Référent de l’arc
  choice: son arc
  alternative: l’arc-en-ciel
  rationale: Le texte dit simplement «arc». La traduction retenue préserve cette forme et sa possible connotation d’arme déposée, tout en laissant le contexte indiquer le phénomène céleste.
- issue: Portée de la destruction
  choice: pour la détruire
  alternative: pour tout détruire
  rationale: Le suffixe guèze renvoie naturellement à la terre; cette formulation évite d’ajouter un objet universel distinct qui n’est pas explicitement exprimé.
- issue: Durée de la promesse
  choice: tant que durera la terre
  alternative: tous les jours de la terre
  rationale: 'La formulation idiomatique française conserve la tension du texte: la promesse est formulée pour toute la durée du monde terrestre, plutôt que par un simple adverbe absolu.'
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. La phrase demeure proche de la syntaxe et des images du guèze, avec une légère adaptation idiomatique en fin de verset.
