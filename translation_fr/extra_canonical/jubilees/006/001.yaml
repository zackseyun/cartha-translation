  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: fr
  text: 'À la nouvelle lune du troisième mois, il sortit de l’arche et bâtit un autel sur cette montagne. Il fit l’expiation pour la terre : il prit un chevreau et, avec son sang, fit l’expiation pour toute la faute de la terre, car tout ce qui s’y trouvait avait été détruit, sauf ceux qui étaient dans l’arche avec Noé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ሠርቁ፡ ለወርኅ፡ ሣልስ
  choice: À la nouvelle lune du troisième mois
  rationale: L’expression désigne le commencement du mois marqué par la nouvelle lune; cette formulation naturelle conserve la précision calendaire du guèze.
- source_word: ምሥዋዐ
  choice: un autel
  rationale: Le terme désigne ici l’autel construit par Noé sur la montagne.
- source_word: አስተስረየ
  choice: fit l’expiation
  rationale: Le verbe exprime un acte rituel d’expiation; « faire l’expiation » préserve sa portée cultuelle sans préciser davantage le mécanisme théologique.
- source_word: መሐስአ፡ ጠሊ
  choice: un jeune bouc
  rationale: Le syntagme désigne un jeune animal mâle de l’espèce caprine.
- source_word: አበሳ፡ ምድር
  choice: la faute de la terre
  rationale: « Faute » conserve la dimension morale ou culpabilisante du terme tout en maintenant l’étrange attribution à la terre présente dans la source.
theological_decisions:
- issue: Portée de l’expiation accomplie par Noé
  choice: Conserver « fit l’expiation pour la terre » et « pour toute la faute de la terre »
  alternative: Rendre par « purifia la terre » ou « obtint le pardon des péchés commis sur la terre »
  rationale: La source associe explicitement l’expiation à la terre et à sa faute; la traduction ne résout pas cette tension en une doctrine plus précise de purification ou de pardon.
- issue: Référent du sang
  choice: « avec son sang »
  alternative: « avec le sang du jeune bouc »
  rationale: Le possessif reprend naturellement le jeune bouc tout en reflétant la construction concise de la source.
translation_notes:
  register: Français international moderne, sobre et digne. Syntaxe légèrement solennelle adaptée à un récit ancien, sans archaïsmes inutiles. La répétition de « fit l’expiation » est maintenue pour refléter celle du texte source.
