  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: fr
  text: 'Et ce témoignage est écrit à votre sujet, afin que vous l’observiez tous les jours : durant tous les jours de la terre, vous ne devez manger aucun sang de bêtes sauvages, d’oiseaux ou d’animaux domestiques. Quiconque mange du sang d’une bête sauvage, d’un animal domestique ou d’un oiseau, durant tous les jours de la terre, sera retranché de la terre, lui et sa descendance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: témoignage
  rationale: Le terme désigne ici une attestation ou prescription mise par écrit; « témoignage » conserve sa portée formelle.
- source_word: ትዕቀብዋ
  choice: vous l’observiez
  rationale: Le verbe exprime l’idée de garder fidèlement une prescription, rendue naturellement en français par « observer ».
- source_word: አራዊት
  choice: bêtes sauvages
  rationale: Ce terme se distingue ici d’እንስሳ, qui désigne les animaux domestiques.
- source_word: እንስሳ
  choice: animaux domestiques
  rationale: Le contexte énumère plusieurs catégories animales; cette traduction maintient la distinction avec les bêtes sauvages et les oiseaux.
- source_word: ይስሮ
  choice: sera retranché
  rationale: Le verbe évoque l’exclusion ou l’éradication; « retranché » préserve la formulation judiciaire sans préciser un mécanisme non exprimé.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: Le sens littéral est « sa semence »; « descendance » est naturel et exact dans ce contexte généalogique.
theological_decisions:
- issue: Portée temporelle de l’interdiction du sang
  choice: durant tous les jours de la terre
  alternative: pour toujours
  rationale: La formulation source est conservée afin de ne pas réduire ni systématiser sa portée.
- issue: Nature de la sanction
  choice: sera retranché de la terre
  alternative: sera exterminé de la terre
  rationale: « Retranché » conserve l’ambiguïté entre exclusion, disparition et mise à mort, sans imposer une interprétation particulière.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « durant tous les jours de la terre » est maintenue parce qu’elle appartient à la rhétorique et à l’insistance du texte source.
