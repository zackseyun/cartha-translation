  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
translation:
  language: fr
  text: Mais s’ils transgressent et ne les observent pas selon son commandement, alors ils dérégleront toutes leurs périodes, les années seront déplacées par rapport à cet ordre[a], et ils transgresseront leurs ordonnances.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte édité place ici entre crochets une répétition : « et ils dérégleront les périodes, et les années seront déplacées » ; elle est probablement secondaire.'
    reason: textual_variant
lexical_decisions:
- source_word: ወኢገብርዎን
  choice: et ne les observent pas
  rationale: Le suffixe objet est pluriel ; il renvoie aux réalités calendaires mentionnées dans le contexte. « Observer » exprime naturellement ici l’idée de mettre en pratique ou respecter.
- source_word: ያማስኑ
  choice: ils dérégleront
  rationale: 'La forme est active et causative : les transgresseurs provoquent le dérèglement des périodes, plutôt que de simples périodes qui seraient passivement troublées.'
- source_word: ጊዜያቲሆሙ
  choice: toutes leurs périodes
  rationale: « Périodes » convient au contexte calendaire tout en conservant la portée assez large du terme désignant des temps déterminés.
- source_word: ይትሐወሱ
  choice: sortiront de cet ordre
  rationale: Le verbe évoque un déplacement ou un bouleversement ; cette formulation française rend clairement la désorganisation des années par rapport à l’ordre établi.
- source_word: ሥርዐቶሙ
  choice: leurs propres règles
  rationale: Le terme peut désigner des ordonnances, dispositions ou règles établies. « Règles » évite un français juridique trop lourd et distingue ce pluriel du commandement singulier précédent.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’enchaînement causal et la voix active du guèze, tout en employant un vocabulaire naturel adapté au contexte calendaire.
