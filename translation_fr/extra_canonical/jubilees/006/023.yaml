  text: for their generations in this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year; they are written.
translation:
  language: fr
  text: pour leurs générations, durant ce mois, un jour chaque année. Et les nouvelles lunes du premier mois, du quatrième mois, du septième mois et du dixième mois sont des jours de commémoration et des jours marquant les saisons, dans les quatre divisions de l’année ; ils sont consignés par écrit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዝምዶሙ
  choice: pour leurs générations
  rationale: Le terme, probablement une variante ou une corruption textuelle apparentée à « leurs générations », prolonge la proposition du verset précédent ; la formulation française conserve ce lien sans l’omettre.
- source_word: በዝ፡ ወርኅ
  choice: durant ce mois
  rationale: Rend littéralement la référence à « ce mois » tout en formant une expression française naturelle.
- source_word: በሠርቀ፡ ወርኅ
  choice: les nouvelles lunes
  rationale: L’expression désigne le commencement du mois, marqué par la nouvelle lune ; ce choix conserve l’imagerie calendaire du texte.
- source_word: ተዝካር
  choice: commémoration
  rationale: Exprime l’idée de souvenir ou de mémorial rituel dans un registre digne et accessible.
- source_word: ዕለታት፡ ጊዜ
  choice: des jours marquant les saisons
  rationale: Une traduction strictement littérale, « jours des temps », serait obscure ; « marquant les saisons » explicite la fonction calendaire sans imposer une interprétation confessionnelle.
- source_word: አርባዕቱ፡ መክፈላት፡ ዓመት
  choice: les quatre divisions de l’année
  rationale: Correspond directement aux quatre sections calendaires de l’année.
- source_word: ጽሑፋት፡ እማንቱ
  choice: ils sont consignés par écrit
  rationale: Conserve le caractère passif et l’affirmation finale du texte, sans ajouter l’idée non attestée qu’ils auraient été « ordonnés ».
theological_decisions:
- issue: Nature des quatre dates calendaires
  choice: jours de commémoration et jours marquant les saisons
  alternative: jours de souvenir et jours des temps
  rationale: Le rendu choisi préserve les deux qualifications du texte tout en rendant intelligible leur fonction calendaire, sans préciser arbitrairement l’objet de la commémoration.
- issue: Portée de la dernière proposition
  choice: ils sont consignés par écrit
  alternative: ils sont écrits et prescrits
  rationale: Le guèze atteste seulement qu’ils sont écrits ; « prescrits » ou « ordonnés » ajouterait une notion absente de la source fournie.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe conserve le lien avec le verset précédent, la répétition calendaire et l’ambiguïté quant à ce qui est précisément commémoré.
