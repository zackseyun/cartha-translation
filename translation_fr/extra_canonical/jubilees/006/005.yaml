  yaml_path: translation/extra_canonical/jubilees/006/005.yaml
  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: fr
  text: Quant à vous, soyez féconds et multipliez-vous sur la terre ; devenez nombreux sur elle et soyez-y une bénédiction. Je mettrai la crainte et l’effroi que vous inspirez sur tout ce qui est sur la terre et dans la mer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ፡ ወተባዝኁ
  choice: soyez féconds et multipliez-vous
  rationale: Rend la formule de bénédiction et de fécondité de manière idiomatique en français biblique moderne, conformément au sens du guèze.
- source_word: ወብዙኁ፡ ላዕሌሃ
  choice: devenez nombreux sur elle
  rationale: Conserve l’idée distincte d’un accroissement numérique sur la terre, sans la fondre dans le verbe précédent.
- source_word: ወኩኑ፡ ለበረከት፡ ላዕሌሃ
  choice: soyez-y une bénédiction
  rationale: Préserve la formulation selon laquelle les destinataires doivent devenir une bénédiction sur la terre.
- source_word: ፍርሀትክሙ፡ ወረዓድክሙ
  choice: la crainte et l’effroi que vous inspirez
  rationale: Le suffixe de deuxième personne peut être rendu littéralement par « votre crainte et votre effroi », mais cette tournure française serait ambiguë ; la formulation choisie indique naturellement la crainte éprouvée envers eux.
- source_word: ኵሉ፡ ዘውስተ፡ ምድር፡ ወዘውስተ፡ ባሕር
  choice: tout ce qui vit sur la terre et dans la mer
  rationale: Le relatif substantivé désigne ici les êtres présents dans ces domaines ; « ce qui vit » explicite sobrement ce référent en français.
theological_decisions:
- issue: Portée de la domination humaine sur les créatures
  choice: Conserver uniquement l’énoncé de la crainte imposée aux êtres terrestres et marins
  alternative: Ajouter une idée explicite de domination ou de soumission
  rationale: Le texte fourni parle de crainte et d’effroi, sans formuler ici un mandat de domination ; aucune notion théologique supplémentaire n’est importée.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme solennel de la bénédiction est préservé, avec une syntaxe accessible et sans archaïsmes inutiles.
