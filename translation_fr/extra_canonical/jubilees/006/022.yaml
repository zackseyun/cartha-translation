  text: For this festival, as it is written and ordained concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you about its sacrifices, that they should be a memorial, and that the children of Israel should celebrate it in...
translation:
  language: fr
  text: 'Car[a], pour cette fête, célèbre-la comme il est écrit et prescrit à son sujet. Car j’ai écrit dans le livre de la première loi ce que j’ai écrit pour toi : tu dois la célébrer au temps fixé, un jour dans l’année. Je t’ai aussi parlé de ses sacrifices, afin qu’ils soient un mémorial et que les fils d’Israël la célèbrent dans…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier mot du texte imprimé paraît corrompu. La traduction suit ici la leçon « car », attestée par un manuscrit et adaptée au contexte.
    reason: Signaler honnêtement la correction textuelle nécessaire à la cohérence de la phrase.
  - marker: b
    text: La phrase se poursuit au verset suivant ; le texte de ce verset s’achève sur la préposition « dans ».
    reason: Préserver la coupure réelle du verset sans ajouter les mots absents de la source fournie.
lexical_decisions:
- source_word: በዓል
  choice: fête
  rationale: Désigne ici une célébration religieuse fixée; « fête » est naturel et précis en français moderne.
- source_word: ቍሩጽ
  choice: prescrit
  rationale: Dans ce contexte normatif, le terme exprime ce qui est arrêté ou ordonné; « prescrit » rend ce sens plus naturellement que « gravé ».
- source_word: በበጊዜሃ
  choice: au temps fixé
  rationale: Rend l’idée du moment propre ou assigné à la fête sans préciser davantage le calendrier.
- source_word: ዝክራነ
  choice: mémorial
  rationale: Conserve la fonction commémorative des sacrifices sans développer une interprétation cultuelle absente du texte.
- source_word: ደቂቀ እስራኤል
  choice: les fils d’Israël
  rationale: Formulation biblique française claire qui correspond directement à l’expression source.
theological_decisions:
- issue: Nature de la prescription relative à la fête
  choice: « telle qu’il est écrit et prescrit à son sujet »
  alternative: « telle qu’elle est écrite et gravée »
  rationale: Le contexte porte sur une ordonnance cultuelle; « prescrit » exprime la force normative sans introduire une doctrine particulière.
- issue: Fonction des sacrifices
  choice: « afin qu’ils servent de mémorial »
  alternative: « afin qu’ils soient des souvenirs »
  rationale: « Mémorial » conserve le vocabulaire cultuel et l’ambiguïté quant à la personne ou à l’événement commémoré.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif singulier adressé à Moïse est conservé. La répétition lourde de « j’ai écrit » a été légèrement resserrée sans modifier le contenu. La fin suspendue respecte la division du texte source et évite d’importer « de génération en génération », expression absente de ce verset.
