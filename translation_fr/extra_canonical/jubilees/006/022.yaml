  to: 'Car[a], pour cette fête, célèbre-la comme il est écrit et prescrit à son sujet. Car j’ai écrit dans le livre de la première loi ce que j’ai écrit pour toi : tu dois la célébrer au temps fixé, un jour dans l’année. Je t’ai aussi parlé de ses sacrifices, afin qu’ils soient un mémorial et que les fils d’Israël la célèbrent dans…[b]'
  rationale: La révision améliore la syntaxe française, rétablit explicitement la reprise présente dans la source (« ce que j’ai écrit pour toi ») et rend la préposition finale par « dans… », sans compléter le verset à partir du verset 23. La correction textuelle initiale demeure signalée par une note, sans masquer l’incertitude du texte imprimé.
