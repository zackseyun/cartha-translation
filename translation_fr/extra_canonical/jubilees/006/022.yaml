    issue: Tournure « telle qu’il est écrit »
    rationale: La construction est peu idiomatique et peut donner l’impression que « il » reprend « fête ». Le texte exprime plutôt « comme il est écrit et prescrit à son sujet ».
  - severity: low
    issue: Reprise de l’écrit destiné au destinataire atténuée
    rationale: « J’ai écrit pour toi que… » condense « j’ai écrit dans le livre de la première loi ce que j’ai écrit pour toi ». La reprise peut être maintenue naturellement par « ce que j’ai écrit pour toi ».
