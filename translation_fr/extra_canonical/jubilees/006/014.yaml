  yaml_path: translation/extra_canonical/jubilees/006/014.yaml
  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
translation:
  language: fr
  text: Cette loi n’a pas de limite de temps, car elle est pour toujours. Ils l’observeront de génération en génération, afin de continuer à supplier en votre faveur avec du sang devant l’autel, chaque jour, matin et soir. Ils en feront continuellement l’expiation devant le Seigneur, afin de l’observer et de ne pas être déracinés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne pas être arrachés » ; le verbe évoque l’action de déraciner ou d’extirper.
    reason: La métaphore peut désigner une exclusion, une destruction ou un arrachement collectif sans que le contexte permette d’en préciser davantage la portée.
lexical_decisions:
- source_word: ዐቅመ፡ መዋዕል
  choice: limite de temps
  rationale: L’expression désigne une borne ou une durée assignée en jours; « limite de temps » est naturel en français tout en conservant l’idée temporelle.
- source_word: ይትመሀለሉ
  choice: supplier
  rationale: Le verbe signifie implorer ou supplier. Ce choix maintient la distinction avec ያስተሰርዩ, qui exprime ensuite l’expiation.
- source_word: በእንቲአክሙ
  choice: en votre faveur
  rationale: Rend la préposition de bénéfice ou de représentation avec le suffixe de deuxième personne du pluriel.
- source_word: ያስተሰርዩ
  choice: feront l’expiation
  rationale: Le causatif exprime l’action d’expier ou de procurer l’expiation, dans un contexte sacrificiel.
- source_word: ኢይሠረዉ
  choice: ne pas être déracinés
  rationale: Le verbe renvoie à l’idée d’être arraché ou déraciné; le passif pluriel conserve la grave conséquence collective du texte.
theological_decisions:
- issue: Rapport entre supplication et expiation
  choice: Traduire le premier verbe par « supplier » et le second par « faire l’expiation »
  alternative: Employer « faire l’expiation » pour les deux actions
  rationale: Les deux verbes guèzes sont distincts. Les différencier évite de réduire la prière ou supplication à l’acte expiatoire, tout en préservant leur proximité dans le rite sanglant.
- issue: Référent de « pour cela »
  choice: Conserver un référent neutre et non explicité
  alternative: Préciser « pour la loi », « pour le peuple » ou « pour vous »
  rationale: Le pronom guèze est grammaticalement explicite mais son antécédent contextuel demeure incertain; la traduction ne doit pas résoudre silencieusement cette ambiguïté.
- issue: Conséquence finale
  choice: « ne pas être déracinés »
  alternative: « ne pas la négliger »
  rationale: Le sens d’arrachement ou de déracinement est lexicalement mieux fondé et préserve la tension covenantale du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive du texte juridique et cultuel est maintenue sans lourdeur excessive. « Le Seigneur » suit le référent divin du texte source; « matin et soir » rend idiomatiquement l’expression temporelle.
