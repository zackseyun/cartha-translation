  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
translation:
  language: fr
  text: Il énuméra les sabbats des années, comme nous le lui avions fait connaître. Dans une vision pendant son sommeil, il vit ce qui était et ce qui serait, et comment cela arriverait aux êtres humains au fil de leurs générations, jusqu’au jour du jugement. Il vit et comprit tout, écrivit son témoignage et le déposa sur la terre…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታት፡ ዓመታት
  choice: les sabbats des années
  rationale: Rend littéralement l’expression guèze et conserve sa portée calendérique propre au livre des Jubilés.
- source_word: ነገረ
  choice: compta
  rationale: Dans ce contexte de périodes calendériques, le verbe désigne le fait d’énumérer ou de faire le compte; «compta» est naturel et précis.
- source_word: በራእየ፡ ንዋሙ
  choice: Dans une vision reçue pendant son sommeil
  rationale: Expression française naturelle qui maintient à la fois les notions de vision et de sommeil.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: aux êtres humains
  rationale: Rend l’expression idiomatique «enfants des hommes» dans un français moderne et inclusif quant à l’humanité visée, sans modifier son référent.
- source_word: ዕለተ፡ ደይን
  choice: jour du jugement
  rationale: Équivalent direct et traditionnel, sans préciser davantage la nature du jugement.
- source_word: ስምዖ
  choice: son témoignage
  rationale: Conserve le sens juridique et prophétique de «témoignage» présent dans la source.
theological_decisions:
- issue: Portée de la vision d’Hénoch
  choice: «ce qui avait été et ce qui serait»
  alternative: «ce qui était et ce qui sera»
  rationale: Le français au passé de narration exprime naturellement la perspective temporelle de la vision tout en maintenant son étendue sur le passé et l’avenir.
- issue: Jour du jugement
  choice: Conserver la formule sans qualification
  alternative: «jour du jugement final»
  rationale: La source dit seulement «jour du jugement»; ajouter «final» résoudrait une question que le texte laisse implicite.
- issue: Nature du témoignage déposé sur terre
  choice: Ne pas identifier le document ni ses destinataires
  alternative: Préciser qu’il s’agit d’un livre prophétique destiné aux générations futures
  rationale: La source ne fournit pas ici ces précisions; elles relèveraient de l’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure du guèze tout en évitant les calques pesants. Les points de suspension signalent que l’extrait source transmis s’interrompt après «sur la terre».
