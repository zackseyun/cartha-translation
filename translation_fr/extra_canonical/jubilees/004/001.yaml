  text: And in the third week in the second jubilee she gave birth to Cain, and in the fourth she gave birth to Abel, and in the fifth she gave birth to her daughter Awan.
translation:
  language: fr
  text: Au cours de la troisième semaine du deuxième jubilé, elle donna naissance à Caïn ; au cours de la quatrième, elle donna naissance à Abel ; et au cours de la cinquième, elle donna naissance à sa fille Awan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le fragment guèze fourni avec cette référence appartient en réalité à la suite du récit, en Jubilés 4:3-4, où le Seigneur réprimande Caïn pour avoir tué Abel. Le texte de 4:1 rapporte les naissances de Caïn, d’Abel et d’Awan.
    reason: Signaler avec transparence le décalage entre la référence demandée et l’extrait guèze transmis.
lexical_decisions:
- source_word: « troisième semaine du deuxième jubilé » (texte attendu de Jubilés 4:1)
  choice: « Au cours de la troisième semaine du deuxième jubilé »
  rationale: Cette formulation conserve précisément le système chronologique propre au livre tout en restant naturelle en français moderne.
- source_word: Awan
  choice: Awan
  rationale: Le nom propre est translittéré sous la forme internationale courante retenue dans la couche de consultation, sans tenter de l’identifier à un autre nom.
theological_decisions:
- issue: Identification du contenu de Jubilés 4:1 malgré le décalage du témoin fourni
  choice: Retenir le récit des naissances de Caïn, Abel et Awan
  alternative: 'Traduire le fragment guèze fourni : « Et le Seigneur réprimanda Caïn à cause d’Abel, parce qu’il l’avait tué… »'
  rationale: Le fragment guèze joint est manifestement décalé et correspond à la matière de Jubilés 4:3-4. La référence demandée, la révision critique et la structure chronologique du chapitre indiquent que 4:1 rapporte les trois naissances. Ce choix corrige l’alignement sans transformer une erreur de découpage en variante théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des trois indications chronologiques est conservé ; les répétitions sont légèrement modulées par « au cours de » afin d’obtenir une phrase naturelle sans perdre la structure du texte.
