base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
translation:
  language: fr
  text: 'Et c’est pourquoi il est écrit sur les tablettes célestes : « Maudit soit celui qui frappe son prochain avec méchanceté. » Que tous ceux qui voient et entendent disent : « Qu’il en soit ainsi ! » Et que l’homme qui en a été témoin sans le signaler[a] soit maudit de la même manière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte transmis peut se lire littéralement « et l’a signalé », mais le contexte paraît exiger « sans le signaler ».
    reason: Signaler avec transparence une difficulté textuelle réelle liée à une probable omission de la négation.
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: les tablettes célestes
  rationale: Rend directement l’expression guèze désignant les tablettes du ciel, formule caractéristique du livre des Jubilés.
- source_word: ዘይዘብጥ፡ ካልአ
  choice: celui qui frappe son prochain
  rationale: « Son prochain » exprime naturellement en français la personne autre que soi visée par ካልአ, sans limiter le sens à un voisin.
- source_word: በእኩይ
  choice: avec méchanceté
  rationale: Conserve la qualification morale de l’acte sans préciser indûment une intention juridique telle que la préméditation.
- source_word: ይኩን
  choice: Qu’il en soit ainsi !
  rationale: Formule française idiomatique correspondant à l’assentiment solennel demandé aux témoins.
- source_word: ዘርእየ
  choice: qui en a été témoin
  rationale: Rend le sens littéral de « celui qui a vu » dans un français naturel adapté au contexte d’un devoir de signalement.
theological_decisions:
- issue: Présence ou absence de la négation devant « signaler »
  choice: sans le signaler
  alternative: et l’a signalé
  rationale: Le texte fourni porte ወአነገረ, « et il a signalé », mais cette leçon rendrait la sentence incohérente en maudissant celui qui dénonce le forfait. La négation ኢ paraît avoir été perdue ou altérée dans la transmission/OCR; le contexte et les témoins éditoriaux soutiennent « et ne l’a pas signalé ».
- issue: Portée de la malédiction
  choice: soit maudit de la même manière
  alternative: qu’une malédiction semblable repose sur lui
  rationale: Maintient le parallélisme explicite du texte sans développer la nature ou les effets de la malédiction.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation distingue les deux déclarations prescrites, et « en a été témoin » évite la lourdeur de « a vu cela » tout en conservant le sens.
