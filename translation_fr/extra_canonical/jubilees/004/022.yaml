  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
translation:
  language: fr
  text: Il témoigna aux Veilleurs qui avaient péché avec les filles des hommes ; car ils avaient commencé à s’unir aux filles des hommes, afin de se souiller. Et Hénoc témoigna contre eux tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  choice: les Veilleurs
  rationale: Terme traditionnel désignant les êtres célestes vigilants dans la littérature hénochique; la majuscule signale qu’il s’agit d’un groupe déterminé.
- source_word: አበሱ
  choice: avaient péché
  rationale: Rend directement l’idée de faute ou de péché exprimée par le verbe guèze.
- source_word: አዋልደ፡ ሰብእ
  choice: les filles des hommes
  rationale: Expression générique et traditionnelle correspondant littéralement au texte source.
- source_word: ይደመሩ
  choice: s’unir à elles
  rationale: Exprime l’association intime visée dans le contexte sans ajouter une précision absente du texte.
- source_word: ይርኩሱ
  choice: se souiller
  rationale: Conserve la notion de contamination ou d’impureté du texte source.
- source_word: አስምዐ
  choice: témoigna contre
  rationale: Dans ce contexte d’accusation, le verbe de témoignage appelle naturellement « contre » en français.
theological_decisions:
- issue: Nature des Veilleurs
  choice: Conserver le titre « Veilleurs » sans les identifier explicitement comme anges.
  alternative: Traduire ou expliciter par « anges veilleurs ».
  rationale: Le texte nomme le groupe mais ne donne pas ici cette identification explicite; la formulation retenue préserve la terminologie et l’ambiguïté du passage.
- issue: Nature de l’union avec les filles des hommes
  choice: Employer « s’unir à elles » sans expliciter davantage.
  alternative: Dire « avoir des relations sexuelles avec elles » ou « les épouser ».
  rationale: Le contexte implique une union transgressive, mais le texte n’en précise pas ici juridiquement ou physiologiquement la nature.
translation_notes:
  register: Français moderne, clair et digne. La répétition du témoignage d’Hénoc est conservée parce qu’elle structure le verset et souligne l’universalité de son accusation.
