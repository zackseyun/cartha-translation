  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.
translation:
  language: fr
  text: Au douzième jubilé, pendant sa septième semaine, il prit une femme, Edni, fille de Danel, elle-même fille du frère de son père. La sixième année de cette semaine, elle lui donna un fils, qu’il appela Mathusalem.
