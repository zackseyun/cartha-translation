  text: He was the first among those born on earth to learn writing, instruction, and wisdom, and to write down the signs of heaven according to the order of their months in a book, so that the children of men might know the seasons of the years according to the order of each of their months.
translation:
  language: fr
  text: Il fut le premier, parmi ceux qui étaient nés sur la terre, à apprendre l’écriture, l’instruction et la sagesse, et à consigner dans un livre les signes du ciel selon l’ordre de leurs mois, afin que les êtres humains connaissent les périodes des années selon l’ordre propre à chacun de leurs mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ፡ ወትምህርተ፡ ወጥበበ
  choice: l’écriture, l’instruction et la sagesse
  rationale: Conserve les trois notions distinctes du guèze dans une formulation française claire et parallèle.
- source_word: ተአምረ፡ ሰማይ
  choice: les signes du ciel
  rationale: Rend littéralement l’expression sans préciser indûment s’il s’agit des astres, de phénomènes célestes ou de signes calendaires.
- source_word: ጊዜ፡ ዓመታት
  choice: les périodes des années
  rationale: Préserve le sens temporel général de ጊዜ sans le réduire arbitrairement aux seules saisons climatiques.
- source_word: እጓለ፡ እመሕያው
  choice: les êtres humains
  rationale: Équivalent moderne et inclusif de l’expression traditionnelle « enfants des hommes », désignant l’humanité.
theological_decisions:
- issue: Nature des « signes du ciel »
  choice: Maintien de l’expression ouverte « signes du ciel »
  alternative: les astres du ciel / les phénomènes célestes
  rationale: Le texte associe ces signes au calendrier, mais ne les identifie pas explicitement; la traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle reflète la structure du texte source, tandis que « consigner » exprime naturellement l’acte de mettre par écrit dans un livre.
