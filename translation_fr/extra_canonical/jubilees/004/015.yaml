base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/015.yaml
  text: And he was still with the angels of God for six jubilees of years, and they showed him everything that is on earth and in the heavens, the rule of the sun, and he wrote down everything.
translation:
  language: fr
  text: Il demeura avec les anges de Dieu durant six jubilés d’années[a]. Ils lui montrèrent tout ce qui est sur la terre et dans les cieux, ainsi que la puissance du soleil, et il mit tout par écrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un jubilé correspond à une période de quarante-neuf ans; six jubilés représentent donc 294 ans.
    reason: L’unité chronologique propre au livre peut être obscure pour le lectorat moderne; la note l’explique sans remplacer le terme dans le texte.
lexical_decisions:
- source_word: ወሀሎ፡ እንከ፡ ምስለ
  choice: Il resta avec
  rationale: Rend naturellement la continuité du séjour exprimée par le verbe d’existence accompagné de « avec », dans le contexte d’Hénoch parmi les anges.
- source_word: መላእክት፡ አምላክ
  choice: les anges de Dieu
  rationale: Traduction directe du syntagme génitival, sans préciser davantage la nature de ces anges.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: pendant six jubilés d’années
  rationale: Conserve l’expression chronologique particulière du texte tout en indiquant clairement la durée en français.
- source_word: ኵሎ፡ ዘውስተ፡ ምድር፡ ወዘበሰማያት
  choice: tout ce qui est sur la terre et dans les cieux
  rationale: Respecte la différence des prépositions et le pluriel « cieux » du guèze.
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: la domination du soleil
  rationale: Le nom ሥልጣን désigne l’autorité, la puissance ou la domination. « Domination » préserve ici l’idée du pouvoir ou du régime attribué au soleil sans la réduire à son seul mouvement.
- source_word: ወጸሐፈ፡ ኵሎ
  choice: et il mit tout par écrit
  rationale: Formulation française naturelle qui conserve l’idée qu’Hénoch consigna la totalité de ce qui lui fut montré.
theological_decisions:
- issue: Nature de la « domination du soleil »
  choice: la domination du soleil
  alternative: le cours du soleil
  rationale: Le texte emploie un terme d’autorité ou de souveraineté, non le mot ordinaire pour « cours ». La traduction garde donc cette formulation cosmologique sans l’interpréter comme un simple mouvement astronomique.
- issue: Identité du sujet qui écrit
  choice: il mit tout par écrit
  alternative: Hénoch mit tout par écrit
  rationale: Le sujet est Hénoch d’après le contexte, mais le texte poursuit avec un pronom implicite. Le français conserve cette continuité sans ajouter le nom.
translation_notes:
  register: Français moderne, international et digne. Syntaxe claire, avec maintien des termes caractéristiques du livre (« jubilés d’années ») et de l’expression cosmologique potentiellement ambiguë « domination du soleil ».
