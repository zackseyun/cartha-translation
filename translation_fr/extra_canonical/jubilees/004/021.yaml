  yaml_path: translation/extra_canonical/jubilees/004/021.yaml
  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
translation:
  language: fr
  text: Mathusalem. Il demeura encore avec les anges de Dieu pendant six jubilés d’années[a]. Ils lui montrèrent tout ce qui est sur la terre et dans les cieux, ainsi que la domination du soleil, et il mit tout par écrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un jubilé compte quarante-neuf ans ; six jubilés correspondent donc à deux cent quatre-vingt-quatorze ans.
    reason: Clarifie l’unité chronologique ancienne sans remplacer l’expression conservée dans le texte.
lexical_decisions:
- source_word: ሀሎ፡ እንከ፡ ምስለ፡ መላእክት፡ አምላክ
  choice: Puis il demeura avec les anges de Dieu
  rationale: « Demeura » rend naturellement l’idée de rester ou de se trouver avec eux durant une période prolongée; « puis » représente la particule de liaison sans surcharger la phrase.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: pendant six jubilés d’années
  rationale: Conserve l’expression chronologique caractéristique et légèrement redondante du texte, plutôt que de la convertir silencieusement en nombre d’années.
- source_word: አርአይዎ
  choice: Ils lui montrèrent
  rationale: Rend le pluriel verbal dont le sujet naturel est « les anges de Dieu ».
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: le gouvernement du soleil
  rationale: « Gouvernement » garde la portée de ሥልጣን, qui peut désigner autorité, domination ou régime ordonné, sans réduire l’expression au simple mouvement astronomique.
- source_word: ወጸሐፈ፡ ኵሎ
  choice: et il mit tout par écrit
  rationale: Formulation française naturelle qui exprime explicitement l’acte de consigner la totalité de ce qui lui fut révélé.
theological_decisions:
- issue: Nature du « gouvernement du soleil »
  choice: Conserver une formulation ouverte évoquant l’ordre ou l’autorité du soleil
  alternative: « la course du soleil » ou « les lois qui régissent le soleil »
  rationale: Le terme source signifie proprement autorité ou gouvernement; une paraphrase astronomique résoudrait indûment l’ambiguïté cosmologique du passage.
- issue: Référent du pronom masculin singulier
  choice: Ne pas remplacer « il/lui » par un nom absent de la proposition
  alternative: Nommer explicitement Hénoch
  rationale: Le contexte identifie vraisemblablement Hénoch, mais le texte fourni emploie des formes pronominales; la traduction préserve cette cohésion sans ajout interprétatif.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple, tandis que « jubilés d’années » et « gouvernement du soleil » préservent les formulations propres au texte ancien. « Mathusalem » est maintenu comme fragment nominal puisqu’il figure dans la source fournie, probablement à la jonction avec la phrase précédente.
