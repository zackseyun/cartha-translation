  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: fr
  text: Durant la cinquième semaine, elle mit au monde Awan, sa fille. La première année du troisième jubilé, Caïn tua Abel, parce que l’offrande d’Abel fut agréée, mais que le sacrifice de Caïn ne le fut pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለተ
  choice: sa fille
  rationale: Le terme guèze désigne explicitement une fille; le possessif français restitue la relation exprimée dans la proposition.
- source_word: ተወክፈ
  choice: fut agréée
  rationale: Le verbe exprime l’idée d’une offrande reçue favorablement; « agréée » est naturel dans un registre biblique moderne sans préciser explicitement l’agent.
- source_word: ቍርባኖ / መሥዋዕቶ
  choice: l’offrande / le sacrifice
  rationale: La distinction lexicale du texte source est conservée plutôt que d’uniformiser les deux termes.
- source_word: ኢዮቤሌው
  choice: jubilé
  rationale: Terme chronologique propre au livre, rendu par son équivalent français établi.
theological_decisions:
- issue: Agent de l’agrément de l’offrande
  choice: 'Construction passive sans agent: « fut agréée »'
  alternative: « Dieu agréa l’offrande d’Abel »
  rationale: Le texte source emploie une forme passive et ne nomme pas explicitement Dieu; la traduction préserve cette formulation.
- issue: Identification du sacrifice non agréé
  choice: « le sacrifice de Caïn »
  alternative: « son sacrifice »
  rationale: Le source nomme explicitement Caïn, ce qui écarte l’ambiguïté du pronom en français.
translation_notes:
  register: Français international moderne, sobre et digne. « Pendant » et la ponctuation allègent l’enchaînement répétitif tout en conservant exactement les deux repères chronologiques. Le passé simple convient au récit ancien; « tandis que » marque clairement le contraste.
