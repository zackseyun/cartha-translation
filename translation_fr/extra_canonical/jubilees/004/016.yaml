  register: 'Français international moderne, narratif et digne. La chronologie du guèze est conservée littéralement : onzième jubilé, quatrième semaine, puis cinquième semaine et quatrième année. Le pronom pluriel initial demeure sans explicitation afin de préserver son lien avec le contexte antérieur.'
