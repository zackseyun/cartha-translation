  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
translation:
  language: fr
  text: Ils pratiquèrent la justice et la droiture sur la terre. Au dixième jubilé, durant la première semaine, Jared prit pour femme Baraka, fille de Rasouyal, fille de la sœur de son père, durant la quatrième année de cette semaine ; elle lui donna un fils durant la cinquième semaine, durant la quatrième année.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ
  choice: la justice et la droiture
  rationale: 'Rend les deux termes coordonnés sans les confondre : le premier désigne la justice ou le juste jugement, le second la rectitude.'
- source_word: በ፲ሥር፡ ወአሐዱ፡ ኢዮቤልዉ
  choice: Au onzième jubilé
  rationale: La formule numérique guèze exprime « dix et un », c’est-à-dire le onzième jubilé; elle ne mentionne pas ici une première semaine.
- source_word: ብእሲተ
  choice: pour femme
  rationale: Dans ce contexte matrimonial, le mot désigne une épouse; la formulation française évite une répétition lourde tout en conservant l’idée que Jared la prit comme femme.
- source_word: ወለተ፡ እኅተ፡ አቡሁ
  choice: la fille de la sœur de son père
  rationale: Suit directement la parenté donnée par le texte guèze, qui porte « sœur » et non « frère ».
- source_word: በሱባዔ፡ ፬ብዕ፡ ዘኪያቤልዉ፡ ዝንቱ
  choice: durant la quatrième semaine de ce jubilé
  rationale: Le repère temporel porte sur la quatrième semaine du jubilé, et non sur la quatrième année d’une première semaine.
