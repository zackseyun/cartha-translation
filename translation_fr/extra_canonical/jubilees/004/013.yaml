base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
translation:
  language: fr
  text: Au onzième jubilé, Yéred prit pour femme Baraka, fille de Rasouyal[a], elle-même fille du frère de son père, pendant la quatrième semaine de ce jubilé. Elle lui donna un fils pendant la cinquième semaine, la quatrième année de ce jubilé, et il l’appela Hénok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans certaines éditions anciennes, le nom Rasouyal (ራሱያል) est transcrit Rasoujal.
    reason: lexical_choice
lexical_decisions:
- source_word: ነሥአ ፡ ያሬድ ፡ ሎቱ ፡ ብእሲተ
  choice: Yéred prit pour femme
  rationale: Rend naturellement l’expression guèze signifiant littéralement que Yéred « prit pour lui une femme », sans perdre la formule matrimoniale.
- source_word: ራሱያል
  choice: Rasouyal
  rationale: Translittération française directe du nom guèze, avec « ou » pour la voyelle /u/ et « y » plutôt que le « j » de certaines éditions anciennes.
- source_word: ወለተ ፡ ራሱያል ፡ ወለተ ፡ እኍሁ ፡ ለአቡሁ
  choice: fille de Rasouyal, fille du frère de son père
  rationale: Conserve les deux appositions « fille de » du texte source et leur légère ambiguïté généalogique, au lieu d’identifier explicitement Rasouyal au frère du père de Yéred.
- source_word: ወሰመየ ፡ ስሞ ፡ ሄኖክሃ
  choice: et il l’appela Hénok
  rationale: Formulation française naturelle de l’expression sémitique « il appela son nom Hénok »; « Hénok » correspond à l’usage biblique français courant.
theological_decisions:
- issue: Rapport généalogique entre Baraka, Rasouyal et le frère du père de Yéred
  choice: 'Maintenir la double apposition : « fille de Rasouyal, fille du frère de son père »'
  alternative: « fille de Rasouyal, le frère de son père »
  rationale: L’alternative explicite davantage la généalogie, mais résout une construction que le guèze laisse formellement en apposition répétée. La traduction retient donc la tension syntaxique du texte.
translation_notes:
  register: 'Français moderne, international et digne. Les formes Yéred et Hénok suivent l’usage biblique français. La chronologie est rendue sans ajout explicatif : le texte distingue la quatrième semaine, puis la cinquième semaine et la quatrième année du jubilé.'
