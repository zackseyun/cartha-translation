base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/017.yaml
  text: …year of the jubilee, and he called his name Enoch. He was the first among the children of men born on the earth who learned writing and knowledge and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that they might know…
translation:
  language: fr
  text: … année du jubilé, et il l’appela Hénoch. Il fut le premier, parmi les êtres humains nés sur la terre, à apprendre l’écriture, le savoir et la sagesse. Il consigna dans un livre les signes du ciel selon l’ordre de leurs mois, afin qu’ils sachent…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait guèze fourni commence et se termine au milieu d’une phrase ; les points de suspension signalent ces limites.
    reason: source_fragment
lexical_decisions:
- source_word: ሄኖክ
  choice: Hénok
  rationale: Forme française traditionnelle du nom biblique Enoch/Henok, aisément reconnaissable et adaptée au registre scripturaire.
- source_word: መጽሐፈ
  choice: l’écriture
  rationale: Dans la série « écriture, savoir et sagesse », le terme désigne ici l’art d’écrire plutôt qu’un livre précis.
- source_word: ትምህርተ
  choice: le savoir
  rationale: Le nom peut évoquer l’enseignement ou la connaissance acquise; « savoir » convient naturellement à la série sans en accentuer artificiellement la dimension doctrinale.
- source_word: ጥበበ
  choice: la sagesse
  rationale: Équivalent direct qui conserve la valeur intellectuelle et pratique du terme.
- source_word: ተአምረ፡ ሰማይ
  choice: les signes du ciel
  rationale: Rend littéralement l’expression astronomique sans la réduire à des astres particuliers ni lui imposer une interprétation miraculeuse.
- source_word: ሥርዐተ፡ አውራኅሆሙ
  choice: selon l’ordre de leurs mois
  rationale: Conserve le possessif pluriel ambigu du texte guèze, dont l’antécédent est probablement « les signes du ciel ».
theological_decisions:
- issue: Portée de « le premier »
  choice: « le premier, parmi les êtres humains nés sur la terre »
  alternative: « le premier des fils des hommes qui naquirent sur la terre »
  rationale: La formulation retenue restitue la priorité attribuée à Hénok tout en employant un français actuel; elle n’ajoute aucune affirmation sur une révélation surnaturelle ou sur l’origine du savoir.
- issue: Sujet du dernier verbe pluriel
  choice: « afin qu’ils sachent »
  alternative: « afin que les êtres humains sachent »
  rationale: Le texte fourni porte un pluriel sans répéter explicitement son référent. Le pronom préserve cette ouverture, d’autant que l’extrait s’interrompt avant le complément.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe a été légèrement réorganisée pour éviter une longue accumulation de relatives, sans modifier la progression du texte. Aucun contenu provenant de versions plus longues de ce verset n’a été ajouté.
