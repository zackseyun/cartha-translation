  text: And he killed him in the field, and his blood cried out from the ground to heaven, complaining about him.
translation:
  language: fr
  text: Il le tua dans la campagne, et son sang cria de la terre jusqu’au ciel, se plaignant de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « portant une accusation contre lui ». Le terme peut exprimer une plainte ou une accusation à son sujet.'
    reason: Préserve la nuance du verbe et de la préposition sans employer une tournure française ambiguë.
lexical_decisions:
- source_word: በገዳም
  choice: dans la campagne
  rationale: Rend le lieu ouvert où le meurtre a lieu; « campagne » est naturel en français et convient au contexte, sans imposer le sens moderne de « désert ».
- source_word: ጸርኀ፡ ደሙ፡ እምድር፡ ውስተ፡ ሰማይ
  choice: son sang cria de la terre jusqu’au ciel
  rationale: Conserve la personnification du sang et le mouvement spatial explicite de la terre vers le ciel.
- source_word: ይስኪ፡ በእንተ
  choice: portant plainte contre lui
  rationale: Exprime l’idée de plainte ou d’accusation visant le meurtrier dans un français idiomatique, tout en signalant en note une autre nuance possible.
theological_decisions:
- issue: Le sang personnifié comme témoin et accusateur
  choice: Conserver « son sang cria » et « portant plainte »
  alternative: Expliciter que la victime elle-même porte plainte
  rationale: La formulation source attribue directement au sang le cri et la plainte; cette tension imagée ne doit pas être rationalisée.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche de l’image sémitique, tandis que « portant plainte contre lui » évite une tournure artificielle. Le marqueur [a] figure bien dans le texte principal.
