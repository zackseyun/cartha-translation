  revision_rationale: La révision remplace la formulation juridiquement plus restrictive « portant plainte contre lui » par « se plaignant de lui », plus naturelle et plus proche de la portée sémantique du guèze. La note conserve explicitement l’alternative accusatoire et la possibilité d’un rapport plus général au meurtrier.
