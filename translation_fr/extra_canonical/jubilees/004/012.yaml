    reason: lexical_alternative
lexical_decisions:
- source_word: ጸሐፈ፡ ስምዐ
  choice: mettre un témoignage par écrit
  rationale: Rend distinctement le verbe « écrire » et le nom pouvant désigner un témoignage, une attestation ou un document, tout en restant naturel en français.
- source_word: አስምዐ
  choice: rendit témoignage
  rationale: Conserve le lien lexical avec « témoignage » et le rôle d’Hénoch comme transmetteur de ce qu’il a consigné.
- source_word: ለደቂቀ፡ እጓለ፡ እመሕያው
  choice: aux êtres humains
  rationale: Équivalent français courant de l’expression sémitisante « aux fils des hommes », sans restriction de sexe.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: les semaines des jubilés
  rationale: Préserve la terminologie chronologique propre au livre des Jubilés.
- source_word: አውራኅ፡ ሰርዐ
  choice: mit les mois en ordre
  rationale: Reproduit le sens concret d’ordonner ou d’organiser les mois, sans préciser davantage le système calendaire.
