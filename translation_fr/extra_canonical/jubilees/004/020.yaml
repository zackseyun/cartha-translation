  yaml_path: translation/extra_canonical/jubilees/004/020.yaml
  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: fr
  text: Au douzième jubilé, pendant sa septième semaine, il prit pour femme Edni, fille de Daniel, elle-même fille de la sœur de son père.[a] La sixième année de cette semaine, elle lui donna un fils, et il lui donna le nom de…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze fourni dit littéralement : « fille de Daniel, fille de la sœur de son père ».'
    reason: Préciser la construction généalogique inhabituelle tout en suivant exactement la source fournie.
  - marker: b
    text: L’extrait guèze fourni s’arrête après « il appela son nom » et ne donne pas le nom de l’enfant.
    reason: Expliquer la phrase suspendue sans suppléer un nom qui n’apparaît pas dans l’extrait.
lexical_decisions:
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: il prit pour femme
  rationale: Rend naturellement l’expression guèze signifiant littéralement qu’il « prit pour lui une femme », sans alourdir le français.
- source_word: በሳብዕ፡ ሱባዔሁ
  choice: pendant sa septième semaine
  rationale: Le possessif renvoie au douzième jubilé; « pendant » exprime ici la localisation chronologique.
- source_word: ወለተ፡ ዳንኤል፡ ወለተ፡ እኅተ፡ አቡሁ
  choice: fille de Daniel, elle-même fille de la sœur de son père
  rationale: Préserve la double filiation et surtout la lecture explicite « sœur » du texte guèze fourni, sans la remplacer par la variante « frère » connue dans certaines traductions.
- source_word: ወጸውዐ፡ ስሞ፡
  choice: et il l’appela…
  rationale: Le texte source fourni s’interrompt après « il appela son nom »; la formulation française et les points de suspension signalent honnêtement que le nom n’est pas présent dans l’extrait.
theological_decisions:
- issue: Identification du fils à la fin du verset
  choice: Ne pas ajouter son nom
  alternative: Ajouter « Mathusalem » d’après la suite ou la tradition textuelle
  rationale: Le texte guèze transmis dans la demande s’arrête avant le nom. L’ajouter résoudrait silencieusement une lacune de l’extrait au lieu de traduire les données effectivement fournies.
- issue: Lien de parenté d’Edni
  choice: Conserver « sœur de son père »
  alternative: Lire « frère de son père » comme dans certaines éditions ou traductions
  rationale: Le mot guèze fourni est እኅተ, « sœur ». La traduction suit donc directement la source indiquée et laisse subsister la généalogie telle qu’elle se présente.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe chronologique reste proche du guèze tout en étant idiomatique. Le fragment initial « tous les enfants des hommes et leurs générations » semble appartenir à la phrase ou au verset précédent et n’est pas intégré à JUB.4.20, conformément à la segmentation attestée par la couche de consultation anglaise.
