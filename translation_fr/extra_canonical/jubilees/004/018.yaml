  text: And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.
translation:
  language: fr
  text: Il fut le premier à écrire un témoignage. Il témoigna auprès des enfants des hommes, parmi les générations de la terre. Il relata les semaines des jubilés, fit connaître les jours des années et mit les mois en ordre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዐ፡ ወአስምዐ
  choice: écrire un témoignage… témoigna
  rationale: Conserve le jeu lexical autour du témoignage et la succession entre consignation écrite et attestation.
- source_word: ለደቂቀ፡ እጓለ፡ እመሕያው
  choice: auprès des enfants des hommes
  rationale: Rend l’expression anthropologique traditionnelle de façon intelligible sans la réduire simplement à « l’humanité ».
- source_word: ውስተ፡ ትዝምደ፡ ምድር
  choice: au fil des générations de la terre
  rationale: Préserve les notions de générations et de terre tout en produisant une tournure française naturelle.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: les semaines des jubilés
  rationale: Conserve la terminologie chronologique propre au livre des Jubilés.
- source_word: ነገረ
  choice: relata
  rationale: Exprime l’idée de raconter ou d’exposer, dans un registre narratif digne.
- source_word: መዋዕለ፡ ዓመታት፡ አይድዐ
  choice: fit connaître les jours des années
  rationale: Suit de près les éléments lexicaux du guèze plutôt que de normaliser l’expression en « calendrier ».
- source_word: አውራኅ፡ ሰርዐ
  choice: mit les mois en ordre
  rationale: Reproduit l’action d’ordonner ou d’organiser les mois sans explicitation doctrinale.
theological_decisions:
- issue: Identité du sujet implicite
  choice: Conserver le pronom « Il »
  alternative: Nommer explicitement Hénok
  rationale: Le verset dépend du contexte précédent pour identifier le sujet; ajouter le nom résoudrait une donnée que le texte fourni laisse implicite.
- issue: Nature du témoignage
  choice: Employer « un témoignage » sans complément explicatif
  alternative: « le témoignage céleste » ou « un livre de témoignage »
  rationale: Le texte ne précise ici ni provenance céleste ni titre d’ouvrage; aucune interprétation confessionnelle n’est ajoutée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure par phrases courtes clarifie la série d’activités scribales tout en conservant les termes chronologiques distinctifs et le sujet implicite du texte source.
