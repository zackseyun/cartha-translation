  text: that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks[7] of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “the Lord has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the Lord on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father's brother's daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the Lord descended to the earth, those who are called the Watchers, so that they might instruct the children of men,
translation:
  language: fr
  text: 'ce qui se produit dans le ciel et sur la terre, dans la lumière et dans les ténèbres, et partout. Adam et sa femme portèrent le deuil d’Abel pendant quatre semaines d’années[a]. La quatrième année de la cinquième semaine, ils retrouvèrent la joie. Adam connut de nouveau sa femme, et elle lui donna un fils. Il l’appela Seth, car il dit : « Le Seigneur a fait surgir pour moi une autre descendance sur la terre à la place d’Abel, puisque Caïn l’a tué. » Durant la sixième semaine, Adam eut une fille, Azoura. Caïn prit pour femme sa sœur Awan, et elle lui donna Hénok à la fin du quatrième jubilé. La première année de la première semaine du cinquième jubilé, on construisit des maisons sur la terre. Caïn bâtit une ville et lui donna le nom de son fils Hénok. Adam connut Ève, sa femme, et elle lui donna encore neuf fils. Durant la cinquième semaine du cinquième jubilé, Seth prit pour femme sa sœur Azoura et, la quatrième année, elle lui donna Énos. Celui-ci fut le premier à invoquer le nom
    du Seigneur sur la terre. Durant le septième jubilé, au cours de la troisième semaine, Énos prit pour femme sa sœur Noam. La troisième année de la cinquième semaine, elle lui donna un fils, qu’il appela Kénan. À la fin du huitième jubilé, Kénan prit pour femme sa sœur Moualéleth. Durant le neuvième jubilé, la troisième année de la première semaine, elle lui donna un fils, qu’ils appelèrent Mahalalel. Durant la deuxième semaine du dixième jubilé, Mahalalel prit pour femme Dina, fille de Barakiel, lui-même fils de la sœur de son père. La sixième année de la troisième semaine, elle lui donna un fils, qu’ils appelèrent Yéred. En effet, de son temps, les anges du Seigneur descendirent sur la terre, ceux que l’on appelle les Veilleurs, afin d’instruire les êtres humains,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une « semaine d’années » est une période de sept ans. Le livre organise sa chronologie en semaines d’années et en jubilés.
    reason: Note chronologique nécessaire pour rendre intelligible le système propre au livre des Jubilés.
lexical_decisions:
- source_word: ዘይከውን
  choice: ce qui se produit
  rationale: Rend le verbe « être, arriver, se produire » sans lui ajouter l’idée morale de fautes « commises », absente de la forme guèze citée.
- source_word: ሱባዔ፡ ዓመት
  choice: semaines d’années
  rationale: Exprime explicitement l’unité chronologique de sept années tout en conservant le vocabulaire structurant du livre.
- source_word: አእመራ
  choice: connut
  rationale: Conserve l’euphémisme biblique indiquant l’union conjugale, dans un registre digne et immédiatement reconnaissable.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Le terme guèze est un titre divin; « le Seigneur » évite de l’identifier sans fondement au nom propre YHWH.
- source_word: ትጉሃነ
  choice: les Veilleurs
  rationale: Terme traditionnel et intelligible pour le nom donné à ce groupe angélique, avec une majuscule signalant son emploi comme désignation.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: les êtres humains
  rationale: Rend naturellement l’expression anthropologique « enfants des hommes » en français moderne, sans restriction de sexe.
theological_decisions:
- issue: Action attribuée au Seigneur dans la parole d’Adam
  choice: « a fait surgir pour moi une autre descendance »
  alternative: « m’a suscité une autre semence »
  rationale: La formulation retenue conserve l’initiative divine et la notion de continuité familiale, tout en restant naturelle en français et sans préciser davantage le mode de l’action.
- issue: Invocation du nom divin par Énos
  choice: « invoquer le nom du Seigneur »
  alternative: « appeler le nom du Seigneur »
  rationale: Le verbe peut littéralement évoquer le fait d’appeler ou de proclamer; « invoquer » rend l’usage cultuel probable sans introduire le nom Yahweh, absent du texte guèze fourni.
- issue: But de la descente des Veilleurs
  choice: « afin d’instruire les êtres humains »
  alternative: « pour enseigner aux enfants des hommes »
  rationale: Le but pédagogique positif est maintenu tel qu’il apparaît à ce point de la phrase, sans l’harmoniser avec des traditions ultérieures sur la faute des Veilleurs.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions chronologiques sont conservées, mais la syntaxe est légèrement segmentée pour la lisibilité. Les noms propres suivent des formes françaises transparentes; « Seigneur » traduit le titre divin du guèze sans importer le nom YHWH. Le texte commence et se termine par une proposition incomplète parce que l’extrait source fourni chevauche manifestement les limites de la phrase.
