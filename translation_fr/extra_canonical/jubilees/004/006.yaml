lexical_decisions:
- source_word: ወበእንተዝ
  choice: Et c’est pourquoi
  rationale: Rend naturellement le lien causal « et pour cette raison ».
- source_word: ናየድዕ
  choice: nous déclarons
  rationale: Le verbe exprime ici l’idée de faire connaître ou déclarer; ce choix suit le sens contextuel sans préciser indûment « confesser ».
- source_word: መጻእነ ቅድመ
  choice: lorsque nous nous présentons devant
  rationale: Rend littéralement l’idée de venir devant, avec une formulation française idiomatique convenant à une comparution devant Dieu.
- source_word: እግዚአብሔር አምላክነ
  choice: le Seigneur notre Dieu
  rationale: Le terme source est un titre divin; « Seigneur » évite de l’identifier à tort au nom divin YHWH.
- source_word: ኵሎ ኀጢአተ
  choice: tous les péchés
  rationale: Correspond directement au syntagme source et conserve le caractère inachevé du fragment.
theological_decisions:
- issue: Nature de l’acte exprimé par ናየድዕ
  choice: nous déclarons
  alternative: nous confessons
  rationale: « Déclarons » préserve l’étendue sémantique du verbe et n’introduit pas explicitement une pratique confessionnelle que le fragment seul ne suffit pas à établir.
- issue: Désignation divine
  choice: le Seigneur notre Dieu
  alternative: l’Éternel notre Dieu
  rationale: La source emploie un titre, non une transcription certaine du nom divin; « Seigneur » respecte cette distinction.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure volontairement suspendue à la fin, puisque le texte fourni est un fragment qui se termine par « tous les péchés ».
