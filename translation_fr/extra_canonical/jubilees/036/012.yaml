  yaml_path: translation/extra_canonical/jubilees/036/012.yaml
  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
translation:
  language: fr
  text: Ce jour-là, il partagea entre eux tous les biens qu’il possédait. Il donna la plus grande part à l’homme qui était né le premier, ainsi que la tour[a], tout ce qui l’entourait et tout ce qu’Abraham avait acquis au Puits du Serment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « tour » pourrait désigner un élément particulier d’un domaine ou d’un bien-fonds. La liste des biens est concise, et le texte sous-jacent est difficile à interpréter avec certitude.
    reason: cultural_note
lexical_decisions:
- source_word: ጥሪተ
  choice: biens
  rationale: Le terme désigne les possessions ou les richesses; « biens » exprime clairement le patrimoine concerné sans alourdir la phrase.
- source_word: ዕበየ
  choice: la plus grande part
  rationale: Dans le contexte d’un partage, le substantif indique une part supérieure aux autres.
- source_word: ለብእሲ፡ ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: à l’homme qui était né le premier
  rationale: Cette formulation conserve le nom explicite « homme » et rend littéralement l’antériorité de la naissance sans imposer le terme juridique « premier-né ».
- source_word: ማኅፈደ
  choice: la tour
  rationale: Le sens traditionnel retenu est « tour », mais le référent précis reste incertain dans cette liste patrimoniale; cette difficulté est signalée en note.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Puits du Serment
  rationale: Traduction du toponyme composé, correspondant au sens traditionnel de Beer-Shéba, tout en conservant sa forme descriptive.
theological_decisions:
- issue: Statut de l’homme né le premier
  choice: « l’homme qui était né le premier »
  alternative: « le premier-né »
  rationale: Le texte décrit l’ordre de naissance sans employer ici un titre successoral français susceptible d’ajouter une portée juridique ou théologique.
- issue: Identification du lieu
  choice: « Puits du Serment »
  alternative: « Beer-Shéba »
  rationale: La traduction du sens du toponyme suit directement le texte guèze et évite d’effacer son caractère explicatif.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase est divisée en deux pour améliorer la lisibilité; « ainsi que » précise naturellement que la tour et les biens suivants appartiennent à la part la plus grande, sans résoudre davantage l’ellipse du texte source.
