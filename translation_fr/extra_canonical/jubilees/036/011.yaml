  yaml_path: translation/extra_canonical/jubilees/036/011.yaml
  text: I declare and testify to you, my sons, according to the judgment that will come upon the man who desires to do evil against his brother.
translation:
  language: fr
  text: Je vous le déclare et vous l’atteste[a], mes fils, selon le jugement qui viendra sur l’homme qui désire faire du mal à son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous le fais entendre ».'
    reason: Le verbe guèze, causatif de « entendre », peut exprimer le fait de faire entendre ou, dans ce cadre solennel, d’attester.
lexical_decisions:
- source_word: አነግር፡ ወአስምዕ
  choice: Je vous le déclare et vous l’atteste
  rationale: 'Conserve les deux verbes coordonnés : le premier exprime l’annonce ou la déclaration, tandis que le causatif de « entendre » peut, dans ce contexte solennel, prendre la valeur de faire entendre avec force ou d’attester.'
- source_word: በከመ፡ ኵነኔ
  choice: selon le jugement
  rationale: Rend explicitement la construction prépositionnelle et évite de transformer « le jugement » en simple complément direct des verbes précédents.
- source_word: ዘይፈቅድ፡ ይግበር፡ ሕሡመ
  choice: qui désire faire du mal
  rationale: Rend directement le désir suivi de l’action mauvaise, sans réduire le mal à un simple dommage matériel.
- source_word: ላዕለ፡ እኁሁ
  choice: à son frère
  rationale: Formulation française naturelle pour une action mauvaise dirigée contre un frère.
theological_decisions:
- issue: Portée du jugement annoncé
  choice: le jugement qui viendra sur l’homme
  alternative: le jugement prononcé contre l’homme
  rationale: La formulation retenue préserve l’image source d’un jugement qui vient sur quelqu’un, sans préciser son origine ni transformer l’annonce en verdict déjà prononcé.
translation_notes:
  register: Français moderne, solennel et accessible. La syntaxe conserve l’expression inhabituelle « selon le jugement » parce qu’elle est explicitement présente dans le texte guèze, tout en employant des tournures naturelles pour le reste du verset.
