  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
translation:
  language: fr
  text: Car, depuis la mort de Rachel, sa sœur, il l’aimait beaucoup, parce qu’elle était parfaite et droite dans toute sa conduite et qu’elle honorait Jacob. Pendant tous les jours qu’elle vécut avec lui, il n’entendit de sa bouche aucune parole dure, car il y avait en elle douceur, paix, droiture et honneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጽምት
  choice: irréprochable
  rationale: Le terme féminin exprime l’intégrité ou l’accomplissement moral; « irréprochable » est naturel en français et évite l’idée moderne d’une perfection absolue.
- source_word: ሬትዕት / ርትዕ
  choice: droite / droiture
  rationale: Conserve la répétition entre la qualité attribuée à Léa et la vertu dite présente en elle.
- source_word: ቃለ፡ ድሩከ
  choice: aucune parole dure
  rationale: Rend directement l’expression désignant une parole rude ou pénible.
- source_word: የውህት፡ ወሰላመ፡ ወርትዕ፡ ወክብራ
  choice: douceur, paix, droiture et dignité
  rationale: Maintient la série de noms abstraits du guèze et la construction « en elle ».
- source_word: ወታከብሮ፡ ለያዕቆብ
  choice: elle honorait Jacob
  rationale: Rend simplement et formellement le verbe causatif exprimant l’honneur accordé à Jacob.
theological_decisions:
- issue: Portée de la perfection morale de Léa
  choice: irréprochable
  alternative: parfaite
  rationale: « Irréprochable » préserve l’éloge moral sans imposer une affirmation théologique de perfection absolue.
- issue: Valeur de ክብር dans la liste finale
  choice: dignité
  alternative: honneur
  rationale: « Dignité » désigne naturellement une qualité intérieure présente en elle; la note conserve la traduction plus littérale « honneur ».
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du guèze tout en évitant une lourdeur excessive; les noms abstraits de la proposition finale sont préservés.
