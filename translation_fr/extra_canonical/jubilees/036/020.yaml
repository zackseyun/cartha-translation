  yaml_path: translation/extra_canonical/jubilees/036/020.yaml
  text: But Jacob dwelt on Mount Hebron, in the tower of the land of the sojourning of Abraham his father, and he worshiped the LORD with all his heart and according to the commandments as they were revealed,
translation:
  language: fr
  text: Mais Jacob demeura sur le mont Hébron, dans la tour du pays où Abraham, son père, avait séjourné[a]. Il adora le Seigneur de tout son cœur et selon les commandements tels qu’ils avaient été révélés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la tour du pays du séjour d’Abraham, son père ».'
    reason: La chaîne génitivale guèze est compacte et peut se rendre plus littéralement, au prix d’un français moins naturel.
lexical_decisions:
- source_word: ኀደረ
  choice: demeura
  rationale: Rend naturellement l’idée de résider ou habiter, dans un registre narratif digne.
- source_word: ውስተ፡ ደብረ፡ ኬብሮን
  choice: sur le mont Hébron
  rationale: La préposition française « sur » convient à une localisation montagneuse; le toponyme est conservé sous sa forme française usuelle.
- source_word: ውስተ፡ ማኅደድ፡ ዘምድረ፡ ፍልሰተ፡ አቡሁ፡ አብርሃም
  choice: dans la tour du pays où Abraham, son père, avait séjourné
  rationale: Conserve les éléments « tour », « pays » et « séjour » du guèze tout en exprimant leurs rapports dans un français intelligible; l’antériorité du séjour d’Abraham est marquée par le plus-que-parfait.
- source_word: ወአምላከ፡ ለእግዚአብሔር
  choice: Il adora le Seigneur
  rationale: Rend le verbe de culte par « adorer » et le titre divin par l’usage français établi « le Seigneur ».
- source_word: በኵሉ፡ ልቡ
  choice: de tout son cœur
  rationale: Équivalent idiomatique direct et courant.
- source_word: ትእዛዛት
  choice: commandements
  rationale: Le pluriel « commandements » correspond au terme source et convient au registre religieux du passage.
- source_word: ዘያስተርኢ
  choice: tels qu’ils avaient été révélés
  rationale: Exprime la manifestation ou révélation des commandements sans préciser indûment l’agent; le plus-que-parfait situe cette révélation avant l’observance de Jacob.
theological_decisions:
- issue: Rendu du nom ou titre divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « Le Seigneur » est le rendu français traditionnel et interconfessionnel qui évite d’identifier sans preuve ce terme guèze à une vocalisation particulière du tétragramme.
- issue: Agent de la révélation des commandements
  choice: 'forme passive sans agent : « avaient été révélés »'
  alternative: « Dieu les lui avait révélés »
  rationale: Le texte ne nomme pas explicitement l’agent ni le destinataire dans cette proposition; la formulation retenue préserve cette indétermination.
translation_notes:
  register: Français international moderne, narratif et digne. La longue phrase source est divisée en deux pour la lisibilité, sans modifier les rapports logiques. Le marqueur [a] figure immédiatement après le segment concerné.
