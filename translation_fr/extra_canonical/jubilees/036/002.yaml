  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: fr
  text: Enterrez-moi près d’Abraham, mon père, dans la caverne double située dans le champ d’Éfron le Hittite, qu’Abraham a acquise pour en faire un lieu de sépulture. Là, dans le tombeau que j’ai creusé pour moi-même, enterrez-moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅብሩኒ
  choice: Enterrez-moi
  rationale: Rend directement l’impératif avec suffixe de première personne, répété au début et à la fin du verset.
- source_word: ቅሩበ፡ አብርሃም፡ አቡየ
  choice: près d’Abraham, mon père
  rationale: Conserve la proximité spatiale et la relation paternelle explicites dans le texte.
- source_word: ባዐት፡ ዘካዕበት
  choice: la caverne double
  rationale: Traduction formelle de l’expression désignant la caverne double, sans la remplacer par le nom traditionnel « Macpéla », absent ici.
- source_word: ኤፍሮን፡ ኬጥያዊ
  choice: Éfron le Hittite
  rationale: Forme française courante du nom propre et de l’ethnonyme biblique.
- source_word: ዘአጥረየ፡ አብርሃም
  choice: qu’Abraham a acquise
  rationale: Exprime l’acquisition par Abraham; l’accord féminin rattache naturellement le relatif à la caverne dans la syntaxe française.
- source_word: ለዝኅረ፡ መቃብር
  choice: pour en faire un lieu de sépulture
  rationale: Rend la finalité funéraire de l’acquisition dans un français naturel et digne.
- source_word: ዘከረይኩ፡ ለርእስየ
  choice: que j’ai creusé pour moi-même
  rationale: Préserve l’action concrète de creuser et l’insistance réfléchie du texte source.
