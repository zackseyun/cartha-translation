  text: And my heart has rejoiced concerning the birthright, that you did not do violence concerning it. May the LORD bless you
translation:
  language: fr
  text: Et mon cœur s’est réjoui au sujet du droit d’aînesse, parce que tu n’as pas usé de violence à son sujet.[a] Que le Seigneur te bénisse ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que tu n’as commis aucune violence à cause de lui ».'
    reason: La relation exprimée par la préposition peut se comprendre comme « à son sujet » ou « à cause de lui ».
  - marker: b
    text: 'Ou, plus littéralement et sans complément exprimé : « Que le Seigneur bénisse ! »'
    reason: La formulation source est brève ; le destinataire peut être compris grâce au contexte direct.
lexical_decisions:
- source_word: ልህቃን
  choice: droit d’aînesse
  rationale: Dans ce contexte, le terme désigne le statut et les prérogatives du premier-né ; « droit d’aînesse » est l’expression française naturelle et précise.
- source_word: ፁገ
  choice: violence
  rationale: Le choix conserve la force du terme source sans préciser indûment la forme de la violence.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Rendu français traditionnel et intelligible du titre divin présent dans le texte, sans ajouter « Très-Haut », absent de la source.
theological_decisions:
- issue: Sujet de l’action négative liée au droit d’aînesse
  choice: « tu n’as pas usé de violence »
  alternative: « aucune violence n’a été commise »
  rationale: La forme verbale est à la deuxième personne du masculin singulier et présente l’interlocuteur comme sujet actif ; la traduction ne la transforme donc pas en passif.
- issue: Destinataire de la bénédiction finale
  choice: « Que le Seigneur te bénisse »
  alternative: « Que le Seigneur bénisse »
  rationale: Le contexte d’adresse directe et la valeur probable de la forme verbale soutiennent l’objet « te », tout en signalant en note la formulation plus abrupte possible.
translation_notes:
  register: Français moderne, digne et accessible. « S’est réjoui » rend naturellement l’état du cœur ; « usé de violence » préserve le caractère actif de la deuxième personne. La finale garde la forme d’une bénédiction adressée directement à l’interlocuteur.
