  text: And he remembered all her deeds that she had done in her life, and he mourned for her greatly, because he loved her with all his heart and with all his soul.
translation:
  language: fr
  text: Il se souvint de tout ce qu’elle avait fait au cours de sa vie, et il la pleura beaucoup, car il l’aimait de tout son cœur et de toute son âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይዜከር
  choice: Il se souvint
  rationale: Rend directement le verbe de mémoire au récit passé, dans un français naturel et digne.
- source_word: ኵሎ ምግባራቲሃ ዘገብረት
  choice: de tout ce qu’elle avait accompli
  rationale: Exprime l’ensemble de ses actes; « accompli » convient mieux au registre narratif que le littéral « fait ses œuvres ».
- source_word: በሕይወታ
  choice: durant sa vie
  rationale: Restitue la circonstance temporelle sans ambiguïté.
- source_word: ወይላሕዋ ጥቀ
  choice: et il la pleura profondément
  rationale: Le verbe exprime le deuil ou les lamentations pour elle, et ጥቀ intensifie fortement l’action.
- source_word: ያፈቅራ
  choice: il l’aimait
  rationale: Rend simplement et fidèlement l’affection exprimée par le verbe.
- source_word: በኵሉ ልቡ ወበኵሉ ነፍሱ
  choice: de tout son cœur et de toute son âme
  rationale: Conserve le parallélisme anthropologique et la formulation solennelle du texte source.
