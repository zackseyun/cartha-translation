base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/009.yaml
  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
translation:
  language: fr
  text: Mais si l’un de vous projette de faire du mal à son frère, sachez dès maintenant que quiconque projette de faire du mal à son frère tombera entre ses mains[a] ; il sera retranché du pays des vivants, et sa descendance disparaîtra de dessous le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Probablement entre les mains de son frère ; littéralement : dans sa main.'
    reason: Le possessif guèze ne désigne pas explicitement son référent ; le contexte suggère le frère contre lequel le mal est projeté.
lexical_decisions:
- source_word: ዘኀሠሠ / ዘየኀሥሥ
  choice: projette de faire
  rationale: Le verbe exprime ici la recherche ou la préméditation d’un mal dirigé contre le frère ; cette tournure est naturelle en français et conserve l’idée d’intention.
- source_word: እኩየ
  choice: du mal
  rationale: Rend simplement et directement le substantif « mal », sans préciser indûment sa forme.
- source_word: ውስተ፡ እዴሁ፡ ይወድቅ
  choice: tombera entre ses mains
  rationale: Expression française idiomatique correspondant à « tomber dans sa main », avec le pronom référentiellement ambigu conservé et explicité en note.
- source_word: ይሤር፡ እምድረ፡ ሕያዋን
  choice: il sera retranché du pays des vivants
  rationale: Conserve l’image solennelle et traditionnelle de l’exclusion du domaine des vivants.
- source_word: ወዘርኡኒ፡ ይትሐጐል
  choice: et sa descendance disparaîtra
  rationale: « Descendance » rend le sens collectif de « semence » en français actuel ; « disparaîtra » traduit l’idée de perte ou d’anéantissement sans ajouter de mécanisme.
theological_decisions:
- issue: Référent du possessif dans « entre ses mains »
  choice: Maintenir « ses » dans le texte et signaler en note la lecture contextuelle « les mains de son frère »
  alternative: « tombera entre les mains de son frère » ou « tombera par sa propre main »
  rationale: La morphologie dit littéralement « sa main » sans identifier explicitement le référent. Le contexte favorise le frère visé, mais le texte principal ne doit pas effacer l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe répétitive de l’avertissement est maintenue, ainsi que les images « pays des vivants » et « de dessous le ciel ».
