  yaml_path: translation/extra_canonical/jubilees/036/007.yaml
  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
translation:
  language: fr
  text: Et maintenant, je vous fais prêter un grand serment — car il n’y a pas de serment plus grand que celui-ci — par le nom glorieux, honorable, grand, magnifique, merveilleux et puissant de celui qui a fait les cieux, la terre et toutes choses ensemble[a], afin que vous soyez de ceux qui le craignent et qui l’adorent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la création ».
    reason: La tournure guèze signifie littéralement « toutes choses ensemble » et peut désigner collectivement l’ensemble de la création.
lexical_decisions:
- source_word: አምሕለክሙ፡ በመሐላ፡ ዐቢይ
  choice: je vous fais prêter un grand serment
  rationale: Rend la construction causative et l’idée d’un serment solennel dans un français naturel.
- source_word: ስም፡ ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል
  choice: le nom glorieux, honorable, grand, magnifique, merveilleux et puissant
  rationale: Conserve l’accumulation solennelle des six qualificatifs sans les fondre en une formule doctrinale.
- source_word: ወኵሎ፡ ኅቡረ
  choice: et toutes choses ensemble
  rationale: Reproduit la valeur collective de ኅቡረ plutôt que de la remplacer silencieusement par la paraphrase « toute la création ».
- source_word: ታመልከዎ
  choice: l’adorent
  rationale: Exprime clairement l’acte de rendre un culte, tout en restant idiomatique en français courant.
theological_decisions:
- issue: Valeur de la proposition introduite par ከመ
  choice: afin que vous soyez
  alternative: pour que vous deveniez / de sorte que vous soyez
  rationale: « Afin que » conserve la nuance finale la plus probable sans imposer l’idée plus forte d’une transformation exprimée par « deveniez ».
- issue: Rapport entre crainte et adoration
  choice: de ceux qui le craignent et qui l’adorent
  alternative: de ceux qui le révèrent et lui rendent un culte
  rationale: La formulation garde distincts les deux verbes du texte source et évite de réduire la crainte à la seule révérence.
translation_notes:
  register: Français international moderne, solennel mais accessible. La longue série d’adjectifs et la structure du serment sont maintenues pour préserver le rythme emphatique du texte source.
