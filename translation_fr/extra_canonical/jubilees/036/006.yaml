base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/006.yaml
  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
translation:
  language: fr
  text: Souvenez-vous, mes fils, du Seigneur, le Dieu d’Abraham, votre père, et de la manière dont, moi aussi, je l’ai adoréa et servi dans la justice et dans la joie, afin qu’il vous multiplie, rende votre descendance aussi nombreuse que les étoiles du ciel et vous plante dans la terre comme une plante de justice qui ne sera pas déracinée au fil de toutes les générations, pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከርዎ
  choice: Souvenez-vous de
  rationale: L’impératif pluriel appelle les fils à garder Dieu présent à leur mémoire; la construction française exige «de».
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Rendu français traditionnel et naturel du titre divin guèze, sans imposer ici une vocalisation du nom propre.
- source_word: አምላክየ
  choice: je l’ai adoré
  rationale: Le texte transmis paraît corrompu («mon Dieu»); le contexte et la correction textuelle reconnue አምለክዎ donnent un verbe parallèle à «servi».
- source_word: ተቀነዩኩ፡ ሎቱ
  choice: je l’ai… servi
  rationale: Exprime directement le service rendu à Dieu, en parallèle avec l’adoration.
- source_word: በጽድቅ፡ ወበፍሥሓ
  choice: dans la justice et dans la joie
  rationale: Conserve les deux qualités du service, avec leur parallélisme.
- source_word: ዘርአክሙ
  choice: votre descendance
  rationale: Équivalent collectif naturel de «semence» dans un contexte généalogique.
- source_word: ተክለ፡ ጽድቅ
  choice: une plante de justice
  rationale: Préserve l’image végétale et son complément abstrait sans l’interpréter davantage.
- source_word: ዘኢይሤረዉ
  choice: qui ne sera jamais déracinée
  rationale: Rend l’idée d’un arrachement impossible ou non réalisé; «jamais» convient à la portée temporelle qui suit.
theological_decisions:
- issue: Sujet et finalité de la multiplication
  choice: «afin qu’il vous multiplie» renvoie à Dieu
  alternative: Comprendre la proposition comme une simple conséquence du comportement d’Isaac
  rationale: La syntaxe et le contexte de bénédiction font de Dieu l’agent de la multiplication, tout en conservant la relation finale exprimée par «afin que».
- issue: Correction du segment አምላክየ
  choice: Adopter le sens verbal «je l’ai adoré»
  alternative: Traduire littéralement le texte transmis par «mon Dieu»
  rationale: La leçon littérale produit une construction incohérente; la correction verbale s’accorde avec le parallélisme «adoré et servi» et avec l’histoire textuelle signalée.
- issue: Durée de l’enracinement
  choice: «de génération en génération et pour toujours»
  alternative: «pour toutes les générations, éternellement»
  rationale: La formulation française garde conjointement la succession des générations et l’horizon perpétuel du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase exhortative et les images bibliques de la descendance étoilée et de la plante de justice sont conservées, avec une syntaxe française fluide.
