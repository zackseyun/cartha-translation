revisions:
- from: 'Au jour du bouleversement, de la malédiction, de la fureur et de la colère, il le consumera dans un feu ardent et dévorant : comme il a brûlé Sodome, ainsi il brûlera son pays, sa ville et tout ce qui lui appartient. Cet homme sera effacé du livre de la discipline des fils des hommes[a] et il ne montera pas dans le livre de vie, mais il sera compté parmi ceux qui sont voués à la destruction. Il passera sous la malédiction éternelle, afin que, tous les jours, leur jugement soit renouvelé[b] par l’exécration, la malédiction, la colère, le tourment, la fureur, les fléaux et une maladie éternelle.[c]'
  to: Au jour du bouleversement, de la malédiction, de la fureur et de la colère, et avec un feu brûlant et dévorant, comme il a brûlé Sodome, ainsi il brûlera son pays, sa ville et tout ce qui lui appartient. Cet homme sera effacé du livre de la discipline des fils des hommes[a] et il ne montera pas dans le livre de vie, mais dans ce qui est voué à la destruction. Il passera sous la malédiction éternelle, afin que, tous les jours, leur jugement soit renouvelé[b] par l’exécration, la malédiction, la colère, le tourment, la fureur, les fléaux et une maladie éternelle[c].
