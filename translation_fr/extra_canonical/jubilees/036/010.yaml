  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
translation:
  language: fr
  text: Au jour du bouleversement, de la malédiction, de la fureur et de la colère, et avec un feu brûlant et dévorant, comme il a brûlé Sodome, ainsi il brûlera son pays, sa ville et tout ce qui lui appartient. Cet homme sera effacé du livre de la discipline des fils des hommes[a] et il ne montera pas dans le livre de vie, mais dans ce qui est voué à la destruction. Il passera sous la malédiction éternelle, afin que, tous les jours, leur jugement soit renouvelé[b] par l’exécration, la malédiction, la colère, le tourment, la fureur, les fléaux et une maladie éternelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « livre de la discipline des fils des hommes » est textuellement et sémantiquement difficile. Le guèze paraît distinguer ce livre du « livre de vie », mais la fonction exacte du premier demeure incertaine.
    reason: textual_variant
  - marker: b
    text: Le texte imprimé présente ici une forme corrompue. La correction reconnue donne « leur jugement », suivi de « soit renouvelé ». Le passage du singulier au pluriel est conservé.
    reason: textual_variant
  - marker: c
    text: La fin du verset accumule des termes proches relatifs à la malédiction et au châtiment. Cette répétition est conservée, car elle fait partie de la force rhétorique de l’avertissement.
    reason: segmentation_note
lexical_decisions:
- source_word: ሁከት
  choice: bouleversement
  rationale: Le terme désigne l’agitation ou le tumulte. « Bouleversement » convient au registre solennel sans limiter le sens à une émeute précise.
- source_word: ቍጥዓ / መዓት
  choice: fureur / colère
  rationale: Deux termes voisins se suivent dans le texte. Des équivalents distincts préservent leur accumulation au lieu de les fondre en un seul.
- source_word: እሳት፡ ዘይነድድ፡ በላዒ
  choice: un feu ardent et dévorant
  rationale: Cette formulation naturelle conserve à la fois l’idée d’un feu qui brûle et celle d’un feu qui consume.
- source_word: መጽሐፈ፡ ተግሣጸ፡ ውሉደ፡ ሰብእ
  choice: le livre de la discipline des fils des hommes
  rationale: 'Traduction volontairement proche d’une expression difficile : ተግሣጽ peut évoquer la discipline, la correction ou l’admonestation. « Fils des hommes » maintient l’expression anthropologique du texte.'
- source_word: መጽሐፈ፡ ሕይወት
  choice: le livre de vie
  rationale: Rend directement l’expression traditionnelle sans ajouter d’explication théologique.
- source_word: መርገም፡ ዘለዓለም
  choice: la malédiction éternelle
  rationale: Correspondance directe qui conserve la portée durable et judiciaire de la formule.
- source_word: ደዌ፡ ዘለዓለም
  choice: une maladie éternelle
  rationale: Le substantif signifie maladie ou affection. La traduction garde l’image concrète et son caractère perpétuel.
theological_decisions:
- issue: Rapport entre le « livre de la discipline » et le « livre de vie »
  choice: Les présenter comme deux livres distincts
  alternative: Comprendre le premier comme une autre désignation ou une subdivision du livre de vie
  rationale: La syntaxe guèze les oppose explicitement. La traduction ne les harmonise donc pas et ne précise pas leur fonction au-delà du texte.
- issue: Destination de l’homme exclu du livre de vie
  choice: « il sera compté parmi ceux qui sont voués à la destruction »
  alternative: « mais dans ce qui est voué à la destruction »
  rationale: La formulation française explicite seulement le lien syntaxique nécessaire, sans définir la nature du groupe ou du registre évoqué.
- issue: Passage soudain du singulier au pluriel dans « leur jugement »
  choice: Conserver le pluriel attesté par la correction textuelle reconnue
  alternative: Harmoniser en « son jugement » d’après les pronoms singuliers précédents
  rationale: Le pluriel peut élargir la sentence à tous ceux qui commettent la faute visée. L’harmoniser au singulier supprimerait une tension réelle du texte.
translation_notes:
  register: Français international moderne, solennel mais lisible. La syntaxe a été légèrement réorganisée pour rendre clairement le feu comme instrument du jugement. Les répétitions judiciaires et imprécatoires ont été maintenues, ainsi que l’ambiguïté du premier « livre » et le changement de nombre dans « leur jugement ».
