  yaml_path: translation/extra_canonical/jubilees/036/003.yaml
  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: fr
  text: 'Et je vous ordonne ceci, mes fils : pratiquez la justice et la droiture sur la terre, afin que le Seigneur fasse venir sur vous tout ce que le Seigneur a dit qu’il ferait pour Abraham et pour sa descendance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: la justice et la droiture
  rationale: Rend les deux termes éthiopiens distincts par une paire française naturelle, sans les fusionner.
- source_word: ውሉድየ
  choice: mes fils
  rationale: Dans cette adresse familiale, « mes fils » restitue naturellement le vocatif tout en conservant sa portée directe.
- source_word: ዘርኡ
  choice: sa descendance
  rationale: « Descendance » exprime ici le sens collectif de « semence/postérité » dans un français moderne et digne.
theological_decisions:
- issue: Lien entre l’obéissance demandée et l’accomplissement de la promesse
  choice: afin que le Seigneur fasse venir sur vous
  alternative: pour que le Seigneur vous accorde
  rationale: La formulation retenue préserve la relation finale ou consécutive du texte et l’image de ce qui vient sur les destinataires, sans expliciter davantage le rapport théologique.
- issue: Contenu de la parole divine concernant Abraham
  choice: tout ce qu’il a dit qu’il ferait pour Abraham et pour sa descendance
  alternative: tout ce que le Seigneur avait promis à Abraham et à sa descendance
  rationale: La formulation conserve l’acte de dire et de faire présent dans la source, sans le remplacer interprétativement par le seul concept de promesse.
translation_notes:
  register: Français international moderne, clair et solennel. L’impératif « pratiquez » est idiomatique avec « justice » et « droiture » et garde la force morale de l’ordre.
