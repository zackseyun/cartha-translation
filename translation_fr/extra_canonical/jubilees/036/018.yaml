  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
translation:
  language: fr
  text: Il y eut la paix entre eux. Ils sortirent de chez lui, puis se reposèrent ce jour-là et dormirent. Ce jour-là, Isaac dormit dans son lit, dans la joie. Puis il dormit du sommeil éternel et mourut à l’âge de cent quatre-vingts ans. Il avait accompli vingt-cinq semaines et cinq ans[a]. Ses deux fils l’enterrèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, les « semaines » sont des semaines d’années : vingt-cinq fois sept ans font cent soixante-quinze ans ; avec les cinq années supplémentaires, le total est de cent quatre-vingts ans.'
    reason: Clarifie le résumé calendérique et son rapport avec l’âge indiqué juste avant.
lexical_decisions:
- source_word: ዐርዮ
  choice: la paix
  rationale: Le terme désigne ici la paix ou la concorde entre les personnes; «la paix» est naturel et reste proche du sens contextuel.
- source_word: እምኀቤሁ
  choice: de chez lui
  rationale: Rend naturellement l’idée qu’ils sortirent du lieu où se trouvait Isaac, sans ajouter de précision absente du texte.
- source_word: ንዋመ፡ ዘለዓለም
  choice: du sommeil éternel
  rationale: Conserve la métaphore explicite du texte source pour la mort.
- source_word: ሱባዔ
  choice: semaines
  rationale: Traduit formellement le terme calendérique; la note précise qu’il s’agit ici de semaines d’années.
- source_word: ክልኤሆሙ፡ ውሉዱ
  choice: ses deux fils
  rationale: Le texte ne donne pas leurs noms dans ce verset; aucun nom n’est donc ajouté.
theological_decisions:
- issue: Expression métaphorique de la mort
  choice: «il s’endormit du sommeil éternel et mourut»
  alternative: «il mourut»
  rationale: La répétition apparente appartient au texte et exprime la mort à la fois par une métaphore et de façon directe; elle ne doit pas être effacée.
- issue: Rapport entre l’âge de 180 ans et le résumé en semaines
  choice: Conserver deux propositions successives
  alternative: Les fondre avec «c’est-à-dire»
  rationale: La syntaxe guèze énonce d’abord l’âge au décès, puis le total calendérique; la traduction préserve cette structure sans imposer une équivalence explicative dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La succession répétée de «dormit» et «s’endormit» est maintenue afin de préserver le jeu entre sommeil ordinaire et mort. «Ce jour-là» traduit la leçon du texte source plutôt que la variante anglaise fautive «five years» à cet endroit.
