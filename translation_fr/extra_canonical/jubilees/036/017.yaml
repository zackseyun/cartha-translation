lexical_decisions:
- source_word: ብእሲ
  choice: l’homme
  rationale: Rend naturellement le nom désignant une personne masculine dans cette parole de bénédiction.
- source_word: ዘይገብር፡ ጽድቀ
  choice: qui pratique la justice
  rationale: Préserve l’idée concrète de faire ce qui est juste, sans réduire la formule à une simple qualité morale.
- source_word: ዘርኦ
  choice: sa descendance
  rationale: Exprime en français moderne le sens collectif de « semence, postérité ».
- source_word: ይኤዝዞሙ
  choice: leur donner ses instructions
  rationale: Formulation française naturelle pour l’action de commander ou d’enjoindre dans un cadre familial solennel.
- source_word: ኅቡረ
  choice: ensemble
  rationale: Conserve explicitement la dimension collective du repas.
- source_word: ተፈሥሑ
  choice: se réjouirent
  rationale: Équivalent direct, digne et courant du verbe exprimant la joie.
theological_decisions:
- issue: Rapport entre justice, bénédiction et descendance
  choice: Conserver littéralement « lui et sa descendance pour toujours »
  alternative: Expliciter une récompense divine ou une alliance
  rationale: Le fragment source ne précise pas ici le mécanisme théologique; la traduction préserve donc la formulation et sa tension sans ajouter d’interprétation.
translation_notes:
  register: Français international moderne, narratif et digne. La virgule finale et « car » sont maintenus parce que le texte source fourni se termine par እስመ፡ et se poursuit manifestement au verset suivant.
