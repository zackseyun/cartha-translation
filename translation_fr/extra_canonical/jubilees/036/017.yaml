translation:
  language: fr
  text: « Que le Très-Haut soit avec l’homme qui pratique la justice, avec lui et sa descendance, pour toujours ! » Après avoir fini de leur donner ses instructions et de les bénir, ils mangèrent et burent ensemble devant lui et se réjouirent, car
