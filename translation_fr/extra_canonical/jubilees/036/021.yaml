  text: he divided the days of his generation. And Leah his wife died in the fourth year of the second week of the forty-fifth jubilee[21], and he buried her in the double cave near Rebekah his mother,
translation:
  language: fr
  text: Il répartit les jours de sa génération. Léa, sa femme, mourut la quatrième année de la deuxième semaine du quarante-cinquième jubilé. Il l’ensevelit dans la grotte double[a], près de Rébecca, sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « grotte double » correspond au tombeau ancestral que la tradition de la Genèse appelle Macpéla.
    reason: cross_reference
lexical_decisions:
- source_word: ፈለጠ፡ ዘመዋዕለ፡ ልደቱ
  choice: Il répartit les jours de sa génération
  rationale: ፈለጠ exprime ici l’idée de séparer ou répartir, plutôt que celle de chercher. « Génération » conserve la portée possible de ልደቱ, littéralement liée à la naissance, sans produire l’expression française peu claire « les jours de sa naissance ».
- source_word: ልያ፡ ብእሲቱ
  choice: Léa, sa femme
  rationale: Rendu direct et naturel du nom propre suivi de l’indication de relation.
- source_word: በዓተ፡ ዘእንተ፡ ክልኤ
  choice: la grotte double
  rationale: Traduction formelle de l’expression désignant la cavité double; la note signale son identification traditionnelle avec Macpéla.
- source_word: ቅሩበ፡ ርብቃ፡ እሙ
  choice: près de Rébecca, sa mère
  rationale: Conserve la proximité spatiale exprimée par le guèze et le référent maternel du texte.
theological_decisions:
- issue: Identification de la « grotte double »
  choice: Maintenir l’expression du texte dans le corps du verset et placer l’identification traditionnelle en note
  alternative: Traduire directement « la grotte de Macpéla »
  rationale: Le texte source dit « grotte double »; nommer Macpéla dans le texte résoudrait une allusion que la formulation guèze laisse implicite.
- issue: Ambiguïté de ልደቱ
  choice: « de sa génération »
  alternative: « de sa naissance »
  rationale: « Génération » suit l’interprétation contextuelle retenue par l’audit tout en évitant de transformer le segment en recherche concernant la naissance; l’autre sens lexical reste réel mais moins naturel ici.
translation_notes:
  register: Français international moderne, sobre et narratif. Les longues coordinations de la source sont réparties en trois phrases pour la lisibilité, sans modifier la chronologie. Le début abrupt est conservé puisqu’il résulte vraisemblablement du découpage du chapitre.
