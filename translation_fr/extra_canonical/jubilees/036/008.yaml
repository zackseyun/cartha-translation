  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
translation:
  language: fr
  text: Que chacun aime ses frères avec miséricorde et justice, et que personne ne souhaite du mal à son frère, dès maintenant et pour toujours, tous les jours de votre vie, afin que vous réussissiez dans toutes vos actions et que vous ne périssiez pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐዱ፡ አሐዱ
  choice: chacun
  rationale: La répétition distributive guèze signifie naturellement « chacun » en français.
- source_word: እኅዋሁ
  choice: ses frères
  rationale: Le nom est au pluriel dans ce premier membre, contrairement au singulier employé plus loin.
- source_word: በምሕረት፡ ወበጽድቅ
  choice: avec miséricorde et justice
  rationale: Rend les deux qualités coordonnées sans alourdir la phrase par la répétition de la préposition.
- source_word: ወኢይፈቅድ፡ ብእሲ፡ እኩየ
  choice: et que personne ne souhaite du mal
  rationale: « Personne » exprime naturellement l'indéfini négatif; « souhaite du mal » conserve l'idée de vouloir ou désirer le mal.
- source_word: በእኁሁ
  choice: à son frère
  rationale: Le second emploi est singulier et désigne le frère comme destinataire du mal souhaité.
- source_word: ከመ፡ ትሠርሑ፡ በኵሉ፡ ምግባሪክሙ
  choice: afin que vous réussissiez dans toutes vos entreprises
  rationale: Dans ce contexte, le verbe associé aux actes exprime leur bonne réussite; « entreprises » rend naturellement l'ensemble des actions accomplies.
- source_word: ወኢትትሐጐሉ
  choice: et que vous ne périssiez pas
  rationale: Conserve la portée forte du verbe négatif, qui peut évoquer la perte ou la destruction, dans un français digne et courant.
theological_decisions:
- issue: Nature de l'amour fraternel
  choice: avec miséricorde et justice
  alternative: dans la miséricorde et la justice
  rationale: La formulation conserve côte à côte la compassion et la droiture sans les opposer ni préciser un rapport théologique absent du texte.
- issue: Portée temporelle de l'interdiction
  choice: dès maintenant et pour toujours, tous les jours de votre vie
  alternative: dès maintenant, à jamais, pendant toute votre vie
  rationale: La juxtaposition potentiellement tendue entre « pour toujours » et « tous les jours de votre vie » est préservée plutôt que rationalisée.
- issue: Issue négative finale
  choice: que vous ne périssiez pas
  alternative: que vous ne soyez pas détruits
  rationale: « Périr » maintient l'intensité de la conséquence tout en évitant de préciser un agent destructeur que le texte ne nomme pas.
translation_notes:
  register: Français international moderne, exhortatif et digne. Les impératifs indirects en « que » reproduisent la structure parénétique. L'alternance entre le singulier distributif « chacun » et le pluriel collectif « vous » est conservée.
