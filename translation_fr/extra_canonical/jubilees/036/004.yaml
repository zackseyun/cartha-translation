  yaml_path: translation/extra_canonical/jubilees/036/004.yaml
  text: And be, my sons, loving among yourselves, loving your brothers as a man who loves his own life, and each seeking for his brother what is good for him; and act together on the earth, and let them love one another as themselves.
translation:
  language: fr
  text: 'Et vous, mes fils, soyez aimants les uns envers les autres : aimez vos frères comme un homme aime sa propre vie, et que chacun recherche pour son frère ce qui est bon pour lui. Agissez ensemble sur la terre, et qu’ils s’aiment[a] les uns les autres comme eux-mêmes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte passe ici de la deuxième personne (« vous ») à la troisième personne (« ils »). On pourrait aussi comprendre, en harmonisant la formulation : « aimez-vous les uns les autres ».'
    reason: Préserver et signaler le changement de personne présent dans le texte source.
lexical_decisions:
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: aimez vos frères
  rationale: Le verbe et le possessif sont à la deuxième personne du pluriel; cette traduction conserve l’adresse directe, plutôt que de la transformer en tournure distributive à la troisième personne.
- source_word: ነፍሶ
  choice: sa propre vie
  rationale: « Âme » peut ici désigner la personne ou la vie elle-même; « sa propre vie » exprime naturellement l’amour de soi dans ce contexte.
- source_word: የኀሥሥ
  choice: recherche
  rationale: Le verbe exprime l’idée de chercher ou de poursuivre ce qui est bon pour son frère.
- source_word: በገቢረ፡ ኅቡረ
  choice: Agissez ensemble
  rationale: Cette formulation restitue de façon concise l’action accomplie en commun ou dans l’unité.
- source_word: ከመ፡ ነፍሶሙ
  choice: comme eux-mêmes
  rationale: Le pluriel « leurs âmes/eux-mêmes » fonctionne idiomatiquement comme une comparaison avec l’amour de soi.
theological_decisions:
- issue: Passage de la deuxième à la troisième personne dans la dernière proposition
  choice: Conserver « qu’ils s’aiment »
  alternative: Harmoniser en « aimez-vous »
  rationale: Le texte guèze emploie ici une forme de troisième personne du pluriel après plusieurs formes à la deuxième personne. La traduction maintient cette tension grammaticale au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif et la tournure exhortative rendent le mouvement du discours direct, tandis que la note conserve l’irrégularité de personne du guèze.
