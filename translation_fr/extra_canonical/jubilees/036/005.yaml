  yaml_path: translation/extra_canonical/jubilees/036/005.yaml
  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: fr
  text: Quant aux idoles, je vous ordonne et vous exhorte à les mépriser et à les rejeter, et à ne pas les aimer, car elles sont pleines d’égarement pour ceux qui les adorent et ceux qui se prosternent devant elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገረ፡ ጣዖት
  choice: Quant aux idoles
  rationale: La tournure guèze signifie littéralement « au sujet de l’affaire des idoles » ; cette formulation française en restitue naturellement le thème sans alourdir la phrase.
- source_word: አአዝዘክሙ፡ ወእጌሥጸክሙ
  choice: je vous ordonne et vous exhorte
  rationale: 'Conserve les deux actes de parole distincts : le commandement ferme et l’exhortation pressante.'
- source_word: ትመንንምዎሙ፡ ወተጸረርዎሙ
  choice: les mépriser et à les rejeter
  rationale: Rend la double injonction d’attitude hostile envers les idoles sans introduire une nuance confessionnelle étrangère au texte.
- source_word: ስሕተት፡ ምሉአን
  choice: pleines d’égarement
  rationale: « Égarement » exprime l’erreur qui détourne du vrai chemin et préserve la portée religieuse du substantif source.
- source_word: ያመልኩዎሙ፡ ወለእለ፡ ይሰግዱ፡ ሎሙ
  choice: ceux qui les adorent et ceux qui se prosternent devant elles
  rationale: Maintient le parallélisme entre le culte rendu et le geste corporel de prosternation.
theological_decisions:
- issue: Rapport entre les idoles et l’égarement
  choice: « elles sont pleines d’égarement pour ceux qui… »
  alternative: « ceux qui les adorent sont entièrement dans l’erreur »
  rationale: La syntaxe rattache directement « pleines d’égarement » aux idoles ; la traduction conserve cette attribution plutôt que de la transférer silencieusement aux adorateurs.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme exhortatif et la répétition de « ceux qui » sont conservés pour refléter la cadence du texte source.
