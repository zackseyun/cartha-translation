  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
translation:
  language: fr
  text: 'Ésaü dit : « Je l’ai vendu à Jacob et j’ai donné le droit d’aînesse à Jacob. Qu’il lui soit donné. Je n’ai rien à dire à ce sujet, car il est à lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤጥኩ፡ ሎቱ፡ ለያዕቆብ
  choice: Je l’ai vendu à Jacob
  rationale: Rend directement le verbe « vendre » et conserve l’objet pronominal implicite sans préciser davantage son référent.
- source_word: ልህቃነ
  choice: le droit d’aînesse
  rationale: Dans ce contexte narratif, le terme désigne la prérogative attachée au premier-né; « droit d’aînesse » est la formulation française naturelle et consacrée.
- source_word: ወይትወሀብ፡ ሎቱ
  choice: Qu’il lui soit accordé !
  rationale: Conserve la tournure passive volitive du guèze sans identifier explicitement ce qui est accordé au-delà du contexte.
- source_word: ቃለ፡ ዘእብል፡ በእንቲአሁ
  choice: rien à dire à ce sujet
  rationale: 'Rend l’expression complète attestée par la continuation du texte : littéralement, Esau n’a « aucune parole à dire à son sujet ».'
- source_word: እስመ፡ ዚአሁ፡ ውእቱ
  choice: car il est à lui
  rationale: Préserve l’assertion finale de possession sans préciser si le pronom renvoie au droit d’aînesse ou à ce qui doit être accordé.
theological_decisions:
- issue: Nature exacte de ce qu’Ésaü a vendu et donné
  choice: Employer d’abord le pronom « l’ », puis nommer « le droit d’aînesse » selon la seconde proposition
  alternative: Expliciter partout « le droit d’aînesse »
  rationale: Le texte varie entre un objet pronominal et une désignation explicite; la traduction conserve cette progression plutôt que d’uniformiser.
- issue: Référent du pronom final
  choice: « car il est à lui »
  alternative: « car le droit d’aînesse lui appartient »
  rationale: La formulation pronominale maintient l’ambiguïté grammaticale du texte source et évite une explicitation doctrinale ou narrative superflue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation distingue clairement les quatre affirmations d’Ésaü. Aucun ajout explicatif n’est introduit; la continuation complète du guèze signalée dans la révision est prise en compte.
