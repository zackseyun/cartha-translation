  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: fr
  text: 'La sixième année de cette semaine-là, Isaac appela ses deux fils, Ésaü et Jacob. Ils vinrent auprès de lui, et il leur dit : « Mes fils, je vais prendre le chemin de mes pères, vers la demeure éternelle où se trouvent mes pères. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘዝሱባዔ
  choice: de cette semaine-là
  rationale: Le terme désigne ici une période de sept ans dans la chronologie des Jubilés. La traduction littérale « semaine » est conservée, avec « cette…-là » pour un français naturel.
- source_word: ፍኖተ፡ አበውየ
  choice: le chemin de mes pères
  rationale: Conserve l’image source du départ vers la mort sans la réduire à une simple paraphrase comme « mourir ».
- source_word: ቤት፡ ዘለዓለም
  choice: la demeure éternelle
  rationale: « Demeure » rend naturellement l’idée de maison comme lieu où l’on réside, tout en préservant la portée funéraire et eschatologique de l’expression.
- source_word: ኀበ፡ ሀለዉ፡ ህየ፡ አበውየ
  choice: où se trouvent mes pères
  rationale: Restitue sans ajout l’affirmation que les pères d’Isaac sont dans cette demeure.
theological_decisions:
- issue: Nature de la « demeure éternelle »
  choice: Maintenir l’expression imagée sans identifier explicitement le lieu
  alternative: « le séjour éternel des morts » ou « la tombe »
  rationale: Le texte parle d’une demeure éternelle où sont les pères d’Isaac, mais ne la définit pas davantage. Une explicitation imposerait une interprétation eschatologique absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore répétée des « pères » et du voyage vers leur demeure est conservée; la syntaxe est légèrement segmentée pour la lisibilité.
