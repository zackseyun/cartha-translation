  text: to the left of the grave of Sarah, his father’s mother. And all her sons and his sons came to mourn Leah his wife with him and to comfort him for her, because he was grieving for her.
translation:
  language: fr
  text: à gauche du tombeau de Sara, la mère de son père. Tous les fils de Léa et les fils de Jacob vinrent pleurer Léa, sa femme, avec lui et le consoler à son sujet, car il était affligé à cause d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በፀጋመ፡ ለመቃብረ፡ ሣራ
  choice: à gauche du tombeau de Sara
  rationale: ፀጋም désigne précisément le côté gauche; la traduction conserve cette orientation plutôt que de généraliser par « à côté ».
- source_word: እሙ፡ አቡሁ
  choice: la mère de son père
  rationale: Rendu formel de la relation généalogique exprimée par le guèze; dans le contexte, Sara est la mère d’Isaac, père de Jacob.
- source_word: ውሉዳ፡ ወውሉዱ
  choice: ses fils et les fils de Jacob
  rationale: 'Les suffixes pronominaux changent de référent: « ses fils » renvoie naturellement à Léa, tandis que « ses fils à lui » renvoie à Jacob. Répéter le nom lève en français une ambiguïté pronominale artificielle sans modifier les participants.'
- source_word: ይብክይዋ፡ ልያሃ፡ ብእሲተ፡ ምስሌሁ
  choice: pleurer avec lui Léa, sa femme
  rationale: Conserve Léa comme objet des lamentations et Jacob comme celui que les fils rejoignent dans le deuil.
- source_word: ይናዝዝዎ፡ በእንቲአሃ
  choice: le consoler de sa mort
  rationale: L’expression signifie le consoler à son sujet; « de sa mort » explicite sobrement la cause immédiate donnée par le contexte funéraire.
- source_word: ሀሎ፡ ይሳቀዮ
  choice: il était dans le deuil à cause d’elle
  rationale: Le verbe exprime ici la peine ou l’affliction durable; « être dans le deuil » convient naturellement au contexte.
