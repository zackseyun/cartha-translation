translation_notes:
  register: Français international moderne, digne et narratif. Le début de ce verset poursuit syntaxiquement le verset précédent; la minuscule initiale est donc conservée. Les référents sont explicités avec mesure pour éviter la confusion entre les fils de Léa et ceux de Jacob.
