    issue: Ordre des mots dans « pleurer avec lui Léa, sa femme »
    rationale: 'Cet ordre peut momentanément faire hésiter sur le complément de « avec lui ». Placer « avec lui » après l’objet rend plus clairement le sens : ils pleurent Léa en compagnie de Jacob.'
  - severity: low
