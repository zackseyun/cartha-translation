  verdict: revise
  source_fidelity: 'Le repère spatial « à gauche » rend correctement le guèze ፀጋም. La relation « la mère de son père » est conservée. En revanche, « de sa mort » explicite une donnée que le texte formule plus sobrement : ils le consolent « à son sujet » (c’est-à-dire au sujet de Léa). Il convient de ne pas ajouter cette précision dans le corps du texte.'
  naturalness: 'La formulation révisée est plus idiomatique : en français, « pleurer Léa, sa femme, avec lui » reflète clairement que les fils se joignent à Jacob dans ses lamentations. « Affligé à cause d’elle » rend naturellement la peine exprimée par le texte sans surinterpréter l’expression comme un état rituel ou social de deuil.'
  terminology: « Tombeau », « Sara », « Léa », « fils », « consoler » et « affligé » conviennent au registre narratif moderne. L’explicitation équilibrée « les fils de Léa et les fils de Jacob » clarifie les deux groupes sans en modifier les référents.
