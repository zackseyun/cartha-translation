  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
translation:
  language: fr
  text: Après cette loi, je t’ai fait connaître les jours de sabbat dans le désert du Sinaï, qui se trouve entre Élim et le Sinaï.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምድኅረዝ፡ ሕገ
  choice: Après cette loi
  rationale: Le nom « loi » se rattache naturellement à ce qui précède, plutôt que d’être pris comme tête d’un complément discontinu « la loi des jours ».
- source_word: አደለውኩ
  choice: je t’ai fait connaître
  rationale: Rend le sens causatif de faire savoir ou révéler, avec le destinataire singulier exprimé en français.
- source_word: መዋዕለ፡ ሰንበታት
  choice: les jours de sabbat
  rationale: Traduction directe de « jours » et du pluriel « sabbats », exprimé idiomatiquement en français par le singulier générique après « jours de ».
- source_word: በገዳመ፡ ሲና
  choice: dans le désert du Sinaï
  rationale: ገዳም désigne ici le désert ou la région désertique, non le mont Sinaï.
- source_word: እንተ፡ ይእቲ፡ ምእከለ፡ ኤሎም፡ ወሲና
  choice: qui se trouve entre Élim et le Sinaï
  rationale: Le relatif renvoie naturellement au désert du Sinaï; « se trouve » produit un français courant tout en conservant la localisation.
theological_decisions:
- issue: Rapport syntaxique de « loi » avec le contexte ou avec « jours de sabbat »
  choice: « cette loi » renvoie à la loi précédente
  alternative: « la loi des jours de sabbat »
  rationale: L’ordre des mots guèze favorise la clôture du groupe « après cette loi »; l’autre analyse exigerait un complément génitif fortement disjoint par le verbe.
translation_notes:
  register: Français moderne, clair et digne. « Élim » suit l’orthographe biblique française usuelle; la répétition « désert du Sinaï… le Sinaï » est conservée parce qu’elle appartient au texte source.
