base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/012.yaml
  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: fr
  text: Et toute personne qui, ce jour-là, fait un travail, part en voyage, cultive son champ, que ce soit dans sa maison ou en quelque lieu que ce soit, allume un feu, monte sur un animal, voyage en bateau sur la mer, frappe ou tue quoi que ce soit, égorge un animal ou un oiseau, capture une bête sauvage, un oiseau ou un poisson, jeûne ou fait la guerre le jour du sabbat —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: un travail
  rationale: Rend le sens général d’activité ou de travail dans une liste d’actes interdits.
- source_word: የሐውር፡ መንገደ
  choice: part en voyage
  rationale: Expression française naturelle correspondant au fait d’aller en chemin ou d’entreprendre un déplacement.
- source_word: ይትቀነይ፡ ወፍረ
  choice: cultive son champ
  rationale: Le contexte agricole et le substantif rendu par « champ » favorisent cette formulation, conforme au témoignage de l’édition.
- source_word: ያነድድ፡ እሳተ
  choice: allume un feu
  rationale: Traduction directe et idiomatique.
- source_word: ይጼአን፡ ዲበ፡ ኵሉ፡ እንስሳ
  choice: monte sur un animal
  rationale: Conserve la formulation large de la source sans préciser une espèce.
- source_word: ይነግድ፡ በሐመር፡ ባሕረ
  choice: voyage en bateau sur la mer
  rationale: Dans ce contexte, le verbe associé au navire désigne un déplacement maritime; « bateau » est clair en français moderne.
- source_word: የሐርድ
  choice: égorge
  rationale: Rend l’abattage intentionnel d’un animal plus précisément que le simple verbe « tuer ».
- source_word: አሰገረ
  choice: capture
  rationale: Rend l’action de prendre au piège ou de saisir des animaux sauvages.
- source_word: ይጾውም
  choice: jeûne
  rationale: Équivalent direct du verbe désignant le jeûne.
- source_word: ይገብር፡ ጸብአ
  choice: fait la guerre
  rationale: Expression française naturelle qui conserve la portée militaire de la locution.
theological_decisions:
- issue: Portée de l’interdiction sabbatique
  choice: Conserver toute la série d’actes sans l’expliquer ni l’harmoniser avec d’autres lois sabbatiques.
  alternative: Reformuler certains actes en catégories générales ou ajouter une interprétation doctrinale.
  rationale: Le verset énumère des actes précis, y compris le jeûne et la guerre; la traduction préserve cette tension propre au texte.
- issue: Phrase syntaxiquement inachevée
  choice: Terminer par un tiret long.
  alternative: Ajouter une conséquence pénale supposée ou clore la phrase par un point.
  rationale: Le verset se poursuit syntaxiquement dans le contexte; le tiret signale fidèlement cette continuité sans importer le contenu du verset suivant.
translation_notes:
  register: Français international moderne, digne et lisible. L’anaphore de la source est condensée en une énumération française fluide, sans perte d’éléments. « Ce jour-là » reprend explicitement le référent du pronom initial, tandis que « le jour du sabbat » demeure à la fin comme dans la source.
