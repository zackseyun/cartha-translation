base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/013.yaml
  text: And the person who does any of these things on the Sabbath day shall die, so that the children of Israel may keep according to the commandments of the Sabbaths of the land, as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.
translation:
  language: fr
  text: Et quiconque fera l’une quelconque de ces choses le jour du sabbat mourra, afin que les enfants d’Israël observent le sabbat selon les commandements concernant les sabbats du pays,[a] comme cela est écrit sur les tablettes qu’il a remises entre mes mains pour que je mette par écrit à ton intention les lois de chaque temps fixé, selon les divisions de ses jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « observent selon les commandements des sabbats du pays ».'
    reason: La syntaxe source est compacte et peut rattacher « des sabbats du pays » directement à « commandements »; la note conserve cette construction possible tandis que le texte principal explicite l’objet naturel de « observent ».
lexical_decisions:
- source_word: ወሰብእ፡ ዘይገብር፡ ኵሎ፡ ዘእምዝ
  choice: Et toute personne qui fera l’une de ces choses
  rationale: Rend la conjonction initiale, le sujet générique et la référence récapitulative aux actes précédemment énumérés dans un français naturel.
- source_word: በዕለተ፡ ሰንበት
  choice: le jour du sabbat
  rationale: Traduction directe de l’expression temporelle; la minuscule convient à l’usage courant du français.
- source_word: ይሙት
  choice: mourra
  rationale: Conserve la formulation juridique catégorique du texte sans l’atténuer.
- source_word: እንዘ፡ ይዕቀቡ፡ በከመ፡ ትእዛዛተ
  choice: observent le sabbat selon les commandements
  rationale: Le verbe « observer » reçoit de manière naturelle le sabbat implicite comme objet, tandis que « selon » préserve በከመ et fait des commandements la norme de l’observance plutôt que son objet direct.
- source_word: ሰንበታት፡ ምድር
  choice: les sabbats du pays
  rationale: Conserve le pluriel « sabbats » et le génitif « du pays », malgré une expression française inhabituelle, afin de ne pas aplanir le texte.
- source_word: ጽላት
  choice: les tablettes
  rationale: Terme traditionnel et clair pour les tablettes célestes du livre des Jubilés.
- source_word: ሕገገ፡ ጊዜ፡ ወጊዜ
  choice: les lois de chaque temps fixé
  rationale: Le pluriel « lois » suit la forme plurielle construite ሕገገ; « chaque temps fixé » exprime la distributivité de ጊዜ፡ ወጊዜ dans ce contexte calendaire.
- source_word: በበ፡ ክፍሌ፡ መዋዕሊሁ
  choice: selon la répartition de ses jours
  rationale: Rend la distribution des jours en divisions sans surinterpréter la structure calendaire.
theological_decisions:
- issue: Nature de la sanction sabbatique
  choice: « mourra »
  alternative: « sera mis à mort »
  rationale: Le source formule littéralement l’issue par le verbe « mourir »; la traduction n’ajoute pas explicitement un agent d’exécution que cette forme ne nomme pas.
- issue: Référent du pronom dans « qu’il a remises »
  choice: Maintien du pronom « il » sans identification ajoutée
  alternative: « que Dieu a remises »
  rationale: Le verset emploie un sujet pronominal; nommer Dieu résoudrait une référence que le contexte peut éclairer mais que cette phrase ne formule pas explicitement.
- issue: Relation entre observance et commandements
  choice: « observent le sabbat selon les commandements »
  alternative: « gardent les commandements »
  rationale: Cette formulation préserve les commandements comme norme introduite par በከመ, sans les transformer en objet direct du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation juridique reste ferme; les termes calendaires et l’expression inhabituelle « sabbats du pays » sont conservés sans harmonisation confessionnelle. Le marqueur [a] figure dans le texte principal.
