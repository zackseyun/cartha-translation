    issue: Rupture du relatif concernant Dieu
    rationale: « Il vous a donné » transforme en proposition autonome le syntagme source « le Seigneur votre Dieu, qui vous a donné ». Le maintien du relatif préserve la syntaxe et le lien direct avec « bénir ».
  - severity: medium
    issue: Rendu peu naturel et possiblement trop interprétatif de ዕለተ መንግሥት ቅድስት
    rationale: « un jour du royaume saint » privilégie l’idée d’un royaume saint. « un jour saint du royaume » est plus naturel et correspond à une lecture également possible, soutenue par l’audit anglais; une note conserve l’ambiguïté.
  - severity: low
    issue: Formule finale « pour tous les jours »
    rationale: Cette expression peut se comprendre comme une fréquence quotidienne. « tout au long de tous les jours » conserve mieux la répétition emphatique de « jours » sans ajouter « générations ».
