revisions:
- from: Vous ne ferez absolument aucun travail le jour du sabbat, sauf ce que vous aurez préparé pour vous le sixième jour, afin de manger, de boire, de vous reposer, de cesser tout travail en ce jour pour observer le sabbat, et de bénir le Seigneur votre Dieu. Il vous a donné un jour de fête, un jour saint et un jour du royaume saint[a] pour tout Israël — ce jour-là, tout au long de leurs jours et pour tous les jours.[b]
  to: Vous ne ferez absolument aucun travail le jour du sabbat, sauf ce que vous aurez préparé pour vous le sixième jour, afin de manger, de boire, de vous reposer, de vous abstenir de tout travail en ce jour pour observer le sabbat, et de bénir le Seigneur, votre Dieu, qui vous a donné un jour de fête, un jour saint et un jour saint du royaume[a] pour tout Israël — ce jour-là, tout au long de leurs jours, tout au long de tous les jours.[b]
