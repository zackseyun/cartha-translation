base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
translation:
  language: fr
  text: Vous ne ferez absolument aucun travail le jour du sabbat, sauf ce que vous aurez préparé pour vous le sixième jour, afin de manger, de boire, de vous reposer, de vous abstenir de tout travail en ce jour pour observer le sabbat, et de bénir le Seigneur, votre Dieu, qui vous a donné un jour de fête, un jour saint et un jour saint du royaume[a] pour tout Israël — ce jour-là, tout au long de leurs jours, tout au long de tous les jours.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un jour du royaume saint »; la construction peut aussi se comprendre comme « un jour saint de royauté ».'
    reason: La relation syntaxique entre « jour », « royaume/royauté » et « saint » reste ambiguë dans le guèze.
  - marker: b
    text: 'Littéralement : « dans leurs jours, dans tous les jours ».'
    reason: Le guèze répète explicitement le terme « jours »; la traduction évite de substituer l’interprétation « générations ».
lexical_decisions:
- source_word: ሰንበት
  choice: sabbat / observer le sabbat
  rationale: Le nom désigne à la fois le sabbat et l’action de le célébrer en cessant le travail; la formulation française varie selon la fonction grammaticale.
- source_word: ዕለተ፡ በዓል
  choice: jour de fête
  rationale: Rend directement l’expression construite « jour de fête », dans un français naturel.
- source_word: መንግሥት
  choice: royaume
  rationale: Conserve le sens institutionnel et théologique du terme sans le réduire à la seule action de régner.
- source_word: በመዋዕሊሆሙ፡ በኵሉ፡ መዋዕል
  choice: tout au long de leurs jours et pour tous les jours
  rationale: Préserve la répétition explicite de « jours » dans le guèze, sans substituer « générations » au premier membre.
theological_decisions:
- issue: Relation syntaxique entre « saint », « jour » et « royaume »
  choice: un jour du royaume saint
  alternative: un saint jour du royaume / un jour saint de royauté
  rationale: Dans le guèze, l’adjectif féminin « sainte » s’accorde naturellement avec « royaume/royauté », également féminin, plutôt qu’avec « jour ». La note maintient toutefois l’autre compréhension possible de la construction.
- issue: Valeur de la formule temporelle finale
  choice: tout au long de leurs jours et pour tous les jours
  alternative: de génération en génération, pour toujours
  rationale: Le texte source répète le mot « jours » et ne contient pas le terme usuel pour « génération »; la traduction conserve cette formulation inhabituelle au lieu de l’interpréter silencieusement.
translation_notes:
  register: Français international actuel, digne et accessible. « Le Seigneur » suit l’usage biblique français pour le nom divin dans ce contexte. La longue prescription du texte source est légèrement articulée par une nouvelle phrase, sans modifier ses rapports logiques.
