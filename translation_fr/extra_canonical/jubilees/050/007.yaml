  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
translation:
  language: fr
  text: 'Pendant six jours, vous travaillerez ; mais le septième jour est un sabbat pour le Seigneur, votre Dieu. Ce jour-là, vous ne ferez aucun travail : ni vous, ni vos enfants, ni vos serviteurs, ni vos servantes, ni aucun de vos animaux, ni l’étranger qui réside parmi vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉድክሙ (wəludəkkəmu)
  choice: vos enfants
  rationale: Le pluriel désigne la descendance ou les enfants; ce choix naturel en français inclut ici fils et filles sans restreindre indûment le sens.
- source_word: አግብርቲክሙ / አእማቲክሙ
  choice: vos serviteurs / vos servantes
  rationale: Les deux termes distinguent les personnes de service de sexe masculin et féminin; la formulation conserve ce parallélisme.
- source_word: ነኪር (nakir)
  choice: l’étranger qui réside parmi vous
  rationale: Le terme désigne l’étranger présent au sein de la communauté; «qui réside parmi vous» rend le complément géographique ዘኀቤክሙ sans suggérer un simple visiteur.
- source_word: ግብረ (gəbr)
  choice: travail
  rationale: Dans le contexte du commandement sabbatique, «travail» est plus idiomatique et précis que le générique «œuvre».
theological_decisions:
- issue: Rapport du sabbat au Seigneur
  choice: un sabbat consacré au Seigneur votre Dieu
  alternative: un sabbat du Seigneur votre Dieu
  rationale: La construction exprime l’appartenance ou la destination du jour à Dieu. «Consacré au» en donne le sens naturellement en français sans ajouter une doctrine particulière.
translation_notes:
  register: Français moderne, courant et digne; tutoiement collectif rendu par «vous». Le parallélisme juridique de l’énumération est conservé, avec une syntaxe française fluide.
