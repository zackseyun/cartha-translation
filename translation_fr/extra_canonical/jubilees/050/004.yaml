base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
translation:
  language: fr
  text: 'C’est pourquoi j’ai établi pour toi des semaines d’années, des années et des jubilés : quarante-neuf jubilés depuis les jours d’Adam jusqu’à ce jour. Il reste encore une semaine, deux ans et quarante ans pour apprendre les commandements du Seigneur, jusqu’à ce qu’ils entrent dans le pays de Canaan en traversant le Jourdain vers l’ouest.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir traversé le Jourdain, du côté de l’ouest ».'
    reason: La construction finale peut mettre l’accent soit sur la direction de la traversée, soit sur la situation du pays à l’ouest du Jourdain.
lexical_decisions:
- source_word: ሠራዕኩ፡ ለከ
  choice: j’ai établi pour toi
  rationale: Rend le verbe d’ordonner ou de fixer et conserve l’adresse au singulier.
- source_word: ሱባዔ፡ ዓመታት
  choice: des semaines d’années
  rationale: Expression chronologique technique désignant des cycles de sept années.
- source_word: ኢዮቤሌዎታት
  choice: jubilés
  rationale: Terme français traditionnel et précis pour les cycles jubilaires.
- source_word: ርሑቅ፡ ለእእምሮ
  choice: Il reste encore … pour apprendre
  rationale: Restitue l’idée d’une période encore à venir, destinée à la connaissance des commandements.
- source_word: የዐድዉ፡ ማዕዶተ፡ ምድረ፡ ከናአን
  choice: ils entrent dans le pays de Canaan en traversant
  rationale: Le verbe exprime le passage vers l’autre côté; « entrent » rend naturellement la destination, tandis que « en traversant » conserve la force verbale du passage.
- source_word: ዐዲዎሙ፡ ዮርዳኖሰ፡ ገጸ፡ ዐረቢሁ
  choice: en traversant le Jourdain vers l’ouest
  rationale: Conserve l’action de traverser et la direction occidentale indiquée par le texte.
theological_decisions:
- issue: Nom divin እግዚአብሔር
  choice: le Seigneur
  alternative: YHWH / l’Éternel
  rationale: « le Seigneur » est une formulation française traditionnelle, intelligible et non confessionnelle, sans reconstruire dans le corps du texte une forme du nom divin que le guèze ne présente pas ici.
- issue: Finalité des quarante ans
  choice: pour apprendre les commandements du Seigneur
  alternative: afin de connaître les commandements du Seigneur
  rationale: « apprendre » garde la portée pédagogique de ለእእምሮ sans décider si la connaissance visée est seulement intellectuelle ou aussi pratique.
translation_notes:
  register: Français moderne, clair et digne. La longue énumération chronologique est légèrement ponctuée pour la lisibilité, sans en modifier les éléments. Le marqueur de note [a] figure dans le texte principal.
