revisions:
- from: Les jubilés se succéderont jusqu’au jour où Israël sera purifié de toute faute de débauche, d’impureté, de souillure, de péché et d’égarement. Il habitera en sécurité dans tout le pays[a] ; il n’y aura alors plus pour lui aucun satan[b] ni aucun être mauvais, et le pays sera pur à partir de ce moment, pour toujours.
  to: 'Les jubilés se succéderont jusqu’à ce qu’Israël soit purifié de toute faute : de la débauche, de l’impureté, de la souillure, du péché et de l’égarement. Il habitera en sécurité dans tout le pays[a] ; il n’y aura alors plus pour eux ni adversaire[b] ni être mauvais, et le pays sera pur à partir de ce moment, pour toujours.'
