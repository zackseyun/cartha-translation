  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: fr
  text: 'Les jubilés se succéderont jusqu’à ce qu’Israël soit purifié de toute faute : de la débauche, de l’impureté, de la souillure, du péché et de l’égarement. Il habitera en sécurité dans tout le pays[a] ; il n’y aura alors plus pour eux ni adversaire[b] ni être mauvais, et le pays sera pur à partir de ce moment, pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot peut signifier « pays » ou « terre » ; le contexte de l’habitation d’Israël favorise ici « pays ».
    reason: Signaler l’ambiguïté réelle de ምድር sans alourdir le texte principal.
  - marker: b
    text: 'Ou : « aucun Satan ». Le terme peut désigner un adversaire ou Satan.'
    reason: Préserver l’ambiguïté lexicale et théologique de ሰይጣነ.
lexical_decisions:
- source_word: ኢዮቤሌዎታት፡ የኃልፉ
  choice: Les jubilés se succéderont
  rationale: Rend littéralement l’idée que les cycles jubilaires « passent », tout en employant une tournure française naturelle pour une succession de périodes.
- source_word: አበሳ፡ ዝሙት
  choice: faute de débauche
  rationale: አበሳ désigne la faute ou la culpabilité, tandis que ዝሙት renvoie à l’inconduite sexuelle ; « débauche » est ici plus courant et plus large que « fornication ».
- source_word: ይትአመን
  choice: habitera en sécurité
  rationale: Dans ce contexte territorial, le verbe exprime une situation de confiance, de sûreté ou de sécurité, plutôt qu’un acte abstrait de foi.
- source_word: ሰይጣነ
  choice: satan
  rationale: Le terme peut fonctionner comme un nom commun signifiant « adversaire » ou comme la désignation d’une puissance mauvaise ; la minuscule maintient cette ouverture.
- source_word: ይነጽሕ / ትነጽሕ
  choice: sera purifié / sera pur
  rationale: Le même champ lexical de pureté est conservé pour Israël puis pour le pays, tout en respectant la différence de construction verbale.
theological_decisions:
- issue: Identité de « satan »
  choice: aucun satan
  alternative: aucun adversaire ; aucun Satan
  rationale: La formulation retenue évite de décider sans nécessité si le mot désigne exclusivement Satan comme personnage propre ou plus largement un adversaire spirituel.
- issue: Portée de la purification finale
  choice: pur à partir de ce moment, pour toujours
  alternative: pur dès lors et à jamais
  rationale: Cette formulation conserve l’affirmation temporelle absolue du texte sans préciser davantage la nature eschatologique de cet état.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase source a été divisée en deux phrases pour améliorer la lisibilité, sans modifier sa progression : succession des jubilés, purification d’Israël, sécurité, disparition des puissances mauvaises, puis pureté durable du pays.'
