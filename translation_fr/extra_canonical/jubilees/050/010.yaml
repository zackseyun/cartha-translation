base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: fr
  text: 'Car grand est l’honneur que le SEIGNEUR a accordé à Israël : manger, boire et se rassasier en ce jour de fête, et s’y reposer de tout travail relevant du labeur des humains, sauf pour brûler de l’encens et présenter une offrande et un sacrifice devant le SEIGNEUR, pour les jours et pour les sabbats.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule « pour les jours et pour les sabbats » est difficile. Elle peut aussi se comprendre comme « pour les jours de fête et les sabbats » ou « chaque jour et chaque sabbat ».
    reason: Préserver l’ambiguïté réelle de la formule finale guèze sans imposer un référent absent du texte.
lexical_decisions:
- source_word: ዐቢይ፡ ክብር
  choice: grand est l’honneur
  rationale: Rend directement l’intensité et le nom « honneur », tout en conservant une tournure française digne.
- source_word: እግዚአብሔር
  choice: le SEIGNEUR
  rationale: Équivalent biblique français traditionnel et intelligible du titre divin guèze.
- source_word: ለበሊዕ፡ ወለስቲይ፡ ወለጸጊብ
  choice: manger, boire et se rassasier
  rationale: Préserve la série de trois infinitifs et le sens concret de satiété.
- source_word: በዛቲ፡ ዕለት፡ በዓል
  choice: en ce jour de fête
  rationale: Expression naturelle qui conserve à la fois « jour » et la notion de célébration festive.
- source_word: እጓለ፡ እመሕያው
  choice: les humains
  rationale: Rend l’expression idiomatique « enfants des hommes » en français moderne sans restriction de genre.
- source_word: ዕጣን፡ ዕጣን
  choice: faire brûler de l’encens
  rationale: Le texte transmis répète le terme; le contexte et la consultation anglaise indiquent l’acte cultuel de brûler de l’encens plutôt qu’une répétition à reproduire mécaniquement.
- source_word: ቍርባን፡ ወመሥዋዕት
  choice: une offrande et un sacrifice
  rationale: Maintient la distinction entre les deux termes cultuels.
- source_word: ለመዋዕለ፡ ወለሰንበታት
  choice: pour les jours et pour les sabbats
  rationale: Traduction formelle qui conserve la formulation difficile du texte au lieu d’en préciser arbitrairement le référent.
theological_decisions:
- issue: Portée de l’exception au repos
  choice: à l’exception de faire brûler de l’encens et de présenter une offrande et un sacrifice
  alternative: excepté le service cultuel en général
  rationale: Le texte énumère des actes cultuels précis; la traduction ne généralise pas l’exception.
- issue: Sens de la formule finale
  choice: pour les jours et pour les sabbats
  alternative: pour les jours de fête et les sabbats / chaque jour et chaque sabbat
  rationale: La construction source demeure ambiguë. La version principale la conserve littéralement et la note signale les lectures possibles sans trancher.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe suit l’élan explicatif du verset tout en évitant les archaïsmes; le vocabulaire cultuel reste précis. Le marqueur [a] figure bien dans le texte principal.
