base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/011.yaml
  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
translation:
  language: fr
  text: Cette œuvre seule sera accomplie les jours de sabbat dans la maison du sanctuaire du SEIGNEUR votre Dieu, afin qu’ils fassent l’expiation pour Israël par une offrande continuelle, jour après jour, comme mémorial agréable devant le SEIGNEUR. Il les recevra pour toujours, jour après jour, conformément à ce qui t’a été ordonné.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « les » n’est pas explicite dans le texte; il peut s’agir des offrandes ou des personnes concernées.
    reason: Préserver une ambiguïté pronominale du texte source.
lexical_decisions:
- source_word: ዘግብር፡ ባሕቲቱ
  choice: Cette œuvre seule
  rationale: ግብር désigne explicitement une œuvre ou une action; ባሕቲቱ en marque l’exclusivité.
- source_word: በመዋዕለ፡ ሰንበታት
  choice: les jours de sabbat
  rationale: Rend le pluriel du texte guèze sans introduire une périodicité absente.
- source_word: መባአ፡ ወትረ
  choice: une offrande continuelle
  rationale: መባአ signifie « offrande » ou « don » et ወትረ exprime la continuité.
- source_word: ዘይሠጠው
  choice: agréable
  rationale: Le verbe signifie ici être agréable ou agréé, et non être donné.
- source_word: ወይትወከፎሙ
  choice: Il les recevra
  rationale: Conserve le pronom objet pluriel du guèze et le sens d’accueil ou d’acceptation.
theological_decisions:
- issue: Sujet pluriel de l’action expiatoire
  choice: afin qu’ils fassent l’expiation
  alternative: afin que l’expiation soit faite
  rationale: Le verbe guèze est pluriel; le pronom français préserve cette donnée sans identifier explicitement les officiants.
- issue: Référent du pronom objet pluriel dans « Il les recevra »
  choice: Conserver « les » et signaler son ambiguïté
  alternative: Expliciter « ces offrandes » ou « les Israélites »
  rationale: Le texte ne fixe pas clairement l’antécédent; l’expliciter résoudrait indûment une ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et accessible. « SEIGNEUR » suit la convention éditoriale du texte de consultation pour le nom divin. La répétition « jour après jour » est maintenue parce qu’elle apparaît deux fois dans le texte source.
