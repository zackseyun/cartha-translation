  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: fr
  text: Je t’ai parlé, au mont Sinaï, des sabbats de la terre, et je t’ai parlé des années des jubilés parmi les sabbats d’années ; mais je ne t’ai pas parlé de son année jusqu’au moment où vous entrerez dans le pays dont vous prendrez possession.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰንበታተ፡ ምድር
  choice: les sabbats de la terre
  rationale: Rend directement le pluriel et le complément du texte guèze, tout en conservant le vocabulaire institutionnel du passage.
- source_word: ዓመታተ፡ ኢዮቤሌዎኒ
  choice: les années des jubilés
  rationale: Conserve le pluriel du texte source et le terme traditionnel « jubilés ».
- source_word: ውስተ፡ ሰንበታተ፡ ዓመታት
  choice: dans le cadre des sabbats d’années
  rationale: « Dans le cadre de » exprime naturellement l’inclusion ou l’organisation suggérée par ውስተ, sans réduire la formule à une simple indication temporelle.
- source_word: ዓመተሰ
  choice: l’année du jubilé
  rationale: Le suffixe renvoie vraisemblablement au jubilé précédemment mentionné. L’explicitation française évite l’obscur « son année » tout en gardant ce référent contextuel.
- source_word: ትእኅዙ
  choice: vous prendrez possession
  rationale: Rend le sens d’acquérir ou de tenir le pays en possession, avec le pluriel porté par la forme verbale.
theological_decisions:
- issue: Référent de « son année »
  choice: « l’année du jubilé »
  alternative: « son année » ou « l’année correspondante »
  rationale: Le contexte immédiat rattache le possessif au jubilé. L’explicitation clarifie la syntaxe en français sans ajouter de calcul ni d’interprétation doctrinale.
- issue: Alternance du singulier et du pluriel dans l’adresse
  choice: « Je t’ai… » puis « vous entrerez… »
  alternative: Uniformiser toute l’adresse au singulier ou au pluriel
  rationale: Le texte source passe du singulier dans « je t’ai parlé » au pluriel dans les verbes relatifs à l’entrée et à la prise de possession. Cette tension est préservée.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure cumulative de l’original, avec une légère explicitation du référent possessif pour assurer une lecture naturelle.
