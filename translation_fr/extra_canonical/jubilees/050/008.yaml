base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: fr
  text: Et l’homme qui y accomplit un travail quelconque mourra. Tout homme qui profane ce jour, qui couche avec une femme, qui dit qu’il y fera quelque chose afin de se livrer à un achat ou à une vente, qui y puise de l’eau qu’il ne s’était pas préparée pour lui-même le sixième jour, ou qui soulève une charge pour l’emporter hors de sa tente ou de sa maison, mourra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: un travail
  rationale: Le terme désigne ici une activité ou un ouvrage interdit le jour concerné; « travail » est naturel et cohérent avec le contexte sabbatique.
- source_word: ይመት
  choice: mourra
  rationale: Rend directement la sanction formulée au mode verbal du texte, sans ajouter l’agent de l’exécution.
- source_word: ዘይፄምና
  choice: qui profane
  rationale: Dans ce contexte cultuel, « profaner » exprime mieux que « souiller » la violation du caractère sacré du jour.
- source_word: ይስክብ፡ ምስለ፡ ብእሲት
  choice: couche avec une femme
  rationale: Formulation française actuelle et digne qui conserve le sens sexuel direct de l’expression.
- source_word: ሠይጥ፡ ወተሣይጦ
  choice: un achat ou une vente
  rationale: Le couple lexical renvoie aux deux faces d’une transaction commerciale; la formulation préserve leur distinction.
- source_word: ማየ፡ ይቀድሕ
  choice: puise de l’eau
  rationale: Rend précisément l’action de tirer ou puiser de l’eau.
- source_word: አንሥአ፡ ዘይጸውር
  choice: soulève une charge
  rationale: Conserve l’action concrète de lever ce qui doit être porté, sans généraliser en simple transport.
- source_word: ደብተራሁ
  choice: sa tente
  rationale: Équivalent contextuel direct, maintenu distinct de « sa maison » dans la coordination suivante.
theological_decisions:
- issue: Portée de la peine de mort
  choice: Répéter « mourra » au début et à la fin de l’énumération
  alternative: Ne l’énoncer qu’une fois ou préciser « sera mis à mort »
  rationale: La répétition reflète la structure emphatique du texte et ne tranche pas la question de savoir si la forme décrit une peine judiciaire ou simplement l’issue prescrite.
- issue: Nature de l’interdiction sexuelle
  choice: « qui couche avec une femme »
  alternative: « qui a des relations conjugales »
  rationale: Le texte parle d’une femme sans préciser le statut matrimonial; une formulation plus étroite importerait une interprétation absente de la source.
- issue: Sens cultuel de la violation du jour
  choice: « profane ce jour »
  alternative: « souille ce jour »
  rationale: « Profaner » conserve l’idée que le jour est consacré tout en évitant d’expliquer davantage la théologie sous-jacente.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération juridique de la source est conservée, avec une ponctuation qui en facilite la lecture. Aucun astérisque de l’édition critique n’est reproduit, puisqu’il relève de son appareil éditorial et non du contenu continu du verset.
