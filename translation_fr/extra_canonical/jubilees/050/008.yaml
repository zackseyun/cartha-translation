revisions:
- from: Et l’homme qui y accomplit un travail quelconque mourra. Tout homme qui profane ce jour, qui couche avec une femme, qui dit qu’il y réglera une affaire afin de faire du commerce, qu’il s’agisse d’un achat ou d’une vente, qui y puise de l’eau qu’il ne s’était pas préparée le sixième jour, ou qui soulève une charge pour l’emporter hors de sa tente ou de sa maison, mourra.
  to: Et l’homme qui y accomplit un travail quelconque mourra. Tout homme qui profane ce jour, qui couche avec une femme, qui dit qu’il y fera quelque chose afin de se livrer à un achat ou à une vente, qui y puise de l’eau qu’il ne s’était pas préparée pour lui-même le sixième jour, ou qui soulève une charge pour l’emporter hors de sa tente ou de sa maison, mourra.
  rationale: La révision remplace une expression qui interprétait l’action annoncée comme le règlement d’une affaire par une formulation qui rend directement la déclaration d’accomplir quelque chose ce jour-là en vue d’acheter ou de vendre. Elle explicite aussi « pour lui-même », présent dans la source. Le reste du texte est conservé.
