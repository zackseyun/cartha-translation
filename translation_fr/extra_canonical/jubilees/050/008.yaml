    issue: « dit qu’il y réglera une affaire »
    rationale: Cette formulation ne rend pas explicitement l’idée de dire qu’on fera une action ce jour-là et peut suggérer un règlement ou une gestion d’affaire. Le texte source, comme l’audit anglais, associe cette déclaration à l’intention de se livrer à un achat ou une vente.
  revised_text: Et l’homme qui y accomplit un travail quelconque mourra. Tout homme qui profane ce jour, qui couche avec une femme, qui dit qu’il y fera quelque chose afin de se livrer à un achat ou à une vente, qui y puise de l’eau qu’il ne s’était pas préparée pour lui-même le sixième jour, ou qui soulève une charge pour l’emporter hors de sa tente ou de sa maison, mourra.
