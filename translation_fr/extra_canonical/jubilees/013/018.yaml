  text: And it was grievous in his heart that his brother’s son had been separated from him, for he had no children.
translation:
  language: fr
  text: Et il en eut le cœur affligé, parce que le fils de son frère avait été séparé de lui, car il n’avait pas d’enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአእከዮ፡ በልቡ፡
  choice: Et il en eut le cœur affligé
  rationale: Rend naturellement en français l’idée que la situation lui fut pénible intérieurement, tout en conservant la mention explicite du cœur.
- source_word: ተፈልጠ፡
  choice: avait été séparé
  rationale: Le passif du texte guèze est conservé sans préciser l’agent ni la cause de la séparation.
- source_word: ወልደ፡ እኁሁ፡
  choice: le fils de son frère
  rationale: Traduction directe de la relation familiale exprimée dans la source.
- source_word: አልቦ፡ ውሉደ፡
  choice: il n’avait pas d’enfants
  rationale: Formulation française courante qui respecte le pluriel générique et n’ajoute aucune précision de genre.
theological_decisions:
- issue: Lien entre l’absence d’enfants et l’affliction causée par la séparation
  choice: Conserver la simple relation causale introduite par « car »
  alternative: Expliciter que le neveu tenait lieu de fils
  rationale: Le texte indique que l’absence d’enfants motive l’affliction, mais ne formule pas explicitement une relation filiale de substitution.
translation_notes:
  register: Français moderne, digne et accessible. La tournure garde le cœur comme siège de l’affliction et préserve le passif, ainsi que l’ambiguïté sur l’agent de la séparation.
