revisions:
- from: Alors Pharaon renvoya Saraï, femme d’Abram, et chassa celui-ci du pays d’Égypte. Abram se rendit à l’endroit où il avait dressé sa tente la première fois, au lieu de l’autel, entre Béthel à l’ouest et Aï à l’est, et il bénit le SEIGNEUR, son Dieu, qui l’avait ramené en paix.
  to: Alors Pharaon renvoya Saraï, la femme d’Abram, et le chassa du pays d’Égypte. Abram se rendit à l’endroit où il avait dressé sa tente la première fois, à l’endroit de l’autel, entre Béthel à l’ouest et Aï à l’est, et il bénit le SEIGNEUR, son Dieu, qui l’avait ramené en paix.
  rationale: 'La révision est limitée à deux améliorations sûres de français : elle remplace une expression spatiale ambiguë par « à l’endroit de l’autel » et simplifie la reprise d’Abram par « le chassa ». Elle conserve l’ordre, les repères géographiques, la distinction entre le site initial de la tente et celui de l’autel, ainsi que la formulation théologique du texte source.'
