  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: fr
  text: Alors Pharaon renvoya Saraï, la femme d’Abram, et le chassa du pays d’Égypte. Abram se rendit à l’endroit où il avait dressé sa tente la première fois, à l’endroit de l’autel, entre Béthel à l’ouest et Aï à l’est, et il bénit le SEIGNEUR, son Dieu, qui l’avait ramené en paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአገብአ፡ ፈርዖን፡ ሦራሃ
  choice: Alors Pharaon renvoya Saraï
  rationale: Le verbe exprime le fait de faire repartir ou de renvoyer; « renvoya » convient au contexte et distingue cette action de l’expulsion d’Abram qui suit.
- source_word: ወአፍለሶ
  choice: et chassa celui-ci
  rationale: Le verbe a ici une force d’éloignement ou d’expulsion. « celui-ci » indique sans lourdeur qu’Abram est le référent masculin.
- source_word: ኀበ፡ ተከለ፡ ደብተራሁ፡ እንተ፡ ቀዳማ
  choice: à l’endroit où il avait dressé sa tente la première fois
  rationale: Rend directement le retour au premier emplacement de la tente dans un français naturel.
- source_word: ውስተ፡ መካን፡ ምሥዋዕ
  choice: au lieu de l’autel
  rationale: Conserve l’ordre de la source, qui mentionne le lieu de l’autel avant les repères géographiques.
- source_word: አጌ፡ እምጽባሓ፡ ወቤቴል፡ እምባሕር
  choice: entre Béthel à l’ouest et Aï à l’est
  rationale: Les expressions sémitiques liées au coucher et au lever du soleil sont naturellement rendues par « ouest » et « est »; l’identification des lieux suit le contexte géographique.
- source_word: ወባረከ፡ ለእግዚአብሔር፡ አምላኩ
  choice: et il bénit le SEIGNEUR, son Dieu
  rationale: « bénit » conserve la formulation cultuelle de la source; « SEIGNEUR » suit la convention française pour le nom divin dans ce contexte.
- source_word: ዘገብ፡ በሰላም
  choice: qui l’avait ramené en paix
  rationale: Rend l’idée d’un retour accompli sous l’action divine, avec « en paix » au sens de sauf et sans dommage.
theological_decisions:
- issue: Sens de la bénédiction adressée à Dieu
  choice: « il bénit le SEIGNEUR »
  alternative: « il loua le SEIGNEUR »
  rationale: La traduction garde le verbe théologiquement chargé « bénir » plutôt que de l’interpréter par « louer ».
- issue: Représentation du nom divin
  choice: « le SEIGNEUR »
  alternative: « le Seigneur » ou une translittération du tétragramme
  rationale: La forme en petites capitales typographiques est représentée ici par des capitales et suit une convention biblique française largement intelligible, sans imposer une vocalisation du nom divin.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les répétitions spatiales de la source sont légèrement lissées sans supprimer les deux indications distinctes: l’ancien emplacement de la tente et le lieu de l’autel. Aucun marqueur de note n’est requis.'
