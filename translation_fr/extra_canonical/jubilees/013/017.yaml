  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: fr
  text: 'Et il dit : « Tu es le Dieu Très-Haut, mon Dieu pour toujours et à jamais. » Et, la septième année de cette semaine, Loth se sépara de lui et s’établit à Sodome ; et les habitants de Sodome étaient de très grands pécheurs.'
