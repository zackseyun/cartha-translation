lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: le Dieu Très-Haut
  rationale: Rend naturellement le titre divin tout en conservant sa valeur superlative.
- source_word: ለዓለመ፡ ዓለም
  choice: pour toujours et à jamais
  rationale: Conserve l’intensification de la formule éthiopienne désignant une durée sans fin.
- source_word: በ፯ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: La septième année de cette semaine-là
  rationale: Le chiffre et la formulation de la source indiquent la septième année d’une période de sept ans.
- source_word: ተፈልጠ፡ ሎጥ፡ እምኔሁ
  choice: Loth se sépara de lui
  rationale: Reproduit le sens relationnel et laisse l’antécédent du pronom implicite comme dans le contexte source.
- source_word: ኀደረ፡ ሎጥ፡ ውስተ፡ ሰዶም
  choice: s’établit à Sodome
  rationale: Expression française idiomatique pour le fait de demeurer ou de prendre résidence dans la ville.
- source_word: ሰብአ፡ ሰዶም
  choice: les habitants de Sodome
  rationale: Dans ce contexte collectif, « habitants » est naturel en français et n’impose pas une lecture exclusivement masculine.
- source_word: ኃጥኣን፡ ጥቀ
  choice: de très grands pécheurs
  rationale: Rend à la fois le substantif « pécheurs » et l’intensif « très », dans un français naturel.
theological_decisions:
- issue: Identification de Dieu par le titre « Très-Haut »
  choice: le Dieu Très-Haut
  alternative: Dieu, le Très-Haut
  rationale: La forme retenue garde le titre étroitement lié au nom divin sans ajouter d’explication doctrinale.
- issue: Qualification morale des habitants de Sodome
  choice: de très grands pécheurs
  alternative: très pécheurs
  rationale: Le substantif de la source est préservé, sans préciser la nature de leurs péchés ni importer une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et lisible. La structure narrative est légèrement fluidifiée sans effacer les répétitions significatives ni résoudre l’antécédent implicite de « lui ».
