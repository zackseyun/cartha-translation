  yaml_path: translation/extra_canonical/jubilees/013/026.yaml
  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
translation:
  language: fr
  text: 'Cette loi n’est soumise à aucune limite de temps, car il l’a établie pour toutes les générations, à jamais, afin qu’ils donnent au SEIGNEUR la dîme de tout : des récoltes[a], du vin et de l’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « récoltes » signifie littéralement « semence » ; dans ce contexte, il désigne probablement les produits ou le rendement des cultures, et non seulement les graines mises de côté pour les semailles.
    reason: cultural_note
lexical_decisions:
- source_word: ሕግ
  choice: loi
  rationale: Rend directement le terme juridique guèze et maintient le lien avec l’obligation de la dîme.
- source_word: ወሰነ፡ መዋዕል
  choice: limite de temps
  rationale: Littéralement « limite de jours » ; cette formulation française naturelle exprime une durée au-delà de laquelle la loi cesserait de s’appliquer.
- source_word: ሠርዖ
  choice: il l’a établie
  rationale: Reflète l’idée d’instituer ou d’ordonner une règle sans préciser davantage l’identité du sujet implicite.
- source_word: ዓሥራተ
  choice: la dîme
  rationale: Le nom français usuel exprime exactement le dixième prescrit par le texte.
- source_word: ዘርእ
  choice: récoltes
  rationale: Bien que le sens premier soit « semence », le contexte de la dîme agricole indique vraisemblablement les produits ou le rendement des cultures.
theological_decisions:
- issue: Identité du sujet de « il l’a établie »
  choice: Conserver le pronom « il » sans explicitation
  alternative: « Dieu l’a établie » ou « le Seigneur l’a établie »
  rationale: Le texte source emploie un sujet verbal implicite ; nommer explicitement Dieu ou le Seigneur lèverait une implicitation que le verset conserve.
- issue: Représentation du nom divin
  choice: SEIGNEUR en petites capitales typographiques simulées par des capitales
  alternative: Seigneur
  rationale: Cette convention distingue le titre divin dans la traduction tout en restant conforme à l’équivalent traditionnel du terme guèze እግዚአብሔር.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « limite de temps » évite le calque peu naturel « limite de jours », tandis que « pour toutes les générations, à jamais » préserve l’insistance du texte sur la permanence de la prescription.
