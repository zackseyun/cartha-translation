revisions:
- from: '« Donne-nous les personnes que tu as sauvées, mais garde les biens pour toi. » Abram lui répondit : « J’ai levé la main vers le Dieu Très-Haut : d’un simple fil jusqu’à une courroie de sandale, je ne prendrai rien de tout ce qui est à toi, afin que tu ne puisses pas dire : “C’est moi qui ai enrichi Abram.” Je ne prendrai que ce que les jeunes gens ont mangé. Quant à la part des hommes qui sont allés avec moi — Aunan[a], Eshkol et Mamré —, qu’ils prennent leur part. »'
  to: '« Donne-nous les personnes que tu as sauvées, mais garde les biens pour toi. » Abram lui répondit : « J’ai levé la main vers Dieu Très-Haut : d’un fil jusqu’à une lanière de sandale, je ne prendrai rien de tout ce qui est à toi, afin que tu ne puisses pas dire : “C’est moi qui ai enrichi Abram.” À l’exception seulement de ce que les jeunes gens ont mangé, et de la part des hommes qui sont allés avec moi — Aunan[a], Eshkol et Mamré — : qu’ils prennent leur part. »'
  rationale: 'La révision supprime un ajout non attesté et reformule l’exception finale afin de préserver sa portée : Abram renonce au butin, hormis la consommation des jeunes gens et les parts qui reviennent à ses compagnons. Elle conserve les choix source-fidèles « Donne-nous » et « Aunan », ainsi que la note correspondante.'
