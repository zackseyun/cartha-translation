  yaml_path: translation/extra_canonical/jubilees/013/029.yaml
  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
translation:
  language: fr
  text: '« Donne-nous les personnes que tu as sauvées, mais garde les biens pour toi. » Abram lui répondit : « J’ai levé la main vers Dieu Très-Haut : d’un fil jusqu’à une lanière de sandale, je ne prendrai rien de tout ce qui est à toi, afin que tu ne puisses pas dire : “C’est moi qui ai enrichi Abram.” À l’exception seulement de ce que les jeunes gens ont mangé, et de la part des hommes qui sont allés avec moi — Aunan[a], Eshkol et Mamré — : qu’ils prennent leur part. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze porte « Aunan » ; le personnage correspondant est appelé « Aner » en Genèse 14.
    reason: Signaler une variation réelle du nom propre sans harmoniser le texte principal avec la tradition de la Genèse.
lexical_decisions:
- source_word: ጸግወነ
  choice: Donne-nous
  rationale: La forme guèze porte un suffixe de première personne du pluriel (« nous »). Elle ne doit pas être harmonisée avec la forme au singulier de Genèse 14:21.
- source_word: ነፍሰ
  choice: les personnes
  rationale: Le terme signifie littéralement « âmes/vies » mais désigne ici les personnes délivrées; « personnes » est naturel et précis en français.
- source_word: አነሣእ፡ እደየ
  choice: J’ai levé la main
  rationale: Rend directement le geste solennel du serment, avec le singulier « la main » attesté par le texte.
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ
  choice: d’un simple fil jusqu’à une courroie de sandale
  rationale: Conserve le mérisme allant d’un objet infime à un autre, tout en donnant une tournure idiomatique française.
- source_word: አውናን
  choice: Aunan
  rationale: Translittère la forme du nom propre telle qu’elle apparaît dans le témoin guèze, sans la remplacer silencieusement par la forme biblique plus connue « Aner ».
theological_decisions:
- issue: Formule de serment elliptique (« si je prends… »)
  choice: je ne prendrai rien
  alternative: si je prends quoi que ce soit
  rationale: Dans ce contexte de serment, la proposition conditionnelle équivaut à un refus solennel. La formulation retenue communique clairement cette force sans ajouter de contenu théologique.
- issue: Motif du refus d’Abram
  choice: 'afin que tu ne puisses pas dire : « C’est moi qui ai enrichi Abram »'
  alternative: 'de peur que tu ne dises : « J’ai enrichi Abram »'
  rationale: 'La traduction préserve l’enjeu explicite du texte : Abram refuse que le roi puisse s’attribuer son enrichissement.'
translation_notes:
  register: Français international moderne, fluide et digne. Le discours direct conserve le ton solennel du serment. La variation « donne-nous » et la forme onomastique « Aunan » suivent prioritairement le texte guèze.
