lexical_decisions:
- source_word: ኢይትኍለቍ
  choice: sera innombrable
  rationale: Le verbe exprime littéralement l’impossibilité de compter. Cette formulation française conserve le raccord avec la proposition précédente, dont le sujet se trouve dans le contexte.
- source_word: አንሶሱ
  choice: parcours
  rationale: L’impératif désigne le fait d’aller et venir à travers le pays; « parcours » est naturel et rend l’étendue du déplacement.
- source_word: ውስተ፡ ኑኃ፡ ወርኅባ
  choice: dans toute sa longueur et sa largeur
  rationale: Rend les deux dimensions du pays tout en exprimant idiomatiquement l’idée de le parcourir dans son étendue entière.
- source_word: ወርኢ፡ ኵሎ
  choice: et vois-le tout entier
  rationale: Conserve l’impératif « vois » et l’idée englobante de « tout », avec un référent explicite naturel en français.
