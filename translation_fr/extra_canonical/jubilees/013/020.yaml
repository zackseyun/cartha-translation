  text: For all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also
translation:
  language: fr
  text: Car tout le pays que tu vois, je te le donnerai, à toi et à ta descendance, pour toujours. Je rendrai ta descendance semblable au sable de la mer. Si un homme peut compter la poussière de la terre, alors ta descendance aussi…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase reste en suspens dans ce verset et se poursuit au verset 21.
    reason: Le texte source place le verbe qui complète la proposition dans le verset suivant; la note prévient que l’inachèvement est intentionnel.
lexical_decisions:
- source_word: ምድር
  choice: pays
  rationale: Dans le contexte d’un don territorial, « pays » exprime naturellement le sens de la terre vue et promise.
- source_word: ዘርእ
  choice: descendance
  rationale: Le terme désigne ici la postérité d’Abraham; « descendance » est actuel, collectif et conserve la portée du texte.
- source_word: እስከ፡ ለዓለም
  choice: pour toujours
  rationale: Cette tournure rend clairement la durée indéfinie ou perpétuelle exprimée par le guèze.
- source_word: ኆፃ፡ ባሕር
  choice: sable de la mer
  rationale: L’image maritime appelle naturellement « sable ».
- source_word: ኆፃ፡ ምድር
  choice: poussière de la terre
  rationale: Le même nom peut désigner le sable ou la poussière; avec « terre », « poussière » restitue l’image traditionnelle et le contraste contextuel.
- source_word: ይክል
  choice: peut
  rationale: 'Le verbe exprime la capacité dans une proposition conditionnelle: « Si un homme peut compter… »'
theological_decisions:
- issue: Durée du don du pays
  choice: pour toujours
  alternative: à jamais
  rationale: « Pour toujours » conserve sans atténuation la force temporelle du texte, sans préciser davantage la manière dont la promesse doit être comprise.
- issue: Clause finale grammaticalement suspendue
  choice: alors ta descendance aussi…
  alternative: alors ta descendance aussi peut être comptée
  rationale: Le verset guèze s’arrête après « ta descendance aussi »; le verbe négatif qui achève la pensée se trouve au verset suivant. Ajouter ici « peut être comptée » contredirait cette continuation et résoudrait à tort la tension créée par la division des versets.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « descendance » maintient la cohésion de la promesse. Les points de suspension signalent clairement, sans compléter artificiellement la syntaxe, que la phrase continue au verset suivant.
