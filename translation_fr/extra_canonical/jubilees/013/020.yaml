  terminology: « Pays » convient dans le contexte d’un don territorial, et « descendance » rend bien le collectif guèze pour la postérité. « Sable de la mer » et « poussière de la terre » conservent les deux images distinctes du texte source. Aucun terme théologique n’est surinterprété.
