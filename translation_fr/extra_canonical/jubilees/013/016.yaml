  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
translation:
  language: fr
  text: Lors du quarante et unième jubilé, la troisième année de la première semaine, il revint en ce lieu, y offrit un sacrifice et invoqua le nom du Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብአ፡ ውስተዝ፡ መካን
  choice: il revint en ce lieu
  rationale: ገብአ exprime ici le retour, conformément au contexte du retour d’Abram, tandis que ዝ désigne « ce » lieu.
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ
  choice: y offrit un sacrifice
  rationale: La proposition décrit l’offrande d’un sacrifice sur ce lieu; « y » rend naturellement en français la référence locative de በዲቤሁ.
- source_word: ወጸውዐ፡ በስመ፡ እግዚአብሔር
  choice: et invoqua le nom du Seigneur
  rationale: Formule biblique usuelle qui conserve l’idée d’appeler ou d’invoquer le nom divin.
theological_decisions:
- issue: Rendu du nom divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « le Seigneur » est un rendu français digne et largement intelligible, sans imposer une reconstruction particulière du nom divin.
