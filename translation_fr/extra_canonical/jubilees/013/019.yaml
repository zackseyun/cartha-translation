  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
translation:
  language: fr
  text: 'Cette année-là, lorsque Loth eut été fait prisonnier, le Seigneur dit à Abram, après que Loth se fut séparé de lui, dans la quatrième année de cette semaine[a] : « Lève les yeux depuis l’endroit où tu habites et regarde vers le nord, le sud, l’ouest et l’est,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, une « semaine » désigne une période de sept ans.
    reason: La chronologie des Jubilés compte les années par semaines d’années; une brève explication évite une lecture comme semaine de sept jours.
lexical_decisions:
- source_word: ተፄወወ
  choice: eut été fait prisonnier
  rationale: Le verbe exprime ici la capture de Loth; cette formulation française rend clairement l’état de captivité sans ajouter de détails.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Titre divin naturel et digne en français, correspondant au terme guèze sans importer une forme confessionnelle particulière.
- source_word: ዘዝሱባዔ
  choice: de cette semaine
  rationale: Le texte emploie le vocabulaire de la semaine dans la chronologie propre aux Jubilés; la traduction conserve cette formulation plutôt que de l’expliciter dans le corps du verset.
- source_word: ባሕር፡ ወጽባሕ
  choice: l’ouest et l’est
  rationale: Littéralement « la mer et le levant »; dans cette énumération des directions, les équivalents géographiques naturels en français sont « l’ouest et l’est ».
theological_decisions:
- issue: Rendu du titre divin እግዚአብሔር
  choice: le Seigneur
  alternative: l’Éternel
  rationale: « Le Seigneur » représente directement le titre du texte guèze et évite d’introduire un choix traditionnel propre à certaines versions françaises.
- issue: Portée chronologique de « la quatrième année de cette semaine »
  choice: Conserver la syntaxe et expliquer « semaine » en note
  alternative: Reformuler « la quatrième année de cette période de sept ans »
  rationale: Le texte associe cette indication au moment de la parole divine, mais sa formulation reste compacte; la conserver respecte la structure chronologique et littéraire de l’œuvre.
translation_notes:
  register: Français moderne, courant et digne. Le plus-que-parfait littéraire (« eut été », « se fut ») marque clairement l’antériorité sans alourdir excessivement la phrase. La citation reste ouverte à la fin du verset, puisqu’elle se poursuit au verset suivant.
