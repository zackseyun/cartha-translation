  text: for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,
translation:
  language: fr
  text: « car je le donnerai à ta descendance. » Abram se rendit à Hébron et s’y établit. Cette année-là, Kedorlaomer, roi d’Élam, vint, ainsi qu’Amraphel, roi de Shinéar, et Ariok, roi d’Ellasar,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዘርእከ
  choice: à ta descendance
  rationale: Le terme désigne collectivement la postérité; « descendance » est naturel en français moderne et conserve la valeur collective du singulier.
- source_word: እሁብ
  choice: je le donnerai
  rationale: Le futur à la première personne est conservé; le pronom reprend le territoire évoqué dans le contexte précédent.
- source_word: ወኀደረ፡ ህየ
  choice: et s’y établit
  rationale: Dans ce contexte résidentiel, le verbe exprime le fait de demeurer ou de s’installer; « s’y établit » rend naturellement cette idée.
- source_word: መጽአ
  choice: vint avec
  rationale: Le verbe signifie « venir ». L’ajout syntaxique de « avec » relie en français les trois rois coordonnés sans transformer leur relation en subordination.
- source_word: ኬብሮን
  choice: Hébron
  rationale: Forme française biblique usuelle du toponyme.
- source_word: ኮዶላጎሞር
  choice: Kedorlaomer
  rationale: Transcription française reconnaissable du nom royal, proche de la forme biblique courante.
- source_word: ሴናአር
  choice: Shinéar
  rationale: Forme française biblique courante du nom géographique, distincte d’une identification interprétative avec Babylone.
- source_word: ሴላሰር
  choice: Ellasar
  rationale: Forme française conventionnelle du toponyme, sans tenter une identification géographique incertaine.
theological_decisions:
- issue: Référent de la promesse « je le donnerai »
  choice: Conserver le pronom « le »
  alternative: Expliciter « je donnerai ce pays »
  rationale: Le texte source dépend du contexte pour son complément. Garder le pronom préserve cette cohésion et évite une explicitation absente du verset.
- issue: Sens collectif de « semence »
  choice: « descendance »
  alternative: « postérité » ou « semence »
  rationale: « Descendance » maintient le sens collectif sans imposer une lecture christologique ou strictement individuelle; « semence » serait peu naturel ici en français moderne.
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms propres suivent des formes bibliques françaises reconnaissables. La phrase reste ouverte par une virgule finale, conformément au découpage fourni, puisque l’énumération se poursuit vraisemblablement au verset suivant.
