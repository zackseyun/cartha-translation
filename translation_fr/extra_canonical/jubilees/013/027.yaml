  text: and from cattle and from sheep. And he gave it to his priests to eat and to drink with rejoicing.
translation:
  language: fr
  text: Et du gros bétail et des moutons. Et il en donna à ses prêtres pour manger et boire dans la joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምአልህምት
  choice: sur le gros bétail
  rationale: Le terme désigne les bovins ou, plus largement, le gros bétail. La préposition እም, répétée devant les deux catégories, est ici comprise dans un sens partitif lié au contexte précédent.
- source_word: እምአባግዕ
  choice: sur les moutons
  rationale: አባግዕ désigne les ovins; « moutons » est le terme français courant et collectif.
- source_word: ለካህናቲሁ
  choice: à ses prêtres
  rationale: Le suffixe possessif est conservé, sans préciser davantage l’identité ou la fonction de ces prêtres.
- source_word: በፍሥሓ
  choice: dans la joie
  rationale: Le nom exprime la joie ou l’allégresse; cette tournure naturelle conserve la valeur circonstancielle de la préposition.
theological_decisions:
- issue: Référence aux « prêtres » d’Abram
  choice: ses prêtres
  alternative: les prêtres
  rationale: Le texte porte explicitement un suffixe possessif. La traduction le maintient sans harmonisation théologique ni explication de leur statut.
- issue: Objet donné aux prêtres
  choice: il en donna
  alternative: il le donna
  rationale: Le pronom « en » renvoie naturellement, en français, à une part prélevée sur les biens mentionnés et évite d’identifier artificiellement un objet singulier précis.
translation_notes:
  register: Français moderne, clair et digne. L’ouverture fragmentaire par « Et » est maintenue parce que le verset poursuit syntaxiquement le contexte antérieur. « Puis » rend la reprise narrative sans lourdeur.
