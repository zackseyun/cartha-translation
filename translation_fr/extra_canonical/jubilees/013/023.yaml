  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
translation:
  language: fr
  text: Et Targal[a], roi des nations ; ils tuèrent le roi de Gomorrhe, tandis que le roi de Sodome s’enfuit, et beaucoup tombèrent dans le bitume de la vallée des Sodomites[b], près de la mer Salée. Ils capturèrent Sodome, Adma et Seboïm. Ils firent aussi prisonnier Loth, fils du frère d’Abram, avec tous ses biens, puis allèrent jusqu’à Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En guèze : Targāl, nom correspondant à Tidal en Genèse 14,1.'
    reason: lexical_choice
  - marker: b
    text: 'Le guèze dit littéralement : « dans l’huile ou le bitume de la vallée des Sodomites ». Cette formulation correspond aux « puits de bitume dans la vallée de Siddim » de Genèse 14,10. Charles (1902) jugeait le texte corrompu et proposait une lecture signifiant « par des blessures », mais le texte guèze peut se comprendre comme une forme de la tradition de la Genèse.'
    reason: textual_critical
lexical_decisions:
- source_word: ተርጋል
  choice: Targal
  rationale: Translittération directe du nom guèze Targāl, sans le remplacer silencieusement par la forme biblique Tidal.
- source_word: ወጐየ
  choice: s’enfuit
  rationale: Le verbe guèze signifie ici « fuir » et a pour sujet le roi de Sodome; il ne signifie ni « régna » ni « fut chassé ».
- source_word: በቀብአ
  choice: dans le bitume
  rationale: Qab’a désigne normalement l’huile ou un onguent, mais, dans ce contexte parallèle à Genèse 14.10, il représente le bitume. La traduction garde le substantif du texte sans ajouter « fosses » dans le corps du verset.
- source_word: ሰዶማውያን
  choice: des Sodomites
  rationale: Le guèze porte explicitement « Sodomites », et non « Siddim »; cette leçon est donc conservée malgré le parallèle de Genèse 14.10.
- source_word: ፄወዉ / ፄወውዎ
  choice: capturèrent / emmenèrent aussi captif
  rationale: Le même champ verbal de la captivité est rendu idiomatiquement selon que l’objet est une ville ou une personne.
- source_word: ጥሪቶ
  choice: ses biens
  rationale: Expression française naturelle pour l’ensemble des possessions de Loth.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le début abrupt avec « Et Targal » est conservé parce qu’il prolonge une énumération commencée dans le contexte précédent. Les noms propres suivent les formes françaises usuelles lorsqu’elles existent (Gomorrhe, Sodome, Loth), tandis que Targal reflète directement le guèze.
