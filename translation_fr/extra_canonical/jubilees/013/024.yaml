  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
translation:
  language: fr
  text: 'Un rescapé vint annoncer à Abram que le fils de son frère avait été fait prisonnier. Alors Abram arma les serviteurs nés dans sa maison…[a] À Abram et à sa descendance incombe la première dîme pour le Seigneur[b]. Le Seigneur en fit une prescription perpétuelle : ils devaient la donner aux prêtres qui servent devant lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte est difficile et paraît ici fortement comprimé. Après « arma les serviteurs nés dans sa maison », le récit passe brusquement à l’institution de la dîme; une partie plus développée du récit se trouvait probablement à cet endroit.
    reason: segmentation_note
  - marker: b
    text: 'Littéralement, la proposition est sans verbe : « Sur Abram et sur sa descendance, la première dîme pour le Seigneur. » L’expression guèze inhabituelle peut aussi se comprendre comme « la dîme principale » ou comme une première dîme liée aux prémices.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ዚድኅነ
  choice: un rescapé
  rationale: Le participe désigne celui qui a échappé au désastre; « un rescapé » est naturel et précis en français moderne.
- source_word: ተፄወወ፡ ወልደ፡ እኁሁ
  choice: le fils de son frère avait été fait prisonnier
  rationale: Rend explicitement la relation de parenté exprimée par le guèze sans remplacer celle-ci par « neveu », terme plus interprétatif.
- source_word: አስተረሰየ፡ ልደ፡ ቤቱ
  choice: arma les serviteurs nés dans sa maison
  rationale: Le contexte correspond à la mobilisation des gens nés dans la maison d’Abram; « arma » exprime naturellement leur préparation au combat.
- source_word: ዐሥራተ፡ ቀዳሚ
  choice: la première dîme
  rationale: Traduction formellement proche de l’expression inhabituelle; une note conserve les autres possibilités lexicales.
- source_word: ይትቀነዩ፡ ቅድሜሁ
  choice: qui servent devant lui
  rationale: Formulation cultuelle claire qui préserve l’idée d’un service accompli en présence du Seigneur.
theological_decisions:
- issue: Nature de l’obligation de la dîme pesant sur Abram et sa descendance
  choice: À Abram et à sa descendance incombe la première dîme
  alternative: Il imposa la première dîme à Abram et à sa descendance
  rationale: La proposition guèze est sans verbe et ne nomme aucun sujet qui imposerait la dîme. « incombe » rend l’obligation sans introduire artificiellement un agent.
- issue: Destinataires de la dîme
  choice: les prêtres qui servent devant lui
  alternative: les prêtres qui exercent leur ministère devant lui
  rationale: « servent » reste proche du lexique source et n’ajoute aucune conception confessionnelle particulière du ministère sacerdotal.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative demeure simple, tandis que « prescription perpétuelle » conserve le registre juridique et religieux du passage. Les points de suspension signalent la rupture réelle du texte transmis plutôt que de la masquer.
