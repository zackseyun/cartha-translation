  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: fr
  text: Siméon, Benjamin et Hénok, fils de Ruben, sortirent vers le côté ouest de la tour, et cinquante étaient avec eux. Ils tuèrent quatre cents vaillants combattants d’Édom et des Horites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጸ፡ ዐረቢሁ
  choice: du côté ouest
  rationale: L’expression désigne la face ou le côté occidental; cette formulation est naturelle en français tout en conservant l’indication spatiale.
- source_word: ማኅፈድ
  choice: la tour
  rationale: Le contexte et la tradition textuelle soutiennent le sens de « tour ».
- source_word: ጽኑዓነ፡ መስተቃትላነ
  choice: vaillants combattants
  rationale: Rend à la fois l’idée de vigueur ou de bravoure et celle d’hommes aptes au combat, sans la répétition peu naturelle d’une traduction strictement littérale.
- source_word: ኤዶማ፡ ኤዶም፡ ወኤዶማ፡ ሖሬዎን
  choice: d’Édom et des Horites
  rationale: La séquence semble comporter des marques casuelles ou une répétition autour d’Édom; le sens transmis est celui de combattants appartenant à Édom et aux Horites.
