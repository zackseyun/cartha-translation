  text: And the sons of Jacob subdued the sons of Esau on Mount Seir, and they bowed their necks so that they might become servants.
translation:
  language: fr
  text: Les fils de Jacob soumirent les fils d’Ésaü sur le mont Séir, et ceux-ci courbèrent la nuque afin de devenir leurs serviteurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መገብዎሙ
  choice: soumirent
  rationale: Le verbe exprime ici l’idée d’assujettir ou de réduire sous son autorité; « soumirent » rend naturellement le contexte militaire et politique.
- source_word: አትሐቱ፡ ክሳዶሙ
  choice: courbèrent la nuque
  rationale: Conserve l’image corporelle du texte guèze, qui marque la soumission.
- source_word: አግብርተ
  choice: serviteurs
  rationale: Le terme désigne des personnes placées au service ou sous la dépendance d’autrui. « Serviteurs » préserve cette portée sans imposer plus précisément le statut juridique d’esclaves.
