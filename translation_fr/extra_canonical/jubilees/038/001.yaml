  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
translation:
  language: fr
  text: 'Après cela, Juda parla à Jacob, son père, et lui dit : « Tends ton arc, père, et décoche tes flèches ; abats l’ennemi et tue l’adversaire. Que tu aies de la force, car nous ne tuerons pas ton frère : il est ton compagnon et il est comme toi. Rendons-lui honneur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du verset est textuellement difficile. La traduction suit une restitution probable : « nous ne tuerons pas ton frère », « il est ton compagnon » et « il est comme toi ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ምስከ፡ ቀስተከ
  choice: Tends ton arc
  rationale: Le verbe exprime ici l’action de tendre ou bander l’arc, et non simplement de le prendre.
- source_word: ፈኑ፡ አሕፃከ
  choice: décoche tes flèches
  rationale: ፈኑ porte l’idée d’envoyer ou de lancer; dans le contexte du tir à l’arc, « décocher » est naturel et précis.
- source_word: ወንደፍ፡ ጸላኢ፡ ወቅትል፡ ፀረዊ
  choice: abats l’ennemi et tue l’adversaire
  rationale: La formulation conserve le parallélisme martial entre l’ennemi jeté à terre et l’adversaire mis à mort.
- source_word: ወይኩን፡ ለከ፡ ኀይለ
  choice: Que la force soit avec toi
  rationale: Cette tournure française restitue naturellement le souhait exprimé par la construction existentielle guèze.
- source_word: ንህቦ፡ ለክብር
  choice: Rendons-lui honneur
  rationale: Dans la lecture corrigée du passage difficile, le pronom renvoie au frère; la formulation française évite l’expression moins naturelle « donnons-lui de l’honneur ».
