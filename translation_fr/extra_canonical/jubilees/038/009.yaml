  text: 'And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Add footnote: "Ge''ez reads Adufim, likely a scribal corruption of Adurim.". And the sons of Jacob pursued them as far as Mount Seir.'
translation:
  language: fr
  text: Six cents hommes s’enfuirent, et quatre des fils d’Ésaü s’enfuirent avec eux. Ils laissèrent leur père mort, comme il était tombé, dans la région montagneuse qui se trouve à Adourim[a]. Les fils de Jacob les poursuivirent jusqu’au mont Séir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le guèze porte « Adoufim », probablement une altération de copiste pour « Adourim ».
    reason: La leçon effective du texte source diffère de l’émendation géographique retenue dans le corps du verset.
lexical_decisions:
- source_word: ጕዩ
  choice: s’enfuirent
  rationale: Le verbe exprime ici la fuite; la répétition du texte source est conservée pour distinguer les six cents hommes des quatre fils d’Ésaü.
- source_word: ውስተ፡ ወገር
  choice: dans la région montagneuse
  rationale: Cette expression désigne ici un territoire ou relief montagneux; cette formulation française reste naturelle sans réduire le sens à une seule colline.
- source_word: አዱፊም
  choice: Adourim[a]
  rationale: Le texte principal retient l’émendation géographique couramment proposée, tout en signalant avec transparence la leçon guèze Adoufim en note.
- source_word: ደብረ፡ ሴኢር
  choice: mont Séir
  rationale: Rendu français traditionnel et intelligible du toponyme, avec la valeur de ደብር comme montagne ou mont.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Hommes » est ajouté après « six cents » pour rendre explicite en français le groupe humain sous-entendu par le contexte. La formulation « là où il était tombé » conserve le lien entre la mort du père et le lieu de sa chute.
