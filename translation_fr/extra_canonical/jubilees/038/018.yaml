  text: His city was Danaba. And Balaq died, and Jobab son of Zarah from Boser reigned in his place.
translation:
  language: fr
  text: Sa ville était Danaba. Balaq mourut, et Jobab, fils de Zérah, originaire de Boser, régna à sa place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Sa ville était Danaba. Balaq mourut, et Jobab, fils de Zérah, originaire de Boser, régna après lui. »'
    reason: Conserve l’ancienne formulation possible de ህየንቴሁ tout en maintenant la première phrase attestée par la source guèze.
lexical_decisions:
- source_word: ሀገሩ
  choice: Sa ville
  rationale: Le nom ሀገር, avec suffixe possessif, désigne ici la ville qui lui appartenait ou lui était associée; « Sa ville » restitue directement la construction.
- source_word: ወልደ፡ ዛራ
  choice: fils de Zérah
  rationale: La formule généalogique est rendue naturellement en français tout en conservant le nom propre sous une forme biblique française courante.
- source_word: ዘእም፡ ቦሴር
  choice: originaire de Boser
  rationale: La séquence exprime la provenance; « originaire de » est plus idiomatique que le calque « de Boser » et évite de confondre lieu d’origine et filiation.
- source_word: ህየንቴሁ
  choice: à sa place
  rationale: Le terme indique la substitution ou la succession dans la fonction, et non simplement une postériorité chronologique.
theological_decisions:
- issue: Nature de la succession exprimée par ህየንቴሁ
  choice: régna à sa place
  alternative: régna après lui
  rationale: « À sa place » traduit plus précisément l’idée de remplacement, tandis que « après lui » ne marque que la succession temporelle; l’autre possibilité est signalée en note sans enjeu doctrinal ajouté.
translation_notes:
  register: Français moderne, sobre et narratif. Les noms propres sont francisés avec modération; « Boser » suit la forme de la tradition consultée. Le marqueur de note est placé immédiatement après la proposition concernée.
