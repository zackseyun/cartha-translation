lexical_decisions:
- source_word: ቀበሮ (qabarō)
  choice: enterra
  rationale: Le verbe guèze signifie « enterrer » ou « ensevelir »; « enterra » est ici naturel et précis.
- source_word: ወገር (wagar)
  choice: montagne
  rationale: Le terme désigne une montagne ou une hauteur. « Montagne » conserve le détail topographique explicite du texte source, contrairement à « région ».
- source_word: አዱፊም (Adūfīm)
  choice: Adourim
  rationale: Le toponyme est rendu sous la forme française usuelle correspondant à l’Adurim de la couche de consultation; la graphie du témoin guèze semble présenter une variation.
- source_word: ወገብአ፡ ውስተ፡ ቤቱ (wa-gabʾa wəsta bētu)
  choice: puis il retourna chez lui
  rationale: Expression française naturelle pour « et il retourna dans sa maison », sans perte de sens.
