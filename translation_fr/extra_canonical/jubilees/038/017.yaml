lexical_decisions:
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: jusqu’à ce jour
  rationale: Rend directement l’expression temporelle guèze tout en conservant son idiome naturel en français.
- source_word: በምድረ፡ ኤዶም
  choice: dans le pays d’Édom
  rationale: « Pays » exprime naturellement ምድር dans ce contexte territorial.
- source_word: ወነግሠ
  choice: Et … régna
  rationale: Conserve la conjonction initiale et le sens royal du verbe, avec un ordre français naturel.
- source_word: ባላቅ፡ ወልደ፡ ቤዖር
