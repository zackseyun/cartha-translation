  rationale: Translittération française usuelle des noms et traduction directe de la filiation.
- source_word: ወስመ
  choice: et sa ville s’appelait
  rationale: La séquence guèze fournie s’interrompt après « et le nom de… »; la formulation complète est établie par la leçon de consultation auditée, qui conserve la suite du verset attestée dans l’édition indiquée.
- source_word: Denaba
  choice: Denaba
  rationale: Conserve le toponyme transmis dans la suite du verset par la couche de consultation auditée.
