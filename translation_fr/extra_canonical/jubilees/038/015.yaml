  text: And the sons of Edom have not cast off the yoke of servitude that the twelve sons of Jacob had laid upon them, to this day.
translation:
  language: fr
  text: 'Et les fils d’Édom n’ont pas rejeté le joug de servitude que les douze[a] fils de Jacob leur avaient imposé, jusqu’à ce jour.


    [a] Le texte guèze fourni présente ici une suite de signes numéraux manifestement altérée. La leçon « les douze fils de Jacob », retenue par l’édition critique et conforme au contexte, est probablement le texte original.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze fourni présente ici une suite de signes numéraux manifestement altérée. La leçon « les douze fils de Jacob », retenue par l’édition critique et conforme au contexte, est probablement le texte original.
    reason: Signaler avec transparence la corruption apparente des signes numéraux dans la source fournie et justifier la leçon adoptée.
lexical_decisions:
- source_word: ኢነገኁ
  choice: n’ont pas rejeté
  rationale: Dans ce contexte, le verbe exprime l’idée de se défaire du joug; « rejeter » conserve l’image sans alourdir la phrase.
- source_word: አርዑተ፡ ቅኔ
  choice: le joug de servitude
  rationale: Rend directement la métaphore du joug et la condition de dépendance exprimée par ቅኔ.
- source_word: ሠርዑ ... ላዕሌሆሙ
  choice: leur avaient imposé
  rationale: Expression française naturelle correspondant à l’idée d’établir ou de placer un joug sur eux.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: jusqu’à ce jour
  rationale: Formule temporelle traditionnelle, claire et fidèle.
theological_decisions:
- issue: Nombre des fils de Jacob
  choice: les douze fils de Jacob
  alternative: les quatorze et quinze fils de Jacob
  rationale: La chaîne numérale du texte guèze fourni est manifestement corrompue ou issue d’une erreur de transcription/OCR. La leçon critique « douze » est cohérente avec l’identité bien établie des fils de Jacob et évite de transformer une corruption matérielle en affirmation du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique du « joug de servitude » est conservée; la syntaxe reste fluide et évite un calque maladroit.
