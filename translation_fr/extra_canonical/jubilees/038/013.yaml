  yaml_path: translation/extra_canonical/jubilees/038/013.yaml
  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
translation:
  language: fr
  text: Jacob envoya dire à ses fils de faire la paix. Ils firent la paix avec eux et leur imposèrent le joug de la servitude, afin qu’ils paient tribut[a] à Jacob et à ses fils tous leurs jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soient au service de Jacob et de ses fils ».'
    reason: Conserve l’alternative traditionnelle plus générale (« servir ») tout en maintenant, dans le texte principal, le sens plus précis de paiement d’un tribut; le complément « Jacob et ses fils » est intégralement préservé.
lexical_decisions:
- source_word: ወለአከ፡ ያዕቆብ፡ ኀበ፡ ውሉዱ
  choice: Jacob envoya dire à ses fils
  rationale: Rend naturellement en français le mouvement exprimé par « envoyer vers », sans ajouter de contenu au message.
- source_word: ይግበሩ፡ ሰላመ
  choice: faire la paix
  rationale: Expression française courante correspondant directement à la formule guèze.
- source_word: አርዑተ፡ ቅኔ
  choice: le joug de la servitude
  rationale: Conserve l’image concrète du joug et la notion d’assujettissement ou de service imposé.
- source_word: ይጽብሑ
  choice: paient tribut
  rationale: Le verbe désigne ici le versement d’un tribut ou d’une taxe, sens plus précis qu’un simple service.
- source_word: ኵሎ
  choice: tous les jours de leur vie
  rationale: Dans ce contexte temporel, cette formulation idiomatique exprime une obligation durable et correspond à « tous leurs jours ».
theological_decisions:
- issue: Nature de l’obligation imposée après la paix
  choice: paient tribut
  alternative: servent Jacob
  rationale: Le sens fiscal ou tributaire du verbe source est privilégié, tandis que la traduction plus générale par « servir » est conservée en note afin de ne pas masquer l’ancienne lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « paix » et l’image du « joug » sont maintenues. Le premier mot du segment fourni, ይቀትልዎሙ (« qu’ils les tuent »), est traité comme la fin de la phrase ou du verset précédent d’après la segmentation attestée et n’est donc pas intégré à Jubilés 38.13.
