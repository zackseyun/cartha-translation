  text: And again he shot an arrow, and it struck Adoran the Aramean in the left breast, and he drove him back and killed him.
translation:
  language: fr
  text: De nouveau, il décocha une flèche. Elle atteignit Adoran l’Araméen à la poitrine, du côté gauche ; il le repoussa et le tua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈነወ፡ ሐጸ
  choice: décocha une flèche
  rationale: L’expression guèze décrit l’envoi d’une flèche ; « décocher » est l’expression française naturelle et précise dans un récit de combat.
- source_word: አዶራንሃ፡ አረማዊ
  choice: Adoran l’Araméen
  rationale: Le nom propre est translittéré « Adoran » et l’ethnique est rendu directement par « l’Araméen ».
- source_word: ጥቦ፡ ፀጋማዊ
  choice: au côté gauche de la poitrine
  rationale: La formulation conserve l’indication anatomique du côté gauche tout en restant idiomatique en français.
- source_word: ወሰደዶ
  choice: il le repoussa
  rationale: Le verbe exprime l’idée de chasser ou faire reculer ; « repoussa » préserve ce mouvement sans le préciser davantage.
- source_word: ወቀተሎ
  choice: et le tua
  rationale: Traduction directe du dernier verbe, qui indique la mise à mort.
