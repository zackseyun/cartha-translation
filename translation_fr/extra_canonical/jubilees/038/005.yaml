  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: fr
  text: Juda sortit le premier, accompagné de Nephtali et de Gad, ainsi que de cinquante serviteurs. Ils se dirigèrent vers le côté sud de la tour, tuèrent tous ceux qu’ils trouvèrent devant eux, et personne ne leur échappa, pas même un seul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹመ
  choice: le premier
  rationale: Dans ce contexte narratif, le terme qualifie la position ou la priorité de Juda dans la sortie; «le premier» rend naturellement ce sens en français.
- source_word: ወ፶ደቅ
  choice: ainsi que de cinquante serviteurs
  rationale: Le nombre est cinquante; «serviteurs» suit la compréhension contextuelle du groupe accompagnant les frères, sans préciser davantage leur statut.
- source_word: እንተ ገጸ ደቡብ ለማኅፈድ
  choice: vers le côté sud de la tour
  rationale: Rend l’orientation spatiale et le rapport avec la tour dans un français clair et idiomatique.
- source_word: ወአልቦ ዘአምለጠ እምኔሆሙ ወአሐዱኒ
