  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
translation:
  language: fr
  text: Baelunan, fils d’Akbur, mourut, et Adath régna à sa place. La femme d’Adath s’appelait Mayṭabigo, fille de Maṭarego, fille de Metebedzaab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  choice: à sa place
  rationale: Rend précisément l’idée de succession « à sa place » ou « à sa place à lui », plutôt que la simple postériorité « après lui ».
- source_word: መይጠቢጎ
  choice: Mayṭabigo
  rationale: Transcrit la consonne ይ présente dans la graphie guèze.
- source_word: ነግሠ
  choice: régna
  rationale: Correspond au verbe guèze exprimant l’exercice de la royauté.
