lexical_decisions:
- source_word: ሶቤ
  choice: Alors
  rationale: Rend naturellement l’indication temporelle « à ce moment-là / alors » dans le fil narratif.
- source_word: ወሰቀ፡ ያዕቆብ፡ ቀስተ
