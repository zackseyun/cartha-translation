- source_word: ወነደፎ፡ ለዔሳው፡ እኁሁ
  choice: atteignit son frère Ésaü
  rationale: Conserve explicitement le lien fraternel et rend l’impact du projectile sans ajout interprétatif.
- source_word: ጥቦ፡ የማናዊ
  choice: au côté droit de la poitrine
  rationale: Formulation française claire qui conserve l’indication anatomique et latérale du texte guèze.
- source_word: ወገደሎ
  choice: et le tua
  rationale: Traduction directe de l’issue mortelle exprimée par le verbe.
