  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
translation:
  language: fr
  text: Asam mourut, et Adath, fils de Barad, qui frappa Madian dans la campagne de Moab, régna à sa place. Sa ville s’appelait Avith.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  choice: à sa place
  rationale: Le terme signifie « à sa place » ou « à sa place en qualité de successeur », et non simplement « après lui ».
- source_word: ዘቀተለ፡ ምዕድያምሃ
  choice: qui avait frappé Madian
  rationale: Cette formulation garde la portée assez large du verbe, qui peut désigner le fait de battre ou de tuer, sans préciser davantage que la source.
- source_word: በሐቅለ፡ ሞአብ
  choice: dans la campagne de Moab
  rationale: « Campagne » rend naturellement le champ ou territoire ouvert désigné par ሐቅል dans ce contexte géographique.
- source_word: ወስመ
  choice: Sa ville s’appelait
  rationale: La proposition, poursuivie dans la tradition textuelle attestée et reflétée par la couche de consultation, donne le nom de la ville royale.
