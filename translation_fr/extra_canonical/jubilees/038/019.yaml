lexical_decisions:
- source_word: ሞተ
  choice: mourut
  rationale: Rend directement le verbe guèze « mourir » dans un registre narratif digne et naturel.
- source_word: ነግሠ
  choice: régna
  rationale: Conserve le sens royal explicite du verbe, plutôt qu’une formulation plus vague comme « lui succéda ».
- source_word: ህየንቴሁ
  choice: à sa place
  rationale: Exprime précisément l’idée de remplacement ou de succession en lieu et place de Jobab, et non simplement une succession chronologique.
- source_word: ዘእም፡ ደብረ፡ ቴማን
  choice: du pays montagneux de Témân
  rationale: « Pays montagneux » rend naturellement la valeur géographique de ደብረ dans ce contexte; « Témân » est la forme française du toponyme biblique.
