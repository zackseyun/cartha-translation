lexical_decisions:
- source_word: ደቀ
  choice: serviteurs
  rationale: Dans ce parallélisme avec አዋልደ, le terme désigne les serviteurs de sexe masculin; le français emploie naturellement « serviteurs ».
- source_word: አዋልደ
  choice: servantes
  rationale: Le terme féminin parallèle est rendu par « servantes ».
- source_word: ቀንአ
  choice: jalousèrent
  rationale: Le verbe exprime ici la jalousie ou l’envie éprouvée envers Jacob; « jalousèrent » conserve directement cette nuance.
- source_word: አስተጋብአ
  choice: rassembla
  rationale: Le causatif indique que Laban réunit ou regroupa son troupeau, sans ajouter l’idée non exprimée qu’il l’emmena.
- source_word: አባግዒሁ
  choice: ses moutons
  rationale: Le nom désigne les ovins de Laban; « ses moutons » est clair et courant dans ce contexte narratif.
