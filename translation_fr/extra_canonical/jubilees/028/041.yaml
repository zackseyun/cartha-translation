lexical_decisions:
- source_word: ይእቲኒ
  choice: Elle aussi
  rationale: Le pronom féminin singulier accompagné de l’enclitique « aussi » marque le parallèle narratif avec l’action précédente; cette place préserve naturellement l’accent du guèze.
- source_word: ዜልፋሃ
  choice: Zilpa
  rationale: Forme française usuelle du nom propre biblique Zilpah.
- source_word: ለአኪታ
  choice: sa servante
  rationale: Rend le terme désignant une servante attachée à sa maîtresse, sans ajouter une nuance sociale absente du bref énoncé.
- source_word: ብእሲተ
  choice: pour femme
  rationale: Expression française naturelle qui conserve le statut conjugal explicitement indiqué par le texte.
- source_word: ወፀንሰት፡ ወወለደት
  choice: Zilpa devint enceinte et enfanta
  rationale: Les verbes féminins renvoient naturellement à Zilpa; la répétition du nom évite en français une ambiguïté pronominale avec le sujet féminin de la première proposition.
