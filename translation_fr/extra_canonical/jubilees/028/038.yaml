  text: 'The sixth: in the sixth year of the third week, Jacob again went in to Bilhah, and she conceived.'
translation:
  language: fr
  text: 'Le sixième[a] : durant la sixième année de la troisième semaine, Jacob s’unit de nouveau à Bilha, et elle devint enceinte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Sixième ». Il s’agit probablement du sixième fils dans la suite des naissances.'
    reason: L’ordinal initial est isolé dans le texte guèze; la note conserve son caractère elliptique tout en indiquant sa fonction probable.
lexical_decisions:
- source_word: ሳድስ
  choice: Le sixième
  rationale: Conserve le terme ordinal isolé qui ouvre le texte et semble poursuivre le décompte des naissances, sans ajouter explicitement « fils », absent du texte.
- source_word: ዓመት፡ ዘሱባዔ
  choice: année de la … semaine
  rationale: Rend le système chronologique propre aux Jubilés, où une « semaine » désigne un cycle de sept ans.
- source_word: ደገመ፡ … ወቦአ፡ ኀበ፡ ባላ
  choice: s’unit de nouveau à Bilha
  rationale: Exprime naturellement en français l’euphémisme sexuel « entrer auprès de », tout en conservant l’idée de répétition portée par ደገመ et ካዕበ.
- source_word: ወፀንሰት
  choice: et elle devint enceinte
  rationale: Traduction directe et idiomatique de la conception.
