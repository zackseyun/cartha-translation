  text: And he served him for his daughter Rachel one week.
translation:
  language: fr
  text: Et il le servit une semaine pour Rachel, qui était sa fille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire une semaine d’années, soit sept ans.
    reason: Clarifie pour le lecteur moderne la valeur chronologique de « semaine » sans supprimer la formulation distinctive du texte source.
lexical_decisions:
- source_word: ወተቀንየ፡ ሎቱ፡ (wa-taqannaya lotu)
  choice: Et il le servit
  rationale: Rend le verbe « servir » avec son complément pronominal, en conservant la construction sobre du ge'ez.
- source_word: ህየንተ፡ ራሔል፡ ወለቱ፡ (ḫeyanta Rāḥel walatu)
  choice: pour sa fille Rachel
  rationale: Conserve explicitement ወለቱ, « sa fille », et rend ህየንተ par « pour » dans le sens du service accompli afin d'obtenir Rachel.
- source_word: ሱባዔ፡ አሐደ፡ (subāʿē ʾaḥada)
  choice: pendant une semaine
  rationale: Traduit littéralement l'unité chronologique caractéristique des Jubilés, « une semaine », plutôt que d'en expliciter silencieusement la valeur de sept années.
theological_decisions:
- issue: Valeur chronologique de « semaine »
  choice: Conserver « une semaine » dans le texte
  alternative: « sept ans »
  rationale: Le texte source emploie la terminologie des semaines; l'explicitation en années est utile en note, mais la remplacer dans le corps du texte effacerait le mode de datation propre au livre.
translation_notes:
  register: Français moderne, clair et digne. La tournure concise suit de près le ge'ez, tandis que « pendant » rend naturellement la durée en français.
