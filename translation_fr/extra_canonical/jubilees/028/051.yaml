translation:
  language: fr
  text: 'Joseph[a] — Jacob dit à Laban : « Donne-moi mes femmes et mes enfants ; j’irai chez mon père Isaac et je ferai[b]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom « Joseph » semble achever une proposition commencée dans le segment précédent. Le texte présent ne dit pas : « Quand Joseph fut né ».'
    reason: Signaler la coupure de segmentation sans introduire dans le texte des mots absents du guèze.
  - marker: b
    text: La proposition demeure inachevée dans ce segment ; la suite fournit vraisemblablement le complément du verbe « faire ».
    reason: Préserver le sens attesté du verbe et l’inachèvement matériel du segment.
lexical_decisions:
- source_word: ዮሴፍ
  choice: Joseph
  rationale: Le segment transmis ne contient que le nom « Joseph » ; il n’explicite ni sa naissance ni une proposition temporelle.
- source_word: ሀበኒ
  choice: Donne-moi
  rationale: Impératif direct correspondant naturellement à la demande adressée à Laban.
- source_word: አንስትየየ፡ ወውሉድየ
  choice: mes femmes et mes enfants
  rationale: Rend les noms avec leurs suffixes possessifs de première personne.
- source_word: ወእሖር፡ ኀበ፡ አቡየ፡ ይስሐቅ
  choice: j’irai chez mon père Isaac
  rationale: « Chez » exprime naturellement en français le mouvement vers la demeure ou la présence du père, sans ajouter l’idée de retour absente du verbe.
- source_word: ወእግበር
  choice: et je ferai
  rationale: Le verbe ገብረ signifie « faire » ; le traduire par « je retournerai » confondrait ce lexème avec un autre verbe. Le complément attendu se trouve vraisemblablement au-delà de la coupure.
