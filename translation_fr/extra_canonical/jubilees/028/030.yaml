lexical_decisions:
- source_word: ቀዳማዊ
  choice: Le premier
  rationale: Le terme signifie « premier » au masculin et semble reprendre un élément du verset précédent; la traduction conserve cette forme elliptique plutôt que de l’omettre ou de préciser artificiellement son référent.
- source_word: በሳድስ፡ ዓመት፡ ዘዝ፡ ሱባዔ
  choice: la sixième année de cette semaine
  rationale: Rend directement la datation selon la semaine d’années propre au contexte des Jubilés.
- source_word: ወደገመ፡ ያዕቆብ፡ ወቦአ፡ ኀቤሃ
  choice: Jacob alla de nouveau vers elle
  rationale: « Aller vers/entrer auprès d’elle » est ici un euphémisme relationnel; cette formulation française reste naturelle tout en préservant la retenue du texte.
- source_word: ወፀንሰት
  choice: et elle devint enceinte
  rationale: Traduction idiomatique et précise du verbe exprimant la conception.
