translation:
  language: fr
  text: Elle donna un fils à Jacob, et il l’appela Ruben, le quatorzième jour du mois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits précisent : « du neuvième mois ».'
    reason: La leçon « neuvième » est attestée dans une partie de la tradition manuscrite, mais elle est absente du texte guèze fourni.
lexical_decisions:
- source_word: ወወለደት፡ ለያዕቆብ፡ ወልደ፡
  choice: Elle donna un fils à Jacob
  rationale: Rend naturellement le verbe féminin « elle enfanta » et la relation exprimée par le complément « à Jacob », sans perdre le sens de la naissance.
- source_word: ወጸውዐ፡ ስሞ፡ ሮቤል፡
  choice: et il l’appela Ruben
  rationale: 'Le verbe est à la troisième personne masculine du singulier : Jacob est donc présenté comme celui qui donne le nom. « L’appela » est l’équivalent français naturel de « appela son nom ».'
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡
  choice: le quatorzième jour du mois
  rationale: Le texte fourni indique le quatorzième jour « du mois » sans préciser lequel.
