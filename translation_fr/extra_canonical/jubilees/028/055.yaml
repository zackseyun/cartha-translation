  text: every speckled, spotted, and white one that was born among the goats would be his wages. And they bore
translation:
  language: fr
  text: Parmi les chèvres, tout animal moucheté[a], tacheté ou blanc qui naîtrait serait son salaire. Et elles mirent bas
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cendré ».
    reason: Le terme guèze ሐመደ peut évoquer soit une couleur de cendre, soit une robe mouchetée.
lexical_decisions:
- source_word: እምአጣሊ (ʾəm-ʾaṭāli)
  choice: parmi les chèvres
  rationale: አጣሊ désigne les chèvres, et non les agneaux ; la préposition እም exprime ici l’origine ou l’appartenance au groupe.
- source_word: ሐመደ (ḥamada)
  choice: moucheté
  rationale: Le terme est lié à l’idée de cendre et peut décrire une robe cendrée ou parsemée de petites marques ; « moucheté » convient au contexte des robes animales tout en préservant une distinction avec ጋሰ.
- source_word: ጋሰ (gāsa)
  choice: tacheté
  rationale: Ce terme décrit une robe marquée de taches ; « tacheté » est naturel en français et reste distinct de « moucheté ».
- source_word: ጸዐዳ (ṣaʿāda)
  choice: blanc
  rationale: Sens direct du terme de couleur guèze.
- source_word: ዐስቦ (ʿasbo)
  choice: son salaire
  rationale: Le mot désigne la rémunération ou le salaire reçu en contrepartie d’un travail.
- source_word: ወይወልዱ (wa-yawaldū)
  choice: Et elles mirent bas
  rationale: Le verbe pluriel signifie enfanter ou mettre bas ; le féminin français renvoie naturellement aux chèvres. Le segment demeure ouvert, conformément à la division du passage fourni.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Tout animal » évite d’ajouter un sexe ou un âge que le texte source ne précise pas. La phrase finale reste volontairement inachevée, puisque le segment source se termine sur « Et elles mirent bas ».
