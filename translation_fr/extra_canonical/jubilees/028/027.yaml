  text: Léa conçut et enfanta à Jacob un second fils. Jacob l’appela Siméon, le vingt et unième jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡ ለያዕቆብ፡ ወልደ፡ ካልአ፡
  choice: conçut et donna à Jacob un deuxième fils
  rationale: Rend les verbes féminins et l’expression indiquant un second fils dans un français naturel, tout en conservant Jacob comme bénéficiaire de la naissance.
- source_word: ወጸውዐ፡ ስሞ፡ ስምዖን፡
  choice: Il l’appela Siméon
  rationale: Le verbe guèze est à la troisième personne du masculin singulier; le sujet est donc Jacob, sans harmonisation avec le récit de la Genèse.
- source_word: አመ፡ ፲ሥራ፡
  choice: le vingt et unième jour
  rationale: L’expression calendaire est rendue explicitement; le contexte éditorial et la couche anglaise auditée confirment le vingt et unième jour.
theological_decisions:
- issue: Identité de la personne qui donne son nom à Siméon
  choice: 'Jacob : « Il l’appela »'
  alternative: 'Léa : « Elle l’appela »'
  rationale: La morphologie masculine de ጸውዐ doit être préservée, même si elle diffère du récit correspondant de la Genèse; cette particularité rédactionnelle ne doit pas être effacée.
translation_notes:
  register: Français international moderne, simple et digne. La coordination initiale a été omise pour que le verset autonome soit naturel. Deux phrases évitent une longue coordination et rendent sans ambiguïté le changement de sujet entre Léa et Jacob.
