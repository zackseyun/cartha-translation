lexical_decisions:
- source_word: በሠርቅ፡ ወርኅ፡ ራብዕ
  choice: à la nouvelle lune du quatrième mois
  rationale: Dans cette formule chronologique, ሠርቅ désigne le commencement ou la nouvelle lune du mois; le texte ne comporte pas l’expression «quatrième jour».
- source_word: በሳድስ፡ ዓመት፡ በሱባዔ፡ ዝንቱ፡ ራብዕ
  choice: durant la sixième année de cette quatrième semaine
  rationale: Rend directement l’année située à l’intérieur de la quatrième période de sept ans, tout en conservant le terme traditionnel «semaine» propre à la chronologie des Jubilés.
- source_word: ወበመዋዕለ፡ ተወልደ
  choice: Et aux jours où il naquit…
  rationale: La tournure en état construit introduit une proposition dépendante qui se poursuit au verset suivant; les points de suspension signalent cette continuité sans transformer le membre en phrase indépendante.
