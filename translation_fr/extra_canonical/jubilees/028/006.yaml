  text: 'Mais Jacob ne le savait pas, car elle avait l’apparence de Rachel. Il s’unit à elle, et voici :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢያእመረ
  choice: ne le savait pas
  rationale: Rend directement le verbe « savoir/connaître » à la forme négative, le pronom reprenant l’identité réelle de la femme.
- source_word: አምሳለ፡ ያዕቆብ፡ ዘራሔል፡ ይእቲ
  choice: elle avait l’apparence de Rachel
  rationale: Le texte guèze transmis paraît présenter une difficulté interne autour du second « Jacob »; le sens contextuel assuré est que la femme ressemblait à Rachel. Cette formulation suit cette valeur sans ajouter explicitement l’idée subjective « il pensait ».
- source_word: ቦአ፡ ኀቤሃ
  choice: Il s’unit à elle
  rationale: Littéralement « il entra auprès d’elle/vers elle », euphémisme sémitique désignant ici l’union sexuelle; la traduction française naturelle en restitue clairement le sens.
- source_word: ናሁ
  choice: et voici
  rationale: Conserve la formule déictique et narrative, même si le verset se termine sur une attente syntaxique.
