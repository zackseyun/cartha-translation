  text: And the Lord remembered Rachel and opened her womb, and she conceived and bore a son, and she called his name
translation:
  language: fr
  text: Et le Seigneur se souvint de Rachel[a] et ouvrit son sein. Elle devint enceinte, mit au monde un fils et lui donna le nom de…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le texte guèze fourni, le verbe « se souvint de » n’est pas exprimé explicitement : on lit littéralement, après « le Seigneur », « pour Rachel, et il ouvrit son sein ». « Se souvint de » est une restitution appuyée par le contexte et par Genèse 30.22.'
    reason: Signaler avec neutralité la difficulté textuelle tout en expliquant la restitution retenue.
  - marker: b
    text: La phrase reste inachevée dans le texte source fourni.
    reason: Préserver la limite du fragment au lieu de compléter le nom à partir d’un autre texte.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Titre divin courant et digne en français biblique moderne.
- source_word: አርኀወ ማኅፀና
  choice: ouvrit son sein
  rationale: Conserve l’image corporelle du texte source sans employer la formulation aujourd’hui plus clinique « ouvrit son utérus ».
- source_word: ፀንሰት
  choice: elle devint enceinte
  rationale: Expression naturelle correspondant au sens de « concevoir ».
- source_word: ወጸውዐት ስሞ
  choice: et lui donna le nom de
  rationale: Rend idiomatiquement la formule sémitique « elle appela son nom », tout en maintenant la proposition inachevée.
theological_decisions:
- issue: Le souvenir divin à l’égard de Rachel
  choice: se souvint de Rachel
  alternative: agit en faveur de Rachel
  rationale: La formule traditionnelle, cohérente avec Genèse 30.22 et la couche de consultation anglaise, exprime l’intervention fidèle de Dieu sans laisser entendre qu’il avait simplement oublié Rachel.
- issue: Agent de l’ouverture du sein
  choice: le Seigneur… ouvrit son sein
  alternative: son sein s’ouvrit
  rationale: Le texte attribue explicitement l’action au Seigneur; la traduction conserve cette affirmation théologique sans l’atténuer.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation clarifie la succession des actions. Les points de suspension conservent explicitement la fin tronquée du verset.
