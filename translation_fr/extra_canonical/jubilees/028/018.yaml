  rationale: Rend l’injonction au singulier suivie de l’expression désignant une période de sept jours, sans ajouter d’idée absente du texte.
- source_word: ግዝአ፡ ለዛ
  choice: des noces de celle-ci
  rationale: Le contexte et le texte de consultation indiquent la période nuptiale associée à « celle-ci »; « noces » est une formulation française actuelle et digne qui conserve la référence démonstrative.
