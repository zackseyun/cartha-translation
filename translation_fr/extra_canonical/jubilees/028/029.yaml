  text: Leah conceived and bore him a third son, and he called his name Levi, on the first day of the first month.
translation:
  language: fr
  text: Léa devint enceinte et lui donna un troisième fils. Il l’appela Lévi, au commencement du mois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : à la nouvelle lune du mois ; autre traduction possible : le premier jour du mois.'
    reason: L’expression guèze በሠርቅ ወርኅ admet plusieurs formulations temporelles proches.
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ፡ ወልደ፡ ሣልሰ፡
  choice: devint enceinte et lui donna un troisième fils
  rationale: Rend naturellement les deux verbes féminins « elle conçut et elle enfanta », ainsi que le complément « pour lui » et l’ordre de naissance.
- source_word: ወጸውዐ፡ ስሞ፡ ሌዊ፡
  choice: Il l’appela Lévi
  rationale: 'Le verbe ጸውዐ est à la troisième personne masculine du singulier : le sujet implicite est donc masculin, vraisemblablement Jacob. La tournure française évite le calque « il appela son nom ».'
- source_word: በሠርቅ፡ ወርኅ፡
  choice: au commencement du mois
  rationale: ሠርቅ peut désigner le lever, le début ou la nouvelle lune; avec ወርኅ, l’expression situe l’événement au début du mois sans traduire deux fois la même indication temporelle.
theological_decisions:
- issue: Sujet de l’attribution du nom
  choice: Il l’appela
  alternative: Elle l’appela
  rationale: La morphologie masculine du verbe source doit être conservée, même si les verbes précédents ont Léa pour sujet.
translation_notes:
  register: Français moderne, courant et digne. La ponctuation sépare les actions pour éviter une phrase surchargée. Le nom initial ልያ (« Léa »), qui semble clore ou reprendre le contexte adjacent dans ce découpage, est intégré comme sujet plutôt que rendu isolément.
