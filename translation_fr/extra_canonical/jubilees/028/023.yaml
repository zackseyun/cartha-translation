  text: And he loved Rachel more than Leah, because Leah had been given to him. And the LORD opened Leah’s womb, and she conceived.
translation:
  language: fr
  text: Il aimait Rachel plus que Léa, parce que Léa lui avait été donnée[a]. Le SEIGNEUR ouvrit le sein de Léa, et elle conçut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze fourni commence ici par un fragment : « Rachel, parce que Léa avait été donnée… » Le début de la phrase est rétabli d’après le contexte et la forme attestée du verset; le dernier mot du fragment paraît lui aussi altéré dans cette copie.'
    reason: Signaler honnêtement une lacune de segmentation et une probable corruption textuelle dans la source fournie, tout en donnant un texte principal intelligible.
lexical_decisions:
- source_word: ማኅፀነ (maḥṣana)
  choice: le sein
  rationale: Désigne ici l’organe maternel et, par extension, la capacité de concevoir. « Ouvrit le sein » conserve l’image sémitique tout en restant naturel dans un registre biblique français.
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: le SEIGNEUR
  rationale: Rendu français traditionnel et immédiatement reconnaissable du nom divin dans ce contexte narratif.
- source_word: ፀንሰት (ṣansat)
  choice: elle conçut
  rationale: 'Reproduit avec concision le sens précis du verbe : Léa devint enceinte.'
- source_word: ትውህበት (təwwəhəbät)
  choice: avait été donnée
  rationale: La forme passive féminine se rapporte naturellement à Léa et exprime une action antérieure au récit principal.
theological_decisions:
- issue: Action divine dans la conception
  choice: « Le SEIGNEUR ouvrit le sein de Léa »
  alternative: « Le SEIGNEUR permit à Léa de devenir enceinte »
  rationale: La formulation imagée du texte est conservée sans l’expliciter ni en atténuer l’affirmation de l’action divine.
- issue: Reconstitution du début du verset
  choice: « Il aimait Rachel plus que Léa »
  alternative: 'Commencer par le fragment transmis : « Rachel, parce que Léa… »'
  rationale: Le texte guèze fourni commence manifestement au milieu d’une phrase; la clause rétablie correspond au contexte et à la versification attestée. La difficulté est néanmoins signalée en note plutôt que dissimulée.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple; « le sein » et « conçut » maintiennent la sobriété et l’imagerie du texte ancien sans archaïsme excessif.
