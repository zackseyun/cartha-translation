  text: to my father’s house.” And Laban said to Jacob, “Stay with me for your wages, and pasture my flock for me again.”
translation:
  language: fr
  text: 'à la maison de mon père. » Laban dit à Jacob : « Reste chez moi[a] contre un salaire, et fais de nouveau paître mon troupeau pour moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « demeure auprès de moi » ou « habite avec moi ».'
    reason: Le marqueur présent dans l’édition source accompagne cette expression ; la note conserve sa nuance littérale sans alourdir le texte.
lexical_decisions:
- source_word: ንበር፡ ኀቤየ
  choice: Reste chez moi
  rationale: L’expression signifie littéralement « demeure auprès de moi » ; « reste chez moi » rend naturellement l’invitation de Laban dans ce contexte.
- source_word: በዐስብከ
  choice: en échange de ton salaire
  rationale: Le terme désigne la rémunération ou les gages de Jacob ; cette formulation conserve le lien entre son séjour et sa rétribution.
- source_word: ረዐይ፡ ሊተ፡ ካዕበ፡ መርዔትየ
  choice: fais de nouveau paître mon troupeau pour moi
  rationale: Rend explicitement le verbe pastoral, le bénéficiaire « pour moi », l’adverbe « de nouveau » et le possessif « mon troupeau ».
