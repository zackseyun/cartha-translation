  text: he brings up sin against himself into heaven, and no one who does this thing is righteous, for
translation:
  language: fr
  text: il fait monter jusqu’au ciel un péché à cause de lui-même[a], et personne qui fait cela n’est juste[b], car
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fait monter jusqu’au ciel son péché à sa propre charge » ou « contre lui-même ». Autre compréhension possible : « son péché monte à cause de lui jusqu’au ciel ».'
    reason: La locution peut indiquer la cause, et le contexte peut aussi suggérer que le péché témoigne à la charge de son auteur. La dernière possibilité reflète une lecture intransitive traditionnelle, sans la retenir dans le texte principal.
  - marker: b
    text: 'Ou : « il n’y a aucun juste qui fasse cela ».'
    reason: La construction relative peut être formulée comme un jugement sur toute personne qui accomplit l’acte ou comme l’exclusion de cet acte parmi les justes.
lexical_decisions:
- source_word: አበሳ (ʾabäsa)
  choice: un péché
  rationale: Le nom désigne ici le péché ou la faute que l’auteur de l’acte fait monter jusqu’au ciel.
- source_word: ያዐርግ (yaʿarg)
  choice: il fait monter
  rationale: 'La forme causative appelle un verbe transitif : le sujet fait monter le péché, plutôt que le péché ne monte de lui-même.'
- source_word: በእንቲአሁ (baʾəntiʾahu)
  choice: contre lui-même
  rationale: Dans ce contexte, la locution indique que le péché porté au ciel témoigne à la charge de son auteur; une lecture plus neutre, « à cause de lui », reste possible.
- source_word: ዘንተ ነገረ (zäntä nägära)
  choice: une telle chose
  rationale: Expression française naturelle qui conserve la référence à l’acte évoqué.
- source_word: እስመ (ʾəsmä)
  choice: car
  rationale: La conjonction introduit la justification qui se poursuit au verset suivant.
theological_decisions:
- issue: Rapport entre l’acte commis et la justice de son auteur
  choice: personne parmi ceux qui font une telle chose n’est juste
  alternative: il n’y a aucun juste qui fasse une telle chose
  rationale: La formulation retenue exprime la portée déclarative de la proposition sans trancher davantage la question théologique du statut permanent ou circonstanciel de la personne.
translation_notes:
  register: Français moderne, digne et accessible. Le fragment commence en continuité avec le contexte précédent et se termine par « car », puisque la phrase se poursuit. Les marqueurs [a] et [b] figurent dans le texte.
