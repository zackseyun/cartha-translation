lexical_decisions:
- source_word: ወአንሥአ፡ እገሪሁ
  choice: Il se mit en route
  rationale: L’expression signifie littéralement « il leva ses pieds ». L’équivalent idiomatique français exprime naturellement le départ sans perdre le mouvement narratif.
- source_word: ምድረ፡ ጽባሕ
  choice: au pays de l’Orient
  rationale: Littéralement « pays du levant/matin »; « l’Orient » conserve le sens géographique traditionnel et le registre ancien sans être obscur.
- source_word: ኀበ፡ ላባ
  choice: chez Laban
  rationale: La préposition indique ici la destination auprès d’une personne; « chez » est l’expression française naturelle.
- source_word: ወሀሎ፡ ምስሌሁ
  choice: et il demeura avec lui
  rationale: La tournure exprime le fait de rester auprès de Laban. « Demeura » convient au registre narratif digne et suggère un séjour plutôt qu’une simple présence.
