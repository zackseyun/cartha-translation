lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  choice: une maison pour moi
  rationale: Rend directement l’expression guèze « pour moi, une maison » et respecte la continuité du texte transmis, sans lui substituer la demande de l’épouse tirée du parallèle de la Genèse.
- source_word: ፈጸምኩ፡ ዓመታተ፡
  choice: j’ai achevé les années
  rationale: Conserve l’idée d’avoir mené à leur terme les années requises.
- source_word: ዘተቀነይኩ፡ ለከ፡
  choice: pendant lesquelles je t’ai servi
  rationale: Rend naturellement la relative indiquant les années de service accomplies pour l’interlocuteur.
- source_word: ህየንተ፡ ክልኤቲ፡ አዋልዲከ፡
  choice: pour tes deux filles
  rationale: « pour » exprime ici la contrepartie ou le motif du service; « tes deux filles » traduit explicitement le duel et le possessif.
- source_word: ወአሐውር፡
  choice: et je partirai
  rationale: Le futur français restitue le mouvement projeté; « partir » est plus naturel ici que le littéral « aller ».
theological_decisions:
- issue: Rapport avec le parallèle de Genèse 30.26
  choice: Conserver « une maison pour moi » selon le texte guèze fourni
  alternative: « Donne-moi ma femme »
  rationale: La traduction suit en priorité la leçon guèze attestée dans la source fournie et ne corrige pas le texte d’après son parallèle biblique.
