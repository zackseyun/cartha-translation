  text: She did not bear children, and she said to Jacob, “Give me children.” And Jacob said, “Have I withheld from you?”
translation:
  language: fr
  text: 'Elle n’eut pas d’enfants et dit à Jacob : « Donne-moi des enfants. » Jacob répondit : « Est-ce moi qui t’en ai privée ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትወልድ
  choice: Elle n’eut pas d’enfants
  rationale: La forme négative du verbe « enfanter » est rendue naturellement en français, avec le sujet féminin fourni par le contexte immédiat.
- source_word: ሀበኒ፡ ውሉደ
  choice: Donne-moi des enfants
  rationale: Rend directement l’impératif « donne-moi » et le pluriel « enfants ».
- source_word: ከላእኩ፡ እምኔኪ
  choice: Est-ce moi qui t’en ai privée ?
  rationale: Le verbe exprime l’idée de retenir ou d’empêcher quelque chose d’arriver à quelqu’un ; cette tournure française conserve la question et le complément féminin sans ajouter un agent divin absent du texte transmis.
theological_decisions:
- issue: Agent responsable de l’absence d’enfants
  choice: Ne pas expliciter Dieu comme agent
  alternative: « Est-ce moi qui t’ai refusé des enfants de la part de Dieu ? »
  rationale: Le texte fourni se termine par une question elliptique signifiant littéralement que Jacob aurait retenu ou écarté cela d’elle. Ajouter Dieu résoudrait l’ellipse à partir d’un parallèle biblique plutôt que du texte source donné.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme lexical. La formulation finale restitue l’ellipse de façon intelligible tout en évitant une expansion absente du guèze.
