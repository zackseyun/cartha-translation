lexical_decisions:
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Rendu français traditionnel et naturel du titre divin dans ce contexte.
- source_word: ትጸላእ
  choice: était haïe
  rationale: Conserve le sens fort et la tension du verbe guèze, sans l’atténuer en « délaissée » ou « moins aimée ».
- source_word: ትትፈቀር
  choice: était aimée
  rationale: Le passif maintient le parallélisme explicite avec « était haïe ».
- source_word: ደገመ
  choice: de nouveau
  rationale: Exprime naturellement en français l’idée de répétition.
- source_word: ቦአ ኀበ
  choice: entra auprès de
  rationale: Rend l’expression d’approche à connotation conjugale tout en laissant son complément à Rachel, placé au début du verset suivant dans le découpage de la source.
theological_decisions:
- issue: Force du contraste entre Léa et Rachel
  choice: « Léa était haïe, tandis que Rachel était aimée »
  alternative: « Léa était délaissée, tandis que Rachel était aimée »
  rationale: La formulation retenue respecte la force lexicale et la tension théologique du texte sans l’harmoniser ni l’adoucir.
translation_notes:
  register: Français moderne, digne et accessible. La phrase se termine volontairement par « auprès de », car le complément « Rachel » appartient au verset 27 dans le découpage guèze fourni; le verset est donc conçu pour être lu en continuité avec le suivant.
