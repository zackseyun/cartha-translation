  text: my maidservant; and she will conceive and bear me a son.” And she gave Bilhah her maidservant to be his wife.
translation:
  language: fr
  text: « ma servante ; elle concevra et mettra au monde pour moi un fils. » Puis elle donna Bilha, sa servante, à son mari pour qu’elle devienne sa femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመትየ
  choice: ma servante
  rationale: Le nom désigne une servante appartenant à la locutrice ; ce rendu est naturel et fidèle au contexte.
- source_word: ወትፀንስ ወትወልድ ሊተ ወልደ
  choice: elle concevra et me donnera un fils
  rationale: Conserve les deux actions successives, concevoir et enfanter, tout en exprimant naturellement en français le bénéficiaire marqué par « pour moi ».
- source_word: ባላሃ
  choice: son mari
  rationale: Rend le terme relationnel dans le contexte conjugal sans ajouter le nom de Jacob, absent du segment guèze fourni.
- source_word: ትኩኖ ብእሲተ
  choice: pour qu’elle devienne sa femme
  rationale: Reproduit la construction finale et l’idée explicite qu’elle soit femme/épouse pour lui.
theological_decisions:
- issue: Possible harmonisation avec Genèse 30.3
  choice: Ne pas ajouter « va vers elle » ou « couche avec elle »
  alternative: « ma servante ; va vers elle, et elle concevra »
  rationale: Le segment guèze fourni enchaîne directement « ma servante » et « elle concevra » ; l’ajout, même connu par la tradition de Genèse 30.3, n’est pas attesté ici.
- issue: Statut conjugal de Bilha
  choice: « pour qu’elle devienne sa femme »
  alternative: « comme concubine »
  rationale: Le texte emploie le terme ordinaire pour femme/épouse ; « concubine » préciserait un statut que ce verset ne formule pas explicitement.
translation_notes:
  register: Français international moderne, fluide et digne. La ponctuation initiale signale que le verset commence au milieu d’une citation. Le nom Bilha suit la forme française biblique courante. Aucun ajout harmonisant avec Genèse 30.3.
