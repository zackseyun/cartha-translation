lexical_decisions:
- source_word: አባግዕ
  choice: brebis
  rationale: Le terme désigne ici les ovins du troupeau; « brebis » convient au contexte de reproduction et à la reprise pronominale au féminin.
- source_word: ጋሴ
  choice: mouchetées
  rationale: Rend une robe marquée de petites taches distinctes, en accord avec la différenciation des types de marques dans l’énumération.
- source_word: ትእምርተ፡ ኵስኵሰ
  choice: des marques tachetées
  rationale: Conserve explicitement l’idée de « marques » et celle de taches sans réduire l’expression à une catégorie trop précise.
- source_word: ሐመደ፡ ኵስኵሰ
  choice: des taches sombres
  rationale: Rend la seconde catégorie de taches en maintenant sa distinction par la couleur ou la tonalité foncée.
- source_word: ወይደግማ
  choice: et elles s’accoupleraient de nouveau
  rationale: Le verbe final, dans ce contexte pastoral, exprime une nouvelle reproduction; cette formulation française est naturelle tout en évitant l’incomplétude d’un simple « recommenceraient ».
