lexical_decisions:
- source_word: ወአሐዱ፡ ዘወርኅ፡ ዓሥር
  choice: Le premier jour du dixième mois
  rationale: Le guèze exprime littéralement « et un/premier du dixième mois »; en français courant, la date se formule naturellement ainsi.
- source_word: በሣልስ፡ ዓመት፡ ለዝ፡ ሱባዔ
  choice: dans la troisième année de cette semaine
  rationale: « Semaine » conserve le système chronologique propre aux Jubilés, où il s’agit d’un groupe de sept années.
- source_word: ወደገመ፡ ያዕቆብ፡ ወቦአ
  choice: Jacob entra de nouveau
  rationale: ደገመ marque la répétition (« de nouveau ») et ቦአ signifie « entrer ».
- source_word: ኀበ
  choice: auprès de
  rationale: La préposition indique ici un mouvement vers une personne ou un lieu; la fin du complément manque dans l’extrait fourni.
