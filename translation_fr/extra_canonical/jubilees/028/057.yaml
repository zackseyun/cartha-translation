  text: The sheep bore according to their kinds; and every one with marks belonged to Jacob, and every one without marks to Laban.
translation:
  language: fr
  text: 'Les brebis mirent bas selon leur espèce[a] : toutes celles qui portaient des marques appartenaient à Jacob, et toutes celles qui n’en portaient pas appartenaient à Laban.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon leur type », « selon leur forme » ou « selon leur apparence ».'
    reason: Le mot guèze peut désigner l’espèce ou le type, avec des nuances de forme et d’apparence. La note préserve cette latitude sans faire de l’« aspect » le sens principal dans ce contexte.
lexical_decisions:
- source_word: አባግዐ፡ ይለዳ
  choice: Les brebis mirent bas
  rationale: Le nom explicite le sujet, et le verbe est rendu au passé narratif par une expression française naturelle pour la mise bas des brebis.
- source_word: ዘበአርአያሆን
  choice: selon leur aspect
  rationale: አርአያ peut désigner l’apparence, la forme ou le type. « Aspect » convient au contexte immédiat des marques visibles sans effacer l’ambiguïté lexicale.
- source_word: ትእምርት
  choice: marques
  rationale: Le terme signifie un signe ou une marque; le pluriel français s’accorde naturellement avec les caractéristiques visibles distinguant les troupeaux.
- source_word: ለያዕቆብ … ለላባ
  choice: appartenaient à Jacob … appartenaient à Laban
  rationale: La préposition exprime ici l’attribution ou l’appartenance; le verbe ajouté en français rend cette relation explicite et idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Mirent bas » est l’expression courante et précise pour la naissance chez les brebis; la répétition d’« appartenaient » maintient le parallélisme et évite une ellipse trop abrupte.
