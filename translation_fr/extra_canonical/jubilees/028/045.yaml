lexical_decisions:
- source_word: ወቦአ፡ ያዕቆብ፡ ኀበ፡ ሊያ
  choice: Jacob s’unit à Léa
  rationale: L’expression littérale « entra auprès de Léa » est un euphémisme sémitique désignant l’union sexuelle. « s’unit à » en restitue naturellement le sens en français moderne sans crudité.
- source_word: ወፀንሰት፡ ወወለደት፡ ወልደ
  choice: Elle conçut et mit au monde un fils
  rationale: Rend directement la succession des verbes et le nom « fils », dans un français naturel et digne.
- source_word: ወጸውዐት፡ ስሞ፡ ይሳኮር
  choice: qu’elle appela Issacar
  rationale: « Appeler son nom » signifie ici donner un nom. « Issacar » est la graphie française biblique usuelle.
- source_word: በራብዑ
  choice: le quatrième jour
  rationale: Le substantif « jour » est implicite dans la forme ordinale et est explicité par le contexte éditorial ainsi que par la couche anglaise auditée.
