lexical_decisions:
- source_word: ወለወለት፡ ዲና፡ ስማ፡
  choice: Une fille naquit, et elle reçut le nom de Dina
  rationale: Le texte transmis indique une naissance et précise littéralement « Dina [était] son nom ». Cette formulation française conserve les deux éléments sans ajouter « à lui », absent du guèze.
- source_word: በሳብዕ፡ ወርኅ፡ ዘሳብዕ፡ ዓመት፡ ዘሳድስ፡ ሱባዔ፡ ዘራብዕ፡
  choice: au septième mois de la septième année de la sixième semaine du quatrième jubilé
  rationale: Rend directement et dans leur ordre les indications chronologiques du texte source.
- source_word: ወተሣሀላ፡
  choice: Et il eut compassion d’elle
  rationale: La forme verbale porte un sujet masculin singulier et un objet féminin singulier. « Avoir compassion de » rend naturellement l’idée de miséricorde en français.
theological_decisions:
- issue: Identité du sujet masculin de ወተሣሀላ
  choice: Conserver le pronom « il »
  alternative: Expliciter « Dieu » ou « le Seigneur »
  rationale: Le référent divin est probable dans le contexte, mais aucun nom divin ne figure dans ce segment. Le pronom préserve donc l’implicite du texte sans ajout interprétatif.
- issue: Référent du suffixe féminin dans ወተሣሀላ
  choice: « d’elle »
  alternative: Nommer Rachel ou Dina
  rationale: La grammaire indique un objet féminin, mais le verset isolé ne le nomme pas explicitement. Le pronom préserve cette dépendance contextuelle.
translation_notes:
  register: Français moderne, international et digne. La virgule finale est conservée parce que la proposition se poursuit dans le verset suivant. Aucun marqueur de note n’est nécessaire.
