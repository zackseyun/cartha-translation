  text: And a daughter was born, whose name was Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And He had mercy on her,
translation:
  language: fr
  text: Une fille naquit, nommée Dina, au septième mois de la septième année de la sixième semaine du quatrième jubilé. Et il eut compassion d’elle,
