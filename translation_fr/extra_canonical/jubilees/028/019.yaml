lexical_decisions:
- source_word: ራሔልሃ
  choice: aussi Rachel
  rationale: Le nom Rachel est conservé, et la particule suffixée est rendue par « aussi », conformément au sens contextuel et à la tradition textuelle de ce passage.
- source_word: ካልአነ፡ ዓመተ፡ ሰብዐተ
  choice: encore sept ans
  rationale: L’expression désigne une seconde période de sept ans ; « encore sept ans » l’exprime naturellement en français moderne.
- source_word: ትርዐይ፡ አባግዐየ
  choice: tu fais paître mes brebis
  rationale: Le verbe signifie faire paître ou garder au pâturage, et አባግዐየ désigne les brebis du locuteur.
theological_decisions:
- issue: Rapport entre le don de Rachel et les deux propositions introduites par ከመ
  choice: condition formulée avec deux propositions coordonnées en « si »
  alternative: 'but ou résultat : « afin que tu me serves… afin que tu fasses paître… »'
  rationale: Dans ce contexte contractuel, le français conditionnel restitue clairement que le don de Rachel dépend du service supplémentaire, sans introduire une interprétation théologique particulière. La répétition de « si » maintient le lien des deux obligations avec la condition.
translation_notes:
  register: Français international moderne, simple et digne. La coordination reproduit l’enchaînement du service de sept ans et de la garde des brebis, sans réduire le second élément à une simple simultanéité.
