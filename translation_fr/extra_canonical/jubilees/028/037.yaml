  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
translation:
  language: fr
  text: Il s’unit à elle. Elle devint enceinte et lui donna un fils, et il l’appela Dan, le neuvième jour du mois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « elle l’appela » en employant la forme féminine du verbe.'
    reason: La leçon du texte fourni est masculine, mais une variante manuscrite féminine explique l’autre attribution du nom.
lexical_decisions:
- source_word: ወቦአ፡ ኀቤሃ፡
  choice: Il s’unit à elle
  rationale: Littéralement « il entra auprès d’elle » ; l’expression constitue un euphémisme sémitique pour l’union sexuelle. Cette formulation française moderne en restitue naturellement le sens sans crudité.
- source_word: ወጸውዐ፡ ስሞ፡ ዳን፡
  choice: il l’appela Dan
  rationale: Le verbe fourni, ወጸውዐ, est à la troisième personne du masculin singulier. « L’appela Dan » est plus idiomatique en français que le calque « appela son nom Dan ».
- source_word: አመ፡ ተሱዑ፡ ለወርኅ፡
  choice: le neuvième jour du mois
  rationale: አመ introduit ici une date, et ተሱዑ désigne le neuvième jour ; la formulation évite de comprendre à tort « au neuvième mois ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. L’euphémisme source est rendu par « s’unit à elle » ; la syntaxe est légèrement allégée pour rester naturelle. Le marqueur [a] figure dans le texte.
