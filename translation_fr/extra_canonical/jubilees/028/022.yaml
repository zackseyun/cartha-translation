  text: Rachel, Bilhah, the sister of Zilpah, as a maidservant. And he served another seven years for
translation:
  language: fr
  text: Rachel, Bilha, la sœur de Zilpa, pour servante.[a] Et il servit encore sept ans pour…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début du verset poursuit une phrase commencée au verset précédent : c’est Laban qui donne Bilha à Rachel comme servante.'
    reason: Clarifie la rupture causée par le découpage du verset et empêche de comprendre Rachel comme le sujet de « donna ».
  - marker: b
    text: La phrase reste inachevée dans cet extrait et se poursuit avec le complément de « pour ».
    reason: Signale fidèlement que le texte fourni s’arrête sur une préposition.
lexical_decisions:
- source_word: ባላንሃ፡ አኅታ፡ ለዜልፋን፡ ለአኪት
  choice: Bilha, la sœur de Zilpa, pour servante
  rationale: Le segment transmis est syntaxiquement incomplet à cause du découpage du verset. Il faut éviter d’ajouter ici « donna », qui ferait à tort de Rachel le sujet, alors que le contexte précédent attribue l’action à Laban.
- source_word: ወትቀንየ፡ ሰብዓተ፡ ዓመተ፡ ዳግመ
  choice: Et il servit encore sept ans
  rationale: Rend directement la coordination, le verbe au masculin singulier, la durée de sept ans et l’idée de répétition portée par ዳግመ.
- source_word: በእንተ፡
  choice: pour…
  rationale: La préposition introduit un complément absent de l’extrait en raison de la coupure de chapitre/verset; les points de suspension signalent honnêtement cette suspension.
theological_decisions:
- issue: Sujet implicite d’un éventuel verbe « donner » dans le premier fragment
  choice: Ne pas suppléer de verbe et conserver le fragment
  alternative: « Rachel donna Bilha… »
  rationale: Suppléer « donna » avec Rachel pour sujet contredirait le contexte narratif. La formulation retenue préserve les données du témoin et rend visible le défaut de segmentation sans reconstruire arbitrairement la phrase.
translation_notes:
  register: Français international moderne, sobre et digne. Les formes françaises usuelles « Bilha » et « Zilpa » sont retenues. La syntaxe fragmentaire et la fin suspendue sont conservées, avec des notes explicatives, afin de ne pas corriger silencieusement une erreur de segmentation.
