  text: Leah named him Asher, on the second day of the eleventh month, in the fifth year of the fourth week.
translation:
  language: fr
  text: Léa lui donna le nom d’Aser[a], le deuxième jour du onzième mois, la cinquième année de la quatrième semaine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze transmis est elliptique. Littéralement, on pourrait aussi comprendre : « Son nom était Aser »; toutefois, Léa y est explicitement mentionnée, et le contexte soutient l’idée qu’elle lui donna ce nom.'
    reason: Préserver l’incertitude textuelle réelle tout en signalant la présence explicite de Léa.
lexical_decisions:
- source_word: ስም፡ ሊያ፡ አሴር፡
  choice: Léa lui donna le nom d’Aser
  rationale: Le texte transmis est elliptique ou corrompu, mais conserve explicitement « Léa » et « Aser ». Le contexte et la lecture critique sous-jacente indiquent l’acte de nomination; cette formulation française naturelle maintient Léa comme sujet.
- source_word: በስኑዩ፡ ለወርኅ፡ ዘ'ዐሠርቱ፡ ወአሐዱ፡
  choice: le deuxième jour du onzième mois
  rationale: Rend directement la date exprimée par le jour ordinal et le mois numéroté.
- source_word: በዓመቱ፡ ኃምስ፡ ዘሱባዔ፡ ራብዕ።
  choice: la cinquième année de la quatrième semaine
  rationale: Conserve le système chronologique propre aux Jubilés, où « semaine » désigne une période de sept ans.
