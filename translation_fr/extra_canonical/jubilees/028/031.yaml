  text: and she bore him a fourth son, and he called his name Judah, on the fifteenth day of the third month,
translation:
  language: fr
  text: Elle lui donna un quatrième fils, et il l’appela Juda, le quinzième jour du troisième mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡ ራብዐ፡
  choice: Elle lui donna un quatrième fils
  rationale: Le verbe est explicitement féminin singulier (« elle enfanta »), et « donner un fils » constitue une formulation française naturelle tout en conservant le bénéficiaire exprimé par ሎቱ (« à lui »).
- source_word: ወጸውዐ፡ ስሞ፡ ይሁዳ፡
  choice: et il l’appela Juda
  rationale: ጸውዐ est à la troisième personne du masculin singulier (« il appela »), contrairement à la forme féminine attendue ጸውዐት. La traduction suit donc le texte guèze fourni, sans l’harmoniser silencieusement avec Genèse 29.35.
- source_word: በዐሡሩ፡ ወኀሙሱ፡ ለወርኅ፡ ሣልስ፡
  choice: le quinzième jour du troisième mois
  rationale: 'Rend directement la date : « au dix et cinq du troisième mois », selon l’expression idiomatique française.'
theological_decisions:
- issue: Identité grammaticale de la personne qui donne le nom à Juda
  choice: « il l’appela Juda »
  alternative: « elle l’appela Juda »
  rationale: Même si Genèse 29.35 attribue le nom à Léa et qu’une tradition textuelle harmonisée peut porter un féminin, le texte guèze fourni emploie la forme verbale masculine ጸውዐ. La tension avec le récit de la Genèse est donc préservée.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et narrative. « Elle lui donna un quatrième fils » est plus naturel en français courant que « elle lui enfanta », tandis que « il l’appela Juda » reproduit nettement le changement de sujet grammatical du texte source.
