lexical_decisions:
- source_word: በምድርነ
  choice: dans notre pays
  rationale: Rend littéralement l’idée de « dans notre terre » par l’expression française naturelle correspondant à une coutume locale.
- source_word: እንተ ትንእስ
  choice: la cadette
  rationale: Désigne ici la plus jeune des deux sœurs; « la cadette » est précis et naturel en français.
- source_word: እንተ ትልህቅ
  choice: l’aînée
  rationale: Désigne la plus âgée des deux sœurs et forme le contraste idiomatique avec « la cadette ».
- source_word: ርቱዐ
  choice: juste
  rationale: Conserve la portée normative du terme sans la réduire à une simple coutume ou à ce qui serait seulement convenable.
- source_word: ለገቢረ ዝንቱ
  choice: d’agir ainsi
  rationale: Formulation française fluide de « faire ceci », renvoyant à l’action qui vient d’être mentionnée.
- source_word: እስመ
  choice: car
  rationale: Maintient la liaison causale avec la suite, absente de l’extrait fourni.
theological_decisions:
- issue: Portée de l’affirmation normative
  choice: « il n’est pas juste »
  alternative: « cela ne se fait pas »
  rationale: Le texte distingue apparemment la pratique locale d’un jugement sur ce qu’il est droit de faire; la traduction conserve cette tension sans assimiler les deux idées.
translation_notes:
  register: Français moderne, clair et digne. Le début et la fin restent volontairement syntaxiquement ouverts, puisque l’extrait commence et s’achève au milieu d’une phrase.
