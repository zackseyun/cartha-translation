lexical_decisions:
- source_word: ትልህቅ
  choice: l’aînée
  rationale: Dans le contexte du mariage des deux filles, le terme désigne la fille la plus âgée ; « l’aînée » est naturel et précis en français.
- source_word: ያቀድም፡ ውሂበ
  choice: qu’il donne d’abord
  rationale: Rend la priorité exprimée par le verbe et préserve l’idée de donner une fille en mariage, sans l’expliciter au-delà du texte.
- source_word: ትንእስ
  choice: la cadette
  rationale: Le terme s’oppose à « l’aînée » et désigne ici la fille plus jeune.
- source_word: ዘይገብር፡ ከመዝ
  choice: qui agit ainsi
  rationale: Formulation française naturelle correspondant littéralement à « qui fait ainsi ».
theological_decisions:
- issue: Portée de l’expression initiale እምእንተ፡ ትልህቅ፡
  choice: Conserver « avant l’aînée » comme fin de la proposition commencée au verset précédent
  alternative: Supprimer l’expression comme reprise superflue ou l’intégrer à la proposition suivante
  rationale: Les mots sont explicitement présents dans la source guèze et achèvent la pensée selon laquelle la cadette ne doit pas être donnée avant l’aînée. Le point-virgule signale la continuité interversets sans réécrire le contexte absent.
translation_notes:
  register: Français moderne, courant et digne. La phrase demeure volontairement inachevée à la fin, puisque le verset se poursuit syntaxiquement dans le verset suivant. Le féminin d’« aînée » et de « cadette » est imposé par le contexte narratif.
