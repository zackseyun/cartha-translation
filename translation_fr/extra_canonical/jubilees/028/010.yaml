  text: car les yeux de Léa étaient faibles, mais son apparence était très belle, et Rachel était belle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድኩም
  choice: faibles
  rationale: Qualifie les yeux de Léa; « faibles » conserve la formulation et l’ambiguïté du texte sans préciser une affection ni transformer le sens en « doux ».
- source_word: ላሕይ፡ ራእያ፡ ጥቀ
  choice: elle était très belle
  rationale: La proposition décrit l’apparence de Léa et comporte l’intensif ጥቀ, rendu par « très ». En français naturel, « elle était très belle » exprime sobrement la beauté de son apparence.
- source_word: ወራሔል፡ ሠናይ
  choice: et Rachel était belle
  rationale: Rend séparément l’affirmation finale concernant Rachel, sans lui attribuer les mots précédents qui se rapportent à Léa.
theological_decisions:
- issue: Rapport avec Genèse 29.17
  choice: Conserver la défense propre à ce texte de la beauté de Léa, puis l’affirmation distincte concernant Rachel.
  alternative: Harmoniser avec la Genèse en appliquant toute la description de beauté à Rachel.
  rationale: La syntaxe guèze distingue explicitement l’apparence très belle de Léa de la beauté de Rachel; cette particularité exégétique ne doit pas être effacée.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « belle » est maintenue parce qu’elle reflète la structure contrastive et évite d’harmoniser le passage avec Genèse 29.17.
