lexical_decisions:
- source_word: ወልደ
  choice: Elle mit au monde un fils
  rationale: Le verbe exprime l’action d’enfanter; le sujet féminin se déduit du contexte immédiat, et «un fils» rend explicitement le complément masculin.
- source_word: ወጸውዐት፡ ስሞ፡ ልያ፡ ጋድ
  choice: et Léa l’appela Gad
  rationale: Cette formulation française naturelle rend littéralement l’idée que Léa «appela son nom Gad», sans lourdeur.
- source_word: አመ፡ ዐሡሩ፡ ወስኑዩ፡ ለወርኅ፡ ሳምን፡ በሣልስ፡ ዓመት
  choice: le douzième jour du huitième mois, la troisième année
  rationale: La date est conservée dans son ordre et selon son système ordinal, sans conversion conjecturale vers un calendrier moderne.
