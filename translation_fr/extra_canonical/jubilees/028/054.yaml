  text: and take your wages.” And they agreed between themselves that he would give him as his wages every lamb
translation:
  language: fr
  text: « Et prends ton salaire. » Ils convinrent entre eux qu’il lui donnerait pour salaire tous les agneaux[a] du troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les jeunes moutons ».
    reason: Le terme de base peut désigner les ovins, tandis que l’expression finale les précise comme jeunes.
lexical_decisions:
- source_word: ዐስበከ
  choice: ton salaire
  rationale: Le nom porte le suffixe de deuxième personne masculin singulier ; « salaire » convient au contexte d’une rémunération convenue.
- source_word: ተካሀሉ
  choice: ils convinrent
  rationale: Rend naturellement l’idée d’un accord mutuel, renforcée par በበይናቲሆሙ (« entre eux »).
- source_word: ዐስቦ
  choice: pour salaire
  rationale: Le suffixe masculin singulier renvoie au bénéficiaire ; en français, « lui donnerait pour salaire » exprime déjà clairement qu’il s’agit de son salaire sans lourdeur.
- source_word: ኵሎ፡ በግዐ፡ እመሐስዕ
  choice: tous les agneaux du troupeau
  rationale: La séquence désigne l’ensemble des jeunes ovins issus du troupeau ; « agneaux » conserve la nuance de jeunesse signalée par እመሐስዕ.
