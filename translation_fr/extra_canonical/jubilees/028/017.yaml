  text: 'Faites ceci : qu’on ne prenne ni ne donne la cadette avant qu’on ait d’abord donné l’aînée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግበሩ፡ ዘንተ፡ ቃለ
  choice: Faites ceci
  rationale: L’impératif pluriel est conservé; « ceci » rend naturellement l’objet démonstratif, tandis que « chose/parole » serait lourd en français.
- source_word: አይንሥኡ፡ ወአየሀቡ
  choice: qu’on ne prenne ni ne donne
  rationale: Conserve les deux verbes coordonnés et leur portée négative commune sans préciser abusivement les acteurs.
- source_word: እንተ፡ ትንእስ
  choice: la cadette
  rationale: Dans le contexte matrimonial, le féminin substantivé désigne naturellement la fille ou sœur plus jeune.
- source_word: ዘእንበለ፡ ያቅድሙ
  choice: avant d’avoir d’abord donné
  rationale: Rend à la fois l’antériorité et l’idée de priorité exprimées par la construction, malgré une légère redondance voulue.
- source_word: እንተ፡ ትልህቅ
  choice: l’aînée
  rationale: Le féminin substantivé exprime la fille ou sœur plus âgée et forme un contraste idiomatique avec « la cadette ».
