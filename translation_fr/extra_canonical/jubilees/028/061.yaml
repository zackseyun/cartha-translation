  text: And it came to pass after Rachel had borne Joseph, that Laban went to shear his sheep, for he was far away.
translation:
  language: fr
  text: Après que Rachel eut donné naissance à Joseph, Laban alla tondre ses moutons, car il était loin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  choice: Après que
  rationale: La tournure guèze introduit la succession des événements. En français moderne, « Après que » restitue naturellement cette relation temporelle sans le calque lourd « Et il arriva après que ».
- source_word: ወለደት፡ ራሔል፡ ዮሴፍሃ፡
  choice: Rachel eut donné naissance à Joseph
  rationale: Le verbe signifie enfanter ou donner naissance. Le passé antérieur convient après « après que » dans ce récit au passé, tandis que « Joseph » rend naturellement le possessif du texte source.
- source_word: ይቅርጽ፡ አባግዒሁ፡
  choice: tondre ses moutons
  rationale: Cette expression désigne la tonte du petit bétail de Laban; « ses moutons » est idiomatique et précis en français courant.
- source_word: እስመ፡ ርሑቅ፡
  choice: car il était loin
  rationale: La proposition causale et l'idée de distance sont conservées sans ajouter un lieu ou un sujet explicite que le texte source ne précise pas.
