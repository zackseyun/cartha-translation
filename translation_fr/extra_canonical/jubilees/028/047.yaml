  text: to her, and she conceived and bore another son and a daughter, and she called the son's name Zebulun,
translation:
  language: fr
  text: vers elle. Elle devint enceinte et mit au monde un autre fils[a] et une fille, et elle donna au fils le nom de Zabulon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un deuxième fils ».
    reason: Le guèze ካልእ peut exprimer soit l’altérité, soit le rang ordinal.
lexical_decisions:
- source_word: ካልእተ፡ ወልደ፡ (kālʾeta walda)
  choice: un autre fils
  rationale: ካልእ peut signifier « autre » ou « second ». « Un autre fils » préserve ici le sens naturel sans suggérer que Zabulon serait seulement le deuxième fils de Léa.
- source_word: ወወለተ፡ (wa-walata)
  choice: et une fille
  rationale: Le substantif désigne une fille; la coordination avec « fils » est rendue directement.
- source_word: ዘቡሎን፡
  choice: Zabulon
  rationale: Forme française biblique courante du nom propre.
theological_decisions:
- issue: Ambiguïté de ካልእ entre « autre » et « second »
  choice: un autre fils
  alternative: un deuxième fils
  rationale: Le choix « autre » correspond à une valeur lexicale réelle et évite une contradiction apparente avec l’ordre antérieur des naissances, tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français moderne, simple et digne. Le fragment initial « auprès d’elle » est conservé comme prolongement syntaxique du verset précédent; la répétition de « fils » reflète celle du texte source.
