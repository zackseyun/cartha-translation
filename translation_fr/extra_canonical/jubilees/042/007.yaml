  yaml_path: translation/extra_canonical/jubilees/042/007.yaml
  text: He sent his brothers away, and he filled their sacks with grain, and he also put their money for them.
translation:
  language: fr
  text: Il laissa repartir ses frères, remplit leurs sacs de grain et plaça aussi leur or à leur intention[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « plaça aussi leur or pour eux » ; « or » peut ici désigner leur argent.'
    reason: La note conserve la tournure bénéficiaire du guèze et signale la possible valeur monétaire de « or », sans ajouter que l’or fut placé dans les sacs.
lexical_decisions:
- source_word: አኀዊሁ (ʾaḫawihu)
  choice: ses frères
  rationale: Le nom porte un suffixe possessif de troisième personne masculine singulière.
- source_word: ፈነወ (fanawa)
  choice: laissa repartir
  rationale: Rend naturellement l’idée de renvoyer ou laisser partir ses frères dans ce contexte narratif.
- source_word: አሕስሊሆሙ (ʾaḥsəlihomu)
  choice: leurs sacs
  rationale: Désigne les contenants remplis de grain; « sacs » est le terme français courant et contextuellement précis.
- source_word: ስርናየ (sərnāya)
  choice: grain
  rationale: Terme collectif approprié pour les céréales données aux frères.
- source_word: ወርቆሙ (wärqomu)
  choice: leur or
  rationale: Le mot signifie proprement « or », avec le suffixe « leur »; il peut désigner par extension leur argent ou leur monnaie.
- source_word: ወደየ ሎሙ (wadaya lomu)
  choice: y plaça … pour eux
  rationale: Le verbe exprime l’action de mettre ou placer, et ሎሙ signifie littéralement « pour eux ». Le pronom « y » explicite naturellement en français le lieu fourni par les sacs dans la proposition précédente.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination a été allégée pour une lecture naturelle, sans harmoniser le texte guèze avec la mention de l’argent dans la Genèse hébraïque.
