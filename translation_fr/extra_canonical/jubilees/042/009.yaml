  text: And they went up from the land of Egypt and came to the land of Canaan, and they told their father everything that had happened to them, and how the ruler of the land had spoken harshly with them and had seized Simeon until...
translation:
  language: fr
  text: … le plus jeune, car ils lui avaient dit que leur père était vivant et qu’ils avaient un frère plus jeune. Ils remontèrent du pays d’Égypte et arrivèrent au pays de Canaan. Ils racontèrent à leur père tout ce qui leur était arrivé, comment le gouverneur du pays leur avait parlé durement et avait retenu Siméon jusqu’à ce que…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአፎ
  choice: comment
  rationale: Le terme introduit la manière dont le gouverneur leur a parlé; « comment » conserve ce sens et s’intègre naturellement à l’énumération de leur récit.
- source_word: መኰንነ፡ ብሔር
  choice: le gouverneur du pays
  rationale: Rend le titre d’autorité sans préciser davantage une fonction que le texte source ne définit pas.
- source_word: ዐጹባጺበ
  choice: durement
  rationale: Exprime le caractère rude ou sévère de ses paroles dans un français naturel.
- source_word: አሐዘ፡ ለስምዖን
  choice: avait retenu Siméon
  rationale: Le verbe signifie prendre ou saisir; dans ce contexte, « retenir » communique clairement sa mise en détention sans surinterpréter la manière de l’arrestation.
- source_word: እስከ፡ ሶበ
  choice: jusqu’à ce que…
  rationale: Cette locution introduit une proposition temporelle poursuivie au verset suivant; les points de suspension signalent fidèlement que la syntaxe reste ouverte à la limite du verset.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition géographique « pays d’Égypte / pays de Canaan » est conservée. La fin demeure volontairement suspendue parce que la proposition commencée par « jusqu’à ce que » se poursuit au verset suivant.
