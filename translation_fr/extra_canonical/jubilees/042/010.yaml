  text: 'they should bring Benjamin. And Jacob said, “You have bereaved me: Joseph is no more, and Simeon also is no more...”'
translation:
  language: fr
  text: 'qu’ils amènent Benjamin. Jacob dit : « Vous m’avez privé de mes enfants : Joseph n’est plus, et Siméon non plus… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  choice: qu’ils amènent Benjamin
  rationale: Rend la forme verbale au pluriel et son objet Benjamin de manière naturelle, tout en conservant la dépendance syntaxique avec le contexte précédent.
- source_word: እምከንከሙኒከ
  choice: Vous me privez de mes enfants
  rationale: Le verbe exprime ici le fait de rendre Jacob privé de ses enfants; cette tournure française restitue le sens idiomatique de la plainte plutôt qu’un calque obscur.
- source_word: ኢሀሎ
  choice: n’est plus
  rationale: Dans ce contexte de perte, l’expression signifie que Joseph n’est plus présent ou est tenu pour perdu; « n’est plus » préserve cette portée sans affirmer explicitement sa mort.
- source_word: ወስምዖንሂ
  choice: et Siméon non plus
  rationale: La particule additive appliquée à Siméon est rendue idiomatiquement par « non plus », avec ellipse du verbe répété.
theological_decisions:
- issue: Nature de la disparition de Joseph et de Siméon
  choice: n’est plus / non plus
  alternative: est mort / est perdu
  rationale: Le texte formule leur absence sans préciser de façon univoque leur sort. La traduction conserve cette ambiguïté narrative et n’affirme pas leur mort.
translation_notes:
  register: Français international moderne, digne et accessible. La citation demeure inachevée comme dans l’extrait source. « Vous me privez de mes enfants » est plus naturel que le littéral « vous m’avez privé d’enfants » et correspond à la plainte adressée collectivement aux fils.
