lexical_decisions:
- source_word: አሕስሊሆሙ
  choice: leurs sacs
  rationale: Le terme désigne ici les sacs des frères; la préposition ውስተ appelle «dans».
- source_word: ወኢያእመሩ
  choice: sans qu’ils le sachent
  rationale: Rend naturellement en français la coordination guèze «et ils ne le savaient pas», sans modifier le sens.
- source_word: እኅዋሆሙ
  choice: leur … frère
  rationale: Le nom peut morphologiquement être pluriel («leurs frères»), mais le contexte et le qualificatif qui suit désignent le plus jeune frère en particulier.
- source_word: ዘይ…
  choice: plus jeune
  rationale: Le témoin fourni est tronqué à cet endroit; la restitution contextuelle suit la lecture attestée par la couche de consultation auditée.
