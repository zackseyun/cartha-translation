  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: fr
  text: La famine devint très sévère dans le pays de Canaan. Jacob apprit qu’il y avait des céréales en Égypte et il envoya dix de ses fils lui en procurer là-bas. Mais il n’envoya pas Benjamin. Les dix fils de Jacob arrivèrent en Égypte avec ceux qui faisaient le voyage.
