- source_word: ወንጸዎሙ
  choice: Il les fit mettre sous garde
  rationale: Le contexte narratif et la tradition textuelle indiquent une mise en détention; cette tournure est naturelle en français et évite l’ambiguïté de «les plaça».
- source_word: ፈትሖሙ
  choice: il les relâcha
  rationale: Le verbe exprime ici l’action de délier ou de libérer des personnes détenues.
- source_word: ወአቀመ፡ ስምዖንን፡ ባሕቲተ
  choice: ne retint que Siméon
  rationale: Rend naturellement le fait de garder Siméon seul, en contraste avec la libération des autres.
- source_word: ወተስዐተ
  choice: et renvoya les neuf autres
  rationale: Le segment fourni s’arrête littéralement à «et les neuf»; le verbe «renvoya» est rétabli d’après la continuité syntaxique signalée par la segmentation du texte.
