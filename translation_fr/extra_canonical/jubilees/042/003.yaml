  text: in the seven years of abundance and had kept it. And the Egyptians came to Joseph so that he might give them food, and he opened the storehouses where the grain of the former years was, and sold it to the peoples of the land for gold.
translation:
  language: fr
  text: durant les sept années d’abondance et l’avait conservé. Puis les Égyptiens[a] vinrent trouver Joseph afin qu’il leur donne de la nourriture. Il ouvrit les greniers où se trouvait le grain des années précédentes et le vendit aux peuples du pays contre de l’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’Égypte »; toutefois, le verbe et le pronom correspondants sont au pluriel.'
    reason: Signaler la tension grammaticale du texte source sans imposer silencieusement une seule lecture.
lexical_decisions:
- source_word: ዘሠምር
  choice: d’abondance
  rationale: Le terme évoque une période prospère et féconde; « abondance » convient au contexte des récoltes mises en réserve.
- source_word: ግብጽ
  choice: les Égyptiens
  rationale: Le nom désigne littéralement l’Égypte, mais le verbe « vinrent » et le pronom objet « leur » sont au pluriel; le gentilé rend naturellement cet accord en français.
- source_word: ሲሲተ
  choice: de la nourriture
  rationale: Terme général désignant la subsistance ou les vivres; « nourriture » reste clair et ne le réduit pas au seul grain.
- source_word: መዛግብተ
  choice: les greniers
  rationale: Dans ce contexte de stockage du grain, « greniers » est plus précis et naturel que le terme générique « réserves » ou « entrepôts ».
- source_word: ዘቀዳሚ፡ ዓመት
  choice: des années précédentes
  rationale: L’expression renvoie au grain accumulé durant les années antérieures; le pluriel français s’accorde avec les sept années d’abondance du contexte.
- source_word: በወርቅ
  choice: contre de l’or
  rationale: ወርቅ signifie explicitement « or », et non « argent »; « contre » exprime ici le moyen de paiement.
theological_decisions: []
