  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: fr
  text: 'Joseph les reconnut, mais eux ne le reconnurent pas. Il leur parla durement et leur dit : « N’êtes-vous pas des espions, venus observer les endroits vulnérables du pays ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአእመሮሙ፡ ዮሴፍ፡ ወእሙንቱሰ፡ ኢያእመርዎ
  choice: Joseph les reconnut, mais eux ne le reconnurent pas
  rationale: Rend directement le contraste réciproque entre la reconnaissance de Joseph et l’absence de reconnaissance de la part de ses frères.
- source_word: ወተናገረ፡ ምስሌሆሙ፡ ዐጹባጺበ
  choice: Il leur parla durement
  rationale: Expression française naturelle qui conserve la manière sévère ou rude de parler indiquée par le texte.
- source_word: ሰብአ፡ ዓይን
  choice: des espions
  rationale: Littéralement proche de « hommes de l’œil », cette expression idiomatique désigne ici des observateurs clandestins; « espions » en transmet clairement la fonction en français.
- source_word: ታስተሓይዪ፡ ጸባረ፡ ምድር
  choice: observer les endroits vulnérables du pays
  rationale: Conserve l’idée de reconnaître les parties exposées ou insuffisamment protégées du territoire, dans un français actuel et intelligible.
