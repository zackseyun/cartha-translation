  text: And the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land
translation:
  language: fr
  text: Et la pluie ne fut pas accordée à la terre[a], car aucune averse ne tombait. La terre devint stérile, mais il n’y avait de nourriture qu’en Égypte, car Joseph avait amassé des semences pour le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « la pluie refusa d’être donnée à la terre ».'
    reason: Signale l’idiome personnifiant la pluie dans le texte guèze, que le corps du texte rend de façon plus naturelle.
lexical_decisions:
- source_word: ወአበየ፡ ዝናም፡ ተውህቦ
  choice: Et la pluie ne fut plus accordée
  rationale: Rend en français naturel l’idiome guèze où la pluie « refusa d’être donnée », tout en conservant l’idée que la pluie n’était plus octroyée à la terre.
- source_word: ምትነ
  choice: averse
  rationale: Désigne ici une précipitation ou une ondée qui descend; « averse » convient au contexte de sécheresse.
- source_word: ዐብረተ፡ ምድር
  choice: La terre devint stérile
  rationale: Exprime l’état improductif de la terre provoqué par l’absence de pluie.
- source_word: ሲሲተ
  choice: nourriture
  rationale: Terme général désignant les vivres ou la subsistance; « nourriture » reste clair et non spécialisé.
- source_word: ዘርአ፡ ለምድር
  choice: des semences pour le pays
  rationale: Conserve le sens collectif de « semence » et la relation exprimée avec le pays sans préciser davantage sa destination.
