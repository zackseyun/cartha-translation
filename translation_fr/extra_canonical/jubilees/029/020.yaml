  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
translation:
  language: fr
  text: Abraham, son père, sur la montagne d’Hébron. Et là, Jacob envoyait de temps à autre à son père et à sa mère tout ce dont ils avaient besoin ; et ils bénissaient Jacob de tout leur cœur et de toute leur âme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'ህየ
  choice: Et là
  rationale: Conserve explicitement le repère locatif qui rattache l’action à la montagne d’Hébron.
- source_word: ይፈኑ
  choice: envoyait
  rationale: L’imparfait français exprime naturellement l’action répétée ou habituelle indiquée par la forme verbale et par la locution temporelle qui suit.
- source_word: እምጊዜ፡ በበ፡ ጊዜ
  choice: de temps à autre
  rationale: Rend de façon idiomatique la répétition périodique exprimée littéralement par « de temps, à chaque temps ».
- source_word: ኵሎ፡ ትካዞሙ
  choice: tout ce dont ils avaient besoin
  rationale: Formulation française naturelle qui rend l’ensemble de leurs besoins sans reproduire une tournure source obscure ou pesante.
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ
  choice: de tout leur cœur et de toute leur âme
  rationale: Conserve le parallélisme anthropologique et l’intensité de la formule source.
