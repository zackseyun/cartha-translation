lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  choice: Après que
  rationale: La formule introduit ici la succession temporelle; une tournure française directe évite le calque archaïque « il arriva que » sans perdre le rapport chronologique.
- source_word: ወለደት፡ ራሔል፡ ዮሴፍሃ፡
  choice: Rachel eut donné naissance à Joseph
  rationale: Rend naturellement l’accompli antérieur et le sens de l’accouchement; le suffixe possessif attaché à Joseph n’a pas besoin d’être explicité en français.
- source_word: ይቅርጽ፡ አባግዒሁ፡
  choice: tondre ses moutons
  rationale: Correspond à l’action pastorale précise et conserve le possessif de la source.
- source_word: ምሕዋረ፡ ሠሉስ፡ ዕለት፡
  choice: à trois jours de marche
  rationale: Expression française idiomatique qui conserve la mesure de distance donnée par la source.
