  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
translation:
  language: fr
  text: Le lendemain matin, il partit pour le pays de Galaad. Jacob traversa le Yabboq le neuvième mois, au onzième jour de ce mois. Ce jour-là, Ésaü, son frère, vint vers lui, et ils se réconcilièrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጦሚያ፡ ምድረ፡ ጽባሕ
  choice: Le lendemain matin, il partit
  rationale: Rend naturellement la progression du voyage et l’indication temporelle « le matin suivant ».
- source_word: ገለአድ
  choice: Galaad
  rationale: Forme française traditionnelle et largement reconnue du toponyme biblique Gilead.
- source_word: ኢያቦክሃ
  choice: le Yabboq
  rationale: Translittération française claire du nom de la rivière Jabbok, avec restitution de la consonne redoublée.
- source_word: በታስዕ፡ ወርኅ
  choice: le neuvième mois
  rationale: Traduction directe de l’indication calendaire.
- source_word: አመ፡ ፲ሡሩ፡ ወአሚሩ
  choice: le onzième jour de ce mois
  rationale: 'Suit l’analyse textuelle signalée par la révision la plus récente : une forme corrompue correspondant au onzième jour, et non à la première année de la dixième semaine.'
- source_word: ወተኂነኖ
  choice: ils se réconcilièrent
  rationale: Exprime l’aboutissement relationnel réciproque indiqué par le verbe.
theological_decisions:
- issue: Nature de la rencontre entre Jacob et Ésaü
  choice: ils se réconcilièrent
  alternative: ils s’embrassèrent / il l’embrassa
  rationale: Le contexte et la tradition textuelle consultée soutiennent ici la réconciliation; la formulation française conserve la portée relationnelle sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour rendre clairement la date du passage du Yabboq et la rencontre survenue le même jour.
