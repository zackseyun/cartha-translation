  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
translation:
  language: fr
  text: 'Car il leur raconta tout ce qu’il avait vu dans le rêve et tout ce qui lui avait été dit : qu’il devait retourner dans la maison de son père[a]. Et il lui dit : « Va partout où tu iras[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entrer ».'
    reason: Conserve l'alternative signalée dans la piste d'audit, tout en maintenant « retourner » dans le texte, qui convient au guèze et au contexte.
  - marker: b
    text: 'Certains reconstituent : « et je serai avec toi » (voir Gn 31.3) ; cette formule n''est pas présente dans le texte guèze fourni.'
    reason: Signale la reconstruction contextuelle sans l'introduire dans le corps du texte.
lexical_decisions:
- source_word: ይግባእ
  choice: devait retourner
  rationale: Le verbe gəḇʾa signifie ici « retourner », conformément au contexte du retour de Jacob chez son père, plutôt que simplement « entrer ».
- source_word: ቤተ አቡሁ
  choice: dans la maison de son père
  rationale: Rendu idiomatique du syntagme possessif guèze, en conservant l’image concrète de la maison paternelle.
- source_word: ሖውር
  choice: Va
  rationale: Impératif de mouvement rendu directement et naturellement en français.
- source_word: ውስተ ኵሉ መካን ወአይ ተሐውር
  choice: partout où tu iras
  rationale: Rend le texte guèze transmis sans importer la promesse « je serai avec toi », absente de la forme fournie.
theological_decisions:
- issue: Promesse divine éventuellement reconstruite d’après Genèse 31.3
  choice: Ne pas ajouter « je serai avec toi »
  alternative: « Va… et je serai avec toi »
  rationale: La traduction suit le texte guèze extant fourni et évite d’intégrer au corps du texte une reconstruction contextuelle.
- issue: Valeur de ይግባእ
  choice: retourner
  alternative: entrer
  rationale: Le sens de retour correspond au lexème guèze et au contexte narratif, sans réduire le mouvement à l’entrée dans un bâtiment.
translation_notes:
  register: Français moderne, digne et accessible. La formulation finale, quelque peu elliptique (« Va partout où tu iras »), conserve l’étrangeté et la possible lacune du texte guèze transmis au lieu de la corriger par harmonisation avec la Genèse.
