revisions:
- from: Il le quitta et se rendit au pays de Séïr, tandis que Jacob demeurait sous des tentes. La première année de la cinquième semaine de ce jubilé, Jacob traversa le Jourdain et s’établit au-delà du Jourdain. Il fit paître ses moutons depuis la mer des Monceaux[a] jusqu’à Beth-Shân, jusqu’à Dotân et jusqu’à…
  to: Il s’éloigna de lui pour le pays de Séïr, mais Jacob habitait dans des tentes. La première année de la cinquième semaine de ce jubilé, Jacob traversa le Jourdain et s’établit au-delà du Jourdain. Il fit paître ses moutons depuis la mer des Monceaux[a] jusqu’à Beth-Shân, jusqu’à Dotân et jusqu’à…
  rationale: La seule correction nécessaire remplace « sous des tentes » par « dans des tentes ». La formulation initiale a aussi été légèrement lissée en « Il s’éloigna de lui pour le pays de Séïr », qui restitue sans expliciter l’antécédent le mouvement « de lui vers le pays de Séïr ». L’inachèvement final et l’incertitude du toponyme sont préservés.
