  text: And he went from him to the land of Seir, but Jacob dwelt in tents. And in the first year of the fifth week in this jubilee, he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps[14] as far as Beth-shan and as far as Dothan and as far as
translation:
  language: fr
  text: Il s’éloigna de lui pour le pays de Séïr, mais Jacob habitait dans des tentes. La première année de la cinquième semaine de ce jubilé, Jacob traversa le Jourdain et s’établit au-delà du Jourdain. Il fit paître ses moutons depuis la mer des Monceaux[a] jusqu’à Beth-Shân, jusqu’à Dotân et jusqu’à…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mer des Monceaux » traduit un toponyme incertain du texte éthiopien. Il pourrait correspondre à un autre nom de lieu sous-jacent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድረ፡ ሴኢር
  choice: pays de Séïr
  rationale: Rend naturellement l’expression gé‘èze « terre/pays de Séïr » tout en conservant le toponyme biblique.
- source_word: ኀደረ፡ በምጽላላት
  choice: demeurait sous des tentes
  rationale: Le verbe exprime le fait de séjourner ou demeurer, et le pluriel désigne des abris ou tentes; l’imparfait convient au contraste avec le déplacement précédent.
- source_word: ዐደወ፡ ዮርዳኖስ
  choice: traversa le Jourdain
  rationale: Traduction directe du mouvement de passage à travers le Jourdain.
- source_word: ማዕዶተ፡ ዮርዳኖስ
  choice: au-delà du Jourdain
  rationale: Conserve l’expression géographique relative du texte sans déterminer explicitement la rive.
- source_word: ይሬዒ፡ አባግዒሁ
  choice: fit paître ses moutons
  rationale: Le verbe indique l’action de faire paître et le nom désigne spécifiquement les ovins.
- source_word: ባሕረ፡ ፌሐሐት
  choice: mer des Monceaux
  rationale: Rendu littéral possible de ce toponyme gé‘èze obscur; son identification reste incertaine et est signalée en note.
- source_word: ቤተስን / ዶታኤም
  choice: Beth-Shân / Dotân
  rationale: Translittérations françaises lisibles des noms de lieux, sans tenter de résoudre davantage leur forme textuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le sujet « Jacob » est répété après l’indication chronologique afin d’éviter une ambiguïté française sur l’antécédent, sans modifier la séquence narrative. La fin suspendue « et jusqu’à… » conserve l’inachèvement du texte source fourni au lieu de suppléer un lieu absent.
