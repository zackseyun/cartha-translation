- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: parla à leur cœur
  rationale: Conserve l’image sémitique explicite du texte guèze et sa nuance d’appel intime ou persuasif, sans la réduire silencieusement à « leur parla ».
- source_word: ምድረ፡ ከናአን
  choice: au pays de Canaan
  rationale: Formulation française courante et digne pour désigner le territoire de Canaan.
