  text: And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.
translation:
  language: fr
  text: Jacob vit que Laban était parti tondre ses brebis. Il appela Léa et Rachel et parla à leur cœur[a], pour qu’elles viennent avec lui au pays de Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur parla »; l’expression littérale « parla à leur cœur » peut évoquer une parole intime, encourageante ou persuasive.'
