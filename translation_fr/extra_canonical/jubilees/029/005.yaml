  text: the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the seventh year of the fourth week[5], Jacob set out for Gilead in the first month, on the twenty-first; and Laban pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.
translation:
  language: fr
  text: le pays de Galaad. Jacob cacha à Laban ce qu’il avait dans le cœur et ne l’en informa pas. La septième année de la quatrième semaine[a], Jacob partit pour Galaad le vingt-et-unième jour du premier mois. Laban le poursuivit et le rattrapa sur le mont Galaad le treizième jour du troisième mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La chronologie de ce verset est difficile, car le départ, la poursuite et le rattrapage sont reliés malgré les mois indiqués. Les dates du texte sont conservées sans tentative d’harmonisation.
    reason: segmentation_note
lexical_decisions:
- source_word: ልቦ፡ ላባን
  choice: à Laban ce qu’il avait dans le cœur
  rationale: La formulation garde l’image source du « cœur » tout en exprimant naturellement en français que Jacob dissimula son dessein à Laban.
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: Jacob partit pour Galaad
  rationale: Cette tournure française rend le mouvement de départ en direction de Galaad sans imposer l’idée plus précise d’un retour.
- source_word: ወደገኖ፡ ላባ፡ ድኅሬሁ
  choice: Laban se lança à sa poursuite
  rationale: Le texte guèze parle de la poursuite, sans le verbe « entendre » ajouté par certaines versions sous l’influence du récit de la Genèse.
- source_word: ደብረ፡ ገላአድ
  choice: le mont Galaad
  rationale: Rend directement le terme désignant la montagne ou région montagneuse, tout en conservant le toponyme traditionnel français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le fragment initial « le pays de Galaad » est conservé comme continuation syntaxique du verset précédent. L’image du cœur est maintenue dans une expression idiomatique plutôt que remplacée entièrement par « intention ».
