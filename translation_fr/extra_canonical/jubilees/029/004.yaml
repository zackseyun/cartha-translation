  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
translation:
  language: fr
  text: Jacob bénit le Dieu d’Isaac, son père, et le Dieu d’Abraham, père de son père. Puis il se leva, fit monter ses femmes et ses enfants sur des animaux, prit tous ses biens, traversa le fleuve et arriva.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: bénit
  rationale: Rend directement le verbe guèze de bénédiction tout en conservant la formulation théologiquement marquée où Jacob bénit Dieu.
- source_word: ጸዐ
  choice: fit monter … sur des bêtes
  rationale: Le contexte et le parallèle narratif indiquent l’action de charger ou d’installer les femmes et les enfants sur des animaux, distincte du verbe suivant « prendre ».
- source_word: ጥሪተ
  choice: biens
  rationale: Terme français naturel englobant les possessions transportées; évite de le limiter arbitrairement aux seuls troupeaux.
- source_word: ፈለገ
  choice: le Fleuve
  rationale: Le nom commun déterminé désigne ici le grand cours d’eau connu dans le récit; la majuscule conserve cette valeur quasi toponymique sans préciser un nom absent du texte.
- source_word: በጽሐ
  choice: arriva
  rationale: Le texte transmis n’exprime pas de destination; la traduction préserve cette absence plutôt que de la compléter.
theological_decisions:
- issue: Jacob bénit Dieu
  choice: « Jacob bénit le Dieu… »
  alternative: « Jacob loua le Dieu… »
  rationale: Conserve la tension du texte source et n’atténue pas le verbe « bénir » par une interprétation explicative.
- issue: Désignation d’Abraham
  choice: « père de son père »
  alternative: « son grand-père »
  rationale: Maintient la répétition généalogique et la structure du texte, plutôt que de la normaliser en terme de parenté moderne.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination guèze est légèrement structurée en deux phrases pour la lisibilité, sans ajouter de destination après « arriva ». Aucun marqueur de note n’est requis.
