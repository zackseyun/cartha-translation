lexical_decisions:
- source_word: ኢኀደጎ፡ እግዚአብሔር
  choice: le Seigneur ne lui permit pas
  rationale: Rend naturellement la négation et le verbe de permission, tout en conservant le Seigneur comme sujet.
- source_word: ይሕስም፡ ላዕለ፡ ያዕቆብ
  choice: faire du mal à Jacob
  rationale: Expression française claire et idiomatique correspondant à l’intention nuisible dirigée contre Jacob, sans préciser une forme de mal absente du texte.
- source_word: አስተረአዮ፡ በሕልም
  choice: il lui était apparu en rêve
  rationale: Le plus-que-parfait marque l’apparition antérieure à l’empêchement rapporté; « en rêve » est naturel en français moderne.
theological_decisions:
- issue: Référent du sujet dans « il lui était apparu »
  choice: Conserver le pronom « il », renvoyant naturellement au Seigneur
  alternative: Répéter « le Seigneur lui était apparu »
  rationale: Le texte source emploie une forme pronominale dont le référent contextuel est le Seigneur; le pronom préserve la concision sans introduire d’interprétation supplémentaire.
translation_notes:
  register: Français international moderne, simple et digne. La relation causale est rendue par « parce que », et l’antériorité de l’apparition par le plus-que-parfait.
