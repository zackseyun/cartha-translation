  text: And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father's livestock and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at the Well of the Oath.
translation:
  language: fr
  text: Il y demeura à l’écart d’Ésaü, son fils. En effet, à l’époque où Jacob partit pour la Mésopotamie, Ésaü prit pour femme Mahalath, fille d’Ismaël. Il rassembla tout le bétail de son père ainsi que ses femmes, monta et demeura sur le mont Séir, et laissa son père Isaac au Puits du Serment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Beer-Shéba. Les mots correspondants manquent dans l’extrait reproduit ici, qui s’interrompt après la préposition « à/dans », mais figurent dans le texte complet de l’édition.
    reason: Signaler avec transparence la restauration requise par la coupure matérielle de l’extrait source et identifier le toponyme biblique.
lexical_decisions:
- source_word: ኀደረ፡ ህየ፡ እምዓሳው፡ ወልዱ
  choice: Il y demeura, loin de son fils Ésaü
  rationale: Rend le verbe « demeurer » et la séparation exprimée par እም, tout en conservant le lien explicite « son fils ».
- source_word: መስጴጦምያ
  choice: la Mésopotamie
  rationale: Transcription gé’ez du nom géographique Mésopotamie.
- source_word: ነሥአ፡ ለርእሱ፡ … ብእሲተ
  choice: prit pour femme
  rationale: Expression française naturelle correspondant littéralement à « prit pour lui-même … une femme ».
- source_word: ኵሎ፡ መርዔተ፡ አቡሁ
  choice: tout le bétail de son père
  rationale: Le terme collectif désigne les troupeaux ou le cheptel au sens large; « bétail » évite de le limiter aux ovins.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Puits du Serment
  rationale: Traduction du toponyme littéral attesté dans la suite complète du texte de l’édition; il correspond à Beer-Shéba.
