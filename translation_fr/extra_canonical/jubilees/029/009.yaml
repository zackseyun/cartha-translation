  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
translation:
  language: fr
  text: « Le Monceau du témoignage », d’après ce monceau.[a] Mais autrefois, on appelait le pays de Galaad « pays des Rephaïm », car c’était le pays des Rephaïm. C’est là que naquirent les Rephaïm, des géants dont la taille était de dix coudées, de neuf coudées, de huit coudées, et jusqu’à sept coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte guèze transmis dit littéralement : « La Fête [ou la Joie] du témoignage, d’après cette fête [ou joie] ». On corrige généralement cette leçon en « Monceau du témoignage », conformément à l’étymologie de Galaad évoquée ici et au récit de Genèse 31.47-48.'
    reason: textual_variant
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዐ ... ፍሥሐት
  choice: « Le Monceau du témoignage », d’après ce monceau
  rationale: Le texte transmis porte littéralement un terme signifiant « joie/fête », mais le contexte étiologique de Galaad et la tradition de Genèse 31 indiquent une corruption ancienne pour « monceau ». La traduction adopte l’émendation largement reconnue tout en signalant la leçon manuscrite en note.
- source_word: ምድረ፡ ገለአድ
  choice: le pays de Galaad
  rationale: « Pays » rend naturellement ምድር dans ce contexte territorial; « Galaad » est la forme française biblique usuelle.
- source_word: ረፋኤም / ራፋኤም
  choice: les Rephaïm
  rationale: Transcription française traditionnelle du nom de ce peuple ancien, préférable à une interprétation qui identifierait ou expliquerait davantage leur nature.
- source_word: ረዐይት
  choice: des géants
  rationale: Le contexte immédiat décrit leur stature extraordinaire; « géants » rend clairement le sens du terme dans ce passage.
- source_word: በአመት
  choice: coudées
  rationale: Dans cette description de taille, le terme désigne l’unité de longueur attendue; la série numérique correspond à des hauteurs en coudées.
theological_decisions:
- issue: Rapport entre les Rephaïm et les géants
  choice: « les Rephaïm, des géants »
  alternative: « les Rephaïm — des géants » ou simple translittération sans apposition
  rationale: L’apposition suit le mouvement du texte et décrit leur stature sans imposer une théorie sur leur identité ou leur nature.
- issue: Étiologie du nom de Galaad
  choice: Conserver successivement le nom mémoriel « Monceau du témoignage » et l’ancienne désignation « pays des Rephaïm »
  alternative: Fusionner les deux explications en une seule
  rationale: Le passage superpose volontairement deux traditions toponymiques; les maintenir distinctes préserve cette tension historique et littéraire.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la répétition de « pays des Rephaïm » et l’énumération des tailles, caractéristiques du texte source, tout en évitant une formulation excessivement archaïque.
