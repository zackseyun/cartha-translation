  text: at the time of autumn. And he sent to his father Isaac from all his possessions clothing and food, meat.
translation:
  language: fr
  text: au temps de l’automne. Et il envoya à son père Isaac, de tous ses biens, des vêtements et des vivres — de la viande[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la nourriture, de la viande » ; la viande peut préciser le type de vivres envoyé.'
    reason: La relation syntaxique entre « nourriture » et « viande » est concise et peut être comprise comme une apposition explicative.
lexical_decisions:
- source_word: አመ፡ አቅራቦት
  choice: au temps de l’automne
  rationale: L’expression temporelle achève vraisemblablement l’énumération saisonnière du verset précédent; አቅራቦት désigne ici l’automne et non l’action d’apporter.
- source_word: ወይፌኑ
  choice: Et il envoya
  rationale: Le verbe exprime l’envoi; il ne signifie pas ici « il apporta ».
- source_word: እምኵሉ፡ ጥሪቱ
  choice: de tous ses biens
  rationale: Rend l’idée de prélèvement ou d’envoi à partir de l’ensemble de ses possessions, sans prétendre qu’il les envoya toutes.
- source_word: ልብሰ
  choice: des vêtements
  rationale: Équivalent français direct et naturel du nom désignant l’habillement.
- source_word: ሲሲተ፡ ሥጋ
  choice: des vivres — de la viande
  rationale: Conserve la juxtaposition du terme général « vivres/nourriture » et de « viande », sans transformer ሲሲተ en « prémices ».
