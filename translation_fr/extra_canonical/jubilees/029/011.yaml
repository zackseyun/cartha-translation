  to: Leurs royaumes étaient Qarnaïm, Ashtaroth, Édréï, Misour et Béon[a]. Le Seigneur les anéantit à cause de leurs mauvaises actions, car ils étaient extrêmement rebelles à la loi. Il fit habiter à leur place les Amorites, peuple mauvais et pécheur. Jusqu’à ce jour, aucun peuple n’a mené à leur terme tous ses péchés, et eux-mêmes n’existent plus.
