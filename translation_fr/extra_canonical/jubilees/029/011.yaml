  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
translation:
  language: fr
  text: Leurs royaumes étaient Qarnaïm, Ashtaroth, Édréï, Misour et Béon[a]. Le Seigneur les anéantit à cause de leurs mauvaises actions, car ils étaient extrêmement rebelles à la loi. Il fit habiter à leur place les Amorites, peuple mauvais et pécheur. Jusqu’à ce jour, aucun peuple n’a mené à leur terme tous ses péchés, et eux-mêmes n’existent plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plusieurs noms de lieux de cette liste du territoire des Rephaïm sont difficiles à établir dans la transmission éthiopienne; les translittérations retenues ici restent prudentes.
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: Leurs royaumes
  rationale: Le substantif est pluriel avec suffixe possessif de troisième personne du pluriel.
- source_word: ቃራናኤም፡ ወአስጠሮስ፡ ወአድራእ፡ ወሚሱር፡ ወቤዎን
  choice: Qarnaïm, Ashtaroth, Édréï, Misour et Béon
  rationale: Translittérations françaises prudentes des toponymes transmis en guèze; la note signale leur caractère difficile.
- source_word: አሕጐሎሙ
  choice: les anéantit
  rationale: Rend le sens causatif de destruction ou de disparition dans un français naturel et soutenu.
- source_word: ጸዋጋን
  choice: rebelles à la loi
  rationale: Le terme exprime l’absence de loi ou le mépris de celle-ci; cette formulation évite l’ambiguïté moderne de « sans-loi ».
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: Il fit habiter à leur place les Amorites
  rationale: Conserve la valeur causative et l’idée explicite de remplacement territorial.
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: n’a commis tous leurs péchés
  rationale: Traduit littéralement l’idée d’accomplir ou de mener à son terme l’ensemble de leurs péchés, sans ajouter la notion interprétative de « pleine mesure ».
- source_word: ወአልቦሙ
  choice: et eux-mêmes n’existent plus
  rationale: Le texte transmis se termine par une formule elliptique; cette restitution naturelle suit le sens contextuel probable sans prétendre que la syntaxe est pleinement conservée.
theological_decisions:
- issue: Rapport à la loi exprimé par ጸዋጋን
  choice: rebelles à la loi
  alternative: sans loi / très iniques
  rationale: La formulation choisie préserve la dimension morale et juridique du terme sans l’identifier à une doctrine confessionnelle particulière.
- issue: Accomplissement des péchés
  choice: aucun peuple n’a commis tous leurs péchés
  alternative: aucun peuple n’a atteint la pleine mesure de leurs péchés
  rationale: La solution retenue reste proche du texte guèze et n’importe pas l’image théologique d’une « mesure » absente de la formulation source.
translation_notes:
  register: Français international moderne, digne et lisible. Les phrases ont été légèrement segmentées pour la clarté. « Qarnaïm » suit une translittération francisée du guèze, tandis que les autres toponymes restent proches des formes traditionnelles. La dernière proposition, elliptique dans le texte transmis, est rendue avec retenue.
