lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: leur territoire s’étendait
  rationale: Le terme désigne leur demeure ou leur zone d’habitation; cette formulation rend naturellement ici l’étendue géographique introduite par «depuis… jusqu’à».
- source_word: ውሉደ አሞን
  choice: les fils d’Ammon
  rationale: Traduction formelle de l’expression filiale désignant les Ammonites, sans remplacer l’image du texte source.
- source_word: ደብረ ሔርሞን
  choice: le mont Hermon
  rationale: ደብር désigne ici une montagne, suivi du nom propre Hermon.
- source_word: ወቤተ
  choice: et à la maison de…
  rationale: ቤተ est une forme construite, «maison de»; ce n’est pas le nom propre Béthel. La segmentation fournie interrompt la construction avant son complément.
