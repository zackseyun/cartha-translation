  text: and drink[16], and milk, and butter, and bread of milk, and from the instruction of all. And for his mother Rebekah, a fourth of the year, in the middle of their times of the months, and between plowing and reaping, and in the middle.
translation:
  language: fr
  text: ainsi que de la boisson, du lait, du beurre, du pain de lait[a] et des dattes de la vallée[b]. Et pour sa mère Rébecca, un quart de l’année, au milieu de leurs périodes mensuelles, entre les labours et la moisson, et au milieu…[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pain de lait »; l’expression peut désigner un produit laitier solidifié, peut-être du fromage.'
