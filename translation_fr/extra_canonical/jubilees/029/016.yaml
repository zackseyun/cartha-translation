lexical_decisions:
- source_word: ኅብስተ፡ ሐሊብ
  choice: fromage
  rationale: L’expression signifie littéralement « pain de lait », mais elle désigne vraisemblablement du lait solidifié, donc du fromage. Une note conserve la forme littérale.
- source_word: ትመርት፡ ቍላ
  choice: dattes de la vallée
  rationale: ትመርት désigne les dattes; ቍላ est compris prudemment comme une vallée ou une basse région. L’expression demeure incertaine, ce que signale la note.
- source_word: ርብዕ፡ ለዓመት
  choice: quatre fois par an
  rationale: Dans cette indication de fréquence, ርብዕ est mieux compris comme « quatre fois » que comme « un quart de l’année ».
- source_word: ማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ
  choice: entre les labours et la moisson
  rationale: La construction ማእከለ…ወ… exprime ici l’intervalle entre deux activités; ሐፅኒ renvoie aux labours et ዐጺድ à la moisson.
