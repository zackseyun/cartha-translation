  text: Spring and rain and the middle of winter and summer were in the tower of Abraham. For Isaac had returned from the Well of the Oath and had gone up to the cave of his father Abraham.
translation:
  language: fr
  text: Le printemps, la pluie, le milieu de l’hiver et l’été étaient dans la tour d’Abraham. Car Isaac était revenu du Puits du Serment[a] et était monté dans la tour de son père Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Beer-Shéba (Bersabée). Le nom est traditionnellement associé à « serment »; son étymologie est discutée.
    reason: Identifie le lieu rendu littéralement tout en préservant l’ambiguïté étymologique du toponyme.
lexical_decisions:
- source_word: ማኅፈደ (maḫfada)
  choice: tour
  rationale: Le terme désigne ici la tour d’Abraham; le rendre par « grotte » serait une confusion lexicale et contextuelle.
- source_word: ዐዘቅተ፡ መሐላ (ʿazaqta maḥālā)
  choice: Puits du Serment
  rationale: Traduction transparente des éléments « puits » et « serment », avec majuscules puisqu’il s’agit d’un nom de lieu.
- source_word: ማእከለ፡ ክረምት (maʾkala krəmt)
  choice: le cœur de l’hiver
  rationale: Expression française naturelle qui conserve l’idée du milieu de la saison hivernale.
- source_word: ዐርገ (ʿarga)
  choice: était monté
  rationale: Conserve le mouvement ascendant explicitement exprimé par le verbe source.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’énumération saisonnière inhabituelle est maintenue plutôt que réorganisée, afin de respecter la forme du texte guèze. « Se passèrent » rend naturellement l’idée que ces périodes furent vécues dans la tour.
