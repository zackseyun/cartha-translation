  yaml_path: translation/extra_canonical/jubilees/029/007.yaml
  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: fr
  text: 'pendant la nuit et informa Laban au sujet de Jacob. Le quinzième jour de cette période, Jacob donna un festin pour Laban et pour tous ceux qui étaient venus avec lui. Ce jour-là, Jacob prêta serment à Laban, et Laban fit de même envers Jacob : aucun des deux ne passerait chez l’autre avec de mauvaises intentions, sur la montagne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሊተ
  choice: pendant la nuit
  rationale: Rend naturellement l’accusatif/adverbial guèze « de nuit » tout en conservant le raccord syntaxique avec le contexte précédent.
- source_word: ገብረ … ግዝአ
  choice: donna un festin
  rationale: L’expression désigne ici la préparation ou la tenue d’un banquet; « donna un festin » est idiomatique en français moderne.
- source_word: መሐለ
  choice: prêta serment
  rationale: Correspond directement au verbe signifiant jurer ou prêter serment.
- source_word: ኢይትዐደዉ አሐዱ ኀበ ካልኡ
  choice: aucun des deux ne franchirait la limite vers l’autre
  rationale: Conserve l’idée réciproque d’un passage de l’un vers l’autre; « la limite » explicite sobrement la valeur contextuelle sans identifier un lieu absent du segment.
- source_word: በእኩይ
  choice: avec de mauvaises intentions
  rationale: Rend le sens adverbial « pour le mal / avec malveillance » en français naturel.
- source_word: በደብረ
  choice: sur la montagne
  rationale: Traduit littéralement le syntagme prépositionnel tel qu’il est conservé, sans compléter un nom propre absent.
theological_decisions:
- issue: Nature exacte de l’interdiction réciproque
  choice: ne franchirait la limite vers l’autre avec de mauvaises intentions
  alternative: ne passerait pas auprès de l’autre pour lui faire du mal
  rationale: La formulation retenue maintient à la fois l’idée spatiale du franchissement et la qualification morale, sans transformer explicitement le serment en menace d’agression.
translation_notes:
  register: Français international moderne, narratif et digne. Le début demeure volontairement fragmentaire, car le verset transmis commence par la fin d’une proposition antérieure. La dernière mention de la montagne est conservée sans ajout conjectural.
