  text: life upon the earth.[12] And Jacob sent Laban away,, and he went into Mesopotamia, the land of the east; and Jacob returned to the land of Gilead. And he crossed the Jabbok in the ninth month, on the eleventh; and on that day Esau his brother came to him, and he was reconciled with him,
translation:
  language: fr
  text: de vie sur la terre.[a] Jacob renvoya Laban, qui partit en Mésopotamie, au pays de l’Orient. Jacob retourna au pays de Galaad. Le onzième jour du neuvième mois, il traversa le Yabboq. Ce jour-là, son frère Ésaü vint à sa rencontre et se réconcilia avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition complète peut aussi se comprendre ainsi : « il ne leur resta plus aucun vestige de vie sur la terre ».'
