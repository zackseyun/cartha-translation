lexical_decisions:
- source_word: ሕይወት (ḥəywät)
  choice: vie
  rationale: Correspondance directe avec le substantif guèze désignant la vie; le début fragmentaire est conservé parce que le verset commence au milieu d’une phrase.
- source_word: ምድር (mədr)
  choice: terre
  rationale: Rend le sens ordinaire de «terre» dans l’expression «sur la terre».
- source_word: ፈነወ (fännäwä)
  choice: renvoya
  rationale: Dans ce contexte, exprime naturellement le fait que Jacob laisse Laban repartir, sans suggérer qu’il lui transmet simplement un message.
- source_word: ሜስጶ…
  choice: Mésopotamie
  rationale: Restitue le toponyme identifiable dans la forme tronquée de l’extrait fourni.
- source_word: Jabbok
  choice: Yabboq
  rationale: Forme française moderne et reconnaissable du nom de la rivière biblique.
theological_decisions:
- issue: Sujet de la réconciliation entre Ésaü et Jacob
  choice: son frère Ésaü vint à sa rencontre et se réconcilia avec lui
  alternative: son frère Ésaü vint à sa rencontre, et ils se réconcilièrent
  rationale: Conserve l’enchaînement et le sujet grammatical transmis par le texte de consultation, sans transformer explicitement l’action en réconciliation mutuelle, même si celle-ci est impliquée.
- issue: Portée de la proposition initiale fragmentaire
  choice: de vie sur la terre
  alternative: il ne leur resta plus aucune vie sur la terre
  rationale: Le verset fourni commence au milieu d’une proposition. Le texte principal en maintient la forme fragmentaire afin de ne pas reconstruire silencieusement les mots relevant du verset précédent; la note signale l’autre compréhension possible.
