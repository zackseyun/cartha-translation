  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: fr
  text: avant Térah, son père. On l’enterra à Our des Chaldéens. Térah quitta Our des Chaldéens avec ses fils pour se rendre au pays du Liban et au pays de Canaan. Il s’établit au pays de Harrân, et Abram demeura avec Térah, son père, à Harrân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቀበርዎ
  choice: On l’enterra
  rationale: Le verbe signifie « enterrer »; le sujet pluriel indéterminé est rendu naturellement en français par « on », tandis que le pronom objet singulier est conservé.
- source_word: ወወፅአ
  choice: quitta
  rationale: Dans ce contexte de départ géographique, « quitta » rend naturellement l’idée de sortir de Our.
- source_word: ከመ፡ ይምጽኡ
  choice: pour se rendre
  rationale: Rend la proposition de but, littéralement « afin qu’ils viennent/aillent », dans un français idiomatique sans affirmer qu’ils atteignirent Canaan.
- source_word: ምድረ፡ ሊባኖስ
  choice: pays du Liban
  rationale: Conserve le sens territorial de « terre/pays » et le toponyme Liban.
- source_word: ወኀደረ
  choice: s’établit / demeura
  rationale: Le même verbe exprime le fait de rester ou séjourner; les deux rendus français sont adaptés à leurs sujets respectifs et évitent une répétition pesante.
- source_word: ካራን
  choice: Harrân
  rationale: Forme française usuelle du toponyme biblique, avec accent circonflexe pour guider la prononciation.
