base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/003.yaml
  text: And in the days of Serug there arose wars and all the sons of men turned to making graven images and carved images and unclean things, and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.
translation:
  language: fr
  text: Aux jours de Seroug[a], des guerres éclatèrent. Tous les fils des hommes se mirent à fabriquer des idoles gravées, des images sculptées et des choses impures. Les esprits mauvais les aidaient et les égaraient, afin qu’ils commettent transgression et impureté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Séroh ».
    reason: Variante de transcription du nom attestée dans la tradition de rendu.
lexical_decisions:
- source_word: Serug / Seroh
  choice: Seroug
  rationale: Forme française biblique usuelle du nom, cohérente avec Genèse 11. La variante « Séroh » est conservée en note.
- source_word: graven images / carved images
  choice: idoles gravées, images sculptées
  rationale: Conserve les deux expressions parallèles sans les fondre, tout en rendant leur caractère cultuel compréhensible en français.
- source_word: sons of men
  choice: fils des hommes
  rationale: Maintient l’expression anthropologique traditionnelle et sa portée collective.
- source_word: evil spirits
  choice: esprits mauvais
  rationale: Rendu direct et non confessionnel, sans préciser davantage leur nature.
- source_word: transgression and uncleanness
  choice: transgression et impureté
  rationale: Préserve les deux notions distinctes, morale et rituelle, ainsi que leur tension.
theological_decisions:
- issue: Rôle des esprits mauvais dans la faute humaine
  choice: « les aidaient et les égaraient, afin qu’ils commettent »
  alternative: « les poussaient à commettre »
  rationale: Conserve à la fois l’assistance au mal, l’égarement et la finalité exprimée, sans supprimer la responsabilité humaine ni expliquer le mécanisme spirituel.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des images, ainsi que le doublet « transgression et impureté », est volontairement conservé.
