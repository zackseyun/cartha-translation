base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/005.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits—those placed under his hand—to do all manner of wrong and sin and all manner of transgression, to corrupt and destroy, and to shed blood on the earth.
translation:
  language: fr
  text: Le prince Mastéma déploya tous ses efforts pour accomplir tout cela. Il envoya d’autres esprits, ceux qui étaient placés sous son autorité, afin qu’ils commettent toutes sortes de méfaits, de péchés et de transgressions, qu’ils corrompent et détruisent, et qu’ils répandent le sang sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince Mastema
  choice: le prince Mastéma
  rationale: Conserve le titre et le nom propre traditionnel, avec une graphie française accentuée.
- source_word: exerted himself
  choice: déploya tous ses efforts
  rationale: Rend naturellement l’idée d’une action volontaire et énergique sans ajouter de motif.
- source_word: spirits—those placed under his hand
  choice: des esprits, ceux qui étaient placés sous son autorité
  rationale: « Sous son autorité » exprime clairement l’image sémitique de subordination sans suggérer une position physique.
- source_word: wrong
  choice: méfaits
  rationale: Terme courant et digne qui désigne des actes mauvais, distincts des « péchés » et des « transgressions ».
- source_word: to shed blood
  choice: répandent le sang
  rationale: Conserve l’expression biblique usuelle désignant la violence meurtrière.
theological_decisions:
- issue: Statut personnel de Mastéma
  choice: Employer des formulations personnelles et masculines pour Mastéma
  alternative: Employer un pronom ou une formulation impersonnelle
  rationale: Le passage présente Mastéma comme un prince agissant intentionnellement et commandant des esprits subordonnés.
- issue: Nature des esprits subordonnés
  choice: Les désigner simplement comme « d’autres esprits »
  alternative: Les qualifier explicitement de démons ou d’esprits mauvais
  rationale: La traduction ne précise pas leur catégorie au-delà de ce qu’indiquent leur subordination et leur mission destructrice.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « toutes sortes de » est légèrement resserrée pour éviter une lourdeur, tandis que la série méfaits–péchés–transgressions et les verbes corrompre–détruire–répandre sont préservés.
