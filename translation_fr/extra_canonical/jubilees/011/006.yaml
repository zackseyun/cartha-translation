  text: for those who make them, and a straying of heart for those who worship them. Do not worship them.” And his father said to him[6], “I also know, my son, but what can I do for a people who have made me subject to them?
translation:
  language: fr
  text: 'pour ceux qui les fabriquent, et un égarement du cœur pour ceux qui les adorent.[a] Ne les adore pas. » Son père lui répondit : « Moi aussi, je le sais, mon fils. Mais que puis-je faire face à un peuple qui m’a assujetti à eux ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation guèze de cette proposition est difficile. On pourrait aussi comprendre : « pour ceux qui les fabriquent, tandis que le cœur de ceux qui les adorent s’égare ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሕተት፡ ልብ
  choice: un égarement du cœur
  rationale: Rend la construction nominale difficile sans la transformer artificiellement en proposition verbale; « égarement » exprime l’idée d’erreur ou de déviation du cœur.
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: les adorent / Ne les adore pas
  rationale: Le verbe désigne ici le culte rendu aux objets fabriqués; « adorer » est naturel et conserve la portée religieuse.
- source_word: እትአዘዝ
  choice: m’a soumis à eux
  rationale: Le verbe exprime l’obéissance ou l’assujettissement, et non l’égarement. La formulation garde l’image du père placé sous l’autorité des idoles ou sous la contrainte du peuple à leur égard.
theological_decisions:
- issue: Rapport syntaxique de la première proposition avec le contexte précédent
  choice: Conserver le fragment introductif « pour ceux qui les fabriquent »
  alternative: Compléter implicitement la proposition par un verbe tiré du verset précédent
  rationale: Le texte fourni paraît poursuivre la phrase du verset précédent. Ajouter un verbe résoudrait une discontinuité éditoriale au-delà de ce que permet cette unité isolée.
- issue: Sens de l’assujettissement final
  choice: « un peuple qui m’a soumis à eux »
  alternative: « un peuple qui m’a contraint à leur obéir »
  rationale: La traduction retenue préserve l’ambiguïté du référent de « eux » et la tension du texte, sans expliquer si l’assujettissement est social, cultuel ou économique.
translation_notes:
  register: Français moderne, digne et accessible. Le début demeure volontairement fragmentaire, car il prolonge vraisemblablement le verset précédent. Le tutoiement convient au dialogue entre le père et son fils.
