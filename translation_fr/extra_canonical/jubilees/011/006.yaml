  source_fidelity: 'Le rendu conserve correctement le caractère fragmentaire de l’ouverture et le sens nominal difficile de ከሕተት፡ ልብ (« un égarement du cœur »). « Ne les adore pas » rend fidèlement l’interdiction. La dernière proposition doit toutefois exprimer plus directement le causatif « ceux qui m’ont fait obéir / qui m’ont assujetti à eux » : « m’a soumis à eux » est moins idiomatique et obscurcit cette relation.'
  naturalness: Le français est globalement moderne et soutenu. « Un peuple qui m’a assujetti à eux » est plus naturel et plus précis que « qui m’a soumis à eux », tout en conservant l’ambiguïté du référent de « eux ».
  terminology: « Fabriquent » et « adorent » conviennent au contexte d’objets cultuels. « Égarement du cœur » respecte la construction nominale et évite de résoudre sans nécessité la difficulté textuelle. « Assujetti » exprime l’idée d’être placé sous l’obéissance ou la domination d’autrui, sans imposer une explication doctrinale ou sociale.
