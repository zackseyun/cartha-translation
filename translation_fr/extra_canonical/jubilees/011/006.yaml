    issue: Formulation finale insuffisamment idiomatique
    rationale: En français, « soumettre quelqu’un à eux » est possible mais lourd et moins net. Le guèze exprime que le peuple a fait le père obéir / l’a placé sous leur autorité. « M’a assujetti à eux » rend cela plus naturellement sans identifier le référent du pronom.
