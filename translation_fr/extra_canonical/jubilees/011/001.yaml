  yaml_path: translation/extra_canonical/jubilees/011/001.yaml
  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
translation:
  language: fr
  text: Au trente-cinquième jubilé[a], dans la troisième semaine, en sa première année, Réou prit pour femme Ora, fille d’Our, fils de Késed. Elle lui donna un fils, qu’il appela Séroh, la septième année de cette semaine, dans ce jubilé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze porte « trente-cinquième », ou une forme altérée de ce nombre. Cette lecture correspond à la suite chronologique interne du livre des Jubilés.
    reason: textual_correction
lexical_decisions:
- source_word: እዮቤልው
  choice: jubilé
  rationale: Terme consacré en français pour le cycle chronologique propre au livre des Jubilés.
- source_word: ሱባዔ
  choice: semaine
  rationale: Rend littéralement la période de sept ans dans la formule chronologique du livre, sans ajouter « d’années », absent du texte.
- source_word: ነሥአ፡ ሎቱ፡ … ብእሲተ
  choice: prit pour femme
  rationale: Expression française naturelle qui conserve le sens de « prendre pour soi une femme ».
- source_word: ጸውዐ፡ ስሞ
  choice: qu’il appela
  rationale: Rend naturellement l’expression sémitique « il appela son nom ».
- source_word: ሴሮኅ
  choice: Séroh
  rationale: Translittération française proche de la forme guèze transmise, sans l’assimiler silencieusement à une autre forme onomastique.
