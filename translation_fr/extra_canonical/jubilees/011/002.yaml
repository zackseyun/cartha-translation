  text: And the son grew[2], and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.
translation:
  language: fr
  text: 'L’enfant grandit[a], et son père lui enseigna les pratiques divinatoires des Chaldéens : prédire l’avenir et tirer des présages d’après les signes du ciel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les versets 2 à 5 ne figurent pas dans la segmentation du texte guèze fournie. La numérotation conservée et le contexte du chapitre supposent toutefois ici un passage intermédiaire concernant Seroh, la divination chaldéenne et le rôle de Mastéma dans l’idolâtrie. Le présent verset suit le sens attendu de ce passage; sa formulation ne peut donc pas être vérifiée directement à partir de l’extrait fourni.
    reason: segmentation_note
lexical_decisions:
- source_word: the son grew (reconstructed intervening text)
  choice: L’enfant grandit
  rationale: « L’enfant » reprend naturellement le fils nommé au verset précédent, tandis que « grandit » conserve la progression narrative sans ajouter de précision absente.
- source_word: investigations of the Chaldeans (reconstructed intervening text)
  choice: les pratiques divinatoires des Chaldéens
  rationale: Dans ce contexte, ces « investigations » portent sur la divination astrale; cette formulation française en rend clairement la fonction sans suggérer une recherche scientifique moderne.
- source_word: to divine (reconstructed intervening text)
  choice: prédire l’avenir
  rationale: Expression courante et intelligible qui transmet le sens divinatoire du verbe.
- source_word: to practice augury (reconstructed intervening text)
  choice: tirer des présages
  rationale: Rend l’activité d’interprétation des présages dans un français actuel et digne.
- source_word: signs of heaven (reconstructed intervening text)
  choice: les signes du ciel
  rationale: Conserve l’imagerie céleste et l’ambiguïté de « ciel », sans préciser indûment qu’il s’agit seulement des astres.
theological_decisions:
- issue: Caractère condamnable ou démoniaque de la divination chaldéenne
  choice: Décrire ici la transmission de ces pratiques sans ajouter de jugement explicite
  alternative: Qualifier dès ce verset ces pratiques d’idolâtres ou de démoniaques
  rationale: Le fragment reconstruit rapporte un enseignement; le jugement théologique appartient au contexte plus large et ne doit pas être importé dans ce verset.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le terme potentiellement trompeur « investigations » et explicite sa valeur divinatoire, tout en conservant « signes du ciel » au plus près de l’idiome ancien.
