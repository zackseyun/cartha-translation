lexical_decisions:
- source_word: ያምልክዎሙ፡ ወይስብሕዎሙ
  choice: qu’ils les adorent et les louent
  rationale: Les deux verbes ont un sujet à la troisième personne du pluriel et un complément pronominal pluriel ; « adorer » et « louer » rendent naturellement les deux actions cultuelles.
- source_word: አርምም
  choice: Garde le silence
  rationale: Impératif adressé au fils ; cette formulation française est naturelle et conserve la force de l’ordre.
- source_word: ከመ፡ አይቅትሉከ
  choice: de peur qu’ils ne te tuent
  rationale: Rend la proposition de crainte et sa négation grammaticale sans laisser entendre une simple éventualité neutre.
- source_word: ወነገረ
  choice: Et il lui raconta
  rationale: Le verbe introduit la suite du récit et le verset transmis s’interrompt après cette forme ; « raconta » convient au contexte narratif, tandis que le complément indirect est explicité naturellement en français.
theological_decisions:
- issue: Sujet des verbes d’adoration et de louange
  choice: ils
  alternative: tu / vous
  rationale: La morphologie guèze indique un sujet à la troisième personne du pluriel ; la traduction ne transforme donc pas cette déclaration en ordre adressé au fils.
translation_notes:
  register: Français moderne, digne et narratif. Le fragment final est volontairement laissé ouvert, puisque le texte fourni se poursuit au-delà de cette unité.
