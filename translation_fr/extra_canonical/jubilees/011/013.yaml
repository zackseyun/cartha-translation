lexical_decisions:
- source_word: ወተንሥኡ፡ በሌሊት፡
  choice: Ils se levèrent pendant la nuit
  rationale: Rend directement le verbe « se lever » et l’indication temporelle, dans un français naturel.
- source_word: ወፈቀዱ፡ ያድኅኑ፡
  choice: et voulurent sauver
  rationale: Préserve la construction volitive suivie du verbe « sauver, délivrer ».
- source_word: አማልክቲሆሙ፡
  choice: leurs dieux
  rationale: Équivalent direct du pluriel possessif.
- source_word: እማእከለ፡ እሳት።
  choice: du milieu du feu
  rationale: Conserve l’expression spatiale de la source sans la simplifier en « des flammes ».
- source_word: ወሰረረ፡ አራን፡
  choice: Alors Harân s’élança
  rationale: Le verbe exprime un mouvement brusque, tel que « bondir, s’élancer, se précipiter ». « Harân » est la forme biblique française usuelle du nom.
