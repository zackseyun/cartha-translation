base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/004.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.
translation:
  language: fr
  text: Le prince Mastéma s’employa à faire tout cela. Il envoya d’autres esprits, ceux qui étaient placés sous son autorité, pour commettre toutes sortes d’erreurs, de péchés et de transgressions, afin de corrompre, de détruire et de répandre le sang sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: Mastéma
  rationale: Translittération française usuelle du nom propre, avec accentuation adaptée à la lecture moderne.
- source_word: those set under his hand
  choice: ceux qui étaient placés sous son autorité
  rationale: Rend naturellement en français l’image sémitique de la main comme expression de pouvoir ou d’autorité.
- source_word: error and sin and transgression
  choice: erreurs, de péchés et de transgressions
  rationale: Conserve l’accumulation de trois termes moralement distincts sans les fondre en une seule notion.
- source_word: shed blood
  choice: répandre le sang
  rationale: Maintient l’expression traditionnelle et concrète désignant la violence meurtrière.
theological_decisions:
- issue: Statut de Mastéma et des autres esprits
  choice: « prince Mastéma » et esprits « placés sous son autorité »
  alternative: Identifier Mastéma à Satan ou qualifier explicitement les esprits de démons
  rationale: Le texte présente une hiérarchie spirituelle sans imposer ici une identification doctrinale plus précise.
- issue: Rapport entre les actions des esprits et leurs conséquences
  choice: « pour commettre… afin de corrompre… »
  alternative: Présenter la corruption et la destruction comme de simples effets non intentionnels
  rationale: La construction finale du texte de consultation indique un dessein, tout en distinguant les actes commis de leur objectif destructeur.
translation_notes:
  register: Français moderne, clair et digne. Le dossier guèze fourni saute du verset 1 au verset 6 et ne contient donc pas le texte de 11:4; cette proposition repose nécessairement sur la couche anglaise auditée, avec une formulation qui évite toute précision doctrinale absente de cette attestation.
