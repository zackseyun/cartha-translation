  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
translation:
  language: fr
  text: pendant deux semaines d’années.[a] La sixième semaine, en sa cinquième année, Abram veilla toute la nuit, au début du septième mois, afin d’observer les étoiles du soir jusqu’à l’aube et de voir ce que serait l’année quant aux pluies. Il était là, assis seul à observer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « deux semaines d’années », c’est-à-dire deux périodes de sept ans. Le livre des Jubilés compte régulièrement le temps selon ces unités schématiques.
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት
  choice: deux semaines d’années
  rationale: Conserve l’unité chronologique schématique propre aux Jubilés plutôt que de la convertir silencieusement en « quatorze ans ».
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: au début du septième mois
  rationale: Rend naturellement l’indication liée au commencement ou au lever du mois sans imposer une précision calendaire plus étroite que le texte.
- source_word: ያበይነ፡ ከዋክብተ
  choice: observer les étoiles
  rationale: Exprime l’examen attentif des astres indiqué par le contexte.
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: voir ce que serait l’année quant aux pluies
  rationale: Préserve la formulation ouverte sur le déroulement de l’année et son régime de pluies, sans surinterpréter le phénomène comme une prédiction certaine.
- source_word: ውእቱ፡ ባሕቲቱ፡ ይነብር
  choice: Il resta là, assis seul à observer
  rationale: Conserve l’insistance du texte sur la solitude et la veille prolongée d’Abram.
theological_decisions:
- issue: Nature de l’observation des étoiles par Abram
  choice: Décrire simplement son observation afin d’évaluer l’année quant aux pluies
  alternative: Qualifier explicitement cette pratique d’astrologie ou d’astronomie
  rationale: Le verset décrit l’acte sans lui attribuer ici une catégorie théologique ou scientifique précise; la traduction maintient cette tension narrative.
translation_notes:
  register: Français moderne, international et digne. Le fragment initial est maintenu comme prolongement du contexte précédent; la répétition de « resta » reflète la durée de la veille sans alourdir excessivement la phrase.
