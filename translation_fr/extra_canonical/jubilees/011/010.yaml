  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
translation:
  language: fr
  text: Son frère Arân prit femme la troisième année de la troisième semaine. Elle lui donna un fils la septième année de cette semaine, et il lui donna le nom d’Ur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’extrait guèze correspondant à ce découpage, la phrase s’arrête sur « et il appela » ; le nom « Ur » se trouve dans la suite immédiate du texte.
    reason: Signaler avec transparence que le complément nécessaire appartient à la suite immédiate du manuscrit édité et a été rattaché à ce verset conformément à la versification.
