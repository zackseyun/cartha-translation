  rationale: Rend naturellement la construction guèze « elle enfanta pour lui un fils » sans en modifier le sens.
- source_word: ወጸውዐ
  choice: et il l’appela
  rationale: Le verbe signifie « appeler, nommer » ; le complément « Our » est réuni au verbe selon la continuité textuelle et la versification retenue.
