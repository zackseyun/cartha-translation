  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
translation:
  language: fr
  text: Durant cette quatrième semaine, dans sa quatrième année, Abram se leva de nuit et incendia la maison des idoles. Il brûla tout ce qui se trouvait dans la maison, sans que personne le sache.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ፡ ራብዕ
  choice: cette quatrième semaine
  rationale: Le nom ሱባዔ désigne une semaine, ici dans le système chronologique du livre; le démonstratif ውእቱ est rendu naturellement par « cette » dans l’expression temporelle.
- source_word: አውዐየ
  choice: incendia / brûla
  rationale: Le verbe exprime l’action de mettre le feu ou de brûler. « Incendia » convient à la maison, tandis que « brûla » évite une répétition lourde dans la phrase suivante.
- source_word: ቤተ፡ ጣዖታት
  choice: la maison des idoles
  rationale: Traduction directe et idiomatique du syntagme désignant le bâtiment où se trouvent les idoles.
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: sans que personne le sache
  rationale: 'Cette tournure française naturelle conserve le sens littéral: aucune personne ne sut ce qui avait été fait.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la structure guèze tout en évitant une répétition maladroite de « incendier ». Le premier « Abram » du segment source est traité comme un reliquat de découpage provenant du verset précédent, conformément au contexte signalé.
