  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
translation:
  language: fr
  text: Il raconta cela à ses deux frères. Ils se mirent en colère contre lui et gardèrent le silence. Au quarantième jubilé, pendant la deuxième semaine d’années, la septième année de celle-ci, Abram prit pour femme Saraï, fille du père d’Abram[a], et elle devint sa femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « fille du père d’Abram » est conservée telle qu’elle est transmise, sans harmonisation avec la Genèse. Elle peut refléter un problème textuel ou une autre manière d’exprimer la parenté dans cette tradition.
    reason: textual_variant
lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: Il raconta cela
  rationale: Rend directement le démonstratif et le verbe au passé, dans un français naturel.
- source_word: ወተምዑ፡ ላዕሌሁ
  choice: Ils se mirent en colère contre lui
  rationale: Conserve le sujet pluriel renvoyant aux deux frères et la nuance hostile de la préposition.
- source_word: ወአርመሙ
  choice: gardèrent le silence
  rationale: Le verbe est à la troisième personne du pluriel; le rendu évite l’ancienne lecture fautive au singulier.
- source_word: በሱባዔ፡ ካልእ
  choice: pendant la deuxième semaine d’années
  rationale: Dans la chronologie des Jubilés, la « semaine » désigne une période de sept ans; l’explicitation légère évite une lecture en jours.
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ
  choice: Abram prit pour femme
  rationale: Expression française idiomatique correspondant littéralement à l’idée qu’Abram prit pour lui une femme.
- source_word: ሶራ
  choice: Saraï
  rationale: Emploie la forme française traditionnelle du nom de l’épouse d’Abram à cette étape du récit, conformément à l’identification contextuelle conservée par la tradition.
theological_decisions:
- issue: Lien de parenté de Saraï avec Abram
  choice: fille de son père
  alternative: harmoniser avec Genèse 20.12 (« fille de mon père, mais non de ma mère ») ou avec une autre généalogie
  rationale: La formulation transmise par la couche textuelle consultée est conservée sans ajout ni harmonisation, afin de ne pas résoudre artificiellement une difficulté textuelle ou généalogique.
translation_notes:
  register: Français international moderne, narratif et digne. Les repères chronologiques propres au livre sont conservés, avec « semaine d’années » pour rendre leur sens immédiatement intelligible. La coordination répétitive du guèze est légèrement allégée sans modifier la progression du récit.
