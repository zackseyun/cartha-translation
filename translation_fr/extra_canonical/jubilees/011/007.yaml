  text: And if I tell them the truth, they will kill me, for their souls are attached to them.
translation:
  language: fr
  text: Et si je leur dis la vérité, ils me tueront, car leurs âmes sont attachées à eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  choice: la vérité
  rationale: Dans ce contexte, le terme désigne ce qui est vrai ou juste; « la vérité » rend naturellement l’objet de « dire » en français.
- source_word: ይቀትሉኒ
  choice: ils me tueront
  rationale: Rend directement le verbe « tuer » avec le pronom objet de première personne et la valeur prospective du contexte.
- source_word: ተለውት፡ ነፍሶሙ
  choice: leur âme est attachée
  rationale: Conserve l’image anthropologique et le singulier collectif du texte guèze sans ajouter l’idée explicite d’adoration.
- source_word: ኀቤሆሙ
  choice: à eux
  rationale: Préserve la référence pronominale masculine plurielle et son ambiguïté contextuelle.
theological_decisions:
- issue: Nature de l’attachement final
  choice: Ne pas expliciter cet attachement comme une adoration
  alternative: « car leur âme s’attache à eux pour les adorer »
  rationale: Le texte fourni exprime l’attachement de leur âme, mais ne formule pas ici explicitement sa finalité cultuelle; l’ajout réduirait l’ambiguïté du texte.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste proche de la structure du guèze tout en étant naturelle; le singulier collectif « leur âme » est conservé.
