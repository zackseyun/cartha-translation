lexical_decisions:
- source_word: ወይቤልዎ
  choice: Mais ils lui dirent
  rationale: Le verbe au pluriel avec le suffixe objet singulier signifie « ils lui dirent ». « Mais » rend ici la valeur adversative naturelle de ወ dans le contexte.
- source_word: ከመ፡ ገብርከ
  choice: C’est ainsi que tu as agi
  rationale: ከመ exprime la manière (« ainsi ») et ገብርከ désigne l’action accomplie par l’interlocuteur.
- source_word: እምውርዝትከ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: depuis ta jeunesse jusqu’à ce jour
  rationale: Traduction directe de l’intervalle temporel allant de la jeunesse de l’interlocuteur au jour présent.
- source_word: ወአንተ
  choice: et toi…
  rationale: Le syntagme final ouvre une proposition qui se poursuit dans le verset suivant; les points de suspension signalent cette interruption sans inventer de complément.
