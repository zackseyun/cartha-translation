revisions:
- from: 'Alors Juda dit à Jacob, son père : « Père, tends ton arc, décoche tes flèches, abats l’ennemi et tue l’adversaire. Que la force soit avec toi ! Car nous ne tuerons pas ton frère : puisqu’il est ton proche et ton semblable, nous lui laisserons cet honneur. » Jacob tendit alors son arc, décocha une flèche, atteignit son frère Ésaü au côté droit de la poitrine et le tua. Il décocha une seconde flèche, atteignit Adoran l’Araméen au côté gauche de la poitrine, le repoussa et le tua.


    Alors les fils de Jacob et leurs esclaves sortirent des quatre côtés de la tour. Juda sortit le premier avec Nephtali et Gad ; cinquante esclaves les accompagnaient du côté sud de la tour. Ils tuèrent tous ceux qu’ils rencontrèrent devant eux, et pas un seul ne leur échappa. Lévi, Dan et Asher sortirent du côté est de la tour avec cinquante hommes et tuèrent les guerriers de Moab et d’Ammon. Ruben, Issacar et Zabulon sortirent du côté nord de la tour avec cinquante hommes et tuèrent les combattants de Philistie. Siméon, Benjamin et Hénok, fils de Ruben, sortirent du côté ouest de la tour avec cinquante hommes. Ils tuèrent quatre cents hommes robustes et aguerris parmi les Édomites et les Horites.


    Six cents hommes prirent la fuite ; quatre des fils d’Ésaü s’enfuirent avec eux. Ils laissèrent leur père étendu, mort, à l’endroit où il était tombé, sur la colline située à Adurim. Les fils de Jacob les poursuivirent jusqu’au mont Séir. Mais Jacob ensevelit son frère sur la colline située à Adurim, puis il retourna chez lui, et là, on leur donna à manger.[a] [b]'
