base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/015.yaml
  text: Then Judah said to Jacob his father, saying to him, "Bend your bow, father, and send out your arrows and strike down the enemy and kill the adversary; and may you have strength, for we will not kill your brother, because he is such, and because he is your kinsman we will give him honor." Then Jacob bent his bow and sent forth an arrow and struck Esau his brother on his right breast and killed him. And again he sent an arrow and struck Adoran the Aramean on the left breast and drove him back and killed him. Then the sons of Jacob and their servants went out from the four sides of the tower. And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, on the south side of the tower, and they killed all whom they found before them, and not one of them escaped. And Levi and Dan and Asher went out on the east side of the tower, and fifty men with them, and they killed the warriors of Moab and Ammon. And Reuben and Issachar and Zebulun went out on the north side
    of the tower, and fifty men with them, and they killed the fighters of Philistia. And Simeon and Benjamin and Enoch the son of Reuben went out on the west side of the tower, and fifty men with them, and they killed of Edom and of the Horites four hundred strong and warlike men. And six hundred fled, and four of Esau’s sons fled with them, and they left their father lying slain, as he had fallen on the hill that is in Adurim. And the sons of Jacob pursued after them as far as Mount Seir. But Jacob buried his brother in the hill that is in Adurim, and he returned to his house, and they comforted him there.
translation:
  language: fr
  text: 'Alors Juda dit à Jacob, son père : « Père, tends ton arc, décoche tes flèches, abats l’ennemi et tue l’adversaire. Puisses-tu avoir de la force ! Car nous ne tuerons pas ton frère : il est ton frère et ton parent ; rendons-lui cet honneur. » Jacob tendit alors son arc, décocha une flèche, atteignit son frère Ésaü à la poitrine droite et le tua. Il décocha une seconde flèche, atteignit Adoran l’Araméen à la poitrine gauche, le repoussa et le tua.


    Alors les fils de Jacob et leurs esclaves sortirent des quatre côtés de la tour. Juda sortit le premier avec Nephtali et Gad ; cinquante esclaves les accompagnaient du côté sud de la tour. Ils tuèrent tous ceux qu’ils rencontrèrent devant eux, et pas un seul ne leur échappa. Lévi, Dan et Asher sortirent du côté est de la tour avec cinquante hommes et tuèrent les guerriers de Moab et d’Ammon. Ruben, Issacar et Zabulon sortirent du côté nord de la tour avec cinquante hommes et tuèrent les combattants de Philistie. Siméon, Benjamin et Hénok, fils de Ruben, sortirent du côté ouest de la tour avec cinquante hommes. Ils tuèrent quatre cents hommes robustes et aguerris parmi les Édomites et les Horites.


    Six cents hommes prirent la fuite ; quatre des fils d’Ésaü s’enfuirent avec eux. Ils laissèrent leur père étendu, mort, à l’endroit où il était tombé, sur la colline située à Adurim. Les fils de Jacob les poursuivirent jusqu’au mont Séir. Mais Jacob ensevelit son frère sur la colline située à Adurim, puis il retourna chez lui, et là, ils les nourrirent.[a] [b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible de la dernière proposition : « et là, ils leur donnèrent à manger ». Le texte porte un sujet et un objet au pluriel, mais le référent de l’objet n’est pas clairement exprimé.'
    reason: Ambiguïté grammaticale et référentielle du guèze.
  - marker: b
    text: Dans le corpus de travail, ce passage est placé sous le numéro 38, bien qu’il poursuive la même unité narrative ; il est présenté ici comme Jubilés 37.15.
    reason: Note de segmentation textuelle.
lexical_decisions:
- source_word: አግብርቲሆሙ / አግብርቲ
  choice: leurs esclaves / esclaves
  rationale: Le terme désigne des personnes en condition servile. « Esclaves » conserve explicitement cette réalité sociale, plutôt que de l’atténuer par « serviteurs ».
- source_word: ማኅፈድ
  choice: tour
  rationale: Dans ce récit, le mot désigne l’ouvrage fortifié depuis les quatre côtés duquel les groupes sortent ; « tour » suit le contexte narratif et la tradition textuelle.
- source_word: መስተቃትላነ / መስተባእሳነ
  choice: combattants / guerriers / hommes aguerris
  rationale: Ces termes décrivent des hommes préparés ou aptes au combat. La variation française évite une répétition lourde tout en maintenant la nuance militaire.
- source_word: ወመገብዎሙ
  choice: et là, on leur donna à manger
  rationale: Le verbe signifie fondamentalement nourrir ou donner à manger, avec un objet pluriel dans la forme transmise. Cette traduction suit plus directement le guèze que « ils le consolèrent ».
- source_word: አዱፊም
