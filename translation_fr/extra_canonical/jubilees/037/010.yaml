  yaml_path: translation/extra_canonical/jubilees/037/010.yaml
  text: And there came to them from Moab and from the sons of Ammon one thousand chosen men who were hired; and from Philistia one thousand chosen men fit for war; and from Edom and from the Horites one thousand chosen men trained for battle; and from the Kittim strong men fit for war.
translation:
  language: fr
  text: Des hommes forts, des guerriers d’élite. Puis vinrent auprès d’eux, de Moab et des fils d’Ammon, mille hommes d’élite qui avaient été engagés ; de Philistie, mille hommes d’élite aptes à la guerre ; d’Édom et des Horites, mille hommes d’élite entraînés au combat ; et des Kittim, des hommes forts aptes à la guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያነ
  choice: hommes d’élite
  rationale: Le terme signifie des hommes choisis ou sélectionnés ; « hommes d’élite » exprime naturellement leur sélection dans un contexte militaire.
- source_word: ተዐሰቡ
  choice: avaient été engagés
  rationale: La forme passive renvoie à des hommes recrutés ou loués pour servir, probablement comme mercenaires, sans imposer ce dernier terme au texte.
- source_word: መስተቃትላነ
  choice: aptes à la guerre
  rationale: Rend l’idée de combattants propres ou préparés à faire la guerre, tout en conservant la formulation descriptive répétée dans le verset.
- source_word: መስተባእሳነ
  choice: entraînés au combat
  rationale: Distingue cette désignation militaire de « aptes à la guerre » et traduit l’idée de combattants aguerris ou préparés pour l’affrontement.
- source_word: ዕደወ
  choice: hommes forts
  rationale: Le terme encadre le passage et désigne ici des hommes robustes ou puissants ; « hommes forts » reste sobre et proche de la source.
- source_word: ኬጢዎን
  choice: Kittim
  rationale: Translittération traditionnelle du nom ethnique, préférable à une identification géographique plus étroite et incertaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La structure cumulative de l’énumération et les distinctions entre les diverses qualifications militaires sont conservées sans ajouter d’identification historique ou théologique.
