base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/006.yaml
  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: fr
  text: '« … avec nous, nous te ferons du mal, à toi aussi. Maintenant, écoute-nous : envoyons en Aram, en Philistie, en Moab et en Ammon ; choisissons pour nous des hommes d’élite, ardents au combat, puis marchons contre lui, combattons-le et déracinons-le du pays avant qu’il ne devienne puissant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያነ፡ ሰብአ
  choice: des hommes d’élite
  rationale: L’expression désigne des hommes choisis ou sélectionnés ; « hommes d’élite » rend naturellement leur caractère sélectionné sans répéter le verbe « choisissons ».
- source_word: እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል
  choice: ardents au combat
  rationale: Cette formulation rend l’idée d’hommes disposés à s’engager activement dans la bataille, tout en évitant de leur attribuer une expérience militaire que le texte n’énonce pas.
- source_word: ወንሠርዎ፡ እምድር
  choice: et déracinons-le du pays
  rationale: Le verbe évoque l’action d’arracher à la racine ou d’extirper ; « déraciner » conserve cette image plus précisément que « effacer » ou « éliminer ».
- source_word: እንበለ፡ የአዝዝ
  choice: avant qu’il ne devienne puissant
  rationale: La proposition exprime l’idée d’agir avant que l’adversaire ne gagne en force ou en puissance.
