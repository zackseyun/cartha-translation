  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
translation:
  language: fr
  text: 'Isaac avait donné le droit d’aînesse à Jacob, son fils cadet, et ils entrèrent dans une très grande colère. Ils s’en prirent à leur père en disant : « Pourquoi a-t-il donné le droit d’aînesse à Jacob, qui est plus jeune, alors que c’est toi l’aîné, et t’a-t-il laissé de côté ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: le droit d’aînesse
  rationale: Dans ce contexte successoral, le terme désigne le statut ou les prérogatives de l’aîné; cette expression française est naturelle et précise.
- source_word: ወልዱ፡ ዘይንእስ
  choice: son fils cadet
  rationale: Rend littéralement la relation filiale et le fait que Jacob est le plus jeune des deux frères.
- source_word: ወተምዑ፡ ፈድፋደ
  choice: ils entrèrent dans une très grande colère
  rationale: Conserve l’intensification explicite du guèze dans un français courant et digne.
- source_word: ወተጋአዙ፡ ምስለ፡ አቡሆሙ
  choice: Ils s’en prirent à leur père
  rationale: Exprime l’affrontement verbal avec leur père sans suggérer nécessairement une lutte physique.
- source_word: እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ
  choice: alors que c’est toi l’aîné
  rationale: Respecte la deuxième personne singulière et le contraste explicite entre Ésaü, l’aîné, et Jacob, le plus jeune.
theological_decisions:
- issue: Nature de ce qu’Isaac a accordé à Jacob
  choice: le droit d’aînesse
  alternative: les droits du premier-né
  rationale: « Droit d’aînesse » est l’expression biblique française habituelle et ne précise pas davantage que la source le contenu exact des prérogatives.
- issue: Référents des pronoms dans la parole des fils
  choice: « il » renvoie à Isaac et « toi/te » à Ésaü
  alternative: une adresse à Isaac au pluriel des locuteurs
  rationale: La morphologie de deuxième personne singulière et le contexte narratif soutiennent une parole des fils d’Ésaü adressée à leur père au sujet de l’acte d’Isaac.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « droit d’aînesse » est conservée pour la clarté; la question garde son caractère accusateur sans archaïsme.
