translation:
  language: fr
  text: 'et que nous demeurions dans l’amour et dans la paix, chacun avec son frère, sans corrompre nos voies. » Mais ils lui dirent : « Nous ne t’écouterons pas pour faire la paix avec lui, car notre force est plus grande que la sienne, et nous sommes plus forts que lui. Marche contre lui : tuons-le et exterminons ses fils. Mais si tu ne marches pas…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በተፋቅሮ፡ ወበሰላም
  choice: dans l’amour et dans la paix
  rationale: Rend directement les deux substantifs guèzes tout en conservant leur parallélisme.
- source_word: ወኢናማስን፡ ፍኖዊነ
  choice: sans corrompre nos voies
  rationale: Le verbe exprime l’idée de ruiner ou corrompre, et ፍኖዊነ renvoie à « nos voies » ; la tournure française préserve l’idiome moral biblique.
- source_word: ኃይለ፡ ዚአነ፡ ይጸንዕ፡ እምኃይሉ
  choice: notre force est plus grande que la sienne
  rationale: Conserve la comparaison explicite des forces sans amplifier le texte.
- source_word: ሖውር፡ ላዕሌሁ
  choice: Marche contre lui
  rationale: Rend le mouvement hostile exprimé par le verbe et la préposition, dans un registre narratif digne.
- source_word: ወናሐጕሎ፡ ውሉዱ
  choice: et exterminons ses fils
  rationale: Le verbe est plus fort qu’un simple « détruire » et vise l’anéantissement de sa descendance masculine.
theological_decisions:
- issue: Portée morale de « corrompre nos voies »
  choice: Conserver l’idiome sans préciser la nature exacte de la corruption
  alternative: Expliciter par « mal agir » ou « nous détourner du droit chemin »
  rationale: Le texte source reste général ; l’explicitation imposerait une interprétation morale plus étroite.
- issue: Comparaison de puissance
  choice: Répéter le champ lexical de la force
  alternative: Varier avec « plus puissants »
  rationale: La répétition du source souligne l’argument fondé sur la supériorité physique ou militaire et doit rester perceptible.
