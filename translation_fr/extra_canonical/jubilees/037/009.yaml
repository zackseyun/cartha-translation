  text: and bow your neck under his yoke. We will not listen to this word." And they sent to Aram, and to Aduram, the friend of their father, and they hired with them one thousand warriors for battle.
translation:
  language: fr
  text: « Courbe la nuque sous son joug. Quant à nous, nous n’écouterons pas cette parole. » Puis ils envoyèrent en Aram et auprès d’Aduram, l’ami de leur père, et ils engagèrent avec eux mille guerriers pour le combat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታበውአ፡ ክሳደከ፡ ታሕተ፡ አርዑቱ
  choice: Courbe donc la nuque sous son joug
  rationale: Rend directement l’image de la nuque placée sous le joug; « donc » restitue naturellement la portée discursive de l’impératif dans ce fragment de discours.
- source_word: ኢንሰምዕ፡ ንሕነሰ፡ ዘንተ፡ ነገረ
  choice: Quant à nous, nous n’écouterons pas cette parole
  rationale: La tournure emphatique opposant « nous » à l’interlocuteur est conservée; « parole » garde la valeur large de ነገር sans la réduire à un simple son.
- source_word: ወፈነዉ፡ ውስተ፡ አራም፡ ወኀበ፡ አዱራም
  choice: Puis ils envoyèrent des messagers en Aram et auprès d’Adouram
  rationale: En français, « envoyèrent » appelle ici un complément implicite; « des messagers » explicite sobrement l’objet sous-entendu. La distinction entre la région d’Aram et la personne Adouram est préservée.
- source_word: ዐርከ፡ አቡሆሙ
  choice: l’ami de leur père
  rationale: Traduction formelle et non interprétative du rapport personnel indiqué par le texte.
- source_word: ወተዐሰቡ፡ ምስሌሆሙ፡ ፲፻ መስተባእሳነ
  choice: et ils engagèrent avec eux mille hommes pour le combat
  rationale: « Engagèrent » exprime le recrutement rémunéré; « hommes pour le combat » évite d’ajouter les notions de vétérans ou d’hommes choisis, absentes du texte fourni.
