    rationale: Le texte source enchaîne par « et il ne se souvint pas »; il ne marque pas explicitement une opposition concessive ou adversative. La juxtaposition narrative suffit à laisser percevoir le contraste.
  - severity: low
    issue: Nuance durative ajoutée par « était resté caché »
    rationale: Le guèze décrit le mal comme caché dans son cœur; « resté » suggère une persistance mise en relief qui n’est pas nécessaire au sens source.
  - severity: low
    issue: Rendu imprécis du serment
    rationale: Le texte dit qu’il avait juré/prêté serment à son père et à sa mère. En français, « prêter le serment » rend plus exactement cette action que « faire un serment ».
