base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/013.yaml
  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
translation:
  language: fr
  text: 'Il alla devant eux pour les conduire à Jacob, son frère. Alors il se souvint de tout le mal qui était caché dans son cœur contre Jacob, son frère, et il ne se souvint pas du serment qu’il avait prêté à son père et à sa mère : il ne rechercherait aucun mal contre Jacob tous ses jours.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne rechercherait aucun mal, tous ses jours, contre Jacob » ; l’expression temporelle peut aussi être comprise comme se rapportant à Jacob.'
    reason: L’ordre des mots guèze laisse une légère ambiguïté quant au rattachement précis de l’expression « tous ses jours ».
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ
  choice: Il marcha en tête pour les conduire
  rationale: Rend le mouvement exprimé par ይሖር, la position en avant (ቅድመ) et la fonction de guide de ይምርሖሙ, dans un français naturel.
- source_word: ኵሎ፡ እኩየ
  choice: tout le mal
  rationale: Conserve la portée globale de ኵሎ et le sens moral de እኩየ sans préciser une forme particulière de mal.
- source_word: ሀለወት፡ ውስተ፡ ልቡ፡ ኅብእተ
  choice: qui était resté caché dans son cœur
  rationale: Reproduit l’idée d’un mal présent dans le cœur à l’état caché; « était resté » donne un français fluide sans supprimer cet état durable.
- source_word: ኢይትኃሠሥ፡ ኵሎ፡ እኩየ
  choice: il ne chercherait jamais à faire de mal
  rationale: Le verbe exprime la recherche ou la poursuite; la tournure française explicite idiomatiquement l’intention hostile tout en gardant la négation absolue.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: jamais
  rationale: Rend idiomatiquement « tous ses jours », c’est-à-dire durant toute sa vie.
theological_decisions:
- issue: Nature du mal caché dans le cœur
  choice: tout le mal
  alternative: toute la méchanceté
  rationale: La formulation retenue préserve l’ambiguïté entre intentions mauvaises, hostilité intérieure et actes projetés, sans imposer une interprétation psychologique ou doctrinale.
- issue: Portée temporelle de « tous ses jours »
  choice: il ne chercherait jamais à faire de mal à Jacob
  alternative: il ne chercherait à faire aucun mal contre Jacob durant tous ses jours
  rationale: Le sens naturel rattache la durée à l’engagement du sujet; la note signale la formulation plus littérale et sa possible ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « Jacob, son frère » est conservée dans les deux premières occurrences conformément au texte source, tandis que la dernière occurrence reste simplement « Jacob ». Le contraste entre le souvenir du mal et l’oubli du serment est maintenu explicitement.
