  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
translation:
  language: fr
  text: '« Jacob est le plus jeune ; c’est à Jacob que ton père a donné le droit d’aînesse, et toi, il t’a délaissé. » Ésaü leur répondit[a] : « Car j’ai vendu mon droit d’aînesse à Jacob pour un petit plat de bouillie de lentilles. Et le jour où mon père m’a envoyé chasser et lui rapporter du gibier, afin qu’il mange et me bénisse, Jacob est venu par ruse ; il a apporté à mon père de quoi manger et boire, et mon père l’a béni et m’a placé sous son autorité. Et maintenant, notre père nous a fait jurer, lui et moi, que nous ne chercherions pas à faire le mal l’un contre son frère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Et il leur dit » ; le nom d’Ésaü est explicité d’après le contexte.'
    reason: Le sujet est seulement pronominal dans le texte guèze ; l’explicitation améliore la clarté tout en signalant la forme exacte de la source.
lexical_decisions:
- source_word: ልህቃነ / ቅድመ፡ ልደትየ
  choice: le droit d’aînesse / mon droit d’aînesse
  rationale: Les expressions renvoient respectivement au rang de l’aîné et à la prérogative liée à la première naissance ; « droit d’aînesse » restitue naturellement leur sens dans ce contexte.
- source_word: ኀደገ
  choice: il t’a délaissé
  rationale: Le verbe exprime l’idée de laisser ou d’abandonner ; « délaissé » conserve la force de l’opposition sans suggérer nécessairement un abandon physique.
- source_word: መጽአ፡ በተጠብቦት
  choice: Jacob est venu par ruse
  rationale: La tournure attribue à Jacob une démarche habile ou rusée ; « par ruse » préserve ici l’évaluation négative du locuteur.
- source_word: ታሕተ፡ እዴሁ
  choice: sous son autorité
  rationale: Littéralement « sous sa main » ; l’expression marque la subordination. La formulation française en explicite le sens relationnel sans en tirer une doctrine supplémentaire.
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: ne chercherait à faire du mal
  rationale: La formulation source associe la recherche ou l’intention à ce qui est mauvais ; cette traduction française en garde la dimension volontaire.
theological_decisions:
- issue: Nature de la prééminence accordée à Jacob
  choice: droit d’aînesse
  alternative: prééminence / rang d’aîné
  rationale: Le contexte immédiat relie explicitement la prééminence à la vente par Ésaü de ce qui lui revenait en raison de sa première naissance. « Droit d’aînesse » est précis sans confondre cette scène avec la seule bénédiction.
- issue: Sens de la mise d’Ésaü « sous la main » de Jacob
  choice: m’a placé sous son autorité
  alternative: m’a placé sous sa main
  rationale: L’expression indique une relation de subordination. Le rendu idiomatique évite une image obscure en français tout en conservant la tension du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent accessibles, tandis que « droit d’aînesse », « gibier » et « sous son autorité » conservent la précision historique et relationnelle du passage. Le connecteur « Car » rend explicitement እስመ et rattache la réponse d’Ésaü à l’accusation précédente.
