  text: 'Et leur père leur dit : « N’allez pas et ne lui faites pas la guerre, de peur que vous ne tombiez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትሖሩ
  choice: N’y allez pas
  rationale: L’impératif négatif pluriel signifie « n’allez pas ». Le pronom adverbial « y » rend en français naturel le déplacement vers le lieu ou l’affrontement évoqué par le contexte.
- source_word: ኢትግበሩ፡ ምስሌሁ፡ ፀብአ
  choice: ne lui faites pas la guerre
  rationale: L’expression associe « faire », « avec lui » et « guerre/hostilité » ; cette formulation française en restitue clairement le sens sans ajouter de précision.
- source_word: ከመ፡ ኢትደቁ
  choice: de peur que vous ne tombiez
  rationale: La proposition exprime le résultat redouté. « Tomber » conserve l’image et l’ambiguïté du texte quant à une chute, une défaite ou la mort.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La coordination répétée est conservée, ainsi que l’ambiguïté finale de « tomber ». Aucun complément tel que « devant lui » n’est ajouté, puisqu’il n’est pas explicitement représenté dans le texte guèze fourni.
