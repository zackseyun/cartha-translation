  text: 'Throughout all this[14], Jacob did not know that they were coming against him to kill him. And he was mourning for Leah his wife until they came near to the tower with four thousand men, warriors and chosen fighters. And they sent to him honorable men, saying, "Behold, your brother has come against you to fight you, with four hundred men girded with the sword, and they carry shields and weapons of war." For they loved Jacob more than Esau, and they told him that Jacob was a gracious and merciful man, more than Esau. Then Jacob was alarmed when they came near to the tower, and he shut the gates of the tower and stood on the battlements and spoke with his brother Esau and said, "The comfort for which you have come is a fine comfort, to comfort me concerning my wife who has died. Is this the oath that you swore to your father and your mother? Again, before they have died, you have broken the oath, and at the moment you swore to your father you were condemned." And at that time Esau
    answered and said to him, "There is no righteous oath for the sons of men, nor for the beasts of the earth; for whatever they swear, they scheme one against another with evil[14], so that each may kill his enemy and foe. And you hate me and my children forever, and there is no observing brotherhood with you. Hear this word that I declare to you: if the boar can change its skin and its bristles become soft like wool, or if horns grow on its head like the horns of a stag or a sheep, then I will keep brotherhood with you. And if the breasts separated from their mother should return and suckle again, then I will be reconciled to you as a brother. And if wolves make peace with lambs so as not to devour or oppress them, and if their hearts are good toward them, then there will be peace in my heart toward you. And if the lion becomes the friend of the ox and is bound together with it under one yoke and plows with it and makes peace with it, then I will make peace with you. And when the raven
    becomes white like the raza-bird, then I will know that I have loved you and will make peace with you. Be destroyed, and may your sons be destroyed, and let there be no peace for you." And when Jacob saw that he was evil in his heart toward him, and with all his soul intended to kill him, and that he came raging like a wild boar rushing upon the spear that pierces and kills it and does not turn back from it, then he said to his own and to his servants that they should attack him and all his companions.'
translation:
  language: fr
  text: 'Pendant tout ce temps, Jacob ne savait pas qu’ils venaient contre lui pour le tuer. Il pleurait encore sa femme Léa lorsqu’ils s’approchèrent de la tour avec quatre mille hommes, des guerriers et des combattants d’élite.[a] Ils lui envoyèrent des hommes de haut rang pour lui dire : « Voici que ton frère est venu contre toi pour te combattre, avec quatre cents hommes portant l’épée à la ceinture, ainsi que des boucliers et des armes de guerre. » En effet, ils aimaient Jacob plus qu’Ésaü et avaient déclaré que Jacob était un homme bienveillant et compatissant, plus qu’Ésaü.


    Jacob fut alors saisi d’inquiétude quand ils s’approchèrent de la tour. Il en ferma les portes, se tint sur les remparts et parla à son frère Ésaü. Il lui dit : « Il est beau, le réconfort que tu es venu m’apporter au sujet de ma femme qui est morte ! Est-ce donc là le serment que tu as prêté à ton père et à ta mère ? Une fois encore, avant même qu’ils ne meurent, tu as violé ton serment ; dès l’instant où tu l’as prêté à ton père, tu étais condamné. »


    Ésaü lui répondit alors : « Il n’existe aucun serment juste, ni chez les êtres humains ni chez les animaux de la terre. Quoi qu’ils jurent, ils complotent méchamment les uns contre les autres, afin que chacun puisse tuer son ennemi et son adversaire. Toi, tu me hais, moi et mes enfants, pour toujours, et il n’est pas possible de maintenir des liens fraternels avec toi. Écoute donc ce que je te déclare : si le sanglier peut changer de peau, si ses soies deviennent aussi douces que la laine, ou si des cornes poussent sur sa tête comme celles d’un cerf ou d’un mouton, alors je maintiendrai des liens fraternels avec toi. Si les mamelles séparées de leur mère retournent auprès d’elle pour téter de nouveau,[b] alors je me réconcilierai avec toi comme avec un frère. Si les loups font la paix avec les agneaux, sans les dévorer ni les maltraiter, et si leur cœur leur veut du bien, alors mon cœur sera en paix avec toi. Si le lion devient l’ami du bœuf, s’attelle avec lui sous un même joug, laboure
    avec lui et fait la paix avec lui, alors je ferai la paix avec toi. Si le corbeau devient blanc comme l’oiseau raza,[c] alors je saurai que je t’aime et je ferai la paix avec toi. Sois anéanti, et que tes fils soient anéantis ! Qu’il n’y ait aucune paix pour toi ! »


    Quand Jacob vit qu’Ésaü avait le cœur mauvais envers lui, qu’il voulait de toute son âme le tuer et qu’il arrivait en fureur, semblable à un sanglier qui fonce sur la lance qui le transperce et le tue sans reculer devant elle, il dit aux siens et à ses serviteurs de l’attaquer, lui et tous ses compagnons.'
