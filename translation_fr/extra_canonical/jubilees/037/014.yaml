  to: 'Pendant tout ce temps, Jacob ne savait pas qu’ils venaient contre lui pour le tuer. Il pleurait encore sa femme Léa lorsqu’ils s’approchèrent de la tour avec quatre mille hommes, des guerriers et des combattants d’élite.[a] Ils lui envoyèrent des hommes de haut rang pour lui dire : « Voici que ton frère est venu contre toi pour te combattre, avec quatre cents hommes portant l’épée à la ceinture, ainsi que des boucliers et des armes de guerre. » En effet, ils aimaient Jacob plus qu’Ésaü et avaient déclaré que Jacob était un homme bienveillant et compatissant, plus qu’Ésaü.


    Jacob fut alors saisi d’inquiétude quand ils s’approchèrent de la tour. Il en ferma les portes, se tint sur les remparts et parla à son frère Ésaü. Il lui dit : « Il est beau, le réconfort que tu es venu m’apporter au sujet de ma femme qui est morte ! Est-ce donc là le serment que tu as prêté à ton père et à ta mère ? Une fois encore, avant même qu’ils ne meurent, tu as violé ton serment ; dès l’instant où tu l’as prêté à ton père, tu étais condamné. »


    Ésaü lui répondit alors : « Il n’existe aucun serment juste, ni chez les êtres humains ni chez les animaux de la terre. Quoi qu’ils jurent, ils complotent méchamment les uns contre les autres, afin que chacun puisse tuer son ennemi et son adversaire. Toi, tu me hais, moi et mes enfants, pour toujours, et il n’est pas possible de maintenir des liens fraternels avec toi. Écoute donc ce que je te déclare : si le sanglier peut changer de peau, si ses soies deviennent aussi douces que la laine, ou si des cornes poussent sur sa tête comme celles d’un cerf ou d’un mouton, alors je maintiendrai des liens fraternels avec toi. Si les mamelles séparées de leur mère retournent auprès d’elle pour téter de nouveau,[b] alors je me réconcilierai avec toi comme avec un frère. Si les loups font la paix avec les agneaux, sans les dévorer ni les maltraiter, et si leur cœur leur veut du bien, alors mon cœur sera en paix avec toi. Si le lion devient l’ami du bœuf, s’attelle avec lui sous un même joug, laboure
    avec lui et fait la paix avec lui, alors je ferai la paix avec toi. Si le corbeau devient blanc comme l’oiseau raza,[c] alors je saurai que je t’aime et je ferai la paix avec toi. Sois anéanti, et que tes fils soient anéantis ! Qu’il n’y ait aucune paix pour toi ! »


    Quand Jacob vit qu’Ésaü avait le cœur mauvais envers lui, qu’il voulait de toute son âme le tuer et qu’il arrivait en fureur, semblable à un sanglier qui fonce sur la lance qui le transperce et le tue sans reculer devant elle, il dit aux siens et à ses serviteurs de l’attaquer, lui et tous ses compagnons.'
