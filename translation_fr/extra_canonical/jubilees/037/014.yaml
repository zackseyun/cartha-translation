  footnotes:
  - marker: a
    text: Le texte guèze indique ici « quatre mille » hommes, mais les messagers parlent ensuite de « quatre cents » hommes. Cette divergence interne est conservée.
    reason: textual_variant
  - marker: b
    text: La formulation du texte guèze est obscure et paraît dire littéralement que des « mamelles séparées de leur mère » reviennent téter. Certains comprendront plutôt une allusion à des petits séparés du sein maternel.
    reason: source_ambiguity
  - marker: c
    text: « Raza » transcrit un nom d’oiseau guèze dont l’identification exacte est incertaine ; le contexte évoque un oiseau remarquablement blanc.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፵፻ ብእሲ
  choice: quatre mille hommes
  rationale: La notation guèze signifie littéralement « quarante centaines », soit 4 000; elle ne doit pas être harmonisée avec les 400 hommes signalés ensuite par les messagers.
- source_word: መስተቃላን፡ ወመስተበአላን፡ ኀሩያን
  choice: des guerriers et des combattants d’élite
  rationale: Rend la double désignation militaire et la notion de sélection sans lourdeur excessive.
- source_word: ጸጋዊ፡ ወመሓሪ
  choice: bienveillant et compatissant
  rationale: Conserve les deux qualités attribuées à Jacob dans un français naturel et digne.
- source_word: ራዛ
  choice: oiseau raza
  rationale: Le nom zoologique est incertain; la translittération évite une identification conjecturale.
- source_word: ተአኃ
  choice: maintenir des liens fraternels / se réconcilier comme avec un frère
  rationale: Le contexte oppose l’hostilité au maintien effectif de la fraternité; les formulations françaises varient légèrement selon la syntaxe sans imposer une doctrine particulière.
theological_decisions:
- issue: La portée de l’affirmation d’Ésaü sur les serments
  choice: 'Présenter ses paroles comme sa propre déclaration : « Il n’existe de serment juste… »'
  alternative: Transformer la phrase en principe moral objectif ou en condamnation explicite du parjure
  rationale: Le passage rapporte la justification cynique d’Ésaü; la traduction préserve cette tension sans l’approuver ni l’expliquer théologiquement.
- issue: La condamnation liée au serment
  choice: « dès l’instant où tu l’as prêté à ton père, tu étais condamné »
  alternative: « ton père t’a condamné »
  rationale: Le texte exprime la condamnation sans identifier clairement celui qui la prononce; la formulation passive conserve cette indétermination.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions rhétoriques d’Ésaü et les images animales sont conservées. Les formes « Jacob », « Ésaü » et « Léa » suivent l’usage biblique français courant. Les guillemets français et des paragraphes distincts facilitent la lecture d’un verset exceptionnellement long.
