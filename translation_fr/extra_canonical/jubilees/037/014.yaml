  naturalness: Le français est soutenu, moderne et lisible. La construction « Il n’existe de serment juste ni… » est toutefois mal formée en français contemporain ; « Il n’existe aucun serment juste… » rend le sens avec naturel. Quelques ajustements mineurs améliorent aussi l’enchaînement des propositions conditionnelles.
  terminology: Les noms bibliques Jacob, Léa et Ésaü sont appropriés. « Bienveillant et compatissant », « combattants d’élite », « liens fraternels » et « oiseau raza » sont des choix recevables. La translittération de raza, accompagnée d’une note, évite à juste titre toute identification zoologique conjecturale.
  issues:
