    issue: Référent français incohérent dans « ces hommes aimaient Jacob… et ils lui avaient dit que Jacob était… »
    rationale: Tel quel, « lui » renvoie naturellement à Jacob, ce qui produit une auto-description absurde. Le guèze présente un pronom dont le référent n’est pas suffisamment assuré pour être résolu sans risque. Une formulation sans complément indirect conserve l’information attestée sans imposer de référent.
  - severity: low
    issue: Négation mal construite dans « Il n’existe de serment juste ni… »
    rationale: La tournure n’est pas idiomatique en français moderne. « Il n’existe aucun serment juste, ni chez… ni chez… » restitue la généralité de l’affirmation d’Ésaü.
