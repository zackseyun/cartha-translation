lexical_decisions:
- source_word: ዘርአ
  choice: descendance / semence
  rationale: Le même terme désigne d’abord la postérité attendue, puis la semence répandue; la variation française rend les deux sens imposés par le contexte.
- source_word: ወቦአ፡ ቤተ፡ ብእሲተ፡ እኁሁ
  choice: Lorsqu’il s’unit à la femme de son frère
  rationale: L’expression littérale « entra chez/vers la femme de son frère » est un euphémisme sexuel; « s’unit à » en restitue naturellement le sens sans crudité.
- source_word: ወከዐወ
  choice: il répandit
  rationale: Rend directement l’action de verser ou répandre, sans ajouter une interprétation médicale ou morale.
- source_word: እኩየ
  choice: mal
  rationale: Conserve la qualification morale simple du texte source.
theological_decisions:
- issue: À qui appartient juridiquement la descendance attendue
  choice: « ne serait pas à lui, mais à son frère »
  alternative: « ne serait pas la sienne, mais celle de son frère »
  rationale: La formulation retenue préserve l’opposition explicite du texte sans développer la coutume du lévirat ni préciser davantage la filiation.
- issue: Objet exact de la condamnation
  choice: Ne pas le préciser
  alternative: Identifier explicitement un acte sexuel particulier comme objet exclusif de la condamnation
  rationale: Le fragment source s’interrompt avant de compléter « aux yeux de » et ne formule ici aucune analyse théologique détaillée; la traduction évite donc d’en ajouter une.
