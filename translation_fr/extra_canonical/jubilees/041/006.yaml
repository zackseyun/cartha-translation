- issue: Agent de la mort
  choice: Dieu demeure explicitement le sujet de « il le fit mourir »
  alternative: Employer une tournure passive ou impersonnelle
  rationale: Le guèze attribue directement l’action au Seigneur; une tournure passive atténuerait cette affirmation théologique.
- issue: Complément absent après እንዘ
  choice: Conserver la phrase inachevée
  alternative: Restituer la suite connue du récit concernant le veuvage de Tamar et la croissance de Shéla
  rationale: La source fournie s’arrête à la conjonction; compléter la phrase dépasserait les données textuelles soumises.
