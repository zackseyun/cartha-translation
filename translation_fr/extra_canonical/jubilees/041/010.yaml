  text: And she sat at the entrance that is on the road to Timnah. And as Judah was going, he found her.
translation:
  language: fr
  text: Elle s’assit[a] à l’entrée située sur la route de Timna. Tandis que Juda avançait, il la trouva[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « resta ».
    reason: Le verbe peut exprimer le fait de demeurer à un endroit, bien que le contexte favorise ici l’idée de s’asseoir.
  - marker: b
    text: Ou « la rencontra ».
    reason: Le verbe peut désigner le fait de trouver quelqu’un ou de tomber sur cette personne.
lexical_decisions:
- source_word: ወነበረት (wa-nabarat)
  choice: Elle s’assit
  rationale: Dans ce contexte narratif, le verbe désigne le fait de prendre place à l’entrée; « s’assit » est plus précis que le simple « resta », tout en signalant cette possibilité en note.
- source_word: አንቀጽ (ʾanqäṣ)
  choice: entrée
  rationale: Le nom désigne ici une entrée ou un accès situé le long de la route.
- source_word: የሐውር (yəḥawər)
  choice: avançait
  rationale: Cette forme exprime Juda en train d’aller ou de poursuivre son chemin; « avançait » rend naturellement l’action en cours sans préciser davantage le mode de déplacement.
- source_word: ረከባ (rakaba)
  choice: la trouva
  rationale: Le verbe signifie principalement « trouver » ou « tomber sur »; « la trouva » conserve son sens lexical direct, avec « la rencontra » en note comme possibilité contextuelle.
- source_word: ቴምናታ (Temnata)
  choice: Timna
  rationale: Emploi de la forme française courante du toponyme biblique; la construction source indique la route menant à Timna.
