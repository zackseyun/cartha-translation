  yaml_path: translation/extra_canonical/jubilees/041/007.yaml
  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
translation:
  language: fr
  text: « Reste veuve jusqu’à ce que mon fils Shéla ait grandi, et je te donnerai à mon fils pour femme. » Il grandit, mais Bedsouël, femme de Juda, ne permit pas à son fils Shéla de l’épouser, et Beds[ouël] mourut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte guèze conservé s’interrompt au milieu du nom « Bedsouël » à la fin du verset.
    reason: Signaler la lacune matérielle et expliquer la restitution entre crochets.
lexical_decisions:
- source_word: ትመዐስቢ
  choice: Reste veuve
  rationale: Le verbe exprime ici le fait de demeurer dans l’état de veuve, et non simplement d’attendre.
- source_word: ይልህቅ / ወልህቀ
  choice: ait grandi / Il grandit
  rationale: La répétition de la racine « grandir » est conservée, d’abord dans la parole rapportée, puis dans l’accomplissement narratif.
- source_word: ወእሁበኪ፡ ሎቱ፡ ብእሲተ
  choice: je te donnerai à lui pour femme
  rationale: Formulation française naturelle qui maintient le sens littéral du don de Tamar comme épouse à Shéla.
- source_word: ወኢኀደገት
  choice: ne permit pas
  rationale: Dans cette construction, le verbe signifie que Bedsouël n’a pas laissé ou permis à son fils d’accomplir le mariage.
- source_word: ቤድ
  choice: Beds[ouël]
  rationale: Le texte transmis s’interrompt après le début du nom; les crochets signalent honnêtement la restitution probable de Bedsouël.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct est distingué du récit. La répétition « ait grandi / Il grandit » et la tension entre la promesse de Juda et l’empêchement attribué à Bedsouël sont préservées.
