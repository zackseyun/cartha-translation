  text: And Judah said to Onan, his brother,, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up offspring for your brother.”
translation:
  language: fr
  text: 'Juda dit à Onan, frère d’Er : « Va vers la femme de ton frère, accomplis envers elle ton devoir de beau-frère et suscite une descendance pour ton frère. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባእ፡ ኀበ፡ ብእሲተ፡ እኁከ፡
  choice: Va vers la femme de ton frère
  rationale: Rend directement l’expression « entrer/aller vers la femme de ton frère » dans une formulation française naturelle, tout en conservant son euphémisme sexuel.
- source_word: ወረከያ፡ ናዕልተ፡
  choice: remplis envers elle ton devoir de beau-frère
  rationale: L’expression renvoie au devoir léviratique du frère du défunt; cette formulation est compréhensible sans introduire le terme technique « lévirat » dans le texte.
- source_word: ወአንሥእ፡
  choice: et suscite une descendance à ton frère
  rationale: Le verbe exprime l’idée de faire surgir ou relever; « susciter une descendance » restitue l’objet implicite éclairé par le contexte et la tradition textuelle parallèle.
theological_decisions:
- issue: Nature du devoir demandé à Onan
  choice: devoir de beau-frère
  alternative: épouse-la selon la loi du lévirat
  rationale: Le texte parle du devoir fraternel sans dire explicitement ici qu’Onan doit l’épouser; la traduction préserve cette formulation et évite d’ajouter une précision juridique.
- issue: Objet implicite du dernier verbe
  choice: une descendance
  alternative: une postérité / une semence
  rationale: Le contexte exige ce complément en français. « Descendance » reste neutre, digne et fidèle à l’enjeu de perpétuer la lignée du frère décédé.
translation_notes:
  register: 'Français moderne, international et digne. La formulation évite l’ambiguïté de l’anglais autour de « his brother » : dans le guèze, Onan est interpellé pour aller vers « la femme de ton frère ». Le possessif renvoie donc clairement au frère d’Onan.'
