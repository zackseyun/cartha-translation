  text: And Judah his father forbade him. And Er, Judah’s firstborn, was evil, and the LORD put him to death.
translation:
  language: fr
  text: Et son père, Juda, le lui interdit.[a] Er, le premier-né de Juda, était mauvais, et le Seigneur le tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’en empêcha » ou « le retint ».'
    reason: Le verbe guèze couvre les nuances d’empêcher, de retenir et d’interdire ; l’objet précis est fourni par le contexte précédent plutôt que par ce verset.
lexical_decisions:
- source_word: ወአሕበሶ
  choice: Et … le lui interdit
  rationale: Le verbe causatif dérivé de ሐበሰ exprime ici l’idée d’empêcher, de retenir ou d’interdire. « Le lui interdit » rend naturellement l’acte de Juda envers son fils tout en laissant l’objet de l’interdiction dépendre du contexte.
- source_word: እኩይ
  choice: mauvais
  rationale: Équivalent direct et non interprétatif du qualificatif moral appliqué à Er.
- source_word: ወቀተሎ
  choice: et … le fit mourir
  rationale: Le verbe signifie littéralement « le tua ». Avec Dieu pour sujet, « le fit mourir » est une formulation française naturelle qui conserve l’idée d’une action divine directe sans ajouter de modalité.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Titre divin traditionnel en français, adapté au registre biblique et à l’usage du texte guèze.
theological_decisions:
- issue: Nature de l’intervention divine dans la mort d’Er
  choice: le Seigneur le fit mourir
  alternative: le Seigneur le tua
  rationale: La formulation retenue exprime clairement que la mort résulte de l’action divine, tout en évitant en français une tournure inutilement brutale. Elle n’ajoute ni cause secondaire ni explication théologique.
translation_notes:
  register: Français moderne, clair et digne. La répétition explicite de « Juda » dans la seconde phrase est conservée conformément au texte source. Le pronom « lui » dans « le lui interdit » renvoie à Er, tandis que l’objet de l’interdiction reste implicite comme en guèze.
