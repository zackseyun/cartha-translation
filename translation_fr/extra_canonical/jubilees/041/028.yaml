  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
translation:
  language: fr
  text: Car il alla dans l’innocence de ses yeux[a] et demanda justice, parce que, selon le jugement d’Abraham qu’il avait prescrit à ses fils, Juda voulait qu’elle soit brûlée au feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la simplicité de ses yeux » ou « avec des yeux droits ».
    reason: Le terme guèze peut évoquer l’innocence, la simplicité ou la droiture; l’expression avec « yeux » admet plusieurs rendus français.
  - marker: b
    text: 'Littéralement : « qu’elle soit brûlée par le feu ».'
    reason: Signale la formulation plus littérale de la source tout en gardant dans le texte principal un français naturel.
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  choice: dans l’innocence de son regard
  rationale: የውሀት exprime l’innocence, la simplicité ou la droiture. « Regard » rend naturellement l’idiome formé avec « ses yeux » sans introduire l’idée erronée de désir.
- source_word: ኀሠሠ፡ ኵነኔ
  choice: demanda justice
  rationale: Le verbe exprime la recherche ou la demande, et ኵነኔ désigne ici un jugement au sens judiciaire; « demander justice » est naturel en français.
- source_word: እምፍተሐ፡ አብርሃም
  choice: selon le jugement d’Abraham
  rationale: Bien que እም signifie littéralement « de/depuis », le contexte indique que le jugement d’Abraham constitue la norme ou le fondement de la décision.
- source_word: ይውዐይ፡ በእሳት
  choice: soit brûlée au feu
  rationale: Rend directement la peine exprimée par le passif et conserve la formulation solennelle de la source.
theological_decisions:
- issue: Caractérisation morale de Juda
  choice: innocence
  alternative: simplicité / droiture
  rationale: La source présente son regard comme innocent ou sans duplicité; elle ne parle pas du désir de ses yeux. La traduction conserve cette justification narrative sans l’amplifier.
- issue: Autorité du jugement d’Abraham
  choice: selon le jugement d’Abraham
  alternative: d’après le jugement d’Abraham / en vertu du jugement d’Abraham
  rationale: Cette formulation laisse au « jugement » son sens de règle ou décision transmise aux fils, sans préciser davantage son statut théologique ou juridique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le lien causal complexe du guèze. « Elle » renvoie à Tamar dans le contexte immédiat; le pronom de la source est maintenu sans explicitation.
