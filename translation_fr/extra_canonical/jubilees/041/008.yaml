  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
translation:
  language: fr
  text: 'La cinquième année de cette semaine, Shua, la femme de Juda, mourut. La sixième année, Juda monta à Timna pour tondre ses moutons. On informa Tamar en ces termes : « Voici que ton beau-père monte à Timna pour la tonte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘዝሱባዔ
  choice: de cette semaine
  rationale: Le démonstratif ዘ renvoie ici à la semaine en cours ; le texte ne dit pas « de la septième semaine ».
- source_word: ዐርገ
  choice: monta
  rationale: Rend directement le verbe de mouvement ascendant, tout en restant idiomatique dans ce récit.
- source_word: ይቅርጽ አባግዒሁ
  choice: pour tondre ses moutons
  rationale: Le premier emploi précise explicitement les moutons de Juda et se traduit naturellement par une proposition finale.
- source_word: ይዐርግ ይቅርጽ
  choice: monte à Timna pour la tonte
  rationale: Le second emploi ne répète pas « ses moutons » ; « pour la tonte » conserve cette concision tout en exprimant clairement l'activité impliquée.
- source_word: ሐሙኪ
  choice: ton beau-père
  rationale: Dans ce contexte familial, le terme désigne Juda par rapport à Tamar.
