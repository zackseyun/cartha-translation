  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: fr
  text: Il prit pour Er, son premier-né, une femme parmi les filles d’Aram, et elle s’appelait Tamar. Mais Er la prit en aversion et ne coucha pas avec elle, car sa mère était une des filles de Canaan, et il voulait prendre pour lui une femme de la parenté de sa mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሩ
  choice: son premier-né
  rationale: Rend directement le statut d’Er par rapport au sujet implicite, Juda.
- source_word: እምነ፡ አዋልደ፡ አራም
  choice: parmi les filles d’Aram
  rationale: Conserve l’expression généalogique et collective du guèze sans la réduire à une appartenance géographique moderne.
- source_word: ወጸልአ
  choice: Mais Er la prit en aversion
  rationale: Le verbe exprime une hostilité ou une répulsion forte; cette formulation garde cette intensité tout en restant naturelle en français.
- source_word: ወኢሰከበ፡ ምስሌሃ
  choice: et ne coucha pas avec elle
  rationale: Traduction directe et idiomatique de l’expression désignant les relations sexuelles.
- source_word: እምነገደ፡ እሙ
  choice: de la parenté de sa mère
  rationale: « Parenté » rend ici le groupe familial ou clanique sans imposer une précision absente du texte.
theological_decisions:
- issue: Référent du sujet après la présentation de Tamar
  choice: Nommer Er dans « Er la prit en aversion »
  alternative: Employer seulement « il »
  rationale: Le sujet grammatical implicite change vraisemblablement de Juda à Er; expliciter son nom évite une ambiguïté accidentelle en français sans ajouter de contenu interprétatif substantiel.
- issue: Lien causal avec l’origine cananéenne de la mère d’Er
  choice: Conserver simplement « car »
  alternative: Expliciter davantage le motif ou porter un jugement moral
  rationale: Le texte établit le lien causal sans l’expliquer ni l’évaluer; la traduction préserve cette tension narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du texte source, tandis que les changements implicites de sujet sont clarifiés seulement lorsque le français l’exige.
