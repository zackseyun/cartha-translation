  text: And he thought her to be a prostitute and said to her, “Let me come in to you,” and she said to him, “Come,” and he went in. And she said to him,
translation:
  language: fr
  text: 'Il la prit pour une prostituée et lui dit : « Laisse-moi venir à toi[a]. » Elle lui répondit : « Viens. » Il vint à elle. Puis elle lui dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Laisse-moi venir à toi. » Dans ce contexte, cette expression est un euphémisme pour une relation sexuelle.'
    reason: La tournure de mouvement est idiomatique et désigne ici, comme la suite du récit, une relation sexuelle.
lexical_decisions:
- source_word: ተሐዘባ (taḥazaba)
  choice: la prit pour
  rationale: Le verbe exprime ici une supposition ou une opinion, non une reconnaissance juste de son identité.
- source_word: ዘማዊት (zamāwit)
  choice: une prostituée
  rationale: Équivalent français direct et courant du nom féminin dans ce contexte.
- source_word: እባእ ኀቤኪ (ʾǝbāʾ ḫabēki)
  choice: Laisse-moi aller vers toi
  rationale: La formulation conserve la première personne du verbe et la tournure directionnelle du guèze, sans la transformer en impératif adressé à la femme.
- source_word: ባእ (bāʾ)
  choice: Viens
  rationale: Impératif bref et naturel en français, correspondant à la réponse de la femme.
- source_word: ወቦአ (wabaʾa)
  choice: Il alla vers elle
  rationale: Rend le mouvement vers la femme tout en laissant au contexte la portée sexuelle de l’expression.
