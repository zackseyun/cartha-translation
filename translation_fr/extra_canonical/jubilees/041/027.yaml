  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
translation:
  language: fr
  text: Par là, il détournera d’Israël la colère et le châtiment. Et nous avons dit à Juda que ses deux fils n’avaient pas couché avec elle. C’est pourquoi sa descendance fut établie pour une autre tribu et ne fut pas déracinée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበእሊአሁ
  choice: Par cela
  rationale: Rend la valeur instrumentale ou causale de l’expression d’ouverture sans préciser davantage un référent que le texte laisse contextuel.
- source_word: ያነድግ
  choice: il détournera
  rationale: Le verbe exprime ici l’éloignement ou le détournement de la colère et du châtiment.
- source_word: መዐተ፡ መመቅሠፍተ
  choice: la colère et le châtiment
  rationale: Conserve les deux termes coordonnés et leur distinction sémantique.
- source_word: ነገሮሙ
  choice: nous avons dit
  rationale: Préserve la première personne du pluriel portée par la forme verbale et le cadre narratif de la dictée angélique, plutôt que de la transformer en passif impersonnel.
- source_word: ኢበከቡ፡ ምስሌነ
  choice: n’avaient pas couché avec elle
  rationale: Formulation française naturelle de l’euphémisme sexuel du texte, avec le plus-que-parfait adapté à l’antériorité.
- source_word: ቆመ፡ ዘርአ
  choice: sa descendance fut établie
  rationale: Reproduit l’image de la semence ou lignée rendue stable, dans un français digne et compréhensible.
- source_word: ወኢይሤረወ
  choice: et ne fut pas déracinée
  rationale: Maintient la métaphore végétale finale et son parallélisme avec l’établissement de la descendance.
theological_decisions:
- issue: Identité du locuteur dans « nous avons dit »
  choice: Maintien de la première personne du pluriel
  alternative: « il fut dit » ou « on dit »
  rationale: La forme source et le cadre littéraire des Jubilés soutiennent un locuteur pluriel; l’impersonnel effacerait un trait narratif réel.
- issue: Rapport entre la descendance de Juda et « une autre tribu »
  choice: « pour une autre tribu » sans explicitation
  alternative: Identifier ou expliquer la tribu concernée
  rationale: Le verset conserve une formulation énigmatique; la traduction ne doit pas résoudre cette tension par une interprétation ajoutée.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la source tout en évitant les tournures archaïques; la métaphore de la descendance établie puis non déracinée est conservée.
