  to: 'Et toi, Moïse, ordonne aux fils d’Israël d’observer la prescription de la Pâque, comme il t’a été commandé. Donne-leur ces instructions, année après année et jour après jour, au sujet de la fête des Pains sans levain : qu’ils mangent des pains sans levain pendant sept jours, qu’ils célèbrent cette fête et qu’ils présentent l’offrande chaque jour durant ces sept jours de réjouissance.'
