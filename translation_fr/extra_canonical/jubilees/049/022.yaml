  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
translation:
  language: fr
  text: 'Et toi, Moïse, ordonne aux fils d’Israël d’observer la prescription de la Pâque, comme il t’a été commandé. Donne-leur ces instructions, année après année et jour après jour, au sujet de la fête des Pains sans levain : qu’ils mangent des pains sans levain pendant sept jours, qu’ils célèbrent cette fête et qu’ils présentent l’offrande chaque jour durant ces sept jours de réjouissance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  choice: la prescription de la Pâque
  rationale: « Prescription » rend le sens d’ordonnance ou de règle cultuelle de ሥርዐት, tandis que « Pâque » est le terme français établi pour ጳስካ.
- source_word: ዓመተ፡ በለዓመት፡ ወዕለተ፡ ለዕለታት
  choice: année après année et jour après jour
  rationale: Cette formulation conserve la répétition temporelle du guèze tout en restant idiomatique en français.
- source_word: በዓለ፡ ፍአት
  choice: la fête des Pains sans levain
  rationale: La locution désigne la fête des Azymes; la formulation développée est plus immédiatement compréhensible en français moderne.
- source_word: ቍርባኖ
  choice: l’offrande prescrite
  rationale: Le nom désigne une offrande ou oblation cultuelle. « Prescrite » explicite sobrement que l’offrande est celle qui appartient à cette célébration, sans en préciser indûment la nature.
- source_word: ፍሥሓ
  choice: réjouissance
  rationale: Le terme signifie joie, allégresse ou réjouissance, et non « fête »; ce choix préserve la distinction avec በዓል.
theological_decisions:
- issue: Force normative de l’ordre relatif à la Pâque
  choice: « ordonne » et « prescription »
  alternative: « recommande » et « coutume »
  rationale: Le texte emploie le vocabulaire du commandement et de l’ordonnance cultuelle; une formulation plus faible atténuerait sa portée.
- issue: Identification de l’offrande
  choice: Ne pas préciser le type de sacrifice
  alternative: « sacrifice » ou « holocauste »
  rationale: Le terme source est général et ne permet pas de déterminer ici une catégorie sacrificielle plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. « Fils d’Israël » conserve la désignation collective traditionnelle du texte. La proposition initiale du témoin fourni (« son nom en lui… ») a été tenue pour la fin du verset précédent conformément à la délimitation de JUB.49.22 et au découpage de consultation.
