  text: at its appointed time, in every respect according to its command. And it shall not be lawful to eat it outside the sanctuary of the LORD, but before the sanctuary of the LORD, and all the people of the assembly
translation:
  language: fr
  text: au temps fixé, en tout point selon son commandement. Il ne sera pas permis de le manger hors du sanctuaire du SEIGNEUR, mais devant le sanctuaire du SEIGNEUR. Et tout le peuple de l’assemblée
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጊዜሁ
  choice: au temps fixé
  rationale: Rend l’idée du temps propre ou assigné à la célébration dans ce contexte.
- source_word: በኵሉ፡ በከመ፡ ትእዛዙ
  choice: en tout point selon son commandement
  rationale: Conserve l’étendue de « en tout » et la conformité prescrite par le commandement.
- source_word: ወኢይከውን፡ ለበሊያቶ
  choice: Il ne sera pas permis de le manger
  rationale: Exprime naturellement en français l’interdiction impersonnelle; le pronom renvoie au sacrifice pascal dans le contexte.
- source_word: በአፍአ፡ እምቤተ፡ መቅደሱ
  choice: hors du sanctuaire
  rationale: Reproduit l’opposition spatiale entre l’extérieur et la présence devant le sanctuaire.
- source_word: በአንጻረ
  choice: devant
  rationale: Choix spatial naturel qui préserve le sens de « en face de, vis-à-vis de » sans suggérer une opposition hostile.
- source_word: ወኵሉ፡ ሕዝበ፡ ማኅበ
  choice: Et tout le peuple de l’assemblée
  rationale: Conserve la conjonction et le syntagme nominal, qui sert vraisemblablement de sujet à la proposition poursuivie au verset 17; le texte fourni est tronqué à la fin du mot.
theological_decisions:
- issue: Lieu où le repas pascal peut être consommé
  choice: devant le sanctuaire du SEIGNEUR
  alternative: en face du sanctuaire du SEIGNEUR
  rationale: « Devant » garde la relation cultuelle et spatiale sans préciser indûment une disposition architecturale.
- issue: Syntaxe à cheval sur les versets 16 et 17
  choice: maintenir « Et tout le peuple de l’assemblée » comme syntagme inachevé
  alternative: « avec toute l’assemblée » pour fermer la phrase au verset 16
  rationale: La conjonction et le nom « peuple » dans le guèze indiquent le début de la proposition suivante; lisser le verset isolément altérerait la syntaxe et omettrait un élément lexical.
translation_notes:
  register: Français moderne, digne et accessible. La fin demeure syntaxiquement ouverte afin de respecter la division versifiée et la continuité avec le verset 17. « SEIGNEUR » représente le nom divin selon la convention éditoriale.
