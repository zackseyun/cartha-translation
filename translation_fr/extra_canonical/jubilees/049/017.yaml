  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: fr
  text: Tout Israël l’observera au temps fixé. Tout homme qui viendra ce jour-là la mangera dans la maison du sanctuaire de votre Dieu, devant le SEIGNEUR, âgé de vingt ans et plus, car
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገበርዎ
  choice: l’observera
  rationale: Le verbe signifie littéralement « le fera », mais, à propos d’une célébration prescrite, « observer » exprime naturellement l’accomplissement rituel sans ajouter d’interprétation.
- source_word: በጊዜሁ
  choice: au temps fixé
  rationale: Le sens est celui du moment qui lui est assigné; cette formulation est plus idiomatique que « en son temps » dans ce contexte cultuel.
- source_word: ዘመጽአ
  choice: qui viendra
  rationale: La forme peut être rendue littéralement au passé, mais elle se trouve dans une prescription générale orientée vers l’avenir; le futur français restitue clairement cette valeur.
- source_word: ይብልዎ
  choice: la mangera
  rationale: Le pronom renvoie à la célébration ou à l’offrande pascale évoquée dans le contexte; le féminin français s’accorde naturellement avec « la Pâque », sans répéter ici le nom absent du verset.
- source_word: በቤተ፡ መቅደሱ
  choice: dans la maison du sanctuaire
  rationale: Cette traduction conserve les deux éléments du syntagme, « maison » et « sanctuaire », malgré une légère lourdeur voulue en français.
- source_word: ዘእም፳ዓመት፡ ወላዕለ
  choice: à partir de vingt ans
  rationale: Expression française naturelle pour « depuis vingt ans et au-dessus », inclusive de l’âge de vingt ans.
theological_decisions:
- issue: Nom divin እግዚአብሔር
  choice: le SEIGNEUR
  alternative: le Seigneur
  rationale: Les petites capitales conventionnelles signalent le nom divin sans tenter d’en imposer une vocalisation.
- issue: Portée de « tout homme »
  choice: Tout homme
  alternative: Toute personne
  rationale: Le texte source emploie explicitement un terme masculin et fixe ensuite un seuil d’âge; la traduction conserve cette formulation sans élargir ni restreindre silencieusement sa portée.
- issue: Phrase inachevée à la fin du verset
  choice: car
  alternative: omettre la conjonction finale
  rationale: Le texte fourni se termine par la conjonction « car/parce que »; la conserver respecte la division du verset et son lien syntaxique avec la suite.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe demeure proche du guèze, notamment dans « maison du sanctuaire », tandis que les prescriptions temporelles sont formulées idiomatiquement. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
