translation:
  language: fr
  text: dans la troisième partie du jour. Ils apporteront son sang au pied de l’autel, déposeront sa graisse sur le feu qui est sur l’autel et mangeront sa chair rôtie au feu dans la cour de la maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሣልስቲ፡ ለዕለት
  choice: dans le troisième tiers du jour
  rationale: Rend la division temporelle indiquée par le guèze tout en évitant l’ambiguïté française de « troisième partie ».
- source_word: ውስተ፡ ምካይዳ፡ ለምሥዋዕ
  choice: au pied de l’autel
  rationale: Le contexte cultuel désigne la partie basse ou la base de l’autel; « au pied » est naturel en français et ne suggère pas un seuil.
- source_word: ሥብሖ
  choice: sa graisse
  rationale: Terme sacrificiel désignant la graisse de l’animal offerte sur l’autel.
- source_word: ዐጸደ፡ ቤት
  choice: la cour de la Maison
  rationale: Rend littéralement la cour ou l’enceinte de la Maison; la majuscule signale ici le sanctuaire sans ajouter un nom absent du texte.
theological_decisions:
- issue: Identification de « la Maison »
  choice: Conserver « la Maison » sans explicitation
  alternative: « la cour du sanctuaire » ou « la cour de la maison de Dieu »
  rationale: Le texte source dit simplement « la Maison »; l’expliciter comme sanctuaire ou maison de Dieu résoudrait une référence implicite que le texte laisse au contexte.
translation_notes:
  register: Français moderne, digne et lisible, avec un vocabulaire cultuel précis. Le futur est conservé pour la série d’instructions formulées dans la source.
