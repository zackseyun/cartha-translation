  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: fr
  text: Ainsi, il est écrit et prescrit qu’ils le mangent dans le sanctuaire du Seigneur. Lorsque les fils d’Israël entreront dans le pays dont ils doivent prendre possession, au pays de Canaan, ils dresseront la tente du Seigneur au milieu du pays, sur le territoire de l’une de leurs tribus, jusqu’au jour où le sanctuaire du Seigneur sera bâti dans le pays. Ils viendront alors célébrer la Pâque au milieu de la tente du Seigneur et ils l’immoleront devant le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: il est écrit et prescrit
  rationale: Rend les deux passifs, l’un relatif à la mise par écrit, l’autre à l’établissement normatif de la pratique.
- source_word: በቤተ፡ መቅደሱ
  choice: dans le sanctuaire
  rationale: Expression française naturelle pour le lieu saint, sans alourdir par un calque de « maison de son sanctuaire ».
- source_word: ውሉደ፡ እስራኤል
  choice: les fils d’Israël
  rationale: Conserve la désignation collective traditionnelle et la forme proche de la source.
- source_word: ይእኅዙ
  choice: prendre possession
  rationale: Exprime l’idée d’acquérir et de tenir le pays en possession.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: la tente du Seigneur
  rationale: Désigne la demeure cultuelle mobile; « tente » reste clair et n’impose pas le terme plus technique « tabernacle ».
- source_word: ጳስካ
  choice: la Pâque
  rationale: Terme français consacré pour la célébration pascale d’Israël.
- source_word: ይጠብኅዎ
  choice: ils immoleront l’agneau
  rationale: Le pronom objet renvoie à la victime pascale; l’explicitation minimale évite en français l’ambiguïté artificielle de « l’immoleront ».
theological_decisions:
- issue: Nature de l’ordre relatif au sanctuaire
  choice: « écrit et prescrit »
  alternative: « écrit et ordonné »
  rationale: « Prescrit » garde la force normative sans suggérer nécessairement un commandement ponctuel ni préciser l’agent au-delà du texte.
- issue: Localisation de la tente dans une tribu
  choice: « dans le territoire de l’une de leurs tribus »
  alternative: « dans l’une de leurs tribus »
  rationale: L’ajout de « territoire » explicite le sens spatial requis en français sans identifier la tribu ni résoudre davantage la formulation.
- issue: Objet de l’immolation
  choice: « l’agneau »
  alternative: « ils l’immoleront »
  rationale: Le contexte de la Pâque fournit le référent; cette explicitation rend la phrase idiomatique tout en conservant le contenu cultuel.
translation_notes:
  register: Français international moderne, digne et lisible. Le futur structure la séquence historique et prescriptive. « Seigneur » traduit le titre divin sans importer une vocalisation du nom propre; « Pâque » et « immoler » maintiennent le registre cultuel.
