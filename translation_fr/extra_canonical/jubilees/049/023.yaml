  source_fidelity: 'Le texte français rend correctement les principaux éléments du guèze : « devant le SEIGNEUR », « sur l’autel de votre Dieu », la célébration de la fête avec hâte, la sortie d’Égypte, le désert de Shour et l’achèvement au bord de la mer. Toutefois, « puisque » tend à présenter la dernière proposition comme une justification explicative plus forte que le « car/parce que » de l’anglais de contrôle et que la relation causale/source peut être rendue plus simplement.'
