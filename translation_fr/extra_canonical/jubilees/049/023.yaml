  text: before the LORD, upon the altar of your God. For you observed this feast in haste when you came out from Egypt until you entered the wilderness of Shur, because at the shore of the sea you completed it.
translation:
  language: fr
  text: devant le SEIGNEUR, sur l’autel de votre Dieu. Car vous avez célébré cette fête à la hâte lorsque vous êtes sortis d’Égypte et jusqu’à ce que vous entriez dans le désert de Shour, car vous l’avez achevée au bord de la mer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅድመ፡ እግዚአብሔር
  choice: devant le SEIGNEUR
  rationale: Rend directement la locution spatiale et cultuelle guèze, avec la convention française « SEIGNEUR » pour le nom divin.
- source_word: ዲበ፡ ምሥዋዐ፡ አምላክክሙ
  choice: sur l’autel de votre Dieu
  rationale: Traduction formelle et naturelle de la préposition, de « l’autel » et du possessif pluriel.
- source_word: ዛቲ፡ በዓለ
  choice: cette fête
  rationale: Le démonstratif féminin et le nom désignent la fête évoquée dans le contexte.
- source_word: በውልዋሌ፡ ገበርክምዋ
  choice: vous avez célébré cette fête à la hâte
  rationale: « Célébrer » convient idiomatiquement à une fête, tandis que « à la hâte » conserve l’idée de précipitation.
- source_word: ገዳመ፡ ሱር
  choice: le désert de Shour
  rationale: Transcription française courante du toponyme biblique Shur/Shour.
- source_word: በኀበ፡ ድንጋገ፡ ባሕር
  choice: au bord de la mer
  rationale: Rend naturellement l’indication de lieu sans préciser quelle mer, puisque le texte source ne la nomme pas ici.
- source_word: ሰበጥክምዋ
  choice: vous l’avez achevée
  rationale: Conserve le référent féminin, la fête, et le sens d’accomplissement ou d’achèvement.
theological_decisions:
- issue: Référent du pronom dans la dernière proposition
  choice: « vous l’avez achevée », référant à la fête
  alternative: « vous l’avez accomplie », éventuellement avec un référent rituel plus général
  rationale: L’accord et la continuité syntaxique favorisent « cette fête », sans ajouter d’explication théologique.
- issue: Portée temporelle de « jusqu’à »
  choice: la célébration s’étend de la sortie d’Égypte à l’entrée dans le désert de Shour
  alternative: comprendre « jusqu’à » comme rattaché seulement au déplacement
  rationale: La syntaxe du passage relie naturellement les deux bornes temporelles à l’action de célébrer; la formulation française préserve néanmoins la structure du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le début demeure un fragment syntaxique, comme dans le verset source fourni, probablement en continuité avec le verset précédent. Aucun marqueur de note n’est requis.
