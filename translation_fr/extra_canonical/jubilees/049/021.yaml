  text: that has been sanctified in the name of the LORD. And they shall not be able to observe the Passover in their cities, nor in any place except before the tent of the LORD, or before his house where he dwells.
translation:
  language: fr
  text: ce qui a été sanctifié au nom du SEIGNEUR. Ils ne pourront célébrer la Pâque ni dans leurs villes ni en quelque lieu que ce soit, sauf devant la tente du SEIGNEUR, ou[a] devant sa maison, là où il demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «et sinon devant sa maison». La tournure signifie ici «ou devant sa maison».'
    reason: La formulation guèze conserve une trace idiomatique de l’alternative qu’une traduction française naturelle rend par «ou».
lexical_decisions:
- source_word: ዘተቀደሰ፡ በስመ፡ እግዚአብሔር
  choice: ce qui a été sanctifié au nom du SEIGNEUR
  rationale: La proposition relative guèze est conservée sans lui ajouter un antécédent absent de l’extrait; le passif et la formule «au nom du SEIGNEUR» sont rendus directement.
- source_word: ገቢረ፡ ጳስካ
  choice: célébrer la Pâque
  rationale: Littéralement «faire la Pâque»; «célébrer» est l’expression française naturelle pour l’observance rituelle tout en gardant le sens du texte.
- source_word: በአህጉሪሆሙ፡ ወበኵሉ፡ በሓውርት
  choice: ni dans leurs villes ni en quelque lieu que ce soit
  rationale: Rend l’interdiction portant à la fois sur leurs villes et sur tout autre endroit.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: la tente du SEIGNEUR
  rationale: «Tente» restitue le sanctuaire mobile désigné par le terme guèze, sans préciser davantage que la source.
- source_word: ኀበ፡ ኀደረ
  choice: là où il demeure
  rationale: Le sujet implicite est conservé sous la forme «il», sans introduire «son nom», absent du texte source.
theological_decisions:
- issue: Rapport entre la tente du SEIGNEUR et sa maison
  choice: ou devant sa maison
  alternative: et devant sa maison
  rationale: La tournure ወአመ፡ አኮ («et sinon / ou bien») marque ici une alternative. La traduction ne confond donc pas les deux désignations ni n’exige simultanément les deux emplacements.
- issue: Sujet de «demeure»
  choice: là où il demeure
  alternative: là où son nom demeure
  rationale: Le texte guèze ne contient pas «son nom» dans cette proposition; l’ajouter importerait une précision théologique non attestée ici.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du texte source, notamment dans le fragment relatif initial, tandis que «célébrer la Pâque» privilégie l’usage français naturel. Les petites capitales sont représentées par «SEIGNEUR».
