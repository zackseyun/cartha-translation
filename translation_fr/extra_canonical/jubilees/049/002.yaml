revisions:
- from: 'La nuit, au soir du quinzième jour, dès le coucher du soleil. Car cette nuit-là marque le commencement de la fête et le commencement de la joie. Vous demeuriez en Égypte et mangiez la Pâque, tandis que toutes les puissances de Mastéma avaient été envoyées pour tuer tous les premiers-nés du pays d’Égypte, depuis le premier-né du pharaon jusqu’au premier-né de la servante captive qui se trouvait dans la maison du moulin, ainsi que les premiers-nés du bétail. Voici le signe que le SEIGNEUR leur donna : dans toute maison où ils verraient, sur les montants de la porte, le sang d’un agneau âgé d’un an, ils ne devaient pas entrer pour tuer, mais passer par-dessus cette maison, afin que tous ceux qui s’y trouvaient soient sauvés, puisque le signe du sang était sur ses montants.


    Les puissances du SEIGNEUR firent tout ce que le SEIGNEUR leur avait ordonné. Elles passèrent par-dessus tous les fils d’Israël, et aucun fléau ne s’abattit sur eux pour retrancher parmi eux quelque vie que ce soit, depuis le bétail jusqu’aux êtres humains, et même jusqu’aux chiens. Le fléau fut extrêmement grand en Égypte : il n’y avait aucune maison où il n’y eût un mort, avec deuil et lamentations. Mais tout Israël demeurait là, mangeant la viande de la Pâque, buvant du vin, louant et bénissant le SEIGNEUR, le Dieu de leurs pères, et lui rendant grâce. Ils se tenaient prêts à sortir de dessous le joug de l’Égypte et de la dure servitude.


    Toi aussi, souviens-toi de ce jour tous les jours de ta vie et célèbre-le d’année en année, tous les jours de ta vie, une fois par an, au jour fixé, conformément à toute la loi qui le concerne. Ne déplace pas ce jour d’un jour à un autre, ni d’un mois à un autre. Car c’est une prescription perpétuelle, écrite et établie sur les tablettes célestes pour tous les enfants d’Israël : ils doivent la mettre en pratique chaque année, d’année en année, au jour fixé, une fois par an, dans toutes leurs générations. Cela ne prendra jamais fin, car cette prescription est établie pour toujours.


    L’homme qui est pur et qui vient la célébrer au jour fixé apportera une offrande agréée devant le SEIGNEUR, et mangera et boira devant lui le jour de la fête. Mais cet homme, s’il est pur et se trouve à proximité, sera retranché s’il n’apporte pas l’offrande du SEIGNEUR au moment fixé : cet homme portera la responsabilité de son péché.[a]


    Ainsi, les enfants d’Israël viendront célébrer la Pâque au moment fixé, le quatorzième jour du premier mois, entre les deux soirs, depuis le milieu du jour[b] jusqu’au premier tiers de la nuit. En effet, deux parties du jour sont attribuées à la lumière, et la troisième appartient au soir. Voilà ce que le SEIGNEUR t’a ordonné de faire au milieu du soir. La victime ne doit être égorgée à aucun moment où il fait jour, mais seulement au temps du soir. Ils la mangeront au temps du soir, jusqu’au premier tiers de la nuit. Après le premier tiers de la nuit, ils brûleront au feu tout ce qui restera de sa viande.


    Ils ne la mangeront pas crue ni cuite dans l’eau, mais rôtie au feu. Ils la feront rôtir au feu tout entière, avec sa tête, ses entrailles et ses pattes. Ils n’en briseront aucun os, car aucun os ne doit être brisé parmi les enfants d’Israël. C’est pourquoi le SEIGNEUR a ordonné aux enfants d’Israël de célébrer la Pâque au moment fixé et de n’en briser aucun os. Car c’est un jour de fête, un jour prescrit. Ils ne doivent pas le déplacer d’un jour à un autre ni d’un mois à un autre, mais le célébrer au jour de sa fête.


    Et toi, ordonne aux enfants d’Israël de célébrer la Pâque aux temps prescrits, chaque année, une fois par an, au moment fixé. Elle constituera devant le SEIGNEUR un mémorial qui lui est agréable, et aucun fléau ne viendra sur eux pour les tuer ou les frapper durant l’année où ils célébreront la Pâque.'
