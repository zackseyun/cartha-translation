  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: fr
  text: 'Souviens-toi du commandement que le Seigneur t’a donné au sujet de la Pâque : célèbre-la au temps fixé, le quatorzième jour du premier mois ; immole-la avant le soir, et qu’on la mange.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: Souviens-toi
  rationale: Rend directement l’impératif du verbe « se souvenir ».
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et digne du titre divin guèze.
- source_word: ፋሲካ
  choice: la Pâque
  rationale: Terme français établi pour la fête et son sacrifice dans ce contexte.
- source_word: ትግበር
  choice: célèbre-la
  rationale: Le verbe signifie littéralement « faire » ; dans le contexte d’une fête prescrite, « célébrer » est naturel et précis.
- source_word: በጊዜሁ
  choice: au temps fixé
  rationale: Exprime l’idée du moment propre ou prescrit sans ajouter de précision étrangère au texte.
- source_word: ትጥብቍ
  choice: immole-la
  rationale: Dans le contexte pascal, le verbe désigne la mise à mort sacrificielle ; « immoler » conserve cette portée cultuelle.
- source_word: ዘእንበለ፡ ይምሰይ
  choice: avant le soir
  rationale: Rendu direct de l’indication temporelle.
- source_word: ይብልዕዎ
  choice: qu’on la mange
  rationale: Le source emploie une troisième personne du pluriel indéterminée ; « on » préserve cette différence de sujet par rapport au « tu » précédent.
theological_decisions:
- issue: Référent pronominal de « la »
  choice: Conserver le féminin singulier renvoyant à la Pâque, comprise ici comme sacrifice pascal.
  alternative: Expliciter « l’agneau pascal » ou « le sacrifice pascal ».
  rationale: Le texte source nomme seulement la Pâque ; expliciter l’animal ou le sacrifice résoudrait une métonymie que le texte laisse implicite.
- issue: Sujet du dernier verbe
  choice: « qu’on la mange »
  alternative: « qu’ils la mangent »
  rationale: Le pluriel du source n’identifie pas explicitement le groupe ; le pronom indéfini français évite d’introduire un antécédent absent tout en maintenant le changement par rapport à la deuxième personne.
translation_notes:
  register: Français moderne, clair et digne. La ponctuation met en évidence les prescriptions successives. Aucune note n’est nécessaire ; aucun marqueur de note n’apparaît donc dans le texte.
