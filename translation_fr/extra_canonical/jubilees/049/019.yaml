  text: from year to year. And in the days when the house is built in the name of the LORD in the land of their inheritance, there they shall go and slaughter the Passover in the evening, at sunset,
translation:
  language: fr
  text: d’année en année. Et, aux jours où la Maison sera bâtie au nom du Seigneur dans le pays dont ils ont hérité, ils iront là offrir le sacrifice de la Pâque, le soir, au coucher du soleil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምዓመት፡ በዓመት
  choice: d’année en année
  rationale: Rend naturellement la répétition distributive exprimant une observance annuelle.
- source_word: ቤት
  choice: la Maison
  rationale: Dans ce contexte cultuel, le terme désigne le sanctuaire qui sera bâti au nom du Seigneur; la majuscule signale cet emploi sans ajouter le mot « Temple » absent du texte.
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et intelligible du titre divin guèze.
- source_word: በምድረ፡ ርስትሙ
  choice: dans le pays dont ils ont hérité
  rationale: Expression française naturelle conservant le sens de terre ou pays d’héritage.
- source_word: የሐሩ፡ ወይጥብሑ
  choice: ils iront là offrir le sacrifice
  rationale: Préserve explicitement le verbe de mouvement የሐሩ (« ils iront ») et rend le verbe d’abattage dans son sens sacrificiel contextuel.
- source_word: ጳስካ
  choice: de la Pâque
  rationale: Désigne ici le sacrifice pascal, et non seulement la fête abstraite.
- source_word: ምሴተ፡ እንዘ፡ የዐርብ፡ ፀሐይ
  choice: le soir, au coucher du soleil
  rationale: Conserve les deux indications temporelles du texte dans un français idiomatique.
theological_decisions:
- issue: Désignation du sanctuaire futur
  choice: la Maison
  alternative: le Temple
  rationale: « La Maison » reste proche du mot source et de l’expression biblique, tandis que « le Temple » expliciterait davantage que le texte lui-même.
- issue: Sens sacrificiel de l’abattage de la Pâque
  choice: offrir le sacrifice de la Pâque
  alternative: immoler la Pâque
  rationale: La formulation choisie est claire pour le lectorat moderne et conserve la portée cultuelle; « immoler » serait plus formel et plus directement centré sur la mise à mort.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur est conservé, ainsi que le mouvement vers le sanctuaire. La phrase commence volontairement en continuation du verset précédent.
