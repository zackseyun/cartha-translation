  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
translation:
  language: fr
  text: Ils se soulèveront, armés d’arcs et d’épées, et se livreront au massacre pour les ramener sur le chemin. Ils ne feront pas demi-tour jusqu’à ce que beaucoup de sang soit répandu sur la terre, ceux-ci par ceux-là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci par ceux-là ».'
    reason: La formule guèze finale est démonstrative et concise. Elle ne précise pas davantage l’identité des groupes ni la nature exacte de leur relation.
lexical_decisions:
- source_word: ይቀውሙ (yiqawwəmu)
  choice: ils se soulèveront
  rationale: Le verbe peut exprimer le fait de se tenir debout ou de se dresser. Dans ce contexte d’affrontement armé, « se soulèveront » rend naturellement le mouvement hostile sans réduire le sens à une simple posture.
- source_word: በቀስት፡ ወበአስይፍት፡ ወበቅትል
  choice: armés d’arcs et d’épées, et se livreront au massacre
  rationale: 'La répétition de la préposition « avec/par » est reformulée en français courant tout en conservant les trois éléments : arc, épées et tuerie. Le singulier collectif « arc » est naturellement rendu au pluriel en français.'
- source_word: ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  choice: pour les ramener sur le chemin
  rationale: La préposition ውስተ indique un mouvement vers ou dans le chemin, et non un éloignement hors de celui-ci. « Ramener sur le chemin » exprime clairement cette direction.
- source_word: ኢይትመየጡ
  choice: ils ne feront pas demi-tour
  rationale: Cette expression française rend le mouvement de retour ou de recul tout en maintenant le contraste avec l’action précédente.
- source_word: እሉ፡ በእሉ
  choice: les uns par les autres
  rationale: La formule démonstrative réciproque signifie littéralement « ceux-ci par ceux-là » et désigne ici l’effusion de sang mutuelle entre les groupes.
theological_decisions:
- issue: Sens de l’action exercée sur ceux qui ont quitté le chemin
  choice: les ramener sur le chemin
  alternative: les chasser du chemin
  rationale: Le choix suit la direction marquée par ውስተ, « vers/dans », et évite d’introduire l’idée opposée d’un éloignement. Il ne précise pas davantage la valeur morale ou religieuse du « chemin ».
- issue: Caractère réciproque de l’effusion de sang
  choice: les uns par les autres
  alternative: ceux-ci par ceux-là
  rationale: Le français idiomatique exprime ainsi la réciprocité suggérée par la formule guèze, sans identifier artificiellement les groupes ni attribuer la violence à un seul camp.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe évite le calque lourd de la répétition des prépositions tout en conservant la violence et la progression du texte. « Le chemin » reste sans complément explicatif afin de préserver l’indétermination de la source.
