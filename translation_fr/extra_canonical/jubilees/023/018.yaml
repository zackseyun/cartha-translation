  yaml_path: translation/extra_canonical/jubilees/023/018.yaml
  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
translation:
  language: fr
  text: Car ils ont tous agi avec méchanceté ; toute bouche profère le péché ; toutes leurs œuvres sont impureté et abomination, et toutes leurs voies sont souillure, impureté et destruction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le dernier mot peut aussi se traduire par « corruption » ou « ruine ». Le mot rendu par « péché » peut également signifier « faute » ou « culpabilité ».
    reason: Préserver les ambiguïtés lexicales possibles de ሙስና et de ዐበሳ, tout en donnant « destruction » comme rendu principal de ሙስና.
lexical_decisions:
- source_word: አእከዩ (ʾaʾkayu)
  choice: ont agi avec méchanceté
  rationale: Rend le verbe de conduite mauvaise de façon naturelle, tout en conservant sa valeur morale.
- source_word: ዐበሳ (ʿabasa)
  choice: le péché
  rationale: Le terme peut évoquer faute, culpabilité ou péché ; ici, après « toute bouche profère », « péché » exprime directement la teneur morale des paroles sans réduire le mot à un simple sentiment de culpabilité.
- source_word: ርኵስ (rəkus)
  choice: impureté / souillure
  rationale: Le terme appartient au champ de l’impureté. La variation française évite une répétition trop lourde, tandis que la seconde occurrence demeure explicitement rendue par « impureté ».
- source_word: ስቈራር (səqwarar)
  choice: abomination
  rationale: Ce choix conserve la forte idée d’horreur et de répulsion attachée au terme, plutôt que de l’affaiblir en « corruption ».
- source_word: ግማኔ (gəmanē)
  choice: souillure
  rationale: Rend l’idée de saleté ou de contamination morale dans un français biblique actuel et compréhensible.
- source_word: ሙስና (musəna)
  choice: corruption
  rationale: Le sens central est celui de corruption, détérioration ou ruine ; « corruption » préserve cette portée sans imposer exclusivement l’issue de destruction.
theological_decisions:
- issue: 'Valeur de ዐበሳ : péché, faute ou culpabilité'
  choice: péché
  alternative: faute / culpabilité
  rationale: « Péché » convient à ce que la bouche profère et maintient la dimension morale du passage ; une note signale l’ambiguïté lexicale réelle.
- issue: Portée finale de ሙስና
  choice: corruption
  alternative: destruction / ruine
  rationale: « Corruption » reste proche de la détérioration morale décrite par l’ensemble du verset, mais le terme peut aussi désigner son résultat destructeur ; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La structure cumulative du guèze est conservée au moyen de propositions parallèles et d’une énumération finale. « Ne sont qu’ » donne naturellement au prédicat nominal sa force globale sans ajouter de doctrine.
