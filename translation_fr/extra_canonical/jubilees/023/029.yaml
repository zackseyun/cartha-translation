revisions:
- from: Alors les jours commenceront à se multiplier et la longévité des enfants des hommes augmentera, de génération en génération et de jour en jour, jusqu’à ce que leur vie approche de mille ans, et même de nombreuses années au-delà. Il n’y aura plus de vieillard ni personne qui ne soit rassasié de ses jours, car tous seront comme des enfants et des jeunes gens. Ils achèveront tous leurs jours dans la paix et la joie, et ils vivront. Il n’y aura ni Satan ni aucun destructeur mauvais, car tous leurs jours seront des jours de bénédiction et de guérison.
  to: Alors les jours commenceront à devenir nombreux et à s’accroître parmi les enfants des hommes, de génération en génération et de jour en jour, jusqu’à ce que leurs jours approchent de mille ans et les dépassent de nombreuses années. Il n’y aura ni vieillard ni personne qui ne soit rassasiée de ses jours, car tous seront comme des enfants et des jeunes gens. Tous leurs jours, ils les achèveront dans la paix et la joie, et ils vivront ; il n’y aura ni Satan ni aucun destructeur malfaisant, car tous leurs jours seront des jours de bénédiction et de guérison.
  rationale: 'La révision rétablit « jours » comme image directrice du passage, rend explicite mais sans surinterprétation le dépassement de mille ans, et améliore l’idiomaticité de la désignation du destructeur. Aucun appareil de notes n’est requis : le texte conserve l’ambiguïté relative entre Satan et le destructeur malfaisant.'
