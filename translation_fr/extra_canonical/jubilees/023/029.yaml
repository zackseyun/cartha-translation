base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/029.yaml
  text: And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.
translation:
  language: fr
  text: Alors les jours commenceront à devenir nombreux et à s’accroître parmi les enfants des hommes, de génération en génération et de jour en jour, jusqu’à ce que leurs jours approchent de mille ans et les dépassent de nombreuses années. Il n’y aura ni vieillard ni personne qui ne soit rassasiée de ses jours, car tous seront comme des enfants et des jeunes gens. Tous leurs jours, ils les achèveront dans la paix et la joie, et ils vivront ; il n’y aura ni Satan ni aucun destructeur malfaisant, car tous leurs jours seront des jours de bénédiction et de guérison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕል
  choice: jours / vie
  rationale: Le terme signifie littéralement « jours », mais dans l’expression relative à l’approche de mille ans il désigne naturellement la durée de la vie; l’alternance française préserve l’image tout en assurant l’intelligibilité.
- source_word: ይሌህቃ
  choice: la longévité … augmentera
  rationale: Le verbe exprime l’idée de grandir ou de s’accroître; « longévité » rend clairement ici l’augmentation du nombre des jours humains.
- source_word: ይጸግብ፡ መዋዕሊሆሙ
  choice: être rassasié de ses jours
  rationale: Cette formulation conserve l’image sémitique de la satiété appliquée à une vie arrivée à son plein accomplissement.
- source_word: ሰይጣነ
  choice: Satan
  rationale: Translittération traditionnelle et immédiatement compréhensible du nom ou titre présent dans le texte.
- source_word: እኩየ፡ ዘያማስን
  choice: destructeur mauvais
  rationale: Rend distinctement l’adjectif « mauvais » et le participe relatif « qui détruit/corrompt », sans identifier davantage la figure.
- source_word: ፈውስ
  choice: guérison
  rationale: Équivalent direct qui conserve la dimension de restauration physique ou générale sans la préciser abusivement.
theological_decisions:
- issue: Nature de Satan et du destructeur mauvais
  choice: 'Maintenir deux désignations coordonnées: « ni Satan ni aucun destructeur mauvais »'
  alternative: Comprendre le destructeur mauvais comme une apposition ou une description de Satan
  rationale: La répétition de la structure négative favorise la distinction grammaticale, tandis que la traduction évite de trancher leur relation ontologique.
- issue: Portée de la durée de mille ans
  choice: « leur vie approche de mille ans »
  alternative: « leurs jours approchent de mille ans »
  rationale: Le sens contextuel concerne la longévité humaine; « approche » préserve toutefois le caractère approximatif du texte, sans affirmer que chacun atteint exactement mille ans.
- issue: Comparaison avec les enfants et les jeunes
  choice: Conserver la comparaison explicite
  alternative: Interpréter comme une jeunesse éternelle ou une absence de vieillissement
  rationale: Le texte dit qu’ils seront « comme » des enfants et des jeunes; la traduction ne transforme pas cette comparaison en doctrine physiologique précise.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche des répétitions et du parallélisme de la source, tout en évitant un calque maladroit. « Rassasié de ses jours » est volontairement conservé comme expression biblique transparente dans son contexte.
