  text: And all this will come upon an evil generation which sins on the earth; their deeds are uncleanness and fornication and impurity and abomination.
translation:
  language: fr
  text: Tout cela viendra sur une génération mauvaise qui pèche sur la terre ; ses œuvres sont impureté, inconduite sexuelle, souillure et abomination.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመጽእ
  choice: s’abattra sur
  rationale: Le verbe signifie littéralement « viendra ». Dans ce contexte de jugements qui atteignent une génération, « s’abattra sur » exprime naturellement en français le mouvement hostile sans modifier le référent de « tout cela ».
- source_word: ትኤብስ
  choice: pèche
  rationale: Le verbe signifie « pécher, transgresser », et non « souiller ». Cette traduction maintient donc la proposition distincte « qui pèche sur la terre ».
- source_word: ርኵስ
  choice: impureté
  rationale: Terme moral et cultuel assez large, rendu par un nom abstrait afin de conserver la série nominale du texte source.
- source_word: ዝሙት
  choice: inconduite sexuelle
  rationale: Rend le champ de l’immoralité sexuelle dans un français actuel, clair et digne, sans le limiter artificiellement au seul adultère.
- source_word: ገማኔ
  choice: souillure
  rationale: Préserve un second terme lié à l’impureté tout en le distinguant lexicalement de ርኵስ.
- source_word: ሳቀራር
  choice: abomination
  rationale: Conserve la forte condamnation morale exprimée par le terme source.
- source_word: ገብርሙ
  choice: ses œuvres sont
  rationale: Le mot renvoie aux œuvres ou actes de la génération collective et régit toute la liste des vices, plutôt que le seul dernier élément.
theological_decisions:
- issue: Rapport entre le péché sur la terre et la liste des vices
  choice: 'Deux propositions distinctes : la génération pèche sur la terre ; ses œuvres correspondent aux quatre vices énumérés.'
  alternative: La génération souille la terre par ces vices.
  rationale: La syntaxe guèze et le sens de ትኤብስ (« pèche ») ainsi que de ገብርሙ (« ses œuvres ») favorisent deux propositions. Cette lecture évite de transformer « sur la terre » en complément d’objet de « souiller ».
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation par point-virgule rend explicite l’articulation des deux propositions sans les fondre. « Génération mauvaise », « œuvres » et « abomination » conservent le registre biblique, tandis que « inconduite sexuelle » reste immédiatement compréhensible.
