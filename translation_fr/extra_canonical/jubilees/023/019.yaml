base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: fr
  text: Voici que la terre sera détruite à cause de toutes leurs actions. Il n’y aura ni céréales, ni vin, ni huile, car toutes leurs actions sont marquées par l’infidélité. Tous périront ensemble — animaux sauvages, bétail, oiseaux et tous les poissons de la mer — à cause des fils des hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትሐጐል / ይትሐጐሉ
  choice: sera détruite / périront
  rationale: Le même verbe guèze exprime la destruction ou la disparition. La variation française convient aux sujets respectifs, la terre puis les êtres vivants, sans modifier le lien lexical.
- source_word: ዘርእ፡ ወይን
  choice: céréales, ni vin
  rationale: Dans cette énumération agricole, ዘርእ désigne naturellement les semailles ou les céréales, tandis que ወይን désigne le vin; cette lecture évite l’expression trompeuse «semence de vigne».
- source_word: ቅብዐ
  choice: huile
  rationale: Dans la triade des produits agricoles, le terme renvoie à l’huile, normalement l’huile d’olive.
- source_word: ካሕደ፡ ምግባሪሆሙ
  choice: leurs actions sont marquées par l’infidélité
  rationale: Cette formulation rend l’idée de reniement, de fausseté ou d’infidélité attachée à leurs actes sans réduire le terme à une doctrine confessionnelle précise.
- source_word: አራዊት፡ ወእንስሳ
  choice: animaux sauvages, bétail
  rationale: La paire distingue les bêtes sauvages des animaux domestiques; «bétail» l’exprime naturellement en français.
- source_word: ውሉደ፡ ሰብእ
  choice: fils des hommes
  rationale: Traduction formelle de l’expression anthropologique du texte, conservant son registre ancien et collectif.
theological_decisions:
- issue: Nature de l’infidélité attribuée aux actions humaines
  choice: «marquées par l’infidélité»
  alternative: «mensongères» ou «sans foi»
  rationale: Le texte associe les œuvres au reniement ou à l’infidélité. La traduction retenue préserve cette tension morale et religieuse sans préciser indûment s’il s’agit de tromperie, d’apostasie ou de manque de foi.
- issue: Cause de la mort des créatures
  choice: «à cause des fils des hommes»
  alternative: «devant les fils des hommes»
  rationale: Le contexte et la valeur causale transmise par la tradition textuelle indiquent que les êtres humains sont responsables du désastre touchant les autres créatures.
translation_notes:
  register: Français international moderne, clair et digne. «Voici que» garde la force d’annonce de ናሁ sans archaïsme excessif. La phrase conserve l’ample énumération et la responsabilité humaine exprimées par le texte source.
