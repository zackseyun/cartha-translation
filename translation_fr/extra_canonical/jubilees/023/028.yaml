  text: And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.
translation:
  language: fr
  text: En ces jours-là, les enfants commenceront à rechercher la Loi, à chercher les commandements et à revenir sur le chemin de la justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቅ
  choice: les enfants
  rationale: Rend directement le substantif guèze au sens collectif, sans préciser une filiation ou une génération que le texte n’explicite pas.
- source_word: ይትኀሠሡ፡ ሕገገ
  choice: commenceront à étudier la Loi
  rationale: Le verbe exprime l’idée de rechercher ou d’examiner; « étudier » donne ici un français naturel et conserve l’idée d’une démarche attentive envers la Loi.
- source_word: ለኀሢሠ፡ ትእዛዝ
  choice: à rechercher les commandements
  rationale: Conserve le parallélisme avec la quête de la Loi et rend ትእዛዝ par le pluriel contextuel « commandements », conformément au sens normatif.
- source_word: ተመይጦ፡ ውስተ፡ ፍኖተ፡ ጽድቅ
  choice: à revenir sur le chemin de la justice
  rationale: 'Traduction proche de la construction source: retour vers/dans la voie de la justice. « Sur le chemin » est idiomatique en français.'
theological_decisions:
- issue: Sens de « justice » (ጽድቅ)
  choice: justice
  alternative: droiture
  rationale: « Justice » maintient la portée morale et religieuse du terme sans la réduire à la seule rectitude personnelle.
- issue: Statut de la Loi
  choice: majuscule à « Loi »
  alternative: loi
  rationale: La majuscule signale qu’il s’agit de la Loi divine envisagée comme un corpus reconnu, sans ajouter de précision confessionnelle.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme ternaire de la phrase source est conservé, avec des infinitifs coordonnés. Aucun ajout explicatif ni harmonisation théologique.
