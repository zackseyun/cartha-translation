  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: fr
  text: Les têtes des enfants se couvriront de cheveux gris, et un enfant de trois semaines paraîtra aussi vieux qu’un homme de cent ans ; leur stature sera détruite par la détresse et l’affliction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸዐዱ፡ አርእስተ፡ ደቂቅ፡ በሲበት
  choice: La tête des enfants blanchira de cheveux gris
  rationale: Rend directement le blanchiment de la tête par la vieillesse ou les cheveux gris, dans un français naturel, tout en conservant l’image saisissante du texte.
- source_word: ሕፃን፡ ወልደ፡ ሠለስት፡ ሱባዔ
  choice: un enfant de trois semaines
  rationale: « Trois semaines » est conservé littéralement ; dans ce contexte, il s’agit de l’âge du très jeune enfant et non d’une période symbolique explicitée.
- source_word: ልሂቅ፡ ከመ፡ ዘምእት፡ ዓመት
  choice: aussi vieux qu’un homme de cent ans
  rationale: Exprime clairement la comparaison avec une personne âgée de cent ans sans attribuer réellement cet âge à l’enfant.
- source_word: ይትሐጐል፡ ቍመቶሙ
  choice: leur stature dépérira
  rationale: Le verbe évoque la perte ou le déclin ; « dépérira » préserve l’idée d’une détérioration physique, tandis que « stature » maintient le terme concret et son éventuelle portée plus large.
- source_word: በምንዳቤ፡ ወበፃዕር
  choice: dans la détresse et la souffrance
  rationale: Restitue les deux causes ou circonstances accablantes avec des termes courants et dignes.
theological_decisions:
- issue: Nature du vieillissement précoce décrit
  choice: Conserver la description concrète sans l’interpréter
  alternative: Présenter explicitement le vieillissement comme une métaphore morale ou eschatologique
  rationale: Le verset décrit un phénomène de vieillissement et de dépérissement, mais n’en impose pas ici une interprétation théologique précise.
translation_notes:
  register: Français international moderne, sobre et dignifié. La formulation conserve le parallélisme, l’hyperbole et la tension du texte guèze sans ajouter d’explication doctrinale.
