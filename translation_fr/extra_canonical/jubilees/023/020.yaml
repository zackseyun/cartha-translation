revisions:
- from: 'Ils entreront en conflit les uns avec les autres : les jeunes avec les anciens et les anciens avec les jeunes, le pauvre avec le riche, l’humble avec le grand, et l’indigent avec le dirigeant, au sujet de la Loi et de l’alliance. En effet, ils auront oublié le commandement, l’alliance, la fête, le mois, le sabbat, le jubilé et tout ce qui a été établi.[a]'
  to: 'Ils se querelleront, ceux-ci avec ceux-là : les jeunes avec les anciens et les anciens avec les jeunes, le pauvre avec le riche, l’humble avec le grand, et l’indigent avec le dirigeant, au sujet de la Loi et de l’alliance. Car ils auront oublié le commandement, l’alliance, la fête, le mois, le sabbat, le jubilé et tout ce qui est prescrit.'
  rationale: La révision conserve l’énumération et le registre du brouillon, tout en rétablissant l’opposition explicite du texte source et en remplaçant une paraphrase passée (« ce qui a été établi ») assortie d’une note lexicale peu sûre par une formulation contextuellement fidèle, plus directe et non doctrinale (« tout ce qui est prescrit »).
