  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: fr
  text: 'Ils se querelleront, ceux-ci avec ceux-là : les jeunes avec les anciens et les anciens avec les jeunes, le pauvre avec le riche, l’humble avec le grand, et l’indigent avec le dirigeant, au sujet de la Loi et de l’alliance. Car ils auront oublié le commandement, l’alliance, la fête, le mois, le sabbat, le jubilé et tout ce qui est prescrit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትባአሱ
  choice: entreront en conflit
  rationale: Rend l’idée d’une opposition ou querelle réciproque sans la réduire à un simple débat verbal.
- source_word: ሕግ
  choice: la Loi
  rationale: Dans ce contexte d’alliance et d’observances sacrées, le terme désigne la Loi comme réalité définie; la majuscule française le signale naturellement.
- source_word: ነዳይ
  choice: le pauvre
  rationale: Équivalent français direct du terme désignant une personne démunie.
- source_word: ምስኪን
  choice: l’indigent
  rationale: Distingue ce terme de « pauvre » déjà employé et conserve l’accent sur le manque de ressources et de pouvoir.
- source_word: መኰንን
  choice: le dirigeant
  rationale: Terme assez large pour rendre une autorité ou un gouvernant sans préciser indûment sa fonction.
- source_word: በዓል
  choice: la fête
  rationale: Désigne une célébration fixée du calendrier religieux; « fête » est naturel et digne en français contemporain.
- source_word: እዮቤሌወ
  choice: le jubilé
  rationale: Transcription traditionnelle et intelligible de la période jubilaire.
theological_decisions:
- issue: Statut de la Loi et des temps sacrés
  choice: Conserver l’énumération distincte — commandement, alliance, fête, mois, sabbat, jubilé — sans l’harmoniser avec une formulation confessionnelle ultérieure.
  alternative: Regrouper ces éléments sous « prescriptions religieuses » ou préciser leur portée doctrinale.
  rationale: Le texte met en relief chaque réalité et leur oubli; les condenser ou les expliquer théologiquement effacerait sa tension propre.
- issue: Valeur du dernier syntagme ኵሎ፡ ዘ ኴነ
  choice: « tout ce qui a été établi » avec note
  alternative: « tout ce qui fut » ou « tout ce qui est arrivé »
  rationale: Le contexte des observances instituées favorise « établi », mais la forme source reste plus générale; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure en paires opposées est conservée pour maintenir le rythme rhétorique du texte source; la ponctuation clarifie cette longue énumération.
