  to: Il se leva du sein d’Abraham[a], courut prévenir Rébecca, sa mère. Rébecca se rendit de nuit auprès d’Isaac et l’informa. Ils partirent ensemble, avec Jacob; une torche était dans sa main[b]. Une fois arrivés, ils trouvèrent Abraham étendu, mort.
  rationale: La seule correction dissocie la mention de Jacob de celle de la torche afin que la syntaxe française ne transforme pas en attribution certaine ce que la forme possessive de la source laisse sans antécédent nominal explicite. Le singulier de « torche », le sens de « sein » et tous les autres éléments du texte sont conservés.
