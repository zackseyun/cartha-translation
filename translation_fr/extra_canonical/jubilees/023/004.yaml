  terminology: Les noms Rébecca, Isaac, Jacob et Abraham sont cohérents. « Sein » est le terme juste pour la poitrine/le giron et maintient le lien narratif. « Torche » convient à ማኅቶት au singulier; aucune variante plurielle ne doit être introduite.
