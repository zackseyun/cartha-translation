  source_fidelity: 'Le rendu restitue fidèlement la séquence narrative du guèze : Jacob se lève du sein d’Abraham, avertit Rébecca; celle-ci va de nuit auprès d’Isaac; ils se mettent en route avec Jacob et trouvent Abraham mort. « Du sein d’Abraham » respecte le sens concret de እምሕፅኑ et le contexte immédiat, plutôt que d’introduire « lit ». La torche est correctement au singulier. Une légère reformulation est nécessaire, car « Jacob les accompagnant, une torche à la main » attribue en français la torche sans ambiguïté à Jacob, tandis que la note affirme que le référent du possessif n’est pas explicitement nommé.'
