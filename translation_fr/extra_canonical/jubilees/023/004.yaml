  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
translation:
  language: fr
  text: Il se leva du sein d’Abraham[a], courut prévenir Rébecca, sa mère. Rébecca se rendit de nuit auprès d’Isaac et l’informa. Ils partirent ensemble, avec Jacob; une torche était dans sa main[b]. Une fois arrivés, ils trouvèrent Abraham étendu, mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « de son sein »; d’après le contexte, il s’agit du sein d’Abraham.
    reason: Le français exige de préciser plus nettement le possesseur, tandis que la forme source emploie un suffixe pronominal.
  - marker: b
    text: Litt. « une torche était dans sa main ». Le texte ne nomme pas expressément celui qui la portait; il s’agit vraisemblablement de Jacob.
    reason: Conserver l’ambiguïté grammaticale du suffixe masculin singulier sans adopter la variante plurielle non soutenue par le texte guèze.
lexical_decisions:
- source_word: እምሕፅኑ (ʾəm-ḥəṣnu)
  choice: du sein d’Abraham
  rationale: Le terme désigne littéralement le sein ou la poitrine. Le contexte précédent identifie Abraham comme celui contre qui Jacob reposait; « lit » effacerait ce lien narratif.
- source_word: ማኅቶት (māḫtot)
  choice: une torche
  rationale: Le substantif est au singulier et désigne ici une source de lumière portative, convenant au déplacement nocturne.
- source_word: እንዘ፡ ይስክብ፡ በድኖ (ʾənza yəskəb badəno)
  choice: étendu, mort
  rationale: Cette formulation conserve à la fois la posture couchée et la constatation explicite de la mort.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les enchaînements ont été légèrement assouplis pour être naturels, tout en maintenant les détails concrets du texte guèze et l’ambiguïté concernant le porteur de la torche.
