review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : les générations futures vieillissent avant d’atteindre deux jubilés, puis subissent une perte de faculté cognitive, suivie de la disparition de toute connaissance. Toutefois, « se retirant de leur esprit » est une construction française maladroite et ne rend pas clairement le rapport explicite avec « leur esprit » dans le guèze. « Avant d’avoir accompli » correspond plus directement à « avant qu’ils n’achèvent ».'
  naturalness: Le registre est approprié, mais « Leur intelligence les quittera, se retirant de leur esprit » sonne lourd et ambigu en français moderne. Une formulation avec « en quittant leur esprit » est plus fluide tout en conservant les deux compléments présents dans le texte.
  terminology: « Grand jugement », « jubilés », « intelligence » et « connaissance » sont recevables. La variation entre « intelligence » et « connaissance » reflète ici la répétition et l’intensification du texte, sans introduire de distinction doctrinale.
  issues:
  - severity: medium
    issue: Syntaxe et relation avec « leur esprit »
    rationale: La formule « se retirant de leur esprit » est peu idiomatique et laisse imprécis le lien entre l’intelligence qui abandonne les personnes et son départ de leur esprit. « Les abandonnera en quittant leur esprit » rend explicitement et naturellement les deux éléments.
  - severity: low
    issue: Rendu de la limite chronologique
    rationale: « Sans achever deux jubilés » est intelligible, mais « avant d’avoir accompli deux jubilés » suit plus clairement la construction source « avant qu’ils n’achèvent ».
  revised_text: Et toutes les générations qui se lèveront désormais jusqu’au jour du grand jugement vieilliront rapidement avant d’avoir accompli deux jubilés. Leur intelligence les abandonnera en quittant leur esprit, et toute leur connaissance disparaîtra.[a]
