  text: And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their knowledge will depart from them, from their spirit,, and all their knowledge will vanish.
translation:
  language: fr
  text: Et toutes les générations qui se lèveront désormais jusqu’au jour du grand jugement vieilliront rapidement avant d’avoir accompli deux jubilés. Leur intelligence les abandonnera en quittant leur esprit, et toute leur connaissance disparaîtra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et toute leur connaissance disparaîtra » sont placés entre crochets dans l’édition du texte source.
    reason: Signaler le statut textuel éditorialement distinct de cette proposition dans l’édition guèze fournie.
lexical_decisions:
- source_word: ትውልድ (təwəld)
  choice: générations
  rationale: Le terme désigne ici les générations successives qui apparaîtront jusqu’au jugement.
- source_word: ዕለተ፡ ደይን፡ ዐባይ
  choice: jour du grand jugement
  rationale: Rend directement la construction guèze et conserve sa portée eschatologique sans l’interpréter davantage.
- source_word: ይረሰኡ፡ ፍጡነ
  choice: vieilliront rapidement
  rationale: Traduction naturelle du verbe « vieillir » qualifié par « rapidement ».
- source_word: ክልኤ፡ ኢዮቤልወ
  choice: deux jubilés
  rationale: Conserve l’unité chronologique propre au livre, sans la convertir en nombre d’années.
- source_word: አእምሮቶሙ
  choice: leur intelligence / leur connaissance
  rationale: Le mot couvre la compréhension, l’intelligence ou la connaissance. « Intelligence » convient à la faculté qui quitte leur esprit, tandis que « connaissance » est plus idiomatique avec la disparition totale de la proposition finale; la variation française ne vise pas à distinguer deux réalités dans le source.
- source_word: እመንፈሶሙ
  choice: se retirant de leur esprit
  rationale: Préserve explicitement la mention « de leur esprit », absente de certaines formulations antérieures, tout en produisant une syntaxe française intelligible.
theological_decisions:
- issue: Nature de la perte annoncée
  choice: Leur intelligence les quittera, se retirant de leur esprit
  alternative: Leur connaissance les abandonnera depuis leur esprit
  rationale: La formulation retenue exprime une perte intérieure de la capacité de comprendre sans définir de manière doctrinale la relation entre intelligence et esprit.
- issue: Portée de « deux jubilés »
  choice: Maintien littéral de l’expression
  alternative: Avant d’atteindre cent ans
  rationale: Le texte parle en jubilés; convertir en années imposerait une durée précise et effacerait une image chronologique importante du livre.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la répétition sémantique du texte entre la perte de l’intelligence et la disparition de toute connaissance, tout en allégeant la syntaxe pour la rendre accessible.
