revisions:
- from: Et toutes les générations qui se lèveront désormais jusqu’au jour du grand jugement vieilliront rapidement, sans achever deux jubilés. Leur intelligence les quittera, se retirant de leur esprit, et toute leur connaissance disparaîtra.[a]
  to: Et toutes les générations qui se lèveront désormais jusqu’au jour du grand jugement vieilliront rapidement avant d’avoir accompli deux jubilés. Leur intelligence les abandonnera en quittant leur esprit, et toute leur connaissance disparaîtra.[a]
  rationale: La révision corrige une tournure française peu naturelle tout en conservant explicitement la mention de l’esprit, rétablie dans la piste d’audit anglaise. Elle améliore aussi le rendu de « avant qu’ils n’achèvent deux jubilés ». Le crochet éditorial de la proposition finale demeure signalé par une note ancrée au bon endroit.
