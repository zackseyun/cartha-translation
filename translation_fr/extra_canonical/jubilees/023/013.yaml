  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: fr
  text: 'En ces jours-là, si un homme vit un jubilé et demi, on dira de lui : « Il a vécu longtemps. » Mais la plupart de ses jours sont souffrance, travail et détresse, et il n’y a pas de paix.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት
  choice: un jubilé et demi
  rationale: Conserve l’unité chronologique propre au livre, soit soixante-treize ans et demi, sans la remplacer par une conversion interprétative.
- source_word: አብዝኀ፡ ሐይወ
  choice: Il a vécu longtemps
  rationale: Rend naturellement l’idée d’une vie considérée comme longue dans ce contexte.
- source_word: ሕማም፡ ወስራሕ፡ ወምንዳቤ
  choice: souffrance, travail et détresse
  rationale: 'Préserve la série de trois maux : douleur ou souffrance, labeur, puis affliction ou détresse.'
- source_word: አልቦ፡ ሰላመ
  choice: il n’y a pas de paix
  rationale: Traduction directe qui maintient la conclusion absolue et sombre du verset.
