  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: fr
  text: On entendit un bruit dans la maison d’Abraham. Ismaël, son fils, se leva, alla auprès d’Abraham, son père, et pleura son père Abraham, lui et toute la maison d’Abraham ; ils se livrèrent à de grandes lamentations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል
  choice: bruit
  rationale: Le terme peut désigner une voix, un son ou un bruit. Ici, sans locuteur ni paroles rapportées, « bruit » conserve l’indétermination et convient naturellement à l’annonce d’un décès dans la maisonnée.
- source_word: ኀበ
  choice: auprès de
  rationale: Dans ce mouvement vers Abraham, « alla auprès de » rend naturellement l’idée d’aller vers lui sans préciser davantage la localisation.
- source_word: በከየ / ብካየ፡ ዐቢየ
  choice: pleura / se livrèrent à de grandes lamentations
  rationale: La variation française évite une répétition pesante tout en conservant l’intensification sémitique exprimée par « pleurer de grandes pleurs ».
- source_word: ቤተ፡ አብርሃም
  choice: la maison d’Abraham
  rationale: « Maison » garde la portée possible de maisonnée ou famille domestique, sans la réduire au seul bâtiment.
theological_decisions:
- issue: Objet des pleurs d’Ismaël
  choice: Il pleura son père Abraham
  alternative: Il pleura sur Abraham, son père
  rationale: Le texte indique le deuil d’Ismaël pour son père. La formulation choisie est idiomatique en français et n’ajoute aucune interprétation doctrinale.
- issue: Rapport entre Ismaël et la maison d’Abraham
  choice: toute la maison d’Abraham pleura avec lui
  alternative: lui et toute la maison d’Abraham pleurèrent
  rationale: Cette formulation naturelle conserve l’idée qu’Ismaël et toute la maisonnée prennent ensemble part aux lamentations, sans modifier le contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure narrative reste proche du guèze, tandis que l’expression idiomatique « grandes lamentations » restitue l’intensité de la tournure source.
