revisions:
- from: 'Car les jours de la vie des anciens étaient de dix-neuf jubilés. Mais après le Déluge, ils commencèrent à diminuer à partir de dix-neuf jubilés : les humains vieillissaient rapidement, et les jours de leur vie se raccourcissaient à cause de nombreuses souffrances et de la méchanceté de leur conduite — à l’exception d’Abraham.'
  to: Car les anciens vivaient dix-neuf jubilés ; mais après le Déluge, ils commencèrent à vivre moins de dix-neuf jubilés, à vieillir rapidement et à voir les jours de leur vie raccourcir, à cause de nombreuses souffrances et de la méchanceté de leur conduite — à l’exception d’Abraham.
  rationale: La révision rend explicite, dans un français naturel, que la diminution concerne la longévité par rapport à dix-neuf jubilés. Elle conserve la coordination de la source entre diminution de la durée de vie, vieillissement rapide et raccourcissement des jours, ainsi que la double causalité et l’exception finale, sans en restreindre la portée.
