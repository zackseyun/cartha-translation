base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: fr
  text: Car les anciens vivaient dix-neuf jubilés ; mais après le Déluge, ils commencèrent à vivre moins de dix-neuf jubilés, à vieillir rapidement et à voir les jours de leur vie raccourcir, à cause de nombreuses souffrances et de la méchanceté de leur conduite — à l’exception d’Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀደምት
  choice: les anciens
  rationale: Désigne ici les générations d’autrefois, antérieures au Déluge; « les anciens » est naturel et suffisamment ouvert.
- source_word: ኢዮቤልውሳት
  choice: jubilés
  rationale: Conserve l’unité chronologique propre au livre des Jubilés sans la convertir ni l’expliciter dans le texte.
- source_word: አይኅ
  choice: le Déluge
  rationale: Renvoie à l’événement biblique déterminé; la majuscule signale ce référent historique dans le récit.
- source_word: ይኅትጉ
  choice: diminuer
  rationale: Rend la réduction progressive de la durée de vie par rapport aux dix-neuf jubilés.
- source_word: በረሲአ፡ ፍጡነ
  choice: vieillissaient rapidement
  rationale: Restitue directement l’idée d’un vieillissement accéléré.
- source_word: እከየ፡ ፍናዊሆሙ
  choice: la méchanceté de leur conduite
  rationale: Exprime le mal attaché à leurs voies dans un français moderne, sans réduire le sens aux seuls actes isolés.
- source_word: ዘእንበለ፡ አብርሃም
  choice: à l’exception d’Abraham
  rationale: Marque clairement l’exception formulée par la source tout en laissant ouverte sa portée exacte dans la série des affirmations précédentes.
theological_decisions:
- issue: Lien entre la diminution de la longévité, les souffrances et la conduite mauvaise
  choice: Conserver la double causalité exprimée par « à cause de… et de… »
  alternative: Présenter les souffrances comme résultant explicitement de la mauvaise conduite
  rationale: Le texte juxtapose deux causes sans préciser leur relation; la traduction ne doit pas imposer une chaîne causale supplémentaire.
- issue: Portée de l’exception concernant Abraham
  choice: Placer « à l’exception d’Abraham » à la fin de la phrase
  alternative: Préciser qu’Abraham échappa seulement au vieillissement rapide ou seulement à la méchanceté
  rationale: La position finale de l’exception dans la source laisse sa portée potentiellement large; aucune interprétation restrictive n’est ajoutée.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation garde la structure chronologique et causale du guèze, tout en remplaçant l’ambigu « ils » après le deux-points par « les humains » afin d’éviter que le lecteur ne prenne les jubilés pour sujet du vieillissement.
