  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
translation:
  language: fr
  text: En ces jours-là, ils crieront, lanceront des appels et prieront pour être délivrés de la main des nations pécheresses, mais personne ne sera délivré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸርሑ፡ ወይጼውዑ፡ ወይጼልዩ
  choice: ils crieront, appelleront et prieront
  rationale: Conserve la série de trois verbes coordonnés du guèze et sa progression rhétorique.
- source_word: ከመ፡ ይድኅኑ
  choice: pour être délivrés
  rationale: 'Exprime ici la finalité et respecte la valeur non causative du verbe : être sauvé ou échapper.'
- source_word: እምእደ፡ ኃጥአን፡ አሕዛብ
  choice: de la main des nations pécheresses
  rationale: Rend littéralement l’idiome « de la main de », qui désigne le pouvoir ou l’emprise, tout en conservant le pluriel « nations ».
- source_word: ወአልቦ፡ ዘይድኅን
  choice: mais personne ne sera délivré
  rationale: 'Le verbe est la forme simple non causative : la proposition nie qu’une personne soit délivrée, plutôt que l’existence de quelqu’un qui délivrerait.'
theological_decisions:
- issue: Valeur transitive ou intransitive de ይድኅን dans la proposition finale
  choice: personne ne sera délivré
  alternative: il n’y aura personne pour les délivrer
  rationale: La forme guèze attestée est le thème simple, « être sauvé, être délivré, échapper », et non le causatif « sauver, délivrer ».
translation_notes:
  register: Français moderne, clair et digne. « Délivrés » permet de garder le lien avec l’emprise évoquée par « la main » et d’employer le même lexème dans les deux propositions.
