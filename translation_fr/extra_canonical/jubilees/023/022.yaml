base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: fr
  text: Ceux qui auront échappé ne se détourneront pas de leur méchanceté pour suivre le chemin de la justice, car tous se lèveront pour la tromperie et la richesse, chacun afin de s’emparer de tout ce qui appartient à son prochain. Ils se feront un grand nom, mais sans vérité ni justice, et ils profaneront le Saint des saints par leur impureté et par la corruption de leur souillure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድኅኑ
  choice: auront échappé
  rationale: Le verbe exprime ici le fait d’échapper ou de survivre; le futur antérieur s’insère naturellement dans le cadre prophétique du passage.
- source_word: ፍኖተ፡ ጽድቅ
  choice: le chemin de la justice
  rationale: Rend directement l’expression «chemin de justice» dans un français naturel tout en conservant son sens moral.
- source_word: ትዕግልት
  choice: la tromperie
  rationale: Dans ce contexte de cupidité et de spoliation, le terme désigne une conduite frauduleuse ou trompeuse.
- source_word: ብዕል
  choice: la richesse
  rationale: Le substantif renvoie aux biens ou à la richesse; «richesse» convient au parallèle avec la tromperie et la saisie des biens d’autrui.
- source_word: ቅድስተ፡ ቅዱሳን
  choice: le Saint des saints
  rationale: Expression superlative sémitique désignant le lieu le plus sacré; la formulation française traditionnelle demeure claire et précise.
- source_word: ርኵሶሙ
  choice: leur impureté
  rationale: Conserve le registre cultuel et moral du terme sans le réduire à une simple saleté matérielle.
- source_word: ሙስና፡ ግማኔሆሙ
  choice: la corruption de leur souillure
  rationale: Préserve l’accumulation emphatique et la distinction entre corruption et état de souillure.
theological_decisions:
- issue: Nature du «Saint des saints»
  choice: Conserver «le Saint des saints» sans préciser davantage
  alternative: Expliciter «le sanctuaire très saint» ou identifier le Temple
  rationale: Le texte évoque un espace sacré suprême sans imposer ici une identification interprétative plus détaillée.
- issue: Sens de la justice
  choice: Employer «justice»
  alternative: Employer «droiture»
  rationale: «Justice» maintient la portée à la fois morale et religieuse du terme source et son opposition explicite à la méchanceté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure prophétique et les parallélismes sont conservés, avec une ponctuation adaptée à la lisibilité contemporaine.
