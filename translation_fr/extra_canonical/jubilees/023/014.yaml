base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/014.yaml
  text: 'For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these, one with another: disease and collapse and frost and hail and snow and fever and chills and stupor and famine and death and sword and captivity and every affliction and sickness.'
translation:
  language: fr
  text: 'Car coup sur coup, blessure sur blessure, détresse sur détresse, mauvaise nouvelle sur mauvaise nouvelle, maladie sur maladie, et tous les maux de ce genre, s’ajoutant les uns aux autres : maladie, effondrement, gel, grêle, neige, fièvre, frissons, stupeur, famine, mort, épée, captivité, et toute affliction et maladie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: coup / affliction
  rationale: Le terme ouvre la série avec l’idée d’un fléau ou d’un coup, puis la clôt dans un sens collectif d’affliction; le contexte justifie cette variation française.
- source_word: ስምዐት፡ እኩይ
  choice: mauvaise nouvelle
  rationale: Expression littéralement liée à ce qui est entendu de mauvais; « mauvaise nouvelle » rend naturellement l’idée de rapport ou nouvelle funeste.
- source_word: ጕፍጥአት
  choice: effondrement
  rationale: Rend l’idée de chute ou d’abattement sans préciser indûment s’il s’agit d’un malaise physique ou d’un désastre.
- source_word: አስሕትያ
  choice: gel
  rationale: Retenu comme calamité liée au froid dans la séquence météorologique.
- source_word: በረድ
  choice: grêle
  rationale: Sens météorologique direct dans l’énumération.
- source_word: ሐመዳ
  choice: neige
  rationale: Sens contextuel retenu entre la grêle et les affections dues au froid.
- source_word: ስክሕካሕ
  choice: frissons
  rationale: Rend un état de tremblement ou de froid corporel sans surinterprétation médicale.
- source_word: ሰምዛዝ
  choice: stupeur
  rationale: Rend un état d’engourdissement ou d’hébétude; le terme source demeure rare et incertain.
- source_word: ዐባር
  choice: famine
  rationale: Calamité collective cohérente avec la liste et le témoignage éditorial fourni.
- source_word: መጥባሕት
  choice: épée
  rationale: Métonymie biblique naturelle pour la mort violente par l’arme; évite le français peu idiomatique « coup d’épée » dans cette liste.
- source_word: ፂዋዌ
  choice: captivité
  rationale: Rend l’idée d’être emmené ou maintenu captif.
theological_decisions:
- issue: Rapport entre les calamités énumérées
  choice: « les uns avec les autres »
  alternative: « l’un avec l’autre »
  rationale: Conserve la formule distributive ዝንቱ ምስለ ዝንቱ et l’accumulation des malheurs sans imposer un ordre causal.
- issue: Répétition finale de la maladie
  choice: Maintien de « maladie » au début et à la fin de la seconde liste
  alternative: Supprimer la répétition pour alléger le style
  rationale: La répétition appartient au texte source et renforce sa rhétorique cumulative; elle ne doit pas être harmonisée.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure répétitive « X sur X » est conservée pour reproduire l’intensification du guèze. L’énumération complète est maintenue, y compris ses répétitions et ses termes de sens moins assuré.
