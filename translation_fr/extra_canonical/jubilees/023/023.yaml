  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: fr
  text: Un grand châtiment de la part du Seigneur s’abattra sur les œuvres de cette génération, et il les livrera au massacre, au jugement, à la captivité, au pillage et à la destruction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  choice: un grand châtiment
  rationale: Rend directement l’idée d’une punition ou d’un fléau de grande ampleur dans un français naturel et digne.
- source_word: ግብረ
  choice: les œuvres
  rationale: Conserve la valeur de « travaux, actes, œuvres » et le lien explicite avec ce que produit ou accomplit la génération.
- source_word: እምኀበ፡ እግዚአብሔር
  choice: venant du Seigneur
  rationale: Préserve l’indication de provenance divine sans alourdir la phrase.
- source_word: መጥባሕት
  choice: massacre
  rationale: Le terme désigne ici l’abattage ou la mise à mort plutôt que l’instrument qu’est l’épée.
- source_word: ኵነኔ
  choice: jugement
  rationale: Maintient le sens judiciaire du terme sans préciser indûment s’il s’agit de condamnation ou de sentence.
- source_word: ፂዋዌ
  choice: captivité
  rationale: Correspond à l’idée d’être emmené ou maintenu captif.
- source_word: ሀደድ
  choice: pillage
  rationale: Exprime clairement la spoliation violente.
- source_word: ብልዐት
  choice: destruction
  rationale: Dans cette série de calamités, « destruction » transmet naturellement la portée dévastatrice du terme, dont le sens littéral peut évoquer le fait de dévorer.
theological_decisions:
- issue: Origine et agent du châtiment
  choice: Le châtiment vient du Seigneur, puis « il les livrera »
  alternative: Un grand châtiment frappera leurs œuvres devant le Seigneur
  rationale: La construction source et le contexte soutiennent la provenance divine; la reprise pronominale conserve l’action personnelle de Dieu sans explicitation doctrinale supplémentaire.
- issue: Portée de « jugement »
  choice: jugement
  alternative: condamnation
  rationale: « Jugement » garde ouverte l’ambiguïté entre procédure, sentence et condamnation, au lieu de la résoudre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination cumulative reproduit la solennité de l’énumération source. « Frappera les œuvres » est légèrement marqué, mais demeure intelligible et conserve la relation du châtiment aux actes de la génération.
