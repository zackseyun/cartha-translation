  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: fr
  text: Et il suscitera contre eux les pécheurs des nations, qui n’auront envers eux ni miséricorde ni compassion et ne feront faveur ni au vieillard ni au jeune homme ni à personne ; car ils sont mauvais et puissants, au point de faire plus de mal que tous les fils des hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያነቅህ
  choice: il suscitera
  rationale: Le verbe exprime l’idée d’éveiller ou de soulever quelqu’un contre d’autres ; « suscitera contre eux » rend naturellement ce mouvement hostile.
- source_word: ኃጥአኒሆሙ፡ ለአሕዛብ
  choice: les pécheurs des nations
  rationale: Traduction formelle du groupe nominal, sans préciser davantage l’identité de ces agresseurs.
- source_word: ምሕረተ፡ ወሣህለ
  choice: miséricorde ni compassion
  rationale: Le binôme désigne deux formes proches de clémence et de pitié ; la coordination négative française restitue leur cumul.
- source_word: ኢያደልዉ
  choice: n’épargneront
  rationale: Dans ce contexte de violence sans distinction d’âge ni de personne, « épargner » exprime clairement l’absence de faveur ou de traitement préférentiel.
- source_word: ለገጸ፡ መኑሂ
  choice: ni personne
  rationale: La formule élargit l’absence de faveur à toute personne, après les catégories d’âge.
- source_word: እኩያን፡ ወኀያላን
  choice: mauvais et puissants
  rationale: Conserve les deux qualificatifs moraux et militaires sans transformer la puissance en simple cruauté.
- source_word: እምኵሉ፡ ውሉደ፡ ሰብእ
  choice: que tous les fils des hommes
  rationale: Rend l’expression anthropologique traditionnelle de manière intelligible tout en conservant sa couleur ancienne.
theological_decisions:
- issue: Référent du sujet verbal singulier
  choice: « il » sans identification ajoutée
  alternative: Identifier explicitement Dieu comme sujet
  rationale: Le verset transmis emploie un sujet pronominal dont l’antécédent dépend du contexte ; la traduction préserve cette dépendance au lieu d’expliciter théologiquement le référent.
- issue: Fonction des nations hostiles
  choice: « suscitera contre eux »
  alternative: « incitera contre eux » ou « réveillera contre eux »
  rationale: La formulation conserve l’idée d’une mise en action sans développer une doctrine de causalité divine ni atténuer la tension du texte.
translation_notes:
  register: 'Français moderne, soutenu mais accessible. Le rythme accumulatif du texte source est conservé, avec une ponctuation qui clarifie la progression : absence de pitié, absence d’exception, puis motif moral et comparaison finale.'
