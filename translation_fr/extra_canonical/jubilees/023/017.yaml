base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/017.yaml
  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
translation:
  language: fr
  text: Dans cette génération, les enfants[a] feront des reproches à leurs pères et à leurs anciens à cause du péché, de l’injustice, des paroles de leur bouche et des grands maux qu’ils commettent, et parce qu’ils ont abandonné l’alliance que le Seigneur avait établie entre eux et lui, afin qu’ils observent et mettent en pratique tous ses commandements, ses prescriptions et toute sa loi, sans s’en écarter ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «les fils».
    reason: Le ge’ez ደቂቅ peut désigner les enfants en général ou, selon le contexte, les fils.
lexical_decisions:
- source_word: ደቂቅ
  choice: les enfants
  rationale: Le terme ge’ez désigne couramment les enfants ou les jeunes; ce choix rend naturellement le contraste avec «leurs pères et leurs anciens», tout en conservant en note le sens possible «fils».
- source_word: ይዘልፉ
  choice: feront des reproches à
  rationale: Rend l’idée de blâmer ou d’adresser des reproches, dans un français moderne et naturel.
- source_word: ዐመፃ
  choice: injustice
  rationale: Le terme exprime la faute, l’iniquité ou l’injustice; «injustice» préserve ici la portée morale générale.
- source_word: ሥርዐተ
  choice: l’alliance / prescriptions
  rationale: Le premier emploi, dans la relation établie par Dieu entre lui et le peuple, est rendu contextuellement par «alliance»; le second, au sein de la série commandements-prescriptions-loi, par «prescriptions».
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et dignifié du titre divin ge’ez.
- source_word: ተኃኅቶ፡ የማነ፡ ወፀጋመ
  choice: sans s’en écarter ni à droite ni à gauche
  rationale: Restitue l’idiome directionnel qui exprime une obéissance sans déviation.
theological_decisions:
- issue: Nature de ce que Dieu a établi entre le peuple et lui
  choice: l’alliance
  alternative: la règle / l’ordonnance
  rationale: Le contexte relationnel («entre eux et lui») et l’obligation d’observer les commandements soutiennent «alliance», sans préciser davantage sa nature ni importer une construction confessionnelle.
- issue: Référent des possessifs dans les commandements
  choice: tous ses commandements
  alternative: tous les commandements
  rationale: Le contexte attribue les normes au Seigneur; le possessif explicite cette relation sans modifier le sens.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue coordination du texte source est conservée dans une phrase fluide. «Anciens» garde l’ambiguïté entre personnes âgées et figures d’autorité.
