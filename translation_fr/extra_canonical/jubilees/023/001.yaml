  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: fr
  text: Il posa les deux doigts de Jacob sur ses yeux, bénit le Dieu des dieux, se couvrit le visage, étendit ses pieds, dormit du sommeil éternel et fut réuni à ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጻብዐ፡ ያዕቆብ
  choice: les deux doigts de Jacob
  rationale: Le duel ክልኤሆን indique « deux »; la construction génitive est conservée sans préciser au-delà du texte à qui appartiennent les doigts.
- source_word: አምላክ፡ አማልክት
  choice: le Dieu des dieux
  rationale: Rend littéralement le titre superlatif et théologique du guèze.
- source_word: ንዋመ፡ ዘለዓለም
  choice: du sommeil éternel
  rationale: Préserve l’image euphémique et solennelle de la mort plutôt que de la remplacer par une explication.
- source_word: ተጋብአ፡ ኀበ፡ አበዊሁ
  choice: fut réuni à ses pères
  rationale: Conserve l’idiome ancestral et sa portée funéraire sans l’interpréter davantage.
theological_decisions:
- issue: Sens de « sommeil éternel »
  choice: Maintien de l’expression imagée
  alternative: « mourut » ou « entra dans le repos éternel »
  rationale: Le texte présente la mort comme un sommeil; une paraphrase explicative effacerait cette image et pourrait résoudre indûment sa tension théologique.
- issue: Titre divin
  choice: « le Dieu des dieux »
  alternative: « le Dieu suprême »
  rationale: La formulation source est conservée, sans transformer le génitif en interprétation abstraite.
translation_notes:
  register: Français international moderne, sobre et digne. La succession de verbes est maintenue pour respecter le rythme narratif du texte source; le sujet reste implicite après la première proposition, comme le permet naturellement le français.
