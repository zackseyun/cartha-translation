  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: fr
  text: 'Alors ils diront : « Les jours de ceux d’autrefois étaient nombreux — jusqu’à mille ans — et bons. Mais voici, les jours de notre vie, quand un homme vit longtemps, sont de soixante-dix ans, et, s’il est robuste, de quatre-vingts ans. Ils sont mauvais, et il n’y a aucune paix durant les jours de cette génération mauvaise. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለቀደምት
  choice: ceux d’autrefois
  rationale: Rend naturellement la désignation substantivée des anciens ou prédécesseurs sans préciser davantage leur identité.
- source_word: አመ፡ አብዝኀ፡ ሰብእ፡ ሐይወ
  choice: quand un homme vit longtemps
  rationale: Exprime la longévité envisagée par la proposition tout en conservant sa portée générale.
- source_word: ኀየለ
  choice: est robuste
  rationale: Traduit l’idée de force ou de vigueur physique dans un français courant et digne.
- source_word: እኩይ / እኪት
  choice: mauvais / mauvaise
  rationale: Conserve la répétition lexicale et le jugement négatif du texte source.
theological_decisions:
- issue: Rapport entre la brièveté de la vie et son caractère mauvais
  choice: 'Maintien de la simple coordination : « Ils sont mauvais »'
  alternative: « Pourtant, ils sont mauvais » ou une explicitation causale
  rationale: Le texte juxtapose les affirmations par une conjonction; il ne faut pas imposer une relation adversative ou causale absente.
- issue: Identité de « ceux d’autrefois »
  choice: Ne pas expliciter
  alternative: « les patriarches » ou « les premiers hommes »
  rationale: Le référent demeure général dans cette phrase; une identification doctrinale ou narrative plus précise serait interprétative.
translation_notes:
  register: Français international moderne, narratif et solennel sans archaïsme marqué. « Mais voici » conserve la force présentative de ወናሁ; les tirets rendent lisible l’incise « jusqu’à mille ans ».
