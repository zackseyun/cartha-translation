  source_fidelity: 'Le texte rend fidèlement les principales unités du guèze : l’opposition entre les longues vies bonnes des anciens (« ceux d’autrefois ») et la durée limitée, mauvaise et sans paix de la génération présente. « Quand un homme vit longtemps » exprime de façon générique la circonstance introduite par አመ et conserve le sens de longévité sans ajouter de contraste interprétatif.'
  naturalness: Le français est moderne, clair et suffisamment solennel. La construction « les jours de notre vie ... sont de soixante-dix ans » est légèrement littéraire, mais naturelle dans ce registre scripturaire. Les tirets encadrant « jusqu’à mille ans » facilitent la lecture sans altérer la structure.
