  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
translation:
  language: fr
  text: Ils commettront des violences en Israël et pécheront contre Jacob. Beaucoup de sang sera répandu sur la terre, et il n’y aura personne pour rassembler les morts ni personne pour les ensevelir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « personne pour rassembler et personne pour ensevelir ».'
    reason: Le texte source ne formule pas explicitement l’objet des deux verbes; la traduction précise « les morts » d’après le contexte.
lexical_decisions:
- source_word: ይገብሩ፡ ውስተ፡ እስራኤል፡ ሀከከ
  choice: Ils commettront des violences en Israël
  rationale: La tournure française naturelle « commettre des violences » rend le verbe « faire » avec le substantif désignant le trouble, le ravage ou la violence, tout en conservant ውስተ, « en/dans ».
- source_word: ዲበ፡ ያዕቆብ፡ ዐበሳ
  choice: pécheront contre Jacob
  rationale: « Pécher » rend le substantif verbal lié à la faute ou au péché; « contre » préserve la nuance de ዲበ, distincte de la préposition précédente.
- source_word: ይትከዐው፡ ደም፡ ብዙኅ
  choice: Beaucoup de sang sera répandu
  rationale: Formulation idiomatique et solennelle qui reproduit le passif et l’idée d’une grande effusion de sang.
- source_word: ዘያስተጋብእ
  choice: pour rassembler les morts
  rationale: Le verbe signifie « réunir, rassembler ». Le complément « les morts » est implicite dans ce contexte funéraire et nécessaire en français pour éviter de laisser le verbe sans objet.
- source_word: ዘይቀብር
  choice: pour les ensevelir
  rationale: « Ensevelir » rend précisément l’action de mettre les morts au tombeau, dans un registre digne et actuel.
theological_decisions:
- issue: Rapport de la faute à Jacob
  choice: pécher contre Jacob
  alternative: pécher en Jacob
  rationale: Le texte emploie ዲበ, « sur/contre », après avoir employé ውስተ, « en/dans », pour Israël. « Contre » maintient cette différence et la dimension relationnelle de la faute sans l’aplanir.
- issue: Objet du rassemblement et de l’ensevelissement
  choice: expliciter « les morts »
  alternative: « personne pour rassembler et personne pour ensevelir »
  rationale: Le contexte d’effusion de sang et le parallélisme avec l’ensevelissement indiquent qu’il s’agit des corps des morts. L’explicitation rend la phrase intelligible en français sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme final est conservé, avec une explicitation contextuelle signalée en note.
