  terminology: « le Seigneur », « serviteurs », « grande paix », « justes », « rendront grâce » et « pour les siècles des siècles » sont appropriés et cohérents avec le registre biblique français. « Se relèveront » conserve correctement l’ouverture sémantique du verbe sans imposer « ressusciteront ».
