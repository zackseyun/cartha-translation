  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: fr
  text: Alors le Seigneur guérira ses serviteurs, et ils se relèveront et verront une grande paix, et ils chasseront leurs ennemis ; les justes verront, rendront grâce et se réjouiront avec joie pour les siècles des siècles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'እማን
  choice: Alors
  rationale: Rend naturellement la transition temporelle et consécutive du contexte, sans l'alourdir par « en ce temps-là ».
- source_word: እግዚአብሔር
  choice: le Seigneur
  rationale: Équivalent français traditionnel et digne du titre divin guèze.
- source_word: ይፈውሶ
  choice: guérira
  rationale: Conserve le sens concret de guérison et la perspective future du passage.
- source_word: ይትነሥኡ
  choice: se relèveront
  rationale: Préserve l'idée de se lever ou de se relever sans imposer ici une interprétation explicite en termes de résurrection.
- source_word: ሰላመ፡ ዐቢየ
  choice: une grande paix
  rationale: Traduction directe du substantif et de son qualificatif.
- source_word: ይሰድዱ
  choice: chasseront
  rationale: Exprime l'action de repousser ou mettre en fuite leurs ennemis.
- source_word: ያአኵቱ
  choice: rendront grâce
  rationale: Rend l'idée de louer ou remercier dans un registre religieux naturel, tout en conservant la coordination verbale.
- source_word: እስከ፡ ለዓለመ፡ ዓለም
  choice: pour les siècles des siècles
  rationale: Formule française consacrée qui reflète l'expression emphatique de durée perpétuelle.
- source_word: በፍሥሐ
  choice: avec joie
  rationale: Conserve l'élément final explicite, même si « se réjouiront » exprime déjà une notion voisine.
theological_decisions:
- issue: Portée de « se relèveront »
  choice: se relèveront
  alternative: ressusciteront
  rationale: Le verbe peut évoquer le fait de se lever et éventuellement une restauration plus forte ; la traduction retenue préserve cette ouverture sans préciser une résurrection que le verset n'explicite pas à lui seul.
- issue: Référent de « les justes le verront »
  choice: le verront
  alternative: verront cela
  rationale: 'Le pronom français maintient la relative indétermination de ce que les justes voient : la grande paix, la délivrance ou l''ensemble des événements annoncés.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation répartit la longue chaîne de coordinations sans effacer sa progression. La répétition « se réjouiront avec joie » est conservée afin de rendre l'intensification du texte source.
