  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: fr
  text: Tous les hommes de sa maison le pleurèrent pendant quarante jours, de même qu’Isaac, Ismaël, tous leurs fils et tous les fils de Qetoura, chacun là où il se trouvait. Et les jours de deuil pour Abraham prirent fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበከይዎ
  choice: le pleurèrent
  rationale: Le verbe exprime ici les pleurs funèbres dirigés vers Abraham; le pronom objet est rendu explicitement.
- source_word: አርብዓ፡ መዋዕለ
  choice: pendant quarante jours
  rationale: Rend naturellement en français la durée indiquée par «quarante jours».
- source_word: ኵሎሙ፡ ሰብአ፡ ቤቱ
  choice: tous les hommes de sa maison
  rationale: Traduction formelle de l’expression désignant les membres masculins ou les gens de sa maisonnée, sans l’élargir silencieusement à toute la maison.
- source_word: በመካኖሙ
  choice: chacun là où il se trouvait
  rationale: Préserve l’idée distributive de «dans leurs lieux» tout en produisant une formulation française intelligible.
- source_word: መዋዕለ፡ ብካዩ፡ አብርሃም
  choice: les jours de deuil pour Abraham
  rationale: Le contexte indique que les autres pleurent Abraham; «deuil» évite de faire d’Abraham le sujet des pleurs.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La longue coordination du guèze est légèrement restructurée en deux phrases pour la lisibilité, sans supprimer aucun groupe de participants ni la conclusion temporelle.
