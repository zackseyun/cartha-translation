  yaml_path: translation/extra_canonical/jubilees/023/011.yaml
  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
translation:
  language: fr
  text: Car Abraham fut irréprochable dans toute sa conduite avec le SEIGNEUR, et il était agréable dans la justice tous les jours de sa vie. Voici, il n’acheva pas quatre jubilés au cours de sa vie, jusqu’à ce qu’il vieillît à cause du mal[b] et fût rassasié de jours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « devant la face du mal » ; autre traduction possible : « en présence du mal ».'
    reason: La traduction principale retient la valeur causale appropriée au contexte, tandis que la note conserve la formulation concrète et l’ambiguïté possible de l’expression guèze.
  - marker: c
    text: 'Expression idiomatique signifiant qu’il mourut après une longue vie ; autre traduction : « il fut comblé de jours ».'
    reason: La note explique l’idiome biblique tout en maintenant Abraham comme sujet, conformément au verbe source.
lexical_decisions:
- source_word: ፍጹም (fəṣṣum)
  choice: irréprochable
  rationale: Dans ce contexte moral, le terme désigne l’intégrité ou l’accomplissement de la conduite plutôt qu’une perfection absolue au sens philosophique.
- source_word: በኵሉ ምግባሪሁ (bakʷəllu məgbārihu)
  choice: dans toute sa conduite
  rationale: Le nom peut viser les actes ou la manière d’agir; «conduite» rend naturellement l’ensemble de la vie morale.
- source_word: ምስለ እግዚአብሔር (məsla ʾəgziʾabəḥer)
  choice: avec le SEIGNEUR
  rationale: La préposition ምስለ signifie normalement «avec»; la traduction conserve cette relation sans la remplacer par «devant».
- source_word: ይሠምር በጽድቅ (yəsämmər baṣədq)
  choice: il lui fut agréable par sa justice
  rationale: Cette formulation conserve l’idée d’être agréable et rattache explicitement cette qualité à la justice, tout en donnant en français le complément implicite attendu.
- source_word: ኢፈጸመ አርባዕተ ኢዮቤልውሳተ (ʾifäṣṣämä ʾarbaʿta ʾiyobelwusāta)
  choice: il n’acheva pas quatre jubilés
  rationale: 'Rendu formel de l’affirmation chronologique: Abraham mourut avant d’atteindre quatre cycles jubilaires complets.'
- source_word: ረሰአ (rasaʾa)
  choice: il vieillit
  rationale: Le verbe exprime ici l’entrée dans la vieillesse.
- source_word: ቅድመ ገጸ እኩይ (qədma gaṣa ʾəkuy)
  choice: à cause du mal
  rationale: L’expression littérale «devant la face du mal» peut fonctionner causalement; le contexte du chapitre relie le raccourcissement de la vie au mal.
- source_word: ጸገበ መዋዕሊሁ (ṣagaba mawāʿlihu)
  choice: fut rassasié de jours
  rationale: Le verbe signifie «être rassasié, rempli»; la formule conserve l’idiome biblique appliqué à Abraham.
theological_decisions:
- issue: Nature de la «perfection» d’Abraham
  choice: «irréprochable dans toute sa conduite»
  alternative: «parfait dans toutes ses œuvres»
  rationale: Le choix évite de transformer une appréciation de fidélité morale en affirmation de perfection métaphysique, sans diminuer la force du texte.
- issue: Rapport entre la vieillesse et le mal
  choice: 'lecture causale: «à cause du mal»'
  alternative: 'lecture spatiale ou littérale: «en présence du mal»'
  rationale: La valeur causale convient à l’idiome guèze et au contexte, mais la lecture littérale demeure signalée en note afin de préserver l’ambiguïté.
- issue: Expression finale sur les jours d’Abraham
  choice: «fut rassasié de jours»
  alternative: «ses jours furent accomplis»
  rationale: La première formulation garde Abraham comme sujet et reproduit l’image de satiété présente dans le verbe source.
translation_notes:
  register: Français international moderne, digne et lisible. «SEIGNEUR» représente le titre divin; le vocabulaire biblique «jubilés» et «rassasié de jours» est conservé, avec notes explicatives pour les expressions susceptibles d’être obscures.
