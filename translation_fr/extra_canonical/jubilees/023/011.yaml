    issue: Note a inexacte et alternative trompeuse
    rationale: 'Le texte source porte ምስለ (« avec ») suivi du titre እግዚአብሔር, rendu dans le texte par « le SEIGNEUR ». La note « littéralement : avec Dieu » est moins exacte que le texte, et « devant le Seigneur » ne constitue pas ici une alternative textuellement équivalente.'
  - severity: low
    issue: La ponctuation finale reformule la relation temporelle
    rationale: Les deux-points font de « il vieillit... et fut rassasié de jours » une explication autonome. « jusqu’à ce qu’il... » préserve mieux la liaison de እስከ አመ, tout en gardant la formulation quelque peu inhabituelle de la source.
  - severity: low
    issue: « par sa justice » est plus causal que le complément source
    rationale: በጽድቅ signifie plus directement « dans la justice » ou « en justice ». Cette dernière formulation évite de préciser indûment que la justice est la cause instrumentale de l’agrément.
  revised_text: Car Abraham fut irréprochable dans toute sa conduite avec le SEIGNEUR, et il était agréable dans la justice tous les jours de sa vie. Voici, il n’acheva pas quatre jubilés au cours de sa vie, jusqu’à ce qu’il vieillît à cause du mal[b] et fût rassasié de jours[c].
