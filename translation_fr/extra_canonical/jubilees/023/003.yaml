  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
translation:
  language: fr
  text: 'Jacob se réveilla de son sommeil et voici qu’Abraham était devenu froid comme la glace. Il dit : « Père, père ! » Mais personne ne parla, et il comprit qu’Abraham était mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነቅሀ፡ ያዕቆብ፡ እምንዋሙ፡
  choice: Jacob se réveilla de son sommeil
  rationale: Rend directement la séquence guèze exprimant le réveil de Jacob hors de son sommeil, dans un français naturel et digne.
- source_word: ቈረ፡ አብርሃም፡ ከመ፡ ባረድ፡
  choice: Abraham était devenu froid comme la glace
  rationale: Conserve explicitement la comparaison introduite par ከመ (« comme »). ባረድ peut évoquer la glace ou la grêle; « comme la glace » exprime clairement ici le froid du corps sans supprimer l’image du texte source.
- source_word: ወአልቦ፡ ዘነበበ፡
  choice: Mais personne ne répondit
  rationale: Littéralement, la tournure indique qu’il n’y avait personne qui parlait. Dans ce contexte d’appel répété, « personne ne répondit » transmet naturellement la valeur pragmatique sans altérer le sens.
- source_word: ወአእመረ፡ ከመ፡ ሞተ።
  choice: et il comprit qu’il était mort
  rationale: Le verbe signifie savoir ou reconnaître; « comprit » convient au constat que Jacob tire de l’absence de réponse et du froid du corps.
