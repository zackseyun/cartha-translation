  choice: trois jubilés et quatre semaines d’années
  rationale: 'Conserve le mode de calcul calendaire du texte guèze : trois périodes de quarante-neuf ans et quatre périodes de sept ans, totalisant cent soixante-quinze ans.'
- source_word: ወፈጸመ፡ መዋዕለ፡ ሕይወቱ
