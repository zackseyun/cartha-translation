  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: fr
  text: Et toi, ordonne aux enfants d’Israël qu’ils gardent le signe de l’alliance pour toutes leurs générations, comme une ordonnance perpétuelle, et ils ne seront pas déracinés du pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: Et toi
  rationale: Rend la conjonction et le pronom emphatique sans ajouter l’idée temporelle de « maintenant », absente du texte.
- source_word: ለውሉደ፡ እስራኤል
  choice: aux enfants d’Israël
  rationale: Formulation biblique claire et fidèle au sens littéral de « fils/enfants d’Israël ».
- source_word: ትእምርተ፡ ኪዳን
  choice: le signe de l’alliance
  rationale: Conserve les termes concrets « signe » et « alliance » ainsi que l’article défini implicite dans le contexte.
- source_word: ለትውልዶሙ
  choice: de génération en génération
  rationale: Expression française naturelle qui traduit la continuité à travers leurs générations.
- source_word: ለሥርዐት፡ ዘለዓለም
  choice: comme une prescription perpétuelle
  rationale: « Prescription » exprime une règle établie; « perpétuelle » rend la durée indéfinie de l’ordonnance.
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር
  choice: afin qu’ils ne soient pas déracinés du pays
  rationale: Le passif et l’image de l’arrachement sont préservés; « pays » convient au territoire d’Israël dans ce contexte.
theological_decisions:
- issue: Lien entre l’observance et l’absence de déracinement
  choice: afin qu’ils ne soient pas déracinés du pays
  alternative: et ils ne seront pas déracinés du pays
  rationale: La forme guèze peut exprimer une conséquence visée après l’impératif. « Afin que » rend cette articulation sans transformer la proposition en promesse absolue indépendante; la lecture coordonnée demeure toutefois possible.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « enfants d’Israël » maintient la couleur biblique, tandis que « prescription perpétuelle » reste compréhensible sans technicisme excessif.
