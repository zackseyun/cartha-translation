  text: 'And the Lord said to Abraham, “And as for you, keep my covenant, you and your seed after you. And circumcise every male among you, and circumcise the flesh of your foreskins, and it shall be a sign of an everlasting ordinance between me and you. And a son of eight days you shall circumcise—every male among you, one born in the house and one bought with your gold [or ''money''] from any sons of foreigners who are not from your seed. The one born in your house must surely be circumcised, and the one whom you bought with your silver must be circumcised; and my covenant shall be in your flesh as an everlasting ordinance. But an uncircumcised male, one whose foreskin''s flesh is not circumcised on the eighth day, that person shall be cut off from his kin, because he has broken my covenant.” And the Lord said to Abraham, “As for Sarai your wife, you shall no longer call her name Sarai, for Sarah is her name. And I will bless her, and from her I will give you a son; and I will bless him,
    and he shall become a nation, and kings of nations shall come from him.” And Abraham fell on his face and rejoiced, and he said in his heart, “Shall a son be born to one a hundred years old? And shall Sarah, who is ninety years old, give birth?” And Abraham said to the Lord, “If only Ishmael might live before you!” And God said, “Yes, and Sarah shall bear you a son, and you shall call his name Isaac; and I will establish my covenant with him, an everlasting covenant, and with his seed after him. And concerning Ishmael also, I have heard you. Behold, I will bless him and make him fruitful and multiply him very greatly; he shall father twelve princes, and I will make him into a great nation. But my covenant I will establish with Isaac, whom Sarah shall bear to you at this time in the next year.” And he finished speaking with him, and the Lord went up from Abraham. And Abraham did as the Lord had said to him, and he took Ishmael his son and all those born in his house and those bought with
    silver, every male in his house, and circumcised the flesh of their foreskins. And on that very day Abraham was circumcised, and all the men of his house—those born in his house—and all those bought with silver from the sons of foreigners were circumcised with him. This is a statute for all the generations forever: there is no delaying of days, and no omission of even one day from eight days, for it is an everlasting ordinance, ordained and written on the heavenly tablets. And everyone who is born whose flesh of foreskin is not circumcised on the eighth day does not belong to the children of the covenant that the Lord made with Abraham, for he belongs to the children of destruction; and there is no sign on him that he belongs to the Lord, but he is for destruction, and for being destroyed from the earth, and for being rooted out from the earth, because he has broken the covenant of the Lord our God.'
translation:
  language: fr
  text: 'Le Seigneur dit à Abraham : « Quant à toi, garde mon alliance, toi et ta descendance après toi. Vous circoncirez tout homme parmi vous : vous circoncirez la chair de votre prépuce, et ce sera le signe d’une prescription perpétuelle entre moi et vous. À l’âge de huit jours, tout garçon parmi vous sera circoncis, qu’il soit né dans la maison ou acheté avec ton or[a] auprès de fils d’étrangers qui ne sont pas de ta descendance. Celui qui est né dans ta maison devra être circoncis, et celui que tu as acheté avec ton or devra être circoncis. Ainsi, mon alliance sera dans votre chair comme une prescription perpétuelle. Mais l’homme incirconcis, celui dont la chair du prépuce n’aura pas été circoncise le huitième jour, sera retranché de sa parenté, car il a rompu mon alliance. »


    Le Seigneur dit à Abraham : « Saraï, ta femme, tu ne l’appelleras plus Saraï, car son nom est Sara. Je la bénirai et, par elle, je te donnerai un fils. Je le bénirai : il deviendra un peuple, et des rois de nations sortiront de lui. »


    Abraham tomba face contre terre et se réjouit. Il se dit dans son cœur : « Un fils naîtra-t-il à un homme de cent ans ? Et Sara, âgée de quatre-vingt-dix ans, enfantera-t-elle ? » Abraham dit au Seigneur : « Si seulement Ismaël pouvait vivre devant toi ! »


    Dieu dit : « Oui, Sara te donnera un fils, et tu l’appelleras Isaac. J’établirai mon alliance avec lui comme une alliance perpétuelle, ainsi qu’avec sa descendance après lui. Quant à Ismaël, je t’ai entendu. Voici, je le bénirai, je le rendrai fécond et je le multiplierai à l’extrême. Il engendrera douze princes, et je ferai de lui un grand peuple. Mais mon alliance, je l’établirai avec Isaac, que Sara te donnera à cette même époque, l’année prochaine. »


    Lorsqu’il eut fini de parler avec lui, le Seigneur s’éleva au-dessus d’Abraham. Abraham fit ce que le Seigneur lui avait dit. Il prit Ismaël, son fils, tous ceux qui étaient nés dans sa maison et tous ceux qu’il avait achetés avec de l’or, tous les hommes de sa maison, et il circoncit la chair de leur prépuce. Ce jour-là même, Abraham fut circoncis, ainsi que tous les hommes de sa maison — ceux qui y étaient nés — et tous ceux qui avaient été achetés avec de l’or auprès de fils d’étrangers ; ils furent circoncis avec lui.


    C’est une règle pour toutes les générations, à jamais : il ne faut ni différer les jours ni omettre ne serait-ce qu’un seul des huit jours, car c’est une prescription perpétuelle, établie et inscrite sur les tablettes célestes. Quiconque naît et dont la chair du prépuce n’est pas circoncise le huitième jour n’appartient pas aux enfants de l’alliance que le Seigneur a conclue avec Abraham, car il appartient aux enfants de la perdition. Il ne porte aucun signe montrant qu’il appartient au Seigneur ; il est voué à la perdition, à être détruit de la terre et à en être déraciné, car il a rompu l’alliance du Seigneur notre Dieu.


    [a] Ou « ton argent », au sens de tes moyens de paiement ; le terme guèze signifie d’abord « or ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton argent », au sens de tes moyens de paiement ; le terme guèze signifie d’abord « or ».
    reason: Le substantif guèze ወርቅ désigne littéralement l’or, mais peut, par extension, évoquer l’argent servant au paiement.
lexical_decisions:
- source_word: ወርቅ (warq)
  choice: or
  rationale: Le mot guèze désigne proprement l’or, éventuellement l’argent au sens général de moyens de paiement. « Or » conserve le choix lexical particulier du texte transmis, au lieu d’importer « argent » depuis Genèse 17.
- source_word: ተፈሥሐ (tafaśśəḥa)
  choice: se réjouit
  rationale: Le verbe exprime la joie. Cette traduction suit le guèze plutôt que de substituer le « rire » de la tradition hébraïque de Genèse 17.
- source_word: መላእክተ (malāʾəkta)
  choice: princes
  rationale: Dans ce contexte dynastique, le terme désigne des chefs ou princes issus d’Ismaël ; « anges » serait un contresens contextuel malgré la parenté lexicale.
- source_word: ትሤረር (təsērar)
  choice: sera retranché
  rationale: Formule juridique d’exclusion de la parenté, rendue dans un français biblique clair et courant.
- source_word: ጽላት፡ ሰማይ (ṣəlāt samāy)
  choice: tablettes célestes
  rationale: Expression caractéristique du livre des Jubilés, conservée formellement.
theological_decisions:
- issue: Référent des pronoms après la promesse faite à Sara
  choice: '« Je le bénirai : il deviendra un peuple, et des rois de nations sortiront de lui. »'
  alternative: '« Je la bénirai : elle deviendra des peuples, et des rois de nations sortiront d’elle. »'
  rationale: Le guèze emploie explicitement des formes masculines renvoyant au fils promis. La traduction ne les harmonise pas avec le texte massorétique de Genèse 17:16.
- issue: Statut du non-circoncis
  choice: Conserver la succession « voué à la perdition, à être détruit de la terre et à en être déraciné »
  alternative: Fusionner ou atténuer les trois formulations
  rationale: Le texte source accumule trois expressions distinctes. Leur tension et leur sévérité sont préservées sans réduction doctrinale.
- issue: Nature de la prescription
  choice: « prescription perpétuelle » et « règle » selon le contexte
  alternative: « sacrement », « loi rituelle » ou terminologie confessionnelle
  rationale: Ces termes rendent la portée normative du guèze sans importer une classification théologique ultérieure.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes inutiles. Les répétitions juridiques et les parallélismes du texte ont été maintenus, tandis que la syntaxe a été légèrement fluidifiée pour une lecture publique naturelle.
