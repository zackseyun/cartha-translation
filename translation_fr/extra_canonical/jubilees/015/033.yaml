base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/033.yaml
  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
translation:
  language: fr
  text: 'Et maintenant, je te déclare que les fils d’Israël ne respecteront pas fidèlement cette prescription[a] : ils ne circonciront pas leurs fils conformément à toute la loi, car, lors de la circoncision de leurs fils, ils laisseront subsister une partie de la chair qui devait être retranchée. Et tous les fils de Bélial laisseront leurs fils incirconcis, tels qu’ils sont nés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « agiront faussement à l’égard de cette prescription ».'
    reason: Le verbe guèze peut mettre l’accent sur la fausseté ou la tromperie; le contexte permet aussi de comprendre qu’ils n’observeront pas fidèlement la prescription.
lexical_decisions:
- source_word: ይሐስዉ
  choice: ne respecteront pas fidèlement
  rationale: Le verbe évoque l’action fausse ou trompeuse. Dans ce contexte juridique, cette formulation naturelle exprime l’infidélité à la prescription sans réduire le sens au simple mensonge verbal.
- source_word: ሥርዐት
  choice: prescription
  rationale: Le terme désigne ici une règle ou ordonnance établie, à savoir la circoncision.
- source_word: በከመ፡ ኵሉ፡ ሕግ
  choice: conformément à toute la loi
  rationale: Rend le distributif ኵሉ, « toute », sans ajouter le démonstratif « cette », absent du texte source.
- source_word: መተርፋነ
  choice: laisseront subsister une partie
  rationale: Exprime l’idée d’un reste de chair laissé lors d’une circoncision incomplète.
- source_word: ውሉደ፡ ቤልአር
  choice: les fils de Bélial
  rationale: Conserve l’appellation traditionnelle du texte, qui désigne les personnes rattachées au mal ou à Bélial.
- source_word: ዘእንበለ፡ ክስበት
  choice: incirconcis
  rationale: Équivalent français direct de « sans circoncision ».
theological_decisions:
- issue: Nature de la faute attribuée à Israël
  choice: ne respecteront pas fidèlement cette prescription
  alternative: agiront faussement à l’égard de cette prescription
  rationale: Le contexte montre une observance défectueuse plutôt qu’une simple déclaration mensongère, tout en maintenant dans la note la valeur littérale de tromperie.
- issue: Sens de la chair laissée lors de la circoncision
  choice: la chair qui devait être retranchée
  alternative: la chair de leur circoncision
  rationale: La formulation explicite le référent anatomique implicite et évite en français l’expression obscure « chair de leur circoncision », sans modifier l’accusation de circoncision incomplète.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement explicitée pour rendre intelligible la circoncision incomplète, tandis que « fils de Bélial » est conservé comme désignation traditionnelle. Le marqueur [a] figure dans le texte principal.
