  yaml_path: translation/extra_canonical/jubilees/015/032.yaml
  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
translation:
  language: fr
  text: Quant à Israël, il ne l’a livré ni confié à aucun ange ni à aucun esprit, car lui seul est leur souverain. Il les gardera et les réclamera[a] des mains de ses anges, de ses esprits et de toutes ses puissances, afin de les garder et de les bénir, pour qu’ils soient à lui et qu’il soit à eux, dès maintenant et pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les recherchera auprès de » ou « les redemandera à ». Litt. : « les recherchera des mains de ».'
    reason: Le verbe guèze peut signifier chercher, rechercher, réclamer ou exiger. Avec « de la main de », il peut exprimer une revendication ou une demande de restitution.
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ
  choice: il ne l’a livré ni confié
  rationale: Rend les deux verbes guèzes et leur négation commune, tout en explicitant naturellement en français qu’Israël est ce qui n’a pas été remis à une puissance intermédiaire.
- source_word: መኰንኖሙ
  choice: leur souverain
  rationale: Exprime l’autorité dirigeante exclusive de Dieu dans un registre digne et courant.
- source_word: የዐቅቦሙ / ይዕቀቦሙ
  choice: les gardera / les garder
  rationale: Conserve la répétition du même verbe et sa nuance de protection vigilante.
- source_word: ይትኀሠሦሙ
  choice: les réclamera
  rationale: Dans la construction avec « de la main de », le verbe évoque le fait de rechercher, revendiquer ou redemander Israël aux puissances responsables; « réclamer » restitue cette idée sans produire un idiome français artificiel.
- source_word: ኵሉ፡ ትእዛዝያኒሁ
  choice: toutes ses autorités
  rationale: Suit le sens de puissances ou autorités relevant de Dieu, sans les identifier plus précisément que le texte.
- source_word: ይኩንዎ፡ ሎቱ፡ ወውእቱ፡ ይኩኖሙ፡ ሎሙ
  choice: qu’ils soient à lui et qu’il soit à eux
  rationale: Préserve la formule réciproque d’appartenance et sa portée d’alliance.
theological_decisions:
- issue: Gouvernement direct de Dieu sur Israël
  choice: Israël n’est livré ni confié à aucun ange ou esprit, puisque Dieu seul est son souverain.
  alternative: Dieu n’a nommé aucun ange ou esprit sur Israël.
  rationale: Le choix retenu conserve les deux verbes du guèze et la tension théologique entre le gouvernement direct de Dieu et l’activité de ses anges, esprits et autorités.
- issue: Action de Dieu envers les êtres célestes responsables
  choice: Il réclamera Israël à ses anges, à ses esprits et à ses autorités.
  alternative: Il leur demandera compte d’Israël.
  rationale: « Réclamera » garde Israël comme objet explicite du verbe et évite d’ajouter une notion de reddition de comptes qui, bien que contextuellement plausible, n’est pas formulée directement.
translation_notes:
  register: Français international moderne, fluide et solennel. La répétition de « garder » ainsi que la formule d’appartenance réciproque sont maintenues. Les compléments « à ses anges, à ses esprits » rendent naturellement l’idiome source « de la main de » sans imposer au corps du texte une tournure étrangère au français courant.
