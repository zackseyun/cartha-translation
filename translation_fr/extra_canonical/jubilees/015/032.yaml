revisions:
- from: Quant à Israël, il ne l’a livré ni confié à aucun ange ni à aucun esprit, car lui seul est leur souverain. Il les gardera et les réclamera[a] à ses anges, à ses esprits et à toutes ses autorités, afin de les garder et de les bénir, pour qu’ils soient à lui et qu’il soit à eux, dès maintenant et pour toujours.
  to: Quant à Israël, il ne l’a livré ni confié à aucun ange ni à aucun esprit, car lui seul est leur souverain. Il les gardera et les réclamera[a] des mains de ses anges, de ses esprits et de toutes ses puissances, afin de les garder et de les bénir, pour qu’ils soient à lui et qu’il soit à eux, dès maintenant et pour toujours.
  rationale: La révision restitue explicitement l’image répétée « de la main de » au moyen de « des mains de », tout en gardant un français courant. Elle remplace « autorités » par « puissances », terme plus naturel dans cette énumération céleste et suffisamment ouvert pour préserver l’ambiguïté du source.
