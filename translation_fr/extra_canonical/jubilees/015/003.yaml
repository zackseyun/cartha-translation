  text: And the Lord appeared to Abram and said to him, “I am God Shaddai; be pleasing before me, and be blameless.”
translation:
  language: fr
  text: 'Le Seigneur apparut à Abram et lui dit : « Je suis Dieu Shaddaï. Vis d’une manière qui m’est agréable et sois irréprochable. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስተርአዮ
  choice: apparut
  rationale: Rend directement le verbe guèze d’apparition, avec le Seigneur comme sujet et Abram comme destinataire.
- source_word: አምላክ፡ ሰዳይ
  choice: Dieu Shaddaï
  rationale: Conserve le titre divin sous sa forme translittérée, puisque sa portée exacte demeure discutée et qu’une traduction explicative réduirait cette ambiguïté.
- source_word: አሥምር፡ ቅድሜየ
  choice: Vis d’une manière qui m’est agréable
  rationale: Le verbe guèze signifie ici être ou agir d’une manière agréable, conformément à la tradition textuelle reflétée par le guèze; « marche devant moi » harmoniserait à tort avec l’hébreu de Genèse 17.1.
- source_word: ኩን፡ ፍጹመ
  choice: sois irréprochable
  rationale: Exprime l’idée d’intégrité ou de conduite sans reproche dans un français naturel, sans suggérer une perfection métaphysique.
theological_decisions:
- issue: Rapport avec Genèse 17.1
  choice: Maintenir « d’une manière qui m’est agréable »
  alternative: « marche devant moi »
  rationale: La traduction suit le texte guèze propre à ce passage et préserve son lien avec la tradition grecque, au lieu de l’aligner silencieusement sur le texte massorétique de la Genèse.
- issue: Sens du titre Shaddaï
  choice: Ne pas traduire le titre
  alternative: « le Tout-Puissant »
  rationale: La signification étymologique et la valeur précise du titre ne sont pas assez certaines pour imposer « Tout-Puissant ».
translation_notes:
  register: Français international moderne, digne et accessible. « Vis d’une manière qui m’est agréable » évite la tournure peu idiomatique « sois agréable devant moi » tout en restant fidèle au sens verbal du guèze.
