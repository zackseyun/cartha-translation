  yaml_path: translation/extra_canonical/jubilees/015/008.yaml
  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: fr
  text: Je te rendrai très grand, je ferai de toi des nations, et des rois sortiront de toi. J’établirai mon alliance entre moi et toi, ainsi qu’entre moi et ta descendance après toi, de génération en génération, comme une ordonnance perpétuelle, afin que je sois ton Dieu et le Dieu de ta descendance après toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዐብየከ፡ ጥቀ
  choice: Je te rendrai extrêmement fécond
  rationale: Le verbe exprime l’idée de faire croître ou multiplier; dans ce contexte de descendance et de nations, «rendre fécond» restitue naturellement le sens.
- source_word: አሕዛብ
  choice: des nations
  rationale: Le pluriel désigne ici des peuples ou nations issus d’Abraham; «nations» conserve le lien avec la tradition de Genèse 17.
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Le terme signifie littéralement «semence», mais «descendance» est le rendu français naturel pour une lignée humaine, sans imposer un singulier individuel.
- source_word: በትዝምዶሙ
  choice: de génération en génération
  rationale: Cette formulation idiomatique exprime la succession au fil de leurs générations.
- source_word: ሥርዓት፡ ዘለዓለም
  choice: une prescription éternelle
  rationale: «Prescription» conserve la portée normative de ሥርዓት, plutôt que de l’assimiler simplement à l’alliance elle-même.
theological_decisions:
- issue: Portée collective ou individuelle de «descendance»
  choice: Employer le collectif «descendance»
  alternative: Employer «tes descendants» ou «ta semence»
  rationale: Le collectif français préserve l’amplitude du terme source et évite de trancher une éventuelle lecture théologique du singulier.
- issue: Relation entre l’alliance et la prescription éternelle
  choice: Rattacher «comme une prescription éternelle» à l’établissement de l’alliance
  alternative: Traduire «pour une alliance éternelle»
  rationale: Le texte guèze présente explicitement un terme normatif distinct; le conserver évite d’aplanir la formulation.
- issue: Formule divine finale
  choice: «afin d’être ton Dieu et celui de ta descendance»
  alternative: «pour que je sois Dieu pour toi et pour ta descendance»
  rationale: Le choix retenu est idiomatique en français tout en conservant la relation d’alliance exprimée par le texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe garde le parallélisme solennel du passage, tout en évitant les archaïsmes et le calque littéral «semence».
