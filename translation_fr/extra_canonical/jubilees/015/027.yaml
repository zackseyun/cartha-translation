  text: For all the angels of the presence and all the angels of holiness—thus was their creation from the day of their creation—and before the angels of the presence and the angels of holiness he sanctified Israel, that they might be with him and with his holy angels.
translation:
  language: fr
  text: Car tous les anges de la Présence et tous les anges de sainteté — telle fut leur création[a] dès le jour où ils furent créés —, et devant[b] les anges de la Présence et les anges de sainteté, il sanctifia Israël, afin qu’ils soient avec lui et avec ses saints anges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « telle était leur nature » ; le terme peut désigner leur création ou leur constitution.
    reason: ambiguïté lexicale du nom guèze ፍጥረቶሙ
  - marker: b
    text: Ou « en face des » ; le terme peut aussi exprimer l’idée d’être vis-à-vis de quelqu’un.
    reason: ambiguïté spatiale de አንጻር
lexical_decisions:
- source_word: መላእክተ፡ ገጽ
  choice: les anges de la Présence
  rationale: Littéralement « anges de la face » ; « anges de la Présence » exprime naturellement en français leur présence devant Dieu et correspond au titre traditionnel.
- source_word: መላእክተ፡ ቅዳሴ
  choice: les anges de sainteté
  rationale: Rend le complément nominal « de sainteté » sans transformer inutilement l’expression en simple adjectif.
- source_word: ፍጥረቶሙ
  choice: leur création
  rationale: Le guèze emploie ici un nom pouvant désigner la création ou la nature constitutive, plutôt qu’une forme verbale explicite.
- source_word: ወአንጻሮሙ
  choice: et devant
  rationale: « Devant » convient au contexte cérémoniel tout en conservant l’idée spatiale de vis-à-vis portée par le terme.
- source_word: ቀደሶ፡ ለእስራኤል
  choice: il sanctifia Israël
  rationale: Traduction directe du verbe causatif de sainteté, avec Israël comme objet.
theological_decisions:
- issue: Rapport entre Israël et les anges saints
  choice: afin qu’ils soient avec lui et avec ses saints anges
  alternative: afin qu’ils lui appartiennent, avec ses saints anges
  rationale: Le texte exprime explicitement le fait d’être « avec » Dieu et ses anges ; la traduction évite de préciser davantage la nature de cette association.
- issue: Sens de la formule sur la création des anges
  choice: telle fut leur création
  alternative: telle était leur nature
  rationale: La formulation nominale respecte le guèze et ne décide pas si l’accent porte principalement sur l’acte créateur ou sur la condition créée ; l’autre possibilité est signalée en note.
translation_notes:
  register: Français moderne, soutenu mais accessible. Les tirets isolent la proposition sur la création des anges sans lisser la syntaxe dense du verset. La majuscule à « Présence » marque un titre angélique ; « sainteté » reste en minuscule comme complément de qualité.
