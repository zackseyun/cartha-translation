  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
translation:
  language: fr
  text: 'Une grande colère venant du Seigneur s’abattra sur les descendants d’Israël, parce qu’ils ont abandonné son alliance, se sont détournés de sa parole, l’ont provoqué et ont blasphémé, en ne mettant pas en pratique la prescription de cette loi. En effet, ils se sont rendus semblables aux nations, voués à être déracinés et anéantis de la terre. Dès lors, il n’y aura plus pour eux ni pardon ni rémission : ils ne seront ni pardonnés ni acquittés de tout le péché de cet égarement éternel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de tout ce péché, cet égarement éternel » ; le rapport grammatical entre « péché » et « égarement » est condensé dans le texte source.'
    reason: Préserver l’ambiguïté syntaxique de la proposition finale sans omettre le mot explicite « péché ».
lexical_decisions:
- source_word: መዓት
  choice: colère
  rationale: Le terme désigne ici la colère punitive divine; « colère » reste naturel et conserve la force judiciaire du contexte.
- source_word: ውሉደ፡ እስራኤል
  choice: descendants d’Israël
  rationale: Rend l’expression filiale collective en français moderne sans la limiter aux enfants au sens d’âge.
- source_word: ለስስሎ
  choice: être déracinés
  rationale: Le verbe exprime un arrachement ou déracinement; ce choix préserve l’image forte du jugement depuis la terre.
- source_word: ኅድገተ፡ ወስርየተ
  choice: pardon ni rémission
  rationale: Maintient les deux termes proches mais distincts du texte source, malgré leur recouvrement sémantique.
- source_word: ስሕተት
  choice: égarement
  rationale: « Égarement » exprime une déviation persistante plutôt qu’une simple erreur intellectuelle.
theological_decisions:
- issue: Nature et origine du jugement
  choice: « une grande colère venant du Seigneur »
  alternative: « la grande colère du Seigneur »
  rationale: La formulation garde explicitement l’origine divine indiquée par እምኀበ sans préciser davantage le mode d’action.
- issue: Double expression finale du pardon
  choice: « ni pardonnés ni acquittés »
  alternative: « ni pardonnés ni absous »
  rationale: Le doublet français reflète les deux verbes du texte sans imposer un vocabulaire confessionnel ou sacramentel.
- issue: Rapport entre « péché » et « égarement »
  choice: « tout le péché de cet égarement éternel »
  alternative: « tout ce péché, cet égarement éternel »
  rationale: La construction génitivale est conservée dans le texte principal; la syntaxe compacte permet toutefois une lecture en apposition, signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les parallélismes et doublets judiciaires du texte sont maintenus; la ponctuation clarifie les longues chaînes de propositions sans résoudre les tensions du texte source.
