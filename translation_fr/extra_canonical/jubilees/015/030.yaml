  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
translation:
  language: fr
  text: Car le Seigneur n’a fait approcher de lui ni Ismaël, ni ses fils, ni ses frères, ni Ésaü, et il ne les a pas choisis, bien qu’ils soient descendants d’Abraham, parce qu’il les connaissait ; mais il a choisi Israël pour qu’il soit son peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢያቅረቦ፡ ኀቤሁ
  choice: n’a fait approcher de lui
  rationale: Rend directement le causatif négatif et le mouvement vers Dieu, sans réduire l’expression à un simple rejet.
- source_word: ውሉደ፡ አብርሃም
  choice: descendants d’Abraham
  rationale: Dans ce contexte collectif, « descendants » est plus naturel et précis que « enfants » en français moderne.
- source_word: አእመሮሙ
  choice: il les connaissait
  rationale: Préserve le sens littéral et l’éventuelle portée de connaissance préalable sans expliciter leur caractère ou leurs actes, éléments absents du texte.
- source_word: ሕዝበ
  choice: son peuple
  rationale: L’expression française idiomatique rend la relation d’appartenance impliquée par le texte.
theological_decisions:
- issue: Lien causal introduit par እስመ avant « il les connaissait »
  choice: parce qu’il les connaissait
  alternative: mais il les connaissait
  rationale: እስመ est causal (« car, parce que »), non adversatif. La traduction conserve ainsi la tension théologique du texte sans préciser ce que cette connaissance implique.
- issue: Contraste entre les groupes non choisis et Israël
  choice: mais il a choisi Israël
  alternative: et il a choisi Israël
  rationale: La coordination ge’ez peut être rendue adversativement en français pour exprimer naturellement le contraste déjà établi, sans changer le contenu propositionnel.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ni » clarifie la portée de la négation sur toute l’énumération. Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
