  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
translation:
  language: fr
  text: Il le sanctifia et le mit à part de tous les fils des hommes ; car il y a beaucoup de nations et beaucoup de peuples, et tous lui appartiennent. Sur eux tous, il établit des esprits pour les détourner de le suivre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de derrière lui » ou « après lui » ; dans ce contexte, l’expression signifie probablement « de le suivre ».'
    reason: La locution እምድኅሬሁ est formellement spatiale (« derrière/après lui »), mais fonctionne vraisemblablement ici comme une expression du fait de suivre quelqu’un.
lexical_decisions:
- source_word: ቀደሶ
  choice: le sanctifia
  rationale: Rend directement le verbe « sanctifier, consacrer » dans un registre biblique clair.
- source_word: አስተጋብኦ፡ እምኵሉ፡ ውሉደ፡ ሰብእ
  choice: le mit à part de tous les fils des hommes
  rationale: Dans ce contexte d’élection et de consécration, « mit à part » exprime naturellement la séparation d’avec l’ensemble de l’humanité ; « fils des hommes » conserve l’expression traditionnelle du texte.
- source_word: ወኵሎሙ፡ ሎቱ
  choice: et tous lui appartiennent
  rationale: Le datif possessif est explicité en français courant sans modifier la portée universelle de l’énoncé.
- source_word: አሰለመ፡ መናፍስተ
  choice: il établit des esprits
  rationale: « Établit » rend l’idée de confier ou assigner une autorité sur les peuples sans préciser davantage la nature de cette nomination.
- source_word: ያስሕትዎሙ፡ እምድኅሬሁ
  choice: pour les détourner de sa suite
  rationale: Reproduit l’idée de les faire errer loin de ce qui est « derrière/après lui », comprise idiomatiquement comme le fait de le suivre, tout en gardant une légère tension formelle.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Conserver « il », « le » et « lui » sans identifier explicitement Dieu ni l’élu
  alternative: Remplacer les pronoms par « Dieu » et « Abraham/Israël »
  rationale: Le verset dépend de son contexte immédiat ; expliciter les référents dans le corps du texte ajouterait une interprétation absente de la formulation source.
- issue: Dieu établit des esprits qui égarent les nations
  choice: Conserver sans atténuation l’action causative et la finalité exprimées
  alternative: Reformuler en simple permission divine ou en conséquence indirecte
  rationale: Le texte attribue explicitement l’établissement des esprits et indique qu’ils doivent égarer les peuples ; cette tension théologique ne doit pas être résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible. « Sanctifia » et « fils des hommes » maintiennent la couleur biblique, tandis que « mit à part » et « lui appartiennent » évitent une syntaxe artificielle. Le point-virgule conserve l’articulation argumentative du verset.
