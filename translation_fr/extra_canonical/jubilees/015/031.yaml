revisions:
- from: Il le sanctifia et le mit à part de tous les fils des hommes ; car il y a beaucoup de nations et beaucoup de peuples, et tous lui appartiennent. Sur eux tous, il établit des esprits pour les détourner de sa suite.[a]
  to: Il le sanctifia et le mit à part de tous les fils des hommes ; car il y a beaucoup de nations et beaucoup de peuples, et tous lui appartiennent. Sur eux tous, il établit des esprits pour les détourner de le suivre.[a]
  rationale: La révision corrige une ambiguïté introduite par le français « sa suite » et rectifie la glose littérale de la note. Elle conserve les pronoms non explicités, la causalité du texte et la tension théologique selon laquelle des esprits sont établis pour égarer les peuples.
