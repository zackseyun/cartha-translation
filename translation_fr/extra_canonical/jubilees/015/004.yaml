  text: And I will establish my covenant between me and you, and I will multiply you greatly.
translation:
  language: fr
  text: J’établirai mon alliance entre moi et toi, et je te multiplierai considérablement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ፡ ኪዳንየ
  choice: j’établirai mon alliance
  rationale: Le verbe signifie littéralement « donner », mais, associé à « mon alliance », le français idiomatique emploie « établir une alliance »; ce choix exprime naturellement l’acte de mettre l’alliance en vigueur.
- source_word: ማእከሌየ፡ ወማእከሌከ
  choice: entre moi et toi
  rationale: Reproduction directe et naturelle de la relation bilatérale exprimée par la répétition de « entre » dans le guèze.
- source_word: ወአአብቀከ፡ ጥቀ
  choice: et je te multiplierai considérablement
  rationale: Conserve le complément personnel « te » et la forte intensification finale; « considérablement » est clair et digne en français moderne.
theological_decisions:
- issue: Formulation de l’action divine relative à l’alliance
  choice: j’établirai mon alliance
  alternative: je donnerai mon alliance
  rationale: « Donner » suit plus formellement le verbe source, mais sonne inhabituel en français dans ce contexte. « Établir » préserve le sens d’une initiative divine qui institue l’alliance, sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La coordination et le parallélisme de la phrase source sont conservés; aucun guillemet final n’est ajouté puisque l’extrait fourni ne comporte pas de contexte direct exigeant une ponctuation de discours.
