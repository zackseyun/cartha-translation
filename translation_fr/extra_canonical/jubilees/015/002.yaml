  text: 'And he offered a new sacrifice on the altar, the firstfruits of the produce, to the Lord: a bull and a goat and a sheep on the altar as a pleasing aroma to the Lord; and their grain offering and their drink offering he offered on the altar with incense.'
translation:
  language: fr
  text: 'Il offrit sur l’autel un nouveau sacrifice : les prémices de la récolte pour le Seigneur, un taureau, un chevreau et un mouton, comme un parfum agréable pour le Seigneur. Il offrit aussi sur l’autel leurs offrandes de céréales et leurs libations, avec de l’encens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ (ʾaʿraga)
  choice: il offrit
  rationale: Le verbe signifie littéralement « faire monter » et, dans ce contexte cultuel, désigne l’action d’offrir sur l’autel.
- source_word: መሥዋዕተ ሐዲስ
  choice: un nouveau sacrifice
  rationale: Rend directement le nom « sacrifice » qualifié par « nouveau », sans préciser davantage la catégorie rituelle.
- source_word: እክል
  choice: la récolte
  rationale: Le terme renvoie ici aux produits agricoles ou au grain; « récolte » donne un français naturel dans l’expression des prémices.
- source_word: ላህመ ወበሐኮ ወበግዐ
  choice: un taureau, un chevreau et un mouton
  rationale: Les trois termes désignent respectivement un bovin, un jeune caprin et un ovin. « Chevreau » respecte particulièrement le sens de በሐኮ, plutôt que « bélier ».
- source_word: ጽንሓሐ ለእግዚአብሔር
  choice: en parfum agréable au Seigneur
  rationale: La formule cultuelle exprime une odeur ou un parfum agréé par Dieu, non une catégorie de sacrifice comme « holocauste ».
- source_word: ሞጻሕቶሙ
  choice: leurs libations
  rationale: Terme cultuel usuel en français pour les offrandes liquides versées.
- source_word: ስኂን
  choice: encens
  rationale: Le terme désigne une substance aromatique brûlée; « encens » conserve la portée générale sans imposer spécifiquement l’oliban.
theological_decisions:
- issue: Nature de l’expression cultuelle « parfum agréable »
  choice: en parfum agréable au Seigneur
  alternative: comme holocauste pour le Seigneur
  rationale: Le texte source décrit l’effet olfactif ou l’agrément du sacrifice; il ne nomme pas explicitement l’holocauste.
- issue: Rapport des prémices au sacrifice
  choice: avec les prémices de la récolte
  alternative: le sacrifice, les prémices de la récolte
  rationale: La syntaxe éthiopienne est compacte. « Avec » maintient les prémices comme élément offert sans les identifier de façon trop rigide à l’ensemble du sacrifice.
translation_notes:
  register: Français international moderne, sobre et cultuel. La syntaxe a été légèrement réorganisée en deux phrases pour éviter une accumulation pesante, tout en conservant l’ordre général des offrandes et le vocabulaire rituel.
