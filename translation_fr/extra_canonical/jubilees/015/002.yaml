    issue: Formulation de la clause « en parfum agréable au Seigneur »
    rationale: La préposition « en » est maladroite ici et obscurcit le fait que les sacrifices sont offerts comme un parfum agréable au Seigneur. « Comme un parfum agréable pour le Seigneur » rend naturellement la formule cultuelle sans imposer une catégorie sacrificielle.
