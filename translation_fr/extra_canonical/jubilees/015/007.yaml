  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: fr
  text: Et ton nom ne sera plus appelé Abram ; désormais et pour toujours, ton nom sera Abraham, car je t’ai établi père de nombreuses nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይጼዋዕ
  choice: ne sera plus appelé
  rationale: Reproduit la tournure passive du guèze tout en restant naturelle en français et en conservant l’idée d’attribution officielle du nom.
- source_word: አምይእዜ፡ ወእስከ፡ ለዓለም
  choice: désormais et pour toujours
  rationale: Rend distinctement le point de départ présent et la durée perpétuelle exprimés par la source.
- source_word: ሤምኩከ
  choice: je t’ai établi
  rationale: Le verbe signifie ici « placer, établir » ; le parfait divin présente l’établissement comme accompli.
- source_word: ብዙኃን፡ አሕዛብ
  choice: une multitude de nations
  rationale: Exprime naturellement le grand nombre, sans réduire አሕዛብ à une catégorie religieuse comme « païens ».
theological_decisions:
- issue: Valeur temporelle de « je t’ai établi »
  choice: 'Conserver l’accompli : « je t’ai établi »'
  alternative: « je ferai de toi »
  rationale: La source emploie une forme accomplie. La traduction préserve donc la tension entre une déclaration déjà effective et son accomplissement historique futur.
- issue: Portée de « nations »
  choice: « nations » sans précision confessionnelle
  alternative: « peuples païens » ou « peuples »
  rationale: La source désigne de nombreux groupes humains et ne justifie pas ici l’ajout d’une qualification religieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme solennel de la déclaration divine sans archaïsmes inutiles.
