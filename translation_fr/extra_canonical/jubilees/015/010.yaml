  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: fr
  text: Et je te donnerai, à toi et à ta descendance après toi, le pays où tu as séjourné en étranger, le pays de Canaan, en possession pour toujours, et je serai leur Dieu.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Le terme désigne ici la postérité collective d’Abraham; «descendance» est naturel en français moderne et conserve cette valeur collective.
- source_word: ኀበ፡ ፈለስከ
  choice: où tu as séjourné en étranger
  rationale: La formulation exprime un séjour dans un pays où Abraham n’est pas établi comme autochtone; cette traduction conserve l’idée de résidence étrangère sans alourdir le texte.
- source_word: ዘትኳን፡ ለዓለም
  choice: en possession pour toujours
  rationale: Le syntagme associe la possession au caractère durable ou perpétuel; «pour toujours» rend clairement cette portée temporelle.
theological_decisions:
- issue: Référent du pronom dans «je serai leur Dieu»
  choice: leur Dieu
  alternative: ton Dieu et celui de ta descendance
  rationale: Le texte passe du singulier adressé à Abraham au pluriel renvoyant à sa descendance. La traduction maintient ce changement grammatical et son éventuelle tension plutôt que de l’expliciter.
- issue: Durée de la possession du pays
  choice: pour toujours
  alternative: en possession perpétuelle
  rationale: La traduction conserve l’affirmation temporelle forte du texte sans en préciser l’interprétation théologique ou historique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’énoncé source tout en évitant les tournures archaïques. Guillemets fermants conservés puisque le verset appartient manifestement à un discours déjà ouvert dans le contexte.
