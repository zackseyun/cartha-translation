  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: fr
  text: 'Abram tomba face contre terre, et Dieu lui parla en disant : « Voici, mon alliance est avec toi, et tu deviendras le père de nombreuses nations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወድቀ፡ አብራም፡ በገጹ፡
  choice: Abram tomba face contre terre
  rationale: Rend directement l’action et l’attitude de prosternation exprimées par le guèze, dans un français naturel et digne.
- source_word: ሥርዓትየ፡
  choice: mon alliance
  rationale: Bien que le terme puisse désigner un ordre, une règle ou une institution, le contexte de la promesse faite à Abram appelle ici « alliance », conformément au sens contextuel et au parallèle traditionnel.
- source_word: ወትከውን፡ አበ፡ ለብዙኃን፡ አሕዛብ፡
  choice: et tu deviendras le père d’une multitude de nations
  rationale: « Multitude de nations » restitue le pluriel et l’idée d’un grand nombre avec une formulation française courante.
theological_decisions:
- issue: Valeur contextuelle de ሥርዓትየ
  choice: mon alliance
  alternative: mon ordonnance / mon institution
  rationale: Dans cette déclaration adressée à Abram, le terme désigne la relation solennellement établie par Dieu plutôt qu’une simple prescription; « alliance » préserve donc le sens théologique du passage sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Voici » conserve la solennité de l’annonce, tandis que « face contre terre » exprime naturellement la prosternation.
