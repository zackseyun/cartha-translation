  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
translation:
  language: fr
  text: Tous deux se couchèrent ensemble sur un même lit, et Jacob dormit dans les bras d’Abraham, le père de son père. Il l’embrassa sept fois, et sa compassion et son cœur se réjouirent à son sujet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression guèze est inhabituelle; littéralement, elle peut se rendre ainsi : « sa compassion et son cœur se réjouirent sur lui ».'
    reason: La note signale la construction difficile de la dernière proposition et préserve sa formulation spatiale sans l’imposer au corps du texte français.
lexical_decisions:
- source_word: ውስተ፡ ሕፅነ፡ አብርሃም
  choice: dans les bras d’Abraham
  rationale: Le nom ሕፅን désigne le sein, la poitrine ou le giron. « Dans les bras » exprime naturellement en français la proximité affectueuse et la position de Jacob auprès d’Abraham, sans suggérer ici un sens anatomique étroit.
- source_word: አቡ፡ አቡሁ
  choice: le père de son père
  rationale: Cette formulation conserve la répétition et le lien généalogique explicites du guèze plutôt que de les réduire à « son grand-père ».
- source_word: ምሕረቱ
  choice: sa compassion
  rationale: Le terme peut évoquer la miséricorde, la compassion ou la tendresse. « Compassion » reste proche du sens lexical tout en convenant à l’affection d’Abraham pour Jacob.
- source_word: ወትሤሖ
  choice: se réjouirent
  rationale: La forme verbale exprime la joie ou le plaisir; elle ne doit pas être remplacée par un simple verbe d’état.
theological_decisions:
- issue: Sujet implicite de « Il l’embrassa »
  choice: Maintien du pronom ambigu « Il »
  alternative: « Abraham embrassa Jacob »
  rationale: Le guèze n’explicite pas de nouveau sujet. Le contexte peut favoriser Abraham, mais développer les noms lèverait une ambiguïté réelle du texte source.
- issue: Coordination de la compassion et du cœur comme sujets de la joie
  choice: « sa compassion et son cœur se réjouirent »
  alternative: « son cœur, rempli de compassion, se réjouit »
  rationale: La traduction garde les deux éléments coordonnés et la tension de l’expression source au lieu de les fusionner dans une interprétation psychologique plus fluide.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « le père de son père » préserve la forme généalogique de l’original; « dans les bras » évite l’étrangeté de « dans le sein » tout en conservant l’image de proximité.
