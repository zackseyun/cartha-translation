  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
translation:
  language: fr
  text: « Cette maison, je l’ai bâtie pour moi-même[a], afin d’y établir mon nom sur la terre. Elle t’est donnée, à toi et à ta descendance, pour toujours, et elle sera appelée “maison d’Abraham”. Elle t’est donnée, à toi et à ta descendance, pour toujours, car tu bâtiras ma maison et tu établiras mon nom devant Dieu pour toujours. Ta descendance et ton nom subsisteront à travers toutes les générations de la terre. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Cette maison, je l’ai bâtie pour moi-même » peut désigner le lieu de culte d’Abraham, mais la suite évoque aussi une maison au sens de lignée, la « maison d’Abraham ». Cette ambiguïté est probablement intentionnelle.
    reason: segmentation_note
lexical_decisions:
- source_word: ዘንተ፡ ቤተ
  choice: Cette maison
  rationale: Rend directement le démonstratif et le nom, tout en conservant le lien possible avec un édifice concret ou une lignée.
- source_word: ሐነጽኩ፡ ሊተ
  choice: je l’ai bâtie pour moi-même
  rationale: Le parfait à la première personne exprime une action accomplie; « pour moi-même » rend la valeur réfléchie de ሊተ.
- source_word: አንብር፡ ስምየ፡ ላዕሌሁ
  choice: afin d’y établir mon nom
  rationale: « Établir » convient à l’idée de placer durablement le nom sur la maison; « y » évite une formulation française pesante.
- source_word: ወተሰምየ (lecture corrigée de l’OCR ወጎሳመይ)
  choice: et elle sera appelée
  rationale: 'Suit la lecture textuelle corrigée signalée par la révision: le verbe signifie « être appelé/nommé », et non « mon peuple ».'
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Dans ce contexte généalogique et promissoire, « descendance » est plus naturel et précis que le littéral « semence ».
- source_word: ትሐንጽ … ታቀውም
  choice: tu bâtiras … tu établiras
  rationale: Les formes imperfectives indiquent ici l’action future annoncée à Jacob.
- source_word: ይቀውም
  choice: subsisteront
  rationale: Exprime la permanence du nom et de la descendance avec un registre digne et naturel.
theological_decisions:
- issue: Ambiguïté entre maison cultuelle et maison dynastique
  choice: Conserver « maison » dans les deux occurrences et ajouter une note
  alternative: Préciser « sanctuaire » dans la première occurrence ou « lignée » dans « maison d’Abraham »
  rationale: Le passage semble jouer sur les sens architectural, cultuel et familial; les expliciter dans le corps du texte supprimerait une tension probablement intentionnelle.
- issue: Temps des actions attribuées au destinataire
  choice: 'Futur: « tu bâtiras … tu établiras »'
  alternative: 'Passé composé: « tu as bâti … tu as établi »'
  rationale: Les formes guèzes sont imperfectives et le contexte présente ces actions comme futures.
- issue: « devant Dieu » après « mon nom »
  choice: Maintenir la formulation source « mon nom devant Dieu »
  alternative: Harmoniser le locuteur divin et traduire « devant moi »
  rationale: La troisième personne crée une tension théologique ou discursive réelle qu’il ne faut pas résoudre silencieusement.
translation_notes:
  register: Français international moderne, solennel mais accessible. Répétition de la formule de donation conservée. Ponctuation française et guillemets adaptés; aucune explicitation confessionnelle ajoutée.
