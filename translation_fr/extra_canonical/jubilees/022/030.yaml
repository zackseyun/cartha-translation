    rationale: Le texte source présente « mon fils, en qui… je me réjouis », puis passe aux formes « ta grâce / ta miséricorde » et « sur lui ». L'ajout de « toi » anticipe et renforce en français une deuxième personne qui n'est pas explicitement requise dans le premier membre, ce qui brouille la nature exacte de l'anomalie textuelle.
