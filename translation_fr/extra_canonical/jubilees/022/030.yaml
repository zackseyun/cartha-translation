  yaml_path: translation/extra_canonical/jubilees/022/030.yaml
  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
translation:
  language: fr
  text: 'Il bénit Jacob et dit : « Mon fils, en qui je trouve ma joie de tout mon cœur et avec toute mon affection, que ta grâce et ta miséricorde reposent sur lui et sur sa descendance pour toujours. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte passe brusquement de « Mon fils, en qui je trouve ma joie » à « ta grâce et ta miséricorde… sur lui ». Cette formulation peut être comprise comme une prière adressée à Dieu et conserve le changement de personne du texte guèze.
    reason: textual_variant
lexical_decisions:
- source_word: ዘበኵሉ፡ ልብየ፡ ወዘበምሕረትየ፡ [በእሴ፡] ይትፈሣሕ፡ ቦቱ
  choice: toi en qui je trouve ma joie de tout mon cœur et avec toute mon affection
  rationale: Rend naturellement l’expression de joie et d’attachement total, tout en tenant compte du mot entre crochets dans l’édition.
- source_word: ሣህለከ፡ ወምሕረትከ
  choice: ta grâce et ta miséricorde
  rationale: Les suffixes guèzes sont à la deuxième personne masculine singulière ; le français conserve donc ce passage soudain à « ta », probablement adressé à Dieu.
- source_word: ወላዕለ፡ ዘርኡ
  choice: et sur sa descendance
  rationale: « Descendance » traduit le nom collectif « semence » dans un français moderne et digne.
- source_word: ኵሎ፡ መዋዕለ
  choice: pour toujours
  rationale: L’expression signifie littéralement « tous les jours » et porte sur la durée, non sur la totalité de la descendance.
theological_decisions:
- issue: Passage abrupt de l’adresse à Jacob à une invocation à la deuxième personne
  choice: Conserver « ta grâce et ta miséricorde… sur lui »
  alternative: Régulariser en « ma grâce et ma miséricorde… sur toi » ou « sa grâce… sur toi »
  rationale: Le texte source associe des possessifs de deuxième personne à des pronoms de troisième personne. La traduction préserve cette tension grammaticale et sa possible portée priante sans désigner explicitement l’interlocuteur.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement fluidifiée, mais l’irrégularité significative des personnes grammaticales est conservée et expliquée en note.
