  text: Be strong before men[14], and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.
translation:
  language: fr
  text: Sois fort devant les hommes[a] et, tandis que tu domineras sur toute la descendance de Seth, alors tes voies et celles de tes fils seront reconnues comme justes, afin qu’ils deviennent un peuple saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte est difficile. Le guèze dit explicitement « descendance de Seth »; la proposition concernant la position de Jacob parmi elle peut aussi signifier qu’il sera élevé ou prééminent parmi les êtres humains.
    reason: segmentation_note
lexical_decisions:
- source_word: ኩን፡ ኃያለ
  choice: Sois fort
  rationale: Rend directement l’impératif et l’adjectif exprimant la force ou la puissance.
- source_word: በቅድመ፡ ሰብእ
  choice: devant les hommes
  rationale: Conserve le sens spatial ou relationnel littéral de « devant » sans préciser davantage la nuance difficile du passage.
- source_word: ትሜብል
  choice: tu domineras
  rationale: Le verbe peut évoquer le fait d’être élevé, prééminent ou de gouverner; « domineras sur » correspond au contexte tout en signalant l’incertitude en note.
- source_word: ኵሉ፡ ዘርአ፡ ሴት
  choice: toute la descendance de Seth
  rationale: Traduit explicitement Seth, présent dans le guèze, et emploie une formulation française naturelle pour « semence ».
- source_word: ፍናዊከ፡ ወፍናዊ፡ ውሉድከ
  choice: tes voies et celles de tes fils
  rationale: Respecte les formes plurielles et évite une répétition lourde en français.
- source_word: ይጸድቃ
  choice: seront reconnues comme justes
  rationale: Préserve la valeur passive ou déclarative possible du verbe de justice plutôt que d’imposer le simple sens moral « seront justes ».
- source_word: ለከዊነ፡ ሕዝብ፡ ቅዱስ
  choice: afin qu’ils deviennent un peuple saint
  rationale: Rend la finalité et l’expression collective « peuple saint » de manière directe.
theological_decisions:
- issue: Référent du sujet de « deviennent »
  choice: ils
  alternative: vous / tes fils et toi
  rationale: Le texte laisse une certaine tension entre les voies justifiées et la constitution d’un peuple saint; le pluriel français conserve cette indétermination relative sans ajouter une identité confessionnelle.
- issue: Sens de la justification des voies
  choice: seront reconnues comme justes
  alternative: seront justes / seront justifiées
  rationale: Cette formulation garde la dimension de déclaration ou de constat attachée à la racine de justice, sans introduire une doctrine technique de la justification.
translation_notes:
  register: Français moderne, international et digne. La syntaxe suit étroitement la progression du guèze, tout en allégeant la répétition « tes voies et les voies de tes fils ». Le marqueur [a] figure dans le texte principal.
