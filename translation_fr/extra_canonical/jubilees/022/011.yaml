  yaml_path: translation/extra_canonical/jubilees/022/011.yaml
  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: fr
  text: 'Il appela Jacob et dit : « Mon fils Jacob, que le Dieu de tous te bénisse et te donne la force de pratiquer la justice et d’accomplir sa volonté devant lui. Qu’il te choisisse, toi et ta descendance, afin que vous soyez pour lui un peuple d’héritage, selon sa volonté, tous les jours. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ኵሉ
  choice: le Dieu de tous
  rationale: Rend directement le titre guèze et conserve sa portée universelle.
- source_word: ያኃይለከ
  choice: te donne la force
  rationale: Expression française naturelle pour l’idée causative de fortifier ou rendre capable.
- source_word: ለገቢረ፡ ጽድቅ
  choice: de pratiquer la justice
  rationale: « Pratiquer la justice » exprime clairement l’action morale visée, sans réduire ጽድቅ à une simple qualité abstraite.
- source_word: ወፈቃዱ
  choice: et d’accomplir sa volonté
  rationale: Le verbe « accomplir », sous-entendu par coordination avec « pratiquer », produit un français idiomatique tout en conservant le sens.
- source_word: በቅድመ፡ ዚአሁ
  choice: devant lui
  rationale: Calque intelligible de l’expression relationnelle et cultuelle du texte source.
- source_word: ወ'በዘርእከ
  choice: toi et ta descendance
  rationale: « Descendance » restitue naturellement le collectif « semence » en français moderne.
- source_word: ሕዝበ፡ ዘርስት
  choice: un peuple qui lui appartienne
  rationale: Restitue idiomatiquement l’idée d’un peuple d’héritage ou de possession, sans laisser entendre que le peuple reçoit ici un territoire en héritage.
- source_word: በኵሉ፡ መዋዕለ
  choice: tous les jours
  rationale: Conserve l’expression temporelle littérale, qui peut évoquer durablement l’ensemble des jours à venir.
theological_decisions:
- issue: Sens de « peuple d’héritage »
  choice: un peuple qui lui appartienne
  alternative: un peuple d’héritage
  rationale: La formulation choisie communique en français courant que le peuple constitue l’héritage ou la possession de Dieu, tout en évitant une expression française obscure et sans importer une doctrine confessionnelle particulière.
- issue: Nombre dans la proposition finale
  choice: afin que vous soyez
  alternative: afin que tu sois
  rationale: Le sujet conceptuel inclut Jacob et sa descendance; le pluriel explicite cette valeur collective, même si la morphologie source peut maintenir une adresse au singulier.
translation_notes:
  register: Français international moderne, digne et accessible. La bénédiction conserve son caractère optatif par la répétition de « que ». La syntaxe est légèrement explicitée pour être naturelle à l’oral comme à l’écrit, sans surcharge interprétative.
