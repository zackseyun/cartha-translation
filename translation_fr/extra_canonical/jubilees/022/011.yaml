review_pass:
  verdict: revise
  source_fidelity: La bénédiction, les optatifs, « le Dieu de tous », le renforcement en vue de faire la justice et la volonté divine, ainsi que l’élection de Jacob et de sa descendance sont fidèlement rendus. Toutefois, « un peuple qui lui appartienne » réduit « peuple d’héritage » à la seule notion de possession et ne conserve pas le terme ni la nuance d’« héritage » du guèze ሕዝበ፡ ዘርስት. La formulation révisée maintient cette expression, également attestée dans le jalon anglais (« a people of inheritance »).
  naturalness: Le français est moderne, fluide et d’un registre approprié à une bénédiction patriarcale. « Un peuple d’héritage » est une expression biblique un peu marquée, mais elle reste compréhensible et elle est préférable ici à une paraphrase qui affaiblit le lexique source. Le pluriel « vous soyez » convient au référent collectif explicite, Jacob et sa descendance.
  terminology: « Dieu de tous », « justice », « volonté », « descendance » et « héritage » conservent les termes structurants sans surinterprétation confessionnelle. « Peuple d’héritage » préserve l’ambiguïté inhérente à la construction source, plutôt que de la fixer comme une simple appartenance.
  issues:
  - severity: medium
    issue: « un peuple qui lui appartienne » remplace « peuple d’héritage ».
    rationale: Cette paraphrase omet la notion explicite d’héritage (ዘርስት) et impose la lecture restrictive d’un peuple appartenant à Dieu. « Peuple d’héritage » conserve plus exactement le vocabulaire et l’ambiguïté du texte source et de l’audit anglais.
  revised_text: 'Il appela Jacob et dit : « Mon fils Jacob, que le Dieu de tous te bénisse et te donne la force de pratiquer la justice et d’accomplir sa volonté devant lui. Qu’il te choisisse, toi et ta descendance, afin que vous soyez pour lui un peuple d’héritage, selon sa volonté, tous les jours. »'
  revised_footnotes: []
  revision_rationale: 'La seule correction nécessaire rétablit « peuple d’héritage », correspondant directement à ሕዝበ፡ ዘርስት et au jalon anglais « a people of inheritance ». Aucun ajout de note n’est requis : l’expression est conservée sans résolution doctrinale de sa portée.'
