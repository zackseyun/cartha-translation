  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: fr
  text: 'Et toi, mon fils Jacob, souviens-toi de mes paroles et garde les commandements d’Abraham, ton père. Sépare-toi des nations : ne mange pas avec elles, n’agis pas selon leurs œuvres et ne deviens pas leur compagnon, car leurs œuvres sont impures, et toutes leurs voies sont souillure, abomination et impureté.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር፡ ቃለየ
  choice: souviens-toi de mes paroles
  rationale: Rend directement l’impératif et le pluriel de « paroles », dans un français naturel et solennel.
- source_word: ዕቀብ፡ ትእዛዛተ
  choice: garde les commandements
  rationale: « Garder » préserve l’idée biblique d’observer fidèlement, sans réduire le sens à une simple mémorisation.
- source_word: ተፈለጥ፡ እምአሕዛብ
  choice: sépare-toi des nations
  rationale: Traduction formelle de l’appel à se tenir séparé des peuples non israélites ; « nations » conserve le vocabulaire biblique sans ajouter une qualification religieuse absente.
- source_word: ወኢትግበር፡ በከመ፡ ምግባሪሆሙ
  choice: n’agis pas comme elles
  rationale: Formulation française concise correspondant à « ne fais pas selon leurs actions ».
- source_word: ወኢትኩኖሙ፡ ቢጸ
  choice: ne deviens pas leur compagnon
  rationale: Conserve l’idée relationnelle de devenir compagnon ou associé, plutôt que de généraliser en « ne les fréquente pas ».
- source_word: ርኩስ
  choice: impures
  rationale: Terme usuel pour l’impureté morale ou rituelle et prédicat naturel de « œuvres ».
- source_word: ጐግኒ፡ ወምናኔ፡ ወስቆራር
  choice: souillure, abomination et impureté
  rationale: Maintient la série emphatique de trois substantifs et sa tension sémantique, sans fusionner les notions.
theological_decisions:
- issue: Portée de አሕዛብ
  choice: les nations
  alternative: les païens
  rationale: « Nations » préserve la désignation ethnoreligieuse plus large du texte et évite d’imposer la nuance confessionnelle plus marquée de « païens ».
- issue: Nature de l’impureté décrite
  choice: vocabulaire non spécifié de l’impureté et de la souillure
  alternative: expliciter une impureté exclusivement morale ou exclusivement rituelle
  rationale: Le verset associe conduite, voies et langage d’impureté sans trancher explicitement entre catégories morale et rituelle ; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination accumulative du guèze est légèrement structurée par deux phrases et un deux-points, tout en conservant la progression des interdictions et la triple conclusion emphatique.
