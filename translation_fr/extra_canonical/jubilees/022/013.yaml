  yaml_path: translation/extra_canonical/jubilees/022/013.yaml
  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: fr
  text: 'Il s’approcha et l’embrassa. Puis il dit : « Que mon fils Jacob et tous ses fils soient bénis par le Seigneur Très-Haut pour tous les siècles ! Que le Seigneur te donne une descendance juste et qu’il consacre certains de tes descendants au milieu de toute la terre.[a] Que les nations te servent et que tous les peuples se prosternent devant ta descendance ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il consacre parmi tes descendants » ; le sens est probablement qu’il en consacre certains.'
    reason: La construction partitive est implicite dans la source et doit être explicitée en français, tout en signalant sa formulation littérale.
lexical_decisions:
- source_word: ቀርበ፡ ወስዐሞ
  choice: Il s’approcha et l’embrassa
  rationale: Rend directement les deux verbes successifs, dans un français narratif naturel.
- source_word: ቡሩክ፡ ... ለእግዚአብሔር፡ ልዑል
  choice: Que ... soient bénis par le Seigneur Très-Haut
  rationale: La tournure optative française exprime la bénédiction, et « par » conserve la compréhension instrumentale ou agentive de la construction.
- source_word: ለኵሉ፡ ዓለማት
  choice: pour tous les siècles
  rationale: « Siècles » restitue l’expression temporelle au pluriel avec un registre biblique encore compréhensible.
- source_word: ዘርአ፡ ጽድቅ
  choice: une descendance juste
  rationale: Le syntagme peut être compris comme une descendance caractérisée par la justice; « descendance » convient mieux que « semence » dans ce contexte généalogique.
- source_word: ወ'እምውሉድከ፡ ይቀድስ
  choice: qu’il consacre certains de tes descendants
  rationale: Le verbe est actif, « consacrer/sanctifier »; la préposition « de, parmi » est rendue partitivement par « certains de ».
- source_word: ይትቀነዩ፡ ለከ፡ አሕዛብ
  choice: Que les nations te servent
  rationale: Le verbe exprime le service ou l’assujettissement, sous forme de souhait parallèle aux autres bénédictions.
- source_word: ይስግዱ፡ በቅድመ፡ ዘርእከ
  choice: se prosternent devant ta descendance
  rationale: « Se prosterner devant » rend précisément le geste d’hommage indiqué par le verbe et la préposition.
theological_decisions:
- issue: Sujet et portée de la sanctification
  choice: Dieu consacre certains des descendants de Jacob
  alternative: De la descendance de Jacob, Dieu se sanctifie lui-même
  rationale: La forme verbale guèze est active et non réflexive; la préposition qui précède « descendants » s’interprète naturellement de manière partitive. Cette lecture évite d’attribuer au texte une réflexivité absente.
- issue: Nature de la domination annoncée
  choice: « Que les nations te servent » comme bénédiction optative
  alternative: « Les nations te serviront » comme prédiction catégorique
  rationale: Le contexte accumule des souhaits de bénédiction; le français au subjonctif conserve cette force sans transformer le passage en affirmation prédictive stricte.
translation_notes:
  register: Français moderne, digne et accessible, avec une légère solennité biblique. Le tutoiement suit l’adresse personnelle de la bénédiction. « Descendance » est employé de façon cohérente pour le champ généalogique de ዘር.
