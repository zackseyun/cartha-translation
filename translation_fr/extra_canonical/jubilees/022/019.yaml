  text: They sacrifice their sacrifices to the dead, and they worship demons, and they eat in the graves[19], and all their works are vanity and emptiness.
translation:
  language: fr
  text: Ils immolent leurs sacrifices aux morts, se prosternent devant les démons et mangent dans les tombeaux[a] ; toutes leurs œuvres ne sont que vanité et vide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « mangent dans les tombeaux » désigne probablement des repas rituels funéraires ou liés à la consultation des morts.
    reason: Note culturelle expliquant une pratique ancienne sans remplacer la formulation concrète du texte.
lexical_decisions:
- source_word: መሥዋዕቶሙ፡ … ይዘብሑ
  choice: ils immolent leurs sacrifices
  rationale: Conserve la reprise du nom et du verbe sacrificiels présente dans le guèze, tout en restant idiomatique en français.
- source_word: ለአብድነት
  choice: aux morts
  rationale: Rend la destination des sacrifices conformément au sens attesté par l’édition source et sans préciser davantage la nature du rite.
- source_word: ለአጋንንት፡ ይሰግዱ
  choice: se prosternent devant les démons
  rationale: « Se prosterner devant » exprime concrètement le geste cultuel du verbe, sans réduire celui-ci à une simple marque de respect.
- source_word: በውስተ፡ መቃብራት፡ ይበልዑ
  choice: mangent dans les tombeaux
  rationale: Suit la valeur spatiale explicite de « dans, à l’intérieur de » et préserve l’étrangeté de la pratique décrite.
- source_word: ከንቱ፡ ወበከ
  choice: vanité et vide
  rationale: Maintient les deux termes coordonnés et leur portée rhétorique, plutôt que de les fondre en une seule idée.
theological_decisions:
- issue: Rapport entre les sacrifices, les morts et les démons
  choice: 'Conserver deux objets cultuels distincts : sacrifices aux morts et prosternation devant les démons.'
  alternative: Identifier implicitement les morts aux démons ou présenter tous les actes comme un seul culte.
  rationale: Le texte coordonne les deux pratiques sans expliquer leur rapport théologique ; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, international et digne. La syntaxe coordonnée conserve l’accumulation du texte source. « Tombeaux » convient mieux que « tombes » à l’idée d’un espace dans lequel on entre et mange ; la note signale prudemment l’interprétation rituelle.
