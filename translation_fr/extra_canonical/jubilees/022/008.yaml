  yaml_path: translation/extra_canonical/jubilees/022/008.yaml
  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: fr
  text: Et maintenant, je te remercie, mon Dieu, car tu m’as fait voir ce jour. Voici, je suis âgé de cent soixante-quinze ans, avancé en âge et comblé de jours, et tous mes jours se sont déroulés dans la paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትኃነይ፡ ለከ
  choice: je te remercie
  rationale: Rend naturellement en français moderne l’expression d’action de grâce adressée directement à Dieu.
- source_word: አርአይከኒ፡ ዛተ፡ ዕለተ
  choice: tu m’as fait voir ce jour
  rationale: Conserve la formulation causative et concrète du guèze plutôt que de la réduire à « laissé vivre jusqu’à ce jour ».
- source_word: አሂቅ
  choice: avancé
  rationale: Exprime l’avancement en âge sans la répétition maladroite de « vieux » après l’indication des années.
- source_word: ፍጹመ፡ መዋዕል
  choice: comblé en jours
  rationale: Préserve l’image sémitique d’une vie arrivée à sa pleine mesure, dans une langue française digne et intelligible.
- source_word: ኮናኒ፡ ሰላመ
  choice: se sont déroulés dans la paix
  rationale: Rend l’état de paix qui a caractérisé l’ensemble de ses jours tout en évitant le calque peu naturel « ont été paix ».
theological_decisions:
- issue: Portée de « tu m’as fait voir ce jour »
  choice: Maintien de la formulation littérale
  alternative: « tu m’as permis de vivre jusqu’à ce jour »
  rationale: Le texte peut évoquer la préservation divine de la vie, mais il ne convient pas d’expliciter cette interprétation au détriment de l’image source.
- issue: Sens de la plénitude des jours
  choice: « comblé en jours »
  alternative: « arrivé au terme de mes jours »
  rationale: L’alternative introduirait trop nettement l’idée d’une mort imminente; la traduction retenue conserve la plénitude d’une longue vie sans résoudre cette nuance.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme solennel de la prière est conservé, de même que « Voici » et l’image biblique de jours comblés.
