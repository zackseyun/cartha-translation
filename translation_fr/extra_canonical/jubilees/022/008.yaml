revisions:
- from: Et maintenant, je te remercie, mon Dieu, car tu m’as fait voir ce jour. Voici, je suis âgé de cent soixante-quinze ans, avancé et comblé en jours, et tous mes jours se sont déroulés dans la paix.
  to: Et maintenant, je te remercie, mon Dieu, car tu m’as fait voir ce jour. Voici, je suis âgé de cent soixante-quinze ans, avancé en âge et comblé de jours, et tous mes jours se sont déroulés dans la paix.
  rationale: 'Révision limitée à deux ajustements idiomatiques : ajout de « en âge » et remplacement de « comblé en jours » par « comblé de jours ». Le texte conserve la construction concrète « tu m’as fait voir ce jour », la plénitude non explicitée des jours et la paix comme caractéristique de toute la vie.'
