  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: fr
  text: 'Ils n’ont pas de cœur pour comprendre, et leurs yeux ne voient pas ce qu’ils ont fabriqué ni comment ils s’égarent lorsqu’ils disent au bois : « Tu es mon dieu », et à la pierre : « Tu es mon seigneur et mon libérateur. » Ils n’ont pas de cœur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ለሐልዮ
  choice: de cœur pour comprendre
  rationale: Rend l’expression sémitique littérale en conservant le cœur comme siège de la pensée et du discernement.
- source_word: ምንተ፡ ገብሮሙ
  choice: ce qu’ils ont fabriqué
  rationale: Le verbe renvoie ici à ce qu’ils ont fait ou produit, dans le contexte immédiat des idoles de bois et de pierre.
- source_word: ይስኅቱ
  choice: ils s’égarent
  rationale: Exprime naturellement l’idée de dévier ou d’errer, sans préciser indûment s’il s’agit d’erreur intellectuelle ou d’infidélité religieuse.
- source_word: መባሕሕየ
  choice: mon libérateur
  rationale: Conserve le sens personnel de celui qui délivre, dans un registre biblique actuel et intelligible.
theological_decisions:
- issue: Le cœur comme faculté de compréhension
  choice: Conserver « cœur »
  alternative: Traduire seulement par « intelligence » ou « discernement »
  rationale: Le texte répète explicitement « cœur » au début et à la fin; le conserver préserve l’anthropologie et l’effet d’encadrement du passage.
- issue: Nature de l’égarement idolâtre
  choice: Employer le terme général « s’égarent »
  alternative: « pèchent », « se trompent » ou « apostasient »
  rationale: Le terme source permet une formulation générale; une option plus précise résoudrait indûment la portée morale et religieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition finale est maintenue, ainsi que le parallélisme entre le bois et la pierre. Aucun marqueur de note n’est requis.
