  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
translation:
  language: fr
  text: 'Il le bénit de tout son cœur et dit : « Le Dieu Très-Haut, le Dieu de tous et le Créateur de tout, qui m’a fait sortir d’Our des Chaldéens pour me donner ce pays en possession perpétuelle et pour que j’établisse une descendance sainte — que le Très-Haut soit béni pour toujours ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልቡ
  choice: de tout son cœur
  rationale: Rend directement l’expression de totalité et conserve une formulation française naturelle.
- source_word: አምላከ፡ ልዑል
  choice: le Dieu Très-Haut
  rationale: Conserve le titre divin explicite et son registre élevé.
- source_word: ዘከለዳውያን
  choice: des Chaldéens
  rationale: Forme française traditionnelle et immédiatement compréhensible du complément associé à Our.
- source_word: ምድረ፡ አርስ፡ ለዓለም
  choice: ce pays en possession perpétuelle
  rationale: Exprime la terre comme bien durablement possédé, conformément au sens contextuel de la formule.
- source_word: ዘርአ፡ ቅዱሰ
  choice: une descendance sainte
  rationale: « Descendance » rend ici le sens collectif et généalogique de « semence » dans un français moderne.
theological_decisions:
- issue: Sujet du verbe አቅም dans la seconde proposition finale
  choice: pour que j’établisse une descendance sainte
  alternative: et pour établir une descendance sainte
  rationale: La forme verbale est à la première personne du singulier et marque Abraham comme sujet; la traduction évite donc de faire silencieusement de Dieu le sujet de cette action.
- issue: Sujet de la bénédiction finale
  choice: que le Très-Haut soit béni pour toujours
  alternative: qu’il soit béni pour toujours
  rationale: Le texte répète explicitement le titre « Très-Haut »; cette répétition est conservée.
- issue: Rapport syntaxique entre les deux propositions introduites par ከመ
  choice: pour me donner… et pour que j’établisse…
  alternative: pour me donner… et établir…
  rationale: La construction française maintient leur coordination tout en signalant clairement le changement de sujet grammatical.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase ample et la reprise du titre divin préservent la solennité de la bénédiction, tandis que le tiret clarifie l’arrivée de l’acclamation finale.
