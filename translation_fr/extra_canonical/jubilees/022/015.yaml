base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/015.yaml
  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
translation:
  language: fr
  text: Que le Dieu Très-Haut te donne toutes les bénédictions dont il m’a béni et dont il a béni Noé et Adam. Qu’elles reposent sur la tête sainte de ta descendance, pour toutes les générations[a] et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de génération en génération ».
    reason: Signale une autre manière idiomatique de rendre l’expression guèze, tout en maintenant dans le texte principal le mot « toutes » explicitement présent.
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: le Dieu Très-Haut
  rationale: Rend directement le titre divin guèze dans une formulation française consacrée, claire et digne.
- source_word: ያዕርፉ
  choice: qu’elles reposent
  rationale: Conserve l’image concrète des bénédictions qui viennent reposer sur la tête du descendant.
- source_word: ድማኅ፡ ቅዱስ
  choice: la tête sainte
  rationale: Suit l’ordre sémantique du texte et préserve l’attribution explicite de sainteté à la tête.
- source_word: ዘርእከ
  choice: ta descendance
  rationale: Exprime naturellement en français le sens collectif de « semence, postérité », sans limiter la référence à un seul descendant.
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: pour toutes les générations
  rationale: Conserve le quantificateur explicite « toutes » tout en donnant une tournure française naturelle.
- source_word: ወእስከ፡ ለዓለም
  choice: et à jamais
  rationale: Rend la durée indéfinie ou perpétuelle dans un registre biblique moderne et naturel.
theological_decisions:
- issue: Portée de « ta descendance »
  choice: Valeur collective, sans préciser un individu particulier
  alternative: « ta postérité » ou « ta semence » avec une possible lecture individuelle ou messianique
  rationale: Le terme source peut désigner la lignée ou la postérité; la traduction ne doit pas imposer une identification doctrinale absente du verset.
- issue: Statut de « sainte »
  choice: Faire porter l’adjectif sur « tête », conformément à la syntaxe transmise
  alternative: Comprendre implicitement que la descendance elle-même est sainte
  rationale: Cette formulation préserve l’expression inhabituelle du texte au lieu d’en lisser la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux bénédictions est conservé, ainsi que l’image concrète de bénédictions reposant sur une tête.
