  yaml_path: translation/extra_canonical/jubilees/022/010.yaml
  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
translation:
  language: fr
  text: Mon Dieu, que ta miséricorde et ta paix reposent sur ton serviteur et sur la descendance de ses fils, afin qu’elle devienne pour toi un peuple choisi et un héritage d’entre toutes les nations de la terre, dès maintenant, pour tous les jours des générations de la terre, pour tous les siècles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  choice: Mon Dieu
  rationale: Rend explicitement le vocatif avec suffixe possessif, présent dans le texte guèze.
- source_word: ሣህልከ
  choice: ta bonté
  rationale: Le terme peut désigner la grâce, la faveur ou la miséricorde; « bonté » conserve une portée large et convient à la bénédiction.
- source_word: ዘርአ፡ ውሉዱ
  choice: la descendance de ses fils
  rationale: Reproduit la construction généalogique du guèze sans la réduire à ses seuls fils immédiats.
- source_word: ሕዝበ፡ ኅሩየ
  choice: un peuple choisi
  rationale: Équivalent naturel et formel de l’expression désignant un peuple élu ou choisi.
- source_word: ወርስተ
  choice: un héritage
  rationale: Conserve l’image théologique et juridique de la possession héritée.
- source_word: እምኵሉ፡ አሕዛበ፡ ምድር
  choice: parmi toutes les nations de la terre
  rationale: Le préfixe prépositionnel exprime ici la provenance ou la sélection au sein des nations.
- source_word: ለኵሉ፡ ዓለማት
  choice: pour tous les siècles
  rationale: Rend l’expression temporelle finale sans l’aplatir en simple perpétuité.
theological_decisions:
- issue: Valeur de ሣህል (« grâce », « miséricorde », « bonté »)
  choice: ta bonté
  alternative: ta miséricorde
  rationale: « Bonté » préserve la largeur sémantique de la faveur bienveillante divine; « miséricorde » pourrait accentuer indûment le pardon ou la détresse.
- issue: Référent collectif après « la descendance »
  choice: afin qu’elle soit
  alternative: afin qu’ils soient
  rationale: L’accord au singulier collectif correspond naturellement en français à « la descendance » et conduit à « un peuple choisi » sans trancher entre les individus et le groupe.
- issue: Rapport du peuple aux nations
  choice: un héritage parmi toutes les nations
  alternative: un héritage pris d’entre toutes les nations
  rationale: « Parmi » conserve la relation de sélection/provenance sans expliciter davantage que le texte la manière dont cet héritage est constitué.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la cadence d’une bénédiction solennelle, maintient le vocatif « Mon Dieu » et préserve la répétition temporelle du texte source.
