lexical_decisions:
- source_word: ብዙኅ፡ ጥሪቱ
  choice: de nombreux biens
  rationale: ጥሪት désigne ici les possessions ou les biens d’Isaac; ብዙኅ en indique l’abondance.
- source_word: በቤርሳቤ
  choice: à Beer-Shéba
  rationale: Transcription française usuelle du nom de lieu biblique Beer-sheba.
- source_word: የሐውር፡ ይስሐቅ፡ ወይዋሑ፡ ጥሪተ
  choice: Il allait examiner ses biens
  rationale: La suite de formes imperfectives décrit une action habituelle passée. Dans ce contexte, ይዋሑ est rendu par « examiner », conformément au sens contextuel de regarder ou inspecter les possessions.
- source_word: ወይገብእ፡ ኀበ፡ አቡሁ
  choice: puis revenait auprès de son père
  rationale: ይገብእ exprime le retour, et ኀበ አቡሁ signifie « auprès de/vers son père ».
