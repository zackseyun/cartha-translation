  yaml_path: translation/extra_canonical/jubilees/022/017.yaml
  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: fr
  text: Qu’il renouvelle son alliance avec toi, afin que tu sois pour lui un peuple qui lui appartienne pour tous les âges, et qu’il soit ton Dieu et celui de ta descendance, dans la vérité et la justice, tous les jours de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐድስ፡ ኪዳኖ፡
  choice: qu’il renouvelle son alliance
  rationale: Rend directement le verbe « renouveler » et le terme d’alliance, tout en conservant la valeur de souhait du contexte.
- source_word: ሕዝበ፡ ለርስት፡
  choice: un peuple qui lui appartienne
  rationale: Littéralement, l’expression évoque un « peuple pour héritage ». La formulation française exprime naturellement l’idée d’un peuple constituant la possession ou le lot de Dieu sans suggérer que le peuple recevrait lui-même un héritage.
- source_word: ለኵሉ፡ ዓለማት፡
  choice: pour tous les âges
  rationale: Le pluriel désigne ici l’ensemble des âges ou des époques, plutôt que le monde spatial.
- source_word: ለከ፡ ወለዘርእከ፡ አምላከ፡
  choice: ton Dieu et celui de ta descendance
  rationale: Restitue la relation de Dieu avec le destinataire et sa semence; « descendance » est actuel et collectif.
- source_word: በሀልወ፡ ወዘበጽድቅ፡
  choice: dans la vérité et la justice
  rationale: Conserve les deux notions coordonnées, sans réduire la première à la seule fidélité ni préciser indûment la nature de la justice.
- source_word: በኵሉ፡ መዋዕለ፡ ምድር።
  choice: tous les jours de la terre
  rationale: Maintient l’expression temporelle et cosmique de la source plutôt que de l’aplatir en « pour toujours ».
theological_decisions:
- issue: Peuple comme héritage de Dieu
  choice: un peuple qui lui appartienne
  alternative: un peuple pour héritage
  rationale: La traduction choisie communique le rapport d’appartenance implicite dans l’expression source tout en restant idiomatique; elle ne transforme pas le peuple en bénéficiaire d’un héritage.
- issue: Rapport de Dieu à la descendance
  choice: qu’il soit ton Dieu et celui de ta descendance
  alternative: qu’il soit Dieu pour toi et pour ta descendance
  rationale: Les deux formulations sont possibles. Le possessif français rend naturellement la formule d’alliance sans ajouter de contenu doctrinal.
- issue: Vérité et justice
  choice: dans la vérité et la justice
  alternative: avec fidélité et justice
  rationale: La formulation retenue préserve l’éventail sémantique et la tension abstraite de la source, plutôt que d’interpréter « vérité » exclusivement comme « fidélité ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la valeur optative, le vocabulaire d’alliance et la cadence solennelle du verset, avec une syntaxe française naturelle.
