  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: fr
  text: Mais toi, mon fils Jacob, que le Dieu Très-Haut vienne à ton aide, que le Dieu du ciel te bénisse et t’éloigne de leur impureté et de tous leurs égarements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልዑል
  choice: Très-Haut
  rationale: Titre divin traditionnel et naturel en français, correspondant au sens de « élevé, suprême ».
- source_word: ይርዳእከ
  choice: vienne à ton aide
  rationale: Rend clairement la valeur optative du verbe « aider, secourir » dans cette bénédiction.
- source_word: ያግኅሥከ
  choice: te tienne à l’écart
  rationale: Dans ce contexte, le verbe exprime l’éloignement ou la séparation d’avec l’impureté et l’erreur; cette formulation évite de suggérer que Jacob y participe déjà nécessairement.
- source_word: ርእዮሙ
  choice: leur impureté
  rationale: Suit la compréhension contextuelle et la tradition textuelle reflétée par l’édition et la couche de consultation anglaise.
- source_word: ስሕተቶሙ
  choice: leurs égarements
  rationale: Le terme peut désigner erreurs, fautes ou égarements; le pluriel français conserve l’idée de multiples déviations sans la réduire à une erreur intellectuelle.
theological_decisions:
- issue: Relation entre « le Dieu Très-Haut » et « le Dieu du ciel »
  choice: Conserver les deux désignations parallèles du même Dieu
  alternative: Fusionner en « que le Dieu Très-Haut du ciel… »
  rationale: Le parallélisme de la source attribue deux actions à deux titres divins successifs; les conserver respecte sa forme et son emphase.
- issue: État de Jacob par rapport à l’impureté et aux égarements mentionnés
  choice: « te tienne à l’écart »
  alternative: « te retire » ou « t’enlève »
  rationale: La source exprime une séparation, mais ne tranche pas explicitement la question de savoir si Jacob est déjà engagé dans ces pratiques; la formulation retenue préserve cette ouverture contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de bénédiction est conservée au moyen de deux subjonctifs coordonnés. Aucun marqueur de note n’est requis.
