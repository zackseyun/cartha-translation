base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/005.yaml
  text: And he brought a peace offering and made a great feast of rejoicing before Ishmael his brother. And Rebekah made fresh cakes from new grain and gave them to Jacob her son[5], so that he might bring them to Abraham, his father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.
translation:
  language: fr
  text: Il apporta un sacrifice de communion et organisa un grand festin dans la joie devant Ismaël, son frère. Rébecca prépara des galettes fraîches avec du grain nouveau et les donna à Jacob, son fils, pour qu’il les apporte à Abraham, son père[a], comme prémices de la terre, afin qu’il en mange et bénisse le Créateur de toutes choses avant de mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire son ancêtre ; Abraham était le grand-père de Jacob.
    reason: Le texte source dit littéralement « son père », selon un usage où « père » peut désigner un ancêtre.
lexical_decisions:
- source_word: መድኃኒተ
  choice: sacrifice de communion
  rationale: Dans ce contexte sacrificiel et festif, le terme désigne une offrande de paix ou de salut; « sacrifice de communion » est une expression française biblique naturelle qui conserve le lien entre offrande et repas partagé.
- source_word: ፯ዝዐ፡ ፍሥሓ
  choice: un grand festin dans la joie
  rationale: Le groupe exprime un abondant repas festif marqué par la réjouissance; cette formulation restitue les deux composantes sans lourdeur.
- source_word: ጻፍንተ፡ ሐዳሰ፡ እምስርናይ፡ ኅዲስ
  choice: des galettes fraîches avec du grain nouveau
  rationale: Rend explicitement la préparation de galettes et le caractère nouveau du grain, sans introduire une fête de la moisson qui n’est pas nommée dans ce verset.
- source_word: አቡሁ
  choice: son père
  rationale: Le guèze dit littéralement « son père ». Le terme peut désigner un ancêtre; le texte principal conserve donc le lien de parenté formulé par la source plutôt que de le corriger en « grand-père ».
- source_word: እምቀዳሚ፡ ፍሬ፡ ምድር
  choice: comme prémices de la terre
  rationale: « Prémices » restitue de façon concise et bibliquement naturelle l’idée des premiers produits ou fruits du sol.
- source_word: ፈጣሪ፡ ኵሉ
  choice: le Créateur de toutes choses
  rationale: Cette formulation française naturelle conserve le titre théologique et la portée universelle de « créateur de tout ».
theological_decisions:
- issue: Lien de parenté entre Jacob et Abraham
  choice: « son père » dans le texte, avec une note explicative
  alternative: « son grand-père » ou « le père de son père »
  rationale: Bien qu’Abraham soit le grand-père de Jacob selon la généalogie, la source emploie « père », usage ancien pouvant inclure un ancêtre. La traduction préserve ce trait au lieu de résoudre silencieusement la tension.
- issue: Nature de l’offrande
  choice: « sacrifice de communion »
  alternative: « sacrifice de paix » ou « offrande de salut »
  rationale: Le choix garde l’arrière-plan cultuel et festif sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible, avec une syntaxe narrative fluide. Le vocabulaire cultuel reste biblique sans être archaïque. La ponctuation de la note après « son père » laisse clairement entendre que l’explication porte sur cette expression.
