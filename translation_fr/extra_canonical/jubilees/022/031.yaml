  to: Ne l’abandonne pas et ne le délaisse pas, dès maintenant et jusqu’aux jours de l’éternité.[a] Que tes yeux soient ouverts sur lui et sur sa descendance,[b] afin que tu le gardes, que tu le bénisses et que tu le consacres comme peuple de ton héritage. Bénis-le de toutes tes bénédictions, dès maintenant et pour tous les jours de l’éternité. Renouvelle ton alliance et ta miséricorde envers lui et envers sa descendance, selon toute ta volonté, dans toutes les générations de la terre. »
