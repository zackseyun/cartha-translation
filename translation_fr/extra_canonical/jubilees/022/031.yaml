  yaml_path: translation/extra_canonical/jubilees/022/031.yaml
  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
translation:
  language: fr
  text: Ne l’abandonne pas et ne le délaisse pas, dès maintenant et jusqu’aux jours de l’éternité.[a] Que tes yeux soient ouverts sur lui et sur sa descendance,[b] afin que tu le gardes, que tu le bénisses et que tu le consacres comme peuple de ton héritage. Bénis-le de toutes tes bénédictions, dès maintenant et pour tous les jours de l’éternité. Renouvelle ton alliance et ta miséricorde envers lui et envers sa descendance, selon toute ta volonté, dans toutes les générations de la terre. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dès maintenant et pour toujours ». Littéralement : « jusqu’aux jours de l’éternité ».'
    reason: La source contient explicitement « jours », mais l’expression peut aussi désigner une durée sans fin.
  - marker: b
    text: 'Ou : « ouverts au-dessus de lui et de sa descendance ».'
    reason: La préposition guèze peut se rendre par « sur » ou, plus littéralement, par « au-dessus de ».
lexical_decisions:
- source_word: አትኅድጎ፡ ወአትትሐየዮ
  choice: Ne l’abandonne pas et ne le délaisse pas
  rationale: Deux verbes français distincts conservent le parallélisme négatif de la source sans les fondre en une seule idée.
- source_word: መዋዕለ፡ ዘለዓለም
  choice: les jours de l’éternité
  rationale: Rend explicitement መዋዕለ (« jours »), tout en conservant la formulation temporelle solennelle de la source.
- source_word: አዕይንቲከ፡ ክሡታተ፡ ላዕሌሁ
  choice: tes yeux restent ouverts sur lui
  rationale: « Sur lui » est idiomatique en français et exprime ici une vigilance bienveillante sans imposer une interprétation supplémentaire.
- source_word: ትዕቀቦ
  choice: tu le gardes
  rationale: « Garder » conserve l’amplitude du verbe, qui peut évoquer à la fois la protection, la préservation et la vigilance.
- source_word: ለሕዝብ፡ ዘለርስትከ
  choice: comme peuple de ton héritage
  rationale: Cette formulation garde le lien étroit entre l’individu, sa descendance et le peuple destiné à appartenir à Dieu, sans expliciter davantage la syntaxe condensée.
- source_word: ሣህለከ
  choice: ta miséricorde
  rationale: Le terme désigne la faveur compatissante ou la miséricorde; « miséricorde » convient au registre de la prière d’alliance.
theological_decisions:
- issue: Le passage de « lui » à « peuple »
  choice: « que tu le consacres comme peuple de ton héritage »
  alternative: « que tu le consacres pour former le peuple de ton héritage »
  rationale: La traduction retenue préserve la tension grammaticale entre l’ancêtre singulier et la réalité collective de sa descendance, au lieu d’ajouter explicitement l’idée de « former » un peuple.
- issue: Rapport entre l’alliance, la miséricorde et la volonté divine
  choice: « Renouvelle ton alliance et ta miséricorde envers lui […] selon toute ta volonté »
  alternative: « Renouvelle avec lui ton alliance et ta faveur […] en tout ce que tu veux »
  rationale: La formulation retenue conserve les deux objets coordonnés et laisse ouverte la portée exacte de « selon toute ta volonté ».
translation_notes:
  register: Français international moderne, solennel sans archaïsmes. Le tutoiement correspond à l’adresse directe à Dieu. Les répétitions temporelles et les séries verbales ont été maintenues, car elles structurent la prière et reflètent étroitement la source.
