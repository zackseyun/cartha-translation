  text: The sword of the adversary has not overcome me in all that you have given me and my children all the days of my life until this day.
translation:
  language: fr
  text: L’épée de l’adversaire ne m’a pas vaincu dans tout ce que tu m’as donné, à moi et à mes enfants, tous les jours de ma vie jusqu’à ce jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ
  choice: L’épée de l’adversaire
  rationale: Rend directement le groupe nominal guèze, en conservant l’image de l’épée et le sens général de « celui qui s’oppose ».
- source_word: ኢሞአኒ
  choice: ne m’a pas vaincu
  rationale: Exprime naturellement en français l’idée de ne pas avoir triomphé du locuteur.
- source_word: በኵሉ፡ ዘወሀብከኒ፡ ወለውሉድየ
  choice: dans tout ce que tu m’as donné, à moi et à mes enfants
  rationale: Préserve la portée de « tout » et rend explicite, sans modifier le sens, que le don concerne le locuteur et ses enfants.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: tous les jours de ma vie jusqu’à ce jour
  rationale: Formulation française fidèle à l’expression temporelle du texte source.
theological_decisions:
- issue: Identité de « l’adversaire »
  choice: Conserver le nom commun « l’adversaire »
  alternative: Employer « Satan » ou « l’ennemi »
  rationale: Le texte source dit « adversaire/ennemi » sans identifier explicitement une figure personnelle précise; la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du texte source tout en évitant une tournure artificielle; aucune note n’est nécessaire.
