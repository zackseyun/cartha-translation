  text: And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance[16]. And may he strengthen you and bless you, and may you inherit the whole earth.
translation:
  language: fr
  text: Qu’il te purifie de toute souillure et de toute impureté, afin de pardonner toutes tes transgressions et les fautes commises sans le savoir[a]. Qu’il te fortifie et te bénisse, et que tu hérites de toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « fautes commises sans le savoir » est textuellement difficile. Le guèze semble distinguer les transgressions délibérées des erreurs commises sans pleine connaissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኵሰት፡ ወርኩስ
  choice: souillure et […] impureté
  rationale: Le doublet du guèze est conservé sans chercher à fondre les deux termes en une seule notion.
- source_word: አበሳከ
  choice: tes transgressions
  rationale: « Transgressions » exprime des manquements graves ou délibérés et maintient le contraste apparent avec les fautes commises sans le savoir.
- source_word: ዘበአያእምሮ፡ ጌገይከ
  choice: les fautes commises sans le savoir
  rationale: Cette formulation française naturelle conserve l’idée d’erreurs liées à l’absence de connaissance, sans trancher davantage un texte lexicalement difficile.
- source_word: ትረስ፡ ኵላ፡ ምድረ
  choice: que tu hérites de toute la terre
  rationale: Le verbe successoral est rendu par « hériter », tandis que « terre » préserve la portée potentiellement territoriale ou universelle du nom.
theological_decisions:
- issue: Rapport entre les transgressions et les fautes commises sans le savoir
  choice: Maintenir deux catégories coordonnées
  alternative: Comprendre la seconde expression comme une simple reformulation de toutes les fautes
  rationale: Le guèze semble distinguer les transgressions des erreurs commises sans pleine connaissance; la traduction préserve cette tension sans construire une doctrine précise des degrés de culpabilité.
- issue: Étendue de « toute la terre »
  choice: Conserver la formulation non explicitée
  alternative: Préciser « tout le pays » ou « le monde entier »
  rationale: Le terme peut être compris comme terre, pays ou monde selon le contexte; « toute la terre » maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « Qu’il… » restitue la série de souhaits ou de bénédictions du texte source; le doublet « souillure… impureté » est volontairement conservé.
