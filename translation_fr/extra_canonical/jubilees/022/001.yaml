  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
translation:
  language: fr
  text: Il arriva que, dans la première semaine du quarante-quatrième jubilé, dans la deuxième année de cette semaine — l’année où Abraham mourut —, Isaac et Ismaël vinrent du Puits du Serment[a] pour célébrer avec Abraham, leur père, la fête des Semaines, cette fête des prémices de la moisson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Beer-Shéba.
    reason: identification géographique
lexical_decisions:
- source_word: ሱባዔ
  choice: semaine
  rationale: Dans le système chronologique propre au livre des Jubilés, le terme désigne ici une semaine d’années; la formulation littérale conserve ce repère sans l’aplanir.
- source_word: አርብዓ፡ ወአርባዕቱ፡ ኢዮቤልዉ
  choice: quarante-quatrième jubilé
  rationale: Les mots guèzes donnent explicitement «quarante et quatre», malgré le signe numérique problématique qui les précède dans la transcription.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Puits du Serment
  rationale: Traduction transparente du toponyme, avec une note permettant de reconnaître Beer-Shéba.
- source_word: በዓለ፡ ሱባዔያት
  choice: fête des Semaines
  rationale: Rend le nom consacré de la fête tout en restant proche de la forme du texte source.
- source_word: ዘቀዳሚ፡ ማእረር
  choice: des prémices de la moisson
  rationale: Exprime la première part de la récolte offerte lors de cette fête; évite le contresens «première fête de la moisson».
- source_word: ኀበ፡ አብርሃም፡ አቡሆሙ
  choice: auprès d’Abraham, leur père
  rationale: Conserve l’idée spatiale de ኀበ et rattache clairement «leur père» à Abraham.
theological_decisions:
- issue: Lien entre la fête des Semaines et les prémices
  choice: «la fête des Semaines, cette fête des prémices de la moisson»
  alternative: «la fête des Semaines, cette première fête de la moisson»
  rationale: Le choix retenu préserve l’identification cultuelle suggérée par le guèze et évite de transformer les prémices en rang ordinal parmi plusieurs fêtes.
- issue: Chronologie de la mort d’Abraham
  choice: Conserver «l’année où Abraham mourut» sans harmonisation explicative
  alternative: Reformuler pour préciser que la visite précède sa mort
  rationale: Le verset situe l’événement dans l’année de la mort d’Abraham sans préciser ici l’ordre exact des événements; la traduction ne doit pas ajouter une résolution absente du texte.
translation_notes:
  register: Français moderne, fluide et digne. La longue indication chronologique est conservée, mais structurée par une incise pour rester lisible. Les noms de fêtes et le toponyme traduit prennent une majuscule.
