  text: And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.
translation:
  language: fr
  text: Isaac envoya lui aussi à Abraham, par l’intermédiaire de Jacob, la meilleure offrande d’action de grâce, afin qu’Abraham mange et boive.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእዴ፡ ያዕቆብ
  choice: par l’intermédiaire de Jacob
  rationale: Littéralement « par la main de Jacob » ; l’expression indique ici que Jacob est chargé de porter l’offrande.
- source_word: ዘይሤኒ
  choice: la meilleure part
  rationale: Le terme qualifie ce qui est choisi comme le meilleur ; « part » rend naturellement en français ce qui est envoyé de l’offrande.
- source_word: መሥዋዕተ፡ ዘመድኃኒት
  choice: l’offrande d’action de grâce
  rationale: L’expression désigne une offrande liée au salut, à la délivrance ou à la reconnaissance ; « offrande d’action de grâce » convient au contexte festif sans imposer un vocabulaire confessionnel.
- source_word: ወይብላዕኒ፡ ወይስተይኒ
  choice: afin qu’il mange et boive
  rationale: Conserve les deux verbes coordonnés et leur valeur finale dans un français naturel.
theological_decisions:
- issue: Nature exacte de l’offrande
  choice: offrande d’action de grâce
  alternative: sacrifice de salut / offrande de délivrance
  rationale: La formulation choisie suit le sens contextuel de reconnaissance tout en évitant d’identifier trop précisément l’offrande à une catégorie cultuelle ultérieure.
translation_notes:
  register: Français moderne, clair et digne. La métaphore sémitique « par la main de » est rendue idiomatiquement, tandis que la structure et la finalité de l’envoi restent proches de la source.
