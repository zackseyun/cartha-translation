review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : avertissement adressé à Jacob, interdiction de prendre épouse parmi la descendance des filles de Canaan, puis annonce de l’éradication de cette descendance. Toutefois, la tournure finale géézienne correspond plus directement à « doit être déracinée / est à déraciner » qu’à un simple futur, et la note actuelle contredit inutilement le texte principal en qualifiant cette formulation modale de littérale.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « N’épouse aucune femme issue de la descendance des filles de Canaan » exprime plus explicitement la portée prohibitive que « de ne pas épouser une femme issue de… ».
  terminology: « Prends garde », « descendance » et « déracinée de la terre » sont bien choisis. « Déracinée » préserve l’image d’éradication de la racine géézienne sans la réduire à une destruction générique. Le possessif singulier « sa descendance » conserve l’ambiguïté du texte et son probable renvoi à Canaan.
  issues:
  - severity: medium
    issue: Incohérence entre la modalité du texte principal et celle annoncée comme littérale dans la note.
    rationale: Le texte dit « sera déracinée », tandis que la note présente « doit être déracinée » comme littéral. La construction source et la piste d’audit anglaise (« is to be uprooted ») appuient plus directement une formulation modale en français.
  - severity: low
    issue: Portée de l’interdiction insuffisamment explicite.
    rationale: Sous négation, « ne pas épouser une femme issue de… » est compréhensible, mais « n’épouse aucune femme issue de… » rend sans ambiguïté l’interdiction portant sur toute femme de cette lignée.
  revised_text: 'Prends garde, mon fils Jacob : n’épouse aucune femme issue de la descendance des filles de Canaan, car toute sa descendance doit être déracinée de la terre.[a]'
