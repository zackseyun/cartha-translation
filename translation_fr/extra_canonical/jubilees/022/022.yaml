  yaml_path: translation/extra_canonical/jubilees/022/022.yaml
  text: Take heed, my son Jacob, that you do not take a wife from any of the seed of the daughters of Canaan, for all his seed is to be uprooted from the earth.
translation:
  language: fr
  text: 'Prends garde, mon fils Jacob : n’épouse aucune femme issue de la descendance des filles de Canaan, car toute sa descendance doit être déracinée de la terre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute sa descendance est à déraciner de la terre ».'
    reason: La construction géézienne finale peut se rendre par une tournure modale plutôt que par un futur; les deux formulations conservent l’image d’éradication.
lexical_decisions:
- source_word: ተዐቀብ
  choice: Prends garde
  rationale: Rend naturellement l’impératif d’avertissement et de vigilance.
- source_word: አትንግእ፡ ብእሲተ
  choice: ne pas épouser une femme
  rationale: Dans ce contexte matrimonial, cette formulation française exprime clairement l’action de prendre une femme pour épouse.
- source_word: ዘርአ
  choice: descendance
  rationale: Le terme désigne la semence ou la postérité; « descendance » convient aux deux occurrences et évite une tournure artificielle.
- source_word: ለሥራዊ፡ እምድር
  choice: sera déracinée de la terre
  rationale: Préserve l’image concrète de l’éradication hors de la terre portée par la racine ś-r-w, plutôt que de la réduire à une destruction générique.
theological_decisions:
- issue: Référent du possessif dans « toute sa descendance »
  choice: sa descendance
  alternative: leur descendance / toute cette descendance
  rationale: Le singulier du texte est conservé, même si son référent peut sembler moins explicite en français; il renvoie vraisemblablement à Canaan sans résoudre silencieusement la tension grammaticale.
- issue: Force temporelle ou modale de la clause finale
  choice: sera déracinée
  alternative: doit être déracinée / est vouée à être déracinée
  rationale: Le futur exprime sobrement l’issue annoncée, sans ajouter explicitement une idée de décret ou de destinée absente de la formulation source.
translation_notes:
  register: Français international moderne, digne et direct. L’adresse paternelle est conservée, ainsi que la répétition de « descendance » et la métaphore agricole de la clause finale.
