  yaml_path: translation/extra_canonical/jubilees/022/007.yaml
  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: fr
  text: Il mangea et but, puis bénit le Dieu Très-Haut, qui avait créé le ciel et la terre, qui avait fait tous les produits de la terre et les avait donnés aux êtres humains pour qu’ils mangent, boivent et bénissent leur Créateur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ ስብሐ፡ ምድር
  choice: tous les produits de la terre
  rationale: Le nom ስብሐ peut évoquer la richesse ou l’abondance. Dans ce contexte alimentaire, « produits de la terre » exprime naturellement ce que la terre fournit sans imposer le littéralisme obscur de « graisse de la terre ».
- source_word: ለውሉደ፡ ሰብእ
  choice: aux êtres humains
  rationale: Littéralement « aux enfants des hommes »; « aux êtres humains » transmet ici le sens collectif et universel en français moderne.
- source_word: ፈጣሪሆሙ
  choice: leur Créateur
  rationale: Le possessif pluriel est conservé, ainsi que le titre divin; la majuscule marque clairement qu’il s’agit de Dieu.
theological_decisions:
- issue: Rapport temporel entre les actes d’Abraham et l’œuvre créatrice de Dieu
  choice: « qui avait créé… qui avait fait… et les avait donnés »
  alternative: « qui créa… fit… et donna » ou « qui a créé… a fait… et a donné »
  rationale: Le plus-que-parfait distingue en français les œuvres créatrices antérieures de Dieu des actions narratives d’Abraham, sans modifier leur portée théologique.
- issue: Finalité des dons de la terre
  choice: « pour qu’ils mangent, boivent et bénissent leur Créateur »
  alternative: « afin de manger, de boire et de bénir leur Créateur »
  rationale: La proposition avec sujet explicite rend sans ambiguïté que ce sont les êtres humains qui accomplissent les trois actions et préserve la bénédiction du Créateur comme finalité coordonnée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination et le parallélisme de la source sont préservés, avec des temps verbaux naturels dans un récit au passé.
