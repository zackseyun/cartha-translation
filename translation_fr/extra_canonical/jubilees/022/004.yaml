  yaml_path: translation/extra_canonical/jubilees/022/004.yaml
  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: fr
  text: En ces jours-là, Ismaël vint voir son père, et tous deux se retrouvèrent. Isaac égorgea un animal en sacrifice d’action de grâce et l’offrit sur l’autel que son père avait construit à Hébron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽአ፡ ይስማዔል፡ ይርአይ፡ አባሁ
  choice: Ismaël vint voir son père
  rationale: Rend directement le mouvement et le but exprimés par « vint » et « voir », dans un français naturel.
- source_word: መጽኡ፡ ክልኤሆሙ፡ ኅቡረ
  choice: tous deux se retrouvèrent
  rationale: Exprime l’arrivée ou la réunion commune des deux hommes sans suggérer une simple proximité physique; « tous deux » conserve explicitement la dualité.
- source_word: ጠብሐ፡ ይስሐቅ፡ መሥዋዕተ
  choice: Isaac égorgea un animal en sacrifice
  rationale: Le verbe désigne l’abattage rituel. L’ajout explicatif « un animal » évite en français l’expression peu naturelle « égorgea un sacrifice » sans préciser une espèce absente du texte.
- source_word: ለጽንሓሕ
  choice: d’action de grâce
  rationale: Suit le sens sacrificiel retenu par l’édition et la tradition textuelle consultée, avec la formulation française consacrée et intelligible.
- source_word: አዕረገ፡ ዲበ፡ ምሥዋዕ
  choice: l’offrit sur l’autel
  rationale: Rend l’action de faire monter ou présenter l’offrande sur l’autel en français idiomatique.
- source_word: ዘገብረ፡ በኬብሮን
  choice: que son père avait construit à Hébron
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la construction de l’autel; « construit » convient mieux à un autel que le générique « fait ».
theological_decisions:
- issue: Nature de l’offrande exprimée par ለጽንሓሕ
  choice: sacrifice d’action de grâce
  alternative: sacrifice de reconnaissance / offrande de communion
  rationale: « Action de grâce » préserve la valeur cultuelle indiquée par la source consultée sans importer une catégorie confessionnelle plus précise.
translation_notes:
  register: Français moderne, international et digne. La coordination sémitique répétée est allégée en deux phrases pour la lisibilité, sans retrancher d’action ni modifier l’ordre narratif.
