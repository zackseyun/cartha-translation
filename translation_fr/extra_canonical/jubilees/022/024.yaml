  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
translation:
  language: fr
  text: Et pour tous ceux qui adorent les idoles, ainsi que pour ceux qui sont odieux[a], il n’y a aucun espoir dans la terre des vivants. Car ils descendront au Shéol[b], ils iront au lieu du jugement et aucun souvenir d’eux ne subsistera sur la terre. Comme les fils de Sodome ont été retranchés de la terre, ainsi seront retranchés tous ceux qui adorent les idoles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les profanes ». Le terme guèze signifie littéralement ceux qui sont haïs ou odieux, plutôt que « les impurs ».
    reason: alternative_reading
  - marker: b
    text: Le nom « Shéol » est conservé, car le texte distingue la descente au Shéol de l’entrée dans « le lieu du jugement ».
    reason: alternative_reading
lexical_decisions:
- source_word: ጽሉአን (ṣəluʾān)
  choice: ceux qui sont odieux
  rationale: Le terme dérive de la racine « haïr » et désigne ceux qui sont haïs, odieux ou réprouvés; il ne signifie pas proprement « impurs ». Une note conserve l’autre possibilité contextuelle « profanes ».
- source_word: ሲኦል (Śəʾol)
  choice: Shéol
  rationale: Translittération du nom du séjour des morts; « enfer » préciserait indûment sa nature, tandis que le texte distingue le Shéol du lieu du jugement.
- source_word: ይትነሥኡ / ተንሥኡ
  choice: seront retranchés / ont été retranchés
  rationale: Dans ce contexte de disparition de la terre et par comparaison avec Sodome, le sens contextuel est celui d’un enlèvement ou retranchement. La répétition du même verbe est conservée en français.
- source_word: ዝክረ
  choice: souvenir
  rationale: Rend naturellement l’idée de mémoire ou de mention durable laissée sur la terre.
theological_decisions:
- issue: Rapport entre le Shéol et le jugement
  choice: Conserver « Shéol » et traduire séparément « lieu du jugement »
  alternative: Traduire Shéol par « enfer » ou « tombe »
  rationale: Le texte présente deux expressions distinctes; les fusionner résoudrait une tension eschatologique que la source laisse ouverte.
- issue: Description de ጽሉአን
  choice: ceux qui sont odieux
  alternative: les profanes / les impurs
  rationale: « Odieux » suit mieux l’étymologie et la valeur lexicale de la source; « impurs » renverrait normalement à un autre lexème guèze. « Profanes » reste possible selon le contexte et figure en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme final et la répétition de « la terre » et de « ceux qui adorent les idoles » sont maintenus afin de préserver la structure rhétorique de la source.
