  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
translation:
  language: fr
  text: N’aie pas peur, mon fils Jacob, et ne sois pas consterné, fils d’Abraham. Le Dieu Très-Haut te gardera de la corruption[a] et te délivrera de tout chemin d’égarement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te gardera de la corruption et de tout chemin d’égarement ; il te délivrera ».'
    reason: Préserve l’autre segmentation syntaxique possible des deux compléments et des deux verbes, signalée par la tradition d’audit, tout en maintenant dans le texte principal l’analyse parallèle la plus directe.
lexical_decisions:
- source_word: አትፍራህ
  choice: N’aie pas peur
  rationale: Rend directement l’interdiction exprimée par le verbe « craindre », dans un français naturel.
- source_word: አትደንግፅ
  choice: ne sois pas consterné
  rationale: Conserve l’idée d’effroi et de bouleversement sans réduire le terme à une simple inquiétude.
- source_word: አምላከ፡ ልዑል
  choice: Le Dieu Très-Haut
  rationale: Reproduit le titre divin du texte guèze dans sa forme française courante et digne.
- source_word: ይዕቀብከ
  choice: te gardera
  rationale: Exprime la protection ou la préservation indiquée par le verbe.
- source_word: ሙስና
  choice: la corruption
  rationale: Choix lexical proche du sens du substantif, préférable ici à « destruction », plus restrictif.
- source_word: ፍኖተ፡ ስሕተት
  choice: chemin d’égarement
  rationale: Rend littéralement l’image du chemin et le sens d’erreur ou d’égarement.
- source_word: ይባልሕከ
  choice: te délivrera
  rationale: Traduit le second verbe comme une action distincte de salut ou de délivrance.
theological_decisions:
- issue: Rapport syntaxique entre les deux verbes et les deux compléments
  choice: « te gardera de la corruption et te délivrera de tout chemin d’égarement »
  alternative: « te gardera de la corruption et de tout chemin d’égarement ; il te délivrera »
  rationale: 'La syntaxe guèze présente deux propositions parallèles : la garde contre la corruption, puis la délivrance hors de tout chemin d’égarement. Cette construction respecte les deux verbes sans laisser le second sans complément.'
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse paternelle directe. La répétition « mon fils Jacob… fils d’Abraham » est conservée malgré son caractère marqué, car elle appartient à la rhétorique du texte source.
