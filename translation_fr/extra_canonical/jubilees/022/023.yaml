  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: fr
  text: Car, à cause de la transgression de Cham, Canaan s’est égaré, et toute sa descendance sera effacée de la terre. Il ne restera de lui aucun survivant ni personne qui puisse échapper au jour du jugement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  choice: transgression
  rationale: Le terme désigne une faute ou une violation grave; « transgression » conserve ici la portée morale du texte.
- source_word: ስሕተ
  choice: s’est égaré
  rationale: Le verbe exprime l’idée d’errer ou de dévier; la forme pronominale est naturelle en français sans préciser davantage la nature de l’égarement.
- source_word: ዘርአ
  choice: descendance
  rationale: Dans ce contexte généalogique, « descendance » rend plus naturellement le sens collectif de « semence ».
- source_word: ይደመሰስ
  choice: sera effacée
  rationale: Ce choix conserve l’image forte d’une suppression complète sans recourir à une formulation inutilement interprétative.
- source_word: ተረፉ፡ ወዘይድኅን
  choice: aucun survivant, personne qui échappe
  rationale: La formulation maintient les deux expressions coordonnées du guèze, qui soulignent l’absence totale de reste ou de rescapé.
- source_word: ዕለተ፡ ደይን
  choice: jour du jugement
  rationale: Équivalent direct et traditionnel, immédiatement compréhensible en français moderne.
theological_decisions:
- issue: Lien entre la transgression de Cham et l’égarement de Canaan
  choice: Conserver la causalité et distinguer les deux personnages
  alternative: Reformuler en attribuant directement la transgression à Canaan
  rationale: Le texte nomme la transgression de Cham puis l’égarement de Canaan; cette tension généalogique et morale ne doit pas être harmonisée.
- issue: Portée du jugement annoncé
  choice: Maintenir l’anéantissement de toute la descendance et l’absence de survivant
  alternative: Atténuer en parlant seulement d’une défaite ou d’un exil
  rationale: Les formulations cumulatives du texte expriment explicitement une disparition totale et doivent être conservées.
translation_notes:
  register: Français moderne, digne et lisible. La structure causale est conservée, tandis que la seconde proposition est divisée en une nouvelle phrase pour éviter une période trop lourde. Aucun marqueur de note n’est requis.
