  source_fidelity: Le projet rend fidèlement la chaîne causale (« à cause de la transgression de Cham, Canaan s’est égaré »), l’annonce de la destruction de toute la descendance et la double négation finale. La formulation révisée conserve sans l’harmoniser la tension présente dans le texte entre la faute de Cham et l’égarement de Canaan.
