  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: fr
  text: Car il l’aimait plus que tous ses fils. Et Noé se coucha avec ses pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression funéraire : Noé mourut et fut réuni à ses ancêtres.'
    reason: Clarifie l’euphémisme sans le remplacer dans le texte traduit.
lexical_decisions:
- source_word: እስመ
  choice: Car
  rationale: Rend la conjonction causale qui rattache cette affirmation au contexte précédent.
- source_word: ኪያሁ
  choice: l’
  rationale: Conserve le pronom objet masculin du texte guèze sans préciser arbitrairement son référent.
- source_word: ያፈቅር፡ ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: il l’aimait plus que tous ses fils
  rationale: Reproduit directement la comparaison et le collectif « tous ses fils », dans un français naturel.
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: Et Noé s’endormit avec ses pères
  rationale: Préserve l’euphémisme funéraire et l’image traditionnelle de l’original plutôt que de les remplacer silencieusement par « mourut ».
theological_decisions:
- issue: Référent du pronom dans « il l’aimait »
  choice: Maintenir le pronom sans nommer son référent
  alternative: Expliciter « Arpakshad »
  rationale: Le nom n’apparaît pas dans le texte source fourni; l’ajouter supprimerait une dépendance contextuelle réelle.
- issue: Euphémisme relatif à la mort de Noé
  choice: « s’endormit avec ses pères »
  alternative: « mourut et rejoignit ses ancêtres »
  rationale: La formulation retenue conserve la métaphore du sommeil et l’expression ancestrale sans imposer une interprétation doctrinale de l’état des morts.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du guèze tout en étant idiomatique; le pronom ambigu et l’euphémisme funéraire sont volontairement préservés.
