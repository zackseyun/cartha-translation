  text: And for Japheth came out the third portion beyond the river Tina, toward the north of the outflow of its waters, and it extends northeastward to the whole region of Gog and to all the country east of it.
translation:
  language: fr
  text: Pour Japhet échut le troisième lot, au-delà du fleuve Tina, au nord de l’endroit où ses eaux se déversent ; il s’étend vers le nord-est jusqu’à toute la région de Gog et à tout le pays situé à l’est de celui-ci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልት (makfalt)
  choice: lot
  rationale: Dans le contexte du partage territorial entre les descendants de Noé, « lot » exprime naturellement une portion de territoire attribuée.
- source_word: Tina
  choice: Tina
  rationale: Le nom géographique est conservé par translittération, son identification restant incertaine.
- source_word: Gog
  choice: Gog
  rationale: La forme traditionnelle et internationalement reconnaissable du nom propre est maintenue.
- source_word: extends northeastward
  choice: s’étend vers le nord-est
  rationale: Formulation géographique claire et naturelle, sans préciser davantage une orientation que le témoignage consulté laisse générale.
