  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
translation:
  language: fr
  text: 'La troisième langue. Et à Méchek échut le sixième lot : toute la région au-delà de la troisième langue.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልሳን፡ ሣልስት
  choice: la troisième langue
  rationale: Rend littéralement « langue » et conserve le fragment initial, qui semble reprendre la fin de la délimitation précédente.
- source_word: ለሞስክ
  choice: pour Méchek
  rationale: Transcription française usuelle du nom biblique correspondant à Mesek/Meshech.
- source_word: ወፅአ፡ መክፈልት፡ ሳድስ
  choice: échut le sixième lot
  rationale: Dans le contexte d’un partage territorial, « échut » exprime naturellement l’attribution du lot tout en rendant l’idée de « sortir » lors du tirage.
- source_word: ኵሉ፡ ማዕዶተ
  choice: toute la région au-delà
  rationale: ማዕዶተ évoque l’autre côté ou ce qui se trouve au-delà; cette formulation conserve la valeur spatiale relevée par la révision.
