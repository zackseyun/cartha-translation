  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
translation:
  language: fr
  text: Pour Tubal échut une cinquième part, au milieu de la langue de terre qui s’avance vers la part de Lud, jusqu’à l’autre langue de terre, dans la région située au-delà de cette autre langue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation géographique du texte guèze est obscure; la fin peut aussi se comprendre ainsi : « jusqu’à l’autre langue de terre, à l’intérieur de la région de l’autre langue ».'
    reason: Préserver l’incertitude syntaxique ou textuelle signalée par la tradition de traduction, sans effacer le sens premier de « au-delà ».
lexical_decisions:
- source_word: ወለቱቤልሂ
  choice: Pour Toubal aussi
  rationale: La forme nomme explicitement Toubal; « aussi » rend la particule enclitique et inscrit la phrase dans la série des attributions.
- source_word: ወፅአ፡ መክፈልት፡ ኃምስ
  choice: échut une cinquième part
  rationale: Le verbe signifie littéralement « sortit »; dans le contexte d’un partage territorial, « échut » exprime naturellement l’attribution sans en modifier le sens.
- source_word: ልሳን
  choice: langue de terre
  rationale: Le terme signifie littéralement « langue » et désigne ici vraisemblablement une formation géographique; l’ajout « de terre » rend l’image compréhensible tout en préservant sa forme.
- source_word: መክፈልተ፡ ሉድ
  choice: la part de Loud
  rationale: Rend directement le territoire attribué à Lud, avec la forme française « Loud » cohérente avec la translittération du nom.
- source_word: ማዕዶተ
  choice: située au-delà de
  rationale: Le terme indique le côté opposé ou ce qui se trouve au-delà, plutôt qu’une simple localisation à l’intérieur d’une région.
theological_decisions: []
