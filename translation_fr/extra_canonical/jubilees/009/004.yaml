  text: And this is the land that came out for Ham, as the portion which he was to occupy forever, for himself and for his sons throughout their generations forever.
translation:
  language: fr
  text: Et voici le pays qui revint à Cham comme part qu’il devait occuper pour toujours, pour lui et pour ses fils, de génération en génération, pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልት (makfalt)
  choice: part
  rationale: Rend naturellement l’idée d’une portion de territoire attribuée par le sort, sans ajouter un vocabulaire juridique absent du contexte.
- source_word: ወፅአ (waṣ'a)
  choice: échut
  rationale: Dans le contexte du partage des terres par tirage au sort, « échut » exprime avec concision qu’un territoire revint à Cham.
- source_word: ለውሉዱ / ውሉድ
  choice: pour ses fils
  rationale: Le terme désigne ici les descendants immédiats de Cham dans la formule de transmission générationnelle; « fils » conserve la formulation généalogique du récit.
theological_decisions:
- issue: Portée perpétuelle de l’attribution territoriale
  choice: Conserver les deux occurrences de « pour toujours »
  alternative: Supprimer la seconde comme répétition stylistique
  rationale: La répétition souligne la permanence de l’attribution et doit être préservée plutôt que lissée, sans en tirer une conclusion théologique supplémentaire.
translation_notes:
  register: Français moderne, digne et accessible. « Échut » reste courant dans le contexte d’un partage par le sort; la répétition finale est volontairement conservée pour refléter l’insistance du texte.
