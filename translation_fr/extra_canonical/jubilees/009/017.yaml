base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
translation:
  language: fr
  text: Il vécut dix-neuf jubilés, deux semaines et cinq ans. Il vécut sur la terre plus longtemps que les enfants des hommes, à l’exception d’Hénoch, à cause de la justice dans laquelle il était devenu parfait. Car Hénoch fut établi comme témoin pour les générations du monde, afin qu’il raconte toutes les œuvres de génération en génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ
  choice: dix-neuf jubilés, deux semaines et cinq ans
  rationale: Rend directement les unités chronologiques du texte guèze; « semaine » désigne ici une période de sept ans dans le système jubilaire.
- source_word: ዘአፈድፈደ፡ ሐዩዎ፡ ዲበ፡ ምድር፡ እምውሉደ፡ ሰብእ
  choice: Il surpassa ainsi en longévité tous les humains sur la terre
  rationale: Exprime naturellement en français l’idée qu’il vécut sur terre plus longtemps que les autres descendants d’Adam.
- source_word: ጽድቅ፡ ዘባቲ፡ ፍጹመ፡ ኮነ
  choice: la justice dans laquelle il était parvenu à la perfection
  rationale: Conserve le lien explicite entre sa longévité, sa justice et l’accomplissement ou la perfection atteinte dans celle-ci.
- source_word: ገብሩ፡ ለሄኖክ፡ ተፈጥሮተ
  choice: la mission d’Hénoch avait été instituée
  rationale: « Mission » rend ici la fonction ou l’œuvre assignée à Hénoch; « instituée » restitue le passif de ተፈጥሮተ sans suggérer qu’Hénoch lui-même aurait été créé à ce moment-là.
- source_word: ለስምዕ
  choice: pour servir de témoignage
  rationale: Rend la finalité testimoniale attribuée à la mission d’Hénoch.
- source_word: ይንገር፡ ኵሎ፡ ግብረ
  choice: qu’il raconte […] toutes leurs actions
  rationale: Conserve le sens verbal de relater ou déclarer l’ensemble des actes aux générations.
theological_decisions:
- issue: Portée de la perfection du personnage
  choice: « la justice dans laquelle il était parvenu à la perfection »
  alternative: « sa justice parfaite »
  rationale: La formulation retenue suit la syntaxe du texte et évite de transformer cette appréciation narrative en affirmation doctrinale abstraite d’une perfection absolue.
- issue: Fonction d’Hénoch
  choice: « la mission d’Hénoch avait été instituée »
  alternative: « l’œuvre d’Hénoch avait été créée »
  rationale: Le contexte décrit une fonction testimoniale destinée aux générations. « Mission » est naturel et laisse ouverte la nature précise de cette charge.
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase explicite le verbe sous-entendu par l’énoncé chronologique. « Tous les humains » rend idiomatiquement « les enfants des hommes ». Aucun renvoi à la note anglaise héritée n’est conservé, car elle appartient au passage précédemment mal aligné sur la construction de Babel.
