  text: And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that descends is not destroyed.
translation:
  language: fr
  text: Il s’étend jusqu’à toutes les montagnes de feu, puis vers l’ouest jusqu’à la mer d’Atel. Il continue vers l’ouest jusqu’à la mer de Maouk, cette mer dans laquelle rien de ce qui descend ne périt.
