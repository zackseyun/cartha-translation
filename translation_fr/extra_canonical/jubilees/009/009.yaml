  yaml_path: translation/extra_canonical/jubilees/009/009.yaml
  text: And the prince of spirits, Mastema, came and said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."
translation:
  language: fr
  text: 'Alors le prince des esprits, Mastéma[a], vint et dit : « Seigneur, Créateur, laisse-m’en quelques-uns, afin qu’ils écoutent ma voix et fassent tout ce que je leur dirai. Car si aucun ne m’est laissé, je ne pourrai exercer l’autorité de ma volonté parmi les êtres humains. En effet, ils servent à corrompre et à égarer avant mon jugement[b], car le mal des êtres humains est grand. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression guèze peut littéralement se comprendre comme « l’ange » ou « le messager des esprits » ; dans le contexte de Jubilés, elle est rendue ici par « le prince des esprits, Mastéma ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « en vue de mon jugement ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: Mastéma, l’ange des esprits
  rationale: መልአክ désigne d’abord un ange ou messager, et መናፍስት signifie « esprits ». La formulation conserve explicitement le titre présent dans le guèze tout en identifiant naturellement Mastéma.
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: laisse-m’en quelques-uns
  rationale: Le verbe exprime l’idée de laisser subsister ou épargner une partie d’entre eux pour Mastéma. « Quelques-uns » rend l’indéfini sans anticiper la proportion précisée dans la suite du récit.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: exercer l’autorité de ma volonté
  rationale: Cette formulation garde les deux notions distinctes du texte, l’autorité et la volonté, sans réduire l’expression à « exercer mon pouvoir ».
- source_word: ውሉደ፡ ሰብእ
  choice: les êtres humains
  rationale: Équivalent français actuel et inclusif de l’expression littérale « les enfants des hommes ».
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: pour corrompre et égarer
  rationale: Les deux infinitifs indiquent respectivement la corruption et l’action de détourner ou d’égarer.
theological_decisions:
- issue: Nature et titre de Mastéma
  choice: Mastéma, l’ange des esprits
  alternative: le prince des esprits, Mastéma
  rationale: Le sens lexical direct de መልአክ est « ange/messager ». La traduction ne transforme donc pas silencieusement ce titre en rang princier, tout en signalant cette autre compréhension en note.
- issue: Rapport des esprits au jugement de Mastéma
  choice: avant mon jugement
  alternative: en vue de mon jugement
  rationale: La préposition ቅድመ signifie normalement « devant/avant ». La traduction maintient la tension du texte, qui attribue ici un jugement à Mastéma, sans en préciser la nature ni la finalité.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le discours direct garde une solennité biblique sobre. « Êtres humains » remplace l’expression littérale « enfants des hommes » pour une lecture naturelle, tandis que les formulations théologiquement difficiles du titre de Mastéma et de « mon jugement » restent visibles.
