  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
translation:
  language: fr
  text: 'Au trente-troisième jubilé, dans la première année de la deuxième semaine d’années, Péleg prit pour femme Lomna, fille de Shinéar. Elle lui donna un fils la quatrième année de cette semaine. Il l’appela Réou, car il dit : « Voici que les fils des hommes sont devenus mauvais à cause du projet pervers qu’ils ont de se bâtir une ville et une tour dans le pays. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው
  choice: jubilé
  rationale: Terme chronologique propre au livre, conservé de manière formelle et intelligible en français biblique courant.
- source_word: ሱባዔ
  choice: semaine d’années
  rationale: Le contexte chronologique désigne une période de sept ans ; l’explicitation évite de faire croire à une semaine de sept jours.
- source_word: ፋሌክ
  choice: Péleg
  rationale: Forme française biblique usuelle du nom.
- source_word: ሎምና
  choice: Lomna
  rationale: Translittération directe du nom propre éthiopien.
- source_word: ሲናአር
  choice: Shinéar
  rationale: Forme française biblique courante du toponyme.
- source_word: ራገው
  choice: Réou
  rationale: Forme française biblique usuelle du nom correspondant à Reu.
- source_word: ውሉደ፡ ሰብእ
  choice: les fils des hommes
  rationale: Rend littéralement l’expression tout en conservant son écho biblique.
- source_word: በምክረ፡ ዐግ
  choice: dans leur dessein pervers
  rationale: Rend l’idée d’un conseil ou projet mauvais sans imposer une interprétation doctrinale.
- source_word: ሀገረ፡ ወማኅፈደ
  choice: une ville et une tour
  rationale: Correspond aux deux constructions projetées dans le récit de Babel.
theological_decisions:
- issue: Lien entre la méchanceté humaine et le projet de construction
  choice: '« sont devenus mauvais : dans leur dessein pervers, ils veulent se bâtir… »'
  alternative: « sont devenus mauvais à cause du dessein pervers de se bâtir… »
  rationale: La formulation retenue préserve le lien étroit du texte entre la corruption morale et le projet, sans trancher excessivement si le dessein est la cause, la manifestation ou le cadre de cette méchanceté.
translation_notes:
  register: Français moderne, digne et narratif. « Semaine d’années » explicite la chronologie jubilaire. Le fragment initial « génération(s) jusqu’au jour du jugement » a été traité comme la fin du verset précédent, puisqu’il précède la nouvelle notice chronologique et ne s’intègre pas syntaxiquement à Jubilés 9:18. La note anglaise sur les dimensions de la tour n’a pas été reprise, car elle concerne un autre passage et non le texte de ce verset.
