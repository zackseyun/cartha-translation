revisions:
- from: 'Au trente-troisième jubilé, la première année de la deuxième semaine d’années, Péleg prit pour femme Lomna, fille de Shinéar. Elle lui donna un fils la quatrième année de cette semaine. Il l’appela Réou, car il dit : « Voici que les fils des hommes sont devenus mauvais : dans leur dessein pervers, ils veulent se bâtir une ville et une tour dans le pays. »'
  to: 'Au trente-troisième jubilé, dans la première année de la deuxième semaine d’années, Péleg prit pour femme Lomna, fille de Shinéar. Elle lui donna un fils la quatrième année de cette semaine. Il l’appela Réou, car il dit : « Voici que les fils des hommes sont devenus mauvais à cause du projet pervers qu’ils ont de se bâtir une ville et une tour dans le pays. »'
  rationale: La révision est limitée à la syntaxe chronologique et au rapport entre la dégradation morale et le projet de bâtir, afin de suivre de plus près le guèze et la piste d’audit anglaise (« through the wicked purpose to build »). Le fragment initial de l’extrait guèze, relevant syntaxiquement de la phrase précédente dans cette présentation éditoriale, n’est pas intégré au verset. La note anglaise sur des dimensions de tour est étrangère au présent verset et n’est donc pas reproduite.
