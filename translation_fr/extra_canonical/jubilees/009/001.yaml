  verdict: revise
  source_fidelity: La structure des deux attributions territoriales, Sem puis Madaï, ainsi que les îles et les frontières, est bien rendue. Toutefois, ይቀርብ signifie «s’approche» plutôt que «rejoints»; la formulation actuelle affirme un contact/une jonction plus net que le texte. Pour Madaï, «territoires» est une explicitation qui ne figure pas dans le texte et peut être évitée tout en conservant la construction géographique difficile.
  naturalness: Le français est clair et de registre approprié. «À Madaï échut une part» est naturel dans une narration de partage. «À partir de l’ouest de ses deux frères» est un peu elliptique, mais cette étrangeté reflète la formulation topographique du texte et reste intelligible.
  terminology: «Part», «prendre possession», «îles» et «frontières» conviennent au contexte d’un lotissement. «Sem» et «Madaï» sont des formes françaises usuelles. La tournure «prenne possession» rend convenablement le verbe de possession sans lui imposer la violence de «s’emparer».
  issues:
