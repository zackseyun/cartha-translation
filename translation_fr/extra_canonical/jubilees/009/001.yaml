  yaml_path: translation/extra_canonical/jubilees/009/001.yaml
  text: And for the south there came out his portion[1], for Shem, as far as it approaches the middle of the sea. And for Madai there came out a portion, that he should possess from the west of his two brothers, as far as the islands and as far as their borders.
translation:
  language: fr
  text: Pour le sud, sa part échut à Sem, jusqu’à l’endroit où elle s’approche du milieu de la mer.[a] À Madaï échut une part afin qu’il prenne possession, à partir de l’ouest de ses deux frères, jusqu’aux îles et jusqu’à leurs frontières.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de cette section sur le partage des terres est fragmentaire dans les données du chapitre qui nous sont parvenues; certains lieux et certains tracés de frontières demeurent donc incertains.
    reason: segmentation_note
lexical_decisions:
- source_word: ውሳጥያቲሁ
  choice: sa part
  rationale: Dans ce contexte de répartition territoriale, le terme désigne le lot ou la portion attribuée; «part» est naturel et cohérent avec la suite.
- source_word: ይቀርብ
  choice: elle rejoint
  rationale: Le verbe exprime l’idée de s’approcher ou d’atteindre; «rejoint» donne en français une limite géographique intelligible sans préciser abusivement le tracé.
- source_word: መክፈልት
  choice: une part
  rationale: Le substantif renvoie à une portion issue d’un partage territorial.
- source_word: የአኅዝ
  choice: qu’il prenne possession
  rationale: Le verbe peut signifier saisir, tenir ou posséder; dans un partage de terres, «prendre possession» conserve l’action sans la connotation violente de «s’emparer».
- source_word: ለክአኢሆሙ፡ አኅዊሁ
  choice: des territoires de ses deux frères
  rationale: ክአኢ indique explicitement «deux». L’ajout explicatif «territoires» rend en français le rapport géographique impliqué par «depuis l’ouest de ses deux frères», sans transformer les frères eux-mêmes en point cardinal.
- source_word: ደስያት
  choice: les îles
  rationale: Équivalent direct du terme géographique au pluriel.
- source_word: ጽነፊሆን
  choice: leurs frontières
  rationale: Le terme désigne des extrémités, limites ou frontières; «frontières» convient au partage territorial, tout en laissant le référent du possessif aussi ouvert que le texte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible, avec une syntaxe de répartition territoriale. La répétition de «échut une part» préserve la structure formelle du texte; l’incertitude géographique n’est pas résolue artificiellement.
