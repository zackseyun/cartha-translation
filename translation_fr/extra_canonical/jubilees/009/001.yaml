  to: Pour le sud, sa part échut à Sem, jusqu’à l’endroit où elle s’approche du milieu de la mer.[a] À Madaï échut une part afin qu’il prenne possession, à partir de l’ouest de ses deux frères, jusqu’aux îles et jusqu’à leurs frontières.
