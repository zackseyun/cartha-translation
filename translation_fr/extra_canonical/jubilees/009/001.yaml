    issue: «où elle rejoint le milieu de la mer»
    rationale: Le verbe ge’ez exprime l’approche, non nécessairement l’atteinte ou la jonction. «où elle s’approche du milieu de la mer» préserve cette nuance.
  - severity: low
    issue: Ajout de «territoires»
    rationale: Le texte dit littéralement «depuis/à partir de l’ouest de ses deux frères». L’ajout interprète les frères comme des territoires; il est plausible dans le contexte, mais non requis par le texte.
