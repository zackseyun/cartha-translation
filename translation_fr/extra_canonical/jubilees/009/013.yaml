revisions:
- from: Nous avons parlé à Noé de cela, ainsi que de leurs tromperies[a], afin qu’ils soient guéris par les plantes de la terre. Noé mit par écrit dans un livre tout ce que nous lui avions enseigné sur les différentes sortes de remèdes, et les esprits[b] furent maîtrisés.
  to: Nous avons parlé à Noé de leurs tromperies[a], afin qu’ils soient guéris par les plantes de la terre. Noé mit par écrit dans un livre tout ce que nous lui avions enseigné concernant toutes sortes de remèdes, et les esprits[b] furent retenus.
  rationale: La révision retire l’explicitation non attestée « de cela » tout en conservant le sens lexical de « leurs tromperies » et l’ambiguïté du pluriel dans « afin qu’ils soient guéris ». Elle améliore aussi le rendu de la retenue des esprits sans leur attribuer explicitement une qualification morale absente du verset.
