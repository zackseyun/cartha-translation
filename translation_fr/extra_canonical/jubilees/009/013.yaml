  - severity: low
    issue: « Furent maîtrisés » est moins précis que le passif de retenue/entrave
    rationale: Le verbe exprime que les esprits sont contenus ou retenus; « maîtrisés » peut évoquer une soumission ou une domination plus active que le texte ne l’indique.
