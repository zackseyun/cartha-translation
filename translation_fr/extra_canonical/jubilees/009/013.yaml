  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
translation:
  language: fr
  text: Nous avons parlé à Noé de leurs tromperies[a], afin qu’ils soient guéris par les plantes de la terre. Noé mit par écrit dans un livre tout ce que nous lui avions enseigné concernant toutes sortes de remèdes, et les esprits[b] furent retenus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leurs égarements » ou « leurs erreurs ».'
    reason: Le terme guèze peut désigner des tromperies, des égarements ou des erreurs.
  - marker: b
    text: 'Ou, d’après le contexte : « les esprits mauvais ».'
    reason: Le substantif signifie littéralement « esprits »; leur caractère mauvais ressort du contexte plutôt que d’un adjectif présent dans ce verset.
lexical_decisions:
- source_word: ምስለ፡ አስሕተትሙ፡
  choice: ainsi que de leurs tromperies
  rationale: ምስለ exprime l’accompagnement (« avec, ainsi que »), tandis que አስሕተትሙ peut désigner leurs tromperies, égarements ou erreurs. La formulation française conserve ce lien sans remplacer « avec » par « au sujet de tout ».
- source_word: በዕፀወ፡ ምድር።
  choice: par les plantes de la terre
  rationale: Rend directement les végétaux de la terre comme moyen de guérison, dans un français naturel.
- source_word: በኵሉ፡ ትዝምደ፡ ፈውሳት፡
  choice: sur les différentes sortes de remèdes
  rationale: La séquence renvoie aux catégories ou espèces de moyens de guérison. « Remèdes » convient mieux ici que l’abstrait « guérisons », puisqu’il s’agit d’un enseignement consigné.
- source_word: ወተዐጸዉ፡ መናፍስት፡
  choice: et les esprits furent maîtrisés
  rationale: Le verbe passif exprime le fait d’être contenus, retenus ou entravés. « Maîtrisés » reste lisible sans préciser davantage le mécanisme; መናፍስት signifie simplement « esprits ».
theological_decisions:
- issue: Qualification morale des esprits
  choice: les esprits
  alternative: les esprits mauvais
  rationale: Le contexte peut identifier ces esprits comme mauvais, mais le texte de ce verset ne porte pas lui-même l’adjectif. La traduction principale évite donc l’explicitation théologique, signalée seulement en note.
- issue: Référent du pluriel dans la proposition de guérison
  choice: afin qu’ils soient guéris
  alternative: afin qu’il puisse les guérir
  rationale: La forme verbale transmise est plurielle et permet une lecture passive. Même si le contexte général peut favoriser Noé comme agent de la guérison, la traduction conserve l’ambiguïté grammaticale du texte fourni.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement explicitée par « de cela, ainsi que de » afin de rendre intelligible la construction guèze très condensée, tout en maintenant la valeur d’accompagnement de ምስለ. Les ambiguïtés sur les tromperies et l’identité des esprits sont conservées ou documentées en notes.
