  source_fidelity: La formulation « de cela, ainsi que de leurs tromperies » introduit un antécédent (« cela ») qui n’est pas exprimé dans le texte guèze fourni. Elle donne en outre à « ainsi que » une fonction additive qui dépend de cet élément ajouté. Une traduction directe de አስሕተትሙ par « leurs tromperies » est préférable. « Furent retenus » rend plus exactement et plus sobrement le passif indiquant que les esprits ont été contenus ou empêchés, là où « furent maîtrisés » peut suggérer une domination active non précisée.
  naturalness: La révision supprime « de cela », qui paraît référer à une information absente et alourdit inutilement l’ouverture. « Nous avons parlé à Noé de leurs tromperies » est idiomatique en français moderne. « Concernant toutes sortes de remèdes » et « furent retenus » sont naturels dans un registre scripturaire sobre.
  terminology: '« Noé », « plantes de la terre » et « esprits » conviennent. Le terme non qualifié « esprits » doit être maintenu dans le texte principal : l’adjectif « mauvais » relève du contexte et peut rester en note. « Tromperies » est un choix défendable pour አስሕተትሙ; les possibilités « égarements » et « erreurs » sont correctement signalées. « Remèdes » convient au contexte des moyens de guérison consignés.'
