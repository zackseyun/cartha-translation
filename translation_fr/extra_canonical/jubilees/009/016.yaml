lexical_decisions:
- source_word: ውስተ፡ ሉባር፡ ደብር
  choice: sur le mont Lubar
  rationale: Le syntagme désigne naturellement le mont Lubar. Bien que ውስተ signifie souvent « dans », le français emploie idiomatiquement « sur » pour une inhumation située sur une montagne.
- source_word: በምድረ፡ አራራት
  choice: dans le pays d’Ararat
  rationale: Rend directement le complément géographique et conserve le nom traditionnel Ararat.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: Il acheva ainsi les 950 années de sa vie
  rationale: Préserve l’idée littérale d’achèvement d’une durée de vie, dans un français naturel et digne. « ainsi » relie sobrement cette mort et cet ensevelissement à l’achèvement de sa vie.
