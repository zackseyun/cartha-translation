  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
translation:
  language: fr
  text: 'Et il dit : « Qu’un dixième d’entre eux reste devant lui[a], et que les neuf parts descendent au lieu du jugement. » Puis il dit à l’un de nous[b] que nous devions enseigner à Noé tous leurs remèdes, car…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mention du dixième qui demeure conserve l’explication particulière donnée dans ce chapitre à la poursuite de l’activité démoniaque après le déluge.
    reason: cross_reference
  - marker: b
    text: 'Une traduction antérieure lisait : « Et l’un de nous dit que nous devions enseigner à Noé » ; le guèze indique plutôt que la parole est adressée à l’un de nous, tandis que l’enseignement est confié au groupe (« nous »).'
    reason: previous_rendering
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: lieu du jugement
  rationale: Rend directement l’expression guèze désignant le lieu assigné au jugement, sans préciser davantage sa nature.
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: Puis il dit à l’un de nous
  rationale: La préposition ለ marque « l’un de nous » comme destinataire et non comme sujet du verbe. « Puis » assure une transition française naturelle dans la continuité du récit.
- source_word: ንምሀር፡ ለኖኅ
  choice: d’enseigner à Noé
  rationale: Conserve la valeur finale ou injonctive de « que nous enseignions à Noé » dans une construction française naturelle après « il dit à l’un de nous ».
- source_word: ኵሎ፡ ፈውሶሙ
  choice: tous leurs remèdes
  rationale: Préserve le sens concret des moyens de guérison associés aux êtres mentionnés dans le contexte.
theological_decisions:
- issue: Explication de la persistance de l’activité démoniaque après le déluge
  choice: Conserver explicitement le dixième qui demeure et les neuf parts envoyées au jugement
  alternative: Généraliser en disant seulement qu’une partie demeure
  rationale: La répartition numérique fait partie de l’explication propre à ce passage et ne doit pas être atténuée.
- issue: Identité du sujet de « il dit »
  choice: Maintenir le pronom « il » sans identifier davantage le locuteur
  alternative: Nommer Dieu ou le chef des anges
  rationale: Le fragment fourni ne nomme pas explicitement le sujet; l’identifier trancherait une donnée contextuelle que le texte de ce verset laisse implicite.
- issue: Rôle de « l’un de nous »
  choice: En faire le destinataire de la parole
  alternative: Lire « l’un de nous dit »
  rationale: Le préfixe prépositionnel guèze ለ indique que la parole est adressée à l’un du groupe; cette personne n’est pas le sujet de ይቤ.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste claire pour un lectorat général. Les points de suspension signalent que la phrase se poursuit au verset suivant. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
