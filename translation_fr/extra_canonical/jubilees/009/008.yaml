  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
translation:
  language: fr
  text: 'Alors Mastéma, l’ange des esprits, vint et dit : « Seigneur, Créateur, laisse certains d’entre eux demeurer auprès de moi ; qu’ils écoutent ma voix et fassent tout ce que je leur dirai. Car si certains d’entre eux ne me sont pas laissés, je ne pourrai pas exercer l’autorité de ma volonté sur les êtres humains. En effet, ce sont eux qui corrompent et égarent avant mon jugement, car la méchanceté des êtres humains est grande. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: Mastéma, l’ange des esprits
  rationale: Le texte guèze nomme explicitement Mastéma et le désigne comme « l’ange des esprits ». L’apposition française restitue clairement les deux éléments.
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: laisse certains d’entre eux demeurer auprès de moi
  rationale: Rend la demande qu’une partie des esprits soit laissée à la disposition de Mastéma, sans préciser leur nombre.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: exercer l’autorité de ma volonté
  rationale: Conserve l’association inhabituelle mais significative entre autorité et volonté, plutôt que de la réduire à « exercer mon pouvoir ».
- source_word: ውሉደ፡ ሰብእ
  choice: les êtres humains
  rationale: Équivalent français moderne et inclusif de l’expression littérale « les enfants des hommes ».
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: à corrompre et à égarer
  rationale: Préserve les deux actions distinctes attribuées aux esprits.
theological_decisions:
- issue: Finalité attribuée aux esprits
  choice: ils sont destinés à corrompre et à égarer
  alternative: ils servent à corrompre et à égarer
  rationale: La formulation conserve l’orientation finale exprimée par le guèze sans développer une doctrine plus précise sur l’origine ou la permission de cette fonction.
- issue: Rapport au jugement de Mastéma
  choice: avant mon jugement
  alternative: en vue de mon jugement
  rationale: Le texte peut évoquer une antériorité ou une relation plus générale au jugement. La traduction formelle « avant mon jugement » préserve la tension du texte sans l’expliquer.
translation_notes:
  register: Français international moderne, naturel et digne. Le nom Mastéma est conservé et accentué selon l’usage français. La syntaxe reste proche du texte source là où les rapports théologiques sont ambigus.
