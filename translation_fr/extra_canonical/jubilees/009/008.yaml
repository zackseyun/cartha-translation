  source_fidelity: Le nom propre Mastéma est correctement conservé, et « l’ange des esprits » suit de près le syntagme guèze, conformément aussi à la piste d’audit anglaise. La demande qu’une partie des esprits soit laissée à Mastéma, ainsi que l’autorité qu’il souhaite exercer sur les êtres humains, sont fidèlement rendues. En revanche, « ils sont destinés à » introduit en français une nuance de destination fixée qui est plus forte que la formulation source, laquelle présente leur rôle/fonction dans la corruption et l’égarement.
