  source_fidelity: Le projet corrige à juste titre le texte anglais hors sujet et rend les deux propositions du fragment guèze. Toutefois, « après eux » est lourd et son lien syntaxique demeure insuffisamment explicité; « Telles furent ... les lots attribués » est également moins net que ne le permet le contexte de répartition territoriale. La relative finale qualifie Sem et doit être formulée de façon non ambiguë en français.
