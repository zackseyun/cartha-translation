  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
translation:
  language: fr
  text: Voici les parts qui revinrent ensuite aux fils de Noé.[a] Et Noé donna à Sem, son fils bien-aimé, tout ce qu’il avait écrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de la phrase est très condensé dans le texte guèze transmis. Le terme rendu par « parts » peut aussi évoquer des limites territoriales; la relation exacte de « ensuite » avec le membre précédent demeure incertaine.
    reason: textual_note
lexical_decisions:
- source_word: እኩያን
  choice: les lots attribués
  rationale: Le terme exprime ici l’idée de parts correspondantes ou réparties. « Lots attribués » restitue naturellement le contexte du partage territorial, sans introduire le mot « frontières », absent du texte transmis.
- source_word: እምድኅሬሆሙ
  choice: après eux
  rationale: Traduction formelle de la locution telle qu’elle est transmise, malgré l’incertitude de son rattachement dans ce bref fragment.
- source_word: ወወሀበ፡ ኵሎ፡ ዘጸሐፈ
  choice: Et Noé donna tout ce qu’il avait écrit
  rationale: Le sujet implicite est rendu explicite en français d’après le contexte; la proposition relative conserve la référence à l’ensemble des écrits.
- source_word: ዘይፈህቅ
  choice: qu’il aimait
  rationale: Rend simplement le verbe « aimer »; l’adverbe « extrêmement » de la révision anglaise n’est pas représenté dans la source fournie.
theological_decisions:
- issue: Nature de l’écrit remis à Sem
  choice: tout ce qu’il avait écrit
  alternative: tous ses écrits sacrés
  rationale: La source ne qualifie ni le contenu ni le statut théologique de l’écrit; la traduction évite donc toute précision doctrinale ajoutée.
translation_notes:
  register: Français international moderne, sobre et narratif. Le tour « après eux » est conservé afin de ne pas effacer l’ambiguïté syntaxique du fragment guèze; une note signale l’autre compréhension possible.
