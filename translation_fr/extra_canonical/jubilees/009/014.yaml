  terminology: « Parts » convient mieux que « lots attribués » dans ce contexte, tout en évitant de trancher indûment entre parts territoriales et limites. « Tout ce qu’il avait écrit » reproduit correctement l’absence de qualification du document dans la source. Le texte anglais de l’audit trail est manifestement celui d’un autre passage et ne doit pas guider la traduction.
