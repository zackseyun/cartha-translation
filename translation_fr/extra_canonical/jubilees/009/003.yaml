translation_notes:
  register: Français moderne, clair et digne. La répétition des « eaux » est maintenue parce qu’elle structure la description géographique. Le sujet implicite est rendu par « elle », dans la continuité de la limite territoriale décrite par le contexte, sans ajouter d’identification géographique.
