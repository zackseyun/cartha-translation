  yaml_path: translation/extra_canonical/jubilees/009/003.yaml
  text: And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the great sea, until it approaches the river Gihon; and it goes along the south of the waters of Gihon to the bank of this river.
translation:
  language: fr
  text: Elle se dirige vers le nord jusqu’aux confins de Gadir, puis vers le littoral des eaux de la Grande Mer, jusqu’à ce qu’elle approche du fleuve Guihon ; elle longe ensuite, au sud, les eaux du Guihon jusqu’à la rive de ce fleuve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕረ፡ ዐቢይ (bāḥr ʿabiy)
  choice: la Grande Mer
  rationale: Conserve l’expression géographique « grande mer » comme nom descriptif, plutôt que de la réduire à « de grandes eaux ».
- source_word: ጌዮን / Gihon
  choice: Guihon
  rationale: Emploie la forme française traditionnelle et immédiatement reconnaissable du nom du fleuve.
- source_word: ጋዲር / Gadir
  choice: Gadir
  rationale: Translittération sobre du toponyme, sans identification géographique conjecturale.
- source_word: ደንገጉ / rive, bord
  choice: la rive
  rationale: Rend précisément le repère fluvial final de la délimitation.
