  rationale: Suit le sens temporel transmis par le texte guèze et la tradition textuelle consultée, sans préciser davantage le nombre ou la période.
- source_word: አስምዐ
  choice: rendit témoignage
  rationale: Conserve la portée solennelle du verbe, qui peut évoquer le fait d’attester, de témoigner ou d’adresser un avertissement formel.
- source_word: ለውሉደ፡ ውሉዱ
