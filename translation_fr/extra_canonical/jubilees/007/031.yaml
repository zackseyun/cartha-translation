  text: 'Moi aussi, mes fils, je vous ordonne de faire comme Hénoch l’ordonna à son fils dans le premier jubilé, alors qu’il vivait encore, à la septième génération : il en instruisit son fils et ses petits-fils jusqu’au jour de sa mort.'
