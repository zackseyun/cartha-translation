  text: But Shem remained with his father Noah, and he built a city near his father, by the mountain, and he called its name after the name of his wife, Sedeqetelebab[a].
translation:
  language: fr
  text: Mais Sem demeura avec son père Noé et bâtit une ville non loin de son père, près de la montagne ; il lui donna le nom de sa femme, Sedeqetelebab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sedeqetelebab » est une translittération du nom guèze. Ce nom peut conserver un sens lié à la justice, mais il est laissé sous sa forme de nom propre dans le texte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ (nabara)
  choice: resta
  rationale: Dans ce contexte narratif, le verbe exprime que Sem demeura auprès de Noé, contrairement à ses frères qui avaient bâti ailleurs; « resta » rend naturellement cette continuité en français.
- source_word: በአደ፡ አቡሁ (baʾada ʾabuhu)
  choice: près de son père
  rationale: La tournure situe la ville auprès de Noé. Cette lecture suit le sens contextuel tout en évitant une formulation française artificielle.
- source_word: ኀበ፡ ደብር (ḫaba dabr)
  choice: à proximité de la montagne
  rationale: Le syntagme localise la ville du côté de la montagne ou près d’elle; cette formulation française préserve cette valeur spatiale sans préciser indûment qu’elle se trouvait sur la montagne.
- source_word: ሴደቃቴልባብ
  choice: Sedeqatelebab
  rationale: Le nom propre est translittéré depuis le guèze plutôt que traduit, car son étymologie et sa segmentation exactes restent incertaines.
