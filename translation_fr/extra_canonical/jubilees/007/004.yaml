  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: fr
  text: Il prépara d’abord le chevreau et mit de son sang sur la chair qui se trouvait sur l’autel qu’il avait construit. Il fit monter sur l’autel toute sa graisse, là où il avait offert l’holocauste, ainsi que le bœuf, le bélier et les moutons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation de la fin du verset est elliptique dans le texte transmis; elle peut aussi se comprendre: « là où il avait offert en holocauste le bœuf, le bélier et les moutons » ou « avec le bœuf, le bélier et les moutons ».'
    reason: Préserver l’ambiguïté réelle du rattachement syntaxique de la liste finale plutôt que choisir silencieusement une seule lecture.
lexical_decisions:
- source_word: ማሕስአ
  choice: le chevreau
  rationale: Le terme désigne ici un jeune caprin destiné au sacrifice; « chevreau » est précis et naturel.
- source_word: አዕረገ
  choice: fit monter
  rationale: Conserve l’image concrète de la montée associée à l’offrande sur l’autel, sans la réduire silencieusement à un terme rituel plus interprétatif.
- source_word: ስብሖ
  choice: toute sa graisse
  rationale: Le suffixe renvoie vraisemblablement au chevreau; « sa » explicite naturellement ce lien en français.
- source_word: ጽንሓሐ
  choice: le bœuf
  rationale: Rendu conformément au sens animal sacrificiel attesté dans le contexte et à la tradition textuelle de ce passage.
- source_word: ላህመ
  choice: le bélier
  rationale: Le contexte énumère les autres animaux offerts; « bélier » maintient la distinction attendue.
- source_word: አባግዐ
  choice: les moutons
  rationale: Le pluriel collectif est rendu simplement par « les moutons ».
theological_decisions:
- issue: Sens sacrificiel de « faire monter »
  choice: Il fit monter sur l’autel toute sa graisse
  alternative: Il offrit toute sa graisse sur l’autel
  rationale: La formulation retenue préserve l’image verbale sémitique et son possible double écho, à la fumée qui monte et à l’acte d’offrir, sans imposer une interprétation unique.
- issue: Rapport syntaxique de la liste finale des animaux
  choice: ainsi que le bœuf, le bélier et les moutons, avec une note
  alternative: présenter sans réserve tous les animaux comme objets directs de « fit monter »
  rationale: Le texte transmis rattache la liste finale de manière abrupte à la proposition précédente. La traduction reste lisible tout en signalant l’ellipse ou l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. « Autel », « holocauste » et « bélier » conservent le registre sacrificiel ancien; la syntaxe est légèrement réorganisée pour être naturelle en français, sans effacer l’ambiguïté finale.
