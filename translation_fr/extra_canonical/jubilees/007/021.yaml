- from: 'Et l’impureté, ainsi que toute révolte. Car c’est à cause de ces trois choses que le déluge survint sur la terre : à cause de l’inconduite sexuelle à laquelle les Veilleurs se livrèrent, contrairement au commandement qui leur avait été donné, en allant vers les filles des hommes. Ils prirent pour femmes toutes celles qu’ils choisirent et furent les premiers à commettre l’impureté.'
  to: 'Et l’impureté, et toute injustice. Car c’est à cause de ces trois choses que le déluge survint sur la terre : à cause de l’inconduite sexuelle à laquelle les Veilleurs se livrèrent, contrairement au commandement qui leur avait été donné, en allant vers les filles des hommes. Ils prirent pour eux des femmes parmi toutes celles qu’ils choisirent et inaugurèrent l’impureté.'
  rationale: La révision corrige la nuance trop étroite de « révolte » et rend la conclusion plus directement conforme à l’expression guèze. Elle maintient l’ambiguïté relative au contenu et à l’origine du commandement, sans importer la note anglaise sur les groupes de géants, qui ne correspond pas à ce verset.
