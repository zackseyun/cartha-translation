base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
translation:
  language: fr
  text: 'Et l’impureté, et toute injustice. Car c’est à cause de ces trois choses que le déluge survint sur la terre : à cause de l’inconduite sexuelle à laquelle les Veilleurs se livrèrent, contrairement au commandement qui leur avait été donné, en allant vers les filles des hommes. Ils prirent pour eux des femmes parmi toutes celles qu’ils choisirent et inaugurèrent l’impureté.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵስ / ርኵሰ
  choice: impureté
  rationale: Le terme exprime ici la souillure ou l’impureté; conserver le même lexème au début et à la fin respecte l’encadrement du texte guèze.
- source_word: ዐመፃ
  choice: révolte
  rationale: Le mot peut désigner la transgression, l’iniquité ou la rébellion. « Révolte » maintient l’idée d’opposition à l’ordre prescrit sans réduire le terme à une catégorie juridique moderne.
- source_word: ዝሙት
  choice: inconduite sexuelle
  rationale: Dans ce contexte, le terme désigne une union sexuelle illicite. Cette formulation moderne et digne évite que « fornication » ne soit compris dans un sens trop étroit.
- source_word: ትጉሃን
  choice: Veilleurs
  rationale: Désignation traditionnelle des êtres angéliques vigilants dans la littérature énochique; la majuscule signale qu’il s’agit ici d’un groupe déterminé.
- source_word: አይኅ
  choice: déluge
  rationale: Dans ce contexte narratif, il s’agit du déluge qui recouvrit la terre.
- source_word: ገብሩ፡ መቅድመ፡ ርኵሰ
  choice: furent les premiers à commettre l’impureté
  rationale: Rend naturellement l’idée littérale de « faire le commencement de l’impureté » tout en conservant leur rôle inaugural.
theological_decisions:
- issue: Nature de la faute des Veilleurs
  choice: « inconduite sexuelle […] en allant vers les filles des hommes »
  alternative: « fornication […] après les filles des hommes »
  rationale: Le texte associe explicitement ዝሙት aux filles des hommes. La traduction conserve cette relation sans définir davantage la nature ontologique des Veilleurs ni imposer une interprétation confessionnelle.
- issue: Rapport au commandement
  choice: « contrairement au commandement qui leur avait été donné »
  alternative: « en s’écartant du commandement de leurs prescriptions »
  rationale: La syntaxe guèze indique que leur conduite sexuelle contrevient à un commandement les concernant. La formulation retenue reste claire sans préciser au-delà du texte l’auteur ou le contenu de ce commandement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le verset commence par un fragment coordonné, conservé afin de respecter son lien avec le verset précédent. La répétition d’« impureté » reproduit la structure lexicale du guèze. Aucune note héritée de la couche anglaise n’est reprise, car celle sur les noms de groupes géants ne correspond pas au contenu de ce verset.
