  text: And he kept its fruit, and gathered it in that year, in the seventh month. And he made wine from it, and put it into a vessel, and kept it until the fifth year, until the first day.
translation:
  language: fr
  text: Il conserva ses fruits et les récolta cette année-là, au septième mois. Il en fit du vin, le mit dans un récipient et le conserva jusqu’à la cinquième année, jusqu’au premier jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቀበ
  choice: conserva
  rationale: Le verbe exprime ici le fait de garder ou de conserver, d’abord les fruits, puis le vin. « Conserva » est naturel dans les deux contextes.
- source_word: ቀሰሞ
  choice: les récolta
  rationale: Dans le contexte des fruits d’une vigne, « récolter » rend naturellement l’action de les cueillir ou de les rassembler.
- source_word: ወይነ
  choice: du vin
  rationale: Le contexte décrit la transformation des fruits précédemment mentionnés en vin.
- source_word: ንዋይ
  choice: un récipient
  rationale: Terme général désignant ici le contenant dans lequel le vin est placé; la source ne précise pas davantage sa nature.
- source_word: ዕለት ቀዳሚት
  choice: le premier jour
  rationale: Traduction directe de l’expression telle qu’elle se trouve dans les limites du verset fourni, sans ajouter « du premier mois », qui appartient au verset suivant selon la segmentation de la source.
