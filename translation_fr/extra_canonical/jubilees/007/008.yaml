  text: And Ham saw Noah his father naked[a], and he went out and told his two brothers outside. And Shem took a garment, and he and Japheth laid the garment on their shoulders.
translation:
  language: fr
  text: Cham vit Noé, son père, nu[a]. Il sortit et le raconta à ses deux frères qui étaient dehors. Sem prit un vêtement, et lui et Japhet le posèrent sur leurs épaules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans l’édition source, le découpage est inhabituel : le verset 8 s’arrête lorsque Sem et Japhet posent le vêtement sur leurs épaules ; la suite de leur geste appartient au verset suivant.'
    reason: segmentation_note
lexical_decisions:
- source_word: ዕራቆ
  choice: nu
  rationale: Le terme désigne ici l’état de nudité de Noé; cette formulation directe respecte le texte sans ajouter la notion interprétative de « honte ».
- source_word: ነገረ
  choice: le raconta
  rationale: Le verbe signifie « dire, raconter, annoncer ». Le pronom reprend naturellement ce que Cham venait de voir.
- source_word: ልብሰ
  choice: un vêtement
  rationale: Le nom désigne de façon générale un habit ou une pièce d’étoffe; « vêtement » préserve cette généralité.
- source_word: መታክፍቲሆሙ
  choice: leurs épaules
  rationale: Le pluriel possessif renvoie aux épaules de Sem et de Japhet.
theological_decisions:
- issue: Nature du geste de Cham
  choice: 'Formulation factuelle: il voit son père nu et le raconte à ses frères.'
  alternative: Employer « dévoilé », « honte » ou préciser une faute sexuelle.
  rationale: Le texte de ce verset ne précise pas davantage la nature morale ou sexuelle du geste; la traduction conserve cette réserve.
- issue: Limite du verset
  choice: Le verset s’arrête au vêtement posé sur leurs épaules.
  alternative: Ajouter leur marche à reculons et la couverture de leur père.
  rationale: Ces actions ne figurent pas dans l’extrait guèze fourni pour 7:8 et doivent rester dans le verset suivant selon la segmentation retenue.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles « Cham », « Noé », « Sem » et « Japhet ». La syntaxe reste simple et proche de la progression du guèze.
