  yaml_path: translation/extra_canonical/jubilees/007/012.yaml
  text: 'And Ham knew that his father had cursed his youngest son, and it displeased him that he had cursed his son; and he separated from his father, he and his sons with him: Cush and Mizraim and Put and Canaan.'
translation:
  language: fr
  text: 'Cham apprit que son père avait maudit son plus jeune fils, et cela lui déplut, parce que son père avait maudit le fils de Cham. Il se sépara alors de son père, lui et ses fils avec lui : Koush, Mitsraïm, Pouth et Canaan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእመረ (ʾaʿmara)
  choice: apprit
  rationale: Dans ce contexte narratif, le verbe signifie que Cham prit connaissance de la malédiction prononcée par son père; « apprit » est plus naturel ici que « sut ».
- source_word: ዘይንእስ (zayənaʿəs)
  choice: son plus jeune fils
  rationale: Le terme désigne le fils le plus jeune ou cadet; la formulation française conserve la relation comparative sans identifier explicitement le fils.
- source_word: ሐሎሙ ኮነ ሎቱ
  choice: cela lui déplut
  rationale: Cette tournure exprime le mécontentement ou le déplaisir de Cham; la traduction est naturelle et conforme au sens du passage.
- source_word: ተፈልጠ (tafalləṭa)
  choice: se sépara
  rationale: Le verbe marque ici une séparation d’avec le père, suivie du départ de Cham avec ses fils.
- source_word: ኵስ፡ መሰጠሬም፡ ፉድ፡ ከናአን
  choice: Koush, Mitsraïm, Pouth et Canaan
  rationale: Formes françaises courantes des noms bibliques correspondants, choisies pour leur lisibilité internationale.
theological_decisions:
- issue: Identité du « plus jeune fils » maudit
  choice: Ne pas l’identifier au-delà de l’expression du texte
  alternative: Remplacer par « Canaan »
  rationale: Le texte dit seulement que le père de Cham a maudit son plus jeune fils; expliciter Canaan dans cette proposition résoudrait une tension que le verset laisse subsister.
- issue: Référent du sujet dans « il avait maudit son fils »
  choice: Conserver la formulation pronominale
  alternative: Écrire explicitement « son père avait maudit le fils de Cham »
  rationale: La syntaxe source repose sur des relations pronominales; la traduction préserve cette forme tout en restant intelligible dans le contexte.
translation_notes:
  register: Français moderne, narratif et digne. La coordination légèrement solennelle « lui et ses fils avec lui » conserve la structure emphatique de la source sans devenir obscure.
