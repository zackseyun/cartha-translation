  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: fr
  text: Il fit monter sur l’autel toute leur chair, puis il y déposa toute leur offrande, mêlée d’huile. Ensuite, il versa du vin dans le feu qui était sur l’autel, déposa de l’encens sur l’autel et fit monter un parfum agréable, bien accueilli devant le Seigneur son Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ
  choice: fit monter
  rationale: Conserve l’image sacrificielle de faire monter la chair et le parfum, sans la réduire explicitement à « brûler ».
- source_word: ልዉሰ፡ በቅብዕ
  choice: pétrie avec de l’huile
  rationale: Le participe renvoie à une offrande mélangée ou pétrie avec de l’huile; cette formulation est naturelle dans un contexte d’offrande céréalière.
- source_word: ስኂነ
  choice: encens
  rationale: Le terme désigne ici une substance aromatique brûlée; « encens » préserve cette généralité sans préciser indûment l’oliban.
- source_word: መዐዛ፡ ሠናየ
  choice: un parfum agréable
  rationale: Rend littéralement l’idée d’une bonne ou agréable odeur dans un français cultuel naturel.
- source_word: ያሠምር
  choice: bien accueilli
  rationale: Exprime l’idée d’agrément ou d’acceptation devant Dieu tout en maintenant le lien grammatical avec le parfum.
theological_decisions:
- issue: Nature de l’agrément divin
  choice: « un parfum agréable, bien accueilli devant le Seigneur son Dieu »
  alternative: « une agréable odeur qui plut au Seigneur son Dieu »
  rationale: La formulation retenue préserve le langage sacrificiel d’acceptation sans transformer explicitement l’expression en émotion divine.
- issue: Désignation divine
  choice: « le Seigneur son Dieu »
  alternative: « l’Éternel, son Dieu »
  rationale: « le Seigneur » est une désignation française digne et largement intelligible, sans imposer une tradition confessionnelle particulière.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La syntaxe suit la progression rituelle du texte guèze et conserve la répétition de « sur l’autel » lorsqu’elle clarifie les gestes successifs.
