  text: And the earth was filled with violence. And after this they sinned against the beasts and birds and everything that moves and everything that walks upon the earth, and much blood was shed upon the earth, and all—
translation:
  language: fr
  text: La terre était remplie de violence. Après cela, ils péchèrent contre les bêtes, les oiseaux et tout ce qui se meut, et contre tout ce qui marche sur la terre. Beaucoup de sang fut répandu sur la terre, et tout—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: violence
  rationale: Le terme désigne ici la violence ou l’iniquité violente; « violence » convient au contexte du sang répandu.
- source_word: አበሱ፡ ሎሙ፡ በአራዊት
  choice: ils péchèrent contre les bêtes
  rationale: Le pronom anticipatif renvoie vraisemblablement aux bêtes introduites ensuite; cette lecture respecte la syntaxe et évite d’introduire explicitement une idée absente du contexte immédiat.
- source_word: ዘይትሐወስ
  choice: tout ce qui se meut
  rationale: Rend de façon naturelle le participe relatif désignant ce qui bouge ou se déplace.
- source_word: ዘያንሶሱ
  choice: tout ce qui marche
  rationale: Conserve la distinction avec ce qui « se meut » et désigne les êtres qui circulent sur la terre.
- source_word: ወትክዐወ፡ ደም፡ ብዙኅ
  choice: Beaucoup de sang fut répandu
  rationale: Reproduit la construction passive et l’accent quantitatif du texte guèze.
theological_decisions:
- issue: Nature du péché commis envers les animaux
  choice: contre les bêtes
  alternative: contre eux-mêmes avec les bêtes
  rationale: La syntaxe guèze favorise un pronom anticipatif repris par « les bêtes »; l’autre lecture pourrait suggérer la bestialité et résout de manière spéculative une construction qui se comprend plus directement comme un péché commis contre les animaux.
- issue: Fin incomplète de l’extrait source
  choice: et tout—
  alternative: compléter la proposition d’après le contexte ou une autre édition
  rationale: Le texte fourni s’interrompt après « et tout »; le tiret préserve honnêtement cette lacune sans inventer la suite.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination et les répétitions du texte source sont conservées lorsqu’elles structurent l’énumération; la ponctuation française clarifie les unités sans effacer la fin manifestement incomplète.
