  yaml_path: translation/extra_canonical/jubilees/007/020.yaml
  text: And in the twenty-eighth jubilee, Noah began to command the ordinances and the commandments to his children's children, and all the judgments[a] that he knew. And he testified to his children that they should do righteousness, and cover the shame of their flesh, and bless their Creator,[b] and honor father and mother, and love each one his neighbor, and guard their souls from fornication and uncleanness and all iniquity.
translation:
  language: fr
  text: Au vingt-huitième jubilé, Noé commença à enseigner à ses petits-enfants les prescriptions et les commandements, ainsi que tout ce qu’il connaissait du droit.[a] Il exhorta ses enfants à pratiquer la justice, à couvrir leur nudité, à bénir celui qui les a créés,[b] à honorer père et mère, à aimer chacun son prochain et à se garder[c] de l’inconduite sexuelle, de l’impureté et de toute injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la justice » ou « des jugements ».
    reason: lexical_choice
  - marker: b
    text: 'Littéralement : « celui qui les créa » ; le pronom renvoie aux descendants auxquels Noé s’adresse.'
    reason: literal_translation
  - marker: c
    text: 'Littéralement : « à garder leurs âmes » ou « à se préserver eux-mêmes ».'
    reason: literal_translation
lexical_decisions:
- source_word: ለውሉደ፡ ውሉዱ
  choice: à ses petits-enfants
  rationale: Littéralement « aux enfants de ses enfants » ; « petits-enfants » exprime naturellement en français la génération visée.
- source_word: ፍትሐ
  choice: justice
  rationale: Le terme peut désigner la justice, le droit ou les jugements. Après « règles » et « commandements », « justice » évite une accumulation juridique artificielle et conserve le sens moral de la proposition.
- source_word: ዝሙት
  choice: inconduite sexuelle
  rationale: Rend le domaine de l’immoralité sexuelle sans limiter indûment le terme à la prostitution ni employer le français vieilli « fornication ».
- source_word: ይዕቀቡ፡ ነፍሶሙ
  choice: à se garder
  rationale: Littéralement « garder leurs âmes/eux-mêmes » ; l’expression française naturelle « se garder de » transmet ici l’idée de préservation morale.
- source_word: ለዘፈጠሮሙ
  choice: celui qui les avait créés
  rationale: Conserve la formulation relative du geʿez plutôt que de la convertir en titre théologique (« leur Créateur »).
theological_decisions:
- issue: Sens de ፍትሐ dans « tout ce qu’il connaissait de… »
  choice: justice
  alternative: jugements / droit
  rationale: Le mot admet une lecture juridique comme morale. Le texte français retient « justice » et signale l’autre possibilité en note, sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Petits-enfants » clarifie sans lourdeur « les enfants de ses enfants ». « Inconduite sexuelle » est préféré au terme vieilli « fornication ». La coordination et les infinitifs reproduisent la série d’exhortations du texte source.
