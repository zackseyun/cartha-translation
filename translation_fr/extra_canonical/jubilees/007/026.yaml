  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
translation:
  language: fr
  text: 'qu’ils ont répandu au milieu de la terre. Il détruisit tout, et nous restâmes en vie, moi, vous, mes enfants, et tous ceux qui étaient entrés avec nous dans l’arche. Et voici que je vois devant moi vos œuvres : vous ne marchez pas dans la justice. En effet, vous avez commencé à suivre les voies de la corruption ; vous vous séparez les uns des autres, vous vous combattrez les uns contre les autres et vous ne resterez pas unis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከዐዉ
  choice: qu’ils ont répandu
  rationale: Le verbe signifie « verser, répandre » et le relatif reprend le sang mentionné au verset précédent.
- source_word: ደምሰሰ ኵሎ
  choice: Il détruisit tout
  rationale: Rend le verbe au masculin singulier et conserve son sujet implicite, sans faire de « milieu de la terre » l’objet de la destruction.
- source_word: ተርፍኩ
  choice: nous restâmes en vie
  rationale: Le verbe exprime le fait de subsister ou d’être épargné ; le pluriel français anticipe naturellement l’énumération « moi, vous… ».
- source_word: ምግባሪክሙ
  choice: vos œuvres
  rationale: « Œuvres » restitue le sens de faits ou d’actions tout en gardant le registre moral du passage.
- source_word: በፍኖተ ሙስና
  choice: les voies de la corruption
  rationale: Reproduit l’image source des chemins ou voies et le sens moral de ሙስና.
- source_word: ትትፋለጡ … እም ቢጹ
  choice: vous vous séparez les uns des autres
  rationale: Le verbe indique une séparation ou une division, et እም marque l’éloignement « de », non la poursuite de quelqu’un.
- source_word: ኢትሄልዉ ኅቡረ
  choice: vous ne resterez pas unis
  rationale: Expression française naturelle pour l’idée de ne pas demeurer ensemble ou dans l’unité.
theological_decisions:
- issue: Sujet implicite de « détruisit tout »
  choice: Conserver le pronom « Il » sans identifier explicitement le sujet.
  alternative: « Dieu détruisit tout » ou « cela détruisit tout »
  rationale: La forme guèze est au masculin singulier, mais le sujet n’est pas nommé dans ce segment. L’expliciter résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français international actuel, digne et lisible. La traduction conserve le fragment relatif qui dépend du verset précédent, l’alternance temporelle du discours d’exhortation et l’ambiguïté du sujet de « détruisit ».
