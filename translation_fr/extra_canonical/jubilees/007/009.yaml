id: JUB.7.9
reference: Jubilees 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: charles_1895
  language: Geez
  text: '1. ወበሱባዔ፡ ሳብዕ፡ በ ቀዳማይ፡ ዓመት፡ ፲፫ በዝ፡ አቆቤጼዉ፡ ተከለ፡ ኖኅ፡ ወይነ፡ ኀበ፡ ደብር፡ እንተ፡ ዲቤ ፲፬ሁ፡ ፲፭ አዕረፈት፡ ታቦት፡ ዘስሙ፡ ሉባር፡ ፲፮ እምአድባረ፡ አራራት፡ ወገብረ፡ ፍሬ፡ በራብዕ፡

    2. ዓመት፡ ወዐቀበ፡ ፍሬሁ፡ ወቀሰሞ፡ በውእቱ፡ ዓመት፡ በወርኀ፡ ሳብዕ። ወገብረ፡ እም ፲፯ውስተቱ፡ ፲፰ ወይነ፡ ወወደየ፡ ውስተ፡ ንዋይ፡ ፲፱ ወዐቀቦ፡ እስከ፡ ዓመት፡ ኃምስቱ፡ ፳ እስከ፡ ዕለት፡ ፳፩ ቀዳሚት፡ ፳፪

    3. በ ፳፫ሠርቀ፡ ወርኀ፡ ቀዳሚት። ፳፬ ወ ፳፭ገብረ፡ ፳፮ዕለተ፡ ዛቲ፡ በዓለ፡ ፳፯ በፍሥሓ፡ ወገብረ፡ ጽንሓሐ፡ ለእግዚአብሔር፡ ៣ዐዋ፡ ፳፰ እምአልህምቱ፡ አሐደ፡ ወበሐኩ፡ አሐደ፡ ወ ፳፱አባግዐ፡ ፴ ዘዘ፡ ዓመት፡ ሰብዐተ፡ ወ ፴፩መሐስአ፡ ፴፪ ጢለ፡ አሐደ፡ ከመ፡ ያስተስሪ፡ ፴፫ቦቱ፡ ለ ፴፬ርእሱ፡ ወበእንተ፡ ውሉዱ።

    4. ወገብረ፡ ማሕስአ፡ ቅድመ፡ ፴፭ ወአንበረ፡ እምኔ፡ ደሙ፡ ዲበ፡ ሥጋ፡ ዘምሥዋዕ፡ ዘገብረ፡ ፴፮ወኵሎ፡ ስብሖ፡ ፴፯ አዕረገ፡ ውስተ፡ ምሥዋዕ፡ ዘኀበ፡ ገብረ፡ ጽንሓሐ፡ ወላህመ፡ ወ ፴፰በሐኩ፡ ፴፱ ወ ፵አባግዐ፡ ፵፩

    5. ወአዕረገ፡ ፵፪ኵሎ፡ ሥጋሆሙ፡ ፵፫ ዲበ፡ ምሥዋዕ። ወአንበረ፡ ፵፬ ኵሎ፡ መሥዋዕቶሙ፡ ልዉሰ፡ በቅብዕ፡ ላዕሌሁ፡ ፵፭ ወ ፵፮እም ፵፯ዝ፡ ፵፰ ፲፱ዝን፡ ወይነ፡ ውስተ፡ እሳት፡ ዘዲበ፡ ምሥዋዕ፡ ፶አንበረ፡ ወአቅደመ፡ ፶፩ ስኂነ፡ ዲበ፡ ምሥዋዕ፡ ወአዕረገ፡ ፶፪ መዐዛ፡ ሠናየ፡ ፶፫ ዘ ፶፬ያሠምር፡ ፶፭ ቅድመ፡ ፶፮ እግዚአብሔር፡ አምላኩ።

    6. ፯ ወተፈሥሐ፡ ወሰትየ፡ እም ፶፯ዝ፡ ፶፰ ወይነ፡ ውእቱ፡ ወውሉዱ፡ በፍሥሓ። ወኮነ፡ ምሴተ፡ ወቦአ፡ ውስተ፡ ሰቀላሁ፡ ወሰከበ፡ ስኩሩ፡ ፶፱ ወኖመ፡ ፷ወተከሥተ፡ በውስተ፡ ሰቀላሁ፡ እንዘ፡ ይነውም። ፷፩

    8. ፱ ወርእዮ፡ ካም፡ ለኖኅ፡ አቡሁ፡ ዕራቆ፡ ወወፅአ፡ ፷፪ ወነገረ፡ ለአሕሊ፡ አኀዊሁ፡ በአፍአ። ወ ፷፫ነሥአ፡ ፷፬ ሴም፡ ልብሰ፡ ፷፭ ወ ፷፮ነሥአ፡ ውእቱ፡ ወ ፷፯ያፌት፡ ፷፰ ወአንበሩ፡ ልብሰ፡ ዲበ፡ መታክፍቲሆሙ፡ ፷፱

    18. ወ ፸ገቢኦሙ፡ ፸፩ ድኅሪተ፡ ከደኑ፡ ፸፪ ፸፫ኀፍረተ፡ አቡሆሙ፡ ፸፬ ፸፭ወገጾሙ፡ ድኅሪተ። ፸፮ ወነቅሀ፡ ፸፯ ኖኅ፡ እምወይኑ፡ ወአእመረ፡ ኵሎ፡ ዘገብረ፡ ላዕሌሁ፡ ወልዱ፡ ዘይንእስ፡ ወረገሞ፡ ለወልዱ፡ ወይቤ፡ ርጉም፡ ከናአን፡ *ቅኑየ፡ ገብር፡ ይኩን፡ ለአኃዊሁ። ወባረኮ፡ ለሴም፡ ወይቤ፡ 11 ይትባረክ፡ እግዚአብሔር፡ አምላኩ፡ ለሴም፡ ወይኩን፡ ከናአን፡ ገብሮ። ያስፋሕ፡ እግዚአብሔር፡ 12 ለያፌት፡ ወይኅድር፡ እግዚአብሔር፡ ውስተ፡ ማኅደሪ፡ ሴም፡ ወይኩን፡ ከናአን፡ ገብሮ። ወአእመረ፡ ካም፡ ከመ፡ ረገሞ፡ አቡሁ፡ ለወልዱ፡ ዘይንእስ፡ *ወሐሎሙ፡ ኮነ፡ ሎቱ፡ እስመ፡ ረገሞ፡ 13 ለወልዱ፡ ወተፈልጠ፡ እምአቡሁ፡ ውእቱ፡ ወውሉዱ፡ ምስሌሁ፡ ኵስ፡ ወመሰጠሬም፡ ወፉድ፡ ወከናአን። ወሐነጸ፡ ሎቱ፡ ሀገረ፡ ወጸውዐ፡ ስማ፡ በስመ፡ ብእሲቱ፡ ኔእላትማኡክ። 14 ወርእየ፡ አያፌት፡ ወቀንአ፡ ለአኁሁ፡ ወሐነጸ፡ ሎቱ፡ ውእቱሂ፡ ሀገረ፡ ወሰመየ፡ ስማ፡ በስመ፡ 15 ብእሲቱ፡ አዳተኔሴስ። ወሴምሰ፡ ነበረ፡ ምስለ፡ አቡሁ፡ ኖኅ፡ ወሐነጸ፡ ሀገረ፡ በአደ፡ አቡሁ፡ ኀበ፡ 16 ደብር፡ ወጸውዐ፡ ስማ፡ ውእቱሂ፡ በስመ፡ ብእሲቱ፡ ሴደቃቴልባብ። ወናሁ፡ አህጉር፡ እላንቱ፡ 17 *ሠላስ፡ ቅሩበ፡ ሉባር፡ ደብር፡ ሴደቃቴልባብ፡ ቅድመ፡ ገጸ፡ ደብር፡ በጽባሒሁ፡ ወነእልተ ማኡክ፡ ገጸ፡ ሰሜን፡ አደተኔሴስ፡ መንገለ፡ ባሕር። ወእሉ፡ ውሉደ፡ ሴም፡ ኤላም፡ ወአሱር፡ 18 ወአርፋክስድ፡ ዝንቱ፡ ትውልደ፡ ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ፡ *ወሉድ፡ ወአራም። ውሉደ፡ 19 አያፌት፡ ጐሜር፡ ወማጉግ፡ ወማዳይ፡ ወአዩአያ፡ ቱቤል፡ ወምስክ፡ ወቲራስ፡

    20. ለሎ፡ ውሉደ፡ ኖኅ፡ ወበ፳፰ ወስብዐቲ፡* አየቤልውሳን፡* እንዘ፡* ኖኅ፡ የአዝዝ፡* ሥርዐተ፡ ወትእዛዛተ፡ ለውሉደ፡ ውሉዱ፡* ወኵሎ፡* ዘያአምር፡ ፍትሐ፡* ወአስምዐ፡ ላዕለ፡ ውሉዱ፡ ከመ፡ ይግበሩ፡ ጽድቀ፡ ወከመ፡ ይክድኑ፡ ኃፍረተ፡ ሥጋሆሙ፡ ወከመ፡ ይባርክዎ፡ ለዘፈጠሮሙ፡ ወያክብሩ፡ አበ፡ ወእመ፡ ወያፍቅሩ፡* አሐዱ፡ አሐዱ፡ ቢጾ፡* ወይዕቀቡ፡ ነፍሶሙ፡* እምዝሙት፡

    21. ወርኵስ፡ ወእምኵሉ፡ ዐመፃ። እስመ፡ በእንተ፡ *ዝንቱ፡ ሠለስቱ፡* ኮነ፡ አይኅ፡ ላዕለ፡* ምድር፡ እስመ፡ በእንተ፡ ዝሙት፡ ዘዘመዉ፡ ትጉሃን፡* እምትእዛዘ፡ ዘነኒሆሙ፡ *በድኅረ፡ አዋልደ፡ ሰብእ፡* ወነሥኡ፡ ሎሙ፡ አንስተ፡* እምኵሉ፡* እለ፡ ኀረዩ፡ ወገብሩ፡ መቅድመ፡ ርኵሰ።

    22. ወወለዱ፡ ውሉደ፡ ናፊዲም፡* ወኵሎሙ፡ ኢይትማሰሉ፡ ወይበልዕ፡ አሐዱ፡ አሐዱ፡ ካልኦ፡* ወቀተሎ፡ ይርባሕ፡* ለናፊል፡ ወናፊል፡ ቀተሎ፡ ለኤልዮ፡* ወኤልዮ፡* ለአንሰ፡ አመሕያው፡

    23. ወሰብእሂ፡ ቢጾ። ወኵሉ፡ ተሰይጠ፡* ይግበር፡* ዐመፃ፡ ወከመ፡ ይክዐው፡* ደመ፡ ብዙኀ፡*

    24. ወመልአት፡ ምድር፡ ዐመፃ። ወእምድኅረ፡ *አበሱ፡ ሎሙ፡ በአራዊት፡ ወአዕዋፍ፡ ወኵሉ፡* ዘይትሐወስ፡* ወዘያንሶሱ፡* ዲበ፡ ምድር፡ ወትክዐወ፡ ደም፡ ብዙኅ፡ *ዲበ፡ ምድር፡* ወኵሉ፡

    25. ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ፡ ይኄሊ፡* ከንተ፡ ወእኩየ፡* በኵሉ፡ መዋዕል። ወደምሰሰ፡* እግዚአብሔር፡ ኵሎ፡* እም ፳፰ ገጸ፡ ምድር፡ በእንተ፡ እኩይ፡* ምግባሮሙ፡ ወበእንተ፡ ደም፡

    26. ዘከዐዉ፡ ማእከለ፡* ምድር፡ *ደምሰሰ፡ ኵሎ፡* ወተርፍኩ፡ አነ፡ ወአንትሙ፡ ደቂቅየ፡ ወኵሉ፡* ዘቦአ፡ ምስሌነ፡ ውስተ፡ ታቦት፡ ወናሁ፡ አነ፡ እሬኢ፡ ቅድሜየ፡* ምግባሪክሙ፡ ከመ፡ ዘአኮንክሙ፡* ዘተሐውሩ፡* በጽድቅ፡ እስመ፡ በፍኖተ፡ ሙስና፡ ወጠንክሙ፡ ትሖሩ፡ ወትትፋለጡ፡ አሐዱ፡ አሐዱ፡* እም ቢጹ፡ ወትትቃተሉ፡ ዝንቱ፡ ምስለ፡ ዝንቱ፡ ወከመ፡ ኢትሄልዉ፡* ኅቡረ፡*

