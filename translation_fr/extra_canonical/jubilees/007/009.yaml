  yaml_path: translation/extra_canonical/jubilees/007/009.yaml
  text: And Noah awoke from his wine and knew everything that his youngest son had done to him, and he cursed his son and said, “Cursed be Canaan; a lowly servant[a] shall he be to his brothers.”
translation:
  language: fr
  text: 'Noé se réveilla de son ivresse et apprit tout ce que son plus jeune fils lui avait fait. Il maudit son fils et dit : « Maudit soit Canaan ! Qu’il soit pour ses frères un serviteur de rang inférieur[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le guèze emploie ici une expression évoquant un serviteur de condition inférieure, et non la formule plus connue de la Genèse : « serviteur des serviteurs ». On peut aussi traduire : « un humble serviteur » ou « un esclave de rang inférieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነቅሀ፡ ኖኅ፡ እምወይኑ
  choice: Noé se réveilla de son ivresse
  rationale: Littéralement, Noé « se réveilla de son vin ». En français actuel, « de son ivresse » exprime naturellement le retour à la lucidité après les effets du vin.
- source_word: ወአእመረ፡ ኵሎ፡ ዘገብረ፡ ላዕሌሁ
  choice: et apprit tout ce que […] lui avait fait
  rationale: Le verbe signifie « savoir, connaître » ; dans ce contexte, « apprit » rend clairement le fait que Noé prend connaissance après son réveil de ce qui s’est passé.
- source_word: ወልዱ፡ ዘይንእስ
  choice: son plus jeune fils
  rationale: Le syntagme désigne le fils plus jeune ou le plus jeune ; le superlatif français correspond à la compréhension contextuelle traditionnelle tout en restant proche de la formulation guèze.
- source_word: ቅኑየ፡ ገብር
  choice: un serviteur de rang inférieur
  rationale: La formule guèze ne correspond pas exactement à l’hébreu familier « serviteur des serviteurs ». Cette traduction conserve l’idée d’un statut subordonné ou abaissé sans renforcer inutilement le texte par « esclave ».
- source_word: ለአኃዊሁ
  choice: pour ses frères
  rationale: Le datif guèze indique ici la relation de service envers ses frères ; « pour ses frères » est idiomatique et conserve cette relation.
theological_decisions:
- issue: Objet de la malédiction
  choice: 'Il maudit son fils et dit : « Maudit soit Canaan ! »'
  alternative: Il maudit Canaan, son petit-fils
  rationale: 'Le texte présente une tension explicite : il dit que Noé maudit « son fils », mais la parole nomme Canaan. La traduction conserve cette formulation sans l’harmoniser ni expliquer silencieusement la parenté.'
- issue: Degré de servitude annoncé à Canaan
  choice: un serviteur de rang inférieur
  alternative: un esclave des esclaves
  rationale: Le choix suit la formulation éthiopienne attestée plutôt que d’importer automatiquement la tournure de Genèse 9.25 ; il évite aussi de déterminer au-delà du texte la nature juridique exacte de cette servitude.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est divisée en deux pour plus de clarté, sans supprimer la répétition de « son fils », importante pour préserver la tension entre le fils mentionné et Canaan, nommé dans la malédiction.
