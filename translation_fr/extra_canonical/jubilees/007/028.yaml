  yaml_path: translation/extra_canonical/jubilees/007/028.yaml
  text: For three years the fruit of everything that is eaten shall not be gathered; and in the fourth year its fruit shall be gathered, and the firstfruits acceptable before the LORD Most High, who created heaven and earth and everything, shall be offered up. Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it; and what is left over let the servants of the house of the LORD eat before the altar that receives it.
translation:
  language: fr
  text: Pendant trois ans, les fruits de tout ce qui se mange ne seront pas récoltés. La quatrième année, on en récoltera les fruits et l’on offrira les prémices agréées devant le Seigneur Très-Haut, qui a créé le ciel, la terre et toutes choses. On offrira en abondance sur l’autel du Seigneur les prémices du vin et de l’huile ; et les serviteurs de la maison du Seigneur mangeront ce qui restera devant l’autel agréé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሬሁ፡ ዘኢይትቀሠም፡ እምኵሉ፡ ዘይትበላዕ
  choice: les fruits de tout ce qui se mange ne seront pas récoltés
  rationale: Le suffixe de ፍሬሁ est compris par anticipation avec ኵሉ፡ ዘይትበላዕ, donnant naturellement « les fruits de tout ce qui se mange » ; ይትቀሠም désigne ici la récolte ou la cueillette.
- source_word: ቀዳሜ፡ ፍሬ
  choice: les prémices
  rationale: Expression cultuelle désignant les premiers produits offerts ; « prémices » est précis, digne et usuel dans le registre biblique français.
- source_word: እግዚአብሔር፡ ልዑል
  choice: le Seigneur Très-Haut
  rationale: Rend distinctement le titre divin et l’épithète « Très-Haut » sans ajouter d’interprétation confessionnelle.
- source_word: በጥሉ
  choice: en abondance
  rationale: Le terme qualifie la manière ou la quantité de l’offrande ; « en abondance » suit le sens retenu par le texte de consultation tout en restant naturel.
- source_word: ወይኑ፡ ወቅብአ
  choice: du vin et de l’huile
  rationale: Rend les deux produits agricoles destinés à l’offrande, le second terme désignant l’huile ou l’huile d’onction selon le contexte ; ici « huile » convient au cadre des prémices.
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: les serviteurs de la maison du Seigneur
  rationale: Le contexte cultuel appelle les personnes attachées au service de la maison du Seigneur ; formulation claire et non techniquement surdéterminée.
theological_decisions:
- issue: Sujet de l’agrément ou de la réception cultuelle
  choice: les prémices sont « agréées devant » le Seigneur, tandis que l’autel « les reçoit »
  alternative: dire directement que le Seigneur reçoit les prémices
  rationale: La formulation conserve les constructions successives du guèze et évite de fondre l’agrément divin et la réception sur l’autel en une seule affirmation.
- issue: Portée de « tout ce qui se mange »
  choice: 'rattacher l’expression aux fruits : « les fruits de tout ce qui se mange »'
  alternative: « ses fruits ne seront récoltés sur rien de ce qui se mange »
  rationale: L’analyse du suffixe anticipatif et du complément génitif soutient le rattachement retenu, mais l’autre découpage est signalé en note puisqu’il reflète une ambiguïté de construction possible dans la tradition de traduction.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes inutiles. « Prémices », « autel » et « Seigneur Très-Haut » maintiennent le registre cultuel et biblique ; la syntaxe reste accessible. Le futur normatif traduit la valeur prescriptive du discours.
