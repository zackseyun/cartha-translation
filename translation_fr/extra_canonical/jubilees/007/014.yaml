  text: And Japheth saw it and became jealous of his brother, and he too built for himself a city and called its name after the name of his wife, Adataneses[a].
translation:
  language: fr
  text: Japhet vit cela et devint jaloux de son frère. Lui aussi se construisit une ville et lui donna le nom de sa femme, Adatanésès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Adatanésès » est une translittération de la forme éthiopienne du nom ; sa forme exacte est incertaine.
    reason: segmentation_note
lexical_decisions:
- source_word: ወርእየ
  choice: Il le vit
  rationale: Le verbe signifie « voir ». Le pronom « le » reprend naturellement en français ce qui précède, vraisemblablement la ville bâtie par Cham, sans expliciter davantage l’antécédent.
- source_word: ወቀንአ፡ ለአኁሁ
  choice: et jalousa son frère
  rationale: Cette tournure conserve le sens de jalousie ou d’envie envers son frère, sans en préciser le motif au-delà du texte.
- source_word: ወሐነጸ፡ ሎቱ፡ ውእቱሂ፡ ሀገረ
  choice: Lui aussi se bâtit une ville
  rationale: « Lui aussi » rend l’insistance de ውእቱሂ et relie l’action de Japhet à celle de son frère dans le contexte.
- source_word: አዳተኔሴስ
  choice: Adatanésès
  rationale: Translittération française lisible de la forme éthiopienne du nom propre, dont la restitution exacte demeure incertaine.
