base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/003.yaml
  text: 'On the new moon of the first month, he made a feast on that day with rejoicing, and he made a burnt offering to the LORD: one young bull, one ram, seven yearling sheep, and one male goat, so that he might make atonement for himself and for his sons.'
translation:
  language: fr
  text: 'À la nouvelle lune du premier mois, il célébra ce jour-là une fête dans la joie et offrit au Seigneur un holocauste : un jeune taureau, un bélier, sept agneaux d’un an et un bouc, afin de faire l’expiation pour lui-même et pour ses fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቀ፡ ወርኀ፡ ቀዳሚት
  choice: la nouvelle lune du premier mois
  rationale: Restitue explicitement le repère calendaire du guèze, où ሠርቀ ወርኀ désigne l’apparition ou le commencement lunaire du mois.
- source_word: በዓለ
  choice: une fête
  rationale: Terme naturel et digne pour une célébration festive, sans préciser davantage sa nature.
- source_word: ጽንሓሐ
  choice: un holocauste
  rationale: Rend le sacrifice entièrement consumé selon la terminologie sacrificielle française courante.
- source_word: አልህምቱ፡ አሐደ
  choice: un jeune taureau
  rationale: Désigne ici un bovin mâle offert en sacrifice; « jeune taureau » est plus naturel que « jeune bœuf » dans ce contexte.
- source_word: አባግዐ፡ ዘዘ፡ ዓመት፡ ሰብዐተ
  choice: sept agneaux d’un an
  rationale: Conserve le nombre et l’indication explicite de l’âge; « agneaux » exprime naturellement des ovins âgés d’un an dans une liste sacrificielle.
- source_word: ጢለ፡ አሐደ
  choice: un bouc
  rationale: Rend succinctement le caprin mâle de la liste sacrificielle.
- source_word: ያስተስሪ
  choice: faire l’expiation
  rationale: Conserve la portée cultuelle du verbe sans réduire l’idée à un simple pardon ou à une purification.
theological_decisions:
- issue: Objet et portée de l’expiation
  choice: afin de faire l’expiation pour lui-même et pour ses fils
  alternative: afin d’obtenir le pardon pour lui-même et pour ses fils
  rationale: La formulation retenue préserve la catégorie sacrificielle de l’expiation et n’impose pas une explication doctrinale de son mécanisme.
- issue: Nom divin
  choice: l’Éternel
  alternative: le Seigneur
  rationale: « L’Éternel » est une désignation française établie du tétragramme, ici représenté dans le guèze par እግዚአብሔር; elle convient au registre biblique sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et solennel. La phrase suit l’ordre narratif et sacrificiel du guèze tout en employant une syntaxe française naturelle. Le repère calendaire et l’âge des ovins, explicitement présents dans la source, sont conservés.
