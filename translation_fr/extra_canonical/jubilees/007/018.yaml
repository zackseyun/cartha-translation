base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/018.yaml
  text: The sons of Japheth were Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras.
translation:
  language: fr
  text: 'Et voici les fils de Sem : Élam, Assour, Arpakshad — celui-ci naquit deux ans après le déluge —, Loud et Aram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: les fils de Sem
  rationale: Rend naturellement le syntagme généalogique guèze et respecte le référent du verset 18.
- source_word: ኤላም፡ ወአሱር፡ ወአርፋክስድ
  choice: Élam, Assour, Arpakshad
  rationale: Translittérations françaises modernes des noms propres, en conservant l’ordre et la coordination de la source.
- source_word: ዝንቱ፡ ትውልደ፡ ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ
  choice: celui-ci naquit deux ans après le déluge
  rationale: La proposition renvoie à Arpakshad et indique sa naissance deux ans après le déluge; les tirets rendent clairement l’incise sans modifier son sens.
- source_word: ወሉድ፡ ወአራም
  choice: Loud et Aram
  rationale: Suit la fin de la liste des fils de Sem; le mot ወሉድ est compris comme la conjonction ወ suivie du nom propre Lud, conformément au contexte généalogique.
