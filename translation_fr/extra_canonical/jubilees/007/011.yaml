  yaml_path: translation/extra_canonical/jubilees/007/011.yaml
  text: May God enlarge Japheth, and may God dwell in the dwellings of Shem; and let Canaan be his servant.”
translation:
  language: fr
  text: Que Dieu donne de l’espace à Japhet, que Dieu demeure dans les demeures de Sem, et que Canaan soit son serviteur[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son serviteur ». Le référent précis du possessif n’est pas explicité.'
    reason: Préserver l’ambiguïté réelle du possessif masculin singulier dans le texte guèze.
lexical_decisions:
- source_word: ያስፋሕ (yāśfāḥ)
  choice: donne un vaste espace
  rationale: Le causatif exprime l’idée d’élargir ou de mettre au large. Cette formulation française conserve l’image spatiale sans imposer qu’il s’agisse précisément d’un agrandissement territorial.
- source_word: እግዚአብሔር (ʾEgziʾabḥēr)
  choice: Dieu
  rationale: Dans ce contexte, le titre désigne Dieu et ne représente pas le tétragramme YHWH; « le Seigneur » ou « l’Éternel » serait donc moins exact.
- source_word: ማኅደሪ (maḫādəri)
  choice: demeures
  rationale: Le terme désigne des lieux d’habitation; le pluriel français correspond à la construction traditionnelle « les demeures de Sem ».
- source_word: ገብሮ (gabrō)
  choice: son serviteur
  rationale: Le nom signifie serviteur ou esclave. « Serviteur » convient au registre d’une bénédiction patriarcale tout en conservant la relation de subordination exprimée par le texte.
theological_decisions:
- issue: Sujet du verbe « demeure »
  choice: qu’il demeure
  alternative: que Dieu demeure
  rationale: Le pronom français reprend naturellement « Dieu », explicitement répété dans le guèze. La formulation ne cherche pas à expliquer théologiquement la nature de cette présence.
- issue: Référent du possessif appliqué au serviteur
  choice: son serviteur, avec note d’ambiguïté
  alternative: le serviteur de Sem / leur serviteur
  rationale: Le guèze emploie un possessif masculin singulier, mais son antécédent n’est pas explicité sans ambiguïté. Le texte principal conserve donc cette indétermination.
translation_notes:
  register: Français moderne, international et digne. La répétition de « Dieu » du guèze est allégée par un pronom dans la deuxième proposition, sans changement de référent. La tournure « donne un vaste espace » garde l’image d’élargissement tout en restant naturelle.
