  yaml_path: translation/extra_canonical/jubilees/007/027.yaml
  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
translation:
  language: fr
  text: '« Mes enfants, aimez-vous les uns les autres. Car je vois, et voici : les démons ont commencé à pécher contre vous et contre vos enfants. Maintenant, je crains pour vous qu’après ma mort vous ne répandiez le sang humain sur la terre et ne soyez vous-mêmes effacés de la surface de la terre. Car quiconque répand le sang humain[a], et quiconque mange le sang de toute chair, seront tous effacés de la terre. Aucun homme qui mange du sang ou qui répand le sang humain sur la terre ne subsistera ; il ne lui restera ni descendance ni postérité sous le ciel. Car ils iront au séjour des morts, ils descendront au lieu du jugement et ils entreront tous dans les ténèbres de l’abîme par une mort violente.


    « Qu’aucun sang ne pèse sur vous, parmi tout le sang versé durant tous les jours où vous égorgerez bêtes sauvages, bétail ou tout ce qui rampe sur la terre. Accomplissez une bonne œuvre pour vos vies en recouvrant de terre ce qui a été versé à la surface de la terre. Ne soyez pas comme celui qui mange avec le sang ; veillez fermement à ne pas manger de sang : recouvrez le sang. Car c’est ainsi qu’il m’a été ordonné de vous l’attester, à vous et à vos enfants, avec toute chair. Ne mangez pas la vie avec la chair, afin que votre sang, qui est votre vie, ne soit pas réclamé de la main de toute chair qui le répand sur la terre. Car la terre ne sera pas purifiée du sang qui a été versé sur elle ; elle ne sera purifiée, dans toutes ses générations, que par le sang de celui qui l’a versé.


    « Maintenant donc, mes enfants, écoutez : pratiquez la justice et la droiture, afin que vous soyez établis dans la justice sur toute la surface de la terre et que votre gloire soit élevée devant mon Dieu, qui m’a sauvé des eaux du déluge.


    « Allez, bâtissez-vous des villes et plantez-y toute plante qui est sur la terre, ainsi que tout arbre fruitier. Pendant trois ans, leurs fruits ne seront mangés d’aucune manière ; la quatrième année, leurs fruits seront mangés, et les prémices seront offertes au Seigneur, le Très-Haut, qui a créé le ciel, la terre et toutes choses. Que les prémices du vin et de l’huile soient offertes en abondance comme premiers fruits dans l’offrande au Seigneur, qui les recevra ; ce qui restera sera mangé par les serviteurs de la maison du Seigneur. »'
