revisions:
- from: '« Mes enfants, aimez-vous les uns les autres. Car je vois que les démons ont commencé à pécher contre vous et contre vos enfants. Maintenant, je crains pour vous : après ma mort, vous pourriez répandre le sang humain sur la terre et être vous-mêmes effacés de sa surface. En effet, quiconque répand le sang humain[a], ainsi que quiconque consomme le sang d’un être de chair, sera entièrement effacé de la terre. Aucun homme qui consomme du sang ou répand le sang humain sur la terre ne subsistera ; il ne lui restera ni descendance ni postérité vivante sous le ciel. Car ces hommes iront au séjour des morts, ils descendront au lieu du jugement et entreront tous dans les ténèbres de l’abîme par une mort violente.


    « Qu’aucun sang provenant des animaux sauvages, du bétail ou de tout être qui se déplace sur la terre et que vous égorgerez au cours de votre vie ne demeure visible sur vous. Faites du bien à vos propres vies en recouvrant de terre le sang répandu à la surface du sol. Ne soyez pas de ceux qui mangent la viande avec le sang. Veillez fermement à ce que personne ne consomme de sang devant vous ; recouvrez-le, car c’est ainsi qu’il m’a été ordonné de vous l’attester, à vous, à vos enfants et à tout être de chair. Ne mangez pas la vie avec la chair, afin que votre sang, c’est-à-dire votre vie, ne soit pas réclamé à tout être de chair qui le répandrait sur la terre. Car la terre ne peut être purifiée du sang versé sur elle : elle ne sera purifiée, de génération en génération, que par le sang de celui qui l’a versé.


    « Maintenant donc, mes enfants, écoutez-moi : pratiquez la justice et la droiture, afin que vous soyez solidement établis dans la justice sur toute la surface de la terre et que votre gloire s’élève devant mon Dieu, qui m’a sauvé des eaux du déluge.


    « Allez donc vous bâtir des villes. Plantez-y toutes sortes de plantes qui poussent sur la terre et tous les arbres fruitiers. Pendant trois ans, on ne récoltera aucun de leurs fruits comestibles. La quatrième année, on récoltera leurs fruits et l’on apportera les prémices offertes au Seigneur, le Dieu Très-Haut qui a créé le ciel, la terre et toutes choses. Qu’on apporte en abondance les prémices du vin et de l’huile comme premiers fruits sur l’autel du Seigneur, qui les acceptera ; ce qui restera, que les serviteurs de la maison du Seigneur le mangent. »'
  to: '« Mes enfants, aimez-vous les uns les autres. Car je vois, et voici : les démons ont commencé à pécher contre vous et contre vos enfants. Maintenant, je crains pour vous qu’après ma mort vous ne répandiez le sang humain sur la terre et ne soyez vous-mêmes effacés de la surface de la terre. Car quiconque répand le sang humain[a], et quiconque mange le sang de toute chair, seront tous effacés de la terre. Aucun homme qui mange du sang ou qui répand le sang humain sur la terre ne subsistera ; il ne lui restera ni descendance ni postérité sous le ciel. Car ils iront au séjour des morts, ils descendront au lieu du jugement et ils entreront tous dans les ténèbres de l’abîme par une mort violente.


    « Qu’aucun sang ne pèse sur vous, parmi tout le sang versé durant tous les jours où vous égorgerez bêtes sauvages, bétail ou tout ce qui rampe sur la terre. Accomplissez une bonne œuvre pour vos vies en recouvrant de terre ce qui a été versé à la surface de la terre. Ne soyez pas comme celui qui mange avec le sang ; veillez fermement à ne pas manger de sang : recouvrez le sang. Car c’est ainsi qu’il m’a été ordonné de vous l’attester, à vous et à vos enfants, avec toute chair. Ne mangez pas la vie avec la chair, afin que votre sang, qui est votre vie, ne soit pas réclamé de la main de toute chair qui le répand sur la terre. Car la terre ne sera pas purifiée du sang qui a été versé sur elle ; elle ne sera purifiée, dans toutes ses générations, que par le sang de celui qui l’a versé.


    « Maintenant donc, mes enfants, écoutez : pratiquez la justice et la droiture, afin que vous soyez établis dans la justice sur toute la surface de la terre et que votre gloire soit élevée devant mon Dieu, qui m’a sauvé des eaux du déluge.


    « Allez, bâtissez-vous des villes et plantez-y toute plante qui est sur la terre, ainsi que tout arbre fruitier. Pendant trois ans, leurs fruits ne seront mangés d’aucune manière ; la quatrième année, leurs fruits seront mangés, et les prémices seront offertes au Seigneur, le Très-Haut, qui a créé le ciel, la terre et toutes choses. Que les prémices du vin et de l’huile soient offertes en abondance comme premiers fruits dans l’offrande au Seigneur, qui les recevra ; ce qui restera sera mangé par les serviteurs de la maison du Seigneur. »'
