lexical_decisions:
- source_word: ሲኦል
  choice: séjour des morts
  rationale: Rend le shéol comme le domaine des morts sans l’identifier d’emblée à l’enfer au sens théologique ultérieur.
- source_word: ነፍስ
  choice: vie
  rationale: Dans le contexte du sang et de la chair, le terme désigne la vie animée; « vie » restitue naturellement le lien explicite entre sang et vie.
- source_word: ፍትሐ፡ ወጽድቀ
  choice: justice et droiture
  rationale: Conserve les deux notions éthiques coordonnées sans les fondre en un seul terme.
- source_word: ቀዳሜ፡ ፍሬ
  choice: prémices / premiers fruits
  rationale: Le contexte cultuel exige la notion de première part de la récolte consacrée à Dieu; la variation française évite une répétition opaque tout en gardant le sens.
- source_word: ጸዋገ
  choice: violente
  rationale: Qualifie la mort comme brutale ou violente, conformément au contexte judiciaire du passage.
theological_decisions:
- issue: Rapport entre le sang et la vie
  choice: « votre sang, c’est-à-dire votre vie »
  alternative: « le sang de votre âme »
  rationale: Le texte identifie étroitement le sang à la vie; cette formulation reste intelligible en français moderne sans introduire une anthropologie dualiste étrangère au passage.
- issue: Purification de la terre par le sang du meurtrier
  choice: Conserver l’affirmation littérale selon laquelle la terre n’est purifiée que par le sang de celui qui l’a versé
  alternative: Paraphraser en parlant simplement de châtiment ou d’expiation
  rationale: La formulation porte une tension juridique et théologique réelle qu’il ne faut ni atténuer ni systématiser.
- issue: Destination des coupables après la mort
  choice: « séjour des morts », « lieu du jugement » et « ténèbres de l’abîme »
  alternative: « enfer »
  rationale: Préserve les images distinctes du texte et évite de les fusionner dans une catégorie doctrinale postérieure.
