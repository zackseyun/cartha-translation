  text: For thus Enoch, the father of your father, commanded his son Methuselah, and Methuselah commanded his son Lamech, and Lamech commanded me everything that his fathers commanded him.
translation:
  language: fr
  text: Car c’est ainsi qu’Hénoch, le père de votre père, ordonna à son fils Mathusalem ; Mathusalem ordonna à son fils Lamek, et Lamek m’ordonna tout ce que ses pères lui avaient ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዘዘ
  choice: donna cet ordre / transmit tous les ordres
  rationale: Le verbe signifie « ordonner, commander ». La variation française évite une répétition lourde tout en conservant la chaîne explicite de transmission des commandements.
- source_word: አበዊሁ
  choice: ses pères
  rationale: Le pluriel guèze est conservé sans le réduire à un seul ancêtre.
- source_word: ወእዱ
  choice: à son fils
  rationale: Le terme relationnel indique ici la filiation dans la chaîne Hénoch–Mathusalem–Lamek.
theological_decisions:
- issue: Rapport syntaxique de Mathusalem à Hénoch
  choice: « donna cet ordre à son fils Mathusalem »
  alternative: « le père de votre père Mathusalem donna cet ordre à son fils »
  rationale: Dans le texte source, Mathusalem est le destinataire de l’ordre d’Hénoch et se trouve en apposition à « son fils ». Cette lecture maintient correctement la chaîne de transmission nommée dans la suite.
- issue: Expression généalogique « le père de votre père »
  choice: Conserver littéralement l’expression
  alternative: L’harmoniser avec la généalogie en « l’ancêtre de votre père » ou « votre arrière-grand-père »
  rationale: Le texte présente une tension généalogique apparente. La traduction ne la corrige pas silencieusement et préserve la formulation du témoin source.
translation_notes:
  register: Français moderne, digne et lisible. « Donna cet ordre » puis « transmit tous les ordres » rend la répétition du verbe de commandement avec naturel, sans effacer la chaîne traditionnelle de transmission.
