lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: chacun contre son prochain
  rationale: La formulation guèze est elliptique, littéralement « et un homme, son prochain ». « Chacun contre son prochain » restitue en français naturel la relation réciproque impliquée, tout en signalant l’ellipse dans une note.
- source_word: ተሰይጠ
  choice: se vendirent
  rationale: Le verbe exprime ici le fait de se vendre ou de se livrer soi-même; la tournure réflexive du texte source est conservée.
- source_word: ይግበር፡ ዐመፃ
  choice: pour commettre l’injustice
  rationale: Rend directement l’idée de faire ou pratiquer l’injustice, sans préciser une forme particulière de faute.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: répandre beaucoup de sang
  rationale: Correspond à l’expression concrète du texte source et conserve l’intensité de « beaucoup ».
