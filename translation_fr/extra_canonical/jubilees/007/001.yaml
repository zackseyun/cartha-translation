  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: fr
  text: Au cours de la septième semaine, la première année de cette semaine, dans ce jubilé, Noé planta une vigne sur la montagne où l’arche s’était posée. Cette montagne, appelée Loubar, était l’une des montagnes d’Ararat. La vigne produisit du fruit la quatrième année.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ፡ ሳብዕ
  choice: au cours de la septième semaine
  rationale: Rend directement l’expression chronologique guèze tout en gardant le système de datation propre aux Jubilés.
- source_word: በቀዳማይ፡ ዓመት
  choice: la première année de celle-ci
  rationale: Le pronom explicite que l’année appartient à la semaine mentionnée, sans ajouter une interprétation étrangère au texte.
- source_word: ተከለ፡ ኖኅ፡ ወይነ
  choice: Noé planta une vigne
  rationale: Traduction naturelle et précise du verbe « planter » et du nom désignant la vigne.
- source_word: አዕረፈት፡ ታቦት
  choice: l’arche s’était posée
  rationale: Le plus-que-parfait marque naturellement en français que le repos de l’arche précède la plantation.
- source_word: ሉባር
  choice: Loubar
  rationale: Translittération française lisible du nom propre guèze.
- source_word: እምአድባረ፡ አራራት
  choice: l’une des montagnes d’Ararat
  rationale: Préserve le pluriel et présente Loubar comme une montagne appartenant à l’ensemble montagneux d’Ararat.
- source_word: ወገብረ፡ ፍሬ፡ በራብዕ
  choice: La vigne produisit du fruit la quatrième année
  rationale: Le sujet implicite est repris pour éviter toute ambiguïté en français; « produisit du fruit » conserve l’expression concrète de la source.
