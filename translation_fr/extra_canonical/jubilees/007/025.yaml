  yaml_path: translation/extra_canonical/jubilees/007/025.yaml
  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
translation:
  language: fr
  text: Les êtres humains imaginent sans cesse, dans leurs pensées et leurs désirs, ce qui est vain et mauvais, et le Seigneur a tout détruit de la surface de la terre à cause de leurs mauvaises actions et à cause du sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: Dans ses pensées et ses désirs, l’être humain
  rationale: Cette tournure française naturelle conserve les deux facultés mentionnées dans le texte guèze, la pensée et le désir, sans les réduire à une simple qualification morale.
- source_word: ይኄሊ
  choice: imagine
  rationale: Le verbe exprime l’activité de penser, de considérer ou d’imaginer; « imagine » préserve cette valeur verbale que ferait disparaître une simple copule.
- source_word: ከንተ፡ ወእኩየ
  choice: ce qui est vain et mauvais
  rationale: La traduction rend explicitement les deux termes coordonnés, la vanité et le mal, sans omettre le premier.
- source_word: በኵሉ፡ መዋዕል
  choice: sans cesse
  rationale: Expression idiomatique moderne correspondant à l’idée de continuité portée littéralement par « tous les jours ».
- source_word: ደም
  choice: sang
  rationale: Le texte dit simplement « sang »; la traduction évite d’ajouter « versé », même si cette idée peut être sous-entendue par le contexte.
theological_decisions:
- issue: Portée de la corruption humaine
  choice: imagine sans cesse ce qui est vain et mauvais
  alternative: est sans cesse vain et mauvais
  rationale: Le choix conserve l’activité mentale exprimée par le verbe source ainsi que les deux objets, « vain » et « mauvais », sans transformer la phrase en affirmation ontologique plus générale.
- issue: Référence au sang
  choice: à cause du sang
  alternative: à cause du sang versé
  rationale: La formulation maintient la concision et l’ambiguïté du texte source, qui ne précise pas explicitement que le sang a été versé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe du premier membre a été légèrement réorganisée pour éviter une personnification maladroite des pensées et des désirs, tout en conservant chaque élément sémantique du guèze. « De la face de la terre » maintient la tonalité scripturaire sans être difficile à comprendre.
