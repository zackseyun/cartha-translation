  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: fr
  text: Ils engendrèrent les enfants des Naphidim. Tous étaient différents les uns des autres et se dévoraient les uns les autres. Les géants tuèrent le Naphil, le Naphil tua l’Élyo, et l’Élyo tua les êtres humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms « Naphidim », « Naphil » et « Élyo » transcrivent trois termes distincts du texte guèze, dont l’identification précise demeure incertaine.
    reason: Signaler l’obscurité lexicale et empêcher que ces trois désignations soient artificiellement confondues.
lexical_decisions:
- source_word: ናፊዲም (nāfidim)
  choice: Naphidim
  rationale: Translittération conservée comme désignation propre d’un groupe, distincte de ናፊል dans le même verset.
- source_word: ናፊል (nāfil)
  choice: Naphil
  rationale: La forme singulière et distincte du terme est préservée afin de ne pas la confondre avec les Naphidim.
- source_word: ኤልዮ (ʾelyo)
  choice: Élyo
  rationale: Terme obscur translittéré plutôt qu’interprété; l’accent initial facilite une lecture française conforme à la forme source.
- source_word: አንሰ፡ አመሕያው (ʾansa ʾamaḥyāw)
  choice: les êtres humains
  rationale: Expression collective désignant l’humanité; cette formulation inclusive et naturelle évite le possible contresens de « les hommes » au sens masculin.
- source_word: ኢይትማሰሉ
  choice: étaient différents les uns des autres
  rationale: Rend naturellement la négation réciproque « ne se ressemblaient pas » sans changer le sens.
theological_decisions:
- issue: Identification des différentes catégories d’êtres
  choice: Conserver séparément « Naphidim », « Naphil » et « Élyo »
  alternative: Les regrouper sous le nom de « Nephilim » ou les expliquer comme diverses classes de géants
  rationale: Le texte guèze emploie des formes distinctes. Les fusionner imposerait une identification que le verset ne formule pas.
- issue: Sujet du premier acte meurtrier
  choice: « Les géants tuèrent le Naphil »
  alternative: « Le géant tua le Naphil »
  rationale: Suit la lecture éditoriale et la couche de consultation qui comprennent ici un groupe de géants, tout en maintenant le Naphil comme terme distinct.
translation_notes:
  register: Français international moderne, sobre et narratif. Les phrases ont été légèrement segmentées pour rendre claire la succession des engendrements, de la dévoration mutuelle et des meurtres, tout en conservant la cadence abrupte de la dernière proposition.
