  choice: Arpakshad est présenté comme né deux ans après le déluge.
  alternative: « Cette génération naquit deux ans après le déluge. »
  rationale: La grammaire du guèze et le parallèle généalogique soutiennent un référent masculin singulier, Arpakshad; l'alternative repose sur une confusion lexicale et obscurcit la chronologie.
