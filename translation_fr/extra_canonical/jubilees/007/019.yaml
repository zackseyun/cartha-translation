  yaml_path: translation/extra_canonical/jubilees/007/019.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee Noah began to command the ordinances and the commandments to his sons' sons, and all the judgments that he knew; and he testified to his sons that they should do righteousness, and that they should cover the shame of their flesh, and that they should bless their Creator, and honor father and mother, and each one love his neighbor, and guard themselves from fornication and uncleanness and all injustice.
translation:
  language: fr
  text: Voici les fils de Noé. Au vingt-huitième jubilé, Noé commença à transmettre les prescriptions et les commandements aux fils de ses fils, ainsi que toutes les règles de justice qu’il connaissait. Il attesta auprès de ses fils qu’ils devaient pratiquer la justice, couvrir la nudité de leur corps, bénir leur Créateur, honorer leur père et leur mère, que chacun aime son prochain, et se garder de l’immoralité sexuelle, de l’impureté et de toute injustice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: les prescriptions et les commandements
  rationale: Conserve la distinction entre les règles établies et les ordres explicites, dans un français naturel et digne.
- source_word: ፍትሐ
  choice: les règles de justice
  rationale: Le terme peut désigner le droit, les jugements ou les règles justes; cette formulation préserve sa portée juridique et morale dans le contexte de l’enseignement de Noé.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: la nudité de leur corps
  rationale: Le sens concret est la partie honteuse ou nudité de la chair; «nudité» rend clairement l’action de couvrir sans obscurité inutile.
- source_word: ዝሙት
  choice: l’immoralité sexuelle
  rationale: Terme englobant pour l’inconduite sexuelle, plus immédiatement compréhensible aujourd’hui que «fornication» tout en gardant la portée morale du mot source.
- source_word: ርኵስ
  choice: l’impureté
  rationale: Rend directement la notion de souillure ou d’impureté sans lui imposer un sens exclusivement rituel.
- source_word: ዐመፃ
  choice: injustice
  rationale: Dans cette série morale, le mot désigne l’iniquité, la violence ou l’injustice; «injustice» garde une portée large conforme au contexte.
theological_decisions:
- issue: Nature des règles transmises par Noé
  choice: Présenter Noé comme enseignant des prescriptions, commandements et règles de justice qu’il connaissait
  alternative: Transformer ces éléments en une loi divine formellement codifiée
  rationale: Le texte attribue à Noé une transmission de ce qu’il connaît, sans préciser ici le statut canonique ou institutionnel de cet ensemble.
- issue: Référence au créateur
  choice: Conserver «leur Créateur» avec une majuscule
  alternative: Expliciter «Dieu, leur Créateur»
  rationale: Le texte source emploie un titre relationnel sans nommer Dieu dans cette proposition; la traduction préserve cette formulation.
translation_notes:
  register: Français international moderne, clair et soutenu. La coordination ample du texte source est légèrement structurée en deux phrases afin de rester lisible, sans supprimer les éléments de l’exhortation.
