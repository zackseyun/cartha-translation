  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: fr
  text: Il se réjouit et but de ce vin, lui et ses fils, dans la joie. Le soir venu, il entra dans sa tente. Ivre, il se coucha et s’endormit. Pendant son sommeil, il était découvert à l’intérieur de sa tente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈሥሐ
  choice: se réjouit
  rationale: Rend directement le verbe exprimant la joie, dans un français naturel et digne.
- source_word: ሰትየ
  choice: but
  rationale: Traduction simple et directe du verbe « boire ».
- source_word: ሰቀላሁ
  choice: sa tente
  rationale: Le nom désigne ici l’abri ou la tente de Noé; « tente » correspond au contexte narratif traditionnel.
- source_word: ስኩሩ
  choice: ivre
  rationale: Conserve sans atténuation l’état d’ivresse indiqué par le texte.
- source_word: ተከሥተ
  choice: se découvrit
  rationale: Préserve la formulation réfléchie du texte guèze et évite de préciser davantage le degré de nudité.
theological_decisions:
- issue: Responsabilité de l’exposition de Noé
  choice: « il se découvrit »
  alternative: « il était découvert » ou « il fut découvert »
  rationale: La forme du texte source se prête à une lecture réfléchie; la traduction conserve cette nuance sans introduire un autre agent.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les répétitions lourdes ont été légèrement structurées en phrases brèves, tout en conservant la progression: joie et vin, soir, entrée dans la tente, ivresse, sommeil et exposition.'
