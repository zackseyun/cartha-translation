  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
translation:
  language: fr
  text: Ils ne feront rien entrer ni sortir d’une maison à l’autre en ce jour[a], car il est saint et béni plus que tout jour de jubilé des jubilés. C’est en ce jour que nous avons observé le sabbat dans les cieux, avant que ce jour ne soit révélé à tout être de chair, afin qu’il y observe le sabbat sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation « saint et béni plus que tout jour de jubilé des jubilés » est difficile. Elle peut être une comparaison emphatique qui place le sabbat hebdomadaire au-dessus même des cycles festifs les plus élevés.
    reason: alternative_reading
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ፡ እምቤት፡ ቤተ
  choice: Ils ne feront rien entrer ni sortir d’une maison à l’autre
  rationale: Rend directement les verbes antithétiques « faire entrer / faire sortir » et la construction distributive de maison à maison, tout en explicitant en français l’objet indéfini sous-entendu.
- source_word: ቅድስት፡ ይእቲ፡ ወቡርክት፡ ይእቲ
  choice: il est saint et béni
  rationale: Conserve les deux prédicats parallèles sans transformer chacun en comparatif.
- source_word: ዕለት፡ ኢዮቤል፡ ዘኢዮቤልውሳት
  choice: jour de jubilé des jubilés
  rationale: Préserve la formulation emphatique et inhabituelle du guèze, notamment le premier terme « jubilé », plutôt que de la normaliser.
- source_word: አሰንበትነ
  choice: nous avons observé le sabbat
  rationale: Le verbe désigne l’action de sabbatiser ou d’observer le repos sabbatique; cette formulation est naturelle et précise en français.
- source_word: ለኵሉ፡ ዘሥጋ
  choice: à tout être de chair
  rationale: Conserve l’expression sémitique qui désigne les êtres terrestres ou mortels sans la réduire arbitrairement à la seule humanité.
theological_decisions:
- issue: Portée de la comparaison entre le sabbat et le « jour de jubilé des jubilés »
  choice: saint et béni plus que tout jour de jubilé des jubilés
  alternative: plus saint et plus béni que tout jour de jubilé des jubilés
  rationale: La syntaxe place les adjectifs comme prédicats simples puis introduit une comparaison. La traduction retenue garde cette tension grammaticale au lieu de distribuer implicitement le comparatif sur les deux adjectifs.
- issue: Sujet de l’observance céleste
  choice: nous avons observé le sabbat dans les cieux
  alternative: le sabbat fut observé dans les cieux
  rationale: La première personne du pluriel est conservée, vraisemblablement la voix angélique du contexte, sans neutralisation théologique.
- issue: Obligation terrestre exprimée par l’infinitif final
  choice: qu’il devait l’observer sur la terre
  alternative: afin que toute chair l’observe sur la terre
  rationale: Le français explicite la valeur normative du texte tout en laissant « tout être de chair » comme référent singulier collectif.
translation_notes:
  register: Français moderne, international et digne. La formulation inhabituelle « jubilé des jubilés » est volontairement maintenue en raison de son ancrage explicite dans le texte guèze; la note signale la difficulté sans résoudre l’ambiguïté.
