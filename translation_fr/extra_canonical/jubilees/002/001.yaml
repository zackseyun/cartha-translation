  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: fr
  text: 'L’ange de la Présence dit à Moïse, sur la parole du Seigneur : « Écris tout le récit de la création : comment, en six jours, le Seigneur Dieu acheva toutes ses œuvres et tout ce qu’il avait créé. Il se reposa le septième jour, le sanctifia pour tous les âges et l’établit comme un signe pour tous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: l’ange de la Présence
  rationale: Rend littéralement l’expression guèze « ange de la face/présence » tout en employant la désignation française traditionnelle et intelligible.
- source_word: በቃለ፡ እግዚአብሔር፡
  choice: sur la parole du Seigneur
  rationale: Conserve le rôle médiateur de la parole divine sans transformer l’expression en simple discours direct ni préciser davantage la relation.
- source_word: ኵሎ፡ ነገረ፡ ፍጥረት፡
  choice: tout le récit de la création
  rationale: « Récit » exprime naturellement l’idée d’un exposé complet des choses concernant la création.
- source_word: ለኵሉ፡ ዓለማት፡
  choice: pour tous les âges
  rationale: Le pluriel de « monde/âge » possède ici une valeur temporelle; « tous les âges » préserve cette portée durable.
- source_word: ለኵሉ፡
  choice: pour tous
  rationale: Maintient l’expression universelle finale sans lui ajouter un référent absent ou incertain.
theological_decisions:
- issue: Portée du signe final
  choice: comme un signe pour tous
  alternative: comme un signe pour toutes ses œuvres
  rationale: Le texte transmis se termine par une expression universelle sans nom explicite; la traduction conserve cette indétermination plutôt que d’introduire « ses œuvres ».
- issue: Statut de la parole divine
  choice: sur la parole du Seigneur
  alternative: par la parole du Seigneur
  rationale: « Sur la parole » indique que l’ange parle sur ordre ou autorité divine, tout en laissant ouverte la nuance exacte de la préposition.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit le mouvement du texte source, mais la longue phrase est légèrement articulée pour une lecture naturelle. « Seigneur » traduit le titre divin sans importer une vocalisation confessionnelle; « Présence » reçoit une majuscule comme élément d’un titre traditionnel.
