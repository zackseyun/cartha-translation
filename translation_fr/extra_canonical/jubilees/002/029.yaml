  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
translation:
  language: fr
  text: '[Celui qui se repose] ce jour-là de tout son travail sera saint et béni tous les jours[a]. De même, fais connaître et dis aux fils d’Israël la loi de ce jour : qu’ils s’y reposent, qu’ils ne l’abandonnent pas dans l’égarement de leur cœur, qu’ils n’y fassent aucun travail qui ne convienne pas, qu’ils n’y recherchent pas leur propre plaisir, qu’ils n’y préparent rien à manger ni à boire, qu’ils n’y puisent pas d’eau et qu’ils ne fassent entrer ni sortir par leurs portes aucune charge qu’ils n’ont pas préparée pour eux-mêmes le sixième jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet entre crochets est restitué d’après la proposition commencée dans le contexte précédent ; le texte fourni débute littéralement par « ce jour-là, de tout son travail, sera saint et béni tous les jours ».
    reason: Le découpage de la source guèze place au début de ce verset la fin grammaticale de la phrase précédente ; le complément est nécessaire pour obtenir une phrase française intelligible sans dissimuler la restitution.
lexical_decisions:
- source_word: ከማሁ
  choice: De même
  rationale: Rend la valeur comparative ou connective « de même, pareillement », plutôt qu’une simple coordination.
- source_word: ወያሰንብቱ፡ ባቲ
  choice: qu’ils s’y reposent
  rationale: Le verbe désigne l’observance du sabbat par la cessation du travail ; cette formulation reste naturelle en français sans ajouter un terme absent.
- source_word: በስሕተት፡ ልቦሙ
  choice: dans l’égarement de leur cœur
  rationale: Conserve l’image anthropologique du texte et son idée d’erreur ou d’égarement intérieur.
- source_word: ፈቃዶሙ
  choice: leur propre plaisir
  rationale: Le terme peut évoquer volonté, désir ou bon plaisir ; « leur propre plaisir » préserve ici l’opposition entre l’observance du jour et les activités choisies pour soi.
- source_word: ለቀዲሐ፡ ማይ
  choice: qu’ils n’y puisent pas d’eau
  rationale: Rend concrètement l’action de tirer ou puiser de l’eau.
- source_word: ዘይጸውር
  choice: aucune charge
  rationale: Désigne ce qui est porté, donc une charge ou un fardeau ; « charge » convient au contexte réglementaire.
theological_decisions:
- issue: Nature des prescriptions sabbatiques
  choice: Traduire les interdictions comme des prescriptions données aux fils d’Israël, sans généralisation doctrinale.
  alternative: Les reformuler comme des commandements universels applicables à tous.
  rationale: Le destinataire explicite du texte est « les fils d’Israël » ; la traduction ne doit ni élargir ni restreindre cette portée.
- issue: Expression « leur propre plaisir »
  choice: Conserver la formulation ouverte du texte.
  alternative: L’interpréter précisément comme commerce, loisir, sexualité ou volonté pécheresse.
  rationale: Le passage ne précise pas la catégorie d’activité visée ; une interprétation confessionnelle ou doctrinale serait indue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions réglementaires sont légèrement fluidifiées, tout en maintenant chaque interdiction distincte. « Fils d’Israël » conserve la désignation historique du texte. Aucun ajout relatif aux « demeures » n’a été retenu, cette expression étant absente de la source guèze fournie.
