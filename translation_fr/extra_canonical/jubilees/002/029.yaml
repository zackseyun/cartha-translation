revisions:
- from: '[Celui qui se repose] ce jour-là de tout son travail sera saint et béni tous les jours[a]. De même, fais connaître et dis aux fils d’Israël la loi concernant ce jour : qu’ils s’y reposent, qu’ils ne l’abandonnent pas dans l’égarement de leur cœur, qu’ils n’y fassent aucun travail inconvenant, qu’ils n’y recherchent pas leur propre plaisir, qu’ils n’y préparent rien à manger ni à boire, qu’ils n’y puisent pas d’eau et qu’ils ne fassent entrer ni sortir par leurs portes aucune charge qu’ils ne se seraient pas préparée le sixième jour.'
  to: '[Celui qui se repose] ce jour-là de tout son travail sera saint et béni tous les jours[a]. De même, fais connaître et dis aux fils d’Israël la loi de ce jour : qu’ils s’y reposent, qu’ils ne l’abandonnent pas dans l’égarement de leur cœur, qu’ils n’y fassent aucun travail qui ne convienne pas, qu’ils n’y recherchent pas leur propre plaisir, qu’ils n’y préparent rien à manger ni à boire, qu’ils n’y puisent pas d’eau et qu’ils ne fassent entrer ni sortir par leurs portes aucune charge qu’ils n’ont pas préparée pour eux-mêmes le sixième jour.'
  rationale: La révision conserve la restitution explicitement balisée exigée par le découpage de la source, tout en rétablissant « pour eux-mêmes » dans la dernière clause et en supprimant une nuance hypothétique indue. Aucun élément absent du guèze fourni, notamment « dans leurs demeures », n’est ajouté.
