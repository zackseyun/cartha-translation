  - severity: low
    issue: Formulation de la relative sur le travail
    rationale: « Aucun travail inconvenant » est possible, mais « aucun travail qui ne convienne pas » reflète plus clairement la construction « travail qui n’est pas approprié/convenable » et évite une lecture restrictive ou catégorielle.
