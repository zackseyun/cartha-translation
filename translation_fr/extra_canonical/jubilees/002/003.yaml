  text: Alors nous avons vu ses œuvres, nous l’avons béni et nous avons célébré ses louanges devant lui pour toutes ses œuvres, car
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአሜሃ
  choice: Alors
  rationale: Rend naturellement l’enchaînement temporel et narratif « et alors ».
- source_word: ርኢነ፡ ምግባሮ
  choice: nous avons vu ses œuvres
  rationale: Traduction directe de « nous avons vu ses œuvres/ce qu’il avait fait », en conservant le substantif théologiquement évocateur « œuvres ».
- source_word: ወባረክናሁ
  choice: nous l’avons béni
  rationale: Le suffixe objet renvoie explicitement à Dieu; « bénir » préserve le langage de louange adressée à Dieu.
- source_word: ወሰብሕነ፡ ቅድሜሁ
  choice: nous avons célébré ses louanges devant lui
  rationale: Évite la répétition maladroite « nous l’avons loué devant lui » tout en rendant l’acte de louange et la valeur spatiale de « devant lui ».
- source_word: በእንተ፡ ኵሉ፡ ምግባሩ
  choice: pour toutes ses œuvres
  rationale: Exprime le motif de la louange et conserve le parallélisme lexical avec la première occurrence de « ses œuvres ».
- source_word: እስመ
  choice: car
  rationale: La proposition reste volontairement ouverte, puisque le verset source se termine par une conjonction causale qui introduit la suite.
theological_decisions:
- issue: Objet et orientation de la louange
  choice: « nous avons célébré ses louanges devant lui »
  alternative: « nous l’avons loué devant lui »
  rationale: La formulation retenue garde Dieu comme référent de la louange sans introduire en français une répétition lourde; elle ne modifie pas le contenu théologique.
- issue: Phrase inachevée à la fin du segment
  choice: conserver « car » en finale
  alternative: supprimer la conjonction ou compléter depuis le verset suivant
  rationale: Le texte fourni se termine par እስመ (« car/parce que »). La traduction respecte donc la division transmise et son caractère syntaxiquement suspendu.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et la répétition de « ses œuvres » sont maintenues afin de préserver le rythme du texte; la phrase demeure ouverte sur le verset suivant.
