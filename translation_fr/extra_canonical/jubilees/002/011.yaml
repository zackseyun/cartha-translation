  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: fr
  text: Le cinquième jour, il créa les grands monstres marins au milieu des eaux, car ils furent les premiers êtres de chair faits par ses mains, ainsi que tout ce qui se meut dans les eaux et tout ce qui vole —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አናብርት፡ ዐበይተ
  choice: les grands monstres marins
  rationale: Rend l’expression désignant de grandes créatures aquatiques sans la réduire à une espèce moderne précise.
- source_word: ማእከለ፡ ቀላያተ፡ ማያት
  choice: dans les profondeurs des eaux
  rationale: Formulation française naturelle qui exprime l’intérieur profond des étendues d’eau.
- source_word: ዘሥጋ
  choice: êtres de chair
  rationale: Conserve la notion concrète de chair et la catégorie d’êtres vivants corporels.
- source_word: በአደዊሁ
  choice: façonnés par ses mains
  rationale: Préserve l’image anthropomorphique explicite de l’action créatrice divine.
- source_word: ዘይትነወስ
  choice: être mobile qui se meut
  rationale: Maintient la répétition sémantique de la source tout en restant intelligible en français.
- source_word: ዘይሰርር
  choice: ce qui vole
  rationale: Traduction directe et non restrictive, sans préciser oiseaux ou créatures ailées au-delà de la source.
theological_decisions:
- issue: L’expression « par ses mains » appliquée à Dieu
  choice: Conserver « façonnés par ses mains »
  alternative: Rendre simplement « créés par lui »
  rationale: La source emploie une image corporelle forte; l’atténuer supprimerait une nuance théologique et littéraire authentique.
- issue: Priorité chronologique des créatures de chair
  choice: « les premiers êtres de chair »
  alternative: « la première œuvre de chair »
  rationale: La formulation retenue conserve l’affirmation selon laquelle ces créatures furent les premières de cette catégorie, sans expliquer davantage la tension possible avec d’autres récits de création.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste ouverte par un tiret final, puisque le verset se poursuit dans l’unité textuelle suivante.
