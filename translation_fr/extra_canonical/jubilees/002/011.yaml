revisions:
- from: Le cinquième jour, il créa les grands monstres marins dans les profondeurs des eaux, car ils furent les premiers êtres de chair façonnés par ses mains, ainsi que tout être mobile qui se meut dans les eaux et tout ce qui vole —
  to: Le cinquième jour, il créa les grands monstres marins au milieu des eaux, car ils furent les premiers êtres de chair faits par ses mains, ainsi que tout ce qui se meut dans les eaux et tout ce qui vole —
  rationale: Correction de la localisation afin de ne pas transformer « au milieu des eaux » en « dans les profondeurs des eaux », et adoption de « faits par ses mains », plus littéral sans perdre l’image anthropomorphique. Le reste de la structure, y compris la suspension finale, est conservé.
