  verdict: revise
  source_fidelity: 'L’énumération calendaire est intégralement conservée et respecte le guèze : jours, sabbats, mois, fêtes, années, sabbats d’années, jubilés et « tout temps ». « Tous les temps » rend littéralement ለኵሉ፡ ጊዜ et ne doit pas être étendu en « toutes les saisons des années » sur la seule base de l’anglais. Le verbe « établit » est toutefois un peu plus institutionnel que ወወሀበ (« donna ») ; « fit du soleil » restitue naturellement en français le fait que Dieu lui confère cette fonction de signe.'
