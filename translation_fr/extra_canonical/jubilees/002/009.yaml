  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: fr
  text: sur le jour et la nuit, et pour séparer la lumière des ténèbres. Dieu fit du soleil un grand signe sur la terre, pour les jours, les sabbats, les mois, les fêtes, les années, les sabbats d’années, les jubilés et tous les temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበዓላት (la-baʿālāt)
  choice: pour les fêtes
  rationale: Le terme désigne les fêtes ou célébrations fixées; « fêtes » conserve ici sa portée cultuelle et calendaire sans ajouter une interprétation confessionnelle.
- source_word: ለሰንበታት፡ ዓመታት (la-sanbatāt ʿāmatāt)
  choice: les sabbats d’années
  rationale: Rendu formel qui préserve l’expression inhabituelle du texte et son lien avec les cycles sabbatiques.
- source_word: ለኵሉ፡ ጊዜ (la-kullu gize)
  choice: tous les temps
  rationale: Le guèze dit littéralement « tout temps »; cette traduction évite d’ajouter « des années », absent de la leçon fournie.
- source_word: ወወሀበ (wa-wahaba)
  choice: établit
  rationale: Littéralement « donna »; dans ce contexte, « établit » exprime naturellement l’attribution au soleil de sa fonction de signe.
theological_decisions:
- issue: Fonction calendaire du soleil
  choice: Conserver toute l’énumération des jours, sabbats, mois, fêtes, années, sabbats d’années et jubilés.
  alternative: Regrouper ces éléments sous une formule générale telle que « pour fixer le calendrier ».
  rationale: L’énumération porte une tension théologique et calendaire propre au texte; elle ne doit pas être simplifiée ni harmonisée avec un système ultérieur.
translation_notes:
  register: Français international moderne, sobre et digne. Le début reste syntaxiquement rattaché au contexte précédent, comme dans la source. « Ténèbres », « sabbats » et « jubilés » conservent le registre biblique tout en restant accessibles.
