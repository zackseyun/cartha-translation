  text: one place outside this firmament[7], and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and woods, and the Garden of Eden in Eden for delight, and all these four great kinds he made on the third day.
translation:
  language: fr
  text: En un seul lieu, hors de ce firmament, et la terre ferme apparut. Ce jour-là, il créa sur elle toutes les mers, selon leurs divers rassemblements, tous les fleuves, les rassemblements des eaux dans les montagnes et sur toute la terre, tous les lacs, toute la rosée de la terre, la semence que l’on sème, tout ce qui germe, les arbres qui portent du fruit, les forêts et le jardin d’Éden, en Éden, pour les délices. Il fit toutes ces quatre grandes catégories[a] le troisième jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule « toutes ces quatre grandes catégories » est difficile à interpréter, car l’énumération réunit des réalités géographiques, la végétation et Éden. Le nombre résume probablement des ensembles d’éléments plutôt que chaque élément pris séparément.
    reason: segmentation_note
lexical_decisions:
- source_word: ጽናዓት
  choice: firmament
  rationale: Le terme désigne l’étendue ferme du récit de la création; « firmament » conserve cette conception cosmologique et le lien avec le vocabulaire biblique français.
- source_word: የብስ
  choice: terre ferme
  rationale: Rend la terre sèche apparue après le rassemblement des eaux, plutôt qu’une simple notion abstraite de sécheresse.
- source_word: አብህርተ
  choice: mers
  rationale: Correspond au pluriel du terme gé‘ez désignant les mers.
- source_word: ምዕቃባተ
  choice: lacs
  rationale: Dans cette énumération hydrographique, le mot désigne naturellement des réservoirs ou étendues d’eau; « lacs » est clair et idiomatique.
- source_word: አማተ
  choice: forêts
  rationale: Conserve l’élément distinct présent dans le gé‘ez entre les arbres fruitiers et le jardin d’Éden, omis dans une version antérieure.
- source_word: ትውልደ
  choice: catégories
  rationale: Le sens littéral lié aux « générations » ou « espèces » fonctionne ici comme un classement des œuvres créées; « catégories » rend naturellement cette fonction sans prétendre identifier précisément les quatre groupes.
theological_decisions:
- issue: Le jardin d’Éden est présenté comme situé « en Éden » et destiné au plaisir.
  choice: « le jardin d’Éden, en Éden, pour le plaisir »
  alternative: « le jardin d’Éden pour les délices »
  rationale: La formulation retenue conserve à la fois la localisation répétée dans la source et la finalité exprimée, sans harmoniser silencieusement avec une formulation canonique plus familière.
translation_notes:
  register: Français international moderne, clair et soutenu. Le début demeure une continuation syntaxique du verset précédent conformément à la coupure transmise. La longue énumération est conservée, mais ponctuée pour rester lisible.
