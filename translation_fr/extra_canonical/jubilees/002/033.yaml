  text: and for glory above all days. This law and testimony was given to the children of Israel as an everlasting law throughout their generations.
translation:
  language: fr
  text: et pour la gloire, au-dessus de tous les autres jours. Cette loi et ce témoignage ont été donnés aux enfants d’Israël comme une loi éternelle, de génération en génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለስብሐት
  choice: pour la gloire
  rationale: Le préfixe ለ- exprime ici la destination ou la finalité (« pour »), et ስብሐት désigne la gloire ou la louange.
- source_word: እምኵሉ መዋዕል
  choice: au-dessus de tous les jours
  rationale: Rend directement la comparaison ou la prééminence exprimée par እም (« plus que, au-dessus de ») avec « tous les jours ».
- source_word: ሕግ ወስምዕ
  choice: cette loi et ce témoignage
  rationale: Conserve les deux substantifs distincts du guèze sans réduire « témoignage » à un simple synonyme de loi.
- source_word: ለደቂቀ እስራኤል
  choice: aux enfants d’Israël
  rationale: Formulation biblique naturelle qui correspond littéralement à « fils/enfants d’Israël ».
- source_word: ሕገ ዘለዓለም
  choice: une loi éternelle
  rationale: Rend l’idée d’une prescription durable et perpétuelle sans ajout confessionnel.
- source_word: ለትውልዶሙ
  choice: de génération en génération
  rationale: Expression française idiomatique pour la portée continue à travers leurs générations.
theological_decisions:
- issue: Portée de « loi et témoignage »
  choice: Maintenir les deux termes coordonnés
  alternative: Fusionner en « prescription attestée » ou comprendre le témoignage comme le contenu de la loi
  rationale: Le texte source juxtapose explicitement les deux noms; leur rapport exact doit rester ouvert.
- issue: Durée de la loi
  choice: « loi éternelle »
  alternative: « prescription perpétuelle »
  rationale: Cette traduction préserve la force temporelle de ዘለዓለም sans expliquer ni limiter théologiquement son application.
