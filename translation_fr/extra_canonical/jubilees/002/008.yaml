  text: And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule it,
translation:
  language: fr
  text: Et le quatrième jour, il fit le soleil, la lune et les étoiles, et il les plaça dans le firmament du ciel afin qu’ils éclairent toute la terre et la gouvernent,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምጽናዓተ፡ ሰማይ
  choice: le firmament du ciel
  rationale: Cette expression rend directement l’idée de la voûte ou étendue céleste et conserve le vocabulaire cosmologique du texte source.
- source_word: ያብርሁ
  choice: qu’ils éclairent
  rationale: Le verbe exprime le fait de donner de la lumière; cette tournure est naturelle en français et maintient le sujet pluriel des astres.
- source_word: ለኰንኖ
  choice: la gouvernent
  rationale: Le verbe signifie exercer une domination ou gouverner; le pronom féminin reprend naturellement « toute la terre ».
theological_decisions:
- issue: Portée du gouvernement exercé par les luminaires
  choice: « la gouvernent », avec « la » renvoyant à toute la terre
  alternative: « président à son ordre » ou « dominent sur elle »
  rationale: La traduction garde l’affirmation cosmologique du texte sans préciser de quelle manière les astres gouvernent la terre ni lui imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La coordination simple et le terme traditionnel « firmament » préservent le ton du récit de création. La virgule finale est maintenue parce que le verset fourni forme une proposition qui se poursuit dans le contexte.
