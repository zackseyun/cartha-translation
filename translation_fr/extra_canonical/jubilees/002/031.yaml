  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
translation:
  language: fr
  text: Et le Créateur de tout la bénit[a], mais il ne consacra pas tous les peuples et toutes les nations pour qu’ils y observent le sabbat. Israël seul — à lui seul — reçut le droit de manger, de boire et d’y observer le sabbat sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom renvoie au jour du sabbat. Le texte affirme que le Créateur a béni ce jour, mais qu’il n’a pas consacré tous les peuples et toutes les nations à l’observer : cette observance terrestre consacrée est accordée à Israël seul.'
    reason: cross_reference
lexical_decisions:
- source_word: ባረከ
  choice: bénit
  rationale: Rend directement le verbe « bénir » au passé, avec pour objet le jour évoqué dans le contexte.
- source_word: አቀደሰ
  choice: consacra
  rationale: Exprime la mise à part comme sacrée; « sanctifia » resterait possible, mais paraît moins naturel avec des peuples comme complément.
- source_word: ለአሰንብቶ፡ ባቲ
  choice: pour qu’ils y observent le sabbat
  rationale: Rend l’action de cesser le travail ou de célébrer le repos sabbatique, avec le pronom locatif renvoyant au jour.
- source_word: ወሀበ
  choice: reçut le droit
  rationale: Le sens contextuel est celui d’un privilège accordé, et non du don matériel de nourriture; la tournure française explicite naturellement le bénéficiaire.
- source_word: ይብላዕ፡ ወይስተይ
  choice: de manger, de boire
  rationale: Conserve les deux actes coordonnés sans ajouter une interprétation cultuelle ou festive absente de la formulation.
- source_word: ምድር
  choice: sur la terre
  rationale: Conserve la portée terrestre explicite du texte.
theological_decisions:
- issue: Élection d’Israël relativement au sabbat
  choice: Israël seul — à lui seul — reçut le droit
  alternative: Israël seul fut sanctifié pour observer le sabbat
  rationale: Préserve l’insistance répétée sur l’exclusivité sans transférer à Israël un verbe de sanctification que la syntaxe source applique négativement à l’ensemble des peuples et des nations.
- issue: Nature de ce qui est accordé
  choice: le droit de manger, de boire et d’y observer le sabbat
  alternative: il lui donna de manger, de boire et d’observer le sabbat
  rationale: Le contexte indique une prérogative accordée. « Donna de manger » pourrait suggérer que Dieu fournit simplement de la nourriture et résoudrait mal la relation entre le verbe et les trois infinitifs.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « Israël seul — à lui seul — » conserve l’emphase du guèze. « Observer le sabbat » est plus idiomatique que « sabbatiser » tout en gardant le sens religieux précis.
