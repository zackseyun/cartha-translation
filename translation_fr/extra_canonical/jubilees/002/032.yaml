translation:
  language: fr
  text: en ce jour-là, sur la terre. Et le Créateur de tout le bénit[a], lui qui créa ce jour pour la bénédiction et la sainteté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et le Créateur de tout bénit ce jour qu’il avait créé pour la bénédiction et la sainteté. »'
    reason: Signale l’autre rattachement possible, plus fluide, où le pronom et « ce jour » sont compris comme un même objet.
lexical_decisions:
- source_word: ባቲ፡ በዲበ፡ ምድር
  choice: en ce jour, sur la terre
  rationale: La tournure guèze renvoie par un pronom au jour mentionné dans le contexte. L’explicitation minimale « ce jour » donne en français un fragment intelligible tout en conservant la localisation « sur la terre ».
- source_word: ፈጣሪ፡ ኵሉ
  choice: le Créateur de tout
  rationale: Rend directement le titre guèze sans ajouter « choses », absent du texte.
- source_word: ለበረከት፡ ወለቅድሳት
  choice: pour la bénédiction et la sainteté
  rationale: Conserve les deux substantifs abstraits et leur relation finale avec la création de ce jour.
theological_decisions:
- issue: Objet de « bénit » et rattachement de la proposition relative
  choice: « le bénit, lui qui créa ce jour »
  alternative: « bénit ce jour qu’il avait créé »
  rationale: Le texte distingue grammaticalement le pronom objet de la proposition relative introduite par ዘ-. La formulation retenue préserve cette structure et son ambiguïté plutôt que de les fusionner silencieusement.
translation_notes:
  register: Français moderne, sobre et digne. Le début reste volontairement lié au contexte précédent, comme dans le texte source. Le passé simple convient au registre narratif biblique sans archaïsme lexical.
