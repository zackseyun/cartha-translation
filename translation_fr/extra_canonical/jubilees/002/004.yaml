  yaml_path: translation/extra_canonical/jubilees/002/004.yaml
  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
translation:
  language: fr
  text: 'Il fit sept grandes œuvres le premier jour. Le deuxième jour, il fit le firmament au milieu des eaux, et les eaux furent séparées ce jour-là : la moitié monta au-dessus, et l’autre moitié descendit au-dessous du firmament qui se trouve au milieu, au-dessus de la surface de toute la terre.[a] Et il ne fit que cela.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre ponctuation possible : « descendit au-dessous du firmament, au milieu, au-dessus de la surface de toute la terre ». Le texte guèze ne marque pas clairement le rattachement de « au milieu » et du complément spatial qui suit.'
    reason: Le rattachement syntaxique des compléments spatiaux demeure ambigu dans le texte source.
  - marker: b
    text: 'Littéralement : « Et ceci seulement. » Le verbe est sous-entendu; le contexte rattache vraisemblablement l’énoncé au deuxième jour.'
    reason: La formulation guèze est elliptique; la traduction fournit seulement le verbe nécessaire à une phrase française naturelle, sans ajouter explicitement « ce jour-là ».
lexical_decisions:
- source_word: ሰብዐተ፡ ግብረ፡ ዐበይተ
  choice: sept grandes œuvres
  rationale: Rend directement le nombre, le substantif « œuvres » et l’adjectif « grandes », tout en conservant l’écho du récit de la création.
- source_word: ምጽናዓተ
  choice: le firmament
  rationale: Terme traditionnel et précis dans ce contexte cosmologique biblique; il correspond à l’étendue solide ou affermie séparant les eaux.
- source_word: ተከፍለ፡ ማያት
  choice: les eaux furent séparées
  rationale: Conserve la forme passive du texte source et l’idée de division en deux parts.
- source_word: መንፈቆሙ
  choice: la moitié / l’autre moitié
  rationale: Exprime naturellement en français la répartition des eaux en deux moitiés parallèles.
- source_word: ዲበ፡ ገጸ፡ ለኵሉ፡ ምድር
  choice: au-dessus de la surface de toute la terre
  rationale: Reproduit les éléments spatiaux du guèze sans alourdir excessivement la phrase.
- source_word: ወዘንተ፡ ባሕቲቶ
  choice: Ce fut la seule œuvre qu’il accomplit ce jour-là
  rationale: Explicite en français l’ellipse verbale du guèze selon le contexte immédiat; « ce jour-là » est suppléé pour éviter que l’énoncé soit compris comme niant les œuvres du premier jour.
theological_decisions:
- issue: Nature cosmologique de ምጽናዓተ
  choice: firmament
  alternative: étendue
  rationale: « Firmament » préserve le vocabulaire traditionnel du récit de création et ne tranche pas en faveur d’une cosmologie modernisée.
- issue: Portée de « ceci seul » à la fin du verset
  choice: la seule œuvre qu’il accomplit ce jour-là
  alternative: Et cela seulement.
  rationale: Le contexte indique vraisemblablement que le firmament est l’unique œuvre du deuxième jour. La formulation retenue explicite cette portée, tandis qu’une note conserve l’ellipse et l’ambiguïté formelles de la source.
- issue: Attachement syntaxique de « au milieu, au-dessus de la surface de toute la terre »
  choice: « au milieu » qualifie le firmament, puis « au-dessus de la surface… » précise sa position
  alternative: « au-dessous du firmament, au milieu, au-dessus de la surface de toute la terre »
  rationale: Cette lecture est syntaxiquement cohérente et donne un français intelligible, mais l’enchaînement du guèze permet une ponctuation différente; celle-ci est signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. « Accomplir » est employé pour les œuvres, tandis que « faire » convient au firmament. La ponctuation allège la longue séquence spatiale sans effacer son ambiguïté, conservée dans les notes.
