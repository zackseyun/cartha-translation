lexical_decisions:
- source_word: ወገብሩ፡ ከማሁ፡ ማያት፡
  choice: Et les eaux firent ainsi
  rationale: Rend directement la proposition guèze, avec l’ordre naturel du français tout en conservant l’idée d’exécution.
- source_word: በከመ፡ ይቤሎሙ፡
  choice: exactement comme il le leur avait dit
  rationale: « Comme » représente በከመ, tandis que le plus-que-parfait situe naturellement la parole avant son accomplissement; le pronom « leur » conserve le complément pluriel de ይቤሎሙ.
- source_word: ወተገብሡ፡
  choice: et elles se retirèrent
  rationale: Exprime le mouvement de retrait des eaux sans ajouter une destination absente du fragment transmis.
- source_word: እምዲበ፡ ገጸ፡ ለምድር፡
  choice: de la surface de la terre
  rationale: Rend idiomatiquement la relation spatiale « de dessus la face de la terre »; « surface » évite en français une traduction inutilement calquée.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La personnification grammaticale des eaux et le pronom indirect pluriel sont conservés. Aucun complément n’est ajouté après le dernier ውስተ፡, qui paraît suspendu dans l’extrait fourni et ne permet pas à lui seul de préciser une destination.
