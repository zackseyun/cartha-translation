  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
translation:
  language: fr
  text: Il distingue la lumière des ténèbres et favorise la prospérité[a], afin que tout ce qui germe et pousse sur la terre prospère. Il créa ces trois catégories le quatrième jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « favorise la guérison » ou « fait fleurir ». Le terme évoque l’effet bénéfique des luminaires célestes sur la croissance terrestre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይፈሊጥ፡ ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት
  choice: Il distingue la lumière des ténèbres
  rationale: La construction avec ማእከለ… ወማእከለ… exprime idiomatiquement une distinction entre deux réalités. Une traduction littérale par « entre le milieu de… et le milieu de… » serait artificielle en français.
- source_word: ወለጠዐዮ፡ ከመ፡ ይጥዐይ
  choice: et favorise la prospérité, afin que… prospère
  rationale: La répétition de la racine est conservée autant que possible. « Favorise » donne une syntaxe française naturelle, tandis que « prospérité / prospère » maintient le lien lexical et l'effet bénéfique sur la croissance terrestre.
- source_word: ኵሉ፡ ዘይሠርፅ፡ ወይለቍፅ፡ ዲበ፡ ምድር
  choice: tout ce qui germe et pousse sur la terre
  rationale: Les deux verbes de croissance sont rendus distinctement par des termes courants et naturels.
- source_word: ሠለስተ፡ ዘንተ፡ ዘመደ
  choice: ces trois catégories
  rationale: « Catégories » rend ዘመደ dans son sens de sortes ou groupes, sans préciser dans le texte ce que le contexte permet d'identifier.
theological_decisions:
- issue: Portée de l'effet bénéfique des luminaires
  choice: favorise la prospérité
  alternative: apporte la guérison / fait fleurir
  rationale: Le texte associe cet effet à ce qui germe et pousse sur la terre. La traduction garde cette orientation sans lui attribuer une portée doctrinale ou médicale plus précise que ne l'impose le terme guèze.
translation_notes:
  register: Français international moderne, fluide et digne. Le sujet singulier « Il » est conservé conformément à la forme verbale du texte reçu. Le segment initial ለዓመታት (« pour les années ») est traité comme la fin du verset précédent, conformément à la division du passage et à la couche de consultation auditée.
