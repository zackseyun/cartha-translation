revisions:
- from: 'les oiseaux et toutes leurs espèces. Le soleil se leva sur eux pour leur bien, ainsi que sur tout ce qui se trouvait sur la terre : tout ce qui pousse de la terre, tout arbre qui porte du fruit et toute chair. Il fit ces trois espèces le cinquième jour. Le sixième jour, il fit toutes les bêtes de la terre, tout le bétail et tout ce qui se déplace sur la terre. Après tout cela, il fit les êtres humains ; homme et femme, il les fit. Il leur donna autorité sur tout ce qui est sur la terre et dans les mers, sur tout ce qui vole, sur les bêtes, sur le bétail, sur tout ce qui se déplace sur la terre et sur toute la terre. Sur tout cela, il leur donna autorité. Il fit ces quatre espèces le sixième jour. Il y eut en tout vingt-deux espèces.


    Il acheva toute son œuvre le sixième jour : tout ce qui est dans les cieux, sur la terre, dans les mers, dans les profondeurs, dans la lumière, dans les ténèbres et en toutes choses. Il nous donna comme grand signe le jour du sabbat, afin que nous travaillions pendant six jours et que, le septième jour, nous nous reposions de tout travail. À nous tous, les anges de la Présence et tous les anges de la sanctification — ces deux grandes espèces —, il dit : « Reposons-nous avec lui dans le ciel et sur la terre. »


    Puis il me dit : « Voici que je mettrai à part pour moi un peuple parmi tous les peuples. Eux aussi observeront le sabbat. Je les sanctifierai pour moi afin qu’ils soient mon peuple, et je les bénirai. De même que j’ai sanctifié le jour du sabbat, je les sanctifierai pour moi et je les bénirai. Ils seront mon peuple, et moi, je serai leur Dieu. J’ai choisi la descendance de Jacob parmi tous ceux que j’ai vus ; je l’ai inscrite comme mon fils premier-né et je l’ai sanctifiée pour moi pour toujours. Je leur ferai connaître le jour du sabbat, afin qu’ils s’y reposent de tout travail. »


    Ainsi, il en fit un signe pour qu’eux aussi observent le sabbat avec nous le septième jour, mangent, boivent et bénissent celui qui a créé toutes choses. Car il a béni et sanctifié pour lui-même un peuple qu’il s’est acquis parmi toutes les nations, afin qu’ils observent le sabbat avec nous. Il fit monter sa volonté comme un parfum agréable, accueilli favorablement devant lui, tous les jours.


    Il y eut vingt-deux chefs de l’humanité depuis Adam jusqu’à Jacob, et vingt-deux espèces d’œuvres furent accomplies jusqu’au septième jour. Celui-ci est béni et saint, et celui-là aussi est béni et saint ; l’un avec l’autre furent destinés à la sanctification et à la bénédiction. Il fut accordé à celui-ci que ses membres soient bénis et saints tous les jours, selon le témoignage et la première loi, comme il fut sanctifié et béni le septième jour.


    Il créa le ciel, la terre et tout ce qu’il créa en six jours, et Dieu rendit saint le septième jour à l’égard de toutes ses œuvres. C’est pourquoi il ordonna à son sujet que quiconque y accomplit un travail meure, et que quiconque le profane soit mis à mort.


    Et toi, ordonne aux enfants d’Israël d’observer ce jour, de le sanctifier, de n’y accomplir aucun travail et de ne pas le profaner, car il est plus saint que tous les autres jours. Quiconque le profane sera mis à mort, et quiconque y accomplit un travail sera mis à mort pour toujours. Ainsi, les enfants d’Israël observeront ce jour de génération en génération et ne seront pas déracinés du pays, car c’est un jour saint et un jour béni. Et toute personne qui l’observe et s’y repose[a]…[b]'
