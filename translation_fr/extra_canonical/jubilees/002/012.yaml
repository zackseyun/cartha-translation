  footnotes:
  - marker: a
    text: Le segment transmis ici commence au milieu d’une phrase et réunit un long passage qui correspond vraisemblablement à plusieurs divisions traditionnelles, souvent numérotées 12 à 28.
    reason: segmentation_note
  - marker: b
    text: Le texte guèze fourni s’interrompt après les mots « et toute personne qui l’observe et s’y repose ». La fin parfois imprimée — « de tout son travail sera sainte et bénie tous les jours, comme nous » — n’est donc pas intégrée au texte principal.
