lexical_decisions:
- source_word: ጥዒና
  choice: pour leur bien
  rationale: Le nom exprime la santé, le bien-être ou la prospérité. « Pour leur bien » reste naturel sans réduire le sens à la richesse matérielle.
- source_word: ዘይሰርር
  choice: tout ce qui vole
  rationale: Le verbe renvoie au vol, et non au fait de ramper ; les créatures qui se déplacent sont mentionnées séparément.
- source_word: ዘመደ
  choice: espèces
  rationale: Dans l’inventaire de la création, le terme désigne des catégories ou sortes d’êtres créés ; « espèces » rend cette fonction de classement.
- source_word: አስለጦ
  choice: donna autorité
  rationale: Le contexte décrit la domination confiée aux humains. Cette formulation française est claire et évite une paraphrase confessionnelle.
- source_word: ፈቃደቲሁ
  choice: sa volonté
  rationale: Le terme signifie la volonté ou le bon plaisir ; il ne signifie pas ici « ses commandements ».
- source_word: መላእክተ፡ ገጽ
  choice: anges de la Présence
  rationale: Rend littéralement la classe angélique désignée par la « face/présence », avec la majuscule comme titre traditionnel intelligible.
- source_word: ሕዝበ፡ ዘያጠራ
  choice: un peuple qu’il s’est acquis
  rationale: Le verbe évoque un peuple constitué comme possession propre ; cette tournure préserve le rapport d’appartenance sans lourdeur.
theological_decisions:
- issue: Rapport entre le sabbat céleste et le peuple choisi
  choice: Conserver le langage selon lequel Israël observe le sabbat « avec nous », les anges
  alternative: Généraliser en disant seulement qu’Israël observe le sabbat devant Dieu
  rationale: Le texte établit explicitement un parallèle entre le repos angélique et celui du peuple ; l’effacer atténuerait sa théologie propre.
- issue: Identification de la descendance de Jacob comme fils premier-né
  choice: 'Employer le féminin collectif : « je l’ai inscrite comme mon fils premier-né »'
  alternative: Transformer en « j’ai inscrit Jacob comme mon fils premier-né »
  rationale: Le référent immédiat est la descendance de Jacob, tandis que le titre source demeure au masculin singulier. La formulation garde cette tension grammaticale et collective.
- issue: Sanction de mort liée au sabbat
  choice: Traduire directement « sera mis à mort »
