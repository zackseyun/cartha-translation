base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
translation:
  language: fr
  text: 'Car le premier jour, il créa les cieux d’en haut, la terre et les eaux, ainsi que tous les esprits qui servent devant lui : les anges de la Présence, les anges de la sanctification, les anges de l’esprit du feu, les anges de l’esprit des nuages, des ténèbres, de la neige, de la grêle et du gel, les anges des voix, du tonnerre et des éclairs, les anges des esprits du froid, de la chaleur, de l’hiver, de l’automne, des moissons et de l’été, ainsi que tous les esprits de ses œuvres qui sont dans les cieux, sur la terre, dans les mers, dans les profondeurs, dans les ténèbres, dans la nuit, dans la lumière, dans l’aurore et au matin[a] — tout ce qu’il prépara selon la connaissance de son cœur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le catalogue est particulièrement dense dans la tradition éthiopienne et certains de ses éléments présentent des indices de compression ou de variation textuelle. La traduction conserve l’ordre du texte fourni, notamment « la nuit » et « le matin », sans lisser la liste.
    reason: segmentation_note
lexical_decisions:
- source_word: መላእክተ ገጽ
  choice: les anges de la Présence
  rationale: Littéralement « anges de la face » ; « Présence » exprime ici leur service immédiat devant Dieu tout en conservant le titre traditionnel.
- source_word: መጸው
  choice: l’automne
  rationale: Le terme désigne la saison qui suit les pluies, généralement l’automne, plutôt que le printemps donné par certaines traditions de traduction.
- source_word: ማእረር
  choice: les moissons
  rationale: Le mot renvoie à la récolte ou à la saison des moissons ; le pluriel français convient au catalogue des phénomènes et des saisons.
- source_word: አእምሮ ልቡ
  choice: la connaissance de son cœur
  rationale: « Connaissance » rend directement አእምሮ, tandis que « de son cœur » préserve l’anthropologie et la formulation du texte source.
- source_word: ወጽባሕ
  choice: et dans le matin
  rationale: Le texte fourni porte explicitement « matin » ; cette formulation conserve aussi la distinction avec l’« aurore » qui précède.
theological_decisions:
- issue: Nature des anges et des esprits élémentaires créés le premier jour
  choice: Conserver la distinction et l’enchaînement entre « anges » et « esprits » sans les identifier ni les rationaliser davantage.
  alternative: Transformer tous les éléments du catalogue en catégories d’anges, ou comprendre les « esprits » comme de simples forces naturelles.
  rationale: Le guèze présente un catalogue dense où les catégories se chevauchent. La traduction maintient cette tension cosmologique sans imposer une systématisation doctrinale.
- issue: « anges de la face »
  choice: Employer le titre « anges de la Présence ».
  alternative: « anges de la face » ou « anges qui se tiennent devant lui ».
  rationale: « Présence » est naturel en français et correspond au contexte immédiat de service devant Dieu, sans préciser une hiérarchie angélique absente du verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue phrase cumulative et la répétition de « les anges » sont conservées pour refléter le caractère solennel du catalogue. Le tiret avant la proposition finale clarifie sa portée sans supprimer l’ambiguïté syntaxique du texte source.
