  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
translation:
  language: fr
  text: Telle fut l’œuvre qu’il accomplit le deuxième jour. Le troisième jour, il ordonna aux eaux de se retirer de devant la surface de toute la terre et de se rassembler en un seul lieu, et à la terre ferme d’apparaître.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ordonna aux eaux de se retirer de devant la surface de toute la terre pour se rassembler en un seul lieu, et dit : “Que la terre ferme apparaisse !” »'
    reason: La syntaxe transmise permet de comprendre la dernière proposition soit comme un second complément du commandement, soit comme une formulation jussive plus directe.
lexical_decisions:
- source_word: ገብረ
  choice: accomplit
  rationale: Le verbe signifie « faire, accomplir ». « Accomplit » convient naturellement à « l’œuvre » et conserve la répétition sémantique du texte sans produire le maladroit « fit l’œuvre ».
- source_word: ገጸ፡ ለኵላ፡ ምድር
  choice: la surface de toute la terre
  rationale: Littéralement « la face de toute la terre » ; « surface » restitue ici l’image spatiale en français moderne naturel.
- source_word: ውስተ፡ መካን፡ አሐዱ
  choice: en un seul lieu
  rationale: Rend directement l’expression « dans/en un lieu unique ».
- source_word: የብስ
  choice: la terre ferme
  rationale: Désigne le sec ou le terrain émergé ; « terre ferme » est idiomatique dans ce contexte de création.
theological_decisions:
- issue: Portée du commandement divin sur les eaux et la terre ferme
  choice: 'Coordonner deux compléments de « il ordonna » : « aux eaux… et à la terre ferme… »'
  alternative: 'Comprendre la seconde proposition comme un ordre direct : « et que la terre ferme apparaisse »'
  rationale: La construction française retenue garde les deux événements sous la portée du même verbe de commandement, conformément au parallélisme du passage, tout en signalant en note l’autre analyse possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Telle fut l’œuvre » assure une phrase complète et digne ; « surface » évite l’expression aujourd’hui marquée « face de la terre ». Le marqueur [a] figure dans le texte principal.
