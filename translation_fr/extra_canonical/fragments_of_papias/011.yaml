base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: fr
  text: 'La bénédiction ainsi annoncée appartient sans aucun doute aux temps du Royaume, lorsque les justes ressusciteront d’entre les morts et régneront. Alors aussi, renouvelée et libérée de l’esclavage, la création produira en abondance toutes sortes de nourritures, grâce à la rosée du ciel et à la fécondité de la terre. C’est ce que rapportent les anciens qui ont vu Jean, le disciple du Seigneur : ils disaient avoir entendu de lui comment le Seigneur enseignait au sujet de ces temps-là et disait :


    « Les jours viendront où pousseront des vignes ayant chacune dix mille sarments ; chaque sarment aura dix mille branches, chaque branche dix mille rameaux, chaque rameau dix mille grappes et chaque grappe dix mille raisins. Chaque raisin pressé donnera vingt-cinq mesures de vin.[a] Et lorsque l’un des saints aura saisi une grappe, une autre s’écriera : “Je suis une meilleure grappe ! Prends-moi et, par moi, bénis le Seigneur !” De même, un grain de blé produira dix mille épis ; chaque épi aura dix mille grains, et chaque grain donnera dix livres de fleur de farine, éclatante et pure.[b] Les autres fruits, les semences et l’herbe produiront dans les mêmes proportions. Tous les animaux qui se nourriront de ces produits de la terre deviendront à leur tour paisibles et vivront en harmonie ; ils seront entièrement soumis à l’être humain. »


    Voilà ce dont Papias, auditeur de Jean et compagnon de Polycarpe, homme des temps anciens, témoigne par écrit dans le quatrième de ses livres — il en a composé cinq. Il ajoutait :


    « Ces choses sont crédibles pour ceux qui croient. »


    Et comme Judas, le traître, ne croyait pas et demandait : « Comment le Seigneur pourra-t-il accomplir une telle fécondité ? », Papias rapporte que le Seigneur répondit : « Ceux qui parviendront à ces temps-là le verront. »


    — Irénée, Contre les hérésies 5.33.3–4.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « mesure » traduit ici une ancienne unité de capacité dont la valeur exacte variait selon les lieux et les époques.
    reason: Éviter une conversion moderne faussement précise tout en signalant la nature technique du terme.
  - marker: b
