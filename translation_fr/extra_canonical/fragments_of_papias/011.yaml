    reason: Signaler clairement la provenance indirecte du fragment et la limite documentaire de la base de travail.
lexical_decisions:
- source_word: Kingdom
  choice: Royaume
  rationale: La majuscule conserve la portée eschatologique du terme dans le témoin, sans préciser davantage la nature du règne.
- source_word: fatness of the earth
  choice: fécondité de la terre
  rationale: Expression française naturelle qui rend l’idée de richesse productive du sol plutôt qu’une traduction littérale obscure.
- source_word: shoots / branches / twigs
  choice: sarments / branches / rameaux
  rationale: La gradation végétale est maintenue avec un vocabulaire compréhensible, malgré le caractère quelque peu artificiel de l’énumération transmise.
- source_word: fine flour, bright and clean
  choice: fleur de farine, éclatante et pure
  rationale: « Fleur de farine » désigne une farine très fine ; les deux qualificatifs sont conservés distinctement.
- source_word: hearer of John
  choice: auditeur de Jean
  rationale: Rend sobrement l’affirmation de transmission personnelle sans la renforcer en « disciple ».
- source_word: ancient worthy
  choice: homme des temps anciens
  rationale: Formulation prudente, proche du témoignage ancien sous-jacent, qui évite d’introduire un jugement hagiographique excessif.
- source_word: all subjection
  choice: entièrement soumis
  rationale: Restitue l’intensité de la soumission tout en donnant une phrase française idiomatique.
theological_decisions:
- issue: Nature et chronologie du Royaume
  choice: « aux temps du Royaume, lorsque les justes ressusciteront […] et régneront »
  alternative: Interpréter explicitement ce passage comme un millénium terrestre déterminé
  rationale: La traduction conserve l’affirmation eschatologique du témoin sans lui imposer un système chronologique ou confessionnel.
- issue: Statut des paroles attribuées au Seigneur
  choice: 'Conserver la chaîne de transmission explicitement : anciens → Jean → enseignement du Seigneur'
  alternative: Présenter ces paroles comme une citation directe certaine de Jésus
  rationale: Le texte est une tradition rapportée à plusieurs niveaux ; cette distance testimoniale doit demeurer visible.
- issue: Sens de la fécondité prodigieuse
  choice: Traduire les quantités et images concrètement
  alternative: Les spiritualiser ou les qualifier de symboliques
  rationale: Le témoin les présente sous une forme matérielle ; leur interprétation ne doit pas être décidée silencieusement par la traduction.
- issue: Identification de Jean
  choice: « Jean, le disciple du Seigneur » dans le récit, puis simplement « Jean » pour Papias
  alternative: Identifier partout Jean explicitement à l’apôtre Jean ou à Jean l’Ancien
  rationale: Le passage transmis ne résout pas sans ambiguïté toutes les questions historiques liées aux différents Jean mentionnés dans la tradition de Papias.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Les répétitions numériques et la structure cumulative ont été conservées, car elles appartiennent à la rhétorique du passage. Les niveaux de citation ont été rendus visibles par la ponctuation et les paragraphes. Les erreurs manifestes d’OCR du témoin anglais ont été corrigées sans être reproduites.
