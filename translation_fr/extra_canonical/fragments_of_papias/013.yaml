base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: fr
  text: 'Il s’exprime ainsi de manière obscure, faisant allusion, je suppose, à Papias de Hiérapolis, en Asie, qui était alors évêque et vivait à l’époque du saint évangéliste Jean. En effet, ce Papias, dans le quatrième livre de ses Expositions des paroles du Seigneur[a], a mentionné des mets parmi les sources de délices lors de la résurrection… Irénée de Lyon dit la même chose dans le cinquième livre de son ouvrage Contre les hérésies et invoque, à l’appui de ses affirmations, le Papias mentionné plus haut.


    MAXIME LE CONFESSEUR, Scolies sur La Hiérarchie ecclésiastique de Denys l’Aréopagite, chapitre 7.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le titre grec de l’ouvrage de Papias est habituellement compris comme « Expositions des paroles du Seigneur »; on traduit aussi « Explication des sentences du Seigneur » ou « Expositions des oracles du Seigneur ». La vérification directe du texte grec ou latin de ce témoin reste à effectuer.
    reason: Le dossier fourni repose sur une traduction anglaise ancienne et indique qu’un contrôle dans la langue source est encore en attente; le sens exact du titre traditionnel peut varier.
lexical_decisions:
- source_word: darkly indicating
  choice: de manière obscure, faisant allusion
  rationale: Conserve à la fois l’obscurité du propos et le caractère indirect de la référence supposée.
- source_word: flourished in the days of
  choice: vivait à l’époque de
  rationale: Rend naturellement une formule biographique ancienne sans suggérer à tort une prospérité matérielle.
- source_word: Dominical Expositions
  choice: Expositions des paroles du Seigneur
  rationale: « Dominical » renvoie ici vraisemblablement aux traditions ou paroles concernant le Seigneur; le choix reste explicite et lisible, avec une note signalant l’incertitude du titre.
- source_word: viands
  choice: mets
  rationale: Terme digne et courant désignant des aliments préparés, adapté au contexte des délices eschatologiques.
- source_word: in the resurrection
  choice: lors de la résurrection
  rationale: Préserve la référence eschatologique sans préciser davantage la nature ou le moment de la résurrection.
- source_word: produces in support of his statements
  choice: invoque, à l’appui de ses affirmations
  rationale: Exprime naturellement l’usage de Papias comme autorité ou témoignage corroborant.
theological_decisions:
- issue: Nature des délices liées à la résurrection
  choice: des mets parmi les sources de délices lors de la résurrection
  alternative: des aliments comme sources de plaisir dans la résurrection
  rationale: La formulation conserve l’affirmation matérielle du témoin sans la spiritualiser ni préciser à quels ressuscités ou à quelle phase eschatologique elle s’applique.
- issue: Rapport de Papias avec Jean
  choice: vivait à l’époque du saint évangéliste Jean
  alternative: connut son plein essor aux jours du saint évangéliste Jean
  rationale: Le texte affirme une contemporanéité générale, non une rencontre personnelle ni une relation de disciple; la traduction n’ajoute donc aucun lien direct.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les titres d’ouvrages sont rendus sous leur forme française usuelle. Les points de suspension du témoin sont conservés comme signal d’une lacune ou d’une coupure. Traduction provisoire fondée sur le témoin anglais public fourni, faute de texte grec ou latin directement vérifiable.
