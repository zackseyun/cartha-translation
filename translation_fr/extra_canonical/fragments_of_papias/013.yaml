    reason: Le dossier fourni repose sur une traduction anglaise ancienne et indique qu’un contrôle dans la langue source est encore en attente; le sens exact du titre traditionnel peut varier.
  revision_rationale: La révision conserve toutes les données historiques et théologiques du projet, y compris son caractère provisoire et l’ellipse transmise par le témoin. Elle corrige seulement la formulation initiale et remplace une lecture temporelle potentiellement restrictive de la résurrection par une formulation qui préserve mieux l’ambiguïté et le cadre du texte.
