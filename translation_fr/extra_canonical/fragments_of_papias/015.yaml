lexical_decisions:
- source_word: did not die by hanging
  choice: ne mourut pas par pendaison
  rationale: Rend directement l’affirmation du témoin anglais sans harmoniser explicitement les traditions relatives à la mort de Judas.
- source_word: having been cut down
  choice: car on l’avait détaché
  rationale: Dans le contexte d’une pendaison interrompue, « détaché » est naturel et évite l’ambiguïté moderne de « coupé ».
- source_word: Oracles of the Lord
  choice: paroles du Seigneur
  rationale: « Paroles » est intelligible en français courant et convient au titre ancien, sans imposer le sens moderne étroit d’« oracles ».
- source_word: walked about in this world
  choice: allait de par le monde
  rationale: Conserve l’idée d’une circulation prolongée tout en produisant une phrase française naturelle et digne.
- source_word: impiety
  choice: impiété
  rationale: Équivalent formel et traditionnel, approprié au registre patristique.
- source_word: instrument
  choice: instrument
  rationale: Le témoin ne permet pas d’identifier plus précisément l’appareil médical; la traduction préserve donc cette indétermination.
theological_decisions:
- issue: Rapport entre la pendaison de Judas et le récit des Actes
  choice: Maintenir l’affirmation d’Apollinaire selon laquelle Judas survécut d’abord à la pendaison, puis citer le récit de sa chute.
  alternative: Harmoniser ou expliquer les récits de Matthieu et des Actes dans le corps du texte.
  rationale: Le fragment propose lui-même une articulation particulière des traditions; la traduction doit la transmettre sans l’approuver, la corriger ni la remplacer par une harmonisation confessionnelle.
- issue: Identification de Papias comme « disciple de Jean »
  choice: Conserver « disciple de Jean » sans préciser de quel Jean il s’agit.
  alternative: Identifier Jean comme l’apôtre ou comme l’Ancien.
  rationale: Le témoin fourni ne résout pas cette question historique; la précision créerait une certitude absente de la source.
translation_notes:
  register: Français international moderne, lisible et digne, avec un léger registre historique adapté à un fragment patristique. Les citations imbriquées sont clairement distinguées. Les lacunes, l’incertitude du texte et l’ellipse finale sont conservées plutôt que reconstruites silencieusement.
