review_pass:
  verdict: revise
  source_fidelity: 'Le projet transmet fidèlement l’enchaînement du témoin fourni : survie provisoire après la pendaison, renvoi aux Actes, puis attribution du récit détaillé à Papias. Il conserve à juste titre les deux endroits endommagés et l’ellipse finale. La mention « quatrième livre » allait toutefois au-delà de la parenthèse hésitante « fourth (book) » du témoin, et la phrase française autour du premier passage incertain était syntaxiquement défectueuse.'
  naturalness: La révision emploie un français moderne et soutenu. « allait de par le monde » devient « parcourait le monde », plus naturel sans perte de sens. Les passages incertains sont intégrés par des incises afin que la phrase demeure lisible sans masquer l’état défectueux du témoin.
  terminology: « Apollinaire », « les Actes des Apôtres », « impiété », « entrailles » et « instrument » conviennent. « Exposition des paroles du Seigneur » reflète plus précisément le titre transmis que « Exposé ». « Disciple de Jean » reste volontairement non précisé.
  issues:
  - severity: medium
    issue: 'Le premier segment lacunaire rendait la phrase française agrammaticale : « là où un chariot [texte incertain] passer aisément ».'
    rationale: Même en conservant l’incertitude, une traduction publiée doit former une phrase française intelligible. Une incise signale l’incertitude sans reconstruire silencieusement le texte.
  - severity: low
    issue: '« dans le quatrième livre » supprimait la réserve parenthétique du témoin anglais : « fourth (book) ».'
    rationale: Le parenthésage doit être conservé, car il signale que « livre » est une restitution ou une précision éditoriale.
  - severity: low
    issue: « Exposé des paroles du Seigneur » était moins exact et moins idiomatique comme rendu d’un titre que « Exposition des paroles du Seigneur ».
    rationale: « Exposition » correspond directement à la désignation traditionnelle de l’ouvrage tout en restant naturel en français.
  revised_text: 'Apollinaire : « Judas ne mourut pas par pendaison, mais resta en vie, ayant été détaché avant d’étouffer. Les Actes des Apôtres le montrent aussi : tombant la tête la première, il se fendit par le milieu, et toutes ses entrailles se répandirent. Papias, disciple de Jean, rapporte ce fait plus clairement dans le quatrième (livre) de l’Exposition des paroles du Seigneur, en ces termes :


    « Judas parcourait le monde, terrible exemple d’impiété. Sa chair avait tellement enflé que, là où un chariot — texte incertain — passait aisément, lui ne pouvait pas passer, pas même sa tête à elle seule. On raconte que ses paupières avaient enflé à un tel degré — passage lacunaire — qu’il ne pouvait absolument pas voir la lumière. Quant à ses yeux, même un médecin examinant à l’aide d’un instrument ne pouvait les apercevoir, tant ils s’étaient enfoncés sous la surface… »


    Texte compilé d’après Cramer, Catena ad Acta SS. Apost. (1838), p. 12 et suiv., et d’autres sources.[a]'
