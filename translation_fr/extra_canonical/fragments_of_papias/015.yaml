base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: fr
  text: 'Apollinaire : « Judas ne mourut pas par pendaison, mais resta en vie, car on l’avait détaché avant qu’il n’étouffe. Les Actes des Apôtres le montrent aussi : tombant la tête la première, il se fendit par le milieu, et toutes ses entrailles se répandirent. Papias, disciple de Jean, rapporte ce fait plus clairement dans le quatrième livre de l’Exposé des paroles du Seigneur, en ces termes :


    “Judas allait de par le monde, terrible exemple d’impiété. Sa chair avait tellement enflé que, là où un chariot [texte incertain] passer aisément, lui ne pouvait pas passer, pas même sa tête à elle seule. On raconte que ses paupières avaient enflé à un tel [passage manquant] qu’il ne pouvait absolument pas voir la lumière. Quant à ses yeux, même un médecin examinant à l’aide d’un instrument ne pouvait les apercevoir, tant ils s’étaient enfoncés sous la surface…” »


    Texte compilé d’après Cramer, Catena ad Acta SS. Apost. (1838), p. 12 et suiv., et d’autres sources.[a]'
