    reason: Le texte source fourni signale explicitement qu’une révision à partir de la langue ancienne demeure en attente; la note rend cette limite éditoriale transparente et explique l’ellipse.
  revision_rationale: 'Révision limitée à deux améliorations sûres de terminologie et d’usage français : « exégètes » pour la fonction d’expositors, et « Anastase le Sinaïte » pour la forme française de l’auteur cité. La syntaxe, l’ellipse, l’incertitude textuelle et l’ambiguïté théologique du lien entre le Paradis et l’Église sont préservées.'
