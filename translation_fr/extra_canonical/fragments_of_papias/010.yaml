review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le témoin anglais fourni : l’attribution de l’interprétation spirituelle, la référence au Paradis et le rattachement à l’Église du Christ sont conservés. La révision directe du grec/latin n’étant pas encore disponible, aucune précision ne peut être ajoutée quant à la portée exacte de « referred them to ». L’ellipse doit rester conservée.'
  naturalness: Le français est clair, de registre savant accessible, et la longue incise est correctement structurée. « Exégètes » est toutefois plus précis et plus naturel dans ce contexte patristique que « interprètes ». « Anastase le Sinaïte » est la forme française usuelle du nom de l’auteur cité.
  terminology: « Exégètes », « dans un sens spirituel », « Paradis » et « Église du Christ » conviennent. « Les rapportaient à » maintient heureusement l’ambiguïté du rapport interprétatif, sans imposer « appliquaient » ni une identification doctrinale. « Jean l’Évangéliste » reproduit prudemment l’identification du témoin.
  issues:
  - severity: low
    issue: « interprètes » pour “expositors”
    rationale: Dans une attribution à des auteurs ecclésiastiques anciens, « exégètes » désigne plus exactement des interprètes de l’Écriture et correspond au registre patristique français.
  - severity: low
    issue: Forme française du nom de l’auteur de la citation
    rationale: « Anastase le Sinaïte » est la désignation française savante habituelle pour Anastasius of Sinai; elle améliore la naturalité sans modifier l’attribution.
  revised_text: 'Ainsi donc, les plus anciens exégètes des Églises — je veux parler de Philon, le philosophe et contemporain des apôtres, du célèbre Papias de Hiérapolis, disciple de Jean l’Évangéliste… ainsi que de leurs compagnons — interprétaient dans un sens spirituel les paroles concernant le Paradis et les rapportaient à l’Église du Christ.


    — ANASTASE LE SINAÏTE, Contempl. Anagog. in Hexaém. VII.[a]'
  revised_footnotes:
