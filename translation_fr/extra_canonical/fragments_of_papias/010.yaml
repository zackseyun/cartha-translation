base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: fr
  text: 'Ainsi donc, les plus anciens interprètes des Églises — je veux parler de Philon, le philosophe et contemporain des apôtres, du célèbre Papias de Hiérapolis, disciple de Jean l’Évangéliste… ainsi que de leurs compagnons — interprétaient dans un sens spirituel les paroles concernant le Paradis et les rapportaient à l’Église du Christ.


    — ANASTASE DU SINAÏ, Contempl. Anagog. in Hexaém. VII.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après un témoin anglais ancien du domaine public; une vérification directe du texte grec ou latin reste nécessaire. Les points de suspension figurent dans le témoin consulté.
    reason: Le texte source fourni signale explicitement qu’une révision à partir de la langue ancienne demeure en attente; la note rend cette limite éditoriale transparente et explique l’ellipse.
lexical_decisions:
- source_word: more ancient expositors of the churches
  choice: les plus anciens interprètes des Églises
  rationale: « Interprètes » exprime naturellement la fonction d’explication des textes; la traduction conserve le comparatif/superlatif apparent du témoin anglais sans préciser une comparaison absente du fragment.
- source_word: sayings about Paradise
  choice: les paroles concernant le Paradis
  rationale: « Paroles » reste assez large pour préserver la nature non précisée des énoncés évoqués, tandis que « concernant » évite d’en fixer le genre.
- source_word: spiritually
  choice: dans un sens spirituel
  rationale: Cette formulation française claire conserve la méthode d’interprétation affirmée sans la définir davantage.
- source_word: referred them to the Church of Christ
  choice: les rapportaient à l’Église du Christ
  rationale: « Rapporter à » préserve la relation interprétative sans trancher entre application, référence ou identification.
theological_decisions:
- issue: Lien entre les paroles sur le Paradis et l’Église
  choice: « les rapportaient à l’Église du Christ »
  alternative: « les appliquaient à l’Église du Christ »
  rationale: Le choix retenu maintient l’ambiguïté du témoin quant à la nature exacte du lien exégétique et n’impose pas une équivalence théologique complète.
- issue: Identification de Jean
  choice: « Jean l’Évangéliste »
  alternative: « Jean l’évangéliste » ou « Jean »
  rationale: Le titre est conservé tel qu’il apparaît dans le témoin, sans résoudre les questions historiques relatives à l’identité du Jean auquel Papias aurait été rattaché.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase longue et l’incise nominative sont conservées pour refléter la structure testimoniale, tout en utilisant des tirets pour en faciliter la lecture. Le titre bibliographique latin est maintenu sous sa forme transmise.
