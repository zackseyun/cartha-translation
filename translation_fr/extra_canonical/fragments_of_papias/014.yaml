base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: fr
  text: 'De même, Étienne ne suit ni Papias, évêque et martyr de Hiérapolis, ni Irénée, le saint évêque de Lyon, lorsqu’ils disent que le royaume des cieux consistera à jouir de certains aliments matériels.[a]


    PHOTIUS, Bibliothèque 232, au sujet d’Étienne Gobar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après un ancien témoin anglais du domaine public; une vérification directe du texte grec de Photius reste nécessaire.
    reason: Le dossier indique que l’examen de la langue source est encore en attente; la note signale honnêtement le degré de certitude du texte.
lexical_decisions:
- source_word: kingdom of heaven
  choice: royaume des cieux
  rationale: Expression française naturelle qui conserve la formulation traditionnelle du témoignage anglais sans l’assimiler à une autre expression théologique.
- source_word: material foods
  choice: aliments matériels
  rationale: Rendu volontairement littéral afin de préserver l’opposition implicite entre nourriture matérielle et réalité spirituelle, sans préciser davantage une source ancienne encore à vérifier.
- source_word: enjoyment
  choice: jouir de
  rationale: Exprime la consommation accompagnée de plaisir suggérée par le témoin anglais, plutôt que le simple fait de manger.
- source_word: Stephanus Gobarus
  choice: Étienne Gobar
  rationale: Francisation usuelle du prénom, avec conservation reconnaissable du surnom; l’identification reste celle fournie par la notice de Photius.
- source_word: Bibliotheca
  choice: Bibliothèque
  rationale: Traduit le titre de l’œuvre de Photius en français moderne et corrige la coquille « Aibliotheca » du témoin.
theological_decisions:
- issue: Nature du royaume des cieux
  choice: « consistera à jouir de certains aliments matériels »
  alternative: « comportera la jouissance de certaines nourritures matérielles »
  rationale: Le choix conserve l’affirmation attribuée à Papias et Irénée sans l’approuver, la réfuter ni l’harmoniser avec une conception confessionnelle du royaume.
- issue: Portée de « lorsqu’ils disent »
  choice: Rattachement conjoint à Papias et à Irénée
  alternative: Répétition explicite de l’attribution pour chacun
  rationale: La syntaxe du témoin présente une affirmation commune attribuée aux deux auteurs; le français garde cette portée sans déterminer s’ils employaient exactement les mêmes termes.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure initiale a été rendue directement, sans les parenthèses explicatives du témoin anglais. Les formes fautives « Irenzeus » et « Aibliotheca » ont été normalisées en « Irénée » et « Bibliothèque ».
