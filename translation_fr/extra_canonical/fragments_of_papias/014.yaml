review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est conservé, y compris l’attribution conjointe à Papias et à Irénée. Toutefois, « De même » ne rend pas correctement la négation additive de « Nor again (does Stephanus follow) » : il faut exprimer qu’Étienne ne les suit « pas davantage » ou « non plus ». La formulation parenthétique du témoin peut être rendue en français sans perdre cette portée.'
  naturalness: Le français est globalement clair et sobre. « Étienne ne suit pas davantage… » est plus idiomatique et plus précis en contexte polémique que « De même, Étienne ne suit ni… ». « La jouissance de certains aliments matériels » est un peu plus naturel que l’infinitif « à jouir de », tout en restant proche du témoin.
  terminology: « royaume des cieux », « Hiérapolis », « Irénée », « Lyon » et « aliments matériels » sont recevables. « Saint évêque » restitue littéralement l’épithète honorifique du témoin sans en faire une affirmation éditoriale. La référence peut être francisée en « Bibliothèque, 232, au sujet d’Étienne Gobar ».
  issues:
  - severity: medium
    issue: La négation additive initiale est atténuée.
    rationale: « De même » signifie une comparaison affirmative et ne restitue pas « Nor again », qui indique qu’Étienne ne suit pas non plus les deux autorités citées.
  - severity: low
    issue: La construction « consistera à jouir » est moins naturelle.
    rationale: Le témoin dit que le royaume « consistera en la jouissance »; employer le substantif « jouissance » améliore la syntaxe française sans modifier le sens.
  revised_text: 'Étienne ne suit pas davantage Papias, évêque et martyr de Hiérapolis, ni Irénée, le saint évêque de Lyon, lorsqu’ils disent que le royaume des cieux consistera en la jouissance de certains aliments matériels.[a]


    PHOTIUS, Bibliothèque, 232, au sujet d’Étienne Gobar.'
  revised_footnotes:
  - marker: a
    text: Traduction provisoire établie d’après un ancien témoin anglais du domaine public ; une vérification directe du texte grec de Photius reste nécessaire.
    reason: Le dossier indique que l’examen direct de la langue source est encore en attente ; la note signale le caractère provisoire de la traduction.
  revision_rationale: La révision rétablit la valeur négative et additive de l’incipit (« ne suit pas davantage »), qui est nécessaire au sens de la notice de Photius. Elle lisse également la syntaxe de « consistera en la jouissance » sans interpréter davantage la nature des « aliments matériels ». La note de prudence textuelle est conservée, car l’évaluation directe du grec reste explicitement en attente.
