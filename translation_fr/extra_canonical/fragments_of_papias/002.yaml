  verdict: revise
  source_fidelity: 'Révision nécessaire pour quelques nuances importantes du grec d’Eusèbe (Histoire ecclésiastique 3.39) : la « voix vivante et qui demeure », la caractérisation des auteurs ecclésiastiques, et une formulation plus exacte de l’absence de prétention explicite de Papias à avoir été auditeur et témoin oculaire des apôtres. La correction de « dix mille ans » en « mille ans » est justifiée par le texte grec conservé.'
  naturalness: Le français est globalement clair, moderne et d’un registre convenant à une source ancienne. Quelques ajustements améliorent la précision sans alourdir le texte, notamment « qui demeure » au lieu de « durable » et « auteurs ecclésiastiques » au lieu de « responsables de l’Église ».
  terminology: Les choix « paroles » pour logia, « l’Ancien » pour le second Jean, « interprète » pour hermēneutēs et « langue hébraïque » avec notes d’ambiguïté sont appropriés. Les notes conservent correctement les incertitudes linguistiques et historiques.
  issues:
  - severity: medium
    issue: « voix vivante et durable »
    rationale: μένoυσα signifie plus précisément « qui demeure » ou « permanente ». « Durable » est possible, mais affaiblit la reprise presque littérale de l’opposition antique entre les livres et une voix vivante qui demeure.
  - severity: low
    issue: « ne déclare nullement avoir entendu ou vu »
    rationale: Eusèbe dit que Papias ne prétend certainement pas lui-même avoir été auditeur et témoin oculaire. « Ne déclare nullement » peut paraître plus catégorique que le constat portant sur l’absence de cette prétention explicite.
  - severity: medium
    issue: « responsables de l’Église »
    rationale: Le jugement d’Eusèbe vise des hommes/auteurs ecclésiastiques influents, non nécessairement des responsables au sens institutionnel moderne. « Auteurs ecclésiastiques » évite cet anachronisme.
  - severity: low
    issue: « fidèlement retenu »
    rationale: Le texte insiste deux fois sur le soin apporté à l’apprentissage et au souvenir ; « soigneusement retenu » reproduit mieux ce parallélisme sans ajouter l’idée de fidélité comme qualité distincte.
