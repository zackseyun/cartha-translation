  text: 'Five books by Papias are extant, bearing the title Expositions of the Oracles of the Lord. Irenaeus also mentions these as the only [works] written by him, in the following words: “These things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesses in writing in the fourth of his books. For there are five books composed by him.” So far Irenaeus.


    Yet Papias himself, in the preface to his discourses, certainly does not [claim] that he was a hearer and eyewitness of the holy Apostles. Rather, he shows by the language he uses that he received the matters of the faith from those who were their friends:


    “But I will not scruple also to give a place for you along with my interpretations to everything that I carefully learned and carefully remembered in time past from the elders, guaranteeing its truth. For, unlike the many, I did not take pleasure in those who have very much to say, but in those who teach the truth; nor in those who relate foreign commandments, but in those (who record) such as were given from the Lord to the Faith and are derived from the Truth itself. And again, whenever a person came (in my way) who had been a follower of the Elders, I would inquire about the discourses of the elders—what was said by Andrew, or by Peter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion and the Elder John, the disciples of the Lord, say. For I did not think that I could get so much profit from the contents of books as from the utterances of a living and abiding voice.”


    Here it is worth while to observe that he twice enumerates the name of John. The first he mentions in connection with Peter, James, Matthew, and the rest of the Apostles, evidently meaning the Evangelist; but the other John he mentions after an interval and classes with others outside the number of the Apostles, placing Aristion before him, and he distinctly calls him an Elder. Thus he makes it quite evident that their statement is true who say that there were two persons of that name in Asia, and that there are two tombs in Ephesus, each of which even now is called the tomb of John. It is important to notice this, for it is probable that it was the second, if one will not admit that it was the first, who saw the Revelation which is ascribed by name to John. Papias, of whom we are now speaking, confesses that he had received the words of the Apostles from those who had followed them, but says that he was himself a hearer of Aristion and the Elder John. At all events, he mentions them
    frequently by name and besides records their traditions in his writings. So much for these points, which I trust have not been uselessly adduced.


    It is worth while, however, to add to the words of Papias given above other passages from him, in which he records some other wonderful events likewise, as having come down to him by tradition. That Philip the Apostle resided in Hierapolis with his daughters has already been stated; but it must be noted here how Papias, their contemporary, relates that he had heard a marvellous tale from the daughters of Philip. For he relates that in his ti[me] a man rose from the dead, and again he gives another wonderful story about Justus, who was surnamed Barsabas: how he drank a deadly poison and yet, by the grace of the Lord, suffered no inconvenience. Of this Justus the Book of Acts records that, after the ascension of the Saviour, the holy Apostles put him forward with Matthias and prayed for the right choice, in place of the traitor Judas, to make their number complete. The passage is somewhat as follows: “And they put forward two, Joseph, called Barsabas, who was surnamed Justus, and Matthias;
    and they prayed, and said.”


    The same writer has recorded other notices as having come down to him from oral tradition: certain strange parables of the Saviour and teachings of his, and some other statements of a rather mythical character. Among these he says that there will be a period of some ten thousand years after the resurrection, and that the kingdom of Christ will be set up in material form on this earth. These ideas, I suppose, he got through a misunderstanding of the apostolic accounts, not perceiving that the things recorded there in figures were spoken by them mystically.


    For he evidently was a man of very limited capacity, as one may say, judging from his own statements. Yet it was owing to him that so many church fathers after him adopted a like opinion, urging in their own support the antiquity of the man, as, for instance, Irenaeus and whoever else they were who declared that they held like views. Papias also gives in his own work other accounts of the words of the Lord on the authority of Aristion, mentioned above, and traditions of the Elder John. To these we refer the curious; for our present purpose we will merely add to his words, which have been quoted above, a tradition which has been set forth through these sources concerning Mark, who wrote the Gospel:


    “And the Elder said this also: Mark, having become the interpreter of Peter, wrote down accurately everything that he remembered, without, however, recording in order what was either said or done by Christ. For neither did he hear the Lord nor did he follow him; but afterwards, as I said, (attended) Peter, who adapted his instructions to the needs of his hearers but had no design of giving a connected account of the Lord’s oracles. So then Mark made no mistake, while [he] thus wrote down some things as he remembered them; for [he] made it his one care not to omit anything that he heard, or [to] set down any false statement therein.”


    Such, then, is the account given by Papias concerning Mark. But concerning Matthew, the following statement is made [by him]:


    “So then Matthew composed the oracles in the Hebrew language, and each one interpreted them as he could.”


    The same writer employed testimonies from the First Epistle of John, and likewise from that of Peter. And he has related another story about a woman accused of many sins before the Lord, which the Gospel according'
translation:
  language: fr
  text: 'Cinq livres de Papias nous sont parvenus sous le titre Explications des paroles du Seigneur[a]. Irénée les mentionne lui aussi comme les seuls ouvrages écrits par Papias, en ces termes : « Voilà ce dont Papias, auditeur de Jean, compagnon de Polycarpe et homme des temps anciens, témoigne par écrit dans le quatrième de ses livres. Car il a composé cinq livres. » Ainsi parle Irénée.


    Pourtant, dans la préface de ses Explications, Papias lui-même ne prétend certainement pas avoir été auditeur et témoin oculaire des saints apôtres. Ses propres paroles montrent plutôt qu’il a reçu les enseignements de la foi de personnes qui les avaient fréquentés :


    « Je n’hésiterai pas à joindre à mes explications, à ton intention, tout ce que j’ai autrefois appris avec soin auprès des anciens et soigneusement retenu, car je puis en garantir la vérité. En effet, contrairement à la plupart des gens, je ne prenais pas plaisir à écouter ceux qui parlent beaucoup, mais ceux qui enseignent la vérité ; ni ceux qui rapportent des commandements étrangers, mais ceux qui transmettent les commandements donnés par le Seigneur à la foi et provenant de la Vérité elle-même. Et si quelqu’un qui avait fréquenté les anciens venait à passer, je m’informais des paroles des anciens : ce qu’avaient dit André, Pierre, Philippe, Thomas, Jacques, Jean, Matthieu ou quelque autre disciple du Seigneur, et ce que disent Aristion et Jean l’Ancien, disciples du Seigneur. Car je ne pensais pas que le contenu des livres me serait aussi profitable que les paroles d’une voix vivante et qui demeure. »


    Il vaut la peine d’observer ici que Papias cite deux fois le nom de Jean. Il mentionne le premier avec Pierre, Jacques, Matthieu et les autres apôtres, désignant manifestement l’évangéliste. Mais il mentionne l’autre Jean un peu plus loin et le range parmi des personnes qui ne font pas partie du groupe des apôtres ; il place Aristion avant lui et l’appelle expressément « l’Ancien ». Il montre ainsi très clairement qu’ont raison ceux qui affirment qu’il y eut en Asie deux hommes portant ce nom et qu’il existe à Éphèse deux tombeaux dont chacun, aujourd’hui encore, est appelé « tombeau de Jean ». Il importe de le remarquer, car il est probable que ce fut le second — si l’on refuse d’admettre que ce fut le premier — qui vit l’Apocalypse attribuée nommément à Jean. Quant à Papias, dont nous parlons maintenant, il reconnaît avoir reçu les paroles des apôtres de ceux qui les avaient suivis, mais il dit avoir lui-même entendu Aristion et Jean l’Ancien. En tout cas, il les mentionne souvent
    par leur nom et rapporte leurs traditions dans ses écrits. J’espère que ces observations n’auront pas été présentées inutilement.


    Il vaut cependant la peine d’ajouter aux paroles de Papias citées plus haut d’autres passages dans lesquels il rapporte également certains événements extraordinaires qui lui seraient parvenus par tradition. Il a déjà été dit que l’apôtre Philippe habitait à Hiérapolis avec ses filles. Mais il faut signaler ici que Papias, qui vivait à leur époque, déclare avoir entendu des filles de Philippe un récit merveilleux. Il rapporte qu’en son temps un homme revint d’entre les morts. Il raconte aussi un autre événement extraordinaire concernant Justus, surnommé Barsabbas : celui-ci but un poison mortel sans en éprouver aucun mal, par la grâce du Seigneur. Le livre des Actes rapporte qu’après l’ascension du Sauveur, les saints apôtres présentèrent ce Justus avec Matthias et prièrent afin que soit choisi celui qui compléterait leur nombre à la place du traître Judas. Le passage dit à peu près ceci : « Ils en présentèrent deux : Joseph appelé Barsabbas, surnommé Justus, et Matthias. Puis ils prièrent
    en disant… »


    Le même auteur a consigné d’autres éléments qui lui seraient parvenus par tradition orale : certaines paraboles étranges du Sauveur, certains de ses enseignements et quelques autres récits d’un caractère assez légendaire. Il affirme notamment qu’après la résurrection il y aura une période de mille ans[b], durant laquelle le royaume du Christ sera établi sous une forme matérielle sur cette terre. Je suppose qu’il en est venu à ces idées parce qu’il avait mal compris les récits des apôtres et n’avait pas saisi que ceux-ci avaient exprimé de manière symbolique et mystérieuse les réalités qu’ils rapportaient.


    À en juger par ses propres propos, il semble en effet avoir été d’une intelligence très limitée. Pourtant, c’est à cause de lui que tant d’auteurs ecclésiastiques après lui ont adopté la même opinion, s’appuyant pour cela sur l’ancienneté de cet homme ; ce fut notamment le cas d’Irénée et de tous les autres qui ont déclaré partager les mêmes idées. Dans son ouvrage, Papias rapporte encore d’autres paroles du Seigneur d’après Aristion, déjà mentionné, ainsi que des traditions de Jean l’Ancien. Nous y renvoyons ceux qui désirent les connaître. Pour notre propos actuel, nous ajouterons seulement aux paroles déjà citées une tradition transmise par ces sources au sujet de Marc, l’auteur de l’Évangile :


    « L’Ancien disait aussi ceci : Marc, devenu l’interprète[c] de Pierre, mit par écrit avec exactitude tout ce dont il se souvenait, mais sans rapporter dans l’ordre ce que le Christ avait dit ou fait. En effet, il n’avait ni entendu ni suivi le Seigneur. Plus tard, comme je l’ai dit, il accompagna Pierre. Celui-ci adaptait son enseignement aux besoins de ses auditeurs, sans chercher à présenter un récit ordonné des paroles du Seigneur. Marc n’a donc commis aucune faute en mettant ainsi par écrit certains éléments tels qu’il se les rappelait. Il n’avait qu’un seul souci : ne rien omettre de ce qu’il avait entendu et ne rien y rapporter de faux. »


    Tel est le témoignage de Papias au sujet de Marc. Quant à Matthieu, il déclare ceci :


    « Matthieu rassembla donc les paroles[d] en langue hébraïque[e], et chacun les interpréta comme il le pouvait. »


    Le même auteur a utilisé des témoignages tirés de la première lettre de Jean ainsi que de celle de Pierre. Il a également rapporté l’histoire d’une femme accusée de nombreux péchés devant le Seigneur, histoire que contient l’Évangile selon les Hébreux[f].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec logia peut désigner des « paroles », des « déclarations inspirées » ou des « oracles ». Le titre traditionnel est aussi rendu par Explications des oracles du Seigneur.
    reason: Préserver l’ambiguïté lexicale du titre grec.
  - marker: b
    text: Le texte grec d’Eusèbe porte « mille ans ». La leçon « dix mille ans » du témoin anglais fourni résulte vraisemblablement d’une corruption de transmission ou de lecture.
    reason: Corriger la forme manifestement fautive du témoin anglais à partir du texte grec conservé.
  - marker: c
    text: Le grec hermēneutēs peut désigner un interprète, un traducteur ou un porte-parole. Le contexte ne permet pas de trancher entièrement entre ces nuances.
    reason: Éviter de définir sans preuve la fonction exacte de Marc auprès de Pierre.
  - marker: d
    text: Ici encore, le grec emploie logia, terme qui peut désigner des paroles ou des oracles et dont l’étendue précise demeure incertaine.
    reason: Signaler que le terme appliqué à Matthieu est sémantiquement plus large que la seule notion de citations.
  - marker: e
    text: Littéralement, « dans le dialecte hébraïque ». Dans l’usage ancien, cette expression peut désigner l’hébreu ou une forme d’araméen ; la formulation ne permet pas de déterminer sûrement laquelle de ces langues est visée.
    reason: Conserver l’incertitude historique et linguistique.
  - marker: f
    text: 'Le témoin anglais fourni s’interrompt après « l’Évangile selon ». La fin de la phrase est conservée dans le texte grec d’Eusèbe : « l’Évangile selon les Hébreux ».'
    reason: Rendre transparente la restauration de la fin tronquée à partir du témoin grec.
lexical_decisions:
- source_word: λόγια (logia)
  choice: paroles ; dans la note, « oracles » comme autre possibilité
  rationale: Le terme peut viser des paroles du Seigneur, des déclarations inspirées ou des oracles. « Paroles » est naturel en français moderne, tandis que la note conserve l’étendue sémantique du grec.
- source_word: πρεσβύτερος (presbyteros)
  choice: l’Ancien / les anciens
  rationale: Cette traduction préserve à la fois le sens d’ancien respecté et la fonction de désignation particulière appliquée au second Jean, sans importer un titre ecclésiastique ultérieur.
- source_word: ἑρμηνευτής (hermēneutēs)
  choice: interprète
  rationale: Le mot peut signifier traducteur, interprète ou porte-parole. Le terme français « interprète », accompagné d’une note, laisse cette ambiguïté ouverte.
- source_word: Ἑβραΐδι διαλέκτῳ (Hebraïdi dialektō)
  choice: en langue hébraïque
  rationale: Formulation française lisible qui reste proche du texte ; une note précise que l’usage ancien peut viser l’hébreu ou l’araméen.
- source_word: μυθικώτερα (mythikōtera)
  choice: d’un caractère assez légendaire
  rationale: « Légendaire » rend le jugement critique d’Eusèbe sans suggérer automatiquement une fiction délibérément inventée, ce que « mythique » pourrait laisser entendre aujourd’hui.
theological_decisions:
- issue: Nature du royaume millénaire attribué à Papias
  choice: « établi sous une forme matérielle sur cette terre »
  alternative: « réalisé corporellement sur cette terre »
  rationale: La formulation conserve l’opposition établie par Eusèbe entre une compréhension matérielle et une compréhension figurée, sans approuver ni corriger théologiquement Papias.
- issue: Identité du Jean associé à Papias et à l’Apocalypse
  choice: Maintenir intégralement l’argument d’Eusèbe distinguant deux Jean
  alternative: Identifier le second Jean à l’apôtre Jean
