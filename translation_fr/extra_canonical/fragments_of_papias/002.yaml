revisions:
- from: 'Cinq livres de Papias nous sont parvenus sous le titre Explications des paroles du Seigneur[a]. Irénée les mentionne lui aussi comme les seuls ouvrages écrits par Papias, en ces termes : « Voilà ce dont Papias, auditeur de Jean, compagnon de Polycarpe et homme des temps anciens, témoigne par écrit dans le quatrième de ses livres. Car il a composé cinq livres. » Ainsi parle Irénée.


    Pourtant, dans la préface de ses Explications, Papias lui-même ne déclare nullement avoir entendu ou vu de ses yeux les saints apôtres. Ses propres paroles montrent plutôt qu’il a reçu les enseignements de la foi de personnes qui les avaient fréquentés :


    « Je n’hésiterai pas à joindre à mes explications, à ton intention, tout ce que j’ai autrefois appris avec soin auprès des anciens et fidèlement retenu, car je puis en garantir la vérité. En effet, contrairement à la plupart des gens, je ne prenais pas plaisir à écouter ceux qui parlent beaucoup, mais ceux qui enseignent la vérité ; ni ceux qui rapportent des commandements étrangers, mais ceux qui transmettent les commandements donnés par le Seigneur à la foi et provenant de la Vérité elle-même. Et si quelqu’un qui avait fréquenté les anciens venait à passer, je m’informais des paroles des anciens : ce qu’avaient dit André, Pierre, Philippe, Thomas, Jacques, Jean, Matthieu ou quelque autre disciple du Seigneur, et ce que disent Aristion et Jean l’Ancien, disciples du Seigneur. Car je ne pensais pas que le contenu des livres me serait aussi profitable que les paroles d’une voix vivante et durable. »


    Il vaut la peine d’observer ici que Papias cite deux fois le nom de Jean. Il mentionne le premier avec Pierre, Jacques, Matthieu et les autres apôtres, désignant manifestement l’évangéliste. Mais il mentionne l’autre Jean un peu plus loin et le range parmi des personnes qui ne font pas partie du groupe des apôtres ; il place Aristion avant lui et l’appelle expressément « l’Ancien ». Il montre ainsi très clairement qu’ont raison ceux qui affirment qu’il y eut en Asie deux hommes portant ce nom et qu’il existe à Éphèse deux tombeaux dont chacun, aujourd’hui encore, est appelé « tombeau de Jean ». Il importe de le remarquer, car il est probable que ce fut le second — si l’on refuse d’admettre que ce fut le premier — qui vit l’Apocalypse attribuée nommément à Jean. Quant à Papias, dont nous parlons maintenant, il reconnaît avoir reçu les paroles des apôtres de ceux qui les avaient suivis, mais il dit avoir lui-même entendu Aristion et Jean l’Ancien. En tout cas, il les mentionne souvent
    par leur nom et rapporte leurs traditions dans ses écrits. J’espère que ces observations n’auront pas été présentées inutilement.


    Il vaut cependant la peine d’ajouter aux paroles de Papias citées plus haut d’autres passages dans lesquels il rapporte également certains événements extraordinaires qui lui seraient parvenus par tradition. Il a déjà été dit que l’apôtre Philippe habitait à Hiérapolis avec ses filles. Mais il faut signaler ici que Papias, qui vivait à leur époque, déclare avoir entendu des filles de Philippe un récit merveilleux. Il rapporte qu’en son temps un homme revint d’entre les morts. Il raconte aussi un autre événement extraordinaire concernant Justus, surnommé Barsabbas : celui-ci but un poison mortel sans en éprouver aucun mal, par la grâce du Seigneur. Le livre des Actes rapporte qu’après l’ascension du Sauveur, les saints apôtres présentèrent ce Justus avec Matthias et prièrent afin que soit choisi celui qui compléterait leur nombre à la place du traître Judas. Le passage dit à peu près ceci : « Ils en présentèrent deux : Joseph appelé Barsabbas, surnommé Justus, et Matthias. Puis ils prièrent
    en disant… »


    Le même auteur a consigné d’autres éléments qui lui seraient parvenus par tradition orale : certaines paraboles étranges du Sauveur, certains de ses enseignements et quelques autres récits d’un caractère assez légendaire. Il affirme notamment qu’après la résurrection il y aura une période de mille ans[b], durant laquelle le royaume du Christ sera établi sous une forme matérielle sur cette terre. Je suppose qu’il en est venu à ces idées parce qu’il avait mal compris les récits des apôtres et n’avait pas saisi que ceux-ci avaient exprimé de manière symbolique et mystérieuse les réalités qu’ils rapportaient.


    À en juger par ses propres propos, il semble en effet avoir été d’une intelligence très limitée. Pourtant, c’est à cause de lui qu’un si grand nombre de responsables de l’Église après lui ont adopté la même opinion, s’appuyant pour cela sur l’ancienneté de cet homme ; ce fut notamment le cas d’Irénée et de tous ceux qui ont déclaré partager les mêmes idées. Dans son ouvrage, Papias rapporte encore d’autres paroles du Seigneur d’après Aristion, déjà mentionné, ainsi que des traditions de Jean l’Ancien. Nous y renvoyons ceux qui désirent les connaître. Pour notre propos actuel, nous ajouterons seulement aux paroles déjà citées une tradition transmise par ces sources au sujet de Marc, l’auteur de l’Évangile :


    « L’Ancien disait aussi ceci : Marc, devenu l’interprète[c] de Pierre, mit par écrit avec exactitude tout ce dont il se souvenait, mais sans rapporter dans l’ordre ce que le Christ avait dit ou fait. En effet, il n’avait ni entendu ni suivi le Seigneur. Plus tard, comme je l’ai dit, il accompagna Pierre. Celui-ci adaptait son enseignement aux besoins de ses auditeurs, sans chercher à présenter un récit ordonné des paroles du Seigneur. Marc n’a donc commis aucune faute en mettant ainsi par écrit certains éléments tels qu’il se les rappelait. Il n’avait qu’un seul souci : ne rien omettre de ce qu’il avait entendu et ne rien y rapporter de faux. »


    Tel est le témoignage de Papias au sujet de Marc. Quant à Matthieu, il déclare ceci :


    « Matthieu rassembla donc les paroles[d] en langue hébraïque[e], et chacun les interpréta comme il le pouvait. »


    Le même auteur a utilisé des témoignages tirés de la première lettre de Jean ainsi que de celle de Pierre. Il a également rapporté l’histoire d’une femme accusée de nombreux péchés devant le Seigneur, histoire que contient l’Évangile selon les Hébreux[f].


    [a] Le mot grec logia peut désigner des « paroles », des « déclarations inspirées » ou des « oracles ». Le titre traditionnel est aussi rendu par Explications des oracles du Seigneur.


    [b] Le texte grec d’Eusèbe porte « mille ans ». La leçon « dix mille ans » du témoin anglais fourni résulte vraisemblablement d’une corruption de transmission ou de lecture.


    [c] Le grec hermēneutēs peut désigner un interprète, un traducteur ou un porte-parole. Le contexte ne permet pas de trancher entièrement entre ces nuances.


    [d] Ici encore, le grec emploie logia, terme qui peut désigner des paroles ou des oracles et dont l’étendue précise demeure incertaine.


    [e] Littéralement, « dans le dialecte hébraïque ». Dans l’usage ancien, cette expression peut désigner l’hébreu ou une forme d’araméen ; la formulation ne permet pas de déterminer sûrement laquelle de ces langues est visée.


    [f] Le témoin anglais fourni s’interrompt après « l’Évangile selon ». La fin de la phrase est conservée dans le texte grec d’Eusèbe : « l’Évangile selon les Hébreux ».'
