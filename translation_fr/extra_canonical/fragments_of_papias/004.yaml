lexical_decisions:
- source_word: John the Divine
  choice: Jean le Théologien
  rationale: Titre traditionnel et intelligible en français pour distinguer ce Jean de « Jean l’Ancien », sans lui attribuer le qualificatif français moderne « divin ».
- source_word: Oracles of the Lord
  choice: Oracles du Seigneur
  rationale: Conserve le titre transmis et son caractère technique, sans réduire « oracles » à de simples paroles.
- source_word: catholic Epistles
  choice: épîtres catholiques
  rationale: Rend le terme historique au sens d’épîtres générales ou universelles, non comme une désignation confessionnelle moderne.
- source_word: the Elder
  choice: l’Ancien
  rationale: Rend le titre distinctif tout en préservant la distinction entre les deux personnages nommés Jean.
- source_word: Millennium
  choice: Millénium
  rationale: Conserve le terme doctrinal historique sans expliciter ni trancher la conception millénariste visée.
- source_word: raised from the dead
  choice: relevée d’entre les morts / relevés d’entre les morts
  rationale: Expression française naturelle qui maintient l’affirmation de retour à la vie sans ajouter de précision doctrinale.
- source_word: received by lot
  choice: reçut par tirage au sort
  rationale: Conserve l’idée d’une attribution par le sort plutôt que d’une simple affectation.
theological_decisions:
- issue: Jugement du témoin sur le millénarisme de Papias et d’Irénée
  choice: Conserver explicitement « se trompe » et « s’est également trompé »
  alternative: Atténuer en « avait une opinion particulière »
  rationale: Le jugement polémique appartient au fragment transmis ; l’adoucir effacerait la position théologique du témoin.
- issue: Martyre de Jean et tension avec la citation d’Eusèbe
  choice: Maintenir côte à côte l’affirmation du martyre et la citation disant qu’il mourut à Éphèse
  alternative: Harmoniser les deux notices ou identifier des Jean différents
  rationale: Le texte ne résout pas cette tension, et la traduction ne doit pas lui imposer une harmonisation.
- issue: Accomplissement de la parole de Christ
  choice: Traduire l’argument tel quel, y compris « il est impossible que Dieu mente »
  alternative: Présenter le raisonnement comme une simple possibilité
  rationale: Le narrateur formule un argument théologique affirmatif ; la traduction en préserve la force sans l’endosser ni le contester.
- issue: Identité de Jean l’auteur des épîtres et de l’Apocalypse
  choice: Préserver les attributions comme opinions rapportées et contestées
  alternative: Identifier directement l’auteur à Jean l’apôtre ou à Jean l’Ancien
  rationale: Le fragment présente une discussion ancienne et ambiguë sur l’auteur ; aucune solution confessionnelle ne doit être importée.
translation_notes:
  register: Français international moderne, digne et lisible. Les restitutions éditoriales nécessaires restent entre crochets. Les noms propres suivent les formes françaises courantes ou une translittération sobre. Cette version demeure provisoire, car le dossier fourni repose sur un témoin anglais ancien affecté par des corruptions d’OCR et indique que la vérification directe du grec ou du latin reste à faire.
