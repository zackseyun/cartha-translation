    Après Domitien, Nerva régna un an. Il rappela Jean de l’île, c’est-à-dire Patmos, et lui permit de demeurer à Éphèse. Jean était alors le seul survivant des douze apôtres et, après avoir écrit son Évangile, il reçut l’honneur du martyre. En effet, Papias, évêque de Hiérapolis, qui avait été témoin oculaire de Jean, dit dans le deuxième livre des *Oracles du Seigneur* que celui-ci fut tué par les Juifs. Il accomplit ainsi manifestement, avec son frère, la prophétie de Christ les concernant, ainsi que leur propre confession et l’engagement qu’ils avaient pris en sa faveur. Car, lorsque le Seigneur leur demanda : « Pouvez-vous boire la coupe que je bois ? », ils répondirent aussitôt par l’affirmative et donnèrent leur accord. Il leur dit alors : « Vous boirez ma coupe, et vous serez baptisés du baptême dont je suis baptisé. » Et cela est raisonnable, car il est impossible que Dieu mente.


