base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/004.yaml
  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: fr
  text: 'Papias, évêque de Hiérapolis, qui fut disciple de Jean le Théologien [et] compagnon de Polycarpe, écrivit cinq livres intitulés Oracles du Seigneur. Lorsqu’il dressa la liste des apôtres, après Pierre et Jean, Philippe, Thomas et Matthieu, il compta parmi les disciples du Seigneur Aristion [et] un second Jean, qu’il appelait aussi « l’Ancien ». [Il dit] que certains [pensent] que ce Jean est l’auteur des deux courtes épîtres catholiques publiées sous le nom de Jean ; ils en donnent pour raison que les anciens Pères n’acceptent que la première épître. Certains ont aussi considéré à tort que l’Apocalypse était son œuvre, c’est-à-dire celle de Jean l’Ancien. Papias, lui aussi, se trompe au sujet du Millénium, et Irénée s’est également trompé à sa suite.


    Dans son deuxième livre, Papias dit que Jean le Théologien et Jacques, son frère, furent tués par les Juifs. Ce même Papias rapporte, sur l’autorité des filles de Philippe, que Barsabbas, aussi appelé Justus, mis au défi par les incroyants, but du venin de serpent au nom du Seigneur et fut préservé de tout mal. Il fait encore d’autres récits merveilleux, notamment au sujet de la mère de Manaïm, qui fut relevée d’entre les morts. Quant à ceux que Christ avait relevés d’entre les morts, [il affirme] qu’ils vécurent jusqu’au temps d’Hadrien.


    PHILIPPE DE SIDÈ (?), Histoire chrétienne[a]


    VI


    Après Domitien, Nerva régna un an. Il rappela Jean de l’île, c’est-à-dire Patmos, et lui permit de demeurer à Éphèse. Jean était alors le seul survivant des douze apôtres et, après avoir écrit son Évangile, il reçut l’honneur du martyre. En effet, Papias, évêque de Hiérapolis, qui avait été témoin oculaire de Jean, dit dans le deuxième livre des Oracles du Seigneur que celui-ci fut tué par les Juifs. Il accomplit ainsi manifestement, avec son frère, la prophétie de Christ à leur sujet, de même que leur propre déclaration et l’engagement qu’ils avaient pris envers lui. Car, lorsque le Seigneur leur demanda : « Pouvez-vous boire la coupe que je bois ? », ils répondirent aussitôt par l’affirmative et donnèrent leur accord. Il leur dit alors : « Vous boirez ma coupe, et vous serez baptisés du baptême dont je suis baptisé. » Et cela à juste titre, car il est impossible que Dieu mente.


    De même, le savant Origène affirme, dans son commentaire de l’Évangile selon saint Matthieu, que Jean subit le martyre ; il déclare avoir appris ce fait des successeurs des apôtres. Et Eusèbe, lui aussi bien informé, dit dans son Histoire ecclésiastique : « Thomas reçut par tirage au sort la Parthie, tandis que Jean [reçut] l’Asie, où il établit aussi sa demeure et mourut à Éphèse[b]. »


    GEORGES HAMARTÔLOS, Chronique


    [a] Le titre abrégé et altéré dans le témoin imprimé est incertain ; l’attribution à Philippe de Sidè y porte elle-même un point d’interrogation.

    [b] Le témoin imprimé place un point d’interrogation après « Éphèse », probablement pour signaler une incertitude textuelle ou éditoriale.'
