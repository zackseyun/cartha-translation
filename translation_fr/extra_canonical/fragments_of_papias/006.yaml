  text: 'Irenzeus, a disciple of Papias who was a hearer of John the Eva[...], relates.


    —Jerome, To Theodora, Letter 75 (29), chapter 3.'
translation:
  language: fr
  text: 'Irénée, disciple de Papias, qui avait entendu Jean l’Éva[…][a], rapporte.


    — Jérôme, *À Théodora*, lettre 75 (29), chapitre 3.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais disponible s’interrompt après « John the Eva ». La formulation a donc été laissée inachevée, sans compléter conjecturalement « Éva[…] ». Une vérification directe du texte grec ou latin reste nécessaire.
    reason: Signaler honnêtement la lacune ou troncation du témoin et le caractère provisoire de cette traduction.
lexical_decisions:
- source_word: Irenzeus
  choice: Irénée
  rationale: Normalisation française du nom traditionnellement transcrit Irenaeus, conformément à l’identification indiquée par le témoin consulté.
- source_word: a disciple of Papias
  choice: disciple de Papias
  rationale: Traduction directe, sans préciser davantage la nature du rapport de disciple.
- source_word: who was a hearer of John
  choice: qui avait entendu Jean
  rationale: Conserve le rattachement grammatical de la relative à Papias dans le témoin anglais et évite de renforcer « hearer » en une relation formelle de disciple.
- source_word: relates
  choice: rapporte
  rationale: Rend sobrement l’idée de transmission d’un renseignement, même si le contenu attendu manque dans le fragment fourni.
theological_decisions:
- issue: Identification de « Jean »
  choice: Conserver simplement « Jean »
  alternative: Préciser « Jean l’Évangéliste » ou « Jean l’Ancien »
  rationale: Le témoin est tronqué après « John the Eva » et la révision directe du grec ou du latin reste à faire; compléter l’identification trancherait au-delà des données disponibles.
- issue: Antécédent de la proposition relative
  choice: Rattacher « qui avait entendu Jean » à Papias
  alternative: La rattacher à Irénée
  rationale: C’est la lecture grammaticale naturelle du témoin anglais fourni; aucune reconstruction théologique ou historique contraire n’est imposée.
translation_notes:
  register: Français international moderne, sobre et digne. Le caractère fragmentaire du témoin est rendu visiblement plutôt que masqué. La référence bibliographique est francisée, tandis que la numérotation double de la lettre est conservée.
