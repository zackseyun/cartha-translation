    issue: Présentation bibliographique peu naturelle
    rationale: « — Jérôme, *À Théodora*, lettre 75 (29), chapitre 3 » est compréhensible, mais « Lettre 75 (29) à Théodora » correspond mieux à l’usage français des références épistolaires, tout en conservant exactement l’adresse, la numérotation et le chapitre du témoin.
  - severity: medium
    issue: Vérification directe de la source grecque/latine non encore effectuée
    rationale: Le dossier indique explicitement que l’examen de la source ancienne est en attente et ne fournit qu’un témoin anglais tronqué. Il ne faut donc ni lever la troncation « Éva[…] » ni préciser l’identité de Jean sur cette seule base.
