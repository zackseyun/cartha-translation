  verdict: revise
  source_fidelity: 'Le texte français rend fidèlement le témoin anglais fourni : Irénée est présenté comme disciple de Papias, et « qui avait entendu Jean » se rapporte naturellement à Papias. La troncation après « John the Eva » est correctement conservée sans compléter l’identification. La consultation directe du grec/latin n’étant pas disponible dans le dossier, cette appréciation demeure limitée au témoin public-domain anglais et à sa référence latine.'
  naturalness: La formulation est sobre et intelligible. La référence finale peut toutefois être rendue plus idiomatiquement en français en intégrant « à Théodora » au titre de la lettre plutôt qu’en le séparant par une virgule.
  terminology: « Irénée », « Papias », « Jérôme » et « disciple » sont des formes françaises usuelles. « avait entendu » respecte utilement la sobriété de « was a hearer of » sans imposer le terme plus institutionnel « auditeur » ni une conclusion sur le statut précis de Jean.
  issues:
