base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: fr
  text: 'Prenant pour point de départ Papias le Grand, de Hiérapolis, disciple de l’apôtre qui s’était penché sur la poitrine du Christ, ainsi que Clément, Pantène, le prêtre des Alexandrins, et Ammonius, le grand érudit, ces anciens et premiers interprètes s’accordent entre eux pour comprendre toute l’œuvre des six jours comme se rapportant au Christ et à son Église.[a]


    ANASTASE DU SINAÏ, Contempl. Anagog. in Hexaém. I.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais public fourni; la vérification directe du texte grec ou latin reste à effectuer.
    reason: Le dossier indique expressément que l’examen de la langue source est en attente; le degré de certitude doit donc être signalé.
  - marker: b
    text: 'L’attribution et le titre abrégé de l’œuvre sont conservés tels qu’ils figurent dans le témoin: Anastase du Sinaï, Contempl. Anagog. in Hexaém. I.'
    reason: Évite de développer ou de normaliser conjecturalement une référence bibliographique abrégée.
lexical_decisions:
- source_word: Taking their start from
  choice: Prenant pour point de départ
  rationale: Conserve l’idée d’une interprétation qui s’appuie sur des prédécesseurs, tout en restant idiomatique en français.
- source_word: Papias the great, of Hierapolis
  choice: Papias le Grand, de Hiérapolis
  rationale: Reproduit le titre honorifique et l’indication géographique du témoin anglais sans les développer.
- source_word: leaned on Christ’s bosom
  choice: s’était penché sur la poitrine du Christ
  rationale: Rend concrètement l’image johannique sans identifier explicitement l’apôtre, puisque le fragment ne le nomme pas.
- source_word: Pantanus the priest of the Alexandrians
  choice: Pantène, le prêtre des Alexandrins
  rationale: Emploie la forme française usuelle du nom et maintient le titre ainsi que son rattachement aux Alexandrins.
- source_word: expositors
  choice: interprètes
  rationale: Terme français actuel qui couvre l’activité d’exposition et d’interprétation du texte.
- source_word: all the work of the six days
  choice: toute l’œuvre des six jours
  rationale: Préserve l’allusion à l’Hexaéméron et la portée globale de l’expression.
- source_word: as referring to
  choice: comme se rapportant à
  rationale: Maintient la relation interprétative sans imposer une formulation allégorique plus précise que le témoin.
theological_decisions:
- issue: Identification de « l’apôtre qui s’était penché sur la poitrine du Christ »
  choice: Laisser l’apôtre sans nom
  alternative: L’identifier à Jean
  rationale: Le témoin fourni ne donne pas son nom; l’expliciter résoudrait une allusion que le texte conserve implicitement.
- issue: Rapport de l’œuvre des six jours au Christ et à l’Église
  choice: « comme se rapportant au Christ et à son Église »
  alternative: « comme une allégorie du Christ et de l’Église »
  rationale: La formulation retenue préserve l’étendue et l’ambiguïté du rapport interprétatif sans préciser indûment sa nature.
translation_notes:
  register: Français international moderne, digne et lisible. La longue phrase du témoin est conservée, mais sa syntaxe est légèrement régularisée. Les noms propres sont francisés lorsqu’une forme française courante existe. Le caractère provisoire de la traduction est explicité en note en raison de l’absence de vérification directe du grec ou du latin.
