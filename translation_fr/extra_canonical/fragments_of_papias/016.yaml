base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: fr
  text: 'Ici commence le prologue de l’Évangile selon Jean.


    L’Évangile de Jean fut porté à la connaissance des Églises et leur fut remis par Jean, tandis qu’il demeurait encore dans son corps. C’est ce qu’a rapporté un certain Papias de Hiérapolis, disciple bien-aimé de Jean, dans ses cinq livres exotériques — lire : exégétiques[a]. Mais Papias mit correctement l’Évangile par écrit sous la dictée de Jean[b].


    Un manuscrit du Vatican datant du IXe siècle.


    XX


    En effet, Jean, le dernier d’entre eux, surnommé le Fils du Tonnerre, était déjà très âgé — comme Irénée, Eusèbe et une succession d’historiens dignes de foi nous l’ont transmis — lorsque de terribles hérésies surgirent. Vers cette époque, il dicta l’Évangile à son propre disciple, le vertueux Papias de Hiérapolis, afin de compléter ce qui manquait chez ceux qui, avant lui, avaient proclamé la Parole aux nations par toute la terre[c].


    Catena Patrum Graecorum sur saint Jean, publiée par B. Corder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoin porte « exotériques », avec la correction éditoriale proposée : « exégétiques ». Cette dernière leçon correspond au titre traditionnellement attribué aux cinq livres de Papias.'
    reason: La correction appartient à l’histoire éditoriale du fragment et ne doit pas être incorporée silencieusement.
  - marker: b
    text: La construction transmise permet une certaine hésitation sur le sujet de « mit par écrit » ; le fragment suivant affirme toutefois explicitement que Jean dicta l’Évangile à Papias.
    reason: Signale une ambiguïté textuelle réelle sans masquer le motif du choix retenu.
  - marker: c
    text: Le document fourni sous le titre « Fragment XIX » contient aussi le texte numéroté XX et son indication de source.
    reason: Clarifie l’étendue inhabituelle du passage transmis dans les données source.
lexical_decisions:
- source_word: argument
  choice: prologue
  rationale: Dans ce contexte manuscrit, « argument » désigne vraisemblablement une notice introductive ou un sommaire placé en tête de l’Évangile, non une argumentation au sens moderne.
- source_word: made known and given to the Churches
  choice: fut porté à la connaissance des Églises et leur fut remis
  rationale: Conserve les deux idées distinctes de publication et de transmission sans les réduire à un seul verbe.
- source_word: while he yet remained in the body
  choice: tandis qu’il demeurait encore dans son corps
  rationale: Maintient l’euphémisme ancien désignant le fait d’être encore en vie, plutôt que de l’aplanir entièrement.
- source_word: exoteric (read exegetical)
  choice: 'exotériques — lire : exégétiques'
  rationale: Préserve à la fois la leçon transmise par le témoin anglais et la correction éditoriale signalée.
- source_word: dictation
  choice: sous la dictée
  rationale: Rend directement l’affirmation du témoin concernant le rôle respectif de Jean et de Papias.
- source_word: the word
  choice: la Parole
  rationale: La majuscule signale ici la proclamation du message chrétien, tout en laissant ouverte la portée exacte de l’expression.
theological_decisions:
- issue: Identité du « disciple bien-aimé de Jean »
  choice: disciple bien-aimé de Jean
  alternative: le disciple que Jean aimait
  rationale: La formulation retenue ne confond pas Papias avec le « disciple que Jésus aimait » de l’Évangile selon Jean.
- issue: Rôle de Papias dans la rédaction de l’Évangile
  choice: Papias mit correctement l’Évangile par écrit sous la dictée de Jean
  alternative: Jean écrivit correctement l’Évangile
  rationale: Le sujet du témoin anglais est grammaticalement ambigu, mais le fragment suivant présente explicitement Papias comme le disciple qui reçoit la dictée. La traduction rend cette cohérence tout en la signalant en note.
- issue: Fonction de l’Évangile de Jean par rapport aux prédécesseurs
  choice: compléter ce qui manquait chez ceux qui, avant lui, avaient proclamé la Parole
  alternative: suppléer ce qui manquait dans les Évangiles antérieurs
  rationale: Évite d’identifier sans preuve explicite les prédécesseurs uniquement aux évangélistes ou leurs proclamations uniquement à des écrits.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les intitulés documentaires et les numéros de fragments sont conservés. Comme aucune transcription grecque ou latine n’est fournie et que la révision dans les langues anciennes est annoncée comme en attente, ce projet reste explicitement fondé sur le témoin anglais public fourni ; les ambiguïtés et corrections éditoriales ont donc été rendues avec prudence.
