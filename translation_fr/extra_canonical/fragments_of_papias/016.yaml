review_pass:
  verdict: revise
  source_fidelity: La révision demeure nécessairement fondée sur le témoin anglais public fourni, aucune transcription grecque ou latine vérifiable n’étant incluse. Elle conserve les deux unités transmises (XIX et XX), la correction éditoriale « exégétiques », l’expression imagée « dans son corps », et l’attribution disputée de la mise par écrit sans la trancher dans le corps du texte.
  naturalness: Le français est modernisé avec un registre documentaire soutenu. « Notice introductive » rend plus sûrement ici le latin manuscrit argumentum que « prologue », qui pourrait suggérer le Prologue johannique. La phrase de XX est réorganisée pour conserver les liens temporels du témoin sans alourdir la lecture.
  terminology: « Églises », « disciple bien-aimé », « sous la dictée », « le Fils du Tonnerre » et « la parole » sont maintenus ou rendus de manière sobre. La minuscule à « parole » suit le témoin anglais (« word ») et évite d’introduire une interprétation théologique non explicitée.
  issues:
  - severity: medium
    issue: « Prologue » pour « argument »
    rationale: Dans une rubrique manuscrite, argumentum désigne plus probablement une notice introductive ou un sommaire qu’un « prologue » au sens d’une section textuelle précise, particulièrement dans un contexte johannique.
  - severity: high
    issue: Le texte attribue directement à Papias la mise par écrit
    rationale: Le pronom « he » du témoin anglais est ambigu. Même si XX favorise une dictée à Papias, la traduction ne doit pas résoudre sans réserve cette difficulté d’attribution. Une tournure passive conserve l’ambiguïté; la note l’explique.
  - severity: medium
    issue: « chez ceux qui ... avaient proclamé » pour ce qui manquait
    rationale: Cette formulation française peut faire porter le manque sur les personnes plutôt que sur leur proclamation ou leur témoignage. « ce qui manquait à ceux qui » est plus fidèle à la syntaxe transmise tout en laissant la référence exacte ouverte.
  - severity: low
    issue: Majuscule à « Parole »
    rationale: Le témoin fourni porte simplement « word ». La minuscule française préserve l’absence de désignation explicitement christologique dans ce contexte.
  revised_text: 'Ici commence la notice introductive à l’Évangile selon Jean.


    L’Évangile de Jean fut porté à la connaissance des Églises et leur fut remis par Jean, tandis qu’il demeurait encore dans son corps. C’est ce qu’a rapporté un certain Papias de Hiérapolis, disciple bien-aimé de Jean, dans ses cinq livres exotériques — lire : exégétiques[a]. Mais l’Évangile fut correctement mis par écrit sous la dictée de Jean[b].


    Un manuscrit du Vatican datant du IXe siècle.


    XX


    En effet, Jean, le dernier d’entre eux, surnommé le Fils du Tonnerre, dicta l’Évangile à son propre disciple, le vertueux Papias de Hiérapolis, alors qu’il était déjà très âgé — comme Irénée, Eusèbe et une succession d’historiens dignes de foi nous l’ont transmis —, à l’époque où de terribles hérésies avaient surgi, afin de compléter ce qui manquait à ceux qui, avant lui, avaient proclamé la parole aux nations par toute la terre[c].


    Catena Patrum Graecorum sur saint Jean, publiée par B. Corder.'
