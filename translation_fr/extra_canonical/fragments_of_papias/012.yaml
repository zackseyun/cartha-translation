base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: fr
  text: 'Ceux qui pratiquaient la simplicité sans détour envers Dieu, on avait coutume de les appeler « enfants », comme le montre aussi Papias dans le premier livre des Expositions du Seigneur, ainsi que Clément d’Alexandrie dans le Pédagogue.[a]


    — Maxime le Confesseur, Scolies sur les œuvres de Denys l’Aréopagite, La Hiérarchie ecclésiastique, chapitre 2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais public fourni; la vérification directe du texte grec ou latin de cette scolie reste à effectuer.
    reason: La langue ancienne de la source n’a pas encore fait l’objet d’un contrôle direct; il convient de signaler explicitement cette limite textuelle.
lexical_decisions:
- source_word: guilelessness
  choice: la simplicité sans détour
  rationale: Rend l’idée d’une disposition exempte de ruse ou de duplicité, tout en restant naturelle et digne en français moderne.
- source_word: children
  choice: « enfants »
  rationale: Conserve l’appellation figurée du témoin anglais sans la préciser théologiquement.
- source_word: Expositions of the Lord
  choice: Expositions du Seigneur
  rationale: Maintient le titre traditionnel de l’ouvrage attribué à Papias, sans développer un complément absent du témoin fourni.
- source_word: Paedagogue
  choice: Pédagogue
  rationale: Emploie le titre français usuel de l’œuvre de Clément d’Alexandrie.
theological_decisions:
- issue: Sens de l’appellation « enfants »
  choice: Conserver « enfants » sans explication dans le corps du texte
  alternative: Interpréter comme « enfants de Dieu » ou « personnes spirituellement enfantines »
  rationale: Le témoin ne précise ni le statut théologique ni la nuance exacte de cette appellation; l’ajout résoudrait indûment l’ambiguïté.
- issue: Relation exprimée par « towards God »
  choice: « envers Dieu »
  alternative: « devant Dieu » ou « à l’égard de Dieu »
  rationale: « Envers Dieu » préserve l’orientation relationnelle du comportement sans lui attribuer une nuance judiciaire ou cultuelle.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « on avait coutume de les appeler » reproduit l’usage rapporté sans archaïsme marqué. Les titres d’œuvres sont francisés; le repère de page parasite du témoin imprimé est omis.
