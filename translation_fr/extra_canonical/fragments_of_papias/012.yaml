review_pass:
  verdict: revise
  source_fidelity: Le témoin anglais public est suivi avec fidélité, sous réserve explicite que le texte grec/latin de la scolie n’a pas été contrôlé directement. « Sans ruse » rend plus directement guilelessness que « simplicité sans détour », et l’appellation figurée « enfants » est maintenue sans ajout interprétatif.
  naturalness: La formulation proposée élimine l’enchaînement peu naturel « Ceux qui…, on avait coutume de les appeler » et exprime clairement que Papias et Clément attestent tous deux cet usage.
  terminology: « Enfants », « Expositions du Seigneur » et « Pédagogue » sont conservés. La référence à Maxime est formulée selon un usage français naturel, sans prétendre fixer une forme critique du titre de l’œuvre de Denys.
  issues:
  - severity: medium
    issue: Tournure verbale et sujet discordants dans la première phrase
    rationale: « Ceux qui pratiquaient…, on avait coutume de les appeler » mêle une relative à l’imparfait avec un tour principal au plus-que-parfait, sans nécessité contextuelle. Le témoin exprime un usage habituel passé; « Ils appelaient … ceux qui… » le restitue naturellement.
  - severity: low
    issue: « la simplicité sans détour » est une paraphrase quelque peu lourde de guilelessness
    rationale: L’expression française est compréhensible, mais « sans ruse » est plus idiomatique et rend directement l’absence de tromperie ou de duplicité, sans surcharger le texte.
  - severity: low
    issue: Coordination des deux autorités citées
    rationale: « comme le montre aussi Papias…, ainsi que Clément… » laisse le second verbe sous-entendu de façon moins nette. Un pluriel explicite indique que les deux auteurs sont invoqués comme témoins.
  revised_text: 'Ils appelaient « enfants » ceux qui se conduisaient envers Dieu sans ruse, comme le montrent aussi Papias dans le premier livre des Expositions du Seigneur et Clément d’Alexandrie dans le Pédagogue.[a]


    — Maxime le Confesseur, Scolies sur les œuvres de Denys l’Aréopagite, Sur la hiérarchie ecclésiastique, chapitre 2.'
  revised_footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais public fourni ; la vérification directe du texte grec ou latin de cette scolie reste à effectuer.
    reason: La langue ancienne de la source n’a pas encore fait l’objet d’un contrôle direct ; cette limite textuelle doit être signalée.
  revision_rationale: Révision limitée à la syntaxe, à l’idiomaticité et à une restitution plus directe de « guilelessness ». Le texte ne précise pas le sens théologique de « enfants » et ne l’interprète donc pas. La note de prudence relative à l’absence de contrôle direct de la source ancienne est conservée.
