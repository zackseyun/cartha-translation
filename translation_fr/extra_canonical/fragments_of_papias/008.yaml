base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: fr
  text: 'Mais voici ce que dit Papias — je le cite mot pour mot :


    « À certains d’entre eux, c’est-à-dire aux anges qui, au commencement, étaient saints, il donna aussi autorité sur l’organisation de l’univers ; il leur confia la mission de bien exercer cette autorité. »


    Puis il ajoute :


    « Mais il arriva que leur ordre fut réduit à néant ; car le grand dragon, le serpent ancien, appelé aussi Satan et le diable, fut précipité, oui, précipité sur la terre, lui et ses anges. »


    — André de Césarée, Commentaire sur l’Apocalypse, chap. 34, discours 12.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce fragment est conservé dans le Commentaire sur l’Apocalypse d’André de Césarée. La présente traduction repose provisoirement sur un ancien témoin anglais imprimé ; une vérification directe du texte grec ou latin reste à effectuer.
    reason: Le dossier fourni signale que l’examen de la langue source ancienne est encore en attente ; cette limite textuelle importante doit être transparente pour le lecteur.
lexical_decisions:
- source_word: dominion
  choice: autorité
  rationale: « Autorité » exprime naturellement en français la charge de gouvernement confiée aux anges, sans suggérer nécessairement une souveraineté absolue.
- source_word: arrangement of the universe
  choice: l’organisation de l’univers
  rationale: Cette formulation conserve l’idée d’un univers ordonné ou administré, sans préciser davantage un texte source ancien qui reste à vérifier.
- source_word: array
  choice: ordre
  rationale: Le terme anglais peut évoquer l’organisation, la disposition ou la troupe. « Ordre » maintient ce lien avec l’organisation précédemment mentionnée tout en préservant une certaine ambiguïté.
- source_word: came to nought
  choice: fut réduit à néant
  rationale: Rendu idiomatique mais proche du témoin anglais, indiquant l’effondrement ou l’abolition de cet ordre.
- source_word: was cast down
  choice: fut précipité
  rationale: Formulation biblique naturelle qui conserve la force du mouvement de chute et convient à l’allusion à Apocalypse 12.
theological_decisions:
- issue: Identité de « certains d’entre eux »
  choice: Conserver le pronom, puis l’explication « c’est-à-dire aux anges »
  alternative: Remplacer directement par « à certains anges »
  rationale: Le témoin présente une référence pronominale suivie d’une clarification explicite ; la traduction en maintient la structure plutôt que de la simplifier.
- issue: Nature de l’autorité angélique
  choice: Parler d’une autorité confiée sur l’organisation de l’univers
  alternative: Employer « gouvernement », « domination » ou préciser une fonction cosmique particulière
  rationale: Le passage affirme une délégation et une responsabilité morale, mais ne définit pas précisément la nature métaphysique ou institutionnelle de cette charge.
- issue: Rapport entre l’échec de « leur ordre » et la chute de Satan
  choice: Conserver le lien causal formulé par « car »
  alternative: Interpréter explicitement Satan comme chef de tous les anges concernés
  rationale: Le témoin relie les deux événements sans exposer complètement leur relation ; la traduction n’ajoute donc pas de hiérarchie doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe citationnelle demeure légèrement soutenue afin de convenir à un fragment patristique. Les corruptions manifestes de l’OCR ont été corrigées, et le titre latin de l’ouvrage a été rendu en français.
