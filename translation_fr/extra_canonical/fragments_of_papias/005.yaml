base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: fr
  text: '**VII[a]**


    Papias, qui avait écouté Jean et qui était évêque de Hiérapolis, en Asie, n’écrivit que cinq livres, auxquels il donna le titre *Explication des discours du Seigneur*. Dans la préface de cet ouvrage, il affirme ne pas suivre des propos recueillis sans discernement, mais prendre les apôtres pour autorités. Il dit :


    « J’avais coutume de rechercher ce qu’avaient dit André, Pierre, Philippe, Thomas, Jacques, Jean, Matthieu ou quelque autre disciple du Seigneur, ainsi que ce que disaient Aristion et Jean l’Ancien, disciples du Seigneur. Car les livres à lire ne me sont pas aussi profitables que la voix vivante qui, chez ceux qui la transmettent, résonne clairement jusqu’à aujourd’hui. »


    Il ressort clairement de cette liste de noms qu’un premier Jean est compté parmi les apôtres et qu’un autre, Jean l’Ancien, est mentionné après Aristion. Nous avons signalé ce fait à cause de l’affirmation rapportée plus haut, que nous avons consignée sur la foi d’un très grand nombre de personnes : les deux dernières lettres de Jean ne seraient pas l’œuvre de l’apôtre, mais celle de l’Ancien. On dit aussi que Papias a propagé la tradition juive d’un règne de mille ans. Irénée, Apollinaire et d’autres l’ont suivi : selon eux, après la résurrection, le Seigneur régnera dans la chair avec les saints.


    — **Jérôme, *Des hommes illustres* 18.**


    **VIII**


    De plus, une fausse rumeur m’est parvenue : j’aurais traduit les livres de Josèphe ainsi que les écrits de Papias et de Polycarpe. Mais je n’ai ni le temps ni la force de transposer dans une autre langue des ouvrages de ce genre avec une élégance équivalente.


    — **Jérôme, *Lettre à Lucinius* 71 (28), chapitre 5.**


    [a] Cette traduction est provisoirement établie d’après le témoin anglais fourni. Une vérification directe du grec et du latin reste à effectuer.'
