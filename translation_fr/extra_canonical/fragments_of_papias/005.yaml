lexical_decisions:
- source_word: hearer of John
  choice: qui avait écouté Jean
  rationale: Rend concrètement la relation d’auditeur sans renforcer le texte en faisant de Papias un disciple direct de Jean.
- source_word: An Exposition of Discourses of the Lord
  choice: Explication des discours du Seigneur
  rationale: « Explication » exprime l’entreprise d’exposition ou d’interprétation, tandis que « discours » conserve la portée assez large du titre transmis.
- source_word: promiscuous statements
  choice: des propos recueillis sans discernement
  rationale: Dans ce contexte, « promiscuous » signifie indiscriminés ou pris au hasard, non « licencieux ».
- source_word: the Elder John
  choice: Jean l’Ancien
  rationale: Conserve le titre distinctif qui fonde l’argument de Jérôme sur l’existence de deux Jean.
- source_word: the living voice clearly sounding up to the present day in (the persons of) authors
  choice: la voix vivante qui, chez ceux qui la transmettent, résonne clairement jusqu’à aujourd’hui
  rationale: Produit un français naturel tout en conservant l’opposition entre livres et transmission orale vivante; la formulation évite le calque peu clair « dans les personnes des auteurs ».
- source_word: a Millennium
  choice: un règne de mille ans
  rationale: Explicite le sens temporel et royal du millénium dans ce passage sans employer seul un terme technique potentiellement opaque.
- source_word: reign in the flesh
  choice: régnera dans la chair
  rationale: Conserve la formulation corporelle et sa tension théologique, sans l’atténuer en « régnera physiquement ».
- source_word: with corresponding elegance
  choice: avec une élégance équivalente
  rationale: Rend l’idée d’une qualité stylistique qui corresponde dans la langue d’arrivée.
theological_decisions:
- issue: Identité des deux Jean
  choice: Présenter comme argument de Jérôme la distinction entre Jean compté parmi les apôtres et Jean l’Ancien
  alternative: Identifier explicitement le premier à Jean fils de Zébédée ou attribuer définitivement les lettres à l’un des deux
  rationale: Le témoin établit une distinction argumentative, mais ne fournit pas ici toutes les identifications ni une conclusion historique incontestable.
- issue: Attribution des deux dernières lettres de Jean
  choice: 'Employer le conditionnel : « ne seraient pas l’œuvre de l’apôtre »'
  alternative: Affirmer directement qu’elles ne sont pas de l’apôtre
  rationale: Le passage rapporte une affirmation reçue sur l’autorité d’autres personnes; le conditionnel français maintient cette distance testimoniale.
- issue: Règne millénaire après la résurrection
  choice: Conserver « régnera dans la chair avec les saints »
  alternative: Interpréter ce règne comme littéral, terrestre, symbolique ou céleste
  rationale: Le fragment rapporte une position sans résoudre sa nature précise; la traduction préserve donc sa formulation et sa tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les titres anciens sont francisés; les noms propres suivent les formes françaises usuelles. Les ruptures d’OCR du témoin ont été réparées sans reproduire ses artefacts typographiques. La distinction entre citation de Papias, commentaire de Jérôme et références bibliographiques est clairement structurée.
