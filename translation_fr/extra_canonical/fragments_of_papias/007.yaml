  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: fr
  text: 'Cependant, en ce qui concerne l’inspiration du livre — c’est-à-dire de l’Apocal… [passage lacunaire] … le Divin —, Cyrille ainsi que des hommes d’une génération plus ancienne, [Papias ?][a], Irénée, Méthode et Hippolyte, attestent son authenticité.


    — ANDRÉ DE CÉSARÉE, préface à l’Apocalypse'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom est mutilé dans le témoin imprimé fourni; « Papias » est une restitution probable, mais incertaine. Le passage précédent est lui aussi incomplet après « Apocal… » et avant « le Divin ».
    reason: Signaler honnêtement les lacunes et corruptions du seul témoin disponible au lieu de reconstruire silencieusement le texte.
lexical_decisions:
- source_word: inspiration
  choice: inspiration
  rationale: Le témoin anglais emploie un terme théologique transparent, conservé sans en préciser davantage le sens en l’absence de vérification du texte grec.
- source_word: genuineness
  choice: authenticité
  rationale: « Authenticité » rend naturellement l’idée que l’ouvrage est tenu pour véritable, sans trancher plus précisément entre authenticité littéraire et canonicité.
- source_word: Apocalypse
  choice: Apocalypse
  rationale: Désignation française traditionnelle et courante du livre.
theological_decisions:
- issue: Nature exacte de l’« inspiration » et portée du témoignage ancien
  choice: Conserver « inspiration » et « authenticité » comme deux notions distinctes
  alternative: Parler de canonicité ou d’autorité divine
  rationale: Le témoin distingue l’inspiration du livre du témoignage rendu à son authenticité; il ne faut pas transformer cette formulation endommagée en affirmation confessionnelle plus précise.
- issue: Identité du nom mutilé avant Irénée
  choice: « [Papias ?] » avec marque explicite d’incertitude et note
  alternative: Omettre le nom ou imprimer « Papias » sans réserve
  rationale: Le contexte de ces fragments rend la restitution plausible, mais le témoin fourni est corrompu et la révision directe de la source ancienne reste à faire.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste légèrement formelle afin de refléter une préface patristique. Les lacunes du témoin public anglais sont rendues visibles; cette version demeure provisoire dans l’attente d’une vérification directe du grec ou du latin.
