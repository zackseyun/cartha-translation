review_pass:
  verdict: revise
  source_fidelity: Le témoin anglais est manifestement lacunaire et corrompu autour de « Apocal… mean, the Divine ». La traduction doit conserver cette lacune sans déplacer ni identifier avec assurance le nom ou l’épithète qui la suit. La restitution « [Papias ?] » après « génération plus ancienne » n’est pas directement soutenue par l’ordre des mots du témoin fourni.
  naturalness: La coordination du projet (« Cyrille ainsi que des hommes… attestent ») est grammaticalement possible seulement avec une reprise plus nette, mais elle demeure lourde et la place de [Papias ?] brouille la liste des témoins. Une formulation avec une série explicite de sujets est plus naturelle.
  terminology: « inspiration », « authenticité » et « Apocalypse » conviennent. « Authenticité » ne doit pas être renforcé en « canonicité ». Le titre traditionnel « André de Césarée » est recevable en français.
  issues:
  - severity: high
    issue: Restitution et déplacement non justifiés de « [Papias ?] »
    rationale: Le témoin place la séquence corrompue « the Divine » avant « and Cyril », alors que le projet introduit [Papias ?] après « des hommes d’une génération plus ancienne ». Cette réorganisation donne une apparence de certitude à une reconstruction qui n’est pas établie par le témoin disponible.
  - severity: medium
    issue: Syntaxe de la liste des témoins peu claire
    rationale: « Cyrille ainsi que des hommes d’une génération plus ancienne, [Papias ?], Irénée… » ne permet pas de savoir clairement si Papias, Irénée, Méthode et Hippolyte sont apposés à « des hommes » ou des sujets coordonnés. La lacune doit être signalée là où elle survient.
  - severity: low
    issue: Note insuffisamment précise sur la position de la corruption
    rationale: La note indique correctement l’incertitude, mais doit préciser que le nom ou qualificatif mutilé se trouve avant Cyrille dans le témoin, afin de ne pas cautionner son déplacement.
  revised_text: 'Cependant, quant à l’inspiration du livre — c’est-à-dire de l’Apocal… [passage lacunaire] … le Divin[a] —, Cyrille, ainsi que des hommes d’une génération plus ancienne, Irénée, Méthode et Hippolyte, attestent son authenticité.


    — ANDRÉ DE CÉSARÉE, préface à l’Apocalypse'
  revised_footnotes:
  - marker: a
    text: Le témoin imprimé fourni est lacunaire après « Apocal… » et avant « le Divin ». Il est donc impossible de déterminer avec certitude si « le Divin » qualifie un nom perdu — peut-être Papias — ou comment reconstruire exactement la phrase. Le témoin place cette séquence avant « Cyrille »; aucune restitution nominative n’est imprimée dans le texte.
    reason: Conserver la lacune et l’ordre attesté du témoin, sans reconstruire ou déplacer silencieusement un nom incertain.
  revision_rationale: La révision garde les termes théologiques du témoin et rend la phrase française lisible, tout en localisant explicitement la lacune à son emplacement attesté. Elle supprime la restitution conjecturale de Papias, car le seul témoin fourni ne permet ni de l’assurer ni de la placer après la mention des hommes plus anciens. La ponctuation isole la parenthèse lacunaire sans prétendre résoudre la syntaxe originelle, elle-même endommagée.
