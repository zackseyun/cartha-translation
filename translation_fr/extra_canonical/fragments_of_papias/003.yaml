base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: fr
  text: 'Chacun s’en alla chez soi, mais Jésus se rendit au mont des Oliviers. De bon matin, il revint dans le Temple, [et tout le peuple vint à lui ; il s’assit et se mit à les enseigner]. Les spécialistes de la Loi et les pharisiens amenèrent une femme surprise en adultère. Après l’avoir placée au milieu, ils lui dirent : « Maître, cette femme a été surprise en flagrant délit d’adultère. Or, dans la Loi, Moïse nous a ordonné de lapider de telles femmes. Toi donc, qu’en dis-tu ? » [Ils disaient cela pour le mettre à l’épreuve, afin d’avoir de quoi l’accuser.] Mais Jésus se baissa et se mit à écrire du doigt sur le sol. Comme ils continuaient à l’interroger, il se redressa et leur dit : « Que celui d’entre vous qui est sans péché soit le premier à lui jeter une pierre. » Puis il se baissa de nouveau et écrivit sur le sol. Après avoir entendu cela, ils sortirent un à un, en commençant par les plus âgés. Jésus resta seul avec la femme, toujours là, au milieu. Il se redressa et lui dit : «
    Femme, où sont-ils ? Personne ne t’a condamnée ? » Elle répondit : « Personne, Seigneur. » Jésus lui dit : « Moi non plus, je ne te condamne pas. Va, et désormais ne pèche plus. »[a]


    PÉRICOPE DE LA FEMME ADULTÈRE ; voir Westcott et Hort, The New Testament in the Original Greek, t. I, p. 241 ; t. II, p. 82 s., 91 ; Lightfoot, Essays on Supernatural Religion, p. 203 s.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette péricope, traditionnellement connue comme le récit de la femme adultère, présente une histoire textuelle complexe. Le présent texte suit le témoin anglais fourni, fondé sur une édition ancienne ; la vérification directe des témoins grecs ou latins reste à effectuer. Les crochets dans le corps du texte reproduisent les passages signalés comme rétablis ou incertains dans ce témoin.
    reason: Le dossier fourni indique qu’une révision dans les langues anciennes est encore en attente et que les crochets du témoin doivent être conservés ; la note informe le lecteur sans résoudre prématurément les questions textuelles.
lexical_decisions:
- source_word: Scribes
  choice: spécialistes de la Loi
  rationale: Expression française immédiatement compréhensible qui rend la fonction de ces experts des Écritures et de la Loi, plutôt qu’un simple métier de copiste.
- source_word: taken in adultery, in the very act
  choice: surprise en flagrant délit d’adultère
  rationale: Formulation française naturelle qui conserve l’insistance sur la constatation directe de l’acte.
- source_word: Master
  choice: Maître
  rationale: Titre d’adresse traditionnel et naturel dans un contexte d’enseignement.
- source_word: without sin
  choice: sans péché
  rationale: Conserve la formulation absolue et sa tension morale sans la réduire au seul péché en cause.
- source_word: Lord
  choice: Seigneur
  rationale: Préserve l’ambiguïté possible entre une adresse respectueuse et un titre à portée théologique.
- source_word: sin no more
  choice: ne pèche plus
  rationale: Rend directement l’impératif, sans préciser une catégorie de péché que le témoin ne précise pas.
theological_decisions:
- issue: Portée de « sans péché »
  choice: sans péché
  alternative: qui n’a jamais commis ce péché
  rationale: Le témoin formule une absence de péché sans restriction explicite ; la traduction n’en limite donc pas la portée à l’adultère.
- issue: Sens du titre adressé à Jésus par la femme
  choice: Seigneur
  alternative: Monsieur
  rationale: « Seigneur » maintient la résonance théologique possible tout en restant une forme d’adresse, sans trancher explicitement l’intention de la femme.
- issue: Non-condamnation et appel à cesser de pécher
  choice: Conserver côte à côte « je ne te condamne pas » et « ne pèche plus »
  alternative: Paraphraser l’un à la lumière de l’autre
  rationale: La traduction préserve la tension du récit entre la non-condamnation de Jésus et son impératif moral.
translation_notes:
  register: Français international moderne, digne et accessible. Récit au passé simple et à l’imparfait, dialogues naturels. Les crochets du témoin ont été conservés exactement comme marques d’incertitude ou de restitution. La notice bibliographique finale a été traduite tout en maintenant les titres d’ouvrages dans leur langue originale.
