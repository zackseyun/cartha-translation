base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: fr
  text: 'I


    Irénée et d’autres rapportent que Jean, le théologien et apôtre, vécut jusqu’au temps de Trajan. Par la suite, Papias de Hiérapolis et Polycarpe, évêque de Smyrne, qui avaient été ses auditeurs, devinrent célèbres.[a]


    — Eusèbe, Chronique (Syncelle 655, 14), pour la 220e olympiade.


    II


    À cette époque, Polycarpe était une figure éminente en Asie. Il était disciple des apôtres et [passage corrompu et illisible concernant l’Église de Smyrne et « … les serviteurs du Seigneur »].[b] À la même époque, Papias, qui était lui aussi évêque du diocèse de Hiérapolis, se fit remarquer.


    — Eusèbe, Histoire ecclésiastique 3.36.1-2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire d’après le témoin anglais fourni. La vérification directe du grec ou du latin reste à effectuer; le pronom rendu par « qui avaient été ses auditeurs » renvoie vraisemblablement à Papias et à Polycarpe comme auditeurs de Jean.
    reason: Signaler la base documentaire indirecte et conserver l’incertitude liée à la syntaxe transmise.
  - marker: b
    text: Le témoin fourni est gravement altéré à cet endroit par des lacunes ou des erreurs de lecture. Seuls les éléments relatifs à l’Église de Smyrne et aux « serviteurs du Seigneur » restent partiellement reconnaissables; aucune reconstruction suivie n’est proposée.
    reason: Rendre visible l’état corrompu de la source plutôt que d’introduire une restitution conjecturale.
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: Jean, le théologien et apôtre
  rationale: « Théologien » rend le titre ancien sans suggérer que Jean serait lui-même divin, ce que pourrait laisser entendre une traduction littérale maladroite de l’anglais « the Divine ».
- source_word: his hearers
  choice: qui avaient été ses auditeurs
  rationale: Cette formulation conserve le rapport d’enseignement ou d’écoute affirmé par le témoin, ainsi que la référence grammaticale probable à Jean.
- source_word: flourished
  choice: était une figure éminente
  rationale: Expression française naturelle pour indiquer qu’une personne jouissait alors d’une activité et d’une notoriété remarquables.
- source_word: ministers of the Lord
  choice: les serviteurs du Seigneur
  rationale: « Serviteurs » demeure assez large pour ne pas imposer un office ecclésiastique précis au sein d’un passage corrompu.
- source_word: diocese
  choice: diocèse
  rationale: Terme transmis par le témoin anglais; il est maintenu sans développer rétroactivement une structure institutionnelle plus précise.
theological_decisions:
- issue: Identité et titre de Jean
  choice: Jean, le théologien et apôtre
  alternative: Jean le Divin et Apôtre
  rationale: Le choix retenu exprime un titre traditionnel lié à son discours sur Dieu sans attribuer à Jean la divinité.
- issue: Relation de Papias et Polycarpe avec Jean
  choice: qui avaient été ses auditeurs
  alternative: ses disciples
  rationale: « Auditeurs » préserve la formulation du témoin et évite de renforcer la relation en un statut formel de disciples.
- issue: Contenu du passage gravement corrompu
  choice: signaler explicitement la lacune sans reconstruction
  alternative: reconstituer une phrase continue à partir de conjectures
  rationale: Le document fourni ne permet pas de déterminer le texte avec sûreté; une restitution théologique ou historique serait spéculative.
translation_notes:
  register: Français international moderne, sobre et digne. Les titres des œuvres et les références sont normalisés. Le texte demeure explicitement provisoire puisque le dossier ne fournit qu’un témoin anglais ancien fortement corrompu, sans texte grec ou latin directement contrôlable.
