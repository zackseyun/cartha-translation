review_pass:
  verdict: revise
  source_fidelity: Révision légère nécessaire. Le projet conserve correctement les repères temporels distincts, l’indétermination de la voix et de l’identité des deux figures, ainsi que le déplacement seulement partiel de la pierre. Toutefois, « le tombeau s’ouvrit » transforme le passif du témoin (« the tomb was opened ») en événement pronominal; « fut ouvert » préserve mieux l’agent non précisé. « Une voix puissante retentit » interprète aussi quelque peu « a great voice »; « une grande voix se fit entendre » reste plus proche sans identifier son origine.
  naturalness: Le français est globalement fluide, narratif et adapté à un registre moderne digne. « Se rendit au tombeau » est plus précis que « se rendit sur place », et « rayonnant d’un grand éclat » rend naturellement la radiance abondante.
  terminology: « Sabbat », « jour du Seigneur », « tombeau », « hommes » puis « jeunes hommes » sont appropriés et cohérents. Aucune identification théologique indue n’est introduite.
  issues:
  - severity: medium
    issue: Voix céleste rendue comme « une voix puissante retentit »
    rationale: Le témoin dit seulement qu’il y eut « une grande voix dans le ciel ». « Puissante » et « retentit » sont plausibles, mais ajoutent respectivement une interprétation de l’adjectif et une description événementielle. Une formulation plus littérale conserve mieux l’ambiguïté.
  - severity: medium
    issue: Passif de l’ouverture du tombeau non conservé
    rationale: « The tomb was opened » est passif et laisse l’agent indéterminé. « Le tombeau s’ouvrit » suggère davantage une ouverture spontanée; « le tombeau fut ouvert » rend le passif sans nommer d’agent.
  - severity: low
    issue: « sur place » est moins référentiel que le témoin
    rationale: Le témoin indique que la foule alla voir le tombeau. « Au tombeau » rend explicitement le référent et demeure naturel.
  revised_text: (34) À l’aube du sabbat, une foule venue de Jérusalem et de la campagne environnante se rendit au tombeau pour voir celui qui avait été scellé. (35) Mais, durant la nuit, avant l’aube du jour du Seigneur, tandis que les soldats montaient la garde deux par deux, une grande voix se fit entendre dans le ciel. (36) Ils virent les cieux s’ouvrir, et deux hommes en descendirent, rayonnant d’un grand éclat; ils s’approchèrent du tombeau. (37) La pierre qui avait été placée à l’entrée roula d’elle-même et s’écarta en partie. Le tombeau fut ouvert, et les deux jeunes hommes y entrèrent.[a]
  revised_footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais du domaine public fourni; la vérification directe du texte grec du Codex d’Akhmîm reste à effectuer. L’expression « s’écarta en partie » conserve le détail du témoin selon lequel la pierre ne se déplaça que partiellement.
    reason: La base de rédaction n’a pas encore fait l’objet d’une révision directe à partir de la langue ancienne, et ce détail inhabituel doit être signalé sans harmonisation.
  revision_rationale: La révision resserre l’adhésion au témoin anglais disponible sans résoudre les ambiguïtés textuelles. Elle conserve la distinction entre sabbat et jour du Seigneur, l’absence d’identification de la voix ou des deux hommes, le passage de « hommes » à « jeunes hommes », et le mouvement seulement partiel de la pierre. Le passif concernant l’ouverture du tombeau est restauré.
