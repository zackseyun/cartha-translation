base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: fr
  text: (34) À l’aube du sabbat, une foule venue de Jérusalem et de la campagne environnante se rendit sur place pour voir le tombeau qui avait été scellé. (35) Mais, durant la nuit, avant l’aube du jour du Seigneur, tandis que les soldats montaient la garde deux par deux, une voix puissante retentit dans le ciel. (36) Ils virent les cieux s’ouvrir et deux hommes en descendre, resplendissants d’une vive lumière; ils s’approchèrent du tombeau. (37) La pierre qui avait été placée à l’entrée roula d’elle-même et s’écarta en partie. Le tombeau s’ouvrit, et les deux jeunes hommes y entrèrent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais du domaine public fourni; la vérification directe du texte grec du Codex d’Akhmîm reste à effectuer. L’expression «s’écarta en partie» conserve le détail du témoin selon lequel la pierre ne se déplaça que partiellement.
    reason: La base de rédaction n’a pas encore fait l’objet d’une révision directe à partir de la langue ancienne, et ce détail inhabituel mérite d’être signalé sans être harmonisé.
lexical_decisions:
- source_word: morning of the Sabbath
  choice: à l’aube du sabbat
  rationale: Formulation naturelle qui conserve la désignation temporelle du témoin sans l’assimiler au jour du Seigneur mentionné ensuite.
- source_word: grave / tomb
  choice: tombeau
  rationale: Un même terme français est employé dans tout le passage pour assurer la cohérence référentielle; «tombeau» convient à une sépulture fermée par une pierre.
- source_word: the Lord’s day
  choice: jour du Seigneur
  rationale: Rend littéralement l’expression traditionnelle tout en conservant sa distinction avec le sabbat.
- source_word: great voice in heaven
  choice: une voix puissante retentit dans le ciel
  rationale: «Puissante» exprime la grandeur ou l’intensité de la voix; «retentit» produit un français idiomatique sans identifier celui qui parle.
- source_word: having much radiance
  choice: resplendissants d’une vive lumière
  rationale: Restitue l’éclat extraordinaire attribué aux deux hommes dans une langue claire et digne.
- source_word: made way in part
  choice: s’écarta en partie
  rationale: Préserve le détail inhabituel selon lequel la pierre ne se déplace que partiellement, sans tenter de l’expliquer.
- source_word: young men
  choice: jeunes hommes
  rationale: Conserve le changement de désignation entre «deux hommes» au verset 36 et «les deux jeunes hommes» au verset 37.
theological_decisions:
- issue: Rapport chronologique entre le sabbat et le jour du Seigneur
  choice: Conserver les deux expressions distinctes et leur enchaînement tel qu’il apparaît dans le témoin fourni.
  alternative: Harmoniser la chronologie en reformulant l’une des deux indications temporelles.
  rationale: Le passage présente une tension chronologique potentielle; la traduction ne doit pas la résoudre silencieusement, surtout avant la vérification directe du grec.
- issue: Identité des deux hommes lumineux
  choice: Les appeler «hommes», puis «jeunes hommes», conformément au témoin.
  alternative: Les identifier explicitement comme des anges.
  rationale: Le texte fourni ne les nomme pas anges; une telle identification importerait une interprétation.
- issue: Origine de la voix céleste
  choice: Ne pas identifier celui qui parle.
  alternative: Attribuer la voix à Dieu ou au Seigneur.
  rationale: Le témoin mentionne seulement une voix dans le ciel; préserver cette indétermination respecte l’ambiguïté du texte.
- issue: Ouverture du tombeau
  choice: Dire que le tombeau «s’ouvrit».
  alternative: Employer un passif explicite, «fut ouvert», suggérant davantage un agent non nommé.
  rationale: Le témoin anglais présente un passif, mais l’agent reste indéterminé. Le pronominal français maintient l’événement sans préciser sa cause.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe fluide, vocabulaire courant, sans archaïsmes ni ajout confessionnel. La traduction demeure explicitement provisoire puisque la révision du grec est signalée comme en attente.
