review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu, y compris « juste », la résurrection envisagée et l’expression volontairement indéterminée « do us wrong ». Une correction est nécessaire en 32 : le sujet de « Ils roulèrent » est indéterminé et dissocie inutilement le roulement de la pierre de l’action de « tous ceux qui étaient là ». En 30, « l’enlever » atténue le sens explicite de « steal him » ; « le dérober » le conserve sans ajouter « corps ».'
  naturalness: Le français est globalement naturel et de registre narratif approprié. « De peur que » rend plus directement la valeur préventive de « lest ». La construction inhabituelle de 32 demeure nécessairement étrange, mais peut être formulée grammaticalement sans la normaliser.
  terminology: « Scribes », « pharisiens », « anciens », « tombeau », « juste », « ressuscité d’entre les morts », « sceaux » et « monter la garde » conviennent. « Centurion Pétronius » est conforme au témoin fourni.
  issues:
  - severity: medium
    issue: 'Verset 32 : sujet ambigu et articulation de l’action'
    rationale: « Ils roulèrent une grosse pierre… puis tous ceux qui étaient là la placèrent » ne rend pas clairement la participiale du témoin, où le roulement précède l’action attribuée à tous les présents. Il faut conserver l’étrangeté de « vers/jusqu’au centurion et aux soldats » tout en reliant grammaticalement les actions.
  - severity: medium
    issue: 'Verset 30 : « l’enlever » ne marque pas explicitement le vol'
    rationale: Le témoin dit « steal him ». « Le dérober » maintient l’idée de soustraction clandestine sans expliciter indûment qu’il s’agit du corps.
  revised_text: '(28) Les scribes, les pharisiens et les anciens se réunirent après avoir entendu tout le peuple murmurer, se frapper la poitrine et dire : « Si de si grands signes se sont produits au moment de sa mort, voyez combien il était juste ! »


    (29) Les anciens prirent peur et allèrent trouver Pilate, le suppliant et disant : (30) « Donne-nous des soldats pour que nous gardions son tombeau pendant trois jours, de peur que ses disciples ne viennent le dérober, que le peuple ne croie qu’il est ressuscité d’entre les morts et ne nous fasse du mal. »


    (31) Pilate leur donna le centurion Pétronius, accompagné de soldats, pour garder le tombeau. Des anciens et des scribes allèrent avec eux jusqu’au tombeau. (32) Après avoir roulé une grande pierre jusqu’au centurion et aux soldats[a], tous ceux qui étaient là la placèrent devant l’entrée du tombeau. (33) Ils y apposèrent sept sceaux, dressèrent une tente sur place et montèrent la garde.'
  revised_footnotes:
  - marker: a
    text: 'La formulation du témoin fourni est inhabituelle : la pierre est roulée « jusqu’au centurion et aux soldats ». La vérification directe du grec reste en attente.'
    reason: Signaler la construction difficile sans l’harmoniser ni prétendre résoudre son sens avant l’examen direct du grec.
  revision_rationale: Révision ciblée pour restituer explicitement le vol envisagé en 30 et pour rendre en 32 la séquence participiale et son sujet collectif, tout en préservant l’anomalie textuelle signalée. Les autres choix du projet sont maintenus.
