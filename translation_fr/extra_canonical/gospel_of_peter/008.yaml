base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: fr
  text: '(28) Les scribes, les pharisiens et les anciens se réunirent. Ils avaient entendu tout le peuple murmurer, se frapper la poitrine et dire : « Si de si grands signes se sont produits au moment de sa mort, voyez combien il était juste ! »


    (29) Les anciens prirent peur. Ils allèrent trouver Pilate et le supplièrent en disant : (30) « Donne-nous des soldats pour que nous gardions son tombeau pendant trois jours. Sinon, ses disciples pourraient venir l''enlever, et le peuple pourrait croire qu''il est ressuscité d''entre les morts et nous faire du mal. »


    (31) Pilate leur donna le centurion Pétronius, accompagné de soldats, pour garder le tombeau. Des anciens et des scribes les accompagnèrent jusqu''au tombeau. (32) Ils roulèrent une grosse pierre vers le centurion et les soldats[a], puis tous ceux qui étaient là la placèrent devant l''entrée du tombeau. (33) Ils y apposèrent sept sceaux, dressèrent une tente sur place et montèrent la garde.


    [a] La formulation du témoin est inhabituelle : la pierre est roulée « vers le centurion et les soldats ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation du témoin est inhabituelle : la pierre est roulée « vers le centurion et les soldats ».'
    reason: Signaler sans la corriger une construction difficile du témoin anglais, la vérification directe du grec étant encore en attente.
lexical_decisions:
- source_word: grumbling
  choice: murmurer
  rationale: Rend naturellement la plainte collective et mécontente du peuple sans en préciser davantage la teneur.
- source_word: beating their chests
  choice: se frapper la poitrine
  rationale: Conserve le geste concret de deuil, de détresse ou de repentir sans l'interpréter.
- source_word: just
  choice: juste
  rationale: Préserve le vocabulaire moral et potentiellement théologique du témoin, plutôt que de le réduire à « innocent ».
- source_word: grave / tomb
  choice: tombeau
  rationale: Unifie en français la désignation du lieu d'ensevelissement dans ce passage, tout en gardant un registre narratif digne.
- source_word: rose from the dead
  choice: est ressuscité d'entre les morts
  rationale: Formule française biblique claire qui conserve l'affirmation envisagée par les interlocuteurs.
- source_word: do us wrong
  choice: nous faire du mal
  rationale: Conserve l'indétermination de la menace sans imposer le sens plus précis de « nous accuser » ou « nous punir ».
- source_word: kept watch
  choice: montèrent la garde
  rationale: Expression française naturelle pour une surveillance militaire continue.
theological_decisions:
- issue: Sens de « juste » appliqué à Jésus
  choice: combien il était juste
  alternative: combien il était innocent
  rationale: « Juste » maintient la portée morale et théologique plus large du terme attesté, sans résoudre celle-ci en simple innocence judiciaire.
- issue: Crainte que le peuple croie à la résurrection
  choice: le peuple pourrait croire qu'il est ressuscité d'entre les morts
  alternative: le peuple pensera qu'il est revenu à la vie
  rationale: La formulation retenue préserve explicitement le langage de résurrection et le caractère éventuel exprimé dans la demande.
- issue: Conséquence redoutée par les anciens
  choice: nous faire du mal
  alternative: nous causer du tort
  rationale: Le témoin reste vague sur la nature du préjudice; la traduction ne précise donc ni violence, ni accusation, ni condamnation.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases longues ont été légèrement segmentées pour la lisibilité. Cette version demeure provisoire, car le dossier fourni indique qu'une vérification directe du grec du codex d'Akhmîm reste à effectuer; l'étrange formulation du verset 32 a donc été conservée et signalée plutôt qu'harmonisée.
