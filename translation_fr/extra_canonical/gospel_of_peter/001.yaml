base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: fr
  text: '(1) Mais aucun des Juifs ne se lava les mains, ni Hérode ni aucun de ses juges. Comme ils ne voulaient pas se laver les mains, Pilate se leva. (2) Alors le roi Hérode ordonna d’emmener le Seigneur et leur dit : « Faites ce que je vous ai ordonné de lui faire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: washed the hands
  choice: se lava les mains
  rationale: Expression française naturelle qui conserve le geste concret et sa portée symbolique sans l’expliciter.
- source_word: stood up
  choice: se leva
  rationale: Rend directement le mouvement de Pilate, sans préciser une conséquence que le témoin ne formule pas.
- source_word: the Lord
  choice: le Seigneur
  rationale: Conserve le titre christologique du témoin consulté.
- source_word: to be brought
  choice: qu’on lui amène
  rationale: Formulation idiomatique qui conserve l’ordre de faire conduire le Seigneur auprès d’Hérode.
theological_decisions:
- issue: Responsabilité des personnages juifs, d’Hérode et de ses juges
  choice: Conserver l’attribution explicite du refus de se laver les mains aux personnages nommés
  alternative: Atténuer ou généraliser la responsabilité collective
  rationale: Le passage l’énonce explicitement; la traduction ne doit ni l’effacer ni l’amplifier au-delà du texte.
- issue: Portée du geste de Pilate
  choice: Traduire simplement « Pilate se leva »
  alternative: Interpréter ce geste comme un retrait officiel, un acquittement ou une protestation
  rationale: Le témoin disponible ne précise pas la signification du geste; l’ambiguïté est donc maintenue.
- issue: Référent de « leur dit »
  choice: Conserver le pronom pluriel sans identifier davantage ses destinataires
  alternative: Préciser qu’il s’agit des juges, des Juifs ou des soldats
  rationale: Le témoin anglais fourni laisse le groupe visé implicite.
translation_notes:
  register: Français international moderne, clair et digne. Projet provisoire fondé sur le témoin anglais public fourni; la vérification directe du grec du Codex d’Akhmim reste à effectuer. Aucun marqueur de note n’est ajouté puisqu’aucune note de bas de page n’est nécessaire dans le texte.
