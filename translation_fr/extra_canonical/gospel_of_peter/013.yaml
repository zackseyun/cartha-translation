revisions:
- from: '(55) Elles se rendirent donc au tombeau et constatèrent qu’il avait été ouvert. S’étant approchées, elles se penchèrent et virent là un jeune homme assis au milieu du tombeau. Il était beau et vêtu d’une longue robe resplendissante. Il leur dit : (56) « Pourquoi êtes-vous venues ? Qui cherchez-vous ? Celui qui a été crucifié ? Il s’est relevé et il est parti. Mais si vous ne le croyez pas, penchez-vous et regardez l’endroit où il était étendu : il n’est pas ici, car il s’est relevé et il est retourné d’où il était venu[a]. »


    (57) Alors les femmes prirent peur et s’enfuirent.'
  to: '(55) Elles partirent et trouvèrent que le tombeau avait été ouvert. S’étant approchées, elles se penchèrent et virent là un jeune homme assis au milieu du tombeau. Il était beau, vêtu d’une longue robe resplendissante. Il leur dit : (56) « Pourquoi êtes-vous venues ? Qui cherchez-vous ? Celui qui a été crucifié ? Il s’est relevé et il est parti. Mais si vous ne le croyez pas, penchez-vous et voyez l’endroit où il était couché : il n’y est pas, car il s’est relevé et il est allé là d’où il avait été envoyé. »


    (57) Alors les femmes prirent peur et s’enfuirent.'
  rationale: 'La révision retire les ajouts mineurs de l’ouverture et corrige la finale selon le grec attesté : l’expression désigne le lieu d’où le crucifié avait été envoyé, sans nommer l’auteur de l’envoi ni en tirer une conclusion doctrinale. La note provisoire est supprimée, car elle était attachée à une formulation désormais corrigée. La formulation elliptique des questions et l’identification non interprétée du jeune homme sont préservées.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:14:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire à la fin du v. 56 : le grec du Codex d’Akhmim porte l’idée qu’il est allé « là d’où il avait été envoyé » (ἐκεῖ ὅθεν ἀπεστάλη), et non simplement qu’il est retourné là d’où il était venu. Le projet ajoutait aussi « donc au tombeau », alors que le texte conservé dit seulement qu’elles partirent/allèrent et trouvèrent le tombeau ouvert. Les autres éléments — jeune homme, beauté, longue robe brillante, questions elliptiques et fuite des femmes — sont fidèlement rendus.'
  naturalness: 'Le français est globalement naturel et d’un registre narratif approprié. « Elles partirent et trouvèrent que le tombeau avait été ouvert » est plus sobre et plus proche que « Elles se rendirent donc au tombeau et constatèrent ». « Voyez l’endroit où il était couché : il n’y est pas » rend clairement la relation entre l’endroit et l’absence du crucifié.'
  terminology: « Tombeau », « jeune homme », « crucifié » et « longue robe resplendissante » conviennent. « S’est relevé » conserve utilement la formulation verbale sans imposer « ressuscité ». « Avait été envoyé » restitue le passif du grec sans identifier l’expéditeur ni préciser doctrinalement la destination.
  issues:
  - severity: high
    issue: La dernière proposition du v. 56 est rendue « il est retourné d’où il était venu ».
    rationale: Le texte grec connu lit qu’il est allé là d’où il avait été envoyé. « Retourné » et « était venu » ne rendent ni le verbe d’envoi ni son passif, et modifient la nuance du passage.
  - severity: medium
    issue: « Elles se rendirent donc au tombeau » ajoute une destination explicite et la particule « donc ».
    rationale: Le texte dit qu’elles partirent/allèrent, puis qu’elles trouvèrent le tombeau ouvert. La destination peut être inférée du contexte, mais elle n’est pas formulée dans cet extrait.
  - severity: low
    issue: La note existante présente comme provisoire une formulation qui doit être corrigée plutôt que conservée sur l’autorité du témoin anglais.
    rationale: Une fois le passif grec rendu, cette note n’est plus nécessaire; elle risquerait de valider une lecture anglaise insuffisamment fidèle.
  revised_text: '(55) Elles partirent et trouvèrent que le tombeau avait été ouvert. S’étant approchées, elles se penchèrent et virent là un jeune homme assis au milieu du tombeau. Il était beau, vêtu d’une longue robe resplendissante. Il leur dit : (56) « Pourquoi êtes-vous venues ? Qui cherchez-vous ? Celui qui a été crucifié ? Il s’est relevé et il est parti. Mais si vous ne le croyez pas, penchez-vous et voyez l’endroit où il était couché : il n’y est pas, car il s’est relevé et il est allé là d’où il avait été envoyé. »


    (57) Alors les femmes prirent peur et s’enfuirent.'
