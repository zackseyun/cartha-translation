base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: fr
  text: '(55) Elles partirent et trouvèrent que le tombeau avait été ouvert. S’étant approchées, elles se penchèrent et virent là un jeune homme assis au milieu du tombeau. Il était beau, vêtu d’une longue robe resplendissante. Il leur dit : (56) « Pourquoi êtes-vous venues ? Qui cherchez-vous ? Celui qui a été crucifié ? Il s’est relevé et il est parti. Mais si vous ne le croyez pas, penchez-vous et voyez l’endroit où il était couché : il n’y est pas, car il s’est relevé et il est allé là d’où il avait été envoyé. »


    (57) Alors les femmes prirent peur et s’enfuirent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tomb
  choice: tombeau
  rationale: « Tombeau » est naturel dans un récit funéraire ancien et convient à un lieu dans lequel on peut entrer et s’asseoir.
- source_word: young man
  choice: jeune homme
  rationale: Conserve la désignation humaine du témoin sans l’identifier explicitement comme un ange.
- source_word: beautiful
  choice: beau
  rationale: Préserve le trait inhabituel du témoin au lieu de le remplacer par « impressionnant » ou « éclatant ».
- source_word: long, shining robe
  choice: longue robe resplendissante
  rationale: Rend à la fois la longueur du vêtement et son éclat dans un français digne et courant.
- source_word: arose
  choice: s’est relevé
  rationale: Conserve le sens concret de se lever tout en laissant résonner le sens de résurrection, sans imposer partout le terme théologique « ressuscité ».
- source_word: went away / went to where he came from
  choice: il est parti / il est retourné d’où il était venu
  rationale: Maintient la progression et l’étrangeté de l’énoncé final sans préciser une destination absente du témoin fourni.
theological_decisions:
- issue: Identité du jeune homme
  choice: « un jeune homme »
  alternative: « un ange »
  rationale: Le témoin le désigne comme un jeune homme; l’identifier comme un ange résoudrait une ambiguïté que le texte laisse subsister.
- issue: Formulation de la résurrection
  choice: « Il s’est relevé »
  alternative: « Il est ressuscité »
  rationale: Le choix retenu reste proche de la formulation attestée par le témoin anglais et préserve son double registre concret et théologique.
- issue: Destination de Jésus
  choice: « il est retourné d’où il était venu »
  alternative: « il est retourné auprès de Dieu »
  rationale: Le texte ne nomme pas explicitement la destination; toute précision doctrinale serait ajoutée.
- issue: Question sur le crucifié
  choice: « Celui qui a été crucifié ? »
  alternative: « Ne cherchez-vous pas celui qui a été crucifié ? »
  rationale: La question elliptique et abrupte du témoin est conservée plutôt que développée en une phrase plus interprétative.
translation_notes:
  register: Français international moderne, narratif et digne. Les participes en chaîne du témoin ont été répartis en phrases naturelles. La traduction demeure provisoire, car elle repose sur le témoin anglais public fourni et non sur une collation directe du grec du manuscrit.
