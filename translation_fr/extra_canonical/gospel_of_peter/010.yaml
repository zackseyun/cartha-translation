review_pass:
  verdict: revise
  source_fidelity: Le projet suit fidèlement le témoin anglais fourni dans l’ensemble, y compris la garde, les trois hommes, la croix qui suit, et l’opposition « le ciel / les cieux ». Toutefois, « le message » est un ajout absent du témoin à la question du v. 41. La note le reconnaît, mais une traduction optimale n’a pas besoin de cet ajout. « Deux premiers » au v. 40 introduit aussi une séquence non exprimée par le texte, qui dit simplement « les deux ».
  naturalness: Le français est naturel, moderne et convient au registre narratif. « Proclamer à ceux qui dorment » est un peu elliptique, mais reste recevable dans ce contexte solennel et permet de ne pas ajouter d’objet. « Une réponse se fit entendre depuis la croix » rend plus exactement la formulation auditive sans affaiblir l’attribution extraordinaire à la croix.
  terminology: « Monter la garde », « tombeau », « les cieux » et « ceux qui dorment » sont bien choisis. Il convient de conserver littéralement l’image de ceux qui dorment et de ne pas identifier ou expliciter le contenu de la proclamation.
  issues:
