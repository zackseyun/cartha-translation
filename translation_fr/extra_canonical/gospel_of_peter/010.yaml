  to: '(38) Quand les soldats virent cela, ils réveillèrent le centurion et les anciens, car eux aussi étaient là à monter la garde. (39) Pendant que les soldats leur racontaient ce qu’ils avaient vu, ils virent de nouveau trois hommes sortir du tombeau. Deux soutenaient le troisième, et une croix les suivait. (40) Les têtes des deux atteignaient le ciel, mais celle de celui qu’ils conduisaient dépassait les cieux.


    (41) Ils entendirent une voix venant des cieux, qui disait : « As-tu proclamé à ceux qui dorment ? »


    (42) Une réponse se fit entendre depuis la croix : « Oui ! »'
  rationale: La révision retire l’ajout interprétatif « le message » et la note devenue inutile, remplace « les deux premiers » par « les deux », et ajuste le v. 42 pour refléter de plus près le fait qu’une réponse est entendue depuis la croix. Elle conserve l’ambiguïté de l’interlocuteur, la métaphore du sommeil, ainsi que la distinction « le ciel / les cieux ».
