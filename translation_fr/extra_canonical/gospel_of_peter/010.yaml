revisions:
- from: '(38) Quand les soldats virent cela, ils réveillèrent le centurion et les anciens, car eux aussi étaient là à monter la garde. (39) Pendant que les soldats leur racontaient ce qu’ils avaient vu, ils virent de nouveau trois hommes sortir du tombeau. Deux soutenaient le troisième, et une croix les suivait. (40) La tête des deux premiers atteignait le ciel, mais celle de l’homme qu’ils conduisaient dépassait les cieux.


