base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: fr
  text: '(38) Quand les soldats virent cela, ils réveillèrent le centurion et les anciens, car eux aussi étaient là à monter la garde. (39) Pendant que les soldats leur racontaient ce qu’ils avaient vu, ils virent de nouveau trois hommes sortir du tombeau. Deux soutenaient le troisième, et une croix les suivait. (40) Les têtes des deux atteignaient le ciel, mais celle de celui qu’ils conduisaient dépassait les cieux.


    (41) Ils entendirent une voix venant des cieux, qui disait : « As-tu proclamé à ceux qui dorment ? »


    (42) Une réponse se fit entendre depuis la croix : « Oui ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: keeping guard
  choice: monter la garde
  rationale: Expression française naturelle et précise pour une surveillance militaire.
- source_word: supporting
  choice: soutenaient
  rationale: Conserve le sens physique sans préciser davantage la manière dont le troisième homme était aidé.
- source_word: heaven / the heavens
  choice: le ciel / les cieux
  rationale: Préserve la variation singulier-pluriel du témoin fourni, susceptible d’être significative.
- source_word: those who sleep
  choice: ceux qui dorment
  rationale: Maintient l’image du sommeil et son ambiguïté possible, plutôt que de l’expliciter par « les morts ».
- source_word: proclaimed
  choice: proclamé le message
  rationale: « Proclamer » appelle normalement un complément en français moderne ; l’ajout minimal « le message » rend la phrase naturelle sans spécifier le contenu.
theological_decisions:
- issue: Identité de celui qui reçoit la question céleste
  choice: Tutoiement au singulier sans identifier explicitement l’interlocuteur
  alternative: Employer le pluriel « Avez-vous proclamé… ? » ou nommer Jésus
  rationale: Le témoin anglais présente une forme pouvant viser un seul interlocuteur, mais ne le nomme pas ; la traduction conserve cette indétermination.
- issue: Sens de « ceux qui dorment »
  choice: Conserver la métaphore littérale
  alternative: Traduire « les morts »
  rationale: La métaphore peut désigner les morts, mais l’explicitation résoudrait une tension que le texte laisse ouverte.
- issue: Croix qui parle
  choice: Attribuer directement la réponse à la croix
  alternative: Atténuer en parlant d’une voix venant de la croix
  rationale: Le passage affirme expressément qu’une réponse est entendue depuis la croix ; il ne convient pas d’en neutraliser le caractère extraordinaire.
translation_notes:
  register: Français international moderne, narratif et digne. Le passage reste provisoire, car le dossier fourni indique qu’une vérification directe du grec est encore attendue. La distinction entre « le ciel » et « les cieux », ainsi que l’image de « ceux qui dorment », a été conservée.
