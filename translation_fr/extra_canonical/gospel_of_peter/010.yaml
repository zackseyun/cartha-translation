    issue: Ajout de « le message » au v. 41
    rationale: 'Le témoin demande seulement : « Have you proclaimed to those who sleep? » L’ajout d’un complément, même signalé en note, précise ce que le texte laisse non exprimé.'
  - severity: low
    issue: « les deux premiers » au v. 40
    rationale: Le texte oppose « les deux » à « celui » sans les désigner comme premiers ; cette formulation française ajoute une notion d’ordre.
  - severity: low
    issue: Formulation du v. 42
    rationale: « Et l’on entendit la croix répondre » est intelligible, mais « une réponse se fit entendre depuis la croix » suit plus étroitement « a response was heard from the cross ».
