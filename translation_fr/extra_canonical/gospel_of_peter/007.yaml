  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: fr
  text: 'Alors les Juifs, les anciens et les prêtres, comprenant tout le mal qu’ils s’étaient fait, se mirent à prendre le deuil et à dire : « Malheur à nous à cause de nos péchés ! Le jugement et la fin de Jérusalem sont proches ! »


    Quant à moi, j’étais accablé avec mes compagnons et, profondément blessés, nous nous cachions, car ils nous recherchaient comme des malfaiteurs qui voulaient incendier le Temple. Par-dessus tout cela, nous jeûnions, assis dans le deuil, et nous pleurions nuit et jour jusqu’au sabbat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais du domaine public fourni ; la vérification directe du texte grec du Codex d’Akhmim reste à effectuer.
    reason: Le dossier indique explicitement que la révision dans la langue source est encore en attente ; la note rend transparente cette limite importante.
lexical_decisions:
- source_word: the Jews
  choice: les Juifs
  rationale: Reproduit sans l’atténuer la désignation collective transmise par le témoin anglais, tout en laissant le contexte préciser que les anciens et les prêtres sont aussi nommés.
- source_word: how much wrong they had done to themselves
  choice: tout le mal qu’ils s’étaient fait
  rationale: Conserve la valeur réfléchie du témoin, plutôt que de la transformer en mal commis contre une autre personne.
- source_word: Woe to our sins
  choice: Malheur à nous à cause de nos péchés
  rationale: Formulation française naturelle qui conserve à la fois la lamentation et son lien explicite avec les péchés.
- source_word: being wounded in mind
  choice: profondément blessés
  rationale: Rend l’atteinte intérieure dans un français courant et digne, sans introduire un diagnostic psychologique moderne.
- source_word: wrongdoers
  choice: malfaiteurs
  rationale: Terme naturel pour des personnes recherchées en raison d’un acte criminel présumé.
- source_word: temple
  choice: Temple
  rationale: La majuscule signale ici le sanctuaire de Jérusalem dans ce contexte historique précis.
- source_word: Sabbath
  choice: sabbat
  rationale: Terme français usuel pour le jour juif de repos.
theological_decisions:
- issue: Portée du jugement et de la fin de Jérusalem
  choice: Le jugement et la fin de Jérusalem sont proches
  alternative: Le jugement de Jérusalem et sa fin sont proches
  rationale: 'La formulation retenue préserve l’ambiguïté du témoin : « jugement » peut être absolu ou se rapporter à Jérusalem.'
- issue: Responsabilité collective exprimée par « les Juifs »
  choice: Conserver « les Juifs »
  alternative: Préciser « les autorités juives »
  rationale: Le témoin distingue expressément « les Juifs, les anciens et les prêtres » ; remplacer la première expression par « autorités » résoudrait indûment une difficulté textuelle et historique.
- issue: Identité du groupe qui recherche le narrateur
  choice: Conserver le pronom « ils »
  alternative: Nommer explicitement les autorités
  rationale: Le référent exact demeure implicite dans le passage fourni ; la traduction ne doit pas le déterminer davantage que le témoin.
translation_notes:
  register: Français international moderne, narratif et digne. Les numéros de versets sont omis conformément à la couche de consultation anglaise. La répétition du deuil et des pleurs est maintenue, tandis que la syntaxe est légèrement fluidifiée pour rester naturelle en français.
