base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: fr
  text: '(21) Alors ils retirèrent les clous des mains du Seigneur et le déposèrent à terre. Toute la terre trembla, et une grande crainte survint.


    (22) Puis le soleil se mit à briller, et l’on constata qu’il était la neuvième heure[a]. (23) Les Juifs se réjouirent et donnèrent à Joseph le corps du Seigneur[b] pour qu’il l’ensevelisse, puisqu’il avait vu tout le bien qu’il avait fait[c]. (24) Joseph prit le Seigneur, le lava, l’enveloppa dans une toile de lin et le déposa dans son propre tombeau, connu sous le nom de « jardin de Joseph »[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La neuvième heure correspond approximativement à quinze heures.
    reason: Aide le lecteur moderne à comprendre le système horaire antique sans le remplacer dans le texte.
  - marker: b
    text: 'Littéralement, selon le témoin anglais disponible : « son corps »; le référent est le Seigneur.'
    reason: Signale le possessif du témoin tout en permettant une formulation française claire.
  - marker: c
    text: 'Dans le témoin anglais disponible, les deux occurrences de « il » sont ambiguës : elles peuvent renvoyer à Joseph ou au Seigneur.'
    reason: Préserve explicitement une ambiguïté signalée par la couche anglaise auditée, en attendant l’examen direct du grec.
  - marker: d
    text: 'Ou : « le Jardin de Joseph ».'
    reason: L’expression peut être comprise comme un nom propre ou comme une désignation descriptive.
lexical_decisions:
- source_word: placed him on the earth
  choice: le déposèrent à terre
  rationale: Expression naturelle et digne qui conserve le contraste entre la croix et le sol, sans suggérer un geste brutal absent du témoin.
- source_word: the whole earth was shaken
  choice: Toute la terre trembla
  rationale: Conserve la portée potentiellement universelle de « whole earth » plutôt que de réduire le phénomène à un simple lieu.
- source_word: the ninth hour
  choice: la neuvième heure
  rationale: Maintient la manière antique de compter les heures; une note en donne l’équivalent approximatif moderne.
- source_word: wrapped him in linen
  choice: l’enveloppa dans une toile de lin
  rationale: Rendu concret et idiomatique, sans préciser une forme particulière de linceul que le témoin anglais n’impose pas.
- source_word: Joseph's Garden
  choice: jardin de Joseph
  rationale: Traduit le nom transmis de façon transparente tout en conservant son statut d’appellation.
theological_decisions:
- issue: Référent de « his body » au verset 23
  choice: le corps du Seigneur
  alternative: son corps
  rationale: Le français exige davantage de clarté que l’anglais; le contexte indique que le corps remis à Joseph est celui du Seigneur. Une note signale cependant que le témoin anglais emploie un possessif ambigu.
- issue: Référents des pronoms dans « since he had seen all the good he had done »
  choice: puisqu’il avait vu tout le bien qu’il avait fait
  alternative: car Joseph avait vu tout le bien que le Seigneur avait fait
  rationale: La traduction conserve volontairement l’ambiguïté du témoin disponible quant aux deux occurrences de « il », conformément à la tension du texte transmis.
- issue: Identification confessionnelle de « the Jews »
  choice: Les Juifs
  alternative: les autorités juives
  rationale: Le témoin disponible dit globalement « the Jews »; le restreindre aux autorités importerait une interprétation non établie par la base fournie.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe fluide sans archaïsmes inutiles. Projet provisoire fondé sur le témoin anglais public fourni; l’examen direct du grec du codex d’Akhmim reste nécessaire, particulièrement pour les pronoms du verset 23.
