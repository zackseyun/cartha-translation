  verdict: revise
  source_fidelity: 'Révision mineure nécessaire : au v. 24, « brought him into his own tomb » indique explicitement l’entrée dans le tombeau. « Le déposa dans » est possible, mais « l’amena dans » rend plus directement ce mouvement. Le reste suit fidèlement le témoin anglais fourni, tout en conservant l’ambiguïté pronominale du v. 23.'
  naturalness: Le français est naturel, narratif et d’un registre approprié. « Brilla » est légèrement plus direct et plus neutre que « se mit à briller », sans introduire d’idée inchoative.
  terminology: « Seigneur », « neuvième heure », « ensevelir », « toile de lin » et « tombeau » sont appropriés. « Les Juifs » reflète le libellé global du témoin sans restriction interprétative. L’appellation « jardin de Joseph » demeure prudemment traitée comme susceptible d’être un nom.
  issues:
  - severity: low
    issue: Mouvement explicite vers le tombeau au v. 24
    rationale: Le témoin dit « brought him into his own tomb ». Remplacer « le déposa dans » par « l’amena dans » conserve explicitement le déplacement à l’intérieur du tombeau.
  - severity: low
    issue: Nuance aspectuelle au v. 22
    rationale: « Se mit à briller » peut suggérer le commencement de l’action. « Le soleil brilla » correspond plus sobrement à « the sun shone ».
