base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: fr
  text: '(10) Ils amenèrent deux malfaiteurs et crucifièrent le Seigneur entre eux. Mais lui gardait le silence, comme s’il n’éprouvait aucune douleur. (11) Lorsqu’ils eurent dressé la croix, ils écrivirent : « Celui-ci est le roi d’Israël. » (12) Ils déposèrent ses vêtements devant lui, se les partagèrent et les tirèrent au sort.


    (13) Mais l’un de ces malfaiteurs leur fit des reproches : « Nous, nous souffrons ainsi à cause du mal que nous avons commis. Mais celui-ci, qui est devenu le Sauveur de l’humanité, quel mal vous a-t-il fait ? »


    (14) Ils se mirent en colère contre lui. Ils ordonnèrent qu’on ne lui brise pas les jambes, afin qu’il meure dans les tourments.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte ne précise pas sans ambiguïté à qui renvoie « lui » : il peut s’agir du malfaiteur qui vient de protester ou du Seigneur.'
    reason: Préserver l’ambiguïté du référent dans le témoin fourni au lieu de la résoudre tacitement.
lexical_decisions:
- source_word: wrongdoers
  choice: malfaiteurs
  rationale: Terme français naturel et digne pour des personnes ayant commis le mal, sans préciser au-delà du témoin fourni la nature de leur crime.
- source_word: remained silent / was silent
  choice: gardait le silence
  rationale: Rend un état continu pendant la crucifixion dans un français idiomatique.
- source_word: as if having no pain
  choice: comme s’il n’éprouvait aucune douleur
  rationale: Conserve la comparaison et n’affirme pas directement une absence réelle de douleur.
- source_word: set up the cross
  choice: dressé la croix
  rationale: Expression française courante qui décrit la mise en position verticale de la croix.
- source_word: Savior of humanity
  choice: Sauveur de l’humanité
  rationale: Préserve le titre théologique et la portée universelle de « humanity », avec la majuscule honorifique usuelle.
- source_word: die tortured / die under torture
  choice: meure dans les tourments
  rationale: Formulation naturelle et grave qui exprime une mort prolongée dans la souffrance sans ajouter un procédé précis.
theological_decisions:
- issue: Nature de l’absence apparente de douleur du Seigneur
  choice: « comme s’il n’éprouvait aucune douleur »
  alternative: « sans éprouver de douleur »
  rationale: La comparaison est maintenue afin de ne pas transformer l’apparence décrite en affirmation doctrinale sur la réalité de sa souffrance.
- issue: Référent de la personne dont les jambes ne doivent pas être brisées
  choice: Pronom singulier « lui », avec note signalant l’ambiguïté
  alternative: Nommer explicitement le malfaiteur ou le Seigneur
  rationale: Le passage enchaîne plusieurs référents masculins possibles. Il ne faut pas résoudre silencieusement cette tension à partir d’une interprétation théologique ou narrative.
- issue: « devenu le Sauveur de l’humanité »
  choice: Conserver « devenu »
  alternative: « étant le Sauveur de l’humanité »
  rationale: Le témoin fourni présente explicitement l’idée de devenir. La supprimer atténuerait une formulation théologiquement sensible avant la révision directe du grec.
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction reste proche de la syntaxe et des contrastes du témoin fourni tout en évitant les calques peu naturels. Projet provisoire : la consultation directe du texte grec du Codex d’Akhmim reste à effectuer.'
