  terminology: « Malfaiteurs » rend correctement le terme général désignant les criminels, sans préciser leur délit. « Le Seigneur » et « le Sauveur de l’humanité » préservent les titres du passage. « Devenu le Sauveur » conserve la formulation sensible du témoin, sans l’harmoniser. La note [a] conserve prudemment l’incertitude référentielle signalée dans le dossier de travail.
