review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire aux vv. 15, 16, 17 et 19. « Il leur est prescrit » rend plus idiomatiquement la formule grecque indiquant une prescription écrite. Au v. 16, « vinaigre » est le rendu usuel et précis de ὄξος, même si cette boisson est du vin aigre. Au v. 17, le singulier imagé « sur leur tête » est conservé. Au v. 19, la formulation française ne doit pas sélectionner grammaticalement « la Puissance » comme référent de ce qui fut élevé.
  naturalness: Le texte révisé reste sobre, digne et naturel en français international. « Du fiel avec du vinaigre » évite de faire du vinaigre un simple qualificatif de vin tout en conservant les deux éléments. « Après ces paroles, cela fut élevé » est volontairement inhabituel, mais c’est le moyen le plus transparent de préserver l’indétermination que maintient le témoin anglais.
  terminology: « Fiel », « péchés », « Puissance » et « voile du sanctuaire » sont conservés. La majuscule à « Puissance » signale la formulation personnifiée sans en imposer une lecture doctrinale. « Sanctuaire » convient au ναός dans ce contexte, tout en évitant de confondre automatiquement ce voile avec l’ensemble du complexe du Temple.
  issues:
  - severity: medium
    issue: Le v. 19 résout l’ambiguïté par un pronom féminin.
    rationale: « Elle fut élevée » impose grammaticalement « la Puissance » comme sujet, alors que le témoin anglais et sa note éditoriale maintiennent expressément l’antécédent de « it was taken up » indéterminé.
  - severity: low
    issue: Le v. 17 met l’image source au pluriel.
    rationale: « Sur leur propre tête » modifie le singulier figuratif de la formulation transmise (« on their head »). « Sur leur tête » préserve l’image collective sans la normaliser.
  - severity: low
    issue: La formule du v. 15 est peu idiomatique en français.
    rationale: « Car il leur est écrit » est un calque maladroit. « Car il leur est prescrit » rend clairement la règle écrite qui leur est applicable, sans ajouter d’interprétation.
  - severity: low
    issue: « Vin aigre » est moins précis que le terme habituel pour ὄξος.
    rationale: Le grec ὄξος désigne le vinaigre, ou vin devenu aigre; « vinaigre » est le rendu français exact et usuel dans ce contexte.
