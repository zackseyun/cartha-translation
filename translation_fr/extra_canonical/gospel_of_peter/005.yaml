base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: fr
  text: '(15) Il était midi, et les ténèbres s’étendaient sur toute la Judée. Ils étaient troublés et angoissés à l’idée que le soleil se couche alors qu’il était encore vivant. Car il leur est écrit : « Que le soleil ne se couche pas sur quelqu’un qui a été mis à mort. »[a] (16) L’un d’eux dit : « Donnez-lui à boire du fiel mêlé de vin aigre. » Ils firent le mélange et le lui donnèrent à boire. (17) Ainsi, ils accomplirent toutes choses et accumulèrent les péchés sur leur propre tête. (18) Beaucoup circulaient avec des lampes, croyant qu’il faisait nuit, et certains tombèrent.


    (19) Le Seigneur poussa un grand cri : « Ma Puissance, ô Puissance, tu m’as abandonné ! »[b] Après qu’il eut dit cela, elle fut élevée.[c] (20) À cette heure même, le voile du sanctuaire de Jérusalem se déchira en deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation de cette citation ne correspond pas mot pour mot à un passage biblique connu; elle rappelle toutefois l’interdiction de laisser pendant toute la nuit le corps d’un condamné (Deutéronome 21.22-23).
    reason: Signaler l’allusion probable sans présenter comme citation exacte ce qui ne l’est pas.
  - marker: b
    text: 'Littéralement : « Ma Puissance, la Puissance ». Le texte présente une forme distincte du cri rapporté en Matthieu 27.46 et Marc 15.34.'
    reason: Préserver et expliquer la formulation singulière du témoin.
  - marker: c
    text: 'Le texte ne précise pas clairement ce qui fut élevé : la « Puissance », le Seigneur, sa vie ou son esprit. La traduction conserve cette ambiguïté.'
    reason: Éviter une résolution doctrinale d’un référent incertain.
lexical_decisions:
- source_word: darkness held fast over all Judea
  choice: les ténèbres s’étendaient sur toute la Judée
  rationale: Rend naturellement l’emprise étendue des ténèbres sans ajouter de cause ni d’interprétation.
- source_word: bile with sour wine
  choice: du fiel mêlé de vin aigre
  rationale: « Fiel » conserve la formulation traditionnelle et la possible portée scripturaire; « vin aigre » reste plus transparent que « vinaigre » pour la boisson antique.
- source_word: accumulated the sins on their head
  choice: accumulèrent les péchés sur leur propre tête
  rationale: Préserve l’image sémitisante de responsabilité et de culpabilité retombant sur eux.
- source_word: My Power, the Power
  choice: Ma Puissance, ô Puissance
  rationale: Conserve la répétition inhabituelle et la personnification apparente sans les harmoniser avec les évangiles canoniques.
- source_word: veil of the temple
  choice: voile du sanctuaire
  rationale: « Sanctuaire » rend le lieu sacré intérieur visé par le vocabulaire du temple, tout en gardant Jérusalem explicitement dans la phrase.
theological_decisions:
- issue: Nature de ce qui est « élevé » au verset 19
  choice: elle fut élevée
  alternative: il fut enlevé / son esprit fut élevé
  rationale: Le référent demeure grammaticalement et théologiquement ambigu dans le témoin fourni. Le féminin peut renvoyer à « la Puissance » et évite d’identifier silencieusement le sujet à Jésus ou à son esprit.
- issue: Relation du cri à la parole de Jésus dans les évangiles canoniques
  choice: Ma Puissance, ô Puissance, tu m’as abandonné !
  alternative: Mon Dieu, mon Dieu, pourquoi m’as-tu abandonné ?
  rationale: La formulation propre à ce témoin est conservée; elle ne doit pas être harmonisée avec Marc 15.34 ou Matthieu 27.46.
- issue: Accomplissement de « toutes choses »
  choice: ils accomplirent toutes choses
  alternative: ils menèrent tout à son terme
  rationale: La formulation ouverte est maintenue afin de ne pas préciser s’il s’agit d’Écritures, d’actes annoncés ou de l’ensemble des événements.
translation_notes:
  register: Français international moderne, digne et lisible, avec une syntaxe narrative sobre. Le caractère ancien et parfois sémitisant du passage est conservé lorsqu’il porte une image ou une ambiguïté importante. Projet provisoire fondé sur le témoin anglais du domaine public fourni; une vérification directe du grec du codex d’Akhmim reste nécessaire.
