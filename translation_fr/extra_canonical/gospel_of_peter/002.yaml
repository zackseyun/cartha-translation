base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: fr
  text: '(3) Joseph se tenait là, lui qui était ami de Pilate et du Seigneur. Voyant qu’on allait crucifier le Seigneur,[a] il se rendit auprès de Pilate et lui demanda son corps afin de l’ensevelir. (4) Pilate envoya alors un message à Hérode pour lui demander le corps.


    (5) Hérode répondit : « Frère Pilate, même si personne ne nous l’avait demandé, nous l’aurions enseveli, puisque le sabbat va commencer. En effet, il est écrit dans la Loi : “Que le soleil ne se couche pas sur celui qui a été mis à mort.” »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, d’après le témoin anglais provisoire : « qu’on allait le crucifier ».'
    reason: Signale que la répétition de « le Seigneur » vise la clarté française et devra être vérifiée sur le grec.
  - marker: b
    text: Allusion à Deutéronome 21.22-23; la formulation citée ici diffère de celle du passage de la Loi.
    reason: Préserve la forme propre du récit sans donner l’impression d’une citation verbatim du texte canonique.
lexical_decisions:
- source_word: friend of Pilate and the Lord
  choice: ami de Pilate et du Seigneur
  rationale: Conserve la relation exprimée avec les deux personnes sans préciser davantage la nature de cette amitié.
- source_word: asked for the body ... for burial
  choice: lui demanda son corps afin de l’ensevelir
  rationale: « Ensevelir » exprime naturellement en français la finalité funéraire, sans ajouter de détails absents du témoin.
- source_word: Sabbath is beginning
  choice: le sabbat va commencer
  rationale: Formulation française actuelle qui garde l’idée d’un commencement imminent.
- source_word: one who’s been killed
  choice: celui qui a été mis à mort
  rationale: Rend explicitement une mort infligée, tout en gardant la formulation générale de la citation.
theological_decisions:
- issue: Référent du pronom dans « ils allaient le crucifier »
  choice: Répétition de « le Seigneur » dans le texte avec note
  alternative: Employer simplement « le »
  rationale: La répétition évite une ambiguïté pronominale peu naturelle en français, tout en signalant en note la forme plus concise du témoin de travail.
- issue: Rapport de la citation à la Loi
  choice: Conserver la citation sous la forme transmise par ce récit
  alternative: L’harmoniser explicitement avec Deutéronome 21.22-23
  rationale: La formulation ne correspond pas mot pour mot au texte canonique connu; elle ne doit pas être corrigée ou harmonisée silencieusement.
translation_notes:
  register: Français international moderne, sobre et narratif. Le titre « Seigneur » est conservé. « Frère Pilate » demeure littéral afin de ne pas déterminer si l’adresse exprime une parenté, une collégialité ou une formule diplomatique. Projet provisoire fondé sur le témoin anglais public fourni; une vérification directe du grec du codex d’Akhmîm reste nécessaire.
