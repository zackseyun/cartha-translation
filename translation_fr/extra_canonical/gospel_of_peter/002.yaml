review_pass:
  verdict: revise
  source_fidelity: 'La structure narrative et les termes principaux suivent fidèlement le témoin fourni : Joseph est l’ami de Pilate et du Seigneur, demande le corps pour l’ensevelir, et Hérode invoque le commencement du sabbat et la Loi. Toutefois, « personne ne nous l’avait demandé » modifie le sens de « someone hadn’t asked for him » : le français fait demander Jésus à Hérode et à Pilate, tandis que le témoin dit qu’aucune personne ne l’avait réclamé. « Le sabbat commence lui aussi » conserve en outre le « also » du témoin.'
  naturalness: Le français est moderne, clair et de registre narratif sobre. « Se rendit auprès de Pilate », « ensevelir » et « mis à mort » conviennent. La répétition de « le Seigneur » dans la première phrase est naturelle et évite une référence pronominale moins nette.
  terminology: « Seigneur », « sabbat », « Loi » et « ensevelir » sont cohérents et ne surinterprètent pas le passage. « Frère Pilate » est conservé littéralement. La note a, qui décrit une décision rédactionnelle provisoire à partir d’un témoin anglais, n’est pas nécessaire dans le texte publié ; elle peut être supprimée sans perte de sens.
  issues:
  - severity: medium
    issue: « même si personne ne nous l’avait demandé »
    rationale: 'Cette formulation change la construction et le sens : elle implique que personne n’avait demandé Jésus « à nous ». Le témoin dit plutôt que personne ne l’avait demandé ou réclamé. « Même si personne ne l’avait réclamé » restitue cette relation sans ajouter de destinataire.'
  - severity: low
    issue: Omission de « aussi » dans « puisque le sabbat va commencer »
    rationale: Le témoin comporte « since also Sabbath is beginning ». « Puisque le sabbat commence lui aussi » préserve cet élément tout en restant idiomatique.
  - severity: low
    issue: Note a rédactionnelle
    rationale: La note ne renseigne pas le lecteur sur une difficulté textuelle du passage, mais sur le processus de brouillon et le témoin anglais provisoire. La répétition explicite de « le Seigneur » est suffisamment transparente sans note.
  revised_text: '(3) Joseph se tenait là, lui qui était ami de Pilate et du Seigneur. Voyant qu’on allait crucifier le Seigneur, il se rendit auprès de Pilate et lui demanda le corps du Seigneur afin de l’ensevelir. (4) Pilate envoya alors un message à Hérode pour lui demander le corps.


    (5) Hérode répondit : « Frère Pilate, même si personne ne l’avait réclamé, nous l’aurions enseveli, puisque le sabbat commence lui aussi. En effet, il est écrit dans la Loi : “Que le soleil ne se couche pas sur celui qui a été mis à mort.” »[a]'
  revised_footnotes:
  - marker: a
    text: Allusion à Deutéronome 21.22-23 ; la formulation citée ici diffère de celle du passage de la Loi.
    reason: Indique l’allusion sans harmoniser ni présenter la formulation du récit comme une citation verbatim de Deutéronome.
  revision_rationale: La révision corrige le changement de sens introduit par « ne nous l’avait demandé », rétablit l’élément « aussi » relatif au sabbat, et retire une note de processus rédactionnel qui n’est pas une note de traduction nécessaire. Le reste du texte est conservé, y compris la formulation propre de la citation légale et l’adresse ambiguë « Frère Pilate ».
