review_pass:
  verdict: revise
  source_fidelity: 'Une correction est nécessaire au v. 46 : la seconde proposition du grec du Codex d’Akhmîm est généralement comprise comme « c’est vous qui l’avez voulu / décidé », et non comme « cela est clair pour nous ». Le reste rend fidèlement la séquence narrative, l’indétermination de « un homme », le départ nocturne et l’ordre de silence.'
  naturalness: Le français est clair, narratif et d’un registre approprié. « Profondément bouleversés » rend bien la détresse. La ponctuation du discours direct et les enchaînements sont naturels.
  terminology: « Tombeau », « centurion », « Fils de Dieu », « innocent du sang » et « peuple juif » sont appropriés. « Peuple juif » traduit la désignation collective du récit sans identifier ni étendre indûment la responsabilité à l’ensemble des Juifs.
  issues:
  - severity: high
    issue: Sens de la dernière proposition de 46
    rationale: Le texte grec transmis porte vraisemblablement ὑμεῖς δὲ τοῦτο ἐβουλήθητε, soit « mais c’est vous qui l’avez voulu/décidé ». La formulation du témoin anglais (« and this is clear to us »), reprise dans le brouillon, ne correspond pas à cette lecture et modifie l’attribution narrative de la décision.
  revised_text: '(43) Alors ces hommes décidèrent ensemble d’aller rapporter ces faits à Pilate. (44) Tandis qu’ils réfléchissaient encore, on vit de nouveau les cieux s’ouvrir, et un homme descendit et entra dans le tombeau. (45) À cette vue, ceux qui étaient avec le centurion quittèrent le tombeau qu’ils gardaient et se rendirent en hâte, de nuit, auprès de Pilate. Profondément bouleversés, ils lui racontèrent tout ce qu’ils avaient vu et dirent : « Vraiment, il était le Fils de Dieu ! »


    (46) Pilate répondit : « Je suis innocent du sang du Fils de Dieu ; c’est vous qui l’avez voulu. »


    (47) Alors tous ceux qui étaient venus le supplièrent avec insistance d’ordonner au centurion et aux soldats de ne rien dire de ce qu’ils avaient vu. (48) « Il vaut mieux pour nous, dirent-ils, nous rendre coupables d’un grand péché devant Dieu que de tomber entre les mains du peuple juif et d’être lapidés. » (49) Pilate ordonna donc au centurion et aux soldats de ne rien dire.'
  revised_footnotes: []
  revision_rationale: 'La révision se limite au v. 46 afin de rétablir le sens de la clause grecque attestée : Pilate rejette la responsabilité de la décision sur ses interlocuteurs. Aucune note n’est requise : le français conserve l’ambiguïté quant à l’identité précise du groupe désigné par « vous » et par « tous ceux qui étaient venus ».'
