base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: fr
  text: '(43) Alors ces hommes décidèrent ensemble d’aller rapporter ces faits à Pilate. (44) Tandis qu’ils réfléchissaient encore, on vit de nouveau les cieux s’ouvrir, et un homme descendit et entra dans le tombeau. (45) À cette vue, ceux qui étaient avec le centurion quittèrent le tombeau qu’ils gardaient et se rendirent en hâte, de nuit, auprès de Pilate. Profondément bouleversés, ils lui racontèrent tout ce qu’ils avaient vu et dirent : « Vraiment, il était le Fils de Dieu ! »


    (46) Pilate répondit : « Je suis innocent du sang du Fils de Dieu, et cela est clair pour nous. »


    (47) Alors tous ceux qui étaient venus le supplièrent avec insistance d’ordonner au centurion et aux soldats de ne rien dire de ce qu’ils avaient vu. (48) « Il vaut mieux pour nous, dirent-ils, nous rendre coupables d’un grand péché devant Dieu que de tomber entre les mains du peuple juif et d’être lapidés. » (49) Pilate ordonna donc au centurion et aux soldats de ne rien dire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: report these things
  choice: rapporter ces faits
  rationale: « Ces faits » désigne naturellement en français les événements observés, sans ajouter d’interprétation.
- source_word: a certain man
  choice: un homme
  rationale: Le français naturel n’exige pas ici « un certain homme », qui pourrait suggérer une personne connue mais non nommée; l’indétermination demeure avec l’article indéfini.
- source_word: grave / tomb
  choice: tombeau
  rationale: « Tombeau » convient au contexte funéraire antique et permet de garder un terme uniforme.
- source_word: greatly distressed
  choice: profondément bouleversés
  rationale: Cette expression rend une forte détresse intérieure dans un français actuel et digne.
- source_word: clean of the blood
  choice: innocent du sang
  rationale: La formule conserve l’idée sémitique de non-responsabilité dans la mort, tout en restant intelligible en français.
- source_word: Jewish people
  choice: peuple juif
  rationale: Cette désignation collective suit le témoin fourni sans généraliser au-delà des acteurs du récit.
theological_decisions:
- issue: Confession concernant Jésus
  choice: « Vraiment, il était le Fils de Dieu ! »
  alternative: « Vraiment, il est le Fils de Dieu ! »
  rationale: Le passé correspond au témoin anglais fourni et conserve la perspective narrative des soldats sans harmonisation avec un autre évangile.
- issue: Déclaration d’innocence de Pilate
  choice: « Je suis innocent du sang du Fils de Dieu »
  alternative: « Je suis pur du sang du Fils de Dieu »
  rationale: « Innocent du sang » exprime clairement la revendication de non-culpabilité de Pilate, sans valider théologiquement cette revendication.
- issue: Référent de « tous ceux qui étaient venus »
  choice: conserver la désignation générale
  alternative: identifier explicitement les chefs ou les autorités
  rationale: Le passage fourni ne nomme pas ici le groupe; préciser son identité résoudrait indûment une ambiguïté du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte reste provisoire puisque le dossier indique que la vérification directe du grec du codex d’Akhmim est encore en attente. Aucun marqueur de note n’est ajouté, puisqu’aucune note de bas de page n’est nécessaire dans ce brouillon.
