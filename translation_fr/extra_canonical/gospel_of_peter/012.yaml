review_pass:
  verdict: revise
  source_fidelity: 'Le sens du témoin anglais est globalement bien rendu : la crainte des femmes, la colère attribuée aux Juifs dans ce récit, la pierre, et le caractère non précisé des gestes funéraires sont préservés. Une légère correction est requise en v. 52 : « peut-être pourrons-nous » transforme la possibilité envisagée (« perhaps ... might ») en futur plus assuré.'
  naturalness: Le français est fluide et de registre approprié. Cependant, « mener deuil » n’est pas une collocation naturelle en français moderne dans ce contexte. « Se lamenter » rend naturellement le second terme du doublet, sans réduire le sens à la seule période sociale du deuil.
  terminology: « jour du Seigneur », « Marie de Magdala », « tombeau », « les Juifs » et « accomplir nos devoirs » sont des choix recevables et cohérents avec le témoin fourni. Aucun ajout confessionnel ou rituel n’est introduit.
  issues:
  - severity: medium
    issue: « mener deuil »
    rationale: Cette expression est peu idiomatique ici. Le doublet « pleurer et se lamenter » restitue plus naturellement « weep and mourn » et conserve l’idée de lamentation funèbre.
  - severity: low
    issue: « peut-être pourrons-nous le faire maintenant »
    rationale: Le futur indicatif rend l’action relativement plus certaine que la possibilité prudente exprimée dans le témoin. « peut-être pourrions-nous encore le faire maintenant » préserve mieux cette modalité.
  revised_text: '(50) À l’aube du jour du Seigneur, Marie de Magdala, une disciple du Seigneur, n’avait pas accompli auprès du tombeau du Seigneur ce que les femmes ont coutume de faire pour ceux qu’elles aiment et qui sont morts, car elle avait peur des Juifs, qui étaient enflammés de colère.


    (51) Elle prit ses amies avec elle et se rendit au tombeau où il avait été déposé. (52) Elles avaient peur que les Juifs ne les voient et se disaient : « Si, le jour où il a été crucifié, nous n’avons pas pu pleurer et nous lamenter, peut-être pourrions-nous encore le faire maintenant auprès de son tombeau. (53) Mais qui roulera pour nous la pierre placée à l’entrée du tombeau, afin que nous puissions entrer, nous asseoir auprès de lui et accomplir nos devoirs ? (54) Car la pierre est grande, et nous avons peur que quelqu’un nous voie. Et si nous ne le pouvons pas, déposons au moins à l’entrée ce que nous apportons en souvenir de lui ; puis nous pleurerons et nous lamenterons jusqu’à ce que nous retournions chez nous. »'
  revised_footnotes: []
  revision_rationale: 'Révision limitée à deux points : remplacement de l’expression peu naturelle « mener deuil » par « se lamenter », et restitution d’une possibilité prudente en v. 52 plutôt que d’un futur. Le reste du projet conserve adéquatement les ambiguïtés et le vocabulaire général du témoin. La revue directe du grec du codex d’Akhmîm reste nécessaire, puisque le dossier ne fournit ici qu’un témoin anglais.'
