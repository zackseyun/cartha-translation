base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: fr
  text: '(50) À l’aube du jour du Seigneur, Marie de Magdala, une disciple du Seigneur, n’avait pas accompli auprès du tombeau du Seigneur ce que les femmes ont coutume de faire pour ceux qu’elles aiment et qui sont morts, car elle avait peur des Juifs, qui étaient enflammés de colère.


    (51) Elle prit ses amies avec elle et se rendit au tombeau où il avait été déposé. (52) Elles avaient peur que les Juifs ne les voient et se disaient : « Si, le jour où il a été crucifié, nous n’avons pas pu pleurer et mener deuil, peut-être pourrons-nous le faire maintenant auprès de son tombeau. (53) Mais qui roulera pour nous la pierre placée à l’entrée du tombeau, afin que nous puissions entrer, nous asseoir auprès de lui et accomplir nos devoirs ? (54) Car la pierre est grande, et nous avons peur que quelqu’un nous voie. Et si nous ne le pouvons pas, déposons au moins à l’entrée ce que nous apportons en souvenir de lui ; puis nous pleurerons et mènerons deuil jusqu’à ce que nous retournions chez nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Lord’s day
  choice: jour du Seigneur
  rationale: Expression française naturelle qui conserve la désignation ancienne sans la remplacer explicitement par « dimanche ».
- source_word: grave
  choice: tombeau
  rationale: « Tombeau » convient au sépulcre fermé par une grande pierre et assure la cohérence du passage.
- source_word: friends
  choice: amies
  rationale: Le contexte et les pronoms féminins désignent les femmes qui accompagnent Marie.
- source_word: weep and mourn
  choice: pleurer et mener deuil
  rationale: Le doublet préserve la distinction entre les pleurs et les pratiques de lamentation funèbre.
- source_word: perform our duties
  choice: accomplir nos devoirs
  rationale: Maintient le caractère volontairement général des gestes funéraires sans préciser des rites non nommés.
- source_word: at the door / entrance
  choice: à l’entrée
  rationale: Formulation idiomatique en français pour l’ouverture du tombeau, sans suggérer une porte articulée.
theological_decisions:
- issue: Désignation du premier jour comme « jour du Seigneur »
  choice: jour du Seigneur
  alternative: dimanche
  rationale: La formulation conserve le titre théologique et l’expression ancienne plutôt que d’en imposer l’identification calendaire.
- issue: Responsabilité collective exprimée par « les Juifs »
  choice: les Juifs
  alternative: les autorités juives
  rationale: Le témoin fourni emploie une désignation générale. La restreindre aux autorités résoudrait une difficulté historique et rhétorique que le texte laisse intacte.
- issue: Statut de Marie de Magdala
  choice: une disciple du Seigneur
  alternative: la disciple du Seigneur
  rationale: L’indéfini reflète son appartenance au groupe des disciples sans lui attribuer un statut exclusif.
- issue: Nature des gestes funéraires
  choice: accomplir nos devoirs
  alternative: accomplir les rites funéraires
  rationale: Le texte ne détaille pas ces actes ; une formulation générale évite d’importer une pratique précise.
translation_notes:
  register: 'Français international moderne, digne et lisible. La syntaxe a été légèrement réorganisée pour la clarté, tout en conservant les répétitions, la crainte des femmes et l’indétermination des devoirs funéraires. Projet nécessairement provisoire : le dossier fourni indique qu’une vérification directe du grec du codex d’Akhmîm reste à effectuer.'
