  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: fr
  text: (58) C’était le dernier jour des pains sans levain. Beaucoup de gens partaient et rentraient chez eux, car la fête était terminée. (59) Mais nous, les douze disciples du Seigneur, nous pleurions et étions dans le deuil. Chacun de nous, affligé par ce qui était arrivé, rentra chez lui. (60) Quant à moi, Simon Pierre, je pris nos filets avec mon frère André, et nous partîmes vers la mer. Lévi, fils d’Alphée, était avec nous, lui que le Seigneur…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit s’interrompt ici au milieu de la phrase.
    reason: Signaler que les points de suspension représentent la fin lacunaire du manuscrit, et non une omission éditoriale ordinaire.
lexical_decisions:
- source_word: Unleavened Bread
  choice: pains sans levain
  rationale: Expression française courante qui conserve la référence à la fête juive sans ajouter une précision absente du témoin fourni.
- source_word: weeping and grieving
  choice: nous pleurions et étions dans le deuil
  rationale: Maintient les deux aspects du témoin anglais, les pleurs et l’affliction liée à la mort, sans les réduire à un seul verbe.
- source_word: sea
  choice: mer
  rationale: Reproduit sobrement le terme du témoin sans identifier explicitement le plan d’eau, puisque la révision directe du grec reste à faire.
- source_word: nets
  choice: filets
  rationale: Terme naturel dans le contexte de pêche et conforme au pluriel du témoin.
theological_decisions:
- issue: Désignation du groupe comme « les douze disciples du Seigneur »
  choice: les douze disciples du Seigneur
  alternative: nous, les Douze du Seigneur
  rationale: Conserve la formulation explicite du témoin et évite de transformer « douze » en titre technique ou d’harmoniser le décompte avec d’autres récits.
- issue: Lien syntaxique de la proposition finale inachevée
  choice: lui que le Seigneur…
  alternative: que le Seigneur…
  rationale: Préserve l’inachèvement et l’ambiguïté du manuscrit sans compléter l’action du Seigneur ni reconstruire la phrase perdue.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le récit reste simple, avec une légère solennité narrative. Cette version est nécessairement provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du grec étant encore en attente.'
