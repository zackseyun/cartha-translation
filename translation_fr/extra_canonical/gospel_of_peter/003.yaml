    (9) Parmi ceux qui se tenaient là, les uns lui crachaient au visage et les autres le giflaient. D’autres le frappaient[a] avec un roseau, et certains le fouettaient en disant : « Rendons cet honneur au Fils de Dieu ! »'
  to: 'Et il le livra au peuple avant le premier jour de leur fête des Pains sans levain. (6) Ceux qui s’étaient emparés du Seigneur couraient en le bousculant et disaient : « Traînons le Fils de Dieu, puisque nous avons pouvoir sur lui ! »


    (7) Ils le revêtirent de pourpre et le firent asseoir sur le siège du jugement, en disant : « Juge avec justice, roi d’Israël ! » (8) L’un d’eux apporta une couronne d’épines et la posa sur la tête du Seigneur.


    (9) Parmi ceux qui se tenaient là, les uns lui crachaient au visage et les autres le giflaient. D’autres le piquaient avec un roseau, et certains le fouettaient en disant : « Honorons ainsi le Fils de Dieu ! »'
