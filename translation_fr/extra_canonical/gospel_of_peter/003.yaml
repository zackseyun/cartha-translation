    rationale: Le verbe doit rendre une action de piquer/percer plutôt qu’un simple coup. La note proposée reconnaît justement cette valeur, ce qui indique que la correction doit être apportée au texte principal.
  - severity: low
    issue: « Rendons cet honneur au Fils de Dieu ! » ne reproduit pas explicitement l’idée d’« honorer » le Fils de Dieu.
    rationale: Le témoin formule une invitation ironique à honorer le Fils de Dieu « ainsi/avec cet honneur ». Une formulation française qui conserve ce verbe est plus fidèle.
