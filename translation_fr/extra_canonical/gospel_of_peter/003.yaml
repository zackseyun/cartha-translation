base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/003.yaml
  text: 'And he handed him over to the people before the first day of their festival of the Unleavened Bread. (6) And those having taken the Lord were running, pushing him, and saying, “Let’s drag the Son of God, having authority over him!”


    (7) And they were clothing him with purple, and sat him on the seat of judgment, saying, “Judge justly, king of Israel!” (8) And one of them brought a thorn crown and placed it on the Lord’s head.


    (9) And other bystanders were spitting in his face, and others slapped his cheeks. Others were piercing him with a reed, and some were scourging him, saying, “With this honor, let’s honor the Son of God!”'
translation:
  language: fr
  text: 'Et il le livra au peuple avant le premier jour de leur fête des Pains sans levain. (6) Ceux qui s’étaient emparés du Seigneur couraient en le bousculant et disaient : « Traînons le Fils de Dieu, puisque nous avons pouvoir sur lui ! »


    (7) Ils le revêtirent de pourpre et le firent asseoir sur le siège du jugement, en disant : « Juge avec justice, roi d’Israël ! » (8) L’un d’eux apporta une couronne d’épines et la posa sur la tête du Seigneur.


    (9) Parmi ceux qui se tenaient là, les uns lui crachaient au visage et les autres le giflaient. D’autres le piquaient avec un roseau, et certains le fouettaient en disant : « Honorons ainsi le Fils de Dieu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festival of the Unleavened Bread
  choice: fête des Pains sans levain
  rationale: Expression française naturelle qui conserve le nom traditionnel de la fête juive et le pluriel du témoin.
- source_word: having authority over him
  choice: puisque nous avons pouvoir sur lui
  rationale: Conserve explicitement l’affirmation ironique de domination sans en préciser davantage le sens.
- source_word: purple
  choice: pourpre
  rationale: Terme traditionnel et précis pour le vêtement ou tissu royal évoqué, sans ajouter la nature exacte du vêtement.
- source_word: seat of judgment
  choice: siège du jugement
  rationale: Rendu formel qui maintient l’ambiguïté entre siège judiciaire et tribunal.
- source_word: Judge justly
  choice: Juge avec justice
  rationale: Reproduit l’impératif et l’ironie de la scène dans un français clair et digne.
- source_word: piercing
  choice: frappaient
  rationale: Le témoin anglais peut évoquer le fait de piquer ou de frapper avec le roseau; le choix principal privilégie une action idiomatique tout en signalant l’alternative en note.
- source_word: With this honor, let's honor
  choice: Rendons cet honneur
  rationale: Restitue l’ironie cruelle de l’acclamation sans lourde répétition peu naturelle en français.
theological_decisions:
- issue: Titre « Fils de Dieu » dans les paroles des bourreaux
  choice: Conserver « Fils de Dieu » sans explication
  alternative: Marquer explicitement qu’il s’agit d’une raillerie
  rationale: Le contexte fait entendre l’ironie, mais le texte laisse subsister la tension entre moquerie humaine et confession involontaire.
- issue: Pouvoir exercé sur Jésus
  choice: « nous avons pouvoir sur lui »
  alternative: « il est en notre pouvoir »
  rationale: La formulation retenue préserve l’affirmation provocatrice d’autorité sans résoudre sa portée théologique.
- issue: Jésus placé sur le siège du jugement
  choice: Conserver l’image de Jésus assis et sommé de juger
  alternative: Interpréter la scène comme sa comparution devant un tribunal
  rationale: Le témoin présente une inversion ironique des rôles; il ne faut pas l’aplanir en une scène judiciaire ordinaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les numéros de section du témoin sont conservés. Le texte reste provisoire, car le dossier fourni indique qu’une vérification directe de la source grecque du codex d’Akhmîm est encore attendue; les décisions évitent donc de surinterpréter les formulations du témoin anglais.
