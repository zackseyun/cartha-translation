  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: fr
  text: 'Et je dis : « Oui, mon seigneur. » Il me répondit : « J’ai été envoyé pour te montrer trois voies et te présenter trois comparaisons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus meus
  choice: mon seigneur
  rationale: Conserve l’adresse respectueuse du latin sans identifier explicitement l’interlocuteur à Dieu.
- source_word: tres uias
  choice: trois voies
  rationale: « Voies » garde le sens concret ou figuré de uias et préserve l’ambiguïté de l’image.
- source_word: tres similitudines
  choice: trois comparaisons
  rationale: « Comparaisons » rend naturellement similitudines dans ce contexte d’énigmes ou d’analogies proposées à Esdras.
- source_word: proponere coram te
  choice: te présenter
  rationale: Formulation française naturelle qui rend l’idée de placer ou d’exposer devant quelqu’un.
theological_decisions:
- issue: Identité de celui qui envoie l’interlocuteur
  choice: Maintenir le passif « J’ai été envoyé »
  alternative: Expliciter « Dieu m’a envoyé »
  rationale: Le latin ne nomme pas l’agent; le passif préserve cette réserve et évite une explicitation interprétative.
translation_notes:
  register: Français moderne, clair et digne. La répétition sémitisante « répondit et dit » est allégée en « répondit » sans perte de contenu. La ponctuation distingue nettement les deux prises de parole.
