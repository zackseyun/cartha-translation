  text: mensurauit tempora, et numero numerauit tempora, et non commouebit nec excitabit usque dum impleatur praedicta
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/037.yaml
  text: and measured the times[a], and numbered the times, and he will not move or stir them until what was foretold is fulfilled.’”
translation:
  language: fr
  text: Il a mesuré les temps et les a dénombrés ; il ne les remuera ni ne les ébranlera jusqu’à ce que s’accomplisse ce qui a été prédit[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, avec un nom sous-entendu : « jusqu’à ce que s’accomplisse la mesure annoncée d’avance ».'
    reason: Le latin praedicta (« ce qui a été prédit/annoncé d’avance ») est formellement ambigu ; il peut aussi être compris comme renvoyant à une mesure ou limite sous-entendue.
lexical_decisions:
- source_word: mensurauit tempora
  choice: il a mesuré les temps
  rationale: Rend directement le parfait latin et le pluriel « tempora », dans un français naturel et solennel.
- source_word: numero numerauit tempora
  choice: en a fixé le nombre
  rationale: Exprime l’idée d’un dénombrement déterminé tout en évitant la lourdeur tautologique de « les a comptés par le nombre ».
- source_word: non commouebit nec excitabit
  choice: il ne les fera ni avancer ni se mettre en mouvement
  rationale: Conserve les deux verbes coordonnés et leur idée de mise en mouvement, avec « les » renvoyant naturellement aux temps.
- source_word: praedicta
  choice: ce qui a été annoncé
  rationale: Le neutre latin peut désigner ce qui a été prédit ou annoncé auparavant, sans qu’il soit nécessaire d’ajouter explicitement « mesure » dans le texte.
theological_decisions:
- issue: La détermination divine des temps
  choice: « mesuré les temps » et « en a fixé le nombre »
  alternative: « mesuré les temps » et « compté les temps »
  rationale: La formulation retenue fait entendre que les temps ont une limite déterminée, sans préciser davantage la manière dont Dieu gouverne leur déroulement.
- issue: Référent implicite des verbes commouebit et excitabit
  choice: Le pronom « les » renvoie aux temps
  alternative: Laisser les verbes sans complément explicite
  rationale: Le français exige ici un complément plus clair ; « les temps » est l’antécédent immédiat et correspond à la lecture contextuelle la plus naturelle.
translation_notes:
  register: Français moderne, digne et accessible, avec une cadence apocalyptique sobre. La répétition latine autour du nombre est allégée sans perdre l’idée d’une quantité fixée.
