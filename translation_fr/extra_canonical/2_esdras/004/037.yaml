  source_fidelity: La première proposition rend bien mensurauit tempora. En revanche, « en a fixé le nombre » explicite l’idée de détermination plutôt que de conserver l’acte de dénombrer exprimé par numero numerauit tempora. « Ni avancer ni se mettre en mouvement » introduit une nuance d’avancement et une construction causative lourde qui ne correspondent pas directement aux deux verbes latins. « Ce qui a été annoncé » est possible pour praedicta, mais « prédit » conserve mieux la valeur prospective de praedicta.
  naturalness: Le français est globalement clair, mais « il ne les fera ni avancer ni se mettre en mouvement » est peu idiomatique et redondant. Une paire verbale simple et parallèle donne une cadence plus naturelle.
  terminology: « Les temps » convient pour tempora. « Prédit » rend plus précisément praedicta sans imposer que le référent sous-entendu soit une « mesure ». La note peut signaler sobrement l’analyse alternative qui sous-entend une mesure ou une limite annoncée d’avance.
