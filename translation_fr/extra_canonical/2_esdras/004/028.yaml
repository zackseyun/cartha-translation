source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Seminatum est enim malum, de quo me interrogas de eo, et necdum uenit destrictio ipsius. Si ergo non messum fuerit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/028.yaml
  text: For the evil about which you ask me has been sown[a], and its destruction has not yet come. If therefore it is not reaped,
translation:
  language: fr
  text: Car le mal au sujet duquel tu m’interroges a été semé, et sa moisson n’est pas encore venue. Si donc il n’a pas été moissonné,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Seminatum est … malum
  choice: le mal … a été semé
  rationale: Conserve l’image agricole explicite qui structure le passage.
- source_word: destrictio ipsius
  choice: le temps de sa moisson
  rationale: Dans ce contexte de semailles et de moisson, « destrictio » désigne la récolte plutôt que la destruction; « le temps de » rend idiomatiquement l’idée que cette moisson n’est pas encore arrivée.
- source_word: messum fuerit
  choice: il n’est pas moissonné
  rationale: Rend le verbe latin lié à la moisson et maintient l’enchaînement métaphorique.
theological_decisions:
- issue: Rapport entre le mal présent et son aboutissement futur
  choice: Préserver l’image du mal semé dont la moisson n’est pas encore venue
  alternative: Comprendre « destrictio » comme la destruction du mal
  rationale: La suite lexicale « semé — moisson — moissonné » favorise nettement la métaphore agricole sans préciser ici la nature théologique de son accomplissement.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement reflète l’adresse singulière du dialogue. La phrase reste suspendue à la fin, conformément au latin, puisque la condition se poursuit au verset suivant.
