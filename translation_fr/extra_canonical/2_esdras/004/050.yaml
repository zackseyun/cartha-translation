source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixit ad me: cogita tibi. sicut enim crescit pluvia amplius quam guttae, et ignis amplius quam fumus, sic superabundavit quae transivit mensura, superaverunt autem guttae et fumus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/050.yaml
  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
translation:
  language: fr
  text: 'Il me dit : « Réfléchis : de même que la pluie est plus abondante que les gouttes, et le feu plus grand que la fumée, de même la mesure écoulée a été bien plus grande[a] ; mais les gouttes et la fumée restent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ce qui s’est écoulé a largement dépassé la mesure » ; la construction latine de cette proposition permet plusieurs analyses grammaticales.'
    reason: La construction « superabundavit quae transivit mensura » est syntaxiquement ambiguë.
lexical_decisions:
- source_word: cogita tibi
  choice: Réfléchis
  rationale: Rend naturellement l’exhortation latine à considérer la question par soi-même, sans le calque lourd « réfléchis pour toi-même ».
- source_word: crescit … amplius
  choice: est plus abondante
  rationale: Dans cette comparaison de quantités, le latin exprime une supériorité d’ampleur plutôt qu’une croissance en cours.
- source_word: quae transivit mensura
  choice: la mesure écoulée
  rationale: Conserve l’image temporelle d’une portion ou mesure déjà passée, malgré la construction latine irrégulière.
- source_word: superaverunt
  choice: restent
  rationale: Superare peut ici signifier « rester, subsister » ; ce sens correspond au contraste entre la grande portion écoulée et le faible reste figuré par les gouttes et la fumée.
theological_decisions:
- issue: Rapport entre le temps écoulé et le temps restant
  choice: La mesure écoulée est présentée comme bien plus grande, tandis qu’un faible reste subsiste.
  alternative: Ce qui s’est écoulé a largement dépassé la mesure.
  rationale: Le contexte comparatif et la reprise des gouttes et de la fumée favorisent une opposition entre la majeure partie déjà écoulée et la petite partie restante. La syntaxe latine demeure toutefois ambiguë, d’où la note.
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde les images surprenantes de la pluie opposée aux gouttes et du feu opposé à la fumée, sans les expliciter dans le corps du texte.
