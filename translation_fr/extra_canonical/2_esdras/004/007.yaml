source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: fr
  text: 'Et il me dit : « Si je t’avais interrogé en ces termes : “Combien y a-t-il de demeures au cœur de la mer ? Combien de sources à l’origine de l’abîme ? Combien de chemins au-dessus du firmament ? Quelles sont les issues du paradis ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: habitationes
  choice: demeures
  rationale: Rend directement les lieux d’habitation, tout en conservant l’étrangeté de l’image dans le cœur de la mer.
- source_word: in corde maris
  choice: au cœur de la mer
  rationale: Expression française naturelle qui préserve la métaphore spatiale du latin.
- source_word: uenae
  choice: sources
  rationale: Dans ce contexte cosmologique, le latin « veines » désigne vraisemblablement les conduits ou jaillissements d’eau; « sources » est clair sans alourdir le texte.
- source_word: in principio abyssi
  choice: à l’origine de l’abîme
  rationale: Conserve la polysémie de « principium », qui peut évoquer le commencement aussi bien que le point d’origine.
- source_word: uiae
  choice: chemins
  rationale: Équivalent concret et courant qui maintient l’image de voies situées au-dessus du firmament.
- source_word: firmamentum
  choice: firmament
  rationale: Terme cosmologique biblique établi en français et fidèle au latin.
- source_word: exitus paradisi
  choice: issues du paradis
  rationale: « Issues » préserve l’idée de sorties ou de passages sans préciser arbitrairement leur nature.
theological_decisions:
- issue: Représentation de la cosmologie ancienne
  choice: Conserver « abîme », « firmament » et « paradis » sans modernisation explicative
  alternative: Remplacer ces termes par des descriptions cosmologiques modernes ou paraphrastiques
  rationale: Le verset formule des énigmes à partir de son propre cadre cosmologique; le traduire tel quel préserve sa tension et son imaginaire.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative répétée du latin est conservée. Le conditionnel passé « si je t’avais interrogé » exprime naturellement l’hypothèse irréelle introduite par « si eram interrogans ». Aucun marqueur de note n’est requis.
