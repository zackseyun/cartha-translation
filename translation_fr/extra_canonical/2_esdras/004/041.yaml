  text: And I said[a], “It cannot, Lord.” And he said to me, “In Hades the storehouses
translation:
  language: fr
  text: 'Et je dis : « Elle ne peut pas, Seigneur. » Il me dit : « Dans le séjour des morts[a], les chambres de réserve… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « séjour des morts » désigne ici le domaine des morts, et non spécifiquement le lieu du châtiment final.
    reason: cultural_note
lexical_decisions:
- source_word: non potest
  choice: Elle ne le peut pas
  rationale: Conserve la réponse négative et son renvoi implicite à la matrice mentionnée dans le contexte précédent.
- source_word: domine
  choice: Seigneur
  rationale: Équivalent français naturel et digne de l’adresse respectueuse latine.
- source_word: in inferno
  choice: dans le séjour des morts
  rationale: Rend ici le domaine des morts sans l’identifier spécifiquement au lieu du châtiment final.
- source_word: prumptuaria (promptuaria)
  choice: les réserves
  rationale: Traduit le pluriel désignant des lieux où l’on garde ce qui est mis en réserve; la phrase demeure inachevée dans le témoin latin fourni.
theological_decisions:
- issue: Sens de « inferno »
  choice: séjour des morts
  alternative: enfer
  rationale: « Enfer » risquerait d’imposer l’idée du châtiment final, tandis que le latin peut désigner plus largement le domaine des morts.
- issue: Fin fragmentaire du texte
  choice: Ne pas compléter la proposition après « les réserves »
  alternative: Ajouter « des âmes sont semblables à la matrice »
  rationale: Le complément proposé par la révision antérieure n’est pas attesté dans le texte latin fourni; les points de suspension signalent honnêtement l’interruption.
translation_notes:
  register: Français international moderne, sobre et digne. Le féminin « elle » reprend la matrice évoquée juste avant dans le contexte. La formulation finale reste volontairement fragmentaire afin de respecter la limite du témoin latin fourni.
