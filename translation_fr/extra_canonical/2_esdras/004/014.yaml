  text: and said[a], ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves other forests.’ In the same way the waves of the sea also devised a plan,
translation:
  language: fr
  text: 'et dirent : « Venez, faisons la guerre à la mer, afin qu’elle recule devant nous et que nous nous fassions d’autres forêts. » De même, les vagues de la mer conçurent, elles aussi, un projet,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recedat coram nos
  choice: qu’elle recule devant nous
  rationale: « Recedat » exprime le retrait ou le recul, et le latin tardif « coram nos » signifie ici « devant nous ».
- source_word: alias siluas
  choice: d’autres forêts
  rationale: « Alias » signifie « d’autres », et non « davantage de »; ce choix préserve aussi le parallèle avec le projet de la mer au verset suivant.
- source_word: cogitauerunt
  choice: conçurent […] un projet
  rationale: Cette formulation française naturelle rend l’idée d’élaborer ou de former un dessein, sans réduire le verbe à une simple pensée passagère.
