  yaml_path: translation/extra_canonical/2_esdras/004/019.yaml
  text: I said, “Both have devised a vain plan, for the earth has been given to the forest, and the place of the sea to bear its waves.” And he answered
translation:
  language: fr
  text: 'Je dis : « Tous deux ont conçu un projet vain, car la terre a été donnée à la forêt, et la place de la mer a été donnée pour porter ses vagues. » Et il répondit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: utrique
  choice: Tous deux
  rationale: Rend directement le distributif latin désignant les deux interlocuteurs de la comparaison.
- source_word: uanam cogitationem cogitauerunt
  choice: ont conçu un projet vain
  rationale: Conserve l’idée d’une conception irréalisable ou sans fondement, tout en évitant en français la répétition peu naturelle de « pensée » et « penser ».
- source_word: terra enim data est siluae
  choice: car la terre a été donnée à la forêt
  rationale: Suit de près le passif latin et maintient le rapport entre le domaine terrestre et la forêt.
- source_word: maris locus
  choice: l’espace de la mer
  rationale: « Espace » exprime ici naturellement le lieu ou domaine assigné à la mer.
- source_word: portare fluctus suos
  choice: pour porter ses vagues
  rationale: Rend l’infinitif latin dans sa valeur fonctionnelle ou finale, sans ajouter de verbe absent du texte.
- source_word: Et respondit
  choice: 'Et il répondit :'
  rationale: Conserve la transition narrative inachevée vers la réponse qui suit; les deux-points conviennent à l’enchaînement en français.
