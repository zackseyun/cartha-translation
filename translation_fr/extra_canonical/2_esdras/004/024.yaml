source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: est, et dispositionis scriptae nusquam sunt. Et pertransimus de saeculo ut locustae, et uita nostra ut uapor, et nec digni sumus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/024.yaml
  text: and the written ordinances are nowhere to be found. And we pass through the age like locusts[a], and our life is like vapor, and we are not worthy,
translation:
  language: fr
  text: et les prescriptions écrites sont introuvables[a]. Nous traversons le temps présent comme des sauterelles, notre vie est comme une vapeur, et nous ne sommes pas dignes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les prescriptions écrites sont introuvables » évoque probablement la perte ou la mise hors d’effet de l’ordre écrit faisant autorité en Israël à la suite de la catastrophe, sans signifier nécessairement que tous les manuscrits avaient matériellement disparu.
    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  choice: les prescriptions écrites
  rationale: Dans ce contexte, « prescriptions » rend la notion d’un ordre normatif consigné par écrit, sans préciser abusivement s’il s’agit de lois, d’ordonnances ou d’alliances.
- source_word: nusquam sunt
  choice: sont introuvables
  rationale: Formulation française naturelle qui conserve l’idée qu’elles ne se trouvent nulle part, sans affirmer nécessairement la disparition matérielle de tous les écrits.
- source_word: pertransimus de saeculo
  choice: nous traversons ce monde
  rationale: « Traverser » rend pertransimus, tandis que saeculum désigne ici le monde ou l’âge présent; « ce monde » est idiomatique et maintient l’image d’un passage éphémère.
- source_word: ut locustae
  choice: comme des sauterelles
  rationale: Équivalent direct de locustae, qui conserve l’image de vies nombreuses, fragiles et passagères.
- source_word: uita nostra ut uapor
  choice: notre vie est comme une vapeur
  rationale: Traduction proche de l’image latine; « vapeur » garde son caractère fugitif sans l’interpréter.
- source_word: nec digni sumus
  choice: nous ne sommes même pas dignes
  rationale: « Même pas » exprime naturellement la force cumulative de nec dans cette proposition inachevée.
theological_decisions:
- issue: Portée de la disparition des prescriptions écrites
  choice: Ne pas préciser s’il s’agit d’une perte matérielle ou d’une privation d’autorité effective.
  alternative: Dire que tous les manuscrits ont physiquement disparu.
  rationale: Le latin nusquam sunt permet l’idée d’une absence ou d’une inaccessibilité sans imposer une explication historique précise.
- issue: Sens de saeculum
  choice: ce monde
  alternative: l’âge présent
  rationale: Les deux sens sont possibles; « ce monde » convient naturellement à la comparaison portant sur le passage bref de la vie, tout en préservant la portée temporelle du terme.
translation_notes:
  register: Français moderne, international et digne. La ponctuation finale conserve la proposition inachevée du fragment source. Le marqueur de note est placé après l’expression qu’il explique.
