  yaml_path: translation/extra_canonical/2_esdras/004/043.yaml
  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: fr
  text: Ils s’empressent de rendre ce qui leur a été confié dès le commencement. Alors, ce que tu désires voir te sera montré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant
  choice: Ils s’empressent
  rationale: Rend le sens de hâte exprimé par le verbe latin, dans un français naturel et soutenu.
- source_word: reddere
  choice: rendre
  rationale: Conserve l’idée de restituer ce qui a été confié, sans préciser davantage l’identité du destinataire.
- source_word: ea quae commendata sunt
  choice: ce qui leur a été confié
  rationale: Le latin exprime des choses remises à leur garde; « confié » restitue clairement commendata sunt.
- source_word: ab initio
  choice: dès le commencement
  rationale: Préserve la portée temporelle du latin et son registre solennel.
- source_word: demonstrabitur
  choice: te sera montré
  rationale: Respecte la voix passive du latin et évite d’identifier l’agent, qui n’est pas exprimé.
- source_word: concupiscis uidere
  choice: tu désires voir
  rationale: Dans ce contexte, concupiscere indique un vif désir; « désires » reste naturel sans introduire la connotation morale souvent attachée à « convoiter ».
theological_decisions:
- issue: Agent de la révélation non exprimé
  choice: Conserver le passif « te sera montré »
  alternative: « Dieu te montrera »
  rationale: Le texte latin ne nomme pas l’agent; l’expliciter résoudrait indûment une ambiguïté du texte.
- issue: Référent du sujet pluriel de festinant
  choice: Employer le pronom non explicité « Ils »
  alternative: Nommer les dépositaires ou les temps
  rationale: Le verset dépend du contexte antérieur et le latin ne répète pas le référent; la traduction ne doit pas l’ajouter.
translation_notes:
  register: Français moderne international, clair et digne. La formulation conserve les passifs et les référents implicites du latin sans surinterprétation.
