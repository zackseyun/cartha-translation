  yaml_path: translation/extra_canonical/2_esdras/004/005.yaml
  text: And I said[a], “Speak, my lord.” And he said to me, “Go, weigh for me the weight of fire, or measure for me the measure of wind, or call back for me the day that has passed.”
translation:
  language: fr
  text: 'Et je dis : « Parle, mon seigneur. » Il me dit : « Va, pèse-moi le poids du feu, mesure-moi la mesure du vent[a], ou ramène-moi le jour qui est passé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin rendu par « mesure-moi la mesure du vent » est textuellement difficile. Il s’agit clairement d’une demande impossible visant à quantifier le vent, mais l’unité exacte que désigne la formulation reste incertaine.
    reason: textual_variant
lexical_decisions:
- source_word: loquere
  choice: Parle
  rationale: Impératif direct et naturel, correspondant exactement au latin.
- source_word: dominus meus
  choice: mon seigneur
  rationale: Conserve le titre respectueux au vocatif sans lui donner artificiellement une portée divine.
- source_word: pondera mihi ignis pondus
  choice: pèse-moi le poids du feu
  rationale: Maintient la répétition rhétorique de la racine pondus/pondera et le caractère impossible de la demande.
- source_word: mensura mihi satum uenti
  choice: mesure-moi une mesure de vent
  rationale: Reproduit prudemment la formulation latine difficile et son parallélisme, sans identifier avec certitude satum comme une unité précise.
- source_word: reuoca mihi diem quae praeteriit
  choice: fais revenir pour moi le jour qui est passé
  rationale: Rend l’idée de rappeler ou ramener un jour révolu, avec une formulation française claire et digne.
theological_decisions:
- issue: Portée du titre dominus meus
  choice: mon seigneur
  alternative: mon Seigneur
  rationale: La minuscule préserve l’ambiguïté du titre adressé à l’interlocuteur et évite de décider qu’il s’agit d’une appellation divine.
translation_notes:
  register: Français international moderne, sobre et soutenu. Le parallélisme des trois demandes impossibles ainsi que les répétitions expressives du latin sont conservés.
