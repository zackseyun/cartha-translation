source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
translation:
  language: fr
  text: Car si ce qui a été semé n’est pas moissonné[a], et si le lieu où le mal a été semé ne disparaît pas, le champ où le bien a été semé ne viendra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début de la proposition conditionnelle, transmis dans la tradition latine complète et reflété par le contexte, n’apparaît pas dans l’extrait latin fourni avant « ce qui a été semé ».
    reason: textual_transparency
lexical_decisions:
- source_word: seminatum est
  choice: a été semé
  rationale: Le parfait passif latin est rendu de manière identique dans ses trois occurrences afin de conserver le parallélisme étroit du texte.
- source_word: discesserit
  choice: ne disparaît pas
  rationale: Dans la construction conditionnelle négative attestée par le contexte, « disparaître » exprime naturellement l’éloignement ou la suppression du lieu où le mal a été semé.
- source_word: ager
  choice: champ
  rationale: Ce terme maintient l’image agricole et le contraste avec le « lieu » du mal.
- source_word: ueniet
  choice: viendra
  rationale: La traduction littérale conserve l’image eschatologique de l’arrivée du champ où le bien a déjà été semé.
theological_decisions:
- issue: Parallélisme entre le mal et le bien déjà semés
  choice: Répéter « a été semé » pour le mal comme pour le bien
  alternative: Employer « est semé » ou « sera semé » dans l’un des membres
  rationale: Le latin répète exactement « seminatum est »; la traduction ne doit pas résoudre ou modifier la tension temporelle du passage.
translation_notes:
  register: Français moderne, clair et digne. Le tour « ne viendra pas » est volontairement conservé malgré son caractère imagé, afin de respecter la formulation et la tension eschatologique du latin.
