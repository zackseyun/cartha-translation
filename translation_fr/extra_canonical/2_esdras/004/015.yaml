  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: fr
  text: 'et dirent : « Venez, montons soumettre la forêt de la plaine, afin que nous y acquérions aussi pour nous-mêmes une autre région. » Mais le projet concernant la forêt fut vain, car le feu vint et la consuma.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: debellare
  choice: soumettre
  rationale: Exprime l’idée de vaincre et de réduire sous son pouvoir, dans un français naturel, sans atténuer la portée militaire du verbe.
- source_word: silua campi
  choice: la forêt de la plaine
  rationale: Rend directement les deux substantifs latins et conserve l’image paradoxale ou inhabituelle du texte.
- source_word: consumemus nobismetipsis aliam regionem
  choice: nous emparer d’un autre territoire
  rationale: Restitue en français idiomatique le but de conquête et d’acquisition au profit des assaillants; « territoire » convient ici mieux que « région » au contexte militaire.
- source_word: cogitatus siluae
  choice: leur projet contre la forêt
  rationale: Le génitif latin peut désigner l’objet du projet; le contexte d’une attaque annoncée justifie « contre », tout en évitant l’ambiguïté artificielle de « le projet de la forêt ».
- source_word: in uano
  choice: fut vain
  rationale: Reproduction concise et naturelle de l’expression latine indiquant l’échec du projet.
- source_word: consumpsit eam
  choice: la consuma
  rationale: Le texte fourni est tronqué après « con- », mais la continuation attestée et la couche anglaise indiquent le verbe « consumer » avec la forêt comme objet.
