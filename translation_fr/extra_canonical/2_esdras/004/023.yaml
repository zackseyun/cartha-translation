id: 2ES.4.23
reference: 2 Esdras 4:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
translation:
  language: fr
  text: 'En effet, je ne voulais pas t’interroger sur les voies d’en haut, mais sur ce qui nous arrive chaque jour : pourquoi Israël a été livré à l’opprobre des nations, pourquoi le peuple que tu as aimé a été livré aux tribus impies, et pourquoi la loi de nos pères a été réduite à néant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superioribus uiis
  choice: les voies d’en haut
  rationale: Rend directement l’expression latine tout en conservant son caractère imagé et son possible sens céleste ou transcendant.
- source_word: quae pertranseunt per nos cotidie
  choice: ce qui nous arrive chaque jour
  rationale: Exprime naturellement en français l’idée des événements ou épreuves vécus quotidiennement, plutôt qu’un passage spatial à travers ou au-dessus de nous.
- source_word: in obprobrium gentibus
  choice: à l’opprobre des nations
  rationale: Préserve la force du latin obprobrium, qui désigne le déshonneur et l’objet de mépris public.
- source_word: tribubus impiis
  choice: aux tribus impies
  rationale: Traduction formelle de tribubus et impiis, sans préciser davantage l’identité des groupes ni atténuer leur caractérisation religieuse.
- source_word: in inritum deducta
  choice: a été réduite à néant
  rationale: Rend l’idée que la loi a été rendue sans effet ou privée de sa force, dans une formulation française idiomatique et solennelle.
theological_decisions:
- issue: Sens de « voies d’en haut »
  choice: Conserver l’image sans l’expliciter
  alternative: les voies supérieures / les réalités célestes
  rationale: Le latin permet une référence aux voies divines ou célestes, mais le verset ne définit pas précisément l’expression; la traduction préserve donc cette ouverture.
- issue: Portée de l’anéantissement de la loi
  choice: « réduite à néant » comme constat de son inefficacité dans la situation vécue
  alternative: rendue inutile / abolie
  rationale: Le latin in inritum deducta indique qu’elle est rendue vaine ou sans effet; « abolie » imposerait une conclusion théologique plus forte que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement marque l’adresse directe à Dieu, conformément à l’usage biblique français courant. La structure interrogative parallèle du latin est explicitée trois fois pour assurer clarté et rythme.
