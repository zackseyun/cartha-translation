source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'archangelus et dixit: quando impletus fuerit numerus similium uobis, quoniam in statera ponderauit saeculum, Et mensura'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/036.yaml
  text: And the archangel answered and said, ‘When the number of those like you is completed, for he has weighed the age in a balance,
translation:
  language: fr
  text: 'Et l’archange répondit : « Quand le nombre de ceux qui sont comme vous sera au complet, car il a pesé l’âge dans une balance, et avec une mesure… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: archangelus
  choice: l’archange
  rationale: Équivalent français direct du latin, sans ajouter le nom « Jérémiel », absent du texte source fourni.
- source_word: quando impletus fuerit numerus similium uobis
  choice: Quand le nombre de ceux qui sont comme vous sera au complet
  rationale: Rend la tournure temporelle et l’idée d’un nombre fixé qui atteint sa plénitude, tout en conservant le pluriel uobis (« vous »).
- source_word: in statera ponderauit saeculum
  choice: il a pesé le monde dans une balance
  rationale: « Monde » restitue ici saeculum comme l’ordre du monde ou l’époque présente; « dans une balance » conserve concrètement l’image latine.
- source_word: Et mensura
  choice: et mesuré…
  rationale: Le fragment s’interrompt après l’amorce de la proposition. La formulation française garde cette incomplétude sans inventer de complément.
theological_decisions:
- issue: Identité de l’archange
  choice: Ne pas le nommer
  alternative: « l’archange Jérémiel »
  rationale: Le nom n’apparaît pas dans le latin fourni; l’ajouter importerait une information issue d’une autre tradition textuelle ou du contexte.
- issue: Sens de saeculum
  choice: « le monde »
  alternative: « l’âge » ou « le siècle »
  rationale: Dans ce contexte apocalyptique, saeculum peut désigner le monde présent aussi bien que l’âge. « Le monde » est naturel en français et maintient l’image cosmique, sans expliciter davantage la durée ou l’ère.
- issue: Lien logique introduit par quoniam
  choice: « car » dans une incise
  alternative: Une nouvelle phrase ou une coordination sans lien explicite
  rationale: Conserve le rapport explicatif du latin tout en signalant que la phrase source se poursuit au-delà du fragment.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition latine « répondit et dit » est naturellement condensée en « répondit ». Le tiret et les points de suspension rendent visible le caractère tronqué du texte fourni sans compléter conjecturalement la proposition.
