  text: 'et oravi et dixi: putas vivo usque in diebus illis, vel quiserit in diebus illis? respondit ad me et dixit: de signis de quibus me'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/051.yaml
  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: fr
  text: 'Alors j’ai prié et j’ai dit : « Penses-tu que je vivrai jusqu’à ces jours-là ? Ou qui sera là en ces jours-là ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et oravi et dixi
  choice: Alors j’ai prié et j’ai dit
  rationale: Rend naturellement l’enchaînement narratif latin tout en conservant les deux verbes.
- source_word: putas vivo usque in diebus illis
  choice: Penses-tu que je vivrai jusqu’à ces jours-là ?
  rationale: Le latin transmis est irrégulier, mais le sens interrogatif porte clairement sur la survie du locuteur jusqu’aux jours annoncés.
- source_word: vel quiserit in diebus illis
  choice: Ou qui sera là en ces jours-là ?
  rationale: Le texte nettoyé semble refléter « qui erit »; « sera là » exprime en français idiomatique la présence ou l’existence pendant cette période.
theological_decisions:
- issue: Identité de ceux qui connaîtront les jours annoncés
  choice: 'Conserver la question ouverte : « qui sera là »'
  alternative: Préciser « qui vivra » ou identifier un groupe particulier
  rationale: Le verset ne désigne aucun groupe et ne permet pas d’imposer une interprétation eschatologique particulière.
translation_notes:
  register: 'Français moderne, clair et digne. La coordination répétée du latin est légèrement fluidifiée par « Alors », sans supprimer le mouvement de prière puis de parole. Le fragment final « respondit ad me et dixit: de signis de quibus me » appartient manifestement au début de la réponse suivante et n’est donc pas intégré à ce verset.'
