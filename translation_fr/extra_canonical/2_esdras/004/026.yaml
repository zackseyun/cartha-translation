source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'inuocatum est super nos? de his interrogaui. Et respondit ad me et dixit: si fueris uidebis, et si uixeris frequenter miraberis,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/026.yaml
  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: fr
  text: 'Il me répondit : « Si tu existes, tu verras ; et si tu vis, tu t’étonneras souvent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: si fueris
  choice: si tu es là
  rationale: Le futur antérieur latin de sum signifie littéralement « si tu as été / si tu es ». « Si tu es là » conserve la distinction avec vixeris tout en donnant en français une proposition compréhensible, sans ajouter l’idée de vivre assez longtemps.
- source_word: si uixeris
  choice: si tu vis
  rationale: Rend directement le verbe vivere et maintient son contraste avec fueris.
- source_word: frequenter miraberis
  choice: tu t’émerveilleras souvent
  rationale: Frequent(er) exprime la fréquence, et mirari l’étonnement admiratif ou la stupeur ; « s’émerveiller » convient ici sans ajout explicatif.
theological_decisions:
- issue: Sens énigmatique de si fueris
  choice: si tu es là
  alternative: si tu subsistes / si tu existes
  rationale: Le latin demeure abrupt et ambigu. La traduction évite d’assimiler silencieusement fueris à vixeris et ne transforme pas la phrase en affirmation doctrinale sur l’existence ou la survie.
translation_notes:
  register: Français moderne, simple et digne. La formule redondante « répondit et dit » est allégée en « répondit », usage naturel en français. La ponctuation montre que le verset poursuit une réponse dont le contexte immédiat peut dépasser cet extrait.
