    issue: « Si tu es là » ajoute « là »
    rationale: Le latin si fueris emploie esse sans complément locatif. « Là » oriente le sens vers une présence à un endroit ou à un moment et réduit l'ambiguïté du texte source.
  - severity: low
    issue: « t’émerveilleras » est plus positivement marqué que miraberis
    rationale: Mirari peut désigner l'étonnement, la stupeur ou l'admiration. « T'étonneras » laisse plus largement ouverte cette nuance.
