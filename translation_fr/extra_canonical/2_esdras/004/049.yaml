source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'transisset flamma et uidi et ecce superauit fumus. Et post hoc transiit coram me nubs plena aquae et inmisit pluuiam impetu multam, et cum transisset impetus pluuiae superauerunt in ea guttae. Et dixit ad me ; cogita tibi ; sicut enim crescit pluuia amplius quam guttae et ignis amplius quam fumus, sic superhabundauit quae transiuit mensura, superauerunt autem guttae et fumus. Et oraui et dixi : putas uiuo usque in diebus illis ? uel quis erit in diebus illis ? Respondit ad me et dixit : de signis de quibus me interrogas, ex parte possum tibi dicere, de uita autem tua non sum missus dicere tibi, sed nescio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/049.yaml
  text: and behold[a], smoke remained behind. After this a cloud full of water passed before me and sent forth a great driving rain, and when the force of the rain had passed, drops remained behind in it.
translation:
  language: fr
  text: La flamme eut passé, et je vis que voici, la fumée subsista[a]. Après cela, un nuage chargé d’eau passa devant moi et déversa une pluie abondante et violente. Quand la violence de la pluie fut passée, des gouttes subsistèrent dans le nuage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture : « des gouttes subsistèrent ».'
    reason: Conserve l’alternative textuelle signalée dans la piste d’audit anglaise, en l’identifiant correctement comme une autre lecture et en l’ancrant à « fumée ».
lexical_decisions:
- source_word: superauit
  choice: subsista / subsistèrent
  rationale: Le verbe indique ce qui demeure après le passage du phénomène principal. « Subsister » conserve ce contraste et convient aussi bien à la fumée qu’aux gouttes.
- source_word: nubs plena aquae
  choice: un nuage chargé d’eau
  rationale: Formulation française naturelle qui rend l’idée d’un nuage plein d’eau sans lourdeur littérale.
- source_word: inmisit pluuiam impetu multam
  choice: déversa une pluie abondante et violente
  rationale: Rend à la fois l’émission de la pluie, sa grande quantité et son impétuosité.
- source_word: in ea
  choice: dans le nuage
  rationale: Explicite en français le référent féminin latin, « nubs », et préserve le détail selon lequel les gouttes demeurent dans le nuage.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme entre la fumée qui subsiste après la flamme et les gouttes qui subsistent après la pluie est conservé. Le verset étant transmis comme une continuation, il commence par une minuscule.
