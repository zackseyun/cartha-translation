  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
translation:
  language: fr
  text: Car, de même que la terre a été donnée à la forêt, et la mer à ses vagues, de même ceux qui habitent sur la terre ne peuvent comprendre que ce qui est sur la terre, et celui qui est au-dessus des cieux comprend ce qui est au-dessus des cieux[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin transmis s’interrompt ici. La fin de la phrase est restituée d’après le parallélisme. La forme latine « qui » pourrait aussi se traduire par « ceux qui sont au-dessus des cieux », mais les autres versions anciennes appuient le singulier.
    reason: Signaler la lacune du texte latin fourni, la restitution syntaxique qui en résulte et l’ambiguïté morphologique de « qui ».
lexical_decisions:
- source_word: terra siluae data est
  choice: la terre a été donnée à la forêt
  rationale: Rend formellement la formulation latine, malgré son caractère inhabituel, sans remplacer « forêt » par une conjecture non attestée dans le texte fourni.
- source_word: intellegere solummodo possunt
  choice: ne peuvent comprendre que
  rationale: Expression française naturelle qui conserve la restriction marquée par « solummodo ».
- source_word: qui super caelos
  choice: celui qui est au-dessus des cieux
  rationale: Le latin « qui » est morphologiquement ambigu, mais le contexte et les versions anciennes signalées soutiennent ici un référent singulier, Dieu.
theological_decisions:
- issue: Identité et nombre de « qui super caelos »
  choice: celui qui est au-dessus des cieux
  alternative: ceux qui sont au-dessus des cieux
  rationale: Le singulier préserve le contraste entre les humains qui habitent la terre et Dieu au-dessus des cieux, tout en signalant en note l’ambiguïté propre à la forme latine.
- issue: Verbe sous-entendu dans le dernier membre
  choice: répétition de « comprend »
  alternative: construction elliptique sans verbe
  rationale: Le latin transmis s’interrompt après « qui super caelos »; la reprise de « comprendre » découle du parallélisme immédiat et produit une phrase française intelligible sans ajouter une idée nouvelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme de la phrase est conservé. La tournure étrange concernant la terre et la forêt reste visible afin de ne pas corriger silencieusement le texte source.
