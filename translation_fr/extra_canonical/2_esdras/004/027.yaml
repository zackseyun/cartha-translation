  rationale: La révision corrige l’attribution injustifiée des promesses « aux justes » et rend le futur latin. Elle maintient l’ambiguïté relative de l’expression temporelle par « aux temps convenables », sans imposer l’idée de temps eschatologiquement « fixés » ni une lecture doctrinale.
