source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam festinans festinat saeculum pertransire; Non enim capiet portare quae in temporibus iustis repromissa sunt, quoniam plenum mesticia est saeculum hoc et infirmitatibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: fr
  text: car cet âge se hâte de passer. En effet, il ne pourra pas porter ce qui a été promis aux temps convenables, puisque cet âge est plein de tristesse et de faiblesses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: cet âge
  rationale: Conserve le sens temporel et eschatologique du latin sans le réduire au seul « monde » matériel.
- source_word: festinans festinat
  choice: se hâte
  rationale: Rend naturellement en français l’intensification produite par la répétition latine, sans répétition maladroite.
- source_word: capiet portare
  choice: peut porter
  rationale: Préserve l’image de la capacité à porter ou contenir, plutôt que de la remplacer par une simple idée abstraite de possibilité.
- source_word: repromissa sunt
  choice: a été promis
  rationale: Dans ce contexte, repromittere désigne une promesse assurée; « promis de nouveau » introduirait une répétition qui n’est pas nécessairement visée.
- source_word: mesticia
  choice: tristesse
  rationale: Équivalent moderne et digne du latin maestitia, ici traité comme un nom collectif singulier.
- source_word: infirmitatibus
  choice: faiblesses
  rationale: Maintient la portée large du terme latin, qui peut englober fragilités, infirmités et incapacités.
theological_decisions:
- issue: Rapport de iustis avec temporibus et repromissa sunt
  choice: « promis aux justes pour les temps fixés »
  alternative: « promis dans les temps justes »
  rationale: La morphologie permet de lire iustis comme un datif substantivé (« aux justes »), tandis que temporibus indique le moment destiné à l’accomplissement. « Temps fixés » exprime cette destination sans imposer une chronologie doctrinale précise.
- issue: Sens eschatologique de saeculum
  choice: « cet âge »
  alternative: « ce monde »
  rationale: « Cet âge » conserve l’opposition implicite entre l’ordre présent, marqué par la tristesse et la faiblesse, et les biens promis, sans préciser davantage la nature de l’âge à venir.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’image de l’âge présent incapable de porter les réalités promises et évite de résoudre au-delà du latin la nature exacte des « temps fixés ».
