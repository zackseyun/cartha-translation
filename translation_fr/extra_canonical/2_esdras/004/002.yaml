source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit mihi : excedens excessit cor tuum in saeculo hoc, et comprehendere cogitas uiam altissimi?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/002.yaml
  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
translation:
  language: fr
  text: 'Il me dit : « Ton cœur est complètement déconcerté par ce monde-ci, et tu penses pouvoir comprendre la voie du Très-Haut ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excedens excessit cor tuum
  choice: ton cœur est complètement déconcerté
  rationale: La tournure redoublée exprime l’intensité. Dans cet idiome sémitisant, le cœur représente l’intelligence intérieure qui perd ses repères; « complètement déconcerté » rend le sens cognitif sans suggérer à tort une faute morale ou un simple dépassement de limites.
- source_word: in saeculo hoc
  choice: par ce monde-ci
  rationale: Ici, saeculum désigne le monde ou l’âge présent. La préposition française « par » explicite naturellement ce qui déconcerte le cœur; « ce monde-ci » reste courant et conserve le contraste implicite avec les réalités supérieures.
- source_word: comprehendere cogitas
  choice: tu penses pouvoir comprendre
  rationale: Rend naturellement l’idée de concevoir ou prétendre être capable de saisir intellectuellement.
- source_word: uiam altissimi
  choice: la voie du Très-Haut
  rationale: « Voie » conserve la métaphore du latin uia et l’ambiguïté entre manière d’agir, dessein et ordre établi par Dieu; « Très-Haut » est le titre divin traditionnel et direct.
theological_decisions:
- issue: Nature du reproche adressé à Esdras
  choice: Un constat de désarroi intellectuel face au monde présent
  alternative: Une accusation d’avoir dépassé les limites permises
  rationale: Le contexte argumentatif oppose l’incapacité d’Esdras à saisir le monde présent à sa prétention de comprendre la voie du Très-Haut. Cette lecture préserve l’argument du moindre au plus grand et évite d’introduire une faute morale que le texte n’impose pas.
- issue: Sens de « la voie du Très-Haut »
  choice: Maintien de la métaphore ouverte « voie »
  alternative: « les desseins du Très-Haut » ou « la manière d’agir du Très-Haut »
  rationale: Le mot source peut couvrir plusieurs nuances théologiques. Le traduire littéralement préserve cette amplitude sans trancher entre dessein, conduite et ordre divins.
translation_notes:
  register: Français moderne, international et digne. La question rhétorique reste directe. « Complètement déconcerté » privilégie le sens idiomatique et contextuel de la locution latine intensive plutôt qu’un calque obscur tel que « est allé bien au-delà ».
