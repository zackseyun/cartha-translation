  text: I went out to a forest of the trees of the plain[a], and they devised a plan, and said, 'Come[b], let us go and make
translation:
  language: fr
  text: 'Je me rendis dans une forêt d’arbres de la plaine[a]. Ils conçurent un projet et dirent : « Venez, allons faire[b]…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une forêt des arbres — ou des bois — de la plaine ».'
    reason: L’expression latine siluam lignorum campi est inhabituelle et permet de comprendre lignorum comme « arbres » ou comme « bois ».
  - marker: b
    text: La phrase demeure inachevée ici et se poursuit au verset suivant.
    reason: Le texte latin de ce verset s’arrête sur faciamus ad, au milieu de la proposition.
lexical_decisions:
- source_word: profectus sum
  choice: Je me rendis
  rationale: Le parfait de proficiscor exprime ici simplement le fait de partir ou de se rendre quelque part, sans justifier l’ajout de « un jour » ou « autrefois ».
- source_word: siluam lignorum campi
  choice: une forêt d’arbres de la plaine
  rationale: Cette formulation conserve les trois éléments de l’expression latine — forêt, arbres/bois et plaine — malgré sa tournure quelque peu inhabituelle.
- source_word: cogitauerunt cogitationem
  choice: Ils conçurent un projet
  rationale: L’expression latine emploie un verbe et un nom de même racine. Le français naturel rend cette insistance par l’idée d’un projet délibérément conçu.
- source_word: uenite et eamus
  choice: Venez, allons
  rationale: Les deux impératifs sont conservés, même si leur succession est légèrement redondante en français.
- source_word: faciamus ad
  choice: allons faire…
  rationale: La proposition reste inachevée à la fin du verset dans l’édition source. L’ellipse signale cette suspension sans importer dans ce verset les mots du suivant.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La personnification des arbres est préservée par le pronom « ils ». L’inachèvement final respecte strictement la division des versets de la source latine.
