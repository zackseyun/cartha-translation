source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
translation:
  language: fr
  text: « Si tu me fais connaître l’une de ces choses[a], moi aussi, je te montrerai le chemin que tu désires voir et je t’enseignerai pourquoi le cœur est mauvais. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu m’expliques l’une de ces choses » ou « Si tu m’en informes ».'
    reason: Le latin renuntiare peut signifier rapporter, faire connaître ou, dans ce contexte, exposer une réponse.
lexical_decisions:
- source_word: renunciaueris
  choice: tu me rends compte
  rationale: Le verbe latin renuntiare signifie ici rapporter, faire connaître ou exposer. « Rendre compte » conserve cette idée sans ajouter la notion de capacité absente de la condition latine.
- source_word: uiam
  choice: le chemin
  rationale: Équivalent naturel et direct de uiam, en maintenant l’image du chemin.
- source_word: cor malignum
  choice: le cœur est mauvais
  rationale: La proposition elliptique latine est naturellement explicitée en français avec « est »; l’article défini conserve la portée générale de « cœur » sans introduire l’idée existentielle d’« un cœur mauvais ».
theological_decisions:
- issue: Portée de « pourquoi le cœur est mauvais »
  choice: Conserver la formulation générale sans préciser l’origine, la nature ou le sujet du mal
  alternative: « pourquoi il existe un cœur mauvais » ou « pourquoi ton cœur est mauvais »
  rationale: Le latin quare cor malignum est elliptique et ne fournit ni verbe exprimé ni possessif. La traduction maintient cette tension sans imposer une interprétation anthropologique particulière.
translation_notes:
  register: Français moderne, digne et accessible. La structure conditionnelle directe est conservée; aucun « pouvoir » n’est ajouté. La reprise emphatique « moi aussi » rend et ego.
