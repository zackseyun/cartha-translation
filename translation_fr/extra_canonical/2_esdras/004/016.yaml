lexical_decisions:
- source_word: cogitatus
  choice: dessein
  rationale: Le latin désigne ici une pensée, une intention ou un projet. « Dessein » conserve la personnification des vagues et la portée énigmatique de l’expression.
- source_word: fluctuum maris
  choice: des vagues de la mer
  rationale: Traduction directe et naturelle du génitif latin.
- source_word: stetit
  choice: tint bon
  rationale: Cette formulation française rend l’idée de demeurer ferme face aux vagues, conformément au contexte transmis.
theological_decisions:
- issue: Personnification des vagues
  choice: Conserver « le dessein des vagues »
  alternative: Expliciter comme « le mouvement des vagues » ou « le dessein qui gouverne les vagues »
  rationale: Le texte latin attribue littéralement un cogitatus aux vagues. L’expliciter résoudrait une ambiguïté réelle que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. « Tint bon » est idiomatique sans être familier; « dessein » préserve le caractère élevé et énigmatique de la phrase.
