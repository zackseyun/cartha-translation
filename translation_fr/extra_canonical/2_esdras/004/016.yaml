  text: 'Likewise also the plan of the waves of the sea: for the sand stood fast and held them back.'
translation:
  language: fr
  text: 'De même, le dessein des vagues de la mer : car le sable tint bon et les arrêta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin conservé de ce passage est fragmentaire; la mention du sable qui arrête les vagues repose sur la restitution du contexte textuel.
