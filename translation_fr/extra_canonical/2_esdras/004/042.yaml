source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: animarum matrici adsimilata sunt. Quemadmodum enim festinabit quae parit effugere necessitatem partus, sic et haec
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/042.yaml
  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
translation:
  language: fr
  text: Ils sont assimilés à la matrice des âmes. Car, de même que celle qui enfante se hâte d’échapper à la nécessité de l’accouchement[a], de même ceux-ci…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin necessitas peut désigner la contrainte inévitable et, dans ce contexte, évoquer aussi la détresse qui l’accompagne.
    reason: Préserver l’ambiguïté sémantique de necessitas sans ajouter « épreuve » au texte traduit.
lexical_decisions:
- source_word: matrici
  choice: à la matrice
  rationale: Le latin désigne littéralement la matrice ou le sein maternel. « Matrice » conserve ici l’image corporelle et le lien direct avec les âmes, sans ajouter une explication absente du fragment.
- source_word: festinabit quae parit
  choice: celle qui enfante se hâte
  rationale: Cette formulation suit l’ordre et le sens du latin tout en restant naturelle et digne en français moderne.
- source_word: necessitatem partus
  choice: l’épreuve inévitable de l’accouchement
  rationale: « Necessitas » exprime ici à la fois la contrainte inéluctable de l’accouchement et, dans le contexte, l’épreuve qu’elle constitue. Cette traduction évite le faux naturel « nécessité de l’accouchement » sans réduire le terme aux seules douleurs.
- source_word: sic et haec
  choice: de même ceux-ci…
  rationale: Le texte source fourni s’interrompt après ce syntagme. Les points de suspension signalent honnêtement que la comparaison reste inachevée dans l’extrait, sans importer la suite depuis une autre forme textuelle.
theological_decisions:
- issue: Nature de la « matrice des âmes »
  choice: Conserver la métaphore sans l’expliquer
  alternative: Identifier explicitement son référent ou développer une doctrine sur l’origine des âmes
  rationale: Le fragment ne précise ni le référent de « ils » ni la portée métaphysique de l’image. Une explicitation imposerait au texte une interprétation théologique non établie.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase finale demeure volontairement inachevée puisque l’extrait latin s’arrête à « sic et haec ».
