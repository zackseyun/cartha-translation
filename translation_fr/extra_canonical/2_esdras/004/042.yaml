  revision_rationale: La révision remplace une explicitation interprétative par le sens lexical direct de necessitas, tout en conservant dans une note l’éventuelle résonance de détresse liée à l’accouchement. Elle maintient la métaphore, le registre et les points de suspension requis par le caractère tronqué de l’extrait.
