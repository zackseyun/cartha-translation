revisions:
- from: Ils sont comparables à la matrice des âmes. En effet, de même que celle qui enfante se hâte d’échapper à l’épreuve inévitable de l’accouchement[a], de même ceux-ci…
  to: Ils sont assimilés à la matrice des âmes. Car, de même que celle qui enfante se hâte d’échapper à la nécessité de l’accouchement[a], de même ceux-ci…
  rationale: La révision remplace une explicitation interprétative par le sens lexical direct de necessitas, tout en conservant dans une note l’éventuelle résonance de détresse liée à l’accouchement. Elle maintient la métaphore, le registre et les points de suspension requis par le caractère tronqué de l’extrait.
