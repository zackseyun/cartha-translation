review_pass:
  verdict: revise
  source_fidelity: La métaphore de la « matrice des âmes », la construction comparative et l’inachèvement de l’extrait sont bien conservés. Toutefois, « l’épreuve inévitable » explicite et élargit necessitas en ajoutant l’idée d’« épreuve », qui n’est pas exprimée par le latin. La formulation littérale conserve mieux l’ambiguïté entre contrainte inévitable et détresse contextuelle.
  naturalness: Le français est globalement soutenu et naturel pour ce registre. « La nécessité de l’accouchement » est moins idiomatique que la formulation du projet, mais elle est intelligible et appropriée ici, avec une note qui en explicite la portée possible sans imposer un sens unique.
  terminology: « Matrice » rend fidèlement matrici et maintient l’image corporelle. « Celle qui enfante se hâte » rend correctement festinabit quae parit. La note doit présenter la nuance de necessitas comme une possibilité sémantique plutôt que de justifier un ajout interprétatif dans le texte.
  issues:
  - severity: medium
    issue: « l’épreuve inévitable de l’accouchement » ajoute « épreuve » au texte principal.
    rationale: Necessitatem partus désigne littéralement la nécessité ou contrainte de l’accouchement. Dans ce contexte, le mot peut certes évoquer la détresse, mais le latin ne qualifie pas explicitement l’accouchement d’« épreuve ». Une note permet de préserver cette nuance sans la fixer dans la traduction.
  revised_text: Ils sont assimilés à la matrice des âmes. Car, de même que celle qui enfante se hâte d’échapper à la nécessité de l’accouchement[a], de même ceux-ci…
