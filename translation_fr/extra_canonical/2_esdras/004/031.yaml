  text: Considère donc par toi-même combien de fruit d’impiété une semence a produit. Quand
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminis
  choice: une semence
  rationale: Le latin désigne simplement une semence, sans adjectif exprimant explicitement le mal.
- source_word: quantum fructum impietatis
  choice: combien de fruits d’impiété
  rationale: Cette formulation française naturelle conserve l’idée de la grande quantité de fruit produit ainsi que le génitif « d’impiété », sans préciser davantage la nature de celle-ci.
- source_word: generauerit
  choice: a produits
  rationale: Le parfait latin exprime ici le résultat déjà engendré par la semence; « produire » convient à l’image végétale.
- source_word: Quando
  choice: Quand
  rationale: Le mot amorce la proposition suivante; son caractère suspendu est conservé puisque l’extrait source s’arrête à cet endroit.
theological_decisions:
- issue: Nature morale de la semence
  choice: Ne pas qualifier la semence de mauvaise
  alternative: « une mauvaise semence » ou « une semence du mal »
  rationale: Le texte latin fourni attribue explicitement l’impiété au fruit, mais ne contient aucun adjectif qualifiant la semence elle-même.
translation_notes:
  register: Français international moderne, clair et digne. L’image de la semence et du fruit est conservée. Le pluriel « fruits » rend idiomatiquement en français la quantité exprimée par « quantum fructum ». La finale « Quand » reste volontairement inachevée, conformément à l’extrait latin.
