  text: I will show you the interpretation of the likeness. And I stood and saw, and behold, a blazing furnace passed before me, and it happened when
translation:
  language: fr
  text: 'Je te montrerai l’interprétation de la comparaison. Je me tins debout et je vis : voici qu’une fournaise ardente passa devant moi. Et il arriva que, lorsque…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demonstrabo
  choice: Je montrerai
  rationale: Rend directement le futur latin et conserve la promesse d’explication.
- source_word: interpretationem similitudinis
  choice: l’interprétation de la comparaison
  rationale: « Comparaison » exprime ici naturellement la similitude illustrative, tandis que « interprétation » reste proche du latin.
- source_word: steti et uidi
  choice: Je me tins debout et je vis
  rationale: Préserve les deux verbes et leur enchaînement narratif sans réduire steti à un simple auxiliaire.
- source_word: fornax ardens
  choice: une fournaise ardente
  rationale: Expression française digne et précise pour une fournaise en feu.
- source_word: transiit coram me
  choice: passa devant moi
  rationale: Correspondance naturelle et directe avec le mouvement décrit.
- source_word: factum est cum
  choice: il arriva, lorsque
  rationale: Conserve la formule événementielle et, par la suspension finale, le caractère incomplet de l’extrait latin.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le deux-points avant « voici » rend l’effet visionnaire de ecce. Les points de suspension signalent que la proposition finale demeure inachevée dans le segment fourni, sans la compléter à partir du verset suivant.
