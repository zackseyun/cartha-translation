  text: When ears of grain without number are sown[a], how great a threshing floor they will begin to make! And he answered and said to me, “Until—
translation:
  language: fr
  text: 'Lorsque d’innombrables épis auront été semés, quelle immense aire de battage ils commenceront à former ! Alors il répondit, et je dis[a] : « Jusqu’à—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin passe ici de « il répondit » à « je dis ». Il est possible que le texte ait subi une altération ; on pourrait aussi restituer : « Alors je répondis et je dis » ou « Alors il répondit et me dit ».'
    reason: Signaler l’alternance irrégulière des personnes dans « Et respondit et dixi » et les principales possibilités de restitution sans en imposer une.
lexical_decisions:
- source_word: seminatae fuerint
  choice: auront été semés
  rationale: Le futur antérieur passif rend la forme latine dans une proposition temporelle introduite naturellement par « lorsque ».
- source_word: spicae quarum non est numerus
  choice: d’innombrables épis
  rationale: Formulation française naturelle qui conserve l’idée littérale d’épis « dont le nombre n’existe pas », c’est-à-dire impossibles à compter.
- source_word: aream
  choice: aire de battage
  rationale: Précise le sens agricole de « area » dans le contexte des épis et évite le terme trop général « aire ».
- source_word: incipient facere
  choice: commenceront à former
  rationale: Conserve explicitement l’aspect inchoatif de « incipient » tout en employant un verbe idiomatique pour la constitution d’une vaste aire par la récolte.
- source_word: usque-
  choice: Jusqu’à—
  rationale: Le tiret signale que le mot et la phrase se poursuivent au-delà du fragment fourni.
theological_decisions:
- issue: Alternance des sujets dans « Et respondit et dixi »
  choice: Alors il répondit, et je dis[a]
  alternative: Alors je répondis et dis
  rationale: Le texte latin fourni porte littéralement un verbe à la troisième personne (« respondit »), puis un verbe à la première (« dixi »). La traduction principale conserve cette tension au lieu de corriger silencieusement le texte; une note avertit le lecteur de l’irrégularité.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La métaphore agricole reste concrète; « aire de battage » assure sa compréhension. La ponctuation finale conserve le caractère interrompu du fragment source.
