- source_word: quid faciet nomini suo
  choice: que fera-t-il pour son nom
  rationale: Le datif « nomini suo » exprime ici l’intérêt ou l’avantage; « pour son nom » est naturel en français et ne précise pas davantage l’action laissée en suspens.
- source_word: quod
