  rationale: Pronom relatif reprenant « nom »; la proposition se poursuit au verset suivant selon le découpage de la source fournie.
theological_decisions:
- issue: Sens de « son nom »
  choice: Conserver littéralement « son nom »
  alternative: Expliciter comme sa réputation, son honneur ou le peuple sur lequel son nom est invoqué
  rationale: Le fragment latin ne permet pas à lui seul de trancher entre ces nuances théologiques; l’explicitation appartient à la suite du texte.
