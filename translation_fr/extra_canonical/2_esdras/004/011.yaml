id: 2ES.4.11
reference: 2 Esdras 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uas tuum capere altissimi uiam, et iam exteritus corrupto saeculo intelligere incorruptionem? et cum haec audissem, cecidi in faciem meam, Et dixi illi: melius erat nos non adesse,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/011.yaml
  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
translation:
  language: fr
  text: 'Comment ton vase peut-il saisir la voie du Très-Haut et, déjà usé par cet âge corrompu, comprendre l’incorruptibilité ? » Lorsque j’entendis ces paroles, je tombai face contre terre et lui dis : « Il aurait mieux valu que nous n’existions pas,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uas tuum
  choice: ton réceptacle
  rationale: Le latin emploie littéralement « ton vase/récipient » comme image de la capacité humaine. « Réceptacle » conserve cette métaphore tout en restant compréhensible en français moderne.
- source_word: capere
  choice: saisir
  rationale: Le verbe peut évoquer à la fois contenir et comprendre ; « saisir » préserve convenablement ce double arrière-plan avec « réceptacle ».
- source_word: uiam
  choice: la voie
  rationale: « Voie » rend le sens concret et figuré de uia sans réduire le passage à une simple notion intellectuelle.
- source_word: exteritus
  choice: épuisé
  rationale: Le mot décrit l’usure produite par l’âge présent ; « épuisé » exprime naturellement cet état en français.
- source_word: saeculo
  choice: monde
  rationale: Dans ce contexte eschatologique, saeculum désigne l’ordre ou l’âge présent. « Monde » donne une formulation française naturelle, sans effacer entièrement cette portée.
- source_word: incorruptionem
  choice: l’incorruptibilité
  rationale: Ce terme abstrait conserve l’opposition théologique directe avec « corrompu ».
- source_word: non adesse
  choice: que nous n’existions pas
  rationale: Dans ce contexte, adesse signifie être là, être présent, donc exister ; cette formulation rend le sens idiomatiquement.
theological_decisions:
- issue: Image du vase appliquée à la capacité humaine
  choice: Conserver l’image par « ton réceptacle »
  alternative: « Comment pourrais-tu comprendre… »
  rationale: La métaphore est présente dans le latin et porte la tension entre la finitude humaine et la voie du Très-Haut ; la supprimer serait interprétatif.
- issue: Sens eschatologique de saeculum
  choice: « ce monde corrompu »
  alternative: « cet âge corrompu »
  rationale: « Monde » est plus naturel pour le lectorat francophone général, tandis que « corrompu » maintient l’opposition avec l’incorruptibilité.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore inhabituelle du réceptacle est volontairement conservée en raison de son importance dans le raisonnement. La virgule finale reflète le fait que la phrase du témoin latin se poursuit au verset suivant.
