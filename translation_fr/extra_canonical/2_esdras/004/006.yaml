  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: fr
  text: 'Je répondis : « Qui, parmi les mortels, pourra faire cela, pour que tu m’interroges sur ces choses ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: natorum
  choice: les êtres humains
  rationale: Le latin signifie littéralement « ceux qui sont nés ». En français moderne, « les êtres humains » en exprime naturellement la portée collective sans suggérer seulement une génération particulière.
- source_word: poterit hoc facere
  choice: pourrait faire cela
  rationale: Le conditionnel français rend ici la capacité envisagée dans une question rhétorique plus naturellement qu’un futur littéral.
- source_word: de his
  choice: sur ces choses
  rationale: Rendu direct du démonstratif latin, en conservant la référence aux sujets immédiatement évoqués.
theological_decisions:
- issue: Portée de « natorum »
  choice: Référence générale aux êtres humains
  alternative: « ceux qui sont nés »
  rationale: La formulation désigne les mortels en général; le choix retenu conserve cette portée sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La formule latine redondante « respondi et dixi » est rendue par le naturel « je répondis », sans perte de contenu discursif. Le tutoiement maintient l’adresse singulière du latin.
