  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
translation:
  language: fr
  text: 'Tu questionnes avec insistance ; je peux te répondre en partie[a]. Or, concernant ta vie, je n’ai pas été envoyé pour t’en parler, mais je ne sais pas.


    [a] « Ta vie » traduit le latin vita, terme général qui peut inclure la durée de la vie sans s’y limiter. La réponse énonce distinctement que l’ange n’a pas été envoyé pour en parler et qu’il ne le sait pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ta vie » traduit le latin vita, terme général qui peut inclure la durée de la vie sans s’y limiter. La réponse énonce distinctement que l’ange n’a pas été envoyé pour en parler et qu’il ne le sait pas.
    reason: Préserve l’ambiguïté de vita et explicite sobrement la double limitation formulée dans le verset, sans ajouter de contenu interprétatif non exprimé par le latin.
lexical_decisions:
- source_word: perrogas
  choice: Tu questionnes avec insistance
  rationale: Le préverbe per- donne ici à rogare une valeur intensive ou insistante ; cette formulation française naturelle conserve cette nuance sans ajouter un objet absent du latin.
- source_word: ex parte
  choice: en partie
  rationale: Rend directement la portée limitée de ce qui peut être communiqué.
- source_word: de vita autem tua
  choice: Mais en ce qui concerne ta vie
  rationale: Conserve le contraste marqué par autem et l’ambiguïté de vita, qui peut viser la vie d’Esdras, notamment sa durée, sans l’expliciter dans le texte principal.
- source_word: non sum missus dicere tibi
  choice: je n’ai pas été envoyé pour t’en parler
  rationale: Préserve le passif de mission et rend idiomatiquement le double complément latin, sans nommer celui qui envoie.
- source_word: sed nescio
  choice: et je ne sais pas
  rationale: Suit la coordination attestée par la couche anglaise auditée tout en conservant l’aveu distinct d’ignorance ; en français, « et » évite une opposition artificielle après le refus de mission.
theological_decisions:
- issue: Limites de la révélation accordée à Uriel
  choice: Maintenir à la fois la limitation de sa mission et son absence de connaissance
  alternative: Comprendre « je ne sais pas » comme une simple reformulation du refus de révéler
  rationale: Le latin énonce séparément non sum missus et nescio. La traduction conserve cette tension théologique sans expliquer l’ignorance par une doctrine particulière.
- issue: Sens de « ta vie »
  choice: Conserver l’expression générale dans le texte et préciser en note qu’il s’agit notamment de sa durée
  alternative: Traduire directement par « la durée de ta vie »
  rationale: Vita est lexicalement plus large que « durée de vie » ; garder « ta vie » préserve l’ambiguïté authentique du texte.
translation_notes:
  register: 'Français international moderne, sobre et digne. Tutoiement cohérent avec la deuxième personne singulière latine. La ponctuation fait ressortir la réponse partielle puis la double limite : absence de mission et ignorance.'
