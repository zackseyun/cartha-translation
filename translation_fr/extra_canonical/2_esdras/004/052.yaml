  source_fidelity: 'Révision nécessaire : le latin oppose explicitement les deux dernières propositions par « sed » (« mais »). Le texte proposé rend cette opposition par « et », ce qui atténue la distinction voulue entre l’absence de mission et l’ignorance. La traduction de « perrogas », « ex parte » et « de vita tua » est par ailleurs fidèle et conserve l’ambiguïté de « vita ».'
  naturalness: Le français est globalement naturel et de registre sobre. « Or » permet de rendre le contraste de « autem » sans répéter lourdement « mais », tandis que « mais je ne sais pas » restitue l’adversative finale, même si la juxtaposition des deux limites demeure volontairement abrupte comme dans le latin.
  terminology: '« Ta vie » doit rester dans le texte principal : le latin ne dit pas expressément « durée de vie ». La note actuelle la réduit indûment à la durée de vie d’Esdras et ajoute « certaines choses / calendrier divin », éléments qui ne figurent pas dans ce verset latin. La note révisée signale seulement l’ambiguïté pertinente et la double limitation énoncée.'
  issues:
