  text: 'vers moi et a dit : « Tu as bien jugé ; alors pourquoi n’as-tu pas jugé pour toi-même ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bene tu iudicasti
  choice: Tu as bien jugé
  rationale: Rend directement l’évaluation positive exprimée par « bene », dans un français naturel et digne.
- source_word: et quare
  choice: Alors pourquoi
  rationale: Dans ce contexte, « et » relie logiquement le bon jugement à la question qui en découle ; « alors » exprime ce lien plus naturellement en français.
- source_word: tibi
  choice: pour toi-même
  rationale: Le datif renvoie au destinataire comme bénéficiaire ou personne concernée par son propre jugement, sans imposer la formulation plus interprétative « dans ton propre cas ».
