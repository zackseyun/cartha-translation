  to: 'Il me répondit : « Tu ne te hâtes pas plus que le Très-Haut. En effet, tu te hâtes pour toi-même, tandis que le Très-Haut se hâte pour beaucoup. Les âmes des justes, dans leurs chambres[a], n’ont-elles pas posé des questions à ce sujet ? »'
  rationale: La révision remplace une image française peu naturelle par « chambres », soutenue par une note qui préserve la nuance spatiale et concrète de promptuariis. Elle rend aussi de his par « à ce sujet », sans renforcer inutilement la référence par « mêmes ». Le reste du texte conserve la déclaration initiale, l’ellipse verbale rendue de façon naturelle et la question rhétorique finale du latin.
