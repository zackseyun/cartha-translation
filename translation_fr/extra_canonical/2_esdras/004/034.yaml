  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
translation:
  language: fr
  text: 'Il me répondit : « Tu ne te hâtes pas plus que le Très-Haut. En effet, tu te hâtes pour toi-même, tandis que le Très-Haut se hâte pour beaucoup. Les âmes des justes, dans leurs chambres[a], n’ont-elles pas posé des questions à ce sujet ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs réserves ». Le latin désigne littéralement des lieux où l’on garde quelque chose en réserve.
    reason: Le terme promptuariis peut évoquer un lieu de dépôt; « chambres » est plus naturel en français dans ce contexte tout en laissant la nature de ces lieux indéterminée.
lexical_decisions:
- source_word: festinas
  choice: tu te hâtes
  rationale: Rend directement le verbe actif latin et conserve l’idée d’empressement, sans la transformer en simple impatience.
- source_word: altissimum / excelsus
  choice: le Très-Haut
  rationale: Les deux désignations latines renvoient ici à Dieu; une même appellation française naturelle maintient clairement le parallèle.
- source_word: pro multis
  choice: pour beaucoup
  rationale: Préserve la portée indéterminée de multis sans préciser artificiellement « beaucoup de personnes » ni « la multitude ».
- source_word: animae iustorum
  choice: les âmes des justes
  rationale: Traduction formelle et théologiquement non interprétative de l’expression latine.
- source_word: in promptuariis
  choice: dans leurs réserves
  rationale: Promptuarium désigne littéralement un lieu de dépôt ou une réserve; ce choix conserve l’image spatiale inhabituelle du texte latin.
theological_decisions:
- issue: Rapport entre l’empressement d’Esdras et celui du Très-Haut
  choice: 'Phrase déclarative : « Tu ne te hâtes pas plus que le Très-Haut »'
  alternative: 'Question rhétorique : « Te hâtes-tu plus que le Très-Haut ? »'
  rationale: Le latin non festinas tu n’emploie pas de marque interrogative, contrairement au Nonne explicite de la dernière phrase. La déclaration doit donc être conservée.
- issue: Ellipse dans « nam excelsus pro multis »
  choice: 'Rétablir le verbe sous-entendu : « le Très-Haut se hâte pour beaucoup »'
  alternative: « mais [l’empressement] du Très-Haut est pour beaucoup »
  rationale: Le parallélisme avec festinas permet de suppléer naturellement le même verbe, sans ajouter de contenu doctrinal.
- issue: État des justes après la mort
  choice: Conserver l’expression imagée « âmes… dans leurs réserves » avec une note
  alternative: Interpréter promptuariis par « demeures », « chambres » ou « lieux d’attente »
  rationale: Le latin affirme une localisation mais n’en explique ni la nature ni le statut; une traduction plus interprétative résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. « Se hâter » maintient le parallélisme verbal du latin. La ponctuation distingue la première affirmation de la question finale explicitement marquée dans la source.
