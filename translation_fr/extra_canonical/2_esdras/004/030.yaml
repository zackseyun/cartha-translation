  yaml_path: translation/extra_canonical/2_esdras/004/030.yaml
  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: fr
  text: Car un grain de mauvaise semence a été semé dès le commencement dans le cœur d’Adam, et toute l’impiété qu’il a produite jusqu’à présent, et qu’il produira encore jusqu’à ce que vienne l’aire de battage ! Mais réfléchis en toi-même au grain du mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: granum seminis mali
  choice: un grain de mauvaise semence
  rationale: Reproduit l’image agricole et la relation littérale entre « grain », « semence » et « mauvaise », sans réduire d’emblée l’expression à une abstraction.
- source_word: in corde Adam
  choice: dans le cœur d’Adam
  rationale: Rend directement l’anthropologie biblique du « cœur », siège intérieur de la pensée et de la volonté.
- source_word: impietatis
  choice: d’impiété
  rationale: Conserve la portée religieuse et morale du latin, plutôt que le terme plus général « méchanceté ».
- source_word: area
  choice: l’aire de battage
  rationale: Explicite en français moderne le sens agricole de « area » tout en préservant l’image eschatologique du texte.
- source_word: Aestima autem apud te
  choice: Mais considère en toi-même
  rationale: Rend l’injonction à une réflexion intérieure ; « considère » reste digne et naturel.
- source_word: granum mali
  choice: le grain du mal
  rationale: Distingue cette formulation de « mauvaise semence » et conserve l’ambiguïté condensée du génitif latin.
theological_decisions:
- issue: Nature et transmission du mal à partir d’Adam
  choice: Conserver l’image d’un grain semé dans le cœur d’Adam qui produit l’impiété
  alternative: Paraphraser en termes de péché originel héréditaire
  rationale: Le texte emploie une métaphore et ne définit pas précisément le mécanisme théologique ; la traduction ne doit pas imposer une doctrine ultérieure.
- issue: Portée eschatologique de « jusqu’à ce que vienne l’aire »
  choice: Garder l’image de l’aire de battage sans l’interpréter dans le corps du texte
  alternative: Traduire explicitement par « jusqu’au jugement »
  rationale: L’image peut évoquer le jugement ou la moisson finale, mais le latin conserve la métaphore ; il convient d’en préserver la tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation répartit la longue période latine en phrases naturelles tout en gardant son mouvement rhétorique. Le dernier membre, possiblement lié à la suite du passage, demeure volontairement abrupt comme dans la source transmise.
