source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possibile est, et si idoneus sum, Demonstra mihi et hoc, si plus quam praeteriit habet uenire, aut plura pertransierunt super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
translation:
  language: fr
  text: '« Si cela est possible et si j’en suis capable, montre-moi encore ceci : y a-t-il davantage à venir que ce qui est passé, ou bien davantage est-il passé sur nous[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le texte latin, le mot traduit par « nous » se trouve au début du verset suivant et complète « sur » à la fin de ce verset.
    reason: Signaler honnêtement l’enjambement syntaxique et la limite éditoriale des versets.
lexical_decisions:
- source_word: possibile est
  choice: cela est possible
  rationale: Reproduit directement la condition latine sans préciser ce qui serait possible au-delà du contexte.
- source_word: idoneus sum
  choice: j’en suis capable
  rationale: Rend l’aptitude exprimée par idoneus dans un français naturel, sans introduire explicitement une notion de mérite ou de dignité.
- source_word: plus quam praeteriit habet uenire
  choice: y a-t-il davantage à venir que de temps écoulé
  rationale: Conserve la comparaison entre l’avenir et le temps déjà passé, tout en explicitant en français que l’ellipse porte sur une quantité de temps.
- source_word: plura pertransierunt super [nos]
  choice: davantage s’est-il écoulé sur nous
  rationale: Préserve l’image latine et son probable arrière-plan sémitique plutôt que de la remplacer par la formulation symétrique « davantage s’est-il écoulé qu’il n’en reste à venir ».
theological_decisions:
- issue: Sens de idoneus
  choice: capable
  alternative: digne
  rationale: Le latin peut évoquer l’aptitude ou la qualification. « Capable » maintient ici le sens fonctionnel sans transformer la demande en affirmation explicite de mérite spirituel.
- issue: Complément de super à la limite des versets
  choice: sur nous, avec note
  alternative: laisser « sur… » en suspens à la fin du verset
  rationale: Le nos qui complète naturellement super se trouve au début du verset 46 dans le témoin latin. L’intégrer donne une phrase française intelligible tout en signalant la particularité textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La question comparative reste volontairement tendue et l’expression imagée « s’écouler sur nous » est conservée malgré son caractère moins idiomatique en français.
