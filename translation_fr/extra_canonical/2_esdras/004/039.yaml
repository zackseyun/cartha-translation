  yaml_path: translation/extra_canonical/2_esdras/004/039.yaml
  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
translation:
  language: fr
  text: Nous sommes tous remplis d’impiété. Et, de peur que l’aire de battage des justes ne soit retenue à cause de nous, à cause des péchés de ceux qui y habitent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietatem
  choice: impiété
  rationale: Équivalent direct qui conserve la portée morale et religieuse du latin.
- source_word: prohibeatur
  choice: est retenue
  rationale: Rend le sens de ce qui est empêché, entravé ou maintenu en arrière, sans le réduire à un simple retard temporel.
- source_word: iustorum area
  choice: l’aire de battage des justes
  rationale: Conserve l’image agricole explicite de « area » et le génitif « des justes ».
- source_word: inhabitantium
  choice: ceux qui y habitent
  rationale: Reproduit le participe substantivé et laisse le référent spatial implicite, comme dans le latin.
theological_decisions:
- issue: Nature de l’empêchement touchant l’aire des justes
  choice: est retenue
  alternative: est retardée
  rationale: Le latin « prohibeatur » exprime d’abord l’idée d’empêcher ou de retenir. « Retardée » expliciterait une dimension temporelle possible, mais plus étroite.
- issue: Référent de « ceux qui habitent »
  choice: ceux qui y habitent
  alternative: les habitants de la terre
  rationale: Le latin ne précise pas « la terre »; la traduction évite donc d’ajouter un référent cosmologique absent du texte.
translation_notes:
  register: Français moderne, courant et digne. L’expression « aire de battage » explicite le sens agricole de « aire », aujourd’hui potentiellement ambigu en français, tout en préservant la métaphore du texte.
