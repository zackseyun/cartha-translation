revisions:
- from: Nous sommes tous remplis d’impiété. Et peut-être qu’à cause de nous l’aire de battage des justes est retenue[a], à cause des péchés de ceux qui y habitent.
  to: Nous sommes tous remplis d’impiété. Et, de peur que l’aire de battage des justes ne soit retenue à cause de nous, à cause des péchés de ceux qui y habitent.
  rationale: La révision restitue la force préventive de « ne forte » et emploie le subjonctif français requis après « de peur que ». Elle conserve l’image agricole, les deux compléments causaux et l’indétermination du lieu ou du groupe désigné par « inhabitantium ».
