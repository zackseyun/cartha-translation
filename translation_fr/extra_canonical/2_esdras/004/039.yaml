source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos omnes pleni sumus impietatem. Et ne forte propter nos prohibeatur iustorum area, propter peccata inhabitantium
  language: Latin
base_translation:
