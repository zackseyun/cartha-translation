  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: fr
  text: « Jusqu’à quand, et quand ces choses arriveront-elles ? Pourquoi nos années sont-elles peu nombreuses et mauvaises ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quo et quando haec?
  choice: « Jusqu’à quand, et quand ces choses arriveront-elles ? »
  rationale: Le latin est elliptique. La formulation française explicite seulement le verbe sous-entendu, tout en conservant les deux interrogations temporelles distinctes.
- source_word: modici
  choice: « peu nombreuses »
  rationale: Pour des années, cette expression rend naturellement l’idée de petit nombre ou de faible quantité.
- source_word: mali
  choice: « mauvaises »
  rationale: Ce choix direct préserve la portée large et la tension du latin, sans réduire le sens à « difficiles », « malheureuses » ou « pénibles ».
theological_decisions:
- issue: Portée de la plainte sur les années humaines
  choice: 'Conserver l’énoncé ouvert : « nos années […] mauvaises »'
  alternative: Interpréter comme « nos années sont courtes et pénibles »
  rationale: Le latin qualifie les années de modici et mali sans expliquer si le mal désigne la souffrance, la corruption morale ou la condition présente; la traduction ne tranche donc pas.
translation_notes:
  register: Français moderne, digne et intelligible. L’ellipse latine est légèrement développée pour former une question grammaticale en français. La formule introductive de l’anglais (« Et je répondis et dis ») n’est pas ajoutée, puisqu’elle ne figure pas dans le texte latin fourni; le « Et » final paraît appartenir à la suite et n’est pas intégré à cette phrase.
