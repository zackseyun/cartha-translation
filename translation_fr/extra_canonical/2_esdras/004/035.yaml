base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/035.yaml
  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
translation:
  language: fr
  text: 'Les âmes des justes n’ont-elles pas posé ces questions dans leurs chambres[a], en disant : « Jusqu’à quand espérerai-je ainsi ? »[b] Et quand viendra le fruit de l’aire de notre récompense ? » Jérémiel leur répondit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut évoquer des « réserves » ou des lieux où les âmes sont gardées jusqu’à ce que le nombre fixé soit complet ; cette image prépare la comparaison avec l’accouchement aux versets 40-42.
    reason: cross_reference
  - marker: b
    text: 'Le latin porte au singulier : « Jusqu’à quand espérerai-je ainsi ? » Certains autres témoins anciens ont le pluriel, qui s’accorde avec « les âmes » et « notre récompense » : « Jusqu’à quand espérerons-nous ainsi ? »'
    reason: textual_variant
lexical_decisions:
- source_word: suis
  choice: leurs chambres
  rationale: Le possessif latin substantivé reprend vraisemblablement le lieu où les âmes sont gardées dans le contexte antérieur. « Chambres » reste naturel en français tout en permettant à la note de signaler l’image possible de lieux de réserve.
- source_word: usquequo spero sic?
  choice: Jusqu’à quand espérerai-je ainsi ?
  rationale: Conserve le singulier surprenant de spero plutôt que de le corriger silencieusement, ainsi que la valeur concise de sic.
- source_word: fructus areae mercedis nostrae
  choice: le fruit de l’aire de notre récompense
  rationale: Maintient l’image agricole et l’enchaînement génitif du latin sans transformer l’aire en simple métaphore abstraite.
- source_word: Hieremiel
  choice: Jérémiel
  rationale: Forme française transparente du nom propre latin.
theological_decisions:
- issue: Le nombre grammatical dans la parole des âmes
  choice: 'Singulier : « espérerai-je »'
  alternative: 'Pluriel : « espérerons-nous »'
  rationale: Bien que les locutrices soient les âmes au pluriel et qu’elles parlent ensuite de « notre récompense », le témoin latin porte explicitement spero au singulier. La traduction conserve cette tension textuelle et la signale en note.
- issue: Le lieu où se trouvent les âmes justes
  choice: « chambres » dans le texte, avec explication en note
  alternative: « réserves » ou « lieux de dépôt »
  rationale: Le contexte évoque des âmes gardées jusqu’au temps fixé. « Chambres » est idiomatique et digne, tandis que la note préserve l’arrière-plan de l’image de stockage sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La question rhétorique et l’image de l’aire sont conservées. Le deux-points final respecte le caractère introductif de la dernière proposition, dont la réponse suit au verset suivant.
