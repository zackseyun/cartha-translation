  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
translation:
  language: fr
  text: Mais maintenant, je ne t’ai interrogé que sur le feu, le vent et le jour, par lesquels tu es passé et sans lesquels tu ne peux exister, et tu ne m’as pas répondu à leur sujet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nunc autem
  choice: Mais maintenant
  rationale: Rend naturellement le contraste et le repère temporel du latin.
- source_word: non interrogaui te nisi de
  choice: je ne t’ai interrogé que sur
  rationale: Reproduit la tournure restrictive latine sans lourdeur.
- source_word: die
  choice: le jour
  rationale: Correspondance directe avec le latin « die », compris comme le jour.
- source_word: per quae transisti
  choice: par lesquels tu es passé
  rationale: Conserve l’image et la relation exprimées par « per » tout en accordant le relatif avec les trois réalités énumérées.
- source_word: sine quibus esse non potes
  choice: sans lesquels tu ne peux exister
  rationale: Rend « esse » dans son sens existentiel et préserve l’affirmation forte du texte.
- source_word: non respondisti mihi de eis
  choice: tu ne m’as rien répondu à leur sujet
  rationale: Formulation française idiomatique qui conserve le destinataire « mihi » et le thème « de eis ».
theological_decisions:
- issue: Portée de l’impossibilité exprimée par « sine quibus esse non potes »
  choice: sans lesquels tu ne peux exister
  alternative: sans lesquels tu ne peux vivre
  rationale: « Exister » reste plus proche de « esse » et évite de réduire l’énoncé à la seule survie physique.
translation_notes:
  register: Français moderne, clair et digne. La longue coordination du latin est conservée afin de maintenir la progression argumentative et la continuité du discours avec le verset suivant.
