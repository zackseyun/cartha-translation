  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
translation:
  language: fr
  text: 'Tu me dirais peut-être : « Je ne suis pas descendu dans l’abîme, ni ne suis encore descendu dans le séjour des morts, ni ne suis jamais monté au ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dicebas fortassis mihi
  choice: Tu m’aurais peut-être dit
  rationale: Le conditionnel passé rend naturellement en français la suggestion hypothétique exprimée par « fortassis » dans ce contexte.
- source_word: abyssum
  choice: l’abîme
  rationale: Traduction directe qui conserve l’image cosmologique et la distingue du séjour des morts.
- source_word: infernum
  choice: le séjour des morts
  rationale: Expression française claire et digne, sans les résonances mythologiques possibles de « Hadès » ni l’idée punitive plus étroite que peut suggérer « enfer ».
- source_word: caelis
  choice: au ciel
  rationale: Le pluriel latin peut désigner le domaine céleste; le singulier collectif est l’expression française la plus naturelle ici.
theological_decisions:
- issue: Distinction entre abyssum et infernum
  choice: 'Maintenir deux réalités distinctes : « l’abîme » et « le séjour des morts »'
  alternative: Fondre les deux expressions ou traduire infernum par « l’enfer »
  rationale: La coordination latine distingue explicitement les deux lieux; « séjour des morts » préserve cette distinction sans imposer la notion d’un lieu de châtiment.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « ni » et la progression descendre/monter conservent la structure rhétorique du latin.
