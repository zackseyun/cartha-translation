  text: And they will tear down cities and walls, mountains and hills, trees of the forests and grass of the meadows.
translation:
  language: fr
  text: Ils détruiront les villes et les murailles, les montagnes et les collines, les arbres des forêts et l’herbe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  choice: démoliront
  rationale: Rend directement le futur latin et conserve la force destructrice du verbe pour toute l’énumération.
- source_word: ciuitates et muros
  choice: les villes et les murailles
  rationale: Traduction naturelle et précise des deux réalités distinctes.
- source_word: montes et colles
  choice: les montagnes et les collines
  rationale: Maintient le contraste d’échelle du texte latin.
- source_word: ligna siluarum
  choice: les arbres des forêts
  rationale: Dans ce contexte de destruction du paysage, ligna désigne naturellement les arbres ou le bois sur pied des forêts.
- source_word: fena
  choice: les herbes
  rationale: Le pluriel latin peut désigner l’herbe ou le foin; « les herbes » convient mieux à l’énumération des éléments du paysage sans ajouter les « prés », absents du texte fourni.
theological_decisions:
- issue: Référent du sujet sous-entendu de « demolient »
  choice: Elles
  alternative: Ils
  rationale: Le sujet n’est pas exprimé dans cette phrase latine. Le féminin pluriel renvoie naturellement aux « eaux » (aquarum) mentionnées juste avant, tout en laissant intacte l’image du jugement destructeur.
translation_notes:
  register: Français moderne, clair et digne. L’énumération serrée du latin est conservée. La proposition précédant le point (« campi et omnes ruii plenitudine aquarum illarum ») est traitée comme la fin du verset antérieur, conformément à la délimitation fournie pour 2 Esdras 15:42.
