  text: Babylonem et exterent eam. Conuenient ad ipsam et circuibunt eam et effundent sidus et omnem iram super eam, et subibit puluis et fumus usque ad caelum, et omnes in circuitu lugebunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
translation:
  language: fr
  text: Babylone, et ils la détruiront. Ils se rassembleront contre elle, l’encercleront et déverseront sur elle une tempête[a] et toute la colère. La poussière et la fumée monteront jusqu’au ciel, et tous ceux des alentours se lamenteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un astre ». Le mot latin peut désigner un astre ou, dans certains contextes, un phénomène céleste ou météorologique.
    reason: ambiguïté lexicale de sidus
lexical_decisions:
- source_word: exterent
  choice: détruiront
  rationale: Le verbe latin exterere exprime ici l’anéantissement ou la destruction; « détruiront » est naturel et suffisamment fort en français moderne.
- source_word: Conuenient ad ipsam
  choice: Ils se rassembleront contre elle
  rationale: Dans ce contexte hostile, convenire ad désigne le fait de converger ou de se réunir contre Babylone.
- source_word: circuibunt eam
  choice: l’encercleront
  rationale: Cette formulation concise rend l’action de faire le tour de la ville afin de l’entourer.
- source_word: sidus
  choice: une tempête
  rationale: Bien que sidus signifie couramment « astre », il peut évoquer un phénomène céleste ou météorologique; avec effundent et ira dans un contexte de jugement, « tempête » produit le sens contextuel le plus cohérent sans masquer l’ambiguïté, signalée en note.
- source_word: omnem iram
  choice: toute leur colère
  rationale: Le possessif implicite identifie naturellement la colère à celle des assaillants; il évite en français une tournure abstraite et raide.
- source_word: omnes in circuitu
  choice: tous ceux des alentours
  rationale: Cette expression désigne naturellement les personnes qui se trouvent autour de Babylone.
theological_decisions:
- issue: Nature du sidus déversé sur Babylone
  choice: une tempête
  alternative: un astre
  rationale: Le contexte annonce un jugement destructeur accompagné de poussière et de fumée. Le sens météorologique est donc privilégié, mais le sens lexical littéral reste possible et est conservé en note plutôt que résolu dogmatiquement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe initiale abrupte (« Babylone, et… ») est conservée parce que le verset commence au milieu d’une construction répartie par la versification; elle reflète fidèlement le segment latin fourni.
