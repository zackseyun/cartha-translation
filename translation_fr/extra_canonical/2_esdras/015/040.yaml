  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
translation:
  language: fr
  text: Alors s’élèveront de grands et puissants nuages pleins de colère, et un astre, afin d’exterminer toute la terre et ceux qui l’habitent ; et ils déverseront un astre terrifiant sur tout lieu haut et élevé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exaltabuntur
  choice: s’élèveront
  rationale: Rend naturellement le passif latin tout en conservant l’image d’une montée dans le ciel.
- source_word: nubes magnae et validae
  choice: de grands et puissants nuages
  rationale: « Puissants » traduit validae dans ce contexte menaçant, sans réduire le terme à la seule taille.
- source_word: plenae irae
  choice: pleins de colère
  rationale: Reproduit la construction latine et son image de colère accumulée.
- source_word: sidus
  choice: astre
  rationale: Terme français assez large pour préserver la portée de sidus sans préciser indûment « étoile ».
- source_word: exterant
  choice: exterminer
  rationale: Le texte nettoyé paraît refléter une forme fautive ou altérée ; le contexte et la tradition de traduction indiquent l’idée d’anéantir ou de détruire complètement.
- source_word: fundent
  choice: déverseront
  rationale: Conserve l’image concrète de verser depuis les nuages, malgré l’association inhabituelle avec un astre.
- source_word: super omnem altum et eminentem
  choice: sur tout lieu élevé et dominant
  rationale: Le latin transmis est elliptique ; l’ajout minimal de « lieu » produit un français intelligible tout en conservant les deux adjectifs.
theological_decisions:
- issue: Rapport grammatical entre les nuages, la colère et l’astre
  choice: Les nuages sont pleins de colère, tandis que l’astre est un second sujet de « s’élèveront ».
  alternative: Comprendre que les nuages sont pleins à la fois de colère et d’un astre.
  rationale: Plenae régit le génitif irae, tandis que sidus est au nominatif neutre et fonctionne donc comme sujet coordonné à nubes.
- issue: Identité de l’astre terrifiant
  choice: Ne pas l’identifier à une personne, un ange ou un phénomène précis.
  alternative: Interpréter l’astre selon une lecture eschatologique particulière.
  rationale: Le texte ne fournit pas cette identification ; la traduction préserve donc l’imagerie et sa tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe apocalyptique et l’image étrange d’un astre « déversé » sont conservées plutôt que rationalisées.
