  text: et isti turbabuntur et silebunt in virtute illorum et convertent pedes suos in fugam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/032.yaml
  text: then these will be thrown into confusion and fall silent because of their strength[a], and they will turn their feet to flight.
translation:
  language: fr
  text: Alors ceux-ci seront plongés dans la confusion et se tairont à cause de leur puissance[a] ; ils prendront la fuite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant leur puissance ».
    reason: Le latin « in virtute illorum » peut exprimer la circonstance devant laquelle ils se taisent; dans le contexte, le sens causal est retenu dans le texte.
lexical_decisions:
- source_word: turbabuntur
  choice: seront plongés dans la confusion
  rationale: Le futur passif de « turbo » exprime ici le bouleversement et la confusion ; cette formulation conserve la voix passive tout en restant naturelle.
- source_word: silebunt
  choice: resteront sans voix
  rationale: Le futur actif de « sileo » signifie qu’ils se tairont ou resteront silencieux, sans suggérer qu’une force extérieure les réduira grammaticalement au silence.
- source_word: in virtute illorum
  choice: devant leur puissance
  rationale: Dans ce contexte, « in » avec l’ablatif indique la circonstance ou la cause face à laquelle ils restent sans voix. « Devant » rend naturellement leur réaction à cette puissance, tout en laissant en note la lecture causale plus explicite.
- source_word: convertent pedes suos in fugam
  choice: ils prendront la fuite
  rationale: L’expression latine, littéralement « tourneront leurs pieds vers la fuite », est une tournure idiomatique signifiant se mettre à fuir.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve le passif de « turbabuntur » et l’actif de « silebunt », tout en rendant idiomatiquement l’image finale de la fuite.
