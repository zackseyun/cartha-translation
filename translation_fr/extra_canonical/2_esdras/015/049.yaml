- from: 'Dieu dit : « Je ferai venir sur toi des malheurs : le veuvage, la pauvreté, la famine, l’épée et la peste, afin de dévaster tes maisons, en vue de leur profanation[a]… »'
  to: 'Dieu dit : « Je ferai venir sur toi des malheurs : le veuvage, la pauvreté, la famine, l’épée et la peste, afin de dévaster tes maisons, en vue de la violation[a]… »'
  rationale: La révision retire le possessif ajouté et remplace « profanation » par « violation », afin de reproduire plus exactement le nom abstrait latin uiolationem sans décider de son référent ni de sa nuance précise. Le parallélisme des deux groupes finals introduits par ad reste explicite.
