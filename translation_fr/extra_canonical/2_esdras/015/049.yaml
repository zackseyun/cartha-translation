review_pass:
  verdict: revise
  source_fidelity: Le rendu des fléaux et de la première proposition finale est fidèle. En revanche, « leur profanation » introduit un possessif absent du latin et impose un rattachement de « ad uiolationem » aux maisons, alors que le complément abstrait demeure syntaxiquement parallèle et que la phrase se poursuit au verset suivant. « Violation » est le correspondant le plus direct de uiolatio dans cette formulation inachevée.
  naturalness: Le français est globalement naturel et d’un registre biblique moderne. « En vue de la violation » est plus littéral et légèrement abrupt, mais cette abrupteté reflète la construction fragmentaire et suspendue du texte; une note peut l’expliciter sans ajouter de référent.
  terminology: « Veuvage », « pauvreté », « famine », « épée » et « peste » conviennent. « Dévaster » rend bien deuastare. Pour uiolatio, « violation » conserve l’abstraction et l’ambiguïté du latin mieux que « profanation », qui est plus étroit et suggère un objet sacré ou un lien explicite avec les maisons.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « leur profanation »
    rationale: Le possessif « leur » n’est pas exprimé dans ad uiolationem et fixe un antécédent que le latin ne précise pas dans ce verset. Il faut conserver l’expression abstraite non rattachée, la continuation syntaxique relevant du verset suivant.
  - severity: low
    issue: Note orientée vers « profanation »
    rationale: La note présente « violation » mais le texte principal choisit un terme plus interprétatif. L’harmonisation avec « violation » évite de réduire uiolatio à une profanation.
