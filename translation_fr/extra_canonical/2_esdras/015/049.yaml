  text: 'deus: Inmittam tibi mala, uiduitatem, paupertatem et famem et gladium et pestem ad deuastandas domus tuas, ad uiolationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
translation:
  language: fr
  text: 'Dieu dit : « Je ferai venir sur toi des malheurs : le veuvage, la pauvreté, la famine, l’épée et la peste, afin de dévaster tes maisons, en vue de la violation[a]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en vue de la violation ». Le latin présente ici un second complément de but, parallèle à « afin de dévaster tes maisons »; la phrase se poursuit au verset suivant.'
    reason: Conserver l’ambiguïté de « ad uiolationem » et signaler la structure parallèle ainsi que l’interruption de la phrase à la fin du verset.
lexical_decisions:
- source_word: Inmittam tibi mala
  choice: Je ferai venir sur toi des malheurs
  rationale: Rend l’action causative de « inmittam » et le pluriel général « mala » dans un français naturel et solennel.
- source_word: uiduitatem
  choice: le veuvage
  rationale: Équivalent direct de l’état de privation du conjoint exprimé par le latin.
- source_word: gladium
  choice: l’épée
  rationale: Conserve l’image biblique de l’épée comme fléau de guerre plutôt que de l’expliciter par « guerre ».
- source_word: pestem
  choice: la peste
  rationale: Terme français traditionnel et clair pour une épidémie meurtrière; il maintient la série nominale du latin.
- source_word: ad deuastandas domus tuas
  choice: afin de dévaster tes maisons
  rationale: Reproduit explicitement la première construction finale en « ad ».
- source_word: ad uiolationem
  choice: en vue de leur profanation
  rationale: Préserve la seconde expression finale parallèle et le sens de violation/profanation, sans la réduire à une simple manière de dévaster.
theological_decisions:
- issue: Agent des fléaux
  choice: Dieu est présenté comme celui qui les fait venir
  alternative: Formulation passive laissant l’agent implicite
  rationale: Le sujet « deus » et le verbe à la première personne « Inmittam » attribuent explicitement l’action à Dieu; cette tension ne doit pas être atténuée.
- issue: Rapport syntaxique de « ad uiolationem »
  choice: Maintien d’un second complément de but
  alternative: « pour dévaster tes maisons par la profanation »
  rationale: Les deux groupes introduits par « ad » sont parallèles; une tournure de moyen ou de manière obscurcirait cette structure, même si la phrase transmise reste inachevée ici.
translation_notes:
  register: Français international moderne, digne et accessible. La série des calamités et l’image de l’épée sont conservées. Les points de suspension indiquent que la proposition continue au verset suivant; « leur » explicite avec prudence le rattachement probable aux maisons, tandis que la note préserve la formulation abstraite du latin.
