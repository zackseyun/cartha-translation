  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: fr
  text: Que ceux qui cultivent la terre se lamentent, car leurs semences feront défaut, et leurs arbres seront ravagés par la rouille, la grêle et un astre terrifiant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cultores operantes terram
  choice: ceux qui cultivent la terre
  rationale: Rend directement l’expression latine sans la redondance peu naturelle « les cultivateurs qui travaillent la terre ».
- source_word: deficient semina eorum
  choice: leurs semences feront défaut
  rationale: Conserve le sens général de deficient sans préciser indûment si les graines manqueront, ne germeront pas ou si les récoltes échoueront.
- source_word: ligna eorum
  choice: leurs arbres
  rationale: Dans ce contexte agricole, ligna désigne naturellement les arbres plutôt que le bois comme matériau.
- source_word: uredine
  choice: la rouille
  rationale: Terme agricole courant pour une maladie ou flétrissure des végétaux; il préserve ici l’idée d’un fléau affectant les arbres.
- source_word: sidus terribile
  choice: un astre terrifiant
  rationale: « Astre » garde la portée assez large de sidus, sans réduire le référent à une étoile au sens astronomique moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’enchaînement prophétique et la triple cause de la dévastation sans expliquer la nature de l’astre.
