  source_fidelity: La première proposition rend correctement l’emphase de « vindicans vindicabo ». Dans la seconde, « demander compte » est un bon équivalent judiciaire de « accipiam ... sanguinem ... ex illis », mais « pour moi-même » est peu idiomatique en français et son rattachement à la demande de comptes demeure obscur. « Devant moi » rend naturellement la comparution et la responsabilité envers le Seigneur qu’exprime ici « ad me », sans spécifier la forme de la sanction.
  naturalness: Le registre est solennel et accessible. La formulation révisée évite la finale « pour moi-même », qui sonne comme un calque et peut suggérer un motif égoïste plutôt que la revendication judiciaire divine.
  terminology: « Venger » conserve la force rétributive de vindicare; « demanderai compte » exprime de façon naturelle l’exigence de responsabilité pour le sang innocent. « Sang innocent versé » est une explicitation contextuelle usuelle et fidèle.
