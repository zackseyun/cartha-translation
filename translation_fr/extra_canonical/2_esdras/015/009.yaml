source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vindicans vindicabo illos, dicit Dominus, et accipiam omnem sanguinem innocuum ex illis ad me.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/009.yaml
  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
translation:
  language: fr
  text: « Oui, je les vengerai[a], dit le Seigneur, et je leur demanderai compte, devant moi, de tout le sang innocent versé. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « En les vengeant, je les vengerai » ; cette répétition marque l’insistance.'
    reason: Préserver la forme emphatique inhabituelle du latin tout en donnant une traduction française naturelle dans le texte principal.
lexical_decisions:
- source_word: vindicans vindicabo
  choice: Oui, je les vengerai
  rationale: La répétition étymologique latine exprime une forte insistance. « Oui » la rend naturellement en français sans reproduire une tournure artificielle.
- source_word: accipiam ... sanguinem innocuum ex illis
  choice: je leur demanderai compte de tout le sang innocent répandu
  rationale: Dans ce contexte judiciaire, accipere sanguinem ex aliquibus évoque le fait d’exiger réparation ou de demander compte du sang versé. L’ajout explicatif « répandu » donne en français le sens idiomatique de « sang innocent » sans désigner simplement le liquide.
- source_word: ad me
  choice: pour moi-même
  rationale: Conserve la référence explicite à celui qui revendique ce sang, sans l’atténuer ni la résoudre théologiquement.
theological_decisions:
- issue: Nature de l’action divine exprimée par vindicare
  choice: les vengerai
  alternative: leur rendrai justice
  rationale: « Venger » préserve plus directement l’idée de vindicte ou de rétribution présente dans vindicare, tandis que « rendre justice » pourrait adoucir la tension du texte.
- issue: Sens judiciaire de la demande concernant le sang innocent
  choice: demanderai compte
  alternative: réclamerai
  rationale: « Demander compte » exprime l’imputation de la responsabilité pour le sang versé sans préciser indûment la forme du châtiment ou de la réparation.
translation_notes:
  register: Français international moderne, solennel mais accessible. La citation est formulée avec une syntaxe judiciaire naturelle ; l’emphase de la construction latine est conservée par « Oui » et documentée en note.
