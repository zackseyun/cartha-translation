    rationale: Elle traduit formellement « ad me », mais ne s’intègre pas naturellement à « demander compte de ». « Devant moi » exprime clairement, en français moderne, que les responsables devront répondre au Seigneur, tout en conservant le cadre judiciaire du verset.
