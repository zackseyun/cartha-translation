  text: and they will have plunder and wipe out the glory of your face.
translation:
  language: fr
  text: ils auront du butin et anéantiront la gloire de ton visage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praeda
  choice: du butin
  rationale: Rend directement le nom latin « praeda » dans son sens de biens pris par la force.
- source_word: habebunt
  choice: ils auront
  rationale: Conserve simplement le futur latin sans préciser davantage la manière dont le butin sera acquis.
- source_word: gloriam faciei tuae
  choice: la gloire de ton visage
  rationale: Maintient l’image corporelle et l’expression inhabituelle du latin plutôt que de l’interpréter comme honneur, beauté ou prestige.
- source_word: exterminabunt
  choice: anéantiront
  rationale: Exprime ici une destruction complète; le complément abstrait « gloire » appelle en français un verbe tel qu’« anéantir » plutôt que le faux ami moderne « exterminer ».
theological_decisions:
- issue: Sens de « la gloire de ton visage »
  choice: Conserver littéralement l’expression
  alternative: « anéantiront ta splendeur » ou « effaceront l’honneur qui se lit sur ton visage »
  rationale: Le latin reste susceptible d’évoquer la splendeur visible, la dignité ou l’honneur; la traduction ne tranche pas entre ces nuances.
translation_notes:
  register: Français moderne, sobre et digne. Le fragment commence en minuscule, car il poursuit syntaxiquement le verset ou la proposition précédente. Aucun marqueur de note n’est nécessaire.
