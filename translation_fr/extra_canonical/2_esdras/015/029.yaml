source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
translation:
  language: fr
  text: Des nations de dragons arabes sortiront sur de nombreux chars[a], et leur sifflement se fera entendre sur la terre à une journée de marche de distance[b], si bien que tous ceux qui les entendront seront saisis de peur et trembleront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression latine difficile peut se traduire littéralement par «nations de dragons arabes». L’image peut être symbolique, monstrueuse ou ethnographique, sans qu’on puisse aujourd’hui en retrouver le sens exact à partir du seul latin.
    reason: textual_variant
  - marker: b
    text: 'Le latin emploie ici une mesure de distance: le sifflement porte assez loin pour être entendu à une journée de marche.'
    reason: translation_clarity
lexical_decisions:
- source_word: nationes draconum Arabum
  choice: des nations de dragons arabes
  rationale: Cette traduction suit de près la formulation latine difficile sans préciser si l’image est symbolique, monstrueuse ou ethnographique.
- source_word: in curris multis
  choice: sur de nombreux chars
  rationale: Le latin désigne naturellement des chars ou véhicules à roues; «sur» convient au mouvement de sortie dans ce contexte.
- source_word: sibilatus eorum
  choice: leur sifflement
  rationale: Le singulier latin sibilatus évoque un sifflement collectif et menaçant.
- source_word: a die itineris
  choice: à une journée de marche de distance
  rationale: Dies itineris est une mesure de distance; avec a, l’expression indique la portée du bruit depuis cette distance, non le moment où il commence.
- source_word: timeant et trepidentur
  choice: seront saisis de peur et trembleront
  rationale: Rend les deux réactions coordonnées de façon naturelle tout en conservant leur intensification.
theological_decisions:
- issue: Identité des «dragons arabes»
  choice: Conserver l’expression imagée sans l’interpréter
  alternative: Identifier les dragons à un peuple, une armée ou des créatures précises
  rationale: Le latin ne permet pas de trancher sûrement entre une description symbolique, monstrueuse ou ethnographique.
translation_notes:
  register: Français moderne, clair et digne. La tournure prophétique est conservée, ainsi que l’étrangeté de l’image; la mesure antique de distance reste formulée en termes immédiatement compréhensibles.
