  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: fr
  text: Un homme n’aura aucune pitié de son prochain, mais il se précipitera contre leurs maisons avec l’épée,[a] pour piller leurs biens, à cause de la pénurie de pain et de la grande détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La syntaxe latine de cette proposition est difficile et peut refléter un texte altéré. On pourrait aussi comprendre qu’il détruira leurs maisons par l’épée.
    reason: Signaler l’incertitude de « ad irritum faciendum in domos eorum in gladium » sans imposer une reconstruction textuelle ni alourdir le texte principal.
lexical_decisions:
- source_word: non miserebitur homo proximo suo
  choice: Un homme n’aura aucune pitié de son prochain
  rationale: Rend directement la tournure latine au singulier et conserve l’idée d’absence de compassion envers autrui.
- source_word: ad irritum faciendum in domos eorum in gladium
  choice: mais il attaquera leurs maisons, l’épée à la main
  rationale: La proposition latine est difficile et probablement corrompue; « attaquera » exprime le mouvement hostile contre les maisons, tandis que « l’épée à la main » rend naturellement l’instrument ou la manière.
- source_word: ad diripiendas substantias eorum
  choice: pour piller leurs biens
  rationale: « Diripere » implique le pillage, et « substantiae » désigne ici les possessions ou les biens matériels.
- source_word: propter famem panis
  choice: à cause du manque de pain
  rationale: Évite le calque peu naturel « faim de pain » tout en conservant le sens d’une faim provoquée par la pénurie de nourriture.
- source_word: tribulationem multam
  choice: la grande détresse
  rationale: « Détresse » restitue ici une affliction grave et généralisée dans un français actuel et digne.
theological_decisions:
- issue: Valeur descriptive ou prescriptive de la violence
  choice: Formulation descriptive au futur
  alternative: Formulation pouvant être comprise comme une exhortation ou un ordre
  rationale: Le contexte grammatical annonce le comportement humain en temps de détresse; il ne commande ni n’approuve le pillage.
- issue: Passage du singulier au pluriel
  choice: Conserver « un homme / son prochain », puis « leurs maisons / leurs biens »
  alternative: Harmoniser entièrement au singulier ou au pluriel
  rationale: Le latin passe du singulier générique à un pluriel collectif. Le maintien de cette tension évite de préciser artificiellement l’identité des victimes.
translation_notes:
  register: Français international moderne, clair et solennel. La phrase garde le futur prophétique, la violence concrète du passage et le changement de nombre présent dans le latin, tout en évitant les calques opaques.
