source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut facies electis meis, dicit Dominus, sic faciet tibi Deus et tradet te in malis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
translation:
  language: fr
  text: Comme tu traites ceux que j’ai choisis, dit le Seigneur, ainsi Dieu te traitera et te livrera aux malheurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut facies ... sic faciet tibi
  choice: Comme tu traites… ainsi Dieu te traitera
  rationale: Le présent français rend naturellement la corrélation latine sicut… sic et la valeur générale ou imminente du futur latin facies/faciet, tout en conservant la réciprocité.
- source_word: electis meis
  choice: ceux que j’ai choisis
  rationale: Cette formulation courante et digne exprime clairement electis, participe substantivé, sans imposer le terme théologiquement plus marqué « élus ».
- source_word: tradet te
  choice: te livrera
  rationale: « Livrer » correspond directement à tradere et préserve l’idée d’abandon au pouvoir d’une réalité hostile.
- source_word: in malis
  choice: aux malheurs
  rationale: Dans ce contexte de jugement, mala désigne naturellement des calamités ou des malheurs. « Aux maux » serait plus littéral mais moins idiomatique et pourrait suggérer le mal moral.
theological_decisions:
- issue: Alternance entre « le Seigneur » et « Dieu »
  choice: 'Maintenir les deux désignations : « dit le Seigneur… Dieu te traitera »'
  alternative: Harmoniser les deux sujets en employant deux fois « le Seigneur »
  rationale: Le latin porte explicitement Dominus puis Deus. La variation doit être conservée plutôt que lissée.
- issue: Portée de electis meis
  choice: « ceux que j’ai choisis »
  alternative: « mes élus »
  rationale: Les deux lectures sont possibles, mais la formulation retenue reste proche du sens verbal du latin et évite d’ajouter une connotation doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et solennel. La structure corrélative du latin est conservée sans lourdeur. Aucune note n’est reprise de la couche anglaise, car sa note signale une ancienne traduction provenant en réalité du verset suivant et ne constitue pas une variante du texte source fourni.
