source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce ego convoco, dicit Deus, omnes reges terrae ad movendum, qui sunt a borea et a noto et ab euro et a libano, ad convertendos in se et reddere quae dederunt illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
translation:
  language: fr
  text: « Voici que je convoque, dit Dieu, tous les rois de la terre pour les mettre en mouvement, ceux du nord, du sud, de l’est et du sud-ouest[a], afin de les dresser les uns contre les autres et de leur faire rendre ce qu’ils leur ont donné. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin transmis porte « Liban ». Dans cette énumération des quatre vents ou directions, il s’agit vraisemblablement d’une corruption de « libo », le vent du sud-ouest.
    reason: Signaler honnêtement la leçon manuscrite tout en rendant dans le texte le sens probable de l’énumération directionnelle.
lexical_decisions:
- source_word: ecce
  choice: Voici que
  rationale: Conserve la particule de mise en relief et son ton solennel dans un français naturel.
- source_word: convoco
  choice: je convoque
  rationale: Rend directement l’idée d’appeler ou de rassembler avec autorité.
- source_word: ad movendum
  choice: pour les mettre en mouvement
  rationale: Le latin est elliptique; cette formulation restitue l’idée de provoquer leur mobilisation sans ajouter « eux-mêmes ».
- source_word: a borea et a noto et ab euro
  choice: du nord, du sud, de l’est
  rationale: Les noms de vents désignent ici les directions correspondantes; les points cardinaux sont plus transparents pour le lecteur moderne.
- source_word: a libano
  choice: du sud-ouest
  rationale: Dans cette série des quatre vents, « libano » est très probablement une corruption textuelle de « libo », représentant le grec λιβός, vent du sud-ouest. Une note conserve la leçon latine transmise.
- source_word: ad convertendos in se
  choice: afin de les retourner les uns contre les autres
  rationale: Respecte la forme passive ou causative du latin et comprend le réfléchi distributivement, sans effacer la tension quant à l’agent de l’action.
- source_word: reddere quae dederunt illis
  choice: de leur faire rendre ce qu’ils leur ont donné
  rationale: Suit au plus près la structure et les pronoms du latin, dont les référents demeurent ambigus.
theological_decisions:
- issue: Agent de l’affrontement entre les rois
  choice: « afin de les retourner les uns contre les autres »
  alternative: « afin qu’ils se retournent les uns contre les autres »
  rationale: Le gérondif adjectival passif « convertendos » favorise une action exercée sur les rois; la traduction ne transforme donc pas silencieusement cette action en initiative autonome de leur part.
- issue: Référents des pronoms dans la restitution
  choice: Conserver « leur » et « ils » sans explicitation
  alternative: Nommer les peuples ou les adversaires concernés
  rationale: Le verset latin ne précise pas clairement les référents; les identifier ajouterait une interprétation absente du texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe a été légèrement explicitée pour rendre lisible le latin elliptique, tout en maintenant l’ambiguïté des pronoms finaux et la tension causative du passage.
