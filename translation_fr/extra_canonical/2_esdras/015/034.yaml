base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/034.yaml
  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: fr
  text: Voici des nuées venant de l’est et du nord, s’étendant jusqu’au sud. Leur aspect est extrêmement terrifiant, chargé de colère et de tempête.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Voici
  rationale: Conserve la fonction présentative et l’appel soudain à l’attention.
- source_word: nubs
  choice: des nuées
  rationale: Le texte latin nettoyé présente vraisemblablement une graphie fautive ou abrégée de « nubes » ; « nuées » rend le pluriel et le registre visionnaire.
- source_word: ab oriente et a septentrione usque ad meridianum
  choice: venant de l’est et du nord, s’étendant jusqu’au sud
  rationale: Rend clairement l’origine indiquée par « ab/a » et l’extension exprimée par « usque ad », sans transformer les points cardinaux en régions précises.
- source_word: facies illorum
  choice: leur aspect
  rationale: Dans ce contexte, « facies » désigne l’apparence des nuées plutôt qu’un visage littéral ; le masculin latin « illorum » peut refléter un accord lié à la tradition textuelle sans devoir être reproduit en français.
- source_word: horrida valde
  choice: extrêmement terrifiant
  rationale: Exprime avec force l’intensification de « valde » et la qualité effrayante de « horrida » dans un français naturel.
- source_word: plena irae et procellae
  choice: chargé de colère et de tempête
  rationale: Conserve les deux génitifs coordonnés et leur imagerie, tout en accordant l’expression au nom français « aspect ».
theological_decisions:
- issue: Nature de la colère
  choice: colère
  alternative: fureur
  rationale: Le latin « ira » peut désigner la colère ou la fureur. « Colère » reste plus direct et ne précise pas à qui elle appartient, préservant ainsi l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuées » maintient une tonalité visionnaire, tandis que la syntaxe reste fluide. Aucun marqueur de note n’est requis.
