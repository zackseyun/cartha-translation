base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/025.yaml
  text: I will not spare them. Depart[a], you apostate children; do not defile my sanctification.
translation:
  language: fr
  text: Je ne les épargnerai pas. Partez, enfants apostats ! Ne souillez pas ce qui m’est consacré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin signifie littéralement « ma sanctification » ou peut désigner « ma chose sainte ». Dans ce contexte de souillure, il pourrait s’agir concrètement du sanctuaire, mais l’expression peut aussi englober plus largement ce qui relève de la sainteté de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: discedite
  choice: Partez
  rationale: Impératif pluriel direct et naturel, qui rend l’ordre de s’éloigner sans préciser une destination absente du latin.
- source_word: filii apostatae
  choice: enfants apostats
  rationale: Conserve le substantif filii et la désignation forte apostatae, sans ajouter un possessif absent du texte.
- source_word: sanctificationem meam
  choice: ce qui m’est consacré
  rationale: Formulation française naturelle qui préserve une portée plus large que « sanctuaire » et désigne ce qui relève de la sainteté de Dieu, tout en signalant en note le tour littéral inhabituel.
theological_decisions:
- issue: Référent de sanctificationem meam
  choice: ce qui m’est consacré
  alternative: mon sanctuaire / ma sanctification
  rationale: Le latin peut viser concrètement un lieu saint, mais ne l’impose pas explicitement. La traduction choisie évite de réduire l’expression au sanctuaire et ne transforme pas non plus le verset en énoncé abstrait sur l’acte de sanctification.
translation_notes:
  register: Français international moderne, direct et solennel. La ponctuation distingue les deux impératifs et restitue la vigueur de l’avertissement.
