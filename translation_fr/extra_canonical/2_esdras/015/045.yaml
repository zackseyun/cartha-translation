  text: And those who remain will serve those who terrified her.
translation:
  language: fr
  text: Et ceux qui resteront serviront ceux qui l’auront terrifiée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subremanserint
  choice: resteront
  rationale: Le verbe désigne ceux qui demeureront après les événements évoqués, sans ajouter explicitement l’idée de survie.
- source_word: seruient
  choice: serviront
  rationale: Rend directement le futur latin et le rapport de sujétion exprimé par le verbe.
- source_word: exteruerunt
  choice: auront terrifiée
  rationale: Le verbe latin signifie « terrifier, épouvanter », non « détruire ». Le futur antérieur français exprime naturellement l’action accomplie avant le service annoncé; le féminin reprend le pronom eam sous-entendu par l’anglais de consultation et le contexte immédiat.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La coordination initiale « Et » et la répétition de « ceux » conservent la structure du latin. Le premier « eam. » du segment fourni clôt vraisemblablement la phrase précédente et n’est donc pas répété dans ce verset, conformément à la délimitation attestée par le texte de consultation.
