  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/023.yaml
  text: And fire went out from his wrath and devoured the foundations of the earth[a], and sinners like straw set ablaze.
translation:
  language: fr
  text: 'Et un feu jaillit de sa colère : il dévora les fondements de la terre et les pécheurs comme de la paille enflammée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exiit ignis ab ira eius
  choice: un feu jaillit de sa colère
  rationale: « Jaillit » rend naturellement le mouvement de exiit avec un feu pour sujet, tandis que « de sa colère » conserve l’image où la colère est la source du feu.
- source_word: devoravit
  choice: il dévora
  rationale: Le verbe « dévorer » préserve l’image forte du latin et son aspect accompli.
- source_word: fundamenta terrae
  choice: les fondements de la terre
  rationale: Traduction directe qui conserve la portée cosmique de l’expression latine.
- source_word: peccatores
  choice: les pécheurs
  rationale: Équivalent français usuel et théologiquement neutre du terme latin.
- source_word: quasi stramen incensum
  choice: comme de la paille enflammée
  rationale: « Paille » est ici plus naturel que « chaume » et rend stramen; « enflammée » exprime incensum sans affaiblir l’image.
theological_decisions:
- issue: Rapport syntaxique entre « les fondements de la terre » et « les pécheurs »
  choice: Faire des deux groupes les compléments du verbe « dévora »
  alternative: Comprendre la comparaison comme portant plus largement sur l’ensemble de la scène ou marquer une rupture plus forte avant « les pécheurs »
  rationale: La coordination latine par et relie naturellement fundamenta terrae et peccatores comme deux objets de devoravit; quasi stramen incensum qualifie alors les pécheurs. Les deux-points après « colère » et l’absence de virgule avant « et » évitent de créer une ambiguïté artificielle.
translation_notes:
  register: Français moderne, international et digne. La formulation reste imagée et proche du latin, sans lourdeur littérale ni ajout explicatif.
