  text: ignem et grandinem et rompheas volantes et aquas multas, ut etiam impleantur omnes campi et omnes rivi a plenitudine aquarum illarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/041.yaml
  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
translation:
  language: fr
  text: du feu, de la grêle, des épées volantes et des eaux en abondance, si bien que même tous les champs et tous les cours d’eau seront remplis par l’abondance de ces eaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rompheas volantes
  choice: des épées volantes
  rationale: « Épées » restitue naturellement le terme latin dans ce contexte apocalyptique sans introduire la précision technique et anachronique de « larges épées » ; « volantes » est conservé directement.
- source_word: aquas multas
  choice: des eaux en abondance
  rationale: Cette tournure française naturelle rend la grande quantité exprimée par le latin, tout en maintenant l’image des eaux au pluriel.
- source_word: omnes rivi
  choice: tous les cours d’eau
  rationale: « Cours d’eau » couvre le sens de rivi — ruisseaux ou petites rivières — sans imposer une taille précise que le latin ne fixe pas.
- source_word: a plenitudine aquarum illarum
  choice: par l’abondance de ces eaux
  rationale: La formulation conserve l’idée que leur remplissage résulte de la masse surabondante des eaux annoncées.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et soutenu, avec conservation du rythme accumulatif et de l’imagerie apocalyptique. « Même » rend explicitement etiam et souligne que les champs, eux aussi, seront remplis.
