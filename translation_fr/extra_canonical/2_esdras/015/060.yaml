  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: fr
  text: Ils frapperont la ville insouciante et dévasteront une partie de ton pays. Lorsqu’ils reviendront de nouveau de Babylone dévastée, ils détruiront une part de ta gloire. Tu seras abattue par eux comme du chaume, et ils seront pour toi comme un feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait latin fourni s’interrompt au milieu de la dernière proposition après « et eux » ; la fin est donnée d’après la continuation attestée par la tradition textuelle consultée.
    reason: Signaler avec transparence que les derniers mots français complètent une phrase tronquée dans l’extrait latin transmis.
lexical_decisions:
- source_word: ciuitatem otiosam
  choice: la ville insouciante
  rationale: « Otiosam » peut désigner ce qui demeure oisif, tranquille ou sans souci. « Insouciante » conserve ici l’idée d’une ville vivant dans une sécurité inactive, tout en restant naturel en français.
- source_word: exterent
  choice: dévasteront
  rationale: Le verbe exprime l’action d’user, ravager ou détruire; « dévaster » convient à une portion de territoire.
- source_word: gloriae tuae
  choice: de ta gloire
  rationale: Maintien de l’image ouverte du latin, sans préciser s’il s’agit de prestige, de splendeur ou de puissance.
- source_word: demolita eris illis pro stipula
  choice: tu seras abattue par eux comme du chaume
  rationale: « Abattue » rend la destruction exprimée par « demolita », tandis que la comparaison avec le chaume est conservée sans l’expliciter.
