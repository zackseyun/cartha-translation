  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
translation:
  language: fr
  text: Les vents d’est se renforceront et l’enfermeront, ainsi que la nuée qu’il a soulevée dans sa colère[a]. Et l’astre destiné à provoquer la destruction sera violemment assailli par le vent d’est, le vent du sud et le vent d’ouest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset compte parmi les passages latins les plus difficiles du chapitre. Cette traduction comprend que des forces cosmiques sont enfermées et violemment bouleversées, mais la syntaxe et certains référents restent incertains.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « avec la nuée qu’il a soulevée dans sa colère ; et l’astre destiné à provoquer la destruction vers l’est et l’ouest sera jeté dans la confusion ».'
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent
  choice: se renforceront
  rationale: 'Rend naturellement le futur intensif du verbe latin : les vents gagneront en force.'
- source_word: recludent
  choice: l’enfermeront
  rationale: Conserve le sens de clôture ou d’enfermement, tout en laissant l’antécédent du pronom indéterminé comme dans le texte difficile.
- source_word: nubem quam suscitavit in ira
  choice: la nuée qu’il a soulevée dans sa colère
  rationale: Respecte l’accusatif « nubem », coordonné comme objet de « recludent », et maintient le registre cosmique et solennel.
- source_word: sidus ad faciendam exteritionem
  choice: l’astre destiné à provoquer la destruction
  rationale: « Astre » convient au registre apocalyptique de « sidus » ; la tournure finale exprime la destination ou la fonction.
- source_word: violabitur
  choice: sera violemment assailli
  rationale: Le passif indique que l’astre subit une action hostile ; cette formulation garde la force de « violare » sans imposer un sens physique trop précis.
- source_word: ab orientalem notum et occidentem
  choice: par le vent d’est, le vent du sud et le vent d’ouest
  rationale: Interprète « ab » comme marquant l’agent ou la provenance avec le passif, « notum » comme le Notus, vent du sud, et les autres directions comme des vents sous-entendus.
theological_decisions:
- issue: Référent de « eum » dans « recludent eum »
  choice: Maintenir le pronom « l’ » sans identifier son référent
  alternative: Préciser explicitement l’entité enfermée
  rationale: Le contexte fourni et la syntaxe latine ne permettent pas une identification certaine ; préserver cette ambiguïté évite une interprétation doctrinale ou narrative non fondée.
- issue: Nature de l’action exercée sur l’astre
  choice: « sera violemment assailli »
  alternative: « sera jeté dans la confusion »
  rationale: Le latin « violabitur » exprime plus directement une action violente subie que la seule confusion, tout en laissant ouverte la nature exacte du phénomène apocalyptique.
translation_notes:
  register: Français international moderne, digne et accessible, avec un registre apocalyptique soutenu. « Nuée » et « astre » préservent la tonalité biblique sans archaïsme excessif. Les incertitudes réelles du latin sont signalées plutôt que résolues artificiellement.
