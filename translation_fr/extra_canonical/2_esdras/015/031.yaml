source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et post haec supervalescet draco nativitatis memoria suae, et si converterint se conspirantes in virtute magna ad persequendos eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/031.yaml
  text: And after this the dragon[a], mindful of its origin, will prevail; and if they turn, conspiring in great force to pursue them[b],
translation:
  language: fr
  text: Après cela, le dragon, se souvenant de son origine, prendra le dessus[a] ; et s’ils se retournent, se rassemblant en grand nombre pour les poursuivre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition concernant « le dragon, se souvenant de son origine » est textuellement obscure. La traduction conserve cette image étrange au lieu de la remplacer par une conjecture plus fluide.
    reason: textual_variant
  - marker: b
    text: 'Ou : « s’ils font volte-face, se liguant en grande force pour les poursuivre ».'
    reason: translation_alternative
lexical_decisions:
- source_word: supervalescet
  choice: prendra le dessus
  rationale: Rend naturellement l’idée de devenir supérieur ou de prévaloir, tout en conservant le futur.
- source_word: nativitatis
  choice: origine
  rationale: Dans cette expression obscure, « origine » est plus naturel que « naissance » et peut désigner la provenance du dragon sans préciser davantage l’image.
- source_word: converterint se
  choice: font volte-face
  rationale: Le réfléchi latin exprime ici vraisemblablement l’action de se retourner ou de changer de direction; le présent français convient dans la subordonnée conditionnelle portant sur l’avenir.
- source_word: conspirantes
  choice: s’unissant
  rationale: Dans ce contexte militaire, le participe peut désigner ceux qui se liguent ou joignent leurs forces; « conspirant » suggérerait trop facilement un complot secret en français moderne.
- source_word: in virtute magna
  choice: avec une grande puissance
  rationale: Conserve la portée assez large de virtus, qui peut évoquer la force, la puissance ou les moyens militaires.
theological_decisions:
- issue: Identité et origine du dragon
  choice: Conserver l’image du « dragon » et la formule énigmatique « se souvenant de son origine »
  alternative: Identifier le dragon à une puissance historique précise ou reformuler « se souvenant de sa naissance »
  rationale: Le latin est obscur et ne justifie ni une identification doctrinale ou historique ajoutée, ni une résolution conjecturale de l’image.
- issue: Référents des pronoms
  choice: Conserver « ils » et « les » sans explicitation
  alternative: Nommer les groupes auxquels les pronoms renvoient
  rationale: Le verset isolé et le texte source laissent les référents implicites; les expliciter risquerait de trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Prendra le dessus » évite l’archaïsme de « prévaudra ». La phrase demeure inachevée par une virgule, conformément au texte transmis, qui se poursuit au verset suivant.
