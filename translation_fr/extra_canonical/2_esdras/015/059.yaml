lexical_decisions:
- source_word: primaria
  choice: à la tête
  rationale: Le latin transmis est inhabituel, mais primaria évoque ici la première place ou le premier rang. « À la tête » conserve ce sens sans ajouter le mot infelix, absent du texte fourni.
- source_word: accipies mala
  choice: tu subiras des malheurs
  rationale: Le sens littéral est « tu recevras des maux » ; « subir des malheurs » est plus naturel en français tout en gardant l'idée d'épreuves qui atteignent la destinataire.
- source_word: Et in transitu
  choice: Et en passant
  rationale: Traduction directe de la proposition inachevée, qui se poursuit dans le verset suivant.
