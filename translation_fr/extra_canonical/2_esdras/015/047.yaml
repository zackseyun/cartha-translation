source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: fr
  text: '[a] Malheur à toi, malheureuse, parce que tu t’es rendue semblable à elle et que tu as paré tes filles en vue de la prostitution, afin de plaire à tes amants et de tirer gloire d’eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin transmis commence ici par un eius isolé (« de lui » ou « d’elle »), qui paraît appartenir à la phrase précédente; il n’est donc pas intégré à la traduction de ce verset.
    reason: Signaler avec transparence un élément latin résiduel à la limite du verset, sans lui imposer un rattachement incertain.
lexical_decisions:
- source_word: misera
  choice: malheureuse
  rationale: Rend la détresse exprimée par le latin sans donner au mot le sens principalement moral ou injurieux que « misérable » peut avoir en français moderne.
- source_word: adsimilasti ei
  choice: tu t’es rendue semblable à elle
  rationale: Conserve le pronom féminin singulier et l’idée d’une assimilation volontaire, sans préciser davantage l’identité de la femme évoquée.
- source_word: ornasti filias tuas in fornicatione
  choice: tu as paré tes filles en vue de la prostitution
  rationale: Maintient l’image de la parure ainsi que le substantif fort « prostitution »; « en vue de » exprime naturellement la destination suggérée par la tournure latine.
- source_word: ad placendum et gloriandum in amatoribus
  choice: afin de plaire à tes amants et de tirer gloire d’eux
  rationale: Reproduit les deux finalités coordonnées. « Tirer gloire de » exprime idiomatiquement gloriari in sans ajouter l’idée absente que les amants la désiraient toujours.
theological_decisions:
- issue: Agent implicite de placendum et gloriandum
  choice: La femme apostrophée demeure l’agent implicite des deux actions.
  alternative: Comprendre que les filles sont parées afin qu’elles plaisent aux amants et tirent gloire d’eux.
  rationale: Les gérondifs latins expriment le but sans sujet explicite. La continuité avec le sujet de ornasti favorise la femme apostrophée, mais la formulation française évite toute expansion doctrinale ou narrative.
translation_notes:
  register: Français international moderne, digne et direct. L’apostrophe féminine est conservée. La répétition « Malheur… malheureuse » est assumée parce qu’elle reflète la force rhétorique du latin tout en restant intelligible.
