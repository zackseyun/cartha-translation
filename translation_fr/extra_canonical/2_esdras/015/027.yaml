source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: fr
  text: Car déjà des malheurs se sont abattus sur le monde, et vous resterez au milieu d’eux ; car Dieu ne vous délivrera pas, parce que vous avez péché contre lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: des malheurs
  rationale: Dans ce contexte de jugement et d’épreuves frappant le monde, « malheurs » exprime naturellement les calamités, sans réduire le terme au mal moral.
- source_word: orbem terrarum
  choice: le monde
  rationale: Équivalent français courant de l’expression latine désignant l’ensemble du monde habité.
- source_word: manebitis in illis
  choice: vous resterez au milieu d’eux
  rationale: Préserve l’idée de demeurer pris dans ces malheurs tout en évitant la tournure peu naturelle « rester en eux ».
- source_word: liberabit
  choice: délivrera
  rationale: Conserve le sens de délivrance ou de sauvetage dans un contexte théologique.
- source_word: peccastis in eum
  choice: vous avez péché contre lui
  rationale: Rend idiomatiquement en français l’hostilité ou l’offense exprimée par la construction latine avec « in ».
theological_decisions:
- issue: Lien entre le péché et l’absence de délivrance divine
  choice: 'Conserver explicitement le rapport causal : « parce que vous avez péché contre lui »'
  alternative: Atténuer en parlant seulement des conséquences de leurs actes
  rationale: Le latin établit directement la faute envers Dieu comme raison de la non-délivrance ; il ne faut ni adoucir ni développer cette affirmation.
translation_notes:
  register: Français moderne, clair et digne. La formulation garde le ton solennel d’un oracle de jugement tout en restant naturelle pour un lectorat général.
