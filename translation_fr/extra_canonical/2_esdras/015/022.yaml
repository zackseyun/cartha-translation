  text: non parcet dextera mea super peccantes nec cessabit romphea super effundentes sanguinem innocuum super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/022.yaml
  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
translation:
  language: fr
  text: Ma main droite n’épargnera pas les pécheurs, et l’épée ne cessera de s’abattre sur ceux qui répandent le sang innocent sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dextera mea
  choice: ma main droite
  rationale: Rend directement l’image latine de la puissance exécutant le jugement, sans la réduire à la seule idée de force.
- source_word: peccantes
  choice: les pécheurs
  rationale: Le participe substantivé désigne ceux qui pèchent; « les pécheurs » est naturel et fidèle dans ce contexte.
- source_word: romphea
  choice: l’épée
  rationale: Le terme, emprunté au grec rhomphaia, désigne ici l’arme du jugement. « Épée » évite une précision technique incertaine ou anachronique.
- source_word: cessabit … super
  choice: ne cessera de s’abattre sur
  rationale: Cette tournure française exprime naturellement l’action persistante de l’épée dirigée contre les coupables et conserve la valeur de super.
- source_word: effundentes sanguinem innocuum
  choice: ceux qui répandent le sang innocent
  rationale: « Répandre le sang » est l’équivalent idiomatique et solennel de l’expression latine désignant le fait de tuer.
theological_decisions:
- issue: Agent de l’épée du jugement
  choice: « l’épée », sans possessif ajouté
  alternative: « mon épée »
  rationale: Le latin porte simplement romphea, sans possessif. La traduction n’ajoute donc pas que l’épée appartient explicitement au locuteur.
- issue: Portée de peccantes
  choice: « les pécheurs »
  alternative: « ceux qui pèchent » ou « les coupables »
  rationale: Le texte présente une catégorie générale sans préciser ici la nature des péchés; la formulation conserve cette portée sans l’identifier exclusivement aux meurtriers de la seconde proposition.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition de « sur » reflète les deux emplois de super tout en restant naturelle grâce à la locution « s’abattre sur ».
