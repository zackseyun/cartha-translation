source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugeat Aegyptus et fundamenta eius a plaga verberati et mastigati quam inducet Dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/012.yaml
  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
translation:
  language: fr
  text: Que l’Égypte soit dans le deuil, ainsi que ses fondations, à cause du fléau des coups et de la flagellation que le Seigneur fera venir sur elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeat
  choice: soit dans le deuil
  rationale: Le subjonctif latin exprime ici une exhortation ou une annonce solennelle. « Être dans le deuil » rend naturellement le sens de lugere sans l’adoucir en simple tristesse.
- source_word: fundamenta eius
  choice: ses fondations
  rationale: Traduction directe qui conserve l’image des assises de l’Égypte, sans la remplacer par une interprétation telle que ses dirigeants ou ses institutions.
- source_word: plaga verberati et mastigati
  choice: le fléau des coups et de la flagellation
  rationale: 'Cette formulation préserve l’accumulation violente des termes latins : plaga désigne le fléau, tandis que verberati et mastigati évoquent les coups et l’action de fouetter.'
- source_word: inducet
  choice: fera venir sur elle
  rationale: « Fera venir » restitue le causatif latin ; « sur elle » explicite en français la destination du fléau, implicitement dirigé contre l’Égypte.
theological_decisions:
- issue: Le Seigneur comme agent du jugement
  choice: que le Seigneur fera venir sur elle
  alternative: qui viendra sur elle
  rationale: Le texte latin nomme explicitement le Seigneur comme celui qui fait venir le fléau ; la traduction conserve cette attribution sans l’atténuer.
translation_notes:
  register: Français international moderne, solennel et direct. La coordination « ainsi que ses fondations » garde l’étrangeté expressive de l’image latine, tandis que « flagellation » maintient la force physique et apocalyptique de mastigati.
