translation:
  language: fr
  text: et boiront leur propre sang, tenaillés par la faim faute de pain et par la soif faute d’eau. Malheureuse ! Tu viendras la première, et tu recevras de nouveau des malheurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a fame panis et siti aquae
  choice: tenaillés par la faim faute de pain et par la soif faute d’eau
  rationale: Cette formulation naturelle conserve le parallélisme latin entre la faim liée au manque de pain et la soif liée au manque d’eau.
- source_word: primaria
  choice: toi qui occupais le premier rang
  rationale: Le féminin latin, appliqué à l’Asie personnifiée, évoque sa prééminence ou son rang sans ajouter l’idée non exprimée d’un classement « parmi les femmes ».
- source_word: iterum
  choice: de nouveau
  rationale: Rend directement la répétition indiquée par le latin, sans préciser si elle est chronologique ou rétributive.
