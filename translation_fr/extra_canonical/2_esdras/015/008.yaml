  rationale: La révision rétablit les éléments lexicaux et rhétoriques que le latin exprime séparément, sans ajouter d’interprétation doctrinale. Elle conserve un français international moderne, solennel et lisible, ainsi que le parallélisme entre le sang et les âmes des justes.
