source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
translation:
  language: fr
  text: 'Je ne garderai plus le silence sur leurs impiétés, qu’ils commettent avec impiété, et je ne tolérerai pas ce qu’ils accomplissent injustement. Voici : le sang innocent et juste crie à moi, et les âmes des justes crient sans relâche.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietates
  choice: actes impies
  rationale: Le pluriel latin désigne ici des manifestations concrètes d’impiété; cette formulation est plus naturelle en français moderne que «impiétés» tout en conservant la portée morale et religieuse.
- source_word: inreligiose agunt
  choice: qu’ils commettent
  rationale: Le caractère impie est déjà exprimé par «actes impies»; rendre séparément inreligiose produirait une répétition lourde en français. «Commettre» convient à des actes répréhensibles.
- source_word: nec sustinebo
  choice: je ne supporterai plus
  rationale: Le futur latin exprime la fin de la tolérance divine; «plus» prolonge naturellement le «ne… plus» de la première proposition.
- source_word: in his quae inique exercent
  choice: leurs injustices
  rationale: Condensation idiomatique de la tournure latine «les choses qu’ils accomplissent injustement», sans en modifier le sens.
- source_word: ecce
  choice: Voici
  rationale: Conserve le marqueur solennel attirant l’attention.
- source_word: sanguis innoxius et iustus
  choice: le sang des innocents et des justes
  rationale: Le latin peut littéralement qualifier le sang d’«innocent et juste», mais il s’agit naturellement du sang versé de personnes innocentes et justes; la formulation française rend clairement cette valeur sans effacer les deux adjectifs.
- source_word: perseveranter
  choice: sans relâche
  rationale: Rend l’idée de persistance continue dans un français naturel et soutenu.
theological_decisions:
- issue: Le cri du sang et celui des âmes des justes
  choice: Conserver les deux images distinctes et leur adresse à Dieu
  alternative: Fusionner les deux en une évocation générale des victimes qui réclament justice
  rationale: Le texte présente explicitement le sang puis les âmes comme criant; conserver ce parallélisme maintient sa force théologique et intertextuelle sans l’expliquer ni l’harmoniser.
- issue: Valeur de «sanguis innoxius et iustus»
  choice: «le sang des innocents et des justes»
  alternative: «le sang innocent et juste»
  rationale: La traduction choisie explicite l’association du sang aux personnes mises à mort, lecture naturelle du latin, tout en préservant les catégories d’innocence et de justice.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel est maintenu par «Voici» et par le parallélisme des deux cris. Aucune note n’est nécessaire, car les nuances principales peuvent être rendues clairement dans le corps du texte.
