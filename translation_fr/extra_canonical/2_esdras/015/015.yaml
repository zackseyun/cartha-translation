source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
translation:
  language: fr
  text: Car l’épée et leur destruction se sont approchées ; une nation se dressera contre une autre pour combattre, et ils auront des épées en main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adpropinquavit
  choice: se sont approchées
  rationale: Le parfait latin exprime un événement déjà devenu imminent. L’accord au pluriel rend naturellement en français les deux sujets coordonnés, « l’épée » et « leur destruction ».
- source_word: extritio illorum
  choice: leur destruction
  rationale: 'Le génitif « illorum » dépend naturellement de « extritio » : il s’agit de la destruction qui les atteindra, non de l’épée qu’ils posséderaient.'
- source_word: exsurget gens contra gentem
  choice: une nation se dressera contre une autre
  rationale: Cette formulation conserve l’image du soulèvement hostile et rend idiomatiquement la répétition latine « gens… gentem ».
- source_word: romphea
  choice: épées à deux tranchants
  rationale: Le terme désigne une grande épée, souvent comprise comme une épée longue ou à deux tranchants. Cette solution la distingue de « gladius » sans employer le peu courant « espadon ».
- source_word: in manibus eorum
  choice: ils auront… entre les mains
  rationale: La proposition nominale latine est explicitée par un verbe en français tout en conservant l’image concrète des armes dans leurs mains.
theological_decisions:
- issue: Rapport du pronom « illorum » avec « gladius » et « extritio »
  choice: 'Le pronom qualifie la destruction : « leur destruction »'
  alternative: « leur épée et l’écrasement »
  rationale: La construction et le contexte de jugement soutiennent un génitif objectif lié à « extritio » ; l’épée s’approche comme instrument de leur destruction.
- issue: Valeur temporelle du parfait « adpropinquavit »
  choice: « se sont approchées »
  alternative: « sont proches »
  rationale: Le parfait souligne que l’approche a déjà eu lieu et que la menace est désormais imminente, sans réduire le sens à un simple état.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le point-virgule structure la longue coordination apocalyptique. « Se dresser contre » conserve la force de l’image sans archaïsme excessif.
