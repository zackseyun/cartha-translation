revisions:
- from: Car l’épée et leur destruction se sont approchées[a] ; une nation se dressera contre une autre pour combattre, et ils auront des épées à deux tranchants entre les mains.
  to: Car l’épée et leur destruction se sont approchées ; une nation se dressera contre une autre pour combattre, et ils auront des épées en main.
  rationale: La révision retire la précision non attestée « à deux tranchants » et supprime une note qui ne correspond pas à une ambiguïté sémantique pertinente. Le reste conserve le parfait de « adpropinquavit », le rattachement de « illorum » à « extritio », la répétition hostile entre nations et la présence des armes dans leurs mains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T22:08:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le génitif de « illorum » qualifie « extritio », et non « gladius », et l’annonce d’un conflit entre nations est conservée. Toutefois, « épées à deux tranchants » ajoute une caractéristique que le latin « romphea » ne précise pas. Le terme désigne une grande épée / une épée large, sans imposer le nombre de tranchants.'
  naturalness: La phrase est globalement naturelle en français moderne. « Ils auront des épées entre les mains » est compréhensible, mais « auront des épées en main » est plus idiomatique tout en gardant l’image. Le pluriel de « se sont approchées » est naturel en français avec deux sujets coordonnés, même si le latin emploie ici le singulier.
  terminology: « Leur destruction » rend correctement « extritio illorum ». « Épées » est un rendu sûr de « romphea »; l’ajout « à deux tranchants » doit être retiré. La note proposée ne signale pas une ambiguïté de traduction substantielle et avance une explication syntaxique non nécessaire.
  issues:
  - severity: medium
    issue: « Épées à deux tranchants » surinterprète « romphea ».
    rationale: Le latin n’indique pas que ces épées ont deux tranchants. Cette précision doit être évitée afin de ne pas ajouter un détail absent de la source.
  - severity: low
    issue: La note a est superflue et son explication du singulier latin est spéculative.
    rationale: La variante proposée n’apporte pas de sens distinct utile au lecteur; elle introduit plutôt une analyse grammaticale qui ne doit pas être présentée comme nécessaire au sens du verset.
  revised_text: Car l’épée et leur destruction se sont approchées ; une nation se dressera contre une autre pour combattre, et ils auront des épées en main.
