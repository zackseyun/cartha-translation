  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuis qui te cupierunt semper. Fornicarian odibilem imitata es in omnibus operibus eius et adinuentionibus eius; propterea dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: fr
  text: 'Tu as imité cette prostituée odieuse dans toutes ses œuvres et ses machinations ; c’est pourquoi il dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Fornicarian odibilem
  choice: cette prostituée odieuse
  rationale: Le latin désigne une femme qui se livre à l’inconduite sexuelle, avec une forte valeur péjorative. « Prostituée » est naturel en français et correspond au contexte transmis par la couche de consultation anglaise.
- source_word: adinuentionibus eius
  choice: ses machinations
  rationale: « Adinventiones » peut désigner des inventions, procédés ou desseins. Dans ce contexte accusateur, « machinations » rend clairement la nuance négative sans développer davantage le sens.
- source_word: propterea dicit
  choice: c’est pourquoi il dit
  rationale: Le texte latin fourni ne comporte pas de sujet explicite pour « dicit ». La traduction conserve cette indétermination au lieu d’ajouter « Dieu », comme le fait la couche anglaise.
theological_decisions:
- issue: Sujet sous-entendu du verbe « dicit »
  choice: il dit
  alternative: Dieu dit
  rationale: Le latin transmis dit seulement « propterea dicit ». Même si le contexte peut permettre d’identifier Dieu comme locuteur, le verset fourni ne le nomme pas ; conserver le pronom respecte l’ambiguïté textuelle.
translation_notes:
  register: Français moderne, soutenu mais accessible. La phrase initiale « tuis qui te cupierunt semper » semble appartenir à la fin du verset précédent dans la segmentation de la source et n’est donc pas intégrée à ce verset.
