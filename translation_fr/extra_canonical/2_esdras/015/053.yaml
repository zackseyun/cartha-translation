lexical_decisions:
- source_word: electos meos
  choice: mes élus
  rationale: Rend directement le latin et conserve la portée théologique du choix divin sans la préciser davantage.
- source_word: in omni tempore
  choice: tout au long de ce temps
  rationale: Exprime ici une action prolongée dans la durée, plus naturellement que le littéral « en tout temps ».
- source_word: exultans percussione manuum
  choice: exultant en battant des mains
  rationale: Dans ce contexte de joie malveillante, « battre des mains » restitue naturellement le geste décrit, sans l’aplatir en simple applaudissement.
- source_word: dicens super mortem eorum
  choice: parlant au sujet de leur mort
  rationale: Traduction volontairement proche de la formulation latine, dont le contenu des paroles n’est pas donné dans ce verset.
theological_decisions:
- issue: Désignation des victimes comme electi
  choice: mes élus
  alternative: ceux que j’ai choisis
  rationale: « Mes élus » est clair en français biblique moderne et préserve sans explication ajoutée l’idée d’une sélection divine.
- issue: Construction conditionnelle inachevée dans ce verset
  choice: Maintien de « Si » avec points de suspension
  alternative: Compléter la phrase à partir du verset suivant
  rationale: Le texte fourni s’arrête au milieu de la période conditionnelle; la traduction respecte cette limite sans importer les mots du verset 54.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe fragmentaire du verset latin est conservée; les points de suspension signalent la continuation sans ajouter le texte du verset suivant.
