  text: says the Lord[a], "If you had not killed my chosen ones all along, exulting with the striking of your hands and speaking over their death
translation:
  language: fr
  text: 'dit le Seigneur : « Si tu n’avais pas tué mes élus en tout temps, en te réjouissant et en battant des mains, et en parlant de leur mort… »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset suivant.
