source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Carmonii insanientes in ira exient de silva et advenient in virtute magna et constabunt in pugnam cum illis et vastabunt portionem terrae Assyriorum in dentibus suis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/030.yaml
  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
translation:
  language: fr
  text: Les Carmoniens[a], furieux de colère, sortiront de la forêt ; ils viendront avec une grande force, se rangeront pour le combat contre eux et ravageront de leurs dents une partie du pays des Assyriens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « Carmoniens » sont probablement les Carmaniens, peuple de la Carmanie, région de l’ancien empire perse.
    reason: Le latin transmis porte Carmonii, forme qui peut être une variante graphique de Carmanii ; la note conserve à la fois la leçon du texte et son identification historique probable.
lexical_decisions:
- source_word: Carmonii
  choice: les Carmoniens
  rationale: Translittération fidèle de la forme latine transmise, sans la normaliser silencieusement en « Carmaniens »; une note signale l’identification probable.
- source_word: insanientes in ira
  choice: en proie à une colère furieuse
  rationale: Rend l’idée d’une fureur déchaînée sous l’effet de la colère dans un français naturel et soutenu.
- source_word: in virtute magna
  choice: avec une grande puissance
  rationale: Conserve la portée large de virtus, qui désigne ici une puissance ou force considérable.
- source_word: constabunt in pugnam cum illis
  choice: prendront position pour les combattre
  rationale: Exprime l’établissement en ordre de bataille contre le groupe visé par « illis », tout en gardant le référent implicite du latin.
- source_word: in dentibus suis
  choice: de leurs dents
  rationale: Préserve l’image violente et inhabituelle du texte source sans l’expliquer ni l’atténuer.
