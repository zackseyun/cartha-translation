  yaml_path: translation/extra_canonical/2_esdras/015/061.yaml
  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: fr
  text: Ils seront pour toi un feu. Ils te dévoreront, toi, tes villes, ton pays et tes montagnes ; ils brûleront au feu toutes tes forêts et tous tes arbres fruitiers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  choice: Ils seront pour toi un feu
  rationale: Cette formulation conserve l’image prédicative du latin ainsi que la nuance relationnelle de tibi, sans ajouter « comme » ni expliciter « contre toi ».
- source_word: deuorabunt
  choice: dévoreront
  rationale: Le verbe français garde la force concrète et destructrice de deuorare.
- source_word: terram
  choice: pays
  rationale: Dans cette série associant la personne, ses villes et son territoire, « pays » exprime naturellement la terre qui lui appartient ou qu’elle habite.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et solennel. Le texte soumis traduit uniquement le latin fourni, qui s’arrête à « terram »; la suite présente dans la couche anglaise n’a pas été ajoutée sans source latine correspondante.
