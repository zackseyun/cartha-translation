source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce populus meus quasi grex ad occisionem ducitur. iam non patiar illum habitare in terra Aegypti,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/010.yaml
  text: Behold, my people are being led like a flock to the slaughter. I will no longer allow them to dwell in the land of Egypt,
translation:
  language: fr
  text: Voici que mon peuple est conduit comme un troupeau à l’abattoir. Je ne permettrai plus qu’il demeure dans le pays d’Égypte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Voici que
  rationale: Conserve la fonction solennelle d’appel à l’attention tout en restant naturelle en français.
- source_word: quasi grex ad occisionem
  choice: comme un troupeau à l’abattoir
  rationale: Rend directement l’image collective et la destination mortelle; «abattoir» exprime naturellement le lieu d’immolation en français moderne.
- source_word: ducitur
  choice: est conduit
  rationale: Préserve le passif latin et ne précise pas l’identité de ceux qui conduisent le peuple.
- source_word: iam non patiar
  choice: Je ne permettrai plus
  rationale: Rend le refus désormais affirmé par le locuteur, avec la valeur prospective naturelle du futur français.
- source_word: habitare
  choice: demeure
  rationale: «Demeurer» exprime ici le fait de résider durablement dans un pays, dans un registre digne et courant.
- source_word: terra Aegypti
  choice: pays d’Égypte
  rationale: Formulation biblique claire et naturelle qui conserve la référence territoriale du latin.
theological_decisions:
- issue: Agent implicite de la conduite vers la mort
  choice: Maintenir le passif «est conduit»
  alternative: Nommer les oppresseurs qui conduisent le peuple
  rationale: Le latin ne désigne pas l’agent; le rendre explicite résoudrait indûment une ambiguïté du texte.
- issue: Portée de la décision divine concernant l’Égypte
  choice: «Je ne permettrai plus qu’il demeure»
  alternative: «Je ne supporterai plus qu’il habite»
  rationale: Le contexte grammatical exprime plus naturellement la cessation d’une permission que l’impatience; aucune précision n’est ajoutée quant au moyen de la délivrance.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le singulier collectif «mon peuple» est repris par «il». La virgule finale est conservée puisque le verset se poursuit syntaxiquement.
