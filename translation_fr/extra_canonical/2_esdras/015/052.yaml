  text: Would I be so zealous against you[a], says the Lord,
translation:
  language: fr
  text: « Me montrerais-je ainsi jaloux de toi[a] ? » dit le Seigneur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut désigner un zèle jaloux, ici dans un contexte de jugement; il ne signifie pas nécessairement l’envie ou la possessivité au sens moderne.
    reason: Préserve l’amplitude de zelabo tout en signalant sa coloration hostile dans le contexte.
lexical_decisions:
- source_word: zelabo
  choice: m’indignerais-je
  rationale: Le futur latin de « zelare » exprime ici une ardeur hostile dans un contexte de jugement. « S’indigner contre » rend naturellement en français cette réaction ardente sans suggérer l’envie ou la jalousie possessive moderne.
- source_word: sic
  choice: ainsi
  rationale: Conserve la référence à la manière ou à l’intensité évoquée par le contexte.
- source_word: te
  choice: contre toi
  rationale: Avec le sens hostile de « zelabo », la préposition « contre » explicite la cible de l’indignation tout en respectant l’accusatif latin.
- source_word: Numquid
  choice: M’indignerais-je… ?
  rationale: La tournure interrogative française conserve la question rhétorique latine, qui appelle normalement une réponse négative.
theological_decisions:
- issue: Sens de la réaction divine exprimée par « zelabo »
  choice: indignation ardente dirigée contre l’interlocuteur
  alternative: jalousie divine à son sujet
  rationale: Le contexte judiciaire favorise l’idée d’un zèle courroucé plutôt que celle de l’envie. La variante est toutefois signalée afin de préserver l’amplitude sémantique de « zelare ».
- issue: Valeur temporelle de « zelabo »
  choice: conditionnel français « m’indignerais-je »
  alternative: futur « m’indignerai-je » ou conditionnel passé « me serais-je indigné »
  rationale: Dans cette question rhétorique liée à une condition contextuelle, le conditionnel présent rend le futur latin sans transformer l’action en irréel du passé.
translation_notes:
  register: Français moderne, digne et direct. La formulation évite l’expression peu naturelle « être zélé contre quelqu’un » tout en maintenant la question rhétorique et la tension sémantique du latin.
