  yaml_path: translation/extra_canonical/2_esdras/015/006.yaml
  text: because iniquity has spread over the whole earth[a], and their deeds have been filled up.
translation:
  language: fr
  text: C’est pourquoi l’iniquité s’est étendue sur toute la terre, et leurs actes ont atteint leur comble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter quod
  choice: C’est pourquoi
  rationale: Rend naturellement en français la relation de conséquence exprimée par le latin.
- source_word: superposuit iniquitas omnem terram
  choice: l’iniquité s’est étendue sur toute la terre
  rationale: Le verbe latin est inhabituel dans cette construction; «s’est étendue sur» conserve l’idée d’une iniquité qui gagne ou recouvre toute la terre sans forcer une image trop littérale.
- source_word: operationes eorum
  choice: leurs actes
  rationale: «Actes» rend operationes dans un contexte moral, sans ajouter l’adjectif «nuisibles», absent du texte latin fourni.
- source_word: adimpletae sunt
  choice: ont atteint leur comble
  rationale: Expression française idiomatique qui conserve l’idée d’accomplissement ou de plénitude du passif latin, plus naturellement que «ont été remplis» appliqué à des actes.
theological_decisions:
- issue: Sens de la plénitude des actes
  choice: ont atteint leur comble
  alternative: ont été menés à leur plein accomplissement
  rationale: La formulation retenue préserve l’idée que leurs actes sont parvenus à leur pleine mesure, sans préciser s’il s’agit d’un quota judiciaire, d’un achèvement historique ou d’une intensification morale.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et solennelle; aucune précision provenant d’une variante manuscrite («actes nuisibles») n’est importée.
