  text: Your children they will carry away captive, and your wealth they will take as spoil,
translation:
  language: fr
  text: Ils emmèneront tes fils en captivité et prendront tes richesses comme butin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: filios tuos
  choice: tes fils
  rationale: Le latin dit littéralement « tes fils » ; ce choix conserve la précision masculine du texte source plutôt que de l’élargir à « tes enfants ».
- source_word: captiuos ducent
  choice: emmèneront […] en captivité
  rationale: Cette formulation naturelle en français conserve l’idée d’êtres conduits au loin comme captifs.
- source_word: censum tuum
  choice: tes richesses
  rationale: Dans ce contexte de conquête et de pillage, « censum » désigne les biens ou la fortune de la personne interpellée ; « richesses » est clair et idiomatique.
- source_word: et censum tuum
  choice: et prendront tes richesses comme butin
  rationale: Le fragment latin fourni s’interrompt après le complément « tes richesses ». La formulation verbale est rétablie avec prudence d’après le contexte syntaxique et la couche anglaise auditée, qui explicite la prise comme butin.
