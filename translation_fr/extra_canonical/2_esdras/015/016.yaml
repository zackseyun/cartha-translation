source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erit enim constabilitio hominibus, alisalios supervalescentes non curabunt regem suum et principem megestanorum suorum in potentia sua.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
translation:
  language: fr
  text: Car l’instabilité régnera parmi les humains. Prenant le dessus les uns sur les autres, ils ne tiendront compte ni de leur roi ni du chef de leurs grands, forts de leur puissance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prenant, par leur puissance, le dessus les uns sur les autres, ils ne tiendront compte ni de leur roi ni du chef de leurs grands. »'
    reason: Le latin permet de rattacher « dans leur puissance » soit au fait de prendre le dessus, soit au refus de tenir compte des autorités.
lexical_decisions:
- source_word: constabilitio
  choice: l’instabilité régnera
  rationale: Le terme latin est inhabituel dans ce contexte; « instabilité » suit le sens contextuel probable, tandis que la tournure verbale donne un français naturel.
- source_word: alii alios supervalescentes
  choice: prenant le dessus les uns sur les autres
  rationale: Rend la réciprocité de « alii alios » et l’idée de supériorité ou de domination exprimée par « supervalescentes ».
- source_word: non curabunt
  choice: ils ne tiendront compte
  rationale: Exprime ici le refus de reconnaître ou de respecter l’autorité, sans surcharger le verbe d’une nuance affective.
- source_word: principem megestanorum suorum
  choice: du chef de leurs grands
  rationale: Préserve le singulier « principem » gouvernant le pluriel génitif « megestanorum »; « grands » désigne naturellement des dignitaires ou notables de haut rang.
- source_word: in potentia sua
  choice: forts de leur puissance
  rationale: Formulation française idiomatique qui conserve l’idée qu’ils agissent en s’appuyant sur leur propre puissance.
theological_decisions:
- issue: Rapport syntaxique de « in potentia sua »
  choice: 'Rattachement principal au mépris des autorités: « ils ne tiendront compte… forts de leur puissance »'
  alternative: 'Rattachement à « supervalescentes »: « prenant, par leur puissance, le dessus les uns sur les autres »'
  rationale: La position finale du syntagme latin permet plus d’un rattachement. Le texte principal retient la lecture la plus naturelle en français, et la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Leurs grands » conserve la référence aux magnats ou hauts dignitaires sans introduire un titre institutionnel plus précis que le latin.
