revisions:
- from: Du territoire des Assyriens, un homme posté en embuscade les guettera et détruira l’un d’eux. Alors, la peur et le tremblement gagneront leur armée, et l’instabilité régnera dans leur royaume.
  to: Du territoire des Assyriens, un embusqué leur tendra une embuscade et détruira l’un d’eux ; il y aura de la peur et du tremblement dans leur armée, et de l’instabilité dans leur royaume.
  rationale: La révision restitue explicitement le double emploi latin lié à l’embuscade (subsessor / subsedebit), tout en conservant l’indétermination du personnage et le singulier « l’un d’eux ». Elle évite d’ajouter une chronologie ou une personnification absentes du texte source.
