  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: fr
  text: Du territoire des Assyriens, un embusqué leur tendra une embuscade et détruira l’un d’eux ; il y aura de la peur et du tremblement dans leur armée, et de l’instabilité dans leur royaume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subsessor
  choice: un homme posté en embuscade
  rationale: Rend le nom latin désignant celui qui se tient caché pour attaquer, dans un français naturel sans préciser une identité absente du texte.
- source_word: subsedebit eos
  choice: les guettera
  rationale: Exprime l’action de se tenir en embuscade contre eux; le pronom conserve le référent collectif du contexte.
- source_word: consumet
  choice: détruira
  rationale: Restitue ici la force de consumere, qui indique l’anéantissement plutôt qu’une simple consommation.
- source_word: inconstabilitio
  choice: l’instabilité
  rationale: Le terme latin rare ou irrégulier évoque l’absence de stabilité; cette traduction en préserve le sens politique général.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le singulier « l’un d’eux » et l’indétermination de l’homme embusqué. La seconde proposition est légèrement restructurée pour produire une tournure française idiomatique tout en maintenant le parallélisme entre l’armée et le royaume.
