  text: For every unbeliever will die in his unbelief.
translation:
  language: fr
  text: Car tout incroyant mourra dans son incrédulité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnis incredulus
  choice: tout incroyant
  rationale: Rend directement la portée distributive de « omnis » et le substantif « incredulus », dans un français actuel et digne.
- source_word: in incredulitate sua
  choice: dans son incrédulité
  rationale: Conserve la répétition étymologique du latin et son ambiguïté entre l'état dans lequel la personne meurt et la cause ou condition liée à sa mort.
- source_word: morietur
  choice: mourra
  rationale: Traduit simplement le futur de l'indicatif latin sans ajout interprétatif.
theological_decisions:
- issue: Sens de l'incrédulité au moment de la mort
  choice: dans son incrédulité
  alternative: à cause de son incrédulité
  rationale: La préposition latine « in » exprime directement l'état ou la condition; traduire par « à cause de » imposerait une causalité plus explicite que celle du texte.
translation_notes:
  register: Formulation concise, solennelle et accessible en français international moderne; la répétition « incroyant / incrédulité » reflète volontairement celle du latin.
