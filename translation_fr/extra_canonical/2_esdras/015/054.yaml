  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
translation:
  language: fr
  text: Quand as-tu été enivrée ? Rehausse la beauté de ton visage ! Le salaire d’une prostituée est dans ton sein ; c’est pourquoi tu recevras ta rétribution.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum inebriata es?
  choice: Quand t’es-tu enivrée ?
  rationale: Rend directement l’interrogation latine et le féminin singulier, qui s’adresse à la ville personnifiée.
- source_word: Exorna speciem uultus tui
  choice: Pare la beauté de ton visage
  rationale: Conserve l’impératif et la formulation inhabituelle du latin sans la banaliser en simple invitation à se parer le visage.
- source_word: Merces fornicariae
  choice: Le salaire d’une prostituée
  rationale: Le génitif singulier fornicariae désigne naturellement une prostituée et maintient la personnification de la ville ; une lecture abstraite reste toutefois possible et est signalée en note.
- source_word: in sinus tuos
  choice: est dans ton sein
  rationale: Le français « dans ton sein » transmet l’image de ce qui est recueilli ou gardé contre soi ; le verbe « est » est suppléé comme en latin.
- source_word: redditionem recipies
  choice: tu recevras ta rétribution
  rationale: Préserve l’idée de retour, de paiement rendu en contrepartie, sans préciser au-delà du texte la forme du jugement.
theological_decisions:
- issue: Personnification féminine de la destinataire
  choice: Maintien du féminin et de l’image de la prostituée
  alternative: Abstraire l’expression en « salaire de la prostitution »
  rationale: Le contexte et fornicariae favorisent une ville personnifiée comme prostituée ; la traduction ne doit pas effacer cette image prophétique.
- issue: Nature de la reddition annoncée
  choice: « rétribution » sans qualification supplémentaire
  alternative: « châtiment » ou « punition »
  rationale: Reditio exprime d’abord ce qui est rendu en retour ; traduire directement par « châtiment » résoudrait implicitement une nuance que le latin laisse portée par le contexte.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement et les formes féminines maintiennent l’adresse prophétique à une ville personnifiée. La syntaxe légèrement saisissante de « Pare la beauté de ton visage » est conservée parce qu’elle reflète celle du latin.
