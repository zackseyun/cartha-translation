  text: that I will put into your mouth, says the Lord, and cause them to be written on a scroll,
translation:
  language: fr
  text: que je mettrai dans ta bouche, dit le Seigneur, et fais en sorte qu’ils soient écrits sur un rouleau,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in os tuum
  choice: dans ta bouche
  rationale: Rend directement l’expression latine et conserve l’image biblique de paroles placées dans la bouche du messager.
- source_word: carta
  choice: un rouleau
  rationale: Dans ce contexte d’écriture antique, « rouleau » exprime naturellement le support matériel visé, plutôt que le faux ami moderne « carte ».
- source_word: fac ut ... [scribantur]
  choice: fais-les écrire
  rationale: La tournure causative française restitue l’impératif latin « fac ut »; le verbe d’écriture, attendu après « in carta », est fourni par la continuité textuelle du verset.
theological_decisions:
- issue: Origine divine des paroles proclamées
  choice: « que je mettrai dans ta bouche »
  alternative: « qui seront mises dans ta bouche »
  rationale: La première personne du latin « inmisero » maintient explicitement Dieu comme auteur de la communication, sans atténuer l’image prophétique.
translation_notes:
  register: Français moderne, clair et digne. La formulation garde le caractère prophétique et l’enchaînement fragmentaire avec le contexte précédent. « Rouleau » privilégie le référent antique naturel de « carta ».
