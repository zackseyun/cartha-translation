  text: For a man will desire to go into a city and will not be able[a].
translation:
  language: fr
  text: Car un homme désirera aller dans une ville et ne le pourra pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: concupiscet
  choice: désirera
  rationale: Le futur latin exprime ici un vif désir; «désirera» reste naturel et fidèle sans lui donner nécessairement une nuance morale négative.
- source_word: in civitatem ire
  choice: entrer dans une ville
  rationale: Dans ce contexte, le mouvement vers l’intérieur d’une ville se rend naturellement en français par «entrer dans une ville», plutôt que par le calque «aller dans une ville».
- source_word: non poterit
  choice: il ne le pourra pas
  rationale: Cette formulation conserve le futur et l’incapacité exprimée par le latin, le pronom «le» reprenant l’action d’entrer.
theological_decisions:
- issue: Valeur logique de enim
  choice: Car
  alternative: En effet
  rationale: «Car» préserve explicitement le lien explicatif avec ce qui précède, sans surinterpréter la nature de ce lien.
translation_notes:
  register: Français moderne, clair et digne. La coordination «mais» explicite l’opposition déjà portée par la succession du désir et de l’impossibilité, tout en restant naturelle.
