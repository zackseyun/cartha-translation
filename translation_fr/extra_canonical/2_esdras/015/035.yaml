  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
translation:
  language: fr
  text: Ils se heurteront les uns aux autres et déverseront sur la terre une violente tempête[a], leur tempête ; et il y aura du sang, de l’épée jusqu’au ventre du cheval.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin sidus est au singulier ici comme dans toute cette section. Il peut désigner un « astre » ou une « étoile », mais aussi une tempête ; dans ce contexte, le verbe « déverser » favorise ce dernier sens. Si l’on retient le sens céleste, l’image demeure difficile.
    reason: lexical_alternative
lexical_decisions:
- source_word: conlident se invicem
  choice: se heurteront les uns aux autres
  rationale: Rend naturellement l’affrontement réciproque exprimé par le verbe latin et le pronom réciproque.
- source_word: sidus copiosum
  choice: une tempête abondante
  rationale: Dans ce contexte apocalyptique et avec effundent (« déverseront »), le sens secondaire de sidus, « tempête », convient mieux que son sens courant « astre » ; « abondante » conserve la valeur de copiosum sans préciser arbitrairement la nature des précipitations.
- source_word: a gladio usque ad ventrem equi
  choice: de l’épée jusqu’au ventre du cheval
  rationale: Conserve l’image et les limites spatiales du latin, malgré leur caractère énigmatique.
theological_decisions:
- issue: Nature du signe apocalyptique désigné par sidus
  choice: tempête
  alternative: astre / étoile
  rationale: Le verbe « déverser » et l’adjectif copiosum favorisent ici le sens météorologique attesté de sidus, tout en signalant en note l’image céleste possible afin de ne pas supprimer l’ambiguïté du texte.
translation_notes:
  register: Français moderne, courant et digne. La répétition inhabituelle « une tempête abondante, leur tempête » est maintenue parce qu’elle appartient au texte latin. La dernière image reste volontairement littérale et énigmatique.
