    issue: Rendu de erit sanguis
    rationale: « Le sang ira » introduit un déplacement qui n’est pas exprimé par erit (« il y aura/il sera »).
  - severity: low
    issue: Collocation « tempête abondante » et alternative de note
    rationale: La collocation est lourde en français et l’alternative « un astre abondant » n’est pas idiomatique. Une note peut signaler l’ambiguïté sans imposer cette formulation.
