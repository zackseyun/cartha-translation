  source_fidelity: « Consors » est un nom en apposition à « Asia » et exprime l’association ou la participation, avec les deux compléments introduits par « in ». « Qui partages » transmet globalement l’idée, mais transforme cette désignation en proposition verbale et atténue légèrement la construction rhétorique de l’original. « Species » peut désigner l’éclat/la magnificence dans ce contexte; « splendeur » est donc défendable. La formulation inhabituelle « gloria personae » doit rester sans interprétation explicative.
