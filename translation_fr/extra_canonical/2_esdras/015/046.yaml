  yaml_path: translation/extra_canonical/2_esdras/015/046.yaml
  text: And you[a], Asia, partner in the splendor of Babylon and in the glory of her person—
translation:
  language: fr
  text: Et toi[a], Asie, associée à la splendeur de Babylone et à la gloire de sa personne—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette adresse à l’Asie comme partenaire de Babylone appartient à une strate de composition distincte du noyau juif de 4 Esdras. Cette rhétorique relève de l’appendice chrétien latin plus tardif communément appelé 6 Esdras.
    reason: compositional_layer
lexical_decisions:
- source_word: consors
  choice: qui partages
  rationale: Rend naturellement l’idée de participation ou de communauté exprimée par « consors », tout en laissant le verbe régir les deux compléments coordonnés.
- source_word: species
  choice: splendeur
  rationale: Dans ce contexte rhétorique, « species » désigne l’éclat ou la magnificence visible, plutôt qu’une simple apparence.
- source_word: persona
  choice: personne
  rationale: Conserve la personnification de Babylone et l’expression inhabituelle du latin sans la réduire à « apparence » ou à « rôle ».
theological_decisions:
- issue: Identification rhétorique de l’Asie à une partenaire de Babylone
  choice: Maintenir l’adresse directe et la personnification sans préciser davantage l’identité de l’Asie ou de Babylone.
  alternative: Interpréter explicitement l’Asie comme une province romaine ou comme une puissance chrétienne postérieure.
  rationale: Le verset établit une association rhétorique, mais ne donne pas ici assez d’éléments pour imposer une identification historique ou confessionnelle précise.
translation_notes:
  register: Français moderne, soutenu mais accessible. L’adresse solennelle est conservée, ainsi que le tiret final indiquant que la phrase se poursuit.
