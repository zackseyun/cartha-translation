  yaml_path: translation/extra_canonical/2_esdras/015/003.yaml
  text: because they are faithful and true. Do not fear the thoughts against you, nor let the unbelief of those who speak against you trouble you.
translation:
  language: fr
  text: car elles sont dignes de foi et véridiques. Ne crains pas les pensées dirigées contre toi, et que l’incrédulité de ceux qui parlent contre toi ne te trouble pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fideles
  choice: dignes de foi
  rationale: Dans ce contexte, l’adjectif qualifie ce qui doit être écrit et signifie que ces paroles sont fiables; « dignes de foi » est naturel et précis en français.
- source_word: cogitationibus adversum te
  choice: les pensées dirigées contre toi
  rationale: Cette traduction conserve le sens littéral de cogitationibus sans préciser indûment s’il s’agit de projets, de raisonnements ou d’intentions hostiles.
- source_word: incredulitates
  choice: l’incrédulité
  rationale: Le singulier collectif français rend naturellement le pluriel latin et garde la notion de refus de croire.
- source_word: contra dicentium
  choice: de ceux qui te contredisent
  rationale: Cette formulation rend directement l’idée de personnes qui parlent contre le destinataire, dans un français actuel.
