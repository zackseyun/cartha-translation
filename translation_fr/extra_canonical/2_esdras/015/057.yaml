  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
translation:
  language: fr
  text: Tes villes seront écrasées, et tous les tiens qui seront dans la campagne tomberont sous l’épée. Ceux qui seront dans les montagnes mourront de faim et mangeront de la chair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase se poursuit au verset suivant, où le texte précise : « leur propre chair » selon la division versifiée de cette édition.'
    reason: Signaler que l’objet est précisé au-delà de la limite du présent verset, sans l’incorporer au texte principal.
lexical_decisions:
- source_word: ciuitates tuae conterentur
  choice: Tes villes seront écrasées
  rationale: « Écrasées » rend avec force le passif futur de conterere, qui évoque la destruction ou le broyage.
- source_word: omnes tui
  choice: tous les tiens
  rationale: L’expression française conserve la formulation relationnelle et elliptique du latin, sans ajouter explicitement « ton peuple ».
- source_word: in campo
  choice: dans la campagne
  rationale: Rend le singulier collectif campus comme l’espace ouvert, par opposition aux montagnes de la proposition suivante.
- source_word: gladio cadent
  choice: tomberont sous l’épée
  rationale: Formulation française naturelle et digne qui conserve l’image du glaive comme cause de mort.
- source_word: fame peribunt
  choice: mourront de faim
  rationale: Rend directement la mort causée par la famine.
- source_word: manducabunt carnes
  choice: mangeront de la chair
  rationale: Conserve carnes sans anticiper suas, mot situé dans le segment versifié suivant selon la source fournie.
theological_decisions:
- issue: Objet de la consommation et limite du verset
  choice: « mangeront de la chair »
  alternative: « mangeront leur propre chair »
  rationale: Le texte latin fourni pour ce verset s’arrête à carnes. Ajouter « leur propre » importerait suas depuis le verset suivant et résoudrait prématurément l’enjambement.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le futur prophétique et le parallélisme du latin sont conservés. « Tous les tiens » maintient l’ellipse de omnes tui, tandis que « campagne » marque le contraste géographique avec les montagnes.
