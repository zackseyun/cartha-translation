  yaml_path: translation/extra_canonical/2_esdras/015/011.yaml
  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: fr
  text: Mais je le ferai sortir avec une main puissante et un bras élevé ; je frapperai l’Égypte d’un fléau comme auparavant et je détruirai tout son pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: educam eum
  choice: je le ferai sortir
  rationale: Le latin porte un pronom masculin singulier, eum. La tournure causative française exprime naturellement l’action de conduire quelqu’un hors d’un lieu et conserve le singulier du texte source.
- source_word: in manu potenti et brachio excelso
  choice: d’une main puissante et le bras levé
  rationale: Cette formulation garde l’imagerie biblique de la puissance divine tout en restant naturelle en français moderne.
- source_word: plaga
  choice: d’un fléau
  rationale: Le substantif latin est au singulier. « Fléau » préserve sa portée assez large, sans imposer le pluriel contextuel « plaies ».
- source_word: corrumpam terram omnem eius
  choice: je dévasterai tout son pays
  rationale: Dans ce contexte de jugement territorial, « dévaster » rend la destruction exprimée par corrumpam, tandis que terra désigne naturellement le pays de l’Égypte.
theological_decisions:
- issue: Nombre du bénéficiaire de la délivrance
  choice: le
  alternative: les
  rationale: Le texte latin reçu lit eum, au masculin singulier. Même si le contexte ou une harmonisation avec le récit de l’Exode peut suggérer un groupe, la traduction ne corrige pas silencieusement le nombre du texte source.
- issue: Nombre des fléaux infligés à l’Égypte
  choice: un fléau
  alternative: des plaies
  rationale: Plaga est grammaticalement singulier. La mention « comme auparavant » évoque certes les plaies d’Égypte, mais la traduction conserve le nombre explicite du latin et son possible sens collectif.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les échos au récit de l’Exode sans remplacer les formes singulières du latin par des pluriels dictés par le contexte.
