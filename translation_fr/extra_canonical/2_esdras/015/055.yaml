  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
translation:
  language: fr
  text: Le salaire d’une prostituée est dans ton giron ; c’est pourquoi tu recevras la rétribution.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: merces fornicariae
  choice: Le salaire d’une prostituée
  rationale: « fornicariae » est le génitif singulier de « fornicaria » (prostituée), et « merces » désigne le salaire ou la rétribution.
- source_word: in sinus tuos
  choice: dans ton giron
  rationale: Le latin emploie littéralement le pluriel « dans tes replis/ton sein » ; « dans ton giron » conserve l’image corporelle et idiomatique du lieu où l’on recueille quelque chose.
- source_word: redditionem percipies
  choice: tu recevras ce qui t’est dû
  rationale: « redditio » évoque une restitution ou rétribution rendue en retour ; cette formulation française exprime naturellement l’idée de juste retour sans préciser indûment s’il s’agit d’argent ou de châtiment.
theological_decisions:
- issue: Nature de la rétribution annoncée
  choice: ce qui t’est dû
  alternative: la rétribution
  rationale: Le contexte implique un retour punitif, mais le latin « redditionem » reste assez général. La traduction préserve cette tension sans ajouter explicitement « châtiment ».
translation_notes:
  register: Français moderne, digne et direct. « Giron » est légèrement soutenu, mais conserve l’image concrète du texte source ; la note en explicite le sens.
