lexical_decisions:
- source_word: saeculo
  choice: monde
  rationale: Dans ce passage de 6 Esdras, le sens spatial est favorisé par la proposition « ceux qui l’habitent » ; « monde » est aussi la formulation française la plus naturelle. Le sens « époque/âge » demeure toutefois possible et est signalé en note.
- source_word: qui habitant in eum
  choice: ceux qui l’habitent
  rationale: Rend directement l’idée d’habiter dans le monde, avec le pronom français naturel « l’ ».
- source_word: vae
  choice: Malheur à
  rationale: Formule française traditionnelle, actuelle et digne pour l’exclamation prophétique latine vae.
theological_decisions:
- issue: 'Portée de saeculum : spatiale ou temporelle'
  choice: monde
  alternative: époque / âge
  rationale: Le contexte immédiat, notamment habitant in eum, soutient fortement la lecture spatiale sans supprimer l’ambiguïté lexicale du latin, conservée en note.
translation_notes:
  register: Français international moderne, formulation prophétique concise et solennelle. L’élision dans « qui l’habitent » évite une tournure lourde tout en restant fidèle au latin.
