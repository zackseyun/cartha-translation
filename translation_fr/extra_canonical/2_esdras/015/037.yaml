  yaml_path: translation/extra_canonical/2_esdras/015/037.yaml
  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
translation:
  language: fr
  text: Ceux qui verront cette colère frissonneront d’effroi[a], et le tremblement les saisira. Et après cela, d’abondants nuages d’orage seront mis en mouvement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une traduction antérieure commençait ce verset ainsi : « Une grande peur et un grand tremblement régneront sur la terre. » Dans la source latine retenue, ces mots appartiennent à la fin du verset 36.'
    reason: Signaler l’ancienne délimitation du verset sans réintroduire dans le texte principal une phrase qui relève du verset précédent.
lexical_decisions:
- source_word: horrebunt
  choice: frissonneront d’effroi
  rationale: Rend le futur de horreo dans son sens de frémir ou frissonner de peur, sans le confondre avec tremor dans la proposition suivante.
- source_word: iram illam
  choice: cette colère
  rationale: Conserve la valeur démonstrative de illam et le sens direct de ira.
- source_word: tremor adprehendet illos
  choice: le tremblement les saisira
  rationale: Reproduit l’image concrète et la personnification du latin adprehendet.
- source_word: nimbi copiosi
  choice: d’abondants nuages d’orage
  rationale: Nimbi désigne des nuages porteurs de pluie ou d’orage, tandis que copiosi exprime l’abondance plutôt que la puissance.
- source_word: movebuntur
  choice: seront mis en mouvement
  rationale: Conserve la forme passive et l’image d’un mouvement déclenché, sans préciser un agent absent du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition entre « frissonneront » et « tremblement » est maintenue parce qu’elle reflète les deux termes et les deux propositions du latin. La conjonction initiale de la dernière phrase rend explicitement et post haec.
