  yaml_path: translation/extra_canonical/2_esdras/015/018.yaml
  text: For because of their pride the cities will be thrown into confusion, the houses will be destroyed, and men will be afraid.
translation:
  language: fr
  text: Car, à cause de leur orgueil, les villes seront bouleversées, les maisons seront détruites et les gens auront peur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter superbiam enim eorum
  choice: Car, à cause de leur orgueil
  rationale: Rend la relation causale exprimée par « enim » et « propter », tout en conservant « leur » sans préciser un référent que le verset ne nomme pas.
- source_word: civitates turbabuntur
  choice: les villes seront bouleversées
  rationale: '« Bouleversées » conserve la portée assez large de « turbabuntur » : trouble, agitation ou désordre, sans réduire le sens à une seule forme de catastrophe.'
- source_word: domus exterentur
  choice: les maisons seront détruites
  rationale: Dans ce contexte de jugement et de désolation, « détruites » exprime naturellement l'anéantissement indiqué par « exterentur ».
- source_word: homines metuent
  choice: les hommes seront saisis de peur
  rationale: Formulation française naturelle et forte pour le futur « metuent », où « homines » désigne les êtres humains ou les gens de manière générale.
