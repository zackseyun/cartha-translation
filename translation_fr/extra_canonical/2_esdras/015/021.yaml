source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'sicut faciunt usque hodie electis meis, sic faciam et reddam in sinum ipsorum. haec dicit Dominus Deus:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
translation:
  language: fr
  text: 'Comme ils l’ont fait jusqu’à ce jour à mes élus, ainsi j’agirai envers eux et je leur rendrai ce qu’ils ont fait dans le pli de leur vêtement. Voici ce que dit le Seigneur Dieu :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electis meis
  choice: à ceux que j’ai choisis
  rationale: Rend naturellement le datif latin et la notion d’élection sans imposer un terme ecclésiastique spécialisé.
- source_word: sic faciam
  choice: ainsi agirai-je envers eux
  rationale: Conserve la correspondance entre leur conduite et l’action divine; « envers eux » explicite en français la cible impliquée par le contexte.
- source_word: reddam in sinum ipsorum
  choice: leur rendrai-je la pareille au creux de leur vêtement
  rationale: « Rendre la pareille » exprime la rétribution, tandis que « au creux de leur vêtement » préserve l’image concrète de sinus, le pli du vêtement servant de poche.
- source_word: haec dicit Dominus Deus
  choice: Voici ce que dit le Seigneur Dieu
  rationale: Formule française actuelle et digne correspondant directement à l’introduction prophétique latine.
theological_decisions:
- issue: Nature de la rétribution divine
  choice: Conserver la symétrie explicite entre leurs actes et l’action de Dieu
  alternative: Atténuer en disant seulement que Dieu les punira
  rationale: Le latin sicut… sic insiste sur une rétribution correspondant à ce qu’ils ont eux-mêmes fait.
- issue: Sens de electis meis
  choice: ceux que j’ai choisis
  alternative: mes élus
  rationale: La formulation verbale reste claire pour le grand public tout en préservant l’idée théologique du choix divin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’inversion « agirai-je / rendrai-je » maintient la solennité de l’oracle sans archaïsme marqué. L’image vestimentaire est conservée plutôt que remplacée par « sein », devenu ambigu ou opaque en français contemporain.
