  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
translation:
  language: fr
  text: Dieu connaît ceux qui pèchent contre lui ; c’est pourquoi il les livrera à la mort et au massacre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: novit
  choice: connaît
  rationale: Rend directement le parfait latin à valeur présente, sans ajouter de conjonction causale absente du texte.
- source_word: qui peccant in eum
  choice: ceux qui pèchent contre lui
  rationale: « Pécher contre » exprime naturellement en français l’hostilité ou l’offense portée par in eum.
- source_word: tradet eos
  choice: il les livrera
  rationale: Conserve le sens futur de tradet et l’idée de remettre quelqu’un à un sort funeste.
- source_word: in mortem et in occisionem
  choice: à la mort et au massacre
  rationale: Préserve les deux termes coordonnés et leur intensification, occisio désignant ici une mise à mort violente ou collective.
theological_decisions:
- issue: Lien logique entre la connaissance divine et le jugement
  choice: Ponctuation par un point-virgule, suivie de « c’est pourquoi »
  alternative: « Car Dieu connaît… »
  rationale: Le latin ne contient aucune conjonction équivalant à « car » avant novit Deus, tandis que propterea marque explicitement la conséquence dans la seconde proposition.
translation_notes:
  register: Français moderne, clair et solennel. La formulation reste proche du latin tout en étant idiomatique ; elle conserve la distinction entre « mort » et « massacre ».
