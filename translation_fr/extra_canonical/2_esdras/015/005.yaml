  text: ecce ego induco, dicit Dominus, super orbem terrarum mala, gladium et famem et mortem et interitum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/005.yaml
  text: 'Behold, I am bringing evils upon the world, says the Lord: sword and famine and death and destruction,'
translation:
  language: fr
  text: 'Voici que je fais venir sur le monde, dit le Seigneur, des malheurs : l’épée, la famine, la mort et la destruction.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Voici que
  rationale: Conserve la fonction solennelle et déictique de l’introduction latine dans un français naturel.
- source_word: induco
  choice: je fais venir
  rationale: Rend l’action causative et imminente sans alourdir le français par « j’introduis ».
- source_word: super orbem terrarum
  choice: sur le monde
  rationale: Expression idiomatique correspondant à l’ensemble de la terre habitée.
- source_word: mala
  choice: des malheurs
  rationale: Dans cette énumération de calamités, « malheurs » exprime mieux le sens contextuel que le terme moral « maux ».
- source_word: gladium
  choice: l’épée
  rationale: Conserve l’image biblique de l’épée, qui évoque ici la guerre et la violence sans les expliciter à la place du texte.
- source_word: famem
  choice: la famine
  rationale: Équivalent direct et courant.
- source_word: mortem
  choice: la mort
  rationale: Équivalent direct, maintenu distinct de la destruction qui suit.
- source_word: interitum
  choice: la destruction
  rationale: Rend l’idée de ruine ou d’anéantissement tout en préservant la distinction avec « mortem ».
theological_decisions:
- issue: Agent divin des calamités
  choice: « je fais venir »
  alternative: « je vais faire venir » ou « j’envoie »
  rationale: Le latin attribue directement au Seigneur l’arrivée des calamités. La traduction conserve cette tension sans l’atténuer ni préciser un mécanisme absent du texte.
- issue: Portée de « orbem terrarum »
  choice: « le monde »
  alternative: « toute la terre »
  rationale: Le latin désigne le monde terrestre habité ; « le monde » préserve cette portée générale sans ajouter explicitement « tout », absent de la formulation.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la solennité prophétique, l’énumération cumulative et la ponctuation ouverte vers la suite du passage.
