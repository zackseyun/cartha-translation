  rationale: Le génitif pluriel de « pratum » désigne ici des prés ou pâturages; la forme dépend manifestement du contexte précédent, absent de ce fragment.
- source_word: frumenta
  choice: récoltes
  rationale: « Frumenta » peut désigner les céréales, le blé ou les produits des champs. « Récoltes » est naturel dans la coordination avec les pâturages tout en conservant une portée assez large.
- source_word: transibunt constanter
  choice: ils avanceront résolument
  rationale: « Transibunt » exprime le passage ou la progression, et « constanter » une action ferme, persistante. Cette formulation française restitue ensemble le mouvement et la détermination.
- source_word: usque
  choice: jusqu’à
  rationale: La préposition annonce une limite ou destination donnée dans la suite; le caractère inachevé du fragment est conservé.
