  rationale: La révision remplace « ardeur » par « feu » afin d’exprimer clairement l’image de destruction contenue dans « ardor » et ajuste la clause des blessures pour éviter l’ajout de la conséquence « jusqu’à en être blessée ». Elle conserve l’adresse féminine, l’ambiguïté de « les tiens » et l’indication explicite du caractère fragmentaire de la fin.
