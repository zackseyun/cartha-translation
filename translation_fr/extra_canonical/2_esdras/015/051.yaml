  verdict: revise
  source_fidelity: 'La structure et les éléments essentiels du latin sont conservés : « exsurget », « emissus est super te », l’adresse féminine, le coup, les blessures, et le possessif final non résolu. Toutefois, « ardeur » en français moderne évoque d’abord la ferveur ou l’intensité et rend moins clairement l’agent destructeur d’« ardor » envoyé contre la destinataire. « Feu » est plus naturel et plus transparent dans ce contexte.'
  naturalness: La phrase est globalement fluide et le registre convient. « Fouettée jusqu’à en être blessée » introduit toutefois une relation de résultat (« jusqu’à ») absente du latin, où les blessures sont l’instrument ou l’agent grammatical de « mastigata ». « Flagellée par les blessures » maintient la formulation dense et violente du texte sans explicitation supplémentaire.
  terminology: « Feu » rend ici mieux « ardor » que « ardeur ». « Réduite à la misère par le coup » conserve de façon recevable « paupera a plaga » sans transformer « plaga » en maladie. « Les tiens » préserve correctement l’ambiguïté du latin fragmentaire « tuos ».
  issues:
  - severity: medium
    issue: « Ardeur » est ambigu et peu idiomatique comme force destructrice lancée contre quelqu’un.
    rationale: Dans l’usage français courant, « ardeur » désigne le plus souvent le zèle, la passion ou une chaleur abstraite. Le contexte de châtiment et la possibilité latine de « feu brûlant » justifient « feu », sans surinterpréter le texte.
  - severity: low
    issue: « Fouettée jusqu’à en être blessée » ajoute une nuance consécutive.
    rationale: Le latin « mastigata a uulneribus » ne dit pas explicitement que la flagellation produit les blessures ; il associe directement flagellation et blessures. Une formulation instrumentale conserve mieux cette concision.
