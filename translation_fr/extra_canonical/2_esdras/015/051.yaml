  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
translation:
  language: fr
  text: Le feu qui a été lancé contre toi se lèvera[a]. Tu seras affaiblie, réduite à la misère par le coup et flagellée par les blessures, si bien que tu ne pourras pas recevoir les tiens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’ardeur lancée contre toi s’élèvera. »'
    reason: « Ardor » peut désigner une ardeur ou une chaleur brûlante ; « feu » rend plus naturellement l’image destructive dans ce contexte.
  - marker: b
    text: Le texte latin conservé s’interrompt ici après « les tiens » ; le nom sous-entendu n’est pas précisé.
    reason: La source fournie ne permet pas d’identifier le référent de « tuos » ni de compléter la proposition.
lexical_decisions:
- source_word: ardor
  choice: ardeur
  rationale: Le latin désigne une chaleur ou un feu intense, éventuellement une violence ardente. « Ardeur » conserve cette amplitude sans imposer exclusivement l’image d’un incendie.
- source_word: paupera a plaga
  choice: réduite à la misère par le coup
  rationale: « Paupera » exprime un état d’appauvrissement ou de dénuement, tandis que « plaga », dans le contexte de « mastigata » et « vulneribus », désigne naturellement un coup plutôt qu’une maladie.
- source_word: mastigata a vulneribus
  choice: fouettée jusqu’à en être blessée
  rationale: Cette formulation française naturelle maintient l’image concrète du châtiment corporel portée par « mastigata » et celle des blessures exprimée par « vulneribus ».
- source_word: tuos
  choice: les tiens
  rationale: Le possessif substantivé masculin pluriel reste sans nom exprimé dans le fragment latin; « les tiens » préserve cette indétermination.
theological_decisions:
- issue: Référent de « tuos » dans la proposition finale inachevée
  choice: Ne pas préciser le groupe visé et traduire « les tiens »
  alternative: Ajouter « tes puissants et tes amants » d’après une reconstruction ou un contexte élargi
  rationale: Le texte latin fourni s’arrête sur « tuos » et ne justifie pas l’ajout d’un référent précis. L’inachèvement et l’ambiguïté doivent être conservés.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin est conservé parce que les formes latines « infirmaberis », « paupera » et « mastigata » s’adressent à une entité féminine. L’imagerie de violence physique est rendue sans l’adoucir, et la fin fragmentaire demeure explicitement non résolue.
