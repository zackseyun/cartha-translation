  text: and a man's thigh and a camel's hock[a]. And there will be great fear and trembling upon the earth,
translation:
  language: fr
  text: et la cuisse d’un homme et le jarret d’un chameau[a]. Il y aura une grande peur et un grand tremblement sur la terre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et à la cuisse d’un homme et au jarret d’un chameau ».'
    reason: Les accusatifs latins peuvent se rattacher syntaxiquement à l’élément régissant du contexte précédent; la note préserve cette ambiguïté sans imposer une analyse.
lexical_decisions:
- source_word: femur hominis
  choice: la cuisse d’un homme
  rationale: « Femur » désigne ici la cuisse; le génitif « hominis » est rendu naturellement par « d’un homme ».
- source_word: suffraginem cameli
  choice: le jarret d’un chameau
  rationale: Le latin « suffrago » désigne l’articulation postérieure de la patte d’un animal; « jarret » est le terme français précis et courant.
- source_word: timor et tremor multus
  choice: une grande peur et un grand tremblement
  rationale: Cette formulation conserve les deux noms coordonnés ainsi que l’intensité exprimée par « multus », sans les fondre en une seule idée.
- source_word: super terram
  choice: sur la terre
  rationale: Rend directement l’expression latine tout en gardant sa portée potentiellement universelle.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le début demeure volontairement un fragment syntaxique coordonné à ce qui précède, comme dans la source latine. « Se répandront » explicite idiomatiquement la présence à venir de la peur et du tremblement sur la terre, sans en préciser la cause.
