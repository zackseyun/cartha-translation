  text: Voici, parle aux oreilles de mon peuple les paroles de la prophétie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: Voici
  rationale: Conserve le marqueur solennel d’attention du latin dans une formulation française naturelle et digne.
- source_word: loquere
  choice: prononce
  rationale: L’impératif « prononce » convient à une proclamation orale adressée au peuple et évite la platitude de « parle ».
- source_word: in aures plebi meae
  choice: aux oreilles de mon peuple
  rationale: Rend directement l’image concrète du latin tout en restant idiomatique en français; le sens est celui d’une proclamation audible.
- source_word: sermones prophetiae
  choice: les paroles de la prophétie
  rationale: Reproduit la construction génitive latine sans préciser indûment s’il s’agit de paroles prophétiques en général ou d’une prophétie déterminée.
theological_decisions:
- issue: Valeur de « prophetiae »
  choice: de la prophétie
  alternative: prophétiques
  rationale: Le substantif est conservé afin de ne pas réduire la prophétie à une simple qualité des paroles ni résoudre la portée exacte du génitif.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formulation conserve l’image auditive du texte latin et son ton de proclamation prophétique.
