source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: homines quidem per nomina invenies servasse mandata tua, gentes autem non invenies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: fr
  text: Tu trouveras certes, nommément, des hommes qui ont observé tes commandements, mais tu ne trouveras aucun peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines
  choice: des hommes
  rationale: Rend le pluriel latin par une formulation française naturelle désignant des individus, en contraste avec les peuples pris collectivement.
- source_word: quidem
  choice: certes
  rationale: Marque l’affirmation concessive qui prépare l’opposition introduite par « mais ».
- source_word: per nomina
  choice: en les nommant
  rationale: Exprime l’idée que l’on peut identifier ces hommes individuellement, par leur nom, sans alourdir la phrase.
- source_word: servasse mandata tua
  choice: qui ont observé tes commandements
  rationale: « Observer des commandements » est une expression française actuelle et digne qui restitue l’accompli de l’infinitif latin.
- source_word: gentes
  choice: peuple
  rationale: Dans l’opposition avec les individus nommément identifiables, « peuple » rend ici une collectivité nationale ou ethnique; le singulier sous négation (« aucun peuple ») est idiomatique en français.
theological_decisions:
- issue: Contraste entre fidélité individuelle et collective
  choice: Conserver explicitement l’opposition entre « des hommes » identifiables et « aucun peuple »
  alternative: Généraliser en parlant de personnes et de nations sans contraste grammatical net
  rationale: Le latin oppose directement homines et gentes; la traduction préserve cette tension sans expliquer pourquoi certains individus obéissent alors qu’aucun peuple ne le fait collectivement.
translation_notes:
  register: Français international moderne, clair et soutenu. La tournure « en les nommant » privilégie l’intelligibilité tout en conservant le sens distributif de per nomina; « certes… mais » reproduit l’articulation quidem… autem.
