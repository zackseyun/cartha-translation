source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ego tunc in corde meo: numquid meliora faciunt qui habitant in Babylone, et propter hoc dominabit Sion?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/028.yaml
  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
translation:
  language: fr
  text: 'Alors je me suis dit en mon cœur[a] : « Ceux qui habitent à Babylone agissent-ils mieux que nous ? Est-ce pour cela que Sion est dominée ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin est ici difficile et pourrait refléter une altération survenue au cours de la transmission. La plainte d’Esdras oppose la prospérité apparente de Babylone à l’abaissement de Sion; la traduction conserve la question rhétorique sans imposer une reconstitution plus fluide.
    reason: alternative_reading
lexical_decisions:
- source_word: dixi ego tunc in corde meo
  choice: Alors je me suis dit en mon cœur
  rationale: Rend naturellement l'intériorité de l'expression latine tout en conservant l'image biblique du cœur.
- source_word: meliora faciunt
  choice: agissent-ils mieux que nous ?
  rationale: « Agir mieux » exprime la comparaison morale ou pratique sans préciser abusivement en quoi les Babyloniens seraient meilleurs; « que nous » explicite le second terme sous-entendu par le comparatif latin.
- source_word: dominabit Sion
  choice: Sion est dominée
  rationale: Préserve la formulation passive ou d'état suggérée par le contexte et évite de nommer Babylone comme sujet de la domination, ce que le latin transmis ne fait pas explicitement.
theological_decisions:
- issue: Rapport entre la conduite de Babylone et l'assujettissement de Sion
  choice: Conserver deux questions rhétoriques liées par une relation causale interrogative
  alternative: Affirmer que Babylone domine Sion parce qu'elle agit mieux
  rationale: Le texte exprime la protestation d'Esdras et ne valide pas cette explication comme une conclusion théologique.
translation_notes:
  register: Français moderne, digne et accessible. La tournure biblique « en mon cœur » est maintenue, tandis que « je me suis dit » évite un calque peu naturel. L'ambiguïté du latin transmis, notamment dans « dominabit Sion », est signalée en note et non résolue par l'ajout d'un agent explicite.
