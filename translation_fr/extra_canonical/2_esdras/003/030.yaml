  naturalness: Le français est globalement fluide et de registre approprié. Une coordination explicite à la fin est plus proche de la cadence abrupte du latin et plus nette en français qu’un gérondif après une longue série de verbes.
  terminology: « Impiété », « faire périr » et « préserver » conviennent au contexte et n’imposent aucune lecture doctrinale. « Supporter » rend de manière acceptable « sustinere » dans cette plainte.
