  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
translation:
  language: fr
  text: Car j’ai vu comment tu supportes ceux qui pèchent et as épargné ceux qui agissent avec impiété, et comment tu as fait périr ton peuple et préservé tes ennemis, et tu n’as rien fait connaître[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et tu n’as pas fait connaître » ; le texte latin ne précise pas ce qui n’a pas été manifesté.'
    reason: Le dernier verbe n’a aucun complément exprimé dans la source et produit une conclusion abrupte.
lexical_decisions:
- source_word: sustines
  choice: tu supportes
  rationale: Le présent français conserve le présent latin et exprime l’idée de tolérer ou d’endurer les pécheurs.
- source_word: pepercisti
  choice: tu as épargné
  rationale: Le passé composé rend le parfait latin et maintient son contraste temporel avec « sustines ».
- source_word: impie agentibus
  choice: ceux qui agissent avec impiété
  rationale: Cette formulation garde la valeur active de « agentibus » et le caractère religieux et moral de « impie » sans ajouter une qualification confessionnelle.
- source_word: perdidisti
  choice: tu as fait périr
  rationale: Le passé composé préserve l’aspect accompli du parfait latin; « faire périr » convient ici mieux que le très général « détruire » appliqué au peuple.
- source_word: conservasti
  choice: préservé
  rationale: Le terme traduit l’action accomplie de maintenir les ennemis en vie ou à l’abri, en parallèle avec « as fait périr ».
- source_word: non significasti
  choice: sans rien faire connaître
  rationale: Cette expression rend l’idée de ne pas manifester ou communiquer, tout en laissant ouverte la nature de ce qui n’a pas été révélé.
theological_decisions:
- issue: Contraste entre le traitement des impies, du peuple de Dieu et de ses ennemis
  choice: tandis que tu as fait périr ton peuple et préservé tes ennemis
  alternative: et tu as fait périr ton peuple et préservé tes ennemis
  rationale: Le latin coordonne par « et », mais le contexte exprime nettement une opposition. « Tandis que » rend cette tension sans modifier les actions attribuées à Dieu.
- issue: Complément inexprimé de « non significasti »
  choice: sans rien faire connaître
  alternative: et tu ne l’as pas fait savoir
  rationale: Le latin ne précise pas ce qui n’a pas été manifesté. Éviter « l’ » empêche d’introduire un antécédent absent et préserve l’indétermination du texte.
translation_notes:
  register: Français moderne, digne et direct. Le passage du présent au passé composé reproduit le contraste entre « sustines » et les parfaits latins. La plainte demeure vive, et la fin volontairement indéterminée est signalée sans être complétée.
