translation:
  language: fr
  text: de lui, et tu lui as donné Isaac ; à Isaac, tu as donné Jacob et Ésaü. Tu as mis Jacob à part pour toi, mais tu as séparé Ésaü, et Jacob est devenu
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: segregasti tibi
  choice: tu as mis Jacob à part pour toi
  rationale: Rend explicitement la consécration ou la sélection en faveur de Dieu, tout en conservant le complément « pour toi ».
- source_word: separasti
  choice: tu as écarté
  rationale: Distingue ce verbe de « segregasti » et exprime ici une séparation défavorable, sans préciser davantage ce que le texte laisse implicite.
- source_word: factus est
  choice: est devenu
  rationale: Préserve le sens littéral et la phrase inachevée à la fin du fragment.
theological_decisions:
- issue: Contraste entre le choix de Jacob et la séparation d’Ésaü
  choice: « mis Jacob à part pour toi » / « écarté Ésaü »
  alternative: « réservé Jacob pour toi » / « séparé Ésaü »
  rationale: Le choix retenu maintient l’asymétrie théologique du latin sans ajouter de notion explicite de rejet, de condamnation ou d’élection éternelle.
translation_notes:
  register: Français moderne, clair et digne. Le début et la fin demeurent volontairement fragmentaires, car le verset fourni commence au milieu d’une proposition et s’achève avant son complément.
