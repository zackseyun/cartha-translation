lexical_decisions:
- source_word: desertionem
  choice: désolation
  rationale: Dans ce contexte, le terme désigne l’état dévasté et abandonné de Sion; « désolation » restitue naturellement ces deux aspects.
- source_word: habundantiam
  choice: prospérité
  rationale: Le latin exprime ici l’abondance dont jouissent les habitants de Babylone. « Prospérité » rend clairement le contraste avec la désolation de Sion sans suggérer une simple supériorité numérique.
- source_word: qui habitabant
  choice: ceux qui habitaient
  rationale: L’imparfait conserve l’aspect duratif du latin et suit directement la formulation de la source.
- source_word: in Babilone
  choice: à Babylone
  rationale: En français courant, la préposition naturelle devant le nom de cette ville est « à ».
