lexical_decisions:
- source_word: dominator domine
  choice: Maître, Seigneur
  rationale: Conserve les deux titres du latin et leur adresse solennelle, sans les fondre en une paraphrase interprétative.
- source_word: ab initio
  choice: dès le commencement
  rationale: Rend la valeur temporelle du latin et son idée d’un point de départ originel.
- source_word: plasmasti
  choice: as façonné
  rationale: Évoque l’action de modeler ou de former, particulièrement appropriée dans le contexte de la création.
- source_word: imperasti pulu̇eri
  choice: as donné un ordre à la poussière
  rationale: Expression française naturelle qui conserve la poussière comme destinataire du commandement.
theological_decisions:
- issue: Dieu seul lors de la formation de la terre
  choice: et cela, toi seul
  alternative: alors que tu étais seul
  rationale: Suit la formulation elliptique « et hoc solus » sans préciser davantage si l’accent porte exclusivement sur l’acte accompli ou sur l’absence de tout autre agent.
