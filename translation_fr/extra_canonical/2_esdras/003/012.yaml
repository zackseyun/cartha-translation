source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum coepissent multiplicari qui habitabant super terram, et multiplicauerunt filios et populos et gentes multas, et coeperunt iterato impietatem facere plus quam priores.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: fr
  text: Il arriva que, lorsque ceux qui habitaient sur la terre commencèrent à se multiplier, ils multiplièrent des enfants, des peuples et de nombreuses nations, et recommencèrent à commettre l’impiété, plus que ceux qui les avaient précédés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: Et voici ce qui arriva
  rationale: Formulation narrative française naturelle et digne, qui conserve l’introduction événementielle du latin.
- source_word: qui habitabant super terram
  choice: les habitants de la terre
  rationale: Rend directement le groupe latin dans un français courant.
- source_word: multiplicari / multiplicauerunt
  choice: se multiplier / multiplièrent
  rationale: Préserve la répétition intentionnelle du verbe latin sans préciser indûment le mode d’accroissement.
- source_word: filios et populos et gentes multas
  choice: leurs enfants, leurs peuples et leurs nombreuses nations
  rationale: Conserve les trois catégories et rattache naturellement en français les compléments au sujet; « nations » distingue gentes de populos.
- source_word: impietatem facere
  choice: agir avec impiété
  rationale: Expression intelligible qui garde la portée religieuse et morale de impietas sans l’aplatir en simple méchanceté.
- source_word: priores
  choice: leurs prédécesseurs
  rationale: Le comparatif substantivé désigne ceux qui les ont précédés; ce choix conserve cette référence sans identifier plus précisément le groupe.
theological_decisions:
- issue: Degré comparatif de l’impiété
  choice: plus encore que leurs prédécesseurs
  alternative: davantage que ceux d’avant eux
  rationale: Conserve l’affirmation comparative du latin sans expliquer en quoi leur impiété était supérieure ni résoudre l’identité exacte des priores.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « se multiplier / multiplièrent » est maintenue malgré sa légère lourdeur afin de refléter celle du latin. Aucun marqueur de note n’est requis.
