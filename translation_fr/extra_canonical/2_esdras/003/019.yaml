  source_fidelity: Le latin fourni porte « ut dares semini Iacob legem, et generationi Israel » et s’interrompt après « Israël ». Il ne contient donc pas « ton commandement ». La restitution entre crochets introduit un terme absent de la source, et l’attribution de cette restitution à la couche anglaise ne constitue pas un appui textuel original. La formulation révisée traduit le texte attesté sans suppléer son terme final manquant.
  naturalness: « Tu as fait trembler les abîmes et bouleversé le monde » est naturel et soutenu. « Ta gloire a franchi les quatre portes » conserve volontairement une image opaque, conformément au latin. La coordination « donner la Loi à la descendance de Jacob et à la génération d’Israël » reste idiomatique en français tout en ne masquant pas, par un ajout, l’interruption de la source.
  terminology: « abîmes », « monde », « feu », « tremblement de terre », « vent », « gel », « descendance de Jacob » et « génération d’Israël » rendent adéquatement le latin. La majuscule à « Loi » est acceptable ici pour la loi donnée à Jacob/Israël. « Vent » est un choix contextuellement solide pour spiritus.
