  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
translation:
  language: fr
  text: Tu as fait trembler les abîmes et bouleversé le monde. Ta gloire a franchi les quatre portes — le feu, le tremblement de terre, le vent et le gel[a] — afin de donner la Loi à la descendance de Jacob et à la génération d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ta gloire a franchi les quatre portes — le feu, le tremblement de terre, le vent et le gel » est difficile tant sur le plan du texte que de l’image. La traduction conserve l’étrange représentation théophanique du latin au lieu de l’harmoniser avec l’Exode.
    reason: textual_variant
  - marker: b
    text: Le texte latin fourni s’achève abruptement après « et à la génération d’Israël ». La traduction ne supplée pas le terme final absent. La version anglaise de consultation ajoute « ton commandement », mais cet ajout ne figure pas dans le texte latin cité.
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  choice: les abîmes
  rationale: Conserve l’image cosmique du pluriel latin et reste naturel en français biblique moderne.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte cosmique, « monde » rend mieux saeculum que « siècle », qui évoquerait surtout une période de cent ans en français courant.
- source_word: portas quattuor
  choice: les quatre portes
  rationale: Reproduction directe de l’image difficile du texte latin, sans l’harmoniser avec le récit de l’Exode.
- source_word: spiritus
  choice: le vent
  rationale: Parmi les phénomènes théophaniques énumérés, le sens concret de « vent » est le plus probable, tout en reconnaissant que spiritus peut aussi signifier « souffle » ou « esprit ».
- source_word: gelus
  choice: le gel
  rationale: Rend littéralement le phénomène de froid intense désigné par le latin et préserve l’étrangeté de l’énumération.
- source_word: semini Iacob
  choice: à la descendance de Jacob
  rationale: « Descendance » exprime naturellement en français collectif le latin semen sans l’archaïsme de « semence ».
theological_decisions:
- issue: Nature des quatre portes
  choice: Conserver « les quatre portes — le feu, le tremblement de terre, le vent et le gel »
  alternative: Reformuler l’image selon les manifestations du Sinaï dans l’Exode
  rationale: Le latin présente une image théophanique inhabituelle. La traduction ne doit pas résoudre cette difficulté par une harmonisation confessionnelle ou narrative.
- issue: Fin syntaxiquement incomplète du texte latin fourni
  choice: Restituer prudemment « [ton commandement] » entre crochets
  alternative: Traduire littéralement « et à la génération d’Israël », malgré l’inachèvement syntaxique
  rationale: Après « et generationi Israel », le texte fourni semble manquer le complément d’objet parallèle. L’anglais audité atteste « your commandment »; les crochets signalent honnêtement que ces mots ne figurent pas dans le latin transmis ici.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement divin est maintenu. « Loi » prend une majuscule puisqu’il s’agit ici de la Torah donnée à la descendance de Jacob. Les tirets mettent en relief l’apposition énigmatique sans en clarifier artificiellement le rapport aux « quatre portes ».
