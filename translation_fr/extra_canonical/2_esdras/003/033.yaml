id: 2ES.3.33
reference: 2 Esdras 3:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
translation:
  language: fr
  text: Pourtant, leur récompense ne s’est pas manifestée, et leur travail n’a pas porté de fruit. Car j’ai parcouru les nations et je les ai vues prospérer[a], alors qu’elles ne se souviennent pas de tes commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vivre dans l’abondance ».'
    reason: Le latin abundantes peut décrire plus largement un état d’abondance, tandis que « prospérer » en donne une formulation française naturelle.
lexical_decisions:
- source_word: merces
  choice: récompense
  rationale: Rend le sens principal de merces dans ce contexte, à savoir la rétribution attendue, sans le limiter au seul salaire matériel.
- source_word: non conparuit
  choice: ne s’est pas manifestée
  rationale: Conserve l’idée d’une récompense qui n’est pas apparue ou devenue visible, dans un français naturel et digne.
- source_word: labor fructificavit
  choice: le travail n’a pas porté de fruit
  rationale: Préserve l’image latine de la fructification tout en employant une expression française courante.
- source_word: pertransiens enim pertransivi
  choice: Car j’ai parcouru
  rationale: Le latin emploie une répétition emphatique difficile à reproduire sans lourdeur; « parcouru » exprime le passage à travers de nombreuses nations.
- source_word: abundantes
  choice: prospérer
  rationale: Dans ce contraste, le participe désigne des nations qui connaissent l’abondance ou la réussite; « prospérer » est idiomatique sans préciser indûment la nature de cette prospérité.
- source_word: non memorantes
  choice: alors qu’elles ne se souviennent pas
  rationale: « Alors que » fait ressortir le contraste présent dans le texte sans transformer le participe en relation causale.
theological_decisions:
- issue: Le contraste entre la stérilité du travail évoqué et la prospérité des nations désobéissantes
  choice: Maintenir le contraste sans l’expliquer ni le résoudre
  alternative: Préciser que leur prospérité est uniquement matérielle ou provisoire
  rationale: Le latin constate simplement l’abondance des nations malgré leur oubli des commandements; ajouter sa nature ou sa durée importerait une interprétation absente du verset.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le tutoiement de Dieu est conservé. L’accord féminin de « vues » et « elles » reprend explicitement « les nations ».
