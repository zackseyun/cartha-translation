  source_fidelity: 'Le texte français rend fidèlement le latin : « récompense » traduit bien merces, « ne s’est pas manifestée » exprime non conparuit, et « n’a pas porté de fruit » conserve l’image de labor fructificavit. « J’ai parcouru les nations » restitue naturellement pertransiens pertransivi, dont la répétition emphatique ne se transpose pas aisément sans lourdeur. « Je les ai vues prospérer » rend adéquatement abundantes sans restreindre indûment l’abondance à un domaine précis. La concession finale conserve le contraste de non memorantes mandatorum tuorum.'
