source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: impietatem facere plus quam priores. Et factum est cum iniquitatem facerent coram te, elegisti tibi ex his unum, cui
  language: Latin
base_translation:
