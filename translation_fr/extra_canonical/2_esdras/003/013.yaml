  yaml_path: translation/extra_canonical/2_esdras/003/013.yaml
  text: And it happened, when they were committing iniquity before you, you chose for yourself one from among them,
translation:
  language: fr
  text: Et il arriva que, lorsqu’ils commettaient l’iniquité devant toi, tu choisis pour toi-même l’un d’entre eux, à qui
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitatem facerent
  choice: commettaient l’iniquité
  rationale: Rend directement l’action répétée ou en cours exprimée par l’imparfait latin, dans un français naturel et digne.
- source_word: coram te
  choice: devant toi
  rationale: Conserve la dimension relationnelle et judiciaire de l’expression latine sans la réduire à « sous tes yeux ».
- source_word: elegisti tibi
  choice: tu en choisis un pour toi-même
  rationale: Préserve le datif d’intérêt « tibi » et l’idée que Dieu choisit cette personne pour lui-même.
- source_word: ex his unum
  choice: tu en choisis un
  rationale: Le pronom « en » rend « parmi eux » de façon naturelle, tandis que « un » respecte l’absence de substantif explicite après « unum ».
- source_word: cui
  choice: à qui
  rationale: La proposition se poursuit au verset suivant; maintenir ce relatif final respecte la syntaxe fragmentaire de la source fournie.
theological_decisions:
- issue: Identité de la personne choisie
  choice: un
  alternative: un homme
  rationale: Le latin porte seulement « unum ». Ne pas ajouter « homme » conserve l’implicite du texte, même si le référent est vraisemblablement masculin.
- issue: Portée de « tibi »
  choice: pour toi-même
  alternative: omis ou « à ton service »
  rationale: Le texte indique que Dieu choisit pour lui-même; « à ton service » préciserait indûment la fonction du choix.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La tournure « Et il arriva que » conserve la cadence narrative biblique. La fin « à qui » est volontairement suspendue, car le texte source fourni se termine sur le relatif « cui » et se poursuit dans le verset suivant.
