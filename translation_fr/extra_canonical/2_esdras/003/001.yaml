revisions:
- from: La trentième année après la ruine de la ville, j’étais à Babylone, moi, Salathiel, appelé aussi Esdras. Tandis que j’étais allongé sur mon lit, je fus bouleversé, et mes pensées montèrent dans mon cœur.
  to: La trentième année après la ruine de la ville, j’étais à Babylone, moi, Salathiel, qui suis aussi Esdras. Comme j’étais couché sur mon lit, je fus bouleversé, et mes pensées s’élevaient dans mon cœur[a].
  rationale: La révision conserve le sens et le registre du projet, rend plus directement l’identité « Salathiel ... Esdras », restitue l’imparfait de ascendebant et signale en note l’image littérale de super cor meum. Aucune interprétation théologique n’est ajoutée.
