source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
translation:
  language: fr
  text: La trentième année après la ruine de la ville, j’étais à Babylone, moi, Salathiel, qui suis aussi Esdras. Comme j’étais couché sur mon lit, je fus bouleversé, et mes pensées s’élevaient dans mon cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « montaient sur mon cœur ».'
    reason: Le latin conserve une image biblique inhabituelle en français; le texte principal la rend de façon naturelle tout en maintenant « cœur ».
lexical_decisions:
- source_word: ruinae civitatis
  choice: après la ruine de la ville
  rationale: Le génitif latin indique naturellement le repère à partir de la ruine de la ville; cette formulation reste proche du texte tout en étant claire en français.
- source_word: Salathihel qui et Ezras
  choice: Salathiel, appelé aussi Esdras
  rationale: Rend l’expression latine d’identité ou de double nom de manière naturelle, sans suggérer deux personnes.
- source_word: conturbatus sum
  choice: je fus bouleversé
  rationale: Exprime un trouble intérieur profond et convient au registre narratif solennel.
- source_word: cogitationes meae ascendebant super cor meum
  choice: mes pensées montèrent dans mon cœur
  rationale: Conserve l’image ascendante et la référence biblique au cœur comme siège de la réflexion, tout en évitant une tournure française artificielle telle que «sur mon cœur».
theological_decisions:
- issue: Le sens de «cœur» dans l’idiome biblique
  choice: Conserver «cœur»
  alternative: Rendre par «esprit» ou «pensée»
  rationale: Le latin garde l’anthropologie biblique où le cœur est le lieu de la pensée et du discernement; remplacer ce mot expliciterait et réduirait indûment l’image.
translation_notes:
  register: Français moderne, digne et accessible. La phrase latine très coordonnée est divisée en deux phrases pour assurer une lecture naturelle, sans perte de contenu.
