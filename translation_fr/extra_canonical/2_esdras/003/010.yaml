source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est in uno casus corum, sicut Adac mors, sic et his diluuium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/010.yaml
  text: 'And one fate came upon them all: as death came to Adam, so the flood came to these also.'
translation:
  language: fr
  text: 'Et un seul sort les atteignit tous : comme la mort atteignit Adam, de même le déluge atteignit ceux-ci aussi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in uno casus eorum
  choice: un même sort les frappa tous
  rationale: Le latin transmis est syntaxiquement irrégulier, mais exprime qu’un sort commun atteignit l’ensemble du groupe. « Un même sort » restitue naturellement en français l’unité indiquée par « uno » sans suggérer un événement numériquement identique.
- source_word: sicut Adac mors
  choice: comme la mort frappa Adam
  rationale: La formulation elliptique latine est explicitée avec le verbe « frapper », déjà employé dans la proposition principale, tout en conservant le parallèle entre Adam et les hommes concernés.
- source_word: sic et his diluuium
  choice: le déluge les frappa eux aussi
  rationale: « Eux aussi » rend la valeur additive de « et » et le renvoi démonstratif de « his », tandis que « le déluge » reste le sujet parallèle à « la mort ».
theological_decisions:
- issue: Nature du parallèle entre Adam et les hommes du déluge
  choice: Conserver un parallèle de sort sans préciser davantage sa portée théologique
  alternative: Présenter le déluge comme la conséquence directe de la mort ou du péché d’Adam
  rationale: Le texte met en regard la mort qui frappa Adam et le déluge qui frappa ces hommes, mais n’explicite pas ici le rapport théologique entre les deux.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « frappa » clarifie les ellipses du latin et donne au verset un parallélisme naturel.
