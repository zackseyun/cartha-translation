lexical_decisions:
- source_word: induxisti
  choice: tu l’as fait entrer
  rationale: Rend naturellement le causatif latin « conduire/faire entrer » dans ce contexte.
- source_word: paradisum
  choice: le paradis
  rationale: Équivalent français direct, naturel et traditionnel du latin.
- source_word: dextera tua
  choice: ta main droite
  rationale: Conserve l’image anthropomorphique et la formulation concrète de la source.
- source_word: plantauit
  choice: avait planté
  rationale: Le plus-que-parfait exprime l’antériorité de cette action par rapport à l’entrée dans le paradis.
- source_word: antequam terra adueṅtaret
  choice: avant que la terre ne vienne à l’existence
  rationale: Dans ce contexte cosmologique, la formule exprime la venue à l’existence de la terre; le ne explétif est idiomatique après « avant que ».
theological_decisions:
- issue: Préexistence du paradis par rapport à la terre
  choice: avant que la terre ne vienne à l’existence
  alternative: avant que la terre n’apparaisse
  rationale: La traduction retient le sens contextuel de venue à l’existence sans développer davantage la relation cosmologique ni harmoniser le verset avec un système théologique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du latin tout en étant naturelle; aucun marqueur de note n’est requis.
