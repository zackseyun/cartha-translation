  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
translation:
  language: fr
  text: Mais lorsque je suis arrivé ici et que j’ai vu des impiétés sans nombre, mon âme a vu beaucoup de pécheurs en cette trentième année, et mon cœur a défailli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « mon cœur passa au-delà » ou « sortit de son état ». L’expression latine est difficile ; elle peut évoquer la défaillance ou le bouleversement.
    reason: Le sens de « excessit cor meum » est disputé. La note conserve cette ambiguïté tout en expliquant le choix de traduction.
lexical_decisions:
- source_word: impietates quorum non est numerus
  choice: des actes d’impiété innombrables
  rationale: Rend le pluriel latin et l’idée littérale d’un nombre impossible à compter, dans un français plus naturel que « des impiétés sans nombre ».
- source_word: delinquentes multos
  choice: beaucoup de pécheurs
  rationale: « Delinquentes » désigne ici ceux qui commettent des fautes ou des péchés ; « pécheurs » convient au contexte religieux sans préciser indûment la nature des transgressions.
- source_word: vidit anima mea
  choice: mon âme a vu
  rationale: Conserve l’image et la répétition du verbe « voir » présentes dans le latin, plutôt que de les réduire à une simple constatation intellectuelle.
- source_word: excessit cor meum
  choice: mon cœur a défailli
  rationale: Dans ce contexte de détresse devant le mal, l’expression indique que le cœur cède ou manque à l’auteur. « A défailli » reste idiomatique et digne, tout en évitant l’interprétation peu probable d’un cœur qui « déborde ».
theological_decisions:
- issue: Nature de la réaction exprimée par « excessit cor meum »
  choice: mon cœur a défailli
  alternative: mon cœur en fut bouleversé / mon cœur déborda
  rationale: Le latin est inhabituel et peut évoquer un cœur qui sort de son état normal. La traduction retient la défaillance sous l’effet du choc, tandis que la note signale l’expression littérale et l’ambiguïté sans imposer une lecture doctrinale.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe garde la progression du latin et sa répétition expressive de « voir », tout en employant « actes d’impiété » pour éviter un pluriel abstrait peu naturel.
