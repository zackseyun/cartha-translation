  text: temporum finem solo secrete noctu. Et disposuisti ei testamentum aeternum, et dixisti ei ut non unquam derelinqueres semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/015.yaml
  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: fr
  text: Tu as établi avec lui une alliance éternelle et tu lui as dit que jamais tu n’abandonnerais sa descendance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: disposuisti ei testamentum aeternum
  choice: tu as établi avec lui une alliance éternelle
  rationale: Dans ce contexte, « testamentum » désigne une alliance, et « disposuisti » son établissement. La tournure française « avec lui » exprime naturellement la relation d’alliance portée par le datif « ei ».
- source_word: non unquam derelinqueres
  choice: jamais tu n’abandonnerais
  rationale: Rend avec force la négation absolue « non unquam » et conserve le futur dans le passé après « tu lui as dit ».
- source_word: semen
  choice: sa descendance
  rationale: « Descendance » restitue le sens collectif de « semen » dans une promesse d’alliance, sans suggérer un seul descendant.
theological_decisions:
- issue: Portée collective de « semen »
  choice: sa descendance
  alternative: sa postérité / sa semence
  rationale: Le terme latin peut littéralement signifier « semence », mais désigne ici collectivement les descendants. « Descendance » est clair, actuel et ne tranche pas en faveur d’un individu particulier.
translation_notes:
  register: Français moderne, digne et direct. La répétition de « lui » conserve les relations explicites du latin sans alourdir excessivement la phrase.
