source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
translation:
  language: fr
  text: Chaque nation suivit sa propre volonté[a] ; elles agissaient avec impiété devant toi et te méprisaient, et toi, tu ne les en as pas empêchées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « marchait dans sa propre volonté ».'
    reason: Signale l’image de la marche présente dans le latin tout en permettant une formulation naturelle dans le texte principal.
lexical_decisions:
- source_word: ambulauit
  choice: suivait
  rationale: Dans l’expression « ambulauit ... in uoluntate sua », « suivait » rend naturellement en français le sens figuré de la conduite sans conserver artificiellement le verbe « marcher ».
- source_word: unaquaeque gens
  choice: Chaque nation
  rationale: Rend directement la valeur distributive de « unaquaeque » et le sens collectif de « gens ».
- source_word: in uoluntate sua
  choice: sa propre volonté
  rationale: Préserve l’idée que chaque nation se conduisait selon sa volonté particulière ; « propre » explicite la valeur réfléchie de « sua ».
- source_word: impie agebant
  choice: agissaient avec impiété
  rationale: Rend l’adverbe « impie » et le verbe général « agebant » dans un registre digne et intelligible.
- source_word: spernebant
  choice: te méprisaient
  rationale: Le complément « te », compris avec les deux verbes coordonnés, est exprimé naturellement en français ; « mépriser » correspond au sens de « spernere ».
- source_word: non prohibuisti eos
  choice: tu ne les en as pas empêchées
  rationale: « Empêcher » rend « prohibere » ; « en » reprend les actions précédentes, et l’accord féminin renvoie aux nations.
theological_decisions:
- issue: Non-intervention divine face à l’impiété des nations
  choice: « tu ne les en as pas empêchées »
  alternative: « tu ne les as pas arrêtées »
  rationale: La formulation conserve sans l’atténuer la tension théologique du texte, qui affirme que Dieu n’a pas empêché leur conduite, sans en déduire qu’il l’approuvait.
translation_notes:
  register: Français international moderne, clair et digne. Le passage du singulier distributif « chaque nation suivait » au pluriel « elles agissaient » reproduit le changement latin de « ambulauit » à « agebant » et « spernebant ».
