source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo pondera in statera nostras iniquitates et eorum qui habitant in saeculo, et invenietur momentum puncti ubi declinet.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
translation:
  language: fr
  text: À présent donc, pèse dans la balance nos injustices et celles des habitants du monde ; et l’on verra de quel côté penche l’indicateur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniquitates
  choice: fautes
  rationale: « Fautes » rend ici les actes coupables à comparer sans imposer une terminologie doctrinale plus étroite ; « iniquités » serait possible, mais moins courant en français moderne.
- source_word: saeculo
  choice: monde
  rationale: Dans « qui habitant in saeculo », le terme désigne le monde habité ou l’ordre présent ; « monde » est naturel et correspond au contexte.
- source_word: momentum puncti ... declinet
  choice: de quel côté elle penche
  rationale: Dans l’image de la balance, la formule évoque le mouvement ou l’inclinaison indiquant lequel des deux poids l’emporte. Cette formulation française conserve l’image sans ajouter explicitement une « aiguille », absente du texte latin.
theological_decisions:
- issue: Objet de la comparaison morale
  choice: nos fautes et celles des habitants du monde
  alternative: nos iniquités et celles des habitants du siècle
  rationale: La traduction conserve la comparaison collective du texte, sans préciser la nature ou la portée théologique de la culpabilité au-delà du latin.
translation_notes:
  register: Français moderne, clair et digne. L’impératif singulier « pèse » est conservé. Le point-virgule marque le passage de l’ordre donné à son résultat attendu.
