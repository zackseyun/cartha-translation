source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut quando non peccaverunt in conspectu tuo qui habitant terram, aut quae gens sic observavit mandata tua?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: fr
  text: Ou quand ceux qui habitent la terre n’ont-ils pas péché devant toi ? Ou quelle nation a observé ainsi tes commandements ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in conspectu tuo
  choice: devant toi
  rationale: Expression française naturelle qui conserve l’idée d’agir sous le regard et en présence de Dieu.
- source_word: sic observavit
  choice: a observé ainsi
  rationale: Rend explicitement sic sans préciser davantage son référent, préservant l’ambiguïté du latin.
- source_word: mandata tua
  choice: tes commandements
  rationale: Équivalent direct, courant et digne de mandata dans ce contexte religieux.
theological_decisions:
- issue: Portée des questions rhétoriques sur le péché et l’obéissance
  choice: Conserver les deux interrogations sans ajouter de réponse explicite
  alternative: 'Reformuler affirmativement : « Tous ont péché… aucune nation… »'
  rationale: Le latin formule des questions rhétoriques ; les transformer en affirmations résoudrait inutilement leur force et leur portée.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La structure parallèle des deux questions du latin est conservée.
