source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut alia gens cognovit te praeter Israhel? aut quae tribus crediderunt testamentis sicut haec Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/032.yaml
  text: Or has any other nation known you besides Israel? Or what tribes have believed the covenants like this Jacob?[a]
translation:
  language: fr
  text: Ou bien une autre nation, en dehors d’Israël, t’a-t-elle connu ? Ou quelles tribus ont cru aux alliances comme celles de Jacob ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: alia gens
  choice: une autre nation
  rationale: Le latin exprime une autre nation, avec la question qui lui donne ici le sens de « quelque autre nation » ; cette formulation reste naturelle en français.
- source_word: cognovit te
  choice: t’a-t-elle connu
  rationale: Rend directement le parfait latin et conserve la portée relationnelle du verbe « connaître ».
- source_word: testamentis
  choice: aux alliances
  rationale: Dans ce contexte biblique, « alliances » rend le pluriel de testamentum sans ajouter le possessif absent du latin.
- source_word: haec Iacob
  choice: celles de Jacob
  rationale: 'Haec est compris comme reprenant les tribus, selon un usage latin tardif, et Iacob comme complément de relation : les tribus de Jacob.'
theological_decisions:
- issue: Possessif implicite avec « alliances »
  choice: aux alliances
  alternative: à tes alliances
  rationale: Le latin ne porte aucun possessif ; ne pas l’ajouter préserve la formulation de la source.
- issue: Référent de « haec Iacob »
  choice: celles de Jacob
  alternative: ce Jacob
  rationale: Bien que la construction latine soit irrégulière, haec se rattache plus vraisemblablement au féminin pluriel tribus qu’au nom masculin singulier Jacob ; cette lecture évite une discordance grammaticale et correspond au parallèle Israël/Jacob.
translation_notes:
  register: Français moderne, digne et lisible. L’inversion interrogative soutient le registre biblique sans archaïsme marqué ; « celle d’Israël » explicite naturellement la comparaison impliquée par praeter Israhel.
