  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: fr
  text: Tu lui as donné ton commandement[a], mais il l’a transgressé. Aussitôt, tu as établi la mort pour lui et pour sa descendance. De lui sont issus des nations et des tribus, des peuples et des clans, en nombre incalculable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin porte littéralement « ton soin », « ton application » ou « ta diligence » ; dans ce contexte, l’expression désigne ce que Dieu lui avait prescrit.
    reason: Signaler la valeur lexicale inhabituelle de diligentiam tout en justifiant le rendu contextuel « commandement ».
lexical_decisions:
- source_word: diligentiam tuam
  choice: ton commandement
  rationale: Le latin signifie littéralement « ton soin » ou « ta diligence », mais le verbe praeterire avec le pronom eam indique ici quelque chose qui peut être enfreint; « ton commandement » rend naturellement le sens contextuel sans ajouter l’idée d’un commandement unique.
- source_word: praeteriit eam
  choice: il l’a transgressé
  rationale: Praeterire peut signifier passer outre ou enfreindre; le pronom reprend le commandement et justifie le verbe français « transgresser ».
- source_word: in nationibus eius
  choice: pour ses descendants
  rationale: L’expression latine dit formellement « dans/sur ses nations », mais désigne ici les peuples issus de cet homme; « ses descendants » exprime clairement cette relation avant l’énumération qui suit.
- source_word: cognationes
  choice: clans
  rationale: Le terme désigne des groupes liés par la parenté; « clans » est actuel, compréhensible et distinct de « tribus ».
- source_word: quorum non est numerus
  choice: en nombre incalculable
  rationale: Cette formulation idiomatique rend le sens de « dont il n’y a pas de nombre » tout en conservant l’idée d’une multitude impossible à compter.
theological_decisions:
- issue: L’établissement de la mort après la transgression
  choice: tu as établi la mort pour lui et pour ses descendants
  alternative: tu l’as condamné à mort, lui et ses descendants
  rationale: « Établi la mort » reste proche de instituisti mortem et préserve la formulation théologique du texte sans préciser davantage le mécanisme de cette décision divine.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement divin correspond au registre biblique français courant. Les quatre termes collectifs du latin sont conservés dans une énumération naturelle.
