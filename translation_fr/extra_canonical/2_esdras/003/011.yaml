source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dereliquisti autem unum ex his, id Noe cum domo sua, ex eo iustos omnes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: fr
  text: Mais tu as laissé l’un d’eux, Noé avec sa famille, et de lui sont issus tous les justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  choice: tu as laissé
  rationale: Rend directement le parfait latin dans une formulation française naturelle, sans ajouter l’idée de salut ou de préservation qui n’est pas explicitement exprimée.
- source_word: domo sua
  choice: sa famille
  rationale: Dans ce contexte, « domus » désigne les membres de la maison de Noé plutôt que le bâtiment; « famille » est clair et idiomatique en français moderne.
- source_word: ex eo
  choice: de lui sont issus
  rationale: Explicite naturellement en français le lien d’origine ou de descendance exprimé par « ex eo », tout en conservant Noé comme antécédent masculin singulier.
- source_word: iustos omnes
  choice: tous les justes
  rationale: Conserve la portée universelle de « omnes » et le sens moral ou religieux substantivé de « iustos ».
theological_decisions:
- issue: Portée de l’affirmation concernant les justes
  choice: tous les justes
  alternative: tous ceux qui sont justes
  rationale: La traduction garde l’affirmation absolue du latin sans préciser s’il s’agit d’une descendance généalogique, d’une origine historique ou d’une catégorie théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche du latin tout en évitant le tour peu naturel « Noé avec sa maison ».
