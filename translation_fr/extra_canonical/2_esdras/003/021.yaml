id: 2ES.3.21
reference: 2 Esdras 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lex tua in eis fructum. Cor enim malignum baiolans primus Adam transgressus et uictus est, sed et omnes qui ex eo nati
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: fr
  text: Car le premier Adam, portant un cœur mauvais, a transgressé et a été vaincu ; il en a été de même pour tous ceux qui sont nés de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Cor enim malignum baiolans
  choice: Car le premier Adam, portant un cœur mauvais
  rationale: « Portant » rend directement baiolans sans ajouter l’idée plus forte d’un fardeau ; « cœur mauvais » conserve la formulation anthropologique du latin.
- source_word: transgressus
  choice: a transgressé
  rationale: Le verbe français conserve le caractère absolu du latin, qui ne précise pas l’objet de la transgression.
- source_word: uictus est
  choice: a été vaincu
  rationale: La tournure passive respecte le latin et maintient la distinction entre la transgression d’Adam et la défaite qui s’ensuit.
- source_word: sed et omnes qui ex eo nati
  choice: il en a été de même pour tous ceux qui sont nés de lui
  rationale: Cette formulation naturelle exprime que l’énoncé précédent vaut également pour tous les descendants d’Adam, sans préciser davantage le mécanisme de cette solidarité.
theological_decisions:
- issue: Rapport entre la faute d’Adam et celle de ses descendants
  choice: Conserver l’affirmation que la transgression et la défaite valent également pour tous ceux qui sont nés de lui
  alternative: Interpréter explicitement le passage comme une culpabilité héritée ou comme une simple imitation
  rationale: Le latin établit une solidarité entre Adam et ses descendants, mais n’en définit pas le mécanisme ; la traduction préserve cette tension sans importer une doctrine particulière.
translation_notes:
  register: Français moderne, clair et digne. Le fragment initial « lex tua in eis fructum. » appartient manifestement à la fin de la phrase ou du verset précédent dans le texte fourni et n’est donc pas intégré à 2 Esdras 3:21.
