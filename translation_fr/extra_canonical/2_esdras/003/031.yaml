  text: nothing to anyone about how this way should be abandoned[a]. Does Babylon do better than Zion?
translation:
  language: fr
  text: rien à personne sur la manière dont cette voie doit être abandonnée.[a] Babylone fait-elle mieux que Sion ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset commence au milieu d’une phrase; il se rattache aux mots « et tu n’as pas indiqué » du verset précédent.
    reason: Le découpage des versets sépare le complément « rien à personne… » de son verbe et de sa négation, ce qui explique la formulation fragmentaire.
lexical_decisions:
- source_word: nihil nemini
  choice: rien à personne
  rationale: Conserve les deux indéfinis négatifs du latin et le raccord syntaxique avec « et non significasti » à la fin du verset précédent.
- source_word: quomodo debeat derelinqui via haec
  choice: sur la manière dont cette voie doit être abandonnée
  rationale: Rend la construction interrogative indirecte et le passif de manière formelle, sans préciser qui abandonne la voie.
- source_word: numquid meliora facit
  choice: fait-elle mieux
  rationale: Expression française naturelle qui garde la question rhétorique et le sens comparatif général de « facit meliora ».
- source_word: Babylon quam Sion
  choice: Babylone … que Sion
  rationale: Maintient directement le contraste entre les deux villes personnifiées.
theological_decisions:
- issue: Référent et sens de « cette voie »
  choice: Conserver « cette voie » sans l’interpréter
  alternative: Préciser qu’il s’agit de la voie mauvaise ou de la conduite de Babylone
  rationale: Le latin ne précise ni la nature de la voie ni son référent exact; l’ambiguïté doit rester visible.
- issue: Portée de la comparaison entre Babylone et Sion
  choice: « fait-elle mieux »
  alternative: « agit-elle mieux » ou « accomplit-elle de meilleures choses »
  rationale: La formulation retenue préserve la portée ouverte de « meliora facit » sans réduire la comparaison à la seule conduite morale.
translation_notes:
  register: Français moderne, sobre et digne. La première proposition reste volontairement fragmentaire afin de respecter le découpage du texte latin; la note explicite son lien syntaxique avec le verset précédent.
