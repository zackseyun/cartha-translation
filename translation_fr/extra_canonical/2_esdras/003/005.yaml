- from: Tu as donné à Adam un corps sans vie, qui était pourtant lui aussi l’ouvrage de tes mains. Tu as insufflé en lui le souffle de vie, et il est devenu vivant devant toi.
  to: Tu as donné à Adam un corps sans vie; mais lui aussi était l’œuvre de tes mains. Tu as insufflé en lui le souffle de vie, et il devint vivant devant toi.
  rationale: La révision corrige l’antécédent de « lui aussi », qui doit être Adam, tout en conservant la restitution contextuelle de la leçon latine initiale défectueuse. Elle maintient les termes bien choisis pour le corps encore inanimé, l’action créatrice et l’insufflation de vie.
