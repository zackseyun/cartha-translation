source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: fr
  text: Tu as donné à Adam un corps sans vie; mais lui aussi était l’œuvre de tes mains. Tu as insufflé en lui le souffle de vie, et il devint vivant devant toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corpus mortuum
  choice: un corps sans vie
  rationale: Rend naturellement l’idée d’un corps inanimé, sans suggérer nécessairement un cadavre antérieurement vivant.
- source_word: figmentum manuum tuarum
  choice: l’ouvrage de tes mains
  rationale: Expression française claire et digne qui conserve l’image de Dieu façonnant Adam.
- source_word: spiritum uitae
  choice: le souffle de vie
  rationale: Dans ce contexte de création et avec le verbe « insuffler », « souffle » exprime le sens vital de spiritus et fait naturellement écho au récit de la Genèse.
- source_word: factus est uiuens coram te
  choice: il est devenu vivant devant toi
  rationale: Suit de près la formulation latine tout en restant idiomatique en français.
theological_decisions:
- issue: Sujet et destinataire de « dedit tibi Adam » dans le texte latin transmis
  choice: Tu as donné à Adam un corps sans vie
  alternative: Et il t’a donné Adam, un corps mort
  rationale: 'La leçon fournie paraît grammaticalement perturbée : « dedit tibi Adam » ne correspond pas au déroulement du discours adressé à Dieu. Le contexte immédiat de la création d’Adam et la tradition textuelle sous-jacente appuient le sens selon lequel Dieu donne à Adam un corps encore inanimé. La traduction retient ce sens sans reproduire une anomalie vraisemblablement due à la transmission ou au nettoyage du texte.'
- issue: Nature de « spiritum uitae »
  choice: le souffle de vie
  alternative: l’esprit de vie
  rationale: « Souffle de vie » convient au geste d’insuffler et au contexte de l’animation d’Adam, sans imposer ici une distinction doctrinale entre souffle et esprit.
translation_notes:
  register: Français international moderne, simple et digne. La phrase a été divisée en deux pour alléger la coordination latine, tout en conservant l’enchaînement création–insufflation–vie.
