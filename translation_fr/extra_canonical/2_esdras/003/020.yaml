  yaml_path: translation/extra_canonical/2_esdras/003/020.yaml
  text: Yet you did not take away from them the evil heart, so that your law might bear fruit in them.
translation:
  language: fr
  text: Pourtant, tu ne leur as pas enlevé le cœur mauvais, afin que ta loi porte du fruit en eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cor malignum
  choice: le cœur mauvais
  rationale: Conserve le singulier collectif du latin et son sens moral, sans le réduire à une simple disposition psychologique.
- source_word: abstulisti ab eis
  choice: tu ne leur as pas enlevé
  rationale: Rend directement l’idée de retirer ou d’ôter quelque chose à quelqu’un dans un français naturel.
- source_word: ut faceret … fructum
  choice: afin que … porte du fruit
  rationale: Exprime la finalité marquée par « ut » et reprend l’image biblique de la fructification.
- source_word: lex tua
  choice: ta loi
  rationale: Traduction directe, claire et non confessionnelle de l’expression latine attestée par la suite textuelle du verset.
theological_decisions:
- issue: Rapport entre le retrait du cœur mauvais et la fécondité de la loi
  choice: afin que
  alternative: de sorte que
  rationale: Le latin « ut » avec le subjonctif se lit naturellement comme une proposition de but; la traduction conserve cette tension sans expliquer pourquoi Dieu n’a pas retiré le cœur mauvais.
translation_notes:
  register: Français moderne, digne et accessible. Le singulier collectif « le cœur mauvais » est maintenu, et « porter du fruit » préserve l’image du texte source.
