  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
translation:
  language: fr
  text: Mon esprit fut profondément bouleversé, et je me mis à adresser au Très-Haut des paroles pleines de crainte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uentilatus est spiritus meus ualde
  choice: Mon esprit fut alors profondément bouleversé
  rationale: Le latin décrit une forte agitation intérieure. « Profondément bouleversé » restitue naturellement cette intensité en français moderne sans imposer une cause précise.
- source_word: coepi loqui
  choice: je me mis à adresser
  rationale: Cette tournure exprime le commencement de la prise de parole et s’accorde naturellement avec le destinataire introduit par « au Très-Haut ».
- source_word: altissimum
  choice: Très-Haut
  rationale: Titre divin traditionnel, clair et digne, correspondant directement au superlatif latin substantivé.
- source_word: uerba timorata
  choice: des paroles pleines de crainte
  rationale: Cette formulation conserve l’idée que les paroles sont marquées par la crainte ou l’appréhension, tout en évitant l’ambiguïté moderne de « paroles effrayantes ».
theological_decisions:
- issue: Nature de la crainte exprimée par « timorata »
  choice: des paroles pleines de crainte
  alternative: des paroles anxieuses
  rationale: Le texte peut évoquer la peur, l’appréhension ou la révérence devant Dieu. La formulation retenue préserve cette amplitude sans réduire la crainte à la seule anxiété psychologique.
translation_notes:
  register: Français moderne, naturel et digne. La phrase garde l’intensité de l’agitation intérieure ainsi que la retenue craintive d’Esdras devant le Très-Haut.
