lexical_decisions:
- source_word: Iterum autem
  choice: De nouveau
  rationale: « Iterum » exprime la répétition dans le récit; « autem » sert ici de liaison discursive légère et n’exige pas un « mais » contrastif en français.
- source_word: in tempore
  choice: en son temps
  rationale: Cette expression conserve la valeur temporelle du latin sans préciser indûment s’il s’agit simplement du cours du temps ou d’un moment déterminé.
- source_word: induxisti diluuium super
  choice: tu as fait venir le déluge sur
  rationale: Rend le sens causatif de « induxisti » dans un français naturel et digne.
- source_word: habitantes saeculum
  choice: les habitants du monde
  rationale: Dans ce contexte, « saeculum » désigne le monde habité plutôt qu’un âge ou un siècle.
- source_word: perdidisti eos
  choice: tu les as détruits
  rationale: Reproduit directement la force de « perdidisti » et l’antécédent humain du pronom « eos ».
