  text: And this happened for many years. And those who lived in the city forsook it,
translation:
  language: fr
  text: Cela se produisit pendant de nombreuses années. Et les habitants abandonnèrent la ville,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est hoc annis multis
  choice: Cela dura de nombreuses années
  rationale: Dans ce contexte, la tournure exprime qu’une situation se prolongea pendant de nombreuses années; « dura » est naturel en français tout en respectant la valeur temporelle de l’expression latine.
- source_word: qui habitabant civitatem
  choice: les habitants
  rationale: Rend idiomatiquement la proposition relative latine « ceux qui habitaient la ville » sans perte de sens.
- source_word: dereliquerunt
  choice: abandonnèrent
  rationale: Le verbe signifie « laisser, délaisser, abandonner ». L’objet n’est pas exprimé après le verbe, mais la ville est l’antécédent contextuel naturel.
theological_decisions:
- issue: Sens de dereliquerunt
  choice: abandonnèrent la ville
  alternative: péchaient
  rationale: Le latin transmis ne contient aucun verbe signifiant « pécher ». La traduction conserve donc le sens lexical de « dereliquerunt » et explicite sobrement son objet implicite.
translation_notes:
  register: Français moderne, courant et digne. La coordination initiale de la seconde phrase est conservée par « Et », et la virgule finale signale que la phrase se poursuit au verset suivant.
