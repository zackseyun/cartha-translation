  text: tu les as fait sortir d’Égypte et tu les as conduits sur le mont Sinaï. Tu as incliné les cieux, établi la terre et ébranlé le monde, et
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inclinasti caelos
  choice: tu as incliné les cieux
  rationale: Rend directement l’image cosmique du latin, sans préciser davantage le mouvement.
- source_word: statuisti terram
  choice: affermi la terre
  rationale: Respecte le texte latin établi, où statuisti signifie mettre en place, établir ou affermir; cette traduction évite de corriger conjecturalement le texte en «ébranlé la terre».
- source_word: commouisti orbem
  choice: ébranlé le monde
  rationale: Commouere désigne ici une mise en mouvement ou une secousse; «le monde» rend naturellement orbem dans ce contexte cosmique.
- source_word: montem Sina
  choice: le mont Sinaï
  rationale: Forme française courante du nom géographique biblique.
theological_decisions:
- issue: Tension entre le latin statuisti et les versions anciennes qui pourraient refléter «secouer»
  choice: affermi la terre
  alternative: ébranlé la terre
  rationale: La traduction suit d’abord la source latine fournie, statuisti, tout en conservant la séquence cosmique sans adopter silencieusement une correction conjecturale fondée sur d’autres versions.
translation_notes:
  register: Français moderne, courant et digne. Le fragment transmis commence et finit au milieu d’une phrase; ces limites syntaxiques sont conservées. Le sujet initial absent du fragment français est laissé implicite conformément au latin tronqué.
