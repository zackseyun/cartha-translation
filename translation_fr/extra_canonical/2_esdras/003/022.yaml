    issue: « malignité de la racine » est lourd et peu naturel en français contemporain.
    rationale: Le latin malignitas désigne la méchanceté, la perversité ou le mal. « Perversité de la racine » conserve la construction et l’ambiguïté de radicis sans imposer l’interprétation plus explicite « racine du mal » de l’audit anglais.
  revised_text: Ainsi, la faiblesse devint permanente, et la loi était dans le cœur du peuple avec la perversité de la racine ; ce qui était bon disparut, et ce qui était mauvais demeura.
