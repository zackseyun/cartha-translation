  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: fr
  text: Ainsi, la faiblesse devint permanente, et la loi était dans le cœur du peuple avec la perversité de la racine ; ce qui était bon disparut, et ce qui était mauvais demeura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: permanens infirmitas
  choice: la faiblesse devint permanente
  rationale: Rend directement l’idée d’une faiblesse désormais durable, dans un français naturel et digne.
- source_word: lex in corde populi
  choice: la loi était dans le cœur du peuple
  rationale: Conserve l’image biblique du cœur comme centre intérieur de la volonté et de la pensée.
- source_word: cum malignitate radicis
  choice: avec la malignité de la racine
  rationale: 'Préserve la construction latine et son ambiguïté : il peut s’agir du caractère mauvais de la racine plutôt que simplement d’une « racine mauvaise ».'
- source_word: discessit quod bonum est
  choice: ce qui était bon disparut
  rationale: Exprime clairement le départ ou l’éloignement du bien sans surinterprétation.
- source_word: et mansit
  choice: et ce qui était mauvais demeura
  rationale: Reprend l’opposition implicite indiquée par le contexte et attestée dans la couche de consultation anglaise, tout en gardant le parallélisme avec « ce qui était bon ».
theological_decisions:
- issue: Rapport entre la loi et la racine du mal dans le cœur humain
  choice: Maintenir les deux réalités côte à côte sans expliquer leur interaction
  alternative: Dire que la racine mauvaise dominait ou annulait la loi
  rationale: Le latin affirme leur coexistence, mais ne précise pas ici la nature exacte de leur rapport causal ou théologique.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le tour « malignité de la racine » est volontairement plus formel afin de conserver l’ambiguïté et la texture de la source latine.
