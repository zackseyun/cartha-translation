revisions:
- from: Ainsi, la faiblesse devint permanente, et la loi était dans le cœur du peuple avec la malignité de la racine ; ce qui était bon disparut, et ce qui était mauvais demeura.
  to: Ainsi, la faiblesse devint permanente, et la loi était dans le cœur du peuple avec la perversité de la racine ; ce qui était bon disparut, et ce qui était mauvais demeura.
  rationale: Révision limitée au terme « malignité », remplacé par « perversité » pour une équivalence sémantique plus idiomatique en français moderne. La formulation continue de préserver l’ambiguïté de l’expression latine malignitate radicis, plutôt que de la réduire à « la racine du mal ».
