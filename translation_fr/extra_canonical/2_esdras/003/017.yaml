translation:
  language: fr
  text: en très grand nombre. Et il arriva que, lorsque tu fis sortir la descendance[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la semence »; le mot peut désigner la postérité.'
    reason: Signaler la métaphore et l’ambiguïté lexicale du latin « semen » sans alourdir le texte principal.
lexical_decisions:
- source_word: in multitudine magna
  choice: en très grand nombre
  rationale: Cette expression idiomatique rend naturellement l’idée d’une multitude considérable tout en respectant le caractère fragmentaire du début du verset.
- source_word: educeres
  choice: tu fis sortir
  rationale: Le subjonctif imparfait latin dépend de « cum » et exprime ici l’action passée introduite par « lorsque »; « faire sortir » conserve le sens causatif du verbe.
- source_word: semen
  choice: la descendance
  rationale: Dans ce contexte narratif, « semen » désigne une postérité ou un peuple issu d’un ancêtre; « descendance » est plus clair en français moderne que le littéral « semence ».
theological_decisions:
- issue: Référent de « semen »
  choice: Conserver le référent implicite avec « la descendance »
  alternative: « sa descendance » ou « ton peuple »
  rationale: Le fragment latin fourni ne comporte aucun possessif et n’identifie pas explicitement le référent; la traduction évite donc de l’ajouter.
translation_notes:
  register: Français moderne, digne et lisible. Le texte demeure volontairement inachevé à la fin, conformément au segment latin fourni, sans importer les compléments attestés dans la suite du contexte mais absents de cet extrait.
