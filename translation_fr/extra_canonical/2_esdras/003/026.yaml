source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in omnibus facientes sicut fecit Adam et omnes generationes eius; utebantur enim et ipsi cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/026.yaml
  text: doing in all things as Adam and all his generations did[a]; for they too had an evil heart.
translation:
  language: fr
  text: agissant en tout comme Adam et toutes les générations issues de lui ; car eux aussi avaient un cœur mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in omnibus facientes
  choice: agissant en tout
  rationale: Rend directement la tournure participiale latine tout en conservant son lien avec le contexte précédent.
- source_word: omnes generationes eius
  choice: toutes les générations issues de lui
  rationale: Expression française naturelle qui conserve l’idée des générations rattachées à Adam sans la réduire explicitement à ses seuls descendants immédiats.
- source_word: utebantur ... cor malignum
  choice: avaient un cœur mauvais
  rationale: Dans ce latin tardif, « uti » avec cette construction exprime la possession ou l’état. « Avaient » évite l’idée trompeuse d’une utilisation délibérée du cœur comme d’un instrument.
theological_decisions:
- issue: Nature du « cœur mauvais »
  choice: un cœur mauvais
  alternative: le cœur mauvais
  rationale: L’article indéfini suit naturellement le latin sans transformer l’expression en terme technique explicite, tout en préservant l’affirmation selon laquelle cette disposition caractérisait également ces générations.
translation_notes:
  register: Français international moderne, sobre et digne. La forme participiale initiale est maintenue parce que le verset prolonge syntaxiquement la pensée précédente.
