  rationale: La révision supprime l'ajout interprétatif d'une manifestation actuelle (« toi qui te manifestes ») et rend le redoublement latin par une unique affirmation passée, dont l'insistance est expliquée en note. Elle maintient les compléments « parmi nous » et « à nos pères », ainsi que la progression narrative vers le désert non foulé et stérile.
