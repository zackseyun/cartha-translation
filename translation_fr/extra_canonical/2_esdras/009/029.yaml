review_pass:
  verdict: revise
  source_fidelity: Le texte principal interprète à tort « ostendens » comme une action présente indépendante (« toi qui te manifestes »). Dans « ostendens ostensus es », le redoublement est plus vraisemblablement une tournure emphatique; il ne faut donc pas introduire une manifestation présente distincte. « In nobis » se rend naturellement par « parmi nous », et « patribus nostris » par « à nos pères ».
  naturalness: La phrase révisée conserve un français biblique moderne et clair. « Que nul ne foule » exprime naturellement le présent générique/passif de « quod non calcatur » sans transformer ce trait en plus-que-parfait narratif.
  terminology: « Ô Seigneur », « nos pères », « désert » et « stérile » conviennent au registre scripturaire international moderne. « Se manifester » rend bien « ostendi » dans ce contexte.
  issues:
  - severity: medium
    issue: « toi qui te manifestes » introduit une proposition au présent non exigée par le latin.
    rationale: Le participe et le verbe fini de « ostendens ostensus es » constituent très probablement un redoublement emphatique, plutôt que l'opposition d'une manifestation actuelle et d'une manifestation passée.
  - severity: low
    issue: « où nul n’avait marché » déplace la valeur de « quod non calcatur ».
    rationale: Le latin emploie un présent passif/générique (« qui n'est pas foulé »); « que nul ne foule » le préserve plus directement.
  - severity: low
    issue: L'ancre de note est placée après « pères », alors que la note porte sur le redoublement verbal.
    rationale: L'ancre doit suivre immédiatement l'expression commentée afin de rendre son objet transparent.
