base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
translation:
  language: fr
  text: Ô Seigneur, tu t’es manifesté parmi nous à nos pères[a] dans le désert, lorsqu’ils sortaient d’Égypte et entraient dans ce désert que nul ne foule et qui est stérile,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin redouble le verbe « manifester » (« ostendens ostensus es »), probablement pour marquer l’insistance : « tu t’es bel et bien manifesté ».'
    reason: Conserver en note la valeur possiblement emphatique de la tournure sans créer dans le texte une proposition présente distincte.
lexical_decisions:
- source_word: in nobis
  choice: parmi nous
  rationale: Cette tournure rend naturellement la présence manifestée au sein du peuple, sans réduire le latin à une intériorité individuelle.
- source_word: ostendens ostensus es
  choice: toi qui te manifestes… tu t’es manifesté
  rationale: La reprise du même verbe conserve le redoublement marqué du latin tout en donnant une phrase française intelligible. Le passif latin est rendu par une forme pronominale naturelle en français.
- source_word: patribus nostris
  choice: à nos pères
  rationale: « Nos pères » est une désignation biblique traditionnelle et compréhensible des ancêtres d’Israël.
- source_word: deserto quod non calcatur
  choice: ce désert où nul n’avait marché
  rationale: Le latin décrit un lieu qui n’a pas été foulé; cette formulation française exprime clairement le caractère vierge et sans passage du désert.
- source_word: infructuoso (impliqué par la continuation après « et » et attesté dans la tradition textuelle consultée)
  choice: qui ne portait aucun fruit
  rationale: Cette expression restitue concrètement l’idée d’un désert improductif et correspond à la continuation reflétée dans la couche anglaise auditée.
theological_decisions:
- issue: Rapport entre la manifestation présente de Dieu et sa manifestation aux ancêtres
  choice: « toi qui te manifestes parmi nous, tu t’es manifesté à nos pères »
  alternative: « tu t’es manifesté parmi nous à nos pères »
  rationale: Le participe « ostendens » et le verbe fini « ostensus es » peuvent être compris comme deux propositions liées ou comme un redoublement emphatique. Le texte principal conserve les deux formes verbales et évite de les fondre en une seule relation ambiguë.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Ô Seigneur » et « nos pères » maintiennent le registre de prière biblique. La répétition de « tu te manifestes / tu t’es manifesté » est volontaire afin de refléter la forme marquée du latin.
