revisions:
- from: Ô Seigneur, toi qui te manifestes parmi nous, tu t’es manifesté à nos pères[a] dans le désert, lorsqu’ils sortaient d’Égypte et entraient dans ce désert où nul n’avait marché et qui ne portait aucun fruit,
