  text: And it happened, when he had grown up and I had come to take a wife for him, that I made a day of feasting.
translation:
  language: fr
  text: Et il arriva que, lorsqu’il eut grandi et que je vins lui chercher une épouse, j’organisai un jour de festin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum crevisset
  choice: lorsqu’il fut devenu grand
  rationale: Rend la croissance jusqu’à l’âge adulte sans préciser davantage un âge que le latin ne donne pas.
- source_word: venissem accipere illi uxorem
  choice: j’en vins à lui prendre une femme
  rationale: Conserve le mouvement idiomatique de « venissem » et l’idée ancienne de procurer une épouse au fils; « prendre une femme » reste compréhensible et proche du latin.
- source_word: feci diem epuli
  choice: j’organisai un jour de fête
  rationale: Expression française naturelle qui restitue littéralement l’idée d’une journée consacrée au banquet, sans ajouter explicitement qu’il s’agit des noces.
