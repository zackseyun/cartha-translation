  source_fidelity: 'Le sens général est bien rendu : le fils est parvenu à l’âge adulte, le narrateur lui procure une épouse et organise un festin. Toutefois, « j’en vins à lui prendre une femme » ne rend pas naturellement la valeur temporelle de venissem et sonne en français comme une tournure hésitante plutôt que comme l’action de venir chercher/prendre une épouse pour lui.'
