lexical_decisions:
- source_word: septem
  choice: Au bout de sept jours
  rationale: 'Le latin transmis est elliptique, mais le contexte et la consultation anglaise indiquent une valeur temporelle : « après sept jours ».'
- source_word: discumbebam
  choice: j’étais étendu
  rationale: Rend l’imparfait et la posture allongée exprimée par le verbe, dans un français naturel.
- source_word: supra fenum
  choice: sur l’herbe
  rationale: Dans ce contexte, « fenum » désigne le sol herbeux plutôt que du foin récolté.
- source_word: cor meum iterum
  choice: mon cœur de nouveau
  rationale: Traduction formellement proche qui ne fournit pas de prédicat absent du fragment latin.
theological_decisions:
- issue: Prédicat manquant après « mon cœur de nouveau »
  choice: Conserver la phrase inachevée et la signaler par des points de suspension avec note
  alternative: Ajouter « fut troublé comme auparavant » d’après le contexte ou une reconstruction
  rationale: Le texte latin fourni s’interrompt après « iterum » et ne contient ni « fut troublé » ni « comme auparavant » ; les ajouter résoudrait sans preuve une lacune textuelle.
translation_notes:
  register: Français moderne, simple et digne. L’ordre a été légèrement naturalisé, tandis que l’inachèvement réel du témoin latin a été préservé.
