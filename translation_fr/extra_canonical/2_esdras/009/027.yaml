  text: Au bout de sept jours, j’étais étendu sur l’herbe, et mon cœur de nouveau…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin conservé s’interrompt ici au milieu de la phrase.
