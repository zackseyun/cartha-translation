source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populorum turbatio, gentium cogitationes, ducum inconstantia, principum turbatio, Tunc intelleges quoniam de his erat altis-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/003.yaml
  text: and confusion among peoples, thoughts among nations, instability among leaders, turmoil among rulers. Then you will understand that it was about these things that the Most High
translation:
  language: fr
  text: le trouble parmi les peuples, les pensées des nations, l’inconstance des chefs, le trouble parmi les dirigeants. Alors tu comprendras que c’était de ces choses que parlait le Très-Haut…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populorum turbatio
  choice: le trouble parmi les peuples
  rationale: Rend turbatio par « trouble » et le génitif populorum par une relation naturelle en français, sans préciser indûment la nature du désordre.
- source_word: gentium cogitationes
  choice: les pensées des nations
  rationale: Traduction littérale qui conserve l’ambiguïté de cogitationes, sans lui attribuer le sens plus restrictif de « complots » ou de « manœuvres ».
- source_word: ducum inconstantia
  choice: l’inconstance des chefs
  rationale: « Chefs » rend largement ducum, tandis qu’« inconstance » préserve l’idée d’instabilité ou de manque de fermeté.
- source_word: principum turbatio
  choice: le trouble parmi les dirigeants
  rationale: Distingue principes de duces en choisissant « dirigeants » et conserve turbatio sans imposer soit un trouble intérieur, soit des troubles politiques.
- source_word: Tunc intelleges
  choice: Alors tu comprendras
  rationale: Rend directement l’adverbe temporel et la deuxième personne du singulier du futur latin.
- source_word: de his erat altis-
  choice: que c’était de ces choses que parlait le Très-Haut…
  rationale: Le texte fourni est matériellement tronqué à altis-. La formulation suit la compréhension contextuelle attestée par la couche anglaise, tout en signalant l’inachèvement de l’extrait par des points de suspension.
theological_decisions:
- issue: Identification de altis- avec le titre divin Altissimus
  choice: le Très-Haut
  alternative: le très haut / les choses élevées
  rationale: Le contexte et la tradition textuelle soutiennent le titre divin « le Très-Haut », mais l’extrait latin s’interrompt au milieu du mot; la traduction ne complète donc pas au-delà de la proposition commencée.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « trouble » est maintenue afin de refléter la répétition de turbatio dans le latin. Les points de suspension indiquent que la source citée s’interrompt en milieu de phrase.
