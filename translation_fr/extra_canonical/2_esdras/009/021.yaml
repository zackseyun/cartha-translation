    issue: « un plant » est une précision lexicale trop étroite pour plantationem.
    rationale: Le terme latin peut désigner ce qui est planté ou une plantation; dans l’image d’un élément unique préservé, « une pousse » est plus souple et naturel que « un plant », sans suggérer une plantation commerciale.
  - severity: low
    issue: « J’ai regardé » est moins immédiat que le parfait narratif de videre.
    rationale: « J’ai vu » correspond directement au verbe source et s’accorde avec le ton solennel du passage.
