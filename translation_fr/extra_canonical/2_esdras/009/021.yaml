  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
translation:
  language: fr
  text: J’ai vu et je les ai épargnés à grand-peine ; je me suis réservé un grain de raisin de la grappe et une pousse d’une grande forêt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin transmis porte littéralement « d’une grande tribu ». « D’une grande forêt » suit une lecture ancienne attestée par plusieurs autres versions et correspond au parallélisme avec la grappe.
    reason: Signaler avec transparence la lecture textuelle retenue sans masquer la leçon conservée dans le latin.
lexical_decisions:
- source_word: saluaui mihi
  choice: je me suis réservé
  rationale: Rend l’idée de sauver ou préserver quelque chose pour soi, dans un français naturel.
- source_word: acinum de botru
  choice: un grain de raisin de la grappe
  rationale: Conserve l’image concrète d’un seul raisin préservé au sein d’une grappe.
- source_word: plantationem
  choice: un plant
  rationale: Désigne ici un végétal individuel conservé, en parallèle avec l’unique grain de raisin.
- source_word: de tribu multa
  choice: d’une vaste forêt
  rationale: Suit la lecture reflétée par les anciennes versions orientales et le parallélisme végétal, qui indiquent une corruption ancienne de « forêt » en « tribu » dans la transmission grecque à l’origine du latin.
theological_decisions:
- issue: Référent du pronom implicite dans l’action d’épargner
  choice: je les ai épargnés
  alternative: j’ai épargné cela
  rationale: Le contexte repris par la couche de consultation comprend un référent pluriel humain. La traduction conserve ce pluriel sans préciser davantage son identité.
- issue: Portée de valde
  choice: à grand-peine
  alternative: grandement
  rationale: La tradition textuelle et la couche anglaise comprennent l’expression comme soulignant la difficulté avec laquelle quelques-uns sont épargnés, plutôt que le degré de compassion.
translation_notes:
  register: Français moderne, clair et digne. Le point-virgule conserve le lien étroit entre l’action d’épargner et les deux images parallèles de ce qui est préservé.
