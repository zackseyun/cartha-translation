source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit, omnis qui salvus factus fuerit et qui poterit effugere per opera sua vel per fidem in qua credidit, is
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/007.yaml
  text: And it shall be that everyone who is saved[a], and who is able to escape by his works or by the faith in which he believed,
translation:
  language: fr
  text: Et il arrivera que quiconque aura été sauvé[a] et pourra échapper par ses œuvres ou par la foi en laquelle il a cru, celui-là
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et quiconque aura été sauvé, »'
    reason: Signale l’autre découpage traditionnel, qui atténue la valeur introductive de « et erit », tout en gardant la possibilité attestée par la consultation anglaise.
lexical_decisions:
- source_word: et erit
  choice: Et il arrivera que
  rationale: Conserve explicitement la formule prospective et solennelle du latin, caractéristique du registre apocalyptique.
- source_word: omnis qui salvus factus fuerit
  choice: quiconque aura été sauvé
  rationale: Le futur antérieur rend l’accomplissement futur exprimé par le subjonctif parfait dans cette proposition prospective.
- source_word: poterit effugere
  choice: aura pu échapper
  rationale: Exprime la capacité effective d’échapper dans le cadre futur posé par « et erit ».
- source_word: per opera sua
  choice: par ses œuvres
  rationale: Rend directement opera par le terme biblique usuel « œuvres », sans préciser leur nature.
- source_word: per fidem in qua credidit
  choice: par la foi en laquelle il aura cru
  rationale: Préserve la formulation inhabituelle et la relation interne entre fides et credere, sans réduire « foi » à une simple fidélité.
- source_word: is
  choice: celui-là
  rationale: Maintient le démonstratif final, même si la phrase demeure suspendue et se poursuit vraisemblablement au verset suivant.
theological_decisions:
- issue: Rapport entre les œuvres et la foi comme moyens d’échapper
  choice: « par ses œuvres ou par la foi »
  alternative: Reformuler pour harmoniser les œuvres et la foi ou subordonner l’une à l’autre
  rationale: Le latin présente explicitement l’alternative vel; la traduction conserve cette tension théologique sans l’expliquer ni la résoudre.
- issue: Voix de l’expression du salut
  choice: « aura été sauvé »
  alternative: « se sera sauvé » ou « aura trouvé le salut »
  rationale: La forme passive salvus factus fuerit est conservée afin de ne pas attribuer explicitement l’action salvatrice au sujet humain.
translation_notes:
  register: Français moderne, digne et légèrement solennel. La syntaxe conserve volontairement la proposition inachevée et le démonstratif final « celui-là », puisque l’extrait latin se poursuit au-delà de ce verset. Le marqueur [a] figure dans le texte principal.
