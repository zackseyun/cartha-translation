base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: fr
  text: Car nos pères, après avoir reçu la Loi, ne l’ont pas gardée et n’ont pas observé mes prescriptions. Et le fruit de la Loi n’a pas péri, car il ne le pouvait pas, puisqu’il était à toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patres nostri
  choice: nos pères
  rationale: Conserve l’image généalogique du latin et le registre biblique, tout en restant immédiatement compréhensible.
- source_word: legem
  choice: la Loi
  rationale: La majuscule indique qu’il s’agit de la Loi reçue par les ancêtres, et non d’une loi quelconque.
- source_word: legitima mea
  choice: mes prescriptions
  rationale: « Prescriptions » rend les exigences établies par Dieu sans réduire le terme à de simples lois civiles; le possessif « mes » est expressément conservé.
- source_word: fructum legis
  choice: le fruit de la Loi
  rationale: Reproduit la métaphore du texte source sans en préciser artificiellement le référent.
- source_word: non periens
  choice: n’a pas péri
  rationale: Formulation française naturelle qui conserve l’idée de non-disparition ou de non-destruction.
theological_decisions:
- issue: Alternance des pronoms possessifs dans « mes prescriptions » puis « à toi »
  choice: Conserver telle quelle l’alternance entre la première et la deuxième personne
  alternative: Harmoniser les pronoms en fonction d’un locuteur supposé ou reformuler pour éviter l’alternance
  rationale: Le latin porte explicitement « mea » puis « tuus »; la traduction préserve cette tension textuelle sans imposer une identification du locuteur ni une solution interprétative.
- issue: Sens du « fruit de la Loi »
  choice: Maintenir la métaphore sans explication dans le corps du verset
  alternative: Préciser qu’il s’agit de l’effet, de l’accomplissement ou de la récompense de la Loi
  rationale: Le texte latin ne détermine pas explicitement lequel de ces sens est visé; une explicitation résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Pourtant » marque le contraste initial; « Mais » rend naturellement la nouvelle proposition. La répétition de « la Loi » et l’étrange alternance pronominale sont conservées en raison de leur portée textuelle.
