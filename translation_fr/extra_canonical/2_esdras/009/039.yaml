  text: Then I let go of the thoughts in which I had been thinking, and I turned to her and said,
translation:
  language: fr
  text: 'Alors, j’abandonnai les pensées dans lesquelles j’étais plongé, puis je me tournai vers elle et lui dis :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimisi cogitatus
  choice: j’abandonnai les pensées
  rationale: « Abandonner » rend naturellement l’idée de laisser de côté ou relâcher les pensées, sans ajouter qu’elles auraient été résolues.
- source_word: in quibus eram cogitans
  choice: dans lesquelles j’étais plongé
  rationale: Cette tournure française exprime l’absorption dans les pensées et évite la répétition peu naturelle « les pensées auxquelles je pensais », tout en conservant le lien étroit avec cogitatus.
- source_word: conversus sum ad eam
  choice: je me tournai vers elle
  rationale: Rendu direct du mouvement exprimé par conversus sum ad, dans un registre narratif digne et courant.
- source_word: dixi ei
  choice: lui dis
  rationale: Formulation française concise et idiomatique, introduisant la parole qui suit.
