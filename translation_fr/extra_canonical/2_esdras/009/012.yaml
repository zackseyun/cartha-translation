source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
translation:
  language: fr
  text: Alors qu’une possibilité de se repentir leur était encore offerte, ils n’ont pas compris, mais ils l’ont méprisée ; ceux-là devront comprendre[a] après la mort, dans le tourment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin ne précise pas ce que ceux-là devront comprendre ou reconnaître.
    reason: Préserver l’ambiguïté de cognoscere, employé sans objet explicite.
lexical_decisions:
- source_word: paenitentiae locus
  choice: une possibilité de se repentir
  rationale: Littéralement « un lieu de repentance » ; dans ce contexte, locus désigne naturellement une possibilité ou une occasion encore ouverte.
- source_word: spreverunt
  choice: ils l’ont méprisée
  rationale: Le verbe exprime un rejet empreint de mépris ; le pronom reprend naturellement la possibilité de se repentir.
- source_word: hos oportet ... cognoscere
  choice: ceux-là devront comprendre
  rationale: L’accusatif hos est le sujet logique de l’infinitif cognoscere. « Devront comprendre » rend l’idée de connaissance acquise nécessairement, sans ajouter un complément absent du latin.
- source_word: in cruciamento
  choice: dans le tourment
  rationale: Le singulier latin est conservé ; « tourment » convient au registre judiciaire et eschatologique du passage.
theological_decisions:
- issue: Objet implicite de cognoscere
  choice: Ne pas expliciter l’objet dans le texte principal
  alternative: « devront le comprendre » ou « devront le reconnaître »
  rationale: Le latin ne précise pas ce qu’ils devront connaître ou comprendre. L’absence de complément préserve cette ambiguïté et évite d’imposer une interprétation théologique.
translation_notes:
  register: 'Français moderne, digne et accessible. La formulation privilégie une équivalence optimale : elle explicite la valeur idiomatique de paenitentiae locus tout en maintenant l’indétermination du dernier verbe.'
