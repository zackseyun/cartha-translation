id: 2ES.9.9
reference: 2 Esdras 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc mirabuntur qui nunc abusi sunt vias meas, et in cruciamentis commorabuntur hii qui eos proiecerunt in contemptu.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: fr
  text: Alors, ceux qui maintenant ont abusé de mes voies seront frappés de stupeur, et ceux qui les ont rejetées avec mépris demeureront dans les tourments.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mirabuntur
  choice: seront frappés de stupeur
  rationale: Dans ce contexte de jugement, le futur latin exprime davantage la stupeur ou l'effroi que la simple admiration.
- source_word: abusi sunt vias meas
  choice: ont abusé de mes voies
  rationale: Rend directement la formulation latine inhabituelle sans préciser à tort s'il s'agit de transgression, de détournement ou de mauvais usage.
- source_word: proiecerunt in contemptu
  choice: ont rejetées avec mépris
  rationale: Exprime à la fois l'action de mettre de côté ou de rejeter et l'attitude méprisante indiquée par in contemptu.
- source_word: in cruciamentis commorabuntur
  choice: demeureront dans les tourments
  rationale: Conserve l'idée de séjour prolongé portée par commorabuntur et le pluriel concret cruciamentis.
theological_decisions:
- issue: Référent du pronom eos
  choice: les, renvoyant aux « voies »
  alternative: les, avec un référent personnel implicite
  rationale: Bien que le latin eos soit masculin et vias féminin, le sens immédiat et la version de consultation comprennent le pronom comme visant les voies. La traduction française emploie donc le féminin pour rendre clairement cette lecture, sans ajouter de référent absent.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle du latin est conservée, ainsi que le vocabulaire judiciaire fort du passage.
source_grounding:
  english_pob_role: consult_only
