source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: fr
  text: Toi donc, ne cherche plus à savoir comment les impies seront tourmentés, mais cherche comment les justes seront sauvés, à qui appartient l’ère, pour qui elle est, et quand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de la phrase est elliptique en latin : « à qui appartient l’ère, à cause de qui l’ère, et quand ». « Ère » traduit saeculum, qui peut aussi désigner un âge ou un monde/ordre; le texte ne précise pas explicitement qu’il s’agit du monde à venir ni ce que modifie exactement « quand ».'
    reason: Préserve l’ambiguïté de saeculum et de la construction finale, sans ajouter l’idée d’une venue.
lexical_decisions:
- source_word: noli curiosus esse
  choice: ne cherche plus à savoir
  rationale: Rend naturellement l’interdiction de se préoccuper avec curiosité d’une question, sans donner à « curieux » un sens moderne trop léger.
- source_word: impii
  choice: les impies
  rationale: Terme biblique courant qui désigne ceux qui vivent sans égard pour Dieu.
- source_word: iusti
  choice: les justes
  rationale: Équivalent théologique direct et naturel du latin.
- source_word: saeculum
  choice: le monde à venir
  rationale: Dans ce contexte eschatologique, « saeculum » désigne vraisemblablement l’ère ou le monde futur plutôt qu’un simple siècle.
theological_decisions:
- issue: Sens et référent de la triple formule « quorum saeculum et propter quos saeculum et quando »
  choice: à qui appartient le monde à venir, pour qui il existe et quand il viendra
  alternative: à qui appartient l’ère, à cause de qui elle existe et quand
  rationale: La formulation retenue exprime en français intelligible la portée eschatologique probable tout en signalant par une note l’obscurité et la littéralité possibles de la construction latine.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « cherche… à savoir » conserve l’opposition entre la curiosité au sujet du châtiment et la recherche portant sur le salut.
