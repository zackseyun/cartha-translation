  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female servant, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
translation:
  language: fr
  text: Après trente ans, Dieu m’a exaucée, moi, ton esclave[a]. Il a vu mon humiliation, il a prêté attention à ma détresse et il m’a donné un fils. Je me suis beaucoup réjouie à son sujet, de même que mon mari et tous mes concitoyens, et nous avons beaucoup honoré le Puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin peut aussi se lire littéralement : « le Dieu de ton esclave m’a exaucée » ; la formulation retenue reflète probablement la syntaxe grecque sous-jacente.'
    reason: Signaler l’ambiguïté grammaticale réelle du latin tout en préservant la lecture appositionnelle probablement voulue.
lexical_decisions:
- source_word: exaudivit
  choice: m’a exaucée
  rationale: Exprime non seulement le fait d’entendre, mais l’accueil favorable d’une supplication; l’accord au féminin découle de l’identité de la locutrice.
- source_word: ancillae tuae
  choice: moi, ta servante
  rationale: Traite le génitif latin comme une apposition issue du grec sous-jacent, conformément au caractère traductionnel du latin, plutôt que comme «le Dieu de ta servante». «Servante» reste digne et naturel en français, tout en conservant la relation de dépendance.
- source_word: humilitatem
  choice: mon humiliation
  rationale: Conserve le sens concret d’abaissement et la tension du terme latin sans le réduire arbitrairement à l’humilité morale.
- source_word: adtendit tribulationi meae
  choice: il a prêté attention à ma détresse
  rationale: Rend fidèlement l’attention portée à l’épreuve vécue, dans un français naturel.
- source_word: iucundata sum super eum valde
  choice: J’ai éprouvé pour lui une très grande joie
  rationale: Restitue l’intensité et l’objet de la joie sans calquer maladroitement la préposition latine super.
- source_word: cives mei
  choice: mes concitoyens
  rationale: Correspond directement aux membres de la même cité et convient au registre narratif.
- source_word: Fortem
  choice: le Puissant
  rationale: Conserve comme titre divin substantivé le latin Fortem, avec la majuscule signalant son emploi référentiel.
theological_decisions:
- issue: Construction de «Deus ancillae tuae»
  choice: «Dieu m’a exaucée, moi, ta servante»
  alternative: «le Dieu de ta servante m’a exaucée»
  rationale: La syntaxe irrégulière s’explique vraisemblablement par un génitif grec appositionnel conservé après que le pronom a été rendu à l’accusatif en latin. Le contexte et l’histoire textuelle favorisent donc l’apposition, sans transformer «Dieu» en un syntagme possessif.
- issue: Titre divin «Fortem»
  choice: «le Puissant»
  alternative: «le Fort»
  rationale: «Le Puissant» est idiomatique, solennel et fidèle à la valeur du titre, sans lui ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. La parataxe du latin est légèrement lissée sans supprimer sa progression. Le féminin de «exaucée» et l’apposition «moi, ta servante» clarifient naturellement la voix de la locutrice.
