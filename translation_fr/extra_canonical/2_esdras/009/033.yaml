  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
translation:
  language: fr
  text: 'Car ceux qui l’ont reçue ont péri, parce qu’ils n’ont pas gardé ce qui avait été semé en eux. Et voici : il est habituel que, lorsque la terre a reçu de la semence,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: acceperunt
  choice: l’avaient reçue
  rationale: Le pronom féminin renvoie naturellement à la loi évoquée dans le contexte précédent; le plus-que-parfait marque l’antériorité par rapport à leur disparition.
- source_word: perierunt
  choice: ont péri
  rationale: Rend directement le latin sans préciser indûment la nature de la perte.
- source_word: custodientes
  choice: gardé
  rationale: « Garder » conserve l’idée de préserver et d’observer ce qui a été confié.
- source_word: seminatum fuerat
  choice: avait été semé
  rationale: Le plus-que-parfait passif reproduit la relation temporelle et l’image agricole du latin.
- source_word: consuetudo est
  choice: voici ce qui se passe habituellement
  rationale: Formulation française naturelle qui exprime l’usage ou le cours habituel des choses sans suggérer une coutume humaine instituée.
- source_word: terra semen
  choice: la terre a reçu la semence
  rationale: Conserve l’image et la répétition de « recevoir » tout en employant le terme agricole naturel « semence ».
theological_decisions:
- issue: Lien logique avec le verset précédent
  choice: Car
  alternative: Mais
  rationale: 'Le contexte latin transmis donne « Nam qui » : la disparition des bénéficiaires explique pourquoi le fruit de la loi, lui, n’a pas péri.'
- issue: Référent implicite de ce qui a été reçu
  choice: l’avaient reçue
  alternative: avaient reçu cela
  rationale: Le féminin explicite en français le renvoi contextuel probable à la loi, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément au fragment latin, qui se poursuit au verset suivant.
