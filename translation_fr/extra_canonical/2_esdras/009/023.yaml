lexical_decisions:
- source_word: ieiunabis
  choice: tu ne jeûneras pas
  rationale: Le futur latin est rendu directement; dans ce contexte prescriptif, il exprime l’instruction de ne pas jeûner.
- source_word: in eis
  choice: pendant ces jours
  rationale: Le pronom latin renvoie aux jours mentionnés dans le contexte antérieur; une formulation temporelle explicite est plus naturelle en français.
- source_word: Ibis autem
  choice: Tu iras plutôt
  rationale: '« autem » marque ici le contraste avec l’interdiction précédente: au lieu de jeûner, Esdras doit aller au lieu indiqué.'
- source_word: in campum florum
  choice: dans un champ de fleurs
  rationale: Rendu concret et fidèle du latin, sans préciser artificiellement s’il s’agit d’un champ cultivé ou d’une prairie fleurie.
