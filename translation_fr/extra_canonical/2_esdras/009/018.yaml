  source_fidelity: 'La structure essentielle est conservée : « et tunc », la double référence « eis, his qui nunc », l’antériorité de la création et l’absence d’opposition. Toutefois, « saeculum » est rendu par « monde », choix interprétatif qui réduit la valeur première d’« âge/époque » attestée par le latin et retenue dans la piste d’audit anglaise.'
