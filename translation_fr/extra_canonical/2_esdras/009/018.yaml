  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
translation:
  language: fr
  text: Et alors, lorsque je faisais des préparatifs pour eux — pour ceux qui existent maintenant —, avant que ne soit créé pour eux l’âge où ils habiteraient, personne ne s’est opposé à moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et tunc
  choice: Et alors
  rationale: Rend explicitement les deux éléments de la locution latine, en conservant son lien avec le contexte précédent.
- source_word: cum essem parans eis
  choice: quand je préparais pour eux
  rationale: Conserve l’aspect duratif de la périphrase latine et le complément « pour eux ».
- source_word: his qui nunc
  choice: pour ceux qui existent maintenant
  rationale: Explicite naturellement en français le participe sous-entendu après « qui nunc », sans identifier autrement ce groupe.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte, « saeculum » désigne l’ordre créé destiné à être habité; « monde » est plus naturel que « âge » en français tout en laissant au contexte sa portée cosmologique.
- source_word: inhabitarent
  choice: ils habiteraient
  rationale: Le conditionnel français rend le futur dans le passé exprimé par le subjonctif imparfait latin en proposition relative.
- source_word: nemo contradixit mihi
  choice: personne ne s’est opposé à moi
  rationale: Rend le sens de « contradicere » comme opposition ou contestation, plutôt que comme simple contradiction verbale.
theological_decisions:
- issue: Nature de « saeculum »
  choice: le monde
  alternative: l’âge
  rationale: Le contexte parle d’un domaine créé pour y habiter; « monde » communique ce sens naturellement, sans imposer une conception théologique particulière des âges.
- issue: Absence de toute opposition lors de la création
  choice: personne ne s’est opposé à moi
  alternative: personne ne m’a contredit
  rationale: La formulation conserve l’affirmation absolue du latin sans ajouter l’explication « car personne n’existait », absente du texte source fourni.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets signalent l’apposition « pour ceux qui existent maintenant » tout en préservant la reprise inhabituelle du latin entre « eis » et « his qui nunc ».
