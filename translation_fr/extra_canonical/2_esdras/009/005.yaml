  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
translation:
  language: fr
  text: Car, de même que tout ce qui est venu à l’existence au cours de l’âge a un commencement à travers un achèvement[a], et que l’achèvement est manifeste,
  philosophy: optimal-equivalence
  footnotes:
