lexical_decisions:
- source_word: omne quod factum est
  choice: tout ce qui est venu à l’existence
  rationale: Rend naturellement le passif factum est tout en conservant l’idée de ce qui a été produit ou est advenu.
- source_word: in saeculo
  choice: au cours de l’âge
  rationale: Conserve la valeur temporelle de saeculum plutôt que de la réduire à « monde ».
- source_word: initium per consummationem
  choice: un commencement à travers un achèvement
  rationale: Suit le latin transmis, malgré sa formulation difficile, sans corriger silencieusement le texte.
- source_word: consummatio manifesta
  choice: l’achèvement est manifeste
  rationale: Maintient le parallélisme lexical avec consummationem et rend manifesta dans un registre digne et direct.
theological_decisions:
- issue: Sens de initium per consummationem
  choice: Préserver la formulation difficile « un commencement à travers un achèvement » dans le texte
  alternative: Adopter la correction critique initium patet et traduire « un commencement évident et une fin manifeste »
  rationale: Le latin fourni porte per consummationem. Comme cette leçon est probablement corrompue mais demeure la source demandée, le texte principal la conserve et la note signale l’autre lecture sans trancher silencieusement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Âge » garde la nuance temporelle de saeculum; la répétition d’« achèvement » reproduit celle du latin.
