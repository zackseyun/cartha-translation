lexical_decisions:
- source_word: multiplicat
  choice: se multiplient
  rationale: Rend le sens fondamental de « multiplier », tout en employant une tournure française naturelle adaptée à l’image des vagues.
- source_word: fluctus
  choice: les vagues
  rationale: La forme latine peut être comprise comme un singulier ou un pluriel; le pluriel s’accorde naturellement avec l’idée de multiplication, sans supprimer l’autre analyse signalée en note.
- source_word: super guttam
  choice: bien au-delà d’une goutte
  rationale: « Au-delà de » conserve la valeur comparative de « super »; « bien » explicite sobrement l’écart impliqué par l’image.
- source_word: et respondit ad me et dixit
  choice: Alors il me répondit
  rationale: Formulation française actuelle et concise qui conserve le verbe de réponse et introduit directement les paroles à venir; le doublet sémitisant « répondit et dit » serait lourd en français.
