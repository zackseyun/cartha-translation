review_pass:
  verdict: revise
  source_fidelity: La structure du latin est globalement bien suivie, notamment l’ablatif absolu initial et la clausule inachevée « et voici ». Toutefois, « insondable » ne rend pas naturellement *inuestigabili*, qui signifie littéralement « qu’on peut examiner / scruter »; le choix anglais « unsearchable » ne doit pas primer sur la forme latine fournie. La voix passive de *corrupti sunt* mérite aussi d’être conservée.
  naturalness: La phrase révisée reste idiomatique en français international moderne tout en gardant une sobriété scripturaire. « Loi que l’on peut scruter » est clair sans surinterpréter le terme latin. « Ont été corrompus dans leurs mœurs » est un peu plus formel, mais respecte utilement la passivité et le registre du passage.
  terminology: « Table inépuisable » conserve l’image de *mensa indeficienti*. « Loi que l’on peut scruter » rend *lege inuestigabili* sans importer l’idée contraire d’une loi impénétrable. « Époque » est un rendu recevable de *saeculum meum* dans ce contexte.
  issues:
  - severity: medium
    issue: « une loi insondable » inverse ou obscurcit le sens lexical de *lege inuestigabili*.
    rationale: Le latin *inuestigabilis* est formé sur *inuestigare* (« rechercher, examiner ») et désigne ce qui peut être investigué ou scruté; il ne faut pas suivre sans contrôle le « unsearchable » de la couche anglaise.
  - severity: low
    issue: « ils se sont corrompus » ne conserve pas pleinement la voix passive de *corrupti sunt*.
    rationale: Le latin dit qu’« ils ont été corrompus », avec *moribus eorum* rattaché à leurs mœurs. Une formulation passive française préserve mieux l’ambiguïté quant à l’agent de cette corruption.
