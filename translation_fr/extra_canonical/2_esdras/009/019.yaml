  rationale: La révision corrige surtout le sens de *inuestigabili*, sans résoudre au-delà du texte la difficulté de l’expression entière. Elle conserve l’image de la table, le caractère passif de *corrupti sunt*, le référent temporel de *saeculum meum* et l’attente laissée par *et ecce*.
