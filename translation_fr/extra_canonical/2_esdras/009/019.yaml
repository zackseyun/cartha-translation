  text: hoc parato et mensa indeficienti et lege inuestigabili, corrupti sunt moribus eorum. Et consideraui saeculum meum et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
translation:
  language: fr
  text: 'Cela ayant été préparé, avec une table inépuisable et une loi que l’on peut scruter[a], ils ont été corrompus dans leurs mœurs. J’ai considéré mon époque, et voici :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression latine « une table inépuisable et une loi que l’on peut scruter » est difficile. Elle semble évoquer des ressources et une instruction déjà offertes aux humains, alors même qu’ils ont été corrompus dans leurs mœurs.
    reason: textual_variant
lexical_decisions:
- source_word: hoc parato
  choice: Tout cela ayant été préparé
  rationale: Rend l’ablatif absolu sans ajouter explicitement « monde » ni « créés », termes absents de ce segment latin, tout en maintenant le lien contextuel avec ce qui précède.
- source_word: mensa indeficienti
  choice: une table inépuisable
  rationale: « Table » conserve l’image concrète de mensa, tandis qu’« inépuisable » exprime une provision qui ne vient pas à manquer.
- source_word: lege inuestigabili
  choice: une loi insondable
  rationale: Suit le sens reçu dans la couche anglaise auditée et exprime une loi dont on ne peut épuiser la profondeur; la difficulté du latin est signalée en note.
- source_word: corrupti sunt moribus eorum
  choice: ils se sont corrompus dans leur conduite
  rationale: Formulation française naturelle qui conserve l’idée de corruption manifestée dans les mœurs ou la manière de vivre.
- source_word: saeculum meum
  choice: mon époque
  rationale: Dans ce contexte, saeculum désigne l’âge ou l’époque du locuteur plutôt que le monde matériel.
- source_word: et ecce
  choice: 'et voici :'
  rationale: Conserve l’introduction déictique et la phrase suspendue qui appelle la suite du texte.
theological_decisions:
- issue: Rapport entre la provision, la loi et la corruption humaine
  choice: 'Maintenir la juxtaposition : tout était préparé et donné, pourtant les humains se sont corrompus.'
  alternative: Expliquer que la provision divine rend les humains coupables ou que la loi a causé leur corruption.
  rationale: Le latin affirme la provision et la corruption sans expliciter leur rapport causal; la traduction ne tranche donc pas cette tension théologique.
- issue: Sujet implicite de corrupti sunt
  choice: Employer le pronom général « ils » sans préciser davantage son référent.
  alternative: Ajouter « ceux qui avaient été créés dans ce monde » comme dans la couche anglaise.
  rationale: Le sujet se déduit du contexte, mais ces précisions ne figurent pas explicitement dans le segment latin fourni.
translation_notes:
  register: Français international moderne, digne et accessible. La structure légèrement solennelle de la première proposition respecte le caractère ancien du texte; les deux-points finaux préservent l’attente créée par « et voici ».
