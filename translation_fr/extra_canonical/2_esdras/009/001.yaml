    issue: Omission de « et erit »
    rationale: Le brouillon passe directement à « Quand tu verras », mais le latin porte explicitement « et erit ». La révision le restitue par « Et il arrivera que » sans ajouter de contenu interprétatif.
  - severity: low
    issue: Verbe « Évalue » sans objet explicite
    rationale: Le latin est lui-même elliptique, mais « évaluer » est moins apte que « mesurer » à porter cette ellipse en français et peut suggérer un jugement de valeur. « Mesure avec soin » garde l’image et l’ambiguïté de « metiens metire ».
