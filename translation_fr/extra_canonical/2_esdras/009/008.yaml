source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquetur de praedictis periculis et videbit salutare meum in terra mea et in finibus meis, quae sanctificavi mihi a saeculo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/008.yaml
  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
translation:
  language: fr
  text: Il sera épargné des dangers annoncés[a] et verra mon salut dans ma terre et à l’intérieur de mes frontières — terre et frontières que j’ai sanctifiées pour moi depuis les temps anciens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « restera après les dangers annoncés ».'
    reason: Cette variante rend plus littéralement le passif latin relinquetur, qui peut évoquer le fait de rester ou d’être laissé subsister après les périls.
lexical_decisions:
- source_word: relinquetur
  choice: sera épargné
  rationale: Le passif latin signifie littéralement « sera laissé » ou « restera »; dans le contexte des périls, « sera épargné » exprime naturellement l’idée de subsister après eux sans imposer le verbe plus interprétatif « survivre ».
- source_word: praedictis periculis
  choice: des dangers annoncés
  rationale: Rend directement le sens de périls déclarés ou prédits à l’avance, dans un français courant et digne.
- source_word: salutare meum
  choice: mon salut
  rationale: Conserve le substantif théologique latin et son ambiguïté possible entre l’acte salvateur de Dieu et le salut qu’il manifeste.
- source_word: in terra mea et in finibus meis
  choice: sur ma terre et à l’intérieur de mes frontières
  rationale: Distingue les deux constructions spatiales tout en gardant le parallélisme entre le territoire et ses limites.
- source_word: a saeculo
  choice: depuis toujours
  rationale: Expression française naturelle pour une sanctification remontant aux temps anciens, sans préciser artificiellement un point de départ.
theological_decisions:
- issue: Référent de « quae sanctificavi »
  choice: que j’ai sanctifiées
  alternative: que je me suis consacrées
  rationale: Le relatif latin peut reprendre l’ensemble territorial précédemment nommé, tandis que le français accorde ici avec « frontières », antécédent grammatical le plus proche. « Sanctifier » préserve la portée sacrée du verbe sans réduire celle-ci à une simple appropriation.
- issue: Nature du « salut » divin
  choice: mon salut
  alternative: la délivrance que j’accorde
  rationale: La formulation nominale maintient la tension entre salut, délivrance et manifestation salvatrice, au lieu de trancher par une paraphrase.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe demeure proche du latin, mais « sera épargné » évite un calque peu idiomatique. Le verset étant transmis comme la suite d’une proposition précédente, le sujet reste implicite dans la forme verbale.
