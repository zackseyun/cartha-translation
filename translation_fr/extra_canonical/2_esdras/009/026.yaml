  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
translation:
  language: fr
  text: Je me rendis donc, comme il me l’avait ordonné, dans le champ appelé Ardat, et je m’assis là au milieu des fleurs. Je mangeai des plantes du champ, et la nourriture qu’elles procurèrent me rassasia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur nourriture devint pour rassasiement », c’est-à-dire qu’elle devint suffisante pour me rassasier.'
    reason: Signale la tournure inhabituelle du latin tout en la formulant dans un français moderne intelligible.
lexical_decisions:
- source_word: Ardat
  choice: Ardat
  rationale: Conservation du nom propre transmis par le texte latin, sans francisation conjecturale.
- source_word: in floribus
  choice: au milieu des fleurs
  rationale: Rend naturellement la situation exprimée par le latin tout en conservant l’image concrète.
- source_word: herbis agri
  choice: des plantes des champs
  rationale: « Plantes » est ici plus naturel et plus large que « herbes », qui pourrait évoquer en français moderne des herbes aromatiques ou du gazon.
- source_word: esca earum
  choice: la nourriture qu’elles me fournirent
  rationale: Le génitif renvoie vraisemblablement à la nourriture tirée des plantes; cette formulation évite de suggérer qu’il s’agit de la nourriture consommée par les plantes elles-mêmes.
- source_word: in saturitatem
  choice: suffit à me rassasier
  rationale: Expression française courante qui transmet l’idée d’une nourriture procurant une satiété complète.
