revisions:
- from: ou la mer un navire, ou tout autre récipient de la nourriture ou de la boisson. Et lorsqu’il arrive que ce qui a été semé ou ce qui a été mis à l’eau doive être détruit, ou…
  to: ou la mer, un navire, ou tout autre récipient, de la nourriture ou de la boisson. Et lorsqu’il arrive que ce qui a été semé ou ce qui a été déposé soit détruit, ou…
  rationale: La révision maintient le caractère fragmentaire de l’extrait, la coordination initiale et l’ellipse finale. Elle rend la liste de réceptacles plus intelligible en français et remplace l’interprétation maritime restrictive de missum est par « déposé », qui préserve l’ambiguïté du latin.
