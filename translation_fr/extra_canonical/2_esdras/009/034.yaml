  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
translation:
  language: fr
  text: ou la mer, un navire, ou tout autre récipient, de la nourriture ou de la boisson. Et lorsqu’il arrive que ce qui a été semé ou ce qui a été déposé soit détruit, ou…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uas aliud
  choice: tout autre récipient
  rationale: Aliud signifie « autre » et rattache explicitement ce récipient à la terre et à la mer, elles aussi envisagées comme des contenants.
- source_word: escas uel potus
  choice: de la nourriture ou de la boisson
  rationale: Rend naturellement les deux objets reçus par le récipient, tout en conservant l’alternative du latin.
- source_word: missum est
  choice: a été mis à l’eau
  rationale: Dans le parallèle avec le navire et la mer, missum désigne vraisemblablement ce qui a été lancé ou envoyé sur l’eau; « mis à l’eau » exprime ce sens sans préciser indûment qu’il s’agit nécessairement d’un navire.
- source_word: exterminetur
  choice: doive être détruit
  rationale: Le verbe latin exprime ici la destruction ou la disparition de ce qui a été semé ou mis à l’eau; la tournure conserve la construction consécutive ou éventuelle avec ut.
theological_decisions: []
translation_notes:
  register: Le texte fourni commence et se termine au milieu d’une construction coordonnée. La traduction conserve donc l’initiale « ou » et l’ellipse finale afin de ne pas inventer le contexte absent. Registre courant et digne; « récipient » convient à la nourriture et à la boisson, tandis que « mis à l’eau » respecte l’image maritime.
