  text: '“I have spoken before[a], and now I say, and I will say afterward: many more perish than will be saved,'
translation:
  language: fr
  text: '« J’ai parlé autrefois, je le dis maintenant et je le dirai plus tard : ceux qui périssent sont plus nombreux que ceux qui seront sauvés, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: olim locutus sum
  choice: J’ai parlé autrefois
  rationale: Rend le parfait « locutus sum » et la valeur temporelle de « olim », tout en conservant la distinction avec « dico » qui suit.
- source_word: nunc dico et postea dicam
  choice: je le dis maintenant et je le dirai encore par la suite
  rationale: Le verbe « dire » correspond à « dico/dicam » et introduit naturellement l’affirmation qui suit ; « encore » exprime ici la reprise future annoncée par « postea ».
- source_word: plures sunt qui pereunt
  choice: ceux qui périssent sont plus nombreux
  rationale: Reproduit clairement la comparaison quantitative du latin sans ajouter d’explication sur la nature de la perdition.
- source_word: quam qui salvabuntur
  choice: que ceux qui seront sauvés
  rationale: Conserve le futur passif de « salvabuntur » et son ouverture quant à l’agent du salut.
theological_decisions:
- issue: Portée de « pereunt » et agent implicite de « salvabuntur »
  choice: périssent / seront sauvés
  alternative: se perdent / obtiendront le salut
  rationale: La formulation retenue préserve le contraste verbal du texte et n’explicite ni la nature de la perdition ni l’agent du salut.
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points rend la relation explicative introduite par « quoniam ». La variation entre « parler » et « dire » respecte la distinction latine entre « locutus sum » et « dico/dicam ».
