  text: She said to me, “I, your female servant, was barren and did not bear a child, though I had a husband for thirty years.”
translation:
  language: fr
  text: 'Elle me dit : « Moi, ta servante, j’étais stérile et je n’ai pas eu d’enfant, bien que j’aie été mariée pendant trente ans. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: famula
  choice: servante
  rationale: « Servante » conserve la désignation féminine et le rapport de dépendance exprimés par le latin, sans imposer dans le texte une condition juridique d’esclave que le contexte immédiat ne précise pas entièrement.
- source_word: sterilis
  choice: stérile
  rationale: Équivalent direct et naturel du latin, approprié au registre narratif.
- source_word: non peperi
  choice: je n’ai pas eu d’enfant
  rationale: Rend idiomatiquement l’idée de ne pas avoir enfanté, sans suggérer seulement l’absence d’un accouchement ponctuel.
- source_word: habens maritum annis triginta
  choice: bien que j’aie été mariée pendant trente ans
  rationale: Exprime naturellement en français la durée de sa vie conjugale et la valeur concessive implicite du participe latin dans ce contexte.
