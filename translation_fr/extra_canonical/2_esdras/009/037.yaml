  text: L'a reçue. Car la loi ne périt pas, mais demeure dans son honneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: Car
  rationale: Introduit explicitement l’explication donnée par cette phrase.
- source_word: lex
  choice: la loi
  rationale: Équivalent direct et naturel de « lex » dans ce contexte.
- source_word: non perit
  choice: ne périt pas
  rationale: Conserve l’image forte du texte latin sans l’atténuer en « ne disparaît pas ».
- source_word: sed permanet
  choice: mais demeure
  rationale: Reproduit le contraste marqué par « sed » et la continuité exprimée par « permanet ».
- source_word: in suo honore
  choice: dans son honneur
  rationale: 'Rend formellement l’expression latine et laisse ouverte sa portée exacte : honneur, dignité ou statut reconnu.'
theological_decisions:
- issue: Nature de la permanence de la loi
  choice: demeure dans son honneur
  alternative: conserve son autorité
  rationale: Le latin parle d’« honor » et ne précise pas explicitement qu’il s’agit de l’autorité; la traduction évite donc de résoudre cette nuance théologique.
translation_notes:
  register: Français moderne, sobre et digne. « Périt » et « demeure » préservent le parallélisme antithétique du latin. Le segment « suscepit eam » appartient au contexte précédent selon la délimitation éditoriale reflétée par la référence fournie; il n’est donc pas repris dans le texte de ce verset.
