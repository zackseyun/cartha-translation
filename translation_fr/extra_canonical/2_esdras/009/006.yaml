source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'manifesta in prodigiis et uirtutibus, et consummatio in actu et in signis. Et erit omnis qui saluus factus fuerit, et qui poterit effugere per opera sua uel per fidem in qua credidit, Is relinquetur de praedictis periculis et uidebit salutare meum in terra mea et in finibus meis quae sanctificaui mihi a saeculo. Et tunc mirabuntur qui nunc abusi sunt uias meas, et in cruciamentis commorabuntur hii qui eas proiecerunt in contemptu. Quodquod enim non cognouerunt me uiuentes beneficia consecuti, Et quodquod fastidierunt legem meam, cum adhuc erant habentes libertatem, Et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreuerunt, hos oportet post mortem in cruciamento cognoscere. Tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti saluabuntur, et quorum saeculum et propter quos saeculum et quando. Respondi et dixi : Olim locutus sum et nunc dico et postea dicam, quoniam plures sunt qui pereunt quam ii qui saluabuntur, Sicut multiplicat
    fluctus super guttam. Et respondit ad me et dixit : qualis ager, talia et semina ; et quales flores, tales et tincturae ; et qualis opera, talis et creatio ; et qualis agricola, talis et area. Quoniam tempus erat saeculi, et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum, in quo inhabitarent; et nemo contradixit mihi tunc, nec enim erat quisquam: Et nunc creati in mundo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/006.yaml
  text: 'so also are the times of the Most High: beginnings made manifest in wonders and mighty works[a], and the end in deeds and signs.'
translation:
  language: fr
  text: 'ainsi en va-t-il aussi des temps du Très-Haut : leurs commencements se manifestent par des prodiges et des actes de puissance, et leur fin par des œuvres et des signes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tempora Altissimi
  choice: les temps du Très-Haut
  rationale: Conserve l’expression temporelle et le titre divin établis par le contexte immédiat.
- source_word: initia
  choice: leurs commencements
  rationale: Le pluriel latin est conservé; le possessif explicite naturellement en français le rapport avec « les temps ».
- source_word: prodigiis et uirtutibus
  choice: des prodiges et des actes de puissance
  rationale: « Prodiges » rend prodigiis; « actes de puissance » exprime le sens concret de uirtutibus sans le réduire à des vertus morales.
- source_word: consummatio
  choice: leur fin
  rationale: Le singulier du latin est respecté et « fin » est naturel dans l’opposition avec les commencements.
- source_word: in actu et in signis
  choice: par des œuvres et des signes
  rationale: Le singulier collectif actus est rendu par « œuvres », tandis que signis demeure « signes »; la préposition est comprise comme indiquant le moyen ou la manifestation.
theological_decisions:
- issue: Nature des uirtutes
  choice: actes de puissance
  alternative: miracles
  rationale: Le choix préserve une certaine amplitude sémantique et évite d’identifier trop étroitement tous les actes puissants à des miracles.
- issue: Rapport entre les temps, leurs commencements et leur fin
  choice: leurs commencements… leur fin
  alternative: des commencements… et la fin
  rationale: Les possessifs rendent explicite le rattachement grammatical aux temps du Très-Haut sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La structure antithétique de la source est conservée, ainsi que le contraste entre le pluriel « commencements » et le singulier « fin ».
