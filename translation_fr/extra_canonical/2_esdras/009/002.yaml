  source_fidelity: La traduction de saeculum par « monde » et l’attribution de la création au Très-Haut sont fidèles. Cependant, « intervenir » interprète uisitare au lieu de conserver le verbe de la source, et « des lieux ébranlés » remplace le nom d’action motio par un état des lieux.
