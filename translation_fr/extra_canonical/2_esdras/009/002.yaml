  text: then you will understand that this is the time when the Most High will begin to visit the world that was made by him[a]. And when a shaking of places is seen in the world,
translation:
  language: fr
  text: alors tu comprendras que c’est le temps où le Très-Haut commencera à visiter le monde qu’il a créé[a]. Et quand on verra dans le monde un ébranlement des lieux,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe « visiter » peut désigner une action divine décisive, notamment dans un contexte de jugement.
    reason: Conserver le verbe du latin tout en éclairant sa portée possible, sans la réduire à une seule interprétation.
lexical_decisions:
- source_word: uisitare
  choice: intervenir
  rationale: Dans ce contexte apocalyptique, le verbe évoque une action décisive du Très-Haut, potentiellement judiciaire, plutôt qu’une simple visite au sens moderne.
- source_word: saeculum
  choice: monde
  rationale: Ici, saeculum désigne le monde créé, comme le confirme la relative « qui ab eo factus est ».
- source_word: motio locorum
  choice: des lieux ébranlés
  rationale: Cette formulation naturelle conserve la portée concrète et l’indétermination du latin, qui peut évoquer des bouleversements ou des secousses affectant divers lieux.
theological_decisions:
- issue: Portée de la visite divine
  choice: intervenir dans le monde
  alternative: visiter le monde
  rationale: « Intervenir » restitue mieux en français actuel la force eschatologique de uisitare sans préciser indûment s’il s’agit exclusivement d’un jugement.
- issue: Agent de la création
  choice: qu’il a créé
  alternative: qui a été fait par lui
  rationale: La tournure active et naturelle maintient clairement le Très-Haut comme créateur sans ajouter de précision doctrinale.
translation_notes:
  register: Français moderne, accessible et digne. La syntaxe inachevée de la dernière proposition est conservée, car le verset se poursuit dans le contexte suivant.
