  text: 'infructuoso, et dicens dixisti: Tu Israel audi me, et semen'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/030.yaml
  text: and you said[a], saying, ‘Hear me, O Israel, and give ear to my words, O seed of Jacob.’
translation:
  language: fr
  text: 'et tu as dit ces paroles[a] : « Toi, Israël, écoute-moi ; descendance de Jacob, prête l’oreille à mes paroles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et, disant, tu as dit » ; on pourrait aussi comprendre simplement : « et tu as dit » et faire commencer immédiatement la citation.'
    reason: La syntaxe latine dicens dixisti est redondante et permet soit de conserver une formule introductive doublée, soit de traiter dicens comme étroitement lié aux paroles citées.
lexical_decisions:
- source_word: dicens dixisti
  choice: tu as dit ces paroles
  rationale: Cette tournure française restitue le double élément verbal de la formule latine sans produire le calque peu naturel « en disant, tu as dit ».
- source_word: Tu Israel audi me
  choice: Toi, Israël, écoute-moi
  rationale: L’adresse antéposée et l’impératif singulier du latin sont conservés.
- source_word: semen
  choice: descendance
  rationale: Dans l’adresse « descendance de Jacob », ce terme courant et collectif rend naturellement le latin semen sans suggérer uniquement une semence matérielle.
theological_decisions:
- issue: Valeur de la répétition dans « dicens dixisti »
  choice: La représenter idiomatiquement par « tu as dit ces paroles »
  alternative: « en disant, tu as dit » ou simplement « tu as dit »
  rationale: La première solution de remplacement serait un calque pesant en français, tandis que la seconde effacerait un élément réel de la formulation latine. La traduction retenue maintient l’insistance sans lui attribuer une portée doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Prêter l’oreille » garde la nuance solennelle de l’appel à écouter tout en restant compréhensible. Le singulier collectif est maintenu dans « descendance de Jacob ».
