  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: fr
  text: Que ma grappe et ma plantation soient préservées, car je les ai menées à bien au prix de beaucoup de peine. Mais toi, si tu attends encore sept autres jours—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruietur
  choice: soient préservées
  rationale: Dans ce contexte, la forme latine exprime la conservation ou la sauvegarde. Le pluriel français accorde le verbe avec « ma grappe et ma plantation ».
- source_word: acinus meus
  choice: ma grappe
  rationale: « Acinus » peut désigner un grain de raisin ou, selon l’usage tardif et le contexte viticole, la grappe. « Ma grappe » conserve l’image collective retenue par la tradition textuelle.
- source_word: plantatio mea
  choice: ma plantation
  rationale: Traduction directe qui maintient l’image agricole et son parallélisme avec la grappe.
- source_word: cum multo labore
  choice: au prix de beaucoup de peine
  rationale: Formulation française naturelle qui rend à la fois l’effort considérable et le coût pénible du travail.
- source_word: perfeci haec
  choice: je les ai menées à bien
  rationale: Rend l’idée d’achever ou d’accomplir sans suggérer une perfection morale ou absolue.
- source_word: intermittas
  choice: tu attends
  rationale: Dans cette consigne temporelle, le verbe signifie laisser passer ou observer un nouvel intervalle; « attendre » est naturel en français et évite l’idée moderne d’« interrompre ».
- source_word: septem dies alios
  choice: sept autres jours
  rationale: Rend directement la durée supplémentaire indiquée par le latin.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le contraste marqué par « Mais toi » et le tiret final sont conservés, puisque la phrase se poursuit au verset suivant.
