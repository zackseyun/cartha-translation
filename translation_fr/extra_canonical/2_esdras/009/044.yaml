- source_word: in annis triginta his
  choice: pendant ces trente années
  rationale: Rend la durée indiquée par le latin nettoyé et conserve le démonstratif « ces ».
- source_word: deprecabar
  choice: je suppliais
  rationale: Exprime une prière insistante ou une imploration, avec plus de précision que le simple « je priais ».
- source_word: Altissimum
  choice: le Très-Haut
  rationale: Titre divin traditionnel, clair et directement équivalent au latin.
- source_word: nocte ac die
  choice: nuit et jour
  rationale: Expression française idiomatique qui conserve l’idée de continuité et l’ordre du latin.
