  yaml_path: translation/extra_canonical/2_esdras/009/041.yaml
  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: fr
  text: 'Elle me dit : « Laisse-moi, mon seigneur, afin que je pleure sur moi-même et que j’ajoute à ma douleur, car je suis très amère dans mon esprit et très humiliée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  choice: Laisse-moi
  rationale: Rend directement la demande de la femme sans ajouter « seule », absent du latin.
- source_word: ut defleam me
  choice: afin que je pleure sur moi-même
  rationale: Préserve le sens réfléchi de me et la valeur de lamentation de defleam.
- source_word: adiciam dolorem
  choice: que j’ajoute à ma douleur
  rationale: Expression française naturelle qui conserve l’idée littérale d’ajouter encore à la douleur.
- source_word: valde amara sum animo
  choice: mon âme est remplie d’une profonde amertume
  rationale: Rend idiomatiquement l’état intérieur exprimé par animo et l’intensité de valde, sans donner à amara le sens d’un trait de caractère.
- source_word: humiliata sum valde
  choice: je suis profondément humiliée
  rationale: Conserve le passif et l’intensité du latin; « humiliée » laisse ouverte la nuance entre abaissement et humiliation.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche du latin tout en évitant une tournure peu naturelle comme « je suis très amère en esprit ».
