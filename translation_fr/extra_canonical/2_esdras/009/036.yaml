  text: nos quidem qui legem accepimus peccantes peribimuset cor nostrum quod suscepiteam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/036.yaml
  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
translation:
  language: fr
  text: Quant à nous[a], qui avons reçu la Loi, nous périrons parce que nous avons péché, et notre cœur aussi, qui l’a reçue[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin autour de ce verset est difficile. Le sens principal est que ceux qui ont reçu la Loi périssent, tandis que la Loi elle-même ne périt pas et demeure honorée.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « Quant à nous qui avons reçu la Loi, nous périrons en péchant, ainsi que notre cœur qui l’a reçue. »'
    reason: translation_alternative
lexical_decisions:
- source_word: nos quidem
  choice: Quant à nous
  rationale: Rend la mise en relief, possiblement contrastive, de quidem sans lui attribuer à tort une valeur causale.
- source_word: legem
  choice: la Loi
  rationale: Dans ce contexte religieux, le nom désigne la Loi reçue; la majuscule française en signale le référent déterminé.
- source_word: peccantes peribimus
  choice: nous périrons parce que nous avons péché
  rationale: Exprime le lien entre le péché des destinataires de la Loi et leur perte, conformément au sens contextuel du participe peccantes.
- source_word: cor nostrum
  choice: notre cœur
  rationale: Conserve explicitement le possessif nostrum et le singulier collectif du latin.
- source_word: quod suscepit eam
  choice: qui l’a reçue
  rationale: Le relatif renvoie à « notre cœur » et le pronom féminin à « la Loi ».
theological_decisions:
- issue: Contraste entre la mortalité des pécheurs et la permanence de la Loi dans le contexte
  choice: Ne traduire ici que la perte de ceux qui ont reçu la Loi et de leur cœur
  alternative: Ajouter explicitement que la Loi ne périt pas
  rationale: Cette affirmation relève du contexte voisin et non des mots conservés dans ce verset; l’ajouter au texte résoudrait ou compléterait indûment la formulation.
- issue: Valeur de peccantes
  choice: « parce que nous avons péché »
  alternative: « pécheurs » ou « dans le péché »
  rationale: Le rendu causal donne en français naturel le rapport implicite du participe circonstanciel, tout en évitant de faire du péché un simple lieu ou état abstrait.
translation_notes:
  register: Français international moderne, digne et accessible. « Quant à nous » garde l’emphase de nos quidem; le singulier collectif « notre cœur » préserve la construction latine. La ponctuation finale par point-virgule reflète la continuité probable avec le verset suivant.
