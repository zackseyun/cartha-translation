  yaml_path: translation/extra_canonical/2_esdras/009/024.yaml
  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: fr
  text: Va dans un champ où aucune maison n’a été bâtie, et mange seulement les fleurs du champ. Tu ne goûteras pas de viande et tu ne boiras pas de vin, mais seulement des fleurs. Et prie le Très-Haut sans relâche, et
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: floribus campi
  choice: les fleurs des champs
  rationale: Rend directement l’expression latine dans un français naturel, sans ajouter que le champ lui-même serait nécessairement fleuri.
- source_word: carnem non gustabis
  choice: Tu ne goûteras pas de viande
  rationale: Conserve l’image et la force du latin « goûter », plutôt que de généraliser en « manger ».
- source_word: sine intermissione
  choice: sans relâche
  rationale: Expression française courante et digne qui traduit l’idée d’une prière poursuivie sans interruption.
- source_word: altissimum
  choice: le Très-Haut
  rationale: Titre divin traditionnel et transparent correspondant au superlatif latin substantivé.
theological_decisions:
- issue: Nature des prescriptions alimentaires et de la prière
  choice: Conserver les impératifs et futurs prescriptifs sans les expliquer
  alternative: Les reformuler explicitement comme un jeûne rituel ou une pratique ascétique
  rationale: Le texte ordonne ces actes sans en préciser ici la portée théologique; la traduction ne doit pas importer une interprétation confessionnelle.
translation_notes:
  register: Français moderne, clair et digne. Le « tu » correspond à l’adresse individuelle du passage. La conjonction finale « et » est conservée, car le texte source fourni se poursuit au-delà de ce verset.
