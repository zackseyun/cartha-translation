source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae suscepta sunt, Exterminentur haec, susceptoria uero manent: apud nos enim non sic factum est. Nos quidem qui legem accepimus peccantes peribimus et cor nostrum quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
translation:
  language: fr
  text: Et quand ce qui a été reçu est détruit, ces choses sont détruites, mais les réceptacles subsistent[a]. Car, chez nous, il n’en a pas été ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les contenants subsistent »; le mot latin désigne ce qui reçoit ou contient quelque chose.
    reason: Le terme latin susceptoria est rare et peut être rendu de manière plus concrète par « contenants ».
lexical_decisions:
- source_word: suscepta
  choice: ce qui a été reçu
  rationale: Le participe neutre substantivé désigne les choses reçues; cette formulation conserve le sens général sans introduire les idées non exprimées de semence ou d’envoi.
- source_word: exterminentur
  choice: disparaît
  rationale: Dans ce contexte, le verbe indique la destruction ou la disparition de ce qui a été reçu. Le singulier français s’accorde naturellement avec « ce qui ».
- source_word: susceptoria
  choice: les réceptacles
  rationale: Le terme désigne ce qui reçoit ou contient autre chose. « Réceptacles » maintient le contraste lexical avec « reçu », malgré son registre légèrement soutenu.
- source_word: apud nos enim non sic factum est
  choice: Car, chez nous, il n’en a pas été ainsi
  rationale: « Car » rend la valeur explicative de enim, et la tournure française préserve le contraste établi avec le cas précédent.
theological_decisions:
- issue: Rapport entre les choses reçues et ceux ou ce qui les reçoit
  choice: Maintenir l’image générale de réceptacles qui subsistent
  alternative: Interpréter explicitement les réceptacles comme des personnes ou comme la terre
  rationale: Le fragment latin ne précise pas ici l’identité des receptoria; l’expliciter résoudrait indûment l’image et pourrait orienter son interprétation théologique.
translation_notes:
  register: Français international moderne, digne et lisible. « Réceptacles » est conservé pour reproduire le jeu entre suscepta et susceptoria; la note en éclaire le sens concret.
