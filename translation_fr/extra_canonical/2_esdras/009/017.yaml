  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
translation:
  language: fr
  text: 'Il me répondit : « Tel est le champ, telles aussi sont les semences ; telles sont les fleurs, telles aussi sont les couleurs ; telle est l’œuvre, telle aussi est la création ; tel est le cultivateur, telle aussi est l’aire de battage. Car il y avait un temps de l’âge[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car c’était le temps de l’âge. »'
    reason: Le latin quoniam tempus erat saeculi peut recevoir une lecture existentielle (« il y avait un temps ») ou une lecture définie (« c’était le temps »).
lexical_decisions:
- source_word: qualis ... talia / tales / talis
  choice: tel… telles / telle
  rationale: Reproduit la série de corrélations comparatives du latin tout en restant naturelle en français.
- source_word: tincturae
  choice: couleurs
  rationale: Dans le parallèle avec les fleurs, « couleurs » rend naturellement les teintes ou colorations désignées par le latin.
- source_word: opera
  choice: œuvre
  rationale: Conserve le terme abstrait et son parallèle avec « création », sans préciser indûment s’il s’agit de l’action ou de son résultat.
- source_word: agricola
  choice: cultivateur
  rationale: Terme courant et digne pour celui qui travaille la terre.
- source_word: area
  choice: aire de battage
  rationale: Rend le sens agricole concret du latin area dans son association avec le cultivateur.
- source_word: quoniam tempus erat saeculi
  choice: Car il y eut un temps de cet âge
  rationale: Suit la valeur existentielle possible de erat et conserve l’expression inhabituelle « temps de cet âge », sans ajouter le démonstratif « tel » absent du latin.
theological_decisions:
- issue: Rapport entre le temps et « l’âge » (saeculum)
  choice: un temps de cet âge
  alternative: le temps de cet âge
  rationale: L’absence d’article en latin permet plusieurs nuances. Le texte principal préserve l’idée qu’un temps ou une période appartenait à cet âge, tandis que la note signale la lecture définie sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition structurée de « tel… telle(s) » conserve la cadence proverbiale du latin. La virgule finale maintient le caractère inachevé de la phrase, qui se poursuit au verset suivant.
