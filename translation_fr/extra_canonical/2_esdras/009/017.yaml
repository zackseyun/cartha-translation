  source_fidelity: La série corrélative (qualis… talia/tales/talis) est fidèlement reproduite, de même que les termes agricoles et les parallèles « œuvre / création ». En revanche, « il y eut » est un passé simple qui ne rend pas bien l’imparfait erat (« il y avait » / « c’était »).
  naturalness: Le français est globalement naturel et soutenu. « Il y avait un temps de l’âge » conserve volontairement la formulation elliptique et quelque peu inhabituelle du latin, tout en évitant l’effet narratif achevé de « il y eut ».
  terminology: « Semences », « couleurs », « œuvre », « création », « cultivateur » et « aire de battage » sont des choix justes et cohérents. « Âge » rend saeculum sans imposer l’interprétation « monde » ou « siècle ».
