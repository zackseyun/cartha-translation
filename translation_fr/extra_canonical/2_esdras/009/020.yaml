lexical_decisions:
- source_word: Et uidi
  choice: J’ai vu
  rationale: Rend directement le latin sans ajouter de complément absent du texte source.
- source_word: peperci eis
  choice: je les ai épargnés
  rationale: Le datif latin « eis » devient naturellement le pronom objet « les » en français.
- source_word: uix
  choice: à grand-peine
  rationale: Exprime ici l’idée de difficulté portée par « uix », tout en conservant sa nuance de limite.
theological_decisions:
- issue: Délimitation du verset dans l’extrait fourni
  choice: Retenir « Et uidi et peperci eis uix » comme texte de 2 Esdras 9.20
  alternative: Inclure aussi « erat perditum… quae in eo aduenerunt », comme dans la couche anglaise fournie
  rationale: Le début de l’extrait latin est manifestement la fin d’une phrase antérieure, tandis que l’historique de révision identifie explicitement la dernière proposition comme le texte extant de ce verset. L’ajout du contenu précédent reproduirait un décalage de délimitation.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve l’absence de complément après « J’ai vu » et ne développe pas ce que le latin laisse implicite.
