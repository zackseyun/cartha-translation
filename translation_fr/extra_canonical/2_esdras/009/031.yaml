  text: Iacob intendite sermonibus meis. Ecce enim semino in uobis legem meam, et faciet in uobis fructum, et glorificabimini in eo per saeculum. Nam patres nostri accipientes legem non seruauerunt et legitima non custodierunt, et factus est fructus legis non periens; nec enim poterat quoniam tuus erat. Nam qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: fr
  text: 'Car voici que je sème ma loi en vous : elle portera du fruit en vous, et par elle vous serez glorifiés pour toujours.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce enim
  choice: Car voici que
  rationale: Rend à la fois la valeur explicative de enim et la mise en relief de ecce.
- source_word: semino in uobis legem meam
  choice: je sème ma loi en vous
  rationale: Conserve la métaphore agricole et la préposition intérieure du latin.
- source_word: faciet in uobis fructum
  choice: elle portera du fruit en vous
  rationale: Expression française naturelle qui préserve le lieu intérieur indiqué par in uobis.
- source_word: glorificabimini in eo
  choice: par elle vous serez glorifiés
  rationale: Le pronom latin eo renvoie très probablement à lex, féminin en français; «par elle» exprime ici la valeur instrumentale probable sans ajouter d'interprétation doctrinale.
- source_word: per saeculum
  choice: pour toujours
  rationale: Formulation française courante correspondant à la portée durable de l'expression latine.
theological_decisions:
- issue: Référent et valeur de «in eo»
  choice: par elle
  alternative: en elle
  rationale: Le référent le plus proche et cohérent est «la loi». La préposition latine in peut être locative ou instrumentale; le contexte soutient l'instrumental, comme dans l'anglais audité, tout en laissant intacte l'affirmation théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. La structure imagée du semis et du fruit est conservée, ainsi que le passif «vous serez glorifiés». Le guillemet fermant est maintenu parce que l'extrait anglais indique la fin d'un discours cité.
