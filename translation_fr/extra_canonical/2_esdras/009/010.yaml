  text: For all who did not know me while they were alive, though they had received benefits,
translation:
  language: fr
  text: Car tous ceux qui ne m’ont pas connu de leur vivant, bien qu’ils aient reçu des bienfaits,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot enim
  choice: Car tous ceux qui
  rationale: Rend la valeur explicative de « enim » et la portée globale de « quotquot », tout en conservant le caractère de proposition inachevée du verset.
- source_word: non cognoverunt me
  choice: ne m’ont pas connu
  rationale: Traduction directe de « cognoscere », sans préciser s’il s’agit d’une connaissance intellectuelle, relationnelle ou spirituelle.
- source_word: viventes
  choice: de leur vivant
  rationale: Expression française naturelle indiquant qu’ils ne connaissaient pas Dieu pendant leur vie.
- source_word: beneficia consecuti
  choice: bien qu’ils aient reçu des bienfaits
  rationale: « Recevoir des bienfaits » rend naturellement l’idée d’avoir obtenu des faveurs ou des bénéfices; la tournure concessive explicite le rapport implicite entre le participe et le verbe principal.
theological_decisions:
- issue: Nature de la connaissance de Dieu
  choice: ne m’ont pas connu
  alternative: ne m’ont pas reconnu
  rationale: Le latin « cognoverunt » ne permet pas de réduire la phrase au seul refus de reconnaître Dieu; la formulation retenue préserve sa portée ouverte.
- issue: Nature et origine des bienfaits
  choice: des bienfaits
  alternative: mes bienfaits
  rationale: Le texte latin ne comporte pas de possessif. Ne pas ajouter « mes » évite de rendre explicite une attribution seulement suggérée par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. La virgule finale est conservée parce que le texte source constitue une proposition subordonnée dont la suite se trouve dans le contexte immédiat.
