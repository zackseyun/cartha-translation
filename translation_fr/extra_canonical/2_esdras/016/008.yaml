  text: A strong archer has shot an arrow; who will turn it back? The Lord God sends evils, and who will drive them away?
translation:
  language: fr
  text: 'Un archer puissant a décoché une flèche : qui la fera revenir ? Le Seigneur Dieu envoie les malheurs ; qui les écartera ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  choice: Une flèche décochée par un archer puissant
  rationale: « Décochée » est le verbe français naturel pour une flèche tirée par un archer ; « puissant » rend forti sans alourdir la phrase.
- source_word: mittit
  choice: envoie
  rationale: Correspondance directe et idiomatique avec le latin, tout en conservant l’affirmation de l’action divine.
- source_word: mala (attesté par le contexte textuel consulté dans la couche anglaise auditée)
  choice: les malheurs
  rationale: Dans ce contexte apocalyptique, mala désigne des calamités ou des fléaux plutôt que le mal moral ; « malheurs » reste clair, courant et suffisamment large.
- source_word: revocabit / avertet (verbes impliqués par les interrogations conservées dans la tradition textuelle et reflétées dans la couche anglaise)
  choice: fera revenir / écartera
  rationale: Ces formulations distinguent naturellement en français le retour impossible de la flèche et l’impossibilité d’éloigner les calamités envoyées.
theological_decisions:
- issue: Dieu est présenté comme envoyant des mala.
  choice: Le Seigneur Dieu envoie les malheurs
  alternative: Le Seigneur Dieu envoie les maux
  rationale: « Malheurs » préserve l’idée de calamités relevant du jugement divin sans suggérer inutilement que Dieu produit le mal moral. La tension du texte sur l’action divine demeure explicite.
translation_notes:
  register: Français international moderne, sobre et digne. La structure en deux questions rhétoriques parallèles est conservée. Le premier membre suit de près l’ordre du fragment latin fourni, tandis que le second reprend la leçon complète attestée par la couche de consultation auditée.
