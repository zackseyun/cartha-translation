  text: dolete eos, quoniam adpropinquauit contritio uestra. Inmissus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/002.yaml
  text: Mourn for them[a], because your destruction has drawn near.
translation:
  language: fr
  text: Pleurez-les, car votre destruction[a] est toute proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « écrasement ».'
    reason: Le latin « contritio » peut évoquer littéralement l’action d’écraser, mais prend souvent le sens plus large de destruction ou de ruine.
lexical_decisions:
- source_word: dolete eos
  choice: Pleurez-les
  rationale: Le verbe latin « dolere » exprime ici le deuil ou l’affliction, et le pronom « eos » renvoie explicitement à un pluriel masculin. « Pleurez-les » est direct, naturel et conserve cette référence.
- source_word: adpropinquauit
  choice: est toute proche
  rationale: Le parfait latin indique que la menace s’est désormais rapprochée. Cette tournure française rend naturellement le résultat présent et l’imminence.
- source_word: contritio uestra
  choice: votre destruction
  rationale: Dans le registre prophétique et apocalyptique, « contritio » désigne couramment la destruction ou la ruine, plutôt qu’un écrasement matériel au sens strict.
theological_decisions:
- issue: Nature de la « contritio » annoncée
  choice: destruction
  alternative: écrasement
  rationale: Le contexte annonce un désastre imminent sans en préciser le mécanisme. « Destruction » préserve la portée générale du jugement, tandis que la note signale la valeur plus littérale possible.
translation_notes:
  register: Français moderne, sobre et prophétique. « Pleurez-les » conserve l’objet masculin pluriel du latin; « est toute proche » exprime avec naturel l’imminence marquée par le parfait latin. Le mot isolé « Inmissus » est le début de la phrase suivante et n’est donc pas intégré à ce verset.
