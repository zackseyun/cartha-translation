  text: For a man will long to see another man[a], or at least to hear his voice.
translation:
  language: fr
  text: Car un être humain désirera voir un autre être humain, ou du moins entendre sa voix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homo hominem
  choice: un être humain… un autre
  rationale: Le latin emploie « homo » au sens générique. Cette formulation française conserve la relation entre une personne et une autre sans introduire une portée exclusivement masculine.
- source_word: concupiscet
  choice: désirera
  rationale: Dans ce contexte, le verbe exprime un désir intense de présence humaine; « désirera » reste naturel et digne sans ajouter une nuance charnelle étrangère au passage.
- source_word: vel certe
  choice: ou du moins
  rationale: « Vel certe » présente l’écoute de la voix comme solution minimale à défaut de voir l’autre personne; « ou du moins » rend cette valeur de repli.
