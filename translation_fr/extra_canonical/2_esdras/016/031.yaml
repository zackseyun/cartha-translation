  rationale: 'Conserve le singulier de racemus et la nuance de patens : la grappe est exposée, apparente, donc visible.'
- source_word: scrutantibus vindemiam diligenter
  choice: à ceux qui examinent soigneusement la vendange
  rationale: Respecte vindemiam, « la vendange », plutôt que « la vigne », ainsi que l’idée d’une recherche attentive.
