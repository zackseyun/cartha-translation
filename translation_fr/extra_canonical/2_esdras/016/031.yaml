review_pass:
  verdict: revise
  source_fidelity: 'La structure essentielle est bien rendue : « vigne vendangée », le singulier de racemus et la visibilité de patens sont conservés. Toutefois, « échappe à » introduit l’idée active d’une fuite ou d’une omission fortuite, tandis que subremanet signifie plus directement « reste / demeure ». La relation exprimée par ab est mieux représentée par « laissée par » que par « échappe à ».'
  naturalness: Le français du projet est clair et de registre approprié. « Une grappe bien visible échappe à ceux qui examinent… » reste toutefois légèrement forcé et moins fidèle à l’image d’une grappe demeurée après une vendange soigneuse.
  terminology: « Vigne vendangée » et « vendange » rendent correctement vinea vindemiata et vindemiam. « Apparente » rend patens sans ajouter l’intensification subjective de « bien visible ».
  issues:
  - severity: medium
    issue: « échappe à » traduit subremanet de façon trop interprétative.
    rationale: Le latin décrit une grappe qui reste (et, dans ce contexte, qui est laissée par les personnes examinant soigneusement la vendange), non une grappe qui « échappe » activement à leur attention.
  - severity: low
    issue: « bien visible » renforce légèrement patens.
    rationale: Patens signifie ouverte, exposée ou apparente ; « apparente » conserve cette nuance sans l’intensifier.
