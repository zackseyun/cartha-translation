lexical_decisions:
- source_word: scrutinabit
  choice: examinera
  rationale: Rend l’idée d’un examen attentif et approfondi, sans ajouter l’intensif absent du latin.
- source_word: opera
  choice: œuvres
  rationale: Équivalent naturel dans ce registre biblique pour les actes envisagés dans leur portée morale.
- source_word: traducet
  choice: dénoncera
  rationale: Dans ce contexte, le verbe signifie livrer publiquement à la honte ou exposer; « dénoncera » conserve l’idée d’une mise en accusation publique.
- source_word: Et uos
  choice: Et vous
  rationale: Conserve le fragment syntaxique final, qui se poursuit au verset suivant, sans le compléter artificiellement.
theological_decisions:
- issue: Sujet implicite de scrutinabit et traducet
  choice: Maintenir le pronom implicite par « Il »
  alternative: Expliciter « le Seigneur »
  rationale: Le texte latin fourni ne contient pas Dominus dans ce verset; « Il » respecte la continuité contextuelle sans importer ici un nom absent de la source.
translation_notes:
