source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite uero ista et cognoscite ea, serui domini. Ecce uerbum domini, excipite eum, ne discredatis de quibus dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, servants of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: fr
  text: 'Mais écoutez ces choses et sachez-le, serviteurs du Seigneur. Voici la parole du Seigneur : recevez-la ; ne mettez pas en doute les choses dont il parle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  choice: écoutez
  rationale: Rend directement l’impératif latin et convient à une proclamation adressée à un groupe.
- source_word: cognoscite ea
  choice: prenez-en connaissance
  rationale: Exprime l’idée d’apprendre et de reconnaître ces choses sans réduire le verbe au seul fait de les comprendre.
- source_word: serui domini
  choice: serviteurs du Seigneur
  rationale: « Serviteurs » est naturel et digne en français biblique moderne, tout en conservant la relation de service exprimée par serui.
- source_word: Ecce
  choice: Voici
  rationale: Équivalent idiomatique de la particule de présentation latine.
- source_word: excipite eum
  choice: accueillez-la
  rationale: Le pronom latin masculin eum reprend grammaticalement uerbum ; en français, « parole » est féminin. « Accueillir » rend ici l’idée de recevoir favorablement.
- source_word: ne discredatis
  choice: Ne refusez pas de croire
  rationale: Rend la négation de la foi ou du crédit exprimée par discredere dans un français naturel.
- source_word: de quibus dicit
  choice: ce qu’elle dit
  rationale: Le latin est peu idiomatique et peut se comprendre comme renvoyant aux choses dont parle la parole ; cette formulation française conserve le sens général sans ajouter de contenu.
theological_decisions:
- issue: Référent de dicit
  choice: La parole du Seigneur (« ce qu’elle dit »)
  alternative: Le Seigneur (« ce qu’il dit »)
  rationale: L’antécédent grammatical immédiat est uerbum domini, repris juste avant par eum. Le français peut donc naturellement personnifier « la parole » sans identifier explicitement le locuteur au Seigneur.
- issue: Portée de serui
  choice: serviteurs
  alternative: esclaves
  rationale: Le latin serui peut désigner des esclaves ou des serviteurs. Dans cette adresse religieuse, « serviteurs du Seigneur » préserve l’ambivalence fonctionnelle et évite une précision sociale que le contexte n’impose pas.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation explicite la suite d’exhortations du latin tout en conservant ses phrases brèves et solennelles.
