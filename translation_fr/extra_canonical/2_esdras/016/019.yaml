lexical_decisions:
- source_word: In his
  choice: dans ces circonstances
  rationale: Le latin signifie littéralement « dans ces choses ». En français actuel, « dans ces circonstances » exprime naturellement l’idée de la conduite à tenir au milieu des événements annoncés.
- source_word: malorum
  choice: des malheurs
  rationale: Le pluriel renvoie ici à des calamités ou épreuves concrètes. « Des malheurs » conserve le pluriel et évite de désigner une série déterminée par un article défini.
- source_word: quid
  choice: Que feront-ils
  rationale: Dans la question transmise et son contexte, quid introduit ce que les personnes concernées feront; cette formulation est claire et idiomatique en français.
