  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: fr
  text: Car Dieu est votre guide. Et vous qui gardez mes commandements et mes préceptes, dit le Seigneur Dieu, que vos péchés ne pèsent pas sur vous et que vos fautes ne prennent pas le dessus sur vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait latin fourni s’arrête après « ne praeponderent uos » (« qu’ils ne pèsent pas sur vous »). La suite — « vos péchés… et vos fautes… » — suit la forme longue attestée dans la tradition latine et reflétée dans la couche de consultation anglaise.
    reason: Signaler précisément que la seconde partie de l’énoncé dépasse l’extrait latin reproduit dans les données fournies.
lexical_decisions:
- source_word: dux
  choice: guide
  rationale: Rend naturellement le rôle de celui qui conduit, sans imposer la nuance plus militaire de « chef ».
- source_word: mandata
  choice: commandements
  rationale: Équivalent français courant et digne pour des prescriptions divines obligatoires.
- source_word: praecepta
  choice: préceptes
  rationale: Maintient la distinction lexicale avec « commandements », même si les deux termes se recouvrent partiellement.
- source_word: praeponderent
  choice: pèsent… sur
  rationale: Conserve l’image concrète du poids exprimée par le verbe latin.
- source_word: iniquitates
  choice: fautes
  rationale: Formulation française naturelle pour des actes moralement coupables; elle évite le caractère parfois abstrait de « iniquités ».
- source_word: superent
  choice: prennent le dessus sur
  rationale: Exprime clairement l’idée de dominer ou de l’emporter sur quelqu’un.
theological_decisions:
- issue: Lien entre l’obéissance et l’avertissement concernant le péché
  choice: Conserver la juxtaposition du texte sans préciser de relation causale
  alternative: Reformuler comme une promesse conditionnelle accordée à ceux qui obéissent
  rationale: Le latin ne définit pas explicitement la relation théologique entre les deux propositions; la traduction ne doit donc pas la résoudre.
- issue: Valeur exhortative de « ne praeponderent »
  choice: Employer « que… ne… pas »
  alternative: Employer l’impératif « ne laissez pas… »
  rationale: Cette tournure conserve l’ambiguïté entre souhait, exhortation et défense, alors que l’impératif français attribuerait plus nettement aux destinataires la maîtrise de leurs péchés.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le mouvement quelque peu solennel de l’énoncé latin tout en restant compréhensible. « Préceptes » est maintenu pour préserver le doublet mandata/praecepta; « fautes » et « prennent le dessus » évitent un registre inutilement archaïque.
