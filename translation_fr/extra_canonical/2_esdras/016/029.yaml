source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquentur enim decem de civitate et duo exagro, qui absconderint se in silva et in fissuras petrarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/029.yaml
  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
translation:
  language: fr
  text: Car il restera dix personnes d’une ville et deux de la campagne, qui se seront cachées dans la forêt et dans les fissures des rochers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquentur
  choice: il ne restera que
  rationale: Le passif latin exprime ici le petit nombre de survivants laissés sur place. Cette tournure idiomatique française conserve ce sens sans employer le passif peu naturel « seront laissés ».
- source_word: de civitate
  choice: d’une ville
  rationale: Rend directement l’origine ou l’appartenance exprimée par de avec l’ablatif, sans préciser une ville particulière absente du contexte fourni.
- source_word: ex agro
  choice: de la campagne
  rationale: Dans l’opposition avec civitas, ager désigne naturellement la campagne plutôt qu’un champ précis.
- source_word: in silva
  choice: dans la forêt
  rationale: Silva signifie simplement « forêt » ou « bois »; aucun qualificatif comme « épaisse » n’est justifié par le latin.
- source_word: in fissuras petrarum
  choice: dans les fissures des rochers
  rationale: Traduction proche du latin qui préserve l’image de refuges ouverts dans la roche.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Personnes » explicite le référent humain sous-entendu par les nombres latins. La proposition relative reste rattachée aux deux groupes de survivants.
