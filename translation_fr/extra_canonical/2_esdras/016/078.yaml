  text: peccata uestra, nec supereleuent iniquitates uestrae. Vae qui constringuntur a peccatis suis et obteguntur ab iniquitatibus suis, quemadmodum ager constringitur a silua et spinis tegitur semina eius, per quem non transit homo, et excluditur et mittitur ad deuorationem ignis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/078.yaml
  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
translation:
  language: fr
  text: 'vos péchés[a], et que vos injustices ne prennent pas le dessus sur vous. Malheur à ceux qui sont étroitement liés par leurs péchés et recouverts par leurs injustices, comme un champ enserré par une forêt et dont les semences sont couvertes d’épines, à travers lequel personne ne passe : il est fermé et livré au feu pour être dévoré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset commence au milieu d’une phrase amorcée au verset précédent.
    reason: Le découpage latin place ici « vos péchés », complément dépendant syntaxiquement de 16.77; la note avertit le lecteur de cette frontière de verset inhabituelle.
lexical_decisions:
- source_word: supereleuent
  choice: prennent le dessus sur vous
  rationale: Rend naturellement l’idée de domination portée par le verbe latin, sans la réduire au seul sens spatial d’« élever ».
- source_word: constringuntur
  choice: sont étroitement liés
  rationale: Préserve l’image de personnes serrées et retenues prisonnières par leurs propres péchés.
- source_word: obteguntur
  choice: recouverts
  rationale: Reproduit l’image d’un recouvrement complet, reprise ensuite par les épines qui couvrent les semences.
- source_word: semina eius
  choice: ses semences
  rationale: Le latin semina est formellement pluriel et peut désigner collectivement ce qui a été semé; « semences » conserve cette forme sans surinterprétation.
- source_word: ad deuorationem ignis
  choice: au feu pour être dévoré
  rationale: Expression française claire qui maintient la personnification du feu dévorant.
theological_decisions:
- issue: Rapport entre les personnes et leurs péchés
  choice: « liés par leurs péchés » et « recouverts par leurs injustices »
  alternative: « prisonniers de leurs péchés » et « ensevelis sous leurs injustices »
  rationale: La formulation choisie conserve les deux métaphores distinctes du latin sans renforcer leur portée au-delà du texte.
- issue: Référent de la proposition finale au singulier
  choice: « il est fermé et livré au feu » renvoie au champ
  alternative: Faire renvoyer la proposition au passage à travers le champ
  rationale: L’accord et le développement de la comparaison favorisent le champ comme référent, tout en évitant d’ajouter un sujet absent du latin.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe conserve l’ouverture fragmentaire imposée par la division des versets et maintient le parallélisme entre péchés/injustices et forêt/épines.
