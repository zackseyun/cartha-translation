  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: fr
  text: Il l’a fondé sur les eaux[a], lui qui a placé des sources d’eau dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin dit littéralement « il l’a fondé sur les eaux » ; dans le contexte, le pronom renvoie au ciel.
    reason: Signaler l’antécédent implicite sans l’ajouter au texte principal.
lexical_decisions:
- source_word: fundauit
  choice: a établi
  rationale: Rend l’idée de fonder ou d’asseoir solidement, dans un français naturel, sans préciser davantage la nature de l’action.
- source_word: super aquas
  choice: sur les eaux
  rationale: Conserve l’image spatiale du latin « super » et son écho au langage biblique de la création.
- source_word: posuit
  choice: a fait jaillir
  rationale: Dans le contexte de sources au désert, cette formulation française exprime naturellement leur mise en place par Dieu, sans changer le sens essentiel.
- source_word: fontes aquarum
  choice: des sources
  rationale: Le français moderne dit naturellement « des sources »; répéter « d’eau » serait généralement redondant.
- source_word: in deserto
  choice: dans le désert
  rationale: Traduction directe et idiomatique.
theological_decisions:
- issue: Référent du pronom « eum »
  choice: Maintien du pronom « l’ » avec une note
  alternative: Expliciter « le ciel » d’après le contexte et la couche anglaise
  rationale: L’extrait latin fourni ne nomme pas son antécédent. Le maintien du pronom respecte cette donnée textuelle et évite d’ajouter dans le corps du verset une expression absente de la source transmise.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « lui qui » relie les deux propositions et conserve le caractère hymnique de la phrase.
