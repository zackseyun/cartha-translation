  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: fr
  text: Les vierges pleureront, faute de fiancés ; les femmes pleureront, faute de maris ; leurs filles pleureront, faute de soutien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: virgines
  choice: les jeunes filles
  rationale: Dans ce contexte matrimonial, le terme désigne des femmes non mariées ; « jeunes filles » est naturel en français moderne sans insister inutilement sur leur état sexuel.
- source_word: sponsos
  choice: fiancés
  rationale: Rend le sens de partenaires promis en mariage et maintient la distinction avec « viros », les maris.
- source_word: adiutorium
  choice: soutien
  rationale: Exprime naturellement l'aide ou l'appui dont elles sont privées, tout en conservant la portée générale du latin.
theological_decisions:
- issue: Nature du soutien absent pour les filles
  choice: Ne pas identifier la personne ou la forme de soutien
  alternative: « personne pour les secourir » ou « protecteur »
  rationale: Le latin « adiutorium » reste général ; préciser un protecteur masculin ou une sorte particulière d'aide résoudrait indûment l'ambiguïté.
translation_notes:
  register: Style prophétique sobre et rythmé. La triple répétition de « pleureront » est conservée, tandis que « faute de » restitue idiomatiquement les participes latins « non habentes ».
