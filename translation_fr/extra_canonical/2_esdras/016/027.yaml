  yaml_path: translation/extra_canonical/2_esdras/016/027.yaml
  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
translation:
  language: fr
  text: Le raisin se livrera à la vendange, mais qui le liera[a] ? Car il y aura aussi une grande désolation en bien des lieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’attachera ». Le verbe latin signifie littéralement « liera » ou « attachera » ; dans ce contexte viticole, il peut évoquer le fait de rassembler les grappes lors de la vendange.
    reason: Le geste viticole précis désigné par adligabit demeure incertain ; la note conserve le sens lexical premier et signale l’interprétation contextuelle.
lexical_decisions:
- source_word: uva
  choice: le raisin
  rationale: Le singulier collectif français correspond au latin singulier et conserve l’image personnifiée.
- source_word: tradet se ad vindemiam
  choice: se livrera lui-même pour la vendange
  rationale: Cette formulation conserve la personnification et le mouvement volontaire exprimés par tradet se, plutôt que de réduire le sens à « mûrira ».
- source_word: adligabit eam
  choice: l’attachera
  rationale: Adligabit signifie d’abord « attachera, liera ». Le choix reste proche du latin, malgré l’incertitude sur le geste viticole précis visé.
- source_word: erit enim et locis desertio multa
  choice: Car, en bien des endroits, ce sera la désolation
  rationale: Rend naturellement l’idée d’une désolation étendue à de nombreux lieux; et est compris ici comme ajoutant cette réalité au tableau précédent.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et prophétique. La personnification du raisin est volontairement conservée; la dernière proposition est formulée idiomatiquement sans atténuer la gravité de la désolation.
