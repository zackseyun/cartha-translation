  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magis
  choice: plus
  rationale: Le comparatif latin prolonge une construction corrélative ou comparative commencée dans le contexte précédent; « plus » en conserve la dépendance.
- source_word: adzelabor
  choice: je déploierai mon zèle contre eux
  rationale: Le verbe exprime le zèle dirigé contre les personnes visées. Cette formulation garde cette nuance plus précisément que « je serai en colère », tout en restant naturelle en français.
- source_word: super peccata
  choice: à cause de leurs péchés
  rationale: Dans ce contexte, super indique le motif du zèle hostile; l’ajout possessif explicite le rapport évident entre les péchés et « eux » sans modifier le sens.
- source_word: dicit dominus
  choice: dit le Seigneur
  rationale: Formule prophétique rendue directement et dans un registre biblique courant.
- source_word: Quomodo
  choice: Comment
  rationale: Le mot ouvre la phrase ou la question du verset suivant; il est conservé ici conformément au découpage de la source fournie.
theological_decisions:
- issue: Nature de la réaction divine exprimée par adzelabor
  choice: Conserver l’image du zèle divin dirigé contre les pécheurs
  alternative: « je serai d’autant plus en colère contre eux »
  rationale: Le latin nomme le zèle plutôt que directement la colère. La traduction retenue préserve la tension du terme sans l’assimiler à une catégorie théologique plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Le fragment initial « plus » et le « Comment » final restent syntaxiquement ouverts parce que le verset fourni dépend à ses deux extrémités du contexte adjacent.
