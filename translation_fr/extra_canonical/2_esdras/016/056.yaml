  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: fr
  text: 'Lui qui a dit : « Que le ciel soit fait », et il fut fait ; et par sa parole, les étoiles furent établies.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum
  choice: Que le ciel soit fait
  rationale: Rend directement le subjonctif jussif latin « fiat » tout en conservant l’écho solennel de la parole créatrice.
- source_word: factum est
  choice: il fut fait
  rationale: Maintient la correspondance verbale avec « soit fait » et le caractère accompli de l’acte.
- source_word: in uerbo illius
  choice: par sa parole
  rationale: Dans ce contexte d’efficacité créatrice, « in » exprime naturellement le moyen ou la puissance opérante ; « sa parole » est idiomatique et fidèle.
- source_word: stellae fundatae
  choice: les étoiles furent établies
  rationale: « Établies » conserve l’image de fondation et de mise en place durable sans suggérer en français que les étoiles reposent littéralement sur des fondations.
theological_decisions:
- issue: Identité du sujet implicite
  choice: Lui qui a dit
  alternative: Celui qui a dit
  rationale: Le fragment latin commence par une forme verbale sans sujet nominal explicite dans l’extrait. « Lui qui » respecte la continuité probable avec le contexte précédent sans ajouter le nom de Dieu.
- issue: Portée de la parole créatrice
  choice: par sa parole, les étoiles furent établies
  alternative: dans sa parole, les étoiles furent fondées
  rationale: La traduction retenue exprime l’efficacité de la parole sans préciser davantage le mécanisme ni introduire une interprétation christologique absente du latin.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et le passé simple préservent la solennité du texte. Aucun marqueur de note n’est nécessaire.
