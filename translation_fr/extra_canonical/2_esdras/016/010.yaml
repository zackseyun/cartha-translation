lexical_decisions:
- source_word: est qui extinguat eum?
  choice: Y a-t-il quelqu’un qui puisse l’éteindre ?
  rationale: La tournure française rend la question existentielle latine et conserve le pronom masculin « l’ », dont le référent dépend du contexte.
- source_word: Coruscabit
  choice: Il lancera des éclairs
  rationale: Le verbe latin évoque un éclat fulgurant ou des éclairs ; cette formulation naturelle préserve l’image météorologique et la valeur future.
- source_word: quis non timebit?
  choice: qui n’aura pas peur ?
  rationale: Rend directement la question rhétorique et le sens courant de timebit, sans amplifier en « trembler ».
theological_decisions:
- issue: Référent du pronom eum et sujet implicite de coruscabit
  choice: Conserver « l’ » puis « il » sans explicitation
  alternative: Nommer le feu, Dieu ou un autre référent fourni par le contexte
  rationale: Le fragment latin ne nomme pas ici le référent ; l’expliciter résoudrait indûment une ambiguïté contextuelle.
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche du latin tout en évitant le peu naturel « jaillira en éclairs ».
