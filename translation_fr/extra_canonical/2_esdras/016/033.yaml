review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « restera désert » atténue le futur passif relinquetur (« sera laissé/abandonné désert »), et « plus » ajoute une notion temporelle qui n’est pas exprimée. « Dépériront » est possible dans le contexte, mais rend moins directement inveteraverunt, « vieilliront / se détérioreront ».
  naturalness: La formulation est fluide et convient à un registre prophétique moderne. « Se détérioreront » est plus naturel pour des champs que « vieilliront », tout en gardant l’idée de dégradation.
  terminology: '« Pays », « champs », « routes », « sentiers », « épines » et « brebis » sont des équivalents justes. Le singulier de per eam renvoie au pays : « n’y passeront pas » le conserve sans ajouter « plus ».'
  issues:
  - severity: medium
    issue: Voix passive de relinquetur insuffisamment représentée
    rationale: « Restera désert » décrit l’état résultant, mais le latin dit littéralement que le pays « sera laissé » désert ou abandonné.
  - severity: low
    issue: Ajout de « plus »
    rationale: Le latin ne contient pas d’adverbe équivalant à « plus » ; l’absence de passage des brebis suffit à exprimer l’abandon.
  - severity: low
    issue: Nuance de inveteraverunt
    rationale: « Dépériront » est contextuellement défendable, mais « se détérioreront » reflète plus directement l’idée de vieillissement ou de vétusté sans introduire d’image végétale.
  revised_text: Le pays sera laissé désert ; ses champs se détérioreront, et des épines pousseront sur ses routes et tous ses sentiers, parce que les brebis n’y passeront pas.
  revised_footnotes: []
