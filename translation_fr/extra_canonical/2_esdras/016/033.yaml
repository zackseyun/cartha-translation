source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et relinquetur deserta terra, et agri eius inveteraverunt, et viae eius et omnes semitae germinabunt spinas, eo quod non transient oves per eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
translation:
  language: fr
  text: Le pays sera laissé désert ; ses champs se détérioreront, et des épines pousseront sur ses routes et tous ses sentiers, parce que les brebis n’y passeront pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra
  choice: le pays
  rationale: Dans ce contexte de dévastation et de voies abandonnées, « le pays » désigne naturellement le territoire concerné, plutôt que la planète ou la matière du sol.
- source_word: agri
  choice: champs
  rationale: Équivalent courant et précis pour les terres cultivées.
- source_word: inveteraverunt
  choice: dépériront
  rationale: Le verbe latin exprime le fait de vieillir, de se détériorer ou de tomber en décrépitude. « Dépériront » restitue ce sens en français naturel sans lui attribuer à tort l’idée d’être envahi d’épines.
- source_word: viae ... semitae
  choice: routes ... sentiers
  rationale: Cette paire conserve la distinction entre voies principales et chemins plus étroits.
- source_word: germinabunt spinas
  choice: des épines pousseront sur
  rationale: La restructuration évite l’expression peu naturelle « les routes feront germer des épines » tout en conservant clairement l’image du texte latin.
- source_word: oves
  choice: brebis
  rationale: Traduction directe du nom latin, qui évoque ici les troupeaux passant habituellement sur ces voies.
- source_word: per eam
  choice: n’y passeront plus
  rationale: Le pronom adverbial « y » renvoie naturellement au pays et, dans le contexte immédiat, à ses voies; « plus » explicite la cessation impliquée par leur abandon.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et prophétique. La coordination et le rythme cumulatifs du latin sont préservés, avec une légère restructuration de « germinabunt spinas » pour obtenir une formulation idiomatique.
