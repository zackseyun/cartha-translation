- from: Le pays restera désert, ses champs dépériront, et des épines pousseront sur ses routes et tous ses sentiers, parce que les brebis n’y passeront plus.
  to: Le pays sera laissé désert ; ses champs se détérioreront, et des épines pousseront sur ses routes et tous ses sentiers, parce que les brebis n’y passeront pas.
  rationale: La révision restitue le passif de relinquetur, rend inveteraverunt par une dégradation naturelle en français, et retire l’ajout non exprimé « plus ». Elle conserve l’image selon laquelle les épines germent sur les voies et le renvoi singulier de per eam au pays.
