  text: He placed pools upon the mountain tops[a], to send forth rivers from the heights so that the earth might drink.
translation:
  language: fr
  text: Il a placé des bassins au sommet des montagnes, pour en faire sortir des fleuves depuis les hauteurs, afin que la terre boive.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lacus
  choice: des lacs
  rationale: Rend directement le pluriel latin et désigne ici des réserves d’eau situées sur les sommets.
- source_word: ad emittendum flumina
  choice: pour faire jaillir des fleuves
  rationale: Exprime la finalité de ces lacs et le mouvement de l’eau vers l’extérieur; « faire jaillir » est naturel en français dans cette image.
- source_word: ab eminenti
  choice: depuis les hauteurs
  rationale: Préserve le sens spatial de la provenance élevée sans imposer un référent plus précis que le latin.
- source_word: ut potaret terra
  choice: afin que la terre puisse boire
  rationale: Conserve la terre comme sujet de « boire » et maintient la personnification poétique du latin.
theological_decisions:
- issue: Sujet implicite au début du verset
  choice: Il
  alternative: Celui qui
  rationale: Le segment latin commence par une coordination dépendant du contexte antérieur; « Il » fournit en français une phrase autonome sans anticiper « Qui finxit hominem », qui appartient à la suite du texte.
translation_notes:
  register: Français moderne, clair et soutenu. La structure finale en deux propositions de but suit le latin, tandis que l’image de la terre qui boit est délibérément préservée.
