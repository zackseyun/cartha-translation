source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: donec consumat fundamenta terrae. Quemadmodum non redit sagitta missa a sagittario ualido, sic non reuertentur mala quae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: fr
  text: Comme une flèche décochée par un archer puissant ne revient pas, ainsi les malheurs envoyés sur la terre ne reviendront pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagitta missa
  choice: une flèche décochée
  rationale: « Décochée » exprime naturellement en français le tir d’une flèche et conserve l’image précise du latin.
- source_word: sagittario ualido
  choice: un archer puissant
  rationale: « Puissant » rend ualidus sans réduire le terme à la seule habileté technique de l’archer.
- source_word: mala
  choice: les malheurs
  rationale: Dans ce contexte de calamités envoyées sur la terre, « malheurs » est plus idiomatique que « maux » tout en gardant la portée collective du pluriel latin.
- source_word: non reuertentur
  choice: ne reviendront pas
  rationale: La répétition de « revenir » maintient le parallèle rhétorique avec la flèche et laisse intacte l’idée que ces calamités ne feront pas retour en arrière.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La proposition initiale « donec consumat fundamenta terrae » est comprise comme la fin de l’unité précédente, conformément à la segmentation du verset fournie; le présent verset conserve le parallélisme entre la flèche et les malheurs.
