source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: suas eos eicient. Tunc parebit probatio electorum meorum, ut aurum quod probatur ab igne.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/074.yaml
  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
translation:
  language: fr
  text: Alors l’épreuve de ceux que j’ai choisis se manifestera[a], comme l’or qui est éprouvé par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Alors l’authenticité de ceux que j’ai choisis se manifestera, comme celle de l’or éprouvé par le feu. » Le latin probatio peut désigner soit la mise à l’épreuve, soit l’authenticité qu’elle révèle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: probatio
  choice: l’épreuve
  rationale: Le nom latin désigne d’abord la mise à l’épreuve ou le processus de vérification. « Épreuve » conserve aussi la possibilité d’évoquer ce que cette épreuve révèle.
- source_word: electorum meorum
  choice: de ceux que j’ai choisis
  rationale: Cette formulation naturelle rend le substantif latin electorum sans introduire la connotation doctrinale plus marquée que peut avoir « mes élus ».
- source_word: parebit
  choice: se manifestera
  rationale: Le verbe signifie que quelque chose deviendra visible ou évident. « Se manifestera » convient mieux ici que le plus matériel « apparaîtra ».
- source_word: aurum quod probatur ab igne
  choice: comme l’or qui est éprouvé par le feu
  rationale: La répétition « épreuve / éprouvé » maintient le lien lexical et rhétorique entre probatio et probatur.
theological_decisions:
- issue: Probatio peut désigner soit la mise à l’épreuve, soit l’authenticité démontrée qui en résulte.
  choice: Le texte principal retient « l’épreuve », sens premier dans ce contexte de persécution.
  alternative: « la qualité éprouvée de ceux que j’ai choisis »
  rationale: La comparaison avec l’or éprouvé par le feu met directement en avant le processus d’épreuve, mais le résultat révélé par cette épreuve demeure une lecture possible et est signalé en note.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’image métallurgique et l’ambiguïté de probatio, sans préciser davantage la nature de l’épreuve ni importer une interprétation confessionnelle.
