  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : la droite puissante, l’arc tendu, les flèches aiguës envoyées par lui et leur efficacité. « Ne manqueront pas leur but » explicite de façon défendable l’image du tir, et la note indique correctement que le but n’est pas exprimé dans le latin. En revanche, « dès qu’elles commenceront à partir » affaiblit et déplace légèrement le passif répété de mitti (« être envoyées/décochées »).'
  naturalness: Le français est globalement soutenu et clair. La séquence « sa main droite, celle qui » est toutefois un peu lourde, et « commenceront à partir » est peu idiomatique pour des flèches dans ce contexte.
