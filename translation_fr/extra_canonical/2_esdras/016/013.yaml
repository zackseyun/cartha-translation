source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam fortis dextera eius quae arcum tendit : sagittae eius acutae quae ab ipso mittuntur, non deficient cum coeperint mitti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
translation:
  language: fr
  text: Car puissante est sa main droite qui tend l’arc ; ses flèches, aiguës et décochées par lui, ne manqueront pas leur but[a] quand elles commenceront à être décochées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne failliront pas » ou « ne feront pas défaut » ; le texte latin ne mentionne pas explicitement leur but.'
    reason: Préserve l’étendue de sens de « non deficient » et signale l’explicitation contextuelle introduite dans le texte.
lexical_decisions:
- source_word: dextera
  choice: main droite
  rationale: Rend explicitement le sens de « droite » comme la main ou le bras droit, tout en conservant l’image de force.
- source_word: arcum tendit
  choice: tend l’arc
  rationale: Expression française directe qui préserve précisément l’image du tir à l’arc.
- source_word: mittuntur / mitti
  choice: décochées / partir
  rationale: « Décocher » convient aux flèches et rend la première forme passive ; « partir » évite une répétition pesante dans la proposition temporelle sans modifier l’image.
- source_word: non deficient
  choice: ne manqueront pas leur but
  rationale: Dans ce contexte de tir à l’arc, exprime naturellement que les flèches ne failliront pas ou n’échoueront pas, tout en signalant en note que le but n’est pas nommé explicitement.
- source_word: cum coeperint
  choice: dès qu’elles commenceront
  rationale: Rend la valeur temporelle de « cum » et l’aspect inchoatif de « coeperint » dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, soutenu mais accessible. L’inversion initiale « puissante est sa main droite » conserve la solennité et l’accent du latin ; le vocabulaire du tir à l’arc reste concret et cohérent.
