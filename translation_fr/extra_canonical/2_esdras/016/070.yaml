    rationale: Le latin présente les personnes comme devenant, pour leurs adversaires, un objet de dérision et d’opprobre; il ne dit pas explicitement qu’elles sont « livrées ».
  - severity: low
    issue: « Insultes » affaiblit ou particularise « inproperium ».
    rationale: Dans ce registre, « opprobre » rend plus exactement le déshonneur public exprimé par le latin.
