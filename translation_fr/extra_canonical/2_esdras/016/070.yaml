  source_fidelity: Le premier membre restitue correctement le fragment latin et le sens cultuel de « idolis occisam ». Dans le second, « livrés à leurs moqueries » introduit une passivation qui n’est pas exprimée par « erint illis » (« ils seront pour eux »), tandis que « insultes » est plus étroit et moins formel que « inproperium » (« opprobre »).
  naturalness: La formulation révisée demeure naturelle en français moderne. « Donneront à manger ... de la viande » évite la nuance potentiellement coercitive de « feront manger », laquelle n’est pas portée explicitement par cibabunt.
  terminology: « Viande sacrifiée aux idoles » rend bien l’ellipse vraisemblable de carnem et évite une interprétation erronée où les personnes seraient sacrifiées. « Dérision », « opprobre » et « foulés aux pieds » conservent la gradation humiliante du latin.
