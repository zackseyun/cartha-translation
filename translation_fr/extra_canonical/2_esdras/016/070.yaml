source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quosdam ex uobis et cibabunt idolis occisam. Et qui consenserint eis, erint illis in derisum et in inproperium et in conculcationem;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/070.yaml
  text: some of you[a], and they will feed you food sacrificed to idols. And those who consent to them will be for them an object of derision and reproach and trampling underfoot.
translation:
  language: fr
  text: Ils donneront à manger à certains d’entre vous de la viande sacrifiée aux idoles. Ceux qui leur donneront leur accord seront pour eux un objet de dérision et d’opprobre, et seront foulés aux pieds.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quosdam ex uobis
  choice: certains d’entre vous
  rationale: Rend directement le partitif latin; le pronom est intégré comme complément de « feront manger » pour produire une phrase française complète.
- source_word: cibabunt idolis occisam
  choice: feront manger … de la viande sacrifiée aux idoles
  rationale: Le participe féminin « occisam » suppose vraisemblablement « carnem »; « viande sacrifiée aux idoles » exprime naturellement le sens cultuel sans suggérer que les personnes elles-mêmes seraient offertes aux idoles.
- source_word: consenserint eis
  choice: leur donneront leur accord
  rationale: Conserve l’idée explicite de consentement aux personnes désignées, sans préciser abusivement la nature de leur exigence.
- source_word: in derisum et in inproperium et in conculcationem
  choice: livrés à leurs moqueries et à leurs insultes, et foulés aux pieds
  rationale: Transforme la série nominale latine en une tournure française naturelle tout en maintenant les trois formes d’humiliation, notamment l’image concrète du piétinement.
theological_decisions:
- issue: Nature de ce qui est donné à manger
  choice: de la viande sacrifiée aux idoles
  alternative: des aliments sacrifiés aux idoles
  rationale: Le féminin singulier « occisam » s’explique le plus naturellement par l’ellipse de « carnem » et renvoie à la viande provenant de sacrifices idolâtres.
- issue: Portée du consentement
  choice: ceux qui leur donneront leur accord
  alternative: ceux qui leur céderont
  rationale: La formulation retenue reste proche de « consenserint eis » et ne décide pas si le consentement est volontaire, contraint ou seulement apparent.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe fragmentaire du début latin est régularisée sans déplacer le contenu vers le verset précédent. La fin privilégie une formulation idiomatique tout en conservant la progression dérision–opprobre–piétinement.
