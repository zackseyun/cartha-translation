source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
translation:
  language: fr
  text: 'Car il brûlera des charbons ardents sur la tête de celui qui dit : « Je n’ai pas péché devant Dieu et sa gloire. » Voici, le Seigneur le sait.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: carbones ignis
  choice: des charbons ardents
  rationale: Littéralement « des charbons de feu » ; l’expression française naturelle « charbons ardents » conserve l’image.
- source_word: conburet
  choice: il amassera
  rationale: Le latin transmis signifie normalement « il brûlera/consumera », mais avec « des charbons… sur la tête », le sens contextuel paraît être qu’un sujet implicite les fait peser ou les place sur la tête. « Amassera » rend l’action transitive sans faire des charbons le sujet, tout en signalant l’image traditionnelle.
- source_word: coram deo et gloria ipsius
  choice: devant Dieu et sa gloire
  rationale: Rendu formel qui préserve la coordination inhabituelle et sa tension interprétative.
- source_word: Ecce
  choice: Voici
  rationale: Équivalent biblique digne et courant, marquant l’insistance.
- source_word: cognoscit
  choice: sait
  rationale: Dans ce contexte, « sait » exprime naturellement la connaissance du Seigneur quant à la véracité de l’affirmation précédente.
theological_decisions:
- issue: Sujet implicite de conburet
  choice: « il », renvoyant implicitement au Seigneur/à Dieu
  alternative: 'Faire de « charbons ardents » le sujet : « des charbons ardents brûleront »'
  rationale: Conburet est à la troisième personne du singulier et carbones est morphologiquement accusatif pluriel ; le texte présente donc un sujet singulier implicite.
- issue: Rapport entre Dieu et sa gloire
  choice: Conserver « devant Dieu et sa gloire »
  alternative: Résoudre en « devant la gloire de Dieu » ou « devant Dieu dans sa gloire »
  rationale: La coordination latine est réelle et théologiquement inhabituelle ; elle ne doit pas être harmonisée sans preuve textuelle.
translation_notes:
  register: Français moderne, sobre et biblique. La syntaxe reste proche du latin, notamment dans « devant Dieu et sa gloire ». « Voici » maintient le relief rhétorique de Ecce.
