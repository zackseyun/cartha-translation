  text: Can anyone beat back a hungry lion in the forest, or quench a fire when straw has been set ablaze?
translation:
  language: fr
  text: Quelqu’un peut-il repousser un lion affamé dans la forêt, ou éteindre le feu quand la paille s’est embrasée ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: recutiet
  choice: repousser
  rationale: Rend l’idée de faire reculer ou de tenir à distance une attaque, dans un français naturel.
- source_word: leonem esurientem
  choice: un lion affamé
  rationale: Correspondance directe qui conserve la force de l’image.
- source_word: stramen
  choice: la paille
  rationale: Équivalent courant du latin, désignant une matière sèche qui s’enflamme facilement.
- source_word: incensum fuerit
  choice: s’est embrasée
  rationale: Exprime l’entrée effective de la paille en combustion, plutôt qu’une simple tentative d’allumage.
theological_decisions:
- issue: Portée des questions rhétoriques
  choice: Conserver les deux interrogations sans ajouter de réponse explicite
  alternative: Ajouter une formulation telle que « Personne ne le peut »
  rationale: Le latin fait entendre l’impossibilité par la forme rhétorique elle-même; l’expliciter réduirait la force et l’ouverture du texte.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux questions et l’intensité des images naturelles sont conservés.
