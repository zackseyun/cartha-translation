  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
translation:
  language: fr
  text: le souffle du Dieu tout-puissant, qui a tout créé et qui scrute ce qui est caché dans les lieux secrets. Certes, il connaît votre dessein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiramentum
  choice: le souffle
  rationale: Le latin désigne le souffle ou l'haleine; «souffle» est naturel en français et conserve la portée potentiellement spirituelle du terme.
- source_word: scrutatur
  choice: scrute
  rationale: Rend l'idée d'un examen profond et pénétrant, plutôt qu'une simple recherche.
- source_word: absconsa in absconsis
  choice: ce qui est caché dans les lieux secrets
  rationale: Conserve la répétition sémantique du latin tout en produisant une formulation française intelligible.
- source_word: adinuentionem uestram
  choice: votre dessein
  rationale: Le singulier est respecté; dans ce contexte, «dessein» exprime une intention élaborée, éventuellement dissimulée, sans imposer le sens plus négatif de «complot».
- source_word: Certe
  choice: Oui
  rationale: Marque avec naturel l'assurance emphatique du latin dans le français courant et digne.
theological_decisions:
- issue: Rapport syntaxique du fragment initial avec le verset précédent
  choice: Conserver le groupe nominal «le souffle du Dieu tout-puissant» sans ajouter de verbe ni de conjonction
  alternative: Ajouter «et» ou reformuler en phrase verbale complète
  rationale: Le texte latin fourni commence par «spiramentum» sans «et» et constitue syntaxiquement la continuation du contexte précédent. Ajouter une liaison absente déplacerait du matériau d'un autre verset.
translation_notes:
  register: Français moderne international, clair et digne. Le caractère fragmentaire du début, dû au découpage des versets, est préservé conformément à la source latine.
