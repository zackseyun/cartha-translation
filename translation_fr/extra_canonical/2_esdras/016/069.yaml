source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ecce enim incenditur ardor super uos turba copiosae, et rapient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/069.yaml
  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
translation:
  language: fr
  text: Car voici qu’une foule immense s’enflamme de colère contre vous. Ils saisiront certains d’entre vous et leur feront manger de la viande sacrifiée aux idoles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin est abrupt et condensé. « Viande » explicite la victime animale sous-entendue, offerte en sacrifice aux idoles.
    reason: Expliciter la construction elliptique sans attribuer aux personnes saisies le fait d’être mises à mort ou livrées aux idoles.
lexical_decisions:
- source_word: Ecce enim
  choice: Car voici
  rationale: Rend à la fois la liaison explicative de « enim » et la valeur d’appel à l’attention de « ecce ».
- source_word: incenditur ardor super uos turba copiosa
  choice: une foule immense, enflammée de colère, se soulève contre vous
  rationale: La formulation latine transmise est heurtée. Cette traduction rattache naturellement l’ardeur hostile à la foule nombreuse et conserve le sens adversatif de « super vos » sans reproduire une syntaxe française obscure.
- source_word: rapient
  choice: Ils saisiront
  rationale: Conserve la force violente du verbe latin, qui peut évoquer l’arrestation ou l’enlèvement.
- source_word: cibabunt idolis occisam
  choice: leur feront manger de la viande sacrifiée aux idoles
  rationale: D’après le contexte textuel attesté dans la tradition consultée, la chose tuée est comprise comme la viande offerte aux idoles; le causatif français exprime la contrainte exercée sur les personnes saisies.
theological_decisions:
- issue: Nature de la persécution liée au culte des idoles
  choice: Les personnes saisies sont contraintes de manger de la viande sacrifiée aux idoles.
  alternative: Elles sont tuées puis livrées en nourriture aux idoles.
  rationale: La première lecture correspond mieux à l’expression sous-jacente désignant une victime animale immolée et au contexte de contrainte idolâtre, mais le latin condensé permet une autre analyse, signalée en note.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe a été légèrement restructurée afin de rendre intelligible un latin textuellement difficile, tandis que l’autre lecture possible est conservée en note.
