review_pass:
  verdict: revise
  source_fidelity: La reformulation actuelle « se soulève » introduit l’idée d’un soulèvement et ne rend plus l’image d’un embrasement / d’une colère qui s’allume. Le texte latin transmis est syntaxiquement difficile, mais il associe l’ardeur hostile, la foule nombreuse et « contre vous ». La contrainte de consommer une victime offerte aux idoles correspond à l’audit textuel fourni.
  naturalness: « Une foule immense s’enflamme de colère contre vous » est idiomatique en français actuel, conserve l’image du feu et évite de faire de la foule un sujet qui « se soulève » sans appui explicite.
  terminology: « Viande sacrifiée aux idoles » est une désignation claire et usuelle pour la nourriture provenant d’un sacrifice idolâtre. La note ne devrait pas présenter comme une possibilité équivalente l’idée que les personnes seraient données aux idoles après leur mort, lecture que l’audit source écarte.
  issues:
