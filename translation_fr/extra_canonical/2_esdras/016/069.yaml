    issue: « se soulève » remplace l’image d’embrasement
    rationale: Le latin contient incenditur / ardor; « se soulève » ajoute une action collective distincte et atténue l’imagerie de la colère enflammée.
  - severity: medium
    issue: La note propose une lecture mortelle comme alternative textuelle
    rationale: Selon l’audit anglais fondé sur la source, occisam renvoie à la victime animale implicite, non aux personnes saisies. Il convient de signaler la condensation sans réintroduire cette analyse comme une lecture du passage.
