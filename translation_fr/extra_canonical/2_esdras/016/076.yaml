  text: Do not fear or hesitate, for God is your guide.
translation:
  language: fr
  text: N’ayez pas peur et n’hésitez pas, car Dieu est votre guide.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ne timeatis
  choice: N’ayez pas peur
  rationale: Rend naturellement en français moderne l’interdiction latine de craindre.
- source_word: nec haesitemini
  choice: et n’hésitez pas
  rationale: Le verbe latin exprime ici l’hésitation ou l’incertitude; «hésitez» préserve ce sens sans le réduire au doute intellectuel.
- source_word: quoniam
  choice: car
  rationale: Introduit clairement la raison donnée par le texte.
- source_word: dux vester
  choice: votre guide
  rationale: Dans ce contexte, «guide» exprime naturellement la fonction de celui qui conduit, sans imposer le sens plus militaire de «chef».
theological_decisions:
- issue: Rôle de Dieu désigné par «dux»
  choice: Dieu est votre guide
  alternative: Dieu est votre chef
  rationale: «Guide» conserve l’idée que Dieu conduit les destinataires et correspond au contexte d’encouragement, tout en évitant d’ajouter une nuance militaire non exigée.
translation_notes:
  register: Français international moderne, direct et digne. La coordination «et» reproduit les deux exhortations parallèles du latin; aucune note n’est nécessaire.
