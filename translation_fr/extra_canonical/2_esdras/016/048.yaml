  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
translation:
  language: fr
  text: Ceux qui font du commerce le font pour le pillage[a], tant qu’ils se parent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un butin » ; le latin peut suggérer que ce commerce est voué au pillage.'
    reason: 'L’expression latine « in rapina » est concise et permet plusieurs nuances : finalité apparente, résultat ou destination au pillage.'
  - marker: b
    text: 'Littéralement : « tant qu’ils ornent » ou « embellissent » ; le latin ne précise pas ce qui est orné.'
    reason: Le verbe « exornant » est employé sans objet exprimé ; le sens réfléchi retenu dans le texte reste interprétatif.
lexical_decisions:
- source_word: negociantur
  choice: font du commerce
  rationale: Rend le verbe latin par une expression française courante et suffisamment large, sans le limiter à l’achat ou à la vente.
- source_word: in rapina
  choice: pour le pillage
  rationale: 'Conserve la formulation concise et ambiguë du latin : l’expression peut évoquer le pillage comme résultat ou destination des biens, sans ajouter explicitement une construction passive absente du texte.'
- source_word: quamdiu
  choice: tant que
  rationale: Correspond directement à la valeur temporelle usuelle de la locution latine.
- source_word: exornant
  choice: se parent
  rationale: Donne un sens naturel en français à l’emploi absolu du verbe, tout en signalant en note que le latin n’exprime pas le pronom réfléchi ni l’objet.
theological_decisions:
- issue: Sens de « in rapina »
  choice: pour le pillage
  alternative: pour être pillés / comme un butin
  rationale: Le contexte peut suggérer que l’activité commerciale et ses biens sont voués au pillage, mais le latin ne formule pas explicitement cette idée au passif. La traduction principale préserve cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La répétition latine de « negociantur » est légèrement allégée par « le font » afin d’éviter une lourdeur, tandis que les ambiguïtés de « in rapina » et de l’objet absent de « exornant » sont conservées ou signalées en notes.
