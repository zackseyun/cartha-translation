revisions:
- from: 'Le Seigneur dit : « Voici, les malheurs approchent et ne tarderont pas. Il en est comme d’une femme enceinte de neuf mois : lorsque l’heure de son accouchement approche, pendant deux ou trois heures, des douleurs intenses lui étreignent le ventre ; et quand l’enfant sort du ventre, il ne tarde pas. »'
  to: 'Le Seigneur dit : « Voici, les malheurs approchent et ne tarderont pas. Il en est comme d’une femme enceinte, à son neuvième mois : lorsque l’heure de son accouchement approche, deux ou trois heures avant celui-ci, des douleurs qui font gémir lui étreignent le ventre ; et, quand l’enfant sort du ventre, il ne tarde pas. »'
  rationale: La révision corrige la portée temporelle de ante (« avant », non « pendant »), rend plus précisément gementes, et conserve l’ambiguïté syntaxique finale du texte latin telle qu’elle est suivie dans l’audit anglais, sans introduire d’interprétation doctrinale.
