  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: fr
  text: 'Le Seigneur dit : « Voici, les malheurs approchent et ne tarderont pas. Il en est comme d’une femme enceinte, à son neuvième mois : lorsque l’heure de son accouchement approche, deux ou trois heures avant celui-ci, des douleurs qui font gémir lui étreignent le ventre ; et, quand l’enfant sort du ventre, il ne tarde pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: les malheurs
  rationale: Dans ce contexte d’annonce de calamités, « malheurs » rend naturellement le pluriel latin sans lui donner une portée exclusivement morale.
- source_word: non tardantur
  choice: ne tarderont pas
  rationale: Le présent latin exprime l’imminence certaine ; le futur français s’accorde naturellement avec l’annonce de ce qui approche.
- source_word: gementes dolores
  choice: des douleurs intenses
  rationale: L’expression latine évoque de violentes douleurs qui font gémir ; « douleurs intenses » transmet clairement cette force sans personnifier artificiellement les douleurs.
- source_word: circum uentrem eius
  choice: lui étreignent le ventre
  rationale: Cette formulation française conserve l’image de douleurs qui entourent ou saisissent le ventre, avec une expression naturelle.
- source_word: non tardabit
  choice: il ne tarde pas
  rationale: Le sujet grammatical le plus proche est l’enfant ; la traduction préserve cette construction et l’idée d’une venue désormais immédiate.
theological_decisions:
- issue: Nature de « mala »
  choice: les malheurs
  alternative: les maux
  rationale: « Malheurs » indique ici des calamités imminentes tout en évitant de réduire le terme au mal moral.
- issue: Sujet de la parole introductive
  choice: Le Seigneur dit
  alternative: 'le Seigneur :'
  rationale: Le latin conservé présente « dominus » comme attribution de parole ; l’ajout minimal de « dit » rend la syntaxe française complète sans développer l’interprétation.
- issue: Référent final de « non tardabit »
  choice: il ne tarde pas, en référence à l’enfant
  alternative: l’accouchement ne tarde pas
  rationale: Le masculin singulier latin suit immédiatement « infante » ; conserver ce référent respecte au mieux la syntaxe, malgré une légère tension idiomatique.
translation_notes:
  register: Français international moderne, clair et digne. La comparaison obstétricale, sa progression temporelle et la répétition de l’idée de ne pas tarder sont conservées. Aucun marqueur de note n’est nécessaire.
