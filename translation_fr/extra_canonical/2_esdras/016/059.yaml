lexical_decisions:
- source_word: super aquam
  choice: au-dessus de l’eau
  rationale: Respecte le singulier latin « aquam » et rend naturellement la relation spatiale exprimée par « super ».
- source_word: uerbo suo
  choice: par sa parole
  rationale: Rend l’instrument ou le moyen exprimé par l’ablatif latin, tout en conservant l’idée de puissance créatrice de la parole.
- source_word: extendit
  choice: a déployé
  rationale: Évoque l’action d’étendre largement le ciel dans un français naturel et soutenu.
- source_word: caelum quasi cameram
  choice: le ciel comme une voûte
  rationale: « Voûte » restitue ici l’image architecturale de « camera » plus naturellement que « chambre ».
theological_decisions:
- issue: Continuité syntaxique du pronom relatif « Qui »
  choice: lui qui
  alternative: Celui qui
  rationale: « Lui qui » maintient explicitement la relative hymnique rattachée au Seigneur mentionné dans le contexte antérieur, sans transformer le fragment en proposition indépendante.
- issue: Rapport entre la parole divine et la suspension de la terre
  choice: par sa parole, a suspendu
  alternative: a suspendu la terre au-dessus de l’eau par sa parole
  rationale: La proximité de « par sa parole » avec le verbe conserve son rôle instrumental sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et poétique. Le fragment conserve la syntaxe doxologique continue du contexte et se termine par un point-virgule.
