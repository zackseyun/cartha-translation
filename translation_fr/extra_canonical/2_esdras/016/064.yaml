  text: Malheur à ceux qui pèchent et veulent cacher leurs péchés !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uae
  choice: Malheur à
  rationale: Formule française naturelle et solennelle correspondant à l’interjection latine de lamentation et de condamnation.
- source_word: peccantibus
  choice: ceux qui pèchent
  rationale: Rend directement le participe substantivé latin sans ajouter de qualification.
- source_word: uolentibus occultare
  choice: veulent cacher
  rationale: Exprime simplement la volonté indiquée par le latin et emploie un verbe courant pour l’action de dissimuler.
- source_word: peccata sua
  choice: leurs péchés
  rationale: Conserve le pluriel et la valeur réfléchie de sua.
theological_decisions:
- issue: Portée de la condamnation
  choice: La phrase vise ceux qui pèchent et veulent cacher leurs propres péchés.
  alternative: Formuler une condamnation générale de tous les pécheurs.
  rationale: La coordination latine unit peccantibus et uolentibus occultare, sans autoriser à élargir ou à restreindre davantage la portée.
translation_notes:
  register: Français moderne, clair et digne. La traduction suit uniquement la phrase correspondant au verset fourni; les fragments latin précédent et suivant appartiennent au contexte adjacent.
