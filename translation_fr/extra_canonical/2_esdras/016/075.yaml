source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite, electi mei, dicit dominus, ecce adsunt dies tribulationis, et de his liberabo uos. Ne timeatis nec haesitemini,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/075.yaml
  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: fr
  text: 'Écoutez, vous que j’ai choisis, dit le Seigneur : voici que les jours de détresse sont là, et je vous en délivrerai. N’ayez pas peur et n’hésitez pas,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electi mei
  choice: vous que j’ai choisis
  rationale: Rend naturellement l’adresse directe et la relation exprimée par le possessif latin, sans recourir au substantif plus marqué « mes élus ».
- source_word: adsunt
  choice: sont là
  rationale: Exprime la présence actuelle des jours annoncés, plutôt qu’une simple proximité future.
- source_word: tribulationis
  choice: de détresse
  rationale: « Détresse » est actuel, digne et accessible, tout en conservant l’idée d’épreuve accablante.
- source_word: de his liberabo uos
  choice: je vous en délivrerai
  rationale: Le pronom « en » renvoie aux jours de détresse et conserve la promesse de délivrance sans préciser indûment sa modalité.
- source_word: haesitemini
  choice: ne vous laissez pas troubler
  rationale: Dans ce contexte d’exhortation face à la détresse, cette formulation rend l’idée de perdre son assurance ou de chanceler intérieurement, en français naturel.
theological_decisions:
- issue: Portée de la délivrance promise
  choice: Conserver la formulation générale « je vous en délivrerai »
  alternative: Préciser une délivrance hors des épreuves ou à travers elles
  rationale: Le latin ne précise ni le moment ni le mode de la délivrance; la traduction préserve donc cette ouverture.
- issue: Désignation des destinataires
  choice: « vous que j’ai choisis »
  alternative: « mes élus »
  rationale: Les deux rendent electi mei, mais la formulation retenue évite les connotations doctrinales techniques que peut porter « élus » tout en maintenant clairement l’initiative divine.
translation_notes:
  register: Français international moderne, direct et solennel. L’impératif pluriel et le futur maintiennent le ton d’oracle et d’encouragement. La virgule finale est conservée puisque le verset se poursuit syntaxiquement.
