  text: la justice régnera sur nous. Que le pécheur ne dise pas qu’il n’a pas péché,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iusticia
  choice: la justice
  rationale: Équivalent naturel et direct du latin « iusticia », sans préciser davantage la nature de cette justice.
- source_word: regnabit
  choice: régnera
  rationale: Conserve l’image forte du règne exprimée par le futur latin.
- source_word: in nos
  choice: parmi nous
  rationale: Rend ici naturellement la présence et l’exercice du règne de la justice au sein du groupe; « sur nous » resterait possible mais sonnerait plus contraignant en français.
- source_word: Non dicat
  choice: Que … ne dise pas
  rationale: Rend fidèlement le subjonctif jussif latin par une défense à la troisième personne.
- source_word: peccator
  choice: le pécheur
  rationale: Correspondance formelle et théologiquement non restrictive.
- source_word: non se peccasse
  choice: qu’il n’a pas péché
  rationale: Rend l’infinitive latine et l’antériorité de « peccasse » dans un français courant.
theological_decisions:
- issue: Portée du règne de la justice
  choice: « parmi nous »
  alternative: « sur nous »
  rationale: Le latin « in nos » permet une nuance directionnelle ou relationnelle. « Parmi nous » préserve l’idée que la justice règne dans la communauté sans suggérer à tort qu’elle exercerait nécessairement une domination punitive sur elle.
translation_notes:
  register: Français moderne, sobre et digne. La minuscule initiale et la virgule finale sont conservées parce que l’extrait commence et se termine au milieu du contexte continu du passage.
