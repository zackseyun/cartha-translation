  source_fidelity: La traduction rend correctement l'image dégradante de quasi stercora et les futurs passifs proicientur et demolientur. Toutefois, « rester[a] déserte » ne rend pas explicitement le passif derelinquetur (« sera abandonnée/laissée »). Le présent latin non habent est préférable en français également, même au sein de cette séquence prophétique.
