  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
translation:
  language: fr
  text: Les morts seront jetés comme du fumier, et ils n’ont personne pour les consoler. La terre sera abandonnée, déserte, et ses villes seront démolies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortui
  choice: les morts
  rationale: Rend directement le substantif latin désignant les personnes mortes.
- source_word: quasi stercora
  choice: comme du fumier
  rationale: Conserve l’image crue et dégradante du latin; « fumier » est naturel en français et correspond bien à stercora dans ce contexte.
- source_word: proicientur
  choice: seront jetés dehors
  rationale: Le futur passif est conservé; « jeter dehors » exprime la mise au rebut impliquée par proicere.
- source_word: non habent qui consolentur eos
  choice: ils n’auront personne pour les consoler
  rationale: Le sujet pluriel reste « les morts ». Le futur français s’accorde naturellement avec la série prophétique, bien que le latin emploie formellement le présent habent.
- source_word: derelinquetur deserta terra
  choice: la terre restera déserte
  rationale: Formulation française naturelle qui restitue l’état d’abandon et de désolation exprimé par le passif et l’attribut latin.
- source_word: civitates eius demolientur
  choice: ses villes seront démolies
  rationale: Reproduit le futur passif et le sens précis de demoliri sans atténuer la destruction.
