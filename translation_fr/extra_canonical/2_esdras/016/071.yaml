  text: For there will be much uprising in place after place and in the neighboring cities.
translation:
  language: fr
  text: Car il y aura, de lieu en lieu et dans les villes voisines, de nombreux soulèvements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Erit
  choice: il y aura
  rationale: Rend naturellement en français le futur du verbe latin esse.
- source_word: locis locus
  choice: de lieu en lieu
  rationale: Le texte latin transmis paraît irrégulier; cette formulation suit le sens distributif retenu par le texte de consultation sans prétendre corriger davantage la leçon.
- source_word: in uicinas ciuitates
  choice: dans les villes voisines
  rationale: Rend la localisation exprimée par in avec l’accusatif dans ce latin tardif; «villes voisines» traduit directement uicinas ciuitates.
- source_word: exsurrectio multa
  choice: de nombreux soulèvements
  rationale: Exsurrectio désigne ici une levée ou une agitation insurrectionnelle. Le pluriel français exprime idiomatiquement multa tout en convenant à la pluralité des lieux.
