  yaml_path: translation/extra_canonical/2_esdras/016/021.yaml
  text: Yet in all these things they will not turn from their iniquities, nor will they always remember the scourges.
translation:
  language: fr
  text: Et dans tout cela, ils ne se détourneront pas de leurs injustices et ne garderont pas toujours le souvenir des fléaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in his omnibus
  choice: au milieu de tout cela
  rationale: Rend la valeur circonstancielle de l’expression latine (« dans toutes ces choses ») en français naturel, sans lui donner artificiellement un sens causal.
- source_word: se non conuertent ab iniquitatibus suis
  choice: ils ne se détourneront pas de leurs injustices
  rationale: « Se détourner de » exprime directement le mouvement de conversion indiqué par conuertere ab, tandis que « injustices » conserve le pluriel concret de iniquitatibus.
- source_word: flagellorum
  choice: des fléaux
  rationale: Conserve l’image forte des coups ou calamités disciplinaires, ainsi que la cohérence avec le contexte immédiat.
- source_word: memores erunt semper
  choice: ne garderont pas toujours le souvenir
  rationale: 'Respecte la portée ordinaire de la négation sur semper : ils n’en conserveront pas constamment la mémoire, plutôt que d’affirmer sans ambiguïté qu’ils ne s’en souviendront jamais.'
theological_decisions:
- issue: Nature du refus de conversion
  choice: ne se détourneront pas de leurs injustices
  alternative: ne se repentiront pas de leurs fautes
  rationale: La formulation retenue reste proche de l’image verbale du texte latin et n’importe pas une terminologie confessionnelle plus spécialisée.
translation_notes:
  register: Français moderne, sobre et dignifié. La coordination et la répétition de la négation conservent le ton prophétique du passage.
