  yaml_path: translation/extra_canonical/2_esdras/016/037.yaml
  text: 'Behold, the word of the Lord: receive it; do not disbelieve what the Lord says.'
translation:
  language: fr
  text: 'Voici la parole du Seigneur : accueillez-la ; ne refusez pas de croire ce que dit le Seigneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Voici
  rationale: Rend naturellement la formule de présentation et d’appel à l’attention.
- source_word: verbum Domini
  choice: la parole du Seigneur
  rationale: Expression française consacrée et fidèle au latin.
- source_word: excipite eum
  choice: accueillez-la
  rationale: « Accueillir » exprime ici la réception favorable de la parole ; le pronom français s’accorde naturellement avec « parole », malgré le masculin latin inattendu « eum ».
- source_word: ne discredatis
  choice: ne refusez pas de croire
  rationale: Formulation moderne qui conserve la force de l’interdiction et l’idée de ne pas tenir le message pour faux.
- source_word: de quibus dicit Dominus
  choice: ce que dit le Seigneur
  rationale: Rend en français naturel la construction latine elliptique sans lui imposer un objet plus précis que le texte n’en donne.
theological_decisions:
- issue: Référent de « eum » après « verbum »
  choice: 'Le pronom renvoie à « la parole » : « accueillez-la »'
  alternative: 'Personnaliser la Parole : « accueillez-le »'
  rationale: Le contexte commande de recevoir le message annoncé. Le masculin latin est grammaticalement irrégulier après le neutre « verbum » et ne suffit pas à établir une personnification théologique.
translation_notes:
  register: Français international moderne, digne et direct. Le rythme exhortatif du verset est conservé au moyen de deux impératifs coordonnés.
