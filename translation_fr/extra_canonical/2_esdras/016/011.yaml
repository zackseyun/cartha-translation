lexical_decisions:
- source_word: tonabit
  choice: Il tonnera
  rationale: Rend directement le futur latin et conserve le sujet masculin implicite, sans ajouter de précision absente du texte.
- source_word: horrebit
  choice: tremblera
  rationale: Dans ce contexte de crainte devant le tonnerre, « trembler » exprime naturellement la réaction indiquée par le latin.
- source_word: Dominus
  choice: Le Seigneur
  rationale: Équivalent français traditionnel, clair et non confessionnel du titre latin.
- source_word: comminabitur
  choice: menacera
  rationale: Traduction directe du verbe latin, qui évoque la formulation ou l’annonce d’une menace.
theological_decisions:
- issue: Sujet implicite de « tonabit »
  choice: Conserver le pronom « Il » sans identifier davantage son référent
  alternative: Répéter « Le Seigneur tonnera »
  rationale: Le latin ne nomme pas explicitement le sujet dans cette première proposition ; la traduction préserve donc cette légère ambiguïté.
- issue: Fin syntaxiquement inachevée
  choice: Conserver « et qui… »
  alternative: Compléter la question à partir du contexte ou d’une autre tradition textuelle
  rationale: Le témoin source fourni s’interrompt après « et quis » ; aucune suite ne doit être ajoutée sans appui textuel.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme rhétorique du latin est conservé, ainsi que l’interruption finale du texte source.
