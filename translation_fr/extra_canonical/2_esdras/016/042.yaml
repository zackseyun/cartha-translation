lexical_decisions:
- source_word: sic
  choice: Ainsi
  rationale: Rend le lien logique avec l’exhortation précédente sans ajouter de contenu.
- source_word: aduenae terrae
  choice: des étrangers dans le pays
  rationale: Le latin désigne des personnes qui résident dans un pays sans y être chez elles ; cette formulation française reste naturelle tout en conservant l’idée de détachement.
- source_word: Qui uendit
  choice: celui qui vend
  rationale: Traduction directe de la proposition nominale latine.
- source_word: quasi qui fugiet
  choice: comme quelqu’un qui va fuir
  rationale: Conserve la comparaison et la valeur future de fugiet dans un français courant.
theological_decisions:
- issue: Formulation elliptique de la seconde exhortation
  choice: 'Conserver l’ellipse : « celui qui vend, comme quelqu’un qui va fuir »'
  alternative: Expliciter par « que celui qui vend soit comme quelqu’un qui va fuir »
  rationale: L’ellipse est intelligible en français et reflète la structure concise du latin sans imposer un verbe absent.
translation_notes:
  register: Français moderne, sobre et exhortatif. La ponctuation finale conserve le caractère continu de la série d’exhortations du passage.
