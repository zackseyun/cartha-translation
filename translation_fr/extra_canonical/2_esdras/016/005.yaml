  text: Des malheurs vous ont été envoyés, et qui donc pourra les repousser ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: des malheurs
  rationale: Le pluriel neutre latin désigne ici des calamités qui frappent les destinataires ; « malheurs » est naturel et concret en français.
- source_word: uobis
  choice: contre vous
  rationale: Avec l’idée d’envoi attestée par le contexte transmis, cette formulation exprime que les calamités sont dirigées vers les destinataires.
- source_word: repellat ea
  choice: pourra les repousser
  rationale: « Repousser » conserve l’image d’une menace que personne ne peut écarter ; le futur rend naturellement en français la portée rhétorique du subjonctif latin.
theological_decisions:
- issue: Portée de la question rhétorique
  choice: « qui donc pourra les repousser ? »
  alternative: « qui est là pour les repousser ? »
  rationale: La formulation retenue exprime l’impuissance humaine suggérée par le latin sans identifier explicitement l’agent des malheurs ni ajouter une conclusion théologique.
translation_notes:
  register: Français moderne, clair et digne. « Qui donc » marque naturellement la force rhétorique de la question, sans alourdir la phrase.
