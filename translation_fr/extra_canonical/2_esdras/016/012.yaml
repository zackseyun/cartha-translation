  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
translation:
  language: fr
  text: La terre ne sera-t-elle pas entièrement broyée devant lui ? La terre a tremblé, ainsi que ses fondations ; la mer s’agite depuis les profondeurs, et ses vagues ainsi que ses poissons seront bouleversés devant le Seigneur et devant la gloire de sa puissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: funditus conteretur
  choice: sera entièrement broyée
  rationale: « Funditus » exprime une destruction complète, et « conteretur » un écrasement ou broyage au futur passif.
- source_word: Terra tremuit et fundamenta eius
  choice: La terre tremble, jusque dans ses fondations
  rationale: La formulation française rend naturellement l’idée que le tremblement atteint aussi les fondations de la terre, tout en signalant en note la forme passée du latin.
- source_word: mare fluctuatur de profundo
  choice: la mer s’agite depuis ses profondeurs
  rationale: Cette expression restitue le mouvement violent de la mer qui prend naissance dans l’abîme ou les profondeurs.
- source_word: disturbabuntur
  choice: seront bouleversés
  rationale: Le futur passif est conservé et le verbe convient à la fois aux vagues mises en désordre et aux poissons terrifiés ou agités.
- source_word: gloria uirtutis eius
  choice: la gloire de sa puissance
  rationale: « Virtus » désigne ici la puissance ou la force divine, tandis que « gloria » est rendu directement par « gloire ».
theological_decisions:
- issue: Portée de « disturbabuntur »
  choice: Le futur passif régit à la fois les vagues et les poissons.
  alternative: Limiter « seront bouleversées » aux vagues et comprendre les poissons comme un élément détaché.
  rationale: La coordination latine « et fluctus eius disturbabuntur et pisces eius » permet naturellement de rattacher les deux sujets au même verbe, conformément à la syntaxe et au mouvement de la phrase.
- issue: Référent implicite de la question initiale
  choice: Expliciter « la terre » comme sujet.
  alternative: Traduire seulement « Ne sera-t-elle pas… ? »
  rationale: Le sujet se déduit de la phrase suivante ; son explicitation évite en français une référence obscure sans résoudre une ambiguïté théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation maintient l’élan apocalyptique ; « jusque dans ses fondations » évite une coordination maladroite tout en conservant l’étendue du tremblement.
