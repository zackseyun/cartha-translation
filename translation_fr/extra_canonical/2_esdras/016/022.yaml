id: 2ES.16.22
reference: 2 Esdras 16:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce erit annonae vilitas in brevi super terram, ut putent sibi esse directam pacem. tunc superflorescent mala super terram, gladius et famis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
translation:
  language: fr
  text: 'Voici[a] : bientôt, le prix des céréales sera bas sur la terre, si bien que les gens penseront que la paix leur est assurée[b]. Alors les malheurs foisonneront sur la terre : l’épée et la famine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tradition latine de ce chapitre contient, autour des versets 22 à 35, un bloc de texte répété. La présente traduction suit une seule fois la séquence la plus complète, sans répéter les mêmes jugements.
    reason: compositional_layer
  - marker: b
    text: 'Autre traduction possible : « ils penseront que la paix a été rétablie pour eux ». Une forme antérieure du passage ajoute ensuite « et une grande confusion », mots qui ne figurent pas dans le texte latin retenu ici.'
    reason: previous_rendering
lexical_decisions:
- source_word: annonae vilitas
  choice: le prix des céréales sera bas
  rationale: Cette formulation rend naturellement l’idée d’une baisse du prix des denrées céréalières, sans l’expression peu idiomatique « bon marché des céréales ».
- source_word: in brevi
  choice: bientôt
  rationale: Le complément temporel annonce que cette situation surviendra sous peu.
- source_word: directam pacem
  choice: la paix leur est assurée
  rationale: Le latin est inhabituel; cette traduction naturelle exprime une paix que les gens croient désormais établie et garantie, sans lever entièrement la tension du contexte.
- source_word: superflorescent mala
  choice: les malheurs foisonneront
  rationale: « Foisonneront » conserve l’image vigoureuse de maux qui fleurissent ou prolifèrent soudainement.
- source_word: gladius et famis
  choice: l’épée et la famine
  rationale: « L’épée » est l’image biblique traditionnelle de la guerre ou de la violence armée; le texte source ne nomme ici que ces deux fléaux.
theological_decisions:
- issue: La paix apparente avant les jugements
  choice: les gens penseront que la paix leur est assurée
  alternative: ils penseront qu’une paix véritable leur a été accordée
  rationale: Le texte présente cette sécurité comme leur perception, non comme une affirmation divine de paix réelle; la traduction préserve donc l’ironie et la tension prophétiques.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » garde la force de l’interjection prophétique; « le prix des céréales sera bas » évite une tournure artificielle, tandis que « foisonneront » préserve l’image saisissante du latin.
