  text: and the one who buys, like one who is about to lose; and the one who trades, like one who will gain no profit;
translation:
  language: fr
  text: et celui qui achète, comme s’il allait perdre ; et celui qui fait du commerce, comme s’il ne devait en tirer aucun profit ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emit
  choice: achète
  rationale: Rend directement le verbe latin « emere » dans ce contexte commercial.
- source_word: quasi qui perditurus
  choice: comme s’il allait perdre ce qu’il a acheté
  rationale: Le latin laisse l’objet de « perdre » implicite. Le français l’explicite au minimum pour former une phrase naturelle, sans préciser la nature exacte de la perte.
- source_word: mercatur
  choice: fait du commerce
  rationale: Exprime l’activité commerciale indiquée par le déponent latin « mercari », plutôt qu’un simple achat isolé.
- source_word: quasi qui [non lucretur]
  choice: comme s’il ne devait en tirer aucun profit
  rationale: Suit la continuation reflétée par la couche anglaise auditée ; le texte latin fourni est matériellement interrompu après « quasi qui ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux propositions et leur valeur comparative sont conservés. Le point-virgule final signale que le verset s’inscrit dans une série continue d’exhortations.
