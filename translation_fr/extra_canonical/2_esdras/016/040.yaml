  yaml_path: translation/extra_canonical/2_esdras/016/040.yaml
  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: fr
  text: De même, les malheurs ne tarderont pas à paraître sur la terre, et le monde gémira, et les douleurs l’entoureront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: les malheurs
  rationale: Dans ce contexte apocalyptique, « malheurs » exprime naturellement des calamités qui surviennent, sans réduire le terme aux seuls maux moraux.
- source_word: ad prodiendum super terram
  choice: à fondre sur la terre
  rationale: Cette tournure française dynamique rend l’idée de surgir et de s’abattre sur la terre, tout en évitant le calque peu naturel « sortir sur la terre ».
- source_word: saeculum
  choice: le monde présent
  rationale: Le latin peut désigner l’âge ou l’ordre du monde actuel. « Le monde présent » conserve ici la portée cosmique et temporelle tout en restant intelligible.
- source_word: circumtenent
  choice: l’enserreront
  rationale: « Enserrer » traduit l’idée de tenir ou d’étreindre tout autour et garde l’image forte du latin.
theological_decisions:
- issue: Sens de saeculum
  choice: le monde présent
  alternative: l’âge présent / le siècle
  rationale: Le choix ne tranche pas en faveur d’une chronologie doctrinale précise ; il désigne l’ordre actuel du monde appelé à souffrir, alors que « siècle » serait ambigu ou vieilli en français moderne.
translation_notes:
  register: Français moderne, digne et accessible, avec une légère intensité prophétique. La coordination et le futur du texte latin sont conservés ; le point-virgule clarifie la progression de l’annonce.
