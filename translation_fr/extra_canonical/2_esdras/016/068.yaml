  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
translation:
  language: fr
  text: 'Voici : Dieu est juge ; craignez-le. Cessez de pécher et oubliez vos actes iniques, pour ne plus jamais les commettre[a] ; et Dieu vous fera sortir et vous délivrera de toute détresse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin est syntaxiquement difficile ; littéralement, il enjoint d’« oublier vos iniquités » et de ne plus les accomplir « pour toujours ».
    reason: Signale la tournure heurtée et la portée définitive de sempiterno sans imposer une analyse syntaxique unique.
lexical_decisions:
- source_word: Ecce
  choice: Voici
  rationale: Rend directement la particule de présentation et d’insistance latine.
- source_word: iudex
  choice: juge
  rationale: 'Conserve le prédicat nominal simple : Dieu est celui qui juge.'
- source_word: desinite a peccatis uestris
  choice: Cessez de pécher
  rationale: Expression française naturelle qui restitue l’ordre de mettre fin à ses péchés, sans suggérer qu’il suffit de s’en éloigner extérieurement.
- source_word: obliuiscimini iniquitates uestras
  choice: oubliez vos actes iniques
  rationale: « Actes iniques » explicite ici le sens concret des iniquitates que les destinataires ne doivent plus commettre.
- source_word: educabit uos
  choice: vous fera sortir
  rationale: Le contexte exige le sens de conduire hors d’une situation pénible, et non le sens français moderne d’« éduquer ».
- source_word: tribulatione
  choice: détresse
  rationale: Terme courant et digne qui couvre l’épreuve, l’affliction et l’oppression.
theological_decisions:
- issue: Lien entre l’abandon du péché et la délivrance divine
  choice: Conserver la succession exhortation-promesse avec « Alors »
  alternative: Employer simplement « et », comme dans le latin
  rationale: « Alors » rend clairement la progression du passage sans définir de manière doctrinale précise la causalité entre repentance et délivrance.
- issue: Portée temporelle de iam… sempiterno
  choice: « ne plus jamais »
  alternative: « pour toujours ne plus les commettre »
  rationale: Cette formulation française naturelle maintient la portée définitive de l’exhortation sans atténuer son exigence.
translation_notes:
  register: Français international moderne, direct et solennel. Les impératifs restent nets, tandis que la phrase finale exprime la promesse dans une formulation accessible.
