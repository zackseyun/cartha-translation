  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
translation:
  language: fr
  text: Ils peinent ; en effet, des étrangers récolteront leurs fruits, pilleront leurs biens, détruiront leurs maisons et emmèneront leurs enfants en captivité, car c’est dans la captivité et la famine qu’ils mettent leurs enfants au monde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborant
  choice: Ils peinent
  rationale: Conserve le présent latin et exprime naturellement l’idée de travail pénible ou d’effort, sans ajouter un objet absent du texte.
- source_word: alienigenae
  choice: des étrangers
  rationale: Équivalent français courant et digne pour ceux qui sont d’un autre peuple ou pays.
- source_word: substantiam
  choice: leurs biens
  rationale: Dans ce contexte de pillage, le terme désigne les possessions ou ressources matérielles plutôt que la « substance » au sens abstrait.
- source_word: domus euertent
  choice: détruiront leurs maisons
  rationale: Avec des maisons pour complément, evertere signifie renverser, ruiner ou détruire ; « détruire » est naturel en français et rend clairement le résultat.
- source_word: filios eorum captiuabunt
  choice: emmèneront leurs enfants en captivité
  rationale: Rend le verbe latin de capture sans suggérer seulement une détention momentanée ; filios peut désigner ici les enfants ou descendants.
- source_word: generant natos suos
  choice: ils mettent leurs enfants au monde
  rationale: Expression française naturelle pour l’engendrement et la naissance des enfants, tout en conservant le présent du latin.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et prophétique. La succession des verbes au futur est conservée, de même que les présents encadrant l’annonce. « En effet » rend enim sans forcer une opposition que le latin n’énonce pas explicitement.
