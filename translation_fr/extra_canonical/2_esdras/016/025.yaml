  rationale: Le latin désigne explicitement une personne qui cultive la terre; « cultivateur » conserve cette précision sans généraliser en « personne ».
- source_word: non derelinquetur
  choice: il ne restera aucun
  rationale: Cette tournure française exprime naturellement l’idée qu’aucun cultivateur ne subsistera ou ne sera encore disponible, plutôt que le calque ambigu « ne sera laissé ».
- source_word: colit terram et seminat eam
