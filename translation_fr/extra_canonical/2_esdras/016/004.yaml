  text: Fire has been sent upon you, and who is there to quench it?
translation:
  language: fr
  text: 'Le feu vous est envoyé : qui pourra l’éteindre ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uobis
  choice: sur vous
  rationale: Le datif indique les destinataires frappés par le feu; « sur vous » rend naturellement cette menace en français.
- source_word: ignis
  choice: le feu
  rationale: Le latin ne porte pas d’article; en français, l’article défini donne ici une formulation naturelle et solennelle sans introduire l’idée d’un feu particulier absente du texte.
- source_word: quis est qui extinguat illum?
  choice: qui pourra l’éteindre ?
  rationale: La question rhétorique exprime l’absence de personne capable d’éteindre le feu. « pourra » restitue idiomatiquement la valeur potentielle du subjonctif latin extinguat.
theological_decisions:
- issue: Portée de la question rhétorique
  choice: 'Conserver une question ouverte dans sa forme : « qui pourra l’éteindre ? »'
  alternative: « personne ne pourra l’éteindre »
  rationale: La formulation interrogative du latin est maintenue afin de préserver sa force rhétorique sans expliciter davantage la conclusion implicite.
translation_notes:
  register: Français moderne, direct et digne. La phrase nominale menaçante suivie de la question rhétorique conserve la concision du latin. Le fragment « Inmissa sunt » appartient vraisemblablement à la phrase suivante et n’est donc pas intégré à ce verset, conformément à la délimitation attestée par la couche anglaise auditée.
