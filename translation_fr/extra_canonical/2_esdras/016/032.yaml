  yaml_path: translation/extra_canonical/2_esdras/016/032.yaml
  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: fr
  text: Ainsi, en ces jours-là, il ne restera que trois ou quatre de ceux qui fouilleront leurs maisons, l’épée à la main.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trois ou quatre seront laissés par ceux qui fouilleront leurs maisons avec l’épée ». Le latin permet aussi de comprendre que les fouilleurs épargneront ce petit nombre.'
    reason: Préserver l’ambiguïté de « ab scrutantibus », qui peut marquer la provenance ou l’agent.
lexical_decisions:
- source_word: remanebunt
  choice: il ne restera que
  rationale: Rend l’idée de survivance d’un très petit nombre dans un français naturel; « ne… que » explicite la restriction impliquée par « trois ou quatre » sans en changer le sens.
- source_word: ab scrutantibus
  choice: de ceux qui fouilleront
  rationale: Conserve la valeur de provenance ou de prélèvement possible de « ab » avec l’ablatif, conformément à la lecture retenue par la couche anglaise, tout en signalant en note l’autre analyse grammaticale.
- source_word: domos eorum
  choice: leurs maisons
  rationale: Reproduit simplement le possessif latin, dont le référent dépend du contexte.
- source_word: in romphea
  choice: l’épée à la main
  rationale: Expression française naturelle pour décrire des hommes qui fouillent des maisons en étant armés d’une épée; elle conserve la valeur instrumentale ou circonstancielle de la locution latine.
theological_decisions:
- issue: Rapport entre les survivants et ceux qui fouillent les maisons
  choice: Les trois ou quatre sont présentés comme restant « de ceux qui fouilleront » les maisons.
  alternative: « Trois ou quatre seront laissés par ceux qui fouilleront leurs maisons avec l’épée. »
  rationale: Le latin « ab scrutantibus » peut indiquer soit le groupe dont subsiste un reste, soit l’agent qui laisse les survivants. Le texte principal suit la lecture de provenance retenue dans la révision anglaise, tandis que la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français moderne, sobre et apocalyptique. « Fouilleront leurs maisons » reste proche du latin; « l’épée à la main » évite la tournure moins idiomatique « avec l’épée » tout en maintenant l’image de violence armée.
