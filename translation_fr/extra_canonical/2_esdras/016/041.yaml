source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite uerbum, plebs mea, parate uos in pugnam et in malis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/041.yaml
  text: 'Hear the word, my people: prepare yourselves for battle, and in the midst of evils be like strangers on the earth.'
translation:
  language: fr
  text: 'Écoutez la parole, mon peuple : préparez-vous au combat et, dans les malheurs, soyez comme des étrangers sur la terre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni s’interrompt après « dans les malheurs » ; la proposition finale suit la lecture plus complète reflétée dans la couche anglaise consultative.
    reason: Signaler que la dernière proposition ne figure pas dans l’extrait latin transmis, qui s’achève de manière syntaxiquement incomplète.
lexical_decisions:
- source_word: Audite
  choice: Écoutez
  rationale: L’impératif latin est au pluriel; le pluriel français conserve l’adresse collective faite aux membres du peuple.
- source_word: uerbum
  choice: la parole
  rationale: « Parole » rend naturellement verbum dans ce contexte solennel sans ajouter un possessif absent du latin fourni.
- source_word: plebs mea
  choice: mon peuple
  rationale: Cette formulation directe et courante restitue l’apostrophe latine.
- source_word: parate uos in pugnam
  choice: préparez-vous au combat
  rationale: Rend directement l’idée de se tenir prêt en vue d’un affrontement.
- source_word: in malis
  choice: au milieu des maux
  rationale: « Maux » préserve l’étendue de sens de malis, qui peut désigner les calamités comme les réalités mauvaises.
- source_word: quasi advenae terrae
  choice: comme des étrangers sur la terre
  rationale: Cette formulation, attestée par la couche anglaise pour la suite du verset, conserve l’image de personnes ne se considérant pas chez elles sur la terre.
theological_decisions:
- issue: Portée de l’image des étrangers sur la terre
  choice: Conserver l’image sans l’expliquer
  alternative: La paraphraser comme un détachement du monde ou comme un exil
  rationale: Le texte ne précise pas lui-même la portée théologique de l’image; une explicitation imposerait une interprétation particulière.
translation_notes:
  register: Français international moderne, clair et digne. L’apostrophe collective « mon peuple » est suivie d’impératifs au pluriel conformément au latin; « maux » maintient l’ambiguïté entre mal moral et calamités.
