  source_fidelity: 'Le sens de l’ensemble est bien rendu : le neuvième mois, l’imminence de l’accouchement, l’antériorité de deux ou trois heures, les douleurs et l’absence du moindre retard à la sortie de l’enfant sont conservés. « Enceinte au neuvième mois » est toutefois plus précis et plus idiomatique que « enceinte de neuf mois ».'
