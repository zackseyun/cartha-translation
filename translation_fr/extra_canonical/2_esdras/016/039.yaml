source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quemadmodum praegnans in nono mense filium suum inadpropinquante hora partus eius, ante horas duas vel tres gementes dolores circum ventrem eius, et prodiente infante de ventre non tardabit uno puncto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
translation:
  language: fr
  text: De même qu’une femme enceinte au neuvième mois, à l’approche de l’heure de son accouchement, ressent, deux ou trois heures à l’avance, des douleurs qui la font gémir autour de son ventre, et que, lorsque l’enfant sort du ventre, il ne tarde pas un seul instant,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnans in nono mense
  choice: une femme enceinte de neuf mois
  rationale: Expression française naturelle qui rend le neuvième mois de la grossesse sans lourdeur.
- source_word: ante horas duas vel tres
  choice: deux ou trois heures à l’avance
  rationale: « ante » marque l’antériorité par rapport à la naissance, et non la durée des douleurs.
- source_word: gementes dolores
  choice: des douleurs qui la font gémir
  rationale: Rend à la fois les douleurs et l’idée de gémissement exprimée par « gementes », tout en restant idiomatique en français.
- source_word: circum ventrem eius
  choice: tout autour du ventre
  rationale: Traduction directe de la localisation donnée par « circum ».
- source_word: non tardabit uno puncto
  choice: il ne tarde pas un seul instant
  rationale: « punctum » désigne ici un point de temps, donc un instant infime.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La longue comparaison et la virgule finale sont conservées, puisque le verset se poursuit syntaxiquement. Le pronom « il » garde comme antécédent immédiat « l’enfant », conformément à la construction latine, sans expliciter davantage ce que le texte laisse implicite.
