  text: Une épée est contre vous, et qui pourra la détourner ? Elle a été envoyée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est uobis gladius
  choice: Une épée est là pour vous
  rationale: Reproduit l’énoncé existentiel et menaçant du latin sans transformer d’emblée « est » en « a été envoyée ».
- source_word: auertat illum
  choice: la détourner
  rationale: Rend le sens de faire dévier ou écarter l’épée, tout en conservant l’image concrète.
- source_word: Inmissus est
  choice: Elle a été envoyée
  rationale: Conserve la proposition finale du texte latin fourni et son passif, avec l’épée comme référent naturel.
theological_decisions:
- issue: Agent implicite de l’envoi de l’épée
  choice: Maintenir le passif « Elle a été envoyée »
  alternative: « Dieu l’a envoyée »
  rationale: Le latin ne nomme pas l’agent ; l’expliciter résoudrait indûment une ambiguïté du texte.
translation_notes:
  register: Français moderne, sobre et solennel. La ponctuation met en valeur la menace puis la question rhétorique. Le dernier membre, présent dans la source latine fournie mais absent du texte anglais de consultation, est conservé.
