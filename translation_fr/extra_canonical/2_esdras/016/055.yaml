  text: all the works of men and their devices and their thoughts and their hearts. He who said[a], “Let the earth be made,” and it was made;
translation:
  language: fr
  text: 'toutes les œuvres des humains, leurs inventions, leurs pensées et leurs cœurs. Lui qui a dit : « Que la terre soit faite », et elle fut faite ;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opera hominis
  choice: les œuvres des humains
  rationale: « Œuvres » conserve la portée large de opera, tandis que le pluriel collectif « des humains » rend naturellement hominis dans ce contexte.
- source_word: adinventiones illorum
  choice: leurs inventions
  rationale: Traduction directe qui garde l’idée de ce que les humains conçoivent ou élaborent, sans lui imposer une nuance forcément malveillante.
- source_word: cogitatum illorum
  choice: leurs pensées
  rationale: Rend le sens manifeste du texte latin, malgré sa forme grammaticale irrégulière.
- source_word: corda illorum
  choice: leurs cœurs
  rationale: Conserve l’image biblique du cœur comme siège de la vie intérieure, plutôt que de la réduire à l’intelligence ou aux sentiments.
- source_word: fiat terra, et facta est
  choice: « Que la terre soit faite », et elle fut faite
  rationale: Maintient le parallélisme lexical entre fiat et facta est ainsi que la tournure solennelle de l’ordre créateur.
theological_decisions:
- issue: Référent de « Qui »
  choice: Lui qui a dit
  alternative: Celui qui a dit
  rationale: « Lui » rattache plus naturellement la proposition relative au Seigneur mentionné dans le verset précédent, tout en respectant la limite textuelle du présent verset sans réintroduire les mots du verset 54.
translation_notes:
  register: Français moderne, digne et lisible. La minuscule initiale et le point-virgule final signalent que le verset constitue un segment d’une phrase qui se poursuit de part et d’autre. Aucun appel de note n’est nécessaire, puisque l’ancienne formulation anglaise provenait d’un mauvais découpage des versets plutôt que d’une variante du texte latin.
