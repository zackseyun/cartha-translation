base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/045.yaml
  text: Those who marry[a], as though they will have no children; and those who do not marry, as widowers.
translation:
  language: fr
  text: Ceux qui se marient, comme s’ils n’allaient pas avoir d’enfants ; et ceux qui ne se marient pas, comme des veufs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubunt
  choice: se marient
  rationale: Rend directement le verbe latin nubere dans un français moderne et naturel.
- source_word: sic quasi
  choice: comme si / comme
  rationale: La première proposition appelle naturellement « comme si » devant une proposition verbale, tandis que la seconde, nominale, se rend avec « comme » ; ce léger ajustement préserve le parallélisme et l’ellipse du latin.
- source_word: filios non facturi
  choice: ne devaient pas avoir d’enfants
  rationale: Exprime l’idée de ne pas engendrer ou avoir d’enfants sans employer le littéral peu naturel « faire des fils » ; « enfants » conserve ici la portée générique probable de filios.
- source_word: vidui
  choice: des veufs
  rationale: 'Conserve le masculin pluriel et l’image précise du latin : des hommes privés de leur épouse.'
theological_decisions:
- issue: Force exhortative implicite de la proposition
  choice: Conserver la construction elliptique coordonnée au contexte précédent
  alternative: Ajouter « qu’ils soient » ou « qu’ils vivent » dans chaque proposition
  rationale: Le verset poursuit une série gouvernée par l’impératif du contexte. Ne pas ajouter un nouveau verbe respecte le rythme de la litanie et évite de préciser plus que le texte.
translation_notes:
  register: Français moderne, sobre et solennel. Le point-virgule maintient le parallélisme des deux membres, et l’ellipse est conservée comme dans le latin contextuel.
