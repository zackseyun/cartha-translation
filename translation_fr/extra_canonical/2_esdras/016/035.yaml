  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/035.yaml
  text: Not having help, their bridegrooms will be consumed in war, and their husbands will perish by famine.
translation:
  language: fr
  text: Sans secours[a], leurs fiancés seront anéantis à la guerre, et leurs maris périront de famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sans recevoir leur aide » ; le latin peut rattacher « leur » au secours attendu de ces femmes.'
    reason: Signale l’ambiguïté grammaticale de earum non habentes adiutorium sans imposer une seule analyse dans le texte principal.
lexical_decisions:
- source_word: non habentes adiutorium
  choice: Sans secours
  rationale: Rend naturellement le participe latin et l’absence d’aide, sans préciser la provenance du secours, que la construction latine laisse incertaine.
- source_word: sponsi earum
  choice: leurs fiancés
  rationale: Préserve la distinction lexicale entre sponsi et uiri dans le même verset; « fiancés » reste ici le meilleur équivalent bref de sponsi.
- source_word: in bello consumentur
  choice: seront anéantis à la guerre
  rationale: Exprime la destruction entraînée par la guerre, conformément au sens fort de consumentur.
- source_word: uiri earum
  choice: leurs maris
  rationale: Rend le rapport conjugal explicite et maintient le contraste avec « leurs fiancés ».
- source_word: in fame exterentur
  choice: dépériront de faim
  rationale: Formulation française naturelle qui restitue l’idée d’épuisement mortel portée par exterentur et la famine comme cause.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et solennel. La coordination et le parallélisme du latin sont conservés, de même que la distinction entre « fiancés » et « maris ».
