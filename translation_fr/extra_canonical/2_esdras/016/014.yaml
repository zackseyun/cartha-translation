  text: to the ends of the earth. Behold, evils are sent out, and they will not return until
translation:
  language: fr
  text: jusqu’aux extrémités de la terre. Voici, des malheurs sont envoyés, et ils ne reviendront pas avant que
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in fines terrae
  choice: jusqu’aux extrémités de la terre
  rationale: Rend directement l’idée spatiale des limites les plus lointaines de la terre et conserve le lien avec le contexte précédent.
- source_word: Ecce
  choice: Voici
  rationale: Équivalent français naturel et digne du présentatif latin, qui attire solennellement l’attention.
- source_word: mala
  choice: des malheurs
  rationale: Dans ce contexte d’envoi de calamités, « malheurs » exprime mieux des fléaux ou désastres que le sens moral de « maux », sans préciser davantage que le latin.
- source_word: mittuntur
  choice: sont envoyés
  rationale: Conserve la voix passive du latin, sans identifier l’agent implicite.
- source_word: non reuertentur
  choice: ils ne reviendront pas
  rationale: Traduction directe qui maintient le futur et le mouvement de retour exprimés par le latin.
- source_word: donec
  choice: avant que
  rationale: La locution introduit naturellement en français la limite encore inaccomplie, tout en laissant la proposition ouverte comme dans le fragment source.
theological_decisions:
- issue: Agent qui envoie les malheurs
  choice: Maintenir le passif « sont envoyés »
  alternative: Expliciter que Dieu les envoie
  rationale: Le texte latin ne nomme pas l’agent; l’expliciter imposerait une interprétation théologique absente du fragment.
- issue: Nature de mala
  choice: « malheurs »
  alternative: « maux » ou « fléaux »
  rationale: « Malheurs » garde une certaine largeur sémantique tout en signalant ici des calamités; « fléaux » serait plus spécifique, tandis que « maux » pourrait suggérer surtout le mal moral.
translation_notes:
  register: 'Français international moderne, solennel mais accessible. Le début en minuscule et la fin suspendue sont intentionnels: ce fragment poursuit la phrase précédente et s’arrête sur donec (« avant que/jusqu’à ce que »), dont la suite appartient au verset suivant.'
