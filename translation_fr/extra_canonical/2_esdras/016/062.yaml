  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: fr
  text: Il a formé l’être humain, placé un cœur au milieu de son corps et lui a donné l’esprit, la vie et l’intelligence,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hominem
  choice: l’être humain
  rationale: Formulation inclusive et naturelle qui désigne ici l’être humain en général, sans imposer le sens moderne plus restreint de « homme ».
- source_word: cor in medio corporis
  choice: un cœur au milieu de son corps
  rationale: Conserve l’image corporelle et la formulation spatiale de la tradition latine dans un français clair.
- source_word: misit ei
  choice: lui a donné
  rationale: Dans ce contexte de création et de dotation, « donner » rend naturellement le latin « mittere » sans l’étrange littéralisme « envoyer à/en lui ».
- source_word: spiritum
  choice: l’esprit
  rationale: Préserve la portée potentiellement anthropologique et théologique du latin « spiritus », sans la réduire à « souffle » ni préciser indûment sa nature.
- source_word: intellectum
  choice: l’intelligence
  rationale: Rend la faculté de comprendre exprimée par « intellectus » dans un vocabulaire français courant et digne.
theological_decisions:
- issue: Sens de « spiritum »
  choice: l’esprit
  alternative: le souffle
  rationale: « Esprit » maintient l’ambiguïté entre principe vital et dimension spirituelle de l’être humain; « souffle » privilégierait trop nettement l’aspect physiologique.
translation_notes:
  register: Français moderne, international et digne. La structure ternaire « l’esprit, la vie et l’intelligence » est conservée. Le début de la phrase, absent de l’extrait latin fourni mais attesté par la couche de consultation anglaise, est rendu sans amplification.
