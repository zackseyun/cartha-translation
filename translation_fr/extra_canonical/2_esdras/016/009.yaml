  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
translation:
  language: fr
  text: 'Des malheurs : qui pourra les repousser ? Un feu sortira de sa colère : qui pourra l’éteindre ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: des malheurs
  rationale: Le neutre pluriel substantivé désigne ici des maux ou calamités imminents ; « malheurs » est naturel en français et convient au contexte.
- source_word: repellet
  choice: pourra les repousser
  rationale: « Repousser » conserve l’image d’une menace que personne ne peut écarter ; l’emploi de « pourra » rend idiomatiquement la question rhétorique.
- source_word: Exiet
  choice: jaillira
  rationale: Le futur de exire indique que le feu sortira ou procédera de la colère ; « jaillira » évite l’ambiguïté française de « s’éteindra » et exprime vivement cette provenance.
- source_word: iracundia eius
  choice: sa colère
  rationale: Traduction directe et naturelle, en conservant le référent pronominal du texte source.
theological_decisions:
- issue: Origine du feu dans la colère divine
  choice: Un feu jaillira de sa colère
  alternative: Un feu sortira de sa colère
  rationale: « Jaillira » préserve l’idée que le feu émane de sa colère sans préciser davantage le rapport théologique entre les deux.
- issue: Portée des questions rhétoriques
  choice: qui pourra… ?
  alternative: qui… ?
  rationale: Cette formulation française fait ressortir l’impuissance implicite sans ajouter un agent ou une doctrine absents du latin.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme des deux questions est maintenu, avec des tirets pour restituer la vigueur oraculaire du passage.
