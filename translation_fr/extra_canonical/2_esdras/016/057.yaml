  text: By his word the stars were established, and he knows the number of the stars.
translation:
  language: fr
  text: Par sa parole, les étoiles ont été établies, et il en connaît le nombre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sunt
  choice: ont été établies
  rationale: Le texte latin fourni ne conserve ici que la fin de la proposition (« sont »). La formulation est complétée d’après le contexte textuel attesté par la couche de consultation, tout en gardant une tournure française naturelle.
- source_word: nouit
  choice: connaît
  rationale: Le présent exprime la connaissance actuelle et entière de Dieu, sans explicitation théologique supplémentaire.
- source_word: numerum stellarum
  choice: le nombre [des étoiles] / en connaît le nombre
  rationale: La reprise pronominale « en » évite une répétition lourde tout en conservant exactement le référent.
theological_decisions:
- issue: Agent implicite dans le texte latin fragmentaire
  choice: Conserver le pronom « il » sans nommer explicitement Dieu
  alternative: Dieu connaît le nombre des étoiles
  rationale: Le latin emploie une forme verbale à sujet implicite; le contexte identifie l’agent, mais le nommer dans ce verset ajouterait une explicitation absente de la formulation transmise.
translation_notes:
  register: Français international moderne, simple et digne. Le texte source fourni commence au dernier mot d’une proposition et se poursuit dans la proposition suivante; la ponctuation et la segmentation suivent le verset demandé, sans intégrer « Qui scrutat abyssum et », qui ouvre vraisemblablement la suite.
