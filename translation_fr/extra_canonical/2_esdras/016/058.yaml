source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: thesauros illorum, qui metitus est mare et conceptum eius; Qui conclusit mare in medio aquarum et suspendit terram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/058.yaml
  text: He searches the deep and its treasures; he has measured the sea and what it contains; he has enclosed the sea in the midst of the waters and suspended the earth.
translation:
  language: fr
  text: Il sonde l’abîme et ses trésors ; il a mesuré la mer et ce qu’elle contient ; il a enfermé la mer au milieu des eaux et suspendu la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: metitus est mare
  choice: il a mesuré la mer
  rationale: Rend directement l’idée d’une mesure accomplie, tout en conservant l’image cosmologique du texte.
- source_word: conceptum eius
  choice: ce qu’elle contient
  rationale: Dans ce contexte, « conceptum » désigne le contenu ou la capacité de la mer ; cette formulation française est claire sans préciser davantage ce que le latin laisse général.
- source_word: conclusit mare
  choice: a enfermé la mer
  rationale: Conserve l’image forte d’une mer contenue dans des limites, sans la réduire au simple fait de la délimiter.
- source_word: in medio aquarum
  choice: au milieu des eaux
  rationale: Traduction formelle qui préserve la représentation cosmologique inhabituelle du texte.
- source_word: suspendit terram
  choice: suspendu la terre
  rationale: Reproduit fidèlement l’image de la terre suspendue.
theological_decisions:
- issue: Sujet divin implicite et succession des relatives latines
  choice: Employer « il » dans une série de propositions coordonnées
  alternative: « lui qui a mesuré… qui a enfermé… »
  rationale: Le français courant exprime clairement la continuité du même sujet divin, sans ajouter de titre ni d’interprétation théologique.
- issue: Image cosmologique de la mer enfermée au milieu des eaux
  choice: Conserver l’image littéralement
  alternative: Reformuler en « il a fixé les limites de la mer »
  rationale: La reformulation alternative résoudrait une tension propre au texte et ferait disparaître la distinction exprimée entre la mer et les eaux.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des trois propositions et les images cosmologiques du texte sont conservés. « Sonder » rend naturellement l’examen des profondeurs évoqué par la couche de consultation anglaise, tandis que le reste suit étroitement le latin fourni.
