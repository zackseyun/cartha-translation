lexical_decisions:
- source_word: quemadmodum
  choice: Comme
  rationale: Introduit naturellement en français la comparaison portée par le latin.
- source_word: in oliveto
  choice: dans une oliveraie
  rationale: Rend le lieu explicitement indiqué sans ajouter l’idée absente de « chaque arbre ».
- source_word: relinquentur
  choice: il ne reste que
  rationale: Exprime le passif latin de façon idiomatique et souligne la très faible quantité restante sans modifier le sens.
- source_word: tres vel quattuor olivae
  choice: trois ou quatre olives
  rationale: Traduction directe qui conserve l’alternative numérique du latin.
theological_decisions:
- issue: Étendue de la pénurie évoquée par l’image
  choice: Trois ou quatre olives restent dans toute l’oliveraie
  alternative: Trois ou quatre olives restent sur chaque arbre
  rationale: Le latin dit seulement « in oliveto » et ne contient aucun équivalent de « sur chaque arbre »; ne pas l’ajouter préserve la force de l’image apocalyptique.
translation_notes:
  register: Français moderne, clair et digne. La tournure « il ne reste que » est idiomatique et conserve l’image frappante d’une pénurie extrême.
