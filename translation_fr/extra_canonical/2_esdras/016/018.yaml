source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: fr
  text: 'En ces jours-là : le commencement des douleurs et beaucoup de gémissements, le commencement de la famine et beaucoup périront, le commencement des guerres et ils auront peur.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni s’arrête ici. Certains témoins ou textes de consultation poursuivent par une phrase sur le commencement des maux et le tremblement de tous, mais cette phrase n’est pas présente dans la source latine donnée.
    reason: Signaler de manière transparente que la dernière proposition de la couche anglaise de consultation n’est pas attestée dans le texte latin fourni, plutôt que de l’importer silencieusement.
lexical_decisions:
- source_word: dolorum
  choice: douleurs
  rationale: Rend directement le pluriel latin et conserve sa portée ouverte, qui peut inclure souffrances et afflictions.
- source_word: multi gemitus
  choice: beaucoup de gémissements
  rationale: Le latin associe multi à gemitus; cette formulation française naturelle garde l’idée d’une grande quantité de lamentations.
- source_word: multi interient
  choice: beaucoup périront
  rationale: « Périront » correspond à interient sans préciser la cause de la mort.
- source_word: formidabunt
  choice: ils auront peur
  rationale: Le sujet n’est pas exprimé en latin; le pronom indéfini dans son référent est conservé sans ajouter « les dirigeants » ou un autre groupe.
theological_decisions:
- issue: Portée eschatologique des « douleurs »
  choice: Conserver le terme général « douleurs »
  alternative: « douleurs de l’enfantement » ou « tourments »
  rationale: Le latin dolorum ne précise ni l’image de l’accouchement ni une forme particulière de souffrance; il ne faut pas résoudre cette ouverture par interprétation.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure répétitive « le commencement de… » est maintenue afin de reproduire la cadence du latin. La ponctuation transforme le point d’interrogation apparemment éditorial après in illis diebus en deux-points, conformément au déroulement syntaxique de la phrase.
