source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: zelatur fornicariam mulierem idonea et bona ualde, Sic zela bitur iusticia iniquitatem cum exornat se, et accusat eam in faciem, cum uenerit qui defendat exquirentem omnem peccatum super terram. Propterea nolite similari eam nec operibus eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
translation:
  language: fr
  text: Comme une femme honorable et très belle s’indigne contre une prostituée[a], ainsi la justice s’indignera contre l’iniquité quand celle-ci se pare, et elle l’accusera en face lorsque viendra celui qui défend celui qui recherche tout péché sur la terre[b]. N’imitez donc ni l’iniquité ni ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin est difficile et très condensé. L’image semble opposer la justice et l’iniquité sous les traits d’une femme honorable et d’une prostituée; la justice accuse publiquement l’iniquité lorsque vient celui qui défend celui qui recherche les péchés.
    reason: textual_variant
  - marker: b
    text: La construction latine est ambiguë et ne précise pas clairement l’identité de « celui qui défend » ni de « celui qui recherche tout péché sur la terre ». Il est aussi possible de comprendre la phrase comme si une même figure était à la fois défenseur et enquêteur.
    reason: translation_ambiguity
lexical_decisions:
- source_word: zelatur / zelabitur
  choice: s’indigne / s’indignera
  rationale: Le verbe latin peut exprimer un zèle jaloux ou une vive indignation. « S’indigner contre » rend ici naturellement l’opposition morale sans réduire le sens à la haine.
- source_word: mulierem idonea et bona ualde
  choice: une femme honorable et très belle
  rationale: Le latin est grammaticalement difficile et condensé. « Honorable » exprime l’idée d’une femme convenable ou respectable; « très belle » suit l’interprétation contextuelle de bona dans cette comparaison féminine, tout en signalant l’incertitude en note.
- source_word: fornicariam mulierem
  choice: une prostituée
  rationale: Rendu direct et courant de la femme caractérisée par la prostitution.
- source_word: exornat se
  choice: se pare
  rationale: Conserve l’image de l’iniquité qui s’orne ou se donne une apparence séduisante.
- source_word: accusat eam in faciem
  choice: elle l’accusera en face
  rationale: Formulation directe qui conserve la personnification féminine de la justice et de l’iniquité.
- source_word: defendat exquirentem omne peccatum
  choice: défend celui qui recherche tout péché
  rationale: Traduction volontairement proche d’une construction latine ambiguë; elle n’identifie pas davantage les deux personnages ni la nature exacte de la défense.
- source_word: nolite similari eam nec operibus eius
  choice: Ne ressemblez donc ni à l’iniquité ni à ses œuvres
  rationale: Explicite l’antécédent en français afin d’éviter une confusion avec la justice, tout en conservant le double objet de l’exhortation.
theological_decisions:
- issue: Identification de celui qui vient et de celui qui recherche tout péché
  choice: Maintenir les deux désignations sans les identifier explicitement
  alternative: Comprendre le personnage qui vient comme le juge divin qui recherche lui-même tout péché
  rationale: La syntaxe distingue littéralement « celui qui défend » de « celui qui recherche ». Les fusionner résoudrait une tension réelle du texte latin.
- issue: Personnification de la justice et de l’iniquité
  choice: Conserver les deux figures féminines
  alternative: Employer des tournures impersonnelles pour éviter les pronoms ambigus
  rationale: Les noms français sont féminins comme leurs équivalents latins, et cette personnification structure toute la comparaison.
translation_notes:
  register: Français international moderne, digne et accessible. La comparaison abrupte et la syntaxe théologiquement tendue de la dernière proposition sont conservées plutôt que lissées. La répétition explicite de « l’iniquité » dans la dernière phrase assure la clarté référentielle.
