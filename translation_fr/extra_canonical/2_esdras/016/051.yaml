    issue: Note a incomplète quant à la construction finale
    rationale: La note décrit la venue de « celui qui enquête sur les péchés », mais le texte latin mentionne aussi « celui qui défend » cet enquêteur. La note doit préserver cette difficulté plutôt que la réduire.
