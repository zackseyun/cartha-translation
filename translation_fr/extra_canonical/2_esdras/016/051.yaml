review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend fidèlement la comparaison, le contraste entre justice et iniquité, et maintient à juste titre la distinction syntaxiquement difficile entre « celui qui défend » et « celui qui recherche tout péché ». La dernière exhortation latine appelle toutefois plus naturellement en français le verbe « imiter » que « ressembler à », surtout devant « ses œuvres ».
  naturalness: « Ne ressemblez donc ni à l’iniquité ni à ses œuvres » est peu idiomatique, car on ne « ressemble » pas naturellement à des œuvres dans ce sens moral. « N’imitez donc ni l’iniquité ni ses œuvres » est fluide, direct et conserve le sens exhortatif. La note a doit également éviter de simplifier la construction en omettant celui qui « défend ».
  terminology: « Justice », « iniquité », « se pare », « prostituée » et « s’indigne contre » conviennent au registre biblique moderne. La personnification féminine est bien conservée. La formulation « très belle » est une solution recevable au latin difficile « idonea et bona ualde ».
  issues:
