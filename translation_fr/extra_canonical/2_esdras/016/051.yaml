revisions:
- from: Comme une femme honorable et très belle s’indigne contre une prostituée[a], ainsi la justice s’indignera contre l’iniquité quand celle-ci se pare, et elle l’accusera en face lorsque viendra celui qui défend celui qui recherche tout péché sur la terre[b]. Ne ressemblez donc ni à l’iniquité ni à ses œuvres.
  to: Comme une femme honorable et très belle s’indigne contre une prostituée[a], ainsi la justice s’indignera contre l’iniquité quand celle-ci se pare, et elle l’accusera en face lorsque viendra celui qui défend celui qui recherche tout péché sur la terre[b]. N’imitez donc ni l’iniquité ni ses œuvres.
  rationale: La révision remplace une expression française maladroite par « imiter », qui correspond naturellement à l’exhortation latine visant l’iniquité et ses œuvres. Elle corrige aussi la note a afin qu’elle ne supprime pas le défenseur explicitement mentionné dans la syntaxe source. Le texte principal conserve volontairement l’ambiguïté des personnages de la proposition finale.
