    issue: Verbe de l’exhortation finale peu naturel
    rationale: Le latin « nolite similari eam nec operibus eius » vise l’imitation ou la conformité. En français moderne, « ressembler à ses œuvres » est maladroit; « imiter ... ses œuvres » rend nettement mieux l’injonction sans modifier son sens.
