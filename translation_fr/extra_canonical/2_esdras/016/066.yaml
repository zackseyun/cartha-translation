source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: confusi eritis, cum processerint peccata uestra coram hominibus, et iniquitates erint quae accusatores stabunt in die illo. Quid
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
translation:
  language: fr
  text: Vous serez couverts de honte lorsque vos péchés paraîtront devant les hommes, et vos injustices se dresseront en accusatrices ce jour-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusi eritis
  choice: vous serez couverts de honte
  rationale: Rend l’état de honte et de confusion exprimé par le latin dans un français naturel et solennel.
- source_word: processerint
  choice: paraîtront
  rationale: Dans ce contexte de dévoilement public, « paraître » exprime naturellement le fait que les péchés viennent au grand jour, sans la tournure moins idiomatique « sortiront ».
- source_word: iniquitates
  choice: injustices
  rationale: Conserve la dimension morale de « iniquitates » et évite de répéter « péchés ».
- source_word: accusatores stabunt
  choice: se dresseront en accusatrices
  rationale: Préserve l’image judiciaire et la personnification des injustices qui se tiennent pour accuser.
theological_decisions:
- issue: Personnification des injustices au jugement
  choice: les injustices elles-mêmes « se dresseront en accusatrices »
  alternative: elles témoigneront contre vous
  rationale: Le texte identifie les injustices comme accusatrices; la traduction maintient cette image et n’ajoute aucun agent ni mécanisme de jugement.
translation_notes:
  register: Français moderne, digne et accessible, avec une tonalité judiciaire et apocalyptique. « Hommes » est conservé au sens collectif du latin hominibus.
source_grounding:
  english_pob_role: consult_only
