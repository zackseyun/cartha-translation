  yaml_path: translation/extra_canonical/2_esdras/016/023.yaml
  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
translation:
  language: fr
  text: Ils perdront la vie sur la terre, et l’épée dispersera ceux qui auront survécu à la famine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aporiant vitam
  choice: perdront la vie
  rationale: Le verbe latin tardif « aporiare » exprime ici l’idée d’être privé de la vie ou de la perdre. Cette formulation française naturelle suit le texte critique fourni sans introduire la variante qui mentionne explicitement une mort par famine.
- source_word: super terram
  choice: sur la terre
  rationale: Rendu direct de la locution latine, en conservant sa portée générale.
- source_word: gladius dispersit
  choice: l’épée dispersera
  rationale: « L’épée » désigne la violence guerrière. Malgré la forme parfaite « dispersit », le contexte prophétique orienté vers l’avenir appelle un futur en français; « dispersera » conserve le sens propre de « dispergere » plutôt que celui de « détruire ».
- source_word: quae superaverint a fame
  choice: ceux qui auront survécu à la famine
  rationale: Le neutre pluriel latin renvoie aux êtres restés en vie; le français idiomatique emploie « ceux ». Le futur antérieur exprime l’antériorité de leur survie par rapport à leur dispersion.
theological_decisions:
- issue: Rapport entre la famine et la perte de la vie
  choice: Ne pas affirmer que la famine est la cause explicite de la première mort
  alternative: « Beaucoup d’habitants de la terre mourront de faim »
  rationale: Cette autre lecture correspond à une variante latine connue, mais non au texte critique fourni, qui dit « aporiant vitam super terram ». La traduction maintient donc la formulation plus énigmatique du témoin retenu.
- issue: Effet de l’épée sur les survivants
  choice: « dispersera »
  alternative: « détruira »
  rationale: Le texte fourni porte « dispersit », issu de « dispergere ». Traduire par « détruire » résoudrait indûment l’image et suivrait une autre tradition textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. Syntaxe prophétique fluide; maintien du parallélisme entre perte de la vie, famine et épée, sans harmonisation avec la variante de la Vulgate.
