  text: facient, cum uenerint mala? Ecce fames et plaga et tribulatio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/020.yaml
  text: Behold, famine and plague and tribulation have been sent as scourges for correction.
translation:
  language: fr
  text: Que feront-ils lorsque les maux viendront ? Voici la famine, le fléau et la tribulation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: les malheurs
  rationale: Le pluriel neutre désigne ici les maux ou calamités qui surviennent; « malheurs » est naturel en français et convient au contexte.
- source_word: Ecce
  choice: Voici
  rationale: Rend directement la particule de présentation et son effet d’annonce.
- source_word: fames
  choice: la famine
  rationale: Équivalent direct et idiomatique.
- source_word: plaga
  choice: l’épidémie
  rationale: Dans cette série de calamités, le terme désigne vraisemblablement un fléau sanitaire; « épidémie » exprime ce sens sans employer le mot historiquement plus spécifique « peste ».
- source_word: tribulatio
  choice: la détresse
  rationale: Rend l’idée d’affliction ou d’épreuve accablante dans un français actuel et digne.
theological_decisions:
- issue: Ajout d’une finalité corrective absente du fragment latin fourni
  choice: Ne pas ajouter « envoyées comme des fléaux pour corriger »
  alternative: Suivre la couche anglaise et inclure cette proposition
  rationale: Le texte latin fourni s’arrête à « tribulatio ». La traduction française reste donc limitée aux mots attestés, sans importer un complément que la source présentée ne permet pas de vérifier.
translation_notes:
  register: Français international moderne, clair et solennel. La question initiale est conservée, même si elle commence au milieu d’un enchaînement venant du contexte précédent. L’énumération nominale après « Voici » respecte la concision du latin.
