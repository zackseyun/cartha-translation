revisions:
- from: portera la place d’un homme. Car toi seul, tu es un[a], et nous sommes un seul ouvrage façonné par tes mains, comme tu l’as déclaré.
  to: portera la place d’un homme. Car tu es seul, et nous sommes une seule œuvre façonnée par tes mains, comme tu l’as dit.
  rationale: 'La révision rétablit la syntaxe de la phrase latine : solus est prédicatif avec es, tandis que una qualifie plasmatio. Elle supprime donc l’affirmation française fautive « tu es un » et la note qui en découlait. La première proposition, dont le sujet est absent dans le fragment, demeure volontairement fragmentaire et suit locum; une note distincte signale avec prudence la lecture « forme » soutenue par des témoins anciens.'
