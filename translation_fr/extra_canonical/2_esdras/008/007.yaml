  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
translation:
  language: fr
  text: portera la place d’un homme. Car tu es seul, et nous sommes une seule œuvre façonnée par tes mains, comme tu l’as dit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: portabit locum hominis
  choice: portera la place d’un homme
  rationale: Rend directement le latin transmis, malgré une ouverture de verset fragmentaire et un sens difficile. « Portera » conserve le futur de portabit, et « la place d’un homme » correspond à locum hominis.
- source_word: una
  choice: un
  rationale: L’adjectif latin est féminin, vraisemblablement par accord avec une notion sous-entendue; le français emploie le masculin non marqué dans « tu es un », tout en préservant l’affirmation énigmatique de l’unité divine.
- source_word: una plasmatio
  choice: un seul ouvrage façonné
  rationale: Exprime à la fois l’unité indiquée par una et l’idée de formation contenue dans plasmatio, dans un français naturel.
- source_word: manuum tuarum
  choice: par tes mains
  rationale: Traduction concise et directe de l’image anthropomorphique du texte.
- source_word: sicut locutus es
  choice: comme tu l’as déclaré
  rationale: Rend le parfait locutus es comme une parole divine antérieure, avec un registre digne et courant.
theological_decisions:
- issue: Sens de l’affirmation « Solus enim es, et una »
  choice: Car toi seul, tu es un
  alternative: Car toi seul es unique
  rationale: La formulation retenue conserve séparément solus et una, ainsi que leur tension, sans les fondre en une affirmation doctrinale plus lisse.
- issue: Texte transmis « locum » ou correction conjecturale « forme »
  choice: la place d’un homme
  alternative: la forme d’un homme
  rationale: Le texte latin fourni porte locum. Bien qu’une corruption ancienne fondée sur un possible grec typon/topon ait été proposée, la correction n’est pas certaine sur la seule base de la source fournie; le corps du texte suit donc le latin attesté et signale l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne mais accessible. L’ouverture demeure fragmentaire, comme dans la source fournie. La répétition de l’idée d’unité est maintenue plutôt que lissée.
