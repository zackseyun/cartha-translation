  text: you[a], and have not judged yourself among the righteous, so that you might be more greatly glorified.
translation:
  language: fr
  text: toi, et tu ne t’es pas compté parmi les justes, afin d’être glorifié davantage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sorte que tu sois glorifié au plus haut point ».'
    reason: Le latin permet de comprendre « ut » comme indiquant le résultat et « plurimum » au sens intensif plutôt que comparatif.
lexical_decisions:
- source_word: iudicasti te inter iustos
  choice: tu ne t’es pas compté parmi les justes
  rationale: Cette formulation naturelle conserve l’idée de porter un jugement sur soi-même et de ne pas se ranger au nombre des justes.
- source_word: ut plurimum glorificeris
  choice: afin d’être glorifié davantage
  rationale: « Afin de » préserve la valeur finale possible de « ut », tandis que « davantage » rend la nuance comparative de « plurimum » retenue par la révision auditée.
theological_decisions:
- issue: Rapport entre l’humilité du destinataire et sa glorification
  choice: afin d’être glorifié davantage
  alternative: de sorte que tu sois glorifié au plus haut point
  rationale: Le latin « ut » peut exprimer le but ou le résultat, et « plurimum » peut être entendu comparativement ou comme un superlatif adverbial. Le texte principal conserve la lecture finale et comparative sans préciser l’agent de la glorification.
translation_notes:
  register: Français moderne, sobre et digne. L’ouverture abrupte par « toi » est maintenue parce que le texte latin fourni commence par « te » et dépend manifestement du contexte précédent; elle ne doit pas être remplacée par l’ancienne formulation provenant d’un mauvais alignement de verset.
