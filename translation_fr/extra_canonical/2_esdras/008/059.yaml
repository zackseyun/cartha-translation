  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
translation:
  language: fr
  text: Car ce qui a été annoncé d’avance vous accueillera ; de même, la soif et les tourments qui sont préparés les accueilleront. En effet, le Très-Haut n’a pas voulu que l’être humain périsse ; mais ceux qui ont été créés ont eux-mêmes souillé son nom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: susipient
  choice: accueillera / accueilleront
  rationale: Rend littéralement l’idée de « recevoir » tout en restant naturel en français ; le changement de nombre suit les sujets respectifs.
- source_word: quae praedicta sunt
  choice: ce qui a été annoncé d’avance
  rationale: Expression collective au neutre pluriel en latin, rendue idiomatiquement par un singulier collectif français sans préciser indûment le contenu annoncé.
- source_word: sitis et cruciatus
  choice: la soif et les tourments
  rationale: Respecte le singulier de sitis et le pluriel de cruciatus.
- source_word: hominem disperdi
  choice: que l’être humain périsse
  rationale: « L’être humain » a ici une valeur générique ; « périsse » exprime naturellement le passif infinitif disperdi dans cette construction.
- source_word: coinquinauerunt nomen eius
  choice: ont souillé son nom
  rationale: Traduction directe et digne de coinquinare, qui désigne une profanation ou une contamination.
theological_decisions:
- issue: Volonté du Très-Haut et perdition humaine
  choice: n’a pas voulu que l’être humain périsse
  alternative: ne voulait pas la destruction de l’homme
  rationale: Conserve l’affirmation explicite du texte sans tenter de résoudre la tension entre volonté divine et responsabilité des créatures.
- issue: Responsabilité des êtres créés
  choice: ceux-là mêmes qu’il avait créés ont souillé son nom
  alternative: mais les créatures elles-mêmes ont souillé son nom
  rationale: Préserve l’insistance de ipsi qui creati sunt et explicite seulement l’agent implicite de la création, clairement désigné par le contexte.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme entre « vous accueillera » et « les accueilleront » est conservé, ainsi que le contraste entre « vous » et « les ».
