- from: Car ce qui a été annoncé d’avance vous accueillera, tandis que la soif et les tourments préparés les accueilleront. En effet, le Très-Haut n’a pas voulu que l’être humain périsse ; mais ceux-là mêmes qu’il avait créés ont souillé son nom.
