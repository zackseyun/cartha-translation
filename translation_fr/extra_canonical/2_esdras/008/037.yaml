lexical_decisions:
- source_word: iuxta sermones tuos
  choice: Selon tes paroles
  rationale: Rend directement l’idée de conformité exprimée par « iuxta », dans un français naturel et digne.
- source_word: sic et fiet
  choice: ainsi en sera-t-il
  rationale: Conserve la valeur future de « fiet » et la tournure corrélative avec la proposition précédente.
- source_word: Quoniam uere
  choice: Car, en vérité
  rationale: Reproduit à la fois le lien causal de « quoniam » et l’insistance de « uere ».
- source_word: non cogitabo
  choice: je ne penserai pas
  rationale: Traduction littérale du futur, laissée inachevée comme dans le fragment latin fourni.
theological_decisions:
- issue: Sens incomplet de « non cogitabo »
  choice: 'Maintenir la proposition ouverte : « je ne penserai pas »'
  alternative: Compléter implicitement l’objet de la pensée ou rattacher la suite à un autre verset
  rationale: Le texte source fourni s’interrompt après le verbe; compléter la pensée résoudrait sans preuve une lacune textuelle et pourrait modifier le sens théologique.
translation_notes:
  register: Français moderne, sobre et soutenu. La syntaxe légèrement solennelle de « ainsi en sera-t-il » convient au contexte scripturaire sans devenir archaïque. Le caractère fragmentaire de la dernière proposition est volontairement préservé.
