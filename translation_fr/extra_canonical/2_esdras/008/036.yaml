source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: fr
  text: 'Car c’est en ceci que ta justice et ta bonté seront proclamées, Seigneur : lorsque tu feras miséricorde à ceux qui n’ont aucune réserve de bonnes œuvres.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntiabitur
  choice: seront proclamées
  rationale: Le passif futur latin exprime une proclamation publique; le pluriel français s’accorde naturellement avec «ta justice et ta bonté».
- source_word: iusticia tua et bonitas tua
  choice: ta justice et ta bonté
  rationale: Rendu direct qui conserve les deux attributs divins sans en réduire la tension théologique.
- source_word: cum misertus fueris
  choice: lorsque tu feras miséricorde
  rationale: Cette formulation garde le sens temporel et l’idée explicite de miséricorde divine.
- source_word: substantiam operum bonorum
  choice: réserve de bonnes œuvres
  rationale: «Réserve» restitue ici l’idée d’un fonds ou capital constitué par les bonnes œuvres, plus naturellement que le littéral «substance».
theological_decisions:
- issue: Rapport entre la justice divine, la bonté divine et la miséricorde envers ceux qui manquent de bonnes œuvres
  choice: Conserver côte à côte «justice», «bonté» et «miséricorde» sans expliquer leur articulation
  alternative: Paraphraser la justice comme fidélité ou présenter la miséricorde comme opposée au jugement
  rationale: Le latin affirme que la miséricorde manifeste à la fois la justice et la bonté de Dieu; la traduction préserve cette tension sans imposer une lecture doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le verset est traduit selon ses limites éditoriales usuelles; les mots latins qui précèdent et suivent appartiennent au contexte adjacent.
