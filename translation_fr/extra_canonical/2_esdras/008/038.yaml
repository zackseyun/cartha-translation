source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super plasma eorum qui peccauerunt aut mortem aut iudicium aut perditionem ; Sed iocundabor super iustorum figmentum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
translation:
  language: fr
  text: Je ne penserai pas à la formation de ceux qui ont péché, ni à leur mort, ni à leur jugement, ni à leur perdition ; mais je me réjouirai de la création des justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plasma
  choice: formation
  rationale: Le nom désigne ce qui est façonné ou l’acte de façonner. « Formation » conserve le lien avec l’œuvre créatrice sans transformer le groupe en une simple désignation des pécheurs.
- source_word: figmentum
  choice: création
  rationale: Le terme désigne une œuvre façonnée. « Création » est naturel en français et maintient le parallèle, avec une variation lexicale, entre plasma et figmentum.
- source_word: perditionem
  choice: perdition
  rationale: Ce terme français actuel dans un registre biblique exprime la ruine définitive sans préciser au-delà du latin la nature de cette issue.
- source_word: iocundabor
  choice: je me réjouirai
  rationale: Rend directement la joie exprimée par le verbe latin, dans un registre naturel et digne.
theological_decisions:
- issue: Portée du génitif eorum (« de ceux qui ont péché »)
  choice: Rattacher la mort, le jugement et la perdition aux pécheurs par les possessifs « leur »
  alternative: Lire « la mort, le jugement ou la perdition » comme des réalités générales et indépendantes
  rationale: Les accusatifs mortem, iudicium et perditionem sont coordonnés à plasma sous le même régime implicite ; le contexte oppose le sort des pécheurs à la création des justes, non un rejet général du jugement.
- issue: Rapport entre plasma et figmentum
  choice: Conserver dans les deux membres l’idée d’une œuvre créée ou façonnée
  alternative: Omettre plasma et traduire simplement « ceux qui ont péché »
  rationale: Le contraste lexical entre les deux groupes fait partie de la formulation latine et ne doit pas être effacé.
translation_notes:
  register: Français international moderne, sobre et biblique. La coordination répétée par « ni » restitue la série latine ; le point-virgule préserve l’opposition structurante introduite par Sed.
