  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
translation:
  language: fr
  text: Voilà pourquoi je suis bouleversé. Je commencerai donc à prier devant toi pour moi-même et pour eux, car je vois nos chutes[a], à nous qui habitons la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin est difficile et peut aussi se comprendre comme « nous qui sommes tombés » ou « notre état de chute ».
    reason: Préserver l'ambiguïté syntaxique et sémantique de lapsos nostros sans réduire son sens à de simples fautes ni imposer une interprétation unique.
lexical_decisions:
- source_word: conturbor
  choice: je suis bouleversé
  rationale: Rend le trouble profond exprimé par le passif latin dans un français naturel et digne.
- source_word: orare coram te
  choice: prier devant toi
  rationale: Conserve l’idée de prière faite en présence de Dieu, sans alourdir la formulation.
- source_word: lapsos nostros
  choice: nous sommes tombés
  rationale: L’expression latine est grammaticalement difficile, mais elle évoque plus fortement un état de chute que de simples manquements; cette formulation française reste naturelle sans préciser indûment la nature de la chute.
- source_word: qui inhabitamus
  choice: nous qui habitons la terre
  rationale: Le verbe latin appelle un complément; « la terre », attesté par la tradition textuelle reflétée dans la couche de consultation, explicite le lieu habité.
theological_decisions:
- issue: Portée morale et théologique de lapsos nostros
  choice: nous sommes tombés
  alternative: nos fautes / nos manquements
  rationale: « Tombés » préserve la force du langage de chute et la tension sur l’état humain, tandis que « fautes » ou « manquements » réduirait le propos à des actes particuliers.
- issue: Référent de pro eis
  choice: pour eux
  alternative: pour ceux-là
  rationale: Le pronom est conservé sans identifier davantage son référent, afin de respecter le contexte et l’ambiguïté du latin.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste accessible, avec une légère répétition de « nous » pour préserver l’insistance du texte source.
