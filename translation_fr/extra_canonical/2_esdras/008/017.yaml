- from: Voilà pourquoi je suis bouleversé. Je commencerai donc à prier devant toi pour moi-même et pour eux, car je vois que nous sommes tombés, nous qui habitons la terre.[a]
  to: Voilà pourquoi je suis bouleversé. Je commencerai donc à prier devant toi pour moi-même et pour eux, car je vois nos chutes[a], à nous qui habitons la terre.
