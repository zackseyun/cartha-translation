    reason: Préserver l'ambiguïté syntaxique et sémantique de lapsos nostros sans réduire son sens à de simples fautes ni imposer une interprétation unique.
  revision_rationale: La révision conserve le ton et les choix français solides du projet, mais rend lapsos nostros par un groupe nominal (« nos chutes ») et déplace l'ancre de note sur ce groupe. Cela reflète mieux la forme ambiguë du latin tout en donnant au lecteur les deux principales possibilités de compréhension.
