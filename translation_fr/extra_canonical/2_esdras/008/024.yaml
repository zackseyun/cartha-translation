revisions:
- from: Écoute, Seigneur, la prière de ton serviteur, et prête l’oreille à la supplication de l’être que tu as façonné[a] ; sois attentif à mes paroles. Car, tant que je vivrai, je parlerai, et tant que j’aurai du discernement, je répondrai.
  to: Écoute, Seigneur, la prière de ton serviteur, et prête l’oreille à la supplication de ta créature[a] ; sois attentif à mes paroles. Car, tant que je vivrai, je parlerai, et tant que j’aurai de l’intelligence, je répondrai.
  rationale: La révision remplace une expression française lourde par « ta créature », tout en maintenant dans la note l’image concrète du façonnage présente dans figmentum. Elle rend également sapio par « avoir de l’intelligence », plus englobant et plus proche du latin que « avoir du discernement ».
