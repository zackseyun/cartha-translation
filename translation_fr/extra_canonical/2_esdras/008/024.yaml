  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
translation:
  language: fr
  text: Écoute, Seigneur, la prière de ton serviteur, et prête l’oreille à la supplication de ta créature[a] ; sois attentif à mes paroles. Car, tant que je vivrai, je parlerai, et tant que j’aurai de l’intelligence, je répondrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ton être façonné » ou « de ton ouvrage façonné ».'
    reason: Le latin figmentum évoque ce qui a été formé ou façonné ; « ta créature » en est un rendu français naturel dans ce contexte.
lexical_decisions:
- source_word: auribus percipe
  choice: prête l’oreille
  rationale: Cette expression française naturelle conserve l’image corporelle et la force de l’appel à une écoute attentive.
- source_word: figmenti tui
  choice: de l’être que tu as façonné
  rationale: Cette formulation exprime l’idée d’un être formé par Dieu sans employer le terme trop abstrait « créature » ni le calque maladroit « chose façonnée ».
- source_word: intende
  choice: sois attentif
  rationale: Rend directement l’appel à porter une attention soutenue aux paroles du locuteur.
- source_word: dum sapio
  choice: tant que j’aurai du discernement
  rationale: « Discernement » rend sapio comme capacité de comprendre et de juger, dans un français courant et digne.
- source_word: respondeam
  choice: je répondrai
  rationale: Conserve le sens direct de respondeam et le parallélisme avec « je parlerai ».
theological_decisions:
- issue: L’être humain comme figmentum de Dieu
  choice: l’être que tu as façonné
  alternative: ta créature
  rationale: Le choix retenu garde explicitement l’image biblique du façonnage par Dieu et l’humilité du priant, sans préciser davantage la manière de cette formation.
- issue: Sens de sapio
  choice: avoir du discernement
  alternative: avoir de l’intelligence
  rationale: « Discernement » préserve l’idée d’une faculté de compréhension sans transformer le verset en affirmation doctrinale sur l’intelligence ou la sagesse.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond aux formes latines de deuxième personne et au registre traditionnel de la prière. Le parallélisme des deux dernières propositions est conservé.
