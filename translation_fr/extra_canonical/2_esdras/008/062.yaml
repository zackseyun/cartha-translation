  rationale: Vocatif direct traditionnel et naturel de dominus.
- source_word: demonstrasti mihi
  choice: tu m’as montré
  rationale: Rend directement le parfait latin et le complément indirect.
- source_word: multi-
  choice: beaucoup de
  rationale: Le mot est coupé par la limite éditoriale du verset et se poursuit vraisemblablement dans le suivant. « Beaucoup de » préserve cette continuité syntaxique sans inventer ici le nom manquant.
theological_decisions:
- issue: Objet incomplet après multi- à la limite du verset
  choice: Conserver une phrase ouverte avec « beaucoup de »
