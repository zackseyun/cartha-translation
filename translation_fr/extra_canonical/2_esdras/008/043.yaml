    reason: Signaler honnêtement que la fin de la phrase dépasse le segment latin reproduit dans la demande.
lexical_decisions:
- source_word: pluuiam tuam in tempore
  choice: ta pluie en son temps
  rationale: Reproduit simplement l’expression temporelle et l’adresse directe à Dieu.
- source_word: corruptum fuerit multitudine pluuiae
  choice: s’il est détruit par des pluies trop abondantes
  rationale: Le neutre latin renvoie à l’élément évoqué dans le contexte antérieur, et non à la pluie elle-même. La formulation française conserve ce référent implicite tout en exprimant naturellement l’excès de pluie.
- source_word: Hoc perit
  choice: il périt
  rationale: Rend le constat bref et catégorique du latin sans expliciter davantage le référent.
- source_word: homo
  choice: l’être humain
  rationale: Désigne ici l’humanité ou la personne humaine en général, sans restriction au sexe masculin.
- source_word: manibus tuis plasmatus est
  choice: façonné par tes mains
  rationale: « Façonné » garde l’image concrète du modelage exprimée par plasmatus.
theological_decisions:
- issue: L’être humain comme image de Dieu
  choice: est appelé ton image
  alternative: est ton image
  rationale: « Est appelé » préserve la formulation de la continuation attestée dans la couche de consultation, sans transformer cette désignation en équation ontologique plus forte.
translation_notes:
  register: Français international moderne, sobre et digne. Le verset commence au milieu d’une phrase ; la minuscule initiale conserve cette continuité. Le référent masculin de « il » reste implicite, comme dans le segment latin et son contexte.
