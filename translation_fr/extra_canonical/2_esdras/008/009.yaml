- from: Mais ce qui préserve et ce qui est préservé seront tous deux préservés par ta protection. Et quand le sein maternel rend de nouveau ce qu’il a reçu…
  to: Mais ce qui préserve et ce qui est préservé seront tous deux préservés par ta préservation. Et quand le ventre maternel rend de nouveau…
  rationale: La révision retire l’objet non attesté dans le fragment, emploie « ventre maternel » pour matrix et rétablit, autant que le permet un français naturel, la répétition lexicale qui structure la phrase latine. Les points de suspension signalent uniquement que l’extrait source s’achève au milieu de la proposition.
