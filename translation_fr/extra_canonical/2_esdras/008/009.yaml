  text: But both what preserves and what is preserved will be preserved by your preservation. And when the womb again gives back
translation:
  language: fr
  text: Mais ce qui préserve et ce qui est préservé seront tous deux préservés par ta préservation. Et quand le ventre maternel rend de nouveau…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruat / seruatur / seruabuntur
  choice: préserve / est préservé / seront préservés
  rationale: La répétition du même radical latin est conservée afin de rendre le jeu verbal et le parallélisme du texte source.
- source_word: seruatione tua
  choice: par ta protection
  rationale: « Protection » exprime naturellement en français l’action divine qui garde et maintient en vie, sans la tournure lourde « par ta préservation ».
- source_word: matrix
  choice: le sein maternel
  rationale: Dans ce contexte de gestation, le terme désigne l’utérus ou la matrice; « sein maternel » est une formulation digne et immédiatement compréhensible.
- source_word: reddit
  choice: rend
  rationale: Le verbe garde l’idée littérale de restituer ou rendre ce qui avait été confié au sein maternel.
theological_decisions:
- issue: Nature de ce qui préserve et de ce qui est préservé
  choice: Maintenir les expressions indéterminées « ce qui préserve » et « ce qui est préservé »
  alternative: Identifier explicitement la mère et l’enfant, ou l’utérus et le fœtus
  rationale: Le fragment latin emploie des relatifs neutres et ne précise pas ici les référents; les expliciter résoudrait une ambiguïté que le texte conserve.
- issue: Sens de « seruatione tua »
  choice: « par ta protection »
  alternative: « par ton salut »
  rationale: Le contexte met en avant la conservation de la vie; traduire par « salut » pourrait introduire trop directement une portée sotériologique absente de la formulation immédiate.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme lexical est conservé malgré sa légère étrangeté. Les points de suspension signalent que le verset fourni est syntaxiquement incomplet et se poursuit dans le contexte suivant.
