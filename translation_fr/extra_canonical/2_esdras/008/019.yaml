  text: Therefore hear my voice and understand my words[a][b], and I will speak before you.” The beginning of the words of Ezra’s prayer before he was taken up.
translation:
  language: fr
  text: C’est pourquoi, écoute ma voix et comprends mes paroles, et je parlerai devant toi. Début des paroles de la prière d’Esdras avant qu’il ne soit enlevé.[a]
  philosophy: optimal-equivalence
  footnotes:
