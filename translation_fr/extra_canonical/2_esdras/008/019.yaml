lexical_decisions:
- source_word: Ideo
  choice: C’est pourquoi
  rationale: Rend naturellement la conséquence exprimée par l’adverbe latin.
- source_word: audi meam uocem
  choice: écoute ma voix
  rationale: Conserve l’image concrète et la forme impérative du latin.
- source_word: intellege sermonum meorum
  choice: comprends mes paroles
  rationale: Rend le sens attendu malgré la forme génitive inhabituelle « sermonum » dans le témoin latin.
- source_word: loquar coram te
  choice: je parlerai devant toi
  rationale: Préserve la formulation solennelle et directe de « coram te ».
- source_word: Initium uerborum orationis Ezrae
  choice: Début des paroles de la prière d’Esdras
  rationale: Maintient la forme nominale, sans verbe, de cette rubrique dans le texte latin.
- source_word: adsumeretur
  choice: soit enlevé
  rationale: Exprime le passif latin sans préciser explicitement l’agent ni la destination.
theological_decisions:
- issue: Sens de l’enlèvement d’Esdras
  choice: avant qu’il soit enlevé
  alternative: avant qu’il soit élevé / emporté
  rationale: « Enlevé » conserve l’idée d’une prise ou d’un enlèvement implicite dans « adsumeretur », sans ajouter une interprétation précise sur la manière ou la destination.
- issue: Statut de la dernière proposition
  choice: La conserver comme rubrique nominale dans le corps du texte
  alternative: 'L’intégrer comme une phrase complète : « Voici le début… »'
  rationale: Le témoin latin présente une proposition sans verbe qui paraît être une transition rédactionnelle ou scribale; la traduction en préserve la forme abrupte.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu dans la prière. La dernière proposition demeure volontairement sans verbe afin de refléter son caractère de rubrique.
