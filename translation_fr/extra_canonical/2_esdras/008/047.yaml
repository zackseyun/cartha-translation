  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
translation:
  language: fr
  text: Peux-tu aimer ma création plus que moi ? Mais toi, tu t’es souvent rapproché des injustes. Ne le fais jamais. Pourtant, même en cela, tu seras admirable devant le Très-Haut, parce que tu t’es humilié, comme il convient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: possis diligere
  choice: Peux-tu aimer
  rationale: La forme latine ouvre naturellement une question portant sur la capacité d’Esdras à aimer la création plus que Dieu.
- source_word: meam creaturam
  choice: ma création
  rationale: Rend directement le possessif et le nom collectif latin, dans un français naturel.
- source_word: temetipsum proximasti iniustis
  choice: tu t’es souvent placé près des injustes
  rationale: Le verbe proximare exprime ici le fait de se mettre ou de se tenir près de quelqu’un. Cette formulation conserve l’idée de proximité volontaire sans la transformer en simple comparaison.
- source_word: mirabilis eris
  choice: tu seras admirable
  rationale: Préserve la valeur future et le sens laudatif de mirabilis.
- source_word: humiliasti te
  choice: tu t’es humilié
  rationale: Traduction directe qui garde la portée spirituelle possible du geste sans la préciser davantage.
- source_word: sicut decet
  choice: comme il convient
  rationale: Expression idiomatique française correspondant au jugement de convenance exprimé par le latin.
theological_decisions:
- issue: Rapport entre l’amour d’Esdras pour la création et celui de Dieu
  choice: 'Conserver la question directe : « Peux-tu aimer ma création plus que moi ? »'
  alternative: « Tu ne peux pas aimer ma création plus que moi. »
  rationale: Le latin transmis permet et favorise ici une interrogation. La question conserve la tension rhétorique sans expliciter en affirmation ce qui reste formulé comme un défi.
- issue: Sens de la proximité avec les injustes
  choice: « placé près des injustes »
  alternative: « compté parmi les injustes »
  rationale: Le choix principal reste au plus près de proximasti et évite d’imposer une notion judiciaire ou classificatoire qui n’est pas explicitement formulée.
- issue: Valeur de l’humiliation de soi
  choice: « tu t’es humilié »
  alternative: « tu t’es abaissé »
  rationale: « Humilié » garde l’ambivalence du latin entre abaissement personnel et humilité spirituelle, sans interprétation confessionnelle ajoutée.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe suit le mouvement rhétorique du latin : question, reproche, interdiction, puis éloge nuancé. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.'
