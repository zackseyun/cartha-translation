    rationale: Dans cette construction, praesentibus et futuris sont des datifs pluriels substantivés et visent naturellement des personnes présentes et futures, non les périodes elles-mêmes. Cette note introduit donc une ambiguïté qui n’est pas suffisamment soutenue par le latin.
  - severity: low
