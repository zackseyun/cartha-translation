  text: 'Et respondit ad me et dixit: quae sunt praesentia praesentibus et quae futura futuris. Multum enim tibi restat ut'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/046.yaml
  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
translation:
  language: fr
  text: 'Il me répondit : « Ce qui est présent est pour ceux du temps présent, et ce qui est à venir, pour ceux du temps à venir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respondit ad me et dixit
  choice: 'Il me répondit :'
  rationale: Cette formulation française naturelle rend la réponse et l’introduction du discours sans reproduire le doublet latin « répondit… et dit ».
- source_word: quae sunt praesentia
  choice: Ce qui est présent
  rationale: Le neutre pluriel latin désigne collectivement les réalités présentes ; le singulier collectif est plus naturel en français.
- source_word: praesentibus
  choice: pour ceux du présent
  rationale: Le datif pluriel peut viser ceux qui appartiennent au temps présent. Cette lecture respecte sa forme plurielle et le contraste apocalyptique entre deux groupes.
- source_word: quae futura
  choice: ce qui est à venir
  rationale: Rend l’ellipse de « sunt » et le sens futur de manière idiomatique et parallèle.
- source_word: futuris
  choice: pour ceux de l’avenir
  rationale: Rend le datif pluriel en maintenant le parallélisme avec « ceux du présent », sans préciser davantage l’identité de ces personnes.
theological_decisions:
- issue: Les datifs pluriels praesentibus et futuris peuvent-ils désigner des personnes ou des périodes abstraites ?
  choice: Le texte principal les comprend comme « ceux du présent » et « ceux de l’avenir ».
  alternative: « pour le présent » et « pour l’avenir »
  rationale: La morphologie plurielle favorise une référence à des êtres appartenant respectivement au présent et à l’avenir, mais l’expression latine demeure assez concise pour permettre une lecture temporelle abstraite ; celle-ci est donc conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme de la phrase latine est conservé, tandis que le double verbe introductif est allégé conformément à l’usage naturel du français.
