  source_fidelity: Le latin oppose nettement, par les datifs pluriels substantivés praesentibus et futuris, les personnes du temps présent et celles du temps à venir. La traduction principale va dans cette direction, mais la note propose une lecture abstraite (« pour le présent / l’avenir ») qui ne rend pas la valeur plurielle des datifs et affaiblit ce contraste.
  naturalness: « Ceux du présent » et « ceux de l’avenir » sont compréhensibles, mais restent elliptiques et un peu raides en français moderne. « Ceux du temps présent » et « ceux du temps à venir » est plus naturel tout en gardant le parallélisme concis.
  terminology: Aucun terme théologique technique ne demande d’intervention. « Ce qui est présent » / « ce qui est à venir » rend convenablement les neutres pluriels latins à valeur collective.
