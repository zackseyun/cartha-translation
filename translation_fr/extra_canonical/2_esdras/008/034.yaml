id: 2ES.8.34
reference: 2 Esdras 8:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid est enim homo, ut ei indigneris, aut genus corruptibile, ut ita amariceris de ipso.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: fr
  text: Qu’est-ce donc que l’être humain, pour que tu t’indignes contre lui, ou la race humaine, corruptible, pour que tu sois à ce point rempli d’amertume envers elle ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homo
  choice: l’être humain
  rationale: Rend le latin homo de façon inclusive et naturelle en français moderne, dans une question portant sur la condition humaine.
- source_word: indigneris
  choice: tu t’indignes contre lui
  rationale: Conserve la valeur d’indignation ou de colère dirigée contre l’être humain, ainsi que la forme interrogative au subjonctif latin.
- source_word: genus corruptibile
  choice: la race corruptible
  rationale: Préserve le terme collectif genus et l’idée de mortalité ou de déchéance inhérente à corruptibile, sans réduire explicitement le sens à une seule de ces nuances.
- source_word: ita amariceris de ipso
  choice: tu sois à ce point rempli d’amertume contre elle
  rationale: Exprime l’état d’amertume porté contre le genus, tout en rendant ita par « à ce point » et en évitant une tournure française artificielle.
theological_decisions:
- issue: Nature de la « corruption » humaine
  choice: Conserver « corruptible »
  alternative: « mortelle » ou « corrompue »
  rationale: Le latin corruptibile peut évoquer ce qui est périssable, sujet à la corruption, ou marqué par elle. « Corruptible » maintient cette amplitude sans imposer une lecture uniquement physique ou morale.
- issue: Force de amariceris
  choice: « sois à ce point rempli d’amertume »
  alternative: « sois si amer » ou « sois si irrité »
  rationale: Cette formulation conserve l’image de l’amertume et suggère un état éprouvé, sans la confondre entièrement avec la colère déjà exprimée par indigneris.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle de la phrase latine est conservée. « Race » est employé au sens collectif ancien de lignée ou espèce humaine, en accord avec genus, tandis que les pronoms suivent les référents grammaticaux français.
