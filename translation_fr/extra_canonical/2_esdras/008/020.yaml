  text: And he said[a], “Lord, you who inhabit eternity, whose eyes are exalted and whose heights are in the air,
translation:
  language: fr
  text: 'Et il dit : « Seigneur, toi qui habites l’éternité, dont les yeux sont élevés et dont les hauteurs sont dans les airs,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seculum
  choice: l’éternité
  rationale: Dans cette adresse à Dieu, le terme désigne la durée perpétuelle plutôt qu’un simple siècle ou le monde présent.
- source_word: oculi elati
  choice: les yeux sont élevés
  rationale: Rend directement l’image latine sans préciser de manière interprétative s’il s’agit de hauteur, de majesté ou du regard porté d’en haut.
- source_word: superiora
  choice: les hauteurs
  rationale: Le neutre pluriel désigne les lieux élevés ou les parties supérieures. « Les hauteurs » conserve cette amplitude sans imposer l’interprétation plus précise de « chambres hautes ».
- source_word: in aerem
  choice: dans les airs
  rationale: Expression française naturelle correspondant au domaine aérien ou céleste indiqué par le latin.
theological_decisions:
- issue: Nature des « superiora » de Dieu
  choice: les hauteurs
  alternative: les chambres hautes
  rationale: Le choix retenu préserve l’indétermination du latin et évite d’introduire explicitement une architecture céleste que le terme latin n’énonce pas à lui seul.
translation_notes:
  register: Français moderne, solennel et accessible. La syntaxe relative répétée conserve la forme d’invocation du texte latin. La virgule finale signale que la phrase et la prière se poursuivent au-delà de l’extrait transmis pour ce segment.
