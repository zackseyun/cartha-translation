revisions:
- from: C’est pourquoi de nombreux malheurs accablants frapperont ceux qui habitent le monde dans les derniers temps, parce qu’ils ont vécu dans un grand orgueil. Mais toi, cherche à comprendre ce qui te concerne et interroge-toi au sujet de ceux qui te ressemblent.
  to: C’est pourquoi de nombreux malheurs accablants frapperont ceux qui habitent le monde dans les derniers temps, parce qu’ils ont vécu dans un grand orgueil. Mais pour ta part, comprends et renseigne-toi au sujet de tes semblables.
  rationale: La révision retire les précisions non exprimées par le latin et restitue les deux impératifs finaux comme une exhortation à comprendre et à s’informer. Elle préserve l’ambiguïté de similibus tuis par « tes semblables » et ne requiert aucune note textuelle.
