review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, notamment la conséquence, l’intensification des malheurs, les « derniers temps » et l’orgueil. Toutefois, « cherche à comprendre ce qui te concerne » introduit à la fois une nuance d’effort absente de l’impératif intellege et un objet explicite (« ce qui te concerne ») que le latin ne donne pas. « Interroge-toi » déplace inquire vers l’introspection, alors que de similibus tuis invite à s’informer ou à enquêter au sujet des semblables.
  naturalness: La formulation est globalement fluide et de registre approprié. « Pour ta part, comprends et renseigne-toi au sujet de tes semblables » est à la fois plus idiomatique et plus proche de la concision directive du latin.
  terminology: « De nombreux malheurs accablants », « le monde », « les derniers temps » et « un grand orgueil » sont recevables en français moderne et conservent la portée du texte. « Tes semblables » rend similibus tuis sans résoudre l’identité précise du groupe visé.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « cherche à comprendre ce qui te concerne »
    rationale: Pro te intellege signifie littéralement « pour ta part, comprends » / « toi, comprends ». Le latin ne précise ni « ce qui te concerne » ni une démarche de recherche.
  - severity: medium
    issue: « Interroge-toi » ne rend pas exactement inquire
    rationale: Le verbe latin inquire appelle une investigation ou une demande de renseignements concernant « ceux qui te ressemblent », non un examen intérieur de soi.
  revised_text: C’est pourquoi de nombreux malheurs accablants frapperont ceux qui habitent le monde dans les derniers temps, parce qu’ils ont vécu dans un grand orgueil. Mais pour ta part, comprends et renseigne-toi au sujet de tes semblables.
