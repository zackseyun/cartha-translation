  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
translation:
  language: fr
  text: C’est pourquoi de nombreux malheurs accablants frapperont ceux qui habitent le monde dans les derniers temps, parce qu’ils ont vécu dans un grand orgueil. Mais pour ta part, comprends et renseigne-toi au sujet de tes semblables.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propter quod
  choice: C’est pourquoi
  rationale: Rend explicitement le lien de conséquence avec le contexte précédent.
- source_word: miseriae multae miserabiles
  choice: de nombreux malheurs accablants
  rationale: Préserve l’intensification du latin tout en évitant en français la répétition maladroite « misères misérables ».
- source_word: qui habitant saeculum in nouissimis
  choice: ceux qui habitent le monde dans les derniers temps
  rationale: « Saeculum » désigne ici le monde ou l’âge présent; « dans les derniers temps » rend naturellement « in novissimis » sans préciser davantage son référent.
- source_word: in multa superbia ambulauerunt
  choice: ils ont vécu dans un grand orgueil
  rationale: L’expression sémitisante « marcher dans » décrit la conduite; « vivre dans » est naturel en français et conserve sa portée morale.
- source_word: pro te intellege
  choice: cherche à comprendre ce qui te concerne
  rationale: Restitue l’orientation réfléchie de « pro te » sans suggérer simplement « comprends par toi-même ».
- source_word: de similibus tuis inquire
  choice: interroge-toi au sujet de ceux qui te ressemblent
  rationale: Rend « inquire » comme une invitation à examiner la question et « similibus tuis » sans définir en quoi consiste la ressemblance.
theological_decisions:
- issue: Référent de « in novissimis »
  choice: dans les derniers temps
  alternative: à la fin
  rationale: La formulation retenue conserve l’indétermination temporelle et eschatologique du latin.
- issue: Identité des « similibus tuis »
  choice: ceux qui te ressemblent
  alternative: tes semblables
  rationale: La traduction ne précise pas s’il s’agit de personnes semblables par leur justice, leur condition ou leur destinée, préservant ainsi l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est maintenu pour l’adresse personnelle à Esdras. La syntaxe suit étroitement le mouvement du latin tout en restant idiomatique.
