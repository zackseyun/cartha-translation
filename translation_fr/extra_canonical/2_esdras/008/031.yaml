  text: judged, but love those who have always trusted in your glory. For we and our fathers have lived in mortal ways, but you, however,
translation:
  language: fr
  text: jugés, mais aime ceux qui ont toujours mis leur confiance en ta gloire. Car nous et nos pères avons vécu selon les mœurs des mortels, mais toi…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicati
  choice: jugés
  rationale: Participe passif conservé comme fragment syntaxique, puisque le texte fourni commence au milieu d’une phrase.
- source_word: diligas
  choice: aime
  rationale: Le subjonctif latin dépend vraisemblablement d’une construction précédente absente; l’impératif français restitue naturellement la demande sans compléter le contexte manquant.
- source_word: qui semper in tua gloria confiderunt
  choice: ceux qui ont toujours mis leur confiance en ta gloire
  rationale: Rend explicitement la confiance durable exprimée par semper et confiderunt, tout en conservant «ta gloire» comme objet de cette confiance.
- source_word: mortalibus moribus egimus
  choice: avons vécu selon des habitudes de mortels
  rationale: Egimus décrit ici la manière de mener sa vie; «habitudes de mortels» préserve le lien lexical entre mortalibus et moribus sans imposer l’idée plus interprétative de voies pécheresses.
- source_word: tu autem
  choice: mais toi…
  rationale: Conserve l’opposition et l’inachèvement matériel du texte source; les points de suspension signalent que la proposition se poursuit au-delà de l’extrait.
theological_decisions:
- issue: Portée morale de mortalibus moribus
  choice: habitudes de mortels
  alternative: conduite mortelle / voies de mortels
  rationale: La formulation retenue maintient l’ambiguïté entre condition humaine mortelle et conduite moralement déficiente, sans ajouter explicitement la notion de péché.
- issue: Confiance placée «dans la gloire» divine
  choice: mis leur confiance en ta gloire
  alternative: compté sur ta gloire
  rationale: La traduction garde l’objet inhabituel mais théologiquement significatif du latin, au lieu de le normaliser en confiance «en toi».
translation_notes:
  register: Français moderne, digne et accessible. Le début et la fin restent volontairement fragmentaires conformément à l’extrait latin transmis; aucune matière absente n’est reconstruite.
