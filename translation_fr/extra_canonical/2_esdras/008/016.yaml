lexical_decisions:
- source_word: quod mihi dolet
  choice: ce qui me fait souffrir
  rationale: Rend l’idée de douleur personnelle exprimée par mihi dolet, tout en conservant le lien relatif avec le verset précédent.
- source_word: hereditate tua
  choice: ton héritage
  rationale: Équivalent direct et naturel de hereditas dans ce contexte biblique.
- source_word: propter quam lugeo
  choice: pour lequel je suis en deuil
  rationale: Lugeo exprime une lamentation profonde, souvent associée au deuil.
- source_word: de Israel propter quem tristis sum
  choice: au sujet d’Israël, qui m’attriste
  rationale: Formulation française naturelle qui conserve la tristesse causée par la situation d’Israël.
- source_word: semine Iacob
  choice: la descendance de Jacob
  rationale: Dans ce contexte généalogique et collectif, descendance communique plus clairement le sens de semen que le calque semence.
