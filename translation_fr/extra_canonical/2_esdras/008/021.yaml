  text: incomprehensible, before whom the host of angels stands with trembling, whose preservation is turned into wind and fire, whose word
translation:
  language: fr
  text: saisissable[a], devant qui l’armée des anges se tient en tremblant, eux dont le service se change en vent et en feu, dont la parole
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin transmis porte « saisissable » ou « compréhensible »; certaines traductions comprennent plutôt « insaisissable » ou « incompréhensible », conformément au contexte attendu.
    reason: La leçon source est affirmative, tandis que le contexte et la traduction anglaise consultative suggèrent une possible négation perdue ou une difficulté textuelle.
lexical_decisions:
- source_word: prehensibilis
  choice: saisissable
  rationale: Le latin transmis porte l’adjectif affirmatif prehensibilis, « qui peut être saisi ou compris ». La traduction conserve cette leçon plutôt que d’introduire la négation absente du texte fourni.
- source_word: exercitus angelorum
  choice: l’armée des anges
  rationale: Exercitus désigne une armée ou une multitude organisée; « l’armée des anges » est naturel en français et garde l’imagerie céleste.
- source_word: cum tremore
  choice: en tremblant
  rationale: Cette formulation exprime naturellement l’attitude des anges devant Dieu, sans réduire tremor à une simple émotion abstraite.
- source_word: seruatio
  choice: service
  rationale: Dans ce contexte angélique et parallèlement au vent et au feu, « service » rend vraisemblablement la fonction ou le ministère des anges. « Préservation », bien que possible morphologiquement, produit ici un sens peu cohérent.
- source_word: conuertitur
  choice: se change
  rationale: Le verbe indique une transformation ou un passage à un autre état; « se change en » garde cette force sans la surinterpréter.
- source_word: uerbum
  choice: parole
  rationale: « Parole » est l’équivalent français courant de verbum dans une adresse à Dieu et convient à la proposition laissée en suspens.
theological_decisions:
- issue: Leçon affirmative ou négative de prehensibilis
  choice: saisissable
  alternative: insaisissable / incompréhensible
  rationale: Le texte latin fourni ne contient aucun préfixe négatif. Même si le contexte théologique et la couche anglaise favorisent « incompréhensible », ajouter une négation corrigerait silencieusement la source au lieu d’en préserver la difficulté.
- issue: Nature du rapport des anges au vent et au feu
  choice: leur service se change en vent et en feu
  alternative: leur préservation est changée en vent et en feu
  rationale: La formulation retenue évoque leur ministère sans décider s’il s’agit d’une transformation ontologique des anges ou d’une description fonctionnelle de leur action.
translation_notes:
  register: Fragment syntaxique conservé comme tel, puisqu’il prolonge la phrase des versets voisins. Registre solennel mais actuel; « armée des anges » et « se tient en tremblant » restent immédiatement compréhensibles. Le marqueur [a] figure bien dans le texte principal.
