  text: que cela ne retombe pas sur nous[a]. Mais épargne ton peuple et prends pitié de ton héritage, car tu prends pitié de ta propre création. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La négation qui régit « sur nous » se trouve à la fin du verset précédent dans le texte latin; littéralement : « non, Seigneur, sur nous » (8.44-45).'
    reason: La division en versets sépare une construction syntaxique continue et exige une explicitation en français.
lexical_decisions:
- source_word: super nos
  choice: sur nous
  rationale: Complète la négation de 8.44 et exprime la prière que la conséquence évoquée ne frappe pas les suppliants.
- source_word: parce
  choice: épargne
  rationale: Rend directement l’impératif latin dans un français naturel et digne.
- source_word: haereditati tuae
  choice: ton héritage
  rationale: Conserve l’image biblique du peuple comme héritage de Dieu.
- source_word: creaturae
  choice: création
  rationale: Préserve le sens collectif et la formulation générale du latin.
theological_decisions:
- issue: Portée de la négation avec « super nos »
  choice: « que cela ne retombe pas sur nous »
  alternative: « non sur nous »
  rationale: La négation se trouve dans le verset précédent en latin; sa reprise explicite produit une phrase française autonome tout en préservant le lien syntaxique entre les deux versets.
- issue: Relation entre le peuple, l’héritage et la création
  choice: Maintenir les trois désignations sans les identifier davantage
  alternative: Remplacer « création » par « créatures » ou expliciter qu’il s’agit d’Israël
  rationale: Le latin laisse subsister une tension entre les désignations particulières et générales; la traduction ne doit pas la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, clair et digne. Tutoiement divin cohérent avec l’adresse directe; images bibliques d’« héritage » et de « création » conservées.
