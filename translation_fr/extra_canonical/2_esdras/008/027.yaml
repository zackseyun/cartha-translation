  text: but to those who have kept your covenants with sorrows. Do not think on those who have conducted themselves falsely before you,
translation:
  language: fr
  text: mais à ceux qui ont gardé tes alliances dans la souffrance. Ne pense pas à ceux qui se sont conduits avec fausseté devant toi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamenta
  choice: tes alliances
  rationale: Le pluriel latin désigne ici les engagements d’alliance de Dieu; « alliances » est plus clair et naturel que « testaments » dans ce contexte.
- source_word: cum doloribus
  choice: dans la souffrance
  rationale: Cette formulation française naturelle conserve l’association entre la fidélité et les souffrances, sans préciser abusivement si celles-ci sont le moyen, le contexte ou le prix de cette fidélité.
- source_word: custodierunt
  choice: ont gardé
  rationale: Rend directement l’idée de conserver, observer et demeurer fidèle aux alliances.
- source_word: Neque cogites
  choice: Ne pense pas
  rationale: Traduction directe de l’interdiction, avec le sens contextuel de ne pas porter son attention sur ces personnes.
- source_word: qui in
  choice: ceux qui se sont conduits avec fausseté devant toi
  rationale: Le texte latin fourni s’interrompt après « qui in »; la formulation suit la continuation attestée par la couche anglaise auditée tout en conservant son sens moral sans le renforcer.
theological_decisions:
- issue: Nature des « testamenta »
  choice: alliances
  alternative: testaments
  rationale: Dans une adresse à Dieu concernant ceux qui lui sont restés fidèles, « alliances » exprime le sens religieux du latin sans introduire une conception confessionnelle particulière.
- issue: Rapport entre fidélité et souffrance
  choice: dans la souffrance
  alternative: malgré leurs souffrances / au prix de souffrances
  rationale: Le latin « cum » exprime l’accompagnement sans établir explicitement une relation concessive ou instrumentale; la traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation et la minuscule initiale conservent le caractère fragmentaire du verset, qui se rattache à la phrase précédente; la virgule finale indique sa continuation.
