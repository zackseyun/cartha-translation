source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: inquirendo de multitudine eorum qui pereunt. Nam et ipsi accipientes libertatem spreuerunt altissimum et legem eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/056.yaml
  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
translation:
  language: fr
  text: en cherchant à connaître le grand nombre de ceux qui périssent. Car eux aussi, après avoir reçu la liberté[a], ont méprisé le Très-Haut et sa loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le libre arbitre ».'
    reason: Signale une nuance contextuelle possible de libertatem sans réduire le terme latin à cette seule interprétation.
lexical_decisions:
- source_word: inquirendo
  choice: en cherchant à connaître
  rationale: Rend le gérondif latin et conserve le lien syntaxique avec le contexte précédent, tout en restant naturel en français.
- source_word: multitudine
  choice: le grand nombre
  rationale: Dans ce contexte, multitudo désigne la masse ou le nombre considérable de ceux qui périssent; « grand nombre » est plus idiomatique que « multitude ».
- source_word: libertatem
  choice: la liberté
  rationale: Traduction directe qui préserve la portée du latin sans imposer une interprétation doctrinale précise.
- source_word: spreuerunt
  choice: ont méprisé
  rationale: Exprime le rejet délibéré et dédaigneux indiqué par spernere.
- source_word: altissimum
  choice: le Très-Haut
  rationale: Titre divin français traditionnel, clair et fidèle au superlatif substantivé latin.
theological_decisions:
- issue: Sens de libertatem
  choice: la liberté
  alternative: le libre arbitre
  rationale: Le latin peut évoquer la liberté accordée aux humains, possiblement leur capacité de choisir. Le texte principal conserve le terme général, tandis que la note signale l'interprétation plus précise sans la privilégier.
- issue: Référent de ipsi
  choice: eux aussi
  alternative: ceux-là mêmes
  rationale: « Eux aussi » conserve la valeur additive de et ipsi et renvoie naturellement à ceux qui périssent, sans renforcer indûment l'emphase.
translation_notes:
  register: Français moderne, digne et accessible. L'ouverture en minuscule et la tournure participiale maintiennent le caractère fragmentaire du verset, qui poursuit la phrase précédente.
