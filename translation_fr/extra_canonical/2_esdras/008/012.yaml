  yaml_path: translation/extra_canonical/2_esdras/008/012.yaml
  text: You nourished him with your righteousness, and instructed him in your law, and corrected him by your understanding.
translation:
  language: fr
  text: Tu l’as nourri de ta justice, tu l’as instruit dans ta loi et tu l’as corrigé par ton intelligence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enutristi
  choice: tu l’as nourri
  rationale: Rend directement le verbe latin, qui exprime l’action de nourrir et d’élever.
- source_word: tuae iustitiae
  choice: de ta justice
  rationale: Le génitif latin dépend naturellement de « nourri » et désigne ce dont Dieu l’a nourri ; « justice » conserve la portée morale et théologique de iustitia.
- source_word: erudisti
  choice: tu l’as instruit
  rationale: Équivalent français courant et digne pour l’idée d’enseigner ou de former.
- source_word: in lege tua
  choice: dans ta loi
  rationale: Conserve la préposition et présente la loi comme le domaine ou le contenu de l’instruction.
- source_word: corripuisti
  choice: tu l’as corrigé
  rationale: Préserve l’idée de réprimande corrective sans préciser davantage sa forme.
- source_word: tuo intellectu
  choice: par ton intelligence
  rationale: L’ablatif peut exprimer le moyen ; « intelligence » rend intellectus sans le réduire à la seule sagesse pratique.
theological_decisions:
- issue: Rapport entre la justice divine et l’action de nourrir
  choice: de ta justice
  alternative: dans ta justice
  rationale: Le latin tuae iustitiae est formellement un génitif ; la traduction retenue conserve l’image selon laquelle la justice divine nourrit l’être humain, sans transformer ce rapport en simple cadre locatif.
- issue: Fonction de l’intelligence divine dans la correction
  choice: par ton intelligence
  alternative: avec ton intelligence
  rationale: L’ablatif tuo intellectu se comprend naturellement comme un moyen ou un principe opérant ; « par » exprime cette relation tout en laissant ouverte sa nuance précise.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme ternaire du latin est conservé, ainsi que la répétition des possessifs et des verbes au passé composé.
