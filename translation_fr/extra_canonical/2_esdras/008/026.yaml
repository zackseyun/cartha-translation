  text: erunt. Neque adtendas impie agentium studia, sed qui tua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/026.yaml
  text: but upon those who have served you in truth[a]. Do not pay attention to the pursuits of those who act impiously,
translation:
  language: fr
  text: mais à ceux qui t’ont servi avec fidélité[a]. Ne prête pas attention aux aspirations de ceux qui agissent avec impiété,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vérité ».
    reason: Le latin « in veritate » peut exprimer soit la fidélité et la sincérité, soit, plus littéralement, le fait de servir « dans la vérité ».
lexical_decisions:
- source_word: in veritate (contexte immédiatement antérieur, conservé dans la délimitation anglaise du verset)
  choice: avec fidélité
  rationale: Dans l’expression « servir » quelqu’un, le latin biblique « in veritate » désigne ici une loyauté réelle et sincère; « avec fidélité » est naturel en français tout en préservant la portée morale de l’expression.
- source_word: adtendas
  choice: prête pas attention
  rationale: Rend l’idée de diriger son attention ou sa pensée vers quelque chose, sans l’ambiguïté que pourrait avoir « t’occuper de ».
- source_word: impie agentium
  choice: ceux qui agissent avec impiété
  rationale: Traduction directe qui conserve à la fois l’action exprimée par « agentium » et le caractère religieux et moral d’« impie ».
- source_word: studia
  choice: aspirations
  rationale: Le terme peut désigner les inclinations, les desseins ou les efforts auxquels on s’applique. « Aspirations » garde cette certaine amplitude sans imposer un sens trop précis.
theological_decisions:
- issue: Sens de « in veritate » dans le service rendu à Dieu
  choice: avec fidélité
  alternative: dans la vérité
  rationale: « Avec fidélité » exprime idiomatiquement la loyauté authentique visée dans ce contexte, tandis que « dans la vérité » pourrait être compris comme une référence doctrinale plus précise que ne l’exige le latin.
- issue: Nature des « studia » des impies
  choice: aspirations
  alternative: entreprises
  rationale: Le latin laisse ouverte la question de savoir s’il s’agit surtout de leurs intentions, de leurs préoccupations ou de leurs efforts concrets; « aspirations » préserve mieux cette tension que « entreprises ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase commence et se termine en cours de construction afin de respecter la délimitation transmise du verset. Le marqueur [a] figure bien dans le texte principal.
