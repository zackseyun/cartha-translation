  text: But I have heard the swiftness of the judgment that is to come.
translation:
  language: fr
  text: Mais j’ai entendu parler de la rapidité du jugement à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: audiui
  choice: j’ai entendu parler de
  rationale: En français courant, cette construction exprime naturellement le fait d’avoir reçu des informations au sujet de quelque chose; le calque «j’ai entendu la rapidité» serait peu idiomatique.
- source_word: celeritatem
  choice: la rapidité
  rationale: Rend directement l’idée de célérité ou de promptitude sans préciser davantage la manière dont le jugement surviendra.
- source_word: iudicii
  choice: du jugement
  rationale: Correspond au génitif latin et conserve le sens judiciaire et eschatologique du terme.
- source_word: quod futurum est
  choice: qui va venir
  rationale: Expression française naturelle pour le jugement futur et imminent, sans ajouter de précision temporelle absente du latin.
theological_decisions:
- issue: Nature et temporalité du jugement
  choice: le jugement qui va venir
  alternative: le jugement à venir
  rationale: La formulation retenue garde le caractère futur du jugement et une légère impression d’imminence, tout en évitant de définir son déroulement ou son identité théologique.
translation_notes:
  register: Français moderne, clair et digne. Le fragment initial «terram.» appartient à la phrase précédente et n’est donc pas intégré au verset demandé.
