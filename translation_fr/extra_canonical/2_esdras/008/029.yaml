id: 2ES.8.29
reference: 2 Esdras 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
translation:
  language: fr
  text: Ne désire pas faire périr ceux qui ont vécu comme du bétail, mais porte ton regard sur ceux qui ont enseigné ta loi avec éclat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volueris
  choice: désire
  rationale: Le verbe volo exprime ici la volonté ou le désir; «ne désire pas» reste proche du latin tout en étant naturel dans cette prière.
- source_word: pecorum mores habuerunt
  choice: ont vécu comme du bétail
  rationale: Cette formulation rend idiomatiquement l’idée d’avoir adopté la conduite ou les façons du bétail, sans employer le faux ami moderne «mœurs» dans un sens trop étroit.
- source_word: respicias
  choice: porte ton regard sur
  rationale: Cette expression conserve l’image du regard attentif et favorable portée par respicere dans le contexte.
- source_word: splendide
  choice: avec éclat
  rationale: «Avec éclat» préserve l’idée de distinction, d’excellence et de splendeur, sans préciser indûment si l’adverbe qualifie surtout la manière ou la valeur de l’enseignement.
theological_decisions:
- issue: Contraste entre les personnes à la conduite bestiale et les enseignants de la loi
  choice: Conserver le contraste sans expliquer le fondement du regard favorable demandé
  alternative: Expliciter qu’il s’agit de miséricorde envers tout le peuple à cause des justes
  rationale: Le verset formule une requête sans développer explicitement son mécanisme théologique; la traduction ne doit pas ajouter cette interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme antithétique du latin; l’image animale et celle du regard sont maintenues dans une formulation naturelle.
source_grounding:
  english_pob_role: consult_only
