source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: peregrinationis quoque et saluationis et mercedis receptionis. Quomodo ergo locutus sum, sic et est. Sicut enim agricola
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/039.yaml
  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
translation:
  language: fr
  text: mais je me réjouirai de la formation des justes, ainsi que de leur séjour[a], de leur salut et de la réception de leur récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leur pèlerinage ».
    reason: Le latin « peregrinatio » peut désigner un séjour en terre étrangère, un pèlerinage ou un cheminement; « séjour » conserve l’ambiguïté sans ajouter la précision « ici-bas ».
lexical_decisions:
- source_word: peregrinationis
  choice: de leur séjour ici-bas
  rationale: Le nom latin évoque la condition de l’étranger ou du voyageur et, dans ce contexte, le parcours terrestre des justes. « Séjour ici-bas » exprime ce sens concrètement sans réduire le terme à un voyage matériel.
- source_word: saluationis
  choice: de leur salut
  rationale: Équivalent direct et naturel de « saluationis », avec le possessif rendu explicitement en français d’après le référent implicite, « les justes ».
- source_word: mercedis receptionis
  choice: de la réception de leur récompense
  rationale: 'Cette formulation conserve les deux éléments du latin : la récompense et le fait de la recevoir. Le possessif explicite son rattachement aux justes.'
theological_decisions:
- issue: Référent des génitifs « peregrinationis », « saluationis » et « mercedis receptionis »
  choice: Les rattacher aux justes au moyen de « leur »
  alternative: 'Les rendre comme des notions abstraites : « le séjour, le salut et la réception de la récompense »'
  rationale: La série dépend du référent immédiatement antérieur, les justes. Les possessifs rendent ce lien clair en français sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. « Formation » conserve l’idée de l’acte créateur attachée à la formation des justes; « séjour ici-bas » privilégie une expression naturelle tout en maintenant l’image de la vie terrestre comme séjour provisoire.
