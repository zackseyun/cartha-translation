  register: Français moderne, international et digne. La phrase commence et se termine comme un fragment, conformément au découpage du verset et au texte source. Aucun appel de note n’est requis, car l’ancienne variante anglaise signalée en note appartient au passage précédent et ne traduit pas ce texte latin.
