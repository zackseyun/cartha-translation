  source_fidelity: 'Le texte français traduit fidèlement le latin conservé : « ont piétiné » rend le parfait conculcauerunt, « ses justes » rend iustos eius sans interprétation confessionnelle ajoutée, et la déclaration intérieure est correctement préservée. « alors même qu’ils savent bien » communique de façon naturelle l’insistance de scientes sciunt, tandis que « qu’ils mourront » exprime adéquatement la certitude de quoniam moriuntur dans ce contexte. L’amorce « De même que » conserve, comme le latin Sicut, la dépendance syntaxique envers la suite.'
