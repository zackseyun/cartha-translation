  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
translation:
  language: fr
  text: 'ils ont piétiné ses justes. Ils ont dit dans leur cœur : « Il n’y a pas de Dieu », alors même qu’ils savent bien qu’ils mourront. De même que'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustos eius
  choice: ses justes
  rationale: Rend directement l’expression latine et désigne les personnes reconnues comme justes, sans ajouter « fidèles » ou « élus ».
- source_word: conculcauerunt
  choice: ont piétiné
  rationale: Conserve l’image forte de fouler aux pieds, dans un français naturel.
- source_word: in corde suo
  choice: dans leur cœur
  rationale: Préserve l’anthropologie et la formulation bibliques du raisonnement intérieur.
- source_word: non esse deum
  choice: Il n’y a pas de Dieu
  rationale: Formulation idiomatique de la négation de l’existence de Dieu.
- source_word: et quidem scientes sciunt
  choice: alors même qu’ils savent bien
  rationale: Reproduit naturellement l’insistance de la tournure redoublée latine sans lourdeur littérale.
- source_word: quoniam moriuntur
  choice: qu’ils mourront
  rationale: Dans ce contexte, le présent latin exprime le fait certain et à venir de leur mort; le futur est naturel en français.
- source_word: Sicut
  choice: De même que
  rationale: Maintient l’amorce comparative qui se poursuit au verset suivant.
theological_decisions:
- issue: Portée de « non esse deum »
  choice: « Il n’y a pas de Dieu »
  alternative: « Dieu n’existe pas »
  rationale: La formulation choisie conserve le ton biblique de la déclaration intérieure sans transformer le passage en terminologie philosophique moderne.
- issue: Force emphatique de « scientes sciunt »
  choice: « ils savent bien »
  alternative: « ils savent avec certitude »
  rationale: La solution retenue marque l’emphase tout en restant fluide et sans préciser indûment la nature de cette connaissance.
