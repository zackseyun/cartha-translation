  text: 'est tuo iussu, facili ordine, et utquid fiebat? Et nunc dicens dicam: de omni homine tu magis scis, de populo autem tuo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/015.yaml
  text: 'It is by your command[a], in an easy order, and why was it done? And now I will speak: concerning every man you know better, but concerning your people'
translation:
  language: fr
  text: 'C’est sur ton ordre, selon un ordre aisé[a]. Et pourquoi cela se faisait-il ? Maintenant, je vais parler : tu en sais plus que moi au sujet de tout être humain, mais au sujet de ton peuple…[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans un ordre aisé ». Le sens précis de « facili ordine » est incertain.'
    reason: Préserve l’ambiguïté syntaxique et lexicale de l’expression latine sans ajouter une affirmation contextuelle invérifiable à partir de l’extrait.
  - marker: b
    text: La phrase se poursuit au verset suivant.
    reason: Signale la coupure après « de populo autem tuo » sans importer la suite dans le verset.
lexical_decisions:
- source_word: tuo iussu
  choice: sur ton ordre
  rationale: Rend directement l’ablatif de moyen ou de cause, avec une formulation française naturelle.
- source_word: facili ordine
  choice: selon un ordre facile à suivre
  rationale: « Ordre facile » serait peu idiomatique en français; l’ajout de « à suivre » explicite sobrement l’idée de facilité sans en préciser indûment la nature.
- source_word: utquid
  choice: dans quel but
  rationale: Dans ce contexte interrogatif, le terme demande la raison ou la finalité; « dans quel but » conserve cette portée.
- source_word: dicens dicam
  choice: je vais parler
  rationale: La tournure redoublée peut refléter une insistance sémitique, mais le latin fourni permet aussi une expression simplement emphatique. Le français naturel évite le calque « parlant, je parlerai ».
- source_word: de omni homine tu magis scis
  choice: tu connais mieux que moi tout être humain
  rationale: Le comparatif « magis » appelle un point de comparaison implicite; « que moi » découle du contraste entre l’orateur et Dieu, tout en donnant une phrase française complète.
- source_word: de populo autem tuo
  choice: mais pour ce qui est de ton peuple
  rationale: Rend le changement de thème marqué par « autem » et préserve la phrase suspendue à la fin de l’extrait.
theological_decisions:
- issue: Portée de la connaissance divine dans « tu magis scis »
  choice: tu connais mieux que moi tout être humain
  alternative: tu en sais davantage au sujet de chaque être humain
  rationale: Le texte affirme une connaissance supérieure sans formuler ici une doctrine technique de l’omniscience; la traduction conserve cette retenue.
- issue: Complément absent après « de populo autem tuo »
  choice: laisser la proposition en suspens avec des points de suspension
  alternative: ajouter « pour lequel je souffre » d’après la suite textuelle
  rationale: Le fragment latin fourni s’arrête à « ton peuple ». Ne pas importer les mots du verset suivant respecte les limites de la source tout en signalant que la pensée continue.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé pour l’adresse à Dieu. La syntaxe française est fluidifiée, mais la rupture finale du fragment latin demeure visible.
