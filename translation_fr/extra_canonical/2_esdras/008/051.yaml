  yaml_path: translation/extra_canonical/2_esdras/008/051.yaml
  text: But understand for yourself[a], and seek glory among those like you.
translation:
  language: fr
  text: Mais toi, comprends ce qui te concerne[a] et recherche la gloire parmi tes semblables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comprends pour toi-même ».'
    reason: Le latin « pro te » peut évoquer ce qui concerne le destinataire ou ce qu’il doit comprendre pour lui-même.
lexical_decisions:
- source_word: tu autem
  choice: Mais toi
  rationale: Rend le contraste marqué par « autem » et l’insistance portée par le pronom « tu ».
- source_word: pro te intellege
  choice: comprends ce qui te concerne
  rationale: Expression française naturelle qui conserve l’idée de comprendre pour soi-même ou à son propre sujet, sans transformer l’impératif en simple appel à l’autonomie intellectuelle.
- source_word: de similibus tuis
  choice: parmi tes semblables
  rationale: Rend « de » dans son rapport au groupe constitué par les personnes semblables au destinataire, conformément au sens contextuel retenu par la couche de consultation anglaise.
- source_word: inquire gloriam
  choice: recherche la gloire
  rationale: Traduit directement l’impératif « inquire » et son complément « gloriam », dans un registre digne et courant.
theological_decisions:
- issue: Nature de la gloire recherchée
  choice: la gloire
  alternative: leur gloire / la gloire destinée à tes semblables
  rationale: Le latin donne simplement « gloriam » sans possessif ni bénéficiaire explicite. La traduction conserve donc cette indétermination.
- issue: Rapport exprimé par « de similibus tuis »
  choice: parmi tes semblables
  alternative: au sujet de tes semblables
  rationale: « De » peut avoir plusieurs nuances; « parmi » donne ici une lecture cohérente sans faire des semblables les bénéficiaires de la gloire. L’ambiguïté du latin n’est pas développée en doctrine.
translation_notes:
  register: Français international moderne, sobre et digne. L’apostrophe renforcée « Mais toi » maintient le contraste du latin; « tes semblables » convient au registre sapientiel sans archaïsme excessif.
