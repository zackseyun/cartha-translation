id: 2ES.8.35
reference: 2 Esdras 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in veritate enim nemo de genitis est qui non impie gessit, et de confitentibus qui non deliquit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
translation:
  language: fr
  text: Car, en vérité, parmi ceux qui sont nés, il n’y en a aucun qui n’ait agi avec impiété, et parmi ceux qui confessent[a], aucun qui n’ait péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin transmis dit « ceux qui confessent ». Plusieurs versions anciennes attestent une lecture correspondant à « ceux qui existent », probablement issue du latin consistentibus au lieu de confitentibus.
    reason: Signaler une variante textuelle importante, bien attestée, sans remplacer silencieusement le texte latin de l’édition de référence.
lexical_decisions:
- source_word: in veritate enim
  choice: Car, en vérité
  rationale: Rend à la fois la valeur explicative de « enim » et l’affirmation emphatique de « in veritate » dans un français naturel et digne.
- source_word: de genitis
  choice: parmi ceux qui sont nés
  rationale: Traduction directe qui conserve la portée universelle de l’expression latine.
- source_word: impie gessit
  choice: ait agi avec impiété
  rationale: Conserve la qualification religieuse et morale forte de « impie », sans la réduire au simple fait de mal agir.
- source_word: de confitentibus
  choice: parmi ceux qui confessent
  rationale: Suit le texte latin transmis, « confitentibus », plutôt que d’introduire silencieusement la conjecture « consistentibus ».
- source_word: deliquit
  choice: ait péché
  rationale: Dans ce contexte théologique, « pécher » exprime naturellement l’idée de faute portée par « delinquere ».
theological_decisions:
- issue: Lecture de « confitentibus »
  choice: ceux qui confessent
  alternative: ceux qui existent
  rationale: Le latin édité porte « confitentibus ». La lecture « consistentibus », appuyée par les versions anciennes et le parallélisme, est textuellement plausible, mais elle relève d’une correction conjecturale et doit donc être signalée plutôt qu’insérée sans indication.
- issue: Objet de la confession
  choice: aucun objet ajouté
  alternative: ceux qui te confessent
  rationale: Le latin ne contient aucun pronom correspondant à « te »; ajouter « Dieu » ou « te » résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure parallèle du latin est conservée; le subjonctif passé après « aucun qui ne » restitue naturellement l’énoncé universel.
