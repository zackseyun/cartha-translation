  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
translation:
  language: fr
  text: dont le service se transforme en vents et en feu[a][b], dont la parole est sûre et dont les paroles demeurent, dont l’ordre est ferme et le commandement redoutable,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin porte ici seruatio (« conservation », « préservation »), mais, dans ce contexte angélique, le mot est généralement compris au sens de « service » ou de « ministère ». La traduction suit ce sens contextuel tout en signalant la difficulté du texte.
    reason: textual_variant
  - marker: b
    text: 'Autre traduction proposée : « dont le service est dans le vent et le feu ».'
    reason: previous_rendering
lexical_decisions:
- source_word: conuertitur
  choice: se change en
  rationale: Rend explicitement le verbe latin de transformation, sans réduire l’image à une simple localisation dans le vent et le feu.
- source_word: seruatio
  choice: service
  rationale: Bien que le sens latin ordinaire soit « conservation » ou « préservation », le contexte angélique favorise ici l’idée de service ou de ministère; la difficulté est signalée en note.
- source_word: firmum
  choice: sûre
  rationale: Dans l’expression qualifiant la parole divine, « sûre » exprime sa fermeté et sa fiabilité en français courant.
- source_word: dicta perseuerantia
  choice: les déclarations subsistent
  rationale: Conserve la valeur durative de perseuerantia tout en donnant une formulation française naturelle et solennelle.
- source_word: dispositio fortis
  choice: l’ordonnance est puissante
  rationale: « Ordonnance » préserve l’idée de disposition ou d’ordre établi, tandis que « puissante » rend fortis.
- source_word: iussio
  choice: commandement
  rationale: Rend l’acte d’ordonner avec un terme clair et digne, approprié à l’autorité divine.
theological_decisions:
- issue: Nature du service angélique associé au vent et au feu
  choice: « se change en vent et en feu »
  alternative: « est dans le vent et le feu »
  rationale: La traduction retient le mouvement exprimé par conuertitur et préserve l’allusion cosmologique sans préciser davantage la nature de cette transformation.
- issue: Référents grammaticaux des propositions
  choice: Conserver la succession de « dont » sans explicitation ajoutée
  alternative: Nommer les anges puis Dieu dans le texte
  rationale: Le contexte et les changements de nombre du latin distinguent les référents, mais les nommer ici introduirait une explicitation absente du fragment transmis.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « dont » conserve la structure solennelle de l’invocation. « Subsistent » maintient l’idée de durée sans lourdeur archaïque.
