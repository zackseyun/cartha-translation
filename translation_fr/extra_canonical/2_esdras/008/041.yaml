review_pass:
  verdict: revise
  source_fidelity: Le latin conserve le parallélisme volontaire de saluabuntur (« seront sauvés ») entre les réalités semées et les humains, ainsi que l’opposition non omnia / nec omnia (« pas tout / pas tous »). La traduction de saeculo par « monde », avec la possibilité de « âge » en note, est défendable. En revanche, « permets-moi de parler » interprète loquar comme une demande d’autorisation explicite; le subjonctif latin se rend plus directement et plus sobrement par « que je parle ».
  naturalness: Le français est moderne et la reprise fragmentaire initiale « plante » est légitime, car le texte latin commence au milieu de la comparaison. La formulation « tout ce qui ... ne sera pas » peut se comprendre correctement comme une négation partielle, mais « ce ne sera pas tout ce qui ... » exprime sans ambiguïté le non omnia latin.
  terminology: « Sauvé » / « sauvés » maintient à juste titre la répétition de saluabuntur. « Grâce devant toi » convient à la formule de faveur. « Monde » est naturel pour saeculo, tandis que la note préserve l’autre valeur possible, « âge ».
  issues:
  - severity: medium
    issue: « permets-moi de parler » ajoute une nuance d’autorisation.
    rationale: Loquar est un subjonctif dans la formule « si j’ai trouvé grâce devant toi »; « que je parle » le reflète sans introduire explicitement l’idée que l’interlocuteur doit donner une permission.
  - severity: low
    issue: Portée de la négation rendue potentiellement ambiguë.
    rationale: Le latin non omnia et nec omnia signifient « pas tout / pas tous », non une négation absolue. Une formulation française explicitant cette portée protège le sens.
