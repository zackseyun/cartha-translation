  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
translation:
  language: fr
  text: 'plante, mais ce ne sera pas tout ce qui a été semé qui sera sauvé en son temps, et ce ne sera pas tout ce qui a été planté qui prendra racine. De même, ceux qui ont été semés dans le monde[a] ne seront pas tous sauvés. » Je répondis et dis : « Si j’ai trouvé grâce devant toi, que je parle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’âge ».'
    reason: Le latin saeculum peut désigner le monde présent ou un âge.
lexical_decisions:
- source_word: saluabuntur
  choice: sera sauvé / seront sauvés
  rationale: La répétition de «sauver» conserve le parallèle explicite entre les semences et les êtres humains, malgré son caractère inhabituel dans la première proposition.
- source_word: in tempore
  choice: en son temps
  rationale: Rend étroitement l’expression latine tout en maintenant la perspective agricole du moment propre à la semence.
- source_word: in saeculo
  choice: dans le monde
  rationale: «Monde» est naturel ici et correspond au cadre de l’existence humaine; l’autre sens possible, «âge», est signalé en note.
- source_word: loquar
  choice: permets-moi de parler
  rationale: Dans cette formule de déférence après «si j’ai trouvé grâce», le subjonctif latin exprime naturellement une demande d’autorisation en français.
theological_decisions:
- issue: Répétition sotériologique de saluabuntur
  choice: Employer «sauvé» aussi bien pour ce qui est semé que pour les personnes
  alternative: Traduire le premier emploi par «préservé» ou «survivra»
  rationale: La répétition latine paraît délibérée et relie l’image agricole à l’affirmation concernant le salut humain; la varier atténuerait ce lien.
- issue: Sens de saeculum
  choice: «monde» dans le texte, avec «âge» en note
  alternative: «âge» dans le texte
  rationale: Le latin permet les deux nuances; la traduction principale reste idiomatique sans supprimer l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, digne et accessible. Le début fragmentaire «plante» est maintenu parce que le verset poursuit syntaxiquement la phrase précédente; aucun sujet ni matériau du verset antérieur n’est ajouté.
