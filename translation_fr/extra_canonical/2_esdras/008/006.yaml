  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
translation:
  language: fr
  text: Ô Seigneur, souverain sur nous, si tu permets à ton serviteur de prier devant toi[a] et si tu nous donnes une semence pour le cœur et une culture de l’intelligence, afin qu’il en naisse un fruit grâce auquel puisse vivre tout être corruptible qui…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin dit littéralement : « si tu permets à ton serviteur que nous priions devant toi et que tu nous donnes »; il passe de « ton serviteur » au pluriel « nous ».'
    reason: Préserve et explique le décalage grammatical singulier/pluriel du texte source, que la syntaxe française ne reproduit pas naturellement dans le corps du texte.
lexical_decisions:
- source_word: super nos
  choice: souverain sur nous
  rationale: Rend l’idée d’autorité exprimée par « super » dans un français naturel et solennel, plutôt que par le calque ambigu « au-dessus de nous ».
- source_word: semen cordis
  choice: une semence pour le cœur
  rationale: Conserve l’image agricole et le lien explicite avec le cœur, sans déterminer davantage la nature de cette semence.
- source_word: sensui culturam
  choice: une terre cultivée pour l’intelligence
  rationale: Fait comprendre l’image agricole de « cultura » dans sa coordination avec la semence et le fruit. « Intelligence » rend ici la faculté de comprendre désignée par « sensus ».
- source_word: omnis corruptus
  choice: tout être corruptible
  rationale: Dans ce contexte apocalyptique, l’expression vise l’être soumis à la corruption et à la mortalité, non une personne moralement corrompue.
- source_word: qui
  choice: qui…
  rationale: Le relatif final appartient au texte latin fourni mais ouvre une proposition poursuivie au verset suivant; les points de suspension signalent cette continuité sans supprimer le mot.
theological_decisions:
- issue: Passage du singulier « ton serviteur » au pluriel « nous »
  choice: si tu permets à ton serviteur que nous priions… et que tu nous donnes
  alternative: si tu permets à ton serviteur de prier… et de nous donner
  rationale: Le latin passe délibérément de « servo tuo » au pluriel « oremus » et coordonne les deux subjonctifs « oremus » et « des ». La traduction conserve cette tension grammaticale et communautaire au lieu de l’aplanir.
- issue: Sens de « corruptus »
  choice: corruptible
  alternative: corrompu
  rationale: « Corruptible » préserve l’opposition entre mortalité présente et vie, sans imposer ici une lecture exclusivement morale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement marquée « permets à ton serviteur que nous priions » est maintenue afin de préserver le passage significatif du singulier au pluriel dans la source. Les images agricoles de la semence, de la culture et du fruit sont conservées comme un ensemble cohérent.
