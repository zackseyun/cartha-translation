  text: And you will put him to death as your creature, and you will give him life as your creature.
translation:
  language: fr
  text: Tu le feras mourir comme ta créature, et tu le feras vivre comme ta créature.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni s’interrompt après le second « comme »; « ta créature » est restitué d’après le parallélisme avec la proposition précédente.
    reason: Signaler la lacune de la source fournie tout en indiquant clairement la restitution minimale reprise dans le texte.
lexical_decisions:
- source_word: mortificabis
  choice: tu le feras mourir
  rationale: Rend directement la valeur causative du futur latin sans l’atténuer.
- source_word: uiuificabis
  choice: tu lui rendras la vie
  rationale: Expression française naturelle qui restitue l’idée de faire vivre ou de ramener à la vie.
- source_word: ut tuam creaturam
  choice: en tant que ta créature
  rationale: Conserve le rapport explicite entre l’être humain et Dieu comme créateur, tout en rendant ut de façon intelligible dans ce contexte.
theological_decisions:
- issue: Souveraineté divine sur la mort et la vie de la créature
  choice: Conserver les deux actions directement attribuées à Dieu
  alternative: Employer des formulations indirectes telles que « tu le laisseras mourir »
  rationale: Les futurs actifs mortificabis et uiuificabis présentent Dieu comme sujet direct; une formulation permissive introduirait une distinction absente du texte.
- issue: Complément manquant après le dernier ut dans le texte latin transmis ici
  choice: Restituer « ta créature » d’après le parallélisme immédiat, avec une note
  alternative: Laisser la phrase inachevée après « en tant que »
  rationale: La répétition fournit une phrase française publiable et correspond à la reconstruction reflétée dans la couche de consultation anglaise, tandis que la note signale honnêtement l’état incomplet de la source fournie.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « en tant que ta créature » est conservée pour respecter le parallélisme et ne pas introduire un terme différent.
