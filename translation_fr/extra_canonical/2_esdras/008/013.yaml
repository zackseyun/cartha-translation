  verdict: revise
  source_fidelity: La répétition de « ta créature » suit correctement le parallélisme de tuam creaturam et la restitution adoptée dans la piste d’audit anglaise. Toutefois, uiuificabis signifie littéralement « tu feras vivre / vivifieras »; « tu lui rendras la vie » ajoute l’idée d’un retour à la vie qui n’est pas explicitement imposée par le latin.
  naturalness: « Comme ta créature » est plus idiomatique et moins administratif que la répétition de « en tant que ta créature », tout en conservant le parallélisme voulu.
  terminology: « Créature » rend fidèlement creaturam. « Tu le feras mourir ... tu le feras vivre » conserve le jeu causatif et symétrique de mortificabis / uiuificabis, sans surinterpréter le second verbe.
