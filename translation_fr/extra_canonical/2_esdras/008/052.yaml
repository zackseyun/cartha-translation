review_pass:
  verdict: revise
  source_fidelity: La série passive et l’ordre des réalités eschatologiques sont correctement transmis. Toutefois, « reconnu comme bon » explicite indûment probata par l’ajout de « bon » ; « a été approuvé » rend directement et sans surinterprétation le participe latin. « Apprêtée » est possible pour praeparata, mais « préparée » est plus courant et plus transparent en français international.
  naturalness: Le français est globalement fluide et conserve bien le rythme solennel de l’énumération. « L’abondance a été préparée » et « la bonté a été perfectionnée » sont naturels dans ce registre et évitent respectivement une nuance moins usuelle et une périphrase plus lourde.
  terminology: « Paradis », « arbre de vie », « temps à venir », « abondance », « cité », « repos » et « bonté » sont appropriés. La note anglaise appartient à la désynchronisation antérieure avec le verset 8.51 et ne doit recevoir aucun ancrage dans ce verset.
  issues:
  - severity: medium
    issue: « le repos a été reconnu comme bon » pour probata est requies
    rationale: Probata signifie notamment « éprouvée » ou « approuvée ». La mention explicite de « bon » n’est pas exprimée par le latin et réduit inutilement l’ambiguïté du terme.
  - severity: low
    issue: « l’abondance a été apprêtée » pour praeparata est habundantia
    rationale: Le sens est défendable, mais « apprêter » est moins neutre et moins courant ici que « préparer » en français moderne international.
  revised_text: Car le paradis vous a été ouvert, l’arbre de vie a été planté, le temps à venir a été préparé, l’abondance a été préparée, la cité a été bâtie, le repos a été approuvé, la bonté a été perfectionnée,
