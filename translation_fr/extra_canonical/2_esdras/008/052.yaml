source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
translation:
  language: fr
  text: Car le paradis vous a été ouvert, l’arbre de vie a été planté, le temps à venir a été préparé, l’abondance a été préparée, la cité a été bâtie, le repos a été approuvé, la bonté a été perfectionnée,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vobis enim
  choice: Car… vous
  rationale: « Car » rend la valeur explicative de enim, tandis que « vous » conserve le pluriel de vobis.
- source_word: paradisus
  choice: le paradis
  rationale: Équivalent français direct et naturel du latin paradisus.
- source_word: arbor uitae
  choice: l’arbre de vie
  rationale: Expression biblique consacrée qui reproduit précisément le latin.
- source_word: futurum tempus
  choice: le temps à venir
  rationale: Rend littéralement la dimension future sans imposer le terme théologique plus interprétatif « monde à venir ».
- source_word: habundantia
  choice: l’abondance
  rationale: Conserve le caractère général et ouvert du substantif latin.
- source_word: ciuitas
  choice: la cité
  rationale: « Cité » convient au registre visionnaire et désigne ici la communauté urbaine construite, sans préciser davantage son identité.
- source_word: probata est requies
  choice: le repos a été reconnu comme bon
  rationale: Probata signifie que le repos a été éprouvé, approuvé ou reconnu valable. Cette formulation naturelle exprime l’approbation sans suggérer qu’il aurait simplement été désigné ou fixé.
- source_word: perfecta est bonitas
  choice: la bonté a été menée à sa perfection
  rationale: Rend le passif perfecta est et l’idée d’un accomplissement achevé plus naturellement que « a été perfectionnée ».
theological_decisions:
- issue: Sens eschatologique de futurum tempus
  choice: le temps à venir
  alternative: le monde à venir / l’âge à venir
  rationale: Le latin dit littéralement « le temps futur ». La traduction retenue préserve cette généralité et n’impose ni une cosmologie ni une périodisation particulière.
- issue: Nature de l’approbation du repos
  choice: a été reconnu comme bon
  alternative: a été approuvé / a été éprouvé
  rationale: Probata permet plusieurs nuances. Le choix retenu communique l’évaluation favorable tout en évitant de transformer le repos en décret ou en nomination.
translation_notes:
  register: Français moderne, digne et accessible. La structure cumulative et solennelle de la série latine est conservée, ainsi que la virgule finale indiquant que la phrase se poursuit au verset suivant. Aucun appel de note n’est requis, puisque la note anglaise fournie relève d’une ancienne désynchronisation avec le verset précédent et ne correspond pas au texte latin de 8.52.
