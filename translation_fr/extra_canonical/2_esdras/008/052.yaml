revisions:
- from: Car le paradis vous a été ouvert, l’arbre de vie a été planté, le temps à venir a été préparé, l’abondance a été apprêtée, la cité a été bâtie, le repos a été reconnu comme bon, la bonté a été menée à sa perfection,
  to: Car le paradis vous a été ouvert, l’arbre de vie a été planté, le temps à venir a été préparé, l’abondance a été préparée, la cité a été bâtie, le repos a été approuvé, la bonté a été perfectionnée,
  rationale: La révision maintient la structure cumulative, les passifs et la virgule finale du latin. Elle remplace une explicitation interprétative de probata par son équivalent direct et adopte des formulations plus usuelles sans modifier le sens.
