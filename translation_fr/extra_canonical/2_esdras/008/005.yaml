id: 2ES.8.5
reference: 2 Esdras 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
translation:
  language: fr
  text: Car tu as consenti à obéir et tu t’es mise en route malgré toi[a], puisqu’il ne t’a été accordé de vivre que très peu de temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu es partie malgré toi ».
    reason: La traduction « partie » est également possible pour profecta es et souligne davantage le départ que le commencement d’un parcours.
lexical_decisions:
- source_word: obaudire
  choice: obéir
  rationale: Le verbe latin exprime ici l’écoute qui se traduit par l’obéissance; « obéir » en rend naturellement la force.
- source_word: profecta es
  choice: tu t’es mise en route
  rationale: Parfait de proficiscor, cette expression signifie normalement « partir » ou « se mettre en route », plutôt que « avancer ». Le féminin est conservé, puisque le latin s’adresse à une entité féminine dans le contexte.
- source_word: nolens
  choice: malgré toi
  rationale: Rend de façon idiomatique le participe « ne voulant pas », tout en maintenant le caractère involontaire du départ.
- source_word: spatium ... uiuere
  choice: de vivre ... de temps
  rationale: La tournure française « il ne t’a été accordé de vivre que très peu de temps » transmet naturellement l’idée d’une durée de vie limitée.
theological_decisions:
- issue: Nature du départ évoqué par profecta es
  choice: Conserver l’image générale d’une mise en route
  alternative: Interpréter explicitement comme l’entrée dans la vie ou le départ vers la mort
  rationale: Le latin ne précise pas le point de départ ou la destination; l’expliciter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement et les accords féminins reflètent l’adresse au féminin du texte latin. La répétition lourde de nisi solum est rendue idiomatiquement par la restriction « ne… que ».
