  yaml_path: translation/extra_canonical/2_esdras/008/032.yaml
  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: fr
  text: C’est à cause de nous, pécheurs, que tu es appelé miséricordieux. Car si tu désires avoir pitié de nous, alors tu seras appelé miséricordieux, car nous sommes pécheurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desideraueris
  choice: tu désires
  rationale: Rend directement le désir ou la volonté exprimé par le verbe latin, sans le réduire à une simple éventualité.
- source_word: ut nostri miserearis
  choice: avoir pitié de nous
  rationale: Expression française naturelle qui restitue le sens de misereri avec son complément au génitif.
- source_word: misericors uocaberis
  choice: tu seras appelé miséricordieux
  rationale: Conserve l’idée explicite d’être « appelé » ainsi, au lieu de l’interpréter comme « te montrer miséricordieux ».
- source_word: propter nos peccatores
  choice: car nous sommes pécheurs
  rationale: Restitue l’idée explicite des « pécheurs » et, conformément au sens syntaxique du fragment, l’énonce comme motif de la miséricorde implorée.
theological_decisions:
- issue: Lien entre la miséricorde divine et la condition pécheresse des suppliants
  choice: Conserver l’affirmation paradoxale selon laquelle Dieu sera appelé miséricordieux s’il prend pitié des pécheurs.
  alternative: Reformuler en disant que Dieu manifeste simplement sa miséricorde envers eux.
  rationale: Le latin emploie explicitement uocaberis, « tu seras appelé », et il ne faut pas atténuer la tension rhétorique du propos.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement convient à l’adresse directe à Dieu. La répétition de « car » reflète l’enchaînement argumentatif du latin sans alourdir excessivement la phrase.
