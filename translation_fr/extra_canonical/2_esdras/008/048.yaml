lexical_decisions:
- source_word: mirabilis
  choice: une merveille
  rationale: Le latin exprime ici ce qui suscite l’émerveillement, ce qui est extraordinaire. « Une merveille » conserve cette force mieux que « admirable », qui évoquerait surtout l’approbation morale en français moderne.
- source_word: coram Altissimo
  choice: devant le Très-Haut
  rationale: Rend directement la présence ou le jugement du Très-Haut, tout en conservant le titre divin au superlatif.
