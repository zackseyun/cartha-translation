  text: your work. If therefore you destroy the one who was formed with such great labors[a], why then was he made?
translation:
  language: fr
  text: ton œuvre. Si donc tu fais périr celui qui a été façonné au prix de si grands efforts[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni s’interrompt ici au milieu de la phrase.
    reason: Signaler honnêtement le caractère incomplet de l’unité source sans compléter le texte à partir de la couche anglaise.
lexical_decisions:
- source_word: tuum opus
  choice: ton œuvre
  rationale: Rend directement le fragment nominal latin et maintient son lien avec le contexte précédent.
- source_word: perdideris
  choice: tu fais périr
  rationale: Exprime la destruction ou la perte causée sans ajouter les notions absentes de décret ou de commandement.
- source_word: plasmatus
  choice: façonné
  rationale: Évoque naturellement l’action de former ou de modeler un être.
- source_word: tantis laboribus
  choice: au prix de si grands efforts
  rationale: Rend la grandeur des efforts impliqués dans la formation, en français idiomatique.
theological_decisions:
- issue: Agent implicite de plasmatus
  choice: forme passive sans agent explicité
  alternative: « que tu as façonné »
  rationale: Le latin fourni dit seulement « qui a été façonné »; expliciter Dieu comme agent réduirait inutilement l’ambiguïté grammaticale.
- issue: Suite interrogative absente du texte latin fourni
  choice: ne pas ajouter « pourquoi donc a-t-il été créé ? »
  alternative: reprendre la question de la couche anglaise
  rationale: Cette question ne figure pas dans l’extrait latin transmis; la traduction reste donc strictement fondée sur la source disponible.
translation_notes:
  register: Français moderne, digne et accessible; tutoiement conservé pour l’adresse à Dieu. Les points de suspension signalent l’interruption matérielle de la phrase.
