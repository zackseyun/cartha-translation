  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
translation:
  language: fr
  text: Car les justes[a], qui ont de nombreuses œuvres mises en réserve auprès de toi, recevront leur récompense en raison de leurs propres œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais les justes, qui ont de nombreuses œuvres mises en réserve auprès de toi, recevront leur récompense en raison de leurs propres œuvres. »'
    reason: 'La note conserve l’autre articulation discursive présente dans la tradition de traduction, bien que « enim » favorise ici une valeur explicative : « car ».'
lexical_decisions:
- source_word: Iusti enim
  choice: Car les justes
  rationale: « Enim » introduit ici l’explication qui prolonge le raisonnement du contexte; « car » en rend naturellement la valeur causale en français.
- source_word: quibus sunt operae multae repositae apud te
  choice: pour qui beaucoup d’œuvres sont mises en réserve auprès de toi
  rationale: Cette formulation conserve l’image des œuvres accumulées et gardées auprès de Dieu, ainsi que la relation exprimée par « quibus ».
- source_word: ex propriis operibus recipient mercedem
  choice: recevront leur récompense en raison de leurs propres œuvres
  rationale: « En raison de » exprime que la récompense procède de leurs œuvres, sans durcir davantage la relation précise impliquée par « ex ».
theological_decisions:
- issue: Rapport entre les œuvres des justes et leur récompense
  choice: recevront leur récompense en raison de leurs propres œuvres
  alternative: recevront le salaire produit par leurs propres œuvres
  rationale: Le texte affirme un lien réel entre les œuvres et la récompense. La traduction le préserve sans introduire un système doctrinal plus précis que le latin.
- issue: Valeur discursive de « enim »
  choice: Car
  alternative: Mais
  rationale: La lecture explicative ou causale correspond mieux à « enim » et à l’enchaînement argumentatif, tout en signalant en note l’ancienne possibilité adversative.
translation_notes:
  register: Français moderne, digne et accessible. L’image des œuvres « mises en réserve auprès de toi » est conservée malgré son caractère légèrement marqué, car elle porte une nuance importante du texte source.
