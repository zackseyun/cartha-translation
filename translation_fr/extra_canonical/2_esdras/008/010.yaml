lexical_decisions:
- source_word: in ea creata fuerint
  choice: ce qui a été créé en elle
  rationale: Le relatif neutre pluriel latin se rend naturellement en français par le collectif « ce qui »; « en elle » conserve le référent féminin transmis par le contexte.
- source_word: Imperasti
  choice: tu as ordonné
  rationale: Rend directement le parfait latin et le rapport d’autorité exprimé par imperare.
- source_word: ex ipsis membris
  choice: à partir de ces membres mêmes
  rationale: « À partir de » marque la provenance; « ces membres mêmes » préserve la valeur intensive de ipsis et le lien démonstratif avec les membres déjà évoqués.
- source_word: hoc est
  choice: c’est-à-dire
  rationale: Équivalent français courant de la formule explicative latine.
