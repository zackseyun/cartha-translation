id: 2ES.8.23
reference: 2 Esdras 8:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'terribilis, cuius aspectus arefacit abyssos et indignatio tabescere facit montes et ueritas testificatur : Exaudi, domine, orationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: fr
  text: 'redoutable, toi dont l’apparition dessèche les abîmes, dont l’indignation fait fondre les montagnes et dont la vérité rend témoignage : Écoute, Seigneur, la prière'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  choice: redoutable
  rationale: Rend la crainte suscitée par Dieu dans un registre digne, sans suggérer qu’il serait moralement terrifiant.
- source_word: aspectus
  choice: apparition
  rationale: Exprime ici la manifestation visible ou la présence qui se donne à voir, plutôt qu’un simple « regard ».
- source_word: abyssos
  choice: les abîmes
  rationale: Conserve l’image cosmique du pluriel latin.
- source_word: indignatio
  choice: indignation
  rationale: Préserve le terme fort du texte et sa portée judiciaire, sans l’atténuer en simple colère.
- source_word: tabescere facit
  choice: fait fondre
  rationale: Restitue naturellement en français l’image des montagnes qui se liquéfient ou dépérissent sous l’indignation divine.
- source_word: ueritas testificatur
  choice: la vérité rend témoignage
  rationale: Suit de près la formulation latine et en maintient l’ambiguïté poétique et théologique.
- source_word: Exaudi
  choice: Écoute
  rationale: Dans une prière, signifie écouter favorablement; « Écoute » reste naturel et laisse cette nuance au contexte.
theological_decisions:
- issue: Référent de « cuius » dans la série de propositions relatives
  choice: Employer l’adresse directe « toi dont », puis coordonner les relatives
  alternative: Traduire impersonnellement « dont l’apparition… » après « redoutable »
  rationale: Le contexte est une invocation adressée au Seigneur; « toi dont » rend la syntaxe intelligible en français sans ajouter une identification doctrinale.
- issue: Personnification de la vérité
  choice: Conserver « la vérité rend témoignage »
  alternative: Expliciter « ta vérité témoigne pour toi » ou « ta fidélité l’atteste »
  rationale: Le latin ne précise ni l’objet du témoignage ni un possessif; l’explicitation résoudrait indûment cette tension.
translation_notes:
  register: Français international moderne, solennel mais accessible. La phrase étant un fragment d’une invocation plus longue, l’ouverture en minuscule est conservée; aucune ponctuation finale n’est ajoutée afin de respecter la continuité syntaxique.
