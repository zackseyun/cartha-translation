source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
translation:
  language: fr
  text: 'Il me répondit : « Le Très-Haut a fait cet âge pour un grand nombre, mais l’âge à venir pour un petit nombre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hoc saeculum
  choice: cet âge
  rationale: Rend directement le latin sans ajouter « présent », ce qui préserve la distinction lexicale avec « praesentis saeculi » au verset 3.
- source_word: futurum
  choice: l’âge à venir
  rationale: Le nom « âge » est repris implicitement en latin; son explicitation en français produit une opposition naturelle et claire avec « cet âge ».
- source_word: propter multos ... propter paucos
  choice: pour beaucoup ... pour peu
  rationale: Conserve le parallélisme concis et l’indétermination du latin, sans préciser davantage l’identité des personnes concernées.
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin français consacré, naturel et fidèle au superlatif substantivé latin.
theological_decisions:
- issue: Portée de « pour beaucoup » et « pour peu »
  choice: Maintenir la formulation sans explication
  alternative: Préciser qu’il s’agit du nombre d’êtres humains destinés à chaque âge
  rationale: Le latin reste elliptique et peut susciter une tension théologique; la traduction ne doit pas résoudre cette ambiguïté dans le corps du texte.
translation_notes:
  register: Français moderne, digne et accessible. La formule introductive est allégée en « Il me répondit », équivalent idiomatique de la tournure sémitisante latine « répondit et dit ». Aucun appel de note n’est requis.
