source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tudinem signorum quae incipies facere in nouissimis, sed non demonstrasti mihi quo tempore.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/063.yaml
  text: you have shown me a multitude of signs that you will begin to do in the last times[a], but you have not shown me at what time.”
translation:
  language: fr
  text: Tu m’as montré une multitude de signes que tu commenceras à accomplir dans les derniers temps[a], mais tu ne m’as pas montré à quel moment. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « des signes que tu accompliras dans les derniers temps ».'
    reason: Dans ce latin de traduction, « commencer à faire » peut parfois exprimer simplement une action future.
lexical_decisions:
- source_word: multitudinem signorum
  choice: une multitude de signes
  rationale: Le latin ne possède pas d’article ; l’indéfini français exprime naturellement ici une grande quantité de signes sans présumer qu’un ensemble déjà défini est visé.
- source_word: incipies facere
  choice: tu commenceras à accomplir
  rationale: Cette formulation conserve la valeur inchoative explicite de « incipies » tout en employant « accomplir », naturel en français pour des signes opérés par Dieu.
- source_word: in nouissimis
  choice: dans les derniers temps
  rationale: Le substantif implicite est rendu par l’expression eschatologique française courante, sans préciser davantage ce que le latin laisse sous-entendu.
- source_word: quo tempore
  choice: à quel moment
  rationale: Rend idiomatiquement la question portant sur le moment précis, sans introduire l’idée d’une durée.
theological_decisions:
- issue: Valeur de « incipies facere »
  choice: tu commenceras à accomplir
  alternative: tu accompliras / tu es sur le point d’accomplir
  rationale: Même si cette tournure latine peut parfois servir de futur périphrastique dans une traduction ancienne, le texte conservé dit littéralement « tu commenceras à faire ». La traduction principale préserve cette nuance sans résoudre l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La guillemet fermant est conservé parce que le verset clôt une prise de parole commencée auparavant.
