lexical_decisions:
- source_word: in finem
  choice: à la fin
  rationale: Rend directement la valeur temporelle retenue par le contexte éditorial, tout en signalant en note que la locution latine peut aussi se comprendre autrement.
- source_word: thesaurus inmortalitatis
  choice: le trésor de l’immortalité
  rationale: 'Correspondance naturelle et formellement proche : « thesaurus » désigne un trésor ou une réserve précieuse, et « inmortalitatis » l’immortalité.'
- source_word: Noli ergo adhuc adicere
  choice: Ne continue donc pas à ajouter
  rationale: Conserve l’interdiction, la relation logique marquée par « ergo » et l’idée de poursuite portée par « adhuc »; la formulation reste suspendue comme le fragment latin fourni.
theological_decisions:
- issue: Portée de « immortalitas »
  choice: immortalité
  alternative: incorruptibilité
  rationale: Le latin porte explicitement « inmortalitatis »; « immortalité » préserve ce terme sans lui substituer une notion théologique voisine.
translation_notes:
  register: Français moderne, sobre et digne. La minuscule initiale et les points de suspension reflètent le caractère fragmentaire du texte source fourni, qui commence et s’achève au milieu d’une construction.
