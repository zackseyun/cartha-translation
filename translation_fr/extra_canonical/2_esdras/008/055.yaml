  text: à la fin[a], le trésor de l’immortalité. Ne continue donc pas à ajouter…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à la fin » ou « pour la fin ». Le fragment latin commence au milieu d’une phrase, si bien que le rattachement exact de cette expression à ce qui précède reste incertain.
