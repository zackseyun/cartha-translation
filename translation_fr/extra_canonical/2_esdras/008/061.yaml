  text: I have shown these things to all[a], but to you and to a few like you. And—
translation:
  language: fr
  text: J’ai montré tout cela à tous[a], sauf à toi et à quelques personnes comme toi. Et…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte latin fourni ne comporte pas de négation. Si une négation appartenant au contexte antérieur était retenue, le sens serait : « Je n’ai pas montré tout cela à tous, mais seulement à toi et à quelques personnes comme toi. »'
    reason: Signaler l’alternative contextuelle qui inverse le sens de « nisi », tout en distinguant clairement cette possibilité du sens du fragment latin fourni.
lexical_decisions:
- source_word: omnibus demonstraui
  choice: J’ai montré tout cela à tous
  rationale: Le verbe latin a un objet sous-entendu, rendu naturellement par « tout cela ». « omnibus » signifie ici « à tous » dans le fragment fourni.
- source_word: nisi tibi
  choice: sauf à toi
  rationale: Sans négation exprimée dans le fragment fourni, « nisi » a son sens normal d’exception. Une négation située dans le contexte antérieur permettrait toutefois le sens « mais seulement à toi », d’où la note.
- source_word: tibi similibus paucis
  choice: à quelques autres comme toi
  rationale: Rend clairement le petit nombre de personnes semblables au destinataire sans lourdeur littérale.
- source_word: et re-
  choice: Et…
  rationale: L’édition s’interrompt au début du mot suivant; les points de suspension signalent cette continuation tronquée sans la compléter conjecturalement.
theological_decisions:
- issue: 'Portée de la révélation : à tous ou seulement à quelques-uns'
  choice: 'Le texte principal suit strictement le fragment fourni : « à tous… sauf à toi »'
  alternative: « Je n’ai pas montré tout cela à tous, mais seulement à toi et à quelques autres comme toi »
  rationale: Le fragment latin donné ne contient pas la négation « non », mais la tradition contextuelle et l’ancienne traduction supposent qu’elle précédait « omnibus ». La note conserve donc cette importante ambiguïté textuelle sans corriger silencieusement la source fournie.
translation_notes:
  register: Français international actuel, simple et digne. « Tout cela » restitue l’objet implicite; « quelques autres comme toi » évite une formulation trop littérale. La suspension finale respecte le mot latin tronqué.
