  text: tua imago nominatus, quoniam similatus est, per quem omnia plasmasti, et similasti eum semini agricolae. Non, domine
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/044.yaml
  text: called your image[a], because he has been made like you, through whom you formed all things, and you have likened him to the farmer’s seed. No, Lord
translation:
  language: fr
  text: appelé ton image, parce qu’il a été fait semblable à toi, lui pour qui tu as façonné toutes choses, et tu l’as comparé à la semence du cultivateur. Non, Seigneur…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tua imago nominatus
  choice: appelé ton image
  rationale: Rend explicitement nominatus et conserve la formulation nominale et théologique du latin.
- source_word: similatus est
  choice: il a été fait semblable à toi
  rationale: Le passif exprime le fait de recevoir une ressemblance, sans identifier entièrement l’être humain à Dieu.
- source_word: per quem omnia plasmasti
  choice: lui pour qui tu as façonné toutes choses
  rationale: Dans ce contexte, per quem est compris dans un sens final, « pour qui / en vue de qui », vraisemblablement reflet d’un grec δι’ ὅν; « par qui » ferait de l’être humain l’agent de la création, contrairement au propos du livre.
- source_word: similasti eum semini agricolae
  choice: tu l’as comparé à la semence du cultivateur
  rationale: « Comparé » rend naturellement similasti; « semence du cultivateur » préserve l’image agricole et le rapport génitif.
theological_decisions:
- issue: Rôle de l’être humain dans « per quem omnia plasmasti »
  choice: l’être humain est celui pour qui toutes choses ont été façonnées
  alternative: « par qui tu as façonné toutes choses »
  rationale: L’alternative instrumentale suggérerait que l’être humain est l’agent de la création. Le contexte de 4 Esdras présente plutôt le monde comme créé en vue de l’humanité.
- issue: Portée de l’expression « ton image »
  choice: conserver « appelé ton image » sans développement doctrinal
  alternative: expliciter une doctrine précise de l’image de Dieu
  rationale: Le texte affirme la désignation et la ressemblance, mais n’en définit pas davantage la nature.
translation_notes:
  register: Français moderne, digne et lisible. La rupture finale de l’extrait latin est signalée par des points de suspension, sans ajouter de complément absent de la source.
