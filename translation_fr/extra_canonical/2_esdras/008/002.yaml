source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dicam autem coram te similitudinem, Ezra. quomodo autem interrogas terram et dicet tibi quoniam dabit terram multam magis unde fiat fictile, paruum autem puluerem unde aurum fit,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/002.yaml
  text: But I will set forth a comparison before you[a], Ezra. Just as, if you ask the earth, it will tell you that it yields much clay, from which earthen vessels are made, but little dust from which gold comes[b],
translation:
  language: fr
  text: Mais je vais proposer devant toi une comparaison, Esdras[a]. Si tu interroges la terre, elle te dira qu’elle fournit beaucoup plus d’argile, dont on fait des objets de poterie, mais peu de poussière dont l’or est fait,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vais te dire une comparaison ».
    reason: Signale une traduction plus directe de dicam, tandis que le texte principal conserve aussi la nuance de coram te.
lexical_decisions:
- source_word: Dicam autem
  choice: Mais je vais exposer
  rationale: Rend la transition adversative autem et le futur dicam dans un français naturel; «exposer une comparaison» convient au registre didactique.
- source_word: coram te
  choice: devant toi
  rationale: Conserve explicitement l’idée de présence exprimée par coram te.
- source_word: terram multam magis
  choice: beaucoup plus de terre
  rationale: Préserve la quantité et la valeur comparative de magis, qui souligne la disproportion avec le peu de poussière aurifère.
- source_word: fictile
  choice: de la poterie
  rationale: Le substantif collectif latin désigne ce qui est façonné en argile, notamment les objets ou récipients de terre cuite; «poterie» est naturel et précis ici.
- source_word: puluerem unde aurum fit
  choice: de poussière dont provient l’or
  rationale: Suit l’image du matériau terrestre à partir duquel l’or est obtenu, sans préciser un procédé absent du latin.
theological_decisions:
- issue: Disproportion entre la matière ordinaire et l’or
  choice: Conserver «beaucoup plus» face à «peu»
  alternative: «beaucoup de terre» face à «peu de poussière»
  rationale: La leçon latine contient magis; cette asymétrie prépare la portée de la comparaison sans l’expliciter ni l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement comparatif du latin et sa virgule finale implicite, puisque la pensée se poursuit au verset suivant.
