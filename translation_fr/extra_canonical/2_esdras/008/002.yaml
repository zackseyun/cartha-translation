revisions:
- from: Mais je vais exposer devant toi une comparaison, Esdras[a]. Si tu interroges la terre, elle te dira qu’elle fournit beaucoup plus de terre dont on fait de la poterie, mais peu de poussière dont provient l’or[b],
  to: Mais je vais proposer devant toi une comparaison, Esdras[a]. Si tu interroges la terre, elle te dira qu’elle fournit beaucoup plus d’argile, dont on fait des objets de poterie, mais peu de poussière dont l’or est fait,
  rationale: La révision remplace « terre » par « argile » afin de rendre la matière visée par terram dans son rapport à fictile, améliore légèrement l’idiome français, et restitue directement fit par « dont l’or est fait ». Elle conserve « beaucoup plus », qui rend explicitement magis, ainsi que la ponctuation ouverte puisque la phrase se poursuit au verset suivant.
