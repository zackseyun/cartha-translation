source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
translation:
  language: fr
  text: Et puisque, en donnant la vie, tu donnes maintenant la vie, dans le sein maternel, au corps façonné, et que tu lui procures ses membres, ta création est préservée dans le feu et l’eau ; pendant neuf mois, ta formation porte ta créature, qui y a été créée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin de la dernière proposition est difficile. Littéralement : « pendant neuf mois, ta formation supporte/endure [pour] ta créature qui y a été créée ». « Porte » suit le contexte de la gestation, sans lever toutes les ambiguïtés de la syntaxe transmise.'
    reason: Préserver l’ambiguïté syntaxique et sémantique réelle de patitur et du rapport entre « formation » et « créature », sans proposer une interprétation de continuité absente du texte.
lexical_decisions:
- source_word: uiuificans uiuificas
  choice: en donnant la vie, tu vivifies
  rationale: Conserve la répétition expressive du latin tout en restant naturelle en français.
- source_word: in matrice
  choice: dans le sein maternel
  rationale: Rend le lieu de la gestation en français courant et digne, sans réduire le terme à un vocabulaire anatomique technique.
- source_word: plasmatum corpus
  choice: le corps qui a été façonné
  rationale: Préserve l’image du façonnement exprimée par plasmatum.
- source_word: praestas membra
  choice: tu lui donnes ses membres
  rationale: Exprime clairement que Dieu pourvoit le corps de ses membres.
- source_word: in igni et aqua tua creatio
  choice: ta création est préservée dans le feu et l’eau
  rationale: Tua s’accorde avec creatio, et non avec igni et aqua ; « ta » qualifie donc « création ».
- source_word: tua plasmatio
  choice: l’œuvre que tu façonnes
  rationale: Évite l’abstraction peu naturelle « ton façonnement » tout en conservant l’idée d’une action créatrice en cours.
- source_word: patitur
  choice: porte
  rationale: Dans le contexte de la gestation, « porte » rend le sens de supporter ou porter durant neuf mois, sans effacer entièrement la difficulté du latin.
theological_decisions:
- issue: Agent divin de la formation et de la vivification prénatales
  choice: Maintenir les verbes à la deuxième personne et le possessif « ta création »
  alternative: Employer des tournures impersonnelles décrivant seulement un processus naturel
  rationale: Le latin attribue explicitement à l’interlocuteur divin la vie, la formation, les membres et la préservation.
- issue: Rapport entre la formation et la créature dans la dernière proposition
  choice: « l’œuvre que tu façonnes porte ta créature »
  alternative: « ton façonnement endure ta créature » ou « la formation de ta créature se poursuit »
  rationale: La syntaxe latine transmise est difficile. Le choix suit le contexte gestationnel et le sens possible de patitur, sans transformer le passage en affirmation doctrinale plus précise que la source.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La répétition autour de la vie et l’image du façonnement sont conservées. « Sein maternel » est préféré à « matrice » pour éviter une formulation technique ou vieillie. Le point-virgule clarifie la longue période latine.
