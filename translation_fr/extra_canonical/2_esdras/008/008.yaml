revisions:
- from: Et puisque, en donnant la vie, tu vivifies maintenant dans le sein maternel le corps qui a été façonné et tu lui donnes ses membres, ta création est préservée dans le feu et l’eau ; et pendant neuf mois, l’œuvre que tu façonnes porte ta créature, qui y a été créée.[a]
  to: Et puisque, en donnant la vie, tu donnes maintenant la vie, dans le sein maternel, au corps façonné, et que tu lui procures ses membres, ta création est préservée dans le feu et l’eau ; pendant neuf mois, ta formation porte ta créature, qui y a été créée.[a]
  rationale: La révision conserve la répétition expressive de vivificans vivificas, rend plus directement l’objet de vivificas, et remplace une paraphrase interprétative de tua plasmatio par « ta formation ». La note est reformulée afin de documenter la difficulté textuelle sans surinterpréter le latin.
