lexical_decisions:
- source_word: aspicias
  choice: regarde
  rationale: Le présent de l’impératif français après « Ne » rend naturellement le subjonctif latin employé comme défense ou prière.
- source_word: delicta
  choice: fautes
  rationale: « Fautes » exprime les manquements ou transgressions sans surcharger le terme d’une précision absente du latin.
- source_word: qui tibi in ueritate seruierunt
  choice: ceux qui t’ont servi en vérité
  rationale: Rend directement la proposition relative et conserve la formulation théologique ouverte de « in ueritate ».
theological_decisions:
- issue: Objet implicite après « mais »
  choice: mais ceux qui t’ont servi en vérité
  alternative: mais regarde ceux qui t’ont servi fidèlement
  rationale: Le verbe « regarder » est laissé sous-entendu comme en latin, et « en vérité » préserve plus formellement l’expression « in ueritate » plutôt que de la réduire au seul sens de fidélité.
translation_notes:
  register: Français moderne, simple et digne. La coordination elliptique du latin est conservée de façon naturelle. Aucun ajout provenant de l’ancien découpage du verset 24 n’est intégré.
