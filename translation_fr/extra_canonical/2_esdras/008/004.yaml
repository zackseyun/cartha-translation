  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
translation:
  language: fr
  text: 'Je répondis en disant : « Ô âme, absorbe donc l’intelligence, et qu’elle dévore ce qui est sage[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui a du goût ». Le verbe latin peut évoquer à la fois le goût et la sagesse ou l’intelligence.
    reason: Le latin « sapit » entretient une ambiguïté entre la métaphore alimentaire et le sens intellectuel.
lexical_decisions:
- source_word: absorbe
  choice: absorbe
  rationale: L’impératif latin et l’image d’ingestion sont conservés; « recevoir » effacerait cette métaphore et la force de l’adresse directe.
- source_word: anima
  choice: ô âme
  rationale: Le nominatif latin placé auprès de l’impératif est compris comme un vocatif, sans ajout du possessif « mon », absent du texte.
- source_word: sensum
  choice: l’intelligence
  rationale: Dans ce contexte, « sensum » désigne la faculté de comprendre ou le discernement plutôt que la simple sensation.
- source_word: quod sapit
  choice: ce qui est sage
  rationale: Cette traduction garde la forme relative du latin et le sens intellectuel de « sapere », sans le réduire au nom abstrait « sagesse ».
theological_decisions:
- issue: Passage de l’adresse directe au subjonctif à la troisième personne
  choice: « Ô âme, absorbe… et qu’elle dévore… »
  alternative: « Que l’âme reçoive… et qu’elle dévore… »
  rationale: Le texte latin commence par un impératif direct (« absorbe ») adressé à l’âme, puis emploie le subjonctif à la troisième personne (« devoret »). La traduction préserve cette transition inhabituelle au lieu de l’harmoniser.
translation_notes:
  register: Français moderne, soutenu sans archaïsme excessif. « Je répondis en disant » conserve la formule sémitisante transmise en latin tout en restant intelligible. L’image forte d’absorption et la construction grammaticale abrupte du texte source sont volontairement maintenues.
