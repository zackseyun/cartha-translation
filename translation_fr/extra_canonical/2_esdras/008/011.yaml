  text: mamillis, praeberi lac, fructum mamillarum, Vt nutriatur id quod plasmatum est usque in tempus aliquem, et postea dispones eum tuae misericordiae. Enutristi eum tuae iusticiae et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
translation:
  language: fr
  text: des seins, du lait est donné, fruit des seins, afin que ce qui a été façonné soit nourri pendant quelque temps. Ensuite, tu le dirigeras par ta miséricorde[a]. Tu l’as nourri par ta justice, tu l’as instruit dans ta loi et tu l’as corrigé par ton intelligence,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « tu le confieras à ta miséricorde ».'
    reason: Le datif latin après dispones se comprend probablement comme un moyen (« par ta miséricorde »), en parallèle avec les datifs qui suivent ; une analyse le prenant comme complément de destination reste possible.
lexical_decisions:
- source_word: mamillis, praeberi lac, fructum mamillarum
  choice: des seins, le lait est donné, fruit des seins
  rationale: Conserve la reprise concrète de « mamillae » et la construction fragmentaire héritée du contexte précédent, tout en employant un français naturel.
- source_word: plasmatum est
  choice: a été façonné
  rationale: Rend le vocabulaire de la formation corporelle sans réduire le référent à une simple naissance.
- source_word: dispones eum
  choice: tu le dirigeras
  rationale: Le futur rend la forme latine « dispones »; « diriger » exprime ici l’action d’ordonner et de conduire une personne.
- source_word: corripuisti
  choice: tu l’as corrigé
  rationale: Rend l’idée de correction ou de reprise sans ajouter une nuance punitive absente du contexte immédiat.
theological_decisions:
- issue: Fonction de « tuae misericordiae » après « dispones eum »
  choice: par ta miséricorde
  alternative: tu le confieras à ta miséricorde
  rationale: L’instrumental s’accorde avec les expressions parallèles « tuae iusticiae » et « tuo intellectu »; l’autre analyse syntaxique demeure toutefois possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation maintient le caractère continu de la prière; la virgule finale reflète le fait que la phrase se poursuit dans le verset suivant.
