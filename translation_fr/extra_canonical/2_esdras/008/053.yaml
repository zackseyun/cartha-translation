translation:
  language: fr
  text: La sagesse a été perfectionnée d’avance. La racine a été scellée par vous, la faiblesse a été éteinte par vous, et la mort[a] a été cachée ; le séjour des morts a fui, et
  philosophy: optimal-equivalence
