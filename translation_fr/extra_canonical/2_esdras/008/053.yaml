lexical_decisions:
- source_word: ante perfecta sapientia
  choice: La sagesse a été rendue parfaite d’avance
  rationale: Reproduit le sens temporel de « ante » et le passif de « perfecta », sans transformer l’énoncé en simple qualité de la sagesse.
- source_word: Radix
  choice: La racine
  rationale: Conserve l’image non explicitée du texte latin, sans ajouter « du mal », absent de la source fournie.
- source_word: signata est a uobis
  choice: a été scellée loin de vous
  rationale: 'Dans ce contexte, « a vobis » exprime vraisemblablement l’éloignement ou la séparation : la série décrit ce qui est retiré aux destinataires. Une note préserve l’autre analyse grammaticale possible.'
- source_word: infirmitas extincta est a uobis
  choice: la faiblesse a été supprimée de chez vous
  rationale: Rend « extincta » naturellement et comprend de nouveau « a vobis » comme séparation, conformément au parallélisme contextuel.
- source_word: infernus
  choice: le séjour des morts
  rationale: Désigne le monde des morts sans importer l’idée plus étroite du lieu de châtiment exprimée aujourd’hui par « enfer ».
- source_word: fugit
  choice: a pris la fuite
  rationale: Conserve la personnification et la force du verbe latin.
theological_decisions:
- issue: Sens de « a vobis » dans les deux passifs
  choice: 'Séparation : « loin de vous » / « de chez vous »'
  alternative: 'Agent : « par vous »'
  rationale: L’interprétation séparative donne une série cohérente de maux rendus inaccessibles ou retirés aux élus. Cependant, la construction latine peut formellement désigner un agent ; cette ambiguïté est signalée pour la première occurrence.
- issue: Référent de « radix »
  choice: Maintien de « la racine » sans complément
  alternative: « la racine du mal »
  rationale: Le complément « du mal » est interprétatif et ne figure pas dans le texte latin fourni.
- issue: Traduction de « infernus »
  choice: « le séjour des morts »
  alternative: « l’enfer »
  rationale: Le terme latin peut désigner le domaine des morts en général ; « séjour des morts » évite de préciser indûment sa fonction théologique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les images abruptes et la fin suspendue du verset (« et »), qui se poursuit dans le verset suivant.
