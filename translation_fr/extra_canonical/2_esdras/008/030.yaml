  text: Ils ont enseigné avec éclat. Ne t’indigne pas non plus contre ceux qui sont pires que les bêtes,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: splendide
  choice: avec éclat
  rationale: Rend l’adverbe latin par une expression française naturelle qui conserve l’idée d’excellence ou de caractère remarquable.
- source_word: docuerunt
  choice: ils ont enseigné
  rationale: Correspond directement au parfait actif latin, sans préciser un complément absent du texte fourni.
- source_word: indigneris
  choice: t’indigne
  rationale: Le verbe « s’indigner contre » traduit plus précisément indignari avec le datif que le simple fait de se mettre en colère.
- source_word: bestiis peius sunt
  choice: sont pires que les bêtes
  rationale: Traduction directe et idiomatique de la comparaison latine; « peius » a ici une valeur comparative prédicative.
theological_decisions:
- issue: Nature de la réaction demandée envers les personnes décrites
  choice: Ne t’indigne pas contre
  alternative: Ne te mets pas en colère contre
  rationale: Le choix retenu conserve la nuance morale de l’indignation sans renforcer le texte en y introduisant une condamnation judiciaire.
- issue: Absence de « iudicati » dans le texte latin fourni
  choice: sont pires que les bêtes
  alternative: sont considérés comme pires que les bêtes
  rationale: Le texte source communiqué ne contient pas « iudicati »; la traduction n’ajoute donc aucune idée d’évaluation, de réputation ou de jugement.
translation_notes:
  register: Français moderne, digne et direct. La ponctuation finale conserve la virgule du témoin fourni, ce qui signale que la phrase se poursuit probablement dans le contexte. Le premier énoncé est maintenu parce qu’il figure dans le texte latin transmis, même s’il peut appartenir à la fin de l’unité précédente.
