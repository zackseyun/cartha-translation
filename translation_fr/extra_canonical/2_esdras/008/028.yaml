translation:
  language: fr
  text: mais souviens-toi de ceux qui ont volontairement reconnu la crainte que tu inspires. Ne veuille pas détruire ceux qui se sont comportés comme du bétail[a], mais regarde ceux qui…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui ont eu les manières du bétail ».'
