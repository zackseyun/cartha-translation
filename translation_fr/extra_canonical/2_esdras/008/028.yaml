lexical_decisions:
- source_word: memorare
  choice: souviens-toi de
  rationale: Rend directement l’impératif latin dans un français naturel et digne.
- source_word: ex uoluntate
  choice: volontairement
  rationale: Exprime l’idée d’une reconnaissance faite de plein gré, sans ajouter la notion plus forte d’un choix ponctuel.
- source_word: tuum timorem
  choice: la crainte que tu inspires
  rationale: Fait entendre le génitif objectif — la crainte éprouvée envers Dieu — et évite l’ambiguïté de « ta crainte », qui pourrait désigner une crainte ressentie par Dieu.
- source_word: cognouerunt
  choice: ont reconnu
  rationale: Dans ce contexte, le verbe signifie reconnaître ou admettre la crainte due à Dieu, plutôt que simplement en avoir connaissance.
- source_word: pecorum mores habuerunt
  choice: se sont comportés comme du bétail
  rationale: Restitue l’image déshumanisante du latin en français courant, sans l’affaiblir en simple mention de « mauvaises habitudes ».
- source_word: respicias
  choice: porte ton regard sur
  rationale: Conserve l’appel à l’attention favorable de Dieu que porte le verbe latin.
theological_decisions:
- issue: Sens de « tuum timorem »
  choice: la crainte que tu inspires
  alternative: ta crainte
  rationale: Le contexte vise la crainte révérencielle éprouvée envers Dieu; la formulation retenue l’explicite sans lui substituer une doctrine particulière.
- issue: Portée de « ex uoluntate »
  choice: volontairement
  alternative: de leur propre volonté
  rationale: La solution retenue préserve la responsabilité volontaire sans développer une thèse sur le libre arbitre.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le début en minuscule respecte le caractère continu du fragment fourni. Les points de suspension indiquent que l’unité transmise ici s’interrompt après « ceux qui », comme dans le découpage de consultation, tandis que la source latine poursuit la proposition.
