  text: 'sic et actus praesentis saeculi: Multi quidem creati sunt, pauci autem saluabuntur.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/003.yaml
  text: 'so also is the course of the present age: many indeed have been created[a], but few will be saved.'
translation:
  language: fr
  text: 'Ainsi en va-t-il aussi du cours[a] du monde présent : beaucoup ont certes été créés, mais peu seront sauvés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les actes du monde présent ».'
    reason: Préserve l’alternative de traduction signalée pour le latin actus, sans privilégier une lecture morale dans le texte principal.
lexical_decisions:
- source_word: actus praesentis saeculi
  choice: le cours du monde présent
  rationale: Ici, « actus » désigne le cours ou le fonctionnement de l’époque présente, plutôt que des actes moraux; « monde présent » rend naturellement « praesens saeculum » dans ce contexte eschatologique.
- source_word: Multi quidem creati sunt
  choice: beaucoup ont certes été créés
  rationale: Conserve le parfait passif latin et la nuance concessive de « quidem », reprise par l’opposition avec « mais ».
- source_word: pauci autem saluabuntur
  choice: mais peu seront sauvés
  rationale: Rend directement le futur passif et l’opposition marquée par « autem », sans préciser qui sauve ni résoudre la tension théologique.
theological_decisions:
- issue: Rapport entre création et salut
  choice: 'Maintenir l’affirmation contrastée : beaucoup sont créés, peu seront sauvés.'
  alternative: Atténuer « peu » ou expliciter les conditions du salut.
  rationale: Le latin formule cette tension sans explication; la traduction ne doit ni l’adoucir ni lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. « Ainsi en va-t-il » exprime idiomatiquement « sic » et introduit l’analogie; la ponctuation conserve la progression de la phrase latine.
