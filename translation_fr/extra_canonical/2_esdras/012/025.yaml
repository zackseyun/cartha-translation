lexical_decisions:
- source_word: recapitulabunt
  choice: porteront … à leur comble
  rationale: Dans ce contexte apocalyptique, le verbe exprime l’idée de conduire les impiétés à leur pleine mesure ou à leur point culminant, plutôt que d’en faire simplement le résumé.
- source_word: impietates
  choice: impiétés
  rationale: Équivalent français direct qui conserve la portée religieuse et morale du latin.
theological_decisions:
- issue: Portée de « recapitulabunt »
  choice: porteront ses impiétés à leur comble
  alternative: récapituleront ses impiétés
  rationale: Le choix principal rend naturellement en français l’aboutissement du mal suggéré par le contexte, tandis que la note préserve le sens plus littéral et l’éventuel jeu sur les « têtes » évoquées auparavant.
