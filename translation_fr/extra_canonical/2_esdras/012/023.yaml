source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quiescentia, Haec est interpretatio : in nouissimis eius suscitabit altissimus tria regna et renouabit in ea multa et dominabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
translation:
  language: fr
  text: 'Quant au fait que tu as vu trois têtes au repos, voici l’interprétation : dans ses derniers temps, le Très-Haut suscitera trois royaumes, y renouvellera beaucoup de choses, et ils domineront.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quiescentia
  choice: au repos
  rationale: Rend directement l’état de repos des trois têtes évoquées dans la vision, dans un français naturel.
- source_word: in nouissimis eius
  choice: dans ses derniers temps
  rationale: Conserve le pronom singulier et l’idée eschatologique ou terminale de « nouissimis » sans préciser artificiellement « jours » ou « règne ».
- source_word: suscitabit
  choice: suscitera
  rationale: Reflète l’action du Très-Haut qui fait surgir ou se lever les trois royaumes.
- source_word: regna
  choice: royaumes
  rationale: Équivalent direct du pluriel neutre latin « regna ».
- source_word: renouabit in ea multa
  choice: renouvellera beaucoup de choses en lui
  rationale: Respecte « in ea », féminin singulier en latin, et évite de le rapporter à tort aux trois royaumes, qui exigeraient un pronom pluriel.
- source_word: dominabunt
  choice: exerceront leur domination
  rationale: Rend le sens contextuel de gouverner ou dominer, tout en conservant le sujet pluriel renvoyant aux royaumes.
theological_decisions:
- issue: Référent de « eius » et de « in ea »
  choice: Conserver des pronoms singuliers sans identifier explicitement leur référent dans le corps du texte.
  alternative: Préciser « l’aigle », « la terre » ou « son règne ».
  rationale: Le fragment latin ne tranche pas explicitement le référent. Une explicitation résoudrait une ambiguïté authentique du texte.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « Quant au fait que » assure la continuité avec la description antérieure de la vision. Le démonstratif « ceux-ci » clarifie que le dernier verbe a pour sujet les trois royaumes.
