revisions:
- from: 'Quant au fait que tu as vu trois têtes au repos, voici l’interprétation : dans ses derniers temps, le Très-Haut suscitera trois royaumes, renouvellera beaucoup de choses en lui[a], et ceux-ci exerceront leur domination.'
  to: 'Quant au fait que tu as vu trois têtes au repos, voici l’interprétation : dans ses derniers temps, le Très-Haut suscitera trois royaumes, y renouvellera beaucoup de choses, et ils domineront.'
  rationale: Le seul changement nécessaire remplace « en lui » par « y », afin de ne pas imposer en français un référent masculin que le latin ne précise pas de manière certaine. La note conserve l’information grammaticale indispensable. La reprise de « ils domineront » rend directement dominabunt et garde les trois royaumes comme sujet.
  reviewer_model: gpt-5.6-terra
