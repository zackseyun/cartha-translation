  text: the earth and those who dwell in it, with much oppression, more than all who were before them; therefore they are called the heads
translation:
  language: fr
  text: la terre et ceux qui l’habitent, avec une oppression bien plus grande que celle de tous ceux qui les ont précédés ; c’est pourquoi ce sont eux qui sont appelés les têtes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum labore multo
  choice: avec beaucoup d’oppression
  rationale: Dans ce contexte de domination exercée sur la terre et ses habitants, labor désigne vraisemblablement l’épreuve pénible ou l’oppression plutôt que le simple travail.
- source_word: super omnes qui fuerunt ante hos
  choice: plus que tous ceux qui les ont précédés
  rationale: Rend directement la comparaison latine et explicite naturellement le rapport temporel de ante hos.
- source_word: capita
  choice: les têtes
  rationale: Conserve l’image symbolique des « têtes » dans la vision, sans la remplacer par une interprétation telle que « chefs ».
theological_decisions:
- issue: Valeur de labor dans la description de leur action
  choice: oppression
  alternative: peine / labeur
  rationale: Le contexte semble décrire ce que ces puissances font subir à la terre et à ses habitants. « Oppression » convient donc mieux, tout en évitant d’ajouter une portée doctrinale.
translation_notes:
  register: Français moderne, clair et digne. Le point-virgule maintient le lien causal marqué par propter hoc. Le fragment commence au milieu d’une phrase, d’où la minuscule initiale.
