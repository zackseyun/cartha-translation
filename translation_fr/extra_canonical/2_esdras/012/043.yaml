lexical_decisions:
- source_word: portus
  choice: un port
  rationale: Équivalent direct et naturel de « portus », qui conserve l’image d’un lieu de refuge pour le navire.
- source_word: naui saluatae
  choice: un navire sauvé
  rationale: Rend le datif latin et le participe passif sans ajouter l’idée plus précise d’un navire simplement « arrivé à bon port ».
- source_word: a tempestate
  choice: de la tempête
  rationale: Expression française naturelle qui préserve le sens d’une délivrance hors de la tempête.
