  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: fr
  text: garder ces secrets. Quant à toi, reste encore ici pendant sept autres jours, afin que te soit montré tout ce que le Très-Haut jugera bon de te montrer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruare secreta haec
  choice: garder ces secrets
  rationale: Rend directement l’infinitif latin et son complément. Le fragment commence au milieu d’une phrase, d’où la minuscule initiale conservée.
- source_word: sustine hic
  choice: reste encore ici
  rationale: Dans ce contexte temporel, sustinere exprime le fait de demeurer ou d’attendre sur place plutôt que l’idée de souffrir.
- source_word: alios dies septem
  choice: pendant sept autres jours
  rationale: Formulation française naturelle qui conserve la durée supplémentaire indiquée par alios.
- source_word: quicquid uisum fuerit altissimo
  choice: tout ce que le Très-Haut jugera bon de te montrer
  rationale: L’expression latine signifie littéralement « tout ce qui aura paru bon au Très-Haut ». L’ajout explicatif « de te montrer » reprend le verbe passif de la proposition principale et produit une phrase française claire sans modifier le sens.
theological_decisions:
- issue: Liberté souveraine du Très-Haut quant à la révélation
  choice: tout ce que le Très-Haut jugera bon de te montrer
  alternative: tout ce que le Très-Haut voudra
  rationale: La formulation retenue conserve la nuance de bon plaisir ou de jugement portée par uisum fuerit, sans réduire l’expression à une simple volonté arbitraire.
- issue: Phrase finale de la couche anglaise
  choice: Ne pas ajouter « Et il s’éloigna de moi »
  alternative: Ajouter la phrase de l’anglais POB
  rationale: Cette phrase ne figure pas dans le texte latin fourni pour ce verset; le brouillon suit donc en priorité la source originale indiquée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du latin tout en évitant une tournure artificielle. Le début en minuscule signale que le texte source fourni commence par la fin d’une phrase précédente.
