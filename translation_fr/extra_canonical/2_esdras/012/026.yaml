  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
translation:
  language: fr
  text: qui mèneront à terme ses derniers actes. Quant au fait que tu as vu la plus grande tête disparaître[a], cela signifie que l’un d’eux mourra dans son lit, tout en subissant des tourments. Quant aux deux qui auront survécu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne pas apparaître » ou « ne plus se montrer ».'
    reason: Le latin non apparescens décrit littéralement la tête comme n’apparaissant pas ; « disparaître » est contextuellement naturel, mais légèrement interprétatif.
lexical_decisions:
- source_word: perficient nouissima eius
  choice: mèneront à terme ses derniers actes
  rationale: « Mener à terme » rend la valeur d’achèvement de perficient, tandis que « ses derniers actes » exprime naturellement nouissima eius dans ce contexte.
- source_word: caput maius
  choice: la plus grande tête
  rationale: Le comparatif maius peut désigner la tête plus grande que les autres; le superlatif relatif est idiomatique en français dans ce contexte.
- source_word: non apparescens
  choice: disparaître
  rationale: Dans la description de la vision, l’absence d’apparition de la tête est rendue naturellement comme sa disparition, tout en signalant en note la formulation latine plus littérale.
- source_word: superauerunt
  choice: auront survécu
  rationale: Dans ce contexte concernant les chefs restants, superauerunt désigne ceux qui ont subsisté ou survécu.
