  text: 'uidisti subalares octo coherentes alis eius, Haec est interpretatio : exsurgent enim in ipso octo reges, quorum erunt tempora'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/020.yaml
  text: '“And because you saw eight little wings clinging to its wings, this is the interpretation: eight kings will arise in it,'
translation:
  language: fr
  text: '« Tu as vu huit petites ailes attachées à ses ailes. Voici l’interprétation : car huit rois surgiront en lui, dont les temps seront… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subalares
  choice: petites ailes
  rationale: Le terme désigne des ailes secondaires ou plus petites; cette formulation naturelle conserve l’image sans imposer une identification anatomique trop précise.
- source_word: coherentes
  choice: attachées
  rationale: Rend l’idée qu’elles tiennent aux ailes principales ou y adhèrent.
- source_word: in ipso
  choice: en son sein
  rationale: Le pronom renvoie vraisemblablement à l’entité symbolisée par l’aigle; « en son sein » préserve cette référence sans ajouter un antécédent absent du segment.
- source_word: exsurgent
  choice: surgiront
  rationale: Conserve le mouvement d’apparition et l’orientation prophétique du verbe latin.
- source_word: tempora
  choice: temps
  rationale: Traduction formellement proche, laissant ouverte la nuance entre époques, règnes ou durées.
theological_decisions:
- issue: Identification des huit rois et de l’entité dans laquelle ils surgissent
  choice: Ne pas expliciter l’identité historique ou politique
  alternative: Nommer un empire ou une dynastie précise
  rationale: Le verset donne une interprétation symbolique sans fournir ici une identification explicite; l’ajouter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. La phrase demeure suspendue à la fin, comme le texte source fourni, qui se poursuit après « quorum erunt tempora ».
