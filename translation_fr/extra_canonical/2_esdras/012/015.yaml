  text: For the second who begins to reign will hold power longer[a]
translation:
  language: fr
  text: Car le deuxième qui commencera à régner détiendra, lui, le pouvoir plus longtemps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tiendra davantage ». Le terme de comparaison n’est pas exprimé dans le texte latin de ce verset.'
    reason: Signaler l’ellipse de amplius et préserver l’ambiguïté formelle du texte source.
lexical_decisions:
- source_word: Nam
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’énigme donnée au verset précédent.
- source_word: secundus
  choice: le deuxième
  rationale: Rend directement l’adjectif ordinal substantivé, dans la série des rois évoqués par le contexte.
- source_word: qui incipiet regnare
  choice: qui commencera à régner
  rationale: Conserve la construction temporelle et l’idée d’accession au règne exprimées par le latin.
- source_word: ipse tenebit
  choice: conservera le pouvoir
  rationale: Dans ce contexte royal, tenere désigne le maintien ou l’exercice du pouvoir; le pronom emphatique ipse n’exige pas nécessairement un « lui-même » peu naturel en français.
- source_word: amplius
  choice: plus longtemps
  rationale: L’adverbe comparatif porte vraisemblablement sur la durée du règne. Le complément de comparaison n’est toutefois pas exprimé dans le texte latin fourni.
theological_decisions:
- issue: Complément implicite de « plus longtemps »
  choice: Ne pas préciser le terme de comparaison dans le corps du texte
  alternative: « plus longtemps que chacun des douze »
  rationale: Le latin fourni s’arrête à amplius et laisse le complément comparatif inexprimé. L’ajouter résoudrait une ellipse à partir du contexte ou d’une segmentation différente du passage, plutôt que de traduire seulement le texte transmis ici.
translation_notes:
  register: Français moderne, clair et digne. « Conservera le pouvoir » explicite naturellement l’emploi politique de tenebit, tandis que la note maintient visible la formulation plus littérale et son caractère elliptique.
