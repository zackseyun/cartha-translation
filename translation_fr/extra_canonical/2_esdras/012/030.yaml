  source_fidelity: 'La fin du verset rend fidèlement le latin : « finem suam » est exprimé de façon intelligible par « la fin de ce royaume », sans charger le texte d’une interprétation eschatologique; « regnum exile » est bien rendu par « royaume ... de peu d’importance »; et « turbationis plenum » par « plein de troubles ». La portion antérieure suit fidèlement la formulation contextuelle attestée dans la piste d’audit anglaise.'
