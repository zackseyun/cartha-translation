  text: finem suam, hoc erat regnum exile et turbationis plenum, Sicut
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: fr
  text: '« Quant aux deux petites ailes que tu as vues passer vers la tête située à droite, voici ce qu’elles signifient : ce sont ceux que le Très-Haut a gardés en vue de la fin de ce royaume. Ce royaume fut de peu d’importance et plein de troubles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: finem suam
  choice: la fin de ce royaume
  rationale: Le possessif latin renvoie vraisemblablement au royaume représenté dans la vision. L’explicitation par « ce royaume » est plus claire et naturelle en français que « sa fin », dont l’antécédent pourrait sembler être le Très-Haut ou les personnages.
- source_word: regnum exile
  choice: Ce royaume fut de peu d’importance
  rationale: L’adjectif latin « exilis » évoque ce qui est faible, maigre ou peu considérable. Cette traduction conserve cette idée sans lui imposer exclusivement le sens temporel de « bref ».
- source_word: turbationis plenum
  choice: plein de troubles
  rationale: Rend directement l’idée d’un règne marqué par l’agitation, le désordre et les bouleversements, dans un français courant et digne.
theological_decisions:
- issue: Référent de « suam » dans « finem suam »
  choice: La fin du royaume
  alternative: La fin en général, ou la fin des personnages préservés
  rationale: Le contexte interprète les derniers dirigeants du royaume figuré par l’aigle. Le rattachement au royaume est le plus cohérent, tout en évitant d’introduire une précision doctrinale sur la fin des temps.
- issue: Nature de la faiblesse du royaume
  choice: Peu d’importance
  alternative: Bref / de courte durée
  rationale: Le latin « exile » souligne d’abord la faiblesse ou le peu d’envergure. La brièveté est contextuellement possible, mais elle ne doit pas être imposée comme l’unique valeur du terme.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. La première partie du verset suit le contexte transmis par la couche anglaise auditée, tandis que les choix décisifs de la fin du verset sont fondés sur le latin fourni.
