id: 2ES.12.32
reference: 2 Esdras 12:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
translation:
  language: fr
  text: Voici l’Oint[a], que le Très-Haut a réservé pour la fin contre eux et leurs actes d’impiété[b]. Il leur reprochera leurs injustices et mettra sous leurs yeux leurs marques de mépris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin unctus signifie littéralement «oint». Dans cette vision, ce personnage agit comme le libérateur de la fin des temps: il réprimande le royaume de l’aigle et délivre le reste. Le titre a donc une portée messianique, même si le texte principal en conserve la forme littérale.'
    reason: messianic_passage
  - marker: b
    text: 'Une version antérieure, décalée par rapport au texte latin de ce verset, donnait ici : «Et le lion que tu as vu s’élancer de la forêt, rugir, parler à l’aigle et lui reprocher ses injustices et toutes ses paroles, comme tu l’as entendu…»'
    reason: previous_rendering
lexical_decisions:
- source_word: unctus
  choice: l’Oint
  rationale: Rend littéralement le participe substantivé latin tout en conservant sa portée messianique dans le contexte de la vision.
- source_word: reservavit
  choice: a réservé
  rationale: Exprime précisément l’idée d’une personne gardée en réserve par le Très-Haut en vue du temps fixé.
- source_word: impietates
  choice: actes d’impiété
  rationale: Le pluriel latin désigne ici des manifestations concrètes d’impiété; cette formulation est plus naturelle en français que «leurs impiétés».
- source_word: arguet
  choice: reprochera
  rationale: Conserve l’idée de réprimande et de mise en accusation sans imposer un cadre judiciaire plus précis que le latin.
- source_word: infulciet coram ipsis
  choice: mettra sous leurs yeux
  rationale: Rend idiomatiquement l’action d’imposer à leur attention, en leur présence, ce qui leur est reproché.
- source_word: spretiones
  choice: marques de mépris
  rationale: Le pluriel est conservé sous une forme française naturelle et désigne leurs manifestations répétées de mépris.
theological_decisions:
- issue: Portée messianique de «unctus»
  choice: l’Oint
  alternative: le Messie
  rationale: «L’Oint» reste proche du latin et laisse le contexte porter la valeur messianique, sans transformer silencieusement le titre en interprétation explicite.
- issue: Sens de «ad eos et impietates ipsorum»
  choice: contre eux et leurs actes d’impiété
  alternative: vers eux et leurs actes d’impiété
  rationale: Dans ce contexte de réprimande eschatologique, «contre» exprime le mouvement hostile ou judiciaire de la préposition tout en conservant les deux objets du latin.
translation_notes:
  register: Français international moderne, digne et accessible. «Voici l’Oint» garde la solennité de l’identification visionnaire; les formulations concrètes «actes d’impiété» et «marques de mépris» évitent des pluriels abstraits peu naturels.
