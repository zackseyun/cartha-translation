  yaml_path: translation/extra_canonical/2_esdras/012/005.yaml
  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
translation:
  language: fr
  text: Je suis très faible en esprit, et je n’ai même pas la moindre force, à cause de la grande peur qui m’a terrifié cette nuit. Maintenant donc, je prierai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiritu meo inualidus sum ualde
  choice: Je suis extrêmement faible dans mon esprit
  rationale: Reproduit directement l’idée d’une profonde faiblesse intérieure sans réduire spiritu à un simple état psychologique.
- source_word: nec modica est in me uirtus
  choice: il ne me reste pas même un peu de force
  rationale: Dans ce contexte, uirtus désigne la force ou la vigueur; la tournure française exprime naturellement l’absence totale de force.
- source_word: a multo timore
  choice: à cause de la grande peur
  rationale: La préposition a indique ici la cause, et multo marque l’intensité ou l’ampleur de la peur.
- source_word: expaui
  choice: m’a terrifié
  rationale: Le parfait de expauescere évoque une terreur intense et soudaine; «terrifié» en conserve la force mieux que «ressenti».
- source_word: Nunc ergo orabo
  choice: Maintenant donc, je prierai
  rationale: Rend le futur latin et le lien logique exprimé par ergo.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de «force/faible» reflète le parallélisme du latin, tandis que «qui m’a terrifié» préserve l’intensité de expaui.
