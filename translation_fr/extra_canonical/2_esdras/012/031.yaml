  text: as you saw. And the lion that you saw rousing itself from the forest[a], roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—
translation:
  language: fr
  text: comme tu l’as vu. Quant au lion que tu as vu s’éveiller et surgir de la forêt, rugir, parler à l’aigle et dénoncer ses injustices ainsi que tous ses propos, comme tu l’as entendu —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: euigilantem
  choice: s’éveiller
  rationale: Rend directement l’idée du lion qui sort de son sommeil ou de son repos, sans ajouter qu’il quitte la forêt.
- source_word: mugientem
  choice: rugir
  rationale: Le latin signifie littéralement « pousser un mugissement », mais le cri naturel du lion se rend en français courant par « rugir ».
- source_word: arguentem
  choice: reprocher
  rationale: Exprime ici une dénonciation accusatrice adressée directement à l’aigle.
- source_word: iniustitias
  choice: injustices
  rationale: Conserve le pluriel et la portée morale du terme latin.
- source_word: sermones
  choice: propos
  rationale: Dans ce contexte, le mot désigne les paroles prononcées par l’aigle plutôt qu’un discours religieux ou des « sermons ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suspendue et le tiret final sont maintenus, car l’explication de la vision se poursuit au verset suivant. Le début fragmentaire « comme tu l’as vu » reflète le découpage du texte source.
