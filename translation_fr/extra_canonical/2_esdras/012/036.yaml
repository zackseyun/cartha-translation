  rationale: Rend directement le parfait latin sans ajouter l’idée d’avoir été « jugé » ou « trouvé » digne.
- source_word: scire
  choice: connaître
  rationale: Dans ce contexte, l’infinitif exprime l’accès à la connaissance d’un secret.
- source_word: altissimi
  choice: du Très-Haut
  rationale: Titre divin français traditionnel, naturel et fidèle au superlatif substantivé latin.
- source_word: secretum hoc
  choice: ce secret
  rationale: Conserve le démonstratif et le sens direct du substantif latin.
theological_decisions:
- issue: Nature de la dignité accordant l’accès au secret
  choice: as été digne
  alternative: as été jugé digne
  rationale: Le latin affirme simplement « dignus fuisti » et ne précise ni qui porte un jugement ni le processus par lequel cette dignité est reconnue.
translation_notes:
  register: Formulation moderne, sobre et digne. L’ordre « toi seul » maintient l’insistance exclusive du latin sans alourdir la phrase.
