  text: Therefore I will pray to the Most High, that he may strengthen me to the end.”
translation:
  language: fr
  text: Je prierai donc le Très-Haut afin qu’il me fortifie jusqu’à la fin.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimum
  choice: le Très-Haut
  rationale: Rend le titre divin latin par son équivalent français traditionnel, clair et actuel.
- source_word: confortet
  choice: me fortifie
  rationale: Exprime l’idée de donner de la force ou d’affermir, sans employer le faux ami moderne «conforter».
- source_word: usque in finem
  choice: jusqu’à la fin
  rationale: Conserve la portée temporelle et l’éventuelle ambiguïté de «la fin», sans en préciser artificiellement le référent.
- source_word: ut
  choice: afin que
  rationale: Marque naturellement en français la proposition de but introduite par ut.
theological_decisions:
- issue: Référent de «la fin»
  choice: Maintien de l’expression ouverte «jusqu’à la fin»
  alternative: Préciser «jusqu’à la fin de ma vie» ou «jusqu’au bout»
  rationale: Le latin ne précise pas de quelle fin il s’agit; la traduction préserve donc cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. «Je prierai donc» suit la continuité discursive attestée par le texte de consultation, tandis que la portion latine fournie commence au milieu de la proposition. Guillemets français resserrés conformément à la présentation du verset isolé.
