lexical_decisions:
- source_word: sed tamen
  choice: mais
  rationale: Le contraste porté par « sed tamen » est rendu naturellement par « mais »; ajouter « pourtant » alourdirait ici la phrase sans gain de sens.
- source_word: et hic
  choice: celui-ci aussi
  rationale: '« hic » désigne cet individu, tandis que « et » a ici une valeur additive: « aussi ».'
- source_word: gladio
  choice: par l’épée
  rationale: L’ablatif exprime le moyen ou l’instrument de sa chute.
- source_word: in nouissimis
  choice: dans les derniers temps
  rationale: L’expression temporelle désigne la période finale; cette formulation conserve sa portée eschatologique sans préciser davantage que le latin.
- source_word: Et quoniam uidisti
  choice: Et puisque tu as vu
  rationale: Traduction directe de la proposition causale qui se poursuit dans le verset suivant.
theological_decisions:
- issue: Portée eschatologique de « in nouissimis »
  choice: dans les derniers temps
  alternative: à la fin
  rationale: « Dans les derniers temps » préserve l’expression temporelle plurielle et sa tension eschatologique sans déterminer artificiellement un moment unique.
