  text: And it happened, when all the people heard that seven days had passed and I had not returned to the city, that all of them gathered together, from the least to the greatest, and came to
translation:
  language: fr
  text: Il arriva que tout le peuple apprit que sept jours s’étaient écoulés et que je n’étais pas revenu dans la ville. Tous se rassemblèrent alors, du plus petit au plus grand, et vinrent vers
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pertransierunt septem dies
  choice: sept jours s’étaient écoulés
  rationale: Rend naturellement en français l’idée que les sept jours étaient entièrement passés.
- source_word: a minimo usque ad maximum
  choice: du plus petit au plus grand
  rationale: Conserve l’expression inclusive et son ordre, sans préciser artificiellement s’il s’agit de l’âge, du rang ou de l’importance.
- source_word: ad
  choice: vers
  rationale: La préposition ouvre une proposition qui se poursuit au verset suivant; « vers » préserve cette continuité sans ajouter un complément absent.
