translation_notes:
  register: Français moderne, clair et digne. La phrase demeure volontairement inachevée, comme le texte source fourni, qui se poursuit après « ad ». Le fragment initial « ostendere tibi. Et profectus est a me. » appartient manifestement à la fin du contexte précédent; conformément à la délimitation indiquée par l’anglais audité, la traduction du présent verset commence à « et factum est ».
