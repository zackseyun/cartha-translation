  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
translation:
  language: fr
  text: 'Alors je me réveillai d’un grand égarement de l’esprit et d’une grande frayeur[a], et je dis à mon esprit : « Voici, tu m’as fait subir ces choses parce que'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une grande transe de l’esprit ». Le latin peut désigner un état d’extase ou de saisissement de l’esprit.'
    reason: Préserver l’ambiguïté de excessus mentis sans modifier la coordination avec « d’une grande frayeur ».
lexical_decisions:
- source_word: a multo excessu mentis
  choice: sortant d’un profond bouleversement intérieur
  rationale: L’expression latine excessus mentis désigne ici un état mental hors de l’ordinaire lié à la vision; « bouleversement intérieur » reste naturel en français sans imposer le sens plus précis de « transe ».
- source_word: uigilaui
  choice: je me réveillai
  rationale: Le verbe signifie ici revenir à l’état de veille après l’expérience visionnaire.
- source_word: spiritui meo
  choice: à mon esprit
  rationale: Traduction directe qui conserve la manière inhabituelle dont le narrateur s’adresse à son propre esprit.
- source_word: praestitisti haec mihi
  choice: tu m’as fait subir ces choses
  rationale: Dans ce contexte, praestare avec le datif peut exprimer ce que l’esprit a causé ou imposé au narrateur; « ces choses » préserve le pluriel neutre haec.
- source_word: in eo quod
  choice: parce que
  rationale: La locution introduit la proposition causale qui se poursuit au verset suivant; la phrase reste donc volontairement inachevée.
theological_decisions:
- issue: Nature de l’excessus mentis
  choice: profond bouleversement intérieur
  alternative: profonde transe
  rationale: Le latin peut évoquer une extase ou une transe visionnaire aussi bien qu’un profond désarroi mental. Le texte principal évite de préciser davantage que la source, tandis que la note signale l’autre lecture.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe suspendue après « parce que » reproduit la coupure du fragment latin et son prolongement attendu.
