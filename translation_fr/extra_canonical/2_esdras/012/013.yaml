translation:
  language: fr
  text: sur la terre, et elle sera plus redoutable que tous les royaumes qui l’ont précédée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super terram
  choice: sur la terre
  rationale: Rend directement la locution latine et conserve ce début de verset, qui poursuit la phrase du contexte précédent.
- source_word: timoratio omnium regnorum
  choice: la terreur de tous les royaumes
  rationale: Suit le texte latin fourni, où « timoratio » est compris comme un substantif désignant ce qui inspire la terreur, sans introduire un comparatif absent de cette forme du texte.
- source_word: quae fuerunt ante eam
  choice: qui l’ont précédée
  rationale: Formulation française naturelle qui conserve la référence féminine de « eam » au royaume ou à la puissance évoquée dans le contexte.
theological_decisions:
- issue: Valeur de « timoratio » et possibilité d’une lecture comparative
  choice: elle sera la terreur de tous les royaumes
  alternative: elle sera plus redoutable que tous les royaumes qui l’ont précédée
  rationale: Le texte latin fourni porte « timoratio », qui favorise une construction nominale. La traduction comparative suppose la lecture « timoratior » attestée ou proposée dans la tradition éditoriale; elle est donc signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français moderne, sobre et digne. Le fragment initial « sur la terre » est maintenu dans ce verset conformément à la délimitation et au texte source; la tournure « l’ont précédée » évite le calque moins naturel « ont été avant elle ».
