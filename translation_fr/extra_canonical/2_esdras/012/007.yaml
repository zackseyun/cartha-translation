review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les conditions successives, le comparatif prae multis et la demande de force. Toutefois, « révèle-toi » interprète ostende plus fortement que nécessaire : le verbe demande d’abord que Dieu se montre. « Est bien montée jusqu’à toi » est compréhensible, mais « assurément montée devant toi » rend plus explicitement certum et l’orientation de ante faciem tuam.'
  naturalness: Le français est fluide, soutenu et adapté à une prière. « Montre-toi à moi » est idiomatique dans ce registre et évite la coloration plus technique ou théologique de « révèle-toi ».
  terminology: « Ô Seigneur souverain », « grâce à tes yeux », « reconnu juste » et « ton esclave » sont recevables. « Reconnu juste » maintient la portée judiciaire de iustificatus sans imposer une systématisation doctrinale.
  issues:
  - severity: medium
    issue: « révèle-toi » pour ostende ... mihi
    rationale: Ostende signifie littéralement « montre-toi » dans la compréhension contextuelle retenue aussi par la piste anglaise (« show yourself to me »). « Révèle-toi » peut suggérer une notion de révélation plus interprétative et ne préserve pas aussi étroitement le verbe source.
  - severity: low
    issue: Rendu de certum ascendit ... ante faciem tuam
    rationale: « Est bien montée jusqu’à toi » est possible, mais « est assurément montée devant toi » restitue plus directement l’adverbe d’assurance certum et l’image de la prière se présentant devant Dieu, sans alourdir le français.
  revised_text: 'Et je dis : « Ô Seigneur souverain, si j’ai trouvé grâce à tes yeux, si j’ai été reconnu juste devant toi plus que beaucoup d’autres, et si ma supplication est assurément montée devant toi, fortifie-moi et montre-toi à moi, ton esclave. »'
