source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your servant.”
translation:
  language: fr
  text: 'Et je dis : « Ô Seigneur souverain, si j’ai trouvé grâce à tes yeux, si j’ai été reconnu juste devant toi plus que beaucoup d’autres, et si ma supplication est assurément montée devant toi, fortifie-moi et montre-toi à moi, ton esclave. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Ô Seigneur souverain
  rationale: Rend le double titre avec dignité et naturel, tout en conservant l’idée d’autorité souveraine portée par dominator.
- source_word: si inueni gratiam ante oculos tuos
  choice: si j’ai trouvé grâce à tes yeux
  rationale: Expression biblique française claire et formellement proche du latin.
- source_word: si iustificatus sum apud te prae multis
  choice: si j’ai été reconnu juste devant toi plus que beaucoup d’autres
  rationale: « Reconnu juste » préserve la valeur judiciaire de iustificatus sans imposer une lecture doctrinale particulière; prae multis marque ici une comparaison.
- source_word: si certum ascendit deprecatio mea ante faciem tuam
  choice: si ma supplication est bien montée jusqu’à toi
  rationale: « Est bien montée » restitue l’assurance exprimée par certum; « jusqu’à toi » rend idiomatiquement ante faciem tuam sans perdre l’image d’une prière qui monte.
- source_word: Conforta me
  choice: fortifie-moi
  rationale: Équivalent direct, naturel et digne de conforta.
- source_word: ostende ... mihi
  choice: révèle-toi à moi
  rationale: Le latin transmis est syntaxiquement difficile et vraisemblablement incomplet ou corrompu; dans le contexte, cette formulation exprime naturellement la demande de manifestation retenue par la tradition de traduction.
- source_word: seruo tuo
  choice: ton esclave
  rationale: Rend nettement le statut de dépendance exprimé par servus, plutôt que de l’atténuer en « serviteur ».
theological_decisions:
- issue: Sens de iustificatus sum
  choice: j’ai été reconnu juste
  alternative: j’ai été justifié
  rationale: Le choix conserve la dimension de jugement favorable tout en évitant de faire de la phrase une formulation technique d’une doctrine ultérieure.
- issue: Interprétation de ostende seruo tuo mihi
  choice: révèle-toi à moi, ton esclave
  alternative: montre-moi, à moi ton esclave
  rationale: La construction latine est irrégulière. Le contexte et la tradition textuelle invitent à comprendre une demande adressée à Dieu pour qu’il se manifeste, mais la formulation française ne doit pas prétendre que le latin est parfaitement transparent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement correspond à l’adresse directe à Dieu. La syntaxe conditionnelle répétée conserve le rythme solennel de la prière.
