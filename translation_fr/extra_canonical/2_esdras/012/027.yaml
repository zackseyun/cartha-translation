  text: the sword will devour them[a]. For one sword will devour him who is with it,
translation:
  language: fr
  text: L’épée les dévorera. En effet, l’épée de l’un dévorera celui qui est avec lui[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin peut aussi se comprendre : « celui qui est avec elle », c’est-à-dire avec l’épée.'
    reason: Le masculin grammatical de eo permet un renvoi soit à un personnage masculin, soit à gladius (« l’épée »), masculin en latin.
lexical_decisions:
- source_word: gladius
  choice: l’épée
  rationale: Rend directement le nom latin et conserve l’image violente du texte.
- source_word: comedet
  choice: dévorera
  rationale: Conserve la métaphore forte de comedere plutôt que de l’atténuer par « tuera ».
- source_word: Vnius … gladius
  choice: l’épée de l’un
  rationale: 'Unius est un génitif singulier : la construction signifie naturellement « l’épée de l’un », et non simplement « une épée ».'
- source_word: qui cum eo
  choice: celui qui est avec lui
  rationale: Rend la proposition relative au masculin sans préciser artificiellement l’identité des deux personnages.
theological_decisions:
- issue: Référent de « eo »
  choice: « lui », avec une note signalant l’ambiguïté
  alternative: « elle », en faisant de l’épée l’antécédent
  rationale: Le pronom latin masculin eo peut grammaticalement renvoyer à un personnage masculin ou à gladius, également masculin. Le contexte favorise probablement un personnage, mais le texte latin isolé ne tranche pas entièrement.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « dévorera » reproduit volontairement celle du latin. La virgule finale est conservée parce que la phrase se poursuit dans le verset suivant.
