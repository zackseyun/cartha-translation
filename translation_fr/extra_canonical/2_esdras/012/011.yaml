  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: fr
  text: le quatrième royaume que Daniel, ton frère, a vu dans une vision. Mais son interprétation ne lui a pas été donnée de la manière dont je te l’explique maintenant,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  choice: le quatrième royaume
  rationale: Rend directement l’expression latine et conserve son lien explicite avec la vision de Daniel.
- source_word: uisum est in uisu
  choice: est apparu en vision
  rationale: Évite la lourdeur de « a été vu dans une vision » tout en conservant l’idée d’une manifestation visionnaire.
- source_word: fratri tuo
  choice: ton frère
  rationale: Traduction littérale et naturelle de la relation fraternelle employée pour situer Daniel dans la même communauté de foi.
- source_word: interpretatum / interpretor
  choice: expliqué / explique
  rationale: Dans ce contexte, « expliquer » exprime naturellement le dévoilement du sens de la vision; la reprise du même radical français préserve le parallèle latin.
theological_decisions:
- issue: Nature du lien entre Daniel et Esdras
  choice: ton frère
  alternative: ton compatriote / ton frère dans la foi
  rationale: Le latin dit simplement « fratri tuo »; préciser la nature du lien résoudrait une ambiguïté que le texte laisse ouverte.
- issue: Comparaison portant sur l’interprétation
  choice: comme je te l’explique maintenant
  alternative: de la manière dont je te l’explique maintenant
  rationale: La formulation retenue conserve le contraste entre la révélation accordée à Daniel et l’explication plus complète donnée maintenant à Esdras, sans ajouter de qualification théologique.
translation_notes:
  register: Français moderne, clair et digne. La ponctuation finale conserve la virgule du segment fourni, qui se poursuit vraisemblablement au verset ou à la proposition suivante.
