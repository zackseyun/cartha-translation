source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nobis mala quae contigerunt? Si ergo tu nos dereliqueris, quanto erat nobis melius, si essemus succensi et nos in incendio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
translation:
  language: fr
  text: Ou bien les malheurs qui nous sont arrivés ne suffisent-ils pas ? Si donc tu nous abandonnes, combien il aurait mieux valu pour nous d’être, nous aussi, brûlés dans l’incendie !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala quae contigerunt
  choice: les malheurs qui nous sont arrivés
  rationale: Rend naturellement le latin tout en conservant l’idée de maux effectivement survenus à la communauté.
- source_word: dereliqueris
  choice: tu nous abandonnes
  rationale: « Abandonner » exprime directement le fait de délaisser, sans atténuer la plainte adressée à Dieu.
- source_word: succensi
  choice: brûlés
  rationale: Le participe évoque le fait d’être embrasé ou consumé ; « brûlés » convient clairement au contexte.
- source_word: incendio
  choice: dans l’incendie
  rationale: Le terme désigne un feu destructeur ou un embrasement ; « incendie » garde cette force et évite une répétition artificielle.
theological_decisions:
- issue: La possibilité que Dieu abandonne son peuple
  choice: Si donc tu nous abandonnes
  alternative: Si donc tu nous délaisses
  rationale: La formulation conditionnelle et la tension de la plainte sont conservées sans expliquer ni résoudre théologiquement l’hypothèse.
translation_notes:
  register: Français international moderne, direct et digne. La tournure exclamative finale restitue l’intensité de la lamentation. Le « nous aussi » est maintenu pour rendre l’insistance de « et nos ».
