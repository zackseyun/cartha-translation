translation:
  language: fr
  text: t’es-tu assis en ce lieu ? Car, pour nous, tu surpasses tous les prophètes[a], comme une grappe de la vendange et comme une lampe dans un lieu obscur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es resté pour nous, parmi tous les prophètes ». Le verbe latin superasti peut aussi être compris au sens de « être resté en vie » ; le texte traduit ici le sens « surpasser ».'
    reason: Préserver l’ambiguïté interprétative signalée dans le dossier sans substituer au texte principal la lecture secondaire.
lexical_decisions:
- source_word: sedisti
  choice: t’es-tu assis
  rationale: Le parfait latin est rendu par le passé composé, naturel en français dans cette question qui commence au milieu d’une phrase.
- source_word: superasti
  choice: c’est toi qui es resté
  rationale: 'Dans ce contexte, superare peut signifier « survivre, rester » : Esdras est présenté comme le prophète demeuré auprès du peuple. Une note conserve l’autre sens possible, « surpasser ».'
- source_word: ex omnibus prophetis
  choice: parmi tous les prophètes
  rationale: Cette tournure française rend la sélection exprimée par ex sans alourdir la phrase.
- source_word: botrus de vindemia
  choice: une grappe après la vendange
  rationale: Cette formulation rend clairement l’image d’une grappe demeurée après la récolte, en cohérence avec superasti compris au sens de « rester ».
- source_word: lucerna in loco obscuro
  choice: une lampe dans un lieu obscur
  rationale: Traduction directe qui préserve l’image et le registre dignifié du latin.
theological_decisions:
- issue: Sens de superasti
  choice: Esdras est celui qui est resté pour le peuple parmi les prophètes.
  alternative: « Tu surpasses pour nous tous les prophètes. »
  rationale: Le contexte et les deux comparaisons — la grappe laissée après la vendange et la lampe dans l’obscurité — favorisent l’idée de survivance ou de présence restante. La polysémie du verbe latin est néanmoins signalée plutôt que supprimée.
translation_notes:
  register: Français moderne, courant et digne. Le début et la virgule finale sont conservés comme fragments syntaxiques, puisque le texte fourni commence et se termine au milieu du discours.
