  rationale: Correspondance directe, claire et idiomatique.
- source_word: ueniam ad uos
  choice: je viendrai vous voir
  rationale: Rend naturellement le mouvement vers les destinataires exprimé par « ad vos », sans changer le sens.
- source_word: post dies istos
  choice: après ces jours-là
  rationale: Préserve la formulation temporelle quelque peu indéterminée du latin.
