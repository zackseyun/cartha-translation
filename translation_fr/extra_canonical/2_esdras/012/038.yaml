  yaml_path: translation/extra_canonical/2_esdras/012/038.yaml
  text: And you shall teach them to the wise among your people, whose hearts you know are able to comprehend and keep them secret.
translation:
  language: fr
  text: Tu écriras dans un livre ce que tu as vu, et tu les placeras dans un lieu caché. Tu les enseigneras aux sages de ton peuple, dont tu sais que les cœurs peuvent accueillir et garder ces mystères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait latin fourni s’interrompt après « et »; « garder ces mystères » rend la continuation textuelle attestée (servare haec arcana).
    reason: Signaler que la dernière coordination est rétablie d’après la continuation attestée, tout en précisant le référent distinct de haec arcana.
lexical_decisions:
- source_word: docebis ea
  choice: Tu les enseigneras
  rationale: Le pronom « les » reprend les révélations ou choses vues mentionnées dans le contexte, tout en conservant la construction directe du latin.
- source_word: sapientes de populo tuo
  choice: aux sages de ton peuple
  rationale: Rend simplement l’appartenance au peuple, dans un français naturel et digne.
- source_word: quorum scis corda posse capere
  choice: dont tu sais que le cœur est capable de les comprendre
  rationale: « Comprendre » exprime ici naturellement la capacité d’accueillir intellectuellement le contenu; le singulier distributif « le cœur » évite une formulation française lourde tout en représentant le pluriel latin « corda ».
- source_word: servare haec arcana (complément attesté dans la continuation textuelle)
  choice: les garder secrets
  rationale: Cette formulation maintient l’ambiguïté entre conserver ces enseignements et ne pas les divulguer, sans ajouter « ces secrets » comme nouvel objet explicite.
theological_decisions:
- issue: Nature de ce qui doit être gardé
  choice: les garder secrets
  alternative: garder ces secrets
  rationale: Le choix retenu évite de transformer explicitement les enseignements en « secrets » comme catégorie théologique, tout en exprimant leur caractère réservé.
translation_notes:
  register: Français international moderne, clair et digne. Le futur à valeur injonctive suit la forme latine. « Le cœur » est employé au sens biblique du siège de l’intelligence et du discernement.
