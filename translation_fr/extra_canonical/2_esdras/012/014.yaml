lexical_decisions:
- source_word: Regnabunt
  choice: régneront
  rationale: Rend directement le futur latin du verbe « regnare ».
- source_word: in ea
  choice: y
  rationale: Le pronom adverbial français reprend naturellement le référent féminin du contexte sans l’expliciter ni lever son ambiguïté.
- source_word: XII reges
  choice: douze rois
  rationale: Correspondance directe avec le nombre et le nom latins, le chiffre romain étant écrit en toutes lettres selon l’usage courant.
- source_word: unus post unum
  choice: l’un après l’autre
  rationale: Expression française naturelle qui conserve l’idée d’une succession individuelle.
theological_decisions:
- issue: Référent de « in ea »
  choice: Conserver la reprise pronominale avec « y »
  alternative: Expliciter le référent, par exemple « dans ce royaume » ou « sur cet aigle »
  rationale: Le verset latin ne nomme pas de nouveau le référent; l’expliciter introduirait une interprétation absente de cette phrase.
translation_notes:
  register: Français moderne, clair et digne. La coordination initiale rend « autem » dans la continuité du discours, et la formulation reste concise comme le latin.
