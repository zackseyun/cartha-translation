source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'capitibus eius exientem sed de medio corpore eius, Haec est interpretatio: quoniam post tempus regni illius nascentur contentiones non modicae, et periclitabitur ut cadat, et non cadet'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/018.yaml
  text: 'This is the interpretation: after the time of that kingdom[a], no small contentions will arise, and it will be in danger of falling; but it will not fall.'
translation:
  language: fr
  text: 'Voici l’interprétation : après un certain temps de ce royaume[a], des conflits considérables surgiront. Il risquera de tomber, mais il ne tombera pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après le temps de ce royaume ».
    reason: Le latin « post tempus regni illius » peut se comprendre soit comme le passage d’un certain temps au cours du royaume, soit comme la période suivant son temps.
lexical_decisions:
- source_word: post tempus regni illius
  choice: après un certain temps de ce royaume
  rationale: « Post tempus » peut désigner le passage d’un certain temps plutôt que la fin du royaume. Cette formulation naturelle s’accorde avec la suite, où le royaume subsiste malgré le danger de tomber, tout en signalant l’autre lecture en note.
- source_word: contentiones non modicae
  choice: des conflits considérables
  rationale: Rend naturellement la litote latine « non modicae » sans en affaiblir la force.
- source_word: periclitabitur ut cadat
  choice: il risquera de tomber
  rationale: Expression française claire et fidèle à l’idée que le royaume sera en danger de s’effondrer.
- source_word: et non cadet
  choice: mais il ne tombera pas
  rationale: Le contraste implicite avec le péril précédent est naturellement exprimé par « mais ».
theological_decisions:
- issue: Moment où surgissent les conflits par rapport à la durée du royaume
  choice: après un certain temps de ce royaume
  alternative: après le temps de ce royaume
  rationale: Le latin « post tempus » est ambigu. Le choix principal évite d’impliquer nécessairement que le royaume a déjà pris fin, puisque la proposition suivante dit qu’il risque de tomber mais ne tombe pas. La lecture plus littérale est conservée en note.
translation_notes:
  register: Français moderne, international et digne. « Voici l’interprétation » garde le ton explicatif du passage; deux phrases améliorent la lisibilité sans modifier les rapports logiques.
