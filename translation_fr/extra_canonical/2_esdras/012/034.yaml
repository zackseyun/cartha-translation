source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populum meum liberabit cum misericordia, qui saluati sunt super fines meos, et iocundabit eos, quoadusque ueniat finis, dies iudicii, de quo locutus sum tibi ab initio. Hoc est somnium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/034.yaml
  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
translation:
  language: fr
  text: il délivrera avec miséricorde mon peuple, ceux qui ont été sauvés à l’intérieur de mes frontières, et il les remplira de joie jusqu’à ce que vienne la fin, le jour du jugement dont je t’ai parlé dès le commencement. Tel est le rêve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: liberabit cum misericordia
  choice: délivrera avec miséricorde
  rationale: Rend directement le futur latin et conserve la miséricorde comme modalité explicite de la délivrance.
- source_word: qui saluati sunt
  choice: ceux qui ont été sauvés
  rationale: Préserve le parfait passif latin sans préciser un agent que le texte ne nomme pas.
- source_word: super fines meos
  choice: à l’intérieur de mes frontières
  rationale: Dans ce contexte, fines désigne le territoire délimité; cette formulation française exprime naturellement l’idée de préservation dans les limites appartenant au locuteur.
- source_word: iocundabit eos
  choice: il les remplira de joie
  rationale: 'Expression française naturelle correspondant au causatif latin: il fera qu’ils se réjouissent.'
- source_word: quoadusque ueniat finis
  choice: jusqu’à ce que vienne la fin
  rationale: Conserve la tournure temporelle et l’arrivée personnifiée de la fin.
- source_word: Hoc est somnium
  choice: Tel est le rêve
  rationale: Conclusion idiomatique et digne qui récapitule l’interprétation comme étant le rêve en question.
theological_decisions:
- issue: Rapport entre «mon peuple» et «ceux qui ont été sauvés»
  choice: Maintenir l’apposition sans ajouter «le reste»
  alternative: «le reste de mon peuple»
  rationale: Le segment latin fourni pour ce verset ne contient pas residuum; l’ajouter importerait des mots du verset précédent et créerait un décalage de versification.
- issue: Nature de la délivrance
  choice: Ne pas préciser si elle est politique, physique ou eschatologique
  alternative: Expliciter une délivrance spirituelle ou finale
  rationale: Le contexte mentionne le jour du jugement, mais le verbe liberabit demeure assez large; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit étroitement le latin tout en évitant un calque lourd. Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
