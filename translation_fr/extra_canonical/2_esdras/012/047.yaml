  text: For the memory of you is before the Most High[a][b],
translation:
  language: fr
  text: Car le souvenir de vous est présent devant le Très-Haut,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memoria uestri
  choice: le souvenir de vous
  rationale: Le génitif « uestri » dépend de « memoria » et désigne ici le souvenir que l’on garde des destinataires, non leur propre acte de se souvenir.
- source_word: coram altissimo
  choice: devant le Très-Haut
  rationale: « Devant » conserve l’image de la présence, tandis que « le Très-Haut » rend naturellement le titre divin latin « altissimus ».
- source_word: Est enim
  choice: Car … est présent
  rationale: « Car » traduit la valeur explicative de « enim ». L’ajout idiomatique de « présent » évite en français la tournure raide « le souvenir … est devant » sans changer le sens.
theological_decisions:
- issue: Nature du souvenir devant Dieu
  choice: Maintenir l’image selon laquelle le souvenir des destinataires est présent devant le Très-Haut
  alternative: Le Très-Haut se souvient de vous
  rationale: La formulation retenue respecte la construction nominale du latin et n’explicite pas davantage le mode de l’action divine.
translation_notes:
  register: Français moderne, digne et accessible. La proposition étrangère au texte latin fourni concernant « le Puissant » et le combat n’est pas intégrée. Le fragment « tu domus Jacob » appartient syntaxiquement à la phrase précédente dans l’extrait transmis et n’est pas repris dans la proposition correspondant au texte anglais audité de 12.47.
