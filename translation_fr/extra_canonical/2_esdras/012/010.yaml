  text: 'And he said to me, “This is the interpretation of the vision that you saw: the eagle that you saw coming up from the sea—this is'
translation:
  language: fr
  text: 'Et il me dit : « Voici l’interprétation de la vision que tu as eue : l’aigle que tu as vu s’élever de la mer, c’est »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatio
  choice: interprétation
  rationale: Terme français direct et naturel pour l’explication donnée à une vision.
- source_word: Aquilam
  choice: l’aigle
  rationale: Correspondance exacte du nom latin, avec l’article défini attendu en français dans la reprise de l’élément de la vision.
- source_word: ascendentem de mari
  choice: monter de la mer
  rationale: Préserve le mouvement ascendant et l’origine maritime exprimés par le participe latin et la préposition de.
- source_word: hoc est
  choice: c’est
  rationale: Rend naturellement en français la formule d’identification, tout en conservant la phrase inachevée qui se poursuit au verset suivant.
theological_decisions:
- issue: Identification symbolique de l’aigle
  choice: Maintenir la formule ouverte « c’est »
  alternative: Anticiper l’identité expliquée dans la suite
  rationale: Le verset s’interrompt sur hoc est ; il faut préserver cette suspension sans résoudre par avance l’interprétation symbolique.
translation_notes:
  register: Français moderne, clair et digne. Le passé composé « tu as eue / tu as vu » est naturel dans un discours direct contemporain. La tournure initiale suit la leçon complète attestée par le contexte éditorial et reflétée dans la couche anglaise auditée, tandis que l’extrait latin fourni commence matériellement à « uidisti ».
