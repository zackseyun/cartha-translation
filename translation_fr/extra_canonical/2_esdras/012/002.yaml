  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
translation:
  language: fr
  text: 'Je regardai, et voici : la tête qui était restée ne parut pas. Les deux ailes qui étaient passées vers elle se levèrent et furent établies pour régner, et leur règne fut bref et plein de troubles. Je regardai, et voici : elles non plus ne se montraient pas. Le corps entier de l’aigle brûlait[a], et la terre était profondément terrifiée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était en train d’être consumé par le feu ».
    reason: Le latin incendebatur peut se comprendre comme un passif progressif ; « brûlait » conserve naturellement en français l’aspect inaccompli.
lexical_decisions:
- source_word: non conparuit / non apparesebant
  choice: ne parut plus / ne paraissaient plus
  rationale: Rend de près la répétition des verbes latins d’apparition, tout en exprimant naturellement en français la disparition constatée dans la vision.
- source_word: surrexerunt ... et erectae sunt
  choice: se levèrent et furent établies
  rationale: Conserve les deux actions distinctes du latin ainsi que la forme passive du second verbe.
- source_word: regnum ... exile
  choice: règne ... bref
  rationale: Dans ce contexte de succession politique, exile qualifie le règne comme limité ou de courte durée; « bref » communique clairement cette idée.
- source_word: tumulti plenum
  choice: plein de troubles
  rationale: « Troubles » rend le tumulte et l’instabilité politiques sans surinterpréter leur nature.
- source_word: incendebatur
  choice: brûlait
  rationale: L’imparfait latin décrit un processus en cours dans le tableau visionnaire, et non nécessairement une combustion déjà achevée.
- source_word: expauescebat terra ualde
  choice: la terre fut saisie d’une grande terreur
  rationale: Formulation française naturelle et digne qui garde l’intensité de ualde et la personnification de la terre.
