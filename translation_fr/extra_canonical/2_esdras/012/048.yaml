source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: fr
  text: Car je ne vous ai pas abandonnés ni ne me suis éloigné de vous, mais je suis venu en ce lieu pour prier au sujet de la désolation de Sion et implorer la miséricorde pour l’humiliation de votre sanctuaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: abandonnés
  rationale: Rend directement l’idée de délaisser ou d’abandonner, dans un français naturel et digne.
- source_word: excessi a uobis
  choice: me suis éloigné de vous
  rationale: Exprime le départ ou l’éloignement d’avec les destinataires sans suggérer nécessairement une rupture définitive.
- source_word: deprecarer pro desolatione Sion
  choice: prier au sujet de la désolation de Sion
  rationale: Conserve la portée assez large de pro, qui peut indiquer l’objet ou le motif de la supplication, sans préciser abusivement que la prière vise exclusivement la restauration.
- source_word: quererem misericordiam
  choice: implorer la miséricorde
  rationale: Le latin signifie littéralement « chercher la miséricorde »; « implorer » restitue naturellement, dans ce contexte de prière, la recherche pressante d’une intervention miséricordieuse.
- source_word: humilitate sanctificationis uestrae
  choice: l’humiliation de votre sanctuaire
  rationale: Sanctificatio désigne ici vraisemblablement le lieu saint, comme dans la couche anglaise auditée; « humiliation » préserve l’image de l’abaissement ou de l’état déshonoré du sanctuaire.
theological_decisions:
- issue: Sens de « sanctificationis uestrae »
  choice: votre sanctuaire
  alternative: votre consécration / votre sainteté
  rationale: Le parallélisme avec la désolation de Sion et le contexte du lieu saint favorisent le sens concret de « sanctuaire », tout en évitant une formulation confessionnelle particulière.
- issue: Relation exprimée par « pro » après « deprecarer »
  choice: au sujet de
  alternative: pour la délivrance de / à cause de
  rationale: La formulation retenue conserve l’ambiguïté du latin entre l’objet de la prière et la situation qui la motive, sans introduire explicitement une délivrance absente du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme négatif (« je ne vous ai pas abandonnés ni ne me suis éloigné ») et la tension entre la désolation de Sion et l’humiliation du sanctuaire sont conservés.
