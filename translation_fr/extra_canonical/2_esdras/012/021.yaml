  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
translation:
  language: fr
  text: dont les temps seront brefs et les années passeront vite. Deux d’entre eux périront lorsque le temps médian approchera, mais quatre seront préservés pour le temps où sa fin commencera à approcher,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: leuia
  choice: brefs
  rationale: Avec une notion de temps sous-entendue, le latin levis peut signifier « bref » ou « passager » ; le contexte décrit la courte durée de ces règnes.
- source_word: anni citati
  choice: les années rapides
  rationale: Citatus signifie « rapide, précipité » ; cette formulation conserve le parallélisme et l’image d’années qui passent vite.
- source_word: seruabuntur
  choice: seront préservés
  rationale: Le passif futur est maintenu, ainsi que le sens de conservation ou de maintien jusqu’à la période indiquée.
theological_decisions:
- issue: Référent de « eius » dans « tempus eius ut finiatur »
  choice: sa fin
  alternative: la fin de ce temps
  rationale: Le pronom latin permet une formulation pronominale sans expliciter davantage son référent ; la traduction préserve cette légère ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La structure prophétique et les deux indications temporelles sont conservées au plus près du latin, sans ajouter d’explication interprétative.
