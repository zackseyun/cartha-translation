  text: Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
translation:
  language: fr
  text: Quant à moi, je restai assis dans un champ pendant sept jours, comme il me l’avait ordonné. Je ne mangeai que des fleurs des champs ; durant ces jours-là, ma nourriture se composait d’herbes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedi
  choice: je restai assis
  rationale: Le parfait latin peut exprimer ici le fait de demeurer assis pendant toute la période indiquée ; cette tournure restitue naturellement la durée.
- source_word: in campo
  choice: dans la campagne
  rationale: « Campus » désigne ici un espace ouvert ou rural ; « dans la campagne » convient mieux au contexte que le plus étroit « dans un champ ».
- source_word: floribus ... agri
  choice: des fleurs des champs
  rationale: Rend directement l’expression latine tout en conservant son caractère concret.
- source_word: de herbis facta est mihi esca
  choice: ma nourriture se composait d’herbes
  rationale: Formulation française naturelle qui conserve l’idée que les herbes constituaient sa nourriture, sans reproduire servilement le passif latin.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La structure en deux phrases évite une période excessivement longue, tandis que le point-virgule maintient le parallélisme entre les fleurs des champs et les herbes. La note de la couche anglaise n’a pas été reprise, car elle ne signale aucune variante réelle du texte latin et semble provenir d’un ancien libellé anglais.
