  text: And it will be[a], when he has reproved them, then he will destroy them[b]. For the remnant
translation:
  language: fr
  text: Et il arrivera que, lorsqu’il les aura repris, alors il les détruira. Car le reste…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: arguerit
  choice: repris
  rationale: Le latin peut exprimer l’action de reprendre, d’accuser ou de convaincre quelqu’un de sa faute. « Repris » rend naturellement le sens judiciaire et moral sans le préciser excessivement.
- source_word: corrumpet
  choice: détruira
  rationale: Dans ce contexte de jugement, corrumpere signifie faire périr ou détruire, plutôt que simplement corrompre moralement.
- source_word: residuum
  choice: le reste
  rationale: Traduction directe du substantif neutre latin. La proposition demeure inachevée à la limite du verset fourni.
theological_decisions:
- issue: Nature exacte de la réprimande exercée avant la destruction
  choice: repris
  alternative: convaincus de leurs torts
  rationale: Le texte latin ne précise pas s’il s’agit surtout d’une accusation, d’une réfutation ou d’une déclaration de culpabilité; la traduction conserve cette latitude.
translation_notes:
  register: Français moderne, digne et accessible. « Voici ce qui arrivera » rend idiomatiquement et erit, tandis que les points de suspension signalent que la dernière proposition se poursuit au-delà du fragment fourni.
