source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc ergo dispone domum tuam, et corripe populum tuum, et consolare humiles eorum, et renuntia iam corruptae uitae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/013.yaml
  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
translation:
  language: fr
  text: Maintenant donc, mets de l’ordre dans ta maison, reprends ton peuple, console ceux d’entre eux qui sont humbles et renonce dès maintenant à cette vie périssable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dispone domum tuam
  choice: mets de l’ordre dans ta maison
  rationale: Expression française naturelle qui conserve l’idée de disposer ou régler sa maison, avec l’ambiguïté possible entre foyer et affaires personnelles.
- source_word: corripe
  choice: reprends
  rationale: Rend l’idée de correction ou de réprimande sans durcir inutilement le ton.
- source_word: humiles eorum
  choice: ceux d’entre eux qui sont humbles
  rationale: Conserve le rattachement du possessif eorum au peuple et le sens direct de humiles, lequel peut aussi évoquer les gens abaissés ou affligés.
- source_word: renuntia
  choice: renonce
  rationale: Équivalent direct et idiomatique de l’injonction latine.
- source_word: corruptae uitae
  choice: cette vie périssable
  rationale: Dans le contexte de la mortalité et de la faiblesse humaine, périssable exprime mieux la corruptibilité que le français moderne vie corrompue, qui suggérerait surtout une faute morale.
- source_word: iam
  choice: dès maintenant
  rationale: Rend la valeur temporelle pressante de iam de manière naturelle en français.
theological_decisions:
- issue: Sens de corruptae uitae
  choice: cette vie périssable
  alternative: la vie corrompue
  rationale: Le contexte immédiat favorise la condition mortelle et vouée à la corruption, sans exclure totalement les connotations morales du terme latin.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs successifs reproduisent la force exhortative du latin; la formulation évite un vocabulaire confessionnel spécialisé.
