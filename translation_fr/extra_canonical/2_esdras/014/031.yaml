lexical_decisions:
- source_word: sortem
  choice: l’héritage
  rationale: Le latin désigne littéralement une « part » ou un « lot » attribué ; dans ce contexte territorial, « héritage » exprime naturellement la possession accordée dans la terre de Sion.
- source_word: iniquitatem fecistis
  choice: vous avez commis l’iniquité
  rationale: Rend directement l’expression latine tout en conservant son registre moral et solennel.
- source_word: non seruastis uias
  choice: vous n’avez pas suivi les voies
  rationale: En français actuel, « suivre les voies » restitue clairement l’idée de garder et d’observer la conduite prescrite.
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel, exact et immédiatement compréhensible.
- source_word: Iustus
  choice: le Juste
  rationale: Conserve le nominatif substantivé et l’amorce syntaxiquement inachevée transmise à la fin du segment latin.
theological_decisions:
- issue: Référent et fonction syntaxique de « Iustus »
  choice: le Juste
  alternative: le juste juge / puisqu’il est juste
  rationale: Le texte fourni ne contient ni « juge » ni une conjonction causale. La traduction préserve donc l’ambiguïté et le caractère suspendu de la formulation au lieu de compléter l’idée à partir du contexte.
- issue: Sens de « sortem » à Sion
  choice: l’héritage
  alternative: la part / le lot
  rationale: « Héritage » convient au contexte d’une possession territoriale donnée, sans imposer une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « vous » souligne la responsabilité conjointe des destinataires et de leurs pères. Le début et la fin fragmentaires sont volontairement conservés, conformément au texte latin fourni.
