translation:
  language: fr
  text: la part[a] dans la terre de Sion, et vous ainsi que vos pères, vous avez commis l’iniquité et vous n’avez pas observé les voies que le Très-Haut vous a prescrites ; le Juste
  philosophy: optimal-equivalence
