  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: fr
  text: ces cinq hommes, car ils sont prêts à écrire rapidement. Et tu viendras ici, et j’allumerai dans ton cœur une lampe d’intelligence qui ne s’éteindra pas jusqu’à ce que soient achevées les choses que tu commenceras à écrire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hos
  choice: ces cinq hommes
  rationale: Le pronom démonstratif masculin pluriel renvoie aux cinq hommes mentionnés dans le contexte; expliciter « hommes » rend la référence naturelle en français.
- source_word: parati sunt ad scribendum uelociter
  choice: ils sont prêts à écrire rapidement
  rationale: Rend directement l’état de préparation et la rapidité de l’écriture sans préciser indûment s’il s’agit de vitesse ou d’une compétence particulière de scribe.
- source_word: accendam
  choice: j’allumerai
  rationale: Conserve l’image concrète de l’allumage d’une lampe.
- source_word: lucernam intellectus
  choice: une lampe d’intelligence
  rationale: Préserve la métaphore et le génitif latin, compris comme une lampe donnant ou représentant l’intelligence.
- source_word: quae non extinguetur
  choice: qui ne s’éteindra pas
  rationale: Le relatif français s’accorde avec « lampe » et conserve la forme passive/intransitive naturelle de l’image.
- source_word: quae incipies scribere
  choice: ce que tu commenceras à écrire
  rationale: Préserve la formulation générale du neutre pluriel latin sans imposer « livres », « paroles » ou « choses ».
theological_decisions:
- issue: Nature de la « lampe d’intelligence »
  choice: Maintenir la métaphore sans l’expliquer
  alternative: Traduire par « je t’éclairerai l’esprit »
  rationale: Le texte présente une action divine sous forme imagée; l’expliciter ferait disparaître une image théologiquement significative.
- issue: Objet de l’écriture
  choice: « ce que tu commenceras à écrire »
  alternative: « les livres que tu commenceras à écrire »
  rationale: Le latin emploie un relatif neutre sans nom explicite; ne pas ajouter « livres » préserve l’indétermination du texte source.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du latin tout en étant naturelle; « intelligence » conserve la portée intellectuelle et spirituelle possible d’intellectus.
