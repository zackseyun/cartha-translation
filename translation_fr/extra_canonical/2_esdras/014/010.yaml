  text: Quoniam saeculum perdidit iuuentutem suam, et tempora adpropinquant senescere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/010.yaml
  text: For the age has lost its youth, and the times are drawing near to old age.
translation:
  language: fr
  text: Car le monde a perdu sa jeunesse, et les temps approchent de la vieillesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte apocalyptique, « saeculum » désigne l’ordre du monde ou l’ère présente, personnifié comme vieillissant. « Le monde » est naturel en français et conserve cette portée sans imposer le sens plus étroit de « siècle ».
- source_word: perdidit iuuentutem suam
  choice: a perdu sa jeunesse
  rationale: Rendu direct qui conserve la personnification et l’image du déclin.
- source_word: tempora
  choice: les temps
  rationale: Le pluriel français reproduit le latin et garde la nuance des périodes ou du cours du temps.
- source_word: adpropinquant senescere
  choice: approchent de la vieillesse
  rationale: Cette formulation idiomatique restitue l’idée que les temps sont sur le point de vieillir, tout en maintenant le parallélisme avec la jeunesse perdue.
theological_decisions:
- issue: Portée eschatologique de « saeculum »
  choice: le monde
  alternative: l’ère présente
  rationale: « Le monde » préserve la personnification cosmique du texte et reste accessible; « l’ère présente » expliciterait davantage une lecture eschatologique que le latin ne formule pas ici de manière entièrement univoque.
translation_notes:
  register: Français moderne, simple et digne; structure parallèle et métaphore du vieillissement conservées.
source_grounding:
  english_pob_role: consult_only
