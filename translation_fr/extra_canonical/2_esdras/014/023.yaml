lexical_decisions:
- source_word: in nouissimis
  choice: dans les derniers temps
  rationale: Rend l’expression eschatologique latine de manière naturelle et fidèle, sans préciser davantage sa portée.
- source_word: uadens congrega populum
  choice: Va rassembler le peuple
  rationale: Conserve l’impératif et le mouvement exprimés par le latin, dans un français courant.
- source_word: ut non te quaerant
  choice: dis-leur de ne pas te chercher
  rationale: La construction française à l’infinitif après « dis-leur » rend naturellement la proposition latine de but ou de contenu.
theological_decisions:
- issue: Référent implicite du premier verbe « uiuere » dans ce fragment de phrase
  choice: que vivent ceux qui doivent vivre dans les derniers temps
  alternative: afin qu’ils vivent dans les derniers temps
  rationale: Le verset commence au milieu d’une phrase. L’ajout minimal de « ceux qui doivent » explicite le sujet implicite suggéré par le contexte transmis et par la construction, sans identifier davantage ce groupe.
translation_notes:
  register: Français international moderne, digne et accessible. Le caractère fragmentaire du début et l’inachèvement de la citation à la fin sont conservés; la redondance sémitisante « répondit et dit » est légèrement allégée en « répondit ».
