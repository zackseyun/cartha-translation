  text: you will be kept alive[a], and after death you will obtain mercy. For judgment will come after death, when again
translation:
  language: fr
  text: vous serez gardés en vie et, après la mort, vous obtiendrez miséricorde. Car le jugement viendra après la mort, quand, de nouveau…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset suivant; le texte latin de ce verset s’arrête sur « quand, de nouveau » comme segment inachevé.
    reason: Signaler la coupure de verset sans importer dans ce verset les mots du segment suivant.
lexical_decisions:
- source_word: uiui conseruati eritis
  choice: vous serez gardés en vie
  rationale: Rend le futur passif à la deuxième personne du pluriel et conserve l’idée d’être maintenus ou préservés vivants.
- source_word: misericordiam consequemini
  choice: vous obtiendrez miséricorde
  rationale: Reproduit directement l’idée d’accéder à la miséricorde, sans préciser indûment qui l’accorde.
- source_word: Iudicium enim post mortem ueniet
  choice: Car le jugement viendra après la mort
  rationale: Conserve la relation explicative marquée par « enim », ainsi que l’ordre temporel explicitement formulé.
- source_word: quando iterum
  choice: quand, de nouveau…
  rationale: Respecte la proposition inachevée du segment latin, qui se poursuit au verset suivant.
theological_decisions:
- issue: Rapport entre la mort, la miséricorde et le jugement
  choice: Conserver littéralement « après la mort » dans les deux propositions
  alternative: Reformuler pour faire de la résurrection le moment explicite du jugement
  rationale: Le segment fourni affirme seulement que la miséricorde sera obtenue après la mort et que le jugement viendra après la mort; le verbe relatif au retour à la vie appartient au segment suivant.
translation_notes:
  register: Français moderne, courant et digne. Le début en minuscule et la fin suspendue reflètent le fait que ce verset constitue à la fois la suite de la phrase précédente et le début d’une phrase qui se poursuit au verset suivant.
