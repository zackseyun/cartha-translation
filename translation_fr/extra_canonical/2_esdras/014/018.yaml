  text: Then I answered and said before you[a], Lord, "Behold, I will go,"
translation:
  language: fr
  text: 'Alors je répondis et dis devant toi, Seigneur : « Voici, en effet, je vais partir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  choice: Alors je pris la parole et je dis
  rationale: La tournure latine sémitisante signifie qu’il répond en prenant la parole; cette formulation reste fidèle tout en étant naturelle en français moderne.
- source_word: coram te
  choice: devant toi
  rationale: Rend directement l’expression latine sans effacer son adresse à Dieu.
- source_word: domine
  choice: Seigneur
  rationale: Équivalent usuel, digne et contextuellement approprié du vocatif latin.
- source_word: Ecce enim ego abibo
  choice: voici, je vais partir
  rationale: « Voici » conserve la force présentative de ecce; « je vais partir » exprime naturellement le futur abibo. Enim est compris ici comme particule discursive, sans traduction française lourde ou artificielle.
theological_decisions:
- issue: Référent de « devant toi » et place du vocatif
  choice: '« devant toi : “Seigneur…” »'
  alternative: '« devant toi, Seigneur : … »'
  rationale: La ponctuation retenue rattache clairement « Seigneur » au discours direct, tout en conservant l’adresse divine et sans modifier le contenu théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination répétitive du latin est légèrement idiomatisée sans perte de contenu; la limite du verset est respectée et la clause finale est maintenue.
