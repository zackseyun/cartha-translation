  text: Something like water was being offered to me[a], but its color was like fire.
translation:
  language: fr
  text: On me tendait quelque chose qui ressemblait à de l’eau[a], mais sa couleur ressemblait à celle du feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « On me tendait quelque chose qui était rempli d’une substance semblable à de l’eau, mais sa couleur ressemblait à celle du feu. »'
    reason: La syntaxe latine transmise, notamment « hoc erat plenum sicut aqua », peut décrire un objet ou un récipient rempli d’une substance comparable à de l’eau, plutôt que la substance elle-même comme ce qui est directement tendu.
lexical_decisions:
- source_word: porrigebatur mihi
  choice: On me tendait
  rationale: Le passif latin indique que quelque chose était présenté ou tendu au narrateur; l’imparfait conserve l’aspect duratif de «porrigebatur».
- source_word: sicut aqua
  choice: qui ressemblait à de l’eau
  rationale: Cette formulation naturelle conserve la comparaison exprimée par «sicut» sans identifier la substance à de l’eau véritable.
- source_word: color … sicut ignis
  choice: sa couleur était semblable au feu
  rationale: Rend directement la comparaison entre la couleur de la substance et le feu, conformément au texte transmis et à sa continuation attestée.
theological_decisions:
- issue: Nature de la substance présentée
  choice: Maintenir la comparaison avec l’eau et le feu
  alternative: Identifier explicitement la substance comme de l’eau ou comme un liquide surnaturel
  rationale: Le latin décrit des ressemblances d’aspect sans définir la nature de la substance; la traduction ne doit pas préciser davantage.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve l’imagerie comparative et signale en note l’ambiguïté syntaxique du latin transmis.
