  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
translation:
  language: fr
  text: Ma bouche s’ouvrit et ne se referma plus. Alors le Très-Haut donna l’intelligence aux cinq hommes, et ils écrivirent à tour de rôle[a] ce qui était dit, avec des signes qu’ils ne connaissaient pas[b]. Puis ils s’assirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « successivement ». L’expression latine indique que les cinq hommes écrivaient l’un après l’autre, en se relayant.
    reason: lexical_alternative
  - marker: b
    text: Le mot latin peut désigner des caractères d’écriture, des signes abrégés ou d’autres signes graphiques ; le texte ne précise pas leur nature.
    reason: lexical_alternative
lexical_decisions:
- source_word: apertum est os meum et non est clausum amplius
  choice: Ma bouche s’ouvrit et ne se referma plus
  rationale: Rend directement l’ouverture de la bouche et son caractère durable, sans expliciter davantage le phénomène.
- source_word: dedit intellectum
  choice: donna l’intelligence
  rationale: 'Conserve le sens large d’intellectus : capacité de comprendre ou faculté accordée pour accomplir la tâche.'
- source_word: ex successione
  choice: à tour de rôle
  rationale: Le contexte des cinq scribes favorise une succession de personnes écrivant l’une après l’autre, plutôt qu’un classement ordonné du contenu.
- source_word: quae dicebantur
  choice: ce qui leur était dicté
  rationale: Dans cette scène de scribes, le passif « ce qui était dit » désigne naturellement les paroles énoncées pour être mises par écrit; « leur » est implicite dans la situation.
- source_word: notis
  choice: signes
  rationale: Terme français assez large pour préserver l’indétermination du latin nota, qui peut désigner des caractères, signes graphiques ou signes sténographiques.
- source_word: sederunt
  choice: ils restèrent assis
  rationale: Rend le parfait latin dans son sens contextuel de maintien en position assise, sans ajouter la durée absente du texte source fourni.
theological_decisions:
- issue: Nature de l’assistance accordée par le Très-Haut
  choice: donna l’intelligence
  alternative: rendit capables de comprendre
  rationale: La formulation retenue ne précise pas si le don porte sur la compréhension, la mémoire, l’écriture ou l’ensemble de la tâche.
- issue: Nature des signes inconnus
  choice: signes qu’ils ne connaissaient pas
  alternative: caractères qu’ils ignoraient
  rationale: Le latin ne permet pas de déterminer s’il s’agit d’une écriture inconnue, d’une sténographie ou d’une forme d’écriture rendue possible par Dieu.
translation_notes:
  register: Français moderne, sobre et digne. Le texte conserve l’étrangeté du récit et l’indétermination de « notis ». La durée de quarante jours présente dans la couche anglaise n’a pas été ajoutée, car elle ne figure pas dans le texte latin fourni, qui s’achève simplement sur « et sederunt ».
