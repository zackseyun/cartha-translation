  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: fr
  text: Éloigne de toi les pensées mortelles, rejette les fardeaux humains, dépouille-toi maintenant de ta faible nature et mets de côté les pensées qui te tourmentent le plus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte abs te
  choice: Éloigne de toi
  rationale: Rend naturellement l’idée de renvoyer ou d’écarter loin de soi.
- source_word: mortales cogitationes
  choice: les pensées mortelles
  rationale: Conserve l’expression latine et son ambiguïté possible entre des pensées vouées à la mort et des pensées propres aux mortels.
- source_word: pondera humana
  choice: les fardeaux humains
  rationale: Traduction directe de l’image concrète des poids portés par l’être humain.
- source_word: exue te iam infirmam naturam
  choice: dépouille-toi maintenant de ta faible nature
  rationale: Préserve la métaphore du vêtement ainsi que l’adjectif infirmam, qui indique faiblesse ou fragilité.
- source_word: molestissima tibi cogitamenta
  choice: les pensées qui te tourmentent le plus
  rationale: Exprime en français courant le superlatif et la relation personnelle marquée par tibi.
theological_decisions:
- issue: Sens de « nature faible »
  choice: Maintien littéral de « ta faible nature »
  alternative: « ta nature fragile » ou « ta condition de faiblesse »
  rationale: Le texte exhorte à s’en dépouiller sans préciser ici la portée anthropologique exacte; la traduction ne tranche donc pas cette tension.
translation_notes:
  register: Français moderne, digne et accessible; impératifs vigoureux et parallélisme conservé. La virgule finale reflète la continuité syntaxique du texte source.
