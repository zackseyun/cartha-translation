  text: 'Et ecce uox exiuit contra me de rubo et dixit : Ezra, Ezra ! et dixi: ecce ego, domine. et surrexi super pedes meos, et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: fr
  text: 'Et voici qu’une voix me parvint d’un buisson et dit : « Esdras, Esdras ! » Je répondis : « Me voici, Seigneur. » Je me levai alors et me tins debout, et elle me dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: voici que
  rationale: Conserve le marqueur narratif qui attire l’attention, dans un français biblique actuel et naturel.
- source_word: uox exiuit contra me de rubo
  choice: une voix me parvint d’un buisson
  rationale: Rend le mouvement de la voix vers Esdras sans reproduire littéralement la tournure latine peu naturelle « sortit contre moi ».
- source_word: ecce ego
  choice: Me voici
  rationale: Formule française consacrée et naturelle de disponibilité en réponse à un appel.
- source_word: surrexi super pedes meos
  choice: Je me levai alors et me tins debout
  rationale: Exprime pleinement le fait de se relever et d’être sur ses pieds, sans lourdeur excessive.
theological_decisions:
- issue: Identité de la voix
  choice: Reprise par le pronom « elle », renvoyant grammaticalement à « une voix »
  alternative: « le Seigneur me dit » ou « il me dit »
  rationale: Le latin ne nomme pas explicitement celui qui parle dans la dernière proposition; la traduction préserve cette retenue plutôt que d’expliciter l’identité divine.
- issue: Adresse « domine »
  choice: « Seigneur » avec majuscule
  alternative: « seigneur » ou « maître »
  rationale: Dans ce contexte de révélation et d’appel, Esdras s’adresse vraisemblablement à Dieu; « Seigneur » rend naturellement cette portée sans ajouter de nom divin.
translation_notes:
  register: Français moderne international, narratif et digne. Le double appel et les répétitions structurantes sont conservés; les temps du récit assurent une lecture fluide. Aucun marqueur de note n’est requis.
