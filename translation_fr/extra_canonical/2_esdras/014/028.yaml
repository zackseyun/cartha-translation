source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: grinati sunt patres nostri ab initio in Aegypto, et liberati sunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/028.yaml
  text: From the beginning[a], our fathers sojourned in Egypt, and they were delivered.
translation:
  language: fr
  text: Dès le commencement[a], nos pères ont séjourné en Égypte, et ils ont été délivrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Au commencement, nos pères ont séjourné en Égypte » ; l’expression peut marquer la première étape de leur histoire plutôt que la durée du séjour.'
    reason: Préserver l’ambiguïté de rattachement de « ab initio ».
lexical_decisions:
- source_word: grinati sunt
  choice: ont séjourné
  rationale: Le latin transmis paraît irrégulier ou corrompu; le sens retenu par la tradition éditoriale est celui d’un séjour en terre étrangère. « Séjourner » rend ce sens sans ajouter de précision absente du texte.
- source_word: patres nostri
  choice: nos pères
  rationale: Expression généalogique et collective naturelle dans ce registre, plus proche du latin que « nos ancêtres ».
- source_word: liberati sunt
  choice: ont été délivrés
  rationale: Conserve la voix passive et laisse implicite, comme le latin, l’auteur et les circonstances de la délivrance.
theological_decisions:
- issue: Portée temporelle de « ab initio »
  choice: Dès le commencement
  alternative: Au commencement, nos pères ont séjourné en Égypte
  rationale: Le latin permet de rattacher l’expression soit au récit dans son ensemble, soit au séjour en Égypte. Le texte principal suit l’ordre et la valeur durative possibles du latin, tandis que la note conserve l’autre lecture.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste proche de la syntaxe latine tout en étant naturelle; elle évite d’ajouter « de là », absent de la source.
