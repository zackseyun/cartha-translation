translation:
  language: fr
  text: Quand tu auras terminé, tu rendras certaines choses publiques et tu en remettras d’autres en secret aux sages, car demain, à cette heure-ci, tu commenceras à écrire. » Je partis, comme il me l’avait ordonné, et je rassemblai tout…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum perfeceris
  choice: Quand tu auras terminé
  rationale: Le complément de « perfeceris » est sous-entendu dans le fragment latin. Cette formulation naturelle conserve cette indétermination sans lui attribuer artificiellement un genre en français.
- source_word: quaedam palam facies
  choice: tu rendras certaines choses publiques
  rationale: Rend directement l’opposition entre ce qui doit être communiqué ouvertement et ce qui doit être réservé aux sages.
- source_word: quaedam sapientibus absconse trades
  choice: tu en remettras d’autres en secret aux sages
  rationale: « Remettre » traduit trades comme une transmission confiée, tandis que « en secret » restitue absconse sans préciser davantage la nature du secret.
- source_word: in crastinum enim hac hora
  choice: car demain, à cette heure-ci
  rationale: « car » traduit enim et maintient le lien explicatif; « à cette heure-ci » exprime naturellement hac hora.
- source_word: profectus sum
  choice: Je partis
  rationale: Traduction concise et narrative du verbe de départ, adaptée au registre du passage.
- source_word: congregaui omnem
  choice: je rassemblai toute la…
  rationale: Le texte fourni s’interrompt après l’adjectif féminin singulier omnem. La traduction conserve délibérément cette lacune et son indication grammaticale au lieu de suppléer le nom manquant.
theological_decisions:
- issue: Répartition entre révélation publique et transmission secrète
  choice: Conserver explicitement le contraste entre « publiques » et « en secret aux sages »
  alternative: Atténuer « en secret » en « à part » ou expliciter le contenu transmis
  rationale: Le latin établit réellement cette tension sans expliquer ici la nature ni la portée de la transmission réservée; la traduction ne doit donc ni l’effacer ni la développer.
translation_notes:
  register: Français international moderne, fluide et digne. Le futur antérieur marque l’achèvement préalable; la fin demeure volontairement suspendue parce que l’extrait latin s’interrompt sur « omnem ».
