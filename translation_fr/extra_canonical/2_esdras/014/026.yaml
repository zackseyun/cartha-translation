    issue: La traduction finale « toute la… » impose un féminin et l’article « la ».
    rationale: Le fragment s’achève à omnem, forme accusative qui peut être masculine ou féminine et qui appelle un nom non conservé ici. La note lexicale affirmant qu’il s’agit d’un « adjectif féminin singulier » est donc incorrecte. Il convient de conserver l’interruption sans fixer ce genre ni ajouter un article.
