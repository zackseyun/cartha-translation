  to: Quand tu auras terminé, tu rendras certaines choses publiques et tu en remettras d’autres en secret aux sages, car demain, à cette heure-ci, tu commenceras à écrire. » Je partis, comme il me l’avait ordonné, et je rassemblai tout…
  rationale: La seule correction porte sur la finale lacunaire. « Tout… » permet de signaler l’arrêt du texte après omnem sans transformer ce mot en « toute la », qui présuppose à tort un nom féminin déterminé. Le reste du texte est conservé, car il est fidèle et naturel.
