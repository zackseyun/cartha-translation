  text: you may hand them over to the wise among your people. For in them is the vein of understanding[a], the fountain of wisdom, and the river of knowledge.”
translation:
  language: fr
  text: tu les confieras aux sages de ton peuple. Car en eux se trouvent la veine de l’intelligence[a], la source de la sagesse et le fleuve de la connaissance. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car en eux se trouvent la source de l’intelligence, la source de la sagesse et le fleuve de la connaissance. »'
    reason: Le latin vena signifie littéralement « veine », mais peut, par métaphore, désigner une source ou une origine. La traduction principale préserve la distinction imagée avec fons (« source ») et flumen (« fleuve »).
lexical_decisions:
- source_word: tradas
  choice: tu pourras les confier
  rationale: Le subjonctif latin dépend de la proposition finale commencée au verset précédent. « Tu pourras » restitue ici la nuance de possibilité ou d’autorisation, tandis que « confier » convient à la remise de livres aux sages.
- source_word: sapientibus de populo tuo
  choice: aux sages de ton peuple
  rationale: Rendu direct et naturel de sapientibus de populo tuo.
- source_word: uena intellectus
  choice: la veine de l’intelligence
  rationale: « Veine » conserve l’image précise de vena et la distingue de fons, « source », dans le membre suivant.
- source_word: sapientiae fons
  choice: la source de la sagesse
  rationale: Correspondance naturelle de fons, qui maintient l’image d’une origine abondante.
- source_word: scientiae flumen
  choice: le fleuve de la connaissance
  rationale: « Fleuve » rend flumen et préserve la progression imagée de la veine à la source, puis au cours d’eau puissant.
theological_decisions:
- issue: Référent et valeur des écrits remis aux sages
  choice: Conserver « en eux » et les trois métaphores sans explicitation
  alternative: Préciser qu’il s’agit des livres et expliquer qu’ils communiquent une révélation divine
  rationale: Le latin emploie simplement in his et décrit leur contenu par des images. Une explicitation théologique dépasserait le texte.
translation_notes:
  register: Français moderne, clair et digne. La métaphore inhabituelle « veine de l’intelligence » est maintenue par fidélité au latin, avec une formulation plus idiomatique en note. La minuscule initiale conserve le lien syntaxique avec le verset précédent; le guillemet final marque la fin du discours.
