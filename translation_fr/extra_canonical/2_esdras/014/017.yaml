  text: upon those who dwell in it. For truth will withdraw farther away, and falsehood will draw near. For already the eagle that you saw in the vision is hastening to come.”
translation:
  language: fr
  text: sur les habitants de la terre. Car la vérité s’éloignera davantage, et le mensonge s’approchera. Déjà, en effet, l’aigle que tu as vu dans la vision se hâte de venir. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super inhabitantes in eo mala
  choice: sur les habitants de la terre
  rationale: Le fragment latin commence au milieu d’une phrase. «eo» renvoie vraisemblablement à la terre ou au monde mentionné dans le contexte; la formulation française conserve la continuité syntaxique sans répéter «les malheurs», qui appartient au segment précédent.
- source_word: Prolongabit enim magis ueritas
  choice: Car la vérité s’éloignera davantage
  rationale: 'Le latin transmis est difficile: «prolongabit» est employé sans objet exprimé. Dans l’opposition avec «adpropinquabit mendacium», il indique que la vérité se tiendra ou sera portée toujours plus loin.'
- source_word: adpropinquabit mendacium
  choice: le mensonge s’approchera
  rationale: Traduction directe qui préserve le parallélisme antithétique entre l’éloignement de la vérité et l’approche du mensonge.
- source_word: iam enim festinat aquila uenire
  choice: Déjà, en effet, l’aigle… se hâte de venir
  rationale: La construction et l’imminence exprimée par «iam» et «festinat» sont conservées dans un français naturel et solennel.
- source_word: quam uidisti in uisionem
  choice: que tu as vu dans la vision
  rationale: Le latin présente «in uisionem», là où l’on attendrait «in uisione»; le sens contextuel est néanmoins clair.
theological_decisions:
- issue: Valeur symbolique de l’aigle
  choice: Conserver simplement «l’aigle»
  alternative: Identifier explicitement l’aigle à un empire ou à une puissance particulière
  rationale: Le verset renvoie à une vision antérieure sans expliciter ici l’interprétation du symbole; la traduction ne doit pas résoudre cette référence dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset étant un fragment qui poursuit la phrase précédente, il commence par une minuscule. Le contraste rhétorique du latin est maintenu, ainsi que l’image apocalyptique sans ajout interprétatif.
