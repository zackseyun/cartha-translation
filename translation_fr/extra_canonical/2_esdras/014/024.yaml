  text: for forty days. But you[a], prepare for yourself many writing tablets, and take with you Sarea, Dabria, Selemia, Ethan, and Asiel, five
translation:
  language: fr
  text: pendant quarante jours. Quant à toi, prépare-toi un grand nombre de tablettes à écrire[a], et prends avec toi Saréa, Dabria, Sélémia, Éthan et Asihel, cinq.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin « buxos » désigne littéralement des tablettes en buis, c’est-à-dire faites avec le bois du buis. La traduction en donne ici la fonction.
    reason: cultural_note
lexical_decisions:
- source_word: diebus XL
  choice: pendant quarante jours
  rationale: Rend naturellement la durée exprimée par l’ablatif latin et conserve la continuité avec la phrase précédente.
- source_word: buxos multos
  choice: de nombreuses tablettes pour écrire
  rationale: Le latin désigne littéralement des objets en buis; dans ce contexte, il s’agit de tablettes destinées à l’écriture. La note conserve la précision matérielle.
- source_word: quinque
  choice: cinq hommes
  rationale: Le chiffre récapitule les cinq personnes nommées. L’ajout explicatif « hommes » produit une phrase française complète sans modifier le référent.
- source_word: Asihel
  choice: Asihel
  rationale: Translittération proche de la forme latine transmise, sans harmonisation conjecturale avec une autre tradition nominale.
