  text: nunc uos hic estis, et fratres uestri introrsum uestrum sunt. Si ergo imperaueritis sensui uestro et erudieritis cor uestrum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
translation:
  language: fr
  text: Maintenant, vous êtes ici, et vos frères sont au-dedans de vous[a]. Si donc vous maîtrisez votre esprit et instruisez votre cœur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure latine est inhabituelle : littéralement, « au-dedans de vous ». Son sens précis demeure incertain; elle peut peut-être évoquer la présence de vos frères parmi vous.'
    reason: Préserver l’ambiguïté réelle de *introrsum vestrum* sans introduire dans le texte une localisation géographique non explicitée.
lexical_decisions:
- source_word: nunc uos hic estis
  choice: Maintenant, vous êtes ici
  rationale: Rend directement l’indication temporelle et locale du latin.
- source_word: introrsum uestrum sunt
  choice: se trouvent plus loin à l’intérieur du pays que vous
  rationale: Dans le contexte, introrsum exprime vraisemblablement une position plus reculée vers l’intérieur; uestrum peut être compris comme un génitif de comparaison. Une note conserve l’ambiguïté de cette tournure latine inhabituelle.
- source_word: imperaueritis sensui uestro
  choice: vous maîtrisez votre esprit
  rationale: «Maîtriser son esprit» exprime naturellement l’idée de gouverner ou commander sa faculté de discernement, sans la réduire à la seule intelligence conceptuelle.
- source_word: erudieritis cor uestrum
  choice: instruisez votre cœur
  rationale: Conserve l’image biblique du cœur comme siège de la vie intérieure et rend formellement erudieritis.
theological_decisions:
- issue: Phrase conditionnelle laissée sans proposition principale dans ce verset
  choice: Conserver la virgule finale et ne pas importer la conséquence du verset suivant
  alternative: Ajouter «vous resterez en vie et, après la mort, vous obtiendrez miséricorde»
  rationale: Le texte source fourni pour 14.33 s’arrête après erudieritis cor uestrum; la proposition principale appartient au verset suivant selon ce découpage.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conditionnelle demeure volontairement en suspens, conformément au découpage du texte source.
