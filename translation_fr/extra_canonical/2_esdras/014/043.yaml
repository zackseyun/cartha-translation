  yaml_path: translation/extra_canonical/2_esdras/014/043.yaml
  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: fr
  text: Pendant quarante jours, ils écrivaient le jour et mangeaient du pain la nuit. Quant à moi, je parlais le jour et, la nuit, je ne me taisais pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte latin fourni s’arrête après « non » (« ne… pas »). « Je ne me taisais pas » suit le verbe attesté dans la tradition latine complète ; si l’on comprend « non » comme une ellipse du verbe précédent, le sens pourrait aussi être : « la nuit, je ne mangeais pas ».'
    reason: Signaler que le dernier verbe n’est pas présent dans l’extrait latin fourni et préserver l’autre compréhension grammaticalement possible.
lexical_decisions:
- source_word: XL diebus
  choice: Pendant quarante jours
  rationale: Rend naturellement l’indication de durée placée en tête du texte latin.
- source_word: per diem
  choice: le jour
  rationale: Expression française courante qui conserve le contraste avec « la nuit ».
- source_word: manducabant panem
  choice: mangeaient du pain
  rationale: Traduction directe, sans généraliser en « prenaient leur repas ».
- source_word: loquebar
  choice: je parlais
  rationale: Conserve l’imparfait duratif du latin et le parallèle avec l’activité des scribes.
- source_word: et nocte non
  choice: et, la nuit, je ne gardais pas le silence
  rationale: Le latin fourni s’interrompt après la négation « non »; la formulation retenue suit la lecture contextuelle reflétée par la tradition textuelle et la couche de consultation anglaise, tout en signalant la difficulté en note.
theological_decisions:
- issue: Nature de l’activité nocturne d’Esdras
  choice: Il ne gardait pas le silence la nuit.
  alternative: Il ne mangeait pas la nuit.
  rationale: La fin abrégée « et nocte non » pourrait, prise isolément, reprendre elliptiquement « mangeait du pain ». Toutefois, la lecture traditionnelle « non tacebam » et le parallélisme avec « je parlais le jour » appuient « je ne gardais pas le silence ». La note préserve l’incertitude du texte latin fourni.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « le jour… la nuit » est maintenue pour reproduire le rythme et les contrastes du latin.
