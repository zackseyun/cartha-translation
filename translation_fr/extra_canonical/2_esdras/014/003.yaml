  text: I revealed myself in the bush[a], and I spoke to Moses when my people were serving in Egypt.
translation:
  language: fr
  text: Je me suis révélé dans le buisson, et j’ai parlé à Moïse lorsque mon peuple était asservi en Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Reuelans reuelatus sum
  choice: Je me suis pleinement révélé
  rationale: La répétition étymologique latine, littéralement « me révélant, j’ai été révélé », reflète vraisemblablement une tournure sémitisante à valeur emphatique. « pleinement » en restitue l’insistance dans un français naturel sans surcharger la phrase.
- source_word: super rubum
  choice: dans le buisson
  rationale: Dans le récit de Moïse, le latin super peut rendre une préposition sous-jacente désignant le lieu de la manifestation; « dans le buisson » est idiomatique et conforme à l’allusion biblique.
- source_word: seruiebat
  choice: était asservi
  rationale: Le verbe servire indique ici la condition de servitude du peuple en Égypte, plutôt qu’un service volontaire; « était asservi » exprime clairement cette contrainte.
theological_decisions:
- issue: Force emphatique de « Reuelans reuelatus sum »
  choice: La rendre par « pleinement »
  alternative: « Je me suis révélé » ou « Je me suis vraiment révélé »
  rationale: La formulation latine redoublée paraît conserver une emphase de la langue source. « Pleinement » maintient cette force sans transformer l’énoncé en affirmation de véracité.
- issue: Lieu de la révélation
  choice: « dans le buisson »
  alternative: « sur le buisson » ou « au buisson »
  rationale: L’allusion à la théophanie mosaïque appelle une expression locative naturelle; ce choix ne précise pas davantage la manière de la manifestation.
translation_notes:
  register: Français international moderne, digne et direct. « Moïse » et « Égypte » suivent les formes bibliques françaises usuelles; « asservi » conserve le contexte oppressif sans archaïsme.
