  yaml_path: translation/extra_canonical/2_esdras/014/006.yaml
  text: These words you shall make public, and these you shall hide.
translation:
  language: fr
  text: Tu rendras publiques ces paroles-ci, et tu cacheras celles-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in palam facies
  choice: rendras publiques
  rationale: L’expression latine signifie littéralement « faire paraître au grand jour »; « rendre publiques » en restitue naturellement le sens.
- source_word: haec … haec
  choice: ces paroles-ci … celles-là
  rationale: Le double démonstratif oppose deux ensembles de paroles. La distinction « -ci / -là » rend cette opposition explicitement en français sans déterminer leur contenu.
- source_word: abscondes
  choice: cacheras
  rationale: « Cacher » correspond directement au verbe latin et conserve le contraste avec la publication.
theological_decisions:
- issue: Opposition entre révélation publique et contenu caché
  choice: Conserver sans l’expliquer l’ordre de publier certaines paroles et d’en cacher d’autres.
  alternative: Préciser qu’il s’agit d’écrits destinés respectivement au public et aux sages.
  rationale: Le verset latin ne nomme ni les destinataires ni la nature précise des deux ensembles; les ajouter résoudrait indûment une tension laissée ouverte ici.
translation_notes:
  register: Français moderne, simple et digne. Le futur traduit les deux futurs latins. « Mais » exprime naturellement le contraste porté par la juxtaposition avec et.
