source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
translation:
  language: fr
  text: Mais ceux qui naîtront ensuite, qui les avertira ? Car le monde présent est plongé dans les ténèbres[a], et ceux qui l’habitent sont sans lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se trouve dans les ténèbres » ; littéralement : « a été placé dans les ténèbres ».'
    reason: Signaler que le parfait passif latin « positum est » peut être compris comme une description d’état ou rendu plus littéralement comme un passif d’action.
lexical_decisions:
- source_word: iterum nati fuerint
  choice: ceux qui naîtront ensuite
  rationale: Dans ce fragment, « iterum » est rendu selon sa valeur contextuelle de succession temporelle (« ensuite », « après »), plutôt que comme une nouvelle naissance des mêmes personnes.
- source_word: commonebit
  choice: avertira
  rationale: Le verbe latin peut signifier rappeler, exhorter ou avertir. « Avertir » exprime naturellement ici la transmission nécessaire d’un enseignement aux générations futures.
- source_word: saeculum
  choice: le monde présent
  rationale: « Saeculum » désigne ici l’âge ou l’ordre du monde dans lequel vivent les humains. « Le monde présent » est idiomatique et conserve cette portée temporelle.
- source_word: positum est ... in tenebris
  choice: est plongé dans les ténèbres
  rationale: La construction décrit principalement un état ou une situation. Cette formulation française naturelle évite d’affirmer explicitement qui aurait placé le monde dans les ténèbres.
- source_word: sine lumine
  choice: sans lumière
  rationale: Rendu direct qui préserve l’image et sa possible portée intellectuelle ou spirituelle sans l’expliciter.
theological_decisions:
- issue: Agent implicite de « positum est »
  choice: Ne pas nommer d’agent et rendre la condition présente par « est plongé »
  alternative: « a été placé dans les ténèbres »
  rationale: Le latin passif ne nomme aucun agent. Une formulation stative préserve cette indétermination et évite d’attribuer directement cette situation à Dieu.
- issue: Sens de la lumière et des ténèbres
  choice: Conserver les images sans glose
  alternative: Expliciter comme ignorance ou absence de révélation
  rationale: Le texte permet une portée à la fois cognitive, morale et spirituelle; l’explicitation réduirait cette richesse.
translation_notes:
  register: Français international moderne, digne et accessible. La question conserve sa force rhétorique; les images de ténèbres et de lumière restent intactes.
