  text: The signs that I have shown[a], and the dreams that you have seen, and the interpretations that you have heard—store them up in your heart.
translation:
  language: fr
  text: Les signes que je t’ai montrés, les rêves que tu as vus et les interprétations que tu as entendues, garde-les dans ton cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Signa
  choice: Les signes
  rationale: Équivalent direct et naturel du latin « signa », dans le contexte de révélations.
- source_word: demonstraui
  choice: je t’ai montrés
  rationale: Rend le parfait latin et explicite naturellement en français le destinataire déjà contenu dans le contexte.
- source_word: somnia
  choice: les rêves
  rationale: Traduction courante de « somnia », adaptée aux expériences visionnaires d’Esdras.
- source_word: interpretationes
  choice: les interprétations
  rationale: Conserve le sens explicatif du latin sans préciser indûment qui les a données.
- source_word: in corde tuo repone ea
  choice: garde-les dans ton cœur
  rationale: Préserve la reprise pronominale « ea » et l’antéposition emphatique des trois groupes nominaux; « garder dans son cœur » exprime naturellement la conservation intérieure demandée.
theological_decisions:
- issue: Nature des interprétations entendues
  choice: les interprétations que tu as entendues
  alternative: les explications qui t’ont été données
  rationale: La formulation retenue reste au plus près du latin et n’ajoute ni agent ni précision doctrinale.
- issue: Structure emphatique avec reprise pronominale
  choice: Objets antéposés, repris par « les » dans « garde-les »
  alternative: Garde dans ton cœur les signes…
  rationale: Cette construction conserve le détachement à gauche du latin et met en relief l’ensemble des révélations avant l’impératif.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la montée rhétorique de la source latine grâce à l’énumération initiale suivie de la reprise « garde-les ».
