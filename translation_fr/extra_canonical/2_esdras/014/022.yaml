  text: or the things that are about to happen[a]. For if I have found favor before you, send the Holy Spirit into me, and I will write everything that has happened in the world from the beginning, the things that were written in your law, so that men may be able to find the path[c][b], and that those who wish
translation:
  language: fr
  text: ou les choses qui vont commencer à se produire. Car, si j’ai trouvé grâce devant toi, envoie en moi l’Esprit Saint, et j’écrirai tout ce qui s’est produit dans le monde depuis le commencement, tout ce qui était écrit dans ta Loi, afin que les êtres humains puissent trouver le chemin, et que ceux qui le voudront
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: incipient operari
  choice: vont commencer à se produire
  rationale: Rend naturellement l’idée d’événements qui commenceront à avoir lieu, sans suggérer qu’un agent les « fera » nécessairement.
- source_word: inmitte in me
  choice: envoie en moi
  rationale: Conserve la direction exprimée par in me et la demande que l’Esprit soit envoyé au-dedans d’Esdras.
- source_word: in saeculo ab initio
  choice: dans le monde depuis le commencement
  rationale: Dans ce contexte rétrospectif portant sur toute l’histoire depuis le commencement, saeculum désigne le monde ou son cours historique plutôt qu’un âge eschatologique.
- source_word: semitam
  choice: le chemin
  rationale: Équivalent courant et digne de l’image de la voie à retrouver grâce aux écrits restaurés.
- source_word: homines
  choice: les êtres humains
  rationale: Formulation inclusive naturelle en français moderne, désignant l’humanité sans restreindre le sens aux hommes de sexe masculin.
theological_decisions:
- issue: Capitalisation de spiritum sanctum
  choice: l’Esprit saint
  alternative: l’esprit saint
  rationale: Le contexte présente l’Esprit comme envoyé par Dieu et agissant en Esdras; la majuscule convient à l’usage français biblique, sans ajouter de définition doctrinale au texte.
- issue: Lien logique de Si enim
  choice: Car, si
  alternative: Mais si
  rationale: Enim introduit une explication ou une justification, non une opposition.
translation_notes:
  register: Français international moderne, clair et digne. Le caractère fragmentaire de la fin du verset est conservé. « Loi » prend la majuscule comme désignation des écrits législatifs sacrés.
