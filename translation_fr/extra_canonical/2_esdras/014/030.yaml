  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
translation:
  language: fr
  text: Après eux, vous avez transgressé. La terre vous a été donnée en partage dans le pays de Sion, mais vous et vos pères avez commis l’iniquité et n’avez pas suivi les voies que le Très-Haut vous a commandé de suivre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: transgressi estis
  choice: vous avez transgressé
  rationale: Rend directement l’idée de franchir les limites fixées ou de désobéir, dans un registre biblique encore compréhensible aujourd’hui.
- source_word: post eos
  choice: après eux
  rationale: Conserve la concision et la possible portée à la fois temporelle et successive du latin.
- source_word: data est uobis terra
  choice: la terre vous a été donnée
  rationale: Préserve la voix passive et l’accent mis sur le don reçu.
- source_word: in sorte
  choice: en partage
  rationale: Exprime naturellement l’idée d’une terre attribuée comme lot, sans ajouter explicitement la notion d’héritage.
- source_word: et uos et patres uestri
  choice: vous comme vos pères
  rationale: Reproduit la corrélation emphatique du double et, qui associe explicitement les deux générations dans la faute.
- source_word: iniquitatem fecistis
  choice: vous avez commis l’iniquité
  rationale: Conserve le vocabulaire moral et judiciaire du texte tout en restant idiomatique en français biblique moderne.
- source_word: non servastis vias
  choice: vous n’avez pas suivi les voies
  rationale: En français actuel, « suivre les voies » transmet plus naturellement l’obéissance pratique que le calque « garder les voies ».
- source_word: Altissimus
  choice: le Très-Haut
  rationale: Titre divin français traditionnel, précis et largement intelligible.
theological_decisions:
- issue: Responsabilité intergénérationnelle
  choice: vous comme vos pères
  alternative: vous et vos pères
  rationale: La formulation retenue maintient l’insistance grammaticale du latin sur la culpabilité conjointe, sans suggérer que la faute des pères serait imputée aux descendants indépendamment de leurs propres actes.
- issue: Nature de l’attribution de la terre
  choice: donnée en partage
  alternative: donnée en héritage
  rationale: « En partage » rend l’idée du lot attribué sans introduire une précision théologique supplémentaire sur l’héritage.
translation_notes:
  register: Français international moderne, solennel mais accessible. La reprise « vous… vous » soutient l’emphase du texte et distingue clairement la génération interpellée de ses pères. Aucun ajout confessionnel ni résolution artificielle d’une tension théologique.
