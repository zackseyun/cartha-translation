  text: But let no one come near me now, nor seek me for forty days.”
translation:
  language: fr
  text: « Mais que personne ne s’approche de moi maintenant ni ne me cherche pendant quarante jours. »[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le fragment latin fourni commence littéralement par « ils me chercheront jusqu’à quarante jours », mais la phrase complète de la tradition latine porte l’interdiction : « que personne ne s’approche maintenant de moi ni ne me cherche pendant quarante jours ».'
    reason: Signaler avec transparence que l’extrait latin fourni est tronqué au début du verset et présente requirent, là où le contexte syntaxique de la phrase complète appelle une forme prohibitive.
lexical_decisions:
- source_word: requirent me
  choice: ne me cherche
  rationale: Dans le contexte de l’instruction, le verbe signifie « chercher à me voir / me solliciter ». La formulation française reprend la portée prohibitive attestée par la phrase complète transmise dans la tradition latine, plutôt qu’un futur affirmatif isolé.
- source_word: usque diebus XL
  choice: pendant quarante jours
  rationale: Le latin exprime ici la durée de la période, rendue naturellement en français par « pendant quarante jours ».
