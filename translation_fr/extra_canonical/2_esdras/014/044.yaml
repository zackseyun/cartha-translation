  text: And in forty days ninety-four books were written[a].
translation:
  language: fr
  text: Et, en quarante jours, quatre-vingt-quatorze livres furent écrits[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le chiffre transmis dans le texte latin est difficile à établir. Le sens généralement reconnu de ce chapitre est « quatre-vingt-quatorze livres », ce qui correspond aussi à la répartition entre les écrits publics et les soixante-dix derniers, réservés aux sages.
    reason: textual_variant
lexical_decisions:
- source_word: in XL diebus
  choice: en quarante jours
  rationale: Rend directement la durée exprimée en latin, dans un français naturel.
- source_word: libri
  choice: livres
  rationale: Équivalent courant et précis du latin dans ce contexte d’écrits distincts.
- source_word: scripti sunt
  choice: furent écrits
  rationale: Conserve la voix passive et le caractère narratif de l’énoncé latin.
- source_word: DCCCClIIII
  choice: quatre-vingt-quatorze
  rationale: Le chiffre transmis est textuellement difficile; le total de quatre-vingt-quatorze correspond au sens largement reconnu du passage et à la répartition ultérieure entre vingt-quatre livres publics et soixante-dix réservés aux sages.
theological_decisions:
- issue: Total des livres écrits
  choice: quatre-vingt-quatorze
  alternative: reproduire littéralement le chiffre latin transmis, malgré son état problématique
  rationale: Le contexte immédiat confirme une somme de quatre-vingt-quatorze, composée des vingt-quatre écrits rendus publics et des soixante-dix gardés pour les sages; une note signale néanmoins la difficulté textuelle.
translation_notes:
  register: Français international moderne, simple et digne. La tournure passive du latin est conservée. Le mot « tacebam » (« je gardais le silence ») est traité comme la fin de la phrase précédente, conformément à la délimitation du verset reflétée par le texte de consultation.
