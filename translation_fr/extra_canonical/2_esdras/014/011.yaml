id: 2ES.14.11
reference: 2 Esdras 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: XII enim partibus diuisum est saeculum, et transierunt eius X iam et dimidium xmae partis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/011.yaml
  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
translation:
  language: fr
  text: Car l’âge a été divisé en douze parties, et neuf de ses parties sont déjà passées, ainsi que la moitié de la dixième[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin porte « dix de ses parties », mais plusieurs anciennes versions ont « neuf », leçon qui concorde avec « la moitié de la dixième » et avec le verset suivant.
    reason: Signaler honnêtement l’écart entre le témoin latin fourni et la leçon retenue d’après les autres témoins anciens et la cohérence immédiate du passage.
lexical_decisions:
- source_word: saeculum
  choice: l’âge
  rationale: Dans ce contexte eschatologique, « l’âge » désigne la période présente du monde et rend naturellement le latin sans réduire le terme au seul « monde » matériel.
- source_word: partibus
  choice: parties
  rationale: Le terme conserve l’image d’une durée divisée en douze portions.
- source_word: transierunt
  choice: sont déjà passées
  rationale: Cette formulation rend le parfait latin et l’idée de portions temporelles désormais écoulées.
theological_decisions:
- issue: Nombre de parties déjà écoulées
  choice: neuf
  alternative: dix
  rationale: Le texte latin édité porte « X » (« dix »), mais cette leçon contredit la mention de « la moitié de la dixième » et le calcul du verset suivant, où deux parties et demie restent. Les anciennes versions syriaque, éthiopienne, arabe et arménienne soutiennent « neuf »; cette leçon est donc retenue dans le texte, tandis que la leçon latine est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure reste proche de la structure latine tout en explicitant par « ainsi que » que la moitié de la dixième partie s’ajoute aux neuf parties déjà écoulées.
