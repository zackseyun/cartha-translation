translation:
  language: fr
  text: 'le peuple et j’ai dit : « Écoute ces paroles, Israël : Vous qui séjournez, vous qui séj— »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin s’interrompt au début de la répétition du mot.
    reason: Signaler honnêtement l’état fragmentaire de la source sans en proposer une reconstruction non attestée.
lexical_decisions:
- source_word: populum
  choice: le peuple
  rationale: Conserve l’accusatif latin tel qu’il apparaît dans ce fragment, dont le verbe introducteur se trouve vraisemblablement dans le contexte précédent.
- source_word: Audi, Israel
  choice: Écoute ces paroles, Israël
  rationale: Le singulier impératif « Écoute » correspond à l’adresse collective traditionnelle faite à Israël; l’ordre français place naturellement le complément avant le vocatif.
- source_word: Peregrinantes
  choice: Vous qui séjournez
  rationale: Rend le participe latin par une adresse plurielle naturelle, sans imposer les idées plus précises de pèlerinage ou d’exil.
- source_word: pere-
  choice: vous qui sé—
  rationale: Reproduit en français la reprise brusquement interrompue du début du mot latin, plutôt que de compléter conjecturalement la phrase.
theological_decisions:
- issue: Nature du séjour exprimé par peregrinantes
  choice: Formulation neutre « vous qui séjournez »
  alternative: « exilés » ou « pèlerins »
  rationale: Le latin désigne des personnes vivant ou voyageant hors de leur lieu habituel, sans préciser à lui seul s’il s’agit d’un exil théologique, d’un pèlerinage ou d’un simple séjour.
translation_notes:
  register: Français moderne, digne et accessible. Le début syntaxiquement incomplet et la fin tronquée sont conservés parce que le verset fourni constitue lui-même un fragment.
