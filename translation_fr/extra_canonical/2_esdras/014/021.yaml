  text: Car ta loi a été brûlée ; c’est pourquoi personne ne sait ce que tu as accompli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lex tua
  choice: ta loi
  rationale: Rend directement le latin et conserve l’adresse personnelle à Dieu, dans un français naturel.
- source_word: incensa est
  choice: a été brûlée
  rationale: Conserve la forme passive et le sens concret de la destruction de la loi écrite.
- source_word: propter quod
  choice: c’est pourquoi
  rationale: Exprime clairement le lien de conséquence marqué par le latin.
- source_word: nemo scit
  choice: personne ne sait
  rationale: Équivalent direct, simple et actuel.
- source_word: quae a te
  choice: ce que tu as accompli
  rationale: Le texte latin fourni est elliptique après « a te » ; cette formulation restitue naturellement le sens passif sous-entendu (« ce qui a été fait par toi ») sans ajouter de nouvel objet.
theological_decisions:
- issue: Nature de ce qui n’est plus connu
  choice: ce que tu as accompli
  alternative: tes œuvres
  rationale: La formulation retenue préserve la portée générale de l’expression latine elliptique et évite de la réduire à une catégorie théologique plus précise.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase causale et l’adresse à Dieu sont conservées sans explicitation confessionnelle.
