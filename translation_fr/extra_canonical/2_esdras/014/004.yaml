source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et misi eum et eduxit populum meum de Aegypto, et adduxi eum super montem Sina et detinui eum apud me diebus multis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/004.yaml
  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: fr
  text: Je l’ai envoyé, et il a fait sortir mon peuple d’Égypte. Je l’ai conduit sur le mont Sinaï et je l’ai gardé auprès de moi pendant de nombreux jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misi eum
  choice: Je l’ai envoyé
  rationale: Rend directement le verbe latin mittere et conserve le pronom masculin renvoyant au personnage mentionné dans le contexte.
- source_word: eduxit populum meum de Aegypto
  choice: il a fait sortir mon peuple d’Égypte
  rationale: « Faire sortir » exprime naturellement en français le mouvement hors d’Égypte porté par educere.
- source_word: adduxi eum super montem Sina
  choice: Je l’ai conduit sur le mont Sinaï
  rationale: Rend adducere par « conduire » et super par « sur », sans préciser davantage le lieu exact sur la montagne.
- source_word: detinui eum apud me
  choice: je l’ai gardé auprès de moi
  rationale: Préserve l’idée de maintien prolongé exprimée par detinere ainsi que la proximité indiquée par apud me.
- source_word: diebus multis
  choice: pendant de nombreux jours
  rationale: Traduction idiomatique et fidèle de l’expression temporelle latine.
theological_decisions:
- issue: Répartition des actions entre Dieu et l’homme envoyé
  choice: 'Conserver les sujets grammaticaux distincts : « il a fait sortir », puis « je l’ai conduit » et « je l’ai gardé »'
  alternative: Uniformiser les actions en attribuant directement à Dieu la sortie d’Égypte
  rationale: Le latin distingue explicitement eduxit, dont l’envoyé est le sujet, de adduxi et detinui, dont le locuteur divin est le sujet; cette tension doit être maintenue.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation en deux phrases allège la longue coordination latine sans modifier l’enchaînement des actions.
