lexical_decisions:
- source_word: reuiuiscemus
  choice: nous revivrons
  rationale: Rend directement le futur latin et l’idée d’un retour à la vie, sans préciser davantage la nature de cette vie.
- source_word: iustorum nomen
  choice: le nom des justes
  rationale: Conserve l’expression littérale et sa possible valeur collective ou réputationnelle, sans en réduire l’ambiguïté.
- source_word: impiorum facta
  choice: les actes des impies
  rationale: « Actes » traduit naturellement facta et « impies » maintient la portée religieuse de impiorum.
- source_word: ostendentur
  choice: seront dévoilés
  rationale: Exprime la manifestation publique de faits jusque-là cachés, dans un français naturel.
- source_word: accedat
  choice: s’approche de moi
  rationale: Rend le mouvement vers le locuteur indiqué par ad me.
theological_decisions:
- issue: Sens de reuiuiscemus
  choice: nous revivrons
  alternative: nous ressusciterons
  rationale: Le latin affirme un retour à la vie, mais le choix retenu évite d’expliciter plus que le texte la forme théologique exacte de cet événement.
- issue: Valeur de nomen dans « iustorum nomen »
  choice: le nom des justes
  alternative: la renommée des justes
  rationale: La traduction formelle préserve l’ambiguïté entre nom, identité reconnue et réputation.
