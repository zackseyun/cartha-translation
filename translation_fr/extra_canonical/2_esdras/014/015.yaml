  text: and hurry to depart from these times[a]; for the things you have now seen
translation:
  language: fr
  text: et hâte-toi de quitter cette époque ; car ce que tu viens de voir
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festina
  choice: hâte-toi
  rationale: Rend directement l’impératif latin et son idée d’urgence dans un registre digne et courant.
- source_word: transmigrare
  choice: quitter
  rationale: Dans ce contexte, le verbe exprime le fait de partir ou de passer hors de l’époque présente ; « quitter » est naturel sans préciser indûment la nature de ce départ.
- source_word: a temporibus his
  choice: cette époque
  rationale: Le pluriel latin « ces temps » désigne ici la période présente ; le singulier collectif est idiomatique en français moderne.
- source_word: Quae enim uidisti nunc
  choice: car ce que tu viens de voir
  rationale: « Ce que » conserve l’indétermination du neutre pluriel latin, tandis que « tu viens de voir » rend naturellement la proximité temporelle de « nunc » sans anticiper la suite du verset suivant.
theological_decisions:
- issue: Nature du départ demandé
  choice: quitter cette époque
  alternative: passer hors de ces temps
  rationale: La formulation retenue préserve l’ambiguïté entre départ, transition et mort, sans imposer une interprétation théologique précise.
- issue: Complément de la proposition finale
  choice: ce que tu viens de voir
  alternative: les malheurs que tu viens de voir arriver
  rationale: Le texte latin fourni s’arrête à « Quae enim uidisti nunc ». Ajouter « malheurs » ou « arriver » importerait des mots relevant de la suite textuelle et franchirait la limite du verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le fragment final reste volontairement syntaxiquement ouvert, comme le texte latin à la limite du verset.
