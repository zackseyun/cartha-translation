  text: But keep the last seventy[a], so that you may hand them over to the wise among your people.
translation:
  language: fr
  text: Mais garde les soixante-dix derniers livres[a], afin de les transmettre aux sages de ton peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces soixante-dix derniers livres sont présentés comme une sagesse cachée, réservée aux sages du peuple d’Esdras. Cette distinction entre écrits publics et écrits secrets est un trait majeur de la manière dont 4 Esdras présente la révélation.
    reason: compositional_layer
lexical_decisions:
- source_word: Nouissimos autem LXX
  choice: Mais garde les soixante-dix derniers livres
  rationale: « Nouissimos » désigne les derniers éléments de la série; « livres » est explicité d’après le contexte immédiat. « autem » marque ici un contraste, rendu par « Mais ».
- source_word: conseruabis
  choice: garde
  rationale: Le futur latin a ici valeur d’instruction; l’impératif français exprime naturellement cette injonction tout en conservant l’idée de préserver ces livres.
- source_word: ut tradas eos sapientibus de populo tuo
  choice: afin de les transmettre aux sages de ton peuple
  rationale: La proposition finale exprime le but de leur conservation. « Transmettre » convient à la remise de textes réservés à un groupe déterminé.
theological_decisions:
- issue: Caractère réservé des soixante-dix derniers livres
  choice: Conserver explicitement leur destination aux « sages » du peuple
  alternative: Généraliser en parlant de lecteurs instruits ou dignes
  rationale: Le passage oppose la diffusion publique des premiers livres à la transmission restreinte des soixante-dix derniers; cette tension entre révélation publique et révélation cachée doit rester visible.
translation_notes:
  register: Français moderne, clair et digne. L’impératif « garde » rend naturellement la valeur prescriptive du futur latin. Le mot « livres », sous-entendu dans le fragment cité, est rétabli d’après le contexte littéraire immédiat.
