  text: Mais il en reste deux après le milieu de la dixième partie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Superant
  choice: restent
  rationale: Rend naturellement le sens de « demeurent, subsistent encore » dans ce décompte temporel.
- source_word: eius
  choice: de ses
  rationale: Conserve le pronom génitif latin, qui rattache explicitement les parties à la réalité mentionnée dans le contexte précédent, probablement l’âge.
- source_word: duae … partis
  choice: deux … parties
  rationale: Reproduit le nombre et l’image d’un tout divisé en parties.
- source_word: post medium decimae partis
  choice: après le milieu de la dixième partie
  rationale: Suit de près la formulation temporelle et fractionnelle du latin sans en résoudre l’apparente difficulté.
theological_decisions:
- issue: Calcul de la portion restante de l’âge
  choice: Conserver littéralement « après le milieu de la dixième partie »
  alternative: Reformuler comme « après neuf parties et demie » ou expliciter qu’il resterait deux parties et demie
  rationale: Le latin présente une formulation difficile ou elliptique. Une explicitation imposerait un calcul que le texte transmis n’énonce pas directement.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste volontairement proche du latin afin de préserver l’énigme du décompte sans l’aplanir.
