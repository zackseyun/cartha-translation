source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
translation:
  language: fr
  text: Je le pris et le bus. Après l’avoir bu, mon cœur faisait jaillir l’intelligence, et la sagesse grandissait dans ma poitrine, car mon esprit conservait la mémoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préservait le souvenir ».
    reason: Le latin « conservabat memoriam » peut désigner soit la conservation de la mémoire comme faculté, soit la rétention de ce qui a été reçu.
lexical_decisions:
- source_word: cor meum eructuabat intellectum
  choice: mon cœur faisait jaillir l’intelligence
  rationale: Le verbe latin « eructuabat » évoque littéralement ce qui jaillit ou déborde de l’intérieur. « Faisait jaillir » en conserve l’image avec naturel et dignité, sans employer le littéral « éructait », devenu inconvenant en français moderne.
- source_word: in pectus meum increscebat sapientia
  choice: la sagesse grandissait dans ma poitrine
  rationale: Cette formulation préserve l’image corporelle de « pectus » et le mouvement progressif exprimé par « increscebat ».
- source_word: spiritus meus conseruabat memoriam
  choice: mon esprit conservait la mémoire
  rationale: « Conservait » traduit directement l’idée de maintien ou de préservation portée par « conseruabat », tandis que « la mémoire » laisse ouverte la nuance entre la faculté de se souvenir et le contenu mémorisé.
theological_decisions:
- issue: Nature de la mémoire préservée
  choice: conservait la mémoire
  alternative: retenait le souvenir
  rationale: Le latin ne précise pas nettement s’il s’agit de la faculté mémorielle ou de ce qui a été mémorisé. Le texte principal conserve cette ambiguïté au lieu de la résoudre théologiquement.
translation_notes:
  register: Français moderne, clair et soutenu. La répétition de « pris » et « bu » suit la progression du latin. L’image du cœur qui fait jaillir l’intelligence est conservée sous une forme idiomatique, et « poitrine » maintient l’ancrage corporel du texte source.
