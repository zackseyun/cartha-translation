  yaml_path: translation/extra_canonical/2_esdras/014/029.yaml
  text: And they received the law of life, which they did not keep, which you also transgressed after them.
translation:
  language: fr
  text: Ils reçurent la loi de vie, qu’ils ne gardèrent pas et que vous avez, vous aussi, transgressée après eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem uitae
  choice: la loi de vie
  rationale: 'Rend directement le génitif latin tout en conservant l’expression théologique dense et son ambiguïté possible : loi qui mène à la vie, qui la procure ou qui lui appartient.'
- source_word: custodierunt
  choice: gardèrent
  rationale: « Garder la loi » est une tournure française claire et biblique qui exprime ici l’observance, sans surinterpréter le verbe.
- source_word: transgressed (consultation layer; Latin excerpt incomplete)
  choice: avez transgressée
  rationale: Le passé composé est naturel en français moderne pour l’acte antérieur ayant une portée dans le discours présent. L’accord féminin renvoie clairement à « la loi ».
- source_word: after them (consultation layer; Latin excerpt incomplete)
  choice: après eux
  rationale: Préserve la formulation temporelle et sa possible nuance d’imitation, sans la préciser indûment.
theological_decisions:
- issue: Sens de « loi de vie »
  choice: Conserver « loi de vie »
  alternative: « loi qui donne la vie »
  rationale: La formulation retenue maintient la tension entre l’origine, la fonction et la finalité vivifiante de la loi, au lieu d’imposer une seule interprétation.
- issue: Rapport entre la réception de la loi et sa transgression
  choice: Maintenir les deux propositions relatives coordonnées
  alternative: Reformuler causalement ou expliciter la culpabilité
  rationale: Le texte affirme la réception puis la désobéissance sans développer leur relation théologique; la traduction n’ajoute donc aucune explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « vous » dans « vous avez, vous aussi » rend naturellement l’insistance de « also ». Le segment latin fourni s’interrompt au second « quem »; la fin de la phrase est rendue à partir de la couche anglaise auditée, sans ajouter de précision interprétative.
