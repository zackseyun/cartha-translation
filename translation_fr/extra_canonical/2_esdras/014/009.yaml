id: 2ES.14.9
reference: 2 Esdras 14:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu enim reciperis ab hominibus, et conuerteris residuum cum filio meo et cum similibus tuis usquequo finiantur tempora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/009.yaml
  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
translation:
  language: fr
  text: Car tu seras retiré du milieu des humains[a], et tu resteras avec mon fils et avec ceux qui te ressemblent, jusqu’à ce que les temps soient achevés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enlevé d’entre les hommes ».'
    reason: Le latin peut évoquer plus fortement le fait d’être pris ou accueilli hors de la communauté humaine; la variante signale cette nuance sans imposer le mode du retrait.
lexical_decisions:
- source_word: reciperis ab hominibus
  choice: tu seras retiré du milieu des humains
  rationale: Le passif futur exprime qu’Esdras sera soustrait à la société humaine. « Du milieu des humains » rend naturellement ab hominibus sans préciser de manière indue le mode de ce retrait.
- source_word: conuerteris residuum
  choice: tu resteras
  rationale: Dans ce contexte, residuum indique la durée restante et conuerteris décrit le séjour qui se poursuivra. « Tu resteras » rend sobrement l’idée de demeurer pendant le temps qui reste.
- source_word: cum filio meo
  choice: avec mon fils
  rationale: Traduction directe, sans expliciter l’identité du fils au-delà du texte latin.
- source_word: cum similibus tuis
  choice: avec ceux qui te ressemblent
  rationale: Cette formulation conserve la portée ouverte de similibus tuis, qui peut désigner des personnes comparables à Esdras sans préciser en quoi.
- source_word: usquequo finiantur tempora
  choice: jusqu’à ce que les temps soient achevés
  rationale: La tournure garde le pluriel tempora et le passif de finiantur, dans un registre eschatologique digne mais intelligible.
theological_decisions:
- issue: Nature du retrait d’Esdras hors de l’humanité ordinaire
  choice: « retiré du milieu des humains »
  alternative: « enlevé d’entre les hommes »
  rationale: Le texte indique une séparation d’avec les humains, mais n’en décrit pas explicitement le mécanisme. « Retiré » préserve cette retenue et évite de trancher entre mort, translation ou autre forme d’enlèvement.
- issue: Identité de « mon fils »
  choice: Conserver simplement « mon fils »
  alternative: Expliciter « le Messie »
  rationale: L’identification messianique peut être déduite du contexte de l’œuvre, mais elle n’est pas formulée dans ce verset; la traduction ne doit pas l’ajouter.
- issue: Identité de ceux qui ressemblent à Esdras
  choice: « ceux qui te ressemblent »
  alternative: « tes semblables » ou une identification avec des justes particuliers
  rationale: Le latin demeure indéterminé quant au trait commun; la traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve les expressions ouvertes « mon fils », « ceux qui te ressemblent » et « les temps », sans ajout confessionnel. Le marqueur de note [a] est placé immédiatement après l’expression concernée.
