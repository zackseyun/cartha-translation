  text: “Behold[a], I will go, as you have commanded me, and I will reprove the people now living.
translation:
  language: fr
  text: Comme tu me l’as ordonné, je réprimanderai le peuple qui vit aujourd’hui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut praecepisti mihi
  choice: Comme tu me l’as ordonné
  rationale: Rend directement la comparaison et le commandement, dans un français naturel et digne.
- source_word: corripiam
  choice: je réprimanderai
  rationale: Le verbe latin désigne ici une réprobation ou une correction adressée au peuple; «réprimander» évite le possible contresens moderne de «reprendre» au sens de reprendre possession.
- source_word: praesentem populum
  choice: le peuple qui vit aujourd’hui
  rationale: Le contexte oppose ce peuple à ceux qui naîtront ensuite; «aujourd’hui» exprime donc la contemporanéité plutôt qu’une présence dans un lieu.
