translation_notes:
  register: Français moderne, clair et solennel. Le texte fourni commence au milieu d’un enchaînement et se termine par «qui», lequel ouvre syntaxiquement la suite; la traduction donne une phrase française complète sans ajouter «Voici, j’irai», absent du témoin latin cité.
