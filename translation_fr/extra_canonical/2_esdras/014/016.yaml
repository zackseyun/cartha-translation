source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'contigisse mala, iterum horum deteriora facientur : Quantum enim inualidum fit saeculum a senectute, tantum multiplicabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/016.yaml
  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
translation:
  language: fr
  text: — des choses pires que celles-ci se produiront encore. En effet, plus le monde[a] s’affaiblit sous l’effet de la vieillesse, plus les maux se multiplieront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âge présent »; le mot latin peut désigner le monde, une époque ou l’âge présent.
    reason: Le sens de saeculum reste réellement ouvert entre une désignation temporelle et l’ordre présent du monde.
lexical_decisions:
- source_word: deteriora
  choice: des choses pires
  rationale: Le neutre pluriel désigne des événements ou réalités pires, sans préciser qu’il s’agit uniquement de « maux ».
- source_word: facientur
  choice: se produiront
  rationale: Le futur passif de facio a ici le sens idiomatique de « se faire, arriver, se produire »; cette traduction évite d’en faire à tort un verbe transitif actif.
- source_word: iterum
  choice: encore
  rationale: Exprime la récurrence annoncée tout en gardant une formulation française naturelle.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte apocalyptique, le terme désigne l’ordre du monde ou l’âge présent, envisagé comme vieillissant; l’autre sens possible est signalé en note.
- source_word: inualidum fit ... a senectute
  choice: s’affaiblira en vieillissant
  rationale: Rend l’affaiblissement progressif causé par la vieillesse dans un français naturel, en accordant le temps avec l’annonce future.
- source_word: multiplicabunt
  choice: les maux se multiplieront
  rationale: Le latin emploie le pluriel sans objet explicite dans ce fragment; le contexte fournit « les maux », et le français pronominal exprime naturellement leur multiplication.
theological_decisions:
- issue: Valeur du passif facientur dans l’annonce apocalyptique
  choice: « se produiront »
  alternative: « seront faits »
  rationale: La formulation conserve l’idée d’événements futurs sans préciser leur agent ni transformer les maux présents en cause active des événements à venir.
- issue: Image cosmologique de la vieillesse
  choice: Conserver la personnification du monde qui vieillit et s’affaiblit
  alternative: Paraphraser comme un simple déclin historique
  rationale: L’image appartient au texte et porte sa tension eschatologique; elle ne doit pas être réduite à une explication naturaliste.
translation_notes:
  register: Français international moderne, digne et accessible. Le tiret maintient le lien syntaxique avec la proposition commencée au verset précédent. La construction corrélative « plus… plus… » reproduit quantum… tantum.
