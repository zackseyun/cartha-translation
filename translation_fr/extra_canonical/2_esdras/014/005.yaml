  text: And I told him many wonders, and I showed him the secrets of the times and the end of the times, and I commanded him, saying,
translation:
  language: fr
  text: 'Je lui ai raconté beaucoup de merveilles, je lui ai révélé les secrets des temps et la fin des temps, et je lui ai donné cet ordre :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enarraui
  choice: j’ai raconté
  rationale: Rend naturellement l’idée d’exposer ou de raconter en détail, sans ajouter une notion absente du latin.
- source_word: mirabilia multa
  choice: beaucoup de merveilles
  rationale: Traduction directe et accessible, qui conserve la portée large de « mirabilia ».
- source_word: ostendi
  choice: j’ai révélé
  rationale: Dans le contexte de secrets divins, « révélé » exprime idiomatiquement le fait de faire connaître ce qui était caché.
- source_word: temporum secreta
  choice: les secrets des temps
  rationale: Conserve la formulation énigmatique et l’ambiguïté du pluriel latin « temporum ».
- source_word: temporum finem
  choice: la fin des temps
  rationale: Expression française naturelle correspondant au singulier « finem » associé au génitif pluriel « temporum ».
- source_word: praecepi ei dicens
  choice: 'je lui ai donné cet ordre :'
  rationale: Évite le calque lourd « je lui ai ordonné en disant » tout en conservant clairement l’introduction du discours qui suit.
theological_decisions:
- issue: Sens eschatologique de « temporum »
  choice: les temps
  alternative: les époques
  rationale: « Les temps » préserve la résonance eschatologique et la répétition du texte latin sans préciser indûment la nature des périodes visées.
translation_notes:
  register: Français moderne, digne et fluide. La coordination répétée du latin est partiellement conservée, tandis que la formule finale est rendue par une tournure idiomatique introduisant directement la parole suivante.
