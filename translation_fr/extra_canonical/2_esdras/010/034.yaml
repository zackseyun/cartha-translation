  yaml_path: translation/extra_canonical/2_esdras/010/034.yaml
  text: And I said, “Speak, my lord; only do not forsake me, lest I die for nothing.
translation:
  language: fr
  text: 'Et je dis : « Parle, mon seigneur ; seulement, ne m’abandonne pas, de peur que je ne meure en vain. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquere
  choice: m’abandonne pas
  rationale: Dans cette construction, l’infinitif latin dépend vraisemblablement d’une défense exprimée juste avant le fragment conservé. « Abandonner » rend naturellement l’idée de laisser quelqu’un sans secours.
- source_word: non frustra moriar
  choice: de peur que je ne meure en vain
  rationale: Cette formulation conserve la valeur finale négative et le sens de frustra, sans transformer la crainte exprimée en simple conséquence.
- source_word: domine (attesté par le contexte textuel immédiat reconstitué)
  choice: mon seigneur
  rationale: L’adresse respectueuse à l’interlocuteur angélique est rendue sans lui attribuer explicitement le titre divin « Seigneur ».
theological_decisions:
- issue: Identité du destinataire de « mon seigneur »
  choice: Maintenir l’adresse respectueuse en minuscules
  alternative: « Seigneur » avec une majuscule
  rationale: Le contexte est une adresse à l’interlocuteur céleste ; la minuscule évite de décider qu’il s’agit directement de Dieu.
- issue: Sens de « mourir en vain »
  choice: Conserver l’expression sans l’expliquer
  alternative: Préciser que la mort serait inutile ou dépourvue de révélation
  rationale: Le latin laisse ouverte la manière exacte dont la mort serait « en vain » ; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, sobre et digne. La ponctuation fait entendre une demande pressante. La proposition latine suivante, « Quoniam uidi quae non », paraît amorcer le verset suivant et n’est donc pas intégrée ici.
