source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ueni, sicut uides, in hoc campo. Et cogito iam non reuerti in ciuitate sed hic consistere, et neque manducabo neque bibam, sed sine intermissione lugere et ieiunare usque dum moriar.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
translation:
  language: fr
  text: Et je suis venue, comme tu le vois, dans ce champ. Je compte ne plus retourner dans la ville, mais rester ici. Je ne mangerai ni ne boirai, mais je pleurerai et je jeûnerai sans relâche jusqu’à ma mort. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogito
  choice: je compte
  rationale: Avec des infinitifs, «cogito» exprime ici une intention arrêtée plutôt qu’une simple réflexion; «je compte» reste naturel sans surcharger le degré de résolution.
- source_word: iam non reuerti
  choice: ne plus retourner
  rationale: '«iam non» marque la cessation ou l’exclusion désormais envisagée: elle ne retournera plus en ville.'
- source_word: hic consistere
  choice: rester ici
  rationale: Dans ce contexte, «consistere» signifie demeurer sur place plutôt que se tenir debout.
- source_word: sine intermissione lugere
  choice: sans relâche, je pleurerai
  rationale: Rend la continuité du deuil exprimée par «sine intermissione» dans un français courant et digne.
- source_word: usque dum moriar
  choice: jusqu’à ma mort
  rationale: Équivalent français naturel de l’action poursuivie jusqu’à ce que la locutrice meure.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Le féminin «venue» suit l’identité de la locutrice établie par le contexte narratif. La coordination est répartie en phrases brèves pour conserver la force résolue du discours tout en restant naturelle en français.
