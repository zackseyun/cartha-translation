  to: Et je suis venue, comme tu le vois, dans ce champ. Je compte ne plus retourner dans la ville, mais rester ici. Je ne mangerai ni ne boirai, mais je pleurerai et je jeûnerai sans relâche jusqu’à ma mort. »
  rationale: La révision rétablit l’opposition explicite de «sed» et emploie «dans la ville» pour refléter la référence déterminée de «in ciuitate». Elle conserve le féminin contextuel de la locutrice, l’intention résolue de «cogito», et le registre sobre du discours.
