source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'nutriuit eum cum labore, haec erat habitatio Hierusalem : Et quoniam dixit tibi quod filius meus ueniens in suo thalamo mortuus esset et contigisset ei casus, haec erat quae facta est ruina Hierusalem. Et ecce uidisti similitudinem eius, quomodo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
translation:
  language: fr
  text: 'Quant à ce qu’elle t’a dit[a] : « Mon fils est mort en entrant dans sa chambre nuptiale, et un malheur lui est arrivé », c’était la ruine qui a frappé Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’elle t’a dit que son fils était mort en entrant dans sa chambre nuptiale et qu’un malheur lui était arrivé ».'
    reason: Le latin quod peut introduire soit une citation directe, soit un discours indirect, bien que meus favorise la première lecture.
lexical_decisions:
- source_word: thalamo
  choice: chambre nuptiale
  rationale: Le latin désigne ici la chambre des noces; cette expression conserve l’image matrimoniale tout en restant naturelle en français.
- source_word: casus
  choice: un malheur
  rationale: Dans ce contexte, casus évoque un événement funeste ou une catastrophe personnelle; « malheur » préserve cette portée sans préciser indûment sa nature.
- source_word: ruina Hierusalem
  choice: la ruine qui s’est abattue sur Jérusalem
  rationale: Cette formulation rend l’effondrement historique de Jérusalem et le lien avec facta est, dans un français courant et digne.
theological_decisions:
- issue: Discours direct ou indirect après quod
  choice: 'Discours direct : « Mon fils… »'
  alternative: 'Discours indirect : « que son fils… »'
  rationale: Quod peut introduire un discours rapporté, mais meus conserve la première personne de la femme et favorise nettement une citation directe. La variante indirecte reste signalée en note.
- issue: Fonction interprétative de haec erat
  choice: « cela représentait »
  alternative: « c’était »
  rationale: L’ange explique la signification symbolique de la vision; « représentait » explicite cette relation sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et soutenu. La citation directe préserve la voix de la femme, tandis que la note maintient l’ambiguïté grammaticale possible du latin.
