- source_word: cecidit
  choice: il tomba
  rationale: Conserve le sens concret et non précisé du latin, sans ajouter la cause ni les circonstances de la chute.
- source_word: mortuus est
  choice: mourut
  rationale: Traduction directe et idiomatique du parfait latin, qui présente sa mort comme l'événement suivant.
