source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'pedes meos et dixit mihi: Quid tibi est, et quare conturbaris, et quid conturbatus est intellectus tuus et sensus cordis tui ? et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/031.yaml
  text: and said to me, “What is the matter with you? And why are you troubled? And why are your understanding and the perception of your heart troubled?”
translation:
  language: fr
  text: 'et me dit : « Qu’as-tu ? Pourquoi es-tu bouleversé ? Pourquoi ton intelligence et la perception de ton cœur sont-elles troublées ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: es-tu bouleversé
  rationale: Le verbe latin exprime ici un profond trouble personnel ; « bouleversé » est naturel et garde cette intensité.
- source_word: intellectus tuus
  choice: ton intelligence
  rationale: Rend directement la faculté de comprendre, sans réduire le terme à une pensée particulière.
- source_word: sensus cordis tui
  choice: les perceptions de ton cœur
  rationale: « Perceptions » conserve l’étendue de sensus, tandis que « cœur » préserve l’anthropologie du texte ancien.
theological_decisions:
- issue: Rapport entre intellectus et sensus cordis
  choice: 'Maintenir deux réalités coordonnées : « ton intelligence et les perceptions de ton cœur »'
  alternative: Les fondre en une seule expression, par exemple « les pensées de ton cœur »
  rationale: Le latin coordonne explicitement les deux expressions ; les conserver maintient la tension anthropologique sans imposer une distinction doctrinale précise.
translation_notes:
  register: Français moderne, digne et accessible. La série de questions du latin est conservée. Le fragment initial « pedes meos » dépend syntaxiquement du verset précédent et n’est pas repris ici, conformément au découpage de la référence et au texte anglais audité.
