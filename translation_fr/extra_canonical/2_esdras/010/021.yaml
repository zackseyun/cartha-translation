  yaml_path: translation/extra_canonical/2_esdras/010/021.yaml
  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: fr
  text: Car tu vois que notre lieu saint a été dévasté, que notre autel a été démoli et que notre temple a été détruit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sanctificatio
  choice: lieu saint
  rationale: Dans ce contexte cultuel, le latin désigne le sanctuaire ou espace consacré. « Lieu saint » reste naturel en français et le distingue du « temple » mentionné dans la troisième proposition.
- source_word: deserta effecta est
  choice: a été dévasté
  rationale: Cette tournure exprime le fait d’avoir été rendu désert ou laissé à l’abandon; « dévasté » rend idiomatiquement le résultat de la destruction sans alourdir la phrase.
- source_word: demolitum est
  choice: a été démoli
  rationale: Équivalent direct qui conserve l’image de l’autel renversé ou abattu.
- source_word: destructum est
  choice: a été détruit
  rationale: Rend directement le terme latin et préserve le parallélisme verbal du verset.
