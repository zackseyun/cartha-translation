source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: humiliata est, lugete ualidissime. Et nunc quoniam omnes lugemus, et tristes estis, quoniam omnes contristati sumus, tu
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
translation:
  language: fr
  text: Elle a été humiliée ; pleurez de toutes vos forces. Et maintenant, puisque nous sommes tous en deuil et que vous êtes tristes, puisque nous sommes tous affligés — mais toi…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: humiliata est
  choice: Elle a été humiliée
  rationale: Rend directement le parfait passif latin sans le confondre avec le verbe « pleurer ».
- source_word: lugete ualidissime
  choice: prenez le deuil avec la plus grande intensité
  rationale: Conserve l’impératif pluriel et la force superlative de ualidissime ; « prendre le deuil » convient au contexte de lamentation.
- source_word: tristes estis
  choice: dans la tristesse
  rationale: Le texte transmis porte une deuxième personne du pluriel, mais celle-ci cadre mal avec omnes lugemus et omnes contristati sumus. La formulation française évite de trancher explicitement la personne tout en préservant l’idée de tristesse.
- source_word: tu
  choice: mais toi…
  rationale: Le fragment s’interrompt sur tu. Le tiret et les points de suspension signalent une opposition laissée inachevée sans importer la suite absente.
theological_decisions:
- issue: Sujet féminin de « humiliata est »
  choice: Conserver « elle » sans identifier explicitement le référent
  alternative: Nommer Sion ou la ville
  rationale: Le verset fourni présuppose un référent féminin contextuel, mais ne le nomme pas ; l’expliciter introduirait une interprétation.
- issue: Discordance de personne dans « tristes estis »
  choice: Employer une tournure française qui ne marque pas la personne
  alternative: « vous êtes tristes » ou correction conjecturale « nous sommes tristes »
  rationale: La leçon latine transmise est préservée sans imposer une correction textuelle, tout en maintenant le parallélisme du passage.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’accumulation rhétorique du latin et l’interruption finale du fragment.
