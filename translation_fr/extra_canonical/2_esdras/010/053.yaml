  text: propterea dixi tibi, ut venires in agrum, ubi non est fundamentum aedificii.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/053.yaml
  text: Therefore I told you to come into the field[a], where there is no foundation of a building.
translation:
  language: fr
  text: Voilà pourquoi je t’ai dit de venir dans le champ[a], là où il n’y a aucune fondation de bâtiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le terrain » ; le mot peut désigner une étendue de terre non bâtie.
    reason: Le latin « agrum » peut désigner soit un champ, soit plus généralement un terrain ; le contexte souligne surtout l’absence de construction.
lexical_decisions:
- source_word: agrum
  choice: dans le champ
  rationale: Le latin désigne ici un terrain précis, sans construction, plutôt que la campagne au sens large. « Champ » maintient aussi le lien avec le lieu mentionné dans le contexte immédiat.
- source_word: fundamentum aedificii
  choice: fondation de bâtiment
  rationale: Cette formulation conserve l’image concrète des fondations d’une construction. « Aucune » rend naturellement en français la négation latine « non est » sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Voilà pourquoi » rend naturellement la relation logique de « propterea », tandis que « je t’ai dit de venir » suit de près la syntaxe latine.
