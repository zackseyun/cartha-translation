source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quod omnium maius, signaculum Sion, quoniam resignata est de gloria sua nunc et tradita est in manibus eorum qui nos oderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/023.yaml
  text: And what is greatest of all[a][23], the seal of Zion—for now she has been unsealed from her glory and handed over into the hands of those who hate us.
translation:
  language: fr
  text: 'Et, ce qui est plus grave que tout, le sceau de Sion : car maintenant elle a été descellée de sa gloire[a] et livrée entre les mains de ceux qui nous haïssent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « le sceau de Sion » est difficile. Elle peut désigner la gloire distinctive de Sion, son statut authentifié ou une marque symbolique d’honneur. Le latin peut aussi se comprendre : « elle a été dépouillée de sa gloire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: quod omnium maius
  choice: ce qui est plus grave que tout
  rationale: Dans le contexte d’une lamentation, « maius » exprime ici l’importance et la gravité suprêmes plutôt qu’une grandeur matérielle.
- source_word: signaculum Sion
  choice: le sceau de Sion
  rationale: La formulation latine est difficile; la traduction conserve l’image du sceau sans trancher entre gloire distinctive, statut authentifié ou marque d’honneur.
- source_word: resignata est de gloria sua
  choice: elle a été descellée de sa gloire
  rationale: « Descellée » maintient le jeu d’image avec « sceau ». Le féminin « elle » renvoie grammaticalement à Sion, comme les formes latines féminines « resignata » et « tradita ».
- source_word: tradita est in manibus
  choice: livrée entre les mains
  rationale: Expression française naturelle qui correspond étroitement à l’idiome latin de remise au pouvoir d’autrui.
theological_decisions:
- issue: Sens précis du « sceau de Sion »
  choice: Conserver littéralement l’image du sceau
  alternative: Paraphraser comme « la gloire distinctive de Sion » ou « la marque d’honneur de Sion »
  rationale: Le latin ne permet pas d’identifier avec certitude le référent; préserver l’ambiguïté évite d’imposer une interprétation théologique.
- issue: Référent des verbes féminins
  choice: Faire de Sion le sujet par « elle »
  alternative: Faire du sceau le sujet par « il »
  rationale: Les participes féminins singuliers latins renvoient à « Sion », non au neutre « signaculum ».
translation_notes:
  register: Français moderne, digne et accessible. La tournure inhabituelle « descellée de sa gloire » est maintenue afin de préserver l’image du sceau et la difficulté réelle du latin; une autre compréhension est signalée en note.
