source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi ut uenires in agrum, ubi non est fundamentum aedificii. Nec enim poterat opus aedificii hominis sustinere in loco ubi incipiebat altissimi ciuitas ostendi. Tu ergo noli timere, neque expauescat cor tuum, sed ingredere et uide splendorem et magnitudinem aedificii, quantum capax est tibi uisus oculorum uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: fr
  text: En effet, aucune œuvre de construction humaine ne pouvait subsister à l’endroit où la cité du Très-Haut commençait à être montrée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  choice: ouvrage construit par des êtres humains
  rationale: Cette formulation naturelle rend l’idée d’une construction d’origine humaine et maintient le contraste implicite avec la cité du Très-Haut.
- source_word: sustinere
  choice: subsister
  rationale: Dans ce contexte, le verbe exprime la capacité d’un ouvrage à tenir ou à demeurer dans ce lieu; « subsister » restitue cette idée sans surinterprétation.
- source_word: incipiebat ... ostendi
  choice: commençait à se manifester
  rationale: La tournure latine passive indique que la cité commençait à devenir visible ou à être révélée. « Se manifester » préserve cette nuance sans préciser indûment l’agent.
- source_word: civitas altissimi
  choice: la cité du Très-Haut
  rationale: « Cité » convient au registre visionnaire, tandis que « le Très-Haut » est l’équivalent français établi du titre divin latin.
theological_decisions:
- issue: Nature de la manifestation de la cité
  choice: commençait à se manifester
  alternative: commençait à être montrée
  rationale: Le passif latin ne nomme pas l’agent. La formulation retenue conserve l’idée d’apparition ou de révélation sans affirmer explicitement qui montre la cité.
translation_notes:
  register: Français moderne, clair et digne, avec un registre légèrement élevé adapté à une vision apocalyptique. La syntaxe reste proche du latin tout en étant idiomatique.
