  yaml_path: translation/extra_canonical/2_esdras/010/039.yaml
  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
translation:
  language: fr
  text: Car il a vu la droiture de ta conduite[a], puisque tu ne cessais de t’attrister pour ton peuple et que tu portais un grand deuil à cause de Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ta voie droite ».
    reason: Signaler la métaphore exacte de rectam uiam tuam, rendue dans le texte par une expression française plus naturelle.
lexical_decisions:
- source_word: rectam uiam tuam
  choice: la droiture de ta conduite
  rationale: L’expression signifie littéralement « ta voie droite », mais, dans ce contexte, elle désigne la rectitude morale de la manière d’agir. Cette formulation française conserve cette valeur sans suggérer principalement un trajet physique.
- source_word: sine intermissione contristabaris
  choice: tu ne cessais de t’attrister
  rationale: Rend à la fois l’aspect continu de l’imparfait latin et l’idée explicite d’une tristesse sans interruption.
- source_word: ualde lugebas propter Sion
  choice: tu portais un grand deuil à cause de Sion
  rationale: « Porter le deuil » restitue le sens fort de lugere, tandis que « à cause de Sion » maintient la portée causale de propter sans préciser davantage la nature du malheur.
theological_decisions:
- issue: Valeur de rectam uiam
  choice: La comprendre comme la rectitude de la conduite
  alternative: « ta voie droite »
  rationale: Le contexte loue la fidélité manifestée par le deuil pour le peuple et pour Sion. La métaphore de la voie reste signalée en note afin de ne pas effacer la forme de l’expression latine.
- issue: Relation introduite par quoniam
  choice: 'Relation causale : « puisque »'
  alternative: 'Relation explicative : « à savoir que »'
  rationale: Le latin quoniam présente ici le chagrin persistant comme la raison pour laquelle la conduite est reconnue droite.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre le chagrin pour le peuple et le deuil à cause de Sion est conservé. Le début traduit la proposition transmise par la couche de consultation, le fragment latin fourni commençant au complément « rectam uiam tuam ».
