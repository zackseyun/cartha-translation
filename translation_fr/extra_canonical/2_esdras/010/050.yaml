translation:
  language: fr
  text: En effet, puisque tu as été attristé du fond de ton âme et puisque tu souffres pour elle de tout ton cœur, il t’a montré l’éclat de sa gloire et la beauté de sa majesté. C’est pourquoi je t’ai dit de rester dans
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex animo contristatus es
  choice: tu as été profondément attristé
  rationale: « Profondément » exprime naturellement l’intériorité de « ex animo » sans le calque peu idiomatique « depuis ton âme ».
- source_word: ex toto corde pateris pro ea
  choice: tu souffres pour elle de tout ton cœur
  rationale: Conserve le présent de « pateris », le complément « pour elle » et l’expression biblique naturelle « de tout ton cœur ».
- source_word: claritatem gloriae eius
  choice: l’éclat de sa gloire
  rationale: Rend « claritatem » par une luminosité rayonnante et conserve le génitif « de sa gloire ».
- source_word: pulchritudinem decoris eius
  choice: la beauté de sa magnificence
  rationale: Préserve les deux substantifs du latin tout en évitant une répétition avec « éclat »; « magnificence » exprime ici la splendeur majestueuse de « decor ».
- source_word: maneres in
  choice: de rester dans
  rationale: Conserve la proposition inachevée du témoin latin et son complément introduit par « in ».
theological_decisions:
- issue: Sujet implicite de « ostendit »
  choice: il t’a montré
  alternative: le Très-Haut t’a montré
  rationale: Le latin ne nomme pas le sujet dans ce verset; ne pas ajouter « le Très-Haut » préserve l’implicite du texte source.
- issue: Lien causal entre l’affliction et la révélation
  choice: Car… C’est pourquoi… Voilà pourquoi…
  alternative: Puisque… il t’a montré… C’est pourquoi…
  rationale: La formulation explicite les enchaînements causaux présents dans les deux « quoniam » et dans « propterea », sans introduire de motif théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase finale demeure volontairement inachevée, comme le texte latin fourni, qui se termine par « in ».
