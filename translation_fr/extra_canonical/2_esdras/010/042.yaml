source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'You no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
translation:
  language: fr
  text: 'Tu ne vois pas l’apparence d’une femme[a] ; c’est une ville en construction qui t’est apparue. Quant à ce qu’elle te racontait au sujet du malheur de son fils, en voici l’interprétation :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu ne vois pas une forme de femme. »'
    reason: « speciem mulieris » peut désigner soit l’apparence propre à une femme, soit une forme féminine visible ; la note conserve cette nuance sans ajouter au texte.
lexical_decisions:
- source_word: speciem mulieris
  choice: l’apparence d’une femme
  rationale: Rend directement le latin « speciem » tout en conservant l’idée de la forme visible sous laquelle la vision s’était présentée.
- source_word: ciuitas aedificari
  choice: une ville en construction
  rationale: Expression française naturelle qui préserve l’aspect passif et progressif de la ville apparaissant tandis qu’elle est bâtie.
- source_word: casu filii sui
  choice: du malheur de son fils
  rationale: Dans ce contexte narratif, « casus » désigne le sort funeste ou le malheur arrivé au fils, sans préciser davantage sa nature.
- source_word: absolutio
  choice: interprétation
  rationale: Ici, « absolutio » introduit l’explication ou la résolution du symbole visionnaire ; « interprétation » est le terme français le plus clair dans ce contexte.
theological_decisions:
- issue: Rapport entre la femme et la ville dans la vision
  choice: « c’est une ville en construction qui t’est apparue »
  alternative: « mais une ville t’est apparue en train d’être bâtie »
  rationale: La formulation maintient le contraste explicite du latin sans définir au-delà du texte la nature théologique de la transformation visionnaire.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse singulière du latin. Le deux-points final est conservé puisque le verset introduit l’explication qui suit.
source_grounding:
  english_pob_role: consult_only
