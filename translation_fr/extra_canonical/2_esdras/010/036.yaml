  text: Or is my mind deceived, and is my soul dreaming?
translation:
  language: fr
  text: Ou bien mon esprit est-il trompé, et mon âme rêve-t-elle ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fallitur
  choice: est-il trompé
  rationale: Le passif latin est conservé, sans préciser qui ou quoi trompe l’esprit.
- source_word: anima mea
  choice: mon âme
  rationale: Rend directement l’expression latine tout en maintenant la distinction entre l’esprit sous-entendu par le contexte et l’âme.
- source_word: somniatur
  choice: rêve-t-elle
  rationale: Expression française naturelle qui restitue l’idée d’un état de rêve sans expliquer s’il s’agit d’un songe ou d’une illusion.
theological_decisions:
- issue: Nature de l’expérience mise en doute
  choice: Conserver l’alternative entre tromperie de l’esprit et rêve de l’âme
  alternative: Reformuler l’ensemble comme une simple vision illusoire
  rationale: Le texte présente deux formulations parallèles et ne tranche pas la nature de l’expérience.
translation_notes:
  register: Français moderne, clair et digne. La structure interrogative parallèle du latin est conservée. Les mots « Nunc ergo deprecor te ut » appartiennent au début de la phrase suivante et ne sont pas inclus dans ce verset.
