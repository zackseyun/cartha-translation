  text: and behold[a], suddenly she let out a great cry, full of terror, so that the earth was shaken by the sound. And I saw,
translation:
  language: fr
  text: Et voici que, soudain, elle poussa un grand cri plein de terreur, si bien que la terre fut ébranlée par ce bruit. Et je vis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et ecce subito
  choice: Et voici que, soudain
  rationale: « Voici que » rend explicitement ecce, tandis que « soudain » traduit subito sans effacer l’enchaînement narratif marqué par et.
- source_word: emisit sonum vocis magnum
  choice: elle poussa un grand cri
  rationale: Cette tournure française naturelle restitue l’expression latine littéralement redondante « émit un grand son de voix ».
- source_word: timore plenum
  choice: plein de terreur
  rationale: Le cri est présenté comme rempli de peur; « terreur » convient à l’intensité de la scène.
- source_word: ut commoveretur terra a sono
  choice: si bien que la terre fut ébranlée par ce bruit
  rationale: Le tour consécutif « si bien que » rend ut avec le subjonctif; « ce bruit » renvoie naturellement au cri sans répéter le même nom.
- source_word: et vidi
  choice: Et je vis
  rationale: Traduction directe de vidi, maintenue à la fin du verset avec la virgule qui signale la continuation dans le verset suivant.
