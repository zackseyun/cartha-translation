source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: futura est manebis hic, Et ostendet tibi altissimus eas uisiones somniorum quae faciet altissimus his qui habitant super terram in nouissimis diebus. Et dormiui illam noctem et aliam sicut praecepit mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/059.yaml
  text: and the Most High will show you those dream-visions that the Most High will bring about for those who dwell on the earth in the last days.”[a]
translation:
  language: fr
  text: et le Très-Haut te montrera ces visions en rêve de ce qu’il fera aux habitants de la terre dans les derniers jours. »[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ces visions en rêve que le Très-Haut réalisera pour les habitants de la terre ».'
    reason: Le latin permet de rattacher « quae » directement à « visions » et de comprendre le datif comme indiquant les bénéficiaires; une lecture reflétant un neutre pluriel sous-jacent donne plutôt « de ce que… fera aux habitants ».
lexical_decisions:
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel et naturel en français, conservé dans ses deux occurrences sans effacer la répétition du latin.
- source_word: uisiones somniorum
  choice: visions en rêve
  rationale: Rend naturellement le génitif latin « de songes/rêves » tout en préservant l’idée de visions reçues en rêve.
- source_word: in nouissimis diebus
  choice: dans les derniers jours
  rationale: Expression apocalyptique consacrée, fidèle au sens temporel du latin.
- source_word: his qui habitant super terram
  choice: aux habitants de la terre
  rationale: Le datif « his » est rendu par « aux » sans préciser à lui seul si l’action est favorable ou défavorable; « super terram » devient l’expression française idiomatique « de la terre ».
theological_decisions:
- issue: Rapport de « quae faciet » avec les visions et portée du datif « his »
  choice: « visions en rêve de ce qu’il fera aux habitants »
  alternative: « visions en rêve qu’il suscitera pour les habitants »
  rationale: La formulation retenue reflète la lecture selon laquelle « quae » représente « les choses que » le Très-Haut accomplira, probablement sous l’influence de la syntaxe de la langue source antérieure au latin. Elle évite aussi de donner nécessairement au datif une valeur bénéficiaire. La variante reste grammaticalement possible dans le latin transmis.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « le Très-Haut » est conservée conformément au texte source. Le passage fourni contient aussi des mots appartenant vraisemblablement aux versets adjacents; le présent draft suit la délimitation de 2 Esdras 10.59 attestée par la couche de consultation anglaise.
