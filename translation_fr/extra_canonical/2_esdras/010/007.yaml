  text: see our mourning and what has happened to us? For Zion[a], the mother of us all, is grieving in sorrow and humiliation
translation:
  language: fr
  text: Vois-tu notre deuil et ce qui nous est arrivé ? Car Sion, notre mère à tous, est accablée de tristesse et d’humiliation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uides
  choice: Vois-tu
  rationale: Rend directement la forme verbale de deuxième personne dans cette question, selon la ponctuation transmise.
- source_word: luctum nostrum
  choice: notre deuil
  rationale: « Deuil » exprime le sens concret et collectif de luctus dans le contexte.
- source_word: quae nobis contigerunt
  choice: ce qui nous est arrivé
  rationale: Formulation française naturelle qui conserve le caractère indéfini du pluriel latin.
- source_word: Sion mater nostra omnium
  choice: Sion, notre mère à tous
  rationale: Rend naturellement Sion comme la mère commune de tous les locuteurs, sans ajouter une seconde occurrence de « mère » absente du texte latin fourni.
- source_word: in tristitia contristatur
  choice: est accablée de tristesse
  rationale: Évite le calque maladroit « s’attriste dans la tristesse » tout en conservant l’intensité de la tournure latine.
- source_word: et humilitate
  choice: et d’humiliation
  rationale: Maintient le parallélisme nominal et n’importe pas le verbe « a été abaissée », qui appartient au verset suivant selon la délimitation indiquée.
theological_decisions:
- issue: Identification maternelle de Sion
  choice: Sion, notre mère à tous
  alternative: Sion notre mère, la mère de nous tous
  rationale: Le choix conserve l’image théologique collective du texte tout en évitant une répétition qui ne figure pas dans la source latine fournie.
- issue: Valeur de humilitate
  choice: d’humiliation
  alternative: dans son abaissement
  rationale: « Humiliation » préserve l’ambiguïté entre condition déshonorante et abaissement subi, sans anticiper un changement d’état verbal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative reste liée au contexte précédent; le second membre garde la solennité poétique sans littéralisme opaque.
