    issue: Rendu de multam
    rationale: « Profonde tristesse » est possible, mais multam désigne d’abord une grande ou très grande tristesse, sans préciser la métaphore de profondeur.
  - severity: low
    issue: Rendu de multitudinem dolorum
    rationale: « Tes nombreuses douleurs » transmet l’idée générale, mais « la multitude de tes douleurs » conserve plus exactement le collectif intensif du latin.
  revised_text: Toi donc, secoue ta grande tristesse et éloigne de toi la multitude de tes douleurs, afin que le Puissant te redevienne favorable et que le Très-Haut t’accorde le repos, le soulagement de tes peines. »
