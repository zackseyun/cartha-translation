- from: Toi donc, secoue ta profonde tristesse et éloigne de toi tes nombreuses douleurs, afin que le Puissant te soit de nouveau favorable et que le Très-Haut t’accorde le repos, le soulagement de tes peines. »
  to: Toi donc, secoue ta grande tristesse et éloigne de toi la multitude de tes douleurs, afin que le Puissant te redevienne favorable et que le Très-Haut t’accorde le repos, le soulagement de tes peines. »
