source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: fr
  text: Toi donc, secoue ta grande tristesse et éloigne de toi la multitude de tes douleurs, afin que le Puissant te redevienne favorable et que le Très-Haut t’accorde le repos, le soulagement de tes peines. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excute
  choice: secoue
  rationale: Rend directement l’image énergique du verbe latin, qui invite à se débarrasser de la tristesse.
- source_word: multam tristitiam
  choice: ta profonde tristesse
  rationale: « Profonde » exprime naturellement en français l’intensité de multam sans suggérer plusieurs tristesses distinctes.
- source_word: multitudinem dolorum
  choice: tes nombreuses douleurs
  rationale: Conserve l’idée d’une accumulation de souffrances tout en restant idiomatique.
- source_word: repropitietur
  choice: te soit de nouveau favorable
  rationale: Préserve la valeur du préfixe re- et l’idée de faveur retrouvée, sans surcharger la phrase d’un vocabulaire technique.
- source_word: fortis
  choice: le Puissant
  rationale: Traite l’adjectif substantivé comme un titre divin et maintient son parallélisme avec « le Très-Haut ».
- source_word: requiem ... requietionem laborum
  choice: le repos, le soulagement de tes peines
  rationale: Reproduit la reprise sémantique latine tout en donnant au second membre une formulation française naturelle.
theological_decisions:
- issue: Sens de repropitietur
  choice: te soit de nouveau favorable
  alternative: se réconcilie avec toi
  rationale: Le latin évoque un retour de faveur divine, mais n’impose pas explicitement le cadre d’une réconciliation personnelle; la formulation retenue conserve cette latitude.
- issue: Portée de laborum
  choice: tes peines
  alternative: tes travaux
  rationale: Dans ce contexte de tristesse et de douleurs, « peines » peut désigner à la fois les souffrances et les pénibles épreuves, sans réduire le terme au travail physique.
translation_notes:
  register: Français moderne international, digne et accessible. La structure exhortative et le parallélisme des deux titres divins sont conservés; la phrase reste fluide sans effacer la répétition finale autour du repos.
