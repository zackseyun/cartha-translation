- source_word: fructum uentris mei
  choice: le fruit de mon ventre
  rationale: Cette formulation conserve l’image corporelle et biblique du latin tout en restant immédiatement compréhensible.
- source_word: non est similis ... terrae
  choice: n’est pas comparable à celui de la terre
  rationale: Le français explicite par « celui » que la comparaison porte sur le deuil, sans trancher davantage que le latin.
