source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
translation:
  language: fr
  text: 'Et voici, tu as vu son apparence : elle pleurait son fils, et tu as commencé à la consoler de ce qui était arrivé. Ces choses devaient t’être révélées[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devaient t’être ouvertes ».
    reason: Conserve la métaphore plus littérale de aperienda, tout en maintenant la construction passive et le sens possible d’une divulgation.
lexical_decisions:
- source_word: similitudinem eius (attesté par le contexte textuel consulté)
  choice: sous cette apparence
  rationale: Dans cette vision, « apparence » rend naturellement la forme sous laquelle la femme s’est présentée, sans suggérer une simple ressemblance physique.
- source_word: luget
  choice: elle pleurait
  rationale: Le verbe latin exprime ici le deuil de la femme pour son fils ; l’imparfait convient au récit de la scène observée.
- source_word: consolare
  choice: consoler
  rationale: Équivalent direct et naturel du verbe latin dans le contexte du deuil.
- source_word: de his quae contigerunt
  choice: de ce qui était arrivé
  rationale: Rend l’événement déjà survenu avec une formulation française courante, tout en conservant l’indétermination du latin.
- source_word: aperienda
  choice: révélées
  rationale: Dans ce contexte apocalyptique, le participe exprime une divulgation accordée au voyant plutôt qu’une ouverture matérielle.
theological_decisions:
- issue: Portée révélatrice de « aperienda »
  choice: révélées
  alternative: ouvertes
  rationale: « Révélées » transmet le sens apocalyptique probable sans préciser davantage la nature ou l’auteur immédiat de la révélation ; la traduction littérale est conservée en note.
translation_notes:
  register: Français moderne, clair et digne. Le récit visionnaire est rendu sans explicitation doctrinale. « Et voici » conserve la transition solennelle du texte reçu, tandis que « sous cette apparence » évite le calque peu naturel « sa ressemblance ».
