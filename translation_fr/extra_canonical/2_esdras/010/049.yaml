  rationale: La révision élimine une nuance interprétative dans le rendu de similitudinem eius et corrige la note pour qu’elle soit à la fois idiomatique et structurellement fidèle au latin. Le texte conserve la portée révélatrice probable de aperienda, conformément au contexte et à la décision de l’audit anglais, sans imposer d’agent ou d’interprétation doctrinale.
