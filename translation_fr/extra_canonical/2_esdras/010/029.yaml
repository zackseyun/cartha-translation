  text: et cum essem loquens ego haec, et ecce venit ad me angelus qui in principio venerat ad me et vidit me,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/029.yaml
  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: fr
  text: Pendant que je disais cela, voici que l’ange qui était venu me trouver au début revint auprès de moi et me vit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum essem loquens ego haec
  choice: Pendant que je disais cela
  rationale: Rend naturellement la simultanéité de la proposition latine tout en conservant son contenu.
- source_word: et ecce
  choice: voici que
  rationale: Préserve le marqueur narratif d’apparition soudaine sans lourdeur excessive.
- source_word: qui in principio venerat ad me
  choice: qui était venu me trouver au début
  rationale: Le plus-que-parfait restitue l’antériorité; « au début » conserve le sens temporel de « in principio ».
- source_word: venit ad me
  choice: revint auprès de moi
  rationale: Dans ce contexte, l’ange déjà venu au narrateur se présente de nouveau; « revint » évite la répétition maladroite de « vint », tandis que « auprès de moi » rend « ad me ».
- source_word: vidit me
  choice: me vit
  rationale: Traduction directe qui conserve l’énoncé du texte latin sans en préciser davantage la portée.
