  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: fr
  text: Maintenant donc, garde ta douleur pour toi et supporte avec courage les malheurs qui te sont arrivés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: retine apud temet ipsam dolorem tuum
  choice: garde ta douleur en toi-même
  rationale: Rend directement l’idée de contenir et conserver sa douleur au-dedans de soi, tout en maintenant l’adresse au féminin portée par « ipsam ».
- source_word: fortiter fer
  choice: supporte avec courage
  rationale: Expression française naturelle qui conserve à la fois l’impératif « fer » et la force morale exprimée par « fortiter ».
- source_word: casus
  choice: malheurs
  rationale: Dans ce contexte de souffrance, « casus » désigne les événements pénibles ou revers subis; « malheurs » restitue clairement cette valeur.
- source_word: quae tibi contigerunt
  choice: qui te sont arrivés
  rationale: Traduction idiomatique et fidèle des événements qui ont atteint la destinataire.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le lien logique de « nunc ergo » est conservé par « Maintenant donc ». Le féminin implicite de l’adresse latine n’exige pas de marque grammaticale explicite dans cette formulation française.
