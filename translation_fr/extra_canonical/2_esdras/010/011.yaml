source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fit multitudo eorum. Quis ergo debet lugere magis nisi haec quae tam magnam multitudinem perdidit, quam tu quae pro
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/011.yaml
  text: Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?
translation:
  language: fr
  text: 'Qui donc devrait porter davantage le deuil : celle qui a perdu une si grande multitude, ou toi qui portes le deuil pour un seul[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait latin fourni s’interrompt après « pour » (pro). La fin « un seul » est restituée d’après le contexte et le contraste avec « une si grande multitude ».
    reason: Signaler que le complément après pro n’est pas conservé dans l’extrait latin transmis, sans identifier explicitement la personne unique.
lexical_decisions:
- source_word: lugere
  choice: porter le deuil
  rationale: Cette expression française naturelle conserve l’idée d’un deuil profond, plutôt que celle de simples pleurs.
- source_word: haec
  choice: celle
  rationale: Le démonstratif féminin renvoie à la figure féminine évoquée dans le contexte, sans préciser davantage son identité.
- source_word: tam magnam multitudinem
  choice: une si grande multitude
  rationale: Traduction proche du latin, qui maintient le contraste quantitatif avec « un seul ».
- source_word: perdidit
  choice: a perdu
  rationale: Correspondance directe qui convient aussi bien à la perte de personnes qu’à celle d’un peuple.
theological_decisions:
- issue: Identité de la figure féminine désignée par « haec »
  choice: celle
  alternative: cette femme / cette cité
  rationale: Le latin emploie seulement un démonstratif féminin. La traduction n’explicite donc pas l’identification symbolique afin de préserver la progression et l’ambiguïté du passage.
- issue: Identité de la personne unique pleurée
  choice: un seul
  alternative: un seul fils
  rationale: Même si le contexte désigne le fils de la femme, ne pas répéter « fils » préserve la formulation elliptique reflétée par la tradition textuelle fournie.
translation_notes:
  register: Français moderne, digne et accessible. La structure comparative volontairement appuyée conserve la force rhétorique de la question latine.
