  source_fidelity: 'Le sens comparatif du latin est bien rendu : la femme qui a perdu une multitude est opposée à l’interlocutrice qui est en deuil pour un seul. Toutefois, l’expression française « pleures la perte d’un seul » explicite légèrement le rapport de perte, alors que le latin conserve simplement lugere pro uno. La lacune de l’extrait après pro doit rester signalée.'
  naturalness: La formulation proposée est compréhensible, mais « plutôt que toi » après « sinon celle » alourdit la question. Une opposition directe par deux termes coordonnés est plus naturelle en français moderne tout en gardant la force rhétorique.
  terminology: « Porter le deuil » convient à lugere et assure une formulation symétrique pour les deux personnes. « Une si grande multitude » rend fidèlement tam magnam multitudinem. « Un seul » maintient l’ellipse numérique sans imposer « fils ».
