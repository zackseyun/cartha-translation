  text: campo, ubi domus non est aedificata. Sciebam enim ego quoniam altissimus incipiebat tibi ostendere haec. Propterea dixi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/052.yaml
  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
translation:
  language: fr
  text: 'Car je savais que le Très-Haut commençait à te montrer ces choses[a]. C’est pourquoi j’ai dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « allait te montrer ces choses ».'
    reason: Le tour latin « incipiebat » suivi de l’infinitif peut décrire soit une action qui commence, soit, dans ce contexte de traduction, une action imminente.
lexical_decisions:
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel et naturel en français, correspondant directement au superlatif latin substantivé.
- source_word: incipiebat tibi ostendere
  choice: commençait à te montrer
  rationale: Rend directement l’aspect imperfectif de « incipiebat » avec l’infinitif « ostendere », tout en laissant en note la lecture prospective possible dans ce latin de traduction.
- source_word: haec
  choice: ces choses
  rationale: Conserve le démonstratif neutre pluriel sans préciser indûment le contenu de la révélation.
- source_word: Propterea dixi
  choice: C’est pourquoi j’ai dit
  rationale: Exprime clairement le lien logique de « propterea » et conserve l’introduction inachevée de la parole qui suit.
theological_decisions:
- issue: Valeur aspectuelle de « incipiebat ostendere »
  choice: commençait à te montrer
  alternative: allait te montrer
  rationale: Le sens littéral décrit le commencement de l’action, mais une valeur prospective est possible dans le latin de traduction et convient aussi à la séquence narrative; l’ambiguïté est donc signalée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français moderne, courant et digne. Le deux-points final indique que « j’ai dit » introduit la parole du verset suivant. Le segment initial « campo, ubi domus non est aedificata » appartient syntaxiquement à la phrase précédente et n’est donc pas inclus dans le texte de 10.52.
