source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: germinantium. Et ex ipsa initia omnes nacti, et alii ueniunt, et ecce pene omnes in perditionem ambulant et in exterminium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/010.yaml
  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: fr
  text: C’est d’elle que tous tirent leur origine, et d’autres viennent ; et voici, presque tous marchent vers la perdition et la destruction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex ipsa
  choice: d’elle
  rationale: Reprend naturellement en français l’antécédent féminin du contexte, sans l’expliciter au-delà du latin.
- source_word: initia omnes nacti
  choice: tous ont reçu leur commencement
  rationale: Conserve l’idée que tous tirent d’elle leur origine, dans une formulation française digne et intelligible.
- source_word: alii ueniunt
  choice: d’autres encore viennent
  rationale: Rend le caractère continu de l’arrivée d’autres êtres humains ; « encore » explicite naturellement cette continuité sans ajouter de contenu substantiel.
- source_word: in perditionem ambulant
  choice: marchent vers la perdition
  rationale: Préserve l’image biblique de la marche ainsi que l’orientation vers une issue funeste.
- source_word: in exterminium
  choice: l’anéantissement
  rationale: Rend exterminium comme issue de destruction complète, sans introduire l’idée moderne et plus étroite d’un massacre organisé.
theological_decisions:
- issue: Portée de « presque tous »
  choice: Conserver « presque tous » sans préciser leur identité ni leur destinée au-delà du texte
  alternative: Interpréter explicitement l’expression comme visant toute l’humanité ou comme une affirmation doctrinale sur le salut
  rationale: Le latin dit pene omnes et laisse au contexte la détermination exacte du groupe et de la portée théologique.
- issue: Relation entre « perdition » et « anéantissement »
  choice: Les coordonner comme deux termes de destination
  alternative: Les fusionner ou faire du second une proposition distincte
  rationale: Le latin coordonne in perditionem et in exterminium sous le même verbe ambulant ; la traduction garde cette structure et sa tension sémantique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation conserve le mouvement rhétorique du latin, notamment « et voici ». Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
