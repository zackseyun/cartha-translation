source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo noli timere neque expavescat cor tuum, sed ingredere et vide splendorem vel magnitudinem aedificii, quantum capax est tibi visu oculorum videre.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: fr
  text: Toi donc, n’aie pas peur, et que ton cœur ne soit pas terrifié ; mais entre et vois la splendeur ou la grandeur de l’édifice, autant que tes yeux peuvent en voir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tu ergo
  choice: Toi donc
  rationale: Conserve l’adresse personnelle emphatique et l’articulation logique du latin.
- source_word: noli timere neque expavescat cor tuum
  choice: n’aie pas peur et que ton cœur ne soit pas terrifié
  rationale: Reproduit les deux injonctions et préserve l’image biblique du cœur comme siège de l’effroi.
- source_word: ingredere
  choice: Entre
  rationale: Rend directement l’impératif latin indiquant l’entrée dans l’édifice.
- source_word: vide
  choice: contemple
  rationale: Dans ce contexte visionnaire, « contemple » exprime une observation attentive tout en restant naturel.
- source_word: splendorem vel magnitudinem
  choice: la splendeur ou la grandeur
  rationale: Maintient l’alternative ou la reformulation signalée par vel, sans la transformer en coordination.
- source_word: aedificii
  choice: de l’édifice
  rationale: « Édifice » convient au registre visionnaire et traduit précisément le génitif.
- source_word: quantum capax est tibi visu oculorum videre
  choice: dans la mesure où tes yeux sont capables de la voir
  rationale: Rend naturellement la limite imposée à la perception visuelle, malgré la formulation latine redondante.
theological_decisions:
- issue: Rapport entre la splendeur et la grandeur de l’édifice
  choice: « la splendeur ou la grandeur »
  alternative: « la splendeur et la grandeur »
  rationale: Le latin vel doit rester visible afin de ne pas résoudre la relation entre les deux termes en une simple addition.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le ton d’exhortation solennelle du passage sans calquer lourdement la redondance latine liée à la vision.
