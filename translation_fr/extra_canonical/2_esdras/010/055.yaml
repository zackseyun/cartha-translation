revisions:
- from: Toi donc, n’aie pas peur et que ton cœur ne soit pas terrifié. Entre plutôt et contemple la splendeur ou la grandeur de l’édifice, dans la mesure où tes yeux sont capables de la voir.
  to: Toi donc, n’aie pas peur, et que ton cœur ne soit pas terrifié ; mais entre et vois la splendeur ou la grandeur de l’édifice, autant que tes yeux peuvent en voir.
  rationale: La révision retire l’ajout sémantique « plutôt », restitue plus directement les impératifs ingredere et vide, et rend la clause finale de capacité visuelle dans un français moderne naturel. Elle préserve l’alternative volontairement non résolue de vel.
