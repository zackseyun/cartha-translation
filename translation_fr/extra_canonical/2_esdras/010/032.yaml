  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: fr
  text: 'Je dis : « Puisque tu m’as complètement abandonné. J’ai pourtant agi selon tes paroles et je suis sorti dans la campagne. Et voici, j’ai vu et je vois encore ce que je suis incapable de raconter. » Il me dit : « Tiens-toi debout comme un homme et… »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni se poursuit par « et », qui rattache cette phrase à la suite.
    reason: Signaler honnêtement que l’extrait source s’achève au milieu d’une phrase, alors que cette proposition n’apparaît pas dans la couche anglaise consultée.
lexical_decisions:
- source_word: derelinquens dereliquisti
  choice: tu m’as complètement abandonné
  rationale: La répétition du participe et du verbe intensifie l’idée d’abandon ; le français naturel exprime cette force par « complètement ».
- source_word: secundum sermones tuos
  choice: selon tes paroles
  rationale: Rend directement l’idée d’avoir agi conformément aux paroles ou instructions reçues, sans préciser davantage que le latin.
- source_word: in campum
  choice: dans la campagne
  rationale: « Campus » désigne ici l’espace découvert hors de la ville ; « dans la campagne » reste naturel et cohérent avec le contexte.
- source_word: uidi et uideo
  choice: j’ai vu et je vois encore
  rationale: Préserve le passage marqué du parfait au présent et indique naturellement que la vision se poursuit.
- source_word: Sta ut uir
  choice: Tiens-toi debout comme un homme
  rationale: Conserve l’image et l’ambiguïté de l’expression latine sans la réduire à une simple exhortation au courage.
