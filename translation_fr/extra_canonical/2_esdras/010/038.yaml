  yaml_path: translation/extra_canonical/2_esdras/010/038.yaml
  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: fr
  text: 'Il dit : « Écoute-moi : je t’instruirai et je te parlerai de ce que tu redoutes, car le Très-Haut t’a révélé bien des mystères. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dixit
  choice: Il dit
  rationale: Rend exactement le verbe latin sans ajouter l’idée d’une réponse ni un complément absent du texte.
- source_word: doceam te
  choice: je t’instruirai
  rationale: « Instruire » exprime naturellement l’action d’enseigner une personne dans ce registre.
- source_word: de quibus times
  choice: de ce que tu redoutes
  rationale: Cette formulation française naturelle conserve l’objet volontairement peu précisé de la crainte.
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel, clair et fidèle au superlatif latin.
- source_word: mysteria multa
  choice: bien des mystères
  rationale: Rend la pluralité et l’abondance exprimées par multa dans un français courant et digne.
theological_decisions:
- issue: Nature des « mystères » révélés
  choice: Conserver « mystères » sans explication
  alternative: Préciser qu’il s’agit de secrets divins ou de révélations
  rationale: Le latin mysteria ne définit pas davantage leur nature; une précision résoudrait indûment cette ouverture.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « je » conserve le parallélisme de doceam te et dicam tibi. Les mots « Vidit enim » du texte source fourni amorcent manifestement la phrase suivante et ne sont pas intégrés à ce verset incomplet.
