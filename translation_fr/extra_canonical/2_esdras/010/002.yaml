source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et evertimus omnes lumina, et surrexerunt omnes cives mei ad consolandam me, et quievi usque in alium diem usque noctem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
translation:
  language: fr
  text: Alors, nous avons tous éteint les lampes, et tous mes concitoyens se sont levés pour me consoler. Je me suis reposé jusqu’au lendemain, jusqu’à la nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evertimus ... lumina
  choice: nous avons ... éteint les lampes
  rationale: Dans ce contexte nocturne, le latin désigne naturellement l’extinction des lampes. « Éteindre » rend le sens idiomatiquement en français, tandis que « renverser » serait trop littéral et trompeur.
- source_word: omnes
  choice: tous
  rationale: '« Omnes » est au nominatif pluriel et qualifie le sujet implicite de « evertimus » : « nous avons tous », et non « toutes les lampes ».'
- source_word: cives mei
  choice: mes concitoyens
  rationale: Ce terme conserve l’idée d’appartenance à une même cité et convient au registre narratif.
- source_word: quievi
  choice: je me suis reposé
  rationale: Cette formulation rend directement l’idée de repos exprimée par le verbe latin et reste naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition temporelle inhabituelle « jusqu’au lendemain, jusqu’à la nuit » est maintenue afin de ne pas lisser une difficulté réelle du texte latin.
