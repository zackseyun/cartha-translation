    rationale: La conjonction latine et enchaîne les actions sans marquer explicitement une valeur temporelle renforcée.
  - severity: low
    issue: « me saisit » pour tenuit
    rationale: Tenuit signifie plus sobrement « tint » ou « prit »; « saisit » peut suggérer une prise brusque qui n’est pas indiquée.
  - severity: low
    issue: « mon intelligence m’avait quitté » pour intellectus meus alienatus erat
    rationale: La formulation est interprétative et suggère surtout une absence; « mon esprit était égaré » préserve mieux l’idée d’un esprit troublé, déplacé ou aliéné.
