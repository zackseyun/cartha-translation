source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelus qui in principio uenerat ad me, et uidit me, Et ecce eram positus ut mortuus, et intellectus meus alienatus erat, et tenuit dexteram meam et confortauit me et statuit me super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: fr
  text: L’ange qui était venu vers moi au commencement me vit. Et voici, j’étais étendu comme un mort, et mon esprit était égaré. Il me prit par la main droite, me fortifia et me remit debout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in principio
  choice: au commencement
  rationale: Rend directement l’expression latine tout en conservant son possible sens temporel de « au début » sans le préciser davantage.
- source_word: positus ut mortuus
  choice: étendu comme un mort
  rationale: Expression naturelle en français pour la posture décrite, tout en maintenant la comparaison explicite avec un mort.
- source_word: intellectus meus alienatus erat
  choice: mon intelligence m’avait quitté
  rationale: Conserve la référence à l’intellect ou à la conscience sans réduire explicitement l’expression à un simple évanouissement.
- source_word: tenuit dexteram meam
  choice: me saisit alors par la main droite
  rationale: Rend clairement que l’ange prend la main droite du narrateur; « alors » explicite seulement l’enchaînement narratif porté par et.
- source_word: confortauit me
  choice: me rendit des forces
  rationale: Dans ce contexte de faiblesse physique extrême, cette formulation moderne restitue naturellement l’idée de fortifier.
- source_word: statuit me super
  choice: me remit debout
  rationale: Le texte latin fourni s’interrompt après super, mais le verbe statuit et la couche anglaise auditée indiquent l’action de remettre le narrateur sur ses pieds; le français idiomatique n’a pas besoin d’ajouter « sur mes pieds ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve l’image de la mort et l’ambiguïté relative d’intellectus, qui peut viser l’intelligence, la perception ou la conscience.
