review_pass:
  verdict: revise
  source_fidelity: La suppression de la femme et l’apparition de la ville sont bien rendues, ainsi que les imparfaits passifs. Toutefois, « à sa place » ajoute un rapport de substitution spatiale ou de transformation que le latin sed (« mais ») n’explicite pas dans ce verset. « Se révélait » atténue aussi le passif de demonstrabatur (« était montré/révélé »).
  naturalness: Le français du projet est fluide et d’un registre approprié. « Un lieu aux grandes fondations était révélé » demeure naturel dans une description visionnaire biblique et reflète plus directement la construction passive.
  terminology: « Ville » rend civitas. « Lieu » est plus neutre et plus proche de locus que « emplacement ». « Grandes fondations » traduit magnis sans la nuance évaluative supplémentaire de « imposantes ».
  issues:
  - severity: medium
    issue: Ajout de « à sa place »
    rationale: Le texte latin oppose les deux visions par sed, mais ne dit pas explicitement que la ville se trouve à l’endroit de la femme. Cette précision interprétative doit être évitée.
  - severity: low
    issue: « se révélait » pour demonstrabatur
    rationale: Le réfléchi français est possible dans une vision, mais le latin est passif; « était révélé » préserve mieux la présentation d’un objet montré au voyant.
  - severity: low
    issue: « emplacement doté de fondations imposantes »
    rationale: 'Cette formulation est plus interprétative que nécessaire: locus se rend simplement par « lieu », et magnis par « grandes ».'
