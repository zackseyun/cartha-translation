  text: 'et ecce amplius mulier non conparebat mihi, sed civitas aedificabatur et locus demonstrabatur de fundamentis magnis. et timui et clamavi voce magna et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/027.yaml
  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
translation:
  language: fr
  text: 'Et voici : la femme ne m’apparaissait plus ; mais une ville se construisait, et un lieu aux grandes fondations était révélé. Alors j’eus peur, je m’écriai d’une voix forte et je dis :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et ecce
  choice: Et voici
  rationale: Conserve le marqueur latin de surprise et de transition visionnaire dans une tournure biblique encore claire en français moderne.
- source_word: mulier non conparebat mihi
  choice: la femme ne m’apparaissait plus
  rationale: Rend directement le datif mihi et la cessation indiquée par amplius avec une formulation française naturelle.
- source_word: civitas aedificabatur
  choice: une ville se construisait
  rationale: Préserve l’aspect progressif et la voix passive du latin sans préciser un agent absent du texte.
- source_word: locus demonstrabatur de fundamentis magnis
  choice: un emplacement doté de fondations imposantes se révélait
  rationale: Interprète de + ablatif comme une caractérisation, conformément au latin tardif, tout en maintenant demonstrabatur comme manifestation dans la vision.
- source_word: timui
  choice: saisi de peur
  rationale: Exprime idiomatiquement la réaction soudaine du voyant avant son cri.
- source_word: clamavi voce magna
  choice: je m’écriai d’une voix forte
  rationale: Formulation française naturelle qui conserve l’intensité de la voix.
theological_decisions:
- issue: Rapport entre la disparition de la femme et l’apparition de la ville
  choice: à sa place
  alternative: mais une ville se construisait
  rationale: Le contraste latin sed et le contexte immédiat indiquent une transformation visionnaire; « à sa place » la rend intelligible sans identifier davantage la femme et la ville.
- issue: Sens de de fundamentis magnis
  choice: doté de fondations imposantes
  alternative: à partir de grandes fondations
  rationale: Dans ce latin de traduction, de + ablatif peut exprimer une qualité ou une caractéristique. La formulation retenue évite d’imposer une origine spatiale peu probable.
translation_notes:
  register: Français moderne, digne et lisible, avec une légère coloration biblique dans « Et voici ». Le deux-points final respecte l’introduction des paroles qui suivent au verset suivant.
