source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et psalterium nostrum humiliatum est et hymnus noster conticuit et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est et arca testamenti nostri direpta est et sancta nostra contaminata sunt, et nomen quod nominatumest super nos paene profanatum est, et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt et Levitae nostri in captivitate abierunt, et virgines nostrae coinquinatae sunt et mulieres nostrae vim passae sunt, et iusti nostri rapti sunt et parvuli nostri proditisunt, et iuvenes nostri servierunt et fortes nostri invalidi facti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/022.yaml
  text: Our harp has been brought low[a], our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished, the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved[b], and our strong men have become weak.
translation:
  language: fr
  text: Notre harpe[a] a été abaissée, notre hymne s’est tu, notre allégresse s’est dissipée, la lumière de notre chandelier s’est éteinte, l’arche de notre alliance a été pillée, nos objets saints ont été profanés, et le nom invoqué sur nous a été presque profané. Nos enfants ont subi l’outrage, nos prêtres ont été brûlés, nos Lévites sont partis en captivité, nos vierges ont été souillées, nos femmes ont subi des violences, nos justes ont été enlevés, nos tout-petits ont été livrés[b], nos jeunes hommes ont été réduits en esclavage, et nos hommes forts se sont affaiblis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « psaltérion ».'
    reason: Le latin psalterium désigne un instrument à cordes dont l’équivalent précis est incertain.
  - marker: b
    text: 'Ou : « ont été trahis ».'
    reason: Le latin proditi sunt peut signifier soit « livrés », soit « trahis ».
lexical_decisions:
- source_word: psalterium
  choice: harpe
  rationale: Le mot latin désigne un instrument à cordes. « Harpe » est immédiatement compréhensible en français moderne, tandis que « psaltérion » est plus technique.
- source_word: humiliatum est
  choice: a été abaissée
  rationale: Conserve l’image inhabituelle de l’instrument humilié ou jeté à bas, sans la remplacer par une paraphrase portant sur sa musique.
- source_word: exultatio ... dissoluta est
  choice: l’allégresse s’est dissipée
  rationale: Rend la disparition de la joie exprimée par dissoluta est dans un français naturel.
- source_word: sancta nostra
  choice: nos objets saints
  rationale: Le neutre pluriel désigne vraisemblablement les choses sacrées; cette formulation évite de le réduire au seul sanctuaire.
- source_word: nomen quod nominatum est super nos
  choice: le nom invoqué sur nous
  rationale: Rend naturellement l’idiome sémitisant conservé par le latin, selon lequel un nom est prononcé ou invoqué sur un peuple pour marquer son appartenance.
- source_word: virgines nostrae
  choice: nos jeunes filles vierges
  rationale: Conserve explicitement le sens de virgines tout en restant idiomatique en français contemporain.
- source_word: proditi sunt
  choice: ont été livrés
  rationale: Dans ce contexte de défaite et de captivité, proditi peut signifier remis ou livrés à l’ennemi; « livrés » préserve mieux cette portée que « trahis », qui impose l’idée d’une traîtrise interne.
- source_word: iuvenes nostri servierunt
  choice: nos jeunes hommes ont été réduits en esclavage
  rationale: Le verbe servire exprime ici l’asservissement consécutif à la catastrophe, plutôt qu’un simple service volontaire.
theological_decisions:
- issue: Le nom divin « invoqué sur nous »
  choice: Conserver la tournure relationnelle « le nom invoqué sur nous »
  alternative: « le nom que nous portons »
  rationale: La formulation retenue garde l’image biblique de l’appartenance au Dieu dont le nom est prononcé sur le peuple, sans expliciter davantage l’identité de ce nom.
- issue: Nature de la souillure des vierges
  choice: « ont été souillées »
  alternative: « ont été violées »
  rationale: Le latin coinquinatae sunt indique la souillure et peut suggérer une violence sexuelle dans ce contexte, mais ne la nomme pas aussi explicitement que la proposition alternative; l’ambiguïté est donc maintenue.
translation_notes:
  register: Français international moderne, solennel mais accessible. La longue lamentation cumulative et son parallélisme ont été conservés. Les termes cultuels restent concrets, et les ambiguïtés de coinquinatae et proditi ne sont pas indûment résolues.
