  text: Three things Solomon built in the city and offered offerings; then it was that the barren woman bore a son. And what it told you, that
translation:
  language: fr
  text: 'Trois[a] : Salomon bâtit une ville et offrit des offrandes ; c’est alors qu’une femme stérile enfanta un fils. Quant à ce qui t’a été dit, à savoir que…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin commence abruptement par « trois », sans préciser ce qui est compté ; la formulation est incertaine.
    reason: Signaler l’ellipse et l’incertitude réelles du texte source sans réintroduire la leçon conjecturale « après trois mille ans ».
lexical_decisions:
- source_word: tres
  choice: Trois choses
  rationale: Le latin porte simplement tres (« trois », masculin pluriel) sans nom exprimé. « Trois choses » rend l’énumération implicite de manière intelligible, tout en signalant par une note l’état difficile du texte.
- source_word: aedificauit ... ciuitatem
  choice: bâtit la ville
  rationale: Rend directement le verbe et son complément ; l’article défini convient à la ville déjà identifiée dans le contexte.
- source_word: obtulit oblationes
  choice: présenta des offrandes
  rationale: Conserve la répétition étymologique du latin par une formulation française naturelle à caractère cultuel.
- source_word: peperit sterilis filium
  choice: la femme stérile enfanta un fils
  rationale: Explicite naturellement l’adjectif substantivé sterilis et conserve le registre élevé de peperit.
- source_word: Et quod tibi dixit quoniam
  choice: Quant à ce qu’elle t’a dit, que…
  rationale: Reproduit la transition inachevée vers le verset suivant ; le féminin « elle » renvoie à la femme évoquée dans le contexte.
theological_decisions:
- issue: Rapport symbolique entre Salomon, la ville et la femme stérile
  choice: Conserver la simple succession des affirmations sans expliciter leur interprétation
  alternative: Identifier expressément la femme ou la ville à Sion/Jérusalem
  rationale: Le fragment latin n’énonce pas ici cette identification ; l’ajouter résoudrait une relation symbolique que le texte laisse se développer dans le contexte.
translation_notes:
  register: Français international moderne, digne et lisible. Le point-virgule maintient le lien narratif entre les événements, et les points de suspension indiquent que la dernière proposition se poursuit au verset suivant.
