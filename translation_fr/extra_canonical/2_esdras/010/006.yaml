lexical_decisions:
- source_word: iracundia ad eam
  choice: En colère contre elle
  rationale: Rend directement l’attitude de colère dirigée envers la femme, dans un français naturel, sans en atténuer la force.
- source_word: Stulta super omnes mulieres
  choice: Toi, la plus insensée de toutes les femmes
  rationale: Exprime le superlatif comparatif du latin tout en conservant l’interpellation directe et sévère.
- source_word: non
  choice: ne vois-tu pas… ?
  rationale: Le latin fourni s’interrompt après l’amorce de la question négative. La formulation complète suit la couche de consultation anglaise auditée, qui conserve la question rhétorique attendue.
