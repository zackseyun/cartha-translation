  text: In anger at her, I said, “Most foolish of all women, do you not see our mourning and what has happened to us?
translation:
  language: fr
  text: 'En colère contre elle, je lui dis : « Toi, la plus insensée de toutes les femmes, ne vois-tu pas notre deuil et ce qui nous est arrivé ? »'
