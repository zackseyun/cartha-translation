- source_word: inchoasti consolare eam
  choice: tu as commencé à la consoler
  rationale: Rend explicitement eam par « la » et conserve l’aspect inchoatif de inchoasti.
- source_word: Nunc autem iam
  choice: mais maintenant
  rationale: « Mais maintenant » traduit naturellement la transition adversative et temporelle ; iam renforce ici le passage à la situation présente sans exiger un « déjà » peu idiomatique dans ce fragment.
