  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
translation:
  language: fr
  text: Quant à ce qu’elle t’a dit qu’elle avait été stérile pendant trente ans, cela signifie qu’il y eut trois mille ans dans le monde[a][45] sans qu’aucune offrande y ait encore été présentée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’âge ».'
    reason: previous_rendering
  - marker: '45'
    text: Le texte latin qui sous-tend « trois mille ans » est condensé et difficile. Cette interprétation suit la chronologie symbolique du chapitre, où les trente ans de la femme correspondent à une période beaucoup plus longue précédant les offrandes faites à Sion.
    reason: textual_variant
lexical_decisions:
- source_word: saeculo
  choice: dans le monde
  rationale: Ici, le terme désigne le cours de l’histoire du monde plutôt que l’opposition eschatologique technique entre deux âges. « Dans le monde » rend ce sens historique tout en signalant en note l’autre possibilité.
- source_word: oblatio oblata
  choice: aucune offrande ait encore été présentée
  rationale: Cette formulation naturelle conserve le nom et l’idée du verbe latin apparenté sans reproduire la répétition peu idiomatique « offrande offerte ».
- source_word: in ea
  choice: en elle
  rationale: Le pronom féminin renvoie à la femme symbolique, identifiée dans le contexte à Sion; conserver « elle » préserve le développement de cette identification sans l’expliciter prématurément.
theological_decisions:
- issue: Correspondance symbolique entre les trente ans de stérilité et la période antérieure aux offrandes à Sion
  choice: Traduire explicitement la correspondance par « cela signifie qu’il y eut trois mille ans »
  alternative: Rendre littéralement « c’est pourquoi il y avait trois ans dans le monde »
  rationale: Le latin transmis est comprimé et difficile, tandis que le contexte interprète les trente années de la femme comme trois mille ans de l’histoire symbolique de Sion. La note maintient visible l’incertitude textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase privilégie une syntaxe fluide tout en conservant le symbolisme féminin et l’ambiguïté de saeculum dans une note.
