  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: fr
  text: Et il arriva, quand tous eurent cessé de me consoler pour que je me repose, que je me levai pendant la nuit, m’enfuis et vins, comme tu le vois, dans ce champ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quievissent
  choice: eurent cessé
  rationale: Dans cette construction et selon le contexte, le verbe indique que tous avaient arrêté leur action de consolation; cette formulation française est naturelle et conserve l’enchaînement temporel.
- source_word: ut me consolarentur ut quiescerem
  choice: de me consoler pour que je me repose
  rationale: Rend explicitement le but de la consolation sans ajouter d’interprétation au rapport entre consolation et repos.
- source_word: nocte
  choice: pendant la nuit
  rationale: Expression française courante qui traduit clairement le cadre temporel.
- source_word: in hoc campo
  choice: dans ce champ
  rationale: Traduction directe de «campo», avec le démonstratif déictique conservé.
