  text: et quod tibi dixit quoniam nutrivi eum cum labore, haec erat habitatio Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/047.yaml
  text: And as for what she said to you[a], ‘I nourished him with toil,’ this was the dwelling of Jerusalem.
translation:
  language: fr
  text: 'Quant à ce qu’elle t’a dit : « Je l’ai nourri avec peine », cela correspondait à l’époque où Jérusalem était habitée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nutrivi eum
  choice: je l’ai élevé
  rationale: Dans ce contexte maternel, « élever » exprime naturellement le fait de nourrir et de prendre soin de l’enfant jusqu’à ce qu’il grandisse.
- source_word: cum labore
  choice: dans la peine
  rationale: Cette formulation conserve l’idée d’effort pénible et de souffrance associée à l’éducation de l’enfant.
- source_word: habitatio Hierusalem
  choice: la période où Jérusalem était habitée
  rationale: « habitatio » désigne ici l’état ou le temps durant lequel Jérusalem était habitée, plutôt qu’une demeure ou un bâtiment appartenant à la ville.
theological_decisions:
- issue: Rapport symbolique entre la parole de la femme et Jérusalem
  choice: cela représentait
  alternative: cela était
  rationale: Le contexte interprétatif identifie le détail du récit à une réalité concernant Jérusalem. « Représentait » rend cette fonction symbolique clairement, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du latin, tandis que « la période où Jérusalem était habitée » évite l’ambiguïté trompeuse de « demeure de Jérusalem ».
