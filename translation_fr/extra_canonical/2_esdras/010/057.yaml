  yaml_path: translation/extra_canonical/2_esdras/010/057.yaml
  text: But you are blessed above many[a], and you have been called by the Most High, as only a few have been.
translation:
  language: fr
  text: Mais toi, tu es plus heureux que beaucoup d’autres, et tu as été appelé auprès du Très-Haut[a], comme peu l’ont été.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « appelé par le Très-Haut ». Le latin apud peut indiquer la présence ou la proximité du Très-Haut ; dans ce contexte, il peut aussi être compris comme désignant celui qui appelle.'
    reason: Préserve l’ambiguïté de apud sans ajouter la notion de reconnaissance et signale la lecture agentive attestée dans la tradition de traduction.
lexical_decisions:
- source_word: beatus
  choice: heureux
  rationale: Rend naturellement l’état favorable exprimé par le latin, dans un registre biblique actuel, sans imposer une nuance ecclésiastique particulière.
- source_word: prae multis
  choice: entre beaucoup d’autres
  rationale: Exprime la distinction d’Esdras par rapport à un grand nombre, tout en évitant le français potentiellement hiérarchique ou quantitatif ambigu de « au-dessus de beaucoup ».
- source_word: uocatus es
  choice: tu as été appelé
  rationale: Conserve la voix passive et l’ambiguïté de vocare, qui peut évoquer un appel, une convocation ou une désignation.
- source_word: apud
  choice: auprès du Très-Haut
  rationale: Apud indique d’abord la proximité ou la présence auprès de quelqu’un plutôt que l’agent de l’action. Cette formulation conserve cette valeur sans trancher entièrement la nature de l’appel.
theological_decisions:
- issue: Le Très-Haut est-il l’agent de l’appel ou celui en présence de qui l’appel a lieu ?
  choice: auprès du Très-Haut
  alternative: par le Très-Haut
  rationale: Le latin apud favorise la relation de présence ou de proximité. La variante plus idiomatique qui comprend le Très-Haut comme agent est signalée en note, afin de préserver la tension du texte.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « tu » souligne le contraste marqué par Tu autem. La fin de la phrase suit la couche anglaise auditée, car l’extrait latin fourni s’interrompt après apud.
