  text: whom I bore with sorrows and brought forth with pains; but the earth, according to the way of the earth, goes away, as does the multitude now present in it’—
translation:
  language: fr
  text: «que j’ai enfanté dans la tristesse et mis au monde dans la douleur ; mais la terre s’en va selon la voie propre à la terre, tout comme la multitude qui s’y trouve à présent»—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quem
  choice: que
  rationale: Le pronom relatif masculin renvoie au fils évoqué dans le contexte; le français conserve ici naturellement le relatif objet sans répéter l’antécédent.
- source_word: cum meroribus peperi
  choice: j’ai porté dans la tristesse
  rationale: «Porter» exprime naturellement la maternité et distingue ce premier membre de «genui»; le pluriel latin de détresse est rendu par un collectif idiomatique.
- source_word: cum doloribus genui
  choice: mis au monde dans la douleur
  rationale: Rend explicitement l’enfantement et ses douleurs dans un français actuel, sans répétition artificielle.
- source_word: secundum uiam terrae
  choice: suit le cours propre à la terre
  rationale: Conserve l’idée d’une voie ou d’un ordre caractéristique de la terre, dans une formulation française intelligible et digne.
- source_word: abiit
  choice: elle passe
  rationale: Le parfait latin peut décrire le départ ou la disparition; le présent français convient au caractère général de l’énoncé tout en préservant cette amplitude.
- source_word: quae in ea multitudo praesens
  choice: tout comme la multitude qui s’y trouve à présent
  rationale: 'Le latin transmis est syntaxiquement difficile. Cette traduction suit la compréhension contextuelle reflétée dans la couche de consultation: la multitude actuellement sur la terre passe elle aussi.'
theological_decisions:
- issue: Rapport entre la terre et la multitude présente
  choice: La terre passe, et la multitude qui s’y trouve également.
  alternative: Faire de «la multitude» le seul sujet de «abiit».
  rationale: La ponctuation et la syntaxe du texte transmis restent difficiles, mais «Terra ... abiit» présente le plus directement «terra» comme sujet; la multitude est conservée comme élément parallèle sans développer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, courant mais digne. La métaphore maternelle est rendue sans archaïsme; la difficulté syntaxique de la dernière proposition est clarifiée avec retenue.
