  source_fidelity: 'La première expression latine, «cum meroribus peperi», désigne l’enfantement plutôt que le fait de porter une grossesse. «J’ai porté» atténue donc ce sens. De plus, «suit le cours propre à la terre : elle passe» reformule assez librement «Terra ... abiit» et ajoute l’idée que la terre suit un cours. La révision rend directement le départ, tout en maintenant, conformément à la lecture retenue par l’audit anglais, le parallélisme avec la multitude présente sur la terre.'
