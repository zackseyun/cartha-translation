  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
translation:
  language: fr
  text: Pendant que je lui parlais, voici que son visage se mit tout à coup à briller très vivement, et l’aspect de son visage devint étincelant[a], si bien que même [j’eus très peur d’elle].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « voici que son visage se mit soudain à resplendir avec une extrême intensité, et son apparence devint rayonnante ».'
    reason: previous_rendering
  - marker: b
    text: 'Le texte latin s’interrompt après « si bien que même ». Les mots entre crochets sont restitués d’après les versions syriaque et éthiopienne. Le syriaque correspond à « j’eus très peur d’elle »; l’éthiopien porte plutôt : « j’eus peur de m’approcher d’elle ».'
    reason: textual_variant
lexical_decisions:
- source_word: Et factum est cum loquebar ad eam
  choice: Pendant que je lui parlais
  rationale: La tournure française naturelle rend la proposition temporelle sans alourdir le récit par un calque de « Et factum est ».
- source_word: ecce
  choice: voici que
  rationale: Conserve le marqueur soudain et visionnaire du latin.
- source_word: fulgebat ualde subito
  choice: se mit tout à coup à briller d’un éclat extraordinaire
  rationale: Rend à la fois la soudaineté, l’intensité et l’éclat lumineux exprimés par subito, ualde et fulgebat.
- source_word: species coruscus fiebat uultus eius
  choice: l’aspect de son visage devint étincelant
  rationale: Traite « species ... vultus eius » comme un seul groupe et rend coruscus par un adjectif lumineux naturel en français.
- source_word: ut etiam
  choice: si bien que même
  rationale: Préserve l’amorce consécutive inachevée du texte latin transmis.
theological_decisions:
- issue: Rétablissement de la conséquence absente du fragment latin
  choice: '[j’eus très peur d’elle]'
  alternative: '[j’eus peur de m’approcher d’elle]'
  rationale: Le complément est signalé comme une restitution, puisque le latin s’interrompt après « ut etiam ». Il suit la lecture syriaque rapportée dans la révision, tandis que l’éthiopien semble préserver une formulation voisine centrée sur la crainte de s’approcher.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité apocalyptique; les crochets et la note rendent visible la limite du témoin latin sans masquer la restitution fondée sur les versions anciennes.
