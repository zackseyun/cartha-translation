  source_fidelity: 'Le sens général est fidèle : Uriel est celui qui a conduit Esdras dans un état mental visionnaire et accablant, et la phrase narrative finale est bien conservée. Toutefois, « maintenant » n’est pas exprimé par le latin, et « ma fin tourne à la ruine » atténue et actualise indûment le parfait factus est (« est devenue »).'
