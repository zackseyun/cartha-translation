  terminology: '« Bouleversement de l’esprit » est un bon choix pour excessus mentis dans ce contexte : il évite les connotations principalement joyeuses d’« extase » et les implications excessives d’« égarement ». « Ruine » et « opprobre » conservent l’ampleur non morale de corruptio et le sens de inproperium.'
