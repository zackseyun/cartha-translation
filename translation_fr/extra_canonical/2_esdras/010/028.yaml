source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
translation:
  language: fr
  text: « Où est l’ange Uriel, qui est venu me trouver au commencement ? C’est lui qui m’a plongé dans un si profond bouleversement de l’esprit[a] ; ma fin est devenue ruine, et ma prière, opprobre. » Pendant que je prononçais ces paroles, voici qu’il vint à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin emploie une expression très appuyée, littéralement proche de « l’abondance de cet état où l’esprit est hors de lui-même ». Il s’agit d’un état visionnaire accablant, qui entraîne une profonde désorientation.
    reason: lexical_alternative
lexical_decisions:
- source_word: multitudinem excessus mentis huius
  choice: un si profond bouleversement de l’esprit
  rationale: La tournure latine est littéralement proche de « l’abondance de cet état où l’esprit est hors de lui-même ». Elle décrit un état visionnaire accablant et une profonde désorientation, non une extase joyeuse.
- source_word: fecit uenire
  choice: m’a plongé
  rationale: Rend naturellement la construction causative latine et l’entrée imposée d’Esdras dans cet état.
- source_word: finis meus in corruptione
  choice: ma fin tourne à la ruine
  rationale: Conserve l’idée d’une issue qui aboutit à la destruction ou au dépérissement, sans réduire corruptio à la seule corruption morale.
- source_word: oratio mea in inproperium
  choice: ma prière au déshonneur
  rationale: Reproduit le parallélisme elliptique avec la proposition précédente ; inproperium évoque l’opprobre, le déshonneur ou un sujet de reproche.
- source_word: et ecce
  choice: voici que
  rationale: Préserve le marqueur narratif soudain et emphatique du latin biblique dans un français naturel.
theological_decisions:
- issue: Nature de l’excessus mentis
  choice: bouleversement de l’esprit
  alternative: extase de l’esprit / égarement de l’esprit
  rationale: Le contexte associe cet état à la détresse d’Esdras. « Extase » risquerait d’évoquer surtout la joie, tandis que « égarement » pourrait suggérer une faute ou une folie ordinaire ; « bouleversement » maintient la violence de l’expérience sans en fixer excessivement la nature.
- issue: Sens de corruptio
  choice: ruine
  alternative: corruption / dépérissement
  rationale: Le mot peut désigner la destruction, la décomposition ou une issue funeste. « Ruine » garde cette amplitude et évite d’imposer un sens exclusivement moral.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme de la plainte est conservé, ainsi que la transition narrative finale présente dans la source latine.
