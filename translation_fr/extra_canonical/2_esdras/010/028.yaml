    rationale: Le latin ne comporte pas d’adverbe temporel correspondant. Le parfait factus est marque un état advenu, non nécessairement un contraste explicite avec le présent.
  - severity: medium
    issue: « ma fin tourne à la ruine » pour factus est finis meus in corruptione
    rationale: « Tourne à » est moins précis que le parfait « est devenue » et peut évoquer une évolution en cours. Le latin présente la ruine comme l’état auquel la fin d’Esdras est parvenue.
