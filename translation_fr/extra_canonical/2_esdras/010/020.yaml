source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
translation:
  language: fr
  text: Ne dis pas cela, mais accepte de te laisser convaincre — car combien est grande la chute de Sion ![a] — et console-toi à cause de la douleur de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin est abrupt; on pourrait aussi comprendre : « quel malheur, en effet, que la chute de Sion ! »'
    reason: Préserver l’incertitude syntaxique de « quid enim casus Sion » tout en donnant dans le texte principal sa valeur exclamative probable.
lexical_decisions:
- source_word: noli facere sermonem hunc
  choice: Ne tiens pas de tels propos
  rationale: La tournure idiomatique française rend l’interdiction de produire ou de tenir ce discours, sans calquer lourdement le latin.
- source_word: consenti persuaderi
  choice: accepte de te laisser convaincre
  rationale: Conserve la voix passive de « persuaderi » et l’idée d’un consentement volontaire.
- source_word: casus Sion
  choice: la chute de Sion
  rationale: « Casus » désigne ici la chute ou l’effondrement de Sion; « chute » préserve la force et la concision du latin.
- source_word: consolare propter dolorem Hierusalem
  choice: console-toi à cause de la douleur de Jérusalem
  rationale: Rend directement « propter » et maintient la tension du texte, qui associe la consolation à la douleur de Jérusalem sans expliciter davantage leur rapport.
theological_decisions:
- issue: Rapport entre la chute de Sion et l’exhortation à la consolation
  choice: Conserver l’exclamation parenthétique et le lien causal explicite seulement devant la douleur de Jérusalem
  alternative: Faire de la chute de Sion la cause grammaticale directe de la consolation
  rationale: Le latin présente « quid enim casus Sion » comme une expression abrupte et autonome; il ne faut pas la fondre silencieusement dans « propter dolorem Hierusalem ».
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’interruption émotive du latin au moyen de tirets, tout en restant claire à la lecture.
