source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: fr
  text: Car si tu reconnais comme juste le décret de Dieu, tu recevras ton fils en temps voulu et tu seras louée parmi les femmes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustificaveris
  choice: tu reconnais la justice
  rationale: Le verbe latin peut signifier « déclarer juste » ou « reconnaître comme juste ». Ici, il s’agit d’accepter comme juste la décision de Dieu, sans suggérer que l’être humain rend Dieu juste.
- source_word: terminum Dei
  choice: la décision de Dieu
  rationale: « Terminus » désigne ici vraisemblablement une détermination ou un décret divin plutôt qu’une limite spatiale. « Décision » reste naturel et digne en français.
- source_word: recipies
  choice: tu retrouveras
  rationale: Dans le contexte du fils perdu, « retrouver » exprime naturellement le fait de le recevoir de nouveau, tout en conservant la promesse du texte.
- source_word: in tempore
  choice: au temps fixé
  rationale: La formule indique le moment approprié ou déterminé; « au temps fixé » conserve cette nuance mieux que le vague « en temps voulu ».
- source_word: conlaudaberis
  choice: tu seras célébrée
  rationale: Le passif exprime une louange publique. « Célébrée » convient au registre et évite le sens parfois faible de « complimentée ».
- source_word: in mulieribus
  choice: parmi les femmes
  rationale: Traduction directe de l’expression latine, qui situe la femme comme objet d’une louange remarquable au sein des femmes.
theological_decisions:
- issue: Nature de l’acte demandé envers le décret divin
  choice: reconnaître la justice de la décision de Dieu
  alternative: justifier le décret de Dieu
  rationale: La formulation choisie préserve l’idée d’une approbation humaine de la justice divine sans laisser entendre que la justice de Dieu dépend de cette approbation.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est conservé parce que l’énoncé s’adresse directement à une femme. La structure conditionnelle et les deux promesses futures du latin sont maintenues.
