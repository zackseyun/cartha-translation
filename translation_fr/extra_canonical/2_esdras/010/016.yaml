review_pass:
  verdict: revise
  source_fidelity: Le latin conditionnel emploie le futur antérieur (« iustificaveris ») suivi de futurs (« recipies », « conlaudaberis »). « Reconnaître comme juste » rend bien le sens contextuel de iustificare sans implication doctrinale indue. En revanche, « retrouver » explicite un retour que recipere ne formule pas nécessairement, et « au temps fixé » renforce légèrement l’indication plus sobre in tempore.
  naturalness: La formulation est claire et naturelle en français moderne. « Tu seras louée parmi les femmes » est idiomatique, d’un registre digne, et reproduit plus directement le passif de conlaudaberis que « célébrée ».
  terminology: « Décret de Dieu » rend terminum Dei de façon plus précise dans ce contexte, où terminus désigne une détermination ou ordonnance divine. « Reconnaître comme juste » conserve la nuance de iustificare. Aucun terme théologique confessionnel n’est imposé.
  issues:
