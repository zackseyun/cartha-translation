    issue: « tu retrouveras ton fils » explicite un retour
    rationale: Recipies signifie littéralement « tu recevras »; même si le contexte peut suggérer une restitution, « retrouveras » ajoute cette nuance au verbe.
  - severity: low
    issue: « au temps fixé » et « célébrée » sont légèrement interprétatifs
    rationale: In tempore est rendu plus sobrement par « en temps voulu », et conlaudaberis par « tu seras louée », qui maintient la portée de louange sans l’intensifier.
