source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem contristaris in uno filio. Interroga enim terram et dicet tibi, quoniam haec est quae debeat lugere tantorum super eam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/009.yaml
  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
translation:
  language: fr
  text: Mais toi, tu t’attristes pour un seul fils. Interroge donc la terre, et elle te dira que c’est elle qui devrait porter le deuil pour tant de personnes qui sont sur elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: autem
  choice: Mais toi
  rationale: Marque le contraste avec le contexte précédent; l’ajout explicite de « toi » restitue naturellement en français l’opposition portée par la forme verbale à la deuxième personne.
- source_word: contristaris
  choice: tu t’attristes
  rationale: Rend directement le présent de contristor sans renforcer indûment le sens en « désespérer ».
- source_word: in uno filio
  choice: pour un seul fils
  rationale: Le latin in introduit ici l’objet ou le motif de la tristesse; « un seul » conserve le contraste quantitatif avec la multitude évoquée ensuite.
- source_word: Interroga enim terram
  choice: Interroge donc la terre
  rationale: « Donc » rend la valeur explicative et argumentative de enim dans un ordre naturel en français.
- source_word: haec est quae debeat lugere
  choice: c’est elle qui devrait porter le deuil
  rationale: La tournure emphatique conserve la personnification féminine de terra et le subjonctif debeat; « porter le deuil » exprime naturellement lugere.
- source_word: tantorum super eam
  choice: pour tous ceux qui sont sur elle
  rationale: Le génitif substantivé tantorum désigne une grande multitude; « tous ceux » reste idiomatique sans ajouter une action absente du latin, tandis que « sur elle » conserve super eam.
theological_decisions:
- issue: Identité et portée de la terre personnifiée
  choice: Maintenir « la terre » comme interlocutrice personnifiée sans l’identifier davantage
  alternative: Comprendre explicitement la terre comme Jérusalem, le monde ou la tombe
  rationale: Le verset latin dit simplement terra et la personnifie; une identification plus précise dépend du contexte interprétatif et ne doit pas être introduite dans le texte.
- issue: Force de debeat
  choice: « devrait porter le deuil »
  alternative: « doit porter le deuil »
  rationale: Le conditionnel français préserve la nuance modale du subjonctif latin après la proposition relative, sans transformer l’énoncé en obligation catégorique.
translation_notes:
  register: Français moderne, digne et accessible. La structure contrastive et la personnification de la terre sont conservées, tout en évitant l’ajout interprétatif « qui naissent » ou « qui surgissent » absent du latin.
