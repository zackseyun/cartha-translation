  source_fidelity: La formulation « voir ma supplication accueillie » ajoute l’idée qu’Esdras assiste à l’accueil de sa prière. Le latin rattache plutôt l’action de Dieu (« ut susciperes », 2e personne) à l’estime dont Esdras est jugé digne.
  naturalness: Le reste est naturel et adapté à un registre biblique moderne. « Dès le commencement » est légèrement plus idiomatique ici que « Depuis le commencement » tout en restant fidèle à ab initio. La construction « digne que tu reçoives » est soutenue, mais claire et permet de conserver sans ambiguïté le sujet divin du subjonctif latin.
