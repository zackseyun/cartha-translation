source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ab initio demonstrasti servo tuo mirabilia haec et dignum me habuisti, ut susciperes deprecationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
translation:
  language: fr
  text: Dès le commencement, tu as montré ces merveilles à ton serviteur, et tu m’as jugé digne que tu reçoives ma supplication.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab initio
  choice: Depuis le commencement
  rationale: Rend naturellement l’idée temporelle du latin tout en conservant la portée potentiellement large de « initium ».
- source_word: demonstrasti
  choice: tu as montré
  rationale: Équivalent direct et idiomatique, sans ajouter l’idée plus précise de révélation.
- source_word: servo tuo
  choice: à ton serviteur
  rationale: Conserve la désignation relationnelle et le registre biblique courant de « servus ».
- source_word: mirabilia haec
  choice: ces merveilles
  rationale: « Merveilles » exprime des choses extraordinaires données à voir, conformément au contexte visionnaire.
- source_word: dignum me habuisti
  choice: tu m’as jugé digne
  rationale: Formulation française naturelle qui reproduit l’idée d’estimer ou de tenir quelqu’un pour digne.
- source_word: deprecationem meam
  choice: ma supplication
  rationale: Préserve le sens de prière instante et le lien lexical avec la supplication du verset précédent.
- source_word: susciperes
  choice: voir … accueillie
  rationale: Dans cette construction après « jugé digne », « accueillir » rend le fait de recevoir favorablement une requête; la tournure passive évite de faire d’Esdras celui qui reçoit sa propre supplication.
theological_decisions:
- issue: Sujet implicite de « susciperes » et bénéficiaire de l’action
  choice: Comprendre Dieu comme celui qui accueille la supplication d’Esdras
  alternative: « tu m’as jugé digne de recevoir ma supplication », formulation grammaticalement possible en français mais susceptible de faire d’Esdras le sujet de « recevoir »
  rationale: Le verbe latin à la deuxième personne du singulier renvoie à Dieu; la traduction choisie rend cette relation explicite sans développer la manière dont la prière est exaucée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. La phrase reste proche de la syntaxe latine, tout en levant une ambiguïté artificielle que créerait en français l’infinitif « recevoir ».
