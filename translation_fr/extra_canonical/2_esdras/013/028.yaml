  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: fr
  text: 'Quant au fait qu’il ne tenait ni épée ni arme de guerre, mais qu’il a pourtant anéanti l’assaut de la multitude venue l’attaquer, en voici l’interprétation :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  choice: épée
  rationale: Dans ce contexte, le latin « framea » désigne une épée plutôt qu’une lance ; ce choix suit le sens retenu par la révision critique.
- source_word: vas bellicosum
  choice: arme de guerre
  rationale: Expression française naturelle qui rend l’idée générale d’un instrument destiné au combat.
- source_word: corrumpit ... impetum
  choice: a anéanti l’assaut
  rationale: « Corrumpere » exprime ici la destruction ou la mise en échec complète, tandis que « impetus » désigne l’assaut de la multitude.
- source_word: ad expugnare eum
  choice: venue l’attaquer
  rationale: Rend idiomatiquement le but hostile exprimé par la tournure latine tardive.
theological_decisions: []
