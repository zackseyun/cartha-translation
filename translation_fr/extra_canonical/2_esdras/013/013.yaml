  rationale: 'La révision reste au plus près du latin et de l’audit anglais : elle évite de préciser indûment la nature des liens, exprime le passif de offerebantur par « étaient conduits », et ajuste la première image au génitif latin. L’ambiguïté lexicale de offerebantur est préservée en note.'
