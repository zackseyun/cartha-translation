revisions:
- from: 'De nombreux visages humains s’approchaient de lui : certains étaient joyeux, d’autres tristes ; certains étaient ligotés, et d’autres amenaient quelques-uns de ceux qu’on faisait avancer.[a] Je me réveillai tant ma frayeur était grande ; j’adressai une supplication au Très-Haut et je dis :'
