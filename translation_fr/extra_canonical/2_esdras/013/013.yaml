source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et accedebant ad eum vultus hominum multorum, quorumdam gaudentium, quorumdam tristantium, aliqui vero alligati, aliqui adducentes ex eis qui offerebantur. et egoa multitudine pavoris expergefactus sum et deprecatus sum Altissimum et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: fr
  text: 'Les visages de nombreuses personnes s’approchaient de lui : certains se réjouissaient, d’autres étaient tristes ; certains étaient attachés, et d’autres amenaient certains de ceux qui étaient conduits.[a] Je me réveillai, tant ma frayeur était grande ; je suppliai le Très-Haut et dis :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « certains de ceux qui étaient présentés ». Le verbe latin peut aussi signifier « offerts », mais ce sens n’est pas assuré ici.'
    reason: Signale les possibilités sémantiques de offerebantur sans introduire dans le texte principal une interprétation sacrificielle incertaine.
lexical_decisions:
- source_word: vultus hominum multorum
  choice: de nombreux visages humains
  rationale: Conserve l’image visionnaire inhabituelle des « visages » tout en évitant une tournure française trop lourde comme « les visages de beaucoup d’hommes » ; hominum désigne ici les êtres humains sans imposer le masculin.
- source_word: alligati
  choice: ligotés
  rationale: Rend directement l’état de personnes attachées ou entravées, sans préciser indûment le moyen par lequel elles l’étaient.
- source_word: adducentes
  choice: amenaient
  rationale: Exprime le fait de conduire des personnes auprès de quelqu’un dans un français naturel.
- source_word: offerebantur
  choice: qu’on faisait avancer
  rationale: Dans ce contexte processionnel, le verbe indique vraisemblablement que des personnes étaient conduites ou présentées, sans nécessairement évoquer une offrande sacrificielle.
- source_word: multitudine pavoris
  choice: tant ma frayeur était grande
  rationale: Transpose l’expression latine littérale « grandeur de la frayeur » en une formulation française claire qui maintient l’intensité causant le réveil.
- source_word: deprecatus sum Altissimum
  choice: j’adressai une supplication au Très-Haut
  rationale: Préserve le registre solennel de la prière instante et le titre divin Altissimus.
theological_decisions:
- issue: Sens potentiellement cultuel de offerebantur
  choice: qu’on faisait avancer
  alternative: ceux qui étaient offerts
  rationale: Le contexte décrit des personnes amenées devant la figure visionnaire ; traduire par « offerts » introduirait une connotation sacrificielle que le passage n’impose pas. Une note conserve l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, narratif et dignifié. Les temps du récit sont au passé simple, tandis que l’imparfait décrit la scène en cours. L’image étrange des « visages humains » est conservée parce qu’elle appartient à la texture visionnaire du texte source.
