  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
translation:
  language: fr
  text: Mais ceux de ton peuple qui sont restés, ceux qui se trouvent dans mon saint territoire, seront sauvés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin transmis ne comporte pas de verbe principal pour cette proposition. Plusieurs anciennes versions permettent de restituer « seront sauvés » ; le syriaque porte « vivront ».
    reason: Signaler précisément la lacune syntaxique du témoin latin et l’incertitude entre les formulations attestées par les anciennes versions.
lexical_decisions:
- source_word: derelicti sunt
  choice: qui resteront
  rationale: L’expression désigne ceux du peuple qui demeureront après les événements annoncés; ce choix rend naturellement en français l’idée de survivants laissés en vie.
- source_word: intra terminum meum Sanctum
  choice: dans les limites de mon territoire saint
  rationale: « Terminus » évoque ici un territoire délimité ou sa frontière. La formulation française conserve à la fois la dimension spatiale et l’appartenance exprimée par « meum ».
- source_word: '[verbe absent dans le latin transmis]'
  choice: seront sauvés
  rationale: Le texte latin est lacunaire et n’offre pas de verbe principal, mais les anciennes versions apparentées permettent de restituer l’issue promise; « seront sauvés » suit notamment les témoins éthiopien et arabe.
theological_decisions:
- issue: Restitution du verbe principal absent du latin conservé
  choice: seront sauvés
  alternative: resteront en vie
  rationale: Le syriaque atteste l’idée de vivre, tandis que l’éthiopien et l’arabe attestent celle d’être sauvé. Le texte principal retient « seront sauvés », conformément à plusieurs témoins anciens et au contexte, tout en signalant l’autre lecture en note sans effacer l’incertitude textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « ceux… ceux… » conserve la structure explicative du latin, tandis que « dans les limites de » exprime naturellement l’idée d’un espace saint délimité.
