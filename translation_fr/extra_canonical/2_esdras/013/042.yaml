- source_word: regione sua
  choice: leur propre pays
  rationale: « Pays » rend ici le territoire où ils vivaient; « propre » explicite la valeur possessive et contrastive de sua.
- source_word: Per introitus
  choice: par les passages
  rationale: La formulation reste volontairement inachevée, comme le segment latin, et « passages » convient à des voies d’accès sans préciser prématurément leur nature.
- source_word: autem
  choice: Mais
  rationale: La conjonction marque ici une transition contrastive; « Mais » reproduit celle de la source et de la segmentation transmise.
