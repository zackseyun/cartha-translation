source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quibus incipient cruciari, Quae adsimilatae sunt flammae, et perdet eos sine labore et legem quae igni adsimilata est. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: fr
  text: par lesquelles ils commenceront à être tourmentés, lesquelles sont comparées à une flamme ; il les détruira sans effort, ainsi que la loi, qui est comparée au feu. Et
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quibus incipient cruciari
  choice: par lesquels ils commenceront à être tourmentés
  rationale: Rend le relatif instrumental « quibus » et la valeur inchoative de « incipient », tout en conservant le lien avec l’antécédent du contexte précédent.
- source_word: adsimilatae sunt flammae
  choice: sont comparés à une flamme
  rationale: Traduit directement l’idée d’assimilation ou de comparaison; l’accord français au masculin pluriel suit le référent implicite de « quibus », tandis que le latin transmis présente une discordance apparente.
- source_word: perdet eos sine labore
  choice: Il les détruira sans effort
  rationale: « Sans effort » exprime naturellement « sine labore » sans suggérer travail, peine ou instrument supplémentaire.
- source_word: et legem quae igni adsimilata est
  choice: ainsi que la loi, qui est comparée au feu
  rationale: Conserve « legem » comme complément coordonné de « perdet », plutôt que de transformer la loi en moyen instrumental; « ainsi que » rend la coordination plus clairement en français.
theological_decisions:
- issue: Fonction syntaxique de la loi
  choice: 'La loi est un second objet de « détruira » : « ainsi que la loi »'
  alternative: « par la loi », où la loi serait l’instrument de la destruction
  rationale: Le texte latin porte l’accusatif « legem » coordonné par « et »; il ne fournit ni « per » ni ablatif permettant d’en faire explicitement l’instrument.
- issue: Image de la flamme et du feu
  choice: Maintenir deux comparaisons distinctes, « une flamme » puis « le feu »
  alternative: Harmoniser les deux images en employant partout « feu »
  rationale: La formulation préserve la variation lexicale du latin entre « flammae » et « igni ».
translation_notes:
  register: Français moderne, clair et digne. Le fragment commence et finit en pleine phrase; le « Et » final est donc conservé afin de respecter la délimitation fournie. La syntaxe demeure difficile, comme dans le latin transmis, notamment parce que « la loi » paraît être détruite plutôt que présentée comme l’instrument de la destruction.
