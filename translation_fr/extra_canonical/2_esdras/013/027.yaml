  text: And because you saw breath and fire and storm coming out from his mouth,[a]
translation:
  language: fr
  text: Et puisque tu as vu sortir de sa bouche comme un souffle, du feu et une tempête,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un esprit, du feu et une tempête ».
    reason: Le latin spiritum peut signifier « souffle » ou « esprit »; la note conserve cette ambiguïté.
lexical_decisions:
- source_word: quoniam
  choice: puisque
  rationale: Introduit naturellement en français la raison ou le point de l’explication qui suit.
- source_word: ut spiritum
  choice: comme un souffle
  rationale: « Comme » conserve le marqueur comparatif ut propre à la vision; « souffle » convient à ce qui sort de la bouche, tout en laissant signaler l’autre sens possible de spiritus.
- source_word: ignem
  choice: du feu
  rationale: Équivalent français direct et naturel.
- source_word: tempestatem
  choice: une tempête
  rationale: Conserve l’image d’une force violente et tumultueuse sans la réduire au seul vent.
- source_word: de ore eius exire
  choice: sortir de sa bouche
  rationale: Reproduit clairement le mouvement exprimé par le latin et place naturellement le complément en français.
theological_decisions:
- issue: Sens de spiritum dans cette image apocalyptique
  choice: souffle
  alternative: esprit
  rationale: Le contexte d’une émission provenant de la bouche, associée au feu et à la tempête, favorise « souffle »; une note préserve toutefois l’ambiguïté lexicale réelle.
- issue: Portée de ut
  choice: comme
  alternative: absence de comparaison explicite
  rationale: Le latin présente ces phénomènes comme une apparence visionnaire; omettre ut effacerait cette nuance.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant explicitement la comparaison visionnaire introduite par ut.
