  text: 'quoniam dixisti de his qui derelicti sunt, et de his qui non derelicti sunt haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/022.yaml
  text: 'For you said about those who are left, and about those who are not left, this is the interpretation:'
translation:
  language: fr
  text: 'Car tu as parlé de ceux qui sont laissés[a] et de ceux qui ne le sont pas : voici l’interprétation :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre sens possible : « restent » ; de même pour la seconde occurrence.'
    reason: Signaler l’autre rendu contextuellement possible de derelicti aux deux occurrences, sans lever son ambiguïté dans le texte principal.
lexical_decisions:
- source_word: derelicti
  choice: laissés
  rationale: Le participe latin signifie littéralement « laissés » ou « laissés derrière ». Ce choix conserve l’ambiguïté entre les personnes qui restent et celles qui sont épargnées, sans préciser prématurément leur sort.
- source_word: quoniam dixisti de
  choice: Quant à ce que tu as dit au sujet de
  rationale: 'Dans cette construction introductive, « quant à » rend naturellement la fonction discursive du latin : le locuteur reprend un élément mentionné auparavant afin de l’interpréter.'
theological_decisions:
- issue: Identité et sort de ceux qui sont « laissés »
  choice: Ne pas expliciter s’ils sont survivants, épargnés ou abandonnés
  alternative: Traduire par « ceux qui restent », « les survivants » ou « ceux qui sont épargnés »
  rationale: Le verset annonce seulement l’interprétation et le latin derelicti ne tranche pas à lui seul entre ces nuances.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la structure d’annonce de l’interprétation et l’opposition symétrique entre ceux qui sont laissés et ceux qui ne le sont pas.
