revisions:
- from: Mais lui[37], mon Fils, confondra les nations qui seront venues à cause de leurs impiétés, elles qui se seront approchées comme une tempête[a] ; il leur reprochera en face leurs mauvaises pensées et leurs tourments[b],
  to: Mais lui[37], mon Fils, mettra en accusation les impiétés des nations venues, celles qui se sont approchées comme une tempête[a] ; il leur reprochera en face leurs mauvaises pensées et les tourments[b],
  rationale: La révision conserve l’ambiguïté de la syntaxe latine difficile, notamment autour de tempestati adpropiauerunt et de la fonction exacte des « tourments ». Elle rend néanmoins l’objet explicite d’arguet (« les impiétés »), évite des temps français indûment marqués et ne prête pas explicitement les tourments aux nations. La note b préserve l’alternative de construction attestée dans la piste d’audit anglaise, tandis que le texte principal maintient la force de reproche de inproperabit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T22:08:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'La phrase française actuelle déplace de façon excessive l’objet de arguet : le latin associe explicitement le reproche/conviction aux « impiétés » des nations, plutôt que d’énoncer simplement que les nations sont confondues « à cause de » celles-ci. Le parfait aduenerunt ne requiert pas non plus un futur antérieur français. Enfin, eorum ne qualifie explicitement que mala cogitamenta ; répéter « leurs » devant « tourments » ajoute une précision absente du latin.'
  naturalness: La révision reste soutenue et lisible en français international. « Nations venues » et « se sont approchées » évitent les futurs antérieurs pesants. La construction demeure nécessairement un peu dense, car le latin est lui-même syntaxiquement difficile.
  terminology: « Mon Fils », « impiétés », « reprochera en face » et « tourments » sont appropriés. « Confondra » est possible pour arguet dans son sens judiciaire, mais « confondra les impiétés » est moins naturel en français que « mettra en accusation les impiétés » et rend plus explicitement l’objet exprimé par le latin. La note alternative est reformulée sans présenter « placer » comme le sens direct de inproperabit.
  issues:
  - severity: medium
    issue: L’objet de arguet est déplacé.
    rationale: « confondra les nations ... à cause de leurs impiétés » transforme les impiétés, exprimées dans le latin, en simple motif causal. Une formulation qui maintient les impiétés comme réalité mise en accusation est plus fidèle, sans résoudre au-delà du nécessaire la syntaxe heurtée.
  - severity: low
    issue: Les futurs antérieurs français surinterprètent les parfaits latins.
    rationale: « seront venues » et « se seront approchées » sont lourds et ne sont pas imposés par aduenerunt et adpropiauerunt. Des parfaits composés français rendent mieux leur valeur dans l’énoncé prophétique.
  - severity: medium
    issue: Possession ajoutée aux tourments.
    rationale: Dans « mala cogitamenta eorum et cruciamenta », eorum suit et qualifie explicitement « mauvaises pensées », non « tourments ». « leurs mauvaises pensées et les tourments » conserve l’ambiguïté du rapport des tourments aux nations.
  revised_text: Mais lui[37], mon Fils, mettra en accusation les impiétés des nations venues, celles qui se sont approchées comme une tempête[a] ; il leur reprochera en face leurs mauvaises pensées et les tourments[b],
