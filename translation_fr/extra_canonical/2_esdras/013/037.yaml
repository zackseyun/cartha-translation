source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ipse autem filius meus arguet quae aduenerunt gentes impietates eorum, has quae tempestati adpropiauerunt, et inproperabit coram eis mala cogitamenta eorum et cruciamenta,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/037.yaml
  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
translation:
  language: fr
  text: Mais lui[37], mon Fils, mettra en accusation les impiétés des nations venues, celles qui se sont approchées comme une tempête[a] ; il leur reprochera en face leurs mauvaises pensées et les tourments[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: '37'
    text: Dans l’interprétation, le mont Sion et la montagne « taillée sans l’intervention de mains humaines » sont rapprochés. L’image évoque intentionnellement un lieu saint établi ou révélé par Dieu, et non une montagne ordinaire façonnée par le travail humain.
    reason: cross_reference
  - marker: a
    text: 'Littéralement, le latin peut aussi se comprendre : « celles qui se sont approchées de la tempête ».'
    reason: source_ambiguity
  - marker: b
    text: 'Ou, selon une lecture plus neutre de la construction : « il mettra sous leurs yeux leurs mauvaises pensées et les tourments ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: arguet
  choice: confondra
  rationale: Le verbe latin peut signifier convaincre de faute, dénoncer ou confondre. « Con­fondra » conserve ici la portée judiciaire et accusatrice sans réduire le sens à une simple réprimande.
- source_word: impietates
  choice: impiétés
  rationale: Équivalent direct et digne, qui garde la dimension religieuse et morale du terme latin.
- source_word: tempestati adpropiauerunt
  choice: se seront approchées comme une tempête
  rationale: Cette formulation suit l’interprétation contextuelle retenue par la couche de consultation anglaise, où l’arrivée des nations est comparée à une tempête, tout en signalant en note la construction latine littérale avec le datif.
- source_word: inproperabit coram eis
  choice: il leur reprochera en face
  rationale: « Reprochera » restitue la force accusatrice de inproperabit, tandis que « en face » rend coram eis et l’idée d’une confrontation ouverte.
- source_word: cruciamenta
  choice: tourments
  rationale: Le mot désigne des souffrances ou supplices; « tourments » préserve l’ambiguïté sur leur nature et sur la relation exacte avec les mauvaises pensées.
theological_decisions:
- issue: Identité du personnage qui juge les nations
  choice: « lui, mon Fils »
  alternative: expliciter une identité messianique ou divine particulière
  rationale: Le texte nomme simplement « mon Fils ». La traduction conserve cette désignation sans importer une identification confessionnelle supplémentaire.
- issue: Rapport entre les impiétés et le jugement des nations
  choice: « confondra les nations… à cause de leurs impiétés »
  alternative: « confondra les impiétés des nations »
  rationale: La syntaxe latine est heurtée. Le choix français produit une phrase intelligible tout en maintenant les nations comme objet du jugement et leurs impiétés comme son motif.
- issue: Fonction de « mauvaises pensées et tourments »
  choice: objets du reproche
  alternative: réalités placées devant les nations
  rationale: Le sens accusateur de inproperabit est retenu dans le texte, mais la lecture plus neutre est conservée en note afin de ne pas effacer la tension syntaxique.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La ponctuation finale ouverte respecte le fait que la phrase se poursuit dans le verset suivant. La syntaxe latine étant irrégulière, le corps du texte privilégie une lecture intelligible, tandis que les notes préservent les principales possibilités littérales.
