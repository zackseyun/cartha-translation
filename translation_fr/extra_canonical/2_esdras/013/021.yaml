  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: fr
  text: 'Il me dit : « Je te dirai l’interprétation de la vision et je t’expliquerai aussi les sujets dont tu as parlé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visionis interpretationem
  choice: l’interprétation de la vision
  rationale: Rend directement le génitif latin et conserve le vocabulaire interprétatif du texte.
- source_word: dicam tibi
  choice: je vais te donner
  rationale: Formulation française naturelle pour l’annonce d’une interprétation, sans modifier la valeur future du latin.
- source_word: de quibus locutus es
  choice: les sujets dont tu as parlé
  rationale: Exprime naturellement en français le renvoi aux questions ou matières évoquées par l’interlocuteur, sans en préciser indûment la nature.
- source_word: adaperiam tibi
  choice: t’expliquer
  rationale: Le verbe latin signifie littéralement ouvrir ou dévoiler à quelqu’un ; « expliquer » en restitue ici clairement la fonction.
