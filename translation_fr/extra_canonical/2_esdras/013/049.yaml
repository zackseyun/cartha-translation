source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dinem earum quae collectae sunt gentes, proteget qui superauerit populum, Et tunc ostendet eis multa plurima portenta. Et dixi ego : dominator domine, hoc mihi ostende, propter quod uidi uirum ascendentem de corde maris. et dixit mihi : Sicut non potest hoc uel scrutinare uel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram uidere filium meum uel eos qui cum eo sunt nisi in tempore diei. Haec est interpretatio somnii quod uidisti, et propter hoc inluminatus es haec solus. Dereliquisti enim tua, et circa mea uacasti, et legem meam exquisisti ; Vitam enim tuam disposuisti in sapientiam, et sensum tuum uocasti matrem. Et propter hoc ostendi tibi haec, merces enim apud altissimum. erit enim post alios tres dies ad te alia loquar, et exponam tibi grauia et mirabilia. Et profectus sum et transii in campum, multum glorificans et laudans altissimum de mirabilibus quae per tempus faciebat, Et quoniam gubernat tempora et quae sunt in temporibus inlata : et sedi
    ibi tribus diebus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/049.yaml
  text: Then it will be, when he begins to destroy the gathered multitude of the nations, that he will protect the people who survive.
translation:
  language: fr
  text: Alors, quand il commencera à détruire la multitude rassemblée des nations, il protégera le peuple qui aura survécu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: collectae sunt gentes
  choice: la multitude rassemblée des nations
  rationale: Rend l’idée des nations réunies en une multitude, conformément au contexte immédiat, tout en conservant l’image du rassemblement.
- source_word: proteget
  choice: il protégera
  rationale: Traduction directe du futur latin, exprimant la protection accordée par la figure annoncée.
- source_word: superauerit populum
  choice: le peuple qui aura survécu
  rationale: Dans ce contexte, superauerit désigne vraisemblablement le peuple demeuré en vie après la destruction; le futur antérieur français restitue l’antériorité de cette survie par rapport à la protection.
theological_decisions:
- issue: Identité de celui qui détruit puis protège
  choice: Maintien du pronom « il » sans explicitation
  alternative: Nommer le Fils ou le Messie
  rationale: Le verset latin emploie une référence pronominale dépendant du contexte; l’expliciter ici résoudrait une référence que le texte laisse implicite.
translation_notes:
  register: Français moderne, clair et digne. La structure temporelle et la tension entre destruction des nations rassemblées et protection du peuple survivant sont conservées sans ajout doctrinal.
