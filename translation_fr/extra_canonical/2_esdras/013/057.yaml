  text: et profectus sum et transii in campum, multum glorificans et laudans Altissimum de mirabilibus, quae per tempus faciebat,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
translation:
  language: fr
  text: Puis je partis et me rendis dans la campagne, glorifiant et louant grandement le Très-Haut pour les merveilles qu’il accomplissait au fil du temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus sum et transii
  choice: je partis et me rendis
  rationale: 'Rend les deux verbes latins de déplacement sans lourdeur excessive : le départ, puis le passage vers le lieu indiqué.'
- source_word: in campum
  choice: dans la campagne
  rationale: « Campus » désigne ici un espace ouvert ou rural ; « dans la campagne » est naturel en français moderne tout en restant suffisamment général.
- source_word: multum glorificans et laudans
  choice: glorifiant et louant grandement
  rationale: Conserve les deux participes distincts ainsi que l’intensité exprimée par « multum ».
- source_word: Altissimum
  choice: le Très-Haut
  rationale: Titre divin traditionnel, clair et directement équivalent au latin.
- source_word: de mirabilibus
  choice: pour les merveilles
  rationale: Dans ce contexte de louange, « de » indique le motif ou l’objet de la célébration ; « pour » est idiomatique en français.
- source_word: quae per tempus faciebat
  choice: qu’il accomplissait au fil du temps
  rationale: L’imparfait rend l’action durative de « faciebat » ; « au fil du temps » préserve la portée temporelle assez ouverte de « per tempus » sans suggérer nécessairement une action intermittente.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. La formulation reste proche du latin, notamment par le maintien des deux verbes de louange et de l’aspect duratif de l’action divine.
