- from: mon Fils sera révélé, lui que tu as vu sous la forme d’un homme qui montait. Et lorsque toutes les nations entendront sa voix, chacune quittera son pays et abandonnera la guerre qu’elles se font les unes aux autres,
  to: mon Fils sera révélé, lui que tu as vu comme un homme qui montait. Et lorsque toutes les nations entendront sa voix, chacun quittera son pays et la guerre qu’ils se font les uns aux autres,
  rationale: La révision supprime l’ajout interprétatif « sous la forme de », rétablit la valeur distributive personnelle de unusquisque par « chacun » et conserve la coordination elliptique du latin. Elle préserve le mouvement ascendant sans imposer une interprétation doctrinale ou une destination céleste.
