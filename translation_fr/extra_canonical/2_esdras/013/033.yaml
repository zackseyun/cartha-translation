  text: reuelabitur filius meus quem uidisti uirum ascendentem. Et erit, quando audierint omnes gentes uocem eius, et derelinquet unusquisque regionem suam et bellum quod habent in alterutro,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/033.yaml
  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: fr
  text: mon Fils sera révélé, lui que tu as vu comme un homme qui montait. Et lorsque toutes les nations entendront sa voix, chacun quittera son pays et la guerre qu’ils se font les uns aux autres,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuelabitur
  choice: sera révélé
  rationale: Rend directement le passif futur latin sans préciser l’agent de la révélation.
- source_word: filius meus
  choice: mon Fils
  rationale: Conserve la désignation filiale et la majuscule éditoriale qui signale ici un titre dans ce contexte visionnaire.
- source_word: uirum ascendentem
  choice: sous la forme d’un homme qui montait
  rationale: Exprime naturellement la perception visionnaire tout en conservant le mouvement ascendant de ascendentem, sans imposer nécessairement une ascension céleste technique.
- source_word: omnes gentes
  choice: toutes les nations
  rationale: Équivalent courant de gentes dans un contexte collectif international.
- source_word: derelinquet unusquisque regionem suam
  choice: chacune quittera son pays
  rationale: Le référent distributif de unusquisque est rendu en accord avec « nations »; « pays » exprime naturellement regionem suam.
- source_word: bellum quod habent in alterutro
  choice: abandonnera la guerre qu’elles se font les unes aux autres
  rationale: Le verbe « abandonnera », partagé avec « quittera », explicite en français l’ellipse latine; « se font » rend idiomatiquement l’hostilité réciproque de in alterutro.
theological_decisions:
- issue: Nature du « Fils » et de l’homme vu dans la vision
  choice: Conserver « mon Fils » et décrire l’apparence humaine sans identifier davantage le personnage.
  alternative: Employer une formulation explicitement christologique ou « le Fils de l’homme ».
  rationale: Le latin dit filius meus et uirum, non « Fils de l’homme »; la traduction préserve donc la formulation et la tension du texte sans ajouter une identification doctrinale.
- issue: Sens de ascendentem
  choice: « qui montait »
  alternative: « qui s’élevait » ou « qui montait au ciel »
  rationale: « Qui montait » conserve le mouvement tout en évitant d’ajouter une destination absente du latin.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche du latin, mais la seconde proposition est légèrement restructurée pour éviter une coordination elliptique peu naturelle en français. La virgule finale est conservée, puisque le verset se poursuit syntaxiquement.
