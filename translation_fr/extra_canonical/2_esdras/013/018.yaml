  text: understanding what is stored up in the last days and not encountering them[a]. But also those who are left behind
translation:
  language: fr
  text: comprenant les choses réservées pour les derniers jours, sans les atteindre[a]. Mais aussi ceux qui sont laissés
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans les rencontrer » ou « sans y être confrontés ».'
    reason: Le verbe latin occurrere peut signifier atteindre, rencontrer ou se trouver face à quelque chose selon le contexte.
lexical_decisions:
- source_word: reposita
  choice: réservées
  rationale: Le participe latin désigne ce qui est mis de côté ou gardé en vue des derniers jours ; « réservées » est naturel et conserve cette idée.
- source_word: novissimis diebus
  choice: les derniers jours
  rationale: Expression eschatologique usuelle, traduite directement sans préciser davantage sa portée.
- source_word: occurrentes eis
  choice: sans les atteindre
  rationale: Dans ce contexte, occurrere avec le datif peut exprimer le fait de parvenir jusqu’aux réalités annoncées. Le pronom pluriel eis renvoie aux « choses » réservées.
- source_word: derelicti sunt
  choice: sont laissés
  rationale: Rendu formel qui préserve le passif et le caractère inachevé de cette proposition fragmentaire.
theological_decisions:
- issue: Sens de occurrentes eis
  choice: sans les atteindre
  alternative: sans les rencontrer / sans y être confrontés
  rationale: Le latin permet plusieurs nuances. « Atteindre » convient au contexte de réalités futures auxquelles certains ne parviennent pas, tandis que la note conserve l’autre lecture lexicale possible.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe fragmentaire du texte source est conservée, notamment dans la dernière proposition, qui se poursuit vraisemblablement au verset suivant.
