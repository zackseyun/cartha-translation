  rationale: Rend les deux vocatifs latins distincts et conserve leur solennité sans ajouter de conjonction absente du texte.
- source_word: de corde maris
  choice: du cœur de la mer
  rationale: Conserve l’image concrète et poétique du latin plutôt que de l’aplatir en « du milieu de la mer ».
- source_word: ascendentem
  choice: monter
  rationale: Exprime directement le mouvement ascendant du participe latin dans une tournure française naturelle.
theological_decisions:
- issue: Valeur du double titre « Dominator Domine »
  choice: Maître, Seigneur
  alternative: Seigneur souverain
  rationale: Le texte présente deux termes d’adresse; la traduction principale maintient cette tension lexicale au lieu de les fondre en un seul titre composé.
