translation:
  language: fr
  text: mais j’ai seulement vu comment il faisait jaillir de sa bouche comme une vague de feu, de ses lèvres un souffle de flamme, et de sa langue des étincelles de tempête.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emittit / emittebat
  choice: faisait jaillir
  rationale: Rend l’idée d’émission avec force et convient naturellement aux trois images, tout en harmonisant la variation de temps du latin transmis.
- source_word: sicut fluctum ignis
  choice: comme une vague de feu
  rationale: Conserve la comparaison explicite et l’image saisissante du latin.
- source_word: spiritum flammae
  choice: un souffle de flamme
  rationale: « Souffle » garde le champ sémantique de spiritus et s’accorde avec l’émission par les lèvres sans surinterprétation théologique.
- source_word: scintillas tempestatis
  choice: des étincelles de tempête
  rationale: Traduction directe qui préserve l’association imagée et inhabituelle entre étincelles et tempête.
