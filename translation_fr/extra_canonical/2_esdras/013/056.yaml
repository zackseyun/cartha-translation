source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc ostendi tibi haec, merces apud Altissimum. erit enim post alios tres dies, ad te alia loquar et exponam tibi gravia et mirabilia.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: fr
  text: 'C’est pourquoi je t’ai montré ces choses : il y a une récompense auprès du Très-Haut. Car, après encore trois jours, je te dirai d’autres choses et je t’exposerai des choses graves et merveilleuses.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: merces apud Altissimum
  choice: il y a une récompense auprès du Très-Haut
  rationale: Rend directement «merces» par «récompense» et conserve l’image spatiale/relationnelle de «apud» sans préciser indûment le bénéficiaire.
- source_word: post alios tres dies
  choice: dans trois jours
  rationale: Expression française naturelle pour indiquer qu’un nouvel entretien aura lieu après trois jours supplémentaires.
- source_word: alia loquar
  choice: je te parlerai encore
  rationale: Dans ce contexte, «alia» indique la poursuite de la révélation; «encore» restitue naturellement l’idée sans imposer «d’autres choses» comme objet explicite.
- source_word: gravia
  choice: des choses profondes
  rationale: «Gravia» signifie littéralement des choses lourdes ou importantes; «profondes» exprime ici leur gravité et leur portée dans un français naturel.
- source_word: mirabilia
  choice: merveilleuses
  rationale: Conserve le sens de choses suscitant l’émerveillement, sans les réduire nécessairement à des miracles.
theological_decisions:
- issue: Lien entre la révélation accordée et la récompense auprès du Très-Haut
  choice: Maintenir deux propositions juxtaposées par deux-points
  alternative: «car tu as une récompense auprès du Très-Haut»
  rationale: Le latin nettoyé ne donne pas explicitement le bénéficiaire de «merces» et sa ponctuation est incertaine; la formulation retenue préserve cette indétermination sans ajouter «tu as».
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé pour l’adresse singulière. La formulation évite de surinterpréter la syntaxe latine elliptique autour de «merces apud Altissimum».
