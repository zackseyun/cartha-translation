- from: 'C’est pourquoi je t’ai montré ces choses : il y a une récompense auprès du Très-Haut. En effet, dans trois jours, je te parlerai encore et je t’exposerai des choses profondes et merveilleuses.»'
  to: 'C’est pourquoi je t’ai montré ces choses : il y a une récompense auprès du Très-Haut. Car, après encore trois jours, je te dirai d’autres choses et je t’exposerai des choses graves et merveilleuses.»'
  rationale: La révision corrige le délai supplémentaire exprimé par « alios », évite l’interprétation de « gravia » comme une profondeur conceptuelle, et rend plus entièrement « alia loquar ». Elle maintient l’ellipse du latin concernant la récompense auprès du Très-Haut.
