lexical_decisions:
- source_word: colligentem ad se
  choice: il rassemblait auprès de lui
  rationale: Rend le participe présent latin dans une construction française naturelle tout en conservant l’idée d’un rassemblement orienté vers la personne.
- source_word: aliam multitudinem pacificam
  choice: une autre multitude, pacifique
  rationale: Conserve « autre », le substantif collectif et la caractérisation pacifique, sans préciser artificiellement le rapport syntaxique ou la nature de la paix.
- source_word: decem tribus
  choice: les dix tribus
  rationale: Équivalent direct et traditionnel du latin.
- source_word: captiuae factae sunt de
  choice: furent emmenées captives hors de
  rationale: Traduit l’entrée en captivité et maintient la préposition finale « de », puisque la phrase se poursuit au verset suivant selon la délimitation fournie.
theological_decisions:
- issue: Identification de la multitude pacifique
  choice: « Ce sont les dix tribus »
  alternative: « celles-ci sont les dix tribus »
  rationale: Le démonstratif latin « Haec » renvoie naturellement à la multitude décrite; la formulation retenue reste directe sans ajouter d’interprétation.
translation_notes:
  register: Français moderne, digne et accessible. Le deux-points après « vu » clarifie la construction participiale latine. La fin volontairement suspendue (« hors de ») respecte exactement la limite textuelle fournie pour le verset 39.
