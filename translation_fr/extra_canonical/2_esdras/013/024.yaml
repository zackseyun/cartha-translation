lexical_decisions:
- source_word: scito ergo
  choice: Sache donc
  rationale: Rend directement l’impératif latin et son articulation logique, dans un français naturel et digne.
- source_word: magis beatificati sunt
  choice: sont plus heureux
  rationale: Exprime ici la condition plus favorable des survivants sans introduire la notion ecclésiale de béatification.
- source_word: qui derelicti
  choice: ceux qui restent
  rationale: Dans l’opposition avec les morts, le participe renvoie naturellement à ceux qui demeurent en vie; «restent» conserve une formulation simple sans préciser davantage la cause.
- source_word: qui mortui sunt
  choice: ceux qui sont morts
  rationale: Traduction directe qui préserve l’opposition explicite du texte latin.
theological_decisions:
- issue: Sens de beatificati
  choice: plus heureux
  alternative: plus bénis
  rationale: Le contexte compare le sort de deux groupes. «Plus heureux» garde cette portée comparative sans imposer que le latin désigne explicitement une bénédiction divine.
