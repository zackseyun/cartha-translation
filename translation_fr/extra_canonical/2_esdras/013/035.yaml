  footnotes:
  - marker: a
    text: Ou « le réduire par la force » ou « le prendre d’assaut ».
    reason: Le verbe latin expugnare peut évoquer la conquête ou la réduction d’un adversaire par un assaut, nuance difficile à rendre entièrement par un seul verbe français.
lexical_decisions:
- source_word: uolentes uenire
  choice: désireux de venir
  rationale: Le participe pluriel exprime l’intention ou la volonté du groupe; cette tournure reste naturelle en français tout en conservant la construction de la source.
- source_word: expugnare eum
  choice: le vaincre
  rationale: Expugnare désigne plus fortement le fait de réduire ou de vaincre par la force qu’une simple attaque. « Le vaincre » exprime ici le but recherché sans présumer qu’il sera effectivement atteint.
