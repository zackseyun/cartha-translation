  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
translation:
  language: fr
  text: jusqu’au temps de la fin. Et maintenant, ils ont recommencé à venir. De nouveau, le Très-Haut a obstrué les bras du fleuve[a] pour qu’ils puissent traverser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les veines du fleuve »; on peut aussi comprendre : « les chenaux du fleuve ».'
    reason: textual_or_lexical_note
lexical_decisions:
- source_word: usque in nouissimo tempore
  choice: jusqu’au temps de la fin
  rationale: Cette expression rend le singulier latin et sa portée eschatologique naturelle dans le contexte, sans suggérer simplement « la fois précédente ».
- source_word: iterum coeperunt uenire
  choice: ils ont recommencé à venir
  rationale: « Recommencer » exprime naturellement la combinaison de iterum et coeperunt, tandis que le passé composé correspond au parfait latin.
- source_word: uenas fluminis
  choice: les bras du fleuve
  rationale: Littéralement « les veines du fleuve »; en français courant, « bras » désigne naturellement ses chenaux ou ramifications.
- source_word: statuit
  choice: a obstrué
  rationale: Dans ce contexte de traversée, le verbe indique que le Très-Haut arrête ou bloque les voies d’eau; « obstrué » conserve cette idée sans préciser indûment le procédé.
- source_word: Altissimus
  choice: le Très-Haut
  rationale: Titre divin français traditionnel, exact et intelligible.
theological_decisions:
- issue: Portée de nouissimo tempore
  choice: le temps de la fin
  alternative: le dernier temps
  rationale: Le contexte est eschatologique; « temps de la fin » garde cette portée tout en restant idiomatique, alors que « dernier temps » est moins naturel et peut être obscur.
- issue: Action divine sur le fleuve
  choice: a obstrué les bras du fleuve
  alternative: a arrêté les cours du fleuve
  rationale: Le texte attribue directement au Très-Haut l’action permettant la traversée, sans expliquer son mécanisme; la traduction conserve cette tension narrative.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset commence comme la suite syntaxique du verset précédent. Le rythme des deux occurrences de iterum est conservé par « recommencé » puis « De nouveau ».
