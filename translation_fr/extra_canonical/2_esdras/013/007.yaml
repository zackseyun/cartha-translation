  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: fr
  text: Mais j’ai cherché à voir la région ou le lieu d’où la montagne avait été taillée, et je n’ai pas pu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem vel locum
  choice: la région ou le lieu
  rationale: Reproduit directement les deux termes latins et leur coordination, sans effacer leur possible nuance.
- source_word: unde
  choice: d’où
  rationale: Rend naturellement en français l’idée de provenance.
- source_word: sculptus esset mons
  choice: la montagne avait été taillée
  rationale: Le plus-que-parfait restitue l’antériorité du subjonctif plus-que-parfait passif latin; « taillée » convient à une masse montagneuse façonnée ou découpée sans préciser indûment le procédé.
- source_word: non potui
  choice: je n’ai pas pu
  rationale: Expression française courante et fidèle de l’impossibilité constatée.
