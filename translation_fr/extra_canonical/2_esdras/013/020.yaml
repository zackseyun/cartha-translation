source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'attamen facilius est periclitantem venire in haec, quam pertransire sicut nubem a saeculo et non videre quae contigerunt in novissimo. Et respondit ad me et dixit:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/020.yaml
  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
translation:
  language: fr
  text: '« Pourtant, il est plus facile à celui qui court un danger d’arriver jusqu’à ces événements que de quitter ce monde[a] comme un nuage sans voir ce qui est arrivé à la fin. » Il me répondit en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de quitter cet âge »; le latin peut désigner le monde ou l’âge présent.
    reason: Préserver l’ambiguïté lexicale de saeculum.
lexical_decisions:
- source_word: periclitantem
  choice: celui qui court un danger
  rationale: Rend le participe accusatif latin en conservant l’idée d’une personne exposée au danger, sans préciser davantage la nature de celui-ci.
- source_word: venire in haec
  choice: arriver jusqu’à ces événements
  rationale: Le démonstratif neutre désigne ici les réalités ou événements annoncés; cette formulation est naturelle en français tout en gardant le mouvement exprimé par venire.
- source_word: pertransire sicut nubem a saeculo
  choice: quitter ce monde comme un nuage
  rationale: 'L’ablatif avec a exprime vraisemblablement la séparation: partir du monde ou de l’âge présent. « Comme un nuage » conserve l’image du texte.'
- source_word: quae contigerunt in novissimo
  choice: ce qui est arrivé à la fin
  rationale: Conserve l’accompli de contigerunt et rend le substantif novissimo sans imposer l’expression plus interprétative « les derniers jours ».
- source_word: Et respondit ad me et dixit
  choice: Il me répondit en disant
  rationale: Équivalent français naturel de la formule narrative sémitisante transmise en latin, sans omettre son second verbe.
theological_decisions:
- issue: Sens de saeculum dans l’expression a saeculo
  choice: ce monde
  alternative: cet âge / l’âge présent
  rationale: Dans cette construction de séparation, le sens est probablement quitter le monde, donc mourir avant les événements finaux. Une note conserve l’autre valeur temporelle possible de saeculum.
- issue: Portée eschatologique de in novissimo
  choice: à la fin
  alternative: dans les derniers temps
  rationale: La traduction retenue préserve la concision et l’indétermination du latin, sans définir une chronologie eschatologique particulière.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit de près le contraste du latin, tandis que la formule finale est légèrement idiomatisée. Le marqueur de note [a] est placé immédiatement après l’expression concernée.
