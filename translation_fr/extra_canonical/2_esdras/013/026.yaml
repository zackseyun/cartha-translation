source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: fr
  text: C’est lui que le Très-Haut a gardé durant de longues périodes. Il délivrera lui-même sa création et guidera lui-même ceux qui sont restés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conservat
  choice: a gardé
  rationale: Rend naturellement en français le parfait latin à valeur résultative, sans préciser davantage la manière dont le personnage a été préservé.
- source_word: multis temporibus
  choice: pendant de nombreux temps
  rationale: Conserve l’expression temporelle large et inhabituelle du latin, sans la préciser en « siècles » ou en « âges ».
- source_word: per semet ipsum
  choice: lui-même
  rationale: Exprime l’insistance du latin sur l’action accomplie par lui en personne.
- source_word: liberabit
  choice: délivrera
  rationale: Correspond au sens de libération ou de salut porté par le verbe latin, tout en restant idiomatique.
- source_word: disponet
  choice: guidera
  rationale: Dans ce contexte personnel, traduit l’idée d’ordonner, de conduire ou de régler le sort des survivants sans imposer la nuance administrative de « disposera ».
- source_word: qui derelicti sunt
  choice: ceux qui sont restés
  rationale: Préserve l’ambiguïté entre survivants et personnes laissées en arrière, sans ajouter explicitement « en vie ».
theological_decisions:
- issue: Identité du personnage préservé par le Très-Haut
  choice: C’est lui
  alternative: C’est celui
  rationale: Maintient la désignation emphatique du latin sans identifier explicitement le personnage ni importer un titre christologique.
- issue: Agent de la délivrance
  choice: Il délivrera lui-même sa création
  alternative: Il délivrera sa création par ses propres moyens
  rationale: Conserve l’insistance sur l’action personnelle du personnage, sans développer la portée doctrinale de cette autonomie.
- issue: Référent du possessif dans « creaturam suam »
  choice: sa création
  alternative: la création du Très-Haut
  rationale: Respecte le possessif latin rattaché grammaticalement au sujet de la relative, tout en laissant subsister la tension théologique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Deux phrases évitent une longue chaîne de relatives tout en conservant la progression du latin. La répétition de « lui-même » est maintenue parce qu’elle correspond à la double insistance de « per semet ipsum » et « ipse ».
