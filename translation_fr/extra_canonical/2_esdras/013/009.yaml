  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: fr
  text: 'Et voici : lorsqu’il vit l’assaut de la multitude qui approchait, il ne leva pas la main et ne tenait ni lance ni aucune arme de guerre ;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et ecce
  choice: Et voici
  rationale: Conserve la formule de présentation emphatique du latin dans une tournure biblique claire et encore naturelle.
- source_word: impetum
  choice: l’assaut
  rationale: Exprime une attaque violente ou une charge, conformément au contexte d’une multitude venue combattre.
- source_word: multitudinis uenientis
  choice: de la multitude qui approchait
  rationale: Rend le participe latin de façon naturelle tout en indiquant le mouvement de la multitude vers l’homme.
- source_word: frameam
  choice: lance
  rationale: Dans ce contexte guerrier, « lance » correspond au sens retenu par la tradition textuelle consultée et évite le terme français rare « framée ».
- source_word: instrumentum bellicosum
  choice: arme de guerre
  rationale: Formulation française idiomatique correspondant au sens de tout équipement servant au combat.
theological_decisions:
- issue: L’homme affronte la multitude sans geste ni arme conventionnels
  choice: Conserver explicitement l’absence de main levée, de lance et de toute arme de guerre
  alternative: Reformuler en disant simplement qu’il ne combattit pas avec des armes
  rationale: Le détail concret prépare la manière extraordinaire dont il agit ensuite et ne doit pas être aplati par une paraphrase interprétative.
