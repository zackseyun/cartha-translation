  text: And I looked, and behold, he carved out for himself a great mountain and flew upon it.
translation:
  language: fr
  text: 'Je regardai, et voici : il se tailla lui-même une grande montagne et vola sur elle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sibimet ipso sculpsit
  choice: il se tailla lui-même
  rationale: Conserve la valeur réfléchie et emphatique de « sibimet ipso » ainsi que l’image concrète de « sculpsit », sans préciser dans quelle matière la montagne est taillée.
- source_word: montem magnum
  choice: une grande montagne
  rationale: Rend directement l’expression latine, avec l’ordre naturel du français moderne.
- source_word: volavit super eum
  choice: vola sur elle
  rationale: Le pronom latin renvoie à « montem »; le féminin français reprend donc « montagne ». « Sur elle » préserve l’ambiguïté de « super » entre mouvement au-dessus de la montagne et arrivée sur celle-ci.
theological_decisions:
- issue: Nature et fonction de la montagne
  choice: Ne pas expliciter si la montagne sert de plateforme, de lieu d’atterrissage ou de symbole.
  alternative: Traduire de façon interprétative par « alla se poser dessus » ou « vola au-dessus d’elle ».
  rationale: Le latin « volavit super eum » ne tranche pas nettement entre ces représentations; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici » maintient la formule visionnaire « et ecce »; les deux-points rendent son articulation naturelle en français.
