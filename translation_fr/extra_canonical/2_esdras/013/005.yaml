source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: fr
  text: 'Après cela, je regardai, et voici : une multitude innombrable d’hommes se rassemblait, venant des quatre vents du ciel, pour faire la guerre à l’homme qui était monté de la mer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vidi
  choice: je regardai
  rationale: Dans ce contexte visionnaire, « je regardai » exprime naturellement l’acte de porter le regard, sans alourdir la phrase.
- source_word: ecce
  choice: et voici
  rationale: Conserve le marqueur visionnaire et l’effet de mise en relief du latin.
- source_word: multitudo hominum, quorum non erat numerus
  choice: une multitude innombrable d’hommes
  rationale: Rend idiomatiquement l’idée d’une foule dont le nombre ne pouvait être compté.
- source_word: de quattuor ventis caeli
  choice: venant des quatre vents du ciel
  rationale: Préserve l’image cosmologique traditionnelle tout en explicitant naturellement le rapport avec le rassemblement.
- source_word: debellarent
  choice: faire la guerre à
  rationale: Exprime l’hostilité militaire visée ici sans imposer l’idée plus précise de vaincre ou d’anéantir.
- source_word: ascenderat de mari
  choice: était monté de la mer
  rationale: Préserve le mouvement ascendant et la provenance maritime du texte latin.
theological_decisions:
- issue: Identification de l’homme monté de la mer
  choice: Conserver la désignation « l’homme » sans identification interprétative
  alternative: Employer un titre messianique ou préciser son identité
  rationale: Le verset le désigne seulement comme « l’homme » ; une identification explicite dépasserait le texte source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure visionnaire « je regardai, et voici » et l’image des « quatre vents du ciel » sont conservées en raison de leur portée littéraire et apocalyptique.
