  text: dereliquisti enim tua et circa mea vacasti et legem meam exquisisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/054.yaml
  text: For you have forsaken what belongs to you and have devoted yourself to what belongs to me, and have searched out my law.
translation:
  language: fr
  text: Car tu as délaissé ce qui t’appartient, tu t’es consacré à ce qui m’appartient et tu as cherché à connaître ma loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquisti
  choice: tu as délaissé
  rationale: Rend l’idée d’abandonner ou de laisser de côté, dans un français naturel et digne.
- source_word: tua
  choice: ce qui t’appartient
  rationale: Le neutre pluriel substantivé désigne les choses ou affaires propres au destinataire sans en préciser la nature.
- source_word: circa mea vacasti
  choice: tu t’es consacré à ce qui m’appartient
  rationale: L’expression latine indique que le destinataire s’est rendu disponible pour les affaires du locuteur et s’y est appliqué; « consacré » exprime cette attention soutenue sans préciser indûment son contenu.
- source_word: legem meam exquisisti
  choice: tu as cherché à connaître ma loi
  rationale: Exquiro implique une recherche attentive ou approfondie; l’ajout de « à connaître » explicite naturellement en français l’objet de cette démarche sans réduire la loi à une simple recherche matérielle.
theological_decisions:
- issue: Nature de « ce qui m’appartient »
  choice: Conserver une formulation générale
  alternative: « mes affaires » ou « mon œuvre »
  rationale: Le latin mea reste indéterminé; préciser « œuvre » introduirait une interprétation absente du texte.
- issue: Portée de la recherche de la loi
  choice: « cherché à connaître ma loi »
  alternative: « approfondi ma loi » ou « scruté ma loi »
  rationale: Cette formulation conserve l’idée d’une recherche assidue tout en évitant de décider si elle est principalement intellectuelle, spirituelle ou pratique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des trois verbes est conservé, ainsi que l’opposition entre ce qui appartient au destinataire et ce qui appartient au locuteur.
