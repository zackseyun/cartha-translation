  text: And after this I looked, and behold, all those who had gathered against him to attack him were greatly afraid, yet they still dared to fight.
translation:
  language: fr
  text: 'Après cela, je regardai, et voici : tous ceux qui s’étaient rassemblés contre lui pour l’attaquer étaient saisis d’une grande peur ; pourtant, ils osaient combattre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et post haec vidi
  choice: Après cela, je regardai
  rationale: Rend naturellement la succession de la vision tout en conservant le sens visuel de « vidi ».
- source_word: ecce
  choice: et voici
  rationale: Conserve le marqueur de mise en relief propre au récit visionnaire.
- source_word: ut expugnarent eum
  choice: pour l’attaquer
  rationale: « Expugnare » peut évoquer l’assaut ou la conquête ; avec une personne comme objet, « attaquer » est ici naturel et suffisamment large.
- source_word: timebant valde
  choice: étaient saisis d’une grande peur
  rationale: Exprime avec force l’intensité de « valde » dans un français actuel et digne.
- source_word: tamen audebant pugnare
  choice: pourtant, ils osaient combattre
  rationale: Préserve la tension du latin entre leur grande peur et leur audace persistante.
