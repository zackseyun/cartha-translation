id: 2ES.13.52
reference: 2 Esdras 13:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut non potest hoc vel scrutinare vel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram videre Filium meum vel eos qui cum eo sunt nisi in tempore diei.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: fr
  text: De même que personne ne peut sonder ni savoir ce qui se trouve dans les profondeurs de la mer, de même personne sur la terre ne pourra voir mon Fils ni ceux qui sont avec lui, si ce n’est au temps de ce jour-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinare
  choice: sonder
  rationale: « Sonder » rend l’idée d’examiner ou d’explorer une profondeur inaccessible et convient naturellement à l’image de la mer.
- source_word: in profundo maris
  choice: dans les profondeurs de la mer
  rationale: Le pluriel idiomatique français exprime naturellement le profond de la mer sans modifier le sens.
- source_word: Filium meum
  choice: mon Fils
  rationale: Traduction directe, avec majuscule pour le titre référant à la figure messianique désignée par le locuteur.
- source_word: in tempore diei
  choice: au temps de ce jour-là
  rationale: Cette formulation conserve la référence quelque peu inhabituelle mais eschatologiquement chargée au jour déterminé, sans la transformer en « son jour ».
theological_decisions:
- issue: Moment où le Fils et ses compagnons deviennent visibles
  choice: si ce n’est au temps de ce jour-là
  alternative: jusqu’au jour fixé
  rationale: La traduction retenue suit la construction exceptive latine nisi et préserve l’expression temporelle du texte sans expliciter davantage la nature du jour.
translation_notes:
  register: Français moderne, digne et accessible. Le verset est rendu comme la continuation directe du discours attesté par le latin; la formule « Et il me dit », présente dans la couche anglaise, n’a pas été ajoutée puisqu’elle ne figure pas dans la source latine fournie.
