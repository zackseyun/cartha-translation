  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
translation:
  language: fr
  text: Voici l’interprétation du rêve que tu as vu, et pourquoi toi seul as été éclairé au sujet de ces choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interpretatio
  choice: interprétation
  rationale: Équivalent direct et naturel dans le contexte de l’explication d’un rêve.
- source_word: inluminatus es
  choice: as été éclairé
  rationale: Conserve l’image latine de l’illumination tout en exprimant naturellement la réception d’une compréhension révélée.
- source_word: haec solus
  choice: toi seul… au sujet de ces choses
  rationale: Le latin nettoyé est légèrement comprimé; cette formulation rattache «ces choses» à l’illumination et maintient l’accent sur le destinataire unique.
theological_decisions:
- issue: Nature de l’illumination
  choice: «as été éclairé»
  alternative: «as reçu la lumière» ou «as reçu l’intelligence»
  rationale: La formulation retenue préserve la métaphore théologique sans préciser davantage si l’illumination désigne une révélation, une compréhension ou les deux.
translation_notes:
  register: Français international moderne, simple et digne. Tutoiement conservé pour l’adresse directe. Aucune note reprise de la couche anglaise, car sa note [53] ne correspond pas au texte latin de ce verset et semble provenir d’un autre contexte.
