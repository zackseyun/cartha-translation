base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/032.yaml
  text: nation against nation[a], and kingdom against kingdom. And it shall be, when these things happen, and the signs occur that I showed you before, then
translation:
  language: fr
  text: nation contre nation[a], et royaume contre royaume. Et il arrivera que, lorsque ces choses se produiront et que surviendront les signes que je t’ai montrés auparavant, alors
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peuple contre peuple ».
    reason: « Gens » peut désigner un peuple aussi bien qu’une nation; la note préserve cette possibilité lexicale.
lexical_decisions:
- source_word: gens ad gentem
  choice: nation contre nation
  rationale: « Gens » désigne ici un peuple constitué ou une nation; cette formulation conserve le registre apocalyptique et le parallélisme avec « royaume contre royaume ».
- source_word: regnum aduersus regnum
  choice: royaume contre royaume
  rationale: Rend directement le parallélisme latin et l’opposition exprimée par « adversus ».
- source_word: contingent signa
  choice: se produiront les signes
  rationale: Formulation française naturelle qui garde l’idée que les signes annoncés surviendront.
- source_word: quae ante ostendi tibi
  choice: que je t’ai montrés auparavant
  rationale: Traduction directe, avec l’antériorité explicitement portée par « ante ».
theological_decisions:
- issue: Valeur de « gens » dans la formule apocalyptique
  choice: nation
  alternative: peuple
  rationale: « Nation » correspond au sens collectif de « gens », s’accorde au registre apocalyptique traditionnel et évite de réduire l’expression à un conflit entre simples groupes de personnes.
- issue: Phrase syntaxiquement inachevée à la fin du verset
  choice: conserver « alors » en suspens
  alternative: compléter la proposition à partir du verset suivant
  rationale: Le texte source se termine par « et tunc »; conserver cette suspension respecte la division transmise et n’anticipe pas le contenu du verset suivant.
translation_notes:
  register: Français moderne, clair et digne. Le balancement apocalyptique est conservé, ainsi que la suspension finale du texte latin.
