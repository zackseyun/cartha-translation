  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: fr
  text: Car alors le Très-Haut accomplit des signes et arrêta les cours du fleuve jusqu’à ce qu’ils aient traversé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin usuel qui rend directement le superlatif latin et conserve sa dignité.
- source_word: signa
  choice: des signes
  rationale: Rend le terme latin sans le préciser en « miracles », afin d’en préserver l’étendue sémantique.
- source_word: statuit uenas fluminis
  choice: arrêta les cours du fleuve
  rationale: « Arrêta » exprime ici l’interruption voulue, tandis que « les cours du fleuve » restitue naturellement l’image des veines ou chenaux du fleuve.
- source_word: usquequo transirent
  choice: jusqu’à ce qu’ils aient traversé
  rationale: Exprime la limite temporelle de l’action et le franchissement accompli, avec un sujet pluriel implicite comme en latin.
theological_decisions:
- issue: Nature des signa accomplis par le Très-Haut
  choice: signes
  alternative: miracles
  rationale: Le latin dit simplement « signa » ; la traduction ne précise donc pas davantage leur nature.
- issue: Bénéficiaires des signes
  choice: aucun complément ajouté
  alternative: accomplit des signes pour eux
  rationale: Le latin transmis ne comporte pas de complément équivalent à « pour eux ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le titre divin traditionnel et l’image hydrologique du latin sans ajout interprétatif.
