  text: propter hoc vae, viderunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
translation:
  language: fr
  text: C’est pourquoi, malheur ! Car ils ont vu de grands dangers et bien des détresses[a], comme le montrent ces rêves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « bien des épreuves contraignantes ». Certains comprennent aussi le parfait latin dans un sens prophétique : « ils verront de grands dangers et bien des détresses ».'
    reason: Signaler l’étendue de sens de necessitates et l’ambiguïté contextuelle du temps verbal sans modifier le texte principal.
lexical_decisions:
- source_word: propter hoc vae
  choice: C’est pourquoi, malheur !
  rationale: Rend directement le lien causal et l’exclamation du latin, sans ajouter un destinataire qui n’est pas exprimé dans le texte fourni.
- source_word: viderunt
  choice: ils ont vu
  rationale: Respecte le parfait latin. Le contexte peut inviter à comprendre une vision anticipée, mais le futur n’est pas grammaticalement explicite dans cette forme.
- source_word: pericula magna
  choice: de grands dangers
  rationale: Équivalent français naturel et précis.
- source_word: necessitates multas
  choice: bien des détresses
  rationale: Dans ce contexte de malheur et de dangers, necessitates désigne des situations pressantes ou pénibles plutôt que de simples nécessités.
- source_word: sicut ostendunt somnia haec
  choice: comme le montrent ces rêves
  rationale: Conserve le pluriel somnia et le présent ostendunt dans un français fluide.
theological_decisions:
- issue: Destinataire du malheur
  choice: Ne pas ajouter « ceux qui restent » dans le corps du verset
  alternative: « Quant à ceux qui restent, malheur à eux pour cette raison ! »
  rationale: La proposition latine fournie ne contient aucun équivalent de « ceux qui restent ». L’ajout peut venir du contexte ou d’un autre témoin, mais il ne doit pas être présenté comme explicitement attesté ici.
- issue: Valeur temporelle de viderunt
  choice: Traduire par le passé composé « ils ont vu »
  alternative: « ils verront »
  rationale: Le parfait latin est maintenu afin de ne pas résoudre silencieusement une possible tension entre la forme grammaticale et la portée prophétique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la brièveté saisissante de l’exclamation latine. Le marqueur [a] figure bien dans le texte principal.
