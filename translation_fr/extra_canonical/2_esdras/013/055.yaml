source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vitam enim tuam disposuisti in sapientiam, et sensum tuum vocasti matrem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/055.yaml
  text: For you have ordered your life in wisdom, and have called understanding your mother.
translation:
  language: fr
  text: Car tu as réglé ta vie selon la sagesse, et tu as appelé l’intelligence ta mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: disposuisti
  choice: as réglé
  rationale: Rend l’idée d’ordonner ou d’organiser sa manière de vivre, tout en restant naturel en français moderne.
- source_word: in sapientiam
  choice: selon la sagesse
  rationale: Le latin exprime une orientation ou une conformité à la sagesse; «selon» communique ce rapport plus naturellement que le calque «dans la sagesse».
- source_word: sensum
  choice: l’intelligence
  rationale: Dans ce contexte sapientiel, sensus désigne la faculté de comprendre ou le discernement; «intelligence» correspond aussi à la formulation personnifiée du verset.
- source_word: matrem
  choice: ta mère
  rationale: Conserve sans atténuation l’image familiale et la personnification du texte latin.
theological_decisions:
- issue: Personnification de l’intelligence comme mère
  choice: Conserver littéralement «tu as appelé l’intelligence ta mère»
  alternative: Interpréter l’intelligence comme une simple source de formation ou de conseil
  rationale: Le latin formule explicitement cette relation maternelle; la traduction préserve l’image et sa tension sapientielle sans l’expliquer doctrinalement.
translation_notes:
  register: Français moderne, clair et digne. La structure en deux propositions parallèles est conservée, avec une légère adaptation idiomatique de «in sapientiam» en «selon la sagesse».
