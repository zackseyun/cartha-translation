source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
translation:
  language: fr
  text: 'Je regardai, et voici : cet homme volait avec les nuées du ciel. Chaque fois qu’il tournait le visage pour regarder, tout ce qui apparaissait au-dessous de lui[a] tremblait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin porte littéralement « au-dessous de lui ». D’autres versions anciennes peuvent être comprises comme disant « tout ce qui était vu par lui » ou « tout ce qui se trouvait sous son regard ».
    reason: Signaler l’ambiguïté entre la formulation spatiale du latin transmis et une possible lecture d’agent attestée par la tradition ancienne.
lexical_decisions:
- source_word: convolabat
  choice: volait
  rationale: Rend directement le mouvement aérien exprimé par le verbe latin, dans un français naturel.
- source_word: cum nubibus caeli
  choice: avec les nuées du ciel
  rationale: Conserve la préposition « avec » et le registre visionnaire traditionnel de « nuées » sans transformer la relation en simple localisation.
- source_word: ut consideraret
  choice: pour regarder
  rationale: Exprime le but du mouvement du visage en français courant, tout en gardant l’idée d’une observation attentive.
- source_word: tremebant
  choice: tremblait
  rationale: Le sujet français est le collectif singulier « tout ce qui » ; l’imparfait correspond à la scène visionnaire et à l’action répétée.
theological_decisions:
- issue: Sens de « sub eo » avec le passif « videbantur »
  choice: au-dessous de lui
  alternative: par lui / sous son regard
  rationale: Le texte latin transmis signifie le plus naturellement « au-dessous de lui ». Une lecture d’agent, probablement liée à l’arrière-plan grec et soutenue par d’autres versions anciennes, reste toutefois possible et est signalée en note afin de ne pas effacer l’ambiguïté textuelle.
translation_notes:
  register: Français moderne, clair et digne, avec « nuées » pour maintenir le registre apocalyptique. La syntaxe reste proche du latin sans reproduire ses tournures de manière artificielle.
