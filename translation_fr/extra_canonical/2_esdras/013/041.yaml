id: 2ES.13.41
reference: 2 Esdras 13:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: consilium hoc, ut derelinquerent multitudinem gentium, et proficiscerentur in ulteriorem regionem, ubi nunquam inhabitauit genus humanum, Vt uel ibi obseruarent legitima sua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: fr
  text: 'Mais ils formèrent ce projet : quitter la multitude des nations et partir vers une région plus lointaine, où le genre humain n’avait jamais habité, afin d’y observer au moins leurs prescriptions.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: consilium hoc
  choice: ce projet
  rationale: Rend naturellement l’idée d’un dessein délibéré sans ajouter le sens réfléchi « entre eux », absent du latin fourni.
- source_word: multitudinem gentium
  choice: la multitude des nations
  rationale: Conserve la formulation collective et le sens de gentes, plutôt que de réduire l’expression à « les peuples ».
- source_word: ulteriorem regionem
  choice: une région plus lointaine
  rationale: Reproduit le comparatif ulteriorem et l’idée d’un territoire éloigné.
- source_word: genus humanum
  choice: le genre humain
  rationale: Équivalent formel et idiomatique désignant l’humanité.
- source_word: legitima sua
  choice: leurs prescriptions
  rationale: Désigne des règles ou ordonnances qui leur sont propres; « prescriptions » évite de préciser indûment s’il s’agit de lois, statuts ou rites.
theological_decisions:
- issue: Portée de « uel » dans « Vt uel ibi »
  choice: afin de pouvoir au moins y observer
  alternative: afin d’y observer
  rationale: Le latin uel est conservé par « au moins », qui exprime vraisemblablement l’idée qu’ils pourraient les observer là, à défaut de pouvoir le faire ailleurs; « pouvoir » rend la nuance potentielle du subjonctif dans cette proposition finale.
translation_notes:
  register: Français moderne, digne et lisible. La structure finale du latin est conservée, avec une ponctuation française naturelle et sans ajout confessionnel.
