  text: et ubicumque exiebat vox de ore eius, ardescebant omnes qui audiebant voces eius. sicut liquescit cera quando senserit ignem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
translation:
  language: fr
  text: Et partout où une voix sortait de sa bouche[a], tous ceux qui entendaient ses paroles se mettaient à brûler[b], comme la cire fond lorsqu’elle sent le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la voix ».'
    reason: Le latin ne possède pas d’article ; le contexte peut présenter cette voix comme déterminée.
  - marker: b
    text: 'Ou : « prenaient feu ».'
    reason: Cette variante rend également la valeur inchoative et active de « ardescebant ».
lexical_decisions:
- source_word: ubicumque
  choice: partout où
  rationale: Rend naturellement la portée distributive du latin dans ce contexte.
- source_word: vox
  choice: une voix
  rationale: Le latin est sans article; « une voix » préserve cette indétermination formelle sans exclure qu’il s’agisse, en contexte, de sa propre voix.
- source_word: ardescebant
  choice: se mettaient à brûler
  rationale: L’imparfait actif inchoatif de « ardesco » exprime l’entrée dans l’état de combustion.
- source_word: senserit
  choice: sent
  rationale: La personnification de la cire est conservée, de même que la formulation concrète du latin.
theological_decisions:
- issue: Nature de la voix sortant de sa bouche
  choice: une voix
  alternative: la voix
  rationale: Le latin « vox » n’a pas d’article et peut désigner une émission de voix; la traduction ne tranche pas davantage que la source, même si le contexte permet une lecture définie.
- issue: Effet produit sur ceux qui entendent
  choice: se mettaient à brûler
  alternative: étaient embrasés
  rationale: La forme latine est active et inchoative, non passive; cette traduction évite d’ajouter un agent implicite.
translation_notes:
  register: Français moderne, courant et digne. La répétition de « voix » et la personnification de la cire sont maintenues afin de rester proches de la formulation latine.
