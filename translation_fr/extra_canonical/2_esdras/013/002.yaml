  yaml_path: translation/extra_canonical/2_esdras/013/002.yaml
  text: And behold[a], a wind arose from the sea to stir up all its waves.
translation:
  language: fr
  text: Et voici[a] qu’un vent s’éleva de la mer et en agita toutes les vagues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et voici, un vent s’élevait de la mer pour en bouleverser toutes les vagues. »'
    reason: Signale la valeur plus progressive de l’imparfait latin exsurgebat et la construction finale ou consécutive possible de ut conturbaret.
lexical_decisions:
- source_word: et ecce
  choice: Et voici
  rationale: Rend naturellement la formule de présentation latine tout en conservant son effet soudain et visionnaire.
- source_word: de mari
  choice: de la mer
  rationale: 'Conserve le sens spatial du latin : le vent prend naissance ou s’élève depuis la mer.'
- source_word: ventus exsurgebat
  choice: un vent s’éleva
  rationale: Le passé simple convient au récit visionnaire et exprime l’apparition du vent, sans alourdir la phrase par une forme progressive.
- source_word: ut conturbaret
  choice: et en agita
  rationale: Dans ce contexte, ut décrit l’effet ou l’aboutissement du vent. « Agiter » rend clairement conturbare appliqué aux vagues, sans suggérer nécessairement une intention.
- source_word: omnes fluctus eius
  choice: toutes les vagues
  rationale: Le possessif latin renvoie sans ambiguïté à la mer; le pronom « en » maintient ce lien en français tout en évitant la tournure moins naturelle « toutes ses vagues ».
theological_decisions:
- issue: Lacune textuelle proposée après cette phrase
  choice: Ne traduire que le texte latin fourni pour 13.2
  alternative: Ajouter la présentation de la figure humaine attestée dans certaines versions anciennes
  rationale: L’unité demandée et le texte source fourni s’arrêtent après « omnes fluctus eius ». L’ajout appartient à une question de délimitation ou de reconstruction textuelle qui ne doit pas être introduite silencieusement dans ce verset.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le caractère soudain de la vision et la provenance maritime du vent, avec une syntaxe naturelle.
