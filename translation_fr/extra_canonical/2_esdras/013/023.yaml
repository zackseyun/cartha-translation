source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui adferet periculum in illo tempore, ipse custodibit qui in periculo inciderint, qui habent operas et fidem ad Fortissimum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/023.yaml
  text: he who brings the danger at that time will himself protect those who fall into danger[a], those who have works and faith toward the Most Mighty.
translation:
  language: fr
  text: Celui qui fera venir le danger en ce temps-là protégera lui-même ceux qui tomberont dans le danger, ceux qui ont des œuvres et de la foi envers le Très-Puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui adferet periculum
  choice: Celui qui fera venir le danger
  rationale: Rend directement la proposition relative et le sens causatif de adferet, sans atténuer la tension selon laquelle le même sujet fait venir le danger et protège.
- source_word: custodibit
  choice: protégera
  rationale: Dans ce contexte de péril, le futur de custodire signifie garder en sûreté, d’où le français naturel « protégera ».
- source_word: qui habent operas et fidem
  choice: ceux qui ont des œuvres et la foi
  rationale: Préserve la coordination explicite de operas et fidem ainsi que la formulation théologiquement ouverte du latin.
- source_word: ad Fortissimum
  choice: envers le Très-Puissant
  rationale: Fortissimum est le superlatif substantivé employé comme titre divin; « Très-Puissant » en conserve la force superlative, et ad indique ici l’orientation envers lui.
theological_decisions:
- issue: Le même sujet fait venir le danger puis protège ceux qui y tombent
  choice: Conserver explicitement cette tension
  alternative: Reformuler le premier membre comme une simple venue du personnage au temps du danger
  rationale: Le latin attribue bien au sujet les deux actions par adferet et custodibit; les identifier sans les harmoniser respecte le texte source.
- issue: Rapport entre les œuvres et la foi
  choice: « des œuvres et la foi »
  alternative: « une foi agissante » ou « des œuvres de foi »
  rationale: Le latin coordonne deux substantifs distincts; les fusionner imposerait une interprétation absente du texte.
- issue: Titre divin Fortissimus
  choice: « le Très-Puissant »
  alternative: « le Puissant »
  rationale: Le superlatif latin doit rester perceptible dans le titre français.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la répétition de « danger », qui reflète periculum… in periculo, ainsi que l’ambiguïté théologique du passage. Aucun marqueur de note n’est nécessaire.
