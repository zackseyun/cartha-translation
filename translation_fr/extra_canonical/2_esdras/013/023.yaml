  source_fidelity: 'Le texte rend correctement la structure du latin : le même sujet « fera venir le danger » et « protégera »; le futur est conservé, de même que la répétition periculum / in periculo. « Très-Puissant » restitue bien la valeur superlative et le statut de titre divin de Fortissimum. « Tomberont dans le danger » est une restitution recevable de qui in periculo inciderint dans cette séquence future.'
