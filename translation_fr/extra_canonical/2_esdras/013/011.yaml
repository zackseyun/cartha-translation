source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multitudo tempestatis. Et concidit super multitudinis impetum quod paratum erat pugnare, et succendit omnes, ut subito nihil uideretur de innumerabili multitudine nisi solummodo puluis cineris et fumi odor. et uidi et extiti. Et post haec uidi ipsum hominem descendentem de monte et aduocantem ad se multitudinem aliam pacificam. Et accedebant ad eum uultus hominum multorum, quorundam gaudentium, quorundam tristantium, aliqui uero alligati, aliqui adducentes ex eis qui offerebantur. et ego a multitudine pauoris expergefactus sum et deprecatus sum altissimum et dixi : Tu ab initio demonstrasti seruo tuo mirabilia haec, et dignum me habuisti ut susciperes deprecationem meam; Et nunc demonstra mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/011.yaml
  text: And all these were mixed together—the wave of fire, the breath of flame, and the great storm—and it fell upon the assault of the multitude that had prepared to fight, and burned them all up, so that suddenly nothing could be seen of the innumerable multitude except only the dust of ashes and the smell of smoke. And I saw it and was astonished.
translation:
  language: fr
  text: Tout cela se mêla — la vague de feu, le souffle de flamme et la grande tempête — puis s’abattit sur l’assaut de la multitude qui s’était préparée à combattre, et les brûla tous. Soudain, de cette multitude innombrable, il ne resta plus rien de visible, si ce n’est de la poussière de cendres et une odeur de fumée. Je vis cela et je restai stupéfait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudo tempestatis
  choice: la violence de la tempête
  rationale: Dans ce fragment latin, « multitudo » exprime l’ampleur ou la puissance de la tempête plutôt qu’une multitude dénombrable.
- source_word: multitudinis impetum
  choice: la multitude qui s’était élancée à l’assaut
  rationale: Rend à la fois le groupe désigné par « multitudinis » et l’idée d’attaque impétueuse portée par « impetum », dans un français naturel.
- source_word: puluis cineris
  choice: de la poussière de cendre
  rationale: Conserve l’image concrète du latin, plus précise que le simple mot « cendres ».
- source_word: fumi odor
  choice: une odeur de fumée
  rationale: Traduction directe et idiomatique.
- source_word: extiti
  choice: je restai stupéfait
  rationale: Dans ce contexte visionnaire, le verbe décrit la réaction saisie du voyant; cette formulation suit le sens attesté par la couche de consultation tout en restant naturelle en français.
theological_decisions:
- issue: Nature de la destruction de la multitude
  choice: les brûla tous
  alternative: la consuma tout entière
  rationale: Le latin « succendit omnes » désigne explicitement toutes les personnes de la multitude, sans ajouter d’interprétation sur leur destinée au-delà de la scène visionnaire.
- issue: Rapport entre les trois phénomènes
  choice: Tout cela se mêla
  alternative: Tout cela fut mêlé ensemble
  rationale: La voix active française exprime naturellement leur réunion sans préciser une cause ou un agent que le texte ne nomme pas.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme conserve l’intensité de la vision et ses images matérielles sans archaïsmes inutiles. Aucun marqueur de note n’est requis.
