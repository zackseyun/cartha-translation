revisions:
- from: Tout cela se mêla — la vague de feu, le souffle de flamme et la violence de la tempête — puis s’abattit sur la multitude qui s’était élancée à l’assaut, prête à combattre, et les brûla tous. Soudain, de cette multitude innombrable, il ne resta plus rien de visible, si ce n’est de la poussière de cendre et une odeur de fumée. Je vis cela et je restai stupéfait.
  to: Tout cela se mêla — la vague de feu, le souffle de flamme et la grande tempête — puis s’abattit sur l’assaut de la multitude qui s’était préparée à combattre, et les brûla tous. Soudain, de cette multitude innombrable, il ne resta plus rien de visible, si ce n’est de la poussière de cendres et une odeur de fumée. Je vis cela et je restai stupéfait.
  rationale: 'Deux ajustements limités améliorent la fidélité au latin sans modifier le sens de la vision : multitudo tempestatis est rendu sans ajout interprétatif par « la grande tempête », et multitudinis impetum est conservé comme « l’assaut de la multitude ». Aucune note n’est nécessaire pour ce verset.'
