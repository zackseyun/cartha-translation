  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: fr
  text: Mais il se tiendra au sommet du mont Sion. Et Sion viendra et sera montrée à tous, préparée et bâtie, comme tu as vu une montagne être taillée sans mains humaines.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cacumen montis Sion
  choice: au sommet du mont Sion
  rationale: Rend directement le relief et la localisation exprimés par le latin, dans une formulation française naturelle.
- source_word: ueniet
  choice: viendra
  rationale: Conserve le mouvement surprenant attribué à Sion, sans le réduire à une simple apparition.
- source_word: ostendetur omnibus
  choice: sera montrée à tous
  rationale: Préserve la valeur passive de « ostendetur » et la portée universelle de « omnibus ».
- source_word: parata et aedificata
  choice: prête et bâtie
  rationale: 'Maintient les deux participes et leur distinction : Sion est à la fois préparée et construite.'
- source_word: sculpi sine manibus
  choice: se tailler sans mains humaines
  rationale: « Se tailler » rend le passif latin avec naturel, tandis que « sans mains humaines » conserve l'image biblique d'une œuvre non réalisée par des humains.
theological_decisions:
- issue: Le mouvement et la manifestation de Sion
  choice: Sion « viendra et sera montrée à tous »
  alternative: Sion « apparaîtra à tous »
  rationale: La traduction retenue conserve séparément les deux verbes latins et évite de résoudre leur tension en une seule idée d'apparition.
- issue: L'origine surnaturelle de la montagne
  choice: « sans mains humaines »
  alternative: « sans intervention humaine »
  rationale: La formulation choisie garde l'image concrète du texte et son écho scripturaire, sans préciser davantage la nature de l'agent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve volontairement l'étrangeté de Sion qui « viendra », ainsi que l'image concrète de la montagne taillée sans mains humaines.
