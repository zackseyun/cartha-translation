source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: terra sua in diebus Iosiae regis, quem captiuum duxit Salmanassar rex Assyriorum, et transtulit eos trans flumen, et translati sunt in terram aliam. Ipsi autem sibi dederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/040.yaml
  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
translation:
  language: fr
  text: Ce sont les dix tribus qui furent emmenées captives loin de leur pays, à l’époque du roi Osée[a], que Salmanasar, roi des Assyriens, fit prisonnier. Il les transporta au-delà du Fleuve[b], et elles furent transférées dans un autre pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin porte ici «Josias»; les anciennes versions syriaque, éthiopienne et arabe ont «Osée», nom qui correspond aussi au contexte de l’exil assyrien des tribus du Nord.
    reason: textual_variant
  - marker: b
    text: C’est-à-dire l’Euphrate.
    reason: historical_context
lexical_decisions:
- source_word: terra sua
  choice: leur pays
  rationale: Rend naturellement le possessif latin tout en conservant l’idée de la terre propre aux tribus.
- source_word: captiuum duxit
  choice: fit prisonnier
  rationale: Le singulier masculin renvoie grammaticalement au roi nommé; cette formulation distingue sa captivité de celle des tribus.
- source_word: transtulit eos trans flumen
  choice: Il les transporta au-delà du Fleuve
  rationale: Conserve le mouvement imposé et traite «le Fleuve» comme la désignation traditionnelle de l’Euphrate, sans l’insérer explicitement dans le texte.
- source_word: translati sunt in terram aliam
  choice: elles furent transférées dans un autre pays
  rationale: Préserve le passif latin et la répétition de la racine de «transtulit», avec un français intelligible.
theological_decisions:
- issue: Nom du roi dans une tradition latine manifestement corrompue
  choice: Osée dans le texte principal
  alternative: Josias, lecture du latin «Iosiae»
  rationale: Le contexte concerne l’exil assyrien des tribus du Nord; Osée est en outre attesté par les anciennes versions syriaque, éthiopienne et arabe. La leçon latine est signalée plutôt que corrigée sans transparence.
- issue: Référent de «quem»
  choice: Le pronom relatif renvoie au roi Osée
  alternative: Reformuler comme si Salmanasar avait emmené les dix tribus captives dans cette proposition
  rationale: Le masculin singulier latin renvoie grammaticalement au nom du roi, tandis que les tribus sont ensuite reprises par le pluriel «eos».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe distingue clairement l’emprisonnement du roi et la déportation des tribus. Le début de la phrase, nécessaire au sens du verset, suit le contexte immédiatement antérieur; les mots «Ipsi autem sibi dederunt» ouvrent la suite et ne sont donc pas inclus ici.
