  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: fr
  text: Un égarement de l’esprit viendra sur ceux qui habitent la terre. Et les uns projeteront de faire la guerre aux autres, ville contre ville et lieu contre lieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excessus mentis
  choice: la confusion s’emparera de l’esprit
  rationale: L’expression latine évoque un esprit qui sort de son état normal, donc le désarroi ou l’égarement. Cette formulation naturelle conserve l’idée d’un trouble mental profond sans imposer un diagnostic précis.
- source_word: cogitabunt bellare
  choice: ils projetteront de se faire la guerre
  rationale: « Cogitare » exprime ici l’intention ou le dessein, tandis que « bellare » signifie faire la guerre.
- source_word: locus locum
  choice: région contre région
  rationale: Dans cette série de conflits collectifs, « région » rend plus naturellement le sens territorial de « locus » que le mot français « lieu ».
