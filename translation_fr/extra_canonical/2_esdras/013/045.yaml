  text: For through that region there was a long way to travel, of a year and a half; and that region is called Arzareth.
translation:
  language: fr
  text: Car le trajet à travers cette région durait un an et demi, et cette région est appelée Arzareth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimidii
  choice: et demi
  rationale: Conserve la fin de l’expression de durée « un an et demi », attestée par le contexte textuel immédiat consulté, bien que l’extrait latin fourni commence au dernier mot de cette expression.
- source_word: regio illa
  choice: cette région
  rationale: Rend directement le démonstratif latin et maintient le lien avec la région déjà mentionnée.
- source_word: uocatur Arzareth
  choice: appelée Arzareth
  rationale: Restitue naturellement le passif latin « est appelée » sans franciser le nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation resserrée évite de reproduire lourdement « cette région » tout en conservant le sens causal introduit par « nam ». Les mots « Tunc inhabitauerunt ibi » semblent ouvrir la phrase ou le verset suivant et ne sont donc pas intégrés à 13.45.
