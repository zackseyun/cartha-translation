  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
translation:
  language: fr
  text: et parce qu’il gouverne les temps et les choses qui arrivent au cours des temps[a]. Je restai assis là pendant trois jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une traduction antérieure : « Et je partis et allai dans la campagne, glorifiant et louant grandement le Très-Haut pour les merveilles qu’il accomplissait en leurs temps, et parce qu’il gouverne les temps et les choses qui arrivent au cours des temps. Je restai assis là pendant trois jours. »'
    reason: Note d’audit préservant le rendu antérieur, qui incluait par erreur du contenu du verset précédent ; elle ne constitue pas une variante du texte source de ce verset.
lexical_decisions:
- source_word: gubernat tempora
  choice: il gouverne les temps
  rationale: « Gouverner » conserve l’image du latin gubernare et exprime clairement l’autorité exercée sur le déroulement des temps.
- source_word: quae sunt in temporibus inlata
  choice: ce qui advient au cours des temps
  rationale: Cette formulation française naturelle rend le passif inlata comme les réalités qui sont amenées à se produire dans les temps, sans préciser davantage leur cause.
- source_word: sedi ibi
  choice: je restai assis là
  rationale: Le parfait latin sedi peut décrire le fait de s’asseoir ou de demeurer assis ; avec une durée de trois jours, « restai assis » convient au contexte.
theological_decisions:
- issue: Étendue de la souveraineté divine sur l’histoire
  choice: « il gouverne les temps et ce qui advient au cours des temps »
  alternative: « il gouverne les temps et produit les événements qui s’y déroulent »
  rationale: Le choix retenu affirme le gouvernement divin exprimé par le texte tout en évitant d’ajouter une causalité directe plus explicite que le passif latin inlata.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase commence par « et parce que », conformément au caractère syntaxiquement continu du verset latin et sans réintroduire le contenu du verset précédent.
