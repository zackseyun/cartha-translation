source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multiplicabitur iniustitia super hanc quam ipse tu vides et super quam audisti olim.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/002.yaml
  text: And unrighteousness will be multiplied beyond what you yourself see, and beyond what you heard long ago.
translation:
  language: fr
  text: Et l’injustice se multipliera au-delà de ce que tu vois toi-même et de ce dont tu as entendu parler autrefois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniustitia
  choice: l’injustice
  rationale: Rend directement le nom latin et conserve sa portée morale générale sans lui imposer un sens doctrinal plus étroit.
- source_word: multiplicabitur
  choice: se multipliera
  rationale: Reproduit naturellement en français le futur passif latin sous une forme pronominale idiomatique.
- source_word: super
  choice: au-delà de
  rationale: Exprime la comparaison de degré ou d’ampleur présente dans les deux emplois de « super ».
- source_word: audisti olim
  choice: tu as entendu parler autrefois
  rationale: « Entendre parler » convient à un mal connu par des récits antérieurs, tandis que « autrefois » restitue « olim » sans ajouter « il y a longtemps » de façon plus précise que la source.
theological_decisions:
- issue: Portée de l’accroissement de l’injustice
  choice: Conserver une comparaison ouverte avec ce qui est vu et ce qui a été rapporté auparavant
  alternative: Préciser que l’injustice future sera quantitativement plus grande que tous les exemples passés et présents
  rationale: Le latin affirme un dépassement, mais ne définit ni sa mesure ni sa nature exacte; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement est conservé conformément au singulier latin « tu ». L’insistance de « ipse tu » est rendue par « tu vois toi-même ».
