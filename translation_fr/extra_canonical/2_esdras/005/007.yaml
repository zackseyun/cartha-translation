  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
translation:
  language: fr
  text: Et la mer de Sodome rejettera des poissons[a] et, de nuit, elle émettra un son que beaucoup n’ont jamais entendu[b], mais tous l’entendront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « mer de Sodome » désigne probablement la mer Morte ; la traduction conserve toutefois la désignation allusive du latin.
    reason: cultural_note
  - marker: b
    text: Littéralement, « elle donnera une voix que beaucoup n’ont pas connue ». Pour un son, « n’ont jamais entendu » rend naturellement le verbe latin « ont connu ».
    reason: translation_note
lexical_decisions:
- source_word: mare Sodomiticum
  choice: la mer de Sodome
  rationale: Cette formulation conserve l’allusion géographique du latin tout en évitant « mer sodomitique », qui évoquerait en français moderne un comportement plutôt qu’un lieu.
- source_word: pisces reiciet
  choice: rejettera des poissons
  rationale: « Rejettera » rend directement le mouvement exprimé par reiciet, comme si la mer expulsait ou lançait des poissons hors d’elle.
- source_word: dabit uocem
  choice: émettra un son
  rationale: Cette expression française naturelle restitue l’idée de produire un phénomène audible sans personnifier excessivement la mer.
- source_word: quam non nouerunt multi
  choice: que beaucoup n’ont jamais entendu
  rationale: Pour un son, « entendre » exprime naturellement l’expérience visée par nouerunt; « jamais » rend ici la portée du parfait dans ce contexte prodigieux.
