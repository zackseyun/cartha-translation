base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/043.yaml
  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
translation:
  language: fr
  text: Car ne pouvais-tu pas créer en une seule fois ceux qui ont été créés, ceux qui existent et ceux qui existeront, afin que tu manifestes plus rapidement ton jugement ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nec enim
  choice: Car… ne… pas
  rationale: Rend à la fois le lien explicatif de « enim » et la négation interrogative de « nec », dans un français naturel.
- source_word: facere
  choice: créer
  rationale: Dans ce contexte, le verbe désigne l’acte par lequel Dieu fait venir les êtres à l’existence ; « créer » exprime clairement ce sens sans alourdir la phrase.
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  choice: ceux qui ont été créés, ceux qui existent et ceux qui existeront
  rationale: Conserve la triple distinction temporelle du latin, tout en évitant l’expression française ambiguë « ceux qui sont ».
- source_word: in unum
  choice: en même temps
  rationale: Exprime ici l’idée de réunir en un seul acte ou moment la création des générations passées, présentes et futures.
- source_word: iudicium tuum ostendas
  choice: manifester… ton jugement
  rationale: « Manifester » garde l’idée de rendre le jugement visible ou évident, portée par « ostendere ».
theological_decisions:
- issue: Portée de la question sur la puissance divine
  choice: n’aurais-tu pas pu créer
  alternative: ne pouvais-tu pas créer
  rationale: Le conditionnel passé formule naturellement en français une possibilité non réalisée, sans nier la puissance divine ni transformer la question en affirmation doctrinale.
translation_notes:
  register: Français moderne, digne et direct. La formulation conserve le lien logique initial, la question adressée à Dieu et la tension entre toute-puissance, déroulement de la création et moment du jugement. Le fragment final « Et re- » appartient au début tronqué du verset suivant et n’est pas inclus.
