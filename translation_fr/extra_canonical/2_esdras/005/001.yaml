source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
translation:
  language: fr
  text: Quant aux signes, voici que des jours viennent où les habitants de la terre seront saisis d’une grande terreur[a]. Le chemin de la vérité sera caché, et le pays sera dépourvu de foi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un grand désarroi ».
    reason: Le latin « in excessu multo » peut évoquer aussi bien la terreur que le bouleversement ou le désarroi.
lexical_decisions:
- source_word: de signis autem
  choice: Quant aux signes
  rationale: Rend naturellement l’introduction thématique latine tout en conservant son contraste implicite.
- source_word: ecce dies venient
  choice: 'voici : des jours viennent'
  rationale: Conserve la particule de présentation « ecce » et l’imminence prophétique de la formule.
- source_word: adprehendentur
  choice: seront saisis
  rationale: Préserve l’image passive d’un état qui s’empare des habitants.
- source_word: in excessu multo
  choice: d’une grande terreur
  rationale: Dans ce contexte apocalyptique, « excessus » traduit vraisemblablement un état d’effroi ou de panique; une note maintient l’autre possibilité sémantique.
- source_word: abscondetur veritatis via
  choice: Le chemin de la vérité sera caché
  rationale: Traduction proche de l’ordre et de la métaphore du latin, sans expliciter ce qui cache le chemin.
- source_word: sterilis erit a fide regio
  choice: le pays sera dépourvu de foi
  rationale: Expression française naturelle qui conserve la métaphore de stérilité comme absence de foi, sans rendre « regio » par un terme excessivement technique.
theological_decisions:
- issue: Nature de l’« excessus » eschatologique
  choice: grande terreur
  alternative: grand désarroi
  rationale: Le contexte des signes et des malheurs eschatologiques favorise l’effroi, mais le latin demeure susceptible de désigner un bouleversement ou un désarroi; l’ambiguïté est donc signalée en note.
- issue: Sens de « foi »
  choice: foi
  alternative: fidélité
  rationale: Le latin « fides » permet les deux nuances. « Foi » correspond ici à la formulation générale du chemin de la vérité, sans ajouter un objet confessionnel absent du texte.
translation_notes:
  register: Français moderne, clair et digne, avec une cadence prophétique. La syntaxe reste proche du latin lorsque cela demeure naturel; la note préserve l’ambiguïté lexicale principale.
