  yaml_path: translation/extra_canonical/2_esdras/005/008.yaml
  text: And chaos will come in many places[a], and fire will often break out, and wild beasts will leave their own region,
translation:
  language: fr
  text: Des gouffres s’ouvriront en de nombreux endroits[a], le feu jaillira souvent, et les bêtes sauvages quitteront leur région,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le chaos s’installera en de nombreux endroits. »'
    reason: Le latin « chaos fiet » peut évoquer soit l’ouverture de gouffres, soit l’apparition du chaos au sens de désordre.
lexical_decisions:
- source_word: chaos fiet
  choice: Des gouffres s’ouvriront
  rationale: Dans ce contexte apocalyptique, le latin « chaos » peut désigner une béance ou un gouffre, et « fiet » l’apparition de cette ouverture. Le pluriel français rend naturellement la répartition « en de nombreux endroits ». L’autre sens possible, « chaos », est conservé en note.
- source_word: per loca multa
  choice: en de nombreux endroits
  rationale: Rend directement l’idée distributive de « per » avec « loca multa ».
- source_word: ignis frequenter emittetur
  choice: le feu jaillira souvent
  rationale: « Emittetur » évoque un feu projeté ou émis; « jaillira » restitue cette image de façon naturelle sans préciser indûment sa cause.
- source_word: bestiae agrestes transmigrabunt regionem suam
  choice: les bêtes sauvages quitteront leur région
  rationale: « Bestiae agrestes » désigne des animaux sauvages; dans cette construction, « transmigrare regionem » exprime leur déplacement hors de leur territoire habituel.
theological_decisions:
- issue: Sens concret ou abstrait de « chaos »
  choice: Image concrète de gouffres qui s’ouvrent
  alternative: « le chaos s’installera »
  rationale: Le contexte énumère des signes physiques et favorise l’image d’une béance, mais le latin peut aussi être compris au sens de chaos; la note préserve cette ambiguïté réelle.
translation_notes:
  register: Français moderne, clair et digne. La coordination et la virgule finale sont conservées parce que le verset se poursuit dans son contexte.
