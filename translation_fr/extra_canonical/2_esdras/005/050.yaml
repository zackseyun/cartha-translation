  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
translation:
  language: fr
  text: 'Je demandai alors : « Puisque tu m’as maintenant indiqué une voie, je parlerai devant toi. Car notre mère, dont tu m’as parlé, est-elle encore jeune, ou approche-t-elle déjà de la vieillesse ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram te
  choice: devant toi
  rationale: Rend directement la locution latine tout en restant naturel dans ce dialogue solennel.
- source_word: nam
  choice: car
  rationale: Conserve le lien explicatif avec l’analogie énoncée auparavant, sans le supprimer.
- source_word: mater nostra
  choice: notre mère
  rationale: Traduction directe qui maintient la portée collective et métaphorique de l’expression.
- source_word: adhuc iuuenis est
  choice: est-elle encore jeune
  rationale: Préserve l’opposition temporelle marquée par « adhuc » entre jeunesse présente et vieillesse imminente.
- source_word: iam senectuti adpropinquat
  choice: approche-t-elle déjà de la vieillesse
  rationale: Reproduit le mouvement vers la vieillesse exprimé par « adpropinquat » et la nuance de « iam ».
theological_decisions:
- issue: Identification de « notre mère »
  choice: Maintien de l’image sans explicitation
  alternative: Identifier explicitement la mère à Sion, Jérusalem ou au monde
  rationale: Le verset emploie une métaphore dont l’interprétation dépend du contexte; la traduction ne doit pas imposer une identification doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La tournure interrogative avec « car » garde le raccord logique du latin; « dont tu m’as parlé » exprime naturellement « de qua dixisti mihi ». Le début de la réplique est conservé d’après la couche de consultation et le contexte du fragment, tandis que la portion latine fournie fonde directement la seconde partie du verset.
