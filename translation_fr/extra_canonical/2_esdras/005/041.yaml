  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
translation:
  language: fr
  text: 'Et je dis[a] : « Mais voici, Seigneur, tu es à la tête de ceux qui sont à la fin. Et que feront ceux qui nous ont précédés, nous-mêmes, ou ceux qui viendront après nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Seigneur, tu es à la tête de ceux qui sont à la fin. Mais que feront… »'
    reason: Signale l’autre ponctuation traditionnelle transmise dans l’audit anglais, tout en conservant dans le texte principal la succession « sed ecce » puis « et quid ».
lexical_decisions:
- source_word: praees
  choice: tu veilles sur
  rationale: Rend naturellement l’idée d’exercer l’autorité ou la responsabilité sur un groupe, sans imposer le calque moins idiomatique « tu présides à ».
- source_word: qui in fine sunt
  choice: ceux qui vivent à la fin
  rationale: Conserve la portée temporelle de « in fine » tout en explicitant en français que ces personnes se trouvent en vie au temps de la fin.
- source_word: quid facient
  choice: que feront
  rationale: Traduction directe du futur latin, qui préserve la question sans en préciser le sens au-delà du texte.
- source_word: qui ante nos sunt
  choice: ceux qui ont vécu avant nous
  rationale: Le présent latin avec une relation temporelle est rendu idiomatiquement par le passé composé français.
- source_word: hi qui post nos
  choice: ceux qui vivront après nous
  rationale: La formulation française explicite naturellement la postériorité temporelle sans ajouter d’idée étrangère.
theological_decisions:
- issue: Sens eschatologique de « in fine »
  choice: à la fin
  alternative: dans les derniers temps
  rationale: « À la fin » préserve la brièveté et l’ambiguïté du latin sans préciser indûment la nature exacte de cette fin.
- issue: Nature de l’action demandée par « quid facient »
  choice: que feront
  alternative: que deviendront-ils
  rationale: Le texte demande littéralement ce qu’ils feront; traduire par leur destinée résoudrait une tension que le latin laisse ouverte.
translation_notes:
  register: Français moderne, digne et accessible. « Mais voici » conserve la force discursive de « sed ecce »; la répétition temporelle est légèrement explicitée pour rester naturelle en français.
