  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
translation:
  language: fr
  text: Les femmes mettront au monde des êtres monstrueux liés aux règles[a] ; dans les eaux douces, on trouvera des eaux salées ; tous les amis se feront la guerre les uns aux autres ; alors le discernement sera caché et l’intelligence sera mise à part dans sa réserve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin « menstruata monstra » est obscur. Il associe des naissances monstrueuses aux règles, sans permettre de déterminer avec certitude le rapport exact entre les deux.
    reason: lexical_alternative
lexical_decisions:
- source_word: menstruata monstra
  choice: des êtres monstrueux pendant leurs règles
  rationale: L’expression latine est obscure. Cette formulation conserve à la fois l’idée de naissances monstrueuses et la référence aux règles, sans préciser artificiellement le rapport exact entre les deux.
- source_word: dulcibus aquis salsae
  choice: Dans les eaux douces, on trouvera des eaux salées
  rationale: Le féminin pluriel « salsae » sous-entend « aquae » ; la traduction explicite naturellement cette ellipse latine.
- source_word: semetipsos expugnabunt
  choice: se feront la guerre les uns aux autres
  rationale: Dans ce contexte, la forme réfléchie exprime l’hostilité réciproque entre amis plutôt qu’une lutte intérieure de chacun contre lui-même.
- source_word: sensus
  choice: discernement
  rationale: « Discernement » rend ici la faculté de percevoir et de juger, tout en la distinguant d’« intellectus ».
- source_word: intellectus separabitur in promptuarium suum
  choice: l’intelligence se retirera dans sa réserve
  rationale: Cette image préserve la personnification et l’idée d’un retrait dans un lieu où quelque chose est gardé, dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère prophétique et les images du latin sans lisser l’obscurité de « menstruata monstra ». Le texte s’arrête à la fin traditionnelle du verset 9 ; les mots suivants de l’extrait latin appartiennent au verset 10.
