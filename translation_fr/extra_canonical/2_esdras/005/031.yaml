  text: Et il arriva, lorsque j’eus prononcé ces paroles, que fut envoyé
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est
  choice: Et il arriva
  rationale: Reproduit la formule narrative latine dans un français biblique actuel et compréhensible.
- source_word: cum locutus essem sermones istos
  choice: après que j’eus prononcé ces paroles
  rationale: Le plus-que-parfait latin marque une parole achevée avant l’action principale; «prononcer ces paroles» rend naturellement l’expression.
- source_word: et missus
  choice: que fut envoyé
  rationale: Le «et» introduit l’apodose après «Et factum est» et se rend naturellement par «que». La tournure sans sujet exprimé préserve le fragment, dont la proposition se poursuit au verset suivant.
