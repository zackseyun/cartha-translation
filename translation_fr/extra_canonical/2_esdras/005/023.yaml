  text: And I said[a], 'Sovereign Lord, from every forest of the earth and from all its trees you have chosen one vine,
translation:
  language: fr
  text: 'Et j’ai dit[a] : « Seigneur souverain, de toute forêt de la terre et de tous les arbres de la terre, tu as choisi une seule vigne,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une traduction antérieure donnait ici le contenu du verset suivant : « parmi toutes les terres du monde, tu as choisi pour toi une seule fosse, et parmi toutes les fleurs du monde, tu as choisi pour toi un seul lis ».'
    reason: Signaler le rendu antérieur décalé d’un verset sans le présenter comme une variante textuelle.
lexical_decisions:
- source_word: Dominator Domine
  choice: Seigneur souverain
  rationale: Rend l’adresse redoublée et la notion d’autorité de « Dominator » dans un français naturel et solennel.
- source_word: ex omni silva terrae
  choice: parmi toutes les forêts de la terre
  rationale: Le latin distributif est rendu idiomatiquement par « parmi toutes les », sans réduire « silva » à une forêt particulière.
- source_word: ex omnium arborum eius
  choice: parmi tous leurs arbres
  rationale: Le possessif latin renvoie aux forêts; le pluriel français évite l’ambiguïté peu naturelle de « tous ses arbres ».
- source_word: vineam unam
  choice: une seule vigne
  rationale: « Une seule » conserve l’insistance de « unam » sur l’unicité du choix.
theological_decisions:
- issue: Valeur symbolique de la vigne
  choice: Conserver simplement « vigne »
  alternative: Expliciter qu’elle représente un peuple choisi
  rationale: Le verset formule l’image sans en donner ici l’interprétation; l’expliciter résoudrait indûment la métaphore.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément au fragment fourni et à la continuation syntaxique du passage.
