  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
translation:
  language: fr
  text: 'L’ange qui était venu me trouver la nuit précédente était auprès de moi[a], et il me dit : « Écoute-moi, et je t’instruirai ; sois attentif à moi, et j’ajouterai encore. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une ancienne segmentation du passage : « Et je dis : “Parle, mon seigneur.” Il me dit : “Ton esprit s’est vivement emporté au sujet d’Israël. L’as-tu aimé plus que celui qui l’a créé ?” »'
    reason: Signale l’ancienne traduction issue d’un découpage différent des versets, tout en maintenant dans le texte principal la segmentation correspondant au latin fourni.
lexical_decisions:
- source_word: praeterita nocte
  choice: la nuit précédente
  rationale: Rend directement l’expression temporelle latine dans un français naturel.
- source_word: audi me
  choice: Écoute-moi
  rationale: Conserve l’impératif et son complément personnel.
- source_word: instruam te
  choice: je t’instruirai
  rationale: Préserve le sens didactique et la forme future du latin.
- source_word: intende mihi
  choice: sois attentif à moi
  rationale: Exprime naturellement l’appel à prêter une attention soutenue au locuteur.
- source_word: adiciam
  choice: j’ajouterai encore
  rationale: Conserve le caractère ouvert du verbe latin, dont le complément n’est pas exprimé dans ce segment.
theological_decisions:
- issue: Complément implicite de « adiciam »
  choice: j’ajouterai encore
  alternative: je t’en dirai davantage
  rationale: La formulation retenue évite de préciser ce qui sera ajouté et préserve ainsi l’inachèvement ou l’ambiguïté du segment latin.
translation_notes:
  register: Français moderne, international et digne. La répétition latine de ad me est allégée pour obtenir une phrase naturelle, sans modifier le rapport de proximité exprimé par est angelus ad me.
