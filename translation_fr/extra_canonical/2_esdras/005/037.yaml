revisions:
- from: Rends-moi leur fraîcheur, aux fleurs desséchées[a] ; ouvre-moi les réserves qui sont fermées et fais-en sortir les vents qui y sont enfermés ; ou bien montre-moi l’image d’une voix. Alors, je te montrerai cette détresse sur laquelle tu m’interroges.
  to: Fais reverdir pour moi les fleurs desséchées ; ouvre-moi les entrepôts fermés et fais-en sortir les vents qui y sont enfermés ; ou bien montre-moi l’image d’une voix. Alors, je te montrerai cette détresse sur laquelle tu m’interroges.
  rationale: La révision rétablit l’impératif concret de reuirida et remplace un terme français ambigu par un nom de lieu de stockage. Elle conserve l’enchaînement rhétorique, l’ambiguïté de « l’image d’une voix » et le renvoi anaphorique de « cette détresse ». La note, désormais purement répétitive, est supprimée avec son ancre.
  reviewer_model: gpt-5.6-terra
