  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
translation:
  language: fr
  text: Fais reverdir pour moi les fleurs desséchées ; ouvre-moi les entrepôts fermés et fais-en sortir les vents qui y sont enfermés ; ou bien montre-moi l’image d’une voix. Alors, je te montrerai cette détresse sur laquelle tu m’interroges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuirida mihi aridos flores
  choice: Rends-moi leur fraîcheur, aux fleurs desséchées
  rationale: Le verbe latin, vraisemblablement pour « revirida », demande de rendre de nouveau verdoyantes ou fraîches des fleurs desséchées. La tournure française exprime naturellement cette restauration sans réduire l’image à une simple restitution matérielle.
- source_word: prumptuaria
  choice: réserves
  rationale: Variante graphique de « promptuaria », désignant des lieux où l’on garde des provisions ou des biens. « Réserves » convient au contexte cosmique et reste courant en français.
- source_word: flatos
  choice: vents
  rationale: La forme renvoie aux souffles enfermés ; dans ce contexte, « vents » est l’équivalent concret et naturel.
- source_word: uocis imaginem
  choice: l’image d’une voix
  rationale: Traduction volontairement formelle de cette expression énigmatique, sans en résoudre artificiellement le paradoxe.
- source_word: eum laborem
  choice: cette détresse
  rationale: « Labor » peut désigner peine, épreuve ou détresse. Ici, le démonstratif reprend vraisemblablement la « détresse de Jacob » évoquée en 5.35 ; « cette détresse » maintient le renvoi anaphorique et évite le sens français de travail.
- source_word: quem rogas
  choice: sur laquelle tu m’interroges
  rationale: Le relatif porte sur la détresse demandée comme objet de révélation. Cette formulation est idiomatique et ne rajoute pas l’idée absente de « voir ».
theological_decisions:
- issue: Renvoi de « eum laborem » à la détresse de Jacob en 5.35
  choice: cette détresse
  alternative: ce labeur / cette peine
  rationale: Le contexte proche favorise une épreuve ou une souffrance historique et eschatologique, non un travail accompli. Le démonstratif « cette » conserve explicitement le renvoi sans développer son interprétation.
translation_notes:
  register: Français moderne, international et digne. La succession d’impératifs et les images paradoxales sont conservées. La ponctuation clarifie les groupes syntaxiques sans atténuer la force rhétorique.
