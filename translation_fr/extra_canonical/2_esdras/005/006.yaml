  yaml_path: translation/extra_canonical/2_esdras/005/006.yaml
  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: fr
  text: Celui que les habitants de la terre n’attendent pas régnera, et les oiseaux migreront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quem non sperant
  choice: que […] n’attendent pas
  rationale: Dans ce contexte, « sperare » exprime l’attente plutôt que le seul espoir; cette formulation conserve l’idée d’un souverain inattendu.
- source_word: qui inhabitant super terram
  choice: les habitants de la terre
  rationale: Rend naturellement la proposition latine tout en gardant sa portée universelle.
- source_word: volatilia
  choice: les oiseaux
  rationale: Équivalent courant et clair du substantif collectif désignant les êtres qui volent.
- source_word: conmigrationem facient
  choice: migreront
  rationale: Le latin signifie littéralement qu’ils effectueront une migration; le verbe français exprime cette action sans ajouter l’idée non requise de « tous ensemble ».
theological_decisions:
- issue: Identité de celui qui régnera
  choice: Conserver le référent indéfini « Celui que… »
  alternative: Identifier explicitement ce personnage comme le Messie ou un autre souverain
  rationale: Le texte latin ne nomme pas ce personnage; l’identifier lèverait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, sobre et prophétique. L’ordre de la première proposition est légèrement réorganisé pour une lecture naturelle, sans modifier le contraste entre l’attente des habitants et le règne annoncé.
