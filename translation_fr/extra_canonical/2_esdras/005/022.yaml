  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
translation:
  language: fr
  text: Alors mon âme retrouva l’esprit d’intelligence, et je recommençai à parler devant le Très-Haut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit
  choice: retrouva
  rationale: Exprime naturellement la reprise ou le recouvrement d’une capacité auparavant perdue ou interrompue.
- source_word: anima mea
  choice: mon âme
  rationale: Conserve l’anthropologie et la formulation explicites du latin sans les réduire à un simple pronom personnel.
- source_word: spiritum intellectus
  choice: l’esprit d’intelligence
  rationale: Rend formellement la construction latine et maintient son possible sens de faculté ou de disposition intérieure permettant de comprendre.
- source_word: iterum coepi loqui
  choice: je recommençai à parler
  rationale: Restitue à la fois iterum et coepi dans un français fluide.
- source_word: coram Altissimo
  choice: devant le Très-Haut
  rationale: Traduction directe, traditionnelle et naturelle du titre divin et de la préposition coram.
- source_word: sermones
  choice: parler
  rationale: Le pluriel latin désigne ici les paroles prononcées; en français, l’objet «des paroles» serait redondant après «parler».
theological_decisions:
- issue: Nature de «l’esprit d’intelligence»
  choice: Conserver «l’esprit d’intelligence» sans préciser s’il s’agit d’une faculté humaine ou d’un don divin.
  alternative: «la faculté de comprendre» ou «un esprit de discernement»
  rationale: Le latin ne tranche pas explicitement entre ces nuances; la formulation retenue préserve cette ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche du latin tout en étant idiomatique. Aucun appel de note n’est nécessaire, car la note anglaise héritée correspond à une ancienne traduction désalignée provenant du verset suivant.
