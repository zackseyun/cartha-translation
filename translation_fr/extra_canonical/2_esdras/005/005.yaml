  source_fidelity: 'Le texte rend avec fidélité les quatre signes du latin : l’écoulement goutte à goutte du sang « du bois » (de ligno), la pierre personnifiée qui fait entendre sa voix, les peuples ébranlés (commovebuntur) et les gressus changés. Il ne force aucune interprétation des images apocalyptiques.'
