  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
translation:
  language: fr
  text: Et du sang coulera goutte à goutte du bois, la pierre fera entendre sa voix, les peuples seront ébranlés, et les pas seront changés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les parcours seront modifiés »; le mot latin peut désigner les pas, la démarche ou le cours suivi.
    reason: ambiguïté lexicale de « gressus »
lexical_decisions:
- source_word: de ligno sanguis stillabit
  choice: du sang coulera goutte à goutte du bois
  rationale: Rend directement l’origine exprimée par « de ligno » et l’écoulement en gouttes de « stillabit », tout en restant naturel en français.
- source_word: lapis dabit vocem suam
  choice: la pierre fera entendre sa voix
  rationale: Expression française naturelle qui conserve la personnification et le sens littéral de la pierre donnant sa propre voix.
- source_word: populi commovebuntur
  choice: les peuples seront ébranlés
  rationale: Conserve le pluriel « populi » ainsi que la force et la forme passive de « commovebuntur », sans préciser abusivement s’il s’agit d’un bouleversement physique, social ou émotionnel.
- source_word: gressus commutabuntur
  choice: les pas seront changés
  rationale: Traduction formellement proche qui préserve l’étrangeté apocalyptique du passif et l’ambiguïté de « gressus ».
theological_decisions:
- issue: Nature des signes annoncés
  choice: Conserver les images concrètes et leur personnification sans les interpréter
  alternative: Expliquer symboliquement le bois, la pierre, les peuples ou les pas
  rationale: Le latin énonce des prodiges sans en fournir l’interprétation; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français moderne, international et digne. La coordination répétée et le passif final préservent le rythme prophétique ainsi que l’étrangeté voulue du texte latin.
