- source_word: nunc
  choice: maintenant
  rationale: Conserve explicitement le contraste temporel avec ceux d’autrefois.
- source_word: his qui ante
  choice: ceux d’autrefois
  rationale: Expression française naturelle qui préserve la comparaison avec les générations antérieures.
- source_word: minores statu
  choice: plus petits de taille
  rationale: Rend le comparatif minores et l’ablatif de point de vue statu sans l’élargir à une infériorité générale.
