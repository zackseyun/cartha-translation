  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
translation:
  language: fr
  text: Et, parmi tous les abîmes de la mer, tu as rempli pour toi un seul cours d’eau[a] ; et, parmi toutes les villes bâties, tu as sanctifié Sion pour toi-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une ancienne présentation donnait ici : « et, parmi tous les oiseaux créés, tu as donné un nom pour toi à une seule colombe ; et, parmi tout le bétail formé, tu as pourvu pour toi à une seule brebis ». Ce texte correspond toutefois au verset suivant dans la source latine retenue.'
    reason: previous_rendering
lexical_decisions:
- source_word: abyssis maris
  choice: abîmes de la mer
  rationale: Rend directement l’expression latine et conserve son image de profondeurs marines.
- source_word: rivum unum
  choice: un seul cours d’eau
  rationale: « Cours d’eau » rend rivum sans imposer la taille précise suggérée par « ruisseau » ; « un seul » préserve l’accent de unum.
- source_word: aedificatis civitatibus
  choice: villes bâties
  rationale: Formulation française naturelle qui conserve l’idée des villes ayant été construites.
- source_word: sanctificasti
  choice: tu as consacré
  rationale: Dans ce contexte de choix divin parmi les villes, « consacré » exprime la mise à part comme sainte plus naturellement que « sanctifié ».
- source_word: tibi / tibimet ipsi
  choice: pour toi
  rationale: Conserve le datif d’intérêt et la répétition emphatique du texte latin.
theological_decisions:
- issue: Nature de l’action exercée sur Sion
  choice: tu as consacré Sion pour toi
  alternative: tu as sanctifié Sion pour toi
  rationale: « Consacré » communique clairement la mise à part de Sion pour Dieu, tout en évitant de résoudre davantage la portée théologique du verbe latin.
- issue: Leçon textuelle divergente autrefois placée dans le corps du verset
  choice: Traduire le latin fourni parlant des abîmes, d’un cours d’eau, des villes et de Sion
  alternative: Employer la leçon parlant des oiseaux, de la colombe, du bétail et de la brebis
  rationale: La source latine assignée à 5.25 porte la première leçon ; l’autre correspond à un décalage de verset signalé par la révision.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe parallèle et la répétition de « pour toi » sont conservées afin de rendre la structure et l’insistance du latin.
