  text: 'et dixit ad me: non potes. et dixi: quare, domine, aut quidnascebar, aut quare non fiebat matrix matris meae mihi sepulchrum, ut non viderem laborem Iacob et defatigationem generis Israhel?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
translation:
  language: fr
  text: 'Et il me dit : « Tu ne peux pas. » Je répondis : « Pourquoi, Seigneur ? Ou pourquoi suis-je né ? Ou pourquoi le ventre de ma mère n’est-il pas devenu mon tombeau, afin que je ne voie pas la peine de Jacob et l’épuisement de la descendance d’Israël ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non potes
  choice: Tu ne le peux pas
  rationale: Rend directement l’incapacité exprimée par le latin, tout en laissant implicite l’objet comme dans la source.
- source_word: matrix matris meae
  choice: le ventre de ma mère
  rationale: Expression naturelle et digne en français moderne pour désigner le sein maternel.
- source_word: laborem Iacob
  choice: la peine de Jacob
  rationale: '« Peine » conserve l’étendue sémantique de labor : souffrance, difficulté et labeur, sans préciser indûment.'
- source_word: defatigationem generis Israhel
  choice: l’épuisement de la descendance d’Israël
  rationale: « Épuisement » traduit la fatigue extrême de defatigatio ; « descendance » rend genus dans son sens collectif et généalogique.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Maintenir « Seigneur » sans identifier explicitement l’interlocuteur
  alternative: Préciser « mon Seigneur » ou identifier l’ange
  rationale: Le latin domine ne tranche pas davantage et le contexte ne doit pas être explicité dans le verset au prix d’une résolution interprétative.
- issue: Nature de la détresse d’Israël
  choice: Employer les termes généraux « peine » et « épuisement »
  alternative: Interpréter comme oppression, péché, exil ou destruction
  rationale: La source formule une lamentation large ; une précision théologique ou historique réduirait son ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition interrogative est conservée pour restituer l’intensité de la lamentation. Aucun appel de note n’est requis.
