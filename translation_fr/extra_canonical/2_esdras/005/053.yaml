  text: And she herself will say to you[a], "Different are those born in the strength of youth, and different are those born toward the time of old age, when the womb is failing."
translation:
  language: fr
  text: 'Et elle-même te dira : « Il y en a qui sont nés dans la vigueur de la jeunesse, et d’autres qui sont nés à l’approche de la vieillesse, lorsque l’utérus décline. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sub tempus senectutis
  choice: à l’approche de la vieillesse
  rationale: L’expression latine indique qu’on se rapproche de cette période de la vie, plutôt qu’un moment strictement délimité.
- source_word: deficiente matrice
  choice: lorsque le sein maternel s’affaiblit
  rationale: Cette formulation rend l’idée d’une capacité maternelle qui décline, tout en évitant le terme anatomique « matrice », peu naturel dans ce contexte en français moderne.
- source_word: alii … et alii
  choice: Autres sont ceux… et autres ceux…
  rationale: La tournure conserve le contraste parallèle et marqué du latin.
