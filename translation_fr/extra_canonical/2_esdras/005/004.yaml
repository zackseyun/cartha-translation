  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
translation:
  language: fr
  text: Mais si le Très-Haut t’accorde de rester en vie, tu verras, après le troisième bouleversement[a], le soleil se mettre soudain à briller pendant la nuit, et la lune pendant le jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'D’autres versions anciennes ont : « après la troisième trompette ». Le latin transmis porte turbatam, une forme difficile, rendue ici par « bouleversement ».'
    reason: Signaler une variante textuelle ancienne importante et préciser que « bouleversement » est une traduction interprétative prudente de la leçon latine difficile.
lexical_decisions:
- source_word: Altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel et directement équivalent au latin, dans un français actuel et digne.
- source_word: dederit … vivere
  choice: t’accorde de rester en vie
  rationale: Exprime naturellement l’idée conditionnelle d’une vie prolongée jusqu’aux événements annoncés.
- source_word: post tertiam turbatam
  choice: après le troisième bouleversement
  rationale: Suit la leçon latine transmise, malgré sa forme difficile, en rendant turbatam par un événement perturbateur plutôt qu’en adoptant silencieusement une correction textuelle.
- source_word: relucescet subito
  choice: se mettre soudain à briller
  rationale: Rend la reprise ou l’apparition soudaine de la lumière portée par relucescet, sans alourdir la phrase.
- source_word: noctu … interdie
  choice: pendant la nuit … pendant le jour
  rationale: Formulation française claire qui conserve le contraste temporel du latin.
theological_decisions:
- issue: Leçon « bouleversement » ou « trompette »
  choice: « bouleversement » dans le texte principal
  alternative: « après la troisième trompette »
  rationale: Le latin fourni porte turbatam, tandis que « trompette » suppose une correction textuelle appuyée par d’autres versions anciennes. Le texte principal traduit donc le témoin latin demandé et la note signale l’alternative sans trancher silencieusement.
translation_notes:
  register: Français international moderne, fluide et solennel. Le tutoiement conserve l’adresse individuelle du latin tibi. La syntaxe garde le caractère apocalyptique et le parallélisme entre la nuit et le jour.
