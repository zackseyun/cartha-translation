source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me : coronae adsimilabo iudicium meum ; sicut non nouissimorum tarditas, sic nec priorum uelocitas. Et respondi et dixi :'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
translation:
  language: fr
  text: 'Il me dit : « Je comparerai mon jugement à une couronne[a] : de même qu’il n’y a pas de retard pour les derniers, il n’y a pas non plus de hâte pour les premiers. » Alors je répondis :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « couronne » peut aussi désigner un cercle ou un anneau ; l’image soulignerait alors la symétrie entre les premiers et les derniers.
    reason: lexical_alternative
lexical_decisions:
- source_word: coronae
  choice: à une couronne
  rationale: Rend directement le datif latin après « adsimilabo ». « Couronne » conserve l’image concrète, tandis que la note signale le sens possible de cercle ou d’anneau.
- source_word: adsimilabo
  choice: je comparerai
  rationale: Expression française naturelle pour l’idée de rendre ou présenter une chose semblable à une autre, sans ajouter d’interprétation.
- source_word: tarditas
  choice: retard
  rationale: Dans ce contraste temporel, « retard » exprime plus naturellement que « lenteur » l’idée que les derniers ne sont pas différés.
- source_word: uelocitas
  choice: précipitation
  rationale: Le terme latin signifie rapidité; dans l’opposition avec « retard », « précipitation » rend l’idée d’une avance hâtive accordée aux premiers.
- source_word: nouissimorum / priorum
  choice: les derniers / les premiers
  rationale: Conserve l’opposition structurante et son ambiguïté référentielle, sans préciser s’il s’agit de personnes, de générations ou d’un ordre temporel.
theological_decisions:
- issue: Symétrie du jugement entre les premiers et les derniers
  choice: Maintenir l’énoncé paradoxal sans l’expliquer
  alternative: Préciser que tous recevront le jugement simultanément ou équitablement
  rationale: Le latin affirme la correspondance entre derniers et premiers, mais n’explicite pas sa portée exacte; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: 'Français moderne, digne et accessible. La phrase finale « Alors je répondis : » est conservée parce qu’elle figure explicitement dans la source latine, même si elle introduit la suite du dialogue.'
