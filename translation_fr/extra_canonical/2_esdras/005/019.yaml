  yaml_path: translation/extra_canonical/2_esdras/005/019.yaml
  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
translation:
  language: fr
  text: 'Je lui dis : « Éloigne-toi de moi et ne t’approche pas de moi avant que sept jours se soient écoulés. Alors, tu viendras auprès de moi. » Il fit ce que je lui avais dit et se retira de moi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vade a me
  choice: Éloigne-toi de moi
  rationale: Rend l’impératif et le mouvement d’éloignement sans la rudesse familière de « va-t’en ».
- source_word: usque diebus septem
  choice: avant que sept jours se soient écoulés
  rationale: Exprime la limite temporelle du latin, plutôt qu’une simple durée de sept jours.
- source_word: tunc venies ad me
  choice: Alors, tu reviendras auprès de moi
  rationale: Le contexte implique un retour après l’éloignement ordonné; « auprès de moi » conserve l’idée de mouvement vers le locuteur.
- source_word: audivit ut dixi
  choice: Il m’obéit
  rationale: Dans ce contexte, « entendre/écouter » signifie donner suite à l’ordre reçu. La note conserve une formulation plus proche de la lettre.
- source_word: recessit a me
  choice: se retira loin de moi
  rationale: Traduit clairement le départ effectif qui suit l’ordre.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la syntaxe latine tout en rendant idiomatiquement la valeur contextuelle de audivit.
