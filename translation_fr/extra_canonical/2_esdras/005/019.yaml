    issue: La formulation « Il m’obéit » absorbe ut dixi.
    rationale: Audivit a ici le sens contextuel de se conformer à l’ordre, mais la locution ut dixi précise qu’il agit conformément à ce qui a été dit. La traduction peut le rendre sans note.
  - severity: low
    issue: « loin de moi » ajoute une précision spatiale.
    rationale: Recessit a me signifie qu’il se retira/s’éloigna de l’orateur, sans indiquer une distance particulière.
