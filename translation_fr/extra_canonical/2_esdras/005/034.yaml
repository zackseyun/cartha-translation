  yaml_path: translation/extra_canonical/2_esdras/005/034.yaml
  text: him more than he who made him?' And I said[a], 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the path of the Most High and to search out part of his judgment.' And he said to me, 'You cannot.' And I said, 'Why, lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see Jacob's trouble?'
translation:
  language: fr
  text: 'lui plus que celui qui l’a créé ? » Je répondis : « Non, Seigneur. Mais j’ai parlé sous le poids de la douleur, car, à toute heure, je suis tourmenté au plus profond de moi-même tandis que je cherche à saisir le chemin du Très-Haut et à sonder une part de son jugement. » Il me dit : « Tu ne le peux pas. » Je repris : « Pourquoi, Seigneur ? Ou pourquoi suis-je né ? Ou pourquoi le ventre de ma mère n’est-il pas devenu mon tombeau, afin que je ne voie pas la détresse de Jacob ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dolens
  choice: sous le poids de la douleur
  rationale: Rend la parole née de l’affliction sans réduire le participe latin à une simple émotion passagère.
- source_word: renes mei
  choice: au plus profond de moi-même
  rationale: Le latin dit littéralement « mes reins », siège ancien des émotions profondes ; l’expression française choisie en transmet le sens corporel et intérieur sans étrangeté inutile.
- source_word: semitam altissimi
  choice: le chemin du Très-Haut
  rationale: « Chemin » est naturel et conserve l’image de semita ainsi que le titre divin Altissimus.
- source_word: inuestigare partem iudicii eius
  choice: sonder une part de son jugement
  rationale: Conserve la portée judiciaire et théologique de iudicium ainsi que la modestie de partem, sans préciser artificiellement s’il s’agit d’une décision, d’une justice ou d’un dessein.
- source_word: matrix matris meae
  choice: le ventre de ma mère
  rationale: Formulation française actuelle pour la matrice maternelle, avec maintien de l’image du lieu de gestation devenu tombeau.
- source_word: laborem Iacob
  choice: la détresse de Jacob
  rationale: Dans ce contexte collectif, labor désigne l’épreuve pénible ou la souffrance de Jacob ; « détresse » est idiomatique et laisse ouverte l’étendue exacte du malheur.
theological_decisions:
- issue: Sens de « iudicium eius »
  choice: son jugement
  alternative: sa justice / ses décisions
  rationale: « Jugement » garde l’ambivalence du latin entre l’acte de juger, la décision et l’ordre juste de Dieu.
- issue: Référent collectif de « Jacob »
  choice: Jacob
  alternative: le peuple de Jacob / Israël
  rationale: Le nom source est conservé sans expliciter son possible sens collectif, afin de ne pas résoudre ce que le texte laisse implicite.
- issue: Incapacité exprimée par « non potes »
  choice: Tu ne le peux pas
  alternative: Tu en es incapable
  rationale: La formulation brève respecte la réponse absolue du texte sans ajouter la cause ou la portée précise de cette incapacité.
translation_notes:
  register: Français moderne, digne et lisible. Le verset commence par un fragment syntaxique rattaché au contexte précédent, conformément à la délimitation fournie. Les répétitions interrogatives et la tension entre recherche humaine et jugement divin sont conservées.
