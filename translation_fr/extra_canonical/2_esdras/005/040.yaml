source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me interrogasti? Et dixit ad me: quomodo non potes facere unum de his quae dicta sunt, sic non poteris inuenire iudicium'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/040.yaml
  text: And he said to me[a], 'Just as you cannot do one of these things that have been spoken[b], so you cannot find out the judgment.'
translation:
  language: fr
  text: '« M’as-tu interrogé[a] ? » Et il me dit : « De même que tu ne peux accomplir une seule de ces choses qui ont été dites, de même tu ne pourras découvrir le jugement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La brève question paraît reprendre ou achever une pensée commencée dans le contexte précédent.
    reason: La source fournie commence par « me interrogasti ? », sans complément exprimé dans ce verset.
  - marker: b
    text: Ou « la décision ». Le latin peut désigner le jugement lui-même, la décision rendue ou l’exercice de la justice.
    reason: Ambiguïté lexicale de « iudicium ».
lexical_decisions:
- source_word: facere
  choice: accomplir
  rationale: Dans ce contexte, le verbe désigne le fait de réaliser l’une des choses évoquées, plutôt que simplement de la « faire » au sens courant.
- source_word: inuenire
  choice: découvrir
  rationale: Conserve l’image d’une recherche qui n’aboutit pas, sans expliciter excessivement par « comprendre » ou « sonder ».
- source_word: iudicium
  choice: le jugement
  rationale: Rend directement le latin tout en préservant l’ambiguïté entre le jugement divin, sa décision et ses voies de justice.
theological_decisions:
- issue: Portée de « iudicium »
  choice: le jugement
  alternative: la décision / les voies de la justice divine
  rationale: Le texte latin ne précise ni possesseur ni aspect particulier du jugement; la traduction ne doit donc pas ajouter « mon » ni développer une interprétation théologique absente.
- issue: Éléments relatifs au but ou à l’accomplissement de l’amour promis
  choice: Ne pas les inclure
  alternative: Ajouter « ou le but de l’amour que j’ai promis à mon peuple »
  rationale: Ces éléments ne figurent pas dans la source latine fournie et ne peuvent être réintroduits à partir d’une autre forme textuelle sans témoin indiqué ici.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « de même que… de même… » reproduit le parallélisme logique du latin. L’ouverture abrupte est conservée et signalée en note plutôt que reconstruite conjecturalement.
