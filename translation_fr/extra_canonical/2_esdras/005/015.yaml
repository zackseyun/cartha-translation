  text: it labored to the point of failing. And the angel who had come, who was speaking in me, took hold of me and strengthened me and set me on my feet.
translation:
  language: fr
  text: elle peina jusqu’à défaillir. Et l’ange qui était venu, qui parlait en moi, me saisit, me fortifia et me remit debout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborauit, ut deficeret
  choice: elle peina jusqu’à défaillir
  rationale: Rend l’effort suivi de l’épuisement exprimé par la proposition consécutive, sans ajouter une identification absente de ce fragment; le pronom féminin reprend le référent du contexte précédent.
- source_word: tenuit me
  choice: me saisit
  rationale: Exprime naturellement l’action de retenir ou de prendre fermement quelqu’un qui défaille.
- source_word: confortauit me
  choice: me fortifia
  rationale: Conserve le sens direct de l’affermissement ou du renouvellement des forces.
- source_word: statuit me super pedes
  choice: me remit sur mes pieds
  rationale: Formulation française claire et proche de l’image corporelle latine, plutôt que l’expression plus idiomatique mais moins formelle « me remit debout ».
theological_decisions:
- issue: Sens inhabituel de « loquebatur in me »
  choice: qui parlait en moi
  alternative: qui me parlait / qui parlait avec moi
  rationale: Le latin dit explicitement « en moi ». La traduction conserve cette formulation inhabituelle et sa possible portée théologique sans la normaliser en simple dialogue.
- issue: Lien logique entre les deux phrases
  choice: Alors
  alternative: Et
  rationale: Dans ce contexte narratif, « Et » introduit la réaction immédiate de l’ange; « Alors » rend ce rapport temporel naturellement sans créer l’opposition qu’introduirait « Mais ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du latin tout en étant fluide; l’étrangeté intentionnelle de « parlait en moi » est préservée.
