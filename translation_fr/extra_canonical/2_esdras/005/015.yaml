source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborauit, ut deficeret. Et tenuit me qui uenit angelus, qui loquebatur in me, et confortauit me et statuit me super pedes.
  language: Latin
