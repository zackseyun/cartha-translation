id: 2ES.5.49
reference: 2 Esdras 5:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'admodum enim infans non parit nec ea quae senuit adhuc, sic ego disposui a me creatum saeculum. Et interrogaui et dixi : cum iam dederis mihi uiam, loquar'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
translation:
  language: fr
  text: Car, de même qu’un nourrisson n’enfante pas et qu’une femme devenue vieille n’enfante plus, ainsi ai-je ordonné l’ère[a] que j’ai créée. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le monde »; le terme désigne ici le monde considéré dans son déroulement temporel.'
    reason: Le latin saeculum peut désigner un âge, une ère ou le monde présent.
lexical_decisions:
- source_word: infans
  choice: un nourrisson
  rationale: Rend le contraste entre le tout début de la vie et la vieillesse, tout en conservant l’image volontairement frappante du latin.
- source_word: non parit
  choice: n’enfante pas
  rationale: Le verbe latin parere signifie ici mettre au monde; « enfanter » permet de reprendre naturellement le verbe sous-entendu dans la seconde proposition.
- source_word: ea quae senuit adhuc
  choice: une femme devenue vieille n’enfante plus
  rationale: Le féminin ea et le contexte de l’enfantement invitent à expliciter « une femme »; adhuc, avec la négation, est rendu idiomatiquement par « plus ».
- source_word: disposui
  choice: ai-je ordonné
  rationale: Conserve l’idée que Dieu a établi ou organisé le déroulement de l’ère créée, sans réduire le terme à une simple décision.
- source_word: saeculum
  choice: l’ère
  rationale: Dans ce contexte, saeculum désigne l’ordre temporel créé ou l’âge du monde; « ère » garde cette dimension temporelle mieux que « siècle » en français courant.
theological_decisions:
- issue: Nature du saeculum créé
  choice: l’ère que j’ai créée
  alternative: le monde que j’ai créé
  rationale: Le latin peut viser le monde dans sa durée aussi bien qu’un âge. « Ère » préserve la comparaison avec les étapes de la vie et évite d’identifier sans nuance saeculum au cosmos matériel.
translation_notes:
  register: Français moderne, digne et accessible. La structure comparative du latin est conservée, avec répétition d’« enfanter » pour éviter une ellipse obscure. Le segment « Et interrogaui… » appartient au mouvement narratif suivant et n’est pas inclus dans le texte de 5.49.
