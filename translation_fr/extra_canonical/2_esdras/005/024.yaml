  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
translation:
  language: fr
  text: et, parmi toutes les terres du monde, tu t’es choisi une seule fosse[a] ; et, parmi toutes les fleurs du monde, tu t’es choisi un seul lis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin porte « fosse ». Une ancienne formulation de ce verset donnait plutôt : « et, parmi toutes les profondeurs de la mer, tu as rempli pour toi un seul cours d’eau ; et, parmi toutes les villes qui ont été bâties, tu as sanctifié Sion pour toi ». Cette formulation correspond toutefois au verset suivant dans le texte latin ici retenu.'
    reason: previous_rendering
lexical_decisions:
- source_word: foveam
  choice: fosse
  rationale: Le latin désigne normalement une fosse ou un trou. Ce terme concret conserve l’étrangeté du texte transmis sans lui substituer une conjecture.
- source_word: lilium
  choice: lis
  rationale: Équivalent français direct du latin, naturel dans un registre biblique moderne.
- source_word: elegisti tibi
  choice: tu as choisi pour toi
  rationale: Rend explicitement le verbe et le datif d’intérêt, tout en conservant le parallélisme des deux propositions.
- source_word: unam / unum
  choice: une seule / un seul
  rationale: Souligne l’unicité exprimée par le latin et la structure rhétorique du passage.
theological_decisions:
- issue: Identification symbolique de la « fosse » et du « lis »
  choice: Ne pas expliciter leur référent dans le corps du texte
  alternative: Identifier la fosse à un lieu précis et le lis à Israël ou à un autre peuple
  rationale: Le verset emploie des images sans en donner ici l’interprétation ; les préciser imposerait une lecture théologique absente du latin.
- issue: Leçon textuelle inhabituelle « foveam »
  choice: Conserver la leçon du texte latin fourni
  alternative: Adopter la formulation d’une version antérieure correspondant au verset suivant
  rationale: La source citée porte bien « foveam » ; l’autre formulation traduit un passage différent et ne doit pas remplacer silencieusement cette leçon.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme du latin est préservé, ainsi que son image surprenante. Le point-virgule clarifie les deux membres coordonnés.
