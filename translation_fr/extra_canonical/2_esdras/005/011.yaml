  text: 'multiplicabitur iniustitia et incontinentia super terram. Et interrogabit regio proximam suam et dicet: numquid per te'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: fr
  text: 'L’injustice et le manque de maîtrise de soi se multiplieront sur la terre. Une région interrogera sa voisine et lui dira : « La justice est-elle passée chez toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniustitia
  choice: l’injustice
  rationale: Équivalent direct qui conserve la portée morale générale du latin.
- source_word: incontinentia
  choice: le manque de maîtrise de soi
  rationale: Exprime clairement l’absence de retenue ou de contrôle de soi, sans la réduire au seul domaine sexuel.
- source_word: regio proximam suam
  choice: une région… sa voisine
  rationale: Respecte la personnification et la relation de proximité exprimées par le latin, dans un français naturel.
- source_word: multiplicabitur
  choice: se multiplieront
  rationale: Le pluriel français s’accorde naturellement avec les deux sujets coordonnés, tout en conservant l’idée de prolifération.
- source_word: per te
  choice: chez toi
  rationale: Dans l’adresse personnifiée à une région, « chez toi » rend idiomatiquement l’idée d’un passage sur son territoire.
theological_decisions:
- issue: Sens de « justice » dans la question finale
  choice: la justice
  alternative: la droiture
  rationale: « Justice » conserve l’ambiguïté entre conduite juste et réalité personnifiée, sans ajouter d’explication théologique absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La personnification des régions est conservée. La formulation évite toute expansion interprétative.
