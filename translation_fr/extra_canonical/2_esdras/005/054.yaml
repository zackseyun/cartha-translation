  text: Therefore consider also for yourself[a], that you are smaller in stature than those before you,
translation:
  language: fr
  text: Considère donc, toi aussi, que vous êtes de plus petite stature que ceux qui vous ont précédés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Considera
  choice: Considère
  rationale: Rend directement l’impératif singulier latin et conserve l’appel personnel adressé au voyant.
- source_word: et tu
  choice: toi aussi
  rationale: Exprime naturellement en français l’inclusion marquée par le latin.
- source_word: minores statu
  choice: de plus petite stature
  rationale: Conserve la comparaison physique ou anthropologique suggérée par «statu» dans ce contexte, sans la généraliser en simple infériorité.
- source_word: prae his qui ante vos
  choice: que ceux qui vous ont précédés
  rationale: Rend la comparaison avec les générations antérieures dans un français naturel.
theological_decisions:
- issue: Alternance entre le singulier «tu» et le pluriel «vous»
  choice: «toi aussi» puis «vous êtes»
  alternative: 'Uniformiser au singulier: «tu es»'
  rationale: 'Le latin passe délibérément de «tu» à «vos»: l’interlocuteur est d’abord visé personnellement, puis associé à sa génération. La traduction préserve cette tension grammaticale.'
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la structure latine tout en étant idiomatique; aucune note n’est retenue, car l’ancienne variante anglaise provenait d’un décalage de numérotation avec le verset précédent.
