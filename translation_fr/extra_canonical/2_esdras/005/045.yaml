base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
translation:
  language: fr
  text: 'Et je dis : « Comment donc as-tu dit à ton serviteur que tu donneras assurément la vie à la création que tu as créée, tout entière ? Si donc les vivants vivront tous ensemble et que la création endurera, elle peut aussi maintenant porter tous ceux qui sont présents ensemble. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuentes
  choice: les vivants
  rationale: Conserve le substantif collectif latin et le lien explicite avec la vie donnée dans la phrase précédente.
- source_word: creatura
  choice: la création
  rationale: Le contexte lui donne un sens collectif, confirmé par « les vivants » ; « créature » évoquerait plus naturellement en français un seul être.
- source_word: sustinebit
  choice: le supporte
  rationale: Rend la capacité de la création à soutenir cette situation tout en préservant la proximité sémantique avec « portare » dans la proposition suivante.
- source_word: portare
  choice: porter
  rationale: Traduction concrète et directe qui maintient l’image de la création capable de contenir ou de porter tous les êtres présents.
- source_word: in unum
  choice: tous ensemble
  rationale: Exprime l’idée collective et simultanée du latin dans un français naturel, sans la réduire à un simple lieu commun.
theological_decisions:
- issue: Portée collective de « creatura »
  choice: la création que tu as créée
  alternative: la créature que tu as créée
  rationale: La reprise par « les vivants » indique l’ensemble des êtres créés plutôt qu’un individu ; la répétition création/créée conserve aussi la figure étymologique du latin.
- issue: Nature de la vie donnée
  choice: donnerais assurément la vie
  alternative: ressusciterais assurément
  rationale: Le latin évoque le fait de faire vivre ; « donner la vie » préserve cette latitude et n’impose pas plus explicitement une lecture technique de résurrection.
translation_notes:
  register: 'Français moderne, digne et accessible. La répétition « création… créée » est volontaire : elle reproduit l’insistance du latin creatam creaturam. « Tous ensemble » maintient l’ambiguïté entre totalité collective et simultanéité, sans surinterprétation.'
