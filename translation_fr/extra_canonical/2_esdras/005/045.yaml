- from: 'Et je dis : « Comment donc as-tu dit à ton serviteur que tu donnerais assurément la vie, tous ensemble, à la création que tu as créée[a] ? Si donc les vivants doivent vivre tous ensemble et que la création le supporte, elle peut aussi, dès maintenant, porter tous ceux qui sont présents ensemble. »'
  to: 'Et je dis : « Comment donc as-tu dit à ton serviteur que tu donneras assurément la vie à la création que tu as créée, tout entière ? Si donc les vivants vivront tous ensemble et que la création endurera, elle peut aussi maintenant porter tous ceux qui sont présents ensemble. »'
