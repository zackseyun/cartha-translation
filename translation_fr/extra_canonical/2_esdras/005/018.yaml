  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
translation:
  language: fr
  text: Lève-toi donc et goûte au pain de quelqu’un ; ne nous abandonne pas comme un berger abandonne son troupeau aux mains de loups malfaisants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exsurge
  choice: Lève-toi
  rationale: Rend directement l’impératif latin dans un français naturel et digne.
- source_word: gusta panem alicuius
  choice: mange un peu de pain
  rationale: « Gusta » peut signifier goûter ou prendre de la nourriture ; avec « panem alicuius », le contexte appelle naturellement l’idée de manger un peu de pain.
- source_word: derelinquas
  choice: abandonne
  rationale: Exprime le fait de délaisser ou de livrer sans protection.
- source_word: in manibus luporum malignorum
  choice: aux mains de loups malfaisants
  rationale: Conserve la métaphore anthropomorphique du latin et le mouvement implicite d’une remise au pouvoir des loups.
theological_decisions:
- issue: Nature des loups qualifiés de « malignorum »
  choice: loups malfaisants
  alternative: loups mauvais
  rationale: « Malfaisants » exprime leur caractère nuisible sans transformer explicitement l’image en référence spirituelle ou démoniaque.
translation_notes:
  register: Français international moderne, courant et digne. La comparaison pastorale et l’image inhabituelle des loups ayant des « mains » sont maintenues afin de préserver la formulation du texte latin.
