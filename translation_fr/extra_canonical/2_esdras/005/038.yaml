source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uidere. Et dixi: dominator domine, quis enim est qui potest haec scire, nisi qui cum hominibus habitationem non habet?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/038.yaml
  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: fr
  text: 'Et je dis : « Seigneur, Maître, qui donc peut connaître ces choses, sinon celui qui n’habite pas parmi les humains ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Seigneur, Maître
  rationale: Conserve les deux appellations successives du latin et leur solennité, sans les fondre en un seul titre.
- source_word: quis enim
  choice: qui donc
  rationale: Rend la valeur insistante et argumentative de « enim » dans une interrogation naturelle en français.
- source_word: potest haec scire
  choice: peut connaître ces choses
  rationale: Reproduit directement l’idée de capacité exprimée par « potest » et le sens de « scire ».
- source_word: nisi qui
  choice: sinon celui qui
  rationale: Préserve la formulation exceptive et l’indétermination du référent.
- source_word: cum hominibus habitationem non habet
  choice: n’habite pas parmi les humains
  rationale: Expression française naturelle qui garde l’idée d’absence de résidence au milieu des êtres humains; « humains » rend « hominibus » de manière inclusive et actuelle.
theological_decisions:
- issue: Identité de « celui qui »
  choice: Maintenir le référent implicite
  alternative: Expliciter qu’il s’agit de Dieu ou d’un être céleste
  rationale: Le latin ne nomme pas le référent; l’expliciter résoudrait indûment l’ambiguïté du texte.
translation_notes:
  register: Français moderne, digne et accessible. La double adresse « Seigneur, Maître » et la question rhétorique sont conservées.
