source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus multiplicatis populis adquisisti tibi populum unum, et ab omnibus probatam legem donasti huic quem desiderasti populo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/027.yaml
  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
translation:
  language: fr
  text: Et parmi tous les peuples qui se sont multipliés, tu t’es acquis un seul peuple, et à ce peuple que tu as désiré, tu as donné la loi approuvée par tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex omnibus multiplicatis populis
  choice: parmi tous les peuples qui s’étaient multipliés
  rationale: Rend le sens distributif de « ex omnibus » et la forme participiale de « multiplicatis » dans un français naturel, sans réduire l’expression au simple sens de « nombreux peuples ».
- source_word: adquisisti tibi populum unum
  choice: tu t’es acquis un seul peuple
  rationale: Conserve l’idée d’acquisition pour soi exprimée par « adquisisti tibi » ainsi que l’opposition entre la multitude des peuples et « un seul peuple ».
- source_word: quem desiderasti populo
  choice: ce peuple que tu désirais
  rationale: Traduit directement « desiderasti » sans le remplacer par « choisi », ce qui préserverait moins bien la nuance affective du latin.
- source_word: ab omnibus probatam legem
  choice: la loi approuvée par tous
  rationale: Suit la construction passive du latin et maintient l’indétermination du référent de « omnibus ».
theological_decisions:
- issue: Rapport entre les nombreux peuples et le peuple unique
  choice: « parmi tous les peuples… un seul peuple »
  alternative: « de tous les nombreux peuples… un peuple »
  rationale: La formulation retenue préserve clairement le contraste rhétorique du passage sans préciser l’identité du peuple au-delà de ce que dit le texte.
- issue: Sens de « desiderasti »
  choice: « que tu désirais »
  alternative: « que tu avais choisi »
  rationale: Le texte latin parle de désir, non explicitement d’élection; la traduction évite donc d’importer une formulation théologique plus déterminée.
- issue: Référent de « tous » dans l’approbation de la loi
  choice: référent laissé implicite
  alternative: « approuvée par tous les peuples »
  rationale: Le latin « ab omnibus » ne répète pas « populis »; conserver « par tous » maintient cette ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le parallélisme latin tout en évitant une tournure excessivement littérale. La note anglaise signalant l’ancien rendu n’est pas reprise, car ce rendu provenait du verset suivant et ne constitue pas une variante textuelle de ce verset.
