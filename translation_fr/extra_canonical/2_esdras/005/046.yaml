  yaml_path: translation/extra_canonical/2_esdras/005/046.yaml
  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: fr
  text: 'Tu lui diras : « Si tu en enfantes dix, pourquoi au fil du temps ? Demande-lui donc d’en mettre dix au monde en une seule fois. » Et je répondis : « Elle ne pourra certainement pas le faire, mais… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  choice: Tu lui diras
  rationale: Reproduit directement le futur latin et le référent féminin implicite, sans ajouter « femme » ni « ventre ».
- source_word: decem si paris
  choice: Si tu en enfantes dix
  rationale: « Enfanter » rend naturellement parere dans ce contexte; « en » laisse implicite le nom des enfants, comme le latin.
- source_word: quare per tempus?
  choice: pourquoi au fil du temps ?
  rationale: Rend la succession temporelle exprimée par per tempus sans préciser artificiellement « par étapes ».
- source_word: roga ergo eam ut det decem in unum
  choice: Demande-lui donc d’en donner dix en une seule fois
  rationale: Conserve le verbe général dare (« donner ») et rend in unum comme une simultanéité; le français exige ici la reprise pronominale « lui ».
- source_word: non utique poterit
  choice: Elle ne le pourra certainement pas
  rationale: Le futur de possum est conservé, et utique reçoit sa valeur emphatique.
- source_word: sed
  choice: mais…
  rationale: Les points de suspension signalent que la réplique demeure inachevée à la fin du verset.
theological_decisions:
- issue: Identité du référent féminin
  choice: Maintenir le simple pronom « lui/elle »
  alternative: Expliciter « le ventre d’une femme » ou « une femme »
  rationale: Le fragment latin fourni ne nomme pas le référent; l’expliciter dans le texte résoudrait une donnée contextuelle que ce verset laisse implicite.
- issue: Sens de « det »
  choice: « donner »
  alternative: « mettre au monde » ou « enfanter »
  rationale: Le latin passe de parere à dare. Garder cette variation évite d’harmoniser silencieusement les deux verbes, même si le sens contextuel est celui de donner naissance.
translation_notes:
  register: Français international moderne, clair et digne. Tutoiement conservé dans l’injonction adressée au référent féminin. La syntaxe garde l’étrangeté relative du référent implicite et l’interruption finale du fragment.
