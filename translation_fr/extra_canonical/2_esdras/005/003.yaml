base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: fr
  text: Et la région que tu vois maintenant régner deviendra impraticable, sans sentier, et ils la verront déserte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  choice: la région
  rationale: Correspondance directe et naturelle, qui évite de restreindre le sens à une terre ou à un pays précis.
- source_word: quam nunc vides regnare
  choice: que tu vois maintenant régner
  rationale: Conserve la personnification et la formulation inhabituelle du latin sans préciser de quelle manière cette région exerce sa domination.
- source_word: inconposita vestigio
  choice: impraticable, sans même un sentier
  rationale: Le latin est difficile et probablement altéré; cette formulation rend l'idée d'un espace dépourvu de trace ou de chemin praticable tout en signalant son caractère sauvage.
- source_word: et videbunt eam desertam
  choice: et on la verra déserte
  rationale: Le pronom indéfini français rend naturellement le pluriel non précisé videbunt, sans inventer l'identité des observateurs; déserte traduit desertam sans ajouter l'idée qu'elle aurait été activement dévastée.
theological_decisions:
- issue: Identité du sujet de videbunt (« ils verront »)
  choice: Sujet indéfini rendu par « on »
  alternative: « ils la verront déserte »
  rationale: Le contexte fourni ne désigne pas les observateurs. « On » préserve cette indétermination et évite en français un « ils » sans antécédent.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve l'image prophétique ainsi que l'étrangeté voulue de la région qui « règne », tout en rendant intelligible la locution latine difficile inconposita vestigio.
