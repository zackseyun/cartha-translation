revisions:
- from: 'Considère donc aussi ceci pour toi-même : vous êtes de plus petite stature que ceux qui vous ont précédés, et ceux qui viendront après vous seront plus petits que vous, car la création vieillit déjà et laisse derrière elle la vigueur de la jeunesse.'
  to: 'Réfléchis aussi à ceci : vous êtes de plus petite stature que ceux qui vous ont précédés, et ceux qui viendront après vous seront plus petits que vous, comme dans le cas d’une création qui vieillit déjà et laisse derrière elle la vigueur de la jeunesse.'
  rationale: La révision remplace la conjonction causale par une comparaison explicite, afin de refléter quasi et de préserver l’image littéraire du latin. Elle allège également l’ouverture, tout en conservant le passage de l’adresse singulière au pluriel collectif et les termes principaux du texte.
