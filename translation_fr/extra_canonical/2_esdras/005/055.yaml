source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: his qui ante uos, Et qui post uos quam et uos, quasi iam senescentis creaturae et fortitudinem iuuentutis praeterientis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: fr
  text: 'Réfléchis aussi à ceci : vous êtes de plus petite stature que ceux qui vous ont précédés, et ceux qui viendront après vous seront plus petits que vous, comme dans le cas d’une création qui vieillit déjà et laisse derrière elle la vigueur de la jeunesse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: senescentis creaturae
  choice: la création vieillit déjà
  rationale: Rend directement l’image d’une création en train de vieillir, dans un français naturel et actuel.
- source_word: fortitudinem iuventutis praeterientis
  choice: laisse derrière elle la vigueur de la jeunesse
  rationale: 'Exprime le mouvement suggéré par praeterire : la création dépasse le stade où elle possédait la force propre à la jeunesse.'
- source_word: uos
  choice: vous
  rationale: Conserve le pluriel latin, qui vise Esdras avec les gens de son époque, malgré l’adresse personnelle initiale au singulier.
theological_decisions:
- issue: Le déclin progressif de la création
  choice: Conserver l’image cosmique du vieillissement et de la perte de vigueur
  alternative: Reformuler comme un simple déclin des générations humaines
  rationale: Le latin parle explicitement de la création vieillissante ; la formulation ne doit pas réduire cette tension à une observation seulement anthropologique.
translation_notes:
  register: Français moderne, clair et digne. L’alternance entre l’adresse personnelle au singulier (« pour toi-même ») et le pluriel (« vous ») est maintenue, conformément au sens du passage. Aucun marqueur de note n’est nécessaire.
