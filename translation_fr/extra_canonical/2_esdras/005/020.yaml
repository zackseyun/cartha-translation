lexical_decisions:
- source_word: ieiunavi diebus septem
  choice: je jeûnai pendant sept jours
  rationale: Rend directement le parfait latin et la durée exprimée par l’ablatif, dans un français naturel.
- source_word: ululans et plorans
  choice: poussant des lamentations et pleurant
  rationale: 'Distingue les deux participes : « ululans » évoque des lamentations exprimées à haute voix, tandis que « plorans » signifie pleurer.'
- source_word: mandavit
  choice: avait ordonné
  rationale: Le plus-que-parfait marque naturellement en français que l’ordre de l’ange précédait le jeûne.
