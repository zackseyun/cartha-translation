- source_word: insipiens
  choice: je manque de sagesse
  rationale: Cette formulation naturelle exprime l'absence de sagesse indiquée par le latin, sans donner au locuteur une étiquette inutilement brutale comme « insensé ».
- source_word: quomodo potero dicere
  choice: comment pourrais-je donc parler
  rationale: Le conditionnel français rend naturellement l'incapacité mise en question par le futur potentiel latin ; « donc » restitue la liaison portée par et.
- source_word: de his quibus
  choice: de ces choses au sujet desquelles
  rationale: La tournure conserve le caractère suspendu de la proposition relative latine au lieu de compléter le sens à partir du contexte.
