  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
translation:
  language: fr
  text: Ils peineront, mais leurs voies ne seront pas dirigées. Il m’a été permis de te faire connaître ces signes. Si tu pries à nouveau, si tu pleures comme tu pleures maintenant et si tu jeûnes pendant sept jours, tu entendras à nouveau des choses plus grandes que celles-ci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: laborabunt
  choice: Ils peineront
  rationale: Rend directement l’idée d’un effort pénible, tout en restant naturel et digne en français.
- source_word: non dirigentur uiae eorum
  choice: leurs voies ne seront pas rendues droites
  rationale: Conserve l’image des voies que l’on dirige ou redresse, sans réduire d’emblée l’expression à la seule idée de réussite matérielle.
- source_word: signa dicere tibi
  choice: te révéler ces signes
  rationale: Dans ce contexte de révélation prophétique, « révéler » exprime naturellement l’autorisation de faire connaître les signes, plutôt qu’un simple acte de parole.
- source_word: audies iterato horum maiora
  choice: tu entendras encore des choses plus grandes que celles-ci
  rationale: Reproduit le comparatif latin et le nouvel acte d’audition annoncé, sans préciser la nature des révélations au-delà du texte.
theological_decisions:
- issue: Sens de l’image « leurs voies ne seront pas dirigées »
  choice: leurs voies ne seront pas rendues droites
  alternative: leurs entreprises ne réussiront pas
  rationale: La formulation retenue préserve la métaphore et sa possible portée morale, providentielle ou pratique, plutôt que de trancher exclusivement en faveur de la prospérité ou du succès.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le tutoiement suit la parole adressée directement à Esdras. La répétition de « si » clarifie naturellement les trois conditions coordonnées.
