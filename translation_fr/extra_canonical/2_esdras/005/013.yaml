    issue: « leurs voies ne seront pas rendues droites »
    rationale: Cette formulation est peu naturelle en français moderne et transforme inutilement le passif dirigentur en une périphrase. « Leurs voies ne seront pas dirigées » est plus proche du texte et préserve son ambiguïté.
  - severity: low
    issue: « te révéler ces signes »
    rationale: Le latin dicere signifie d’abord « dire »; « faire connaître » est naturel dans le contexte et évite d’ajouter la nuance spécifique de « révéler ».
  - severity: low
    issue: « si tu pleures comme maintenant »
    rationale: L’expression est compréhensible, mais « comme tu pleures maintenant » explicite naturellement le verbe sous-entendu par sicut et nunc.
