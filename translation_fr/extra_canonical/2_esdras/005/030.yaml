id: 2ES.5.30
reference: 2 Esdras 5:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si odiens odisti populum tuum tuis manibus debet castigari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/030.yaml
  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
translation:
  language: fr
  text: Et si vraiment tu hais ton peuple, il doit être châtié par tes propres mains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: odiens odisti
  choice: vraiment tu hais
  rationale: La répétition latine, probablement calquée sur une construction sémitique intensive, renforce le verbe sans imposer l’idée plus absolue de « haïr totalement ».
- source_word: populum tuum
  choice: ton peuple
  rationale: Rend directement le possessif et conserve la tension entre la haine évoquée et l’appartenance du peuple à Dieu.
- source_word: tuis manibus
  choice: de tes propres mains
  rationale: « propres » exprime naturellement en français l’insistance portée par le possessif latin.
- source_word: debet castigari
  choice: il doit être châtié
  rationale: Le passif et la nécessité exprimée par debet sont conservés; « châtié » rend castigari comme une correction punitive, sans le réduire à une simple discipline.
theological_decisions:
- issue: La déclaration selon laquelle Dieu haïrait son peuple
  choice: 'Conserver la formulation conditionnelle directe : « si vraiment tu hais ton peuple »'
  alternative: Atténuer en « si tu rejettes ton peuple »
  rationale: Le latin emploie explicitement odisti, « tu hais ». L’atténuer supprimerait la tension rhétorique et théologique du texte.
- issue: L’agent du châtiment
  choice: « de tes propres mains »
  alternative: « par toi-même »
  rationale: La métaphore des mains appartient au texte source et souligne que le châtiment ne devrait pas être abandonné à des agents étrangers.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La structure conditionnelle et la tension théologique du latin sont préservées.
