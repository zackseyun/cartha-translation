source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pertransiit iustitia, iustum faciens ? et haec negabit. Et erit in illo tempore, et sperabunt homines et non impetrabunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
translation:
  language: fr
  text: 'La justice est-elle passée, ou celui qui pratique la justice est-il passé ? Elle répondra : « Non. » En ce temps-là, les humains espéreront, mais ils n’obtiendront pas ;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pertransiit
  choice: est-elle passée
  rationale: Rend le parfait latin et la valeur interrogative indiquée par le contexte, sans préciser davantage l’idée de passage.
- source_word: iustitia
  choice: la justice
  rationale: Équivalent direct et naturel de iustitia, en maintenant sa possible personnification dans la proposition suivante.
- source_word: iustum faciens
  choice: celui qui pratique la justice
  rationale: Rend l’expression comme une tournure sémitisante désignant la personne qui agit justement, plutôt que comme « celui qui rend juste ».
- source_word: haec negabit
  choice: 'Elle répondra : « Non. »'
  rationale: Le féminin haec renvoie le plus naturellement à « la justice »; dans ce contexte interrogatif, negabit signifie qu’elle donnera une réponse négative.
- source_word: homines
  choice: les humains
  rationale: Exprime la portée générique du latin en français international moderne.
- source_word: non impetrabunt
  choice: ils n’obtiendront rien
  rationale: Impetrabunt désigne l’obtention de ce que l’on espère ou sollicite; « rien » complète naturellement le verbe en français sans définir l’objet absent du latin.
theological_decisions:
- issue: Référent et portée de « haec negabit »
  choice: '« Elle répondra : “Non.” », avec « la justice » comme antécédent probable'
  alternative: « Celle-ci le niera » ou « Et la réponse sera non »
  rationale: L’accord féminin favorise iustitia comme référent, mais le latin demeure abrupt. La formulation choisie conserve la personnification et le lien avec la question sans ajouter d’interprétation doctrinale.
- issue: Sens de « iustum faciens »
  choice: une personne qui pratique la justice
  alternative: une personne qui rend juste
  rationale: La tournure correspond vraisemblablement à l’idiome « faire/pratiquer la justice »; ce choix évite d’introduire ici une affirmation théologique sur la justification.
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation interrogative clarifie la syntaxe abrupte du latin. Le point-virgule final est conservé pour signaler que la phrase prophétique se poursuit au verset suivant, sans y importer le contenu de 5.13.
