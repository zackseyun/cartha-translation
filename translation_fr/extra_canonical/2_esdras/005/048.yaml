  text: And he said to me, 'So I also gave the womb of the earth to those who were sown upon it in their time.'
translation:
  language: fr
  text: 'Et il me dit : « Ainsi, moi aussi, j’ai donné la matrice de la terre à ceux qui y ont été semés, en leur temps. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vulvam terrae
  choice: le sein de la terre
  rationale: Cette expression conserve l’image organique de la terre qui porte et enfante, tout en restant naturelle et digne en français moderne.
- source_word: seminati sunt super eam
  choice: y ont été semés
  rationale: Le passif et la métaphore des êtres humains semés dans la terre sont maintenus; « y » rend naturellement super eam.
- source_word: per tempus
  choice: en leur temps
  rationale: Cette formulation respecte la valeur temporelle du latin dans le contexte d’êtres appelés à paraître au moment qui leur est assigné, sans préciser davantage la durée ou l’échelonnement.
- source_word: sic et ego
  choice: De même, moi aussi
  rationale: La formulation conserve à la fois la comparaison introduite par sic et l’insistance de et ego.
theological_decisions:
- issue: Image de la terre comme lieu de gestation des êtres humains
  choice: Conserver l’image par « le sein de la terre »
  alternative: « la matrice de la terre » ou « le ventre de la terre »
  rationale: « Sein » transmet l’idée de gestation sans imposer une lecture anatomique trop crue ni réduire la métaphore à une simple localisation.
translation_notes:
  register: Français moderne, clair et soutenu. La répétition emphatique « moi aussi » ainsi que les métaphores de la gestation et des semailles sont volontairement conservées.
