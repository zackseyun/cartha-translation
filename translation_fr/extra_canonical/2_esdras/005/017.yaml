  - severity: low
    issue: La note propose « au-delà de leur migration », formulation peu naturelle et qui ne situe pas clairement la difficulté de trans.
    rationale: Il est préférable de signaler que le latin peut se comprendre comme une localisation « au-delà de » l’exil/la migration, sans présenter une littéralité française maladroite comme unique alternative.
