  yaml_path: translation/extra_canonical/2_esdras/005/017.yaml
  text: Or do you not know that Israel has been entrusted to you in the land of their exile?[a]
translation:
  language: fr
  text: Ou bien ne sais-tu pas qu’Israël t’a été confié dans le pays de leur exil ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin de cette expression est difficile ; on peut aussi comprendre : « dans la région au-delà de leur exil » ou « de leur migration ».'
    reason: Préserver l’ambiguïté de in regione trans migrationis eorum sans imposer le sens plus spécifique de « déportation ».
lexical_decisions:
- source_word: tibi creditus est Israel
  choice: Israël t’a été confié
  rationale: Rend directement l’idée de responsabilité confiée à l’interlocuteur, avec une formulation française naturelle.
- source_word: in regione trans migrationis eorum
  choice: dans le pays où ils ont été déportés
  rationale: Le latin, textuellement difficile, situe Israël dans la région de sa migration forcée; « déportés » exprime clairement le contexte d’exil sans prolonger le verset suivant.
theological_decisions:
- issue: Identité du destinataire chargé d’Israël
  choice: Conserver le pronom « tu » sans explicitation
  alternative: Identifier explicitement Esdras comme responsable d’Israël
  rationale: Le texte s’adresse directement à Esdras, mais ne le nomme pas dans ce verset; l’expliciter introduirait une interprétation absente de la source.
translation_notes:
  register: Français moderne, digne et direct. Le verset s’arrête à la question, conformément à la délimitation corrigée; la suite (« Lève-toi donc… ») appartient au verset suivant.
