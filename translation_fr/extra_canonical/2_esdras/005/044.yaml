source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'spondit ad me et dixit : non potest festinare creatura super creatorem, nec sustinere saeculum qui in eo creati sunt in unum. Et dixi : quomodo dixisti seruo tuo, quoniam uiuificans uiuifi-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
translation:
  language: fr
  text: 'Il me répondit : « La créature ne peut aller plus vite que le Créateur, et le monde ne peut contenir en même temps tous ceux qui ont été créés en lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creatura
  choice: la créature
  rationale: Rend directement le singulier latin tout en pouvant désigner de façon générale l’être créé; le contraste avec « le Créateur » est ainsi conservé.
- source_word: festinare super
  choice: aller plus vite que
  rationale: Exprime naturellement en français la valeur comparative de super avec festinare, sans lui donner à tort un sens spatial.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte, désigne l’ordre du monde ou l’âge présent envisagé comme le cadre où vivent les êtres créés; « le monde » est clair et naturel en français.
- source_word: sustinere
  choice: contenir
  rationale: Le verbe décrit ici la capacité du monde à recevoir ou porter tous ses habitants; « contenir » rend cette idée sans suggérer seulement l’endurance.
- source_word: in unum
  choice: en même temps
  rationale: Rend l’idée de réunion simultanée de tous les êtres créés dans le monde.
theological_decisions:
- issue: Rapport entre la créature et le Créateur
  choice: Conserver la comparaison temporelle « aller plus vite que »
  alternative: « devancer le Créateur »
  rationale: La formulation retenue préserve l’image de la hâte et n’ajoute pas l’idée plus interprétative d’une opposition à l’initiative divine.
- issue: Sens de saeculum
  choice: « le monde »
  alternative: « l’âge » ou « le siècle »
  rationale: « Le monde » convient mieux à la proposition selon laquelle il contient ceux qui ont été créés en lui, tout en laissant subsister la portée cosmique et temporelle du terme latin.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est allégée en supprimant le redoublement littéral « répondit et dit », courant dans le latin biblique mais peu naturel en français. La phrase tronquée qui suit dans l’extrait source appartient au verset suivant et n’est pas incluse.
