- from: Et ceux qui s’opposaient à tes promesses ont foulé aux pieds ceux qui croyaient à tes alliances.[a]
  to: Et ceux qui s’opposaient à tes promesses et qui croyaient à tes alliances l’ont foulé aux pieds.[a]
  rationale: La révision rétablit les deux relatives comme sujet coordonné du verbe « ont foulé aux pieds ». Elle ne suit pas ici la segmentation syntaxique de la traduction anglaise de contrôle, car celle-ci traite à tort le second qui nominatif comme si son référent était l’objet du verbe. Le pronom objet français reprend l’antécédent déjà établi par le contexte, que le latin laisse implicite dans cette proposition.
