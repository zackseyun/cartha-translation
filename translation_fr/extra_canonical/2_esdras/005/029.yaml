  text: And those who opposed your promises have trampled those who believed your covenants[a].
translation:
  language: fr
  text: Et ceux qui s’opposaient à tes promesses et qui croyaient à tes alliances l’ont foulé aux pieds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une ancienne traduction de ce vers donnait plutôt le texte correspondant au verset suivant : « Et si, dans ta haine, tu as haï ton peuple, il devrait être châtié par tes propres mains. »'
    reason: Signale l’ancienne leçon due au décalage de verset, conformément à la couche de consultation anglaise, sans la présenter comme une variante du latin fourni pour ce verset.
lexical_decisions:
- source_word: conculcaverunt
  choice: ont foulé aux pieds
  rationale: Rend directement l’image forte du verbe latin, qui exprime le fait de piétiner et, au sens figuré, d’opprimer.
- source_word: contradicebant
  choice: s’opposaient à
  rationale: Dans ce contexte, le verbe désigne une opposition aux promesses divines plutôt qu’une simple contradiction verbale.
- source_word: sponsionibus tuis
  choice: tes promesses
  rationale: « Sponsio » renvoie ici à des engagements ou promesses; ce choix le distingue de « testamentis » dans la seconde proposition.
- source_word: testamentis
  choice: alliances
  rationale: Dans le latin biblique, « testamentum » traduit couramment l’idée d’alliance; le pluriel du texte source est conservé.
- source_word: credebant
  choice: croyaient à
  rationale: Conserve la formulation latine et son objet au datif, tout en restant naturelle en français.
theological_decisions:
- issue: Distinction entre sponsiones et testamenta
  choice: « promesses » et « alliances »
  alternative: « engagements » et « pactes »
  rationale: La distinction lexicale du latin est préservée sans identifier artificiellement les deux notions ni leur donner une portée confessionnelle particulière.
- issue: Sens de la foi envers les alliances
  choice: « croyaient à tes alliances »
  alternative: « avaient foi en tes alliances »
  rationale: La traduction garde l’expression inhabituelle et la tension du texte source, au lieu de la reformuler comme fidélité ou observance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle du latin est conservée, ainsi que la force imagée de « foulé aux pieds ».
