review_pass:
  verdict: revise
  source_fidelity: 'Le sujet de conculcaverunt est formé par les deux relatives coordonnées : qui contradicebant sponsionibus tuis quique tuis testamentis credebant (« ceux qui s’opposaient à tes promesses et qui croyaient à tes alliances »). Le projet inverse cette relation en faisant de « ceux qui croyaient à tes alliances » l’objet de « ont foulé aux pieds », ce que le latin ne permet pas : il faudrait alors un relatif à l’accusatif (quos), non qui. L’objet de « l’ont foulé aux pieds » est sous-entendu dans cet extrait et renvoie à l’antécédent du contexte immédiat.'
  naturalness: La correction conserve une phrase française moderne et claire. « Croyaient à tes alliances » est recevable et reproduit sans surinterprétation le credere suivi du datif. Le pronom « l’ » rend explicitement, en français, l’objet contextuellement sous-entendu du verbe latin.
  terminology: « Promesses » pour sponsionibus et « alliances » pour testamentis préservent utilement la distinction du texte latin et le pluriel d’alliances. « Foulé aux pieds » conserve l’image énergique de conculcaverunt.
