  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: fr
  text: Elle sera recherchée par beaucoup et ne sera pas trouvée ; l’injustice et le manque de maîtrise de soi se multiplieront sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur a multis et non invenietur
  choice: Elle sera recherchée par beaucoup, mais ne sera pas trouvée
  rationale: Conserve la tournure passive et le sujet implicite du latin, représenté en français par un pronom renvoyant au contexte précédent.
- source_word: iniustitia
  choice: l’injustice
  rationale: Équivalent français direct qui garde la portée morale générale du terme latin.
- source_word: incontinentia
  choice: le manque de maîtrise de soi
  rationale: Rend clairement l’idée d’absence de retenue ou de contrôle de soi sans limiter le terme au seul domaine sexuel.
- source_word: multiplicabitur super terram
  choice: se multiplieront sur la terre
  rationale: Reproduit l’image de la multiplication tout en accordant naturellement le verbe français avec les deux réalités nommées.
theological_decisions:
- issue: Référent du sujet implicite de « quaeretur »
  choice: Maintien par le pronom « Elle »
  alternative: Expliciter « la vérité » ou reformuler « Beaucoup chercheront, mais ne trouveront pas »
  rationale: Le latin laisse le référent dépendre du contexte. Le pronom français préserve ce lien sans ajouter dans ce verset un nom absent du texte fourni.
translation_notes:
  register: Français moderne, clair et digne. La structure coordonnée du latin est conservée, avec une ponctuation qui distingue les deux annonces.
