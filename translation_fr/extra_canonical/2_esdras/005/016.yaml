  text: And it happened on the second night that Phaltiel, leader of the people, came to me and said, 'Where were you, and why is your face sad?
translation:
  language: fr
  text: 'Or, la deuxième nuit, Phaltiel, chef du peuple, vint me trouver et me dit : « Où étais-tu, et pourquoi as-tu le visage triste ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est in nocte secunda
  choice: La deuxième nuit
  rationale: Rend naturellement en français la transition narrative latine et situe clairement l’action, sans conserver le calque lourd « Et il arriva que ».
- source_word: dux populi
  choice: chef du peuple
  rationale: « Chef » exprime sobrement la fonction dirigeante de Phaltiel sans préciser un rôle militaire ou politique que le contexte immédiat ne définit pas.
- source_word: uenit ad me
  choice: vint me trouver
  rationale: Formulation française idiomatique qui conserve l’idée d’une venue intentionnelle auprès du narrateur.
- source_word: quare uultus tuus tristis
  choice: pourquoi as-tu le visage triste
  rationale: Reproduit concrètement l’expression latine portant sur le visage, dans une tournure claire et actuelle.
