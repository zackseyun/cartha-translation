  text: et ex omnibus creatis volatilibus nominasti tibi columbam unam, et ex omnibus plasmatis pecoribus providisti tibi ovem unam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/026.yaml
  text: and from all the birds that have been created you named for yourself one dove[a], and from all the cattle that have been formed you provided for yourself one sheep,
translation:
  language: fr
  text: Et, parmi tous les oiseaux créés, tu as désigné pour toi une seule colombe ; et, parmi toutes les bêtes façonnées, tu as réservé pour toi une seule brebis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex omnibus creatis volatilibus
  choice: parmi tous les oiseaux créés
  rationale: « Volatilia » désigne naturellement les oiseaux; la tournure avec « parmi » rend l’idée de sélection au sein de l’ensemble.
- source_word: nominasti tibi
  choice: tu t’es choisi
  rationale: Le latin dit littéralement « tu as nommé pour toi », mais, dans ce contexte de sélection symbolique, « se choisir » est plus naturel en français tout en conservant l’orientation « pour toi ».
- source_word: columbam unam
  choice: une seule colombe
  rationale: « Unam » souligne qu’une colombe est distinguée de toutes les autres.
- source_word: ex omnibus plasmatis pecoribus
  choice: parmi tout le bétail façonné
  rationale: « Pecora » est collectif ici; « façonné » conserve la nuance de « plasmatis », formé ou modelé.
- source_word: providisti tibi
  choice: tu as pourvu à ton usage
  rationale: Cette formulation conserve le sens de pourvoir ou disposer quelque chose pour soi, sans confondre le verbe avec un simple choix.
- source_word: ovem unam
  choice: une seule brebis
  rationale: « Ovis » peut désigner un mouton ou une brebis; « brebis » convient à l’image collective et distingue un unique animal.
theological_decisions:
- issue: Portée symbolique de la colombe et de la brebis
  choice: Ne pas expliciter leur référent dans le corps du texte
  alternative: Identifier explicitement ces figures à Israël ou au peuple élu
  rationale: Le verset latin conserve les images sans en donner ici l’interprétation; la traduction préserve donc cette tension symbolique.
translation_notes:
  register: Français moderne, digne et lisible. Le parallélisme des deux propositions est maintenu, ainsi que l’insistance de « unam » par « une seule ».
