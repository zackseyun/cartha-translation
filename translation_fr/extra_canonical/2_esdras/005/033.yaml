  terminology: « Mon seigneur » convient pour dominus meus dans cette adresse et ne surinterprète pas le titre. « Israël » est conservé sans expliciter son référent. Le pronom masculin singulier de « l’as-tu aimé » préserve l’ambiguïté grammaticale et le renvoi possible à Israël.
