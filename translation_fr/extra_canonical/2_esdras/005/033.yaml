  text: 'coram te. Et dixi: loquere, dominus meus. et dixit ad me: ualde in excessu mentis factus es in Israel; aut plus dilexisti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/033.yaml
  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
translation:
  language: fr
  text: '« …devant toi. » Je dis : « Parle, mon seigneur. » Il me dit : « Tu es devenu tout à fait hors de toi à propos d’Israël ; ou bien l’as-tu aimé davantage… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: loquere
  choice: Parle
  rationale: Impératif direct et naturel, conforme au latin.
- source_word: dominus meus
  choice: mon seigneur
  rationale: Conserve l’adresse respectueuse sans transformer ici le titre en nom divin.
- source_word: ualde in excessu mentis factus es
  choice: Tu es devenu complètement hors de toi
  rationale: Rend l’idée forte d’un esprit sorti de son état normal, plus fidèlement qu’une simple détresse, tout en restant idiomatique en français.
- source_word: in Israel
  choice: au sujet d’Israël
  rationale: Le contexte indique qu’Israël est l’objet de la réaction d’Esdras ; cette formulation évite de suggérer un emplacement physique.
- source_word: aut plus dilexisti
  choice: ou bien l’as-tu aimé plus
  rationale: Préserve la question comparative inachevée du fragment latin et son référent masculin possible, Israël.
theological_decisions:
- issue: Référent de dilexisti
  choice: l’
  alternative: les / ce peuple
  rationale: Le latin ne formule pas explicitement le complément ; le pronom masculin singulier conserve le renvoi naturel à Israël sans explicitation doctrinale.
- issue: Portée de la question finale
  choice: Maintien de la phrase inachevée avec des points de suspension
  alternative: Compléter la comparaison à partir du verset suivant
  rationale: Le texte source fourni s’interrompt après plus ; le compléter importerait des mots absents de ce segment.
translation_notes:
  register: Français international moderne, digne et direct. Les points de suspension initiaux et finaux signalent que le verset fourni commence et se termine au milieu d’une phrase. « Hors de toi » garde la force de l’expression latine, malgré sa possible association moderne avec la colère ; le contexte oriente ici vers un profond dérèglement de l’esprit.
