source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
translation:
  language: fr
  text: Et maintenant, Seigneur, pourquoi as-tu livré l’unique à la multitude, préparé une seule racine au-dessus des autres et dispersé ton unique parmi la multitude ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: unum
  choice: l’unique
  rationale: Le substantif neutre désigne ici celui ou ce qui est unique, en parallèle avec « unicum tuum »; « l’unique » conserve ce sens sans préciser artificiellement le référent.
- source_word: plurimis / in multis
  choice: à la multitude / parmi la multitude
  rationale: Ces expressions opposent l’unique au grand nombre. La légère variation française respecte les rapports différents exprimés par le datif après « livré » et par « in » après « dispersé ».
- source_word: unam radicem
  choice: une seule racine
  rationale: « Une seule » rend la valeur contrastive de « unam » face à « alias ».
- source_word: super alias
  choice: au-dessus des autres
  rationale: Traduction directe qui préserve l’idée de prééminence sans en préciser la nature.
- source_word: dispersisti
  choice: dispersé
  rationale: Rend directement l’action de répandre ou disperser en plusieurs lieux, sans l’atténuer.
- source_word: unicum tuum
  choice: ton unique
  rationale: Conserve la formulation substantivée et l’ambiguïté du référent présente dans le latin.
theological_decisions:
- issue: Référent de « unum », « unam radicem » et « unicum tuum »
  choice: Maintenir les images et désignations indéterminées du latin
  alternative: Identifier explicitement Israël ou le peuple élu
  rationale: Le contexte peut suggérer Israël, mais le verset ne nomme pas lui-même le référent; l’expliciter résoudrait une ambiguïté que le texte conserve.
- issue: Rapport entre « unum » et « unicum tuum »
  choice: Employer « l’unique » et « ton unique »
  alternative: Employer « un seul » puis « ton seul peuple »
  rationale: Cette formulation préserve l’écho lexical et la tension théologique sans ajouter le nom « peuple ».
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe interrogative reste solennelle sans archaïsme. Aucun appel de note n’est requis, car la note anglaise héritée correspond à l’ancienne traduction mal alignée du verset suivant et ne constitue pas une variante de ce texte latin.
