lexical_decisions:
- source_word: fundamenta paradisi
  choice: les fondations du paradis
  rationale: Rend directement le latin et conserve le fragment initial, qui prolonge manifestement le contexte précédent.
- source_word: decores flores
  choice: les fleurs magnifiques
  rationale: Le pluriel adjectival decores qualifie les fleurs comme belles ou splendides; « magnifiques » est naturel et digne en français moderne.
- source_word: confirmarentur
  choice: soient affermies
  rationale: Conserve l'idée d'établissement ferme ou de consolidation, plus précise ici que le simple « établies ».
- source_word: motus uirtutes
  choice: les puissances des mouvements
  rationale: Suit l'ordre syntaxique latin et préserve l'ambiguïté de motus, sans imposer l'interprétation plus étroite « tremblements de terre ».
theological_decisions:
- issue: Sens cosmologique de motus
  choice: mouvements
  alternative: tremblements de terre
  rationale: Le latin motus peut désigner des mouvements en général et, selon le contexte, des séismes. Faute d'un terme source plus précis dans ce segment, la traduction conserve l'ambiguïté.
