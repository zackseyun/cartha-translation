  text: and before the beautiful flowers were seen[a], and before the powers of the movements were established, and before
translation:
  language: fr
  text: les fondations du paradis, et avant que paraissent les fleurs magnifiques, et avant que soient affermies les puissances des mouvements[a], et avant que
