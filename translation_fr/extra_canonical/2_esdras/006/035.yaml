source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post haec, et flevi iterum et similiter ieiunavi septem diebus, ut suppleam tres ebdomadas quae dictae sunt mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/035.yaml
  text: And it happened after this that I wept again, and likewise I fasted seven days, so that I might complete the three weeks that had been spoken to me.
translation:
  language: fr
  text: Après cela, je pleurai de nouveau et, de même, je jeûnai pendant sept jours, afin d’achever les trois semaines dont on m’avait parlé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est post haec
  choice: Après cela
  rationale: La formule narrative latine est rendue naturellement en français moderne sans conserver le calque lourd « et il arriva ».
- source_word: flevi iterum
  choice: je pleurai de nouveau
  rationale: Rend directement le parfait latin et l’idée de répétition exprimée par iterum.
- source_word: similiter ieiunavi septem diebus
  choice: de même, je jeûnai pendant sept jours
  rationale: « De même » conserve similiter, tandis que « pendant sept jours » exprime naturellement la durée.
- source_word: ut suppleam tres ebdomadas
  choice: afin d’achever les trois semaines
  rationale: Supplere signifie ici mener à leur terme ou compléter une période déjà entamée; « achever » est idiomatique et précis.
- source_word: quae dictae sunt mihi
  choice: dont on m’avait parlé
  rationale: Cette formulation conserve l’indétermination de l’agent dans le passif latin et rend dicere avec le sens de paroles adressées au narrateur, sans introduire l’idée d’une période « fixée » ou « prescrite ».
