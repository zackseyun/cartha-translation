source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Sion, Et antequam inuestigarentur praesentes anni, et antequam abalienarentur eorum qui nunc peccant adinuentiones, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/005.yaml
  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
translation:
  language: fr
  text: avant que les années présentes ne soient examinées à fond[a], avant que les desseins de ceux qui pèchent maintenant ne soient mis à l’écart, et avant que ne soient scellés ceux qui ont amassé la foi comme un trésor—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « recherchées ».'
    reason: inuestigarentur évoque une recherche ou un examen approfondi; la note signale l’autre rendu français naturel sans ajouter l’idée non attestée de « détermination ».
lexical_decisions:
- source_word: inuestigarentur
  choice: soient déterminées
  rationale: Le verbe latin signifie littéralement « faire l’objet d’une recherche approfondie ». Dans ce contexte de réalités fixées avant leur manifestation, « déterminer » rend naturellement l’idée tout en conservant une note signalant le sens plus littéral.
- source_word: praesentes anni
  choice: les années présentes
  rationale: Rendu formel qui préserve l’expression temporelle inhabituelle du latin sans la réinterpréter.
- source_word: abalienarentur
  choice: soient écartés
  rationale: Le passif exprime une mise à l’écart ou un éloignement. « Écartés » reste intelligible sans préciser un agent ni résoudre davantage le sens obscur du passage.
- source_word: adinventiones
  choice: les projets
  rationale: Ici, le terme désigne vraisemblablement des conceptions, desseins ou entreprises humaines. « Projets » est naturel en français et ne suppose pas nécessairement une invention matérielle.
- source_word: consignarentur
  choice: soient marqués d’un sceau
  rationale: Cette formulation conserve l’image concrète du scellement et la subordination temporelle sous-entendue par la série des antequam.
- source_word: qui fidem thesaurizaverunt
  choice: ceux qui ont amassé la foi comme un trésor
  rationale: Le complément attesté par la tradition textuelle et repris dans la couche anglaise conserve la métaphore de thesaurizare plutôt que de l’aplatir en « garder la foi ».
theological_decisions:
- issue: Relation temporelle du scellement des fidèles
  choice: Répéter « avant que » devant le dernier membre
  alternative: Faire du scellement une affirmation principale indépendante
  rationale: Le subjonctif latin consignarentur poursuit la série régie par antequam. La traduction maintient donc la subordination temporelle sans développer ses implications théologiques.
- issue: Sens des projets des pécheurs « écartés »
  choice: Conserver une formulation passive et ouverte
  alternative: Préciser qu’ils sont condamnés, empêchés ou rejetés par Dieu
  rationale: Le latin n’identifie pas explicitement l’agent ni la nature exacte de l’éloignement; une précision supplémentaire résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « avant que » restitue la structure anaphorique du latin. « Sion » au début de l’extrait fourni paraît clore le verset précédent et n’est donc pas intégré ici. Le tiret final signale que la phrase se poursuit au verset suivant.
