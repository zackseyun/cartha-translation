  naturalness: La phrase révisée reste solennelle et lisible en français moderne. « Années présentes » conserve délibérément la formulation inhabituelle du texte source; la note en explique le sens verbal. « Scellés » est plus direct et idiomatique que « marqués d’un sceau » tout en gardant l’image du latin.
  terminology: « Desseins » rend adinventiones dans son sens de projets ou conceptions; « mis à l’écart » maintient l’ambiguïté de abalienarentur. « Ont amassé la foi comme un trésor » préserve l’image de thesaurizaverunt sans imposer d’interprétation doctrinale.
