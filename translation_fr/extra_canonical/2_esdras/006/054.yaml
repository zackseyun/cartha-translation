source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et super his Adam quem constituisti ducem super omnibus factis quae fecisti, et ex eo educimur nos omnes quem elegisti populum. Haec autem omnia dixi coram te, domine, quoniam dixisti quia propter nos creasti primogenitum saeculum. Residuas autem gentes ab Adam natas dixisti eas nihil esse et quoniam saliuae adsimilatae sunt et sicut stillicidium de uaso similasti habundantiam eorum. Et nunc, domine, ecce istae gentes quae in nihilum deputatae sunt dominantur nostri et deuorant nos. Nos autem populus tuus quem uocasti primogenitum, unigenitum, aemulatorem, carissimum traditi sumus in manibus eorum. Et si propter nos creatum est saeculum, quare non haereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/054.yaml
  text: And over these is Adam[a], whom you appointed ruler over all the works that you made; and from him we all have come, the people whom you have chosen.
translation:
  language: fr
  text: Au-dessus de tout cela, il y a Adam, que tu as établi chef de toutes les œuvres que tu as faites ; de lui nous sommes tous issus, nous, le peuple que tu as choisi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super his
  choice: Au-dessus de toutes ces créatures
  rationale: L’expression renvoie aux êtres créés mentionnés dans le contexte. « Au-dessus de » conserve l’image hiérarchique du latin, tandis que « créatures » explicite naturellement le référent sans ajouter une nouvelle idée.
- source_word: ducem
  choice: chef
  rationale: « Chef » exprime ici la position d’autorité confiée à Adam et convient au registre actuel ; « dirigeant » serait trop administratif et « souverain » plus fort que le latin.
- source_word: educimur
  choice: nous sommes tous issus
  rationale: Le passif latin indique l’origine ou la descendance. Cette formulation française est naturelle et évite le sens éducatif trompeur que pourrait suggérer un calque.
- source_word: quem elegisti populum
  choice: nous, le peuple que tu as choisi
  rationale: « Le peuple que tu as choisi » est en apposition à « nous tous ». La reprise par « nous » rend cette identification nette en français sans créer deux groupes distincts.
theological_decisions:
- issue: Identification de « nous tous » au peuple choisi
  choice: Le peuple choisi est présenté comme une apposition à « nous tous ».
  alternative: « De lui sommes issus nous tous ainsi que le peuple que tu as choisi. »
  rationale: La construction latine, malgré sa rudesse, identifie les locuteurs au peuple choisi ; elle ne coordonne pas deux groupes. Cette lecture préserve aussi l’opposition développée ensuite entre ce peuple et les autres nations issues d’Adam.
- issue: Nature de l’autorité d’Adam
  choice: « chef de toutes les œuvres »
  alternative: « souverain sur toutes les œuvres »
  rationale: Le latin ducem désigne une fonction de direction ou de conduite. « Chef » garde cette portée sans importer une doctrine plus précise de souveraineté.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure solennelle de la prière tout en clarifiant l’apposition finale. Aucun marqueur de note n’est nécessaire, car l’analyse syntaxique retenue ne laisse pas subsister ici une variante de sens suffisamment probable pour justifier une note.
