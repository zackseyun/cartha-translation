  yaml_path: translation/extra_canonical/2_esdras/006/016.yaml
  text: Because the speech concerns them[a], they will tremble and be shaken, for they know that their end must be changed.”
translation:
  language: fr
  text: « Puisque cette parole les concerne, ils trembleront et seront ébranlés, car ils savent que leur fin doit être changée. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sermo (reconstitué par le contexte et la couche de consultation)
  choice: cette parole
  rationale: « Parole » rend naturellement sermo dans ce contexte prophétique sans le réduire à un simple discours.
- source_word: finem eorum
  choice: leur fin
  rationale: Conserve le référent pronominal et l’ambiguïté du latin sans préciser indûment ce qui doit prendre fin.
- source_word: oportet commutari
  choice: doit être changée
  rationale: Reproduit l’idée de nécessité exprimée par oportet et la voix passive de commutari, sans déterminer l’agent du changement.
theological_decisions:
- issue: Nature de la « fin » annoncée
  choice: leur fin doit être changée
  alternative: leur destinée doit changer
  rationale: La formulation retenue reste proche de finem et commutari et préserve la tension du texte, tandis que « destinée » introduirait une interprétation théologique plus précise.
translation_notes:
  register: Français moderne, digne et accessible. Le témoin latin fourni est matériellement tronqué au début (« bitur ») ; la première proposition est donc établie avec l’aide du contexte transmis et de la couche anglaise auditée. Aucun ajout explicatif n’est introduit dans le texte.
