  text: 'die, ut inhabitet in ea, ubi sunt montes mille; Leuiathan autem dedisti septimam partem humidam: et seruasti ea ut fiant in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/052.yaml
  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: fr
  text: Mais à Léviathan, tu as donné la septième partie, celle qui est humide, et tu les as gardés[a] pour qu’ils servent de nourriture à qui tu veux et quand tu veux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin porte ici le pluriel : « tu les as gardés ». Il peut renvoyer aux créatures mentionnées dans le contexte. Certaines traductions comprennent plutôt : « tu l’as gardé », en parlant de Léviathan.'
    reason: Préserver l’ambiguïté du référent et rendre compte du désaccord entre le pluriel latin transmis et le Léviathan singulier du contexte immédiat.
lexical_decisions:
- source_word: septimam partem humidam
  choice: la septième partie, celle qui est humide
  rationale: Cette formulation naturelle conserve l’idée que la septième part est la région humide, par opposition à la terre ferme mentionnée dans le contexte.
- source_word: ea … fiant
  choice: les … qu’ils servent
  rationale: Les deux formes latines sont au pluriel et renvoient vraisemblablement aux créatures évoquées dans le contexte, malgré le passage immédiat consacré à Léviathan.
- source_word: in [devorationem]
  choice: de nourriture
  rationale: La fin de la phrase, attestée par le contexte textuel au-delà de l’extrait fourni, exprime la destination des créatures comme nourriture; une traduction idiomatique évite le lourd « pour être dévorés ».
- source_word: quibus vis et quando vis
  choice: à qui tu veux et quand tu veux
  rationale: Rend directement la liberté divine quant aux bénéficiaires et au moment.
theological_decisions:
- issue: Référent du pluriel ea … fiant
  choice: Employer « les / ils » et signaler l’ambiguïté textuelle
  alternative: Employer le singulier « l’ / elle » en faisant de la partie humide le référent
  rationale: Le latin transmis porte des formes neutres plurielles. Les réduire silencieusement au singulier ferait disparaître une difficulté réelle et produirait en outre l’idée peu probable que la région humide elle-même devient nourriture.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du latin tout en explicitant naturellement l’apposition « celle qui est humide ». Le pluriel problématique du texte source est conservé et expliqué en note.
