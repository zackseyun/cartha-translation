  source_fidelity: 'Le sens fondamental est bien rendu : les enfants d’un an parlent, les femmes enceintes mettent au monde des enfants avant terme, et ceux-ci vivent. Toutefois, la note transforme en interprétation explicative ce que le latin laisse formulé de manière elliptique (« de trois et quatre mois »). Il convient de ne pas fixer par note le référent exact de ces mois.'
  naturalness: Le français est globalement naturel et de registre approprié. « De leur propre voix » est possible, mais « de leur voix » rend plus sobrement l’expression latine sans redondance en français.
  terminology: « Enfants d’un an » et « enfants prématurés » conviennent à anniculi infantes et immaturos ... infantes. « Trois ou quatre mois » est une formulation française naturelle pour l’énumération latine dans ce contexte.
  issues:
