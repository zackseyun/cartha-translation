  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
translation:
  language: fr
  text: Et les enfants d’un an parleront de leur voix, et les femmes enceintes mettront au monde des enfants prématurés de trois ou quatre mois, et ils vivront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: anniculi infantes
  choice: les enfants d’un an
  rationale: Rend directement l’âge indiqué par anniculi tout en conservant le sens ordinaire de infantes.
- source_word: loquentur uocibus suis
  choice: parleront de leur propre voix
  rationale: Traduction proche du latin; «de leur propre voix» conserve l’expression emphatique suis sans lui imposer une interprétation supplémentaire.
- source_word: immaturos ... infantes
  choice: des enfants prématurés
  rationale: Immaturos qualifie infantes et indique une naissance avant terme; «enfants» permet aussi de reprendre naturellement le pronom «ils».
- source_word: trium et quatuor mensium
  choice: de trois ou quatre mois
  rationale: En français idiomatique, la coordination latine peut désigner les deux âges possibles; «ou» exprime clairement cette distribution.
- source_word: et uiuent
  choice: et ils vivront
  rationale: Conserve l’affirmation étonnante et explicite du latin selon laquelle ces enfants survivront.
theological_decisions:
- issue: Nature miraculeuse des signes annoncés
  choice: Conserver littéralement la parole d’enfants d’un an et la survie d’enfants nés à trois ou quatre mois
  alternative: Atténuer ces éléments en les paraphrasant comme de simples anomalies
  rationale: Le latin présente ces événements comme des signes extraordinaires; la traduction ne doit ni les rationaliser ni les amplifier.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe coordonnée du latin est conservée sans lourdeur excessive. Aucun ajout correspondant à «bondir» ou «s’agiter» n’a été retenu, car il est absent du texte latin fourni.
