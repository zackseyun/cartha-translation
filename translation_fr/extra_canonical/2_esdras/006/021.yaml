    rationale: Le latin dit seulement « enfants de trois et quatre mois » dans le cadre d’un accouchement prématuré. Même si l’allusion à la durée de gestation est très plausible, la note la présente comme une clarification du texte et réduit une ellipse que la traduction devrait préserver.
  - severity: low
    issue: « De leur propre voix » est légèrement lourd.
    rationale: Le possessif latin suis peut être rendu naturellement par « de leur voix » en français, sans perdre l’idée que les enfants eux-mêmes parlent.
