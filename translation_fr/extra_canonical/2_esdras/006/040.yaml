  yaml_path: translation/extra_canonical/2_esdras/006/040.yaml
  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: fr
  text: Alors tu as ordonné que la lumière soit tirée de tes trésors, afin que tes œuvres apparaissent alors.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tunc
  choice: Alors
  rationale: Rend la progression temporelle du récit de la création sans alourdir la phrase.
- source_word: dixisti
  choice: tu as ordonné
  rationale: Dans ce contexte créateur, le verbe de parole exprime un commandement efficace; cette formulation française restitue naturellement cette valeur.
- source_word: de thesauris tuis proferri lumen
  choice: que la lumière soit tirée de tes réserves
  rationale: Conserve l’image de la lumière provenant des dépôts ou trésors divins, tout en employant un français actuel.
- source_word: opera tua
  choice: tes œuvres
  rationale: « Œuvres » garde la portée large du latin et convient au contexte des actes créateurs de Dieu.
theological_decisions:
- issue: Nature des « réserves » divines
  choice: Conserver l’image concrète de « tes réserves »
  alternative: « tes trésors »
  rationale: Le latin thesauri peut désigner des trésors ou des réserves. « Réserves » exprime ici plus naturellement l’idée de dépôts d’où la lumière est tirée, sans définir leur nature.
- issue: Force de la parole divine
  choice: « tu as ordonné »
  alternative: « tu as dit »
  rationale: Le contexte implique une parole créatrice impérative. La traduction ne précise toutefois ni le mécanisme ni une doctrine particulière de la création.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe demeure proche du latin, tandis que « réserves » évite l’ambiguïté moderne de « trésoreries ». Le second tunc n’est pas rendu séparément, car « alors » et l’enchaînement final suffisent en français naturel.
