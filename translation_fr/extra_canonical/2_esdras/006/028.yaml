  text: and the truth, which has been fruitless for so long, will be revealed.”
translation:
  language: fr
  text: et la vérité, restée si longtemps sans porter de fruit, sera révélée.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendebitur
  choice: sera révélée
  rationale: Le verbe latin signifie littéralement «sera montrée»; dans ce contexte, «sera révélée» exprime naturellement la manifestation publique d’une vérité jusque-là cachée ou sans effet visible.
- source_word: sine fructu fuit
  choice: restée […] sans porter de fruit
  rationale: Cette formulation conserve l’image concrète du fruit et rend l’état prolongé exprimé par fuit, sans réduire le sens à «inutile».
- source_word: tantis temporibus
  choice: si longtemps
  rationale: Rend idiomatiquement la longue durée soulignée par le latin, plutôt qu’un calque peu naturel comme «pendant de si grands temps».
theological_decisions:
- issue: Nature de la vérité demeurée sans fruit
  choice: Conserver l’expression imagée sans expliquer pourquoi ni en quel sens la vérité n’a pas porté de fruit.
  alternative: Paraphraser par «la vérité, restée si longtemps sans effet» ou préciser qu’elle était cachée.
  rationale: Le latin affirme une absence de fruit sans en définir la cause ni la portée; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore biblique du fruit est maintenue, tandis que la syntaxe est allégée pour rester naturelle.
