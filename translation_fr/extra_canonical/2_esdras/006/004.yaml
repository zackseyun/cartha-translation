id: 2ES.6.4
reference: 2 Esdras 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: colligerentur innumerabiles militiae angelorum, Et antequam extollerentur altitudines aerum, et antequam nominarentur mensurae firmamentorum, et antequam aestimaretur scabellum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
translation:
  language: fr
  text: avant que soient rassemblées les innombrables armées des anges, avant que les hauteurs de l’air soient élevées, avant que les mesures des firmaments soient nommées et avant que le marchepied soit évalué[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mesuré » ou « estimé ».
    reason: Le latin « aestimaretur » peut exprimer l’évaluation, l’estimation ou, selon le contexte, la détermination d’une mesure; « mesuré » est possible mais moins direct.
lexical_decisions:
- source_word: colligerentur innumerabiles militiae angelorum
  choice: avant que soient rassemblées les innombrables armées des anges
  rationale: Le subjonctif passif latin dépend de la série temporelle introduite par « antequam » dans le contexte. « Armées » rend naturellement « militiae » dans ce cadre angélique.
- source_word: altitudines aerum
  choice: les hauteurs de l’air
  rationale: Rend directement l’expression latine tout en employant un français naturel; le pluriel latin « aerum » n’exige pas ici « des airs », formulation moins courante.
- source_word: extollerentur
  choice: soient élevées
  rationale: Conserve le sens passif de « dresser, élever » sans préciser artificiellement le procédé.
- source_word: mensurae firmamentorum
  choice: les mesures des firmaments
  rationale: Préserve les pluriels et l’imagerie cosmologique du latin, sans harmoniser « firmamentorum » avec une conception moderne du ciel.
- source_word: nominarentur
  choice: soient nommées
  rationale: Traduction formelle de « recevoir un nom, être nommées »; l’étrangeté de l’association avec les mesures appartient au texte.
- source_word: scabellum
  choice: le marchepied
  rationale: Terme biblique courant et concret pour un support placé sous les pieds.
- source_word: aestimaretur
  choice: soit évalué
  rationale: « Aestimare » signifie d’abord estimer, évaluer ou apprécier. Ce choix reste plus proche du latin conservé que « mesurer » ou « établir ».
theological_decisions:
- issue: Nature du « marchepied »
  choice: Ne pas ajouter de complément identificatoire
  alternative: « le marchepied de Sion » ou « le marchepied de Dieu »
  rationale: Le latin transmis dit seulement « scabellum »; toute identification supplémentaire excéderait le texte source.
- issue: Sens cosmologique de « firmamentorum »
  choice: Conserver « firmaments » au pluriel
  alternative: « cieux »
  rationale: Le terme formel maintient l’imagerie et le pluriel du texte sans imposer une cosmologie harmonisée.
translation_notes:
  register: Français moderne, digne et lisible, avec répétition de « avant que » pour restituer le rythme solennel de l’énumération latine. La phrase demeure un fragment syntaxiquement rattaché au contexte précédent, comme dans la source.
