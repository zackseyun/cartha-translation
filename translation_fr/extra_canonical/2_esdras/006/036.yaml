  text: And it happened on the eighth night that my heart was troubled again within me, and I began to speak before the Most High.
translation:
  language: fr
  text: 'Et voici ce qui arriva : la huitième nuit, mon cœur fut de nouveau troublé au-dedans de moi, et je me mis à parler devant le Très-Haut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est
  choice: Et voici ce qui arriva
  rationale: Rend la formule narrative latine de façon naturelle et digne, sans la réduire à une simple conjonction.
- source_word: in octava nocte
  choice: la huitième nuit
  rationale: Traduction directe de l'indication temporelle.
- source_word: cor meum iterato turbabatur in me
  choice: mon cœur fut de nouveau troublé au-dedans de moi
  rationale: Conserve le cœur comme siège de l'intériorité, la répétition exprimée par « iterato » et l'insistance de « in me ».
- source_word: coepi loqui coram Altissimo
  choice: je me mis à parler devant le Très-Haut
  rationale: « Se mettre à » exprime naturellement l'aspect inchoatif de « coepi » ; « devant » préserve le sens de présence exprimé par « coram ».
theological_decisions:
- issue: Titre divin « Altissimus »
  choice: le Très-Haut
  alternative: le Dieu Très-Haut
  rationale: Le latin emploie ici le titre substantivé sans « Deus » ; la traduction conserve cette forme traditionnelle et non amplifiée.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche du latin tout en évitant une syntaxe artificielle.
