  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: fr
  text: Mais le sixième jour, tu as ordonné à la terre de créer devant toi les animaux domestiques, les bêtes sauvages et les êtres qui rampent ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iumenta
  choice: les animaux domestiques
  rationale: Dans cette énumération des êtres terrestres, le latin désigne collectivement les animaux domestiqués ou le bétail ; « animaux domestiques » est clair et se distingue naturellement des bêtes sauvages.
- source_word: bestias
  choice: les bêtes sauvages
  rationale: Le complément « sauvages » explicite l'opposition contextuelle avec les animaux domestiques sans restreindre le terme à une espèce particulière.
- source_word: reptilia
  choice: les êtres qui rampent
  rationale: Cette formulation rend la catégorie large des créatures qui se déplacent à terre, plutôt que le sens zoologique moderne plus étroit de « reptiles ».
- source_word: crearet coram te
  choice: de produire devant toi
  rationale: « Produire » est naturel lorsque la terre est chargée de faire paraître des êtres vivants, tandis que « devant toi » conserve coram te.
theological_decisions:
- issue: La terre reçoit l'ordre de créer ou produire les animaux
  choice: tu as ordonné à la terre de produire
  alternative: tu as ordonné à la terre de créer
  rationale: « Produire » préserve l'action attribuée à la terre sans suggérer qu'elle serait une créatrice autonome ; le commandement divin demeure explicitement la cause première.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe suit l'adresse directe à Dieu et conserve le point-virgule indiquant que la phrase se poursuit.
