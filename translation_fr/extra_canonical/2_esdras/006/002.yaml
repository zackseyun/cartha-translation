  yaml_path: translation/extra_canonical/2_esdras/006/002.yaml
  text: and before the voices of the thunders sounded, and before the flashes of the lightnings shone, and before the foundations of paradise were established,
translation:
  language: fr
  text: avant que retentissent les voix des tonnerres, avant que brillent les lueurs des éclairs, et avant que soient affermies les fondations du paradis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sonarent
  choice: retentissent
  rationale: Rend naturellement l'idée de produire un son puissant, avec pour sujet les « voix des tonnerres ».
- source_word: voces tonitruum
  choice: les voix des tonnerres
  rationale: Conserve l'image et le pluriel du latin plutôt que de les réduire au simple « tonnerre ».
- source_word: nitores coruscuum
  choice: les éclairs fulgurants
  rationale: Le texte évoque les lueurs ou éclats lumineux des éclairs; cette formulation française garde l'intensité visuelle sans lourdeur excessive.
- source_word: confirmarentur
  choice: soient affermies
  rationale: Préserve le sens de rendre ferme ou stable, appliqué aux fondations, plus précisément qu'un simple « établir ».
- source_word: paradisi
  choice: du paradis
  rationale: Équivalent direct et naturel du génitif latin.
theological_decisions:
- issue: Nature du « paradis »
  choice: Conserver « paradis » sans précision
  alternative: « jardin d'Éden » ou « demeure céleste »
  rationale: Le latin ne précise ni l'Éden ni une localisation céleste; la traduction maintient donc l'ambiguïté du terme.
translation_notes:
  register: Formulation solennelle mais actuelle, structurée par l'anaphore « avant que ». Le subjonctif présent français convient après « avant que » et exprime naturellement l'antériorité envisagée dans cette séquence.
