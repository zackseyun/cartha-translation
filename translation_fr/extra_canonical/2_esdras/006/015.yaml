  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: fr
  text: Ne t’effraie pas, car le message porte sur la fin, et les fondations de la terre trembleront et seront ébranlées, car c’est d’elles qu’il est question.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expauescas
  choice: Ne sois pas terrifié
  rationale: Rend la forte idée d’effroi du verbe latin dans une formulation française naturelle; la valeur négative suit le texte établi et le contexte transmis.
- source_word: de fine uerbum
  choice: la parole concerne la fin
  rationale: Conserve le terme général « parole » et l’ambiguïté de « la fin », sans préciser de quel accomplissement final il s’agit.
- source_word: fundamenta terrae
  choice: les fondations de la terre
  rationale: Traduction directe de l’image cosmique latine, dans un français courant et digne.
- source_word: tremescet et commoue-
  choice: trembleront et seront ébranlées
  rationale: Reproduit les deux mouvements exprimés par les verbes latins tout en accordant le prédicat au pluriel français « fondations ».
- source_word: de ipsis sermo
  choice: c’est d’elles qu’il est question
  rationale: Rend idiomatiquement la proposition latine et renvoie clairement aux fondations, sans répétition artificielle de « parole ».
theological_decisions:
- issue: Sens de « la fin »
  choice: Maintenir l’expression non précisée « la fin »
  alternative: Expliciter « la fin du monde » ou « la fin des temps »
  rationale: Le latin dit seulement « de fine »; une précision eschatologique supplémentaire résoudrait une ambiguïté que la source conserve.
translation_notes:
  register: Français international moderne, clair et solennel. La structure causale est conservée, avec deux phrases pour éviter une période trop lourde.
