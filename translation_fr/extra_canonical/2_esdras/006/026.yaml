  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
translation:
  language: fr
  text: Il sera changé dans sa manière de penser. En effet, le mal sera effacé et la tromperie disparaîtra. Mais la foi fleurira et la corruption sera vaincue,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conuertetur
  choice: Il sera transformé
  rationale: Le futur passif latin exprime un changement subi; le pronom conserve l’absence de référent explicite dans l’extrait fourni.
- source_word: in sensum alium
  choice: et recevra une autre intelligence
  rationale: Cette formulation française naturelle exprime le passage à une disposition ou compréhension différente sans préciser davantage l’ambiguïté de sensus.
- source_word: delebitur
  choice: sera effacé
  rationale: Rend l’idée de suppression complète portée par delebitur.
- source_word: dolus
  choice: la tromperie
  rationale: Terme courant qui couvre la fraude, la ruse et la duplicité.
- source_word: Florebit
  choice: fleurira
  rationale: Conserve la métaphore vive du latin.
- source_word: corruptela
  choice: la corruption
  rationale: Équivalent formel qui préserve l’étendue morale ou matérielle possible du terme.
- source_word: uincetur
  choice: sera vaincue
  rationale: Respecte le futur passif et l’image d’une victoire remportée sur la corruption.
theological_decisions:
- issue: Référent implicite de conuertetur
  choice: Maintenir le pronom « Il » sans identifier explicitement son référent
  alternative: Préciser « le cœur des habitants » ou un autre antécédent contextuel
  rationale: L’extrait latin fourni commence par un verbe dont le sujet est seulement implicite; l’identifier ici ajouterait une information absente de cette unité source.
- issue: Portée de sensus
  choice: « intelligence »
  alternative: « esprit », « pensée » ou « disposition »
  rationale: « Intelligence » garde ouverte la possibilité d’un changement de compréhension ou de faculté intérieure sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique « En effet… Mais… » et les futurs sont conservés. La virgule finale reflète le caractère inachevé de la phrase dans la source fournie.
