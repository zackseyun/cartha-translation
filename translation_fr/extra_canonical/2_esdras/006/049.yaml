base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/049.yaml
  text: 'Then you preserved two living creatures: the name of the one you called Behemoth[a], and the name of the second you called Leviathan.'
translation:
  language: fr
  text: 'Alors tu as préservé deux créatures vivantes : tu as donné à l’une le nom de Béhémoth[a], et à l’autre celui de Léviathan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Béhémoth et Léviathan sont des créatures primordiales connues des traditions scripturaires juives et des écrits juifs ultérieurs ; ici, ils figurent parmi les créatures préservées dans le récit de la création repris par Esdras.
    reason: cross_reference
lexical_decisions:
- source_word: conseruasti
  choice: tu as préservé
  rationale: Rend directement l’idée de conserver ou de garder intact, sans préciser davantage la manière dont ces créatures ont été préservées.
- source_word: duo animalia
  choice: deux créatures vivantes
  rationale: Dans ce contexte primordial, « créatures vivantes » est plus naturel et plus large que « animaux », tout en conservant le sens du latin animalia.
- source_word: nomen uni uocasti Behemoth
  choice: tu as appelé la première Béhémoth
  rationale: Formulation française naturelle qui conserve l’acte de donner un nom et prépare le parallélisme avec la seconde créature.
theological_decisions:
- issue: Nature de Béhémoth et de Léviathan
  choice: Les désigner sobrement comme des « créatures vivantes »
  alternative: Les identifier comme des monstres, des bêtes mythiques ou des symboles précis
  rationale: Le texte les présente comme deux êtres préservés lors du récit de la création sans définir ici plus précisément leur nature ni leur portée symbolique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « la première… la seconde » restitue naturellement la structure du verset. L’extrait latin fourni s’interrompt après « et » ; la seconde proposition suit la lecture attestée par la tradition textuelle consultée et reflétée dans la couche anglaise auditée.
