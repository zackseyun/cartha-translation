  yaml_path: translation/extra_canonical/2_esdras/006/050.yaml
  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
translation:
  language: fr
  text: Tu as donné au second le nom de Léviathan. Tu les as séparés l’un de l’autre, car la septième partie, où l’eau s’était rassemblée, ne pouvait les contenir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne pouvait les contenir tous les deux ».'
    reason: Le contexte renvoie à deux créatures, mais le latin dit seulement « les contenir » (ea) sans expliciter « tous les deux ».
lexical_decisions:
- source_word: nomen secundi uocasti Leuiathan
  choice: Tu as appelé le second Léviathan
  rationale: Rend naturellement la tournure latine « tu as appelé le nom du second Léviathan », où « appeler » signifie donner un nom.
- source_word: septima pars
  choice: la septième partie
  rationale: Conserve l’expression cosmologique du texte source sans l’expliciter au-delà du latin.
- source_word: aqua congregata
  choice: les eaux s’étaient rassemblées
  rationale: Le pluriel français « les eaux » convient au registre biblique et « s’étaient rassemblées » exprime l’état résultant de congregata.
- source_word: capere
  choice: contenir
  rationale: Traduit la capacité de l’espace aquatique à recevoir ou contenir les créatures.
theological_decisions:
- issue: Objet sous-entendu de « ne pouvait les contenir »
  choice: les contenir
  alternative: les contenir tous les deux
  rationale: Le latin porte seulement le pronom « ea » et n’explicite pas « tous les deux » ; la traduction préserve cette sobriété tout en renvoyant naturellement aux deux créatures.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement maintient l’adresse à Dieu. La formulation conserve la structure du latin tout en évitant le calque peu naturel « tu as appelé le nom du second ».
