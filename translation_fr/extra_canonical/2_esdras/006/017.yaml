source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'factum est cum audissem, et surrexi super pedes meos et audiui, et ecce uox loquens, et sonus eius sicut sonus aquarum multarum. Et dixit : ecce dies ueniunt, et erit quando adpro-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: fr
  text: 'Il arriva que, lorsque j’eus entendu, je me levai et me tins debout ; j’écoutai, et voici : une voix parlait, et son bruit était comme le bruit de grandes eaux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surrexi super pedes meos
  choice: je me levai et me tins debout
  rationale: Rend explicitement l’action de se lever et la posture « sur mes pieds » dans un français naturel et digne.
- source_word: ecce
  choice: voici que
  rationale: Conserve l’effet de découverte et l’intensité narrative du latin.
- source_word: sonus
  choice: bruit
  rationale: « Bruit » convient à la comparaison avec des eaux abondantes et évite de suggérer seulement le timbre de la voix.
- source_word: aquarum multarum
  choice: d’eaux abondantes
  rationale: Préserve l’image biblique d’une grande masse d’eaux sans la réduire nécessairement à plusieurs cours d’eau distincts.
theological_decisions:
- issue: Identification de la voix
  choice: une voix
  alternative: la voix de Dieu
  rationale: Le verset ne nomme pas explicitement celui qui parle; la traduction conserve cette réserve.
translation_notes:
  register: Français moderne international, narratif et solennel. La ponctuation rend la succession des perceptions sans alourdir la phrase. Le fragment latin qui suit (« Et dixit… ») appartient au verset suivant selon le découpage fourni et n’est donc pas inclus.
