source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et noli festinare in prioribus temporibus cogitare vana, ut non properes a novissimis temporibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
translation:
  language: fr
  text: Et ne t’empresse pas d’avoir de vaines pensées au sujet des temps passés[b], afin de ne pas t’impatienter au sujet des derniers temps[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre compréhension du latin : « afin de ne pas t’éloigner des derniers temps ».'
    reason: previous_rendering
  - marker: b
    text: La formulation de cet avertissement est difficile. Il semble interdire les spéculations impatientes et vaines sur les temps passés, qui fausseraient le rapport d’Esdras aux derniers temps.
    reason: textual_variant
lexical_decisions:
- source_word: noli festinare ... cogitare vana
  choice: ne t’empresse pas de nourrir de vaines pensées
  rationale: Rend l’interdiction et l’idée de spéculations vaines dans un français naturel, sans réduire cogitare à une pensée ponctuelle.
- source_word: prioribus temporibus
  choice: les temps passés
  rationale: Expression claire et actuelle pour les temps antérieurs, en contraste avec les derniers temps.
- source_word: non properes
  choice: ne pas t’impatienter
  rationale: Dans le contexte, Esdras manifeste une impatience à l’égard de la fin; ce choix conserve le rapport avec la hâte sans suggérer qu’il s’en éloigne.
- source_word: a novissimis temporibus
  choice: au sujet des derniers temps
  rationale: Prend a au sens de « quant à, concernant », conformément au parallélisme avec in prioribus temporibus et au contexte eschatologique.
theological_decisions:
- issue: Sens de « a novissimis temporibus »
  choice: au sujet des derniers temps
  alternative: loin des derniers temps
  rationale: Le sens relationnel respecte le parallélisme entre les temps antérieurs et les derniers temps; un sens spatial de séparation contredirait l’impatience d’Esdras pour la fin.
- issue: Nature de l’avertissement
  choice: une mise en garde contre les spéculations vaines et l’impatience
  alternative: une interdiction générale de réfléchir au passé ou à la fin
  rationale: Le texte condamne la hâte et les pensées vaines, non toute réflexion sur l’histoire ou l’eschatologie.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme temporel est conservé, tandis que « nourrir de vaines pensées » exprime naturellement une réflexion spéculative persistante. Tous les appels de note figurent dans le texte.
