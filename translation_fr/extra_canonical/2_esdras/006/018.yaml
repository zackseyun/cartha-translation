lexical_decisions:
- source_word: '[appro]pinquare incipio'
  choice: je commencerai à m’approcher
  rationale: Le texte transmis « pinquare » représente vraisemblablement la fin d’« appropinquare ». La tournure française au futur rend naturellement l’idée du commencement imminent exprimée dans ce contexte.
- source_word: ut uisitem
  choice: pour visiter
  rationale: Rend directement le but exprimé par « ut » avec le subjonctif. « Visiter » conserve l’ambivalence biblique d’une intervention divine pouvant être favorable ou judiciaire.
- source_word: habitantes in terra
  choice: ceux qui habitent sur la terre
  rationale: Formulation claire et proche du latin, sans réduire « terra » à un pays particulier.
- source_word: Et quando
  choice: Et lorsque
  rationale: La proposition reste volontairement inachevée, puisque l’extrait latin se poursuit au verset ou segment suivant.
theological_decisions:
- issue: Sens de la visite divine
  choice: visiter
  alternative: intervenir contre / venir au secours de
  rationale: Le latin « visitare » ne précise pas ici si cette visitation est punitive ou bienveillante; la traduction maintient cette tension.
