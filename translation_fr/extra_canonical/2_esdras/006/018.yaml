  register: 'Français moderne, digne et accessible. Le début en minuscule et la fin suspendue reflètent le fait que l’extrait latin fourni commence et s’achève au milieu d’une phrase. Les mots de l’anglais « Et il dit : Voici, des jours viennent » n’ont pas été ajoutés, car ils ne figurent pas dans la source latine fournie.'
