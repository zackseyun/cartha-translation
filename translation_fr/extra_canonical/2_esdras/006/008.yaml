  text: And he said to me[a], “From Abraham to Abraham, because from him Jacob and Esau were born; for Jacob’s hand held Esau’s heel from the beginning. For Esau is the end of this age[b], and the beginning
translation:
  language: fr
  text: 'Et il me dit : « D’Abraham jusqu’à Abraham[a], puisque Jacob et Ésaü sont nés de lui ; en effet, la main de Jacob tenait dès le commencement le talon d’Ésaü. Car Ésaü est la fin de cet âge, et le commencement… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin répète « Abraham ». Le contexte — Jacob et Ésaü sont nés d’Isaac — ainsi que d’autres versions anciennes suggèrent la leçon « d’Abraham jusqu’à Isaac ».
    reason: textual_variant
lexical_decisions:
- source_word: saeculi
  choice: monde présent
  rationale: Dans ce contexte apocalyptique, le terme désigne l’ordre ou l’âge actuel. « Monde présent » est naturel en français tout en conservant l’opposition implicite avec ce qui commence ensuite.
- source_word: calcaneum
  choice: talon
  rationale: Équivalent direct et idiomatique, qui conserve l’allusion à la naissance de Jacob et d’Ésaü.
- source_word: ab initio
  choice: dès le commencement
  rationale: Rend la valeur temporelle du latin sans l’affaiblir et maintient le lien avec « le commencement » à la fin du fragment.
theological_decisions:
- issue: Identification d’Ésaü avec la fin du monde présent
  choice: Conserver l’affirmation telle quelle
  alternative: L’expliciter comme une simple représentation symbolique
  rationale: Le texte formule directement cette identification apocalyptique. La traduction ne doit ni l’atténuer ni en imposer une interprétation doctrinale.
- issue: Seconde occurrence d’« Abraham »
  choice: Maintenir « Abraham » dans le texte et signaler la difficulté en note
  alternative: Corriger le texte en « Isaac »
  rationale: Le témoin latin fourni lit explicitement « Abraham ». Bien que le contexte et d’autres versions anciennes appuient « Isaac », une correction silencieuse éliminerait une difficulté textuelle réelle.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe explicative du latin est conservée sans lourdeur excessive. Les points de suspension indiquent que l’extrait source s’interrompt après « le commencement ».
