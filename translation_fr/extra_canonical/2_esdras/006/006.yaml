  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: fr
  text: Alors j’ai réfléchi, et ces choses ont été faites par moi et non par un autre ; de même, la fin viendra par moi et non par un autre.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogitaui
  choice: j’ai réfléchi
  rationale: Rend directement l’acte de penser ou de considérer, sans lui ajouter un complément absent du latin.
- source_word: facta sunt haec per me
  choice: ces choses ont été faites par moi
  rationale: Conserve le passif et la médiation exprimée par «per me», ainsi que le référent général «haec».
- source_word: ut et finis per me
  choice: de même, la fin viendra par moi
  rationale: Exprime naturellement en français le parallélisme de «ut et»; «viendra» supplée le verbe sous-entendu dans la seconde proposition sans présenter la fin comme une chose déjà faite.
theological_decisions:
- issue: L’action divine au commencement et à la fin
  choice: Conserver «par moi et non par un autre» dans les deux membres
  alternative: Employer «de moi seul» ou «par nul autre»
  rationale: La formulation retenue suit la répétition latine et préserve l’affirmation exclusive sans l’amplifier doctrinalement.
- issue: Nature de «la fin»
  choice: Employer simplement «la fin»
  alternative: Préciser «la fin du monde» ou «l’accomplissement»
  rationale: Le latin dit seulement «finis»; toute précision réduirait une portée laissée ouverte par le texte.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle du latin est maintenue, avec une légère explicitation verbale nécessaire à l’idiome français.
