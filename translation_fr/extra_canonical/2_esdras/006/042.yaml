source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tertio die imperasti aquis congregari in septima parte terrae, sex vero partes siccasti et conservasti, ut ex his sint coram te ministrantia seminata adeo et culta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/042.yaml
  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: fr
  text: Et le troisième jour, tu as ordonné aux eaux de se rassembler dans la septième partie de la terre ; mais tu as asséché et préservé les six autres parties, afin que des choses semées et cultivées provenant d’elles soient devant toi, à ton service.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in septima parte terrae
  choice: dans la septième partie de la terre
  rationale: Rend naturellement le lieu vers lequel les eaux sont rassemblées, sans transformer l’image cosmologique du texte.
- source_word: sex vero partes
  choice: les six autres parties
  rationale: « autres » explicite en français l’opposition entre la septième partie occupée par les eaux et les six parties asséchées, déjà impliquée par le latin.
- source_word: siccasti et conservasti
  choice: tu as asséché et préservé
  rationale: 'Conserve les deux actions distinctes : rendre les terres sèches, puis les maintenir ou les réserver dans cet état.'
- source_word: seminata adeo et culta
  choice: ce qui y serait semé et cultivé
  rationale: Rend les neutres pluriels substantivés par une tournure française fluide et rattache « ex his » aux six parties terrestres.
- source_word: coram te ministrantia
  choice: se tienne devant toi pour te servir
  rationale: Préserve à la fois l’idée de présence devant Dieu et celle de service, malgré la construction latine condensée.
theological_decisions:
- issue: Nature du service rendu par ce qui est semé et cultivé
  choice: pour te servir
  alternative: à ton service
  rationale: La formulation conserve la personnification ou la finalité cultuelle possible de « ministrantia » sans préciser comment les cultures servent Dieu.
translation_notes:
  register: Français moderne, digne et accessible. Le rythme solennel de la prière est maintenu, tandis que la syntaxe latine très condensée de la proposition finale est clarifiée sans supprimer son image de la création se tenant au service de Dieu.
