revisions:
- from: Et le troisième jour, tu as ordonné aux eaux de se rassembler dans la septième partie de la terre ; mais tu as asséché et préservé les six autres parties, afin que ce qui y serait semé et cultivé se tienne devant toi pour te servir.
  to: Et le troisième jour, tu as ordonné aux eaux de se rassembler dans la septième partie de la terre ; mais tu as asséché et préservé les six autres parties, afin que des choses semées et cultivées provenant d’elles soient devant toi, à ton service.
  rationale: 'La révision se limite à la proposition finale : elle remplace le conditionnel par le subjonctif exigé par la finalité, maintient le pluriel des réalités « semées et cultivées », et rend explicitement leur provenance des six parties préservées. Aucune note n’est nécessaire.'
