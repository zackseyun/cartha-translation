    issue: « soient créés » interprète « fieri » de manière plus marquée que nécessaire.
    rationale: Dans ce contexte créationnel, « créés » est possible, mais « fieri » signifie littéralement « être faits » et porte sur des réalités telles que l’éclat, la lumière et la disposition. « Faits » préserve mieux le choix lexical et la portée du latin.
  - severity: low
    issue: « l’ordonnance des étoiles » est moins naturel et moins direct que « la disposition des étoiles ».
    rationale: « Dispositio » désigne l’arrangement ou l’agencement ; « disposition » est son équivalent français usuel et ne suggère pas une notion normative additionnelle.
