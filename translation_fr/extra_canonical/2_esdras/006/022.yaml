source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sciritabuntur, Et subito apparebunt seminata loca non seminata, et plena prumptuaria subito inuenientur uacua, Et tuba canet cum sono, quam cum omnes audierint subito expauescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/022.yaml
  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: fr
  text: Et soudain, les terres ensemencées paraîtront ne pas l’avoir été, et les greniers pleins se retrouveront soudain vides. La trompette retentira et, dès que tous l’entendront, ils seront soudain saisis d’effroi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminata loca non seminata
  choice: les terres ensemencées paraîtront ne pas l’avoir été
  rationale: Rend le contraste paradoxal du latin tout en évitant la tournure française peu naturelle « paraîtront non ensemencées ».
- source_word: plena prumptuaria
  choice: les greniers pleins
  rationale: « Prumptuaria » désigne ici des lieux où sont conservées des provisions; « greniers » convient au parallèle avec les terres ensemencées et reste immédiatement compréhensible.
- source_word: tuba canet cum sono
  choice: La trompette retentira
  rationale: « Retentira » exprime naturellement l’émission sonore marquée par « canet cum sono », sans la lourdeur de « sonnera avec un son ».
- source_word: subito expauescent
  choice: ils seront soudain saisis d’effroi
  rationale: Conserve à la fois l’intensité de « expavescent » et la soudaineté répétée dans le texte source.
theological_decisions:
- issue: Nature des signes annoncés
  choice: Conserver les images concrètes sans les expliquer
  alternative: Les reformuler explicitement comme symboles de famine ou de jugement
  rationale: Le latin présente des phénomènes apocalyptiques sans en préciser l’interprétation; la traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « soudain » est maintenue parce qu’elle structure délibérément le verset latin. Le fragment initial « et sciritabuntur », textuellement obscur et absent de la couche anglaise auditée, n’est pas intégré au verset faute de sens suffisamment établi.
