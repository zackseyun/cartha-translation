  source_fidelity: 'Le texte français rend fidèlement les trois signes transmis par la couche latine intelligible : les lieux/terres ensemencés qui paraissent ne pas l’avoir été, les réserves pleines trouvées vides, puis la trompette dont l’audition provoque la frayeur générale. La répétition de « soudain » correspond aux trois occurrences de subito. « Retentira » rend de façon idiomatique tuba canet cum sono sans ajouter d’interprétation. Le segment initial « et sciritabuntur », manifestement obscur/corrompu dans le texte fourni et absent de l’audit anglais, est prudemment signalé mais non traduit.'
