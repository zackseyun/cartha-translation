source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixi: o Domine, loquens locutus es ab initio creaturae in primo die dicens: fiat caelum et terra, et tuum verbum opus perfecit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
translation:
  language: fr
  text: 'Et j’ai dit : « Ô Seigneur, dès le commencement de la création, le premier jour, tu as effectivement parlé en disant : “Que le ciel et la terre soient faits”, et ta parole a achevé l’œuvre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab initio creaturae
  choice: dès le commencement de la création
  rationale: Rend le point de départ exprimé par « ab initio » tout en conservant le complément « de la création ».
- source_word: loquens locutus es
  choice: tu as parlé
  rationale: La tournure latine redoublée est emphatique, mais sa reproduction littérale serait peu naturelle en français. Le contexte solennel porte l’accent sans ajout interprétatif tel que « vraiment » ou « bel et bien ».
- source_word: fiat caelum et terra
  choice: Que le ciel et la terre soient faits
  rationale: Conserve le passif et la forme jussive de « fiat », sans remplacer l’énoncé par une formulation active.
- source_word: tuum verbum opus perfecit
  choice: ta parole a achevé l’œuvre
  rationale: « Parole » rend naturellement « verbum », tandis que « a achevé » exprime l’accomplissement complet indiqué par « perfecit ».
theological_decisions:
- issue: Rôle créateur de la parole divine
  choice: ta parole a achevé l’œuvre
  alternative: ta parole a réalisé l’œuvre
  rationale: La formulation retenue préserve l’idée que la parole divine mène l’œuvre à son accomplissement, sans préciser davantage le mode de cette action.
translation_notes:
  register: Français moderne, clair et solennel. Le passé composé reste naturel pour le discours rapporté, tandis que « Ô Seigneur » et la citation jussive conservent la dignité du registre biblique.
