base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
translation:
  language: fr
  text: Mais j’ai dit tout cela devant toi, Seigneur, parce que tu as dit que c’est pour nous que tu avais créé le monde premier-né.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le monde premier-né ». Plusieurs anciennes versions ont plutôt : « ce monde ».'
    reason: Signaler la leçon littérale du latin et une variante ancienne importante, sans trancher la difficulté dans le texte.
lexical_decisions:
- source_word: autem
  choice: Mais
  rationale: Marque la transition et le contraste avec ce qui précède.
- source_word: dixi
  choice: j’ai dit
  rationale: Rend directement le parfait latin dans un français naturel.
- source_word: coram te
  choice: devant toi
  rationale: Conserve l’image de paroles prononcées en présence de Dieu.
- source_word: propter nos
  choice: pour nous
  rationale: Exprime simplement que la création a eu lieu en vue des êtres humains.
- source_word: primogenitum saeculum
  choice: le premier monde
  rationale: Suit la lecture du texte latin transmis tout en évitant l’expression française très étrange « monde premier-né »; la difficulté textuelle et le sens littéral sont signalés en note.
theological_decisions:
- issue: Sens de « primogenitum saeculum »
  choice: le premier monde
  alternative: ce monde / le monde premier-né
  rationale: Le latin conservé porte littéralement « le monde premier-né », tandis que plusieurs anciennes versions soutiennent « ce monde ». Le texte retient une formulation intelligible proche du latin sans trancher silencieusement la difficulté, qui est exposée en note.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche du latin, avec « parce que tu as dit que… »; l’imparfait « avais créé » situe naturellement la création avant la parole divine rapportée.
