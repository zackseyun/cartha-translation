  text: On the fifth day you said to the seventh part, where the water was gathered, that it should bring forth living creatures, birds, and fish;
translation:
  language: fr
  text: Le cinquième jour, tu as dit à la septième partie, où se trouvait l’eau, de produire des êtres vivants, des oiseaux et des poissons ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinto autem die
  choice: Le cinquième jour
  rationale: Rend directement l’indication temporelle latine ; « autem » sert ici surtout de transition et n’exige pas un « mais » en français.
- source_word: septimae parti
  choice: à la septième partie
  rationale: Conserve l’expression cosmologique précise et quelque peu énigmatique du texte, sans l’expliciter.
- source_word: aqua
  choice: l’eau
  rationale: Respecte le singulier latin plutôt que d’employer « les eaux ».
- source_word: ubi erat aqua
  choice: où l’eau était rassemblée
  rationale: Formulation française naturelle conforme au contexte transmis par la couche de consultation, tout en gardant « eau » au singulier.
- source_word: animalia volatilia et pisces
  choice: des êtres vivants, des oiseaux et des poissons
  rationale: Suit la portée de la couche anglaise auditée et emploie des catégories immédiatement compréhensibles en français moderne.
theological_decisions:
- issue: Sens de « la septième partie »
  choice: Maintenir littéralement « la septième partie »
  alternative: Expliciter comme « la septième partie du monde » ou « la partie couverte d’eau »
  rationale: Le verset renvoie à la répartition cosmologique exposée dans le contexte ; l’ajout d’une explication dans le corps du texte réduirait une ambiguïté réellement présente.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve l’adresse directe à Dieu et la structure de commandement du passage. Aucun marqueur de note n’est requis.
