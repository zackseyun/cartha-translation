  source_fidelity: La formule introductive latine « Et factum est » n’est pas rendue dans le projet. De plus, « mouebatur » est un imparfait passif/intransitif de mouvement progressif; « se mettait progressivement à bouger » le reflète plus exactement que le passé simple d’entrée en action « se mit ». La clause finale « Et dixit ad me » et les deux-points sont bien nécessaires et sont conservés.
  naturalness: La révision reste naturelle en français international moderne. « Et il arriva que » conserve la formule narrative sans calque lourd, et « voici que » restitue bien ecce.
  terminology: Aucun terme théologique ou nom propre n’est en jeu. La note maintient avec prudence la possibilité contextuelle d’un ébranlement sans substituer « trembler » au sens de base dans le texte.
