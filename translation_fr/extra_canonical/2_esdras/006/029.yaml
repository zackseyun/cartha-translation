    rationale: Même si elle peut être lissée dans une traduction très idiomatique, cette formule fait partie du segment source et doit être rendue dans une traduction d’équivalence optimale.
  - severity: low
    issue: Aspect de « se mit peu à peu à bouger ».
    rationale: Cette formulation est possible, mais elle présente le mouvement comme un événement ponctuel; « mouebatur » décrit plus directement un mouvement ou une mise en mouvement progressive en cours.
  - severity: low
    issue: Ajout de « Puis » pour « Et ».
    rationale: Le latin coordonne simplement (« Et il me dit »); « Puis » explicite une succession qui n’est pas nécessairement marquée au-delà de la coordination.
