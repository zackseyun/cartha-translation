  yaml_path: translation/extra_canonical/2_esdras/006/029.yaml
  text: 'And it happened[a], while he was speaking to me, behold, the place on which I was standing was gradually moving. And he said to me:'
translation:
  language: fr
  text: 'Et il arriva que, pendant qu’il me parlait, voici que le lieu sur lequel je me tenais se mettait progressivement à bouger[a]. Et il me dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mettait progressivement à trembler ».
    reason: Le latin « mouebatur » exprime d’abord un mouvement progressif, tout en pouvant, selon le contexte, évoquer un ébranlement.
lexical_decisions:
- source_word: Et factum est cum loqueretur mihi
  choice: Pendant qu’il me parlait
  rationale: La tournure latine introductive « Et factum est » est idiomatiquement intégrée à la proposition temporelle en français moderne, sans ajout de sens.
- source_word: ecce
  choice: voici que
  rationale: Conserve l’effet de soudaineté et attire l’attention sur le phénomène observé.
- source_word: paulatim mouebatur
  choice: se mit peu à peu à bouger
  rationale: Rend le caractère progressif de « paulatim » et le sens neutre de mouvement de « mouebatur », sans imposer l’idée plus précise d’un ébranlement.
- source_word: locus super quem stabam super eum
  choice: le lieu sur lequel je me tenais
  rationale: Rend naturellement le sens malgré la répétition lourde de « super » dans le latin transmis.
- source_word: Et dixit ad me
  choice: Puis il me dit
  rationale: Traduit explicitement la clause finale incluse dans le segment source et emploie « Puis » pour assurer une transition française naturelle.
