- source_word: futuro plasmato homini
  choice: l’être humain qui devait être façonné
  rationale: Conserve la référence future et l’image de façonnage portée par «plasmato»; «être humain» rend «homini» de manière inclusive et actuelle.
theological_decisions:
- issue: Identité et sexe grammatical de «homini»
  choice: l’être humain
  alternative: l’homme
  rationale: Le latin peut désigner ici l’humanité ou l’humain à venir; cette formulation évite de restreindre indûment le sens à un individu masculin tout en préservant la singularité.
