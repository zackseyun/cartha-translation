lexical_decisions:
- source_word: tuba canet
  choice: la trompette retentira
  rationale: « Retentir » rend naturellement l’idée de la trompette qui émet un son, sans la redondance qu’entraînerait une traduction explicite de « cum sono ».
- source_word: omnes
  choice: tous ceux qui
  rationale: Dans la construction française, cette formulation exprime clairement l’ensemble des personnes qui entendront la trompette.
- source_word: subito expavescent
  choice: seront soudain saisis d’effroi
  rationale: Cette expression restitue la soudaineté et la forte frayeur exprimées par « expavescent », dans un registre digne et actuel.
