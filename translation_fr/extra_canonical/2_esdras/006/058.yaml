source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos autem populus tuus quem vocasti primogenitum, unigenitum, aemulatorem, carissimum, traditi sumus in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
translation:
  language: fr
  text: Mais nous, ton peuple, que tu as appelé ton premier-né, ton unique, celui qui t’est dévoué avec ferveur[a], ton bien-aimé, nous avons été livrés entre leurs mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin emploie ici un terme difficile, qui évoque celui qui brûle de zèle et peut aussi porter une nuance de jalousie. Il s’agit de l’un des titres d’honneur accumulés pour parler d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « remis en leur pouvoir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: primogenitum
  choice: ton premier-né
  rationale: Rend directement le titre d’honneur familial et d’alliance porté par le latin.
- source_word: unigenitum
  choice: ton unique
  rationale: Préserve la distinction avec « premier-né » et le sens de singularité propre à unigenitus.
- source_word: aemulatorem
  choice: ton émule
  rationale: Le terme latin est difficile et peut évoquer l’émulation, la jalousie ou un zèle ardent. « Émule » maintient cette ambiguïté sans ajouter un complément absent du texte.
- source_word: carissimum
  choice: ton bien-aimé
  rationale: Exprime naturellement en français le superlatif affectif du latin, « celui qui est très cher ».
- source_word: traditi sumus in manibus eorum
  choice: nous avons été livrés entre leurs mains
  rationale: « Livrés » conserve la force de trado, qui signifie remettre ou abandonner au pouvoir d’autrui, tandis que « entre leurs mains » reproduit l’image du texte.
theological_decisions:
- issue: Accumulation des titres d’Israël
  choice: Conserver les quatre titres distincts dans leur ordre latin
  alternative: Les fondre en une paraphrase fluide sur l’amour particulier de Dieu pour son peuple
  rationale: La succession de « premier-né », « unique », « émule » et « bien-aimé » crée une tension rhétorique avec l’abandon du peuple aux mains d’autrui; la simplifier ferait disparaître cette tension.
- issue: Sens de aemulatorem
  choice: Employer « émule » et signaler l’incertitude en note
  alternative: Trancher en faveur de « celui qui brûle de zèle pour toi » ou de « celui dont tu es jaloux »
  rationale: Le latin permet plusieurs nuances et ne précise pas explicitement l’objet du zèle ou de la jalousie.
translation_notes:
  register: Français moderne, digne et direct. Le redoublement « nous… nous avons » est conservé parce qu’il est naturel dans cette longue construction et met en relief le contraste introduit par « Mais ». Les titres restent au singulier, comme dans le latin, puisqu’ils qualifient collectivement le peuple.
