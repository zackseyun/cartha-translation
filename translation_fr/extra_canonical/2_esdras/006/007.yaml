  text: Then I answered and said[a], “What will be the dividing of the times? Or when will be the end of the former and the beginning of the one that follows?”
translation:
  language: fr
  text: 'Alors je répondis : « Quelle sera la division des temps ? Ou quand le précédent prendra-t-il fin et le suivant commencera-t-il[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la fin du précédent et le commencement du suivant ».'
    reason: La traduction dans le corps du texte transforme les groupes nominaux latins en verbes pour obtenir une question naturelle en français, tandis que la note conserve leur forme exacte et leur parallélisme.
lexical_decisions:
- source_word: 'divisio temporum (partiellement conservé dans l’extrait : …porum)'
  choice: division des temps
  rationale: Cette formulation conserve l’image d’une démarcation entre deux périodes tout en restant claire en français.
- source_word: prioris
  choice: le précédent
  rationale: L’adjectif latin est substantivé et s’oppose directement à sequentis. « Le précédent » préserve cette structure sans préciser indûment s’il s’agit d’un temps, d’un âge ou d’un monde.
- source_word: sequentis
  choice: le suivant
  rationale: Le substantif implicite demeure volontairement non exprimé, comme en latin, et la symétrie avec « le précédent » est conservée.
theological_decisions:
- issue: Référent implicite de prioris et sequentis
  choice: 'Ne pas expliciter le référent : « le précédent » et « le suivant »'
  alternative: « l’âge précédent » et « l’âge suivant »
  rationale: Le contexte peut évoquer deux âges apocalyptiques, mais le latin transmis ne nomme pas ici explicitement des « âges ». L’ambiguïté doit donc être maintenue.
translation_notes:
  register: Français moderne, digne et accessible. « Alors je répondis » évite le pléonasme peu naturel « je répondis et dis ». La seconde question est verbalisée pour la fluidité, sans expliciter les périodes apocalyptiques sous-entendues.
