  text: 'des tiens[a], dont tu m’as montré une partie la nuit précédente. » Il me répondit : « Lève-toi, et tu entendras'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte commence ici au milieu d’une phrase : « des tiens » renvoie aux « signes » mentionnés au verset précédent. Certains découpages rattachent à ce verset les mots précédents : « afin que tu montres à ton serviteur la fin de tes signes » (ou « l’aboutissement de tes signes »).'
    reason: La frontière de verset coupe la syntaxe latine, et l’ancienne formulation anglaise incorporait au verset 12 des mots appartenant au verset 11 dans la source fournie.
lexical_decisions:
- source_word: tuorum
  choice: des tiens
  rationale: Le mot est un génitif pluriel substantivé dont le référent se trouve dans le verset précédent; la formulation fragmentaire est conservée puisque l’extrait commence au milieu de la phrase.
- source_word: ex parte
  choice: une partie
  rationale: Rend directement l’idée d’une révélation partielle, dans un français naturel.
- source_word: nocte praeterita
  choice: la nuit précédente
  rationale: Traduction temporelle précise et idiomatique, renvoyant à la nuit mentionnée auparavant.
- source_word: surge super pedes tuos
  choice: Lève-toi
  rationale: Expression française naturelle équivalant à l’ordre littéral de se mettre debout.
- source_word: audies
  choice: tu entendras
  rationale: Conserve le futur simple du latin sans préciser l’objet, lui aussi laissé ouvert par la source.
theological_decisions:
- issue: Référent de « tuorum »
  choice: Conserver « des tiens » avec une note
  alternative: Rétablir dans le corps du texte « la fin de tes signes » à partir du contexte précédent
  rationale: Le texte latin fourni commence par un génitif dépendant du verset précédent. Il ne faut ni déplacer ce matériau dans le verset 12 ni résoudre silencieusement son référent.
- issue: Formule redondante « respondit et dixit »
  choice: « Il me répondit »
  alternative: « Il répondit et me dit »
  rationale: La formulation retenue exprime pleinement l’acte de réponse dans un français digne et courant, sans lourdeur sémitisante inutile.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe fragmentaire initiale est maintenue pour respecter le découpage transmis, mais explicitée en note. La citation reste ouverte à la fin, conformément à l’extrait source.
