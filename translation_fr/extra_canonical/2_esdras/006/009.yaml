source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: finis enim huius saeculi Esau, et principium sequentis Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/009.yaml
  text: For Esau is the end of this age[a], and Jacob is the beginning of the one that follows.
translation:
  language: fr
  text: Car la fin de ce monde-ci, c’est Ésaü, et le commencement de celui qui vient, c’est Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculi
  choice: monde
  rationale: Dans ce contexte eschatologique, « monde » désigne l’ordre présent envisagé dans sa durée; « ce monde-ci » le distingue naturellement de celui qui vient.
- source_word: sequentis
  choice: celui qui vient
  rationale: Cette formulation reprend implicitement « monde » et exprime naturellement en français le monde à venir.
- source_word: finis … principium
  choice: la fin … le commencement
  rationale: Les équivalents directs préservent le parallélisme et le contraste du latin.
theological_decisions:
- issue: Rapport symbolique entre Ésaü/Jacob et les deux mondes
  choice: Conserver les identifications prédicatives sans les expliquer
  alternative: Paraphraser Ésaü comme représentant du monde présent et Jacob comme représentant du monde à venir
  rationale: Le latin formule une identification concise et théologiquement chargée; l’expliciter dans le texte résoudrait une image que la source laisse ouverte.
- issue: Ordre rhétorique des éléments
  choice: « la fin de ce monde-ci, c’est Ésaü … le commencement de celui qui vient, c’est Jacob »
  alternative: « Ésaü est la fin de ce monde-ci … Jacob est le commencement… »
  rationale: La topicalisation de « la fin » et du « commencement » suit l’ordre du latin et préserve le parallélisme avec la question du contexte.
translation_notes:
  register: Français moderne, clair et digne. La construction disloquée avec « c’est » rend naturelle la prédication nominale tout en conservant l’ordre rhétorique latin.
