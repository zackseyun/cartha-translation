  yaml_path: translation/extra_canonical/2_esdras/006/037.yaml
  text: For my spirit was greatly inflamed, and my soul was distressed.
translation:
  language: fr
  text: Car mon esprit était vivement enflammé, et mon âme était angoissée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inflammabatur
  choice: était profondément bouleversé
  rationale: Le latin exprime littéralement l’idée d’être embrasé ou enflammé. En contexte émotionnel, « profondément bouleversé » rend naturellement l’intensité de l’agitation intérieure sans suggérer nécessairement la colère.
- source_word: spiritus meus
  choice: mon esprit
  rationale: Correspondance directe et naturelle avec le latin, en maintenant la distinction avec « mon âme » dans le second membre.
- source_word: valde
  choice: profondément
  rationale: Rend le haut degré exprimé par l’adverbe latin dans un français idiomatique.
- source_word: anima mea anxiabatur
  choice: mon âme était dans l’angoisse
  rationale: Restitue l’état de détresse et d’oppression intérieure du verbe « anxiabatur », tout en conservant le terme théologiquement ouvert « âme ».
theological_decisions:
- issue: Nature de l’embrasement de l’esprit
  choice: 'Formulation émotionnelle non spécifiée : « profondément bouleversé »'
  alternative: « mon esprit était vivement enflammé »
  rationale: Le texte latin ne précise pas si cet embrasement relève de la colère, du zèle ou d’une agitation intense. La traduction choisie préserve cette indétermination sans imposer une lecture doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme entre « mon esprit » et « mon âme » est conservé, tandis que l’expression latine littérale est rendue de façon idiomatique.
