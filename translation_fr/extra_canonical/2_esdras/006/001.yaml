lexical_decisions:
- source_word: initium terreni orbis
  choice: Au commencement du monde terrestre
  rationale: Rend directement l’expression cosmologique latine tout en conservant sa formulation quelque peu solennelle.
- source_word: exitus saeculi
  choice: les limites du monde
  rationale: Dans ce contexte de création physique, « saeculum » peut désigner le monde et « exitus » ses extrémités ou passages. « Limites » donne un français intelligible sans imposer trop précisément l’image de portes cosmologiques.
- source_word: starent
  choice: soient établies
  rationale: Exprime ici l’idée que ces limites sont mises en place et tiennent fermement.
- source_word: conuentiones uentorum
  choice: les vents rassemblés
  rationale: Reproduit l’image de vents réunis tout en évitant le peu naturel « rassemblements des vents ».
- source_word: spirarent
  choice: soufflent
  rationale: Équivalent français direct et idiomatique pour l’action des vents.
theological_decisions:
- issue: Sens spatial ou temporel de « saeculi »
  choice: monde
  alternative: âge
  rationale: L’énumération porte sur les réalités physiques du cosmos, ce qui favorise le sens spatial, mais l’autre lecture reste signalée en note.
