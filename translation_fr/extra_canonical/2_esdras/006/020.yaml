  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
translation:
  language: fr
  text: 'quand l’humiliation de Sion aura pris fin et que l’ère qui commencera à passer aura été marquée[a], j’accomplirai ces signes : les livres seront ouverts devant la voûte céleste, et tous les verront en même temps.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aura été scellée » ou « aura été délimitée ».'
    reason: Le sens précis de supersignabitur est incertain; la note préserve les principales possibilités sans surinterpréter le passif ni ajouter un possesseur au sceau.
lexical_decisions:
- source_word: suppleta fuerit humilitas Sion
  choice: l’humiliation de Sion aura pris fin
  rationale: Rend l’achèvement exprimé par suppleta fuerit dans un français naturel, sans laisser entendre que l’humiliation serait « remplie » quantitativement.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte apocalyptique, saeculum désigne l’ordre présent ou l’ère présente; « le monde » reste naturel tout en conservant l’idée d’un monde appelé à passer.
- source_word: supersignabitur
  choice: aura été marqué de son sceau
  rationale: Conserve l’image du marquage ou du scellement portée par le verbe latin, plutôt que de la réduire à une simple délimitation.
- source_word: faciam
  choice: j’accomplirai
  rationale: Rend le sens de faire ou réaliser des signes, sans le confondre avec « montrer ».
- source_word: ante faciem firmamenti
  choice: devant la voûte céleste
  rationale: « Voûte céleste » communique clairement le firmament à un lectorat moderne tout en gardant l’image cosmologique.
- source_word: omnes uidebunt simul
  choice: tous les verront en même temps
  rationale: Explicite naturellement que l’objet de la vision est « les livres » et rend simul temporellement.
theological_decisions:
- issue: Valeur apocalyptique de supersignabitur
  choice: aura été marqué de son sceau
  alternative: aura été délimité / marqué
  rationale: Le choix maintient la force symbolique du sceau sans préciser qui le pose ni imposer une interprétation doctrinale de sa fonction.
- issue: Référent de saeculum
  choice: le monde
  alternative: l’ère
  rationale: Le latin peut désigner le monde présent ou l’âge présent. « Le monde, qui commence à disparaître » préserve l’horizon cosmique du passage sans identifier techniquement une période théologique.
translation_notes:
  register: Français moderne, digne et lisible, avec une imagerie apocalyptique conservée. La phrase demeure une proposition temporelle rattachée au contexte précédent/suivant, conformément au texte latin fourni.
