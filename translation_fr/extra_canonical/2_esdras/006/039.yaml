source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
translation:
  language: fr
  text: À ce moment-là, l’esprit se mouvait, tandis que les ténèbres et le silence enveloppaient tout ; le son d’une voix humaine ne venait pas encore de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’était pas encore de toi » ; le latin est très condensé et peut exprimer la provenance ou l’action créatrice.'
    reason: Le tour latin « erat abs te » permet une expression plus littérale de la provenance tout en laissant ouverte l’implication créatrice.
lexical_decisions:
- source_word: spiritus
  choice: l’esprit
  rationale: Rend directement le latin tout en conservant l’ambiguïté entre souffle, vent et esprit présente dans le contexte de la création.
- source_word: volans
  choice: se mouvait
  rationale: Traduction neutre de l’idée de mouvement ou de déplacement, sans imposer l’image plus précise de planer ou de voler.
- source_word: circumferebantur
  choice: enveloppaient tout
  rationale: Expression française naturelle qui communique l’idée que les ténèbres et le silence s’étendaient alentour, sans reproduire gauchement la forme passive latine.
- source_word: sonus vocis hominis
  choice: le son d’une voix humaine
  rationale: Reproduit fidèlement la construction latine et reste naturel en français moderne.
- source_word: abs te
  choice: de toi
  rationale: Préserve le rapport d’origine ou de provenance exprimé par le latin, sans préciser davantage le mode de création.
theological_decisions:
- issue: Nature de « spiritus »
  choice: l’esprit
  alternative: le souffle / le vent
  rationale: Le contexte peut évoquer le souffle ou l’Esprit lors de la création. « L’esprit » conserve cette tension sans réduire le terme à un phénomène naturel.
- issue: Sens de « abs te »
  choice: ne venait pas encore de toi
  alternative: n’avait pas encore été produit par toi
  rationale: La formulation choisie garde l’ambiguïté du latin entre provenance et action créatrice, au lieu d’expliciter une causalité qui demeure implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel est conservé, avec une syntaxe naturelle et sans ajout confessionnel.
