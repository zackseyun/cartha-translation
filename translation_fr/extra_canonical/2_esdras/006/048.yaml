source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: congregata, ut procrearet animalia, uolatilia et pisces; Et ita fiebat aqua muta et sine anima, quod ei iubebatur, animalia
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/048.yaml
  text: 'gathered together[a], that it might produce animals, birds, and fish; and so it happened: the mute water, which had no life, produced living creatures as it had been commanded.'
translation:
  language: fr
  text: 's’est rassemblée pour produire des animaux, des oiseaux et des poissons ; et cela se fit ainsi : l’eau muette et sans vie produisit des créatures vivantes, comme elle en avait reçu l’ordre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des animaux ».'
    reason: Le second « animalia » peut être rendu plus littéralement par « des animaux » ; « des créatures vivantes » fait mieux ressortir ici le contraste avec l’eau « sans vie ».
lexical_decisions:
- source_word: congregata
  choice: s’est rassemblée
  rationale: Le participe latin renvoie à l’eau mentionnée dans le contexte et évoque son rassemblement ; la forme pronominale est naturelle en français tout en conservant le lien avec la phrase précédente.
- source_word: animalia, uolatilia et pisces
  choice: des animaux, des oiseaux et des poissons
  rationale: « Animalia » est ici le terme général, suivi de deux catégories explicites ; « uolatilia » désigne les êtres qui volent, rendu naturellement par « oiseaux ».
- source_word: aqua muta et sine anima
  choice: l’eau muette et sans vie
  rationale: Cette formulation préserve le contraste rhétorique entre l’eau inanimée et les êtres vivants qu’elle produit.
- source_word: animalia
  choice: des créatures vivantes
  rationale: Dans la dernière proposition, cette expression distingue clairement les êtres produits de l’eau « sans vie » et maintient la cohérence du récit de création.
- source_word: quod ei iubebatur
  choice: comme elle en avait reçu l’ordre
  rationale: Le latin indique que l’eau accomplit ce qui lui avait été commandé ; cette tournure française rend l’idée sans préciser celui qui commande, déjà évident dans le contexte.
theological_decisions:
- issue: L’eau inanimée produit des êtres vivants sur commandement
  choice: Conserver le contraste et attribuer la production à l’eau conformément à l’ordre reçu
  alternative: Reformuler en disant directement que Dieu créa les êtres vivants à partir de l’eau
  rationale: La formulation latine personnifie l’eau comme exécutant le commandement. La rendre directement par une action divine supprimerait cette image et atténuerait la tension du texte.
translation_notes:
  register: Français moderne, digne et accessible. Le verset commence par une minuscule afin de signaler qu’il poursuit syntaxiquement la phrase du verset précédent. La ponctuation forte après « ainsi » clarifie la construction latine heurtée sans en modifier le sens.
