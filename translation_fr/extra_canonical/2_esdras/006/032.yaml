id: 2ES.6.32
reference: 2 Esdras 6:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: fr
  text: Car ta voix a assurément été entendue devant le Très-Haut. Le Puissant a vu ta conduite et a pris note de la pureté que tu as eue depuis ta jeunesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auditu audita est
  choice: a bel et bien été entendue
  rationale: La tournure intensive latine associe un nom d’action et le verbe correspondant. « Bel et bien » en restitue naturellement l’insistance sans alourdir le français.
- source_word: apud Altissimum
  choice: auprès du Très-Haut
  rationale: « Auprès de » conserve la nuance relationnelle ou de présence de apud, tandis que « le Très-Haut » est le titre divin français usuel.
- source_word: Fortis
  choice: Le Puissant
  rationale: Ce substantif adjectival désigne Dieu par sa puissance; la majuscule signale ici un titre divin sans ajouter une précision absente du latin.
- source_word: directionem tuam
  choice: ta conduite
  rationale: Dans ce contexte moral, directio renvoie vraisemblablement à la manière de diriger sa vie, donc à la conduite; ce choix évite de surinterpréter le terme comme « droiture ».
- source_word: providit
  choice: a pris en considération
  rationale: Providere peut exprimer le fait de voir, discerner ou porter attention. La formulation évite la répétition immédiate de « voir » et rend l’idée d’une attention favorable.
- source_word: pudicitiam
  choice: la pureté
  rationale: Pudicitia désigne la chasteté ou la pureté morale, notamment sexuelle. « Pureté » préserve une portée assez large et correspond au contexte.
- source_word: quam a iuventute tua habuisti
  choice: que tu as gardée depuis ta jeunesse
  rationale: Le latin dit littéralement « que tu as eue depuis ta jeunesse ». « Gardée » produit un français plus naturel tout en exprimant la continuité depuis la jeunesse.
theological_decisions:
- issue: Nature de la « pureté » reconnue par Dieu
  choice: Conserver le terme général « pureté »
  alternative: « chasteté »
  rationale: Pudicitia peut viser spécifiquement la chasteté, mais le verset ne précise pas davantage. « Pureté » maintient l’étendue possible du terme sans imposer une lecture sexuelle exclusive.
- issue: Valeur morale de directionem
  choice: Traduire par « conduite »
  alternative: « droiture »
  rationale: « Droiture » transformerait explicitement l’observation de la conduite en jugement moral positif. Le contexte implique sans doute cette approbation, mais « conduite » respecte mieux l’indétermination lexicale du terme latin.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement suit l’adresse individuelle du texte latin. Les deux propositions sont séparées en deux phrases pour une lecture fluide, sans modifier leur relation explicative.
