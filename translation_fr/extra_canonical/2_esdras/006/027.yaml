lexical_decisions:
- source_word: delebitur
  choice: sera effacé
  rationale: Rend directement l’idée de suppression exprimée par le futur passif latin.
- source_word: malum
  choice: le mal
  rationale: Conserve la portée générale et abstraite du substantif latin.
- source_word: extinguetur
  choice: sera anéantie
  rationale: En français naturel, « anéantie » exprime ici la disparition totale de la tromperie sans l’image peu idiomatique d’une tromperie que l’on « éteint ».
- source_word: dolus
  choice: la tromperie
  rationale: Terme courant couvrant l’idée de fraude, de ruse trompeuse ou de duplicité.
