lexical_decisions:
- source_word: haec
  choice: ces choses
  rationale: Conserve le démonstratif neutre pluriel du latin et son renvoi au contenu de la révélation.
- source_word: veni tibi ostendere
  choice: je suis venu te montrer
  rationale: Rend directement la construction latine avec le datif de destinataire, dans un français naturel.
- source_word: venturae nocti
  choice: cette nuit
  rationale: Suit l’émendation textuelle largement reconnue « hac ventura nocte » derrière la leçon latine corrompue, et exprime naturellement la nuit imminente.
