  text: “Do not ask anything else[a], Ezra.” And I answered and said, “O Lord who rules, if I have found favor
translation:
  language: fr
  text: '« Ne demande rien d’autre[a], Esdras. » Et je répondis et dis : « Ô Maître, Seigneur, si j’ai trouvé grâce… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne demande rien de plus, Esdras. »'
    reason: Le latin aliud peut viser soit autre chose, soit une demande supplémentaire selon le contexte.
lexical_decisions:
- source_word: aliud
  choice: rien d’autre
  rationale: Rend directement l’idée de « quelque chose d’autre » dans une interdiction, en français naturel.
- source_word: noli querere
  choice: ne demande
  rationale: L’impératif négatif latin signifie ici « cesse/ne va pas demander »; la formulation française simple conserve la force de l’interdiction.
- source_word: dominator domine
  choice: Ô Seigneur, Maître de tout
  rationale: Conserve le double vocatif et exprime dominator comme un titre d’autorité sans recourir à une tournure verbale moins idiomatique.
- source_word: si inueni gratiam
  choice: si j’ai trouvé grâce
  rationale: Expression biblique française naturelle qui préserve la formulation conditionnelle et le sens de faveur accordée.
theological_decisions:
- issue: Portée du titre « dominator domine »
  choice: Ô Seigneur, Maître de tout
  alternative: Ô souverain Seigneur / Ô Seigneur qui règnes
  rationale: « Maître de tout » traduit explicitement l’autorité contenue dans dominator, tout en gardant Seigneur pour domine et sans introduire une précision confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste inachevée à la fin du verset, conformément au découpage de la source; les points de suspension le signalent.
