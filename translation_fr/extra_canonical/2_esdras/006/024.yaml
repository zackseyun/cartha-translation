    reason: Le latin cum peut exprimer l’association des habitants à l’effroi de la terre; la note rend cette relation explicitement sans modifier le texte principal.
  revision_rationale: La révision resserre la comparaison guerrière, remplace une paraphrase de l’image des « veines » des sources par un équivalent concret plus proche du latin, et maintient par une note l’ambiguïté associative de cum attestée dans la piste d’audit anglaise.
