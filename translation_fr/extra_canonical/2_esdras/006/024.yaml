source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et erit in illo tempore debellabunt amici amicos ut inimici, et expauescet terra cum his qui inhabitant eam, et uenae fontium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/024.yaml
  text: 'And it will be in that time: friends will make war on friends like enemies[a], and the earth will be terrified along with those who dwell in it, and the channels of the springs will stand still so as not to run for three hours.'
translation:
  language: fr
  text: Et en ce temps-là, des amis combattront leurs amis comme des ennemis. La terre sera saisie d’effroi avec ceux qui l’habitent[a], et les canaux des sources s’arrêteront de couler pendant trois heures.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La terre sera saisie d’effroi en même temps que ceux qui l’habitent. »'
    reason: Le latin cum peut exprimer l’association des habitants à l’effroi de la terre; la note rend cette relation explicitement sans modifier le texte principal.
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  choice: des amis combattront leurs amis comme s’ils étaient des ennemis
  rationale: Rend naturellement l’affrontement guerrier entre amis et conserve la comparaison exprimée par « ut inimici ».
- source_word: expauescet terra cum his qui inhabitant eam
  choice: La terre sera saisie d’effroi avec ceux qui l’habitent
  rationale: '« cum » est compris dans son sens associatif : la terre et ses habitants partagent le même effroi, sans suggérer que les habitants en seraient la cause.'
- source_word: uenae fontium
  choice: les cours d’eau alimentés par les sources
  rationale: Le latin désigne littéralement les « veines » ou conduits des sources ; cette formulation française en exprime clairement l’image concrète sans employer le peu naturel « veines des sources ».
- source_word: stabit, ut non decurrant per horas tres
  choice: s’arrêteront de couler pendant trois heures
  rationale: 'Formulation française concise correspondant au complément transmis de la phrase : les eaux cessent de s’écouler durant trois heures.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure apocalyptique est préservée, avec un vocabulaire concret et accessible. Le texte latin fourni dans le champ source s’interrompt après « uenae fontium » ; la fin de la phrase est rendue d’après la continuation attestée signalée par la couche anglaise auditée.
