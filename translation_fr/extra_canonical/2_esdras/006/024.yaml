review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu. Toutefois, « comme s’ils étaient des ennemis » déplace légèrement la comparaison vers l’identité des amis, alors que ut inimici décrit plus directement leur manière d’agir : ils combattent en ennemis. « Les cours d’eau alimentés par les sources » explicite correctement l’image, mais ajoute l’idée d’« alimentés par », qui n’est pas exprimée dans uenae fontium (« canaux/conduits des sources »).'
  naturalness: La formulation est globalement claire et naturelle. « Combattront leurs amis comme des ennemis » est plus direct et idiomatique dans ce contexte apocalyptique. « Les canaux des sources » conserve une image concrète compréhensible sans paraphrase explicative.
  terminology: « Saisie d’effroi » rend bien expauescet pour la terre personnifiée. Le terme « canaux des sources » traduit sobrement uenae fontium, sans imposer une lecture hydraulique plus développée. La note conserve la possibilité associative de cum sans prétendre trancher davantage.
  issues:
  - severity: low
    issue: Nuance de ut inimici
    rationale: « Comme s’ils étaient des ennemis » peut suggérer une comparaison portant sur ce qu’ils sont; le latin exprime plus naturellement qu’ils combattent avec l’hostilité propre à des ennemis.
  - severity: low
    issue: Explicitation de uenae fontium
    rationale: « Alimentés par les sources » est une explicitation plausible, mais le génitif latin désigne plus directement les canaux ou conduits appartenant aux sources.
  revised_text: Et en ce temps-là, des amis combattront leurs amis comme des ennemis. La terre sera saisie d’effroi avec ceux qui l’habitent[a], et les canaux des sources s’arrêteront de couler pendant trois heures.
