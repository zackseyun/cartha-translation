  text: et nunc, Domine, ecce istae gentes quae in nihilum deputatae sunt dominari nostri et devorarenos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/057.yaml
  text: And now, Lord, behold, these nations, which have been reckoned as nothing, rule over us and devour us.
translation:
  language: fr
  text: Et maintenant, Seigneur, voici que ces nations, qui ont été considérées comme rien, dominent sur nous et nous dévorent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: voici que
  rationale: Conserve la force présentative et l’appel à constater la situation.
- source_word: in nihilum deputatae sunt
  choice: ont été considérées comme rien
  rationale: Rend directement l’idée d’une estimation comme négligeables ou sans valeur, sans préciser qui les a ainsi considérées.
- source_word: dominari nostri
  choice: dominent sur nous
  rationale: Le latin transmis paraît irrégulier, mais le sens contextuel correspond à une domination exercée sur le peuple du locuteur.
- source_word: devorare nos
  choice: nous dévorent
  rationale: Préserve l’image forte de l’engloutissement ou de la destruction par les nations.
theological_decisions:
- issue: Identité de ceux qui ont considéré les nations comme rien
  choice: Construction passive sans agent explicite
  alternative: « que tu as considérées comme rien »
  rationale: Le texte latin ne nomme pas l’agent; la traduction conserve cette ambiguïté au lieu de l’attribuer explicitement à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’adresse solennelle à Dieu ainsi que le parallélisme entre domination et dévoration.
