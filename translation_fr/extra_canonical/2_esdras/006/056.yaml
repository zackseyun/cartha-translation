- from: Mais les autres nations, nées d’Adam, tu as dit qu’elles ne sont rien, qu’elles sont comparables à de la salive, et tu as comparé leur multitude à une goutte qui tombe d’un vase.
  to: Mais les autres nations, nées d’Adam, tu as dit qu’elles ne sont rien, qu’elles sont comparables à de la salive, et tu as comparé leur abondance à une goutte d’un vase.
  rationale: La révision remplace l’interprétation numérique « multitude » par « abondance », qui reproduit le champ sémantique non spécifié de abundantia, et retire l’ajout verbal « qui tombe ». Elle conserve le contraste, la filiation adamique et les images dépréciatives du texte latin.
