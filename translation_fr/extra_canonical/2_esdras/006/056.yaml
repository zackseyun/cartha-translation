  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: fr
  text: Mais les autres nations, nées d’Adam, tu as dit qu’elles ne sont rien, qu’elles sont comparables à de la salive, et tu as comparé leur abondance à une goutte d’un vase.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes
  choice: Mais les autres nations
  rationale: « Les autres nations » rend naturellement l’idée des peuples restants, tandis que « mais » conserve le contraste introduit par autem.
- source_word: ab Adam natas
  choice: nées d’Adam
  rationale: Traduction directe de la filiation commune issue d’Adam.
- source_word: salivae adsimilatae sunt
  choice: elles sont comparables à de la salive
  rationale: Conserve l’image dépréciative du latin sans ajouter d’interprétation.
- source_word: abundantiam eorum
  choice: leur multitude
  rationale: Dans ce contexte, abundantia désigne le grand nombre des nations plutôt qu’une abondance matérielle.
- source_word: stillicidium de vaso
  choice: une goutte qui tombe d’un vase
  rationale: Rend le sens concret de stillicidium et la provenance exprimée par de vaso, dans un français naturel.
theological_decisions:
- issue: Dépréciation des autres nations
  choice: Maintien littéral des images « rien », « salive » et « goutte »
  alternative: Atténuer ces images en parlant d’insignifiance
  rationale: Le verset rapporte une affirmation adressée à Dieu; la traduction doit préserver sa tension théologique et sa force rhétorique sans la transformer en commentaire doctrinal.
translation_notes:
  register: Français moderne, clair et digne; syntaxe légèrement solennelle adaptée à une prière ou à une adresse à Dieu. Aucun marqueur de note n’est requis.
