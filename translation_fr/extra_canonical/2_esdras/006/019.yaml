  text: and when I begin to inquire of those who have unjustly harmed others by their injustice[a], and
translation:
  language: fr
  text: et quand je commencerai à interroger ceux qui ont injustement fait du tort par leur injustice, et
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inquirere
  choice: interroger
  rationale: Rend directement l’idée d’enquêter ou de questionner, sans imposer le sens plus précis de « demander des comptes », possible dans le contexte mais non explicite ici.
- source_word: ab eis
  choice: ceux qui
  rationale: Avec « interroger », le français construit naturellement le complément sans préposition.
- source_word: iniuste nocuerunt
  choice: ont injustement fait du tort
  rationale: Conserve l’adverbe moral « injustement » et le sens large de nocere, sans ajouter un objet absent du latin.
- source_word: iniustitia sua
  choice: par leur injustice
  rationale: Préserve la répétition rhétorique du radical de l’injustice et la valeur instrumentale ou causale de l’ablatif.
theological_decisions:
- issue: Portée judiciaire de inquirere
  choice: interroger
  alternative: demander des comptes à
  rationale: Le contexte peut suggérer une reddition de comptes judiciaire, mais le latin du verset permet un sens plus général. La traduction retient cette ouverture.
translation_notes:
  register: Français moderne, digne et proche de la structure latine. La conjonction finale « et » est maintenue parce que le verset source se poursuit syntaxiquement au verset suivant.
