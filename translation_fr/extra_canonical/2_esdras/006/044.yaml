  text: tuum processit, et opus statim fiebat. Processit enim subito fructus multitudinis inmensus et concupiscentia gustus multiformis et flores colore inimitabiles et odores odoramentis inuestigabiles. die tertio haec facta sunt. Quarto autem die imperasti fieri solis splendorem, lunae lumen, stellarum dispositionem, Et imperasti eis ut deseruirent futuro plasmato
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/044.yaml
  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
translation:
  language: fr
  text: Car aussitôt apparurent une abondance sans mesure de fruits, des délices gustatives variées, des fleurs aux couleurs inimitables et des senteurs aux parfums insondables. Tout cela fut créé le troisième jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fructus multitudinis inmensus
  choice: des fruits en quantité incalculable
  rationale: Rend naturellement l’abondance sans mesure exprimée par le latin, tout en conservant « fruits » comme sujet concret.
- source_word: concupiscentia gustus multiformis
  choice: offrant des plaisirs gustatifs variés
  rationale: Le latin est littéralement difficile et peut décrire ce qui suscite le désir par de multiples saveurs. La formulation retenue exprime la qualité agréable des fruits sans faire du désir lui-même une chose créée; l’ambiguïté est signalée en note.
- source_word: flores colore inimitabiles
  choice: des fleurs aux couleurs impossibles à reproduire
  rationale: « Reproduire » communique en français actuel le sens d’inimitabilis appliqué aux couleurs, sans suggérer simplement une conduite à imiter.
- source_word: odores odoramentis inuestigabiles
  choice: des senteurs dont le parfum est insondable
  rationale: Conserve l’intensification entre odores et odoramentis ainsi que l’idée d’une qualité qui échappe à l’exploration ou à la pleine compréhension.
- source_word: haec facta sunt
  choice: Tout cela fut créé
  rationale: Dans le contexte du récit de la création, « fut créé » est plus naturel que le calque « fut fait » et reprend collectivement les réalités énumérées.
