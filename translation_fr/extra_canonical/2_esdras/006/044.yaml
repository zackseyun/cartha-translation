revisions:
- from: Car aussitôt surgirent des fruits en quantité incalculable, offrant des plaisirs gustatifs variés[a], ainsi que des fleurs aux couleurs impossibles à reproduire et des senteurs dont le parfum est insondable. Tout cela fut créé le troisième jour.
  to: Car aussitôt apparurent une abondance sans mesure de fruits, des délices gustatives variées, des fleurs aux couleurs inimitables et des senteurs aux parfums insondables. Tout cela fut créé le troisième jour.
  rationale: La révision supprime une relation syntaxique absente de la source, conserve l’ambiguïté de concupiscentia dans une note plus directement liée au syntagme latin, et emploie des équivalents français plus proches de inimitabiles tout en gardant un registre moderne accessible.
