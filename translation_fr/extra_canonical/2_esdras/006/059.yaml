source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: fr
  text: Et si le monde a été créé pour nous, pourquoi ne possédons-nous pas notre monde en héritage ? Jusqu’à quand en sera-t-il ainsi ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: monde
  rationale: Dans ce contexte, « saeculum » désigne l’ordre du monde ou l’âge destiné au peuple ; « monde » conserve le parallèle avec la création tout en restant naturel en français.
- source_word: propter nos
  choice: pour nous
  rationale: Rend directement l’idée que le monde a été créé en vue de « nous », sans préciser davantage la finalité.
- source_word: hereditatem possidemus
  choice: possédons-nous … en héritage
  rationale: Préserve à la fois la possession et la notion théologique d’héritage exprimées par le latin.
- source_word: usquequo haec
  choice: Jusqu’à quand en sera-t-il ainsi ?
  rationale: Formulation idiomatique qui restitue la brièveté et l’impatience de l’interrogation latine.
theological_decisions:
- issue: Référent de « nostrum saeculum »
  choice: notre monde
  alternative: notre âge / le monde qui nous revient
  rationale: 'La traduction conserve l’expression possessive et son ambiguïté : elle peut viser le monde créé pour le peuple ou l’âge qui lui est destiné, sans imposer une lecture eschatologique précise.'
translation_notes:
  register: Français moderne, clair et digne. La répétition de « monde » reproduit celle de « saeculum » et maintient la tension entre création présente et héritage attendu.
