  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: fr
  text: Et tu as donné à Béhémoth une partie, qui fut asséchée le troisième jour, afin qu’il y habite, là où se trouvent mille montagnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Behemoth
  choice: Béhémoth
  rationale: Translittération française usuelle du nom propre, avec accentuation moderne.
- source_word: unam partem
  choice: une partie
  rationale: Rend directement l’expression latine sans préciser davantage la nature de cette portion.
- source_word: quae siccata est
  choice: qui fut asséchée
  rationale: Conserve la voix passive et rattache naturellement le relatif féminin à « une partie ».
- source_word: tertio [die]
  choice: le troisième jour
  rationale: Le mot « jour », sous-entendu après l’ordinal dans le fragment latin fourni, est exprimé en français pour que la phrase soit complète.
theological_decisions:
- issue: Nature de Béhémoth
  choice: Conserver « Béhémoth » comme nom propre sans explication
  alternative: Identifier explicitement Béhémoth comme une créature ou un monstre
  rationale: Le texte nomme Béhémoth sans définir sa nature; la traduction préserve cette réserve et n’importe aucune interprétation particulière.
translation_notes:
  register: Français international moderne, simple et digne. La formulation suit de près le latin conservé; la proposition finale et la mention des mille montagnes sont rendues d’après la couche anglaise auditée, qui reflète la continuation textuelle du verset.
