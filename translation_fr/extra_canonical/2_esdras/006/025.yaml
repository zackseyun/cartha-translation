    issue: Nuance de derelictus ... ex omnibus istis
    rationale: « Aura survécu à tous ces événements » est idiomatique mais resserre la construction latine. « Quiconque restera parmi tous ces événements » conserve mieux l’idée de la personne laissée ou demeurée au milieu de l’ensemble annoncé.
  - severity: low
    issue: Choix de « ère » pour saeculum
    rationale: Le terme est défendable, mais « âge » est plus naturel pour la fin eschatologique d’un saeculum et évite la connotation moderne d’une ère historiquement nommée.
