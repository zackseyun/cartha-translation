  text: And it will be that everyone who is left from all these things that I have foretold to you will be saved and will see my salvation and the end of my age[a].
translation:
  language: fr
  text: Alors, quiconque restera parmi tous ces événements que je t’ai annoncés sera sauvé et verra mon salut et la fin de mon âge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin peut aussi désigner une époque ou le monde.
    reason: Préserver l’ambiguïté sémantique de saeculi entre l’âge, l’époque et le monde.
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  choice: aura survécu à tous ces événements
  rationale: Cette formulation idiomatique exprime la personne demeurée en vie après les événements annoncés, sans conserver le calque peu naturel « aura été laissée de toutes ces choses ».
- source_word: salutare meum
  choice: mon salut
  rationale: Le substantif latin désigne ici le salut ou l’œuvre salvatrice de Dieu ; « mon salut » conserve la formulation concise du texte.
- source_word: saeculi mei
  choice: de mon ère
  rationale: Saeculum peut désigner un âge, une époque ou le monde envisagé dans sa durée. « Ère » préserve ici la dimension temporelle et eschatologique.
theological_decisions:
- issue: Nature du salut promis au survivant
  choice: sera sauvé
  alternative: sera préservé
  rationale: Le latin salvabitur permet une portée plus large qu’une simple survie physique ; la traduction conserve donc le terme théologiquement ouvert « sauvé ».
- issue: Sens eschatologique de saeculum
  choice: la fin de mon ère
  alternative: la fin de mon monde
  rationale: Le contexte évoque l’achèvement d’un âge. La variante est signalée en note afin de ne pas effacer l’étendue sémantique du latin.
translation_notes:
  register: Français moderne, courant et digne. « Aura survécu à » rend naturellement l’idée des personnes restées en vie au terme des événements annoncés ; le point-virgule clarifie les deux promesses parallèles.
