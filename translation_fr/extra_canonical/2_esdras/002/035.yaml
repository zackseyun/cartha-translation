id: 2ES.2.35
reference: 2 Esdras 2:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: fr
  text: Car la lumière éternelle brillera pour vous pour toute l’éternité. Fuyez l’ombre de cet âge ; recevez la joie de la gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua
  choice: la lumière éternelle
  rationale: Rend naturellement l’idée d’une lumière durable et sans fin, en accord avec le contexte immédiat.
- source_word: per aeternitatem temporis
  choice: dans l’éternité
  rationale: Évite le calque lourd « durant l’éternité du temps » tout en conservant la portée temporelle illimitée de l’expression latine.
- source_word: saeculi huius
  choice: ce monde-ci
  rationale: Le latin saeculum peut désigner l’âge présent ou l’ordre du monde actuel. « Ce monde-ci » préserve ici le contraste avec la gloire éternelle dans un français courant.
- source_word: accipite
  choice: accueillez
  rationale: Exprime une réception volontaire et positive, plus idiomatique dans ce contexte que le simple « recevez ».
- source_word: iocunditatem gloriae
  choice: la joie de la gloire
  rationale: Reproduit directement le lien génitif sans préciser indûment s’il s’agit de la joie produite par la gloire ou inhérente à celle-ci.
theological_decisions:
- issue: Sens eschatologique de saeculum
  choice: ce monde-ci
  alternative: cet âge
  rationale: « Cet âge » serait plus formel et soulignerait la dimension temporelle, mais « ce monde-ci » est naturel et laisse entendre l’ordre présent sans imposer une chronologie doctrinale précise.
- issue: Rapport entre lumière éternelle et éternité
  choice: Conserver les deux expressions
  alternative: Réduire la répétition en disant seulement « une lumière brillera éternellement »
  rationale: La redondance apparente appartient au texte latin et renforce l’opposition entre la permanence de la lumière et l’ombre du monde présent.
translation_notes:
  register: Français moderne, digne et accessible. L’impératif pluriel est conservé. Le point-virgule maintient le parallélisme serré entre les deux exhortations finales.
