id: 2ES.2.5
reference: 2 Esdras 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
translation:
  language: fr
  text: Mais moi, Père, je te prends à témoin contre[a] la mère des enfants, parce qu’ils n’ont pas voulu garder mon alliance,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet de » la mère des enfants.'
    reason: La préposition latine « super » peut introduire la personne contre laquelle porte le témoignage ou, plus largement, son objet.
lexical_decisions:
- source_word: testem inuoco
  choice: je te prends à témoin
  rationale: Cette tournure française naturelle et digne rend directement l’appel solennel à quelqu’un comme témoin.
- source_word: super matrem filiorum
  choice: contre la mère des enfants
  rationale: Dans ce contexte quasi judiciaire, « super » avec l’accusatif a vraisemblablement une valeur adversative, renforcée par la suite du passage. « filiorum » ne comporte aucun démonstratif.
- source_word: testamentum meum
  choice: mon alliance
  rationale: Dans le latin biblique, « testamentum » désigne couramment une alliance établie par Dieu plutôt qu’un testament au sens successoral.
- source_word: seruare
  choice: garder
  rationale: « Garder mon alliance » conserve l’image biblique de l’observance fidèle tout en restant idiomatique en français.
theological_decisions:
- issue: Valeur de « super » dans la formule d’appel à témoin
  choice: contre
  alternative: au sujet de
  rationale: Le sens adversatif convient au cadre judiciaire et à la condamnation qui suit, mais la préposition latine permet une lecture moins nettement hostile; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La dislocation « Mais moi, Père » préserve l’accent mis par le latin sur le locuteur. La virgule finale est maintenue puisque le verset se poursuit syntaxiquement.
