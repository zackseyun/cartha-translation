  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
translation:
  language: fr
  text: Ne te moque pas ; protège l’infirme et admets l’aveugle à la vue de ma gloire. Garde le vieillard et le jeune homme à l’intérieur de tes murs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inridere noli
  choice: Ne te moque pas
  rationale: Rend directement l’interdiction latine, sans ajouter dans ce verset un complément provenant du verset précédent.
- source_word: tutare mancum
  choice: protège l’estropié
  rationale: « Tutare » appelle l’idée de protéger ou prendre sous sa garde ; « mancus » désigne ici une personne atteinte dans l’usage d’un membre.
- source_word: caecum ad uisionem claritatis meae admitte
  choice: fais entrer l’aveugle dans la vision de ma gloire
  rationale: Conserve le contraste intentionnel entre l’aveugle et la vision, ainsi que la portée théologique de « claritas », ici rendue par « gloire ».
- source_word: Senem et iuuenem
  choice: le vieillard et le jeune homme
  rationale: Reproduit les deux catégories au singulier collectif et maintient leur parallélisme.
- source_word: intra muros tuos serua
  choice: Garde … à l’intérieur de tes murs
  rationale: Rend « serva » par une protection vigilante et conserve l’image concrète de l’enceinte urbaine.
theological_decisions:
- issue: Nature de la « vision de ma gloire »
  choice: Maintenir littéralement l’admission de l’aveugle dans cette vision
  alternative: Expliciter comme une guérison physique lui permettant de voir la gloire divine
  rationale: Le latin ne précise pas le mécanisme ni s’il s’agit d’une guérison physique ou d’une participation eschatologique ; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation distingue l’interdiction initiale des deux impératifs suivants. Aucun complément implicite n’est importé du verset précédent.
