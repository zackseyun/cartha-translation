  rationale: Le verbe « poser » restitue l’action de placer les couronnes sur les personnes sans ajouter explicitement « sur la tête », absent du texte latin.
- source_word: palmas in manus
  choice: leur met des palmes dans les mains
  rationale: La reprise verbale, nécessaire à la fluidité du français, rend l’ellipse latine et distingue clairement les palmes placées dans les mains.
