  yaml_path: translation/extra_canonical/2_esdras/002/003.yaml
  text: I raised you with gladness, and I lost you with mourning and sorrow,
translation:
  language: fr
  text: Je vous ai élevés dans la joie, et je vous ai perdus dans le deuil et la tristesse,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Educaui
  choice: J’ai élevés
  rationale: Le latin educare signifie ici élever, nourrir et accompagner jusqu’à la maturité; «élever» rend naturellement cette idée en français.
- source_word: cum laetitia
  choice: dans la joie
  rationale: Cette formulation idiomatique conserve l’état affectif ou les circonstances exprimés par cum.
- source_word: amisi
  choice: j’ai perdus
  rationale: Traduction directe de amittere, qui préserve sans l’expliquer la tension entre l’éducation passée et la perte présente.
- source_word: cum luctu et tristitia
  choice: dans le deuil et la tristesse
  rationale: «Deuil» rend luctus et «tristesse» rend tristitia, en maintenant les deux termes distincts et leur intensification.
theological_decisions:
- issue: Nature de la perte évoquée par «amisi»
  choice: je vous ai perdus
  alternative: vous m’avez été enlevés / je vous ai laissés partir
  rationale: Le texte latin affirme simplement la perte sans en préciser la cause ni l’agent; la traduction conserve cette ambiguïté et n’introduit aucune explication théologique.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme entre joie et deuil-tristesse est conservé, ainsi que l’adresse au pluriel. La virgule finale est maintenue parce que le verset source se prolonge syntaxiquement.
