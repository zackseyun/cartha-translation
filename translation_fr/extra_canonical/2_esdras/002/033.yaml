  text: ut irem ad Israel; ad quos cum uenirem, reprobauerunt me et respuerunt mandatum domini. Ideoque uobis dico, gentes,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/033.yaml
  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
translation:
  language: fr
  text: 'Moi, Esdras, j’ai reçu du Seigneur, sur le mont Horeb, l’ordre de me rendre auprès d’Israël. Mais quand je suis arrivé auprès d’eux, ils m’ont rejeté et ont repoussé le commandement du Seigneur. C’est pourquoi je vous le dis, à vous, les nations :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reprobauerunt me
  choice: ils m’ont rejeté
  rationale: « Reprobare » exprime ici le refus de la personne envoyée ; « rejeter » est direct, naturel et fidèle.
- source_word: respuerunt mandatum domini
  choice: ont repoussé le commandement du Seigneur
  rationale: « Respuere » évoque un rejet actif et énergique, plutôt qu’un simple mépris intérieur ; « repousser » conserve cette force sans rendre littéralement l’image de cracher.
- source_word: gentes
  choice: les nations
  rationale: Dans ce contraste avec Israël, « nations » garde la portée collective et biblique du latin « gentes ».
theological_decisions:
- issue: Rapport entre le rejet du messager et celui du commandement
  choice: 'Maintenir les deux actes distincts : rejet d’Esdras, puis rejet du commandement'
  alternative: Fusionner les deux en une seule idée générale de désobéissance
  rationale: Le latin coordonne explicitement « reprobauerunt me » et « respuerunt mandatum domini » ; la traduction préserve cette tension entre l’accueil du messager et celui de la parole divine.
translation_notes:
  register: Français moderne, digne et lisible. « À vous, les nations » explicite naturellement le vocatif latin tout en conservant l’adresse solennelle. Les deux propositions de rejet restent parallèles, sans ajouter d’interprétation confessionnelle.
