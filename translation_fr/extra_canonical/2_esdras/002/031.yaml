lexical_decisions:
- source_word: misericordiam cum illis faciam
  choice: je leur ferai miséricorde
  rationale: Cette formulation naturelle et digne conserve l’idée d’un acte de miséricorde envers eux ainsi que la répétition rhétorique avec « miséricordieux ».
- source_word: misericors
  choice: miséricordieux
  rationale: Le terme reprend directement « miséricorde » et préserve le lien explicite entre l’action divine et le caractère de Dieu.
- source_word: dominus omnipotens
  choice: le Seigneur tout-puissant
  rationale: Rend fidèlement le titre divin latin dans une formulation française courante.
theological_decisions:
- issue: Lien entre l’action et le caractère de Dieu
  choice: Conserver la répétition « miséricorde / miséricordieux »
  alternative: Employer « compassion / compatissant »
  rationale: La répétition est structurante dans le latin et fonde explicitement l’action de Dieu sur ce qu’il est, sans ajouter d’interprétation confessionnelle.
