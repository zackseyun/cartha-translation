  yaml_path: translation/extra_canonical/2_esdras/002/012.yaml
  text: which I had prepared for them. The tree of life shall be for them as the fragrance of perfume[a], and they shall neither labor nor grow weary.
translation:
  language: fr
  text: que j’avais préparées pour eux. L’arbre de vie sera pour eux un parfum d’onguent[a], et ils ne peineront ni ne se fatigueront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’arbre de vie sera pour eux comme le parfum d’un onguent. »'
    reason: La construction latine « in odorem unguenti » peut être comprise de façon prédicative, comme dans le texte, ou plus librement comme une comparaison. « Unguentum » désigne un onguent aromatique ou un parfum.
lexical_decisions:
- source_word: quae praeparaueram illis
  choice: que j’avais préparées pour eux
  rationale: La proposition relative appartient au verset selon le découpage fourni. Le féminin pluriel « préparées » suppose l’antécédent féminin pluriel du contexte précédent, sans le répéter ici.
- source_word: Lignum uitae
  choice: L’arbre de vie
  rationale: Expression biblique traditionnelle, naturelle et précise.
- source_word: erit illis in odorem unguenti
  choice: répandra pour eux un parfum embaumé
  rationale: Cette formulation française rend la valeur résultative ou prédicative de « in odorem » plutôt qu’une comparaison explicite. « Parfum embaumé » exprime l’odeur agréable d’un onguent sans suggérer uniquement une préparation médicinale.
- source_word: non laborabunt neque fatigabuntur
  choice: ils ne peineront ni ne se fatigueront
  rationale: Le premier verbe désigne la peine ou le labeur, tandis que le second marque la fatigue qui en résulte; la coordination négative latine est conservée.
theological_decisions:
- issue: Nature de la relation exprimée par « in odorem unguenti »
  choice: 'Une manifestation ou un effet parfumé: « répandra pour eux un parfum embaumé »'
  alternative: 'Une comparaison explicite: « sera pour eux comme le parfum d’un onguent »'
  rationale: Le latin ne comporte pas de marqueur comparatif tel que « sicut ». La traduction principale préserve donc la valeur prédicative ou résultative, tandis que la note signale l’autre analyse possible.
translation_notes:
  register: Français moderne, digne et accessible. Le fragment initial est maintenu comme proposition relative parce qu’il prolonge grammaticalement le verset précédent dans le découpage transmis. Le futur et le parallélisme négatif sont conservés.
