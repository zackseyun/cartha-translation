    issue: Transformation de la prédication en action
    rationale: « erit illis in odorem unguenti » signifie littéralement que l’arbre de vie « sera pour eux » une odeur/un parfum d’onguent; il ne dit pas explicitement que l’arbre « répandra » un parfum. Cette reformulation ajoute un procès absent du latin.
