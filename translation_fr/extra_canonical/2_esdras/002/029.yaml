  text: Mère, avec tes enfants, car moi, je te délivrerai, dit le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mater
  choice: Mère
  rationale: Conserve l’adresse directe et la forme nominale abrupte du latin, sans ajouter un impératif absent du texte source.
- source_word: filiis tuis
  choice: tes enfants
  rationale: « Enfants » rend naturellement le pluriel latin filiis, qui peut désigner les fils ou, collectivement, les enfants.
- source_word: eripiam
  choice: je te délivrerai
  rationale: Rend l’idée de soustraire au danger ou à l’oppression; « délivrer » convient au registre biblique moderne sans préciser indûment la nature du péril.
- source_word: dicit dominus
  choice: dit le Seigneur
  rationale: Formule française directe correspondant à la formule déclarative latine.
theological_decisions:
- issue: Formulation elliptique au début du verset
  choice: Maintenir « Mère, avec tes enfants » sans verbe ajouté
  alternative: « Réjouis-toi, mère, avec tes enfants »
  rationale: Le latin fourni ne contient aucun impératif tel que « réjouis-toi ». La traduction préserve donc l’ellipse et l’ambiguïté du texte transmis plutôt que de la résoudre par conjecture.
- issue: Accent porté par ego
  choice: « car moi, je te délivrerai »
  alternative: « car je te délivrerai »
  rationale: La tournure disloquée française fait entendre l’insistance du pronom latin ego tout en restant naturelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe initiale demeure volontairement elliptique afin de respecter le latin transmis; aucune exhortation absente de la source n’est ajoutée.
