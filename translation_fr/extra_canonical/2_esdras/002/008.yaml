lexical_decisions:
- source_word: Vae tibi
  choice: Malheur à toi
  rationale: Formule française naturelle et solennelle qui conserve l’interpellation prophétique du latin.
- source_word: Assur
  choice: Assyrie
  rationale: Dans ce contexte, le nom désigne la nation, comme le confirme l’apostrophe « gens mala ».
- source_word: abscondis
  choice: caches
  rationale: Rend directement l’action de dissimuler exprimée par le verbe latin.
- source_word: iniquos
  choice: les injustes
  rationale: Conserve l’adjectif substantivé au pluriel sans préciser davantage l’identité des personnes visées.
- source_word: penes te
  choice: chez toi
  rationale: Expression française idiomatique qui préserve l’idée que les injustes se trouvent auprès de l’Assyrie, sous son toit ou en son pouvoir, sans trancher plus précisément.
- source_word: gens mala
  choice: Nation mauvaise
  rationale: Conserve le vocatif distinct après l’exclamation et son lien syntaxique possible avec la suite.
