lexical_decisions:
- source_word: populus meus
  choice: Mon peuple
  rationale: Rend directement l’adresse latine, malgré sa forme grammaticale inhabituelle dans le texte transmis.
- source_word: requies tua
  choice: ton repos
  rationale: Conserve le sens concret et ouvert de « repos », sans préciser s’il s’agit de paix, de soulagement ou du repos final.
- source_word: Nutrix bona
  choice: Bonne nourrice
  rationale: Reproduit l’adresse directe et l’image maternelle du latin dans un registre simple et digne.
- source_word: nutri
  choice: nourris
  rationale: Préserve l’impératif et la répétition étymologique entre « nourrice » et « nourris ».
- source_word: confirma pedes illorum
  choice: affermis leurs pieds
  rationale: Formulation naturelle qui conserve l’image corporelle de stabilité attestée par la suite du verset dans la tradition textuelle consultée par la couche anglaise.
theological_decisions:
- issue: Nature du « repos » annoncé
  choice: repos
  alternative: paix / soulagement
  rationale: Le latin « requies » reste théologiquement ouvert; la traduction ne tranche pas entre ses dimensions temporelle et eschatologique.
translation_notes:
  register: Français international moderne, sobre et digne. L’adresse directe et le parallélisme des impératifs sont conservés. Le texte latin fourni dans la requête s’interrompt après « nutri »; la fin du verset est rendue conformément à la continuation reflétée dans la couche anglaise auditée.
