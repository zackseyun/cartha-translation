    issue: Genre et référent de « l’immortel »
    rationale: Inmortalem est l’adjectif féminin accusatif qui reprend tunicam. Le masculin substantivé français « l’immortel » ne rend pas correctement cette reprise et est moins clair.
  - severity: medium
    issue: Voix de coronantur
    rationale: Le présent passif latin signifie « ils sont couronnés ». « Ils reçoivent la couronne » transforme l’action en réception et singularise indûment la couronne dans le parallélisme avec les palmes.
