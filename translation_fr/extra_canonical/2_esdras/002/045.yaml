  source_fidelity: 'Révision nécessaire : le latin oppose explicitement la tunique mortelle à une tunique immortelle sous-entendue ; « l’immortel » au masculin ne reprend pas correctement « tunique ». De plus, coronantur est un passif présent (« sont couronnés »), non simplement « reçoivent la couronne ».'
  naturalness: Le texte demeure naturel dans un registre biblique moderne avec « déposer/revêtir une tunique », « confesser le nom de Dieu », « être couronné » et « recevoir des palmes ».
  terminology: « Tunique » restitue tunicam avec davantage de précision que « vêtement ». « Confessé le nom de Dieu » conserve la formulation religieuse publique de confessi sunt nomen Dei sans la paraphraser. « Palmes » est maintenu au pluriel.
  issues:
