source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/045.yaml
  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: fr
  text: 'Il me répondit : « Ce sont ceux qui ont déposé la tunique mortelle et revêtu la tunique immortelle, et qui ont confessé le nom de Dieu. Maintenant, ils sont couronnés et reçoivent des palmes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam deposuerunt
  choice: ont quitté le vêtement mortel
  rationale: « Quitter un vêtement » rend naturellement l’image latine de déposer une tunique, tout en conservant sa portée métaphorique.
- source_word: inmortalem sumpserunt
  choice: revêtu l’immortel
  rationale: Le latin sous-entend une réalité immortelle prise comme vêtement. Cette formulation française préserve l’ellipse et le contraste avec le vêtement mortel.
- source_word: confessi sunt nomen dei
  choice: ont confessé le nom de Dieu
  rationale: « Confesser » conserve le sens public et religieux de confiteri sans réduire l’expression à une simple reconnaissance.
- source_word: coronantur
  choice: reçoivent la couronne
  rationale: Cette tournure courante rend le passif présent et évite l’expression moins naturelle « sont couronnés » dans ce parallélisme.
- source_word: accipiunt palmas
  choice: les palmes
  rationale: Le pluriel concret est conservé; dans ce contexte, les palmes évoquent la victoire sans qu’il soit nécessaire de l’expliciter dans le texte.
theological_decisions:
- issue: Nature de « l’immortel »
  choice: Conserver l’expression substantivée « l’immortel »
  alternative: « un vêtement immortel » ou « l’immortalité »
  rationale: Le latin oppose littéralement la tunique mortelle à « l’immortel » sous-entendu comme vêtement. La traduction maintient cette tension imagée sans identifier explicitement l’immortel à un corps, un vêtement ou un état.
- issue: Valeur de la confession du nom de Dieu
  choice: « confessé le nom de Dieu »
  alternative: « proclamé leur foi au nom de Dieu »
  rationale: La formulation retenue ne précise ni les circonstances ni la nature exacte de cette confession, conformément au texte source.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct est resserré en évitant le redoublement latin « répondit et dit », peu naturel en français. Le parallélisme eschatologique et les images du vêtement, de la couronne et des palmes sont préservés.
