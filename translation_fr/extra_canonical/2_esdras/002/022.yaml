lexical_decisions:
- source_word: Mortuos
  choice: des morts
  rationale: Le substantif latin désigne les personnes mortes; «des morts» est naturel et conserve le pluriel.
- source_word: ubi inueneris
  choice: partout où tu trouveras
  rationale: Le subjonctif parfait dans cette relative indéfinie a ici une valeur prospective; «partout où» exprime la portée générale de ubi.
- source_word: signans
  choice: marque-les
  rationale: Le participe signans est rendu comme une instruction coordonnée en français naturel. Le pronom «les» reprend «des morts».
- source_word: commenda sepulchro
  choice: confie-les au tombeau
  rationale: Cette formulation garde l'image et la construction de commendare au sens de remettre ou confier à la sépulture, sans préciser un rite non exprimé.
- source_word: et dabo
  choice: et je donnerai
  rationale: Traduction littérale du segment tronqué; l'objet de «donner» appartient manifestement à la suite du texte et ne doit pas être suppléé.
