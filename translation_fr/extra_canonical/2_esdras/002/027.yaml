source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
translation:
  language: fr
  text: Les autres pleureront et seront dans la tristesse, mais toi, tu seras dans la joie et dans l’abondance. Les nations seront jalouses, et elles ne pourront rien contre toi, dit le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: alii
  choice: les autres
  rationale: Rend directement le pronom latin indéfini pluriel sans préciser un référent que le texte ne nomme pas.
- source_word: hilaris
  choice: dans la joie
  rationale: Expression française naturelle qui traduit l’idée d’une disposition joyeuse tout en maintenant le contraste avec la tristesse.
- source_word: copiosa
  choice: dans l’abondance
  rationale: Préserve le sens large de richesse ou de plénitude sans le réduire arbitrairement à la prospérité matérielle.
- source_word: Zelabunt
  choice: seront jalouses de toi
  rationale: Dans ce contexte hostile, le verbe exprime la jalousie ou l’envie des nations envers la destinataire.
- source_word: nihil aduersus te poterunt
  choice: elles ne pourront rien contre toi
  rationale: Reproduit sobrement l’incapacité totale des nations à agir efficacement contre la destinataire.
theological_decisions:
- issue: Nature de l’abondance promise
  choice: dans l’abondance
  alternative: prospère
  rationale: Le latin copiosa reste général; la traduction ne tranche pas entre abondance matérielle, fécondité ou plénitude de bénédiction.
- issue: Référent du pronom féminin singulier tu
  choice: toi
  alternative: toi, Jérusalem
  rationale: Le verset ne nomme pas explicitement la destinataire; conserver le pronom évite d’ajouter une identification interprétative.
translation_notes:
  register: Français moderne, clair et digne. Le redoublement « mais toi, tu » marque naturellement le contraste appuyé du latin entre « les autres » et la destinataire féminine. Aucun appel de note n’est nécessaire, la note anglaise fournie étant un vestige éditorial qui ne signale pas une variante du texte latin.
