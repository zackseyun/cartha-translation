  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: fr
  text: Mère, serre tes enfants dans tes bras ; élève-les dans la joie comme une colombe ; affermis leurs pieds, car je t’ai choisie, dit le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: complectere
  choice: serre… dans tes bras
  rationale: Rend concrètement l’impératif latin « embrasser, enlacer » dans un français naturel et chaleureux.
- source_word: educa
  choice: élève-les
  rationale: Dans ce contexte maternel, le verbe signifie faire grandir et éduquer les enfants.
- source_word: cum laetitia
  choice: dans la joie
  rationale: Expression française idiomatique qui conserve l’idée de joie accompagnant leur éducation.
- source_word: sicut columba
  choice: comme une colombe
  rationale: Conserve sans l’expliciter la comparaison du texte latin, dont la portée exacte reste ouverte.
- source_word: confirma pedes eorum
  choice: affermis leurs pas
  rationale: La formulation idiomatique garde l’image corporelle des pieds tout en exprimant stabilité et assurance.
- source_word: elegi
  choice: j’ai choisie
  rationale: Le participe féminin renvoie à « Mère » et préserve l’affirmation directe de l’élection divine.
theological_decisions:
- issue: Identité de la « Mère »
  choice: Maintenir l’adresse « Mère » sans identification supplémentaire
  alternative: Préciser qu’il s’agit de Sion, de Jérusalem ou d’une communauté
  rationale: Le verset ne nomme pas explicitement cette figure ; une précision résoudrait une ambiguïté que le texte conserve.
- issue: Portée de la comparaison avec la colombe
  choice: Conserver « comme une colombe » sans commentaire interprétatif
  alternative: Expliciter la douceur, la sollicitude ou la fécondité maternelle
  rationale: Le latin formule seulement la comparaison et ne définit pas son aspect précis.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond aux impératifs singuliers adressés à la figure maternelle. Les points-virgules préservent le rythme des exhortations successives.
