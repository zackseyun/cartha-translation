  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: fr
  text: Rends justice à la veuve, à l’orphelin ; donne à celui qui est dans le besoin ; protège l’orphelin ; habille celui qui est nu ; prends soin du blessé, du faible et du boiteux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Viduam iustifica
  choice: Défends les droits de la veuve
  rationale: Dans ce contexte d’exhortation sociale et judiciaire, « iustifica » signifie faire droit à la veuve ou défendre sa juste cause, plutôt que la déclarer moralement juste.
- source_word: pupillo iudica
  choice: rends justice à l’orphelin
  rationale: Reproduit le sens judiciaire de « iudica » avec une tournure française naturelle.
- source_word: egenti da
  choice: donne à celui qui est dans le besoin
  rationale: Rend directement « egens », la personne indigente ou nécessiteuse, dans un français courant et digne.
- source_word: orfanum tuere
  choice: protège l’enfant sans père
  rationale: Distingue « orfanum » de « pupillus » dans la même série et exprime le sens ancien concret d’un enfant privé de père.
- source_word: Confractum et debilem cura, claudum
  choice: prends soin de celui qui est brisé, du faible et du boiteux
  rationale: 'Fait porter naturellement l’impératif « cura » sur les trois accusatifs et conserve leurs distinctions : personne brisée, faible et boiteuse.'
theological_decisions:
- issue: Portée de l’expression « Viduam iustifica »
  choice: Défends les droits de la veuve
  alternative: Justifie la veuve
  rationale: Le contexte commande une action de justice en faveur d’une personne vulnérable; « justifie » serait ambigu en français moderne et pourrait suggérer à tort une déclaration doctrinale de justification.
- issue: Distinction entre « pupillus » et « orfanus »
  choice: orphelin / enfant sans père
  alternative: orphelin / orphelin
  rationale: La variation française préserve la présence de deux termes latins proches sans effacer leur nuance possible ni créer une doctrine particulière.
translation_notes:
  register: Suite d’impératifs brefs et solennels, formulés dans un français moderne accessible. La répétition des personnes vulnérables est conservée, tandis que la syntaxe finale est légèrement lissée pour faire clairement dépendre les trois compléments de « prends soin ».
