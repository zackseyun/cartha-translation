  yaml_path: translation/extra_canonical/2_esdras/002/023.yaml
  text: and I will give you the first seat in my resurrection[23]. Pause and rest[a],
translation:
  language: fr
  text: et je te donnerai la première place dans ma résurrection[a]. Repose-toi et reste tranquille,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le premier siège dans ma résurrection » ; l’expression évoque probablement la priorité ou une place d’honneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: primam sessionem
  choice: la première place
  rationale: Littéralement « le premier siège »; en français actuel, « la première place » exprime naturellement l’idée de priorité ou d’honneur tout en évitant l’image réductrice d’un siège matériel.
- source_word: in resurrectione mea
  choice: dans ma résurrection
  rationale: Conserve la formulation latine et son ambiguïté théologique, sans préciser si « ma » désigne une résurrection opérée par le locuteur ou celle à laquelle il appartient.
- source_word: Pausa et quiesce
  choice: Repose-toi et demeure en paix
  rationale: En latin tardif chrétien, pausare peut évoquer le repos durable, notamment eschatologique; quiescere ajoute l’idée de calme et de tranquillité. Cette formulation rend le doublet sans le banaliser en simple interruption momentanée.
theological_decisions:
- issue: Nature de la « première place » lors de la résurrection
  choice: Conserver « la première place dans ma résurrection »
  alternative: « la place d’honneur lors de ma résurrection »
  rationale: La traduction retenue préserve la métaphore et l’indétermination du latin; l’alternative expliciterait excessivement qu’il s’agit d’un honneur.
- issue: Valeur eschatologique de pausa et quiesce
  choice: « Repose-toi et demeure en paix »
  alternative: « Fais une pause et repose-toi »
  rationale: Le contexte et l’usage du latin tardif favorisent un repos profond ou durable plutôt qu’une simple pause temporaire, sans toutefois ajouter explicitement la mort ou l’attente de la résurrection.
translation_notes:
  register: Français moderne, digne et accessible. La coordination initiale et la virgule finale sont conservées parce que le fragment s’insère dans une phrase plus longue. Le tutoiement correspond au singulier latin tibi et aux impératifs singuliers.
