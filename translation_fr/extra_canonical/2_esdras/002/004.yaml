source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: fr
  text: parce que vous avez péché devant le Seigneur Dieu et fait ce qui est mal devant moi. Mais maintenant, que puis-je faire pour vous ? Car je suis veuve et abandonnée. Allez, mes enfants, et demandez au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  choice: devant le Seigneur Dieu
  rationale: Rend directement l’idée de pécher en présence de Dieu, dans un français biblique clair et actuel.
- source_word: uidua sum et derelicta
  choice: je suis veuve et abandonnée
  rationale: Conserve les deux affirmations distinctes du latin sans préciser l’identité figurée de la locutrice.
- source_word: petite a domino
  choice: demandez au Seigneur
  rationale: Le complément de ce qui doit être demandé n’est pas exprimé dans le latin ; la traduction préserve cette ellipse sans ajouter « la miséricorde ».
theological_decisions:
- issue: Objet implicite de « petite »
  choice: Ne pas préciser ce que les enfants doivent demander au Seigneur.
  alternative: « demandez la miséricorde du Seigneur »
  rationale: Le latin ne nomme aucun objet ; en ajouter un résoudrait indûment une ambiguïté réelle du texte.
translation_notes:
  register: Français moderne, courant et digne. Le début en minuscule conserve le lien syntaxique signalé par « parce que » avec le contexte précédent ; les appellations et la métaphore de la veuve restent littérales.
