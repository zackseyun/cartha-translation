lexical_decisions:
- source_word: caelestia regna
  choice: les royaumes célestes
  rationale: Conserve le pluriel du latin et son sens littéral, sans réduire l’expression au singulier ni l’interpréter comme un simple lieu céleste.
- source_word: uocauit
  choice: a appelé
  rationale: Rend directement le parfait latin, dont le sujet masculin singulier demeure implicite.
- source_word: Surgite et state
  choice: Levez-vous, tenez-vous debout
  rationale: Préserve les deux impératifs pluriels distincts tout en employant une formulation française naturelle.
- source_word: uidete numerum
  choice: voyez le nombre
  rationale: Suit sobrement le texte latin sans ajouter de complément absent de l’extrait fourni.
theological_decisions:
- issue: Sens du pluriel « caelestia regna »
  choice: les royaumes célestes
  alternative: le royaume céleste
  rationale: Le pluriel explicite « regna » est maintenu afin de ne pas harmoniser le texte avec une expression théologique plus habituelle au singulier.
- issue: Complément de « le nombre »
  choice: Aucun complément ajouté
  alternative: le nombre de ceux qui ont été marqués du sceau
  rationale: L’extrait latin s’arrête à « numerum »; la traduction conserve donc cette fin ouverte sans importer la suite d’une autre tradition textuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La succession des impératifs reste concise, et l’étrangeté du pluriel « royaumes célestes » est volontairement préservée comme donnée du texte source.
