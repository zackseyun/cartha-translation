lexical_decisions:
- source_word: Tunc
  choice: Alors
  rationale: Rend naturellement la progression narrative marquée par l’adverbe latin.
- source_word: interrogaui angelum
  choice: j’interrogeai l’ange
  rationale: Traduction directe du verbe et de son complément, dans un registre narratif digne.
- source_word: et dixi
  choice: et lui dis
  rationale: Le pronom « lui » explicite en français le destinataire déjà indiqué, sans modifier le sens.
- source_word: qui sunt hi
  choice: Qui sont-ils
  rationale: La reprise pronominale est plus naturelle que « Qui sont ceux-ci ? » en français moderne; le référent demeure fourni par le contexte.
- source_word: domine
  choice: Seigneur
  rationale: Conserve l’interpellation respectueuse sans ajouter le possessif « mon », absent du latin.
theological_decisions:
- issue: Valeur de l’adresse domine
  choice: Seigneur
  alternative: mon seigneur
  rationale: Le latin porte une adresse honorifique, mais aucun possessif explicite; la traduction évite donc de l’ajouter.
translation_notes:
  register: Français moderne, clair et digne; passé simple maintenu pour la narration biblique écrite, sans archaïsme lexical.
