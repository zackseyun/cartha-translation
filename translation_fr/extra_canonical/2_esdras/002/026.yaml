source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
translation:
  language: fr
  text: Aucun d’eux ne périra, car je les réclamerai d’entre les tiens. Ne t’inquiète pas, car lorsque viendra le jour de la détresse et de l’angoisse,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interiet
  choice: périra
  rationale: Rend directement le futur latin et conserve la portée forte de la disparition ou de la perte.
- source_word: requiram
  choice: réclamerai
  rationale: Exprime l’idée que Dieu les demandera au groupe confié à l’interlocutrice, sans réduire le verbe à une simple recherche.
- source_word: de numero tuo
  choice: du nombre des tiens
  rationale: Formulation française naturelle qui préserve l’idée d’appartenance au groupe relevant de l’interlocutrice.
- source_word: satagere
  choice: t’inquiète
  rationale: Dans l’impératif négatif, le verbe désigne ici l’agitation soucieuse ou l’anxiété.
- source_word: pressurae et angustiae
  choice: de la détresse et de l’angoisse
  rationale: Conserve le doublet latin et sa tension expressive dans un français actuel.
theological_decisions:
- issue: Sens de « eos requiram de numero tuo »
  choice: « je les réclamerai du nombre des tiens »
  alternative: « je les rechercherai parmi les tiens »
  rationale: « Réclamerai » garde la nuance de responsabilité ou de reddition de comptes possible dans requirere, tout en évitant de préciser qui n’est pas explicité dans le latin.
- issue: Phrase laissée en suspens à la fin du verset
  choice: Conserver la virgule finale et la subordonnée inachevée
  alternative: Compléter avec le contenu d’une tradition ou d’un verset voisin
  rationale: Le texte source fourni s’arrête après la proposition temporelle; aucun complément absent ne doit être importé.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé puisque le latin emploie la deuxième personne du singulier. Le verset demeure syntaxiquement ouvert, conformément au témoin latin fourni.
