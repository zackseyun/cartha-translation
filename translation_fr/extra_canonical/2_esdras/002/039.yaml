  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
translation:
  language: fr
  text: Ceux qui sont sortis de l’ombre du monde[a] ont reçu du Seigneur des vêtements resplendissants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin saeculi peut aussi désigner « l’âge » ou « l’époque ».
    reason: Préserver l’ambiguïté sémantique de saeculi sans ajouter l’idée de « présent » au texte.
lexical_decisions:
- source_word: se de umbra saeculi transtulerunt
  choice: sont sortis de l’ombre du monde présent
  rationale: Le verbe pronominal latin exprime le passage hors d’un domaine. « Sont sortis » le rend naturellement en français, tandis que « monde présent » restitue ici le sens temporel et cosmique de saeculum sans donner à croire qu’il s’agit d’une ombre physique.
- source_word: splendidas tunicas
  choice: des vêtements resplendissants
  rationale: Tunica désigne un vêtement porté sur le corps, mais « tunique » serait inutilement étroit en français moderne. « Vêtements » reste naturel, et « resplendissants » conserve la force de splendidas.
- source_word: a domino acceperunt
  choice: ont reçu du Seigneur
  rationale: Cette formulation reproduit clairement le donateur introduit par a et conserve le titre divin dominus.
theological_decisions:
- issue: Portée de saeculi
  choice: du monde présent
  alternative: de l’âge
  rationale: Saeculum peut désigner le monde, l’époque ou l’âge présent. Le texte évoque vraisemblablement le passage hors de l’ordre présent, mais la note maintient l’ambiguïté lexicale réelle.
- issue: Structure syntaxique de Qui… acceperunt
  choice: 'phrase indépendante : « Ceux qui… ont reçu »'
  alternative: proposition relative rattachée à la phrase précédente avec ajout de « et »
  rationale: Qui introduit ici une relative substantive servant de sujet à acceperunt. Aucun « et » ne figure dans le latin, et la structure forme une phrase complète.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’image de l’ombre et l’éclat des vêtements, tout en évitant le calque peu naturel « se transférer hors de ».
