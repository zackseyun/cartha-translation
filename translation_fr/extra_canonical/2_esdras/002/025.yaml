lexical_decisions:
- source_word: filios tuos
  choice: tes enfants
  rationale: « Enfants » rend naturellement le pluriel latin filios dans une adresse collective, sans imposer le masculin « fils » lorsque le contexte fourni ne l’exige pas.
- source_word: confirma
  choice: affermis
  rationale: L’impératif latin signifie rendre ferme ou stable; « affermis » conserve cette image et le ton digne.
- source_word: pedes eorum
  choice: leurs pas
  rationale: Le latin dit littéralement « leurs pieds »; en français, « affermir les pas » exprime naturellement l’idée de stabilité dans la marche tout en préservant l’image.
- source_word: Seruos quos tibi dedi
  choice: Les serviteurs que je t’ai donnés
  rationale: Traduction directe du syntagme latin, laissée syntaxiquement ouverte puisque la phrase se poursuit au verset suivant.
theological_decisions:
- issue: Référent et portée de « filios »
  choice: tes enfants
  alternative: tes fils
  rationale: Le fragment ne permet pas d’établir que seuls des hommes sont visés; « enfants » maintient la relation exprimée sans ajouter une restriction de genre.
