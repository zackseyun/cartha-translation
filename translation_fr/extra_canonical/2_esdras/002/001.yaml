  source_fidelity: 'Le sens général est fidèle : la sortie de servitude, le don des commandements par les prophètes, le refus de les entendre et l’annulation des desseins sont tous conservés. Toutefois, la division en deux phrases fait de « Ils » un sujet dont l’antécédent est moins net, tandis que « les écouter » peut se rattacher par proximité aux commandements plutôt qu’aux prophètes. Le relatif latin quos désigne explicitement les prophètes.'
  naturalness: Le français est moderne et solennel. Une relative intégrée à la phrase rend plus nettement et plus naturellement le lien entre « les prophètes » et le refus de les écouter.
  terminology: « Seigneur », « servitude », « serviteurs », « prophètes », « commandements » et « desseins » conviennent au registre et au latin. « Rendre mes desseins sans effet » rend bien irrita fecerunt sans résoudre la tension théologique du texte.
