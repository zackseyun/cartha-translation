source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my servants the prophets, whom they were unwilling to hear, but they made my counsels void.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur : J’ai fait sortir ce peuple de la servitude et je lui ai donné des commandements par l’intermédiaire de mes serviteurs, les prophètes, qu’ils n’ont pas voulu écouter ; mais ils ont rendu mes desseins sans effet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seruitute
  choice: servitude
  rationale: Le terme conserve l’idée d’assujettissement tout en évoquant naturellement la délivrance d’Israël.
- source_word: pueros meos prophetas
  choice: mes serviteurs, les prophètes
  rationale: Dans ce contexte, « pueri » désigne ceux qui servent Dieu; « serviteurs » est naturel et digne en français, tandis que « garçons » serait trompeur.
- source_word: audire
  choice: écouter
  rationale: « Écouter » exprime ici non seulement l’audition, mais aussi l’accueil du message transmis par les prophètes.
- source_word: consilia
  choice: desseins
  rationale: « Desseins » préserve l’étendue du latin, qui peut désigner les projets, les décisions ou les conseils de Dieu.
- source_word: irrita fecerunt
  choice: ont rendu … sans effet
  rationale: Cette formulation rend directement l’idée d’annuler, de contrecarrer ou de priver d’effet les desseins divins, sans préciser artificiellement le mécanisme.
theological_decisions:
- issue: Rapport entre le refus d’écouter les prophètes et la mise en échec des desseins divins
  choice: 'Conserver la coordination adversative : « mais ils ont rendu mes desseins sans effet »'
  alternative: Fondre les deux actes en une seule proposition causale ou les présenter comme parfaitement synonymes
  rationale: Le latin distingue explicitement « quos audire noluerunt » de « sed irrita fecerunt mea consilia ». La traduction maintient cette tension sans expliquer comment des humains peuvent rendre les desseins de Dieu sans effet.
translation_notes:
  register: Français moderne, clair et solennel. La longue phrase latine est divisée après « les prophètes » afin d’éviter une relative lourde ou ambiguë, tout en conservant clairement les prophètes comme objet du verbe « écouter ».
