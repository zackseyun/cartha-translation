source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
translation:
  language: fr
  text: Vous, les non-Juifs[a] qui entendez et comprenez, attendez votre berger. Il vous donnera le repos éternel, car celui qui viendra à la fin de l’âge est proche. Tenez-vous prêts à recevoir les récompenses du royaume,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nations ». Le terme désigne ici ceux qui sont opposés à Israël dans le verset précédent.'
    reason: Préserver l’alternative plus littérale pour gentes tout en indiquant sa valeur contextuelle de non-Juifs.
lexical_decisions:
- source_word: gentes (compris d’après le contexte immédiat) / quae
  choice: les non-Juifs qui
  rationale: Le passage oppose ce groupe à Israël au verset précédent. « Non-Juifs » rend clairement la valeur chrétienne ancienne de gentes, tandis que la relative latine quae est exprimée naturellement par « qui ».
- source_word: auditis et intellegitis
  choice: entendez et comprenez
  rationale: Rend directement les deux verbes sans réduire audire à la simple écoute physique.
- source_word: pastorem uestrum
  choice: votre berger
  rationale: « Berger » conserve l’image pastorale et sa portée théologique sans l’expliciter davantage.
- source_word: requiem aeternitatis
  choice: le repos éternel
  rationale: Formulation française naturelle correspondant au génitif latin « de l’éternité ».
- source_word: in proximo est
  choice: il est proche
  rationale: Conserve l’ambiguïté possible entre proximité temporelle et proximité personnelle.
- source_word: in finem saeculi
  choice: à la fin de l’ère
  rationale: Saeculum désigne ici l’ère ou l’âge présent, plutôt que le monde matériel.
- source_word: Parati estote ad praemia regni
  choice: Tenez-vous prêts à recevoir les récompenses du royaume
  rationale: Exprime naturellement l’orientation de ad vers les récompenses promises, sans préciser leur nature.
theological_decisions:
- issue: Identification des destinataires en contraste avec Israël
  choice: les non-Juifs
  alternative: les nations / les gens des nations
  rationale: Le contexte chrétien latin oppose explicitement Israël aux gentes. « Non-Juifs » communique cette distinction sans employer « Gentils », terme aujourd’hui moins transparent en français courant.
- issue: Nature de la proximité de celui qui vient
  choice: car il est proche
  alternative: car sa venue est proche
  rationale: Le latin affirme que la personne elle-même est proche; la traduction ne transforme donc pas cette affirmation en simple proximité de l’événement.
- issue: Sens eschatologique de saeculum
  choice: la fin de l’ère
  alternative: la fin du monde / la fin des temps
  rationale: « Ère » préserve la notion d’un âge qui arrive à son terme et évite d’imposer l’idée de destruction du monde.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement collectif est rendu par « vous ». La ponctuation sépare les impératifs tout en conservant la virgule finale, puisque la phrase se poursuit dans le verset suivant.
