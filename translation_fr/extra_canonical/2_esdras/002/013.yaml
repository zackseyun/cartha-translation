  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
translation:
  language: fr
  text: Demandez, et vous recevrez ; priez pour que vos quelques jours soient abrégés.[a] Le royaume est déjà préparé pour vous ; veillez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La phrase latine est difficile. Elle peut évoquer l’abrègement des jours du temps présent ou de la détresse présente, plutôt qu’une prière demandant une vie plus courte. On a aussi traduit : « priez pour que vos jours soient peu nombreux et abrégés » ; toutefois, la construction latine signifie probablement : « priez pour que vos quelques jours soient abrégés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Petite et accipietis
  choice: Demandez, et vous recevrez
  rationale: Rend directement l’impératif et le futur latins dans une formulation française naturelle, tout en conservant leur écho biblique.
- source_word: rogate uobis dies paucos ut minorentur
  choice: priez pour que vos quelques jours soient abrégés
  rationale: 'Respecte la construction proleptique probable : « dies paucos » anticipe le sujet de « minorentur ». « Abrégés » convient à l’idée apocalyptique de jours raccourcis sans réduire explicitement le passage à la durée de vie individuelle.'
- source_word: iam paratum est uobis regnum
  choice: Le royaume est déjà préparé pour vous
  rationale: Conserve l’accompli résultatif de « paratum est », la valeur temporelle de « iam » et le bénéficiaire « uobis ».
- source_word: uigilate
  choice: veillez
  rationale: Équivalent biblique usuel et précis, exprimant la vigilance plutôt que le simple fait de rester éveillé.
theological_decisions:
- issue: Référent de « vos quelques jours »
  choice: Maintenir la formulation littérale « vos quelques jours » et signaler l’incertitude en note
  alternative: Expliciter « les jours de la détresse présente » ou comprendre une courte durée de vie
  rationale: Le latin est difficile et permet une portée apocalyptique sans nommer expressément l’âge présent ni la détresse. Le texte principal préserve donc la tension plutôt que de la résoudre.
- issue: Temporalité de la préparation du royaume
  choice: « est déjà préparé »
  alternative: « est maintenant prêt »
  rationale: Cette formulation préserve à la fois « iam » et l’état résultant exprimé par le parfait passif, sans préciser le moment de l’entrée dans le royaume.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation conserve les quatre exhortations ou affirmations successives du latin. Le marqueur de note est placé immédiatement après la proposition concernée.
