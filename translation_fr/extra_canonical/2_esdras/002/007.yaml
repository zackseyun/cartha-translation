  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: fr
  text: Que leur descendance prenne fin.[a] Qu’ils soient dispersés parmi les nations, que leurs noms soient effacés de la terre, car ils ont méprisé mon alliance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin transmis dit littéralement : « Que leur génération soit », formulation qui paraît elliptique ou textuellement difficile. Le contexte indique probablement le souhait que leur descendance cesse.'
    reason: Signaler honnêtement l’ambiguïté du texte source derrière une formulation française nécessairement interprétative.
lexical_decisions:
- source_word: generatio eorum fiat
  choice: Que leur descendance prenne fin
  rationale: « Generatio » désigne ici la lignée ou la descendance. Le latin transmis, pris isolément, est elliptique ou textuellement difficile; dans ce contexte imprécatoire, la traduction exprime naturellement le souhait de voir cette lignée cesser, sans employer le calque obscur « que leur génération soit ».
- source_word: Dispergantur in gentes
  choice: Qu’ils soient dispersés parmi les nations
  rationale: Rend directement le passif exhortatif latin et conserve « nations » pour « gentes ».
- source_word: nomina eorum deleantur a terra
  choice: que leurs noms soient effacés de la terre
  rationale: « Effacés » restitue l’image de « deleantur » et la disparition de toute mémoire ou présence terrestre.
- source_word: spreuerunt testamentum meum
  choice: ils ont méprisé mon alliance
  rationale: « Méprisé » garde la force de « spreuerunt »; « alliance » est le terme biblique naturel pour « testamentum » dans la relation entre Dieu et son peuple.
theological_decisions:
- issue: Portée de l’imprécation initiale
  choice: La comprendre comme le souhait que leur descendance cesse
  alternative: Traduire littéralement « Que leur génération soit »
  rationale: Le libellé latin conservé est difficile et semble elliptique. Le parallélisme avec la dispersion et l’effacement des noms favorise une imprécation visant la disparition de la lignée, mais la difficulté textuelle est signalée en note plutôt que dissimulée.
translation_notes:
  register: Français international moderne, sobre et solennel. Les impératifs de souhait sont rendus par « que » suivi du subjonctif, conformément au ton imprécatoire du passage.
