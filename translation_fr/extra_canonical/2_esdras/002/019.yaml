    issue: Intensification possible par « couvertes de roses et de lis »
    rationale: « Habentes rosam et lilium » indique que les montagnes ont des roses et des lis; « couvertes » peut impliquer une couverture totale ou particulièrement dense non explicitée.
  - severity: low
    issue: Ancre de note placée en fin de phrase
    rationale: La note concerne spécifiquement l’objet « tes enfants »; l’ancrer immédiatement après ce groupe rend la documentation plus claire.
