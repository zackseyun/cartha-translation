  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
translation:
  language: fr
  text: et autant de sources d’où coulent du lait et du miel, ainsi que sept immenses montagnes avec des roses et des lis, où je comblerai tes enfants[a] de joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’extrait latin fourni, l’objet de « je comblerai » n’est pas exprimé; « tes enfants » est conservé d’après le texte de consultation audité.
    reason: Signaler avec transparence que le complément retenu n’apparaît pas dans l’extrait latin transmis.
lexical_decisions:
- source_word: totidem fontes
  choice: autant de sources
  rationale: « Totidem » renvoie à un nombre égal déjà mentionné dans le contexte; « autant de » conserve cette relation sans préciser artificiellement le nombre.
- source_word: fluentes lac et mel
  choice: d’où couleront du lait et du miel
  rationale: Cette tournure française naturelle conserve l’image concrète de sources faisant couler du lait et du miel.
- source_word: montes inmensos septem
  choice: sept immenses montagnes
  rationale: Rend directement le nombre et la grandeur exprimés par le latin, dans un ordre idiomatique en français.
- source_word: habentes rosam et lilium
  choice: couvertes de roses et de lis
  rationale: Les singuliers latins ont ici une valeur collective. « Couvertes de » exprime naturellement l’abondance végétale impliquée, sans présenter les montagnes comme possédant seulement deux fleurs.
- source_word: gaudio replebo
  choice: je comblerai … de joie
  rationale: « Combler de joie » restitue avec naturel l’idée de remplir pleinement de joie.
theological_decisions:
- issue: Objet non exprimé de « replebo » dans l’extrait latin fourni
  choice: tes enfants
  alternative: les / un objet laissé implicite
  rationale: Le latin cité exige sémantiquement un objet mais ne l’exprime pas dans l’extrait. La couche anglaise auditée atteste « your children »; le choix est donc retenu tout en signalant l’état du texte latin fourni.
- issue: Référent de « in quibus »
  choice: où, se rapportant naturellement aux montagnes
  alternative: par lesquels, avec une valeur instrumentale
  rationale: Le latin signifie littéralement « dans lesquels ». Le relatif masculin pluriel vise le plus naturellement les « montes » et décrit le lieu où la joie sera donnée, sans transformer le lieu en moyen instrumental.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Lis » est la graphie moderne recommandée. La formulation garde le caractère luxuriant et poétique de la vision.
