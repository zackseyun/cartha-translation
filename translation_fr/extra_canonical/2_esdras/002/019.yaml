  rationale: La révision retire un futur non exprimé et une nuance de recouvrement potentiellement excessive, tout en conservant le caractère luxuriant du texte. Elle garde « tes enfants » conformément à la piste d’audit, avec une note explicitant que cet objet manque dans l’extrait latin communiqué, et place l’appel de note sur le groupe concerné.
