source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et in medio eorum erat iuuenis statura celsus, eminentior omnibus illis, et singulis eorum capitibus inponebat coronas, et magis exaltabatur: ego autem miracul[o] tenebar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: fr
  text: Au milieu d’eux se trouvait un jeune homme de haute stature, plus grand que tous les autres. Il posait une couronne sur la tête de chacun d’eux et était encore davantage exalté. Quant à moi, j’étais saisi d’émerveillement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis
  choice: jeune homme
  rationale: Rend directement le latin et convient au registre narratif.
- source_word: statura celsus, eminentior omnibus illis
  choice: de haute stature, plus grand que tous les autres
  rationale: Préserve l’image physique et le comparatif du latin sans alourdir la phrase.
- source_word: singulis eorum capitibus inponebat coronas
  choice: Il posait une couronne sur la tête de chacun d’eux
  rationale: 'Exprime naturellement en français la distribution implicite : une couronne pour chaque personne, tout en rendant capitibus et coronas.'
- source_word: magis exaltabatur
  choice: paraissait encore plus élevé
  rationale: Conserve la formulation passive et l’ambiguïté entre hauteur visible et élévation honorifique, sans imposer une interprétation théologique.
- source_word: miraculo tenebar
  choice: j’étais saisi d’émerveillement
  rationale: Formulation française naturelle qui garde la force du passif latin et le sens d’étonnement admiratif.
theological_decisions:
- issue: Nature de l’élévation du jeune homme
  choice: paraissait encore plus élevé
  alternative: était encore davantage exalté
  rationale: Le contexte peut évoquer à la fois une supériorité visible et une dignité éminente. La traduction retenue maintient cette tension sans introduire une exaltation doctrinale explicite.
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation répartit la longue période latine en trois phrases pour une lecture naturelle, sans modifier la progression de la scène.
