  source_fidelity: Le texte latin transmis porte « Recipe, Sion, numerum tuum et conclude candidatos tuos, qui legem [Domini] impleverunt ». Le projet rend correctement l'impératif, Sion, l'image des vêtements blancs et l'accomplissement de la loi. Toutefois, « le nombre des tiens » interprète possessivement numerum tuum et atténue l'expression directe « ton nombre », tandis que « rassemble » ne rend pas nettement conclude, qui signifie ici achever/compléter le nombre ou l'assemblée. La proposition anglaise « gather in » reflète une interprétation contextuelle, mais ne justifie pas de supprimer la nuance d'achèvement dans le français.
  naturalness: '« Reçois ton nombre » est inhabituel mais reste intelligible dans un registre scripturaire moderne et conserve l''ambiguïté voulue : il peut désigner le nombre assigné ou la totalité des siens. « Complète » est naturel et exprime la nuance du latin sans expliciter indûment le mécanisme. « ceux qui sont vêtus de blanc » est clair et idiomatique.'
  terminology: « Vêtus de blanc » rend adéquatement candidatos et son imagerie de blancheur. Le terme ne doit pas être réduit à « candidats », ni identifié à des baptisés ou à des martyrs. « La loi du Seigneur » est fidèle au registre et à la terminologie du passage.
