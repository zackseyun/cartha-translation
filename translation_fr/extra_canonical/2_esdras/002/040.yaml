  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
translation:
  language: fr
  text: Reçois ton nombre, Sion, et complète ceux qui sont vêtus de blanc[a], eux qui ont accompli la loi du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin candidatos désigne ici des personnes vêtues de blanc; le mot peut aussi se traduire littéralement par « candidats ». L’image des vêtements blancs convient au contexte de la vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: numerum tuum
  choice: le nombre des tiens
  rationale: Cette formulation conserve l’idée de nombre ou d’effectif tout en étant plus naturelle en français que le calque « ton nombre ».
- source_word: conclude
  choice: rassemble
  rationale: Dans ce contexte d’accueil à Sion, le verbe exprime l’action de réunir ou de faire entrer dans un même ensemble.
- source_word: candidatos tuos
  choice: ceux qui sont vêtus de blanc
  rationale: « Candidatos » évoque étymologiquement et visuellement des personnes en vêtements d’un blanc éclatant. Le rendu maintient l’image vestimentaire de la vision plutôt que le sens politique moderne de « candidats ».
- source_word: impleverunt (implied by the supplied verse context)
  choice: ont accompli
  rationale: « Accomplir la loi » rend naturellement en français l’idée d’observer pleinement ou de mener à son terme ce qu’exige la loi.
theological_decisions:
- issue: Identité des « candidatos »
  choice: Ne pas préciser s’il s’agit de baptisés, de martyrs ou d’un autre groupe
  alternative: Les appeler explicitement « baptisés » ou « martyrs »
  rationale: Le terme latin fournit l’image des vêtements blancs, mais le verset ne permet pas à lui seul d’imposer une identification théologique plus précise.
translation_notes:
  register: Français moderne, digne et accessible. « Le nombre des tiens » préserve l’expression comptable du latin sans produire le calque peu naturel « ton nombre ». L’image spécifique du blanc est explicitement maintenue.
