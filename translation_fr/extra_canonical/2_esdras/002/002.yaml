  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: fr
  text: 'La mère qui les a mis au monde leur dit : « Allez, enfants, car je suis veuve et abandonnée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater
  choice: La mère
  rationale: Correspondance directe et naturelle en français.
- source_word: quae eos generauit
  choice: qui les a mis au monde
  rationale: Rend le sens maternel concret de generavit dans un français courant et digne, plutôt que le plus littéral « qui les a engendrés ».
- source_word: ite, filii
  choice: Allez, mes enfants
  rationale: « Enfants » convient à l’adresse d’une mère ; le possessif, bien qu’implicite plutôt qu’exprimé en latin, est idiomatique dans l’apostrophe française.
- source_word: uidua sum et derelicta
  choice: je suis veuve et abandonnée
  rationale: Traduction directe des deux états coordonnés, en conservant leur force et leur simplicité.
