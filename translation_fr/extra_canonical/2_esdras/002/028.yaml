  yaml_path: translation/extra_canonical/2_esdras/002/028.yaml
  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: fr
  text: Mes mains te couvriront, afin que tes enfants ne voient pas la géhenne. Réjouis-toi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Manus meae
  choice: Mes mains
  rationale: Reproduction directe du pluriel latin, avec le possessif.
- source_word: tegent te
  choice: te couvriront
  rationale: Le futur français conserve le temps de tegent et l’image protectrice de « couvrir ».
- source_word: filii tui
  choice: tes enfants
  rationale: « Enfants » rend naturellement filii dans un contexte collectif sans imposer qu’il s’agisse uniquement de fils masculins.
- source_word: gehennam
  choice: la géhenne
  rationale: Translittération traditionnelle et précise du terme, sans le réduire au mot plus interprétatif « enfer ».
- source_word: Iocundare
  choice: Réjouis-toi
  rationale: Impératif idiomatique qui exprime l’appel à la joie contenu dans le latin.
theological_decisions:
- issue: Nature de la géhenne
  choice: Conserver « la géhenne »
  alternative: « l’enfer »
  rationale: Le terme source désigne explicitement la géhenne; le conserver évite d’identifier sans nuance ce terme à une formulation théologique plus générale.
- issue: Sens de la couverture divine
  choice: Maintenir l’image « Mes mains te couvriront »
  alternative: « Mes mains te protégeront »
  rationale: La traduction conserve la métaphore du texte latin sans expliciter davantage le mode ou la portée de cette protection.
translation_notes:
  register: Français moderne, simple et digne. La virgule finale est conservée parce que le verset se poursuit syntaxiquement dans le contexte éditorial.
