  yaml_path: translation/extra_canonical/2_esdras/002/016.yaml
  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
translation:
  language: fr
  text: Et je ressusciterai les morts des lieux où ils se trouvent, et je les ferai sortir de leurs tombeaux, parce que j’ai connu mon nom en eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce que j’ai connu mon nom en eux ». Cette clause du latin est inhabituelle. On peut aussi la comprendre, de manière plus idiomatique, comme : « parce que je reconnais mon nom en eux ». Certains proposent par conjecture : « parce qu’ils ont connu mon nom ».'
    reason: textual_variant
lexical_decisions:
- source_word: resuscitabo
  choice: je ressusciterai
  rationale: Rend directement le futur latin et, dans ce contexte, la résurrection des morts.
- source_word: de locis suis
  choice: de l’endroit où ils se trouvent
  rationale: Exprime naturellement le sens de leurs lieux propres ou actuels sans suggérer que les morts possèdent ces lieux.
- source_word: de monumentis
  choice: de leurs tombeaux
  rationale: Dans ce contexte funéraire, monumenta désigne les sépulcres ou tombeaux.
- source_word: cognoui
  choice: je reconnais
  rationale: Le parfait latin peut exprimer un état acquis ayant valeur présente; « reconnaître » conserve l’acte divin de discerner son propre nom en eux et évite le français artificiel « j’ai connu mon nom ».
theological_decisions:
- issue: Sens de « cognoui nomen meum in illis »
  choice: parce que je reconnais mon nom en eux
  alternative: parce que j’ai connu mon nom en eux; ou, par conjecture interprétative, parce qu’ils ont connu mon nom
  rationale: Le texte latin conservé fait de Dieu le sujet de cognoui et « mon nom » son objet. La traduction maintient cette syntaxe et sa tension théologique, tout en employant un français intelligible, sans inverser les rôles par conjecture.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « et je » reproduit l’enchaînement solennel du latin. Le marqueur de note est placé après la proposition concernée.
