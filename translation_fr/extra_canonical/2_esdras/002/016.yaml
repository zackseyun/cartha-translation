  source_fidelity: La structure de la phrase et les termes funéraires sont globalement fidèles. Toutefois, le parfait latin cognoui est rendu plus directement par « j’ai connu »; « je reconnais » est une interprétation possible de sa valeur résultative, mais atténue la difficulté voulue du texte conservé. « Des lieux où ils se trouvent » restitue plus précisément le pluriel de locis suis que le singulier « de l’endroit où ils se trouvent ».
  naturalness: La formulation révisée demeure idiomatique et solennelle en français moderne. La clause finale reste volontairement étrange, comme le latin, et la note en explique la difficulté.
