lexical_decisions:
- source_word: Filios tuos dormientes
  choice: tes enfants qui dorment
  rationale: Rend directement le participe latin dormientes tout en conservant l’ambiguïté entre sommeil ordinaire et image de la mort.
- source_word: memorare
  choice: Souviens-toi de
  rationale: Équivalent français naturel de l’impératif latin, adressé à la mère évoquée dans le contexte.
- source_word: quoniam
  choice: car
  rationale: Exprime la relation explicative ou causale dans un registre digne et courant.
- source_word: ego eos educam
  choice: je les ferai sortir
  rationale: Educam signifie ici « conduire dehors, faire sortir » ; la tournure française souligne l’action promise sans ajouter de précision doctrinale.
- source_word: de
  choice: des lieux cachés de la terre
  rationale: L’extrait latin fourni s’interrompt après la préposition de ; la fin est rendue d’après la couche anglaise auditée, qui témoigne de la suite du verset.
theological_decisions:
- issue: Le sommeil comme image possible de la mort
  choice: qui dorment
  alternative: endormis / morts
  rationale: La formulation littérale conserve la tension de l’image latine sans identifier explicitement le sommeil à la mort.
translation_notes:
  register: Français international moderne, simple et digne. La relative « qui dorment » est naturelle et maintient la portée imagée du latin. La virgule finale est conservée parce que le verset fourni se poursuit syntaxiquement.
