source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus ad Ezram: adnuntia populo meo, quoniam dabo eis regnum Hierusalem, quod daturus eram Israel.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/010.yaml
  text: 'Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur à Esdras : « Annonce à mon peuple que je lui donnerai le royaume de Jérusalem, que j’allais donner à Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec dicit dominus
  choice: Ainsi parle le Seigneur
  rationale: Formule prophétique française naturelle et digne, correspondant directement à la formule latine.
- source_word: adnuntia
  choice: Annonce
  rationale: Impératif direct qui conserve le sens de proclamation publique sans l'alourdir.
- source_word: populo meo
  choice: à mon peuple
  rationale: Rend simplement et fidèlement le datif latin.
- source_word: regnum Hierusalem
  choice: le royaume de Jérusalem
  rationale: Conserve la formulation inhabituelle et potentiellement chargée de sens du latin, sans la réduire à « la ville » ni l'interpréter comme « le règne ».
- source_word: quod daturus eram
  choice: que je devais donner
  rationale: Exprime la périphrase active passée et son intention antérieure; « devais » reste plus naturel en français que « étais sur le point de », sans affirmer une obligation extérieure.
theological_decisions:
- issue: Rapport entre « mon peuple » et « Israël »
  choice: Maintenir les deux désignations distinctes telles quelles
  alternative: Identifier explicitement « mon peuple » à un autre groupe ou reformuler Israël comme ancien bénéficiaire
  rationale: Le texte crée une tension entre les destinataires appelés « mon peuple » et Israël, sans expliquer leur identité ni leur rapport; la traduction ne doit pas résoudre cette ambiguïté.
- issue: Sens de « regnum Hierusalem »
  choice: « le royaume de Jérusalem »
  alternative: « la royauté de Jérusalem », « le règne à Jérusalem » ou « Jérusalem comme royaume »
  rationale: La traduction littérale préserve l'expression du texte et évite d'imposer une interprétation politique, territoriale ou eschatologique.
translation_notes:
  register: Français international moderne, clair et solennel. La citation directe améliore la lisibilité tout en conservant la structure prophétique. Aucun marqueur de note n'est requis.
