  yaml_path: translation/extra_canonical/2_esdras/002/014.yaml
  text: Bear witness[a], bear witness, O heaven and earth, for I have put away evil and created good, because I live, says the Lord.
translation:
  language: fr
  text: 'Prends à témoin, prends à témoin le ciel et la terre : j’ai écarté le mal et créé le bien, car je suis vivant, dit le Seigneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Testare, testare
  choice: Prends à témoin, prends à témoin
  rationale: L’impératif latin est conservé ainsi que sa répétition emphatique. En français, « prendre à témoin » rend naturellement l’idée d’appeler quelqu’un ou quelque chose comme témoin.
- source_word: caelum et terram
  choice: le ciel et la terre
  rationale: Les accusatifs latins se comprennent directement comme les compléments de « testare ».
- source_word: omisi
  choice: j’ai écarté
  rationale: « Écarter » exprime l’idée de mettre de côté ou de rejeter, sans préciser davantage la manière dont le mal est supprimé.
- source_word: creaui bonum
  choice: créé le bien
  rationale: Traduction directe qui maintient le contraste théologique entre le mal écarté et le bien créé.
- source_word: quia uiuo ego
  choice: car je suis vivant
  rationale: Cette formulation garde la valeur causale de « quia » et l’insistance de « ego », perceptible en français par la tournure solennelle « je suis vivant ».
- source_word: dicit dominus
  choice: dit le Seigneur
  rationale: Rendu direct et traditionnel, sans transformer la formule en une expression interprétative comme « oracle du Seigneur ».
theological_decisions:
- issue: Rapport de Dieu au mal et au bien
  choice: « j’ai écarté le mal et créé le bien »
  alternative: « j’ai supprimé le mal et fait le bien »
  rationale: Le texte distingue les verbes « omisi » et « creaui ». La traduction conserve cette asymétrie et n’attribue pas à Dieu la création du mal.
- issue: Formule « quia uiuo ego »
  choice: « car je suis vivant »
  alternative: « aussi vrai que je suis vivant »
  rationale: L’alternative explicite une possible nuance de serment, mais la traduction principale préserve la construction causale du latin et son étrangeté solennelle.
translation_notes:
  register: Français moderne, digne et solennel. La répétition de l’impératif, rhétoriquement marquée dans la source, est conservée sans l’adoucir.
