source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Mittam tibi adiutorium pueros meos Isaiam et Hieremiam, ad quorum consilium sanctificaui et paraui tibi arbores xii grauatās uariis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/018.yaml
  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: fr
  text: 'Je t’enverrai du secours : mes serviteurs, Ésaïe et Jérémie. D’après leur conseil, j’ai consacré et préparé pour toi douze arbres chargés de fruits variés,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mittam tibi adiutorium
  choice: Je t’enverrai comme secours
  rationale: Rend naturellement l’idée d’un secours envoyé au destinataire, tout en conservant la formulation au singulier collectif du latin.
- source_word: pueros meos
  choice: mes serviteurs
  rationale: Dans ce contexte, puer désigne des serviteurs de Dieu plutôt que de jeunes garçons; « serviteurs » est clair, digne et conforme au rôle prophétique d’Ésaïe et de Jérémie.
- source_word: ad quorum consilium
  choice: Selon leur conseil
  rationale: Conserve le lien explicite du latin entre le conseil des deux serviteurs et l’action divine, sans préciser davantage la nature de ce conseil.
- source_word: sanctificaui
  choice: j’ai consacré
  rationale: « Consacrer » exprime ici la mise à part pour un usage sacré plus naturellement que « sanctifier » appliqué à des arbres.
- source_word: arbores xii grauatas uariis
  choice: douze arbres chargés de fruits variés
  rationale: Le participe grauatas signifie « chargés/alourdis ». Le substantif « fruits », absent du texte latin transmis, est clairement sous-entendu par uariis et confirmé par le contexte; il est nécessaire à une formulation française intelligible.
theological_decisions:
- issue: Portée de l’expression « ad quorum consilium »
  choice: Selon leur conseil
  alternative: D’après leur dessein / suivant leurs recommandations
  rationale: La traduction garde l’attribution étonnante d’un « conseil » à Ésaïe et Jérémie, sans la réduire à leur prédication ni résoudre la tension entre leur conseil et l’action souveraine de Dieu.
translation_notes:
  register: Français international moderne, fluide et digne. La virgule finale est conservée parce que le verset se poursuit syntaxiquement dans le contexte éditorial.
