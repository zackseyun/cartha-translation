  yaml_path: translation/extra_canonical/2_esdras/002/047.yaml
  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
translation:
  language: fr
  text: 'Il me répondit[a] : « C’est lui, le Fils de Dieu, qu’ils ont confessé dans ce monde. » Alors je me mis à célébrer ceux qui avaient courageusement tenu ferme pour le nom du Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification explicite du personnage couronné comme « le Fils de Dieu » caractérise la couche rédactionnelle chrétienne plus tardive de ce chapitre; il ne faut donc pas la reporter sans discernement sur l’apocalypse juive des chapitres 3 à 14.
    reason: compositional_layer
lexical_decisions:
- source_word: ipse est filius dei
  choice: C’est lui, le Fils de Dieu
  rationale: La tournure détachée rend l’identification emphatique du latin tout en restant naturelle en français.
- source_word: quem ... confessi sunt
  choice: qu’ils ont confessé
  rationale: « Confesser » conserve la portée religieuse du latin confiteri et laisse ouverte la nuance entre reconnaître publiquement et professer sa foi en lui.
- source_word: in saeculo
  choice: dans ce monde
  rationale: Dans ce contexte chrétien latin, saeculum peut désigner l’ordre présent ou le monde où s’exerce la confession; « ce monde » est idiomatique sans imposer une époque historique précise.
- source_word: magnificare eos coepi
  choice: je me mis à célébrer ceux
  rationale: « Célébrer » exprime ici le fait de louer et d’honorer des personnes; « magnifier » serait moins courant et pourrait sembler artificiel.
- source_word: fortiter ... steterunt
  choice: avaient courageusement tenu ferme
  rationale: Cette formulation restitue à la fois la fermeté exprimée par stare et la vaillance de fortiter.
- source_word: pro nomine Domini
  choice: pour le nom du Seigneur
  rationale: La formulation conserve l’expression religieuse traditionnelle et l’idée d’endurer ou de résister par fidélité au nom du Seigneur.
theological_decisions:
- issue: Identification du personnage couronné
  choice: le Fils de Dieu
  alternative: un fils de Dieu
  rationale: Le latin porte l’article conceptuellement défini par ipse et emploie filius Dei comme titre explicite; la traduction ne doit ni atténuer ni développer cette identification.
- issue: Objet de la confession
  choice: qu’ils ont confessé
  alternative: en qui ils ont professé leur foi
  rationale: Le relatif latin quem a pour antécédent le Fils de Dieu. La formulation retenue préserve ce lien direct et l’ambivalence du verbe confiteri, sans expliciter une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du latin sans reproduire ses lourdeurs. Le texte source fourni s’interrompt après qui; la fin de la phrase est restituée d’après la continuation attestée et confirmée par la couche anglaise auditée.
