  yaml_path: translation/extra_canonical/2_esdras/002/048.yaml
  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
translation:
  language: fr
  text: 'Ils sont restés fermes avec courage pour le nom du Seigneur. Alors l’ange me dit : « Va annoncer à mon peuple quelles merveilles du Seigneur Dieu tu as vues et combien elles sont grandes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortiter ... steterunt
  choice: ont tenu ferme avec courage
  rationale: Rend à la fois l’idée de fermeté exprimée par steterunt et la vaillance de fortiter, dans un français naturel et digne.
- source_word: pro nomine domini
  choice: pour le nom du Seigneur
  rationale: Conserve la formulation théologique du latin sans l’expliciter par « défendre » ou « à cause de ».
- source_word: qualia et quanta mirabilia
  choice: quelles merveilles, et combien grandes
  rationale: Préserve le parallélisme de qualia et quanta appliqués à mirabilia ainsi que sa tournure exclamative/interrogative, malgré une légère solennité en français.
- source_word: adnuntia
  choice: annoncer
  rationale: Équivalent courant et direct de l’impératif latin.
theological_decisions:
- issue: Relation exprimée par pro dans pro nomine domini
  choice: pour le nom du Seigneur
  alternative: à cause du nom du Seigneur
  rationale: Le latin permet une nuance de défense, de fidélité ou de motif; « pour » maintient cette latitude sans imposer une interprétation.
- issue: Rapport de domini dei avec les merveilles vues
  choice: de la part du Seigneur Dieu
  alternative: les merveilles du Seigneur Dieu
  rationale: La formulation choisie évite que « que tu as vues » paraisse avoir « le Seigneur Dieu » pour antécédent, tout en conservant Dieu comme auteur/source des merveilles.
translation_notes:
  register: Français moderne international, soutenu mais accessible. « Quelles merveilles, et combien grandes » conserve volontairement la tension syntaxique et l’emphase du latin; une note signale une autre possibilité.
