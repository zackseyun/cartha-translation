  to: 'Ils sont restés fermes avec courage pour le nom du Seigneur. Alors l’ange me dit : « Va annoncer à mon peuple quelles merveilles du Seigneur Dieu tu as vues et combien elles sont grandes. »'
  rationale: La révision conserve la fermeté et le courage du premier membre. Elle rend qualia et quanta par deux interrogations coordonnées, « quelles merveilles » et « combien elles sont grandes », tout en gardant « du Seigneur Dieu » comme complément de « merveilles » et « que tu as vues » implicite dans la coordination. La note non indispensable est supprimée avec son ancre.
