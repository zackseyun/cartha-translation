    rationale: Le latin mirabilia domini dei uidisti signifie que les merveilles du Seigneur Dieu sont celles qu’Esdras a vues. « De la part du Seigneur Dieu » introduit une nuance de provenance et laisse une construction moins directe.
  - severity: low
    issue: La note présente une variante française également peu naturelle et n’est pas nécessaire à la compréhension d’une ambiguïté textuelle.
    rationale: Le parallélisme de qualia et quanta peut être rendu clairement dans le texte français révisé; aucun problème textuel disputé ne demande une note.
