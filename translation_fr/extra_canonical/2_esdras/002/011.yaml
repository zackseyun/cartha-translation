  source_fidelity: « Et je prendrai pour moi leur gloire, et je leur donnerai des demeures éternelles » rend fidèlement Et sumam mihi gloriam illorum et dabo eis tabernacula aeterna. « Pour moi » exprime bien mihi; « demeures éternelles » est un équivalent idiomatique approprié de tabernacula aeterna. La distinction potentielle entre illorum et eis n'est pas effacée sans avertissement, car elle est explicitement signalée en note. La virgule finale respecte la continuité syntaxique avec le verset suivant sans anticiper son contenu.
  naturalness: Le français est naturel, moderne et d'un registre sobrement scripturaire. « Demeures éternelles » évite l'association cultuelle ou matérielle trop étroite que « tabernacles » peut susciter en français contemporain, tout en conservant l'idée d'habitations durables.
  terminology: Le choix de « gloire » et « éternelles » est exact et stable. « Demeures » convient pour tabernacula dans ce contexte d'habitation eschatologique et ne force aucune interprétation doctrinale. La note décrit prudemment la valeur possible de illorum (« de ceux-là ») face à eis (« à eux »), sans imposer une identification des référents que ce verset isolé ne tranche pas.
