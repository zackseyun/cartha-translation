  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
translation:
  language: fr
  text: Et je prendrai pour moi leur gloire[a], et je leur donnerai des demeures éternelles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin emploie ici illorum (« de ceux-là »), puis eis (« à eux »); ces pronoms peuvent renvoyer à deux groupes différents. On pourrait donc traduire : « la gloire de ceux-là, et je donnerai à ceux-ci des demeures éternelles » ou « la gloire des premiers, et je donnerai aux autres des demeures éternelles ».'
    reason: Préserver la possible distinction entre les référents des deux pronoms latins.
lexical_decisions:
- source_word: sumam mihi
  choice: je prendrai pour moi
  rationale: Rend explicitement le datif d’intérêt « mihi » et conserve la structure solennelle de la phrase.
- source_word: gloriam illorum
  choice: leur gloire
  rationale: Traduction française naturelle de l’expression; la nuance démonstrative possible de « illorum » est signalée en note sans alourdir le texte.
- source_word: tabernacula aeterna
  choice: des demeures éternelles
  rationale: « Demeures » exprime ici des lieux d’habitation durables dans un français actuel et digne; « tabernacles » serait plus littéral, mais risquerait d’évoquer un objet cultuel plutôt que des habitations.
theological_decisions:
- issue: Rapport entre « illorum » et « eis »
  choice: Conserver dans le texte courant les pronoms français « leur » et « leur », avec une note sur la distinction latine possible
  alternative: « la gloire de ceux-là, et je donnerai à ceux-ci »
  rationale: Le latin emploie deux formes pronominales différentes, mais ce seul verset ne permet pas d’imposer avec certitude deux groupes distincts. La note préserve la tension sans produire une opposition artificiellement explicite.
translation_notes:
  register: Français international moderne, sobre et solennel. La coordination répétée reflète le rythme du latin. La virgule finale est conservée parce que la phrase se poursuit au verset suivant; la proposition placée au début du verset 12 dans l’édition source n’est pas anticipée ici.
