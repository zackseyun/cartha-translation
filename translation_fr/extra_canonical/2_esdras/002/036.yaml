  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/036.yaml
  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
translation:
  language: fr
  text: Fuyez l’ombre du temps présent ; recevez la joie de votre gloire. Je prends ouvertement mon Sauveur à témoin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Fugite umbram saeculi huius
  choice: Fuyez l’ombre du temps présent
  rationale: « Saeculum hoc » désigne ici l’époque ou l’ordre présent ; « temps présent » est naturel en français moderne tout en conservant le contraste eschatologique.
- source_word: accipite iucunditatem gloriae uestrae
  choice: recevez la joie de votre gloire
  rationale: « Recevez » rend directement l’impératif « accipite », et « joie » exprime simplement « iucunditas » sans préciser davantage le rapport, potentiellement ambigu, entre la joie et la gloire.
- source_word: ego testor palam saluatorem meum
  choice: Je prends ouvertement mon Sauveur à témoin
  rationale: Avec l’accusatif personnel « saluatorem meum », « testor » signifie idiomatiquement appeler quelqu’un à témoigner. La tournure française « prendre à témoin » préserve cette invocation solennelle, plutôt que de faire du Sauveur l’objet d’un témoignage.
theological_decisions:
- issue: Fonction du Sauveur dans « testor … saluatorem meum »
  choice: Le Sauveur est invoqué comme témoin
  alternative: Je témoigne ouvertement au sujet de mon Sauveur
  rationale: La construction latine avec un accusatif personnel soutient le sens « prendre quelqu’un à témoin » ; l’alternative modifierait le rôle syntaxique et théologique du Sauveur.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs sont conservés, ainsi que l’image de l’ombre et l’expression ouverte de l’appel au Sauveur comme témoin.
