  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
translation:
  language: fr
  text: Souviens-toi de ce que j’ai fait à Sodome et à Gomorrhe, dont le pays est couvert de mottes de bitume et de monceaux de cendres. C’est ainsi que je traiterai ceux qui ne m’ont pas écouté[a], dit le Seigneur tout-puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « C’est ainsi que je donnerai ceux qui ne m’ont pas écouté » ; le latin tardif peut ici avoir le sens de « c’est ainsi que j’agirai envers ceux » ou « que je traiterai ceux ».'
    reason: Le tour latin sic dabo eos est inhabituel et peut être compris idiomatiquement dans le contexte ; la note conserve la forme littérale tout en signalant l’interprétation contextuelle, avec une formulation française complète.
lexical_decisions:
- source_word: memorare
  choice: Souviens-toi
  rationale: Impératif latin rendu directement et naturellement en français moderne.
- source_word: terra iacet in picis glebis et aggeribus cinerum
  choice: le pays est couvert de mottes de bitume et de monceaux de cendres
  rationale: « Pays » convient ici au territoire de Sodome et Gomorrhe; « est couvert » exprime idiomatiquement l’état de désolation décrit par iacet in, tout en conservant les images concrètes.
- source_word: sic dabo eos
  choice: C’est ainsi que je traiterai ceux
  rationale: Dans ce latin tardif et dans le parallélisme avec « ce que j’ai fait », dabo peut avoir le sens de « faire à, traiter ». Cette formulation française évite l’inintelligible littéral « je donnerai ceux » sans imposer le sens plus précis d’un abandon.
- source_word: non audierunt
  choice: ne m’ont pas écouté
  rationale: Le contexte implique non seulement l’audition, mais le refus de prêter attention ou d’obéir; « écouter » préserve cette portée naturelle.
- source_word: dominus omnipotens
  choice: le Seigneur tout-puissant
  rationale: Équivalent français usuel, digne et transparent du titre latin.
theological_decisions:
- issue: Nature du jugement annoncé dans « sic dabo eos »
  choice: « C’est ainsi que je traiterai ceux »
  alternative: « C’est ainsi que je ferai à ceux » / « C’est ainsi que je livrerai ceux »
  rationale: Le contexte rapproche le sort des désobéissants de celui de Sodome et Gomorrhe, mais le verbe latin demeure inhabituel. « Traiterai » transmet l’action punitive sans préciser abusivement qu’il s’agit d’un abandon à une puissance tierce.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Les images matérielles de la dévastation sont maintenues; la syntaxe est légèrement idiomatisée pour assurer clarté et naturel.
