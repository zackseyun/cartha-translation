  yaml_path: translation/extra_canonical/2_esdras/002/037.yaml
  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: fr
  text: Recevez du Seigneur la joie de votre gloire et réjouissez-vous, en rendant grâce à celui qui vous a appelés aux royaumes célestes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domini … accipite
  choice: Recevez du Seigneur
  rationale: Rend l’impératif pluriel « accipite » et le génitif de provenance « domini » dans un français naturel; le complément reçu est conservé d’après la leçon attestée par la couche de consultation auditée, puisque l’extrait latin fourni est lacunaire à cet endroit.
- source_word: iocundamini
  choice: réjouissez-vous
  rationale: Équivalent direct et idiomatique de l’impératif pluriel latin.
- source_word: gratias agentes
  choice: en rendant grâce
  rationale: Expression française courante qui conserve la valeur circonstancielle du participe latin.
- source_word: ei qui uos …
  choice: à celui qui vous a appelés
  rationale: « ei qui » devient naturellement « à celui qui »; le verbe « a appelés », présent dans la tradition textuelle consultée mais coupé dans l’extrait fourni, préserve le sens transmis sans l’amplifier.
- source_word: ad [caelestia regna]
  choice: aux royaumes célestes
  rationale: Conserve le pluriel de la tradition latine reflétée par le texte de consultation plutôt que de l’harmoniser avec le singulier de certaines versions anciennes.
theological_decisions:
- issue: Nature de ce qui est reçu du Seigneur
  choice: la joie de votre gloire
  alternative: le don qui vous est confié
  rationale: La formulation retenue suit la lecture révisée de la couche de consultation auditée. Elle maintient le lien entre joie et gloire sans introduire l’idée distincte d’un dépôt confié, laquelle n’est pas visible dans l’extrait latin fourni.
- issue: Destination de l’appel
  choice: aux royaumes célestes
  alternative: au royaume céleste
  rationale: Le pluriel est conservé conformément à la forme latine transmise par la tradition éditoriale consultée, sans normalisation théologique au singulier.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et les impératifs pluriels restent proches de la structure latine, tandis que « en rendant grâce » assure une lecture naturelle. L’extrait latin fourni étant tronqué au début et à la fin, les éléments manquants sont restitués avec prudence à partir de la couche anglaise auditée et des données de révision.
