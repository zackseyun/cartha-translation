source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/032.yaml
  text: Embrace your children until I come[a], and proclaim mercy to them, because my springs overflow and my grace will not fail.
translation:
  language: fr
  text: Serre tes enfants dans tes bras jusqu’à ce que je vienne, et annonce-leur la miséricorde, car mes sources débordent et ma grâce ne fera pas défaut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '[amplectere] tuos'
  choice: Serre tes enfants dans tes bras
  rationale: Le début transmis ici est tronqué (« tuos »), mais le contexte textuel consulté atteste l’idée d’embrasser ou d’étreindre les siens. « Tes enfants » explicite le référent contextuel, et cette formulation naturelle conserve l’image concrète.
- source_word: praedica illis misericordiam
  choice: annonce-leur la miséricorde
  rationale: « Praedicare » signifie proclamer ou annoncer publiquement; « la miséricorde » conserve le substantif théologique du latin sans le réduire à une simple attitude de bonté.
- source_word: fontes mei
  choice: mes sources
  rationale: « Sources » garde l’image de fontaines ou de sources jaillissantes et s’accorde naturellement avec « débordent ».
- source_word: gratia mea non deficiet
  choice: ma grâce ne fera pas défaut
  rationale: Le futur « deficiet » exige une promesse orientée vers l’avenir. « Ne fera pas défaut » rend l’idée de ne pas manquer, s’épuiser ou défaillir.
theological_decisions:
- issue: Valeur temporelle de « deficiet »
  choice: ma grâce ne fera pas défaut
  alternative: ma grâce ne fait pas défaut
  rationale: « Deficiet » est un futur de l’indicatif; la traduction préserve donc le passage du présent « mes sources débordent » à la promesse future concernant la grâce.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement conserve l’adresse individuelle du latin. La phrase « Ego Ezra… » est tenue pour le début du verset suivant et n’est donc pas incluse dans 2 Esdras 2.32.
