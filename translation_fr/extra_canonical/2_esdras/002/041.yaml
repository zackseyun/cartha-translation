id: 2ES.2.41
reference: 2 Esdras 2:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
translation:
  language: fr
  text: Le nombre de tes enfants, que tu désirais, est complet. Implore l’autorité du Seigneur, afin que ton peuple, appelé dès le commencement, soit sanctifié.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plenus est numerus
  choice: le nombre … est au complet
  rationale: Rend littéralement l’idée d’un nombre désormais plein ou complet, dans un français naturel.
- source_word: optabas
  choice: tu désirais
  rationale: Conserve le sens direct de souhait ou de désir sans ajouter l’idée plus forte d’une longue attente.
- source_word: roga imperium domini
  choice: fais appel à l’autorité du Seigneur
  rationale: Évite l’expression peu idiomatique « demande l’autorité » tout en conservant imperium comme autorité ou pouvoir souverain.
- source_word: sanctificetur
  choice: soit sanctifié
  rationale: Maintient le passif latin et le vocabulaire théologique transparent de la sanctification.
- source_word: uocatus est ab initio
  choice: appelé dès le commencement
  rationale: Respecte le singulier accordé à « peuple » et préserve la portée temporelle potentiellement théologique de ab initio.
theological_decisions:
- issue: Sens de imperium domini
  choice: l’autorité du Seigneur
  alternative: la puissance du Seigneur / la souveraineté du Seigneur
  rationale: « Autorité » exprime le droit et le pouvoir de gouverner sans imposer une lecture confessionnelle particulière.
- issue: Portée de « dès le commencement »
  choice: rattachement à « appelé »
  alternative: rattachement plus lâche à l’ensemble de la proposition
  rationale: Le relatif latin qui uocatus est ab initio se rapporte grammaticalement à populus tuus; la traduction conserve ce lien sans préciser de quel commencement il s’agit.
translation_notes:
  register: Français moderne, digne et accessible; tutoiement conservé conformément à l’adresse singulière du latin. Le fragment initial « domini compleuerunt. », syntaxiquement incomplet et manifestement rattaché au contexte précédent dans la segmentation fournie, n’est pas intégré au verset.
