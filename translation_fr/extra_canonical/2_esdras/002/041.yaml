  source_fidelity: 'Le sens général est fidèlement rendu : le nombre est désormais complet, le peuple est dit appelé dès le commencement et l’objectif est sa sanctification. Toutefois, « Fais appel à » ne rend pas précisément l’impératif roga (« demande / implore ») : il transforme une demande en recours ou invocation.'
