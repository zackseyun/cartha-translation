translation:
  language: fr
  text: Nahum et Habacuc, Sophonie, Aggée, Zacharie et Malachie[a], qui est aussi appelé l’ange du Seigneur.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin dit «l’ange du Seigneur». Cette appellation peut faire écho au sens du nom «Malachie», lié à l’idée de messager, mais le texte emploie ici le mot latin habituellement traduit par «ange».
    reason: Précision lexicale et préservation de l’ambiguïté traditionnelle.
lexical_decisions:
- source_word: angelus domini
  choice: l’ange du Seigneur
  rationale: Dans ce texte latin, «angelus» désigne naturellement un ange; cette traduction conserve aussi la tradition particulière associée ici à Malachie, sans la réduire à l’étymologie de son nom.
- source_word: qui
  choice: qui
  rationale: Le relatif latin masculin singulier renvoie naturellement au dernier nom, Malachie.
- source_word: uocatus est
  choice: est aussi appelé
  rationale: Rend le parfait passif latin avec une formulation française naturelle, le présent convenant à une appellation reçue.
theological_decisions:
- issue: Identification de Malachie comme ange du Seigneur
  choice: Traduire directement «qui est aussi appelé l’ange du Seigneur»
  alternative: «qui est aussi appelé le messager du Seigneur»
  rationale: Le latin porte «angelus domini» et non «nuntius domini». Le texte affirme une appellation de Malachie; la traduction ne doit ni l’atténuer ni décider au-delà du texte quelle relation elle entretient avec d’autres figures bibliques appelées «l’ange du Seigneur».
translation_notes:
  register: Français moderne, clair et digne. Les formes françaises usuelles des noms prophétiques sont retenues. La série nominale et le relatif singulier du latin sont conservés; le guillemet fermant reflète la fin d’un discours commencé dans le contexte précédent.
