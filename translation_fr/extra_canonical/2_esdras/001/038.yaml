- source_word: quibus dabo
  choice: auxquels je donnerai
  rationale: Conserve le relatif au datif et le futur du verbe dare sans expliciter un antécédent absent de ce fragment.
- source_word: ducattum
  choice: pour guides
  rationale: Le terme, graphie non classique de ducatum, exprime ici une fonction de conduite attribuée à Abraham, Isaac et Jacob; « pour guides » restitue naturellement cette valeur prédicative.
- source_word: Abraham, Isaac et Iacob et
  choice: Abraham, Isaac et Jacob, et
  rationale: Emploie les formes françaises usuelles des noms et conserve le dernier « et », qui rattache ce fragment à la suite de l’énumération.
