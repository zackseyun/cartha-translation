  text: creationem non facient, quoniam mandatum meum uobiscum neglexerunt et quod malum est coram me fecerunt. Tradam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/034.yaml
  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: fr
  text: Et vos fils n’auront pas de descendance, parce qu’ils ont négligé mon commandement parmi vous et ont fait ce qui est mal devant moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  choice: n’auront pas de descendance
  rationale: Cette expression latine désigne ici l’absence de procréation; une traduction littérale comme « ne feront pas de création » serait obscure et non naturelle en français.
- source_word: mandatum meum
  choice: mon commandement
  rationale: Rend directement le singulier latin sans en préciser davantage le contenu.
- source_word: uobiscum
  choice: parmi vous
  rationale: Dans ce contexte collectif, « parmi vous » exprime naturellement la présence ou la portée du commandement au sein du peuple, tout en évitant le peu naturel « avec vous ».
- source_word: quod malum est coram me fecerunt
  choice: ont fait ce qui est mal devant moi
  rationale: Conserve l’idiome judiciaire et relationnel « devant moi » ainsi que la formulation générale du mal.
theological_decisions:
- issue: Nature de la conséquence annoncée
  choice: n’auront pas de descendance
  alternative: n’engendreront pas
  rationale: Le texte annonce une absence de postérité sans préciser explicitement le mécanisme; la formulation retenue préserve cette réserve et reste naturelle.
translation_notes:
  register: Français moderne, clair et digne. La coordination et la causalité du latin sont conservées. Le mot final « Tradam », qui ouvre la phrase suivante dans la source fragmentaire, n’est pas intégré à ce verset.
