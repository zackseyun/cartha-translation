  yaml_path: translation/extra_canonical/2_esdras/001/020.yaml
  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
translation:
  language: fr
  text: Comme nourriture, vous avez mangé le pain des anges. Quand vous aviez soif, n’ai-je pas fendu le rocher, et les eaux n’ont-elles pas coulé en abondance ? À cause de la chaleur…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni s’interrompt après « À cause de la chaleur ». La suite reproduite dans la couche anglaise — « je vous ai couverts avec les feuilles des arbres » — n’est donc pas intégrée ici sans attestation dans la source latine transmise.
    reason: source_incomplete
lexical_decisions:
- source_word: in escam
  choice: Comme nourriture
  rationale: Rend la fonction alimentaire exprimée par l’accusatif avec « in », tout en évitant le tour lourd « pour nourriture ».
- source_word: panem angelorum
  choice: le pain des anges
  rationale: Correspondance directe et naturelle avec le génitif latin « angelorum ».
- source_word: petram excidi
  choice: fendu le rocher
  rationale: « Excidi » exprime ici l’action d’entailler ou d’ouvrir la roche; « fendre » convient au contexte de l’eau jaillissant du rocher.
- source_word: in satietate
  choice: à satiété
  rationale: Conserve l’idée d’une eau fournie jusqu’à rassasier pleinement, plutôt que de réduire l’expression à une simple abondance.
- source_word: propter aestus
  choice: À cause de la chaleur
  rationale: Rend littéralement la locution causale; le pluriel latin peut désigner les fortes chaleurs ou la chaleur accablante.
theological_decisions:
- issue: Coordination de la question introduite par « Nonne »
  choice: n’ai-je pas fendu le rocher, et les eaux n’ont-elles pas coulé
  alternative: n’ai-je pas fendu le rocher, si bien que les eaux ont coulé
  rationale: La reprise interrogative en français conserve la coordination « et » ainsi que la portée rhétorique de « Nonne », sans imposer à la seconde proposition une valeur consécutive que le latin laisse seulement possible.
- issue: Désignation du pain céleste
  choice: le pain des anges
  alternative: le pain angélique
  rationale: Le génitif latin désigne explicitement les anges; la formulation retenue préserve cette expression traditionnelle sans l’interpréter davantage.
translation_notes:
  register: Français moderne, digne et accessible. La première personne divine et l’adresse au pluriel sont conservées. Les points de suspension signalent matériellement l’interruption de la source, explicitée par la note.
