source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur tout-puissant : Ne vous ai-je pas suppliés[a], comme un père supplie ses fils, comme une mère supplie ses filles et comme une nourrice supplie ses tout-petits,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous ai-je pas priés, comme un père prie ses fils ? »'
    reason: Le latin rogo peut aussi se rendre par « prier » ou « demander »; « supplier » est retenu dans le texte pour sa nuance pressante.
lexical_decisions:
- source_word: rogaui
  choice: ai-je… suppliés
  rationale: Le parfait de « rogo » exprime ici une demande pressante. « Supplier » conserve la force affective de l’appel divin, plus nettement que le simple « demander ».
- source_word: nutrix
  choice: nourrice
  rationale: Équivalent direct et naturel du latin, désignant celle qui nourrit et prend soin de jeunes enfants.
- source_word: paruulos suos
  choice: ses tout-petits
  rationale: « Tout-petits » rend avec naturel la petitesse et la tendresse suggérées par « parvulos », tandis que « ses » conserve le possessif.
theological_decisions:
- issue: Images parentales et maternelles appliquées à l’action du Seigneur
  choice: 'Conserver sans atténuation les trois comparaisons : père, mère et nourrice'
  alternative: Harmoniser les images sous une formule générale telle que « comme un parent ses enfants »
  rationale: Le texte latin juxtapose volontairement ces images et leur tension expressive doit être préservée.
translation_notes:
  register: Français moderne, international et digne. La tournure elliptique « comme un père ses fils » suit la concision du latin tout en restant intelligible; la virgule finale est conservée puisque le verset se poursuit syntaxiquement.
