  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
translation:
  language: fr
  text: 'Mais vous, vous m’avez oublié, dit le Seigneur. Ainsi parle le Seigneur tout-puissant : les cailles ont été pour vous un signe ; un campement pour vous[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin dit littéralement : « des camps / un campement pour vous ». La construction est elliptique dans ce verset et se poursuit au verset suivant.'
    reason: « Castra » est un pluriel lexical latin qui peut désigner un campement au singulier ; l’absence de verbe dans le segment transmis ne doit pas être comblée par une interprétation.
lexical_decisions:
- source_word: uobis. uos autem mei obliti estis
  choice: Mais vous, vous m’avez oublié
  rationale: « autem » marque ici un contraste ; la reprise de « vous » le rend naturellement en français. « mei obliti estis » signifie directement « vous m’avez oublié ».
- source_word: dominus omnipotens
  choice: le Seigneur tout-puissant
  rationale: Rend le titre latin de manière traditionnelle, claire et actuelle.
- source_word: coturnix uobis in signo fuit
  choice: les cailles ont été pour vous un signe
  rationale: Le singulier collectif latin « coturnix » renvoie aux cailles données au peuple dans le désert ; le pluriel français est idiomatique tout en maintenant la fonction de signe.
- source_word: castra uobis
  choice: vous avez eu un camp
  rationale: « castra » est un pluriel lexical latin qui peut désigner un seul camp ou campement. La tournure elliptique « uobis » est rendue sans ajouter l’idée non exprimée de protection.
theological_decisions:
- issue: Fonction des cailles
  choice: un signe
  alternative: un prodige / un présage
  rationale: Le latin « in signo » affirme leur fonction de signe sans préciser davantage sa valeur théologique ; la traduction conserve cette ouverture.
- issue: Sens du camp
  choice: vous avez eu un camp
  alternative: un camp a été pour vous / des camps ont été pour vous
  rationale: Le contexte et l’emploi de « castra » favorisent le campement d’Israël au singulier, mais la proposition latine est elliptique et le segment se poursuit au verset suivant ; la note signale cette difficulté.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant le contraste, la répétition solennelle de « dit/parle le Seigneur » et l’inachèvement contextuel de la dernière proposition.
