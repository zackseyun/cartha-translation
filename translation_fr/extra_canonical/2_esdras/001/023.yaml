  source_fidelity: Le contraste « non … sed » et l’action de jeter du bois dans l’eau sont bien représentés. Toutefois, « en réponse à » et « au contraire » explicitent et renforcent légèrement le rapport, tandis que « l’eau du fleuve » substitue un référent explicatif à flumen (« cours d’eau, fleuve »).
  naturalness: Le texte est globalement clair, mais « rendu douce l’eau du fleuve » est moins idiomatique que « adouci le cours d’eau ». La construction participiale peut être rendue naturellement par « en jetant ».
  terminology: « Blasphèmes » convient. « Le feu » conserve l’expression sobre et potentiellement allusive du latin sans définir la nature du châtiment. « Cours d’eau » rend flumen sans imposer « fleuve », qui peut être trop spécifique.
