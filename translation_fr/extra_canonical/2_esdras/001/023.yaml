- from: Je ne vous ai pas donné le feu en réponse à vos blasphèmes ; au contraire, j’ai jeté du bois dans l’eau et rendu douce l’eau du fleuve.
  to: Je ne vous ai pas donné le feu pour vos blasphèmes, mais, en jetant du bois dans l’eau, j’ai adouci le cours d’eau.
  rationale: 'La révision conserve le lexique et la syntaxe argumentative du latin: « pour vos blasphèmes » rend pro blasphemiis sans préciser le type de relation, « mais » rend sed sans surenchère, et « en jetant » restitue la valeur circonstancielle de mittens. « J’ai adouci le cours d’eau » est idiomatique en français moderne tout en rendant dulce feci flumen sans remplacer le cours d’eau par son eau.'
