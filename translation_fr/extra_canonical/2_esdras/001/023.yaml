source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non ignem uobis pro blasphemiis dedi, sed mittens lignum in aqua dulce feci flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/023.yaml
  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: fr
  text: Je ne vous ai pas donné le feu pour vos blasphèmes, mais, en jetant du bois dans l’eau, j’ai adouci le cours d’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pro blasphemiis
  choice: en réponse à vos blasphèmes
  rationale: La préposition « pro » exprime ici vraisemblablement la contrepartie ou la rétribution ; « en réponse à » conserve ce rapport sans préciser excessivement s’il s’agit d’une punition.
- source_word: mittens lignum
  choice: j’ai jeté du bois
  rationale: Le participe latin décrit le moyen ou la circonstance de l’action principale. Une coordination naturelle en français restitue clairement que Dieu a mis le bois dans l’eau.
- source_word: dulce feci flumen
  choice: rendu douce l’eau du fleuve
  rationale: Le latin dit littéralement « j’ai rendu le fleuve doux ». En français, « l’eau du fleuve » clarifie que c’est son eau qui devient douce, c’est-à-dire non amère, sans introduire explicitement cette interprétation dans le corps du texte.
theological_decisions:
- issue: Contraste entre la rétribution méritée et le bienfait accordé
  choice: « en réponse à vos blasphèmes ; au contraire »
  alternative: « à cause de vos blasphèmes, mais »
  rationale: 'La formulation retenue fait ressortir le contraste du latin « non… sed » : au lieu de répondre aux blasphèmes par le feu, Dieu a rendu l’eau douce. Elle évite toutefois de développer au-delà du texte la nature exacte du feu.'
translation_notes:
  register: Français moderne, clair et digne. Le passé composé convient au récit adressé directement au peuple. « Blasphèmes » et « rendu douce » préservent le vocabulaire et l’image du latin tout en restant compréhensibles.
