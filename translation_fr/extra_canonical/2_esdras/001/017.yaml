source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: fr
  text: Jusqu’à présent, vous n’avez cessé de murmurer. Où sont les bienfaits que je vous ai accordés ? N’avez-vous pas crié dans le désert lorsque vous aviez faim et soif,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc usque
  choice: Jusqu’à maintenant
  rationale: Rend directement la portée temporelle de l’expression latine dans un français naturel.
- source_word: murmuratis
  choice: vous n’avez cessé de murmurer
  rationale: Le présent latin, associé à « nunc usque », exprime une conduite persistante jusqu’au moment présent ; cette formulation conserve aussi le motif biblique du murmure.
- source_word: beneficia
  choice: les bienfaits
  rationale: « Bienfaits » exprime des actes favorables ou des faveurs reçues, sans réduire le terme à de simples avantages matériels.
- source_word: praestiti
  choice: je vous ai accordés
  rationale: « Accorder » rend ici l’idée de procurer ou conférer des bienfaits et reste idiomatique en français moderne.
- source_word: proclamastis
  choice: avez-vous crié
  rationale: Le verbe désigne le fait de pousser un appel ou un cri ; l’absence de complément dans le latin est respectée.
theological_decisions:
- issue: Destinataire implicite du cri dans le désert
  choice: Ne pas ajouter « vers moi » ou « à moi »
  alternative: « N’avez-vous pas crié vers moi dans le désert… »
  rationale: Bien que le locuteur divin puisse être compris comme le destinataire, le latin ne l’explicite pas ; conserver cette absence évite de résoudre implicitement le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement collectif implicite du latin est rendu par « vous ». La virgule finale est conservée parce que la phrase se poursuit au verset suivant.
