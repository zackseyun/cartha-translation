source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non quasi me dereliquistis, sed uos ipsos, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/027.yaml
  text: It is not as though you have forsaken me[a], but yourselves, says the Lord.
translation:
  language: fr
  text: 'Ce n’est pas comme si vous m’aviez abandonné : c’est vous-mêmes que vous avez abandonnés, dit le Seigneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis
  choice: avez abandonnés / m’aviez abandonné
  rationale: Le parfait latin exprime un abandon accompli. En français, la tournure « comme si » appelle normalement l’imparfait ou le plus-que-parfait ; « m’aviez abandonné » relève donc de la syntaxe française, tandis que la proposition explicitée reprend l’idée au passé composé.
- source_word: uos ipsos
  choice: vous-mêmes
  rationale: Le pronom renforcé met l’accent sur ceux qui subissent en réalité les conséquences de leur abandon.
- source_word: dominus
  choice: le Seigneur
  rationale: Équivalent biblique français courant et digne de « dominus ».
theological_decisions:
- issue: Paradoxe entre abandonner Dieu et s’abandonner soi-même
  choice: Maintenir les deux volets sans expliquer leurs implications
  alternative: 'Paraphraser : « en me rejetant, vous vous êtes perdus vous-mêmes »'
  rationale: Le latin formule une opposition théologiquement tendue et elliptique ; la traduction la conserve sans préciser en quoi les destinataires se sont abandonnés eux-mêmes.
translation_notes:
  register: Français moderne, clair et solennel. La seconde proposition explicite le verbe sous-entendu après « sed uos ipsos », conformément à l’usage naturel du français, tout en préservant le contraste rhétorique.
