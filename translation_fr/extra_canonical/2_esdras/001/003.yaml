source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Filii Aaron ex tribu Leui, qui fuit captiuus in regione Medorum, in regno Artaxersis regis Persarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/003.yaml
  text: sons of Aaron[a], of the tribe of Levi, who were captives in the region of the Medes, in the reign of Artaxerxes king of the Persians.
translation:
  language: fr
  text: fils d’Aaron, de la tribu de Lévi, qui furent captifs[a] dans la région des Mèdes, sous le règne d’Artaxerxès, roi des Perses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin porte ici le singulier : « qui fut captif », malgré le pluriel « fils d’Aaron ».'
    reason: La note préserve la discordance de nombre présente dans la source latine au lieu de la résoudre silencieusement.
lexical_decisions:
- source_word: Filii Aaron
  choice: fils d’Aaron
  rationale: « Filii » est compris comme un nominatif pluriel, conformément au sens retenu après révision; « Aaron » est un génitif de relation.
- source_word: ex tribu Leui
  choice: de la tribu de Lévi
  rationale: Formulation française naturelle qui rend directement l’appartenance exprimée par « ex ».
- source_word: captiuus
  choice: captifs
  rationale: Le terme désigne ici l’état de personnes retenues en captivité, non l’action ponctuelle d’avoir été capturées.
- source_word: in regione Medorum
  choice: dans la région des Mèdes
  rationale: Rend littéralement le lieu et conserve l’ethnonyme traditionnel et intelligible.
- source_word: in regno Artaxersis regis Persarum
  choice: sous le règne d’Artaxerxès, roi des Perses
  rationale: « Sous le règne de » est l’équivalent idiomatique de « in regno » dans ce contexte chronologique; le titre royal reste en apposition.
theological_decisions:
- issue: Discordance de nombre entre « Filii » et « qui fuit captiuus »
  choice: Accord au pluriel dans le texte principal, avec signalement en note de la forme singulière du latin
  alternative: Traduire littéralement « fils d’Aaron… qui fut captif », malgré la discordance grammaticale en français
  rationale: Le pluriel fournit une lecture française compréhensible sans masquer la difficulté réelle du texte source, laquelle est explicitement conservée dans la note.
translation_notes:
  register: Français moderne, sobre et digne. Le fragment commence par une minuscule puisqu’il prolonge vraisemblablement la construction généalogique du contexte. « Captifs » exprime un état de captivité plutôt que l’événement de la capture.
