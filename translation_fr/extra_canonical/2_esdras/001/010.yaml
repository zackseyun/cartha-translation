lexical_decisions:
- source_word: propter eos
  choice: À cause d’eux
  rationale: Rend directement la relation causale exprimée par le latin, sans préciser davantage si elle signifie « pour eux » ou « en leur faveur ».
- source_word: subuerti
  choice: j’ai renversé
  rationale: Conserve l’image politique et militaire de la chute des rois.
- source_word: pueris suis
  choice: ses serviteurs
  rationale: Dans ce contexte de cour royale et d’armée, « pueri » désigne vraisemblablement les serviteurs ou hommes au service de Pharaon, plutôt que ses enfants.
- source_word: percussi
  choice: j’ai frappé
  rationale: Traduction formelle qui préserve la force du verbe latin sans ajouter explicitement l’idée de mise à mort.
theological_decisions:
- issue: Motif de l’intervention divine
  choice: À cause d’eux
  alternative: Pour eux
  rationale: Le latin « propter eos » peut exprimer la cause ou l’intérêt. La formulation retenue conserve une certaine ouverture tout en restant proche de la syntaxe source.
