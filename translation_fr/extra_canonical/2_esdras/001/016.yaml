  text: ad tutelam dedi, et illic murmurastis, Et non triumphastis in nomine meo de perditione inimicorum uestrorum, sed adhuc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
translation:
  language: fr
  text: J’ai donné pour votre protection[a], et là, vous avez murmuré. Vous ne vous êtes pas réjouis, en mon nom, de la destruction de vos ennemis, mais toujours…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin ne précise pas ce qui a été donné pour assurer cette protection.
    reason: Signaler l’ellipse réelle de l’expression ad tutelam dedi sans la combler dans le corps du texte.
  - marker: b
    text: La phrase se poursuit au verset suivant ; le fragment latin de ce verset s’arrête sur « mais toujours ».
    reason: Expliquer la suspension syntaxique et la valeur temporelle de adhuc, sans suppléer un verbe.
lexical_decisions:
- source_word: ad tutelam dedi
  choice: J’ai donné pour votre protection
  rationale: La formulation conserve le verbe « donner » et la finalité exprimée par ad tutelam, sans inventer dans ce fragment le complément d’objet qui n’est pas énoncé.
- source_word: illic murmurastis
  choice: là, vous avez murmuré
  rationale: « Murmurer » rend directement murmurare dans son sens de se plaindre ou récriminer; « là » correspond à illic.
- source_word: triumphastis
  choice: vous vous êtes réjouis
  rationale: Avec de perditione, le verbe signifie ici célébrer ou se réjouir au sujet d’un événement, et non remporter une victoire sur celui-ci.
- source_word: perditione inimicorum uestrorum
  choice: de la destruction de vos ennemis
  rationale: « Destruction » exprime le sens fort de perditio et maintient le rapport syntaxique avec la réjouissance.
- source_word: sed adhuc
  choice: mais encore…
  rationale: Le témoin fourni s’interrompt sur cette transition inachevée; la traduction en préserve le caractère suspensif sans suppléer un verbe.
theological_decisions:
- issue: Nature de la réjouissance « en mon nom »
  choice: vous ne vous êtes pas réjouis en mon nom de la destruction de vos ennemis
  alternative: vous n’avez pas triomphé en mon nom de la destruction de vos ennemis
  rationale: « Se réjouir » évite de faire dire que les destinataires ont vaincu la destruction elle-même, tout en conservant la tension du texte, qui leur reproche de ne pas avoir célébré en son nom la ruine de leurs ennemis.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe légèrement elliptique de l’ouverture et la fin suspendue sont maintenues parce qu’elles appartiennent au fragment latin fourni; les notes préviennent qu’il ne s’agit pas d’omissions accidentelles dans la traduction.
