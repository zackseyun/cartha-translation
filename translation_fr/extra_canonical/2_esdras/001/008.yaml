id: 2ES.1.8
reference: 2 Esdras 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
translation:
  language: fr
  text: Mais toi, secoue les cheveux de ta tête et jette sur eux tous les maux, car ils n’ont pas obéi à ma loi ; mais c’est un peuple indiscipliné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « réfractaire à l’instruction ».'
    reason: Indisciplinatus peut désigner un manque de discipline ou un refus de se laisser instruire ; la variante explicite cette nuance sans réduire le terme au seul sens de « rebelle ».
lexical_decisions:
- source_word: excute comam capitis tui
  choice: secoue les cheveux de ta tête
  rationale: Cette formulation conserve l’image concrète et inhabituelle du latin, sans remplacer le geste par « arracher », sens que le verbe excutere n’impose pas.
- source_word: proice omnia mala super illos
  choice: jette sur eux tous les maux
  rationale: Rendu direct de proice… super illos, qui préserve la force du geste prophétique et la portée générale de omnia mala.
- source_word: non obaudierunt legi meae
  choice: ils n’ont pas obéi à ma loi
  rationale: Obaudire avec le datif exprime ici l’obéissance ; « loi » correspond naturellement à lex dans ce contexte.
- source_word: populus… indisciplinatus
  choice: un peuple indiscipliné
  rationale: Indisciplinatus désigne d’abord ce qui manque de disciplina, donc un peuple indiscipliné ou réfractaire à l’instruction ; « rebelle » serait plus interprétatif et moins précis.
theological_decisions:
- issue: Nature des « maux » jetés sur le peuple
  choice: Conserver « tous les maux » sans les identifier davantage
  alternative: Préciser qu’il s’agit de malheurs, de fléaux ou de châtiments
  rationale: Le latin omnia mala demeure général et peut évoquer des malheurs ou des châtiments sans trancher explicitement ; la traduction garde cette latitude.
- issue: Caractérisation du peuple par indisciplinatus
  choice: « indiscipliné »
  alternative: « rebelle »
  rationale: Le choix retenu maintient le lien lexical avec la discipline et l’instruction, tout en laissant le contexte d’inobéissance exprimer la dimension de révolte.
translation_notes:
  register: Français moderne, digne et direct. La syntaxe garde la répétition contrastive de autem par deux emplois de « mais ». L’expression volontairement concrète « les cheveux de ta tête » suit de près le latin, malgré son caractère inhabituel en français.
