source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: fr
  text: « Va annoncer à mon peuple ses mauvaises actions, et à ses enfants les iniquités qu’ils ont commises contre moi, afin qu’ils les annoncent aux enfants de leurs enfants. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vade et nuntia
  choice: Va annoncer
  rationale: Rend directement l’impératif suivi du verbe de proclamation, dans un français naturel et digne.
- source_word: facinora ipsorum
  choice: ses mauvaises actions
  rationale: « Facinora » désigne ici des actes mauvais ou criminels; « mauvaises actions » reste clair sans amplifier le degré précis de culpabilité.
- source_word: iniquitates
  choice: les injustices
  rationale: Conserve la dimension morale de l’iniquité tout en employant un terme courant.
- source_word: quas in me admiserunt
  choice: qu’ils ont commises contre moi
  rationale: Le latin « in me » marque l’orientation hostile ou l’offense envers Dieu; « contre moi » la préserve explicitement.
- source_word: filiis filiorum suorum
  choice: aux enfants de leurs enfants
  rationale: Reproduit l’expression générationnelle du latin sans la remplacer par le terme plus interprétatif « descendants ».
theological_decisions:
- issue: Référent du sujet dans « ut nuntient »
  choice: afin qu’ils les racontent
  alternative: afin que leurs enfants les racontent
  rationale: Le sujet implicite pluriel peut être compris à partir du contexte comme le peuple et/ou ses enfants. Le pronom « ils » maintient cette légère ambiguïté plutôt que de la résoudre artificiellement.
- issue: Objet implicite de « nuntient »
  choice: les
  alternative: cela
  rationale: Le pronom reprend naturellement les mauvaises actions et les injustices déjà mentionnées, sans ajouter d’objet absent du latin.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition « enfants de leurs enfants » est conservée pour respecter la formulation générationnelle du texte source.
