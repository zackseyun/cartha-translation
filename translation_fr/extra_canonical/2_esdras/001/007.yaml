id: 2ES.1.7
reference: 2 Esdras 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nonne ego eos eduxi de terra Aegypti, de domo seruitutis? ipsi autem irritauerunt me et consilia mea spreuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: fr
  text: N’est-ce pas moi qui les ai fait sortir du pays d’Égypte, de la maison de servitude ? Mais eux, ils m’ont irrité et ont méprisé mes conseils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domo seruitutis
  choice: maison de servitude
  rationale: Conserve l’image traditionnelle et concrète du latin, qui désigne la condition d’asservissement en Égypte.
- source_word: irritauerunt me
  choice: m’ont irrité
  rationale: Rend directement l’idée de provocation et de colère suscitée, sans préciser davantage la nature de l’offense.
- source_word: consilia mea
  choice: mes conseils
  rationale: Préserve la portée plurielle de consilia, qui peut évoquer les directives, desseins ou avis de Dieu, sans réduire cette ambiguïté.
- source_word: ipsi autem
  choice: Mais eux, ils
  rationale: Le pronom disjoint suivi de sa reprise donne en français naturel une valeur contrastive et emphatique correspondant à ipsi.
theological_decisions:
- issue: Portée de consilia mea
  choice: mes conseils
  alternative: mes desseins / mes instructions
  rationale: « Mes conseils » maintient l’ambivalence entre les directives données par Dieu et ses intentions, sans imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La tournure interrogative conserve la force rhétorique du latin, et le contraste emphatique de ipsi autem est rendu sans alourdir excessivement la phrase.
