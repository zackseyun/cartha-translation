  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: fr
  text: Je vous ai donné Moïse pour chef et Aaron pour prêtre. Je vous ai procuré de la lumière au moyen d’une colonne de feu, et j’ai accompli de grands prodiges parmi vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ducem
  choice: chef
  rationale: Rend directement le rôle de direction confié à Moïse, dans un français courant et digne.
- source_word: sacerdotem
  choice: prêtre
  rationale: Équivalent naturel et précis du titre cultuel attribué à Aaron.
- source_word: praestiti
  choice: j’ai procuré
  rationale: Exprime l’idée de fournir ou d’accorder la lumière, tout en évitant de répéter « donné ».
- source_word: per columnam ignis
  choice: au moyen d’une colonne de feu
  rationale: Conserve la valeur instrumentale de per et l’image biblique de la colonne de feu.
- source_word: magna mirabilia
  choice: de grands prodiges
  rationale: « Prodiges » rend le caractère extraordinaire et divin des mirabilia dans un registre biblique moderne.
