  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: fr
  text: Quand vous m’invoquerez, je ne vous exaucerai pas, car vous avez souillé vos mains de sang, et vos pieds sont prompts à commettre des meurtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuocabitis
  choice: vous m’invoquerez
  rationale: Rend directement l’idée d’appeler Dieu à l’aide, tout en conservant le futur du latin.
- source_word: non exaudiam
  choice: je ne vous exaucerai pas
  rationale: « Exaucer » exprime précisément le refus de répondre favorablement à une invocation, plutôt qu’une simple absence d’audition.
- source_word: maculastis
  choice: vous avez souillé
  rationale: Conserve l’image morale et cultuelle de mains rendues impures par le sang.
- source_word: inpigri sunt
  choice: s’empressent
  rationale: Le latin décrit des pieds actifs, prompts et non paresseux à accomplir le mal; cette formulation est naturelle en français sans ajouter l’image de vitesse absente du terme lui-même.
- source_word: homicidia
  choice: des meurtres
  rationale: Rend le pluriel latin et désigne clairement des homicides volontaires dans un français courant.
theological_decisions:
- issue: Portée du refus divin d’écouter
  choice: « je ne vous exaucerai pas »
  alternative: « je ne vous écouterai pas »
  rationale: La traduction garde le lien entre l’invocation et l’absence de réponse favorable, sans transformer le verset en affirmation que Dieu serait incapable d’entendre.
translation_notes:
  register: Français moderne, clair et digne. La structure causale et le parallélisme entre les mains et les pieds sont préservés.
