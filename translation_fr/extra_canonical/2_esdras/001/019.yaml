  text: dans ce désert. J’ai été peiné par vos gémissements et je vous ai donné la manne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deserto hoc
  choice: dans ce désert
  rationale: Rend directement le démonstratif latin hoc et conserve le caractère de continuation du fragment.
- source_word: dolui
  choice: j’ai été peiné
  rationale: Doleo exprime ici la douleur ou le chagrin éprouvé, plutôt qu’une simple compassion.
- source_word: gemitos uestros
  choice: vos gémissements
  rationale: Traduction directe de gemitus, qui désigne des plaintes exprimées par des gémissements.
- source_word: mannam
  choice: la manne
  rationale: Terme biblique français courant et précis pour le latin manna.
theological_decisions:
- issue: Nature de la réaction divine exprimée par dolui
  choice: j’ai été peiné
  alternative: j’ai eu pitié
  rationale: Le latin affirme explicitement une douleur ou une peine éprouvée; le rendre par «avoir pitié» atténuerait cette charge affective et correspondrait plus naturellement à un autre verbe latin.
translation_notes:
  register: Français moderne, sobre et digne. La minuscule initiale et la phrase fragmentaire sont conservées parce que «dans ce désert» poursuit la syntaxe du contexte précédent.
