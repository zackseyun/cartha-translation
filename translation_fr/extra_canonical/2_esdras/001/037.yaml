  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
translation:
  language: fr
  text: 'la grâce du peuple qui vient, dont les petits enfants exultent de joie : sans me voir de leurs yeux de chair, ils croiront pourtant, en esprit, ce que j’ai dit. Et maintenant, Père, regarde avec gloire et vois le peuple qui vient.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gratiam
  choice: la grâce
  rationale: « Grâce » conserve la richesse de sens du latin gratia — faveur, bienveillance, grâce — sans réduire le terme à une simple approbation humaine.
- source_word: populi uenientis
  choice: du peuple qui vient
  rationale: Cette formulation reproduit le génitif latin et le participe présent, tout en gardant l’idée d’un peuple en train de venir plutôt que de préciser indûment son identité.
- source_word: paruuli
  choice: les petits enfants
  rationale: Le terme désigne ici les petits ou les jeunes enfants; cette traduction est naturelle et concrète.
- source_word: oculis carnalibus
  choice: de leurs yeux de chair
  rationale: Cette expression conserve le contraste anthropologique entre la perception corporelle et la foi en esprit.
- source_word: spiritu
  choice: en esprit
  rationale: L’ablatif peut exprimer la sphère ou le moyen. « En esprit » préserve cette latitude et n’impose pas explicitement une référence au Saint-Esprit.
- source_word: aspice cum gloria
  choice: regarde avec gloire
  rationale: Traduction proche du latin, qui maintient l’association inhabituelle de l’acte de regarder avec la gloire sans l’expliquer ni la paraphraser.
theological_decisions:
- issue: Rapport entre la vision corporelle et la foi spirituelle
  choice: « sans me voir de leurs yeux de chair, ils croiront pourtant, en esprit »
  alternative: « bien qu’ils ne m’aient pas vu de leurs yeux corporels, ils croiront par l’Esprit »
  rationale: Le choix retenu respecte le participe présent latin et évite d’identifier sans preuve spiritu au Saint-Esprit.
- issue: Sens théologique de gratia
  choice: « la grâce du peuple »
  alternative: « la faveur accordée au peuple »
  rationale: Le génitif latin demeure ambigu quant au rapport exact entre la grâce et le peuple; la traduction ne précise donc pas explicitement que la grâce lui est accordée.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe initiale demeure fragmentaire parce que le verset latin fourni commence par un groupe nominal dépendant vraisemblablement du contexte précédent. Les présents « vient » et « exultent » ainsi que le futur « croiront » reproduisent la variation temporelle de la source.
