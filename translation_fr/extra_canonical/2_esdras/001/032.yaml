  yaml_path: translation/extra_canonical/2_esdras/001/032.yaml
  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: fr
  text: Je vous ai envoyé mes serviteurs, les prophètes. Vous les avez accueillis, puis tués, et vous avez mis leurs corps en pièces ; je vous demanderai compte de leur sang, dit le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pueros meos prophetas
  choice: mes serviteurs, les prophètes
  rationale: Dans ce contexte, « pueros » désigne les serviteurs ou envoyés de Dieu plutôt que des enfants ; l’apposition conserve la désignation des serviteurs comme prophètes.
- source_word: acceptos
  choice: accueillis
  rationale: Rend le sens direct de « acceptos » sans lui substituer l’idée de saisie ou d’arrestation ; le contraste avec leur mise à mort reste volontairement frappant.
- source_word: laniastis corpora illorum
  choice: vous avez mis leur corps en pièces
  rationale: Expression française naturelle et forte qui restitue la violence de « laniastis » et maintient le collectif singulier latin « corpora » sous la forme idiomatique « leur corps ».
- source_word: sanguinem exquiram
  choice: je demanderai compte de leur sang
  rationale: Formulation biblique intelligible exprimant que Dieu exigera justice pour le sang versé, plutôt qu’une recherche matérielle du sang.
theological_decisions:
- issue: Portée judiciaire de « sanguinem exquiram »
  choice: je demanderai compte de leur sang
  alternative: je réclamerai leur sang
  rationale: Le choix retenu exprime clairement la responsabilité pour le meurtre sans préciser au-delà du texte la forme du jugement ou de la rétribution.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été divisée après « les prophètes » pour alléger la longue construction latine, tout en conservant l’enchaînement accusateur et la formule prophétique finale.
