  yaml_path: translation/extra_canonical/2_esdras/001/030.yaml
  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
translation:
  language: fr
  text: C’est ainsi[a] que je vous ai rassemblés, comme une poule rassemble ses poussins sous ses ailes. Mais maintenant, que vais-je faire de vous ? Je vous chasserai de devant moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot rendu par « ainsi » se trouve à la fin du verset précédent dans le latin, mais il se rattache grammaticalement à « je vous ai rassemblés » dans ce verset.
    reason: La division en versets sépare l’adverbe du verbe qu’il introduit; la note explique son emplacement et sa restitution.
lexical_decisions:
- source_word: collegi
  choice: je vous ai rassemblés
  rationale: Le verbe latin colligere signifie ici réunir ou rassembler; le passé composé donne une formulation naturelle en français moderne.
- source_word: ut gallina pullos suos sub alas suas
  choice: comme une poule rassemble ses poussins sous ses ailes
  rationale: La comparaison protectrice est conservée explicitement, avec la répétition de « rassemble » sous-entendue par le latin.
- source_word: quid faciam uobis?
  choice: que vais-je faire de vous ?
  rationale: Cette tournure rend naturellement l’interrogation délibérative du latin sans en préciser davantage la portée.
- source_word: proiciam uos a facie mea
  choice: Je vous chasserai loin de ma présence
  rationale: Proicere exprime ici l’expulsion ou le rejet; « loin de ma présence » restitue l’expression latine a facie mea dans un français actuel et digne.
theological_decisions:
- issue: Image de la face divine
  choice: loin de ma présence
  alternative: de devant ma face
  rationale: La formulation choisie conserve l’idée d’exclusion de la présence divine sans imposer en français une expression corporelle maladroite; l’image sous-jacente demeure signalée par la proximité sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore maternelle de la poule est maintenue sans atténuation. Le fragment final « Oblationes mihi cum » appartient à la suite du texte et n’est pas intégré à ce verset.
