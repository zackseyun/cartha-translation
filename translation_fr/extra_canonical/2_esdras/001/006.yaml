base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: fr
  text: 'Car les péchés de leurs pères ont grandi en eux : en effet, ils m’ont oublié et ont offert des sacrifices à des dieux étrangers.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: parentum illorum
  choice: leurs pères
  rationale: Dans ce contexte, « pères » exprime naturellement l’idée des ancêtres ou générations précédentes, tout en restant proche du latin.
- source_word: in illis creuerunt
  choice: ont grandi en eux
  rationale: Rend littéralement l’idée inhabituelle d’une croissance des péchés au sein des descendants, sans réduire le sens à une simple augmentation.
- source_word: obliti enim me
  choice: ils m’ont oublié
  rationale: Formulation française directe qui conserve le rapport causal exprimé par « enim » dans l’enchaînement de la phrase.
- source_word: sacrificauerunt
  choice: ont offert des sacrifices
  rationale: Expression idiomatique et précise pour l’acte cultuel désigné par le verbe latin.
- source_word: diis alienis
  choice: à des dieux étrangers
  rationale: Conserve le sens de divinités autres que le Dieu qui parle, sans préciser davantage leur origine.
theological_decisions:
- issue: Rapport entre les péchés des ancêtres et ceux des descendants
  choice: Conserver « ont grandi en eux »
  alternative: « se sont multipliés parmi eux » ou « ont augmenté chez eux »
  rationale: Le latin présente les péchés ancestraux comme croissant dans les descendants; la traduction maintient cette tension sur la continuité et l’aggravation du péché sans imposer une théorie particulière de culpabilité héréditaire.
translation_notes:
  register: Français moderne, sobre et digne. La structure causale et le parallélisme du latin sont préservés; aucun appel de note n’est nécessaire.
