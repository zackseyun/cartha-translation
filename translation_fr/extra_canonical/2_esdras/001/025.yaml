source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam me dereliquistis, et ego uos derelinquam: petentibus uobis a me misericordiam, non miserebor uestri.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: fr
  text: Puisque vous m’avez abandonné, moi aussi, je vous abandonnerai. Quand vous me demanderez miséricorde, je n’aurai pas pitié de vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis / derelinquam
  choice: avez abandonné / abandonnerai
  rationale: Conserve la répétition du même verbe latin et exprime clairement la réciprocité du jugement.
- source_word: petentibus uobis a me misericordiam
  choice: quand vous me demanderez miséricorde
  rationale: Rend naturellement en français la construction participiale latine dans son sens temporel, tout en maintenant le terme théologique « miséricorde ».
- source_word: non miserebor uestri
  choice: je n’aurai pas pitié de vous
  rationale: Distingue la réponse verbale « avoir pitié » du nom misericordiam, conformément à la variation latine entre misericordia et misereor.
theological_decisions:
- issue: Réciprocité du jugement divin
  choice: Maintenir explicitement « moi aussi » et le futur « je vous abandonnerai »
  alternative: « je vous ai abandonnés » ou formulation atténuée
  rationale: Le latin et ego ainsi que le futur derelinquam présentent une réponse divine à venir, directement mise en parallèle avec l’abandon commis par les destinataires.
- issue: Refus de miséricorde
  choice: 'Traduire sans atténuation : « je n’aurai pas pitié de vous »'
  alternative: « je ne vous répondrai pas »
  rationale: Le texte affirme précisément le refus de la compassion demandée; une paraphrase en termes de réponse affaiblirait cette tension théologique.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme verbal est préservé; la seconde phrase reste intelligible sans archaïsme.
