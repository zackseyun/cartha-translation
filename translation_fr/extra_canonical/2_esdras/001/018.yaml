  text: saying, “Why have you brought us into this wilderness, to kill us? It would have been better for us to serve the Egyptians than to die in this wilderness.”
translation:
  language: fr
  text: 'en me disant : « Pourquoi nous as-tu conduits dans ce désert ? Pour nous faire mourir ? Il aurait mieux valu pour nous de servir les Égyptiens que de mourir dans ce désert. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertum
  choice: désert
  rationale: Rend directement le latin et correspond au cadre traditionnel du récit de l’Exode.
- source_word: interficere nos
  choice: pour nous faire mourir
  rationale: Expression française naturelle qui conserve l’idée d’une conduite ayant pour but ou résultat leur mort, sans durcir inutilement en « nous tuer ».
- source_word: seruire Aegyptiis
  choice: servir les Égyptiens
  rationale: Traduction directe qui préserve l’allusion à la servitude en Égypte sans ajouter explicitement « être esclaves ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La plainte est formulée en deux questions brèves afin de conserver sa force orale. Le complément final « dans ce désert », présent dans la couche anglaise et requis par le sens complet de la phrase, supplée la coupure matérielle du texte latin fourni, qui s’arrête à « in ».
