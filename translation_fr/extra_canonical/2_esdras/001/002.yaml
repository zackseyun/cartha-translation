  text: Filii Achiae, filii Finees, filii Heli, filii Ameriae, filii Aziei, filii Marimoth, filii Arna, filii Oziae, filii Borith, filii Abissei, filii Finees, filii Eleazar,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/002.yaml
  text: son of Ahijah[a], son of Phinehas, son of Eli, son of Amariah, son of Aziah, son of Meraioth, son of Arna, son of Uzziah, son of Borith, son of Abishua, son of Phinehas, son of Eleazar,
translation:
  language: fr
  text: fils d’Ahija, fils de Phinéas, fils d’Éli, fils d’Amaria, fils d’Azia, fils de Meraioth, fils d’Arna, fils d’Ozias, fils de Borith, fils d’Abishua[a], fils de Phinéas, fils d’Éléazar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils d’Abishaï ».
    reason: Signale l’identification alternative de la forme latine Abissei, tout en conservant « Abishua » comme lecture principale dans cette généalogie sacerdotale.
lexical_decisions:
- source_word: Achiae
  choice: Ahija
  rationale: Forme française biblique naturelle correspondant au nom latin génitif « Achiae », conformément à l’identification retenue dans la lignée.
- source_word: Oziae
  choice: Ozias
  rationale: Le latin renvoie à la forme traditionnellement rendue « Ozias » en français, plutôt qu’à « Uzzi ».
- source_word: Abissei
  choice: Abishua
  rationale: Dans cette généalogie sacerdotale, la forme latine correspond à Abishua, ancêtre de la lignée d’Éléazar, et non à Abishaï.
- source_word: filii
  choice: fils de
  rationale: Rend directement la relation généalogique exprimée par le latin, avec élision devant les noms commençant par une voyelle.
