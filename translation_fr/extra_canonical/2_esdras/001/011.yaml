source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Omnes gentes a facie eorum perdidi et in oriente prouinciarum duarum populum, Tyri et Sidonis, dissipaui et omnes aduersarios eorum interfeci.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: fr
  text: J’ai détruit devant eux toutes les nations. À l’est, j’ai dispersé la population des deux provinces, Tyr et Sidon, et j’ai tué tous leurs adversaires.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a facie eorum
  choice: devant eux
  rationale: Rend directement l’expression latine et indique que les nations ont été éliminées sur leur passage, sans expliciter davantage la relation.
- source_word: in oriente
  choice: À l’est
  rationale: Traduction naturelle de la localisation donnée par le latin.
- source_word: prouinciarum duarum populum
  choice: la population des deux provinces
  rationale: Conserve le singulier collectif « populum » tout en produisant un français idiomatique.
- source_word: dissipaui
  choice: j’ai dispersé
  rationale: Reproduit le sens de mise en dispersion sans renforcer arbitrairement en « détruit ».
- source_word: aduersarios
  choice: adversaires
  rationale: Terme général qui préserve la portée du latin, plutôt que de préciser « ennemis ».
- source_word: interfeci
  choice: j’ai tué
  rationale: Rend sans euphémisme l’action violente exprimée par le verbe latin.
