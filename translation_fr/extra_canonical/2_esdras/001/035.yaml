  verdict: revise
  source_fidelity: 'La traduction conserve correctement les temps essentiels : « croient » rend le présent credunt, tandis que « feront » rend le futur facient. « Sans m’entendre » reproduit de façon recevable me non audientes, et « je ne leur ai montré aucun signe » correspond à quibus signa non ostendi. En revanche, « ses membres » n’est pas exprimé par le latin et médiatise inutilement le relatif pluriel qui se rapporte au collectif populus.'
  naturalness: Le français est globalement clair, mais l’ajout de « ses membres » alourdit la formulation et rend moins direct le parallèle des pronoms pluriels. Après « un peuple qui vient », la reprise par « ils/leur » est naturelle en français lorsqu’il s’agit des personnes composant ce peuple.
  terminology: « Maisons », « peuple », « signe », « commandé » et « croient » sont justes, modernes et de registre scripturaire sobre. « Un peuple » reflète mieux l’indétermination de populo que le défini « au peuple » dans cette phrase isolée.
