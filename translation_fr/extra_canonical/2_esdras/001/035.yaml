base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
translation:
  language: fr
  text: 'Je donnerai vos maisons à un peuple qui vient[a] : sans m’entendre, ils croient ; je ne leur ai montré aucun signe, et pourtant ils feront ce que j’ai commandé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à un peuple qui s’approche ».'
    reason: Le participe latin venienti peut être rendu par « qui vient » ou, plus contextuellement, « qui s’approche », sans identifier ce peuple.
lexical_decisions:
- source_word: domus uestras
  choice: vos maisons
  rationale: Rend directement l’accusatif pluriel latin.
- source_word: populo uenienti
  choice: au peuple qui vient
  rationale: Le participe présent venienti décrit un peuple en train de venir ou qui s’approche ; cette formulation conserve cette valeur sans préciser indûment son identité.
- source_word: me non audientes credunt
  choice: sans m’entendre, ses membres croient
  rationale: Conserve la simultanéité du participe présent audientes et le présent credunt. « Ses membres » explicite naturellement en français le passage du collectif singulier populus au pluriel des verbes et participes latins, sans changer le référent.
- source_word: signa
  choice: signe
  rationale: « Signe » est le terme français normal dans ce contexte de manifestations probantes ou miraculeuses.
- source_word: facient quae praecepi
  choice: ils feront ce que j’ai commandé
  rationale: Respecte le contraste temporel entre le futur facient et le parfait praecepi.
theological_decisions:
- issue: Objet implicite du verbe credunt
  choice: « croient », sans complément ajouté
  alternative: « croient en moi »
  rationale: Le latin ne donne aucun complément explicite à credunt. La traduction préserve cette légère indétermination au lieu d’ajouter « en moi ».
- issue: Contraste entre foi présente et obéissance future
  choice: « croient » puis « feront »
  alternative: « croiront » puis « feront »
  rationale: Credunt est au présent, tandis que facient est au futur ; ce contraste peut porter une tension théologique et doit être maintenu.
translation_notes:
  register: Français international moderne, digne et lisible. Le deux-points aide à reprendre naturellement le collectif « peuple » par le pluriel sémantique « ses membres… ils », conformément aux formes plurielles latines qui suivent.
