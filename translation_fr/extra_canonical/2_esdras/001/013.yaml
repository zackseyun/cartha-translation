source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nempe ego uos mare traieci et plateas uobis in inuia munitas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/013.yaml
  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
translation:
  language: fr
  text: Oui, c’est bien moi qui vous ai fait traverser la mer et qui, dans des lieux sans chemin, ai aménagé pour vous des routes sûres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nempe
  choice: Oui, c’est bien moi
  rationale: Rend la particule affirmative et insistante latine sans reprendre à tort « Ainsi parle le Seigneur » du verset précédent.
- source_word: mare traieci
  choice: vous ai fait traverser la mer
  rationale: Exprime naturellement la valeur transitive et causative de traicere avec l’accusatif de la personne.
- source_word: plateas
  choice: des routes
  rationale: Dans ce contexte de lieux impraticables, le sens de voies larges ou aménagées convient mieux que « places » ou « rues ».
- source_word: in inuia
  choice: dans des lieux sans chemin
  rationale: Conserve le contraste du latin entre des espaces dépourvus de voies et les routes que Dieu y aménage.
- source_word: munitas
  choice: sûres
  rationale: Reflète l’idée de voies affermies, aménagées ou sécurisées; le verbe « aménagé » porte la dimension d’action implicite dans la tournure latine.
theological_decisions:
- issue: Continuité possible avec la formule introductive du verset précédent
  choice: Ne pas ajouter « Ainsi parle le Seigneur »
  alternative: '« Ainsi parle le Seigneur : je vous ai fait traverser… »'
  rationale: Le texte latin fourni commence directement par Nempe ego; importer la formule du verset précédent effacerait cette donnée textuelle.
translation_notes:
  register: Français moderne, digne et accessible. L’insistance de « Nempe ego » est rendue explicitement; la syntaxe évite une imitation raide du latin tout en préservant le contraste entre les lieux sans chemin et les routes rendues praticables.
