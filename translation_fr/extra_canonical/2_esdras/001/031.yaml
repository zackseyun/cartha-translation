source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: obtulleritis, auertam faciem meam a uobis ; dies enim festos uestros et neomenias et circumcisiones carnis repudiavi. Ego
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
translation:
  language: fr
  text: Quand vous apporterez vos offrandes[a], je détournerai de vous mon visage, car j’ai rejeté vos jours de fête, vos nouvelles lunes et les circoncisions de la chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce chapitre appartient à la couche chrétienne tardive souvent appelée « 5 Esdras ». Le rejet des « jours de fête », des « nouvelles lunes » et des « circoncisions de la chair » reflète la voix polémique de cette couche et ne doit pas être confondu avec la théologie de l’apocalypse juive des chapitres 3 à 14.
    reason: compositional_layer
lexical_decisions:
- source_word: obtulleritis (obtuleritis)
  choice: Quand vous apporterez vos offrandes
  rationale: Le verbe latin signifie « apporter, présenter, offrir ». Son complément est sous-entendu dans le fragment transmis; « vos offrandes » l’explicite naturellement sans préciser un type de sacrifice absent du texte.
- source_word: auertam faciem meam a uobis
  choice: je détournerai de vous mon visage
  rationale: Conserve l’image sémitisante du visage détourné, qui exprime ici le refus divin.
- source_word: dies festos uestros
  choice: vos jours de fête
  rationale: Rend directement le pluriel latin dans un français actuel et accessible.
- source_word: neomenias
  choice: vos nouvelles lunes
  rationale: Terme traditionnel et précis pour les célébrations mensuelles liées à la nouvelle lune.
- source_word: circumcisiones carnis
  choice: les circoncisions de la chair
  rationale: Maintient le pluriel et la formulation polémique concrète du texte latin, sans la réinterpréter.
- source_word: repudiavi
  choice: j’ai rejeté
  rationale: Exprime le refus ferme indiqué par le parfait latin.
theological_decisions:
- issue: Portée du rejet des observances cultuelles
  choice: Conserver sans atténuation l’énumération polémique du texte
  alternative: Reformuler comme une condamnation limitée aux observances hypocrites ou mal pratiquées
  rationale: Le verset ne donne lui-même aucune restriction de ce genre. La note situe cette voix dans sa couche rédactionnelle chrétienne tardive afin d’éviter de l’attribuer indistinctement à l’apocalypse juive des chapitres 3 à 14.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’image biblique du visage détourné et la tension polémique du passage. Le « Ego » final de l’extrait latin ouvre la phrase suivante et n’est donc pas intégré à ce verset.
