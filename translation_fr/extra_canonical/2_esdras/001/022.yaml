  text: 'uobis adhuc? dicit dominus. Haec dicit dominus omnipotens: in deserto cum essetis in flumine amaro sitientes et blasphemantes nomen meum,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/022.yaml
  text: 'Thus says the Lord Almighty: In the wilderness, when you were thirsty at the bitter stream and blasphemed my name,'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur tout-puissant : Dans le désert, alors que vous aviez soif au bord du cours d’eau amer et blasphémiez mon nom,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Haec dicit dominus omnipotens
  choice: Ainsi parle le Seigneur tout-puissant
  rationale: Formule prophétique française naturelle et digne, qui rend directement le latin sans lourdeur.
- source_word: in deserto
  choice: Dans le désert
  rationale: Conserve la mise en relief initiale du cadre géographique dans la proposition.
- source_word: in flumine amaro
  choice: près du cours d’eau amer
  rationale: Le latin in avec l’ablatif peut situer les personnes au cours d’eau ou près de celui-ci; « cours d’eau » préserve une certaine indétermination de flumen, qui peut désigner un fleuve, une rivière ou un courant.
- source_word: blasphemantes nomen meum
  choice: que vous blasphémiez mon nom
  rationale: Rend explicitement l’objet du blasphème et maintient le parallélisme temporel avec « aviez soif ».
theological_decisions:
- issue: Nature du blasphème
  choice: blasphémiez mon nom
  alternative: profaniez mon nom
  rationale: Le latin blasphemantes désigne explicitement le blasphème; la formulation retenue ne l’atténue pas et n’ajoute aucune interprétation confessionnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase demeure ouverte par une virgule, conformément au texte source fourni, qui se poursuit au verset suivant. Le fragment initial « uobis adhuc? dicit dominus. » semble appartenir à la fin du verset précédent et n’est donc pas intégré au texte de 1:22.
