source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vt essetis mihi in populum, et ego uobis in deum, et uos mihi in filios, et ego uobis in patrem ? Ita uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/029.yaml
  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
translation:
  language: fr
  text: pour que vous soyez mon peuple, que je sois votre Dieu, que vous soyez mes fils[a] et que je sois votre père ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants ».
    reason: Le pluriel masculin « fils » peut, selon l’usage, désigner collectivement les enfants, mais le latin porte explicitement filios.
lexical_decisions:
- source_word: populum
  choice: peuple
  rationale: Rend directement le nom latin et conserve la formule biblique d’alliance « mon peuple… votre Dieu ».
- source_word: filios
  choice: fils
  rationale: Le masculin pluriel latin signifie ici « fils » et maintient l’image explicite des fils et du père ainsi que le lien lexical avec le verset précédent.
- source_word: Ita uos
  choice: non inclus dans ce verset
  rationale: Ces mots ouvrent la proposition suivante dans la segmentation suivie; les inclure ici laisserait en français un fragment pendant après la question.
theological_decisions:
- issue: Portée inclusive éventuelle de filios
  choice: mes fils
  alternative: mes enfants
  rationale: « Fils » suit la forme masculine précise du latin et préserve la tension de l’image filiale; une note signale le sens collectif possible sans l’imposer dans le texte.
translation_notes:
  register: Français moderne, clair et digne. La répétition équilibrée des quatre propositions conserve le parallélisme du latin, tandis que les possessifs naturels en français rendent les tournures mihi/vobis sans lourdeur.
