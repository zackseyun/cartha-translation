source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid tibi faciam, Iacob ? noluisti me obaudire, Iuda. transferam me ad alias gentes et dabo eis nomen meum, ut custodiant legitima mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: fr
  text: Que te ferai-je, Jacob ? Tu n’as pas voulu m’obéir, Juda. Je me tournerai vers d’autres nations et je leur donnerai mon nom, afin qu’elles gardent mes prescriptions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  choice: Que te ferai-je
  rationale: Rend directement la tournure latine et conserve l’interrogation ouverte, potentiellement lourde de jugement, sans l’expliciter.
- source_word: noluisti me obaudire
  choice: Tu n’as pas voulu m’obéir
  rationale: Préserve la nuance de refus volontaire portée par « noluisti », plutôt qu’un simple constat de désobéissance.
- source_word: transferam me ad alias gentes
  choice: Je me tournerai vers d’autres nations
  rationale: Formulation française naturelle qui exprime le déplacement d’attention ou d’allégeance indiqué par le latin, sans suggérer nécessairement un déplacement physique.
- source_word: dabo eis nomen meum
  choice: je leur donnerai mon nom
  rationale: Conserve littéralement l’expression théologiquement dense sans réduire sa portée à une seule interprétation.
- source_word: legitima mea
  choice: mes prescriptions
  rationale: « Prescriptions » désigne clairement les règles établies par Dieu et reste accessible en français moderne; « statuts » serait possible mais plus technique.
theological_decisions:
- issue: Portée du don du nom divin aux autres nations
  choice: Conserver « je leur donnerai mon nom » sans explication dans le texte
  alternative: Interpréter comme « elles porteront mon nom » ou « je me ferai connaître d’elles »
  rationale: Le latin laisse ouverte la portée exacte de cette formule; la traduction ne doit pas trancher entre appartenance, révélation et invocation.
- issue: Rapport entre Jacob et Juda
  choice: Maintenir les deux vocatifs distincts
  alternative: Les harmoniser ou les traiter explicitement comme une seule collectivité
  rationale: Le texte passe de « Jacob » à « Juda »; cette tension rhétorique ou textuelle doit être préservée.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement convient à l’adresse divine directe à une collectivité personnifiée. Aucune note n’est nécessaire.
