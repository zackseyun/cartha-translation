lexical_decisions:
- source_word: non uiderunt
  choice: Ils n’ont pas vu
  rationale: La forme latine ne précise pas ce qu’ils n’ont pas vu; la traduction conserve cette absence de complément plutôt que d’ajouter «les prophètes» ou un autre objet.
- source_word: et
  choice: pourtant
  rationale: Dans ce contexte, la coordination exprime naturellement un contraste en français; «pourtant» rend cette tension sans en modifier le contenu.
- source_word: memorabuntur antiquitatum eorum
  choice: ils se souviendront de leur antiquité
  rationale: 'Le latin transmis est grammaticalement instable. Cette formulation suit le sens retenu par la couche de consultation anglaise tout en gardant à «antiquité» sa portée ouverte: temps anciens, passé ancien ou réalités anciennes.'
- source_word: Testor
  choice: Je prends à témoin
  rationale: Cette tournure solennelle et courante rend le verbe latin sans compléter artificiellement la proposition, qui se poursuit vraisemblablement dans le contexte suivant.
