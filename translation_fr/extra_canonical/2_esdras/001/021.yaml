  yaml_path: translation/extra_canonical/2_esdras/001/021.yaml
  text: I covered you with the leaves of trees[a]. I divided fertile lands for you; I drove out the Canaanites and Perizzites and Philistines from before you. What shall I do for you? says the Lord.
translation:
  language: fr
  text: Je vous ai couverts de feuilles d’arbres. Je vous ai distribué des terres fertiles[a] ; j’ai chassé devant vous les Cananéens, les Phérézéens et les Philistins. Que ferai-je ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin est condensé : littéralement, « J’ai divisé pour vous des terres fertiles ». Cette expression peut évoquer l’attribution du pays aux tribus d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: folia arborum uos texi
  choice: Je vous ai couverts de feuilles d’arbres
  rationale: Rend directement l’image inhabituelle du latin sans l’expliquer ni la remplacer par une formulation plus familière.
- source_word: Diuisi uobis terras pingues
  choice: J’ai partagé pour vous des terres fertiles
  rationale: « Partagé » conserve l’idée de division ou de répartition portée par diuisi ; « fertiles » exprime naturellement pingues appliqué à des terres.
- source_word: a facie uestra proieci
  choice: j’ai chassé devant vous
  rationale: Formulation française naturelle qui conserve le sens spatial et l’action d’expulser les peuples à l’approche d’Israël.
- source_word: quid faciam
  choice: Que ferai-je ?
  rationale: Le texte latin fourni ne contient ici ni complément explicite équivalant à « pour vous » ni formule « dit le Seigneur » ; la traduction préserve cette brièveté.
theological_decisions:
- issue: Sujet divin implicite et formule de parole
  choice: Ne pas ajouter « dit le Seigneur »
  alternative: « Que ferai-je pour vous ? dit le Seigneur. »
  rationale: Même si le contexte et la couche anglaise identifient le locuteur au Seigneur, ces mots ne figurent pas dans le texte latin fourni. La traduction suit prioritairement la preuve textuelle source.
translation_notes:
  register: Français moderne, digne et accessible. Les noms de peuples suivent des formes françaises bibliques largement reconnues. L’étrangeté de l’image des « feuilles d’arbres » et la concision de la question finale sont volontairement conservées.
