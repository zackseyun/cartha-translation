  yaml_path: translation/extra_canonical/2_esdras/001/033.yaml
  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: fr
  text: 'Ainsi parle le Seigneur tout-puissant : « Votre maison est déserte. Je vous rejetterai comme le vent emporte la paille. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: domus vestra deserta est
  choice: Votre maison est abandonnée
  rationale: « Maison » conserve domus, qui peut désigner à la fois une demeure et, par extension, une communauté ou une lignée. « Abandonnée » rend deserta sans préciser si elle est vide, délaissée ou dévastée.
- source_word: proiciam vos
  choice: Je vous jetterai au loin
  rationale: Le verbe proicere exprime une expulsion ou un rejet énergique. « Au loin » restitue naturellement en français l’idée d’éloignement impliquée par le préverbe pro-.
- source_word: sicut ventus stipulam
  choice: comme le vent emporte la paille
  rationale: 'La comparaison latine est elliptique : le vent sert implicitement de sujet à l’action exercée sur la paille. « Emporte » produit une image française naturelle tout en conservant la fragilité et la dispersion évoquées par stipula.'
theological_decisions:
- issue: Portée de « votre maison »
  choice: Conserver « maison » sans explicitation
  alternative: Traduire par « votre peuple », « votre nation » ou « votre Temple »
  rationale: Domus reste polysémique dans le contexte et peut avoir une portée matérielle ou collective. L’expliciter résoudrait indûment cette ambiguïté.
- issue: Titre divin omnipotens
  choice: le Seigneur tout-puissant
  alternative: le Seigneur souverain de tout / le Seigneur omnipotent
  rationale: « Tout-puissant » est le rendu français moderne, digne et largement intelligible d’omnipotens, sans ajout confessionnel.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formulation garde l’image biblique de la maison et rend naturellement la comparaison elliptique avec le vent. Le début fourni (« serta est ») est manifestement tronqué au milieu de deserta ; le texte continu de l’édition et la couche anglaise auditée permettent de rétablir la proposition et la formule introductive du verset.
