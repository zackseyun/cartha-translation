  text: Then I saw, and behold, something like a lion roused from the forest.
translation:
  language: fr
  text: 'Alors je vis, et voici : c’était comme un lion qui surgissait de la forêt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et vidi et ecce
  choice: Alors je vis, et voici
  rationale: Conserve l’enchaînement narratif et la formule de vision du latin dans un français biblique clair et actuel.
- source_word: sicut leo
  choice: c’était comme un lion
  rationale: Rend explicitement la comparaison introduite par « sicut », sans identifier directement la figure à un lion.
- source_word: suscitatus de silua
  choice: réveillé dans la forêt
  rationale: « suscitatus » décrit ici un lion tiré de son repos ou mis en mouvement; « réveillé » est naturel et correspond au sens contextuel de « roused ». La préposition latine « de » peut, dans ce latin tardif, se comprendre dans un sens locatif lié à la forêt.
theological_decisions:
- issue: Nature symbolique de la figure léonine
  choice: 'Maintien de la comparaison : « comme un lion »'
  alternative: « un lion » ou « quelqu’un qui ressemblait à un lion »
  rationale: Le latin « sicut » présente une ressemblance sans préciser davantage l’identité de la figure; la traduction préserve cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure visionnaire « et voici » est conservée; la syntaxe est légèrement explicitée par « c’était » afin que la comparaison reste naturelle et intelligible.
