  text: And I looked, and behold, two of the six little pinions were separated and remained under the head that was on the right side; for
translation:
  language: fr
  text: 'Et je regardai, et voici : deux des six petites ailes furent séparées et restèrent sous la tête qui était à droite, car'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pennaculis
  choice: petites ailes
  rationale: Le diminutif latin désigne ici les six appendices ailés plus petits de l’aigle. « Petites ailes » est clair en français courant et conserve la distinction avec les grandes ailes du contexte.
- source_word: diuisa sunt
  choice: se séparèrent
  rationale: Cette tournure rend naturellement le passif latin tout en conservant l’idée que deux petites ailes se détachent du groupe des six.
- source_word: sub capite
  choice: sous la tête
  rationale: Traduction directe de la relation spatiale exprimée par le latin.
- source_word: ad dexteram partem
  choice: du côté droit
  rationale: Cette formulation idiomatique restitue la localisation sans préciser abusivement s’il s’agit de la droite de l’aigle ou de celle du voyant.
- source_word: nam
  choice: car
  rationale: La conjonction introduit une explication qui se poursuit au verset suivant; la phrase reste donc volontairement inachevée.
theological_decisions: []
translation_notes:
  register: 'Français moderne, sobre et visionnaire. « Et je regardai : voici que » conserve la cadence de la formule latine de vision sans devenir archaïque. La fin suspendue après « car » respecte la coupure du texte source et son enchaînement avec le verset suivant.'
