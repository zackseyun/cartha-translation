source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ungues tui pessimi et omne corpus tuum uanum, Vti refrigeret omnis terra et releuetur liberata de tua ui et speret iudicium et misericordiam eius qui fecit eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/046.yaml
  text: and your wicked claws and your whole worthless body[a], so that the whole earth may be refreshed and relieved, freed from your violence, and may hope for the judgment and mercy of him who made it.”
translation:
  language: fr
  text: tes griffes si cruelles et tout ton corps sans valeur, afin que la terre entière soit rafraîchie et soulagée, délivrée de ta violence, et qu’elle espère le jugement et la miséricorde de celui qui l’a faite.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ungues tui pessimi
  choice: tes griffes si cruelles
  rationale: «Griffes» rend directement ungues dans l’image de l’aigle; «si cruelles» exprime ici la valeur fortement négative du superlatif pessimi avec un français naturel.
- source_word: omne corpus tuum uanum
  choice: tout ton corps sans valeur
  rationale: Vanum peut évoquer ce qui est vain, inconsistant ou sans valeur. «Sans valeur» conserve le jugement dépréciatif sans introduire l’idée plus précise de corruption.
- source_word: refrigeret
  choice: retrouve la fraîcheur
  rationale: Le verbe latin signifie littéralement «se rafraîchir» et, dans ce contexte, évoque le répit après l’oppression. Cette formulation préserve l’image plutôt que de la réduire à «se reposer».
- source_word: releuetur
  choice: soit soulagée
  rationale: Rend l’idée d’allègement et de relèvement après un fardeau.
- source_word: liberata de tua ui
  choice: délivrée de ta violence
  rationale: Libérata exprime l’affranchissement, tandis que vis désigne ici la force oppressive ou la violence.
- source_word: speret iudicium et misericordiam
  choice: qu’elle espère le jugement et la miséricorde
  rationale: Conserve la coordination théologiquement tendue du jugement et de la miséricorde, tous deux objets de l’espérance.
- source_word: eius qui fecit eam
  choice: de celui qui l’a faite
  rationale: Le pronom eam renvoie à la terre; «faite» est une traduction simple et directe de fecit.
theological_decisions:
- issue: Le jugement et la miséricorde comme double objet de l’espérance
  choice: espère le jugement et la miséricorde
  alternative: attende le jugement miséricordieux
  rationale: Le latin coordonne explicitement iudicium et misericordiam. Les fusionner en un «jugement miséricordieux» résoudrait indûment la tension du texte.
translation_notes:
  register: Français moderne, courant et digne. La phrase demeure un fragment syntaxiquement rattaché au verset précédent, conformément au découpage du texte latin; aucune note n’est nécessaire dans ce verset.
