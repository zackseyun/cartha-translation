  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: fr
  text: Douze ailes et deux petites ailes apparurent. Il ne resta sur le corps de l’aigle que les trois têtes au repos et six petites ailes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conparuerunt
  choice: disparurent
  rationale: Le contexte immédiat, notamment « rien ne resta… sauf », exige l’idée que les ailes et deux petites plumes cessent d’être présentes. Cette traduction suit donc le sens contextuel transmis par la tradition du passage, malgré la forme latine inhabituelle « conparuerunt » dans le texte fourni.
- source_word: pennae
  choice: ailes
  rationale: Dans la vision de l’aigle, le terme désigne les grandes ailes, par opposition aux « pennacula », plus petites.
- source_word: pennacula
  choice: petites plumes
  rationale: Le diminutif latin distingue ces éléments des douze grandes ailes. « Petites plumes » est naturel en français tout en conservant cette opposition.
- source_word: quiescentia
  choice: au repos
  rationale: Rend l’état des trois têtes sans préciser davantage si elles dorment, restent inactives ou attendent.
- source_word: superauit
  choice: resta
  rationale: Dans cette construction, le verbe exprime ce qui subsiste sur le corps de l’aigle.
