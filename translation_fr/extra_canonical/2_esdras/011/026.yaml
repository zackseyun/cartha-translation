  yaml_path: translation/extra_canonical/2_esdras/011/026.yaml
  text: And I looked, and behold, one rose up, but immediately disappeared; then the second, and this one also
translation:
  language: fr
  text: 'Ils projetaient de se dresser et d’exercer le pouvoir souverain. Puis je regardai : voici que l’une se dressa, mais elle disparut aussitôt ; puis la deuxième, et elle aussi…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin conservé s’interrompt ici au milieu de la phrase.
    reason: Signaler honnêtement la lacune matérielle et empêcher que les points de suspension soient pris pour un simple effet de style.
lexical_decisions:
- source_word: cogitabant se erigere
  choice: Ils projetaient de se dresser
  rationale: « Projeter de » rend l’intention exprimée par cogitabant avec l’infinitif, tandis que « se dresser » conserve l’image répétée par erecta est.
- source_word: tenere principatus
  choice: exercer le pouvoir souverain
  rationale: Cette formulation naturelle conserve l’idée de détenir et d’exercer l’autorité suprême, sans imposer le terme plus institutionnel « principauté ».
- source_word: Et uidi et ecce
  choice: 'Puis je regardai : voici que'
  rationale: Rend la formule visionnaire latine avec solennité tout en restant naturelle en français moderne.
- source_word: una erecta est
  choice: l’une se dressa
  rationale: Le féminin respecte una, qui renvoie vraisemblablement à une aile dans le contexte, et maintient le lien lexical avec se erigere.
- source_word: non conparuit
  choice: elle disparut
  rationale: Dans ce contexte narratif, non comparuit indique qu’elle cessa d’être visible; « disparut » est clair et idiomatique.
- source_word: Et secunda, et haec
  choice: puis la deuxième, et elle aussi…
  rationale: Reproduit sans le compléter le membre de phrase interrompu dans le témoin latin conservé.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « se dresser » préserve la cohésion imagée du latin. Le début de la phrase transmis par la source a été conservé, même si la consultation anglaise commence seulement à « Puis je regardai ».
