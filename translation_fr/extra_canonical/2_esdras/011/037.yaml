  yaml_path: translation/extra_canonical/2_esdras/011/037.yaml
  text: 'roaring; and I heard how it sent out a human voice to the eagle and said[a], saying: “Hear, and I will speak to you; the Most High says to you:'
translation:
  language: fr
  text: 'rugissant ; et j’entendis comment il fit entendre une voix humaine à l’aigle et dit en ces termes : « Écoute, et je te parlerai. Le Très-Haut te dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mugiens
  choice: rugissant
  rationale: Participe ouvrant le verset et poursuivant la phrase précédente ; « rugissant » convient à la figure du lion mentionnée dans le contexte.
- source_word: emisit uocem hominis
  choice: il fit entendre une voix humaine
  rationale: Rend naturellement l’émission de la voix tout en conservant l’idée explicite d’une voix d’être humain.
- source_word: aquilam
  choice: l’aigle
  rationale: Équivalent direct de l’accusatif latin, complément auquel la voix s’adresse.
- source_word: Audi
  choice: Écoute
  rationale: Impératif singulier direct, conforme à l’adresse faite à l’aigle.
- source_word: altissimus
  choice: le Très-Haut
  rationale: Titre divin français consacré et lexicalement fidèle.
theological_decisions:
- issue: Identité du sujet de « emisit » et « dixit »
  choice: Maintien du pronom « il » renvoyant à l’être semblable à un lion du contexte précédent
  alternative: Répéter « le lion » ou reformuler avec un sujet indéfini
  rationale: Le latin conserve un sujet implicite déterminé par le contexte ; la traduction évite d’ajouter une identification plus explicite que la source.
- issue: Formule « dicit altissimus tibi »
  choice: « Le Très-Haut te dit »
  alternative: « Ainsi te parle le Très-Haut »
  rationale: La formulation retenue suit directement la syntaxe et ne transforme pas la formule en oracle plus solennel qu’elle ne l’est explicitement.
translation_notes:
  register: Français moderne, digne et lisible. Le point-virgule initial respecte le fait que le verset commence au milieu d’une phrase. « dit en ces termes » rend le pléonasme sémitisant dixit dicens sans produire l’expression française maladroite « dit, disant ».
