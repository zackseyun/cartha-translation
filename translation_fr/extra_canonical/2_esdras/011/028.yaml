  text: superauerunt apud semetipsas cogitabant et ipsae regnare ; Et in eo cum cogitarent, ecce unum de quiescentium capitum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/028.yaml
  text: those that remained were planning among themselves to reign as well; and while they were planning this[a], behold, one of the resting heads,
translation:
  language: fr
  text: Celles qui restaient projetaient entre elles de régner, elles aussi. Pendant qu’elles formaient ce projet, voici que l’une des têtes au repos[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase se poursuit au verset suivant.
    reason: La source latine termine ce verset au milieu de la phrase; la note signale cette limite textuelle sans importer dans le verset 28 le contenu du verset 29.
lexical_decisions:
- source_word: superauerunt
  choice: Celles qui restaient
  rationale: Dans ce contexte, le verbe désigne les têtes demeurées après les événements précédents; l’ajout de « celles qui » fournit en français un sujet naturel sans élargir le sens.
- source_word: apud semetipsas cogitabant
  choice: projetaient entre elles
  rationale: Rend la délibération interne et commune exprimée par « apud semetipsas », avec un français courant.
- source_word: et ipsae regnare
  choice: de régner, elles aussi
  rationale: « elles aussi » conserve la valeur emphatique de « ipsae » et la continuité avec d’autres puissances ayant régné.
- source_word: quiescentium capitum
  choice: des têtes au repos
  rationale: Traduction concrète qui préserve l’image visionnaire et n’anticipe pas le réveil rapporté au verset suivant.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la coupure abrupte du verset latin ainsi que le féminin, puisque le contexte désigne les têtes. Les points de suspension indiquent que la phrase reste syntaxiquement inachevée.
