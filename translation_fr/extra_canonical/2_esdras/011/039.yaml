  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
translation:
  language: fr
  text: N’es-tu pas celui qui reste des quatre bêtes que j’avais fait régner à mon époque[a], afin que, par elles, vienne la fin des temps ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui as survécu parmi les quatre bêtes que j’avais fait régner » ; le sens est que cette bête est la dernière qui subsiste parmi les quatre.'
    reason: Conserve l’autre formulation attestée par la tradition de révision tout en maintenant « fait régner », élément du texte source, et en explicitant son sens partitif.
lexical_decisions:
- source_word: regnare
  choice: régner
  rationale: L’infinitif français correspond directement au latin et conserve l’image politique du règne.
- source_word: in saeculo meo
  choice: à mon époque
  rationale: Dans ce contexte temporel, « saeculum » désigne une époque ou un âge. « À mon époque » est naturel en français moderne sans imposer le sens spatial de « monde ».
- source_word: per ea
  choice: par elles
  rationale: Le pronom neutre pluriel latin renvoie aux quatre bêtes (« animalia »); le féminin français s’accorde donc avec « bêtes » et conserve l’idée qu’elles servent d’intermédiaires.
- source_word: finis temporum
  choice: la fin des temps
  rationale: Cette expression française courante rend fidèlement le génitif pluriel latin « temporum », sans ajouter le possessif « mes », absent du fragment latin fourni.
theological_decisions:
- issue: Rapport entre le règne des quatre bêtes et la fin des temps
  choice: afin que, par elles, vienne la fin des temps
  alternative: de sorte que, par elles, la fin des temps arriverait
  rationale: « Afin que » conserve la valeur finale possible de « ut » et présente la venue de la fin comme entrant dans le dessein du locuteur, sans préciser davantage la causalité théologique.
- issue: Sens temporel de « saeculum »
  choice: mon époque
  alternative: mon âge
  rationale: « Mon époque » exprime clairement une période déterminée et évite que « mon âge » soit compris comme l’âge personnel du locuteur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe interrogative et le subjonctif « vienne » préservent la solennité du passage. Le plus-que-parfait « j’avais fait régner » marque l’antériorité, et « fait » reste invariable devant l’infinitif.
