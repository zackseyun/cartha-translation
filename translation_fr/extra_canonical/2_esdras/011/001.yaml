  text: And it happened on the second night that I saw a dream, and behold, an eagle was coming up from the sea, and it had twelve feathered wings and three heads.
translation:
  language: fr
  text: 'Or, la deuxième nuit, je vis un rêve : voici qu’un aigle s’élevait de la mer; il avait douze ailes couvertes de plumes et trois têtes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est secunda nocte
  choice: La deuxième nuit
  rationale: La formule événementielle latine est rendue naturellement en français sans perdre le repère temporel.
- source_word: uidi somnium
  choice: je fis un rêve
  rationale: Expression idiomatique française correspondant au sens de « je vis un rêve ».
- source_word: ecce
  choice: voici que
  rationale: Conserve l’effet de vision soudaine et attire l’attention sur l’apparition.
- source_word: ascendebat de mari
  choice: montait de la mer
  rationale: L’imparfait restitue l’aspect progressif de la vision, tandis que « de la mer » reste proche du latin.
- source_word: aquila
  choice: un aigle
  rationale: Équivalent direct, avec l’article indéfini adapté à la première apparition de l’animal.
- source_word: duodecim alae pennarum
  choice: douze ailes couvertes de plumes
  rationale: Rend explicitement la construction inhabituelle « ailes de plumes » sans la réduire simplement à « ailes ».
- source_word: capita tria
  choice: trois têtes
  rationale: Équivalent direct et naturel.
