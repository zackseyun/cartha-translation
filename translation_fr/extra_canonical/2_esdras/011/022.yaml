  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tenebant principatum
  choice: conservaient le pouvoir
  rationale: « Tenere » exprime ici le maintien ou la conservation, tandis que « principatus » désigne l’autorité souveraine ou le pouvoir exercé. Cette formulation reste naturelle en français sans préciser davantage la nature de ce pouvoir.
- source_word: Et uidi post haec
  choice: Après cela, je regardai
  rationale: Dans un récit de vision, « vidi » peut naturellement se rendre par « je regardai »; l’antéposition de « Après cela » donne un enchaînement idiomatique.
- source_word: ecce
  choice: et voici
  rationale: Conserve le marqueur visionnaire qui attire l’attention sur ce qui apparaît ensuite.
- source_word: non
  choice: ne…
  rationale: Le verset transmis s’interrompt immédiatement après la négation latine. La négation française amorcée avec des points de suspension reproduit cette suspension sans inventer le complément situé dans le verset suivant.
