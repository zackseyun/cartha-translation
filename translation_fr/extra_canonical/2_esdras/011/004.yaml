  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
translation:
  language: fr
  text: Car ses têtes étaient au repos, et la tête du milieu était plus grande que les autres têtes ; pourtant, elle aussi était au repos avec elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  choice: Car
  rationale: La conjonction introduit une explication de ce qui précède, plutôt qu’une opposition.
- source_word: quiescentia / quiescebat
  choice: étaient au repos / était au repos
  rationale: Cette formulation conserve la répétition du latin et exprime naturellement l’état d’inactivité des têtes.
- source_word: medium caput
  choice: la tête du milieu
  rationale: Rend directement la position centrale indiquée par le latin, sans préciser davantage sa fonction.
- source_word: maius
  choice: plus grande
  rationale: Comparatif direct de taille, en accord avec « tête ».
- source_word: sed et ipsa
  choice: pourtant, elle aussi
  rationale: Rend à la fois le contraste porté par « sed » et l’inclusion emphatique portée par « et ipsa ».
