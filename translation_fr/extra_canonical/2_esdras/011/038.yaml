  text: Are you not the one who prevailed over the four beasts that I had made[a]
translation:
  language: fr
  text: N’es-tu pas celui qui a survécu parmi les quatre bêtes que j’avais faites[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un autre sens possible du verbe latin : « qui l’a emporté sur les quatre bêtes que j’avais faites ».'
    reason: Le verbe « superare » peut exprimer soit le fait de survivre ou de subsister, soit celui de vaincre. La construction avec « de » favorise ici le premier sens, sans rendre l’autre absolument impossible.
lexical_decisions:
- source_word: superasti de
  choice: a survécu parmi
  rationale: Avec « de quattuor animalibus », le verbe latin « superasti » désigne vraisemblablement celui qui a subsisté ou survécu parmi les quatre, plutôt qu’une victoire remportée sur elles.
- source_word: animalibus
  choice: bêtes
  rationale: Dans ce contexte visionnaire et en référence aux quatre figures symboliques, « bêtes » est le terme français naturel et traditionnel, sans exclure le sens plus général d’« êtres vivants ».
- source_word: feceram
  choice: j’avais faites
  rationale: Le plus-que-parfait rend directement l’antériorité du latin ; l’accord au féminin pluriel suit « bêtes ».
theological_decisions:
- issue: Rapport entre le personnage interpellé et les quatre bêtes
  choice: Il est présenté comme ayant survécu parmi elles.
  alternative: Il aurait triomphé des quatre bêtes.
  rationale: La construction « superasti de quattuor animalibus » favorise l’idée d’un survivant issu du groupe. Traduire par une victoire « sur » les quatre introduirait un rapport d’opposition que le latin n’exprime pas clairement.
translation_notes:
  register: Français moderne, direct et digne. La question rhétorique et le plus-que-parfait du latin sont conservés ; « bêtes » maintient le registre des visions apocalyptiques.
