- source_word: uolauit in pennis suis
  choice: vola de ses propres ailes
  rationale: Rend explicitement la valeur possessive de « suis » et conserve l’expression concrète du vol au moyen des ailes.
- source_word: ut regnaret
  choice: afin de régner
  rationale: Conserve la valeur finale de « ut » et le sens politique de « regnare ».
- source_word: super terram et super eos qui habitant in ea
  choice: sur la terre et sur ceux qui l’habitent
  rationale: Maintient la répétition conceptuelle de la domination exercée à la fois sur la terre et sur ses habitants, tout en évitant une lourde répétition pronominale en français.
