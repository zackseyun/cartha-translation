  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
translation:
  language: fr
  text: Et le quatrième qui vint vainquit toutes les bêtes qui l’avaient précédé[a]. Par sa puissance, il maintint l’ère dans une grande terreur, et le monde entier sous un accablement très pénible[b] ; il demeura si longtemps dans le monde, par la tromperie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte latin de ce verset est difficile et paraît altéré, surtout dans la dernière proposition, qui est lacunaire. La traduction suit le sens apparent : le quatrième surpassa les bêtes précédentes et domina l’ère et le monde par la terreur, l’accablement et la tromperie.'
    reason: textual_variant
  - marker: b
    text: 'Autre traduction possible : « il maintint l’ère, par sa puissance, dans une grande terreur, et le monde entier dans un accablement très pénible ».'
    reason: previous_rendering
lexical_decisions:
- source_word: quartus ueniens
  choice: la quatrième, à son arrivée
  rationale: Le féminin explicite naturellement qu’il s’agit de la quatrième bête, tandis que « à son arrivée » rend la valeur circonstancielle du participe latin.
- source_word: deuicit omnia animalia quae transierunt
  choice: vainquit toutes les bêtes qui l’avaient précédée
  rationale: « Vainquit » rend devicit sans surinterpréter ; « qui l’avaient précédée » exprime naturellement le sens contextuel de quae transierunt.
- source_word: potentatu tenens saeculum
  choice: Par sa puissance, elle maintint l’ère
  rationale: La formulation conserve explicitement potentatu, instrumental, et rend saeculum par « l’ère », terme adapté à cette vision des empires et des âges.
- source_word: cum tremore multo
  choice: dans une grande terreur
  rationale: Dans ce contexte de domination coercitive, tremor désigne l’effroi imposé plutôt qu’un simple tremblement physique.
- source_word: cum labore pessimo
  choice: sous une oppression extrêmement dure
  rationale: Labor peut évoquer peine, détresse ou souffrance ; « oppression » traduit ici l’effet accablant de la domination, tandis que « extrêmement dure » rend le superlatif pessimo.
- source_word: et †inhabitabant† tot
  choice: elle habita si longtemps le monde dans la tromperie
  rationale: Le latin transmis est corrompu et incomplet à cet endroit. La formulation suit le sens apparent conservé par la couche de consultation anglaise sans présenter la syntaxe latine comme certaine.
theological_decisions:
- issue: Identification de la quatrième bête
  choice: Ne pas nommer l’empire représenté
  alternative: Identifier explicitement la bête à Rome ou à un autre empire
  rationale: Le verset parle seulement de la quatrième bête ; une identification historique explicite dépasserait le texte donné.
- issue: Portée de saeculum
  choice: « l’ère »
  alternative: « le siècle » ou « le monde »
  rationale: « L’ère » préserve la dimension temporelle de saeculum et évite de le confondre avec omnem orbem, « le monde entier », dans le membre parallèle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le mouvement solennel de la vision, rend explicitement la mention de la puissance et signale en note les difficultés réelles du latin transmis.
