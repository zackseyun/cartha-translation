revisions:
- from: Et la quatrième, à son arrivée, vainquit toutes les bêtes qui l’avaient précédée[a]. Par sa puissance, elle maintint l’ère dans une grande terreur, et le monde entier sous une oppression extrêmement dure[b] ; elle habita si longtemps le monde dans la tromperie.
  to: Et le quatrième qui vint vainquit toutes les bêtes qui l’avaient précédé[a]. Par sa puissance, il maintint l’ère dans une grande terreur, et le monde entier sous un accablement très pénible[b] ; il demeura si longtemps dans le monde, par la tromperie[a].
  rationale: La révision conserve le sens suivi par la traduction anglaise tout en retirant l’ajout non assuré de « bête » et son genre féminin. Elle rend potentatu explicitement, maintient la distinction temporelle et spatiale entre saeculum et orbem, et formule la fin conjecturale de façon plus naturelle. La note textuelle est élargie afin de signaler précisément l’incertitude de la dernière proposition.
