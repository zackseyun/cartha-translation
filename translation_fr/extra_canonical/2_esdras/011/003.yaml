source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et de pennis eius nascebantur contrariae pennae, et ipsae fiebant in pennaculis minutis et modicis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/003.yaml
  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
translation:
  language: fr
  text: 'Je regardai : de ses ailes[a] naissaient des ailes opposées, et celles-ci devenaient de petites ailettes, menues et modestes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ses plumes ». Le même mot latin peut désigner les ailes ou les plumes.'
    reason: Le latin penna possède les deux sens ; le contexte de la vision de l’aigle et la cohérence des deux occurrences dans le verset favorisent « ailes ».
lexical_decisions:
- source_word: pennis … pennae
  choice: ailes … ailes
  rationale: Les deux formes viennent du même nom latin, penna. Dans le contexte de la vision de l’aigle et par cohérence avec les versets voisins, « ailes » convient mieux que l’alternance « plumes … ailes ».
- source_word: contrariae
  choice: opposées
  rationale: Rend directement l’idée de position ou d’orientation contraire sans imposer le sens plus nettement hostile de « rivales » ou « adverses ».
- source_word: pennaculis minutis et modicis
  choice: petites ailettes, menues et peu développées
  rationale: « Ailettes » restitue le diminutif pennaculis; « menues et peu développées » exprime les deux qualificatifs latins tout en évitant une répétition française trop lourde de « petites ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le tour « Je regardai » conserve la formule visionnaire, tandis que « naissaient » maintient l’étrangeté de l’image sans l’expliquer.
