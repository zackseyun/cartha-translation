lexical_decisions:
- source_word: tenebit tempus tuum
  choice: ne durera aussi longtemps que toi
  rationale: Dans le contexte, l’expression concerne la durée du pouvoir. Cette formulation française naturelle restitue le sens de « tenir ton temps » tout en maintenant la dépendance syntaxique envers la négation commencée dans le verset précédent.
- source_word: sed nec dimidium eius
  choice: mais pas même la moitié de ce temps
  rationale: Rend explicitement sed et nec, tandis que « ce temps » reprend sans ambiguïté la durée qui vient d’être mentionnée.
- source_word: leuauit se tertia
  choice: la troisième s’éleva
  rationale: Traduction directe qui conserve l’image et l’ordre du latin.
- source_word: tenuit principatum
  choice: exerça le pouvoir
  rationale: Formulation idiomatique pour l’exercice de l’autorité souveraine, sans préciser indûment la nature du régime.
- source_word: sicut et priores
  choice: comme les précédentes
  rationale: Le féminin correspond à tertia et aux entités féminines évoquées dans le passage.
- source_word: non apparuit
  choice: elle disparut
  rationale: Dans cette succession narrative, le latin signifie qu’elle cessa d’être visible ; « disparut » est plus naturel que « ne parut pas ».
theological_decisions:
- issue: Nature du pouvoir exercé
  choice: exerça le pouvoir
  alternative: régna
  rationale: Le choix retenu préserve la portée assez large de principatum et n’impose pas une identification royale particulière.
