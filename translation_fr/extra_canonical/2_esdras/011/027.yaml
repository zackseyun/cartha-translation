lexical_decisions:
- source_word: non conparuit
  choice: disparut
  rationale: Dans ce contexte visionnaire, l’expression signifie que la deuxième ne fut plus visible. « Disparut » rend naturellement le résultat sans introduire la contradiction apparente « ne parut pas, mais disparut ».
- source_word: uelocius quam prior
  choice: plus vite que la première
  rationale: Rend directement le comparatif latin et conserve la comparaison avec la première.
- source_word: Et uidi et ecce
  choice: Je regardai, et voici
  rationale: Formulation française naturelle qui conserve la reprise narrative et la force présentative de la tournure visionnaire latine.
- source_word: duae quae
  choice: deux ailes qui
  rationale: Le féminin pluriel renvoie aux ailes mentionnées dans le contexte. La reprise explicite du nom est nécessaire en français pour éviter une formulation tronquée ou obscure.
