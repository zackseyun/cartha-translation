source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce expandebat alas suas in omnem terram, et omnes uenti caeli insufflabant ad eam et [nubes ad eam] colligebantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
translation:
  language: fr
  text: 'Je regardai, et voici : elle déployait ses ailes sur toute la terre, tous les vents du ciel soufflaient vers elle[b], et les nuages se rassemblaient vers elle[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots traduits par « les nuages se rassemblaient vers elle » sont signalés comme textuellement incertains dans le texte latin établi.
    reason: textual_variant
  - marker: b
    text: Ou « soufflaient sur elle ».
    reason: translation_ambiguity
lexical_decisions:
- source_word: expandebat alas suas in omnem terram
  choice: elle déployait ses ailes sur toute la terre
  rationale: L’imparfait rend l’action en cours de la vision, tandis que « sur toute la terre » exprime naturellement l’étendue indiquée par in omnem terram.
- source_word: insufflabant ad eam
  choice: soufflaient vers elle
  rationale: « Vers elle » conserve la direction exprimée par ad avec l’accusatif, sans réduire le mouvement à un souffle simplement posé sur l’aigle.
- source_word: nubes ad eam colligebantur
  choice: les nuages venaient se rassembler auprès d’elle
  rationale: Cette formulation française naturelle associe le mouvement vers l’aigle, porté par ad eam, au rassemblement exprimé par colligebantur.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Je regardai, et voici » conserve la formule visionnaire latine sans lourdeur excessive. Le référent féminin est maintenu conformément à aquila, l’aigle, nom féminin en latin comme en français.
