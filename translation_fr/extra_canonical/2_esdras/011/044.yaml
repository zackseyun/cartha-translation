base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: fr
  text: 'Et le Très-Haut a porté son regard sur ses temps : voici, ils ont pris fin, et ses âges sont accomplis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respexit ... super
  choice: a porté son regard sur
  rationale: Rend naturellement le mouvement d’attention exprimé par le latin tout en conservant l’image du regard.
- source_word: tempora
  choice: temps
  rationale: Conserve le terme général du latin et son possible sens de périodes assignées, sans préciser davantage que la source.
- source_word: saecula
  choice: ères
  rationale: Distingue saecula de tempora et exprime des périodes étendues ou des âges successifs.
- source_word: finita sunt
  choice: ont pris fin
  rationale: Formulation française actuelle qui respecte l’accompli du latin.
- source_word: conpleta sunt
  choice: sont accomplies
  rationale: Préserve l’idée d’une mesure ou d’un cours arrivé à son plein achèvement.
theological_decisions:
- issue: Référent des possessifs sua et eius
  choice: ses ... ses
  alternative: les temps qui étaient les siens ... les ères de celui-ci
  rationale: Le français laisse le référent des possessifs dépendre du contexte, comme le texte reçu dans sa lecture courante, sans imposer une identification théologique ou narrative dans le verset isolé.
translation_notes:
  register: Style narratif et prophétique, digne mais accessible. La tournure « voici » conserve le signal discursif ecce, et le parallélisme entre les deux propositions finales est maintenu.
