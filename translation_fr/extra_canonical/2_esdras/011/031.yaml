lexical_decisions:
- source_word: comedit
  choice: elle dévora
  rationale: Le verbe latin exprime une action violente de consommation; « dévora » convient à l'imagerie de l'aigle et conserve sa force.
- source_word: duas subalares
  choice: les deux sous-ailes
  rationale: « Sous-ailes » rend directement le terme technique et imagé subalares, tout en maintenant le lien avec la terminologie de la vision.
- source_word: quae cogitabant regnare
  choice: qui projetaient de régner
  rationale: « Projetaient » restitue l'idée d'une intention délibérée sans suggérer qu'elles avaient déjà commencé à régner.
- source_word: Hoc autem
  choice: Après cela,
  rationale: Le fragment latin se poursuit au verset suivant; dans ce contexte narratif, la formule sert de transition. La virgule signale que la phrase continue.
