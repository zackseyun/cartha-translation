  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
translation:
  language: fr
  text: 'Et je regardai : voici qu’au moment venu, les ailes[a] suivantes s’élevaient elles aussi du côté droit pour exercer le pouvoir ; parmi elles, il y en eut qui l’exercèrent, mais…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plumes ».
    reason: Le latin pennae peut désigner des plumes ou, collectivement et selon le contexte, des ailes.
lexical_decisions:
- source_word: Et uidi et ecce
  choice: 'Puis je regardai : voici'
  rationale: Rend la formule visionnaire latine de manière naturelle et digne, sans affaiblir l’introduction de ce que voit le narrateur.
- source_word: in tempore
  choice: au moment venu
  rationale: Exprime l’idée d’un moment approprié ou déterminé tout en conservant la relative indétermination du latin.
- source_word: pennae
  choice: ailes
  rationale: Dans le contexte de la vision de l’aigle, « ailes » est plus immédiatement compréhensible; le sens littéral possible « plumes » est signalé en note.
- source_word: erigebantur
  choice: se dressèrent
  rationale: Le passé simple convient à la succession narrative et rend le mouvement d’élévation sans lourdeur.
- source_word: et ipsae
  choice: elles aussi
  rationale: 'Préserve la nuance inclusive et emphatique du latin: ces ailes suivent elles aussi le même mouvement que les précédentes.'
- source_word: ut tenerent principatum
  choice: pour prendre le pouvoir
  rationale: Rend l’entrée en exercice de l’autorité suggérée par le contexte; « pouvoir » est naturel et suffisamment large pour principatus.
- source_word: ex his erant quae tenebant
  choice: Certaines d’entre elles l’exercèrent
  rationale: Le pronom renvoie au pouvoir; « exercer » évite en français la répétition peu idiomatique de « prendre/tenir » tout en préservant l’idée que certaines gouvernèrent effectivement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase demeure inachevée avec « mais… », conformément au découpage du verset et au latin transmis.
