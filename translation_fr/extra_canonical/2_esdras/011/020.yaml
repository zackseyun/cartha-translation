review_pass:
  verdict: revise
  source_fidelity: 'La nuance inclusive de et ipsae est bien rendue par « elles aussi », et pennae est correctement rendu par « ailes » dans le cadre de la vision. Toutefois, erigebantur est à l’imparfait : « se dressèrent » le présente comme un événement ponctuel achevé, alors que le texte décrit les ailes comme s’élevant. Ut tenerent principatum vise le fait de détenir/exercer l’autorité, plutôt que l’acquisition du pouvoir.'
  naturalness: Le français est globalement naturel et le maintien de l’interruption finale est approprié. « S’élevaient » restitue plus idiomatiquement et plus exactement l’aspect verbal. « Parmi elles, il y en eut qui l’exercèrent » rend clairement la reprise de principatum sans alourdir la phrase.
  terminology: « Ailes » convient dans ce contexte; la note signalant le sens littéral possible « plumes » est utile. « Exercer le pouvoir » est un équivalent moderne et suffisamment large de principatum/tenere.
  issues:
  - severity: medium
    issue: Aspect de erigebantur
    rationale: L’imparfait passif latin exprime une action en cours (« s’élevaient » / « étaient en train de se lever »). Le passé simple « se dressèrent » efface cet aspect.
  - severity: low
    issue: « prendre le pouvoir » pour ut tenerent principatum
    rationale: Tenere principatum signifie tenir, détenir ou exercer l’autorité; « prendre » introduit plus explicitement l’idée de conquête ou d’accession.
