  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
translation:
  language: fr
  text: C’est pourquoi, puisses-tu ne plus jamais paraître — toi, aigle, et tes ailes terrifiantes, tes rémiges abominables, tes têtes malfaisantes et…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propterea
  choice: C’est pourquoi
  rationale: Rend naturellement la conséquence exprimée par le latin.
- source_word: non apparens non appareas
  choice: puisses-tu ne plus jamais paraître
  rationale: Rend comme un souhait imprécatoire emphatique la construction redoublée, probablement sémitisante, sans en faire artificiellement une proposition de but.
- source_word: aquila
  choice: l’aigle
  rationale: Équivalent français direct, avec conservation de l’interpellation.
- source_word: alae tuae horribiles
  choice: tes ailes terrifiantes
  rationale: « Terrifiantes » exprime ici l’effet redoutable de horribiles dans un français actuel.
- source_word: pennacula tua pessima
  choice: tes rémiges abominables
  rationale: « Rémiges » désigne précisément les grandes plumes servant au vol; « abominables » rend le superlatif fortement dépréciatif pessima sans ajouter un diminutif absent du sens contextuel.
- source_word: capita tua maligna
  choice: tes têtes malfaisantes
  rationale: « Malfaisantes » conserve la portée morale et active de maligna.
theological_decisions:
- issue: Valeur de la formule redoublée « non apparens non appareas »
  choice: 'Souhait imprécatoire emphatique : « puisses-tu ne plus jamais paraître »'
  alternative: « disparais complètement »
  rationale: Le subjonctif appareas se prête à un souhait ou une imprécation; la répétition renforce la disparition définitive sans imposer un impératif direct.
- issue: Fin du verset dans la source fournie
  choice: Conserver l’interruption par des points de suspension
  alternative: Compléter d’après l’anglais avec les griffes et tout le corps
  rationale: Le texte latin fourni s’arrête sur « et ». Ajouter les éléments de l’anglais dépasserait l’attestation de la source originale communiquée.
translation_notes:
  register: Français international moderne, soutenu mais lisible. La phrase demeure volontairement suspendue, puisque l’extrait latin transmis est incomplet et se termine par la conjonction « et ».
