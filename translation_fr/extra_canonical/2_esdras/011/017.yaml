  text: hoc annuntio antequam incipias non parere. Nemo post te
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: fr
  text: '« Je te l’annonce avant que tu commences à disparaître : après toi, personne ne le détiendra aussi longtemps, pas même pendant la moitié de ce temps. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: annuntio
  choice: j’annonce
  rationale: Rend directement l’idée de faire connaître solennellement un fait à venir.
- source_word: non parere
  choice: disparaître
  rationale: L’expression signifie littéralement cesser de paraître ou de se montrer ; « disparaître » est naturel en français et conserve cette image.
- source_word: Nemo post te
  choice: après toi, personne
  rationale: Respecte l’ordre logique et l’accent du latin sur la succession.
- source_word: '[tantum tempus tenebit]'
  choice: ne le détiendra aussi longtemps
  rationale: La suite, attestée par la couche anglaise auditée mais absente de l’extrait latin fourni, exprime la durée pendant laquelle le successeur détiendra ce qui est en jeu ; le pronom « le » préserve l’implicite du contexte.
theological_decisions:
- issue: Référent de « le » dans la durée de possession
  choice: Conserver un pronom sans préciser le pouvoir, le royaume ou la domination
  alternative: 'Expliciter : « personne n’exercera le pouvoir aussi longtemps »'
  rationale: Le passage fourni ne nomme pas explicitement l’objet détenu ; l’expliciter résoudrait une ambiguïté contextuelle que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et prophétique. La formulation garde l’adresse directe et la tension de l’annonce. L’extrait latin transmis s’interrompt après « Nemo post te » ; la fin de la phrase suit la couche anglaise auditée, qui paraît refléter la continuation textuelle non incluse dans le champ source.
