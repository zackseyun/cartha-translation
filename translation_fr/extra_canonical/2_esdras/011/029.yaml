translation:
  language: fr
  text: La tête qui était au milieu se réveilla, car elle était plus grande que les deux autres têtes. Et je vis comment elle attira les deux têtes à elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod erat medium
  choice: Celui qui était au milieu
  rationale: Rend naturellement en français la relative substantivée latine et conserve la référence à la tête placée au milieu.
- source_word: euigilabat
  choice: se réveilla
  rationale: Le contexte narratif appelle un passé simple; le verbe latin exprime l'éveil ou la sortie du sommeil.
- source_word: maius
  choice: plus grand
  rationale: Conserve le comparatif neutre dans son sens de taille ou de grandeur, sans lui imposer le sens de supériorité hiérarchique.
- source_word: conplexa est ... secum
  choice: attira à lui
  rationale: Exprime le mouvement de rassemblement vers la tête centrale; le latin complector peut aussi évoquer le fait d'étreindre ou de réunir.
