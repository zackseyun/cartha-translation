id: 2ES.11.6
reference: 2 Esdras 11:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi quomodo subiecti erant ei omnia sub caelo, et nemo illi contradicebat neque unus de creatura, quae est super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/006.yaml
  text: And I saw how everything under heaven was subjected to it[a], and no one contradicted it, not even one creature that is upon the earth.
translation:
  language: fr
  text: Et je vis que tout ce qui est sous le ciel lui était soumis. Personne ne s’opposait à lui[a], pas même une seule créature sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne le contredisait ».'
    reason: Préserve la valeur plus littérale de contradicebat, dont le sens peut aller de la contradiction verbale à l’opposition.
lexical_decisions:
- source_word: subiecti erant ei
  choice: lui était soumis
  rationale: Rend directement l’idée de sujétion ou de domination exprimée par le latin, tout en accordant le verbe avec le collectif français « tout ce qui ».
- source_word: nemo illi contradicebat
  choice: personne ne s’opposait à lui
  rationale: Dans ce contexte de domination universelle, « s’opposer » exprime mieux qu’une simple contradiction verbale l’absence de toute résistance, sans exclure la nuance littérale signalée en note.
- source_word: neque unus de creatura
  choice: pas même une seule créature
  rationale: Reproduit l’insistance du latin sur l’absence absolue d’exception dans une formulation française naturelle.
theological_decisions:
- issue: Portée de contradicebat
  choice: s’opposait à lui
  alternative: le contredisait
  rationale: Le contexte immédiat parle de soumission de tout ce qui est sous le ciel; le sens est donc probablement celui d’une opposition ou résistance à l’autorité. La traduction plus littérale demeure possible et est conservée en note.
translation_notes:
  register: Français moderne, clair et digne. Le référent est rendu par « lui », conformément au genre masculin de « l’aigle » en français. La phrase latine est divisée en deux pour assurer une lecture naturelle sans modifier sa progression.
