  text: Do not all keep watch at once; sleep, each one in his own place, and keep watch for a time.
translation:
  language: fr
  text: Ne veillez pas tous en même temps. Dormez, chacun à sa place, et veillez pendant quelque temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nolite omnes simul uigilare
  choice: Ne veillez pas tous en même temps
  rationale: Rend directement l’interdiction latine et conserve l’idée que tous ne doivent pas assurer la veille simultanément.
- source_word: unusquisque in loco suo
  choice: chacun à sa place
  rationale: Expression française naturelle qui correspond précisément à la distribution individuelle indiquée par le latin.
- source_word: per tempus uigilate
  choice: veillez pendant un temps
  rationale: Préserve le sens temporel de « per tempus » sans introduire l’idée plus précise d’un roulement, que le latin n’exprime pas explicitement.
