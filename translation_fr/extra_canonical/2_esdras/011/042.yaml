  - severity: low
    issue: « les gens paisibles » pour quiescentes
    rationale: Quiescentes évoque ceux qui sont tranquilles, au repos ou qui vivent sans agitation. La formulation révisée est plus proche du participe latin et plus idiomatique dans cette série.
