source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cum ueritate ; Tribulasti enim mansuetos et laesisti quiescentes, odisti uerum dicentes et dilexisti mendaces, et destruxisti habitationes eorum qui fructificabant, et humiliasti muros eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: fr
  text: Car tu as opprimé les doux et fait du mal à ceux qui vivaient tranquilles ; tu as détesté ceux qui disaient la vérité et aimé les menteurs ; tu as détruit les habitations de ceux qui portaient du fruit et abaissé leurs murailles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tribulasti
  choice: tu as opprimé
  rationale: Le verbe latin exprime ici l’idée d’accabler ou de faire subir la détresse ; « opprimé » est naturel et convient au contexte d’une accusation contre un pouvoir violent.
- source_word: mansuetos
  choice: les humbles
  rationale: « Humbles » conserve la qualité morale de mansueti sans limiter le sens à la seule douceur de caractère.
- source_word: laesisti
  choice: fait du mal à
  rationale: Cette formulation courante rend la portée générale de laesisti, « blesser, léser, faire du tort », sans préciser indûment la nature du préjudice.
- source_word: quiescentes
  choice: les gens paisibles
  rationale: Le participe désigne ceux qui vivent tranquilles ou sans causer de trouble ; « les gens paisibles » est clair en français moderne.
- source_word: uerum dicentes
  choice: ceux qui disaient la vérité
  rationale: Rend directement le participe latin et maintient la cohérence temporelle du reproche formulé au passé.
- source_word: mendaces
  choice: les menteurs
  rationale: Équivalent direct et naturel du substantif latin.
- source_word: fructificabant
  choice: portaient du fruit
  rationale: Conserve la métaphore du texte latin et son éventuelle portée morale ou productive sans la résoudre.
- source_word: humiliasti muros eorum
  choice: abaissé leurs murailles
  rationale: « Abaissé » restitue humiliasti de manière intelligible dans un contexte de murailles, tout en évitant d’ajouter explicitement l’idée de destruction déjà exprimée dans la proposition précédente.
theological_decisions:
- issue: Portée de « ceux qui portaient du fruit »
  choice: Conserver l’expression métaphorique « portaient du fruit »
  alternative: « étaient productifs » ou « faisaient le bien »
  rationale: Le latin fructificabant peut évoquer une fécondité concrète ou morale ; la traduction préserve cette ambiguïté plutôt que d’imposer une interprétation.
- issue: Sens de l’abaissement des murailles
  choice: « abaissé leurs murailles »
  alternative: « renversé leurs murailles »
  rationale: Le latin humiliasti signifie littéralement « tu as abaissé/humilié ». « Abaissé » garde l’image inhabituelle et la tension du texte, tandis que « renversé » préciserait davantage l’action militaire.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme accusatoire du latin est conservé au moyen de propositions coordonnées séparées par des points-virgules. Aucun marqueur de note n’est requis.
