  source_fidelity: Le sens général et le parallélisme accusatoire sont bien rendus. Toutefois, « mansuetos » désigne d’abord les doux / débonnaires plutôt que les « humbles », et « opprimé » peut être conservé pour tribulasti. « Abaissé leurs murailles » restitue de façon sobre l’image volontairement inhabituelle de humiliasti.
  naturalness: La phrase est fluide et le registre est approprié. « Ceux qui vivaient tranquilles » est plus direct et plus proche de quiescentes que « les gens paisibles », tout en restant naturel en français moderne.
