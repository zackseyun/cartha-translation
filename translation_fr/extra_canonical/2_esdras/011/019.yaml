  rationale: Conserve l’image symbolique du texte et la portée distributive de omnibus.
- source_word: singulatim
  choice: l’une après l’autre
  rationale: Exprime clairement que chaque aile accédait au pouvoir à son tour.
- source_word: principatum
  choice: elles exerçaient le pouvoir
  rationale: Dans cette proposition elliptique, rend la notion de domination ou de gouvernement sans préciser indûment la forme du pouvoir.
