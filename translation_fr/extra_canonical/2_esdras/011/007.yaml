  text: And I looked[a], and behold, the eagle rose up on its claws and uttered a voice to its wings, saying,
translation:
  language: fr
  text: 'Je regardai, et voici que l’aigle se dressa sur ses serres et fit entendre sa voix à ses ailes en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  choice: Je regardai, et voici que
  rationale: Conserve l’enchaînement visionnaire du latin et la valeur présentative de « ecce », dans un français naturel et solennel.
- source_word: surrexit aquila super ungues suos
  choice: l’aigle se dressa sur ses serres
  rationale: « Se dressa » rend le mouvement de « surrexit » ; pour un aigle, « serres » est l’équivalent français idiomatique de « ungues ».
- source_word: misit uocem
  choice: fit entendre sa voix
  rationale: Rend l’idiome latin au sens de faire entendre ou émettre sa voix, sans le littéralisme peu naturel « envoya une voix ».
- source_word: pennis suis
  choice: à ses ailes
  rationale: Le datif indique les destinataires de la parole ; « ailes » traduit directement « pennis » dans le contexte symbolique de la vision.
- source_word: dicens
  choice: en disant
  rationale: Préserve l’introduction explicite du discours qui suit.
