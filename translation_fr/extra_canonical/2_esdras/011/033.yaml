  rationale: Le latin compare la disparition de la tête à celle des ailes. La traduction retenue préserve l’ellipse et la tension narrative tout en restant compréhensible.
translation_notes:
  register: Français moderne, sobre et narratif. « Voici que » conserve la valeur de constat visuel solennel sans archaïsme excessif.
