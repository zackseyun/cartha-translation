- source_word: medium caput
  choice: la tête du milieu
  rationale: Rend directement le latin tout en désignant naturellement, dans ce contexte, la tête placée au centre.
- source_word: subito non conparuit
  choice: disparut soudain
  rationale: Littéralement « ne parut plus soudainement » ; « disparut soudain » exprime naturellement le changement constaté.
- source_word: et hoc sicut alae
  choice: comme les ailes
  rationale: 'La proposition latine est elliptique : le verbe de disparition doit être repris mentalement. La formulation française conserve cette concision sans imposer une explication supplémentaire.'
