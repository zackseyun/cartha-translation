source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: auerunt autem duo capita quae et ipsa regnauerunt super terram et super eos qui inhabitant in ea. Et uidi et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/034.yaml
  text: But two heads remained, and they too reigned over the earth and over those who dwell in it. And I saw, and behold,
translation:
  language: fr
  text: 'Mais deux têtes restèrent, qui régnèrent elles aussi sur la terre et sur ceux qui l’habitent. Et je vis, et voici :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auerunt
  choice: il resta
  rationale: Le contexte et la tradition textuelle indiquent le sens de « rester, subsister » malgré la forme latine transmise, vraisemblablement altérée.
- source_word: duo capita
  choice: deux têtes
  rationale: Rend littéralement l’image apocalyptique sans en expliciter l’interprétation.
- source_word: quae et ipsa regnauerunt
  choice: qui régnèrent elles aussi
  rationale: « Elles aussi » conserve l’insistance de « et ipsa »; le passé simple convient au registre narratif soutenu.
- source_word: super terram et super eos qui inhabitant in ea
  choice: sur la terre et sur ceux qui l’habitent
  rationale: Conserve la répétition conceptuelle et le champ de domination exprimé par « super ».
- source_word: Et uidi et ecce
  choice: 'Puis je regardai, et voici :'
  rationale: Formule française naturelle pour une transition visionnaire; « voici » garde l’effet de présentation de « ecce », et les deux-points signalent que la vision se poursuit au verset suivant.
theological_decisions:
- issue: Identification symbolique des deux têtes
  choice: Maintenir l’image sans identifier les souverains représentés
  alternative: Introduire dans le texte une identification historique précise
  rationale: Le verset lui-même ne fournit pas cette identification; la traduction ne doit pas résoudre implicitement le symbolisme.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation préserve le caractère apocalyptique et la suspension finale du texte latin.
