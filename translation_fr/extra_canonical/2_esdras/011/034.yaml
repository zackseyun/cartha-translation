  source_fidelity: 'Le sens de la première proposition est bien rendu : deux têtes demeurent et exercent elles aussi leur domination sur la terre et ses habitants. En revanche, « Puis je regardai » atténue et modifie le latin « Et uidi » (« Et je vis ») : le verbe exprime l’acte de voir dans la vision, non nécessairement celui de regarder. La reprise de « Et » est également préférable pour conserver l’enchaînement visionnaire.'
  naturalness: '« Deux têtes restèrent » est plus idiomatique et plus net que la tournure impersonnelle « il resta deux têtes ». « Et je vis, et voici : » est une formule française biblique et apocalyptique naturelle, tout en restant intelligible en français international moderne.'
