  rationale: Rend directement le nombre latin, dont le référent est fourni par le contexte antérieur.
- source_word: manserunt in loco suo
  choice: restèrent à leur place
  rationale: Traduction naturelle et fidèle; le singulier distributif latin «suo» s'exprime idiomatiquement ainsi en français.
- source_word: Et uidi et ecce
  choice: 'Puis je regardai : voici'
  rationale: Conserve la succession visionnaire et la formule de présentation «ecce», tout en évitant un calque lourd en français moderne.
- source_word: subalares
  choice: ailes inférieures
  rationale: Le terme latin désigne ici des ailes situées sous les autres; ce choix reste intelligible sans ajouter une action absente de l'extrait.
