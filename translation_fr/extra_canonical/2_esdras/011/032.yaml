  yaml_path: translation/extra_canonical/2_esdras/011/032.yaml
  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: fr
  text: 'Cette tête étendit son pouvoir sur toute la terre et domina ses habitants en les accablant durement. Elle exerça son autorité sur le monde entier plus que toutes les ailes qui l’avaient précédée. Après cela, je vis, et voici :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: caput percontinuit omnem terram
  choice: Cette tête étendit son pouvoir sur toute la terre
  rationale: « percontinuit » exprime ici l’idée d’une emprise qui s’étend sur l’ensemble de la terre; cette formulation française conserve l’image politique sans être artificiellement littérale.
- source_word: dominauit qui inhabitant in ea cum labore multo
  choice: domina ses habitants en les accablant durement
  rationale: Le latin est syntaxiquement irrégulier et « labor » peut évoquer peine, souffrance ou oppression. La traduction rend la domination pénible imposée aux habitants sans préciser indûment sa forme.
- source_word: potentatum tenuit orbis terrarum
  choice: Elle exerça son autorité sur le monde entier
  rationale: « potentatum tenere » désigne l’exercice ou la détention du pouvoir; « monde entier » rend naturellement « orbis terrarum » dans ce contexte.
- source_word: super omnes alas quae fuerunt
  choice: plus que toutes les ailes qui l’avaient précédée
  rationale: « super » marque ici la supériorité, et « quae fuerunt » renvoie aux ailes antérieures de la vision.
- source_word: Et uidi post haec et ecce
  choice: 'Après cela, je regardai, et voici :'
  rationale: Formule visionnaire conservée; les deux-points indiquent que « voici » ouvre sur la scène suivante.
theological_decisions: []
