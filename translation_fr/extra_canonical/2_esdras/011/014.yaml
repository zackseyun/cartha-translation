  rationale: Le pronom féminin renvoie à la figure féminine du contexte; le français exige ici un sujet explicite.
- source_word: multum tenuit tempus
  choice: conserva le pouvoir pendant longtemps
  rationale: L’expression latine signifie littéralement qu’elle « tint longtemps »; « conserva le pouvoir » rend naturellement l’idée de durée du règne suggérée par la suite.
- source_word: Et factum est
  choice: Et il arriva que
  rationale: Formule narrative traditionnelle, claire et digne en français moderne.
- source_word: cum regnaret
  choice: pendant qu’elle régnait
  rationale: Rend la valeur temporelle de cum avec l’imparfait du subjonctif latin, sans imposer une nuance causale.
theological_decisions:
- issue: Limite du verset et possible duplication de la première proposition
  choice: Conserver « ipsa multum tenuit tempus » conformément au texte source fourni pour ce verset.
  alternative: Commencer par « Et il arriva que, pendant qu’elle régnait, » en considérant la première proposition comme la fin du verset 13.
  rationale: Les révisions signalent un désaccord de segmentation, mais la consigne donne explicitement la proposition dans le texte latin de 11.14. La traduction suit donc les données sources présentées, sans corriger silencieusement la limite du verset.
