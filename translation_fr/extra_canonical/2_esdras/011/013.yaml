  text: Et factum est cum regnaret et uenit ei finis et non apparuit, ita ut non appareret locus eius; et sequens exsurrexit et regnauit et ipsa multum tenuit tempus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: fr
  text: Et il arriva que, pendant qu’elle régnait, sa fin vint et elle ne parut pas, de sorte que sa place ne parut pas. Puis la suivante se leva et régna, et elle se maintint longtemps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non apparuit / non appareret locus eius
  choice: elle ne parut plus / sa place ne parut plus
  rationale: Conserve la répétition frappante du verbe latin « apparere » sans transformer le second membre en une formulation interprétative comme « on ne pouvait plus voir ».
- source_word: sequens exsurrexit
  choice: la suivante se leva
  rationale: Rend directement la succession et le mouvement exprimés par le latin, tout en maintenant le référent féminin du contexte.
- source_word: ipsa multum tenuit tempus
  choice: elle se maintint longtemps
  rationale: Exprime naturellement en français l’idée qu’elle dura ou conserva sa position pendant une longue période, sans ajouter explicitement « le pouvoir », absent de cette proposition latine.
