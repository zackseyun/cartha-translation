lexical_decisions:
- source_word: statim non conparescebant
  choice: elles disparaissaient aussitôt
  rationale: Le latin exprime le fait qu’elles cessaient immédiatement d’être visibles. L’imparfait « disparaissaient » respecte l’aspect de conparescebant tout en restant naturel en français.
- source_word: Nam et
  choice: Car … aussi
  rationale: « Car » conserve la valeur explicative de nam, tandis que « aussi » rend la valeur additive de et.
- source_word: aliquae ex eis
  choice: certaines d’entre elles
  rationale: Cette formulation garde le féminin pluriel et la valeur partitive du latin.
- source_word: erigebantur
  choice: se dressaient
  rationale: Le verbe pronominal rend naturellement l’idée d’un mouvement vers le haut, sans préciser davantage la nature du mouvement.
