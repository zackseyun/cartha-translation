  text: qui te non nocuerunt. Et ascendit contumelia tua ad altissimum et superbia tua ad fortem. Et respexit altissimus super sua tempora, et ecce finita sunt, et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/043.yaml
  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: fr
  text: qui ne t’ont fait aucun mal. Et ton insolence est montée jusqu’au Très-Haut, et ton orgueil jusqu’au Puissant. Le Très-Haut a regardé ses temps, et voici qu’ils sont achevés, et que ses âges sont accomplis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contumelia
  choice: insolence
  rationale: Dans ce contexte d’accusation, le terme latin désigne l’attitude outrageante et arrogante de la puissance interpellée ; « insolence » restitue naturellement cette nuance.
- source_word: fortem
  choice: Puissant
  rationale: Le substantif adjectival désigne Dieu comme celui qui est puissant. La majuscule signale ce titre divin sans lui ajouter une précision absente du latin.
- source_word: tempora
  choice: les temps qui lui appartiennent
  rationale: Cette formulation conserve le possessif masculin singulier de « sua » tout en rendant clairement son renvoi probable au Très-Haut plutôt qu’à la puissance condamnée.
- source_word: saecula
  choice: les âges fixés par lui
  rationale: « Âges » préserve la portée temporelle étendue de « saecula » ; « fixés par lui » explicite avec retenue le possessif « eius » et produit un français intelligible.
theological_decisions:
- issue: Référent des possessifs dans « sua tempora » et « saecula eius »
  choice: 'Les rapporter au Très-Haut : les temps lui appartiennent et les âges sont fixés par lui.'
  alternative: 'Les rapporter à la puissance interpellée : « ses temps » et « ses âges ».'
  rationale: Le sujet immédiat est « le Très-Haut », et le latin masculin singulier favorise grammaticalement ce rattachement. La formulation française évite toutefois de suggérer que Dieu lui-même aurait des âges qui prendraient fin.
translation_notes:
  register: Français moderne, international et digne. Le début demeure une proposition relative fragmentaire parce que le verset poursuit la phrase du contexte précédent. « Les voici arrivés à leur terme » rend l’effet présentatif de « ecce » de façon naturelle.
