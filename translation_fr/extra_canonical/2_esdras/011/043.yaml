    issue: Explicitation interprétative des possessifs et ajout de « fixés par lui »
    rationale: Sua tempora et saecula eius comportent des possessifs dont le rattachement et la portée doivent être laissés aussi ouverts que le latin le permet. « Les âges fixés par lui » ajoute l’idée de fixation ou de décret, absente de conpleta sunt (« sont accomplis/achevés »).
