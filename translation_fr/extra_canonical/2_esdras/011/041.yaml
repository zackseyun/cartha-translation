  text: And you judged the earth not with truth.
translation:
  language: fr
  text: Et tu n’as pas jugé la terre selon la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicasti
  choice: tu as jugé
  rationale: Rend directement le parfait latin à la deuxième personne du singulier.
- source_word: terram
  choice: la terre
  rationale: Conserve le sens large et potentiellement ambigu de « terra », qui peut désigner la terre ou le monde habité.
- source_word: non [cum veritate]
  choice: n’as pas… selon la vérité
  rationale: La négation porte sur la manière de juger; « selon la vérité » exprime naturellement en français l’idée d’un jugement conforme à la vérité, attestée par la couche de consultation anglaise malgré la coupure du texte latin fourni après « non ».
theological_decisions:
- issue: Nature du reproche adressé au pouvoir symbolique
  choice: Conserver l’accusation de jugement non conforme à la vérité
  alternative: Interpréter « vérité » comme « justice » ou « fidélité »
  rationale: Le texte vise explicitement la vérité; remplacer ce terme par une notion théologique voisine réduirait la tension et préciserait indûment le sens.
translation_notes:
  register: Français moderne, sobre et solennel. La coordination initiale « Et » est conservée parce que le verset poursuit directement l’accusation précédente.
