  yaml_path: translation/extra_canonical/2_esdras/007/107.yaml
  text: and Joshua after him for Israel in the days of Achar[a], and Samuel in the days of Saul,
translation:
  language: fr
  text: et Josué, qui vint après lui en faveur d’Israël aux jours d’Achar[a], et Samuel aux jours de Saül,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Josué… aux jours d’Achar » traduit le latin Iesus, forme qui peut désigner Josué ou Jésus. Dans ce contexte de l’Ancien Testament, il s’agit de Josué, fils de Noun. Le latin porte Achar; cette forme est conservée ici plutôt que d’être identifiée sans indication avec Akan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Iesus
  choice: Josué
  rationale: Dans ce contexte vétérotestamentaire, la forme latine Iesus désigne Josué, fils de Noun.
- source_word: pro Israhel
  choice: en faveur d’Israël
  rationale: Cette formulation naturelle conserve le sens large de pro, qui indique ici une intervention ou une intercession en faveur d’Israël.
- source_word: Achar
  choice: Akar
  rationale: Translittération française moderne du nom présent dans la source latine, sans le normaliser silencieusement en Akan.
theological_decisions:
- issue: Identification de Iesus
  choice: Josué
  alternative: Jésus
  rationale: L’allusion à l’époque d’Akar situe clairement le personnage dans le récit de Josué; « Jésus » créerait en français une identification anachronique.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe fragmentaire et la coordination avec le contexte précédent sont conservées; « aux jours de » maintient la tournure biblique sans être obscure.
