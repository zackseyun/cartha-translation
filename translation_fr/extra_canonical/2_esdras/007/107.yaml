  source_fidelity: 'La traduction identifie correctement Iesus comme Josué, fils de Noun, et conserve la valeur générale de pro Israhel. Toutefois, le relatif qui et l’idée verbale implicite dans qui post eum sont effacés dans le texte courant. Surtout, Achar ne devrait pas être remplacé sans nécessité par « Akar » : la forme latine transmise doit être conservée, plutôt que normalisée ou translittérée de façon non attestée.'
