  yaml_path: translation/extra_canonical/2_esdras/007/013.yaml
  text: For the entrances of the greater age are broad and secure[a], and they produce the fruit of immortality.
translation:
  language: fr
  text: Car les accès de l’ère plus grande[a] sont larges et sûrs, et ils produisent le fruit de l’immortalité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'D’autres témoins anciens lisent : « l’ère à venir ».'
    reason: 'Variante textuelle ancienne importante : le latin transmis porte maioris (« plus grande »), tandis que d’autres versions anciennes attestent « à venir ».'
lexical_decisions:
- source_word: nam
  choice: Car
  rationale: La conjonction introduit une explication de ce qui précède, et non une opposition.
- source_word: maioris saeculi
  choice: de l’ère plus grande
  rationale: Cette formulation suit directement le latin transmis, tout en conservant l’idée comparative de maioris et le sens temporel de saeculum.
- source_word: introitus
  choice: les entrées
  rationale: Le pluriel concret correspond au latin et maintient l’image des voies d’accès.
- source_word: spatiosi et securi
  choice: larges et sûres
  rationale: Traduction directe et naturelle des deux qualificatifs.
- source_word: facientes inmortalitatis fructum
  choice: elles produisent le fruit de l’immortalité
  rationale: « Produisent » rend facientes sans effacer la métaphore du fruit.
theological_decisions:
- issue: Désignation de l’ère eschatologique
  choice: l’ère plus grande
  alternative: l’ère à venir
  rationale: Le texte latin fourni porte maioris (« plus grande »). D’autres témoins anciens semblent toutefois préserver la leçon « à venir », qui exprime le contraste apocalyptique entre l’ère présente et l’ère future; cette variante est donc signalée sans remplacer silencieusement le texte latin.
translation_notes:
  register: Français moderne, clair et digne. « Ère » restitue ici le sens temporel et eschatologique de saeculum; la structure coordonnée du latin est conservée.
