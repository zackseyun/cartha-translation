  yaml_path: translation/extra_canonical/2_esdras/007/057.yaml
  text: 'So judge for yourself which things are precious and desirable: what is abundant, or what is born rare?'
translation:
  language: fr
  text: 'Juge donc par toi-même ce qui est précieux et désirable : ce qui se multiplie, ou ce qui naît rarement ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Aestima et tu
  choice: Juge donc par toi-même
  rationale: Rend l’appel direct à l’interlocuteur et l’idée qu’il doit lui-même porter un jugement de valeur; « donc » exprime naturellement le lien déductif avec la comparaison précédente.
- source_word: pretiosa et desiderabilia
  choice: précieux et désirable
  rationale: Conserve les deux notions distinctes de valeur et d’attrait dans un français courant et digne.
- source_word: quod multiplicatur
  choice: ce qui se multiplie
  rationale: Suit directement le verbe latin et préserve le contraste entre ce qui devient nombreux et ce qui apparaît rarement.
- source_word: quod rarum nascitur
  choice: ce qui naît rarement
  rationale: Reproduit l’image de la naissance ou de la venue à l’existence sans la réduire au simple adjectif « rare ».
