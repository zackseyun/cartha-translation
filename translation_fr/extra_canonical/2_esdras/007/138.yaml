source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
translation:
  language: fr
  text: Et il est généreux[a], car si, dans sa bonté, il ne donnait pas afin que ceux qui ont commis des iniquités soient soulagés de leurs iniquités[b], même un dix-millième de l’humanité ne pourrait être vivifié,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui donne ».'
    reason: Signaler la forme nominale concrète de donator, rendue idiomatiquement dans le texte par « généreux ».
  - marker: b
    text: 'Ou : « soient déchargés du poids de leurs iniquités ».'
    reason: Rendre perceptible l’image d’allègement portée par adleventur sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: donator
  choice: il est généreux
  rationale: Le latin emploie un nom signifiant littéralement « celui qui donne ». Dans ce contexte, « il est généreux » exprime naturellement en français la qualité divine affirmée, tandis qu’une note conserve la forme concrète du latin.
- source_word: de bonitate sua
  choice: dans sa bonté
  rationale: Cette tournure française rend l’idée que le don procède de sa propre bonté sans introduire un objet que le latin ne précise pas.
- source_word: adleventur ... de suis iniquitatibus
  choice: soient soulagés de leurs iniquités
  rationale: Adleventur évoque l’allègement ou le soulagement. La formulation conserve l’image et évite de préciser si les iniquités elles-mêmes, leur poids ou leurs conséquences sont retirés.
- source_word: decies millesima pars hominum
  choice: un dix-millième de l’humanité
  rationale: Rendu numérique exact et français naturel de la très petite proportion indiquée par le latin.
- source_word: vivificari
  choice: recevoir la vie
  rationale: Le passif latin signifie être vivifié ou rendu à la vie. « Recevoir la vie » reste naturel et laisse ouverte la nuance exacte du contexte eschatologique.
theological_decisions:
- issue: Nature du soulagement accordé aux auteurs d’iniquités
  choice: soulagés de leurs iniquités
  alternative: pardonnés de leurs iniquités / délivrés du poids de leurs iniquités
  rationale: Le latin décrit un allègement sans nommer explicitement le pardon ni limiter le sens au poids ou aux conséquences des fautes. La traduction conserve cette tension.
- issue: Sens de vivificari
  choice: recevoir la vie
  alternative: être ramené à la vie
  rationale: Le contexte peut viser la vivification eschatologique, mais le latin ne contraint pas ici à expliciter une résurrection préalable. La formulation retenue préserve cette latitude.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période et la virgule finale sont conservées parce que le verset se poursuit syntaxiquement dans le contexte. Le parallélisme autour du don et de la bonté est maintenu sans lourdeur excessive.
