source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: fr
  text: Car le Seigneur a en effet prescrit à ceux qui sont venus, lorsqu’ils sont venus, ce qu’ils devaient faire pour vivre et ce qu’ils devaient observer pour ne pas être punis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandans enim mandavit
  choice: avait bel et bien prescrit
  rationale: Rend l’insistance de la construction latine avec participe et verbe de même racine, sans la surcharger d’une idée de sévérité; le plus-que-parfait situe naturellement la prescription avant les actes attendus.
- source_word: venientibus quando venerunt
  choice: à ceux qui vinrent, au moment de leur arrivée
  rationale: Conserve à la fois le groupe désignant ceux qui vinrent et la précision temporelle, tout en évitant en français une répétition maladroite.
- source_word: quid facientes viverent
  choice: ce qu’ils devaient faire pour vivre
  rationale: Exprime naturellement la relation entre la conduite prescrite et la vie, sans préciser au-delà du latin la nature de cette vie.
- source_word: quid observantes non punirentur
  choice: ce qu’ils devaient observer pour ne pas être punis
  rationale: « Observer » correspond directement à observantes dans le contexte de prescriptions; la voix passive de non punirentur est maintenue.
theological_decisions:
- issue: Sens de « vivre »
  choice: Conserver simplement « vivre »
  alternative: « obtenir la vie » ou « rester en vie »
  rationale: Le latin viverent ne tranche pas explicitement entre vie présente, survie et vie eschatologique; la traduction préserve cette ouverture.
- issue: Lien entre observance et absence de châtiment
  choice: « pour ne pas être punis »
  alternative: « afin d’échapper au châtiment »
  rationale: La formulation retenue suit la syntaxe du texte sans développer un mécanisme théologique absent du verset.
translation_notes:
  register: Français international moderne, clair et digne. « Bel et bien » restitue l’emphase sans introduire la sévérité que suggérerait « strictement ». La ponctuation isole la précision temporelle et facilite la lecture.
