source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: fr
  text: Heureux ceux qui sont présents[a] et qui observent ce que tu as établi. Mais quant à ceux qui faisaient l’objet de ma prière[b], qui donc, parmi ceux qui sont présents, n’a pas péché ? Et quel être humain est né sans avoir transgressé ton alliance ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui vivent maintenant ». Le même mot latin est repris plus loin dans le verset.'
    reason: Le latin praesentes signifie littéralement « présents », mais désigne probablement ici les personnes actuellement en vie.
  - marker: b
    text: Le mot latin peut aussi désigner une parole, un propos ou une demande.
    reason: Oratio a une gamme de sens plus large que le seul mot français « prière »; la note préserve cette ambiguïté réelle.
lexical_decisions:
- source_word: beati
  choice: Heureux
  rationale: Rend naturellement la formule de bénédiction latine sans lui imposer un sens confessionnel plus étroit.
- source_word: praesentes
  choice: ceux qui sont présents
  rationale: Conserve le sens littéral et la reprise du même terme latin dans la question suivante; une note précise le sens contextuel probable.
- source_word: obseruantes
  choice: qui observent
  rationale: Exprime l’idée de garder et respecter fidèlement ce que Dieu a établi.
- source_word: quae a te constituta sunt
  choice: ce que tu as établi
  rationale: Formulation française directe qui conserve l’indétermination du pluriel neutre latin, sans préciser s’il s’agit de commandements, de prescriptions ou de dispositions.
- source_word: oratio mea
  choice: ma prière
  rationale: Dans ce contexte d’intercession, « prière » est le sens le plus probable, tout en signalant en note l’amplitude sémantique du latin.
- source_word: quis natus
  choice: quel être humain, une fois né
  rationale: Rend l’expression elliptique et inclusive du latin dans un français naturel, sans limiter arbitrairement la référence aux hommes de sexe masculin.
- source_word: praeteriit pactum tuum
  choice: a transgressé ton alliance
  rationale: Suit la proposition conservée dans la tradition textuelle sous-jacente à la couche anglaise auditée; « transgresser » restitue l’idée de franchir ou violer, et « alliance » traduit pactum dans son cadre théologique.
theological_decisions:
- issue: Portée universelle du péché humain
  choice: Formuler les deux questions sans atténuer leur force rhétorique universelle.
  alternative: Les reformuler comme de simples observations portant sur certaines personnes.
  rationale: Les interrogatifs quis… non et quis natus… non présentent l’absence de péché et de transgression comme introuvable parmi les humains; la traduction préserve cette tension avec la béatitude initiale.
- issue: Nature de ce que Dieu a établi
  choice: Conserver la formulation générale « ce que tu as établi ».
  alternative: Préciser « tes commandements » ou « ta Loi ».
  rationale: Le latin quae a te constituta sunt ne nomme explicitement ni la Loi ni les commandements; les préciser importerait une interprétation.
- issue: Sens de pactum
  choice: Traduire par « alliance ».
  alternative: « pacte » ou « engagement ».
  rationale: « Alliance » est le terme français usuel dans ce contexte biblique, sans déterminer davantage la nature ou l’administration de cette alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La structure rhétorique et les répétitions du latin sont conservées autant que possible. La dernière proposition est syntaxiquement incomplète dans l’extrait latin fourni; sa restitution suit la continuation attestée par la tradition textuelle reflétée dans la couche anglaise auditée.
