source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: fr
  text: Et le monde reviendra au silence ancien pendant sept jours, comme lors des premiers commencements, de sorte que personne ne soit laissé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte apocalyptique, « saeculum » désigne l’ordre du monde ou l’âge présent; « le monde » est naturel en français et convient avec l’idée que plus personne ne subsiste.
- source_word: convertetur
  choice: reviendra
  rationale: Rend le mouvement de retour exprimé par le passif latin sans la lourdeur de « sera ramené ».
- source_word: in antiquum silentium
  choice: au silence des origines
  rationale: Expression française naturelle qui conserve l’idée d’un silence ancien, primordial, explicitée par la comparaison avec les premiers commencements.
- source_word: in prioribus initiis
  choice: aux premiers commencements
  rationale: Conserve l’insistance du latin sur le commencement primordial, malgré la légère redondance voulue.
- source_word: nemo derelinquatur
  choice: personne ne subsiste
  rationale: Dans ce tableau de silence universel, le verbe signifie que nul ne demeure; « subsiste » évite l’ambiguïté française de « laissé derrière » tout en gardant le sens contextuel.
theological_decisions:
- issue: Portée du retour au silence
  choice: Formulation cosmique et temporelle sans explication ajoutée
  alternative: Interpréter explicitement ce silence comme la mort universelle ou la cessation de la création
  rationale: Le latin évoque le retour du monde à un silence primordial, mais ne définit pas davantage sa nature; la traduction préserve cette tension apocalyptique.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « silence des origines » privilégie l’idiomaticité tout en maintenant l’écho au commencement primordial; aucun marqueur de note n’est requis.
