revisions:
- from: Et le monde reviendra au silence des origines pendant sept jours, comme aux premiers commencements, afin que personne ne subsiste.
  to: Et le monde reviendra au silence ancien pendant sept jours, comme lors des premiers commencements, de sorte que personne ne soit laissé.
  rationale: La révision distingue l’« ancien silence » de la comparaison avec les « premiers commencements », rend ita ut comme une conséquence, et maintient l’ouverture du passif latin dans la dernière proposition. Aucun ajout interprétatif ni note n’est nécessaire.
