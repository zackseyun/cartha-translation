  text: 'The fifth way: they see the dwelling place of the others guarded by angels[a]'
translation:
  language: fr
  text: 'La cinquième voie : ils voient la demeure des autres gardée par des anges.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinta uia
  choice: La cinquième voie
  rationale: Rend directement l’énoncé ordinal et conserve la terminologie structurante de cette série.
- source_word: aliorum habitaculum
  choice: la demeure des autres
  rationale: Habitaculum est singulier et désigne ici un lieu d’habitation; « des autres » préserve sans l’expliciter davantage le référent de aliorum.
- source_word: ab angelis conseruari
  choice: gardée par des anges
  rationale: L’infinitif passif latin exprime que la demeure est maintenue sous la garde ou la protection des anges; « gardée » est naturel et précis dans ce contexte.
theological_decisions:
- issue: Identité des « autres »
  choice: Conserver « les autres » sans préciser leur identité
  alternative: « les justes » ou « les autres âmes »
  rationale: Le segment latin dit seulement aliorum. Une précision interprétative résoudrait une référence que le texte laisse implicite.
- issue: Nuance de conseruari
  choice: « gardée »
  alternative: « préservée » ou « protégée »
  rationale: Dans ce contexte angélique, « gardée » rend naturellement la surveillance protectrice tout en évitant d’ajouter une conception théologique plus précise.
translation_notes:
  register: Français moderne, sobre et digne. La phrase nominale introductive suit la structure énumérative du latin. Aucun ajout provenant d’un contexte élargi n’a été introduit.
