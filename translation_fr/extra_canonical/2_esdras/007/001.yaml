  yaml_path: translation/extra_canonical/2_esdras/007/001.yaml
  text: And it happened, when I had finished speaking these words, that the angel who had been sent to me in the first nights was sent to me again,
translation:
  language: fr
  text: Il arriva que, lorsque j’eus fini de prononcer ces paroles, l’ange qui m’avait été envoyé au cours des premières nuits me fut de nouveau envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cum finissem loqui verba haec
  choice: Quand j’eus fini de prononcer ces paroles
  rationale: Le plus-que-parfait rend l’antériorité de l’action, et « prononcer ces paroles » exprime naturellement l’acte de parler en français.
- source_word: primis noctibus
  choice: durant les premières nuits
  rationale: Cette formulation conserve le pluriel et la référence temporelle du latin sans préciser davantage quelles nuits sont visées.
- source_word: missus est ad me ... qui missus fuerat ad me
  choice: me fut de nouveau envoyé ... qui m’avait été envoyé
  rationale: La répétition du verbe « envoyer » préserve l’insistance du texte; « de nouveau » explicite la reprise impliquée par la venue du même ange.
