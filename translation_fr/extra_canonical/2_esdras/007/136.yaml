- from: et d’une grande miséricorde, car il multiplie ses miséricordes envers ceux qui sont présents, ceux qui ont disparu et ceux qui sont à venir.
  to: et d’une grande miséricorde, car il multiplie encore ses miséricordes envers ceux qui sont présents, ceux qui ne sont plus et ceux qui sont à venir.
  rationale: La révision maintient la syntaxe, la répétition et la portée temporelle du latin, tout en traduisant magis par « encore » et en évitant de surdéterminer praeterierunt. Aucun ajout doctrinal n’est introduit.
