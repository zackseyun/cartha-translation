source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multae misericordiae, quoniam multiplicat magis misericordias his qui praesentes sunt et qui praeterierunt et qui futuri sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
translation:
  language: fr
  text: et d’une grande miséricorde, car il multiplie encore ses miséricordes envers ceux qui sont présents, ceux qui ne sont plus et ceux qui sont à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multae misericordiae
  choice: d’une grande miséricorde
  rationale: Le génitif latin exprime ici la qualité de celui qui fait preuve d’une grande miséricorde. Cette formulation reste proche du texte sans introduire l’image plus libre « riche en miséricordes ».
- source_word: multiplicat magis misericordias
  choice: il multiplie ses miséricordes
  rationale: « Multiplie » rend déjà l’idée d’accroissement portée par multiplicat; traduire magis par « de plus en plus » imposerait une progression temporelle que le latin n’exige pas. Le possessif « ses » est naturel en français et désigne clairement les miséricordes de Dieu.
- source_word: qui praeterierunt
  choice: ceux qui ont disparu
  rationale: Dans cette série opposant les présents et ceux qui sont à venir, l’expression désigne naturellement les générations passées, désormais disparues. « Ceux qui sont passés » serait trop littéral et peu naturel.
- source_word: qui futuri sunt
  choice: ceux qui sont à venir
  rationale: Cette formulation conserve la perspective future du latin sans préciser indûment s’il s’agit de personnes non encore nées ou, plus largement, des générations futures.
theological_decisions:
- issue: Portée temporelle de la miséricorde divine
  choice: Conserver la triple référence aux présents, aux disparus et à ceux qui sont à venir
  alternative: Reformuler comme une affirmation générale de miséricorde envers toutes les générations
  rationale: La traduction maintient la structure explicite du latin et n’en tire aucune conclusion doctrinale supplémentaire sur l’état des morts ou leur salut.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « miséricorde / miséricordes » est conservée parce qu’elle structure l’énoncé latin; « ceux qui ont disparu » évite le calque maladroit tout en gardant le contraste temporel.
