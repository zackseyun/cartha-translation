  text: 'seruiuistis, uel cuius diligentias spreuistis. Uidete contra et in contra: hic iocunditas et requies, et ibi ignis et tormenta; haec autem loqueris dicens ad eos in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: fr
  text: 'Voyez d’un côté et de l’autre : ici sont la joie et le repos, et là, le feu et les tourments. Voilà ce que tu leur diras au jour du jugement.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Uidete contra et in contra
  choice: Voyez d’un côté et de l’autre
  rationale: Rend l’impératif pluriel et l’opposition spatiale du latin dans un français naturel, sans préciser davantage les deux côtés.
- source_word: iocunditas et requies
  choice: la joie et le repos
  rationale: « Joie » exprime naturellement iocunditas dans ce contraste eschatologique, tandis que « repos » correspond directement à requies.
- source_word: ignis et tormenta
  choice: le feu et les tourments
  rationale: Conserve les images concrètes et le pluriel de tormenta.
- source_word: haec autem loqueris dicens ad eos
  choice: Voilà ce que tu leur diras
  rationale: Formulation française idiomatique qui garde la deuxième personne du singulier de loqueris et les destinataires exprimés par ad eos.
theological_decisions:
- issue: Identité de celui qui prononcera ces paroles
  choice: tu leur diras
  alternative: il leur dira
  rationale: Le latin porte loqueris, à la deuxième personne du singulier; le choix ne remplace donc pas ce sujet par une troisième personne, même si la couche anglaise emploie « he ».
- issue: Contraste du jugement
  choice: Conserver « joie et repos » face à « feu et tourments »
  alternative: Interpréter explicitement ces réalités comme le ciel et l’enfer
  rationale: Le texte énonce les deux sorts par des images sans les identifier plus précisément; la traduction préserve cette formulation et sa tension.
translation_notes:
  register: Français international moderne, clair et digne. Le passage de l’impératif pluriel « Voyez » à la deuxième personne du singulier « tu leur diras » reproduit le changement de nombre présent dans le latin transmis.
