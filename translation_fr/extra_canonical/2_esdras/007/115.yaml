source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
translation:
  language: fr
  text: Dès lors, nul ne pourra avoir pitié de celui qui aura été vaincu dans le jugement[a], ni renverser celui qui l’aura emporté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aura perdu son procès ».'
    reason: Le latin victus, opposé à vicerit dans un contexte judiciaire, peut désigner celui qui perd sa cause ; le texte conserve toutefois l’image plus littérale de la défaite.
lexical_decisions:
- source_word: Tunc ergo
  choice: Alors
  rationale: Rend naturellement la conclusion temporelle et logique du latin sans alourdir la phrase par un double connecteur.
- source_word: misereri eius
  choice: avoir pitié de celui
  rationale: Correspond directement au verbe latin misereri et demeure naturel en français moderne.
- source_word: in iudicio victus fuerit
  choice: aura été vaincu en jugement
  rationale: Préserve la métaphore antithétique victus/vicerit et le cadre judiciaire, sans remplacer victus par une condamnation plus interprétative.
- source_word: demergere
  choice: abaisser
  rationale: Exprime l’idée de faire tomber ou d’abattre la position du vainqueur, sans imposer l’image matérielle plus étroite de l’immersion.
- source_word: qui vicerit
  choice: celui qui l’aura emporté
  rationale: Dans ce contexte judiciaire, vicerit désigne celui qui gagne ou prévaut; « l’aura emporté » évite une coloration militaire excessive.
theological_decisions:
- issue: Caractère définitif du jugement
  choice: Conserver l’impossibilité exprimée par « personne ne pourra »
  alternative: Reformuler comme une simple absence probable d’intervention
  rationale: Le latin nemo poterit affirme une impossibilité catégorique après le jugement; la traduction ne doit ni l’atténuer ni en préciser la cause théologique.
- issue: Sens judiciaire ou martial de victus/vicerit
  choice: Maintenir l’antithèse « vaincu / l’aura emporté » dans un cadre explicitement judiciaire
  alternative: « condamné / justifié »
  rationale: L’alternative expliciterait fortement l’issue judiciaire, mais ajouterait des catégories théologiques que les verbes latins eux-mêmes ne formulent pas.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme du latin et son contraste judiciaire sans introduire un vocabulaire confessionnel spécialisé.
