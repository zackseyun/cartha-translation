source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
translation:
  language: fr
  text: 'Il en va de même pour la création que j’ai promise : je me réjouirai du petit nombre de ceux qui seront sauvés, car ce sont eux qui ont maintenant rendu ma gloire plus prééminente et par qui mon nom est maintenant prononcé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: repromissa creatura
  choice: la création que j’ai promise
  rationale: Rend naturellement la construction latine tout en conservant « création » et l’origine divine de la promesse.
- source_word: iocundabor
  choice: je me réjouirai
  rationale: Conserve le futur et exprime directement la joie du locuteur.
- source_word: super paucis et qui saluabuntur
  choice: du petit nombre de ceux qui seront sauvés
  rationale: Le latin transmis est syntaxiquement heurté, mais le sens vise le petit nombre qui recevra le salut; « seront sauvés » respecte le futur passif saluabuntur.
- source_word: gloriam meam nunc dominatiorem fecerunt
  choice: ont maintenant rendu ma gloire plus éclatante
  rationale: « Plus éclatante » donne en français idiomatique l’idée comparative de dominatiorem appliquée à la gloire, sans l’étrange calque « plus dominante ».
- source_word: per quos nunc nomen meum
  choice: par qui mon nom est maintenant proclamé
  rationale: Le texte latin fourni s’interrompt après nomen meum; cette formulation suit la consultation anglaise (« is now named ») et exprime naturellement l’idée que le nom est publiquement prononcé ou célébré.
theological_decisions:
- issue: Temporalité du salut
  choice: ceux qui seront sauvés
  alternative: ceux qui sont sauvés
  rationale: Saluabuntur est un futur passif de l’indicatif; la traduction conserve donc l’orientation eschatologique sans la convertir en état présent.
- issue: Petit nombre des sauvés
  choice: du petit nombre de ceux qui seront sauvés
  alternative: des quelques-uns qui seront sauvés
  rationale: Cette tournure garde l’accent quantitatif du latin pauci sans développer une doctrine au-delà de l’énoncé.
- issue: Action des sauvés sur la gloire divine
  choice: rendu ma gloire plus éclatante
  alternative: rendu ma gloire plus dominante
  rationale: La comparaison présente dans dominatiorem est maintenue, mais exprimée selon une collocation française naturelle avec « gloire ».
translation_notes:
  register: Français international moderne, digne et accessible. Le futur eschatologique est conservé. La formulation évite les calques latins opaques; la dernière proposition est nécessairement éclairée par la couche anglaise auditée, puisque l’extrait latin fourni est tronqué après « nomen meum ».
