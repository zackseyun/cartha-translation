revisions:
- from: 'Il en va de même pour la création que j’ai promise : je me réjouirai du petit nombre de ceux qui seront sauvés, car ce sont eux qui ont maintenant rendu ma gloire plus éclatante et par qui mon nom est maintenant proclamé.'
  to: 'Il en va de même pour la création que j’ai promise : je me réjouirai du petit nombre de ceux qui seront sauvés, car ce sont eux qui ont maintenant rendu ma gloire plus prééminente et par qui mon nom est maintenant prononcé.'
  rationale: La révision conserve la syntaxe générale, le futur eschatologique et l’accent sur le petit nombre. Elle remplace une image française élégante mais sémantiquement déplacée (« éclatante ») par « prééminente », qui rend le comparatif de dominatiorem. Dans la clause finale, dont le témoin latin fourni est tronqué, elle suit avec retenue l’audit anglais (« named »).
