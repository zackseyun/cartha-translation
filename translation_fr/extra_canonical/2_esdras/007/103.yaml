  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
translation:
  language: fr
  text: Pourront-ils, lors du juste jugement, excuser les impies ou supplier le Très-Haut en leur faveur, comme des pères pour leurs enfants, des enfants pour leurs parents, des frères pour leurs frères, ou des parents par alliance pour leurs prochains ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicii iusti
  choice: lors du juste jugement
  rationale: Le génitif latin dépend de l’idée de pouvoir excuser; cette formulation française exprime naturellement le cadre du jugement tout en conservant sa qualification de juste.
- source_word: impios
  choice: les impies
  rationale: Rend le terme latin désignant ceux qui manquent de piété envers Dieu sans l’atténuer ni ajouter une qualification confessionnelle.
- source_word: deprecari pro eis
  choice: supplier le Très-Haut en leur faveur
  rationale: Dans ce contexte, deprecari exprime une requête instante ou une intercession; «en leur faveur» restitue clairement pro eis.
- source_word: adfines
  choice: des proches
  rationale: Adfines peut désigner des parents par alliance ou, plus largement, des personnes liées; «proches» préserve cette latitude dans une liste de liens humains.
- source_word: proximis
  choice: leurs prochains
  rationale: «Prochains» conserve le sens relationnel large de proximis et le distingue de «proches», choisi pour adfines.
theological_decisions:
- issue: Possibilité d’une intercession en faveur des impies au jugement
  choice: Conserver la question sans préciser ici si une telle intercession est efficace
  alternative: Formuler la phrase comme une négation explicite de toute intercession
  rationale: Le fragment fourni présente une interrogation rhétorique dont la réponse dépend du contexte; la traduction ne doit pas résoudre implicitement la tension.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe interrogative reste liée au contexte précédent, conformément au début fragmentaire du texte latin fourni.
