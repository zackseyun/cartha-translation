  text: nunc ergo tu quare conturbaris, corruptibilis cum sis? et quid moveris tu, cum sis mortalis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/015.yaml
  text: So now why are you disturbed[a], seeing that you are corruptible? And why are you shaken, seeing that you are mortal?
translation:
  language: fr
  text: Alors, pourquoi te troubles-tu, toi qui es corruptible ? Et pourquoi es-tu ébranlé, toi qui es mortel ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: te troubles-tu
  rationale: Rend directement l’agitation intérieure exprimée par le latin, dans un français naturel et digne.
- source_word: corruptibilis
  choice: corruptible
  rationale: Conserve le terme théologique et anthropologique du texte, qui désigne la condition sujette à la corruption.
- source_word: moveris
  choice: es-tu ébranlé
  rationale: Dans ce parallélisme avec conturbaris, le verbe évoque le bouleversement ou l’instabilité plutôt qu’un simple mouvement physique ou le fait d’être ému.
- source_word: mortalis
  choice: mortel
  rationale: Équivalent direct et idiomatique du latin, maintenant le parallèle avec « corruptible ».
theological_decisions:
- issue: Relation entre la condition humaine et le trouble d’Esdras
  choice: Conserver les propositions « toi qui es corruptible » et « toi qui es mortel » sans expliciter davantage le lien logique.
  alternative: Traduire par « puisque tu es corruptible / mortel » ou développer une interprétation causale.
  rationale: Le latin cum sis peut être circonstanciel ou causal. La formulation retenue préserve cette légère ouverture tout en restant naturelle.
translation_notes:
  register: Français moderne international, sobre et soutenu. Le parallélisme des deux questions latines est conservé, avec une distinction naturelle entre « se troubler » et « être ébranlé ».
