  text: and long-suffering, because he shows long-suffering toward those who have sinned, as toward his own works,
translation:
  language: fr
  text: et patient, parce qu’il fait preuve de patience envers ceux qui ont péché, comme envers ses propres œuvres,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: longanimis / longanimitatem
  choice: patient / patience
  rationale: Le latin exprime une patience prolongée. La répétition du même lexème est conservée autant que le permet un français naturel.
- source_word: praestat
  choice: fait preuve de
  rationale: Cette expression rend ici l’idée de manifester ou d’accorder concrètement la patience envers quelqu’un.
- source_word: quasi suis operibus
  choice: les considérant comme ses propres œuvres
  rationale: Cette formulation restitue le rapport implicite du latin entre les pécheurs et les œuvres de Dieu, sans faire de « quasi » une comparaison irréelle.
theological_decisions:
- issue: Portée de « quasi » dans « quasi suis operibus »
  choice: les considérant comme ses propres œuvres
  alternative: comme envers ses propres œuvres
  rationale: Le latin permet une tournure comparative, mais le sens paraît être que Dieu use de patience envers les pécheurs en tant qu’ils sont ses créatures. La formulation retenue reste prudente et évite d’introduire une doctrine supplémentaire.
translation_notes:
  register: Français moderne, courant et digne. Le segment conserve sa forme coordonnée et sa ponctuation finale, puisqu’il s’insère dans une énumération plus large.
