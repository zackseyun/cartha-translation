id: 2ES.7.68
reference: 2 Esdras 7:68
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
translation:
  language: fr
  text: À quoi bon être sauvés, si nous sommes tourmentés ? En effet, tous ceux qui sont nés sont mêlés aux iniquités, remplis de péchés et chargés de fautes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid prodest
  choice: À quoi sert-il
  rationale: Rend directement la question sur l’utilité ou l’avantage, dans un français naturel et digne.
- source_word: salutati saluabimur
  choice: nous soyons sauvés
  rationale: Le premier terme est vraisemblablement une variante scribale de saluati. Le français exprime l’idée du salut sans ajouter une intensité que le texte latin n’énonce pas explicitement.
- source_word: tormento tormentabimur
  choice: nous devons être tourmentés
  rationale: La formulation exprime la perspective future impliquée par le latin tout en évitant le calque peu naturel « être tourmentés par un tourment ».
- source_word: conmixti sunt iniquitatibus
  choice: sont mêlés aux iniquités
  rationale: Conserve l’image inhabituelle mais intelligible de conmixti, sans la résoudre en « empêtrés » ou « compromis ».
- source_word: grauidi delictis
  choice: chargés de fautes
  rationale: Grauidi évoque le poids ou la lourde charge; « chargés » maintient cette image dans un français idiomatique. « Fautes » distingue delicta de peccata sans surspécifier.
theological_decisions:
- issue: Rapport entre salut et tourment
  choice: 'Conserver la tension : « que nous soyons sauvés, si nous devons être tourmentés »'
  alternative: Interpréter le salut comme une possibilité seulement apparente ou comme un salut postérieur au châtiment
  rationale: Le verset pose la tension sans l’expliquer; la traduction ne tranche donc ni la nature ni la chronologie du salut et du tourment.
- issue: Universalité de l’implication dans le péché
  choice: « tous ceux qui sont nés »
  alternative: « tous les êtres humains »
  rationale: La formulation concrète du latin est conservée et n’introduit aucune construction doctrinale supplémentaire.
translation_notes:
  register: Français moderne international, courant mais solennel. Le parallélisme final est préservé (« mêlés… remplis… chargés »), ainsi que l’accumulation morale entre iniquités, péchés et fautes.
