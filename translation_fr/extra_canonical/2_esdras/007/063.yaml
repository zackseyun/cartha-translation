  yaml_path: translation/extra_canonical/2_esdras/007/063.yaml
  text: For it would have been better if the dust itself had not come into being, so that understanding might not have come from it.
translation:
  language: fr
  text: Car il aurait mieux valu que la poussière elle-même ne soit pas venue à l’existence, afin qu’aucune intelligence n’en provienne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pulverem
  choice: la poussière
  rationale: Rend directement le latin « pulverem » et conserve l’image de la matière dont l’être humain est formé.
- source_word: factus est
  choice: vienne à l’existence
  rationale: Dans ce contexte de création, cette formulation est plus naturelle et plus exacte que « naisse », qui évoquerait une naissance biologique.
theological_decisions:
- issue: Rapport entre la poussière et l’intelligence
  choice: « afin que l’intelligence n’en provienne pas »
  alternative: « afin qu’aucune intelligence n’en sorte »
  rationale: La formulation retenue préserve l’idée paradoxale que l’intelligence procède de la poussière, sans préciser davantage la nature de ce rapport.
translation_notes:
  register: Français moderne, international et digne. La tournure contrefactuelle « il aurait mieux valu que… ne vienne pas » reste claire tout en conservant la tension rhétorique du passage.
