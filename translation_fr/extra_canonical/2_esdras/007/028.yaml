id: 2ES.7.28
reference: 2 Esdras 7:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: revelabitur enim Filius meus Iesus cum his qui cum eo, et iucundabit qui relicti sunt annis quadringentis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
translation:
  language: fr
  text: Car mon fils Jésus sera révélé avec ceux qui sont avec lui[b], et, pendant quatre cents ans, il réjouira ceux qui seront restés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre rattachement possible : « et il réjouira ceux qui seront restés pendant quatre cents ans ».'
    reason: Le latin place « pendant quatre cents ans » après « ceux qui sont restés », ce qui permet formellement ce rattachement, bien que la durée puisse qualifier l’action de réjouir.
  - marker: b
    text: 'Le latin présente ici une différence frappante : 7.28 porte « mon fils Jésus », tandis que 7.29 porte « mon fils, le Messie ». Le passage décrit une période de quatre cents ans, puis la mort du Messie, suivie de sept jours de silence primordial et enfin de la résurrection; c’est l’un des passages messianiques les plus remarquables de l’apocalyptique juive ancienne.'
    reason: La note préserve une donnée textuelle et le contexte messianique immédiat sans harmoniser les deux formulations.
lexical_decisions:
- source_word: revelabitur
  choice: sera révélé
  rationale: Le passif futur latin est conservé, sans expliciter l’agent ni remplacer l’idée de révélation par celle d’une simple venue.
- source_word: Filius meus Iesus
  choice: mon fils Jésus
  rationale: Rend littéralement la formulation propre à ce verset et maintient sa différence avec « mon fils, le Messie » au verset suivant.
- source_word: iucundabit
  choice: il réjouira
  rationale: Exprime naturellement l’action de procurer joie et bonheur, sans ajouter l’idée plus précise de régner.
- source_word: qui relicti sunt
  choice: ceux qui seront restés
  rationale: Le futur antérieur français convient au point de vue futur de la révélation et conserve le sens de personnes laissées ou demeurées en vie.
- source_word: annis quadringentis
  choice: pendant quatre cents ans
  rationale: L’ablatif indique une durée; la traduction principale le rattache à « il réjouira », tout en signalant l’autre rattachement possible en note.
theological_decisions:
- issue: Identification messianique et différence entre 7.28 et 7.29
  choice: Conserver « mon fils Jésus » ici
  alternative: Harmoniser avec « mon fils, le Messie »
  rationale: Le latin transmis emploie Iesus en 7.28 et Christus en 7.29. Cette différence frappante doit rester visible plutôt que d’être harmonisée.
- issue: Portée de la durée de quatre cents ans
  choice: Rattacher « pendant quatre cents ans » à l’action de réjouir
  alternative: Le rattacher à ceux qui seront restés
  rationale: L’ablatif de durée s’accorde naturellement avec le verbe principal et correspond à la séquence eschatologique du passage, mais la position latine permet une lecture moins nette; celle-ci est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du latin tout en plaçant le complément de durée avant le verbe pour éviter qu’il ne semble qualifier uniquement les survivants; la variante est néanmoins explicitement conservée en note.
