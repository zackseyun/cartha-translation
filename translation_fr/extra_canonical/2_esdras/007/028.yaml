  source_fidelity: Le texte rend fidèlement le futur passif revelabitur (« sera révélé »), l’expression distinctive Filius meus Iesus (« mon fils Jésus »), l’accompagnement cum his qui cum eo, et iucundabit (« il réjouira »). « Pendant quatre cents ans » est correctement compris comme un complément de durée de l’action principale; la note signale avec prudence le rattachement formellement possible au groupe des personnes laissées/restées.
  naturalness: Le français est moderne, clair et d’un registre convenable pour un texte scripturaire. La répétition « avec ceux qui sont avec lui » reflète l’insistance de la formulation latine sans devenir incompréhensible. « Ceux qui seront restés » est une solution naturelle dans ce cadre prophétique.
  terminology: « Mon fils Jésus » conserve la formulation précise du témoin latin sans l’harmoniser avec « le Messie » au verset suivant. « Révélé » et « réjouira » sont justes et ne surinterprètent pas le passage. La note b présente utilement la variation Jésus/Christus et le contexte sans imposer une lecture confessionnelle.
