source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui speruerunt, neque connumeres te cum his qui cruciantur. Etenim est tibi thesaurus operum repositus apud Altissimum, sed non tibi demonstrabitur usque in nouissimis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/077.yaml
  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
translation:
  language: fr
  text: qui ont méprisé, et ne te compte pas parmi ceux qui sont tourmentés. En effet, un trésor d’œuvres est mis en réserve pour toi auprès du Très-Haut, mais il ne te sera révélé que dans les derniers temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: speruerunt
  choice: ont manifesté du mépris
  rationale: Rend le parfait latin de spernere dans un français naturel, sans préciser indûment l’objet du mépris, absent de l’extrait.
- source_word: connumeres te
  choice: ne te compte pas
  rationale: Reproduit directement l’idée de se ranger ou de se compter parmi un groupe.
- source_word: cruciantur
  choice: sont tourmentés
  rationale: Conserve le sens passif et la force de cruciari sans ajouter la nature du tourment.
- source_word: thesaurus operum
  choice: un trésor d’œuvres
  rationale: Traduction formelle qui préserve la métaphore du trésor et l’ambiguïté de opera, plutôt que de préciser « bonnes œuvres » ou « récompense ».
- source_word: repositus apud Altissimum
  choice: mis en réserve pour toi auprès du Très-Haut
  rationale: « Mis en réserve » exprime repositus et « auprès du Très-Haut » rend apud Altissimum sans assimiler explicitement le trésor à une récompense.
- source_word: demonstrabitur
  choice: sera révélé
  rationale: Dans ce contexte eschatologique, « révélé » exprime naturellement le fait que le trésor jusque-là caché sera rendu manifeste.
- source_word: nouissimis
  choice: les derniers temps
  rationale: Le pluriel substantivé elliptique désigne vraisemblablement les réalités ou temps derniers; cette formulation française conserve la portée eschatologique sans imposer « dernier jour ».
theological_decisions:
- issue: Nature du « trésor d’œuvres »
  choice: Conserver littéralement « un trésor d’œuvres »
  alternative: « une récompense pour tes œuvres » ou « un trésor de bonnes œuvres »
  rationale: Le latin ne qualifie pas les œuvres de bonnes et ne nomme pas explicitement une récompense; la traduction garde donc la tension métaphorique du texte.
- issue: Moment où le trésor sera manifesté
  choice: « dans les derniers temps »
  alternative: « à la fin » ou « au dernier jour »
  rationale: Le latin nouissimis est elliptique; le pluriel français retenu préserve cette relative indétermination.
translation_notes:
  register: Français international moderne, digne et lisible. Le début fragmentaire « qui ont manifesté du mépris » est maintenu parce que le verset latin commence par une proposition relative dépendant du contexte précédent; le lisser en phrase autonome effacerait la continuité syntaxique et la division transmise du verset.
