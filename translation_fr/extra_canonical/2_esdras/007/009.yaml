source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem data dabitur civitas homini in hereditatem, si non heres antepositum periculum pertransierit, quomodo accipiet hereditatem suam?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: If a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
translation:
  language: fr
  text: Si une ville est donnée à un homme comme héritage[a], si l’héritier ne traverse pas le danger placé devant lui, comment recevra-t-il son héritage ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnée, elle sera donnée » ; le latin redouble le verbe « donner », selon une tournure dont la nuance exacte est incertaine.'
    reason: Rend compte de la construction marquée data dabitur sans introduire dans le texte une modalité de nécessité ou une emphase interprétée de façon excessive.
lexical_decisions:
- source_word: data dabitur
  choice: doit être donnée
  rationale: Le participe passif suivi du futur passif forme une tournure redoublée inhabituelle. « Doit être donnée » exprime naturellement en français la perspective future sans imposer une emphase contestable; la forme littérale est signalée en note.
- source_word: in hereditatem
  choice: en héritage
  rationale: Équivalent français direct et idiomatique, qui conserve l’idée de la ville accordée comme possession héréditaire.
- source_word: antepositum periculum
  choice: le danger placé devant lui
  rationale: Cette formulation garde l’image spatiale du danger disposé sur le chemin de l’héritier, sans la réduire à une difficulté abstraite.
- source_word: pertransierit
  choice: ne franchisse pas
  rationale: « Franchir » rend le mouvement à travers l’obstacle et convient naturellement à l’image d’un passage dangereux.
theological_decisions:
- issue: Rapport entre le passage par le danger et la réception de l’héritage
  choice: Conserver la condition sous forme de question rhétorique
  alternative: Expliciter que l’héritier doit mériter ou gagner son héritage
  rationale: Le texte affirme la nécessité de traverser le danger, mais ne précise pas un système doctrinal du mérite; la traduction préserve cette tension sans ajout confessionnel.
translation_notes:
  register: Français moderne, digne et accessible. La coordination « mais que » évite la répétition lourde de deux propositions en « si » tout en rendant la valeur de autem et en maintenant clairement la condition.
