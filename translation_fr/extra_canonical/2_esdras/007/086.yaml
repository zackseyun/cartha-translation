  text: 'The sixth way: they see how some of them will pass over into torment[a].'
translation:
  language: fr
  text: 'La sixième voie : ils voient comment certains d’entre eux passeront dans le tourment[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « passeront au supplice ».
    reason: « Cruciamentum » peut désigner le tourment subi ou, plus concrètement, le supplice.
lexical_decisions:
- source_word: Sexta uia
  choice: La sixième voie
  rationale: Rend directement l’expression latine et conserve l’image structurante de la « voie ».
- source_word: uidentes quemadmodum
  choice: ils voient comment
  rationale: Reproduit naturellement en français la perception exprimée par le participe latin et la proposition introduite par « quemadmodum ».
- source_word: de eis
  choice: certains d’entre eux
  rationale: Le tour partitif désigne des personnes prises parmi leur groupe ; il ne signifie pas « eux-mêmes », qui demanderait normalement « ipsi ».
- source_word: pertransient in cruciamentum
  choice: passeront dans le tourment
  rationale: Conserve le mouvement vers un état ou un lieu de souffrance exprimé par « pertransire in » et le singulier « cruciamentum ».
theological_decisions:
- issue: Portée de « de eis »
  choice: certains d’entre eux
  alternative: eux-mêmes
  rationale: La lecture partitive est grammaticalement fondée et évite de faire porter le passage au tourment sur l’ensemble du groupe observateur.
- issue: Nature de « cruciamentum »
  choice: le tourment
  alternative: les tourments
  rationale: Le latin est au singulier ; la traduction garde cette forme sans préciser davantage la nature du châtiment.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste proche de la syntaxe latine tout en étant naturelle ; elle préserve l’image de la voie et le caractère indéterminé du tourment.
