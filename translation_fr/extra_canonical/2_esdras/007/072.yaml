source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: fr
  text: 'C’est pourquoi ceux qui demeurent sur la terre seront tourmentés à cause de cela : bien qu’ils eussent du discernement, ils se sont livrés à l’iniquité ; bien qu’ils eussent reçu des commandements, ils ne les ont pas observés ; et bien qu’ils eussent obtenu la Loi, ils ont agi avec perfidie envers elle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’extrait latin reproduit dans les données fournies s’arrête après « ayant obtenu la Loi ». La fin de la phrase suit la continuation attestée dans l’édition de Bensly : « fraudaverunt eam », c’est-à-dire « ils ont agi avec perfidie envers elle ».'
    reason: Signaler avec transparence que les derniers mots traduits appartiennent à la continuation éditoriale attestée, mais ne figurent pas dans l’extrait latin affiché.
lexical_decisions:
- source_word: commorantes sunt in terra
  choice: ceux qui habitent sur la terre
  rationale: Rend directement l’idée de demeurer sur la terre dans un français naturel et digne.
- source_word: sensum habentes
  choice: alors qu’ils avaient l’intelligence
  rationale: Préserve l’idée qu’ils disposaient de compréhension ou de discernement, ainsi que le contraste moral avec leur conduite.
- source_word: iniquitatem fecerunt
  choice: ils ont commis l’iniquité
  rationale: Traduction proche de la formulation latine, sans réduire l’iniquité à une faute particulière.
- source_word: mandata accipientes non seruauerunt ea
  choice: ayant reçu des commandements, ils ne les ont pas observés
  rationale: « Observer » exprime naturellement le fait de garder et mettre en pratique des commandements.
- source_word: legem consecuti
  choice: ayant obtenu la Loi
  rationale: Conserve l’idée d’être parvenu à recevoir ou posséder la Loi ; la majuscule indique ici la Loi donnée comme norme religieuse.
- source_word: fraudaverunt eam
  choice: ils l’ont traitée avec perfidie
  rationale: Rend la notion d’agir de manière trompeuse ou infidèle envers la Loi, sans préciser davantage la forme de cette infidélité.
theological_decisions:
- issue: Rapport entre connaissance morale, commandements et culpabilité
  choice: 'Maintenir les trois concessions successives : intelligence, commandements reçus et Loi obtenue'
  alternative: Fusionner ces éléments en une affirmation générale de désobéissance
  rationale: La progression du texte fonde explicitement le jugement sur des responsabilités distinctes et croissantes ; les fusionner en atténuerait la tension théologique.
- issue: Nature du tourment annoncé
  choice: « seront tourmentés » sans identifier l’agent ni préciser la forme ou la durée du tourment
  alternative: Expliciter un châtiment infligé par Dieu ou un tourment éternel
  rationale: Le passif latin ne nomme pas l’agent et ce verset ne précise ni la modalité ni la durée du tourment.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure ternaire et les contrastes du latin sont conservés, avec une ponctuation qui facilite la lecture à voix haute.
