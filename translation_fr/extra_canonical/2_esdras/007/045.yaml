  text: 'But to you alone I showed these things. Then I answered and said[a], “Lord, then I said, and now I say:'
translation:
  language: fr
  text: 'Mais c’est à toi seul que j’ai montré ces choses. J’ai répondu et dit : « Seigneur, je l’ai dit alors et je le dis maintenant[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin transmis peut aussi se ponctuer plus littéralement : « Alors je répondis et dis : “Seigneur, et maintenant je dis :” » La juxtaposition de « alors » et de « maintenant » favorise toutefois la lecture : « je l’ai dit alors et je le dis maintenant ».'
    reason: La position de « tunc » dans le latin permet une lecture narrative, tandis que le contraste « tunc … nunc » autorise une lecture rhétorique ; la note préserve cette ambiguïté textuelle.
lexical_decisions:
- source_word: tibi autem soli
  choice: Mais c’est à toi seul
  rationale: Rend à la fois le contraste de « autem » et l’exclusivité marquée par « soli », dans un français naturel.
- source_word: ostendi haec
  choice: j’ai montré ces choses
  rationale: Traduction directe du parfait latin « ostendi » et du démonstratif neutre pluriel « haec ».
- source_word: tunc … nunc
  choice: à ce moment-là … maintenant
  rationale: Conserve le contraste temporel intentionnel entre « tunc » et « nunc » sans réduire « tunc » à un simple connecteur narratif.
- source_word: dixi … dico
  choice: je le disais déjà … je le dis encore
  rationale: Exprime en français idiomatique l’opposition entre une parole antérieure et sa réaffirmation présente; les adverbes « déjà » et « encore » explicitent la continuité rhétorique sans ajouter de contenu doctrinal.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La répétition latine « respondi … et dixi » est allégée en « je répondis », tandis que le contraste temporel est maintenu. Les guillemets restent ouverts et le deux-points final est conservé, puisque la phrase se poursuit au verset suivant.
