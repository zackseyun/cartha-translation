  text: car ils ne connaissent ni les tourments ni le salut qui leur a été promis après la mort. Mais nous,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cruciamenta
  choice: les tourments
  rationale: Rend directement le pluriel latin et conserve l’idée de souffrances ou de peines sans en préciser indûment la nature.
- source_word: salutem
  choice: le salut
  rationale: Équivalent naturel et théologiquement non restrictif du latin salutem.
- source_word: post mortem
  choice: après la mort
  rationale: Traduction directe de l’expression temporelle latine.
- source_word: repromissam sibi
  choice: qui leur a été promis
  rationale: Exprime le participe passif et le pronom réfléchi dans un français idiomatique; la valeur renforcée éventuelle de re- n’est pas explicitée, conformément à l’usage latin tardif.
- source_word: Nobis autem
  choice: Mais nous,
  rationale: Conserve la transition contrastive inachevée du texte source et son rattachement nécessaire à la suite.
theological_decisions:
- issue: Rapport entre l’ignorance des tourments et celle du salut promis
  choice: Conserver la coordination « ni… ni… »
  alternative: Interpréter les deux éléments comme une explication développée de l’état des morts
  rationale: Le latin coordonne simplement les deux compléments de sciunt; il ne précise ni leur chronologie ni leur rapport théologique.
- issue: Destinataires du salut promis
  choice: Maintenir le pronom « leur » sans identifier davantage son référent
  alternative: Nommer explicitement les morts, les impies ou les justes
  rationale: Le latin sibi dépend du contexte antérieur; préciser le groupe introduirait une interprétation absente de ce verset.
translation_notes:
  register: Français moderne, clair et digne. La phrase commence par « car » et s’achève sur « Mais nous, » afin de respecter exactement les liaisons discursives du fragment latin et sa frontière de verset.
