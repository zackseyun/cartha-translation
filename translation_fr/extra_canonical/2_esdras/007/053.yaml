lexical_decisions:
- source_word: ad numerum eorum
  choice: selon leur nombre
  rationale: Rend directement l’expression latine et conserve la possible idée d’un classement fondé sur le nombre ou la quantité.
- source_word: compones eos tibi
  choice: tu les classeras pour toi
  rationale: Le futur à la deuxième personne et le datif tibi sont conservés; « classeras » exprime ici l’idée d’ordonner ou de répartir sans la préciser davantage.
- source_word: plumbum
  choice: le plomb
  rationale: Équivalent courant et exact du nom latin.
- source_word: fictile
  choice: l’argile
  rationale: Dans l’opposition entre matières, le substantif neutre renvoie à la terre façonnée ou à l’argile; « argile » est naturel et intelligible dans ce contexte.
- source_word: abundat
  choice: sont en abondance
  rationale: Le latin emploie un singulier malgré les deux matières coordonnées; le français naturel exige ici le pluriel tout en conservant le sens d’abondance.
- source_word: Et
  choice: Et
  rationale: La conjonction finale inachevée est maintenue, car elle appartient au texte source fourni et marque la continuité avec le verset suivant.
