source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: fr
  text: Tel est l’ordre établi par le Très-Haut, quand elles commenceront à être préservées du vase corruptible[a]. Pendant le temps où elles y ont demeuré, elles ont servi le Très-Haut avec peine et, à toute heure, elles ont enduré le danger afin d’observer parfaitement la loi du Législateur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « vase corruptible » désigne vraisemblablement le corps mortel. Le latin transmis lit littéralement : « être sauvées ou préservées du vase corruptible ».'
    reason: Conserver la métaphore et signaler le sens possible de seruari sans affirmer une variante qui n'est pas documentée dans le dossier.
lexical_decisions:
- source_word: ordo
  choice: l’ordre établi
  rationale: « Ordre » conserve l’idée d’un ordre ou d’une disposition fixée, tandis que « établi » rend la phrase naturelle en français.
- source_word: seruari a
  choice: être délivrés de
  rationale: Le latin transmis porte « seruari a », littéralement « être sauvés ou préservés de ». « Être délivrés de » exprime naturellement la sortie hors de la condition corruptible sans adopter la variante « separari ».
- source_word: uaso corruptibili
  choice: vase corruptible
  rationale: Cette formulation conserve l’image concrète du latin et son ambiguïté référentielle, plutôt que de l’expliciter directement par « corps mortel ».
- source_word: cum labore
  choice: avec peine
  rationale: Rend l’effort pénible exprimé par « labor » dans un français actuel et digne.
- source_word: sustinuerunt
  choice: ont affronté
  rationale: Dans le contexte complété par « danger » dans la couche de consultation, ce verbe traduit l’idée d’endurer et de faire face avec constance.
- source_word: legislatoris
  choice: du Législateur
  rationale: Le titre est conservé sans identifier explicitement son référent au-delà de ce que dit le texte.
theological_decisions:
- issue: Rapport entre l’âme et le « vase corruptible »
  choice: Conserver la métaphore « vase corruptible »
  alternative: Expliciter par « corps mortel »
  rationale: Le latin emploie une métaphore qui évoque vraisemblablement le corps, mais l’explicitation supprimerait une part de la tension anthropologique du texte.
- issue: Lecture latine « seruari » face à la variante attendue « separari »
  choice: Traduire le texte fourni par « être délivrés »
  alternative: « être séparés »
  rationale: La traduction suit prioritairement la leçon fournie, « seruari », tout en choisissant un français compatible avec le contexte de la sortie du vase corruptible.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe a été légèrement réorganisée pour la clarté, tout en conservant l’image du vase, le titre « Législateur » et la progression du texte.
