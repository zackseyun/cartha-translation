  source_fidelity: 'La traduction restitue les éléments du texte transmis et la suite attestée par la piste anglaise : l''ordre du Très-Haut, le commencement du salut/de la préservation hors du « vase corruptible », le séjour en lui, le service laborieux, l''endurance du danger et l''observance parfaite de la loi. Toutefois, « pour le moment où » introduit une nuance de finalité ou de destination que quando n''exprime pas : il s''agit simplement du moment où l''événement commence. La note doit aussi éviter de présenter comme un fait établi une variante non documentée dans les données fournies.'
  naturalness: Le registre est sobre et naturel. « Quand elles commenceront » est plus direct et plus fidèle que « pour le moment où elles commenceront ». Le féminin reprend la forme latine commoratae et convient au référent implicite, les âmes, dans ce passage.
  terminology: « Très-Haut », « vase corruptible » et « Législateur » sont bien rendus. « Préservées du » reste plus près de seruari a que « délivrées du », sans éliminer l'ambiguïté de la métaphore. « Avec peine » rend correctement cum labore.
