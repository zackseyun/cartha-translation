  to: Tel est l’ordre établi par le Très-Haut, quand elles commenceront à être préservées du vase corruptible[a]. Pendant le temps où elles y ont demeuré, elles ont servi le Très-Haut avec peine et, à toute heure, elles ont enduré le danger afin d’observer parfaitement la loi du Législateur.
  rationale: La révision rend quando par « quand », conserve la leçon latine seruari au moyen de « être préservées », et emploie le féminin conformément à commoratae, dont le référent est les âmes dans le contexte. La note est resserrée pour ne signaler que ce que permettent les données textuelles fournies.
