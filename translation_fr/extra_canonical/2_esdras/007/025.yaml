  text: Therefore, Ezra, empty things are for the empty, and full things for the full.
translation:
  language: fr
  text: C’est pourquoi, Esdras, les choses vides sont pour ceux qui sont vides, et les choses pleines pour ceux qui sont pleins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: C’est pourquoi
  rationale: Rend naturellement en français la relation de conséquence exprimée par le latin.
- source_word: vacua vacuis
  choice: les choses vides sont pour ceux qui sont vides
  rationale: Préserve le parallélisme et l’ellipse du latin tout en explicitant de façon minimale que le second adjectif désigne des personnes.
- source_word: plena plenis
  choice: les choses pleines pour ceux qui sont pleins
  rationale: Maintient la symétrie antithétique de la formule latine et son ambiguïté quant à la nature précise des « choses pleines ».
theological_decisions:
- issue: Sens métaphorique de « vides » et « pleins »
  choice: Conserver les images sans les interpréter
  alternative: Préciser qu’il s’agit de réalités spirituelles ou de personnes dépourvues ou remplies de sagesse
  rationale: Le verset latin ne définit pas explicitement ces termes; une précision doctrinale réduirait une ambiguïté réelle du texte.
translation_notes:
  register: Français moderne, sobre et sentencieux. La répétition de « choses » conserve l’opposition formelle du latin, tandis que « ceux qui » rend l’usage substantivé des datifs vacuis et plenis intelligible au lecteur courant.
