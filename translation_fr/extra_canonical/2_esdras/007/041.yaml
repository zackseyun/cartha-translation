translation_notes:
  register: Énumération sobre et rythmée, en français moderne et digne. La répétition de « ni » restitue clairement l'anaphore latine, même lorsque le latin ne répète pas « neque » devant chaque dernier élément. La virgule finale est conservée parce que la phrase se poursuit au verset suivant.
