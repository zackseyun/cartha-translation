lexical_decisions:
- source_word: aerem
  choice: air
  rationale: Correspondance directe avec le latin « aerem »; le terme appartient bien à ce verset dans la délimitation fournie.
- source_word: sero
  choice: soir
  rationale: Dans cette série opposant des moments et des saisons, « soir » rend naturellement le latin, dont la forme est probablement employée pour « serum ».
- source_word: aestum
  choice: chaleur
  rationale: Rend la chaleur ou l'ardeur estivale sans la confondre avec « aestatem » (« été »).
- source_word: gelu
  choice: gel
  rationale: « Gel » conserve la distinction avec « frigus », rendu par « froid ».
- source_word: grandi-
  choice: grêle
  rationale: Le mot coupé en fin de ligne correspond à « grandinem »; « grêle » est son équivalent naturel.
