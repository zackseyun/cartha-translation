lexical_decisions:
- source_word: ingredientur
  choice: entreront
  rationale: Rend directement le futur latin. La négation qui régit ce verbe se trouve à la fin du verset précédent dans cette division du texte.
- source_word: uagantes erunt
  choice: ils erreront
  rationale: Exprime le déplacement sans repos ni destination suggéré par uagari, tout en conservant la valeur future de la périphrase latine.
- source_word: amodo
  choice: désormais
  rationale: Équivalent français naturel indiquant qu'une nouvelle condition commence dès ce moment.
- source_word: in cruciamentis
  choice: dans les tourments
  rationale: Conserve le pluriel et la forte idée de souffrances pénibles portée par cruciamenta.
- source_word: dolentes semper et tristes
  choice: toujours affligés et tristes
  rationale: Préserve les deux qualifications distinctes ainsi que la portée de semper.
theological_decisions:
- issue: Lien syntaxique avec la négation du verset précédent
  choice: Conserver « entreront » dans le texte du verset et signaler en note que la lecture continue est négative
  alternative: Introduire directement « n’entreront pas » dans ce verset
  rationale: Le texte latin fourni commence par ingredientur, tandis que non se trouve à la fin du verset 80. Cette présentation respecte à la fois le découpage éditorial et le sens syntaxique continu sans dissimuler l'anomalie.
translation_notes:
  register: Français international moderne, sobre et digne. « Erreront » conserve l'image d'une condition sans repos ; le point-virgule aide à rendre lisible ce fragment de phrase dépendant du verset précédent.
