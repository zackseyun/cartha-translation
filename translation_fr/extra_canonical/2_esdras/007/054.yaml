  text: 'Je dis : « Seigneur, comment cela est-il possible ? » Et il me dit : « Ce n’est pas là tout ; mais interroge— »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quomodo poterit?
  choice: comment cela est-il possible ?
  rationale: Le futur latin de possibilité se rend naturellement par cette question en français moderne, sans préciser davantage le référent implicite de « cela ».
- source_word: non hoc solummodo
  choice: Ce n’est pas tout
  rationale: Formulation idiomatique qui exprime que la réponse ne se limite pas au point précédent.
- source_word: sed interroga
  choice: interroge plutôt—
  rationale: « Interroger » conserve la force directe de l’impératif; « plutôt » marque l’opposition introduite par sed. Le tiret indique que la phrase se poursuit dans le verset suivant.
theological_decisions:
- issue: Référent implicite dans « quomodo poterit »
  choice: Conserver « cela » sans explicitation
  alternative: Préciser ce qui serait possible d’après le contexte précédent
  rationale: Le texte latin laisse le référent implicite; l’expliciter risquerait de résoudre indûment une ambiguïté contextuelle.
