  text: Et quoniam praedicta est nobis perennis spes, nos vero pessime vani facti sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/120.yaml
  text: And if everlasting hope has been foretold to us[a], but we have become utterly vain?
translation:
  language: fr
  text: Et puisqu’une espérance éternelle nous a été annoncée d’avance, alors que nous sommes pourtant devenus tout à fait vains[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vides » ou « sans consistance ». Le latin évoque ce qui est creux, vain ou futile, et non nécessairement la vanité au sens de l’orgueil.
    reason: Le français « vains » peut être compris au sens de « vaniteux » ; la note indique le champ sémantique de vani appliqué aux personnes.
lexical_decisions:
- source_word: praedicta est
  choice: a été annoncée d’avance
  rationale: Rend le sens littéral de l’annonce préalable sans imposer la nuance plus technique de « prophétisée ».
- source_word: perennis spes
  choice: une espérance éternelle
  rationale: « Éternelle » exprime naturellement en français la durée permanente de perennis dans ce contexte eschatologique.
- source_word: pessime vani
  choice: si vains
  rationale: Préserve l’image latine de vacuité et d’inanité, tout en évitant « futiles », qui décrirait plus volontiers des actes ou des préoccupations que des personnes.
theological_decisions:
- issue: Lien logique et forme interrogative de quoniam… vero
  choice: « Et puisque… pourquoi… ? »
  alternative: « Et si… mais… ? »
  rationale: Quoniam a normalement une valeur causale (« puisque »), tandis que vero marque le contraste. La formulation française explicite sobrement l’interrogation implicite et produit une question intelligible sans résoudre la tension théologique.
- issue: Portée de vani appliqué aux êtres humains
  choice: « vains » avec note explicative
  alternative: « entièrement futiles » ou « absolument sans valeur »
  rationale: « Vains » conserve la polysémie biblique de vanus — vide, inconsistant, sans effet — sans transformer le propos en jugement absolu sur la valeur humaine.
translation_notes:
  register: Français moderne, courant et digne. La tournure causale rend quoniam directement ; la note empêche une lecture psychologique de « vains » au sens de « vaniteux ».
