  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
translation:
  language: fr
  text: Puisque les visages de ceux qui ont pratiqué la maîtrise de soi brilleront plus que les étoiles[a], mais que nos visages seront plus noirs que les ténèbres ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au-dessus des étoiles » ; le contexte favorise le sens comparatif : « plus que les étoiles ».'
    reason: Le latin « super » peut être spatial, mais le parallélisme avec « plus noirs que les ténèbres » favorise ici une comparaison d’intensité.
lexical_decisions:
- source_word: abstinentiam habuerunt
  choice: ont pratiqué la maîtrise de soi
  rationale: Rend l’idée d’une discipline personnelle vécue, sans réduire « abstinentia » à la seule abstinence alimentaire ou sexuelle.
- source_word: super stellas fulgebunt
  choice: brilleront plus que les étoiles
  rationale: 'Le parallèle avec « super tenebras nigrae » favorise une valeur comparative de « super » : leur éclat dépassera celui des étoiles.'
- source_word: super tenebras nigrae
  choice: plus noirs que les ténèbres
  rationale: Conserve l’image forte et la construction comparative du latin.
- source_word: vero
  choice: tandis que
  rationale: Marque naturellement le contraste entre leur destinée et la nôtre.
theological_decisions:
- issue: Portée de « abstinentia »
  choice: maîtrise de soi
  alternative: abstinence
  rationale: « Maîtrise de soi » garde une portée morale générale et évite d’introduire une pratique ascétique particulière non précisée par le texte.
- issue: Sens de « super stellas »
  choice: 'comparatif : plus que les étoiles'
  alternative: 'spatial : au-dessus des étoiles'
  rationale: Le parallélisme avec « plus noirs que les ténèbres » indique vraisemblablement une comparaison d’intensité, tout en laissant la lecture littérale en note.
translation_notes:
  register: Français moderne, digne et accessible. La tournure interrogative et le « parce que » initial sont conservés, car le verset poursuit une question dans son contexte littéraire.
