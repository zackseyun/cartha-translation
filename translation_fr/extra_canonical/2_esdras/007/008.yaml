  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
translation:
  language: fr
  text: Mais un seul sentier est placé entre eux, c’est-à-dire entre le feu et l’eau, de sorte que le sentier ne peut accueillir que l’empreinte du pied d’un homme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: semita
  choice: sentier
  rationale: « Sentier » exprime naturellement une voie étroite et convient à l’image développée par la proposition finale.
- source_word: inter eos posita
  choice: tracé entre eux
  rationale: Rend l’idée d’un chemin placé ou établi entre les deux éléments déjà évoqués, dans un français idiomatique.
- source_word: hoc est ignis et aqua
  choice: c’est-à-dire entre le feu et l’eau
  rationale: L’explication désigne clairement les référents de « eux » ; la répétition de « entre » explicite la relation syntaxique sous-entendue dans le latin.
- source_word: vestigium hominis
  choice: un seul pas d’homme
  rationale: Dans ce contexte de largeur praticable, « pas d’homme » rend l’empreinte ou l’espace occupé par le pied humain sans suggérer que le sentier retient matériellement une empreinte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et imagé. La formulation conserve l’extrême étroitesse du passage tout en évitant le calque peu naturel selon lequel un sentier « contient une empreinte ».
