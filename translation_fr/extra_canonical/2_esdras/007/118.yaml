  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
translation:
  language: fr
  text: Ô Adam, qu’as-tu fait ? Car si tu as péché, ta chute n’a pas été seulement la tienne, mais aussi la nôtre, à nous qui sommes issus de toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: O tu quid fecisti, Adam?
  choice: Ô Adam, qu’as-tu fait ?
  rationale: Conserve l’apostrophe solennelle et le reproche direct, dans un français naturel et digne.
- source_word: si enim tu peccasti
  choice: Car si tu as péché
  rationale: Rend directement si par « si » sans effacer l’ambiguïté entre valeur conditionnelle et nuance concessive; le pronom explicite tu est maintenu.
- source_word: casus
  choice: chute
  rationale: Dans ce contexte adamique, « chute » exprime à la fois la faute et ses conséquences, tout en restant proche du terme latin.
- source_word: qui ex te advenimus
  choice: à nous qui sommes issus de toi
  rationale: Rend l’origine et la descendance exprimées par ex te dans un français idiomatique; « issus de toi » convient mieux que le calque « venus de toi ».
theological_decisions:
- issue: Valeur de si dans si enim tu peccasti
  choice: « si tu as péché »
  alternative: « bien que ce soit toi qui aies péché »
  rationale: Le contexte peut favoriser une lecture concessive, mais le latin transmis emploie si. La traduction conserve donc la formulation conditionnelle et sa tension plutôt que de trancher implicitement.
- issue: Portée collective de la chute d’Adam
  choice: « ta chute n’a pas été seulement la tienne, mais aussi la nôtre »
  alternative: « les conséquences de ta chute ne t’ont pas atteint seul »
  rationale: La formulation choisie suit de près casus... tuus... et nostrum et préserve l’affirmation forte du texte sans l’expliquer selon un cadre doctrinal particulier.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’ordre a été légèrement ajusté pour la fluidité, tout en maintenant le contraste entre Adam seul et ses descendants.
