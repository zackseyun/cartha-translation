source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et terra reddet qui in eam dormiunt, et pulvis qui in eo silentio habitant, et promptuaria reddent quae eis commendatae sunt animae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
translation:
  language: fr
  text: Et la terre rendra ceux qui dorment en elle, et la poussière rendra ceux qui y habitent dans le silence, et les dépôts rendront les âmes qui leur ont été confiées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra reddet
  choice: la terre rendra
  rationale: Reproduit directement l’image eschatologique de la terre restituant les morts.
- source_word: qui in eam dormiunt
  choice: ceux qui dorment en elle
  rationale: Conserve la métaphore traditionnelle du sommeil pour la mort ainsi que le pronom féminin renvoyant à la terre.
- source_word: pulvis
  choice: la poussière
  rationale: Équivalent naturel et formel, qui maintient le parallèle entre la terre et la poussière.
- source_word: qui in eo silentio habitant
  choice: ceux qui y habitent dans le silence
  rationale: Suit la syntaxe latine en rattachant in eo à habitant et conserve l’image distincte d’une habitation silencieuse.
- source_word: promptuaria
  choice: les lieux où elles sont gardées
  rationale: Le pluriel désigne des réserves ou dépôts; cette formulation française claire évite l’image moderne trompeuse de « magasins » tout en gardant l’idée de lieux de conservation.
- source_word: quae eis commendatae sunt animae
  choice: les âmes qui leur ont été confiées
  rationale: Rend le sens de dépôt confié exprimé par commendatae et préserve le pluriel des lieux gardiens.
theological_decisions:
- issue: Rapport entre les morts corporels et les âmes conservées
  choice: Maintenir les deux images successives sans les harmoniser explicitement
  alternative: Expliquer que les corps sortent de la terre tandis que les âmes sortent de demeures séparées
  rationale: Le texte juxtapose la restitution par la terre, la poussière et les promptuaria sans exposer systématiquement leur rapport; la traduction ne doit pas résoudre cette tension.
- issue: Valeur de « dormir »
  choice: Conserver la métaphore « dorment »
  alternative: Traduire explicitement par « sont morts »
  rationale: Le latin emploie dormiunt; garder l’image respecte le langage eschatologique du passage sans imposer une doctrine particulière sur l’état des morts.
translation_notes:
  register: Français international moderne, digne et accessible. La structure ternaire et le parallélisme du latin sont conservés. Aucun marqueur de note n’est requis, car la construction latine peut être rendue sans variante nécessaire en français.
