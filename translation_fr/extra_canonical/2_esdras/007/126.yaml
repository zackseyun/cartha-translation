source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non enim cogitavimus viventes quando iniquitatem faciebamus, quidincipientes post mortem pati.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
translation:
  language: fr
  text: « En effet, lorsque nous vivions et commettions l’iniquité, nous n’avons pas réfléchi à ce que nous commencerions[a] à subir après la mort. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin est altéré à cet endroit ; la correction probable donne « nous commencerions ».
    reason: Signaler avec transparence la corruption graphique « quidincipientes », comprise d’après le contexte et la correction éditoriale comme quid incipiemus.
lexical_decisions:
- source_word: iniquitatem
  choice: l’iniquité
  rationale: Rend directement le nom latin et conserve sa portée morale et théologique sans l’atténuer en simple «mal».
- source_word: incipiemus … pati
  choice: nous commencerions à subir
  rationale: Conserve la valeur inchoative de incipere et exprime naturellement en français le début des souffrances après la mort.
- source_word: post mortem
  choice: après la mort
  rationale: Équivalent direct, naturel et non interprétatif de la locution latine.
theological_decisions:
- issue: Début de la souffrance après la mort
  choice: commencerions à subir
  alternative: aurions à subir
  rationale: Le verbe latin indique le commencement d’un état ou d’une expérience, non une simple obligation. La traduction conserve ainsi la temporalité eschatologique du passage sans l’amplifier.
translation_notes:
  register: Français moderne, digne et accessible. La structure temporelle latine, assez lourde littéralement, est réorganisée avec «lorsque» pour produire une phrase naturelle tout en conservant le contraste entre la conduite durant la vie et ses conséquences après la mort.
