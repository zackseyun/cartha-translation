  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
translation:
  language: fr
  text: Car il vaut mieux que beaucoup de ceux qui sont présents périssent[a] plutôt que la loi de Dieu, qui a été proposée, soit négligée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui vivent maintenant ».
    reason: Praesentes peut désigner ceux qui sont actuellement présents ou, selon le contexte, ceux qui vivent à l’époque présente.
lexical_decisions:
- source_word: enim
  choice: Car
  rationale: Conserve le lien explicatif avec ce qui précède.
- source_word: multi praesentes
  choice: beaucoup de ceux qui sont présents
  rationale: Rend au plus près praesentes sans ajouter un lieu ni réduire explicitement le sens aux seuls vivants de cette époque.
- source_word: pereant
  choice: que … périssent
  rationale: Le subjonctif français garde la valeur volitive du subjonctif latin et évite de transformer l’énoncé en simple constat.
- source_word: quam neglegatur
  choice: plutôt que ne soit négligée
  rationale: Exprime la préférence comparative entre les deux éventualités; le ne est explétif et ne change pas le sens.
- source_word: anteposita est
  choice: a été mise en avant
  rationale: Conserve l’image d’une loi placée devant ou au premier plan, sans ajouter un bénéficiaire absent du latin.
theological_decisions:
- issue: Préférence entre la perte d’un grand nombre et la négligence de la loi divine
  choice: Maintenir directement la formulation comparative et sa tension
  alternative: Atténuer par « il vaut mieux » ou expliciter une justification morale
  rationale: Le latin formule abruptement cette priorité sans en résoudre la difficulté théologique; la traduction ne doit ni l’adoucir ni la développer.
translation_notes:
  register: Français international moderne, digne et volontairement solennel. L’inversion « ne soit négligée » maintient la lisibilité tout en reflétant la structure contrastive du latin.
