source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
translation:
  language: fr
  text: Ils ont méprisé sa loi et renié ses promesses ; ils n’ont pas été fidèles à ses prescriptions et n’ont pas accompli ses œuvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spreverunt
  choice: ont méprisé
  rationale: Rend directement l’idée de dédain et de rejet exprimée par le verbe latin.
- source_word: sponsiones
  choice: promesses
  rationale: Dans ce contexte, sponsio désigne des promesses ou assurances données ; « alliances » introduirait une notion que le latin exprime normalement autrement.
- source_word: legitimis
  choice: prescriptions
  rationale: Le substantif legitima renvoie ici aux règles ou ordonnances établies par Dieu ; « prescriptions » est précis et naturel en français moderne.
- source_word: fidem non habuerunt
  choice: n’ont pas eu foi en
  rationale: Suit de près la construction latine fidem habere avec le datif, tout en conservant l’ambiguïté possible entre confiance et fidélité pratique.
- source_word: opera eius non perfecerunt
  choice: n’ont pas accompli ses œuvres
  rationale: « Accomplir » restitue perficere sans préciser indûment s’il s’agit des œuvres de Dieu ou des œuvres qu’il demande.
theological_decisions:
- issue: Sens de sponsiones eius
  choice: ses promesses
  alternative: ses alliances
  rationale: Sponsiones désigne ici les promesses divines. Traduire par « alliances » confondrait ce terme avec le vocabulaire latin habituel de l’alliance, notamment testamentum.
- issue: Portée de fidem non habuerunt envers les prescriptions
  choice: n’ont pas eu foi en ses prescriptions
  alternative: n’ont pas été fidèles à ses prescriptions
  rationale: La formulation retenue reflète plus formellement le latin et préserve la possibilité d’un manque de confiance, tandis que l’autre lecture met l’accent sur le manque d’obéissance ou de fidélité.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des quatre propositions est conservé, avec un point-virgule pour rendre la phrase naturelle sans en atténuer l’accumulation.
