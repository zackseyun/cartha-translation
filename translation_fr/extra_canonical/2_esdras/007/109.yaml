  text: and Elijah for those who received rain and for the dead man, that he might live,
translation:
  language: fr
  text: et Élie pour ceux qui reçurent la pluie, et pour le mort, afin qu’il vive,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Helias
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: qui pluviam acceperunt
  choice: ceux qui reçurent la pluie
  rationale: Rend directement le pluriel latin et l’idée que la pluie fut accordée à ceux en faveur de qui Élie intercéda.
- source_word: pro mortuo
  choice: pour le mort
  rationale: Conserve le singulier substantivé du latin sans préciser davantage l’identité de l’homme.
- source_word: ut viveret
  choice: afin qu’il vive
  rationale: Exprime la finalité de l’intercession tout en conservant la valeur du subjonctif imparfait latin dans une formulation française naturelle.
theological_decisions:
- issue: Nature de l’action d’Élie
  choice: Conserver la formulation elliptique « Élie pour… » dans cette portion de liste
  alternative: Ajouter explicitement « pria » ou « intercéda »
  rationale: Le verset appartient à une énumération d’intercesseurs; le latin omet ici le verbe. Ne pas l’ajouter préserve la structure et évite de préciser au-delà du texte fourni.
- issue: Résultat ou but concernant le mort
  choice: « afin qu’il vive »
  alternative: « et il revint à la vie »
  rationale: Le latin ut viveret formule le but ou la visée, non une simple narration explicite du résultat.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe volontairement elliptique reflète celle de l’énumération latine; la virgule avant « afin que » clarifie que la proposition finale concerne le mort.
