id: 2ES.7.70
reference: 2 Esdras 7:70
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
translation:
  language: fr
  text: 'Il me répondit : « Lorsque le Très-Haut créait le monde[b], il prépara d’abord, pour Adam et tous ceux qui vinrent avec lui[a], le jugement et tout ce qui s’y rapporte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une autre tradition ancienne peut se comprendre : « issus de lui ». Le latin porte : « avec lui ».'
    reason: Préserve la variante signalée dans la tradition de consultation tout en donnant priorité au texte latin de base.
  - marker: b
    text: 'Ou : « l’âge » ou « l’ère ».'
    reason: Le latin saeculum peut désigner aussi bien le monde que l’époque ou l’âge.
lexical_decisions:
- source_word: Altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel, exact et immédiatement compréhensible en français moderne.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte de création, « le monde » rend naturellement le sens de l’ordre créé, tout en signalant en note le sens temporel également possible du latin.
- source_word: iudicium et quae sunt iudicii
  choice: le jugement et tout ce qui s’y rapporte
  rationale: Restitue l’expression latine littérale « le jugement et les choses du jugement » dans un français naturel sans préciser indûment la nature de ces réalités.
- source_word: cum eo
  choice: avec lui
  rationale: Traduction directe du latin cum eo; elle évite de substituer la leçon interprétative « issus de lui » au texte de base.
theological_decisions:
- issue: Rapport d’Adam et des autres humains avec le jugement préparé
  choice: pour Adam et tous ceux qui vinrent avec lui
  alternative: Adam et tous ceux qui vinrent avec lui comme autre objet de « créait »
  rationale: L’ordre retenu suit la compréhension contextuelle attestée par la couche de consultation et rattache ce groupe au jugement préparé; il donne une phrase française cohérente sans ajouter de conclusion doctrinale.
- issue: Sens cosmique ou temporel de saeculum
  choice: le monde dans le texte, avec « l’âge » en note
  alternative: l’âge
  rationale: Le contexte évoque l’acte créateur, mais le latin saeculum conserve une nuance temporelle réelle qui mérite d’être signalée.
translation_notes:
  register: Français moderne, digne et accessible. La répétition latine faciens faciebat n’est pas reproduite mécaniquement, car elle serait lourde en français; l’imparfait « créait » en conserve l’aspect progressif. Les marqueurs sont placés précisément après les expressions concernées.
