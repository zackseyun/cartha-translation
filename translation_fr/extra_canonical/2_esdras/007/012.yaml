source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et facti sunt introitus huius saeculi angusti et dolentes et laboriosi, paucae autem et malae et periculorum plenae et laborum magnorum fultae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
translation:
  language: fr
  text: Et les accès à ce monde sont devenus étroits, douloureux et laborieux[a], peu nombreux et mauvais, pleins de dangers et chargés de grandes épreuves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pénibles ».
    reason: Le latin « dolentes » désigne ce qui cause de la douleur; selon le contexte, il peut aussi être rendu plus largement par « pénibles ».
lexical_decisions:
- source_word: introitus
  choice: les accès
  rationale: Rend naturellement le pluriel latin « introitus » dans le sens de voies ou points d'entrée, sans imposer l'image plus précise de portes.
- source_word: huius saeculi
  choice: à ce monde
  rationale: Dans ce contexte apocalyptique, « saeculum » désigne le monde ou l'âge présent; « ce monde » est idiomatique et laisse le contraste eschatologique au contexte.
- source_word: dolentes
  choice: pénibles
  rationale: Appliqué aux accès, le terme indique qu'ils causent peine ou douleur plutôt qu'ils n'éprouvent eux-mêmes du chagrin.
- source_word: laboriosi
  choice: laborieux
  rationale: Conserve l'idée de voies exigeant beaucoup d'efforts et maintient la série adjectivale du latin.
- source_word: paucae
  choice: peu nombreux
  rationale: Accord sémantique avec « accès » en français; traduit directement la rareté exprimée par le latin.
- source_word: malae
  choice: mauvais
  rationale: Préserve l'adjectif général et potentiellement ambigu du latin sans le réduire à « difficiles » ou à une qualification strictement morale.
- source_word: laborum magnorum fultae
  choice: chargés de grandes épreuves
  rationale: Le latin exprime paradoxalement le fait d'être soutenus ou pourvus de grands labeurs; « chargés de » restitue ici le poids accumulé, tandis que « épreuves » est plus naturel que « travaux » dans ce contexte.
theological_decisions:
- issue: Sens de « huius saeculi »
  choice: ce monde
  alternative: cet âge
  rationale: « Ce monde » est clair en français courant et compatible avec le contraste entre l'ordre présent et le monde à venir, sans expliciter davantage que le texte.
- issue: Portée de « malae »
  choice: mauvais
  alternative: funestes
  rationale: Le terme général conserve la tension entre qualité mauvaise, pénibilité et éventuel danger moral; « funestes » préciserait indûment.
translation_notes:
  register: Français moderne, digne et accessible. La coordination accumulative et la densité des adjectifs sont conservées pour refléter la rhétorique latine.
