review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle au latin, y compris la juxtaposition non interprétée de l’épouse et de la « ville qui apparaît ». Toutefois, les deux-points suivis de « lorsque » absorbent « et erit quando » dans une subordonnée temporelle plus régulière et atténuent sa formulation explicite. « Il arrivera que » rend plus directement et naturellement cette séquence. « Retiré de la terre » rend plus usuellement subducitur terra que « soustrait à la terre », sans résoudre l’image.
  naturalness: Le français est globalement soutenu et clair. La reprise explicite de « apparaîtra » pour la ville évite une ellipse française un peu heurtée, tout en conservant la construction latine ambiguë dans laquelle apparescens qualifie civitas. Le déplacement de la note a auprès des images qu’elle commente améliore nettement son ancrage.
  terminology: « Épouse » pour sponsa est exact et non interprétatif. « La ville qui apparaît » respecte apparescens civitas et ne substitue pas la lecture reconstruite « la ville maintenant cachée ». « Montré » préserve le passif d’ostendetur.
