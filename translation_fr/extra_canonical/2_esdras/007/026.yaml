  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
translation:
  language: fr
  text: 'Car voici : le temps viendra, et il arrivera que les signes que je t’ai annoncés d’avance viendront ; l’épouse apparaîtra, ainsi que la ville qui apparaît[a], et ce qui est maintenant retiré de la terre sera montré.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les images juxtaposées de l’épouse qui apparaît et de la ville peuvent condenser le symbolisme apocalyptique du rétablissement de Sion ou de Jérusalem. Le latin, très concis, n’explique pas leur relation.
    reason: compositional_layer
lexical_decisions:
- source_word: ecce enim
  choice: Car voici
  rationale: Conserve à la fois la relation explicative de enim et la valeur présentative et solennelle de ecce.
- source_word: sponsa
  choice: l’épouse
  rationale: Rend directement le latin sponsa sans préciser de manière interprétative son identité symbolique.
- source_word: apparescens civitas
  choice: la ville qui apparaît
  rationale: Reproduit la tournure participiale explicite du latin et n’importe pas la reconstruction selon laquelle la ville serait actuellement cachée.
- source_word: subducitur terra
  choice: soustrait à la terre
  rationale: Respecte la construction latine, où terra peut être comprise comme un datif, tout en préservant l’étrangeté et l’ambiguïté de l’image.
- source_word: ostendetur
  choice: sera montré
  rationale: Maintient le passif futur du texte source.
theological_decisions:
- issue: Rapport entre l’épouse et la ville
  choice: Les deux images sont conservées côte à côte sans les identifier explicitement.
  alternative: Identifier l’épouse à la ville ou à Jérusalem/Sion.
  rationale: Le latin juxtapose sponsa et apparescens civitas sans expliquer leur relation; une identification explicite résoudrait indûment la tension du texte.
- issue: État de la ville
  choice: la ville qui apparaît
  alternative: la ville maintenant cachée apparaîtra
  rationale: L’alternative correspond à une reconstruction textuelle possible, mais non au latin fourni, qui porte apparescens civitas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase a été légèrement restructurée par les deux-points et « lorsque » afin d’éviter une succession pesante de coordinations, tout en conservant l’enchaînement temporel et les passifs du latin.
