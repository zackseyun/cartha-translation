source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
translation:
  language: fr
  text: Si donc, maintenant, alors que la corruption s’est accrue et que l’injustice s’est multipliée, les justes ont prié pour les impies, pourquoi n’en sera-t-il pas de même alors aussi ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptibile
  choice: la corruption
  rationale: Le latin substantivé peut désigner ce qui est corruptible ou l’état de corruption. Dans ce contexte parallèle à l’injustice qui se multiplie, « la corruption » donne un sens naturel sans surinterpréter.
- source_word: increvit
  choice: s’est accrue
  rationale: Rend l’idée d’une augmentation déjà survenue, en accord avec le parfait latin.
- source_word: iniustitia multiplicata est
  choice: l’injustice s’est multipliée
  rationale: Traduction directe qui conserve le parallélisme et l’aspect accompli du latin.
- source_word: exoraverunt
  choice: ont prié pour
  rationale: Dans la construction avec « pro », le verbe exprime ici une supplication ou intercession en faveur d’autrui.
- source_word: impiis
  choice: les impies
  rationale: Équivalent français courant dans le registre biblique, désignant ceux qui ne respectent pas Dieu ou la justice.
- source_word: quare et tunc sic non erit
  choice: pourquoi n’en sera-t-il pas de même alors aussi ?
  rationale: « de même » rend « sic », tandis que « aussi » préserve la valeur additive de « et » et la comparaison entre maintenant et alors.
theological_decisions:
- issue: Intercession des justes pour les impies au temps futur
  choice: Conserver la question sans préciser les conditions ni l’efficacité de cette intercession.
  alternative: Expliquer qu’il s’agit spécifiquement d’une intercession au jour du jugement ou après celui-ci.
  rationale: Le verset formule une comparaison interrogative mais ne définit pas ici le moment exact ni le résultat de l’intercession; une précision doctrinale résoudrait indûment cette tension.
translation_notes:
  register: Français moderne, digne et lisible. La structure argumentative « Si donc… pourquoi… ? » est conservée, ainsi que le contraste temporel entre « dès maintenant » et « alors aussi ».
