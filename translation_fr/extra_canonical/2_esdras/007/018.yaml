source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iusti autem ferent angusta sperantes spatiosa; qui enim impie gesserunt, et angustiam passi sunt et spatiosa non viderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
translation:
  language: fr
  text: Mais les justes supporteront ce qui est étroit[a], dans l’espoir de ce qui est vaste[b] ; car ceux qui ont agi avec impiété ont à la fois subi l’étroitesse et n’ont pas vu ce qui est vaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses étroites » ; le latin peut évoquer des situations pénibles ou des passages resserrés.'
    reason: Préserver la forme substantivée et l’ambiguïté de angusta.
  - marker: b
    text: 'Littéralement : « les choses vastes » ; la même expression revient à la fin du verset.'
    reason: Signaler le pluriel substantivé latin et la cohésion de l’image spatiale.
lexical_decisions:
- source_word: iusti
  choice: les justes
  rationale: Équivalent français direct, naturel et théologiquement non restrictif du pluriel latin.
- source_word: ferent
  choice: supporteront
  rationale: Conserve le futur et l’idée d’endurer ou de porter une situation pénible.
- source_word: angusta
  choice: ce qui est étroit
  rationale: Rend l’adjectif neutre pluriel substantivé sans préciser arbitrairement s’il s’agit de passages, de circonstances ou d’épreuves, tout en maintenant l’image spatiale.
- source_word: sperantes
  choice: dans l’espoir de
  rationale: Formulation française naturelle qui conserve l’attente confiante exprimée par le participe présent.
- source_word: spatiosa
  choice: ce qui est vaste
  rationale: Préserve le contraste spatial avec angusta sans ajouter un référent absent du latin.
- source_word: impie gesserunt
  choice: ont agi avec impiété
  rationale: Rend le comportement impie plutôt qu’une simple identité attribuée aux personnes.
- source_word: angustiam
  choice: l’étroitesse
  rationale: Maintient la reprise lexicale et l’opposition spatiale voulue avec spatiosa.
- source_word: et… et…
  choice: à la fois… et…
  rationale: Reproduit la structure corrélative latine et souligne le double malheur des impies.
theological_decisions:
- issue: Référent de l’opposition entre l’étroit et le vaste
  choice: Conserver l’image sans identifier explicitement des épreuves présentes, une voie morale ou une récompense future.
  alternative: Traduire par « détresse » et « bonheur », ou par « passages étroits » et « vastes espaces ».
  rationale: Le latin emploie des termes spatiaux substantivés et laisse leur référent implicite ; l’expliciter résoudrait une ambiguïté réelle du texte.
- issue: Portée de l’espérance des justes
  choice: Conserver simplement « dans l’espoir de », sans définir l’objet comme salut, royaume ou récompense.
  alternative: Ajouter une interprétation eschatologique explicite.
  rationale: Le contraste peut porter une dimension eschatologique, mais celle-ci n’est pas nommée dans le verset.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation « ce qui est étroit / ce qui est vaste » est volontairement légèrement imagée afin de préserver l’opposition lexicale du latin sans imposer un référent. Le balancement « à la fois… et… » restitue l’insistance rhétorique de et… et….
