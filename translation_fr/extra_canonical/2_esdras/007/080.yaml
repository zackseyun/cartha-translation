  text: these spirits will not enter habitations[a], but will wander from now on in torments, always grieving and sad, in seven ways.
translation:
  language: fr
  text: Ces esprits[a] n’entreront pas dans les demeures, mais ils erreront désormais dans les tourments, toujours affligés et tristes, de sept manières.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De tels esprits n’entreront pas dans les demeures, mais ils erreront désormais dans les tourments, toujours affligés et tristes, de sept manières. »'
    reason: La formulation peut être comprise soit comme un renvoi direct aux esprits décrits dans le contexte, soit comme une caractérisation générale de tels esprits.
lexical_decisions:
- source_word: inspirationes
  choice: esprits
  rationale: Dans ce contexte concernant le sort des morts, le terme désigne les esprits des personnes évoquées, plutôt que de simples « souffles » ou « inspirations ».
- source_word: habitationes
  choice: demeures
  rationale: « Demeures » conserve le sens spatial et eschatologique du latin sans préciser indûment la nature de ces lieux.
- source_word: amodo
  choice: désormais
  rationale: Rend naturellement le point de départ temporel indiqué par le latin.
- source_word: per septem vias
  choice: selon sept voies
  rationale: Préserve l’image des « voies » et introduit la série en sept parties annoncée par le verset suivant.
theological_decisions:
- issue: Nature des êtres qui subissent les tourments
  choice: Ces esprits
  alternative: De tels esprits / Ces âmes
  rationale: Le démonstratif renvoie directement au groupe décrit dans le contexte, tandis que « esprits » reste proche du terme latin et évite d’imposer une anthropologie plus précise.
- issue: Nature des « demeures »
  choice: Ne pas les identifier davantage
  alternative: Les demeures célestes / les lieux de repos
  rationale: Le texte ne définit pas explicitement ces demeures dans ce verset; la traduction conserve donc cette ouverture.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve la progression vers les sept voies de tourment exposées dans les versets suivants.
