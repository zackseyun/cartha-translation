source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
translation:
  language: fr
  text: Car un cœur mauvais s’est développé en nous. Il nous a éloignés de ces choses[a], nous a conduits à la corruption et sur les chemins de la mort, nous a montré les sentiers de la perdition et nous a tenus loin de la vie. Et cela n’est pas arrivé à quelques-uns seulement, mais à presque tous ceux qui ont été créés.»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin porte «de ces choses». Plusieurs anciennes versions ont «de lui», c’est-à-dire de Dieu.
    reason: Signaler une variante textuelle importante sans masquer la leçon de l’édition latine de base.
lexical_decisions:
- source_word: cor malum
  choice: un cœur mauvais
  rationale: Rend directement l’expression latine tout en conservant le «cœur» comme centre moral et intérieur de la personne.
- source_word: Increuit ... in nos
  choice: s’est développé en nous
  rationale: Exprime une croissance intérieure progressive; «a grandi en nous» serait plus littéral, mais moins naturel ici en français.
- source_word: corruptionem
  choice: la corruption
  rationale: Conserve le terme théologiquement chargé et l’idée d’un état de dégradation.
- source_word: itinera mortis / semitas perditionis
  choice: les chemins de la mort / les sentiers de la perdition
  rationale: Maintient le parallélisme et la variation des images de voie présentes dans le latin.
- source_word: longe fecit nos a uita
  choice: nous a tenus loin de la vie
  rationale: Formulation française naturelle qui préserve l’éloignement causé par le cœur mauvais.
theological_decisions:
- issue: Référent de «ab his»
  choice: de Dieu
  alternative: de ces choses
  rationale: Le latin transmis porte «ab his» («de ceux-ci/de ces choses»), mais les anciennes versions syriaque, éthiopienne, arabe et arménienne soutiennent un texte sous-jacent signifiant «de lui», avec Dieu pour référent. La leçon retenue reflète donc probablement mieux le texte antérieur, tout en signalant la lecture latine en note.
- issue: Agent des actions successives
  choice: le cœur mauvais demeure le sujet de toute la série
  alternative: rendre certaines propositions de manière impersonnelle
  rationale: La syntaxe latine rattache les verbes «a éloignés», «a conduits», «a montré» et «a tenus loin» au «cœur mauvais», ce qui conserve la tension anthropologique du passage.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme des images de chemin est conservé sans alourdir la phrase. Les guillemets fermants indiquent la fin de la prise de parole commencée dans le contexte précédent.
