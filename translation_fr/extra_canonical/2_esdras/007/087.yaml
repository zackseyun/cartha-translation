  yaml_path: translation/extra_canonical/2_esdras/007/087.yaml
  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
translation:
  language: fr
  text: La septième voie est plus grande que toutes celles qui viennent d’être mentionnées[a], car ils dépériront dans la confusion, seront consumés dans les terreurs et se flétriront au milieu des craintes, en voyant la gloire du Très-Haut, devant qui ils ont péché durant leur vie[b] et devant qui, dans les derniers temps, ils commenceront à être jugés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plusieurs mots de ce verset sont textuellement difficiles dans la tradition latine. Le sens général demeure néanmoins clair : les pécheurs subiront une détresse extrême lorsqu’ils verront la gloire du Très-Haut, devant qui ils ont péché.'
    reason: textual_variant
  - marker: b
    text: 'On peut aussi traduire : « La septième voie, plus grande que toutes celles qui viennent d’être mentionnées : ils dépérissent dans la confusion, sont consumés dans les terreurs et se flétrissent au milieu des craintes, parce qu’ils voient la gloire du Très-Haut, devant qui ils ont péché durant leur vie et devant qui ils doivent être jugés dans les derniers temps. » Cette lecture lisse autrement une syntaxe difficile, mais rend moins explicitement les futurs et l’idée qu’ils « commenceront » à être jugés.'
    reason: previous_rendering
lexical_decisions:
- source_word: maior
  choice: plus pénible
  rationale: Dans ce contexte, le comparatif qualifie la gravité de cette voie de souffrance plutôt que sa grandeur physique; « plus pénible » rend ce sens naturellement en français.
- source_word: detabescent
  choice: ils dépériront
  rationale: Le futur latin décrit un dépérissement progressif; le futur français est conservé.
- source_word: in confusione
  choice: dans la confusion
  rationale: « Confusion » préserve l’ambivalence entre désarroi et honte sans réduire le terme à une seule nuance.
- source_word: consumentur in horroribus
  choice: seront consumés par l’épouvante
  rationale: Le latin exprime la destruction sous l’effet de terreurs; « épouvante » convient au registre et évite la traduction erronée par « honte ».
- source_word: maereescent / marcescent in timoribus
  choice: se flétriront de peur
  rationale: La forme transmise est textuellement difficile, mais le sens probable est celui d’un flétrissement ou dépérissement causé par les craintes.
- source_word: uidentes
  choice: en voyant
  rationale: Le participe est rendu comme une circonstance simultanée, sans déplacer sur lui la relation causale introduite auparavant par « quoniam ».
- source_word: incipient … iudicari
  choice: ils commenceront à être jugés
  rationale: Cette formulation conserve explicitement l’aspect inchoatif de « incipient » et la voix passive.
theological_decisions:
- issue: Rapport entre le péché commis durant la vie et le jugement final
  choice: « devant qui ils ont péché durant leur vie […] et devant qui […] ils commenceront à être jugés »
  alternative: Reformuler en disant qu’ils sont condamnés par Dieu
  rationale: Le texte parle du commencement de leur jugement, non de son verdict; la traduction ne préjuge donc pas de l’issue.
- issue: Sens de la supériorité de la septième voie
  choice: « plus pénible »
  alternative: « plus grande »
  rationale: Le contexte présente le degré culminant de l’angoisse des impies. La formulation française explicite ce sens contextuel sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les images parallèles de dépérissement, de consommation et de flétrissement sont conservées, ainsi que les futurs du latin. La ponctuation met en évidence que la détresse décrite explique pourquoi la septième voie est la plus pénible.
