revisions:
- from: 'La septième voie est plus pénible que toutes celles qui viennent d’être mentionnées[a] : ils dépériront dans la confusion, seront consumés par l’épouvante et se flétriront de peur en voyant la gloire du Très-Haut, devant qui ils ont péché durant leur vie[b] et devant qui, dans les derniers temps, ils commenceront à être jugés.'
  to: La septième voie est plus grande que toutes celles qui viennent d’être mentionnées[a], car ils dépériront dans la confusion, seront consumés dans les terreurs et se flétriront au milieu des craintes, en voyant la gloire du Très-Haut, devant qui ils ont péché durant leur vie[b] et devant qui, dans les derniers temps, ils commenceront à être jugés.
  rationale: 'La révision réduit deux interprétations non nécessaires : maior est rendu par « plus grande », et les pluriels locatifs in horroribus et in timoribus sont préservés par « dans les terreurs » et « au milieu des craintes ». Elle maintient la chaîne causale introduite par quoniam, les trois futurs, la valeur circonstancielle de uidentes, et le passif inchoatif « commenceront à être jugés ». Les ancres et les deux notes sont conservées.'
  reviewer_model: gpt-5.6-terra
