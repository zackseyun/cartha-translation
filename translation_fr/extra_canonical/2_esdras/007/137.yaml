source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si enim non multiplicaverit, non vivificabitur saeculum cum his qui habitant in eo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
translation:
  language: fr
  text: Car s’il ne les multiplie pas[a], le monde ne recevra pas la vie avec ceux qui l’habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet de « multiplie » est sous-entendu dans le latin.
    reason: Signaler que « les » est fourni d’après le contexte plutôt qu’exprimé dans la source.
lexical_decisions:
- source_word: multiplicaverit
  choice: multiplie
  rationale: Le futur antérieur latin exprime ici une condition tournée vers l’avenir. En français naturel, après « si », cette valeur se rend par le présent plutôt que par le futur. Le pronom « les » reprend un objet sous-entendu par le latin.
- source_word: vivificabitur
  choice: recevra la vie
  rationale: Cette formulation rend le passif de vivificare de façon naturelle et digne, sans réduire le verbe à la simple idée de survie.
- source_word: saeculum
  choice: le monde
  rationale: Dans ce contexte, saeculum désigne l’ordre du monde avec ses habitants. « Ère » ou « âge » serait plus littéral, mais moins naturel avec « ceux qui l’habitent ».
- source_word: cum his qui habitant in eo
  choice: avec ceux qui l’habitent
  rationale: Rendu formel qui conserve l’association du monde et de ses habitants dans le fait de recevoir la vie.
theological_decisions:
- issue: Sujet implicite de multiplicaverit
  choice: Conserver le sujet masculin implicite par « il »
  alternative: Expliciter « Dieu »
  rationale: Le latin ne nomme pas le sujet dans ce verset; l’expliciter résoudrait une donnée laissée au contexte.
- issue: Objet implicite de multiplicaverit
  choice: Employer « les » et signaler l’ellipse en note
  alternative: 'Employer le verbe absolument : « s’il ne multiplie pas »'
  rationale: Le sens transitif est requis par le contexte et suivi par la tradition de traduction, mais aucun objet n’est exprimé dans la phrase latine.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle reste tournée vers l’avenir; le présent après « si » est l’usage idiomatique français. « Le monde » privilégie l’intelligibilité tout en conservant la portée collective de saeculum.
