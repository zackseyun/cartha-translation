source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et omnis qui liberatus est de praedictis malis, ipse videbit mirabilia mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/027.yaml
  text: And everyone who is delivered from the evils foretold will see my wonders[a].
translation:
  language: fr
  text: Et quiconque aura été délivré des malheurs annoncés, celui-là verra mes merveilles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnis qui
  choice: quiconque
  rationale: Rend naturellement la portée universelle de l’expression latine sans l’alourdir.
- source_word: liberatus est
  choice: aura été délivré
  rationale: Le futur antérieur français exprime que la délivrance précède la vision annoncée, dans ce contexte orienté vers l’avenir.
- source_word: praedictis malis
  choice: des malheurs annoncés
  rationale: « Malheurs » convient ici à des calamités prédites; « annoncés » conserve le sens de praedictis sans suggérer nécessairement une simple mention antérieure.
- source_word: ipse
  choice: celui-là
  rationale: Préserve la reprise emphatique du sujet présente dans le latin, tout en restant intelligible en français.
- source_word: mirabilia mea
  choice: mes merveilles
  rationale: Équivalent direct et digne, qui conserve l’idée d’actes ou de réalités extraordinaires appartenant à Dieu.
theological_decisions:
- issue: Nature des praedicta mala
  choice: malheurs annoncés
  alternative: maux prédits
  rationale: La formulation retenue préserve l’idée de calamités annoncées d’avance sans préciser leur nature ni introduire une interprétation doctrinale.
- issue: Valeur emphatique de ipse
  choice: conserver la reprise par « celui-là »
  alternative: 'omettre la reprise: « quiconque… verra »'
  rationale: Le latin marque explicitement le sujet par ipse après la proposition relative; la traduction en garde l’emphase et la tension stylistique.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « quiconque…, celui-là… » est volontairement marquée afin de refléter l’emphase du latin, malgré son caractère légèrement solennel.
