source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: fr
  text: 'Et je répondis en disant : « Alors, un temps sera-t-il accordé aux âmes, après qu’elles auront été séparées de leurs corps, pour voir ce dont tu m’as parlé[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’extrait latin fourni s’interrompt après de quo mihi, littéralement « ce au sujet de quoi, à moi ». La fin « tu m’as parlé » restitue le sens de la proposition telle qu’elle est comprise dans la tradition textuelle consultée.
    reason: Signaler avec transparence que la dernière proposition n’est pas complète dans l’extrait latin fourni.
lexical_decisions:
- source_word: dabitur tempus animabus
  choice: un temps sera-t-il accordé aux âmes
  rationale: Conserve la tournure passive du latin et exprime naturellement la question en français.
- source_word: separatae fuerint de corporibus
  choice: après qu’elles auront été séparées de leur corps
  rationale: Rend l’antériorité exprimée par le futur antérieur latin. Le singulier collectif « leur corps » indique le corps propre à chaque âme sans suggérer plusieurs corps par âme.
- source_word: ut uideant
  choice: pour voir
  rationale: Traduit directement la proposition finale latine sans préciser ce que signifie ici « voir ».
- source_word: de quo mihi
  choice: ce dont tu m’as parlé
  rationale: Rend en français idiomatique la relation introduite par de quo, en suivant la proposition comprise dans la tradition consultée, tout en signalant l’état incomplet de l’extrait latin.
theological_decisions:
- issue: État des âmes après la séparation d’avec le corps
  choice: Maintenir la question ouverte et la formulation passive
  alternative: Expliquer qu’il s’agit d’une période consciente après la mort
  rationale: Le verset pose une question sans encore en donner la réponse; la traduction ne doit pas anticiper ni systématiser sa portée théologique.
- issue: Sens de « voir »
  choice: Conserver le verbe « voir » sans paraphrase
  alternative: Comprendre, constater ou faire l’expérience de
  rationale: Le latin uidere permet plusieurs nuances; les expliciter ici réduirait une ambiguïté authentique.
translation_notes:
  register: Français moderne, digne et accessible. La reprise sémitisante « je répondis en disant » est conservée parce qu’elle correspond au latin respondi et dixi et convient au registre narratif biblique; l’ensemble reste néanmoins naturel.
