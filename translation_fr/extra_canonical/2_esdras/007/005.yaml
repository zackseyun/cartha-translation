source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
translation:
  language: fr
  text: Car si quelqu’un désire entrer dans la mer, pour la voir ou la maîtriser, comment pourra-t-il parvenir dans un vaste espace s’il ne traverse pas un passage étroit ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volens voluerit
  choice: désire
  rationale: La tournure redoublée exprime la volonté ou le désir; une formulation simple est plus naturelle en français sans imposer une intensité incertaine.
- source_word: ingredi mare
  choice: entrer dans la mer
  rationale: Rend directement le verbe et son complément.
- source_word: dominari eius
  choice: la maîtriser
  rationale: Conserve l’idée de domination ou de maîtrise exercée sur la mer.
- source_word: in latitudinem venire
  choice: parvenir au large espace
  rationale: Préserve le contraste spatial entre latitudinem et angustum, plutôt que d’interpréter la largeur comme la mer elle-même.
- source_word: angustum
  choice: l’étroit passage
  rationale: Le substantif neutre désigne ici un endroit resserré; « passage » est naturellement suggéré par transierit.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le contraste concret entre l’espace large et le passage étroit est maintenu, ainsi que l’alternative entre voir la mer et la maîtriser.
