source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et si non essemus post mortem in iudicio uenientes, melius fortassis nobis uenisset.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/069.yaml
  text: And if after death we were not coming into judgment, perhaps it would have been better for us.”
translation:
  language: fr
  text: Et si, après la mort, nous ne devions pas comparaître en jugement, peut-être aurait-il mieux valu pour nous.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post mortem
  choice: après la mort
  rationale: Rend directement l’expression temporelle latine dans un français naturel.
- source_word: in iudicio uenientes
  choice: comparaître en jugement
  rationale: Le participe de uenire exprime ici l’arrivée devant le jugement; «comparaître» en restitue clairement la portée judiciaire sans préciser davantage qui juge.
- source_word: melius fortassis nobis uenisset
  choice: peut-être aurait-il mieux valu pour nous
  rationale: Expression française idiomatique qui conserve l’atténuation de fortassis et le sens contrefactuel de la tournure latine.
theological_decisions:
- issue: Le jugement après la mort
  choice: 'Formulation générale: «comparaître en jugement»'
  alternative: «passer en jugement» ou «venir au jugement»
  rationale: Cette formulation conserve l’affirmation du jugement post mortem sans introduire de précisions doctrinales absentes du latin.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conditionnelle et l’incertitude exprimée par «peut-être» sont conservées. Le guillemet fermant reflète la continuité probable d’un discours déjà ouvert dans le contexte.
