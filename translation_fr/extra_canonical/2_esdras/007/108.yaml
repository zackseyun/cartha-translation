  text: and David for the destruction[a], and Solomon for those in sanctification,
translation:
  language: fr
  text: et David pour la destruction[a], et Salomon pour ceux qui étaient à la consécration[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet du fléau » ; le latin signifie littéralement une action de briser ou une destruction.
    reason: Signaler la lecture contextuelle possible sans substituer « fléau » au sens plus général de confractione dans le texte.
  - marker: b
    text: Littéralement, « ceux qui [étaient] dans la consécration ». La construction latine est elliptique ; « dédicace » est aussi possible selon le contexte.
    reason: Rendre compte de l’ellipse de qui in sanctificationem et indiquer l’alternative cultuelle sans ajouter l’idée d’une participation active ni identifier explicitement le Temple.
lexical_decisions:
- source_word: confractione
  choice: destruction
  rationale: Le latin désigne littéralement une action de briser ou un anéantissement. « Destruction » conserve ce sens sans adopter la lecture contextuelle plus précise « fléau ».
- source_word: sanctificationem
  choice: consécration
  rationale: Dans le contexte de Salomon, le terme peut désigner la consécration ou dédicace du Temple. « Consécration » reste proche du latin sanctificatio tout en étant naturel en français.
- source_word: qui in sanctificationem
  choice: ceux qui prenaient part à la consécration
  rationale: La tournure latine, elliptique et inhabituelle, associe ces personnes à la consécration. Cette formulation française restitue cette relation sans faire de « sanctification » leur état spirituel personnel.
theological_decisions:
- issue: Nature de l’événement associé à David
  choice: destruction
  alternative: fléau
  rationale: Le contexte biblique peut évoquer le fléau à la fin du règne de David, mais confractione ne l’exprime pas explicitement; le texte principal préserve donc le terme plus général.
- issue: Sens de sanctificatio dans l’épisode de Salomon
  choice: consécration
  alternative: sanctification
  rationale: « Consécration » convient mieux à l’inauguration cultuelle du Temple, tandis que « sanctification » pourrait être comprise comme un processus spirituel individuel absent du passage.
translation_notes:
  register: Français moderne, sobre et digne. La coordination fragmentaire et la ponctuation finale sont conservées parce que le verset appartient à une énumération plus longue.
