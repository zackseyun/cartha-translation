  yaml_path: translation/extra_canonical/2_esdras/007/044.yaml
  text: For it will last like a week of years. This is my judgment and its ordinance,
translation:
  language: fr
  text: Car cela durera comme une semaine d’années. Tel est mon jugement et son ordonnance,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ebdomada annorum
  choice: une semaine d’années
  rationale: Conserve littéralement l’expression temporelle latine, qui désigne naturellement une période de sept ans sans expliciter ce que le texte laisse sous forme d’image.
- source_word: iudicium meum
  choice: mon jugement
  rationale: Rend directement le latin et préserve la portée judiciaire ou décisionnelle du terme.
- source_word: constitutio eius
  choice: la règle qui le fixe
  rationale: Exprime constitutio comme une disposition établie et rattache eius au jugement qui précède, tout en évitant le calque peu naturel « son ordonnance ».
theological_decisions:
- issue: Référent de eius dans constitutio eius
  choice: 'Le pronom renvoie au jugement : « la règle qui le fixe »'
  alternative: « son ordonnance » ou « la disposition qui s’y rapporte »
  rationale: Le latin permet une certaine souplesse référentielle. La formulation retenue reste proche du rapport grammatical le plus immédiat sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’image biblique de la « semaine d’années » et la virgule finale, puisque l’extrait se poursuit syntaxiquement.
