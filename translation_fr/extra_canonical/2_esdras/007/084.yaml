  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: fr
  text: 'Quatrième voie : elles considéreront, dans les derniers temps, le supplice qui leur est réservé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quarta uia
  choice: Quatrième voie
  rationale: Reproduit simplement l’énumération du latin.
- source_word: considerabunt
  choice: elles considéreront
  rationale: Conserve le sens délibératif et contemplatif de « considerare », sans l’affaiblir en simple perception.
- source_word: sibi … repositum tormentum
  choice: le supplice qui leur est réservé
  rationale: Rend naturellement en français le datif réfléchi « sibi » et l’idée de « repositum », quelque chose tenu en réserve à leur intention.
- source_word: in nouissimis
  choice: dans les derniers temps
  rationale: Expression temporelle fidèle, placée entre virgules afin de ne pas trancher excessivement son rattachement syntaxique.
theological_decisions:
- issue: Nature et moment du châtiment
  choice: « le supplice qui leur est réservé », considéré « dans les derniers temps »
  alternative: « le supplice qui leur est réservé pour la fin »
  rationale: La formulation retenue suit l’ordre latin et préserve la tension entre le moment où elles le considéreront et le moment auquel le supplice est réservé.
translation_notes:
  register: Français moderne, sobre et solennel. Le pronom féminin « elles » reprend les âmes évoquées dans le contexte immédiat de la série des voies.
