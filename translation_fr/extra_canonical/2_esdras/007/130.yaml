- source_word: sed nec mihi
  choice: ni même en moi
  rationale: « Même » restitue ici la force culminante de la répétition latine « sed nec ».
- source_word: qui locutus sum ad eos
  choice: qui leur ai parlé
  rationale: Formulation française naturelle et fidèle à la relative latine.
