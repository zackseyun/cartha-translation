  text: 'Et respondit et dixit: hoc est cogitamentum certaminis, quem certavit qui super terram natus est homo,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/127.yaml
  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
translation:
  language: fr
  text: 'Il répondit : « Voici la pensée du combat qu’a mené l’être humain né sur la terre :[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Voici la pensée du combat que l’être humain né sur la terre doit mener. »'
    reason: 'La tradition de traduction comprend parfois la proposition comme exprimant le combat universel imposé à l’être humain, bien que le latin conservé ait littéralement un verbe au passé : « a combattu ».'
lexical_decisions:
- source_word: cogitamentum
  choice: pensée
  rationale: Correspondance directe qui conserve le caractère quelque peu énigmatique de l’expression latine, sans la résoudre en « sens » ou « signification ».
- source_word: certaminis
  choice: du combat
  rationale: Rend le génitif latin et l’idée d’une lutte ou d’une épreuve disputée.
- source_word: homo
  choice: l’être humain
  rationale: Exprime la portée générique de homo sans suggérer nécessairement un homme précis ni exclure les femmes.
- source_word: certavit
  choice: qu’a mené
  rationale: Respecte l’indicatif parfait latin tout en donnant en français naturel « mener un combat ».
- source_word: super terram natus est
  choice: né sur la terre
  rationale: Reproduit simplement l’expression spatiale et le parfait passif du latin.
theological_decisions:
- issue: Valeur de qui et portée générique de homo
  choice: « qu’a mené l’être humain né sur la terre »
  alternative: « que doit mener tout être humain né sur la terre »
  rationale: Le texte latin transmis porte certavit, un parfait de l’indicatif (« a combattu »), et non une forme d’obligation. La traduction conserve également la portée générique de homo.
- issue: Interprétation de cogitamentum certaminis
  choice: « la pensée du combat »
  alternative: « le sens du combat »
  rationale: La formulation littérale préserve l’ambiguïté du latin au lieu d’en imposer une interprétation explicative.
translation_notes:
  register: Français international moderne, digne et accessible. « Il répondit » évite le pléonasme peu naturel « répondit et dit » tout en transmettant la formule narrative latine. La phrase reste ouverte par les deux-points, conformément au contexte.
