  text: And now I see that the age to come will bring joy to few[a], but torments to many.
translation:
  language: fr
  text: Et maintenant, je vois que la joie du monde à venir sera le lot d’un petit nombre, mais que les tourments seront le lot d’un grand nombre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad paucos pertinebit
  choice: sera le lot d’un petit nombre
  rationale: Cette expression rend naturellement l’idée de ce qui revient ou appartient à quelques-uns, sans faire de la joie le sujet d’un verbe comme « tourmenter ».
- source_word: futuri saeculi iocunditas
  choice: la joie du monde à venir
  rationale: « Monde à venir » restitue ici le sens eschatologique de saeculum futurum, tandis que « joie » exprime clairement iocunditas.
- source_word: multis autem tormenta
  choice: mais les tourments celui d’un grand nombre
  rationale: L’ellipse française reprend « sera le lot de » et maintient le contraste nominal du latin entre la joie destinée à peu de personnes et les tourments destinés à beaucoup.
theological_decisions:
- issue: Rapport entre le monde à venir, la joie et les tourments
  choice: Présenter la joie comme le lot d’un petit nombre et les tourments comme celui d’un grand nombre
  alternative: Dire que le monde à venir apportera la joie à peu de personnes et les tourments à beaucoup
  rationale: La formulation retenue suit de plus près la construction latine reconstruite, où « joie » et « tourments » sont mis en parallèle, sans préciser davantage leur mode d’attribution.
translation_notes:
  register: Français moderne, digne et accessible. « Sera le lot de » conserve le parallélisme et évite l’ambiguïté grammaticale signalée dans les révisions anglaises.
