id: 2ES.7.78
reference: 2 Esdras 7:78
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: fr
  text: 'Quant à la mort, voici ce qu’il en est : lorsque le décret du Très-Haut a été prononcé pour qu’un être humain meure, le souffle quitte le corps afin d’être renvoyé de nouveau,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sermo est
  choice: voici ce qu’il en est
  rationale: Cette tournure française naturelle exprime qu’il s’agit d’exposer ce qui se passe au sujet de la mort, sans donner à « sermo » le sens plus précis d’« enseignement ».
- source_word: terminus sententiae
  choice: le décret
  rationale: Dans ce contexte de décision émanant du Très-Haut, « décret » restitue de façon concise la portée juridique de « sententia » et l’idée d’une décision arrêtée.
- source_word: homo
  choice: un être humain
  rationale: Ce choix inclusif rend le sens générique de « homo » sans le limiter au sexe masculin.
- source_word: inspiratione
  choice: le souffle
  rationale: « Souffle » conserve le sens vital concret du latin et évite de trancher en faveur d’une interprétation plus explicitement spirituelle.
- source_word: dimittatur iterum
  choice: être renvoyé de nouveau
  rationale: Le passif et l’absence de destination explicite sont conservés, de même que la valeur de répétition de « iterum ».
theological_decisions:
- issue: Nature de ce qui quitte le corps à la mort
  choice: le souffle
  alternative: l’esprit
  rationale: Le latin « inspiratio » permet une évocation du souffle vital; traduire par « esprit » préciserait une anthropologie que ce fragment n’énonce pas sans ambiguïté.
- issue: Destination du souffle après son départ
  choice: aucune destination ajoutée
  alternative: vers celui qui l’a donné
  rationale: Le texte fourni dit seulement qu’il doit être renvoyé de nouveau; préciser le destinataire importerait un élément absent de la source latine citée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule, conformément au fragment source, qui se poursuit au verset suivant. Le résidu initial « temporibus. » appartient syntaxiquement au contexte précédent et n’est pas intégré à ce verset.
