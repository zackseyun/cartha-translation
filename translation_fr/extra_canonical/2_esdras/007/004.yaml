lexical_decisions:
- source_word: introitus
  choice: entrée
  rationale: Rend directement le nom latin et désigne naturellement le point d’accès évoqué.
- source_word: in angusto loco
  choice: dans un endroit étroit
  rationale: Préserve l’image spatiale du latin sans ajouter l’idée d’un passage, absente du texte source.
- source_word: similis fluminis
  choice: semblable à un fleuve
  rationale: Reproduit la comparaison explicite avec le fleuve et conserve le registre digne du passage.
theological_decisions:
- issue: Valeur de « ut esset »
  choice: de sorte qu’elle sera
  alternative: afin qu’elle soit / de sorte qu’elle serait
  rationale: Dans ce contexte descriptif, la proposition introduite par « ut » exprime naturellement le résultat de l’étroitesse annoncée. Le futur français s’accorde avec « erit ... positus », tandis qu’un conditionnel serait peu naturel sans cadre hypothétique explicite.
translation_notes:
  register: Français international moderne, clair et soutenu. Le futur passif de « erit ... positus » est conservé par « sera placée ». Le féminin des pronoms reprend « entrée ».
