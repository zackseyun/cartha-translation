  yaml_path: translation/extra_canonical/2_esdras/007/003.yaml
  text: And I said, “Speak, my lord.” And he said to me, “The sea is set in a broad place, so that it might be deep and immense.
translation:
  language: fr
  text: 'Et je dis : « Parle, mon seigneur. » Il me dit : « La mer est placée en un vaste lieu, pour qu’elle soit profonde et immense. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: loquere
  choice: Parle
  rationale: Impératif direct et naturel, correspondant exactement au latin.
- source_word: dominus meus
  choice: mon seigneur
  rationale: Conserve la forme d’adresse respectueuse du latin sans imposer ici une identification divine.
- source_word: in spatioso loco
  choice: dans un vaste espace
  rationale: Rend le sens spatial de spatiosus de manière claire et actuelle.
- source_word: altum et inmensum
  choice: profonde et immense
  rationale: Avec mare, altum désigne naturellement la profondeur; immense préserve l’idée d’une étendue sans mesure.
theological_decisions:
- issue: Identité du destinataire appelé dominus meus
  choice: mon seigneur
  alternative: mon maître / Seigneur
  rationale: La minuscule maintient l’ambiguïté contextuelle et évite de décider silencieusement que l’expression est un titre divin.
- issue: Valeur de la proposition ut esset
  choice: de sorte qu’elle est
  alternative: afin qu’elle soit / de sorte qu’elle puisse être
  rationale: Le contexte énonce la conséquence rendue possible par le vaste espace; une formulation française naturelle évite de surcharger la phrase d’une finalité explicite, tout en conservant le rapport logique.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe répétitive du dialogue est conservée, tandis que l’image spatiale reste immédiatement compréhensible.
