  text: and compassionate, because he shows compassion to those who turn back to his law,
translation:
  language: fr
  text: et compatissant, parce qu’il fait miséricorde à ceux qui reviennent à sa loi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miserator
  choice: compatissant
  rationale: Rend le substantif/adjectif latin désignant celui qui fait miséricorde par une formulation française naturelle, en parallèle avec le verbe qui suit.
- source_word: miseretur
  choice: témoigne sa compassion
  rationale: Préserve la répétition étymologique de miserator/miseretur sans produire la tournure moins naturelle « compatit ».
- source_word: conversionem faciunt
  choice: reviennent
  rationale: Exprime le mouvement de conversion ou de retour indiqué par le latin, dans un français courant et digne.
- source_word: in lege eius
  choice: à sa loi
  rationale: Avec « revenir », la préposition française « à » exprime naturellement le retour vers la loi; elle suit ici l’interprétation contextuelle du latin in.
theological_decisions:
- issue: Nature du retour exprimé par conversionem faciunt
  choice: ceux qui reviennent à sa loi
  alternative: ceux qui se convertissent dans sa loi
  rationale: « Reviennent » conserve l’idée de retournement vers la loi sans préciser indûment les modalités de la conversion; l’alternative est plus littérale mais peu idiomatique et ambiguë en français.
translation_notes:
  register: Français international moderne, clair et digne. La coordination initiale et la virgule finale sont conservées parce que le verset constitue un élément d’une énumération plus large.
