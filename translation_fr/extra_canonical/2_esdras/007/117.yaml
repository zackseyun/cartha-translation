source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim prodest omnibus in praesenti vivere in tristitia et mortuos sperare punitionem?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/117.yaml
  text: For what does it profit all to live in sorrow in the present and[a], when dead, to expect punishment?
translation:
  language: fr
  text: En effet, quel avantage y a-t-il pour tous à vivre dans la tristesse en ce temps présent et, une fois morts, à s’attendre à un châtiment ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnibus
  choice: pour tous
  rationale: Rend directement le datif pluriel substantivé sans ajouter « les hommes » ou restreindre son référent.
- source_word: in praesenti
  choice: dans le temps présent
  rationale: Conserve la portée temporelle et eschatologique du latin, plus nettement que le simple adverbe « maintenant ».
- source_word: in tristitia
  choice: dans la tristesse
  rationale: Traduction directe et naturelle qui maintient l’état durable exprimé par la construction latine.
- source_word: mortuos
  choice: une fois morts
  rationale: Expression française naturelle qui garde la référence explicite à l’état de mort, plutôt que de généraliser en « après la mort ».
- source_word: sperare punitionem
  choice: s’attendre à un châtiment
  rationale: Dans ce contexte défavorable, sperare signifie attendre ou escompter plutôt qu’espérer au sens positif; « châtiment » rend la dimension punitive de punitio.
theological_decisions:
- issue: Contraste entre la condition présente et le châtiment futur
  choice: « dans le temps présent » et « une fois morts »
  alternative: « maintenant » et « après la mort »
  rationale: La formulation retenue préserve le contraste apocalyptique entre le présent et le sort ultérieur sans préciser davantage la chronologie ou la nature du châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure interrogative « quel avantage y a-t-il » restitue naturellement Quid enim prodest sans aplatir la force rhétorique du verset.
