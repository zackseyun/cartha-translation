translation:
  language: fr
  text: vers celui qui l’a donnée, pour adorer avant tout la gloire du Très-Haut. Et si elle est de ceux qui ont rejeté et n’ont pas suivi la voie du Très-Haut, et de ceux qui ont méprisé la Loi,
