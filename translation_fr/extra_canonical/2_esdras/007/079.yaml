  source_fidelity: Le texte rend fidèlement la séquence latine fournie, y compris son chevauchement avec la fin du verset précédent et son interruption finale. « Vers celui qui l’a donnée » restitue correctement ad eum qui dedit, avec le féminin implicite renvoyant à l’âme du contexte. « Rejeté », « suivi la voie », « méprisé la Loi » rendent adéquatement spreuerunt, non seruauerunt uiam et contempserunt legem.
  naturalness: La formulation est globalement naturelle et de registre biblique moderne. Toutefois, « afin d’adorer » attache normalement le but au sujet de « a donnée » (celui qui donne), alors que l’infinitif latin exprime ici l’action de l’âme qui retourne vers son donateur. « Pour adorer » évite cette ambiguïté sans ajouter de sens.
