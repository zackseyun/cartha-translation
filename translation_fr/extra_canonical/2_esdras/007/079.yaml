lexical_decisions:
- source_word: ad eum qui dedit
  choice: vers celui qui l’a donnée
  rationale: Rend le mouvement exprimé par « ad » et conserve le pronom implicite féminin renvoyant à l’âme dans le contexte précédent.
- source_word: adorare
  choice: adorer
  rationale: Terme français naturel et digne pour l’acte cultuel dirigé vers la gloire du Très-Haut.
- source_word: primum
  choice: avant tout
  rationale: Exprime ici la priorité indiquée par « primum » de façon idiomatique.
- source_word: spreuerunt
  choice: ont rejeté
  rationale: Traduit le refus méprisant exprimé par « spernere » sans alourdir la phrase.
- source_word: non seruauerunt uiam
  choice: n’ont pas suivi la voie
  rationale: « Suivre la voie » est plus naturel en français dans ce contexte moral, tout en exprimant l’idée de ne pas l’observer fidèlement.
- source_word: legem
  choice: la Loi
  rationale: La majuscule indique qu’il s’agit de la Loi religieuse du Très-Haut, même si le possessif attendu dans la suite n’apparaît pas dans le fragment fourni.
theological_decisions:
- issue: Référent du sujet dans « esset eorum »
  choice: « elle est de ceux »
  alternative: « elle appartient à ceux »
  rationale: Le féminin « elle » reprend vraisemblablement l’âme mentionnée dans le contexte; la formulation conserve l’appartenance à une catégorie sans expliciter davantage.
- issue: Fragment chevauchant les limites versifiées
  choice: Traduire exactement le texte latin fourni, y compris la fin de 7:78 et l’interruption de 7:79
  alternative: Rétablir les limites traditionnelles complètes de 7:79
  rationale: La source assignée commence au milieu d’une phrase antérieure et s’arrête avant la fin de la phrase; compléter depuis un autre segment importerait du texte absent.
