  verdict: revise
  source_fidelity: Le texte conserve l’adresse répétée à « Seigneur », l’image de chacun qui « rend son âme », le futur de conseruabimur et la finale inachevée. Toutefois, « assurément » choisit l’analyse emphatique d’une répétition latine difficile sans préserver suffisamment la construction répétée ni son ambiguïté. La note qualifie en outre de « littérale » une paraphrase (« étant gardés ») qui ne rend pas exactement le participe parfait.
  naturalness: La formulation est globalement intelligible et d’un registre approprié. « Devant toi » garde volontairement le départ abrupt du fragment. Une légère révision permet de garder la répétition tout en restant lisible en français.
  terminology: « Seigneur », « rendre son âme » et « repos » conviennent au registre et ne surinterprètent pas le texte. « Gardés » convient à conservati/conseruabimur, mais la redondance source doit être reflétée sans imposer exclusivement l’idée d’emphase.
