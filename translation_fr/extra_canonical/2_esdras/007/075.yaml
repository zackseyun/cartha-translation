  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
translation:
  language: fr
  text: Devant toi, Seigneur, montre à ton serviteur, Seigneur, si, après la mort — ou maintenant, lorsque chacun de nous rend son âme —, nous serons, une fois gardés[a], gardés dans le repos jusqu’à…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « gardés, nous serons gardés ». La répétition peut exprimer l’insistance (« nous serons assurément gardés ») ou conserver une nuance conditionnelle selon l’analyse de la phrase.'
    reason: Reflète la répétition participe parfait + futur passif du latin sans imposer une seule interprétation à une tournure difficile.
lexical_decisions:
- source_word: coram te
  choice: Devant toi
  rationale: Rend directement la locution latine, même si le segment transmis commence de manière abrupte.
- source_word: reddimus unusquisque animam suam
  choice: lorsque chacun de nous rend son âme
  rationale: Respecte le passage du pluriel collectif à « chacun » et conserve l’image de la remise de l’âme au moment de la mort.
- source_word: conseruati conseruabimur
  choice: nous serons assurément gardés
  rationale: La répétition participiale et verbale exprime vraisemblablement l’insistance; le futur de « conseruabimur » est conservé.
- source_word: in requie
  choice: dans le repos
  rationale: Traduction directe qui préserve la notion eschatologique sans la préciser davantage.
theological_decisions:
- issue: État de l’âme après la mort
  choice: Formulation interrogative et non résolue
  alternative: Affirmer que les âmes reposent nécessairement après la mort
  rationale: Le double « si » latin introduit une question; le texte ne tranche pas encore la question théologique.
- issue: Valeur de « conseruati conseruabimur »
  choice: 'Insistance: « assurément gardés »'
  alternative: 'Condition: « si nous sommes gardés, nous serons gardés »'
  rationale: La répétition paraît refléter une tournure emphatique, tandis que « conseruabimur » exige un futur; la lecture littérale reste signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « Seigneur » et la fin suspendue sur « jusqu’à » sont maintenues parce qu’elles appartiennent au fragment latin fourni; des points de suspension indiquent que la phrase demeure inachevée.
