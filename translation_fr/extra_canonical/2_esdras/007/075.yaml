  to: Devant toi, Seigneur, montre à ton serviteur, Seigneur, si, après la mort — ou maintenant, lorsque chacun de nous rend son âme —, nous serons, une fois gardés[a], gardés dans le repos jusqu’à…
  rationale: La révision maintient le caractère fragmentaire et l’ordre général du latin, y compris l’adresse répétée et la suspension finale. Elle rend plus visiblement conseruati conseruabimur par « une fois gardés, gardés », tout en réservant l’explication emphatique à la note plutôt que de l’imposer dans le texte. Le second « si » du latin demeure grammaticalement difficile dans ce segment isolé; la note signale donc l’ambiguïté sans ajouter de contenu absent.
