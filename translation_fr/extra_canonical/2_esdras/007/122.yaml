source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
translation:
  language: fr
  text: Et puisque la gloire du Très-Haut commencera à protéger ceux qui ont mené une vie pure[a], tandis que nous avons suivi les pires chemins ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sont conduits avec pureté ».'
    reason: Signale une traduction plus formelle de conversati sunt et préserve la nuance de conduite personnelle.
lexical_decisions:
- source_word: quoniam
  choice: puisque
  rationale: Exprime ici une cause tenue pour réelle, plutôt qu’une condition hypothétique.
- source_word: gloria Altissimi
  choice: la gloire du Très-Haut
  rationale: Rend directement le titre divin et conserve l’image théologique de la gloire protectrice.
- source_word: protegere
  choice: protéger
  rationale: Équivalent naturel et précis, sans remplacer l’action par une métaphore plus spécifique comme « abriter ».
- source_word: caste conversati sunt
  choice: ont mené une vie pure
  rationale: Rend la conduite morale et religieuse globale indiquée par caste, tout en évitant de réduire le sens français à la seule chasteté sexuelle.
- source_word: pessimis viis ambulavimus
  choice: nous avons suivi les pires chemins
  rationale: Conserve la métaphore biblique de la marche sur des chemins, dans une formulation française naturelle.
theological_decisions:
- issue: Portée de caste
  choice: vie pure
  alternative: vie chaste
  rationale: Le contraste avec les « pires chemins » favorise la pureté générale de la conduite; « chaste » risquerait aujourd’hui d’imposer un sens principalement sexuel.
- issue: Fonction protectrice de la gloire divine
  choice: la gloire ... commencera à protéger
  alternative: la gloire ... commencera à couvrir
  rationale: La formulation garde l’affirmation étonnante du texte selon laquelle la gloire agit comme protection, sans l’expliquer ni la systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase interrogative est maintenue comme fragment rhétorique lié au contexte. « Tandis que » rend l’opposition de autem plus naturellement que « mais » après la subordonnée causale.
