source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et apparebit lacus tormenti, et contra illum erit locus requietionis ; et clibanus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
translation:
  language: fr
  text: Et le lac des tourments apparaîtra[a], et en face de lui se trouvera le lieu de repos ; la fournaise[b] de la géhenne sera montrée, et en face d’elle, le paradis des délices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les versets 7.36-105 constituent le « fragment manquant » retrouvé par Robert Bensly dans un manuscrit espagnol et publié en 1875. Retranché de la plupart des manuscrits latins médiévaux — très probablement parce que cette section enseigne que l’intercession en faveur des damnés est refusée, idée difficile pour la piété chrétienne ultérieure —, ce passage manque donc dans la Vulgate et dans la Bible du roi Jacques de 1611. Dans celles-ci, 7.35 était immédiatement suivi de ce que les anciennes éditions numérotaient 7.36, environ soixante-dix versets plus loin. Le fragment est aujourd’hui rétabli dans toutes les éditions critiques modernes.
    reason: recovered_fragment
  - marker: b
    text: Le mot latin désigne un four ou une fournaise.
    reason: lexical_clarification
lexical_decisions:
- source_word: lacus tormenti
  choice: le lac des tourments
  rationale: Rend directement « lacus » par « lac », plutôt que par « fosse », et conserve le singulier collectif de « tormenti » sous une forme française naturelle.
- source_word: contra illum
  choice: en face de lui
  rationale: Préserve l’opposition spatiale exprimée par « contra » et le renvoi pronominal au « lac ».
- source_word: locus requietionis
  choice: le lieu du repos
  rationale: Traduction formelle et idiomatique qui maintient le contraste avec les tourments.
- source_word: clibanus
  choice: la fournaise
  rationale: Le terme latin désigne un four fortement chauffé ; « fournaise » convient au registre eschatologique sans atténuer l’image.
- source_word: gehennae
  choice: de la géhenne
  rationale: Translittération française usuelle du nom eschatologique, sans le réduire au terme plus général « enfer ».
- source_word: iucunditatis paradisus
  choice: le paradis des délices
  rationale: Formulation française digne qui conserve l’idée d’agrément et de joie attachée au paradis.
theological_decisions:
- issue: Nature de « lacus tormenti »
  choice: lac des tourments
  alternative: fosse des tourments
  rationale: Le latin fourni porte explicitement « lacus ». Traduire par « fosse » importerait une autre image et effacerait le contraste lexical du texte.
- issue: Rapport entre les deux destinations eschatologiques
  choice: conserver deux fois « en face de »
  alternative: reformuler comme une simple opposition abstraite
  rationale: La répétition maintient la symétrie concrète du passage sans expliquer davantage leur rapport théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La coordination répétée par « et » conserve le rythme polysyndétique du latin. Le texte garde les images distinctes du lac, du lieu de repos, de la fournaise et du paradis.
