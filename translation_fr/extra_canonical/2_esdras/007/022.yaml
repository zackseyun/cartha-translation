  text: hii autem non sunt persuasi et contradixerunt ei. et constituerunt sibi cogitamenta vanitatis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/022.yaml
  text: But they were not persuaded and contradicted him[a], and they formed for themselves vain thoughts[b],
translation:
  language: fr
  text: Mais eux ne se sont pas laissé convaincre et l’ont contredit[a] ; ils se sont forgé de vaines pensées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : se sont opposés à lui.'
    reason: Le latin contradixerunt peut désigner aussi bien le fait de contredire que celui de s’opposer ou de résister.
  - marker: b
    text: 'Littéralement : ont établi pour eux-mêmes des pensées de vanité.'
    reason: La note conserve la forme plus littérale de constituerunt sibi cogitamenta vanitatis derrière le rendu idiomatique.
lexical_decisions:
- source_word: non sunt persuasi
  choice: ne se sont pas laissé convaincre
  rationale: Cette tournure française naturelle exprime le refus d’être persuadé sans suggérer une simple incapacité intellectuelle.
- source_word: contradixerunt ei
  choice: l’ont contredit
  rationale: Rendu direct de contradixerunt ei, qui conserve l’idée d’une parole ou d’une attitude dirigée contre lui ; une note signale la nuance possible d’opposition.
- source_word: constituerunt sibi
  choice: se sont forgé
  rationale: Avec des pensées comme complément, « se sont forgé » rend idiomatiquement l’action délibérée exprimée par constituerunt et la valeur réfléchie de sibi.
- source_word: cogitamenta vanitatis
  choice: de vaines pensées
  rationale: Cette formulation naturelle restitue le génitif qualitatif latin sans le calque peu idiomatique « pensées de vanité ».
theological_decisions:
- issue: Force de contradixerunt dans la réponse humaine à Dieu
  choice: l’ont contredit
  alternative: se sont opposés à lui
  rationale: Le texte principal reste proche du verbe latin sans réduire explicitement l’action à une rébellion générale ; la note préserve toutefois la portée plus forte possible dans le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et le point-virgule conservent l’enchaînement serré des trois actes tout en évitant une phrase pesante.
