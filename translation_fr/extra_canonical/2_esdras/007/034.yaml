source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iudicium autem solum remanebit. et veritas stabit et fides convalescet,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/034.yaml
  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: fr
  text: Mais seul le jugement subsistera ; la vérité tiendra ferme et la foi se fortifiera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  choice: le jugement
  rationale: Équivalent direct qui conserve la portée judiciaire et eschatologique du latin.
- source_word: solum remanebit
  choice: seul … subsistera
  rationale: Rend l’exclusivité de solum et la permanence exprimée par remanebit dans un français naturel et solennel.
- source_word: veritas stabit
  choice: la vérité tiendra ferme
  rationale: Préserve l’image de stabilité du verbe stare plutôt que de réduire l’expression à une simple existence.
- source_word: fides convalescet
  choice: la foi se fortifiera
  rationale: Convalescere désigne ici le fait de devenir fort ou de gagner en vigueur ; la formulation garde ce mouvement sans préciser indûment s’il s’agit de fidélité ou de foi.
theological_decisions:
- issue: Sens de fides
  choice: la foi
  alternative: la fidélité
  rationale: Le latin fides peut désigner la foi, la fidélité ou la fiabilité. Le contexte fourni ne tranche pas entièrement ; « foi » conserve la lecture traditionnelle tout en laissant subsister une part de la tension sémantique.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des trois propositions ainsi que leur orientation future sont conservés.
