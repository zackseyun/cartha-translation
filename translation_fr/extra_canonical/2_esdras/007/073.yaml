- from: Ils ont lésé celle qu’ils avaient reçue. Et qu’auront-ils à dire lors du jugement[a], ou comment répondront-ils dans les derniers temps ?
  to: Ils ont lésé celle qu’ils avaient reçue. Et qu’auront-ils à dire au jugement, ou comment répondront-ils dans les derniers temps ?
  rationale: Suppression de la note non justifiée, car elle introduisait à tort une nuance inférentielle absente de « Et quid » et contredisait la décision d'audit correspondante. Ajustement mineur de « lors du jugement » à « au jugement » pour une équivalence plus directe. Le référent féminin et l'ambiguïté théologique sont conservés.
