source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fraudauerunt eam quam acceperunt. Et quid habebunt dicere in iudicio, uel quo-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
translation:
  language: fr
  text: Ils ont lésé celle qu’ils avaient reçue. Et qu’auront-ils à dire au jugement, ou comment répondront-ils dans les derniers temps ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fraudauerunt
  choice: ont lésé
  rationale: Le verbe latin exprime l’idée de causer frauduleusement du tort ou de priver quelqu’un de ce qui lui revient. « Léser » conserve cette portée sans préciser davantage la nature du tort.
- source_word: eam quam acceperunt
  choice: celle qu’ils avaient reçue
  rationale: Le féminin du latin est conservé sans identifier explicitement le référent, et le plus-que-parfait français marque naturellement l’antériorité de la réception.
- source_word: Et quid habebunt dicere
  choice: Et qu’auront-ils à dire
  rationale: Cette formulation garde la coordination paratactique de Et quid ainsi que la valeur future de habebunt.
- source_word: in iudicio
  choice: lors du jugement
  rationale: « Lors du jugement » rend idiomatiquement le cadre temporel et judiciaire de l’expression latine.
- source_word: uel quo-
  choice: ou comment répondront-ils dans les derniers temps
  rationale: Le témoin fourni s’interrompt après « quo- »; la formulation suit la continuation attestée dans la couche de consultation auditée, tout en conservant l’alternative introduite par uel.
theological_decisions:
- issue: Référent féminin de « eam »
  choice: celle
  alternative: l’âme
  rationale: Le verset ne nomme pas ici le référent. Le maintien du pronom féminin préserve l’implicite du texte au lieu d’imposer une identification théologique.
- issue: Portée eschatologique de « in iudicio » et des « derniers temps »
  choice: jugement / derniers temps
  alternative: Jugement dernier / fin des temps
  rationale: La traduction conserve les expressions du texte sans les fusionner ni préciser qu’il s’agit nécessairement du Jugement dernier.
translation_notes:
  register: Français moderne, digne et direct. « Léser » est précis sans être excessivement technique; la syntaxe interrogative reste naturelle tout en conservant le parallélisme et l’ambiguïté du latin.
