review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la coordination « Et quid », le futur interrogatif, « iudicio » et l'alternative introduite par « uel ». « Lésé » est possible pour fraudauerunt, bien qu'il atténue quelque peu l'idée de fraude ou de tromperie. Le plus-que-parfait de « avaient reçue » est acceptable en français pour marquer l'antériorité implicite, sans identifier le référent féminin.
  naturalness: La formulation est globalement naturelle et de registre approprié. « Au jugement » est plus direct et plus proche de in iudicio que « lors du jugement ».
  terminology: « Jugement » et « derniers temps » préservent la retenue eschatologique du latin. Le référent féminin demeure à juste titre non explicité.
  issues:
  - severity: medium
    issue: La note attribue à « Et quid » une nuance inférentielle (« donc ») et propose une reformulation qui ne correspond pas à l'audit anglais.
    rationale: Le latin porte simplement Et quid (« Et que/quoi »). L'historique d'audit demande précisément de ne pas obscurcir cette coordination paratactique par « Quoi donc / What then ». La note est donc trompeuse et doit être supprimée.
  - severity: low
    issue: « Lors du jugement » est légèrement plus paraphrastique que nécessaire.
    rationale: « Au jugement » rend directement in iudicio, reste idiomatique en français moderne et conserve le cadre judiciaire sans explicitation supplémentaire.
  revised_text: Ils ont lésé celle qu’ils avaient reçue. Et qu’auront-ils à dire au jugement, ou comment répondront-ils dans les derniers temps ?
