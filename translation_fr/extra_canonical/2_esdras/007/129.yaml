translation:
  language: fr
  text: 'Car voici la voie dont Moïse a parlé au peuple de son vivant, en disant : « Choisis pour toi la vie, afin que tu vives. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: haec est via
  choice: voici la voie
  rationale: Rend naturellement la tournure présentative latine tout en conservant l’image de la voie.
- source_word: quam Moyses dixit
  choice: dont Moïse a parlé
  rationale: Le latin emploie littéralement « que Moïse a dite » ; en français, « la voie dont Moïse a parlé » exprime idiomatiquement ce rapport sans en préciser davantage le sens.
- source_word: cum viveret
  choice: de son vivant
  rationale: 'Formulation française naturelle qui conserve la valeur temporelle : pendant que Moïse vivait.'
- source_word: elige tibi vitam
  choice: Choisis pour toi la vie
  rationale: Préserve l’impératif, l’objet « la vie » et le datif réfléchi tibi, sans l’effacer.
- source_word: ut vivas
  choice: afin que tu vives
  rationale: Conserve explicitement la proposition finale et l’écho lexical entre « vie » et « vives ».
