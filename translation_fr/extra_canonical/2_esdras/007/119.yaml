  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: fr
  text: Car à quoi cela nous sert-il qu’un temps immortel nous ait été promis, si nous avons accompli des œuvres mortelles ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim nobis prodest
  choice: Car à quoi cela nous sert-il
  rationale: Rend naturellement la question rhétorique latine et la valeur explicative de « enim ».
- source_word: inmortale tempus
  choice: un temps immortel
  rationale: Conserve l’image et l’ambiguïté du latin, sans préciser arbitrairement « âge » ou « vie éternelle ».
- source_word: mortalia opera egimus
  choice: nous avons accompli des œuvres mortelles
  rationale: Préserve le contraste lexical entre « immortel » et « mortelles », ainsi que le sens moral général de « opera ».
theological_decisions:
- issue: Sens de « temps immortel »
  choice: Maintien de l’expression « un temps immortel »
  alternative: « un âge immortel » ou « la vie éternelle »
  rationale: Le latin dit littéralement « inmortale tempus » ; la formulation retenue conserve sa singularité et évite une interprétation théologique plus précise que la source.
- issue: Nature des « œuvres mortelles »
  choice: Maintien de « œuvres mortelles »
  alternative: « actes voués à la mort » ou « œuvres qui conduisent à la mort »
  rationale: La source laisse ouverte la nuance exacte ; le parallélisme avec « immortel » doit rester perceptible.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe interrogative conserve la force rhétorique et le contraste central du latin.
