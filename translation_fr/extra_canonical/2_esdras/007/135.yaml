lexical_decisions:
- source_word: munificus
  choice: généreux
  rationale: Rend naturellement l’idée de libéralité et de disposition à donner, sans la nuance potentiellement excessive de « prodigue ».
- source_word: quoniam quidem
  choice: car… bel et bien
  rationale: « car » exprime la relation causale de quoniam, tandis que « bel et bien » fait entendre l’insistance de quidem dans un français actuel.
- source_word: donare
  choice: donner
  rationale: Équivalent direct et naturel, qui conserve ici l’idée d’accorder gratuitement.
- source_word: pro exigere
  choice: plutôt qu’exiger
  rationale: Dans cette construction comparative, pro oppose la volonté de donner à celle de réclamer ou d’exiger; « exiger » préserve la force du verbe latin.
theological_decisions:
- issue: Contraste entre le don et l’exigence
  choice: donner plutôt qu’exiger
  alternative: pardonner plutôt que punir
  rationale: La traduction conserve les termes explicites du latin et n’introduit pas une interprétation théologique plus précise que le texte source.
translation_notes:
  register: Français moderne, digne et fluide. La formulation reste coordonnée au contexte précédent par « et » et conserve la virgule finale indiquant que la phrase se poursuit.
