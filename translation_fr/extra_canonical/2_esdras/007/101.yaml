  text: And he said[a], “For seven days they will have freedom, so that they may see the things that were foretold.”
translation:
  language: fr
  text: 'Et il dit : « Pendant sept jours, elles jouiront de la liberté, afin de voir ce qui a été prédit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: libertas
  choice: la liberté
  rationale: Rend directement le latin « libertas » sans préciser davantage la nature de cette liberté, que l’extrait ne définit pas.
- source_word: earum
  choice: elles
  rationale: Conserve le pronom féminin pluriel du latin, dont l’antécédent se trouve dans le contexte précédent.
- source_word: qui praedicti
  choice: ce qui a été prédit
  rationale: La fin de l’extrait est syntaxiquement incomplète et semble se prolonger au verset suivant. Cette formulation naturelle conserve l’idée d’une annonce préalable sans introduire un destinataire absent du texte fourni.
theological_decisions:
- issue: Nature de la liberté accordée
  choice: Ne pas expliciter cette liberté
  alternative: Préciser qu’il s’agit d’une liberté de mouvement ou d’observation
  rationale: Le latin dit seulement « libertas » ; toute précision théologique ou anthropologique dépasserait le témoignage fourni.
translation_notes:
  register: Français moderne, sobre et dignifié. L’ordre « Pendant sept jours » suit l’accent initial du latin. L’infinitif « de voir » rattache naturellement le but à la liberté accordée, tout en évitant une tournure lourde.
