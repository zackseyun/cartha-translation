id: 2ES.7.35
reference: 2 Esdras 7:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: fr
  text: Et l’œuvre suivra, et la récompense sera manifestée. Les œuvres de justice veilleront, et les œuvres d’injustice ne dormiront pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus
  choice: l’œuvre
  rationale: Le singulier latin désigne l’acte ou l’œuvre qui accompagne son auteur au jugement; « œuvre » conserve cette portée sans préciser davantage.
- source_word: subsequetur
  choice: suivra
  rationale: Rend directement l’idée de venir à la suite, tout en préservant l’absence d’objet explicite dans le latin.
- source_word: merces
  choice: la récompense
  rationale: Équivalent naturel de merces dans un contexte de rétribution; le contexte peut inclure une rétribution défavorable, sans que le terme latin l’explicite ici.
- source_word: ostendetur
  choice: sera manifestée
  rationale: Exprime le passif futur et l’idée que la rétribution deviendra visible ou évidente.
- source_word: iustitiae
  choice: les œuvres de justice
  rationale: Le pluriel abstrait peut désigner les manifestations ou actes justes. L’ajout de « œuvres » explicite idiomatiquement ce sens et maintient le parallèle avec opus.
- source_word: vigilabunt
  choice: veilleront
  rationale: Conserve l’image de la vigilance, plus précise qu’un simple éveil.
- source_word: iniustitiae
  choice: les œuvres d’injustice
  rationale: Reproduit le parallélisme avec iustitiae et évite de transformer les abstractions en catégories de personnes.
- source_word: non dormibunt
  choice: ne dormiront pas
  rationale: Traduction littérale qui préserve la personnification et le contraste avec « veilleront ».
theological_decisions:
- issue: Rapport entre l’œuvre, la récompense et le jugement
  choice: Conserver les futurs et les personnifications sans préciser qui présente l’œuvre ni qui manifeste la récompense.
  alternative: Expliciter que les actes suivront chaque personne et que Dieu révélera sa rétribution.
  rationale: Le latin laisse ces relations implicites; les expliciter résoudrait une ambiguïté réelle du texte.
- issue: Sens de iustitiae et iniustitiae
  choice: Les comprendre comme des œuvres ou manifestations de justice et d’injustice.
  alternative: Traduire par « les justes » et « les injustes », ou par les abstractions « la justice » et « l’injustice ».
  rationale: Les pluriels latins et le parallélisme avec opus favorisent ici des actes personnifiés, sans identifier directement des groupes humains.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle et les images du texte latin sont conservées. « Sera manifestée » a été retenu plutôt que « sera montrée » pour un français plus naturel dans ce contexte judiciaire et eschatologique.
