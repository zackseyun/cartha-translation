  text: seducat a uita in mortem. Secundus ordo, quoniam uident complicationem, in qua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/093.yaml
  text: 'The second order: because they see the entanglement in which the souls of the ungodly wander[a], and the punishment that awaits them.'
translation:
  language: fr
  text: 'Deuxième catégorie : elles voient l’enchevêtrement[a] dans lequel errent les âmes des impies, ainsi que le châtiment qui les attend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la perplexité ».'
    reason: Le latin « complicationem » peut désigner une situation embrouillée ou un trouble, une perplexité ; « enchevêtrement » privilégie l’image spatiale appelée par « dans lequel errent ».
lexical_decisions:
- source_word: ordo
  choice: état
  rationale: Dans cette énumération des expériences des âmes, « état » exprime plus naturellement en français le sens contextuel de rang ou étape sans suggérer un ordre religieux.
- source_word: complicationem
  choice: enchevêtrement
  rationale: Le terme latin évoque ce qui est replié, embrouillé ou entremêlé; avec l’idée d’errer « dans » cet enchevêtrement, une image spatiale convient mieux que le seul état psychologique de perplexité.
- source_word: uagantur
  choice: errent
  rationale: Rend directement le mouvement sans direction exprimé par le verbe latin et conserve l’image spatiale liée à « complicationem ».
- source_word: impiorum
  choice: des impies
  rationale: Terme français courant dans le registre biblique pour ceux qui rejettent Dieu ou agissent sans piété, sans ajouter une qualification confessionnelle.
- source_word: supplicium / poena (continuation attestée par la tradition textuelle consultée)
  choice: châtiment
  rationale: Formulation digne et naturelle qui conserve l’idée d’une sanction à venir.
theological_decisions:
- issue: Rapport entre la vision et le sort des âmes impies
  choice: Conserver la distinction entre l’enchevêtrement actuel où elles errent et le châtiment qui les attend.
  alternative: Fondre les deux éléments en une seule description de leur peine.
  rationale: La syntaxe transmise présente deux objets de vision distincts et maintient une tension temporelle entre la condition observée et la sanction à venir.
translation_notes:
  register: Français international moderne, clair et digne. La tournure énumérative « Deuxième état » reprend le cadre du passage. Le marqueur [a] est placé immédiatement après le mot concerné.
