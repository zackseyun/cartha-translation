  text: Premièrement[a], elles voient avec une grande joie la gloire de celui qui les accueille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une ancienne délimitation plaçait ici : « car elles se reposeront en sept ordres ». Dans le texte latin suivi, cette proposition commence le verset 92.'
