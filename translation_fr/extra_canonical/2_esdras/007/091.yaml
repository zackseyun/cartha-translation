lexical_decisions:
- source_word: Imprimis
  choice: Premièrement
  rationale: Rend directement l’introduction du premier élément d’une série.
- source_word: cum exultatione multa
  choice: avec une grande joie
  rationale: Expression naturelle en français qui conserve l’intensité de l’exultation latine.
- source_word: gloriam eius
  choice: la gloire de celui
  rationale: Le génitif renvoie à la personne qui accueille les âmes.
- source_word: qui suscipit eas
  choice: qui les accueille
  rationale: « Accueille » exprime naturellement suscipere dans ce contexte; « les » conserve le référent féminin pluriel implicite dans eas.
theological_decisions:
- issue: Identité de « celui qui les accueille »
  choice: Conserver la périphrase sans nommer explicitement Dieu
  alternative: « la gloire de Dieu, qui les accueille »
  rationale: Le latin emploie un pronom relatif et ne précise pas expressément l’identité; la traduction préserve cette formulation.
- issue: Délimitation du verset
  choice: Terminer après « les accueille »
  alternative: Ajouter « car elles se reposeront selon sept ordres »
  rationale: La clause supplémentaire appartient au verset 92 dans le texte latin fourni et ne doit pas être intégrée au verset 91.
translation_notes:
  register: Français moderne, clair et digne. Le pronom féminin pluriel « elles » reprend les âmes mentionnées dans le contexte immédiat.
