  text: 'Et respondi et dixi: hic sermo meus primus et novissimus, quoniam melius erat non dare terramAdam vel, cum iam dedisset, coercereeum ut non peccaret.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
translation:
  language: fr
  text: 'Et je répondis : « Voici ma première et ma dernière parole : il aurait mieux valu que la terre ne produise pas Adam ou bien, après qu’elle l’eut déjà produit, l’empêcher de pécher. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hic sermo meus primus et novissimus
  choice: Voici ma première et ma dernière parole
  rationale: Rend naturellement la déclaration solennelle tout en conservant l’idée d’une parole présentée comme définitive.
- source_word: non dare terram Adam
  choice: ne pas donner la terre à Adam
  rationale: Lecture syntaxique directe de « terram » comme complément de « dare » et de l’indéclinable « Adam » comme destinataire; l’autre analyse grammaticale possible est signalée en note.
- source_word: cum iam dedisset
  choice: après la lui avoir donnée
  rationale: Conserve le parfait antérieur et le sujet sous-entendu de « dedisset », tout en précisant naturellement en français que la terre est ce qui a été donné à Adam.
- source_word: coercere eum ut non peccaret
  choice: l’empêcher de pécher
  rationale: Expression française concise et fidèle au sens de retenir Adam de manière qu’il ne pèche pas.
theological_decisions:
- issue: La terre est-elle donnée à Adam ou produit-elle Adam ?
  choice: Le texte principal comprend que la terre est donnée à Adam.
  alternative: « Il aurait mieux valu que la terre ne produise pas Adam ou, après qu’elle l’avait produit, qu’il soit empêché de pécher. »
  rationale: Le latin permet formellement d’analyser « terram » comme sujet accusatif de l’infinitif et « Adam » comme son objet, puisque le nom Adam est indéclinable. Toutefois, « dare terram Adam » se lit très naturellement comme « donner la terre à Adam », avec un sujet divin sous-entendu, que reprend « dedisset ». La variante est conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation garde la force de la protestation d’Esdras et son affirmation théologiquement tendue sans l’atténuer.
