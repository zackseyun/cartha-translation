source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: fr
  text: Après sept jours, l’âge qui n’est pas encore éveillé sera réveillé, et ce qui est corrompu mourra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: l’âge
  rationale: Dans ce contexte eschatologique, le latin désigne l’âge ou le monde à venir. « L’âge » conserve la formulation temporelle et l’étrangeté de la personnification sans imposer « monde ».
- source_word: qui nondum vigilat
  choice: qui ne veille pas encore
  rationale: Rend directement l’image de vigilare et prépare naturellement le contraste avec « sera réveillé ».
- source_word: excitabitur
  choice: sera réveillé
  rationale: Préserve le passif latin et l’image du réveil, sans préciser l’agent implicite.
- source_word: corruptum
  choice: ce qui est corrompu
  rationale: Le neutre substantivé reste indéterminé dans le latin. « Corrompu » traduit l’état exprimé, plutôt que la seule aptitude à se corrompre.
theological_decisions:
- issue: Référent de saeculum
  choice: l’âge
  alternative: le monde
  rationale: Le latin peut porter une nuance temporelle ou cosmique. « L’âge » maintient cette tension eschatologique sans identifier explicitement le référent au monde.
- issue: Référent de corruptum
  choice: ce qui est corrompu
  alternative: ce qui est corruptible
  rationale: La formulation neutre conserve l’indétermination du texte et suit plus directement corruptum, sans transformer l’état de corruption en simple mortalité ou corruptibilité.
translation_notes:
  register: Français moderne, sobre et digne. La personnification inhabituelle de « l’âge » et le parallélisme entre veille, réveil, corruption et mort sont volontairement conservés.
