  source_fidelity: Le sens causal de quoniam et la nuance modale de non esset sont bien rendus. Toutefois, « devant leur perdition » ne correspond pas naturellement à in perditione eorum, qui situe la tristesse à l’égard / au sujet de leur perdition. Le parallélisme avec super eos est plus net si les deux compléments sont rendus par « au sujet de ».
  naturalness: « De la tristesse devant leur perdition » est peu idiomatique et peut suggérer une tristesse éprouvée en présence de leur perdition plutôt qu’une tristesse à son sujet. La révision est plus naturelle en français moderne soutenu.
  terminology: « Perdition » conserve utilement le terme du latin sans en préciser la portée. « Le salut a été assuré » est une restitution recevable de persuasa est salus; la note conserve prudemment la possibilité de « promis », conformément à l’incertitude de cette tournure inhabituelle.
