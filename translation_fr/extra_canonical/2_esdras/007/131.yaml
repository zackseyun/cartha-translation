id: 2ES.7.131
reference: 2 Esdras 7:131
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
translation:
  language: fr
  text: Car il ne devrait y avoir aucune tristesse au sujet de leur perdition, de même qu’il y aura de la joie au sujet de ceux à qui le salut a été assuré[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à qui le salut a été promis » ; le latin peut évoquer un salut donné comme certain ou faisant l’objet d’une assurance.
    reason: La tournure persuasa est salus est inhabituelle et permet une nuance entre assurance et promesse.
lexical_decisions:
- source_word: quoniam
  choice: Car
  rationale: Rend la valeur causale de quoniam, plutôt qu’une conséquence comme « donc ».
- source_word: non esset tristitia
  choice: il ne devrait pas y avoir de tristesse
  rationale: Conserve la nuance modale de l’imparfait du subjonctif esset sans la transformer en simple futur indicatif.
- source_word: in perditione eorum
  choice: devant leur perdition
  rationale: Expression française naturelle qui garde perdition dans son sens de ruine ou perte définitive, sans préciser davantage sa nature.
- source_word: sicut et futurum est gaudium super eos
  choice: tout comme il y aura de la joie pour ceux
  rationale: Reproduit le parallèle entre l’absence de tristesse et la joie future dans un français courant et digne.
- source_word: quibus persuasa est salus
  choice: à qui le salut a été assuré
  rationale: Persuasa est, construit avec le datif quibus, exprime ici l’idée que le salut a été rendu certain ou donné comme assurance. « Assuré » reste plus proche de cette formulation que « promis », tout en évitant le calque inintelligible « persuadé ».
theological_decisions:
- issue: Portée de persuasa est salus
  choice: le salut a été assuré
  alternative: le salut a été promis
  rationale: Le latin évoque une assurance ou une certitude communiquée, sans employer le vocabulaire latin habituel de la promesse. Le texte principal conserve donc « assuré », tandis que la note signale une autre compréhension possible.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le parallélisme de la phrase latine est conservé, ainsi que la nuance modale de esset et l’ambiguïté relative de persuasa est.
