  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
translation:
  language: fr
  text: 'Le septième ordre, supérieur à tous ceux qui viennent d’être mentionnés : ils exulteront avec assurance, ils auront confiance sans être couverts de honte et ils se réjouiront sans crainte, car ils ont hâte de voir le visage de celui qu’ils ont servi durant leur vie et de la part de qui ils recevront leur récompense, eux qui seront glorifiés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Septimus ordo
  choice: Le septième état
  rationale: Dans ce contexte, « ordo » désigne l’un des états ou degrés successifs des âmes plutôt qu’un ordre donné ou un groupe organisé. « État » est naturel en français et convient à la progression décrite.
- source_word: exultabunt cum fiducia
  choice: ils exulteront avec assurance
  rationale: Conserve la force de « exultabunt » et rend « fiducia » par une assurance confiante, sans atténuer la joie intense.
- source_word: confidebunt non confusi
  choice: ils mettront leur confiance sans être couverts de honte
  rationale: Rend le rapport entre la confiance et l’absence de honte publique ou d’humiliation; évite le faux sens moderne de « confusion » au sens d’incertitude mentale.
- source_word: non reuerentes
  choice: sans crainte
  rationale: Dans ce contexte, le participe exprime la peur ou l’appréhension, non le respect révérenciel.
- source_word: festinant uidere uultum
  choice: ils ont hâte de voir le visage
  rationale: « Avoir hâte » exprime naturellement en français l’empressement de « festinant », tandis que « visage » garde l’image concrète de « vultum ».
- source_word: gloriosi
  choice: une fois glorifiés
  rationale: L’adjectif latin se rapporte au sujet pluriel, non à « récompense ». Cette formulation rend clairement l’état glorifié des bénéficiaires.
- source_word: mercedem
  choice: leur récompense
  rationale: « Récompense » correspond au sens contextuel de la rétribution reçue de celui qu’ils ont servi.
theological_decisions:
- issue: Référent de « gloriosi »
  choice: Les serviteurs sont glorifiés lorsqu’ils reçoivent leur récompense.
  alternative: Ils reçoivent une récompense glorieuse.
  rationale: La forme nominative plurielle « gloriosi » qualifie grammaticalement le sujet pluriel; elle ne peut pas modifier l’accusatif singulier « mercedem ».
- issue: Identité de celui dont le visage est contemplé
  choice: Conserver la désignation indirecte « celui qu’ils ont servi ».
  alternative: Expliciter « Dieu » ou « le Seigneur ».
  rationale: Le passage transmis emploie une périphrase; l’expliciter résoudrait une référence que le texte laisse implicite.
translation_notes:
  register: Français moderne, digne et accessible. La structure en trois mouvements — exulter, faire confiance, se réjouir — est maintenue. Le deux-points conserve le caractère d’énumération du septième état, tandis que quelques ajustements syntaxiques évitent une formulation artificielle.
