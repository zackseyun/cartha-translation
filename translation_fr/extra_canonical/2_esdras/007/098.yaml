  source_fidelity: « Ordo » désigne la septième catégorie de la série énumérée; « ordre » le conserve sans interpréter davantage comme un état. Les futurs d’exultation, de confiance et de réjouissance sont préservés, de même que le présent de « festinant » par « ont hâte ». « Gloriosi » qualifie les personnes qui reçoivent la récompense, non la récompense elle-même.
  naturalness: « Mettront leur confiance » est compréhensible, mais moins idiomatique que « auront confiance ». « De la part de qui » évite la tournure plus lourde « de qui » après une relative longue. La formulation conserve un français actuel et un registre digne.
  terminology: « Ordre » est préférable à « état » pour rendre directement le latin « ordo » et maintenir le lien avec les ordres précédents. « Couverts de honte », « sans crainte », « visage », « glorifiés » et « récompense » rendent fidèlement les termes et images du passage sans ajout doctrinal.
