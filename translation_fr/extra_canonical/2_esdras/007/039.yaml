  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/039.yaml
  text: This is such a day[a], which has neither sun nor moon nor stars,
translation:
  language: fr
  text: Ce jour est tel[a] qu’il n’a ni soleil, ni lune, ni étoiles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici un jour tel qu’il n’a ni soleil, ni lune, ni étoiles. »'
    reason: Le latin elliptique « Hic talis » peut se comprendre soit comme une reprise de « ce jour », soit comme une tournure présentative.
lexical_decisions:
- source_word: Hic
  choice: Ce jour
  rationale: Le démonstratif proximal latin renvoie au « jour du jugement » mentionné juste avant. « Ce jour » conserve ce renvoi immédiat sans employer le distal « ce jour-là ».
- source_word: talis
  choice: est tel
  rationale: Cette tournure restitue sobrement la caractérisation exprimée par talis et reste naturelle en français.
- source_word: neque solem neque lunam, neque stellas
  choice: ni soleil, ni lune, ni étoiles
  rationale: La triple coordination négative est conservée, ainsi que l’ordre des trois astres.
- source_word: '[habeat]'
  choice: qu’il n’a
  rationale: Le verbe est suppléé dans l’édition latine. « Avoir » reflète directement cette restitution tout en produisant une phrase française intelligible.
theological_decisions:
- issue: Nature du jour du jugement
  choice: Décrire ce jour comme dépourvu de soleil, de lune et d’étoiles
  alternative: Interpréter ces éléments comme une image explicitement symbolique ou comme l’abolition définitive des astres
  rationale: Le texte énonce seulement leur absence pour ce jour; la traduction n’ajoute aucune explication cosmologique ou doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’ellipse caractérisante du latin tout en rétablissant en français la copule nécessaire. La ponctuation finale en virgule respecte le fait que la phrase se poursuit.
