  source_fidelity: 'Le texte rend correctement la structure conditionnelle non causale de « et iudex, si », le titre « le Juge », l’instrumental « par sa parole », ainsi que l’opposition entre le pardon et l’effacement des contemptiones. « Actes de mépris » restitue utilement la nuance de contemptionum, plus précise que « fautes ». La finale française exprime avec justesse le sens général attesté également par la piste anglaise : seuls très peu demeureraient d’une multitude innombrable. La note signale à bon droit l’état abrupt et grammaticalement problématique de la clause latine transmise, sans prétendre résoudre la difficulté au-delà de ce qui est sûr.'
