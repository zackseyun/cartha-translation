  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
translation:
  language: fr
  text: Et si le Juge ne pardonnait pas à ceux qui ont été créés par sa parole et n’effaçait pas la multitude de leurs actes de mépris, peut-être ne resterait-il, d’une multitude innombrable, qu’un très petit nombre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin transmis est abrupt et présente une difficulté grammaticale dans la dernière proposition; le sens général est qu’il ne resterait que très peu de personnes parmi une multitude innombrable.
    reason: textual_grammar
lexical_decisions:
- source_word: iudex
  choice: le Juge
  rationale: Le titre défini convient au contexte et permet de conserver la référence à Dieu sans ajouter un pronom absent du latin.
- source_word: ignoverit
  choice: ne pardonnait pas
  rationale: Dans cette condition irréelle, l’imparfait français rend naturellement le parfait du subjonctif latin après si.
- source_word: verbo eius
  choice: par sa parole
  rationale: Conserve le sens instrumental de l’ablatif verbo et la formulation théologiquement chargée du texte.
- source_word: deleverit
  choice: n’effaçait pas
  rationale: « Effacer » rend directement deleverit et maintient l’image d’une suppression des fautes plutôt qu’un simple pardon reformulé.
- source_word: multitudinem contemptionum
  choice: la multitude de leurs actes de mépris
  rationale: Contemptionum désigne des manifestations de mépris ou de défi, et non de simples fautes; « actes de mépris » est naturel en français. Le possessif explicite leur rapport aux personnes pardonnées, implicite dans le contexte.
- source_word: nisi pauci valde
  choice: qu’un très petit nombre
  rationale: Expression idiomatique qui conserve l’insistance de valde sur l’extrême petitesse du reste.
theological_decisions:
- issue: Relation entre le jugement et le pardon divins
  choice: Conserver côte à côte le titre « le Juge », le pardon et l’effacement des actes de mépris
  alternative: Expliquer que la miséricorde tempère le jugement
  rationale: Le texte maintient lui-même cette tension sans en proposer une systématisation théologique.
- issue: Valeur de la proposition conditionnelle
  choice: « Et si le Juge ne pardonnait pas… »
  alternative: « Car, s’il ne pardonnait pas… » ou « Et le Juge, s’il ne pardonne pas… »
  rationale: Le latin transmis porte et iudex, si, sans conjonction causale. La traduction conserve donc la transition additive et la condition, sans importer « car » des versets voisins.
translation_notes:
  register: Français international actuel, digne et lisible. La phrase garde le mouvement hypothétique du latin, tout en réorganisant légèrement sa finale grammaticalement difficile pour produire un français naturel.
