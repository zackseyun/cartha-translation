  text: let those times come[a], in which you will begin to renew the creation, or are we tormented from now on?” And he answered me and said, “I will show you this also; but as for you, do not mingle with them
translation:
  language: fr
  text: 'que viennent ces temps où tu commenceras à renouveler la création, ou bien sommes-nous tourmentés dès maintenant ? » Il me répondit : « Je te montrerai aussi cela. Mais toi, ne te mêle pas à eux'
