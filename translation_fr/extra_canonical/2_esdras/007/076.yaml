lexical_decisions:
- source_word: ueniant tempora illa
  choice: que viennent ces temps
  rationale: Le subjonctif latin s’inscrit dans une proposition qui se poursuit depuis le verset précédent; cette tournure française conserve ce raccord sans transformer artificiellement le segment en impératif autonome.
- source_word: creaturam renouare
  choice: renouveler la création
  rationale: Rend directement le sens cosmique de creaturam et l’action de renouare, dans une formulation française naturelle et théologiquement non restrictive.
- source_word: amodo
  choice: dès maintenant
  rationale: Exprime le point de départ temporel indiqué par le latin, plutôt qu’une idée de soudaineté.
- source_word: tu autem noli commisceri cum eis
  choice: Mais toi, ne te mêle pas à eux
  rationale: L’antéposition de « toi » préserve l’emphase de tu autem; « ne te mêle pas à eux » rend naturellement l’interdiction portée par noli commisceri.
theological_decisions:
- issue: Moment où commence le tourment après la mort
  choice: sommes-nous tourmentés dès maintenant ?
  alternative: allons-nous être tourmentés dès maintenant ?
  rationale: Le présent latin cruciamur est conservé afin de ne pas trancher au-delà du texte la question temporelle posée par le locuteur.
