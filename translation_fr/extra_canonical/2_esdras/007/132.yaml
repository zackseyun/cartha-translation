  text: 'Et respondi et dixi: scio, domine, quoniam nunc vocatus est Altissimus misericors, in eo quod misereatur qui nondum in saeculo advenerunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
translation:
  language: fr
  text: 'Je répondis : « Je sais, Seigneur, que le Très-Haut est maintenant appelé miséricordieux parce qu’il fait miséricorde à ceux qui ne sont pas encore venus au monde[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « venus dans le siècle » ou « dans le monde ». Le mot peut aussi évoquer l’« âge »; l’expression désigne ici ceux qui ne sont pas encore nés.
    reason: Rendre compte de la portée de saeculum sans imposer « âge » comme unique sens littéral et sans perdre l’idiome désignant les personnes non encore nées.
lexical_decisions:
- source_word: Et respondi et dixi
  choice: Je répondis
  rationale: La formule latine redondante est rendue par l’expression française naturelle « Je répondis », sans perte de fonction narrative.
- source_word: misericors / misereatur
  choice: miséricordieux / fait miséricorde
  rationale: La répétition lexicale est conservée afin de rendre le lien explicite entre le titre attribué au Très-Haut et son action.
- source_word: qui nondum in saeculo advenerunt
  choice: ceux qui ne sont pas encore venus au monde
  rationale: Dans cette construction, « venir dans le monde » désigne naturellement l’entrée dans l’existence humaine, tout en laissant en note le sens plus littéral de saeculum.
theological_decisions:
- issue: Portée de « in saeculo » dans le cadre eschatologique de 4 Esdras
  choice: venus au monde
  alternative: venus dans l’âge
  rationale: Le contexte immédiat décrit ceux qui ne sont pas encore nés; la traduction idiomatique française évite de transformer sans nécessité l’expression en référence technique aux deux âges, tandis que la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, digne et accessible. « Seigneur » et « Très-Haut » conservent le registre religieux du passage. La virgule finale est maintenue puisque le verset se poursuit syntaxiquement.
