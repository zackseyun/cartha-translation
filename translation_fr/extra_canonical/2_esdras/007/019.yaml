  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
translation:
  language: fr
  text: 'Et il me dit : « Tu n’es pas meilleur juge que le Seigneur, ni plus avisé que le Très-Haut.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, avec une tournure non idiomatique : « Tu n’es pas juge au-dessus du Seigneur, ni intelligent au-dessus du Très-Haut. » Le latin super peut aussi, formellement, évoquer une position d’autorité sur le Seigneur et le Très-Haut.'
    reason: Préserver l’ambiguïté formelle de super tout en donnant dans le texte principal son sens comparatif probable.
lexical_decisions:
- source_word: iudex super Dominum
  choice: meilleur juge que le Seigneur
  rationale: Dans ce parallélisme, super se comprend naturellement au sens comparatif. Cette formulation française exprime clairement que l’interlocuteur ne saurait juger mieux que le Seigneur, sans lui attribuer une autorité sur Dieu.
- source_word: intellegens super Altissimum
  choice: plus intelligent que le Très-Haut
  rationale: Le participe substantivé intellegens désigne celui qui comprend ou qui est intelligent; avec super, la lecture comparative est la plus naturelle et maintient le parallélisme avec la première proposition.
- source_word: Altissimum
  choice: le Très-Haut
  rationale: Titre divin traditionnel, exact et immédiatement compréhensible en français moderne.
theological_decisions:
- issue: Sens de super dans les deux propositions
  choice: Lecture comparative dans les deux membres
  alternative: « juge au-dessus du Seigneur » et « quelqu’un qui comprend au-dessus du Très-Haut »
  rationale: La lecture comparative rend le parallélisme latin de manière cohérente et produit un français naturel. Une note conserve toutefois la possibilité formelle d’un sens spatial ou hiérarchique de super.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme des deux propositions est conservé; la comparaison explicite évite une tournure littérale obscure.
