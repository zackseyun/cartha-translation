  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
translation:
  language: fr
  text: 'Le troisième ordre : elles voient le témoignage que celui qui les a formées a rendu à leur sujet[a] : durant leur vie, elles ont gardé la loi qui leur avait été donnée dans la foi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le témoignage que leur a rendu celui qui les a formées ». Le datif latin peut désigner les âmes comme objet du témoignage ou comme celles auxquelles il est rendu.'
    reason: ambiguïté grammaticale du datif latin « eis »
lexical_decisions:
- source_word: Tertius ordo
  choice: Le troisième ordre
  rationale: Rend directement l’intitulé latin et conserve la structure énumérative du passage.
- source_word: uidentes
  choice: elles voient
  rationale: Le participe présent latin marque ici une nouvelle construction; une forme verbale française explicite est plus naturelle sans introduire une valeur causale absente.
- source_word: testimonium quod testificatus est
  choice: le témoignage … a rendu
  rationale: « Rendre témoignage » restitue l’écho entre le nom et le verbe latins dans un français digne et courant.
- source_word: qui plasmauit eas
  choice: celui qui les a formées
  rationale: « Former » correspond à plasmare; le féminin « formées » reprend les âmes mentionnées dans le contexte.
- source_word: uiuentes
  choice: durant leur vie
  rationale: Exprime naturellement la valeur temporelle de « vivant » et évite une tournure française lourde.
- source_word: seruauerunt legem quae data est eis in fide
  choice: elles ont gardé la loi qui leur avait été confiée
  rationale: « Garder la loi » conserve le vocabulaire biblique de seruare; « confiée » rend le sens contextuel de la loi remise à leur fidélité, conformément au texte continu attesté et à la couche de consultation.
theological_decisions:
- issue: Destinataire ou objet du témoignage dans « eis »
  choice: à leur sujet
  alternative: leur a rendu
  rationale: Le contexte des âmes justes favorise un témoignage porté à leur sujet, mais le datif latin peut aussi se lire comme indiquant les bénéficiaires ou destinataires; une note conserve cette ambiguïté sans imposer une interprétation doctrinale.
- issue: Rapport entre le témoignage et l’obéissance durant la vie
  choice: deux-points avant « durant leur vie »
  alternative: virgule suivie de « à savoir que »
  rationale: Le deux-points présente la fidélité à la loi comme le contenu du témoignage tout en préservant la densité syntaxique du latin.
translation_notes:
  register: Français international moderne, sobre et digne. Le féminin des pronoms et participes renvoie explicitement aux « âmes » du contexte précédent. La structure participiale latine est transformée en proposition verbale pour assurer la lisibilité, sans ajouter de lien causal.
