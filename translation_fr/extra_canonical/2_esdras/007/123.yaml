source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam ostendetur paradisus, cuius fructus incorruptus perseverat, in quo est saturitas et medella,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: fr
  text: Et parce que le paradis sera montré, dont le fruit demeure incorruptible et où se trouvent la satiété et la guérison,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendetur
  choice: sera révélé
  rationale: Le passif latin signifie littéralement « sera montré » ; « sera révélé » exprime naturellement en français la manifestation future du paradis.
- source_word: fructus incorruptus perseverat
  choice: le fruit demeure impérissable
  rationale: « Demeure » rend perseverat, tandis qu’« impérissable » restitue incorruptus dans un français naturel et digne.
- source_word: saturitas
  choice: le rassasiement
  rationale: Le terme désigne l’état de pleine satiété ; « rassasiement » conserve cette idée concrète sans la réduire à une plénitude abstraite.
- source_word: medella
  choice: la guérison
  rationale: Medella signifie remède ou guérison ; dans cette description du paradis, « guérison » rend clairement le bienfait obtenu tout en restant proche du sens latin.
theological_decisions:
- issue: Lien logique introduit par quoniam
  choice: parce que
  alternative: puisque
  rationale: « Parce que » conserve explicitement la valeur causale de quoniam et le lien syntaxique avec le contexte précédent, sans transformer la proposition en condition.
- issue: Référent de cuius
  choice: lui dont le fruit
  alternative: dont le fruit
  rationale: L’ajout du pronom disjoint clarifie que le relatif renvoie au paradis, tout en préservant la structure descriptive du latin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase reste ouverte par une virgule finale, conformément au fragment source, qui se poursuit syntaxiquement dans le contexte.
