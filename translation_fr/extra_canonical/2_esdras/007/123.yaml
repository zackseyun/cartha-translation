  source_fidelity: Le lien causal de quoniam est bien rendu par « parce que », et la construction reste volontairement suspendue, comme le latin. Toutefois, ostendetur signifie d’abord « sera montré » ; « sera révélé » introduit une nuance de dévoilement qui n’est pas nécessaire. « Satiété » est un équivalent plus idiomatique et précis de saturitas que « rassasiement ».
