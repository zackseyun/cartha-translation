  source_fidelity: Le double vocatif dominator domine est correctement rendu par « Seigneur souverain », et l’opposition uilius / pretiosius est bien conservée. En revanche, quod abundat signifie littéralement « ce qui abonde » ou « ce qui est abondant » ; le comparatif « plus abondant » n’est pas exprimé par le latin et n’est pas requis par le parallélisme avec rarius.
