source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi : dominator domine, quod abundat uilius, quod enim rarius pretiosius est.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
translation:
  language: fr
  text: 'Et je dis : « Seigneur souverain[a], ce qui abonde a moins de valeur[b], car ce qui est plus rare est plus précieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le latin porte deux titres au vocatif : « maître, seigneur » ; ou « Souverain Seigneur ».'
    reason: Le latin juxtapose dominator et domine ; la note signale cette double titulature et une autre restitution française possible.
  - marker: b
    text: Ou « vaut moins » ; le terme peut aussi évoquer ce qui est moins cher.
    reason: Le latin uilius peut désigner une moindre valeur ou, selon le contexte, un prix inférieur.
lexical_decisions:
- source_word: dominator domine
  choice: Seigneur souverain
  rationale: Les deux vocatifs forment une adresse solennelle. « Seigneur souverain » restitue en français naturel à la fois l’autorité exprimée par dominator et le titre domine, sans transformer l’adresse en proposition relative.
- source_word: quod abundat
  choice: ce qui est plus abondant
  rationale: Le comparatif implicite dans le contraste avec rarius est exprimé clairement, conformément au parallélisme de la maxime.
- source_word: uilius
  choice: a moins de valeur
  rationale: Le comparatif de vilis peut évoquer un prix moindre, mais son opposition à pretiosius porte ici plus largement sur la valeur; cette formulation conserve ce registre général.
- source_word: rarius pretiosius est
  choice: ce qui est plus rare est plus précieux
  rationale: La répétition comparative et l’opposition entre rareté et abondance sont conservées directement.
theological_decisions:
- issue: Nature du double titre divin dominator domine
  choice: Seigneur souverain
  alternative: Maître, Seigneur
  rationale: Le choix principal donne une adresse française idiomatique et digne tout en conservant les deux notions; la note signale la structure plus littérale sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, clair et soutenu. La phrase garde la forme concise d’une maxime et l’adresse solennelle du latin.
