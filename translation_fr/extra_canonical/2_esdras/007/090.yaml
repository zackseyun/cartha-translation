  yaml_path: translation/extra_canonical/2_esdras/007/090.yaml
  text: 'the danger, that they might perfectly keep the law of the Lawgiver. Therefore this is concerning them:'
translation:
  language: fr
  text: 'le danger, afin qu’ils observent parfaitement la loi du Législateur. C’est pourquoi voici ce qui les concerne :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periculum
  choice: le danger
  rationale: Rend directement le nom latin tout en conservant le caractère fragmentaire de la proposition, qui se rattache au contexte précédent.
- source_word: uti ... custodirent
  choice: afin qu’ils observent
  rationale: La conjonction exprime ici le but, et « observer la loi » est l’expression française naturelle pour custodire legem.
- source_word: perfecte
  choice: parfaitement
  rationale: Conserve explicitement la portée forte de l’adverbe latin sans l’atténuer.
- source_word: legislatoris legem
  choice: la loi du Législateur
  rationale: Préserve la répétition conceptuelle du latin et traite « Législateur » comme un titre désignant celui qui donne la loi.
- source_word: Propter quod hic de his
  choice: C’est pourquoi voici ce qui les concerne
  rationale: Restitue la conséquence introduite par propter quod et le tour elliptique hic de his dans un français clair, sans ajouter l’idée de « doctrine » absente du texte.
theological_decisions:
- issue: Identification du « Législateur »
  choice: Conserver le titre « Législateur » sans expliciter son identité
  alternative: Remplacer par « Dieu, qui a donné la loi »
  rationale: Le latin emploie legislator sans nommer explicitement Dieu dans ce fragment; l’explicitation supprimerait cette retenue du texte.
translation_notes:
  register: Français moderne, digne et accessible. La minuscule initiale est maintenue parce que le verset commence au milieu d’une phrase; les deux-points finaux signalent que la pensée se poursuit.
