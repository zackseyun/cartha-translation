  text: 'et respondi et dixi: dominator domine, ecce disposuisti in lege tua, quoniam iusti hereditabunt haec, impii autem peribunt.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
translation:
  language: fr
  text: 'Alors je répondis : « Souverain Seigneur, voici, tu as établi dans ta loi que les justes hériteront de ces choses, mais que les impies périront. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Souverain Seigneur
  rationale: Rend le double vocatif solennel et le titre d’autorité, sans le transformer en proposition descriptive.
- source_word: ecce
  choice: voici
  rationale: Conserve le marqueur rhétorique qui attire l’attention sur le principe énoncé dans la loi.
- source_word: disposuisti
  choice: tu as établi
  rationale: Exprime ici une disposition fixée dans la loi; formulation naturelle en français juridique et religieux.
- source_word: iusti
  choice: les justes
  rationale: Équivalent français traditionnel et précis pour ceux qui sont caractérisés comme justes.
- source_word: hereditabunt
  choice: hériteront
  rationale: Préserve l’image juridique et théologique de l’héritage.
- source_word: impii
  choice: les impies
  rationale: Rend l’opposition morale et religieuse avec les justes sans ajouter de précision confessionnelle.
theological_decisions:
- issue: Nature de ce dont les justes hériteront
  choice: ces choses
  alternative: cela
  rationale: Le pluriel démonstratif haec renvoie au contexte antérieur sans expliciter davantage un référent que le verset laisse implicite.
- issue: Portée de l’énoncé légal
  choice: que les justes hériteront de ces choses, mais que les impies périront
  alternative: les justes hériteront de ces choses, tandis que les impies périront
  rationale: La construction maintient l’antithèse explicite du latin sans expliquer la nature de la perdition ni résoudre les tensions théologiques du contexte.
translation_notes:
  register: Français moderne, digne et accessible. Le tour redondant « je répondis et dis » a été naturellement condensé en « je répondis », tandis que « voici » et l’adresse solennelle ont été conservés. Aucun appel de note n’est nécessaire.
