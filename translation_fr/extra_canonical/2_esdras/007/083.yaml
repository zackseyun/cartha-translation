base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/083.yaml
  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: fr
  text: 'La troisième voie : elles voient la récompense réservée à ceux qui ont fait confiance aux alliances du Très-Haut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tertia uia
  choice: La troisième voie
  rationale: Rend directement l’énumération latine tout en conservant le terme imagé « voie ».
- source_word: uident
  choice: elles voient
  rationale: 'Le sujet féminin pluriel est fourni par le contexte immédiat : les âmes dont les voies de tourment sont énumérées.'
- source_word: repositam mercedem
  choice: la récompense réservée
  rationale: « Réservée » exprime naturellement l’idée d’une récompense mise de côté et gardée en vue de son attribution.
- source_word: his qui … testamentis Altissimi crediderunt
  choice: à ceux qui ont fait confiance aux alliances du Très-Haut
  rationale: La fin de la phrase, connue dans le texte latin de l’édition mais absente de l’extrait fourni après « his qui », est rendue conformément à la leçon consultée dans la couche anglaise. « Faire confiance à » conserve ici la force de credere avec le datif; le pluriel « alliances » rend testamentis sans l’assimiler automatiquement à des « testaments » au sens moderne.
theological_decisions:
- issue: Sens de « testamentis »
  choice: alliances
  alternative: testaments
  rationale: Dans ce contexte religieux, « alliances » communique mieux l’idée d’engagements divins auxquels on se fie, tout en conservant le pluriel du latin et sans préciser lesquelles.
translation_notes:
  register: Français international moderne, clair et digne. La construction brève et énumérative du latin est préservée. Aucun ajout explicatif n’est introduit dans le corps du verset.
