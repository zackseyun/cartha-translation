source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et nunc de sermonibus tuis intellege, quoniam dixisti, quia nobiscum crescit sensus;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/071.yaml
  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: fr
  text: Et maintenant, comprends d’après tes paroles, car tu as dit que l’intelligence croît avec nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de sermonibus tuis
  choice: à partir de tes propres paroles
  rationale: La préposition « de » indique ici le point de départ de la déduction; « propres » rend naturellement en français la force du possessif latin.
- source_word: intellege
  choice: comprends
  rationale: Impératif direct et courant, correspondant au latin sans alourdir la formulation.
- source_word: sensus
  choice: l’intelligence
  rationale: Dans ce contexte, « sensus » désigne la faculté de comprendre ou le discernement plutôt que la simple sensation.
- source_word: nobiscum crescit
  choice: grandit avec nous
  rationale: Traduction proche qui conserve l’image de croissance ainsi que l’ambiguïté de « avec nous ».
theological_decisions:
- issue: Nature et progression du « sensus »
  choice: l’intelligence grandit avec nous
  alternative: notre intelligence grandit à mesure que nous grandissons
  rationale: La formulation retenue préserve la construction et la tension du latin, sans préciser si l’intelligence croît parallèlement à l’être humain, en lui, ou collectivement avec l’humanité.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du latin tout en étant naturelle; aucune note n’est nécessaire.
