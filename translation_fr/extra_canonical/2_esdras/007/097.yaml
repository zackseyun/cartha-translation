source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et spatiosum, [quod incipient] recipere fruniscentes et immortales. Sextus ordo, quando eis ostendetur, quomodo incipiet uultus eorum fulgere sicut sol, et quomodo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: fr
  text: 'Le sixième degré : il leur sera alors montré comment leur visage commencera à resplendir comme le soleil et comment ils commenceront à être semblables à la lumière des étoiles, désormais incorruptibles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sextus ordo
  choice: Le sixième degré
  rationale: Dans cette série d’états successifs, « degré » exprime naturellement en français la place ou l’étape désignée par le latin « ordo », sans évoquer ici un ordre religieux ou un commandement.
- source_word: ostendetur
  choice: il leur sera alors montré
  rationale: Le futur passif latin est conservé; « alors » rend naturellement la valeur temporelle de « quando » dans cette construction.
- source_word: uultus eorum fulgere sicut sol
  choice: leur visage commencera à resplendir comme le soleil
  rationale: Le singulier collectif « leur visage » suit le latin, tandis que « resplendir » restitue la force lumineuse de « fulgere » dans un registre digne et courant.
- source_word: incorruptible
  choice: incorruptibles
  rationale: Ce terme conserve la notion théologique précise d’une condition désormais soustraite à la corruption, plutôt que de la réduire à la seule immortalité.
theological_decisions:
- issue: Nature de la transformation décrite
  choice: devenir semblables à la lumière des étoiles
  alternative: briller comme les étoiles
  rationale: La formulation retenue préserve la distinction du texte entre le visage qui resplendit comme le soleil et les personnes qui deviennent semblables à la lumière des étoiles, sans fusionner les deux images.
- issue: Portée temporelle de l’incorruptibilité
  choice: désormais incorruptibles
  alternative: étant alors incorruptibles
  rationale: « Désormais » indique qu’à partir de ce moment leur état est permanent, tout en évitant d’ajouter une explication doctrinale absente du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure en deux propositions coordonnées et les deux comparaisons lumineuses sont conservées; le futur du latin reste explicite.
source_grounding:
  english_pob_role: consult_only
