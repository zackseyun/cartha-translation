source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: praesens saeculum non est finis, gloria in eo non frequens manet, propter hoc oraverunt qui potuerunt pro invalidis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
translation:
  language: fr
  text: 'Il me répondit : « Le monde présent n’est pas la fin ; la gloire n’y demeure pas continuellement.[a] C’est pourquoi ceux qui le pouvaient ont prié pour les faibles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « la gloire n’y demeure pas souvent ».'
    reason: Le latin « non frequens » peut évoquer soit l’absence de continuité, soit une faible fréquence ; le contexte favorise ici l’idée de non-permanence.
lexical_decisions:
- source_word: praesens saeculum
  choice: le monde présent
  rationale: Dans ce contexte eschatologique, « saeculum » désigne l’ordre ou le monde présent, par contraste avec ce qui vient après la fin.
- source_word: finis
  choice: la fin
  rationale: Traduction directe qui conserve la portée eschatologique sans préciser davantage ce que le latin laisse implicite.
- source_word: gloria
  choice: la gloire
  rationale: Équivalent formel et théologiquement non restrictif de « gloria ».
- source_word: non frequens manet
  choice: n’y demeure pas continuellement
  rationale: « Frequens » qualifie ici la permanence de la gloire dans le monde présent ; « continuellement » rend le contraste entre sa présence passagère et la stabilité attendue au-delà de la fin.
- source_word: qui potuerunt
  choice: ceux qui en étaient capables
  rationale: Préserve la formulation générale du latin sans attribuer une capacité précise non exprimée.
- source_word: invalidis
  choice: les faibles
  rationale: Rend le datif substantivé par un terme courant qui peut couvrir faiblesse, impuissance ou incapacité sans surinterprétation médicale.
theological_decisions:
- issue: Caractère transitoire de la gloire dans le monde présent
  choice: la gloire n’y demeure pas continuellement
  alternative: la gloire n’y demeure pas souvent
  rationale: Le contexte oppose le monde présent, qui n’est pas l’état final, à une gloire non permanente. La traduction retenue exprime cette instabilité sans définir la nature de la gloire.
- issue: Identité de ceux qui prient et des faibles
  choice: conserver des désignations générales
  alternative: préciser qu’il s’agit des justes priant pour les pécheurs
  rationale: Le verset latin ne donne pas ces identités de manière explicite ; les préciser importerait l’interprétation du contexte dans le texte lui-même.
translation_notes:
  register: Français moderne, international et digne. La tournure redondante « répondit et dit » a été naturellement condensée en « répondit ». Le discours direct et l’enchaînement argumentatif sont conservés.
