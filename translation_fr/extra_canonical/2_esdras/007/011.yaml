id: 2ES.7.11
reference: 2 Esdras 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter eos enim feci saeculum, et quando transgressus est Adam constitutiones meas, iudicatum est quod factum est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
translation:
  language: fr
  text: Car c’est pour eux que j’ai fait le monde[a] ; et quand Adam a transgressé mes prescriptions, ce qui avait été fait a été jugé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âge ».
    reason: Saeculum peut désigner soit le monde, soit l’âge ou l’ère ; le contexte de la création favorise « monde », mais l’autre sens demeure lexicalement possible.
lexical_decisions:
- source_word: propter eos
  choice: c’est pour eux
  rationale: 'Dans ce contexte, la locution exprime naturellement le but ou le bénéfice : le monde a été fait pour eux, plutôt que simplement à cause d’eux.'
- source_word: saeculum
  choice: le monde
  rationale: Bien que saeculum puisse signifier « âge », son emploi comme objet de feci et son lien avec quod factum est désignent ici vraisemblablement le monde créé.
- source_word: constitutiones meas
  choice: mes prescriptions
  rationale: « Prescriptions » rend des dispositions établies par Dieu sans imposer le sens plus étroit de « lois » ou le registre administratif de « constitutions ».
- source_word: iudicatum est quod factum est
  choice: ce qui avait été fait a été jugé
  rationale: Cette formulation conserve la voix passive et l’ambiguïté du latin quant à la nature et aux conséquences du jugement.
theological_decisions:
- issue: Rapport entre la transgression d’Adam et le jugement de la création
  choice: 'Conserver l’énoncé passif : « ce qui avait été fait a été jugé »'
  alternative: « la création fut condamnée » ou « le monde créé fut soumis au jugement »
  rationale: Le latin affirme un jugement sur ce qui avait été fait sans préciser ici s’il s’agit d’une condamnation, d’une sentence particulière ou de ses modalités. La traduction ne résout donc pas cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « c’est pour eux que » souligne la valeur téléologique de propter eos, tandis que le passif final préserve la formulation théologiquement tendue de la source.
