  text: and Hezekiah for the people in the days of Sennacherib, and many for many?
translation:
  language: fr
  text: et Ézéchias pour le peuple au temps de Sennachérib, et beaucoup pour beaucoup ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pro populo
  choice: pour le peuple
  rationale: 'Rend directement la préposition latine « pro » tout en préservant son éventail possible : en faveur du peuple, à sa place ou comme intercesseur pour lui.'
- source_word: in diebus Sennacherib
  choice: au temps de Sennachérib
  rationale: Expression française naturelle qui correspond à l’idiome latin signifiant « à l’époque de Sennachérib ».
- source_word: multi pro multis
  choice: beaucoup pour beaucoup
  rationale: Conserve le parallélisme, la concision et l’ambiguïté du latin, sans préciser indûment la nature de l’action accomplie en faveur d’autrui.
theological_decisions:
- issue: Sens de « pro » dans les deux propositions
  choice: Conserver le simple « pour »
  alternative: « intercéda en faveur de » ou « se substitua à »
  rationale: Le fragment s’inscrit dans une série d’exemples, mais ce seul verset ne nomme pas explicitement l’action. Une formulation plus précise résoudrait une ambiguïté réelle du latin.
translation_notes:
  register: Formulation brève, interrogative et dignifiée. Les noms propres suivent les formes françaises bibliques usuelles. Le parallélisme elliptique du texte source est maintenu.
