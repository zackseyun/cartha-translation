  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: fr
  text: Et puisque des demeures de santé et de sécurité ont été mises en réserve, tandis que nous nous sommes mal conduits ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: habitacula
  choice: demeures
  rationale: Rend le pluriel latin par un terme français naturel et digne, évoquant des lieux où habiter sans la lourdeur de « habitations ».
- source_word: sanitatis et securitatis
  choice: de santé et de sécurité
  rationale: Traduction directe qui conserve les deux bienfaits distincts et leur formulation abstraite.
- source_word: reposita sunt
  choice: ont été mises en réserve
  rationale: Exprime l'idée de biens préparés ou gardés en réserve, sans préciser par qui ni où.
- source_word: male conversati sumus
  choice: nous nous sommes mal conduits
  rationale: Rend le comportement moral exprimé par conversari et l'adverbe male, plutôt qu'un simple état de vie.
theological_decisions:
- issue: Rapport logique entre les demeures réservées et la mauvaise conduite humaine
  choice: Conserver la forme interrogative et le contraste introduit par « alors que »
  alternative: « mais nous nous sommes mal conduits »
  rationale: Le latin présente un fragment interrogatif lié au contexte et oppose le bien mis en réserve à la conduite humaine. « Alors que » garde cette tension sans transformer la phrase en affirmation indépendante.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La syntaxe fragmentaire et interrogative du latin est préservée, puisqu'elle dépend vraisemblablement de la série de questions du contexte.
