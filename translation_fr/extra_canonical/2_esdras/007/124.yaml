  yaml_path: translation/extra_canonical/2_esdras/007/124.yaml
  text: but we will not enter[a], for we have lived in ungrateful places?
translation:
  language: fr
  text: Mais nous, nous n’entrerons pas, parce que nous avons vécu dans des lieux déplaisants[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : dans des lieux inhospitaliers ; littéralement : dans des lieux ingrats.'
    reason: Le latin ingratis peut évoquer ce qui est déplaisant, peu accueillant ou malvenu ; « ingrats » serait plus formel, mais moins clair en français courant.
lexical_decisions:
- source_word: ingratis locis
  choice: dans des lieux déplaisants
  rationale: Le latin ingratus signifie ici « déplaisant », « désagréable » ou « malvenu ». « Lieux déplaisants » conserve la valeur générale du terme sans lui donner à tort le sens moral de « honteux ».
- source_word: conversati sumus
  choice: nous avons vécu
  rationale: Conversari avec un complément de lieu désigne le fait de séjourner, vivre ou mener sa vie quelque part ; « avons vécu » est naturel et fidèle dans ce contexte.
- source_word: non ingrediemur
  choice: nous n’entrerons pas
  rationale: Le verbe est employé sans complément exprimé ; la traduction respecte cette absence au lieu d’ajouter « y » ou « là ».
theological_decisions:
- issue: Lien causal entre la conduite passée et la non-entrée
  choice: Conserver la question rhétorique et le simple lien introduit par « parce que »
  alternative: Transformer la phrase en affirmation ou préciser ce dans quoi les personnes n’entreront pas
  rationale: Le latin laisse le complément d’« entrer » implicite et présente l’ensemble comme une question ; expliciter davantage résoudrait une tension que le texte conserve.
translation_notes:
  register: Français moderne, digne et direct. Le redoublement « Mais nous, nous » rend l’opposition marquée par nos vero. La ponctuation conserve la forme interrogative du texte latin.
