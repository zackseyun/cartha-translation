  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
translation:
  language: fr
  text: de la gloire du Très-Haut[a], d’où tous commenceront à voir les choses qui ont été placées devant eux. Une durée
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le latin claritas peut aussi signifier « clarté » ou « éclat ».
    reason: lexical_alternative
lexical_decisions:
- source_word: claritatis
  choice: gloire
  rationale: Le génitif latin peut évoquer la clarté, l’éclat ou la gloire. « Gloire » convient au contexte théophanique tout en restant naturel en français.
- source_word: Altissimi
  choice: du Très-Haut
  rationale: Titre divin traditionnel et direct correspondant au superlatif substantivé latin.
- source_word: unde
  choice: par laquelle
  rationale: Conserve le lien relatif avec la gloire, comprise comme le moyen ou la source grâce auxquels tous pourront voir, sans imposer une causalité plus précise que le latin.
- source_word: anteposita sunt
  choice: a été placé devant eux
  rationale: Rend concrètement le passif de anteponere et conserve l’indétermination du référent exprimé par quae.
- source_word: Spatium
  choice: Une durée
  rationale: Dans ce contexte temporel, « durée » est plus idiomatique que « espace » et laisse la phrase ouverte comme dans le fragment source.
theological_decisions:
- issue: Rapport entre la gloire du Très-Haut et la vision accordée à tous
  choice: par laquelle
  alternative: d’où / si bien que
  rationale: La traduction maintient le lien instrumental ou source possible sans décider si la gloire cause directement la vision ou constitue le lieu d’où elle procède.
translation_notes:
  register: Français moderne, digne et accessible. Le caractère fragmentaire du début et de la fin est conservé, puisque l’extrait latin commence par un génitif et s’achève sur le premier mot de la proposition suivante.
