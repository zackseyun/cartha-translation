source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post annos hos, et morietur Filius meus Christus et omnes qui spiramentum habent hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/029.yaml
  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: fr
  text: Après ces années, mon Fils, le Messie, mourra, ainsi que tous ceux qui ont un souffle humain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filius meus Christus
  choice: mon Fils, le Messie
  rationale: « Filius meus » est rendu directement par « mon Fils ». Ici, le latin « Christus » est un titre correspondant à « Messie » plutôt qu’un nom propre.
- source_word: spiramentum habent hominis
  choice: ont un souffle humain
  rationale: Cette formulation naturelle conserve l’idée littérale du souffle propre aux humains, sans réduire explicitement l’expression à « tous les humains ».
theological_decisions:
- issue: La mort du Fils/Messie
  choice: mourra
  alternative: connaîtra la mort
  rationale: Le verbe latin « morietur » affirme directement la mort; la traduction préserve cette formulation théologiquement tendue sans l’atténuer.
- issue: Portée de « tous ceux qui ont un souffle humain »
  choice: tous ceux qui ont un souffle humain
  alternative: tous les humains
  rationale: La tournure imagée du latin est conservée afin de ne pas expliciter davantage que la source l’identité ou l’étendue exacte du groupe.
translation_notes:
  register: Français moderne, clair et digne. La coordination « ainsi que » rend naturellement le second groupe associé au verbe « mourra », tandis que les virgules présentent « le Messie » comme l’apposition explicative de « mon Fils ».
