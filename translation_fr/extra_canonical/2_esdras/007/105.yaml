revisions:
- from: « qu’il comprenne à sa place, ou dorme, ou mange, ou soit guéri pour lui. Ainsi, jamais personne ne priera pour quelqu’un d’autre, car tous porteront alors, chacun, ses propres injustices ou ses propres actes de justice. »
  to: « qu’il comprenne, dorme, mange ou soit guéri à sa place. Ainsi, jamais personne ne priera pour quelqu’un d’autre, car tous porteront alors, chacun, ses propres injustices ou ses propres actes de justice. »
  rationale: La seule correction réorganise le complément représentant eo afin qu’il porte sans ambiguïté sur les quatre verbes de la série. Le reste du texte est conservé, notamment la relation causale introduite par « car », l’adverbe « alors » avec « porteront », et l’insistance conjointe de « tous » et « chacun ».
  reviewer_model: gpt-5.6-terra
