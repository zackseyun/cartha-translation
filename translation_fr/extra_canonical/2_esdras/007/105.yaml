  text: or a friend who is most dear[a], that he may understand, or sleep, or eat, or be healed for him; so no one will ever pray for another, for all will then bear, each one, his own unrighteousnesses or righteousnesses.”
translation:
  language: fr
  text: « qu’il comprenne, dorme, mange ou soit guéri à sa place. Ainsi, jamais personne ne priera pour quelqu’un d’autre, car tous porteront alors, chacun, ses propres injustices ou ses propres actes de justice. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eo
  choice: à sa place / pour lui
  rationale: L’ablatif pronominal renvoie à la personne au bénéfice de laquelle un autre accomplirait ces actes. En français, la reprise varie légèrement selon le verbe afin que la série reste naturelle.
- source_word: nunquam nemo
  choice: jamais personne ne
  rationale: Le double négatif latin a ici une valeur négative renforcée; cette tournure française en rend naturellement le sens.
- source_word: pro aliquo
  choice: pour quelqu’un d’autre
  rationale: Dans le contexte de l’intercession, « pour quelqu’un d’autre » exprime clairement qu’une personne ne priera pas en faveur d’une autre.
- source_word: iniustitias suas aut iustitias
  choice: ses propres injustices ou ses propres actes de justice
  rationale: Le pluriel est conservé. « Actes de justice » évite l’expression peu naturelle « ses justices » tout en maintenant le contraste avec les injustices.
theological_decisions:
- issue: Responsabilité individuelle lors du jugement
  choice: « tous porteront alors, chacun, ses propres injustices ou ses propres actes de justice »
  alternative: « chacun portera alors sa propre injustice ou sa propre justice »
  rationale: La formulation retenue conserve à la fois omnes (« tous »), unusquisque (« chacun ») et les pluriels latins, sans atténuer l’accent mis sur la responsabilité individuelle universelle.
- issue: Lien logique introduit par enim
  choice: car
  alternative: mais
  rationale: Enim donne la raison pour laquelle personne ne priera pour autrui; il n’introduit pas un contraste.
translation_notes:
  register: Français moderne, digne et accessible. Le passage fourni commence au milieu d’une construction; la traduction n’ajoute donc pas la mention anglaise d’« un ami très cher », qui n’apparaît pas dans le texte latin transmis. La répétition « ou… ou… ou… » est maintenue pour refléter la structure de la source.
