  text: 'si fideles pro carissimis. [Et respondit ad me et dixit: quoniam inueniisti gratiam ante oculos meos, et hoc demonstrabo tibi: dies iudicii dies decretorius est, et omnibus signaculum ueritatis ostendet; quemadmodum enim non mittit pater filium, uel filius patrem, uel dominus seruum], uel fidus carissimum, ut pro'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a servant, or a friend a beloved one[b], to speak on his behalf in the judgment'
translation:
  language: fr
  text: 'Il me répondit[a] : « Puisque tu as trouvé grâce à mes yeux, je te montrerai aussi ceci : le jour du jugement est un jour décisif, et il montrera à tous le sceau de la vérité. En effet, de même qu’un père n’envoie pas son fils, ni un fils son père, ni un maître son serviteur, ni un ami un être qui lui est très cher[b], pour parler en son nom lors du jugement… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une partie de ce verset provient du fragment retrouvé qui manque dans la plupart des manuscrits latins médiévaux. Les exemples soulignent que, dans la vie ordinaire, une personne ne peut pas en remplacer une autre, en guise d’analogie avec le jugement final.
    reason: recovered_fragment
  - marker: b
    text: 'Le latin est très condensé : il emploie littéralement des termes correspondant à « fidèle/ami » et « très cher », sans préciser davantage la nature du lien.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: gratiam ante oculos meos
  choice: grâce à mes yeux
  rationale: Conserve l’image sémitisante transmise par le latin tout en restant immédiatement compréhensible en français biblique moderne.
- source_word: dies decretorius
  choice: un jour décisif
  rationale: Rend decretorius sans préciser au-delà du texte la manière dont ce jour décide ou tranche.
- source_word: signaculum ueritatis
  choice: le sceau de la vérité
  rationale: Préserve l’image concrète du sceau et son association à la vérité.
- source_word: ostendet
  choice: il montrera
  rationale: Respecte le futur latin et prend « le jour du jugement » comme sujet grammatical.
- source_word: dominus seruum
  choice: un maître son serviteur
  rationale: « Serviteur » rend ici la relation d’autorité sans imposer une précision sociale supérieure à celle qu’exige le contexte.
- source_word: fidus carissimum
  choice: un ami la personne qui lui est la plus chère
  rationale: Le latin condensé oppose celui qui est fidèle à un être très cher; « ami » explicite naturellement le substantif sous-entendu, tandis que « la personne qui lui est la plus chère » évite de forcer le genre ou la nature exacte du lien.
theological_decisions:
- issue: Caractère non transférable de la comparution au jugement
  choice: Conserver l’analogie sous sa forme négative, sans expliciter davantage sa portée doctrinale
  alternative: Ajouter que personne ne peut comparaître ou intercéder à la place d’un autre
  rationale: Le passage illustre cette idée, mais le fragment cité ne formule pas encore toute la conclusion; l’expliciter dans le corps du texte résoudrait prématurément la tension.
- issue: Fonction du « sceau de la vérité »
  choice: Garder la métaphore sans l’identifier
  alternative: L’interpréter comme le verdict, la preuve ou la révélation définitive de la vérité
  rationale: Le latin ne précise pas ce que désigne exactement le sceau; la traduction conserve donc l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive de l’analogie est conservée. Les possessifs sont ajoutés là où le français naturel les exige. Les points de suspension signalent que l’extrait latin fourni s’interrompt après « ut pro » (« pour, en faveur de… »), tandis que la formulation « parler en sa faveur lors du jugement » suit la continuation attestée par la couche anglaise auditée.
