  source_fidelity: Le futur d’ostendet est bien rendu par « montrera », et les images « grâce à mes yeux » et « sceau de la vérité » conservent fidèlement le latin. La portion restaurée est correctement signalée. Toutefois, « parler en sa faveur » tend à signifier plaider en faveur de quelqu’un, plutôt que parler/agir en son nom comme représentant; « en son nom » est plus exact tout en laissant l’antécédent implicite, comme dans la formulation transmise.
  naturalness: La phrase est globalement naturelle et de registre biblique moderne. « Ni un ami la personne qui lui est la plus chère » est cependant lourd et difficile à analyser dans une série déjà elliptique. « Ni un ami un être qui lui est très cher » maintient l’ellipse rhétorique et se lit plus naturellement.
  terminology: « Serviteur » est acceptable pour servum dans ce contexte. « Jour décisif », « sceau de la vérité » et « jugement » sont appropriés et ne surinterprètent pas le texte. La note b doit décrire la construction latine sans avancer une paraphrase présentée comme une littéralité.
