  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: fr
  text: 'Mais son entrée est étroite et située au bord d’un précipice : à droite, il y a du feu, et à gauche, une eau profonde.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: entrée
  rationale: Rend directement le passage donnant accès au lieu évoqué.
- source_word: angustus
  choice: étroite
  rationale: Équivalent naturel et précis de l’adjectif latin.
- source_word: in praecipiti positus
  choice: située au bord d’un précipice
  rationale: Expression française naturelle qui conserve l’idée d’un accès placé dans une situation abrupte et dangereuse.
- source_word: aqua alta
  choice: une eau profonde
  rationale: Dans ce contexte de danger, alta qualifie naturellement la profondeur de l’eau plutôt que son élévation.
