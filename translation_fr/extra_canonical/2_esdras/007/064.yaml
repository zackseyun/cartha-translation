source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non esse natum, ut non sensus inde fieret. Nunc autem nobiscum crescit sensus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/064.yaml
  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
translation:
  language: fr
  text: 'Mais maintenant, la conscience grandit avec nous[a], et c’est à cause de cela que nous sommes tourmentés : nous périssons en le sachant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la faculté de comprendre se développe avec nous ».
    reason: Le latin sensus peut désigner la conscience, la perception ou l’intelligence.
lexical_decisions:
- source_word: sensus
  choice: la conscience
  rationale: Dans ce contexte, le terme désigne la faculté d’avoir conscience de sa condition et de sa fin, plutôt que la simple compréhension intellectuelle.
- source_word: nobiscum crescit
  choice: grandit avec nous
  rationale: Rend directement l’idée que cette conscience se développe en même temps que nous.
- source_word: scientes perimus
  choice: nous périssons en le sachant
  rationale: 'Le participe exprime la circonstance ou la manière : les humains périssent tout en ayant pleinement conscience de leur sort, et non malgré un savoir qui aurait dû les sauver.'
theological_decisions:
- issue: Rapport entre la conscience humaine et le tourment
  choice: La conscience de la mort est présentée comme la cause du tourment.
  alternative: Comprendre que l’être humain périt malgré sa connaissance.
  rationale: L’argument oppose l’absence de conscience au malheur de connaître sa propre fin ; une lecture concessive affaiblirait ce lien causal.
translation_notes:
  register: Français moderne, naturel et digne. « Conscience » préserve ici le sens existentiel du latin sensus. Le deux-points explicite sans l’alourdir le rapport entre le tourment et le fait de périr en pleine connaissance de cause.
