id: 2ES.7.61
reference: 2 Esdras 7:61
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
translation:
  language: fr
  text: Et je ne m’attristerai pas de la multitude de ceux qui ont péri, car ce sont eux qui ont été rendus semblables à la vapeur et à la flamme, comparés à la fumée, et qui se sont embrasés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: contristabor
  choice: je ne m’attristerai pas
  rationale: Le futur latin exprime le fait d’éprouver de la tristesse; cette formulation est naturelle et digne en français moderne.
- source_word: multitudinem eorum qui perierunt
  choice: la multitude de ceux qui ont péri
  rationale: Le passé composé rend le parfait latin et conserve le sens sobre de perierunt sans préciser davantage la nature de leur perte.
- source_word: uapori assimilati sunt et flammae
  choice: ont été rendus semblables à la vapeur et à la flamme
  rationale: Cette traduction respecte la voix passive et rattache bien les deux datifs, «vapeur» et «flamme», au même verbe.
- source_word: fumo adaequati sunt
  choice: comparés à la fumée
  rationale: Le participe passif est rendu de façon concise, tout en maintenant la seconde comparaison distincte.
- source_word: exarserunt
  choice: se sont embrasés
  rationale: Le verbe latin désigne le fait de prendre feu ou de flamber; «se sont embrasés» préserve cette image sans ajouter explicitement une extinction absente du texte.
theological_decisions:
- issue: Portée de l’image de la vapeur, de la flamme et de la fumée
  choice: Conserver la succession des images sans l’expliquer
  alternative: Interpréter explicitement ces images comme une destruction totale ou une disparition
  rationale: Le latin présente des comparaisons imagées sans en expliciter toute la portée théologique; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure répétitive et solennelle du latin est conservée sans lourdeur excessive. Le fragment initial «nominatum est», qui appartient manifestement à la fin de la phrase précédente et n’est pas repris dans la délimitation anglaise du verset, n’est pas intégré au texte de 7.61.
