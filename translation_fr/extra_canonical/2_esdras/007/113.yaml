source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
translation:
  language: fr
  text: Car le jour du jugement sera la fin du temps présent et le commencement du temps immortel à venir[a], où la corruption aura disparu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du temps futur et immortel ».'
    reason: Signale une autre manière de rendre l’ordre et la relation des adjectifs latins futuri inmortalis, tout en conservant leur double qualification du temps.
lexical_decisions:
- source_word: Dies iudicii
  choice: le jour du jugement
  rationale: Expression française naturelle qui conserve le sens judiciaire et eschatologique du latin.
- source_word: finis temporis huius
  choice: la fin du temps présent
  rationale: « Ce temps » désigne ici l’ordre temporel actuel, en contraste avec celui qui vient ; « le temps présent » rend cette opposition clairement sans ajouter la notion plus technique d’« âge ».
- source_word: initium futuri inmortalis temporis
  choice: le commencement du temps immortel à venir
  rationale: « À venir » restitue la portée eschatologique de futurus, tandis que « immortel » reste directement rattaché à « temps ».
- source_word: pertransivit corruptela
  choice: la corruption aura disparu
  rationale: Le futur antérieur français exprime naturellement l’accomplissement envisagé au sein du temps futur annoncé ; « corruption » conserve la portée large du latin corruptela.
theological_decisions:
- issue: Rapport entre le temps présent et le temps à venir
  choice: Conserver le contraste entre deux temps sans les identifier explicitement à deux « âges »
  alternative: « la fin de cet âge et le commencement de l’âge immortel à venir »
  rationale: Le latin emploie tempus, « temps ». La traduction maintient donc cette désignation tout en laissant intacte la tension eschatologique.
- issue: Disparition de la corruption
  choice: « où la corruption aura disparu »
  alternative: « dans lequel la corruption est passée »
  rationale: La tournure française choisie rend l’état accompli évoqué par le parfait latin sans préciser davantage la nature physique, morale ou cosmique de la corruption.
translation_notes:
  register: Français international moderne, digne et accessible. « Marquera » évite la lourdeur de « sera la fin » tout en conservant la valeur déclarative. La virgule finale est maintenue puisque la phrase source se poursuit.
