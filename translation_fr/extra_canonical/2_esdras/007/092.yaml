id: 2ES.7.92
reference: 2 Esdras 7:92
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: fr
  text: 'Le premier ordre : parce qu’elles ont livré un dur combat pour vaincre la pensée mauvaise qui avait été façonnée avec elles[a], afin qu’elle ne les détourne pas de la vie vers la mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « façonnée avec elles » ; l’expression peut évoquer une pensée mauvaise présente dès leur formation, sans préciser davantage son origine.'
    reason: Le latin cum eis plasmatum est inhabituel et théologiquement sensible; la note préserve son ambiguïté au lieu de la résoudre dans le texte.
lexical_decisions:
- source_word: Ordo primus
  choice: Le premier ordre
  rationale: « Ordre » conserve le terme structurant de cette série de sept états ou étapes, sans imposer une interprétation plus précise comme « degré ».
- source_word: cum labore multo certati sunt
  choice: elles ont livré un dur combat
  rationale: Cette formulation naturelle rend à la fois l’effort considérable (labore multo) et l’idée de lutte (certati sunt). Le féminin reprend les âmes évoquées dans le contexte.
- source_word: plasmatum cogitamentum malum
  choice: la pensée mauvaise qui avait été façonnée
  rationale: « Façonnée » rend plasmatum et maintient l’image d’une formation, tandis que « pensée mauvaise » traduit directement cogitamentum malum sans la transformer en doctrine abstraite.
- source_word: seduceret a vita in mortem
  choice: détourne de la vie vers la mort
  rationale: « Détourner » exprime l’égarement impliqué par seducere; la construction « de… vers… » préserve le mouvement opposant vie et mort.
theological_decisions:
- issue: Rapport entre la pensée mauvaise et les âmes
  choice: « façonnée avec elles »
  alternative: « formée en elles » ou « innée en elles »
  rationale: Le latin cum eis indique littéralement une formation « avec elles ». La traduction conserve cette formulation difficile et sa tension anthropologique, sans conclure explicitement que la pensée mauvaise serait innée ou créée par Dieu.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la structure explicative du latin ainsi que le vocabulaire récurrent de la série des sept « ordres ». Le pronom féminin pluriel renvoie aux âmes dans le contexte.
