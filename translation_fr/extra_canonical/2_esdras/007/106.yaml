  text: And I answered and said[a], “How then do we now find that first Abraham prayed for the Sodomites, and Moses for the fathers who sinned in the wilderness,
translation:
  language: fr
  text: 'Je répondis et dis : « Comment donc constatons-nous maintenant qu’Abraham, le premier, a intercédé en faveur des habitants de Sodome, et que Moïse a intercédé en faveur de nos pères qui ont péché dans le désert,[a]'
