lexical_decisions:
- source_word: rogavit
  choice: a intercédé
  rationale: Dans ce contexte, le verbe désigne une prière faite en faveur d’autrui; « intercéder » exprime naturellement cette idée en français.
- source_word: primus Abraham
  choice: Abraham, le premier
  rationale: Le nominatif « primus » se rapporte à Abraham et le présente comme le premier d’une série d’intercesseurs, plutôt que d’indiquer ce pour quoi il aurait prié en premier.
- source_word: propter Sodomitas
  choice: en faveur des habitants de Sodome
  rationale: « En faveur de » rend la valeur d’intercession de « propter »; « habitants de Sodome » est plus naturel en français courant que « Sodomites », qui peut prêter à confusion aujourd’hui.
- source_word: patribus
  choice: nos pères
  rationale: Dans ce contexte historique et collectif, « nos pères » désigne les ancêtres d’Israël et conserve la portée traditionnelle du latin.
theological_decisions:
- issue: Nature de la demande d’Abraham et de Moïse
  choice: intercession en faveur d’autrui
  alternative: simple prière ou demande à leur sujet
  rationale: Le contexte évoque des figures priant pour des pécheurs; « intercéder » explicite la relation sans ajouter de conclusion doctrinale.
- issue: Portée de « primus »
  choice: Abraham est le premier dans une série
  alternative: Abraham a d’abord prié pour Sodome
  rationale: L’accord nominatif avec Abraham et la liste qui suit soutiennent la première lecture.
translation_notes:
  register: Français moderne, digne et accessible. La répétition latine « répondis et dis » est allégée en « répondis », formule naturelle qui ne perd aucune information substantielle. La syntaxe parallèle explicite le second verbe sous-entendu en latin afin d’éviter une lecture heurtée.
