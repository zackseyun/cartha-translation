id: 2ES.7.14
reference: 2 Esdras 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
translation:
  language: fr
  text: Ainsi donc, si ceux qui vivent n’entrent pas dans ces choses étroites et vaines, ils ne pourront pas recevoir ce qui a été mis en réserve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ingredientes ingressi fuerint
  choice: n’entrent pas
  rationale: La tournure redoublée, littéralement « étant entrants, ils seront entrés », relève d’un style de traduction et exprime ici naturellement l’entrée dans une proposition conditionnelle négative. Le français courant ne reproduit pas ce redoublement artificiellement.
- source_word: angusta et vana haec
  choice: ces réalités étroites et vaines
  rationale: Les adjectifs neutres substantivés désignent les conditions ou expériences évoquées dans le contexte. « Réalités » reste assez général tout en étant plus naturel que « choses ».
- source_word: quae sunt reposita
  choice: ce qui a été mis en réserve
  rationale: Cette formulation conserve le passif et l’idée de biens gardés pour plus tard, sans ajouter de bénéficiaire absent du latin.
- source_word: ergo
  choice: Ainsi
  rationale: Rend la conséquence logique dans un français soutenu mais actuel.
theological_decisions:
- issue: Nature des « réalités étroites et vaines »
  choice: Maintenir une désignation générale
  alternative: Expliciter comme les épreuves ou les difficultés de la vie présente
  rationale: Le latin ne précise pas leur nature dans ce verset; l’explicitation résoudrait indûment l’image et sa portée théologique.
- issue: Destinataire de ce qui est mis en réserve
  choice: Ne pas ajouter « pour eux »
  alternative: « ce qui leur est réservé »
  rationale: Même si le contexte peut suggérer des biens destinés aux vivants, le latin exprime seulement que quelque chose a été mis en réserve.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle est naturelle; le caractère imagé et l’ambiguïté de « étroites et vaines » sont préservés.
