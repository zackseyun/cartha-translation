  source_fidelity: La structure de la phrase est globalement respectée, y compris le futur de « requiescent » et la garde par les anges. Toutefois, « demeures réservées » interprète excessivement « promptuariis », qui désigne plus littéralement des lieux de réserve ou de dépôt, et « la gloire qui leur reste » suggère en français une gloire résiduelle plutôt que la gloire qui demeure pour eux.
  naturalness: La phrase actuelle est lisible et de registre approprié, mais « la gloire qui leur reste aux derniers temps » est peu idiomatique et peut être mal comprise. La révision conserve une syntaxe française fluide tout en rendant les liens du latin plus explicitement.
  terminology: « Ordre », « repos », « anges » et « gloire » conviennent. « Lieux de réserve » est une solution plus proche de « promptuaria » que « demeures réservées », sans recourir au terme moderne et matériel « entrepôts ».
