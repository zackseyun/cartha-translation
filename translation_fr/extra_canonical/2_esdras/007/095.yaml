  text: uerunt quae per fidem data est lex. Quartus ordo, intellegentes requiem quam nunc in promptuariis congregati requiescent cum silentio multo ab angelis conseruati, †atque in nouissimis eorum manentem gloriam.† Quintus ordo, exultantes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
translation:
  language: fr
  text: 'Le quatrième ordre : ils comprennent le repos dans lequel, maintenant rassemblés dans les lieux de réserve, ils se reposeront dans un grand silence, gardés par les anges, ainsi que la gloire qui demeure pour eux dans les temps derniers.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation latine concernant la gloire qui demeure pour les justes dans les temps derniers est textuellement incertaine, mais l’idée générale d’un repos sous la garde des anges maintenant et d’une gloire future ensuite demeure assurée.
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  choice: Le quatrième ordre
  rationale: Conserve la structure formelle du latin et la succession des différents ordres décrits dans le contexte.
- source_word: requiem … requiescent
  choice: le repos dont ils jouiront
  rationale: Rend naturellement en français la répétition latine entre le nom « repos » et le verbe « se reposer », tout en conservant la valeur future de « requiescent ».
- source_word: in promptuariis
  choice: dans leurs demeures réservées
  rationale: Le terme désigne des lieux où l’on met quelque chose en réserve; dans ce contexte, il s’agit des demeures où les âmes sont rassemblées et gardées. Cette formulation évite l’image trompeusement matérielle d’« entrepôts ».
- source_word: cum silentio multo
  choice: dans un profond silence
  rationale: Expression idiomatique et digne qui restitue l’intensité de « multo ».
- source_word: ab angelis conseruati
  choice: gardés par les anges
  rationale: Préserve le sens passif de protection et de garde.
- source_word: manentem gloriam
  choice: la gloire qui leur reste
  rationale: Suit au plus près l’idée de « manere », demeurer ou rester, sans préciser davantage la manière dont cette gloire les attend.
- source_word: in nouissimis
  choice: aux derniers temps
  rationale: Le contexte temporel et le témoignage de la version anglaise auditée favorisent le sens eschatologique, tout en évitant une précision absente du latin.
theological_decisions:
- issue: Rapport entre le repos présent des justes et leur gloire future
  choice: Maintenir la distinction entre leur rassemblement et leur garde actuels, leur repos à venir, et la gloire des derniers temps.
  alternative: Fondre le repos et la gloire en un seul état présent.
  rationale: Le futur « requiescent » et la mention « in nouissimis » soutiennent une progression temporelle qu’il ne faut pas effacer.
translation_notes:
  register: Français international moderne, sobre et digne. « Demeures réservées » conserve l’idée de lieux de dépôt ou de garde sans employer le très concret « entrepôts », peu naturel pour des âmes dans ce contexte.
