  text: 'The second way: because they cannot now make a good repentance so as to live[a].'
translation:
  language: fr
  text: 'La deuxième voie : parce qu’ils ne peuvent se repentir comme il convient afin de vivre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « accomplir un bon retour afin de vivre ».'
    reason: Signale l’image concrète de reuersio, rendue idiomatiquement dans le texte par « se repentir ».
lexical_decisions:
- source_word: Secunda via
  choice: La deuxième voie
  rationale: Rend directement l’expression latine et conserve la structure énumérative du passage.
- source_word: reuersionem bonam facere
  choice: se repentir comme il convient
  rationale: Le latin désigne littéralement le fait d’accomplir un « bon retour »; dans ce contexte moral, « se repentir » exprime naturellement ce retour, tandis que « comme il convient » préserve la qualification bonam.
- source_word: ut uiuant
  choice: afin de vivre
  rationale: Conserve explicitement la valeur finale de ut et le sens de uiuant.
theological_decisions:
- issue: Temporalité postérieure à la mort
  choice: Ne pas ajouter « maintenant » ou « désormais »
  alternative: « ils ne peuvent désormais se repentir »
  rationale: Le contexte peut suggérer cette nuance temporelle, mais le texte latin transmis ici ne comporte aucun adverbe correspondant; la traduction évite donc de l’expliciter.
- issue: Sens de reuersio
  choice: Interprétation contextuelle par « repentir »
  alternative: « retour » ou « conversion »
  rationale: « Repentir » convient au contexte du changement moral nécessaire à la vie, sans préciser davantage la nature théologique de cette vie.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la syntaxe lapidaire de l’énumération latine, tout en évitant le calque peu naturel « faire une bonne repentance ».
