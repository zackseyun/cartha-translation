  source_fidelity: 'Le texte rend fidèlement les trois propositions latines. « se révélera » restitue naturellement revelabitur sans préciser la nature de cette manifestation. « sur le siège du jugement » conserve l''image et la préposition de super sedem iudicii. « les miséricordes disparaîtront » exprime de façon claire la valeur privative de pertransibunt. Enfin, « la patience prendra fin » rend le sens contextuel de longanimitas congregabitur : la longanimité cesse d''être accordée au moment du jugement, tout en évitant un littéralisme français obscur.'
