source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et revelabitur Altissimus super sedem iudicii, et pertransibunt misericordiae, et longanimitas congregabitur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
translation:
  language: fr
  text: Alors le Très-Haut se révélera sur le siège du jugement ; les miséricordes disparaîtront et la patience prendra fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: revelabitur
  choice: se révélera
  rationale: Rend directement le passif latin sous une forme pronominale française naturelle, sans préciser davantage le mode de manifestation.
- source_word: super sedem iudicii
  choice: sur le siège du jugement
  rationale: Conserve l’image judiciaire et la préposition du latin dans un français digne et intelligible.
- source_word: pertransibunt misericordiae
  choice: les miséricordes disparaîtront
  rationale: Dans ce contexte eschatologique, pertransire indique que les miséricordes passeront et ne seront plus disponibles ; « disparaîtront » exprime clairement ce résultat sans ajouter d’agent.
- source_word: longanimitas congregabitur
  choice: la patience prendra fin
  rationale: Le littéral « sera rassemblée/recueillie » serait obscur en français. Dans le parallélisme privatif avec la disparition des miséricordes, la formule signifie vraisemblablement que la longanimité divine sera retirée, donc qu’elle prendra fin.
theological_decisions:
- issue: Fin de la miséricorde et de la longanimité au jugement
  choice: les miséricordes disparaîtront et la patience prendra fin
  alternative: les miséricordes passeront et la longanimité sera recueillie
  rationale: Le choix préserve l’affirmation sévère du texte concernant le jugement sans l’adoucir, tout en rendant intelligible l’idiome sous-jacent à congregabitur. « Patience » est plus courant que « longanimité » et conserve ici l’idée de tolérance prolongée.
translation_notes:
  register: Français international moderne, solennel mais accessible. La coordination est structurée par un point-virgule afin de faire ressortir la manifestation du juge puis la cessation de la miséricorde et de la patience.
