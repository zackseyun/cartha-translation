  rationale: « Electos » signifie ici des pierres sélectionnées ou de qualité; « de choix » préserve ce sens sans imposer celui, plus précis, de « précieuses ».
- source_word: paucos ualde
  choice: un très petit nombre
  rationale: Expression française naturelle qui restitue l’intensification de « paucos » par « ualde ».
