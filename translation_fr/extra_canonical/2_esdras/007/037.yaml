source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
translation:
  language: fr
  text: 'Alors le Très-Haut dira aux nations réveillées[a] : « Regardez et comprenez qui vous avez renié, qui vous n’avez pas servi et dont vous avez méprisé les voies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux nations qui ont été relevées ».
    reason: Signale l’autre nuance possible de excitatas tout en maintenant dans le texte principal l’image contextuelle du réveil.
lexical_decisions:
- source_word: Altissimus
  choice: le Très-Haut
  rationale: Équivalent français traditionnel, clair et digne du titre divin latin.
- source_word: excitatas gentes
  choice: les nations réveillées
  rationale: « Réveillées » conserve l’image explicite du réveil dans le contexte de la résurrection, plutôt que de la réduire au seul fait d’être relevées; « nations » correspond directement à gentes.
- source_word: uidete et intellegite
  choice: Regardez et comprenez
  rationale: Rend directement les deux impératifs sans fusionner leur portée.
- source_word: quem negastis
  choice: qui vous avez renié
  rationale: Le pronom personnel quem appelle « qui »; « renier » exprime un refus personnel plus précisément que le simple fait de nier une proposition.
- source_word: cui non [seruistis]
  choice: qui vous n’avez pas servi
  rationale: La formulation française maintient le parallélisme personnel et reprend la continuation attestée par la couche de consultation anglaise, le texte latin fourni étant matériellement tronqué après non.
- source_word: '[cuius diligentias spreuistis]'
  choice: de qui vous avez méprisé les voies
  rationale: La formulation suit la couche anglaise auditée pour la fin absente de l’extrait latin fourni; « voies » reste naturelle et conserve la portée comportementale sans préciser artificiellement des commandements particuliers.
theological_decisions:
- issue: Sens de excitatas dans le cadre du jugement et de la résurrection
  choice: réveillées
  alternative: ressuscitées / relevées
  rationale: Le terme latin peut évoquer le fait d’éveiller ou de relever. Le contexte immédiat développe l’image du sommeil et du réveil; le choix retenu préserve cette métaphore sans expliciter davantage le mécanisme de la résurrection.
- issue: Objet personnel de negastis
  choice: qui vous avez renié
  alternative: celui que vous avez nié
  rationale: « Renier » convient à une personne et garde la force relationnelle du latin, sans identifier plus précisément cette personne que ne le fait le verset.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe parallèle conserve les trois reproches et l’ambiguïté sur l’identité de la personne reniée. Le marqueur [a] figure dans le texte principal.
