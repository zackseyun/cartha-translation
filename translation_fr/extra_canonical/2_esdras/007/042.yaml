source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: fr
  text: ni pluie ni rosée, ni midi ni nuit ni aurore, ni éclat ni clarté ni lumière, mais seulement le rayonnement de la gloire du Très-Haut, grâce auquel tous commenceront à voir ce qui leur est présenté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam / rorem
  choice: pluie / rosée
  rationale: Traduction directe des deux phénomènes atmosphériques, tous deux explicitement présents dans le latin.
- source_word: meridiem / noctem / ante lucem
  choice: midi / nuit / aurore
  rationale: « Aurore » rend naturellement l’expression latine désignant le moment qui précède la pleine lumière du jour.
- source_word: nitorem / claritatem / lucem
  choice: lueur / clarté / lumière
  rationale: Cette série française conserve trois termes distincts et leur progression sans les confondre avec le « rayonnement » qui suit.
- source_word: splendorem
  choice: rayonnement
  rationale: « Rayonnement » exprime ici une lumière émanant de la gloire divine et évite de répéter « clarté » ou d’employer « splendeur » dans deux fonctions rapprochées.
- source_word: praeposita sunt
  choice: ce qui leur est présenté
  rationale: Formulation volontairement ouverte, qui conserve l’indétermination de ce qui est placé ou présenté devant eux.
theological_decisions:
- issue: Nature de l’unique lumière dans l’état décrit
  choice: le rayonnement de la gloire du Très-Haut
  alternative: la splendeur glorieuse du Très-Haut
  rationale: La formulation retenue maintient la distinction entre la gloire du Très-Haut et le rayonnement qui en émane, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive « ni… ni… » préserve le rythme accumulatif du latin; « mais seulement » rend naturellement l’exclusion finale.
