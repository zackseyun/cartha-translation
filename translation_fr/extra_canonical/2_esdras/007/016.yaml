  text: et quare non accepisti in corde tuo quod futurum, sed quod in praesenti?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/016.yaml
  text: And why have you not taken to heart what is to come, rather than what is present?”
translation:
  language: fr
  text: Et pourquoi n’as-tu pas pris à cœur ce qui est à venir, plutôt que ce qui est présent ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: accepisti in corde tuo
  choice: as-tu pris à cœur
  rationale: Cette expression française naturelle conserve l’image du cœur et exprime l’idée d’accueillir intérieurement ou de considérer sérieusement.
- source_word: quod futurum
  choice: ce qui est à venir
  rationale: Rend directement la perspective future sans préciser davantage ce que le latin laisse indéterminé.
- source_word: quod in praesenti
  choice: ce qui est présent
  rationale: Préserve le contraste temporel avec « ce qui est à venir » et l’ambiguïté du substantif implicite.
theological_decisions:
- issue: Nature de la réalité future et présente
  choice: Conserver les formulations générales « ce qui est à venir » et « ce qui est présent »
  alternative: Expliciter par « le monde à venir » et « le monde présent »
  rationale: Le latin n’emploie pas explicitement « monde »; ne pas l’ajouter préserve l’ambiguïté et évite une interprétation théologique plus étroite.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à la deuxième personne du singulier du latin. La ponctuation finale conserve le guillemet fermant fourni par le contexte anglais.
