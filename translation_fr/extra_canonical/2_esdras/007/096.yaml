id: 2ES.7.96
reference: 2 Esdras 7:96
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
translation:
  language: fr
  text: 'Le cinquième ordre : ils se réjouissent de voir comment ils ont maintenant échappé à ce qui est corruptible et comment ils hériteront de ce qui est à venir[a], tout en voyant encore l’étroitesse et les peines dont ils ont été délivrés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils ont maintenant échappé à ce qui est corruptible et qu’ils hériteront de ce qui est à venir ».'
    reason: Le latin quomodo peut ici introduire le contenu de leur joie (« que ») plutôt que désigner la manière (« comment »).
lexical_decisions:
- source_word: corruptibile
  choice: ce qui est corruptible
  rationale: Conserve la portée abstraite et ouverte du neutre latin, sans le réduire au seul corps mortel ni à un monde corrompu.
- source_word: futurum
  choice: ce qui est à venir
  rationale: Rend le neutre substantivé de manière naturelle tout en maintenant son horizon eschatologique sans le préciser davantage.
- source_word: hereditatem possidebuut [possident/possidebunt]
  choice: ils prendront possession en héritage
  rationale: Exprime à la fois l’idée de possession et celle d’héritage portée par la tournure latine, avec une valeur future conforme au contexte et à la forme transmise.
- source_word: angustum et labore plenum
  choice: le chemin étroit et pénible
  rationale: Le substantif implicite est explicité par « chemin », naturellement suggéré par l’image et le contexte; « pénible » restitue l’idée de ce qui est rempli de labeur.
- source_word: liberati sunt
  choice: ils en ont été délivrés
  rationale: Le pronom « en » rattache naturellement la délivrance au chemin étroit et pénible qui vient d’être mentionné.
theological_decisions:
- issue: Sens des deux occurrences parallèles de quomodo
  choice: comment… et comment…
  alternative: qu’ils… et qu’ils…
  rationale: Le latin tardif permet de comprendre quomodo comme une conjonction introduisant un discours indirect (« que »), mais sa répétition peut aussi conserver une nuance de manière. La traduction principale maintient le parallélisme et l’ambiguïté expressive; la note donne l’autre lecture.
- issue: Référent de corruptibile
  choice: 'formulation générale : « ce qui est corruptible »'
  alternative: « la condition corruptible » ou « le monde corruptible »
  rationale: Le neutre latin ne précise pas s’il s’agit du corps, de la condition présente ou de l’ordre du monde; la traduction n’impose donc aucune de ces interprétations.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme du latin est conservé. « Le chemin » explicite sobrement le substantif sous-entendu après angustum, et « puisqu’ils en ont été délivrés » rend la relation causale tout en reliant la délivrance à l’épreuve mentionnée.
