review_pass:
  verdict: revise
  source_fidelity: 'La répétition de quomodo est bien rendue de façon parallèle par « comment … et comment … », et la note conserve légitimement la possibilité, en latin tardif, d’une complétive en « que ». « Corruptible » et « ce qui est à venir » respectent les neutres abstraits du latin. En revanche, « prendre possession en héritage » ajoute une lourdeur et exprime de manière peu exacte la valeur usuelle de hereditatem possidere : « hériter de » suffit. « Chemin » est une explicitation possible, mais « l’étroitesse et les peines » reste plus près des expressions substantivées du texte fourni, sans imposer une image précise.'
  naturalness: 'Le français est globalement clair et de registre approprié. « Prendre possession en héritage » n’est toutefois pas idiomatique dans ce contexte. La formulation révisée allège aussi la finale : « dont ils ont été délivrés » rattache clairement la délivrance à l’étroitesse et aux peines, plutôt que de laisser « en » dépendre artificiellement du seul « chemin ».'
  terminology: « Ordre », « corruptible », « hériter », « ce qui est à venir », « étroitesse » et « peines » conviennent à un français biblique moderne et international. La traduction ne détermine pas indûment la nature de ce qui est corruptible ni de ce qui est à venir.
  issues:
  - severity: medium
    issue: « prendront possession en héritage »
    rationale: La formule est pesante et non idiomatique. Hereditatem possidere se rend naturellement par « hériter de »; cette solution conserve à la fois l’idée d’héritage et l’acquisition/possession impliquée.
  - severity: low
    issue: « le chemin étroit et pénible »
    rationale: Le latin fourni présente angustum et labore plenum sans substantif explicite. « Chemin » est défendable, mais il précise l’image. « L’étroitesse et les peines » conserve plus sobrement l’expression et son caractère non spécifié.
