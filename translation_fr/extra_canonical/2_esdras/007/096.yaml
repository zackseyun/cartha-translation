revisions:
- from: 'Le cinquième ordre : ils se réjouissent de voir comment ils ont maintenant échappé à ce qui est corruptible et comment ils prendront possession en héritage de ce qui est à venir[a], tout en voyant encore le chemin étroit et pénible, puisqu’ils en ont été délivrés.'
  to: 'Le cinquième ordre : ils se réjouissent de voir comment ils ont maintenant échappé à ce qui est corruptible et comment ils hériteront de ce qui est à venir[a], tout en voyant encore l’étroitesse et les peines dont ils ont été délivrés.'
  rationale: La révision remplace une expression française maladroite par « hériteront de », qui rend directement hereditatem possidere. Elle évite aussi d’introduire explicitement « chemin » là où le latin transmis ne donne pas de substantif, tout en préservant le lien entre l’épreuve décrite et la délivrance. Le parallélisme des deux quomodo et son ambiguïté possible sont maintenus par le texte et la note.
