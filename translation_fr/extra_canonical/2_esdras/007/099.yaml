lexical_decisions:
- source_word: seruiunt
  choice: servent
  rationale: Rend directement le présent latin et conserve l’idée de service rendu à Dieu.
- source_word: gloriosi
  choice: ceux qui sont dans la gloire
  rationale: Le substantif adjectival désigne les glorieux; cette formulation française naturelle évite de suggérer qu’ils seraient simplement renommés.
- source_word: mercedem
  choice: récompense
  rationale: Dans ce contexte eschatologique, « récompense » exprime mieux le sens que « salaire ».
- source_word: ordo
  choice: ordre
  rationale: Conserve le terme latin, qui peut désigner l’enchaînement ou la disposition des expériences décrites.
- source_word: a modo
  choice: maintenant
  rationale: Dans cette phrase d’annonce, « maintenant » est naturel et garde la valeur temporelle sans imposer le sens plus fort de « désormais ».
- source_word: cruciatus
  choice: tourment
  rationale: Exprime la souffrance punitive sans restreindre le terme à une forme physique précise.
theological_decisions:
- issue: Identité de l’antécédent de « eius »
  choice: '[lui]'
  alternative: Dieu
  rationale: Le fragment commence en cours de phrase; le pronom préserve le lien avec le contexte sans expliciter davantage que le latin.
- issue: Sens eschatologique de « gloriosi »
  choice: ceux qui sont dans la gloire
  alternative: les glorieux
  rationale: La formulation retenue exprime un état de gloire tout en évitant une lecture fondée sur le prestige humain.
- issue: Phrase inachevée à la fin du verset
  choice: maintien de « que » en suspens
  alternative: compléter la proposition à partir du verset suivant
  rationale: Le texte source fourni se termine sur le relatif « quas »; le compléter importerait dans ce segment un contenu absent.
