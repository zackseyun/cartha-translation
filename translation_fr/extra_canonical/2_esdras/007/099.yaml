translation:
  language: fr
  text: '[lui][a], que servent les vivants et de qui ceux qui sont dans la gloire commencent à recevoir leur récompense. Tel est l’ordre des âmes des justes, comme il est maintenant annoncé ; [et telles sont] les voies de tourment décrites précédemment, que'
