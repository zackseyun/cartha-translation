  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: fr
  text: Le dérèglement a pris fin, l’incrédulité a été retranchée, mais la justice a grandi et la vérité s’est levée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  choice: le dérèglement
  rationale: Le latin désigne le manque de maîtrise ou de mesure. « Dérèglement » conserve cette portée générale sans la réduire à la seule recherche des plaisirs.
- source_word: soluta est
  choice: a pris fin
  rationale: Dans ce contexte eschatologique, la tournure exprime la disparition du dérèglement; « a pris fin » est naturel en français tout en évitant le littéralisme ambigu « a été délié ».
- source_word: incredulitas
  choice: l’incrédulité
  rationale: Équivalent direct qui peut désigner le refus de croire aussi bien que l’absence de foi.
- source_word: abscisa est
  choice: a été retranchée
  rationale: Conserve l’image forte d’une chose coupée et supprimée.
- source_word: iustitia
  choice: la justice
  rationale: Rend le terme latin sans trancher entre droiture morale, juste conduite et justice au sens plus large.
- source_word: crevit
  choice: a grandi
  rationale: Reproduit simplement l’idée de croissance portée par le latin.
- source_word: veritas
  choice: la vérité
  rationale: Équivalent direct et naturel.
- source_word: orta est
  choice: s’est levée
  rationale: Préserve l’image d’un lever ou d’une apparition, possiblement comparable au lever d’un astre, sans l’expliciter.
theological_decisions:
- issue: Relation logique entre la disparition du mal et la croissance du bien
  choice: « tandis que »
  alternative: « mais »
  rationale: Le latin autem marque ici un contraste ou une transition légère. « Tandis que » met en regard les deux mouvements sans imposer une opposition argumentative trop forte.
translation_notes:
  register: Style solennel mais courant, avec un parallélisme fidèle aux quatre propositions latines. Aucun marqueur de note n’est nécessaire.
