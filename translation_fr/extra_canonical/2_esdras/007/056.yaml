lexical_decisions:
- source_word: æramentum
  choice: bronze
  rationale: Le terme latin désigne un métal ou alliage à base de cuivre ; « bronze » convient à cette série traditionnelle de matériaux et reste naturel en français.
- source_word: fictile
  choice: argile
  rationale: Dans cette énumération de matières, le substantif neutre renvoie à la matière façonnée par le potier ; « argile » restitue clairement le contraste avec les métaux.
- source_word: Multiplicatur ... super
  choice: est plus abondant que
  rationale: La tournure exprime ici une supériorité quantitative, non une action littérale de multiplication.
