  text: whom they will begin to judge in the last times. For those who have kept the ways of the
translation:
  language: fr
  text: qu’ils commenceront à juger dans les derniers temps. En effet, ceux qui ont gardé les voies de…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte latin fourni s’interrompt ici au milieu de la phrase. La forme « iudicari » signifie normalement « être jugé »; la syntaxe de ce fragment est incertaine.
    reason: Signaler à la fois la lacune matérielle et la difficulté textuelle réelle, sans les résoudre silencieusement.
lexical_decisions:
- source_word: quem
  choice: qu’ils
  rationale: Le relatif latin est accusatif singulier, mais son antécédent se trouve dans le contexte précédent, absent de l’extrait. La traduction conserve donc le rattachement syntaxique sans en préciser artificiellement le référent.
- source_word: incipient … iudicari
  choice: commenceront à juger
  rationale: Dans ce contexte, l’infinitif passif latin iudicari paraît textuellement ou syntaxiquement difficile, puisque l’anglais de consultation comprend une valeur active. Le rendu suit cette compréhension tout en signalant la difficulté en note.
- source_word: in nouissimis temporibus
  choice: dans les derniers temps
  rationale: Rendu direct de l’expression temporelle latine, sans préciser davantage sa portée eschatologique.
- source_word: Nam
  choice: En effet
  rationale: Exprime naturellement en français la relation explicative introduite par nam.
- source_word: eorum qui uias seruaue-
  choice: ceux qui ont gardé les voies de…
  rationale: La source s’interrompt au milieu de seruauerunt ou d’une forme apparentée, puis après uias dans le sens continué par le fragment. Les points de suspension rendent visible le caractère incomplet sans compléter le texte par conjecture.
theological_decisions:
- issue: Identité des juges et de la personne jugée
  choice: Ne pas identifier les référents
  alternative: Expliciter qui juge qui à partir du contexte élargi
  rationale: L’extrait latin fourni commence par un relatif dont l’antécédent n’est pas présent; toute identification introduirait une interprétation non établie par cette unité.
- issue: Portée de « derniers temps »
  choice: Conserver la formule générale
  alternative: Employer « à la fin des temps »
  rationale: « Dans les derniers temps » reste proche de in nouissimis temporibus et préserve l’éventuelle distinction entre une dernière période et le terme absolu de l’histoire.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase demeure volontairement fragmentaire pour correspondre à la source transmise; aucune formulation provenant d’une autre forme textuelle n’a été ajoutée.
