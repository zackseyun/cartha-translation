review_pass:
  verdict: revise
  source_fidelity: Le premier membre suit prudemment la lecture active retenue par la piste d’audit anglaise (« qu’ils commenceront à juger »), mais le latin transmis porte iudicari, infinitif normalement passif, après un relatif accusatif singulier et un verbe au pluriel. Cette construction est réellement difficile; la note doit en avertir sans prétendre la résoudre. Le second membre doit s’arrêter après « les voies », car aucun complément tel que « de [le Très-Haut] » ne figure dans le fragment fourni.
  naturalness: « Car ceux qui ont gardé les voies… » est un fragment français naturel dans le cadre d’un texte matériellement interrompu. Il évite le « de… » final du projet, qui suggérait à tort qu’un complément était attesté après uias.
  terminology: « derniers temps » rend directement nouissimis temporibus sans imposer une interprétation eschatologique plus précise. « garder les voies » est un rendu biblique français clair de uias servare.
  issues:
  - severity: medium
    issue: Le texte français se termine par « les voies de… » alors que le latin fourni s’interrompt dans seruaue-, après uias.
    rationale: Le complément introduit par « de » n’est pas présent dans l’extrait. La traduction doit signaler l’interruption sans anticiper le mot ou le groupe suivant.
  - severity: low
    issue: La note décrit la difficulté de iudicari, mais elle peut préciser que la traduction active suit la compréhension adoptée dans la piste anglaise plutôt que la voix normalement indiquée par la forme latine.
    rationale: Cela rend transparent l’écart textuel tout en préservant l’ambiguïté et sans proposer une émendation comme certaine.
  revised_text: qu’ils commenceront à juger dans les derniers temps. Car ceux qui ont gardé les voies…[a]
  revised_footnotes:
  - marker: a
    text: Le texte latin fourni s’interrompt ici au milieu du mot suivant « seruaue- ». Dans le membre précédent, « iudicari » est normalement un infinitif passif (« être jugé »), alors que la construction transmise est syntaxiquement difficile; la traduction active suit la compréhension retenue dans la piste anglaise, sans résoudre cette difficulté.
    reason: Signaler l’interruption matérielle au point exact où elle survient et expliciter avec transparence l’ambiguïté de la construction latine.
  revision_rationale: La révision retire le complément non attesté induit par « voies de… » et conserve le caractère fragmentaire de la source. Elle maintient, avec une note plus explicite, la traduction active déjà adoptée par l’audit anglais pour une syntaxe latine problématique, sans identifier les référents ni compléter le texte lacunaire.
