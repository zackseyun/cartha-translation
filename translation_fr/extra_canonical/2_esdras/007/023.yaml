  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: fr
  text: Ils ont conçu des stratagèmes pour pécher ; ils ont même dit que le Très-Haut n’existait pas et n’ont pas connu ses voies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: proposuerunt sibi
  choice: se sont proposé
  rationale: Reproduit l’idée d’une résolution ou d’un projet volontairement adopté pour soi-même.
- source_word: circumventiones delictorum
  choice: des ruses pour pécher
  rationale: « Circumventiones » évoque des ruses ou manœuvres trompeuses; le génitif « delictorum » indique ici leur orientation vers les fautes, rendue naturellement en français par « pour pécher ».
- source_word: superdixerunt
  choice: ont même déclaré
  rationale: Rend la valeur additive et intensificatrice de « super- » dans un français courant et digne.
- source_word: Altissimum
  choice: le Très-Haut
  rationale: Titre divin traditionnel et transparent correspondant au latin.
- source_word: vias eius
  choice: ses voies
  rationale: Conserve l’image biblique des voies comme conduite, volonté ou manière d’agir de Dieu, sans la réduire à une seule interprétation.
theological_decisions:
- issue: Nature de l’affirmation concernant le Très-Haut
  choice: que le Très-Haut n’existait pas
  alternative: qu’il n’y avait pas de Très-Haut
  rationale: Le latin « Altissimum non esse » peut se construire comme une négation de l’existence du Très-Haut. La formulation retenue est naturelle en français et ne précise pas davantage la portée philosophique ou polémique de l’affirmation.
translation_notes:
  register: Français moderne international, direct et digne. La coordination répétée suit le mouvement accusateur du latin. Aucun marqueur de note n’est requis.
