source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iocundentur. Multum enim melius est illis quam nobis, non enim sperant iudicium,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/066.yaml
  text: For it is much better for them than for us, for they do not expect judgment, nor do they know torments or the salvation promised after death.
translation:
  language: fr
  text: Car leur situation est bien meilleure que la nôtre, puisqu’ils ne s’attendent pas au jugement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Multum enim melius est illis quam nobis
  choice: Car leur sort est bien meilleur que le nôtre
  rationale: La tournure idiomatique « leur sort est… » rend naturellement la construction impersonnelle latine tout en conservant la comparaison et l’intensif « multum ».
- source_word: non enim sperant iudicium
  choice: puisqu’ils ne s’attendent pas au jugement
  rationale: « sperare » peut exprimer ici l’attente plutôt que l’espérance favorable; « s’attendre à » préserve cette nuance dans le contexte du jugement.
theological_decisions:
- issue: Étendue du verset selon la source fournie
  choice: Ne traduire que le texte latin attesté ici, qui s’arrête à « iudicium »
  alternative: Ajouter « ils ne connaissent ni les tourments ni le salut promis après la mort » d’après la couche anglaise
  rationale: La traduction doit partir en priorité du témoignage original fourni. La proposition supplémentaire de l’anglais n’apparaît pas dans l’extrait latin communiqué et ne peut donc être intégrée sans autre preuve textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition latine de « enim » est rendue par « car » puis « puisque » afin d’éviter une lourdeur sans effacer le lien explicatif.
