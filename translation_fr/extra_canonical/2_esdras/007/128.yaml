  text: if he is defeated, he will suffer what you have said; but if he conquers, he will receive what I say.
translation:
  language: fr
  text: S’il est vaincu, il subira ce que tu as dit ; mais s’il remporte la victoire, il recevra ce que je dis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  choice: est vaincu
  rationale: Rend naturellement le parfait passif latin dans cette condition, tout en conservant l’opposition avec la victoire.
- source_word: patiatur
  choice: il subira
  rationale: Exprime ici le fait d’éprouver ou d’endurer la conséquence annoncée ; le futur français convient à la structure conditionnelle.
- source_word: vicerit
  choice: remporte la victoire
  rationale: Formulation française idiomatique qui maintient le contraste lexical avec « est vaincu ».
- source_word: recipiet
  choice: il recevra
  rationale: Équivalent direct qui ne précise pas indûment la nature de ce qui sera reçu.
- source_word: quod dico
  choice: ce que je dis
  rationale: Préserve le présent du latin et son parallélisme avec « ce que tu as dit ».
theological_decisions:
- issue: Nature de ce qui est subi ou reçu
  choice: Ne pas expliciter les référents de « ce que tu as dit » et « ce que je dis »
  alternative: Préciser une peine ou une récompense à partir du contexte
  rationale: Le latin demeure elliptique ; l’ajout d’une interprétation théologique réduirait cette ouverture.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme conditionnel et l’opposition entre défaite et victoire sont conservés sans lourdeur littérale.
