  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris le passif de « torquemur », la nuance concessive de « scientes perimus » et l’opposition rhétorique entre les humains et les animaux. Toutefois, « agrestes bestiae » désigne plus directement les bêtes des champs/de la campagne que les seules « bêtes sauvages »; cette dernière formulation resserre inutilement le sens spatial-rural du latin.
  naturalness: Le français est fluide, soutenu et accessible. « Que ... soit dans le deuil » et « soient dans la joie » sont naturels, mais les verbes simples « pleure » et « se réjouisse » restituent plus directement le parallélisme incisif du texte.
  terminology: « Périssons » préserve opportunément l’ouverture de « perimus ». « Le bétail » est plus idiomatique et plus précis que « les troupeaux » pour « pecora » dans cette coordination avec « quadrupèdes »; la possibilité du sens collectif « troupeaux » peut être signalée en note.
