  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: fr
  text: 'Et c’est pour cela que nous sommes tourmentés : parce que, tout en sachant, nous périssons. Que le genre humain pleure, et que les bêtes des champs se réjouissent ! Que tous ceux qui sont nés se lamentent, mais que les quadrupèdes et le bétail[a] soient dans la joie !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les troupeaux ».'
    reason: Le latin « pecora » peut désigner collectivement les animaux d’élevage, le bétail ou les troupeaux.
lexical_decisions:
- source_word: torquemur
  choice: nous sommes tourmentés
  rationale: Rend directement le passif latin et conserve sa force sans préciser l’agent du tourment.
- source_word: scientes
  choice: tout en sachant
  rationale: 'Préserve la valeur concessive implicite du participe : la connaissance n’empêche pas la perdition.'
- source_word: perimus
  choice: nous périssons
  rationale: Conserve le présent latin et sa portée grave, sans le réduire à la seule mort physique.
- source_word: agrestes bestiae
  choice: les bêtes sauvages
  rationale: Expression française naturelle correspondant aux animaux non domestiques ou vivant dans les champs.
- source_word: quadripedia uero et pecora
  choice: mais que les quadrupèdes et les troupeaux
  rationale: Maintient le contraste marqué par « uero » et distingue la catégorie générale des animaux à quatre pattes du bétail grégaire.
theological_decisions:
- issue: Portée de « scientes perimus »
  choice: « tout en sachant, nous périssons »
  alternative: « parce que nous savons que nous périssons »
  rationale: La construction latine rattache plus naturellement « scientes » au sujet de « perimus » avec une nuance concessive; la traduction évite de faire de la seule connaissance de la mort la cause explicite du tourment.
- issue: Sens de « perimus »
  choice: « nous périssons »
  alternative: « nous mourons »
  rationale: « Périr » laisse ouverte la portée physique, morale ou eschatologique du verbe, conformément à l’ambiguïté du contexte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les exhortations au subjonctif rendent les jussifs latins et l’opposition entre l’humanité endeuillée et les animaux réjouis est conservée.
