  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: fr
  text: 'Depuis combien de temps le Très-Haut fait preuve de patience envers ceux qui habitent ce monde — non pas à cause d’eux, mais à cause des temps qu’il a prévus ! Je répondis : « Si j’ai trouvé grâce'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: longanimitatem habuit
  choice: fait preuve de patience
  rationale: Rend naturellement l’idée d’une patience prolongée sans employer le terme français rare « longanimité ».
- source_word: Altissimus
  choice: le Très-Haut
  rationale: Titre divin traditionnel, clair et directement correspondant au latin.
- source_word: his qui inhabitant saeculum
  choice: ceux qui habitent ce monde
  rationale: Dans ce contexte, « saeculum » désigne le monde ou l’âge où vivent les humains ; « ce monde » est idiomatique en français moderne tout en conservant la portée temporelle implicite.
- source_word: ea quae prouidit tempora
  choice: les temps qu’il a prévus
  rationale: « Prévoir » conserve la formulation du latin sans préciser davantage si ces temps sont seulement connus d’avance ou aussi établis d’avance.
- source_word: si inueni gratiam
  choice: Si j’ai trouvé grâce
  rationale: Conserve l’expression biblique de faveur accordée, ainsi que l’inachèvement de la phrase qui se poursuit au verset suivant.
theological_decisions:
- issue: Motif de la patience du Très-Haut
  choice: « non pas à cause d’eux, mais à cause des temps qu’il a prévus »
  alternative: « non pour eux, mais en raison des temps qu’il a fixés d’avance »
  rationale: La traduction retenue préserve la tension du texte et évite de transformer « prouidit » en décret explicite.
- issue: Sens de « saeculum »
  choice: « ce monde »
  alternative: « l’âge présent »
  rationale: « Ce monde » est plus naturel pour désigner la sphère habitée, tandis que « l’âge présent » accentuerait une interprétation eschatologique que le terme latin n’impose pas à lui seul.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise sémitisante « je répondis et dis » est allégée en « Je répondis ». La citation finale reste volontairement ouverte, puisque la phrase continue dans le verset suivant.
