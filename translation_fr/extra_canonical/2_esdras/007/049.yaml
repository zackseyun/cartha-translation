  rationale: Préserve le passif accompli du latin et son référent personnel général.
- source_word: respondit ad me et dixit
  choice: il me répondit
  rationale: En français courant, « répondre et dire » serait inutilement redondant ; « répondit » introduit naturellement les paroles qui suivent.
- source_word: audi
  choice: Écoute
  rationale: Impératif singulier direct, conforme au latin et au registre solennel du dialogue.
theological_decisions:
- issue: Portée de « presque tous »
  choice: Maintenir « presque tous »
  alternative: « tous » ou « la plupart »
  rationale: Le latin affirme une proportion proche de la totalité sans l’identifier à la totalité ; cette tension doit être conservée.
