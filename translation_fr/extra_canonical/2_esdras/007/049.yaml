lexical_decisions:
- source_word: non paucos
  choice: Non pas quelques-uns
  rationale: Conserve la négation contrastive du latin et l’enchaînement avec « mais », sans ajouter de référent absent du segment.
- source_word: pene omnes
  choice: presque tous
  rationale: Rend directement le degré exprimé par pene, sans transformer l’énoncé en totalité absolue.
- source_word: qui creati sunt
