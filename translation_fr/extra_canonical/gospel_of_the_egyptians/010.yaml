  source_fidelity: 'Révision fondée sur le témoin anglais fourni, le contrôle direct du copte restant indisponible. Les lacunes, restitutions entre crochets et formulations syntaxiquement heurtées du fragment sont conservées. Une correction est requise surtout dans la dernière phrase : « first mold » désigne un « moule », non une « forme modelée », et « reflects its voice » demande l’idée de répercussion plutôt que d’émission de la voix.'
