translation:
  language: fr
  text: 'Cinq mille ans plus tard, la grande lumière Éléleth dit : « Qu’il y ait un chef sur le Chaos et l’Hadès. » Alors apparut une nuée [] [nommée] Sophia hylique[a] […]


    [Elle] contempla les régions [du Chaos]. Son visage ressemblait à […] ; dans sa forme, […] sang. Alors [le grand] ange Gamaliel parla [au grand Gabriel], le serviteur de [la grande lumière] Oroiael. Il [dit : « Qu’un] ange paraisse [pour] régner sur le Chaos [et l’Hadès]. »


    Alors la nuée [obéit et produisit] deux monades[b], chacune [possédant] de la lumière. [… le trône] qu’elle avait dressé dans la nuée [d’en haut].


    Alors Sakla, le grand [ange, vit] le grand démon [qui l’accompagnait, Nébr]uel ; [ensemble], ils devinrent un esprit de la terre qui engendre. [Ils engendrèrent] des anges serviteurs.


    Sakla [dit] au grand [démon] Nébruel : « Que [les] douze éons[c] viennent à l’existence dans [l’…] éon, des mondes […]. »


    […] le grand ange [Sakla] dit, par la volonté de celui qui s’est engendré lui-même[d], [] : « Il y [aura] les […] au nombre de sept […]. » Puis il dit aux [grands anges] : « Allez, et [que chacun] de vous règne sur son [propre monde]. »


    Chacun de [ces] douze [anges] parut :


    [Le premier] ange est Ath[oth]. [C’est lui] que [les grandes] générations humaines appellent […].


    [Le] deuxième est Harmas, [qui] est [Œil-de-feu].


    Le troisième [est Galila].


    [Le] quatrième est Yobel.


    [Le cinquième est] Adonaïos, qui est [appelé] Sabaoth.


    Le sixième [est Caïn, que] les [grandes générations] humaines appellent le soleil.


    [Le septième est Abel].


    Le huitième est Akiressina.


    Le [neuvième est Yubel].


    Le dixième est Harm[oupiael].


    [Le] onzième est Arch[ir-Adonin].


    Le douzième [est Bélias].


    [Ce sont] ceux qui sont établis sur l’Hadès [et le Chaos]. Après la fondation [du monde], Sakla dit à ses [anges] : « Moi, oui moi, je suis un Dieu [jaloux], et en dehors de moi rien n’est [venu à l’existence », parce qu’il] [] s’appuyait sur sa propre substance.


    Alors une voix vint d’en haut et dit : « L’Homme existe, ainsi que le Fils de l’Homme[e]. »


    La première forme modelée[f] fut constituée à cause de la descente de l’image d’en haut, qui fait retentir sa voix en haut — l’image qui s’est penchée au-dehors, par le regard au-dehors de l’image d’en haut. C’est à cause de cela que la Repentance[g] vint à l’existence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Hylique » signifie « relatif à la matière ». L’expression « Sophia hylique » peut se comprendre comme « Sophia matérielle », mais elle fonctionne ici comme un nom ou un titre cosmologique.
    reason: Le terme technique est peu courant en français moderne et son sens doit être rendu accessible sans aplatir le nom.
  - marker: b
    text: Une « monade » est une unité première ou indivisible ; dans ce passage, le terme désigne deux réalités cosmologiques dont la nature exacte demeure incertaine.
    reason: Clarifie un terme philosophique technique tout en préservant l’incertitude du fragment.
  - marker: c
    text: Le mot « éon » peut désigner un âge, un monde ou une puissance cosmique. Le texte endommagé ne permet pas de trancher ici.
    reason: Préserve la polysémie théologiquement significative du terme.
  - marker: d
    text: 'Ou : « l’Auto-engendré ».'
    reason: Signale l’autre rendu possible d’un titre cosmologique sans l’imposer dans le corps du texte.
  - marker: e
    text: 'On pourrait aussi traduire : « l’être humain existe, ainsi que le fils de l’être humain ». Les majuscules retiennent la possibilité qu’il s’agisse de titres ou de figures célestes.'
    reason: L’anglais témoin ne permet pas de résoudre entièrement le statut des expressions.
  - marker: f
    text: 'Ou : « le premier moule ». Le contexte évoque quelque chose qui a reçu une forme d’après l’image d’en haut.'
    reason: Le terme source transmis par le témoin anglais est concret mais sémantiquement ambigu.
  - marker: g
    text: 'Ou : « le Repentir ». La majuscule indique que le passage peut présenter la Repentance comme une réalité personnifiée.'
    reason: Préserve l’ambiguïté entre notion morale et entité cosmologique.
lexical_decisions:
- source_word: hylic Sophia
  choice: Sophia hylique
  rationale: Conserve le nom propre Sophia et rend le terme technique « hylic » par « hylique », c’est-à-dire relatif à la matière, sans réduire la figure à la simple expression « sagesse matérielle ».
- source_word: Hades
  choice: l’Hadès
  rationale: Maintient le nom cosmologique grec plutôt que de l’assimiler à « l’enfer », ce qui importerait une interprétation théologique plus précise que le témoin.
- source_word: monads
  choice: monades
  rationale: Conserve le vocabulaire cosmologique technique et son ambiguïté dans ce contexte fragmentaire.
- source_word: aeons
  choice: éons
  rationale: Emploie le terme français usuel dans les textes gnostiques, où il peut désigner des entités, des domaines ou des âges.
- source_word: self-generated one
  choice: celui qui s’est engendré lui-même
  rationale: Rend littéralement l’idée d’auto-génération sans substituer un titre doctrinal traditionnel.
- source_word: first mold
  choice: première forme modelée
  rationale: Exprime à la fois le résultat du modelage et l’image d’un moule, sans imposer « corps » ou « Adam ».
- source_word: Repentance
  choice: la Repentance
  rationale: La majuscule signale qu’il peut s’agir ici d’une réalité personnifiée ou cosmologique, tout en conservant le sens courant du terme.
theological_decisions:
- issue: La proclamation de Sakla comme Dieu jaloux
  choice: Conserver « Dieu jaloux » et la prétention selon laquelle rien n’existe en dehors de lui
  alternative: Harmoniser cette parole avec une confession monothéiste biblique normative
  rationale: Le passage présente cette affirmation dans la bouche de Sakla et la met en tension avec la voix venue d’en haut ; la traduction ne doit ni approuver ni corriger cette tension.
- issue: « The Man » et « the Son of the Man »
  choice: « l’Homme » et « le Fils de l’Homme » avec majuscules
  alternative: « l’être humain » et « le fils de l’être humain »
  rationale: Les majuscules préservent la portée possiblement transcendante ou titularisée des expressions sans identifier explicitement ces figures.
- issue: Statut de Sophia hylique
  choice: Conserver le nom et le qualificatif technique
  alternative: « la Sagesse matérielle »
  rationale: La translittération partielle évite de faire de l’expression une simple abstraction et respecte son probable statut de figure cosmologique.
- issue: Repentance comme réalité cosmologique
  choice: Employer « la Repentance » avec majuscule
  alternative: « le repentir » en minuscule
  rationale: Le verbe « vint à l’existence » suggère une hypostase possible, mais le texte fragmentaire ne permet pas de la définir davantage.
