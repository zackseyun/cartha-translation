  terminology: 'Les termes techniques et noms cosmologiques sont conservés : Chaos, Hadès, Sophia hylique, monades, éons, Sakla, Oroiael. « Le Repentir » est préféré à « la Repentance » : il est plus naturel en français moderne tout en pouvant rester personnifié par la majuscule. « L’Homme » et « le Fils de l’Homme » conservent leur ambiguïté titularisée.'
