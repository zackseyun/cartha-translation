  - severity: medium
    issue: « fait retentir sa voix » pour « reflects its voice »
    rationale: Le témoin exprime la réflexion ou répercussion de la voix, non son émission. « répercute sa voix » conserve ce rapport.
  - severity: low
    issue: « la Repentance »
    rationale: Le terme est possible mais peu naturel en français international contemporain. « le Repentir », avec majuscule et note, préserve l’éventuelle personnification.
  - severity: low
    issue: Rendu de « gazed out » et de « spirit of the earth »
    rationale: « regarda au-dehors » et « esprit terrestre » sont plus proches du témoin, sans préciser davantage la cosmologie du fragment.
