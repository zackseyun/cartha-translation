translation:
  language: fr
  text: '[] Le livre [sacré] du grand [Esprit] invisible [. . .],


    le Père dont le nom ne peut être prononcé,


    qui a pris naissance] dans les hauteurs de [la Plénitude,


    la] Lumière de Lumière issue des éons de Lumière,


    la Lumière du [Silence] de la Providence


    et le Père du Silence,


    la [Lumière] de la Parole et de la Vérité,


    la Lumière des [] [réalités indestructibles,


    la] Lumière infinie,


    [le] rayonnement issu des éons de la Lumière


    du Père qui ne peut être dévoilé, désigné,


    qui ne vieillit pas et ne peut être déclaré,


    l’éon des éons,[a]


    celui qui est né de lui-même, qui s’engendre lui-même, qui se produit lui-même,


    l’Étranger,


    l’éon,


    VÉRITÉ, ALĒTHŌS.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un «éon» peut désigner un âge, un domaine éternel ou une réalité céleste personnifiée. Le contexte ne permet pas de choisir avec certitude.
    reason: Préserver l’ambiguïté sémantique et cosmologique du terme transmis par le témoin anglais.
  - marker: b
    text: ALĒTHŌS est une forme grecque translittérée, apparentée au vocabulaire de la vérité et pouvant aussi signifier «véritablement». Elle est conservée ici comme dans le témoin.
    reason: Éviter de confondre cette forme finale avec le simple nom «Vérité» qui la précède.
lexical_decisions:
- source_word: Fullness
  choice: Plénitude
  rationale: Terme français naturel et consacré pour désigner la totalité transcendante; la majuscule conserve sa valeur quasi technique dans ce contexte.
- source_word: aeon(s)
  choice: éon(s)
  rationale: Translittération française qui préserve la portée cosmologique ou temporelle du terme sans la réduire à «siècle» ou à «éternité».
- source_word: Providence
  choice: Providence
  rationale: Conserve le caractère personnifié ou hypostatique possible du terme, signalé par la majuscule dans le témoin.
- source_word: Speech
  choice: Parole
  rationale: «Parole» convient au registre religieux et garde ouverte la possibilité d’une réalité personnifiée, là où «discours» serait trop abstrait.
- source_word: indestructibilities
  choice: réalités indestructibles
  rationale: Le substantif abstrait pluriel anglais serait peu naturel sous la forme «indestructibilités»; «réalités» explicite minimalement le référent sans le définir doctrinalement.
- source_word: alien
  choice: l’Étranger
  rationale: Le substantif avec article est conservé comme titre énigmatique; «étranger» maintient l’idée d’altérité sans l’interpréter.
- source_word: ALĒTHŌS
  choice: ALĒTHŌS
  rationale: La forme translittérée est conservée telle quelle, puisqu’elle semble fonctionner comme une acclamation, un terme technique ou une formule distincte.
theological_decisions:
- issue: Rapport entre le Père, la Lumière et les éons
  choice: Conserver la succession appositionnelle et les répétitions de «Lumière» sans harmonisation syntaxique.
  alternative: Réorganiser le passage en phrases explicatives identifiant clairement chaque titre à un seul sujet.
  rationale: Le témoin est fragmentaire et théologiquement dense; une restructuration trancherait des rapports que le texte laisse ambigus.
- issue: Sens de «self-generated, self-generating, self-producing»
  choice: Distinguer «né de lui-même», «s’engendre lui-même» et «se produit lui-même».
  alternative: Fusionner les trois expressions en «autoengendré».
  rationale: La triple formulation paraît intentionnelle et peut exprimer des nuances théologiques; elle doit rester perceptible.
- issue: Statut de «the alien»
  choice: Rendre le terme par le titre «l’Étranger».
  alternative: Employer «celui qui est étranger» ou «l’Autre».
  rationale: Le choix préserve l’étrangeté du titre et l’idée d’altérité radicale, sans préciser envers quoi le sujet est étranger.
- issue: «aeon of the aeons»
  choice: «l’éon des éons»
  alternative: «l’éternité des éternités»
  rationale: La traduction littérale conserve le vocabulaire cosmologique du document et évite de réduire «éon» à une simple durée.
translation_notes:
  register: Français international moderne, solennel et lisible. Les crochets et les points de suspension entre crochets reproduisent les lacunes et restitutions signalées par le témoin public anglais. Comme la vérification directe du copte reste en attente, cette version demeure provisoire et évite les reconstructions qui dépasseraient les données fournies.
