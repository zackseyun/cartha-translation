    you have [cleansed me inside him]

    with your life,

    [in accord with your] indestructible [name].

    [Therefore], with him [is incense of life]

    that has mingled with baptismal [water] of [every] archon,

    [so that I might] live together with you in the [well-being of the holy ones],

    O eternal one [who exists],

    TRUTH TRULY.


    [The great Seth] wrote [this book], and deposited it on [a] high [mountain] where [the sun rises] not, nor [. . .], and [since the days of the] prophets [and . . . and the] apostles, [. . .] come forth [. . . and their] ear [has not heard] it.


    The great Seth wrote [this] [] [book] with letters [. . .]. He deposited [it . . .].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/014.yaml
  text: 'This is the book that the great Seth wrote and deposited high in the mountains, where the sun has not risen, nor is that (even) possible. Since the days of the prophets, apostles, and preachers, its name has not arisen in their hearts in the least, nor is that (even) possible, and their ear has not heard it.


    The great Seth wrote this book with letters in 130 years. He deposited it on the mountain called Charaxio, with the intention that, at the end of the times and eras, in agreement with the desire of the self-generated God and the complete Fullness, and by the gift of the inscrutable, ungraspable, fatherly will, it might come to light and appear for this sacred, indestructible generation of the great Savior and for those who dwell with them in love, and the great, unseen, eternal Spirit and his only-begotten Son, and eternal light, [] also its great, indestructible companion, and indestructible Sophia, and Barbelon, and the complete Fullness, in eternity. Amen.


    Also restore the omitted witness markers in their respective locations: “the mystery] of [mysteries]. [7] They [appeared . . . who oversees . . .] and the aeons, TRUTH TRULY [8] [. . .], and TRUTH TRULY, [eternal] aeons”; “[. . .] AIA[. . .]THAŌTHŌSTH[. . .], [9]”; and “[. . .] TRUTH, [16]”.'
translation:
  language: fr
  text: 'Voici le livre que le grand Seth écrivit et déposa dans les hauteurs des montagnes, là où le soleil ne s’est pas levé — cela n’est même pas possible. Depuis les jours des prophètes, des apôtres et des prédicateurs, son nom ne leur est pas même venu au cœur — cela non plus n’est pas possible — et leur oreille ne l’a pas entendu.


    Le grand Seth écrivit ce livre, lettre après lettre, en cent trente ans.[a] Il le déposa sur la montagne appelée Charaxio, afin qu’à la fin des temps et des ères, conformément au désir du Dieu auto-engendré et de la Plénitude entière, et par le don de la volonté paternelle, insondable et insaisissable, il soit mis en lumière et se manifeste à cette génération sainte et indestructible du grand Sauveur, ainsi qu’à ceux qui demeurent avec elle dans l’amour; au grand Esprit éternel, invisible, et à son Fils unique; à la Lumière éternelle; […] ainsi qu’à sa grande compagne indestructible, à Sophia l’indestructible, à Barbelon et à la Plénitude entière, pour l’éternité. Amen.


    L’Évangile des Égyptiens, le livre secret et saint, écrit par Dieu.


    Grâce, intelligence, perception et discernement à celui qui l’a copié, Eugnostos, le bien-aimé dans l’Esprit — Gongessos est mon nom dans la chair — ainsi qu’aux lumières qui m’accompagnent dans l’indestructibilité.


    Jésus Christ, Fils de Dieu, Sauveur, ICHTHYS.[b]


    Écrit par Dieu, le livre saint du grand Esprit invisible. Amen.


    Le Livre saint du grand

    Esprit invisible.

    Amen.


    [a] Ou : « écrivit ce livre en lettres pendant cent trente ans ». La formulation transmise est incertaine.

    [b] ICHTHYS est le mot grec signifiant « poisson »; il peut aussi servir d’acrostiche pour « Jésus Christ, Fils de Dieu, Sauveur ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « écrivit ce livre en lettres pendant cent trente ans ». La formulation transmise est incertaine.'
    reason: La tournure du témoin anglais est obscure et la révision directe du copte reste à effectuer.
  - marker: b
    text: ICHTHYS est le mot grec signifiant « poisson »; il peut aussi servir d’acrostiche pour « Jésus Christ, Fils de Dieu, Sauveur ».
    reason: Explique le jeu grec conservé dans le colophon sans le remplacer dans le texte.
lexical_decisions:
- source_word: Fullness
  choice: Plénitude
  rationale: Terme technique correspondant au plérôme; « Plénitude » reste intelligible tout en préservant la portée cosmologique du texte.
- source_word: self-generated God
  choice: Dieu auto-engendré
  rationale: Préserve l’idée d’une origine à partir de soi sans la confondre avec « incréé » ni imposer une interprétation doctrinale.
- source_word: indestructible
  choice: indestructible
  rationale: Rend directement le qualificatif récurrent et conserve sa fonction théologique distinctive.
- source_word: Sophia
  choice: Sophia
  rationale: Le nom propre technique est conservé plutôt que traduit par « Sagesse », afin de ne pas effacer son caractère hypostatique possible.
- source_word: Barbelon
  choice: Barbelon
  rationale: Translittération du nom telle qu’elle apparaît dans le témoin fourni; aucune harmonisation avec « Barbelo » n’est imposée.
- source_word: with letters in 130 years
  choice: lettre après lettre, en cent trente ans
  rationale: Rendu lisible mais explicitement signalé comme incertain en note, car la relation entre les lettres et la durée demeure obscure.
- source_word: God-written
  choice: écrit par Dieu
  rationale: Restitue le sens fort de l’épithète sans recourir au rare et moins transparent « théographe ».
theological_decisions:
- issue: Destinataires ou série de réalités associées après « ceux qui demeurent avec elle dans l’amour »
  choice: Conserver la série avec une ponctuation ouverte (« au grand Esprit…; à la Lumière… »)
  alternative: Faire de tous les éléments une seule description de la génération ou rattacher « dans l’amour » à l’Esprit
  rationale: La syntaxe transmise est tendue et ambiguë; la traduction évite de résoudre artificiellement les rapports entre la génération, l’Esprit, le Fils, la Lumière et les figures suivantes.
- issue: « only-begotten Son »
  choice: Fils unique
  alternative: Fils seul-engendré / Fils unique-engendré
  rationale: « Fils unique » est naturel en français et n’ajoute pas de formulation confessionnelle; le rapport d’engendrement demeure présent dans le contexte.
- issue: Nature de « God-written »
  choice: écrit par Dieu
  alternative: inspiré par Dieu
  rationale: Le texte affirme littéralement une écriture divine; « inspiré » affaiblirait et interpréterait cette affirmation.
- issue: ICHTHYS
  choice: Conserver ICHTHYS et expliquer l’acrostiche en note
  alternative: Traduire seulement par « poisson » ou développer l’acrostiche dans le corps du texte
  rationale: La forme grecque appartient au colophon et porte simultanément une valeur lexicale et christologique.
translation_notes:
  register: Français international moderne, digne et lisible. Les signaux de lacune du témoin sont conservés sous la forme […]. Cette proposition est provisoire, car le dossier indique qu’une vérification directe du copte des codices de Nag Hammadi III,2 et IV,2 reste nécessaire. La traduction vise ici la conclusion et son colophon; les numéros de témoins [7], [8], [9] et [16] mentionnés dans la couche anglaise appartiennent à des passages antérieurs et ne sont donc pas introduits artificiellement dans cette unité.
