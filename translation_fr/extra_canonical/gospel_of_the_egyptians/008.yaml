translation:
  language: fr
  text: 'Alors tout fut ébranlé, et un tremblement saisit les êtres impérissables. Puis les trois enfants mâles descendirent d’en haut vers les êtres non engendrés et autoengendrés, ainsi que vers ceux qui avaient été engendrés dans ce qui est engendré. La Grandeur se manifesta, toute la Grandeur du grand Christ.


    Il dressa d’innombrables myriades de trônes glorieux au sein des quatre éons qui les entouraient, d’innombrables myriades de puissances, de gloires [a] et d’êtres impérissables. Ils s’avancèrent de cette manière, et l’Église spirituelle et impérissable grandit au sein des quatre lumières du grand Autoengendré vivant, le Dieu de vérité. D’une seule voix, dans un accord parfait et d’une bouche qui ne cessait jamais, elle louait, chantait et exaltait :


    le Père,


    la Mère,


    le Fils,


    et toute leur Plénitude, comme je l’ai mentionné précédemment.[b]


    Les cinq sceaux qui possèdent les myriades,


    les archontes qui dominent les éons,


    et les porteurs de la gloire des chefs


    reçurent l’ordre de se manifester à ceux qui en étaient dignes.


    Amen.'
