review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le relatif anglais « who praised, sang, (and) extolled » suit immédiatement « the God of truth » et le présente comme son antécédent grammatical. Le projet français attribue explicitement ces verbes à l’Église (« elle »), ce qui tranche autrement la syntaxe du témoin et en modifie le sens. La version révisée maintient l’antécédent textuellement indiqué sans expliquer la tension avec les expressions collectives « d’une seule voix » et « dans un accord unanime ». Les termes techniques (éons, archontes, Plénitude, Autoengendré) et le marqueur de lacune sont globalement fidèles au témoin anglais provisoire.'
  naturalness: Le français est globalement naturel dans un registre cosmologique soutenu. « D’une seule voix, dans un accord unanime et d’une bouche ininterrompue » rend plus près la construction accumulative du témoin tout en restant lisible. « S’avança » rend plus directement « proceeded forth » que « se manifesta ».
  terminology: « Êtres impérissables », « autoengendrés / Autoengendré », « Grandeur », « éons », « Église », « Plénitude » et « archontes » conviennent. La majuscule à « Autoengendré » et à « Plénitude » conserve le traitement de titres ou réalités cosmologiques sans imposer d’interprétation doctrinale.
  issues:
  - severity: high
    issue: Le sujet des verbes « louait, chantait et exaltait » est changé.
    rationale: Le projet impose « l’Église » comme sujet par « elle », alors que le relatif du témoin anglais a pour antécédent grammatical immédiat « the God of truth ». Il convient de traduire ce relatif sans déplacer son antécédent.
  - severity: low
    issue: « La Grandeur se manifesta » interprète « proceeded forth ».
    rationale: « S’avança » ou « sortit » est plus proche du mouvement exprimé par le témoin et évite d’ajouter l’idée spécifique de manifestation.
  - severity: low
    issue: « Les archontes qui dominent les éons » explicite la relation « over the aeons ».
    rationale: « Archontes préposés aux éons » conserve la relation hiérarchique sans ajouter une nuance verbale de domination.
  revised_text: 'Alors tout fut ébranlé, et le tremblement saisit les êtres impérissables. Puis les trois enfants mâles descendirent d’en haut vers les êtres non engendrés et autoengendrés, ainsi que vers ceux qui avaient été engendrés dans ce qui est engendré. La Grandeur s’avança, toute la Grandeur du grand Christ.


    Il dressa d’innombrables myriades de trônes glorieux au sein des quatre éons qui les entouraient, d’innombrables myriades de puissances, de gloires [a] et d’êtres impérissables. Ils s’avancèrent ainsi, et l’Église spirituelle et impérissable grandit au sein des quatre lumières du grand Autoengendré vivant, le Dieu de vérité, qui louait, chantait et exaltait d’une seule voix, dans un accord unanime et d’une bouche ininterrompue :


    le Père,


    la Mère,


