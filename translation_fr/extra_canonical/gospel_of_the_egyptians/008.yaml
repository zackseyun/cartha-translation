lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: êtres impérissables
  rationale: « Impérissable » convient au registre cosmologique et évite la coloration matérielle de « indestructible »; dans la seconde occurrence nominale, le contexte semble désigner des entités plutôt qu’une qualité abstraite.
- source_word: self-begotten / self-generated one
  choice: autoengendrés / Autoengendré
  rationale: Maintient le vocabulaire technique de l’engendrement et la distinction entre les êtres au pluriel et la figure cosmologique au singulier.
- source_word: Greatness
  choice: la Grandeur
  rationale: Conserve comme titre personnifié ce terme abstrait, avec majuscule.
- source_word: aeons
  choice: éons
  rationale: Terme français établi pour les réalités cosmologiques désignées dans les textes gnostiques; « siècles » serait trompeur ici.
- source_word: church
  choice: Église
  rationale: Rend le sens communautaire et cultuel du terme tout en gardant sa personnification apparente dans la phrase suivante.
- source_word: Fullness
  choice: Plénitude
  rationale: Préserve le terme cosmologique et théologique technique, sans le réduire à « totalité ».
- source_word: archons
  choice: archontes
  rationale: Translittération française usuelle qui conserve la fonction de puissances dirigeantes dans ce contexte.
- source_word: the deserving
  choice: ceux qui en étaient dignes
  rationale: Expression naturelle en français qui conserve le critère de dignité sans préciser qui le détermine.
theological_decisions:
- issue: Genre du sujet qui loue après « le Dieu de vérité »
  choice: Rapporter les verbes à « l’Église spirituelle et impérissable » par le pronom « elle »
  alternative: Les rapporter à « le Dieu de vérité » par « il »
  rationale: Le témoin anglais emploie « who », dont l’antécédent est grammaticalement ambigu. Le contenu communautaire (« d’une seule voix », « accord parfait ») favorise l’Église, mais l’ambiguïté de la chaîne syntaxique doit être signalée.
- issue: Rapport entre le Père, la Mère et le Fils
  choice: Conserver l’énumération sans explication doctrinale
  alternative: Employer une formulation trinitaire interprétative
  rationale: Le texte nomme ces figures et « leur Plénitude » sans définir leurs relations; il ne faut pas importer un cadre doctrinal extérieur.
- issue: Nature des « cinq sceaux »
  choice: Conserver l’expression littéralement
  alternative: Identifier les sceaux à des rites ou à des êtres précis
  rationale: Le passage ne fournit pas assez d’éléments pour résoudre leur statut rituel, symbolique ou hypostatique.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des termes cosmologiques techniques nécessaires. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni; une vérification directe du copte des codices de Nag Hammadi III,2 et IV,2 reste nécessaire. La syntaxe a été légèrement clarifiée sans harmoniser les tensions propres au texte.
