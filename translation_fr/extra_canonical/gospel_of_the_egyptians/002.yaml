translation:
  language: fr
  text: 'Trois puissances procédèrent de lui : le Père, la Mère et le Fils, issus du Silence vivant, lequel procéda du Père indestructible. Ceux-ci procédèrent [du] Silence du Père inconnu ; [et] de ce lieu [pro]céda Domedon Doxomedon, [l’éon des] éons, ainsi que la [Lumière] de leurs puissances respectives. Et de cette manière, le Fils [pro]céda en quatrième, la Mère [en cinquième et le Père] en sixième.


    Il demeurait [inaperçu], sans pourtant avoir été annoncé. [C’est lui] qui n’est désigné par aucun signe au milieu de toutes [les puissances], les gloires et les [indestructibilités].


    De ce lieu [pro]cédèrent les trois puissances, […] les trois Ogdoades [que le Père pro]duit dans le Silence, avec la Providence, depuis son sein : le Père, la Mère et le Fils.


    La <première> Ogdoade, à cause de laquelle procéda l’enfant trois fois mâle, est :


    la Pensée,


    le Logos[a],


    l’Indestructibilité,


    la Vie [éternelle],


    la Volonté,


    l’Intellect,


    la Prescience,


    le Père androgyne.


    La deuxième puissance-Ogdoade :


    la Mère,


    la vierge Barbelon,


    Epititioch[… ]ai,


    Memeneaimen, [qui] veille sur le ciel,


    Karb[…],


    la puissance qui dépasse toute interprétation,


    la Mère indicible.


    [Elle est] issue d’elle-[même…]. Elle procéda. [Elle] s’accorda avec le Père [du] Silence silencieux.


    La troisième puissance-[Ogdoade] :


    le Fils du [Silence silencieux],


    la couronne du Silence silencieux,


    [la] gloire du Père,


    et la vertu [de la] […] [Mère].


    [Il] produit, depuis son sein, les sept puissances de la grande Lumière, qui sont les sept voix ; leur accomplissement est la parole.


    Telles sont les trois [puissances], les trois Ogdoades que le Père [pro]duisit depuis son sein [au moyen de] sa Providence. Il les produisit en ce lieu.


    [a] Ou « la Parole » ; le terme grec Logos peut désigner la parole, le discours ou la raison.'
