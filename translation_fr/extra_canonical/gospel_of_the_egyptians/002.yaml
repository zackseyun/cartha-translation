lexical_decisions:
- source_word: powers
  choice: puissances
  rationale: « Puissances » conserve le caractère hypostatique et cosmologique du terme, là où « pouvoirs » serait plus abstrait ou fonctionnel.
- source_word: proceeded
  choice: procéda / procédèrent
  rationale: Le verbe « procéder » maintient la répétition technique du témoin et évite de préciser indûment s’il s’agit d’une naissance, d’une création ou d’une émanation.
- source_word: Silence
  choice: Silence
  rationale: La majuscule indique qu’il s’agit ici d’une réalité personnifiée ou hypostatique.
- source_word: aeon
  choice: éon
  rationale: Terme technique courant en français pour une entité ou une durée cosmologique dans ces textes.
- source_word: Ogdoad
  choice: Ogdoade
  rationale: Transcription française traditionnelle désignant un ensemble de huit réalités.
- source_word: Logos
  choice: Logos
  rationale: Le terme est conservé afin de ne pas trancher entre « Parole », « discours » et « raison » ; une note signale ces possibilités.
- source_word: Mind
  choice: Intellect
  rationale: « Intellect » convient mieux que « esprit » dans une liste d’entités noétiques et évite la confusion avec l’Esprit comme figure distincte.
- source_word: Precognition
  choice: Prescience
  rationale: « Prescience » rend naturellement la connaissance préalable dans un registre religieux et philosophique.
- source_word: lap
  choice: sein
  rationale: « Sein » exprime une origine intérieure ou génératrice sans imposer l’image anatomique plus étroite de « giron ».
- source_word: speech
  choice: parole
  rationale: Dans le rapport entre les sept voix et leur accomplissement, « parole » est plus naturel en français que « discours », tout en restant distinct du Logos conservé comme terme technique.
theological_decisions:
- issue: Nature de la procession des puissances
  choice: Répéter « procéder » sans explicitation
  alternative: Employer « émaner », « naître » ou « être créé »
  rationale: Le témoin ne définit pas précisément le mode d’origine ; la traduction préserve cette indétermination théologique.
- issue: Genre et statut des figures Père, Mère et Fils
  choice: Conserver les titres et leurs majuscules
  alternative: Les réduire à des noms communs descriptifs
  rationale: La syntaxe les présente comme des figures ou puissances distinctes, sans permettre de fixer davantage leur statut ontologique.
- issue: « androgynous Father »
  choice: « le Père androgyne »
  alternative: « le Père mâle et femelle »
  rationale: « Androgyne » rend directement la tension du texte sans l’expliquer ni la normaliser.
- issue: « virtue » de la Mère
  choice: « vertu »
  alternative: « puissance » ou « excellence »
  rationale: Le passage est lacunaire et le sens exact demeure incertain ; « vertu » garde la polysémie du témoin au lieu d’assimiler ce terme aux « puissances » déjà mentionnées.
- issue: Logos
  choice: Conserver « Logos » avec une note
  alternative: Traduire directement par « Parole »
  rationale: Le terme peut évoquer parole, discours ou raison. Le conserver évite de privilégier une lecture théologique particulière.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du vocabulaire technique nécessaire. Les crochets, points de suspension et chevrons signalant lacunes ou restitutions sont conservés ; les numéros de pages manuscrites qui interrompaient les phrases sont omis. La rédaction reste provisoire, car la révision directe du copte est annoncée comme en attente.
