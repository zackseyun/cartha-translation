lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: ALĒTHŌS / ALĒTHES
  rationale: Les deux formes sont conservées telles qu’elles apparaissent dans le témoin, sans les normaliser ni les traduire, puisqu’elles font partie de la diction rituelle.
- source_word: aeons
  choice: éons
  rationale: Terme historique et cosmologique précis, plus adéquat que « siècles » dans ce contexte.
- source_word: self-generated
  choice: auto-engendré
  rationale: Rend directement l’idée d’une origine en soi sans lui substituer une formulation doctrinale plus familière.
- source_word: archons
  choice: archontes
  rationale: Conserve le terme technique désignant les puissances dirigeantes de cette cosmologie.
- source_word: Light / light
  choice: Lumière / lumière
  rationale: La majuscule est maintenue lorsqu’il s’agit de l’état ou de l’identité proclamée par le locuteur, tandis que le nom commun reste en minuscule ailleurs.
- source_word: Place
  choice: Lieu
  rationale: La majuscule du témoin est conservée afin de ne pas réduire un possible terme cosmologique à un simple emplacement.
- source_word: grasp
  choice: saisir
  rationale: Le même verbe français permet de préserver la tension entre compréhension et appréhension spirituelle.
theological_decisions:
- issue: Union avec « l’Immuable »
  choice: je me suis maintenant uni à l’Immuable
  alternative: je me suis maintenant fondu dans l’Immuable
  rationale: « Uni » exprime la jonction proclamée sans imposer l’idée plus forte d’une disparition complète de l’identité personnelle.
- issue: Désignation de « l’Homme »
  choice: l’Homme
  alternative: l’être humain
  rationale: La majuscule préserve la possibilité d’une figure cosmologique ou primordiale, sans décider qu’il s’agit simplement de l’humanité générique.
- issue: « Dieu du Silence »
  choice: Dieu du Silence
  alternative: dieu du silence
  rationale: Les majuscules reproduisent la valeur titulaire de l’invocation sans identifier cette figure à une construction confessionnelle ultérieure.
- issue: « les saints »
  choice: les saints
  alternative: les êtres saints
  rationale: La formulation reste proche du témoin et laisse ouverte l’identité exacte du groupe visé.
translation_notes:
  register: 'Français international moderne, solennel et hymnique, avec répétitions et invocations préservées. Les suites vocaliques, les noms rituels, les accolades de « AAAA{A} » et l’alternance ALĒTHES/ALĒTHŌS sont reproduits sans normalisation. Le numéro de page manuscrit [15] n’est pas intégré au texte. Cette version demeure provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte étant encore en attente. Les formulations syntaxiquement obscures du témoin, notamment celles concernant la Mère, le sein et l’Homme, ont été conservées autant que le permet un français intelligible plutôt que résolues par conjecture.'
