translation:
  language: fr
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,


    ALĒTHŌS ALĒTHŌS,


    ô Yesseus Mazareus Yessedekeus,


    ô eau vive,


    ô enfant de l’enfant,


    ô nom glorieux,


    ALĒTHŌS ALĒTHŌS,


    l’Être éternel,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A},


    ALĒTHES ALĒTHŌS


    ĒI AAAA ŌŌŌŌ,


    ô Être qui contemple les éons,


    ALĒTHES ALĒTHŌS,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    toi qui es éternellement éternel,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ au-dedans du cœur, toi qui existes,


    UAEI EISAEI EIOEI EIOSEI !


    Ce grand nom qui est le tien demeure en moi,


    ô Parfait auto-engendré.


    Toi qui n’es pas hors de moi,


    je te contemple,


    ô toi que nul ne voit,


    car qui peut te saisir dans une autre langue ?


    [a] Puisque je t’ai connu,


    je me suis maintenant uni à l’Immuable.


    Je me suis revêtu de l’armure de lumière.


    Je suis devenu Lumière,


    car la Mère était dans le Lieu pour l’excellente beauté de la grâce.


    J’ai donc déployé mes mains, qui étaient jointes.


    J’ai été façonné au-dedans du cercle de la richesse de lumière,


    dans mon sein,


    qui produit la forme des nombreux êtres engendrés de la lumière,


    là où aucune accusation ne parvient.


    ALĒTHŌS,


    je proclamerai ta gloire,


    car je t’ai saisi,


    SOU IĒS IDE AEIŌ AEIE OIS,


    ô Éon, Éon, ô Dieu du Silence !


    Je t’honore pleinement.


    Tu es mon lieu de repos, ô Fils,


    ĒS ĒS O E,


    toi qui es sans forme parmi les êtres sans forme,


    relevant l’Homme en qui tu me purifieras


    pour que j’entre dans ta vie,


    conformément à ton nom indestructible.


    Ainsi, l’encens de vie demeure en moi.


    Je l’ai mêlé à l’eau selon le modèle de tous les archontes,


    afin de vivre avec toi dans le bien-être des saints,


    toi qui existes pour toujours. [b]


    ALĒTHŌS ALĒTHŌS.'
