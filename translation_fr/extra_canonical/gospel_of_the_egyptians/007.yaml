translation:
  language: fr
  text: 'Leurs compagnons parurent pour compléter l’Ogdoade du Dieu autoengendré :


    la Grâce, compagne de la première lumière, Harmozel ;

    la Perception, compagne de la deuxième lumière, Oroiael ;

    l’Intelligence, compagne de la troisième lumière, Davithé ;

    le Discernement, compagnon de la quatrième lumière, Éléleth.


    Telle est la première Ogdoade du Dieu autoengendré, et le Père donna son approbation d’un signe de tête. Toute la Plénitude des Lumières s’en réjouit.


    Les ministres parurent :


    le premier, le grand Gamaliel, ministre de la première grande lumière, Harmozel ;

    puis le grand Gabriel, ministre de la deuxième grande lumière, Oroiael ;

    puis le grand Samlo[a], ministre de la grande lumière Davithé ;

    puis le grand Abrasax, ministre de [la grande lumière] Éléleth[b].


    Les compagnons parurent alors selon la volonté bienveillante du Père :


    la Mémoire, compagne du grand Gamaliel, le premier ;

    l’Amour, compagnon du grand Gabriel, le deuxième ;

    la Paix, compagne du grand Samblo[a], le troisième ;

    la Vie éternelle, compagne du grand Abrasax, le quatrième.


    Ainsi furent achevées les cinq Ogdoades, soit quarante en tout, comme une puissance qui dépasse toute interprétation.


    Alors le grand Logos autoengendré et la Parole de la Plénitude des quatre lumières adressèrent leur louange :


    au grand Esprit virginal, invisible et sans nom,

    à la vierge mâle,

    au grand éon Doxomédon,

    aux trônes qui sont en eux,

    aux puissances qui les entourent,

    aux gloires, aux autorités et aux puissances,

    <à> l’enfant trois fois mâle,

    à la vierge mâle Youel,

    à Éséphech, gardien de la splendeur, [l’enfant] de l’enfant[b],

    à la couronne de [sa] gloire,

    à la Plénitude tout entière,

    à toutes les gloires qui y demeurent,

    aux Plénitudes infinies

    et aux éons sans nom,


    afin qu’ils donnent au Père, le quatrième, un nom parmi la race indestructible, et qu’ils appellent la descendance du Père « la descendance du grand Seth ».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom apparaît sous les formes « Samlo » puis « Samblo » dans le témoin fourni; cette variation a été conservée.
    reason: Préserver une divergence textuelle ou onomastique réelle sans l’harmoniser silencieusement.
  - marker: b
    text: Les crochets signalent des mots restitués ou un passage endommagé dans le témoin manuscrit.
    reason: Rendre visibles les incertitudes matérielles transmises par le témoin.
  - marker: c
    text: 'La construction de cette phrase est incertaine : elle peut aussi se comprendre ainsi : « afin qu’ils nomment le Père, le quatrième, avec la race indestructible ».'
    reason: Préserver l’ambiguïté syntaxique et théologique du texte transmis.
lexical_decisions:
- source_word: Ogdoad
  choice: Ogdoade
  rationale: Terme technique conservé pour désigner un ensemble de huit entités; une périphrase affaiblirait la structure cosmologique du passage.
- source_word: self-generated
  choice: autoengendré
  rationale: Rend la notion d’un être issu de lui-même sans introduire le terme théologique plus spécialisé « autogène ».
- source_word: Fullness
  choice: Plénitude
  rationale: Majuscule conservée lorsqu’il s’agit de la réalité cosmologique collective, équivalent usuel du concept de plérôme.
- source_word: Logos / Speech
  choice: Logos / Parole
  rationale: La distinction formelle entre les deux désignations est maintenue; « Logos » reste un titre technique tandis que « Parole » traduit le second terme du témoin.
- source_word: proceeded
  choice: parurent
  rationale: Choix prudent évoquant l’entrée en manifestation ou l’émanation, sans imposer une mécanique cosmologique absente du témoin fourni.
- source_word: companions
  choice: compagnons / compagnes
  rationale: Accord français selon le genre grammatical des noms abstraits, tout en gardant la relation exprimée par le témoin.
- source_word: aeon
  choice: éon
  rationale: Translittération française consacrée pour une entité ou réalité cosmologique de ce type.
- source_word: seed
  choice: descendance
  rationale: Dans l’expression collective liée à une race, « descendance » est plus naturel que « semence » tout en préservant le rapport généalogique.
theological_decisions:
- issue: Désignation paradoxale « male virgin »
  choice: vierge mâle
  alternative: vierge masculine
  rationale: La formulation littérale et paradoxale est préservée au lieu d’être harmonisée ou expliquée théologiquement.
- issue: Relation entre le Père, « le quatrième » et la race indestructible
  choice: afin qu’ils donnent au Père, le quatrième, un nom parmi la race indestructible
  alternative: afin qu’ils nomment le Père, le quatrième, avec la race indestructible
  rationale: Le témoin anglais permet plusieurs rattachements syntaxiques. Le texte principal adopte une lecture française intelligible, tandis qu’une note signale l’ambiguïté.
- issue: « power beyond interpretation »
  choice: une puissance qui dépasse toute interprétation
  alternative: une puissance inexprimable
  rationale: La formulation maintient explicitement la limite interprétative plutôt que de la transformer en simple ineffabilité.
- issue: « triple-male child »
  choice: l’enfant trois fois mâle
  alternative: l’enfant triple-mâle
  rationale: La première solution reste compréhensible en français tout en conservant l’étrangeté du titre cosmologique.
- issue: Approbation du Père
  choice: donna son approbation d’un signe de tête
  alternative: acquiesça
  rationale: Le geste concret du témoin est conservé, sans lui attribuer une formule doctrinale supplémentaire.
translation_notes:
  register: 'Français international moderne, digne et lisible, avec conservation des termes cosmologiques techniques et des formulations volontairement paradoxales. Les numéros de pages manuscrites [11] et [12] ont été omis, car ils ne font pas partie de la syntaxe. Le brouillon reste provisoire : il repose sur le témoin anglais public fourni, la révision directe du copte étant indiquée comme encore en attente.'
