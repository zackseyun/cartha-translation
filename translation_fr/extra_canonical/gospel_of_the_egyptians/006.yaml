translation:
  language: fr
  text: 'Le grand Logos, le Dieu auto-engendré, et l’Homme impérissable, Adamas, offrirent une louange. Ils demandèrent pour l’Auto-engendré une puissance et une force éternelle, en vue de l’accomplissement des quatre éons, afin que, par leur moyen, apparaissent [a] […] la gloire et la puissance du Père invisible des hommes sacrés de la grande Lumière, qui entreront dans le monde, l’image de la nuit.


    L’Homme impérissable, Adamas, leur demanda qu’un fils vienne de lui, afin qu’il devienne le père de la race impérissable et immuable ; afin que, par son moyen, le Silence et la Voix apparaissent, et que, par son moyen, l’éon mort se relève pour se dissoudre. Alors, d’en haut, émana la puissance de la grande Lumière : la Manifestation. Elle donna naissance aux quatre grandes lumières :


    Harmozel,


    Oroïael,


    Davithé,


    Éléleth,


    ainsi qu’au grand Seth impérissable, fils de l’Homme impérissable, Adamas. Ainsi fut achevée l’Hebdomade parfaite, qui existe dans des mystères cachés. [b] Lorsqu’elle [obtient] la [gloire], elle devient onze Ogdoades[c], et le Père marqua son approbation d’un signe de tête. Toute la Plénitude des lumières se réjouit.'
  philosophy: optimal-equivalence
