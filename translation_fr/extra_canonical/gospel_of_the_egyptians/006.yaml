    reason: Rendre visibles l’incertitude syntaxique, la difficulté du nombre et le statut reconstruit des mots entre crochets.
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Maintien du terme technique grec, conformément au témoin, afin de ne pas réduire son champ à « Parole » ou « Verbe » sans révision copte directe.
- source_word: self-generated
  choice: auto-engendré / Auto-engendré
  rationale: Rend l’idée d’une origine issue de soi ; la majuscule signale l’emploi substantivé dans la seconde occurrence.
- source_word: indestructible
  choice: impérissable
  rationale: Terme français naturel et digne, applicable ici à l’Homme, à la race et à Seth, sans connotation principalement matérielle.
- source_word: aeon
  choice: éon
  rationale: Conserve le terme cosmologique technique et son ambiguïté plutôt que de l’interpréter comme « âge » ou « monde ».
- source_word: unmoving
  choice: immuable
  rationale: Exprime la stabilité ontologique de la race dans un français naturel, sans choisir le plus matériel « immobile ».
- source_word: Manifestation
  choice: Manifestation
  rationale: Maintient la personnification féminine et la désignation abstraite du témoin.
- source_word: Hebdomad
  choice: Hebdomade
  rationale: Conserve le terme technique désignant un ensemble de sept, sans expansion interprétative.
- source_word: Ogdoads
  choice: Ogdoades
  rationale: Conserve le terme technique désignant des ensembles de huit ; le pluriel est maintenu malgré l’énoncé numériquement difficile.
- source_word: Fullness
  choice: Plénitude
  rationale: Rend le terme cosmologique comme désignation technique, avec majuscule, sans l’identifier explicitement au Plérôme.
- source_word: proceeded from above
  choice: d’en haut, émana
  rationale: « Émana » rend le mouvement de provenance cosmologique tout en évitant une formulation française lourde.
theological_decisions:
- issue: Relation entre le Père invisible et les hommes sacrés
  choice: « le Père invisible des hommes sacrés de la grande Lumière »
  alternative: « le Père invisible, [Père] des hommes sacrés de la grande Lumière »
  rationale: La construction génitive du témoin est conservée sans préciser davantage la nature de cette relation.
- issue: Référent de « l’image de la nuit »
  choice: Maintien à la fin de la proposition sans explicitation
  alternative: Rattacher explicitement l’expression au monde ou aux hommes qui y entrent
  rationale: Le témoin laisse le rattachement syntaxique et théologique incertain ; la traduction ne le résout pas silencieusement.
- issue: Moyen de l’apparition du Silence et de la Voix
  choice: « par son moyen » avec pour référent le fils
  alternative: « par le moyen de la race »
  rationale: Le pronom du témoin peut être difficile à rattacher ; la proximité syntaxique favorise le fils, mais la formulation française garde une certaine souplesse contextuelle.
- issue: Relèvement et dissolution de l’éon mort
  choice: « se relève pour se dissoudre »
  alternative: « se soulève afin de se défaire »
  rationale: Préserve la tension paradoxale du relèvement conduisant à la dissolution, sans l’harmoniser théologiquement.
- issue: Composition de l’Hebdomade parfaite
  choice: Conserver l’enchaînement des quatre lumières, de Seth et de l’achèvement de l’Hebdomade
  alternative: Expliquer ou recomposer explicitement le compte de sept
  rationale: Le passage fourni ne rend pas transparent le calcul ; aucune entité implicite n’est ajoutée.
- issue: Transformation en onze Ogdoades
  choice: « elle devient onze Ogdoades »
  alternative: Corriger ou expliquer le nombre et le référent
  rationale: La formulation difficile est conservée, faute de révision directe des témoins coptes et sans imposer une reconstruction doctrinale.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Les noms propres sont légèrement francisés par des accents destinés à guider la lecture. Les principaux termes cosmologiques techniques — Logos, éon, Hebdomade, Ogdoades et Plénitude — sont conservés. Cette version demeure provisoire : elle repose sur le témoin anglais public fourni, la révision directe du copte étant encore en attente.'
