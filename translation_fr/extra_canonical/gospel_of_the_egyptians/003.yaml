  source_fidelity: Révision effectuée d’après le témoin anglais fourni, la vérification directe du copte restant signalée comme en attente. La version corrige l’ajout interprétatif « êtres » pour le substantif technique pluriel « indestructibilities », restitue les noms sans francisation non attestée et préserve plus exactement la lacune vide [] devant « nom ».
  naturalness: Le français demeure lisible et solennel tout en conservant la syntaxe volontairement heurtée, les répétitions et les formules cosmologiques du témoin fragmentaire. « Impérissabilités » est inhabituel, mais préférable ici à une paraphrase qui transformerait ces réalités en êtres.
  terminology: « Éon », « Silence », « Lumière », « le Tout », « vierge mâle » et « trois-fois-mâle » conservent le registre technique et les ambiguïtés du témoin. Les noms propres sont maintenus sous la forme Domedon Doxomedon du témoin d’audit.
