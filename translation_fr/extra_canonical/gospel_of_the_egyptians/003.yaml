source:
  text: 'Domedon Doxomedon came in procession, [ 5 ] the aeon of the aeons, and the throne inside him, and the powers [surrounding] him, the glories, and the [indestructibilities. The] Father of the great Light [who pro]ceeded from Silence, he is [the great] Doxomedon aeon, in which [the triple-]male child reposes, and the throne of his [glory] was erected [inside it, the one] on which his undisclosable name [is inscribed], on the tablet, [. . .] one being the speech, the [Father of the Light] of the All, he [who pro]ceeded from Silence as he reposes inside Silence, whose [] name [is] in an [unseen] symbol.


    [A] concealed, [unseen] mystery came in procession:


    I I I I I I I I I I I I I I I I I I I [I I I]

    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]

    [O] O O O O O O O O O O O O O O O O O O O O O

    U U [U U U] U U U U U U U U U U U U U U U U U

    E E E E E E E E E E E E E E E E E E E E E E

    A A A A A A A [A A A A] A A A A A A A A A A A.

    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō, [6]


    and [this] was the way the three powers presented praise to the [great], unseen, unnamable, virginal, unutterable Spirit, and [his] male virgin.'
