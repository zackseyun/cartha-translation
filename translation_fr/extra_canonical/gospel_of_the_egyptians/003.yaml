  register: Français international moderne, digne et lisible, avec maintien des termes cosmologiques techniques et des étrangetés intentionnelles du passage. Les numéros de pages manuscrites isolés ont été omis; les séries vocaliques, les crochets et les lacunes ont été conservés.
