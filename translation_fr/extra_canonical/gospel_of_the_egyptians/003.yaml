lexical_decisions:
- source_word: aeon
  choice: Éon
  rationale: Conserve le terme cosmologique technique plutôt que de le réduire à « âge » ou « éternité »; la majuscule marque ici une réalité personnifiée ou hypostasiée.
- source_word: came in procession
  choice: s’avança en procession
  rationale: Préserve l’image rituelle et répétée d’une manifestation ordonnée sans l’interpréter simplement comme une venue.
- source_word: indestructibilities
  choice: êtres impérissables
  rationale: Le substantif abstrait littéral « impérissabilités » serait très opaque en français; cette formulation garde la portée ontologique tout en restant intelligible, sans préciser davantage leur nature.
- source_word: triple-male child
  choice: enfant [trois-fois-]mâle
  rationale: Rend la construction technique et inhabituelle de façon formellement proche, tout en conservant les crochets signalant la restitution.
- source_word: Silence
  choice: Silence
  rationale: La majuscule conserve la possible valeur cosmologique ou personnifiée du terme.
- source_word: the All
  choice: le Tout
  rationale: Équivalent français traditionnel et suffisamment transparent pour désigner la totalité cosmique.
- source_word: male virgin
  choice: vierge mâle
  rationale: Conserve volontairement le paradoxe du texte au lieu de l’harmoniser ou de l’expliquer.
theological_decisions:
- issue: Statut de Doxomédon et de l’Éon
  choice: Maintenir l’identification syntaxiquement tendue entre Doxomédon, l’Éon et le Père de la grande Lumière
  alternative: Réorganiser la phrase pour distinguer clairement ces figures
  rationale: Le passage transmis est fragmentaire et ambigu; une clarification imposerait une cosmologie plus déterminée que celle que permet le témoin fourni.
- issue: Langage de genre sacré
  choice: Conserver « enfant trois-fois-mâle » et « vierge mâle »
  alternative: Neutraliser ou paraphraser ces expressions
  rationale: Ces formules appartiennent à la tension théologique et symbolique propre au passage et ne doivent pas être résolues silencieusement.
- issue: Relation finale entre l’Esprit et la vierge mâle
  choice: Traduire la coordination par « ainsi qu’à [sa] vierge mâle »
  alternative: Comprendre « male virgin » comme une seconde qualification directe de l’Esprit
  rationale: La syntaxe anglaise permet une entité coordonnée, mais demeure difficile; la traduction suit la lecture la plus immédiate sans développer leur relation.
