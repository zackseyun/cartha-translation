translation:
  language: fr
  text: 'Domédon Doxomédon s’avança en procession, l’Éon des éons, avec le trône qui était en lui, les puissances [qui l’entouraient], les gloires et les [êtres impérissables. Le] Père de la grande Lumière, [qui pro]céda du Silence, c’est lui, [le grand] Éon Doxomédon. En lui repose l’enfant [trois-fois-]mâle, et le trône de sa [gloire] fut dressé [en lui, celui] sur lequel son nom impossible à révéler [est inscrit], sur la tablette. […] L’un est la Parole, le [Père de la Lumière] du Tout, lui [qui pro]céda du Silence tandis qu’il repose au sein du Silence, et dont le […] nom [est] dans un symbole [invisible].[a]


    [Un] mystère caché, [invisible], s’avança en procession :


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    et c’est ainsi que les trois puissances adressèrent leur louange au [grand] Esprit invisible, qu’on ne peut nommer, virginal et ineffable, ainsi qu’à [sa] vierge mâle.'
