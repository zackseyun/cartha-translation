    issue: « êtres impérissables » interprète « indestructibilities ».
    rationale: Le témoin emploie un pluriel abstrait/technique, non le mot « beings ». L’ajout de « êtres » précise indûment le statut ontologique de ces éléments.
  - severity: medium
    issue: La lacune vide [] dans « whose [] name » est devenue une ellipse […].
    rationale: Les crochets vides et les points de suspension correspondent à des signaux distincts du témoin; ils doivent rester distingués.
  - severity: low
    issue: Les noms « Domedon Doxomedon » avaient été accentués en français.
    rationale: Aucun élément du témoin fourni ne justifie cette francisation graphique; il est plus sûr de conserver la forme transmise.
