base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/004.yaml
  text: 'They petitioned [for a] power. A silence of living Silence proceeded, namely, [glories] and indestructibilities in the aeons, [. . . aeons], myriads added [to the . . .], three males, [the three] male offspring. The [male] races filled the great Doxomedon [aeon with] the power of the speech of the [entire Fullness].


    Then the triple-male [child of the great] Christ, whom the [great] unseen Spirit had anointed, he whose power [was called] Ainon, presented [praise to] the great unseen Spirit [and his] male virgin, Yoel, [and] the Silence of silent Silence, and the greatness [. . .].


