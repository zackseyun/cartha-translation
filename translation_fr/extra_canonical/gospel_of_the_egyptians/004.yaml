translation:
  language: fr
  text: 'Ils demandèrent [une] puissance. Un silence issu du Silence vivant se manifesta : [des gloires] et des réalités indestructibles dans les éons, [… éons], des myriades ajoutées [aux…], trois mâles, [les trois] descendants mâles. Les races [mâles] remplirent le grand éon Doxomédon [de] la puissance de la parole de [toute la Plénitude].


    Alors l’[enfant du grand] Christ, mâle trois fois — celui que le [grand] Esprit invisible avait oint et dont la puissance [était appelée] Aïnon —, adressa [une louange] au grand Esprit invisible, [à sa] vierge mâle, Yoël, au Silence du Silence silencieux et à la grandeur […].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pages 45 à 48 du Codex III manquent. Cette section correspond aux pages 55 à 60 du Codex IV.
    reason: Signaler clairement la lacune matérielle et le témoin parallèle qui permet de situer la section.
lexical_decisions:
- source_word: power
  choice: puissance
  rationale: « Puissance » conserve ici la portée cosmologique et quasi hypostatique du terme, contrairement à « pouvoir », qui pourrait suggérer surtout une autorité politique ou juridique.
- source_word: aeons
  choice: éons
  rationale: Terme technique attendu pour les réalités ou sphères éternelles de cette cosmologie; il évite de réduire le sens à de simples « siècles ».
- source_word: Fullness
  choice: Plénitude
  rationale: La majuscule signale l’emploi cosmologique spécialisé, sans ajouter une interprétation confessionnelle.
- source_word: triple-male
  choice: mâle trois fois
  rationale: Formulation volontairement inhabituelle qui préserve le caractère technique et l’ambiguïté de l’expression, plutôt que de la normaliser en « triple mâle » ou de l’expliquer.
- source_word: proceeded
  choice: se manifesta
  rationale: Rend l’idée d’une venue ou émanation sans imposer une mécanique métaphysique plus précise que le témoin disponible.
- source_word: speech
  choice: parole
  rationale: « Parole » convient mieux que « discours » à une puissance d’énonciation dans ce contexte cosmologique, sans l’identifier explicitement au Logos.
theological_decisions:
- issue: Le rapport entre le Christ, l’enfant et la qualification « mâle trois fois »
  choice: « l’[enfant du grand] Christ, mâle trois fois »
  alternative: « le triple-mâle [enfant du grand] Christ »
  rationale: La syntaxe du témoin est fragmentaire. La formulation retenue garde visibles la restitution et la qualification sans trancher davantage leur relation grammaticale ou ontologique.
- issue: Le Silence comme réalité personnifiée ou hypostatique
  choice: Maintien des majuscules dans « Silence vivant » et « Silence du Silence silencieux »
  alternative: Tout écrire en minuscules
  rationale: Les majuscules aident à signaler des désignations cosmologiques dans ce passage, tout en laissant intacte leur étrange construction.
- issue: La « vierge mâle » Yoël
  choice: Conserver littéralement « vierge mâle »
  alternative: Harmoniser en « vierge masculine » ou supprimer la tension de genre
  rationale: La tension du syntagme appartient au contenu théologique du témoin et ne doit pas être résolue silencieusement.
- issue: Les lacunes manuscrites
  choice: Conserver chaque restitution entre crochets et chaque lacune par des points de suspension entre crochets
  alternative: Produire un texte français continu en comblant ou supprimant les ruptures
  rationale: L’état fragmentaire du texte constitue une donnée essentielle; le lecteur doit distinguer le texte attesté, les restitutions et les pertes.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du vocabulaire cosmologique technique et de l’étrangeté voulue des expressions. Les crochets signalent les restitutions ou les lacunes du témoin. Projet provisoire fondé sur la traduction anglaise publique fournie; une vérification directe du copte reste nécessaire.
