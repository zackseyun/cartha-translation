review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire par rapport au témoin anglais fourni : « se manifesta » interprète et affaiblit « proceeded »; « réalités indestructibles » ajoute « réalités »; plusieurs crochets ne recouvrent pas exactement les restitutions du témoin. La vérification directe du copte demeure impossible sur la base des données fournies et doit rester signalée comme en attente.'
  naturalness: Le français est globalement lisible, mais « mâle trois fois » est moins naturel que le composé technique « triple-mâle ». La formulation révisée garde l'étrangeté cosmologique sans introduire d'explication.
  terminology: « puissance », « éons », « Plénitude », « vierge mâle » et « Silence » sont appropriés. Les noms sont rendus sans accents ajoutés (Doxomedon, Ainon, Yoel), conformément au témoin de référence fourni.
  issues:
  - severity: medium
    issue: Rendu interprétatif de « proceeded »
    rationale: « Se manifesta » signifie plutôt « devint perceptible / apparut » et ne conserve pas le mouvement ou la procession exprimés par le témoin. « Procéda » préserve volontairement cette formulation technique.
  - severity: medium
    issue: Ajout de « réalités » dans « réalités indestructibles »
    rationale: Le témoin ne fournit que « indestructibilities ». « Indestructibilités », bien que technique et inhabituel, évite l'ajout d'un substantif interprétatif.
  - severity: medium
    issue: Délimitation inexacte de plusieurs restitutions entre crochets
    rationale: Le projet déplace ou réduit les crochets dans « [male] races », « [aeon with] », « [praise to] » et « [and his] ». La révision rend visibles les segments suppléés en français aussi exactement que la syntaxe le permet.
  - severity: low
    issue: Accents ajoutés aux noms propres
    rationale: Doxomédon, Aïnon et Yoël ne suivent pas la graphie du témoin anglais fourni. En l'absence de contrôle copte direct, il est plus prudent de conserver Doxomedon, Ainon et Yoel.
  revised_text: 'Ils demandèrent [une] puissance. Un silence du Silence vivant procéda, à savoir [des gloires] et des indestructibilités dans les éons, [… éons], des myriades ajoutées [à …], trois mâles, [les trois] descendants mâles. Les races [mâles] remplirent le grand Doxomedon [éon de] la puissance de la parole de [toute la Plénitude].


    Alors l’[enfant du grand] Christ, triple-mâle, que le [grand] Esprit invisible avait oint, lui dont la puissance [était appelée] Ainon, présenta [une louange au] grand Esprit invisible [et à sa] vierge mâle, Yoel, [et au] Silence du Silence silencieux, ainsi qu’à la grandeur […].[a]'
  revised_footnotes:
  - marker: a
    text: Les pages 45 à 48 du Codex III manquent. Cette section correspond aux pages 55 à 60 du Codex IV.
    reason: Signale la lacune matérielle du Codex III et le passage parallèle correspondant du Codex IV.
  revision_rationale: La révision suit prioritairement le témoin anglais public fourni, tout en conservant toutes les lacunes et restitutions signalées. Elle supprime des ajouts interprétatifs, maintient les expressions techniques et ne tranche pas les relations cosmologiques ou grammaticales ambiguës. Les compléments français nécessaires dans les segments lacunaires sont placés entre crochets afin de ne pas les présenter comme attestés. Une révision ultérieure contre le copte reste souhaitable, puisque la documentation indique expressément qu'elle est en attente.
