lexical_decisions:
- source_word: indestructible Man
  choice: l’Homme indestructible
  rationale: Conserve le titre cosmologique et la majuscule de « Man », tout en employant un français direct.
- source_word: seed
  choice: descendance / semence
  rationale: Le terme porte probablement un double sens collectif et génératif. « Descendance » convient à l’intercession en faveur d’un groupe, tandis que « semence » préserve l’image concrète dans la scène finale.
- source_word: Fullness
  choice: Plénitude
  rationale: Rend le terme cosmologique traditionnellement désigné par « Plénitude » sans ajouter d’explication doctrinale.
- source_word: aeon
  choice: éon
  rationale: Maintient le terme technique du cadre cosmologique plutôt que de le réduire à « âge » ou « monde ».
- source_word: came forth / proceeded forth
  choice: sortit / vint au-dehors
  rationale: Préserve le motif répété de procession ou d’émanation tout en évitant d’imposer une interprétation métaphysique plus précise que le témoin.
- source_word: four-breasted virgin
  choice: vierge aux quatre seins
  rationale: Traduction littérale, claire et non euphémisée de l’image source.
theological_decisions:
- issue: 'Titres paradoxaux liés au genre : « male virgin », « triple-male child »'
  choice: Conserver « vierge mâle » et « enfant trois fois mâle » entre chevrons
  alternative: Lisser en « vierge masculine » et « enfant triplement masculin », ou supprimer les chevrons
  rationale: Les formulations paradoxales et les signes éditoriaux appartiennent au témoignage fourni; les conserver évite de résoudre une tension symbolique ou une incertitude textuelle.
- issue: Rapport entre Plesithea et Seth dans « through the great Seth »
  choice: « par l’intermédiaire du grand Seth »
  alternative: « à travers le grand Seth » ou « grâce au grand Seth »
  rationale: La formulation garde une médiation réelle sans préciser indûment s’il s’agit d’un passage spatial, d’une génération ou d’une causalité.
- issue: Références à Sodome et Gomorrhe
  choice: Les rendre littéralement sans harmonisation biblique ni commentaire moral
  alternative: Interpréter ces noms symboliquement ou corriger leur ordre
  rationale: Le passage leur attribue une fonction cosmologique inhabituelle; il faut préserver cette tension propre au texte.
- issue: '« deposited it with him » : référent du pronom'
  choice: « la déposa avec lui »
  alternative: « la déposa en lui » ou nommer explicitement Seth/l’enfant
  rationale: Le référent et la relation exacte sont ambigus dans le témoin anglais. Une formulation française légèrement marquée conserve cette ambiguïté plutôt que de choisir silencieusement un antécédent.
translation_notes:
  register: Français international moderne, soutenu mais lisible. La disposition en lignes conserve le caractère litanique de la louange. Les noms propres sont translittérés selon le témoin fourni. Projet provisoire fondé sur une traduction anglaise publique des codices de Nag Hammadi III,2 et IV,2; une vérification directe du copte reste nécessaire.
