  text: 'Then the great Seth, son of the indestructible Man, Adamas, offered praise to:


    the great unseen, unnamable, unutterable, virginal Spirit,

    even the <male virgin>,

    <and the triple-male child>,

    <and the male> virgin Youel,

    and Esephech, keeper of splendor,

    and the crown of his glory, the child of the child,

    [] and the great Doxomedon aeons,

    and the Fullness, as I mentioned previously,


    and he petitioned on behalf of his seed.


    Then the great power of great light, Plesithea, came forth from that place:


    the mother of the angels,

    the mother of lights,

    the glorious mother,

    the four-breasted virgin,

    bearing the fruit from Gomorrah as a spring, and from Sodom,

    being the fruit of the spring of Gomorrah dwelling inside her.


    She came forth through the great Seth.


    Then the great Seth rejoiced because of the gift bestowed on him by the indestructible child. He drew his seed from the four-breasted virgin and deposited it with him inside the fourth aeon, inside the third great light, Davithe.'
translation:
  language: fr
  text: 'Alors le grand Seth, fils de l’Homme indestructible, Adamas, adressa une louange :


    au grand Esprit invisible, innommable, indicible et virginal,

    à savoir la <vierge mâle>,

    <et l’enfant trois fois mâle>,

    <et la> vierge mâle Youel,

    et Esephech, gardien de la splendeur,

    et la couronne de sa gloire, l’enfant de l’enfant,

    [passage manquant][a] et les grands éons de Doxomedon,

    et la Plénitude, comme je l’ai mentionné précédemment.


    Puis il présenta une requête en faveur de sa descendance.


    Alors sortit de ce lieu Plesithea, la grande puissance de la grande lumière :


    la mère des anges,

    la mère des lumières,

    la mère glorieuse,

    la vierge aux quatre seins,

    qui porte le fruit venant de Gomorrhe comme une source, et de Sodome,

    étant le fruit de la source de Gomorrhe qui demeure en elle.


    Elle vint au-dehors par l’intermédiaire du grand Seth.


    Alors le grand Seth se réjouit du don que l’enfant indestructible lui avait accordé. Il tira sa semence de la vierge aux quatre seins et la déposa avec lui dans le quatrième éon, dans la troisième grande lumière, Davithe.'
