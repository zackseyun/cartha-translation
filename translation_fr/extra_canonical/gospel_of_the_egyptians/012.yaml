translation:
  language: fr
  text: 'Alors sortirent des grands éons quatre cents anges éthérés. Parmi eux se trouvaient le grand Aerosiel et le grand Selmechel. Ils devaient veiller sur la grande race indestructible, sur son fruit et sur les grands hommes du grand Seth, depuis le temps et le moment de la Vérité et de la Justice jusqu’à l’accomplissement de l’éon et de ses archontes, que les grands juges avaient condamnés à mort.


    Alors le grand Seth fut envoyé par les quatre luminaires, selon la volonté de l’Autoengendré, […] [a] et de tout le Plérôme, par <le don> [b] et le bon plaisir du grand Esprit invisible, ainsi que par les cinq sceaux et tout le Plérôme.


    Il traversa les trois parousies dont j’ai parlé auparavant : le déluge, l’embrasement et la condamnation des archontes, des puissances et des autorités. C’était afin que celle qui s’était égarée soit sauvée par la réconciliation du monde, et par le baptême au moyen d’un corps engendré par le Logos. Le grand Seth se prépara secrètement ce corps par l’intermédiaire de la vierge, afin que les saints soient engendrés par l’Esprit saint, au moyen de symboles secrets et invisibles, par la réconciliation du monde avec le monde, par le renoncement au monde et au dieu des treize éons, et par les sessions [c] des saints indicibles et indestructibles, dans le sein et la grande lumière du Père. Cette lumière préexistait avec sa Providence et, par elle, institua le saint baptême qui surpasse le ciel, au moyen de l’être indestructible […] [d], engendré par le Logos : le Vivant, Jésus, celui-là même que le grand Seth revêtit. Par lui, il cloua les puissances des treize éons et affermit ceux qui sont
    produits et retirés.


    Il les équipa de l’armure que donne la connaissance de cette vérité, dans la force invincible de l’indestructibilité. Alors leur apparurent :


    le grand assistant Yesseus Mazareus Yessedekeus, l’eau vive ;


    les grands chefs, Jacob le Grand,


    Theopemptos et Isavel ;


    ceux qui veillent sur la source de vérité, Micheus, Michar et Mnesinous ;


    celui qui veille sur le baptême destiné aux vivants ;


    ceux qui purifient ;


    Sesengenpharanges ;


    ceux qui veillent sur les portes donnant accès aux eaux, Micheus et Michar ;


    ceux qui veillent sur la haute montagne, Seldao et Elainos ;


    ceux qui accueillent la grande race ;


    les hommes puissants et indestructibles <du> [e] grand Seth ;


    les serviteurs des quatre luminaires : le grand Gamaliel, le grand Gabriel, le grand Samblo et le grand […] [f] Abrasax ;


    ceux qui veillent sur le lever du soleil, Olses, Hupneus et Heurumaious ;


    ceux qui sont préposés à l’entrée du repos de la vie éternelle, les dirigeants Mixanther et Michanor ;


    les gardiens des âmes élues, Akramas et Strempouchos ;


    la grande puissance Heli Heli Machar Machar Seth ;


    le grand Esprit vierge, invisible, impossible à nommer et à exprimer, ainsi que le Silence ;


    et la grande lumière Harmozel ;


    le lieu de l’Autoengendré vivant, le Dieu de vérité, et <celui> [g] qui l’accompagne,


    l’Homme indestructible, Adamas ;


    le deuxième, Oroiael, le lieu du grand Seth ;


    et Jésus, qui possède la vie, qui est venu et a crucifié ce qui est dans la Loi ;


    le troisième, Davithe, le lieu des fils du grand Seth ;


    le quatrième, Eleleth, le lieu des âmes des fils entrés dans le repos ;


    le cinquième, Yoel, préposé au nom de celui qui sera établi pour baptiser du saint baptême qui surpasse le ciel indestructible.


    Mais désormais, […] [h] par l’intermédiaire de l’Homme indestructible Poimael, de ceux qui sont dignes de supplication et des renoncements des cinq sceaux à la source baptismale, ils connaîtront ceux qui les accueillent lorsqu’ils auront été instruits à leur sujet ; ceux-ci les connaîtront aussi, et ils ne goûteront absolument pas la mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit présente ici une lacune.
    reason: Signaler honnêtement une perte textuelle susceptible d’affecter la syntaxe et la liste des agents.
  - marker: b
    text: « Le don » est une restitution éditoriale.
    reason: Distinguer le texte conservé d’un complément proposé par les éditeurs.
  - marker: c
    text: Le sens du terme rendu par « sessions » est incertain ; il pourrait évoquer des sièges, des assemblées ou des demeures.
    reason: Préserver une difficulté lexicale que le témoin anglais ne permet pas de résoudre avec assurance.
  - marker: d
    text: Le manuscrit présente ici une lacune.
    reason: La perte se situe dans une description théologiquement importante de l’être indestructible.
  - marker: e
    text: « Du » restitue un lien grammatical absent ou endommagé dans le texte conservé.
    reason: Identifier le complément éditorial indiqué par les chevrons de la source de travail.
  - marker: f
    text: Le manuscrit présente ici une lacune, peut-être dans un titre ou un nom précédant Abrasax.
    reason: Éviter de donner l’impression que l’énumération est entièrement conservée.
  - marker: g
    text: « Celui » est une restitution éditoriale ; la construction de cette partie de la liste demeure incertaine.
    reason: Signaler à la fois l’ajout et l’instabilité syntaxique.
  - marker: h
    text: Le manuscrit présente ici une lacune ; la construction de la phrase finale reste donc incertaine.
    reason: La lacune empêche d’établir avec assurance les rapports entre Poimael, les personnes dignes de supplication et les renoncements.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Conserve le terme cosmologique technique du traité plutôt que de le réduire à « siècles » ou « mondes ».
- source_word: archons
  choice: archontes
  rationale: Maintient le titre technique des puissances gouvernantes de cette cosmologie.
- source_word: Fullness
  choice: Plérôme
  rationale: Le terme français spécialisé rend la totalité divine personnifiée ou structurée sans l’assimiler à une simple « plénitude » abstraite.
- source_word: self-generated one
  choice: l’Autoengendré
  rationale: Rend la désignation technique et substantivée, tout en évitant « incréé », qui supprimerait une nuance propre au texte.
- source_word: parousias
  choice: parousies
  rationale: Conserve le terme grec transmis par le témoin et son ambiguïté entre venues, présences et manifestations.
- source_word: Logos
  choice: Logos
  rationale: Préserve le terme technique plutôt que d’imposer « Parole » dans un contexte cosmologique où l’identification exacte reste à établir.
- source_word: lights
  choice: luminaires
  rationale: Désigne ici des êtres ou puissances célestes, et non de simples lumières impersonnelles.
- source_word: receivers
  choice: ceux qui accueillent
  rationale: Expression française compréhensible qui conserve la fonction d’accueil ou de réception sans préciser indûment sa nature rituelle ou céleste.
- source_word: indestructibility
  choice: indestructibilité
  rationale: Conserve le vocabulaire récurrent et technique du passage plutôt que de le normaliser en « immortalité ».
theological_decisions:
- issue: Relation entre le grand Seth et Jésus
  choice: « Jésus, celui-là même que le grand Seth revêtit »
  alternative: « Jésus, en qui le grand Seth s’incarna »
  rationale: Le choix conserve la métaphore du vêtement et n’impose pas une doctrine précise de l’incarnation ou de l’identité entre Seth et Jésus.
- issue: Objet crucifié par Jésus
  choice: « a crucifié ce qui est dans la Loi »
  alternative: « a aboli la Loi par la croix »
  rationale: La formulation étrange du témoin est maintenue, car une paraphrase doctrinale résoudrait une ambiguïté textuelle réelle.
- issue: Salut de « celle qui s’était égarée »
  choice: Conservation du féminin sans identification
  alternative: Identifier cette figure à l’âme, à la Sagesse ou à une entité nommée
  rationale: Le passage fourni ne nomme pas explicitement le référent ; l’identifier importerait une interprétation.
- issue: Baptême et corps engendré par le Logos
  choice: Conserver la chaîne syntaxique et les médiations distinctes
  alternative: Réorganiser le passage en une doctrine sacramentelle systématique
  rationale: Le texte associe plusieurs moyens de salut sans en préciser nettement les rapports ; la traduction ne doit pas les harmoniser.
- issue: Esprit vierge et Silence
  choice: Les présenter comme deux éléments coordonnés
  alternative: Faire de « Silence » un attribut de l’Esprit vierge
  rationale: La syntaxe de la liste permet plusieurs lectures ; la coordination suit le témoin sans nier entièrement l’autre possibilité.
translation_notes:
  register: 'Français international moderne, digne et lisible, avec conservation du vocabulaire cosmologique et rituel propre au traité. Les longues périodes ont été légèrement segmentées sans réordonner leur théologie. Les noms propres ont été conservés selon le témoin fourni et n’ont pas été harmonisés avec d’autres éditions. Ce projet reste provisoire : il repose sur le témoin anglais public fourni, la vérification directe du copte des codices de Nag Hammadi III,2 et IV,2 étant encore à effectuer.'
