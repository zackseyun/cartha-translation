lexical_decisions:
- source_word: race
  choice: lignée
  rationale: « Lignée » rend l’idée d’un groupe issu d’une origine commune tout en évitant les connotations modernes potentiellement trompeuses de « race » ; le caractère collectif et séthien est maintenu.
- source_word: seed
  choice: semence
  rationale: Le terme conserve le réseau métaphorique de semer, ensemencement, plantation et transplantation, ainsi que l’ambiguïté entre semence et descendance.
- source_word: aeon
  choice: éon
  rationale: Terme technique courant en français pour les réalités cosmologiques de ce texte ; il évite de réduire le mot à une simple période de temps.
- source_word: archon
  choice: archonte
  rationale: Translittération française consacrée, adaptée à la fonction cosmologique particulière du personnage.
- source_word: Logos
  choice: Logos
  rationale: Le maintien du terme technique préserve sa portée personnelle et cosmologique, que « Parole » pourrait interpréter trop étroitement.
- source_word: Fullness
  choice: Plénitude
  rationale: « Plénitude », avec majuscule, rend le terme cosmologique sans imposer le grec « Plérôme », absent du témoin fourni.
- source_word: watchers
  choice: veilleurs
  rationale: Rend naturellement la fonction de ceux qui veillent et permet de conserver la répétition volontaire « veilleurs qui veillent ».
- source_word: deficiency
  choice: manque
  rationale: Choix clair et naturel qui conserve l’idée d’une réalité incomplète devant être comblée, sans surcharger le passage d’un vocabulaire doctrinal.
- source_word: type
  choice: figure
  rationale: « Figure » exprime le rapport préfiguratif sans préciser davantage la relation entre le déluge et l’achèvement de l’éon.
theological_decisions:
- issue: Identité de « elle » au début de l’extrait
  choice: Conserver le pronom « elle » sans identifier son référent
  alternative: Ajouter le nom supposé de la figure féminine
  rationale: L’extrait fourni ne donne pas l’antécédent ; l’expliciter introduirait une reconstruction théologique non attestée ici.
- issue: Paradoxe de la « vierge mâle »
  choice: Traduire littéralement « vierge mâle »
  alternative: Lisser en « être virginal masculin » ou harmoniser le genre
  rationale: Le paradoxe sexué appartient au langage théologique du passage et ne doit pas être résolu silencieusement.
- issue: Référent de « il sera envoyé » après le déluge
  choice: Conserver le pronom masculin « il », dont l’antécédent naturel est « le déluge »
  alternative: Nommer explicitement le déluge ou l’achèvement
  rationale: La formulation française reste proche du témoin et ne résout pas au-delà de ce que permet la syntaxe transmise.
- issue: Portée causale des calamités « à cause de cette lignée »
  choice: Maintenir la répétition causale sans l’expliquer
  alternative: Présenter les calamités comme châtiment de la lignée ou comme attaque dirigée contre elle
  rationale: Le texte laisse subsister une tension sur la raison et la fonction de ces événements.
- issue: Nature de la Plénitude
  choice: Employer « Plénitude » comme désignation cosmologique sans commentaire doctrinal
  alternative: Employer systématiquement « Plérôme » et en définir la structure
  rationale: Cette solution préserve le statut technique du terme sans importer un système interprétatif supplémentaire.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du vocabulaire cosmologique propre au texte. Les longues périodes ont été légèrement articulées sans supprimer les répétitions rhétoriques. Les majuscules distinguent certaines entités personnifiées ou techniques. Projet provisoire fondé sur le témoin anglais public fourni ; une collation directe des codices coptes III,2 et IV,2 est nécessaire avant publication définitive.
