  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: fr
  text: 'Elle reçut son accomplissement et sa puissance par la volonté du Père et selon son bon plaisir. Par ce bon plaisir, il prit plaisir à la grande lignée indestructible et immuable des hommes grands et puissants du grand Seth, afin de pouvoir la semer au sein des éons qui avaient été produits et que, par elle, le manque soit comblé. Car elle descendit d’en haut jusque dans le monde, étant l’image de la nuit. Lorsqu’elle fut sortie, elle intercéda en faveur de la semence de l’archonte de cet éon et <des> autorités issues de lui — la semence souillée du dieu qui engendre des démons et qui sera détruit —, et elle intercéda en faveur de la semence […] d’Adam et du grand Seth, laquelle ressemble au soleil.[a]


    Alors le grand ange Hormos arriva pour préparer la semence du grand Seth, au moyen des vierges de l’ensemencement souillé de cet éon, dans un vase sacré engendré par le Logos au moyen de l’Esprit saint.[b]


    Alors le grand Seth arriva avec sa semence, et celle-ci fut semée au sein des éons qui avaient été produits, dont le nombre correspond à la valeur numérique de « Sodom ».[c] Certains disent que Sodom est le lieu où le grand Seth fait paître son troupeau, à savoir Gomorrhe. D’autres, cependant, disent que le grand Seth retira sa plantation de Gomorrhe et la transplanta dans un second lieu, auquel il donna le nom de Sodom.


    Telle est la lignée qui est sortie par Edokla : en parlant, elle donna naissance à la Vérité et à la Justice, devenant ainsi le commencement de la semence de la vie éternelle destinée à ceux qui persévéreront grâce à la connaissance de leur émanation. Telle est la grande lignée indestructible qui, à travers trois […] mondes, est venue jusque dans le monde. Le déluge eut lieu comme figure de l’achèvement de l’éon, mais il sera envoyé dans le monde à cause de cette lignée.[d]


    Un embrasement s’abattra sur la terre, et la grâce sera accordée à ceux de la lignée venue à l’existence par les prophètes et par les veilleurs qui veillent sur la vie de la lignée. À cause de cette lignée viendront des famines et des épidémies ; ces choses se produiront à cause de la grande lignée indestructible. À cause de cette lignée viendront aussi des épreuves, et même la tromperie de faux prophètes.


    Alors le grand Seth vit l’œuvre du diable : ses nombreux déguisements, ses complots contre la lignée indestructible et immuable, les persécutions menées par ses puissances et ses anges, ainsi que l’égarement par lequel ils agirent contre eux-mêmes.


    Alors le grand Seth adressa une louange :


    au grand Esprit virginal, que nul ne peut nommer,


    à Barbelon, la vierge mâle […],


    à l’enfant trois fois mâle, Telmael Telmael Heli Heli Machar Machar Seth,


    à la puissance vivante, ALĒTHES ALĒTHŌS,


    à Youel, la vierge mâle,


    à Esephech, gardien de la splendeur, couronne de sa gloire,


    au grand éon Doxomedon,


    aux trônes qui sont en lui,


    aux puissances qui les entourent,


    et à toute la Plénitude, comme je l’ai dit précédemment.


    Puis il intercéda afin que des veilleurs soient établis sur sa semence.[e]'
