  naturalness: Le français est soutenu et intelligible. « s’avança et descendit d’en haut » est plus fidèle et aussi plus naturel que « émana et descendit ». La formulation paradoxale « vierge mâle » est conservée. La position des crochets dans le titre de Youel est ajustée afin de signaler explicitement que le second élément du titre est restauré.
  terminology: Les choix Logos, Homme, Plénitude, éon, déficience et indestructibilités sont cohérents et ne surinterprètent pas le texte. Les noms Mirothoe, Esephech et Doxomedon sont rétablis selon le témoin anglais, sans accents français non attestés dans celui-ci.
  issues:
  - severity: medium
    issue: « émana » traduit « proceeded »
    rationale: Le témoin dit seulement que le Père « proceeded and descended ». « Émana » introduit une interprétation cosmologique plus déterminée que le libellé fourni. « S’avança » maintient le mouvement sans le théoriser.
  - severity: low
    issue: Francisation non attestée des noms propres
    rationale: Le brouillon écrit « Mirothoé », « Eséphech » et « Doxomédon », alors que le témoin de référence donne Mirothoe, Esephech et Doxomedon. En l’absence de contrôle copte direct, il est plus sûr de conserver ces formes.
  - severity: low
    issue: Crochets du titre de Youel insuffisamment explicites
    rationale: Le témoin porte « male [virgin] ». La rédaction « [vierge] mâle » fait porter la restauration sur un élément placé avant « mâle ». « mâle [vierge] » reproduit plus directement la localisation de l’incertitude, malgré son caractère volontairement abrupt.
