translation:
  language: fr
  text: '[…] […apparut de] ce [lieu] la nuée de la grande Lumière, la puissance vivante, la mère des êtres saints et indestructibles, la grande puissance, Mirothoé.[a] Elle enfanta celui dont je prononce le nom en le disant trois fois :


    IEN

    IEN

    EA

    EA

    EA,[b]


    car celui-ci est Adamas, la lumière resplendissante qui tire son origine de l’Homme, l’Homme primordial. Par lui et pour lui, tout est venu à l’existence, et sans lui rien n’est venu à l’existence. Le Père inconnaissable et insaisissable émana et descendit d’en haut pour abolir la déficience.


    Alors le grand Logos, le Dieu qui s’est engendré lui-même, et l’Homme indestructible, Adamas, s’unirent l’un à l’autre. Un Logos de l’Homme vint à l’existence, mais l’Homme vint à l’existence par un acte de parole. Il adressa une louange :


    au grand Esprit virginal, invisible et insaisissable,


    à la vierge mâle,


    à l’enfant triplement mâle,


    […] et à la [vierge] mâle, Youel,


    à Eséphech, gardien de la splendeur,


    à l’enfant de l’enfant,


    à la couronne de sa gloire,


    au grand éon Doxomédon,


    aux trônes qui sont en lui,


    aux puissances qui l’entourent,


    aux gloires,


    aux indestructibilités,


    à toute leur Plénitude, que j’ai mentionnée précédemment,


    et à la terre de l’air, réceptacle de Dieu,


    où les hommes saints de la grande Lumière reçoivent une image,


    les hommes du Père du Silence vivant et silencieux,


    le Père et toute leur Plénitude, comme je l’ai mentionné précédemment.[c]


    [a] Les points de suspension et les crochets signalent une lacune ou une restitution incertaine dans le manuscrit. La forme du nom « Mirothoé » suit le témoin de consultation.

    [b] Ces syllabes sacrées sont translittérées plutôt que traduites. Le témoin présente deux fois « IEN » puis trois fois « EA », bien que la phrase parle de dire le nom « trois fois ». Le nombre « 10 », indication de page du manuscrit placée ici dans le témoin, n’est pas reproduit dans le corps du texte.

    [c] La construction de cette dernière série est difficile : le lien grammatical entre « les hommes », « le Père » et « toute leur Plénitude » demeure incertain. La traduction conserve cette tension sans réorganiser la phrase.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les points de suspension et les crochets signalent une lacune ou une restitution incertaine dans le manuscrit. La forme du nom « Mirothoé » suit le témoin de consultation.
    reason: Signaler les dommages textuels et l’incertitude de la translittération sans reconstruire le copte absent.
  - marker: b
    text: Ces syllabes sacrées sont translittérées plutôt que traduites. Le témoin présente deux fois « IEN » puis trois fois « EA », bien que la phrase parle de dire le nom « trois fois ». Le nombre « 10 », indication de page du manuscrit placée ici dans le témoin, n’est pas reproduit dans le corps du texte.
    reason: Préserver une incohérence réelle du témoin et distinguer la pagination moderne du texte.
  - marker: c
    text: 'La construction de cette dernière série est difficile : le lien grammatical entre « les hommes », « le Père » et « toute leur Plénitude » demeure incertain. La traduction conserve cette tension sans réorganiser la phrase.'
    reason: Avertir le lecteur d’une ambiguïté syntaxique et théologique qui ne peut être résolue à partir du témoin fourni.
lexical_decisions:
- source_word: great Light
  choice: grande Lumière
  rationale: La majuscule conserve la fonction quasi titulaire de l’expression dans ce texte.
- source_word: Logos
  choice: Logos
  rationale: Le terme technique est conservé en français afin de ne pas réduire son champ sémantique à « parole », « raison » ou « discours »; « acte de parole » traduit séparément l’expression verbale voisine.
- source_word: self-generated God
  choice: Dieu qui s’est engendré lui-même
  rationale: Cette formulation explicite le sens sans imposer le néologisme plus spécialisé « autogénéré ».
- source_word: Man / Primal Man
  choice: Homme / Homme primordial
  rationale: Les majuscules signalent qu’il s’agit ici de figures ou réalités cosmiques, et non simplement de l’humanité en général.
- source_word: deficiency
  choice: déficience
  rationale: Le terme conserve la notion technique d’un manque ou état déficient sans la préciser théologiquement.
- source_word: Fullness
  choice: Plénitude
  rationale: La majuscule préserve l’emploi technique probable correspondant à la totalité du monde divin.
- source_word: aeon
  choice: éon
  rationale: Le terme spécialisé est translittéré, car « âge » ou « éternité » effacerait ici sa valeur d’entité ou de domaine cosmique.
- source_word: indestructibilities
  choice: indestructibilités
  rationale: Le substantif abstrait inhabituel est maintenu, puisque le texte semble traiter ces réalités comme des membres nommés de la Plénitude.
- source_word: receiver of God
  choice: réceptacle de Dieu
  rationale: « Réceptacle » rend l’idée de ce qui reçoit sans préciser s’il s’agit d’un lieu, d’une puissance ou d’une personne.
theological_decisions:
- issue: Relation entre Adamas, le Logos et l’Homme
  choice: Conserver les désignations distinctes et la formulation « s’unirent l’un à l’autre »
  alternative: Identifier ou hiérarchiser explicitement ces figures
  rationale: Le passage associe ces réalités sans expliquer complètement leur identité ni leur distinction; la traduction ne tranche pas.
- issue: Formule de venue à l’existence
  choice: « Par lui et pour lui, tout est venu à l’existence »
  alternative: « Par lui et en vue de lui, toutes choses furent créées »
  rationale: « Venir à l’existence » respecte la terminologie émanationnelle du passage et évite d’introduire à elle seule une doctrine précise de la création.
- issue: Émanation et descente du Père
  choice: « émana et descendit d’en haut »
  alternative: « sortit et descendit d’en haut »
  rationale: « Émana » reflète le mouvement cosmologique exprimé par le témoin, sans expliquer son mécanisme.
- issue: Genre paradoxal des figures virginales
  choice: « vierge mâle » et « enfant triplement mâle »
  alternative: Lisser en « vierge masculine » ou reformuler les titres
  rationale: Le paradoxe de genre paraît intentionnel et théologiquement significatif; il ne doit pas être harmonisé.
- issue: Silence personnifié
  choice: « le Silence vivant et silencieux »
  alternative: « le silence vivant, muet »
  rationale: La majuscule et la répétition conservent la personnification et la tension de la formule.
translation_notes:
  register: Français international moderne, soutenu mais lisible. Les titres cosmologiques prennent une majuscule lorsqu’ils fonctionnent comme noms propres ou désignations techniques. Les noms propres et syllabes sacrées sont translittérés avec une accentuation française minimale. Projet provisoire fondé sur le témoin anglais public fourni; une vérification directe des codices coptes III,2 et IV,2 reste nécessaire, notamment pour les lacunes, les genres grammaticaux, les termes techniques et la syntaxe de la doxologie finale.
