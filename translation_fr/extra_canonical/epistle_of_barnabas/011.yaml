  yaml_path: translation/extra_canonical/epistle_of_barnabas/011.yaml
  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: fr
  text: 'Mais demandons-nous si le Seigneur a pris soin d’annoncer d’avance quelque chose au sujet de l’eau et de la croix. Concernant l’eau, il est écrit à propos d’Israël qu’ils ne recevraient pas le baptême qui apporte le pardon des péchés, mais qu’ils s’en construiraient eux-mêmes.[a]


    Car le prophète dit : « Sois stupéfait, ciel, et que la terre en frémisse plus encore ! Car ce peuple a commis deux méfaits : ils m’ont abandonné, moi, la source de la vie, et ils se sont creusé une fosse de mort.


    « Mon mont saint, le Sinaï, est-il un rocher désert ? Car vous serez comme les oisillons qui voltigent dans les airs quand ils sont privés de leur nid. »


    Et le prophète dit encore : « Je marcherai devant toi, j’aplanirai les montagnes, je fracasserai les portes de bronze et je briserai les barres de fer. Je te donnerai des trésors obscurs, cachés, invisibles, afin qu’ils sachent que je suis le Seigneur Dieu. »


    Et encore : « Tu habiteras dans la haute caverne d’un rocher fort. » Et : « Son eau sera assurée. Vous verrez le Roi dans sa gloire, et votre âme méditera sur la crainte du Seigneur. »


    Il dit encore dans un autre prophète : « Celui qui fait ces choses sera comme l’arbre planté près des cours d’eau, qui donnera son fruit en sa saison. Sa feuille ne tombera pas, et tout ce qu’il fera réussira.


    « Il n’en va pas ainsi des impies, il n’en va pas ainsi : ils sont comme la poussière que le vent disperse de la surface de la terre. C’est pourquoi les impies ne se tiendront pas lors du jugement, ni les pécheurs dans l’assemblée des justes. Car le Seigneur connaît le chemin des justes, mais le chemin des impies périra. »


    Vous comprenez comment il a désigné à la fois l’eau et la croix. En voici le sens : Heureux ceux qui mettent leur espérance dans la croix et descendent dans l’eau. En effet, il parle de la récompense lorsqu’il dit : « en sa saison » ; « alors, dit-il, je rendrai à chacun ce qui lui revient ».[b] Mais que dit-il du temps présent ? « Sa feuille ne tombera pas. » Il veut dire par là que toute parole qui sortira de votre bouche avec foi et amour amènera beaucoup de gens à la conversion et à l’espérance.


    Un autre prophète dit encore : « La terre de Jacob fut célébrée plus que toute la terre. » Voici ce qu’il veut dire : Dieu glorifie le vase de son Esprit.[c]


    Que dit-il ensuite ? « Un fleuve coulait du côté droit, et de beaux arbres en surgirent ; quiconque mangera de leur fruit vivra éternellement. »


    Il dit cela parce que nous descendons dans l’eau chargés de péchés et de souillure, puis nous en remontons en portant du fruit dans notre cœur, ayant dans l’Esprit notre crainte et notre espérance fondées sur Jésus.[d] « Quiconque mangera du fruit de ces arbres vivra éternellement. » Voici ce qu’il veut dire : « Quiconque, dit-il, entendra ces paroles et croira vivra éternellement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase « mais qu’ils s’en construiraient eux-mêmes » reste inachevée dans le témoin fourni ; aucun complément conjectural n’a été ajouté.
    reason: Signaler une difficulté textuelle réelle et éviter de masquer une lacune par une interprétation.
  - marker: b
    text: La formule « alors je rendrai à chacun ce qui lui revient » est donnée par l’auteur comme explication de « en sa saison » ; elle ne figure pas dans la citation précédente du psaume.
    reason: Distinguer la citation scripturaire de son développement interprétatif.
  - marker: c
    text: Le « vase de son Esprit » peut désigner un être ou une réalité qui reçoit et porte l’Esprit ; le référent précis n’est pas explicité ici.
    reason: Préserver l’ambiguïté de l’image théologique.
  - marker: d
    text: La syntaxe transmise permet difficilement de déterminer avec certitude le lien exact entre « dans l’Esprit », « notre crainte et notre espérance » et « Jésus ».
    reason: Le dossier fourni indique qu’une vérification directe du grec et du latin reste à faire.
lexical_decisions:
- source_word: βάπτισμα / baptisma (reconstructed from witness tradition)
  choice: baptême
  rationale: Conserve le terme cultuel explicite et son lien interprétatif avec la descente dans l’eau.
- source_word: ἄφεσις ἁμαρτιῶν (reconstructed)
  choice: pardon des péchés
  rationale: Formulation française naturelle qui conserve la portée sotériologique sans préciser davantage le mécanisme.
- source_word: φόβος κυρίου / fear of the Lord
  choice: crainte du Seigneur
  rationale: Expression biblique consacrée ; « crainte » préserve mieux que « respect » l’étendue sémantique et la tension du texte.
- source_word: σκεῦος τοῦ πνεύματος / vessel of the Spirit
  choice: vase de son Esprit
  rationale: Le terme « vase » maintient l’image ancienne du récipient humain, plutôt que de la paraphraser par « instrument ».
- source_word: μετάνοια / conversion (as represented by the witness)
  choice: conversion
  rationale: Dans ce contexte, désigne un retournement produit par une parole de foi et d’amour ; évite de limiter le sens au seul remords.
theological_decisions:
- issue: Rapport entre baptême, eau et pardon des péchés
  choice: « le baptême qui apporte le pardon des péchés »
  alternative: « le baptême pour le pardon des péchés »
  rationale: Suit le témoignage fourni sans développer une doctrine sacramentelle plus précise que celle formulée par l’auteur.
- issue: Interprétation christologique de l’arbre et de la croix
  choice: 'Conserver explicitement l’explication de l’auteur : l’eau et la croix sont désignées ensemble'
  alternative: Présenter les citations comme ne concernant que le juste et l’eau
  rationale: La lecture typologique appartient au raisonnement de Barnabé et ne doit ni être supprimée ni renforcée au-delà du texte.
- issue: « fondées sur Jésus » dans la phrase finale
  choice: Rattacher la crainte et l’espérance à Jésus tout en conservant « dans l’Esprit »
  alternative: « plaçant spirituellement en Jésus notre crainte et notre espérance »
  rationale: Préserve les deux éléments théologiques et l’ambiguïté syntaxique d’un passage transmis ici seulement par un témoin anglais provisoire.
- issue: Identité du « vase de son Esprit »
  choice: Ne pas identifier explicitement le vase
  alternative: L’identifier à l’être humain baptisé, à Jacob ou au corps
  rationale: Le contexte suggère une interprétation, mais le libellé fourni ne tranche pas nettement ; l’ambiguïté est donc conservée.
translation_notes:
  register: 'Français international moderne, digne et lisible, avec maintien du rythme argumentatif et des citations bibliques. Les archaïsmes ont été évités, tandis que des expressions bibliques porteuses de sens (« crainte du Seigneur », « vase de son Esprit ») ont été conservées. Projet nécessairement provisoire : le dossier ne fournit qu’un témoin anglais du domaine public et précise que la collation directe des sources grecques et latines reste en attente.'
