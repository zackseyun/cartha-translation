review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le projet complète indûment la proposition explicitement inachevée du témoin (« mais qu’ils s’en construiraient eux-mêmes »), ajoute « à chacun ce qui lui revient » à « je rendrai », et ajoute « du fruit » dans la dernière citation. La phrase finale peut être rendue plus près de la syntaxe grecque traditionnellement attestée, sans imposer d’interprétation doctrinale.'
  naturalness: Le français est généralement clair et d’un registre approprié. Quelques formulations ont été resserrées pour éviter une paraphrase explicative et conserver les enchaînements abrupts de l’auteur.
  terminology: « baptême », « pardon des péchés », « crainte du Seigneur », « conversion » et « vase de son Esprit » sont maintenus. « Dans l’Esprit » est conservé dans la dernière explication, sans le transformer en une assertion sur des sentiments « fondés sur Jésus ».
  issues:
  - severity: high
    issue: Complément de la phrase inachevée après « mais qu’ils construiraient pour eux-mêmes »
    rationale: Le témoin anglais s’arrête après « but would build for themselves ». « s’en construiraient eux-mêmes » introduit un pronom objet absent et masque l’inachèvement signalé par la note.
  - severity: high
    issue: Expansion de « alors, je rendrai »
    rationale: « à chacun ce qui lui revient » n’est pas présent dans le témoin fourni et ne doit pas être introduit dans le texte traduit.
  - severity: medium
    issue: Ajout de « du fruit » dans la citation finale
    rationale: Le texte dit seulement que quiconque « mangera de ceux-ci » vivra éternellement ; l’objet doit demeurer les arbres, sans explicitation ajoutée.
  - severity: medium
    issue: Reconfiguration interprétative de la dernière phrase baptismale
    rationale: « ayant dans l’Esprit notre crainte et notre espérance fondées sur Jésus » modifie les relations syntaxiques. La révision conserve la séquence « crainte et espérance en Jésus, dans l’Esprit » de manière plus sobre.
