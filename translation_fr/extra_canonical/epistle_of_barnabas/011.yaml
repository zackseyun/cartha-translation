source:
  text: 'But let us enquire whether the Lord took care to signify before hand concerning the water and the cross. Now concerning the water it is written in reference to Israel, how that they would not receive the baptism which bringeth remission of sins, but would build for themselves.


    For the prophet saith; Be astonished, O heaven, and let the earth shudder the more at this, for this people hath done two evil things; they abandoned Me the fountain of life, and they digged for themselves a pit of death.


    Is My holy mountain of Sinai a desert rock? for ye shall be as the fledglings of a bird, which flutter aloft when deprived of their nest.


    And again the prophet saith; I will go before thee, and level mountains and crush gates of brass and break in pieces bolts of iron, and I will give thee treasures dark, concealed, unseen, that they may know that I am the Lord God.


    And; Thou shalt dwell in a lofty cave of a strong rock. And; His water shall be sure; ye shall see the King in glory, and your soul shall meditate on the fear of the Lord.


    And again He saith in another prophet; And He that doeth these things shall be as the tree that is planted by the parting streams of waters, which shall yield his fruit at his proper season, and his leaf shall not fall off, and all things whatsoever he doeth shall prosper.


    Not so are the ungodly, not so, but are as the dust which the wind scattereth from the face of the earth. Therefore ungodly men shall not stand in judgment, neither sinners in the council of the righteous; for the Lord knoweth the way of the righteous, and the way of the ungodly shall perish.


    Ye perceive how He pointed out the water and the cross at the same time. For this is the meaning; Blessed are they that set their hope on the cross, and go down into the water; for He speaketh of the reward at his proper season; then, saith He, I will repay. But now what saith He? His leaves shall not fall off; He meaneth by this that every word, which shall come forth from you through your mouth in faith and love, shall be for the conversion and hope of many.


    And again another prophet saith; And the land of Jacob was praised above the whole earth. He meaneth this; He glorifieth the vessel of His Spirit.


    Next what saith He? And there was a river streaming from the right hand, and beautiful trees rose up from it; and whosoever shall eat of them shall live forever.


    This He saith, because we go down into the water laden with sins and filth, and rise up from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. And whosoever shall eat of these shall live forever; He meaneth this; whosoever, saith He, shall hear these things spoken and shall believe, shall live forever.'
