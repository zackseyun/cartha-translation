    reason: Explique le lien ancien entre le nombre 300, la lettre tau et la croix.
lexical_decisions:
- source_word: περιτομή / circumcision
  choice: circoncision
  rationale: Conserve le terme central et le jeu argumentatif entre la chair, le cœur et les oreilles.
- source_word: σφραγίς / seal
  choice: sceau
  rationale: Terme religieux et juridique naturel en français, sans préciser davantage la fonction du signe.
- source_word: πανουργία / cleverness
  choice: ruse
  rationale: Rend ici la valeur négative du savoir-faire attribué à un ange mauvais, plutôt qu’une intelligence neutre.
- source_word: τέκνα ἀγάπης / children of love
  choice: enfants de l’amour
  rationale: Préserve l’expression inhabituelle et affectueuse sans la paraphraser en appartenance confessionnelle.
- source_word: ἔμφυτος δωρεά / innate gift
  choice: don inné
  rationale: Maintient l’idée d’un don implanté ou présent au-dedans, malgré l’étrangeté de la formulation.
- source_word: δόγματα τριῶν γραμμάτων / ordinances of three letters
  choice: prescriptions de trois lettres
  rationale: Conserve le lien entre instruction reçue et interprétation des trois caractères numériques.
theological_decisions:
- issue: Référent des pronoms divins dans les citations et le commentaire
  choice: Maintenir les pronoms sans identifier systématiquement le locuteur au Père, au Christ ou à l’Écriture
  alternative: Expliciter chaque référent divin
  rationale: Le passage superpose librement Seigneur, prophète, Écriture et interprétation christologique ; l’explicitation résoudrait une ambiguïté réelle.
- issue: Portée de l’affirmation sur la circoncision charnelle
  choice: Traduire directement l’argument polémique de l’auteur
  alternative: L’atténuer ou l’harmoniser avec une théologie ultérieure
  rationale: La traduction doit préserver la tension historique et théologique du texte sans l’endosser ni la corriger.
- issue: Lecture christologique des nombres 318
  choice: Préserver l’exégèse des lettres grecques et de leur valeur numérique
  alternative: La remplacer par une explication symbolique modernisée
  rationale: Cette lecture est constitutive de l’argument de Barnabé et doit rester visible dans sa forme ancienne.
- issue: Expression « soyez circoncis pour votre Seigneur »
  choice: Employer « pour votre Seigneur »
  alternative: « en votre Seigneur » ou « entrez par la circoncision dans votre Seigneur »
  rationale: Le témoin fourni présente une tournure textuellement difficile ; « pour » garde une relation ouverte sans imposer une interprétation mystique précise.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions citationnelles (« il dit encore ») et la rudesse de certaines transitions ont été conservées, car elles structurent l’argument. Le marqueur parasite « ~y » du témoin anglais a été omis. Comme la révision directe du grec et du latin est signalée comme encore en attente, les formulations textuellement difficiles restent prudentes et ne sont pas harmonisées.
