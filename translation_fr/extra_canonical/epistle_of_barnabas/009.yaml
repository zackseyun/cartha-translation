  yaml_path: translation/extra_canonical/epistle_of_barnabas/009.yaml
  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
translation:
  language: fr
  text: 'De plus, au sujet des oreilles, il dit que c’est notre cœur qu’il a circoncis. Le Seigneur dit par le prophète : « Ils m’ont écouté de leurs oreilles. » Et il dit encore : « Ceux qui sont au loin entendront de leurs oreilles et comprendront ce que j’ai fait. » Et : « Soyez circoncis dans votre cœur », dit le Seigneur.


    Il dit encore : « Écoute, Israël, car voici ce que dit le Seigneur ton Dieu : Celui qui désire vivre éternellement, qu’il écoute de ses oreilles la voix de mon serviteur. » Et il dit encore : « Écoute, ciel, et prête l’oreille, terre, car le Seigneur a prononcé ces paroles en témoignage. » Et il dit encore : « Écoutez les paroles du Seigneur, vous qui gouvernez ce peuple. » Et il dit encore : « Écoutez, mes enfants, la voix de celui qui crie dans le désert. » Il a donc circoncis nos oreilles afin qu’en entendant la parole, nous croyions.


    Mais la circoncision dans laquelle ils mettent leur confiance a été abolie, car il a déclaré qu’il fallait pratiquer une circoncision qui ne soit pas celle de la chair. Pourtant, ils ont transgressé, parce qu’un ange mauvais leur a enseigné la ruse.


    Il leur dit : « Voici ce que dit le Seigneur votre Dieu » — tel est le commandement que je trouve — : « Ne semez pas parmi les épines ; soyez circoncis pour votre Seigneur. » Et que dit-il ? « Soyez circoncis dans la dureté de votre cœur ; alors vous ne raidirez plus votre nuque. » Prends encore ceci : « Voici, dit le Seigneur, toutes les nations sont incirconcises dans leur prépuce, mais ce peuple est incirconcis dans son cœur. »


    Mais tu diras : « En vérité, le peuple a reçu la circoncision comme un sceau. » Non, car tout Syrien et tout Arabe, ainsi que tous les prêtres des idoles, sont eux aussi circoncis. Tous ceux-là appartiennent-ils donc également à leur alliance ? De plus, les Égyptiens comptent eux aussi parmi les circoncis.


    Apprenez donc pleinement toutes ces choses, enfants de l’amour : Abraham, qui le premier institua la circoncision, contemplait d’avance Jésus en esprit lorsqu’il circoncit les siens, après avoir reçu les prescriptions de trois lettres.


    En effet, l’Écriture dit : « Abraham circoncit parmi les gens de sa maison dix-huit hommes et trois cents. » Quelle connaissance lui fut donc donnée ? Comprenez qu’elle mentionne d’abord les dix-huit, puis, séparément, les trois cents. Dans dix-huit, « I » vaut dix et « H » vaut huit : tu as ici JÉSUS — IHSOYS[a]. Et parce que la croix, représentée par le « T », devait apporter la grâce, elle mentionne aussi trois cents[b]. Ainsi, il révèle Jésus dans les deux premières lettres, et la croix dans la dernière.


    Celui qui a déposé en nous le don inné de son alliance le sait : personne n’a jamais reçu de moi une parole plus authentique. Mais je sais que vous en êtes dignes.'
