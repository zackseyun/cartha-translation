  yaml_path: translation/extra_canonical/epistle_of_barnabas/013.yaml
  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: fr
  text: 'Voyons maintenant si c’est ce peuple-ci ou le premier peuple qui possède l’héritage, et si l’alliance nous concernait, nous, ou bien eux.


    Écoutez donc ce que dit l’Écriture au sujet des peuples : « Isaac pria pour Rébecca, sa femme, car elle était stérile, et elle conçut. Puis Rébecca alla consulter le Seigneur. Le Seigneur lui dit : “Deux nations sont dans ton ventre et deux peuples dans ton sein. Un peuple l’emportera sur l’autre, et le plus grand servira le plus petit.” »[a]


    Vous devez comprendre qui est Isaac, qui est Rébecca, et à propos de qui Dieu a montré qu’un peuple est plus grand que l’autre.


    Dans une autre prophétie, Jacob parle plus clairement à son fils Joseph : « Voici, le Seigneur ne m’a pas privé de voir ton visage. Amène-moi tes fils, afin que je les bénisse. »[b]


    Joseph lui amena Éphraïm et Manassé. Il voulait que Manassé reçoive la bénédiction, parce qu’il était l’aîné ; il le plaça donc à la droite de son père Jacob. Mais Jacob vit, par l’Esprit, une figure du peuple qui devait venir par la suite. Et que dit l’Écriture ? « Jacob croisa les mains, posa sa main droite sur la tête d’Éphraïm, le second et le plus jeune, et le bénit. Joseph dit à Jacob : “Place ta main droite sur la tête de Manassé, car il est mon fils premier-né.” Jacob répondit à Joseph : “Je le sais, mon fils, je le sais. Mais le plus grand servira le plus petit. Celui-ci aussi, cependant, sera béni.” »[c]


    Remarquez donc à propos de qui Dieu a établi que ce peuple serait le premier et l’héritier de l’alliance.


    Et si, en plus de cela, Dieu l’a aussi consigné par l’intermédiaire d’Abraham, notre connaissance devient complète. Que lui dit-il donc, lorsque lui seul crut et que cela lui fut compté comme justice ? « Voici, moi, je t’ai établi, Abraham, père des nations qui croient en Dieu sans être circoncises. »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette citation reprend librement Genèse 25.21-23. Sa formulation est adaptée à l’argument de l’auteur et ne correspond pas mot pour mot à toutes les formes connues du texte biblique.
    reason: Signaler que l’auteur cite et reformule l’Écriture, notamment dans l’opposition entre les deux peuples.
  - marker: b
    text: 'Voir Genèse 48.8-9. « Ne m’a pas privé de voir ton visage » signifie : Dieu lui a permis de revoir Joseph.'
    reason: Éclairer un idiome qui resterait peu naturel ou ambigu pour certains lecteurs modernes.
  - marker: c
    text: 'Le récit combine Genèse 48.13-20 avec les paroles de Genèse 25.23 : « le plus grand servira le plus petit ». Dans Genèse 48, Jacob annonce directement la grandeur future d’Éphraïm et la bénédiction de Manassé.'
    reason: Rendre visible la manière interprétative dont l’auteur rapproche deux épisodes bibliques distincts.
  - marker: d
    text: Cette formulation associe Genèse 15.6 et 17.5, en explicitant que les nations croient sans être circoncises ; cette dernière précision appartient à l’interprétation de l’auteur.
    reason: Distinguer la citation biblique de son développement interprétatif et préserver la transparence textuelle.
lexical_decisions:
- source_word: this people / the first people
  choice: ce peuple-ci / le premier peuple
  rationale: Conserve l’opposition déictique et historique du témoin sans identifier explicitement les deux groupes à la place de l’auteur.
- source_word: inheritance
  choice: héritage
  rationale: Terme biblique naturel qui maintient à la fois l’idée de possession promise et sa portée théologique.
- source_word: shall vanquish / be greater than
  choice: l’emportera sur / est plus grand que
  rationale: « L’emporter sur » exprime une supériorité sans imposer nécessairement une conquête militaire ; la formulation ultérieure garde le vocabulaire comparatif du témoin.
- source_word: type
  choice: figure
  rationale: « Figure » est intelligible en français courant tout en conservant le sens typologique d’une réalité antérieure annonçant un peuple futur.
- source_word: in uncircumcision
  choice: sans être circoncises
  rationale: Rend naturellement l’état d’incirconcision appliqué aux nations, sans introduire une terminologie confessionnelle plus technique.
theological_decisions:
- issue: Identification de « ce peuple-ci » et du « premier peuple »
  choice: Ne pas ajouter d’identification explicite dans le corps du texte
  alternative: Écrire directement « les chrétiens » et « Israël »
  rationale: L’auteur développe lui-même son opposition ; une explicitation éditoriale résoudrait ce que le passage formule de manière rhétorique et risquerait d’accentuer une lecture polémique.
- issue: Sujet divin dans « il a montré / établi / consigné »
  choice: Employer « Dieu » lorsque le pronom français serait obscur
  alternative: Conserver partout un simple « il »
  rationale: Le français exige davantage de clarté référentielle. L’explicitation suit le contexte scripturaire sans attribuer l’action à un autre agent.
- issue: Portée typologique de Jacob et des deux fils
  choice: Conserver « une figure du peuple qui devait venir »
  alternative: Identifier précisément ce peuple dans la traduction
  rationale: La traduction garde l’interprétation de l’auteur tout en évitant d’ajouter une équivalence théologique absente de la formulation transmise.
- issue: Foi et justice d’Abraham
  choice: « cela lui fut compté comme justice »
  alternative: « il fut déclaré juste »
  rationale: Cette formulation conserve la métaphore comptable biblique et évite de trancher entre diverses constructions doctrinales de la justification.
translation_notes:
  register: Français international moderne, digne et lisible. Les périodes longues du témoin ont été légèrement segmentées, mais la progression argumentative et les répétitions rhétoriques ont été conservées. Les citations sont ponctuées comme discours rapporté. Puisque les données fournies indiquent que la vérification directe des témoins grecs et latins reste à faire, le draft demeure prudent face aux variantes potentielles et documente les citations composites en notes.
