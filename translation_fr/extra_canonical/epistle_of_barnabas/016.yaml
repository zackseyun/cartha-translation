  yaml_path: translation/extra_canonical/epistle_of_barnabas/016.yaml
  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: fr
  text: 'De plus, je vais aussi vous parler du temple : ces malheureux se sont égarés en mettant leur espérance dans l’édifice, au lieu de la mettre dans leur Dieu qui les a faits, comme si cet édifice était la maison de Dieu.


    En effet, presque à la manière des nations, ils l’ont enfermé dans le temple comme dans un sanctuaire.[a] Mais que dit le Seigneur en abolissant le temple ? Apprenez-le : « Qui a mesuré le ciel avec l’empan, ou la terre avec sa main ? N’est-ce pas moi ? dit le Seigneur. Le ciel est mon trône, et la terre le marchepied de mes pieds. Quelle maison me bâtirez-vous ? Quel sera le lieu de mon repos ? » Vous voyez que leur espérance est vaine.


    Il dit encore : « Voici : ceux-là mêmes qui ont détruit ce temple le rebâtiront. »


    Et c’est bien ce qui arrive : parce qu’ils sont partis en guerre, le temple a été détruit par leurs ennemis. Maintenant, même les serviteurs de leurs ennemis le rebâtiront.[b]


    Il avait encore été révélé que la ville, le temple et le peuple d’Israël seraient livrés. Car l’Écriture dit : « Dans les derniers jours, le Seigneur livrera à la destruction les brebis du pâturage, ainsi que leur enclos et leur tour. » Et cela s’est produit comme le Seigneur l’avait dit.


    Mais demandons-nous s’il existe un temple de Dieu. Oui, il en existe un, là où Dieu lui-même entreprend de le faire et de l’achever. Car il est écrit : « Lorsque la semaine arrivera à son terme, le temple de Dieu sera bâti avec gloire au nom du Seigneur. »[c]


    Je constate donc qu’il existe un temple. Comment sera-t-il bâti au nom du Seigneur ? Comprenez-le. Avant que nous croyions en Dieu, la demeure de notre cœur était corrompue et fragile : c’était véritablement un temple fait de main humaine. Elle était en effet remplie d’idolâtrie et servait de maison aux démons, puisque nous faisions tout ce qui est contraire à Dieu.


    Mais ce temple sera bâti au nom du Seigneur. Veillez donc à ce que le temple du Seigneur soit bâti avec gloire.


    Comment ? Comprenez-le. En recevant le pardon de nos péchés et en mettant notre espérance dans le Nom, nous sommes devenus nouveaux, recréés depuis le commencement. Ainsi, Dieu habite véritablement dans notre demeure, au-dedans de nous. Comment ? Par la parole de sa foi, l’appel lié à sa promesse, la sagesse de ses prescriptions et les commandements de son enseignement. Lui-même prophétise en nous, lui-même habite en nous ; il ouvre pour nous, qui étions esclaves de la mort, la porte du temple — c’est-à-dire la bouche — et, en nous donnant la repentance, il nous conduit dans le temple incorruptible.[d]


    En effet, celui qui désire être sauvé ne regarde pas l’être humain, mais celui qui habite et parle en lui. Il s’émerveille de n’avoir jamais entendu auparavant de telles paroles sortir de la bouche de celui qui parle, et de n’avoir lui-même jamais désiré les entendre. Voilà le temple spirituel bâti pour le Seigneur.'
