  footnotes:
  - marker: a
    text: Le sens exact de cette phrase est incertain dans la tradition du texte. Elle semble reprocher à ces hommes de traiter Dieu comme les nations traitaient leurs divinités, en le localisant ou en l’enfermant dans un sanctuaire.
    reason: Le témoin anglais « they consecrated Him in the temple » est ambigu et la révision directe du grec et du latin reste à effectuer.
  - marker: b
    text: Allusion probable à la reconstruction ou aux travaux accomplis sous l’autorité de puissances étrangères après la destruction du temple. L’identification historique précise n’est pas explicitée ici.
    reason: Évite de fixer une reconstruction particulière que le texte fourni ne nomme pas.
  - marker: c
    text: Les citations de cette section sont parfois données sous une forme qui ne correspond pas mot pour mot aux textes bibliques aujourd’hui reçus; certaines peuvent provenir de traditions scripturaires ou testimoniales anciennes.
    reason: La provenance et la forme exacte de cette citation ne peuvent être établies avec certitude à partir du seul témoin anglais fourni.
  - marker: d
    text: La syntaxe de cette longue phrase permet plusieurs regroupements. La traduction comprend les éléments précédents comme les manières dont Dieu habite en nous, puis fait de Dieu le sujet de « prophétise », « habite », « ouvre » et « conduit ».
    reason: Préserve et documente une ambiguïté syntaxique et théologique réelle du passage.
lexical_decisions:
- source_word: temple / ναός
  choice: temple
  rationale: Conserve le fil directeur architectural et spirituel du chapitre, ainsi que le lien avec les citations scripturaires.
- source_word: the building
  choice: l’édifice
  rationale: Distingue le bâtiment matériel du « temple » au sens théologique sans alourdir le français.
- source_word: consecrated Him in the temple
  choice: ils l’ont enfermé dans le temple comme dans un sanctuaire
  rationale: Le témoin anglais est difficile; cette formulation rend l’idée probable d’une limitation de Dieu au sanctuaire tout en signalant l’incertitude en note.
- source_word: the Name
  choice: le Nom
  rationale: La majuscule conserve l’usage religieux où le Nom représente Dieu ou le Seigneur sans préciser davantage le référent.
- source_word: repentance
  choice: repentance
  rationale: Terme français actuel dans le registre biblique, exprimant un changement intérieur et un retour à Dieu.
- source_word: incorruptible
  choice: incorruptible
  rationale: Maintient le contraste théologique entre le temple matériel destructible et le temple spirituel qui ne connaît pas la corruption.
theological_decisions:
- issue: Critique du temple et de ceux qui y mettent leur espérance
  choice: Conserver la critique telle qu’elle se présente dans l’œuvre, sans identifier davantage « ces malheureux ».
  alternative: Expliciter qu’il s’agit des Juifs ou harmoniser le propos avec une théologie ultérieure du temple.
  rationale: Le passage est polémique, mais la traduction ne doit ni amplifier sa cible ni atténuer artificiellement sa tension.
- issue: Identité du temple véritable
  choice: Rendre le temple comme la demeure intérieure et communautaire de Dieu, conformément au développement du texte, sans trancher entre individu et communauté.
  alternative: Limiter le temple au cœur individuel ou l’identifier exclusivement à l’Église.
  rationale: Les pluriels, le singulier collectif et l’image de la demeure intérieure permettent une portée à la fois personnelle et collective.
- issue: Sujet de la prophétie et de l’habitation intérieures
  choice: « Lui-même » renvoie à Dieu, conformément au contexte immédiat.
  alternative: Identifier explicitement le sujet au Christ ou au Saint-Esprit.
  rationale: Le texte fourni ne nomme pas plus précisément le sujet; une identification christologique ou pneumatologique explicite résoudrait indûment l’ambiguïté.
- issue: Fonction de la repentance dans l’accès au temple incorruptible
  choice: 'Conserver la séquence : Dieu donne la repentance et conduit au temple incorruptible.'
  alternative: Reformuler selon un ordre sotériologique confessionnel précis.
  rationale: La traduction maintient la causalité et la tension propres au passage sans importer de système doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. Les citations gardent une cadence biblique sans archaïsmes tels que « voici que », « demeurera » ou des inversions recherchées. Le tutoiement collectif est rendu par « vous ». La traduction reste provisoire sur les points dépendant d’un contrôle direct des témoins grecs et latins.
