source:
  text: 'Understand therefore, children of gladness, that the good Lord manifested all things to us beforehand, that we might know to whom we ought in all things to render thanksgiving and praise.


    If then the Son of God, being Lord and future Judge of quick and dead, suffered that His wound might give us life, let us believe that the Son of God could not suffer except for our sakes.


    But moreover when crucified He had vinegar and gall given Him to drink. Hear how on this matter the priests of the temple have revealed. Seeing that there is a commandment in scripture, Whatsoever shall not observe the fast shall surely die, the Lord commanded, because He was in His own person about to offer the vessel of His Spirit a sacrifice for our sins, that the type also which was given in Isaac who was offered upon the alter should be fulfilled.


    What then saith He in the prophet? And let them eat of the goat that is offered at the fast for all their sins. Attend carefully; And let all the priests alone eat the entrails unwashed with vinegar.


    Wherefore? Since ye are to give Me, who am to offer My flesh for the sins of My new people, gall with vinegar to drink, eat ye alone, while the people fasteth and waileth in sackcloth and ashes; that He might shew that He must suffer at their hands.


    Attend ye to the commandments which He gave. Take two goats, fair and alike, and offer them, and let the priest take the one for a whole burnt offering for sins.


    But the other one--what must they do with it? Accursed, saith He, is the one. Give heed how the type of Jesus is revealed.


    And do ye all spit upon it and goad it, and place scarlet wool about its head, and so let it be cast into the wilderness. And when it is so done, he that taketh the goat into the wilderness leadeth it, and taketh off the wool, and putteth it upon the branch which is called Rachia, the same whereof we are wont to eat the shoots when we find them in the country. Of this briar alone is the fruit thus sweet.


    What then meaneth this? Give heed. The one at the alter, and the other accursed. And moreover the accursed one crowned. For they shall see Him in that day wearing the long scarlet robe about His flesh, and shall say, Is not this He, Whom once we crucified and set at nought and spat upon; verily this was He, Who then said that He was the Son of God.


    For how is He like the goat? For this reason it says the goats shall be fair and alike, that, when they shall see Him coming then, they may be astonished at the likeness of the goat. Therefore behold the type of Jesus that was to suffer.


    But what meaneth it, that they place the wool in the midst of the thorns? It is a type of Jesus set forth for the Church, since whosoever should desire to take away the scarlet wool it behoved him to suffer many things owing to the terrible nature of the thorn, and through affliction to win the mastery over it. Thus, He saith, they that desire to see Me, and to attain unto My kingdom, must lay hold on Me through tribulation and affliction.'
