  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: fr
  text: '**Barnabé 7**


    Comprenez donc, enfants de joie, que le bon Seigneur nous a tout révélé d’avance, afin que nous sachions à qui nous devons rendre grâce et adresser nos louanges en toute chose.


    Si donc le Fils de Dieu, qui est Seigneur et qui viendra juger les vivants et les morts, a souffert afin que sa blessure nous donne la vie, croyons que le Fils de Dieu n’a pu souffrir que pour nous.


    De plus, lorsqu’il fut crucifié, on lui donna à boire du vinaigre mêlé de fiel. Écoutez comment les prêtres du Temple ont annoncé cela à l’avance. Il existe dans l’Écriture ce commandement : « Quiconque n’observera pas le jeûne mourra certainement. » Le Seigneur donna ses instructions parce qu’il allait lui-même offrir en sacrifice, pour nos péchés, le réceptacle de son Esprit. Ainsi devait également s’accomplir la figure donnée en Isaac, qui fut offert sur l’autel.


    Que dit-il donc par le prophète ? « Qu’ils mangent du bouc offert pendant le jeûne pour tous leurs péchés. » Soyez très attentifs : « Que les prêtres seuls mangent toutes les entrailles, sans les laver, avec du vinaigre. »[a]


    Pourquoi ? « Puisque vous allez me donner à boire du fiel mêlé de vinaigre, à moi qui vais offrir ma chair pour les péchés de mon peuple nouveau, vous seuls, mangez, tandis que le peuple jeûne et se lamente, vêtu de sacs et couvert de cendre. » C’était pour montrer qu’il devait souffrir de leur part.


    Soyez attentifs aux commandements qu’il donna : « Prenez deux boucs, beaux et semblables, et présentez-les en offrande. Que le prêtre prenne l’un d’eux et l’offre entièrement par le feu pour les péchés. »


    Mais l’autre, que doivent-ils en faire ? « Celui-là est maudit », dit-il. Remarquez comment la figure de Jésus est révélée.


    « Vous tous, crachez sur lui, piquez-le, entourez sa tête de laine écarlate, puis qu’il soit chassé dans le désert. » Cela fait, celui qui conduit le bouc dans le désert l’emmène, retire la laine et la place sur une branche de la plante appelée Rachia[b], celle-là même dont nous avons l’habitude de manger les jeunes pousses lorsque nous en trouvons dans la campagne. Seul le fruit de ce buisson épineux est aussi doux.


    Que signifie donc tout cela ? Soyez attentifs. L’un est placé sur l’autel et l’autre est maudit ; de plus, celui qui est maudit est couronné. En effet, ils le verront en ce jour-là, portant sur sa chair le long vêtement écarlate, et ils diront : « N’est-ce pas celui que nous avons autrefois crucifié, méprisé et couvert de crachats ? Oui, c’était bien celui qui affirmait alors être le Fils de Dieu. »


    Mais en quoi ressemble-t-il au bouc ? C’est pour cette raison qu’il est dit que les boucs doivent être beaux et semblables : lorsqu’ils le verront venir en ce temps-là, ils seront frappés de sa ressemblance avec le bouc. Voyez donc la figure de Jésus qui devait souffrir.


    Mais que signifie le fait de placer la laine au milieu des épines ? C’est une figure de Jésus présentée à l’Église : quiconque voulait retirer la laine écarlate devait beaucoup souffrir à cause des épines redoutables et s’en rendre maître au prix de l’affliction. Ainsi dit-il : « Ceux qui désirent me voir et parvenir à mon royaume doivent me saisir à travers la détresse et l’affliction. »


    [a] La construction transmise peut aussi être comprise comme « les entrailles non lavées avec du vinaigre » ; la portée exacte de l’expression demeure incertaine.


    [b] Nom de plante transmis sous diverses formes dans les témoins et les traductions anciennes ; son identification botanique est incertaine.'
