  terminology: Les choix « figure », « réceptacle de son Esprit », « fiel », « boucs », « autel » et « Église » sont cohérents avec le témoin et ne surinterprètent pas l’argument de l’auteur. « Rachia » est correctement conservé avec une note de prudence.
