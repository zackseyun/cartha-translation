lexical_decisions:
- source_word: τέκνα εὐφροσύνης (formulation grecque attestée dans la tradition)
  choice: enfants de joie
  rationale: Conserve l’adresse imagée et affectueuse sans l’alourdir par « allégresse », moins courant.
- source_word: τύπος
  choice: figure
  rationale: « Figure » rend le rapport typologique revendiqué par l’auteur sans réduire le passage à un simple symbole arbitraire.
- source_word: σκεῦος τοῦ πνεύματος
  choice: le réceptacle de son Esprit
  rationale: Préserve l’image concrète du contenant et l’ambiguïté anthropologique du texte, au lieu de remplacer directement l’expression par « son corps ».
- source_word: ὄξος / χολή (selon la tradition grecque du passage)
  choice: vinaigre / fiel
  rationale: 'Maintient les termes bibliques traditionnels tout en donnant une syntaxe française actuelle : « du vinaigre mêlé de fiel ».'
- source_word: καλοί / ἴσοι ou formulation correspondante des témoins
  choice: beaux et semblables
  rationale: « Beaux » conserve la qualité positive du premier adjectif ; « semblables » exprime l’identité d’apparence pertinente pour l’interprétation qui suit.
- source_word: Rachia / forme apparentée transmise pour le nom de la plante
  choice: Rachia
  rationale: Le nom propre est conservé, car l’identification botanique et la forme textuelle sont incertaines.
theological_decisions:
- issue: La souffrance du Fils « pour nous »
  choice: « n’a pu souffrir que pour nous »
  alternative: « n’aurait pas souffert s’il ne l’avait fait pour nous »
  rationale: Conserve l’affirmation forte et la tension théologique du témoin sans développer une théorie particulière de l’expiation.
- issue: Le corps comme « réceptacle de son Esprit »
  choice: Maintien littéral de l’image
  alternative: « offrir son corps »
  rationale: Évite de résoudre une formulation anthropologique ancienne susceptible de plusieurs lectures.
- issue: « Mon peuple nouveau »
  choice: Maintien de l’expression de l’auteur
  alternative: « la nouvelle alliance » ou « l’Église »
  rationale: Ne remplace pas le vocabulaire propre du passage par une catégorie confessionnelle ou systématique.
- issue: Identification typologique des deux boucs à Jésus
  choice: « figure de Jésus »
  alternative: « prophétie concernant Jésus »
  rationale: Respecte la logique typologique explicite de l’auteur sans transformer ces instructions rituelles en prédiction verbale directe.
- issue: Responsabilité exprimée par « de leur part »
  choice: Conserver le pronom collectif dans son contexte littéraire
  alternative: Identifier explicitement un peuple ou une communauté historique
  rationale: Le référent polémique appartient au raisonnement de l’auteur ; l’expliciter davantage risquerait d’étendre ou de durcir l’accusation.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs répétés (« Comprenez », « Écoutez », « Soyez attentifs », « Voyez ») conservent le ton d’exhortation. Les citations ont été ponctuées pour rendre l’argument lisible, sans prétendre qu’elles reproduisent toujours mot pour mot un passage identifiable de l’Ancien Testament. Comme le dossier fourni indique qu’une vérification directe du grec et du latin reste à faire, cette version demeure prudente dans les endroits textuellement difficiles, notamment la phrase sur les entrailles et le nom Rachia.
