base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: fr
  text: 'Mais, selon vous, que signifie cette figure ? Il est ordonné à Israël que des hommes dont les péchés sont arrivés à leur comble offrent une génisse, l’égorgent et la brûlent ; puis que les enfants recueillent les cendres, les mettent dans des récipients, attachent la laine écarlate à un arbre — voyez, ici encore, la figure de la croix et la laine écarlate — ainsi que l’hysope ; enfin, après cela, que les enfants aspergent les membres du peuple un par un, afin qu’ils soient purifiés de leurs péchés.


    Comprenez avec quelle clarté il s’adresse à vous : le veau, c’est Jésus[a] ; les hommes qui le présentent, étant pécheurs, sont ceux qui l’ont offert pour être égorgé. Après cela, ce ne sont plus des hommes qui offrent ; la gloire n’est plus pour les pécheurs[b].


    Les enfants qui font l’aspersion sont ceux qui nous ont annoncé le pardon des péchés et la purification de notre cœur. Ils étaient douze, en témoignage des tribus — car Israël compte douze tribus —, et il leur a confié l’autorité relative à l’Évangile, afin qu’ils le proclament.


    Mais pourquoi les enfants qui font l’aspersion sont-ils au nombre de trois[c] ? En témoignage d’Abraham, d’Isaac et de Jacob, car ils sont puissants devant Dieu.


    Il y a ensuite la laine placée sur l’arbre. Cela signifie que le royaume de Jésus est sur la croix et que ceux qui mettent leur espérance en lui vivront pour toujours.


    Et pourquoi la laine et l’hysope sont-elles réunies ? Parce que, dans son royaume, il y aura des jours mauvais et souillés au cours desquels nous serons sauvés ; en effet, celui qui souffre dans sa chair est guéri par la souillure de l’hysope[d].


    Pour nous, il est manifeste que ces choses se sont produites ainsi pour cette raison ; mais pour eux, elles demeuraient obscures, parce qu’ils n’ont pas entendu la voix du Seigneur.'
