    reason: Signaler une difficulté textuelle et sémantique réelle.
lexical_decisions:
- source_word: heifer / calf (English witness; source-language review pending)
  choice: génisse / veau
  rationale: 'La variation interne du témoin fourni est conservée plutôt qu’harmonisée : l’animal rituel est d’abord une « génisse », puis son interprétation typologique l’appelle « le veau ».'
- source_word: type
  choice: figure
  rationale: « Figure » exprime naturellement en français la correspondance typologique ancienne sans imposer le terme technique « type » au lecteur ordinaire.
- source_word: tree
  choice: arbre
  rationale: Le mot est maintenu dans l’image rituelle et dans son interprétation, sans le remplacer directement par « bois » ou « croix » ; l’auteur établit lui-même le lien avec la croix.
- source_word: children
  choice: enfants
  rationale: La désignation inhabituelle du témoin est conservée, notamment parce que l’auteur leur attribue successivement les nombres de douze et de trois.
- source_word: foulness
  choice: souillure
  rationale: Le caractère déroutant de l’expression est préservé ; une reformulation comme « vertu purificatrice » supprimerait la tension du texte.
- source_word: authority over the Gospel
  choice: l’autorité relative à l’Évangile
  rationale: Cette formulation garde ouverte la relation exacte entre l’autorité et l’Évangile, que le témoin anglais ne permet pas d’établir avec certitude.
theological_decisions:
- issue: Le royaume de Jésus « est sur la croix »
  choice: Conserver l’énoncé littéral et sa tension théologique
  alternative: « La royauté de Jésus repose sur la croix » ou « se manifeste par la croix »
  rationale: Le témoin présente une formulation forte et inhabituelle ; l’expliciter comme manifestation ou fondement trancherait une ambiguïté que la traduction doit préserver.
- issue: Identification de la génisse ou du veau à Jésus
  choice: Traduire directement « le veau, c’est Jésus »
  alternative: Atténuer en « le veau représente Jésus »
  rationale: L’auteur formule l’identification de manière directe dans son interprétation typologique ; la traduction garde cette force rhétorique.
- issue: Douze puis trois enfants chargés de l’aspersion
  choice: Conserver les deux nombres sans harmonisation
  alternative: Comprendre les trois comme un sous-groupe des douze ou corriger l’un des nombres
  rationale: Le texte fourni ne donne aucune justification permettant d’harmoniser ces références ; leur tension appartient donc au texte transmis.
- issue: « La gloire n’est plus pour les pécheurs »
  choice: Maintenir la proposition sans préciser qui reçoit désormais la gloire
  alternative: L’attribuer explicitement à Jésus, aux prédicateurs ou à Dieu
  rationale: Le passage est elliptique et son référent n’est pas assuré dans le témoin fourni.
translation_notes:
  register: 'Français international moderne, digne et lisible, avec des périodes allégées sans effacer la structure argumentative. Le vouvoiement collectif est rendu par des tournures naturelles (« selon vous », « comprenez »). Draft provisoire fondé sur le témoin anglais public fourni : aucune transcription grecque ou latine n’ayant été fournie et la révision directe des témoins étant indiquée comme encore à venir, les décisions lexicales les plus incertaines sont formulées avec réserve et les obscurités ne sont pas résolues silencieusement.'
