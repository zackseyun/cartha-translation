source:
  text: 'It is good therefore to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For he that doeth these things shall be glorified in the kingdom of God; whereas he that chooseth their opposites shall perish together with his works. For this cause is the resurrection, for this the recompense.


    I entreat those of you who are in a higher station, if ye will receive any counsel of good advice from me, keep amongst you those to whom ye may do good. Fail not.


    The day is at hand, in which everything shall be destroyed together with the Evil One. The Lord is at hand and his reward.


    Again and again I entreat you; be good lawgivers one to another; continue faithful councilors to yourselves; take away from you all hypocrisy.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of His ordinances, patience.


    And be ye taught of God, seeking diligently what the Lord requireth of you, and act that ye may be found in the day of judgment.


    But if you have any remembrance of good, call me to mind when ye practice these things these things, that both my desire and my watchfulness may lead to some good result. I entreat you asking it as a favor.


    So long as the good vessel (of the body) is with you, be lacking in none of these things, but search them out constantly, and fulfill every commandment; for they deserve it.


    For this reason I was the more eager to write to you so far as I was able, that I might give you joy. Fare ye well, children of love and peace. The Lord of glory and of every grace be with your spirit.'
