base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: fr
  text: 'Il est donc bon d’apprendre les prescriptions du Seigneur, toutes celles qui ont été écrites plus haut, et de marcher selon elles. Car celui qui les met en pratique sera glorifié dans le royaume de Dieu, tandis que celui qui choisit ce qui leur est contraire périra avec ses œuvres. Voilà pourquoi il y a la résurrection, voilà pourquoi il y a la rétribution.


    Je vous en prie, vous qui occupez une position élevée : si vous voulez bien recevoir de moi un conseil donné avec bienveillance, gardez parmi vous ceux à qui vous pouvez faire du bien. N’y manquez pas.


    Le jour est proche où tout sera détruit avec le Mauvais. Le Seigneur est proche, ainsi que sa récompense.


    Encore et encore, je vous en prie : soyez les uns pour les autres de bons législateurs ; restez pour vous-mêmes des conseillers fidèles ; ôtez du milieu de vous toute hypocrisie.


    Que Dieu, le Seigneur du monde entier, vous donne la sagesse, le discernement, l’instruction, la connaissance de ses prescriptions et la patience.


    Laissez-vous instruire par Dieu, en recherchant avec soin ce que le Seigneur exige de vous, et agissez de manière à être trouvés prêts au jour du jugement.[a]


    Mais si vous gardez quelque souvenir du bien, souvenez-vous de moi lorsque vous mettrez ces choses en pratique, afin que mon désir et ma vigilance produisent quelque bon résultat. Je vous en prie, accordez-moi cette faveur.[b]


    Tant que le bon vase[c] est avec vous, ne négligez aucune de ces choses ; au contraire, examinez-les constamment et accomplissez chaque commandement, car elles en sont dignes.[d]


    Voilà pourquoi je me suis empressé davantage de vous écrire, dans la mesure de mes possibilités, afin de vous réjouir. Portez-vous bien, enfants de l’amour et de la paix. Que le Seigneur de gloire et de toute grâce soit avec votre esprit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que vous soyez trouvés au jour du jugement » ; l’idée d’être « prêts » est implicite dans le contexte.'
    reason: Signaler l’explicitation nécessaire à la fluidité française sans la présenter comme un élément certain du texte source.
  - marker: b
    text: Le témoin anglais répète ici « ces choses » deux fois, répétition probablement accidentelle qui n’est pas reproduite dans le texte principal.
    reason: Documenter une anomalie du témoin de travail, la révision directe sur le grec et le latin restant à faire.
  - marker: c
    text: Le « bon vase » désigne vraisemblablement le corps vivant.
    reason: Expliquer une métaphore ancienne sans la remplacer dans le texte.
  - marker: d
    text: Le référent de « elles » peut être les prescriptions ou les choses évoquées ; le sens général est qu’elles méritent d’être recherchées et accomplies.
    reason: Préserver une ambiguïté référentielle du témoin au lieu de la résoudre arbitrairement.
lexical_decisions:
- source_word: ordinances
  choice: prescriptions
  rationale: « Prescriptions » exprime des directives normatives sans imposer le sens plus étroit de « lois » ou le registre administratif moderne d’« ordonnances ».
- source_word: walk in them
  choice: marcher selon elles
  rationale: Conserve l’image biblique de la marche comme conduite de vie tout en restant intelligible en français moderne.
- source_word: recompense / reward
  choice: rétribution / récompense
  rationale: 'La distinction lexicale du témoin est maintenue : « rétribution » dans l’énoncé doctrinal, « récompense » dans l’annonce de la proximité du Seigneur.'
- source_word: Evil One
  choice: le Mauvais
  rationale: Rend la désignation personnelle du mal sans ajouter explicitement « diable » ou « Satan », que le témoin ne donne pas ici.
- source_word: judgment
  choice: discernement
  rationale: Dans la série de dons, « discernement » évite la confusion avec le jugement final mentionné ensuite et exprime la faculté d’évaluer justement.
- source_word: good vessel
  choice: bon vase
  rationale: Préserve la métaphore corporelle ancienne au lieu de l’aplanir en « corps » ; une note en indique le sens probable.
- source_word: Fare ye well
  choice: Portez-vous bien
  rationale: Formule d’adieu naturelle et digne, moins archaïque que « Adieu » et plus sémantiquement proche de l’exhortation au bien-être.
theological_decisions:
- issue: Rapport entre les œuvres, la glorification et la perdition
  choice: Conserver l’enchaînement direct entre pratique, glorification et perdition avec les œuvres
  alternative: Atténuer le lien par une paraphrase centrée sur la preuve de la foi
  rationale: Le passage formule volontairement une tension exhortative forte ; la traduction ne doit pas y importer une harmonisation doctrinale.
- issue: Sens de « found » au jour du jugement
  choice: « être trouvés prêts » avec note sur le caractère implicite de « prêts »
  alternative: « être trouvés » sans complément ou « être reconnus justes »
  rationale: Le français exige difficilement l’emploi absolu ici. « Prêts » explicite minimalement le contexte sans introduire une déclaration forensique absente du témoin.
- issue: Identité du « Mauvais »
  choice: Maintenir le titre « le Mauvais »
  alternative: « le diable » ou « Satan »
  rationale: La personnification est conservée, mais son identification n’est pas précisée au-delà de ce qu’indique la source disponible.
- issue: Référence du « bon vase »
  choice: Conserver la métaphore et signaler son interprétation corporelle en note
  alternative: Traduire directement « tant que vous êtes dans votre corps »
  rationale: Cela préserve l’image et l’ambiguïté formelle, tout en donnant au lecteur l’explication transmise par le témoin.
- issue: Pronom final « votre esprit »
  choice: Conserver le singulier collectif « votre esprit »
  alternative: « vos esprits »
  rationale: Le singulier du témoin peut désigner la vie spirituelle commune de la communauté ; il ne convient pas de le pluraliser silencieusement.
translation_notes:
  register: Français international moderne, exhortatif et digne. Les images bibliques (« marcher », « vase ») sont conservées lorsqu’elles portent le style du passage. Les tournures archaïques du témoin anglais sont modernisées. Ce projet reste provisoire, car les données fournies indiquent qu’une vérification directe des témoins grecs et latins est encore en attente.
