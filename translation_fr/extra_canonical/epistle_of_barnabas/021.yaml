review_pass:
  verdict: revise
  source_fidelity: Le projet suit globalement le témoin fourni et conserve avec justesse les images et l’exhortation morale. Quelques rendus introduisent toutefois des précisions non exprimées (« prêts »), ou atténuent/déplacent le sens verbal (« négligez » pour « manquer de »; « examinez » pour « recherchez »). La répétition « ces choses, ces choses » du témoin anglais n’est pas reproduite dans le texte révisé, mais elle est signalée, car elle paraît être une duplication de transmission et une vérification directe des témoins grecs et latins demeure souhaitable.
  naturalness: Le français est digne et généralement naturel. Les corrections proposées évitent notamment « je me suis empressé davantage », tournure peu idiomatique, et rendent plus nettement les impératifs successifs. La formulation absolue « afin d’être trouvés au jour du jugement » est inhabituelle en français courant, mais elle préserve délibérément l’ellipse du texte au lieu de la résoudre théologiquement.
  terminology: « Prescriptions », « marcher selon elles », « le Mauvais », « rétribution », « discernement » et le singulier collectif « votre esprit » conviennent. « Bon vase » est maintenu comme métaphore ancienne, avec une note explicative. « Récompense » est conservé pour le second terme, conformément au témoin.
  issues:
  - severity: medium
    issue: Ajout de « prêts » au jour du jugement
    rationale: Le texte fourni dit seulement que les destinataires soient « trouvés » au jour du jugement. « Prêts » interprète l’ellipse et doit être retiré pour ne pas ajouter une qualification absente.
  - severity: medium
    issue: Rendu de l’exhortation relative au « bon vase »
    rationale: « Ne négligez aucune » ne correspond pas exactement à « ne manquez d’aucune »; « examinez-les » affaiblit également l’idée de recherche soutenue. Le texte est révisé en conséquence.
  - severity: low
    issue: Formulation française de l’effort épistolaire
    rationale: « Je me suis empressé davantage » est peu naturel. « Je me suis appliqué d’autant plus à vous écrire » conserve l’intensification et reste idiomatique.
  - severity: low
    issue: Répétition du témoin anglais « ces choses, ces choses »
    rationale: La répétition est absente du texte français, mais une note conserve la trace de cette anomalie du témoin de travail; elle ne doit pas être silencieusement traitée comme un élément assuré du texte ancien.
  revised_text: 'Il est donc bon d’apprendre les prescriptions du Seigneur, toutes celles qui ont été écrites plus haut, et de marcher selon elles. Car celui qui fait ces choses sera glorifié dans le royaume de Dieu, tandis que celui qui choisit ce qui leur est contraire périra avec ses œuvres. C’est pour cela qu’il y a la résurrection ; c’est pour cela qu’il y a la rétribution.


    Je vous exhorte, vous qui occupez une position élevée : si vous voulez recevoir de moi quelque bon conseil, ayez parmi vous des personnes auxquelles vous pouvez faire du bien. N’y manquez pas.


    Le jour est proche : en ce jour-là, tout périra avec le Mauvais. Le Seigneur est proche, ainsi que sa récompense.


    Encore et encore, je vous exhorte : soyez les uns pour les autres de bons législateurs ; demeurez pour vous-mêmes des conseillers fidèles ; ôtez de vous toute hypocrisie.


    Que Dieu, le Seigneur du monde entier, vous donne la sagesse, le discernement, l’instruction, la connaissance de ses prescriptions et la patience.


    Soyez instruits par Dieu ; recherchez avec soin ce que le Seigneur exige de vous, et faites-le afin d’être trouvés au jour du jugement.


    Mais si vous gardez quelque souvenir du bien, souvenez-vous de moi lorsque vous pratiquez ces choses, afin que mon désir et ma vigilance aboutissent à quelque bon résultat. Je vous en prie, accordez-moi cette faveur.[a]


    Tant que le bon vase[b] est avec vous, ne manquez d’aucune de ces choses ; recherchez-les sans cesse et accomplissez tout commandement, car elles en sont dignes.


    C’est pourquoi je me suis appliqué d’autant plus à vous écrire, dans la mesure de mes possibilités, afin de vous réjouir. Portez-vous bien, enfants de l’amour et de la paix. Que le Seigneur de gloire et de toute grâce soit avec votre esprit.'
  revised_footnotes:
  - marker: a
    text: Le témoin anglais répète ici « ces choses » deux fois. Cette répétition n’est pas reproduite dans le texte principal, car elle paraît être une duplication accidentelle ; une vérification directe des témoins grecs et latins reste souhaitable.
    reason: Documenter fidèlement l’anomalie du témoin de travail sans lui attribuer indûment une valeur textuelle assurée.
  - marker: b
    text: Le « bon vase » est une métaphore du corps vivant ; le témoin anglais l’explicite par la parenthèse « of the body ».
    reason: Éclairer l’image ancienne sans la remplacer dans le texte principal.
  revision_rationale: La révision retire l’explicitation interprétative « prêts », rétablit les nuances d’exhortation relatives à la recherche et à l’accomplissement des commandements, et améliore plusieurs formulations françaises. Elle conserve les ambiguïtés du passage, notamment la formule « être trouvés » au jugement et la métaphore du « bon vase ».
