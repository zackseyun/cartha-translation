  yaml_path: translation/extra_canonical/epistle_of_barnabas/006.yaml
  text: 'When, then, he gave the commandment, what does he say? “Who is it who disputes with me? Let him oppose me. Or who is it who goes to court with me? Let him draw near to the servant of the Lord.


    Woe to you, for you will all grow old like a garment, and the moth will consume you.” And again the prophet says, since he was appointed like a hard stone for crushing: “Behold, I will place in the fountains of Zion a very precious, chosen, honored chief cornerstone.”


    Then again, what does he say? “And whoever sets his hope on him will live forever.” Is our hope, then, set on a stone? Far from it! Rather, it is because the Lord has established his flesh in strength. For he says, “And he set me like a hard rock.”


    And the prophet says again, “The stone that the builders rejected has become the head and the corner.” And again he says, “This is the great and wonderful day that the Lord made.”


    I am writing to you more simply so that you may understand—I who am the scum of your love.


    What, then, does the prophet say again? “The assembly of evildoers gathered around me; they surrounded me as bees surround a honeycomb”; and, “They cast lots for my garment.”


    Since, then, he was about to be revealed in the flesh and to suffer, his suffering was revealed beforehand. For the prophet says concerning Israel, “Woe to their soul, for they have devised an evil plan against themselves, saying, ‘Let us bind the righteous one, for he is of no use to us.’”


    What does the other prophet, Moses, say to them? “Behold, this is what the Lord God says: Enter the good land that the Lord swore to Abraham, Isaac, and Jacob, and inherit it—a land flowing with milk and honey.”


    But what does knowledge say? Understand: Set your hope on him who is about to be revealed to you in the flesh, namely Jesus. For a human is suffering earth, since Adam’s creation came from the face of the earth.


    What, then, does he say? “Into the good land, a land flowing with milk and honey.” Blessed is our Lord, brothers, who established among us wisdom and understanding of his secret things. For the prophet speaks a parable concerning the Lord. Who will understand it except one who is wise and prudent and loves his Lord?


    Since, then, he renewed us through the forgiveness of sins, he made us into a new type, so that we would have the soul of children, as though he were creating us again.


    For Scripture speaks concerning us when he says to the Son, “Let us make humanity according to our image and according to our likeness, and let them rule over the beasts of the earth, the birds of heaven, and the fish of the sea.” And when the Lord saw the beautiful creation of us humans, he said, “Increase and multiply and fill the earth.” These words refer to the Son.


    Again I will show you how the Lord speaks concerning us. He made a second creation at the end, and the Lord says, “Behold, I make the last things like the first.” Referring to this, then, the prophet proclaimed, “Enter a land flowing with milk and honey, and be lords over it.”


    Behold, then, we have been created anew, as he says again in another prophet: “Behold, says the Lord, I will take from these”—that is, from those whom the Spirit of the Lord foresaw—“their stony hearts, and I will put hearts of flesh into them,” for he himself was to be revealed in the flesh and to dwell in us.


    For the dwelling place of our heart is a holy temple to the Lord, my brothers.


    For the Lord says again, “With what shall I appear before the Lord my God and be glorified? I will confess you in the assembly of my brothers, and I will sing to you in the midst of the assembly of the saints.” We, therefore, are those whom he brought into the good land.


    What, then, are the milk and the honey? The child is first kept alive by honey and then by milk. In the same way, we also, being kept alive by our faith in the promise and by the word, will live and be lords of the earth.


    Now we have already said above, “And let them increase and multiply and rule over the fish.” But who is able [now] to rule over beasts, fish, and birds of heaven? For we ought to understand that ruling implies power, so that one gives orders and exercises dominion.


    If, then, this does not happen now, surely he spoke to us about the hereafter, when we ourselves will be made perfect so that we may become heirs of the Lord’s covenant.'
translation:
  language: fr
  text: 'Lors donc qu’il donna le commandement, que dit-il ? « Qui est celui qui conteste avec moi ? Qu’il s’oppose à moi ! Ou qui est celui qui me poursuit en justice ? Qu’il s’approche du serviteur du Seigneur.


    Malheur à vous, car vous vieillirez tous comme un vêtement, et la teigne vous dévorera. » Et le prophète dit encore, puisqu’il a été établi comme une pierre dure destinée à broyer : « Voici, je poserai dans les sources de Sion[a] une pierre très précieuse, choisie, honorée, pierre principale de l’angle. »


    Puis, que dit-il encore ? « Quiconque mettra son espérance en lui vivra éternellement. » Notre espérance repose-t-elle donc sur une pierre ? Certainement pas ! C’est plutôt parce que le Seigneur a établi sa chair dans la puissance. Car il dit : « Il m’a établi comme un roc dur. »


    Et le prophète dit encore : « La pierre qu’ont rejetée les bâtisseurs est devenue la tête de l’angle. » Et il dit encore : « Voici le jour grand et merveilleux que le Seigneur a fait. »


    Je vous écris avec plus de simplicité afin que vous compreniez, moi qui suis le rebut de votre amour[b].


    Que dit encore le prophète ? « L’assemblée des malfaiteurs s’est réunie autour de moi ; ils m’ont entouré comme les abeilles entourent un rayon de miel » ; et : « Ils ont tiré au sort mon vêtement. »


    Puisqu’il devait être manifesté dans la chair et souffrir, sa souffrance fut révélée d’avance. En effet, le prophète dit au sujet d’Israël : « Malheur à leur âme ! Car ils ont conçu contre eux-mêmes un projet mauvais, disant : “Attachons le juste, car il ne nous est d’aucune utilité.” »


    Et que leur dit l’autre prophète, Moïse ? « Voici ce que dit le Seigneur Dieu : Entrez dans le bon pays que le Seigneur a promis par serment à Abraham, Isaac et Jacob, et recevez-le en héritage, ce pays ruisselant de lait et de miel. »


    Mais que dit la connaissance ? Comprenez : mettez votre espérance en celui qui va vous être manifesté dans la chair, c’est-à-dire Jésus. Car l’être humain est une terre qui souffre[c], puisque la création d’Adam est venue de la surface de la terre.


    Que dit-il donc ? « Dans le bon pays, un pays ruisselant de lait et de miel. » Béni soit notre Seigneur, frères, lui qui a établi parmi nous la sagesse et l’intelligence de ses réalités secrètes. Car le prophète parle du Seigneur au moyen d’une parabole. Qui la comprendra, sinon celui qui est sage et avisé, et qui aime son Seigneur ?


    Puisqu’il nous a renouvelés par le pardon des péchés, il a fait de nous une réalité nouvelle[d], afin que nous ayons une âme d’enfants, comme s’il nous créait de nouveau.


    Car l’Écriture parle à notre sujet lorsqu’il dit au Fils : « Faisons l’être humain à notre image et à notre ressemblance, et qu’ils dominent sur les bêtes de la terre, les oiseaux du ciel et les poissons de la mer. » Et quand le Seigneur vit la beauté de notre création humaine, il dit : « Croissez, multipliez-vous et remplissez la terre. » Ces paroles se rapportent au Fils.


    Je vais encore te montrer comment le Seigneur parle à notre sujet. À la fin, il a accompli une seconde création, et le Seigneur dit : « Voici, je rends les dernières choses semblables aux premières. » C’est donc à ce sujet que le prophète a proclamé : « Entrez dans un pays ruisselant de lait et de miel, et dominez sur lui. »


    Voici donc que nous avons été créés de nouveau, comme il le dit encore par un autre prophète : « Voici, dit le Seigneur, j’ôterai de ceux-ci » — c’est-à-dire de ceux que l’Esprit du Seigneur a connus d’avance — « leur cœur de pierre et je mettrai en eux un cœur de chair », car lui-même devait être manifesté dans la chair et habiter en nous.


    En effet, la demeure de notre cœur est un temple saint pour le Seigneur, mes frères.


    Car le Seigneur dit encore : « Avec quoi paraîtrai-je devant le Seigneur mon Dieu et serai-je glorifié ? Je te louerai dans l’assemblée de mes frères et je te chanterai au milieu de l’assemblée des saints. » Nous sommes donc ceux qu’il a conduits dans le bon pays.


    Que sont donc le lait et le miel ? L’enfant est d’abord maintenu en vie par le miel, puis par le lait. De même, nous aussi, maintenus en vie par notre foi en la promesse et par la parole, nous vivrons et dominerons sur la terre.


    Or, nous avons déjà cité plus haut : « Qu’ils croissent, se multiplient et dominent sur les poissons. » Mais qui est capable, [maintenant][e], de dominer sur les bêtes, les poissons et les oiseaux du ciel ? Nous devons en effet comprendre que dominer suppose d’avoir le pouvoir, de manière à donner des ordres et à exercer l’autorité.


    Si donc cela ne s’accomplit pas maintenant, il est certain qu’il nous parlait du monde à venir, lorsque nous-mêmes serons rendus parfaits afin de devenir héritiers de l’alliance du Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin transmis lit « dans les sources de Sion », formulation inhabituelle qui n’a pas été harmonisée avec Ésaïe 28.16.
    reason: Signaler une lecture distinctive ou textuellement incertaine sans la corriger dans le corps du texte.
  - marker: b
    text: 'Expression d’humilité très forte : l’auteur se présente comme ce qui est méprisé ou rejeté, tout en associant cette image à l’amour de ses destinataires.'
    reason: Éclairer une tournure paradoxale susceptible d’être mal comprise.
  - marker: c
    text: Littéralement, selon le témoin fourni, « l’être humain est une terre souffrante ». Le texte associe la condition humaine, la souffrance et la création d’Adam à partir de la terre.
    reason: Préserver et expliquer une formulation difficile au lieu d’en imposer une interprétation conjecturale.
  - marker: d
    text: Le terme rendu par « réalité nouvelle » peut aussi se comprendre comme « nouvelle forme » ou « nouveau modèle ».
    reason: Conserver l’ouverture lexicale de l’expression « new type » du témoin.
  - marker: e
    text: Le mot « maintenant » est signalé entre crochets dans le témoin anglais fourni, indiquant qu’il peut s’agir d’un ajout explicatif ou d’une donnée textuellement incertaine.
    reason: Maintenir le signal textuel demandé par les données sources.
lexical_decisions:
- source_word: servant of the Lord
  choice: serviteur du Seigneur
  rationale: Conserve littéralement le titre du témoin sans préciser une identité que le passage laisse indéterminée.
- source_word: fountains of Zion
  choice: sources de Sion
  rationale: Préserve la lecture distinctive du témoin fourni au lieu de l’harmoniser avec la formulation biblique plus courante « en Sion ».
- source_word: chief corner-stone
  choice: pierre principale de l’angle
  rationale: Rend l’image architecturale ancienne dans une formulation intelligible tout en maintenant son lien avec « tête de l’angle ».
- source_word: offscouring
  choice: rebut
  rationale: Conserve l’auto-abaissement vigoureux de l’auteur ; « déchet » aurait en français moderne une coloration plus brutale et moins digne.
- source_word: man is earth suffering
  choice: l’être humain est une terre qui souffre
  rationale: Maintient l’expression difficile et le jeu interprétatif entre humanité, terre et souffrance, sans la corriger conjecturalement.
- source_word: new type
  choice: réalité nouvelle
  rationale: Évite le calque obscur « nouveau type » tout en conservant l’idée d’une condition ou forme nouvelle produite par la recréation.
- source_word: confession unto Thee
  choice: je te louerai
  rationale: Dans ce contexte liturgique, le sens est la proclamation reconnaissante ou la louange adressée à Dieu, non l’aveu d’une faute.
- source_word: be lords / rule
  choice: dominez / dominer
  rationale: Reproduit le vocabulaire de souveraineté et permet d’enchaîner naturellement avec l’explication de l’autorité donnée dans le texte.
- source_word: hereafter
  choice: monde à venir
  rationale: Exprime clairement l’horizon eschatologique impliqué par l’opposition avec « maintenant ».
theological_decisions:
- issue: Référents des pronoms divins et christologiques
  choice: Conserver les pronoms du texte et nommer Jésus seulement là où le passage le fait
  alternative: Identifier explicitement chaque « il » au Père, au Fils ou au Christ
  rationale: Le passage superpose des citations et leur interprétation christologique ; expliciter davantage résoudrait artificiellement certaines transitions ambiguës.
- issue: Paroles de Genèse adressées « au Fils »
  choice: Traduire sans atténuer l’affirmation de l’auteur
  alternative: Reformuler comme une lecture possible ou une simple allusion chrétienne
  rationale: Il s’agit de l’exégèse théologique propre au texte de Barnabé, qui doit être représentée fidèlement sans être approuvée ni corrigée.
- issue: Temple du cœur et habitation divine
  choice: Conserver « la demeure de notre cœur est un temple saint »
  alternative: Normaliser en « notre cœur est la demeure et le temple »
  rationale: La syntaxe du témoin porte une formulation particulière ; la traduction garde sa tension métaphorique.
- issue: Domination future sur la création
  choice: Rendre explicitement l’opposition entre le présent et le monde à venir
  alternative: Comprendre cette domination de manière spirituelle dès maintenant
  rationale: L’auteur lui-même fonde son raisonnement sur le fait que cette domination ne s’accomplit pas actuellement et l’oriente vers l’héritage futur.
- issue: Cœur de chair et manifestation dans la chair
  choice: Préserver le rapprochement verbal entre les deux emplois de « chair »
  alternative: Traduire le premier par « cœur sensible »
  rationale: La répétition soutient l’argument christologique de l’auteur et ne doit pas être effacée.
translation_notes:
  register: Français international moderne, digne et lisible, avec tutoiement dans les citations adressées à Dieu et alternance singulier/pluriel conforme aux destinataires. Les formules prophétiques gardent une légère solennité sans archaïsmes. Le draft demeure nécessairement provisoire puisque la révision directe du grec et des témoins latins est indiquée comme encore en attente ; les lectures singulières du témoin anglais ont donc été préservées et annotées plutôt qu’harmonisées.
