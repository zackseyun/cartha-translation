    Malheur à vous, car vous vieillirez tous comme un vêtement, et la teigne vous dévorera. » Et le prophète dit encore, puisqu’il a été établi comme une pierre dure destinée à broyer : « Voici, je poserai dans les sources de Sion[a] une pierre très précieuse, choisie, honorée, pierre principale de l’angle. »


    Puis, que dit-il encore ? « Quiconque mettra son espérance en lui vivra éternellement. » Notre espérance repose-t-elle donc sur une pierre ? Certainement pas ! C’est plutôt parce que le Seigneur a établi sa chair dans la puissance. Car il dit : « Il m’a établi comme un roc dur. »


    Et le prophète dit encore : « La pierre qu’ont rejetée les bâtisseurs est devenue la tête de l’angle. » Et il dit encore : « Voici le jour grand et merveilleux que le Seigneur a fait. »


    Je vous écris avec plus de simplicité afin que vous compreniez, moi qui suis le rebut de votre amour[b].


    Que dit encore le prophète ? « L’assemblée des malfaiteurs s’est réunie autour de moi ; ils m’ont entouré comme les abeilles entourent un rayon de miel » ; et : « Ils ont tiré au sort mon vêtement. »


    Puisqu’il devait être manifesté dans la chair et souffrir, sa souffrance fut révélée d’avance. En effet, le prophète dit au sujet d’Israël : « Malheur à leur âme ! Car ils ont conçu contre eux-mêmes un projet mauvais, disant : “Attachons le juste, car il ne nous est d’aucune utilité.” »


    Et que leur dit l’autre prophète, Moïse ? « Voici ce que dit le Seigneur Dieu : Entrez dans le bon pays que le Seigneur a promis par serment à Abraham, Isaac et Jacob, et recevez-le en héritage, ce pays ruisselant de lait et de miel. »


    Mais que dit la connaissance ? Comprenez : mettez votre espérance en celui qui va vous être manifesté dans la chair, c’est-à-dire Jésus. Car l’être humain est une terre qui souffre[c], puisque la création d’Adam est venue de la surface de la terre.


    Que dit-il donc ? « Dans le bon pays, un pays ruisselant de lait et de miel. » Béni soit notre Seigneur, frères, lui qui a établi parmi nous la sagesse et l’intelligence de ses réalités secrètes. Car le prophète parle du Seigneur au moyen d’une parabole. Qui la comprendra, sinon celui qui est sage et avisé, et qui aime son Seigneur ?


    Puisqu’il nous a renouvelés par le pardon des péchés, il a fait de nous une forme nouvelle[d], afin que nous ayons une âme d’enfants, comme s’il nous créait de nouveau.


    Car l’Écriture parle à notre sujet lorsqu’il dit au Fils : « Faisons l’être humain à notre image et à notre ressemblance, et qu’ils dominent sur les bêtes de la terre, les oiseaux du ciel et les poissons de la mer. » Et quand le Seigneur vit la beauté de notre création humaine, il dit : « Croissez, multipliez-vous et remplissez la terre. » Ces paroles se rapportent au Fils.


    Je vais encore te montrer comment le Seigneur parle à notre sujet. Dans les derniers temps, il a fait une seconde création, et le Seigneur dit : « Voici, je rends les dernières choses semblables aux premières. » C’est donc à ce sujet que le prophète a proclamé : « Entrez dans un pays ruisselant de lait et de miel, et dominez sur lui. »


    Voici donc que nous avons été créés de nouveau, comme il le dit encore par un autre prophète : « Voici, dit le Seigneur, j’ôterai de ceux-ci » — c’est-à-dire de ceux que l’Esprit du Seigneur a connus d’avance — « leur cœur de pierre et je mettrai en eux un cœur de chair », car lui-même devait être manifesté dans la chair et habiter en nous.


    En effet, la demeure de notre cœur est un temple saint pour le Seigneur, mes frères.


    Car le Seigneur dit encore : « Avec quoi paraîtrai-je devant le Seigneur mon Dieu et serai-je glorifié ? Je te rendrai grâce dans l’assemblée de mes frères et je te chanterai au milieu de l’assemblée des saints. » Nous sommes donc ceux qu’il a conduits dans le bon pays.


    Que sont donc le lait et le miel ? L’enfant est d’abord maintenu en vie par le miel, puis par le lait. De même, nous aussi, maintenus en vie par notre foi en la promesse et par la parole, nous vivrons et dominerons sur la terre.


    Or, nous avons déjà cité plus haut : « Qu’ils croissent, se multiplient et dominent sur les poissons. » Mais qui est capable, [maintenant][e], de dominer sur les bêtes, les poissons et les oiseaux du ciel ? Nous devons en effet comprendre que dominer suppose d’avoir le pouvoir, de manière à donner des ordres et à exercer l’autorité.


    Si donc cela ne s’accomplit pas maintenant, il est certain qu’il nous parlait du monde à venir, lorsque nous-mêmes serons rendus parfaits afin de devenir héritiers de l’alliance du Seigneur.'
