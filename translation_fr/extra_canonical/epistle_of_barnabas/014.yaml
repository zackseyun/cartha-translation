  footnotes:
  - marker: a
    text: Le nom « Moïse » est indiqué entre crochets parce qu’il s’agit d’une restitution signalée par le témoin de traduction fourni.
    reason: Préserver honnêtement le signal critique présent dans la source de travail.
  - marker: b
    text: L’expression peut aussi se rendre par « alliance pour la race » ou « alliance du peuple ». La formulation de cette citation varie selon les témoins et par rapport à Ésaïe 42.6.
    reason: Signaler une incertitude textuelle et lexicale réelle sans imposer une harmonisation avec une forme biblique connue.
lexical_decisions:
- source_word: διαθήκη (covenant)
  choice: alliance
  rationale: Terme français biblique courant qui conserve la portée relationnelle et juridique du mot, ici appliqué aux tables puis à son accomplissement en Jésus.
- source_word: πατέρες (fathers)
  choice: les pères
  rationale: Conserve le titre traditionnel des ancêtres d’Israël sans préciser davantage que le témoin fourni.
- source_word: κληρονομία (inheritance)
  choice: héritage
  rationale: Maintient le réseau lexical entre le peuple appartenant à l’héritage de Dieu et celui qui hérite de l’alliance.
- source_word: ἔθνη (Gentiles/nations)
  choice: les nations
  rationale: Rendu moderne et inclusif du sens biblique de peuples non juifs, sans connotation péjorative.
- source_word: ταπεινοί (humble/poor)
  choice: les humbles
  rationale: Préserve le terme du témoin de Barnabé et son ambiguïté entre condition modeste et disposition humble.
- source_word: λόγος (word)
  choice: la parole
  rationale: Garde l’ambiguïté entre message proclamé et parole agissante, sans imposer une identification doctrinale.
theological_decisions:
- issue: « Ils arrivent au comble de leurs péchés »
  choice: Conserver l’affirmation polémique de l’auteur au sujet du groupe désigné par « ils »
  alternative: Atténuer en « leurs péchés soient pleinement manifestés »
  rationale: Le texte associe leur accomplissement dans le péché à la réception de l’alliance par « nous ». La formulation reste dure, mais l’adoucir résoudrait une tension propre au document ancien.
- issue: Le Seigneur donne l’alliance après avoir souffert patiemment
  choice: Rattacher l’endurance souffrante au Seigneur
  alternative: Employer une tournure impersonnelle ou la rattacher au donataire
  rationale: Le fil du passage présente le Seigneur comme celui qui s’est manifesté et a agi pour nous ; le français explicite légèrement « les souffrances » pour rendre la phrase intelligible sans définir une théorie de l’expiation.
- issue: « Celui qui en a hérité » appliqué à Jésus
  choice: Préserver le langage d’héritage
  alternative: Traduire interprétativement par « celui à qui elle appartenait »
  rationale: Le langage est théologiquement chargé et potentiellement difficile, mais authentique au témoin ; il ne doit pas être harmonisé silencieusement.
- issue: L’alliance « en nous »
  choice: Maintenir « établir l’alliance en nous »
  alternative: « établir l’alliance avec nous »
  rationale: Le témoin distingue ici une intériorisation de l’alliance ; remplacer « en » par « avec » effacerait cette nuance.
translation_notes:
  register: Français international moderne, digne et lisible, avec cadence biblique dans les citations. Les répétitions structurantes (« reçut », « peuple », « alliance », « ténèbres ») ont été conservées. Ce projet demeure nécessairement provisoire, car les données fournies indiquent qu’une vérification directe des témoins grecs et latins reste à effectuer.
