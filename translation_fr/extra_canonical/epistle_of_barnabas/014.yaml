  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: fr
  text: 'Oui, vraiment. Mais concernant l’alliance qu’il a juré aux pères de donner au peuple, voyons s’il l’a effectivement donnée. Il l’a donnée, mais eux-mêmes n’ont pas été trouvés dignes de la recevoir, à cause de leurs péchés.


    Car le prophète dit : « Moïse jeûna sur le mont Sinaï pendant quarante jours et quarante nuits, afin de recevoir l’alliance du Seigneur pour la donner au peuple. Et [Moïse][a] reçut du Seigneur les deux tables, écrites dans l’Esprit par le doigt de la main du Seigneur. » Moïse les prit et les descendit pour les donner au peuple.


    Et le Seigneur dit à Moïse : « Moïse, Moïse, descends vite, car ton peuple, que tu as fait sortir du pays d’Égypte, a agi avec perversité. » Moïse vit qu’ils s’étaient de nouveau fabriqué des images en métal fondu ; il les jeta de ses mains, et les tables de l’alliance du Seigneur furent brisées.


    Moïse les reçut, mais eux-mêmes ne furent pas trouvés dignes. Alors, comment les avons-nous reçues ? Remarquez ceci : Moïse les reçut en qualité de serviteur, mais le Seigneur lui-même nous les a données pour faire de nous le peuple de son héritage, après avoir supporté patiemment les souffrances pour nous.


    Mais il a été manifesté afin que, dans le même temps, ils arrivent au comble de leurs péchés et que nous recevions l’alliance par celui qui en a hérité, à savoir le Seigneur Jésus. Celui-ci avait été préparé d’avance dans ce but : en apparaissant en personne, il devait racheter des ténèbres nos cœurs, déjà livrés à la mort et abandonnés à l’iniquité de l’égarement, puis établir ainsi l’alliance en nous par la parole.


    Car il est écrit que le Père lui ordonne de nous délivrer des ténèbres et de préparer pour lui-même un peuple saint.


    C’est pourquoi le prophète dit : « Moi, le Seigneur ton Dieu, je t’ai appelé dans la justice ; je te prendrai par la main et je te fortifierai. Je t’ai établi comme alliance pour le peuple[b], comme lumière pour les nations, afin d’ouvrir les yeux des aveugles, de faire sortir de leurs entraves ceux qui sont liés et, de leur prison, ceux qui demeurent dans les ténèbres. » Nous comprenons donc d’où nous avons été rachetés.


    Le prophète dit encore : « Voici, je t’ai établi comme lumière pour les nations, afin que tu portes le salut jusqu’aux extrémités de la terre. » Ainsi parle le Seigneur qui t’a racheté, Dieu.


    Le prophète dit encore : « L’Esprit du Seigneur est sur moi ; c’est pourquoi il m’a donné l’onction pour annoncer la bonne nouvelle aux humbles. Il m’a envoyé guérir ceux qui ont le cœur brisé, proclamer aux captifs la libération et aux aveugles le retour à la vue, proclamer l’année favorable du Seigneur et le jour de la rétribution, et consoler tous ceux qui sont dans le deuil. »'
