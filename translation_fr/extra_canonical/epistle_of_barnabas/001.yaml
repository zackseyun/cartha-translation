    reason: Rendre visible l’incertitude de la construction derrière une formulation française intelligible.
lexical_decisions:
- source_word: δικαιώματα
  choice: prescriptions
  rationale: Le terme désigne ici des exigences ou dispositions établies par Dieu. « Prescriptions » reste naturel en français tout en évitant de réduire le sens à de simples rites.
- source_word: πνεύμασιν
  choice: esprits
  rationale: Le pluriel est conservé, malgré son caractère inhabituel en français, afin de respecter la manière dont l’auteur désigne les destinataires dans ce passage.
- source_word: ἐπίγνωσις
  choice: connaissance pleinement accomplie
  rationale: Cette formulation rend l’idée d’une connaissance pleine ou approfondie sans prétendre trancher entre connaissance intellectuelle et discernement spirituel.
- source_word: ἀπαρχή
  choice: avant-goût
  rationale: Dans l’expression liée au fait de goûter les réalités futures, « avant-goût » restitue naturellement la valeur de prémices.
- source_word: ψυχή
  choice: vie
  rationale: Dans « plus que ma propre ψυχή », « vie » exprime naturellement l’attachement à sa propre personne ou existence ; « âme » reste possible mais serait plus susceptible d’une lecture technique étrangère au contexte.
theological_decisions:
- issue: Origine ou appartenance de « la vie qui est sienne »
  choice: la vie qui vient de lui
  alternative: la vie qui est la sienne
  rationale: La construction transmise est concise et ambiguë. Le choix exprime le rapport de la vie au Seigneur sans développer une doctrine précise ; une note signale l’autre lecture possible.
- issue: Rapport entre amour, joie et œuvres justes
  choice: l’amour manifesté dans la joie et l’allégresse, témoignage des œuvres de justice
  alternative: l’amour, dans la joie et l’allégresse, est le témoignage des œuvres de justice
  rationale: La syntaxe nominale et dense est maintenue autant que possible, sans imposer un enchaînement théologique plus précis que le texte.
- issue: Offrande à la crainte de Dieu
  choice: lui offrir, dans la crainte, une offrande
  alternative: offrir une offrande plus riche à la crainte de Dieu
  rationale: La tournure littérale est difficile en français. Le choix comprend la crainte comme l’attitude dans laquelle l’offrande est faite, tout en signalant l’incertitude textuelle et syntaxique.
