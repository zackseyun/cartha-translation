    text: 'Le rapport exact entre « la vie » et le pronom « sa » est concis dans le texte ancien. On peut aussi rendre : « l’espérance de la vie qui est la sienne ».'
    reason: Préserver l’ambiguïté du possessif sans introduire l’idée que cette vie « vient de » lui.
  - marker: b
    text: La construction de cette série est très resserrée ; le rapport exact entre l’amour, la joie et les œuvres de justice peut se comprendre de plusieurs façons.
    reason: Signaler une ambiguïté syntaxique réelle sans la résoudre silencieusement.
  - marker: c
    text: 'La formulation ancienne est difficile : elle dit littéralement une offrande « à sa crainte ». La crainte peut être comprise comme se rapportant à Dieu, sans que la relation grammaticale soit davantage explicitée.'
    reason: Conserver la construction inhabituelle du témoin et en expliquer la difficulté.
  revision_rationale: La révision corrige les changements de sens sans lisser les ambiguïtés significatives. Elle maintient les répétitions et la tension syntaxique de l’ouverture de l’épître, mais emploie une ponctuation et des enchaînements recevables en français international contemporain. Les notes sont ajustées pour commenter les ambiguïtés effectivement préservées dans le texte révisé.
