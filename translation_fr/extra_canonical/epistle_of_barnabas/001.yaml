  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: fr
  text: 'Je vous salue, fils et filles, dans la paix, au nom du Seigneur qui nous a aimés.


    Puisque les prescriptions de Dieu sont grandes et abondent en votre faveur, j’éprouve une joie immense et débordante à la vue de vos esprits bienheureux et glorieux, tant la grâce du don spirituel que vous avez reçu est profondément enracinée en vous.


    C’est pourquoi je me réjouis d’autant plus pour moi-même, dans l’espérance d’être sauvé, car je vois réellement que l’Esprit a été répandu parmi vous depuis la riche source du Seigneur. La vue de vous, que j’avais tant désirée, m’a merveilleusement convaincu à votre sujet.


    J’en suis donc persuadé. Et puisque j’ai conscience qu’après vous avoir longuement parlé, le Seigneur a fait route avec moi sur le chemin de la justice, je me sens entièrement poussé, moi aussi, à vous aimer plus que ma propre vie. En effet, une grande foi et un grand amour habitent en vous, grâce à l’espérance de la vie qui vient de lui.[a] J’ai donc estimé que, si je prenais soin de vous communiquer une part de ce que j’ai reçu, j’en serais récompensé pour avoir servi de tels esprits. Je me suis ainsi empressé de vous envoyer ce modeste écrit, afin qu’à votre foi s’ajoute aussi une connaissance pleinement accomplie.


    Il y a donc trois prescriptions du Seigneur : l’espérance de la vie, commencement et fin de notre foi ; la justice, commencement et fin du jugement ; et l’amour manifesté dans la joie et l’allégresse, témoignage des œuvres de justice.[b]


    Car le Seigneur nous a fait connaître, par ses prophètes, le passé et le présent ; il nous a aussi donné un avant-goût des réalités à venir. Voyant chacune de ces choses s’accomplir comme il l’a annoncé, nous devons lui offrir, dans la crainte, une offrande plus riche et plus élevée.[c] Quant à moi, ce n’est pas en maître, mais comme l’un d’entre vous, que je vais exposer quelques points propres à vous réjouir dans les circonstances présentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se traduire : « grâce à l’espérance de la vie qui est la sienne ».'
    reason: Préserver l’ambiguïté du rapport exprimé entre la vie et le Seigneur.
  - marker: b
