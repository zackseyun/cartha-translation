  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: fr
  text: 'Il leur parle donc encore à ce sujet : « Pourquoi jeûnez-vous pour moi, dit le Seigneur, de façon à faire entendre aujourd’hui vos cris ? Ce n’est pas là le jeûne que j’ai choisi, dit le Seigneur : il ne suffit pas qu’un homme s’humilie lui-même,


    ni même que vous courbiez votre cou comme un cercle, que vous vous couvriez d’un sac et que vous vous couchiez sur la cendre. Même alors, vous ne pourrez pas appeler cela un jeûne qui m’est agréable.


    Mais à nous, il dit : “Voici le jeûne que j’ai choisi, dit le Seigneur : défais tout lien de méchanceté, dénoue les cordes serrées des contrats imposés, renvoie libres ceux qui ont été brisés et mets en pièces tout engagement injuste.[a] Partage ton pain avec celui qui a faim ; si tu vois quelqu’un qui est nu, habille-le. Fais entrer chez toi ceux qui sont sans abri ; si tu vois une personne humiliée, ne la méprise pas, pas plus qu’un membre de ta maisonnée ou de ta propre descendance.


    Alors ta lumière jaillira dès le matin, et ta guérison se lèvera rapidement. La justice marchera devant toi, et la gloire de Dieu t’enveloppera.


    Alors tu crieras, et Dieu t’entendra. Tu parleras encore qu’il dira : ‘Me voici !’ — si tu ôtes de chez toi le joug, le geste accusateur du doigt et les paroles de murmure ; si tu donnes de bon cœur ton pain à celui qui a faim et si tu as compassion de la personne humiliée.”


    Voilà pourquoi, mes frères, celui qui est patient, sachant d’avance que le peuple qu’il avait préparé en son Bien-Aimé croirait avec simplicité, nous a tout révélé par avance, afin que nous ne venions pas, comme des novices, faire naufrage sur leur Loi.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les expressions de cette série reprennent le langage d’Ésaïe 58.6. Le témoin fourni parle notamment de « contrats imposés » et de personnes « brisées » ; le détail exact de ces images devra être vérifié directement dans les témoins grecs et latins.
    reason: Signaler une difficulté lexicale réelle et le caractère provisoire de la base documentaire.
  - marker: b
    text: La formulation « leur Loi » et l’image de « faire naufrage » sont conservées telles qu’elles ressortent du témoin fourni, sans préciser davantage l’identité du groupe visé.
    reason: Préserver la tension polémique et l’ambiguïté référentielle sans ajouter une interprétation confessionnelle.
lexical_decisions:
- source_word: abasing his soul / humble person / abased soul
  choice: s’humilie lui-même / personne humiliée
  rationale: Le contexte emploie des formulations apparentées mais non nécessairement identiques. Le français distingue l’ascèse volontaire du premier passage et la condition sociale ou personnelle de celui qui est abaissé.
- source_word: forcible contracts
  choice: contrats imposés
  rationale: Conserve l’idée d’obligations contractées sous contrainte sans réduire le terme à une forme juridique moderne trop précise.
- source_word: broken ones
  choice: ceux qui ont été brisés
  rationale: Préserve l’image forte du témoin fourni et son ambiguïté entre oppression physique, sociale et morale.
- source_word: stretching forth of the finger
  choice: le geste accusateur du doigt
  rationale: Rend naturellement en français la valeur hostile ou accusatrice du geste sans l’aplatir en simple action de montrer.
- source_word: in his well-beloved
  choice: en son Bien-Aimé
  rationale: Maintient la formulation christologique relationnelle et son ambiguïté syntaxique plutôt que de l’expliciter doctrinalement.
- source_word: shipwreck ourselves upon their law
  choice: faire naufrage sur leur Loi
  rationale: Conserve la métaphore maritime et la tension polémique du texte ; la majuscule signale ici la Loi religieuse visée.
theological_decisions:
- issue: Identité de « celui qui est patient »
  choice: celui qui est patient
  alternative: le Seigneur patient
  rationale: Le sujet implicite peut être compris comme Dieu, mais le texte fourni ne le nomme pas explicitement ; la traduction préserve cette retenue.
- issue: Sens de « croirait en simplicité »
  choice: croirait avec simplicité
  alternative: croirait sincèrement
  rationale: La formulation retenue garde l’ambivalence entre disposition simple, absence de duplicité et foi non sophistiquée.
- issue: Rapport à « leur Loi »
  choice: leur Loi
  alternative: la loi des Juifs
  rationale: Le pronom du texte est conservé sans identifier plus explicitement le groupe ni amplifier la polémique.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des images vigoureuses et des répétitions prophétiques. La rédaction demeure provisoire, car la documentation fournie indique qu’un contrôle direct des témoins grecs et latins reste à effectuer.
