review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement la citation d’Isaïe 58 telle qu’elle est adaptée dans Barnabé : le jeûne purement ascétique est opposé à la libération des opprimés et au secours des démunis. Quelques formulations du projet affaiblissaient ou modifiaient inutilement le texte, notamment « il ne suffit pas » pour une négation plus directe, « pas plus qu’un membre » pour une coordination inclusive, et l’ajout de « m’est » dans « agréable ».'
  naturalness: Le français est globalement fluide et d’un registre approprié. Les corrections rendent les impératifs, les enchaînements et l’adresse prophétique plus idiomatiques, tout en conservant les changements de personne présents dans la citation. La guillemet final orphelin est supprimé.
  terminology: '« liens de méchanceté », « contrats imposés », « ceux qui ont été brisés », « geste accusateur du doigt » et « faire naufrage sur leur loi » conservent les images et les ambiguïtés du témoin. « Bien-Aimé » est maintenu, sans explicitation christologique. La majuscule à « Loi » est évitée : le témoin ne justifie pas typographiquement une qualification confessionnelle supplémentaire.'
  issues:
  - severity: medium
    issue: Négation et qualificatif ajoutés dans la description du jeûne.
    rationale: « Il ne suffit pas qu’un homme s’humilie lui-même » introduit une concession absente du témoin, et « qui m’est agréable » explicite le destinataire de « acceptable ». Une formulation négative directe et non explicitante est plus fidèle.
  - severity: medium
    issue: Rendu incorrect de la dernière coordination concernant la maisonnée et la descendance.
    rationale: « Ne la méprise pas, pas plus qu’un membre… » peut se lire comme une comparaison et ne commande pas clairement de ne mépriser ni les membres de la maison ni la descendance. Le texte doit conserver l’interdiction étendue à ces personnes.
  - severity: low
    issue: Guillemet fermant sans guillemet ouvrant correspondant à la fin du paragraphe final.
    rationale: Le dernier signe « » » est structurellement orphelin, puisque la citation prophétique a déjà été close après « âme humiliée ».
  - severity: low
    issue: Majuscule interprétative à « Loi ».
    rationale: Le témoin porte simplement « their law »; « leur loi » préserve la référence polémique sans ajouter un marquage confessionnel.
  revised_text: 'Il leur parle donc encore à ce sujet : « Pourquoi jeûnez-vous pour moi, dit le Seigneur, afin que votre voix se fasse entendre aujourd’hui en criant ? Ce n’est pas le jeûne que j’ai choisi, dit le Seigneur, ni le fait qu’un homme humilie son âme ;


    ni même si vous courbez votre cou comme un cercle, si vous vous couvrez d’un sac et vous vous couchez sur la cendre. Même alors, vous ne l’appellerez pas un jeûne agréable.


    Mais à nous, il dit : « Voici le jeûne que j’ai choisi, dit le Seigneur : défais tout lien de méchanceté, dénoue les cordes serrées des contrats imposés, renvoie libres ceux qui ont été brisés et mets en pièces tout engagement injuste.[a] Partage ton pain avec celui qui a faim ; si tu vois quelqu’un qui est nu, habille-le. Fais entrer chez toi ceux qui sont sans abri ; si tu vois une personne humiliée, ne la méprise pas, et ne méprise personne de ta maisonnée ni de ta propre descendance.


    Alors ta lumière jaillira dès le matin, et ta guérison se lèvera rapidement. La justice marchera devant toi, et la gloire de Dieu t’enveloppera.


    Alors tu crieras, et Dieu t’entendra. Tu parleras encore qu’il dira : “Me voici !” — si tu ôtes de chez toi le joug, le geste accusateur du doigt et les paroles de murmure ; si tu donnes de bon cœur ton pain à celui qui a faim et si tu as compassion de l’âme humiliée. »


