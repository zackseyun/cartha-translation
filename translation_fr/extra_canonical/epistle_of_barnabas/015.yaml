  yaml_path: translation/extra_canonical/epistle_of_barnabas/015.yaml
  text: 'Moreover, concerning the Sabbath, it is likewise written in the Ten Words, which he spoke to Moses face to face on Mount Sinai: “You shall make holy the Sabbath of the Lord with pure hands and a pure heart.”


    And in another place he says, “If my sons observe the Sabbath, then I will bestow my mercy upon them.”


    He speaks of the Sabbath at the beginning of creation: “And God made the works of his hands in six days, and he finished on the seventh day, rested on it, and made it holy.”


    Pay attention, children, to what this means: “He finished in six days.” He means that in six thousand years the Lord will bring all things to an end, for with him a day signifies a thousand years. He himself testifies to me about this, saying, “Behold, the day of the Lord will be as a thousand years.” Therefore, children, in six days—that is, in six thousand years—everything will come to an end.


    “And he rested on the seventh day.” This is what he means: when his Son comes and abolishes the time of the Lawless One, judges the ungodly, and changes the sun, the moon, and the stars, then he will truly rest on the seventh day.


    Yes, and furthermore he says, “You shall make it holy with pure hands and a pure heart.” Therefore, if anyone is now able to make holy the day that God made holy, even though he is pure in heart, we have gone completely astray.


    But if it is only afterward, and not until then, that we will truly rest and make it holy—when we ourselves are able to do so after being justified and receiving the promise, when iniquity is no more and all things have been made new by the Lord—then we will be able to make it holy, because we ourselves will first have been made holy.


    Finally, he says to them, “Your new moons and your Sabbaths I cannot endure.” You see what he means: it is not your present Sabbaths that are acceptable [to me], but the Sabbath that I have made. On that Sabbath, when I have brought all things to rest, I will make the beginning of the eighth day, which is the beginning of another world.


    Therefore, we also keep the eighth day for rejoicing, on which Jesus also rose from the dead and, after being revealed, ascended into the heavens.'
translation:
  language: fr
  text: '15 Au sujet du sabbat, il est également écrit dans les Dix Paroles que Dieu adressa à Moïse face à face sur le mont Sinaï : « Vous sanctifierez le sabbat du Seigneur avec des mains pures et un cœur pur. »[a]


    Et ailleurs, il dit : « Si mes fils observent le sabbat, alors je leur accorderai ma miséricorde. »[b]


    Il parle du sabbat dès le commencement de la création : « Dieu fit les œuvres de ses mains en six jours ; il acheva le septième jour, s’y reposa et le sanctifia. »[c]


    Comprenez bien, mes enfants, ce que signifient ces mots : « Il acheva en six jours. » Cela veut dire qu’en six mille ans le Seigneur mènera toutes choses à leur terme, car, pour lui, un jour représente mille ans. Lui-même m’en rend témoignage lorsqu’il dit : « Voici, un jour du Seigneur sera comme mille ans. »[d] Ainsi donc, mes enfants, en six jours, c’est-à-dire en six mille ans, toutes choses arriveront à leur terme.


    « Et il se reposa le septième jour. » Cela veut dire que, lorsque son Fils viendra, qu’il mettra fin au temps de l’Impie, jugera les impies et transformera le soleil, la lune et les étoiles, alors il se reposera véritablement le septième jour.


    Il dit encore : « Tu le sanctifieras avec des mains pures et un cœur pur. » Si quelqu’un peut dès maintenant sanctifier le jour que Dieu a sanctifié, même avec un cœur pur, alors nous nous sommes complètement égarés.


    Mais c’est seulement plus tard, et pas avant, que nous nous reposerons véritablement et que nous le sanctifierons : lorsque, rendus justes et entrés en possession de la promesse, nous serons nous-mêmes capables de le faire ; lorsque l’injustice n’existera plus et que le Seigneur aura fait toutes choses nouvelles. Alors nous pourrons le sanctifier, puisque nous aurons d’abord été nous-mêmes sanctifiés.


    Enfin, il leur dit : « Vos nouvelles lunes et vos sabbats, je ne peux pas les supporter. »[e] Vous voyez ce qu’il veut dire : ce ne sont pas vos sabbats actuels que j’agrée, mais le sabbat que j’ai établi. Lorsque j’y aurai donné le repos à toutes choses, je ferai commencer le huitième jour, qui est le commencement d’un autre monde.


    C’est pourquoi nous célébrons aussi dans la joie le huitième jour, celui où Jésus est ressuscité d’entre les morts puis, après s’être manifesté, est monté aux cieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation associe librement le commandement du sabbat à l’exigence de mains et d’un cœur purs ; elle ne correspond pas mot pour mot au texte biblique reçu du Décalogue.
    reason: Signaler une citation composite ou libre sans la normaliser silencieusement.
