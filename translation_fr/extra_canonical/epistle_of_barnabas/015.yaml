    text: Citation d’Ésaïe 1.13 dans une forme abrégée.
    reason: Situer la citation scripturaire.
lexical_decisions:
- source_word: Ten Words
  choice: Dix Paroles
  rationale: Rend l’appellation traditionnelle du Décalogue tout en conservant la formulation littérale du témoin.
- source_word: hallow / make holy
  choice: sanctifier
  rationale: Maintient le lien lexical répété entre le jour sanctifié par Dieu et les personnes d’abord sanctifiées.
- source_word: bring all things to an end / finished
  choice: mener toutes choses à leur terme / achever
  rationale: Préserve le jeu conceptuel entre l’achèvement de la création et l’accomplissement eschatologique sans imposer l’idée d’anéantissement.
- source_word: Lawless One
  choice: l’Impie
  rationale: Désigne une figure personnelle et eschatologique sans l’identifier explicitement à une figure doctrinale particulière.
- source_word: keep the eighth day
  choice: célébrons… le huitième jour
  rationale: En contexte cultuel et joyeux, « célébrer » est plus naturel en français que le calque « garder », sans préciser davantage la forme de l’observance.
- source_word: another world
  choice: un autre monde
  rationale: Conserve la formulation et son horizon eschatologique sans la réduire à « l’âge à venir ».
theological_decisions:
- issue: Interprétation des six jours comme six mille ans
  choice: Présenter cette lecture comme l’explication propre de l’auteur
  alternative: Transformer l’énoncé en affirmation biblique directe
  rationale: Le texte distingue la citation créationnelle de son interprétation eschatologique ; cette tension doit rester visible.
- issue: Sujet du repos au septième jour
  choice: Conserver « il se reposera », renvoyant grammaticalement au Fils dans le contexte immédiat
  alternative: Expliciter « Dieu se reposera » ou « le Seigneur se reposera »
  rationale: Le témoin fourni laisse le référent lié au Fils ; l’explicitation résoudrait une ambiguïté théologique réelle.
- issue: Justification, promesse et sanctification
  choice: « rendus justes et entrés en possession de la promesse »
  alternative: « justifiés et ayant reçu la promesse »
  rationale: Exprime naturellement la séquence du texte sans définir le mécanisme de la justification ni la nature précise de la promesse.
- issue: Le huitième jour et la pratique chrétienne
  choice: « nous célébrons aussi dans la joie le huitième jour »
  alternative: « nous observons le dimanche »
  rationale: Évite d’introduire le terme « dimanche » et de préciser une pratique ecclésiale au-delà du texte.
- issue: Formule « après s’être manifesté, est monté »
  choice: Conserver la succession des deux actes
  alternative: Harmoniser avec une chronologie évangélique détaillée
  rationale: La traduction ne doit ni corriger ni développer la formulation christologique et narrative du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes (« sanctifier », « septième jour », « six jours ») sont conservées. « Mes enfants » maintient l’adresse pastorale. Le style des citations reste légèrement solennel sans archaïsmes. Projet provisoire fondé sur le témoin anglais fourni, la révision directe du grec et des témoins latins restant à effectuer.
