    reason: Préserver une variante textuelle pertinente pour l’argument du passage.
  - marker: d
    text: L’énoncé rappelle Psaume 90.4 et 2 Pierre 3.8, mais la formule « jour du Seigneur » est propre à la citation telle qu’elle apparaît ici.
    reason: Identifier l’arrière-plan scripturaire sans prétendre à une citation verbatim.
