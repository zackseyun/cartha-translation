review_pass:
  verdict: revise
  source_fidelity: 'Le sens du témoin fourni est globalement bien rendu : la limitation de l’auteur, l’espérance de n’avoir rien omis concernant le salut, l’indétermination des « choses présentes ou à venir », et leur formulation par paraboles sont préservées. La clause entre crochets et son signalement sont correctement maintenus. Une légère révision améliore la fidélité idiomatique de « fail in my desire », sans interprétation doctrinale.'
  naturalness: 'Le français est clair et de registre approprié. Toutefois, « manquant ainsi à mon désir » n’est pas une tournure naturelle en français moderne : on manque plutôt son but, ou l’on échoue dans son dessein. « Les réalités présentes ou futures » est possible, mais « les choses présentes ou à venir » est plus direct et conserve mieux le caractère non spécifié du texte.'
  terminology: « Salut », « mon âme espère » et « paraboles » conviennent. « En toute simplicité » rend avec naturel l’intensif « with all simplicity ». Les crochets et la note ne doivent pas être supprimés, puisque le dossier les identifie comme le signal d’une restitution ou d’une incertitude du témoin.
  issues:
  - severity: low
    issue: « manquant ainsi à mon désir »
    rationale: Cette expression est maladroite en français et ne rend pas avec précision l’idée d’échouer à atteindre son désir/dessein. « échouant ainsi dans mon dessein » est naturel tout en restant proche du sens.
  - severity: low
    issue: « réalités présentes ou futures »
    rationale: « Réalités » peut suggérer une catégorie philosophique absente du témoin. « choses présentes ou à venir » est plus neutre et conserve l’ambiguïté voulue.
  revised_text: 'Autant qu’il m’était possible de tout vous exposer en toute simplicité, mon âme espère que je n’ai rien omis [de ce qui concerne le salut et que je n’ai pas ainsi échoué dans mon dessein][a].


    Car si je vous écrivais au sujet des choses présentes ou à venir, vous ne les comprendriez pas, parce qu’elles sont exprimées en paraboles. En voilà assez sur ce sujet.'
  revised_footnotes:
  - marker: a
    text: Les mots entre crochets correspondent à un passage textuellement incertain ou restitué dans le témoin utilisé.
    reason: Signaler au lecteur que la clause n’a pas le même degré de certitude textuelle que le reste du passage.
  revision_rationale: La révision remplace une tournure française peu idiomatique par « échoué dans mon dessein », qui conserve l’idée de ne pas atteindre le but désiré. Elle remplace également « réalités » par « choses », plus neutre et plus proche de l’indétermination du témoin. Le contenu, l’ambiguïté textuelle signalée par les crochets, le registre et les termes théologiques sont autrement préservés.
