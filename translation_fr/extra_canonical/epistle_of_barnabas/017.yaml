base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: fr
  text: 'Autant qu’il m’était possible de tout vous exposer avec simplicité, mon âme espère que je n’ai rien omis [de ce qui concerne le salut, manquant ainsi à mon désir].[a]


    Car si je vous écrivais au sujet des réalités présentes ou futures, vous ne les comprendriez pas, parce qu’elles sont exprimées en paraboles. En voilà assez sur ce sujet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots entre crochets correspondent à un passage textuellement incertain ou restitué dans le témoin utilisé.
    reason: Signaler au lecteur que la clause n’a pas le même degré de certitude textuelle que le reste du passage.
lexical_decisions:
- source_word: with all simplicity
  choice: avec simplicité
  rationale: Rend directement l’idée d’un exposé simple et sans détour, dans un français naturel.
- source_word: my soul hopeth
  choice: mon âme espère
  rationale: Conserve l’expression personnelle et sémitisante du témoin au lieu de la réduire à « j’espère ».
- source_word: things immediate or future
  choice: réalités présentes ou futures
  rationale: « Réalités » fournit un référent français naturel tout en préservant la portée indéterminée de l’expression.
- source_word: put in parables
  choice: exprimées en paraboles
  rationale: Préserve le langage figuré sans préciser qui les a formulées ni résoudre leur sens.
- source_word: So much then for this
  choice: En voilà assez sur ce sujet
  rationale: Formule française courante et digne marquant la clôture de cette partie.
theological_decisions:
- issue: Portée de la clause relative au salut
  choice: Maintien entre crochets
  alternative: Intégrer la clause sans crochets ou l’omettre
  rationale: Le dossier fourni signale une restauration ou une lacune manuscrite; les crochets rendent visible cette incertitude textuelle sans trancher.
- issue: Nature des réalités présentes ou futures
  choice: Ne pas les identifier davantage
  alternative: Les expliciter comme événements, doctrines ou mystères
  rationale: Le témoin demeure général; une précision introduirait une interprétation non assurée.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « mon âme espère » est volontairement conservé pour respecter la couleur de l’expression ancienne. Projet provisoire fondé sur le témoin anglais public fourni, la vérification directe du grec et du latin restant à effectuer.
