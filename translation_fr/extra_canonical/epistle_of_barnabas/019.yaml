  text: 'This, then, is the way of light: if anyone desires to travel on the way to his appointed place, he should be zealous in his works. The knowledge given to us, by which we may walk in it, is as follows.


    You shall love the One who made you. You shall fear the One who created you. You shall glorify the One who redeemed you from death. You shall be simple in heart and rich in spirit. You shall not cleave to those who walk the way of death. You shall hate everything that is not pleasing to God. You shall hate all hypocrisy. You shall never forsake the commandments of the Lord.


    You shall not exalt yourself, but shall be lowly minded in all things. You shall not assume glory for yourself. You shall not entertain a wicked design against your neighbor. You shall not admit boldness into your soul.


    You shall not commit fornication. You shall not commit adultery. You shall not corrupt boys. The word of God shall not come forth from you where any are unclean. You shall not make a difference in a person when reproving him for a transgression. You shall be meek. You shall be quiet. You shall fear the words you have heard. You shall not bear a grudge against your brother.


    You shall not doubt whether a thing shall be or not be. You shall not take the name of the Lord in vain. You shall love your neighbor more than your own soul. You shall not murder a child by abortion, nor shall you kill it when it is born. You shall not withhold your hand from your son or daughter, but from their youth you shall teach them the fear of God.


    You shall not be found coveting your neighbor''s goods. You shall not be found greedy for gain. Neither shall you cleave with your soul to the lofty, but you shall walk with the humble and righteous. You shall receive the accidents that befall you as good, knowing that nothing is done without God. You shall not be double-minded or double-tongued.


    You shall be subject to your masters as to a type of God, in shame and fear. You shall not command your bondservant or handmaid in bitterness, though they set their hope on the same God, lest perhaps they cease to fear the God who is over both of you; for He came not to call with respect of persons, but to call those whom the Spirit has prepared.


    You shall make your neighbor partake in all things, and shall not say that anything is your own. For if you are fellow partakers in that which is imperishable, how much rather shall you be in the things that are perishable? You shall not be hasty with your own tongue, for the mouth is the snare of death. So far as you are able, you shall be pure for your soul''s sake.


    Do not be found holding out your hands to receive and drawing them in to give. You shall love as the apple of your eye everyone who speaks to you the word of the Lord.


    You shall remember the day of judgment night and day, and day by day you shall seek out the persons of the saints, either laboring by word and going to exhort them and meditating how you may save souls by your word, or working with your hands for a ransom for your sins.


    You shall not hesitate to give, nor shall you murmur when giving, but you shall know who is the good paymaster of your reward. You shall keep the things you have received, neither adding to them nor taking away from them. You shall utterly hate the Evil One. You shall judge righteously.


    You shall not make a schism, but shall pacify those who contend by bringing them together. You shall confess your sins. You shall not betake yourself to prayer with an evil conscience. This is the way of light.'
translation:
  language: fr
  text: 'Voici donc le chemin de la lumière : si quelqu’un désire suivre le chemin qui mène au lieu qui lui est destiné, qu’il mette tout son zèle dans ses œuvres. Et voici la connaissance qui nous a été donnée pour que nous marchions sur ce chemin.


    Tu aimeras celui qui t’a fait. Tu craindras celui qui t’a créé. Tu glorifieras celui qui t’a racheté de la mort. Tu auras le cœur sans duplicité et l’esprit riche. Tu ne t’attacheras pas à ceux qui suivent le chemin de la mort. Tu détesteras tout ce qui déplaît à Dieu. Tu détesteras toute hypocrisie. Tu n’abandonneras jamais les commandements du Seigneur.


    Tu ne t’élèveras pas toi-même, mais tu te montreras humble en toutes choses. Tu ne t’attribueras pas la gloire. Tu ne concevras aucun mauvais dessein contre ton prochain. Tu ne laisseras pas l’arrogance entrer dans ton âme.


    Tu ne te livreras pas à l’immoralité sexuelle. Tu ne commettras pas d’adultère. Tu n’abuseras pas sexuellement des garçons.[a] Tu ne prononceras pas la parole de Dieu dans un contexte d’impureté.[b] Tu ne feras pas de favoritisme quand tu reprendras quelqu’un pour une faute. Tu seras doux. Tu seras paisible. Tu trembleras devant les paroles que tu as entendues. Tu ne garderas pas rancune à ton frère.


    Tu ne seras pas partagé, te demandant si une chose arrivera ou non. Tu ne prononceras pas le nom du Seigneur à la légère. Tu aimeras ton prochain plus que ta propre vie. Tu ne tueras pas un enfant par avortement et tu ne le feras pas mourir après sa naissance. Tu ne retireras pas ta main de ton fils ou de ta fille,[c] mais, dès leur jeunesse, tu leur enseigneras la crainte de Dieu.


    Tu ne convoiteras pas les biens de ton prochain. Tu ne seras pas avide de gain. Tu ne t’attacheras pas de toute ton âme aux personnes haut placées, mais tu fréquenteras les humbles et les justes. Tu accueilleras comme bonnes les circonstances qui t’arrivent, sachant que rien ne se produit sans Dieu.[d] Tu n’auras ni la pensée double ni la langue double.


    Tu te soumettras à tes maîtres comme à une figure de Dieu, avec retenue et crainte. Tu ne donneras pas d’ordres avec amertume à ton esclave, homme ou femme, qui met son espérance dans le même Dieu, de peur qu’il ne cesse de craindre celui qui est le Dieu de vous deux. Car il n’est pas venu appeler en faisant du favoritisme, mais appeler ceux que l’Esprit a préparés.


    Tu feras participer ton prochain à tout ce que tu possèdes et tu ne diras pas qu’une chose t’appartient en propre. En effet, si vous partagez ensemble les biens impérissables, à combien plus forte raison devez-vous partager les biens périssables ! Ne parle pas avec précipitation, car la bouche est un piège mortel. Dans toute la mesure du possible, tu seras pur pour le bien de ton âme.


    Ne tends pas les mains pour recevoir en les retirant au moment de donner. Tu aimeras comme la prunelle de tes yeux toute personne qui t’annonce la parole du Seigneur.


    Nuit et jour, tu te souviendras du jour du jugement. Chaque jour, tu rechercheras la compagnie des saints : soit tu travailleras par la parole, allant les encourager et réfléchissant à la manière de sauver des âmes par ta parole ; soit tu travailleras de tes mains pour le rachat de tes péchés.[e]


    Tu n’hésiteras pas à donner et tu ne murmureras pas en donnant, car tu sauras qui rémunère généreusement ta récompense. Tu garderas ce que tu as reçu, sans rien y ajouter ni rien en retrancher. Tu détesteras entièrement le Mauvais. Tu jugeras avec justice.


    Tu ne provoqueras pas de division, mais tu réconcilieras ceux qui se disputent en les rapprochant. Tu confesseras tes péchés. Tu ne te présenteras pas pour prier avec une mauvaise conscience. Tel est le chemin de la lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression ancienne peut se traduire plus littéralement par « tu ne corrompras pas les garçons » ; dans ce contexte, elle désigne vraisemblablement leur exploitation sexuelle.
    reason: Signaler la forme littérale et la portée probable d’un terme historiquement sensible.
  - marker: b
    text: 'La formulation transmise est difficile. Elle peut aussi signifier : « Tu ne prononceras pas la parole de Dieu avec impureté. »'
    reason: Préserver l’incertitude syntaxique et sémantique du passage.
  - marker: c
    text: « Ne pas retirer sa main » semble ici désigner le fait de ne pas se dérober à sa responsabilité envers ses enfants, notamment à leur éducation.
    reason: Expliquer un idiome susceptible d’être obscur en français moderne sans remplacer l’image dans le texte.
  - marker: d
    text: Le texte affirme que rien n’arrive « sans Dieu », sans préciser davantage le rapport entre Dieu et les événements évoqués.
    reason: Éviter de transformer une formule délibérément concise en affirmation doctrinale plus précise.
  - marker: e
    text: La formule « pour le rachat de tes péchés » est conservée telle quelle ; le texte n’explique pas ici de quelle manière ce travail se rapporte au pardon ou à la réparation des péchés.
    reason: Conserver une tension théologique réelle sans harmonisation confessionnelle.
lexical_decisions:
- source_word: way of light
  choice: chemin de la lumière
  rationale: Conserve l’image structurante des deux chemins dans une formulation française naturelle et traditionnelle.
- source_word: simple in heart
  choice: le cœur sans duplicité
  rationale: « Simple de cœur » risquerait d’évoquer la naïveté ; la formulation retenue exprime l’intégrité et l’absence de duplicité.
- source_word: corrupt boys
  choice: abuseras pas sexuellement des garçons
  rationale: Rend explicitement la portée sexuelle probable de l’interdiction antique sans employer un euphémisme ambigu.
- source_word: double-minded / double-tongued
  choice: la pensée double / la langue double
  rationale: Préserve le parallélisme imagé et l’idée d’irrésolution ou de duplicité.
- source_word: bondservant or handmaid
  choice: esclave, homme ou femme
  rationale: Conserve sans l’atténuer la réalité sociale de l’esclavage évoquée par le texte ancien.
- source_word: saints
  choice: saints
  rationale: Maintient le terme communautaire ancien sans le réduire à une catégorie ecclésiastique postérieure.
- source_word: the Evil One
  choice: le Mauvais
  rationale: Conserve la personnification probable tout en évitant d’imposer un nom absent du témoin fourni.
theological_decisions:
- issue: Providence divine et événements subis
  choice: rien ne se produit sans Dieu
  alternative: rien n’arrive sans la volonté de Dieu
  rationale: La formulation retenue conserve l’affirmation forte du texte sans préciser si Dieu permet, cause ou veut directement chaque événement.
- issue: Travail manuel et rachat des péchés
  choice: pour le rachat de tes péchés
  alternative: comme réparation pour tes péchés
  rationale: Conserve la tension sotériologique de la formule transmise au lieu de l’harmoniser avec une doctrine particulière.
- issue: Référent de « il » dans l’appel sans favoritisme
  choice: il n’est pas venu appeler
  alternative: Dieu n’est pas venu appeler / le Christ n’est pas venu appeler
  rationale: Le pronom maintient l’ambiguïté du référent plutôt que de préciser une identité que le témoin fourni n’établit pas explicitement.
- issue: Commandement relatif à l’avortement et à l’infanticide
  choice: Tu ne tueras pas un enfant par avortement et tu ne le feras pas mourir après sa naissance
  alternative: Tu ne feras pas périr l’enfant dans le sein et tu ne le tueras pas une fois né
  rationale: Rend directement les deux interdictions distinctes, sans commentaire doctrinal supplémentaire.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier conserve l’adresse morale individuelle, avec passage au pluriel là où le texte élargit explicitement l’exhortation à la communauté. Les répétitions impératives sont maintenues comme trait rhétorique. Cette rédaction s’appuie principalement sur le témoin anglais public fourni, éclairé avec prudence par les formulations grecques connues de la tradition des Deux Chemins ; une collation critique complète des témoins grecs et latins reste souhaitable avant publication définitive.
