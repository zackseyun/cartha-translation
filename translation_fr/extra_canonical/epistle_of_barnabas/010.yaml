  text: 'But forasmuch as Moses said, “You shall not eat seine [sic] nor eagle nor falcon nor crow nor any fish that has no scale upon it,” he received in his understanding three ordinances.


    Yes, and further he says to them in Deuteronomy, “And I will lay as a covenant upon this people my ordinances.” So then it is not a commandment of God that they should not bite with their teeth, but Moses spoke it in spirit.


    Accordingly, he mentioned the swine with this intent: “You shall not cleave,” he says, “to such people as are like swine.” That is, when they are in luxury they forget the Lord, but when they are in want they recognize the Lord, just as the swine, when it eats, does not know its lord; but when it is hungry it cries out, and when it has received food again it is silent.


    “Neither shall you eat eagle nor falcon nor kite nor crow.” “You shall not,” he says, “cleave to, or be likened to, such people as do not know how to provide food for themselves by toil and sweat, but in their lawlessness seize what belongs to others; and, as if walking in guilelessness, watch and search about for someone to rob in their rapacity.” Just as these birds alone do not provide food for themselves, but sit idle and seek how they may eat the meat that belongs to others, being pestilent in their evil-doings.


    “And you shall not eat,” he says, “lamprey nor polypus nor cuttlefish.” He means, “You shall not become like such people as are desperately wicked and already condemned to death,” just as these fishes alone are accursed and swim in the depths, not swimming on the surface like the rest, but dwelling on the ground beneath the deep sea.


    Moreover, “You shall not eat the hare.” Why so? “You shall not be found a corrupter of boys, nor shall you become like such persons”; for the hare gains one passage in the body every year, and according to the number of years it lives it has just so many orifices.


    Again, “Neither shall you eat the hyena.” “You shall not,” he says, “become an adulterer or a fornicator, neither shall you resemble such persons.” Why so? Because this animal changes its nature year by year, becoming at one time male and at another female.


    Moreover, he has hated the weasel also, and with good reason. “You shall not,” he says, “become such as those people of whom we hear as working iniquity with their mouth for uncleanness, neither shall you cleave to impure women who work iniquity with their mouth.” For this animal conceives with its mouth.


    Concerning meats, then, Moses received three decrees to this effect and uttered them in a spiritual sense; but they accepted them according to the lust of the flesh, as though they referred to eating.


    And David also receives knowledge of the same three decrees, and says, “Blessed is the man who has not gone in the counsel of the ungodly”—even as the fishes go in darkness into the depths—“and has not stood in the path of sinners”—just as those who pretend to fear the Lord sin like swine—“and has not sat on the seat of the destroyers”—as the birds that are seated for prey. You now have the complete lesson concerning eating.


    Again Moses says, “You shall [eat] everything that divides the hoof and chews the cud.” What does he mean? He who receives the food knows him who gives him the food and, being refreshed, appears to rejoice in him. Well said he, having regard to the commandment. What then does he mean? Cleave to those who fear the Lord: to those who meditate in their heart on the distinction of the word which they have received; to those who tell of the ordinances of the Lord and keep them; and to those who know that meditation is a work of gladness and who chew the cud of the word of the Lord. But why that which divides the hoof? Because the righteous person both walks in this world and at the same time looks for the holy world to come. You see how wise a lawgiver Moses was.


    But whence should they perceive or understand these things? Howbeit, we, having justly perceived the commandments, tell them as the Lord willed. To this end he circumcised our ears and hearts, that we might understand these things.'
translation:
  language: fr
  text: '**Barnabé 10**


    Mais puisque Moïse a dit : « Vous ne mangerez ni porc, ni aigle, ni faucon, ni milan, ni corbeau, ni aucun poisson dépourvu d’écailles », il a reçu dans son intelligence trois prescriptions.


    Il leur dit encore dans le Deutéronome : « J’imposerai à ce peuple mes prescriptions comme une alliance. » Ce n’est donc pas un commandement de Dieu leur interdisant de mordre avec les dents : Moïse a parlé dans un sens spirituel.


    Ainsi, s’il a mentionné le porc, c’était dans cette intention : « Tu ne t’attacheras pas, dit-il, à des gens semblables aux porcs. » En effet, lorsqu’ils vivent dans l’abondance, ils oublient le Seigneur ; mais lorsqu’ils sont dans le besoin, ils reconnaissent le Seigneur. De même, quand le porc mange, il ne connaît pas son maître ; mais lorsqu’il a faim, il pousse des cris, puis, dès qu’il a reçu à manger, il se tait de nouveau.


    « Tu ne mangeras ni aigle, ni faucon, ni milan, ni corbeau. » Cela veut dire : « Tu ne t’attacheras pas et tu ne ressembleras pas à des gens qui ne savent pas se procurer leur nourriture par le travail et la sueur, mais qui, dans leur mépris de la loi, s’emparent du bien d’autrui. Tout en feignant de marcher avec innocence, ils guettent et cherchent quelqu’un à dépouiller dans leur avidité. » De même, ces oiseaux sont les seuls à ne pas se procurer eux-mêmes leur nourriture ; ils restent oisifs et cherchent comment manger la chair qui appartient aux autres, véritables fléaux par leurs méfaits.


    « Tu ne mangeras ni murène, ni poulpe, ni seiche. » Cela veut dire : « Tu ne deviendras pas semblable à ces gens qui sont irrémédiablement mauvais et déjà condamnés à mort. » De même, ces poissons sont les seuls à être maudits et à nager dans les profondeurs : au lieu de nager à la surface comme les autres, ils habitent le fond, sous la mer profonde.[a]


    De plus : « Tu ne mangeras pas le lièvre. » Pourquoi ? « Tu ne seras pas un corrupteur de garçons et tu ne deviendras pas semblable à de telles personnes. » Car le lièvre acquiert chaque année une ouverture corporelle de plus : il en aurait donc autant que le nombre de ses années.[b]


    Il est encore dit : « Tu ne mangeras pas non plus l’hyène. » « Tu ne deviendras ni adultère ni débauché, dit-il, et tu ne ressembleras pas à de telles personnes. » Pourquoi ? Parce que cet animal changerait de sexe chaque année, étant tantôt mâle et tantôt femelle.[b]


    Il a aussi détesté la belette, et à juste titre. « Tu ne deviendras pas, dit-il, semblable à ces hommes dont nous entendons dire qu’ils commettent par la bouche des actes impurs ; tu ne t’attacheras pas non plus aux femmes impures qui commettent par la bouche de tels actes. » Car cet animal concevrait par la bouche.[b]


    Au sujet des aliments, Moïse a donc reçu trois prescriptions de ce genre et les a exprimées dans un sens spirituel ; mais eux les ont comprises selon le désir de la chair, comme si elles concernaient la nourriture.


    David, lui aussi, reçoit la connaissance de ces trois prescriptions et dit : « Heureux l’homme qui n’est pas allé au conseil des impies » — comme les poissons qui s’enfoncent dans l’obscurité des profondeurs —, « qui ne s’est pas tenu sur le chemin des pécheurs » — comme ceux qui prétendent craindre le Seigneur, mais pèchent à la manière des porcs —, « et qui ne s’est pas assis sur le siège des destructeurs » — comme les oiseaux qui restent perchés à l’affût d’une proie. Vous possédez maintenant tout l’enseignement concernant la nourriture.


    Moïse dit encore : « Vous mangerez tout animal qui a le sabot fendu et qui rumine. » Que veut-il dire ? Celui qui reçoit la nourriture connaît celui qui la lui donne et, une fois rassasié, il manifeste sa joie en lui. Cette parole est juste, si l’on considère le commandement. Que veut-il donc dire ? Attachez-vous à ceux qui craignent le Seigneur, à ceux qui méditent dans leur cœur le sens distinctif de la parole qu’ils ont reçue, à ceux qui proclament les prescriptions du Seigneur et les observent, à ceux qui savent que la méditation est une œuvre de joie et qui ruminent la parole du Seigneur. Mais pourquoi l’animal au sabot fendu ? Parce que le juste marche dans ce monde tout en attendant le monde saint à venir. Vous voyez avec quelle sagesse Moïse a donné la Loi.


    Mais comment auraient-ils pu percevoir ou comprendre ces choses ? Quant à nous, puisque nous avons justement compris les commandements, nous les exposons comme le Seigneur l’a voulu. C’est pour cela qu’il a circoncis nos oreilles et notre cœur, afin que nous comprenions ces choses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les identifications des animaux marins varient selon les témoins et les traductions anciennes ; « murène », « poulpe » et « seiche » correspondent ici à la liste transmise par la tradition grecque représentée dans le témoin fourni.
    reason: Signals zoological and textual uncertainty without disrupting the main text.
  - marker: b
    text: Les affirmations qui suivent sur l’anatomie ou le changement de sexe du lièvre, de l’hyène et de la belette reflètent des croyances zoologiques de l’Antiquité ; elles sont conservées comme telles, sans correction scientifique.
    reason: Prevents readers from mistaking retained ancient physiological claims for modern factual assertions.
lexical_decisions:
- source_word: χοῖρος (reconstructed from the Greek tradition; English witness misprints “seine”)
  choice: porc
  rationale: Corrects the obvious printing error in the supplied witness and matches the animal explained immediately afterward.
- source_word: δικαιώματα / δόγματα (reflected by “ordinances/decrees”)
  choice: prescriptions
  rationale: Keeps the sense of authoritative requirements without importing a later technical meaning of “dogme” or narrowing the term to civil statutes.
- source_word: πνευματικῶς / ἐν πνεύματι (reflected by “in spirit”)
  choice: dans un sens spirituel
  rationale: Expresses the author’s interpretive claim naturally while not identifying the phrase exclusively with inspiration by the Holy Spirit.
- source_word: παιδοφθόρος (reflected by “corrupter of boys”)
  choice: corrupteur de garçons
  rationale: Preserves the severe and specifically male-directed ancient term without adding a modern diagnostic or denominational gloss.
- source_word: λαγός / ὕαινα / γαλῆ (hare / hyena / weasel)
  choice: lièvre / hyène / belette
  rationale: Uses the conventional zoological equivalents while retaining the ancient author’s own claims about these animals.
- source_word: μηρυκάω (chew the cud; metaphorically meditate)
  choice: ruminer
  rationale: Preserves the wordplay between animal rumination and sustained meditation on the divine word.
- source_word: δίχηλον (divided hoof)
  choice: au sabot fendu
  rationale: Natural modern French for the dietary category and clear enough to sustain the ensuing allegory.
- source_word: κόσμος ὁ ἅγιος (reflected by “holy world”)
  choice: le monde saint à venir
  rationale: Preserves the unusual expression “monde saint” rather than replacing it with “ciel” or “royaume,” while making its future orientation explicit from the context.
theological_decisions:
- issue: Nature of the dietary commandments
  choice: Render the author’s claim that Moses spoke “dans un sens spirituel”
  alternative: State that the dietary laws had no literal force whatsoever
  rationale: The passage contrasts spiritual understanding with fleshly reception, but the translation should report that polemical claim without expanding it into a systematic doctrine of the Mosaic law.
- issue: Identity of the speaker in scriptural quotations
  choice: Use context-sensitive impersonal phrasing or the immediate named subject rather than systematically capitalizing divine pronouns
  alternative: Capitalize every pronoun as a direct reference to God
  rationale: The shifts among God, Moses, David, and the expositor are not always syntactically explicit. Avoiding interpretive capitalization preserves ambiguity and reads naturally in modern French.
- issue: Allegorical interpretation of Psalm 1
  choice: Retain the author’s inserted animal comparisons as commentary around the quoted clauses
  alternative: Blend those comparisons into the biblical quotation
  rationale: Typographic separation makes clear what belongs to the cited psalm and what belongs to Barnabas’s exposition.
- issue: “Circoncision” of ears and heart
  choice: Retain the metaphor literally
  alternative: Paraphrase as spiritual enlightenment
  rationale: The circumcision metaphor is central to the work’s scriptural argument and should not be flattened into a generic theological concept.
- issue: Ancient accusations and sexual ethics
  choice: Translate the prohibitions directly but without adding explicit anatomical detail absent from the witness
  alternative: Modernize them into named contemporary sexual categories
  rationale: This preserves the moral force and disturbing character of the passage while avoiding unwarranted precision.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement est conservé dans les commandements au singulier et le vouvoiement dans les adresses au groupe. Les citations bibliques restent reconnaissables sans archaïsmes. La traduction est nécessairement provisoire, car le dossier fourni indique qu’une vérification directe complète des témoins grecs et latins reste à faire.
