review_pass:
  verdict: revise
  source_fidelity: La version suit fidèlement le témoin anglais fourni et corrige à juste titre les coquilles manifestes (« seine » = porc ; « now » = know). Quelques modalisations françaises (« changerait », « concevrait », « il en aurait ») affaiblissent toutefois des affirmations que l’auteur énonce à l’indicatif. La formulation de l’alliance et certains termes interprétatifs peuvent aussi être rendus plus près du texte sans perdre le français moderne.
  naturalness: Le registre est globalement clair, soutenu et naturel. « Sens distinctif de la parole » reste cependant peu idiomatique et obscurcit la formule transmise. « Irrémédiablement mauvais » est plus interprétatif que nécessaire. La révision améliore également la cohérence syntaxique de plusieurs citations.
  terminology: « Porc », « prescriptions », « dans un sens spirituel », « corrupteur de garçons », « sabot fendu » et « ruminer » sont des choix adéquats. Les termes liés aux pratiques sexuelles sont maintenus avec la retenue euphemistique du témoin, sans précision additionnelle. Les affirmations zoologiques antiques sont conservées au texte et contextualisées en note.
  issues:
  - severity: medium
    issue: Modalisation des assertions zoologiques antiques
    rationale: '« Il en aurait », « changerait » et « concevrait » introduisent une distance que le témoin ne marque pas : il énonce ces croyances à l’indicatif. La note suffit à signaler leur caractère ancien et scientifiquement erroné.'
  - severity: medium
    issue: « Sens distinctif de la parole »
    rationale: Cette expression n’est ni naturelle ni suffisamment proche de « the distinction of the word ». « La distinction de la parole » conserve volontairement l’ambiguïté de la formulation.
  - severity: low
    issue: Formulation de l’alliance
    rationale: « J’imposerai ... comme une alliance » est possible, mais « Je ferai de mes prescriptions une alliance avec ce peuple » reflète plus directement la construction du témoin.
  - severity: low
    issue: Intensification interprétative
    rationale: « Irrémédiablement mauvais » dépasse légèrement « desperately wicked » ; « profondément pervers » est plus direct et moins interprétatif.
  revised_text: '**Barnabé 10**


    Mais puisque Moïse a dit : « Vous ne mangerez ni porc, ni aigle, ni faucon, ni milan, ni corbeau, ni aucun poisson dépourvu d’écailles », il a compris trois prescriptions.


    Il leur dit encore dans le Deutéronome : « Je ferai de mes prescriptions une alliance avec ce peuple. » Ce n’est donc pas un commandement de Dieu leur interdisant de mordre avec les dents : Moïse a parlé dans un sens spirituel.


    Ainsi, s’il a mentionné le porc, c’était dans cette intention : « Tu ne t’attacheras pas, dit-il, à des gens semblables aux porcs. » En effet, lorsqu’ils vivent dans l’abondance, ils oublient le Seigneur ; mais lorsqu’ils sont dans le besoin, ils reconnaissent le Seigneur. De même, quand le porc mange, il ne connaît pas son maître ; mais lorsqu’il a faim, il pousse des cris et, dès qu’il a reçu à manger, il se tait de nouveau.


    « Tu ne mangeras ni aigle, ni faucon, ni milan, ni corbeau. » Cela veut dire : « Tu ne t’attacheras pas à des gens semblables à eux, et tu ne leur ressembleras pas : ils ne savent pas se procurer leur nourriture par le travail et la sueur, mais, dans leur mépris de la loi, ils s’emparent du bien d’autrui. Comme s’ils marchaient dans l’innocence, ils guettent et cherchent quelqu’un à dépouiller dans leur avidité. » De même, ces oiseaux sont les seuls à ne pas se procurer eux-mêmes leur nourriture ; ils restent oisifs et cherchent comment manger la chair qui appartient aux autres, étant nuisibles par leurs méfaits.


    « Tu ne mangeras ni murène, ni poulpe, ni seiche. » Cela veut dire : « Tu ne deviendras pas semblable à ces gens qui sont profondément pervers et déjà condamnés à mort. » De même, ces poissons sont les seuls à être maudits et à nager dans les profondeurs : au lieu de nager à la surface comme les autres, ils habitent le fond, sous la mer profonde.[a]


    De plus : « Tu ne mangeras pas le lièvre. » Pourquoi ? « Tu ne seras pas un corrupteur de garçons et tu ne deviendras pas semblable à de telles personnes. » Car le lièvre acquiert chaque année une ouverture corporelle de plus : selon le nombre d’années qu’il vit, il a autant d’orifices.[b]


    Il est encore dit : « Tu ne mangeras pas non plus l’hyène. » « Tu ne deviendras ni adultère ni débauché, dit-il, et tu ne ressembleras pas à de telles personnes. » Pourquoi ? Parce que cet animal change de nature chaque année : il devient tantôt mâle et tantôt femelle.[b]


    Il a aussi détesté la belette, et à juste titre. « Tu ne deviendras pas, dit-il, semblable à ces hommes dont nous entendons dire qu’ils commettent par la bouche des actes impurs ; tu ne t’attacheras pas non plus aux femmes impures qui commettent par la bouche de tels actes. » Car cet animal conçoit par la bouche.[b]


    Au sujet des aliments, Moïse a donc reçu trois prescriptions de ce genre et les a exprimées dans un sens spirituel ; mais eux les ont comprises selon le désir de la chair, comme si elles concernaient la nourriture.


    David, lui aussi, reçoit la connaissance de ces trois prescriptions et dit : « Heureux l’homme qui n’est pas allé au conseil des impies » — comme les poissons qui s’enfoncent dans l’obscurité des profondeurs —, « qui ne s’est pas tenu sur le chemin des pécheurs » — comme ceux qui prétendent craindre le Seigneur, mais pèchent à la manière des porcs —, « et qui ne s’est pas assis sur le siège des destructeurs » — comme les oiseaux qui restent perchés à l’affût d’une proie. Vous possédez maintenant tout l’enseignement concernant la nourriture.


    Moïse dit encore : « Vous mangerez tout animal qui a le sabot fendu et qui rumine. » Que veut-il dire ? Celui qui reçoit la nourriture connaît celui qui la lui donne et, une fois rassasié, il paraît se réjouir en lui. Cette parole est juste, si l’on considère le commandement. Que veut-il donc dire ? Attachez-vous à ceux qui craignent le Seigneur : à ceux qui méditent dans leur cœur la distinction de la parole qu’ils ont reçue ; à ceux qui parlent des prescriptions du Seigneur et les observent ; et à ceux qui savent que la méditation est une œuvre de joie et qui ruminent la parole du Seigneur. Mais pourquoi l’animal au sabot fendu ? Parce que le juste marche dans ce monde tout en attendant le monde saint à venir. Vous voyez avec quelle sagesse Moïse a donné la Loi.


    Mais comment auraient-ils pu percevoir ou comprendre ces choses ? Quant à nous, qui avons compris les commandements à juste titre, nous les exposons comme le Seigneur l’a voulu. C’est pour cela qu’il a circoncis nos oreilles et notre cœur, afin que nous comprenions ces choses.'
