base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: fr
  text: 'Mais passons à une autre connaissance et à un autre enseignement. Il y a deux voies d’enseignement et d’autorité : l’une est celle de la lumière, l’autre celle des ténèbres. Une grande différence sépare les deux voies. Sur l’une sont placés les anges de Dieu qui apportent la lumière, et sur l’autre, les anges de Satan.


    L’un est le Seigneur depuis toujours et pour toujours, tandis que l’autre est le chef de l’époque actuelle de l’iniquité.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais fourni traduit ici « Lord » (« seigneur »). Le grec porte ἄρχων, terme rendu par « chef » ou « dirigeant », à la différence de κύριος (« Seigneur ») employé dans la proposition précédente.
    reason: Signale l’écart important entre le témoin anglais de travail et la distinction terminologique du grec, sans ajouter d’identification doctrinale.
lexical_decisions:
- source_word: lesson and teaching
  choice: leçon et enseignement
  rationale: Conserve les deux termes distincts du témoin fourni sans les fondre en une seule notion.
- source_word: two ways
  choice: deux voies
  rationale: « Voies » garde l’image éthique traditionnelle de deux orientations de vie et convient au registre sapientiel.
- source_word: power
  choice: puissance
  rationale: Maintient la portée potentiellement spirituelle ou autoritative du terme plutôt que de la réduire à une simple capacité.
- source_word: light giving angels
  choice: les anges de Dieu qui donnent la lumière
  rationale: Rend explicitement la fonction attribuée aux anges tout en évitant le français peu naturel « anges dispensateurs de lumière ».
- source_word: season of iniquity that now is
  choice: le temps présent, marqué par l’iniquité
  rationale: Exprime naturellement le caractère actuel de cette période sans identifier l’iniquité à son essence de manière plus catégorique que le témoin.
theological_decisions:
- issue: Contraste entre « le Seigneur » éternel et l’autre « seigneur »
  choice: Majuscule pour « le Seigneur » et minuscule pour « seigneur »
  alternative: Employer « Seigneur » avec une majuscule dans les deux cas
  rationale: 'Le contraste indique une différence radicale de statut : l’un règne éternellement, l’autre seulement durant la période actuelle d’iniquité. La minuscule française marque cette dissymétrie sans supprimer le titre attribué au second.'
- issue: Référent de « the one ... the other »
  choice: Conserver « L’un ... l’autre »
  alternative: Expliciter « Dieu ... Satan »
  rationale: Préserve la formulation et sa légère ambiguïté grammaticale au lieu d’ajouter des référents absents de la phrase.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des deux voies et celui de « l’un… l’autre » sont conservés. Le brouillon reste nécessairement provisoire, puisque seul un témoin anglais du domaine public est fourni et que l’examen direct du grec et du latin est annoncé comme restant à faire.
