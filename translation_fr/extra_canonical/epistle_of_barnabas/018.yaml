revisions:
- from: 'Mais passons à une autre leçon et à un autre enseignement. Il existe deux voies d’enseignement et de puissance : celle de la lumière et celle des ténèbres. Une grande différence sépare ces deux voies. Sur l’une sont postés les anges de Dieu qui donnent la lumière, et sur l’autre, les anges de Satan.


    L’un est le Seigneur depuis toute éternité et pour toute éternité, tandis que l’autre est seigneur du temps présent, marqué par l’iniquité.[a]'
  to: 'Mais passons à une autre connaissance et à un autre enseignement. Il y a deux voies d’enseignement et d’autorité : l’une est celle de la lumière, l’autre celle des ténèbres. Une grande différence sépare les deux voies. Sur l’une sont placés les anges de Dieu qui apportent la lumière, et sur l’autre, les anges de Satan.


    L’un est le Seigneur depuis toujours et pour toujours, tandis que l’autre est le chef de l’époque actuelle de l’iniquité.[a]'
  rationale: La révision rétablit les distinctions lexicales déterminantes du texte grec tout en conservant un français international moderne et le parallélisme des deux voies. Elle ne nomme pas les référents au-delà de ce que dit le passage et garde l’ambiguïté formelle de « l’un… l’autre ».
