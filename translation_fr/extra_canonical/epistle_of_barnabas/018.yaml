    reason: Signale l’écart important entre le témoin anglais de travail et la distinction terminologique du grec, sans ajouter d’identification doctrinale.
  revision_rationale: La révision rétablit les distinctions lexicales déterminantes du texte grec tout en conservant un français international moderne et le parallélisme des deux voies. Elle ne nomme pas les référents au-delà de ce que dit le passage et garde l’ambiguïté formelle de « l’un… l’autre ».
