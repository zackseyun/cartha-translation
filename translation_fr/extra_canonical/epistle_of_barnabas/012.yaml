  yaml_path: translation/extra_canonical/epistle_of_barnabas/012.yaml
  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: fr
  text: 'De même, il donne encore, par un autre prophète, une indication au sujet de la croix. Celui-ci dit : « Et quand ces choses s’accompliront-elles ? » Le Seigneur répond : « Lorsqu’un arbre sera courbé puis se redressera, et lorsque du sang coulera goutte à goutte d’un arbre. » Ainsi, tu reçois de nouveau un enseignement sur la croix et sur celui qui devait être crucifié.


    Il parle encore par Moïse, au moment où des hommes d’une autre nation faisaient la guerre à Israël. Afin de rappeler aux Israélites, pendant cette guerre, qu’ils avaient été livrés à la mort à cause de leurs péchés, l’Esprit dit au cœur de Moïse de représenter par avance la croix et celui qui devait souffrir. Car, dit-il, s’ils ne mettent pas leur espérance en lui, la guerre leur sera faite pour toujours. Moïse entasse donc des armes les unes sur les autres au milieu du combat ; debout sur un lieu plus élevé que tous les autres, il étend les mains, et Israël remporte de nouveau la victoire. Mais chaque fois qu’il les baisse, les Israélites tombent sous l’épée.[a]


    Pourquoi cela ? Pour qu’ils apprennent qu’ils ne peuvent être sauvés sans mettre leur espérance en lui.


    Dans un autre prophète, il dit encore : « Tout le jour, j’ai tendu les mains vers un peuple désobéissant, qui contredisait ma voie juste. »


    Moïse représente encore Jésus par avance : il montre comment celui-ci doit souffrir et comment celui qu’ils croiront avoir détruit donnera lui-même la vie. Il le fait au moyen d’un signe, alors qu’Israël succombait. En effet, le Seigneur fit mordre les Israélites par toutes sortes de serpents, et ils moururent — car c’est par le serpent que la transgression s’était produite en Ève — afin de leur faire comprendre qu’à cause de leur transgression ils seraient livrés à l’épreuve de la mort.


    Bien que Moïse ait donné ce commandement : « Vous ne vous ferez pas, pour votre Dieu, d’image en métal fondu ni d’image sculptée », il en fabriqua lui-même une afin de leur montrer une représentation anticipée de Jésus. Moïse fait donc un serpent de bronze, l’élève bien en vue et convoque le peuple par une proclamation.


    Une fois rassemblés, ils supplient Moïse d’intercéder pour eux afin qu’ils soient guéris. Moïse leur dit : « Chaque fois que l’un de vous sera mordu, qu’il vienne vers le serpent placé sur le bois ; qu’il croie et espère que ce serpent, bien que mort lui-même, peut donner la vie, et il sera aussitôt sauvé. » C’est ce qu’ils firent. Ici encore, dans ces événements, tu vois la gloire de Jésus : tout est en lui et pour lui.


    Que dit encore Moïse à Jésus — c’est-à-dire Josué — fils de Noun, lorsqu’il lui donne ce nom en qualité de prophète, afin que tout le peuple l’écoute, lui seul, puisque le Père révèle tout ce qui concerne son Fils Jésus ?[b]


    Moïse dit donc à Jésus, fils de Noun, après lui avoir donné ce nom, lorsqu’il l’envoya explorer le pays : « Prends un livre entre tes mains et écris ce que dit le Seigneur : dans les derniers jours, le Fils de Dieu déracinera toute la maison d’Amalec. »


    Voici donc encore Jésus : non pas un fils d’homme, mais le Fils de Dieu ; et il a été révélé dans la chair sous forme de figure. Puisque les hommes diront que le Christ est fils de David, David lui-même prophétise, dans la crainte et en comprenant l’erreur des pécheurs : « Le Seigneur a dit à mon Seigneur : Assieds-toi à ma droite, jusqu’à ce que je fasse de tes ennemis un marchepied sous tes pieds. »


    Ésaïe dit encore : « Le Seigneur a dit à mon Christ, le Seigneur, dont j’ai saisi la main droite, afin que les nations l’écoutent, et je briserai la puissance des rois. » Vois comment David l’appelle Seigneur et ne l’appelle pas fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le récit évoque Exode 17.8-13, mais Barnabé décrit ici les mains étendues de Moïse comme une représentation anticipée de la croix. La mention d’armes entassées pourrait refléter une lecture ou une transmission particulière du passage.
    reason: Signaler l’écart narratif et l’interprétation typologique sans corriger le texte.
  - marker: b
    text: En grec, « Jésus » et « Josué » sont le même nom, Iêsous. L’argument de l’auteur repose sur cette identité de nom.
    reason: Le français distingue normalement Jésus et Josué, ce qui rendrait autrement le raisonnement difficile à comprendre.
lexical_decisions:
- source_word: type / figure (τύπος, source review pending)
  choice: représenter par avance / représentation anticipée / figure
  rationale: Le contexte emploie un vocabulaire typologique. Une légère variation française évite un jargon constant tout en conservant l’idée d’une préfiguration ; « figure » est maintenu dans l’affirmation théologique finale.
- source_word: tree / wood (ξύλον, source review pending)
  choice: arbre ; bois
  rationale: Dans le premier oracle, « arbre » préserve l’image végétale et le sang qui en coule. Pour le serpent élevé, « bois » conserve l’ambivalence possible entre poteau, support de bois et allusion à la croix.
- source_word: Jesus / Joshua (Ἰησοῦς)
  choice: Jésus — c’est-à-dire Josué
  rationale: Le grec emploie le même nom pour Jésus et Josué. Le texte français distingue les formes usuelles tout en rendant explicite le jeu de nom dont dépend l’argument.
- source_word: make alive
  choice: donner la vie
  rationale: Formulation française naturelle qui conserve l’opposition entre la mort du serpent et sa capacité symbolique à communiquer la vie.
- source_word: gainsaid
  choice: contredisait
  rationale: Terme moderne et compréhensible qui garde l’idée d’une opposition verbale et active à la voie divine.
- source_word: Christ / anointed (χριστός, source review pending)
  choice: Christ
  rationale: Le passage construit explicitement une lecture christologique. « Mon Christ » conserve cependant la forme inhabituelle de la citation au lieu de l’harmoniser avec les versions bibliques courantes.
theological_decisions:
- issue: Identification typologique de la croix dans les gestes de Moïse
  choice: Présenter cette lecture comme l’affirmation propre de l’auteur
  alternative: Réécrire le récit selon Exode 17 sans interprétation christologique
  rationale: Le chapitre fait précisément de l’attitude de Moïse une préfiguration de la croix ; cette tension exégétique ancienne doit être conservée.
- issue: Le serpent mort qui donne la vie
  choice: Conserver littéralement le paradoxe symbolique
  alternative: Expliquer que seul Dieu guérissait ceux qui regardaient le serpent
  rationale: Le texte attribue au signe cette capacité dans le cadre de son interprétation de Jésus. Une harmonisation supprimerait une formulation théologiquement frappante du témoin.
- issue: « Non pas un fils d’homme, mais le Fils de Dieu »
  choice: Conserver l’opposition telle quelle
  alternative: Comprendre « fils d’homme » comme simple expression d’humanité ou l’harmoniser avec le titre évangélique « Fils de l’homme »
  rationale: L’expression est ambiguë et potentiellement tendue. La traduction ne tranche pas son rapport au titre néotestamentaire.
- issue: Le Christ comme fils de David
  choice: Conserver le raisonnement qui oppose l’appellation « Seigneur » à « fils »
  alternative: Nuancer en affirmant simultanément la filiation davidique
  rationale: Même si d’autres traditions chrétiennes articulent les deux titres, le propos argumentatif de Barnabé ne doit pas être corrigé.
- issue: Citation attribuée à Ésaïe
  choice: Garder la formulation composite et inhabituelle transmise par le témoin
  alternative: La remplacer par le libellé d’une traduction moderne d’Ésaïe 45.1
  rationale: Le devoir de traduction porte sur Barnabé et sur sa forme de la citation, non sur une harmonisation avec le texte biblique canonique.
translation_notes:
  register: Français international moderne, digne et accessible, avec tutoiement singulier pour l’adresse directe au lecteur, conformément au caractère exhortatif du texte. Les citations gardent leurs formulations inhabituelles et ne sont pas harmonisées avec une version biblique moderne. Le dossier fourni indique qu’un contrôle direct des témoins grecs et latins reste à effectuer ; les choix signalés comme tels sont donc fondés sur le témoin anglais public fourni, consulté comme couche provisoire.
