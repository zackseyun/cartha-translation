    Elle est à nous ; mais eux l’ont perdue pour toujours de cette manière, alors même que Moïse venait de la recevoir. L’Écriture dit en effet : « Moïse resta sur la montagne, jeûnant quarante jours et quarante nuits, et il reçut du Seigneur l’alliance : des tables de pierre écrites du doigt de la main du Seigneur. »


    Mais ils la perdirent en se tournant vers les idoles. Car le Seigneur dit : « Moïse, Moïse, descends vite, car ton peuple, que tu as fait sortir du pays d’Égypte, a agi au mépris de la loi. » Moïse comprit et jeta de ses mains les deux tables. Leur alliance fut brisée, afin que l’alliance de Jésus, le Bien-Aimé, soit scellée dans nos cœurs, dans l’espérance qui naît de la foi en lui.


    J’aurais volontiers écrit beaucoup de choses, non en maître, mais comme il convient à quelqu’un qui vous aime et ne veut pas que vous soyez privés de ce que nous possédons. Je me suis pourtant empressé de vous écrire, moi qui suis votre esclave dévoué. Soyons donc vigilants en ces derniers jours. Car tout le temps vécu dans la foi ne nous servira à rien si, maintenant, au temps du mépris de la loi et au milieu des occasions de chute qui vont survenir, nous ne résistons pas comme il convient à des fils de Dieu, afin que le Noir[c] ne puisse pénétrer en nous.


    Fuyons toute vanité ; détestons entièrement les œuvres de la voie mauvaise. Ne vous tenez pas à l’écart les uns des autres en vous introduisant en secret, comme si vous étiez déjà déclarés justes. Au contraire, rassemblez-vous et recherchez ensemble ce qui est utile à tous.


    Car l’Écriture dit : « Malheur à ceux qui sont sages à leurs propres yeux et intelligents à leur propre jugement ! » Devenons spirituels ; devenons un temple rendu parfait pour Dieu. Autant qu’il dépend de nous, exerçons-nous à la crainte de Dieu [et][d] efforçons-nous de garder ses commandements, afin de trouver notre joie dans ses prescriptions.


    Le Seigneur juge le monde sans favoritisme. Chacun recevra selon ses actes. Si quelqu’un est bon, sa justice le précédera sur le chemin ; s’il est mauvais, le salaire de son mal se trouvera devant lui. De peur que, si nous nous relâchons comme des personnes appelées, nous ne nous assoupissions dans nos péchés et que le prince du mal ne prenne pouvoir sur nous et ne nous chasse du royaume du Seigneur.


    Comprenez encore ceci, mes frères : quand vous voyez que, même après tant de signes et de prodiges accomplis en Israël, ils ont été abandonnés, veillons à ne pas nous trouver, peut-être, parmi ceux dont l’Écriture dit : « Beaucoup sont appelés, mais peu sont choisis. »'
