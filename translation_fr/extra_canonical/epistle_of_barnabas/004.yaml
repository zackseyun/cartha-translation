base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/004.yaml
  text: 'Therefore, we ought to investigate the present deeply and search out the things that have power to save us. Let us flee completely from all the works of lawlessness, so that the works of lawlessness do not overpower us. Let us hate the error of the present age, so that we may be loved for what is to come.


    Let us give our soul no relief that would allow it to associate with sinners and wicked people, so that we are not made like them.


    The last offense is at hand, concerning which Scripture speaks, as Enoch says. For this reason the Master has shortened the seasons and the days, so that his beloved may hasten and come to His inheritance.


    The prophet also speaks in this way: “Ten reigns shall reign upon the earth, and after them another king will arise, who will bring three of the kings low under one.”


    In the same way Daniel speaks concerning the same thing: “I saw the fourth beast, wicked and strong and more unmanageable than all the beasts of the earth. I saw ten horns arise from it, and from these a little horn, an outgrowth, and I saw how it brought three of the great horns low under one.”


    Therefore, you ought to understand. Moreover, I ask you this one thing as one of you, loving each of you more than my own soul: pay attention to yourselves now, and do not become like certain people who pile sin upon sin, saying that our covenant also remains theirs.


    It is ours, but they lost it forever in this way, just after Moses had received it. For Scripture says: “Moses was on the mountain, fasting for forty days and forty nights, and he received the covenant from the Lord—tablets of stone written by the finger of the Lord’s hand.”


    But they lost it by turning to idols. For the Lord says: “Moses, Moses, come down quickly, for your people, whom you brought out of the land of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed upon our hearts in the hope that springs from faith in him.


    Although I would gladly write many things—not as a teacher, but as is fitting for one who loves you, so that you may not fall short of what we possess—I was eager to write to you, since I am your devoted servant. Therefore, let us be watchful in these last days. For the whole time of our faith will benefit us nothing unless now, in the season of lawlessness and amid the offenses that are to come, we resist as is fitting for God’s sons, so that the Black One may not gain an entrance.


    Let us flee from all vanity. Let us completely hate the works of the evil way. Do not, entering in privately, stand apart by yourselves, as though you were already justified, but gather together and consult about the common good.


    For Scripture says: “Woe to those who are wise for themselves and understanding in their own sight.” Let us become spiritual. Let us become a temple made perfect for God. As far as it lies within us, let us train ourselves in the fear of God, [and] let us strive to keep his commandments, so that we may rejoice in his ordinances.


    The Lord judges the world without partiality. Each person will receive according to his deeds. If someone is good, his righteousness will go before him on the way. If someone is evil, the repayment for his evildoing is before him, so that perhaps,


    if we relax as people who are called, we may fall asleep over our sins, and the prince of evil may gain power against us and thrust us out of the Lord’s kingdom.


    Moreover, understand this also, my brothers. When you see that, even after so many signs and wonders were performed in Israel, they were still abandoned, let us pay attention, so that perhaps we are not found to be, as Scripture says, “Many are called, but few are chosen.”'
translation:
  language: fr
  text: 'Il nous faut donc examiner attentivement le temps présent et rechercher avec soin ce qui peut nous sauver. Fuyons entièrement toutes les œuvres contraires à la loi, de peur qu’elles ne prennent le dessus sur nous. Détestons l’égarement du temps présent, afin d’être aimés en vue du monde à venir.


    N’accordons à notre âme aucun relâchement qui lui donnerait la liberté de fréquenter les pécheurs et les méchants, de peur que nous ne devenions semblables à eux.


    L’ultime occasion de chute est proche, celle dont parle l’Écriture, comme le dit Hénoch[a]. Car c’est pour cette raison que le Maître a abrégé les temps et les jours : afin que son Bien-Aimé se hâte et entre dans son héritage.


    Le prophète dit aussi : « Dix royaumes régneront sur la terre. Après eux se lèvera un autre roi, qui abaissera trois des rois sous un seul[b]. »


    De même, Daniel dit à ce sujet : « Je vis la quatrième bête : elle était mauvaise, forte et plus indomptable que toutes les bêtes de la terre. Dix cornes sortirent d’elle, puis, d’entre elles, une petite corne, comme une excroissance ; et celle-ci abaissa sous un seul trois des grandes cornes[b]. »


    Vous devez donc comprendre. Je vous demande encore une chose, moi qui suis l’un des vôtres et qui aime chacun de vous plus que ma propre vie : veillez maintenant sur vous-mêmes. Ne devenez pas semblables à certaines personnes qui accumulent péché sur péché en disant que notre alliance leur appartient encore, à elles aussi.


    Elle est à nous ; mais eux l’ont perdue pour toujours de cette manière, alors même que Moïse venait de la recevoir. L’Écriture dit en effet : « Moïse resta sur la montagne, jeûnant quarante jours et quarante nuits, et il reçut du Seigneur l’alliance : des tables de pierre écrites du doigt de la main du Seigneur. »


    Mais ils la perdirent en se tournant vers les idoles. Car le Seigneur dit : « Moïse, Moïse, descends vite, car ton peuple, que tu as fait sortir du pays d’Égypte, a agi au mépris de la loi. » Moïse comprit et jeta de ses mains les deux tables. Leur alliance fut brisée, afin que l’alliance de Jésus, le Bien-Aimé, soit scellée dans nos cœurs, dans l’espérance qui naît de la foi en lui.


    J’aurais volontiers écrit beaucoup de choses, non en maître, mais comme il convient à quelqu’un qui vous aime et ne veut pas que vous soyez privés de ce que nous possédons. C’est pourquoi je me suis empressé de vous écrire, moi qui suis votre serviteur dévoué. Soyons donc vigilants en ces derniers jours. Car tout le temps vécu dans la foi ne nous servira à rien si, maintenant, au temps du mépris de la loi et au milieu des occasions de chute qui vont survenir, nous ne résistons pas comme il convient à des fils de Dieu, afin que le Noir[c] ne puisse s’introduire parmi nous.


    Fuyons toute vanité ; détestons entièrement les œuvres de la voie mauvaise. Ne vous repliez pas sur vous-mêmes pour vivre isolés, comme si vous étiez déjà déclarés justes. Au contraire, rassemblez-vous et recherchez ensemble ce qui est utile à tous.


    Car l’Écriture dit : « Malheur à ceux qui sont sages à leurs propres yeux et intelligents à leur propre jugement ! » Devenons spirituels ; devenons un temple rendu parfait pour Dieu. Autant qu’il dépend de nous, exerçons-nous à la crainte de Dieu [et][d] efforçons-nous de garder ses commandements, afin de trouver notre joie dans ses prescriptions.


    Le Seigneur juge le monde sans favoritisme. Chacun recevra selon ses actes. Si quelqu’un est bon, sa justice le précédera sur le chemin ; s’il est mauvais, le salaire de son mal se trouvera devant lui. Prenons donc garde : si nous nous relâchons sous prétexte que nous avons été appelés, nous pourrions nous assoupir dans nos péchés ; alors, le prince du mal prendrait pouvoir sur nous et nous chasserait du royaume du Seigneur.


    Comprenez encore ceci, mes frères : vous voyez qu’après tant de signes et de prodiges accomplis en Israël, ils ont malgré tout été abandonnés. Veillons donc à ne pas nous trouver parmi ceux dont l’Écriture dit : « Beaucoup sont appelés, mais peu sont choisis. »


    [a] L’écrit attribué ici à Hénoch n’est pas précisé dans le témoin fourni ; la formulation peut renvoyer à une tradition hénochique plutôt qu’à une citation textuelle identifiable.


    [b] « Sous un seul » traduit littéralement une tournure obscure conservée par le témoin anglais. Elle n’est pas explicitée ici, en attendant la vérification directe des témoins grecs et latins.


    [c] Littéralement « le Noir », désignation du prince du mal. Cette expression inhabituelle est conservée plutôt que remplacée silencieusement par un nom interprétatif.


    [d] Le mot « et » est signalé comme une restitution dans le témoin de travail.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’écrit attribué ici à Hénoch n’est pas précisé dans le témoin fourni ; la formulation peut renvoyer à une tradition hénochique plutôt qu’à une citation textuelle identifiable.
    reason: Signaler l’incertitude de la référence sans proposer une identification non vérifiée.
  - marker: b
    text: « Sous un seul » traduit littéralement une tournure obscure conservée par le témoin anglais. Elle n’est pas explicitée ici, en attendant la vérification directe des témoins grecs et latins.
    reason: Préserver une difficulté textuelle ou syntaxique réelle au lieu de choisir silencieusement une reconstruction.
  - marker: c
    text: Littéralement « le Noir », désignation du prince du mal. Cette expression inhabituelle est conservée plutôt que remplacée silencieusement par un nom interprétatif.
    reason: Expliquer une appellation rare susceptible de surprendre le lecteur français.
  - marker: d
    text: Le mot « et » est signalé comme une restitution dans le témoin de travail.
    reason: Conserver le signal éditorial présent dans la source de rédaction fournie.
lexical_decisions:
- source_word: works of lawlessness
  choice: œuvres contraires à la loi / œuvres de la voie mauvaise selon le contexte
  rationale: « Œuvres contraires à la loi » rend le rapport à la transgression sans employer le peu naturel « œuvres d’illégalité ». Dans l’exhortation parallèle, « œuvres de la voie mauvaise » suit la formulation distincte du témoin.
- source_word: last offence
  choice: ultime occasion de chute
  rationale: Le terme appartient au champ du scandale ou du piège spirituel ; « occasion de chute » garde cette portée plutôt que le simple sens moderne d’« offense ».
- source_word: Master
  choice: Maître
  rationale: Conserve le titre souverain du texte sans décider explicitement si son référent immédiat est Dieu ou le Christ.
- source_word: beloved
  choice: Bien-Aimé
  rationale: La majuscule marque l’emploi titulaire probable tout en conservant la relation exprimée par le texte.
- source_word: covenant
  choice: alliance
  rationale: Terme français biblique courant, adapté aussi bien aux tables reçues par Moïse qu’à l’alliance scellée dans les cœurs.
- source_word: the Black One
  choice: le Noir
  rationale: Rendu littéral de la désignation transmise, avec note, afin de ne pas la remplacer par « Satan » ou « le diable », absents de la formulation fournie.
- source_word: without respect of persons
  choice: sans favoritisme
  rationale: Expression française actuelle et claire pour un jugement qui ne privilégie personne en fonction de son statut.
- source_word: ordinances
  choice: prescriptions
  rationale: Évite la connotation administrative moderne d’« ordonnances » tout en désignant les dispositions divines.
theological_decisions:
- issue: Identification de l’alliance comme appartenant à « nous » et perdue par « eux »
  choice: Conserver sans atténuation l’affirmation polémique de l’auteur
  alternative: Reformuler comme simple participation des croyants à une alliance restée inchangée
  rationale: Le passage affirme explicitement une perte et un transfert ou contraste d’alliance. La traduction ne doit ni harmoniser cette tension avec une théologie ultérieure ni l’accentuer au-delà du texte.
- issue: Référent du « Bien-Aimé » dans la phrase sur les temps abrégés
  choice: Conserver « son Bien-Aimé » sans ajouter « Jésus » dans cette phrase
  alternative: Identifier explicitement le Bien-Aimé à Jésus
  rationale: Le passage nomme Jésus plus loin, mais cette première formulation demeure suffisamment ambiguë pour que la traduction n’impose pas le référent.
- issue: Jugement selon les actes et appel divin
  choice: Maintenir côte à côte la réception selon les actes et la distinction entre appelés et choisis
  alternative: Expliquer l’un de ces énoncés par l’autre dans le corps du texte
  rationale: Le texte juxtapose ces motifs sans résoudre leur tension théologique ; la traduction les préserve tels quels.
- issue: Risque d’être chassé du royaume
  choice: Traduire comme un avertissement réel adressé aux appelés
  alternative: Transformer l’avertissement en hypothèse irréelle ou purement rhétorique
  rationale: La syntaxe exhortative présente le danger comme motif de vigilance ; aucune précision confessionnelle sur la persévérance n’est ajoutée.
- issue: Abandon d’Israël
  choice: Employer « ils ont ... été abandonnés », conformément au témoin
  alternative: Préciser qui les a abandonnés ou étendre l’énoncé à Israël en tout temps
  rationale: Le sujet agentif et la portée historique exacte ne sont pas explicités dans le témoin. La traduction évite d’ajouter une condamnation collective ou permanente.
translation_notes:
  register: 'Français international moderne, digne et exhortatif, avec tutoiement pluriel. Les citations sont intégrées dans une prose biblique naturelle sans archaïsmes tels que « voici que », « méchanceté » au sens technique ou « acception de personnes ». Le présent projet demeure provisoire : le dossier indique que l’examen direct du grec et du latin est encore en attente. Les formulations obscures du témoin, notamment « sous un seul », ont donc été conservées et signalées plutôt que normalisées de façon conjecturale.'
