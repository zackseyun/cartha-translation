revisions:
- from: 'Mais la voie du Noir[a] est tortueuse et pleine de malédiction. C’est en effet une voie de mort éternelle accompagnée de châtiment. On y trouve tout ce qui détruit l’âme humaine : idolâtrie, insolence, exaltation de la puissance[b], hypocrisie, duplicité du cœur, adultère, meurtre, pillage, orgueil, transgression, tromperie, méchanceté, obstination, sorcellerie, magie, avidité, absence de crainte de Dieu ;


    persécuteurs des gens de bien, ennemis de la vérité, amis du mensonge, incapables de reconnaître la récompense de la justice, ne s’attachant ni au bien ni au juste jugement, sans égard pour la veuve et l’orphelin, veillant non dans la crainte de Dieu, mais en vue du mal ; des gens dont la douceur et la patience se tiennent loin, très loin ; aimant les choses vaines, recherchant le gain, sans pitié pour le pauvre, refusant de se donner du mal pour celui qu’accable le labeur, prompts à calomnier, ne reconnaissant pas celui qui les a faits, meurtriers d’enfants, destructeurs des créatures de Dieu, se détournant de celui qui est dans le besoin, opprimant l’affligé, défenseurs des riches, juges iniques des pauvres, pécheurs en toutes choses.'
  to: 'Mais la voie du Noir[a] est tortueuse et pleine de malédiction. Car c’est une voie de mort éternelle, avec châtiment, où se trouvent les choses qui détruisent l’âme : l’idolâtrie, l’insolence, l’orgueil de la puissance, l’hypocrisie, la duplicité du cœur, l’adultère, le meurtre, le pillage, l’orgueil, la transgression, la tromperie, la méchanceté, l’obstination, la sorcellerie, la magie, l’avidité, l’absence de crainte de Dieu ;


    persécuteurs des gens de bien, ennemis de la vérité, amis du mensonge, ne discernant pas la récompense de la justice, ne s’attachant ni au bien ni au jugement juste, sans égard pour la veuve et l’orphelin, vigilants non par crainte de Dieu, mais pour le mal ; des gens chez qui la douceur et la patience sont très éloignées ; aimant les choses vaines, recherchant une récompense, sans pitié pour le pauvre, ne se donnant pas de peine pour celui qui peine, prompts à calomnier, ne reconnaissant pas celui qui les a créés, meurtriers d’enfants, corrupteurs de la créature de Dieu, se détournant de celui qui est dans le besoin, opprimant l’affligé, défenseurs des riches, juges injustes envers les pauvres, pécheurs en toutes choses.'
  rationale: La révision suit prioritairement le grec attesté plutôt que la formulation provisoire du témoin anglais. Elle corrige le vice « orgueil de la puissance », restaure le singulier « la créature de Dieu », et améliore plusieurs liens participiaux sans modifier la portée morale ou théologique du passage. La note b est supprimée, car l’incertitude vient de l’audit anglais et non du mot grec correspondant.
