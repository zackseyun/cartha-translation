translation:
  language: fr
  text: 'Mais la voie du Noir[a] est tortueuse et pleine de malédiction. Car c’est une voie de mort éternelle, avec châtiment, où se trouvent les choses qui détruisent l’âme : l’idolâtrie, l’insolence, l’orgueil de la puissance, l’hypocrisie, la duplicité du cœur, l’adultère, le meurtre, le pillage, l’orgueil, la transgression, la tromperie, la méchanceté, l’obstination, la sorcellerie, la magie, l’avidité, l’absence de crainte de Dieu ;


    persécuteurs des gens de bien, ennemis de la vérité, amis du mensonge, ne discernant pas la récompense de la justice, ne s’attachant ni au bien ni au jugement juste, sans égard pour la veuve et l’orphelin, vigilants non par crainte de Dieu, mais pour le mal ; des gens chez qui la douceur et la patience sont très éloignées ; aimant les choses vaines, recherchant une récompense, sans pitié pour le pauvre, ne se donnant pas de peine pour celui qui peine, prompts à calomnier, ne reconnaissant pas celui qui les a créés, meurtriers d’enfants, corrupteurs de la créature de Dieu, se détournant de celui qui est dans le besoin, opprimant l’affligé, défenseurs des riches, juges injustes envers les pauvres, pécheurs en toutes choses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Noir » traduit littéralement une désignation personnifiée du mal dans le texte ancien. Elle peut aussi être rendue par « le Ténébreux »; le passage ne l’identifie pas explicitement.
    reason: Préserver l’image et l’ambiguïté du texte sans imposer l’identification « le diable ».
lexical_decisions:
- source_word: Black One
  choice: le Noir
  rationale: Conserve la personnification et l’image chromatique du témoin fourni, sans l’identifier explicitement à une figure théologique précise.
- source_word: crooked
  choice: tortueuse
  rationale: Rend naturellement en français l’opposition morale entre les deux voies.
- source_word: boldness
  choice: insolence
  rationale: Dans une liste de vices, « insolence » exprime mieux la hardiesse condamnable que le neutre « audace ».
- source_word: exhalation of power
  choice: exaltation de la puissance
  rationale: Le témoin anglais présente une formulation insolite, probablement textuellement incertaine. Cette traduction reste proche tout en étant intelligible, et l’incertitude est signalée en note.
- source_word: doubleness of heart
  choice: duplicité du cœur
  rationale: Préserve l’anthropologie morale et l’image du cœur partagé ou double.
- source_word: covetousness
  choice: avidité
  rationale: Terme moderne assez large pour couvrir la convoitise cupide.
- source_word: wakeful
  choice: veillant
  rationale: Conserve la métaphore de la vigilance dirigée vers le mal plutôt que vers la crainte de Dieu.
- source_word: pursuing a recompense
  choice: recherchant le gain
  rationale: Exprime la poursuite intéressée d’une rétribution sans préciser davantage sa nature.
- source_word: creatures of God
  choice: créatures de Dieu
  rationale: Maintient l’expression théologique générale du témoin sans la restreindre à une catégorie particulière.
theological_decisions:
- issue: Identité du « Noir »
  choice: Maintien de la désignation « le Noir »
  alternative: « le Malin » ou « le diable »
  rationale: Le témoin fourni emploie une épithète chromatique personnifiée. La remplacer par une identification explicite résoudrait une ambiguïté que les données disponibles ne permettent pas de trancher.
- issue: Portée de la mort éternelle et du châtiment
  choice: « une voie de mort éternelle accompagnée de châtiment »
  alternative: « la voie du châtiment de la mort éternelle »
  rationale: La formulation retenue reproduit les deux éléments du témoin sans préciser dogmatiquement leur relation exacte.
- issue: « Celui qui les a faits »
  choice: Pronom référant implicitement à Dieu
  alternative: « Dieu, leur Créateur »
  rationale: Le pronom conserve la formulation du témoin et évite une explicitation inutile, tout en restant compréhensible dans le contexte.
- issue: Meurtre des enfants
  choice: « meurtriers d’enfants »
  alternative: « ceux qui font périr leurs enfants »
  rationale: La traduction garde la formulation générale et accusatrice du témoin sans spécifier une pratique historique particulière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue accumulation rhétorique et la transition vers les désignations de personnes sont conservées. Projet nécessairement provisoire, puisque le dossier indique qu’une vérification directe des témoins grecs et latins reste à faire.
