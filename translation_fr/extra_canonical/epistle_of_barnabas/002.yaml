  footnotes:
  - marker: a
    text: L’expression peut aussi se rendre par « l’Actif ». Son référent exact reste incertain dans le témoin utilisé ; l’examen direct des témoins grecs et latins est encore nécessaire.
    reason: Le titre est potentiellement significatif sur le plan théologique et ne doit pas être identifié silencieusement.
lexical_decisions:
- source_word: the Active One (Greek source review pending)
  choice: celui qui est à l’œuvre
  rationale: Rend le sens actif du titre sans fabriquer un nom divin français peu naturel ; une note conserve l’incertitude du témoin anglais.
- source_word: ordinances
  choice: prescriptions
  rationale: Terme courant et digne qui évoque des directives établies sans présumer qu’il s’agit uniquement de commandements juridiques.
- source_word: long-suffering
  choice: persévérance
  rationale: Dans cette série de vertus, le français naturel demande un terme exprimant l’endurance prolongée ; « longanimité » serait plus formel mais moins accessible.
- source_word: science
  choice: science
  rationale: Conserve la distinction quadruple du témoin entre sagesse, intelligence, science et connaissance, sans réduire prématurément le champ du terme ancien.
- source_word: oblation
  choice: offrande
  rationale: « Offrande » est intelligible en français moderne et maintient le vocabulaire cultuel sans archaïsme inutile.
- source_word: not made by human hands
  choice: qui ne soit pas faite de main humaine
  rationale: Préserve l’expression religieuse traditionnelle et son contraste avec les offrandes matérielles.
- source_word: the Evil One
  choice: le Mauvais
  rationale: Conserve la personnification et le titre tout en distinguant cette expression de « celui qui est à l’œuvre » au début.
theological_decisions:
- issue: Identité de « celui qui est à l’œuvre »
  choice: Traduction descriptive avec note d’incertitude
  alternative: « l’Actif » ou identification explicite avec Dieu ou le diable
  rationale: Le témoin fourni présente un titre ambigu ; la traduction ne doit pas imposer une identification théologique avant l’examen direct du grec et du latin.
- issue: Abolition des sacrifices et « loi nouvelle »
  choice: Conserver l’affirmation forte « il a aboli ces choses »
  alternative: Atténuer en « il les a écartées » ou expliquer une continuité cultuelle
  rationale: Le texte établit lui-même une tension entre les anciennes pratiques et l’offrande non faite de main humaine ; elle doit rester visible sans harmonisation confessionnelle.
- issue: « La pensée qui procède de la bonté de notre Père »
  choice: Conserver le lien entre la pensée/intention et la bonté du Père
  alternative: « comprendre la bonté de la pensée de notre Père »
  rationale: La syntaxe du témoin est inhabituelle ; cette formulation française reste intelligible sans transformer la phrase en thèse doctrinale plus précise.
- issue: Nature du « cœur brisé »
  choice: Maintenir l’image littérale
  alternative: « cœur contrit »
  rationale: « Cœur brisé » demeure compréhensible, rejoint la formulation scripturaire sous-jacente et évite de limiter l’expression à un vocabulaire pénitentiel spécialisé.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les citations prophétiques gardent leur rythme solennel sans tournures archaïques. Le présent projet repose sur le témoin anglais public fourni, la vérification directe des sources grecques et latines étant signalée comme encore à faire ; les choix particulièrement incertains ont donc été formulés avec prudence.
