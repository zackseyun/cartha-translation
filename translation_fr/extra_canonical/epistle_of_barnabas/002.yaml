base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: fr
  text: 'Puisque les jours sont mauvais et que celui qui est à l’œuvre[a] détient lui-même le pouvoir, nous devons veiller sur nous-mêmes et rechercher les prescriptions du Seigneur.


    Les soutiens de notre foi sont donc la crainte et la patience, et nos alliées, la persévérance et la maîtrise de soi.


    Tant que ces vertus demeurent dans un esprit pur pour tout ce qui concerne le Seigneur, la sagesse, l’intelligence, la science et la connaissance se réjouissent avec elles.


    En effet, il nous a révélé par tous les prophètes qu’il ne veut ni sacrifices, ni holocaustes, ni offrandes. Il dit ainsi en un certain endroit :


    « Que m’importe la multitude de vos sacrifices ? dit le Seigneur. Je suis rassasié d’holocaustes ; je ne désire ni la graisse des agneaux, ni le sang des taureaux et des boucs, pas même si vous venez vous présenter devant moi. Qui vous a demandé cela ? Vous ne continuerez plus à fouler les parvis de mon temple. Si vous apportez de la fleur de farine, c’est en vain ; l’encens m’est abominable. Vos nouvelles lunes et vos sabbats, je ne peux les supporter. »


    Il a donc aboli ces choses afin que la loi nouvelle de notre Seigneur Jésus Christ, affranchie du joug de la contrainte, ait une offrande qui ne soit pas faite de main humaine.


    Il leur dit encore : « Ai-je commandé à vos pères, lorsqu’ils sont sortis du pays d’Égypte, de m’apporter des holocaustes et des sacrifices ?


    « Non. Voici ce que je leur ai commandé : Qu’aucun de vous ne garde dans son cœur une rancune mauvaise contre son prochain, et n’aimez pas le faux serment. »


    À moins d’être dépourvus d’intelligence, nous devons donc discerner la pensée qui procède de la bonté de notre Père. Car il nous parle : il désire que nous ne nous égarions pas comme eux, mais que nous cherchions comment nous approcher de lui.


    Voici donc ce qu’il nous dit : « Le sacrifice offert à Dieu, c’est un cœur brisé ; le parfum agréable au Seigneur, c’est un cœur qui glorifie celui qui l’a créé. » Nous devons donc, frères, acquérir une connaissance exacte de notre salut, de peur que le Mauvais, en ouvrant en nous une porte à l’erreur, ne nous rejette loin de notre vie.'
