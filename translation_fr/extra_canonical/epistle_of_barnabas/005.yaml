  yaml_path: translation/extra_canonical/epistle_of_barnabas/005.yaml
  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
translation:
  language: fr
  text: 'C’est dans ce but que le Seigneur a accepté de livrer sa chair à la corruption[a] : afin que nous soyons purifiés par le pardon des péchés, purification qui s’accomplit par le sang dont il nous asperge[b].


    En effet, l’Écriture qui le concerne contient certains passages qui se rapportent à Israël et d’autres qui se rapportent à nous. Elle dit : « Il a été blessé à cause de vos transgressions et meurtri à cause de nos péchés ; par ses blessures, nous avons été guéris. Comme une brebis, il a été conduit à l’abattoir ; comme un agneau reste muet devant celui qui le tond. »


    Nous devons donc être profondément reconnaissants envers le Seigneur : il nous a révélé le passé, il nous a donné la sagesse pour comprendre le présent et il ne nous a pas laissés sans intelligence au sujet de l’avenir.


    Or l’Écriture dit : « Ce n’est pas sans raison que le filet est tendu devant les oiseaux. » Cela signifie qu’une personne périra à juste titre si, tout en connaissant le chemin de la justice, elle s’engage délibérément dans le chemin des ténèbres.


    Considérez encore ceci, mes frères : si le Seigneur a accepté de souffrir pour nos âmes, alors qu’il est le Seigneur du monde entier — lui à qui Dieu a dit dès la fondation du monde : « Faisons l’être humain à notre image et à notre ressemblance » —, comment a-t-il pu accepter de souffrir de la main des êtres humains ?


    Comprenez-le bien. Les prophètes, ayant reçu de lui la grâce, ont prophétisé à son sujet. Mais lui-même a accepté de souffrir afin de détruire la mort et de manifester la résurrection des morts, car il devait se manifester dans la chair.


    Il voulait en même temps accomplir la promesse faite aux pères[c] et se préparer un peuple nouveau. Ainsi, pendant qu’il était sur la terre, il a montré qu’après avoir réalisé la résurrection, il exercerait lui-même le jugement.


    De plus, il a proclamé son message en enseignant Israël et en accomplissant tant de prodiges et de miracles ; et il l’a aimé d’un amour immense.


    Puis il a choisi ses propres apôtres, destinés à proclamer son Évangile. C’étaient des hommes coupables des péchés les plus graves[d] : il voulait ainsi montrer qu’il n’était pas venu appeler les justes, mais les pécheurs. C’est alors qu’il a manifesté qu’il était le Fils de Dieu.


    En effet, s’il n’était pas venu dans la chair, les êtres humains n’auraient pas pu le contempler et être sauvés. Ils sont déjà incapables de regarder en face les rayons du soleil, qui pourtant cessera un jour d’exister et n’est que l’œuvre de ses mains.


    Le Fils de Dieu est donc venu dans la chair afin de porter à leur comble les péchés de ceux qui avaient persécuté et tué ses prophètes[e].


    Voilà donc pourquoi il a accepté de souffrir. Car Dieu dit que les blessures infligées à sa chair venaient d’eux : « Quand ils frapperont leur propre berger, les brebis du troupeau seront dispersées[f]. »


    Mais lui-même a voulu souffrir ainsi, car il devait souffrir sur un arbre[g]. Celui qui a prophétisé a dit à son sujet : « Épargne mon âme, délivre-la de l’épée », et : « Percez ma chair de clous, car des assemblées de malfaiteurs se sont dressées contre moi. »


    Il dit encore : « Voici, j’ai livré mon dos aux coups et mes joues aux gifles ; j’ai rendu mon visage aussi dur que le roc. »'
