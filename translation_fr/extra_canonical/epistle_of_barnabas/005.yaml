  footnotes:
  - marker: a
    text: « Corruption » peut désigner ici la destruction ou la décomposition du corps, et donc la mort.
    reason: Le terme est plus large que « mort » et son image concrète mérite d’être conservée.
  - marker: b
    text: 'Littéralement : « par le sang de son aspersion ». L’expression évoque les rites bibliques de purification par aspersion de sang.'
    reason: La tournure littérale est difficile en français, mais l’image cultuelle est interprétativement importante.
  - marker: c
    text: 'On peut aussi comprendre : « donner effet à la promesse faite aux pères ».'
    reason: Le verbe sous-jacent et la tradition de traduction permettent plusieurs nuances entre accomplir, acquitter et rendre effective une promesse.
  - marker: d
    text: 'Littéralement, selon le témoin suivi : « pécheurs au-delà de tout péché » ; cette expression très forte peut aussi signifier qu’ils passaient pour les pires pécheurs.'
    reason: La formulation ancienne est hyperbolique et ne doit être ni banalisée ni transformée en jugement biographique précis sur chaque apôtre.
  - marker: e
    text: 'Le texte peut aussi être rendu plus littéralement : « récapituler la totalité de leurs péchés contre ceux qui avaient persécuté et tué ses prophètes ». Le sens probable est que ces péchés atteignent leur pleine mesure.'
    reason: La syntaxe transmise et le verbe employé sont difficiles ; la note préserve une réelle ambiguïté.
  - marker: f
    text: Le témoin anglais porte « seront perdues » ; la citation biblique correspond toutefois à l’idée de dispersion du troupeau.
    reason: Le choix « dispersées » restitue plus directement l’écho à Zacharie 13.7 tout en signalant la divergence du témoin fourni.
  - marker: g
    text: « Arbre » peut également se traduire par « bois ». Dans l’usage chrétien ancien, le mot désigne ici la croix sans la nommer directement.
    reason: Évite d’effacer l’écho scripturaire en remplaçant directement le terme par « croix ».
lexical_decisions:
- source_word: εἰς καταφθοράν / “unto corruption”
  choice: à la corruption
  rationale: Conserve le champ sémantique de la destruction et de la décomposition corporelle sans réduire l’expression à la seule mort.
- source_word: αἷμα τοῦ ῥαντίσματος / “blood of his sprinkling”
  choice: le sang dont il nous asperge
  rationale: Rend naturellement l’image cultuelle de l’aspersion tout en maintenant le lien entre le sang et la purification.
- source_word: ἀνακεφαλαιώσηται / “sum up the complete tale”
  choice: porter à leur comble
  rationale: Dans ce contexte de péchés accumulés, cette formulation française exprime leur pleine mesure plutôt qu’un simple résumé intellectuel.
- source_word: ξύλον / “tree”
  choice: arbre
  rationale: Préserve l’image ancienne et l’écho scripturaire ; « croix » expliciterait une référence que le texte formule par « arbre/bois ».
- source_word: σαρκί / “in the flesh”
  choice: dans la chair
  rationale: Maintient le vocabulaire incarnatoire concret et récurrent du passage.
theological_decisions:
- issue: Lien entre le pardon, la purification et l’aspersion du sang
  choice: Conserver les trois éléments sans élaborer un mécanisme doctrinal
  alternative: Paraphraser en termes d’expiation ou de justification
  rationale: Le passage associe ces images, mais ne définit pas ici leur articulation systématique.
- issue: Identité du Seigneur dans la parole créatrice de Genèse 1.26
  choice: Conserver « lui à qui Dieu a dit »
  alternative: Identifier explicitement l’interlocuteur comme le Fils préexistant
  rationale: Le contexte conduit à cette lecture christologique, mais la traduction ne doit pas ajouter une désignation absente de la formulation.
- issue: Apôtres décrits comme pécheurs extrêmes
  choice: « coupables des péchés les plus graves » avec note
  alternative: Atténuer en « des pécheurs ordinaires »
  rationale: La formulation choquante du témoin doit rester perceptible ; elle sert l’opposition entre justes et pécheurs.
- issue: Résurrection et jugement exercé par le Christ
  choice: Maintenir la succession et le sujet explicite « lui-même »
  alternative: Rendre le jugement impersonnel ou attribué seulement à Dieu
  rationale: Le passage attribue expressément au Seigneur l’exercice futur du jugement.
- issue: Les péchés portés à leur comble
  choice: Les rapporter à ceux qui ont persécuté et tué les prophètes
  alternative: Comprendre que le Fils récapitule ou expie leurs péchés
  rationale: La syntaxe et le contexte accusatoire favorisent l’idée d’une mesure de péchés arrivée à son comble, tout en signalant l’incertitude textuelle en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les longues périodes ont été légèrement segmentées pour la lisibilité, sans supprimer les enchaînements argumentatifs. Les citations gardent une tonalité scripturaire sobre. Comme l’examen direct complet des témoins grecs et latins est signalé comme restant à faire, les endroits textuellement ou syntaxiquement fragiles sont traduits avec prudence et, lorsque nécessaire, accompagnés d’une note.
