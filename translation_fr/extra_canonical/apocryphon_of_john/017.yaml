  footnotes:
  - marker: a
    text: Certains témoins modernes restituent le nom sous la forme « Ialdabaoth » ou « Yaldabaoth ».
    reason: Signaler la variation de translittération reflétée par les chevrons du témoin anglais.
  - marker: b
    text: « Éloïm » et « Yavé » transcrivent ici les noms propres donnés aux deux fils dans ce récit ; le passage les identifie ensuite trompeusement à Caïn et Abel.
    reason: Éviter que les formes familières soient automatiquement harmonisées avec leurs usages bibliques habituels.
  - marker: c
    text: L’identité de celui que désigne « Il » n’est pas explicitée dans cette phrase.
    reason: Préserver l’ambiguïté du sujet grammatical au verset 14.
lexical_decisions:
- source_word: Reflection
  choice: Réflexion
  rationale: Conserve le terme abstrait personnifié du témoin, plutôt que de le remplacer par « pensée » ou un terme doctrinal plus interprétatif.
- source_word: Providence
  choice: Providence
  rationale: Rend la figure personnifiée de manière formellement proche et naturelle en français théologique.
- source_word: chief archon
  choice: archonte en chef
  rationale: Maintient le terme technique « archonte » tout en exprimant clairement la fonction supérieure.
- source_word: polluted
  choice: souilla
  rationale: Préserve la force morale et rituelle du verbe sans préciser davantage la nature de l’acte que ne le fait le témoin fourni.
- source_word: false spirit
  choice: esprit trompeur
  rationale: « Trompeur » exprime ici la fonction mensongère de l’esprit dans un français naturel, sans suggérer qu’il serait simplement inexistant.
- source_word: Fullness
  choice: Plénitude
  rationale: Équivalent français consacré et intelligible du terme cosmologique, conservé comme réalité personnifiée ou nommée par la majuscule.
- source_word: aeons
  choice: éons
  rationale: Conserve le vocabulaire cosmologique propre au texte plutôt que de le réduire à de simples « âges ».
- source_word: precognition
  choice: prescience
  rationale: Rend l’idée de connaissance préalable sans l’assimiler à la Providence déjà nommée ailleurs.
- source_word: simulacrum
  choice: représentation
  rationale: Évite la connotation exclusivement péjorative de « simulacre » en français actuel, que le contexte n’impose pas clairement.
- source_word: tomb
  choice: tombeau
  rationale: Préserve l’image singulière et énigmatique du témoin au lieu de l’interpréter comme le monde matériel ou le corps.
theological_decisions:
- issue: Statut de la Réflexion, de la Providence, de la Vie et de la Plénitude
  choice: Majuscules et formulations personnifiées conservées
  alternative: Les rendre comme de simples qualités abstraites en minuscules
  rationale: Le récit leur attribue des actions et une fonction cosmologique ; la traduction conserve cette personnification sans définir leur statut doctrinal.
- issue: Nature de la souillure d’Ève
  choice: « la souilla »
  alternative: Expliciter un viol ou, à l’inverse, parler seulement d’une union
  rationale: Le témoin associe l’acte à l’engendrement mais ne formule pas ici explicitement toutes ses modalités ; il convient de ne ni atténuer ni surinterpréter.
- issue: Rapports entre Éloïm/Yavé et Caïn/Abel
  choice: Conserver l’affirmation interne selon laquelle les seconds noms sont donnés pour tromper
  alternative: Harmoniser ces figures avec les identités bibliques traditionnelles
  rationale: Le texte présente délibérément une réinterprétation tendue du récit de la Genèse ; cette tension ne doit pas être résolue.
- issue: Référent du sujet au verset 14
  choice: Maintenir le pronom « Il » et signaler son ambiguïté
  alternative: Nommer explicitement l’archonte en chef
  rationale: L’antécédent immédiat demeure incertain dans le témoin fourni.
- issue: Référent de l’objet relevé et guéri au verset 15
  choice: Accorder les pronoms avec « la semence »
  alternative: Introduire explicitement une personne ou le genre humain
  rationale: La semence est l’antécédent grammatical disponible en français, mais la traduction n’ajoute aucune identité doctrinale à cette figure collective.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes cosmologiques propres au texte (« archonte », « éons », « Plénitude ») sont conservés. Les repères de pages manuscrites « 24 » et « 25 », qui interrompaient les phrases, ne figurent pas dans le corps du texte. Le travail repose provisoirement sur le témoin anglais public fourni ; une collation directe des témoins coptes reste nécessaire, notamment pour confirmer les pronoms, les liens syntaxiques et certains termes techniques.
