  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: fr
  text: '**L’archonte en chef souille Ève**


    1. Je suis apparu sous la forme d’un aigle sur l’arbre de la connaissance, qui est la Réflexion de la Providence de la Lumière pure, afin de les instruire et de les tirer de leur profond sommeil. En effet, tous deux étaient tombés et avaient pris conscience de leur nudité.


    2. La Réflexion leur apparut sous la forme d’une lumière et éveilla leur pensée. Mais lorsque Yaldabaoth[a] se rendit compte qu’ils s’étaient détournés de lui, il maudit sa terre.


    3. Il rencontra la femme tandis qu’elle se préparait pour son mari.


    4. Il était son maître, bien qu’il ne connût pas le mystère qui s’était accompli par le décret sacré. Ils avaient peur de l’accuser. Il manifesta à ses anges l’ignorance qui était en lui, les chassa du paradis et les revêtit de ténèbres obscures.


    5. L’archonte en chef vit aussi la vierge qui se tenait près d’Adam, et il vit que la lumineuse Réflexion de la Vie était apparue en elle. Yaldabaoth fut rempli d’ignorance. Lorsque la Providence du Tout vit cela, elle envoya des messagers, qui retirèrent rapidement la Vie hors d’Ève.


    6. Alors l’archonte en chef la souilla et engendra avec elle deux fils, le premier et le second : Éloïm et Yavé[b].


    7. Éloïm a le visage d’un ours, tandis que Yavé a le visage d’un chat.


    8. Yavé est juste, mais Éloïm est injuste.


    9. Yavé fut établi sur le feu et le vent, tandis qu’Éloïm fut établi sur l’eau et la terre. Mais, dans l’intention de tromper, il leur donna les noms de Caïn et Abel.


    10. Jusqu’à aujourd’hui, les rapports sexuels se sont poursuivis à cause de l’archonte en chef. C’est lui qui a implanté le désir sexuel dans celle qui appartient à Adam. Par les rapports sexuels, il fit des copies des corps et leur insuffla son esprit trompeur.


    11. Il établit cependant les deux archontes sur plusieurs principautés, afin qu’ils règnent sur le tombeau.


    12. Mais lorsqu’Adam prit conscience de l’image de sa propre prescience, il engendra l’image du Fils de l’homme, qu’il appela Seth, conformément à la manière dont la race existe parmi les éons.


    13. De même, la mère fit aussi descendre son esprit, qui est à sa propre image, ainsi qu’une représentation de celui qui demeure dans la Plénitude, car elle préparera une demeure pour les éons qui descendront.


    14. Il leur fit aussi boire l’eau d’oubli provenant de l’archonte en chef[c], afin qu’ils ne connaissent pas le lieu de leur origine.


    15. Ainsi, la semence demeura un certain temps pour apporter de l’aide, afin que, lorsque l’Esprit sortira des éons sacrés, il la relève et la guérisse de ce qui lui manque, pour que la Plénitude tout entière devienne sainte et irréprochable. »


    [a] Certains témoins modernes restituent le nom sous la forme « Ialdabaoth » ou « Yaldabaoth ».


    [b] « Éloïm » et « Yavé » transcrivent ici les noms propres donnés aux deux fils dans ce récit ; le passage les identifie ensuite trompeusement à Caïn et Abel.


    [c] L’identité de celui que désigne « Il » n’est pas explicitée dans cette phrase.'
