review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour corriger plusieurs interprétations qui dépassent le témoin anglais fourni : « Il ne savait pas ce qu’il faisait » ajoute un objet absent ; « de peur que les puissances ne prennent le contrôle » transforme le lien causal et fixe le sujet implicite ; « Pensée lumineuse » ne rend pas directement Radiant Reflection / Reflection of Light. La version révisée maintient les ambiguïtés. La vérification directe du copte reste en attente, conformément au dossier.'
  naturalness: Le français du projet est généralement fluide et d’un registre approprié. La révision conserve cette lisibilité tout en préférant « Souffle ... sur son visage », « Réflexion rayonnante » et « Réflexion de lumière », plus proches du témoin sans être artificiels.
  terminology: « Corps psychique », « archonte suprême », « Père-Mère du Tout » et « ombre lumineuse » sont maintenus. Les deux désignations de l’aide sont rendues de manière cohérente et littérale par « Réflexion rayonnante » et « Réflexion de lumière », avec une note terminologique.
  issues:
  - severity: medium
    issue: Ajout interprétatif à propos de Yaltabaoth
    rationale: « Il ne savait pas ce qu’il faisait » introduit « ce qu’il faisait », absent de « He was unaware, because he exists in ignorance ». « Il n’en eut pas conscience » reste plus près du texte.
  - severity: high
    issue: Modification du lien logique et du sujet implicite au paragraphe 7
    rationale: Le témoin dit « because they might acquire power over the psychic and sensory body ». « De peur que les puissances ne prennent le contrôle » transforme « parce que » en finalité préventive, identifie « ils » aux puissances et renforce « acquire power » en « prendre le contrôle ».
  - severity: medium
    issue: Rendu non littéral de Radiant Reflection / Reflection of Light
    rationale: « Pensée lumineuse » est une interprétation technique possible, mais le témoin fourni emploie explicitement « Reflection ». « Réflexion rayonnante » / « Réflexion de lumière » préserve les deux titres apparentés sans imposer leur identification à Épinoia.
  - severity: low
    issue: Résolution indue de l’ambiguïté de la voie de descente
    rationale: La formulation « celle-là même par laquelle elle était descendue » attribue explicitement la descente à la voie. Une formulation impersonnelle conserve l’incertitude du pronom anglais.
  revised_text: 'Cependant, tous les anges et les démons travaillèrent jusqu’à ce qu’ils aient formé le corps psychique[a]. Leur création resta entièrement inerte et immobile pendant longtemps.


    Mais lorsque la Mère voulut reprendre la puissance qu’elle avait accordée à l’archonte suprême, elle supplia le Très-Miséricordieux, le Père-Mère du Tout.


    Par le décret sacré, celui-ci envoya les cinq lumières vers le lieu des anges de l’archonte suprême. Elles le conseillèrent afin qu’ils fassent sortir la puissance de la Mère, et elles dirent à Yaltabaoth : « Souffle de ton Esprit sur son visage, et son corps se lèvera. » Il souffla sur son visage son Esprit, qui est la puissance de sa mère.


    Il n’en eut pas conscience, car il existe dans l’ignorance. La puissance de la Mère sortit alors de Yaltabaoth et entra dans le corps psychique qu’ils avaient formé à l’image de celui qui existe depuis le commencement.


    Le corps se mit en mouvement, acquit de la force et devint rayonnant. Alors, les autres puissances furent saisies de jalousie, parce qu’il était venu à l’existence par elles toutes et qu’elles avaient transmis leur puissance à l’être humain. Son intelligence surpassait celle de ceux qui l’avaient fait, ainsi que celle de l’archonte suprême.


    Quand elles virent qu’il rayonnait, qu’il raisonnait mieux qu’elles et qu’il était sans mal, elles le saisirent et le précipitèrent dans la région la plus basse de toute la matière.


    Mais le Bienheureux, le Père-Mère bienfaisant et miséricordieux, eut compassion de la puissance de la Mère qui était sortie du chef souverain, parce qu’ils pourraient acquérir du pouvoir sur le corps psychique et sensible. Par son Esprit bienfaisant et dans sa grande miséricorde, il envoya à Adam une aide : la Réflexion rayonnante[b], qui sort de lui et qui est appelée « Vie ».


    Elle aide toute la création en travaillant avec lui, en le rétablissant dans sa perfection et en l’instruisant sur la descente de sa descendance. Elle l’instruit aussi sur la voie de l’ascension, la voie par laquelle s’était faite la descente[c].


    De plus, la Réflexion de lumière fut cachée à l’intérieur d’Adam afin que les archontes demeurent dans l’ignorance. Cette Réflexion devait remédier à ce qui manquait à la Mère. L’être humain devint visible à cause de l’ombre lumineuse[d] qui était en lui, et son intelligence surpassa celle de tous ceux qui l’avaient fait.'
