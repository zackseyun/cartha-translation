lexical_decisions:
- source_word: psychic body
  choice: corps psychique
  rationale: Conserve le vocabulaire anthropologique technique du témoin tout en l’expliquant en note, afin d’éviter le sens psychologique moderne.
- source_word: Mother-Father of the All
  choice: Père-Mère du Tout
  rationale: Préserve le titre composé, sa tension grammaticale et la portée cosmologique de « Tout ».
- source_word: chief archon
  choice: archonte suprême
  rationale: Maintient le terme technique « archonte » et rend naturellement son rang supérieur sans lui substituer un titre confessionnel.
- source_word: Radiant Reflection / Reflection of Light
  choice: Pensée lumineuse / Pensée de lumière
  rationale: Rend le concept comme une faculté ou réalité intellective personnifiée; une note signale les équivalents plus littéraux et le terme technique « Épinoia ».
- source_word: Life
  choice: Vie
  rationale: Traduit directement le nom ou titre tout en supprimant le balisage éditorial parasite « {Life:1} » du témoin anglais.
- source_word: light-shadow
  choice: ombre lumineuse
  rationale: Conserve le paradoxe du composé au lieu de le rationaliser.
theological_decisions:
- issue: Origine de l’animation d’Adam
  choice: La puissance de la Mère sort de Yaltabaoth et entre dans le corps psychique
  alternative: Yaltabaoth crée lui-même la vie d’Adam par sa propre puissance
  rationale: Le passage affirme que l’archonte transmet à son insu une puissance venue de sa mère; la traduction maintient cette distinction.
- issue: Finalité de l’envoi de l’aide à Adam
  choice: « de peur que les puissances ne prennent le contrôle »
  alternative: « parce qu’elles pourraient prendre le contrôle »
  rationale: Le lien logique paraît exprimer un danger motivant la compassion, mais l’identité du sujet reste partiellement implicite dans le témoin; « les puissances » explicite seulement le référent contextuel probable.
- issue: Genre et personnalité de la Pensée lumineuse
  choice: Référents féminins et majuscule au titre
  alternative: Formulation impersonnelle ou masculine
  rationale: Le témoin personnifie cette aide au féminin et l’identifie à « Vie »; la traduction respecte cette présentation sans développer une doctrine supplémentaire.
- issue: Référent de « the way by which it descended »
  choice: Traduction au féminin avec note d’ambiguïté
  alternative: Identifier sans réserve la descente à celle de la descendance ou de la Pensée
  rationale: La chaîne pronominale du témoin anglais est ambiguë; la note préserve les lectures possibles au lieu d’en imposer une.
translation_notes:
  register: Français international moderne, digne et accessible. Les termes techniques indispensables (« archonte », « psychique ») sont conservés et brièvement expliqués. La syntaxe très coordonnée du témoin a été légèrement segmentée pour la lisibilité sans modifier la progression du récit. Le numéro de page intrusif « 20 » et le balisage éditorial « {Life:1} » ont été omis. Ce projet demeure provisoire, car il repose sur le témoin anglais public fourni et attend une vérification directe des témoins coptes.
