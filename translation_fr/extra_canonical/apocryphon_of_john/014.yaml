    When, however, the mother wished to regain the power she had granted to the chief archon, she entreated the Most Merciful Mother-Father of the All.


    With the sacred decree, he dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, “Blow of your Spirit into his face, and his body will stand up.” And he blew into his face his Spirit, which is the power of his mother.


    He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.


    The body moved and attained strength, and it was radiant, and at that time the rest of «20» the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of) those who had made him, and the chief archon.


    When, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by evil, they took him up and thrust him down into the nethermost region of all matter.


    However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called “{Life:1}.”


    She, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.


    Further, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him.'
translation:
  language: fr
  text: 'Cependant, tous les anges et les démons travaillèrent jusqu’à ce qu’ils aient formé le corps psychique[a]. Leur création resta longtemps complètement inerte et immobile.


    Mais lorsque la Mère voulut reprendre la puissance qu’elle avait accordée à l’archonte suprême, elle supplia le Très-Miséricordieux, le Père-Mère du Tout.


    Par un décret sacré, celui-ci envoya les cinq lumières vers le lieu où se trouvaient les anges de l’archonte suprême. Elles lui conseillèrent de faire sortir la puissance de la Mère et dirent à Yaltabaoth : « Insuffle de ton Esprit dans son visage, et son corps se lèvera. » Il insuffla donc dans son visage son Esprit, qui est la puissance de sa mère.


    Il ne savait pas ce qu’il faisait, car il demeure dans l’ignorance. Alors, la puissance de la Mère sortit de Yaltabaoth et entra dans le corps psychique qu’ils avaient formé à l’image de Celui qui existe depuis le commencement.


    Le corps se mit en mouvement, acquit de la force et devint rayonnant. Alors, les autres puissances furent saisies de jalousie : en effet, il avait reçu l’existence par leur concours à toutes, et elles avaient transmis leur puissance à l’être humain. Son intelligence surpassait celle de ses créateurs, ainsi que celle de l’archonte suprême.


    Quand elles virent qu’il rayonnait, qu’il raisonnait mieux qu’elles et qu’il était sans mal, elles le saisirent et le précipitèrent dans la région la plus basse de toute la matière.


    Mais le Bienheureux, le Père-Mère bienfaisant et miséricordieux, eut compassion de la puissance de la Mère qui était sortie de l’archonte suprême, de peur que les puissances ne prennent le contrôle du corps psychique et sensible. Par son Esprit bienfaisant et dans sa grande miséricorde, il envoya donc à Adam une aide : la Pensée lumineuse[b], qui provient de lui et que l’on appelle « Vie ».


    Elle vient en aide à toute la création : elle travaille avec Adam, le ramène à sa perfection et lui enseigne la descente de sa descendance. Elle lui enseigne aussi la voie de la remontée, celle-là même par laquelle elle était descendue[c].


    De plus, la Pensée de lumière fut cachée en Adam afin que les archontes n’en sachent rien. Cette Pensée devait réparer ce qui manquait à la Mère. L’être humain devint visible à cause de l’ombre lumineuse[d] qui était en lui, et son intelligence surpassa celle de tous ses créateurs.


    [a] Ici, « psychique » se rapporte à l’âme ou au principe qui anime le corps, et non à la psychologie au sens moderne.


    [b] « Pensée lumineuse » traduit un titre technique souvent rendu par « Épinoia lumineuse » ou « Réflexion lumineuse ».


    [c] Le pronom « elle » peut renvoyer à la voie, à la Pensée lumineuse ou à la descendance; le témoignage consulté ne permet pas de trancher avec certitude.


    [d] L’expression paradoxale « ombre lumineuse » est conservée telle quelle.'
