    12. The ninth is Yobel. «11»


    13. The tenth is Armoupieel.


    14. The eleventh is Melcheir-Adonein.


    15. The twelfth is Belias, who is over the depths of Hades.'
translation:
  language: fr
  text: '1. Il saisit et se créa d’autres éons au moyen d’une étincelle brillante qui existe encore maintenant. Il fut émerveillé par l’orgueil qui était en lui, et il engendra pour lui-même des puissances.


    4. Le premier porte le nom d’Athoth, que les générations appellent [le Moissonneur].[a]


    5. Le deuxième est Harmas, [qui est] le mauvais [œil].[b]


    6. Le troisième est Kalila-Oumbri.


    7. Le quatrième est Yabel.


    8. Le cinquième est Adonaiou, appelé Sabaoth.


    9. Le sixième est Caïn, que les générations humaines appellent le Soleil.


    10. Le septième est Abel.


    11. Le huitième est Abrisene.


    12. Le neuvième est Yobel.


    13. Le dixième est Armoupieel.


    14. Le onzième est Melcheir-Adonein.


    15. Le douzième est Belias, qui règne sur les profondeurs de l’Hadès.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Moissonneur » est une restitution du texte lacunaire transmise entre crochets par le témoin consulté.
    reason: Préserver visiblement le caractère incertain de cette lecture.
  - marker: b
    text: 'Le témoin consulté présente ici une formulation restaurée et incertaine : « [qui est] le mauvais [œil] ».'
    reason: Signaler les éléments suppléés dans un passage textuellement difficile.
  - marker: c
    text: L’Hadès désigne ici les profondeurs du monde des morts; il ne faut pas nécessairement l’identifier à toutes les conceptions ultérieures de l’enfer.
    reason: Éviter une harmonisation théologique anachronique.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Le terme technique « éons » convient au cadre cosmologique du texte et évite de réduire ces entités à de simples périodes de temps.
- source_word: authorities
  choice: puissances
  rationale: « Puissances » rend naturellement des êtres ou pouvoirs cosmiques, sans imposer la nuance principalement administrative d’« autorités ».
- source_word: the Reaper
  choice: le Moissonneur
  rationale: Cette traduction conserve l’image d’un personnage qui moissonne; la restitution conjecturale demeure signalée par les crochets.
- source_word: evil eye
  choice: mauvais œil
  rationale: Expression française usuelle qui préserve l’ambiguïté entre un œil mauvais et le motif du mauvais œil.
- source_word: Hades
  choice: l’Hadès
  rationale: La translittération désigne le séjour infernal ou monde des morts sans l’assimiler automatiquement à l’enfer au sens doctrinal ultérieur.
theological_decisions:
- issue: Nature des « éons » et des « puissances »
  choice: Conserver le vocabulaire cosmologique technique sans explication doctrinale dans le corps du texte.
  alternative: Paraphraser par « mondes » et « autorités » ou « êtres spirituels ».
  rationale: Le passage présente une cosmologie particulière; une paraphrase résoudrait indûment la nature précise de ces réalités.
- issue: Fonction de Belias par rapport aux profondeurs de l’Hadès
  choice: « qui règne sur »
  alternative: « qui est au-dessus de » ou « qui est préposé aux »
  rationale: Le témoin anglais « is over » suggère une autorité, mais reste sémantiquement large. « Règne sur » donne un français clair tout en gardant l’idée de domination cosmique; la dépendance à un témoin indirect est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres sont translittérés d’après le témoin fourni, sauf Caïn, dont la forme française est consacrée. Les numéros discontinus sont conservés. Le numéro de page manuscrit « 11 » après Yobel est omis. Cette version demeure provisoire, car elle repose sur un témoin anglais du texte copte et la révision directe du copte reste à effectuer.
