  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: fr
  text: '1. Je demandai cependant : « Seigneur, que signifie : “elle allait et venait” ? » Il sourit et répondit : « Ne pense pas que cela corresponde à ce que Moïse a dit : “au-dessus des eaux”[a]. Non !


    2. En réalité, lorsqu’elle vit le mal qui s’était produit et le vol commis par son fils, elle se repentit. Elle fut accablée par l’oubli, au sein des ténèbres de l’ignorance, et commença à éprouver de la honte. [Elle n’osa pas] revenir, mais [elle errait] çà et là.


    3. Or ce mouvement consiste à « aller et venir ». Et l’orgueilleux obtint une puissance de sa mère, car il était ignorant et supposait que personne d’autre que sa mère n’existait.


    4. Mais lorsqu’il vit l’armée d’anges qu’il avait créée, il s’éleva au-dessus d’eux.


    5. De plus, quand la mère se rendit compte que le vêtement de ténèbres était défectueux, elle comprit que son compagnon n’avait pas été en accord avec elle.


    6. Elle se repentit en versant d’abondantes larmes, et toute la Plénitude prêta attention à sa prière de repentance. En sa faveur, ils adressèrent des louanges à l’Esprit invisible et virginal.


    7. Et [il] donna son accord. Lorsque [l’Esprit invisible] eut donné son accord, l’Esprit saint se répandit sur elle depuis toute leur Plénitude. En effet, son compagnon ne s’approcha pas d’elle seul : il s’approcha d’elle par l’intermédiaire de la Plénitude, afin de réparer ce qui lui manquait. Elle fut élevée, non pas jusqu’à son propre éon, mais au-dessus de son fils, afin de demeurer dans le Neuvième jusqu’à ce qu’elle ait réparé ce qui lui manquait.


    8. Une voix retentit aussi depuis l’éon céleste d’en haut : « L’Être humain existe, ainsi que le Fils de l’être humain. » L’archonte suprême, Yaltabaoth, l’entendit et supposa que la voix venait de sa mère, mais il ne savait pas d’où elle venait.


    9. Il leur montra aussi — c’est-à-dire la Mère-Père sainte et parfaite, la Providence parfaite, l’image de l’Invisible, qui est le Père du Tout, par qui tout est venu à l’existence, l’Être humain primordial —, car il manifesta son image sous une forme masculine.[b]


    10. Alors, tout l’éon de l’archonte suprême trembla, et les fondements de l’abîme furent ébranlés. Le fond des eaux, au-dessus de la matière, fut illuminé par l’apparition de cette image qui s’était manifestée. Lorsque toutes les autorités et l’archonte suprême regardèrent, ils virent toute la région située au-dessous d’eux illuminée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais fourni porte ici un repère éditorial attaché au mot « eaux » (« {waters:2} »). La présente traduction en conserve l’emplacement sans pouvoir en préciser la fonction avant examen direct des témoins coptes.
    reason: Signaler honnêtement un marqueur de l’édition source qui ne peut être reproduit tel quel comme texte courant français.
  - marker: b
    text: La syntaxe de cette phrase et les référents de « il », « leur » et « son » demeurent incertains dans le témoin de travail; la traduction évite donc de les identifier plus précisément.
    reason: Préserver une ambiguïté réelle du témoin au lieu d’imposer une lecture théologique ou narrative.
lexical_decisions:
- source_word: Fullness
  choice: Plénitude
  rationale: Terme cosmologique consacré et intelligible, conservant la portée technique du concept sans le réduire à une simple totalité.
- source_word: aeon
  choice: éon
  rationale: Translittération française usuelle qui préserve le sens cosmologique spécialisé, plutôt que de l’assimiler à une simple époque.
- source_word: chief archon
  choice: archonte suprême
  rationale: « Archonte » maintient le titre technique; « suprême » exprime ici la prééminence hiérarchique sans attribuer une souveraineté absolue.
- source_word: Mother-Father
  choice: Mère-Père
  rationale: Le composé avec trait d’union préserve l’unité paradoxale du titre et sa tension de genre.
- source_word: Man / Son of Man
  choice: Être humain / Fils de l’être humain
  rationale: Rend l’humanité générique du titre tout en évitant que « Homme » soit compris uniquement comme masculin; la majuscule signale la fonction titulaires dans ce passage.
- source_word: deficiency
  choice: ce qui lui manquait
  rationale: Formulation naturelle qui conserve l’idée de manque ou d’incomplétude sans imposer un vocabulaire doctrinal français plus technique que le témoin fourni.
- source_word: moved back and forth
  choice: allait et venait
  rationale: Expression française idiomatique qui garde le mouvement répété et permet l’explication donnée ensuite par le texte.
- source_word: garment of darkness
  choice: vêtement de ténèbres
  rationale: Traduction formelle de l’image cosmologique, sans l’interpréter comme un corps ou une substance précise.
theological_decisions:
- issue: Identité du sujet au début du paragraphe 7
  choice: Conserver « [il] » et « [l’Esprit invisible] » entre crochets
  alternative: Identifier sans réserve les deux sujets à l’Esprit invisible
  rationale: Le témoin signale une restauration et une clarification éditoriale; les crochets préservent l’incertitude textuelle au lieu de la résoudre silencieusement.
- issue: Rapport du compagnon avec la mère et la Plénitude
  choice: Maintenir qu’il s’approche d’elle « par l’intermédiaire de la Plénitude »
  alternative: Paraphraser comme une action collective de la Plénitude
  rationale: La formulation conserve la distinction et la médiation présentes dans le témoin, malgré leur difficulté conceptuelle.
- issue: Destination de la mère dans le Neuvième
  choice: Conserver « au-dessus de son fils » et « dans le Neuvième »
  alternative: Expliquer le Neuvième comme un ciel ou un éon déterminé
  rationale: Le texte ne fournit pas ici cette identification; une explicitation importerait une reconstruction cosmologique extérieure.
- issue: Genre de l’Être humain primordial
  choice: Traduire le titre de manière inclusive, puis conserver explicitement la manifestation « sous une forme masculine »
  alternative: Employer « Homme primordial » dans tout le passage
  rationale: Cette solution préserve la distinction interne du texte entre l’être humain archétypal et la forme masculine de sa manifestation.
- issue: Syntaxe et référents du paragraphe 9
  choice: Préserver l’apposition longue et ajouter une note sur l’incertitude
  alternative: Réorganiser la phrase en identifiant avec certitude le sujet, l’objet et les référents pronominaux
  rationale: La formulation du témoin est syntaxiquement ambiguë; une réécriture trop nette trancherait une question que la base disponible ne permet pas de résoudre.
translation_notes:
  register: Français international moderne, digne et accessible, avec maintien des termes cosmologiques nécessaires (« éon », « archonte », « Plénitude »). Les crochets signalant les restitutions ont été conservés. Le numéro de page manuscrit « 14 » a été omis comme élément non textuel. Le projet reste provisoire, car la base fournie est un témoin anglais du domaine public et la vérification directe du copte est encore en attente.
