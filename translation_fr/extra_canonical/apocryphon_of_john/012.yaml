review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le verbe de 1 était indûment renforcé (« Je demandai » au lieu de « Je dis »), « he grinned » était atténué, et « taught » en 9 avait été rendu par « montra ». La formulation de 7 est aussi resserrée pour mieux conserver la provenance (« de toute leur Plénitude ») et la portée de « alone ». Les restaurations entre crochets et les ambiguïtés de référents sont maintenues.'
  naturalness: Le français demeure moderne, lisible et d’un registre approprié à un écrit cosmologique ancien. « Il eut un rictus » rend plus précisément le sourire marqué du témoin sans attribuer une intention interprétative. « Aller et venir » maintient la répétition expliquée au verset 3.
  terminology: « Plénitude », « éon », « archonte suprême », « Mère-Père », « Providence », « Invisible » et « Neuvième » sont conservés. « Être humain » / « Fils de l’être humain » préserve la distinction du témoin entre le titre et la manifestation explicitement masculine. Le marqueur éditorial attaché à « eaux » est conservé sous sa forme source, sans lui inventer une signification.
  issues:
  - severity: medium
    issue: 'Paragraphe 1 : « Je demandai » et « Il sourit »'
    rationale: Le témoin dit « I ... said » et « he grinned ». « Je dis » et « il eut un rictus » sont plus fidèles sans modifier le sens.
  - severity: high
    issue: 'Paragraphe 9 : « Il leur montra »'
    rationale: Le témoin porte « He also taught them » ; « montra » substitue l’idée de révélation visuelle à celle d’enseignement.
  - severity: medium
    issue: 'Paragraphe 7 : provenance de l’effusion et portée de « alone »'
    rationale: « Depuis toute leur Plénitude » est moins naturel et moins exact que « de toute leur Plénitude » ; la construction révisée évite de faire de « seul » une simple précision de manière.
  - severity: low
    issue: Marqueur {waters:2}
    rationale: Le témoin de travail conserve un repère éditorial littéral. Le reproduire à l’emplacement correspondant est plus transparent que le remplacer par un appel de note dont la fonction ne peut être établie.
  revised_text: '1. Je dis cependant : « Seigneur, que signifie : “elle allait et venait” ? » Il eut un rictus et dit : « Ne pense pas que cela corresponde à ce que Moïse a dit : “au-dessus des {eaux:2}”. Non !


    2. Au contraire, lorsqu’elle eut vu le mal qui s’était produit et le vol que son fils avait commis, elle se repentit. Elle fut accablée par l’oubli au sein des ténèbres de l’ignorance et commença à ressentir de la honte. [Elle n’osait pas] revenir, mais [elle allait] çà et là.


    3. Or, le mouvement, c’est « aller et venir ». Et l’orgueilleux obtint une puissance de sa mère, car il était ignorant et supposait que personne d’autre que sa mère n’existait.


    4. Lorsqu’il vit cependant la troupe d’anges qu’il avait créée, il s’éleva alors au-dessus d’eux.


    5. De plus, lorsque la mère se rendit compte que le vêtement de ténèbres était défectueux, elle comprit que son compagnon n’était pas d’accord avec elle.


    6. Elle se repentit, versant d’abondantes larmes, et toute la Plénitude écouta sa prière de repentance. En sa faveur, ils louèrent l’Esprit invisible et virginal.


    7. Et [il] donna son accord. Mais lorsque [l’Esprit invisible] eut donné son accord, l’Esprit saint se répandit sur elle de toute leur Plénitude. Car ce n’est pas son compagnon qui s’approcha d’elle seul ; il s’approcha d’elle par l’intermédiaire de la Plénitude, afin de remédier à son manque. Elle fut élevée, non pas jusqu’à son propre éon, mais au-dessus de son fils, afin qu’elle demeure dans le Neuvième jusqu’à ce qu’elle ait remédié à son manque.


    8. Une voix sortit aussi de l’éon céleste élevé : « L’Être humain existe, ainsi que le Fils de l’être humain. » L’archonte suprême, Yaltabaoth, l’entendit et supposa que la voix venait de sa mère, mais il ne savait pas d’où elle était venue.


    9. Il leur enseigna aussi — c’est-à-dire la Mère-Père sainte et parfaite, la Providence parfaite, l’image de l’Invisible, qui est le Père du Tout, par qui tout est venu à l’existence, l’Être humain primordial —, parce que, sous une forme masculine, il manifesta sa ressemblance.


