lexical_decisions:
- source_word: Reflection of Light
  choice: Reflet de la Lumière
  rationale: Conserve l’image spéculaire et la personnification féminine du témoin, sans réduire le terme à une simple pensée ou réflexion mentale.
- source_word: chief archon
  choice: archonte suprême
  rationale: « Archonte » maintient le terme technique du récit, tandis que « suprême » exprime sa prééminence sans lui attribuer une souveraineté absolue.
- source_word: mold
  choice: moule
  rationale: Préserve l’image d’une forme servant à façonner un corps, plutôt que de la remplacer par « corps » ou « créature ».
- source_word: counterpart of his own image
  choice: celle qui correspondait à sa propre image
  rationale: Rend l’idée d’une figure correspondante sans imposer une identité stricte ni le terme moderne « alter ego ».
- source_word: cleave
  choice: s’attachera
  rationale: Formulation française biblique naturelle qui conserve l’idée d’un lien étroit et durable.
- source_word: deficiency
  choice: ce qui lui manquait
  rationale: Expression intelligible qui garde l’idée de manque constitutive du passage sans importer un vocabulaire doctrinal plus spécialisé.
- source_word: perfect knowledge
  choice: connaissance parfaite
  rationale: Traduction directe qui préserve la portée cognitive et sotériologique possible sans ajouter « gnose ».
theological_decisions:
- issue: Le récit conteste explicitement la lecture mosaïque de la côte.
  choice: 'Conserver : « et non “sa côte”, comme l’a dit Moïse »'
  alternative: Harmoniser le récit avec Genèse 2 ou atténuer la contradiction.
  rationale: La polémique appartient au texte et ne doit pas être résolue au profit du récit canonique.
- issue: Identité du « père et de la mère » dans la dernière phrase.
  choice: Conserver la formulation difficile et identifier la mère à Sophia par « c’est-à-dire », conformément au témoin.
  alternative: Réorganiser la syntaxe pour identifier avec certitude le père, la mère ou les deux.
  rationale: Le passage transmis est syntaxiquement tendu; il faut préserver cette difficulté plutôt que construire une cosmologie plus nette que le témoin.
- issue: Rôle de la Providence et du Reflet dans l’envoi de la compagne.
  choice: Maintenir les deux agents dans une construction coordonnée.
  alternative: Faire dépendre uniquement la Providence de l’envoi, ou rattacher le Reflet à une autre proposition.
  rationale: La syntaxe du témoin autorise difficilement une résolution certaine; la coordination garde cette tension.
- issue: Genre grammatical du Reflet personnifié.
  choice: Employer le féminin dans les pronoms référant au « Reflet ».
  alternative: Employer le masculin selon le genre grammatical français de « reflet ».
  rationale: Le témoin personnifie cette figure au féminin; l’accord sémantique inhabituel préserve cette donnée théologique et narrative.
translation_notes:
  register: Français international moderne, digne et lisible. Les échos de Genèse 2.23-24 sont formulés dans un registre biblique reconnaissable sans reproduire servilement une version confessionnelle. Le terme technique « archonte » est conservé. Cette proposition reste provisoire, car la base fournie est un témoin anglais du texte copte et la révision directe des codices coptes est annoncée comme encore en attente.
