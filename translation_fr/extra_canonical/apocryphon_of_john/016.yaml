base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: fr
  text: '1. Le Reflet de la Lumière se cacha alors en lui. L’archonte suprême voulut l’extraire de sa côte, mais le Reflet de la Lumière est insaisissable.


    2. Bien que les ténèbres l’aient poursuivie, elles ne purent l’attraper. Il tira de l’homme une part de sa puissance et façonna un autre moule, de forme féminine, à la ressemblance du Reflet qui lui était apparu. Il introduisit dans le moule féminin la part qu’il avait tirée de la puissance de l’homme — et non « sa côte », comme l’a dit Moïse — puis il vit la femme à côté de lui.


    3. À cet instant aussi, le Reflet radieux apparut. Elle souleva le voile qui avait recouvert son intelligence, et il retrouva sa lucidité après l’ivresse des ténèbres. Il reconnut celle qui correspondait à sa propre image et dit : « Cette fois, voici l’os de mes os et la chair de ma chair.


    4. C’est pourquoi l’homme quittera son père et sa mère, il s’attachera à sa femme, et tous deux deviendront une seule chair », car sa compagne lui sera envoyée. Il quittera son père et sa mère — c’est-à-dire Sophia, notre sœur, elle qui descendit dans l’innocence afin de réparer ce qui lui manquait et qui, pour cette raison, fut appelée « Vie », elle qui est « la mère des vivants »[a] — par la Providence de la souveraineté du Ciel et par [le Reflet qui lui apparut][b]. Par elle, ils ont goûté à la connaissance parfaite.'
  philosophy: optimal-equivalence
  footnotes:
