translation:
  language: fr
  text: '1. C’est pourquoi [nous ne] comprenons [pas les réalités indicibles et nous] ne comprenons pas ce qui [ne peut être mesuré], sinon par celui qui est issu de lui, c’est-à-dire [le] Père, car lui [seul] nous l’a [révélé]. En effet, c’est lui qui se contemple lui-même dans la lumière qui l’entoure, c’est-à-dire la source [d’]eau vive. C’est lui qui pourvoit à [chaque éon] et, dans toutes les directions à la fois, il [observe] son image en regardant dans la source de l’[Esprit].


    2. C’est lui qui dépose son désir dans son [eau]-lumière, [laquelle demeure dans] la source de l’[eau de pure lumière] qui l’entoure. Alors [sa pensée, jusque-là en puissance, devint] réalité, et elle s’approcha, [c’est-à-dire] celle qui était [apparue] devant lui dans [l’éclat de] sa lumière.


    3. Celle-ci est la première [Puissance, qui existait] avant le Tout et [qui émana] de sa pensée.


    4. Elle [est la Providence du Tout] — sa lumière [resplendit comme sa] lumière —, la Puissance [parfaite] qui est [l’]image de l’Esprit parfait, invisible et virginal.


    5. [La première Puissance] est la gloire de Barbelo, la gloire parfaite au sein des éons, la gloire de la révélation.


    6. Elle exalta l’Esprit virginal et le loua, car c’est grâce à lui qu’elle était venue à l’existence.


    7. Celle-ci est la première Pensée, son image.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Conserve le terme technique de la cosmologie du traité plutôt que de le réduire à « époque » ou « monde ».
- source_word: the All
  choice: le Tout
  rationale: Rend l’expression cosmologique comme totalité de ce qui existe, avec une majuscule signalant son emploi quasi technique.
- source_word: Providence
  choice: Providence
  rationale: Préserve la personnification féminine et son rôle cosmologique dans le passage.
- source_word: power
  choice: Puissance
  rationale: Le féminin français permet de maintenir naturellement les pronoms féminins associés à Barbelo; la majuscule marque ici un titre ou une hypostase.
- source_word: thought
  choice: Pensée
  rationale: Préserve à la fois l’acte mental divin et sa personnification féminine; la majuscule du v. 7 marque le titre.
- source_word: water-light / light-water
  choice: eau-lumière / eau de pure lumière
  rationale: Maintient l’imagerie inhabituelle du témoin et sa variation interne sans la normaliser en une métaphore plus conventionnelle.
- source_word: came forth
  choice: était venue à l’existence
  rationale: Expression naturelle qui garde l’idée de procession ou de manifestation sans imposer une doctrine technique de l’émanation au v. 6.
theological_decisions:
- issue: Identité de « celui qui est issu de lui » au v. 1
  choice: Maintenir la formulation relationnelle sans identifier explicitement ce personnage
  alternative: L’identifier au Fils ou à une autre hypostase
  rationale: Le passage fourni ne donne pas lui-même une identification univoque; l’expliciter résoudrait indûment l’ambiguïté.
- issue: Sujet et réflexivité de « studies himself »
  choice: « se contemple lui-même »
  alternative: « l’étudie » ou « contemple le Père »
  rationale: La traduction retient la lecture réflexive attestée par le témoin tout en employant un français digne et intelligible.
- issue: Personnification féminine de la pensée première
  choice: Employer « elle », « Puissance », « Providence » et « Pensée »
  alternative: Neutraliser la figure par « cela » ou un nom masculin
  rationale: Le genre et la personnification sont structurants dans la présentation de Barbelo et doivent rester visibles.
- issue: Relation entre la lumière de Barbelo et celle de l’Esprit
  choice: « sa lumière resplendit comme sa lumière »
  alternative: « sa lumière est identique à la sienne »
  rationale: La comparaison est conservée sans affirmer une identité ontologique plus forte que le témoin.
- issue: Procession de la première Puissance
  choice: « émana de sa pensée » au v. 3
  alternative: « sortit de son esprit »
  rationale: « Émana » rend le mouvement de provenance cosmologique sans préciser davantage son mode; « pensée » assure la cohérence avec le v. 7.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les crochets sont conservés comme signes de lacunes ou de restitutions éditoriales. Le numéro de page manuscrit « 5 », qui interrompait la phrase, n’est pas intégré. Cette version demeure provisoire puisque la révision directe du copte est indiquée comme étant en attente.
