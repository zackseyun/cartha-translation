  text: 'He also established seven kings, each corresponding to the heavenly firmaments above the seven heavens, and five over the depths of the abyss, so that they would rule.


    He also shared his fire with them, but he did not send out any of the power of the light he had obtained from his mother, because he is ignorant darkness. When the light combined with the darkness, it made the darkness shine; and when the darkness combined with the light, it darkened the light. It became neither light nor darkness, but grew gloomy.


    The feeble archon has three names. The first name is Yaltabaoth, the second is Saklas, and the third is Samael. He is wicked in the pride within him, because he said, “I am God, and there is no god other than me.” For he is unaware of his own strength and of the place from which he originated.


    The archons also created seven powers for themselves, and each of the powers created six angels for themselves, so that they numbered 365 angels. These are the bodies that pertain to the names:


    The first ‹is› Athoth—he has the face of a sheep; the second is Eloaiou—he has the face of a donkey; the third is Astaphaios—he has the face of a [hyena]; the fourth is Yao—he has the face of a seven-headed [dragon]; the fifth is Sabaoth—he has the face of a dragon; the sixth is Adonin—he has the face of a monkey; the seventh is Sabbede—he has the face of a glowing fire.


    These are the sevenfold (aspect) of the week.


    Yaltabaoth, however, had a multitude «12» of faces—more than all the others—so that when he was among the seraphs, he was able to put on any face before all of them, as he wished.


    Because he shared his fire with them, he became their overlord.


    Because of the glorious power he possessed through his mother’s light, he called himself God, and he was disobedient to the place from which he had originated.


    He also joined the seven powers within his thought together with the authorities who were with him. When he spoke, it happened, and he named each of the powers, beginning with the highest:


    The first is Goodness, together with the first authority, Athoth; the second is Providence, together with the second authority, Eloaio; the third is Divinity, together with the third authority, Astraphaio; the fourth is Lordship, together with the fourth authority, Yao; the fifth is Kingdom, together with the fifth authority, Sabaoth; the sixth is Jealousy, together with the sixth authority, Adonein; the seventh is Sophia, together with the seventh authority, Sabbateon.


    These also have a firmament corresponding to each heavenly aeon.


    They were given names corresponding to the glory of the heavenly beings, to bring about the [annihilation of the] powers. But power dwelt in the names given to [them by] their originator, while the names given to them in accordance with the glory of the heavenly beings will mean annihilation and feebleness for them.


    In this way, they have two names.


    [Further, after] creating [everything, he organized] them according to the likeness of the first aeons that had come into being, so that he could «13» create them after the likeness of the indestructible ones.


    It was not because he had seen the indestructible beings, but because of the power within him, which he had obtained from his mother, that he generated within himself the likeness of the world. When he saw the creation around him and the host of angels around him, which had issued from him, he declared to them, “I am a jealous God, and there is no God other than me.”


    By declaring this, however, he indicated to the angels attending him that there is another God. For if there were no other, how could he be jealous of another?


    The mother then began “to {move:3} back and forth,” becoming aware of the deficiency as the brightness of her light decreased, and she grew dark because her companion had not agreed together with her.'
translation:
  language: fr
  text: 'Il établit aussi sept rois, chacun correspondant aux firmaments célestes au-dessus des sept cieux, et cinq autres au-dessus des profondeurs de l’abîme, afin qu’ils règnent.


    Il partagea aussi son feu avec eux, mais il ne leur transmit rien de la puissance de la lumière qu’il avait reçue de sa mère, car il est ténèbres ignorantes. Lorsque la lumière se mêla aux ténèbres, elle fit briller les ténèbres ; et lorsque les ténèbres se mêlèrent à la lumière, elles obscurcirent la lumière. Celle-ci ne fut plus ni lumière ni ténèbres, mais devint sombre.


    L’archonte faible porte trois noms. Le premier est Yaltabaoth, le deuxième Saklas et le troisième Samael. Il est mauvais dans l’orgueil qui l’habite, car il a dit : « Je suis Dieu, et il n’y a pas d’autre dieu que moi. » En effet, il ignore sa propre puissance et le lieu d’où il est issu.


    Les archontes se créèrent aussi sept puissances, et chacune des puissances se créa six anges, si bien qu’ils furent au nombre de 365. Voici les corps associés aux noms :


    Le premier ‹est› Athoth : il a une face de mouton ; le deuxième est Eloaiou : il a une face d’âne ; le troisième est Astaphaios : il a une face de [hyène] ; le quatrième est Yao : il a une face de [dragon] à sept têtes ; le cinquième est Sabaoth : il a une face de dragon ; le sixième est Adonin : il a une face de singe ; le septième est Sabbede : il a une face de feu éclatant.


    Tels sont les sept aspects de la semaine.[a]


    Yaltabaoth, cependant, avait une multitude de visages, plus que tous les autres, de sorte que, lorsqu’il était parmi les séraphins, il pouvait revêtir devant eux tous le visage qu’il voulait.


    Parce qu’il avait partagé son feu avec eux, il devint leur souverain.


    À cause de la puissance glorieuse qu’il possédait grâce à la lumière de sa mère, il se donna le nom de Dieu et désobéit au lieu d’où il était issu.


    Il unit aussi, dans sa pensée, les sept puissances aux autorités qui étaient avec lui. Lorsqu’il parla, la chose arriva, et il donna un nom à chacune des puissances, en commençant par la plus élevée :


    La première est Bonté, avec la première autorité, Athoth ; la deuxième est Providence, avec la deuxième autorité, Eloaio ; la troisième est Divinité, avec la troisième autorité, Astraphaio ; la quatrième est Souveraineté, avec la quatrième autorité, Yao ; la cinquième est Royauté, avec la cinquième autorité, Sabaoth ; la sixième est Jalousie, avec la sixième autorité, Adonein ; la septième est Sophia, avec la septième autorité, Sabbateon.[b]


    Elles ont aussi chacune un firmament correspondant à un éon céleste.


    Elles reçurent des noms conformes à la gloire des êtres célestes, afin de provoquer l’[anéantissement des] puissances. Mais une puissance résidait dans les noms que leur avait donnés [leur] créateur, tandis que les noms qui leur furent donnés conformément à la gloire des êtres célestes signifieront pour elles anéantissement et faiblesse.[c]


    Ainsi, elles portent deux noms.


    [Ensuite, après] avoir créé [toutes choses, il les organisa] à la ressemblance des premiers éons venus à l’existence, afin de pouvoir les créer à la ressemblance des êtres impérissables.


    Ce n’est pas parce qu’il avait vu les êtres impérissables, mais à cause de la puissance qui était en lui et qu’il avait reçue de sa mère, qu’il produisit en lui-même la ressemblance du monde. Lorsqu’il vit la création autour de lui et l’armée des anges qui l’entourait, issue de lui, il leur déclara : « Je suis un Dieu jaloux, et il n’y a pas d’autre Dieu que moi. »


    Cependant, en faisant cette déclaration, il indiquait aux anges qui le servaient qu’il existe un autre Dieu. En effet, s’il n’y en avait pas d’autre, comment pourrait-il être jaloux d’un autre ?


    La mère commença alors à « aller et venir », prenant conscience de la déficience tandis que l’éclat de sa lumière diminuait ; et elle s’assombrit parce que son compagnon ne s’était pas accordé avec elle.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « les sept aspects de la semaine » est concise et peut évoquer la totalité septuple liée aux sept jours ou aux puissances qui leur correspondent.
    reason: Signaler une formulation obscure sans imposer une reconstruction.
  - marker: b
    text: 'Les formes des noms propres varient selon les témoins manuscrits et parfois à l’intérieur du passage : Eloaiou/Eloaio, Astaphaios/Astraphaio, Adonin/Adonein et Sabbede/Sabbateon.'
    reason: Préserver les variantes transmises plutôt que les harmoniser silencieusement.
  - marker: c
    text: La syntaxe de cette phrase est difficile et le texte est partiellement lacunaire. Le contraste semble opposer la puissance attachée aux noms donnés par le créateur à l’effet destructeur des noms correspondant aux réalités célestes.
    reason: Avertir de l’incertitude textuelle et interprétative.
  - marker: d
    text: Le témoin de consultation porte une notation éditoriale obscure autour du verbe rendu ici par « aller et venir ». Le sens précis du mouvement reste incertain.
    reason: Rendre compte de l’obscurité de la notation {move:3} sans la reproduire comme si elle appartenait au texte ancien.
lexical_decisions:
- source_word: archon
  choice: archonte
  rationale: Terme technique consacré en français pour les puissances dirigeantes de ce corpus ; il préserve la portée cosmologique sans la réduire à « chef ».
- source_word: power
  choice: puissance
  rationale: Conserve le double sens de capacité active et d’entité cosmique ; le contexte et la majuscule des noms propres distinguent les emplois.
- source_word: firmament
  choice: firmament
  rationale: Équivalent français traditionnel et intelligible qui maintient la cosmologie stratifiée du passage.
- source_word: aeon
  choice: éon
  rationale: Translittération technique usuelle, préférable à « âge » puisque le mot désigne ici une réalité ou sphère céleste.
- source_word: overlord
  choice: souverain
  rationale: Rend l’autorité dominante dans un français naturel sans ajouter de titre féodal absent du contexte.
- source_word: Sophia
  choice: Sophia
  rationale: Le nom grec est conservé comme désignation propre, parallèlement aux autres noms de puissances.
- source_word: indestructible ones
  choice: êtres impérissables
  rationale: Expression naturelle et digne qui conserve l’idée d’une existence soustraite à la corruption ou à la destruction.
- source_word: deficiency
  choice: déficience
  rationale: Terme abstrait retenu pour préserver la notion technique du récit sans l’interpréter comme simple faute morale.
theological_decisions:
- issue: La revendication de Yaltabaoth à être Dieu
  choice: Conserver « Je suis Dieu » puis « Je suis un Dieu jaloux » avec la réfutation explicite du narrateur
  alternative: Harmoniser les deux déclarations ou identifier explicitement Yaltabaoth au Dieu d’une tradition particulière
  rationale: Le passage construit volontairement une tension entre la prétention de l’archonte et l’existence d’un Dieu autre ; la traduction ne doit ni l’atténuer ni ajouter une identification confessionnelle.
- issue: Nature des sept puissances
  choice: Employer des termes pouvant désigner à la fois des qualités et des entités personnifiées
  alternative: Les présenter uniquement comme des attributs abstraits ou uniquement comme des divinités
  rationale: Le texte associe des noms abstraits à des autorités personnelles ; l’ambivalence est constitutive du passage.
- issue: Relation de la mère à son compagnon
  choice: « ne s’était pas accordé avec elle »
  alternative: « ne lui avait pas donné son consentement » ou une formulation impliquant une union sexuelle
  rationale: La formulation préserve l’idée d’un défaut d’accord sans préciser indûment la nature de cet accord.
- issue: Mélange de la lumière et des ténèbres
  choice: Maintenir les deux mouvements parallèles et leur résultat intermédiaire
  alternative: Résoudre le résultat comme une victoire de la lumière ou des ténèbres
  rationale: Le texte insiste sur un état devenu ni lumière ni ténèbres ; cette tension cosmologique doit rester intacte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques du corpus (« archonte », « éon », « Sophia ») sont conservés lorsqu’une paraphrase effacerait leur fonction. Les crochets et le signe éditorial ‹est› signalent les restaurations du témoin. Les numéros de pages manuscrites insérés dans les phrases ont été omis. Le brouillon repose sur le témoin anglais public fourni ; une vérification directe du copte reste nécessaire.
