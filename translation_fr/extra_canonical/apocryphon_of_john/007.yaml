translation:
  language: fr
  text: '**L’Apocryphon de Jean — Les quatre luminaires**


    1. La Vie éternelle, avec sa Volonté, ainsi que l’Intellect avec la Prescience, se tinrent auprès de l’Esprit invisible et de Barbélo et les glorifièrent, puisqu’ils étaient venus à l’existence à cause d’elle.


    2. Avec Barbélo, l’Esprit saint mena aussi à son accomplissement le Dieu autoengendré, son Fils, afin qu’il se tienne auprès du grand Esprit invisible et virginal : le Dieu autoengendré, le Christ, qu’il avait glorifié d’une voix forte.


    3. Celui-ci sortit par l’intermédiaire de la Providence, et l’Esprit invisible et virginal établit le Dieu véritablement autoengendré au-dessus du Tout.


    4. Il soumit aussi toute autorité sous ses pieds et mit la vérité en lui, afin qu’il connaisse le Tout, lui qui avait reçu un nom élevé au-dessus de tout nom. Car ce nom sera prononcé devant ceux qui en sont dignes.


    5. En effet, de la Lumière, qui est le Christ, et de l’Indestructibilité, par le don de l’Esprit et les quatre [grands] luminaires issus du Dieu autoengendré [...]. Il attendit qu’ils se tiennent auprès de lui :


    6. les trois, à savoir la Volonté, la Pensée et la Vie,


    7. et les quatre puissances : l’Intelligence, la Grâce, la Perception et le Discernement.


    8. La Grâce appartient à l’éon-lumière Armozel — qui est le premier ange — et trois autres éons sont avec cet éon : la Grâce, la Vérité et la Forme.


    9. Puis vient le deuxième luminaire, Oriael, qui a été établi au-dessus du deuxième éon.


    10. Trois autres éons sont avec lui : la Réflexion, la Perception et la Mémoire.


    11. Le troisième luminaire est Daveïthaï, qui a été établi au-dessus du troisième éon, et trois autres éons sont avec lui : l’Intelligence, l’Amour et la Forme idéale.


    12. Le quatrième éon fut établi au-dessus du quatrième luminaire, Éléleth.


    13. Trois autres éons sont avec lui : la Perfection, la Paix et Sophia.


    14. Tels sont les quatre luminaires qui se tiennent auprès du Dieu autoengendré.


    15. Tels sont les douze éons qui se tiennent auprès du Fils du Puissant, l’Autoengendré, le Christ, par la volonté et le don de l’Esprit invisible. Ces douze éons appartiennent au Fils autoengendré.


    16. Et toute chose fut établie par la volonté de l’Esprit saint, par l’intermédiaire de l’Autoengendré.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: self-generated
  choice: autoengendré
  rationale: Ce terme conserve l’idée technique d’un être venu de lui-même à l’existence, sans la réduire à « créé » ni lui substituer le titre plus interprétatif « Monogène ».
- source_word: lights
  choice: luminaires
  rationale: Dans ce contexte, il s’agit d’entités célestes personnifiées plutôt que de la lumière comme phénomène; « luminaires » garde cette distinction.
- source_word: aeon
  choice: éon
  rationale: Le terme technique est conservé, car il peut désigner ici à la fois une réalité céleste, une puissance personnifiée ou un domaine, et non simplement une période de temps.
- source_word: Mind
  choice: Intellect
  rationale: « Intellect » convient mieux à une hypostase cosmologique personnifiée que le courant « esprit », qui créerait une confusion avec l’Esprit invisible.
- source_word: Precognition
  choice: Prescience
  rationale: « Prescience » exprime une connaissance antérieure dans un registre cosmologique et théologique digne.
- source_word: Idea
  choice: Pensée
  rationale: « Pensée » est naturel en français tout en conservant le caractère abstrait et personnifié de la réalité nommée.
- source_word: Indestructibility
  choice: Indestructibilité
  rationale: Le substantif abstrait est maintenu comme nom d’une puissance personnifiée; « incorruptibilité » serait possible, mais infléchirait le champ sémantique.
- source_word: attend
  choice: se tenir auprès de
  rationale: Cette formulation préserve l’idée de présence et de service sans imposer partout une fonction cultuelle précise.
- source_word: All
  choice: Tout
  rationale: La majuscule signale le sens cosmologique de la totalité constituée sans expliciter davantage sa nature.
- source_word: Sophia
  choice: Sophia
  rationale: Le nom traditionnel est conservé plutôt que traduit par « Sagesse », puisque la liste présente des entités nommées et que Sophia a une identité propre dans l’ouvrage.
theological_decisions:
- issue: Identification syntaxique au verset 2
  choice: Conserver « le Dieu autoengendré, le Christ » après les deux-points
  alternative: Rattacher explicitement « le Christ » au seul « grand Esprit invisible et virginal »
  rationale: Le témoin anglais présente une syntaxe difficile et des référents pronominaux incertains. La traduction ne tranche pas silencieusement l’identité exacte des figures.
- issue: Origine et procession au verset 3
  choice: Traduire sobrement « sortit par l’intermédiaire de la Providence »
  alternative: Employer « émana » ou « fut engendré »
  rationale: « Émana » importerait un système métaphysique plus précis que le témoin, tandis que « fut engendré » atténuerait l’image de sortie ou de procession.
- issue: Nom élevé au-dessus de tout nom
  choice: Maintenir la formule sans identifier le nom
  alternative: L’associer explicitement à un nom divin ou christologique déterminé
  rationale: Le passage ne donne pas ici ce nom; l’ambiguïté et la réserve initiatique du texte doivent demeurer.
- issue: Fragment du verset 5
  choice: Conserver la rupture syntaxique et le signe de lacune [...]
  alternative: Reconstruire une phrase complète à partir du contexte
  rationale: Le texte transmis est endommagé ou incomplet. Une reconstruction française fluide masquerait l’état réel du témoignage.
- issue: Rapport entre éons, luminaires et puissances
  choice: Garder les catégories distinctes telles qu’elles apparaissent, même lorsque leur articulation semble irrégulière
  alternative: Harmoniser les listes en identifiant systématiquement chaque éon à une puissance ou à un luminaire
  rationale: L’organisation du passage comporte des tensions textuelles ou conceptuelles qu’il ne faut pas résoudre par une systématisation doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du vocabulaire cosmologique technique. La numérotation interne a été conservée. Le numéro de page manuscrit intrusif « 8 » a été omis, tandis que les crochets de restitution et l’ellipse signalant la lacune ont été préservés. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni; la vérification directe des témoins coptes est encore en attente.
