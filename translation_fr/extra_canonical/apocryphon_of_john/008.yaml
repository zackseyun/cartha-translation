translation:
  language: fr
  text: '1. De plus, de la Prescience de l’Intellect parfait, par la révélation de la volonté de l’Esprit invisible et de la volonté de l’Autoengendré, parut l’Homme parfait, la première révélation, c’est-à-dire la vérité.


    2. C’est lui que l’Esprit virginal nomma Pigera-Adamas. Il l’établit sur le premier éon, avec le Puissant, l’Autoengendré, le Christ, auprès de la première lumière, Armozel, accompagné de ses puissances.


    3. De plus, l’Invisible lui accorda une force spirituelle, invulnérable.


    4. Alors il parla, exalta et loua l’Esprit invisible en disant : « C’est grâce à toi que le Tout est venu à l’existence, et c’est vers toi que le Tout retournera.


    5. Je te louerai et t’exalterai, toi et l’Autoengendré, ainsi que les trois éons : le Père, la Mère, le Fils, la puissance parfaite. »


    6. Il établit aussi son fils Seth sur le deuxième éon, devant la deuxième lumière, Oroïel. Dans le troisième éon, la descendance de Seth fut établie sur la troisième lumière, Daveïthaï, et les âmes des saints y furent placées.


    7. De plus, dans le quatrième éon furent placées les âmes de ceux qui n’avaient pas connu la Plénitude et ne s’étaient pas repentis aussitôt, mais avaient persisté quelque temps avant de se repentir par la suite.


    8. Ceux-ci sont la quatrième lumière, Éléleth.[a]


    9. Ce sont des êtres qui exaltent l’Esprit invisible.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation transmise est inhabituelle : elle semble identifier ces âmes ou ces êtres à la quatrième lumière, Éléleth. On pourrait aussi comprendre qu’ils sont placés dans cette lumière, mais cette correction n’est pas certaine.'
    reason: Signaler une difficulté textuelle réelle sans corriger silencieusement le témoin.
lexical_decisions:
- source_word: Precognition of Perfect Mind
  choice: Prescience de l’Intellect parfait
  rationale: « Prescience » conserve l’idée de connaissance préalable; « Intellect » rend dignement le principe noétique personnifié sans le réduire à la simple pensée.
- source_word: self-generated one
  choice: l’Autoengendré
  rationale: Terme technique substantivé qui préserve la notion d’un être issu de lui-même et son rôle de titre.
- source_word: aeon
  choice: éon
  rationale: Maintien du terme cosmologique technique, usuel en français dans les études des textes gnostiques, plutôt qu’une paraphrase réductrice.
- source_word: the All
  choice: le Tout
  rationale: La majuscule indique qu’il s’agit de la totalité cosmique conçue comme réalité déterminée.
- source_word: Fullness
  choice: la Plénitude
  rationale: Rend le concept technique correspondant au plérôme tout en restant intelligible en français moderne.
- source_word: seed of Seth
  choice: la descendance de Seth
  rationale: Dans ce contexte collectif et humain, « descendance » est plus naturel que le littéral « semence », sans effacer le lien généalogique.
- source_word: holy ones
  choice: les saints
  rationale: Expression française courante qui conserve la désignation collective de personnes consacrées.
theological_decisions:
- issue: Relation entre le Père, la Mère, le Fils et « la puissance parfaite »
  choice: Conserver la série telle quelle, sans identifier explicitement la puissance parfaite à l’un des trois éons.
  alternative: Lire « la puissance parfaite » comme une apposition définissant collectivement ou individuellement les trois éons.
  rationale: La syntaxe du témoin est ambiguë; la ponctuation retenue préserve cette tension au lieu d’imposer une systématisation théologique.
- issue: Identité de l’Homme parfait et de Pigera-Adamas
  choice: Maintenir l’identification explicite donnée par « C’est lui » sans harmonisation avec l’Adam biblique.
  alternative: Traduire ou normaliser le nom en « Adam parfait » ou « premier Adam ».
  rationale: Pigera-Adamas est un nom technique propre au système cosmologique du texte; le normaliser importerait une interprétation.
- issue: Statut de la quatrième lumière au paragraphe 8
  choice: Traduire littéralement « Ceux-ci sont la quatrième lumière, Éléleth » et signaler la difficulté.
  alternative: Corriger en « Ils sont dans la quatrième lumière, Éléleth » ou « Telle est la quatrième lumière ».
  rationale: La formulation transmise est inhabituelle et peut refléter une corruption ou une divergence textuelle; elle ne doit pas être silencieusement harmonisée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les titres et réalités cosmologiques personnifiés portent une majuscule; les noms techniques sont translittérés et légèrement francisés par les accents (Oroïel, Daveïthaï, Éléleth). Le texte demeure provisoire, car le dossier fourni repose sur un témoin anglais public et indique que la vérification directe du copte est encore à faire.
