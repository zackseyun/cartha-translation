    9. Ils entrèrent dans un lieu et se cachèrent au sein d’une nuée lumineuse. Il avait conscience de son autorité, et celle qui appartient à la lumière l’accompagnait[g].


    10. Elle avait resplendi sur eux, parce qu’il avait fait couvrir toute la terre de ténèbres. Puis il trama un complot avec ses puissances.


    11. Il envoya ses anges vers les filles des hommes pour qu’ils en prennent certaines pour eux-mêmes et suscitent une descendance destinée à leur plaisir. Mais, au début, ils échouèrent.


