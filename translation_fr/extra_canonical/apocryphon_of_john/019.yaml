  text: '1. I asked, however, “Lord, where did the vile spirit come from?”


    2. He said to me, “The Mother-Father, who abounds in mercy, the holy Spirit in every form, the one who is merciful and «28» who shows compassion for all of you—that is, the Reflection of Radiant Providence—raised up the seed of the perfect race, its intellect, and the eternal light of the Man.


    3. When the chief archon realized that they were higher than he was in the height and surpassed him in intellect, he wanted to grasp their objective. He did not know that they surpassed him in intellect and that he would be unable to grasp them.


    4. He devised a plot with his authorities, who are his powers, and together they committed adultery with Sophia. Bitter Destiny was begotten by them, the final, unstable fetter. It is of a wavering kind, yet it is more durable and stronger than she with whom the gods joined in adultery, and the angels, and the demons, and all the generations down to the present day. For from that Destiny came all transgression, injustice, blasphemy, the fetter of oblivion and ignorance, every harsh command with grievous transgressions, and overwhelming fears.


    5. In this way all creation was also blinded so that they would not know the God who is over them all. Because of the fetter of oblivion, their sins were hidden, for they are bound by measurements, times, and moments, since it is the universal overlord.


    6. Then he regretted everything that had happened because of him.


    7. This time he conspired to bring a flood «29» upon the products of humanity, but the greatness of radiant Providence informed Noah. Noah preached to all the seed of the children of humanity, but those who were strangers to him did not listen to him.


    8. It was not as Moses said, ‘They hid themselves in an ark.’ Instead, they hid themselves in a place—not only Noah, but also many other people from the unmoving race.


    9. They entered a place and hid themselves within a radiant cloud. He was aware of his authority, and she who belongs to the light accompanied him.


    10. She had shone upon them because he had caused darkness to cover the whole earth, and he devised a plot together with his powers.


    11. He sent his angels to the daughters of men to take some for themselves and to raise up offspring for their pleasure, but at first they were unsuccessful.


    12. When they did not succeed, they gathered again and devised a plot together.


    13. They created a vile spirit resembling the Spirit who had descended, so that through it they might defile souls. The angels transformed their appearance into the appearance of their mates, making them full of the spirit of darkness, which they had mixed together with evil for them.


    14. They presented gold and silver, and gifts of copper and iron, and objects made from every kind of metal. By leading the people who followed them «30» astray with a multitude of tricks, they brought them into great troubles.


    15. They grew old without enjoying any pleasures.


    16. Without discovering the truth and without knowledge of the true God, they died. In this way all creation fell into age-long slavery, lasting from the foundation of the world until now.


    17. They also selected women and fathered children from the darkness according to the likeness of their own spirit. They closed up their hearts and hardened themselves by means of the hardness of the vile spirit, even until now.”'
translation:
  language: fr
  text: '**L’Esprit vil**


    1. Je demandai cependant : « Seigneur, d’où vient l’esprit vil[a] ? »


    2. Il me répondit : « La Mère-Père, qui abonde en miséricorde, l’Esprit saint sous tous ses modes, celui qui fait miséricorde et qui éprouve de la compassion pour vous tous — c’est-à-dire la Réflexion de la Providence lumineuse — a fait surgir la semence de la race parfaite, son intelligence et la lumière éternelle de l’Homme[b].


    3. Lorsque l’archonte en chef comprit qu’ils lui étaient supérieurs dans les hauteurs et qu’ils le surpassaient en intelligence, il voulut saisir leur dessein. Il ignorait qu’ils le surpassaient en intelligence et qu’il ne pourrait pas les saisir.


    4. Il trama un complot avec ses autorités, qui sont ses puissances, et ensemble ils commirent l’adultère avec Sophia[c]. D’eux naquit l’amère Destinée[d], l’ultime lien instable. Elle est changeante, mais plus durable et plus forte que celle avec qui les dieux s’unirent dans l’adultère, ainsi que les anges, les démons et toutes les générations jusqu’à ce jour. Car de cette Destinée sont issus toute transgression, toute injustice, tout blasphème, le lien de l’oubli et de l’ignorance, tout ordre impitoyable accompagné de graves transgressions, et des peurs accablantes.


    5. Ainsi, toute la création fut elle aussi aveuglée, afin que ses êtres ne connaissent pas le Dieu qui est au-dessus d’eux tous. À cause du lien de l’oubli, leurs péchés leur furent cachés, car ils sont enchaînés par des mesures, des temps et des moments, puisque la Destinée domine l’univers[e].


    6. Alors, il regretta tout ce qui était arrivé par sa faute.


    7. Cette fois, il complota pour faire venir un déluge sur les œuvres de l’humanité. Mais la grandeur de la Providence lumineuse en avertit Noé. Noé proclama le message à toute la descendance des humains, mais ceux qui lui étaient étrangers ne l’écoutèrent pas.


    8. Les choses ne se passèrent pas comme l’a dit Moïse : « Ils se cachèrent dans une arche. » Ils se cachèrent plutôt en un lieu — non seulement Noé, mais aussi beaucoup d’autres membres de la race inébranlable[f].


    9. Ils entrèrent dans un lieu et se cachèrent au sein d’une nuée lumineuse. Noé avait conscience de son autorité, et celle qui appartient à la lumière l’accompagnait[g].


    10. Elle avait resplendi sur eux, parce qu’il avait fait couvrir toute la terre de ténèbres. Puis il trama un complot avec ses puissances.


    11. Il envoya ses anges vers les filles des hommes pour qu’ils en prennent certaines pour eux-mêmes et suscitent une descendance destinée à leur plaisir. Mais, au début, ils échouèrent.


    12. N’ayant pas réussi, ils se réunirent de nouveau et tramèrent ensemble un complot.


    13. Ils créèrent un esprit vil qui ressemblait à l’Esprit descendu, afin de souiller les âmes par son moyen. Les anges transformèrent leur apparence pour prendre celle des compagnons de ces femmes[h], et ils remplirent celles-ci de l’esprit des ténèbres, qu’ils avaient mêlé au mal à leur intention.


    14. Ils leur présentèrent de l’or et de l’argent, ainsi que des présents de cuivre et de fer et des objets faits de toutes sortes de métaux. Par une multitude de ruses, ils égarèrent ceux qui les suivaient et les plongèrent dans de grandes détresses.


    15. Ceux-ci vieillirent sans jouir d’aucun plaisir.


    16. Ils moururent sans avoir découvert la vérité ni connu le vrai Dieu. Ainsi, toute la création tomba dans un esclavage séculaire, qui dure depuis la fondation du monde jusqu’à maintenant.


    17. Ils choisirent aussi des femmes et engendrèrent, à partir des ténèbres, des enfants conformes à leur propre esprit. Ils fermèrent leur cœur et s’endurcirent par la dureté de l’esprit vil, jusqu’à maintenant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Esprit vil » peut aussi se rendre par « esprit méprisable » ou « esprit impur ». La révision directe du copte reste à effectuer.
    reason: Signaler la portée possible du qualificatif et la base documentaire provisoire.
  - marker: b
    text: « L’Homme » est ici une désignation cosmologique, et non simplement l’être humain en général.
    reason: Éviter que la majuscule et la fonction technique du terme passent inaperçues.
  - marker: c
    text: Sophia est le nom grec de la Sagesse, présentée ici comme une figure personnelle.
    reason: Rendre le nom propre intelligible sans substituer « Sagesse » dans le texte.
  - marker: d
    text: La « Destinée » désigne ici une puissance cosmique personnifiée.
    reason: Éclairer la majuscule et le rôle actif de cette entité.
  - marker: e
    text: 'Littéralement, le témoin porte : « puisque c’est le souverain universel ». Le référent du pronom est probablement la Destinée, mais demeure grammaticalement ambigu.'
    reason: Préserver l’incertitude du témoin tout en produisant une phrase française lisible.
  - marker: f
    text: « Race inébranlable » peut aussi se traduire par « génération immuable »; l’expression désigne un groupe spirituel dans le vocabulaire de l’ouvrage.
    reason: Expliquer un terme technique dont la traduction littérale peut dérouter.
  - marker: g
    text: Les référents des pronoms dans les versets 9–10 sont incertains dans le témoin fourni. « Celle qui appartient à la lumière » paraît désigner une puissance lumineuse, peut-être la Providence.
    reason: Ne pas dissimuler une ambiguïté textuelle importante.
  - marker: h
    text: Le terme rendu par « compagnons » peut désigner des partenaires ou des époux; la relation exacte n’est pas précisée dans le témoin.
    reason: Éviter une précision conjugale non garantie.
lexical_decisions:
- source_word: vile spirit
  choice: esprit vil
  rationale: Rend directement le jugement moral du témoin anglais tout en conservant la répétition structurante du titre et des versets 1, 13 et 17.
- source_word: Mother-Father
  choice: Mère-Père
  rationale: Conserve la désignation composée et sa tension de genre sans la normaliser selon un vocabulaire confessionnel.
- source_word: Reflection of Radiant Providence
  choice: Réflexion de la Providence lumineuse
  rationale: Préserve le statut quasi titulaire de l’expression et distingue la Réflexion de la Providence elle-même.
- source_word: chief archon
  choice: archonte en chef
  rationale: Maintient le terme technique « archonte », usuel dans l’étude de ces écrits, tout en explicitant sa primauté.
- source_word: Destiny
  choice: Destinée
  rationale: La majuscule indique une puissance personnifiée; « Destinée » exprime mieux cette entité que le simple « destin ».
- source_word: unmoving race
  choice: race inébranlable
  rationale: Rend l’idée de stabilité ou d’immuabilité sans suggérer une immobilité physique maladroite.
- source_word: age-long slavery
  choice: esclavage séculaire
  rationale: Expression naturelle indiquant une durée immense sans imposer ici le sens strict d’éternité.
- source_word: seed / offspring
  choice: semence / descendance
  rationale: « Semence » est conservé pour la notion technique du verset 2; « descendance » est employé dans les contextes généalogiques pour un français naturel.
theological_decisions:
- issue: Genre grammatical de l’Esprit au verset 2
  choice: La syntaxe française fait de « la Mère-Père » le sujet de « a fait surgir », tandis que « l’Esprit saint » demeure une apposition.
  alternative: Faire explicitement de l’Esprit saint le sujet et employer un pronom masculin ou féminin.
  rationale: Le témoin fourni présente une syntaxe et des référents de genre instables. La traduction évite de résoudre cette difficulté par une identification dogmatique.
- issue: Identité de « celle avec qui les dieux s’unirent » au verset 4
  choice: Conserver la périphrase sans identifier explicitement cette figure à Sophia.
  alternative: Traduire « plus forte que Sophia, avec qui… ».
  rationale: Même si le contexte suggère Sophia, le texte transmis emploie un pronom; l’ambiguïté authentique est donc maintenue.
- issue: Agent universel au verset 5
  choice: Expliciter prudemment « la Destinée domine l’univers » avec une note.
  alternative: Conserver le pronom neutre « puisque c’est le maître universel ».
  rationale: Le genre de « Destinée » en français permet un référent probable, mais la note signale que le témoin reste grammaticalement ambigu.
- issue: Récit du déluge opposé à Moïse
  choice: Traduire directement la contestation du récit mosaïque.
  alternative: Atténuer par « il ne faut pas comprendre comme Moïse l’a dit ».
  rationale: Le texte établit explicitement une opposition; elle ne doit pas être harmonisée avec la Genèse.
- issue: Référents pronominaux des versets 9–10
  choice: Identifier seulement le « il » du verset 9 comme Noé dans le corps du texte et signaler l’incertitude en note.
  alternative: Identifier tous les pronoms avec Noé, la Providence et l’archonte.
  rationale: Le témoin anglais est ambigu et une résolution complète importerait une interprétation non assurée.
- issue: Anges et femmes au verset 13
  choice: Rendre « mates » par « compagnons de ces femmes » et signaler l’incertitude.
  alternative: Traduire « leurs maris » sans réserve.
  rationale: Le contexte suggère des partenaires masculins, mais le lien exact et le statut conjugal ne sont pas certains.
translation_notes:
  register: Français international actuel, digne et accessible. Les phrases longues ont été légèrement segmentées sans effacer les enchaînements répétitifs du discours. Les termes techniques nécessaires (« archonte », « Sophia », « Providence », « race inébranlable ») sont conservés ou expliqués. Les numéros de pages manuscrites ont été omis. Projet provisoire fondé sur le témoin anglais public fourni; une collation directe des témoins coptes est encore nécessaire.
