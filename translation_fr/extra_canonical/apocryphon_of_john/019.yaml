    7. Cette fois, il complota pour faire venir un déluge sur les œuvres de l’humanité. Mais la grandeur de la Providence lumineuse en avertit Noé. Noé proclama le message à toute la descendance des humains, mais ceux qui lui étaient étrangers ne l’écoutèrent pas.


