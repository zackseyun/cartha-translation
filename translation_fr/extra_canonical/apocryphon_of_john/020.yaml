translation:
  language: fr
  text: '1. Ainsi donc, moi, la Providence parfaite du Tout, je me suis transformée en ma propre semence, car j’ai été la première à exister. J’ai parcouru tous les chemins, car je suis la richesse de la lumière.


    2. Je suis la mémoire de la Plénitude. Pourtant, je suis entrée dans le domaine des ténèbres et j’ai persévéré jusqu’à pénétrer au cœur de la prison. Les fondements du Chaos ont tremblé. Je me suis cachée loin d’eux à cause de leur mal, et ils ne m’ont pas reconnue.


    3. Puis je suis revenue une deuxième fois et j’ai parcouru les alentours.


    4. Je suis sortie de ceux qui appartiennent à la lumière — lumière que je suis —, moi qui suis la mémoire de la Providence.


    5. Je suis entrée au cœur des ténèbres et dans les profondeurs de l’Hadès, car je veillais à ma mission. Les fondements du Chaos ont tremblé, cherchant à s’effondrer sur ceux qui habitent le Chaos et à les détruire. Alors je me suis de nouveau hâtée de remonter vers ma racine de lumière, afin qu’ils ne soient pas détruits avant le temps fixé.


    6. Une troisième fois encore, je suis sortie, moi qui suis la lumière au-dedans de la lumière, moi qui suis la mémoire de la Providence, afin d’entrer au cœur des ténèbres et dans les profondeurs de l’Hadès. J’ai rempli mon visage de la lumière de l’accomplissement de leur éon[a], puis je suis entrée au cœur de leur prison, c’est-à-dire la prison du corps[b], et j’ai dit : « Que celui qui entend se lève de son profond sommeil ! » Alors il a pleuré, et ses larmes ont coulé.


    7. Il a essuyé ses larmes amères et a dit : « Qui m’appelle par mon nom ? Et d’où m’est venue cette espérance, alors que je suis dans les chaînes de la prison ? »


    8. Je lui ai aussi dit : « Je suis la Providence de la lumière pure.


    9. Je suis la pensée de l’Esprit virginal, qui t’élève vers le lieu digne de louange.


    10. Lève-toi et souviens-toi que tu es celui qui a prêté attention. Suis ta racine, qui est moi, la Miséricordieuse[c]. Garde-toi des anges du dénuement, des démons du Chaos et de tous ceux qui te tendent des pièges. Prends garde au profond sommeil et à l’enfermement dans les profondeurs de l’Hadès. »


    11. Je l’ai alors relevé et je l’ai marqué du sceau, avec la lumière de l’eau des cinq sceaux[d], afin que, désormais, la Mort n’ait plus de pouvoir sur lui. Et voici, maintenant je vais monter vers l’éon parfait.


    [a] Un « éon » peut désigner un âge ou, dans le vocabulaire de cet écrit, une réalité ou puissance du monde spirituel. L’expression « l’accomplissement de leur éon » reste difficile et peut aussi évoquer l’achèvement de leur âge.


    [b] Le mot « du » correspond à une restitution éditoriale dans le témoin fourni.


    [c] Le titre est au féminin parce qu’il renvoie ici à la Providence, nom féminin en français.


    [d] Les « cinq sceaux » désignent un rite ou une réalité symbolique propre à cet écrit; le passage n’en précise pas ici la nature.'
