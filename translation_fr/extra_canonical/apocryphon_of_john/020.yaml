lexical_decisions:
- source_word: Providence
  choice: Providence
  rationale: Conserve le terme technique et sa personnification; le féminin grammatical français structure les accords sans trancher davantage l’identité de la locutrice.
- source_word: Fullness
  choice: Plénitude
  rationale: Équivalent français établi qui préserve la portée cosmologique et potentiellement technique du terme.
- source_word: Chaos
  choice: Chaos
  rationale: La majuscule signale qu’il ne s’agit pas seulement du désordre ordinaire, mais d’un domaine cosmique personnifié ou structuré.
- source_word: Hades
  choice: Hadès
  rationale: Évite de confondre automatiquement ce domaine avec l’enfer au sens doctrinal ultérieur.
- source_word: aeon
  choice: éon
  rationale: Préserve un terme polysémique propre au cadre cosmologique du texte; une note explicite son ambiguïté entre âge et réalité spirituelle.
- source_word: root
  choice: racine
  rationale: Maintient l’image d’origine et d’appartenance sans l’expliciter doctrinalement.
- source_word: angels of destitution
  choice: anges du dénuement
  rationale: Rendu littéral et intelligible qui conserve l’étrangeté de l’expression sans choisir entre pauvreté matérielle, déficience ontologique ou privation spirituelle.
- source_word: sealed
  choice: marqué du sceau
  rationale: Formulation française naturelle qui conserve la valeur rituelle ou protectrice du sceau.
theological_decisions:
- issue: Identité de la voix qui parle
  choice: Ne pas identifier explicitement la Providence au Sauveur, au Christ ou à une autre figure nommée.
  alternative: Ajouter un nom ou un titre christologique explicite.
  rationale: Le passage fourni parle à la première personne sous le titre de Providence; expliciter davantage résoudrait une tension que le texte maintient.
- issue: Sens de l’Hadès
  choice: Conserver « Hadès ».
  alternative: Traduire par « enfer » ou « séjour des morts ».
  rationale: « Enfer » importerait des connotations doctrinales plus tardives, tandis que « séjour des morts » réduirait la coloration cosmologique particulière du passage.
- issue: Destruction différée des habitants du Chaos
  choice: Conserver le pronom ambigu « ils » dans « afin qu’ils ne soient pas détruits ».
  alternative: Identifier explicitement les habitants du Chaos ou leurs puissances comme référent.
  rationale: La chaîne des référents du témoin est incertaine; la traduction ne doit pas résoudre silencieusement cette ambiguïté.
- issue: Prison du corps
  choice: Conserver l’expression telle quelle, avec une note sur la restitution textuelle.
  alternative: Paraphraser le corps comme intrinsèquement mauvais ou expliquer une doctrine de l’âme emprisonnée.
  rationale: Le texte emploie l’image carcérale, mais une explication doctrinale dépasserait les données immédiates du passage.
- issue: Eau des cinq sceaux
  choice: Conserver la formule sans l’identifier à un rite confessionnel précis.
  alternative: L’assimiler explicitement au baptême ou à une cérémonie gnostique reconstruite.
  rationale: Le passage ne donne pas assez d’éléments pour fixer la nature exacte du rite ou du symbole.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions de la première personne et les grands termes cosmologiques sont maintenus en raison de leur fonction rhétorique. La page manuscrite « 31 », qui interrompait la phrase, est omise. Cette version demeure provisoire puisque le dossier indique qu’un contrôle direct du copte est encore à effectuer; elle est fondée sur le témoin anglais public fourni.
