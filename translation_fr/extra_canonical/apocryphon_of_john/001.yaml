review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement le témoin anglais fourni et maintient utilement les crochets pour les restitutions. Quelques formulations introduisent cependant une explicitation ou une inflexion absente du témoin : « c’est-à-dire » en 1, « Enfin » en 6, « déclara » en 7 et « expliqué » en 8. La révision les remplace par des équivalents plus neutres et plus proches. Le contrôle direct du copte demeure signalé comme en attente dans le dossier source.'
  naturalness: Le français est clair, moderne et d’un registre convenable. Les ajustements proposés rendent certaines expressions plus idiomatiques sans lisser l’ambiguïté cosmologique ni le caractère lacunaire du texte.
  terminology: « Sauveur », « maître », « pharisien », « Nazaréen » et « éon » conviennent. Le maintien d’« éon », accompagné d’une note explicitement non doctrinale, est justifié. « Fermé vos cœurs » est plus naturel que « scellé vos cœurs » tout en préservant l’image d’un cœur rendu inaccessible.
  issues:
  - severity: medium
    issue: Explicitation interprétative au v. 1
    rationale: « C’est-à-dire » présente les paroles qui suivent comme une paraphrase explicative, alors que le témoin dit seulement « même ces paroles qu’il enseigna ». Il faut conserver ce lien sans l’interpréter.
  - severity: low
    issue: Ajouts discursifs et verbes plus forts aux v. 6–8
    rationale: « Enfin », « déclara » et « expliqué » dépassent respectivement les simples enchaînements « et », « disant » et « n’informa pas » du témoin. Des termes neutres préservent mieux la portée du texte.
  - severity: low
    issue: Métaphore française peu naturelle au v. 4
    rationale: « Scellé vos cœurs » est compréhensible mais peu idiomatique. « Fermé vos cœurs » conserve l’idée de fermeture/obstruction sans modifier la polémique rapportée du pharisien.
