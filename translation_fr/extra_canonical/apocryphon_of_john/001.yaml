translation:
  language: fr
  text: '**L’Enseignement du Sauveur : Jean et le pharisien**


    1. L’enseignement [du] Sauveur, [la révélation] des mystères et [les] paroles cachées dans le silence, [c’est-à-dire les paroles qu’]il enseigna à Jean, [son] disciple.


    2. [Or], il arriva [un jour] que Jean, [le frère] de Jacques — tous deux fils de Zébédée — monta au Temple. Un pharisien nommé Arimanios [vint vers] lui et lui demanda : « [Où] est ton maître, [celui que] tu suivais ? »


    3. Il lui [répondit] : « Il est retourné au [lieu] d’où il était [venu]. »


    4. Le pharisien [lui dit : « Par ses tromperies, ce Nazaréen] vous a tous dupés. Il a rempli [vos oreilles de mensonges] et scellé [vos cœurs, vous détournant] des traditions [de vos pères]. »


    5. [Quand] j’eus entendu ces paroles, moi, [Jean], [je quittai] le Temple [pour me rendre dans un lieu désert et montagneux]. Je me lamentai [profondément dans mon cœur et me demandai] :


    6. « Comment le Sauveur [a-t-il été établi] ? Pourquoi [son Père] l’a-t-il envoyé [dans le monde] ? Et qui est [son] Père, celui qui [l’a envoyé] ? Enfin, de quelle sorte est l’éon[a] [où nous irons] ?


    7. Car que voulait-il [dire lorsqu’il nous déclara] : “L’éon [où vous irez] est un éon [indestructible]” ?


    8. [Pourtant, il ne] nous a pas expliqué [de quelle sorte il est]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un « éon » peut désigner un âge ou une réalité durable; dans certains écrits anciens, le mot désigne aussi un domaine du monde spirituel. Le terme est conservé ici parce que le passage ne précise pas exactement son sens.
    reason: Éclairer un terme cosmologique technique sans imposer une interprétation unique.
lexical_decisions:
- source_word: savior
  choice: Sauveur
  rationale: Terme français naturel et traditionnel, conservant ici le titre christologique sans ajouter de précision absente du témoin.
- source_word: teacher
  choice: maître
  rationale: Dans le rapport disciple-enseignant, « maître » est plus idiomatique que « enseignant » et garde la nuance d’autorité.
- source_word: appointed
  choice: établi
  rationale: Préserve une certaine ambiguïté quant au mode de désignation ou d’institution du Sauveur, sans préciser « choisi » ou « ordonné ».
- source_word: dispatched
  choice: envoyé
  rationale: « Envoyé » est le terme français naturel pour une mission venant du Père; il évite la tonalité administrative de « dépêché ».
- source_word: aeon
  choice: éon
  rationale: Le terme technique est conservé plutôt que réduit à « monde » ou « éternité », car il peut désigner une réalité ou un domaine transcendant autant qu’un âge.
- source_word: traditions of your fathers
  choice: traditions de vos pères
  rationale: Reproduit l’expression ancestrale sans la moderniser en « ancêtres », afin de garder sa couleur religieuse et polémique.
- source_word: sealed off your hearts
  choice: scellé vos cœurs
  rationale: Conserve la métaphore forte du témoin au lieu de l’aplanir en « endurci » ou « fermé ».
theological_decisions:
- issue: Nature de l’« éon »
  choice: Conserver « éon » et l’indétermination « de quelle sorte »
  alternative: Traduire par « monde éternel », « éternité » ou « âge »
  rationale: Le passage pose précisément une question sur la nature de cet éon; une équivalence plus interprétative résoudrait prématurément la tension cosmologique et eschatologique.
- issue: Origine et établissement du Sauveur
  choice: « Comment le Sauveur a-t-il été établi ? »
  alternative: « Comment le Sauveur a-t-il été choisi/nommé ? »
  rationale: « Établi » ne tranche pas entre nomination, institution, manifestation ou origine métaphysique.
- issue: Retour du maître
  choice: « retourné au lieu d’où il était venu »
  alternative: Expliciter une ascension au ciel ou un retour auprès du Père
  rationale: Le texte reste indirect; la traduction ne précise donc ni le lieu ni le mode du retour.
translation_notes:
  register: Français international moderne, digne et accessible. Les crochets appartenant au corps du texte signalent les passages endommagés ou rétablis par les éditeurs du témoin. La formulation demeure provisoire, puisque la demande indique qu’une vérification directe du copte reste à effectuer; elle suit donc avec prudence le témoin anglais public fourni et évite de présenter ses restitutions comme certaines.
