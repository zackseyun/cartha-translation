lexical_decisions:
- source_word: lo
  choice: voici que
  rationale: Conserve l’effet soudain et visionnaire de l’interjection tout en restant naturel en français.
- source_word: glowed
  choice: resplendit
  rationale: Exprime une illumination éclatante de la création sans préciser une source de lumière absente du témoin.
- source_word: appearance
  choice: apparition
  rationale: Dans cette scène visionnaire, « apparition » désigne naturellement une manifestation visible tout en évitant de la réduire à une simple apparence trompeuse.
- source_word: diverse entity
  choice: être composé de plusieurs entités
  rationale: Rend intelligible la négation d’une pluralité d’êtres, en contraste avec les formes multiples d’une seule apparition.
- source_word: unmoving race
  choice: lignée immuable
  rationale: « Lignée » est plus naturel et moins chargé biologiquement que « race » en français moderne ; « immuable » préserve l’idée de stabilité ou d’absence de mouvement.
- source_word: Perfect Man
  choice: Homme parfait
  rationale: Conserve le titre anthropologique et sa portée technique, avec des majuscules signalant son emploi comme désignation.
- source_word: companion spirits
  choice: esprits qui sont tes compagnons
  rationale: Préserve la relation de compagnonnage sans transformer les esprits en « frères », notion non explicite dans le témoin.
theological_decisions:
- issue: Identité triple de celui qui apparaît
  choice: « je suis le Père, je suis la Mère, je suis le Fils »
  alternative: Harmoniser cette formule avec une terminologie trinitaire ecclésiale
  rationale: La traduction conserve sans l’expliquer ni la normaliser la formulation théologiquement tendue du témoin.
- issue: Une apparition unique présentant plusieurs formes
  choice: Distinguer un seul être apparent de ses formes multiples
  alternative: Parler de trois personnes ou de trois êtres
  rationale: Le passage affirme à la fois l’unité de l’apparition et sa manifestation sous trois formes ; la traduction maintient cette tension.
- issue: Sens de « son » dans la comparaison
  choice: « un fils »
  alternative: « le Fils » ou « un jeune homme »
  rationale: L’article indéfini et la minuscule préservent la comparaison du témoin sans identifier d’office cette forme au Fils nommé ensuite.
- issue: Réalités non encore manifestées
  choice: « qui ne sont pas encore manifestées »
  alternative: « qui n’existent pas »
  rationale: Le contexte oppose manifestation et non-manifestation ; l’ajout explicatif « encore », déjà signalé comme implicite dans le témoin, évite de confondre invisibilité actuelle et inexistence absolue.
translation_notes:
  register: Français international moderne, digne et accessible. Les crochets ont été conservés pour signaler les restitutions du texte lacunaire. Le numéro de page intrusif « 2 » n’a pas été repris. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et attend une vérification directe du copte.
