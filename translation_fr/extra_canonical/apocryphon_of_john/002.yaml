translation:
  language: fr
  text: 'Aussitôt, [tandis que je méditais sur ces choses], voici que [les cieux s’ouvrirent, que] la création [tout entière] sous le ciel resplendit et que [le monde] fut ébranlé.


    [Je fus saisi de crainte et voici que] je vis, au sein de la [lumière, un enfant qui se tenait] près de moi.


    Tandis que je [le] contemplais, [il devint] semblable à un vieillard ; puis il [changea d’]apparence et devint semblable à un fils[a].


    Ce n’était [pas un être composé de plusieurs entités] devant moi ; c’était plutôt une [apparition] aux formes multiples dans la [lumière]. [Les ressemblances] apparaissaient l’une à travers l’autre, et l’[apparition] avait trois formes.


    Il me demanda : « Jean, Jean, pourquoi t’étonnes-tu et pourquoi [as-tu] peur ?


    Cette apparition vous est-elle inconnue à tous ?


    Je veux dire : n’[aie] pas le cœur faible.


    Je suis celui qui [est] toujours [avec vous tous].


    Je [suis le Père], je suis la Mère, je suis le Fils.


    Je suis celui qui est sans souillure et sans tache.


    [Je suis maintenant venu t’apprendre] ce qui est, [ce qui était] et ce qui [arrivera], afin que [tu comprennes les réalités] qui ne sont pas encore manifestées [et celles qui le sont, et pour t’apprendre ce qui concerne] la [lignée immuable de] l’[Homme parfait].


    [Relève donc] ton [visage, afin] de [recevoir] ce que je [vais te dire] aujourd’hui et de [le transmettre aux esprits qui sont tes compagnons], ceux de la [lignée immuable] de l’[Homme] parfait. »'
