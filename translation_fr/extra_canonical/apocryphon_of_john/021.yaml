translation:
  language: fr
  text: '« Devant toi, j’ai mené tout cela à son terme pour toi. Je t’ai tout dit afin que tu le mettes par écrit et le transmettes en secret à ceux qui sont tes compagnons dans l’Esprit[a], car tel est le mystère de la lignée immuable[b]. »


    Le Sauveur lui confia aussi ces paroles afin qu’il les mette par écrit et les garde sous clé. Il lui dit : « Maudit soit quiconque échangera ces paroles contre un don — nourriture, boisson, vêtements ou quoi que ce soit de semblable. »


    Ces paroles lui furent aussi confiées dans le secret du mystère. Soudain, le Sauveur disparut de devant lui. Jean rejoignit alors les disciples qui étaient ses compagnons et leur rapporta ce que le Sauveur lui avait dit.


    Jésus-Christ. Amen.


    L’Écrit secret selon Jean'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduite par « ceux qui sont tes compagnons dans l’Esprit » peut aussi se rendre plus littéralement par « tes esprits compagnons ». Le texte exact devra être revu directement sur les témoins coptes.
    reason: Le témoin anglais laisse incertain si « spirits » désigne des compagnons spirituels ou des esprits distincts.
  - marker: b
    text: 'Ou : « la lignée inébranlable ». L’expression traditionnelle peut évoquer une lignée stable, immuable ou impossible à ébranler.'
    reason: Préserver l’éventail sémantique de « unmoving race » et éviter de figer une lecture théologique avant la vérification du copte.
lexical_decisions:
- source_word: in your hearing
  choice: Devant toi
  rationale: La formule du témoin anglais est peu naturelle si elle est calquée littéralement. « Devant toi » conserve l’idée d’une révélation prononcée en présence de Jean sans préciser davantage un texte copte encore à vérifier.
- source_word: companion spirits
  choice: ceux qui sont tes compagnons dans l’Esprit
  rationale: Cette formulation garde la dimension spirituelle tout en produisant un français intelligible; elle évite l’étrange « esprits compagnons », qui pourrait faire croire à des êtres désincarnés.
- source_word: unmoving race
  choice: lignée immuable
  rationale: « Lignée » rend le groupe ou la descendance désignés par race/γενεά dans ce langage traditionnel, tandis qu’« immuable » conserve l’idée de stabilité sans suggérer une immobilité physique.
- source_word: locked away
  choice: les garde sous clé
  rationale: Expression française naturelle qui préserve l’exigence de mise à l’écart et de protection du texte.
- source_word: trade ... for a gift
  choice: échangera ... contre un don
  rationale: Le choix conserve l’ambiguïté entre vente, troc et remise contre rémunération, sans réduire l’interdit au seul commerce monétaire.
- source_word: in a mystery
  choice: dans le secret du mystère
  rationale: Cette tournure préserve à la fois le caractère caché de la transmission et le terme religieux « mystère », malgré l’obscurité de la formule du témoin.
- source_word: The Secret Writing According to John
  choice: L’Écrit secret selon Jean
  rationale: Titre clair et digne; « écrit » reste plus neutre que « livre » ou « révélation », et « selon Jean » suit la forme traditionnelle des titres anciens.
theological_decisions:
- issue: Identité des « companion spirits »
  choice: ceux qui sont tes compagnons dans l’Esprit
  alternative: tes esprits compagnons
  rationale: Le texte peut désigner des êtres ou des personnes spirituellement apparentées. La traduction choisie demeure compréhensible sans imposer une ontologie particulière; une note signale l’ambiguïté.
- issue: Sens de « unmoving race »
  choice: lignée immuable
  alternative: race inébranlable / génération immobile
  rationale: « Immuable » exprime une stabilité constitutive ou spirituelle sans trancher entre absence de mouvement, fermeté et invariabilité. « Lignée » évite les connotations raciales modernes.
- issue: Antécédent des pronoms du récit final
  choice: nommer « le Sauveur » et « Jean » lorsque le français l’exige
  alternative: maintenir partout « il/lui »
  rationale: Les pronoms successifs deviennent opaques en français. Les référents sont explicités seulement là où le contexte narratif les rend raisonnablement clairs, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative a été légèrement clarifiée, et les référents pronominaux ont été explicités lorsque nécessaire. Le numéro de page manuscrit « 32 » n’est pas reproduit. Comme la consultation directe du copte est signalée comme encore en attente, les formulations les plus incertaines sont conservées avec prudence et documentées en notes.
