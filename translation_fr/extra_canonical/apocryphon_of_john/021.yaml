    reason: Préserver l’ambiguïté de « companion spirits » sans imposer une ontologie ni une interprétation ecclésiale.
  - marker: b
    text: 'Ou : « la race immuable », « la génération inébranlable » ou « la lignée inébranlable ». Le terme désigne ici un collectif dans un langage ancien; il ne préjuge pas du sens moderne du mot « race ».'
    reason: Conserver l’expression collective et l’ambiguïté sémantique de « unmoving race ».
  revision_rationale: La révision supprime deux interprétations ajoutées par le projet (« dans l’Esprit » et « le secret du mystère »), maintient la terminologie collective et mystérieuse du témoin avec des notes prudentes, et évite d’expliciter inutilement les pronoms du récit. Le repère de page « 32 », absent du texte anglais POB, demeure omis.
