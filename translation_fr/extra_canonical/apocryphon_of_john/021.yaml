review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire afin de conserver plus étroitement les expressions du témoin fourni. « Ceux qui sont tes compagnons dans l’Esprit » interprète « companion spirits » comme des personnes unies dans l’Esprit, alors que le témoin permet aussi, et formule d’abord, « esprits compagnons ». « Dans le secret du mystère » développe également « in a mystery » au-delà de ce qui est attesté. La formulation d’ouverture est rendue plus directement, sans prétendre résoudre l’étrangeté du témoin anglais en l’absence de contrôle copte direct.
  naturalness: Le français révisé reste moderne et lisible, avec une syntaxe sobre. « Esprits compagnons » est inhabituel, mais son étrangeté reflète celle du témoin et est explicitée en note plutôt que normalisée par une interprétation.
  terminology: « Race inébranlable » conserve le terme collectif traditionnel du témoin (« race ») et l’image de ce qui ne peut être ébranlé; une note indique les rendus possibles sans fixer une lecture doctrinale. « Écrit secret selon Jean » et « Sauveur » conviennent au registre et au titre transmis.
  issues:
  - severity: medium
    issue: Interprétation de « companion spirits »
    rationale: La traduction « ceux qui sont tes compagnons dans l’Esprit » transforme une expression nominale ambiguë en une relation spirituelle entre personnes. Il est plus sûr de conserver « tes esprits compagnons », avec note.
  - severity: medium
    issue: Développement de « in a mystery »
    rationale: « Dans le secret du mystère » ajoute l’idée de secret au syntagme source. « Dans un mystère » préserve l’ambiguïté et le vocabulaire du témoin.
  - severity: low
    issue: Rendu de « unmoving race »
    rationale: « Lignée immuable » est possible, mais « race » est le terme collectif du témoin et peut être maintenu dans ce contexte ancien, avec une note qui évite d’en projeter le sens moderne.
  - severity: low
    issue: Ajout explicatif de référents narratifs
    rationale: Nommer Jean et reformuler « de devant lui » clarifie, mais le témoin ne nomme pas le personnage dans cette phrase. Les pronoms peuvent être conservés; « disparut d’auprès de lui » est plus proche de « vanished from him ».
  revised_text: '« En ta présence, j’ai tout achevé pour toi; mais je t’ai tout dit afin que tu les mettes par écrit et que tu les transmettes en secret à tes esprits compagnons[a], car c’est là le mystère de la race inébranlable[b]. »


    Le Sauveur lui confia aussi ces paroles afin qu’il les mette par écrit et les garde sous clé. Il lui dit : « Maudit soit quiconque échangera ces paroles contre un don : nourriture, boisson, vêtements ou toute autre chose semblable. »


    Ces paroles lui furent aussi confiées dans un mystère, et soudain il disparut d’auprès de lui. Il partit rejoindre ses compagnons, les disciples, et leur rapporta ce que le Sauveur lui avait dit.


    Jésus-Christ. Amen.


    L’Écrit secret selon Jean'
