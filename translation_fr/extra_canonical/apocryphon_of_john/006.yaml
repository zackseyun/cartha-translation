translation:
  language: fr
  text: '1. Il contempla aussi Barbelo avec la lumière pure qui entoure l’Esprit invisible, ainsi qu’avec son étincelle, et elle conçut de lui.


    2. Il engendra une étincelle de lumière au moyen d’une lumière semblable à la béatitude, mais celle-ci n’égale pas sa grandeur.


    3. Ainsi apparut un Fils unique de la Mère-Père, issu d’elle : son unique descendant, le Fils unique du Père, la lumière pure.


    4. L’Esprit invisible et virginal se réjouit lui aussi à cause de la lumière qui était venue à l’existence, issue de la première puissance de sa Providence — c’est-à-dire Barbelo —,


    5. et il l’oignit de son onction jusqu’à ce qu’il devienne parfait. Il ne lui manquait rien de l’onction, car il l’avait oint de l’onction de l’Esprit invisible. Celui-ci se tenait auprès de lui tandis qu’il la répandait sur lui. Dès qu’il eut reçu de l’Esprit, il glorifia l’Esprit saint et la Providence parfaite grâce à laquelle il était issu.


    6. Il demanda aussi qu’on lui donne un compagnon d’œuvre, à savoir l’Intellect, et l’Esprit y consentit avec joie.


    7. Lorsque l’Esprit invisible eut donné son accord, l’Intellect s’approcha. Il se tint auprès du Christ — l’Oint —, le glorifiant ainsi que Barbelo, et tous vinrent demeurer dans le Silence.


    8. L’Intellect voulut aussi produire quelque chose au moyen du Logos[a] de l’Esprit invisible. Sa volonté devint réalité et s’approcha avec l’Intellect et la Lumière, en le glorifiant.


    9. Le Logos suivit la Volonté, car c’est au moyen du Logos que le Christ, Dieu auto-engendré[b], créa le Tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Logos » peut désigner la Parole, le discours ou la raison. Le terme grec est conservé ici comme titre cosmologique.
    reason: Une traduction unique par « Parole » ou « Raison » réduirait la polysémie du terme technique.
  - marker: b
    text: 'Ou : « Dieu qui s’est engendré lui-même ». Cette appellation traduit une désignation technique de l’être divin issu de lui-même.'
    reason: La forme « auto-engendré » est concise mais peut nécessiter une explicitation pour le lectorat général.
lexical_decisions:
- source_word: Barbelo
  choice: Barbelo
  rationale: Conserve le nom propre technique de la cosmologie du texte sans tenter de l’expliquer ou de le franciser.
- source_word: Mother-Father
  choice: Mère-Père
  rationale: Préserve la formulation paradoxale et androgyne du témoin, essentielle à sa représentation théologique.
- source_word: Mind
  choice: Intellect
  rationale: Terme français naturel dans un registre philosophique et cosmologique; il distingue cette hypostase de la simple activité mentale.
- source_word: Logos
  choice: Logos
  rationale: Le terme est maintenu en translittération afin de préserver sa portée technique et son lien possible avec parole, raison et principe créateur.
- source_word: Providence
  choice: Providence
  rationale: Conserve la personnification cosmologique du témoin, avec majuscule lorsqu’il s’agit de l’entité nommée.
- source_word: Christ (the anointed)
  choice: Christ — l’Oint —
  rationale: Maintient à la fois le titre traditionnel et son sens explicite dans le passage.
- source_word: self-generated God
  choice: Dieu auto-engendré
  rationale: Rend la désignation cosmologique sans l’assimiler à une terminologie confessionnelle ultérieure.
- source_word: the All
  choice: le Tout
  rationale: Majuscule conservée pour signaler la totalité cosmique envisagée comme catégorie technique.
theological_decisions:
- issue: Référents pronominaux dans les phrases sur Barbelo, l’Esprit et la lumière
  choice: Conserver autant que possible les changements de référent et préciser seulement lorsque le français l’exige
  alternative: Identifier systématiquement chaque pronom par un nom propre ou un titre
  rationale: Le témoin anglais repose sur une syntaxe ambiguë et la révision directe du copte reste en attente; une explicitation complète risquerait d’imposer une interprétation.
- issue: Statut du Fils unique issu de la Mère-Père
  choice: « un Fils unique de la Mère-Père »
  alternative: « l’Unique-engendré de la Mère-Père »
  rationale: La formulation choisie reste intelligible en français moderne tout en conservant les désignations successives et leur tension généalogique.
- issue: Perfection acquise par l’onction
  choice: « jusqu’à ce qu’il devienne parfait »
  alternative: « afin qu’il soit rendu parfait »
  rationale: Suit la progression explicite du témoin sans harmoniser cette affirmation avec une christologie canonique ou confessionnelle.
- issue: Relation entre Christ, Logos et Dieu auto-engendré
  choice: Conserver l’enchaînement syntaxique selon lequel le Christ, Dieu auto-engendré, crée au moyen du Logos
  alternative: Identifier explicitement le Christ au Logos
  rationale: Le texte distingue ici les termes tout en les reliant; les fusionner supprimerait une tension réelle du passage.
- issue: Genre grammatical de l’Esprit
  choice: Employer le masculin grammatical exigé par « Esprit » tout en conservant « virginal »
  alternative: Féminiser les reprises pronominales selon certaines reconstructions cosmologiques
  rationale: Le français impose le masculin grammatical, mais « virginal » préserve la caractérisation du témoin sans décider du genre ontologique.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des principaux termes techniques de la cosmologie. La numérotation des paragraphes est conservée. Le numéro de page manuscrit parasite « 7 » a été omis. Comme la révision directe du copte est signalée comme encore en attente, cette proposition reste prudemment fondée sur le témoin anglais public fourni et évite les corrections conjecturales.
