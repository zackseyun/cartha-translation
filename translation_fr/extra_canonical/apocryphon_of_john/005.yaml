base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/005.yaml
  text: '1. She became the universal womb because she is the one who exists before all of them: the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to come forth.


    2. ‹She› asked the unseen, virginal Spirit—that is, Barbelo—to grant her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition approached and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She asked once more that he grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached] and attended Idea and Precognition.


    7. She praised the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also asked that he grant her eternal life, and the unseen Spirit agreed. When he had agreed, Eternal Life approached,


    9. and they [attended] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She asked once more that he grant her truth. And [he agreed], and [when he had] agreed,


    11. Truth approached, and they attended and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—and Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
translation:
  language: fr
  text: '1. Elle devint la matrice universelle, car elle est celle qui existe avant eux tous : la Mère-Père, l’Humain primordial, l’Esprit saint, celle qui est trois fois mâle, trois fois puissante, aux trois noms et androgyne, l’éon éternel parmi les êtres invisibles, celle même qui est issue la première.


    2. ‹Elle› demanda à l’Esprit invisible et virginal — c’est-à-dire Barbelo — de lui accorder la Prescience, et l’Esprit y consentit.


    3. Lorsqu’il eut [consenti], la Prescience s’approcha et se tint auprès de la Providence, celle qui tire son origine de l’Idée de l’Esprit invisible et virginal.


    4. Elle le célébra, [ainsi que] sa puissance parfaite, Barbelo, parce qu’elles étaient venues à l’existence à cause d’elle.


    5. Elle lui demanda encore de lui accorder [l’Incorruptibilité], et il y consentit.


    6. Lorsqu’il eut [consenti], l’Incorruptibilité [s’approcha] et se tint auprès de l’Idée et de la Prescience.


    7. Elle célébra l’Invisible et Barbelo, celle à cause de qui elles étaient venues à l’existence.


    8. Barbelo demanda aussi qu’il lui accorde la vie éternelle, et l’Esprit invisible y consentit. Lorsqu’il eut consenti, la Vie éternelle s’approcha,


    9. et elles [se tinrent auprès d’elles] et célébrèrent l’[Esprit] invisible et Barbelo, à cause de qui elles étaient venues à l’existence.


    10. Elle lui demanda encore de lui accorder la vérité. Et [il y consentit] ; [lorsqu’il eut] consenti,


    11. la Vérité s’approcha, et elles se tinrent auprès d’eux et célébrèrent l’Esprit invisible et admirable, ainsi que sa Barbelo, à cause de qui elles étaient venues à l’existence.


    12. Telle est la pentade éonique du Père, qui est l’Humain primordial, l’image de l’Esprit invisible.


    13. C’est la Providence — c’est-à-dire Barbelo —, ainsi que l’Idée, la Prescience, l’Incorruptibilité, la Vie éternelle et la Vérité.


    14. Telle est la pentade éonique androgyne, qui constitue la décade éonique, laquelle est le Père.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: universal womb
  choice: matrice universelle
  rationale: « Matrice » conserve l’image cosmologique de l’origine et reste naturel dans un registre religieux soutenu.
- source_word: Mother-Father
  choice: Mère-Père
  rationale: Le composé paradoxal et androgyne est maintenu sans l’expliquer ni l’harmoniser.
- source_word: Primal Man / Primal Human
  choice: Humain primordial
  rationale: Ce choix rend la portée anthropologique du titre sans imposer exclusivement le sexe masculin, tout en conservant sa fonction de nom divin.
- source_word: triple-male, triple-powerful, triple-named
  choice: trois fois mâle, trois fois puissante, aux trois noms
  rationale: La série ternaire demeure perceptible en français, avec accord grammatical au référent féminin.
- source_word: aeon / aeonic
  choice: éon / éonique
  rationale: Ces termes techniques préservent le vocabulaire cosmologique du texte plutôt que de le réduire à « âge » ou « éternel ».
- source_word: Precognition
  choice: Prescience
  rationale: « Prescience » désigne naturellement la connaissance anticipée et convient à une hypostase personnifiée.
- source_word: Indestructibility
  choice: Incorruptibilité
  rationale: Terme religieux et philosophique usuel, mieux adapté à une réalité éternelle que le concret « indestructibilité ».
- source_word: attended
  choice: se tenir auprès de
  rationale: Cette formulation conserve l’idée de présence ou d’assistance sans préciser abusivement une relation hiérarchique.
- source_word: Idea
  choice: Idée
  rationale: Le terme abstrait personnifié est conservé au plus près du témoin fourni, sans substituer une terminologie gnostique reconstruite avant révision copte.
theological_decisions:
- issue: Genre à la fois féminin et masculin de Barbelo et de l’Esprit
  choice: Accords féminins pour Barbelo et masculins pour « l’Esprit », tout en conservant les titres androgynes
  alternative: Neutraliser les pronoms ou uniformiser le genre
  rationale: Le français exige des accords grammaticaux, mais le texte affirme explicitement l’androgynie ; celle-ci ne doit pas être effacée.
- issue: Rapport entre Barbelo et la « puissance parfaite » au verset 4
  choice: 'Conserver l’apposition ambiguë : « sa puissance parfaite, Barbelo »'
  alternative: Affirmer explicitement que Barbelo est la puissance parfaite ou qu’elle en est distincte
  rationale: La syntaxe du témoin permet plusieurs lectures ; la traduction évite de trancher une identification théologique incertaine.
- issue: Pentade et décade malgré l’énumération du verset 13
  choice: Maintenir littéralement « pentade » et « décade » sans recalculer ni réorganiser les entités
  alternative: Expliquer les termes comme cinq couples ou modifier l’énumération
  rationale: La structure cosmologique et sa tension numérique appartiennent au texte et ne doivent pas être harmonisées sans preuve manuscrite.
- issue: Identification du Père, de l’Humain primordial et de la pentade au verset 12
  choice: Préserver la chaîne syntaxique telle quelle
  alternative: Modifier les relatifs pour distinguer explicitement ces réalités
  rationale: Le passage laisse incertain l’antécédent exact de « qui » ; une clarification doctrinale dépasserait les données disponibles.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des termes cosmologiques techniques. Les chevrons et crochets éditoriaux du témoin ont été conservés. Le brouillon reste provisoire puisque la révision directe du copte est annoncée comme en attente ; aucune conjecture supplémentaire n’a été introduite.
