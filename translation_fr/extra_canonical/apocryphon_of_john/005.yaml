review_pass:
  verdict: revise
  source_fidelity: 'La version suit fidèlement le témoin anglais provisoire et conserve avec soin les titres cosmologiques, les restaurations entre crochets et le marqueur ‹Elle›. Deux formulations ajoutent toutefois des compléments ou une articulation qui ne figurent pas dans le témoin : « se tinrent auprès d’elles/d’eux » interprète indûment l’ellipse de « attended », et le v. 10 omet le second « et » explicitement transmis.'
  naturalness: Le français est globalement naturel, soutenu et adapté à un texte cosmologique ancien. « Être présentes » permet de rendre sobrement, sans complément ajouté, l’idée minimale de présence/assistance dans les deux occurrences concernées.
  terminology: « matrice universelle », « Mère-Père », « Humain primordial », « Prescience », « Incorruptibilité », « éonique », « pentade » et « décade » sont cohérents et appropriés. La majuscule aux hypostases personnifiées est maintenue. « Esprit saint » reste recevable ici, puisque le témoin ne présente pas nécessairement ce titre comme le nom chrétien stabilisé « Esprit Saint ».
  issues:
  - severity: medium
    issue: Les v. 9 et 11 introduisent un complément absent du témoin par « se tinrent auprès d’elles/d’eux ».
    rationale: Le texte de contrôle porte simplement « they [attended] » au v. 9 et « they attended » au v. 11, sans préciser un destinataire ni exiger un pluriel masculin. La traduction actuelle fixe donc une relation et, au v. 11, un genre grammatical que le témoin ne fixe pas.
  - severity: low
    issue: Le v. 10 ne rend pas le second « and » avant la restauration « [when he had] agreed ».
    rationale: Le témoin lit « And [he agreed], and [when he had] agreed ». Maintenir les deux conjonctions et les limites des crochets préserve plus exactement la syntaxe fragmentaire transmise.
  - severity: low
    issue: Au v. 4, « [ainsi que] » amplifie légèrement la simple restauration « [and] ».
    rationale: « [et] » suffit en français et reproduit plus directement le caractère minimal de la restitution éditoriale.
