translation:
  language: fr
  text: '1. Je demandai aussi au Sauveur : « Seigneur, toutes les âmes seront-elles donc conduites saines et sauves jusqu’à la lumière pure ? »


    2. Il me répondit : « De grandes pensées se sont élevées dans ton esprit, car il est difficile de les expliquer aux autres, sauf à ceux qui appartiennent à la race immuable.[a]


    3. Ceux sur qui reposera l’Esprit de vie et à qui il donnera la puissance seront sauvés et deviendront parfaits. Ils seront dignes de la Grandeur et, là, ils seront purifiés de tout mal ainsi que de toute participation au mal.


    4. Dès lors, puisqu’ils n’auront d’autre préoccupation que l’incorruptibilité, à laquelle ils s’attacheront désormais, sans colère, envie, jalousie, désir ni avidité pour quoi que ce soit, rien ne les troublera, si ce n’est leur condition d’existence dans la chair. Ils la supporteront en attendant avec espérance le moment où ceux qui les accueillent viendront à leur rencontre.[b]


    5. De telles personnes sont donc dignes de la vie éternelle et incorruptible, ainsi que de l’élection, parce qu’elles résistent à tout et endurent tout, afin d’achever la course et d’hériter la vie éternelle. »


    6. Je lui demandai : « Seigneur, les âmes de ceux qui n’auront pas accompli ces œuvres, mais sur qui la puissance ‹et› l’Esprit de vie étaient descendus, seront-elles [rejetées] ? »[c]


    7. Il me répondit : « Si l’Esprit est descendu sur eux, ils seront néanmoins sauvés et changeront, car la puissance descendra sur tous les êtres humains : sans elle, personne ne peut tenir bon.


    8. Mais après leur naissance, à mesure que l’Esprit de vie grandit et que la puissance vient fortifier cette âme, personne ne pourra l’égarer par des œuvres mauvaises.


    9. En revanche, ceux sur qui descend l’esprit trompeur sont entraînés par lui et égarés. »


    10. Je demandai : « Seigneur, lorsque leurs âmes auront quitté leur chair, où iront-elles ? »


    11. Il sourit et me dit : « L’âme en laquelle la puissance deviendra plus forte que l’esprit méprisable — car elle est forte et fuit le mal — sera sauvée par l’intervention de l’Incorruptible et élevée jusqu’au repos des éons.[d] »


    12. Je demandai : « Seigneur, où demeureront les âmes de ceux qui ignoraient à qui ils appartiennent ? »


    13. Il me dit : « Lorsque l’esprit méprisable s’est renforcé en eux, ils se sont égarés. Il alourdit l’âme et l’entraîne vers des œuvres mauvaises ; il la précipite dans l’oubli. Après qu’elle a quitté le corps, elle est livrée aux puissances issues de l’archonte. Elles l’enchaînent, la jettent en prison et l’escortent jusqu’à ce qu’elle sorte de l’oubli et parvienne à la connaissance. Si elle atteint ainsi la perfection, elle sera sauvée.[e] »


    14. Je demandai : « Seigneur, comment l’âme peut-elle devenir plus petite et retourner à l’état naturel de sa mère, ou dans l’être humain ? »[f]


    15. Il se réjouit de ma question et me dit : « En vérité, tu es bienheureux, car tu as compris qu’une telle âme sera amenée à en suivre une autre, en laquelle demeure l’Esprit de vie.[g]


    16. Elle sera sauvée par son intermédiaire.


    17. Elle ne sera pas jetée de nouveau dans une autre chair. »


    18. Je demandai encore : « Seigneur, où iront les âmes de ceux qui ont connu, mais qui se sont détournés ? »


    19. Il me dit : « Elles seront conduites au lieu où vont les anges du dénuement,[h] ce lieu où il n’y a pas de repentance. Elles y seront gardées jusqu’au jour où ceux qui ont blasphémé contre l’Esprit seront tourmentés, et elles subiront un châtiment qui durera un âge.[i] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Race immuable » est une désignation spirituelle et cosmologique propre à cet écrit ; le mot « race » ne renvoie pas ici aux catégories ethniques modernes.
    reason: Prévenir un contresens moderne tout en conservant le terme technique du témoin.
  - marker: b
    text: L’identité de « ceux qui les accueillent » n’est pas précisée dans ce passage.
    reason: Préserver l’indétermination du terme « receivers ».
  - marker: c
    text: Les chevrons ‹ › signalent un ajout éditorial ; les crochets [ ] signalent une restitution incertaine dans le témoin utilisé.
    reason: Conserver visiblement les signaux critiques demandés et en expliquer la portée.
  - marker: d
    text: Les « éons » peuvent désigner, dans la cosmologie de cet écrit, des réalités ou domaines supraterrestres, et pas seulement des périodes de temps.
    reason: Éclairer un terme technique sans résoudre toute la cosmologie.
  - marker: e
    text: Le texte décrit ici un processus allant de l’oubli à la connaissance et à la perfection ; il n’en précise pas tous les mécanismes.
    reason: Éviter une systématisation doctrinale excessive.
  - marker: f
    text: La formulation de cette question est obscure dans le témoin disponible ; « devenir plus petite », « l’état naturel de sa mère » et « dans l’être humain » demeurent incertains.
    reason: Signaler une difficulté majeure qui requiert une vérification directe du copte.
  - marker: g
    text: « Sera amenée à en suivre une autre » rend une formulation difficile, parfois comprise comme le fait de succéder à une autre âme ou d’être placée à sa suite.
    reason: Préserver une ambiguïté textuelle importante.
  - marker: h
    text: « Anges du dénuement » traduit littéralement une expression dont la portée précise est incertaine.
    reason: Ne pas imposer une identification démonologique non attestée par le passage.
  - marker: i
    text: L’expression traduite par « qui durera un âge » peut être comprise de diverses manières quant à sa durée exacte ; elle n’est pas rendue ici par « éternel » afin de conserver cette ambiguïté.
    reason: Préserver la tension sémantique et théologique de l’expression.
lexical_decisions:
- source_word: unmoving race
  choice: race immuable
  rationale: Conserve la désignation technique et l’idée de stabilité propre à la cosmologie du texte, sans l’interpréter comme une ethnie moderne.
- source_word: indestructibility / indestructible one
  choice: incorruptibilité / l’Incorruptible
  rationale: « Incorruptibilité » est naturel dans un registre religieux français et exprime l’absence de corruption ou de destruction ; la majuscule marque l’emploi substantivé personnel sans préciser davantage son identité.
- source_word: receivers
  choice: ceux qui les accueillent
  rationale: Évite le calque peu naturel « receveurs » tout en maintenant la fonction d’accueil sans identifier ces êtres au-delà du témoignage fourni.
- source_word: false spirit
  choice: esprit trompeur
  rationale: Rend la fonction d’égarement plus naturellement que « faux esprit », tout en préservant son opposition à l’Esprit de vie.
- source_word: vile spirit
  choice: esprit méprisable
  rationale: Maintient la qualification fortement négative sans confondre ce terme avec « l’esprit trompeur » par une harmonisation complète.
- source_word: aeons
  choice: éons
  rationale: Conserve le terme cosmologique technique plutôt que de le réduire à de simples périodes temporelles.
- source_word: archon
  choice: archonte
  rationale: Terme français établi pour le dirigeant cosmique de ce corpus.
- source_word: age-long punishment
  choice: un châtiment qui durera un âge
  rationale: Préserve le lien lexical avec « âge/éon » et l’ambiguïté de durée, sans imposer « éternel ».
theological_decisions:
- issue: Portée du salut au verset 7
  choice: « ils seront néanmoins sauvés »
  alternative: « ils pourront néanmoins être sauvés »
  rationale: Le témoin formule une affirmation au futur ; la traduction n’en atténue pas la force par un modal absent.
- issue: Retour de l’âme aux versets 14–17
  choice: Conserver la formulation d’une âme qui en suit une autre et n’est plus jetée dans une autre chair
  alternative: Expliciter une doctrine précise de réincarnation ou de transmission spirituelle
  rationale: Le passage est textuellement et conceptuellement difficile ; aucune doctrine plus déterminée ne doit être importée.
- issue: Identité de l’Incorruptible au verset 11
  choice: Employer un titre substantivé sans identification supplémentaire
  alternative: L’identifier explicitement à Dieu, au Sauveur ou à une autre figure
  rationale: Le témoin ne résout pas ici cette identité.
- issue: Durée du châtiment au verset 19
  choice: « qui durera un âge »
  alternative: « éternel » ou « temporaire »
  rationale: Cette formulation garde ouverte la valeur exacte de l’expression temporelle et évite de trancher une tension théologique.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions dialogiques sont légèrement allégées sans supprimer la progression du passage. La terminologie cosmologique propre au texte est conservée et, lorsque nécessaire, expliquée en note. Ce brouillon repose sur le témoin anglais public fourni ; une révision directe des témoins coptes reste nécessaire, surtout aux versets 6, 11, 14–16 et 19.
