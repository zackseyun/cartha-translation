status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement avec fidélité le témoin anglais fourni et conserve les crochets, parenthèses et lacunes. Une correction est nécessaire au §23 : « ne s’est pas vu attribuer aucune mesure » ne rend pas de façon suffisamment littérale la formulation doublement négative du témoin (« was not not assigned ») et ajoute une tournure réflexive absente. Au §22, « temporalité » rend plus précisément le terme technique « temporality ». Au §34, le point d’interrogation ajouté après « toute chose » n’est pas attesté par le témoin et modifie la segmentation syntaxique.'
  naturalness: Le registre est soutenu, lisible et adapté à un traité apophatique. Les répétitions sont bien maintenues. La formulation du §23 demeure volontairement heurtée afin de ne pas normaliser une difficulté textuelle signalée par le témoin; elle est explicitée en note.
  terminology: « Monade », « le Tout », « incorruptibilité », « éon », « béatitude » et « compassion » sont des choix cohérents. « Temporalité » est préférable à « temps » au §22, où le texte oppose les éons à une catégorie abstraite. Les désignations Dieu, Père, Esprit et lumière ne sont pas surinterprétées.
  issues:
  - severity: medium
    issue: '§23 : rendu de la double négation'
    rationale: « Il [ne s’est] pas vu attribuer aucune mesure temporelle » introduit « se voir attribuer » et ne préserve pas clairement la construction transmise « He [was not] not assigned ». Une formulation volontairement non normalisée, « Il [n’a pas] été assigné à aucune mesure temporelle », conserve plus directement l’anomalie.
  - severity: low
    issue: '§22 : « au temps »'
    rationale: Le témoin dit « temporality », non simplement « time ». « à la temporalité » maintient la portée conceptuelle de l’opposition.
  - severity: low
    issue: '§34 : point d’interrogation interne ajouté'
    rationale: Le témoin poursuit « existing before [everything, because he] is… » sans question après « everything ». Le retirer évite d’imposer une ponctuation interprétative.
