translation:
  language: fr
  text: '1. [Moi aussi,] j’ai demandé à [comprendre cela, et il m’a dit] : « La Monade [est une unité au-dessus de laquelle il n’y a rien].[a]


    2. [C’est celui qui existe] comme [Dieu] et comme Père du Tout, [l’Invisible], qui est au-dessus du [Tout, qui existe comme] incorruptibilité, [comme] lumière pure qu’aucun [œil] ne peut contempler.


    3. Il [est l’]Esprit [invisible]. Il ne convient pas [de le concevoir] comme un dieu ni comme quoi que ce soit de semblable, car il est plus qu’un dieu : rien n’existe au-dessus de lui et personne ne règne sur lui.


    4. [Cela tient au fait qu’il] n’[existe] pas à l’intérieur de quelque chose qui lui serait inférieur, [puisque tout] existe en lui, car il est celui qui s’est lui-même [établi].[b]


    5. [Il est éternel], puisqu’il n’a besoin de [rien], car [il] est la perfection complète.


    6. [Rien ne lui manquait] dont il aurait eu besoin pour être rendu parfait.


    7. [Au contraire], il est éternellement et pleinement parfait dans la [lumière].


    8. Il est [sans limites], puisqu’il n’existe personne [avant lui] qui puisse lui imposer des limites.


    9. Il est insondable, [puisqu’]il n’existe avant lui personne qui puisse [le sonder].


    10. [Il est] au-delà de toute mesure, puisque personne [n’existait avant lui qui puisse le mesurer].


    11. [Il est invisible, puisque] personne ne l’a [vu].


    12. [Il est éternel], puisqu’il [existe] éternellement.


    13. Il est [indicible, puisque] personne n’existait qui puisse le concevoir afin de parler [de lui].


    14. On ne peut lui donner de nom, puisque [personne n’existait avant lui] qui puisse le [nommer].


    15. Il est [lumière sans mesure], pure, sainte et [sans tache].


    16. Il est indicible, [existant dans une] incorruptibilité [parfaite].


    17. (Il existe) [sans] (être enfermé) dans la perfection, ni dans la béatitude, ni dans la divinité, mais il est souverainement élevé (au-dessus d’elles).


    18. Il n’est ni corporel [ni] incorporel.


    19. Il n’est ni grand [ni] petit.


    20. [Il est impossible] de dire qu’il a une quantité ou [une qualité], car personne ne peut [le comprendre].


    21. Il n’est pas un être parmi [les êtres, mais il est] souverainement élevé, [non] comme [s’il était plus élevé qu’eux], mais (il est élevé) en lui-même.


    22. Il ne [participe] ni aux éons ni au temps, car celui qui participe à [un éon] établi auparavant [...].[c]


    23. Il [ne s’est] pas vu attribuer aucune mesure temporelle,[d] [puisqu’]il ne reçoit rien d’un autre — [car ce serait reçu] comme un prêt — puisque celui qui existe avant quelqu’un d’autre [n’a pas besoin] d’accepter quoi que ce soit d’[un autre].


    24. Car il est celui qui se contemple lui-même, dans l’attente, au sein de [sa] lumière, puisque le [...] est glorieux.


    25. À lui appartient une pureté sans mesure.


    26. Il est un éon qui donne les éons.


    27. Il est [la vie] qui donne la vie.


    28. Il est un bienheureux qui donne la béatitude.


    29. Il est la connaissance qui donne la connaissance.


    30. [Il est] la bonté qui donne la bonté.


    31. [Il est] la compassion et la rédemption [qui donnent la compassion].[e]


    32. Il est la grâce qui donne la grâce,


    33. [non] parce qu’elle lui appartient, mais parce qu’il donne [la lumière] qui dépasse toute mesure et toute compréhension.


    34. [Comment pourrais-je te parler] de lui, [puisque] son [éon] est au-delà de la destruction, en repos, demeurant dans [le silence et se reposant], existant avant [toute chose ? Car il] est le chef de [tous] les éons, [et] c’est lui qui leur donne la force par sa bonté. »


    [a] « Monade » désigne ici l’unité première et absolue.

    [b] Autre traduction possible : « qui existe par lui-même ».

    [c] La phrase est inachevée dans le texte conservé.

    [d] Le texte transmis présente ici une double négation difficile.

    [e] La formulation transmise associe « compassion et rédemption » au verbe pluriel, mais ne répète ensuite que « compassion ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Monade » désigne ici l’unité première et absolue.
    reason: Clarifier un terme technique conservé dans le corps du texte.
  - marker: b
    text: 'Autre traduction possible : « qui existe par lui-même ».'
    reason: Préserver l’ambiguïté de « self-established ».
  - marker: c
    text: La phrase est inachevée dans le texte conservé.
    reason: Signaler la lacune indiquée par l’ellipse.
  - marker: d
    text: Le texte transmis présente ici une double négation difficile.
    reason: Avertir le lecteur d’une anomalie textuelle délibérément conservée.
  - marker: e
    text: La formulation transmise associe « compassion et rédemption » au verbe pluriel, mais ne répète ensuite que « compassion ».
    reason: Rendre visible l’asymétrie du texte au lieu de la corriger silencieusement.
lexical_decisions:
- source_word: monad
  choice: Monade
  rationale: Le terme technique est conservé, avec une note explicative, afin de préserver sa portée métaphysique sans le réduire au simple mot « unité ».
- source_word: the All
  choice: le Tout
  rationale: Formulation consacrée et intelligible pour la totalité cosmique dans ce contexte.
- source_word: indestructability / indestructibility
  choice: incorruptibilité
  rationale: « Incorruptibilité » rend naturellement en français l’état impérissable visé, tandis que « indestructibilité » serait plus matériel.
- source_word: aeon
  choice: éon
  rationale: Le terme technique est maintenu parce qu’il peut désigner ici une réalité transcendante aussi bien qu’une durée; « éternité » résoudrait indûment cette ambiguïté.
- source_word: mercy
  choice: compassion
  rationale: Choix courant et non confessionnel, adapté à une qualité qui se communique.
- source_word: blessedness
  choice: béatitude
  rationale: Ce terme distingue l’état conféré de la simple bénédiction prononcée.
- source_word: self-established
  choice: s’est lui-même établi
  rationale: Traduction formelle dans le texte, avec « existe par lui-même » signalé comme autre possibilité.
theological_decisions:
- issue: « more than a god »
  choice: « plus qu’un dieu »
  alternative: « supérieur à Dieu »
  rationale: La formulation comparative et l’article indéfini sont préservés sans identifier ou opposer explicitement cette figure au Dieu d’une tradition particulière.
- issue: Négation des catégories corporelle et incorporelle
  choice: « ni corporel ni incorporel »
  alternative: Interpréter « incorporel » comme « spirituel »
  rationale: La tension apophatique du texte est maintenue au lieu d’être harmonisée.
- issue: Rapport à la perfection, la béatitude et la divinité
  choice: « sans être enfermé dans… souverainement élevé au-dessus d’elles »
  alternative: « il n’est pas perfection, béatitude ou divinité »
  rationale: La syntaxe transmise porte sur la non-délimitation par ces catégories, non nécessairement sur leur négation absolue.
- issue: Double négation du paragraphe 23
  choice: Conserver « ne… pas… aucune » et l’annoter
  alternative: Normaliser en « aucune mesure temporelle ne lui a été attribuée »
  rationale: La source de travail signale expressément une double négation difficile; la régulariser masquerait une incertitude textuelle réelle.
- issue: Genre grammatical de la Monade et reprises pronominales
  choice: Passage à « celui » puis « il » selon le témoin
  alternative: Maintenir partout le féminin « elle »
  rationale: Le français « Monade » est féminin, mais le passage décrit ensuite explicitement Dieu, Père et Esprit au masculin; la transition du texte est conservée.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des crochets, parenthèses et lacunes du témoin fourni. Projet provisoire fondé sur le témoin anglais public indiqué; une révision directe du copte reste nécessaire. La répétition rhétorique et le langage apophatique ont été préservés.
