translation:
  language: fr
  text: '**1.** Lorsqu’ils regardèrent en bas, ils se rendirent compte que son intelligence surpassait la leur. Ils se réunirent donc en conseil avec l’ensemble des archontes et tous les anges.


    **2.** Ils prirent du feu, de la terre et de l’eau, les mêlèrent les uns aux autres avec les quatre vents de feu, puis les travaillèrent ensemble dans un grand tumulte. Ils l’emmenèrent dans l’ombre de la mort afin de le façonner de nouveau[a] à partir de terre, d’eau, de feu et de vent — lui dont l’origine est dans la matière, c’est-à-dire l’ignorance des ténèbres, la convoitise et leur esprit mensonger.


    **3.** Voilà le tombeau, la forme du corps dont les brigands revêtirent l’être humain, la chaîne de l’oubli. Et il devint un homme mortel.


    **4.** Celui-ci est le premier qui descendit, et la première séparation. Mais la Pensée de la Lumière, qui demeurait en lui, éveilla son intelligence.


    **5.** Ensuite, les archontes l’amenèrent et le placèrent dans le paradis. Ils lui dirent : « Mange », ce qui signifie : « dans l’indolence »[b]. Car leur délice est assurément amer et leur beauté, corrompue. Leur délice n’est que tromperie, leurs arbres sont impiété, leur fruit est un poison incurable et leur promesse, la mortalité.


    **6.** Ils avaient cependant placé leur arbre de vie au milieu du paradis. Je vais vous enseigner le mystère de leur vie : c’est le complot qu’ils ont tramé ensemble, à l’image de leur esprit.


    **7.** Sa racine est amère et ses branches sont mortalité. Son ombre est haine, et la tromperie habite parmi ses feuilles. Sa fleur est l’onction mauvaise, son fruit est mortalité, la convoitise est sa semence, et il bourgeonne dans les ténèbres.


    **8.** Ceux qui en goûtent ont pour demeure l’Hadès, et les ténèbres sont leur lieu de repos.


    **9.** Mais, afin qu’il ne puisse ni lever les yeux vers sa perfection ni prendre conscience de la honte de sa nudité, ils demeurèrent devant ce qu’ils appellent « l’arbre de la connaissance du bien et du mal », qui est la Pensée de la Lumière[c]. C’est moi, cependant, qui les ai amenés à manger. »


    **10.** Je demandai aussi au Sauveur : « Seigneur, n’est-ce pas le serpent qui enseigna à Adam à manger ? »


    **11.** Le Sauveur sourit et dit : « Le serpent leur enseigna à manger du mal de la convoitise sexuelle et de la destruction, afin de se servir de lui.


    **12.** De plus, il savait que, sous l’influence de la Pensée de la Lumière qui demeure en lui, celui-ci lui désobéissait : elle rendait son intelligence plus juste que celle de l’archonte suprême. Il voulut donc retirer la puissance qu’il lui avait lui-même donnée et fit tomber Adam dans une “transe”[d]. »


    **13.** Je demandai encore au Sauveur : « Qu’est-ce que cette “transe” ? »


    **14.** Il répondit : « Ce n’est pas ce que Moïse a écrit, ni ce que vous avez entendu. Dans son premier livre, il a dit : “Il le fit dormir.” En réalité, il endormit sa perception. Car il a bien dit par l’intermédiaire du prophète : “J’alourdirai leur cœur, afin qu’ils ne prêtent pas attention et ne voient pas.” »'
