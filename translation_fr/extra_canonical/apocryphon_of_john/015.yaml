    reason: Préserver une formulation difficile sans inventer un jeu de mots ou une explication absente de la source fournie.
  - marker: c
    text: 'La construction de cette phrase est incertaine : elle peut rattacher la Pensée de la Lumière à l’arbre, ou décrire sa présence devant celui-ci. Les référents de « ils » et de « les » restent également ambigus.'
    reason: Informer le lecteur d’une ambiguïté syntaxique et pronominale qui affecte l’interprétation du verset.
  - marker: d
    text: Les référents successifs de « il », « lui » et « celui-ci » ne sont pas tous certains dans le témoin. Le passage semble opposer Adam, animé par la Pensée de la Lumière, à l’archonte suprême.
    reason: Éviter de présenter comme certaine une identification pronominale seulement probable.
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Le terme technique est conservé sous sa forme française courante afin de respecter la cosmologie propre à l’œuvre sans l’assimiler simplement à des « chefs » ou à des autorités humaines.
- source_word: Reflection of Light
  choice: Pensée de la Lumière
  rationale: « Pensée » exprime ici une réalité intérieure et personnifiée plus naturellement que le calque « Réflexion », tout en gardant la majuscule et le féminin du témoin.
- source_word: intellect
  choice: intelligence
  rationale: Terme moderne et accessible qui conserve la dimension cognitive du passage; « intellect » aurait été plus technique et moins naturel pour le lectorat général.
- source_word: lust
  choice: convoitise
  rationale: Choix assez large pour préserver le sens passionnel sans le limiter au sexuel là où le texte ne le précise pas; au v. 11, l’adjectif « sexuelle » est ajouté parce qu’il figure explicitement dans le témoin.
- source_word: Hades
  choice: Hadès
  rationale: Le nom traditionnel distingue ce séjour des morts de toute interprétation confessionnelle plus précise de « l’enfer ».
- source_word: trance
  choice: transe
  rationale: Le mot maintient le contraste polémique établi par le texte avec le simple sommeil du récit mosaïque.
- source_word: mold of the body
  choice: forme du corps
  rationale: « Forme » garde l’idée d’un modèle façonné tout en évitant l’ambiguïté moderne de « moule » et une expression française trop mécanique.
theological_decisions:
- issue: Nature de la Pensée de la Lumière
  choice: Personnification féminine conservée par les accords et les majuscules
  alternative: Réduire l’expression à une faculté mentale impersonnelle
  rationale: Le témoin la présente comme une présence agissante qui demeure en Adam; la traduction ne doit ni effacer cette personnification ni préciser davantage son statut ontologique.
- issue: Identification de l’arbre de la connaissance avec la Pensée de la Lumière au v. 9
  choice: Conserver l’identification grammaticale apparente, avec une note signalant l’obscurité de la construction
  alternative: Réorganiser le verset pour faire de la Pensée de la Lumière un personnage placé devant l’arbre
  rationale: La syntaxe transmise est difficile et ne permet pas de résoudre sûrement le rapport entre l’arbre, la Pensée de la Lumière et les pronoms.
- issue: Lecture négative de l’arbre de vie des archontes
  choice: Conserver « leur arbre de vie » et les prédicats de mortalité
  alternative: Harmoniser cet arbre avec l’arbre de vie positif de la Genèse
  rationale: Le renversement du symbolisme biblique est intentionnel dans ce discours et ne doit pas être atténué.
- issue: Réinterprétation du sommeil d’Adam
  choice: Maintenir l’opposition entre transe, sommeil et perception endormie
  alternative: Harmoniser le passage avec une lecture traditionnelle de Genèse 2
  rationale: Le texte formule explicitement cette correction polémique de Moïse; la tension théologique doit rester visible.
- issue: Référents des pronoms au v. 12
  choice: Conserver autant que possible la chaîne pronominale sans attribuer de noms absents du témoin
  alternative: Remplacer chaque pronom par « Adam » ou « l’archonte suprême »
  rationale: Une explicitation complète résoudrait une ambiguïté réelle du témoin et risquerait d’imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des termes techniques indispensables (« archontes », « Hadès »). La syntaxe a été fluidifiée sans harmoniser les tensions avec la Genèse. Les numéros de pages manuscrites et les renvois entre accolades ont été omis. Cette version reste provisoire, car les données fournies ne contiennent pas le texte copte lui-même et indiquent qu’une révision directe dans la langue source est encore à faire.
