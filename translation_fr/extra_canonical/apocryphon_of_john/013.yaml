  rationale: Préserve l’écho scripturaire tout en respectant la formulation particulière du témoin, qui distingue l’image de Dieu de la ressemblance des autorités.
- issue: Statut de l’Humain primordial
  choice: Majuscules à « Humain primordial »
  alternative: « homme primordial » en minuscules
  rationale: Signale une figure cosmologique déterminée sans lui attribuer une identité doctrinale absente du passage.
- issue: Ambiguïté d’Apocryphon 23
  choice: Conserver une syntaxe proche et ajouter une note d’incertitude
  alternative: Réorganiser la phrase pour attribuer clairement les sept sens soit à Anaro, soit à Ouch-Epi-Ptoe
  rationale: Le témoin est syntaxiquement obscur ; trancher introduirait une interprétation théologique non assurée.
- issue: Vertus et vices au verset 22
  choice: « ressemblent à la fois à des vertus et à des vices »
  alternative: « ont une apparence bonne, mais sont mauvaises »
  rationale: La formulation retenue conserve la tension du témoin au lieu de résoudre moralement son paradoxe.
- issue: Matière personnifiée
