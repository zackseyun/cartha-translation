    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
translation:
  language: fr
  text: '**L’Apocryphon de Jean — Les autorités créent Adam**


    1. Ensuite, grâce à la lumière, ils virent dans l’eau la forme de l’image, et il dit aux autorités qui l’assistaient : « Venez, créons un être humain selon l’image de Dieu et selon notre ressemblance, afin que son image devienne pour nous une lumière. »


    2. Ils créèrent alors au moyen de leurs puissances respectives, conformément aux attributs qui leur avaient été assignés. Chaque autorité apporta un attribut d’après la forme de l’image qu’elle avait vue dans sa dimension psychique[a].


    3. Il créa un être à la ressemblance de l’Humain primordial parfait, et ils dirent : « Appelons-le Adam, afin que son nom devienne pour nous une puissance de lumière. » Alors les puissances se mirent à l’œuvre :


    4. La première, {Bonté:2}[b], créa un os vivant, et la deuxième, Providence, créa un tendon vivant.


    5. La troisième, Divinité, créa une chair vivante, et la quatrième, Seigneurie, créa une moelle vivante.


    6. La cinquième, Royaume, créa du sang vivant.


    7. La sixième, Jalousie, créa une peau vivante.


    8. La septième, Intelligence, créa des cheveux vivants.


    9. Cependant, l’armée des anges l’assistait. Ils reçurent des autorités les sept substances de l’âme vitale, afin de pouvoir déterminer les dimensions des membres et du tronc, ainsi que le bon fonctionnement de toutes les parties les unes avec les autres.


    10. Le premier commença par créer la tête. Eteraphaope-Abron créa sa tête ; Meniggesstroeth, le cerveau ; Asterechmen, l’œil droit ; Thaspomocham, l’œil gauche ; Yeronumos, l’oreille droite ; Bissoum, l’oreille gauche ; Akioreim, le nez ; Banen-Ephroum, les lèvres ; Amen, les dents ; Ibikan, les molaires ; Basiliademe, les amygdales ; Achcha, la luette ; Adaban, le cou ; Chaaman, les vertèbres ; Dearcho, la gorge ; Tebar, l’épaule droite ; N[..., l’]épaule gauche ; Mniarchon, le coude droit ; [...e, le] coude gauche ; Abilrion, l’aisselle droite ; Evanthen, l’aisselle gauche ; Krys, la main droite ; Beluai, la main gauche ; Treneu, les doigts de la main droite ; Balbel, les doigts de la main gauche ; Kriman, les ongles des mains ; Astrops, le sein droit ; Barroph, le sein gauche ; Baoum, l’articulation de l’épaule droite ; Ararim, l’articulation de l’épaule gauche ; Areche, le ventre ; Phthave, le nombril ; Senaphim, l’abdomen ; Arachethopi, les côtes droites ; Zabedo, les côtes gauches
    ; Barias, la hanche droite ; Phnouth, la hanche gauche ; Abenlenarchei, la moelle ; Chnoumeninorin, les os ; Gesole, l’estomac ; Agromauma, le cœur ; Bano, les poumons ; Sostrapal, le foie ; Anesimalar, la rate ; Thopithro, les intestins ; Biblo, les reins ; Roeror, les tendons ; Taphreo, la colonne vertébrale ; Ipouspoboba, les veines ; Bineborin, les artères ; à Aatoimenpsephei appartient le souffle présent dans chaque membre ; Entholleia, toute la chair ; Bedouk, la {partie inférieure:6} droite[b] ; Arabeei, le pénis gauche ; Eilo, le jumeau ; Sorma, les organes génitaux ; Gorma-Kaiochlabar, la cuisse droite ; Nebrith, la cuisse gauche ; Pserem, les reins de la jambe droite[c] ; Asaklas, le rein gauche ; Ormaoth, la jambe droite ; Emenun, la jambe gauche ; Knyx, le tibia droit ; Tupelon, le tibia gauche ; Achiel, le genou droit ; Phneme, le genou gauche ; Phiouthrom, le pied droit ; Boabel, ses orteils ; Trachoun, le pied gauche ; Phikna, ses orteils ; Miamai, les ongles des pieds
    ; Labernioum, [...].


    Cependant, ceux qui sont préposés à tout cela sont au nombre de sept : Athoth, Armas, Kalila, Jabel, Sabaoth, Caïn et Abel.


    Mais ceux qui agissent tout particulièrement dans les membres sont les suivants : pour la tête, Diolimodraza ; pour le cou, Yammeax ; pour l’épaule droite, Yakoubib ; pour l’épaule gauche, Yerton ; pour la main droite, Oudidi ; pour la main gauche, Arbao ; pour les doigts de la main droite, Lampno ; pour les doigts de la main gauche, Leekaphar ; pour le sein droit, Barbar ; pour le sein gauche, Imae ; pour la poitrine, Pisandraptes ; pour l’articulation de l’épaule droite, Koade ; pour celle de l’épaule gauche, Odeor ; pour les côtes droites, Asphixix ; pour les côtes gauches, Synogchouta ; pour le ventre, Arouph ; pour la matrice, Sabalo ; pour la cuisse droite, Charcharb ; pour la cuisse gauche, Chthaon ; pour l’ensemble des organes génitaux, Bathinoth ; pour la jambe droite, Choux ; pour la jambe gauche, Charcha ; pour le tibia droit, Aroer ; pour le tibia gauche, Toechtha ; pour le genou droit, Aol ; pour le genou gauche, Charaner ; pour le pied droit, Bastan ; pour ses orteils,
    Archentechtha ; pour le pied gauche, Marephnounth ; pour ses orteils, Abrana.


    11. Ceux qui exercent leur pouvoir sur tout cela sont au nombre de sept : Michel, Ouriel, Asmenedas, Saphasatoel, Aarmouriam, Richram et Amiorps.


    12. Voici encore ceux qui gouvernent les facultés : Archendekta gouverne les sens ; Deitharbathas, la perception ; Oummaa, l’imagination ; Aachiaram, la mise en proportion ; et Riaramnacho, toutes les impulsions.


    13. L’origine des démons qui habitent le corps entier est établie au nombre de quatre : la chaleur, le froid, l’humidité et la sécheresse.


    14. Leur mère à tous est la matière. Celui qui règne sur la chaleur est Phloxopha ; celui qui règne sur le froid, Oroorrothos ; celui qui règne sur la sécheresse, Erimacho ; et celui qui règne sur l’humidité, Athuro.


    15. Leur mère à tous, Onorthochras, se tient au milieu d’eux, car elle est sans limites et s’unit à chacun d’eux. Elle est véritablement la matière, puisqu’elle les nourrit.


    16. Les quatre démons principaux sont : Ephememphi, qui se rapporte au plaisir ; Yoko, qui se rapporte au désir ; Nenentophni, qui se rapporte au chagrin ; et Blaomen, qui se rapporte à la peur.


    17. Leur mère à tous est Esthensis-Ouch-Epi-Ptoe.


    18. Des quatre démons sortirent les passions. Du chagrin viennent l’envie, la jalousie, le malheur, le tourment, la douleur, la cruauté, l’angoisse, la lamentation, et ainsi de suite.


    19. Du plaisir naissent une multitude de maux, une arrogance creuse, et d’autres choses semblables.


    20. Du désir viennent la colère, la fureur, l’amertume, la passion amère, l’insatisfaction perpétuelle, et d’autres choses semblables.


    21. De la peur viennent l’effroi, la servilité, la détresse et l’humiliation.


    22. Toutes ces choses ressemblent à la fois à des vertus et à des vices.


    23. Cependant, la connaissance de leur réalité vient d’Anaro, le chef de l’âme hylique[a], car elle se rapporte aux sept sens, à Ouch-Epi-Ptoe[d].


    24. Voici le nombre des anges : ils sont en tout 365.


    25. Tous travaillèrent sur lui, membre après membre, jusqu’à ce qu’ils aient achevé aussi bien le corps psychique que le corps hylique[a].


    26. Outre ceux-là, il en existe d’autres qui gouvernent les passions restantes.


    27. Je ne te les ai pas énumérés. Mais si tu veux savoir qui ils sont, tout cela est écrit dans le *Livre de Zoroastre*.


    [a] « Psychique » et « hylique » sont conservés comme termes techniques. Ici, « psychique » se rapporte à l’âme ou à sa dimension, tandis que « hylique » se rapporte à la matière ; les remplacer par des termes plus courants risquerait d’effacer les distinctions propres au texte.


    [b] Les accolades et les chiffres qu’elles renferment signalent des lectures éditoriales énigmatiques ou incertaines dans le témoin de traduction fourni ; ils sont conservés afin de ne pas donner une fausse impression de certitude.


    [c] Littéralement, selon le témoin fourni : « les reins de la jambe droite ». La formulation anatomique paraît obscure ou altérée, mais elle n’est pas corrigée conjecturalement.


    [d] La construction de cette phrase est incertaine : le rapport syntaxique entre Anaro, l’âme hylique, les sept sens et Ouch-Epi-Ptoe demeure ambigu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Psychique » et « hylique » sont conservés comme termes techniques. Ici, « psychique » se rapporte à l’âme ou à sa dimension, tandis que « hylique » se rapporte à la matière ; les remplacer par des termes plus courants risquerait d’effacer les distinctions propres au texte.
    reason: Expliquer des termes techniques indispensables sans les normaliser dans le corps du texte.
  - marker: b
    text: Les accolades et les chiffres qu’elles renferment signalent des lectures éditoriales énigmatiques ou incertaines dans le témoin de traduction fourni ; ils sont conservés afin de ne pas donner une fausse impression de certitude.
    reason: Préserver honnêtement les signes d’incertitude présents dans le témoin disponible.
  - marker: c
    text: 'Littéralement, selon le témoin fourni : « les reins de la jambe droite ». La formulation anatomique paraît obscure ou altérée, mais elle n’est pas corrigée conjecturalement.'
    reason: Signaler une difficulté textuelle ou anatomique manifeste sans correction spéculative.
  - marker: d
    text: 'La construction de cette phrase est incertaine : le rapport syntaxique entre Anaro, l’âme hylique, les sept sens et Ouch-Epi-Ptoe demeure ambigu.'
    reason: Conserver une ambiguïté syntaxique et conceptuelle réelle au verset 23.
lexical_decisions:
- source_word: psychic
  choice: psychique
  rationale: Conservation d’un terme anthropologique technique afin de distinguer la dimension de l’âme de la dimension matérielle sans la normaliser.
- source_word: hylic
  choice: hylique
  rationale: Translittération française consacrée du terme technique relatif à la matière ; « matériel » serait plus naturel, mais moins précis dans ce système conceptuel.
- source_word: authorities
  choice: autorités
  rationale: Rend le titre des puissances cosmiques sans les identifier d’office aux « archontes », terme plus spécialisé que le témoin ne donne pas ici.
- source_word: powers
  choice: puissances
  rationale: Maintient la distinction lexicale avec les « autorités » et convient au registre cosmologique du passage.
- source_word: Primal Man
  choice: Humain primordial
  rationale: Formulation inclusive et naturelle en français, tout en gardant la portée archétypale du personnage céleste.
- source_word: life-soul
  choice: âme vitale
  rationale: Conserve l’association explicite de la vie et de l’âme sans créer un néologisme opaque.
- source_word: womb
  choice: matrice
  rationale: Terme anatomique digne et précis dans une longue liste de parties corporelles.
- source_word: lust
  choice: désir
