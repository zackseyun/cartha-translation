    Elle enfanta donc sans avoir trouvé son compagnon, tout en ayant délibéré sans l’accord de l’Esprit ni la connaissance de son compagnon. Et, en raison de la force invulnérable qui demeurait en elle,



    sa pensée ne resta pas stérile : elle produisit d’elle-même un être incomplet, différent de sa propre apparence. En effet, elle l’avait créé sans son compagnon, et il différait de l’apparence de sa mère, car il possédait une autre forme.



