translation:
  language: fr
  text: 'De plus, puisqu’elle était un éon, Sophia de la Réflexion conçut d’elle-même une pensée, avec la conception de l’Esprit invisible et la Prescience.


    Elle voulut faire naître d’elle-même une ressemblance, sans l’accord de l’Esprit, qui ne l’avait pas approuvé, sans son compagnon et sans qu’il en ait délibéré, alors même que le visage de sa masculinité ne l’avait pas approuvé.


    Elle enfanta donc sans avoir trouvé son compagnon, après avoir délibéré sans l’accord de l’Esprit ni la connaissance de son compagnon. Et, en raison de la force invulnérable qui demeurait en elle,


    sa pensée ne resta pas stérile : elle produisit d’elle-même un être incomplet, différent de sa propre apparence. En effet, elle l’avait créé sans son compagnon, et il différait de l’apparence de sa mère, car il possédait une autre forme.


    Lorsqu’elle vit le fruit de sa propre volonté, il prit la forme d’un dragon à face de lion[a],


    et ses yeux ressemblaient aux feux des éclairs qui fulgurent.


    Elle le repoussa loin d’elle, hors de ces lieux, afin qu’aucun des immortels ne puisse le voir, car elle l’avait créé dans l’ignorance.


    Elle l’enveloppa aussi d’une nuée lumineuse et dressa un trône au milieu de la nuée, afin que personne ne puisse le voir, excepté l’Esprit saint — dont le nom est la Mère des Vivants. Puis elle lui donna le nom de Yaltabaoth[b].


    C’est lui, l’archonte en chef, qui obtint de sa mère une grande puissance.


    Il se détacha d’elle et s’éloigna des lieux où il était né.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais porte « dragon » avec un signal éditorial renvoyant vraisemblablement à une variante ou à une annotation. La vérification directe des témoins coptes reste nécessaire.
    reason: Signaler l’incertitude textuelle sans supprimer le mot transmis par la base de rédaction.
  - marker: b
    text: Le nom est aussi transcrit « Yaldabaoth » dans certaines éditions modernes.
    reason: Informer le lecteur d’une graphie courante du nom sans modifier celle du témoin fourni.
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Le terme technique est conservé, car « âge » ou « monde » effacerait ici son sens d’entité du monde divin.
- source_word: Sophia of Reflection
  choice: Sophia de la Réflexion
  rationale: « Sophia » est gardé comme nom propre traditionnel, tandis que le qualificatif est traduit de façon intelligible.
- source_word: Precognition
  choice: la Prescience
  rationale: La majuscule signale qu’il s’agit vraisemblablement d’une réalité personnifiée ou hypostasiée, sans trancher davantage.
- source_word: bring forth / produced
  choice: faire naître / enfanta / produisit
  rationale: La variation française respecte le champ de l’engendrement tout en évitant une répétition artificielle.
- source_word: chief archon
  choice: l’archonte en chef
  rationale: « Archonte » conserve le titre cosmologique technique; « en chef » exprime sa prééminence sans lui attribuer une fonction étrangère au texte.
- source_word: shining cloud
  choice: nuée lumineuse
  rationale: « Nuée » donne un registre religieux digne tout en restant immédiatement compréhensible.
- source_word: extricated himself
  choice: se détacha
  rationale: Ce choix préserve l’idée de séparation d’avec sa mère sans préciser indûment qu’il se serait libéré d’une contrainte.
theological_decisions:
- issue: Rapport entre Sophia, l’Esprit et son compagnon
  choice: Maintenir les formulations répétées d’absence d’accord, de connaissance et de délibération
  alternative: Résumer l’acte comme une désobéissance ou une création autonome
  rationale: Le témoin distingue plusieurs relations et ne nomme pas explicitement l’acte « péché » ou « désobéissance »; la traduction préserve cette tension.
- issue: « the face of her maleness »
  choice: « le visage de sa masculinité »
  alternative: « son partenaire masculin » ou « son aspect masculin »
  rationale: La formule est obscure et probablement technique. Une traduction assez formelle conserve cette obscurité au lieu de l’identifier sans preuve au compagnon.
- issue: Nature du produit de Sophia
  choice: « un être incomplet »
  alternative: « quelque chose d’incomplet »
  rationale: La suite emploie le masculin personnel et décrit ses actions; « un être » rend cette continuité sans définir sa nature exacte.
- issue: Identité de l’Esprit saint et de la Mère des Vivants
  choice: « l’Esprit saint — dont le nom est la Mère des Vivants »
  alternative: Normaliser selon une formulation trinitaire conventionnelle
  rationale: La désignation propre au texte est conservée sans l’harmoniser avec une théologie ultérieure.
- issue: Puissance reçue par Yaltabaoth
  choice: « obtint de sa mère une grande puissance »
  alternative: « déroba » ou « arracha une puissance »
  rationale: Le verbe du témoin « procured » ne permet pas de déterminer sûrement si l’acquisition fut violente, légitime ou involontaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques « éon » et « archonte » sont conservés. La syntaxe a été allégée lorsque le français l’exigeait, mais les répétitions théologiquement significatives et les ambiguïtés du témoin ont été maintenues. Projet provisoire fondé sur le témoin anglais public fourni; une révision directe du copte est encore requise.
