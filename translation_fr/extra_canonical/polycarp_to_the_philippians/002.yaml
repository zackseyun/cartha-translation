base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: fr
  text: '1 Je me suis vivement réjoui avec vous en notre Seigneur Jésus-Christ, parce que vous avez accueilli ceux qui suivent le véritable Amour et les avez accompagnés dans leur voyage, comme il convenait que vous le fassiez — ces hommes entourés de saintes chaînes, qui sont les couronnes de ceux que Dieu et notre Seigneur ont véritablement choisis.


    2 Je me suis aussi réjoui de ce que la racine ferme de votre foi, renommée depuis les premiers temps, demeure jusqu’à maintenant et porte du fruit pour notre Seigneur Jésus-Christ. Lui qui a enduré jusqu’à la mort pour nos péchés, Dieu l’a ressuscité en le délivrant des douleurs du séjour des morts.[a]


    3 Sans l’avoir vu, vous croyez en lui avec une joie inexprimable et glorieuse, joie dans laquelle beaucoup désirent entrer. Car vous savez que c’est par grâce que vous êtes sauvés, non par les œuvres, mais par la volonté de Dieu, par Jésus-Christ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, d’après le témoin anglais fourni : « ayant délié les douleurs de l’Hadès ». La formulation exacte devra être contrôlée dans les traditions manuscrites grecque et latine.'
    reason: Signale honnêtement que la traduction repose ici sur un témoin anglais public et qu’une expression théologiquement sensible demande une vérification dans les langues anciennes.
lexical_decisions:
- source_word: true Love
  choice: le véritable Amour
  rationale: Conserve la personnification et la majuscule du témoin fourni, sans préciser davantage une expression dont la vérification grecque et latine reste à faire.
- source_word: saintly bonds
  choice: saintes chaînes
  rationale: Rend concrètement l’image des liens de prison tout en préservant leur valeur honorifique et religieuse.
- source_word: diadems
  choice: couronnes
  rationale: « Couronnes » est naturel en français et conserve l’image de dignité et de victoire; « diadèmes » serait plus littéral mais moins courant.
- source_word: steadfast root
  choice: racine ferme
  rationale: Préserve la métaphore végétale et l’idée de stabilité, reprise ensuite par « porte du fruit ».
- source_word: Hades
  choice: séjour des morts
  rationale: Évite l’assimilation automatique à l’enfer comme lieu de châtiment et exprime le domaine des morts dans un français accessible.
- source_word: unutterable and full of glory
  choice: inexprimable et glorieuse
  rationale: Formulation naturelle qui garde les deux qualités attribuées à la joie.
theological_decisions:
- issue: Coordination de « Dieu et notre Seigneur » dans l’élection
  choice: « ceux que Dieu et notre Seigneur ont véritablement choisis »
  alternative: « ceux qui sont véritablement choisis de Dieu et de notre Seigneur »
  rationale: Maintient les deux désignations coordonnées sans décider si elles renvoient à un seul référent ou à deux; l’accord pluriel est commandé par la syntaxe française retenue, non par une résolution christologique.
- issue: Nature des « douleurs du séjour des morts »
  choice: Conserver l’image et ajouter une note sur la tradition textuelle
  alternative: « les liens de la mort »
  rationale: Le témoin anglais fourni lit « pangs of Hades », mais la formule évoque Actes 2.24 et nécessite une vérification directe des témoins grec et latin. La traduction ne doit pas effacer cette incertitude.
- issue: Grâce, œuvres et volonté de Dieu
  choice: « par grâce… non par les œuvres, mais par la volonté de Dieu »
  alternative: Réorganiser la phrase pour expliquer le rapport entre grâce et volonté
  rationale: Préserve la tension et l’enchaînement du témoin sans ajouter une harmonisation doctrinale.
- issue: Objet et temporalité de la foi
  choice: « Sans l’avoir vu, vous croyez en lui »
  alternative: « Bien que vous ne l’ayez pas vu, vous croyez en lui »
  rationale: Conserve le contraste apparent avec 1 Pierre 1.8 dans une formulation française fluide, sans préciser si l’absence de vision appartient uniquement au passé ou se prolonge.
translation_notes:
  register: Français international moderne, digne et accessible. La structure rhétorique en trois mouvements est conservée, avec une ponctuation allégée. Les numéros 1–3 organisent les paragraphes internes du chapitre sans prétendre reproduire une numérotation ancienne. Projet provisoire fondé sur le témoin anglais public fourni; la révision directe du grec et du latin demeure nécessaire.
