review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire en 1.2 : « en le délivrant des douleurs du séjour des morts » fait de Jésus l’objet de la délivrance, alors que le témoin anglais dit que Dieu a « délié les douleurs de l’Hadès ». La correction conserve l’image et l’agent du participe. « Diadèmes » rend plus exactement *diadems* que « couronnes ». Le reste suit fidèlement le témoin anglais fourni, tout en laissant « véritable Amour » non interprété.'
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. « Après avoir délié les douleurs du séjour des morts » est naturel dans un registre scripturaire et évite l’ambiguïté syntaxique de la rédaction actuelle.
  terminology: « Le véritable Amour » conserve délibérément la majuscule et la personnification du témoin. « Séjour des morts » évite de surinterpréter Hades comme un lieu de châtiment. « Diadèmes » maintient l’image précise de dignité honorifique. La formulation concernant l’élection conserve la coordination « Dieu et notre Seigneur » sans trancher une question référentielle ou christologique.
  issues:
  - severity: high
    issue: Le participe relatif aux « douleurs de l’Hadès » est rendu comme si Jésus était délivré de ces douleurs.
    rationale: 'Le témoin porte : « whom God raised, having loosed the pangs of Hades ». La rédaction « Dieu l’a ressuscité en le délivrant » modifie l’objet de l’action. Il faut rendre les douleurs comme l’objet que Dieu délie.'
  - severity: low
    issue: « Couronnes » généralise l’image de « diadems ».
    rationale: « Diadèmes » est courant en français moderne et conserve plus précisément l’image du témoin sans alourdir le texte.
  revised_text: '1 Je me suis vivement réjoui avec vous en notre Seigneur Jésus-Christ, parce que vous avez accueilli ceux qui suivent le véritable Amour et les avez accompagnés dans leur voyage, comme il convenait que vous le fassiez — ces hommes entourés de saintes chaînes, qui sont les diadèmes de ceux que Dieu et notre Seigneur ont véritablement choisis.


    2 Je me suis aussi réjoui de ce que la racine ferme de votre foi, renommée depuis les premiers temps, demeure jusqu’à maintenant et porte du fruit pour notre Seigneur Jésus-Christ. Lui qui a enduré jusqu’à la mort pour nos péchés, Dieu l’a ressuscité après avoir délié les douleurs du séjour des morts.[a]


    3 Sans l’avoir vu, vous croyez en lui avec une joie inexprimable et glorieuse, joie dans laquelle beaucoup désirent entrer. Car vous savez que c’est par grâce que vous êtes sauvés, non par les œuvres, mais par la volonté de Dieu, par Jésus-Christ.'
  revised_footnotes:
  - marker: a
    text: 'Littéralement, d’après le témoin anglais fourni : « ayant délié les douleurs de l’Hadès ». La formulation exacte devra être contrôlée dans les traditions manuscrites grecque et latine.'
    reason: Signale que le texte de travail repose sur le témoin anglais public fourni et préserve l’image des « douleurs de l’Hadès », sans assimiler automatiquement l’Hadès à l’enfer.
  revision_rationale: 'La correction requise porte sur l’objet de « ayant délié les douleurs de l’Hadès » : Dieu délie les douleurs, plutôt que Jésus n’en soit délivré. « Diadèmes » rétablit l’image lexicale du témoin. Aucune interprétation doctrinale supplémentaire n’est introduite; l’incertitude liée à l’absence de contrôle direct des traditions grecque et latine demeure explicitement signalée en note.'
