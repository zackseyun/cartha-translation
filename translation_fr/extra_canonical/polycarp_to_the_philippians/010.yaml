review_pass:
  verdict: revise
  source_fidelity: 'Le texte français suit fidèlement la structure et le sens du témoin anglais, et ses principaux choix correspondent également au grec usuel de PolPhil 9 : obéissance à la parole de justice, persévérance constatée chez les témoins nommés, course non vaine dans la foi et la justice, place due auprès du Seigneur, et Dieu comme agent de la résurrection. Une légère révision permet de mieux rendre l’expression « others ... who came from among yourselves » sans la réduire à une simple appartenance.'
  naturalness: Le français est globalement naturel, digne et accessible. « Toute persévérance » est plus proche de la portée globale de l’original que « une entière persévérance » et se lit sans difficulté dans ce registre. La continuité de la première phrase peut aussi être mieux préservée en rattachant explicitement le pronom relatif à la persévérance.
  terminology: « parole de justice », « persévérance », « bienheureux », « foi et justice », « monde présent » et « apôtres » sont appropriés. « La place qui leur est due auprès du Seigneur » rend plus directement le sens du lieu dû, sans définir la condition posthume. « Ont souffert avec lui » conserve l’association exprimée par συνέπαθον, sans la convertir en souffrance uniquement pour le Christ.
  issues:
  - severity: low
    issue: « qui étaient des vôtres » atténue le mouvement de « qui venaient de chez vous / d’entre vous ».
    rationale: Le témoin anglais dit « who came from among yourselves »; le grec traditionnel porte τοῖς ἐξ ὑμῶν. « qui venaient aussi de chez vous » conserve mieux cette indication tout en restant naturel.
  - severity: low
    issue: « une entière persévérance » est interprétatif et légèrement moins proche de « all endurance ».
    rationale: « Toute persévérance » garde plus nettement l’idée de persévérance sous toutes ses formes ou dans toute son étendue, sans surcharge.
  revised_text: '9 Ainsi donc, je vous exhorte tous à obéir à la parole de justice et à pratiquer toute persévérance, que vous avez vue de vos propres yeux chez les bienheureux Ignace, Zosime et Rufus, chez d’autres encore qui venaient aussi de chez vous, ainsi que chez Paul lui-même et les autres apôtres.


    Soyez convaincus qu’aucun d’eux n’a couru en vain, mais dans la foi et la justice, et qu’ils sont à la place qui leur est due auprès du Seigneur, avec qui ils ont aussi souffert. En effet, ils n’ont pas aimé le monde présent, mais celui qui est mort pour nous et que Dieu a ressuscité pour nous.'
  revised_footnotes: []
  revision_rationale: 'Révision limitée à deux ajustements de fidélité et de formulation : « toute persévérance » reflète plus directement la portée de l’expression source, et « qui venaient aussi de chez vous » conserve l’indication que certains autres témoins provenaient du groupe des destinataires. Le reste est maintenu : notamment l’ambiguïté sobre de la « place » due auprès du Seigneur, l’association des souffrances avec lui, et l’affirmation explicite que Dieu a ressuscité celui qui est mort pour nous.'
