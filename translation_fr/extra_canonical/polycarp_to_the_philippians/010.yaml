base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: fr
  text: '9 Ainsi donc, je vous exhorte tous à obéir à la parole de justice et à pratiquer une entière persévérance. Vous l’avez vue de vos propres yeux chez les bienheureux Ignace, Zosime et Rufus, chez d’autres encore qui étaient des vôtres, ainsi que chez Paul lui-même et les autres apôtres.


    Soyez convaincus qu’aucun d’eux n’a couru en vain, mais dans la foi et la justice, et qu’ils occupent la place qui leur revient auprès du Seigneur, avec qui ils ont aussi souffert. En effet, ils n’ont pas aimé le monde présent, mais celui qui est mort pour nous et que Dieu a ressuscité pour nous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: word of righteousness
  choice: parole de justice
  rationale: Conserve l’expression dense du témoin, qui peut désigner la parole ou le message caractérisé par la justice, sans la réduire à un simple enseignement moral.
- source_word: all endurance
  choice: une entière persévérance
  rationale: « Persévérance » exprime naturellement en français l’endurance fidèle dans l’épreuve; « entière » garde la portée intensive de « all ».
- source_word: blessed
  choice: bienheureux
  rationale: Terme digne et historiquement approprié, sans imposer ici une procédure ultérieure de canonisation.
- source_word: ran not in vain
  choice: n’a couru en vain
  rationale: Préserve la métaphore apostolique de la course, probablement familière au contexte paulinien de la lettre.
- source_word: present world
  choice: monde présent
  rationale: Maintient le contraste eschatologique sans paraphraser « monde » en « époque » ou « vie terrestre ».
- source_word: in the presence of the Lord
  choice: auprès du Seigneur
  rationale: Formulation française naturelle qui garde l’idée de proximité ou de présence devant le Seigneur.
theological_decisions:
- issue: Référent de « celui qui est mort »
  choice: celui qui est mort pour nous
  alternative: Celui qui est mort pour nous
  rationale: La minuscule évite d’ajouter une convention typographique confessionnelle tout en laissant le référent christologique parfaitement clair.
- issue: Agent de la résurrection
  choice: que Dieu a ressuscité
  alternative: qui est ressuscité par Dieu
  rationale: La tournure active conserve explicitement Dieu comme agent et sonne plus naturellement en français moderne.
- issue: Association des souffrances avec le Seigneur
  choice: avec qui ils ont aussi souffert
  alternative: pour qui ils ont aussi souffert
  rationale: Conserve la formulation du témoin et sa possible tension théologique, sans transformer silencieusement l’association au Seigneur en souffrance subie uniquement pour sa cause.
- issue: Sort posthume des personnes nommées
  choice: ils occupent la place qui leur revient auprès du Seigneur
  alternative: ils sont à la place qui leur est due en présence du Seigneur
  rationale: Rend l’assurance du texte sans préciser davantage la nature de cette « place » ni construire une doctrine détaillée de l’état après la mort.
translation_notes:
  register: 'Français international moderne, digne et lisible. La structure exhortative est conservée, avec division en deux paragraphes pour clarifier la longue période. Aucun marqueur de note n’est requis. Projet nécessairement prudent : le dossier fourni indique que la vérification directe de la tradition grecque et latine reste à faire; les choix reposent donc sur le témoin anglais public fourni, consulté comme couche provisoire plutôt que comme base prétendument définitive.'
