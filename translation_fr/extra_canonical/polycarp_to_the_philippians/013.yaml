base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: fr
  text: 'Car je suis convaincu que vous êtes bien instruits dans les saintes Écritures et que rien ne vous échappe. Mais cela ne m’a pas été accordé. Seulement, comme il est dit dans ces Écritures : « Mettez-vous en colère, mais ne péchez pas », et : « Que le soleil ne se couche pas sur votre irritation. » Heureux celui qui s’en souvient ! Et j’ai confiance que c’est bien votre cas.


    Que le Dieu et Père de notre Seigneur Jésus-Christ, ainsi que le grand-prêtre éternel lui-même, le [Fils de Dieu, Jésus-Christ,[a] vous affermissent dans la foi et la vérité, dans toute douceur, dans l’absence de colère, dans la tolérance, la patience prolongée, l’endurance et la pureté. Qu’il vous accorde un héritage et une part parmi ses saints, à vous ainsi qu’à nous avec vous et à tous ceux qui sont sous le ciel, qui croiront en notre Seigneur et Dieu Jésus-Christ et en son Père, qui l’a ressuscité d’entre les morts.


    Priez pour tous les saints. Priez aussi pour les rois, les autorités et les dirigeants, pour ceux qui vous persécutent et vous haïssent, et pour les ennemis de la croix, afin que votre fruit soit manifeste parmi tous et que vous soyez accomplis en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le crochet ouvrant signale une lacune ou une restitution dans la tradition manuscrite; la limite exacte du passage restauré n’est pas indiquée dans le témoin fourni.
    reason: Préserver honnêtement le signal critique présent dans le texte source sans inventer un crochet fermant.
lexical_decisions:
- source_word: sacred writings / scriptures
  choice: saintes Écritures / ces Écritures
  rationale: Rend le caractère sacré et citationnel du terme dans un français biblique actuel, sans archaïsme.
- source_word: wrath
  choice: irritation / colère
  rationale: La citation reçoit « irritation » pour éviter une formulation française maladroite, tandis que la liste morale emploie « absence de colère »; la nuance exacte reste tributaire de la révision grecque/latine.
- source_word: build you up
  choice: vous affermissent
  rationale: Exprime naturellement l’édification spirituelle en français moderne tout en conservant l’idée de consolidation.
- source_word: lot and portion
  choice: un héritage et une part
  rationale: Préserve le doublet sémitisant et son idée d’appartenance accordée parmi les saints.
- source_word: powers and princes
  choice: les autorités et les dirigeants
  rationale: Équivalents politiques généraux, compréhensibles aujourd’hui, sans imposer une hiérarchie institutionnelle précise.
- source_word: perfect
  choice: accomplis
  rationale: Conserve l’idée de maturité ou d’achèvement sans suggérer nécessairement une perfection morale absolue.
theological_decisions:
- issue: Coordination du Père et du grand-prêtre éternel comme sujets de la bénédiction
  choice: « Que le Dieu et Père… ainsi que le grand-prêtre éternel… vous affermissent »
  alternative: Faire de Dieu seul le sujet et du grand-prêtre une apposition
  rationale: La syntaxe du témoin présente les deux désignations de manière coordonnée; le pluriel français maintient cette tension plutôt que de la résoudre.
- issue: Titre « notre Seigneur et Dieu Jésus-Christ »
  choice: Conserver directement « notre Seigneur et Dieu Jésus-Christ »
  alternative: Séparer « Seigneur » et « Dieu » ou rapporter « Dieu » au Père
  rationale: Le témoin rattache les deux titres à Jésus-Christ; la traduction n’atténue ni ne développe cette christologie.
- issue: « son Père, qui l’a ressuscité »
  choice: Maintenir le Père comme agent de la résurrection
  alternative: Employer une tournure passive sans agent
  rationale: La relation et l’action sont explicites dans le témoin fourni.
- issue: Personne du pronom dans « qu’il vous accorde »
  choice: Conserver le singulier « il » après le sujet coordonné
  alternative: Employer « qu’ils vous accordent »
  rationale: Le témoin passe lui-même d’une coordination à un pronom singulier, probablement en raison de la tradition textuelle ou de l’unité rhétorique; cette irrégularité théologiquement sensible est préservée.
translation_notes:
  register: Français international moderne, digne et accessible. Les citations bibliques gardent une légère solennité. Ce projet demeure provisoire, car les données fournies indiquent qu’une révision directe du grec et du latin est encore attendue; le crochet transmis a donc été conservé et expliqué.
