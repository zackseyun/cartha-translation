base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: fr
  text: 'Vous-mêmes et Ignace m’avez écrit pour demander que, si quelqu’un se rendait en Syrie, il y apporte vos lettres. Je le ferai dès qu’une occasion favorable se présentera, soit moi-même, soit par l’intermédiaire de celui que j’enverrai aussi comme votre représentant.


    Les lettres d’Ignace qu’il nous a envoyées, ainsi que toutes les autres que nous avions en notre possession, nous vous les envoyons comme vous l’avez demandé ; elles sont jointes à cette lettre. Vous pourrez en tirer grand profit, car elles renferment la foi, la persévérance et toute forme d’édification qui se rapporte à notre Seigneur. En outre, si vous avez des nouvelles sûres au sujet d’Ignace lui-même et de ceux qui étaient avec lui, faites-le-nous savoir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English witness: “fit opportunity”'
  choice: « une occasion favorable »
  rationale: Expression française naturelle qui conserve l’idée d’une circonstance appropriée, sans suggérer un rendez-vous fixé.
- source_word: 'English witness: “ambassador”'
  choice: « représentant »
  rationale: Dans ce contexte ecclésial et épistolaire, « représentant » transmet la fonction de mandataire sans les connotations diplomatiques modernes trop étroites d’« ambassadeur ».
- source_word: 'English witness: “endurance”'
  choice: « persévérance »
  rationale: Ce terme exprime une constance active dans l’épreuve et convient au registre chrétien ancien, tout en restant clair en français contemporain.
- source_word: 'English witness: “edification”'
  choice: « édification »
  rationale: Le terme demeure courant dans le français biblique et ecclésial et conserve l’image de la construction spirituelle.
- source_word: 'English witness: “sure tidings”'
  choice: « des nouvelles sûres »
  rationale: Rendu direct qui préserve l’accent mis sur le caractère fiable des renseignements.
theological_decisions:
- issue: Portée de « qui se rapporte à notre Seigneur »
  choice: 'Conserver la formulation générale après l’énumération : « toute forme d’édification qui se rapporte à notre Seigneur »'
  alternative: 'Reformuler : « tout ce qui édifie dans le Seigneur »'
  rationale: La formulation retenue évite d’introduire une relation théologique plus précise que celle attestée par le témoin anglais fourni et maintient une certaine ambiguïté syntaxique.
- issue: Sens de la foi dans l’énumération
  choice: « la foi »
  alternative: « la fidélité »
  rationale: Le contexte parle du contenu spirituel des lettres ; « la foi » est le rendu le plus direct, sans exclure les nuances de confiance ou de fidélité que seul l’examen direct des témoins grec et latin permettrait de préciser.
translation_notes:
  register: Français international moderne, digne et accessible, avec une syntaxe épistolaire fluide. Le présent projet repose provisoirement sur le témoin anglais public fourni ; la vérification directe de la tradition manuscrite grecque et latine reste à effectuer. Les choix lexicaux et la ponctuation devront donc être réexaminés lors de cette collation.
