base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: fr
  text: Je vous écris ces choses par l’intermédiaire de Crescens, que je vous ai recommandé récemment et que je vous recommande maintenant, car il s’est conduit parmi nous d’une manière irréprochable ; et je crois qu’il en sera de même auprès de vous. Accueillez sa sœur lorsqu’elle viendra chez vous. Portez-vous bien dans le Seigneur Jésus-Christ, dans la grâce, vous et tous ceux qui sont avec vous. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: by Crescens
  choice: par l’intermédiaire de Crescens
  rationale: Exprime naturellement en français que Crescens est le porteur de la lettre, sans suggérer qu’il en est l’auteur.
- source_word: commended
  choice: recommandé / personne recommandée
  rationale: Conserve le sens de recommandation personnelle et communautaire attesté par le témoin anglais.
- source_word: walked blamelessly
  choice: s’est conduit parmi nous d’une manière irréprochable
  rationale: Rend l’idiome ancien « marcher » par une formulation française actuelle, tout en conservant l’évaluation morale.
- source_word: all yours
  choice: tous les vôtres
  rationale: Préserve l’expression volontairement large, qui peut désigner les proches ou l’entourage des destinataires.
theological_decisions:
- issue: Lien entre la grâce et la formule finale de salut
  choice: Portez-vous bien dans la grâce du Seigneur Jésus-Christ
  alternative: Portez-vous bien dans le Seigneur Jésus-Christ, dans la grâce
  rationale: La tradition source grecque/latine n’ayant pas encore été directement examinée, la formulation retenue suit prudemment la relation syntaxique la plus naturelle du témoin fourni, sans développer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Traduction provisoire fondée sur le témoin anglais du domaine public fourni ; une vérification directe de la tradition manuscrite grecque et latine reste nécessaire.
