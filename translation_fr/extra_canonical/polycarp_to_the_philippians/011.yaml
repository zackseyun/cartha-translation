    issue: « la compassion délivre de la mort » est trop général pour le terme sous-jacent.
    rationale: Le grec ἐλεημοσύνη vise normalement l’aumône ou la miséricorde active. « Compassion » peut désigner un sentiment sans l’acte charitable exprimé par la maxime.
  - severity: medium
    issue: « que le Seigneur ne soit pas blasphémé à cause de vous » résout indûment l’expression ἐν ὑμῖν.
    rationale: La préposition peut être conservée par « parmi vous »; une paraphrase causale est interprétative et ne doit pas remplacer le texte.
  - severity: low
    issue: « vous devançant les uns les autres » est ambigu et peu naturel.
    rationale: Le tour peut évoquer une course ou une rivalité. « Vous montrant prévenants les uns envers les autres » transmet l’initiative bienveillante dans la douceur du Seigneur.
