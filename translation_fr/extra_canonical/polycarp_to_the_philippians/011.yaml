base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: fr
  text: 'Tenez donc ferme dans ces choses et suivez l’exemple du Seigneur. Soyez fermes et inébranlables dans la foi, pleins d’une tendre affection les uns pour les autres dans l’amour fraternel, associés à la vérité, vous montrant prévenants les uns envers les autres dans la douceur du Seigneur, sans mépriser personne.


    Quand vous pouvez faire le bien, ne tardez pas, car l’aumône délivre de la mort.[a] Soyez tous soumis les uns aux autres et ayez une conduite irréprochable parmi les non-Juifs, afin que, grâce à vos bonnes œuvres, vous receviez vous aussi des éloges et que le Seigneur ne soit pas blasphémé parmi vous.[b]


    Mais malheur à celui par qui le nom du Seigneur est blasphémé ! Enseignez donc à tous la maîtrise de soi, dans laquelle vous-mêmes devez aussi marcher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme peut aussi désigner la miséricorde concrètement exercée, notamment envers les personnes dans le besoin.
    reason: « Aumône » rend le sens usuel du terme, tandis que la note indique sa portée plus large de miséricorde active.
  - marker: b
    text: 'Littéralement : « que le Seigneur ne soit pas blasphémé en vous ». La relation exprimée par « en » peut aussi être comprise, selon le contexte, comme « parmi vous » ou « du fait de vous ».'
    reason: Préserve l’ambiguïté de l’expression sans imposer la seule lecture causale.
lexical_decisions:
- source_word: Stand fast
  choice: Tenez donc ferme
  rationale: Rend directement l’exhortation à la constance dans un français naturel et digne.
- source_word: brotherhood
  choice: amour fraternel
  rationale: Exprime ici la communauté et l’affection entre frères et sœurs dans la foi, sans lourdeur littérale.
- source_word: partners with the truth
  choice: associés à la vérité
  rationale: Préserve l’image d’une participation commune à la vérité sans préciser davantage une relation que le témoin laisse ouverte.
- source_word: forestalling one another
  choice: vous devançant les uns les autres
  rationale: Conserve l’idée de prendre l’initiative envers autrui; le domaine précis de cette prévenance reste lié à la douceur du Seigneur.
- source_word: Pitifulness
  choice: la compassion
  rationale: Le terme ancien désigne la miséricorde ou l’aumône compatissante; « compassion » garde une portée assez large.
- source_word: Gentiles
  choice: les non-Juifs
  rationale: Traduction claire du référent ethnoreligieux ancien, plus immédiatement compréhensible que « Gentils » en français courant.
- source_word: soberness
  choice: la maîtrise de soi
  rationale: Rend la vertu morale de retenue et de lucidité, plutôt que la seule abstinence d’alcool.
- source_word: walk
  choice: marcher
  rationale: Maintient la métaphore biblique de la conduite vécue, intelligible dans ce registre exhortatif.
theological_decisions:
- issue: La compassion délivre de la mort
  choice: Conserver l’affirmation sans en définir le mécanisme
  alternative: Interpréter explicitement la délivrance comme salut éternel, pardon, ou préservation physique
  rationale: Le témoin formule une maxime théologique dense et probablement scripturaire; la traduction ne doit pas résoudre une portée laissée ouverte.
- issue: Soumission réciproque
  choice: « Soyez tous soumis les uns aux autres »
  alternative: Limiter la soumission à une hiérarchie ecclésiale déterminée
  rationale: La réciprocité générale est explicite dans le témoin et ne doit pas être réduite par une lecture confessionnelle.
- issue: Blasphème du Seigneur
  choice: « que le Seigneur ne soit pas blasphémé à cause de vous »
  alternative: « en vous » ou « parmi vous »
  rationale: Le sens causal correspond à l’idée que la mauvaise conduite des croyants provoque le blasphème, tout en conservant le Seigneur comme objet du blasphème.
- issue: Récompense sociale des bonnes œuvres
  choice: « vous valent des éloges »
  alternative: « vous receviez des louanges »
  rationale: La construction du témoin est inhabituelle; cette formulation garde la possibilité d’une reconnaissance publique sans identifier explicitement celui qui loue.
translation_notes:
  register: Français international moderne, exhortatif et digne. Le tutoiement pluriel est rendu par « vous ». Les parallélismes et impératifs sont conservés, avec une syntaxe allégée. Comme la révision directe du grec et du latin est signalée comme encore en attente, les choix demeurent prudemment fondés sur le témoin anglais public fourni; les ambiguïtés importantes sont maintenues ou indiquées en note.
