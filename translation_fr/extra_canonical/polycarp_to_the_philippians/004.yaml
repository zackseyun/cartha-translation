base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: fr
  text: 'Frères et sœurs, je vous écris ces choses au sujet de la justice, non parce que je me serais chargé moi-même de le faire, mais parce que vous m’y avez invité.


    En effet, ni moi ni personne de ma condition ne peut atteindre la sagesse du bienheureux et glorieux Paul. Lorsqu’il est venu parmi vous, il a enseigné avec soin et assurance, en personne, aux gens de ce temps-là, la parole de vérité. Puis, lorsqu’il était absent, il vous a écrit une lettre. Si vous l’étudiez attentivement, elle pourra vous faire grandir dans la foi qui vous a été donnée.


    Cette foi est notre mère à tous ; l’espérance la suit et l’amour marche devant elle : l’amour envers Dieu et le Christ, et envers notre prochain. Car celui qui s’applique à ces choses a accompli le commandement de la justice ; en effet, celui qui aime se tient loin de tout péché.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: Frères et sœurs
  rationale: Formulation française inclusive et naturelle pour une adresse à l’ensemble de la communauté, sans nier la forme masculine du témoin anglais.
- source_word: righteousness
  choice: justice
  rationale: Terme biblique et moral usuel qui conserve l’idée de conduite conforme à ce qui est juste.
- source_word: follow the wisdom
  choice: atteindre la sagesse
  rationale: Dans ce contexte de modestie rhétorique, il s’agit vraisemblablement d’égaler ou d’être à la hauteur de Paul plutôt que de simplement suivre son enseignement.
- source_word: the word which concerneth truth
  choice: la parole de vérité
  rationale: Expression française concise qui conserve le lien entre proclamation et vérité.
- source_word: be builded up unto the faith
  choice: faire grandir dans la foi
  rationale: Rend naturellement la métaphore d’édification tout en indiquant son orientation vers la foi.
- source_word: occupied with these
  choice: s’applique à ces choses
  rationale: Exprime un engagement actif envers la foi, l’espérance et l’amour, sans suggérer une simple occupation mentale.
theological_decisions:
- issue: La foi décrite comme « mère de nous tous »
  choice: Cette foi est notre mère à tous
  alternative: la foi donnée, qui est notre mère à tous
  rationale: Conserve directement la métaphore maternelle et rattache le relatif à « la foi », comme dans le témoin fourni, sans l’expliquer doctrinalement.
- issue: Ordre de la foi, de l’espérance et de l’amour
  choice: l’espérance la suit et l’amour marche devant elle
  alternative: elle est suivie par l’espérance et précédée par l’amour
  rationale: Préserve l’ordre et l’image dynamique inhabituels du texte, sans harmonisation avec d’autres formulations chrétiennes.
- issue: Accomplissement du commandement de la justice
  choice: a accompli le commandement de la justice
  alternative: accomplit ce que commande la justice
  rationale: Maintient le langage fort d’accomplissement et le génitif ambigu du témoin au lieu de préciser sa portée théologique.
- issue: Éloignement de tout péché
  choice: celui qui aime se tient loin de tout péché
  alternative: celui qui possède l’amour est loin de tout péché
  rationale: Rend la force parénétique sans transformer l’énoncé en affirmation technique d’impeccabilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel communautaire est conservé. La traduction reste nécessairement provisoire puisque le dossier fourni signale que la vérification directe des témoins grecs et latins est encore en attente ; aucune précision textuelle non attestée n’a donc été ajoutée.
