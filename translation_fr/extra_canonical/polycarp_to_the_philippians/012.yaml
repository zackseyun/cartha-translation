base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: fr
  text: 'J’ai éprouvé une très grande tristesse au sujet de Valens, qui était autrefois presbytre parmi vous, car il comprend si peu la charge qui lui avait été confiée. Je vous avertis donc de vous garder de l’avidité, et d’être purs et véridiques. Gardez-vous de tout mal.


    Mais celui qui ne sait pas se maîtriser dans ces domaines, comment peut-il l’ordonner à un autre ? Si quelqu’un ne se garde pas de l’avidité, il sera souillé par l’idolâtrie et jugé comme l’un des non-Juifs qui ne connaissent pas le jugement du Seigneur. Ne savons-nous donc pas que les saints jugeront le monde, comme Paul l’enseigne ?


    Cependant, je n’ai rien constaté ni entendu de tel parmi vous, au milieu desquels le bienheureux Paul a travaillé et qui étiez, au commencement, ses lettres[a]. En effet, il se glorifie à votre sujet dans toutes les Églises qui, seules à cette époque, connaissaient Dieu ; car nous-mêmes, nous ne le connaissions pas encore.


    J’éprouve donc une très grande tristesse pour lui et pour sa femme. Que le Seigneur leur accorde une véritable repentance. Vous aussi, soyez vigilants dans cette affaire. Ne les considérez pas comme des ennemis, mais ramenez-les comme des membres fragiles qui se sont égarés, afin de préserver votre corps tout entier[b]. En agissant ainsi, vous vous édifiez les uns les autres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « ses lettres » est inhabituelle : elle présente vraisemblablement les Philippiens eux-mêmes comme des lettres vivantes de Paul. La formulation est conservée en raison de l’état provisoire de la documentation source.'
    reason: Préserver une image difficile et potentiellement ambiguë plutôt que la normaliser.
  - marker: b
    text: 'Littéralement selon le témoin fourni : « afin que vous sauviez votre corps tout entier ». Le « corps » peut désigner ici l’ensemble de la communauté considérée comme un organisme.'
    reason: Signaler la métaphore corporelle et l’ambiguïté de « sauver ».
lexical_decisions:
- source_word: presbyter
  choice: presbytre
  rationale: Conserve le titre ecclésial ancien sans l’assimiler automatiquement au sens moderne de « prêtre » ou au seul sens général d’« ancien ».
- source_word: covetousness
  choice: avidité
  rationale: Terme moderne et large qui exprime le désir cupide de posséder sans limiter indûment le propos à l’argent.
- source_word: Gentiles
  choice: non-Juifs
  rationale: Rend clairement la distinction ethnoreligieuse historique dans un français courant, sans employer le terme vieilli « païens ».
- source_word: repentance
  choice: repentance
  rationale: Conserve la portée morale et religieuse d’un véritable changement intérieur et de conduite.
- source_word: restore
  choice: ramenez-les
  rationale: Exprime la réintégration et le relèvement de membres égarés, sans préciser un mécanisme disciplinaire absent du témoin.
- source_word: edify
  choice: vous édifiez
  rationale: Préserve l’image de la construction communautaire, familière au vocabulaire chrétien ancien.
theological_decisions:
- issue: Lien entre avidité et idolâtrie
  choice: « il sera souillé par l’idolâtrie »
  alternative: « il sera considéré comme un idolâtre »
  rationale: Préserve la formulation du témoin et sa tension théologique sans transformer le rapport en simple équivalence explicative.
- issue: Les saints jugeront le monde
  choice: Formulation affirmative conservée
  alternative: Paraphrase atténuée ou interprétation du type « participeront au jugement »
  rationale: La citation ou allusion paulinienne est maintenue sans résoudre la nature exacte de ce jugement.
- issue: Salut ou préservation du corps communautaire
  choice: « afin de préserver votre corps tout entier »
  alternative: « afin de sauver votre communauté tout entière »
  rationale: Maintient l’image organique du corps tout en évitant de trancher si « sauver » désigne ici le salut eschatologique ou la restauration communautaire.
- issue: Destinataire de la repentance
  choice: « leur accorde »
  alternative: « lui accorde » ou maintien d’une discordance entre singulier et pluriel
  rationale: Le contexte associe Valens et sa femme ; le pluriel français rend naturellement cette portée, tout en laissant la note inutile faute de preuve directe de la forme source.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement pluriel est rendu par « vous ». La traduction demeure provisoire, car le dossier fourni indique qu’une vérification directe de la tradition grecque et latine reste à effectuer ; les formulations difficiles ont donc été conservées avec prudence plutôt que reconstruites avec assurance.
