review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire sur quelques points précis. « Préserver votre corps » atténue indûment le verbe du témoin (« sauver »). Le singulier de « à qui le Seigneur accordera... » doit être conservé, le référent immédiatement précédent étant la femme de Valens. « Soyez vigilants » ne rend pas assez directement l’appel à être sobres/modérés. L’image difficile des Philippiens comme « ses lettres » est maintenue sans tentative de résolution.
  naturalness: Le français est globalement naturel et de registre approprié. « Comment peut-il l’ordonner à un autre ? » est remplacé par une formulation idiomatique (« l’imposer à un autre »). « Réintégrez-les » rend plus clairement la restauration de personnes comme membres de la communauté.
  terminology: « Presbytre », « avidité », « non-Juifs », « repentance », « saints » et « édifier » conviennent au registre et respectent les choix prudents du dossier. « Non-Juifs » conserve la désignation ethnoreligieuse de Gentiles sans introduire l’interprétation plus étroite de « païens ».
  issues:
  - severity: medium
    issue: « préserver votre corps tout entier »
    rationale: Le témoin dit explicitement « save the whole body of you ». « Préserver » modifie et affaiblit l’expression; il faut conserver « sauver », avec une note pour l’image communautaire et sa portée possible.
  - severity: medium
    issue: Pluriel dans « Que le Seigneur leur accorde »
    rationale: Le témoin fourni porte « unto whom », au singulier, après la mention de la femme. Le pluriel français harmonise le contexte mais ne préserve pas la donnée textuelle.
  - severity: low
    issue: « soyez vigilants » pour « be sober herein »
    rationale: La vigilance est connexe, mais « sobres » ou « modérés » rend plus directement l’injonction morale du témoin.
  - severity: low
    issue: « l’ordonner à un autre »
    rationale: Cette construction est peu naturelle en français dans ce sens. « L’imposer à un autre » conserve l’idée d’enjoindre la même conduite.
