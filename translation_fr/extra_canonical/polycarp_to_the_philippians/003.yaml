review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni dans l’ensemble et conserve les enchaînements conditionnels, les listes éthiques et les citations sans harmonisation canonique. Toutefois, « l’a fait siéger à sa droite » remplace indûment « lui donna … un trône à sa droite » : le don d’un trône doit être conservé. La portée de « toute » est également élargie sans appui dans « toute convoitise ».'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Faites preuve de miséricorde » rend plus directement l’impératif « Have mercy » que « Faites preuve de compassion », tout en restant naturel.
  terminology: « Crainte », « convoitise », « amour de l’argent », « médisance », « faux témoignage », « royaume de Dieu » et « ressusciter » sont bien choisis. « Un trône à sa droite » préserve le terme et l’image du témoin sans les interpréter comme une simple session.
  issues:
  - severity: medium
    issue: Omission de « un trône »
    rationale: Le projet remplace le don explicite d’« un trône à sa droite » par « l’a fait siéger à sa droite ». Cette paraphrase perd un élément lexical et image l’exaltation de façon plus interprétative.
  - severity: low
    issue: Élargissement de « all unrighteousness » à la convoitise
    rationale: « Toute » qualifie l’injustice dans le témoin. La répétition « toute convoitise » ajoute une quantification qui n’est pas exprimée dans la liste transmise.
  - severity: low
    issue: Rendu de « Have mercy »
    rationale: « Faites preuve de compassion » est acceptable, mais « Faites preuve de miséricorde » conserve plus exactement le vocabulaire moral et religieux du passage.
  revised_text: 'C’est pourquoi, préparez-vous à agir[a] et servez Dieu dans la crainte et la vérité. Abandonnez les discours vains et creux ainsi que l’égarement du grand nombre, puisque vous avez cru en celui qui a ressuscité d’entre les morts notre Seigneur Jésus-Christ, lui a donné la gloire et un trône à sa droite. Tout ce qui est dans le ciel et sur la terre lui a été soumis ; toute créature qui respire le sert. Il vient comme juge des vivants et des morts, et Dieu demandera compte de son sang à ceux qui lui désobéissent[b].


    Celui qui l’a ressuscité d’entre les morts nous ressuscitera aussi, si nous faisons sa volonté, suivons ses commandements et aimons ce qu’il a aimé, en nous abstenant de toute injustice, de la convoitise, de l’amour de l’argent, de la médisance et du faux témoignage ; sans rendre le mal pour le mal, l’insulte pour l’insulte, le coup pour le coup, ni la malédiction pour la malédiction.


    Souvenons-nous plutôt des paroles que le Seigneur a prononcées dans son enseignement : « Ne jugez pas, afin de ne pas être jugés. Pardonnez, et vous serez pardonnés. Faites preuve de miséricorde, afin qu’on vous fasse miséricorde. La mesure dont vous vous servez servira aussi à vous mesurer. » Et encore : « Heureux les pauvres et ceux qui sont persécutés à cause de la justice, car le royaume de Dieu est à eux. »'
