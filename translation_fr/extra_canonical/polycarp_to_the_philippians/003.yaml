base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: fr
  text: 'C’est pourquoi, préparez-vous à agir[a] et servez Dieu dans la crainte et la vérité. Abandonnez les discours vains et creux ainsi que l’égarement du grand nombre, puisque vous avez cru en celui qui a ressuscité d’entre les morts notre Seigneur Jésus-Christ, lui a donné la gloire et l’a fait siéger à sa droite[b]. Tout ce qui est dans le ciel et sur la terre lui a été soumis ; toute créature qui respire le sert. Il vient comme juge des vivants et des morts, et Dieu demandera compte de son sang à ceux qui lui désobéissent[c].


    Celui qui l’a ressuscité d’entre les morts nous ressuscitera aussi, si nous faisons sa volonté, suivons ses commandements et aimons ce qu’il a aimé, en nous abstenant de toute injustice, de toute convoitise, de l’amour de l’argent, de la médisance et du faux témoignage ; sans rendre le mal pour le mal, l’insulte pour l’insulte, le coup pour le coup, ni la malédiction pour la malédiction.


    Souvenons-nous plutôt des paroles que le Seigneur a prononcées dans son enseignement : « Ne jugez pas, afin de ne pas être jugés. Pardonnez, et vous serez pardonnés. Faites preuve de compassion, afin qu’on ait compassion de vous. La mesure dont vous vous servez servira aussi à vous mesurer. » Et encore : « Heureux les pauvres et ceux qui sont persécutés à cause de la justice, car le royaume de Dieu est à eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceignez vos reins », image antique évoquant la préparation à l’action.'
    reason: Signaler l’image concrète sous-jacente à la traduction idiomatique.
  - marker: b
    text: 'Le témoin anglais porte : « lui donna la gloire et un trône à sa droite ». La présente formulation en exprime le sens probable sans harmoniser la phrase avec un passage biblique précis.'
    reason: Documenter une reformulation syntaxique dans l’attente d’une vérification directe du grec et du latin.
  - marker: c
    text: L’expression « son sang » renvoie vraisemblablement au sang du Christ ; la syntaxe du témoin fourni laisse toutefois subsister une ambiguïté de référent.
    reason: Préserver et signaler l’ambiguïté pronominale au lieu de la résoudre silencieusement.
lexical_decisions:
- source_word: gird up your loins
  choice: préparez-vous à agir
  rationale: Rend naturellement en français moderne l’image idiomatique antique de se ceindre en vue de l’action, tout en la signalant en note.
- source_word: fear and truth
  choice: la crainte et la vérité
  rationale: Conserve les deux substantifs et leur portée religieuse sans réduire « crainte » à la peur ni « vérité » à la seule sincérité.
- source_word: vain and empty talking
  choice: les discours vains et creux
  rationale: Préserve le redoublement rhétorique et vise des propos dépourvus de valeur plutôt qu’une simple conversation.
- source_word: walk in His commandments
  choice: suivons ses commandements
  rationale: Expression naturelle en français qui communique une conduite réglée par les commandements sans conserver artificiellement l’idiome « marcher dans ».
- source_word: covetousness / love of money
  choice: convoitise / amour de l’argent
  rationale: Maintient la distinction entre le désir avide au sens large et l’attachement particulier à l’argent.
- source_word: evil speaking
  choice: médisance
  rationale: Désigne clairement la parole nuisible dirigée contre autrui, dans un registre actuel et digne.
- source_word: Have mercy
  choice: Faites preuve de compassion
  rationale: Formulation idiomatique qui garde l’appel à une attitude et à des actes miséricordieux.
- source_word: the poor
  choice: les pauvres
  rationale: Conserve la formulation absolue du témoin sans ajouter « en esprit », absent du texte fourni.
theological_decisions:
- issue: La gloire et le siège à la droite
  choice: « lui a donné la gloire et l’a fait siéger à sa droite »
  alternative: « lui a donné la gloire et un trône à sa droite »
  rationale: La formulation française explicite l’action de Dieu et évite l’idée maladroite que le trône lui-même serait donné comme objet, tout en conservant l’exaltation du Christ.
- issue: Référent de « son sang »
  choice: Conserver « son sang » avec une note sur l’ambiguïté
  alternative: Expliciter « le sang du Christ »
  rationale: Le témoin permet naturellement de rapporter le possessif au Christ, mais la syntaxe pronominale et la médiation d’un témoin anglais imposent de ne pas masquer l’incertitude.
- issue: Résurrection conditionnée par l’obéissance
  choice: Conserver « nous ressuscitera aussi, si… »
  alternative: Reformuler comme simple signe ou preuve de la foi
  rationale: Le lien conditionnel appartient au texte transmis ; il ne doit pas être harmonisé avec une construction doctrinale ultérieure.
- issue: Béatitude finale
  choice: « les pauvres et ceux qui sont persécutés à cause de la justice »
  alternative: Harmoniser avec Matthieu en « pauvres en esprit »
  rationale: La forme citée mêle des formulations connues mais doit être traduite telle quelle, sans harmonisation canonique.
- issue: « Royaume de Dieu »
  choice: Conserver « royaume de Dieu »
  alternative: Harmoniser avec « royaume des cieux »
  rationale: Suit le témoin fourni et préserve la forme propre de la citation chez Polycarpe.
translation_notes:
  register: 'Français international moderne, courant mais digne. Les citations attribuées au Seigneur gardent un rythme sentencieux sans archaïsmes. Projet provisoire fondé sur le témoin anglais public fourni : une vérification directe de la tradition grecque et latine demeure nécessaire, notamment pour les pronoms, la phrase sur le sang et les échos scripturaires.'
