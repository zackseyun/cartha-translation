review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour mieux refléter la désignation explicite des diacres « de Dieu et du Christ » et pour ne pas introduire, dans la troisième expression de la liste, l’idée interprétative de « souillure », qui n’est pas exprimée par le composé grec. Le jeu de mots διάκονοι / διάκονος est conservé.
  naturalness: Le français est globalement clair et moderne. « Doubles dans leurs paroles » est toutefois moins idiomatique que « à la langue double », et « en tant que diacres de Dieu et du Christ » rend plus directement la syntaxe et le registre du passage.
  terminology: « Anciens », « diacres », « Esprit » et « vierges » sont appropriés. Pour ἀρσενοκοῖται, « arsenokoïtes », accompagné d’une note explicative, évite de présenter comme certaine une définition contestée tout en conservant une catégorie distincte. « Efféminés » reste une traduction historiquement littérale et provisoire de μαλακοί, dont la portée requiert une note.
  issues:
  - severity: medium
    issue: « en serviteurs de Dieu et du Christ »
    rationale: Le texte source qualifie les diacres comme « diacres de Dieu et du Christ »; la formulation proposée affaiblit ce parallélisme institutionnel et lexical avec le Seigneur devenu διάκονος.
  - severity: medium
    issue: « ceux qui se souillent avec des hommes »
    rationale: Cette expression ajoute le verbe et la notion de souillure. Le terme grec ἀρσενοκοῖται est difficile et disputé, mais il ne contient pas explicitement ce vocabulaire; une translittération expliquée préserve mieux l’ambiguïté.
  - severity: low
    issue: « doubles dans leurs paroles »
    rationale: La formule est compréhensible mais peu idiomatique; « à la langue double » est plus naturel et reste proche de δίλογοι.
  revised_text: 'Sachant donc que Dieu ne se laisse pas tourner en dérision, nous devons nous conduire d’une manière digne de son commandement et de sa gloire.


    De même, les diacres doivent être irréprochables devant sa justice, en tant que diacres de Dieu et du Christ, et non des humains. Ils ne doivent être ni calomniateurs, ni à la langue double, ni amis de l’argent, mais maîtres d’eux-mêmes en tout, compatissants, diligents, marchant selon la vérité du Seigneur, qui est devenu le serviteur — le diacre — de tous.[a] Car si nous lui sommes agréables dans le monde présent, nous recevrons aussi le monde à venir, comme il nous a promis de nous relever d’entre les morts. Et si nous nous conduisons d’une manière digne de lui, nous régnerons aussi avec lui, si du moins nous croyons.[b]


    De même, les jeunes hommes doivent être irréprochables en tout, veillant avant tout à la pureté et se gardant de tout mal. Car il est bon de s’abstenir des désirs qui sont dans le monde, puisque tout désir fait la guerre à l’Esprit.[c] Ni ceux qui se livrent à l’immoralité sexuelle, ni les efféminés, ni les arsenokoïtes n’hériteront du royaume de Dieu,[d] pas plus que ceux qui font ce qui ne convient pas. Il est donc juste de s’abstenir de toutes ces choses et de vous soumettre aux anciens et aux diacres comme à Dieu et au Christ.[e] Quant aux vierges, elles doivent se conduire avec une conscience irréprochable et pure.'
  revised_footnotes:
  - marker: a
    text: Le même terme grec, diakonos, peut désigner un « serviteur » ou un « diacre »; la formulation conserve le jeu de mots entre les diacres et le Seigneur.
    reason: Préserver le lien lexical explicite du texte.
  - marker: b
    text: L’expression grecque peut se rendre aussi par « si nous avons foi » ou « si nous croyons »; elle conserve une condition sans en préciser davantage la portée.
    reason: Préserver la nuance conditionnelle sans imposer d’interprétation doctrinale.
  - marker: c
    text: Le texte transmis porte « l’Esprit ». Une vérification directe de l’ensemble de la tradition grecque et latine demeure souhaitable pour préciser la forme textuelle et la référence.
    reason: Le dossier signale que l’examen direct des langues anciennes reste à achever.
  - marker: d
    text: « Efféminés » rend littéralement et provisoirement le grec malakoi. « Arsenokoïtes » translittère le grec arsenokoitai; le sens précis de ce terme composé, distinct des autres termes de la liste, fait l’objet de débats. La traduction évite donc de lui attribuer une définition plus précise sans examen complet des témoins grecs et latins.
    reason: Préserver la distinction des termes anciens et leur ambiguïté discutée sans ajouter une interprétation.
  - marker: e
    text: « Anciens » traduit le terme aussi rendu traditionnellement par « presbytres ».
    reason: Clarifier le choix terminologique sans l’assimiler à une fonction confessionnelle moderne précise.
  revision_rationale: 'La révision corrige trois points sans modifier le sens général : elle rend explicitement les diacres « de Dieu et du Christ », emploie une expression française plus naturelle pour « double-tongued », et remplace une paraphrase interprétative de ἀρσενοκοῖται par une translittération annotée. Les ancres de notes restent toutes présentes et correspondent aux expressions commentées.'
