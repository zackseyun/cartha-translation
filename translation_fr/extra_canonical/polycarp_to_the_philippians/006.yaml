base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: fr
  text: 'Sachant donc qu’on ne se moque pas de Dieu, nous devons nous conduire d’une manière digne de son commandement et de sa gloire.


    De même, les diacres doivent être irréprochables devant sa justice, en serviteurs de Dieu et du Christ, et non des êtres humains. Qu’ils ne soient ni calomniateurs, ni doubles dans leurs paroles, ni amis de l’argent, mais maîtres d’eux-mêmes en toutes choses, compatissants, zélés, et qu’ils marchent selon la vérité du Seigneur, qui s’est fait le serviteur — le diacre — de tous.[a] Car si nous lui sommes agréables dans le monde présent, nous recevrons aussi le monde à venir, puisqu’il nous a promis de nous relever d’entre les morts. Et si nous nous conduisons d’une manière digne de lui, nous régnerons aussi avec lui, pourvu que nous ayons la foi.[b]


    De même, les jeunes hommes doivent être irréprochables en toutes choses, se soucier avant tout de la pureté et se garder de tout mal. Car il est bon de s’abstenir des désirs qui sont dans le monde, puisque tout désir fait la guerre à l’Esprit.[c] Ni ceux qui vivent dans l’immoralité sexuelle, ni les hommes efféminés, ni ceux qui se souillent avec des hommes n’hériteront du royaume de Dieu,[d] pas plus que ceux qui font ce qui ne convient pas. Il est donc juste de s’abstenir de toutes ces choses et de vous soumettre aux anciens et aux diacres comme à Dieu et au Christ.[e] Quant aux vierges, elles doivent se conduire avec une conscience irréprochable et pure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même terme sous-jacent peut désigner un « serviteur » ou un « diacre »; la formulation conserve ce jeu de mots.
    reason: Préserver un lien lexical important entre le ministère des diacres et l’exemple du Seigneur.
  - marker: b
    text: L’expression peut aussi se rendre par « si du moins nous croyons ».
    reason: Signaler la nuance emphatique et conditionnelle sans résoudre la tension entre foi et conduite.
  - marker: c
    text: Le témoin transmis porte « l’Esprit »; une vérification directe de la tradition grecque et latine reste nécessaire pour confirmer la forme et la référence exactes.
    reason: Le dossier indique que l’examen des langues anciennes est encore en attente.
  - marker: d
    text: Les termes de cette liste sont rendus provisoirement au plus près du témoin anglais. Leur portée exacte, notamment celle de « hommes efféminés » et de « ceux qui se souillent avec des hommes », doit être réévaluée à partir des témoins grecs et latins.
    reason: Éviter une harmonisation silencieuse de termes anciens controversés.
  - marker: e
    text: « Anciens » traduit ici le terme traditionnellement rendu aussi par « presbytres ».
    reason: Clarifier le choix ecclésiastique sans l’identifier à une fonction confessionnelle moderne précise.
lexical_decisions:
- source_word: walk / walking (witness; likely περιπατεῖν language)
  choice: se conduire / marcher
  rationale: « Se conduire » exprime naturellement le comportement moral en français moderne; « marcher » est conservé dans la formule liée à la vérité pour garder l’image traditionnelle sans alourdir l’ensemble.
- source_word: deacons / minister (deacon)
  choice: diacres / serviteur — le diacre —
  rationale: Conserve le jeu de mots entre la fonction de diacre et le service accompli par le Seigneur.
- source_word: presbyters
  choice: anciens
  rationale: Terme transparent et historiquement sobre, sans importer une structure ecclésiastique confessionnelle ultérieure.
- source_word: lusts / desire
  choice: désirs
  rationale: Rend le terme de façon assez large pour ne pas le réduire d’office au seul désir sexuel; le contexte lui donne une orientation négative.
- source_word: Spirit
  choice: Esprit
  rationale: La majuscule suit le témoin fourni, tout en signalant en note que l’identification précise dépend du texte source à vérifier.
- source_word: effeminate persons
  choice: hommes efféminés
  rationale: Rendu littéral provisoire du témoin anglais, maintenu distinct de la proposition suivante afin de ne pas fusionner des catégories potentiellement différentes.
- source_word: virgins
  choice: vierges
  rationale: Correspondance directe, sans préciser le sexe au-delà de ce que permet le témoin transmis.
theological_decisions:
- issue: Condition associée au règne avec le Christ
  choice: « pourvu que nous ayons la foi »
  alternative: « si du moins nous croyons »
  rationale: Préserve la force conditionnelle de « if indeed » sans expliquer la relation entre foi, conduite et règne.
- issue: Référence de « lui » dans le passage sur le monde présent et la résurrection
  choice: Conserver le pronom « lui »
  alternative: Nommer explicitement Dieu ou le Christ
  rationale: Le témoin laisse une certaine ambiguïté référentielle; l’expliciter trancherait au-delà des données fournies.
- issue: Soumission aux anciens et aux diacres « comme à Dieu et au Christ »
  choice: Traduction directe de la comparaison
  alternative: Atténuer par « comme représentant Dieu et le Christ »
  rationale: L’atténuation ajouterait une interprétation ecclésiologique absente du témoin.
- issue: Terminologie sexuelle disputée
  choice: Conserver trois expressions distinctes et proches du témoin
  alternative: Les harmoniser avec une traduction biblique moderne ou les regrouper sous une catégorie générale
  rationale: Évite d’imposer une identification lexicale ou doctrinale avant la vérification directe du grec et du latin.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte emploie « êtres humains » plutôt que « hommes » lorsque l’humanité en général est visée, mais conserve « hommes » dans la terminologie sexuelle du témoin. Cette version demeure provisoire, car les données fournies reposent sur un témoin anglais public et indiquent qu’une révision directe du grec et du latin reste à faire.
