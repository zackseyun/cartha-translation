base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: fr
  text: 'Mais l’amour de l’argent est le commencement de tous les maux. Sachant donc que nous n’avons rien apporté dans le monde et que nous ne pouvons rien en emporter, revêtons-nous des armes de la justice et apprenons d’abord nous-mêmes à marcher selon le commandement du Seigneur.


    Apprenons ensuite à nos femmes, elles aussi, à marcher dans la foi qui leur a été donnée, dans l’amour et la pureté, à aimer tendrement leur propre mari en toute vérité, à aimer tous les êtres humains de manière égale en toute chasteté, et à élever leurs enfants dans l’éducation qui inspire la crainte de Dieu.


    Que nos veuves soient réfléchies en ce qui concerne la foi du Seigneur, qu’elles intercèdent sans cesse pour tous, et qu’elles s’abstiennent de toute calomnie, de toute parole mauvaise, de tout faux témoignage, de l’amour de l’argent et de toute forme de mal. Elles savent qu’elles sont l’autel de Dieu, que tous les sacrifices sont examinés avec soin et que rien ne lui échappe : ni leurs pensées, ni leurs intentions, ni aucun des secrets du cœur.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais public fourni. Une vérification directe de la tradition manuscrite grecque et latine reste nécessaire, notamment pour « commencement », « foi du Seigneur » et « réfléchies ».
    reason: La source indique explicitement que la révision dans les langues anciennes est encore en attente; la note rend transparente cette limite textuelle.
lexical_decisions:
- source_word: love of money
  choice: l’amour de l’argent
  rationale: Expression française naturelle qui conserve le sens moral précis de l’attachement à l’argent, plutôt qu’une condamnation de l’argent lui-même.
- source_word: beginning
  choice: commencement
  rationale: Conserve la formulation du témoin fourni sans l’harmoniser avec « racine », formulation connue de 1 Timothée 6.10.
- source_word: armor of righteousness
  choice: les armes de la justice
  rationale: « Armes » est idiomatique en français biblique moderne et peut désigner l’équipement défensif dans son ensemble; « justice » préserve la portée morale et théologique du terme.
- source_word: walk
  choice: marcher
  rationale: Maintient la métaphore biblique de la conduite vécue plutôt que de la réduire à « se comporter ».
- source_word: cherishing
  choice: aimer tendrement
  rationale: Rend l’affection active exprimée par le témoin dans un français actuel et digne.
- source_word: all men
  choice: tous les êtres humains / tous
  rationale: Rend la portée universelle sans ambiguïté de genre, avec une reprise plus légère au paragraphe suivant.
- source_word: training / discipline
  choice: éducation
  rationale: Couvre la formation et la discipline sans suggérer uniquement une correction punitive.
- source_word: fear of God
  choice: crainte de Dieu
  rationale: Expression théologique traditionnelle qui garde la tension entre révérence, respect et peur, sans l’aplatir en simple respect.
- source_word: sober-minded
  choice: réfléchies
  rationale: Exprime la maîtrise de soi et le jugement posé dans un français accessible; le sens exact devra être vérifié sur les témoins grec et latin.
- source_word: God’s altar
  choice: l’autel de Dieu
  rationale: Conserve directement la métaphore cultuelle et sa force ecclésiale sans l’expliquer dans le corps du texte.
- source_word: intents
  choice: intentions
  rationale: Terme naturel qui distingue les desseins intérieurs des pensées.
theological_decisions:
- issue: Rapport avec 1 Timothée 6.7 et 6.10
  choice: Conserver « commencement de tous les maux » tel qu’attesté par le témoin fourni
  alternative: Harmoniser avec « racine de tous les maux »
  rationale: Le texte transmis dans la demande porte « beginning ». Une harmonisation silencieuse avec le Nouveau Testament supprimerait une possible variante ou reformulation de Polycarpe.
- issue: « La foi du Seigneur »
  choice: Conserver la construction « foi du Seigneur »
  alternative: Rendre « foi au Seigneur » ou « fidélité envers le Seigneur »
  rationale: La relation grammaticale et théologique reste ambiguë dans le témoin anglais; elle ne doit pas être tranchée sans examen direct du grec et du latin.
- issue: Les veuves comme autel de Dieu
  choice: Préserver la métaphore sans paraphrase doctrinale
  alternative: Expliquer qu’elles offrent leurs prières comme des sacrifices
  rationale: Le texte affirme directement leur identité métaphorique; une explication imposerait une interprétation qui n’est pas explicitée ici.
- issue: Instruction des épouses
  choice: Maintenir que l’exhortation s’adresse d’abord aux hommes, qui doivent instruire leurs femmes
  alternative: Transformer le passage en exhortation directe et autonome aux femmes
  rationale: La syntaxe du témoin relie « nos femmes aussi » à « apprenons/enseignons »; la structure rhétorique est donc conservée malgré sa distance culturelle.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien des métaphores bibliques (« marcher », « armes de la justice », « autel de Dieu »). Les phrases ont été légèrement restructurées pour la clarté sans effacer les enchaînements exhortatifs ni les ambiguïtés théologiques du témoin.
