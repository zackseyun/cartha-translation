review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour corriger une construction française qui inverse la relation d’enseignement. Le passage conserve par ailleurs les images et les ambiguïtés du témoin : « commencement », « foi du Seigneur » et « autel de Dieu ». « Rien ne lui est caché » rend plus directement l’idée finale que « rien ne lui échappe ».'
  naturalness: 'Le français est globalement digne et moderne, mais « Apprenons ensuite à nos femmes » est fautif : on apprend quelque chose, mais on enseigne à quelqu’un à faire quelque chose. « Raisonnées »/« réfléchies » est moins exact et moins idiomatique ici que « soient sensées », pour l’appel à la maîtrise de soi et au jugement sobre.'
  terminology: « L’amour de l’argent », « armes de la justice », « marcher », « crainte de Dieu » et « autel de Dieu » sont retenus. « Dans l’éducation de la crainte de Dieu » conserve mieux le rapport de formation que « qui inspire la crainte de Dieu », qui introduit une explicitation causale. La note provisoire demeure appropriée, car le dossier ne fournit pas encore une collation directe complète des traditions grecque et latine.
  issues:
  - severity: high
    issue: « Apprenons ensuite à nos femmes »
    rationale: Cette construction est grammaticalement et sémantiquement défectueuse en français. Le sens du témoin est que les destinataires doivent ensuite enseigner à leurs femmes à marcher dans ces vertus; il faut employer « enseignons aussi à nos femmes à marcher ».
  - severity: medium
    issue: « réfléchies » pour sober-minded
    rationale: Le terme atténue la notion de sobriété, de discernement et de maîtrise de soi. « Qu’elles soient sensées » est plus naturel et plus proche sans surinterprétation.
  - severity: low
    issue: « l’éducation qui inspire la crainte de Dieu »
    rationale: La relative ajoute l’idée que l’éducation produit la crainte. « dans l’éducation de la crainte de Dieu » préserve plus littéralement le lien entre formation et crainte de Dieu.
  revised_text: 'Mais l’amour de l’argent est le commencement de tous les maux. Sachant donc que nous n’avons rien apporté dans le monde et que nous ne pouvons rien en emporter, revêtons-nous des armes de la justice et apprenons d’abord nous-mêmes à marcher selon le commandement du Seigneur.


    Puis enseignons aussi à nos femmes à marcher dans la foi qui leur a été donnée, dans l’amour et la pureté, à chérir leur propre mari en toute vérité, à aimer tous les êtres humains de manière égale en toute chasteté, et à élever leurs enfants dans l’éducation de la crainte de Dieu.


    Que nos veuves soient sensées en ce qui concerne la foi du Seigneur, qu’elles intercèdent sans cesse pour tous et qu’elles s’abstiennent de toute calomnie, de toute parole mauvaise, de tout faux témoignage, de l’amour de l’argent et de toute forme de mal. Elles savent qu’elles sont l’autel de Dieu, que tous les sacrifices sont examinés avec soin et que rien ne lui est caché : ni leurs pensées, ni leurs intentions, ni aucun des secrets du cœur.[a]'
  revised_footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais public fourni. Une vérification directe de la tradition manuscrite grecque et latine reste nécessaire, notamment pour « commencement », « foi du Seigneur » et « sensées ».
    reason: La source indique explicitement que la révision dans les langues anciennes est encore en attente; la note rend transparente cette limite textuelle.
  revision_rationale: La correction principale rétablit une syntaxe française correcte et le rapport d’instruction présent dans le témoin, sans atténuer ni moderniser silencieusement le cadre rhétorique ancien. Quelques ajustements lexicaux améliorent la fidélité et la fluidité tout en préservant les ambiguïtés et les métaphores cultuelles.
