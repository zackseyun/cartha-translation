base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: fr
  text: 'Tenons donc fermement, sans relâche, à notre espérance et au gage de notre justice, Jésus-Christ. Il a lui-même porté nos péchés dans son corps sur le bois ; il n’a commis aucun péché, et aucune tromperie ne s’est trouvée dans sa bouche. Pourtant, à cause de nous, il a tout supporté, afin que nous vivions en lui.


    Devenons donc les imitateurs de son endurance. Et s’il nous arrive de souffrir à cause de son nom, glorifions-le. Car il nous a donné cet exemple en sa propre personne, et nous avons cru cela.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earnest
  choice: gage
  rationale: Le terme désigne une garantie qui anticipe l’accomplissement promis. « Gage » conserve cette valeur sans imposer l’idée plus précise d’un premier versement.
- source_word: righteousness
  choice: justice
  rationale: « Justice » est le terme théologique français usuel et maintient ici l’ambiguïté entre statut juste, rectitude et salut accordé.
- source_word: tree
  choice: bois
  rationale: « Bois » conserve l’écho scripturaire traditionnel de 1 Pierre 2.24 et désigne la croix sans remplacer l’image de la source.
- source_word: guile
  choice: tromperie
  rationale: Terme moderne et clair qui exprime la fraude ou la duplicité attribuée négativement à la parole.
- source_word: endurance
  choice: endurance
  rationale: Ce choix rend la persévérance sous l’épreuve et permet à la répétition entre ce que Christ a supporté et l’imitation demandée de rester perceptible.
theological_decisions:
- issue: Relation entre Jésus-Christ et le gage de la justice
  choice: « au gage de notre justice, Jésus-Christ »
  alternative: « au gage de notre justice, qui est Jésus-Christ »
  rationale: L’apposition française identifie clairement le gage à Jésus-Christ tout en restant naturelle et sans développer la manière dont il garantit cette justice.
- issue: Portée de « vivre en lui »
  choice: Conserver « afin que nous vivions en lui »
  alternative: « afin que nous vivions par lui »
  rationale: La formulation locative ou relationnelle « en lui » préserve l’union au Christ exprimée par le témoin et n’en réduit pas le sens à une simple causalité instrumentale.
- issue: Objet final de la foi
  choice: « nous avons cru cela »
  alternative: « nous avons cru en lui »
  rationale: Le témoin fourni porte « we believed this ». La traduction conserve cet objet neutre malgré son caractère moins idiomatique, plutôt que d’introduire sans preuve « en lui ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde les enchaînements exhortatifs et les échos bibliques. Comme la révision directe du grec et du latin est indiquée comme encore en attente, les décisions restent explicitement fondées sur le témoin anglais public fourni et doivent être vérifiées sur la tradition manuscrite.
