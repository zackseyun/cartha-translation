review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement la progression du témoin : attachement continu à l’espérance et au gage identifié au Christ, allusion à 1 Pierre 2.24 et à Ésaïe 53.9, endurance rédemptrice, puis appel à l’imitation. « Bois », « justice », « gage » et « en lui » sont des choix justes. La tradition grecque/latine n’étant pas fournie ici sous forme de texte contrôlable, cette appréciation source reste nécessairement prudente; aucune divergence doctrinale ne doit être introduite.'
  naturalness: « Tenir fermement à notre espérance » peut se comprendre en français moderne comme « y être attaché / y accorder de l’importance », plutôt que comme l’injonction de la conserver fermement. « Restons fermement attachés à » rend plus naturellement et précisément l’exhortation. « Si nous souffrons » conserve la condition générale sans l’atténuation narrative de « s’il nous arrive de souffrir ».
  terminology: '« Gage de notre justice » préserve la valeur de garantie de ἀρραβών/« earnest » sans surinterprétation. « Le bois » maintient l’image scripturaire plutôt que de substituer « croix ». « Tromperie » est intelligible et convient à « guile », même si « ruse » serait également possible. L’explicitation « qui est Jésus-Christ » est préférable en français : elle lève une ambiguïté syntaxique sans ajouter de contenu.'
  issues:
  - severity: medium
    issue: Construction « Tenons … à notre espérance »
    rationale: La tournure est possible, mais elle est moins idiomatique et moins précise pour l’idée d’une ferme persévérance. « Restons fermement attachés à » rend l’injonction sans modifier le sens.
  - severity: low
    issue: Identification appositive de Jésus-Christ
    rationale: Dans « au gage de notre justice, Jésus-Christ », l’apposition est compréhensible mais heurtée et peut momentanément sembler être une adresse. La relative « qui est Jésus-Christ » rend explicitement l’identification portée par le témoin.
  - severity: low
    issue: Condition « s’il nous arrive de souffrir »
    rationale: Cette formulation introduit une nuance d’éventualité circonstancielle absente de la condition générale du témoin. « Si nous souffrons » est plus direct.
  revised_text: 'Restons donc fermement attachés, sans relâche, à notre espérance et au gage de notre justice, qui est Jésus-Christ. Il a lui-même porté nos péchés dans son corps sur le bois ; il n’a commis aucun péché, et aucune tromperie ne s’est trouvée dans sa bouche. Pourtant, à cause de nous, il a tout supporté, afin que nous vivions en lui.


    Devenons donc les imitateurs de son endurance. Si nous souffrons à cause de son nom, glorifions-le. Car il nous a donné cet exemple en sa propre personne, et nous avons cru cela.'
  revised_footnotes: []
  revision_rationale: La révision améliore la syntaxe et l’idiomaticité françaises tout en conservant les termes théologiquement et textuellement importants. Elle n’interprète pas davantage « justice », « gage », « bois », « en lui » ou l’objet neutre final de « nous avons cru cela ».
