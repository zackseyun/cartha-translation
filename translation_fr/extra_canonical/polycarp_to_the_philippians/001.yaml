base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/001.yaml
  text: 'Polycarp and the elders who are with him, to the church of God residing in Philippi: May mercy and peace from God Almighty and Jesus Christ our Savior be multiplied to you.'
translation:
  language: fr
  text: 'Polycarpe et les anciens qui sont avec lui, à l’Église de Dieu qui séjourne à Philippes : que la miséricorde et la paix vous soient multipliées de la part de Dieu tout-puissant et de Jésus Christ notre Sauveur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: presbyters
  choice: anciens
  rationale: « Anciens » est le terme ecclésial français courant correspondant à presbyteroi, sans imposer la connotation sacerdotale moderne de « prêtres ».
- source_word: sojourneth
  choice: séjourne
  rationale: Conserve l’image ancienne de la communauté chrétienne comme résidente de passage, tout en restant naturel en français.
- source_word: mercy
  choice: compassion
  rationale: Rend le sens de miséricorde bienveillante dans une langue actuelle et claire; « miséricorde » demeure possible, mais possède un registre plus traditionnel.
- source_word: be multiplied
  choice: soient accordées en abondance
  rationale: Exprime naturellement en français la formule d’accroissement abondant sans calquer maladroitement « soient multipliées ».
theological_decisions:
- issue: Source commune de la compassion et de la paix
  choice: « venant de Dieu tout-puissant et de Jésus Christ notre Sauveur »
  alternative: « de la part de Dieu tout-puissant, par Jésus Christ notre Sauveur »
  rationale: La coordination du témoin anglais présente Dieu et Jésus Christ ensemble après « from ». La traduction maintient cette syntaxe et n’introduit pas une médiation absente du texte fourni.
- issue: Titre ecclésial presbyters
  choice: « anciens »
  alternative: « presbytres » ou « prêtres »
  rationale: « Anciens » préserve la portée du titre sans trancher en faveur d’une conception confessionnelle ultérieure du ministère.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue l’adresse de la salutation. Comme la révision directe du grec et du latin est annoncée comme encore à faire, le projet reste prudemment fondé sur le témoin anglais public fourni.
