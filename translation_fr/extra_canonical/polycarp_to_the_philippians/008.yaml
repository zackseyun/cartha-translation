base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: fr
  text: 'Car quiconque ne confesse pas que Jésus-Christ est venu dans la chair est un antichrist. Quiconque ne confesse pas le témoignage de la croix vient du diable. Et quiconque déforme les paroles du Seigneur pour les adapter à ses propres désirs et affirme qu’il n’y a ni résurrection ni jugement, celui-là est le premier-né de Satan.


    C’est pourquoi, abandonnons les pratiques vaines de la multitude et ses faux enseignements, et revenons à la parole qui nous a été transmise dès le commencement. Restons vigilants dans la prière et persévérants dans les jeûnes, suppliant le Dieu qui voit tout de ne pas nous faire entrer en tentation, comme le Seigneur l’a dit : « L’esprit est plein d’ardeur, mais la chair est faible. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confess
  choice: confesser
  rationale: Conserve le sens public et doctrinal de reconnaître et déclarer, tout en faisant écho au vocabulaire johannique.
- source_word: is come in the flesh
  choice: est venu dans la chair
  rationale: Formulation française naturelle qui préserve l’affirmation christologique et son écho à 1 Jean 4.2-3.
- source_word: testimony of the Cross
  choice: témoignage de la croix
  rationale: Traduction formelle qui maintient l’ambiguïté entre le témoignage rendu à la croix et celui que porte la croix.
- source_word: oracles of the Lord
  choice: paroles du Seigneur
  rationale: « Paroles » est clair en français moderne et convient aux dits autoritatifs du Seigneur sans connotation païenne d’« oracles ».
- source_word: vain doing
  choice: pratiques vaines
  rationale: Rend une conduite ou des façons d’agir sans valeur, plutôt qu’un simple acte isolé.
- source_word: being sober unto prayer
  choice: Restons vigilants dans la prière
  rationale: « Vigilants » exprime ici la sobriété spirituelle et l’attention requise pour prier.
- source_word: constant in fastings
  choice: persévérants dans les jeûnes
  rationale: Conserve le pluriel du témoin, qui peut évoquer des jeûnes répétés ou réguliers.
- source_word: all-seeing God
  choice: le Dieu qui voit tout
  rationale: Expression intelligible et digne, sans créer en français un adjectif rare ou artificiel.
theological_decisions:
- issue: Déclaration « est antichrist »
  choice: est un antichrist
  alternative: est l’Antichrist
  rationale: L’absence d’article défini et le parallèle johannique favorisent une caractérisation ou une catégorie, non l’identification nécessaire avec une unique figure eschatologique.
- issue: Origine ou appartenance diabolique
  choice: vient du diable
  alternative: est du diable
  rationale: « Vient du diable » communique naturellement l’origine ou l’appartenance morale sans définir métaphysiquement la personne.
- issue: « Premier-né de Satan »
  choice: le premier-né de Satan
  alternative: un enfant éminent de Satan
  rationale: Maintient l’image forte, hiérarchique et volontairement choquante du témoin sans l’expliquer ni l’atténuer.
- issue: Demande concernant la tentation
  choice: de ne pas nous faire entrer en tentation
  alternative: de ne pas nous laisser entrer en tentation
  rationale: Préserve la tension de la formulation traditionnelle attribuée au Seigneur, sans résoudre implicitement la question de l’action divine.
- issue: Disposition de l’esprit
  choice: L’esprit est plein d’ardeur
  alternative: L’Esprit est bien disposé
  rationale: La minuscule conserve l’ambiguïté possible tout en rendant le contraste avec la faiblesse de la chair; « plein d’ardeur » exprime la volonté empressée.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Les reprises bibliques sont rendues dans une formulation familière sans imposer le libellé d’une version confessionnelle précise. Projet nécessairement provisoire puisque le dossier fourni indique qu’une vérification directe des témoins grec et latin reste à faire.
