base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/007.yaml
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
translation:
  language: fr
  text: 'Les anciens doivent eux aussi être compatissants et miséricordieux envers tous. Qu’ils ramènent les brebis égarées, visitent tous les malades et ne négligent ni la veuve, ni l’orphelin, ni le pauvre. Qu’ils veillent toujours à ce qui est honorable devant Dieu et devant les êtres humains. Qu’ils s’abstiennent de toute colère, de tout favoritisme et de tout jugement injuste ; qu’ils se tiennent loin de tout amour de l’argent ; qu’ils ne soient pas prompts à croire une accusation contre quelqu’un ni précipités dans leur jugement, sachant que nous sommes tous débiteurs du péché.[a]


    Si donc nous demandons au Seigneur de nous pardonner, nous devons nous aussi pardonner. En effet, nous sommes sous les yeux de notre Seigneur et Dieu ; nous devons tous comparaître devant le tribunal du Christ, et chacun rendra compte de lui-même.


    Servons-le donc avec crainte et un profond respect, comme il l’a lui-même commandé, ainsi que les apôtres qui nous ont annoncé la bonne nouvelle et les prophètes qui ont proclamé d’avance la venue de notre Seigneur. Recherchons avec ardeur ce qui est bon ; gardons-nous des causes de chute,[b] des faux frères et de ceux qui portent hypocritement le nom du Seigneur et égarent les gens dépourvus de discernement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « débiteurs du péché » peut évoquer une dette ou une culpabilité liée au péché ; la formulation reste volontairement ouverte.
    reason: Signaler une métaphore inhabituelle et préserver son ambiguïté.
  - marker: b
    text: 'Ou : « des occasions de chute ».'
    reason: Le terme peut désigner ce qui fait trébucher moralement, et pas seulement une offense au sens moderne.
lexical_decisions:
- source_word: presbyters
  choice: anciens
  rationale: Terme français courant dans les traductions chrétiennes anciennes et bibliques, qui désigne ici les responsables communautaires sans imposer une structure ecclésiastique ultérieure.
- source_word: infirm
  choice: malades
  rationale: Dans ce contexte de visite et de soin pastoral, « malades » est naturel et suffisamment large.
- source_word: respect of persons
  choice: favoritisme
  rationale: Rend clairement l’idée de partialité fondée sur le statut ou la personne, dans un français moderne.
- source_word: debtors of sin
  choice: débiteurs du péché
  rationale: Conserve la métaphore et son ambiguïté théologique au lieu de préciser arbitrairement s’il s’agit de culpabilité, de dette ou d’assujettissement.
- source_word: judgment-seat
  choice: tribunal
  rationale: Expression française naturelle qui garde la dimension judiciaire de la comparution devant le Christ.
- source_word: offenses
  choice: causes de chute
  rationale: Préserve le sens moral possible de ce qui fait trébucher plutôt que de réduire le terme à de simples vexations.
- source_word: foolish men
  choice: gens dépourvus de discernement
  rationale: Exprime le défaut de jugement visé sans employer une insulte inutilement dure en français contemporain.
theological_decisions:
- issue: Identité grammaticale de « notre Seigneur et Dieu »
  choice: Conserver la formule unifiée « notre Seigneur et Dieu »
  alternative: Expliciter deux référents distincts
  rationale: La formulation reçue permet plusieurs analyses syntaxiques ; la traduction ne tranche pas au-delà du témoin fourni.
- issue: Rapport entre le commandement du Seigneur, les apôtres et les prophètes
  choice: Conserver une coordination souple avec « ainsi que »
  alternative: Faire de tous trois les auteurs directs du même commandement
  rationale: La syntaxe du témoin est condensée ; cette formulation évite d’imposer une hiérarchie ou une relation syntaxique trop précise.
- issue: « Débiteurs du péché »
  choice: Maintenir la métaphore littérale
  alternative: Traduire « coupables de péché » ou « soumis au péché »
  rationale: Ces alternatives résoudraient une tension que le texte transmis laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Les exhortations sont rendues par des tournures injonctives naturelles. « Anciens » évite à la fois l’archaïsme institutionnel de « presbytres » et l’importation d’un titre confessionnel précis. Le brouillon demeure provisoire, puisque la notice indique qu’un examen direct du grec et du latin reste à effectuer.
