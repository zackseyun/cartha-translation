review_pass:
  verdict: revise
  source_fidelity: 'Le brouillon suit fidèlement le témoin anglais et rend avec justesse les principales exhortations. « Anciens », « favoritisme », « tribunal du Christ » et la conservation de « débiteurs du péché » sont appropriés. Une légère correction est nécessaire : « une accusation » restreint indûment le très large « anything against any man » / πιθανablement le grec τι κατὰ τινος. La formulation révisée conserve cette généralité sans rendre la phrase lourde.'
  naturalness: Le français est moderne, clair et de registre convenable. Les injonctions au subjonctif dans le premier paragraphe, puis à l’impératif inclusif dans le dernier, sont naturelles. « Les gens dépourvus de discernement » est idiomatique et atténue sans effacer le jugement négatif porté par le texte.
  terminology: « Anciens » convient pour πρεσβύτεροι sans projeter un office ecclésial ultérieur. « Causes de chute » rend bien σκανδαλα, avec une note utile. « Débiteurs du péché » maintient volontairement une métaphore textuellement difficile et ambiguë. « Notre Seigneur et Dieu » ne doit pas être analysé davantage dans la traduction.
  issues:
  - severity: medium
    issue: Restriction de « quoi que ce soit contre qui que ce soit » à « une accusation contre quelqu’un »
    rationale: Le témoin dit « not quick to believe anything against any man ». Même si une accusation est contextuellement possible, le texte ne la spécifie pas. La traduction doit préserver la portée indéfinie et ne pas transformer l’objet de la croyance en une catégorie juridique précise.
  revised_text: 'Les anciens doivent eux aussi être compatissants et miséricordieux envers tous. Qu’ils ramènent les brebis égarées, visitent tous les malades et ne négligent ni la veuve, ni l’orphelin, ni le pauvre. Qu’ils veillent toujours à ce qui est honorable devant Dieu et devant les êtres humains. Qu’ils s’abstiennent de toute colère, de tout favoritisme et de tout jugement injuste ; qu’ils se tiennent loin de tout amour de l’argent ; qu’ils ne soient pas prompts à croire quoi que ce soit contre qui que ce soit ni précipités dans leur jugement, sachant que nous sommes tous débiteurs du péché.[a]


