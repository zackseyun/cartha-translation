    Servons-le donc avec crainte et un profond respect, comme il l’a lui-même commandé, ainsi que les apôtres qui nous ont annoncé la bonne nouvelle et les prophètes qui ont proclamé d’avance la venue de notre Seigneur. Recherchons avec ardeur ce qui est bon ; gardons-nous des causes de chute,[b] des faux frères et de ceux qui portent hypocritement le nom du Seigneur et égarent les gens dépourvus de discernement.'
