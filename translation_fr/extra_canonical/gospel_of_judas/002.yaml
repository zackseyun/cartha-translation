  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, practicing their piety. When he [came up to] his disciples sitting together and praying over the bread, [he] laughed.


    The disciples said to him, “Master, why are you laughing at [our] prayer? What have we done? [This] is what is right.”


    He answered them, “I’m not laughing at you. You aren’t doing this because you want to, but because through this your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.”


    When his disciples heard this, [they] began to grow angry and furious, and they began to curse him in their hearts.


    But when Jesus noticed their ignorance, [he said] to them, “Why are you letting your anger trouble you? Has your God within you and [his stars] become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.”


    They all said, “We’re strong enough.” But their spirits weren’t brave enough to stand before [him]—except for Judas Iscariot. He was able to stand before him, but he couldn’t look him in the eye, so he looked away.


    Judas [said] to him, “I know who you are and where you’ve come from. You’ve come from the immortal realm of Barbelo, and I’m not worthy to utter the name of the one who’s sent you.”


    Then Jesus, knowing that he was thinking about what is exalted, said to him, “Come away from the others, and I’ll tell you the mysteries of the kingdom. Not so that you’ll go there, but you’ll grieve much because someone else will replace you to complete the twelve [elements] before their God.”


    Judas said to him, “When will you tell me these things, and when will the great day of light dawn for the generation […]?”


    But when he said these things, Jesus left him.'
translation:
  language: fr
  text: 'Un jour, Jésus était avec ses disciples en Judée. Il les trouva assis ensemble, occupés à pratiquer leur piété. Lorsqu’il [s’approcha de] ses disciples, qui étaient assis ensemble et priaient sur le pain, [il] rit.


    Les disciples lui dirent : « Maître, pourquoi ris-tu de [notre] prière ? Qu’avons-nous fait ? [C’est] ce qui est juste. »


    Il leur répondit : « Je ne ris pas de vous. Vous ne faites pas cela de votre propre volonté, mais parce que, par ce moyen, votre Dieu [sera] loué. »


    Ils dirent : « Maître, tu […] es le Fils de notre Dieu ! »


    Jésus leur dit : « Comment [me] connaissez-vous ? En vérité, [je] vous le dis, aucune génération du peuple qui est parmi vous ne me connaîtra. »


    Lorsque ses disciples entendirent cela, [ils] commencèrent à se mettre en colère et à entrer en fureur, et ils commencèrent à le maudire dans leur cœur.


    Mais Jésus, remarquant leur ignorance, [leur dit] : « Pourquoi laissez-vous votre colère vous troubler ? Votre Dieu qui est en vous et [ses étoiles] se sont-ils irrités contre vos âmes ? Si l’un de vous est [assez fort], parmi les humains, pour faire paraître l’Humanité parfaite[a], qu’il se lève et me fasse face. »


    Ils dirent tous : « Nous sommes assez forts. » Mais leur esprit n’eut pas le courage de se tenir devant [lui] — à l’exception de Judas Iscariote. Il fut capable de se tenir devant lui, mais il ne put le regarder dans les yeux ; il détourna donc le regard.


    Judas [lui dit] : « Je sais qui tu es et d’où tu es venu. Tu es venu du royaume immortel de Barbélô[b], et je ne suis pas digne de prononcer le nom de celui qui t’a envoyé. »


    Alors Jésus, sachant qu’il pensait à ce qui est élevé, lui dit : « Éloigne-toi des autres, et je te révélerai les mystères du royaume. Non pas pour que tu y ailles : tu éprouveras plutôt une grande affliction, car quelqu’un d’autre te remplacera afin de compléter les douze [éléments][c] devant leur Dieu. »


    Judas lui dit : « Quand me révéleras-tu ces choses, et quand le grand jour de lumière se lèvera-t-il pour la génération […] ? »


    Mais après qu’il eut dit cela, Jésus le quitta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « L’Humanité parfaite » peut désigner ici une réalité humaine accomplie ou une figure céleste idéale ; la formulation demeure ambiguë.
    reason: Éclairer une expression potentiellement technique sans trancher son interprétation.
  - marker: b
    text: Barbélô est, dans plusieurs écrits anciens de courant gnostique, le nom d’une réalité céleste primordiale. L’orthographe du nom varie selon les langues et les éditions.
    reason: Fournir le contexte minimal nécessaire à un nom propre peu connu.
  - marker: c
    text: Le mot « éléments » est une restitution dans une partie endommagée du manuscrit ; les « douze » peuvent recevoir plusieurs interprétations.
    reason: Signaler explicitement l’incertitude textuelle conservée par les crochets.
lexical_decisions:
- source_word: practicing their piety
  choice: occupés à pratiquer leur piété
  rationale: Conserve la notion de pratique religieuse sans introduire un jugement absent de la formulation témoin.
- source_word: praying over the bread
  choice: priaient sur le pain
  rationale: Rendu volontairement formel qui préserve l’ambiguïté du geste rituel plutôt que de l’identifier à une tradition liturgique précise.
- source_word: perfect Humanity
  choice: l’Humanité parfaite
  rationale: La majuscule signale qu’il peut s’agir d’une réalité anthropologique ou céleste particulière, sans réduire l’expression à « l’homme parfait ».
- source_word: immortal realm
  choice: royaume immortel
  rationale: « Royaume » convient au domaine céleste évoqué et reste distinct du « royaume » mentionné ensuite, comme dans le témoin anglais.
- source_word: what is exalted
  choice: ce qui est élevé
  rationale: 'Préserve l’indétermination : l’expression peut viser des réalités supérieures ou une pensée élevée.'
- source_word: mysteries
  choice: mystères
  rationale: Correspondance naturelle qui conserve la portée révélatoire et ésotérique du terme.
- source_word: generation
  choice: génération
  rationale: Maintient un terme central et potentiellement technique du texte, sans le paraphraser par « peuple » ou « race ».
theological_decisions:
- issue: Identité du « Dieu » des disciples
  choice: Conserver « votre Dieu » sans l’identifier ni l’harmoniser avec d’autres textes chrétiens
  alternative: Employer « Dieu » ou préciser une divinité inférieure
  rationale: Le possessif et la tension polémique appartiennent au passage ; une explicitation imposerait une lecture doctrinale.
- issue: « Votre Dieu qui est en vous et [ses étoiles] »
  choice: Conserver la syntaxe difficile et la restauration entre crochets
  alternative: Réorganiser la phrase pour attribuer clairement les étoiles à une puissance cosmique
  rationale: Le témoin est textuellement incertain et la relation entre Dieu, les étoiles, la colère et les âmes ne doit pas être résolue artificiellement.
- issue: Destination de Judas
  choice: Traduire « Non pas pour que tu y ailles »
  alternative: Faire de Judas le bénéficiaire assuré du royaume
  rationale: La négation du témoin doit être maintenue malgré la tension avec la révélation particulière accordée à Judas.
- issue: Remplacement de Judas et les douze
  choice: Conserver « compléter les douze [éléments] devant leur Dieu »
  alternative: Interpréter explicitement les douze comme les apôtres
  rationale: Le mot restauré « éléments » et le possessif « leur » sont incertains et théologiquement chargés ; ils ne doivent pas être harmonisés avec les Actes.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions narratives ont été largement conservées, de même que les crochets et l’ellipse qui signalent les lacunes ou restitutions du manuscrit. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe du copte du Codex Tchacos reste nécessaire.
