  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: fr
  text: 'Quand Jésus eut [dit] cela, il partit, [emmenant] avec lui Judas Iscariote. Il lui dit : « L’eau qui est sur la montagne élevée vient [de] […] Elle n’est pas venue [arroser… le puits] de l’arbre [du fruit…] de ce monde […] après un certain temps […], mais elle est venue arroser le paradis de Dieu et le [fruit] qui demeure, car [elle] ne corrompra pas le [mode de vie] de cette génération, mais [elle subsistera] pour toute l’éternité. »


    Judas lui dit : « [Dis]-moi, quel genre de fruit cette génération porte-t-elle ? »


    Jésus dit : « Les âmes de toute génération humaine mourront. Cependant, lorsque ces gens auront achevé le temps qui leur est accordé dans le royaume et que l’esprit les aura quittés, leurs corps mourront, mais leurs âmes vivront et seront élevées. »


    Judas dit : « Que feront les autres générations humaines ? »


    Jésus dit : « Il n’est pas possible de semer sur [la pierre] et d’en récolter le fruit. De même, il [n’est pas possible de semer dans] la race [souillée], avec la sagesse périssable [et] la main qui a créé les humains mortels, afin que leurs âmes montent vers les domaines d’en haut. [En vérité], je te le dis, [aucun dirigeant], aucun ange [ni aucune] puissance ne pourra voir les [lieux] que [cette grande] génération sainte [verra]. » Après avoir dit cela, Jésus partit.


    Judas dit : « Maître, de même que tu les as tous écoutés, écoute-moi maintenant, moi aussi, car j’ai eu une grande vision. »


    Mais Jésus rit en l’entendant. Il lui dit : « Pourquoi es-tu si agité, toi, le treizième démon ? Parle donc, et je te supporterai. »


    Judas lui dit : « Dans la vision, je me suis vu moi-même. Les douze disciples me lapidaient et me poursuivaient [à toute allure]. Je suis aussi arrivé à l’endroit où [je t’avais suivi]. J’ai vu [une maison en ce lieu], et mes yeux ne pouvaient pas [en mesurer] la grandeur. Des personnages importants l’entouraient, et cette maison avait un toit de verdure. Au milieu de la maison se trouvait [une foule…]. Maître, fais-moi entrer auprès de ces gens ! »


    [Jésus] lui répondit : « Ton étoile t’a égaré, Judas. Aucun être né mortel n’est digne d’entrer dans la maison que tu as vue, car ce lieu est réservé à ceux qui sont saints. Ni le soleil, ni la lune, ni le jour n’y régneront ; ceux qui sont saints se tiendront toujours dans ce domaine avec les anges saints. Vois, je t’ai révélé les mystères du royaume et je t’ai enseigné l’égarement des étoiles et […] envoyé [dans les hauteurs] au-dessus des douze domaines. »


    Judas dit : « Maître, ma descendance ne domine tout de même pas les dirigeants, n’est-ce pas ? »


    Jésus lui répondit : « Viens, laisse-moi [te parler de la génération sainte. Ce n’est pas que tu iras là-bas] ; au contraire, tu éprouveras une profonde tristesse lorsque tu verras le royaume et toute sa génération. »


    Quand Judas entendit cela, il lui dit : « Quel bien cela m’a-t-il fait que tu m’aies séparé de cette génération ? »


    Jésus lui répondit : « Tu deviendras le treizième ; les autres générations te maudiront, et tu régneras sur elles. Dans les derniers jours, elles […] vers toi, et tu ne monteras pas jusqu’à la génération sainte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: generation
  choice: génération
  rationale: Conserve le terme récurrent et sa portée à la fois humaine, collective et spirituelle, sans le réduire à « peuple » ou « race ».
- source_word: realm / realms
  choice: monde / domaine(s)
  rationale: « Monde » convient au premier contexte cosmologique courant, tandis que « domaines » préserve la pluralité des sphères supérieures sans imposer le vocabulaire plus technique d’« éons » absent du témoin fourni.
- source_word: ruler(s)
  choice: dirigeant(s)
  rationale: Rendu neutre qui conserve l’ambiguïté entre autorités cosmiques et gouvernants, sans importer systématiquement le terme doctrinal « archontes ».
- source_word: spirit
  choice: esprit
  rationale: Équivalent formel qui ne tranche pas entre souffle vital et entité spirituelle.
- source_word: souls
  choice: âmes
  rationale: Maintient la distinction explicite du passage entre corps, esprit et âmes.
- source_word: seed
  choice: descendance
  rationale: Dans la question de Judas, « descendance » exprime naturellement en français la portée collective possible de « semence », tout en gardant le lien généalogique.
- source_word: thirteenth demon
  choice: le treizième démon
  rationale: Conserve l’expression abrupte et théologiquement tendue, sans l’adoucir en « esprit ».
- source_word: star
  choice: étoile
  rationale: Maintient l’imagerie astrologique/cosmologique du texte et son lien avec « l’égarement des étoiles ».
theological_decisions:
- issue: Sort des âmes et des corps
  choice: « leurs corps mourront, mais leurs âmes vivront et seront élevées »
  alternative: Interpréter cette élévation comme une résurrection ou un salut chrétien conventionnel
  rationale: La formulation conserve l’anthropologie propre au passage sans l’harmoniser avec une doctrine extérieure.
- issue: Identité de la génération sainte
  choice: Conserver « génération sainte » sans explication
  alternative: L’identifier explicitement aux élus, aux gnostiques ou à l’Église
  rationale: Le témoin ne donne pas ici une identification univoque ; l’ambiguïté doit rester ouverte.
- issue: Rapport de Judas à la génération sainte
  choice: « tu ne monteras pas jusqu’à la génération sainte »
  alternative: Présenter Judas comme assuré d’intégrer ou de sauver cette génération
  rationale: La conclusion négative du témoin est maintenue malgré la tension avec les révélations particulières accordées à Judas.
- issue: Autorité future de Judas
  choice: « tu régneras sur elles »
  alternative: Comprendre « surpasseras » ou « domineras spirituellement »
  rationale: Le témoin porte « rule over » ; la traduction préserve cette affirmation sans expliquer la nature de ce règne.
- issue: Création des humains mortels
  choice: « la main qui a créé les humains mortels »
  alternative: Identifier explicitement cette main au Dieu suprême ou à un démiurge
  rationale: Le texte transmis n’identifie pas ici sans ambiguïté l’agent créateur ; aucune construction doctrinale n’est ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. Les crochets et les points de suspension reproduisent les restaurations et lacunes signalées par le témoin anglais public, la consultation directe du copte restant en attente. La syntaxe a été rendue naturelle lorsque le sens était suffisamment assuré, mais les passages endommagés demeurent volontairement fragmentaires. Aucun appel de note n’a été ajouté, puisqu’aucune note de bas de page n’est nécessaire au corps de cette version provisoire.
