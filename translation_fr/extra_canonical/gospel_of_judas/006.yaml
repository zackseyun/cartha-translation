  verdict: revise
  source_fidelity: Révision effectuée d’après le témoin anglais public fourni, la vérification directe du copte restant explicitement en attente. Le projet conserve soigneusement les crochets, les ellipses, les répétitions et les ambiguïtés du témoin. Quelques formulations introduisaient toutefois une précision non attestée ou modifiaient la syntaxe d’un passage lacunaire.
  naturalness: Le français est globalement naturel, soutenu et accessible. Les corrections rendent plus idiomatiques certains enchaînements sans lisser les difficultés inhérentes au texte fragmentaire.
  terminology: Les choix « royaume », « luminaire », « génération », « esprit », « âme », « Chaos », « Hadès » et « Autoengendré » sont cohérents. Les noms propres et les termes cosmologiques sont maintenus sans interprétation doctrinale.
  issues:
  - severity: medium
    issue: « Il leur donna des chefs »
    rationale: Le témoin dit seulement qu’il les « fit gouverner » / les établit sous une domination. L’ajout de « chefs » introduit des agents personnels qui ne sont pas explicitement mentionnés.
  - severity: medium
    issue: « cherchez [l’esprit] » dans la phrase très lacunaire sur les âmes et l’esprit
    rationale: Le témoin anglais porte « seek », sous forme déclarative dans une phrase déjà endommagée; l’impératif français « cherchez » ajoute une adresse directe absente du témoin et résout indûment sa syntaxe.
  - severity: low
    issue: Accord final pour les six étoiles et les cinq guerriers
    rationale: Le référent collectif inclut des « guerriers » masculins; « ils seront tous détruits » restitue mieux « they’ll all be destroyed » que le féminin pluriel, qui ne pouvait viser que les étoiles.
  revised_text: "Jésus dit : « [Viens], et je t’enseignerai les [mystères qu’aucun] être humain [ne pourra] voir. Car il existe un royaume immense et sans limites, dont aucune génération angélique n’a vu les confins. [En] lui se trouve un [grand] Esprit invisible, qu’aucun œil [angélique] n’a jamais vu, qu’aucun cœur n’a jamais compris et qu’on n’a jamais appelé d’aucun nom.\n\n\n« Là apparut un nuage lumineux. Et lui — l’Esprit — dit : “Qu’un ange vienne à l’existence pour se tenir à mon service.” Alors un grand ange, l’Autoengendré[a], le Dieu de la Lumière, sortit du nuage. À cause de lui, quatre autres anges vinrent à l’existence depuis un autre nuage, et ils se tinrent au service de l’Autoengendré angélique. Et [l’Autoengendré] dit : “Qu’[un royaume] vienne à l’existence”, et il vint à l’existence [comme il l’avait dit]. Puis il [créa] le premier luminaire pour qu’il règne sur ce royaume. Il dit : “Que des anges viennent à l’existence pour [le] servir”, et des [myriades] innombrables\
    \ vinrent à l’existence. Il dit encore : “[Qu’un] royaume lumineux vienne à l’existence”, et il vint à l’existence. Il créa le deuxième luminaire pour qu’il règne sur ce royaume, avec des myriades innombrables d’anges chargés de le servir. C’est ainsi qu’il créa les autres royaumes de lumière. Il les établit sous une autorité et créa pour eux des myriades innombrables d’anges chargés\n      de les assister.\n\n\n« Adamas se trouvait dans le premier nuage de lumière, qu’aucun ange n’avait jamais pu voir parmi tous ceux qu’on appelle “Dieu”. Et [Adamas engendra Seth en] ce [lieu, selon l’]image [de…] et à la ressemblance de [cet] ange. Il fit apparaître l’incorruptible [génération] de Seth devant les douze [luminaires] androgynes. [Puis] il fit apparaître soixante-douze luminaires au sein de la génération incorruptible, conformément à la volonté de l’Esprit. Ensuite, les soixante-douze luminaires eux-mêmes firent apparaître trois cent soixante luminaires au sein de la génération incorruptible,\
    \ conformément à la volonté de l’Esprit, afin qu’il y en ait cinq pour chacun. Les douze royaumes des douze luminaires constituent leur père. Chaque royaume possède six cieux : il y a donc soixante-douze cieux pour les soixante-douze luminaires et, pour chacun [d’eux, cinq] firmaments, [soit au total] trois cent soixante [firmaments. Ils] reçurent autorité ainsi qu’une [grande] armée d’anges innombrables,\n      pour l’honneur et le service. Ils reçurent aussi des esprits vierges [pour] honorer et [servir] tous les royaumes, les cieux et leurs firmaments.\n\n\n« Or, l’ensemble de ces immortels est appelé “cosmos” — c’est-à-dire “périssable”[b] — par le Père et les soixante-douze luminaires, avec l’Autoengendré et ses soixante-douze royaumes. C’est là que le premier être humain apparut avec ses puissances incorruptibles. Dans le royaume apparu avec sa génération se trouvent le nuage de la connaissance et l’ange appelé [Éléleth…] Après cela, [Éléleth] dit : “Que douze anges viennent à\
    \ l’existence [pour] régner sur le Chaos et [l’Hadès].” Et voici que, du nuage, apparut un [ange] dont le visage étincelait de [feu] et dont l’apparence était [souillée] de sang. Son nom était Nébro, ce qui signifie “Rebelle”. D’autres l’appellent Yaldabaoth. Un autre ange, Saklas, sortit lui aussi du nuage. Nébro créa donc six anges — et Saklas [en fit autant] — pour qu’ils soient leurs assistants. Ils firent apparaître douze anges dans les cieux, et chacun d’eux reçut une part dans les cieux.\n\n\n« Les douze chefs dirent aux douze anges : “Que chacun de vous […] et qu’ils […] génération [… cinq] anges :\n\n\n« Le premier [est Yaoth], appelé “le Bon”.\n\n\n« Le deuxième est Harmathoth, [l’œil de feu].\n\n\n« Le [troisième] est Galila.\n\n\n« Le quatrième [est] Yobel.\n\n\n« Le cinquième est Adonaios.\n\n\n« Ce sont les cinq qui ont régné sur l’Hadès et qui sont les premiers au-dessus du Chaos.\n\n\n« Alors Saklas dit à ses anges : “Créons un être humain selon la ressemblance et l’image.”\
    \ Ils façonnèrent Adam et sa femme Ève, qui, dans le nuage, est appelée “Vie”. En effet, c’est sous ce nom que toutes les générations le cherchent, et chacune d’elles l’appelle, elle, de leurs noms. Or Saklas ne [commanda pas…] d’enfanter, sauf […] parmi les générations […] que ceci […] et l’[ange] lui dit : “Ta vie durera un temps limité, de même que celle de tes enfants.” »\n\n\nJudas demanda alors à Jésus : « [Combien] de temps une personne peut-elle vivre ? »\n\n\nJésus répondit : « Pourquoi t’étonnes-tu que la durée de vie d’Adam et de sa génération soit limitée dans le lieu où il a reçu son royaume, avec celui qui le gouverne ? »\n\n\nJudas demanda à Jésus : « L’esprit humain meurt-il ? »\n\n\nJésus répondit : « Voici ce qu’il en est. Dieu a ordonné à Michel de prêter des esprits aux êtres humains afin qu’ils servent. Puis le Grand a ordonné à Gabriel de donner des esprits à la grande génération qui n’a pas de roi — l’esprit avec l’âme. Ainsi, les [autres] âmes […] lumière [… le]\
    \ Chaos […] cherchent [l’]esprit qui est en vous et que vous avez fait vivre dans cette chair issue des générations angéliques. Ensuite, Dieu fit apporter la connaissance à Adam et à ceux qui étaient avec lui, afin que les rois du Chaos et de l’Hadès ne règnent pas sur eux. »\n\n\n[Alors] Judas demanda à Jésus : « Que feront donc ces générations ? »\n\n\nJésus répondit : « En vérité, je te le dis, les étoiles accomplissent toutes ces choses. Quand Saklas arrivera au terme du temps qui lui a été fixé, leur première étoile apparaîtra avec les générations, et elles achèveront ce qui a été annoncé. Alors elles se livreront à la débauche en mon nom, tueront leurs enfants et [elles…] le mal et […] les royaumes, amenant les générations et les présentant à Saklas. [Et] après cela, […] amènera les douze tribus d’[Israël] depuis […], et toutes les [générations] serviront Saklas, péchant en mon nom. Quant à ton étoile, elle [régnera] sur le treizième royaume. » Puis Jésus [rit].\n\n\n[Judas] demanda\
    \ : « Maître, pourquoi [ris-tu de moi ? »\n\n\nJésus] répondit : « Je ne ris pas [de toi, mais] de l’égarement des étoiles. Car ces six étoiles s’égarent avec ces cinq guerriers, et ils seront tous détruits avec ce qu’ils ont créé. »\n\n\nJudas demanda alors à Jésus : « Que feront ceux qui ont été baptisés en ton nom ? »"
