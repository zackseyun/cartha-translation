translation:
  language: fr
  text: 'Jésus dit : « [Viens], et je t’enseignerai les [mystères qu’aucun] être humain [ne pourra] voir. Car il existe un royaume immense et sans limites, dont aucune génération angélique n’a vu les confins. [En] lui se trouve un [grand] Esprit invisible, qu’aucun œil [angélique] n’a jamais vu, qu’aucun cœur n’a jamais compris et qu’on n’a jamais appelé d’aucun nom.


    « Là apparut un nuage lumineux. Et lui — l’Esprit — dit : “Qu’un ange vienne à l’existence pour se tenir à mon service.” Alors un grand ange, l’Autoengendré[a], le Dieu de la Lumière, sortit du nuage. À cause de lui, quatre autres anges vinrent à l’existence depuis un autre nuage, et ils se tinrent au service de l’Autoengendré angélique. Et [l’Autoengendré] dit : “Qu’[un royaume] vienne à l’existence”, et il vint à l’existence [comme il l’avait dit]. Puis il [créa] le premier luminaire pour qu’il règne sur ce royaume. Il dit : “Que des anges viennent à l’existence pour [le] servir”, et des [myriades] innombrables vinrent à l’existence. Il dit encore : “[Qu’un] royaume lumineux vienne à l’existence”, et il vint à l’existence. Il créa le deuxième luminaire pour qu’il règne sur ce royaume, avec des myriades innombrables d’anges chargés de le servir. C’est ainsi qu’il créa les autres royaumes de lumière. Il leur donna des chefs et créa pour eux des myriades innombrables d’anges chargés de
    les assister.


    « Adamas se trouvait dans le premier nuage de lumière, qu’aucun ange n’avait jamais pu voir parmi tous ceux qu’on appelle “Dieu”. Et [Adamas engendra Seth en] ce [lieu, selon l’]image [de…] et à la ressemblance de [cet] ange. Il fit apparaître l’incorruptible [génération] de Seth devant les douze [luminaires] androgynes. [Puis] il fit apparaître soixante-douze luminaires au sein de la génération incorruptible, conformément à la volonté de l’Esprit. Ensuite, les soixante-douze luminaires eux-mêmes firent apparaître trois cent soixante luminaires au sein de la génération incorruptible, conformément à la volonté de l’Esprit, afin qu’il y en ait cinq pour chacun. Les douze royaumes des douze luminaires constituent leur père. Chaque royaume possède six cieux : il y a donc soixante-douze cieux pour les soixante-douze luminaires et, pour chacun [d’eux, cinq] firmaments, [soit au total] trois cent soixante [firmaments. Ils] reçurent autorité ainsi qu’une [grande] armée d’anges innombrables,
    pour l’honneur et le service. Ils reçurent aussi des esprits vierges [pour] honorer et [servir] tous les royaumes, les cieux et leurs firmaments.


    « Or, l’ensemble de ces immortels est appelé “cosmos” — c’est-à-dire “périssable”[b] — par le Père et les soixante-douze luminaires, avec l’Autoengendré et ses soixante-douze royaumes. C’est là que le premier être humain apparut avec ses puissances incorruptibles. Dans le royaume apparu avec sa génération se trouvent le nuage de la connaissance et l’ange appelé [Éléleth…] Après cela, [Éléleth] dit : “Que douze anges viennent à l’existence [pour] régner sur le Chaos et [l’Hadès].” Et voici que, du nuage, apparut un [ange] dont le visage étincelait de [feu] et dont l’apparence était [souillée] de sang. Son nom était Nébro, ce qui signifie “Rebelle”. D’autres l’appellent Yaldabaoth. Un autre ange, Saklas, sortit lui aussi du nuage. Nébro créa donc six anges — et Saklas [en fit autant] — pour qu’ils soient leurs assistants. Ils firent apparaître douze anges dans les cieux, et chacun d’eux reçut une part dans les cieux.


    « Les douze chefs dirent aux douze anges : “Que chacun de vous […] et qu’ils […] génération [… cinq] anges :


    « Le premier [est Yaoth], appelé “le Bon”.


    « Le deuxième est Harmathoth, [l’œil de feu].


    « Le [troisième] est Galila.


    « Le quatrième [est] Yobel.


    « Le cinquième est Adonaios.


    « Ce sont les cinq qui ont régné sur l’Hadès et qui sont les premiers au-dessus du Chaos.


    « Alors Saklas dit à ses anges : “Créons un être humain selon la ressemblance et l’image.” Ils façonnèrent Adam et sa femme Ève, qui, dans le nuage, est appelée “Vie”. En effet, c’est sous ce nom que toutes les générations le cherchent, et chacune d’elles l’appelle, elle, de leurs noms. Or Saklas ne [commanda pas…] d’enfanter, sauf […] parmi les générations […] que ceci […] et l’[ange] lui dit : “Ta vie durera un temps limité, de même que celle de tes enfants.” »


    Judas demanda alors à Jésus : « [Combien] de temps une personne peut-elle vivre ? »


    Jésus répondit : « Pourquoi t’étonnes-tu que la durée de vie d’Adam et de sa génération soit limitée dans le lieu où il a reçu son royaume, avec celui qui le gouverne ? »


    Judas demanda à Jésus : « L’esprit humain meurt-il ? »


    Jésus répondit : « Voici ce qu’il en est. Dieu a ordonné à Michel de prêter des esprits aux êtres humains afin qu’ils servent. Puis le Grand a ordonné à Gabriel de donner des esprits à la grande génération qui n’a pas de roi — l’esprit avec l’âme. Ainsi, les [autres] âmes […] lumière [… le] Chaos […] cherchez [l’]esprit qui est en vous et que vous avez fait vivre dans cette chair issue des générations angéliques. Ensuite, Dieu fit apporter la connaissance à Adam et à ceux qui étaient avec lui, afin que les rois du Chaos et de l’Hadès ne règnent pas sur eux. »


    [Alors] Judas demanda à Jésus : « Que feront donc ces générations ? »


    Jésus répondit : « En vérité, je te le dis, les étoiles accomplissent toutes ces choses. Quand Saklas arrivera au terme du temps qui lui a été fixé, leur première étoile apparaîtra avec les générations, et elles achèveront ce qui a été annoncé. Alors elles se livreront à la débauche en mon nom, tueront leurs enfants et [elles…] le mal et […] les royaumes, amenant les générations et les présentant à Saklas. [Et] après cela, […] amènera les douze tribus d’[Israël] depuis […], et toutes les [générations] serviront Saklas, péchant en mon nom. Quant à ton étoile, elle [régnera] sur le treizième royaume. » Puis Jésus [rit].


    [Judas] demanda : « Maître, pourquoi [ris-tu de moi ? »


    Jésus] répondit : « Je ne ris pas [de toi, mais] de l’égarement des étoiles. Car ces six étoiles s’égarent avec ces cinq guerriers, et toutes seront détruites avec ce qu’elles ont créé. »


    Judas demanda alors à Jésus : « Que feront ceux qui ont été baptisés en ton nom ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Autoengendré » traduit un titre technique désignant ici un grand ange issu du nuage; le terme ne précise pas à lui seul la nature exacte de son origine.
    reason: Prévenir une lecture doctrinale anachronique tout en expliquant un terme français inhabituel.
  - marker: b
    text: L’explication « c’est-à-dire périssable » appartient au texte transmis. Elle ne correspond pas au sens lexical ordinaire du mot grec kosmos, qui signifie notamment « monde » ou « ordre ».
    reason: Signaler que la glose étymologique ou symbolique vient du récit et ne doit pas être prise pour une traduction lexicale standard.
lexical_decisions:
- source_word: realm
  choice: royaume
  rationale: « Royaume » conserve la dimension cosmologique et hiérarchique du témoin, tout en restant naturel en français; « domaine » aurait affaibli cette nuance.
- source_word: Self-Begotten
  choice: Autoengendré
  rationale: Terme technique conservé sous une forme française transparente, sans l’assimiler à une catégorie théologique ultérieure.
- source_word: luminary
  choice: luminaire
  rationale: Le terme français garde ici le statut d’entité céleste personnifiée et la répétition structurante du passage.
- source_word: generation
  choice: génération
  rationale: Le mot peut désigner à la fois une lignée, une catégorie d’êtres et une collectivité; la traduction maintient cette polysémie.
- source_word: spirit / soul
  choice: esprit / âme
  rationale: La distinction lexicale du témoin est maintenue sans harmonisation anthropologique.
- source_word: Chaos / Hades
  choice: Chaos / Hadès
  rationale: Les noms cosmologiques sont conservés et capitalisés conformément à leur fonction de lieux ou puissances dans le récit.
- source_word: to loan spirits
  choice: prêter des esprits
  rationale: La métaphore inhabituelle du prêt est gardée plutôt que normalisée en « donner », car le texte oppose ensuite explicitement les deux verbes.
- source_word: sleep around
  choice: se livrer à la débauche
  rationale: Formulation française actuelle et digne qui exprime la conduite sexuelle désordonnée sans registre familier.
theological_decisions:
- issue: Statut du « grand Esprit invisible » et de l’Autoengendré
  choice: Maintenir les titres et les relations tels que les présente le récit
  alternative: Les harmoniser avec le vocabulaire trinitaire ou christologique canonique
  rationale: Le passage expose sa propre cosmologie; une harmonisation importerait une résolution confessionnelle absente du témoin.
- issue: Différence entre l’esprit prêté aux humains et l’esprit donné à la grande génération
  choice: Conserver l’opposition « prêter » / « donner » et « esprit » / « âme »
  alternative: Uniformiser en une seule doctrine de l’âme humaine
  rationale: Cette tension paraît intentionnelle et doit rester visible malgré l’état fragmentaire du passage.
- issue: Référents pronominaux autour d’Ève appelée « Vie »
  choice: Conserver l’alternance troublante « le » / « elle »
  alternative: Corriger tous les pronoms pour les rapporter sans ambiguïté à Ève
  rationale: Le témoin anglais fourni présente une discordance possiblement liée au texte endommagé ou à la transmission; la résoudre silencieusement serait conjectural.
- issue: Les actes commis « en mon nom »
  choice: Traduire littéralement sans préciser l’identité des groupes visés
  alternative: Identifier explicitement une communauté ou une pratique historique
  rationale: Le texte ne donne pas ici une identification univoque, et aucune lecture confessionnelle ne doit être ajoutée.
- issue: Rôle de l’étoile de Judas dans le treizième royaume
  choice: Conserver « régnera » entre crochets
  alternative: Interpréter ce rôle comme salut, condamnation ou suprématie spirituelle
  rationale: Le manuscrit est lacunaire et le contexte garde une tension; la traduction ne tranche pas la portée théologique.
