  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: fr
  text: 'Voici le message secret du jugement dont Jésus s’est entretenu avec Judas Iscariote pendant huit jours, trois jours avant de célébrer la Pâque.


    Lorsqu’il parut sur la terre, il accomplit des signes et de grands prodiges pour le salut de l’humanité. Certains [marchaient][a] dans la voie de la justice, tandis que d’autres marchaient dans leur transgression ; c’est pourquoi les douze disciples furent appelés. Il commença à leur parler des mystères qui sont au-delà du monde et de ce qui arriverait à la fin. Souvent, il ne se révélait pas à ses disciples, mais on le trouvait parmi eux sous l’apparence d’un enfant.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot entre crochets restitue un texte manuscrit manquant ou incertain.
    reason: Le témoin fourni signale « walked » comme une restitution éditoriale.
  - marker: b
    text: 'L’expression peut aussi se traduire plus littéralement : « on le trouvait parmi eux comme un enfant ».'
    reason: La formulation demeure ambiguë quant à la nature de cette apparition.
lexical_decisions:
- source_word: secret message of judgment
  choice: message secret du jugement
  rationale: Conserve la relation potentiellement ambiguë entre le message, son caractère secret et le jugement, sans préciser s’il s’agit d’un récit, d’une parole ou d’une sentence.
- source_word: spoke with
  choice: s’est entretenu avec
  rationale: Exprime un échange suivi avec Judas plutôt qu’une simple déclaration unilatérale.
- source_word: Passover
  choice: la Pâque
  rationale: Terme français usuel pour la fête juive dans un contexte ancien.
- source_word: salvation of humanity
  choice: salut de l’humanité
  rationale: Rendu direct qui conserve la portée universelle de la formule.
- source_word: way of righteousness
  choice: voie de la justice
  rationale: Préserve le sens éthique et religieux de « righteousness » sans imposer une interprétation confessionnelle plus précise.
- source_word: mysteries beyond the world
  choice: mystères qui sont au-delà du monde
  rationale: Maintient la spatialité ou transcendance ambiguë de l’expression au lieu de la réduire à des réalités simplement inconnues.
- source_word: in their midst as a child
  choice: parmi eux sous l’apparence d’un enfant
  rationale: Formulation française naturelle qui indique la manière dont il était trouvé sans trancher la nature exacte de cette manifestation.
theological_decisions:
- issue: Nature du « jugement » dans le titre
  choice: du jugement
  alternative: concernant le jugement
  rationale: Le génitif est conservé afin de ne pas décider si le message porte sur le jugement ou constitue lui-même un jugement.
- issue: Lien logique avec l’appel des Douze
  choice: c’est pourquoi les douze disciples furent appelés
  alternative: alors les douze disciples furent appelés
  rationale: Suit le lien causal apparent du témoin anglais, tout en évitant d’expliquer théologiquement pourquoi la diversité des conduites entraîne cet appel.
- issue: Manifestation de Jésus comme enfant
  choice: sous l’apparence d’un enfant
  alternative: comme un enfant
  rationale: Évite d’affirmer une transformation ontologique, tout en conservant l’étrangeté christologique de la scène.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction reste provisoire, car elle repose sur le témoin anglais public fourni ; une vérification directe du copte du Codex Tchacos reste nécessaire. Les crochets sont maintenus pour signaler la restitution manuscrite.
