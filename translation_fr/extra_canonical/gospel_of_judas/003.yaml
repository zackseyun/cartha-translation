  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: fr
  text: 'Le lendemain matin, il apparut à ses disciples. [Et] ils lui dirent : « Maître, où es-[tu] allé et qu’as-tu fait après nous avoir quittés ? »


    Jésus leur répondit : « Je suis allé auprès d’une autre génération, grande et sainte. »


    Ses disciples lui dirent : « Seigneur, quelle est donc cette grande génération, meilleure et plus sainte que nous, qui ne se trouve pas dans ces domaines ? »


    Quand Jésus entendit cela, il rit. Il leur dit : « Pourquoi vous interrogez-vous dans votre cœur au sujet de la génération forte et sainte ? En vérité, je vous le dis, personne né [de] ce domaine ne verra cette [génération]. Aucune armée d’anges venus des étoiles ne régnera sur elle, et aucun être humain né mortel ne pourra se joindre à elle, car cette génération ne vient pas de […] qui est devenu […] la génération des gens parmi [eux] vient de la génération du grand peuple […] les autorités puissantes qui […] ni les puissances […] celles par lesquelles vous régnez. »


    En entendant ces paroles, chacun des disciples fut troublé dans son esprit. Ils ne purent rien dire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: generation
  choice: génération
  rationale: Conserve le terme récurrent et sa portée collective sans préciser s’il désigne une lignée, un groupe ou un ordre spirituel.
- source_word: realms
  choice: domaines
  rationale: Terme assez large pour préserver l’ambiguïté cosmologique du témoin anglais, sans imposer « mondes » ni « royaumes ».
- source_word: strong and holy generation
  choice: la génération forte et sainte
  rationale: Rendu formel qui maintient les deux qualificatifs et leur tension dans ce contexte.
- source_word: mortal birth
  choice: né mortel
  rationale: Formulation naturelle qui garde l’accent sur la condition mortelle acquise dès la naissance.
- source_word: powerful authorities / powers
  choice: les autorités puissantes / les puissances
  rationale: Distingue les deux expressions du témoin malgré leur proximité sémantique.
theological_decisions:
- issue: Nature de la « génération » sainte
  choice: Maintenir « génération » sans explication interprétative
  alternative: « race », « lignée » ou « communauté »
  rationale: Le passage ne permet pas de trancher avec certitude entre une lignée, un groupe humain et une catégorie céleste.
- issue: Portée cosmologique de « ces domaines »
  choice: Employer « domaines »
  alternative: « royaumes », « mondes » ou « sphères »
  rationale: Évite d’introduire une cosmologie plus définie que celle que permet le témoin fourni.
- issue: Relation entre les anges des étoiles et la génération sainte
  choice: « ne régnera sur elle »
  alternative: « ne la dominera »
  rationale: Préserve l’énoncé de souveraineté sans expliquer l’identité ou le statut théologique de ces anges.
- issue: Passage lacunaire
  choice: Conserver la syntaxe fragmentaire et les ellipses
  alternative: Reconstruire un sens continu
  rationale: Les lacunes empêchent toute restitution sûre ; les lisser créerait artificiellement une doctrine cohérente.
translation_notes:
  register: Français international moderne, digne et lisible. Les crochets et les ellipses sont conservés exactement comme signaux de restitution ou de lacunes manuscrites. Projet provisoire fondé sur le témoin anglais public fourni ; la vérification directe du copte reste à effectuer.
