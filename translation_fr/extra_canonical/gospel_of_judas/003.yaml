review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le témoin anglais fourni, y compris les crochets de restitution et les lacunes. Deux ajouts ou déplacements de sens méritent correction : « auprès de » suggère une proximité absente de « went to », et « après nous avoir quittés » transforme la question temporelle « when you left us » en relation de postériorité.'
  naturalness: 'Le français est généralement clair et d’un registre approprié. « es-[tu] allé » est toutefois mal formé : le pronom restitué doit précéder l’auxiliaire. « dans votre cœur » doit être mis au pluriel, conformément au pluriel de l’adresse et à l’expression française usuelle.'
  terminology: « génération », « domaines », « forte et sainte », « autorités puissantes » et « puissances » préservent utilement les répétitions et l’ambiguïté cosmologique du témoin. « personne de naissance mortelle » rend plus naturellement « person of mortal birth » sans modifier sa portée.
  issues:
  - severity: medium
    issue: « auprès d’une autre génération »
    rationale: « Auprès de » introduit l’idée d’être en présence ou à proximité. Le témoin dit seulement que Jésus est allé « to another ... generation ». « Vers une autre génération » évite cet ajout.
  - severity: medium
    issue: « après nous avoir quittés »
    rationale: « After » n’est pas présent dans la question source, qui demande ce qu’il a fait « when » il les a quittés. « Quand tu nous as quittés » conserve le repère temporel sans implication supplémentaire.
  - severity: low
    issue: Placement du pronom entre crochets dans « où es-[tu] allé »
    rationale: Cette graphie est syntaxiquement incorrecte en français. « Où [es-tu] allé » conserve le signal de restitution tout en respectant l’inversion interrogative.
  - severity: low
    issue: « dans votre cœur »
    rationale: Le témoin s’adresse aux disciples au pluriel (« your hearts »). « Dans vos cœurs » est fidèle et idiomatique.
