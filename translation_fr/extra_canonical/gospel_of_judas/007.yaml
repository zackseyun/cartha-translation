translation:
  language: fr
  text: 'Jésus dit[a] : « En vérité, je [vous] le dis, ce baptême [qu’ils ont reçu au] nom qui est le mien […] détruira toute la génération de l’Adam terrestre. Demain, ils tortureront celui qui me porte. En vérité, je [vous le dis], aucune main d’un être humain mortel [ne s’abattra] sur moi. En vérité, [je te le dis], Judas, ceux qui offrent des sacrifices à Saklas[b] […] tout ce qui est mauvais. Mais toi, tu feras plus qu’eux tous, car tu sacrifieras l’être humain qui me porte. Ta corne s’est déjà élevée, ta colère s’est embrasée, ton étoile s’est levée et ton cœur s’est [égaré]. En vérité, [je te le dis], ton dernier [… et] le [… les trônes] du royaume ont [été vaincus], les rois se sont affaiblis, les générations angéliques se sont affligées, le mal [qu’ils ont semé…] est détruit, [et] le [dirigeant] est anéanti. [Et] alors, le [fruit] de la grande génération d’Adam sera élevé, car cette génération issue des royaumes existe avant le ciel, la terre et les anges. Regarde, tout t’a été
    dit. Lève les yeux et vois le nuage qui renferme la lumière, avec les étoiles autour de lui. Et l’étoile qui ouvre la voie est ton étoile. »


    Alors Judas leva les yeux et vit le nuage lumineux, puis il y entra. Ceux qui se tenaient sur le sol entendirent une voix venant du nuage, qui disait : « [… la] grande [génération…] et […]. » Et Judas ne vit plus Jésus.


    Aussitôt, il y eut parmi [les] Juifs une agitation plus grande que […] Leurs grands prêtres murmuraient parce qu’il était entré dans la chambre d’amis pour prier. Mais quelques spécialistes des Écritures étaient là et le surveillaient attentivement afin de pouvoir l’arrêter pendant sa prière. En effet, ils avaient peur du peuple, car tous le considéraient comme un prophète.


    Ils s’approchèrent de Judas et lui dirent : « Que fais-tu ici ? N’es-tu pas le disciple de Jésus ? »


    Il leur répondit alors comme ils le souhaitaient. Puis Judas reçut de l’argent et le leur livra.


    L’Évangile de Judas'
