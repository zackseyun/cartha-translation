lexical_decisions:
- source_word: the one who bears me / the human who bears me
  choice: celui qui me porte / l’être humain qui me porte
  rationale: Préserve la formulation anthropologique inhabituelle et sa tension théologique sans la réduire à « mon corps » ni l’expliquer.
- source_word: earthly Adam
  choice: l’Adam terrestre
  rationale: Rend explicitement le contraste cosmologique du témoin tout en conservant Adam comme nom propre.
- source_word: horn
  choice: corne
  rationale: Conserve l’image symbolique du témoin, plutôt que de l’interpréter comme force, pouvoir ou dignité.
- source_word: realm(s)
  choice: royaume / royaumes
  rationale: Choix français courant qui maintient la portée cosmologique sans imposer un système technique absent du témoin fourni.
- source_word: scribes
  choice: spécialistes des Écritures
  rationale: Expression moderne et intelligible pour le rôle savant et religieux, sans l’assimiler à de simples copistes.
- source_word: handed him over
  choice: le leur livra
  rationale: Maintient le sens de remise ou de trahison et le pronom masculin du témoin, sans ajouter de détail narratif.
theological_decisions:
- issue: Relation entre Jésus et « celui qui me porte »
  choice: Conserver littéralement la distinction exprimée
  alternative: Traduire par « mon corps » ou identifier explicitement le porteur à Jésus
  rationale: Le passage formule une distinction théologiquement chargée; la traduction ne doit ni l’effacer ni en fixer l’interprétation.
- issue: Portée du geste de Judas
  choice: « tu sacrifieras l’être humain qui me porte »
  alternative: « tu me sacrifieras » ou « tu livreras mon corps »
  rationale: Le choix garde le paradoxe et l’ambiguïté propres au texte sans harmonisation avec les évangiles canoniques.
- issue: Antériorité de la grande génération
  choice: « existe avant le ciel, la terre et les anges »
  alternative: Comprendre « devant » dans un sens spatial ou honorifique
  rationale: Le témoin anglais indique une antériorité; la formulation française la restitue sans développer davantage la cosmologie.
- issue: Jugement porté sur Judas
  choice: Ne pas expliciter si ses actes sont loués, condamnés ou les deux
  alternative: Présenter Judas comme héros libérateur ou comme traître uniquement mauvais
  rationale: Le passage juxtapose exaltation, colère, égarement et sacrifice; cette tension doit rester ouverte.
translation_notes:
  register: Français international contemporain, digne et lisible. La syntaxe a été fluidifiée là où le témoin est suivi, mais les ruptures dues aux lacunes, les répétitions solennelles (« En vérité ») et les images cosmologiques ont été conservées. Le draft demeure nécessairement provisoire en l’absence de révision directe du copte.
