translation:
  language: fr
  text: 'Un autre jour, Jésus vint vers eux. Ils lui dirent : « Maître, nous t’avons vu en rêve, car nous avons eu de grands [rêves la nuit dernière]. »


    Mais Jésus dit : « Pourquoi […] vous êtes-vous cachés ? »


    Et ils [dirent : « Nous avons vu] une grande [maison, avec un grand] autel [à l’intérieur, et] douze hommes — nous dirions que c’étaient des prêtres — ainsi qu’un nom. Une foule attendait devant l’autel [jusqu’à ce que] les prêtres [aient fini de recevoir] les offrandes. Nous aussi, nous attendions. »


    [Jésus dit] : « À quoi ressemblaient-ils ? »


    Ils répondirent : « [Certains] jeûnent [pendant] deux semaines. D’autres sacrifient leurs propres enfants ; d’autres, leurs femmes, tout en se louant et en s’humiliant les uns les autres. D’autres couchent avec des hommes ; d’autres commettent des meurtres ; d’autres encore commettent beaucoup de péchés et se livrent à des actes criminels. [Et] les gens qui se tiennent [devant] l’autel invoquent ton [nom] ! Par tous leurs sacrifices, ils remplissent l’[autel] de leurs offrandes. » Après avoir dit cela, [ils] gardèrent le silence, car ils étaient troublés.


    Jésus leur dit : « Pourquoi êtes-vous troublés ? Vraiment, je vous le dis, tous les prêtres qui se tiennent devant cet autel invoquent mon nom. Et [encore] une fois, je vous le dis, mon nom a été inscrit par les générations humaines sur cette [maison] des générations des étoiles.[a] [Et ils] ont honteusement planté en mon nom des arbres qui ne portent aucun fruit. » Jésus leur dit : « C’est vous qui recevez les offrandes sur l’autel que vous avez vu. Voilà le Dieu que vous servez, et vous êtes les douze hommes que vous avez vus. Les animaux que vous avez vus conduire au sacrifice sont la foule que vous égarez devant cet autel. [Votre ministre] se lèvera et se servira ainsi de mon nom, et [les] générations des personnes pieuses lui resteront fidèles. Après lui, un autre présentera [ceux qui se livrent à l’inconduite sexuelle], un autre ceux qui tuent des enfants, un autre ceux qui couchent avec des hommes, ainsi que ceux qui jeûnent, et tout le reste : impureté, crime et égarement. Quant
    à ceux qui disent : “Nous sommes égaux aux anges”, ce sont les étoiles qui mènent tout à son terme.[b] Il a été dit aux générations humaines : “Voyez, Dieu a accepté votre sacrifice des mains des prêtres”, c’est-à-dire du ministre de l’égarement. Mais le Seigneur qui commande est le Seigneur de tout. Au dernier jour, ils seront reconnus coupables. »


    Jésus [leur] dit : « Cessez [de sacrifier des animaux]. Vous les avez [offerts] au-dessus de l’autel, au-dessus de vos étoiles avec vos anges, là où ils ont déjà été menés à leur terme.[c] Qu’ils deviennent donc […] avec vous et qu’ils [deviennent] manifestes. »


    Ses disciples [lui dirent] : « Purifie-nous de nos [péchés], que nous avons commis à cause de la tromperie des anges. »


    Jésus leur dit : « Ce n’est pas possible […]. Une source ne [peut] pas davantage éteindre le feu de toute la terre habitée. Le puits d’une [ville] ne peut pas non plus satisfaire toutes les générations, sauf la grande génération stable.[d] Une seule lampe n’éclairera pas tous les royaumes, sauf la deuxième génération, et un boulanger ne peut pas nourrir toute la création sous le [ciel]. »


    Et [lorsque les disciples entendirent] ces [paroles], ils lui dirent : « Maître, aide-nous et sauve-nous ! »


    Jésus leur dit : « Cessez de lutter contre moi. Chacun de vous a sa propre étoile, [et …] des étoiles […] ce qui lui appartient […] Je n’ai pas été envoyé vers la génération corruptible, mais vers la génération forte et incorruptible, car aucun ennemi n’a dominé [sur] cette génération, ni aucune des étoiles. Vraiment, je vous le dis, la colonne de feu tombera bientôt, et cette génération ne sera pas ébranlée par les étoiles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La syntaxe de cette phrase est difficile et le manuscrit est endommagé. Le rapport exact entre la maison, les générations des étoiles et les générations humaines reste incertain.
    reason: Signaler une ambiguïté textuelle et syntaxique qui ne doit pas être résolue silencieusement.
  - marker: b
    text: « Mènent tout à son terme » peut aussi évoquer le fait d’achever ou de consommer toutes choses ; le sens précis du motif demeure incertain.
    reason: Préserver l’ambiguïté du verbe traduit par « finish » dans le témoin anglais.
  - marker: c
    text: Le passage est lacunaire et ses pronoms ont des référents incertains ; « ils » peut renvoyer aux animaux, aux anges, aux astres ou à un autre élément perdu.
    reason: Éviter de donner une fausse clarté à un texte gravement endommagé.
  - marker: d
    text: La construction peut laisser entendre que seule « la grande génération stable » peut satisfaire toutes les générations, mais le sens exact est incertain.
    reason: Rendre visible une difficulté logique et grammaticale du témoin.
lexical_decisions:
- source_word: Master
  choice: Maître
  rationale: Terme français naturel et digne pour l’adresse au personnage enseignant, sans préciser davantage un titre que le témoin ne précise pas.
- source_word: house
  choice: maison
  rationale: Conserve le sens concret et l’ambiguïté symbolique de l’édifice, plutôt que d’imposer « temple ».
- source_word: minister
  choice: ministre
  rationale: Maintient l’ambiguïté fonctionnelle du terme fourni ; « officiant » ou « serviteur » orienteraient davantage l’interprétation.
- source_word: generations
  choice: générations
  rationale: Préserve le vocabulaire cosmologique récurrent du passage, même lorsque « race » ou « lignée » pourrait sembler plus idiomatique.
- source_word: inhabited world
  choice: terre habitée
  rationale: Rend l’idée d’un monde humain habité sans la confondre simplement avec la planète ou toute la création.
- source_word: realms
  choice: royaumes
  rationale: Choix lisible qui conserve la portée cosmologique plurielle sans ajouter une hiérarchie absente du témoin.
- source_word: stable
  choice: stable
  rationale: Reproduction volontaire du qualificatif inhabituel, dont la portée cosmologique demeure incertaine.
- source_word: finish / completed
  choice: mener à son terme / être mené à son terme
  rationale: Préserve le motif verbal de l’accomplissement sans décider s’il s’agit d’achever, de détruire ou de fixer un destin.
- source_word: corruptible / incorruptible
  choice: corruptible / incorruptible
  rationale: Maintient l’opposition théologique et cosmologique explicite du témoin.
theological_decisions:
- issue: Identité du « Dieu » servi par les disciples
  choice: « Voilà le Dieu que vous servez »
  alternative: « Voilà votre dieu »
  rationale: La formulation conserve l’affirmation dérangeante et son référent ambigu sans la réduire à une simple idole par une minuscule interprétative.
- issue: Fonction des étoiles et des anges
  choice: Conserver le langage cosmologique littéral
  alternative: Paraphraser comme des puissances spirituelles ou des destins
  rationale: Le passage ne permet pas de déterminer avec certitude si étoiles et anges sont des êtres, des puissances, des marqueurs de destin ou plusieurs de ces réalités à la fois.
- issue: « génération » comme groupe sotériologique
  choice: Répéter « génération »
  alternative: Employer « race », « peuple » ou « lignée »
  rationale: Ce choix garde la tension entre générations humaines, génération corruptible et génération incorruptible, sans importer une anthropologie doctrinale.
- issue: Sacrifices décrits dans la vision
  choice: Les présenter comme accusations internes à la vision
  alternative: Les généraliser à une tradition religieuse historique déterminée
  rationale: Le texte français n’identifie aucune communauté postérieure et ne doit pas importer une polémique confessionnelle extérieure.
- issue: La « deuxième génération »
  choice: Conserver l’expression sans explication doctrinale
  alternative: L’identifier à un groupe céleste précis
  rationale: Le contexte transmis est insuffisant pour fixer son identité.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les crochets et les points de suspension sont conservés pour signaler les restitutions et les lacunes du manuscrit. La traduction reste provisoire, car elle repose sur le témoin anglais public fourni et non sur une collation directe du copte du Codex Tchacos 3. Les répétitions de « génération », « étoile », « autel » et « nom » sont intentionnelles afin de préserver la cohérence lexicale et la tension cosmologique du passage.
