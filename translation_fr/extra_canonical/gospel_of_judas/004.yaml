review_pass:
  verdict: revise
  source_fidelity: 'Révision fondée sur le témoin anglais public fourni, le contrôle direct du copte restant signalé comme en attente. La traduction conserve les crochets, les lacunes et les ambiguïtés cosmologiques du témoin. Deux corrections sûres améliorent la fidélité : « twelve people » ne précise pas qu’il s’agit d’hommes, et « praising and humbling themselves among each other » ne décrit pas nécessairement une action exercée les uns sur les autres.'
  naturalness: Le français est globalement naturel, soutenu et lisible. « Dans tous leurs sacrifices » rend plus directement la valeur de « in all their sacrificing » que « Par tous leurs sacrifices ».
  terminology: « Maître », « maison », « ministre », « générations », « terre habitée », « corruptible/incorruptible » et le vocabulaire cosmologique sont cohérents. « Personnes » préserve l’absence de précision de genre du témoin, y compris dans l’identification des douze figures.
  issues:
  - severity: medium
    issue: « douze hommes » traduit « twelve people »
    rationale: Le témoin ne spécifie pas le sexe des douze figures. « Douze personnes » conserve cette indétermination, tant dans la vision que dans l’interprétation donnée par Jésus.
  - severity: low
    issue: « se louant et en s’humiliant les uns les autres »
    rationale: Cette formulation suggère que les personnes louent et humilient autrui. Le témoin décrit plus prudemment des personnes qui se louent/se glorifient et s’humilient « among each other ». « Entre eux » préserve l’ambiguïté relationnelle.
  - severity: low
    issue: « Par tous leurs sacrifices »
    rationale: « In all their sacrificing » vise le cadre ou le cours de leur activité sacrificielle ; « Dans tous leurs sacrifices » est plus proche et plus idiomatique.
