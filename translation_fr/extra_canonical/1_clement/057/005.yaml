  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: fr
  text: 'Car voici ce qui arrivera : quand vous m’invoquerez, moi, je ne vous écouterai pas ; les méchants me chercheront, mais ils ne me trouveront pas. En effet, ils ont détesté la sagesse et n’ont pas choisi la crainte du Seigneur ; ils n’ont pas non plus voulu prêter attention à mes conseils, mais ils se sont moqués de mes réprimandes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ
  choice: vous m’invoquerez
  rationale: Le verbe signifie appeler à soi ou invoquer ; « invoquer » convient au contexte d’un appel adressé à la sagesse personnifiée.
- source_word: οὐκ εἰσακούσομαι
  choice: je ne vous écouterai pas
  rationale: Εἰσακούω implique entendre favorablement ou répondre à un appel ; cette formulation naturelle conserve ici l’idée de refus.
- source_word: κακοὶ
  choice: des gens mauvais
  rationale: L’adjectif substantivé désigne des personnes mauvaises ; cette formulation inclusive et courante évite le masculin générique marqué de « les méchants ».
- source_word: φόβον τοῦ κυρίου
  choice: la crainte du Seigneur
  rationale: Expression religieuse consacrée qui préserve le sens de respect révérenciel sans le réduire à la simple peur.
- source_word: βουλαῖς
  choice: conseils
  rationale: Le terme désigne des avis ou directives délibérées ; « conseils » est clair et fidèle au pluriel.
- source_word: ἐλέγχους
  choice: avertissements
  rationale: Le mot peut désigner des réprimandes, corrections ou réfutations. « Avertissements » reste naturel dans la bouche de la sagesse, tout en conservant la portée corrective.
theological_decisions:
- issue: Identité de la personne qui parle à la première personne
  choice: Conserver la première personne sans identifier explicitement le locuteur
  alternative: Ajouter « la Sagesse » comme sujet explicite
  rationale: Le fragment reprend un discours de la sagesse personnifiée, mais le grec fourni ne la nomme pas dans ce verset ; l’expliciter résoudrait une donnée contextuelle que le texte laisse implicite.
- issue: Sens de « la crainte du Seigneur »
  choice: Maintenir l’expression traditionnelle sans paraphrase interprétative
  alternative: « le respect du Seigneur »
  rationale: « Crainte » conserve la tension biblique entre révérence, soumission et peur du jugement, sans réduire le champ théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure argumentative et les contrastes du grec sont conservés, avec une ponctuation fluide. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
