  source_fidelity: 'Le texte rend fidèlement la structure exhortative et les principaux termes grecs : la responsabilité d’avoir provoqué la στάσις, la soumission aux πρεσβύτεροι, l’impératif passif παιδεύθητε orienté vers la μετάνοια, et la métaphore finale des « genoux du cœur ». « À l’origine de » est une équivalence naturelle de l’image « poser le fondement ».'
