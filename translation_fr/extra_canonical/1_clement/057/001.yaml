id: 1CLEM.57.1
reference: 1 Clement 57:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
translation:
  language: fr
  text: Vous donc qui avez été à l’origine de la révolte[a], soumettez-vous aux anciens et laissez-vous corriger en vue de la repentance, en fléchissant les genoux de votre cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dissension factieuse » ou « sédition ».
    reason: στάσις peut désigner une révolte, une faction ou une grave discorde civile ou communautaire.
lexical_decisions:
- source_word: καταβολὴν ... ποιήσαντες
  choice: avez été à l’origine de
  rationale: L’expression signifie littéralement « ayant posé le fondement de ». En français courant, « être à l’origine de » restitue naturellement l’idée d’avoir déclenché ou établi la cause du conflit.
- source_word: στάσεως
  choice: révolte
  rationale: Dans ce contexte communautaire, στάσις désigne une opposition factieuse et illégitime à l’ordre établi. « Révolte » en garde la force négative sans imposer le sens plus spécifiquement politique de « sédition ».
- source_word: πρεσβυτέροις
  choice: anciens
  rationale: Terme habituel pour les responsables de la communauté, tout en conservant la portée ecclésiale possible du grec.
- source_word: παιδεύθητε
  choice: laissez-vous corriger
  rationale: L’impératif passif évoque une discipline formatrice et corrective. Cette formulation conserve le passif et reste naturelle en français.
- source_word: εἰς μετάνοιαν
  choice: en vue de la repentance
  rationale: La préposition εἰς exprime ici l’orientation ou le but de la correction. « Repentance » rend le changement intérieur et moral demandé.
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν
  choice: en fléchissant les genoux de votre cœur
  rationale: Conservation de la métaphore vive du grec, qui exprime l’humilité et la soumission intérieures.
theological_decisions:
- issue: Nature de la discipline conduisant à la repentance
  choice: « laissez-vous corriger en vue de la repentance »
  alternative: « recevez une discipline qui vous mène à la repentance »
  rationale: Le choix préserve l’impératif passif et le lien final exprimé par εἰς, sans préciser indûment l’agent ni définir un mécanisme pénitentiel particulier.
- issue: Statut des πρεσβύτεροι
  choice: « anciens »
  alternative: « presbytres »
  rationale: « Anciens » conserve l’ambiguïté entre l’âge, l’autorité reconnue et une fonction ecclésiale, sans importer une terminologie confessionnelle plus tardive.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore des « genoux du cœur » est maintenue en raison de sa force rhétorique et de sa clarté contextuelle.
