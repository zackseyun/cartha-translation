revisions:
- from: Apprenez à vous soumettre, en renonçant à l’arrogance orgueilleuse de votre langue. Car il vaut mieux pour vous être trouvés petits, mais comptés parmi le troupeau du Christ[a], que de paraître supérieurs et d’être rejetés hors de l’espérance qu’il donne[b].
  to: Apprenez à vous soumettre, en rejetant l’obstination arrogante et orgueilleuse de votre langue. Car il vaut mieux que vous soyez trouvés petits et comptés parmi le troupeau du Christ[a], que d’être rejetés hors de son espérance[b] tout en paraissant éminents.
  rationale: La révision restitue αὐθάδεια par « obstination », sans perdre les nuances d’arrogance et d’orgueil apportées par les adjectifs. Elle retire l’adversatif non exprimé et remplace l’interprétation « qu’il donne » par « son espérance », ce qui maintient l’ambiguïté du génitif grec. Le déplacement de « tout en paraissant éminents » garde clairement la valeur participiale de δοκοῦντας et la comparaison grecque.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:30Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien l’exhortation à la soumission, l’image du troupeau et le contraste entre une position humble à l’intérieur et une prééminence apparente suivie de l’exclusion. Toutefois, « l’arrogance orgueilleuse de votre langue » ne rend pas explicitement αὐθάδεια, qui désigne l’obstination, l’indocilité ou la suffisance; les deux adjectifs grecs qualifient cette attitude. « L’espérance qu’il donne » tranche en outre une relation que le génitif αὐτοῦ laisse condensée.
  naturalness: La révision emploie un français moderne et soutenu. « Il vaut mieux que vous soyez… que d’être… » est plus idiomatique et plus nettement construit que « il vaut mieux pour vous être trouvés ».
  terminology: « Christ » convient à Χριστός dans ce contexte. « Comptés parmi le troupeau » conserve de façon naturelle le sens d’être reconnus/comptés dans le troupeau, tout en laissant en note la possibilité de « estimés ». « Son espérance » préserve l’ambiguïté du grec sans imposer « qu’il donne ».
  issues:
  - severity: medium
    issue: αὐθάδεια est sous-traduit
    rationale: « Arrogance orgueilleuse » reproduit surtout les adjectifs ἀλαζόνα et ὑπερήφανον, mais ne rend pas suffisamment le nom αὐθάδεια, qui comporte l’idée d’obstination ou de suffisance volontaire.
  - severity: medium
    issue: La relation du génitif αὐτοῦ est déterminée dans le texte principal
    rationale: « L’espérance qu’il donne » choisit une interprétation causative qui n’est pas explicitée par ἐλπίδος αὐτοῦ. La formulation « son espérance », accompagnée d’une note, préserve mieux l’ambiguïté.
  - severity: low
    issue: Ajout contrastif de « mais »
    rationale: Le grec coordonne « petits » et « comptés/reconnus » sans particule adversative. L’antithèse générale est déjà portée par la comparaison avec l’expulsion; supprimer « mais » est plus fidèle.
