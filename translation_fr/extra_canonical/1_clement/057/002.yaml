id: 1CLEM.57.2
reference: 1 Clement 57:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
translation:
  language: fr
  text: Apprenez à vous soumettre, en rejetant l’obstination arrogante et orgueilleuse de votre langue. Car il vaut mieux que vous soyez trouvés petits et comptés parmi le troupeau du Christ[a], que d’être rejetés hors de son espérance[b] tout en paraissant éminents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « petits et estimés au sein du troupeau du Christ ». Le mot grec peut signifier « comptés, reconnus » ou « estimés ».'
    reason: Préserver l’ambiguïté de ἐλλογίμους entre appartenance reconnue et estime.
  - marker: b
    text: 'Littéralement : « rejetés hors de son espérance ». On peut aussi comprendre « hors de l’espérance placée en lui » ou « hors de l’espérance qui vient de lui ».'
    reason: Le génitif αὐτοῦ peut exprimer diverses relations sémantiques; le texte principal ne les tranche pas.
lexical_decisions:
- source_word: ὑποτάσσεσθαι
  choice: vous soumettre
  rationale: L’infinitif moyen exprime le fait de se placer sous l’autorité ou l’ordre requis; « vous soumettre » conserve directement cette force.
- source_word: τὴν ἀλαζόνα καὶ ὑπερήφανον ... αὐθάδειαν
  choice: l’arrogance orgueilleuse
  rationale: αὐθάδεια désigne une attitude présomptueuse et obstinée; les adjectifs ἀλαζών et ὑπερήφανος en accentuent l’arrogance et l’orgueil. Cette formulation française évite l’expression peu naturelle « volonté propre de votre langue ».
- source_word: μικροὺς καὶ ἐλλογίμους
  choice: petits, mais comptés parmi
  rationale: μικρούς signifie « petits, sans importance ». Dans cette antithèse avec l’expulsion, ἐλλογίμους peut signifier « comptés, pris en compte », vraisemblablement comme membres du troupeau. « mais » rend explicite l’opposition naturelle en français sans effacer l’ambiguïté lexicale, signalée en note.
- source_word: καθ’ ὑπεροχὴν δοκοῦντας
  choice: paraître supérieurs
  rationale: La tournure associe l’apparence (δοκοῦντας) à une position d’éminence ou de supériorité (καθ’ ὑπεροχήν), sans affirmer que cette prééminence est réelle.
- source_word: ἐκ τῆς ἐλπίδος αὐτοῦ
  choice: hors de l’espérance qu’il donne
  rationale: Le génitif avec αὐτοῦ est condensé et peut désigner l’espérance attachée au Christ, fondée sur lui ou donnée par lui. La traduction reste idiomatique tout en signalant d’autres lectures possibles en note.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Christ
  alternative: Messie
  rationale: Dans le contexte ecclésial de 1 Clément, Χριστός fonctionne comme le titre ou nom chrétien établi « Christ ». « Messie » introduirait ici une nuance sociolinguistique moins probable.
- issue: Sens de ἐλλογίμους dans l’image du troupeau
  choice: comptés parmi le troupeau
  alternative: estimés au sein du troupeau
  rationale: Le contraste porte vraisemblablement sur le fait d’être reconnu comme appartenant au troupeau plutôt que d’en être rejeté, tout en laissant en note le sens lexical possible « estimés ».
- issue: Relation exprimée par « son espérance »
  choice: l’espérance qu’il donne
  alternative: son espérance / l’espérance placée en lui
  rationale: Le grec ἐκ τῆς ἐλπίδος αὐτοῦ ne précise pas nettement la relation du génitif. Le texte principal adopte une formulation française intelligible, tandis que la note préserve les autres analyses possibles.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’exhortation directe et l’antithèse entre petitesse reconnue dans le troupeau et supériorité seulement apparente suivie du rejet. Les formulations trop littérales mais peu naturelles, telles que « l’arrogante et orgueilleuse obstination de votre langue », ont été évitées.
