source:
  edition: Funk 1901 (normalized OCR)
  text: τοιγαροῦν ἔδονται τῆς ἑαυτῶν ὁδοῦ τοὺς καρποὺς καὶ τῆς ἑαυτῶν ἀσεβείας πλησθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/006.yaml
  text: Therefore they will eat the fruits of their own way and be filled with their own ungodliness.
translation:
  language: fr
  text: Ainsi donc, ils mangeront les fruits de leur propre voie et seront rassasiés de leur propre impiété.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Ainsi donc
  rationale: Rend la conclusion fortement marquée par cette particule composée, dans un français naturel et soutenu.
- source_word: ἔδονται
  choice: ils mangeront
  rationale: Conserve l’image concrète de l’action de manger, plutôt que de l’affaiblir en « subiront ».
- source_word: τῆς ἑαυτῶν ὁδοῦ τοὺς καρπούς
  choice: les fruits de leur propre voie
  rationale: Préserve la métaphore biblique de la voie et de ses fruits ainsi que l’insistance réflexive de ἑαυτῶν.
- source_word: πλησθήσονται
  choice: seront rassasiés
  rationale: Exprime l’idée d’être rempli jusqu’à satiété et maintient le parallélisme alimentaire avec « mangeront ».
- source_word: ἀσεβείας
  choice: impiété
  rationale: Terme français direct pour l’attitude irrévérencieuse ou opposée à Dieu, sans ajouter une qualification doctrinale.
theological_decisions:
- issue: Rapport entre la conduite et ses conséquences
  choice: Conserver les images de manger les fruits de sa voie et d’être rassasié de son impiété
  alternative: Expliciter par « ils subiront les conséquences de leur conduite »
  rationale: Le grec présente le jugement comme la consommation des résultats de sa propre voie; l’image porte une tension morale qu’une paraphrase explicative atténuerait.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme et les métaphores du grec; « voie » est légèrement soutenu mais courant dans le registre biblique.
