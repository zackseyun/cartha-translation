source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
translation:
  language: fr
  text: Car ils seront mis à mort pour avoir fait du tort aux gens simples[a], et l’examen fera périr les impies. Mais celui qui m’écoute demeurera dans l’espérance, plein de confiance, et reposera sans craindre aucun mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi évoquer les personnes naïves ou vulnérables ; certains traduisent : « les innocents ».'
    reason: Le terme νηπίους appartient au vocabulaire sapientiel des personnes simples ou inexpérimentées, mais peut ici être compris sous l’angle de leur vulnérabilité ou de leur innocence.
lexical_decisions:
- source_word: νηπίους
  choice: gens simples
  rationale: Dans le langage sapientiel, le terme désigne surtout des personnes inexpérimentées, naïves ou vulnérables, plutôt que des personnes moralement irréprochables. « Gens simples » conserve cette catégorie sans suggérer nécessairement la sottise.
- source_word: ἐξέτασμος
  choice: l’examen
  rationale: Le nom rare évoque un examen, une enquête ou une mise à l’épreuve. « L’examen » reste proche du grec et préserve son caractère inhabituel.
- source_word: κατασκηνώσει
  choice: demeurera
  rationale: Le verbe signifie littéralement s’établir ou séjourner. « Demeurera » convient au registre solennel sans imposer l’image plus concrète de camper.
- source_word: ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ
  choice: reposera sans crainte, à l’abri de tout mal
  rationale: Cette formulation rend le repos paisible, l’absence de peur et l’éloignement de tout mal, tout en restant naturelle en français.
theological_decisions:
- issue: Sens moral ou sapientiel de νηπίους
  choice: gens simples
  alternative: les innocents
  rationale: Le grec peut évoquer la vulnérabilité, mais dans la tradition sapientielle il désigne typiquement les simples ou inexpérimentés. Une note conserve l’autre compréhension sans faire de l’innocence morale le sens exclusif.
- issue: Rapport entre l’espérance et la confiance dans ἐπ’ ἐλπίδι πεποιθώς
  choice: demeurera dans l’espérance, plein de confiance
  alternative: demeurera, confiant dans son espérance
  rationale: La formulation retenue maintient côte à côte l’espérance et la confiance sans préciser excessivement leur relation syntaxique.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le parallélisme sentencieux de la citation sapientielle, avec une légère explicitation idiomatique dans « plein de confiance » et « à l’abri de tout mal ».
