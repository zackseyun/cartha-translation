  rationale: 'La révision remplace deux calques ou formulations moins exactes par un français moderne et fidèle : πανάρετος devient « pleine de toutes les vertus », et προΐομαι ὑμῖν devient « je ferai jaillir vers vous ». Elle maintient « souffle » pour πνοή, la personnification de la Sagesse et le parallélisme lexical entre ῥῆσις et λόγος, sans résoudre théologiquement une éventuelle résonance du texte.'
