source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτω γὰρ λέγει ἡ πανάρετος σοφία· Ἰδοὺ, προΐομαι ὑμῖν ἐμῆς πνοῆς ῥῆσιν, διδάξω δὲ ὑμᾶς τὸν ἐμὸν λόγον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
translation:
  language: fr
  text: 'Car ainsi parle la Sagesse, pleine de toutes les vertus : « Voici, je ferai jaillir vers vous une parole de mon souffle, et je vous enseignerai ma parole. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανάρετος
  choice: toute vertueuse
  rationale: Rend directement l’idée de totalité exprimée par παν- et celle de vertu portée par ἄρετος, tout en conservant la personnification de la Sagesse.
- source_word: προΐομαι
  choice: je répandrai sur vous
  rationale: Dans cette citation de Proverbes 1.23, le verbe évoque une parole ou un souffle que la Sagesse fait jaillir ou répand vers ses auditeurs; « répandrai sur vous » restitue cette image de façon naturelle.
- source_word: πνοῆς
  choice: souffle
  rationale: « Souffle » conserve l’image concrète de la respiration et l’éventuelle résonance spirituelle du grec sans la préciser artificiellement.
- source_word: ῥῆσιν
  choice: une parole
  rationale: Le terme désigne ici une parole prononcée ou une déclaration; « parole » convient au registre sapientiel français.
- source_word: λόγον
  choice: ma parole
  rationale: « Parole » est le correspondant français naturel de λόγον dans ce contexte et maintient le parallélisme avec ῥῆσιν, malgré une répétition que le grec lui-même approche sémantiquement.
theological_decisions:
- issue: Personnification de la Sagesse
  choice: la Sagesse, toute vertueuse
  alternative: la sagesse parfaitement vertueuse
  rationale: La majuscule et la tournure nominale préservent la personnification explicite dans « ainsi parle », sans identifier davantage la Sagesse à une personne théologique particulière.
- issue: Portée possible de πνοή
  choice: souffle
  alternative: Esprit
  rationale: Le grec signifie d’abord « souffle ». Traduire par « Esprit » trancherait une résonance théologique que le texte ne rend pas explicite.
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde l’allure solennelle d’une citation sapientielle ainsi que l’image du souffle. La proximité lexicale entre ῥῆσις et λόγος est préservée par la répétition de « parole », préférable ici à une distinction française artificielle.
