  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: fr
  text: « Puisque j’ai appelé et que vous n’avez pas écouté, puisque j’ai longuement parlé et que vous n’avez prêté aucune attention, mais que vous avez rendu vains mes conseils et que vous avez désobéi à mes réprimandes, moi aussi, je rirai de votre ruine ; je me réjouirai quand la destruction viendra sur vous, quand un trouble soudain vous atteindra et que la catastrophe s’abattra sur vous comme une tempête, ou quand la détresse et le siège viendront sur vous. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινον λόγους
  choice: j’ai longuement parlé
  rationale: L’expression signifie littéralement « j’ai étendu des paroles ». En français naturel, elle évoque ici un appel verbal prolongé ou insistant, plutôt qu’un geste physique.
- source_word: ἀκύρους ἐποιεῖτε
  choice: vous avez réduit à néant
  rationale: Cette formulation rend l’idée de priver les conseils de force, de validité ou d’effet.
- source_word: ἐλέγχοις
  choice: avertissements
  rationale: Dans ce contexte sapientiel, le terme désigne des réprimandes correctives. « Avertissements » reste clair et digne, tout en exprimant leur fonction de correction.
- source_word: ἀπωλείᾳ
  choice: ruine
  rationale: Le mot peut désigner la perte, la destruction ou la ruine. « Ruine » convient au parallèle avec les calamités qui suivent.
- source_word: καταχαροῦμαι
  choice: je me réjouirai
  rationale: Le verbe exprime une joie marquée face au jugement annoncé ; la traduction conserve cette formulation difficile sans l’atténuer.
- source_word: θόρυβος
  choice: trouble
  rationale: Le terme peut évoquer tumulte, agitation ou panique. « Trouble » préserve cette amplitude dans la description d’une catastrophe soudaine.
- source_word: καταστροφή
  choice: effondrement
  rationale: Le terme désigne un renversement ou une catastrophe. « Effondrement » maintient l’image dynamique de la chute qui survient comme une tempête.
- source_word: πολιορκία
  choice: siège
  rationale: Le sens concret de siège militaire est conservé, sans le généraliser en simple détresse.
theological_decisions:
- issue: La joie et le rire de la Sagesse devant le désastre des récalcitrants
  choice: Conserver directement « je rirai » et « je me réjouirai »
  alternative: Atténuer en « je ne vous secourrai pas » ou présenter ces verbes comme une simple figure du jugement
  rationale: Le grec attribue explicitement ces réactions au locuteur. La tension théologique et rhétorique doit être préservée plutôt que résolue ou adoucie.
- issue: Identité du locuteur dans la citation sapientielle
  choice: Ne pas identifier explicitement le « je » dans le verset
  alternative: Ajouter « la Sagesse dit » ou identifier le locuteur à Dieu
  rationale: Le fragment fourni emploie seulement la première personne ; une identification ajoutée dépasserait le texte immédiat et pourrait fermer une ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure répétitive et solennelle de l’avertissement est conservée, avec une syntaxe légèrement fluidifiée. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est proposée.
