  to: « Puisque j’ai appelé et que vous n’avez pas écouté, puisque j’ai longuement parlé et que vous n’avez prêté aucune attention, mais que vous avez rendu vains mes conseils et que vous avez désobéi à mes réprimandes, moi aussi, je rirai de votre ruine ; je me réjouirai quand la destruction viendra sur vous, quand un trouble soudain vous atteindra et que la catastrophe s’abattra sur vous comme une tempête, ou quand la détresse et le siège viendront sur vous. »
