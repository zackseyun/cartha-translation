    issue: « refusé d’obéir à mes avertissements » pour τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε
    rationale: ἐλέγχοις renvoie à des réprimandes, reproches ou corrections, non d’abord à des avertissements préventifs. « Vous avez désobéi à mes réprimandes » préserve à la fois le terme et le verbe ἠπειθήσατε.
  - severity: low
    issue: « l’effondrement fondra sur vous »
    rationale: La répétition de l’idée de chute rend la phrase pesante en français. Le grec dit que la catastrophe survient; « la catastrophe s’abattra sur vous » rend naturellement l’image et le mouvement.
