    text: Ou « des vœux ». Le grec peut désigner des prières ou des vœux; dans ce contexte cultuel, les deux sens demeurent possibles.
    reason: Préserver l’ambiguïté lexicale de εὐχῶν sans ajouter une relation d’« accompagnement » absente du texte.
  revision_rationale: La révision supprime l’ajout interprétatif relatif aux vœux, restitue le lien argumentatif initial et affine les indications cultuelles et spatiales. Elle maintient la distinction entre péché et faute ainsi que l’ambiguïté de εὐχῶν en note.
