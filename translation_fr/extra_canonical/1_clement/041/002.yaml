revisions:
- from: Les sacrifices de l’offrande perpétuelle, ceux qui accompagnent les vœux[a], ainsi que les sacrifices pour le péché et pour la faute, ne sont pas offerts partout, frères, mais seulement à Jérusalem. Et même là, ils ne sont pas offerts en n’importe quel lieu, mais devant le sanctuaire, à l’autel, après que l’offrande a été examinée pour vérifier qu’elle est sans défaut par le grand prêtre et les ministres mentionnés plus haut.
  to: Car les sacrifices de l’offrande perpétuelle, des prières[a], ou pour le péché et la faute, ne sont pas offerts partout, frères, mais seulement à Jérusalem. Et même là, ils ne sont pas offerts en tout lieu, mais devant le Temple, près de l’autel, après que l’offrande a été examinée afin de vérifier qu’elle est sans défaut par le grand prêtre et les ministres déjà mentionnés.
  rationale: La révision supprime l’ajout interprétatif relatif aux vœux, restitue le lien argumentatif initial et affine les indications cultuelles et spatiales. Elle maintient la distinction entre péché et faute ainsi que l’ambiguïté de εὐχῶν en note.
