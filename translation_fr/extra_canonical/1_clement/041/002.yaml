base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/002.yaml
  text: For the sacrifices of the continual offering, or of prayers, or concerning sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the sanctuary, at the altar, after the offering has been inspected for blemishes by the high priest and the ministers already mentioned.
translation:
  language: fr
  text: Car les sacrifices de l’offrande perpétuelle, des prières[a], ou pour le péché et la faute, ne sont pas offerts partout, frères, mais seulement à Jérusalem. Et même là, ils ne sont pas offerts en tout lieu, mais devant le Temple, près de l’autel, après que l’offrande a été examinée afin de vérifier qu’elle est sans défaut par le grand prêtre et les ministres déjà mentionnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vœux ». Le grec peut désigner des prières ou des vœux; dans ce contexte cultuel, les deux sens demeurent possibles.
    reason: Préserver l’ambiguïté lexicale de εὐχῶν sans ajouter une relation d’« accompagnement » absente du texte.
lexical_decisions:
- source_word: θυσίαι ἐνδελεχισμοῦ
  choice: sacrifices de l’offrande perpétuelle
  rationale: Rend la notion cultuelle d’une offrande régulière et continuelle, tout en conservant la formulation nominale du grec.
- source_word: εὐχῶν
  choice: vœux
  rationale: Dans une liste de catégories sacrificielles, le terme désigne vraisemblablement des vœux accompagnés d’offrandes plutôt que des prières au sens général; l’ambiguïté est signalée en note.
- source_word: περὶ ἁμαρτίας καὶ πλημμελείας
  choice: pour le péché et pour la faute
  rationale: Maintient la distinction entre les deux catégories cultuelles sans les confondre ni leur imposer une terminologie confessionnelle.
- source_word: ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον
  choice: devant le sanctuaire, à l’autel
  rationale: Reproduit les deux indications spatiales de manière naturelle en français.
- source_word: 'μωμοσκοπηθέν (OCR: μυωροσκοπηθὲν)'
  choice: après que l’offrande a été examinée pour vérifier qu’elle est sans défaut
  rationale: Le mot attendu signifie l’inspection rituelle visant à déceler un défaut; la leçon transmise ici paraît être une corruption d’OCR.
theological_decisions:
- issue: Nature de εὐχῶν dans le contexte sacrificiel
  choice: vœux, avec note
  alternative: prières
  rationale: Le contexte énumère des sacrifices effectivement offerts; «vœux» convient donc mieux, mais la polysémie du terme grec mérite d’être conservée en note.
- issue: Distinction entre péché et faute
  choice: conserver deux catégories distinctes
  alternative: fusionner en «péchés» ou «transgressions»
  rationale: Le grec coordonne ἁμαρτία et πλημμέλεια; la traduction ne doit pas effacer cette distinction cultuelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de «ne sont pas offerts» conserve l’insistance et la structure argumentative du grec. «Frères» maintient l’adresse communautaire explicite.
