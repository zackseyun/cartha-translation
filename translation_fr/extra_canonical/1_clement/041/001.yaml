id: 1CLEM.41.1
reference: 1 Clement 41:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
translation:
  language: fr
  text: Que chacun de nous, frères, plaise à Dieu au rang qui est le sien, en gardant une bonne conscience, sans dépasser la règle fixée pour son service, et avec dignité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάγματι
  choice: rang
  rationale: Le terme désigne une place ou un ordre assigné; «rang» conserve ici l’image d’une organisation structurée sans préciser indûment sa nature.
- source_word: εὐαρεστείτω
  choice: plaise à Dieu
  rationale: Rend directement et naturellement l’impératif actif grec.
- source_word: λειτουργίας
  choice: service
  rationale: Dans ce contexte, le mot désigne un service ou une fonction déterminée; «service» préserve une portée assez large sans imposer le sens cultuel moderne de «liturgie».
- source_word: κανόνα
  choice: règle
  rationale: Correspond au sens de norme ou limite directrice dans la construction avec «fixée».
- source_word: σεμνότητι
  choice: dignité
  rationale: Exprime la conduite honorable, grave et convenable indiquée par le grec.
theological_decisions:
- issue: Nature du «rang» et du «service»
  choice: 'Maintenir des termes généraux: «rang» et «service»'
  alternative: Préciser une charge ecclésiastique ou liturgique
  rationale: Le grec évoque un ordre et un service déterminés, mais ce verset seul ne justifie pas de les limiter explicitement à une structure ministérielle particulière.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la progression exhortative du grec tout en évitant le calque lourd «étant dans une bonne conscience». «En gardant» exprime naturellement la valeur continue du participe ὑπάρχων.
