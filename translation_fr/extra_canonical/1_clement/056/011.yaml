  source_fidelity: Le sens général est fidèle, y compris l’intensité de οὐ μὴ φοβηθῇς (« tu n’auras aucune crainte »). Cependant, ἀνόμων signifie directement « sans loi / lawless »; « ceux qui méprisent la loi » explicite et restreint indûment le terme.
