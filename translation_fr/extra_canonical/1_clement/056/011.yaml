  text: ἀδίκων καὶ ἀνόμων καταγελάσῃ, ἀπὸ δὲ θηρίων ἀγρίων οὐ μὴ φοβηθῇς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/011.yaml
  text: 'You will laugh at the unrighteous and lawless,

    and you will certainly not fear wild beasts,'
translation:
  language: fr
  text: 'Tu riras des injustes et des gens sans loi,


    et tu n’auras aucune crainte des bêtes sauvages.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδίκων
  choice: des injustes
  rationale: Rend directement l’adjectif substantivé au génitif pluriel, objet de καταγελάσῃ.
- source_word: ἀνόμων
  choice: de ceux qui méprisent la loi
  rationale: Exprime le sens de personnes sans loi ou qui la transgressent, dans un français naturel, sans réduire le terme à une catégorie juridique moderne.
- source_word: καταγελάσῃ
  choice: tu te riras
  rationale: Conserve l’idée forte de rire aux dépens de quelqu’un, tout en gardant un registre digne.
- source_word: θηρίων ἀγρίων
  choice: des bêtes sauvages
  rationale: Équivalent français idiomatique de l’expression grecque désignant des animaux féroces ou sauvages.
- source_word: οὐ μὴ φοβηθῇς
  choice: tu n’auras aucune crainte
  rationale: Reproduit la négation grecque fortement emphatique sans alourdir la phrase par une tournure artificielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux membres est conservé, ainsi que la force de la négation emphatique.
