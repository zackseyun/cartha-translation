id: 1CLEM.56.15
reference: 1 Clement 56:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλεύσῃ δὲ ἐν τάφῳ ὥσπερ σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος, ἢ ὥσπερ θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
translation:
  language: fr
  text: Et tu entreras dans la tombe comme le grain mûr que l’on moissonne en sa saison, ou comme un tas de grain de l’aire que l’on rentre au moment voulu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ ἐν τάφῳ
  choice: tu entreras dans la tombe
  rationale: Rend directement le mouvement exprimé par ἐλεύσῃ avec ἐν τάφῳ, sans ajouter l’idée de « descendre », absente du grec.
- source_word: σῖτος ὥριμος
  choice: le grain mûr
  rationale: σῖτος peut désigner le blé ou, plus largement, le grain; « grain » préserve cette portée tout en restant naturel dans l’image de la moisson.
- source_word: κατὰ καιρὸν θεριζόμενος
  choice: que l’on moissonne en sa saison
  rationale: Exprime le moment approprié indiqué par καιρός et le participe passif θεριζόμενος.
- source_word: θημωνιὰ ἅλωνος
  choice: un tas de gerbes sur l’aire
  rationale: θημωνιά désigne un amas ou une meule de produits de la moisson; cette formulation rend concrètement l’image agricole tout en évitant l’ambiguïté moderne de « meule ».
- source_word: καθ’ ὥραν συγκομισθεῖσα
  choice: que l’on rentre au moment voulu
  rationale: συγκομίζω évoque ici le rassemblement ou la rentrée de la récolte, et καθ’ ὥραν son accomplissement au moment approprié.
theological_decisions:
- issue: Portée de l’image de la mort
  choice: Conserver les deux comparaisons agricoles sans expliciter leur signification
  alternative: Ajouter une idée telle que « après une vie accomplie » ou « en paix »
  rationale: Le grec évoque une mort survenant au temps approprié par les images de la récolte, mais il ne formule pas explicitement ces interprétations.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique du grec est conservé, avec une formulation agricole claire. Aucune note n’est nécessaire; la note anglaise signalée provenait d’un ancien problème de ponctuation sans fondement dans le texte grec.
