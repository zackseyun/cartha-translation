source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
translation:
  language: fr
  text: 'Lors de la famine, il t’arrachera à la mort ;

    et lors de la guerre, il te délivrera du pouvoir de l’épée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main du fer ». Le « fer » désigne ici l’épée.'
    reason: La note préserve l’image hébraïsante transmise par le grec tout en expliquant la formulation naturelle du texte principal.
lexical_decisions:
- source_word: ῥύσεταί
  choice: il t’arrachera
  rationale: Le verbe ῥύομαι exprime un sauvetage hors d’un danger. « Arracher à la mort » rend cette force et constitue une tournure française naturelle.
- source_word: ἐκ χειρὸς σιδήρου
  choice: du pouvoir de l’épée
  rationale: L’expression signifie littéralement « de la main du fer ». « Main » évoque ici le pouvoir ou l’emprise, tandis que « fer » désigne par métonymie l’épée. La traduction retenue restitue clairement l’idiome sans en masquer la forme littérale, signalée en note.
- source_word: λύσει
  choice: il te délivrera
  rationale: λύω signifie fondamentalement « délier, libérer ». Dans ce contexte de guerre, « délivrer » exprime naturellement la libération d’une puissance menaçante.
theological_decisions:
- issue: Sujet implicite des deux verbes
  choice: Conserver le pronom « il » sans expliciter son référent
  alternative: Ajouter « Dieu »
  rationale: Le grec porte un sujet implicite à la troisième personne. L’expliciter par « Dieu » résoudrait dans la traduction ce que le verset isolé laisse dépendre du contexte.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme des deux propositions et les futurs du grec sont conservés ; le point-virgule met en valeur leur correspondance.
