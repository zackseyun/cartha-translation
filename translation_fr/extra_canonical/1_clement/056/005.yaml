- from: « Car, est-il dit, qu’une personne juste me corrige avec bonté et me reprenne ; mais que l’huile des pécheurs ne parfume pas ma tête. »
  to: « Car, est-il dit, une personne juste me corrigera avec miséricorde et me reprendra ; mais que l’huile des pécheurs ne m’oigne pas la tête. »
  rationale: La révision rétablit les futurs indicatifs grecs, rend ἐν ἐλέει par « avec miséricorde » et remplace « parfume » par « oigne », terme approprié au geste d’appliquer de l’huile. Elle maintient « une personne juste », qui évite d’introduire un référent défini ou théologique absent du grec.
