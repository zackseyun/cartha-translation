  verdict: revise
  source_fidelity: 'Révision nécessaire : les deux verbes principaux, παιδεύσει et ἐλέγξει, sont au futur de l’indicatif (« corrigera », « reprendra »), non au subjonctif. « Parfume » ajoute l’idée d’odeur et ne rend pas précisément λιπανάτω, qui évoque l’onction/l’application d’huile sur la tête.'
  naturalness: La formulation révisée est idiomatique dans un français moderne et conserve le ton soutenu d’une citation scripturaire. « M’oigne la tête » est naturel dans ce registre et garde l’image concrète de l’huile.
  terminology: « Une personne juste » préserve à juste titre le caractère générique et anarthre de δίκαιος. « Avec miséricorde » rend explicitement ἐν ἐλέει sans réduire ce terme à une simple gentillesse. « Corrigera » et « reprendra » conservent la distinction entre παιδεύω et ἐλέγχω.
  issues:
  - severity: medium
    issue: Mode verbal des actions du juste
    rationale: Παιδεύσει et ἐλέγξει sont des futurs indicatifs. Le subjonctif français « qu’une personne juste me corrige ... et me reprenne » modifie la syntaxe assertive de la citation.
  - severity: medium
    issue: Rendu de λιπανάτω
    rationale: « Parfume » n’est pas exigé par le grec et introduit une nuance olfactive absente. Le verbe désigne l’action d’oindre ou d’enduire d’huile.
  - severity: low
    issue: Rendu de ἐν ἐλέει
    rationale: « Avec bonté » est interprétatif et plus faible que « avec miséricorde », qui conserve le terme et sa portée sans alourdir le français.
  revised_text: « Car, est-il dit, une personne juste me corrigera avec miséricorde et me reprendra ; mais que l’huile des pécheurs ne m’oigne pas la tête. »
