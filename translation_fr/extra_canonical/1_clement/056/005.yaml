source:
  edition: Funk 1901 (normalized OCR)
  text: Παιδεύσει με γάρ, φησίν, δίκαιος ἐν ἐλέει καὶ ἐλέγξει με, ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
translation:
  language: fr
  text: « Car, est-il dit, une personne juste me corrigera avec miséricorde et me reprendra ; mais que l’huile des pécheurs ne m’oigne pas la tête. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παιδεύσει
  choice: corrige
  rationale: Le verbe παιδεύω désigne ici une correction éducative ou disciplinaire ; « corrige » est naturel en français et convient au contexte d’exhortation mutuelle.
- source_word: δίκαιος
  choice: une personne juste
  rationale: L’adjectif substantivé est sans article et se comprend naturellement de manière générique, sans désigner nécessairement Dieu ni une figure précise.
- source_word: ἐν ἐλέει
  choice: avec bonté
  rationale: L’expression signifie littéralement « dans la miséricorde ». Ici, « avec bonté » rend naturellement la manière bienveillante dont la correction est administrée.
- source_word: ἐλέγξει
  choice: reprenne
  rationale: ἐλέγχω exprime la réprimande ou la mise en évidence d’une faute ; « reprendre » conserve ce sens dans un registre digne.
- source_word: λιπανάτω
  choice: parfume
  rationale: Le verbe signifie rendre gras, oindre ou enduire. Avec l’huile sur la tête, « parfumer » restitue naturellement l’image d’une huile cosmétique ou honorifique, tout en la distinguant de la correction salutaire.
theological_decisions:
- issue: Référent de δίκαιος
  choice: une personne juste
  alternative: le juste
  rationale: L’absence d’article et le contexte de correction mutuelle favorisent une lecture générique. La traduction évite d’imposer un référent divin ou messianique.
- issue: Valeur de ἐν ἐλέει
  choice: avec bonté
  alternative: dans sa miséricorde
  rationale: La formulation choisie décrit la manière de corriger sans attribuer au juste une miséricorde quasi technique ni résoudre davantage l’identité du sujet.
translation_notes:
  register: Français moderne, courant et digne. La structure antithétique de la citation est conservée, ainsi que le contraste entre la correction bienveillante du juste et l’huile des pécheurs.
