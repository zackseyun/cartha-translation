  text: γνώσῃ δέ, ὅτι πολὺ τὸ σπέρμα σου, τὰ δὲ τέκνα σου ὥσπερ τὸ παμβότανον τοῦ ἀγροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/014.yaml
  text: 'And you will know that your offspring will be many,

    and your children like the abundant grass of the field[a].'
translation:
  language: fr
  text: 'Tu sauras que ta descendance sera abondante,


    et que tes enfants seront comme l’herbe foisonnante du champ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσῃ
  choice: Tu sauras
  rationale: Le futur moyen de γινώσκω exprime ici l’acquisition ou la certitude d’un savoir; « tu sauras » est naturel et fidèle.
- source_word: σπέρμα
  choice: descendance
  rationale: Dans ce contexte, le nom collectif désigne les descendants. « Descendance » évite l’ambiguïté moderne de « semence » tout en conservant la valeur collective du grec.
- source_word: πολύ
  choice: nombreuse
  rationale: Avec le collectif « descendance », l’adjectif signifie qu’elle comptera un grand nombre de personnes.
- source_word: τέκνα
  choice: enfants
  rationale: Équivalent direct et courant, distinct de « descendance » dans le parallélisme.
- source_word: παμβότανον τοῦ ἀγροῦ
  choice: l’herbe foisonnante des champs
  rationale: παμβότανον évoque une végétation herbeuse abondante; « foisonnante » restitue cette profusion, et « des champs » rend naturellement le génitif singulier à valeur générique.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. Aucune note n’est nécessaire, puisque « descendance » rend directement le sens contextuel de σπέρμα sans introduire une lecture doctrinale.
