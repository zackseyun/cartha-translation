  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: fr
  text: 'Six fois, il te délivrera des détresses,


    et la septième fois, aucun mal ne t’atteindra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑξάκις
  choice: Six fois
  rationale: Rend directement l’adverbe numérique grec.
- source_word: ἐξ ἀναγκῶν
  choice: de la détresse
  rationale: Le pluriel grec désigne ici des situations de contrainte, de détresse ou d’adversité; le singulier collectif est naturel en français et conserve la portée générale.
- source_word: ἐξελεῖταί σε
  choice: il te délivrera
  rationale: Exprime le sens futur de sauvetage ou de délivrance du verbe ἐξαιρέω.
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: et la septième
  rationale: Formulation idiomatique qui sous-entend «fois», comme le grec sous-entend l’occurrence correspondante.
- source_word: οὐχ ἅψεταί σου κακόν
  choice: aucun mal ne t’atteindra
  rationale: «Atteindre» rend naturellement le contact nuisible exprimé par ἅπτομαι, sans réduire κακόν à une seule sorte de mal.
theological_decisions:
- issue: Portée du schéma «six fois… la septième»
  choice: Conserver littéralement la progression numérique
  alternative: Paraphraser par «maintes fois… toujours»
  rationale: Le texte reprend une formule sapientielle et sa structure rhétorique; il ne faut ni l’aplatir en généralité ni préciser la nature d’une promesse au-delà du grec.
translation_notes:
  register: Français moderne, clair et digne. Tutoiement conservé pour le singulier σε/σου. La mise en deux lignes reflète le parallélisme de la phrase grecque.
