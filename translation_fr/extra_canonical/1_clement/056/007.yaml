translation:
  language: fr
  text: Il a frappé, et ses mains ont apporté la guérison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « ses mains ont guéri ». Le grec ne précise pas la personne guérie.'
    reason: La note conserve la formulation imagée et concise du grec, tout en indiquant que le bénéficiaire de la guérison n’est pas exprimé.
lexical_decisions:
- source_word: ἔπαισεν
  choice: il a frappé
  rationale: Le passé composé rend naturellement l’aoriste français tout en conservant l’action de frapper ou de porter un coup.
- source_word: αἱ χεῖρες αὐτοῦ ἰάσαντο
  choice: ses mains ont guéri
  rationale: Cette formulation suit de près le grec, où aucun complément d’objet n’est exprimé, et préserve l’image selon laquelle ses mains produisent la guérison.
theological_decisions:
- issue: Complément implicite du verbe « guérir »
  choice: Ne pas ajouter « celui qu’il avait frappé » ni « le blessé » dans le texte principal
  alternative: « ses mains l’ont guéri »
  rationale: Le contexte peut suggérer un bénéficiaire implicite, mais le grec ne l’exprime pas. L’ajouter lèverait une ambiguïté que le texte source conserve.
translation_notes:
  register: Français moderne, sobre et scripturaire. Le passé composé respecte les aoristes grecs; la formulation concise conserve le parallélisme et l’ambiguïté du texte source.
