  verdict: revise
  source_fidelity: 'Le grec dit littéralement : « il a frappé, et ses mains ont guéri ». Le verbe ἰάσαντο, dont « ses mains » est le sujet, exprime une action de guérison sans préciser la personne guérie. Le texte ne justifie donc pas l’ajout de « l’a guéri » ou d’un autre bénéficiaire.'
  naturalness: « Ses mains ont guéri » est grammaticalement possible, mais en français moderne il se comprend spontanément comme « ses mains se sont remises d’une blessure ». Une formulation qui exprime leur rôle actif est nécessaire tout en évitant d’ajouter un objet absent du grec.
  terminology: « Apporté la guérison » rend naturellement la valeur active de ἰάομαι dans ce contexte et conserve l’image des mains comme agents de guérison. Le temps composé maintient le parallélisme aoristique du grec.
  issues:
