    issue: Ambiguïté française involontaire de « ses mains ont guéri »
    rationale: Sans complément, cette phrase tend à signifier que les mains elles-mêmes ont recouvré la santé, alors que le grec présente les mains comme sujet de l’acte de guérir. La note actuelle signale le problème, mais le texte principal reste susceptible de contresens.
  revised_text: Il a frappé, et ses mains ont apporté la guérison[a].
