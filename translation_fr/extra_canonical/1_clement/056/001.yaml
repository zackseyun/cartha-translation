revisions:
- from: Intercédons donc, nous aussi, pour ceux qui se trouvent dans quelque faute, afin que la douceur et l’humilité leur soient données, pour qu’ils cèdent non pas à nous, mais à la volonté de Dieu. Ainsi, en effet, la mention compatissante qui sera faite d’eux auprès de Dieu et des saints portera pleinement son fruit.[a]
  to: Intercédons donc, nous aussi, pour ceux qui se trouvent dans une faute, afin que douceur et humilité leur soient accordées, pour qu’ils cèdent non pas à nous, mais à la volonté de Dieu. Car alors, le souvenir plein de compassion qu’on aura d’eux auprès de Dieu et des saints sera pour eux fécond et parfait.[a]
  rationale: La révision conserve le sens et le registre de la proposition tout en rendant explicitement le datif αὐτοῖς par « pour eux ». Elle restitue séparément les deux qualificatifs « fécond et parfait », et remplace des tournures françaises plus raides par une formulation moderne et naturelle. La note est ajustée pour ne pas présenter comme certaine une nuance syntaxique qui peut être formulée autrement.
