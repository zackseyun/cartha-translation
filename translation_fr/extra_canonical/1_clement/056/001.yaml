id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
translation:
  language: fr
  text: Intercédons donc, nous aussi, pour ceux qui se trouvent dans une faute, afin que douceur et humilité leur soient accordées, pour qu’ils cèdent non pas à nous, mais à la volonté de Dieu. Car alors, le souvenir plein de compassion qu’on aura d’eux auprès de Dieu et des saints sera pour eux fécond et parfait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car alors, leur souvenir auprès de Dieu et des saints sera, avec compassion, fécond et parfait. »'
    reason: Le rattachement de μετ’ οἰκτιρμῶν (« avec compassion ») à μνεία (« souvenir, mention ») est le plus naturel, mais la place de l’expression dans le groupe nominal grec permet une traduction plus proche de l’ordre du texte.
lexical_decisions:
- source_word: ἐντύχωμεν
  choice: Intercédons
  rationale: Le verbe désigne ici une démarche en faveur d’autrui; « intercéder » restitue naturellement cette valeur dans le contexte.
- source_word: ἐν τινι παραπτώματι ὑπαρχόντων
  choice: ceux qui se trouvent dans quelque faute
  rationale: ὑπάρχω exprime le fait de se trouver dans un état, sans la nuance d’être surpris ou pris sur le fait; παράπτωμα est rendu par « faute » dans un français courant et digne.
- source_word: ἐπιείκεια
  choice: douceur
  rationale: Le terme peut évoquer la modération, l’indulgence ou la douceur; « douceur » convient à une disposition accordée aux personnes et s’accorde naturellement avec « humilité ».
- source_word: εἶξαι
  choice: cèdent
  rationale: Le verbe signifie céder ou se plier. « Céder » conserve le contraste explicite entre l’autorité humaine (« à nous ») et la volonté de Dieu.
- source_word: ἔγκαρπος καὶ τελεία
  choice: portera pleinement son fruit
  rationale: Cette formulation idiomatique réunit l’idée de fécondité exprimée par ἔγκαρπος et celle d’accomplissement exprimée par τελεία, sans lourdeur en français.
theological_decisions:
- issue: Objet de la soumission
  choice: « non pas à nous, mais à la volonté de Dieu »
  alternative: « non pas devant nous, mais devant la volonté de Dieu »
  rationale: Le datif grec marque ce à quoi les personnes doivent céder. La traduction maintient la tension entre les responsables humains et la volonté divine sans assimiler les deux.
- issue: Rapport entre la compassion et la mention
  choice: « la mention compatissante qui sera faite d’eux »
  alternative: « leur souvenir auprès de Dieu et des saints, accompagné de compassion »
  rationale: 'L’ordre et la structure du grec favorisent le rattachement de μετ’ οἰκτιρμῶν à μνεία: c’est la mention ou le souvenir qui est caractérisé par la compassion. La formulation explicite en français que ces personnes sont l’objet de cette mention.'
translation_notes:
  register: Français international moderne, digne et accessible. « Intercédons » conserve la tonalité exhortative et religieuse du passage; le reste de la phrase privilégie une syntaxe fluide sans effacer les contrastes du grec.
