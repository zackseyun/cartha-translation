  text: οὕτως γάρ φησιν ὁ ἅγιος λόγος· Παιδεύων ἐπαίδευσέν με ὁ κύριος, καὶ τῷ θανάτῳ οὐ παρέδωκέν με·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
translation:
  language: fr
  text: 'Car voici ce que dit la sainte Parole :


    « Le Seigneur m’a sévèrement corrigé,

    mais il ne m’a pas livré à la mort. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a bel et bien corrigé ».'
    reason: Signale l’autre manière possible de rendre la construction intensive παιδεύων ἐπαίδευσέν.
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  choice: la sainte Parole
  rationale: Dans cette formule d’introduction à une citation scripturaire, « Parole » désigne solennellement l’Écriture ou la parole divine.
- source_word: Παιδεύων ἐπαίδευσέν με
  choice: m’a sévèrement corrigé
  rationale: La répétition apparentée du participe et du verbe intensifie l’action, selon la tournure de la Septante qui reflète un infinitif absolu hébreu. « Corriger » conserve ici la notion de discipline éducative et punitive.
- source_word: παρέδωκέν με
  choice: m’a livré
  rationale: Rend naturellement l’idée de remettre quelqu’un au pouvoir ou au sort de la mort.
theological_decisions:
- issue: Nature et intensité de la discipline divine
  choice: m’a sévèrement corrigé
  alternative: m’a bel et bien corrigé
  rationale: La construction grecque peut formellement souligner l’action, mais, dans le contexte du châtiment opposé à la mort, elle exprime plus probablement son intensité sans faire de la correction une condamnation définitive.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La mise en vers conserve la forme citationnelle et le parallélisme antithétique.
