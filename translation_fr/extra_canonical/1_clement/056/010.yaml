id: 1CLEM.56.10
reference: 1 Clement 56:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἀπὸ μάστιγος γλώσσης σε κρύψει, καὶ οὐ μὴ φοβηθήσῃ κακῶν ἐπερχομένων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/010.yaml
  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
translation:
  language: fr
  text: Et il te mettra à l’abri du fouet de la langue[a], et tu ne craindras certainement pas les malheurs lorsqu’ils surviendront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du fouet de la langue » ; l’expression désigne les paroles qui blessent ou calomnient.'
    reason: L’image grecque, conservée dans le texte, peut nécessiter une brève explication pour le lecteur moderne.
lexical_decisions:
- source_word: μάστιγος γλώσσης
  choice: du fouet de la langue
  rationale: Conserve l’image vigoureuse du grec, où μάστιξ désigne un fouet ou un fléau, et γλώσσης précise que l’attaque vient de la parole.
- source_word: κρύψει
  choice: mettra à l’abri
  rationale: Rend naturellement en français l’idée de cacher pour protéger, sans réduire le verbe à une simple dissimulation.
- source_word: οὐ μὴ φοβηθήσῃ
  choice: tu ne craindras certainement pas
  rationale: La double négation οὐ μή avec le subjonctif exprime une négation fortement affirmée.
- source_word: κακῶν ἐπερχομένων
  choice: les malheurs lorsqu’ils surviendront
  rationale: κακά désigne ici des maux ou malheurs, tandis que le participe présent ἐπερχομένων évoque leur survenue; cette tournure est naturelle en français et préserve la valeur circonstancielle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le « tu » est conservé conformément au singulier grec σε et φοβηθήσῃ. La coordination initiale et répétée par καί est maintenue afin de respecter le mouvement poétique de la citation.
