source:
  edition: Funk 1901 (normalized OCR)
  text: εἶτα γνώσῃ, ὅτι εἰρηνεύσει σου ὁ οἶκος, ἡ δὲ δίαιτα τῆς σκηνῆς σου οὐ μὴ ἁμάρτῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
translation:
  language: fr
  text: 'Alors tu sauras que ta maison sera en paix,

    et la demeure de ta tente ne fera assurément pas défaut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « la demeure de ta tente ne manquera certainement pas ». Le grec fait de « demeure » le sujet du verbe. Dans le contexte de Job 5.24, certains comprennent l’expression comme l’assurance que, lors d’une inspection, rien ne manquera.
    reason: Préserve la syntaxe explicite du grec tout en signalant l’interprétation contextuelle attestée dans la tradition de traduction.
lexical_decisions:
- source_word: εἰρηνεύσει
  choice: sera en paix
  rationale: Rend naturellement le futur du verbe « être en paix » tout en conservant l’image d’une maisonnée paisible et sûre.
- source_word: δίαιτα τῆς σκηνῆς σου
  choice: ta demeure
  rationale: Dans cette citation de Job 5.24 selon la Septante, δίαιτα désigne le lieu où l’on demeure; « demeure » restitue le parallèle spatial avec οἶκος sans la lourdeur de « l’habitation de ta tente ».
- source_word: οὐ μὴ ἁμάρτῃ
  choice: sans rien trouver qui manque
  rationale: Le contexte permet le sens de ne rien manquer ou ne constater aucune absence lors de l’examen de la demeure; la tournure française explicite naturellement cette valeur contextuelle.
theological_decisions:
- issue: Sujet implicite et sens de ἁμάρτῃ dans la seconde proposition
  choice: et tu examineras ta demeure sans rien trouver qui manque
  alternative: et la demeure de ta tente ne connaîtra certainement aucune défaillance
  rationale: La formulation retenue suit l’interprétation contextuelle traditionnelle de Job 5.24, où la visite ou l’inspection est sous-entendue et où ἁμαρτάνω signifie « manquer ». L’autre lecture, grammaticalement envisageable, prend δίαιτα comme sujet de ἁμάρτῃ; elle est signalée en note afin de préserver l’ambiguïté du grec.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier conserve les formes grecques de deuxième personne du singulier. Le parallélisme poétique est maintenu sur deux lignes.
