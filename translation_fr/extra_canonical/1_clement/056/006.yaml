source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ πάλιν λέγει· Μακάριος ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου· αὐτὸς γὰρ ἀλγεῖν ποιεῖ, καὶ πάλιν ἀποκαθίστησιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
translation:
  language: fr
  text: 'Et il dit encore :


    « Heureux l’homme que le Seigneur reprend.


    Ne refuse pas la correction du Tout-Puissant.


    Car c’est lui qui fait souffrir et qui rétablit ensuite. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλεγξεν
  choice: reprend
  rationale: Dans cette béatitude, l’aoriste peut exprimer une vérité générale; le présent français rend naturellement cette valeur gnomique et s’accorde avec les présents qui suivent.
- source_word: νουθέτημα
  choice: avertissement
  rationale: Le terme désigne une mise en garde ou une correction destinée à instruire; « avertissement » est naturel et compréhensible sans surinterpréter.
- source_word: παντοκράτορος
  choice: du Tout-Puissant
  rationale: Équivalent français établi qui conserve le titre divin et l’idée de souveraineté universelle.
- source_word: ἀπαναίνου
  choice: refuse pas
  rationale: Rend directement l’impératif négatif exprimant le rejet ou le refus.
- source_word: ἀλγεῖν ποιεῖ
  choice: fait souffrir
  rationale: Reproduit la construction causative et conserve sans l’atténuer l’affirmation selon laquelle Dieu cause la douleur.
- source_word: ἀποκαθίστησιν
  choice: rétablit
  rationale: Exprime la restauration à un état antérieur; « rétablit » reste suffisamment ouvert quant à la nature précise de cette restauration.
theological_decisions:
- issue: Dieu comme cause de la souffrance
  choice: « c’est lui qui fait souffrir »
  alternative: « il blesse » ou « il permet la souffrance »
  rationale: Le grec emploie explicitement une construction causative; la traduction ne doit ni substituer l’image de la blessure ni atténuer l’agentivité par « permet ».
- issue: Valeur temporelle de l’aoriste ἤλεγξεν
  choice: 'présent gnomique : « reprend »'
  alternative: 'passé composé : « a repris »'
  rationale: Le contexte sapientiel formule une vérité générale, et les verbes suivants sont au présent; le présent français est donc le rendu le plus naturel, tout en reconnaissant que la forme grecque est un aoriste.
translation_notes:
  register: Français moderne, international et digne. La disposition poétique marque la citation scripturaire. « L’homme » traduit ἄνθρωπος au sens générique. Le parallélisme et la tension théologique du grec sont conservés sans ajout explicatif.
