  rationale: La révision précise le sens correctif de νουθέτημα par « correction » et lisse légèrement le dernier parallélisme. Elle maintient le présent gnomique, le titre divin, l’agentivité explicite de Dieu dans la souffrance et la restauration, ainsi que la portée générale du texte.
