id: 1CLEM.56.2
reference: 1 Clement 56:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλάβωμεν παιδείαν, ἐφ’ ᾗ οὐδεὶς ὀφείλει ἀγανακτεῖν, ἀγαπητοί. ἡ νουθέτησις, ἣν ποιούμεθα εἰς ἀλλήλους, καλὴ ἐστιν καὶ ὑπεράγαν ὠφέλιμος· κολλᾷ γὰρ ἡμᾶς τῷ θελήματι τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: fr
  text: 'Acceptons la correction, bien-aimés : personne ne devrait s’en irriter. L’exhortation que nous nous adressons les uns aux autres est bonne et extrêmement utile, car elle nous attache à la volonté de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάβωμεν παιδείαν
  choice: Recevons la correction
  rationale: « Recevoir » rend l’idée d’accepter et d’assumer, tandis que « correction » exprime ici la παιδεία comme formation corrective plutôt que comme simple enseignement.
- source_word: ἀγανακτεῖν
  choice: s’en irrite
  rationale: Le verbe désigne une vive contrariété ou indignation; cette formulation française reste naturelle sans exagérer en « se révolter ».
- source_word: νουθέτησις
  choice: L’avertissement
  rationale: Le terme évoque une mise en garde ou exhortation destinée à ramener à une conduite juste; « avertissement » convient au contexte de correction mutuelle.
- source_word: κολλᾷ
  choice: attache
  rationale: Le grec exprime une union étroite, littéralement le fait de coller ou joindre; « attache » conserve la force de l’image en français courant.
theological_decisions:
- issue: Nature de la παιδεία
  choice: correction
  alternative: discipline; instruction
  rationale: Le contexte porte sur l’exhortation mutuelle et la réaction qu’elle peut susciter. « Correction » maintient la dimension formative sans importer un système disciplinaire institutionnel.
- issue: Rapport à la volonté de Dieu
  choice: il nous attache à la volonté de Dieu
  alternative: il nous unit à la volonté de Dieu
  rationale: La formulation conserve la métaphore forte de κολλᾷ sans préciser davantage la nature théologique de cette union.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse « bien-aimés » garde le ton pastoral. La syntaxe de la première phrase a été légèrement réorganisée pour éviter une tournure relative lourde tout en conservant l’exhortation et l’interdiction de s’irriter.
