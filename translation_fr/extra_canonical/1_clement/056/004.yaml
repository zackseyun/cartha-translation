  text: ὃν γὰρ ἀγαπᾷ κύριος, παιδεύει, μαστιγοῖ δὲ πάντα υἱόν, ὃν παραδέχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/004.yaml
  text: '“For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”'
translation:
  language: fr
  text: '« Car le Seigneur discipline celui qu’il aime,


    et il fouette tout fils qu’il reçoit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδεύει
  choice: corrige
  rationale: Dans ce contexte proverbial, le verbe désigne une discipline éducative et corrective. « Corrige » est naturel en français et conserve cette idée sans la réduire au seul enseignement.
- source_word: μαστιγοῖ
  choice: frappe de son fouet
  rationale: Le grec évoque littéralement l’action de fouetter. Cette formulation garde la force concrète de l’image tout en restant intelligible.
- source_word: παραδέχεται
  choice: accueille
  rationale: Le verbe signifie recevoir ou accepter favorablement. « Accueille » rend de façon naturelle l’idée de reconnaissance et d’acceptation.
theological_decisions:
- issue: Portée de υἱόν dans la citation
  choice: tout fils
  alternative: tout enfant
  rationale: Le texte grec emploie explicitement le nom masculin υἱόν, « fils ». Le conserver respecte l’image familiale traditionnelle et évite de généraliser silencieusement le texte.
- issue: Sujet implicite de παραδέχεται
  choice: qu’il accueille
  alternative: que le Seigneur accueille
  rationale: Le pronom « il » conserve la syntaxe compacte du grec et renvoie naturellement au Seigneur, sans ajout explicatif dans le corps du texte.
translation_notes:
  register: Citation poétique en français moderne, courant et digne. Le parallélisme des deux propositions et la vigueur de l’image disciplinaire sont préservés.
