source:
  edition: Funk 1901 (normalized OCR)
  text: βλέπετε, ἀγαπητοί, πόσος ὑπερασπισμός ἐστιν τοῖς παιδευομένοις ὑπὸ τοῦ δεσπότου· πατὴρ γὰρ ἀγαθὸς ὢν παιδεύει εἰς τὸ ἐλεηθῆναι ἡμᾶς διὰ τῆς ὁσίας παιδείας αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: fr
  text: Voyez, bien-aimés, quelle grande défense il y a pour ceux que le Maître discipline. Car, parce qu’il est un bon Père, il nous discipline afin qu’il nous soit fait miséricorde par sa sainte discipline.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπετε
  choice: Voyez
  rationale: Impératif direct et naturel, qui conserve l’appel à considérer ce qui vient d’être exposé.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Terme d’adresse affectueux et digne, traditionnel sans être obscur.
- source_word: ὑπερασπισμός
  choice: puissant soutien
  rationale: Le nom désigne une défense, une protection ou un appui en faveur de quelqu’un. « Soutien » convient au contexte de la correction divine, et « puissant » rend l’intensité de πόσος sans suggérer nécessairement une défense judiciaire.
- source_word: παιδευομένοις / παιδεύει / παιδείας
  choice: corrige / correction
  rationale: παιδεύω couvre l’éducation formatrice et la discipline corrective. Dans ce contexte paternel, « corriger » est naturel et conserve la dimension éducative sans évoquer seulement une sanction.
- source_word: δεσπότου
  choice: Maître
  rationale: Rend l’autorité de δεσπότης dans un registre religieux digne, sans choisir ici le titre « Seigneur » généralement associé à κύριος.
- source_word: ἐλεηθῆναι
  choice: recevions miséricorde
  rationale: Exprime clairement l’infinitif aoriste passif, littéralement « être pris en miséricorde ».
- source_word: ὁσίας
  choice: sainte
  rationale: Rend le caractère sacré, pieux et conforme à Dieu de la correction.
theological_decisions:
- issue: Rapport entre la correction divine et la miséricorde
  choice: « afin que nous recevions miséricorde par sa sainte correction »
  alternative: « en vue de nous faire miséricorde au moyen de sa sainte discipline »
  rationale: La formulation conserve à la fois la finalité exprimée par εἰς τό et la médiation exprimée par διά, sans expliquer davantage comment la correction conduit à la miséricorde.
- issue: Identité du « Maître » et du « Père »
  choice: Conserver les deux désignations sans les expliciter
  alternative: Identifier expressément Dieu comme référent
  rationale: Le grec passe de τοῦ δεσπότου à πατὴρ sans nommer explicitement le référent; la traduction préserve cette formulation et sa tension entre autorité et bonté paternelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de la famille παιδεύω/παιδεία est maintenue par « corrige/correction ». Aucun marqueur de note n’est requis.
