    issue: « quel puissant soutien trouvent » pour πόσος ὑπερασπισμός ἐστιν
    rationale: « Puissant » ne rend pas exactement πόσος (« grand, considérable »), « soutien » affaiblit la nuance de défense/protection de ὑπερασπισμός, et « trouvent » introduit une action qui n’est pas exprimée par le grec.
  revised_text: Voyez, bien-aimés, quelle grande défense il y a pour ceux que le Maître discipline. Car, parce qu’il est un bon Père, il nous discipline afin qu’il nous soit fait miséricorde par sa sainte discipline.
