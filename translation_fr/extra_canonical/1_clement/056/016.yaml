- from: Voyez, bien-aimés, quel puissant soutien trouvent ceux que le Maître corrige. Car, puisqu’il est un Père bon, il nous corrige afin que nous recevions miséricorde par sa sainte correction.
  to: Voyez, bien-aimés, quelle grande défense il y a pour ceux que le Maître discipline. Car, parce qu’il est un bon Père, il nous discipline afin qu’il nous soit fait miséricorde par sa sainte discipline.
  rationale: La première proposition est resserrée pour refléter plus fidèlement πόσος ὑπερασπισμός ἐστιν, sans expliciter la nature exacte de cette défense. La seconde phrase conserve la causalité de « étant un bon Père », la finalité de εἰς τό et la voix passive de ἐλεηθῆναι dans une formulation française naturelle.
