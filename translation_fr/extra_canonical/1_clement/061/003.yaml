id: 1CLEM.61.3
reference: 1 Clement 61:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
translation:
  language: fr
  text: À toi, qui seul peux accomplir ces choses et de plus grands biens parmi nous[a], nous rendons grâce par Jésus-Christ, le grand prêtre et le protecteur de nos âmes. Par lui, à toi la gloire et la majesté, maintenant, de génération en génération et pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : avec nous.'
    reason: La préposition μετὰ avec le génitif peut signifier « avec » ou, selon le contexte, « parmi ». Le texte peut évoquer soit l’action de Dieu au milieu de la communauté, soit son action avec elle.
lexical_decisions:
- source_word: ποιῆσαι
  choice: accomplir
  rationale: Le verbe ποιέω signifie ici « faire, accomplir ». « Accomplir » convient au registre solennel de la prière sans alourdir la phrase.
- source_word: περισσότερα ἀγαθά
  choice: de plus grands biens
  rationale: Cette expression conserve le comparatif et la valeur substantivée de ἀγαθά, plutôt que d’introduire l’idée plus étroite de « bonnes actions ».
- source_word: ἐξομολογούμεθα
  choice: nous rendons grâce
  rationale: Dans cette adresse liturgique à Dieu, le verbe exprime la reconnaissance ou la louange publique. « Nous rendons grâce » est naturel en français et adapté au contexte doxologique.
- source_word: ἀρχιερεύς
  choice: grand prêtre
  rationale: Équivalent français établi et précis du titre cultuel grec.
- source_word: προστάτης
  choice: protecteur
  rationale: Le terme désigne celui qui veille sur autrui, le défend ou lui porte secours. « Protecteur » garde cette portée sans imposer une image absente du grec.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: Dans cette formule solennelle, Χριστός fonctionne comme le titre fixé associé au nom de Jésus. « Jésus-Christ » respecte le registre du passage sans surtraduire par « Jésus le Messie ».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Cette formulation française traditionnelle et intelligible reproduit l’intensification sémitisante du grec et le caractère liturgique de la doxologie.
theological_decisions:
- issue: Rapport de Jésus-Christ à l’action de grâce et à la doxologie
  choice: 'Conserver les deux occurrences de « par » : l’action de grâce est offerte par Jésus-Christ, et la gloire revient à Dieu par lui.'
  alternative: Reformuler la seconde proposition de façon à attribuer directement la gloire à Jésus-Christ.
  rationale: La syntaxe distingue σοὶ, « à toi », de δι’ οὗ, « par qui ». La traduction maintient cette orientation sans résoudre davantage l’ellipse doxologique.
- issue: Titres de Jésus-Christ
  choice: « le grand prêtre et le protecteur de nos âmes »
  alternative: Employer « souverain sacrificateur » et « gardien » ou interpréter les titres de manière doctrinale.
  rationale: Les choix retenus rendent directement les deux titres grecs dans un français moderne et non confessionnel.
translation_notes:
  register: Français moderne, solennel et fluide, adapté à une prière communautaire. La longue construction grecque est légèrement articulée en deux phrases pour rester claire à l’oral, tout en conservant son mouvement doxologique. Le tutoiement correspond à l’adresse directe singulière du grec.
