review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : Dieu confère aux gouvernants leur autorité, les croyants reconnaissent l’honneur qui leur est donné et prient pour leur bon gouvernement. Toutefois, « sans occasion de chute » est une formulation peu idiomatique ici et tend à matérialiser excessivement l’image de ἀπροσκόπως. Dans ce contexte administratif, « sans heurt » rend plus naturellement l’idée d’un exercice sans trébucher, sans obstacle ou sans manquement, tout en laissant subsister l’ambiguïté du grec.'
  naturalness: 'Le registre de prière est bon et le tutoiement est cohérent. La révision allège la dernière proposition : « administrer ... sans heurt » est plus français que « exercer sans occasion de chute l’autorité ».'
  terminology: « Maître » rend bien δέσποτα dans une adresse à Dieu. « Autorité royale » est conservé pour ἐξουσίαν τῆς βασιλείας ; « administrer l’autorité » rend de manière appropriée διέπειν ... ἡγεμονίαν. La note est reformulée pour expliciter les possibilités de ἀπροσκόπως sans privilégier indûment « scandale ».
  issues:
  - severity: medium
    issue: « sans occasion de chute »
    rationale: Cette expression est peu naturelle en français moderne et suggère principalement une occasion extérieure de tomber. Le grec ἀπροσκόπως peut désigner un exercice sans trébucher, sans entrave, sans faute ou sans offense ; une formulation plus idiomatique doit préserver cette ouverture.
