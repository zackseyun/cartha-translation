id: 1CLEM.61.1
reference: 1 Clement 61:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: fr
  text: C’est toi, Maître, qui leur as donné l’autorité royale par ta puissance majestueuse et inexprimable, afin que, reconnaissant la gloire et l’honneur que tu leur as accordés, nous nous soumettions à eux sans nous opposer en rien à ta volonté. Accorde-leur, Seigneur, la santé, la paix, la concorde et la stabilité, afin qu’ils administrent sans heurt l’autorité que tu leur as donnée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans trébucher », « sans entrave », « sans faute » ou « sans causer d’offense ». Le grec ἀπροσκόπως peut évoquer ces nuances, et le contexte ne permet pas d’en retenir une seule avec certitude.'
    reason: La note explique l’ambiguïté sémantique de ἀπροσκόπως, tandis que « sans heurt » fournit dans le texte une expression française naturelle dans le contexte du gouvernement.
lexical_decisions:
- source_word: δέσποτα
  choice: Maître
  rationale: Rend l’adresse solennelle à Dieu et sa souveraineté, sans la connotation moderne négative que pourrait avoir « despote ».
- source_word: ἐξουσίαν τῆς βασιλείας
  choice: l’autorité royale
  rationale: Exprime l’autorité propre au gouvernement ou à la souveraineté, tout en évitant le français lourd « l’autorité de la royauté ».
- source_word: μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους
  choice: ta puissance majestueuse et inexprimable
  rationale: Conserve les deux qualificatifs et rend κράτος par la puissance souveraine de Dieu.
- source_word: ὁμόνοιαν
  choice: la concorde
  rationale: Terme français naturel dans une prière publique, exprimant l’unité d’esprit et l’entente.
- source_word: εὐστάθειαν
  choice: la stabilité
  rationale: Rend le sens de fermeté et de situation stable dans le contexte du gouvernement.
- source_word: ἡγεμονίαν
  choice: l’autorité
  rationale: Désigne ici la charge ou le pouvoir de gouverner confié aux dirigeants; « autorité » est clair et digne en français.
- source_word: ἀπροσκόπως
  choice: sans occasion de chute
  rationale: Préserve l’image liée à πρόσκομμα et l’ambiguïté quant à savoir s’il s’agit d’exercer sans trébucher, sans faute ou sans causer de scandale; une note explicite les possibilités.
theological_decisions:
- issue: Origine divine de l’autorité des gouvernants
  choice: « que tu leur as donnée »
  alternative: « que tu leur as permise »
  rationale: Le grec emploie explicitement δίδωμι à deux reprises; la traduction conserve cette affirmation sans développer une théorie particulière de la légitimité politique.
- issue: Portée de la soumission aux gouvernants
  choice: « sans nous opposer en rien à ta volonté »
  alternative: « ne nous opposant en rien à leur volonté »
  rationale: Le grec rattache explicitement « la volonté » à Dieu (τῷ θελήματί σου). La soumission est donc formulée dans son rapport à la volonté divine, sans extrapolation doctrinale.
translation_notes:
  register: Français moderne, international et soutenu, sous la forme d’une prière publique. La syntaxe conserve le mouvement de la longue phrase grecque tout en restant lisible. Le tutoiement correspond à l’adresse directe à Dieu et à l’usage courant des traductions bibliques françaises contemporaines.
