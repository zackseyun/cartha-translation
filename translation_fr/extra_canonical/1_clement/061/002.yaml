id: 1CLEM.61.2
reference: 1 Clement 61:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
translation:
  language: fr
  text: Car c’est toi, Maître, Roi céleste des siècles, qui donnes aux êtres humains gloire, honneur et autorité sur ceux qui vivent sur la terre. Toi, Seigneur, dirige leurs projets selon ce qui est bon et agréable à tes yeux, afin qu’en exerçant avec paix, douceur et piété l’autorité que tu leur as donnée, ils te trouvent favorable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis dans la saisie fournie porte ici θεοῦ σου (« de ton Dieu »), expression qui ne donne pas de sens satisfaisant dans cette construction. La traduction suit la leçon connue ἵλεώ σου, « favorable envers eux », également reflétée par la traduction anglaise de consultation.
    reason: Signaler et corriger une probable erreur d’OCR dans le texte source fourni, sans masquer l’état des données.
lexical_decisions:
- source_word: δέσποτα
  choice: Maître
  rationale: Rend le vocatif désignant Dieu comme souverain, dans un registre digne sans la connotation moderne de « despote ».
- source_word: βασιλεῦ τῶν αἰώνων
  choice: Roi des siècles
  rationale: Conserve l’expression temporelle et solennelle du grec plutôt que de l’aplanir en « Roi éternel ».
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aux êtres humains
  rationale: Expression sémitisante désignant l’humanité; cette formulation inclusive et naturelle évite de limiter le don aux seuls hommes de sexe masculin.
- source_word: βουλὴν
  choice: projets
  rationale: Dans le contexte des gouvernants, le mot vise leurs desseins, décisions ou orientations; « projets » reste naturel tout en gardant cette largeur de sens.
- source_word: διέποντες
  choice: en exerçant
  rationale: Le participe décrit l’administration effective de l’autorité reçue; « exercer l’autorité » est idiomatique en français.
- source_word: εὐσεβῶς
  choice: avec piété
  rationale: Conserve explicitement la dimension religieuse et morale du gouvernement envisagé.
- source_word: ἵλεώ σου τυγχάνωσιν
  choice: ils te trouvent favorable
  rationale: Rend idiomatiquement la formule grecque attestée dans le texte de 1 Clément, où il est demandé que Dieu leur soit propice.
theological_decisions:
- issue: Origine divine de l’autorité politique
  choice: « l’autorité que tu leur as donnée »
  alternative: Atténuer en disant que Dieu a seulement permis leur autorité
  rationale: Le grec affirme directement que cette autorité leur a été donnée par Dieu; la traduction conserve cette affirmation sans en tirer une doctrine politique supplémentaire.
- issue: Objet de l’autorité humaine
  choice: « sur ceux qui vivent sur la terre »
  alternative: « sur les choses de la terre »
  rationale: Le génitif substantivé τῶν ... ὑπαρχόντων peut être formellement large, mais le contexte du gouvernement et l’accord masculin favorisent la référence aux personnes vivant sur terre.
- issue: Finalité de la prière pour les gouvernants
  choice: « ils te trouvent favorable »
  alternative: « ils obtiennent ta faveur »
  rationale: La formulation retenue garde Dieu lui-même comme sujet implicite de la disposition favorable, au lieu de présenter sa faveur comme un bien abstrait obtenu.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le tutoiement correspond à l’adresse directe à Dieu. La première proposition emploie « c’est toi… qui » pour restituer l’insistance de σὺ γάρ; « Toi, Seigneur, dirige » garde la reprise emphatique et la valeur impérative de la prière.
