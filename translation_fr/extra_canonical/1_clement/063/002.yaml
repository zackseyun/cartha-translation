source:
  edition: Funk 1901 (normalized OCR)
  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: fr
  text: Car vous nous procurerez joie et allégresse si, en obéissant à ce que nous vous avons écrit par l’Esprit Saint, vous retranchez la colère impie liée à votre jalousie, conformément à l’appel que nous avons lancé dans cette lettre au sujet de la paix et de la concorde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν … καὶ ἀγαλλίασιν
  choice: joie et allégresse
  rationale: Conserve le doublet grec et son intensité dans un français naturel et digne.
- source_word: ὑπήκοοι γενήμενοι
  choice: en obéissant
  rationale: Rend naturellement le participe circonstanciel, sans affaiblir l’idée d’obéissance.
- source_word: ἐκκόψητε
  choice: vous retranchez
  rationale: Préserve l’image énergique de couper ou supprimer radicalement.
- source_word: ἄθεμον
  choice: impie
  rationale: Le terme qualifie ce qui enfreint l’ordre divin ou sacré; « impie » garde cette portée plus précisément que le seul « illégal ».
- source_word: ζήλους
  choice: jalousie
  rationale: Dans ce contexte conflictuel, le mot désigne une jalousie ou rivalité ardente; « jalousie » suit le sens contextuel sans introduire une nuance positive de zèle.
- source_word: ἔντευξιν
  choice: appel
  rationale: Le substantif peut désigner une requête ou supplication; « appel » convient à l’exhortation formulée dans la lettre.
- source_word: ὁμονοίας
  choice: concorde
  rationale: Exprime l’unité d’esprit et l’entente collective, en parallèle avec la paix.
theological_decisions:
- issue: Portée de διὰ τοῦ ἁγίου πνεύματος
  choice: « écrit par l’Esprit Saint »
  alternative: « écrit sous l’inspiration de l’Esprit Saint »
  rationale: La formulation retenue reproduit sobrement l’affirmation instrumentale du grec sans développer une doctrine technique de l’inspiration.
- issue: Relation entre la colère et la jalousie dans τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργήν
  choice: « la colère impie née de votre jalousie »
  alternative: « la colère impie de votre jalousie »
  rationale: Le génitif est peu naturel en français et peut exprimer la source ou la caractérisation; « née de » explicite minimalement le rapport causal le plus probable.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe longue de l’original est conservée sous une forme fluide; le vocabulaire ecclésial reste sobre et non confessionnel.
