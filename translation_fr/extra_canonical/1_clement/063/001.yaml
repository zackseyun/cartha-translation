id: 1CLEM.63.1
reference: 1 Clement 63:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Θεμιτὸν οὖν ἐστὶν τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας ὑποθεῖναι τὸν τράχηλον καὶ τὸν τῆς ὑπακατὰ τὸν προκείμενον ἡμῖν ἐν ἀληθείᾳ σκοπὸν δίχα παντὸς μώμου καταντήσωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
translation:
  language: fr
  text: Il convient donc que, ayant devant nous de tels et de si nombreux exemples, nous courbions la nuque et que, accomplissant notre devoir d’obéissance, nous nous tenions tranquilles, afin que, ayant cessé cette vaine dissension, nous parvenions, sans aucun blâme, au but qui nous est proposé en vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεμιτόν
  choice: Il convient
  rationale: Rend naturellement en français l’idée de ce qui est juste, permis ou approprié.
- source_word: ὑποδείγμασιν
  choice: exemples
  rationale: Le terme désigne ici des modèles ou exemples à suivre; « exemples » est clair et fidèle au contexte exhortatif.
- source_word: ὑποθεῖναι τὸν τράχηλον
  choice: courbions la nuque
  rationale: Conserve l’image grecque de la soumission volontaire sans l’aplanir en simple paraphrase.
- source_word: τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
  choice: remplissant le rôle de l’obéissance
  rationale: Exprime l’idée d’assumer pleinement la place ou la fonction de l’obéissance, dans un français intelligible.
- source_word: ἡσυχάσαι
  choice: nous nous tenions tranquilles
  rationale: Dans le contexte de la dissension, le verbe appelle à cesser l’agitation et à retrouver le calme.
- source_word: ματαίας στάσεως
  choice: vaine révolte
  rationale: στάσις désigne une dissension, une sédition ou une révolte; « révolte » garde ici la force du reproche, tandis que « vaine » traduit ματαίας.
- source_word: σκοπόν
  choice: but
  rationale: Désigne l’objectif placé devant les croyants; « but » est direct et idiomatique.
- source_word: δίχα παντὸς μώμου
  choice: sans aucun reproche
  rationale: μῶμος peut évoquer une faute, une tache ou un motif de blâme; « sans aucun reproche » préserve cette portée morale.
theological_decisions:
- issue: Nature de l’obéissance
  choice: Conserver la formulation générale « le rôle de l’obéissance »
  alternative: Préciser l’autorité humaine ou divine à laquelle il faut obéir
  rationale: Le verset ne nomme pas explicitement l’objet de l’obéissance; la traduction ne doit pas résoudre cette ouverture théologique.
- issue: Sens de « dans la vérité »
  choice: Rattacher l’expression au but proposé
  alternative: La rattacher à l’action de parvenir
  rationale: L’ordre grec favorise son lien avec le but placé devant la communauté, tout en laissant subsister une légère souplesse syntaxique.
translation_notes:
  register: Français moderne, digne et exhortatif. La phrase conserve les images fortes du grec tout en allégeant sa longue structure participiale. Le texte tient compte de la clause manifestement perdue dans l’OCR normalisé après ὑπακοῆς, attestée par le texte critique et nécessaire à la cohérence de l’appel à mettre fin à la dissension.
