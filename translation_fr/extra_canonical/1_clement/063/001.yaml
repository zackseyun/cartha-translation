revisions:
- from: Il convient donc qu’après nous être approchés d’exemples si nombreux et si remarquables, nous courbions la nuque et que, remplissant le rôle de l’obéissance, nous nous tenions tranquilles, afin de mettre fin à la vaine révolte et de parvenir, sans aucun reproche, au but qui nous est proposé dans la vérité.
  to: Il convient donc que, ayant devant nous de tels et de si nombreux exemples, nous courbions la nuque et que, accomplissant notre devoir d’obéissance, nous nous tenions tranquilles, afin que, ayant cessé cette vaine dissension, nous parvenions, sans aucun blâme, au but qui nous est proposé en vérité.
  rationale: La révision maintient la clause absente de l’OCR mais attestée dans le texte critique et déjà restaurée dans la piste d’audit anglaise. Elle améliore la fidélité de « tels et si nombreux », rend στάσις par « dissension » dans son contexte ecclésial, et remplace des formulations françaises raides ou légèrement interprétatives. La position de « en vérité » est conservée de manière à ne pas trancher davantage son lien syntaxique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:36Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction suit à juste titre le texte critique complet plutôt que l’OCR fautif, qui a perdu la séquence « τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας ἡσυχάσαι, ὅπως κοπάσαντες τῆς ματαίας στάσεως ἐπὶ τὸν ». Elle rend correctement l’appel à la soumission, au calme et à la cessation de la στάσις. Toutefois, « mettre fin à » est un peu plus transitif et actif que κοπάσαντες τῆς, qui signifie plutôt « ayant cessé de / renoncé à ». « Révolte » est possible, mais « dissension » rend plus exactement le conflit communautaire visé par στάσις dans 1 Clément.
  naturalness: « Après nous être approchés d’exemples si nombreux et si remarquables » est lourd et « remarquables » n’est pas exprimé par τοιούτοις. « De tels et de si nombreux exemples » est plus proche et plus naturel. « Remplissant le rôle de l’obéissance » est intelligible mais peu idiomatique en français moderne ; « accomplissant notre devoir d’obéissance » conserve le sens fonctionnel de τόπον ἀναπληροῦν sans cette raideur.
  terminology: « Courber la nuque » conserve utilement l’image de soumission. « Dissension » est retenu pour στάσις, sans imposer l’idée plus spécifique d’une rébellion politique. « Devoir d’obéissance » ne précise pas indûment envers qui cette obéissance est due. « Sans aucun blâme » est plus près de δίχα παντὸς μώμου que « sans aucun reproche ».
  issues:
  - severity: medium
    issue: Rendu de τοιούτοις καὶ τοσούτοις
    rationale: « Si nombreux et si remarquables » remplace « tels et si nombreux » par une appréciation (« remarquables ») qui n’est pas dans le grec.
  - severity: medium
    issue: Rendu de ματαίας στάσεως et de κοπάσαντες
    rationale: « Mettre fin à la vaine révolte » durcit légèrement le verbe et choisit un sens plus étroit pour στάσις. Le grec appelle les destinataires à cesser une vaine dissension.
  - severity: low
    issue: Idiomaticité de τὸν τῆς ὑπακοῆς τόπον ἀναπληρώσαντας
    rationale: « Remplissant le rôle de l’obéissance » est un calque syntaxique peu naturel ; « accomplissant notre devoir d’obéissance » est idiomatique tout en gardant l’indétermination de l’objet de l’obéissance.
  revised_text: Il convient donc que, ayant devant nous de tels et de si nombreux exemples, nous courbions la nuque et que, accomplissant notre devoir d’obéissance, nous nous tenions tranquilles, afin que, ayant cessé cette vaine dissension, nous parvenions, sans aucun blâme, au but qui nous est proposé en vérité.
  revised_footnotes: []
  revision_rationale: La révision maintient la clause absente de l’OCR mais attestée dans le texte critique et déjà restaurée dans la piste d’audit anglaise. Elle améliore la fidélité de « tels et si nombreux », rend στάσις par « dissension » dans son contexte ecclésial, et remplace des formulations françaises raides ou légèrement interprétatives. La position de « en vérité » est conservée de manière à ne pas trancher davantage son lien syntaxique.
