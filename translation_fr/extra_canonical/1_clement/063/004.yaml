  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
translation:
  language: fr
  text: Nous avons fait cela afin que vous sachiez que toute notre préoccupation a été, et demeure, que vous viviez bientôt en paix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φροντίς
  choice: préoccupation
  rationale: Exprime ici le souci attentif de la communauté romaine, dans un registre naturel et digne.
- source_word: καὶ γέγονεν καὶ ἔστιν
  choice: a été, et demeure
  rationale: Conserve la distinction temporelle entre le parfait γέγονεν et le présent ἔστιν, tout en rendant en français la continuité du souci.
- source_word: ἐν τάχει
  choice: rapidement
  rationale: Rend directement l'idée de promptitude sans préciser si elle concerne le rétablissement ou la durée de la paix.
- source_word: εἰρηνεῦσαι
  choice: vivre en paix
  rationale: Respecte la forme active de l'infinitif et son sens d'être ou de vivre en paix, sans introduire le passif « être rétablis dans la paix ».
theological_decisions:
- issue: Nature de la paix visée
  choice: vivre en paix
  alternative: être rétablis dans la paix
  rationale: Le grec emploie l'infinitif actif εἰρηνεῦσαι. La traduction retenue n'impose ni un agent extérieur qui restaurerait la paix ni une nuance confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. « De vous voir » rend naturellement la construction εἰς τὸ avec accusatif et infinitif, sans alourdir la phrase.
