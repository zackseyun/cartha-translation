revisions:
- from: Et nous avons envoyé des hommes dignes de confiance et réfléchis, qui, depuis leur jeunesse jusqu’à leur vieillesse, se sont conduits parmi nous d’une manière irréprochable ; ils seront aussi témoins entre vous et nous.
  to: Or, nous avons envoyé des hommes fidèles et sages, qui ont vécu parmi nous de manière irréprochable depuis leur jeunesse jusqu’à leur vieillesse ; ils seront aussi témoins entre vous et nous.
  rationale: La révision affine le rendu de σώφρονας et adopte une formulation française plus naturelle pour la conduite durable et irréprochable des délégués. Elle maintient l’ambiguïté du grec quant à l’objet précis de leur témoignage et ne requiert aucune note.
