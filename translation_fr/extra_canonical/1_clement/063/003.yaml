source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπέμψαμεν δὲ ἄνδρας πιστοὺς καὶ σώφρονας ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους ἀμέμπτως ἐν ἡμῖν, οἵτινες καὶ μάρτυρες ἔσονται μεταξὺ ὑμῶν καὶ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: fr
  text: Or, nous avons envoyé des hommes fidèles et sages, qui ont vécu parmi nous de manière irréprochable depuis leur jeunesse jusqu’à leur vieillesse ; ils seront aussi témoins entre vous et nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστούς
  choice: dignes de confiance
  rationale: Dans ce contexte, le terme qualifie des délégués fiables. Cette formulation française exprime clairement leur caractère digne de foi sans exclure leur fidélité.
- source_word: σώφρονας
  choice: réfléchis
  rationale: Le mot évoque la maîtrise de soi, le bon sens et la prudence. « Réfléchis » offre ici une désignation naturelle et accessible, sans réduire le sens à la seule prudence tactique.
- source_word: ἀναστραφέντας
  choice: se sont conduits
  rationale: Le participe renvoie à la manière de vivre et au comportement habituel ; « se sont conduits » restitue cette portée éthique dans un français courant et digne.
- source_word: ἀμέμπτως
  choice: d’une manière irréprochable
  rationale: Rend l’idée d’une conduite qui ne donne légitimement prise à aucun reproche, sans affirmer une perfection absolue.
- source_word: μάρτυρες
  choice: témoins
  rationale: Le sens contextuel est celui de personnes pouvant attester les échanges et les faits entre les deux communautés.
- source_word: μεταξὺ ὑμῶν καὶ ἡμῶν
  choice: entre vous et nous
  rationale: La traduction directe préserve la relation bilatérale et la légère ambiguïté quant à la fonction exacte de ces témoins.
theological_decisions:
- issue: Portée de πιστούς
  choice: dignes de confiance
  alternative: fidèles
  rationale: Le contexte de l’envoi de représentants favorise la fiabilité personnelle. « Fidèles » resterait possible, mais pourrait être compris avant tout comme une désignation confessionnelle.
- issue: Fonction des témoins
  choice: ils seront aussi témoins entre vous et nous
  alternative: ils attesteront aussi ce qui se passera entre vous et nous
  rationale: La formulation littérale conserve l’ambiguïté du grec sur ce dont ils témoigneront précisément, au lieu d’ajouter un objet absent du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure argumentative du grec tout en évitant une tournure trop littérale. Aucun marqueur de note n’est nécessaire.
