    rationale: Le terme français est très général et ne rend pas explicitement la fonction de surveillance/veille portée par ἐπίσκοποι. « Surveillants » est plus proche du grec sans imposer l’office épiscopal ultérieur.
  - severity: low
    issue: « après les avoir éprouvés par l’Esprit »
    rationale: Dans ce contexte de nomination, δοκιμάσαντες évoque l’examen et la reconnaissance d’aptitude. En français, « éprouver » suggère facilement une épreuve endurée; « reconnus aptes » communique mieux le résultat, tandis que « dans l’Esprit » maintient la valeur possiblement sphérique du datif.
