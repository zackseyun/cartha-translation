id: 1CLEM.42.4
reference: 1 Clement 42:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: fr
  text: Ainsi, prêchant dans les campagnes et les villes, ils établirent leurs premiers convertis[a], après les avoir reconnus aptes dans l’Esprit[b], comme surveillants[c] et diacres pour ceux qui allaient croire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs prémices », c’est-à-dire les premiers fruits de leur prédication.'
    reason: Préserver l’image agricole du grec tout en donnant dans le texte un français immédiatement compréhensible.
  - marker: b
    text: 'Ou : « par l’Esprit ».'
    reason: Signaler l’ambiguïté du datif grec entre moyen et sphère.
  - marker: c
    text: Le terme grec peut aussi être rendu par « épiscopes » ou « évêques »; il est à l’origine du mot « évêques ».
    reason: Rendre visible le terme ecclésial grec sans imposer au texte la forme ultérieure de la fonction épiscopale.
lexical_decisions:
- source_word: κατὰ χώρας ... καὶ πόλεις
  choice: de région en région et de ville en ville
  rationale: Cette tournure française naturelle rend la distribution exprimée par κατά avec les pluriels, plutôt qu’un simple déplacement « à travers » des territoires.
- source_word: τὰς ἀπαρχὰς αὐτῶν
  choice: leurs premiers convertis
  rationale: 'Littéralement « leurs prémices » : dans ce contexte missionnaire, l’image désigne vraisemblablement les premières personnes gagnées à la foi. Le sens imagé est conservé en note.'
- source_word: δοκιμάσαντες
  choice: après les avoir éprouvés
  rationale: Le verbe indique qu’ils ont été examinés et reconnus aptes; « éprouvés » conserve à la fois l’idée de mise à l’épreuve et d’approbation.
- source_word: τῷ πνεύματι
  choice: par l’Esprit
  rationale: Le datif peut exprimer le moyen ou la sphère. « Par l’Esprit » suit l’interprétation instrumentale la plus directe sans détailler le mode du discernement.
- source_word: ἐπισκόπους
  choice: responsables
  rationale: Le mot désigne des personnes chargées de veiller sur une communauté. « Responsables » est clair en français moderne et évite de projeter automatiquement la fonction épiscopale développée plus tard; une note donne les équivalents plus formels.
- source_word: τῶν μελλόντων πιστεύειν
  choice: pour ceux qui allaient croire
  rationale: Rend directement la construction indiquant les futurs croyants, sans la réduire aux croyants déjà présents.
theological_decisions:
- issue: Nature précise de l’épreuve « par l’Esprit »
  choice: Conserver « par l’Esprit »
  alternative: « après avoir discerné leur aptitude dans l’Esprit »
  rationale: Le grec ne précise ni la procédure ni s’il s’agit d’une révélation directe; la traduction ne doit pas imposer un modèle particulier de sélection des ministres.
- issue: Statut ecclésial des ἐπίσκοποι
  choice: Employer « responsables » avec une note lexicale
  alternative: « évêques », « épiscopes » ou « surveillants »
  rationale: « Évêques » pourrait suggérer anachroniquement une structure institutionnelle ultérieure, tandis que « surveillants » sonne peu naturel. « Responsables » communique la fonction générale, et la note préserve la portée du terme grec.
- issue: Référent des « prémices »
  choice: L’identifier dans le texte comme les premiers convertis
  alternative: Conserver littéralement « leurs prémices »
  rationale: Dans le contexte de la prédication apostolique et de la nomination de personnes, le référent humain est clair; la note maintient néanmoins l’image grecque.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le mouvement du grec et son vocabulaire ecclésial, tout en explicitant seulement ce qui est nécessaire à la compréhension ordinaire. Les notes maintiennent les images et ambiguïtés significatives.
