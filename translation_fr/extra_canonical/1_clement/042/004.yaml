  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la prédication dans les χώρας et les villes, la désignation des ἀπαρχαί, l’examen associé à l’Esprit, puis les fonctions d’ἐπίσκοποι et de διάκονοι au service de futurs croyants. Toutefois, « responsables » atténue trop le sens concret d’ἐπίσκοποι (« surveillants ») dans une traduction à équivalence optimale. « Éprouvés » peut en français évoquer surtout une épreuve subie plutôt qu’un examen suivi d’approbation, qui est le sens contextuel de δοκιμάζω.'
  naturalness: La phrase est fluide et de registre approprié. « De région en région et de ville en ville » est naturel, mais « dans les campagnes et les villes » rend plus immédiatement la paire géographique χώρας … πόλεις. « Après les avoir reconnus aptes dans l’Esprit » est plus idiomatique et plus précis ici que « après les avoir éprouvés par l’Esprit ».
  terminology: « Diacres » est juste. Pour ἐπίσκοποι, « surveillants » est le correspondant fonctionnel direct et évite à la fois l’anachronisme institutionnel potentiel de « évêques » et l’affaiblissement de « responsables ». « Premiers convertis » est une explicitation contextuellement fondée de ἀπαρχαί; la note conserve à juste titre l’image des « prémices ».
  issues:
