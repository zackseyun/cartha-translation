source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ τοῦτο οὐ καινῶς· ἐκ γὰρ δὴ πολλῶν χρόνων ἐγέγραπτο περὶ ἐπισκόπων καὶ διακόνων. οὕτως γάρ που λέγει ἡ γραφή· Καταστήσω τοὺς ἐπισκόπους αὐτῶν ἐν δικαιοσύνῃ καὶ τοὺς διακόνους αὐτῶν ἐν πίστει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
translation:
  language: fr
  text: 'Et cela n’était pas nouveau, car depuis bien longtemps déjà il était écrit au sujet des responsables et des diacres. En effet, l’Écriture dit quelque part en ces termes : « J’établirai leurs responsables dans la justice et leurs diacres dans la foi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la fidélité ».
    reason: πίστει peut évoquer soit la foi, soit la fidélité ou la fiabilité; la note préserve cette ambiguïté.
lexical_decisions:
- source_word: ἐπισκόπων / ἐπισκόπους
  choice: responsables
  rationale: Dans ce contexte ancien, le terme désigne ceux qui exercent une fonction de surveillance et de direction. « Responsables » reste naturel et évite d’imposer au texte le sens institutionnel plus tardif d’« évêques ».
- source_word: διακόνων / διακόνους
  choice: diacres
  rationale: Le contexte traite de fonctions reconnues dans la communauté; « diacres » est ici le terme français consacré et demeure distinct de l’emploi plus général de « serviteurs ».
- source_word: ἐκ γὰρ δὴ πολλῶν χρόνων
  choice: car depuis bien longtemps déjà
  rationale: Cette formulation rend la longue durée exprimée par πολλῶν χρόνων ainsi que la nuance d’insistance de δή, dans un français idiomatique.
- source_word: οὕτως γάρ που λέγει ἡ γραφή
  choice: En effet, l’Écriture dit quelque part en ces termes
  rationale: « En ces termes » préserve οὕτως, tandis que « quelque part » rend l’indéfini που de la formule de citation.
- source_word: πίστει
  choice: fidélité
  rationale: Dans le parallélisme avec « justice » et appliqué à la qualité de l’exercice d’une charge, « fidélité » est plus naturel que « foi », sans exclure la notion de fiabilité loyale.
theological_decisions:
- issue: Portée institutionnelle de ἐπίσκοποι
  choice: responsables
  alternative: évêques / surveillants
  rationale: « Évêques » risquerait de projeter une structure ecclésiastique ultérieure sur le passage, tandis que « surveillants » serait formel mais moins naturel en français actuel. « Responsables » conserve la fonction générale sans trancher son développement institutionnel.
- issue: Sens de πίστις dans la citation
  choice: fidélité
  alternative: foi
  rationale: Le contexte peut évoquer soit la foi, soit la fidélité fiable. « Fidélité » convient mieux au parallélisme éthique, mais l’ambivalence lexicale doit être signalée.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en évitant les calques. La formule de citation conserve à la fois οὕτως (« en ces termes ») et που (« quelque part »).
