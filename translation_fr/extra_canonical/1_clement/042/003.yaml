id: 1CLEM.42.3
reference: 1 Clement 42:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
translation:
  language: fr
  text: Après avoir reçu des instructions et avoir été pleinement assurés par la résurrection de notre Seigneur Jésus Messie, et ayant été affermis dans la parole de Dieu, ils partirent dans la pleine assurance de l’Esprit Saint, annonçant la bonne nouvelle que le royaume de Dieu allait venir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en rendant plus directement la forme grecque : « est sur le point de venir ».'
    reason: Le présent infinitif μέλλειν dans le discours indirect peut être représenté soit par la concordance française « allait venir », soit par une forme qui reproduit plus directement la temporalité de l’annonce rapportée.
lexical_decisions:
- source_word: παραγγελίας
  choice: instructions
  rationale: Le nom désigne des consignes ou directives reçues; « instructions » convient au contexte de l’envoi des apôtres.
- source_word: πληροφορηθέντες / πληροφορίας
  choice: avoir acquis une pleine assurance / avec la pleine assurance
  rationale: La répétition française reflète celle de la racine grecque, qui exprime ici une ferme conviction, sans réduire le second emploi à une simple hardiesse.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus Messie
  rationale: « Messie » rend le titre Χριστός de manière intelligible et conserve sa valeur messianique.
- source_word: εὐαγγελιζόμενοι
  choice: annonçant comme bonne nouvelle
  rationale: Cette formulation restitue la valeur verbale d’εὐαγγελίζομαι et introduit naturellement le contenu de l’annonce.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: royaume de Dieu
  rationale: « Royaume de Dieu » est l’expression française courante et peut désigner aussi bien la souveraineté que le domaine royal selon le contexte.
- source_word: μέλλειν ἔρχεσθαι
  choice: allait venir
  rationale: Dans ce discours indirect dépendant d’un verbe au passé, « allait venir » est naturel en français tout en exprimant la venue attendue.
theological_decisions:
- issue: Rapport de l’assurance à l’Esprit saint
  choice: la pleine assurance de l’Esprit saint
  alternative: la pleine assurance donnée par l’Esprit saint
  rationale: Le génitif grec πνεύματος ἁγίου ne précise pas explicitement le rapport exact; la formulation retenue préserve cette concision et cette ambiguïté.
- issue: Temporalité de la venue du royaume
  choice: allait venir
  alternative: est sur le point de venir
  rationale: Le rendu principal suit la concordance naturelle des temps en français dans le discours indirect, tandis que la note signale la forme temporelle plus directe que permet le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale grecque est déployée sans perdre l’enchaînement logique; la répétition d’« assurance » est volontaire afin de refléter la reprise lexicale de l’original.
