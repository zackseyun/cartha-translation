    rationale: παραγγελίας signifie « des instructions »; le grec ne comporte pas de possessif.
  - severity: low
    issue: Formulation de l’annonce
    rationale: εὐαγγελιζόμενοι se rend naturellement par « annonçant la bonne nouvelle », sans l’ajout interprétatif « comme ».
  - severity: low
    issue: Enchaînement participial un peu lourd
    rationale: « puis avoir été affermis » est moins fluide que « et ayant été affermis », tout en conservant la relation syntaxique au verbe principal.
