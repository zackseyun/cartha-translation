id: 1CLEM.42.1
reference: 1 Clement 42:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: fr
  text: Les apôtres ont reçu pour nous la bonne nouvelle de la part du Seigneur Jésus Christ ; Jésus, le Christ, a été envoyé par Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ ἀπόστολοι
  choice: Les apôtres
  rationale: Correspondance française directe et naturelle du terme grec désignant les envoyés.
- source_word: ἡμῖν
  choice: pour nous
  rationale: Le datif peut exprimer le bénéficiaire ; ce choix conserve le sens de la transmission destinée à la communauté.
- source_word: εὐηγγελίσθησαν
  choice: ont reçu la bonne nouvelle
  rationale: Le passif grec signifie ici que les apôtres ont été destinataires de l'annonce ; cette formulation française évite l'ambiguïté de « ont été évangélisés ».
- source_word: ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: de la part du Seigneur Jésus Christ
  rationale: « De la part de » rend clairement la provenance personnelle exprimée par ἀπό.
- source_word: ἐξεπέμφθη
  choice: a été envoyé
  rationale: Rend le passif aoriste de ἐκπέμπω sans surtraduire le préverbe par une expression française lourde comme « envoyé au-dehors ».
- source_word: ἀπὸ τοῦ θεοῦ
  choice: par Dieu
  rationale: Avec un verbe passif, ἀπό marque ici l'agent ou la source de l'envoi ; « par Dieu » est idiomatique et fidèle.
theological_decisions:
- issue: Rendu de Χριστός
  choice: Christ
  alternative: Messie
  rationale: Dans ce texte chrétien ancien, « Christ » demeure le titre français conventionnel et permet de reproduire la reprise grecque « Jésus Christ / Jésus, le Christ » sans effacer sa valeur titulaire.
- issue: Relation entre les deux propositions
  choice: point-virgule sans conjonction ajoutée
  alternative: ajouter « et »
  rationale: Le grec juxtapose les propositions sans καί. Le point-virgule préserve leur parallélisme et la chaîne de mission sans introduire un lien absent du texte.
- issue: Article dans Ἰησοῦς ὁ Χριστός
  choice: Jésus, le Christ
  alternative: Jésus Christ
  rationale: L'article grec met ici le titre en relief. La virgule française fait entendre cette apposition sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle est conservée, avec une formulation accessible qui distingue la réception de la bonne nouvelle par les apôtres et l'envoi de Jésus par Dieu.
