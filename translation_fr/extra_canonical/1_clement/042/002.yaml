id: 1CLEM.42.2
reference: 1 Clement 42:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ Χριστὸς οὖν ἀπὸ τοῦ θεοῦ καὶ οἱ ἀπόστολοι ἀπὸ τοῦ Χριστοῦ· ἐγένοντο οὖν ἀμφότερα εὐτάκτως ἐκ θελήματος θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
translation:
  language: fr
  text: Le Messie vient donc de Dieu, et les apôtres viennent du Messie ; ces deux faits se sont donc produits de façon ordonnée, par la volonté de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: Rend le titre grec par son sens plutôt que par sa forme francisée, conformément à la couche de consultation fournie.
- source_word: ἀπὸ
  choice: vient de / viennent du
  rationale: Exprime naturellement en français la provenance ou l’envoi marqué par ἀπό dans les deux propositions parallèles.
- source_word: ἀμφότερα
  choice: ces deux choses
  rationale: Le neutre pluriel renvoie aux deux réalités ou étapes énoncées, à savoir la venue du Messie depuis Dieu et celle des apôtres depuis le Messie.
- source_word: εὐτάκτως
  choice: dans l’ordre
  rationale: Conserve l’idée d’un déroulement ordonné et approprié sans surcharger le texte.
- source_word: ἐκ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Tournure française idiomatique exprimant que la volonté divine est la source déterminante de cet ordre.
theological_decisions:
- issue: Sens de la provenance dans « ἀπὸ τοῦ θεοῦ » et « ἀπὸ τοῦ Χριστοῦ »
  choice: vient de / viennent du
  alternative: a été envoyé par / ont été envoyés par
  rationale: Le contexte évoque vraisemblablement l’envoi, mais le grec emploie ici une simple préposition de provenance. La traduction retenue préserve cette latitude sans préciser davantage que le texte.
- issue: Portée de « ἀμφότερα »
  choice: ces deux choses se sont ainsi réalisées
  alternative: tous deux ont donc été établis
  rationale: Le neutre ἀμφότερα vise plus naturellement les deux faits ou relations précédemment décrits que les personnes elles-mêmes.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme du grec est conservé, avec une syntaxe naturelle et sans explicitation doctrinale de la relation entre Dieu, le Messie et les apôtres.
