  rationale: Révision limitée visant à rendre explicitement les deux occurrences de οὖν et à exprimer plus nettement la valeur qualitative de εὐτάκτως, tout en préservant la provenance non spécifiée par ἀπό et le caractère neutre de ἀμφότερα.
