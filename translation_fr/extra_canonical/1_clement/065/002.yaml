  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
translation:
  language: fr
  text: afin qu’ils nous annoncent au plus vite la paix et la concorde que nous appelons de nos vœux et désirons ardemment[a], et qu’ainsi nous puissions, nous aussi, nous réjouir plus vite de votre stabilité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la paix et la concorde pour lesquelles nous avons prié et que nous avons ardemment désirées ».'
    reason: Le grec permet d’exprimer les deux adjectifs soit par une tournure idiomatique, soit en explicitant leur rapport avec la prière et le désir.
lexical_decisions:
- source_word: εὐκταίαν καὶ ἐπιποθήτην
  choice: que nous appelons de nos vœux et désirons ardemment
  rationale: 'Cette formulation naturelle conserve les deux idées distinctes : ce qui fait l’objet de la prière ou des vœux, et ce qui est vivement désiré.'
- source_word: εὐσταθείας
  choice: stabilité
  rationale: Le terme désigne ici une situation ferme, stable et bien établie; « stabilité » préserve cette portée sans la réduire au seul bon ordre.
