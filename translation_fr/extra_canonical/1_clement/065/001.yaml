  yaml_path: translation/extra_canonical/1_clement/065/001.yaml
  text: Send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: fr
  text: Renvoyez-nous sans tarder, dans la paix et avec joie, ceux qui ont été envoyés par nous — Claudius Éphèbe, Valerius Bito, ainsi que Fortunatus —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπέμψατε
  choice: Renvoyez-nous
  rationale: L’impératif aoriste demande le retour des délégués auprès des expéditeurs; « renvoyer » exprime naturellement ce mouvement en français.
- source_word: ἐν τάχει
  choice: sans tarder
  rationale: Rend l’idée de rapidité par une tournure française courante et digne, sans surtraduire l’urgence.
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  choice: dans la paix et avec joie
  rationale: Conserve les deux compléments et leur distinction formelle.
- source_word: Τοὺς … ἀπεσταλμένους ἀφʼ ἡμῶν
  choice: ceux que nous vous avons envoyés
  rationale: Formulation idiomatique qui explicite le destinataire implicite dans le contexte de l’envoi, tout en conservant l’origine des délégués.
- source_word: Κλαύδιον Ἔφηβον καὶ Οὐαλέριον Βίτωνα … Φορτουνάτῳ
  choice: Claudius Éphèbe et Valerius Biton … Fortunatus
  rationale: Les noms sont transcrits sous des formes françaises lisibles, en conservant les formes latines traditionnelles des gentilices et de Fortunatus.
