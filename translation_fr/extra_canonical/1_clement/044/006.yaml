source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρῶμεν γάρ, ὅτι ἐνίους ὑμεῖς μετηγάγετε καλῶς πολιτευομένους ἐκ τῆς ἀμέμπτως αὐτοῖς τετιμημένης λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
translation:
  language: fr
  text: Car nous voyons que vous avez écarté certaines personnes qui se conduisaient bien du ministère qu’elles avaient honoré de manière irréprochable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du ministère qui avait été honoré par elles de manière irréprochable ».'
    reason: La note fait apparaître la construction passive du grec, rendue plus naturellement à l’actif dans le texte.
lexical_decisions:
- source_word: μετηγάγετε
  choice: vous avez écarté
  rationale: Le verbe exprime ici le fait de retirer ces hommes de leur fonction. « Écarter du ministère » est direct et naturel, sans imposer l’idée plus précise d’une destitution officielle.
- source_word: καλῶς πολιτευομένους
  choice: qui se conduisaient bien
  rationale: πολιτεύομαι désigne la manière de vivre ou de se conduire; cette formulation conserve le jugement positif général du grec.
- source_word: λειτουργίας
  choice: ministère
  rationale: Dans le contexte des responsables de la communauté, « ministère » rend le service ou la fonction exercée sans en préciser davantage la nature.
- source_word: ἀμέμπτως αὐτοῖς τετιμημένης
  choice: qu’ils avaient honoré d’une manière irréprochable
  rationale: Le parfait passif τετιμημένης avec αὐτοῖς comme agent signifie que le ministère avait été honoré par eux; ἀμέμπτως qualifie cette manière de l’honorer.
theological_decisions:
- issue: Nature du ministère et statut des personnes écartées
  choice: Employer le terme général « ministère » et parler d’hommes « écartés »
  alternative: Préciser une charge ecclésiastique ou traduire par « destitués »
  rationale: Le verset évoque bien une fonction communautaire, mais ne la nomme pas plus précisément ici; la traduction évite donc d’importer une structure confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant une tournure passive lourde.
