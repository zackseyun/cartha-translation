    issue: Atténuation de la négation de la crainte
    rationale: « N’ont pas à craindre » peut suggérer qu’ils auraient des raisons de craindre mais ne le devraient pas. Le grec affirme plutôt qu’ils ne craignent pas qu’une personne les déplace.
  - severity: low
    issue: Tour français peu naturel pour τέλειαν ἀνάλυσιν
    rationale: « Ont connu un départ ... pleinement accompli » est lourd. « Ont eu ... un départ pleinement accompli » est plus direct tout en gardant « départ » pour ἀνάλυσις.
