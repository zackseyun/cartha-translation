source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
translation:
  language: fr
  text: 'Heureux les anciens qui ont pris la route avant nous[a] : ils ont eu, au moment opportun, un départ pleinement accompli[b]. Car ils ne craignent pas que quelqu’un les retire de la place qui leur a été donnée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui ont cheminé en avant » ; il s’agit des anciens morts avant les destinataires.'
    reason: L’image grecque du voyage peut ne pas être immédiatement comprise comme une allusion à ceux qui sont déjà morts.
  - marker: b
    text: C’est-à-dire leur mort, présentée comme un départ.
    reason: Clarifie l’euphémisme ἀνάλυσις tout en conservant sa métaphore dans le texte.
lexical_decisions:
- source_word: προοδοιπορήσαντες
  choice: qui ont pris la route avant nous
  rationale: Le verbe évoque ceux qui ont cheminé en avant ou sont partis les premiers. Cette formulation conserve l’image du voyage, tandis que « avant nous », implicite dans l’expression relationnelle, rend le français naturel.
- source_word: ἀνάλυσιν
  choice: départ
  rationale: Dans ce contexte, le nom désigne par euphémisme la mort, envisagée comme un départ. « Départ » préserve cette image sans l’expliciter abusivement.
- source_word: ἔγκαιρον καὶ τελείαν
  choice: au moment opportun et pleinement accompli
  rationale: ἔγκαιρος indique ce qui vient au temps convenable; τέλειος exprime ici le caractère complet, achevé, du départ.
- source_word: τοῦ δεδομένου αὐτοῖς τόπου
  choice: de la place qui leur a été donnée
  rationale: δεδομένου vient de δίδωμι, « donner ». Le choix respecte le changement lexical par rapport aux verbes d’établissement ou de nomination employés dans le contexte précédent.
theological_decisions:
- issue: Rapport entre le départ des anciens et la mort
  choice: Conserver la métaphore du « départ » dans le texte et préciser en note qu’il s’agit de la mort.
  alternative: Traduire directement par « mort ».
  rationale: Le grec emploie une désignation euphémique qui porte une image théologique et rhétorique; l’explicitation en note assure la compréhension sans effacer cette image.
- issue: Sens de la « place » donnée
  choice: Laisser « place » sans préciser s’il s’agit d’une fonction ecclésiale, d’un rang ou d’une condition après la mort.
  alternative: Traduire par « charge » ou « fonction ».
  rationale: Le contexte concerne les anciens et leur stabilité, mais τόπος demeure assez général. Une précision institutionnelle résoudrait une ambiguïté que le texte conserve.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images du chemin et du départ ainsi que la généralité de « place », sans importer une interprétation confessionnelle ou institutionnelle précise.
