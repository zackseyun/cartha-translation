revisions:
- from: 'Heureux les anciens qui ont pris la route avant nous[a] : ils ont connu un départ[b] au moment opportun et pleinement accompli. En effet, ils n’ont pas à craindre que quelqu’un les écarte de la place qui leur a été donnée.'
  to: 'Heureux les anciens qui ont pris la route avant nous[a] : ils ont eu, au moment opportun, un départ pleinement accompli[b]. Car ils ne craignent pas que quelqu’un les retire de la place qui leur a été donnée.'
  rationale: 'La révision améliore l’idiomaticité de la proposition sur le départ et remplace la tournure modale « n’ont pas à craindre » par l’assertion directe exigée par le grec. Elle maintient les choix solides du projet : l’image de la route et du départ, la note explicative sur la mort, et la neutralité de « place qui leur a été donnée ».'
