source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ οἱ ἀπόστολοι ἡμῶν ἔγνωσαν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι ἔρις ἔσται ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/001.yaml
  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office.
translation:
  language: fr
  text: Nos apôtres ont appris, par notre Seigneur Jésus-Christ, qu’il y aurait un conflit au sujet de l’appellation de la fonction de surveillance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « au sujet du nom de la fonction de surveillance ». « Appellation » peut aussi se comprendre comme « titre »; ἐπισκοπή peut désigner la fonction de surveillance ou, dans une terminologie plus institutionnelle, l’« épiscopat ».
    reason: La note explicite la valeur de ὄνομα et les possibilités de rendu de ἐπισκοπή, sans présupposer une forme ultérieure d’organisation ecclésiale.
lexical_decisions:
- source_word: ἔγνωσαν
  choice: ont appris
  rationale: Rend naturellement l’idée qu’ils ont acquis cette connaissance par l’intermédiaire du Seigneur, sans préciser un mode de révélation absent du grec.
- source_word: ἔρις
  choice: des rivalités
  rationale: Exprime la contestation conflictuelle annoncée; le pluriel français est idiomatique malgré le singulier collectif grec.
- source_word: ἐπὶ τοῦ ὀνόματος
  choice: au sujet de
  rationale: Dans ce contexte, «nom» désigne l’intitulé ou la réalité de la fonction; une traduction littérale par «sur le nom» serait obscure en français.
- source_word: τῆς ἐπισκοπῆς
  choice: de la charge de responsable
  rationale: ἐπισκοπή désigne ici la fonction de surveillance ou de direction, plutôt que la personne qui l’exerce. Cette formulation évite de projeter automatiquement le sens institutionnel plus tardif d’«épiscopat».
theological_decisions:
- issue: Sens ecclésial de ἐπισκοπή
  choice: charge de responsable
  alternative: épiscopat / charge d’évêque / fonction de surveillance
  rationale: Le grec vise une fonction de supervision, mais son degré exact d’institutionnalisation demeure discuté. La traduction choisie reste accessible et ne présuppose pas une structure ecclésiastique ultérieure.
- issue: Forme du nom Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: «Jésus-Christ» est la forme française naturelle et digne du nom-titre grec; le contexte n’exige pas de mettre spécialement en relief le sens messianique de Χριστός.
translation_notes:
  register: Français international moderne, simple et digne. «Nos apôtres aussi» rattache explicitement cette phrase au développement précédent; «responsable» est employé pour rendre la fonction sans technicisme confessionnel.
