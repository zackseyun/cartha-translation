id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
translation:
  language: fr
  text: Ainsi donc, ceux qui ont été établis par eux, ou par la suite par d’autres hommes estimés, avec l’assentiment de toute l’Église, qui ont servi de manière irréprochable le troupeau du Christ, avec humilité, dans la paix et sans prétention, et auxquels tous ont rendu un bon témoignage pendant longtemps — ceux-là, nous estimons qu’il n’est pas juste de les écarter du ministère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατασταθέντας
  choice: ont été établis
  rationale: Rend l’idée d’une désignation officielle sans préciser davantage une procédure que le grec ne décrit pas.
- source_word: μεταξὺ
  choice: par la suite
  rationale: Dans ce contexte de succession, le terme indique que d’autres hommes estimés ont procédé ultérieurement à ces désignations.
- source_word: ἐλλογίμων ἀνδρῶν
  choice: hommes estimés
  rationale: Exprime la bonne réputation et la considération attachées à ἐλλόγιμος.
- source_word: συνευδοκησάσης τῆς ἐκκλησίας πάσης
  choice: avec l’assentiment de toute l’Église
  rationale: Conserve l’idée que l’Église entière approuvait conjointement ces désignations.
- source_word: λειτουργήσαντας
  choice: ont servi
  rationale: Le verbe désigne ici l’exercice d’un service auprès du troupeau, sans imposer un sens exclusivement liturgique.
- source_word: ἀβαναύσως
  choice: sans prétention
  rationale: Rend de façon naturelle l’idée d’un service dépourvu de vulgarité, d’affectation ou de recherche d’importance personnelle.
- source_word: ἀποβάλλεσθαι τῆς λειτουργίας
  choice: les écarter du ministère
  rationale: Traduit l’exclusion ou la destitution de la fonction de service exercée dans l’Église.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Christ
  alternative: le Messie
  rationale: Dans cette lettre chrétienne, Χριστός fonctionne naturellement comme le titre usuel de Jésus; « le Christ » demeure exact et idiomatique en français, sans effacer son origine messianique.
- issue: Nature de la λειτουργία
  choice: ministère
  alternative: service
  rationale: Le contexte porte sur une charge ecclésiale dont certains responsables risquent d’être destitués; « ministère » restitue cette dimension fonctionnelle sans identifier une structure confessionnelle précise.
- issue: Portée de οὐ δικαίως
  choice: nous estimons qu’il n’est pas juste de les écarter
  alternative: nous estimons qu’ils sont injustement écartés
  rationale: Cette formulation préserve la nuance normative du grec et évite d’affirmer nécessairement que leur destitution est déjà accomplie.
translation_notes:
  register: Français moderne, digne et accessible. La longue construction grecque avec reprise démonstrative (τοὺς… τούτους) est conservée au moyen de « ceux… — ceux-là », afin de préserver l’accumulation rhétorique tout en restant grammaticale et lisible.
