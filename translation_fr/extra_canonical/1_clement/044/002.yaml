id: 1CLEM.44.2
reference: 1 Clement 44:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ταύτην οὖν τὴν αἰτίαν πρόγνωσιν εἰληφότες τελείαν κατέστησαν τοὺς προειρημένους καὶ μεταξὺ ἐπινομὴν δεδώκασιν, ὅπως, ἐὰν κοιμηθῶσιν, διαδέξωνται ἕτεροι δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
translation:
  language: fr
  text: 'C’est donc pour cette raison que, ayant reçu une parfaite connaissance de l’avenir, ils établirent dans leur charge les hommes déjà mentionnés. Puis ils ajoutèrent cette disposition : si ceux-ci venaient à s’endormir[a], d’autres hommes ayant fait leurs preuves leur succéderaient dans leur ministère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : venaient à mourir.'
    reason: Le grec emploie « s’endormir » comme euphémisme pour la mort.
lexical_decisions:
- source_word: πρόγνωσιν … τελείαν
  choice: une parfaite connaissance de l’avenir
  rationale: Rend directement l’idée d’une connaissance complète et anticipée, tout en conservant le fait qu’elle a été « reçue ».
- source_word: κατέστησαν
  choice: ils établirent dans leur charge
  rationale: Le verbe désigne ici l’établissement officiel des hommes mentionnés dans leur fonction, sans imposer un vocabulaire confessionnel ultérieur.
- source_word: μεταξὺ ἐπινομὴν δεδώκασιν
  choice: Puis ils ajoutèrent cette disposition
  rationale: Expression grecque difficile; cette formulation naturelle rend l’idée d’une mesure ou prescription complémentaire donnée par la suite.
- source_word: δεδοκιμασμένοι ἄνδρες
  choice: d’autres hommes ayant fait leurs preuves
  rationale: δεδοκιμασμένοι indique des personnes éprouvées, examinées et reconnues aptes.
- source_word: λειτουργίαν
  choice: ministère
  rationale: Dans ce contexte communautaire, « ministère » exprime la fonction de service sans préciser davantage sa forme institutionnelle.
theological_decisions:
- issue: Nature de la succession envisagée
  choice: « leur succéderaient dans leur ministère »
  alternative: « prendraient leur place dans leur service »
  rationale: La traduction conserve l’idée explicite de succession dans la fonction, sans développer une doctrine ultérieure de succession institutionnelle.
- issue: Sens de κοιμηθῶσιν
  choice: « venaient à s’endormir » avec note explicative
  alternative: « venaient à mourir »
  rationale: Le maintien de l’euphémisme traditionnel préserve l’image grecque, tandis que la note en donne clairement le sens contextuel.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement déployée en deux phrases pour rendre clairement l’enchaînement du raisonnement et la portée de la disposition complémentaire.
