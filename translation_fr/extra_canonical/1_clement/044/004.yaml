  source_fidelity: Le projet rend correctement la litote (« pas un petit péché »), le futur conditionnel grec, ἀποβάλωμεν (« écarter ») et les deux qualifications ἀμέμπτως καὶ ὁσίως. Toutefois, « les offrandes du ministère de responsables » est une formulation française peu idiomatique et son rapport syntaxique avec ἐπισκοπῆς demeure insuffisamment explicite. Le grec autorise la lecture où le génitif qualifie δῶρα, tout en permettant, dans le contexte, de comprendre l’exclusion comme une destitution de la charge.
  naturalness: « Ministère de responsables » est lourd et peu naturel en français international actuel. « Charge de responsables » est plus clair pour une responsabilité ecclésiale collective et évite d’imposer le titre ultérieur d’« évêque ». « De manière irréprochable et pieuse » rend la coordination avec sobriété.
  terminology: « Offrandes » convient à δῶρα dans ce contexte liturgique. « Charge de responsables » rend ἐπισκοπή sans supposer un seul titulaire ni projeter une structure ecclésiale ultérieure. La note doit conserver l’autre rattachement possible, selon lequel les personnes sont écartées de cette charge.
