source:
  edition: Funk 1901 (normalized OCR)
  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
translation:
  language: fr
  text: Car ce ne sera pas un péché léger pour nous si nous écartons ceux qui ont offert, de manière irréprochable et pieuse, les offrandes liées à la charge de responsables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si nous destituons de leur charge de responsables ceux qui ont offert les offrandes de manière irréprochable et pieuse ». La construction grecque permet aussi de rattacher « de responsables » à l’action d’écarter plutôt qu’aux « offrandes ».'
    reason: 'Préserver l’ambiguïté syntaxique de τῆς ἐπισκοπῆς : le génitif peut qualifier les offrandes ou désigner la charge dont les personnes sont écartées.'
lexical_decisions:
- source_word: ἁμαρτία ... οὐ μικρά
  choice: un péché qui n’est pas petit
  rationale: Conserve la litote grecque, rendue naturellement dans la phrase par « ce ne sera pas un petit péché ».
- source_word: ἀποβάλωμεν
  choice: nous écartons
  rationale: Exprime l’idée de retirer ou chasser quelqu’un de sa place sans imposer, dans le texte principal, le sens technique plus précis de « destituer ».
- source_word: τὰ δῶρα
  choice: les offrandes
  rationale: Dans ce contexte ecclésial, le terme peut désigner les dons présentés à Dieu; « offrandes » est plus précis que le français général « dons ».
- source_word: ἐπισκοπῆς
  choice: ministère de responsables
  rationale: Rend l’idée de surveillance ou de responsabilité ecclésiale sans importer le titre français plus tardif et potentiellement anachronique d’« évêque ».
- source_word: ἀμέμπτως καὶ ὁσίως
  choice: d’une manière irréprochable et avec piété
  rationale: 'Reproduit les deux adverbes: conduite sans reproche et attitude religieusement fidèle.'
theological_decisions:
- issue: Lien syntaxique du génitif τῆς ἐπισκοπῆς
  choice: 'Le texte principal le rattache à « les offrandes »: « les offrandes du ministère de responsables ».'
  alternative: 'Le rattacher à l’action d’écarter: « destituer de leur ministère de responsables ceux qui ont présenté les offrandes ».'
  rationale: L’ordre des mots permet la lecture du texte principal, mais la construction grecque demeure difficile et l’autre analyse correspond bien au contexte de la destitution des responsables; l’ambiguïté est donc signalée en note.
translation_notes:
  register: Français international actuel, sobre et digne. « Ministère de responsables » évite de projeter automatiquement l’épiscopat ultérieur sur ἐπισκοπή, tandis que « offrandes » garde la possible portée liturgique de τὰ δῶρα.
