id: 1CLEM.17.3
reference: 1 Clement 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται· Ἰὼβ δὲ ἦν δίκαιος καὶ ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/003.yaml
  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
translation:
  language: fr
  text: 'Il est aussi écrit au sujet de Job : « Job était juste et irréprochable, sincère, craignant Dieu et s’abstenant de tout mal. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: juste
  rationale: Correspondance naturelle et précise pour décrire la droiture morale de Job.
- source_word: ἄμεμπτος
  choice: irréprochable
  rationale: Exprime l’absence de motif légitime de blâme sans suggérer une perfection métaphysique.
- source_word: ἀληθινός
  choice: sincère
  rationale: Appliqué à une personne, le terme évoque ici un caractère vrai, authentique et sans fausseté ; « sincère » est plus naturel en français moderne que « véridique » dans cette série de qualités.
- source_word: θεοσεβής
  choice: craignant Dieu
  rationale: Rend l’idée traditionnelle de révérence et de piété envers Dieu, sans réduire le terme à la peur.
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  choice: se tenant à l’écart de tout mal
  rationale: ἀπέχομαι avec ἀπό signifie se garder ou se tenir éloigné de quelque chose ; cette formulation conserve l’idée d’abstention volontaire.
theological_decisions:
- issue: Portée de « irréprochable » appliqué à Job
  choice: irréprochable
  alternative: parfait
  rationale: Le grec ἄμεμπτος signifie qu’on ne peut lui adresser de reproche ; « parfait » risquerait d’introduire une affirmation plus absolue que le texte.
translation_notes:
  register: Français moderne, clair et digne. La tournure introductive reste proche du grec tout en évitant le calque lourd « il est ainsi écrit ». La citation conserve la succession des qualités attribuées à Job.
