revisions:
- from: 'Abraham reçut un témoignage éclatant et fut appelé ami de Dieu. Contemplant intensément la gloire de Dieu, il dit avec humilité : « Moi, je ne suis que terre et cendre. »'
  to: 'Abraham reçut un grand témoignage et fut appelé ami de Dieu. Contemplant attentivement la gloire de Dieu, il dit avec humilité : « Mais moi, je suis terre et cendre. »'
  rationale: 'La révision resserre deux formulations afin de suivre plus exactement le grec : μεγάλως est rendu sans la nuance supplémentaire d’« éclatant », et la citation conserve l’assertion simple εἰμι ainsi que le contraste de δέ. La division en deux phrases, le participe circonstanciel et le registre du projet sont maintenus.'
