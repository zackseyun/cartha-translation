  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: fr
  text: 'Abraham reçut un grand témoignage et fut appelé ami de Dieu. Contemplant attentivement la gloire de Dieu, il dit avec humilité : « Mais moi, je suis terre et cendre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  choice: reçut un témoignage éclatant
  rationale: Conserve la tournure passive et l’idée d’un témoignage particulièrement grand, dans un français naturel et digne.
- source_word: φίλος προσηγορεύθη τοῦ θεοῦ
  choice: fut appelé ami de Dieu
  rationale: Rend directement le titre attribué à Abraham sans ajouter d’article absent du grec.
- source_word: ἀτενίζων
  choice: contemplant intensément
  rationale: Exprime le regard soutenu et attentif porté sur la gloire de Dieu.
- source_word: ταπεινοφρονῶν
  choice: avec humilité
  rationale: Rend l’attitude intérieure d’abaissement de soi sans la lourdeur de « avec humilité d’esprit ».
- source_word: γῆ καὶ σποδός
  choice: terre et cendre
  rationale: Suit précisément les substantifs grecs et conserve l’image traditionnelle de Genèse 18.27.
theological_decisions:
- issue: Force restrictive de la déclaration d’Abraham
  choice: « Moi, je ne suis que terre et cendre »
  alternative: « Mais moi, je suis terre et cendre »
  rationale: « Ne… que » communique naturellement en français l’humilité exprimée par l’énoncé, tandis que « moi » marque le contraste porté par ἐγὼ δέ. La formulation ne développe pas cette humilité en doctrine anthropologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La seconde phrase est séparée de la première pour éviter une coordination trop lourde, tout en préservant la progression du grec.
