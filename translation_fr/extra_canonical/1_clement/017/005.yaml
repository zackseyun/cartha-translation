  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
translation:
  language: fr
  text: 'Moïse fut appelé fidèle dans toute sa maison et, par son service, Dieu jugea l’Égypte au moyen des fléaux et des tourments qui la frappèrent. Pourtant, même lui, malgré la grande gloire qu’il reçut, ne devint pas orgueilleux, mais il dit, lorsqu’un message divin lui fut adressé au buisson : « Qui suis-je pour que tu m’envoies ? Moi, j’ai la voix faible et la langue lente. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: fidèle dans toute sa maison
  rationale: Conserve la formulation scripturaire et l’ambiguïté du possessif αὐτοῦ, qui peut renvoyer à Dieu dans le contexte de la citation traditionnelle.
- source_word: ὑπηρεσίας
  choice: service
  rationale: Rend le service accompli par Moïse sans surcharger le terme d’une fonction ecclésiastique absente du contexte.
- source_word: διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν
  choice: au moyen des fléaux et des tourments qui la frappèrent
  rationale: Exprime la valeur instrumentale de διά et rattache naturellement αὐτῶν à l’Égypte en français, sans employer un possessif maladroit.
- source_word: μεγαλοφρόνησεν
  choice: ne devint pas orgueilleux
  rationale: Restitue le sens négatif de l’orgueil ou de la hauteur, en contraste avec l’humilité de Moïse.
- source_word: χρηματισμοῦ
  choice: un message divin
  rationale: Le nom désigne ici une communication d’origine divine; cette expression est claire et naturelle en français moderne.
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  choice: j’ai la voix faible et la langue lente
  rationale: Préserve les deux images grecques et leur caractère concret plutôt que de les réduire à une simple difficulté d’élocution.
theological_decisions:
- issue: Référent de « sa maison »
  choice: Conserver « sa maison » sans explicitation
  alternative: « toute la maison de Dieu » ou « toute sa propre maison »
  rationale: Le grec porte un possessif ambigu; l’expliciter trancherait une question que le texte ne résout pas formellement.
- issue: Nature de la glorification de Moïse
  choice: « malgré la grande gloire qu’il reçut »
  alternative: « bien qu’il eût été grandement glorifié »
  rationale: La tournure active naturelle conserve le passif théologique de δοξασθείς sans préciser qui lui accorda cette gloire.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe demeure proche du grec tout en évitant les calques opaques. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
