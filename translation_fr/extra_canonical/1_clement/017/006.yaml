  text: And again he says, “But I am steam from a pot.”
translation:
  language: fr
  text: 'Et il dit encore : « Mais moi, je suis une vapeur venant d’une marmite. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτμὶς
  choice: vapeur
  rationale: « Vapeur » est le terme français naturel pour la vapeur produite par le contenu chauffé d’un récipient; il convient mieux ici que « buée » ou « fumée ».
- source_word: ἀπὸ χύτρας
  choice: qui s’élève d’une marmite
  rationale: La préposition ἀπό exprime la provenance. Cette formulation idiomatique rend clairement l’image grecque plutôt que le calque plus raide « vapeur d’une marmite ».
theological_decisions:
- issue: Portée de l’affirmation d’humilité
  choice: ne suis que
  alternative: suis
  rationale: L’ajout idiomatique « ne… que » fait ressortir la petitesse et le caractère éphémère impliqués par l’image, sans lui attribuer une interprétation doctrinale particulière.
translation_notes:
  register: Français moderne, simple et digne. « Marmite » conserve l’image concrète d’un récipient de cuisson; « qui s’élève » rend naturelle en français la relation de provenance.
