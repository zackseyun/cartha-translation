source:
  edition: Funk 1901 (normalized OCR)
  text: Μιμηταὶ γενώμεθα κἀκείνων, οἵτινες ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ· λέγομεν δὲ Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ, τοὺς προφήτας· πρὸς τούτοις καὶ τοὺς μεμαρτυρημένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
translation:
  language: fr
  text: Devenons, nous aussi, les imitateurs de ceux qui allaient çà et là, vêtus de peaux de chèvre et de peaux de mouton, proclamant la venue du Christ. C’est-à-dire les prophètes Élie, Élisée et Ézéchiel, ainsi que ceux qui ont été recommandés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont reçu un témoignage favorable » ou « qui ont été approuvés ».
    reason: Le participe parfait passif grec μεμαρτυρημένους désigne des personnes auxquelles un témoignage favorable a été rendu ; le texte ne précise pas l’auteur de ce témoignage.
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  choice: Devenons … les imitateurs
  rationale: Reproduit l’exhortation délibérative et le substantif grec, dans un français naturel et digne.
- source_word: κἀκείνων
  choice: nous aussi … de ceux
  rationale: Rend la valeur additive de καί dans la crase κἀκείνων.
- source_word: ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς
  choice: vêtus de peaux de chèvre et de peaux de mouton
  rationale: « Vêtus de » explicite idiomatiquement l’emploi vestimentaire de ἐν; μηλωτή désigne ici une peau de mouton portée comme vêtement.
- source_word: περιεπάτησαν
  choice: allaient çà et là
  rationale: Conserve l’idée de déplacement exprimée par περιπατέω sans employer le calque moins naturel « marchaient » dans ce contexte.
- source_word: κηρύσσοντες
  choice: proclamant
  rationale: Rend la proclamation publique et autorisée impliquée par κηρύσσω.
- source_word: τὴν ἔλευσιν τοῦ Χριστοῦ
  choice: la venue du Christ
  rationale: Traduction directe de ἔλευσις et Χριστός; « Christ » respecte le titre grec sans surtraduire par « Messie ».
- source_word: τοὺς μεμαρτυρημένους
  choice: ceux qui ont reçu un témoignage favorable
  rationale: Le parfait passif de μαρτυρέω évoque ici, dans l’arrière-plan d’Hébreux 11, des personnes ayant fait l’objet d’un témoignage positif; cette formulation conserve à la fois la notion de témoignage et sa valeur approbatrice.
theological_decisions:
- issue: Sens et statut de Χριστός
  choice: Christ
  alternative: Messie
  rationale: Le texte porte explicitement Χριστός; le rendre par « Christ » préserve le titre sous sa forme reçue dans ce contexte chrétien ancien.
- issue: Nature du témoignage concernant les figures évoquées
  choice: ont reçu un témoignage favorable
  alternative: ont été approuvés / ont été recommandés
  rationale: La traduction garde l’ambiguïté sur l’auteur du témoignage tout en exprimant clairement sa valeur positive, sans introduire explicitement Dieu lorsque le grec ne le nomme pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’élan exhortatif et l’énumération du grec. « Élisée » et « Ézéchiel » suivent les formes françaises usuelles des noms bibliques.
