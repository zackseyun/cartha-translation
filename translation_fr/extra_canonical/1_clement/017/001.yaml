    text: Ou « qui ont reçu un témoignage favorable » ou « qui ont été approuvés ».
    reason: Le participe parfait passif grec μεμαρτυρημένους désigne des personnes auxquelles un témoignage favorable a été rendu ; le texte ne précise pas l’auteur de ce témoignage.
  revision_rationale: 'La révision clarifie l’incise explicative et l’apposition « les prophètes », sans modifier le contenu. Elle adopte « ont été recommandés » pour le participe μεμαρτυρημένους : ce rendu est naturel en français, marque la valeur favorable du témoignage et ne surinterprète pas l’agent implicite. Le point conserve une séparation acceptable entre les deux propositions tout en préservant l’enchaînement argumentatif.'
