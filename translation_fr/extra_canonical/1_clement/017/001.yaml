revisions:
- from: 'Devenons, nous aussi, les imitateurs de ceux qui allaient çà et là, vêtus de peaux de chèvre et de peaux de mouton, proclamant la venue du Christ : nous parlons d’Élie, d’Élisée et aussi d’Ézéchiel, les prophètes, ainsi que de ceux qui ont reçu un témoignage favorable[a].'
  to: Devenons, nous aussi, les imitateurs de ceux qui allaient çà et là, vêtus de peaux de chèvre et de peaux de mouton, proclamant la venue du Christ. C’est-à-dire les prophètes Élie, Élisée et Ézéchiel, ainsi que ceux qui ont été recommandés[a].
  rationale: 'La révision clarifie l’incise explicative et l’apposition « les prophètes », sans modifier le contenu. Elle adopte « ont été recommandés » pour le participe μεμαρτυρημένους : ce rendu est naturel en français, marque la valeur favorable du témoignage et ne surinterprète pas l’agent implicite. Le point conserve une séparation acceptable entre les deux propositions tout en préservant l’enchaînement argumentatif.'
