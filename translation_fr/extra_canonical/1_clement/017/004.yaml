  yaml_path: translation/extra_canonical/1_clement/017/004.yaml
  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
translation:
  language: fr
  text: 'Mais lui-même s’accuse en disant : « Personne n’est pur de toute souillure, même si sa vie ne dure qu’un jour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑαυτοῦ κατηγορεῖ
  choice: s’accuse
  rationale: Le verbe κατηγορεῖ avec le pronom réfléchi au génitif signifie directement « s’accuse » ; cette formulation est exacte et naturelle en français.
- source_word: καθαρὸς ἀπὸ ῥύπου
  choice: pur de toute souillure
  rationale: La construction exprime l’absence de souillure. « Pur de toute souillure » conserve l’image et produit une formulation française intelligible.
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  choice: même si sa vie ne dure qu’un jour
  rationale: Cette tournure rend naturellement en français l’hypothèse concessive d’une vie longue d’un seul jour, sans modifier son sens.
theological_decisions:
- issue: Portée de l’affirmation sur l’impureté humaine
  choice: Conserver l’énoncé absolu « Personne n’est pur de toute souillure »
  alternative: Expliciter en termes de péché ou de culpabilité
  rationale: Le grec emploie l’image générale de la souillure (ῥύπος) sans préciser ici sa nature ; il convient de ne pas réduire cette ambiguïté à une catégorie doctrinale particulière.
translation_notes:
  register: Français moderne, digne et fluide. Le redoublement emphatique ἀλλ’ αὐτὸς ἑαυτοῦ est rendu par « Mais lui-même s’accuse », et la durée d’un jour est formulée idiomatiquement.
