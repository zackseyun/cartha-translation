  text: ἀλλ’ αὐτὸς ἑαυτοῦ κατηγορεῖ λέγων· Οὐδεὶς καθαρὸς ἀπὸ ῥύπου, οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ.
