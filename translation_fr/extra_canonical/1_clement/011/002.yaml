id: 1CLEM.11.2
reference: 1 Clement 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
translation:
  language: fr
  text: Car, lorsque sa femme sortit avec lui, elle était d’un autre avis et n’était pas dans la concorde. À ce titre, elle fut établie comme signe, de sorte qu’elle devint une colonne de sel jusqu’à ce jour, afin que tous sachent que ceux qui ont l’esprit partagé[a] et ceux qui doutent de la puissance de Dieu deviennent un jugement et un avertissement pour toutes les générations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui ont l’âme double ».'
    reason: Le grec δίψυχοι évoque une personne intérieurement divisée ou irrésolue.
  - marker: b
    text: 'Ou : « deviennent une condamnation et un signe d’avertissement pour toutes les générations ».'
    reason: κρίμα peut désigner le jugement ou la condamnation qui en résulte, et σημείωσις un avertissement ou un signe marquant.
lexical_decisions:
- source_word: ἑτερογνώμονος
  choice: avait une autre manière de penser
  rationale: Rend le sens de « penser autrement, avoir des dispositions différentes » sans réduire le terme à une simple opinion ponctuelle.
- source_word: ὁμονοίᾳ
  choice: accord
  rationale: Dans 1 Clément, ὁμόνοια désigne la concorde et l’unité d’esprit. « Être en accord » est ici naturel en français tout en conservant l’opposition avec ἑτερογνώμων.
- source_word: δίψυχοι
  choice: ceux qui ont l’esprit partagé
  rationale: Expression française compréhensible qui conserve l’image d’une personne intérieurement divisée; une note signale le sens littéral.
- source_word: σημείωσιν
  choice: avertissement
  rationale: Dans ce contexte exemplaire, le terme désigne un signe marquant qui sert d’avertissement aux générations suivantes.
- source_word: κρίμα
  choice: jugement
  rationale: Conserve le terme judiciaire et théologique sans trancher entre le jugement prononcé et la condamnation qui en résulte.
theological_decisions:
- issue: Rapport entre le doute et les deux compléments εἰς κρίμα καὶ εἰς σημείωσιν
  choice: « deviennent un jugement et un avertissement »
  alternative: « sont condamnés et servent d’avertissement »
  rationale: Le grec emploie un seul verbe, γίγνονται, pour les deux compléments parallèles. La traduction retenue préserve cette structure et évite d’expliciter κρίμα comme une condamnation personnelle certaine.
- issue: Durée du signe de la femme de Lot
  choice: « une colonne de sel, qui subsiste jusqu’à ce jour »
  alternative: « elle devint une colonne de sel jusqu’à ce jour »
  rationale: La formulation rend explicitement en français que « jusqu’à ce jour » qualifie la permanence du signe, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe grecque très longue est divisée en deux phrases pour la clarté, tandis que le parallélisme final et les ambiguïtés lexicales importantes sont conservés.
