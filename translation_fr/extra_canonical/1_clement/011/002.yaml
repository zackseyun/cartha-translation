  to: Car, lorsque sa femme sortit avec lui, elle était d’un autre avis et n’était pas dans la concorde. À ce titre, elle fut établie comme signe, de sorte qu’elle devint une colonne de sel jusqu’à ce jour, afin que tous sachent que ceux qui ont l’esprit partagé[a] et ceux qui doutent de la puissance de Dieu deviennent un jugement et un avertissement pour toutes les générations[b].
