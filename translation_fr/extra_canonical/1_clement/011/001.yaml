id: 1CLEM.11.1
reference: 1 Clement 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: fr
  text: Grâce à son hospitalité et à sa piété, Loth fut sauvé de Sodome, alors que toute la région environnante fut jugée par le feu et le soufre. Le Maître a ainsi clairement montré qu’il n’abandonne pas ceux qui mettent leur espérance en lui, mais qu’il voue au châtiment et au tourment ceux qui s’égarent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  choice: hospitalité
  rationale: Rend directement l’accueil généreux des étrangers, vertu illustrée par Loth dans le récit de la Genèse.
- source_word: εὐσέβειαν
  choice: piété
  rationale: Terme français naturel et digne qui exprime la conduite respectueuse envers Dieu.
- source_word: περιχώρου
  choice: région alentour
  rationale: Désigne le territoire environnant de Sodome sans imposer une délimitation géographique plus précise que le grec.
- source_word: πυρὸς καὶ θείου
  choice: feu et soufre
  rationale: Traduction concrète et immédiatement compréhensible de la formule grecque traditionnelle.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Conserve l’idée d’autorité souveraine de δεσπότης et suit le titre employé dans ce contexte sans ajouter explicitement « Dieu » ou « Seigneur ».
- source_word: τοὺς ἐλπίζοντας ἐπʼ αὐτόν
  choice: ceux qui mettent leur espérance en lui
  rationale: Exprime la confiance orientée vers Dieu contenue dans ἐλπίζειν ἐπί.
- source_word: ἑτεροκλινεῖς
  choice: ceux qui se détournent de lui
  rationale: Rend l’idée de déviation ou d’inclination dans une autre direction; « de lui » explicite naturellement le contraste contextuel avec ceux qui espèrent en Dieu.
- source_word: κόλασιν καὶ αἰκισμόν
  choice: châtiment et tourment
  rationale: Préserve les deux termes coordonnés, le premier désignant la punition et le second les mauvais traitements ou la souffrance infligée.
theological_decisions:
- issue: Sujet et portée de la leçon tirée du salut de Loth
  choice: Conserver « le Maître » comme sujet divin et le contraste entre ceux qui espèrent en lui et ceux qui s’en détournent.
  alternative: Nommer explicitement Dieu ou préciser la nature et la durée du châtiment.
  rationale: Le grec emploie δεσπότης et ne précise ni davantage l’identité dans cette phrase ni la durée du châtiment; la traduction évite donc d’ajouter une conclusion doctrinale.
- issue: Sens de τίθησιν appliqué aux récalcitrants
  choice: « voue au châtiment et au tourment »
  alternative: « place dans le châtiment et le tourment » ou « destine au châtiment et au tourment »
  rationale: « Vouer » communique idiomatiquement l’action de les assigner à ce sort, tout en évitant de déterminer plus que le texte le caractère temporel ou eschatologique de la peine.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement resserrée pour rester naturelle, tout en conservant la relation causale, le jugement de toute la région et le contraste théologique de la phrase grecque.
