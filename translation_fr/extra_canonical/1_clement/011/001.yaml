revisions:
- from: Grâce à son hospitalité et à sa piété, Loth fut sauvé de Sodome, tandis que toute la région alentour était jugée par le feu et le soufre. Le Maître montrait ainsi clairement qu’il n’abandonne pas ceux qui mettent leur espérance en lui, mais qu’il voue au châtiment et au tourment ceux qui se détournent de lui.
  to: Grâce à son hospitalité et à sa piété, Loth fut sauvé de Sodome, alors que toute la région environnante fut jugée par le feu et le soufre. Le Maître a ainsi clairement montré qu’il n’abandonne pas ceux qui mettent leur espérance en lui, mais qu’il voue au châtiment et au tourment ceux qui s’égarent.
  rationale: La révision retire l'explicitation non exprimée « de lui » pour préserver l'ouverture de ἑτεροκλινεῖς, et ajuste « montrait » en « a ainsi clairement montré » afin de mieux refléter le participe aoriste ποιήσας. Elle ne modifie ni la portée théologique du contraste ni l'ambiguïté quant à la nature ou à la durée du châtiment.
