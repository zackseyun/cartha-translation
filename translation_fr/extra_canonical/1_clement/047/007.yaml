id: 1CLEM.47.7
reference: 1 Clement 47:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
translation:
  language: fr
  text: Et la nouvelle est parvenue non seulement jusqu’à nous, mais aussi jusqu’à ceux qui nous sont étrangers[a], si bien que même des blasphèmes sont proférés contre le nom du Seigneur à cause de votre folie, tandis que vous vous attirez vous-mêmes un danger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont d’un autre parti que nous » ou « ceux qui sont opposés à nous ».
    reason: Le rare adjectif ἑτεροκλινής signifie littéralement « incliné dans une autre direction » et peut exprimer l’éloignement, la divergence ou l’opposition.
lexical_decisions:
- source_word: ἡ ἀκοή
  choice: la nouvelle
  rationale: Dans ce contexte, le nom désigne ce qui a été entendu, donc une nouvelle ou un rapport qui s’est répandu, plutôt que la faculté d’entendre.
- source_word: τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  choice: ceux qui nous sont étrangers
  rationale: ἑτεροκλινής évoque des personnes inclinées dans une autre direction, étrangères ou opposées au groupe. Cette formulation française reste naturelle et convient au contexte de personnes extérieures qui blasphèment.
- source_word: ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου
  choice: si bien que des blasphèmes sont même proférés contre le nom du Seigneur
  rationale: La tournure consécutive ὥστε est rendue par « si bien que », le καί ascensif par « même », et la construction passive conserve l’idée d’outrages dirigés contre le nom du Seigneur.
- source_word: ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι
  choice: tandis que vous vous exposez vous-mêmes au danger
  rationale: Cette expression rend idiomatiquement l’idée qu’ils produisent pour eux-mêmes une situation dangereuse, tout en conservant l’insistance de ἑαυτοῖς.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe conserve la progression du grec : diffusion de la nouvelle, blasphème contre le nom du Seigneur, puis danger encouru par les destinataires.'
