id: 1CLEM.47.5
reference: 1 Clement 47:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/005.yaml
  text: But now consider who led you astray and diminished the dignity of your renowned brotherly love[a][b].
translation:
  language: fr
  text: Mais maintenant, examinez qui vous a égarés et a porté atteinte à la dignité de votre amour fraternel renommé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσατε
  choice: examinez
  rationale: L’impératif appelle à considérer attentivement la situation; « examinez » est naturel et conserve cette idée de réflexion sérieuse.
- source_word: τίνες
  choice: qui
  rationale: Le pronom interrogatif est formellement pluriel et vise les personnes responsables; en français, « qui » convient sans marquer artificiellement le nombre.
- source_word: διέστρεψαν
  choice: vous a égarés
  rationale: Le verbe peut évoquer le fait de détourner ou de pervertir. Dans ce contexte de dissension, « égarer » exprime naturellement l’action d’avoir détourné les destinataires de la bonne voie.
- source_word: τὸ σεμνὸν
  choice: la dignité
  rationale: L’adjectif substantivé désigne ici le caractère digne, noble ou vénérable de leur amour fraternel.
- source_word: περιβοήτου
  choice: renommé
  rationale: Le terme signifie « dont on parle beaucoup », donc « célèbre, renommé »; « renommé » convient au registre élogieux et soutenu.
- source_word: φιλαδελφίας
  choice: amour fraternel
  rationale: Cette expression courante rend clairement l’affection et la solidarité entre frères et sœurs de la communauté.
- source_word: ἐμείωσαν
  choice: a porté atteinte à
  rationale: Le verbe signifie littéralement « diminuer, amoindrir ». La tournure choisie exprime idiomatiquement l’atteinte portée au caractère digne de leur amour fraternel.
theological_decisions:
- issue: Force de διέστρεψαν
  choice: vous a égarés
  alternative: vous a pervertis / vous a détournés
  rationale: « Égarés » reste sérieux sans imposer la nuance morale plus forte de « pervertis »; le contexte permet néanmoins l’idée de détournement.
- issue: Relation entre σεμνὸν et φιλαδελφίας
  choice: la dignité de votre amour fraternel
  alternative: le noble caractère de votre amour fraternel
  rationale: Le génitif est conservé et l’abstraction grecque est rendue de façon intelligible, sans identifier cette dignité à une doctrine particulière.
translation_notes:
  register: Français moderne, international et digne. La phrase garde l’exhortation directe et le ton de reproche du grec, tout en évitant les formulations archaïques ou inutilement littérales.
