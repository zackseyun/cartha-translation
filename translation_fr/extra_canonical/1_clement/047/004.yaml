review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : πρόσκλισις désigne un parti pris / une préférence, ἧσσον ἁμαρτίαν une faute moindre, et γάρ introduit l’explication. La distinction entre μεμαρτυρημένοις (apôtres bénéficiant d’une attestation ou d’une réputation établie) et δεδοκιμασμένῳ (homme approuvé par eux) est bien préservée. Toutefois, « dont la valeur était attestée » ajoute une notion de valeur intrinsèque qui n’est pas explicitement exprimée par le participe grec.'
  naturalness: La phrase est claire et de registre convenable. « Des apôtres dont la réputation était solidement établie » est plus idiomatique et rend plus directement l’idée de personnes publiquement et favorablement attestées. « Qu’ils avaient approuvé » est remplacé par « approuvé par eux », qui reflète plus directement le parfait passif grec sans imposer un rapport temporel de plus-que-parfait.
  terminology: « Parti pris » et « péché moins grave » conviennent au registre moderne et moral du passage. La révision maintient une différence lexicale justifiée entre la réputation attestée des apôtres et l’approbation de l’homme, sans en déduire une autorité institutionnelle ou théologique particulière.
  issues:
  - severity: low
    issue: « dont la valeur était attestée »
    rationale: Cette expression est intelligible, mais « valeur » interprète μεμαρτυρημένοις comme un jugement sur leur mérite. Le grec indique plus directement qu’ils étaient attestés, bien recommandés ou de réputation établie.
  - severity: low
    issue: « qu’ils avaient approuvé »
    rationale: Le plus-que-parfait français peut suggérer une antériorité que le parfait passif δεδοκιμασμένῳ n’exige pas. « approuvé par eux » rend plus exactement l’état résultant de leur approbation.
