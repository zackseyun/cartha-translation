  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
translation:
  language: fr
  text: 'Mais ce parti pris-là vous a valu un péché moins grave : vous vous êtes en effet ralliés à des apôtres dont la réputation était solidement établie[a], ainsi qu’à un homme approuvé par eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à des apôtres bien attestés ». Le grec exprime qu’ils bénéficiaient d’un témoignage favorable et établi.'
    reason: 'μεμαρτυρημένοις est un parfait passif : il évoque une attestation ou réputation favorable établie, sans l’assimiler à l’approbation (δεδοκιμασμένῳ) de l’homme mentionné ensuite.'
lexical_decisions:
- source_word: πρόσκλισις
  choice: parti pris
  rationale: Le terme désigne une inclination préférentielle ou partisane. « Parti pris » est naturel en français et conserve ici la nuance négative sans durcir le sens jusqu’à « faction ».
- source_word: ἧσσον ἁμαρτίαν
  choice: un péché moins grave
  rationale: Cette formulation idiomatique exprime le degré moindre indiqué par ἧσσον tout en conservant le vocabulaire moral et religieux de ἁμαρτία.
- source_word: προσεκλίθητε
  choice: vous vous êtes ralliés à
  rationale: L’aoriste indique une action passée envisagée globalement. « Se rallier à » rend l’orientation vers des personnes et garde le lien sémantique avec πρόσκλισις, sans la tournure peu naturelle « vous vous êtes inclinés vers ».
- source_word: μεμαρτυρημένοις
  choice: dont la valeur était attestée
  rationale: Le participe parfait évoque des personnes bénéficiant d’un témoignage favorable et établi. Cette traduction distingue ce terme de δεδοκιμασμένῳ tout en restant intelligible.
- source_word: δεδοκιμασμένῳ παρ’ αὐτοῖς
  choice: qu’ils avaient approuvé
  rationale: Le parfait de δοκιμάζω exprime le résultat favorable d’une mise à l’épreuve; παρ’ αὐτοῖς désigne ici les apôtres comme agents ou instance d’approbation.
theological_decisions:
- issue: Degré comparatif du péché
  choice: « un péché moins grave »
  alternative: « moins de péché »
  rationale: Le texte compare la gravité ou la culpabilité attachée à cet ancien parti pris sans déclarer celui-ci innocent. La traduction conserve cette tension morale.
- issue: Statut des apôtres et de l’homme mentionné
  choice: Distinguer le témoignage favorable rendu aux apôtres de l’approbation accordée à l’homme par ceux-ci
  alternative: Employer « approuvés » pour les deux expressions
  rationale: Les deux participes grecs sont différents. La distinction évite d’aplanir le texte et ne précise pas davantage l’identité de l’homme ni la nature institutionnelle de son approbation.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure argumentative grecque, avec une ponctuation qui rend explicite le rapport introduit par γάρ. Le vocabulaire évite à la fois l’archaïsme et une terminologie confessionnelle particulière.
