  source_fidelity: Le sens général est fidèle. Une révision légère améliore toutefois la représentation de l’infinitif passif ἀκούεσθαι (« qu’on entende dire ») et rend plus explicitement le superlatif βεβαιοτάτην (« si solidement établie »).
  naturalness: Le français du projet est globalement naturel, mais « d’entendre dire » peut suggérer que les destinataires entendent eux-mêmes la nouvelle, là où le grec vise le fait que cela soit rapporté. La construction proposée est plus idiomatique et plus proche de la portée impersonnelle du grec.
  terminology: « bien-aimés », « conduite en Christ », « Église », « anciens » et « révolte » conviennent au registre et ne surinterprètent pas les termes grecs. « En Christ » maintient l’idiome chrétien ancien établi.
