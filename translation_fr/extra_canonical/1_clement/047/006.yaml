id: 1CLEM.47.6
reference: 1 Clement 47:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
translation:
  language: fr
  text: Il est honteux, bien-aimés — très honteux et indigne d’une conduite en Christ — qu’on entende dire que l’Église des Corinthiens, si solidement établie et si ancienne, est en révolte contre les anciens à cause d’une ou deux personnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρά … λίαν αἰσχρά
  choice: honteux … profondément honteux
  rationale: Conserve la répétition emphatique grecque tout en rendant λίαν de manière naturelle en français.
- source_word: ἀγωγῆς
  choice: conduite
  rationale: Désigne ici la manière de vivre ou le comportement; « conduite » respecte la portée éthique du terme.
- source_word: βεβαιοτάτην
  choice: si ferme
  rationale: Rend le superlatif intensif et qualifie la stabilité reconnue de l’Église sans surcharger la phrase.
- source_word: ἀρχαίαν
  choice: si ancienne
  rationale: Conserve le sens temporel et honorifique de l’adjectif dans ce contexte.
- source_word: στασιάζειν
  choice: se révolte
  rationale: Exprime la dissension active et factieuse dirigée contre les anciens, plus fortement qu’un simple désaccord.
- source_word: πρεσβυτέρους
  choice: anciens
  rationale: Terme ecclésial français courant qui préserve le sens de πρεσβύτεροι sans imposer une structure confessionnelle particulière.
theological_decisions:
- issue: Sens de ἐν Χριστῷ
  choice: en Christ
  alternative: dans le Messie
  rationale: L’expression reprend l’idiome chrétien ancien, notamment paulinien; « en Christ » en est la formulation française naturelle et historiquement adaptée.
- issue: Référent de Κορνθίων ἐκκλησίαν
  choice: l’Église … de Corinthe
  alternative: l’assemblée des Corinthiens
  rationale: Dans cette lettre adressée à la communauté chrétienne locale, « Église de Corinthe » est clair et naturel, sans ajouter de précision institutionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La structure exclamative et l’insistance du grec sont conservées; les tirets mettent en relief le jugement moral avant l’énoncé du scandale rapporté.
