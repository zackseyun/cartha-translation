revisions:
- from: Il est honteux, bien-aimés — profondément honteux et indigne de la conduite en Christ — d’entendre dire que l’Église si ferme et si ancienne de Corinthe se révolte contre les anciens à cause d’une ou deux personnes.
  to: Il est honteux, bien-aimés — très honteux et indigne d’une conduite en Christ — qu’on entende dire que l’Église des Corinthiens, si solidement établie et si ancienne, est en révolte contre les anciens à cause d’une ou deux personnes.
  rationale: 'La révision conserve l’insistance répétée de αἰσχρά, l’idiome « en Christ », et la force de στασιάζειν, tout en resserrant la fidélité syntaxique et lexicale au grec. Aucune note n’est nécessaire : les ambiguïtés du texte ne sont pas accrues par cette formulation.'
