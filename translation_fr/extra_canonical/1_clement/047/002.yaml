  yaml_path: translation/extra_canonical/1_clement/047/002.yaml
  text: What did he write to you first at the beginning of the gospel?
translation:
  language: fr
  text: Que vous a-t-il écrit en premier, au commencement de l’Évangile ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: Que
  rationale: Introduit naturellement en français une question portant sur le contenu de ce qui a été écrit.
- source_word: πρῶτον
  choice: en premier
  rationale: Conserve la valeur de priorité de πρῶτον tout en laissant ouverte sa portée exacte dans la phrase.
- source_word: ὑμῖν
  choice: vous
  rationale: Rend le datif pluriel désignant les destinataires de la lettre.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: au commencement de l’Évangile
  rationale: Traduction directe et naturelle qui préserve l’expression temporelle ainsi que la portée potentiellement historique de « l’Évangile ».
- source_word: ἔγραψεν
  choice: a-t-il écrit
  rationale: Rend l’aoriste par le passé composé, temps naturel en français moderne pour cette question rétrospective.
theological_decisions:
- issue: Sens de « l’Évangile »
  choice: l’Évangile
  alternative: la proclamation de l’Évangile
  rationale: Le grec τοῦ εὐαγγελίου peut renvoyer au message évangélique ou à sa proclamation; la formulation retenue conserve cette amplitude sans ajouter une interprétation.
- issue: Portée de πρῶτον
  choice: en premier après « écrit »
  alternative: Quelle est la première chose qu’il vous a écrite
  rationale: La position retenue reste proche du grec et évite de trancher excessivement entre « d’abord » au sens chronologique et « en premier lieu » dans l’argument.
translation_notes:
  register: Français moderne, clair et digne. La majuscule à « Évangile » signale ici le message chrétien dans son sens reconnu, sans imposer l’idée d’un livre canonique précis.
