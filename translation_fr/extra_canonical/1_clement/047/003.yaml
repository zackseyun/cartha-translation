id: 1CLEM.47.3
reference: 1 Clement 47:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: fr
  text: En vérité, il vous a écrit de manière spirituelle à son propre sujet, ainsi qu’au sujet de Céphas et d’Apollos, parce que, déjà à cette époque, vous aviez pris parti pour les uns ou les autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: En vérité
  rationale: Rend directement l’affirmation emphatique grecque dans un registre digne et naturel.
- source_word: πνευματικῶς
  choice: de manière spirituelle
  rationale: Conserve la valeur adverbiale du grec sans préciser indûment « par l’Esprit », lecture possible mais moins directement exprimée.
- source_word: ἐπέστειλεν ὑμῖν
  choice: il vous a écrit
  rationale: Expression française naturelle pour l’acte d’adresser une lettre.
- source_word: περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ
  choice: à son propre sujet, ainsi qu’au sujet de Céphas et d’Apollos
  rationale: Préserve les trois personnes mentionnées et l’enchaînement coordonné du grec.
- source_word: προσκλίσεις
  choice: pris parti pour les uns ou les autres
  rationale: Le terme désigne des inclinations partisanes ou des préférences accordées à certains; cette formulation idiomatique évite l’étrange calque « fait des partialités » tout en maintenant l’idée de parti pris.
theological_decisions:
- issue: Sens de πνευματικῶς
  choice: de manière spirituelle
  alternative: sous l’inspiration de l’Esprit
  rationale: Le texte emploie un adverbe et ne nomme pas explicitement l’Esprit saint; la traduction retenue préserve cette ouverture.
- issue: Nature des προσκλίσεις
  choice: des prises de parti en faveur des uns ou des autres
  alternative: des factions constituées
  rationale: Le mot met d’abord l’accent sur les inclinations ou préférences partisanes; « factions » pourrait présenter comme explicitement constitués des groupes que le terme ne désigne pas nécessairement à lui seul.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « de manière spirituelle » garde la légère étrangeté et l’ambiguïté du grec; « pris parti pour les uns ou les autres » exprime naturellement le comportement partisan visé.
