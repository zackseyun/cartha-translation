  text: Ἀναλάβετε τὴν ἐπιστολὴν τοῦ μακαρίου Παύλου τοῦ ἀποστόλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/001.yaml
  text: Take up the letter of the blessed Paul the apostle.
translation:
  language: fr
  text: Prenez la lettre du bienheureux Paul, l’apôtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναλάβετε
  choice: Reprenez
  rationale: L’impératif peut inviter les destinataires à reprendre en main ou à relire une lettre déjà connue; « Reprenez » rend naturellement cette idée sans la préciser à l’excès.
- source_word: μακαρίου
  choice: bienheureux
  rationale: Le terme exprime ici l’honneur accordé à Paul; « bienheureux » conserve le registre ancien et digne sans introduire explicitement une doctrine de canonisation.
- source_word: Παύλου τοῦ ἀποστόλου
  choice: l’apôtre Paul
  rationale: Cette tournure française naturelle conserve le titre apposé au nom de Paul.
theological_decisions:
- issue: Portée du qualificatif μακάριος appliqué à Paul
  choice: bienheureux
  alternative: béni
  rationale: « Bienheureux » traduit directement le qualificatif honorifique tout en laissant ouverte sa nuance exacte; « béni » pourrait suggérer plus nettement une action divine non explicitée ici.
translation_notes:
  register: Français moderne, concis et digne. La formulation conserve l’injonction directe du grec et évite d’ajouter explicitement « relisez », même si cette nuance est possible dans le contexte.
