source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀπροσδεής, ἀδελφοί, ὁ δεσπότης ὑπάρχει τῶν ἁπάντων· οὐδενὸς οὐδὲν χρῄζει εἰ μὴ τὸ ἐξομολογεῖσθαι αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
translation:
  language: fr
  text: 'Le Maître de toutes choses ne manque de rien, frères et sœurs : il n’a besoin de rien de personne, si ce n’est qu’on lui fasse confession.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi signifier : « qu’on lui rende grâce », « qu’on le loue » ou « qu’on fasse confession devant lui ».'
    reason: Le verbe ἐξομολογεῖσθαι peut exprimer la confession ou l’aveu, mais aussi l’action de grâce et la louange ; la traduction principale préserve cette ouverture autant que possible.
lexical_decisions:
- source_word: Ἀπροσδεής
  choice: ne manque de rien
  rationale: Rend l’idée d’être sans besoin ou autosuffisant, dans un français naturel, tout en évitant de faire disparaître la reprise explicite avec χρῄζει.
- source_word: ὁ δεσπότης τῶν ἁπάντων
  choice: le Maître de toutes choses
  rationale: « Maître » conserve l’autorité exprimée par δεσπότης sans la connotation politique moderne de « despote » ; « de toutes choses » correspond à τῶν ἁπάντων.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: L’apostrophe grecque au masculin pluriel désigne ici l’ensemble de la communauté ; la formulation inclusive explicite naturellement cette portée en français moderne.
- source_word: οὐδενὸς οὐδὲν χρῄζει
  choice: il n’a besoin de rien de personne
  rationale: 'Conserve les deux pronoms négatifs grecs et leur insistance : ni aucune chose, ni de qui que ce soit.'
- source_word: τὸ ἐξομολογεῖσθαι αὐτῷ
  choice: qu’on lui adresse une confession de reconnaissance
  rationale: Préserve la notion de confession ou reconnaissance exprimée, tout en signalant la nuance de gratitude ou de louange que le verbe peut porter dans un contexte religieux.
theological_decisions:
- issue: La tension entre l’absence totale de besoin de Dieu et l’exception formulée ensuite
  choice: Conserver « il n’a besoin de rien… si ce n’est… »
  alternative: Reformuler par « il ne demande rien… sinon… »
  rationale: Le grec emploie explicitement le vocabulaire du besoin et formule une exception rhétorique. Le remplacer par « demander » résoudrait silencieusement cette tension.
- issue: Sens cultuel de ἐξομολογεῖσθαι
  choice: « une confession de reconnaissance » avec note
  alternative: « le louer », « lui rendre grâce » ou « lui confesser ses fautes »
  rationale: Le terme peut évoquer l’aveu, la reconnaissance, l’action de grâce ou la louange. La traduction retenue garde une partie de cette amplitude sans réduire le sens à la confession des péchés.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « ne manque de rien… n’a besoin de rien » reproduit l’insistance du grec. L’adresse « frères et sœurs » explicite la portée communautaire de l’apostrophe.
