source:
  edition: Funk 1901 (normalized OCR)
  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
translation:
  language: fr
  text: 'Car David, l’élu, dit : « Je rendrai grâce au Seigneur, et cela lui plaira davantage qu’un jeune taureau avec ses cornes et ses sabots[a]. Que les pauvres voient et se réjouissent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un jeune taureau développant ses cornes et ses sabots ». Le participe grec décrit l’animal comme faisant sortir ou pousser ses cornes et ses sabots.'
    reason: Le texte principal emploie une formulation française naturelle, tandis que la note conserve l’image participiale de ἐκφέροντα.
lexical_decisions:
- source_word: ἐξομολογήσομαι
  choice: Je rendrai grâce
  rationale: Dans ce contexte psalmique, le verbe désigne une reconnaissance adressée à Dieu, exprimée comme louange ou action de grâce, plutôt qu’un aveu de faute.
- source_word: ὁ ἐκλεκτὸς Δαυίδ
  choice: David, l’élu
  rationale: Cette formulation conserve le titre qualificatif grec tout en restant naturelle en français.
- source_word: μόσχον νέον
  choice: un jeune taureau
  rationale: Le contexte sacrificiel et la mention des cornes et des sabots indiquent un bovin mâle; « jeune taureau » est plus précis ici que le terme générique « veau ».
- source_word: πτωχοί
  choice: les pauvres
  rationale: Rend le sens ordinaire du terme sans le spiritualiser en « humbles ».
theological_decisions:
- issue: Sens de l’action adressée au Seigneur
  choice: rendre grâce
  alternative: confesser / louer
  rationale: Le contexte oppose une expression reconnaissante de louange au sacrifice animal; « rendre grâce » transmet cette fonction sans suggérer spécifiquement la confession des péchés.
- issue: Référent implicite de ἰδέτωσαν
  choice: Que les pauvres voient cela
  alternative: Que les pauvres le voient
  rationale: Le grec ne précise pas l’objet de « voient ». « Cela » maintient une référence large à ce qui vient d’être dit, sans l’identifier explicitement à Dieu ou à un objet particulier.
translation_notes:
  register: Français moderne, digne et accessible. La citation conserve le parallélisme et l’image sacrificielle du texte grec, avec une note pour sa formulation anatomique inhabituelle.
