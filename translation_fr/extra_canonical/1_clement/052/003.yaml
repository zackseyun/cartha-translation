id: 1CLEM.52.3
reference: 1 Clement 52:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: fr
  text: 'Et il dit encore : « Offre à Dieu un sacrifice de louange, et acquitte tes vœux envers le Très-Haut. Invoque-moi au jour de ta détresse ; je te délivrerai, et tu me rendras gloire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θῦσον ... θυσίαν αἰνέσεως
  choice: Offre ... un sacrifice de louange
  rationale: Conserve l’expression cultuelle et sa reprise étymologique en grec d’une manière naturelle en français.
- source_word: ἀπόδος ... τὰς εὐχάς σου
  choice: acquitte tes vœux
  rationale: Dans ce contexte, εὐχάς désigne des vœux faits à Dieu, et ἀπόδος leur accomplissement, non de simples prières.
- source_word: τῷ ὑψίστῳ
  choice: envers le Très-Haut
  rationale: Rend le titre divin substantivé et exprime naturellement en français le destinataire des vœux.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: au jour de ta détresse
  rationale: Préserve l’image temporelle et rend θλῖψις par un terme courant évoquant une épreuve pressante.
- source_word: ἐξελοῦμαί σε
  choice: je te délivrerai
  rationale: Exprime le sens de retrait hors du danger porté par ἐξαιρέω.
- source_word: δοξάσεις με
  choice: tu me rendras gloire
  rationale: Formulation française idiomatique qui conserve le sens théologique de δοξάζω.
theological_decisions:
- issue: Nature du « sacrifice »
  choice: Conserver littéralement « sacrifice de louange »
  alternative: Paraphraser par « loue Dieu comme une offrande »
  rationale: Le texte juxtapose intentionnellement le vocabulaire sacrificiel et la louange ; la traduction ne doit pas dissoudre cette tension.
- issue: Valeur de εὐχάς
  choice: Comprendre le mot comme « vœux »
  alternative: Traduire par « prières »
  rationale: Avec ἀπόδος et dans la citation du Psaume 50(49), il s’agit d’engagements solennels à accomplir.
translation_notes:
  register: Français moderne, international et digne. La ponctuation française répartit la citation en deux phrases pour faciliter la lecture sans modifier son enchaînement logique. Le tutoiement singulier suit les formes grecques et l’adresse directe de la citation.
