  text: Car un sacrifice à Dieu, c’est un esprit brisé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία
  choice: sacrifice
  rationale: Le terme français correspond directement au grec et conserve l’image cultuelle.
- source_word: πνεῦμα
  choice: esprit
  rationale: « Esprit » est l’équivalent naturel ici et préserve la formulation traditionnelle de la citation scripturaire.
- source_word: συντετριμμένον
  choice: brisé
  rationale: Le participe décrit littéralement ce qui est broyé ou brisé; appliqué à l’esprit, il exprime l’humilité et la contrition sans les expliciter davantage.
theological_decisions:
- issue: Valeur du datif τῷ θεῷ
  choice: « qui plaît à Dieu »
  alternative: « offert à Dieu » / « pour Dieu »
  rationale: Le datif peut marquer la relation à Dieu; la tournure retenue rend naturellement en français l’idée d’un sacrifice agréé par Dieu, dans le contexte de la citation du Psaume 51:19 (LXX 50:19), sans faire de l’offrande une précision explicite du grec.
translation_notes:
  register: Français moderne, simple et digne. La phrase garde l’image paradoxale du sacrifice identifié à un esprit brisé.
