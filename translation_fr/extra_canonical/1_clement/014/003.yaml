id: 1CLEM.14.3
reference: 1 Clement 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: χρηστευσώμεθα ἑαυτοῖς κατὰ τὴν εὐσπλαγχνίαν καὶ γλυκύτητα τοῦ ποιήσαντος ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/003.yaml
  text: Let us be kind to one another according to the compassion and gentleness of the One who made us[a].
translation:
  language: fr
  text: Faisons preuve de bonté les uns envers les autres, selon la compassion et la douceur de celui qui nous a créés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faisons preuve de bonté envers nous-mêmes ».
    reason: Le pronom grec ἑαυτοῖς peut être compris au sens réfléchi, bien que le sens réciproque convienne mieux au contexte.
lexical_decisions:
- source_word: χρηστευσώμεθα
  choice: Faisons preuve de bonté
  rationale: Le verbe à l’exhortatif appelle à manifester activement la bonté; cette tournure est naturelle et digne en français moderne.
- source_word: ἑαυτοῖς
  choice: les uns envers les autres
  rationale: Le pronom réfléchi pluriel a ici une valeur réciproque naturelle dans le contexte communautaire; la valeur strictement réfléchie demeure signalée en note.
- source_word: κατὰ
  choice: à l’image de
  rationale: Dans cette exhortation éthique, la préposition indique la norme ou le modèle fourni par les qualités du Créateur; cette formulation évite le calque peu naturel «selon».
- source_word: εὐσπλαγχνίαν
  choice: compassion
  rationale: Rend directement l’idée de profonde miséricorde ou tendresse compatissante.
- source_word: γλυκύτητα
  choice: douceur
  rationale: Préserve l’image de douceur aimable sans durcir le terme en «bienveillance».
- source_word: τοῦ ποιήσαντος ἡμᾶς
  choice: de celui qui nous a créés
  rationale: Le participe substantivé désigne celui qui nous a faits; «créés» exprime naturellement cette idée en français théologique courant sans ajouter de titre absent du grec.
theological_decisions:
- issue: Valeur de ἑαυτοῖς
  choice: 'Lecture réciproque: «les uns envers les autres»'
  alternative: 'Lecture réfléchie: «envers nous-mêmes»'
  rationale: L’usage hellénistique permet au réfléchi pluriel d’avoir une force réciproque, et le contexte de concorde communautaire favorise nettement cette lecture. L’autre possibilité est conservée en note afin de ne pas effacer l’ambiguïté grammaticale.
- issue: Identification de «celui qui nous a créés»
  choice: Conserver la désignation descriptive sans ajouter «Dieu»
  alternative: 'Expliciter: «Dieu, qui nous a créés»'
  rationale: Le référent divin est clair, mais le grec emploie un participe substantivé plutôt qu’un nom explicite; la traduction respecte cette forme.
translation_notes:
  register: Français international moderne, naturel et digne. L’exhortation communautaire reste directe; le langage théologique demeure accessible et aucun développement doctrinal n’est ajouté.
