source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
translation:
  language: fr
  text: 'En effet, il est écrit : « Les gens de bien habiteront le pays[a], et les innocents y resteront ; mais ceux qui enfreignent la loi seront extirpés du pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ».
    reason: Le grec γῆ peut désigner aussi bien un pays ou territoire que la terre au sens général.
lexical_decisions:
- source_word: Χρηστοὶ
  choice: les gens de bien
  rationale: Dans ce contexte proverbial, le terme désigne des personnes bonnes ou droites. « Les gens de bien » est naturel en français et évite de réduire le sens à la seule bonté affective.
- source_word: οἰκήτορες γῆς
  choice: habiteront le pays
  rationale: La tournure grecque signifie littéralement « seront habitants du pays/de la terre ». Le verbe « habiter » donne un français naturel tout en conservant l’idée de résidence durable.
- source_word: ἄκακοι
  choice: les innocents
  rationale: Le mot qualifie ceux qui sont sans mal ou sans méchanceté. « Les innocents » convient au contraste moral du passage sans surinterprétation.
- source_word: παρανομοῦντες
  choice: ceux qui agissent au mépris de la loi
  rationale: Le participe désigne ceux qui enfreignent la loi ou agissent contrairement à elle. Cette formulation conserve l’idée d’une conduite habituelle et ne précise pas de quelle loi il s’agit.
- source_word: ἐξολεθρευθήσονται
  choice: seront exterminés
  rationale: Le verbe exprime une destruction complète ou une élimination radicale. « Exterminés » restitue sa force, tandis que « en » rend naturellement le complément ἀπ᾽ αὐτῆς en français.
theological_decisions:
- issue: Portée de γῆς
  choice: le pays
  alternative: la terre
  rationale: Dans ce langage sapientiel, γῆ peut désigner le pays où demeurent les justes ou la terre au sens plus large. Le texte retient « le pays » et signale l’autre lecture possible en note.
- issue: Référent de la loi dans παρανομοῦντες
  choice: la loi, sans autre précision
  alternative: la Loi divine
  rationale: Le grec évoque l’action contraire à la loi sans nommer explicitement son référent. La traduction préserve cette indétermination au lieu d’ajouter une précision théologique.
translation_notes:
  register: Style proverbial, solennel et lisible. La coordination et le contraste du grec sont conservés, avec des formulations françaises actuelles sans atténuer la sévérité du dernier verbe.
