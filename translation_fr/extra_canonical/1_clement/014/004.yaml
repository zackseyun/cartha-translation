review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, et l’ambiguïté de γῆ est correctement signalée. Toutefois, « agir au mépris de la loi » ajoute l’idée de mépris, absente du participe παρανομοῦντες, qui désigne plus directement ceux qui enfreignent ou transgressent la loi. « Exterminés » rend la force de ἐξολεθρευθήσονται, mais « extirpés du pays » exprime plus idiomatiquement en français à la fois l’élimination et l’éloignement indiqué par ἀπ’ αὐτῆς.
  naturalness: Le style proverbial est bon et actuel. « Les gens de bien », « y resteront » et la construction adversative sont naturels. La formulation révisée resserre la dernière clause dans un français plus idiomatique et plus proche du parallélisme proverbial.
  terminology: « Les gens de bien » convient à χρηστοί dans ce contraste moral. « Les innocents » est acceptable pour ἄκακοι, bien que le mot grec puisse également évoquer l’absence de malice. « Enfreignent la loi » restitue παρανομοῦντες sans identifier indûment la loi; « extirpés » conserve la portée énergique de ἐξολεθρεύω et le mouvement hors du pays.
  issues:
