    rationale: Le grec indique l’action contraire à la loi, sans comporter nécessairement une notion subjective de mépris ou de défiance.
  - severity: low
    issue: Rendu du couple ἐξολεθρευθήσονται ἀπ’ αὐτῆς
    rationale: « En seront exterminés » est compréhensible, mais « seront extirpés du pays » rend plus naturellement l’élimination complète et le complément de séparation.
