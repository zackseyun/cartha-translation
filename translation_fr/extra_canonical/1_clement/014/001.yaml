id: 1CLEM.14.1
reference: 1 Clement 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
translation:
  language: fr
  text: Il est donc juste et saint, frères, que nous devenions obéissants à Dieu plutôt que de suivre ceux qui, dans l’arrogance et le désordre, sont les instigateurs[a] d’une jalousie odieuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les meneurs d’une jalousie odieuse ».'
    reason: ἀρχηγός peut désigner un instigateur ou un meneur; la construction avec le génitif favorise ici « instigateurs de », mais l’autre nuance reste possible.
lexical_decisions:
- source_word: Δίκαιον ... καὶ ὅσιον
  choice: juste et saint
  rationale: Conserve les deux qualifications morales et religieuses du grec dans une formulation française simple et digne.
- source_word: ὑπηκόους ... γενέσθαι τῷ θεῷ
  choice: que nous devenions obéissants à Dieu
  rationale: Rend directement l’idée de devenir ou de se montrer soumis à Dieu, sans réduire γενέσθαι à un simple état présent.
- source_word: ἀλαζονείᾳ καὶ ἀκαταστασίᾳ
  choice: dans l’arrogance et le désordre
  rationale: Reproduit les deux notions grecques sans préciser abusivement si elles décrivent une attitude personnelle ou une situation communautaire.
- source_word: μυσεροῦ ζήλους
  choice: d’une jalousie odieuse
  rationale: Dans ce contexte de conflit, ζῆλος désigne vraisemblablement une jalousie ou rivalité condamnable; « odieuse » traduit la forte réprobation de μυσερός.
- source_word: ἀρχηγοῖς
  choice: instigateurs
  rationale: Avec le génitif qui suit, le terme désigne naturellement ceux qui sont à l’origine de la jalousie, et non de simples participants.
theological_decisions:
- issue: Nature de l’opposition entre obéissance à Dieu et adhésion aux fauteurs de trouble
  choice: Conserver l’opposition directe sans ajouter d’explication doctrinale
  alternative: Expliciter cette obéissance en termes d’autorité ecclésiale ou de soumission institutionnelle
  rationale: Le verset oppose explicitement Dieu aux instigateurs du conflit, mais ne définit pas ici les structures ou doctrines par lesquelles cette obéissance doit s’exercer.
translation_notes:
  register: Français international moderne, naturel et digne. L’adresse « frères » conserve la forme masculine du grec ἄνδρες ἀδελφοί sans alourdir la phrase; la structure antithétique et les tensions lexicales du texte source sont maintenues.
