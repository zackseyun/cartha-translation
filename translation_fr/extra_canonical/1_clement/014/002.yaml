revisions:
- from: Car ce n’est pas un tort ordinaire que nous subirons, mais plutôt un grand danger, si nous nous livrons témérairement aux volontés de ceux qui tombent dans les querelles et les divisions, au point de nous détourner de ce qui est bon.
  to: Car nous ne subirons pas un dommage ordinaire, mais bien un grand danger, si nous nous livrons témérairement aux volontés de ceux qui tombent dans les querelles et les divisions, ce qui nous détournerait de ce qui est bon.
  rationale: La révision remplace « tort » par « dommage » et reformule la dernière proposition afin que l'éloignement d'avec le bien ne soit pas attribué grammaticalement à « nous » comme agent. « Ce qui nous détournerait » laisse ouverte la valeur de εἰς τὸ (résultat ou visée) sans imposer une intention doctrinale ou psychologique aux personnes en cause.
