source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
translation:
  language: fr
  text: Car nous ne subirons pas un dommage ordinaire, mais bien un grand danger, si nous nous livrons témérairement aux volontés de ceux qui tombent dans les querelles et les divisions, ce qui nous détournerait de ce qui est bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν
  choice: ce n’est pas un tort ordinaire
  rationale: L’expression idiomatique nie un dommage quelconque ou banal et souligne sa gravité; « tort ordinaire » reste naturel tout en conservant βλάβη.
- source_word: ὑποίσομεν
  choice: nous subirons
  rationale: Le futur de ὑποφέρω exprime ici le fait d’endurer ou de subir le tort et le danger.
- source_word: ῥιψοκινδύνως
  choice: témérairement
  rationale: Rend l’idée d’une conduite qui prend inconsidérément des risques, dans un registre digne et courant.
- source_word: ἐπιδῶμεν ἑαυτοὺς
  choice: nous nous livrons
  rationale: Dans cette construction, le verbe exprime le fait de s’abandonner ou de se remettre à quelque chose.
- source_word: τοῖς θελήμασιν
  choice: aux volontés
  rationale: θελήματα désigne les volontés, souhaits ou desseins; « volontés » préserve la portée générale du terme.
- source_word: πίπτουσιν εἰς ἔριν καὶ στάσεις
  choice: tombent dans les querelles et les divisions
  rationale: Traduction directe de πίπτουσιν avec des équivalents naturels pour ἔρις et στάσεις; le sujet est bien « ceux », sans ajouter « nous » comme objet.
- source_word: τοῦ καλοῦ ἔχοντος
  choice: de ce qui est bon
  rationale: Rend substantivement τὸ καλόν; ἔχοντος semble faire partie d’une formulation textuellement difficile, mais le sens contextuel demeure « ce qui est bon ».
theological_decisions:
- issue: Valeur de εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς
  choice: au point de nous détourner
  alternative: afin de nous rendre étrangers
  rationale: La construction peut exprimer le résultat ou le but. « Au point de » conserve cette ouverture mieux qu’une formulation exclusivement intentionnelle; « détourner » communique naturellement l’éloignement d’avec le bien.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase garde la progression rhétorique du grec (« non pas… mais plutôt… ») sous une forme française fluide et préserve l’ambiguïté entre résultat et finalité dans la dernière proposition.
