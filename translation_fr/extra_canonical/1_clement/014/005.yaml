source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: fr
  text: 'Et il dit encore : « J’ai vu l’impie élevé au plus haut et se dressant comme les cèdres du Liban. Je suis passé, et voici qu’il n’était plus là ; j’ai cherché sa place, mais je ne l’ai pas trouvée. Garde l’innocence et considère la droiture, car il y a une postérité pour l’homme de paix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβῆ
  choice: l’impie
  rationale: Rend directement le substantif adjectival grec et conserve sa portée morale et religieuse.
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  choice: s’élever très haut et se dresser
  rationale: Reproduit les deux participes et leur intensification sans lourdeur excessive en français.
- source_word: παρῆλθον
  choice: je suis passé
  rationale: Conserve le sens simple du verbe grec et l’enchaînement narratif.
- source_word: φύλασσε ἀκακίαν
  choice: garde l’innocence
  rationale: « Garde » préserve la valeur impérative de φύλασσε ; « innocence » exprime ici l’absence de mal et la conduite intègre.
- source_word: ἴδε εὐθύτητα
  choice: considère la droiture
  rationale: Évite le littéralisme peu naturel « vois la droiture » tout en gardant l’appel à l’observer attentivement.
- source_word: ἐγκατάλειμμα
  choice: postérité
  rationale: Dans le contexte du Psaume 37:37 cité ici, le terme désigne probablement un avenir ou une postérité qui demeure, plutôt qu’un simple « reste » matériel.
- source_word: ἀνθρώπῳ εἰρηνικῷ
  choice: pour l’homme de paix
  rationale: Formulation française naturelle qui conserve la caractérisation de la personne par la paix.
theological_decisions:
- issue: Sens de ἐγκατάλειμμα dans la conclusion de la citation
  choice: postérité
  alternative: reste / avenir
  rationale: Le mot grec peut évoquer ce qui subsiste ou est laissé après quelqu’un. « Postérité » convient au contexte sapientiel et au destin durable de l’homme de paix, sans transformer la phrase en affirmation doctrinale plus précise.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe citationnelle et le parallélisme sapientiel sont conservés, avec une légère adaptation idiomatique pour « considère la droiture ».
