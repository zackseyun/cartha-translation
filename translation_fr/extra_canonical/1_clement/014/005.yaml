review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « s’élever très haut » atténue la voix médio-passive de ὑπερυψούμενον (« élevé / exalté »), tandis que ἐπαιρόμενον exprime le fait de se dresser ou de s’élever. La révision conserve plus nettement cette double nuance.
  naturalness: Le français demeure moderne et fluide. « Sa place » est plus idiomatique et plus proche de τόπον que « son emplacement » dans ce contexte poétique.
  terminology: « L’impie », « innocence », « droiture », « postérité » et « homme de paix » conviennent. « Postérité » rend de façon recevable ἐγκατάλειμμα dans cette citation du psaume, dont la nuance peut couvrir ce qui demeure ou l’avenir durable; aucune note n’est indispensable dans ce format.
  issues:
  - severity: low
    issue: Nuance de ὑπερυψούμενον
    rationale: La formulation « s’élever très haut » présente l’impie comme l’agent des deux actions. Le grec distingue « être élevé/exalté » de « se dresser »; cette distinction peut être conservée naturellement en français.
  - severity: low
    issue: Rendu de τὸν τόπον αὐτοῦ
    rationale: « Son emplacement » est compréhensible, mais « sa place » est à la fois plus naturel dans une évocation poétique et plus proche du terme grec.
