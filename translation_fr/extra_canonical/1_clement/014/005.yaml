revisions:
- from: 'Et il dit encore : « J’ai vu l’impie s’élever très haut et se dresser comme les cèdres du Liban. Je suis passé, et voici qu’il n’était plus là ; j’ai cherché son emplacement, mais je ne l’ai pas trouvé. Garde l’innocence et considère la droiture, car il y a une postérité pour l’homme de paix. »'
  to: 'Et il dit encore : « J’ai vu l’impie élevé au plus haut et se dressant comme les cèdres du Liban. Je suis passé, et voici qu’il n’était plus là ; j’ai cherché sa place, mais je ne l’ai pas trouvée. Garde l’innocence et considère la droiture, car il y a une postérité pour l’homme de paix. »'
  rationale: La révision rétablit la distinction entre l’exaltation subie ou constatée de l’impie et son élévation orgueilleuse, tout en améliorant légèrement l’expression française de « sa place ». Le choix « postérité » est maintenu, car il rend sans surinterprétation la perspective de continuité ou de survivance exprimée par ἐγκατάλειμμα dans la citation scripturaire.
