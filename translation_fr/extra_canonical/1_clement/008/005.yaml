id: 1CLEM.8.5
reference: 1 Clement 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
translation:
  language: fr
  text: Voulant donc que tous ses bien-aimés aient part à la repentance, il a confirmé cela[a] par sa volonté toute-puissante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet du verbe « a confirmé » est sous-entendu en grec ; il peut renvoyer à la repentance offerte ou à la déclaration qui précède.
    reason: Signaler l’ellipse grecque et préserver l’ambiguïté du référent.
lexical_decisions:
- source_word: μετανοίας μετασχεῖν
  choice: aient part à la repentance
  rationale: Rend directement l’idée de participer ou d’avoir part à la repentance, sans réduire μετάνοια au seul regret ni expliciter davantage le changement intérieur et pratique qu’elle implique.
- source_word: ἐστήριξεν
  choice: a confirmé
  rationale: Le verbe signifie rendre ferme, affermir ou confirmer. Dans le contexte des déclarations et promesses divines qui précèdent, « a confirmé » exprime naturellement cette idée.
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  choice: par sa volonté toute-puissante
  rationale: Préserve le lien lexical avec la toute-puissance divine tout en donnant une formulation française naturelle et digne.
- source_word: τοὺς ἀγαπητοὺς αὐτοῦ
  choice: ses bien-aimés
  rationale: Traduction usuelle et naturelle de l’expression, sans préciser une identité que le grec laisse générale.
theological_decisions:
- issue: Complément non exprimé de ἐστήριξεν
  choice: cela
  alternative: la repentance / sa promesse
  rationale: Le grec n’énonce pas explicitement ce que Dieu a confirmé. Le démonstratif neutre renvoie au propos précédent sans trancher entre la repentance offerte, la déclaration divine et les promesses qui l’accompagnent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la construction participiale du grec sous une forme naturelle et maintient l’ellipse de son complément au moyen de « cela ».
