  yaml_path: translation/extra_canonical/1_clement/008/001.yaml
  text: The ministers of the grace of God spoke through the Holy Spirit concerning repentance,
translation:
  language: fr
  text: Les serviteurs de la grâce de Dieu ont parlé, par l’Esprit Saint, au sujet de la repentance,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργοὶ
  choice: serviteurs
  rationale: Dans ce contexte, le terme désigne ceux qui accomplissent un service pour Dieu. « Serviteurs » est naturel et suffisamment large, sans imposer l’idée moderne de ministres ordonnés.
- source_word: χάριτος
  choice: grâce
  rationale: Équivalent théologique usuel de χάρις, qui conserve ici l’idée de la faveur et de l’action bienveillante de Dieu.
- source_word: διὰ πνεύματος ἁγίου
  choice: par l’Esprit Saint
  rationale: La préposition διά avec le génitif exprime l’intermédiaire ou l’agent; « par » rend cette relation sans préciser davantage son mode.
- source_word: μετανοίας
  choice: repentance
  rationale: Le terme désigne un changement intérieur qui conduit à se détourner du mal; « repentance » préserve son sens religieux précis et reste compréhensible en français biblique moderne.
theological_decisions:
- issue: Identité des λειτουργοί
  choice: serviteurs
  alternative: ministres
  rationale: Le grec ne précise ni fonction ecclésiastique ni statut institutionnel. « Serviteurs » évite d’importer une conception ultérieure du ministère.
- issue: Rôle de l’Esprit Saint
  choice: ont parlé, par l’Esprit Saint
  alternative: ont parlé sous l’inspiration de l’Esprit Saint
  rationale: La traduction conserve la formulation instrumentale du grec sans expliciter celle-ci par une théorie particulière de l’inspiration.
translation_notes:
  register: Français international moderne, digne et lisible. La structure de la phrase grecque est conservée sans lourdeur excessive; la virgule finale est maintenue puisque le verset se poursuit syntaxiquement.
