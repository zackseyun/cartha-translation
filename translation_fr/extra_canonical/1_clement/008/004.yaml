source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἐν ἑτέρῳ τόπῳ λέγει οὕτως· Λούσασθε καὶ καθαροὶ γένεσθε, ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου· παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν· καὶ δεῦτε καὶ διελεγχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ· ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ· καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου, τὰ ἀγαθὰ τῆς γῆς φάγεσθε· ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/004.yaml
  text: 'And in another place he says thus: “Wash and become clean; remove your wicked deeds from before my eyes[a], from your souls; cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.”'
translation:
  language: fr
  text: 'Et ailleurs, il dit ainsi : « Lavez-vous et devenez purs ; ôtez de vos âmes vos mauvaises actions, de devant mes yeux. Cessez de faire le mal, apprenez à faire le bien, recherchez la justice, délivrez celui qu’on opprime, rendez justice à l’orphelin et défendez la veuve. Venez donc, et discutons ensemble, dit le Seigneur. Même si vos péchés sont comme le pourpre, je les rendrai blancs comme la neige ; même s’ils sont comme l’écarlate, je les rendrai blancs comme la laine. Si vous le voulez et si vous m’écoutez, vous mangerez les biens de la terre ; mais si vous ne le voulez pas et ne m’écoutez pas, l’épée vous dévorera. Car la bouche du Seigneur a prononcé ces paroles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέλεσθε τὰς πονηρίας
  choice: ôtez […] vos mauvaises actions
  rationale: Le pluriel désigne ici les actes mauvais à faire disparaître ; « mauvaises actions » est plus naturel et précis que l’abstrait « méchancetés ».
- source_word: ἐκζητήσατε κρίσιν
  choice: recherchez la justice
  rationale: κρίσις évoque ici l’exercice concret d’un jugement juste, particulièrement envers les personnes vulnérables.
- source_word: ῥύσασθε ἀδικούμενον
  choice: délivrez celui qu’on opprime
  rationale: Le participe désigne une personne victime d’injustice ; « opprime » exprime naturellement cette atteinte dans le contexte social.
- source_word: κρίνατε ὀρφανῷ
  choice: rendez justice à l’orphelin
  rationale: La tournure grecque signifie plaider ou juger équitablement en faveur de l’orphelin, plutôt que porter un jugement sur lui.
- source_word: δικαιώσατε χήραν
  choice: défendez la veuve
  rationale: Dans ce contexte judiciaire, le verbe appelle à faire reconnaître le bon droit de la veuve ; « défendez » est idiomatique sans surcharger le texte.
- source_word: διελεγχθῶμεν
  choice: discutons ensemble
  rationale: Le verbe peut évoquer un débat contradictoire ou l’examen d’un différend ; cette traduction conserve l’idée d’une confrontation raisonnée sans imposer l’idée d’une simple conciliation.
- source_word: φοινικοῦν
  choice: rouge pourpre
  rationale: Le terme désigne une teinte rouge foncé ou pourpre ; cette formulation le distingue de κόκκινον, rendu par « écarlate ».
- source_word: μάχαιρα ὑμᾶς κατέδεται
  choice: l’épée vous dévorera
  rationale: La métaphore forte de l’épée qui dévore est conservée conformément au grec.
theological_decisions:
- issue: Relation entre les mauvaises actions, les âmes et le regard divin
  choice: ôtez de devant mes yeux vos mauvaises actions, ôtez-les de vos âmes
  alternative: ôtez de vos âmes vos mauvaises actions devant mes yeux
  rationale: L’ordre grec place « de vos âmes » puis « devant mes yeux » de façon syntaxiquement tendue. La traduction garde les deux rapports sans supprimer l’un d’eux, tandis que la note signale la construction plus littérale.
- issue: Invitation divine exprimée par διελεγχθῶμεν
  choice: discutons ensemble
  alternative: réglons notre différend / raisonnons ensemble
  rationale: Le grec suggère un examen contradictoire. « Discutons ensemble » préserve cette ouverture sans déterminer à l’avance s’il s’agit d’un procès, d’une réprimande ou d’une réconciliation.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs conservent la solennité de l’exhortation prophétique ; le parallélisme, les images de couleur et la métaphore de l’épée sont maintenus.
