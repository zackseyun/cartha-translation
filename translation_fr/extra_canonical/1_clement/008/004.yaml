revisions:
- from: 'Et ailleurs, il dit encore : « Lavez-vous et devenez purs ; ôtez de devant mes yeux vos mauvaises actions, ôtez-les de vos âmes[a]. Cessez de faire le mal, apprenez à faire le bien, recherchez la justice, délivrez celui qu’on opprime, rendez justice à l’orphelin et défendez la veuve. Venez donc, et discutons ensemble, dit le Seigneur. Même si vos péchés sont rouge pourpre, je les rendrai blancs comme la neige ; même s’ils sont écarlates, je les rendrai blancs comme la laine. Si vous le voulez et si vous m’écoutez, vous mangerez les bonnes choses de la terre ; mais si vous ne le voulez pas et ne m’écoutez pas, l’épée vous dévorera. Car la bouche du Seigneur a prononcé ces paroles. »'
  to: 'Et ailleurs, il dit ainsi : « Lavez-vous et devenez purs ; ôtez de vos âmes vos mauvaises actions, de devant mes yeux. Cessez de faire le mal, apprenez à faire le bien, recherchez la justice, délivrez celui qu’on opprime, rendez justice à l’orphelin et défendez la veuve. Venez donc, et discutons ensemble, dit le Seigneur. Même si vos péchés sont comme le pourpre, je les rendrai blancs comme la neige ; même s’ils sont comme l’écarlate, je les rendrai blancs comme la laine. Si vous le voulez et si vous m’écoutez, vous mangerez les biens de la terre ; mais si vous ne le voulez pas et ne m’écoutez pas, l’épée vous dévorera. Car la bouche du Seigneur a prononcé ces paroles. »'
  rationale: La révision corrige l’expression de couleur, rend plus idiomatiquement « les biens de la terre » et maintient, dans une seule construction française, les deux compléments difficiles du grec. La note est conservée pour signaler cette difficulté textuelle sans imposer une analyse unique.
