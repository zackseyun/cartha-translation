    text: 'Littéralement, selon l’ordre des mots grecs : « ôtez de vos âmes vos mauvaises actions devant mes yeux ». La relation syntaxique précise entre « de vos âmes » et « devant mes yeux » demeure difficile à déterminer.'
    reason: La syntaxe grecque juxtapose les deux compléments après « ôtez » et permet plus d’un rattachement, sans qu’aucun des deux éléments ne soit omis.
