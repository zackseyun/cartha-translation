revisions:
- from: '« Repentez-vous, maison d’Israël, de vos actes contraires à la loi. J’ai dit aux fils de mon peuple : “Si vos péchés s’étendent de la terre jusqu’au ciel, s’ils sont plus rouges que l’écarlate et plus noirs que la toile de sac, mais que vous reveniez à moi de tout votre cœur et me disiez : ‘Père’, je vous écouterai comme un peuple saint.” »'
  to: '« Repentez-vous de vos iniquités, maison d’Israël. J’ai dit aux fils de mon peuple : “Si vos péchés vont de la terre jusqu’au ciel, s’ils sont plus rouges que l’écarlate et plus noirs que le sac, et si vous revenez à moi de tout votre cœur et dites : ‘Père’, je vous écouterai comme un peuple saint.” »'
  rationale: La révision supprime l’adversatif non exprimé par le grec et rétablit une succession conditionnelle naturelle en français. « Iniquités » rend ἀνομίαι dans un français biblique actuel sans le réduire à l’illégalité civile. « Comme un peuple saint » maintient volontairement la formulation comparative et son ambiguïté, conformément au grec ὡς λαοῦ ἁγίου.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:54Z'
review_pass:
  verdict: revise
  source_fidelity: Le rendu conserve correctement l’impératif Μετανοήσατε, l’aoriste à la première personne εἶπον (« J’ai dit »), l’image hyperbolique allant de la terre au ciel, les comparaisons de couleur, le retour « de tout votre cœur » et la promesse d’écoute. Toutefois, « mais que » n’a pas de correspondant dans le grec, qui coordonne les conditions par καί, et introduit une opposition/concession interprétative.
  naturalness: La phrase est globalement digne et accessible, mais l’enchaînement « Si…, s’ils…, mais que vous reveniez » est grammaticalement et stylistiquement heurté en français. Une coordination régulière des trois conditions rend la période naturelle sans modifier son caractère conditionnel.
  terminology: « Repentez-vous », « maison d’Israël », « péchés », « écarlate », « sac », « Père » et « peuple saint » conviennent au registre biblique moderne. « actes contraires à la loi » explique légitimement ἀνομία, mais « iniquités » est plus concis, plus naturel dans ce registre et conserve la portée morale et religieuse du terme.
  issues:
  - severity: medium
    issue: Ajout de « mais » dans la chaîne conditionnelle
    rationale: Le texte grec emploie καί avant ἐπιστραφῆτε et ne marque pas explicitement une opposition par ἀλλά, οὐδὲ ou une autre particule adversative. « Mais que » infléchit donc la relation logique entre la gravité des péchés et le retour vers Dieu.
  - severity: low
    issue: Construction conditionnelle française heurtée
    rationale: Après « Si vos péchés… » et « s’ils… », « mais que vous reveniez » rompt inutilement le parallélisme. « Et si vous revenez… et dites… » restitue clairement la coordination grecque.
  revised_text: '« Repentez-vous de vos iniquités, maison d’Israël. J’ai dit aux fils de mon peuple : “Si vos péchés vont de la terre jusqu’au ciel, s’ils sont plus rouges que l’écarlate et plus noirs que le sac, et si vous revenez à moi de tout votre cœur et dites : ‘Père’, je vous écouterai comme un peuple saint.” »'
