source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: fr
  text: '« Repentez-vous de vos iniquités, maison d’Israël. J’ai dit aux fils de mon peuple : “Si vos péchés vont de la terre jusqu’au ciel, s’ils sont plus rouges que l’écarlate et plus noirs que le sac, et si vous revenez à moi de tout votre cœur et dites : ‘Père’, je vous écouterai comme un peuple saint.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Repentez-vous
  rationale: Rend l’appel à un changement profond d’attitude et de conduite dans un registre biblique naturel et actuel.
- source_word: ἀνομίας
  choice: actes contraires à la loi
  rationale: Exprime l’idée d’illégalité ou de mépris de la loi sans réduire le terme à une notion vague de mal.
- source_word: εἶπον
  choice: J’ai dit
  rationale: Conserve l’aoriste à la première personne transmis par le texte grec, plutôt qu’un impératif conjectural.
- source_word: ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ
  choice: s’étendent de la terre jusqu’au ciel
  rationale: Le grec dit littéralement que les péchés sont de la terre au ciel; « s’étendent » rend cette image spatiale de façon intelligible sans préciser davantage comment ils atteignent le ciel.
- source_word: πυρρότεραι κόκκου
  choice: plus rouges que l’écarlate
  rationale: Restitue la comparaison chromatique; κόκκος désigne ici l’écarlate issue de la cochenille, tandis que πυρρός évoque un rouge ardent.
- source_word: σάκκου
  choice: toile de sac
  rationale: Désigne l’étoffe sombre et grossière associée au deuil et à la pénitence.
- source_word: ἐπιστραφῆτε
  choice: reveniez à moi
  rationale: Conserve l’image d’un retournement vers Dieu et évite de répéter « repentez-vous ».
- source_word: ἐπακούσομαι
  choice: je vous écouterai
  rationale: Rend directement la promesse d’écoute favorable, sans expliciter par « exaucer » une réponse qui n’est pas formulée.
theological_decisions:
- issue: Rapport entre l’ampleur des péchés et le retour à Dieu
  choice: Maintien de la construction conditionnelle avec « mais que »
  alternative: « Même si… pourtant, si… »
  rationale: Le texte grec enchaîne des propositions introduites par ἐάν et καί; la formulation retenue préserve la tension entre l’extrême gravité des péchés et la promesse faite en cas de retour, sans transformer explicitement les premières conditions en concessives.
- issue: Sens de « comme un peuple saint »
  choice: Traduction littérale de ὡς λαοῦ ἁγίου
  alternative: « parce que vous serez un peuple saint » ou « en vous considérant comme un peuple saint »
  rationale: La comparaison conserve l’ambiguïté du grec sur la manière exacte dont l’écoute divine se rapporte au statut de peuple saint.
translation_notes:
  register: Français international moderne, digne et accessible, avec une cadence biblique sobre. Les citations emboîtées sont distinguées par des guillemets français, anglais doubles puis simples.
