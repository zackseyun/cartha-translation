source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
translation:
  language: fr
  text: 'Et le Maître de toutes choses lui-même a aussi parlé de la repentance en prêtant serment : « Aussi vrai que je suis vivant, dit le Seigneur, je ne désire pas tant la mort du pécheur que sa repentance », ajoutant aussi une bonne parole :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης τῶν ἁπάντων
  choice: le Maître de toutes choses
  rationale: Rend le titre et son complément de façon formelle et naturelle, tout en conservant l’idée d’autorité souveraine.
- source_word: μετάνοια
  choice: repentance
  rationale: Le terme français conserve ici la dimension morale et religieuse du retournement intérieur, et maintient le lien lexical entre περὶ μετανοίας et τὴν μετάνοιαν.
- source_word: μετὰ ὅρκου
  choice: en prêtant serment
  rationale: Expression française naturelle qui communique explicitement que la parole est accompagnée d’un serment.
- source_word: Ζῶ γὰρ ἐγώ
  choice: Aussi vrai que je suis vivant
  rationale: Formule idiomatique française de serment qui préserve la force de l’hébreu biblique reflété par le grec, plutôt qu’un littéral peu naturel « Car je vis ».
- source_word: οὐ βούλομαι ... ὡς
  choice: je ne désire pas ... mais
  rationale: Dans cette comparaison de préférence, le français exprime naturellement l’opposition par « non pas… mais »; le sens n’est pas un simple degré de désir.
- source_word: γνώμην ἀγαθήν
  choice: cette bonne déclaration
  rationale: Dans le contexte, γνώμη introduit une parole formulée qui suit; « déclaration » évite le sens moderne potentiellement judiciaire de « jugement » et celui trop subjectif d’« intention ».
theological_decisions:
- issue: Nature de la préférence divine dans οὐ βούλομαι ... ὡς
  choice: « je ne désire pas la mort du pécheur, mais sa repentance »
  alternative: « je ne désire pas autant la mort du pécheur que sa repentance »
  rationale: La tournure grecque exprime idiomatiquement une préférence contrastive. La formulation retenue correspond au sens de la citation prophétique sans suggérer que Dieu désirerait la mort du pécheur à un degré moindre.
- issue: Identification implicite du « Seigneur »
  choice: Conserver simplement « le Seigneur »
  alternative: Expliciter une identification divine ou christologique
  rationale: Le grec ne précise pas davantage l’identité dans cette proposition; la traduction ne doit pas résoudre une éventuelle question théologique absente de la formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement syntaxique du grec et les répétitions significatives, tout en employant une formule de serment idiomatique. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
