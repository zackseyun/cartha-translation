id: 1CLEM.30.8
reference: 1 Clement 30:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
translation:
  language: fr
  text: L’insolence[a], l’arrogance et la témérité caractérisent ceux que Dieu a maudits ; mais la modération, l’humilité et la douceur se trouvent chez ceux que Dieu a bénis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’audace effrontée ».
    reason: θράσος peut désigner une audace excessive ou impudente ; la note préserve cette nuance lexicale tout en évitant la connotation souvent positive d’« audace » employé seul.
lexical_decisions:
- source_word: θράσος
  choice: insolence
  rationale: Dans cette liste de vices, le mot désigne une audace excessive et effrontée, non un courage admirable.
- source_word: αὐθάδεια
  choice: arrogance
  rationale: Le terme évoque l’assurance hautaine et la volonté de n’en faire qu’à sa tête ; « arrogance » en exprime naturellement la valeur négative.
- source_word: τόλμα
  choice: témérité
  rationale: Dans ce contexte défavorable, le mot désigne une hardiesse imprudente plutôt qu’une audace vertueuse.
- source_word: ἐπιείκεια
  choice: modération
  rationale: Ce choix exprime l’attitude mesurée, conciliante et indulgente du terme tout en la distinguant de πραΰτης.
- source_word: ταπεινοφροσύνη
  choice: humilité
  rationale: Équivalent français direct et naturel de l’abaissement volontaire de l’esprit.
- source_word: πραΰτης
  choice: douceur
  rationale: Le terme désigne une disposition douce, non brutale et maîtrisée.
theological_decisions:
- issue: Agent des participes κατηραμένοις et ηὐλογημένοις
  choice: « ceux que Dieu a maudits » et « ceux que Dieu a bénis »
  alternative: « les maudits de Dieu » et « les bénis de Dieu »
  rationale: La formulation verbale française rend clairement Dieu comme agent des deux passifs grecs, sans ajouter d’explication doctrinale.
- issue: Relation exprimée par les datifs et παρά
  choice: « caractérisent ceux… » puis « se trouvent chez ceux… »
  alternative: « appartiennent à ceux… » dans les deux membres
  rationale: Ces formulations naturelles conservent le contraste entre les vices associés aux maudits et les vertus présentes parmi les bénis, sans imposer une relation métaphysique plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme ternaire et l’opposition entre les deux groupes sont conservés ; « modération » évite de traduire ἐπιείκεια et πραΰτης par le même mot français.
