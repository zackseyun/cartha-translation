  text: εὐλογημένος γεννητὸς γυναικὸς ὀλιγόβιος. μὴ πολὺς ἐν ῥήμασιν γίνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/005.yaml
  text: Blessed is one born of woman[a], short-lived. Do not be one of many words.
translation:
  language: fr
  text: Béni est celui qui est né d’une femme et dont la vie est brève[a]. Ne sois pas de ceux qui parlent beaucoup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Béni, né d’une femme, de courte vie. »'
    reason: Le grec juxtapose trois qualificatifs sans verbe fini exprimé ; le français les articule pour une lecture naturelle.
lexical_decisions:
- source_word: εὐλογημένος
  choice: Béni
  rationale: Rend directement le sens de « béni » sans l’atténuer en « heureux », malgré la formulation surprenante dans ce contexte.
- source_word: γεννητὸς γυναικὸς
  choice: celui qui est né d’une femme
  rationale: Formulation française naturelle qui conserve la tournure substantivée du grec.
- source_word: ὀλιγόβιος
  choice: dont la vie est brève
  rationale: Exprime clairement l’idée d’une personne qui vit peu de temps, sans employer l’adjectif peu naturel « éphémère » pour une personne.
- source_word: μὴ πολὺς ἐν ῥήμασιν γίνου
  choice: Ne sois pas un homme aux nombreuses paroles
  rationale: Conserve l’image grecque de l’abondance en paroles tout en produisant une exhortation intelligible en français moderne.
theological_decisions:
- issue: Portée de εὐλογημένος
  choice: Maintenir l’affirmation « Béni est celui… »
  alternative: Corriger ou harmoniser avec Job 14.1, qui décrit plutôt le mortel né d’une femme
  rationale: Le texte grec fourni porte explicitement εὐλογημένος. Une traduction ne doit pas corriger silencieusement cette leçon difficile ni supprimer sa tension.
translation_notes:
  register: Français moderne, digne et accessible. La première phrase garde l’étrangeté de la leçon grecque, tandis que la note en indique la concision. La seconde évite le calque peu idiomatique « ne sois pas nombreux en paroles ».
