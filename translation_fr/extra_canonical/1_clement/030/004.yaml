  text: λέγει γάρ· Ὁ ἰὰ πολλὰ λέγων καὶ ἀντακουσεται· ἢ ὁ εὐλάλος οἴεται εἶναι δίκαιος;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/004.yaml
  text: For he says[a], “He who speaks many things will also hear in reply; or does the eloquent man think himself righteous?”
translation:
  language: fr
  text: 'Car il dit : « Celui qui parle beaucoup entendra aussi ce qu’on lui répond[a] ; ou bien l’homme éloquent pense-t-il être juste ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « recevra aussi une réponse » ; littéralement : « entendra aussi en retour ».'
    reason: Le verbe grec ἀντακούσεται peut évoquer soit le fait d’entendre une réplique, soit, plus idiomatiquement, celui de recevoir une réponse.
lexical_decisions:
- source_word: πολλὰ λέγων
  choice: parle beaucoup
  rationale: Rend naturellement l’idée de tenir de nombreux propos, sans la lourdeur de « dit beaucoup de choses ».
- source_word: ἀντακούσεται
  choice: entendra aussi ce qu’on lui répond
  rationale: Préserve l’image auditive du verbe tout en exprimant clairement la réponse adressée au locuteur.
- source_word: εὐλάλος
  choice: l’homme éloquent
  rationale: Désigne une personne qui parle avec aisance ou abondance ; « éloquent » reste digne et évite la nuance nécessairement péjorative de « beau parleur ».
- source_word: δίκαιος
  choice: juste
  rationale: Équivalent français direct du terme grec, avec sa portée morale et judiciaire.
theological_decisions:
- issue: Étendue de la citation introduite par « il dit »
  choice: Toute la phrase, y compris la seconde question, demeure à l’intérieur des guillemets.
  alternative: Fermer la citation avant « ou bien » et attribuer la seconde question à Clément.
  rationale: La construction grecque présente les deux membres comme une seule citation continue après λέγει γάρ.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure rhétorique de la citation et son contraste entre abondance de paroles, réponse reçue et prétention à la justice.
