  source_fidelity: 'Le texte rend fidèlement la construction grecque : l’impératif passif (« soit rendu ») avec l’agent ὑπ’ ἄλλων (« par d’autres »), puis la comparaison avec le témoignage accordé aux pères justes. Malgré une petite corruption manifeste de l’OCR dans πράξεἡμῶν, le contexte et la tradition textuelle soutiennent πράξεως ἡμῶν.'
  naturalness: La formulation est naturelle, sobre et adaptée à un français moderne. « Rendre témoignage » est idiomatique et conserve bien la valeur de μαρτυρία. L’apposition « nos pères, les justes » est légèrement littéraire, mais reste claire et reflète utilement l’article répété τοῖς δικαίοις.
  terminology: « Témoignage », « bonne conduite », « rendu » et « pères » sont des choix adéquats. « Bonne conduite » rend de façon plausible le singulier ἀγαθῆς πράξεως dans son sens éthique général; la note signale correctement l’alternative plus ponctuelle « bonne action », sans imposer une interprétation indue.
