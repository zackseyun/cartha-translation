source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ μαρτυρία τῆς ἀγαθῆς πράξεἡμῶν διδόσθω ὑπ’ ἄλλων, καθὼς ἐδόθη τοῖς πατράσιν ἡμῶν τοῖς δικαίοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/007.yaml
  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
translation:
  language: fr
  text: Que le témoignage de notre bonne conduite soit rendu par d’autres[a], comme il l’a été à nos pères, les justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de notre bonne action ».'
    reason: Le singulier πράξεως peut désigner soit la conduite, soit une action particulière.
lexical_decisions:
- source_word: μαρτυρία
  choice: témoignage
  rationale: Correspond directement au nom grec et conserve l’idée d’une attestation portée sur la vie de quelqu’un.
- source_word: ἀγαθῆς πράξεως
  choice: notre bonne conduite
  rationale: Dans ce contexte éthique, le singulier πρᾶξις peut désigner la manière d’agir ou la conduite générale, plutôt qu’un acte bon isolé; l’autre lecture possible est signalée en note.
- source_word: διδόσθω ὑπ’ ἄλλων
  choice: soit rendu par d’autres
  rationale: En français, on « rend témoignage »; cette tournure naturelle conserve le passif et l’agent exprimé dans le grec.
- source_word: τοῖς πατράσιν ἡμῶν τοῖς δικαίοις
  choice: à nos pères, les justes
  rationale: « Pères » préserve la désignation traditionnelle de πατέρες, tandis que l’apposition « les justes » maintient la force substantivée ou explicative de l’article répété.
theological_decisions:
- issue: Portée de « nos pères »
  choice: Conserver « nos pères » sans préciser leur identité
  alternative: « nos ancêtres justes »
  rationale: Le grec ne détermine pas explicitement s’il s’agit des patriarches, des ancêtres dans la foi ou d’un groupe plus large; la traduction préserve cette ouverture.
translation_notes:
  register: Français moderne, sobre et exhortatif. La syntaxe conserve le parallélisme grec, avec une formulation idiomatique (« rendre témoignage »).
