    issue: La relation exprimée par μὴ ἐξ αὐτῶν n'est pas conservée.
    rationale: « Non en nous-mêmes » répète la relation locative de ἐν θεῷ, alors que le grec oppose « en Dieu » à une louange « venant de nous-mêmes ». « Ne vienne pas de nous-mêmes » maintient cette nuance.
  - severity: low
    issue: « Sujet de fierté » interprète ἔπαινος.
    rationale: Cette expression est possible dans le contexte, mais « louange » est le correspondant français plus immédiat de ἔπαινος et préserve mieux le parallélisme avec l'auto-éloge final.
  revised_text: Que notre louange soit en Dieu et ne vienne pas de nous-mêmes, car Dieu déteste ceux qui font leur propre éloge.
