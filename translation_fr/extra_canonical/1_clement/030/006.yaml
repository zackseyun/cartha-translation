source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἔπαινος ἡμῶν ἔστω ἐν θεῷ καὶ μὴ ἐξ αὐτῶν· αὐτεπανέτους γὰρ μισεῖ ὁ θεός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/006.yaml
  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: fr
  text: Que notre louange soit en Dieu et ne vienne pas de nous-mêmes, car Dieu déteste ceux qui font leur propre éloge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  choice: notre sujet de fierté
  rationale: Dans ce contexte, ἔπαινος désigne ce dont on tire honneur ou fierté, plutôt que les louanges formulées par autrui. Cette expression française rend naturellement le contraste avec l'auto-éloge.
- source_word: ἐν θεῷ
  choice: en Dieu
  rationale: Conserve la formulation grecque concise et son orientation théologique sans préciser davantage la relation.
- source_word: μὴ ἐξ αὐτῶν
  choice: non en nous-mêmes
  rationale: Le grec passe littéralement à « pas d'eux-mêmes », mais le français maintient naturellement la première personne introduite par « notre », tout en exprimant que la fierté ne doit pas avoir sa source en nous.
- source_word: αὐτεπανέτους
  choice: ceux qui font leur propre éloge
  rationale: 'Rend clairement le sens de l''adjectif substantivé rare : les personnes qui se louent elles-mêmes.'
- source_word: μισεῖ
  choice: déteste
  rationale: Traduit directement la force de μισέω dans un français moderne et compréhensible.
theological_decisions:
- issue: Nature de l'« éloge » placé en Dieu
  choice: « notre sujet de fierté soit en Dieu »
  alternative: « que notre louange soit en Dieu »
  rationale: Le contexte oppose le fait de trouver son honneur en Dieu à l'auto-glorification. « Sujet de fierté » évite l'ambiguïté française selon laquelle notre louange serait située à l'intérieur de Dieu, sans ajouter de doctrine étrangère au texte.
translation_notes:
  register: Français moderne international, digne et direct. La phrase conserve le parallélisme et la vigueur morale du grec, avec une formulation idiomatique accessible.
