id: 1CLEM.30.1
reference: 1 Clement 30:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
translation:
  language: fr
  text: 'Puisque nous sommes donc une part sainte, faisons tout ce qui relève de la sanctification : fuyons les médisances, les unions honteuses et impures, l’ivrognerie et les révoltes, les désirs abominables, l’odieux adultère, l’abominable orgueil.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅγια ... μερὶς
  choice: une part sainte
  rationale: Rend directement l’image collective de μερίς sans la remplacer par « peuple » ou « communauté ».
- source_word: τὰ τοῦ ἁγιασμοῦ πάντα
  choice: tout ce qui relève de la sanctification
  rationale: Préserve le substantif ἁγιασμός et l’idée de tout ce qui appartient à la vie consacrée.
- source_word: καταλαλιάς
  choice: les médisances
  rationale: Le pluriel grec désigne des paroles malveillantes prononcées contre autrui.
- source_word: μιαράς τε καὶ ἀνάγνους συμπλοκὰς
  choice: les unions honteuses et impures
  rationale: « Unions » conserve une certaine latitude à συμπλοκάς, qui peut évoquer des liaisons ou enlacements, tandis que les deux adjectifs gardent leur forte réprobation morale.
- source_word: μέθας
  choice: l’ivrognerie
  rationale: Rend naturellement en français les épisodes ou pratiques d’ivresse visés par le pluriel grec.
- source_word: νεωτεροποιΐας
  choice: les révoltes
  rationale: Dans ce contexte, le terme vise des entreprises séditieuses ou des troubles novateurs; « révoltes » est clair sans être excessivement technique.
- source_word: βδελυκτὰς ἐπιθυμίας
  choice: les désirs abominables
  rationale: Conserve la force de βδελυκτός et le sens large de ἐπιθυμία sans préciser indûment l’objet des désirs.
- source_word: μυσερὰν μοιχείαν
  choice: l’odieux adultère
  rationale: Restitue l’intense répulsion exprimée par μυσερός tout en gardant le nom au singulier.
- source_word: βδελυκτὴν ὑπερηφανίαν
  choice: l’abominable orgueil
  rationale: Répète « abominable », comme le grec répète βδελυκτός, et traduit ὑπερηφανία par le terme français usuel « orgueil ».
theological_decisions:
- issue: Sens de « part sainte »
  choice: Maintien de l’expression métaphorique « une part sainte »
  alternative: « le peuple saint » ou « la portion sainte »
  rationale: Le grec affirme l’identité collective des destinataires au moyen de μερίς. La traduction n’explicite pas davantage la nature théologique de cette appartenance.
- issue: Portée de ἁγιασμός
  choice: « sanctification »
  alternative: « sainteté »
  rationale: « Sanctification » maintient la dimension active ou progressive possible du terme, en accord avec l’exhortation « faisons ».
translation_notes:
  register: Français moderne, digne et exhortatif. La structure accumulative et l’absence de conjonction avant les derniers éléments sont conservées. Le deux-points rend naturellement le participe φεύγοντες comme développement de l’exhortation principale.
