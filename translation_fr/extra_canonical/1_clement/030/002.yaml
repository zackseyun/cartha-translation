  text: θεὸς γάρ, φησίν, ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
translation:
  language: fr
  text: 'Car, est-il dit[a] : « Dieu s’oppose aux orgueilleux, mais il accorde sa grâce aux humbles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car Dieu, dit-il, s’oppose aux orgueilleux, mais il accorde sa grâce aux humbles. » Le grec φησίν peut formellement se comprendre comme « dit-il », mais il fonctionne vraisemblablement ici comme une formule impersonnelle introduisant une citation.'
    reason: Préserve la possibilité formelle de rendre φησίν par « dit-il » tout en expliquant son emploi vraisemblablement impersonnel dans ce contexte.
lexical_decisions:
- source_word: ὑπερηφάνοις
  choice: aux orgueilleux
  rationale: Équivalent français naturel qui exprime l’orgueil et l’arrogance visés par le grec.
- source_word: ἀντιτάσσεται
  choice: s’oppose
  rationale: Rend directement l’idée de se dresser contre ou de résister à quelqu’un.
- source_word: ταπεινοῖς
  choice: aux humbles
  rationale: Conserve le contraste moral explicite avec « les orgueilleux ».
- source_word: δίδωσιν χάριν
  choice: accorde sa grâce
  rationale: « Accorder » est idiomatique en français; le possessif explicite naturellement que la grâce vient de Dieu sans modifier le sens.
theological_decisions:
- issue: Fonction de φησίν
  choice: 'Formule impersonnelle de citation : « il est écrit »'
  alternative: « dit-il »
  rationale: Dans ce contexte, φησίν introduit une citation scripturaire. « Il est écrit » est une formule française claire et naturelle, tandis que « dit-il » créerait une ambiguïté maladroite sur l’identité du locuteur.
- issue: Sens de χάριν
  choice: « sa grâce »
  alternative: « faveur »
  rationale: « Grâce » préserve le vocabulaire théologique courant tout en gardant le sens de faveur accordée; aucune précision confessionnelle supplémentaire n’est introduite.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure grecque tout en signalant naturellement la citation scripturaire.
