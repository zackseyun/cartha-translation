revisions:
- from: Attachons-nous donc à ceux qui ont reçu la grâce de Dieu. Revêtons-nous de concorde, dans l’humilité et la maîtrise de soi ; tenons-nous loin de tout murmure et de toute médisance, étant reconnus justes par nos actes et non par nos paroles.[a]
  to: Attachons-nous donc à ceux à qui la grâce a été donnée de la part de Dieu. Revêtons-nous de la concorde, dans l’humilité et la maîtrise de soi ; tenons-nous loin de tout murmure et de toute médisance, étant justifiés par nos œuvres et non par nos paroles.
  rationale: 'La révision explicite la provenance divine de la grâce, conserve l''article de « la concorde » et remplace une interprétation de δικαιούμενοι par son équivalent passif français direct. La note proposée n''est plus nécessaire : elle présentait précisément comme alternative la formulation qui correspond le mieux au grec, alors que le texte révisé maintient lui-même l''ambiguïté sémantique et théologique requise.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:05Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « ceux qui ont reçu la grâce de Dieu » peut suggérer que Dieu est seulement le contenu ou le possesseur de la grâce, alors que ἀπὸ τοῦ θεοῦ exprime explicitement la provenance (« de la part de Dieu »). « étant reconnus justes » interprète δικαιούμενοι de manière plus étroite que nécessaire; « étant justifiés » conserve mieux le passif et l'ambiguïté du grec.
  naturalness: Le français est globalement naturel et le registre convient. « Revêtons-nous de concorde » est une image recevable, mais « Revêtons-nous de la concorde » correspond plus directement à l'article grec et sonne pleinement idiomatique dans ce contexte. La série de participes est rendue avec fluidité.
  terminology: « Concorde », « humilité », « maîtrise de soi », « murmure » et « médisance » sont appropriés. Pour δικαιούμενοι, « justifiés » est le correspondant français usuel et suffisamment littéral, sans imposer à lui seul une systématisation doctrinale. « Œuvres » rend plus directement ἔργοις que « actes ».
  issues:
  - severity: medium
    issue: Origine de la grâce insuffisamment explicite
    rationale: ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται signifie littéralement que la grâce a été donnée « de la part de Dieu ». Ajouter cette expression préserve la relation marquée par ἀπό.
  - severity: medium
    issue: δικαιούμενοι est interprété par « reconnus justes »
    rationale: Cette formulation privilégie une nuance évaluative. Le passif « étant justifiés » rend directement δικαιούμενοι et maintient plus ouvert son champ sémantique dans ce contexte.
  - severity: low
    issue: « actes » atténue la correspondance lexicale avec ἔργοις
    rationale: « Œuvres » est naturel dans ce registre et rend plus directement le terme grec, sans exiger une lecture doctrinale particulière.
  revised_text: Attachons-nous donc à ceux à qui la grâce a été donnée de la part de Dieu. Revêtons-nous de la concorde, dans l’humilité et la maîtrise de soi ; tenons-nous loin de tout murmure et de toute médisance, étant justifiés par nos œuvres et non par nos paroles.
  revised_footnotes: []
  revision_rationale: 'La révision explicite la provenance divine de la grâce, conserve l''article de « la concorde » et remplace une interprétation de δικαιούμενοι par son équivalent passif français direct. La note proposée n''est plus nécessaire : elle présentait précisément comme alternative la formulation qui correspond le mieux au grec, alors que le texte révisé maintient lui-même l''ambiguïté sémantique et théologique requise.'
