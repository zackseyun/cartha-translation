source:
  edition: Funk 1901 (normalized OCR)
  text: κολληθῶμεν οὖν ἐκείνοις, οἷς ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται· ἐνδυσώμεθα τὴν ὁμόνοιαν ταπεινοφρονοῦντες, ἐγκρατευόμενοι, ἀπὸ παντὸς ψιθυρισμοῦ καὶ καταλαλιᾶς πόρρω ἑαυτοὺς ποιοῦντες, ἔργοις δικαιούμενοι καὶ μὴ λόγοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: fr
  text: Attachons-nous donc à ceux à qui la grâce a été donnée de la part de Dieu. Revêtons-nous de la concorde, dans l’humilité et la maîtrise de soi ; tenons-nous loin de tout murmure et de toute médisance, étant justifiés par nos œuvres et non par nos paroles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  choice: Attachons-nous
  rationale: Rend l’idée forte d’adhérer étroitement à quelqu’un, dans un français naturel et digne.
- source_word: ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται
  choice: ont reçu la grâce de Dieu
  rationale: Exprime naturellement en français le parfait passif grec et l’origine divine de la grâce.
- source_word: τὴν ὁμόνοιαν
  choice: de concorde
  rationale: « Concorde » conserve la portée communautaire d’unité d’esprit et de relations harmonieuses.
- source_word: ταπεινοφρονοῦντες
  choice: dans l’humilité
  rationale: Formulation idiomatique qui conserve l’idée d’une disposition humble.
- source_word: ἐγκρατευόμενοι
  choice: la maîtrise de soi
  rationale: Désigne la retenue et le contrôle de ses désirs ou comportements, sans réduire le terme à une seule forme d’abstinence.
- source_word: ψιθυρισμοῦ
  choice: murmure
  rationale: Dans ce contexte moral, le mot évoque des propos hostiles ou plaintifs tenus à voix basse.
- source_word: καταλαλιᾶς
  choice: médisance
  rationale: Rend les paroles prononcées contre autrui, avec une nuance de dénigrement.
- source_word: ἔργοις δικαιούμενοι
  choice: étant reconnus justes par nos actes
  rationale: Préserve la construction passive et la tension théologique tout en évitant de limiter δικαιόω au sens vague de « prouver ».
theological_decisions:
- issue: Sens de δικαιούμενοι et rapport entre actes et paroles
  choice: « étant reconnus justes par nos actes et non par nos paroles »
  alternative: « étant justifiés par nos œuvres et non par nos paroles »
  rationale: Le grec peut porter le sens de déclarer, tenir ou reconnaître comme juste. La traduction retenue préserve cette dimension judiciaire ou évaluative sans trancher ici une doctrine générale de la justification ; une note signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. Les exhortations à la première personne du pluriel sont conservées. Le rythme de l’énumération grecque est légèrement articulé par un point-virgule afin d’améliorer la lisibilité sans modifier la progression.
