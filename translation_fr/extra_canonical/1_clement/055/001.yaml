review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu. Deux nuances demandent toutefois correction : ἐνστάντος décrit une crise qui est survenue ou s''est déclarée, plutôt qu''une épidémie qui « menaçait » ; et la dernière finale a pour sujet les personnes qui se retirent, non les divisions elles-mêmes.'
  naturalness: Le français est globalement naturel et de registre soutenu accessible. « Ayant reçu des réponses oraculaires » rend plus exactement et plus naturellement la voix passive de χρησμοδοτηθέντες que « avertis par des oracles ».
  terminology: « Nations », « dirigeants », « concitoyens » et « par leur propre sang » conviennent. « Réponses oraculaires » conserve la référence aux oracles sans y ajouter d'évaluation religieuse.
  issues:
  - severity: medium
    issue: « lorsqu’une épidémie menaçait »
    rationale: Le participe ἐνστάντος signifie qu'un temps/une crise pestilentielle était survenu(e) ou se présentait ; « menaçait » déplace le fait vers une menace encore à venir.
  - severity: medium
    issue: 'Dernière proposition : « afin que les divisions ne s’y prolongent pas davantage »'
    rationale: 'στασιάζωσιν a pour sujet implicite les « beaucoup » qui se sont retirés : ils cessent de se livrer aux dissensions factieuses. La formulation actuelle fait des « divisions » le sujet grammatical et atténue cette relation.'
  - severity: low
    issue: « avertis par des oracles »
    rationale: χρησμοδοτηθέντες désigne plus précisément le fait d'avoir reçu des réponses oraculaires ; « avertis » peut suggérer seulement une mise en garde.
  revised_text: 'Et, pour citer aussi des exemples tirés des nations : beaucoup de rois et de dirigeants, lorsqu’une épidémie se déclarait, ayant reçu des réponses oraculaires, se sont eux-mêmes livrés à la mort afin de sauver leurs concitoyens par leur propre sang. Beaucoup se sont retirés de leurs propres villes afin de ne pas prolonger davantage les dissensions.'
