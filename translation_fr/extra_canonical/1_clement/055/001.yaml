reference: 1 Clement 55:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: fr
  text: 'Et, pour citer aussi des exemples tirés des nations : beaucoup de rois et de dirigeants, lorsqu’une épidémie se déclarait, ayant reçu des réponses oraculaires, se sont eux-mêmes livrés à la mort afin de sauver leurs concitoyens par leur propre sang. Beaucoup se sont retirés de leurs propres villes afin de ne pas prolonger davantage les dissensions.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδείγματα ἐθνῶν
  choice: des exemples tirés des nations
  rationale: Rend explicitement l’idée d’exemples provenant des peuples non juifs, sans employer le terme potentiellement péjoratif « païens ».
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  choice: lorsqu’une épidémie menaçait
  rationale: « λοιμικός » évoque une situation pestilentielle; cette formulation naturelle conserve l’idée d’une crise épidémique survenue ou imminente.
- source_word: χρησμοδοτηθέντες
  choice: avertis par des oracles
  rationale: Conserve la référence explicite aux réponses oraculaires tout en restant idiomatique en français.
- source_word: παρέδωκαν ἑαυτοὺς εἰς θάνατον
  choice: se sont livrés eux-mêmes à la mort
  rationale: Reproduit la force volontaire et sacrificielle du grec, plutôt que de réduire le sens à « sont morts ».
- source_word: τοὺς πολίτας
  choice: leurs concitoyens
  rationale: Exprime naturellement les membres de la même cité concernés par le salut recherché.
- source_word: ἐξεχώρησαν ἰδίων πόλεων
  choice: ont quitté leur propre ville
  rationale: Rend le départ ou retrait hors de leur cité; le singulier distributif est naturel en français.
- source_word: ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον
  choice: afin que les divisions ne s’y prolongent pas davantage
  rationale: Le verbe peut désigner l’engagement dans une faction, la révolte ou les conflits civils. La traduction préserve l’idée de dissension durable sans imposer un sujet français ambigu.
theological_decisions:
- issue: Valeur exemplaire de morts volontaires prescrites par des oracles païens
  choice: Traduction descriptive, sans approbation ni condamnation ajoutée
  alternative: Qualifier ces actes de sacrifices héroïques ou, inversement, de pratiques idolâtres
  rationale: Le passage les cite comme exemples, mais n’explicite ici aucun jugement théologique sur les oracles ou la légitimité morale des actes.
- issue: Image du salut obtenu « par leur propre sang »
  choice: sauver leurs concitoyens par leur propre sang
  alternative: racheter leurs concitoyens par leur sang
  rationale: « Sauver » rend ῥύσωνται sans importer une terminologie sotériologique plus spécialisée que le contexte n’exige.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde le mouvement rhétorique de l’original, tandis que la dernière proposition est formulée de manière à éviter une lecture selon laquelle les villes elles-mêmes seraient grammaticalement le sujet des dissensions.
