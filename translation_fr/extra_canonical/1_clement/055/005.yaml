source:
  edition: Funk 1901 (normalized OCR)
  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
translation:
  language: fr
  text: S’étant donc livrée elle-même au danger, elle sortit par amour pour sa patrie et pour le peuple qui était assiégé, et le Seigneur livra Holopherne entre les mains d’une femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα … παρέδωκεν
  choice: s’étant livrée … livra
  rationale: La reprise du même verbe français préserve la répétition rhétorique du grec entre le don de soi de Judith et l’action du Seigneur.
- source_word: ἐξῆλθεν
  choice: elle sortit
  rationale: Rendu direct du verbe, naturel dans le contexte où Judith quitte la ville assiégée.
- source_word: δι’ ἀγάπην
  choice: par amour
  rationale: Expression française naturelle qui conserve explicitement le motif de son action.
- source_word: ἐν συγκλεισμῷ
  choice: assiégé
  rationale: Dans ce contexte, l’expression désigne le peuple enfermé ou encerclé par un siège; «assiégé» est clair et idiomatique.
- source_word: ἐν χειρὶ θηλείας
  choice: entre les mains d’une femme
  rationale: Cette tournure idiomatique rend l’idée d’être remis au pouvoir d’une femme, tout en conservant l’accent inhabituel du grec sur son sexe.
theological_decisions:
- issue: Parallèle entre l’engagement de Judith et l’intervention divine
  choice: Conserver «livrée … livra»
  alternative: Employer deux verbes différents, par exemple «s’exposa … remit»
  rationale: Le texte grec emploie deux formes de παραδίδωμι; conserver l’écho verbal laisse intact le lien littéraire et théologique sans l’expliciter davantage.
- issue: Agent de la remise d’Holopherne
  choice: «le Seigneur livra Holopherne»
  alternative: «Holopherne fut livré»
  rationale: Le grec nomme explicitement le Seigneur comme sujet; la traduction maintient cette affirmation.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe suit le mouvement de la phrase grecque sans lourdeur excessive; «entre les mains» est plus idiomatique en français que le singulier littéral «dans la main».
