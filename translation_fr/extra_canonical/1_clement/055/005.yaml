  source_fidelity: 'Le texte rend fidèlement la structure et les éléments essentiels du grec : le participe initial (« S’étant donc livrée elle-même au danger »), la sortie motivée par l’amour de la patrie et du peuple encerclé, ainsi que l’action explicite du Seigneur. La reprise de « livrée … livra » reflète de façon heureuse les deux occurrences de παραδίδωμι. « Assiégé » interprète naturellement ἐν συγκλεισμῷ dans le contexte de Judith, sans ajouter de détail étranger au texte.'
