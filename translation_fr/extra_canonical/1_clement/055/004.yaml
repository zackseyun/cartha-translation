source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰουδὶθ ἡ μακαρία, ἐν συγκλεισμῷ οὔσης τῆς πόλεως, ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/004.yaml
  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
translation:
  language: fr
  text: La bienheureuse Judith, alors que la ville était assiégée, demanda aux anciens de la laisser sortir pour se rendre dans le camp des étrangers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μακαρία
  choice: la bienheureuse
  rationale: Rend naturellement le qualificatif honorifique μακαρία tout en conservant sa valeur d’éloge.
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  choice: alors que la ville était assiégée
  rationale: Le tour grec évoque une ville enfermée ou bloquée; «assiégée» exprime clairement la situation dans un français naturel.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Équivalent courant du terme désignant les responsables de la communauté ou de la ville, sans préciser davantage leur fonction.
- source_word: παρεμβολὴν
  choice: camp
  rationale: Dans ce contexte militaire, le mot désigne le campement de l’armée.
- source_word: ἀλλοφύλων
  choice: étrangers
  rationale: Reproduit le sens littéral de personnes d’un autre peuple, sans identifier explicitement le groupe absent de ce verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. La construction «demanda aux anciens de la laisser sortir» rend idiomatiquement ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν, tandis que «pour se rendre» explicite naturellement la direction indiquée par εἰς sans ajouter d’information.
