source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπιστάμεθα πολλοὺς ἐν ἡμῖν παραδεδωκότας ἑαυτοὺς εἰς δεσμά, ὅπως ἑτέρους λυτρώσωνται· πολλοὶ ἑαυτοὺς παρέδωκαν εἰς δουλείαν, καὶ λαβόντες τὰς τιμὰς αὐτῶν ἑτέρους ἐψώμισαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/002.yaml
  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: fr
  text: Nous savons que beaucoup parmi nous se sont livrés aux chaînes afin de racheter d’autres personnes. Beaucoup se sont livrés à l’esclavage et, après avoir reçu le prix pour eux-mêmes, ont nourri d’autres personnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  choice: se sont livrés aux chaînes
  rationale: Rend directement l’idée de se remettre volontairement à la captivité, tout en conservant l’image concrète des chaînes.
- source_word: λυτρώσωνται
  choice: racheter
  rationale: Exprime ici la libération obtenue moyennant rançon, conformément au contexte.
- source_word: παρέδωκαν εἰς δουλείαν
  choice: se sont vendus comme esclaves
  rationale: Traduction française naturelle du geste volontaire décrit; elle évite le tour moins idiomatique «se livrer à l’esclavage».
- source_word: τὰς τιμὰς αὐτῶν
  choice: le prix reçu pour eux-mêmes
  rationale: Préserve le sens littéral du prix correspondant à leur propre personne sans ajouter explicitement un agent payeur.
- source_word: ἐψώμισαν
  choice: ont nourri
  rationale: Le verbe désigne l’action de donner à manger; «nourrir» en restitue clairement la portée dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme entre les deux exemples de sacrifice volontaire et l’image forte des chaînes.
