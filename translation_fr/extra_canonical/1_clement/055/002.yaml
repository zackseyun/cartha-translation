revisions:
- from: Nous savons que beaucoup parmi nous se sont livrés aux chaînes afin d’en racheter d’autres. Beaucoup se sont vendus comme esclaves et, avec le prix reçu pour eux-mêmes, ont nourri d’autres personnes.
  to: Nous savons que beaucoup parmi nous se sont livrés aux chaînes afin de racheter d’autres personnes. Beaucoup se sont livrés à l’esclavage et, après avoir reçu le prix pour eux-mêmes, ont nourri d’autres personnes.
  rationale: La révision supprime l’antécédent implicite et interprétatif créé par « en », tout en conservant « racheter », qui rend le champ de la rançon. Elle rapproche également la seconde proposition de la formulation grecque, sans modifier le sens ni ajouter de détail historique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:25Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général et le parallélisme des deux actes de sacrifice volontaire sont bien rendus. Cependant, « afin d’en racheter d’autres » donne à « en » l’antécédent « les chaînes » et précise ainsi, sans l’exprimer dans le grec, ce dont les autres seraient rachetés. Le grec dit simplement « afin qu’ils rachètent/libèrent par rançon d’autres personnes ».
  naturalness: Le français est globalement moderne et clair. La suppression de « en » évite une ambiguïté référentielle. « Se sont livrés à l’esclavage » reproduit plus exactement la construction grecque tout en restant naturel dans ce registre.
  terminology: « Racheter » convient pour λυτρώσωνται dans ce contexte. « Chaînes », « esclavage », « prix » et « nourri » préservent les images et le vocabulaire essentiels sans surcharge doctrinale.
  issues:
  - severity: medium
    issue: « afin d’en racheter d’autres »
    rationale: Le pronom « en » renvoie naturellement aux « chaînes » en français et introduit une précision absente de λυτρώσωνται, dont l’objet est seulement « d’autres [personnes] ».
  - severity: low
    issue: « se sont vendus comme esclaves »
    rationale: Cette formulation est plausible au vu du prix reçu, mais « se sont livrés à l’esclavage » suit plus directement παρέδωκαν ἑαυτούς εἰς δουλείαν et évite de présenter la vente comme explicitement formulée par le verbe grec.
  revised_text: Nous savons que beaucoup parmi nous se sont livrés aux chaînes afin de racheter d’autres personnes. Beaucoup se sont livrés à l’esclavage et, après avoir reçu le prix pour eux-mêmes, ont nourri d’autres personnes.
