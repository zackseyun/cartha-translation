  yaml_path: translation/extra_canonical/1_clement/055/003.yaml
  text: Many women[a], strengthened through the grace of God, accomplished many courageous deeds.
translation:
  language: fr
  text: Beaucoup de femmes, fortifiées par la grâce de Dieu, ont accompli de nombreux actes de courage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυναμωθεῖσαι
  choice: fortifiées
  rationale: Le participe passif exprime la force reçue; « fortifiées » est naturel, digne et conserve l’action de la grâce de Dieu.
- source_word: διὰ τῆς χάριτος τοῦ θεοῦ
  choice: par la grâce de Dieu
  rationale: « Par » rend ici naturellement le moyen ou l’agent intermédiaire exprimé par διά avec le génitif.
- source_word: ἐπετέλεσαν
  choice: ont accompli
  rationale: Le verbe indique qu’elles ont mené à bien ou réalisé ces actions; « ont accompli » en restitue clairement la force.
- source_word: πολλὰ ἀνδρεῖα
  choice: de nombreux actes de courage
  rationale: ἀνδρεῖα désigne ici des actions courageuses ou vaillantes. Cette formulation française transmet le sens principal sans introduire les connotations modernes trompeuses de « viril ».
