  - severity: medium
    issue: Rendu de τὸ δωδεκάφυλον
    rationale: Le neutre collectif désigne les « douze tribus » d’Israël. « Le peuple des douze tribus » introduit « peuple », déjà présent plus loin dans τὸν λαόν, et affaiblit la désignation collective précise.
