source:
  edition: Funk 1901 (normalized OCR)
  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
translation:
  language: fr
  text: Et Esther aussi, parfaite selon la foi[a], ne s’exposa pas moins au danger, afin de délivrer les douze tribus d’Israël, qui étaient sur le point de périr. En effet, par le jeûne et l’abaissement volontaire[b], elle implora le Maître qui voit tout, le Dieu des siècles. Voyant l’humilité de son âme, il délivra le peuple pour lequel elle avait affronté le danger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parfaite dans la foi ».'
    reason: Le rapport précis exprimé par κατὰ πίστιν peut se comprendre comme une conformité à la foi ou comme une perfection manifestée dans le domaine de la foi.
  - marker: b
    text: 'Littéralement : « l’abaissement »; il s’agit ici de s’abaisser volontairement devant Dieu.'
    reason: Précise la valeur ascétique de ταπείνωσις dans son association avec le jeûne et évite le sens moderne d’une humiliation subie.
lexical_decisions:
- source_word: τελεία κατὰ πίστιν
  choice: parfaite selon la foi
  rationale: Cette formulation conserve le rapport exprimé par κατὰ sans réduire celui-ci au simple sens de « pleine de foi ».
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραήλ
  choice: le peuple des douze tribus d’Israël
  rationale: Le substantif collectif δωδεκάφυλον désigne Israël comme l’ensemble constitué des douze tribus; cette tournure est naturelle en français et s’accorde avec τὸν λαόν dans la suite.
- source_word: κινδύνῳ ἑαυτὴν παρέβαλεν
  choice: s’exposa au danger
  rationale: Rend directement l’idée qu’Esther mit volontairement sa propre personne en péril.
- source_word: τῆς ταπεινώσεως
  choice: l’abaissement volontaire
  rationale: Dans le contexte du jeûne, le terme évoque l’action délibérée de s’abaisser devant Dieu, et non une humiliation subie.
- source_word: τὸν παντεπόπτην δεσπότην
  choice: le Maître qui voit tout
  rationale: Formulation française claire qui restitue le titre δεσπότης et la portée de παντεπόπτης.
- source_word: θεὸν τῶν αἰώνων
  choice: le Dieu des siècles
  rationale: Conserve l’expression temporelle solennelle et théologique du grec sans la paraphraser.
theological_decisions:
- issue: Nature de la perfection d’Esther
  choice: parfaite selon la foi
  alternative: parfaite dans la foi
  rationale: Le choix principal suit formellement κατὰ πίστιν et laisse ouverte la nuance exacte du critère ou du domaine de cette perfection.
- issue: Sens religieux de ταπείνωσις
  choice: abaissement volontaire
  alternative: humiliation
  rationale: L’association avec le jeûne indique vraisemblablement une démarche volontaire d’humilité devant Dieu; « humiliation » risquerait aujourd’hui d’évoquer surtout une dégradation imposée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement argumentatif grec tout en évitant les calques lourds. « Maître » et « Dieu des siècles » maintiennent le registre solennel du passage.
