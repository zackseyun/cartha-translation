revisions:
- from: Qu’en pensez-vous, bien-aimés ? Moïse ne savait-il pas d’avance que cela allait arriver ? Il le savait parfaitement. Mais il a agi ainsi pour éviter tout désordre en Israël et pour que soit glorifié le nom du Dieu véritable et unique. À lui soit la gloire pour les siècles des siècles. Amen.
  to: Qu’en pensez-vous, bien-aimés ? Moïse ne savait-il pas d’avance que cela allait arriver ? Certes, il le savait. Mais il a agi ainsi pour qu’il n’y ait pas de désordre en Israël et pour que soit glorifié le nom du Dieu véritable et unique. À lui la gloire pour les siècles des siècles. Amen.
  rationale: La révision remplace « parfaitement » par « Certes » afin de rendre l’accent affirmatif de μάλιστα sans ajouter l’idée d’une connaissance exhaustive. Elle conserve les deux propositions finales du grec et simplifie la doxologie conformément à son caractère elliptique.
