source:
  edition: Funk 1901 (normalized OCR)
  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: fr
  text: Qu’en pensez-vous, bien-aimés ? Moïse ne savait-il pas d’avance que cela allait arriver ? Certes, il le savait. Mais il a agi ainsi pour qu’il n’y ait pas de désordre en Israël et pour que soit glorifié le nom du Dieu véritable et unique. À lui la gloire pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Terme d’adresse affectueux et digne, traditionnel mais toujours intelligible en français moderne.
- source_word: προῄδει
  choice: savait d’avance
  rationale: Rend explicitement la valeur prospective du verbe grec sans suggérer nécessairement une révélation surnaturelle.
- source_word: ἀκαταστασία
  choice: désordre
  rationale: Correspond au sens de trouble ou de confusion dans la communauté, sans surinterpréter le degré de conflit.
- source_word: ἀληθινοῦ καὶ μόνου θεοῦ
  choice: Dieu véritable et unique
  rationale: Préserve les deux qualificatifs coordonnés du grec avec une formulation française naturelle.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Conserve la formule doxologique emphatique du grec, consacrée et compréhensible en français.
theological_decisions:
- issue: Lien entre l’action de Moïse, l’absence de désordre et la glorification du nom divin
  choice: 'Coordination finale : « pour éviter… et pour que… »'
  alternative: « afin qu’il n’y ait pas de désordre…, il a agi ainsi, de manière que… »
  rationale: Le grec emploie d’abord ἵνα puis εἰς τό pour exprimer des visées liées. La coordination française garde les deux finalités sans imposer un rapport causal plus précis que le texte.
- issue: Doxologie relative à Dieu
  choice: « À lui soit la gloire »
  alternative: « à qui appartient la gloire »
  rationale: La formule optative française restitue naturellement la doxologie elliptique grecque tout en évitant d’ajouter un verbe absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’interrogation rhétorique, la forte affirmation μάλιστα et la cadence doxologique, sans archaïsmes inutiles.
