    issue: « Il le savait parfaitement » pour μάλιστα ᾔδει
    rationale: μάλιστα marque principalement une forte confirmation (« assurément », « certes »), plutôt que le caractère parfait ou exhaustif du savoir. Une formulation affirmative est donc plus précise.
