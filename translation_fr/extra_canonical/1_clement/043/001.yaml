id: 1CLEM.43.1
reference: 1 Clement 43:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ τί θαυμαστόν, εἰ οἱ ἐν Χριστῷ πιστευθέντες παρὰ θεοῦ ἔργον τοιοῦτο κατέστησαν τοὺς προειρημένους;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/001.yaml
  text: And what is remarkable if those entrusted in Messiah by God with such a work appointed the aforementioned persons?
translation:
  language: fr
  text: Et quoi d’étonnant si ceux à qui Dieu avait confié en Christ une telle œuvre ont établi les personnes mentionnées plus haut ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θαυμαστόν
  choice: étonnant
  rationale: Rend naturellement l’idée de quelque chose qui suscite l’étonnement, dans la question rhétorique τί θαυμαστόν.
- source_word: πιστευθέντες … ἔργον τοιοῦτο
  choice: à qui … avait confié … une telle œuvre
  rationale: 'Le participe passif πιστευθέντες régit l’accusatif ἔργον τοιοῦτο : l’œuvre a été confiée à ces personnes; elle ne désigne pas la fonction attribuée aux personnes mentionnées ensuite.'
- source_word: ἐν Χριστῷ
  choice: en Christ
  rationale: Conserve la formulation paulinienne et ecclésiale du grec sans préciser indûment la relation exacte entre le Christ, l’acte de confier et l’œuvre.
- source_word: κατέστησαν
  choice: ont établi
  rationale: Exprime ici l’action de mettre officiellement des personnes en place, tout en évitant de préciser une charge que ce verset ne nomme pas.
- source_word: τοὺς προειρημένους
  choice: les personnes mentionnées plus haut
  rationale: Reproduit clairement le renvoi aux personnes dont le texte a déjà parlé, sans ajouter leur identité ou leur fonction.
theological_decisions:
- issue: Rapport syntaxique de « une telle œuvre »
  choice: L’œuvre est confiée par Dieu aux sujets qui établissent ensuite d’autres personnes.
  alternative: Les personnes mentionnées plus haut sont établies pour accomplir une telle œuvre.
  rationale: L’accusatif ἔργον τοιοῦτο complète naturellement le passif πιστευθέντες; rattacher ce groupe à κατέστησαν exigerait une construction que le grec ne fournit pas et déplacerait l’œuvre vers les personnes établies.
- issue: Portée de « en Christ »
  choice: Maintien de la formule « en Christ » à proximité de l’acte divin de confier l’œuvre.
  alternative: Expliciter « ceux qui croyaient au Christ » ou « ceux que le Christ avait chargés ».
  rationale: Le grec ne dit ni qu’ils croyaient simplement au Christ ni que le Christ est l’agent de l’acte, puisque παρὰ θεοῦ désigne Dieu comme source; la formulation retenue préserve cette tension.
translation_notes:
  register: Français moderne, digne et lisible. La question rhétorique est conservée. « Établi » garde la portée institutionnelle de κατέστησαν sans importer un vocabulaire confessionnel tel que « ordonné ».
