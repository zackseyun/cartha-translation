  source_fidelity: 'Le texte rend correctement la syntaxe essentielle : « une telle œuvre » dépend de πιστευθέντες (« avaient confié ») et non de κατέστησαν. « Dieu » rend bien παρὰ θεοῦ comme source de la mission, tandis que « en Christ » conserve sans la résoudre la portée syntaxique quelque peu resserrée de ἐν Χριστῷ. « ont établi » représente adéquatement κατέστησαν sans introduire de titre ecclésiastique absent du verset.'
