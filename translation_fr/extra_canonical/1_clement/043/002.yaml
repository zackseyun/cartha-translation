id: 1CLEM.43.2
reference: 1 Clement 43:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ὅπου καὶ ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς τὰ διατεταγμένα αὐτῷ πάντα ἐσημειώσατο ἐν ταῖς ἱεραῖς βίβλοις, ᾧ καὶ ἐπηκολούθησαν οἱ λοιποὶ προφῆται, συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
translation:
  language: fr
  text: C’est aussi là que Moïse, le bienheureux serviteur, fidèle dans toute sa maison, consigna dans les livres sacrés tout ce qui lui avait été ordonné. Les autres prophètes le suivirent eux aussi, attestant les prescriptions légales qu’il avait établies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου καὶ
  choice: C’est aussi là que
  rationale: Rend la valeur locale de ὅπου et la nuance additive de καί dans un français naturel, tout en conservant le lien avec le contexte précédent.
- source_word: ὁ μακάριος πιστὸς θεράπων
  choice: le bienheureux serviteur, fidèle
  rationale: « Serviteur » convient au θεράπων biblique et « bienheureux » conserve la tonalité honorifique de μακάριος; la ponctuation rattache clairement « fidèle » à Moïse.
- source_word: ἐσημειώσατο
  choice: consigna
  rationale: Exprime l’idée de mettre par écrit ou d’enregistrer soigneusement, ici dans les livres sacrés.
- source_word: τὰ διατεταγμένα αὐτῷ πάντα
  choice: tout ce qui lui avait été ordonné
  rationale: Conserve le passif et ne précise pas explicitement l’auteur des ordres, conformément au grec.
- source_word: ἐπηκολούθησαν
  choice: le suivirent
  rationale: Traduction directe qui peut évoquer à la fois la succession et l’adhésion à l’exemple de Moïse sans choisir entre ces nuances.
- source_word: συνεπιμαρτυροῦντες
  choice: attestant
  rationale: Le participe signifie ici apporter un témoignage confirmatif en faveur de ce qui suit; « attestant » évite de faire des prescriptions elles-mêmes des cotémoins.
- source_word: τοῖς ὑπ’ αὐτοῦ νενομοθετημένοις
  choice: les prescriptions légales qu’il avait établies
  rationale: Le datif dépend de συνεπιμαρτυροῦντες et désigne ce que les prophètes attestent; νενομοθετημένοις comporte une nuance d’établissement normatif ou législatif.
theological_decisions:
- issue: Rapport entre le commandement reçu par Moïse et les prescriptions établies par lui
  choice: 'Maintenir les deux formulations du grec: ce qui lui fut ordonné, puis ce qu’il établit.'
  alternative: Identifier explicitement les prescriptions comme des lois divines simplement transmises par Moïse.
  rationale: Le texte associe un passif sans agent exprimé à l’action législative attribuée à Moïse. La traduction conserve cette tension sans introduire une explication doctrinale.
- issue: Fonction du témoignage des prophètes
  choice: Les prophètes attestent les prescriptions établies par Moïse.
  alternative: Les prophètes témoignent avec ces prescriptions comme si elles étaient elles-mêmes des cotémoins.
  rationale: La construction au datif désigne le contenu ou l’objet attesté; elle ne présente pas les prescriptions comme des témoins associés.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Bienheureux », « consigna » et « livres sacrés » préservent la dignité ecclésiale et scripturaire du passage sans archaïsme excessif.
