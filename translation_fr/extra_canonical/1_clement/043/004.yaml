  revision_rationale: La révision maintient la leçon grecque « les clés », contrairement à l’audit anglais qui l’a omise, mais enlève l’inférence ajoutée par « en ». Elle rend également plus visible la coordination des deux fonctions cultuelles, tout en conservant un français international moderne et une syntaxe fluide.
