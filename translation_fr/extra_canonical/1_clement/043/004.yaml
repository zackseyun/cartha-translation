  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
translation:
  language: fr
  text: 'Puis, après avoir fermé la tente, il scella les clés[a] ainsi que les bâtons, et leur dit : « Frères, la tribu dont le bâton bourgeonnera, c’est elle que Dieu a choisie pour exercer le sacerdoce et accomplir le service pour lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « les clés », une lecture difficile dans ce contexte.
    reason: κλεῖδας figure dans le texte grec fourni. La note signale la difficulté sans supprimer, harmoniser ou identifier spéculativement ce terme.
lexical_decisions:
- source_word: σκηνή
  choice: tente
  rationale: Rend directement le grec et conserve le cadre cultuel de la tente.
- source_word: κλεῖδας
  choice: clés
  rationale: Le texte grec transmis porte bien « les clés ». Malgré la difficulté contextuelle et l’omission de l’anglais révisé, la traduction française ne doit pas supprimer cette leçon sans preuve textuelle fournie.
- source_word: ῥάβδους / ῥάβδος
  choice: bâtons / bâton
  rationale: Dans le récit du choix sacerdotal, il s’agit des bâtons représentant les tribus; « bâton » est naturel et précis en français.
- source_word: βλαστήσῃ
  choice: bourgeonnera
  rationale: Exprime la pousse miraculeuse du bâton et convient mieux ici que le plus général « germera ».
- source_word: ἱερατεύειν
  choice: exercer le sacerdoce
  rationale: Reproduit la fonction sacerdotale du verbe grec sans lui substituer une formulation confessionnelle particulière.
- source_word: λειτουργεῖν
  choice: servir
  rationale: Dans ce contexte cultuel, le verbe désigne le service rendu à Dieu; « servir » est clair et dignifié.
theological_decisions:
- issue: Rapport entre ἱερατεύειν et λειτουργεῖν
  choice: « exercer le sacerdoce et le servir »
  alternative: « être prêtre et accomplir le service sacré pour lui »
  rationale: La formulation retenue maintient les deux verbes grecs sans surcharger le français ni effacer la dimension cultuelle.
- issue: Sujet désigné par ταύτην
  choice: « c’est celle [la tribu] que Dieu a choisie »
  alternative: « Dieu a choisi cette tribu »
  rationale: Le féminin renvoie explicitement à φυλή, « tribu »; la tournure disloquée conserve l’insistance du grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Frères » rend idiomatiquement l’adresse Ἄνδρες ἀδελφοί. La leçon difficile « les clés » est conservée parce qu’elle figure explicitement dans la source grecque fournie; la syntaxe française indique qu’il scelle les clés de la tente, puis les bâtons.
