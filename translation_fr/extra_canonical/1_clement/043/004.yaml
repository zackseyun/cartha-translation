revisions:
- from: 'Puis, après avoir fermé la tente, il en scella les clés, ainsi que les bâtons, et leur dit : « Frères, la tribu dont le bâton bourgeonnera, c’est celle que Dieu a choisie pour exercer le sacerdoce et le servir. »'
  to: 'Puis, après avoir fermé la tente, il scella les clés[a] ainsi que les bâtons, et leur dit : « Frères, la tribu dont le bâton bourgeonnera, c’est elle que Dieu a choisie pour exercer le sacerdoce et accomplir le service pour lui. »'
  rationale: La révision maintient la leçon grecque « les clés », contrairement à l’audit anglais qui l’a omise, mais enlève l’inférence ajoutée par « en ». Elle rend également plus visible la coordination des deux fonctions cultuelles, tout en conservant un français international moderne et une syntaxe fluide.
