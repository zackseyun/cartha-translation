id: 1CLEM.43.5
reference: 1 Clement 43:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: fr
  text: Quand le matin fut venu, il convoqua tout Israël, les six cent mille hommes, et montra les sceaux aux chefs des tribus. Puis il ouvrit la tente du témoignage et en retira les bâtons. On constata que le bâton d’Aaron avait non seulement bourgeonné, mais portait même du fruit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  choice: Quand le matin fut venu
  rationale: Rend naturellement la tournure temporelle grecque tout en conservant son caractère narratif et solennel.
- source_word: φυλάρχοις
  choice: chefs des tribus
  rationale: Équivalent français clair de ces responsables placés à la tête des tribus.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: tente du témoignage
  rationale: Traduction formelle qui préserve le vocabulaire cultuel et le lien avec le témoignage divin.
- source_word: ῥάβδους
  choice: bâtons
  rationale: Dans le récit auquel ce passage renvoie, il s’agit des bâtons représentatifs déposés devant Dieu; « bâtons » est plus courant et concret que « verges ».
- source_word: βεβλαστηκυῖα
  choice: avait […] bourgeonné
  rationale: Exprime la croissance miraculeuse déjà accomplie, conformément au participe parfait grec.
- source_word: καρπὸν ἔχουσα
  choice: portait […] du fruit
  rationale: Reproduit simplement l’image du texte sans préciser une sorte de fruit que le grec ne nomme pas.
theological_decisions:
- issue: Nom de la tente sacrée
  choice: tente du témoignage
  alternative: tente de la rencontre
  rationale: Le grec porte μαρτυρίου, « témoignage », et non le terme signifiant directement « rencontre »; la traduction retenue évite de confondre deux désignations bibliques apparentées.
- issue: Force probante du signe concernant Aaron
  choice: On constata que le bâton d’Aaron…
  alternative: Le bâton d’Aaron se trouva avoir…
  rationale: Cette formulation conserve l’idée de découverte publique du signe sans expliciter davantage sa portée théologique ou ecclésiale.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe a été légèrement allégée par une ponctuation en trois phrases, sans supprimer les enchaînements du grec. Aucun archaïsme ni vocabulaire confessionnel particulier n’a été introduit.
