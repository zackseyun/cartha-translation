id: 1CLEM.43.3
reference: 1 Clement 43:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
translation:
  language: fr
  text: En effet, lorsqu’une jalousie surgit au sujet du sacerdoce et que les tribus se livraient à des luttes de factions pour savoir laquelle d’entre elles était parée du nom glorieux[a], il ordonna aux douze chefs de tribu de lui apporter des bâtons, chacun inscrit du nom de sa tribu. Les ayant pris, il les lia et les scella avec les anneaux-sceaux des chefs de tribu, puis les déposa dans la tente du témoignage, sur la table de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « laquelle d’entre elles était ornée du nom glorieux ».'
    reason: Le participe grec signifie littéralement « ornée » ou « parée ». La note signale cette variation stylistique sans identifier le « nom glorieux », que le texte laisse non précisé.
lexical_decisions:
- source_word: ζήλου
  choice: la rivalité
  rationale: Dans ce contexte de conflit autour du sacerdoce, le terme désigne une jalousie ou une rivalité; « rivalité » exprime naturellement l’enjeu collectif sans atténuer la tension.
- source_word: ἱερωσύνης
  choice: sacerdoce
  rationale: Terme français précis et courant dans un contexte cultuel pour la fonction sacerdotale.
- source_word: στασιαζουσῶν
  choice: se disputèrent
  rationale: Rend l’action conflictuelle des tribus en français naturel; le verbe grec évoque une lutte de factions, non un simple désaccord.
- source_word: φυλάρχους
  choice: chefs de tribu
  rationale: Équivalent transparent du titre désignant les dirigeants des douze tribus.
- source_word: ῥάβδους
  choice: bâtons
  rationale: Le mot désigne ici les bâtons associés aux chefs tribaux dans le récit de Nombres 17; « bâtons » reste concret et accessible.
- source_word: σκηνὴν τοῦ μαρτυρίου
  choice: tente du témoignage
  rationale: Traduction formelle qui conserve la terminologie cultuelle grecque sans la remplacer par l’expression interprétative « tente de la Rencontre ».
- source_word: τράπεζαν τοῦ θεοῦ
  choice: table de Dieu
  rationale: Reproduction directe de l’expression grecque, qui conserve son caractère cultuel.
theological_decisions:
- issue: Sens du « nom glorieux »
  choice: Conserver « du nom glorieux » sans identifier explicitement ce nom
  alternative: Préciser qu’il s’agit du nom ou du titre sacerdotal
  rationale: Le grec ne nomme pas explicitement ce qui constitue ce « nom »; l’expliciter résoudrait une ambiguïté réelle du texte.
- issue: Force du conflit entre les tribus
  choice: « les tribus se disputèrent »
  alternative: « les tribus se soulevèrent » ou « furent divisées en factions »
  rationale: Le choix maintient l’idée d’un conflit actif tout en évitant de présenter avec certitude une rébellion institutionnelle que le contexte n’exige pas.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit étroitement le déroulement grec tout en évitant les lourdeurs; le vocabulaire cultuel est conservé.
