revisions:
- from: En effet, lorsque la rivalité surgit au sujet du sacerdoce et que les tribus se disputèrent pour savoir laquelle d’entre elles était parée du nom glorieux[a], il ordonna aux douze chefs de tribu de lui apporter des bâtons, chacun portant le nom de sa tribu. Il les prit, les lia, les scella avec les anneaux des chefs de tribu et les déposa dans la tente du témoignage, sur la table de Dieu.
  to: En effet, lorsqu’une jalousie surgit au sujet du sacerdoce et que les tribus se livraient à des luttes de factions pour savoir laquelle d’entre elles était parée du nom glorieux[a], il ordonna aux douze chefs de tribu de lui apporter des bâtons, chacun inscrit du nom de sa tribu. Les ayant pris, il les lia et les scella avec les anneaux-sceaux des chefs de tribu, puis les déposa dans la tente du témoignage, sur la table de Dieu.
  rationale: La révision renforce la fidélité aux termes grecs ζῆλος, στασιαζουσῶν et ἐπιγεγραμμένας, tout en conservant l’ambiguïté relative au « nom glorieux ». Elle explicite aussi, par « anneaux-sceaux », le rôle des δακτύλιοι dans l’action de sceller.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:19Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction restitue globalement la scène et conserve avec justesse les expressions cultuelles « sacerdoce », « tente du témoignage » et « table de Dieu ». Toutefois, ζῆλος est plus directement « jalousie » que « rivalité », et στασιαζουσῶν désigne une activité de dissension ou de lutte entre factions, plus forte et plus politique que « se disputèrent ». Le participe présent dans le génitif absolu est aussi mieux rendu par un imparfait. Enfin, ἐπιγεγραμμένας demande que l’inscription des bâtons soit explicite.
  naturalness: La formulation révisée reste fluide dans un français international contemporain tout en gardant une dignité adaptée au texte. « Se livraient à des luttes de factions » est naturel sans neutraliser la portée de στάσις. « Chacun inscrit du nom de sa tribu » est concis et rend clairement le grec.
  terminology: « Jalousie », « sacerdoce », « chefs de tribu », « bâtons », « tente du témoignage » et « table de Dieu » sont retenus. « Anneaux » est possible pour δακτύλιοι; dans ce contexte de scellement, « anneaux-sceaux » rend plus explicitement leur fonction, sans aller au-delà du texte.
  issues:
  - severity: medium
    issue: « la rivalité » pour ζῆλος
    rationale: Le sens premier pertinent est la jalousie; « rivalité » est possible contextuellement, mais atténue et déplace la motivation exprimée par le grec.
  - severity: medium
    issue: « les tribus se disputèrent » pour στασιαζουσῶν
    rationale: στασιάζω évoque la dissension factionnelle active. La formulation proposée est trop générale et son passé simple ne reflète pas bien le participe présent dépendant du génitif absolu.
  - severity: low
    issue: L’inscription des bâtons n’est pas explicitement rendue
    rationale: ἐπιγεγραμμένας indique que les bâtons étaient inscrits, chacun selon le nom de sa tribu; « portant le nom » est plus vague.
