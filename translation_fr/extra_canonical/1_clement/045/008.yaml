source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ δὲ ὑπομένοντες ἐν πεποιθήσει δόξαν καὶ τιμὴν ἐκληρονόμησαν, ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
translation:
  language: fr
  text: Mais ceux qui persévérèrent avec confiance héritèrent de la gloire et de l’honneur. Ils furent élevés et inscrits par Dieu dans le mémorial où leur souvenir est conservé[a], pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans leur mémorial ». Le grec peut désigner le mémorial où leur souvenir est conservé.'
    reason: 'La formulation littérale avec « leur » est ambiguë en français : elle peut évoquer un mémorial qui leur appartiendrait plutôt qu’un mémorial qui les garde en souvenir.'
lexical_decisions:
- source_word: ὑπομένοντες
  choice: ceux qui persévérèrent
  rationale: Le participe présent substantivé reçoit ici sa référence temporelle des verbes principaux à l’aoriste et du contexte narratif passé. « Persévérèrent » exprime une endurance fidèle sans alourdir la phrase.
- source_word: ἐν πεποιθήσει
  choice: avec confiance
  rationale: Formulation française naturelle qui conserve l’idée d’une assurance confiante accompagnant leur persévérance.
- source_word: ἐκληρονόμησαν
  choice: héritèrent de
  rationale: Rend directement la métaphore de l’héritage portée par le verbe grec.
- source_word: ἐπήρθησαν
  choice: furent élevés
  rationale: Conserve le passif et l’ambiguïté du grec entre élévation et exaltation honorifique.
- source_word: ἔγγραφοι ἐγένοντο
  choice: furent inscrits
  rationale: Équivalent français idiomatique de la tournure signifiant qu’ils devinrent consignés ou enregistrés.
- source_word: μνημοσύνῳ
  choice: mémorial
  rationale: Maintient l’image grecque d’un souvenir durable et consigné, sans introduire explicitement un « livre » absent du texte.
theological_decisions:
- issue: Agent de l’inscription et sens de αὐτῶν
  choice: « inscrits par Dieu dans le mémorial qui garde leur souvenir »
  alternative: « inscrits par Dieu dans leur mémorial »
  rationale: 'La traduction principale comprend αὐτῶν comme un génitif objectif : il s’agit du souvenir qu’on garde d’eux. Elle évite de suggérer qu’ils possèdent eux-mêmes le mémorial, tout en signalant en note la formulation plus littérale.'
- issue: Nature de l’élévation
  choice: « furent élevés »
  alternative: « furent exaltés »
  rationale: « Élevés » préserve mieux l’ouverture sémantique du passif ἐπήρθησαν et n’impose pas une interprétation théologique particulière.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La coordination grecque est répartie en deux phrases pour préserver la clarté, tandis que la formule solennelle « pour les siècles des siècles » est conservée.
