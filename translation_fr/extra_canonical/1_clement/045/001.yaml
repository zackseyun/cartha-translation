  text: Φιλόνεικοί ἐστε, ἀδελφοί, καὶ ζηλωταὶ περὶ τῶν ἀνηκόντων εἰς σωτηρίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/001.yaml
  text: You are contentious, brothers, and zealous about the things that pertain to salvation.
translation:
  language: fr
  text: Vous aimez les disputes, frères, et vous êtes zélés pour ce qui touche au salut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φιλόνεικοί
  choice: Vous aimez les disputes
  rationale: Le terme désigne des personnes querelleuses ou portées à la contestation. Cette formulation naturelle conserve ici la réprobation du grec.
- source_word: ἀδελφοί
  choice: frères
  rationale: Correspondance directe et traditionnelle de l’adresse communautaire grecque, sans explicitation supplémentaire.
- source_word: ζηλωταὶ
  choice: vous êtes zélés
  rationale: Préserve l’idée d’un engagement ardent et le possible contraste rhétorique avec le goût des disputes.
- source_word: περὶ τῶν ἀνηκόντων εἰς σωτηρίαν
  choice: pour ce qui touche au salut
  rationale: Rend idiomatiquement ce qui relève du salut ou s’y rapporte, sans préciser davantage la nature des réalités visées.
theological_decisions:
- issue: Portée de σωτηρίαν
  choice: salut
  alternative: délivrance
  rationale: « Salut » est le sens théologique naturel dans ce contexte et conserve la largeur sémantique du grec.
- issue: Valeur de ζηλωταὶ
  choice: Conserver une formulation potentiellement positive en tension avec la première proposition
  alternative: Comprendre le zèle comme nécessairement ironique ou condamnable
  rationale: Le grec juxtapose le goût de la dispute et le zèle sans expliciter si le second est loué, concédé ou teinté d’ironie; la traduction ne tranche pas.
translation_notes:
  register: Français moderne, clair et digne. La phrase garde l’apostrophe « frères » et la tension entre la disposition querelleuse et le zèle concernant le salut.
