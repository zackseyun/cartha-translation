  text: ἐπίστασθε, ὅτι οὐδὲν ἄδικον οὐδὲ παρεπεποιημένον γέγραπται ἐν αὐταῖς· οὐχ εὑρήσετε δικαίους ἀποβεβλημένους ἀπὸ ὁσίων ἀνδρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/003.yaml
  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: fr
  text: Vous savez que rien d’injuste ni de falsifié n’y est écrit. Vous n’y trouverez pas de justes rejetés par des hommes saints.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  choice: Vous savez
  rationale: Rend directement le parfait à valeur présente du verbe « savoir, bien connaître ».
- source_word: παρεπεποιημένον
  choice: falsifié
  rationale: Le participe parfait désigne ici ce qui a été altéré ou fabriqué frauduleusement; « falsifié » conserve l’accusation précise sans l’amplifier.
- source_word: ἐν αὐταῖς
  choice: y
  rationale: Le pronom féminin pluriel renvoie au corpus d’écrits mentionné dans le contexte; le français idiomatique emploie « y » sans expliciter davantage l’antécédent.
- source_word: δικαίους
  choice: des justes
  rationale: Le substantif adjectival désigne des personnes justes; « des justes » est naturel et garde la portée morale et religieuse du grec.
- source_word: ἀποβεβλημένους
  choice: rejetés
  rationale: Rend le parfait passif de ἀποβάλλω, « écarter, rejeter », tout en conservant l’idée d’un état résultant.
- source_word: ὁσίων ἀνδρῶν
  choice: des hommes saints
  rationale: ὅσιος exprime la sainteté ou la piété; « hommes saints » distingue ces personnes des « justes » sans effacer la nuance religieuse.
theological_decisions:
- issue: Sens de la relation introduite par ἀπό après ἀποβεβλημένους
  choice: rejetés par des hommes saints
  alternative: rejetés loin d’hommes saints
  rationale: Avec un passif, ἀπό peut marquer l’agent aussi bien que la séparation. Le contexte argumentatif et la consultation anglaise favorisent l’agent, mais le français retenu n’ajoute aucun motif au rejet.
translation_notes:
  register: Français international moderne, sobre et digne. Deux phrases remplacent le point-virgule pour une lecture fluide. La répétition de « vous » maintient l’adresse directe et la force rhétorique du grec.
