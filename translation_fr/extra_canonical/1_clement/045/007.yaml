  source_fidelity: Le texte rend correctement l'interrogation rhétorique, l'enfermement dans la fournaise (κατείρχθησαν), l'indignation qui suit, les mauvais traitements, ainsi que la fonction protectrice du Très-Haut. « Enfermé » est préférable à « précipité » ou « fait descendre ». Une légère révision est indiquée pour mieux rendre ὁσία (« pieux ») et παναρέτῳ (« parfait en toute vertu »).
  naturalness: Le français est clair, moderne et d'un registre convenablement soutenu. « Dessein pieux et irréprochable » est un peu plus idiomatique et précis que « intention sainte et irréprochable » dans ce contexte. La doxologie est rendue de façon naturelle sans surinterpréter son antécédent.
  terminology: Les noms Ananias, Azarias et Misaël sont appropriés. « Très-Haut », « rendre un culte », « champion et défenseur » et « mauvais traitements » sont fidèles et adaptés. « Son nom parfaitement digne » atténue et déplace la notion de vertu/excellence contenue dans παναρέτῳ; « son nom, parfait en toute vertu » la conserve plus exactement.
