source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
translation:
  language: fr
  text: Ou bien Ananias, Azarias et Misaël ont-ils été enfermés dans une fournaise ardente par ceux qui pratiquaient le culte majestueux et glorieux du Très-Haut ? Certainement pas ! Qui donc a commis ces actes ? Des êtres odieux, remplis de toute méchanceté, se sont laissés emporter par une telle fureur qu’ils ont soumis aux mauvais traitements ceux qui servaient Dieu avec un dessein pieux et irréprochable. Ils ignoraient que le Très-Haut est le champion et le défenseur de ceux qui rendent un culte à son nom, parfait en toute vertu, avec une conscience pure. À lui soit la gloire pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατείρχθησαν
  choice: ont été enfermés
  rationale: Le verbe κατείργω signifie ici enfermer, confiner ou emprisonner ; ce choix évite la confusion avec κατάγω, « faire descendre ».
- source_word: θρησκευόντων … θρησκείαν
  choice: ceux qui pratiquaient le culte
  rationale: La répétition grecque associe le fait de pratiquer à un culte ou à une religion ; « pratiquer le culte » reste naturel en français et convient au contexte religieux.
- source_word: οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις
  choice: Des êtres odieux, remplis de toute méchanceté
  rationale: Les deux expressions décrivent vraisemblablement les mêmes auteurs plutôt que deux groupes distincts.
- source_word: εἰς αἰκίαν περιβαλεῖν
  choice: ont soumis aux mauvais traitements
  rationale: αἰκία désigne l’outrage, les sévices ou les mauvais traitements ; la formulation française conserve cette portée sans préciser un type de violence absent du grec.
- source_word: ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει
  choice: avec une intention sainte et irréprochable
  rationale: πρόθεσις exprime ici le dessein ou l’intention intérieure qui caractérise leur service de Dieu.
- source_word: τῷ παναρέτῳ ὀνόματι αὐτοῦ
  choice: à son nom parfaitement digne
  rationale: παναρέτος signifie littéralement « pourvu de toute vertu/excellence ». Appliqué au nom divin, « parfaitement digne » restitue l’éloge sans suggérer maladroitement qu’un nom possède des vertus morales.
theological_decisions:
- issue: Référent de la doxologie ᾧ ἡ δόξα
  choice: À lui soit la gloire
  alternative: À son nom soit la gloire
  rationale: Le relatif peut grammaticalement renvoyer au « nom », mais la formule doxologique vise plus naturellement Dieu, le Très-Haut, mentionné comme défenseur. La traduction française conserve néanmoins un pronom plutôt que d’expliciter davantage.
- issue: Portée de λατρευόντων
  choice: ceux qui rendent un culte à son nom
  alternative: ceux qui servent son nom
  rationale: λατρεύω peut signifier servir dans un cadre cultuel ou rendre un culte. Ici, « rendre un culte » exprime clairement l’orientation religieuse sans introduire une doctrine confessionnelle.
translation_notes:
  register: Français moderne, international et digne. La structure interrogative et la réfutation énergique du grec sont conservées. Le passage reste proche de la syntaxe argumentative originale tout en évitant des calques obscurs.
