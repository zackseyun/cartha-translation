    issue: Rendu de τῷ παναρέτῳ ὀνόματι αὐτοῦ
    rationale: « Parfaitement digne » ne rend pas explicitement l'idée de toute vertu/excellence portée par παναρέτῳ. Une formulation française légèrement plus explicite préserve cette caractérisation sans lui imposer de sens confessionnel.
