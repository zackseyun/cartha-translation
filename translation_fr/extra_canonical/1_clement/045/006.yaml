  text: τί γὰρ εἴπωμεν, ἀδελφοί; Δανιὴλ ὑπὸ τῶν φοβουμένων τὸν θεὸν ἐβλήθη εἰς λάκκον λεόντων;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/006.yaml
  text: For what shall we say, brothers? Was Daniel thrown into a den of lions by those who feared God?
translation:
  language: fr
  text: Que dirons-nous donc, frères ? Daniel a-t-il été jeté dans une fosse aux lions par ceux qui craignaient Dieu ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ εἴπωμεν
  choice: Que dirons-nous donc
  rationale: Rend naturellement la question délibérative et la valeur de liaison de γάρ dans le contexte.
- source_word: ἀδελφοί
  choice: frères
  rationale: Équivalent direct et traditionnel de l’apostrophe grecque, employé ici pour l’ensemble de la communauté.
- source_word: λάκκον λεόντων
  choice: une fosse aux lions
  rationale: Expression française naturelle qui conserve l’image du lieu où se trouvent les lions.
- source_word: τῶν φοβουμένων τὸν θεόν
  choice: ceux qui craignaient Dieu
  rationale: Préserve le sens religieux de φοβέομαι, qui désigne la révérence envers Dieu, tout en maintenant l’ironie de la question.
theological_decisions:
- issue: Portée rhétorique de la question concernant ceux qui craignent Dieu
  choice: Conserver une question directe sans expliciter la réponse attendue
  alternative: Ajouter une formulation telle que « certainement pas »
  rationale: Le grec formule une question rhétorique dont la réponse négative est implicite ; l’expliciter supprimerait une part de la force et de la tension du texte.
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la structure grecque tout en étant idiomatique ; aucun marqueur de note n’est nécessaire.
