  yaml_path: translation/extra_canonical/1_clement/045/002.yaml
  text: You have looked closely into the holy Scriptures[a], the true ones, those given through the Holy Spirit.
translation:
  language: fr
  text: Vous avez examiné attentivement les saintes Écritures[a], les véritables, celles qui ont été données par l’Esprit Saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Vous vous êtes penchés pour regarder dans les saintes Écritures ». À propos d’écrits, le verbe peut désigner un examen attentif.'
    reason: Préserve l’image concrète du verbe grec ἐγκύπτω, rendue idiomatiquement dans le texte principal.
lexical_decisions:
- source_word: ἐνεκύψατε
  choice: vous avez examiné attentivement
  rationale: Avec un écrit pour objet, le verbe exprime l’idée de se pencher sur un texte afin de l’examiner avec soin; cette formulation française en rend naturellement la portée sans surtraduire l’image physique.
- source_word: ἱερὰς γραφάς
  choice: les saintes Écritures
  rationale: Rend l’expression grecque consacrée en français moderne et conserve son caractère sacré.
- source_word: τὰς ἀληθεῖς
  choice: les véritables
  rationale: Conserve l’apposition emphatique et évite de répéter inutilement « Écritures ».
- source_word: τὰς διὰ τοῦ πνεύματος τοῦ ἁγίου
  choice: celles qui nous sont parvenues par l’Esprit Saint
  rationale: Le grec ne comporte pas de participe exprimé; cette formulation restitue naturellement la relation instrumentale ou médiatrice indiquée par διά tout en évitant d’affirmer plus précisément que le texte ne le fait le mode de transmission.
theological_decisions:
- issue: Rôle de l’Esprit Saint dans la provenance des Écritures
  choice: parvenues par l’Esprit Saint
  alternative: données par l’Esprit Saint
  rationale: L’ellipse grecque affirme que ces Écritures sont « par l’Esprit Saint » sans préciser verbalement si elles ont été données, prononcées ou transmises. Le choix retenu conserve cette médiation tout en limitant l’explicitation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient à l’adresse directe et au contexte discursif; « examiner attentivement » est idiomatique sans être familier.
