lexical_decisions:
- source_word: ταῦτα πάσχοντες
  choice: En subissant ces épreuves
  rationale: Le participe πάσχοντες exprime ici une circonstance concomitante. « Ces épreuves » rend naturellement le neutre pluriel ταῦτα dans ce contexte de souffrances.
- source_word: εὐκλεῶς
  choice: avec noblesse
  rationale: L’adverbe signifie « d’une manière glorieuse, honorable ou noble ». « Avec noblesse » conserve la valeur morale et élogieuse sans exagérer vers la célébrité.
- source_word: ἤνεγκαν
  choice: ils les ont supportées
  rationale: Dans un contexte de souffrance, φέρω à l’aoriste a le sens d’endurer ou de supporter. Le pronom « les » reprend explicitement « ces épreuves » pour une formulation française fluide.
