review_pass:
  verdict: revise
  source_fidelity: 'La série rhétorique et les contrastes de vocabulaire sont bien rendus : ἀνόμων (« sans loi »), ἀνοσίων (« impies »), παρανόμων (« transgresseurs de la loi »), ainsi que le mobile exprimé par ζήλῳ ἀνεκτρίστῳ. Toutefois, la forme fournie ἐλιθοβόλησαν est morphologiquement un aoriste actif (« ils lapidèrent »), alors que le contexte et les traductions anglaise et française supposent le passif (« ils furent lapidés »). Cette leçon produit une rupture syntaxique et contextuelle manifeste et appelle une vérification de l’édition ; elle semble très probablement refléter une anomalie de transcription/normalisation plutôt que le texte visé.'
  naturalness: Le français est globalement clair et soutenu. « Des êtres infâmes » est toutefois moins naturel et plus pesant que « des gens vils » ; ce dernier rend bien la dépréciation morale de μιαρός sans ajouter une interprétation rituelle précise. « Poussés par » explicite légèrement le rattachement de la jalousie aux meurtriers ; « par une jalousie insupportable » conserve plus directement l’ambiguïté du datif causal/instrumental.
  terminology: « Justes », « impies » et « transgresseurs de la loi » sont appropriés et maintiennent les distinctions lexicales grecques. « Sans loi » est préférable à « hors-la-loi », qui pourrait évoquer un statut juridique subi. « Jalousie » convient dans ce contexte hostile pour ζῆλος.
  issues:
  - severity: high
    issue: Discordance entre ἐλιθοβόλησαν et « ils ont été lapidés »
    rationale: La forme grecque transmise dans le dossier est active, tandis que la traduction est passive. Le contexte parallèle rend l’actif très probablement fautif dans la source normalisée ou dépendant d’une leçon à contrôler, mais une décision éditoriale exige une vérification humaine.
  - severity: low
    issue: « des êtres infâmes » est lourd en français moderne
    rationale: « Des gens vils et injustes » est plus idiomatique tout en gardant la force péjorative de μιαροί et le parallèle avec ἀδίκοι.
  - severity: low
    issue: « poussés par » resserre l’interprétation du datif ζήλῳ
    rationale: Le grec exprime le moyen ou la cause sans expliciter psychologiquement le sujet affecté. Une formulation instrumentale française conserve cette souplesse.
  revised_text: Des justes ont été persécutés, mais par des gens sans loi ; ils ont été emprisonnés, mais par des impies ; ils ont été lapidés par des transgresseurs de la loi ; ils ont été mis à mort par des gens vils et injustes, par une jalousie insupportable.
  revised_footnotes: []
  revision_rationale: 'Révision stylistique limitée : « gens vils » remplace la tournure moins naturelle « êtres infâmes », et « par une jalousie insupportable » rend le datif grec sans attribuer plus explicitement l’état intérieur aux meurtriers. Le passif de la troisième proposition est conservé provisoirement parce qu’il est requis par le parallélisme contextuel et confirmé par l’audit anglais, mais la forme active affichée dans la source doit être collationnée avant validation définitive.'
