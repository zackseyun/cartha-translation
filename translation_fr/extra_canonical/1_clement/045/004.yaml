source:
  edition: Funk 1901 (normalized OCR)
  text: ἐδιώχθησαν δίκαιοι, ἀλλ᾽ ὑπὸ ἀνόμων, ἐφυλακίσθησαν, ἀλλ᾽ ὑπὸ ἀνοσίων· ἐλιθοβόλησαν ὑπὸ παρανόμων· ἀπεκτείνθησαν ὑπὸ τῶν μιαρῶν καὶ ἀδίκων ζήλῳ ἀνεκτρίστῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
translation:
  language: fr
  text: Des justes ont été persécutés, mais par des gens sans loi ; ils ont été emprisonnés, mais par des impies ; ils ont été lapidés par des transgresseurs de la loi ; ils ont été mis à mort par des êtres infâmes et injustes, poussés par une jalousie insupportable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: des justes
  rationale: Rend directement le substantif adjectival grec et conserve sa portée morale.
- source_word: ἀνόμων
  choice: des gens sans loi
  rationale: Exprime l'absence ou le mépris de la loi sans suggérer qu'ils auraient été eux-mêmes mis hors la loi.
- source_word: ἀνοσίων
  choice: des impies
  rationale: Restitue l'idée d'irrévérence et de profanation portée par ἀνόσιος dans un français biblique actuel.
- source_word: παρανόμων
  choice: des transgresseurs de la loi
  rationale: Met en avant la violation active de la loi, sens de παράνομος, tout en distinguant ce terme de ἀνόμων.
- source_word: μιαρῶν καὶ ἀδίκων
  choice: des êtres infâmes et injustes
  rationale: « Infâmes » communique la souillure morale de μιαρός sans imposer ici une lecture strictement rituelle ; « injustes » rend ἀδίκων.
- source_word: ζήλῳ ἀνεκτρίστῳ
  choice: poussés par une jalousie insupportable
  rationale: Le datif peut exprimer le mobile ou le moyen ; cette formulation française naturelle conserve la jalousie comme force motivant le meurtre.
theological_decisions:
- issue: Valeur de ζῆλος
  choice: jalousie
  alternative: zèle
  rationale: Dans ce contexte de persécution et de mise à mort, le sens négatif « jalousie » est le plus probable, sans ajouter de qualification doctrinale.
- issue: Agent implicite de ζήλῳ ἀνεκτρίστῳ
  choice: la locution « poussés par » rattache la jalousie aux meurtriers
  alternative: « à cause d'une jalousie insupportable », qui laisserait davantage ouverte son attribution
  rationale: La syntaxe et le mouvement de la phrase favorisent la jalousie comme mobile des persécuteurs ; la formulation reste causale plutôt que psychologiquement détaillée.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme répétitif du grec est conservé. « Mais » est maintenu dans les deux premières propositions pour respecter l'insistance rhétorique de ἀλλά, tandis que les deux dernières suivent la construction grecque plus directe.
