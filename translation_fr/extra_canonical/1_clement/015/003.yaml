  text: And again, “With their mouth they were blessing, but with their heart they were cursing.”
translation:
  language: fr
  text: 'Et encore : « De leur bouche, ils bénissaient, mais dans leur cœur, ils maudissaient. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ στόματι αὐτῶν
  choice: De leur bouche
  rationale: Rend naturellement en français l’expression instrumentale grecque tout en conservant le contraste avec le cœur.
- source_word: εὐλογοῦσαν
  choice: ils bénissaient
  rationale: L’imparfait restitue l’aspect imperfectif du verbe grec et garde son sens direct.
- source_word: τῇ δὲ καρδίᾳ αὐτῶν
  choice: mais dans leur cœur
  rationale: Le datif exprime ici la sphère intérieure; « dans leur cœur » est idiomatique et préserve l’opposition bouche-cœur.
- source_word: κατηρῶντο
  choice: ils maudissaient
  rationale: Traduction directe du verbe καταράομαι, à l’imparfait, sans atténuer l’antithèse.
theological_decisions:
- issue: Contraste entre parole extérieure et disposition intérieure
  choice: Conserver l’antithèse littérale « bouche / cœur » et « bénissaient / maudissaient »
  alternative: Expliciter par « en paroles / intérieurement »
  rationale: Le parallélisme concret du grec porte la force morale et rhétorique du propos; une explicitation réduirait cette image sans nécessité.
translation_notes:
  register: Français moderne, clair et digne. La ponctuation introduit la citation, et l’imparfait parallèle respecte la forme verbale grecque.
