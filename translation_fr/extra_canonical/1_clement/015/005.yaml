source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: fr
  text: 'C’est pourquoi, que les lèvres trompeuses qui profèrent l’iniquité contre le juste deviennent muettes. Et encore : « Que le Seigneur détruise toutes les lèvres trompeuses, la langue aux propos arrogants, ainsi que ceux qui ont dit : “Nous exaltons notre langue ; nos lèvres nous appartiennent. Qui est notre maître ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  choice: que deviennent muettes
  rationale: Rend directement le souhait ou impératif à la troisième personne, sans en atténuer la force.
- source_word: ἀνομίαν
  choice: l’iniquité
  rationale: Conserve la dimension morale et juridique du terme grec, plutôt que de la réduire à de simples paroles méchantes.
- source_word: γλῶσσαν μεγαλοῤῥήμονα
  choice: la langue aux propos arrogants
  rationale: Expression française naturelle qui restitue l’idée d’un langage grandiloquent et présomptueux.
- source_word: Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν
  choice: Nous exalterons notre langue
  rationale: Préserve l’image grecque et la revendication orgueilleuse de puissance par la parole.
- source_word: τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν
  choice: nos lèvres nous appartiennent
  rationale: Exprime idiomatiquement la prétention à disposer souverainement de sa propre parole.
- source_word: κύριος
  choice: maître
  rationale: Dans la question finale, le terme désigne celui qui aurait autorité sur les locuteurs ; « maître » restitue plus clairement ce sens en français que « seigneur » avec une minuscule.
theological_decisions:
- issue: Portée de κύριος dans la citation
  choice: « le Seigneur » pour l’action divine, puis « maître » dans la question des arrogants
  alternative: Employer « Seigneur » dans les deux cas
  rationale: Le premier emploi désigne explicitement Dieu, tandis que le second formule une contestation générale de toute autorité sur les locuteurs. Cette distinction rend le contexte sans effacer l’écho théologique.
- issue: Force de l’imprécation Ἐξολεθρευθῆσαν
  choice: « Que le Seigneur fasse disparaître »
  alternative: « Que le Seigneur détruise »
  rationale: « Faire disparaître » conserve la force d’élimination du verbe tout en restant naturel dans une citation poétique française ; il ne transforme pas la demande en simple constat.
translation_notes:
  register: Français moderne, digne et lisible, avec une syntaxe légèrement solennelle adaptée à une citation scripturaire. Les guillemets français encadrent la citation principale et les guillemets doubles courbes la parole citée à l’intérieur.
