source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν καὶ τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν, ἡ δὲ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ, οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: fr
  text: 'Et il dit encore : « Ils l’ont aimé de leur bouche et, de leur langue, ils lui ont menti ; mais leur cœur n’était pas droit envers lui, et ils ne furent pas fidèles à son alliance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν
  choice: ils l’ont aimé
  rationale: Rend directement l’aoriste de ἀγαπάω et conserve la formulation frappante de la citation.
- source_word: ἐψεύσαντο αὐτόν
  choice: ils lui ont menti
  rationale: Expression française naturelle pour le verbe ψεύδομαι construit ici avec la personne trompée.
- source_word: εὐθεῖα μετ᾽ αὐτοῦ
  choice: droit envers lui
  rationale: « Droit » préserve l’image morale de εὐθύς, tandis que « envers lui » exprime naturellement la relation indiquée par μετά.
- source_word: ἐπιστώθησαν
  choice: ils ne furent pas fidèles
  rationale: Rend le sens de fidélité ou de fiabilité sans ajouter l’idée interprétative qu’ils auraient été « trouvés » ou « reconnus » fidèles.
- source_word: διαθήκῃ
  choice: alliance
  rationale: Dans ce contexte scripturaire, « alliance » est le terme français courant et adéquat, plutôt que « testament ».
theological_decisions:
- issue: Rapport à l’alliance dans οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ
  choice: ils ne furent pas fidèles à son alliance
  alternative: ils ne se montrèrent pas fidèles dans son alliance
  rationale: La formulation retenue restitue clairement le défaut de fidélité sans introduire la nuance probatoire de « se montrer » ; la préposition française « à » est idiomatique avec « fidèle ».
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle de la citation est conservée, ainsi que le singulier collectif « leur cœur ». Aucun marqueur de note n’est requis.
