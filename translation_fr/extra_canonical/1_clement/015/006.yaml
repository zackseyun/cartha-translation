source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: fr
  text: '« À cause de la détresse des pauvres et du gémissement des indigents, maintenant je me lèverai, dit le Seigneur : je le mettrai en sécurité. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταλαιπωρίας
  choice: détresse
  rationale: Rend la misère pénible et l'affliction exprimées par le terme grec, dans un français naturel et digne.
- source_word: πτωχῶν
  choice: pauvres
  rationale: Équivalent direct et courant du pluriel grec.
- source_word: στεναγμοῦ
  choice: gémissement
  rationale: Conserve l'image audible de la souffrance présente dans le grec.
- source_word: πενήτων
  choice: indigents
  rationale: Distingue ce second terme de πτωχῶν tout en exprimant le manque matériel.
- source_word: ἀναστήσομαι
  choice: je me lèverai
  rationale: Préserve le mouvement concret et l'intervention divine annoncée par le futur grec.
- source_word: θήσομαι ἐν σωτηρίῳ
  choice: Je le mettrai en sécurité
  rationale: Expression française naturelle qui conserve le pronom objet singulier implicite et l'idée d'une situation de salut ou de sûreté.
theological_decisions:
- issue: Référent de l'objet singulier implicite dans θήσομαι
  choice: le
  alternative: les / omission du pronom
  rationale: La forme verbale est traditionnellement comprise avec un objet masculin singulier; la traduction maintient cette singularité sans préciser de qui il s'agit, afin de préserver l'ambiguïté du texte.
- issue: Portée de σωτήριον
  choice: sécurité
  alternative: salut
  rationale: Dans la construction ἐν σωτηρίῳ, « en sécurité » exprime naturellement l'état protégé visé sans imposer une lecture exclusivement sotériologique.
translation_notes:
  register: Français international moderne, sobre et dignifié. La répétition structurante « à cause de… et de… » ainsi que « maintenant » sont conservés; le référent du pronom singulier demeure volontairement indéterminé.
