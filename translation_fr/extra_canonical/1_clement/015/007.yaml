  text: I will speak boldly in him.’”[a]
translation:
  language: fr
  text: « En lui, je parlerai avec assurance. »[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je parlerai ouvertement à son sujet » ; autre possibilité : « Je parlerai avec assurance pour lui ».'
    reason: La tournure grecque ἐν αὐτῷ est ambiguë, et le verbe peut souligner soit l’assurance, soit la liberté de parole.
lexical_decisions:
- source_word: παρρησιάσομαι
  choice: je parlerai avec assurance
  rationale: Le verbe exprime une parole libre, ouverte et assurée. Cette formulation française reste naturelle tout en conservant l’idée d’assurance, sans la réduire à la seule franchise.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: 'Cette traduction reproduit la construction grecque et en préserve l’ambiguïté : le pronom peut renvoyer à une personne ou, selon le contexte de la citation, à ce qui vient d’être mentionné. Une reformulation comme « pour lui » trancherait trop vite la question.'
theological_decisions:
- issue: Référent et valeur de ἐν αὐτῷ
  choice: Maintenir « en lui » dans le texte
  alternative: « pour lui » ou « à son sujet »
  rationale: Le fragment grec isolé ne permet pas de décider avec certitude si la préposition indique la sphère, l’appui, le sujet ou le bénéficiaire de la parole. La traduction principale conserve donc cette tension plutôt que d’imposer une interprétation.
translation_notes:
  register: Français moderne, digne et accessible. L’inversion légère « En lui » met en relief la formule grecque sans alourdir la phrase.
