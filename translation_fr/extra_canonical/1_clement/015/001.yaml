  naturalness: « Vivent en paix dans la piété » est naturel et digne en français moderne. Dans la seconde proposition, « désirent hypocritement la paix » rend plus nettement et plus idiomatiquement la fonction modale de μεθ᾽ ὑποκρίσεως que « désirent la paix avec hypocrisie », qui est moins fluide et peut suggérer une association instrumentale.
  terminology: « Attachons-nous » rend bien κολληθῶμεν. « Piété » rend εὐσέβεια sans confessionnaliser le terme, et « hypocrisie » rend directement ὑπόκρισις. Aucune terminologie théologique spécialisée ne nécessite de note doctrinale.
