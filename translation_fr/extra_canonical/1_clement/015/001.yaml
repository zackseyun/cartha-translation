  text: Therefore let us join ourselves to those who Therefore let us join ourselves to those who live in peace with godliness, and not to those who desire peace with hypocrisy..
translation:
  language: fr
  text: Ainsi donc, attachons-nous à ceux qui vivent en paix dans la piété, et non à ceux qui désirent hypocritement la paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec rendu par « vivent en paix » peut aussi évoquer le fait de préserver ou de promouvoir la paix.
    reason: εἰρηνεύω peut désigner soit une conduite paisible, soit l’action de maintenir la paix; la note conserve cette nuance sans faire de la piété l’objet de la paix.
lexical_decisions:
- source_word: κολληθῶμεν
  choice: attachons-nous
  rationale: Le verbe exprime l’idée de se joindre étroitement à quelqu’un ou de s’y attacher; cette tournure française conserve à la fois la force relationnelle et l’exhortation.
- source_word: εἰρηνεύουσιν
  choice: vivent en paix
  rationale: Le verbe peut signifier vivre en paix ou entretenir la paix. « Vivent en paix » est naturel en français et évite de faire de la piété l’objet d’une réconciliation.
- source_word: μετ᾽ εὐσεβείας
  choice: dans la piété
  rationale: La préposition indique ici la manière ou la qualité accompagnant la conduite pacifique; « dans la piété » rend ce rapport sans suggérer qu’on fait la paix avec la piété.
- source_word: βουλομένοις εἰρήνην
  choice: désirent la paix
  rationale: La construction associe le participe « vouloir, désirer » au nom « paix »; la traduction garde cette différence par rapport au verbe de la première proposition.
- source_word: μεθ᾽ ὑποκρίσεως
  choice: avec hypocrisie
  rationale: La formule qualifie la manière dont la paix est désirée ou affichée. Le français conserve la tension entre un désir déclaré de paix et l’hypocrisie qui l’accompagne.
theological_decisions:
- issue: Rapport entre paix, piété et hypocrisie
  choice: Présenter la piété et l’hypocrisie comme les dispositions qui accompagnent respectivement la vie paisible et le désir de paix.
  alternative: « font la paix avec la piété » / « veulent la paix avec l’hypocrisie »
  rationale: Le grec emploie μετά avec le génitif dans un sens modal ou concomitant; il ne présente vraisemblablement ni la piété ni l’hypocrisie comme les partenaires avec lesquels on se réconcilie.
translation_notes:
  register: Français moderne, international et digne. L’exhortation collective est conservée. La formulation distingue soigneusement le fait de vivre en paix du simple désir de paix, tout en évitant une tournure artificielle où la piété ou l’hypocrisie deviendraient les objets de la paix.
