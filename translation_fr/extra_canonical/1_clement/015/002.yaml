  yaml_path: translation/extra_canonical/1_clement/015/002.yaml
  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: fr
  text: 'Car il est dit quelque part : « Ce peuple m’honore des lèvres, mais son cœur est loin de moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Car il est dit quelque part
  rationale: Rend la formule introductive indéfinie du grec de manière naturelle en français, sans préciser artificiellement le locuteur ou le passage cité.
- source_word: τοῖς χείλεσιν με τιμᾷ
  choice: m’honore des lèvres
  rationale: Conserve l’image concrète et le contraste rhétorique entre les lèvres et le cœur.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: mais son cœur
  rationale: Le grec passe du collectif singulier « ce peuple » au possessif pluriel « leur cœur ». Le français emploie naturellement le possessif singulier avec le nom collectif, tout en préservant l’idée d’une disposition intérieure commune.
- source_word: πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  choice: est loin de moi
  rationale: Traduction directe, idiomatique et sobre de l’éloignement exprimé par le grec.
theological_decisions:
- issue: Nature de l’éloignement du cœur
  choice: Conserver simplement « est loin de moi »
  alternative: Expliciter par « s’est détourné de moi » ou « ne m’est pas attaché »
  rationale: Le texte exprime une distance métaphorique sans en définir davantage la nature; l’expliciter résoudrait indûment cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La structure brève de la citation et son opposition entre confession extérieure et disposition intérieure sont conservées.
