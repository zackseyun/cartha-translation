source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
translation:
  language: fr
  text: Car il est bon de reconnaître ses fautes[a] plutôt que d’endurcir son cœur, comme le cœur de ceux qui se sont révoltés contre Moïse, le serviteur de Dieu, s’est endurci, et leur jugement est devenu manifeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’avouer ses fautes » ; littéralement : « de faire confession au sujet de ses fautes ».'
    reason: Préserve la construction grecque avec περὶ et la nuance d’aveu explicite de ἐξομολογεῖσθαι, sans alourdir le texte courant.
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  choice: reconnaître ses fautes
  rationale: Rend naturellement en français l’aveu explicite des manquements, sans le calque maladroit « confesser au sujet de ».
- source_word: σκληρῦναι τὴν καρδίαν αὐτοῦ
  choice: s’endurcir le cœur
  rationale: Expression française naturelle qui conserve l’image biblique du cœur rendu dur.
- source_word: στασιασάντων πρὸς
  choice: ceux qui se sont révoltés contre
  rationale: Le verbe désigne ici une rébellion ou une insurrection dirigée contre Moïse.
- source_word: θεράποντα τοῦ θεοῦ
  choice: le serviteur de Dieu
  rationale: « Serviteur » est idiomatique et restitue le rôle honorifique de Moïse auprès de Dieu.
- source_word: τὸ κρίμα πρόδηλον ἐγενήθη
  choice: la condamnation est devenue manifeste
  rationale: κρίμα peut désigner le jugement prononcé ou la condamnation; le contexte du sort visible des rebelles favorise « condamnation », tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Sens de κρίμα
  choice: condamnation
  alternative: jugement
  rationale: Le contexte évoque les conséquences manifestes de la révolte; « condamnation » exprime la valeur défavorable probable, tandis que la note préserve la portée plus générale de « jugement ».
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec sans sacrifier la fluidité; le vocabulaire biblique traditionnel est conservé lorsqu’il demeure immédiatement compréhensible.
