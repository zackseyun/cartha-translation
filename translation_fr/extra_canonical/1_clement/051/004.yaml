  text: κατέβησαν γὰρ εἰς ᾅδου ζῶντες, καὶ θάνατος ποιμανεῖ αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/004.yaml
  text: For they went down alive into Hades, and death will shepherd them.
translation:
  language: fr
  text: Car ils sont descendus vivants dans l’Hadès, et la mort les fera paître.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβησαν
  choice: sont descendus
  rationale: Rend directement l’aoriste de καταβαίνω par un passé composé naturel en français.
- source_word: εἰς ᾅδου
  choice: dans l’Hadès
  rationale: Le grec désigne le séjour des morts; «Hadès» préserve cette référence sans la confondre avec la notion plus tardive d’enfer comme lieu de châtiment.
- source_word: ζῶντες
  choice: vivants
  rationale: 'Conserve la force circonstancielle du participe: ils y sont descendus alors qu’ils étaient encore en vie.'
- source_word: θάνατος
  choice: la mort
  rationale: Maintient la personnification présente dans le grec.
- source_word: ποιμανεῖ
  choice: fera paître
  rationale: Préserve l’image pastorale volontairement saisissante du verbe ποιμαίνω et son futur, plutôt que de l’aplanir en «dominera» ou «conduira».
theological_decisions:
- issue: Sens de ᾅδης
  choice: l’Hadès
  alternative: le séjour des morts / l’enfer
  rationale: «Hadès» conserve la désignation grecque du domaine des morts et évite d’imposer l’idée spécifique de damnation que peut suggérer «enfer».
- issue: Métaphore de la mort comme berger
  choice: la mort les fera paître
  alternative: la mort sera leur berger / la mort les conduira
  rationale: La formulation retenue reproduit le verbe grec et garde intacte la tension de l’image, sans l’interpréter davantage.
translation_notes:
  register: Français moderne, sobre et dignifié. La syntaxe reste proche du grec tout en étant naturelle; l’étrange métaphore pastorale est délibérément conservée.
