revisions:
- from: Ainsi donc, pour toutes les fautes dans lesquelles nous sommes tombés et que nous avons commises par quelque moyen de l’Adversaire[a], demandons qu’elles nous soient pardonnées. Quant à ceux qui sont devenus les instigateurs de la révolte et de la division, eux aussi doivent garder en vue l’espérance commune.
  to: Ainsi donc, pour toutes les fautes dans lesquelles nous sommes tombés et que nous avons commises sous l’effet de quelque manœuvre de l’Adversaire[a], demandons qu’elles nous soient pardonnées. Quant à ceux qui sont devenus les instigateurs de la dissension et de la division, eux aussi doivent garder en vue l’espérance commune.
