  - severity: low
    issue: « révolte » pour στάσις
    rationale: Le terme grec peut désigner une révolte, mais, dans cette exhortation concernant une fracture communautaire, « dissension » restitue plus naturellement la querelle ou le parti pris sans surpolitiser le référent.
