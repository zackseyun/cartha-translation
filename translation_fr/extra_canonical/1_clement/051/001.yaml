source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
translation:
  language: fr
  text: Ainsi donc, pour toutes les fautes dans lesquelles nous sommes tombés et que nous avons commises sous l’effet de quelque manœuvre de l’Adversaire[a], demandons qu’elles nous soient pardonnées. Quant à ceux qui sont devenus les instigateurs de la dissension et de la division, eux aussi doivent garder en vue l’espérance commune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : littéralement, « par quelque chose de ce qui appartient à l’Adversaire ». Il peut aussi se comprendre plus largement : « par quelque moyen de l’Adversaire ».'
    reason: Signaler l’ellipse du texte source et préserver l’incertitude sur ce qui est attribué à l’Adversaire.
lexical_decisions:
- source_word: παρεπέσαμεν καὶ ἐποιήσαμεν
  choice: dans lesquelles nous sommes tombés et que nous avons commises
  rationale: 'Conserve les deux verbes grecs et leur légère différence : tomber dans une faute, puis la commettre.'
- source_word: διά τινος τῶν τοῦ ἀντικειμένου
  choice: par quelque moyen de l’Adversaire
  rationale: Le grec est elliptique après τινος τῶν et ne nomme pas explicitement des « manœuvres ». « Moyen » donne un français naturel sans préciser indûment ce qui relève de l’Adversaire.
- source_word: ἀξιώσωμεν ἀφεθῆναι ἡμῖν
  choice: demandons qu’elles nous soient pardonnées
  rationale: Dans ce contexte, ἀξιόω exprime une requête ; la tournure passive préserve l’absence d’agent explicite.
- source_word: ἀρχηγοὶ στάσεως καὶ διχοστασίας
  choice: les instigateurs de la révolte et de la division
  rationale: « Instigateurs » rend le rôle moteur d’ἀρχηγοί, tandis que « révolte » et « division » maintiennent la gravité des deux termes.
- source_word: τὸ κοινὸν τῆς ἐλπίδος σκοπεῖν
  choice: garder en vue l’espérance commune
  rationale: 'Rend l’expression idiomatique « l’espérance commune » et le sens de σκοπεῖν : porter son attention sur une réalité et en tenir compte.'
theological_decisions:
- issue: Identité de ὁ ἀντικείμενος
  choice: l’Adversaire
  alternative: l’adversaire
  rationale: La majuscule signale ici la désignation personnelle traditionnelle de l’ennemi spirituel, sans ajouter le nom « Satan », absent du grec.
- issue: Portée de τὸ κοινὸν τῆς ἐλπίδος
  choice: l’espérance commune
  alternative: le bien commun de l’espérance
  rationale: Le génitif forme vraisemblablement avec τὸ κοινόν l’idée de l’espérance partagée par tous ; la solution retenue évite d’introduire la notion distincte de « bien commun ».
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve l’exhortation collective de la première proposition et la force additive de καὶ ἐκεῖνοι δέ par « eux aussi ».
