source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: fr
  text: 'Le pharaon, son armée et tous les chefs de l’Égypte — les chars comme ceux qui les montaient — furent engloutis dans la mer Rouge et périrent pour aucune autre raison que celle-ci : leurs cœurs insensés avaient été endurcis après que les signes et les prodiges eurent eu lieu en terre d’Égypte par l’intermédiaire de Moïse, le serviteur de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: les chefs
  rationale: Rend naturellement les personnes qui dirigent l’Égypte, sans préciser indûment leur fonction politique.
- source_word: οἱ ἀναβάται αὐτῶν
  choice: ceux qui les montaient
  rationale: Le référent naturel de αὐτῶν est « les chars »; cette formulation conserve l’image sans introduire le terme potentiellement équivoque « cavaliers ».
- source_word: ἐβυθίσθησαν
  choice: furent engloutis
  rationale: Exprime l’idée d’être plongés ou submergés dans la mer dans un français narratif naturel.
- source_word: ἀσυνέτους καρδίας
  choice: cœurs dépourvus d’intelligence
  rationale: Conserve la portée cognitive et morale de ἀσύνετος sans la réduire à la seule folie.
- source_word: θεράποντος τοῦ θεοῦ
  choice: serviteur de Dieu
  rationale: Équivalent français digne et traditionnel de θεράπων dans ce contexte, où Moïse agit au service de Dieu.
theological_decisions:
- issue: Agent de l’endurcissement des cœurs
  choice: leurs cœurs … s’étaient endurcis
  alternative: Dieu avait endurci leurs cœurs
  rationale: L’infinitif passif σκληρυνθῆναι ne nomme pas l’agent. La traduction préserve cette indétermination et n’attribue pas explicitement l’action à Dieu.
- issue: Médiation de Moïse dans les signes et prodiges
  choice: accomplis … par Moïse
  alternative: accomplis … par l’intermédiaire de Moïse
  rationale: Le grec διὰ τοῦ … Μωϋσέως présente Moïse comme médiateur ou instrument; « par Moïse » le restitue sans trancher davantage la question de l’agent ultime.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque est conservée, structurée par des tirets et deux-points pour assurer la lisibilité. « Le pharaon » suit l’usage français courant; « en terre d’Égypte » maintient la coloration scripturaire sans archaïsme excessif.
