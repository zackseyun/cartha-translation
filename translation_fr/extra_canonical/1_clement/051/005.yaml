revisions:
- from: 'Le pharaon, son armée et tous les chefs de l’Égypte — les chars comme ceux qui les montaient — furent engloutis dans la mer Rouge et périrent pour cette seule raison : leurs cœurs dépourvus d’intelligence s’étaient endurcis après que les signes et les prodiges eurent été accomplis en terre d’Égypte par Moïse, le serviteur de Dieu.'
  to: 'Le pharaon, son armée et tous les chefs de l’Égypte — les chars comme ceux qui les montaient — furent engloutis dans la mer Rouge et périrent pour aucune autre raison que celle-ci : leurs cœurs insensés avaient été endurcis après que les signes et les prodiges eurent eu lieu en terre d’Égypte par l’intermédiaire de Moïse, le serviteur de Dieu.'
  rationale: La révision nécessaire rétablit le passif non agenté de σκληρυνθῆναι, améliore le rendu de γενέσθαι et de διά, et remplace une expression française lourde par une formulation naturelle sans perte de sens. Aucun appel de note n’est requis par le texte source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:26Z'
review_pass:
  verdict: revise
  source_fidelity: La liste des personnes et des chars, la causalité exclusive de leur perte, et la référence aux signes accomplis en Égypte sont bien rendues. Toutefois, « leurs cœurs … s’étaient endurcis » transforme le passif grec σκληρυνθῆναι en une tournure réflexive, qui suggère plus directement un auto-enducissement. Le passif français permet de conserver l’agent non exprimé dans le grec. « Eurent eu lieu » rend plus exactement γενέσθαι (« avoir lieu, se produire ») que « eurent été accomplis », tandis que « par l’intermédiaire de Moïse » restitue la médiation de διά.
  naturalness: La phrase révisée conserve un registre soutenu et lisible en français international. « Cœurs insensés » est plus idiomatique que « cœurs dépourvus d’intelligence », tout en gardant la dimension de manque de discernement portée par ἀσυνέτους.
  terminology: « Chefs », « ceux qui les montaient », « mer Rouge » et « serviteur de Dieu » conviennent. « Insensés » évite d’importer une interprétation psychologique ou doctrinale et rend naturellement ἀσύνετος dans ce contexte.
  issues:
  - severity: medium
    issue: La voix du verbe d’endurcissement n’est pas préservée.
    rationale: σκληρυνθῆναι est un infinitif passif sans agent exprimé. « S’étaient endurcis » est réflexif en français et peut attribuer l’endurcissement aux cœurs eux-mêmes; « avaient été endurcis » maintient l’ambiguïté de l’agent.
  - severity: low
    issue: « Accomplis … par Moïse » est moins précis pour le rapport entre les signes et Moïse.
    rationale: γενέσθαι signifie que les signes et prodiges se sont produits, et διά avec le génitif présente Moïse comme médiateur/instrument. « Eurent eu lieu … par l’intermédiaire de Moïse » rend ces deux éléments plus fidèlement.
  revised_text: 'Le pharaon, son armée et tous les chefs de l’Égypte — les chars comme ceux qui les montaient — furent engloutis dans la mer Rouge et périrent pour aucune autre raison que celle-ci : leurs cœurs insensés avaient été endurcis après que les signes et les prodiges eurent eu lieu en terre d’Égypte par l’intermédiaire de Moïse, le serviteur de Dieu.'
