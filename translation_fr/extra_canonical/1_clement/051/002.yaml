  source_fidelity: 'La première comparaison est correctement comprise : ἑαυτούς et τοὺς πλησίον sont les sujets accusatifs coordonnés de l’infinitif περιπίπτειν, sans idée d’infliger les mauvais traitements au prochain. La seconde oppose bien la condamnation dirigée contre eux-mêmes à celle qui viserait l’harmonie transmise. La révision rend plus directement γάρ et évite une formulation française légèrement causative ou ambiguë.'
  naturalness: Le français du projet est globalement naturel. « Faire retomber la condamnation sur » est toutefois un peu pesant, et « leur prochain » au singulier affaiblit le pluriel grec. « Voir leurs prochains les subir » exprime clairement et naturellement l’opposition des personnes qui endurent les traitements.
  terminology: « Crainte et amour », « mauvais traitements » et « harmonie » conviennent au registre et au sens. « Harmonie » garde l’image de l’accord unanime de ὁμοφωνία sans surinterprétation ecclésiologique.
