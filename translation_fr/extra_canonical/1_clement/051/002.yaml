  to: Car ceux qui se conduisent avec crainte et amour préfèrent subir eux-mêmes de mauvais traitements plutôt que de voir leurs prochains les subir ; mieux encore, la condamnation retombe sur eux-mêmes plutôt que sur l’harmonie qui nous a été transmise de manière bonne et juste.
  rationale: Révision légère visant à reproduire le pluriel de τοὺς πλησίον, à expliciter sans ajout l’ellipse du premier comparatif et à formuler la seconde opposition de manière plus naturelle. Le texte ne transforme pas les croyants en auteurs des mauvais traitements envers leurs prochains et ne précise pas indûment l’auteur de la condamnation.
