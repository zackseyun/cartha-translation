source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
translation:
  language: fr
  text: Car ceux qui se conduisent avec crainte et amour préfèrent subir eux-mêmes de mauvais traitements plutôt que de voir leurs prochains les subir ; mieux encore, la condamnation retombe sur eux-mêmes plutôt que sur l’harmonie qui nous a été transmise de manière bonne et juste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιτευόμενοι
  choice: ceux qui se conduisent
  rationale: Le verbe peut évoquer la conduite du citoyen, mais, dans ce contexte moral, « se conduire » restitue naturellement l’idée de manière de vivre sans surcharger le français.
- source_word: αἰκίαις περιπίπτειν
  choice: subir de mauvais traitements
  rationale: L’expression signifie tomber dans des sévices ou mauvais traitements ; cette formulation française est claire et conserve la passivité des personnes atteintes.
- source_word: τοὺς πλησίον
  choice: leur prochain
  rationale: Le singulier collectif « leur prochain » est idiomatique en français biblique moderne et désigne les personnes proches ou semblables.
- source_word: κατάγνωσιν φέρουσιν
  choice: faire retomber la condamnation sur
  rationale: L’expression est comprise ici comme le fait de diriger ou prononcer la condamnation contre quelqu’un, et non comme le simple fait de l’endurer.
- source_word: ὁμοφωνίας
  choice: l’unité harmonieuse
  rationale: ὁμοφωνία exprime l’accord d’une même voix ; « unité harmonieuse » rend à la fois la concorde et l’accord commun.
- source_word: καλῶς καὶ δικαίως
  choice: de manière bonne et juste
  rationale: La traduction conserve les deux adverbes et leur portée probablement liée à la transmission de cette concorde.
theological_decisions:
- issue: Objet comparé après ἢ dans la première proposition
  choice: ils préfèrent subir eux-mêmes de mauvais traitements plutôt que de les voir subir à leur prochain
  alternative: ils préfèrent subir eux-mêmes de mauvais traitements plutôt que d’en infliger à leur prochain
  rationale: τοὺς πλησίον est parallèle à ἑαυτούς comme sujet accusatif sous-entendu de περιπίπτειν ; le grec oppose donc ceux qui subissent, sans introduire l’idée d’infliger activement les sévices.
- issue: Sens de κατάγνωσιν φέρουσιν avec le génitif
  choice: faire retomber la condamnation sur eux-mêmes
  alternative: supporter leur propre condamnation
  rationale: Le contexte oppose la cible de la condamnation — eux-mêmes ou la concorde transmise — et favorise le sens de porter ou diriger une condamnation contre quelqu’un.
translation_notes:
  register: Français moderne, digne et accessible. La structure comparative et l’intensification μᾶλλον δέ (« bien plus ») sont conservées. La formulation évite d’attribuer aux personnes une action hostile envers leur prochain que le grec n’exprime pas.
