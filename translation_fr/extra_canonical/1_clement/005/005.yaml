lexical_decisions:
- source_word: ζῆλον
  choice: jalousie
  rationale: Dans ce contexte négatif, le terme désigne un zèle envieux ou la jalousie, cause des souffrances évoquées.
- source_word: ἔριν
  choice: rivalité
  rationale: Rend naturellement l’idée de querelle et de discorde sans réduire le terme à une simple dispute ponctuelle.
- source_word: ὑπομονῆς
  choice: persévérance
  rationale: Exprime l’endurance fidèle et constante au milieu des épreuves.
- source_word: βραβεῖον
  choice: prix
  rationale: Conserve l’image du prix décerné au terme d’une épreuve ou d’une course.
- source_word: ἔδειξεν
  choice: a montré
  rationale: Correspond directement au verbe grec et préserve l’idée que Paul a donné à voir le prix de la persévérance.
theological_decisions:
- issue: Rapport entre Paul et le « prix de la persévérance »
  choice: a montré le prix de la persévérance
  alternative: a montré quel est le prix de la persévérance
  rationale: La formulation retenue suit la syntaxe grecque sans préciser indûment que Paul aurait expliqué la nature du prix; le contexte suivant peut développer comment il l’a manifesté.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve l’image athlétique du prix ainsi que la causalité négative introduite par διὰ.
