revisions:
- from: Après avoir enseigné la justice au monde entier, être parvenu à l’extrême limite de l’Occident et avoir rendu témoignage devant les dirigeants, il quitta ainsi le monde et se rendit au lieu saint, devenant le plus grand modèle de persévérance.
  to: Après avoir enseigné la justice au monde entier, être parvenu à l’extrême limite de l’Occident et rendu témoignage devant les dirigeants, il quitta ainsi le monde et se rendit au lieu saint, devenant le plus grand exemple de persévérance.
  rationale: La révision corrige la coordination française des trois actions antérieures sans modifier leur rapport au verbe principal grec ἀπηλλάγη. Elle conserve l’indétermination géographique de « l’extrême limite de l’Occident », le sens non martyrologique imposé de « rendre témoignage » et l’ambiguïté métaphorique de « le lieu saint ».
