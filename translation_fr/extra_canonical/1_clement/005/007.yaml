id: 1CLEM.5.7
reference: 1 Clement 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
translation:
  language: fr
  text: Après avoir enseigné la justice au monde entier, être parvenu à l’extrême limite de l’Occident et rendu témoignage devant les dirigeants, il quitta ainsi le monde et se rendit au lieu saint, devenant le plus grand exemple de persévérance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνην
  choice: la justice
  rationale: Rend directement le nom grec dans son sens moral et religieux sans préciser davantage ce que le texte laisse général.
- source_word: τὸ τέρμα τῆς δύσεως
  choice: l’extrême limite de l’Occident
  rationale: Conserve l’expression géographique emphatique du grec sans identifier explicitement un lieu précis.
- source_word: μαρτυρήσας
  choice: avoir rendu témoignage
  rationale: Préserve le sens de témoignage public du verbe sans le réduire au sens ultérieur de « subir le martyre ».
- source_word: τῶν ἡγουμένων
  choice: les dirigeants
  rationale: Terme actuel et suffisamment large pour les personnes exerçant l’autorité, sans ajouter un titre politique absent du grec.
- source_word: ἀπηλλάγη τοῦ κόσμου
  choice: il quitta le monde
  rationale: Rend l’idiome évoquant la mort ou le départ de ce monde, sans introduire l’idée non nécessaire d’une délivrance.
- source_word: ὑπομονῆς
  choice: de persévérance
  rationale: Exprime l’endurance constante dans l’épreuve en français naturel.
- source_word: ὑπογραμμός
  choice: modèle
  rationale: Désigne un exemple à reproduire; « modèle » est idiomatique et conserve la force exemplaire du terme.
theological_decisions:
- issue: Portée de μαρτυρήσας
  choice: « avoir rendu témoignage »
  alternative: « avoir subi le martyre »
  rationale: Le grec peut nourrir une association avec le martyre, mais son sens lexical ici est d’abord celui de témoigner; la traduction ne tranche donc pas en faveur d’une mort explicitement décrite par ce participe.
- issue: Sens de « l’extrême limite de l’Occident »
  choice: Maintenir la formulation géographique indéterminée
  alternative: Identifier explicitement Rome ou l’Espagne
  rationale: Le texte ne nomme aucun lieu; une identification précise importerait une conclusion historique discutée.
- issue: Nature du « lieu saint »
  choice: Conserver « le lieu saint »
  alternative: Préciser « le ciel » ou « la présence de Dieu »
  rationale: La formulation source reste métaphorique et non explicitée; la traduction préserve cette retenue.
translation_notes:
  register: Français moderne, digne et lisible. La série participiale grecque est rendue par une construction française coordonnée menant clairement au verbe principal. Aucun marqueur de note n’est requis.
