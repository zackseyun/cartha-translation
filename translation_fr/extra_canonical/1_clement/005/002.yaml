source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλον καὶ φθόνον οἱ μέγιστοι καὶ δικαιότατοι στῦλοι ἐδιώχθησαν καὶ ἕως θανάτου ἤθλησαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/002.yaml
  text: Because of jealousy and envy, the greatest and most righteous pillars were persecuted and struggled even unto death.
translation:
  language: fr
  text: À cause de la jalousie et de l’envie, les piliers les plus éminents et les plus justes furent persécutés et luttèrent jusqu’à la mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον καὶ φθόνον
  choice: la jalousie et l’envie
  rationale: Le doublet grec est conservé, malgré la proximité des deux termes en français, afin de ne pas réduire l’insistance du texte.
- source_word: στῦλοι
  choice: piliers
  rationale: La métaphore grecque est transparente en français et désigne des personnes considérées comme des soutiens majeurs de la communauté.
- source_word: ἐδιώχθησαν
  choice: furent persécutés
  rationale: Le passif et le sens hostile du verbe sont rendus directement.
- source_word: ἤθλησαν
  choice: luttèrent
  rationale: Ce choix exprime l’effort et le combat suggérés par le verbe d’arrière-plan athlétique, sans introduire une image sportive artificielle en français.
- source_word: ἕως θανάτου
  choice: jusqu’à la mort
  rationale: Traduction naturelle qui conserve la portée extrême de leur lutte sans préciser si la mort en fut nécessairement l’issue pour chacun.
theological_decisions:
- issue: Identification des « piliers »
  choice: Conserver la métaphore sans identifier explicitement les personnes visées
  alternative: Expliciter qu’il s’agit de dirigeants ou d’apôtres
  rationale: Le verset grec emploie seulement la métaphore στῦλοι; une identification plus précise dépend du contexte et constituerait une interprétation ajoutée.
- issue: Portée de « jusqu’à la mort »
  choice: Maintenir la formulation ouverte
  alternative: Traduire « jusqu’à en mourir »
  rationale: ἕως θανάτου indique la limite ou l’intensité de la lutte, mais la formulation ne doit pas être rendue plus causale ou explicite que le grec.
translation_notes:
  register: Français moderne, digne et lisible. Le passé simple convient au registre narratif et soutenu de l’œuvre. La structure demeure proche du grec tout en restant naturelle.
