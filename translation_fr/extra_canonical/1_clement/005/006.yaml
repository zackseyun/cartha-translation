source:
  edition: Funk 1901 (normalized OCR)
  text: ἑπτάκις δεσμὰ φορέσας, φυγαδευθείς, λιθασθείς, κῆρυξ γενόμενος ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει, τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: fr
  text: Après avoir porté des chaînes à sept reprises, avoir été contraint à l’exil, avoir été lapidé et être devenu un héraut tant en Orient qu’en Occident, il reçut la noble renommée de sa foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις δεσμὰ φορέσας
  choice: Après avoir porté des chaînes à sept reprises
  rationale: Rend directement le nombre et l’image concrète de l’emprisonnement, sans réduire δεσμά au seul fait d’être emprisonné.
- source_word: φυγαδευθείς
  choice: avoir été chassé en exil
  rationale: Exprime la contrainte du passif grec plus nettement que le simple « avoir été exilé ».
- source_word: λιθασθείς
  choice: lapidé
  rationale: Équivalent français direct du participe grec, sans préciser si la lapidation fut mortelle.
- source_word: κῆρυξ γενόμενος
  choice: être devenu un messager
  rationale: « Messager » restitue la fonction publique de κῆρυξ dans un français courant et digne; « héraut » serait plus formel mais moins immédiatement accessible.
- source_word: ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει
  choice: tant en Orient qu’en Occident
  rationale: Formulation française naturelle conservant le parallélisme géographique du grec.
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν
  choice: il reçut la noble renommée que lui valut sa foi
  rationale: Conserve l’idée d’une renommée noble et rattache naturellement le génitif « de sa foi » à cette renommée, sans en surdéterminer la nuance exacte.
theological_decisions:
- issue: Rapport entre la foi de Paul et sa renommée
  choice: « la noble renommée que lui valut sa foi »
  alternative: « la noble renommée de sa foi »
  rationale: Le génitif τῆς πίστεως αὐτοῦ peut caractériser la renommée ou en indiquer la source. La formulation retenue reste proche du sens tout en étant idiomatique, sans introduire de conclusion doctrinale.
translation_notes:
  register: Français international moderne, fluide et digne. La série de participes est conservée, avec une ponctuation qui évite la lourdeur. « Orient » et « Occident » prennent une majuscule comme désignations de vastes régions.
