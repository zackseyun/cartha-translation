revisions:
- from: Après avoir porté des chaînes à sept reprises, avoir été chassé en exil et lapidé, et être devenu un messager tant en Orient qu’en Occident, il reçut la noble renommée que lui valut sa foi.
  to: Après avoir porté des chaînes à sept reprises, avoir été contraint à l’exil, avoir été lapidé et être devenu un héraut tant en Orient qu’en Occident, il reçut la noble renommée de sa foi.
  rationale: La révision évite d’imposer une relation causale au génitif grec et emploie un équivalent plus précis pour κῆρυξ. Elle maintient la structure participiale, la portée historique et le ton digne du texte source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:48Z'
review_pass:
  verdict: revise
  source_fidelity: La série des participes, le nombre « sept fois », l’exil, la lapidation et l’extension géographique sont bien rendus. Toutefois, « que lui valut sa foi » tranche en faveur d’un génitif causal là où le grec τὸ ... τῆς πίστεως αὐτοῦ κλέος permet plus sobrement de qualifier la renommée comme celle de sa foi. « Héraut » rend aussi plus précisément κῆρυξ, terme de proclamation publique.
  naturalness: La phrase révisée demeure fluide dans un registre moderne et soutenu. « Être contraint à l’exil » exprime clairement le passif φυγαδευθείς sans l’expression un peu lourde « chassé en exil ».
  terminology: « Héraut » est retenu pour κῆρυξ afin de préserver la fonction de proclamateur public; « messager » est plus général. « Noble renommée de sa foi » conserve l’ambiguïté syntaxique du génitif grec sans ajout interprétatif.
  issues:
  - severity: medium
    issue: Le lien entre la foi et la renommée est rendu comme explicitement causal.
    rationale: « La noble renommée que lui valut sa foi » interprète τῆς πίστεως αὐτοῦ comme indiquant la cause. Le grec peut également caractériser la renommée comme appartenant à sa foi; il convient de ne pas résoudre cette nuance.
  - severity: low
    issue: « Messager » affaiblit la valeur de κῆρυξ.
    rationale: κῆρυξ désigne un héraut ou proclamateur public. « Héraut » préserve cette fonction plus exactement, tout en restant intelligible dans ce registre.
  revised_text: Après avoir porté des chaînes à sept reprises, avoir été contraint à l’exil, avoir été lapidé et être devenu un héraut tant en Orient qu’en Occident, il reçut la noble renommée de sa foi.
  revised_footnotes: []
