id: 1CLEM.5.4
reference: 1 Clement 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: fr
  text: Pierre, qui, à cause d’une jalousie injuste, endura non pas une ou deux, mais de nombreuses souffrances, se rendit ainsi, après avoir rendu témoignage, au lieu de gloire qui lui revenait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλον ἄδικον
  choice: une jalousie injuste
  rationale: « Jalousie » rend ici naturellement le sens négatif de ζῆλος, tandis que « injuste » conserve explicitement ἄδικον.
- source_word: πλείονας ... πόνους
  choice: de nombreuses souffrances
  rationale: Dans ce contexte de persécution et d’endurance, πόνοι désigne des peines ou souffrances plutôt que de simples travaux.
- source_word: μαρτυρήσας
  choice: après avoir rendu témoignage
  rationale: Cette formulation préserve le sens premier de « témoigner » ainsi que sa possible résonance de martyre, sans décider explicitement entre les deux.
- source_word: τὸν ὀφειλόμενον τόπον τῆς δόξης
  choice: au lieu de gloire qui lui était destiné
  rationale: Cette formulation garde la construction « lieu de gloire » et rend ὀφειλόμενον de façon idiomatique, sans suggérer trop fortement un mérite personnel.
theological_decisions:
- issue: 'Le sens de μαρτυρήσας : témoignage ou martyre'
  choice: « après avoir rendu témoignage »
  alternative: « après avoir subi le martyre »
  rationale: Le grec peut évoquer le martyre dans ce contexte, mais son sens lexical demeure « rendre témoignage » ; la traduction conserve cette tension.
- issue: La portée de ὀφειλόμενον appliqué au lieu de gloire
  choice: « qui lui était destiné »
  alternative: « qui lui était dû »
  rationale: « Destiné » exprime l’idée d’un lieu assigné ou attendu sans introduire une affirmation doctrinale plus nette selon laquelle la gloire aurait été gagnée comme un salaire.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le mouvement rhétorique du grec (« non pas une ou deux, mais… ») tout en utilisant une ponctuation naturelle.
