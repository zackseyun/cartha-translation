id: 1CLEM.5.1
reference: 1 Clement 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀλλʼ ἵνα τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα, ἔλθωμεν ἐπὶ τοὺς ἔγγιστα γενομένους ἀθλητάς· λάβωμεν τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
translation:
  language: fr
  text: Mais, pour laisser de côté les exemples anciens, venons-en aux athlètes qui ont vécu à une époque toute proche de la nôtre. Prenons les nobles exemples de notre génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παυσώμεθα
  choice: laisser de côté
  rationale: Dans cette construction avec le génitif, le verbe indique que l’auteur cesse d’évoquer les exemples anciens pour passer à des figures plus récentes. « Laisser de côté » exprime naturellement cette transition en français.
- source_word: ἀθλητάς
  choice: athlètes
  rationale: Le terme grec présente ces personnes comme des concurrents engagés dans une épreuve. Le maintien de l’image d’« athlètes » préserve la métaphore sans préciser indûment la nature de leur combat.
- source_word: τοὺς ἔγγιστα γενομένους
  choice: qui ont vécu à une époque toute proche de la nôtre
  rationale: La proximité est ici temporelle, par contraste avec les exemples anciens. Cette formulation explicite ce rapport de manière naturelle sans identifier davantage les personnes visées.
- source_word: τὰ γενναῖα ὑποδείγματα
  choice: les nobles exemples
  rationale: « Nobles » rend la valeur morale de γενναῖα, tandis que « exemples » reprend ὑποδείγματα et conserve la répétition avec la première proposition.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La métaphore sportive du grec est conservée, ainsi que la répétition d’« exemples ». La syntaxe est légèrement déployée pour rendre clairement la proximité temporelle.
