  text: τὸ μεγαλεῖον τῆς καλλονῆς αὐτοῦ τίς ἀρκετὸς ἐξειπεῖν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/003.yaml
  text: Who is sufficient to declare the majesty of his beauty?[a]
translation:
  language: fr
  text: Qui est capable d’exprimer la majesté[a] de sa beauté ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la grandeur ».'
    reason: μεγαλεῖον peut exprimer la majesté, la magnificence ou la grandeur.
lexical_decisions:
- source_word: μεγαλεῖον
  choice: majesté
  rationale: Le terme désigne ici la grandeur éclatante, la magnificence ou la majesté ; « majesté » convient au registre rhétorique élevé de la phrase.
- source_word: ἀρκετός
  choice: capable
  rationale: Dans cette construction avec l’infinitif, le mot signifie « à la hauteur », « capable » ou « suffisant pour ». « Capable » est naturel en français moderne sans affaiblir la question rhétorique.
- source_word: ἐξειπεῖν
  choice: exprimer
  rationale: Le verbe signifie dire pleinement, exposer ou décrire. « Exprimer » rend bien l’idée de parvenir à mettre cette beauté en paroles.
- source_word: καλλονῆς
  choice: beauté
  rationale: Le substantif désigne la beauté, avec une nuance élevée qui s’accorde avec « majesté ».
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif grec est au masculin singulier. En français, « sa » s’accorde avec « beauté » et conserve naturellement la référence du possesseur sans imposer une explicitation absente du verset.
theological_decisions:
- issue: Référent du possessif αὐτοῦ
  choice: Conserver le possessif « sa » sans nommer son référent
  alternative: Expliciter par « la beauté de celui-ci » ou identifier le possesseur
  rationale: Le verset isolé ne nomme pas explicitement le référent du pronom. Le français permet de préserver cette dépendance au contexte sans introduire une interprétation théologique.
translation_notes:
  register: Question rhétorique concise, élevée et naturelle. L’ordre français maintient l’enchaînement grec entre majesté et beauté, tandis que le possessif reste volontairement non explicité.
