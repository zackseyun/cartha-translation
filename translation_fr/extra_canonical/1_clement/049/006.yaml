id: 1CLEM.49.6
reference: 1 Clement 49:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
translation:
  language: fr
  text: Dans son amour, le Maître nous a accueillis ; à cause de l’amour qu’il avait pour nous, Jésus le Messie, notre Seigneur, a donné son sang pour nous selon la volonté de Dieu, sa chair pour notre chair et son âme pour nos âmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa vie pour nos vies ».'
    reason: ψυχή peut signifier « âme » ou « vie » ; la note préserve cette ambiguïté lexicale réelle.
lexical_decisions:
- source_word: ἐν ἀγάπῃ
  choice: Dans son amour
  rationale: Rend naturellement la sphère ou la motivation exprimée par ἐν, sans réduire ἀγάπη à un simple sentiment.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Préserve l’idée d’autorité souveraine de δεσπότης dans un français digne et accessible.
- source_word: προσελάβετο
  choice: nous a accueillis
  rationale: Le verbe signifie recevoir ou accueillir auprès de soi ; « accueillis » convient ici mieux que le plus vague « reçus ».
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Χριστός est rendu comme le titre « Messie », tout en respectant l’ordre grec du nom et du titre.
- source_word: ἐν θελήματι θεοῦ
  choice: selon la volonté de Dieu
  rationale: Expression française naturelle qui conserve l’idée que le don s’accomplit conformément à la volonté divine.
- source_word: ψυχή
  choice: âme
  rationale: Le parallélisme délibéré entre chair/chair et âme/âmes favorise ici le sens anthropologique « âme », même si ψυχή peut aussi désigner la vie.
theological_decisions:
- issue: Sens de ψυχή dans la formule sacrificielle finale
  choice: son âme pour nos âmes
  alternative: sa vie pour nos vies
  rationale: Le contexte sacrificiel autorise « vie », mais la construction strictement parallèle σάρκα…σαρκός / ψυχὴν…ψυχῶν met en relief deux termes anthropologiques. Le texte principal conserve donc cette symétrie sans exclure l’autre sens possible.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le grec emploie le titre Χριστός après le nom Jésus. « Le Messie » en explicite la valeur titulaire sans ajouter de particularité confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la solennité et les parallélismes du grec, avec un point-virgule pour rendre clairement l’enchaînement argumentatif.
