id: 1CLEM.49.1
reference: 1 Clement 49:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἔχων ἀγάπην ἐν Χριστῷ ποιησάτω τὰ τοῦ Χριστοῦ παραγγέλματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/001.yaml
  text: Whoever has love in the Messiah, let him do the Messiah’s commandments.
translation:
  language: fr
  text: Que celui qui a de l’amour en Christ mette en pratique les commandements du Christ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἔχων
  choice: celui qui a
  rationale: Rend naturellement en français le participe substantivé grec tout en conservant sa portée générale.
- source_word: ἀγάπην ἐν Χριστῷ
  choice: de l’amour en Christ
  rationale: Préserve la formulation relationnelle et potentiellement riche de ἐν Χριστῷ sans la réduire à « amour pour Christ ».
- source_word: ποιησάτω
  choice: mette en pratique
  rationale: L’impératif aoriste de ποιέω signifie ici accomplir ou observer; « mettre en pratique » est idiomatique avec des commandements.
- source_word: τὰ τοῦ Χριστοῦ παραγγέλματα
  choice: les commandements du Christ
  rationale: Rend directement le génitif grec et παράγγελμα dans un registre clair et digne.
theological_decisions:
- issue: Sens de ἐν Χριστῷ
  choice: en Christ
  alternative: pour Christ / dans le Christ
  rationale: La traduction littérale maintient l’ambiguïté entre une sphère d’existence, une communion avec Christ et un amour vécu en relation avec lui.
- issue: Titre Χριστός
  choice: Christ
  alternative: Messie
  rationale: Dans ce contexte chrétien ancien, « Christ » est la désignation française conventionnelle et reproduit la répétition du grec sans imposer une reformulation interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Christ » est conservée comme dans le grec; aucun marqueur de note n’est requis.
