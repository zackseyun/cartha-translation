  to: L’amour nous unit à Dieu ; l’amour couvre une multitude de péchés ; l’amour supporte tout, il se montre patient en tout. Il n’y a rien de grossier dans l’amour, rien d’orgueilleux. L’amour ne connaît pas la division ; l’amour ne fomente pas de dissensions ; l’amour fait tout dans la concorde. C’est dans l’amour que tous ceux que Dieu a choisis ont été rendus parfaits ; sans l’amour, rien n’est agréable à Dieu.
  rationale: La révision conserve le rythme et les choix lexicaux solides du projet, tout en rétablissant le passif de ἐτελειώθησαν. « Ont été rendus parfaits » est le rendu français le plus direct du verbe, dont la portée exacte reste non explicitée. La légère amélioration de style pour μακροθυμεῖ maintient le parallélisme avec « supporte tout ».
