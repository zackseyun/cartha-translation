id: 1CLEM.49.5
reference: 1 Clement 49:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: fr
  text: L’amour nous unit à Dieu ; l’amour couvre une multitude de péchés ; l’amour supporte tout, il se montre patient en tout. Il n’y a rien de grossier dans l’amour, rien d’orgueilleux. L’amour ne connaît pas la division ; l’amour ne fomente pas de dissensions ; l’amour fait tout dans la concorde. C’est dans l’amour que tous ceux que Dieu a choisis ont été rendus parfaits ; sans l’amour, rien n’est agréable à Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: l’amour
  rationale: Rend naturellement le terme grec central et conserve sa répétition rhétorique.
- source_word: κολλᾷ
  choice: unit
  rationale: Exprime l’attachement étroit à Dieu impliqué par le verbe, sans la lourdeur de « colle ».
- source_word: καλύπτει
  choice: couvre
  rationale: Traduction directe qui maintient l’écho scripturaire de la formule « couvre une multitude de péchés ».
- source_word: ἀνέχεται
  choice: supporte
  rationale: Restitue l’idée d’endurer ou de porter patiemment toutes choses.
- source_word: μακροθυμεῖ
  choice: use de patience
  rationale: Rend la patience prolongée du verbe grec tout en conservant le parallélisme avec πάντα.
- source_word: βάναυσον
  choice: grossier
  rationale: Le terme dénonce ce qui est vulgaire, bas ou indigne ; « grossier » demeure naturel sans surinterpréter.
- source_word: σχίσμα
  choice: division
  rationale: Rend le sens de rupture ou de scission en français courant.
- source_word: στασιάζει
  choice: ne fomente pas de dissensions
  rationale: Exprime l’action séditieuse ou factieuse du verbe plutôt qu’un simple désaccord.
- source_word: ὁμονοίᾳ
  choice: concorde
  rationale: Conserve l’idée d’unité d’esprit et d’accord collectif dans un registre digne.
- source_word: ἐτελειώθησαν
  choice: sont parvenus à l’accomplissement
  rationale: Préserve la notion de perfection ou d’achèvement sans imposer l’idée d’une perfection morale absolue.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: ceux que Dieu a choisis
  rationale: Formulation moderne et claire correspondant au sens de « les élus de Dieu ».
theological_decisions:
- issue: Sens de ἐτελειώθησαν
  choice: sont parvenus à l’accomplissement
  alternative: ont été rendus parfaits
  rationale: La formulation retenue garde ouverte la portée du passif et de l’accomplissement sans suggérer nécessairement une impeccabilité morale.
- issue: Portée de « l’amour couvre une multitude de péchés »
  choice: conserver littéralement « couvre »
  alternative: « fait pardonner » ou « efface »
  rationale: Le grec ne précise ni l’agent ni le mécanisme du pardon ; une traduction interprétative résoudrait indûment cette ambiguïté théologique.
- issue: Élection divine
  choice: ceux que Dieu a choisis
  alternative: les élus de Dieu
  rationale: La formulation explicite le rapport à Dieu sans développer une doctrine particulière de l’élection.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition insistante de « l’amour » et les parallélismes du grec sont conservés. La ponctuation découpe les affirmations sans atténuer leur rythme exhortatif.
