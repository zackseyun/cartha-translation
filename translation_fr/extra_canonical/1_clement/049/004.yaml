  yaml_path: translation/extra_canonical/1_clement/049/004.yaml
  text: The height to which love leads is beyond telling.
translation:
  language: fr
  text: La hauteur à laquelle conduit l’amour est indicible.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ὕψος
  choice: La hauteur
  rationale: Rend directement l’image spatiale du grec sans l’expliciter en « sommet » ou en « élévation ».
- source_word: εἰς ὃ ἀνάγει
  choice: où conduit
  rationale: Exprime le mouvement vers un point élevé contenu dans ἀνάγει, tout en évitant d’ajouter un complément comme « nous », absent du grec.
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: Équivalent français naturel et non confessionnel de ἀγάπη dans ce contexte.
- source_word: ἀνεκδιήγητόν ἐστιν
  choice: est indicible
  rationale: Rend de façon concise ce qui ne peut être raconté ou exprimé pleinement.
theological_decisions:
- issue: Complément implicite du verbe ἀνάγει
  choice: Ne pas ajouter « nous »
  alternative: « La hauteur à laquelle l’amour nous élève »
  rationale: Le grec ne précise pas l’objet de l’action; la formulation retenue préserve cette absence sans rendre la phrase artificielle.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve l’image de la hauteur et le caractère absolu de l’affirmation grecque.
