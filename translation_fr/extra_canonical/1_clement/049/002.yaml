  text: Qui peut décrire[a] le lien de l’amour de Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expliquer ».
    reason: Signale un autre sens possible de ἐξηγήσασθαι, tandis que « décrire » rend mieux la portée rhétorique dans le contexte.
lexical_decisions:
- source_word: δεσμόν
  choice: lien
  rationale: Le terme désigne ce qui attache ou unit; « lien » conserve ici l’image relationnelle sans alourdir la phrase.
- source_word: ἀγάπης
  choice: amour
  rationale: Équivalent français naturel et digne dans ce contexte d’éloge.
- source_word: ἐξηγήσασθαι
  choice: décrire
  rationale: Le verbe peut signifier exposer, raconter, expliquer ou décrire. « Décrire » convient à la question rhétorique et à la progression expressive du contexte immédiat.
theological_decisions:
- issue: Valeur du génitif dans τῆς ἀγάπης τοῦ θεοῦ
  choice: l’amour de Dieu
  alternative: l’amour que Dieu nous porte / l’amour que nous portons à Dieu
  rationale: Le grec peut désigner l’amour venant de Dieu, l’amour dirigé vers Dieu, ou laisser résonner les deux sens. La formulation française conserve cette ambiguïté sans imposer une interprétation théologique.
translation_notes:
  register: Français moderne, sobre et digne. La question rhétorique et l’image du lien sont conservées; la syntaxe reste immédiatement compréhensible.
