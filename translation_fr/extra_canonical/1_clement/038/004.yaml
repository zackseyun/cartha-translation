id: 1CLEM.38.4
reference: 1 Clement 38:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες, ὀφείλομεν κατὰ πάντα εὐχαριστεῖν αὐτῷ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: fr
  text: Ainsi donc, puisque nous tenons de lui toutes ces choses, nous devons lui rendre grâce en toute chose. À lui soit la gloire pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες
  choice: Ainsi donc, puisque nous tenons de lui toutes ces choses
  rationale: La proposition participiale causale est rendue naturellement par « puisque ». « Tenir de lui » exprime avec dignité l’origine indiquée par ἐξ αὐτοῦ, tandis que « ainsi donc » conserve la portée conclusive de οὖν.
- source_word: κατὰ πάντα εὐχαριστεῖν αὐτῷ
  choice: lui rendre grâce en toute circonstance
  rationale: « Rendre grâce » convient au registre religieux de εὐχαριστεῖν. κατὰ πάντα peut signifier sous tous les rapports ou en toute circonstance; cette formulation française reste naturelle sans restreindre l’idée à une simple manière d’agir.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Formule française traditionnelle et intelligible qui reproduit l’intensification sémitisante de l’expression grecque plutôt que de l’aplatir en un simple « pour toujours ».
theological_decisions:
- issue: Référent du pronom αὐτός dans « de lui », « lui rendre grâce » et « à lui soit la gloire »
  choice: Conserver les pronoms sans expliciter le référent
  alternative: Remplacer les pronoms par « Dieu »
  rationale: Le verset grec emploie uniquement des pronoms; nommer explicitement Dieu lèverait une référence que le contexte établit sans que ce verset la formule.
- issue: Valeur de la doxologie ᾧ ἡ δόξα
  choice: « À lui soit la gloire »
  alternative: « à qui appartient la gloire »
  rationale: Le grec est elliptique et peut être compris comme une acclamation ou une affirmation. La formule optative française préserve le caractère doxologique sans ajouter de verbe explicatif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement déployée en deux phrases pour une lecture naturelle, tout en conservant la conclusion, l’action de grâce et la doxologie du grec.
