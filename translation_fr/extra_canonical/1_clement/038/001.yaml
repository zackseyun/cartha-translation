  naturalness: La formulation révisée reste digne et lisible en français moderne. La finale conserve volontairement une certaine densité, car elle reflète une construction grecque elliptique; la note en explicite les limites sans la résoudre artificiellement.
  terminology: « Christ Jésus », « préservé », « se soumette », « prochain » et « don » rendent avec justesse Χριστῷ Ἰησοῦ, σωζέσθω, ὑποτασσέσθω, πλησίον et χάρισμα. « Don » évite de surcharger χαρίσμα d’une interprétation confessionnelle.
