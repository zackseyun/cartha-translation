  rationale: La révision retire les précisions non exprimées dans la clause finale et rétablit le comparatif « comme ». Elle conserve le choix défendable de « préservé » pour σωζέσθω et maintient les ancres de notes sur les deux expressions où une alternative ou une explication est utile.
