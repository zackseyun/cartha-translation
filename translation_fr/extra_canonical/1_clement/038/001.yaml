source:
  edition: Funk 1901 (normalized OCR)
  text: Συνξέσϑω οὖν ἡμῶν ὅλον τὸ σῶμα ἐν Χριστῷ Ἰησοῦ, καὶ ὑποτασσέσϑω ἕκαστος τῷ πλησίον αὐτοῦ, καϑὼς ἐτέϑη ἐν τῷ χαρίσματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
translation:
  language: fr
  text: Que notre corps tout entier soit donc préservé dans le Christ Jésus[a], et que chacun se soumette à son prochain, comme il a été placé dans son don[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soit sauvé dans le Christ Jésus ».'
    reason: σωζέσθω peut signifier être sauvé ou être préservé; « préservé » convient au corps communautaire sans exclure la portée salvifique du verbe.
  - marker: b
    text: 'Littéralement : « comme il a été placé dans son don ». Le grec ne précise ni l’auteur de cette mise en place ni la nature du don.'
    reason: La formulation conserve l’ellipse et l’ambiguïté de καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ, sans ajouter que le don a été reçu ni transformer le comparatif en critère normatif.
lexical_decisions:
- source_word: 'Σωζέσθω (OCR : Συνξέσϑω)'
  choice: soit préservé
  rationale: La leçon grecque reconnue est σωζέσθω, « qu’il soit sauvé/préservé ». « Soit préservé » convient au corps communautaire sans réduire le verbe à la seule cohésion.
- source_word: ὅλον τὸ σῶμα
  choice: notre corps tout entier
  rationale: Rend directement l’image collective du corps et conserve le possessif exprimé par ἡμῶν.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus Christ
  rationale: Formulation française naturelle qui conserve l’expression d’union ou de sphère portée par ἐν.
- source_word: ὑποτασσέσθω
  choice: se soumette
  rationale: Le moyen/passif impératif exprime ici le fait de se placer sous l’autorité ou dans l’ordre relatif à autrui.
- source_word: τῷ πλησίον αὐτοῦ
  choice: à son prochain
  rationale: Équivalent idiomatique et précis de πλησίον dans ce contexte.
- source_word: καθὼς ἐτέθη ἐν τῷ χαρίσματι αὐτοῦ
  choice: selon la place qui lui a été assignée conformément au don qu’il a reçu
  rationale: Explicite en français l’idée elliptique d’être « placé/assigné » selon son χάρισμα, sans identifier la nature exacte du don.
theological_decisions:
- issue: Sens de σωζέσθω appliqué au corps communautaire
  choice: soit préservé
  alternative: soit sauvé
  rationale: « Préservé » maintient le sens de sauvegarde du verbe tout en convenant naturellement à l’exhortation ecclésiale; une note conserve la traduction plus littérale « sauvé ».
- issue: Rapport entre la place assignée et le χάρισμα
  choice: une place assignée conformément au don reçu
  alternative: être établi dans son don
  rationale: Le grec est condensé. Cette formulation française rend le lien entre position et don sans préciser abusivement qui assigne la place ni imposer une doctrine particulière des charismes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exhortative et l’image collective du corps sont conservées; l’expression grecque finale, très condensée, est légèrement explicitée dans le texte et documentée en note.
