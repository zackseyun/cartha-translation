source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
translation:
  language: fr
  text: Que le fort prenne soin du faible, et que le faible respecte le fort. Que le riche pourvoie aux besoins du pauvre, et que le pauvre remercie Dieu de lui avoir donné quelqu’un par qui son manque puisse être comblé. Que le sage manifeste sa sagesse, non par des paroles, mais par de bonnes œuvres. Que celui qui est humble ne témoigne pas en sa propre faveur, mais qu’il laisse un autre témoigner pour lui. Que celui qui est pur dans sa chair ne s’en vante pas, sachant que c’est un autre qui lui accorde la maîtrise de soi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμελείσϑω
  choice: prenne soin de
  rationale: Rend naturellement l’idée de veiller avec sollicitude sur quelqu’un.
- source_word: ἐντρεπέσϑω
  choice: respecte
  rationale: Dans ce contexte relationnel, le moyen exprime le respect ou la déférence envers le fort.
- source_word: ἐπιχορηγείτω
  choice: pourvoie aux besoins de
  rationale: Exprime la fourniture généreuse de ce qui est nécessaire, avec un complément français naturel.
- source_word: ὑστέρημα
  choice: manque
  rationale: Conserve l’idée concrète de ce qui fait défaut, sans la limiter à la pauvreté matérielle.
- source_word: ταπεινοφρονῶν
  choice: celui qui est humble
  rationale: Formulation courante et digne pour la disposition d’humilité.
- source_word: ἁγνὸς ἐν τῇ σαρκί
  choice: pur dans sa conduite corporelle
  rationale: Évite le calque obscur « pur dans la chair » tout en maintenant la référence à la pureté vécue dans le corps.
- source_word: ἐγκράτειαν
  choice: maîtrise de soi
  rationale: Rend le sens général de retenue et de contrôle de soi, probablement à portée sexuelle dans ce contexte.
theological_decisions:
- issue: Référent de ἕτερος dans la dernière proposition
  choice: un autre
  alternative: Dieu
  rationale: Le grec dit explicitement « un autre » sans nommer Dieu; la traduction conserve cette formulation et son implication théologique sans l’expliciter.
- issue: Agent donné au pauvre dans la proposition ὅτι ἔδωκεν αὐτῷ, ᾧ...
  choice: quelqu’un par qui son manque puisse être comblé
  alternative: les moyens de combler son manque
  rationale: Le pronom relatif au datif désigne vraisemblablement une personne, en contexte le riche; cette formulation conserve toutefois l’indétermination du grec.
translation_notes:
  register: Français moderne international, exhortatif et digne. Les impératifs grecs à la troisième personne sont rendus par « Que… ». La répétition structurante entre fort/faible, riche/pauvre et paroles/œuvres est préservée.
