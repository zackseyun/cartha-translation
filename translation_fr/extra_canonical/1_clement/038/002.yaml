    issue: « pur dans sa conduite corporelle » pour ὁ ἁγνὸς ἐν τῇ σαρκί
    rationale: Le grec dit littéralement « celui qui est pur dans la chair ». « Conduite corporelle » transforme le complément en explication éthique et réduit/interprète une formulation que le texte laisse plus concise. « Pur dans sa chair » préserve mieux la terminologie et l'ambiguïté de portée.
