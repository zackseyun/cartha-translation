source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
translation:
  language: fr
  text: Réfléchissons donc, frères, de quelle matière nous avons été faits, quels et qui nous étions lorsque nous sommes entrés dans le monde, de quel tombeau et de quelles ténèbres celui qui nous a façonnés et créés nous a fait entrer dans son monde, ayant préparé ses bienfaits avant notre naissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλογισώμεθα
  choice: Réfléchissons
  rationale: Rend naturellement l’exhortation à considérer attentivement ou à méditer.
- source_word: ὕλης
  choice: matière
  rationale: Conserve le sens concret de la substance ou matière dont les êtres humains ont été faits.
- source_word: ποῖοι καὶ τίνες
  choice: ce que nous étions et à quelle sorte de personnes nous étions
  rationale: Maintient la double interrogation grecque portant à la fois sur l’état ou la nature et sur la qualité des personnes, sans la réduire à une seule formule.
- source_word: τάφου καὶ σκότους
  choice: tombeau et ténèbres
  rationale: Traduction directe de l’image forte du tombeau et de l’obscurité.
- source_word: ὁ πλάσας ἡμᾶς καὶ δημιουργήσας
  choice: celui qui nous a façonnés et créés
  rationale: Préserve les deux verbes complémentaires exprimant la formation et la création.
- source_word: εὐεργεσίας
  choice: bienfaits
  rationale: Le terme désigne des actes de bienfaisance ou des bénéfices accordés; «bienfaits» conserve mieux cette nuance que «dons».
theological_decisions:
- issue: Référent de l’image du tombeau et des ténèbres
  choice: Conserver l’image sans l’expliquer
  alternative: L’interpréter explicitement comme le sein maternel ou comme la non-existence
  rationale: Le texte ne précise pas lui-même le référent; une traduction ne doit pas résoudre cette tension anthropologique.
- issue: Sujet créateur
  choice: «celui qui nous a façonnés et créés»
  alternative: Nommer explicitement Dieu
  rationale: Le grec emploie des participes substantivés sans nommer ici le sujet; la formulation retenue respecte cette expression.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe ample de l’original est conservée tout en étant structurée par des reprises de «à». Aucun marqueur de note n’est requis, car aucune variante n’appelle ici une note indispensable.
