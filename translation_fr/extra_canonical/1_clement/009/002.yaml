  yaml_path: translation/extra_canonical/1_clement/009/002.yaml
  text: Let us fix our gaze on those who served perfectly in his majestic glory.
translation:
  language: fr
  text: Portons notre regard sur ceux qui se sont pleinement mis au service de sa gloire majestueuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Portons notre regard
  rationale: Rend l’exhortation à regarder avec une attention soutenue dans un français naturel et digne.
- source_word: τοὺς τελείως λειτουργήσαντας
  choice: ceux qui ont servi parfaitement
  rationale: λειτουργέω désigne ici l’accomplissement d’un service; «servi» reste naturel et évite de restreindre indûment le sens à un ministère cultuel. τελείως est conservé explicitement par «parfaitement».
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  choice: sa gloire majestueuse
  rationale: Le datif peut marquer l’objet ou le bénéficiaire du service. La formulation française directe conserve l’idée qu’ils se sont mis au service de sa gloire, sans ajouter une préposition locative absente du grec.
theological_decisions:
- issue: Rapport entre le service et la gloire divine
  choice: «ont servi parfaitement sa gloire majestueuse»
  alternative: «ont parfaitement servi dans sa gloire majestueuse»
  rationale: Le datif grec est susceptible de plusieurs nuances. La traduction retenue comprend la gloire comme ce que ces personnes ont servi, tout en évitant d’expliciter davantage une relation théologique que le texte ne précise pas.
translation_notes:
  register: Français moderne international, exhortatif et digne. «Portons notre regard» est idiomatique sans être familier; «gloire majestueuse» préserve la solennité de μεγαλοπρεπής.
