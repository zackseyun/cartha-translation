review_pass:
  verdict: revise
  source_fidelity: Le sens exhortatif de ἀτενίσωμεν et l’idée d’un service accompli pleinement (τελείως λειτουργήσαντας) sont bien visés. Toutefois, « servir sa gloire » force en français une construction transitive peu naturelle et présente la gloire comme un objet direct personnellement servi. La relation du datif τῇ ... δόξῃ demeure nuancée; « au service de » la rend idiomatiquement sans surinterprétation doctrinale.
  naturalness: « Portons notre regard » convient au registre. « ont servi parfaitement sa gloire majestueuse » n’est pas une collocation naturelle en français moderne. « se sont pleinement mis au service de sa gloire majestueuse » est fluide, solennel et garde l’accent sur le dévouement au service.
  terminology: « gloire majestueuse » rend fidèlement μεγαλοπρεπής δόξα. « pleinement » exprime naturellement τελείως dans ce contexte sans suggérer une perfection abstraite ou sans faute. Aucun nom propre ni terme théologique technique ne requiert de note.
  issues:
  - severity: medium
    issue: Construction française de « servir sa gloire »
    rationale: Bien que le grec emploie le datif après λειτουργέω, le français « servir sa gloire » est syntaxiquement et sémantiquement raide. La tournure risque de paraître calquée et d’obscurcir le lien entre le service et la gloire.
