- from: Portons notre regard sur ceux qui ont servi parfaitement sa gloire majestueuse.
  to: Portons notre regard sur ceux qui se sont pleinement mis au service de sa gloire majestueuse.
  rationale: La révision remplace la construction transitive non idiomatique par « se mettre au service de », qui préserve l’idée de λειτουργέω et rend avec souplesse la relation indiquée par le datif. « Pleinement » restitue la portée adverbiale de τελείως dans un français plus naturel.
