id: 1CLEM.9.1
reference: 1 Clement 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
translation:
  language: fr
  text: Ainsi, obéissons à sa volonté majestueuse et glorieuse ; devenus des suppliants pour obtenir sa miséricorde et sa bonté[a], prosternons-nous devant lui et tournons-nous vers sa compassion, en abandonnant les efforts stériles, les querelles et la jalousie[b] qui mène à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devenus les suppliants de sa miséricorde et de sa bonté ».
    reason: Le génitif grec peut être reproduit formellement, bien qu'il indique probablement ici ce que les suppliants cherchent à obtenir.
  - marker: b
    text: Ou « le zèle » ; le mot grec peut désigner une ardeur intense, favorable ou jalouse selon le contexte.
    reason: Le terme ζῆλος possède une ambiguïté réelle que le contexte oriente vers un sens négatif sans l'abolir entièrement.
lexical_decisions:
- source_word: βουλήσει
  choice: volonté
  rationale: Le terme désigne ici la volonté ou le dessein de Dieu. « Volonté » est naturel en français et conserve l'appel à lui obéir.
- source_word: μεγαλοπρεπεῖ
  choice: majestueuse
  rationale: Rend la grandeur et la magnificence exprimées par l'adjectif dans un registre digne et courant.
- source_word: ἱκέται
  choice: suppliants
  rationale: Conserve l'image de personnes qui implorent humblement une faveur, plutôt que de réduire le terme à une simple demande.
- source_word: προσπέσωμεν
  choice: prosternons-nous devant lui
  rationale: Exprime naturellement le geste de se jeter ou de tomber devant quelqu'un en signe d'humble supplication.
- source_word: οἰκτιρμοὺς
  choice: compassions
  rationale: Le pluriel inhabituel du grec est conservé afin de laisser entendre les manifestations multiples de la compassion divine.
- source_word: ματαιοπονίαν
  choice: efforts stériles
  rationale: Rend l'idée d'un labeur vain, sans fruit, dans une formulation française immédiatement compréhensible.
- source_word: ζῆλος
  choice: jalousie
  rationale: Dans cette série de comportements condamnés et avec la précision « qui mène à la mort », le sens négatif de rivalité jalouse convient le mieux ; l'ambiguïté lexicale est signalée en note.
theological_decisions:
- issue: Valeur des génitifs τοῦ ἐλέους καὶ τῆς χρηστότητος après ἱκέται
  choice: des suppliants pour obtenir sa miséricorde et sa bonté
  alternative: les suppliants de sa miséricorde et de sa bonté
  rationale: Les génitifs peuvent désigner ce qui est imploré. La formulation principale explicite cette valeur objective en français naturel, tandis que la note conserve la construction plus formelle et son ambiguïté.
- issue: Sens de ζῆλος
  choice: jalousie
  alternative: zèle
  rationale: Le contexte associe le mot aux querelles et à la mort, ce qui favorise le sens péjoratif de jalousie ou rivalité ; le sens littéral possible « zèle » demeure indiqué en note.
translation_notes:
  register: Français international moderne, digne et exhortatif. La longue phrase grecque est maintenue avec un point-virgule pour préserver son mouvement logique, tout en restant lisible. Les pluriels et images marqués du texte source sont conservés lorsqu'ils demeurent intelligibles.
