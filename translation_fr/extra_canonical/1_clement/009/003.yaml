    rationale: « Considérons » est interprétatif et un peu moins concret que l’impératif délibératif « Prenons », qui introduit Hénoc comme exemple.
  - severity: low
    issue: Rendu de εὑρεθείς
    rationale: « Ayant été reconnu juste » peut évoquer une déclaration formelle. « Fut trouvé juste » reproduit plus directement le passif grec sans trancher davantage la nuance.
  - severity: low
    issue: Tournure finale
    rationale: « Sa mort ne fut pas trouvée » est grammatical mais raide en français moderne. « On ne trouva pas sa mort » garde la formulation inhabituelle et l’ambiguïté du grec.
