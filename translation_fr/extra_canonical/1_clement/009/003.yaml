- from: 'Considérons Hénoc : ayant été reconnu juste dans l’obéissance, il fut enlevé[a], et sa mort ne fut pas trouvée.'
  to: 'Prenons Hénoc : il fut trouvé juste dans l’obéissance, fut enlevé[a], et l’on ne trouva pas sa mort.'
  rationale: 'La révision rapproche le texte français de la formulation grecque : « Prenons » conserve la force de λάβωμεν, « fut trouvé juste » rend εὑρεθείς sans ajouter une nuance de reconnaissance formelle, et la finale est rendue dans un français plus fluide tout en préservant son caractère expressément non normalisé. La note maintient l’alternative lexicale sans imposer une interprétation doctrinale.'
