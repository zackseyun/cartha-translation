id: 1CLEM.9.3
reference: 1 Clement 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν Ἐνώχ, ὃς ἐν ὑπακοῇ δικαίως εὑρεθεὶς μετετέθη, καὶ οὐχ εὑρέθη αὐτοῦ θάνατος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
translation:
  language: fr
  text: 'Prenons Hénoc : il fut trouvé juste dans l’obéissance, fut enlevé[a], et l’on ne trouva pas sa mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut transféré ».
    reason: Le verbe grec peut signifier « transférer » ou « déplacer » ; dans la tradition relative à Hénoc, « fut enlevé » rend mieux le retrait extraordinaire suggéré par le contexte, sans préciser de destination ni d’agent.
lexical_decisions:
- source_word: λάβωμεν
  choice: Considérons
  rationale: Littéralement « prenons » ; dans cette exhortation introduisant un exemple, « considérons » est naturel en français et conserve la force délibérative de l’impératif grec.
- source_word: ἐν ὑπακοῇ
  choice: dans l’obéissance
  rationale: Conserve la formulation et le lien étroit établi par le grec entre la justice d’Hénoc et son obéissance, sans préciser davantage la relation entre les deux notions.
- source_word: δικαίως εὑρεθείς
  choice: ayant été reconnu juste
  rationale: Rend la construction participiale passive et l’idée d’une constatation favorable. « Reconnu juste » est plus idiomatique que « trouvé justement » tout en préservant le vocabulaire de la justice.
- source_word: μετετέθη
  choice: fut enlevé
  rationale: Dans la tradition biblique d’Hénoc, le passif de μετατίθημι désigne son retrait surnaturel. « Fut enlevé » restitue ce sens sans les connotations administratives modernes de « fut transféré ».
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  choice: sa mort ne fut pas trouvée
  rationale: Maintient l’expression inhabituelle du grec et son écho scripturaire, plutôt que de la normaliser en « il ne mourut pas » et de supprimer sa tension littéraire.
theological_decisions:
- issue: Nature du déplacement d’Hénoc
  choice: fut enlevé
  alternative: fut transféré
  rationale: Le contexte traditionnel suggère un enlèvement surnaturel, mais le texte ne nomme ni destination ni agent ; la traduction n’ajoute donc pas « au ciel » ni « par Dieu ».
- issue: Rapport entre justice et obéissance
  choice: reconnu juste dans l’obéissance
  alternative: reconnu juste parce qu’il obéissait
  rationale: La préposition ἐν ne doit pas être explicitée sans nécessité comme une causalité stricte. La formulation retenue conserve l’ambiguïté théologique du rapport entre justice et obéissance.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe participiale est conservée sans lourdeur excessive, et la formulation insolite concernant la mort reste volontairement proche du grec.
