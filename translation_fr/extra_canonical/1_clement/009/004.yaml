source:
  edition: Funk 1901 (normalized OCR)
  text: Νῶε πιστὸς εὑρεθεὶς διὰ τῆς λειτουργίας αὐτοῦ παλιγγενεσίαν κόσμῳ ἐκήρυξεν, καὶ διέσωσεν δι’ αὐτοῦ ὁ δεσπότης τὰ εἰσελθόντα ἐν ὁμοίᾳ ζῷα εἰς τὴν κιβωτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
translation:
  language: fr
  text: Noé, reconnu fidèle, proclama par son service au monde la régénération ; et, par son intermédiaire, le Souverain préserva les animaux qui entrèrent dans l’arche en harmonie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte vraisemblablement « en concorde » ou « en harmonie » (ὁμονοίᾳ) ; la forme fournie « en semblable » semble résulter d’une erreur de copie ou d’OCR. Il ne dit pas « deux par deux ».
    reason: Signaler la difficulté de la forme transmise tout en évitant d’ajouter un détail du récit de la Genèse absent de la leçon grecque vraisemblable.
lexical_decisions:
- source_word: πιστὸς εὑρεθείς
  choice: reconnu fidèle
  rationale: Rend naturellement l’idée d’avoir été trouvé ou constaté fidèle, sans suggérer que Noé serait devenu fidèle à ce moment-là.
- source_word: λειτουργίας
  choice: service
  rationale: Le terme désigne ici l’accomplissement d’un service ou d’une mission; «service» reste clair et évite de restreindre le sens à la liturgie cultuelle.
- source_word: παλιγγενεσίαν
  choice: la régénération
  rationale: Conserve le sens fort de renaissance ou de renouvellement du monde associé au déluge.
- source_word: ὁ δεσπότης
  choice: le Souverain
  rationale: Préserve la nuance d’autorité souveraine de δεσπότης et évite de l’assimiler automatiquement au titre κύριος.
- source_word: διέσωσεν
  choice: sauva
  rationale: Exprime l’action de faire traverser le danger sain et sauf; le contexte implique aussi la préservation.
- source_word: ζῷα
  choice: les êtres vivants
  rationale: Rend le terme grec général avec naturel; dans le contexte de l’arche, il désigne les animaux.
- source_word: ἐν ὁμονοίᾳ
  choice: en bonne entente
  rationale: Rend l’idée de concorde ou d’harmonie sans ajouter la notion absente de «deux par deux».
theological_decisions:
- issue: Portée de παλιγγενεσία
  choice: la régénération au monde
  alternative: un renouvellement pour le monde
  rationale: La formulation conserve le terme théologiquement chargé et la relation syntaxique au monde, sans préciser au-delà du grec la nature exacte de cette régénération.
- issue: Agent du salut des êtres vivants
  choice: par son intermédiaire, le Souverain sauva
  alternative: le Souverain les préserva grâce à lui
  rationale: Maintient clairement Dieu comme agent principal et Noé comme intermédiaire, conformément à δι’ αὐτοῦ.
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde la structure rhétorique de l’original tout en évitant un calque lourd. «En bonne entente» exprime naturellement la concorde attribuée aux êtres vivants.
