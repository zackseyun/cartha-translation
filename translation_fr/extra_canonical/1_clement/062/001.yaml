id: 1CLEM.62.1
reference: 1 Clement 62:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: fr
  text: Pour ce qui est des questions qui concernent notre religion et qui sont des plus utiles à une vie vertueuse pour ceux qui veulent conduire leur vie avec piété et justice, nous vous avons écrit suffisamment, frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρησκείᾳ
  choice: religion
  rationale: Le terme désigne ici la pratique ou la vie religieuse; « religion » conserve la portée générale du grec sans introduire une coloration confessionnelle particulière.
- source_word: ἐνάρετον βίον
  choice: une vie vertueuse
  rationale: Rend directement l’idée d’une vie caractérisée par la vertu dans un français naturel et digne.
- source_word: διευθύνειν
  choice: conduire leur vie
  rationale: Le verbe évoque le fait de diriger ou régler sa conduite; la reprise de « leur vie » explicite naturellement en français le complément suggéré par le contexte.
- source_word: εὐσεβῶς καὶ δικαίως
  choice: avec piété et justice
  rationale: Préserve les deux dimensions distinctes, religieuse et morale, exprimées par les adverbes grecs.
- source_word: ἄνδρες ἀδελφοί
  choice: frères
  rationale: Formule d’adresse idiomatique; le français « frères » restitue naturellement l’apostrophe sans le littéralisme pesant « hommes frères ».
theological_decisions: []
