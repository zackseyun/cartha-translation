source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
translation:
  language: fr
  text: Et nous vous avons rappelé ces choses d’autant plus que nous savions bien que nous nous adressions à des hommes fidèles, très estimés et attentifs aux paroles de l’instruction de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπενήγκαμεν (OCR; probablement ὑπεμνήσαμεν)
  choice: nous vous avons rappelé
  rationale: La leçon attendue ὑπεμνήσαμεν signifie « rappeler » et reprend le vocabulaire du verset précédent; la forme transmise ici paraît être une erreur d’OCR de l’édition.
- source_word: τοσούτῳ μᾶλλον
  choice: avec d’autant plus d’insistance
  rationale: Exprime le renforcement marqué par le comparatif, tout en donnant une formulation française naturelle.
- source_word: ἐλλογιμωτάτοις
  choice: tenus en très haute estime
  rationale: Rend le superlatif et la haute considération attachée aux destinataires sans suggérer seulement leur érudition.
- source_word: ἐγκεχυφόσιν
  choice: profondément pénétrés
  rationale: Le contexte indique une intériorisation profonde; la forme grecque est textuellement difficile et peut refléter une corruption ou une graphie irrégulière.
- source_word: τὰ λόγια τῆς παιδείας τοῦ θεοῦ
  choice: les paroles qui enseignent la discipline de Dieu
  rationale: Conserve à la fois λόγια, « paroles/oracles », et παιδεία, notion d’éducation formatrice ou de discipline, sans les fondre en une seule idée.
theological_decisions:
- issue: Sens de παιδεία τοῦ θεοῦ
  choice: la discipline de Dieu
  alternative: l’instruction de Dieu
  rationale: « Discipline » maintient l’amplitude de παιδεία, qui peut désigner l’éducation, la formation et la correction. La note signale cette étendue sémantique sans trancher artificiellement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche du grec tout en évitant un calque lourd. Le marqueur de note [a] figure dans le texte.
