  source_fidelity: La première proposition doit rendre ὑπεμνήσαμεν (« nous avons rappelé »), leçon très probablement visée malgré l’OCR ὑπενήγκαμεν. Le contexte et la leçon usuelle de ce passage soutiennent aussi le sens d’une attention studieuse aux λόγια, plutôt qu’un état passif d’être « pénétré » par eux.
  naturalness: « Profondément pénétrés » est peu naturel dans ce contexte et peut avoir une connotation indésirable en français moderne. « Attentifs aux paroles » est clair, idiomatique et conserve l’idée d’une application soutenue aux textes.
  terminology: '« Instruction de Dieu » rend παιδεία de manière naturelle sans réduire le terme à la seule correction disciplinaire. « Très estimés » restitue sobrement le superlatif honorifique ἐλλογιμωτάτοις. Aucune note n’est nécessaire : la note proposée surinterprète une difficulté textuelle qui ne doit pas être transférée au lecteur.'
