revisions:
- from: Et nous vous avons rappelé ces choses avec d’autant plus d’insistance, sachant clairement que nous écrivions à des hommes fidèles, tenus en très haute estime et profondément pénétrés des paroles qui enseignent la discipline de Dieu.[a]
