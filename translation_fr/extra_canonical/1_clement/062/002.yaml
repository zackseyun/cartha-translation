id: 1CLEM.62.2
reference: 1 Clement 62:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
translation:
  language: fr
  text: 'En effet, nous avons abordé tous les aspects de la foi, de la repentance, de l’amour sincère, de la maîtrise de soi, de la modération et de la persévérance. Nous vous avons rappelé que vous devez plaire avec piété au Dieu tout-puissant, en vivant dans la justice, la vérité et la patience, unis dans un même esprit, sans rancune, dans l’amour et la paix, avec une profonde bienveillance. C’est ainsi que nos pères mentionnés plus haut lui ont plu : ils se conduisaient avec humilité envers le Père, Dieu et Créateur, ainsi qu’envers tous les êtres humains.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοίας
  choice: repentance
  rationale: « Repentance » exprime le retournement moral et spirituel impliqué par le terme, avec plus de précision que le simple « regret ».
- source_word: γνησίας ἀγάπης
  choice: amour sincère
  rationale: γνήσιος qualifie ici un amour authentique, sans feinte ; « sincère » est naturel en français moderne.
- source_word: ἐγκρατείας
  choice: maîtrise de soi
  rationale: Rend clairement l’idée de contrôle exercé sur ses désirs et ses actes.
- source_word: σωφροσύνης
  choice: sagesse
  rationale: Le terme désigne une disposition équilibrée, raisonnable et moralement saine ; « sagesse » convient au registre tout en restant accessible.
- source_word: ὑπομονῆς
  choice: persévérance
  rationale: Souligne la constance dans l’épreuve plutôt qu’une attente passive.
- source_word: ἐψηλαφήσαμεν
  choice: nous avons abordé
  rationale: Le sens figuré est celui d’examiner ou de traiter un sujet ; « abordé » évite le littéralisme étrange de « palper ».
- source_word: μακροθυμίᾳ
  choice: patience
  rationale: Désigne la patience prolongée, notamment envers autrui ; « patience » est idiomatique et compréhensible.
- source_word: ἀμνησικάκως
  choice: sans rancune
  rationale: Exprime directement l’absence de ressentiment et de mémoire entretenue du mal subi.
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: une profonde bienveillance
  rationale: ἐκτενής indique une qualité intense ou soutenue, tandis que ἐπιείκεια évoque douceur, modération et indulgence ; cette formulation française en restitue le mouvement général.
- source_word: ταπεινοφρονοῦντες
  choice: ils se conduisaient avec humilité
  rationale: Le participe décrit une attitude durable d’humilité, non un simple geste ponctuel.
theological_decisions:
- issue: Rapport de ὁσίως à εὐαρεστεῖν
  choice: « plaire avec piété au Dieu tout-puissant »
  alternative: « plaire au Dieu tout-puissant dans la sainteté »
  rationale: ὁσίως est un adverbe qui modifie naturellement « plaire » ; la traduction conserve cette syntaxe sans fondre le mot dans la liste introduite par ἐν.
- issue: Référent implicite de εὐηρέστησαν
  choice: « lui ont plu » renvoie à Dieu
  alternative: Répéter « ont plu à Dieu »
  rationale: Le Dieu tout-puissant est l’antécédent naturel dans le contexte ; le pronom maintient la fluidité sans résoudre une controverse doctrinale.
- issue: Portée de τὰ πρὸς
  choice: attitude humble « envers » Dieu et tous les êtres humains
  alternative: « dans leurs rapports avec » Dieu et tous les êtres humains
  rationale: La construction est concise et quelque peu elliptique. « Envers » préserve l’orientation relationnelle sans lui imposer une précision étrangère au texte.
- issue: Titres πατέρα καὶ θεὸν καὶ κτίστην
  choice: « le Père, Dieu et Créateur »
  alternative: « le Père, le Dieu et le Créateur »
  rationale: Conserver la série de titres avec un seul article en français donne une formulation digne et suggère leur référence commune, conformément à la syntaxe grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période grecque est divisée en trois phrases pour assurer la lisibilité, tout en préservant la progression argumentative et les séries de vertus. Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
