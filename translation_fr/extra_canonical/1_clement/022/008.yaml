source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
translation:
  language: fr
  text: 'Nombreuses sont les détresses du juste, et de toutes le Seigneur le délivrera. Puis : « Nombreux sont les coups du pécheur, mais la miséricorde entourera ceux qui espèrent dans le Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψεις
  choice: détresses
  rationale: Le terme désigne des afflictions, épreuves ou situations d’oppression; « détresses » garde sa force tout en restant naturel dans ce contexte psalmique.
- source_word: ῥύσεται
  choice: délivrera
  rationale: Rend l’idée de tirer quelqu’un hors du danger ou de l’épreuve, avec le futur du grec.
- source_word: μάστιγες
  choice: coups qui frappent
  rationale: Le sens premier est celui de coups de fouet ou de fléaux; cette formulation conserve l’image punitive sans suggérer nécessairement un instrument précis.
- source_word: ἔλεος
  choice: bonté fidèle
  rationale: Exprime ici une bienveillance miséricordieuse et durable; cette expression française restitue mieux l’épaisseur relationnelle du terme dans la citation psalmique que le seul mot « pitié ».
- source_word: ἐλπίζοντας ἐπὶ κύριον
  choice: ceux qui mettent leur espérance dans le Seigneur
  rationale: Rend explicitement l’orientation de la confiance vers le Seigneur et demeure idiomatique en français.
theological_decisions:
- issue: Référent singulier de τοῦ δικαίου / αὐτόν
  choice: « du juste » / « le délivrera »
  alternative: « des justes » / « les délivrera »
  rationale: Le grec emploie clairement le singulier générique; il convient de le préserver sans le collectiviser.
- issue: Valeur de ἔλεος
  choice: « bonté fidèle »
  alternative: « miséricorde »
  rationale: « Miséricorde » est possible et plus formel, mais « bonté fidèle » communique en français courant la faveur bienveillante et constante évoquée ici sans imposer une lecture confessionnelle.
translation_notes:
  register: 'Français moderne, digne et accessible, avec un léger rythme psalmique. La transition εἶτα est rendue par « Puis : » et la seconde citation est délimitée conformément au texte transmis.'
