source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκέκραξεν ὁ δίκαιος, καὶ ὁ κύριος εἰσήκουσεν αὐτοῦ καὶ ἐκ πασῶν τῶν θλίψεων αὐτοῦ ἐῤῥύσατο αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/007.yaml
  text: The righteous man cried out, and the Lord heard him and delivered him from all his afflictions.
translation:
  language: fr
  text: Le juste a crié, et le Seigneur l’a entendu et l’a délivré de toutes ses détresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: Rend directement le substantif adjectival grec sans ajouter une précision de genre absente de la portée générale de l’expression.
- source_word: ἐκέκραξεν
  choice: a crié
  rationale: Exprime l’appel pressant du verbe grec dans un français naturel et sobre.
- source_word: εἰσήκουσεν αὐτοῦ
  choice: l’a entendu
  rationale: Formulation française idiomatique qui conserve l’idée que le Seigneur a prêté attention à son cri.
- source_word: θλίψεων
  choice: détresses
  rationale: Le terme désigne des situations d’oppression, d’épreuve ou d’angoisse; « détresses » en préserve ici l’intensité et la pluralité.
- source_word: ἐῤῥύσατο αὐτόν
  choice: l’a délivré
  rationale: Rend l’idée d’un sauvetage hors du danger sans surinterpréter la nature de la délivrance.
theological_decisions:
- issue: Portée de « ὁ δίκαιος »
  choice: le juste
  alternative: l’homme juste
  rationale: « Le juste » reste proche du grec, convient au registre biblique et n’ajoute pas le nom « homme ».
translation_notes:
  register: Français moderne, digne et accessible, avec une structure parallèle proche du grec. Aucun appel de note n’est nécessaire.
