source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα δὲ πάντα βεβαιοῖ ἡ ἐν Χριστῷ πίστις· καὶ γὰρ αὐτὸς διὰ τοῦ πνεύματος τοῦ ἁγίου οὕτως προσκαλεῖται ἡμᾶς· Δεῦτε, τέκνα, ἀκούσατέ μου, φόβον κυρίου διδάξω ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
translation:
  language: fr
  text: 'Or, la foi en Christ[a] confirme tout cela. Car lui-même, par l’Esprit Saint, nous appelle ainsi : « Venez, enfants, écoutez-moi ; je vous enseignerai la crainte du Seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la foi qui est en Christ ».'
    reason: La construction grecque ἡ ἐν Χριστῷ πίστις peut être comprise comme la foi placée en Christ ou, plus littéralement, comme la foi qui se trouve en lui.
lexical_decisions:
- source_word: ἡ ἐν Χριστῷ πίστις
  choice: la foi en Christ
  rationale: Cette formulation rend naturellement en français la relation exprimée par ἐν Χριστῷ, tout en conservant en note la lecture plus littérale.
- source_word: βεβαιοῖ
  choice: confirme
  rationale: Le verbe signifie rendre ferme, attester ou confirmer ; « confirme » convient au rôle probant attribué ici à la foi.
- source_word: προσκαλεῖται ἡμᾶς
  choice: nous appelle
  rationale: Le moyen προσκαλεῖται exprime un appel adressé à des personnes, avec l’idée implicite de les faire venir à soi ; « nous appelle » est clair et idiomatique.
- source_word: φόβον κυρίου
  choice: la crainte du Seigneur
  rationale: « Crainte » préserve le vocabulaire religieux et moral du grec sans réduire φόβος à la seule peur.
theological_decisions:
- issue: Référent de αὐτός (« lui-même »)
  choice: Conserver le pronom sans expliciter son référent
  alternative: « le Christ lui-même »
  rationale: Le contexte oriente probablement vers le Christ, mais le grec emploie seulement le pronom ; ne pas ajouter le nom préserve la formulation et sa tension christologique.
- issue: Sens de ἡ ἐν Χριστῷ πίστις
  choice: « la foi en Christ » dans le texte, avec variante littérale en note
  alternative: « la foi qui est en Christ »
  rationale: La construction peut désigner la foi placée en Christ, mais sa forme permet aussi une lecture plus littérale ou sphérique ; la note garde cette ambiguïté accessible.
translation_notes:
  register: Français international moderne, digne et accessible. La citation conserve l’adresse affectueuse « mes enfants » et le terme biblique traditionnel « crainte du Seigneur ». Le connecteur δέ est rendu par « Or » pour marquer la transition sans créer une opposition forte.
