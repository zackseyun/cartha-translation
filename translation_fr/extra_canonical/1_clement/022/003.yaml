  yaml_path: translation/extra_canonical/1_clement/022/003.yaml
  text: Keep your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: fr
  text: Garde ta langue du mal[a], et tes lèvres des paroles trompeuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Retiens ta langue loin du mal ».
    reason: παῦσον peut souligner l’action de faire cesser ou de retenir; cette variante l’exprime sans déplacer l’image vers une action générale.
lexical_decisions:
- source_word: παῦσον … ἀπὸ κακοῦ
  choice: Garde … du mal
  rationale: L’impératif aoriste de παύω avec ἀπό appelle ici l’idée de retenir ou détourner la langue du mal. « Garde ta langue du mal » est idiomatique en français et conserve l’image du grec.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: de toute parole trompeuse
  rationale: La construction exprime le fait de ne pas proférer de δόλος, terme qui désigne la tromperie ou la fraude. Cette formulation naturelle conserve le parallélisme avec « langue » et « lèvres ».
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne, avec tutoiement singulier conforme aux impératifs grecs. Le parallélisme poétique est préservé.
