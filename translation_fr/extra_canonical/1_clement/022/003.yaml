  source_fidelity: Le premier membre rend correctement l’impératif παῦσον avec l’idée de retenir sa langue loin du mal. Dans le second, δόλον (« tromperie », « ruse », employé ici comme contenu de parole) est mieux rendu sans l’ajout non exprimé de « toute » et en conservant le parallélisme concis du grec.
