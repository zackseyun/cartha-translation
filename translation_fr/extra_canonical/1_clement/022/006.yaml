reference: 1 Clement 22:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους, καὶ ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά, τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: fr
  text: Les yeux du Seigneur sont tournés vers les justes, et ses oreilles sont attentives à leur supplication ; mais le visage du Seigneur est contre ceux qui font le mal, pour effacer de la terre leur souvenir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ δικαίους
  choice: tournés vers les justes
  rationale: Dans ce contexte favorable, ἐπί exprime l’attention bienveillante du Seigneur envers les justes ; cette formulation reste naturelle en français et conserve l’image corporelle.
- source_word: πρὸς δέησιν αὐτῶν
  choice: attentives à leur supplication
  rationale: δέησις désigne une demande pressante ou une supplication. L’ajout idiomatique d’« attentives » explicite la relation portée par πρός sans altérer le sens.
- source_word: πρόσωπον δὲ κυρίου ἐπὶ
  choice: mais le Seigneur tourne son visage contre
  rationale: Le second ἐπί a ici une valeur hostile, indiquée par le contraste avec les justes et par le but destructeur qui suit. La tournure française préserve l’image du visage tout en rendant clairement cette opposition.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: jusqu’à leur souvenir
  rationale: μνημόσυνον peut désigner le souvenir ou la mémoire laissée par quelqu’un. « Jusqu’à leur souvenir » exprime naturellement en français l’effacement total visé.
theological_decisions:
- issue: Portée de « justes » (δικαίους)
  choice: les justes
  alternative: ceux qui font ce qui est juste
  rationale: Le substantif adjectival grec est rendu directement, sans préciser si cette justice relève du statut, de la conduite ou des deux.
- issue: Image du visage du Seigneur
  choice: le Seigneur tourne son visage contre
  alternative: le visage du Seigneur est contre
  rationale: La formulation conserve l’anthropomorphisme et son orientation hostile, sans le réduire à une notion abstraite de colère ou de jugement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique entre les yeux, les oreilles et le visage est conservé, ainsi que le contraste entre l’attention favorable envers les justes et l’opposition à ceux qui font le mal.
