review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu. Toutefois, « le Seigneur tourne son visage contre » introduit un mouvement verbal qui n’est pas exprimé dans le grec, où le sujet est explicitement « le visage du Seigneur ». La révision conserve plus exactement le parallélisme des yeux, des oreilles et du visage.
  naturalness: Le français est clair, actuel et de registre approprié. « Le visage du Seigneur est contre » est une formulation biblique naturelle et concise dans ce parallélisme.
  terminology: « Seigneur », « justes », « supplication » et « ceux qui font le mal » rendent convenablement κύριος, δικαίους, δέησις et ποιοῦντας κακά. « Souvenir » rend correctement μνημόσυνον sans préciser indûment la nature de la mémoire effacée.
  issues:
  - severity: low
    issue: Ajout d’un mouvement dans « le Seigneur tourne son visage contre »
    rationale: πρόσωπον δὲ κυρίου ἐπὶ porte littéralement « mais le visage du Seigneur [est] contre/sur ». Le grec ne dit pas que le Seigneur « tourne » son visage; employer « le visage du Seigneur est contre » préserve mieux l’image et la structure source.
  - severity: low
    issue: « jusqu’à leur souvenir » ajoute une emphase syntaxique non requise
    rationale: L’idée d’effacement complet est déjà portée par ἐξολεθρεῦσαι (« détruire/faire disparaître entièrement »). « Effacer de la terre leur souvenir » rend directement le complément grec sans ajout.
  revised_text: Les yeux du Seigneur sont tournés vers les justes, et ses oreilles sont attentives à leur supplication ; mais le visage du Seigneur est contre ceux qui font le mal, pour effacer de la terre leur souvenir.
