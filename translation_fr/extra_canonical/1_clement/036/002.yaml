revisions:
- from: Par lui, nous fixons notre regard sur les hauteurs des cieux ; par lui, nous contemplons comme dans un miroir son visage sans tache et souverainement élevé ; par lui, les yeux de notre cœur se sont ouverts ; par lui, notre intelligence insensée et obscurcie s’épanouit à la lumière ; par lui, le Maître a voulu nous faire goûter à la connaissance immortelle. Lui qui est le rayonnement de sa majesté est d’autant supérieur aux anges qu’il a reçu en héritage un nom plus excellent.
  to: Par lui, nous fixons notre regard sur les hauteurs des cieux ; par lui, nous contemplons comme dans un miroir son visage sans tache et souverainement élevé ; par lui, les yeux de notre cœur ont été ouverts ; par lui, notre intelligence insensée et obscurcie s’épanouit à la lumière ; par lui, le Maître a voulu que nous goûtions à la connaissance immortelle — lui qui est le rayonnement de sa majesté est d’autant supérieur aux anges qu’il a reçu en héritage un nom plus excellent.
  rationale: La révision corrige la voix du verbe passif et rend plus directement la construction « a voulu [nous] goûter ». Elle améliore également la liaison syntaxique de la relative finale, sans lever les ambiguïtés de référent ni modifier les choix théologiques ou lexicaux substantiels.
