source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: fr
  text: Par lui, nous fixons notre regard sur les hauteurs des cieux ; par lui, nous contemplons comme dans un miroir son visage sans tache et souverainement élevé ; par lui, les yeux de notre cœur ont été ouverts ; par lui, notre intelligence insensée et obscurcie s’épanouit à la lumière ; par lui, le Maître a voulu que nous goûtions à la connaissance immortelle — lui qui est le rayonnement de sa majesté est d’autant supérieur aux anges qu’il a reçu en héritage un nom plus excellent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίζομεν
  choice: nous fixons notre regard
  rationale: Rend l’idée d’une attention visuelle soutenue, dans un français naturel et digne.
- source_word: ἐνοπτριζόμεθα
  choice: nous contemplons comme dans un miroir
  rationale: Conserve explicitement l’image du miroir et la valeur moyenne du verbe.
- source_word: ὄψιν
  choice: visage
  rationale: Dans ce contexte, le terme désigne l’aspect visible ou la face ; « visage » est naturel tout en maintenant l’imagerie.
- source_word: ἀναθάλλει
  choice: s’épanouit
  rationale: Préserve l’image végétale d’un renouveau ou d’une floraison vers la lumière.
- source_word: γεύσασϑαι
  choice: faire goûter à
  rationale: Reproduit la métaphore de goûter et le fait que le Maître veut en faire faire l’expérience aux croyants.
- source_word: ἀπαύγασμα
  choice: rayonnement
  rationale: Exprime ce qui émane de la majesté sans trancher inutilement entre « reflet » et « éclat ».
- source_word: δεσπότης
  choice: le Maître
  rationale: Rend le titre d’autorité sans la connotation moderne négative de « despote ».
theological_decisions:
- issue: Référent des pronoms αὐτοῦ dans « son visage » et « sa majesté »
  choice: Maintien des pronoms sans explicitation nominale
  alternative: Ajouter « de Dieu » ou « du Maître »
  rationale: Le grec laisse le référent à déduire du contexte ; l’expliciter résoudrait une relation que le texte ne formule pas ici.
- issue: Nature du lien entre le Christ et la majesté divine dans ἀπαύγασμα
  choice: « rayonnement de sa majesté »
  alternative: « reflet de sa majesté » ou « éclat de sa majesté »
  rationale: « Rayonnement » garde la richesse métaphorique du grec et évite d’imposer une lecture théologique plus étroite.
- issue: Valeur de la comparaison avec les anges
  choice: « d’autant supérieur… qu’il a reçu en héritage »
  alternative: « devenu d’autant supérieur… qu’il a hérité »
  rationale: Le grec affirme qu’il est supérieur et associe cette supériorité au nom hérité, sans employer ici un participe signifiant explicitement « devenu ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « par lui » et la longue progression rhétorique sont conservées. La dernière proposition est détachée en une nouvelle phrase pour éviter une période française excessivement lourde, sans modifier son lien logique avec ce qui précède.
