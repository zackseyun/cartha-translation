id: 1CLEM.36.1
reference: 1 Clement 36:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
translation:
  language: fr
  text: 'Voici le chemin, bien-aimés, sur lequel nous avons trouvé notre salut : Jésus Christ, le grand prêtre de nos offrandes, le protecteur et celui qui nous vient en aide dans notre faiblesse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδός
  choice: chemin
  rationale: « Chemin » est naturel en français et conserve l’image biblique d’une voie suivie.
- source_word: ἐν ᾗ
  choice: sur lequel
  rationale: Avec « chemin », le français idiomatique emploie « sur lequel », tout en conservant le rapport locatif du grec.
- source_word: τὸ σωτήριον ἡμῶν
  choice: notre salut
  rationale: Le substantif neutre désigne ici le moyen ou la réalité du salut, identifié à Jésus Christ ; « notre salut » rend cette formulation avec concision.
- source_word: ἀρχιερέα
  choice: grand prêtre
  rationale: Équivalent français courant et précis du titre cultuel ἀρχιερεύς.
- source_word: προσφορῶν
  choice: offrandes
  rationale: Le terme désigne ce qui est présenté ou offert, particulièrement dans un cadre cultuel.
- source_word: προστάτην
  choice: protecteur
  rationale: Le mot peut désigner celui qui se tient devant pour défendre ou prendre en charge ; « protecteur » convient au parallèle avec βοηθός.
- source_word: βοηθὸν
  choice: soutien
  rationale: « Soutien » exprime naturellement en français celui qui vient en aide, sans la lourdeur de « assistant ».
- source_word: ἀσθενείας
  choice: faiblesse
  rationale: Conserve le sens général de fragilité ou d’incapacité humaine sans le limiter à la maladie physique.
theological_decisions:
- issue: Valeur de Χριστόν dans Ἰησοῦν Χριστόν
  choice: Jésus Christ
  alternative: Jésus le Messie
  rationale: Dans cet emploi sans article et dans l’usage chrétien de Clément, Χριστός fonctionne comme titre fixé ou élément du nom. « Jésus Christ » respecte cet usage sans imposer une explicitation absente du contexte.
- issue: Identification du salut à Jésus Christ
  choice: Conserver l’apposition après les deux-points
  alternative: « nous avons trouvé le salut en Jésus Christ »
  rationale: La syntaxe grecque présente Jésus Christ comme apposition à « notre salut ». La formulation retenue préserve cette affirmation théologique plutôt que de transformer Jésus en simple lieu ou moyen du salut.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque, avec des choix idiomatiques (« sur lequel », « soutien ») qui évitent une littéralité raide.
