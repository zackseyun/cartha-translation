  text: τίνες οὖν οἱ ἐχϑροί; οἱ φαῦλοι καὶ ἀντιτασσόμενοι τῷ ϑελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/006.yaml
  text: Who then are the enemies? The wicked and those who set themselves against his will[a].
translation:
  language: fr
  text: Qui sont donc les ennemis ? Ceux qui font le mal et qui s’opposent à sa volonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαῦλοι
  choice: ceux qui font le mal
  rationale: Dans ce contexte moral, φαῦλοι désigne des personnes mauvaises ou malfaisantes. Cette formulation est naturelle en français moderne sans ajouter la charge affective de « vils ».
- source_word: ἀντιτασσόμενοι
  choice: qui s’opposent
  rationale: Le participe exprime une opposition active à la volonté de Dieu ; « s’opposent » restitue clairement cette idée.
- source_word: τῷ θελήματι αὐτοῦ
  choice: à sa volonté
  rationale: Rend directement le datif régi par ἀντιτάσσομαι et conserve le référent masculin implicite du contexte.
theological_decisions:
- issue: Rapport entre φαῦλοι et ἀντιτασσόμενοι
  choice: 'Une seule catégorie décrite par deux traits coordonnés : « Ceux qui font le mal et qui s’opposent… »'
  alternative: 'Deux catégories distinctes : « les méchants et ceux qui s’opposent… »'
  rationale: L’unique article οἱ gouverne les deux éléments coordonnés et les présente le plus naturellement comme un même ensemble, sans exiger que les deux descriptions soient strictement synonymes.
translation_notes:
  register: Français international moderne, clair et digne. La question conserve l’insistance de οὖν avec « donc ». Aucun marqueur de note n’est requis.
