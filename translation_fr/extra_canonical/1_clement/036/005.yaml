  text: καὶ πάλιν λέγει πρὸς αὐτόν· Κάϑου ἐκ δεξιῶν μου, ἕως ἂν ϑῶ τοὺς ἐχϑρούς σου ὑποπόδιον τῶν ποδῶν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/005.yaml
  text: 'And again he says to him:

    “Sit at my right hand,

    until I make your enemies a footstool for your feet.”'
translation:
  language: fr
  text: 'Et il lui dit encore :


    « Assieds-toi à ma droite,

    jusqu’à ce que je fasse de tes ennemis

    un marchepied pour tes pieds. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κάϑου
  choice: Assieds-toi
  rationale: Impératif naturel et direct correspondant au grec, dans un registre digne.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Expression française consacrée et fidèle à l’image de la place d’honneur et d’autorité.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: un marchepied pour tes pieds
  rationale: Conserve l’image concrète et la répétition sémantique du grec sans l’atténuer.
theological_decisions:
- issue: Référents des pronoms dans « il lui dit »
  choice: Conserver les pronoms sans identifier explicitement les personnes
  alternative: Expliciter « Dieu dit au Fils » ou nommer les référents
  rationale: Le grec emploie seulement des pronoms; l’explicitation introduirait une interprétation théologique absente de cette phrase.
- issue: Portée de ἕως ἄν
  choice: « jusqu’à ce que »
  alternative: « en attendant que »
  rationale: La formulation retenue préserve la tournure temporelle du grec sans tirer de conclusion sur ce qui suit l’assujettissement des ennemis.
translation_notes:
  register: Français moderne international, clair et solennel. La disposition poétique met en valeur la citation scripturaire tout en conservant sa structure.
