  text: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ οὕτως· εἶπεν ὁ δεσπότης· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε· αἴτησαι παρ’ ἐμοῦ, καὶ δώσω σοι ἔϑνη τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
translation:
  language: fr
  text: 'Mais au sujet de son Fils, voici ce que le Maître a dit :


    « Tu es mon Fils ;

    aujourd’hui, je t’ai engendré.

    Demande-moi, et je te donnerai les nations pour héritage,

    et les extrémités de la terre pour possession. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  choice: le Maître
  rationale: Rend le titre divin exprimant l’autorité souveraine, sans le confondre avec κύριος, habituellement traduit par « Seigneur ».
- source_word: γεγέννηκά
  choice: je t’ai engendré
  rationale: Conserve le sens filial et théologiquement chargé du parfait grec, plutôt que de l’atténuer par « donné naissance ».
- source_word: ἔθνη
  choice: les nations
  rationale: Équivalent naturel qui désigne ici les peuples constituant l’héritage du Fils.
- source_word: κατάσχεσις
  choice: possession
  rationale: Exprime ce qui est détenu comme domaine, en parallèle avec « héritage ».
- source_word: τὰ πέρατα τῆς γῆς
  choice: les extrémités de la terre
  rationale: Préserve l’image géographique et poétique du texte cité.
theological_decisions:
- issue: Référent de « aujourd’hui, je t’ai engendré »
  choice: Maintien littéral sans explication doctrinale
  alternative: Interpréter explicitement la phrase comme naissance éternelle, incarnation, résurrection ou intronisation
  rationale: Le passage cite le psaume sans préciser ici la nature ou le moment de cet engendrement ; la traduction conserve cette tension.
- issue: Sujet de εἶπεν ὁ δεσπότης
  choice: « le Maître a dit »
  alternative: « il est dit »
  rationale: Le grec nomme explicitement le Maître comme sujet du verbe ; il ne faut pas omettre cette attribution.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en vers conserve le caractère poétique de la citation. « Maître » distingue δεσπότης de κύριος, et « engendré » préserve la formulation théologique sans l’interpréter.
