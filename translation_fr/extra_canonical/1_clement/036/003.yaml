source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: fr
  text: 'Car il est écrit ceci :


    « Il fait de ses anges des vents,


    et de ses serviteurs une flamme de feu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγέλους
  choice: anges
  rationale: Le mot peut désigner des « messagers », mais, dans cette citation du Psaume 104:4 (LXX 103:4) et dans le contexte de 1 Clément 36, « anges » conserve le sens traditionnel et le lien intertextuel.
- source_word: πνεύματα
  choice: vents
  rationale: πνεύματα peut signifier « esprits », « souffles » ou « vents ». Le parallélisme avec « une flamme de feu » et le contexte du psaume cosmique favorisent « vents », tout en laissant subsister l'ambiguïté de la relation entre anges et forces naturelles.
- source_word: λειτουργοὺς
  choice: serviteurs
  rationale: Le terme désigne ceux qui accomplissent un service, souvent officiel ou cultuel. « Serviteurs » est naturel en français et convient ici aux agents de Dieu sans surcharger le texte d'une connotation liturgique.
- source_word: πυρὸς φλόγα
  choice: une flamme de feu
  rationale: Rendu formel qui préserve l'image et l'ordre conceptuel du grec.
theological_decisions:
- issue: Sens de πνεύματα appliqué aux anges
  choice: vents
  alternative: esprits
  rationale: Le grec permet les deux lectures. « Vents » reflète vraisemblablement le sens du psaume cité et maintient le parallélisme avec le feu, sans imposer une définition ontologique des anges.
- issue: Construction ποιῶν ... πνεύματα / φλόγα
  choice: « fait de ses anges des vents » et « de ses serviteurs une flamme »
  alternative: « fait des vents ses anges » et « d'une flamme de feu ses serviteurs »
  rationale: La syntaxe grecque peut être discutée à la lumière de l'hébreu du psaume. Ici, l'ordre et la lecture de la Septante citée par 1 Clément sont conservés, conformément à la source immédiate.
translation_notes:
  register: Français moderne, digne et accessible. « Car il est écrit » rend naturellement γέγραπται γὰρ οὕτως sans traduire lourdement οὕτως par « ainsi »; la mise en forme de la citation suffit à introduire ses termes exacts.
