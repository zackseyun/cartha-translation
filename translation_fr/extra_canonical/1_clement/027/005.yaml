id: 1CLEM.27.5
reference: 1 Clement 27:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: fr
  text: 'Qui lui dira : « Qu’as-tu fait ? » Ou qui résistera à la puissance de sa force ? Quand il le voudra et comme il le voudra, il fera toutes choses, et rien de ce qu’il a décrété ne passera jamais.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: résistera
  rationale: Rend directement l’idée de s’opposer ou de tenir tête, tout en restant naturel en français.
- source_word: τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: à la puissance de sa force
  rationale: Conserve l’expression grecque intensive et sa solennité sans réduire les deux termes à un seul.
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  choice: de ce qu’il a décrété
  rationale: Le participe passif désigne les choses arrêtées par décret; cette formulation française transmet clairement l’autorité de la décision divine.
- source_word: παρελθῇ
  choice: ne passera jamais
  rationale: Préserve l’image du verbe grec et, avec « jamais », la négation fortement emphatique οὐδὲν μή.
theological_decisions:
- issue: Souveraineté de Dieu et accomplissement de ses décrets
  choice: Maintenir les affirmations absolues « il accomplit toutes choses » et « rien… ne passera jamais »
  alternative: Expliciter que seuls ses desseins particuliers sont visés ou reformuler en « rien ne restera inaccompli »
  rationale: Le grec affirme sans qualification immédiate la liberté d’action et la permanence de ce que Dieu a décrété; la traduction ne doit ni restreindre ni développer cette affirmation.
translation_notes:
  register: Français moderne, digne et accessible. La structure interrogative et le parallélisme du grec sont conservés; « puissance de sa force » garde volontairement l’intensité rhétorique de l’original.
