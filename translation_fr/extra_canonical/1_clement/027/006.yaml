id: 1CLEM.27.6
reference: 1 Clement 27:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντα ἐνώπιον αὐτοῦ εἰσίν, καὶ οὐδὲν λέληθεν τὴν βουλὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
translation:
  language: fr
  text: Tout est devant lui, et rien n’a échappé à son conseil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rien n’a échappé à son dessein » ; le mot grec peut désigner le conseil, la décision ou le dessein.
    reason: βουλή peut désigner une délibération, une décision ou un dessein; λέληθεν signifie qu’une chose a échappé à l’attention ou est demeurée inconnue.
lexical_decisions:
- source_word: πάντα
  choice: Tout
  rationale: Le singulier collectif « tout » exprime naturellement en français l’ensemble de ce qui existe, sans alourdir la phrase par « toutes choses ».
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: Rendu formel et idiomatique qui conserve l’image de toute réalité présente sous son regard.
- source_word: λέληθεν
  choice: n’échappe
  rationale: Le parfait de λανθάνω indique que rien n’a échappé et ne demeure hors de sa perception. Le présent français énonce naturellement cette réalité permanente.
- source_word: βουλή
  choice: conseil
  rationale: « Conseil » conserve la dimension de délibération ou de pensée réfléchie du terme grec, tout en laissant ouverte sa nuance possible de dessein ou de décision.
theological_decisions:
- issue: Portée de βουλή appliqué à Dieu
  choice: son conseil
  alternative: son dessein
  rationale: Le texte peut évoquer la pensée délibérative de Dieu aussi bien que son projet arrêté. « Conseil » maintient mieux la tension lexicale et évite de faire de λέληθεν l’idée qu’un projet aurait été contrecarré.
translation_notes:
  register: Français moderne, sobre et digne. La formulation brève suit le parallélisme grec. « Conseil » est légèrement soutenu, mais il permet de préserver l’ambiguïté de βουλή sans remplacer celle-ci par la seule notion de connaissance.
