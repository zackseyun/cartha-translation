id: 1CLEM.27.1
reference: 1 Clement 27:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
translation:
  language: fr
  text: Dans cette espérance[a], que nos âmes soient donc attachées à celui qui est fidèle à ses promesses et juste dans ses jugements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Par cette espérance».
    reason: Le datif Ταύτῃ τῇ ἐλπίδι peut être compris comme indiquant soit la sphère («dans»), soit le moyen («par»).
lexical_decisions:
- source_word: προσδεδέσθωσαν
  choice: que … soient attachées
  rationale: Le parfait impératif moyen-passif exprime ici l’état d’attachement souhaité; cette formulation française conserve l’image du lien et régit naturellement «à celui».
- source_word: τῷ πιστῷ
  choice: à celui qui est fidèle
  rationale: Le datif désigne celui auquel les âmes doivent être attachées; l’adjectif substantivé est rendu sans ajouter explicitement «Dieu», que le grec ne nomme pas ici.
- source_word: ἐν ταῖς ἐπαγγελίαις
  choice: à ses promesses
  rationale: En français courant, être «fidèle à ses promesses» exprime naturellement la fidélité manifestée dans le domaine des promesses.
- source_word: τῷ δικαίῳ ἐν τοῖς κρίμασιν
  choice: juste dans ses jugements
  rationale: Cette traduction conserve le parallélisme grec et le sens judiciaire ou décisionnel de κρίματα sans le préciser davantage.
theological_decisions:
- issue: Identification de «celui qui est fidèle»
  choice: Ne pas ajouter le nom de Dieu
  alternative: «à Dieu, qui est fidèle» ou «à Celui qui est fidèle»
  rationale: Le référent divin ressort du contexte, mais le grec emploie seulement des adjectifs substantivés; la traduction évite donc une explicitation absente de la source et une majuscule interprétative.
- issue: Fonction de Ταύτῃ … τῇ ἐλπίδι
  choice: «Dans cette espérance»
  alternative: «Par cette espérance»
  rationale: Le datif peut indiquer la sphère dans laquelle les âmes s’attachent à celui qui est fidèle, tout en permettant aussi une nuance de moyen; l’ambiguïté secondaire est signalée en note.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque, tout en employant les tournures idiomatiques «fidèle à ses promesses» et «juste dans ses jugements».
