id: 1CLEM.27.3
reference: 1 Clement 27:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναζωπυρησάτω οὖν ἡ πίστις αὐτοῦ ἐν ἡμῖν, καὶ νοήσωμεν, ὅτι πάντα ἐγγὺς αὐτῷ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/003.yaml
  text: Therefore let faith in him be rekindled in us, and let us understand that all things are near to him.
translation:
  language: fr
  text: Que la foi en lui se ravive donc en nous, et comprenons que tout est proche de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  choice: se ranime
  rationale: Le verbe évoque le fait de raviver un feu ou de faire reprendre vigueur. « Se ranime » restitue cette image de manière naturelle en français, sans ajouter explicitement celle de la flamme.
- source_word: ἡ πίστις αὐτοῦ
  choice: la foi en lui
  rationale: 'Le génitif αὐτοῦ peut formellement recevoir plusieurs lectures, mais le contexte et la tradition de traduction soutiennent ici le génitif objectif : la foi dirigée vers Dieu.'
- source_word: νοήσωμεν
  choice: comprenons
  rationale: L’aoriste subjonctif exhortatif appelle une invitation collective à saisir ou reconnaître une réalité.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel désigne l’ensemble des choses; le collectif français « tout » est idiomatique et conserve l’ampleur de l’expression.
- source_word: ἐγγὺς αὐτῷ
  choice: proche de lui
  rationale: Cette formulation garde la relation de proximité exprimée par ἐγγύς avec le datif, sans préciser indûment s’il s’agit de proximité spatiale, temporelle ou de disponibilité immédiate.
theological_decisions:
- issue: Sens du génitif dans ἡ πίστις αὐτοῦ
  choice: la foi en lui
  alternative: sa fidélité / la foi qui vient de lui
  rationale: Bien que la forme grecque soit susceptible d’autres analyses, l’exhortation à raviver la foi au sein de la communauté favorise la lecture objective, sans introduire une doctrine particulière.
- issue: Portée de la proximité de toutes choses avec Dieu
  choice: tout est proche de lui
  alternative: tout est à sa portée
  rationale: La traduction littérale préserve la tension et l’indétermination de l’énoncé grec; « à sa portée » l’interpréterait davantage en termes de puissance ou d’accès.
translation_notes:
  register: Français moderne, sobre et digne. L’impératif exhortatif grec est rendu par « Que… donc » puis « comprenons », ce qui conserve le mouvement collectif de la phrase.
