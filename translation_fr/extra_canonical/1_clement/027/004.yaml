source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ συνεστήσατο τὰ πάντα καὶ ἐν λόγῳ δύναται αὐτὰ καταστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/004.yaml
  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: fr
  text: Par la parole de sa majesté, il a établi toutes choses, et par une parole, il peut les détruire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ
  choice: par la parole / par une parole
  rationale: La préposition ἐν exprime ici le moyen. La première occurrence, déterminée par le complément « de sa majesté », se rend naturellement par « la parole » ; la seconde, sans complément et dans une construction parallèle, par « une parole ».
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: de sa majesté
  rationale: « Majesté » conserve le sens de grandeur souveraine et le registre élevé de μεγαλωσύνη.
- source_word: συνεστήσατο
  choice: a établi
  rationale: Le verbe désigne ici l'action de constituer ou de mettre en place l'ensemble de la création ; « établir » préserve cette portée sans surinterprétation.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Formulation française traditionnelle mais encore intelligible, qui garde la portée universelle du grec.
- source_word: καταστρέψαι
  choice: détruire
  rationale: Dans ce contraste avec l'établissement de toutes choses, « détruire » exprime clairement la ruine ou l'anéantissement visé par le verbe.
theological_decisions:
- issue: Nature de la « parole » divine
  choice: Maintenir « parole » sans l'identifier explicitement à une personne.
  alternative: Employer « le Verbe » avec une majuscule.
  rationale: Le contexte immédiat parle du moyen souverain par lequel Dieu établit et peut détruire toutes choses ; le grec λόγος ne justifie pas à lui seul une identification christologique explicite.
- issue: Portée de la puissance divine
  choice: Traduire δύναται par « il peut », en conservant l'énoncé de capacité.
  alternative: 'Reformuler comme une action future ou certaine : « il les détruira ».'
  rationale: Le texte affirme la capacité souveraine de Dieu, non l'annonce qu'il accomplira nécessairement cette destruction.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme du grec est conservé, ainsi que le contraste entre établir et détruire. Aucun marqueur de note n'est requis.
