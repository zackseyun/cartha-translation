  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
translation:
  language: fr
  text: Les cieux proclament la gloire de Dieu[a], et le firmament annonce l’œuvre de ses mains. Le jour fait jaillir une parole au jour, et la nuit annonce la connaissance à la nuit. Il n’y a ni paroles ni discours dont les voix ne soient pas entendues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis commence par εἰ, qui pourrait se traduire par « si » ou « puisque ». Il s’agit très probablement d’une erreur de lecture pour Οἱ (« les »), conformément au texte du Psaume 19.2-4 (LXX 18.2-4) cité ici.
    reason: Signaler l’état du texte source et expliquer pourquoi le corps du texte ne traduit pas le εἰ issu de l’OCR.
lexical_decisions:
- source_word: τὸ στερέωμα
  choice: le firmament
  rationale: Terme traditionnel et précis pour la voûte céleste dans cette citation du psaume; il conserve l’image cosmologique sans la paraphraser.
- source_word: ἐρεύγεται ῥῆμα
  choice: fait jaillir une parole
  rationale: ἐρεύγεται évoque une émission abondante ou jaillissante; cette formulation française reste imagée tout en étant naturelle.
- source_word: λαλιαί
  choice: discours
  rationale: Rend une expression vocale ou manière de parler et permet de la distinguer de λόγοι, traduit par «paroles».
- source_word: γνῶσιν
  choice: la connaissance
  rationale: Équivalent direct qui préserve la portée générale du grec.
theological_decisions:
- issue: Le εἰ initial du texte OCR
  choice: Le comprendre comme une lecture fautive de Οἱ et commencer par une affirmation indépendante
  alternative: Traduire εἰ par «si» ou «puisque»
  rationale: Le passage cite le Psaume 19.2-4 (LXX 18.2-4), où le texte porte Οἱ οὐρανοί; la lecture conditionnelle ou causale produirait ici une syntaxe incohérente et dépend vraisemblablement d’une erreur d’OCR.
- issue: Portée de la négation dans la dernière proposition
  choice: «Il n’existe ni paroles ni discours dont les voix ne soient entendues»
  alternative: «Ce ne sont ni des paroles ni des discours, et leurs voix ne sont pas entendues»
  rationale: La construction transmise se lit naturellement comme une proposition relative généralisante; la traduction conserve toutefois sa formulation inhabituelle sans l’harmoniser avec d’autres formes textuelles du psaume.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme poétique de la citation ainsi que les images de proclamation, de jaillissement et de transmission.
