id: 1CLEM.27.2
reference: 1 Clement 27:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
translation:
  language: fr
  text: Celui qui a ordonné de ne pas mentir[a], à bien plus forte raison, ne mentira pas lui-même ; car rien n’est impossible à Dieu, si ce n’est de mentir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui nous a ordonné de ne pas mentir » ; le grec ne précise pas à qui cet ordre a été donné.'
    reason: Le sujet implicite de l’infinitif μὴ ψεύδεσθαι n’est pas exprimé ; le contexte permet de comprendre un ordre adressé à « nous », mais cet ajout ne figure pas explicitement dans le grec.
lexical_decisions:
- source_word: παραγγείλας
  choice: a ordonné
  rationale: Le participe aoriste désigne celui qui a donné un ordre ; « a ordonné » est direct, naturel et conserve la force du verbe grec.
- source_word: πολλῷ μᾶλλον
  choice: à bien plus forte raison
  rationale: Cette tournure française rend clairement l’argument a fortiori exprimé par le grec.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom emphatique souligne que Dieu, qui interdit le mensonge, ne mentira pas lui-même.
- source_word: ἀδύνατον παρὰ τῷ θεῷ
  choice: impossible à Dieu
  rationale: Cette formulation idiomatique rend le sens de « impossible auprès de Dieu / pour Dieu » sans alourdir la phrase.
- source_word: ψεύσασθαι
  choice: de mentir
  rationale: L’infinitif grec désigne simplement l’acte de mentir.
theological_decisions:
- issue: La relation entre la toute-puissance divine et l’impossibilité de mentir
  choice: « rien n’est impossible à Dieu, si ce n’est de mentir »
  alternative: « Dieu peut tout, sauf mentir »
  rationale: La formulation retenue suit de près la structure paradoxale du grec et préserve sa tension théologique, sans la reformuler en proposition doctrinale plus explicite.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l’argument a fortiori et l’emphase de αὐτός, tout en évitant d’ajouter « nous » dans le texte principal.
