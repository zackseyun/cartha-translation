  text: Ἐπὶ τίνα ἐπιβλέψω, ἀλλ’ ἢ ἐπὶ τὸν πρᾶον καὶ ἡσύχιον καὶ τρέμοντά μου τὰ λόγια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/004.yaml
  text: “Upon whom shall I look[a], except upon the one who is gentle and quiet and trembles at my words?”
translation:
  language: fr
  text: « Sur qui porterai-je mon regard, sinon sur celui qui est doux et calme et qui tremble à mes paroles ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιβλέψω
  choice: porterai-je mon regard
  rationale: Rend naturellement l’idée de diriger son regard vers quelqu’un, tout en conservant le ton solennel de la question.
- source_word: πρᾶον
  choice: doux
  rationale: Équivalent français courant qui exprime la douceur et l’absence de rudesse sans ajouter une interprétation confessionnelle.
- source_word: ἡσύχιον
  choice: paisible
  rationale: Exprime ici le calme et la tranquillité de la personne; « silencieux » serait trop étroit.
- source_word: τρέμοντά μου τὰ λόγια
  choice: qui tremble à mes paroles
  rationale: Conserve l’image forte du grec et son complément, sans expliciter si ce tremblement relève de la crainte, du respect ou des deux.
theological_decisions:
- issue: Unité des trois qualités attribuées à la personne
  choice: « celui qui est doux et paisible et qui tremble »
  alternative: « celui qui est doux et paisible, et celui qui tremble »
  rationale: L’article unique τὸν gouverne les trois qualificatifs coordonnés et les présente comme les traits d’une seule personne.
translation_notes:
  register: Français moderne, international et digne. La formulation garde la structure interrogative et la tension de l’image biblique, sans surinterpréter le tremblement.
