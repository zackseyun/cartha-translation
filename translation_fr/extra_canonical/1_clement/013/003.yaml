source:
  edition: Funk 1901 (normalized OCR)
  text: ταύτῃ τῇ ἐντολῇ καὶ τοῖς παραγγέλμασι τούτοις στηρίξωμεν ἑαυτοὺς εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας τοῖς ἁγιοπρεπέσι λόγοις αὐτοῦ, ταπεινοφρονοῦντες· φησὶν γὰρ ὁ ἅγιος λόγος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
translation:
  language: fr
  text: 'Par ce commandement et ces injonctions, affermissons-nous afin de marcher dans l’obéissance à ses paroles dignes de la sainteté[a], avec humilité. Car la parole sainte dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses saintes paroles ».
    reason: Le grec ἁγιοπρεπής peut désigner ce qui est digne de la sainteté, lui convient, ou, plus simplement, ce qui a un caractère saint.
lexical_decisions:
- source_word: ἐντολῇ
  choice: commandement
  rationale: Rend directement l’idée d’un ordre normatif, dans un registre biblique naturel.
- source_word: παραγγέλμασι
  choice: exhortations
  rationale: Le terme désigne ici des prescriptions ou injonctions transmises; « exhortations » reste naturel en français tout en les distinguant du commandement au singulier.
- source_word: στηρίξωμεν ἑαυτούς
  choice: affermissons-nous
  rationale: Exprime l’idée de se rendre fermes ou constants, avec une tournure française concise.
- source_word: εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας
  choice: afin de marcher dans l’obéissance
  rationale: Conserve la métaphore de la marche et la valeur finale de εἰς τό, tout en rendant naturellement la construction participiale.
- source_word: ἁγιοπρεπέσι λόγοις
  choice: paroles dignes de la sainteté
  rationale: 'Préserve le sens composé de ἁγιοπρεπής: ce qui convient à la sainteté ou en est digne, plutôt que de réduire simplement l’expression à « saintes paroles ».'
- source_word: ταπεινοφρονοῦντες
  choice: avec humilité
  rationale: Rend idiomatiquement la disposition consistant à penser et agir humblement.
- source_word: ὁ ἅγιος λόγος
  choice: la parole sainte
  rationale: Maintient le singulier et la caractérisation explicite de la parole citée comme sainte.
theological_decisions:
- issue: Portée de ἁγιοπρεπής appliqué aux paroles
  choice: paroles dignes de la sainteté
  alternative: saintes paroles
  rationale: La traduction retenue préserve la nuance propre du composé grec, qui peut qualifier ce qui sied à la sainteté, sans imposer une identification théologique plus forte des paroles elles-mêmes.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le ton exhortatif collectif ainsi que la transition vers une citation d’autorité.
