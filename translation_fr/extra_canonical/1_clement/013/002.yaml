review_pass:
  verdict: revise
  source_fidelity: Le projet rend fidèlement la série d’impératifs et de futurs passifs, sans expliciter l’agent laissé implicite par le grec. Les correspondances lexicales essentielles (miséricorde, pardon, jugement, bonté, mesure) et le parallélisme sont bien préservés.
  naturalness: Le français est généralement naturel et soutenu. La dernière phrase, « De la mesure dont vous mesurez, on se servira pour vous mesurer », est toutefois pesante et moins idiomatique; elle peut être simplifiée tout en conservant la répétition de l’image de la mesure.
  terminology: « Compassion » est une option recevable pour ἐλεέω, et « bonté » rend convenablement χρηστεύεσθε dans ce contexte. « Pardonnez » conserve justement le sens éthique de ἀφίετε. Aucun terme théologique n’est indûment précisé.
