source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ εἶπεν· Ἐλεεῖτε, ἵνα ἐλεηθῆτε· ἀφίετε, ἵνα ἀφεθῇ ὑμῖν· ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν· ὡς δίδοτε, οὕτως δοθήσεται ὑμῖν· ὡς κρίνετε, οὕτως κριθήσεσθε· ὡς χρηστεύεσθε, οὕτως χρηστευθήσεται ὑμῖν· ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: fr
  text: 'Car il a dit : « Faites preuve de compassion, afin qu’on ait compassion de vous. Pardonnez, afin que vous soyez pardonnés. Comme vous agissez, ainsi agira-t-on envers vous. Comme vous donnez, ainsi vous donnera-t-on. Comme vous jugez, ainsi serez-vous jugés. Comme vous faites preuve de bonté, ainsi usera-t-on de bonté envers vous. On vous mesurera avec la mesure dont vous vous servez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε / ἐλεηθῆτε
  choice: Faites preuve de compassion / qu’on ait compassion de vous
  rationale: Rend le couple actif-passif du verbe ἐλεέω dans un français actuel, tout en conservant sa portée de compassion mise en pratique.
- source_word: ἀφίετε / ἀφεθῇ
  choice: Pardonnez / soyez pardonnés
  rationale: Dans ce contexte éthique, ἀφίημι désigne le pardon; la formulation maintient le parallélisme entre l’impératif actif et le passif.
- source_word: χρηστεύεσθε / χρηστευθήσεται
  choice: faites preuve de bonté / usera-t-on de bonté
  rationale: χρηστεύομαι exprime ici une conduite bienveillante ou bonne. La répétition de « bonté » préserve le lien lexical grec sans lourdeur excessive.
- source_word: ᾧ μέτρῳ μετρεῖτε
  choice: De la mesure dont vous mesurez
  rationale: Conserve l’image concrète et la répétition de μέτρον et μετρέω, familière dans la tradition évangélique.
theological_decisions:
- issue: Agent des passifs futurs
  choice: Employer le passif ou le pronom indéfini « on » sans nommer l’agent
  alternative: Expliciter « Dieu aura compassion de vous », « Dieu vous donnera », etc.
  rationale: Le grec laisse l’agent inexprimé. Il peut s’agir de passifs divins, mais le préciser lèverait une ambiguïté réelle du texte.
- issue: Portée de ἀφίημι
  choice: Traduire par le pardon personnel
  alternative: Traduire par la remise d’une dette ou la libération
  rationale: Le contexte de réciprocité morale favorise « pardonner », sans ajouter l’objet du pardon absent du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les répétitions de l’original sont volontairement conservés; les tournures avec « on » rendent naturellement les passifs grecs sans identifier leur agent.
