  to: 'Car il a dit : « Faites preuve de compassion, afin qu’on ait compassion de vous. Pardonnez, afin que vous soyez pardonnés. Comme vous agissez, ainsi agira-t-on envers vous. Comme vous donnez, ainsi vous donnera-t-on. Comme vous jugez, ainsi serez-vous jugés. Comme vous faites preuve de bonté, ainsi usera-t-on de bonté envers vous. On vous mesurera avec la mesure dont vous vous servez. »'
