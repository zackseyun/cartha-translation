source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
translation:
  language: fr
  text: 'Soyons donc humbles, frères : rejetons toute arrogance, toute prétention, toute folie et tout mouvement de colère, et faisons ce qui est écrit. Car le Saint-Esprit dit : « Que le sage ne tire pas fierté de sa sagesse, ni le fort de sa force, ni le riche de sa richesse ; mais que celui qui se glorifie se glorifie dans le Seigneur, afin de le rechercher et de pratiquer le droit et la justice[a]. » Souvenons-nous surtout des paroles du Seigneur Jésus, qu’il a prononcées en enseignant la douceur et la patience.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais que celui qui se glorifie se glorifie dans le Seigneur, en le recherchant et en pratiquant le droit et la justice. »'
    reason: Le groupe grec à l’infinitif peut exprimer le but (« afin de ») ou préciser la manière ou le contenu de l’action (« en »). Dans les deux cas, il demeure à l’intérieur de la parole attribuée au Saint-Esprit.
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  choice: Soyons donc humbles
  rationale: Rend naturellement l’exhortation à adopter une attitude humble, sans réduire le terme à un simple sentiment intérieur.
- source_word: ἀλαζονείαν καὶ τύφος
  choice: toute arrogance, toute prétention
  rationale: Distingue l’arrogance vantarde de l’orgueil infatué tout en employant un français courant.
- source_word: ὀργάς
  choice: tout mouvement de colère
  rationale: Le pluriel désigne des manifestations ou accès de colère ; cette formulation conserve cette nuance.
- source_word: καυχάσθω … ἐν κυρίῳ
  choice: tire fierté … du Seigneur
  rationale: Expression française naturelle qui préserve le contraste entre les motifs humains de fierté et le Seigneur, sans donner à « se vanter » une connotation exclusivement péjorative.
- source_word: κρίμα καὶ δικαιοσύνην
  choice: le droit et la justice
  rationale: Rend la paire biblique qui évoque une conduite conforme au juste jugement et à la droiture.
- source_word: ἐπιείκειαν καὶ μακροθυμίαν
  choice: la douceur et la patience
  rationale: Rend les qualités de modération bienveillante et de patience durable dans un registre clair et digne.
theological_decisions:
- issue: Étendue des paroles attribuées au Saint-Esprit
  choice: Inclure « afin de le rechercher et de pratiquer le droit et la justice » à l’intérieur de la citation.
  alternative: Fermer la citation après « du Seigneur » et rattacher la proposition suivante à l’exhortation de Clément.
  rationale: La syntaxe présente toute la séquence comme le contenu introduit par « le Saint-Esprit dit » ; ce choix suit aussi la forme adaptée de la citation scripturaire chez Clément.
- issue: Rapport syntaxique de τοῦ ἐκζητεῖν avec l’exhortation précédente
  choice: 'Le rendre par une proposition de but : « afin de le rechercher… »'
  alternative: 'Le comprendre comme une explicitation : « c’est-à-dire le rechercher… » ou « se glorifie de le rechercher… »'
  rationale: Le génitif de l’infinitif peut exprimer ici le but, mais son lien exact avec la proposition précédente demeure assez souple ; la note signale l’autre lecture plausible.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme exhortatif et l’énumération du grec sont conservés, avec de légers ajustements idiomatiques. La citation reste explicitement attribuée au Saint-Esprit et sa portée est maintenue jusqu’à « la justice ».
