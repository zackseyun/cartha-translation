revisions:
- from: 'Soyons donc humbles, frères, rejetons toute arrogance, toute prétention, toute folie et tout mouvement de colère, et mettons en pratique ce qui est écrit. Car le Saint-Esprit dit : « Que le sage ne tire pas fierté de sa sagesse, ni le fort de sa force, ni le riche de sa richesse ; mais que celui qui tire fierté de quelque chose tire fierté du Seigneur, afin de le rechercher et de pratiquer le droit et la justice[a]. » Souvenons-nous surtout des paroles du Seigneur Jésus, qu’il a prononcées pour enseigner la douceur et la patience.'
  to: 'Soyons donc humbles, frères : rejetons toute arrogance, toute prétention, toute folie et tout mouvement de colère, et faisons ce qui est écrit. Car le Saint-Esprit dit : « Que le sage ne tire pas fierté de sa sagesse, ni le fort de sa force, ni le riche de sa richesse ; mais que celui qui se glorifie se glorifie dans le Seigneur, afin de le rechercher et de pratiquer le droit et la justice[a]. » Souvenons-nous surtout des paroles du Seigneur Jésus, qu’il a prononcées en enseignant la douceur et la patience.'
  rationale: La révision retire un ajout absent du grec, conserve l’ensemble du groupe infinitif à l’intérieur de la citation conformément à la syntaxe et à la piste d’audit anglaise, et maintient en note la souplesse syntaxique réelle de τοῦ ἐκζητεῖν. Elle resserre également deux formulations pour une fidélité plus directe tout en gardant un français international moderne.
