id: 1CLEM.4.13
reference: 1 Clement 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλος Δαυὶδ φθόνον ἔσχεν οὐ μόνον ὑπὸ τῶν ἀλλοφύλων, ἀλλὰ καὶ ὑπὸ Σαοὺλ βασιλέως Ἰσραὴλ ἐδιώχθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/013.yaml
  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
translation:
  language: fr
  text: À cause de la jalousie, David fut l’objet de l’envie non seulement des étrangers[a], mais il fut aussi persécuté par Saül, roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : des Philistins.'
    reason: Dans le grec biblique, ἀλλόφυλοι peut désigner les étrangers en général ou, particulièrement dans les récits concernant David, les Philistins.
lexical_decisions:
- source_word: ζῆλος
  choice: jalousie
  rationale: Dans ce contexte négatif, le terme désigne la jalousie, thème causal du passage, plutôt qu’un zèle positif.
- source_word: φθόνον ἔσχεν … ὑπό
  choice: fut l’objet de l’envie … des
  rationale: Cette formulation française naturelle rend l’idée d’être la cible de l’envie sans laisser entendre que David l’éprouvait lui-même.
- source_word: ἀλλοφύλων
  choice: étrangers
  rationale: Le sens lexical général est « gens d’un autre peuple »; dans le contexte davidique, le terme peut toutefois désigner plus précisément les Philistins, possibilité signalée en note.
- source_word: ἐδιώχθη
  choice: fut persécuté
  rationale: Le passif français conserve directement le sens hostile du verbe et son parallélisme avec le fait d’être l’objet de l’envie.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La distinction entre ζῆλος (« jalousie ») et φθόνος (« envie ») est conservée, ainsi que le contraste entre l’envie des étrangers et la persécution exercée par Saül.
