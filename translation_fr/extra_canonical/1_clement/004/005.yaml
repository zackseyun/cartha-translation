lexical_decisions:
- source_word: ἡσύχασον
  choice: Tiens-toi tranquille
  rationale: L’impératif invite à l’apaisement ou à l’immobilité. Cette formulation naturelle conserve mieux cette nuance que le seul «Tais-toi».
- source_word: ἀποστροφὴ
  choice: élan
  rationale: Dans cette reprise de Genèse 4:7, le mot peut désigner le mouvement, l’orientation ou l’attirance vers quelqu’un. «Élan» préserve l’idée d’une orientation vers Caïn sans préciser indûment s’il s’agit d’un désir.
- source_word: ἄρξεις αὐτοῦ
  choice: tu domineras sur lui
  rationale: ἄρχω avec le génitif exprime ici l’exercice d’une autorité ou d’une maîtrise. Le futur grec est conservé sans être transformé en impératif moral.
theological_decisions:
- issue: Référent des pronoms masculins αὐτοῦ
  choice: Conserver «son» et «lui» sans identifier explicitement le référent
  alternative: Nommer le péché, Abel ou un autre référent implicite
  rationale: Le fragment grec ne nomme pas le référent. L’expliciter résoudrait une ambiguïté que le texte transmis maintient.
- issue: Valeur du futur ἄρξεις
  choice: «tu domineras»
  alternative: «tu dois le dominer» ou «domine-le»
  rationale: Le texte porte formellement un indicatif futur; une traduction prescriptive importerait une interprétation possible mais non explicite.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La coordination et les pronoms du grec sont conservés afin de ne pas effacer l’ambiguïté du passage.
