review_pass:
  verdict: revise
  source_fidelity: '« Tiens-toi tranquille » rend correctement l’impératif ἡσύχασον, et « tu domineras sur lui » conserve bien le futur ἄρξεις avec son complément au génitif. En revanche, « élan » est plus interprétatif que ἀποστροφή, qui évoque d’abord un fait de se tourner / une orientation. Le texte grec fourni présente en outre une difficulté textuelle : après πρὸς, l’objet attendu n’est pas écrit, alors que « vers toi » correspond à la forme de Genèse 4:7 et à l’audit anglais. La traduction peut conserver « toi », à condition de le signaler.'
  naturalness: La formulation est globalement naturelle et de registre approprié. « Son mouvement se tourne vers toi » serait lourd ; « son orientation est vers toi » est clair, moderne et évite la connotation psychologique ou énergique de « élan ».
  terminology: Il convient de conserver l’indétermination du référent de αὐτοῦ par « son » et « lui ». « Dominer sur » est recevable pour ἄρχειν avec le génitif et ne transforme pas le futur en commandement. Une note textuelle, plutôt qu’une identification du référent, est nécessaire pour l’objet implicite de πρὸς dans le texte fourni.
  issues:
  - severity: medium
    issue: « élan » interprète ἀποστροφή de manière trop marquée.
    rationale: Le nom grec désigne littéralement un retournement ou une orientation. « Élan » peut suggérer un désir ou une impulsion et s’éloigne de l’image directionnelle retenue aussi par l’anglais (« turning »).
  - severity: medium
    issue: « vers toi » n’est pas explicitement attesté dans la chaîne grecque fournie après πρὸς.
    rationale: La construction πρὸς exige normalement un complément, qui semble absent dans ce texte. « Toi » est très vraisemblablement soutenu par le parallèle de Genèse 4:7 et par l’audit anglais, mais cette restitution doit être rendue transparente par une note, sans prétendre que le mot figure dans le texte cité tel qu’il est fourni.
  revised_text: Tiens-toi tranquille ; son orientation est vers toi[a], et toi, tu domineras sur lui.»
  revised_footnotes:
  - marker: a
    text: Le grec fourni lit littéralement « vers, cependant, son retournement/orientation » et ne donne pas ici le complément attendu après « vers ». « Toi » est restitué d’après la formulation parallèle de Genèse 4:7, également suivie par la traduction anglaise.
    reason: Signaler une difficulté textuelle sans identifier le référent masculin ni imposer une interprétation théologique.
  revision_rationale: La révision remplace un terme français plus interprétatif par « orientation », qui maintient l’idée de direction ou de retournement de ἀποστροφή. Elle garde le futur et les pronoms non explicités. La note documente l’objet absent dans le grec fourni tout en expliquant sobrement la restitution suivie par la tradition textuelle parallèle et l’audit anglais.
