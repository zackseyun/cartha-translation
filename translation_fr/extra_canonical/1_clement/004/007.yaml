  text: See[a], brothers, jealousy and envy brought about fratricide.
translation:
  language: fr
  text: 'Voyez, frères : la jalousie et l’envie ont conduit au meurtre d’un frère.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Voyez
  rationale: L’impératif présent appelle directement les destinataires à considérer ce qui vient d’être exposé; « Voyez » reste naturel et conserve cette force exhortative.
- source_word: ζῆλος καὶ φθόνος
  choice: la jalousie et l’envie
  rationale: Les deux noms grecs, proches mais distincts, sont maintenus afin de préserver l’accumulation rhétorique.
- source_word: ἀδελφοκτονίαν
  choice: au meurtre d’un frère
  rationale: Cette formulation française naturelle restitue le composé grec et préserve l’écho entre ἀδελφοί (« frères ») et ἀδελφοκτονία (« meurtre d’un frère »), que « fratricide » rendrait moins perceptible.
- source_word: κατειργάσατο
  choice: ont conduit à
  rationale: Le verbe exprime ici le fait de produire ou d’entraîner un résultat. Le pluriel français s’accorde naturellement avec les deux sujets coordonnés.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Les deux termes affectifs sont conservés, ainsi que la répétition de « frère », importante dans l’argument sur les conséquences meurtrières de la jalousie et de l’envie.
