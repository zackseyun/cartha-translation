id: 1CLEM.4.10
reference: 1 Clement 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
translation:
  language: fr
  text: 'La jalousie contraignit Moïse à fuir loin de Pharaon, roi d’Égypte, lorsqu’il entendit l’un de ses compatriotes lui dire : « Qui t’a établi juge ou magistrat sur nous ? Veux-tu me tuer comme tu as tué hier l’Égyptien ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: la jalousie
  rationale: Rend le sens causal du terme dans cette série d’exemples, sans l’atténuer en simple rivalité.
- source_word: ἀπὸ προσώπου Φαραὼ
  choice: loin de Pharaon
  rationale: Expression française naturelle exprimant la fuite hors de la présence et de la portée de Pharaon.
- source_word: ὁμοφύλου
  choice: compatriotes
  rationale: Désigne ici un homme du même peuple que Moïse; « compatriote » est naturel et suffisamment précis.
- source_word: κριτὴν ἢ δικαστὴν
  choice: juge ou magistrat
  rationale: Conserve les deux termes judiciaires distincts employés par Clément, sans harmoniser avec la formulation familière de l’Exode.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: tuer / tué
  rationale: Dans ce contexte, le verbe signifie clairement mettre à mort.
theological_decisions:
- issue: Citation d’Exode 2.14 sous une forme propre à Clément
  choice: « juge ou magistrat »
  alternative: « chef ou juge »
  rationale: Le grec transmis de 1 Clément porte κριτήν ἢ δικαστήν, deux titres judiciaires; il ne faut pas réintroduire ἄρχοντα (« chef ») par harmonisation avec la Septante.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif littéraire. La citation conserve la répétition expressive de « tuer ».
