source:
  edition: Funk 1901 (normalized OCR)
  text: Γέγραπται γὰρ οὕτως· Καὶ ἐγένετο μεθ' ἡμέρας, ἤνεγκεν Κάϊν ἀπὸ τῶν καρπῶν τῆς γῆς θυσίαν τῷ θεῷ, καὶ Ἄβελ ἤνεγκεν καὶ αὐτὸς ἀπὸ τῶν πρωτοτόκων τῶν προβάτων καὶ ἀπὸ τῶν στεάτων αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: fr
  text: 'Car il est écrit ainsi : « Après quelque temps, Caïn apporta à Dieu une offrande provenant des produits de la terre, et Abel, lui aussi, apporta des premiers-nés parmi les moutons et de leur graisse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας
  choice: après quelque temps
  rationale: Expression française naturelle qui restitue l’indication temporelle indéfinie du grec, littéralement « après des jours ».
- source_word: θυσίαν
  choice: en offrande
  rationale: Dans ce contexte cultuel, « offrande » rend clairement ce qui est présenté à Dieu sans imposer l’idée moderne d’un sacrifice sanglant.
- source_word: ἀπὸ τῶν πρωτοτόκων τῶν προβάτων
  choice: des premiers-nés de son troupeau
  rationale: Le grec désigne les premiers-nés parmi les ovins; « troupeau » est idiomatique en français et convient au contexte d’Abel.
- source_word: ἀπὸ τῶν στεάτων αὐτῶν
  choice: de leur graisse
  rationale: Traduction directe de l’expression grecque, qui désigne les parties grasses des animaux offerts.
theological_decisions: []
