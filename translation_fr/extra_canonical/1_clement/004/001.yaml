revisions:
- from: 'Car il est écrit ceci : « Après quelque temps, Caïn apporta en offrande à Dieu des produits de la terre, et Abel, lui aussi, apporta des premiers-nés de son troupeau et de leur graisse. »'
  to: 'Car il est écrit ainsi : « Après quelque temps, Caïn apporta à Dieu une offrande provenant des produits de la terre, et Abel, lui aussi, apporta des premiers-nés parmi les moutons et de leur graisse. »'
  rationale: La révision retire l’ajout possessif, précise la référence ovine de πρόβατα et conserve l’ambiguïté syntaxique normale de « leur graisse », qui renvoie aux animaux mentionnés. Aucun appareil de note n’est requis.
  reviewer_model: gpt-5.6-terra
