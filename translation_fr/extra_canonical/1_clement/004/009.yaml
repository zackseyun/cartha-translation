  text: ζῆλος ἐποίησεν Ἰωσὴφ μέχρι θανάτου διωχθῆναι καὶ μέχρι δουλείας εἰσελθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/009.yaml
  text: Jealousy caused Joseph to be persecuted even to death and to enter into slavery[a].
translation:
  language: fr
  text: La jalousie fit que Joseph fut persécuté jusqu’à la mort et réduit à l’esclavage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « persécuté jusqu’à la mort et entrer dans l’esclavage ». Le grec emploie « jusqu’à » dans les deux expressions.'
    reason: Préserve la formulation et la répétition du grec, sans ajouter l’idée de risque ni suggérer que Joseph est nécessairement mort.
lexical_decisions:
- source_word: ζῆλος
  choice: la jalousie
  rationale: Dans cette série d’exemples négatifs, le terme désigne la jalousie ou l’envie qui pousse à nuire; « jalousie » convient au contexte fraternel de Joseph.
- source_word: ἐποίησεν … διωχθῆναι
  choice: fit que Joseph fut persécuté
  rationale: Reproduit la construction causative grecque tout en restant idiomatique en français.
- source_word: μέχρι θανάτου
  choice: jusqu’à risquer la mort
  rationale: Exprime la limite extrême atteinte par la persécution sans laisser entendre que Joseph est effectivement mort, ce que le récit évoqué exclut.
- source_word: μέχρι δουλείας εἰσελθεῖν
  choice: réduit en esclavage
  rationale: 'Rend naturellement l’aboutissement exprimé par « entrer jusqu’en esclavage »: Joseph passa à la condition d’esclave.'
theological_decisions:
- issue: La portée de « jusqu’à la mort » dans l’histoire de Joseph
  choice: jusqu’à risquer la mort
  alternative: jusqu’à la mort
  rationale: La formulation retenue préserve l’intensité de μέχρι θανάτου tout en évitant d’affirmer que la persécution tua Joseph; ses frères envisagèrent sa mort avant de le vendre.
translation_notes:
  register: Français moderne, clair et digne. « Réduit en esclavage » est plus naturel que « entrer dans l’esclavage » dans ce contexte causatif; la note conserve la structure littérale du grec.
