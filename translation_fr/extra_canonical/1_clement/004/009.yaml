  source_fidelity: La traduction de ζῆλος par « jalousie » et de δουλείας par « esclavage » est juste. Cependant, « jusqu’à risquer la mort » interprète μέχρι θανάτου en ajoutant l’idée de risque, qui n’est pas exprimée par le grec. Le texte grec conserve la formulation « jusqu’à la mort », sans préciser explicitement si la mort a eu lieu ou si elle marque le terme extrême de la persécution.
  naturalness: « La jalousie fit que Joseph fut persécuté jusqu’à la mort et réduit à l’esclavage » est naturel dans un registre biblique moderne et conserve la construction causative et les deux infinitifs passifs grecs sans lourdeur excessive.
  terminology: '« Réduit à l’esclavage » rend idiomatiquement εἰσελθεῖν εἰς δουλείαν dans ce contexte. La note précédente était imprécise : « entrer jusqu’en esclavage » ne correspond pas à la construction grecque ; μέχρι qualifie l’aboutissement (« jusqu’à l’esclavage »), tandis que εἰσελθεῖν signifie « entrer ».'
