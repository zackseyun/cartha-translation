  text: καὶ εἶπεν ὁ θεὸς πρὸς Κάϊν· Ἱνατί περίλυπος ἐγένου, καὶ ἱνατί συνέπεσεν τὸ πρόσωπόν σου; οὐκ ἐὰν ὀρθῶς προσενέγκῃς, ὀρθῶς δὲ μὴ διέλῃς, ἥμαρτες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: fr
  text: 'Et Dieu dit à Caïn : « Pourquoi es-tu devenu affligé, et pourquoi ton visage s’est-il abattu ? Si tu présentes correctement ton offrande, mais que tu ne la divises pas correctement, n’as-tu pas péché ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: triste
  rationale: Rend naturellement l’état de profonde affliction dans ce contexte sans ajouter explicitement un degré d’intensité absent de la formulation.
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  choice: ton visage s’est-il abattu
  rationale: Conserve l’image grecque du visage qui tombe tout en restant intelligible en français moderne.
- source_word: προσενέγκῃς
  choice: tu présentes ton offrande
  rationale: Le verbe signifie apporter ou présenter, et le contexte cultuel implicite justifie l’ajout explicatif de « ton offrande ».
- source_word: διέλῃς
  choice: tu ne la partages pas
  rationale: Préserve le sens concret de diviser ou répartir ainsi que l’ambiguïté de la citation grecque, sans le remplacer par une interprétation cultuelle plus précise.
- source_word: ἥμαρτες
  choice: n’as-tu pas péché
  rationale: Correspond directement au vocabulaire moral et théologique du grec.
theological_decisions:
- issue: Sens de « diviser correctement » dans la citation de Genèse 4:7 selon la Septante
  choice: « que tu ne la partages pas correctement »
  alternative: « que tu ne la répartisses pas correctement » ou une reformulation interprétative liée à l’offrande
  rationale: Le grec conserve une formulation difficile et potentiellement ambiguë. La traduction maintient cette tension au lieu de préciser sans preuve s’il s’agit du partage, de la répartition ou d’un acte rituel particulier.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative et le parallélisme du grec sont conservés; « ton offrande » explicite seulement l’objet sous-entendu par le contexte.
