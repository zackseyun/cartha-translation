  yaml_path: translation/extra_canonical/1_clement/004/006.yaml
  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: fr
  text: 'Caïn dit à Abel, son frère : « Allons dans le champ. » Il arriva que, alors qu’ils étaient dans le champ, Caïn se dressa contre Abel, son frère, et le tua.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  choice: Allons dans la campagne
  rationale: Dans ce contexte narratif, διέρχομαι avec εἰς exprime le déplacement vers un lieu plutôt que la traversée de celui-ci. « La campagne » rend naturellement πεδίον comme espace ouvert hors du lieu où ils se trouvaient.
- source_word: ἀνέστη … ἐπʼ
  choice: se dressa contre
  rationale: Cette formulation conserve l’image et l’hostilité de la tournure grecque sans réduire le verbe à un simple mouvement physique.
- source_word: ἀπέκτεινεν
  choice: tua
  rationale: Équivalent français direct et naturel du verbe grec.
