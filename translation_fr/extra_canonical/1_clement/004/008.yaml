  yaml_path: translation/extra_canonical/1_clement/004/008.yaml
  text: Because of jealousy our father Jacob fled from the face of Esau his brother.
translation:
  language: fr
  text: À cause de la jalousie, notre père Jacob s’enfuit loin d’Ésaü, son frère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: À cause de la jalousie
  rationale: Le grec exprime la cause. « Jalousie » rend naturellement ζῆλος dans ce contexte, sans préciser explicitement qui l’éprouvait.
- source_word: ἀπέδρα
  choice: s’enfuit
  rationale: Ce verbe indique une fuite ou une évasion, ici rendue de façon directe et idiomatique.
- source_word: ἀπὸ προσώπου Ἠσαῦ
  choice: loin d’Ésaü
  rationale: L’expression sémitisante « loin de la face d’Ésaü » signifie qu’il fuit sa présence; la formulation retenue est naturelle en français moderne.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: son frère
  rationale: Restitution claire et fidèle de l’apposition grecque.
theological_decisions:
- issue: Agent de la jalousie
  choice: Ne pas identifier explicitement la personne jalouse
  alternative: « À cause de la jalousie d’Ésaü »
  rationale: Le grec ne comporte aucun complément précisant l’agent; la traduction préserve donc cette indétermination.
translation_notes:
  register: Français moderne, simple et digne. La tournure grecque littérale « de devant la face d’Ésaü » est rendue idiomatiquement sans modifier le sens.
