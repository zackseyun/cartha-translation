  yaml_path: translation/extra_canonical/1_clement/004/011.yaml
  text: Because of jealousy Aaron and Miriam lodged outside the camp.
translation:
  language: fr
  text: À cause de la jalousie, Aaron et Miriam campèrent hors du camp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  choice: À cause de la jalousie
  rationale: Le tour causal est conservé. Malgré la forme transmise ζῆλος, le sens attendu dans cette série d’exemples est celui de la jalousie.
- source_word: παρεμβολῆς
  choice: camp
  rationale: Dans ce contexte narratif, le mot désigne le campement d’Israël.
- source_word: ηὐλίσθησαν
  choice: durent camper
  rationale: Le verbe signifie passer la nuit ou séjourner dans un campement. « Camper » rend naturellement l’image en français; « durent » explicite la conséquence subie suggérée par le contexte, sans en préciser la durée.
theological_decisions:
- issue: Responsabilité respective d’Aaron et de Miriam
  choice: Conserver les deux noms comme sujets de la même conséquence
  alternative: Distinguer Miriam, explicitement frappée et exclue selon Nombres 12, d’Aaron
  rationale: Le texte grec de 1 Clément attribue directement aux deux personnages le séjour hors du camp; la traduction ne corrige pas l’auteur à partir du récit biblique parallèle.
translation_notes:
  register: Français moderne, clair et digne. La répétition « camper hors du camp » reflète naturellement le jeu lexical du grec entre le verbe de campement et le nom « camp ».
