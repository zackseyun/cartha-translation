id: 1CLEM.4.12
reference: 1 Clement 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
translation:
  language: fr
  text: La jalousie fit descendre Dathan et Abiram vivants dans le séjour des morts, parce qu’ils s’étaient révoltés contre Moïse, le serviteur de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: la jalousie
  rationale: Rend directement le motif moral personnifié qui ouvre la phrase; « jalousie » convient au contexte de la série d’exemples de 1 Clément 4.
- source_word: ζῶντας κατήγαγεν εἰς ᾅδου
  choice: fit descendre … vivants dans le séjour des morts
  rationale: Conserve le caractère causatif, la descente et le fait que Dathan et Abiram furent engloutis vivants. « Séjour des morts » exprime ici le domaine des morts sans importer les connotations modernes d’« enfer ».
- source_word: στασιάσαι
  choice: s’étaient révoltés
  rationale: Exprime l’insurrection et l’opposition factieuse, plus fortement qu’une simple contestation.
- source_word: θεράποντα τοῦ θεοῦ
  choice: le serviteur de Dieu
  rationale: Dans la tradition biblique concernant Moïse, θεράπων est un titre honorifique; « serviteur » en restitue mieux la résonance que « assistant » ou « préposé ».
theological_decisions:
- issue: Sens de ᾅδης
  choice: le séjour des morts
  alternative: l’Hadès
  rationale: Le grec désigne ici le domaine des morts où les rebelles descendent vivants; la formulation choisie préserve ce sens sans l’identifier explicitement au lieu du châtiment final.
- issue: Portée du titre θεράπων appliqué à Moïse
  choice: le serviteur de Dieu
  alternative: l’assistant de Dieu
  rationale: « Serviteur de Dieu » maintient la dignité biblique du titre et la gravité d’une révolte contre celui que Dieu a établi, sans ajouter de précision confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en conservant la personnification de la jalousie, la descente vivants au séjour des morts et le titre honorifique de Moïse.
