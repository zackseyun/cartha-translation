source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶδεν ὁ θεὸς ἐπὶ Ἄβελ καὶ ἐπὶ τοῖς δώροις αὐτοῦ, ἐπὶ δὲ Κάϊν καὶ ἐπὶ ταῖς θυσίαις αὐτοῦ οὐ προσέσχεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
translation:
  language: fr
  text: Et Dieu porta son regard sur Abel et sur ses offrandes, mais il ne prêta attention ni à Caïn ni à ses sacrifices.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν ... ἐπί
  choice: porta son regard sur
  rationale: Rend l’expression grecque de façon naturelle et digne, tout en conservant l’idée d’un regard favorable dans ce contexte sacrificiel.
- source_word: δῶρα
  choice: offrandes
  rationale: Dans un contexte cultuel, « offrandes » exprime plus précisément le sens de dons présentés à Dieu que le terme général « dons ».
- source_word: θυσίαις
  choice: sacrifices
  rationale: Correspond directement au vocabulaire sacrificiel grec et préserve le contraste lexical avec les offrandes d’Abel.
- source_word: οὐ προσέσχεν
  choice: ne prêta attention ni à… ni à…
  rationale: Exprime clairement le refus d’accorder considération ou faveur, avec une construction française naturelle qui maintient Caïn et ses sacrifices comme deux objets coordonnés.
theological_decisions:
- issue: Nature du regard de Dieu sur Abel
  choice: porta son regard sur
  alternative: regarda
  rationale: La formulation retenue laisse entendre l’accueil favorable suggéré par le contexte sans expliciter davantage ce que le grec ne formule pas directement.
- issue: Portée de l’absence d’attention divine
  choice: ni à Caïn ni à ses sacrifices
  alternative: à Caïn et à ses sacrifices, il ne prêta aucune attention
  rationale: La négation corrélative française restitue naturellement les deux compléments grecs sans expliquer la raison du rejet ni résoudre la tension entre la personne et son sacrifice.
translation_notes:
  register: Français international moderne, clair et digne, avec une légère tonalité scripturaire. Le parallélisme entre Abel et Caïn ainsi que la distinction entre « offrandes » et « sacrifices » sont conservés.
