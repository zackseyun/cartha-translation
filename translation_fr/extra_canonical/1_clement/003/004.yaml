revisions:
- from: 'Voilà pourquoi la justice et la paix se sont retirées bien loin : chacun a abandonné la crainte de Dieu et sa foi en lui s’est obscurcie[a] ; personne ne marche plus selon les prescriptions de ses commandements ni ne mène une vie digne du Christ. Au contraire, chacun suit les désirs de son cœur mauvais et s’est livré à une jalousie injuste et impie[b], par laquelle la mort est aussi entrée dans le monde.'
  to: 'Voilà pourquoi la justice et la paix se sont retirées bien loin : chacun a abandonné la crainte de Dieu et est devenu aveugle dans la foi en lui[a], ne marchant pas selon les prescriptions de ses commandements et ne menant pas une vie qui convienne au Christ, mais suivant les désirs de son cœur mauvais, ayant embrassé une jalousie injuste et impie[b], par laquelle la mort est aussi entrée dans le monde.'
  rationale: La révision retire les éléments non exprimés (« personne », « plus »), rétablit la construction répétée autour de « chacun » et évite de rendre deux fois le seul pronom grec dans l’expression relative à la foi. Elle conserve les ambiguïtés pertinentes en note et maintient le sens, le registre et les termes établis du projet.
