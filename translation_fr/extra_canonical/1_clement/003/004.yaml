id: 1CLEM.3.4
reference: 1 Clement 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
translation:
  language: fr
  text: 'Voilà pourquoi la justice et la paix se sont retirées bien loin : chacun a abandonné la crainte de Dieu et est devenu aveugle dans la foi en lui[a], ne marchant pas selon les prescriptions de ses commandements et ne menant pas une vie qui convienne au Christ, mais suivant les désirs de son cœur mauvais, ayant embrassé une jalousie injuste et impie[b], par laquelle la mort est aussi entrée dans le monde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « est devenu aveugle dans sa foi » ou « dans sa fidélité ».'
    reason: Le rapport de αὐτοῦ à πίστις demeure grammaticalement ambigu; le texte retient « foi en lui » en parallèle avec « la crainte de Dieu ».
  - marker: b
    text: Le mot grec peut aussi signifier « zèle » ou « envie » ; ici, les qualificatifs « injuste et impie » indiquent un sens négatif.
    reason: Préserver l’étendue sémantique de ζῆλος tout en expliquant le choix contextuel de « jalousie ».
lexical_decisions:
- source_word: δικαιοσύνη καὶ εἰρήνη
  choice: la justice et la paix
  rationale: Rend directement les deux noms abstraits et conserve leur personnification comme réalités qui se retirent.
- source_word: τὰ νόμιμα τῶν προσταγμάτων αὐτοῦ
  choice: les prescriptions de ses commandements
  rationale: « Prescriptions » restitue le sens de règles établies de νόμιμα, tandis que le complément « de ses commandements » représente προσταγμάτων αὐτοῦ.
- source_word: πολιτεύεσθαι κατὰ τὸ καθῆκον τῷ Χριστῷ
  choice: mener une vie digne du Christ
  rationale: Dans ce contexte moral, πολιτεύεσθαι désigne la manière de vivre ou de se conduire; la formulation française exprime naturellement ce qui convient au Christ.
- source_word: ζῆλον ἄδικον καὶ ἀσεβῆ
  choice: une jalousie injuste et impie
  rationale: Dans le contexte de 1 Clément, ζῆλος désigne la jalousie ou l’envie destructrice plutôt qu’un zèle positif.
- source_word: δι’ οὗ
  choice: par laquelle
  rationale: Le relatif reprend naturellement « jalousie » et conserve l’affirmation causale selon laquelle c’est par elle que la mort est entrée dans le monde.
theological_decisions:
- issue: Sens de ἐν τῇ πίστει αὐτοῦ
  choice: sa foi en lui s’est obscurcie
  alternative: il est devenu incapable de discerner dans sa foi / dans sa fidélité
  rationale: Le pronom αὐτοῦ peut être rapporté à Dieu comme complément de « foi » ou compris possessivement. Le contexte parallèle avec « la crainte de Dieu » favorise « foi en lui », tout en justifiant une note sur l’ambiguïté.
- issue: Rendu de Χριστός
  choice: le Christ
  alternative: le Messie
  rationale: Dans cette lettre adressée à une communauté chrétienne, Χριστός fonctionne comme le titre ou nom chrétien établi; « le Christ » respecte ce registre sans explicitation interprétative.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque est divisée en deux phrases afin de préserver la clarté, tout en maintenant la progression causale et le contraste introduit par ἀλλά.
