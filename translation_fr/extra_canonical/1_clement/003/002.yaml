base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/002.yaml
  text: From this came jealousy and envy, strife and faction, persecution and disorder, war and captivity. 3 Thus the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders. 4 Because of this, righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became shortsighted in faith in him, neither walking in the lawful ways of his commandments nor conducting himself in a manner fitting for the Messiah, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy, through which death also entered into the world.
translation:
  language: fr
  text: '2 De là sont venus la jalousie et l’envie, la querelle et la dissension, la persécution et le désordre, la guerre et la captivité.


    3 Ainsi, les méprisés se sont soulevés contre les honorés, les sans-gloire contre les glorieux, les insensés contre les sages, les jeunes contre les anciens.


    4 C’est pourquoi la justice et la paix se sont retirées bien loin : chacun a abandonné la crainte de Dieu et est devenu myope dans sa foi en lui ; chacun ne marche pas selon les prescriptions de ses commandements et ne se conduit pas d’une manière digne du Christ. Au contraire, chacun suit les désirs de son cœur mauvais, ayant adopté une jalousie injuste et impie, par laquelle la mort est aussi entrée dans le monde.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος καὶ φθόνος
  choice: la jalousie et l’envie
  rationale: 'Conserve les deux termes proches mais distincts : ζῆλος désigne ici une rivalité jalouse, tandis que φθόνος exprime l’envie malveillante.'
- source_word: ἔρις καὶ στάσις
  choice: la querelle et la révolte
  rationale: ἔρις évoque le conflit ou la dispute ; στάσις désigne une dissension organisée, une faction ou un soulèvement. « Révolte » convient au contexte communautaire et prépare « se sont soulevés » au verset suivant.
- source_word: ἀκαταστασία
  choice: le désordre
  rationale: Rend le manque de stabilité et l’agitation sans surinterpréter le terme comme une anarchie politique.
- source_word: οἱ ἄτιμοι ... οἱ ἐντίμοι
  choice: les méprisés ... les honorés
  rationale: La paire exprime une opposition de considération ou d’honneur. « Méprisés » est plus naturel en français que « déshonorés » pour désigner des personnes sans estime sociale.
- source_word: οἱ ἄδοξοι ... οἱ ἐνδόξους
  choice: les sans-gloire ... les glorieux
  rationale: Maintient la répétition autour de δόξα et la structure rhétorique du grec, malgré le caractère marqué de « sans-gloire ».
- source_word: οἱ πρεσβυτέρους
  choice: les anciens
  rationale: Le contexte oppose les jeunes aux plus âgés et peut aussi évoquer des responsables communautaires. « Anciens » préserve cette possible double portée.
- source_word: ἀμβλυωπῆσαι
  choice: sa vue s’est brouillée
  rationale: Le verbe signifie littéralement voir de manière émoussée ou indistincte. Cette formulation conserve l’image visuelle dans un français naturel.
- source_word: τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ
  choice: les voies prescrites par ses commandements
  rationale: Rend l’idée de prescriptions normatives liées aux commandements sans donner à νόμιμα le sens étroit de législation civile.
- source_word: πολιτεύεσθαι
  choice: se conduit
  rationale: Dans ce contexte éthique, le verbe concerne la manière de vivre ou de se comporter, plus que l’exercice de la citoyenneté.
- source_word: τῷ Χριστῷ
  choice: du Christ
  rationale: Χριστός fonctionne ici comme le titre ou nom reçu dans la communauté chrétienne ancienne ; « Christ » est le rendu français naturel et transparent.
- source_word: ἀνειληφότας
  choice: après s’être laissé gagner par
  rationale: Le participe signifie littéralement avoir pris ou assumé. La tournure choisie exprime l’emprise acquise par cette jalousie sans l’aplatir en simple possession.
theological_decisions:
- issue: Portée de « dans la foi en lui » (ἐν τῇ πίστει αὐτοῦ)
  choice: dans la foi en lui
  alternative: dans sa fidélité
  rationale: Le génitif αὐτοῦ peut théoriquement se rapporter à la foi ou fidélité de Dieu, mais la construction avec l’affaiblissement de la vue et le comportement des destinataires favorise ici leur foi orientée vers Dieu. La formulation retenue suit ce sens sans ajouter d’explication doctrinale.
- issue: Référence à l’entrée de la mort dans le monde
  choice: celle par laquelle la mort est aussi entrée dans le monde
  alternative: par laquelle la mort est entrée dans le monde
  rationale: Conserve καί (« aussi ») et le lien explicite établi par l’auteur entre la jalousie impie et l’entrée de la mort, probablement en écho au récit de Caïn et à Sagesse 2.24, sans préciser lui-même l’allusion.
- issue: Sens de πρεσβύτεροι
  choice: anciens
  alternative: personnes âgées
  rationale: « Anciens » laisse ouverte la possibilité que le mot désigne à la fois les aînés et des responsables reconnus de la communauté, tension pertinente dans 1 Clément.
translation_notes:
  register: Français moderne, international et digne, avec conservation des séries antithétiques et du rythme accusateur du grec. La ponctuation répartit la longue période du verset 4 en phrases lisibles sans modifier sa progression logique. Aucun marqueur de note n’est requis, puisqu’aucune note de bas de page n’est proposée.
