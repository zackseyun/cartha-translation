source:
  edition: Funk 1901 (normalized OCR)
  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
translation:
  language: fr
  text: 'Toute gloire et prospérité vous ont été accordées, et ce qui est écrit s’est accompli : « Il a mangé et bu, il a pris de l’ampleur et s’est engraissé, et le bien-aimé a rué[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’est rebellé » ; le verbe évoque littéralement la ruade d’un animal rétif.
    reason: Le grec porte à la fois l’image concrète du coup de pied et l’idée figurée de rébellion.
lexical_decisions:
- source_word: πλατυσμός
  choice: abondance
  rationale: Le nom peut désigner l’élargissement ou, au sens figuré, l’aisance et la prospérité. « Abondance » exprime naturellement ici le bien-être accordé aux destinataires tout en faisant écho à l’élargissement de la citation.
- source_word: ἐπλατύνθη
  choice: s’est élargi
  rationale: Cette traduction conserve l’image concrète de l’élargissement et le lien lexical avec πλατυσμός, sans réduire le terme à la seule prise de poids.
- source_word: ἐπαχύνθη
  choice: engraissé
  rationale: Le verbe évoque le fait de devenir gras ou épais; « engraissé » convient à l’image d’un être repu.
- source_word: ἀπελάκτισεν
  choice: a rué
  rationale: Le verbe décrit littéralement le coup de pied d’un animal rétif et suggère ainsi la rébellion. « Ruer » préserve cette métaphore en français.
- source_word: ὁ ἠγαπημένος
  choice: le bien-aimé
  rationale: Rendu substantivé qui conserve la désignation affective et sa tension avec la rébellion qui suit.
theological_decisions:
- issue: Portée métaphorique de ἀπελάκτισεν
  choice: Conserver l’image animale par « a rué »
  alternative: « s’est rebellé » ou « a regimbé »
  rationale: Le grec associe le geste concret d’un animal repu à l’idée de révolte. Le texte principal maintient l’image, tandis que la note en explicite la portée possible sans trancher entre geste et métaphore.
translation_notes:
  register: Français moderne, sobre et digne. La structure de la citation est conservée, avec une ponctuation légèrement fluidifiée par « puis ». Le contraste entre les bienfaits reçus, l’embonpoint et la rébellion demeure perceptible.
