revisions:
- from: 'Toute gloire et toute abondance vous ont été accordées, et ce qui est écrit s’est accompli : « Il a mangé et bu, il s’est élargi et engraissé, puis le bien-aimé a rué[a]. »'
  to: 'Toute gloire et prospérité vous ont été accordées, et ce qui est écrit s’est accompli : « Il a mangé et bu, il a pris de l’ampleur et s’est engraissé, et le bien-aimé a rué[a]. »'
  rationale: La révision évite d'étendre « toute » au second nom, emploie « prospérité » pour le bien-être évoqué par πλατυσμός, et remplace « s’est élargi » par une expression française plus idiomatique qui conserve l'image. La métaphore de la ruade et son possible sens de rébellion restent préservés par le texte et la note.
