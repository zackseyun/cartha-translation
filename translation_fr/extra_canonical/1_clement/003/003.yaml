id: 1CLEM.3.3
reference: 1 Clement 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως ἐπηγέρθησαν οἱ ἄτιμοι ἐπὶ τοὺς ἐντίμους, οἱ ἄδοξοι ἐπὶ τοὺς ἐνδόξους, οἱ ἄφρονες ἐπὶ τοὺς φρονίμους, οἱ νέοι ἐπὶ τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/003.yaml
  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: fr
  text: Ainsi, les gens méprisés se sont soulevés contre les gens estimés, les gens sans gloire contre les gens glorieux, les insensés contre les gens sensés, les jeunes contre les anciens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτιμοι / ἐντίμους
  choice: les gens méprisés / les gens estimés
  rationale: Rend l’opposition entre ceux qui sont privés d’honneur ou tenus en peu d’estime et ceux qui jouissent de considération, dans un français naturel.
- source_word: ἄδοξοι / ἐνδόξους
  choice: les gens sans gloire / les gens glorieux
  rationale: Préserve le parallélisme lexical fondé sur δόξα ainsi que la distinction avec le couple précédent.
- source_word: ἄφρονες / φρονίμους
  choice: les insensés / les gens sensés
  rationale: Exprime l’opposition entre manque de discernement et bon sens ou prudence, sans surcharger le registre.
- source_word: νέοι / πρεσβυτέρους
  choice: les jeunes / les anciens
  rationale: « Anciens » conserve l’ambiguïté possible entre les personnes plus âgées et celles qui ont un rang d’ancien, sans la résoudre artificiellement.
- source_word: ἐπηγέρθησαν ἐπὶ
  choice: se sont soulevés contre
  rationale: Reproduit la valeur hostile du verbe et de la préposition dans ce contexte.
theological_decisions:
- issue: Sens de πρεσβυτέρους
  choice: les anciens
  alternative: les personnes âgées / les responsables de l’Église
  rationale: Le grec peut désigner les aînés par l’âge ou les anciens en fonction; le contexte immédiat ne justifie pas de trancher explicitement.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « les gens » dans les deux premiers couples évite de substantiver lourdement des adjectifs peu naturels en français, tandis que la structure parallèle du grec est maintenue.
