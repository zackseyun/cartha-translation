source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
translation:
  language: fr
  text: « Pars[a] de ton pays, de ta parenté et de la maison de ton père, vers le pays que je te montrerai. Je ferai de toi une grande nation, je te bénirai et je rendrai ton nom grand, et tu seras béni. Je bénirai ceux qui te bénissent, je maudirai ceux qui te maudissent, et en toi toutes les tribus de la terre seront bénies. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Va-t’en » / « Éloigne-toi » ; le verbe signifie partir, et non littéralement sortir.'
    reason: Signale la nuance propre au verbe ἄπελθε employé par Clément.
lexical_decisions:
- source_word: Ἄπελθε
  choice: Pars
  rationale: Rend directement l’impératif de ἀπέρχομαι, « partir, s’en aller », tout en respectant la variation lexicale de Clément par rapport à l’expression grecque traditionnelle « sortir ».
- source_word: συγγενείας
  choice: parenté
  rationale: Désigne ici l’ensemble des proches liés par la naissance, plutôt que la seule famille immédiate.
- source_word: μεγαλυνῶ τὸ ὄνομά σου
  choice: je rendrai ton nom grand
  rationale: Conserve l’image et la portée de μεγαλύνω sans la réduire au seul sens moderne de « rendre célèbre ».
- source_word: φυλαὶ
  choice: tribus
  rationale: Équivalent direct de φυλαί, qui désigne des groupes humains fondés sur la filiation ou l’appartenance collective.
theological_decisions:
- issue: Valeur de ἐν σοὶ dans la promesse finale
  choice: en toi
  alternative: par toi
  rationale: La formulation littérale préserve l’ambiguïté entre association, représentation et moyen de bénédiction, sans imposer une interprétation théologique particulière.
- issue: Prédicat εὐλογημένος
  choice: tu seras béni
  alternative: tu seras une bénédiction
  rationale: Le texte de Clément porte l’adjectif signifiant « béni »; la traduction ne l’harmonise donc pas avec une autre forme textuelle de Genèse 12.2.
translation_notes:
  register: Français international actuel, solennel mais accessible. La coordination répétée conserve la cadence scripturaire du passage, tandis que « pour aller vers » explicite naturellement en français la destination introduite par εἰς.
