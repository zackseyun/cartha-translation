source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ πίστιν καὶ φιλοξενίαν ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ, καὶ διʼ ὑπακοῆς προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ πρὸς ἓν τῶν ὀρέων ὧν ἔδειξεν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
translation:
  language: fr
  text: En raison de sa foi et de son hospitalité, un fils lui fut donné dans sa vieillesse, et, par obéissance, il l’offrit en sacrifice à Dieu sur l’une des montagnes que Dieu lui avait indiquées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστιν
  choice: foi
  rationale: Équivalent français direct, naturel et théologiquement non restrictif.
- source_word: φιλοξενίαν
  choice: hospitalité
  rationale: Rend le sens d’accueil généreux des étrangers sans paraphrase excessive.
- source_word: ἐν γήρᾳ
  choice: dans sa vieillesse
  rationale: Expression française naturelle qui conserve l’idée d’un âge avancé.
- source_word: διʼ ὑπακοῆς
  choice: par obéissance
  rationale: Conserve la construction instrumentale et le lien explicite entre l’obéissance et l’offrande.
- source_word: προσήνεγκεν αὐτὸν θυσίαν
  choice: il l’offrit en sacrifice
  rationale: Formulation idiomatique et fidèle à l’acte sacrificiel exprimé en grec.
- source_word: πρὸς ἓν τῶν ὀρέων
  choice: sur l’une des montagnes
  rationale: Dans le contexte du sacrifice d’Abraham, cette formulation française exprime naturellement le lieu visé, tandis qu’une note signale la valeur plus littérale de πρός.
- source_word: ὧν ἔδειξεν αὐτῷ
  choice: que celui-ci lui avait indiquées
  rationale: Le plus-que-parfait rend l’indication antérieure à l’offrande; « celui-ci » renvoie naturellement à Dieu dans le contexte immédiat sans répéter son nom.
theological_decisions:
- issue: Lien entre la foi, l’hospitalité et le don du fils
  choice: « En raison de sa foi et de son hospitalité »
  alternative: « Par la foi et l’hospitalité »
  rationale: Le grec διά avec l’accusatif exprime ici la cause; la formulation choisie conserve ce lien sans préciser davantage la nature théologique de la récompense.
- issue: Sujet de ἔδειξεν
  choice: « celui-ci », renvoyant contextuellement à Dieu
  alternative: « qu’il lui avait indiquées », avec un pronom plus ambigu
  rationale: Le récit d’Abraham identifie Dieu comme celui qui indique la montagne. « Celui-ci » clarifie la chaîne pronominale en français sans introduire de contenu doctrinal supplémentaire.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe est légèrement déployée en deux phrases pour éviter une période lourde et clarifier la progression entre le don du fils et son offrande.
