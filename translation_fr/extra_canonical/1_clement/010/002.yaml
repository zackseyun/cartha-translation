source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος δὲ ὑπακοῇ ἐξῆλθεν ἐκ τῆς γῆς αὐτοῦ καὶ ἐκ τῆς συγγενείας αὐτοῦ καὶ ἐκ τοῦ οἴκου τοῦ πατρὸς αὐτοῦ, ὅπως γῆν ὀλίγην καὶ συγγένειαν ἀσθενῆ καὶ οἶκον μικρὸν καταλιπὼν κληρονομήσῃ τὰς ἐπαγγελίας τοῦ θεοῦ. λέγει γὰρ αὐτῷ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: fr
  text: 'C’est par obéissance qu’il quitta sa terre, sa parenté et la maison de son père, afin que, après avoir laissé derrière lui une terre peu étendue, une parenté faible et une petite maison, il hérite des promesses de Dieu. Car il lui dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  choice: par obéissance
  rationale: Exprime naturellement en français la cause ou la manière indiquée par le datif grec, sans ajouter d’objet implicite.
- source_word: γῆς
  choice: pays
  rationale: Dans le contexte du départ d’Abraham, « pays » rend mieux le territoire d’origine que le littéral « terre ».
- source_word: συγγενείας
  choice: parenté
  rationale: Conserve le sens collectif du groupe familial et permet de reprendre le même terme dans la seconde proposition.
- source_word: ἀσθενῆ
  choice: sans puissance
  rationale: Rend la faiblesse sociale ou numérique du groupe familial sans suggérer nécessairement une maladie physique.
- source_word: οἶκον μικρὸν
  choice: une modeste maison
  rationale: « Maison » peut désigner le foyer ou la maisonnée; « modeste » préserve cette latitude mieux que « petite », qui évoquerait surtout un bâtiment.
- source_word: κληρονομήσῃ
  choice: hériter
  rationale: Maintient l’image successorale du verbe grec et son lien avec les promesses divines.
- source_word: λέγει γὰρ αὐτῷ
  choice: Car Dieu lui dit
  rationale: Le sujet implicite renvoie naturellement à Dieu, nommé immédiatement auparavant; l’explicitation évite en français une tournure ambiguë et peu naturelle.
theological_decisions:
- issue: Rapport entre l’obéissance d’Abraham et l’héritage des promesses
  choice: Conserver « par obéissance » et « afin d’hériter » sans préciser davantage leur rapport théologique.
  alternative: Reformuler en termes de mérite, de récompense ou de simple chronologie.
  rationale: Le grec associe l’obéissance, le départ et l’héritage final sans définir explicitement si l’obéissance est condition méritoire, moyen ou manifestation de la foi.
- issue: Identité du sujet de « dit »
  choice: Expliciter « Dieu » dans le texte.
  alternative: « Car il lui dit » ou « Car il est dit à son sujet ».
  rationale: Le contexte immédiat fournit Dieu comme antécédent, et le discours qui suit est adressé à Abraham; l’explicitation ne modifie pas le contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure est légèrement réorganisée en deux phrases pour éviter une longue période pesante, tout en maintenant le contraste rhétorique entre ce qu’Abraham abandonne et les promesses qu’il reçoit.
