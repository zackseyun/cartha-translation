id: 1CLEM.10.4
reference: 1 Clement 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ εἶπεν αὐτῷ ὁ θεός· Ἀναβλέψας τοῖς ὀφθαλμοῖς σου ἴδε ἀπὸ τοῦ τόπου, οὗ νῦν σὺ εἶ, πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν, ὅτι πᾶσαν τὴν γῆν, ἣν σὺ ὁρᾷς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
translation:
  language: fr
  text: 'Et de nouveau, lorsqu’il se fut séparé de Loth, Dieu lui dit : « Lève les yeux et, depuis le lieu où tu te trouves maintenant, regarde vers le nord, le sud, l’est et la mer[a], car tout le pays que tu vois, je te le donnerai, à toi et à ta descendance, pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mer » ; ici, elle désigne l’ouest.'
    reason: Le grec conserve le repère géographique concret θάλασσα plutôt que le nom abstrait de la direction. La note permet de garder cette image tout en la clarifiant.
lexical_decisions:
- source_word: διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ
  choice: lorsqu’il se fut séparé de Loth
  rationale: 'Le passif morphologique a ici un sens intransitif ou quasi moyen : Abraham se sépare de Loth, sans qu’un agent extérieur soit nécessairement sous-entendu. Le plus-que-parfait antérieur français situe naturellement cette séparation avant la parole divine.'
- source_word: Ἀναβλέψας τοῖς ὀφθαλμοῖς σου
  choice: Lève les yeux
  rationale: Expression française naturelle qui reproduit le geste demandé sans rendre lourdement le datif instrumental « avec tes yeux ».
- source_word: ἴδε
  choice: regarde
  rationale: Avec les indications de direction qui suivent, l’impératif invite à porter le regard plutôt qu’il ne décrit simplement la perception visuelle.
- source_word: λίβα
  choice: le sud
  rationale: Dans cette énumération géographique, λίψ désigne le sud ou sud-ouest; « le sud » correspond à l’orientation visée et à la formulation de Genèse 13.
- source_word: θάλασσαν
  choice: la mer
  rationale: Traduction formelle de θάλασσα; dans la géographie biblique, la mer située à l’ouest sert à désigner cette direction, ambiguïté explicitée en note.
- source_word: γῆν
  choice: pays
  rationale: Dans ce contexte de territoire promis et visible, « pays » est plus naturel que « terre » tout en conservant le sens territorial de γῆ.
- source_word: σπέρματί σου
  choice: ta descendance
  rationale: « Descendance » rend le sens collectif de σπέρμα en français courant et digne, sans l’étrangeté moderne de « semence ».
- source_word: ἕως αἰῶνος
  choice: pour toujours
  rationale: Rend idiomatiquement la durée indéfinie ou perpétuelle exprimée par la locution grecque.
theological_decisions:
- issue: Portée collective de σπέρμα
  choice: ta descendance
  alternative: ta postérité / ta semence
  rationale: Le contexte vise les descendants d’Abraham collectivement. Cette formulation n’impose pas ici une lecture christologique singulière ni une terminologie confessionnelle.
- issue: Durée de la promesse en ἕως αἰῶνος
  choice: pour toujours
  alternative: à jamais / jusqu’à l’éternité
  rationale: « Pour toujours » conserve la force durable de la formule sans tenter d’en résoudre les questions théologiques de portée ou d’accomplissement.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe de la citation reste proche du grec, tandis que les expressions idiomatiques (« lève les yeux », « ta descendance ») évitent un calque artificiel. Le marqueur [a] figure bien dans le texte principal.
