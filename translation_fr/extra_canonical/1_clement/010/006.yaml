source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
translation:
  language: fr
  text: 'Et il dit encore : « Dieu fit sortir Abraham et lui dit : “Lève les yeux vers le ciel et compte les étoiles, si tu peux les dénombrer. Ainsi sera ta descendance.” Abraham crut Dieu, et cela lui fut compté comme justice. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνάβλεψον
  choice: Lève les yeux
  rationale: Expression française naturelle qui rend ici l’action de regarder vers le haut, précisée par « vers le ciel ».
- source_word: τὸ σπέρμα σου
  choice: ta descendance
  rationale: Le singulier collectif grec désigne ici les descendants d’Abraham ; « descendance » est naturel en français et conserve cette valeur collective.
- source_word: ἐλογίσθη
  choice: fut compté
  rationale: Le passif préserve la formulation comptable ou imputative du grec sans préciser explicitement l’agent.
- source_word: εἰς δικαιοσύνην
  choice: comme justice
  rationale: Cette formulation restitue idiomatiquement le résultat ou la valeur attribuée à la foi, sans développer davantage le rapport théologique.
theological_decisions:
- issue: Objet de la foi d’Abraham
  choice: Abraham crut en Dieu
  alternative: Abraham fit confiance à Dieu
  rationale: Le grec τῷ θεῷ peut accompagner le verbe « croire » ; la formulation retenue demeure proche du texte et n’impose pas une nuance interprétative supplémentaire.
- issue: Sujet implicite de « fut compté »
  choice: cela lui fut compté comme justice
  alternative: Dieu le lui compta comme justice
  rationale: Le grec emploie un passif et n’exprime pas le sujet ; la traduction conserve cette indétermination formelle.
translation_notes:
  register: Français moderne, international et digne. La citation continue jusqu’à la fin du verset, conformément à la syntaxe grecque. Les guillemets imbriqués distinguent la citation scripturaire de la parole adressée à Abraham.
