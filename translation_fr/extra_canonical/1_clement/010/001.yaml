source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀβραὰμ, ὁ φίλος προσαγορευθείς, πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι τοῖς ῥήμασιν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/001.yaml
  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
translation:
  language: fr
  text: Abraham, qui fut appelé « l’ami », fut reconnu fidèle en devenant obéissant aux paroles de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’il devint obéissant aux paroles de Dieu ».'
    reason: La construction grecque ἐν τῷ avec l’infinitif peut ici marquer la circonstance ou le moyen, avec une possible nuance causale.
lexical_decisions:
- source_word: ὁ φίλος
  choice: « l’ami »
  rationale: L’article et le substantif désignent le titre sous lequel Abraham fut appelé; les guillemets rendent clairement cette appellation en français.
- source_word: πιστὸς εὑρέθη
  choice: fut reconnu fidèle
  rationale: Cette formulation conserve le passif grec tout en étant plus naturelle en français moderne que « fut trouvé fidèle ».
- source_word: ὑπήκοον γενέσθαι
  choice: en devenant obéissant
  rationale: Le choix maintient l’idée de devenir exprimée par γενέσθαι et le rapport d’obéissance porté par ὑπήκοον.
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  choice: aux paroles de Dieu
  rationale: Traduction directe du pluriel ῥήματα, qui renvoie ici aux paroles ou injonctions divines.
theological_decisions:
- issue: Valeur de ἐν avec l’infinitif substantivé
  choice: en devenant obéissant
  alternative: parce qu’il devint obéissant
  rationale: La construction peut exprimer la circonstance ou le moyen, sans exclure une nuance causale. Le texte principal garde une formulation proche et naturelle; la note signale l’autre lecture possible.
translation_notes:
  register: Français moderne, sobre et digne. « Fut reconnu fidèle » évite le calque peu idiomatique « fut trouvé fidèle », tandis que « l’ami » reste présenté comme un titre.
