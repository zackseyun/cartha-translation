  text: καὶ ποιήσω τὸ σπέρμα σου ὡς τὴν ἄμμον τῆς γῆς· εἰ δύναταί τις ἐξαριθμῆσαι τὴν ἄμμον τῆς γῆς, καὶ τὸ σπέρμα σου ἐξαριθμηθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/005.yaml
  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: fr
  text: Et je rendrai ta descendance pareille au sable de la terre. Si quelqu’un peut dénombrer le sable de la terre, ta descendance aussi sera dénombrée.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα
  choice: descendance
  rationale: Dans cette promesse adressée à Abraham, le terme désigne collectivement ses descendants; «descendance» est naturel en français moderne tout en conservant le sens collectif du grec.
- source_word: ποιήσω
  choice: je rendrai
  rationale: Avec le complément comparatif ὡς, «rendre pareille à» exprime naturellement l’idée de faire devenir aussi nombreuse que.
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  choice: compter / pourra être comptée
  rationale: La répétition du même verbe est préservée. Dans la seconde proposition, «pourra» explicite en français la possibilité impliquée par la condition sans modifier sa logique.
theological_decisions:
- issue: Sens collectif ou individuel de σπέρμα
  choice: descendance
  alternative: postérité; semence
  rationale: Le contexte de l’innombrable sable indique ici une collectivité de descendants. «Descendance» évite une lecture artificiellement individualisée sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle et l’écho lexical du grec sont conservés; la ponctuation est adaptée à un discours cité se terminant ici.
