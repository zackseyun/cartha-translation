revisions:
- from: Ainsi donc, puisque tout est vu et entendu, craignons-le et abandonnons les désirs impurs de commettre des actes mauvais[a], afin que, dans sa miséricorde, il nous mette à l’abri des jugements à venir.
  to: Ainsi donc, puisque tout est vu et entendu, craignons-le et abandonnons les désirs impurs de commettre de mauvaises actions, afin que, par sa miséricorde, nous soyons mis à l’abri des jugements à venir.
  rationale: La révision conserve l’exhortation et le sens objectif du génitif, tout en restaurant la voix passive de σκεπασθῶμεν et en rendant naturellement le datif instrumental τῷ ἐλέει αὐτοῦ. La note est supprimée, car l’alternative proposée est moins précise et n’est pas nécessaire à la compréhension du passage.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les passifs universels « tout est vu et entendu », l’exhortation à craindre Dieu et à abandonner les désirs visant des actes mauvais, ainsi que le pluriel des jugements futurs, sont bien rendus. Toutefois, σκεπασθῶμεν est un subjonctif aoriste passif (« que nous soyons protégés / mis à l’abri »). La tournure active « il nous mette à l’abri » explicite un agent et s’écarte inutilement de la voix du grec. Le datif τῷ ἐλέει αὐτοῦ se rend naturellement ici par « par sa miséricorde ».'
  naturalness: « Par sa miséricorde, nous soyons mis à l’abri » est idiomatique dans un registre biblique moderne et conserve l’image protectrice sans lourdeur. « De mauvaises actions » est plus naturel en français international que « des actes mauvais » dans cette phrase.
  terminology: '« Craignons-le », « désirs impurs », « mis à l’abri » et « jugements à venir » conviennent au registre et ne surinterprètent pas le texte. Le génitif φαύλων ἔργων est rendu comme l’objet des désirs : des désirs de commettre de mauvaises actions. Aucune note alternative n’est nécessaire, car « liés aux actes mauvais » affaiblit et obscurcit ce rapport objectif.'
  issues:
  - severity: medium
    issue: La voix passive de σκεπασθῶμεν n’est pas conservée.
    rationale: « Il nous mette à l’abri » transforme la construction passive grecque en active et introduit explicitement l’agent comme sujet. Une formulation passive française préserve plus exactement la syntaxe et la retenue du texte.
  - severity: low
    issue: La note propose une alternative imprécise.
    rationale: « Désirs impurs liés aux actes mauvais » ne rend pas aussi clairement le génitif objectif que le texte principal et n’apporte pas une ambiguïté textuelle suffisamment établie pour justifier une note.
  revised_text: Ainsi donc, puisque tout est vu et entendu, craignons-le et abandonnons les désirs impurs de commettre de mauvaises actions, afin que, par sa miséricorde, nous soyons mis à l’abri des jugements à venir.
