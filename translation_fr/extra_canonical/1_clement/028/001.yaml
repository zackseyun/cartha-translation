id: 1CLEM.28.1
reference: 1 Clement 28:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
translation:
  language: fr
  text: Ainsi donc, puisque tout est vu et entendu, craignons-le et abandonnons les désirs impurs de commettre de mauvaises actions, afin que, par sa miséricorde, nous soyons mis à l’abri des jugements à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων … βλεπομένων καὶ ἀκουομένων
  choice: puisque tout est vu et entendu
  rationale: Conserve la construction participiale passive et sa portée universelle, sans ajouter explicitement un agent absent du grec.
- source_word: φοβηθῶμεν αὐτόν
  choice: craignons-le
  rationale: Rend directement l’exhortation au subjonctif et le sens religieux de φοβέομαι, sans l’atténuer en simple respect.
- source_word: ἀπολίπωμεν
  choice: abandonnons
  rationale: Exprime l’idée de laisser derrière soi et de renoncer à quelque chose.
- source_word: φαύλων ἔργων μιαρὰς ἐπιθυμίας
  choice: les désirs impurs de commettre des actes mauvais
  rationale: 'Interprète le génitif φαύλων ἔργων comme objectif : les actes mauvais constituent l’objet des désirs. La formulation française explicite naturellement ce rapport.'
- source_word: τῷ ἐλέει αὐτοῦ
  choice: dans sa miséricorde
  rationale: Rend le datif comme la sphère ou le fondement miséricordieux de la protection, dans un français naturel.
- source_word: σκεπασθῶμεν ἀπό
  choice: il nous mette à l’abri de
  rationale: Traduit l’image de couverture protectrice et la délivrance à l’égard des jugements.
- source_word: τῶν μελλόντων κριμάτων
  choice: des jugements à venir
  rationale: Maintient le pluriel κρίματα et la perspective future exprimée par μελλόντων.
theological_decisions:
- issue: Agent de « tout est vu et entendu »
  choice: Laisser l’agent implicite
  alternative: Ajouter « par Dieu »
  rationale: Le contexte et le pronom « le » renvoient à Dieu, mais le grec emploie des passifs sans nommer expressément l’agent ; la traduction préserve cette retenue.
- issue: Rapport entre la miséricorde et la protection
  choice: « dans sa miséricorde, il nous mette à l’abri »
  alternative: « par sa miséricorde, nous soyons mis à l’abri »
  rationale: La formulation retenue est naturelle et attribue la protection au référent divin implicite, tout en évitant de définir trop précisément la valeur instrumentale ou locative du datif.
- issue: Nature des jugements futurs
  choice: Conserver le pluriel général « jugements »
  alternative: Employer le singulier « Jugement »
  rationale: Le texte grec porte le pluriel κρίματα ; le conserver évite d’identifier sans nécessité l’expression à une formulation doctrinale précise du jugement final.
translation_notes:
  register: Français international moderne, digne et exhortatif. La phrase conserve l’enchaînement logique du grec tout en évitant les calques lourds ; « mettre à l’abri » restitue naturellement l’image protectrice de σκεπάζω.
