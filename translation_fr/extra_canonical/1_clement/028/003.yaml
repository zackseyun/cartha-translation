base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/003.yaml
  text: “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I lie down in the depths, there is your Spirit.”
translation:
  language: fr
  text: « Où irai-je, et où me cacherai-je loin de ta face ? Si je monte au ciel, tu y es ; si je pars jusqu’aux extrémités de la terre, là se trouve ta main droite ; si je me couche dans les abîmes, là se trouve ton Esprit. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφίξω
  choice: irai-je
  rationale: Le verbe exprime ici le fait d’arriver ou de se rendre quelque part ; « irai-je » est naturel dans la question rhétorique et correspond au mouvement exprimé par le contexte.
- source_word: ἀπὸ τοῦ προσώπου σου
  choice: loin de ta face
  rationale: « Face » conserve l’image biblique de la présence divine, tandis que « loin de » rend explicitement la valeur séparative de ἀπό.
- source_word: τὰ ἔσχατα τῆς γῆς
  choice: les extrémités de la terre
  rationale: Traduction directe de l’expression désignant les régions les plus éloignées de la terre.
- source_word: ἡ δεξιά σου
  choice: ta main droite
  rationale: Le grec substantivé signifie littéralement « ta droite » ; « ta main droite » restitue clairement l’image corporelle sans en imposer une interprétation.
- source_word: καταστρωθῶ
  choice: je m’étends
  rationale: Le verbe peut évoquer le fait de se coucher ou de s’étendre. « Je m’étends » reste proche du grec transmis et évite d’ajouter l’objet « lit ».
- source_word: τὰς ἀβύσσους
  choice: les abîmes
  rationale: Le pluriel français conserve celui du grec et son image des profondeurs insondables.
- source_word: τὸ πνεῦμά σου
  choice: ton Esprit
  rationale: « Esprit » conserve la référence au πνεῦμα divin dans ce contexte, sans préciser davantage son statut théologique.
theological_decisions:
- issue: Omniprésence divine exprimée par la face, la main droite et l’Esprit
  choice: Conserver les trois images distinctes du texte
  alternative: Uniformiser en parlant partout de la « présence » de Dieu
  rationale: Le grec juxtapose volontairement ces expressions et leur tension poétique et théologique ne doit pas être aplanie.
- issue: Sens de πνεῦμα
  choice: « Esprit » avec majuscule
  alternative: « esprit » ou « souffle »
  rationale: Le possessif « ton » renvoie ici à Dieu et, dans l’usage français biblique, la majuscule signale naturellement l’Esprit de Dieu sans développer une formulation doctrinale absente du passage.
translation_notes:
  register: Français moderne, international et digne, avec maintien du parallélisme poétique et des images bibliques. Aucun marqueur de note n’est nécessaire.
