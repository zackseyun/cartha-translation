  yaml_path: translation/extra_canonical/1_clement/028/004.yaml
  text: Where, then, can one go, or where can one escape from the one who encompasses all things?
translation:
  language: fr
  text: Où donc peut-on aller, ou où peut-on s’enfuir pour échapper à celui qui embrasse toutes choses ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῖ οὖν τις ἀπέλθῃ
  choice: Où donc peut-on aller
  rationale: Le tour impersonnel « peut-on » rend naturellement l’indéfini τις, tandis que « donc » conserve la valeur conclusive de οὖν et « aller » le mouvement exprimé par ἀπέλθῃ.
- source_word: ποῦ ἀποδράσῃ ἀπὸ
  choice: où peut-on fuir loin de
  rationale: « Fuir loin de » exprime à la fois l’idée d’évasion de ἀποδράσῃ et l’éloignement marqué par ἀπό.
- source_word: τοῦ τὰ πάντα ἐμπεριέχοντος
  choice: celui qui contient toutes choses
  rationale: Cette formulation garde la substantivation du participe et le sens englobant de ἐμπεριέχω, sans préciser au-delà du grec la manière dont toutes choses sont contenues.
theological_decisions:
- issue: Identification et capitalisation de « celui qui contient toutes choses »
  choice: Minuscule à « celui »
  alternative: « Celui » avec une majuscule révérencielle
  rationale: Le contexte désigne Dieu, mais le grec ne comporte aucune distinction de capitalisation correspondante. La minuscule évite d’ajouter une convention théologique ou typographique absente de la source.
- issue: Portée de ἐμπεριέχοντος
  choice: « contient toutes choses »
  alternative: « embrasse tout » ou « englobe toutes choses »
  rationale: « Contient » préserve sobrement l’affirmation que rien n’est hors de Dieu, sans résoudre la tension métaphysique par une paraphrase plus interprétative.
translation_notes:
  register: Français moderne, digne et direct. La structure interrogative double du grec est conservée, avec « ou bien » pour une coordination naturelle. Aucun marqueur de note n’est requis.
