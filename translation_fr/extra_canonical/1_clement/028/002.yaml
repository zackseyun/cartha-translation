revisions:
- from: 'Car où l’un de nous pourrait-il fuir loin de sa main puissante ? Quel monde accueillerait celui qui déserte loin de lui ? En effet, l’Écriture dit quelque part :'
  to: 'Car où l’un de nous peut-il fuir pour échapper à sa main puissante ? Et quel monde accueillera l’un de ceux qui le désertent ? En effet, l’Écriture dit quelque part :'
  rationale: La révision rétablit les temps du grec, explicite naturellement la relation exprimée par ἀπ᾿ αὐτοῦ sans la paraphraser théologiquement, et conserve la portée rhétorique ainsi que la métaphore de la désertion. Aucun ajout doctrinal ni aucune note n’est nécessaire.
