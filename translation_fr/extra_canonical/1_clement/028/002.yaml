base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/002.yaml
  text: 'For where can anyone of us flee from his mighty hand? Or what world will receive anyone who deserts from him? For the Scripture says somewhere:'
translation:
  language: fr
  text: 'Car où l’un de nous peut-il fuir pour échapper à sa main puissante ? Et quel monde accueillera l’un de ceux qui le désertent ? En effet, l’Écriture dit quelque part :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κραταιᾶς χειρός
  choice: main puissante
  rationale: Rend directement l’image grecque de la puissance souveraine, dans un français naturel et digne.
- source_word: κόσμος
  choice: monde
  rationale: Conserve le terme concret et la portée cosmique de la question rhétorique.
- source_word: αὐτομολούντων ἀπ᾿ αὐτοῦ
  choice: celui qui déserte loin de lui
  rationale: Le verbe évoque proprement la désertion ou le passage hors d’un camp; « déserte » préserve cette force, tandis que « loin de lui » exprime la séparation marquée par ἀπό.
- source_word: τὸ γραφεῖον
  choice: l’Écriture
  rationale: Dans ce contexte d’introduction à une citation scripturaire, le singulier désigne le texte sacré; « l’Écriture » est l’équivalent français consacré et intelligible.
- source_word: λέγει γάρ που
  choice: En effet, l’Écriture dit quelque part
  rationale: « En effet » rend γάρ et « quelque part » conserve l’indétermination de που sans chercher à identifier ici le passage.
theological_decisions:
- issue: Possibilité d’échapper à Dieu
  choice: Conserver les deux questions rhétoriques sans les expliciter
  alternative: 'Transformer en affirmation: « Personne ne peut échapper à Dieu »'
  rationale: Le grec formule une interrogation qui prépare la citation suivante; la traduction maintient cette tension rhétorique.
- issue: Métaphore de la désertion
  choice: Conserver « déserte »
  alternative: Employer « s’éloigne », « abandonne » ou « se détourne »
  rationale: La métaphore militaire du grec est significative et ne doit pas être neutralisée en une formulation doctrinalement plus générale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les interrogations gardent leur vigueur rhétorique, et les deux-points annoncent la citation du verset suivant.
