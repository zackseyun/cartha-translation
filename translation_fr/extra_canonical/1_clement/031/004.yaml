source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰακὼβ μετὰ ταπεινοφροσύνης ἐξεχώρησεν τῆς γῆς αὐτοῦ δι’ ἀδελφὸν καὶ ἐπορεύθη πρὸς Λαβὰν καὶ ἐδούλευσεν, καὶ ἐδόθη αὐτῷ τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
translation:
  language: fr
  text: Jacob quitta humblement son pays à cause de son frère, se rendit chez Laban et servit ; et le peuple d’Israël aux douze sceptres[a] lui fut donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les douze tribus d’Israël ». Le mot grec évoque littéralement douze sceptres.
    reason: Signaler le sens idiomatique probable du composé rare δωδεκάσκηπτρον tout en préservant son image dans le texte.
lexical_decisions:
- source_word: μετὰ ταπεινοφροσύνης
  choice: humblement
  rationale: Rend naturellement en français la manière dont Jacob partit, tout en conservant l’idée explicite d’humilité.
- source_word: ἐξεχώρησεν τῆς γῆς αὐτοῦ
  choice: quitta son pays
  rationale: Le verbe indique qu’il s’éloigna ou partit, et γῆ peut désigner ici son territoire ou son pays.
- source_word: δι’ ἀδελφὸν
  choice: à cause de son frère
  rationale: Conserve la relation causale exprimée par διά avec l’accusatif sans préciser davantage le rôle du frère.
- source_word: ἐδούλευσεν
  choice: servit
  rationale: Préserve la sobriété et l’absence de complément du grec, ainsi que la nuance de service dépendant.
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  choice: le peuple d’Israël aux douze sceptres
  rationale: Conserve l’image inhabituelle du composé δωδεκάσκηπτρον tout en explicitant en français le collectif sous-entendu par l’adjectif substantivé.
theological_decisions:
- issue: Interprétation de δωδεκάσκηπτρον
  choice: Maintien de l’image des « douze sceptres » dans le texte
  alternative: les douze tribus d’Israël
  rationale: Le composé évoque littéralement douze sceptres, tout en faisant vraisemblablement allusion aux douze tribus. Le texte conserve cette image et la note donne l’interprétation idiomatique sans effacer l’ambivalence lexicale.
translation_notes:
  register: Français moderne, sobre et digne. La phrase suit l’enchaînement narratif grec, avec une ponctuation qui en facilite la lecture. L’expression finale, volontairement marquée, reflète le caractère exceptionnel du composé grec.
