  yaml_path: translation/extra_canonical/1_clement/031/002.yaml
  text: For what reason was our father Abraham blessed? Was it not because he did righteousness and truth through faith?
translation:
  language: fr
  text: Pour quelle raison notre père Abraham a-t-il été béni ? N’est-ce pas parce qu’il a pratiqué la justice et la vérité par la foi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  choice: Pour quelle raison
  rationale: Rend directement la question causale grecque dans un français naturel et digne.
- source_word: ηὐλογήθη
  choice: a-t-il été béni
  rationale: Conserve la voix passive de l’aoriste grec sans préciser l’agent.
- source_word: δικαιοσύνην καὶ ἀλήθειαν ... ποιήσας
  choice: parce qu’il a pratiqué la justice et la vérité
  rationale: « Pratiquer » exprime naturellement en français l’idée de faire ou mettre en œuvre la justice et la vérité, tout en préservant les deux substantifs grecs.
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: Reproduit la valeur instrumentale ou médiatrice de la préposition διά avec le génitif, sans explicitation théologique supplémentaire.
theological_decisions:
- issue: Rapport entre la bénédiction, les actes justes et la foi
  choice: Conserver la formulation rhétorique selon laquelle Abraham a pratiqué la justice et la vérité par la foi
  alternative: Reformuler en opposant les œuvres à la foi, ou en faisant de la foi seule la cause explicite de la bénédiction
  rationale: Le grec unit l’action juste et vraie à la foi au lieu de les opposer. La traduction maintient cette tension sans imposer une systématisation doctrinale.
translation_notes:
  register: Français international moderne, clair et soutenu. La tournure interrogative conserve la force rhétorique de οὐχί, qui attend une réponse affirmative.
