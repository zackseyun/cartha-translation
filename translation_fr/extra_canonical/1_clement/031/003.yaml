source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰσαὰκ μετὰ πεποιθήσεως γινώσκων τὸ μέλλον ἡδέως προσήγετο θυσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/003.yaml
  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
translation:
  language: fr
  text: Isaac, sachant avec assurance ce qui allait arriver, se laissa volontiers offrir en sacrifice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  choice: avec assurance
  rationale: Cette expression rend la confiance ferme avec laquelle Isaac savait, tout en se rattachant clairement à « sachant ».
- source_word: τὸ μέλλον
  choice: ce qui allait arriver
  rationale: Formulation française naturelle qui conserve la portée générale du participe substantivé désignant l’avenir.
- source_word: ἡδέως
  choice: volontiers
  rationale: Rend simplement l’idée d’un consentement joyeux ou empressé, sans exagérer l’émotion.
- source_word: προσήγετο θυσία
  choice: se présenta volontiers en sacrifice
  rationale: Le moyen-passif peut décrire Isaac conduit ou présenté, mais aussi sa participation consentie. « Se présenta » conserve cette implication volontaire sans ajouter explicitement « s’offrit lui-même », absent du grec.
theological_decisions:
- issue: Degré d’initiative attribué à Isaac dans son sacrifice
  choice: se présenta volontiers en sacrifice
  alternative: fut volontiers présenté en sacrifice
  rationale: La forme προσήγετο est morphologiquement moyenne ou passive. Le contexte et ἡδέως mettent en avant le consentement d’Isaac, tandis que la traduction retenue évite de trancher trop fortement en faveur d’une offrande entièrement autonome.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde l’ordre logique du grec et évite l’ambiguïté possible sur le rattachement de « avec assurance ».
