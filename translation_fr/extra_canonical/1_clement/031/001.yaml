  source_fidelity: La première proposition rend bien Κολληθῶμεν et τῇ εὐλογίᾳ αὐτοῦ. En revanche, « les chemins qui y conduisent » transforme « les chemins de la bénédiction » (αἱ ὁδοὶ τῆς εὐλογίας) en voies menant à la bénédiction, interprétation possible mais non imposée par le grec. « le récit » ajoute également un objet narratif absent de τὰ ... γενόμενα, qui désigne plus largement les faits ou événements survenus.
  naturalness: Le français révisé demeure moderne, clair et d’un registre exhortatif sobre. « Passons en revue les événements » rend idiomatiquement l’image de ἀνατυλίξωμεν dans ce contexte sans introduire un « récit » explicite.
