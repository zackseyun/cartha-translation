id: 1CLEM.31.1
reference: 1 Clement 31:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/001.yaml
  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: fr
  text: Attachons-nous donc à sa bénédiction et voyons quels sont les chemins de la bénédiction. Passons en revue les événements survenus depuis le commencement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  choice: Attachons-nous
  rationale: Rend l’idée de s’unir étroitement ou de rester fermement attaché, dans un français naturel.
- source_word: τῇ εὐλογίᾳ αὐτοῦ
  choice: à sa bénédiction
  rationale: Conserve le possessif et le sens religieux général de εὐλογία sans préciser davantage son contenu.
- source_word: αἱ ὁδοὶ τῆς εὐλογίας
  choice: les chemins qui y conduisent
  rationale: Exprime naturellement la métaphore des « chemins de la bénédiction »; « y » renvoie explicitement à la bénédiction déjà mentionnée.
- source_word: ἀνατυλίξωμεν
  choice: Déroulons le récit
  rationale: Le verbe évoque littéralement l’action de dérouler; l’ajout de « le récit » rend intelligible l’invitation à reprendre l’histoire.
- source_word: τὰ ἀπ’ ἀρχῆς γενόμενα
  choice: des événements survenus depuis le commencement
  rationale: Reproduit la référence aux faits advenus dès les origines, sans identifier plus précisément le commencement.
theological_decisions:
- issue: Nature des « chemins de la bénédiction »
  choice: les chemins qui y conduisent
  alternative: les chemins de la bénédiction
  rationale: La formulation choisie indique des voies menant à la bénédiction, lecture naturelle du contexte, sans définir doctrinalement la bénédiction ni ses conditions.
- issue: Référent du possessif « sa »
  choice: Maintien du possessif sans explicitation
  alternative: la bénédiction de Dieu
  rationale: Le grec porte simplement αὐτοῦ; nommer explicitement Dieu résoudrait un référent que ce verset isolé laisse implicite.
translation_notes:
  register: Français moderne, digne et accessible. La métaphore de l’attachement est conservée, tandis que celle du déroulement est rendue intelligible par « le récit ». Aucun marqueur de note n’est nécessaire.
