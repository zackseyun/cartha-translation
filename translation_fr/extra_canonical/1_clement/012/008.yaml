source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρᾶτε, ἀγαπητοί, ὅτι οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία ἐν τῇ γυναικὶ γέγονεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/008.yaml
  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
translation:
  language: fr
  text: 'Voyez[a], bien-aimés : chez cette femme, il y eut non seulement la foi, mais aussi la prophétie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vous voyez ».
    reason: La forme grecque ὁρᾶτε peut être comprise soit comme un impératif, soit comme un indicatif.
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Voyez
  rationale: La forme grecque peut être impérative ou indicative. L’impératif « Voyez » convient à l’exhortation adressée aux bien-aimés, tandis que l’autre analyse est signalée en note.
- source_word: ἐν τῇ γυναικί
  choice: chez cette femme
  rationale: « Chez cette femme » exprime naturellement en français la présence de la foi et de la prophétie en elle, sans la tournure peu idiomatique « dans la femme ».
- source_word: γέγονεν
  choice: il y eut
  rationale: Cette tournure rend l’idée que la foi et la prophétie sont apparues ou ont été présentes chez cette femme, tout en évitant de préciser excessivement si elles ont été simplement constatées ou nouvellement produites.
- source_word: προφητεία
  choice: prophétie
  rationale: Équivalent direct qui conserve le vocabulaire religieux et la tension du texte entre foi et prophétie.
theological_decisions:
- issue: Nature exacte de la présence de la foi et de la prophétie chez la femme
  choice: il y eut… chez cette femme
  alternative: se manifestèrent chez cette femme
  rationale: Le grec γέγονεν permet une nuance d’apparition, d’existence ou de présence. « Il y eut » préserve cette latitude sans imposer une interprétation précise du mode de manifestation.
translation_notes:
  register: Français moderne, naturel et digne. L’adresse « bien-aimés » conserve le registre affectueux et communautaire de l’original; l’ordre de la proposition met en relief « chez cette femme » sans alourdir la phrase.
