  source_fidelity: « Voyez, bien-aimés » rend bien ὁρᾶτε, ἀγαπητοί, tout en signalant adéquatement en note l’analyse possible comme indicatif. « Chez cette femme, il y eut non seulement la foi, mais aussi la prophétie » conserve l’opposition οὐ μόνον ... ἀλλὰ καί et rend γέγονεν sans réduire celui-ci à une simple constatation extérieure (« fut trouvée ») ni lui attribuer un mode de manifestation précis.
  naturalness: La phrase est claire, naturelle dans un registre biblique moderne et digne. Le passé simple « il y eut » est légèrement soutenu, mais convient au récit historique et ne nuit pas à l’accessibilité. « Chez cette femme » est idiomatique pour exprimer la présence de ces réalités en elle dans ce contexte.
  terminology: « Bien-aimés », « foi » et « prophétie » sont des équivalents établis, exacts et non confessionnellement surinterprétés. « Cette femme » est recevable en contexte discursif pour l’article défini grec τῇ γυναικί, qui renvoie à la femme déjà évoquée.
