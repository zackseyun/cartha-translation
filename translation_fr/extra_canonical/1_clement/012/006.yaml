  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: fr
  text: 'Et ils lui dirent : « Il en sera ainsi, comme tu nous l’as dit. Mais lorsque tu sauras que nous arrivons, tu rassembleras tous les tiens sous ton toit, et ils seront sauvés ; car tous ceux qui seront trouvés hors de la maison périront. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς
  choice: Mais dès que tu sauras que nous arrivons
  rationale: La tournure avec ἄν et le subjonctif γνῷς exprime ici le moment futur où elle aura connaissance de leur venue. « Arrivons » rend naturellement παραγινομένους dans ce contexte.
- source_word: πάντας τοὺς σοὺς
  choice: tous les tiens
  rationale: L’expression substantivée désigne toutes les personnes qui lui appartiennent ou lui sont proches, sans préciser davantage le lien familial.
- source_word: ὑπὸ τὸ στέγος σου
  choice: sous ton toit
  rationale: Rend directement l’image grecque, naturelle aussi en français.
- source_word: διασωθήσονται
  choice: ils seront sauvés
  rationale: Le verbe signifie être conduit hors du danger et préservé. « Sauvés » convient au contraste explicite avec « périront ».
- source_word: ἀπολοῦνται
  choice: périront
  rationale: Conserve la force du verbe grec et son opposition à διασωθήσονται.
theological_decisions: []
