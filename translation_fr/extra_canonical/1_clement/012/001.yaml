  text: Διὰ πίστιν καὶ φιλοξενίαν ἐσώθη Ῥαὰβ ἡ πόρνη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/001.yaml
  text: Because of faith and hospitality, Rahab the prostitute was saved.
translation:
  language: fr
  text: C’est par la foi et l’hospitalité que Rahab, la prostituée, fut sauvée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ πίστιν καὶ φιλοξενίαν
  choice: par la foi et l’hospitalité
  rationale: La préposition διά avec l’accusatif exprime ici la cause ou le motif. « Par » rend naturellement ce rapport en français tout en conservant l’association explicite des deux qualités.
- source_word: ἐσώθη
  choice: fut sauvée
  rationale: L’aoriste passif de σῴζω désigne un salut ou une délivrance accomplie. Le passé simple convient au registre narratif et dignifié.
- source_word: Ῥαὰβ ἡ πόρνη
  choice: Rahab, la prostituée
  rationale: L’apposition avec article identifie explicitement Rahab par son activité ou son statut. « Prostituée » est le terme moderne, direct et non euphémistique correspondant à πόρνη.
theological_decisions:
- issue: Rapport entre la foi, l’hospitalité et le salut de Rahab
  choice: Conserver les deux éléments comme motifs coordonnés de son salut
  alternative: Présenter l’hospitalité comme une simple conséquence secondaire de la foi
  rationale: Le grec coordonne πίστιν et φιλοξενίαν sous la même préposition, sans préciser leur relation interne. La traduction préserve cette tension sans imposer une hiérarchie théologique absente du texte.
translation_notes:
  register: Français international moderne, clair et dignifié. La tournure clivée « C’est par… que… » met en relief la causalité exprimée en tête de phrase dans le grec, sans alourdir le verset.
