id: 1CLEM.12.2
reference: 1 Clement 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκπεμφθέντων γὰρ ὑπὸ Ἰησοῦ τοῦ τοῦ Ναυὴ κατασκόπων εἰς τὴν Ἰεριχώ, ἔγνω ὁ βασιλεὺς τῆς γῆς, ὅτι ἥκασιν κατασκοπεῦσαι τὴν χώραν αὐτῶν, καὶ ἐξέπεμψεν ἄνδρας τοὺς συλλημψομένους αὐτούς, ὅπως συλληφθέντες θανατωθῶσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: fr
  text: En effet, lorsque Josué, fils de Noun, eut envoyé des espions à Jéricho, le roi du pays apprit qu’ils étaient venus espionner leur territoire. Il envoya alors des hommes pour les saisir, afin qu’une fois capturés, ils soient mis à mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  choice: Josué, fils de Noun
  rationale: Le grec emploie la forme Ἰησοῦ pour le personnage de Josué et l’identifie comme fils de Ναυή; « Noun » est la forme française biblique courante du nom.
- source_word: κατασκόπων / κατασκοπεῦσαι
  choice: espions / espionner
  rationale: Conserve en français le lien lexical entre le nom et le verbe grecs.
- source_word: τῆς γῆς / τὴν χώραν αὐτῶν
  choice: du pays / leur territoire
  rationale: Rend les deux termes grecs distincts avec un français naturel; χώρα désigne ici le territoire soumis à la reconnaissance des espions.
- source_word: συλλημψομένους / συλληφθέντες
  choice: pour les saisir / une fois capturés
  rationale: Reproduit le motif de l’arrestation tout en évitant une répétition française maladroite.
- source_word: θανατωθῶσιν
  choice: soient mis à mort
  rationale: Expression formelle et exacte pour le passif indiquant une exécution intentionnelle.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’enchaînement narratif et final du grec sans ajouter d’explication. « En effet » rattache explicitement le récit à l’argument précédent, comme γάρ.
