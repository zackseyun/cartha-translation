source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπισταθέντων δὲ τῶν περὶ τοῦ βασιλέως καὶ λεγόντων· Πρὸς σὲ εἰσῆλθον οἱ κατάσκοποι τῆς γῆς ἡμῶν· ἐξάγαγε αὐτούς, ὁ γὰρ βασιλεὺς οὕτως κελεύει, ἥδε ἀπεκρίθη· Εἰσῆλθον μέν οἱ ἄνδρες, οὓς ζητεῖτε, πρὸς με, ἀλλʼ εὐθέως ἀπῆλθον καὶ πορεύονται τῇ ὁδῷ ὑποδεικνύουσα αὐτοῖς ἐνλλάξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: fr
  text: 'Mais lorsque les hommes du roi se présentèrent et dirent : « Les espions de notre pays sont entrés chez toi. Fais-les sortir, car tel est l’ordre du roi », elle répondit : « Les hommes que vous cherchez sont bien entrés chez moi, mais ils sont repartis aussitôt et poursuivent leur chemin », tout en leur indiquant une autre direction.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισταθέντων
  choice: se présentèrent
  rationale: Rend naturellement le fait que les représentants du roi arrivèrent auprès d’elle et l’interpellèrent, sans alourdir la phrase par un calque comme « s’étant tenus là ».
- source_word: οἱ κατάσκοποι τῆς γῆς ἡμῶν
  choice: les espions de notre pays
  rationale: « Pays » exprime ici naturellement γῆ, le territoire relevant du roi.
- source_word: ἐξάγαγε αὐτούς
  choice: Fais-les sortir
  rationale: Conserve la force impérative et le mouvement vers l’extérieur exprimé par ἐξάγαγε.
- source_word: μέν
  choice: bien
  rationale: 'Marque la concession : elle reconnaît leur venue avant d’affirmer qu’ils sont déjà repartis.'
- source_word: πορεύονται τῇ ὁδῷ
  choice: poursuivent leur chemin
  rationale: Formulation idiomatique qui conserve l’idée qu’ils avancent sur la route.
- source_word: ὑποδεικνύουσα αὐτοῖς ἐνλλάξις
  choice: tout en leur indiquant une autre direction
  rationale: Le dernier terme de l’OCR est manifestement irrégulier; le contexte et la tradition textuelle soutiennent l’idée qu’elle les orientait dans une direction différente de celle prise par les espions.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le discours direct conserve le ton autoritaire des envoyés et la réponse habile de Rahab, sans ajouter de jugement moral absent du texte.
