source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν πρὸς τοὺς ἄνδρας· Γινώσκουσα γινώσκω ἐγώ, ὅτι κύριος ὁ θεὸς παραδίδωσιν ὑμῖν τὴν γῆν ταύτην· ὁ γὰρ φόβος καὶ ὁ τρόμος ὑμῶν ἐπέπεσεν τοῖς κατοικοῦσιν αὐτήν. ὡς ἐὰν οὖν γένηται λαβεῖν αὐτὴν ὑμᾶς, διασώσατέ με καὶ τὸν οἶκον τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: fr
  text: 'Et elle dit aux hommes : « Je sais avec certitude que le Seigneur Dieu vous livre ce pays, car la peur et la terreur que vous inspirez se sont abattues sur ses habitants. Aussi, quand vous vous en serez emparés, sauvez-moi, ainsi que la maison de mon père. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσα γινώσκω ἐγώ
  choice: Je sais avec certitude
  rationale: La tournure intensive associant le participe et le verbe de même racine souligne une connaissance assurée; cette formulation française en restitue naturellement l’emphase.
- source_word: παραδίδωσιν
  choice: livre
  rationale: Le présent grec présente l’action comme en cours ou certaine. « Livrer » conserve l’idée de remettre le pays au pouvoir des hommes sans préciser davantage le mode de cette remise.
- source_word: ὁ φόβος καὶ ὁ τρόμος ὑμῶν
  choice: la peur et la terreur que vous inspirez
  rationale: Le génitif ὑμῶν désigne naturellement ici la peur éprouvée à leur égard; l’explicitation évite en français l’ambiguïté artificielle de « votre peur et votre terreur ».
- source_word: τὴν γῆν ταύτην
  choice: ce pays
  rationale: Dans ce contexte de conquête territoriale, « pays » rend γῆ de manière plus idiomatique que « terre », tout en gardant la portée géographique.
- source_word: διασώσατέ
  choice: sauvez
  rationale: Le verbe demande de faire échapper quelqu’un sain et sauf au danger; « sauvez » est direct, naturel et fidèle.
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: la maison de mon père
  rationale: « Maison » préserve l’étendue possible de οἶκος, qui peut désigner le foyer, la maisonnée ou la famille, sans la réduire explicitement à l’un de ces sens.
theological_decisions:
- issue: Le titre divin κύριος ὁ θεός
  choice: le Seigneur Dieu
  alternative: le Seigneur, Dieu
  rationale: La formulation reçue « le Seigneur Dieu » restitue dignement les deux termes grecs sans introduire une interprétation doctrinale supplémentaire.
- issue: Aspect de παραδίδωσιν
  choice: vous livre ce pays
  alternative: vous livrera ce pays
  rationale: Le présent du texte grec est conservé afin de respecter la présentation de la remise comme réalité actuelle ou déjà engagée, plutôt que de la déplacer explicitement dans l’avenir.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression grecque, tandis que les expressions intensives et idiomatiques sont rendues naturellement.
