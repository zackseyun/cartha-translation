  text: ἡ οὖν φιλόξενος Ῥαὰβ εἰσδεξαμένη αὐτοὺς ἔκρυψεν εἰς τὸ ὑπερῷον ὑπὸ τὴν λινοκαλάμην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/003.yaml
  text: So the hospitable Rahab welcomed them and hid them in the upper room under the stalks of flax[a].
translation:
  language: fr
  text: Ainsi donc, Rahab l’hospitalière les accueillit et les cacha dans la pièce à l’étage, sous les tiges de lin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλόξενος
  choice: l’hospitalière
  rationale: L’adjectif articulé placé avec le nom propre a ici une valeur attributive, presque comme une épithète. Cette formulation préserve le relief rhétorique du grec.
- source_word: εἰσδεξαμένη
  choice: les accueillit
  rationale: Le participe aoriste exprime une action antérieure étroitement liée au verbe principal; en français naturel, la coordination rend clairement la succession des actions.
- source_word: ὑπερῷον
  choice: la pièce à l’étage
  rationale: Le terme désigne une pièce située dans la partie supérieure de la maison; «pièce à l’étage» est précis et plus courant que «chambre haute».
- source_word: λινοκαλάμην
  choice: les tiges de lin
  rationale: Le composé désigne les tiges ou chaumes du lin; «tiges de lin» est clair et correspond au contexte du récit de Rahab.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. L’épithète «Rahab l’hospitalière» reproduit la construction grecque marquée sans transformer l’adjectif en proposition causale ou circonstancielle.
