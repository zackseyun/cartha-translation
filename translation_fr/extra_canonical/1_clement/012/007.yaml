  rationale: 'La révision resserre la fidélité au grec : elle conserve l’action accomplie exprimée par l’aoriste, maintient l’indétermination matérielle de κόκκινον, rend la provenance de l’objet suspendu, et évite d’ajouter à λύτρωσις ἔσται l’idée que la délivrance serait « accordée » par un agent implicite. La phrase demeure naturelle en français international moderne.'
