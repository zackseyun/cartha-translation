review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : προσέθεντο ... δοῦναι est compris comme une action effectivement accomplie, κόκκινον n’est pas indûment identifié à un cordon, et le futur de λύτρωσις ἔσται est conservé. Toutefois, « la délivrance sera accordée » ajoute l’idée d’une attribution passive, absente de « il y aura délivrance ». « De sa maison » rend aussi plus exactement ἐκ τοῦ οἴκου que « à sa maison ».'
  naturalness: Le français est clair et de registre approprié. « Une chose écarlate » est légèrement plus sobre que « quelque chose d’écarlate » dans ce contexte littéraire tout en préservant l’absence de nom matériel dans le grec.
  terminology: « Signe », « écarlate », « sang du Seigneur », « délivrance », « croient » et « espèrent en Dieu » sont appropriés. « Délivrance » conserve une portée suffisamment large pour λύτρωσις sans imposer un vocabulaire confessionnel technique.
  issues:
  - severity: medium
    issue: Ajout d’une attribution passive dans « la délivrance sera accordée »
    rationale: λύτρωσις ἔσται signifie littéralement « il y aura délivrance/rédemption ». Le grec n’exprime ni bénéficiaire qui l’accorderait ni voix passive. La tournure impersonnelle française conserve mieux la formulation source.
  - severity: low
    issue: « à sa maison » atténue la provenance exprimée par ἐκ τοῦ οἴκου
    rationale: Le préfixe et la préposition indiquent que l’objet doit être pendu depuis/de la maison. « De sa maison » est plus proche du grec sans rendre la phrase artificielle.
  - severity: low
    issue: Note alternative imprécise sur l’idiome προσέθεντο ... δοῦναι
    rationale: « Allèrent jusqu’à lui donner » suggère une intensification ou une limite, alors que l’idiome sémitisant exprime plus simplement l’action ajoutée ou poursuivie. Une note littérale explicative est plus sûre.
