base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
translation:
  language: fr
  text: 'Ils lui donnèrent aussi un signe[a] : elle devait suspendre de sa maison une chose écarlate. Ils montraient ainsi clairement que, par le sang du Seigneur, il y aura délivrance pour tous ceux qui croient et espèrent en Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Ils ajoutèrent de lui donner un signe » ; tournure sémitisante signifiant qu’ils lui donnèrent en outre un signe.'
    reason: La note rend compte de la forme littérale de προσέθεντο ... δοῦναι tout en expliquant l’idiome, sans introduire l’idée inexacte d’une promesse future ou d’une intensification.
lexical_decisions:
- source_word: προσέθεντο ... δοῦναι
  choice: Ils lui donnèrent aussi
  rationale: La tournure sémitisante signifie qu’ils firent en plus cette action; « aussi » conserve l’idée d’ajout sans introduire une promesse future absente de l’infinitif aoriste.
- source_word: σημεῖον
  choice: un signe
  rationale: Équivalent direct et naturel, désignant ici le signe convenu.
- source_word: κόκκινον
  choice: quelque chose d’écarlate
  rationale: Le grec substantivé indique une chose écarlate sans préciser qu’il s’agit d’un cordon; cette formulation évite d’ajouter un objet absent du texte.
- source_word: λύτρωσις
  choice: la délivrance
  rationale: Le terme désigne une libération ou délivrance obtenue moyennant rançon; « délivrance » reste naturel et conserve l’image sotériologique sans imposer une formulation technique.
- source_word: πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  choice: ceux qui croient et espèrent en Dieu
  rationale: Rend les deux participes coordonnés et leur orientation vers Dieu dans un français courant et digne.
theological_decisions:
- issue: Portée salvatrice du sang du Seigneur
  choice: par le sang du Seigneur, la délivrance sera accordée à tous ceux qui croient et espèrent en Dieu
  alternative: par le sang du Seigneur, il y aura rédemption pour tous ceux qui croient et mettent leur espérance en Dieu
  rationale: La traduction maintient l’affirmation explicite du texte, son futur et son universalité conditionnée par la foi et l’espérance, sans préciser davantage le mécanisme de la délivrance.
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été légèrement segmentée pour la lisibilité. Le référent matériel de κόκκινον demeure volontairement non précisé.
