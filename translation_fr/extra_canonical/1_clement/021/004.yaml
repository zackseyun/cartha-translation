  text: δίκαιον οὖν ἐστίν, μὴ λειποτακτεῖν ἡμᾶς ἀπὸ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/004.yaml
  text: Therefore it is right that we should not desert his will[a].
translation:
  language: fr
  text: Il est donc juste que nous ne désertions pas la volonté de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque emploie un terme militaire : abandonner son poste, se conduire en déserteur.'
    reason: Signaler la nuance militaire de λειποτακτεῖν, que le verbe français « déserter » conserve mais n’explicite pas entièrement.
lexical_decisions:
- source_word: δίκαιον
  choice: juste
  rationale: Rend directement le jugement moral exprimé par l’adjectif grec.
- source_word: λειποτακτεῖν
  choice: désertions
  rationale: Conserve l’image militaire du verbe, qui désigne l’abandon de son poste ou la désertion, tout en restant idiomatique en français.
- source_word: ἀπὸ τοῦ θελήματος αὐτοῦ
  choice: la volonté de Dieu
  rationale: Le français construit naturellement « déserter » avec un complément direct. « De Dieu » explicite le référent de αὐτοῦ dans cet extrait isolé sans modifier le sens.
theological_decisions:
- issue: Référent de αὐτοῦ (« sa volonté »)
  choice: la volonté de Dieu
  alternative: sa volonté
  rationale: Dans le contexte de 1 Clément, le pronom renvoie à Dieu. L’explicitation facilite la lecture d’un verset isolé et n’ajoute aucune distinction doctrinale.
- issue: Maintien de la métaphore militaire
  choice: ne désertions pas
  alternative: ne nous écartions pas de
  rationale: Le verbe λειποτακτεῖν porte une image militaire précise; la traduction la préserve plutôt que de la réduire à une simple désobéissance.
translation_notes:
  register: Français moderne, digne et direct. Le subjonctif « désertions » après « il est juste que » est naturel dans le registre écrit courant; « volonté de Dieu » évite l’ambiguïté d’un extrait présenté hors contexte.
