id: 1CLEM.21.8
reference: 1 Clement 21:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
translation:
  language: fr
  text: 'Que nos enfants aient part à l’éducation qui est en Christ. Qu’ils apprennent quelle force l’humilité a devant Dieu, ce que l’amour pur peut accomplir devant Dieu, et combien la crainte de Dieu est bonne et grande : elle sauve tous ceux qui vivent pieusement en lui[a], avec un esprit pur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec « en lui » peut renvoyer à Dieu ou, plus immédiatement, à la crainte de Dieu.
    reason: Préserve l’ambiguïté du pronom grec ἐν αὐτῷ sans imposer l’un de ses référents possibles.
lexical_decisions:
- source_word: παιδείας
  choice: éducation
  rationale: Le terme désigne ici la formation morale et spirituelle, avec une possible nuance de discipline; « éducation » reste naturel dans l’expression concernant les enfants.
- source_word: ἰσχύει
  choice: a … force
  rationale: Cette formulation conserve l’image de la force ou de l’efficacité de l’humilité, ainsi que la construction interrogative introduite par τί.
- source_word: ἀγάπη ἁγνή
  choice: amour pur
  rationale: Rend directement l’expression grecque sans lui ajouter une qualification confessionnelle.
- source_word: ὁ φόβος αὐτοῦ
  choice: la crainte de Dieu
  rationale: En français, la reprise explicite de « Dieu » évite une référence pronominale lourde tout en préservant le sens de la crainte révérencielle.
- source_word: ὁσίως ἀναστρεφομένους
  choice: ceux qui vivent pieusement
  rationale: ἀναστρέφομαι décrit la conduite ou la manière de vivre, et ὁσίως la qualifie comme pieuse ou sainte.
- source_word: ἐν καθαρᾷ διανοίᾳ
  choice: avec un esprit pur
  rationale: Expression française courante qui rend l’état intérieur, intellectuel et moral exprimé par διάνοια.
theological_decisions:
- issue: Référent de ἐν αὐτῷ
  choice: dans cette crainte
  alternative: en lui, c’est-à-dire en Dieu
  rationale: Le pronom peut grammaticalement reprendre le « φόβος » immédiatement précédent, et vivre ou se conduire dans la crainte de Dieu correspond bien au contexte. La possibilité d’un renvoi à Dieu demeure toutefois réelle et est signalée en note.
- issue: Force salvatrice attribuée à la crainte de Dieu
  choice: elle sauve
  alternative: il sauve
  rationale: Le participe σῴζων s’accorde avec ὁ φόβος; la traduction conserve donc l’énoncé audacieux du texte au lieu de transférer silencieusement l’action à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortative répétée est conservée, tandis que la dernière longue proposition est ponctuée pour rester claire à la lecture.
