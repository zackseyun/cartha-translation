id: 1CLEM.21.3
reference: 1 Clement 21:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
translation:
  language: fr
  text: Voyons combien il est proche, et qu’aucune de nos pensées ni aucun des raisonnements que nous formons[a] ne lui a échappé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des réflexions que nous élaborons ».
    reason: διαλογισμῶν et ποιούμεθα peuvent désigner plus largement des réflexions ou délibérations intérieures que l’on développe.
lexical_decisions:
- source_word: ἴδωμεν
  choice: Voyons
  rationale: Rend naturellement l’exhortation au subjonctif aoriste, à la première personne du pluriel.
- source_word: πῶς ἐγγύς ἐστιν
  choice: combien il est proche
  rationale: Conserve l’idée de proximité exprimée par ἐγγύς sans préciser indûment s’il s’agit d’une proximité spatiale, relationnelle ou liée à sa connaissance.
- source_word: ἐννοιῶν
  choice: pensées
  rationale: Terme français courant qui exprime ici ce qui se trouve dans l’esprit.
- source_word: διαλογισμῶν
  choice: raisonnements
  rationale: Reflète les délibérations ou réflexions intérieures, tout en les distinguant des simples pensées.
- source_word: ὧν ποιούμεθα
  choice: que nous formons
  rationale: Expression française naturelle pour les raisonnements produits ou élaborés intérieurement.
- source_word: οὐδὲν λέληθεν αὐτόν
  choice: aucune… ni aucun… ne lui échappe
  rationale: Reformulation idiomatique de la construction grecque signifiant que rien n’a échappé à sa connaissance; le présent français convient à l’affirmation générale.
theological_decisions:
- issue: Référent implicite de αὐτόν et nature de sa proximité
  choice: Maintenir le pronom « il » et l’expression non précisée « est proche »
  alternative: Expliciter le référent divin ou interpréter la proximité comme omniprésence ou jugement imminent
  rationale: Le grec emploie un pronom dont le référent dépend du contexte et ne définit pas la nature de la proximité; la traduction préserve cette retenue.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe grecque avec οὐδέν suivi de deux génitifs est rendue par la coordination naturelle « aucune… ni aucun… ». Le parfait λέληθεν est exprimé par un présent de portée générale, plus idiomatique dans ce contexte.
