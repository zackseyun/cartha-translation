id: 1CLEM.21.1
reference: 1 Clement 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
translation:
  language: fr
  text: Veillez, bien-aimés, à ce que ses nombreux bienfaits ne deviennent pas un jugement pour nous tous, si nous ne nous conduisons pas d’une manière digne de lui et ne faisons pas, dans la concorde, ce qui est bon et agréable devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Veillez
  rationale: Dans cet avertissement, l’impératif signifie « prenez garde » ou « veillez à ce que », plutôt qu’une simple perception visuelle.
- source_word: εὐεργεσίαι
  choice: bienfaits
  rationale: Le terme désigne des bienfaits ou faveurs accordés, avec une nuance de bienfaisance, plutôt que de simples « dons ».
- source_word: εἰς κρίμα
  choice: un motif de jugement
  rationale: Cette formulation naturelle conserve l’idée que les bienfaits reçus peuvent conduire au jugement si la conduite des destinataires n’y répond pas dignement.
- source_word: πολιτευόμενοι
  choice: nous conduisons
  rationale: Le participe évoque la manière de vivre et de se comporter, avec un arrière-plan civique difficile à reproduire sans alourdir le français.
- source_word: μεθ’ ὁμονοίας
  choice: dans la concorde
  rationale: « Concorde » préserve le vocabulaire central de l’épître, opposé aux divisions et aux factions.
theological_decisions:
- issue: Rapport entre les bienfaits divins et le jugement
  choice: ses nombreux bienfaits ne deviennent pas pour nous tous un motif de jugement
  alternative: ses nombreux bienfaits ne tournent pas à notre condamnation à tous
  rationale: Le choix maintient la portée relativement large de κρίμα (« jugement », décision judiciaire) sans la réduire d’emblée à la condamnation.
- issue: Référent du pronom αὐτοῦ
  choice: lui / ses
  alternative: Dieu
  rationale: Le grec emploie un pronom; la traduction le conserve afin de ne pas expliciter davantage que le texte source.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le ton d’exhortation communautaire et le terme thématique « concorde », tout en évitant une imitation artificielle du vocabulaire civique grec.
