  to: Veillez, bien-aimés, à ce que ses nombreux bienfaits ne deviennent pas un jugement pour nous tous, si nous ne nous conduisons pas d’une manière digne de lui et ne faisons pas, dans la concorde, ce qui est bon et agréable devant lui.
  rationale: La révision corrige uniquement la portée de εἰς κρίμα en traduisant directement « deviennent ... un jugement ». Elle conserve le pronom non explicité, la nuance de πολιτεύομαι par « nous conduisons », ainsi que « concorde », terme important de l'épître.
