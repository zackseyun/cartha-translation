id: 1CLEM.21.6
reference: 1 Clement 21:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
translation:
  language: fr
  text: Ayons du respect pour le Seigneur Jésus-Christ[a], dont le sang a été donné pour nous ; respectons ceux qui nous précèdent[b] ; honorons les anciens ; formons les jeunes à la discipline de la crainte de Dieu ; guidons nos épouses[c] vers ce qui est bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Seigneur Jésus, le Messie ».
    reason: Le grec Χριστός est un titre qui signifie « Messie », bien que « Jésus-Christ » soit la forme française usuelle.
  - marker: b
    text: Ou « ceux qui nous dirigent ».
    reason: Le participe προηγουμένους peut désigner ceux qui vont devant et, par extension, ceux qui conduisent ou dirigent.
  - marker: c
    text: Le mot grec peut aussi signifier « femmes ».
    reason: γυναῖκας peut désigner des femmes ou des épouses ; le possessif et le contexte favorisent ici « épouses ».
lexical_decisions:
- source_word: ἐντραπῶμεν
  choice: Ayons du respect pour
  rationale: Le verbe exprime ici la révérence ou le respect envers une personne. Cette formulation est naturelle en français moderne sans affaiblir l’exhortation.
- source_word: τοὺς προηγουμένους ἡμῶν
  choice: ceux qui nous précèdent
  rationale: Cette traduction conserve l’image de personnes qui vont devant, sans décider qu’il s’agit nécessairement de titulaires d’une fonction officielle de direction.
- source_word: τοὺς πρεσβυτέρους
  choice: les anciens
  rationale: « Anciens » préserve la possibilité qu’il s’agisse de personnes âgées ou de responsables reconnus, selon le contexte.
- source_word: τοὺς νέους
  choice: les jeunes
  rationale: νέους est le positif « jeunes », et non le comparatif « plus jeunes ».
- source_word: παιδεύσωμεν τὴν παιδείαν
  choice: formons … à la discipline
  rationale: La formulation rend le champ de l’instruction et de la formation disciplinée tout en évitant en français la répétition maladroite du cognat grec.
- source_word: τὰς γυναῖκας ἡμῶν
  choice: nos épouses
  rationale: Dans cette série d’exhortations communautaires et domestiques, le possessif favorise le sens relationnel « épouses », tout en reconnaissant en note l’ambiguïté lexicale de γυνή.
- source_word: ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα
  choice: guidons … vers ce qui est bien
  rationale: La traduction conserve l’orientation vers le bien et exprime l’idée de redresser ou diriger sans suggérer une contrainte absente du texte.
theological_decisions:
- issue: Sens du titre Χριστός
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: « Jésus-Christ » est la forme française reçue, tandis qu’une note rappelle que Χριστός est un titre signifiant « Messie ».
- issue: Relation du génitif dans παιδείαν τοῦ φόβου τοῦ θεοῦ
  choice: la discipline de la crainte de Dieu
  alternative: la discipline qu’est la crainte de Dieu / la discipline qui découle de la crainte de Dieu
  rationale: La formulation avec « de » maintient l’ambiguïté du génitif grec au lieu de préciser sans nécessité si la crainte constitue la discipline ou en est la source.
- issue: Statut de ceux qui précèdent et des anciens
  choice: termes non institutionnalisés dans le corps du texte
  alternative: dirigeants et responsables ecclésiaux
  rationale: Le grec peut évoquer des personnes qui guident et des anciens, mais le verset ne suffit pas à imposer une structure ecclésiale précise.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La série d’exhortations à la première personne du pluriel et le rythme marqué par les points-virgules reproduisent la structure parénétique du grec. « Crainte de Dieu » est conservé comme expression biblique établie.
