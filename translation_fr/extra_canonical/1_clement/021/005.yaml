id: 1CLEM.21.5
reference: 1 Clement 21:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: fr
  text: Offensons plutôt des hommes insensés et dépourvus d’intelligence, qui s’enorgueillissent et se vantent avec l’arrogance de leurs paroles, plutôt que Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκόψωμεν
  choice: heurtons
  rationale: Le verbe peut évoquer le fait de faire obstacle, de provoquer une chute ou de causer une offense. « Heurtons » conserve une part de cette image et convient au contraste avec Dieu sans surinterpréter.
- source_word: ἄφροσι καὶ ἀνοήτοις
  choice: insensés et dépourvus de jugement
  rationale: 'Cette formulation distingue les deux adjectifs coordonnés : manque de sagesse pour ἄφροσι et manque de discernement ou de compréhension pour ἀνοήτοις.'
- source_word: ἐπαιρομένοις
  choice: qui s’enflent d’orgueil
  rationale: L’expression française rend naturellement l’idée d’élévation orgueilleuse portée par le participe.
- source_word: ἐγκαυχωμένοις
  choice: se glorifient
  rationale: Le choix restitue le sens de se vanter ou tirer gloire de quelque chose, ici avec le complément introduit par ἐν.
- source_word: ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  choice: de l’arrogance de leurs paroles
  rationale: « Paroles » rend λόγος dans ce contexte de discours prétentieux; le pluriel est idiomatique en français tout en conservant le sens collectif du singulier grec.
theological_decisions:
- issue: Comparaison entre offenser des humains et offenser Dieu
  choice: plutôt que Dieu
  alternative: plutôt que de heurter Dieu
  rationale: Le grec omet le second verbe dans une comparaison elliptique. L’ellipse est conservée, comme dans la source, sans expliciter davantage la nature de l’offense envers Dieu.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La répétition de « plutôt » reflète la structure comparative μᾶλλον… ἢ et renforce le choix moral exprimé dans le grec.
