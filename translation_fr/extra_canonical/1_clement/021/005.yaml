revisions:
- from: Heurtons plutôt des hommes insensés et dépourvus de jugement, qui s’enflent d’orgueil et se glorifient de l’arrogance de leurs paroles, plutôt que Dieu.
  to: Offensons plutôt des hommes insensés et dépourvus d’intelligence, qui s’enorgueillissent et se vantent avec l’arrogance de leurs paroles, plutôt que Dieu.
  rationale: La révision remplace un verbe français peu naturel dans ce contexte par « offensons », tout en gardant l’ellipse comparative du grec. Elle affine aussi la relation entre la vantardise et l’arrogance de leur parole, sans trancher au-delà de ce que permet la formulation grecque.
