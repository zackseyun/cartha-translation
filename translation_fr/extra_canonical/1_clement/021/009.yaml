id: 1CLEM.21.9
reference: 1 Clement 21:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐρευνητὴς γάρ ἐστιν ἐννοιῶν καὶ ἐνθυμήσεων· οὗ ἡ πνοὴ αὐτοῦ ἐν ἡμῖν ἐστίν, καὶ ὅταν θέλῃ, ἀνελεῖ αὐτήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: fr
  text: Car il sonde les pensées et les intentions ; son souffle est en nous et, quand il le voudra, il le retirera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητής
  choice: il sonde
  rationale: Le nom d’agent grec est rendu par une tournure verbale naturelle en français, qui conserve l’idée d’un examen profond.
- source_word: ἐννοιῶν
  choice: les pensées
  rationale: Désigne ici les contenus ou mouvements de l’esprit.
- source_word: ἐνθυμήσεων
  choice: les réflexions
  rationale: Conserve la proximité sémantique avec ἐννοιῶν sans confondre entièrement les deux termes ; peut englober les raisonnements et considérations intérieures.
- source_word: πνοή
  choice: souffle
  rationale: Rend directement l’image grecque du souffle vital, sans la préciser abusivement comme « vie » ou « esprit ».
- source_word: ἀνελεῖ
  choice: il le reprend
  rationale: Dans le contexte du souffle vital accordé par Dieu, « reprendre » exprime naturellement le retrait de la vie tout en évitant la dureté et l’ambiguïté référentielle de « l’enlèvera ».
theological_decisions:
- issue: Référent et nature du « souffle »
  choice: Maintenir « son souffle » comme réalité divine présente en nous
  alternative: Interpréter explicitement πνοή comme « notre vie » ou comme « son Esprit »
  rationale: Le grec dit littéralement que « son souffle » est en nous. La traduction conserve cette formulation et ne tranche pas entre souffle vital et une conception plus directement spirituelle.
- issue: Sens du retrait du souffle
  choice: « il le reprend »
  alternative: « il l’enlèvera » ou « il nous fera mourir »
  rationale: Cette formulation garde Dieu comme sujet souverain du retrait du souffle sans expliciter davantage que le texte la mort qui en résulte.
translation_notes:
  register: Français moderne, sobre et digne. Le point-virgule préserve l’unité et la progression de la phrase grecque. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
