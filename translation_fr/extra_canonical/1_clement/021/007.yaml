reference: 1 Clement 21:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: fr
  text: Qu’elles manifestent la beauté d’une conduite pure ; qu’elles démontrent l’intention sincère qui inspire leur douceur ; qu’elles fassent voir, par leur silence, la modération de leur langue ; qu’elles accordent saintement leur amour, sans favoritisme, mais de manière égale à tous ceux qui craignent Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιαγάπητον τῆς ἁγνείας ἦθος
  choice: la beauté d’une conduite pure
  rationale: ἦθος désigne ici la conduite ou le caractère; ἀξιαγάπητον exprime ce qui est aimable, admirable. Cette formulation naturelle conserve le lien avec ἁγνεία, la pureté.
- source_word: ἀκέραιον ... βούλημα
  choice: la sincérité de leur disposition
  rationale: ἀκέραιον évoque ce qui est intact, sans mélange et donc sincère; βούλημα peut désigner la volonté, l’intention ou la disposition. «Disposition» convient au trait intérieur associé à la douceur.
- source_word: πραΰτητος
  choice: douceur
  rationale: «Douceur» rend naturellement la qualité de πραΰτης sans la réduire à la faiblesse ou à la simple docilité.
- source_word: τὸ ἐπιεικὲς τῆς γλώσσης
  choice: la modération de leur langue
  rationale: ἐπιεικές peut exprimer la mesure, la douceur ou l’indulgence. Avec γλῶσσα et la mention du silence, «modération» restitue le contrôle de la parole.
- source_word: μὴ κατὰ προσκλίσεις
  choice: sans favoritisme
  rationale: πρόσκλισις désigne une inclination préférentielle ou un parti pris; «sans favoritisme» est idiomatique et clair en français moderne.
- source_word: ὁσίως
  choice: dans la sainteté
  rationale: L’adverbe qualifie probablement la manière dont l’amour est accordé. La formulation conserve toutefois la légère souplesse d’attachement présente en grec.
theological_decisions:
- issue: Portée de ὁσίως
  choice: rattacher «dans la sainteté» à l’action d’accorder l’amour
  alternative: 'le rattacher à «ceux qui craignent Dieu» : «tous ceux qui craignent Dieu saintement»'
  rationale: La position finale autorise une certaine ambiguïté, mais l’adverbe s’accorde plus naturellement avec le verbe principal παρεχέτωσαν. La traduction garde le syntagme en fin de phrase afin de ne pas rigidifier excessivement le lien.
- issue: Référent féminin implicite
  choice: employer «qu’elles»
  alternative: formulation épicène ou reprise nominale du groupe mentionné au verset précédent
  rationale: Les verbes grecs ne marquent pas le genre, mais αὐτῶν renvoie au groupe féminin du contexte immédiat de 1 Clément 21:6-7. Le pronom féminin assure la cohérence contextuelle.
translation_notes:
  register: Français moderne, digne et lisible. La série d’exhortations parallèles du grec est conservée par la répétition de «qu’elles». Aucun vocabulaire confessionnel particulier n’est introduit.
