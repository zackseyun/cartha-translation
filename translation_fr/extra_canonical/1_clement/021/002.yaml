  text: λέγει γάρ που· Πνεῦμα κυρίου λύχνος ἐρευνῶν τὰ ταμιεῖα τῆς γαστρός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/002.yaml
  text: For somewhere it says[a], “The Spirit of the Lord is a lamp, searching the inner chambers of the belly.”
translation:
  language: fr
  text: 'Car il est dit quelque part : « L’Esprit du Seigneur est une lampe qui sonde les chambres intérieures du ventre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les réserves du ventre ». L’expression désigne figurativement les parties les plus cachées de la personne.'
    reason: ταμιεῖα peut désigner des chambres intérieures ou des réserves; la note conserve cette nuance lexicale et explique l’image sans la substituer dans le texte.
lexical_decisions:
- source_word: λέγει γάρ που
  choice: Car il est dit quelque part
  rationale: Reproduit naturellement la formule d’introduction indéfinie, tout en conservant le lien explicatif marqué par γάρ.
- source_word: Πνεῦμα κυρίου
  choice: L’Esprit du Seigneur
  rationale: Traduction directe qui préserve la possibilité d’une référence à l’Esprit divin, sans réduire πνεῦμα à une simple faculté humaine.
- source_word: λύχνος
  choice: une lampe
  rationale: Équivalent courant et précis d’une lampe portative à huile dans ce contexte proverbial.
- source_word: ἐρευνῶν
  choice: qui sonde
  rationale: Exprime une recherche pénétrante et approfondie, plus idiomatique ici que « fouille ».
- source_word: τὰ ταμιεῖα τῆς γαστρός
  choice: les profondeurs de l’être
  rationale: Rend le sens figuré des chambres les plus intérieures de la personne. Une traduction anatomique littérale (« les chambres du ventre ») serait obscure et involontairement digestive en français moderne.
theological_decisions:
- issue: Référent de Πνεῦμα κυρίου
  choice: L’Esprit du Seigneur
  alternative: Le souffle du Seigneur
  rationale: La majuscule suit la compréhension probable du texte de 1 Clément et conserve sa portée théologique, tout en laissant la formulation elle-même parler sans ajout interprétatif.
- issue: Image anthropologique de γαστήρ
  choice: les profondeurs de l’être
  alternative: les chambres intérieures du ventre
  rationale: Le français figuré communique l’examen de l’intériorité humaine sans imposer une anthropologie technique ni transformer l’image en référence digestive.
translation_notes:
  register: Français international moderne, digne et fluide. La formulation garde le caractère proverbial de la citation et son mouvement de pénétration vers l’intériorité, sans archaïsme inutile.
