  to: Puisque donc nous avons pris part à des œuvres nombreuses, grandes et glorieuses, avançons vers le but de la paix qui nous a été transmis dès le commencement. Fixons notre regard sur le Père et Créateur de l’univers entier, et attachons-nous à ses dons de paix et à ses bienfaits, magnifiques et extraordinaires.
