base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/002.yaml
  text: Since, then, we have been deemed worthy of many great and glorious things, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world, and cling to his magnificent and surpassing gifts and benefits of peace.
translation:
  language: fr
  text: Puisque donc nous avons pris part à des œuvres nombreuses, grandes et glorieuses, avançons vers le but de la paix qui nous a été transmis dès le commencement. Fixons notre regard sur le Père et Créateur de l’univers entier, et attachons-nous à ses dons de paix et à ses bienfaits, magnifiques et extraordinaires.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετασχόντες
  choice: puisque nous avons pris part
  rationale: Le participe signifie littéralement « ayant eu part » ou « ayant participé ». Cette formulation suit le grec, qui ne dit pas ici que les destinataires ont été « jugés dignes ».
- source_word: πράξεων
  choice: œuvres
  rationale: Le terme peut désigner des actes, des actions ou des réalisations. « Œuvres » conserve l’ampleur du mot dans un registre digne sans attribuer nécessairement ces actes aux seuls destinataires.
- source_word: ἐκτελέσωμεν ἐπὶ ... σκοπόν
  choice: avançons jusqu’au but
  rationale: Dans ce contexte exhortatif, l’expression évoque une progression résolue vers un objectif. « Jusqu’au but » rend la préposition ἐπί avec l’accusatif sans alourdir le français.
- source_word: σκοπόν
  choice: but
  rationale: Le mot désigne la cible ou l’objectif visé; « but » est naturel et conserve l’image d’une orientation vers la paix.
- source_word: ἀτενίσωμεν
  choice: fixons notre regard
  rationale: Le verbe exprime un regard soutenu et attentif.
- source_word: κολληθῶμεν
  choice: attachons-nous
  rationale: Le verbe signifie adhérer étroitement, se joindre ou s’attacher; cette formulation restitue sa force sans suggérer une image physique maladroite.
- source_word: μεγαλοπρεπέσι καὶ ὑπερβαλλούσαις
  choice: magnifiques et incomparables
  rationale: « Magnifiques » rend la grandeur majestueuse; « incomparables » exprime en français naturel le caractère surpassant de ces dons.
- source_word: δωρεαῖς τῆς εἰρήνης εὐεργεσίαις τε
  choice: ses dons de paix ... ainsi qu’à ses bienfaits
  rationale: La coordination τε distingue les « dons de paix » des « bienfaits ». La traduction garde les deux éléments plutôt que de faire de « paix » un qualificatif de l’ensemble.
theological_decisions:
- issue: Nature de la participation aux « œuvres »
  choice: « nous avons pris part à des œuvres »
  alternative: « nous avons été jugés dignes de nombreuses choses »
  rationale: Le texte grec fourni porte μετασχόντες πράξεων, et non une forme de ἀξιόω. La traduction ne transforme donc pas la participation en déclaration de mérite ou de dignité.
- issue: Transmission de la paix « dès le commencement »
  choice: Conserver la formulation sans identifier explicitement l’origine ou les transmetteurs
  alternative: Préciser qu’elle vient de Dieu, du Christ ou des apôtres
  rationale: Le grec emploie un passif (« qui nous a été transmis ») et laisse l’agent implicite; l’expliciter résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, exhortatif et digne. La syntaxe a été légèrement segmentée pour la lisibilité, tout en conservant la progression du grec et ses pluriels théologiquement significatifs.
