source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: fr
  text: Ainsi donc, l’humilité et la soumission de tant de personnes, de telles personnes dont il a été rendu témoignage, manifestées dans l’obéissance, nous ont rendus meilleurs, non seulement nous, mais aussi les générations qui nous ont précédés, celles qui ont accueilli ses oracles dans la sainteté et la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρόνων
  choice: humilité
  rationale: Le terme désigne une disposition humble; le substantif français rend naturellement la qualité mise en avant dans la série grecque.
- source_word: τὸ ὑποδεές
  choice: la soumission
  rationale: Le mot exprime ici une disposition qui se place au-dessous et se soumet; «soumission» est clair et convient au lien explicite avec l’obéissance.
- source_word: τὰ λόγια αὐτοῦ
  choice: ses paroles divines
  rationale: λόγια désigne des paroles ou déclarations revêtues d’autorité divine; ce choix conserve cette nuance sans employer le terme peu courant «oracles».
- source_word: ἐν ὁσίῳ καὶ ἀληθείᾳ
  choice: dans la sainteté et la vérité
  rationale: La formulation maintient les deux notions grecques et leur caractère abstrait, dans un français digne et intelligible.
theological_decisions:
- issue: Référent du pronom αὐτοῦ («ses»).
  choice: Conserver le pronom sans préciser le référent.
  alternative: Traduire explicitement «les paroles divines de Dieu».
  rationale: Le verset grec laisse le référent implicite; l’expliciter résoudrait une donnée contextuelle que la phrase elle-même ne précise pas.
- issue: Relation de τοὺς τε καταδεξαμένους avec «les générations précédentes».
  choice: 'Rendre l’expression comme une apposition explicative: «c’est-à-dire ceux qui…».'
  alternative: 'La coordonner comme un groupe supplémentaire: «ainsi que ceux qui…».'
  rationale: L’accusatif reprend naturellement les générations antérieures en les caractérisant; l’apposition évite de créer artificiellement un troisième groupe.
translation_notes:
  register: Français international moderne, naturel et digne. La longue période grecque est conservée tout en étant clarifiée par «c’est-à-dire». Aucun marqueur de note n’est requis.
