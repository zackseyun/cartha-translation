base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/003.yaml
  text: Let us behold him in our mind, and let us look with the eyes of the soul into his patient purpose. Let us understand how free from anger he is toward all his creation.
translation:
  language: fr
  text: Contemplons-le par la pensée et fixons les yeux de notre âme sur son dessein empreint de patience. Comprenons combien il est exempt de colère envers toute sa création.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν αὐτὸν κατὰ διάνοιαν
  choice: Contemplons-le par la pensée
  rationale: Rend l’idée d’une contemplation intérieure et mentale dans un français naturel et digne.
- source_word: τοῖς ὄμμασιν τῆς ψυχῆς
  choice: les yeux de notre âme
  rationale: Conserve la métaphore anthropologique explicite du grec.
- source_word: τὸ μακρόθυμον αὐτοῦ βούλημα
  choice: son dessein patient
  rationale: Préserve le lien entre βούλημα, le dessein ou la volonté, et μακρόθυμον, la patience prolongée, sans réduire l’expression à la seule patience divine.
- source_word: ἀόργητος
  choice: exempt de colère
  rationale: Traduit directement l’absence de colère, plutôt qu’un simple calme ou une lenteur à s’irriter.
- source_word: πᾶσαν τὴν κτίσιν αὐτοῦ
  choice: toute sa création
  rationale: Restitue la portée universelle de πᾶσαν et le sens collectif de κτίσις.
theological_decisions:
- issue: Portée de l’absence de colère divine
  choice: combien il est exempt de colère envers toute sa création
  alternative: combien il est lent à la colère envers toute sa création
  rationale: Le grec ἀόργητος indique ici l’absence de colère, non simplement une colère différée. La formulation conserve cette affirmation forte sans en tirer de conclusion doctrinale supplémentaire.
- issue: Sens de βούλημα
  choice: dessein
  alternative: volonté
  rationale: « Dessein » exprime l’orientation intentionnelle contemplée dans le contexte, tandis que « volonté » reste possible; le choix évite toutefois une abstraction moins naturelle avec l’adjectif « patient ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les impératifs exhortatifs à la première personne du pluriel et les métaphores du regard intérieur sont conservés.
