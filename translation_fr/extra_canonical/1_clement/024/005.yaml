id: 1CLEM.24.5
reference: 1 Clement 24:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
translation:
  language: fr
  text: Le semeur est sorti et a jeté en terre chacune des graines. Celles-ci, une fois tombées dans la terre, sèches et nues, se décomposent. Puis, à partir de cette décomposition, la grandeur de la providence du Maître les fait lever ; et d’une seule graine, plusieurs croissent et portent du fruit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « et, à partir d’une seule graine, elle en fait croître plusieurs et produit du fruit », « elle » désignant la grandeur de la providence du Maître.'
    reason: Le grec permet soit de prendre le neutre pluriel « plusieurs » comme sujet de verbes au singulier, soit de poursuivre avec le sujet singulier « la grandeur de la providence du Maître ».
lexical_decisions:
- source_word: σπείρων
  choice: semeur
  rationale: Terme français courant qui conserve l’image agricole et la forme substantivée du grec.
- source_word: διαλύεται / διαλύσεως
  choice: se décomposent / décomposition
  rationale: Rend la désagrégation des graines dans la terre tout en maintenant la répétition lexicale du grec.
- source_word: ἡ μεγαλειότης τῆς προνοίας
  choice: la grandeur de la providence
  rationale: Traduction formellement proche qui conserve la personnification de la providence et la solennité de l’expression.
- source_word: δεσπότου
  choice: Maître
  rationale: Préserve le sens d’autorité souveraine de δεσπότης sans le confondre automatiquement avec κύριος.
- source_word: ἀνίστησιν
  choice: fait lever
  rationale: Expression naturelle pour les graines, tout en laissant résonner le sens plus large de relèvement qui soutient l’analogie avec la résurrection.
- source_word: καρπόν
  choice: du fruit
  rationale: Conserve le singulier collectif du grec et son idiome agricole.
theological_decisions:
- issue: Sujet de αὔξει et ἐκφέρει après πλείονα
  choice: '« plusieurs croissent et portent du fruit » : πλείονα est compris comme un neutre pluriel sujet de verbes au singulier, usage grec régulier.'
  alternative: 'Comprendre « la grandeur de la providence » comme sujet continué : « elle en fait croître plusieurs et produit du fruit ».'
  rationale: 'La lecture retenue donne une progression agricole cohérente : d’une seule graine proviennent plusieurs pousses qui croissent et fructifient. Comme la syntaxe permet aussi un sujet singulier continué, l’autre analyse est signalée en note plutôt qu’effacée.'
translation_notes:
  register: Français international moderne, digne et lisible. L’image agricole est rendue avec un vocabulaire courant. « Fait lever » conserve à la fois le naturel de la germination et l’écho du relèvement, essentiel dans ce passage consacré à la résurrection.
