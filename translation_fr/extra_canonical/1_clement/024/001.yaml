source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
translation:
  language: fr
  text: 'Considérons, bien-aimés, comment le Maître nous montre sans cesse que la résurrection à venir aura lieu : il a fait du Seigneur Jésus-Christ les prémices en le ressuscitant d’entre les morts.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατανοήσωμεν
  choice: Considérons
  rationale: Rend naturellement l’exhortation délibérative à examiner attentivement.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Distingue δεσπότης de κύριος dans la même phrase, tout en conservant l’idée d’autorité souveraine.
- source_word: διηνεκῶς
  choice: sans cesse
  rationale: Expression française courante qui traduit l’idée de continuité.
- source_word: τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι
  choice: que la résurrection à venir aura lieu
  rationale: Reproduit clairement l’affirmation grecque de la réalité future de la résurrection sans redondance artificielle.
- source_word: τὴν ἀπαρχήν
  choice: les prémices
  rationale: Terme biblique français consacré pour la première part annonçant et garantissant la récolte à venir.
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  choice: du Seigneur Jésus-Christ
  rationale: Conserve le titre κύριος et rend Χριστός par la forme française traditionnelle « Christ ».
- source_word: ἐκ νεκρῶν ἀναστήσας
  choice: en le ressuscitant d’entre les morts
  rationale: Rend explicitement l’action causative de Dieu et l’expression grecque littérale « d’entre les morts ».
theological_decisions:
- issue: Rapport entre la résurrection de Jésus et la résurrection future
  choice: « il en a fait du Seigneur Jésus-Christ les prémices »
  alternative: « dont il a établi le Seigneur Jésus-Christ comme prémices »
  rationale: La formulation retenue conserve l’image agricole et le lien référentiel avec la résurrection à venir, sans développer davantage sa portée théologique.
- issue: Sens de Χριστός
  choice: « Christ »
  alternative: « Messie »
  rationale: « Christ » est la forme française naturelle du titre dans le nom composé « Jésus-Christ » et ne réduit pas Χριστός à un nom propre dépourvu de valeur titulaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure argumentative grecque, avec deux-points pour éviter une relative lourde tout en maintenant le lien entre la résurrection future et Jésus comme prémices.
