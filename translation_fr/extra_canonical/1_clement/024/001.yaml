  rationale: La révision se limite à corriger la syntaxe française de « faire de quelqu’un les prémices », tout en préservant la structure, l’image des prémices, l’antécédent de « en » (la résurrection à venir) et le moyen divin exprimé par « en le ressuscitant ».
