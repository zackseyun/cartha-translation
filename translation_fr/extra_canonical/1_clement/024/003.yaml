id: 1CLEM.24.3
reference: 1 Clement 24:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμέρα καὶ νὺξ ἀνάστασιν ἡμῖν δηλοῦσιν· κοιμᾶται ἡ νύξ, ἀνίσταται ἡ ἡμέρα· ἡ ἡμέρα ἄπεισιν, νὺξ ἐπέρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/003.yaml
  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
translation:
  language: fr
  text: 'Le jour et la nuit nous montrent une résurrection : la nuit s’endort, le jour se lève ; le jour s’en va, la nuit arrive.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασιν
  choice: une résurrection
  rationale: Le nom grec désigne un relèvement ou une résurrection. Dans le contexte de 1 Clément 24, « résurrection » conserve clairement la portée de l’illustration.
- source_word: κοιμᾶται
  choice: s’endort
  rationale: Traduction directe de l’image du sommeil, qui participe au parallèle implicite entre la nuit, le réveil du jour et la résurrection.
- source_word: ἀνίσταται
  choice: se lève
  rationale: Rend naturellement le lever du jour tout en préservant l’écho lexical avec ἀνάστασις, que le français ne peut reproduire entièrement.
- source_word: ἄπεισιν
  choice: s’en va
  rationale: Expression française courante et fidèle au sens de départ du jour.
- source_word: ἐπέρχεται
  choice: arrive
  rationale: Rend simplement le mouvement d’approche de la nuit, sans surcharge.
theological_decisions:
- issue: Portée de ἀνάστασις
  choice: « une résurrection »
  alternative: « la résurrection »
  rationale: L’absence d’article et la fonction analogique de la succession du jour et de la nuit favorisent « une résurrection », sans réduire pour autant le lien avec la résurrection eschatologique traitée dans le contexte.
translation_notes:
  register: 'Français moderne, digne et accessible. La juxtaposition sans conjonctions ajoutées conserve le rythme bref et contrasté du grec : « la nuit s’endort, le jour se lève ; le jour s’en va, la nuit arrive ».'
