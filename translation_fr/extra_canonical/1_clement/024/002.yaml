  yaml_path: translation/extra_canonical/1_clement/024/002.yaml
  text: Let us observe, beloved, the resurrection that takes place in due season.
translation:
  language: fr
  text: Considérons, bien-aimés, la résurrection qui se produit au moment voulu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Considérons
  rationale: L’exhortation à la première personne du pluriel invite à observer attentivement un phénomène; « considérons » est naturel et digne en français.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Ce vocatif affectueux traditionnel restitue directement le grec tout en restant compréhensible.
- source_word: ἀνάστασιν
  choice: la résurrection
  rationale: Équivalent direct qui préserve aussi la portée illustrative du terme dans le contexte.
- source_word: κατὰ καιρόν
  choice: au moment voulu
  rationale: Rend l’idée d’une occurrence conforme à son temps opportun, sans introduire de possessif absent du grec.
- source_word: γινομένην
  choice: qui se produit
  rationale: Exprime le processus ou l’événement en train d’advenir, avec une formulation française naturelle.
theological_decisions:
- issue: Portée du mot ἀνάστασις
  choice: Conserver « résurrection » sans explicitation
  alternative: « renouveau » ou « retour à la vie »
  rationale: Le terme grec porte une résonance théologique réelle, tout en étant appliqué ici à un phénomène observable; le conserver maintient cette tension sans l’interpréter à la place du lecteur.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’adresse affectueuse et la formulation exhortative du grec.
