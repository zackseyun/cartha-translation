  text: Because of jealousy and strife, great cities have been overthrown and great nations uprooted.
translation:
  language: fr
  text: La jalousie et la discorde ont détruit de grandes villes et déraciné de grandes nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: jalousie
  rationale: Dans le contexte immédiat, le terme désigne une passion destructrice; « jalousie » rend naturellement ce sens en français.
- source_word: ἔρις
  choice: rivalités
  rationale: Le pluriel français exprime bien la discorde conflictuelle et durable évoquée ici, sans limiter le sens à une seule querelle.
- source_word: κατέστρεψεν
  choice: ont détruit
  rationale: Le verbe actif signifie ici renverser ou détruire; « détruire » convient directement à des villes et respecte la voix du grec.
- source_word: ἐξερίζωσεν
  choice: déraciné
  rationale: Cette traduction conserve l'image forte de l'arrachage à la racine appliquée aux nations.
