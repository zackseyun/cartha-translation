id: 1CLEM.6.1
reference: 1 Clement 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Τούτοις τοῖς ἀνδράσιν ὁσίως πολιτευσαμενοις συνηθροίσθη πολὺ πλῆθος ἐκλεκτῶν, οἵτινες πολλαῖς αἰκίαις καὶ βασάνοις διὰ ζῆλος παθόντες ὑπόδειγμα κάλλιστον ἐγένοντο ἐν ἡμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
translation:
  language: fr
  text: À ces hommes qui s’étaient conduits saintement vint s’ajouter une grande multitude d’élus. Ayant subi bien des sévices et des tortures à cause de la jalousie, ils devinrent parmi nous un exemple des plus admirables.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  choice: qui s’étaient conduits saintement
  rationale: Rend l’adverbe ὁσίως et le sens comportemental de πολιτεύομαι dans un français naturel et digne.
- source_word: συνηθροίσθη
  choice: vint s’ajouter
  rationale: Le passif exprime ici le rassemblement ou l’adjonction de cette multitude aux hommes déjà mentionnés; cette formulation conserve le lien sans lourdeur.
- source_word: πολὺ πλῆθος ἐκλεκτῶν
  choice: une grande multitude d’élus
  rationale: Traduction directe qui préserve la portée collective et le terme ἐκλεκτοί.
- source_word: πολλαῖς αἰκίαις καὶ βασάνοις
  choice: bien des sévices et des tortures
  rationale: αἰκία désigne des mauvais traitements outrageants ou brutaux, tandis que βάσανος évoque ici les tortures; «sévices» évite un doublon.
- source_word: διὰ ζῆλος
  choice: à cause de la jalousie
  rationale: Malgré la forme ζῆλος là où l’on attendrait normalement l’accusatif après διά causal, le contexte immédiat de 1 Clément favorise le sens de jalousie comme cause des persécutions.
- source_word: ὑπόδειγμα κάλλιστον
  choice: un exemple des plus admirables
  rationale: Exprime le superlatif κάλλιστον de façon idiomatique sans réduire le terme à la seule beauté esthétique.
- source_word: ἐν ἡμῖν
  choice: parmi nous
  rationale: Conserve la valeur communautaire de la préposition et l’inclusion du locuteur.
theological_decisions:
- issue: Portée du terme ἐκλεκτῶν
  choice: d’élus
  alternative: de personnes choisies
  rationale: «Élus» est le correspondant traditionnel et précis, sans préciser par qui ni selon quel système théologique.
- issue: Référent et portée de la jalousie
  choice: à cause de la jalousie
  alternative: par zèle
  rationale: Le contexte de la section présente la jalousie comme moteur de la persécution; la traduction ne précise toutefois pas explicitement de qui elle provient.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Deux phrases sont employées pour alléger la longue période grecque, tout en conservant ses relations logiques et son mouvement.
