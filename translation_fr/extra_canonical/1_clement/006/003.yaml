base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/003.yaml
  text: 'Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone from my bones and flesh from my flesh.”'
translation:
  language: fr
  text: 'La jalousie a séparé des femmes de leurs maris et a altéré ce qui avait été dit par notre père Adam : « Cette fois-ci, voici un os de mes os et une chair de ma chair. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: la jalousie
  rationale: Dans ce contexte, le terme désigne une passion destructrice; « jalousie » restitue naturellement cette valeur négative.
- source_word: ἀπηλλοτρίωσεν
  choice: a éloigné
  rationale: Le verbe exprime l’idée de rendre étranger ou de séparer; « éloigné » reste idiomatique tout en conservant la dimension relationnelle.
- source_word: ἠλλοίωσεν
  choice: dénaturé
  rationale: Le verbe signifie « changer, altérer ». Ici, « dénaturé » rend le contraste entre l’union conjugale proclamée par Adam et la rupture causée par la jalousie.
- source_word: Τοῦτο νῦν
  choice: Cette fois, voici
  rationale: La formule reprend Genèse 2.23. « Cette fois » rend νῦν dans son sens idiomatique, tandis que « voici » donne en français une citation naturelle et solennelle.
- source_word: ὀστοῦν ἐκ τῶν ὀστέων μου καὶ σὰρξ ἐκ τῆς σαρκός μου
  choice: l’os de mes os et la chair de ma chair
  rationale: Traduction formellement proche de l’expression sémitique transmise par le grec, dont la force et la familiarité bibliques doivent être conservées.
theological_decisions:
- issue: Portée de la citation d’Adam
  choice: Conserver explicitement « notre père Adam » et la citation de Genèse 2.23
  alternative: Reformuler comme une simple allusion à l’unité conjugale
  rationale: Le texte présente Adam comme père commun et fonde son contraste rhétorique sur ses paroles mêmes; une paraphrase atténuerait cette portée.
- issue: Sens de ἠλλοίωσεν appliqué à la parole biblique
  choice: « dénaturé la parole »
  alternative: « changé ce qui avait été dit »
  rationale: Il ne s’agit vraisemblablement pas d’une modification textuelle de la citation, mais de sa contradiction dans les faits par la séparation des époux. « Dénaturé » préserve cette tension sans l’expliquer excessivement.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la concision sentencieuse du grec ainsi que le parallélisme de la citation biblique.
