base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/002.yaml
  text: Because of jealousy, women were persecuted as Danaids and Dircae; after suffering terrible and unholy outrages, they safely reached the goal of the faith and received a noble reward, though weak in body.
translation:
  language: fr
  text: À cause de la jalousie, des femmes furent persécutées comme les Danaïdes et les Dircéennes[a]. Après avoir subi de terribles sévices, qu’elles affrontèrent avec courage[b], elles parvinrent au terme assuré de la course de la foi et reçurent une noble récompense, elles qui étaient faibles de corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « Danaïdes » et les « Dircéennes » renvoient probablement à des supplices publics où des femmes furent contraintes de jouer des figures de la mythologie grecque. La formulation grecque, très concise, peut aussi se comprendre comme une désignation directe de ces femmes.
    reason: Le référent historique et la relation syntaxique des noms mythologiques demeurent incertains; la note préserve cette ambiguïté.
  - marker: b
    text: Le texte grec fourni porte littéralement « de terribles sévices courageux » ou « virils », expression difficile que l’on peut comprendre comme des sévices affrontés avec courage. Une autre leçon ancienne, souvent retenue, signifie « de terribles et impies sévices ».
    reason: La leçon ἀνδρία du texte source est difficile et diffère de ἀνόσια, largement attesté ou adopté. La traduction suit le texte fourni tout en informant le lecteur de la variante importante.
lexical_decisions:
- source_word: ζῆλος
  choice: jalousie
  rationale: Dans le contexte de 1 Clément 5–6, le terme désigne la jalousie ou l’envie qui provoque la persécution; « jalousie » maintient le fil lexical du passage.
- source_word: Δαναΐδες καὶ Δίρκαι
  choice: les Danaïdes et les Dircéennes
  rationale: Ces pluriels renvoient vraisemblablement à des femmes mises en scène ou suppliciées sous les traits des Danaïdes et de Dircé. « Dircéennes » conserve le pluriel grec tout en évitant de présenter toutes ces femmes comme portant le nom propre Dircé.
- source_word: αἰκίσματα
  choice: sévices
  rationale: Le mot désigne des mauvais traitements outrageants, des tortures ou des mutilations; « sévices » est naturel, fort et suffisamment large.
- source_word: ἐπὶ τὸν τῆς πίστεως βέβαιον δρόμον κατήντησαν
  choice: elles parvinrent au terme assuré de la course de la foi
  rationale: δρόμος évoque une course ou un parcours, et καταντάω l’arrivée à un point. Cette formulation conserve la métaphore athlétique et exprime l’aboutissement sans réduire la foi à un simple « but ».
- source_word: γέρας γενναῖον
  choice: une noble récompense
  rationale: γέρας est une marque d’honneur ou une récompense; γενναῖον signifie ici noble, digne. La formulation française reste naturelle et solennelle.
- source_word: αἱ ἀσθενεῖς τῷ σώματι
  choice: elles qui étaient faibles de corps
  rationale: La tournure garde le contraste rhétorique entre faiblesse corporelle et courage/endurance, sans approuver comme vérité générale un jugement sur toutes les femmes.
theological_decisions:
- issue: Nature de la « course de la foi »
  choice: Conserver la métaphore de la course et son aboutissement assuré
  alternative: « elles atteignirent sûrement le but de la foi »
  rationale: Le grec associe δρόμος, la course ou le parcours, à κατήντησαν, l’arrivée. La traduction ne précise pas davantage la nature eschatologique de la récompense, que le texte laisse implicite.
- issue: Référents mythologiques des Danaïdes et de Dircé
  choice: 'Traduire comme des rôles ou formes de supplice: « comme les Danaïdes et les Dircéennes »'
  alternative: Comprendre « des femmes, Danaïdes et Dircéennes » comme des catégories directement nommées
  rationale: La syntaxe est concise et historiquement discutée. « Comme » rend l’interprétation probable d’une mise en scène persécutrice tout en signalant en note l’incertitude.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’intensité du martyre, la métaphore athlétique et le contraste final. Les termes mythologiques et la difficulté textuelle de ἀνδρία sont explicités sans imposer une reconstruction confessionnelle ou historique.
