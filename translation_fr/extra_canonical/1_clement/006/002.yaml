review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la causalité de διὰ ζῆλος, les persécutions, la métaphore de la course, la récompense et la faiblesse corporelle. Toutefois, « comme les Danaïdes et les Dircéennes » impose une relation comparative qui n’est pas explicitement marquée par le grec, et « Dircéennes » n’est pas une désignation française établie. Le rendu de καὶ ἀνδρία par une proposition relative (« qu’elles affrontèrent avec courage ») est interprétatif; la difficulté doit rester signalée sans faire de cette interprétation le seul sens du texte.
  naturalness: Le français est globalement fluide et digne. « Au terme assuré de la course de la foi » est toutefois moins naturel que « au terme de la course sûre de la foi », qui respecte aussi plus directement la portée de βέβαιον sur δρόμον. « Danaïdes et Dircés » est plus lisible et plus idiomatique en français que « Danaïdes et Dircéennes ».
  terminology: « Jalousie », « sévices », « course de la foi », « noble récompense » et « faibles de corps » conviennent au registre et au vocabulaire. Les noms mythologiques doivent être conservés sous une forme française reconnue; « Dircés » est le pluriel usuel de Dircé. La note textuelle doit distinguer clairement le texte fourni (ἀνδρία) de la leçon ἀνόσια, sans qualifier cette dernière de manière excessive.
  issues:
  - severity: medium
    issue: La construction « comme les Danaïdes et les Dircéennes » surinterprète l’apposition grecque.
    rationale: Δαναΐδες καὶ Δίρκαι suit γυναῖκες sans marque explicite de comparaison. Une apposition française conserve mieux l’ambiguïté, tandis qu’une note peut indiquer l’interprétation historique probable.
  - severity: medium
    issue: « Dircéennes » n’est pas une forme française usuelle et paraît créer un ethnonyme ou un adjectif.
    rationale: Δίρκαι est le pluriel du nom Dircé. « Dircés » conserve le nom propre et son pluriel français naturel.
  - severity: medium
    issue: « qu’elles affrontèrent avec courage » fixe de façon trop affirmative le sens de καὶ ἀνδρία.
    rationale: La leçon du texte fourni est grammaticalement et sémantiquement difficile; elle ne justifie pas à elle seule cette explicitation. Une formulation plus réservée dans le texte, avec note, préserve la difficulté.
  revised_text: À cause de la jalousie, des femmes, Danaïdes et Dircés[a], furent persécutées. Après avoir subi de terribles sévices et fait preuve de courage[b], elles parvinrent au terme de la course sûre de la foi et reçurent une noble récompense, bien que faibles de corps.
  revised_footnotes:
  - marker: a
    text: Les « Danaïdes » et les « Dircés » sont des figures de la mythologie grecque. La syntaxe grecque les place en apposition à « femmes »; elle peut renvoyer à des femmes ainsi désignées ou, plus probablement, à des supplices publics les mettant en scène sous ces figures.
    reason: Préserve l’ambiguïté syntaxique et l’incertitude historique sans introduire dans le texte une comparaison absente du grec.
  - marker: b
    text: 'Le texte grec fourni lit littéralement un terme apparenté à « courage » ou « virilité », dans une expression difficile. Une autre leçon ancienne, souvent adoptée, lit « impies » : « de terribles et impies sévices ».'
    reason: Signale la difficulté de ἀνδρία et la variante importante ἀνόσια, sans présenter l’une ou l’autre comme certaine.
  revision_rationale: La révision remplace la comparaison interprétative par une apposition, emploie la forme française usuelle « Dircés », et rend plus directement la leçon difficile ἀνδρία tout en maintenant une note sur la variante. Elle améliore également le français et le rapport syntaxique entre βέβαιον et δρόμον, sans préciser indûment la portée théologique de la course ou de la récompense.
