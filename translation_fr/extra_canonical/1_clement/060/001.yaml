id: 1CLEM.60.1
reference: 1 Clement 60:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
translation:
  language: fr
  text: Car c’est toi qui as manifesté l’ordre éternel du monde par tes œuvres. Toi, Seigneur, tu as créé la terre habitée. Tu es fidèle à travers toutes les générations, juste dans tes jugements, admirable par ta puissance et ta majesté, sage quand tu crées et avisé quand tu affermis ce qui est venu à l’existence, bon dans les réalités visibles et fidèle envers ceux qui mettent leur confiance en toi. Toi qui es miséricordieux et compatissant, pardonne-nous nos actes contraires à la loi, nos injustices, nos fautes et nos manquements.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀέναον … σύστασιν
  choice: l’ordre éternel
  rationale: « Σύστασις » désigne ici l’organisation ou l’ordonnance durable du monde; « ordre » est naturel en français tout en conservant le sens cosmologique.
- source_word: διὰ τῶν ἐνεργουμένων
  choice: par tes œuvres
  rationale: Le participe substantivé renvoie à ce qui est accompli ou produit par Dieu. « Tes œuvres » rend clairement l’agent implicite dans le contexte.
- source_word: οἰκουμένην
  choice: la terre habitée
  rationale: Conserve le sens propre du terme, qui désigne le monde habité plutôt que la création entière.
- source_word: ἑδράσαι
  choice: affermis
  rationale: Exprime l’action d’établir solidement ou de rendre stable ce qui a été créé.
- source_word: ἀνομίας … ἀδικίας … παραπτώματα … πλημμελείας
  choice: actes contraires à la loi … injustices … fautes … manquements
  rationale: Maintient les quatre catégories de faute sans les réduire à une répétition indistincte.
theological_decisions:
- issue: Rapport syntaxique de ἐλεῆμον καὶ οἰκτίρμον avec la demande de pardon
  choice: « Toi qui es miséricordieux et compatissant, pardonne-nous »
  alternative: « fidèle envers ceux qui mettent leur confiance en toi, miséricordieux et compatissant. Pardonne-nous »
  rationale: Les adjectifs sont compris comme des vocatifs liés à l’impératif ἄφες, conformément à leur forme et à la transition de la louange vers la supplication.
- issue: Sens de πιστός envers ceux qui se confient en Dieu
  choice: « fidèle envers ceux qui mettent leur confiance en toi »
  alternative: « digne de confiance pour ceux qui mettent leur confiance en toi »
  rationale: La formulation préserve la réciprocité rhétorique entre la confiance humaine et la fidélité divine sans préciser davantage la manière dont cette fidélité s’exerce.
