id: 1CLEM.60.4
reference: 1 Clement 60:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
translation:
  language: fr
  text: Accorde-nous la concorde et la paix, ainsi qu’à tous les habitants de la terre, comme tu l’as fait pour nos pères lorsqu’ils t’invoquaient dans la sainteté, dans la foi et dans la vérité, en devenant obéissants[a] à ton nom tout-puissant et parfait en toute vertu, ainsi qu’à nos dirigeants et à nos chefs sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec rattache très probablement « en devenant obéissants » aux personnes qui prient, et non à leurs pères : le participe est à l’accusatif pluriel, tandis que « nos pères » est exprimé dans une construction au génitif.'
    reason: Clarifier le rattachement grammatical du participe, qui demeure difficile dans la longue phrase grecque.
lexical_decisions:
- source_word: ὁμόνοιαν
  choice: la concorde
  rationale: Dans 1 Clément, le terme désigne l’entente et l’unité civique opposées aux divisions; « concorde » restitue cette portée plus précisément qu’« harmonie ».
- source_word: ὁσίως
  choice: avec sainteté
  rationale: Rend l’adverbe grec sans le confondre avec la seule sincérité ou la piété subjective.
- source_word: παντοκράτορι
  choice: tout-puissant
  rationale: Équivalent français établi et naturel pour ce qualificatif appliqué au nom divin.
- source_word: παναρέτῳ
  choice: parfaitement vertueux
  rationale: Exprime l’idée d’une vertu ou excellence totale, tout en conservant le caractère inhabituel du qualificatif appliqué au « nom ».
- source_word: ἄρχουσιν καὶ ἡγουμένοις
  choice: dirigeants et chefs
  rationale: Conserve les deux désignations de l’autorité sans leur attribuer une fonction politique plus précise que le grec.
theological_decisions:
- issue: Référent de ὑπηκόους γινομένους
  choice: « tandis que nous devenons obéissants » renvoie aux demandeurs
  alternative: Faire du participe une description des « pères »
  rationale: Le participe est à l’accusatif pluriel, tandis que « nos pères » est repris par le génitif αὐτῶν dans la construction absolue. Le rattacher aux pères produirait en outre l’idée qu’ils obéissaient à « nos » dirigeants terrestres. L’accusatif renvoie donc le plus vraisemblablement aux bénéficiaires implicites de la demande.
- issue: Obéissance au nom divin et aux autorités terrestres
  choice: Maintenir les deux compléments coordonnés
  alternative: Dissocier l’obéissance aux autorités du participe
  rationale: Les datifs τῷ… ὀνόματί σου et τοῖς τε ἄρχουσιν καὶ ἡγουμένοις dépendent naturellement tous deux de ὑπηκόους; la traduction conserve cette tension sans l’atténuer.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période de la prière grecque est conservée, avec une ponctuation qui distingue l’exemple des pères de l’engagement présent des demandeurs.
