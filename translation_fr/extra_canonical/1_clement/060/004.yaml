    text: 'Le grec rattache très probablement « en devenant obéissants » aux personnes qui prient, et non à leurs pères : le participe est à l’accusatif pluriel, tandis que « nos pères » est exprimé dans une construction au génitif.'
    reason: Clarifier le rattachement grammatical du participe, qui demeure difficile dans la longue phrase grecque.
