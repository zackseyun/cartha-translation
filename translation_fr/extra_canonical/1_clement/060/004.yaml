review_pass:
  verdict: revise
  source_fidelity: Le rattachement de ὑπηκόους γινομένους aux bénéficiaires implicites (« nous ») est bien rendu. Les deux datifs coordonnés, le nom divin et les autorités terrestres, doivent rester les compléments d’« obéissants ». La comparaison avec les pères est conservée sans faire d’eux les sujets de l’obéissance aux autorités actuelles.
  naturalness: La formulation « tandis que nous devenons obéissants » crée un rapport temporel inutilement marqué et alourdit la période. « En devenant obéissants » restitue plus directement le participe tout en gardant son lien avec « nous ». « Comme tu l’as fait pour nos pères » est plus idiomatique et évite la reprise un peu lourde de « les ».
  terminology: « Concorde » rend bien ὁμόνοια dans son registre communautaire et civique. « Dans la sainteté » est plus naturel que « avec sainteté » pour ὁσίως. « Parfaitement vertueux » est compréhensible, mais peu naturel appliqué à un nom ; « parfait en toute vertu » maintient l’expression inhabituelle et exhaustive de παναρέτῳ sans la banaliser.
  issues:
  - severity: medium
    issue: Lien participial rendu comme une circonstance temporelle
    rationale: « Tandis que nous devenons obéissants » suggère que la demande de concorde et de paix se déroule simplement au même moment que l’obéissance. Le participe accusatif qualifie plutôt les demandeurs implicites ; « en devenant obéissants » conserve ce rapport sans imposer une temporalité forte.
  - severity: low
    issue: Collocation française de ὁσίως
    rationale: « Avec sainteté » est grammaticalement possible mais peu idiomatique dans une prière française moderne. « Dans la sainteté » est plus fluide tout en préservant le sens de conduite sainte/pieuse.
  - severity: low
    issue: Rendu de παναρέτῳ
    rationale: « Parfaitement vertueux » sonne abstrait et peu usuel avec « nom ». « Parfait en toute vertu » conserve l’intensité inclusive du grec et son application inhabituelle au nom divin.
  revised_text: Accorde-nous la concorde et la paix, ainsi qu’à tous les habitants de la terre, comme tu l’as fait pour nos pères lorsqu’ils t’invoquaient dans la sainteté, dans la foi et dans la vérité, en devenant obéissants[a] à ton nom tout-puissant et parfait en toute vertu, ainsi qu’à nos dirigeants et à nos chefs sur la terre.
  revised_footnotes:
