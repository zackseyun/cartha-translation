revisions:
- from: Donne la concorde et la paix, à nous comme à tous les habitants de la terre, ainsi que tu les as données à nos pères lorsqu’ils t’invoquaient avec sainteté, dans la foi et la vérité, tandis que nous devenons obéissants[a] à ton nom tout-puissant et parfaitement vertueux, ainsi qu’à nos dirigeants et à nos chefs sur la terre.
  to: Accorde-nous la concorde et la paix, ainsi qu’à tous les habitants de la terre, comme tu l’as fait pour nos pères lorsqu’ils t’invoquaient dans la sainteté, dans la foi et dans la vérité, en devenant obéissants[a] à ton nom tout-puissant et parfait en toute vertu, ainsi qu’à nos dirigeants et à nos chefs sur la terre.
  rationale: 'Révision limitée à la syntaxe française, à une collocation plus naturelle et au rendu de l’adjectif rare παναρέτῳ. Le texte préserve la construction grecque : les demandeurs sont ceux qui deviennent obéissants, et cette obéissance vise à la fois le nom divin et les autorités terrestres.'
