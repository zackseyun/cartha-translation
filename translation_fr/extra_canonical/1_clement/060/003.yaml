- from: Oui, Maître, fais briller ton visage sur nous, pour notre bien, dans la paix, afin que ta main puissante nous protège, que ton bras élevé nous délivre de tout péché et que tu nous sauves de ceux qui nous haïssent injustement.
  to: Oui, Maître, fais briller ton visage sur nous, pour notre bien, dans la paix, afin que nous soyons abrités par ta main puissante et délivrés de tout péché par ton bras élevé ; et sauve-nous de ceux qui nous haïssent injustement.
  rationale: La révision rétablit la valeur impérative de ῥῦσαι par « sauve-nous », tout en conservant les deux infinitifs passifs de but rendus naturellement par « afin que nous soyons abrités… et délivrés… ». Aucun autre changement de sens n’est nécessaire.
