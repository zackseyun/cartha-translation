id: 1CLEM.60.3
reference: 1 Clement 60:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: fr
  text: Oui, Maître, fais briller ton visage sur nous, pour notre bien, dans la paix, afin que nous soyons abrités par ta main puissante et délivrés de tout péché par ton bras élevé ; et sauve-nous de ceux qui nous haïssent injustement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  choice: Maître
  rationale: Rend l’adresse respectueuse au souverain maître sans introduire un titre confessionnel absent du grec.
- source_word: ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς
  choice: fais briller ton visage sur nous
  rationale: Conserve l’image biblique du visage divin qui rayonne sur les fidèles.
- source_word: εἰς ἀγαθὰ ἐν εἰρήνῃ
  choice: pour notre bien, dans la paix
  rationale: Préserve les deux compléments, le bien recherché et le cadre de paix, dans un français naturel.
- source_word: σκεπασθῆναι
  choice: nous protège
  rationale: Le verbe signifie littéralement être couverts ou abrités; « protège » exprime clairement ici la fonction de la main divine.
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  choice: ton bras élevé
  rationale: Maintient la métaphore corporelle et la notion de hauteur ou d’exaltation de ὑψηλῷ, sans la confondre avec la puissance déjà exprimée par κραταιᾷ.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: de tout péché
  rationale: Traduction directe de ἁμαρτία dans son sens moral et religieux ordinaire.
theological_decisions:
- issue: Valeur de ἁμαρτία
  choice: péché
  alternative: faute
  rationale: « Péché » conserve la portée religieuse du terme grec dans cette prière, tandis que « faute » pourrait l’atténuer.
- issue: Imagerie anthropomorphique de la main et du bras divins
  choice: conserver « main » et « bras »
  alternative: paraphraser par « puissance »
  rationale: Le texte associe délibérément protection et délivrance à deux images corporelles distinctes; les paraphraser effacerait son langage biblique.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase de prière et son parallélisme sont conservés, avec des subordonnées coordonnées pour assurer la fluidité.
