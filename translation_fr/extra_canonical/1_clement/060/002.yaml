id: 1CLEM.60.2
reference: 1 Clement 60:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
translation:
  language: fr
  text: Ne tiens compte d’aucun péché de tes serviteurs et de tes servantes, mais purifie-nous par la purification de ta vérité. Dirige nos pas, afin que nous marchions dans la sainteté du cœur et que nous fassions ce qui est bon et agréable devant toi et devant nos dirigeants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: Ne tiens compte d’aucun péché
  rationale: Dans cette prière marquée par l’usage biblique, μὴ avec πᾶσαν a le sens de « ne… aucun », plutôt que « ne… pas chaque », qui laisserait entendre que certains péchés devraient être comptés.
- source_word: δούλων σου καὶ παιδισκῶν
  choice: de tes serviteurs et de tes servantes
  rationale: Rend les deux groupes de genre explicitement désignés tout en conservant un registre liturgique naturel en français; « esclaves » serait possible lexicalement, mais plus étroit et moins adapté ici.
- source_word: καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας
  choice: purifie-nous par la purification de ta vérité
  rationale: Conserve délibérément la répétition étymologique καθάρισον/καθαρισμόν et l’ambiguïté du génitif « de ta vérité ».
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  choice: Dirige nos pas
  rationale: Expression française naturelle qui reproduit l’image biblique de pas orientés sur le bon chemin.
- source_word: ἐν ὁσιότητι καρδίας
  choice: dans la sainteté du cœur
  rationale: ὁσιότης évoque une sainteté ou piété conforme à Dieu; « sainteté » garde ici la dignité et la portée religieuse de l’expression.
- source_word: τῶν ἀρχόντων ἡμῶν
  choice: nos dirigeants
  rationale: Terme moderne et suffisamment large pour les autorités gouvernantes, sans préciser indûment leur fonction.
theological_decisions:
- issue: Portée de la négation dans μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  choice: « Ne tiens compte d’aucun péché »
  alternative: « Ne tiens pas compte de tout péché » / « Ne compte pas chaque péché »
  rationale: L’idiome négatif d’allure sémitique porte sur la totalité distributive et formule une demande de pardon complète; la traduction littérale française créerait une ambiguïté trompeuse.
- issue: Rapport entre purification et vérité
  choice: Maintien de « la purification de ta vérité »
  alternative: « purifie-nous par ta vérité »
  rationale: La formulation retenue préserve la répétition insistante et ne tranche pas si la vérité est la source, le moyen ou la qualité de la purification.
translation_notes:
  register: Prière en français moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. La répétition « purifie… purification » est conservée malgré sa légère étrangeté afin de refléter l’insistance du grec.
