id: 1CLEM.54.3
reference: 1 Clement 54:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
translation:
  language: fr
  text: Celui qui aura fait cela s’acquerra une grande renommée dans le Messie, et tout lieu l’accueillera. Car la terre appartient au Seigneur, avec tout ce qu’elle contient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: Celui qui aura fait
  rationale: Le participe aoriste substantivé désigne la personne qui accomplit l’acte; le futur antérieur français restitue naturellement l’antériorité de cet acte par rapport à περιποιήσεται.
- source_word: μέγα κλέος
  choice: une grande renommée
  rationale: κλέος évoque la renommée ou la gloire acquise; «grande renommée» conserve cette nuance plus précisément que le simple «honneur».
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Rend littéralement la relation exprimée par ἐν tout en suivant la désignation messianique de Χριστός.
- source_word: πᾶς τόπος δέξεται αὐτόν
  choice: tout lieu l’accueillera
  rationale: Traduction proche de la formulation grecque, dont la personnification des lieux demeure intelligible en français.
- source_word: ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς
  choice: la terre … avec tout ce qu’elle contient
  rationale: Le sens idiomatique de πλήρωμα est ici l’ensemble de ce qui remplit la terre; cette tournure est naturelle et claire en français.
theological_decisions:
- issue: Sens de ἐν Χριστῷ
  choice: dans le Messie
  alternative: parmi les croyants au Messie / auprès du Messie
  rationale: Le grec permet diverses nuances relationnelles, mais «dans le Messie» préserve l’expression paulinienne et son amplitude théologique sans l’expliciter abusivement.
- issue: Rapport de la citation au Seigneur
  choice: la terre appartient au Seigneur
  alternative: la terre est au Seigneur
  rationale: Le génitif possessif τοῦ κυρίου est exprimé dans un français courant sans préciser davantage si «Seigneur» renvoie ici directement à Dieu ou reçoit une portée christologique dans le contexte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec, notamment avec «tout lieu l’accueillera», tandis que la clausule psalmique est rendue idiomatiquement pour éviter l’obscur «sa plénitude».
