source:
  edition: Funk 1901 (normalized OCR)
  text: εἰπάτω· Εἰ δι’ ἐμὲ στάσις καὶ ἔρις καὶ σχίσματα, ἐκχωρῶ, ἄπειμι, οὗ ἐὰν βούλησθε, καὶ ποιῶ τὰ προστασσόμενα ὑπὸ τοῦ πλήθους· μόνον τὸ ποίμνιον τοῦ Χριστοῦ εἰρηνευέτω μετὰ τῶν καθεσταμένων πρεσβυτέρων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
translation:
  language: fr
  text: 'Qu’il dise : « Si je suis la cause de dissensions, de querelles et de divisions, je me retire ; je m’en vais où vous voudrez et je ferai ce que la communauté ordonnera. Que du moins le troupeau du Messie vive en paix avec les anciens établis[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les anciens qui ont été désignés ».
    reason: Le participe καθεσταμένων peut souligner soit le fait d’avoir été établis, soit celui d’avoir été désignés.
lexical_decisions:
- source_word: στάσις
  choice: dissensions
  rationale: Le terme désigne ici un conflit interne ou une agitation partisane ; « dissensions » convient au contexte communautaire sans suraccentuer l’idée de révolte politique.
- source_word: ἔρις
  choice: querelles
  rationale: Ce choix rend le conflit et la rivalité exprimés par le grec tout en restant naturel en français moderne.
- source_word: σχίσματα
  choice: divisions
  rationale: « Divisions » conserve l’idée de déchirures au sein de la communauté sans imposer un sens institutionnel plus tardif.
- source_word: ἐκχωρῶ, ἄπειμι
  choice: je me retire ; je m’en vais
  rationale: Les deux verbes grecs sont maintenus afin de préserver leur insistance successive.
- source_word: τοῦ πλήθους
  choice: la communauté
  rationale: Dans ce contexte ecclésial, πλήθος désigne l’ensemble du corps communautaire plutôt qu’une foule fortuite ; « communauté » est clair et naturel.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: « Messie » rend le titre Χριστός conformément à son sens de « consacré par onction », sans le traiter comme un simple nom propre.
- source_word: τῶν καθεσταμένων πρεσβυτέρων
  choice: les anciens établis dans leur charge
  rationale: Cette formulation rend le participe de καθίστημι, qui indique que ces anciens ont été placés ou institués dans leur fonction.
theological_decisions:
- issue: Portée de πλήθος dans la prise de décision
  choice: la communauté
  alternative: la multitude
  rationale: Le contexte indique le corps collectif de l’assemblée. La traduction n’ajoute toutefois aucune précision sur la forme d’autorité ou le mode de décision.
- issue: Statut des πρεσβύτεροι
  choice: anciens établis dans leur charge
  alternative: anciens qui ont été désignés
  rationale: Le grec affirme qu’ils ont été établis sans préciser ici par qui ni selon quelle procédure ; la traduction conserve cette réserve.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence exhortative est conservée, ainsi que l’accumulation des trois termes de conflit et le redoublement « je me retire ; je m’en vais ».
