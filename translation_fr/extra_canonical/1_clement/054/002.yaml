review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : la triple évocation du conflit, le double mouvement « je me retire ; je m’en vais », l’autorité du πλήθος et la paix du troupeau avec les anciens sont préservés. La reformulation proposée garde également le présent volontaire ποιῶ (« je ferai » est admissible en contexte) et ne précise pas indûment la procédure d’établissement des anciens.'
  naturalness: « Que seulement le troupeau... » est peu naturel en français moderne. « Que du moins le troupeau... » rend avec fluidité la restriction μόνον dans cette exhortation. « Là où vous voudrez » peut être simplifié en « où vous voudrez » sans perte de sens.
  terminology: « Messie » rend correctement Χριστοῦ comme titre. « Anciens établis » exprime καθεσταμένων sans ajouter « dans leur charge », précision plausible mais non explicitement formulée par le grec. La note maintient l’alternative « désignés » et son ancrage est correctement placé.
