  text: Τίς οὖν ἐν ὑμῖν γενναῖος, τίς εὔσπλαγχνος, τίς πεπληροφορημένος ἀγάπης;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/001.yaml
  text: Who then among you is noble? Who is compassionate? Who is filled with love?
translation:
  language: fr
  text: Qui donc parmi vous a le cœur noble ? Qui est compatissant ? Qui est rempli d’amour ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  choice: a le cœur noble
  rationale: Le terme désigne ici une noblesse de caractère, vaillante et généreuse, plutôt qu’un statut social. Cette tournure naturelle en français rend explicite la qualité morale.
- source_word: εὔσπλαγχνος
  choice: compatissant
  rationale: Le mot exprime une compassion profonde et bienveillante ; « compatissant » est actuel, clair et digne.
- source_word: πεπληροφορημένος ἀγάπης
  choice: rempli d’amour
  rationale: Avec le génitif de contenu ἀγάπης, le participe passif de πληροφορέω signifie être pleinement rempli de quelque chose. « Rempli d’amour » préserve ce sens sans introduire l’idée distincte d’assurance.
theological_decisions:
- issue: Sens de πεπληροφορημένος ἀγάπης
  choice: rempli d’amour
  alternative: pleinement assuré dans l’amour
  rationale: La construction grecque avec le génitif ἀγάπης indique ici le contenu dont la personne est remplie. La traduction ne transforme donc pas cette plénitude d’amour en certitude subjective.
translation_notes:
  register: Français international moderne, naturel et digne. Les trois questions parallèles du grec sont conservées, avec une formulation qui distingue clairement noblesse morale, compassion et plénitude d’amour.
