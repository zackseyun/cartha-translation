  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
translation:
  language: fr
  text: Voilà ce qu’ont fait et feront ceux qui mènent, en citoyens de Dieu, une conduite sans regret.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ceux qui vivent en citoyens la conduite sans regret de Dieu ». La construction apparentée πολιτευόμενοι… πολιτείαν évoque à la fois la manière de vivre et la condition ou conduite de citoyens. Le génitif « de Dieu » peut désigner la citoyenneté ou communauté qui lui appartient; sa relation exacte avec « conduite » demeure discutée. « Sans regret » traduit ἀμεταμέλητον, c’est-à-dire « qui ne donne pas lieu au regret », et non « non repentie ».
    reason: Préserve la coloration civique de la construction grecque, rend directement ἀμεταμέλητον et explicite, sans la trancher dans le texte principal, l’ambiguïté du génitif τοῦ θεοῦ.
lexical_decisions:
- source_word: πολιτευόμενοι ... πολιτείαν
  choice: ceux qui adoptent la conduite
  rationale: La construction à l’accusatif apparenté exprime ici la manière de se conduire ou de vivre, plutôt qu’une citoyenneté au sens politique. « Adoptent la conduite » rend l’exercice concret et continu de cette manière de vivre sans lourde répétition.
- source_word: ἀμεταμέλητον
  choice: irréprochable
  rationale: L’adjectif signifie littéralement « qui ne donne pas lieu au regret ». Dans ce contexte moral, « irréprochable » exprime naturellement une conduite que l’on n’a pas à regretter, sans suggérer à tort une faute dont on ne se repent pas.
- source_word: τοῦ θεοῦ
  choice: voulue par Dieu
  rationale: Le génitif rattache cette conduite à Dieu, mais sa nuance précise demeure ouverte. Le corps du texte retient une relation normative naturelle en français, tandis que la note conserve une traduction plus formelle.
- source_word: ἐποίησαν καὶ ποιήσουσιν
  choice: ont fait et ... feront
  rationale: Conserve directement le contraste temporel entre l’aoriste et le futur.
theological_decisions:
- issue: Rapport entre Dieu et la πολιτεία
  choice: la conduite ... voulue par Dieu
  alternative: la conduite de Dieu
  rationale: « De Dieu » pourrait être compris comme désignant la propre conduite divine. « Voulue par Dieu » indique que cette manière de vivre a Dieu pour norme ou origine, tout en signalant en note la formulation littérale.
- issue: Sens de ἀμεταμέλητος
  choice: irréprochable
  alternative: que l’on ne regrette pas
  rationale: Le choix évite « sans repentance » ou « non repentie », qui inverserait le sens en évoquant un péché dont on refuse de se repentir. La note préserve la valeur littérale liée au regret.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure évite le calque maladroit « vivre une conduite » et l’expression trompeuse « non repentie ». Le démonstratif neutre pluriel ταῦτα est rendu idiomatiquement par « Voilà ce que ».
