id: 1CLEM.48.4
reference: 1 Clement 48:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: πολλῶν οὖν πυλῶν ἀνεῳγυιῶν ἡ ἐν δικαιοσύνῃ αὕτη ἡ ἐστὶν ἡ ἐν Χριστῷ, ἐν ᾗ μακάριοι πάντες οἱ εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν ἐν ὁσιότητι καὶ δικαιοσύνῃ, ἀταράχως πάντα ἐπιτελοῦντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
translation:
  language: fr
  text: Ainsi donc, alors que de nombreuses portes sont ouvertes, cette porte qui est dans la justice est celle qui est en Christ[a]. En elle, tous ceux qui sont entrés[b] et qui dirigent leur marche dans la sainteté et la justice, accomplissant tout sans trouble, sont heureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «cette [porte] dans la justice est celle qui est en Christ».'
    reason: Le grec répète des articles féminins avec le nom «porte» sous-entendu et emploie deux fois la préposition «dans/en»; la formulation littérale est plus raide en français.
  - marker: b
    text: 'Ou : «tous ceux qui sont entrés par elle et qui dirigent leur marche».'
    reason: Le complément «par elle» n’est pas exprimé après «sont entrés» dans le grec, mais il peut être naturellement compris d’après la porte mentionnée juste avant.
lexical_decisions:
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: Le terme désigne ici la justice ou la droiture; «justice» conserve sa portée morale et théologique sans la réduire à la seule conduite droite.
- source_word: Χριστῷ
  choice: Christ
  rationale: Dans la formule établie ἐν Χριστῷ, «en Christ» rend l’usage titulaire devenu quasi nominal sans surtraduire par «Messie».
- source_word: κατευθύνοντες τὴν πορείαν
  choice: dirigent leurs pas
  rationale: Cette formulation française actuelle rend l’idée de donner une juste direction à son parcours, tout en conservant l’image de la marche.
- source_word: ὁσιότητι
  choice: sainteté
  rationale: «Sainteté» rend la consécration et la conduite pieuse exprimées par ὁσιότης, en la distinguant de δικαιοσύνη, «justice».
- source_word: ἀταράχως
  choice: sans trouble
  rationale: Cette expression préserve la possible nuance d’une action accomplie sans agitation personnelle comme sans désordre causé dans la communauté.
theological_decisions:
- issue: Relation entre la porte, la justice et le Christ
  choice: «cette porte de la justice est celle qui est en Christ»
  alternative: «cette porte dans la justice est celle qui est en Christ»
  rationale: Le grec identifie la porte qualifiée par ἐν δικαιοσύνῃ à celle qui est ἐν Χριστῷ. La formulation retenue demeure naturelle en français tout en conservant cette identification, sans préciser davantage le type exact de relation avec la justice.
- issue: Valeur de la béatitude
  choice: «sont heureux»
  alternative: «sont bénis»
  rationale: μακάριοι exprime ici l’état enviable et favorable de ceux qui entrent et marchent ainsi; «heureux» est le rendu biblique français le plus direct et n’ajoute pas explicitement un agent bénissant.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase ample de l’original est conservée, avec une ponctuation qui clarifie le rapport entre la porte, l’entrée et la marche. Les termes «justice», «sainteté» et «en Christ» maintiennent le registre théologique du texte sans ajout confessionnel.
