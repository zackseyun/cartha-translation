revisions:
- from: Ainsi, bien que de nombreuses portes soient ouvertes, cette porte de la justice est celle qui est en Christ[a]. En elle, tous ceux qui sont entrés[b] et dirigent leurs pas dans la sainteté et la justice, accomplissant tout sans trouble, sont heureux.
  to: Ainsi donc, alors que de nombreuses portes sont ouvertes, cette porte qui est dans la justice est celle qui est en Christ[a]. En elle, tous ceux qui sont entrés[b] et qui dirigent leur marche dans la sainteté et la justice, accomplissant tout sans trouble, sont heureux.
  rationale: La révision corrige l’ajout concessif et, surtout, restitue la double construction prépositionnelle qui identifie la porte «dans la justice» à la porte «en Christ». Elle conserve la phrase unique, le rapport de l’entrée accomplie à la conduite en cours, et les notes qui signalent les ellipses pertinentes sans imposer une interprétation doctrinale.
