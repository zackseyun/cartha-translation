    rationale: Dans le texte fourni, αὐτή est au nominatif féminin (et non à l’accusatif αὐτήν) ; il s’accorde donc avec πύλη (« porte »). « La vie même » ne correspond pas à cette forme.
  - severity: medium
    issue: La traduction principale combine la lecture transmise αὐτή et la variante/émendation αὕτη.
    rationale: « C’est là » suppose une identification par « celle-ci », alors que « elle-même » relève de αὐτή. Il faut choisir la lecture du texte de base dans le corps et présenter l’autre lecture en note.
