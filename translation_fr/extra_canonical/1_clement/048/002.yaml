  to: 'Car la porte de la justice elle-même[a] a été ouverte sur la vie, comme il est écrit : « Ouvrez-moi les portes de la justice ; j’entrerai par elles et je rendrai grâce au Seigneur. »'
  rationale: La révision corrige l’accord du pronom et sépare clairement la lecture du texte grec fourni de l’alternative retenue dans une partie de la piste d’audit anglaise. Elle conserve le parfait passif (« a été ouverte »), la direction vers la vie (« sur la vie ») et la formulation psalmique de la citation.
