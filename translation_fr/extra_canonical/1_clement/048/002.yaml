source:
  edition: Funk 1901 (normalized OCR)
  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
translation:
  language: fr
  text: 'Car la porte de la justice elle-même[a] a été ouverte sur la vie, comme il est écrit : « Ouvrez-moi les portes de la justice ; j’entrerai par elles et je rendrai grâce au Seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis porte αὐτή, « elle-même », se rapportant à « porte ». Certaines éditions ou analyses lisent αὕτη, « celle-ci » : « Car c’est la porte de la justice qui a été ouverte sur la vie. »'
    reason: La forme transmise et la lecture alternative ne produisent pas la même construction ; la note préserve cette ambiguïté textuelle sans mêler les deux dans la traduction principale.
lexical_decisions:
- source_word: πύλη δικαιοσύνης
  choice: la porte de la justice
  rationale: Reprend directement l’expression grecque et conserve le lien lexical avec la citation des « portes de la justice ».
- source_word: ἀνεῳγυῖα εἰς ζωήν
  choice: ouverte sur la vie
  rationale: « Sur » exprime naturellement en français l’ouverture donnant accès à la vie, sans réduire εἰς à une simple localisation.
- source_word: ἐξομολογήσομαι
  choice: je rendrai grâce
  rationale: Dans ce contexte psalmique, le verbe désigne une proclamation reconnaissante adressée au Seigneur ; « rendre grâce » est naturel et garde cette valeur cultuelle.
theological_decisions:
- issue: Identification de la porte et valeur de αὐτή/αὕτη
  choice: « c’est là la porte… ouverte sur la vie même »
  alternative: '« une porte de la justice a été ouverte : cette porte même qui mène à la vie »'
  rationale: La lecture contextuellement probable αὕτη produit une proposition d’identification (« c’est là… »), tandis que la forme transmise αὐτή peut renforcer « la vie même ». La traduction principale suit l’identification retenue par l’examen du grec tout en signalant l’autre construction possible.
translation_notes:
  register: Français moderne, digne et accessible. La citation conserve le parallélisme et le pluriel du grec, avec une syntaxe française fluide.
