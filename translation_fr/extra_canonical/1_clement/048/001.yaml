id: 1CLEM.48.1
reference: 1 Clement 48:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
translation:
  language: fr
  text: Rejetons donc cela sans tarder, prosternons-nous devant le Maître et pleurons en le suppliant afin que, devenu favorable, il se réconcilie avec nous et nous rétablisse dans la conduite digne et pure de notre amour fraternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρωμεν
  choice: Rejetons
  rationale: Le verbe signifie ici enlever ou écarter; «rejeter» exprime naturellement l’abandon immédiat de la conduite évoquée.
- source_word: ἐν τάχει
  choice: sans tarder
  rationale: Expression française courante qui conserve l’idée d’empressement.
- source_word: τῷ δεσπότῃ
  choice: devant le Maître
  rationale: «Maître» rend δεσπότης avec dignité et sans la connotation sociale dominante de «propriétaire».
- source_word: ἵλεως γενόμενος
  choice: de nous accorder sa faveur
  rationale: Rend la disposition favorable ou miséricordieuse demandée, sans imposer ici le vocabulaire plus technique de l’expiation.
- source_word: ἐπικαταλλαγῇ ἡμῖν
  choice: de se réconcilier avec nous
  rationale: Conserve la valeur relationnelle forte du verbe composé.
- source_word: ἀγωγὴν
  choice: conduite
  rationale: Désigne la manière de vivre ou de se comporter.
- source_word: φιλαδελφίας
  choice: amour fraternel
  rationale: Équivalent naturel du grec pour l’affection et la solidarité entre frères et sœurs de la communauté.
theological_decisions:
- issue: Sujet divin de ἵλεως γενόμενος et ἐπικαταλλαγῇ
  choice: 'Formuler la demande comme adressée au Maître: «nous accorder sa faveur, se réconcilier avec nous»'
  alternative: «devenu favorable, qu’il soit réconcilié avec nous»
  rationale: La formulation française explicite seulement les rapports syntaxiques du grec, tout en préservant la tension d’une réconciliation demandée à Dieu.
- issue: Rapport des adjectifs σεμνὴν et ἁγνὴν
  choice: 'Les rattacher tous deux à «conduite»: «la conduite digne et pure»'
  alternative: Rattacher «digne/solennel» à «amour fraternel»
  rationale: Les deux adjectifs sont à l’accusatif féminin singulier et modifient grammaticalement ἀγωγήν, tandis que φιλαδελφίας est au génitif.
translation_notes:
  register: 'Français international moderne, exhortatif et digne. La coordination grecque est légèrement resserrée pour éviter une phrase pesante, tout en conservant les trois mouvements: abandon immédiat, supplication devant le Maître, restauration de la conduite fraternelle.'
