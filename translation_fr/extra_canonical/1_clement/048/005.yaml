revisions:
- from: Que l’un soit fidèle, qu’un autre soit capable d’exposer la connaissance, qu’un autre soit sage dans le discernement des paroles, qu’un autre soit pur dans ses œuvres.
  to: Que quelqu’un soit fidèle ; qu’il soit capable d’exposer sa connaissance ; qu’il soit sage dans le discernement des paroles ; qu’il soit pur dans ses œuvres.
  rationale: La révision corrige la division injustifiée des quatre qualités entre « l’un » et « un autre ». Elle rend l’unique τις par « quelqu’un », puis conserve ce référent par « il » dans les trois membres suivants, tout en préservant la répétition exhortative du grec.
