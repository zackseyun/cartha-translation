id: 1CLEM.48.5
reference: 1 Clement 48:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἤτω τις πιστός, ἤτω δυνατὸς γνῶσιν ἐξεπεῖν, ἤτω σοφὸς ἐν διακρίσει λόγων, ἤτω ἁγνὸς ἐν ἔργοις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/005.yaml
  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: fr
  text: Que quelqu’un soit fidèle ; qu’il soit capable d’exposer sa connaissance ; qu’il soit sage dans le discernement des paroles ; qu’il soit pur dans ses œuvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤτω τις
  choice: Que l’un soit
  rationale: Le tour exhortatif avec l’indéfini τις est rendu naturellement; dans l’énumération, « l’un… un autre » exprime la distribution possible des qualités sans limiter le propos aux hommes.
- source_word: δυνατὸς γνῶσιν ἐξεπεῖν
  choice: capable d’exposer la connaissance
  rationale: « Exposer » restitue ἐξεπεῖν, qui évoque l’expression ou l’explication développée, tandis que « la connaissance » conserve le substantif γνῶσιν.
- source_word: σοφὸς ἐν διακρίσει λόγων
  choice: sage dans le discernement des paroles
  rationale: Traduction formellement proche qui préserve la portée ouverte de λόγων (« paroles », « propos », éventuellement « discours ») et de διάκρισις.
- source_word: ἁγνὸς ἐν ἔργοις
  choice: pur dans ses œuvres
  rationale: « Pur » correspond au sens moral de ἁγνός; « œuvres » conserve la formulation concrète et traditionnelle de ἔργοις.
theological_decisions:
- issue: Les qualités énumérées appartiennent-elles nécessairement à une seule personne?
  choice: Employer « l’un… un autre »
  alternative: Répéter « que quelqu’un soit » ou employer partout « qu’il soit »
  rationale: La répétition de ἤτω avec τις seulement dans le premier membre permet une lecture distributive, que le contexte immédiat de 1 Clément 48:5 favorise; cette formulation évite toutefois de transformer les qualités en fonctions ecclésiales distinctes.
translation_notes:
  register: Français moderne, digne et exhortatif. Le parallélisme grec est conservé par la répétition de « que… soit ». Aucun marqueur de note n’est nécessaire.
