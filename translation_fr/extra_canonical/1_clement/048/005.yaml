    rationale: '« Que l’un… qu’un autre… » transforme le τις initial et les reprises de ἤτω en une distribution entre individus différents. Le grec enchaîne au contraire les prédicats sous le même sujet indéfini : il s’agit d’une même personne hypothétique.'
