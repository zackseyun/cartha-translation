  source_fidelity: Le grec présente un seul sujet indéfini, τις (« quelqu’un »), auquel se rapportent les quatre qualités, avec répétition rhétorique de ἤτω (« qu’il soit »). La version proposée introduit à tort des sujets distincts par « l’un… un autre… un autre », ce qui altère cette unité.
  naturalness: La construction révisée conserve le parallélisme exhortatif tout en restant naturelle en français moderne. « Exposer sa connaissance » exprime plus idiomatiquement la capacité d’énoncer ou de développer une connaissance.
  terminology: « Fidèle », « sage », « discernement des paroles » et « pur dans ses œuvres » rendent sobrement les termes grecs sans spécialisation doctrinale. « Sa connaissance » explicite en français le lien naturellement implicite entre la personne et γνῶσις, sans modifier le sens.
