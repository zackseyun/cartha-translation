id: 1CLEM.48.6
reference: 1 Clement 48:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: . τοσούτῳ γὰρ μᾶλλον ταπεινοφρονεῖν ὀφείλει, ὅσῳ δοκεῖ μᾶλλον μείζων εἶναι, καὶ ζητεῖν τὸ κοινωφελὲς πᾶσιν, καὶ μὴ τὸ ἑαυτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
translation:
  language: fr
  text: Car il doit être d’autant plus humble qu’il paraît plus grand, et rechercher l’intérêt de tous, et non le sien propre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  choice: être humble
  rationale: Rend directement l’attitude d’humilité demandée, dans un français naturel et digne.
- source_word: δοκεῖ ... μείζων εἶναι
  choice: il paraît plus grand
  rationale: Préserve la nuance de δοκεῖ (« paraît », « semble ») sans affirmer comme un fait la supériorité de la personne.
- source_word: τὸ κοινωφελὲς πᾶσιν
  choice: l’intérêt de tous
  rationale: Expression française idiomatique pour ce qui est utile ou avantageux à la communauté entière.
- source_word: μὴ τὸ ἑαυτοῦ
  choice: plutôt que le sien propre
  rationale: Dans cette coordination, μή oppose l’intérêt personnel à l’intérêt commun; « le sien propre » conserve la substantivation elliptique du grec.
theological_decisions:
- issue: Lien entre grandeur apparente et humilité
  choice: d’autant plus humble qu’il paraît plus grand
  alternative: d’autant plus humble qu’il est tenu pour plus grand
  rationale: Cette formulation conserve à la fois la corrélation proportionnelle τοσούτῳ… ὅσῳ et l’incertitude portée par δοκεῖ, sans valider une hiérarchie réelle.
- issue: Rapport entre intérêt commun et intérêt personnel
  choice: rechercher l’intérêt de tous plutôt que le sien propre
  alternative: rechercher ce qui est utile à tous, et non ce qui lui est propre
  rationale: Le français naturel emploie ici « plutôt que » pour exprimer l’opposition, sans introduire de doctrine particulière sur la renonciation à soi.
translation_notes:
  register: Français moderne international, sobre et digne. La structure comparative du grec est conservée sous une forme idiomatique; γάρ est rendu par « Car » afin de maintenir le lien explicatif avec le contexte précédent.
