  text: '« Un sacrifice de louange me glorifiera, et là est le chemin que je lui montrerai : le salut de Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία αἰνέσεως
  choice: un sacrifice de louange
  rationale: Rend directement l’expression grecque et conserve son image cultuelle.
- source_word: δοξάσει με
  choice: me glorifiera
  rationale: Reproduit le futur actif et le sens usuel de δοξάζω.
- source_word: ἐκεῖ ὁδός
  choice: là se trouve le chemin
  rationale: La tournure grecque est elliptique; l’ajout idiomatique de « se trouve » rend la phrase naturelle sans déterminer davantage la relation syntaxique.
- source_word: ἣν δείξω αὐτῷ
  choice: par lequel je lui montrerai
  rationale: Le relatif féminin renvoie à ὁδός; « par lequel » exprime naturellement en français la voie associée à la manifestation du salut.
- source_word: τὸ σωτήριον τοῦ θεοῦ
  choice: le salut de Dieu
  rationale: Formulation française naturelle qui maintient le génitif grec et son éventuelle portée subjective ou possessive.
theological_decisions:
- issue: Rapport entre le chemin et la manifestation du salut
  choice: « le chemin par lequel je lui montrerai »
  alternative: '« le chemin que je lui montrerai : le salut de Dieu »'
  rationale: Le texte grec permet une certaine tension syntaxique; la formulation retenue suit la compréhension instrumentale reflétée par la consultation anglaise sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible; l’image sacrificielle et l’énoncé à la première personne sont conservés.
