source:
  edition: Funk 1901 (normalized OCR)
  text: ζωὴ ἐν ἀθανασίᾳ, λαμπρότης ἐν δικαιοσύνῃ, ἀλήθεια ἐν παρρησίᾳ, πίστις ἐν πεποιθήσει, ἐγκράτεια ἐν ἁγιασμῷ· καὶ ταῦτα ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: fr
  text: La vie dans l’immortalité, la splendeur dans la justice, la vérité dans la franchise, la foi dans l’assurance, la maîtrise de soi dans la sainteté ; et tout cela était à la portée de notre intelligence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρρησίᾳ
  choice: franchise
  rationale: Le terme désigne ici une parole libre, ouverte et assurée. « Franchise » conserve cette idée dans un français naturel sans réduire le sens au seul courage.
- source_word: πεποιθήσει
  choice: assurance
  rationale: Le mot exprime une confiance ferme. « Assurance » évite la répétition avec « foi » tout en préservant la nuance de conviction confiante.
- source_word: ἐγκράτεια
  choice: maîtrise de soi
  rationale: Cette expression actuelle rend clairement l’idée de contrôle de soi ou de retenue portée par le grec.
- source_word: ἁγιασμῷ
  choice: sainteté
  rationale: Dans cette série de qualités, « sainteté » rend naturellement l’état ou la qualité exprimée par le nom grec.
- source_word: ὑπέπεπτεν
  choice: était à la portée de
  rationale: L’imparfait grec indique que toutes ces réalités relevaient du champ de perception ou de compréhension des destinataires. Cette formulation française transmet le sens sans le calque peu naturel « tombait sous ».
- source_word: διανοίᾳ
  choice: intelligence
  rationale: Le terme renvoie ici à la faculté mentale de saisir ou de comprendre ; « intelligence » convient au registre soutenu et reste accessible.
theological_decisions:
- issue: Rapport exprimé par ἐν dans les cinq couples nominaux
  choice: Conserver uniformément « dans »
  alternative: Employer selon les cas « accompagnée de », « fondée sur » ou une autre relation explicitée
  rationale: Le grec laisse ouverte la nature précise du rapport entre chaque qualité et son complément. La traduction conserve cette tension au lieu de l’interpréter différemment dans chaque couple.
- issue: Valeur temporelle de ὑπέπεπτεν
  choice: 'Traduire à l’imparfait : « était »'
  alternative: 'Présent : « est » ou « tombe »'
  rationale: L’imparfait du texte source doit être conservé, même si la consultation anglaise emploie le présent.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle du grec est conservée, avec répétition de « dans ». Le point-virgule rattache la proposition finale à l’énumération.
