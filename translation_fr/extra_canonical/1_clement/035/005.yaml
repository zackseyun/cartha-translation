source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
translation:
  language: fr
  text: Mais comment cela se réalisera-t-il, bien-aimés ? Si notre pensée demeure fermement et fidèlement attachée à Dieu, si nous recherchons ce qui lui plaît et ce qu’il accueille favorablement, si nous accomplissons ce qui convient à sa volonté irréprochable et suivons le chemin de la vérité, après avoir rejeté loin de nous toute injustice et toute méchanceté, la cupidité, les querelles, la malveillance et les tromperies, les chuchotements et les calomnies, la haine de Dieu, l’orgueil et l’arrogance, la vaine gloire et le refus de l’hospitalité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστηργιμένῃ
  choice: demeure fermement attachée
  rationale: Le parfait passif exprime un état établi et durable; « attachée » conserve l’idée d’une orientation affective et fidèle envers Dieu.
- source_word: διάνοια
  choice: pensée
  rationale: Désigne ici la faculté intérieure de penser et de vouloir; « pensée » est naturel en français sans réduire le terme au seul intellect.
- source_word: πιστῶς
  choice: dans la foi
  rationale: Rend l’adverbe sans l’assimiler simplement à la fermeté déjà exprimée par le participe; la formule laisse ouvertes les nuances de foi et de fidélité.
- source_word: τὰ ἀνήκοντα
  choice: ce qui convient
  rationale: ἀνήκω désigne ce qui est approprié ou conforme, et non simplement ce qui appartient à quelque chose.
- source_word: βουλήσει
  choice: volonté
  rationale: Dans ce contexte d’obéissance morale, « volonté » rend naturellement l’intention divine, tout en conservant l’idée de dessein délibéré.
- source_word: κακοηθείας
  choice: malveillance
  rationale: Le terme désigne un mauvais caractère ou une disposition maligne; « malveillance » reste concise et moins interprétative que « mauvaises habitudes ».
- source_word: ψιθυρισμούς
  choice: murmures
  rationale: Il s’agit de paroles hostiles ou médisantes dites à voix basse; « murmures » maintient cette image.
- source_word: θεοστυγίαν
  choice: haine de Dieu
  rationale: Le composé peut désigner la haine dirigée contre Dieu; cette lecture s’accorde à la liste de vices humains, bien que la forme puisse être comprise autrement.
- source_word: κενοδοξίαν
  choice: vaine gloire
  rationale: Calque français établi et intelligible exprimant la recherche d’une gloire vide.
- source_word: ἀφιλοξενίαν
  choice: refus de l’hospitalité
  rationale: Formulation naturelle qui exprime positivement le vice opposé à l’accueil de l’étranger, plutôt que le rare « inhospitalité ».
theological_decisions:
- issue: Sens de θεοστυγίαν
  choice: haine de Dieu
  alternative: fait d’être haï de Dieu
  rationale: Dans une série d’attitudes et de conduites à rejeter, le sens actif « haine de Dieu » est contextuellement préférable; l’ambivalence possible du composé grec n’est toutefois pas décisive sur le plan grammatical.
- issue: Nuance de πιστῶς
  choice: dans la foi
  alternative: fidèlement
  rationale: « Dans la foi » préserve la possible référence à la confiance croyante, tandis que « fidèlement » mettrait davantage l’accent sur la loyauté éthique.
translation_notes:
  register: Français moderne, international et digne. La longue série rhétorique du grec est conservée, avec une ponctuation lisible. Les abstractions morales restent directes et non confessionnelles; aucune note n’est nécessaire pour une variante textuelle ou une ambiguïté indispensable à la lecture.
