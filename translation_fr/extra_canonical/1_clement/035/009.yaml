  text: ταῦτα ἐποίήσας, καὶ ἐσίγησα· ὑπέλαβες, ἄνομε, ὅτι ἔσομαι ὅμοιος σοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/009.yaml
  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: fr
  text: Tu as fait tout cela, et je me suis tu. Tu as pensé, toi qui es sans loi, que je serais comme toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: tout cela
  rationale: Rend naturellement le pluriel démonstratif neutre en renvoyant à l’ensemble des actes évoqués.
- source_word: ἐσίγησα
  choice: je me suis tu
  rationale: Exprime directement le silence gardé par le locuteur, avec un registre courant et digne.
- source_word: ὑπέλαβες
  choice: tu t’es imaginé
  rationale: Rend ici l’idée d’une supposition intérieure erronée sans alourdir la phrase.
- source_word: ἄνομε
  choice: toi qui méprises la loi
  rationale: L’apostrophe ἄνομε désigne une personne sans loi ou qui la transgresse. Cette formulation française conserve la force morale du terme sans employer l’ambigu moderne « hors-la-loi ».
- source_word: ὅτι ἔσομαι ὅμοιος σοι
  choice: que je serais comme toi
  rationale: Conserve la comparaison directe et rend naturellement en français le futur grec dans une proposition dépendant d’un verbe au passé.
theological_decisions:
- issue: Portée de ἄνομε
  choice: toi qui méprises la loi
  alternative: homme sans loi / transgresseur
  rationale: Le grec permet une caractérisation morale forte. La traduction choisie ne précise pas de quelle loi il s’agit et évite ainsi d’importer une lecture confessionnelle particulière.
translation_notes:
  register: Français moderne, direct et solennel. Le tutoiement conserve l’adresse singulière du grec et l’apostrophe accusatrice.
