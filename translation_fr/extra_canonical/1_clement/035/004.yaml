source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
translation:
  language: fr
  text: Efforçons-nous donc d’être comptés parmi ceux qui l’attendent, afin d’avoir part aux dons promis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  choice: Efforçons-nous
  rationale: Le verbe exprime un effort résolu; cette tournure exhortative est naturelle et digne en français moderne.
- source_word: εὑρεθῆναι ἐν τῷ ἀριθμῷ
  choice: être comptés parmi
  rationale: Rend idiomatiquement l’idée d’être trouvé au nombre d’un groupe, sans lourdeur littérale.
- source_word: τῶν ὑπομενόντων αὐτόν
  choice: ceux qui l’attendent
  rationale: Avec un objet personnel désignant ici Dieu, ὑπομένω signifie attendre avec constance plutôt que subir ou supporter la personne.
- source_word: μεταλάβωμεν
  choice: avoir part
  rationale: Exprime clairement la participation aux dons annoncés.
- source_word: τῶν ἐπηγγελμένων δωρεῶν
  choice: aux dons promis
  rationale: Traduction concise et directe du participe parfait passif et du substantif.
theological_decisions:
- issue: Sens de ὑπομένω avec αὐτόν
  choice: ceux qui l’attendent
  alternative: ceux qui le supportent avec patience
  rationale: La lecture « attendre » convient à l’usage biblique lorsqu’une personne, notamment Dieu, est l’objet du verbe; l’alternative ferait maladroitement de Dieu une épreuve à endurer.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. L’exhortation collective et la finalité de la participation aux dons sont conservées.
