id: 1CLEM.35.3
reference: 1 Clement 35:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
translation:
  language: fr
  text: Quelles sont donc les choses préparées pour ceux qui persévèrent ? Le Créateur et Père des siècles, le Très-Saint lui-même, en connaît la mesure et la beauté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένουσιν
  choice: ceux qui persévèrent
  rationale: Le participe désigne ceux qui tiennent bon ou persévèrent; le français conserve cette idée sans ajouter de complément absent du grec.
- source_word: δημιουργὸς
  choice: Créateur
  rationale: Dans ce contexte théologique, le terme désigne celui qui a façonné ou créé toutes choses.
- source_word: τῶν αἰώνων
  choice: des siècles
  rationale: Rend formellement le pluriel αἰώνων tout en préservant son amplitude temporelle et la possible nuance cosmique.
- source_word: ποσότητα
  choice: grandeur
  rationale: Ici, le nom évoque l'étendue ou l'ampleur des biens préparés; «grandeur» est plus naturel que «quantité» en français et s'accorde avec «beauté».
- source_word: καλλονὴν
  choice: beauté
  rationale: Équivalent direct et naturel du terme grec désignant la beauté ou la splendeur.
theological_decisions:
- issue: Complément implicite de ὑπομένουσιν
  choice: Ne pas ajouter «pour lui»
  alternative: «ceux qui persévèrent pour lui»
  rationale: Le complément «pour lui» ne figure pas dans ce verset grec; l'ajouter résoudrait indûment l'emploi absolu du participe.
- issue: Sens de αἰώνων
  choice: «des siècles»
  alternative: «des âges» ou «de l'éternité»
  rationale: «Des siècles» conserve le pluriel et l'ambiguïté du grec sans réduire le terme à une seule interprétation temporelle.
translation_notes:
  register: Français moderne, digne et accessible. La question rhétorique demeure directe; «le Très-Saint lui-même» garde l'emphase de ὁ πανάγιος αὐτός.
