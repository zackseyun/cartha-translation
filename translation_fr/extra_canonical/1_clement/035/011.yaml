id: 1CLEM.35.11
reference: 1 Clement 35:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: σύνετε δὴ ταῦτα, οἱ ἐπιλανθανόμενοι τοῦ θεοῦ, μήποτε ἁρπάσῃ ὡς λέων, καὶ μὴ ᾖ ὁ ῥυόμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
translation:
  language: fr
  text: Comprenez donc cela, vous qui oubliez Dieu, de peur qu’il ne vous saisisse[a] comme un lion, sans que personne puisse vous délivrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il ne saisisse comme un lion »; en grec, le complément « vous » est sous-entendu.'
    reason: Le grec omet l’objet du verbe transitif, tandis que le français courant exige ici son explicitation.
lexical_decisions:
- source_word: σύνετε
  choice: Comprenez
  rationale: Impératif exprimant l’appel à prendre conscience et à discerner; « comprenez » reste direct et naturel.
- source_word: οἱ ἐπιλανθανόμενοι τοῦ θεοῦ
  choice: vous qui oubliez Dieu
  rationale: Rend directement l’adresse vocative et le participe présent substantivé.
- source_word: ἁρπάσῃ
  choice: ne vous saisisse
  rationale: Le verbe signifie saisir ou emporter avec force. Son complément est implicite en grec et se comprend naturellement comme désignant les personnes interpellées; le français demande ici de l’expliciter.
- source_word: ὁ ῥυόμενος
  choice: personne puisse vous délivrer
  rationale: Le participe substantivé désigne celui qui délivre ou arrache au danger. La tournure française exprime idiomatiquement l’absence de tout libérateur.
theological_decisions:
- issue: Sujet implicite de ἁρπάσῃ
  choice: « il », renvoyant à Dieu
  alternative: Laisser le sujet indéterminé
  rationale: Le verbe grec est à la troisième personne du singulier et le seul référent singulier explicite du contexte immédiat est Dieu. Le pronom français conserve cette référence sans ajouter de désignation.
- issue: Complément implicite de ἁρπάσῃ
  choice: Expliciter « vous » dans le texte et signaler l’ellipse grecque en note
  alternative: Traduire littéralement « qu’il ne saisisse comme un lion »
  rationale: L’objet est grammaticalement omis mais pragmatiquement fourni par les destinataires apostrophés. Son explicitation rend la phrase française naturelle tout en préservant l’information textuelle dans la note.
translation_notes:
  register: Français moderne, direct et solennel. « De peur que… ne » conserve la force d’avertissement de μήποτε; le « ne » est explétif. La fin est restructurée avec « sans que personne puisse » pour rendre naturellement καὶ μὴ ᾖ ὁ ῥυόμενος sans atténuer l’absence totale de secours.
