source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: fr
  text: En effet, ceux qui pratiquent de telles choses sont odieux à Dieu ; et non seulement ceux qui les pratiquent, mais aussi ceux qui les approuvent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράσσοντες
  choice: ceux qui pratiquent
  rationale: Rend l’idée d’une conduite effective ou habituelle, tout en conservant la répétition du grec.
- source_word: στυγητοὶ τῷ θεῷ
  choice: odieux à Dieu
  rationale: Reproduit directement la forte réprobation exprimée par l’adjectif grec et son complément au datif.
- source_word: συνευδοκοῦντες αὐτοῖς
  choice: ceux qui les approuvent
  rationale: Exprime l’assentiment donné à ces actes ou à ceux qui les commettent ; le pronom français reprend naturellement « de telles choses » dans le contexte.
theological_decisions:
- issue: Portée de l’approbation finale
  choice: ceux qui les approuvent
  alternative: ceux qui donnent leur approbation à ceux qui les pratiquent
  rationale: Le grec αὐτοῖς peut grammaticalement renvoyer aux personnes ou, selon la compréhension du contexte, à leurs actes. La formulation retenue suit l’enchaînement naturel avec « de telles choses » sans ajouter une précision absente du texte.
translation_notes:
  register: Français moderne, clair et digne. « En effet » marque la valeur explicative de γάρ ; le parallélisme et la force morale de la phrase grecque sont conservés.
