  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: fr
  text: 'Car l’Écriture dit : « Mais au méchant, Dieu dit : Pourquoi récites-tu mes prescriptions et as-tu mon alliance à la bouche ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεός
  choice: Dieu
  rationale: Conserve le sujet explicite de la proposition citée et l’ordre naturel du français.
- source_word: διηγεῖ
  choice: récites-tu
  rationale: Le verbe signifie ici exposer ou énumérer oralement; « réciter » convient au reproche adressé à celui qui prononce les prescriptions divines sans y conformer sa conduite.
- source_word: τὰ δικαιώματά μου
  choice: mes prescriptions
  rationale: Dans ce contexte scripturaire, δικαιώματα désigne les exigences ou ordonnances établies par Dieu; « prescriptions » reste clair et évite de réduire le terme à des jugements judiciaires.
- source_word: ἀναλαμβάνεις
  choice: as-tu
  rationale: L’expression grecque signifie littéralement « prendre sur »; avec « à la bouche », le français idiomatique « avoir » restitue l’idée de porter ou prononcer l’alliance.
- source_word: ἐπὶ στόματός σου
  choice: à la bouche
  rationale: Expression française naturelle qui conserve l’image de l’alliance portée dans la bouche, sans substituer « lèvres » au terme grec στόμα.
theological_decisions:
- issue: Valeur de τὴν διαθήκην μου
  choice: mon alliance
  alternative: mon testament
  rationale: « Alliance » est le sens contextuel normal de διαθήκη dans la citation scripturaire et maintient la relation d’engagement divin sans coloration testamentaire.
- issue: Désignation du destinataire implicite
  choice: au méchant
  alternative: au pécheur
  rationale: Le texte transmis ici présente une formulation elliptique dans laquelle le destinataire attendu de la citation est le méchant; ce choix suit le contexte citationnel attesté sans introduire une catégorie doctrinale plus spécifique.
translation_notes:
  register: Français moderne, digne et lisible. La tournure interrogative demeure directe, et l’image concrète de l’alliance « à la bouche » est préservée.
