id: 1CLEM.35.8
reference: 1 Clement 35:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
translation:
  language: fr
  text: Mais toi, tu as détesté la discipline et tu as jeté mes paroles derrière toi. Si tu voyais un voleur, tu courais avec lui, et tu mettais ton lot avec un adultère. Ta bouche débordait de méchanceté, et ta langue tissait la tromperie. Assis, tu calomniais ton frère et tu tendais un piège au fils de ta mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείαν
  choice: la discipline
  rationale: Le terme désigne ici la correction ou l'instruction qui forme; « discipline » conserve ces deux dimensions dans un registre digne.
- source_word: συνέτρεχες αὐτῷ
  choice: tu courais avec lui
  rationale: Rend directement l'image du verbe composé et l'association active avec le voleur.
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  choice: tu prenais part avec un homme adultère
  rationale: μοιχοῦ est un génitif masculin singulier; la formulation française exprime l'association sans transformer ce singulier en pluriel.
- source_word: περιέπλεκεν δολιότητα
  choice: tissait la tromperie
  rationale: Conserve la métaphore de l'entrelacement portée par περιπλέκω, avec une formulation française naturelle.
- source_word: κατελάλεις
  choice: tu calomniais
  rationale: Le verbe signifie parler contre quelqu'un ou le dénigrer; « calomniais » convient au contexte accusateur.
- source_word: σκάνδαλον
  choice: un obstacle
  rationale: Dans ce contexte, le mot désigne ce qui fait trébucher ou cause la chute; « obstacle » garde l'image sans imposer le sens moderne de « scandale ».
theological_decisions:
- issue: Valeur temporelle de εἰ ἐθεώρεις et des imparfaits
  choice: « Quand tu voyais… tu courais… »
  alternative: « Si tu voyais… tu courais… »
  rationale: Dans cette dénonciation d'une conduite répétée, le français temporel rend naturellement la valeur habituelle des imparfaits, sans changer le fond de l'accusation.
- issue: Rapport avec « un homme adultère »
  choice: « tu prenais part avec »
  alternative: « tu mettais ta part avec »
  rationale: La tournure idiomatique française exprime le partage et la complicité suggérés par μερίδα, sans préciser davantage la nature de cette participation.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier suit les formes grecques de deuxième personne du singulier. Les images concrètes du texte sont maintenues autant que le permet un français naturel.
