revisions:
- from: Mais toi, tu as détesté la discipline et tu as rejeté mes paroles derrière toi. Quand tu voyais un voleur, tu courais avec lui, et tu prenais part avec un homme adultère. Ta bouche débordait de méchanceté, et ta langue tissait la tromperie. Assis, tu calomniais ton frère et tu plaçais un obstacle devant le fils de ta mère.
  to: Mais toi, tu as détesté la discipline et tu as jeté mes paroles derrière toi. Si tu voyais un voleur, tu courais avec lui, et tu mettais ton lot avec un adultère. Ta bouche débordait de méchanceté, et ta langue tissait la tromperie. Assis, tu calomniais ton frère et tu tendais un piège au fils de ta mère.
  rationale: La révision corrige la direction de κατά et remplace deux tournures françaises moins naturelles, tout en préservant le singulier de μοιχοῦ, les aspects verbaux et les images accusatrices du grec. « Tendre un piège » explicite de façon idiomatique la fonction hostile de σκάνδαλον dans « mettre un obstacle contre quelqu'un », sans introduire d'interprétation doctrinale.
