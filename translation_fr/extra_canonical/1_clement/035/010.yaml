  text: I will rebuke you and set it before your face.
translation:
  language: fr
  text: Je te reprendrai et je te mettrai devant toi-même.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je te reprendrai et je te placerai devant ton visage ». La formule grecque, inhabituelle, peut évoquer une confrontation à soi-même ; elle est aussi souvent comprise, dans le contexte du psaume auquel elle renvoie, comme la présentation des fautes sous les yeux de la personne.'
    reason: Rendre le pronom explicite du grec tout en signalant avec prudence la difficulté de la formule et son interprétation contextuelle traditionnelle.
lexical_decisions:
- source_word: ἐλέγξω
  choice: Je te reprendrai
  rationale: Le verbe signifie confondre, réprimander ou reprendre en mettant la faute en lumière ; « reprendre » conserve ici un ton judiciaire et moral naturel en français.
- source_word: παραστήσω
  choice: je mettrai
  rationale: Le verbe signifie faire comparaître, placer ou présenter. Avec l’objet implicite tiré du contexte, « mettre sous les yeux » rend naturellement l’idée de présenter les faits à quelqu’un.
- source_word: κατὰ πρόσωπόν σου
  choice: sous tes yeux
  rationale: L’expression signifie littéralement « devant ta face ». L’idiome français « sous tes yeux » exprime clairement une confrontation directe avec les faits exposés.
theological_decisions:
- issue: Objet sous-entendu de παραστήσω
  choice: tout cela
  alternative: te placer devant toi-même
  rationale: 'Le grec présente une ambiguïté syntaxique : σε peut être compris avec les deux verbes, mais la formule biblique source (Ps 50.21 LXX ; 49.21 selon la numérotation grecque) est couramment comprise comme la mise en ordre ou la présentation des fautes devant la personne. « Tout cela » explicite minimalement le contenu implicite sans définir davantage ce qui est présenté.'
translation_notes:
  register: Français moderne, digne et direct. Le futur et la deuxième personne du singulier sont conservés. L’idiome « sous tes yeux » évite le calque peu naturel « devant ta face », tandis que la note documente la formulation littérale et l’autre analyse possible.
