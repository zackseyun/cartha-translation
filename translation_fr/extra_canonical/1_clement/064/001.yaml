revisions:
- from: Enfin, que Dieu, qui voit tout, le Maître des esprits et le Seigneur de toute chair, lui qui a choisi le Seigneur Jésus Christ et qui nous a choisis par lui pour être un peuple qui lui appartienne en propre, accorde à toute âme appelée par son nom majestueux et saint la foi, la crainte, la paix, la persévérance et la patience, la maîtrise de soi, la pureté et la sagesse, afin qu’elle soit agréable à son nom par Jésus Christ, notre grand prêtre et notre protecteur. Par lui soient à Dieu la gloire et la majesté, la puissance et l’honneur, maintenant et pour tous les siècles des siècles. Amen.
