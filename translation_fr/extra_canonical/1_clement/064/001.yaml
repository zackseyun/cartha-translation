review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur ἐπικεκλημένῃ τὸ ... ὄνομα αὐτοῦ : la construction passive avec le nom à l’accusatif désigne plus précisément une personne « sur qui [le] nom a été invoqué », plutôt qu’une personne simplement « appelée par son nom ». « Modération » rend σωφροσύνη avec davantage de précision que « sagesse », tout en la distinguant de ἐγκράτεια, « maîtrise de soi ». Le reste suit fidèlement la syntaxe et les titres grecs, y compris l’élection « par lui » et la doxologie adressée à Dieu par le Christ.'
  naturalness: Le français est fluide, soutenu et accessible. « Toute âme sur laquelle son nom majestueux et saint a été invoqué » est un peu solennel, mais convient au registre liturgique et conserve sans paraphrase l’expression grecque. La division de la doxologie en une seconde phrase favorise la lisibilité.
  terminology: « Maître des esprits », « Seigneur de toute chair », « peuple qui lui appartienne en propre », « grand prêtre », « protecteur » et « siècles des siècles » sont appropriés. « Modération » restitue la retenue et le jugement équilibré de σωφροσύνη sans introduire une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Sens de ἐπικεκλημένῃ τὸ ... ὄνομα αὐτοῦ
    rationale: « Appelée par son nom » peut suggérer que Dieu appelle la personne. La formulation grecque évoque plutôt le nom divin invoqué sur elle. Il convient de conserver cette relation sans en spécifier le cadre rituel.
  - severity: low
    issue: Rendu de σωφροσύνη
    rationale: « Sagesse » est trop général et ne rend pas nettement la modération, la sobriété et le jugement sain portés par σωφροσύνη. « Modération » est plus proche et reste idiomatique.
  revised_text: Enfin, que Dieu, qui voit tout, le Maître des esprits et le Seigneur de toute chair, lui qui a choisi le Seigneur Jésus Christ et qui nous a choisis par lui pour être un peuple qui lui appartienne en propre, accorde à toute âme sur laquelle son nom majestueux et saint a été invoqué la foi, la crainte, la paix, la persévérance et la patience, la maîtrise de soi, la pureté et la modération, afin de plaire à son nom par Jésus Christ, notre grand prêtre et notre protecteur. Par lui soient à Dieu la gloire et la majesté, la puissance et l’honneur, maintenant et pour tous les siècles des siècles. Amen.
