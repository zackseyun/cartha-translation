source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: fr
  text: Enfin, que Dieu, qui voit tout, le Maître des esprits et le Seigneur de toute chair, lui qui a choisi le Seigneur Jésus Christ et qui nous a choisis par lui pour être un peuple qui lui appartienne en propre, accorde à toute âme sur laquelle son nom majestueux et saint a été invoqué la foi, la crainte, la paix, la persévérance et la patience, la maîtrise de soi, la pureté et la modération, afin de plaire à son nom par Jésus Christ, notre grand prêtre et notre protecteur. Par lui soient à Dieu la gloire et la majesté, la puissance et l’honneur, maintenant et pour tous les siècles des siècles. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λοιπόν
  choice: Enfin
  rationale: Marque ici la conclusion et introduit la bénédiction finale de façon naturelle en français.
- source_word: παντεπόπτης
  choice: qui voit tout
  rationale: Rend directement l’idée de celui dont le regard embrasse tout, sans employer un terme français rare.
- source_word: δεσπότης τῶν πνευμάτων
  choice: le Maître des esprits
  rationale: Conserve le titre solennel et le sens d’autorité de δεσπότης.
- source_word: πάσης σαρκός
  choice: toute chair
  rationale: Maintient l’expression biblique désignant tous les êtres de chair.
- source_word: λαὸν περιούσιον
  choice: un peuple qui lui appartienne en propre
  rationale: Exprime l’idée d’un peuple constituant la possession particulière de Dieu.
- source_word: μακροθυμίαν
  choice: la patience
  rationale: Dans la paire avec ὑπομονή, désigne la patience prolongée, notamment envers autrui; le français courant ne permet pas toujours de préserver la distinction par un seul nom précis.
- source_word: σωφροσύνην
  choice: la sagesse
  rationale: Rend une disposition de jugement sain, de mesure et de maîtrise raisonnable dans un français naturel.
- source_word: ἀρχιερέως
  choice: grand prêtre
  rationale: Équivalent français établi du titre sacerdotal ἀρχιερεύς.
- source_word: προστάτου
  choice: protecteur
  rationale: Préserve le rôle de soutien, défense et protection exprimé par le terme grec.
- source_word: εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων
  choice: pour tous les siècles des siècles
  rationale: Conserve la formule doxologique emphatique du grec.
theological_decisions:
- issue: Relation de l’élection du Christ et de celle du peuple
  choice: « lui qui a choisi le Seigneur Jésus Christ et qui nous a choisis par lui »
  alternative: « qui a choisi le Seigneur Jésus Christ et nous, par lui »
  rationale: La répétition française explicite seulement la coordination grammaticale et rattache δι’ αὐτοῦ à l’élection de « nous », conformément à l’ordre grec, sans préciser davantage la nature de l’élection du Christ.
- issue: Appel par le nom divin
  choice: « toute âme appelée par son nom majestueux et saint »
  alternative: « toute âme sur laquelle son nom majestueux et saint a été invoqué »
  rationale: ἐπικεκλημένῃ peut évoquer l’appel ou le fait de porter un nom invoqué. Le choix retenu demeure proche de la construction grecque tout en restant lisible, sans développer une interprétation rituelle particulière.
- issue: Doxologie médiatisée par le Christ
  choice: « Par lui soient à Dieu la gloire… »
  alternative: « par qui lui appartiennent la gloire… »
  rationale: Clarifie en français que le pronom αὐτῷ renvoie à Dieu, tout en préservant la médiation exprimée par δι’ οὗ.
translation_notes:
  register: Français moderne, international et digne, avec maintien de quelques tournures bibliques consacrées (« toute chair », « siècles des siècles »). La longue phrase grecque est divisée avant la doxologie pour améliorer la lisibilité sans modifier sa structure logique.
