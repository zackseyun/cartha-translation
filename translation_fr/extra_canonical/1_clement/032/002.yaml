source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
translation:
  language: fr
  text: 'Car c’est de lui que viennent les prêtres et les lévites, tous ceux qui assurent le service à l’autel de Dieu ; c’est de lui que vient le Seigneur Jésus selon la chair ; c’est de lui que viennent les rois, les chefs et les dirigeants issus de Juda. Quant aux autres sceptres issus de lui[a], ils ne sont pas sans gloire, conformément à la promesse de Dieu : « Ta descendance sera comme les étoiles du ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « les autres sceptres issus de lui » ; dans ce contexte, le mot peut désigner par métonymie les autres tribus ou branches de sa descendance.
    reason: Le terme σκῆπτρα est inhabituel dans ce contexte et son référent collectif demeure ambigu.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: c’est de lui que viennent / vient
  rationale: Conserve l’anaphore grecque et le lien de provenance ou de descendance avec l’antécédent masculin du contexte.
- source_word: λειτουργοῦντες
  choice: assurent le service
  rationale: Exprime ici le service cultuel accompli à l’autel sans recourir au faux ami moderne « liturgisent ».
- source_word: τὸ κατὰ σάρκα
  choice: selon la chair
  rationale: Maintient la formulation théologiquement chargée et sa portée exacte, sans la réduire silencieusement à une simple formule généalogique.
- source_word: κατὰ τὸν Ἰούδαν
  choice: dans la lignée de Juda
  rationale: Rend naturellement le rapport à Juda dans ce développement généalogique.
- source_word: σκῆπτρα
  choice: sceptres
  rationale: Reproduit le terme grec concret et son imagerie d’autorité, tout en signalant en note son possible sens collectif.
- source_word: οὐκ ἐν μικρᾷ δόξῃ
  choice: jouissent d’une gloire qui n’est pas mince
  rationale: Conserve la litote grecque dans un français naturel et digne.
- source_word: σπέρμα
  choice: descendance
  rationale: Le nom singulier grec possède ici un sens collectif, comme l’indique la comparaison avec la multitude des étoiles.
theological_decisions:
- issue: Sens de « selon la chair » appliqué au Seigneur Jésus
  choice: Conserver littéralement « selon la chair »
  alternative: « par son humanité » ou « quant à son ascendance humaine »
  rationale: La formule grecque peut désigner la filiation humaine et porte aussi une tension christologique qu’une paraphrase explicative atténuerait.
- issue: Interprétation de σκῆπτρα
  choice: Garder « sceptres » dans le texte et expliquer l’autre compréhension en note
  alternative: Traduire directement par « tribus » ou « branches »
  rationale: Le sens concret est « sceptres », mais le contexte généalogique permet d’y voir, par métonymie, les autres groupes ou branches issus de l’ancêtre ; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’anaphore structurelle du grec est maintenue ; la ponctuation clarifie les longues coordinations sans effacer leur rythme solennel.
