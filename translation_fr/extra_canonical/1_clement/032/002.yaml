- from: 'Car c’est de lui que viennent les prêtres et les lévites, tous ceux qui assurent le service à l’autel de Dieu ; c’est de lui que vient le Seigneur Jésus selon la chair ; c’est de lui que viennent, dans la lignée de Juda, les rois, les chefs et les dirigeants. Quant aux autres sceptres issus de lui[a], ils jouissent d’une gloire qui n’est pas mince, conformément à cette promesse de Dieu : « Ta descendance sera comme les étoiles du ciel. »'
  to: 'Car c’est de lui que viennent les prêtres et les lévites, tous ceux qui assurent le service à l’autel de Dieu ; c’est de lui que vient le Seigneur Jésus selon la chair ; c’est de lui que viennent les rois, les chefs et les dirigeants issus de Juda. Quant aux autres sceptres issus de lui[a], ils ne sont pas sans gloire, conformément à la promesse de Dieu : « Ta descendance sera comme les étoiles du ciel. »'
  rationale: La révision resserre le lien généalogique de « Juda » avec la formulation « issus de Juda » et remplace une litote un peu lourde par une expression française plus idiomatique. Elle conserve « sceptres » et la note, afin de reproduire le terme grec sans imposer une interprétation de son référent.
