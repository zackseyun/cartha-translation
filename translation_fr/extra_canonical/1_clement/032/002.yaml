  - severity: low
    issue: Formulation de la litote
    rationale: « Une gloire qui n’est pas mince » est fidèle, mais « ne sont pas sans gloire » est une restitution française plus naturelle de οὐκ ἐν μικρᾷ δόξῃ, sans renforcer ni affaiblir la litote.
