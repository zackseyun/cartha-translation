source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: fr
  text: Tous ont donc été glorifiés et élevés, non par eux-mêmes, ni par leurs œuvres, ni par les actes justes qu’ils ont accomplis, mais par sa volonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: ont été glorifiés
  rationale: Conserve le passif et le sens de l’honneur ou de la gloire accordés.
- source_word: ἐμεγαλύνθησαν
  choice: ont été élevés
  rationale: Rend naturellement en français l’idée d’être rendu grand ou exalté, sans la formulation peu idiomatique « magnifiés ».
- source_word: δικαιοπραγίας
  choice: actes justes
  rationale: Exprime les actions conformes à la justice plutôt qu’une justice abstraite.
- source_word: κατειργάσαντο
  choice: ont accomplis
  rationale: Restitue l’idée d’avoir effectivement produit ou réalisé ces actes.
- source_word: θελήματος
  choice: volonté
  rationale: Équivalent direct et naturel de θέλημα dans ce contexte.
theological_decisions:
- issue: Fondement de leur glorification et de leur élévation
  choice: « non par eux-mêmes, ni par leurs œuvres, ni par les actes justes qu’ils ont accomplis, mais par sa volonté »
  alternative: « non grâce à eux-mêmes… mais grâce à sa volonté »
  rationale: La répétition de « par » préserve le contraste causal ou instrumental du grec sans préciser davantage la manière dont la volonté divine agit.
- issue: Référent du possessif αὐτοῦ
  choice: « sa volonté »
  alternative: « la volonté de Dieu »
  rationale: Le grec emploie un pronom dont le référent dépend du contexte; la traduction conserve cette reprise sans explicitation interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique et la répétition du grec sont conservées, avec une formulation idiomatique.
