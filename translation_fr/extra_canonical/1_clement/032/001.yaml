id: 1CLEM.32.1
reference: 1 Clement 32:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἐὰν τις καθ’ ἓν ἕκαστον εἰλικρινῶς κατανοήσῃ, ἐπιγνώσεται μεγαλεῖα τῶν ὑπ’ αὐτοῦ δεδομένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/001.yaml
  text: If anyone sincerely considers this point by point, he will recognize the greatness of the gifts given by him.
translation:
  language: fr
  text: Si quelqu’un examine sincèrement cela, point par point, il reconnaîtra la grandeur des dons accordés par lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃ ἐὰν τις … κατανοήσῃ
  choice: Si quelqu’un examine … cela
  rationale: Cette formulation rend la proposition conditionnelle introduite par ἐάν τις et traite le relatif neutre Ὃ, attesté par l’analyse syntaxique de la leçon, comme le complément repris naturellement en français par « cela ».
- source_word: καθ’ ἓν ἕκαστον
  choice: point par point
  rationale: 'La locution a ici une valeur adverbiale distributive : l’examen se fait élément après élément, plutôt que de porter sur « chaque chose » comme complément direct.'
- source_word: εἰλικρινῶς
  choice: sincèrement
  rationale: Le terme exprime un examen fait avec sincérité et sans dissimulation.
- source_word: ἐπιγνώσεται
  choice: il reconnaîtra
  rationale: Le verbe indique une connaissance ou une prise de conscience pleine, bien rendue ici par « reconnaître ».
- source_word: μεγαλεῖα
  choice: la grandeur
  rationale: Le pluriel grec désigne la grandeur ou le caractère magnifique de ce qui a été donné ; le singulier abstrait est idiomatique en français.
- source_word: τῶν ὑπ’ αὐτοῦ δεδομένων δωρεῶν
  choice: des dons accordés par lui
  rationale: « Accordés » convient au registre bienveillant du don, tandis que « par lui » conserve l’anaphore du pronom grec sans en préciser explicitement le référent.
theological_decisions:
- issue: Référent de αὐτοῦ (« lui »)
  choice: Conserver « par lui » sans nommer le donateur
  alternative: Expliciter « par Dieu »
  rationale: Même si le contexte peut orienter vers Dieu, le verset emploie un pronom ; l’expliciter supprimerait une part de l’anaphore du texte source.
translation_notes:
  register: Français moderne, clair et digne. La phrase reste proche de la structure conditionnelle grecque tout en employant l’ordre naturel du français. Aucun marqueur de note n’est requis.
