id: 1CLEM.32.4
reference: 1 Clement 32:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
translation:
  language: fr
  text: Ainsi donc, nous aussi, appelés par sa volonté en Christ Jésus[a], nous ne sommes pas justifiés par nous-mêmes, ni par notre sagesse, notre intelligence, notre piété ou les œuvres que nous avons accomplies dans la sainteté du cœur, mais par la foi. C’est par elle que le Dieu tout-puissant a justifié tous ceux qui ont vécu depuis le commencement[b]. À lui soit la gloire pour les siècles des siècles ! Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le Messie Jésus ».'
    reason: Χριστός est la forme grecque du titre « Messie », même si « Christ » est la formulation habituelle dans cette expression.
  - marker: b
    text: 'Ou : « de tout temps ».'
    reason: ἀπ’ αἰῶνος peut évoquer soit le commencement ancien, soit toute la durée écoulée depuis les origines.
lexical_decisions:
- source_word: διὰ θελήματος αὐτοῦ
  choice: par sa volonté
  rationale: Rend directement le moyen ou la cause exprimés par διά avec le génitif, sans alourdir la phrase.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Christ Jésus
  rationale: Conserve la formule chrétienne ancienne et l’ordre des mots grecs; une note signale la valeur messianique du titre Χριστός.
- source_word: δικαιούμεθα / ἐδικαίωσεν
  choice: sommes justifiés / a justifié
  rationale: Le même verbe français préserve la répétition de δικαιόω ainsi que sa portée théologique, sans imposer exclusivement « déclarer justes » ou « rendre justes ».
- source_word: ἔργων ὧν κατειργασάμεθα
  choice: les œuvres que nous avons accomplies
  rationale: « Accomplir » exprime la réalisation effective indiquée par κατεργάζομαι et garde le lien avec ἔργων.
- source_word: ἐν ὁσιότητι καρδίας
  choice: dans la sainteté du cœur
  rationale: Traduction formelle qui conserve l’image du cœur et la nuance de consécration ou de droiture de ὁσιότης.
- source_word: ἀπ’ αἰῶνος
  choice: depuis le commencement
  rationale: Expression française naturelle pour l’origine lointaine visée; la variante « de tout temps » est donnée en note afin de préserver l’étendue sémantique.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Formule doxologique française traditionnelle qui reflète fidèlement l’intensification grecque.
theological_decisions:
- issue: Sens de δικαιόω
  choice: justifier
  alternative: déclarer juste / rendre juste
  rationale: « Justifier » maintient en français la tension entre les lectures déclarative et transformative du verbe grec, sans trancher une question théologique que le verset ne précise pas.
- issue: Rôle de la foi dans διὰ τῆς πίστεως
  choice: par la foi
  alternative: au moyen de la foi
  rationale: La formulation conserve la construction instrumentale du grec sans développer une théorie du mécanisme de la justification.
- issue: Valeur de Χριστός
  choice: Christ
  alternative: Messie
  rationale: Dans la formule établie ἐν Χριστῷ Ἰησοῦ, « Christ » convient au registre chrétien grec de l’époque, tandis qu’une note rappelle le sens titulaire de « Messie ».
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’enchaînement argumentatif du grec, mais une nouvelle phrase avant « C’est par elle » évite une période excessivement longue. Les répétitions théologiques essentielles, notamment « justifiés / a justifié », sont maintenues.
