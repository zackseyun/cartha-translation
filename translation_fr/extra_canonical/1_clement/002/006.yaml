source:
  edition: Funk 1901 (normalized OCR)
  text: πᾶσα στάσις καὶ πᾶν σχίσμα βδέλυκτον ἦν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/006.yaml
  text: Every faction and every schism was detestable to you.
translation:
  language: fr
  text: Toute discorde et toute division vous faisaient horreur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στάσις
  choice: discorde
  rationale: Dans ce contexte communautaire, le terme désigne les querelles et l’opposition interne plutôt qu’une rébellion politique ouverte. « Discorde » restitue ce sens sans le réduire à l’existence d’un groupe constitué.
- source_word: σχίσμα
  choice: division
  rationale: « Division » exprime clairement la rupture au sein de la communauté et reste naturel en français moderne; « schisme » aurait une portée ecclésiologique plus technique et potentiellement anachronique.
- source_word: βδέλυκτον ἦν ὑμῖν
  choice: vous faisaient horreur
  rationale: Cette tournure française naturelle conserve la forte répulsion exprimée par βδέλυκτον, plus vigoureuse que « vous déplaisaient » et moins artificielle que « vous étaient abominables ».
theological_decisions:
- issue: Portée de σχίσμα
  choice: Le rendre par le terme général « division »
  alternative: « schisme »
  rationale: Le grec peut évoquer une déchirure communautaire sans imposer le sens institutionnel ou doctrinal plus spécialisé que « schisme » peut avoir aujourd’hui.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « toute » conserve la structure distributive et l’insistance du grec.
