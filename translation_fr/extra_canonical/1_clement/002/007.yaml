id: 1CLEM.2.7
reference: 1 Clement 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ τοῖς παραπτώμασιν τῶν πλησίον ἐπενϑεῖτε· τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε. ἀγαθοποιοί, ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
translation:
  language: fr
  text: Vous vous affligiez des fautes de vos prochains ; vous considériez leurs manquements comme les vôtres. Vous faisiez le bien[a], prêts à toute œuvre bonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous étiez bienfaisants » ; le grec a ici une proposition sans verbe exprimé.'
    reason: Préserver la forme adjectivale et l’absence de copule dans le grec tout en proposant dans le texte principal un français naturel.
lexical_decisions:
- source_word: παραπτώμασιν
  choice: fautes
  rationale: « Fautes » rend les écarts ou transgressions sans durcir inutilement le terme en une qualification doctrinale.
- source_word: τῶν πλησίον
  choice: de vos prochains
  rationale: Le pluriel substantivé désigne les personnes proches ou les semblables ; « vos prochains » conserve l’expression biblique tout en restant intelligible.
- source_word: ὑστερήματα
  choice: manquements
  rationale: Le mot désigne ici ce qui fait défaut chez autrui, ses insuffisances ; « manquements » convient au contexte moral et évite le vague de « défauts ».
- source_word: ἴδια ἐκρίνετε
  choice: vous considériez … comme les vôtres
  rationale: Dans cette construction, κρίνω exprime l’estimation ou la manière de tenir une chose pour telle ; « considériez comme » est naturel en français.
- source_word: ἀγαθοποιοί
  choice: vous faisiez le bien
  rationale: Cet adjectif nominatif pluriel caractérise les destinataires comme pratiquant le bien. La formulation verbale française restitue naturellement ce sens.
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  choice: prêts à toute œuvre bonne
  rationale: Cette formulation conserve la portée distributive de πᾶν et l’écho biblique de « toute œuvre bonne ».
theological_decisions:
- issue: Rapport aux fautes et aux manquements d’autrui
  choice: Les destinataires s’affligeaient des fautes de leurs prochains et tenaient leurs manquements pour les leurs.
  alternative: Ils portaient juridiquement la culpabilité des autres.
  rationale: Le grec décrit une solidarité morale et compatissante, sans affirmer explicitement un transfert de culpabilité.
- issue: Nature grammaticale de ἀγαθοποιοί
  choice: Rendre la proposition nominale par « Vous faisiez le bien » afin de produire une phrase naturelle.
  alternative: « Bienfaisants, prêts à toute œuvre bonne. »
  rationale: Le grec ne comporte pas de copule exprimée. La traduction explicite la prédication sans lui ajouter de contenu théologique.
translation_notes:
  register: Français moderne, digne et accessible. Les imparfaits rendent l’aspect duratif des formes grecques ἐπενθεῖτε et ἐκρίνετε. « Prochains » et « œuvre bonne » maintiennent un registre biblique courant sans archaïsme excessif.
