source:
  edition: Funk 1901 (normalized OCR)
  text: ἦν ὑμῖν ἡμέρας τε καὶ νυκτὸς ὑπὲρ πάσης τῆς ἀδελφότητος, εἰς τὸ σώζεσϑαι μετ’ ἐλέους καὶ συνειδήσεως τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/004.yaml
  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
translation:
  language: fr
  text: Jour et nuit, vous meniez un combat[a] pour toute la communauté des frères, afin que le nombre de ses élus soit sauvé avec miséricorde et conscience.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « combat » est attesté dans le texte édité de Funk, mais il manque dans l’OCR normalisé fourni.
    reason: Signaler une omission probable de l’OCR qui affecte substantiellement le sens et la syntaxe.
lexical_decisions:
- source_word: ἀγών (attesté dans le texte de Funk, omis dans l’OCR fourni)
  choice: combat
  rationale: Le terme désigne une lutte ou un effort intense. « Combat » conserve cette force sans préciser indûment la nature de l’engagement.
- source_word: ἀδελφότης
  choice: communauté des frères
  rationale: Cette formulation rend le sens collectif de la fraternité croyante tout en restant claire en français moderne.
- source_word: ἐκλεκτῶν
  choice: élus
  rationale: « Élus » correspond directement au terme grec et préserve sa portée théologique sans l’expliciter davantage.
- source_word: συνείδησις
  choice: conscience
  rationale: Le grec ne comporte aucun adjectif équivalant à « bonne » ; la traduction évite donc d’ajouter cette qualification.
theological_decisions:
- issue: Référent du possessif αὐτοῦ (« ses élus »)
  choice: ses élus
  alternative: ceux que Dieu a choisis
  rationale: Le pronom grec ne nomme pas explicitement son référent dans ce verset. Le conserver évite de résoudre silencieusement la référence.
- issue: Relation de « avec miséricorde et conscience » au salut des élus
  choice: soit sauvé avec miséricorde et en toute conscience
  alternative: vous meniez avec miséricorde et conscience un combat… afin que…
  rationale: L’ordre grec rattache naturellement ce groupe verbal à « soit sauvé », mais l’expression demeure inhabituelle. La traduction respecte cette tension plutôt que de déplacer sans certitude les compléments.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’intensité de ἀγών, le vocabulaire théologique d’« élus » et l’expression difficile concernant la miséricorde et la conscience, sans harmonisation doctrinale.
