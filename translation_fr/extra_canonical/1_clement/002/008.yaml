source:
  edition: Funk 1901 (normalized OCR)
  text: σεβασμίῳ πολιτείᾳ κεκοσμημένοι πάντες ἐν φόβῳ αὐτοῦ ἐτελελεῖτε· τὰ προστάγματα καὶ τὰ δικαιώματα τοῦ κυρίου ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν ἐγέγραπτο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/008.yaml
  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
translation:
  language: fr
  text: Parés d’une conduite digne de respect, vous accomplissiez tout dans la crainte de Dieu ; les commandements et les justes exigences du Seigneur étaient inscrits sur les tables de vos cœurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les larges surfaces de vos cœurs » ; l’expression évoque des surfaces où l’on écrit.'
    reason: Le mot grec πλάτη signifie les largeurs ou larges surfaces, tandis que « tables » rend l’image de façon idiomatique et son écho scripturaire.
lexical_decisions:
- source_word: σεβασμίῳ πολιτείᾳ
  choice: d’une conduite digne de respect
  rationale: πολιτεία désigne ici la manière de vivre ou la conduite, tandis que σεβάσμιος exprime ce qui inspire le respect. Cette formulation reste naturelle et digne en français.
- source_word: πάντα ἐτελεῖτε
  choice: vous accomplissiez tout
  rationale: La leçon manifestement visée, malgré les anomalies de l’OCR fourni, signifie accomplir ou mettre en pratique toutes choses. L’imparfait convient à la description de la conduite habituelle des destinataires.
- source_word: ἐν φόβῳ αὐτοῦ
  choice: dans la crainte de Dieu
  rationale: Le pronom renvoie à Dieu dans le contexte. Expliciter le référent évite en français une ambiguïté artificielle sans ajouter de contenu doctrinal.
- source_word: τὰ προστάγματα καὶ τὰ δικαιώματα
  choice: les commandements et les justes exigences
  rationale: πρόσταγμα est un ordre ou commandement ; δικαίωμα peut désigner une prescription tenue pour juste ou conforme au droit. « Justes exigences » préserve la nuance normative et morale.
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν
  choice: sur les tables de vos cœurs
  rationale: Le grec évoque littéralement les larges surfaces du cœur. « Tables » rend naturellement en français l’image scripturaire d’un texte gravé dans le cœur, tandis qu’une note conserve la formulation plus littérale.
theological_decisions:
- issue: Référent de αὐτοῦ dans « sa crainte »
  choice: Dieu
  alternative: sa crainte
  rationale: Le contexte immédiat de l’épître présente Dieu comme l’objet de cette crainte révérencielle. L’explicitation est idiomatique et ne tranche aucune controverse théologique.
- issue: Portée de δικαιώματα
  choice: justes exigences
  alternative: prescriptions
  rationale: Ce choix conserve à la fois la force normative et la connotation de justice du terme, sans le réduire à une catégorie confessionnelle particulière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La cadence en deux membres et le vocabulaire moral solennel de l’original sont conservés. Le pluriel « vos cœurs » est plus naturel en français que le singulier collectif du grec.
