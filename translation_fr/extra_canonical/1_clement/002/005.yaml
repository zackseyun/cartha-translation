lexical_decisions:
- source_word: εἰλικρινεῖς
  choice: sincères
  rationale: Rend naturellement l’idée de pureté d’intention et d’absence de dissimulation.
- source_word: ἀκέραιοι
  choice: intègres
  rationale: Exprime l’idée de personnes sans mélange de mal, irréprochables dans leur conduite, sans suggérer seulement la naïveté.
- source_word: ἀμνησίκακοι
  choice: sans rancune
  rationale: Le terme désigne ceux qui ne gardent pas en mémoire le tort subi pour en vouloir à autrui; « sans rancune » est clair et idiomatique en français moderne.
- source_word: εἰς ἀλλήλους
  choice: les uns envers les autres
  rationale: Restitue explicitement la réciprocité de la disposition au sein de la communauté.
