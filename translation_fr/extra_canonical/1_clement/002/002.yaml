revisions:
- from: Ainsi, une paix profonde et abondante avait été accordée à tous[a], avec un désir insatiable de faire le bien, et une pleine effusion de l’Esprit saint se répandait sur tous ;
  to: Ainsi, une paix profonde et abondante avait été accordée à tous, ainsi qu’un désir insatiable de faire le bien, et une abondante effusion de l’Esprit saint se produisait sur tous ;
  rationale: La révision maintient le plus-que-parfait exigé par ἐδέδοτο et le caractère descriptif de ἐγίνετο. Elle rend plus exactement l’effusion comme un événement ou état survenant « sur tous », améliore la coordination française et supprime une note de variante qui ne reflète pas directement la morphologie grecque.
