source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως εἰρήνη βαϑεῖα καὶ λιπαρὰ ἐδέδοτο πᾶσιν καὶ ἀκόρεστος πόϑος εἰς ἀγαϑοποιΐαν, καὶ πλήρης πνεύματος ἁγίου ἐπέχυσις ἐπὶ πάντας ἐγίνετο·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/002.yaml
  text: Thus deep and rich peace had been given to all[a], and an insatiable desire for doing good, and a full outpouring of the Holy Spirit came upon all;
translation:
  language: fr
  text: Ainsi, une paix profonde et abondante avait été accordée à tous, ainsi qu’un désir insatiable de faire le bien, et une abondante effusion de l’Esprit saint se produisait sur tous ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λιπαρά
  choice: abondante
  rationale: Au sens figuré, le terme évoque une paix riche, généreuse et florissante ; « abondante » restitue cette idée naturellement en français.
- source_word: ἀκόρεστος πόθος
  choice: un désir insatiable
  rationale: Cette expression conserve l’intensité d’un désir qui ne peut être rassasié.
- source_word: ἀγαθοποιΐα
  choice: faire le bien
  rationale: Cette formulation courante et précise rend l’idée d’une conduite activement bienfaisante.
- source_word: πλήρης … ἐπέχυσις
  choice: une pleine effusion
  rationale: « Effusion » garde l’image grecque d’un déversement, tandis que « pleine » conserve explicitement πλήρης.
theological_decisions:
- issue: Nature de l’effusion de l’Esprit saint
  choice: une pleine effusion de l’Esprit saint se répandait sur tous
  alternative: une pleine effusion de l’Esprit saint avait lieu sur tous
  rationale: La formulation choisie préserve l’image de l’effusion et l’aspect continu de ἐγίνετο, sans préciser davantage la nature de cette expérience.
translation_notes:
  register: Français moderne, digne et accessible. Le plus-que-parfait rend ἐδέδοτο, tandis que l’imparfait de « se répandait » exprime le déroulement de ἐγίνετο. La coordination légèrement ample respecte le rythme de la phrase grecque.
