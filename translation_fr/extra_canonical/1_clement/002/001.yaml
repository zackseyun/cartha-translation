revisions:
- from: Vous aviez tous des sentiments d’humilité, sans vous vanter de rien. Vous préfériez vous soumettre plutôt que soumettre les autres, et vous trouviez plus de joie à donner qu’à recevoir. Vous vous contentiez des provisions du Christ pour la route[a] et prêtiez une grande attention à ses paroles. Vous les aviez soigneusement serrées dans votre cœur[b], et ses souffrances étaient devant vos yeux.
  to: Vous étiez tous humbles, sans vous vanter de rien ; vous préfériez vous soumettre plutôt que soumettre les autres, et vous trouviez plus de joie à donner qu’à recevoir. Vous vous contentiez des ressources du Christ[a] et prêtiez une grande attention à ses paroles ; vous les aviez profondément accueillies dans votre cœur[b], et ses souffrances étaient devant vos yeux.
  rationale: La révision maintient la structure et le portrait habituel au passé, tout en supprimant une explicitation non formulée dans le grec (« pour la route »). Elle emploie des tournures françaises modernes plus directes et conserve les ambiguïtés lexicales pertinentes au moyen de notes.
  reviewer_model: gpt-5.6-terra
