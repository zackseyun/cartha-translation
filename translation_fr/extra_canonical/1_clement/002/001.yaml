id: 1CLEM.2.1
reference: 1 Clement 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
translation:
  language: fr
  text: Vous étiez tous humbles, sans vous vanter de rien ; vous préfériez vous soumettre plutôt que soumettre les autres, et vous trouviez plus de joie à donner qu’à recevoir. Vous vous contentiez des ressources du Christ[a] et prêtiez une grande attention à ses paroles ; vous les aviez profondément accueillies dans votre cœur[b], et ses souffrances étaient devant vos yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner des provisions ou un équipement, notamment pour un voyage. Le génitif « du Christ » peut évoquer ce qui vient de lui, lui appartient ou se rapporte à lui.
    reason: Préserver le sens concret possible de ἐφόδια et l’ambiguïté du génitif, sans ajouter « pour la route » au texte principal.
  - marker: b
    text: 'Littéralement : « dans vos entrailles » ou « dans vos parties intérieures », expression qui désigne le siège des affections profondes.'
    reason: Signaler l’image corporelle de σπλάγχνα, rendue idiomatiquement par « cœur ».
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  choice: vous aviez tous des sentiments d’humilité
  rationale: Rend l’imparfait et l’idée d’une disposition intérieure humble dans un français naturel et digne.
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  choice: vous préfériez vous soumettre plutôt que soumettre les autres
  rationale: Préserve le contraste actif-passif du grec sans ajouter l’idée plus étroite d’exiger la soumission.
- source_word: ἧδον διδόντες ἢ λαμβάνοντες
  choice: vous trouviez plus de joie à donner qu’à recevoir
  rationale: Exprime la préférence accompagnée de plaisir indiquée par le comparatif grec.
- source_word: τοῖς ἐφοδίοις
  choice: des provisions […] pour la route
  rationale: Le terme désigne proprement ce qui équipe ou nourrit pour un voyage; cette image est conservée tout en restant intelligible.
- source_word: ἐνεστερνισμένοι […] τοῖς σπλάγχνοις
  choice: serrées dans votre cœur
  rationale: Littéralement lié aux organes intérieurs, le grec emploie ici une image du siège profond des sentiments; «cœur» en donne l’équivalent idiomatique moderne.
- source_word: τὰ παθήματα
  choice: ses souffrances
  rationale: Rend directement les souffrances subies par le Christ, sans préciser au-delà du grec leur nature ou leur portée.
theological_decisions:
- issue: Sens du génitif τοῦ Χριστοῦ avec ἐφόδια
  choice: les provisions du Christ pour la route
  alternative: les ressources que procure le Christ
  rationale: La formulation française conserve la relative ouverture du génitif grec, qui peut indiquer la provenance ou l’appartenance, tandis que la note explicite l’interprétation de provenance.
- issue: Référence de αὐτοῦ dans «ses paroles» et «ses souffrances»
  choice: le Christ
  alternative: une référence plus générale au Seigneur
  rationale: L’antécédent explicite le plus proche est «le Christ»; la traduction garde les pronoms du texte tout en laissant ce lien contextuel naturel.
translation_notes:
  register: Français international moderne, fluide et digne. Les imparfaits maintiennent le portrait d’une conduite habituelle passée. La structure parallèle du grec est conservée, avec un léger découpage en phrases pour la lisibilité.
