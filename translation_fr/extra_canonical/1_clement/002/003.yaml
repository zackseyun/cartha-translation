source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
translation:
  language: fr
  text: Remplis d’un saint dessein, animés d’un bon zèle et d’une pieuse confiance, vous avez tendu les mains vers Dieu, le Tout-Puissant, en le suppliant de vous être favorable si vous aviez péché en quoi que ce soit involontairement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans le vouloir » ou « par inadvertance ».'
    reason: ἀκόντες qualifie une faute commise sans intention délibérée; selon le contexte, l’expression peut inclure l’inadvertance, sans que le grec en précise la cause.
lexical_decisions:
- source_word: ὁσίας βουλῆς
  choice: d’un saint dessein
  rationale: Le singulier βουλή désigne ici une intention, une résolution ou un dessein; «saint dessein» conserve la force morale et religieuse de ὁσίας dans un français naturel.
- source_word: ἐν ἀγαθῇ προθυμίᾳ
  choice: animés d’un bon zèle
  rationale: προθυμία exprime l’empressement et la bonne volonté; «bon zèle» rend cette disposition positive sans suggérer une simple émotion passagère.
- source_word: μετ’ εὐσεβοῦς πεποιθήσεως
  choice: d’une pieuse confiance
  rationale: πεποίθησις indique une confiance assurée, qualifiée par εὐσεβής comme respectueuse de Dieu ou pieuse.
- source_word: τὸν παντοκράτορα θεόν
  choice: Dieu, le Tout-Puissant
  rationale: Cette formulation française claire conserve à παντοκράτωρ sa valeur de titre divin.
- source_word: ἵλεων γενέσθαι
  choice: de vous être favorable
  rationale: ἵλεως peut signifier favorable, bien disposé ou miséricordieux; «être favorable» préserve cette largeur sémantique tout en convenant à une supplication.
- source_word: ἀκόντες
  choice: sans le vouloir
  rationale: Le terme qualifie un acte non volontaire ou non intentionnel; cette expression française courante évite l’idée trompeuse d’une contrainte extérieure.
theological_decisions:
- issue: Nature des péchés qualifiés par ἀκόντες
  choice: sans le vouloir
  alternative: par inadvertance / involontairement
  rationale: Le texte distingue des fautes non voulues sans préciser si elles résultent de l’ignorance, de l’inattention ou d’une autre absence d’intention; la traduction maintient cette ouverture.
- issue: Sens de la faveur divine dans ἵλεων γενέσθαι
  choice: vous être favorable
  alternative: avoir pitié de vous / se montrer miséricordieux envers vous
  rationale: Le grec exprime la disposition favorable sollicitée auprès de Dieu sans développer explicitement une théorie de l’expiation; le choix évite de surinterpréter.
translation_notes:
  register: Français international moderne, digne et fluide. La structure participiale grecque est rendue par deux groupes descriptifs coordonnés; l’image biblique des mains tendues est conservée.
