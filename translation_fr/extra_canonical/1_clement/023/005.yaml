review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : ἐπ’ ἀληθείας, l’accomplissement de la volonté, la double qualification temporelle et le témoignage scripturaire sont conservés. Toutefois, dans la seconde citation, καί relie « le Seigneur » et « le Saint »; « ainsi que » risque de les présenter comme deux sujets coordonnés plutôt que de conserver la juxtaposition appositionnelle du grec. « et le Saint, celui que vous attendez » rend plus exactement la syntaxe sans trancher leur rapport référentiel.'
  naturalness: Le français est fluide et de registre soutenu. « rapidement » est légèrement plus naturel et plus proche du registre scripturaire moderne que « vite » dans cette phrase solennelle. La reprise « disant » introduit clairement les citations.
  terminology: « Écriture », « Seigneur », « temple » et « le Saint » sont appropriés. Le titre substantivé « le Saint » doit être maintenu, sans explicitation christologique. « celui que vous attendez » restitue naturellement ὃν ὑμεῖς προσδοκᾶτε.
  issues:
  - severity: medium
    issue: « ainsi que le Saint » dans la seconde citation
    rationale: Cette expression française suggère volontiers l’adjonction d’un second élément (« le Seigneur ... ainsi que le Saint »). Le grec καὶ ὁ ἅγιος suit « le Seigneur » dans une construction dont la relation exacte doit rester ouverte; une juxtaposition appositionnelle est plus fidèle et moins interprétative.
  - severity: low
    issue: « vite »
    rationale: Correct au sens, mais « rapidement » convient mieux au registre soutenu de la phrase et à la formulation scripturaire.
  revised_text: 'En vérité, sa volonté s’accomplira rapidement et soudainement, comme l’Écriture en témoigne aussi, disant : « Il viendra rapidement et ne tardera pas », et : « Soudain, le Seigneur viendra dans son temple, et le Saint, celui que vous attendez. »'
  revised_footnotes: []
  revision_rationale: La révision remplace « ainsi que » par une coordination suivie d’une apposition (« et le Saint, celui que vous attendez »), afin de reproduire la formulation grecque sans décider si « le Saint » identifie ou distingue le Seigneur. Elle ajuste aussi « vite » en « rapidement » pour un registre plus naturel et soutenu, sans changement de sens.
