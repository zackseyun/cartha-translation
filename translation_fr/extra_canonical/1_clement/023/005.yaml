revisions:
- from: 'En vérité, sa volonté s’accomplira vite et soudainement, comme l’Écriture aussi en témoigne : « Il viendra vite et ne tardera pas », et : « Soudain, le Seigneur viendra dans son temple, ainsi que le Saint que vous attendez. »'
  to: 'En vérité, sa volonté s’accomplira rapidement et soudainement, comme l’Écriture en témoigne aussi, disant : « Il viendra rapidement et ne tardera pas », et : « Soudain, le Seigneur viendra dans son temple, et le Saint, celui que vous attendez. »'
  rationale: La révision remplace « ainsi que » par une coordination suivie d’une apposition (« et le Saint, celui que vous attendez »), afin de reproduire la formulation grecque sans décider si « le Saint » identifie ou distingue le Seigneur. Elle ajuste aussi « vite » en « rapidement » pour un registre plus naturel et soutenu, sans changement de sens.
