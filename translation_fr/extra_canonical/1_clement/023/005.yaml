id: 1CLEM.23.5
reference: 1 Clement 23:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας ταχὺ καὶ ἐξαίφνης τελειωθήσεται τὸ θέλημα αὐτοῦ, συνεπιμαρτυρούσης καὶ τῆς γραφῆς, ὅτι ταχὺ ἥξει καὶ οὐ χρονιεῖ, καὶ ἐξαίφνης ἥξει ὁ κύριος εἰς τὸν ναὸν αὐτοῦ, καὶ ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: fr
  text: 'En vérité, sa volonté s’accomplira rapidement et soudainement, comme l’Écriture en témoigne aussi, disant : « Il viendra rapidement et ne tardera pas », et : « Soudain, le Seigneur viendra dans son temple, et le Saint, celui que vous attendez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: En vérité
  rationale: Rend l’affirmation solennelle et emphatique du grec dans un français naturel et digne.
- source_word: τελειωθήσεται τὸ θέλημα αὐτοῦ
  choice: sa volonté s’accomplira
  rationale: Le passif de τελειόω exprime ici l’achèvement ou la pleine réalisation de la volonté; « s’accomplira » est idiomatique et conserve cette portée.
- source_word: ταχὺ καὶ ἐξαίφνης
  choice: vite et soudainement
  rationale: 'Préserve les deux nuances distinctes : la rapidité et le caractère imprévu ou brusque.'
- source_word: συνεπιμαρτυρούσης καὶ τῆς γραφῆς
  choice: comme l’Écriture aussi en témoigne
  rationale: Reproduit l’idée d’un témoignage concordant apporté par l’Écriture.
- source_word: ὁ ἅγιος
  choice: le Saint
  rationale: Conserve le titre substantivé et son ambiguïté référentielle sans l’expliciter.
- source_word: προσδοκᾶτε
  choice: vous attendez
  rationale: Expression française directe qui rend l’attente anticipatrice du verbe grec.
theological_decisions:
- issue: Rapport entre « le Seigneur » et « le Saint » dans la dernière citation
  choice: ainsi que le Saint
  alternative: c’est-à-dire le Saint
  rationale: Le grec καί coordonne les expressions sans imposer explicitement une identification explicative; la traduction évite donc de résoudre la relation théologique.
- issue: Référent du sujet de « il viendra »
  choice: Maintien du pronom « il » sans identification ajoutée
  alternative: le Seigneur viendra
  rationale: Le grec cite simplement ἥξει; expliciter le sujet importerait une interprétation absente de la formulation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation distingue les deux citations enchâssées, tandis que la coordination grecque et les ambiguïtés christologiques ou référentielles restent ouvertes.
