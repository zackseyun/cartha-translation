id: 1CLEM.23.4
reference: 1 Clement 23:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
translation:
  language: fr
  text: '« Insensés, comparez-vous à un arbre : prenez une vigne. D’abord, elle perd ses feuilles ; puis une pousse se forme, ensuite une feuille, puis une fleur ; après cela, le raisin encore vert, puis la grappe, apparaissent. Vous voyez qu’en peu de temps le fruit de l’arbre arrive à maturité. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἀνόητοι
  choice: Insensés
  rationale: Apostrophe directe et vigoureuse qui rend le manque de discernement exprimé par ἀνόητοι, dans un registre digne et naturel.
- source_word: συμβάλετε ἑαυτοὺς ξύλῳ
  choice: comparez-vous à un arbre
  rationale: συμβάλλω prend ici le sens de mettre en parallèle ou comparer ; ξύλον désigne l’arbre ou la plante ligneuse dans l’illustration.
- source_word: φυλλορροεῖ
  choice: elle perd ses feuilles
  rationale: Rend clairement le composé grec indiquant la chute des feuilles, avec la vigne comme sujet naturel en français.
- source_word: βλαστὸς γίνεται
  choice: une pousse se forme
  rationale: βλαστός est une jeune pousse ; γίνεται décrit son apparition ou sa formation.
- source_word: ὄμφαξ
  choice: le raisin encore vert
  rationale: Désigne le raisin non mûr ; cette formulation est plus immédiatement compréhensible que « raisin vert », qui peut évoquer une variété mûre.
- source_word: σταφυλή
  choice: la grappe
  rationale: Dans la progression viticole, le terme désigne la grappe de raisin parvenue à son développement, sans ajouter explicitement une notion absente de maturité complète.
- source_word: ἐν καιρῷ ὀλίγῳ
  choice: en peu de temps
  rationale: Expression temporelle idiomatique qui conserve l’idée d’une brève période.
- source_word: εἰς πέπειρον καταντᾷ
  choice: arrive à maturité
  rationale: Reproduit le mouvement vers l’état mûr exprimé par καταντάω avec πέπειρος.
theological_decisions:
- issue: Portée de l’illustration naturelle
  choice: Conserver uniquement la comparaison et sa progression
  alternative: Expliciter une application à l’accomplissement des promesses divines
  rationale: Le verset présente l’image sans formuler lui-même son application ; l’ajouter résoudrait implicitement le lien contextuel au lieu de préserver la formulation du passage.
- issue: Accord du verbe παρίστανται
  choice: Faire de « le raisin encore vert » et « la grappe » les deux sujets du pluriel « apparaissent »
  alternative: Employer deux verbes singuliers successifs
  rationale: Le grec porte un seul verbe au pluriel pour les deux éléments, tout en maintenant leur succession grâce à εἶτα.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La ponctuation met en relief la succession des étapes. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
