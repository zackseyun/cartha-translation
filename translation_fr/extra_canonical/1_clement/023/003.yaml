source:
  edition: Funk 1901 (normalized OCR)
  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
translation:
  language: fr
  text: 'Que ce passage de l’Écriture soit loin de nous[a], lui qui dit : « Malheureux ceux qui ont le cœur partagé, ceux qui doutent en eux-mêmes et qui disent : “Nous avons entendu cela du temps de nos pères, et voici que nous vieillissons, et rien de tout cela ne nous est arrivé.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que cette Écriture soit loin de nous » ; le mot grec peut désigner l’Écriture ou un écrit tenu pour scripturaire.'
    reason: Le référent précis de γραφή et la provenance de la citation ne sont pas certains.
lexical_decisions:
- source_word: ἡ γραφὴ αὕτη
  choice: cette parole de l’Écriture
  rationale: Dans ce contexte de citation, γραφή désigne un texte scripturaire précis. « Cette parole de l’Écriture » est plus naturel en français que « cette Écriture » tout en conservant sa qualité d’autorité citée.
- source_word: δίψυχοι
  choice: ceux qui ont le cœur partagé
  rationale: Le terme signifie littéralement « à deux âmes » et évoque une personne intérieurement divisée. Cette formulation française rend clairement l’image sans la réduire au seul doute intellectuel.
- source_word: διατάζοντες τῇ ψυχῇ
  choice: ceux qui doutent au fond d’eux-mêmes
  rationale: Dans cette citation ancienne, la forme transmise est comprise au sens d’hésiter ou de douter intérieurement. La traduction reste naturelle et distingue cette expression de δίψυχοι.
- source_word: ἐπὶ τῶν πατέρων ἡμῶν
  choice: déjà au temps de nos pères
  rationale: La préposition a ici une valeur temporelle. « Nos pères » conserve la désignation ancestrale du grec.
- source_word: ἰδοὺ
  choice: et voici
  rationale: Conserve le marqueur emphatique du grec dans un registre digne et courant.
- source_word: συνέβηκεν
  choice: ne nous est arrivé
  rationale: Rend directement l’idée qu’aucun des événements annoncés ne s’est produit pour les locuteurs.
theological_decisions:
- issue: Statut et référent de la citation appelée γραφή
  choice: « parole de l’Écriture » avec une note signalant l’autre traduction possible
  alternative: « écrit » ou « texte »
  rationale: Le grec qualifie explicitement la citation de γραφή, sans permettre d’identifier avec certitude son origine. La traduction conserve ce statut sans attribuer la citation à un livre précis.
- issue: Rapport entre δίψυχοι et διατάζοντες τῇ ψυχῇ
  choice: 'Conserver deux expressions apparentées mais distinctes : « cœur partagé » puis « doutent au fond d’eux-mêmes »'
  alternative: Fusionner les deux en une seule notion de doute
  rationale: La répétition explicative du grec présente deux formulations. Les maintenir préserve la tension entre division intérieure et doute.
translation_notes:
  register: Français moderne, international et digne. La syntaxe de l’impératif à la troisième personne est rendue naturellement par « Que… soit ». Les guillemets imbriqués distinguent la citation scripturaire des paroles attribuées aux personnes mises en garde.
