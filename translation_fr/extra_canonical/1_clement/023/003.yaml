review_pass:
  verdict: revise
  source_fidelity: La formulation « parole de l’Écriture » ajoute « parole », absent de ἡ γραφὴ αὕτη, et la note proposée ne correspond pas exactement à ce choix. « Passage de l’Écriture » rend naturellement γραφή dans ce contexte. Le présent γηράσκομεν doit être conservé par « nous vieillissons », plutôt que le passé composé « nous avons vieilli ». « Doutent en eux-mêmes » rend l’idée de doute intérieur sans l’intensification interprétative de « au fond d’eux-mêmes ».
  naturalness: La révision maintient un français moderne et digne. « Que ce passage de l’Écriture soit loin de nous » est idiomatique tout en reproduisant la tournure optative/impérative du grec. La construction de la citation demeure claire.
  terminology: « Passage de l’Écriture » conserve le statut scripturaire explicitement attribué par γραφή, sans prétendre identifier l’origine de la citation. « Ceux qui ont le cœur partagé » restitue bien δίψυχοι; « ceux qui doutent en eux-mêmes » maintient la seconde expression sans la confondre avec la première.
  issues:
  - severity: medium
    issue: Temps verbal de γηράσκομεν
    rationale: Le grec est au présent (« nous vieillissons »), tandis que « nous avons vieilli » le transforme en état accompli.
  - severity: low
    issue: Ajout de « parole » dans « cette parole de l’Écriture »
    rationale: γραφή désigne ici l’écrit ou le passage scripturaire; « parole » est une explicitation non requise et rend la note alternative moins cohérente.
  - severity: low
    issue: « au fond d’eux-mêmes » est plus interprétatif que nécessaire
    rationale: Le datif τῇ ψυχῇ indique la sphère intérieure; « en eux-mêmes » le rend avec moins d’ajout.
