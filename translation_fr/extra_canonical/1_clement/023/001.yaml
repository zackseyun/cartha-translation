id: 1CLEM.23.1
reference: 1 Clement 23:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: fr
  text: Le Père, plein de compassion à tous égards et bienfaisant, éprouve une profonde tendresse pour ceux qui le craignent ; avec douceur et bonté, il accorde ses dons de grâce à ceux qui s’approchent de lui avec un cœur sans partage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οἰκτίρμων κατὰ πάντα
  choice: compatissant en toutes choses
  rationale: Rend directement la compassion du Père et la portée générale de κατὰ πάντα sans alourdir la phrase.
- source_word: εὐεργετικὸς
  choice: bienfaisant
  rationale: Conserve l’idée d’une disposition active à faire du bien.
- source_word: ἔχει σπλάγχνα ἐπὶ
  choice: éprouve une profonde tendresse pour
  rationale: L’expression grecque évoque les entrailles comme siège d’une vive compassion ; une traduction idiomatique est nécessaire en français moderne.
- source_word: φοβουμένους αὐτόν
  choice: ceux qui le craignent
  rationale: Préserve le langage religieux traditionnel et la portée possible de crainte révérencielle sans la réduire à un simple respect.
- source_word: ἠπίως τε καὶ προσηνῶς
  choice: avec douceur et bonté
  rationale: 'Rend les deux adverbes complémentaires : manière douce et attitude aimable ou bienveillante.'
- source_word: τὰς χάριτας αὐτοῦ ἀποδίδοι
  choice: il accorde ses dons de grâce
  rationale: χάριτας est au pluriel et désigne ici des bienfaits gracieux ; « accorde » convient au contexte, même si ἀποδίδοι peut littéralement suggérer donner ou rendre.
- source_word: ἁπλῇ διανοίᾳ
  choice: avec un cœur sans partage
  rationale: Exprime l’idée d’une disposition intérieure simple, sincère et non divisée dans un français naturel.
theological_decisions:
- issue: Sens de « craindre » Dieu
  choice: ceux qui le craignent
  alternative: ceux qui le révèrent
  rationale: Le texte garde la tension biblique de φόβος, qui peut inclure crainte et révérence ; « révèrent » en limiterait la portée.
- issue: Nature des χάριτες
  choice: dons de grâce
  alternative: bienfaits
  rationale: « Dons de grâce » maintient le lien lexical avec χάρις tout en indiquant le pluriel concret des faveurs accordées.
- issue: Qualité intérieure exprimée par ἁπλῇ διανοίᾳ
  choice: un cœur sans partage
  alternative: une pensée sincère
  rationale: Le choix souligne l’intégrité de l’orientation intérieure sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton paternel et dévotionnel du grec, tout en évitant le calque anatomique de σπλάγχνα et une traduction trop mécanique de ἀποδίδοι.
