  text: διὸ μὴ διψυχῶμεν, μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
translation:
  language: fr
  text: Ne soyons donc pas partagés[a], et que notre âme ne doute pas de ses dons extraordinaires et glorieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne soyons pas doubles d’âme ».'
    reason: La note restitue exactement l’image exprimée par le verbe grec διψυχῶμεν, tout en expliquant la traduction idiomatique « partagés ».
lexical_decisions:
- source_word: διψυχῶμεν
  choice: soyons… partagés
  rationale: Le verbe évoque un esprit partagé ou irrésolu. « Être partagés » conserve cette image tout en restant naturel en français.
- source_word: ἐνδυλλιεσθω
  choice: doute
  rationale: La forme transmise est orthographiquement instable et correspond vraisemblablement à un verbe signifiant hésiter ou douter. « Doute » exprime ici clairement l’incertitude à l’égard des dons de Dieu sans répéter simplement « partagés ».
- source_word: ὑπερβαλλούσαις
  choice: extraordinaires
  rationale: Le participe qualifie ce qui dépasse la mesure ordinaire. « Extraordinaires » communique naturellement cette supériorité en français moderne.
- source_word: δωρεαῖς αὐτοῦ
  choice: dons… qu’il nous accorde
  rationale: Cette formulation idiomatique rend la possession exprimée par αὐτοῦ et explicite la notion de dons accordés, sans modifier le référent divin fourni par le contexte.
theological_decisions:
- issue: Rapport entre l’esprit partagé et le doute
  choice: 'Maintenir deux expressions distinctes : « partagés » puis « doute »'
  alternative: Rendre les deux membres par des formulations synonymes autour de la division intérieure
  rationale: Le grec emploie deux verbes distincts. La traduction préserve la progression de l’irrésolution intérieure vers le doute concernant les dons divins, sans réduire le second membre à une simple répétition.
translation_notes:
  register: Français international moderne, digne et accessible. La construction collective « notre âme » est conservée pour respecter le singulier grec et la dimension communautaire de l’exhortation.
