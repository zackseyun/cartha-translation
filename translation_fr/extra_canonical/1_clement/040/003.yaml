id: 1CLEM.40.3
reference: 1 Clement 40:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
translation:
  language: fr
  text: Il a lui-même déterminé, par sa volonté souveraine, où et par qui il veut qu’elles soient accomplies, afin que toutes choses, accomplies saintement, soient agréables à sa volonté, selon son bon plaisir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « afin que toutes choses, accomplies saintement et selon son bon plaisir, soient agréables à sa volonté ».'
    reason: Le groupe ἐν εὐδοκήσει peut se rattacher soit à « soient agréables », soit à « accomplies ».
lexical_decisions:
- source_word: ἐπιτελεῖσθαι
  choice: soient accomplies
  rationale: Le passif « soient accomplies » conserve le sens d’une exécution menée à son terme et reprend naturellement les actes cultuels évoqués dans le contexte.
- source_word: ὑπερτάτῃ ... βουλήσει
  choice: par sa volonté souveraine
  rationale: « Souveraine » exprime ici le superlatif ὑπερτάτῃ dans un français naturel et digne; « volonté » rend βούλησις sans introduire une notion doctrinale étrangère.
- source_word: ὁσίως
  choice: saintement
  rationale: L’adverbe garde la valeur cultuelle et morale de ὁσίως tout en restant concis.
- source_word: εὐπρόσδεκτα
  choice: agréables
  rationale: Ce terme exprime ce qui est favorablement reçu ou agréé; la formulation conserve la construction inhabituelle avec « à sa volonté ».
- source_word: ἐν εὐδοκήσει
  choice: selon son bon plaisir
  rationale: Cette expression française rend la faveur ou le bon vouloir impliqué par εὐδοκία et se rattache ici à l’acceptabilité de toutes choses.
theological_decisions:
- issue: Rapport entre εὐπρόσδεκτα et τῷ θελήματι αὐτοῦ
  choice: « agréables à sa volonté »
  alternative: « agréées conformément à sa volonté »
  rationale: La formulation choisie préserve la personnification et la tension du grec, où les choses sont dites acceptables « à sa volonté », plutôt que de transformer le datif en simple conformité.
- issue: Rattachement de ἐν εὐδοκήσει
  choice: 'à εὐπρόσδεκτα εἴη : « soient agréables ... selon son bon plaisir »'
  alternative: 'à γινόμενα : « accomplies saintement et selon son bon plaisir »'
  rationale: La syntaxe permet une hésitation. Le texte principal suit le rattachement qui évite de coordonner artificiellement l’adverbe ὁσίως et le groupe prépositionnel, tandis que la note conserve l’autre lecture plausible.
translation_notes:
  register: Français moderne, international et digne. L’ordre de la phrase a été légèrement réorganisé pour éviter une ouverture suspendue (« où et par qui… »), sans modifier les relations syntaxiques. Le pronom féminin pluriel « elles » reprend les réalités cultuelles du contexte antérieur.
