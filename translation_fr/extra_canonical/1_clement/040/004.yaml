id: 1CLEM.40.4
reference: 1 Clement 40:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
translation:
  language: fr
  text: Ainsi, ceux qui présentent leurs offrandes aux moments fixés sont agréés et bienheureux ; car, en suivant les ordonnances du Maître, ils ne s’égarent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προστεταγμένοις καιροῖς
  choice: aux moments fixés
  rationale: Le participe parfait passif indique des moments déterminés à l’avance. « Aux moments fixés » est précis, naturel et évite toute redondance.
- source_word: προσφορὰς
  choice: offrandes
  rationale: Dans ce contexte cultuel, « offrandes » rend directement le sens de dons présentés selon un ordre établi.
- source_word: εὐπρόσδεκτοι
  choice: agréés
  rationale: Le terme désigne ceux qui sont reçus favorablement ou jugés acceptables. « Agréés » conserve cette nuance dans un registre religieux digne.
- source_word: μακάριοι
  choice: bienheureux
  rationale: « Bienheureux » exprime le bonheur accordé ou reconnu, avec la portée religieuse habituelle du grec μακάριος.
- source_word: νομίμοις
  choice: prescriptions
  rationale: Employé substantivement, le terme renvoie aux règles ou ordonnances établies. « Prescriptions » convient au contexte d’un ordre cultuel.
- source_word: δεσπότου
  choice: Maître
  rationale: « Maître » rend le titre d’autorité sans durcir indûment le terme en « souverain » ni expliciter une identification laissée implicite.
- source_word: οὐ διαμαρτάνουσιν
  choice: ils ne s’égarent pas
  rationale: Le verbe indique le fait de manquer le but, de se tromper ou de dévier. « Ne s’égarent pas » préserve cette image sans réduire le sens à une simple faute procédurale.
theological_decisions:
- issue: Référent implicite de l’agrément
  choice: Ne pas ajouter « par Dieu » après « agréés »
  alternative: « sont agréés par Dieu »
  rationale: Le grec ne nomme pas explicitement celui qui accueille favorablement. Le contexte permet de le comprendre, mais la traduction conserve l’implicite du texte.
- issue: Portée de τὰ νόμιμα
  choice: « les prescriptions du Maître »
  alternative: « les lois du Seigneur »
  rationale: Le passage vise des dispositions normatives, notamment cultuelles, sans exiger le vocabulaire plus général de la Loi. « Maître » distingue aussi δεσπότης de κύριος.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du raisonnement grec tout en étant fluide. Le point-virgule conserve le lien explicatif entre l’agrément des offrants et leur fidélité aux prescriptions.
