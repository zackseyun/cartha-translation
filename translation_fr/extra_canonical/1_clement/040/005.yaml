id: 1CLEM.40.5
reference: 1 Clement 40:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
translation:
  language: fr
  text: En effet, ses fonctions propres ont été confiées au grand prêtre, leur place propre a été assignée aux prêtres, et leurs services propres incombent aux lévites ; le laïc est tenu d’observer les prescriptions propres aux laïcs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργίαι
  choice: fonctions
  rationale: Dans ce contexte cultuel, le terme désigne les fonctions officielles confiées au grand prêtre. « Fonctions » est naturel en français et évite de confondre ce mot avec διακονίαι dans la proposition suivante.
- source_word: τόπος
  choice: place
  rationale: Conserve le sens concret ou institutionnel du grec sans préciser indûment s’il s’agit d’un emplacement matériel ou d’un rang déterminé.
- source_word: διακονίαι
  choice: services
  rationale: Rend les tâches de service imposées aux lévites tout en maintenant une distinction lexicale avec λειτουργίαι.
- source_word: λαϊκὸς ἄνθρωπος
  choice: le laïc
  rationale: Expression française courante et digne pour désigner celui qui n’appartient pas aux catégories sacerdotales énumérées.
- source_word: προστάγμασιν
  choice: prescriptions
  rationale: Exprime des règles ou ordonnances contraignantes, conformément à δέδεται, sans surcharger le texte d’une terminologie juridique.
theological_decisions:
- issue: Nature de la « place » assignée aux prêtres
  choice: Maintien du terme général « place »
  alternative: « fonction » ou « rang »
  rationale: Le grec τόπος peut évoquer un emplacement ou une position institutionnelle ; la traduction ne tranche pas cette ambiguïté.
- issue: Portée de λαϊκός
  choice: « le laïc » et « propres aux laïcs »
  alternative: « l’homme du peuple » et « prescriptions du peuple »
  rationale: Le contexte oppose explicitement le grand prêtre, les prêtres, les lévites et la personne laïque. La formulation retenue reflète cette organisation sans importer une définition confessionnelle ultérieure.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La structure parallèle du grec est conservée, avec une variation verbale naturelle : « confiées », « assignée », « incombent ». Le pluriel « particulières » rend ἴδιαι comme des attributions propres à chaque catégorie.'
