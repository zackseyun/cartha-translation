  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
translation:
  language: fr
  text: Il a ordonné que les offrandes et les services soient accomplis, et qu’ils n’aient lieu ni au hasard ni dans le désordre, mais à des moments et à des heures fixés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφοράς
  choice: offrandes
  rationale: Rend directement le terme cultuel désignant ce qui est présenté ou offert.
- source_word: λειτουργίας
  choice: services
  rationale: Dans ce contexte cultuel, « services » exprime les fonctions ou actes liturgiques sans imposer un vocabulaire confessionnel plus technique.
- source_word: ἐπιτελεῖσθαι
  choice: soient accomplis
  rationale: Conserve l’idée d’exécuter ou de mener à bien les actes prescrits.
- source_word: εἰκῇ
  choice: au hasard
  rationale: Exprime l’absence de dessein ou de moment fixé, en contraste direct avec les temps déterminés.
- source_word: ἀτάκτως
  choice: sans ordre
  rationale: Reproduit clairement le sens adverbial d’une exécution dépourvue d’ordre.
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  choice: à des moments et à des heures déterminés
  rationale: Préserve les deux termes temporels et l’idée qu’ils ont été fixés.
theological_decisions:
- issue: Portée cultuelle de λειτουργίας
  choice: services
  alternative: fonctions liturgiques
  rationale: « Services » reste naturel et suffisamment large, tout en évitant de préciser plus que le grec la forme institutionnelle de ces actes.
- issue: Sujet implicite de ἐκέλευσεν
  choice: Il
  alternative: Dieu
  rationale: Le sujet est implicite dans le fragment fourni; le pronom maintient le lien contextuel sans explicitation théologique ajoutée.
translation_notes:
  register: Français moderne, digne et accessible. Construction légèrement formelle adaptée à un texte ecclésial ancien; parallélisme conservé entre « au hasard » et « sans ordre », puis « moments » et « heures ».
