id: 1CLEM.40.1
reference: 1 Clement 40:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
translation:
  language: fr
  text: Ainsi donc, puisque ces choses nous sont évidentes et que nous avons plongé nos regards dans les profondeurs de la connaissance divine, nous devons accomplir de manière ordonnée tout ce que le Maître a ordonné d’accomplir aux temps fixés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων
  choice: évidentes
  rationale: Le terme désigne ce qui est manifeste ou clairement connu; « évidentes » convient naturellement au contexte.
- source_word: ἐγκεχυφότες
  choice: avons plongé nos regards
  rationale: Le participe évoque le fait de se pencher attentivement pour regarder au-dedans; cette expression conserve l’image sans lourdeur.
- source_word: βάθη τῆς θείας γνώσεως
  choice: profondeurs de la connaissance divine
  rationale: Traduction directe qui préserve la métaphore et l’ambiguïté de « divine », connaissance venant de Dieu ou relative à Dieu.
- source_word: τάξει
  choice: avec ordre
  rationale: 'Datif de manière: l’expression indique que les actes doivent être accomplis d’une manière ordonnée, non une proposition de but.'
- source_word: δεσπότης
  choice: Maître
  rationale: Rend l’autorité souveraine du terme grec dans un registre religieux naturel, sans la dureté moderne de « despote ».
- source_word: κατὰ καιροὺς τεταγμένους
  choice: aux temps fixés
  rationale: Conserve l’idée de moments déterminés ou assignés, plutôt que celle d’une simple chronologie.
theological_decisions:
- issue: Référent de « la connaissance divine »
  choice: Maintenir la formulation « connaissance divine »
  alternative: « connaissance de Dieu »
  rationale: Le génitif grec et l’adjectif θείας permettent une nuance relative à Dieu ou provenant de lui; la traduction retenue ne tranche pas inutilement.
- issue: Portée de l’ordre prescrit
  choice: « accomplir avec ordre tout ce que le Maître a commandé »
  alternative: « accomplir tout, dans l’ordre que le Maître a commandé »
  rationale: τάξει décrit vraisemblablement la manière d’agir, tandis que la relative porte sur πάντα; cette construction évite de faire du Maître celui qui aurait prescrit un ordre séquentiel précis non explicitement formulé.
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde la structure argumentative du grec tout en évitant un calque pesant. Aucun marqueur de note n’est nécessaire.
