  to: Ainsi donc, puisque ces choses nous sont évidentes et que nous avons plongé nos regards dans les profondeurs de la connaissance divine, nous devons accomplir de manière ordonnée tout ce que le Maître a ordonné d’accomplir aux temps fixés.
