source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμέρας, βλεπόντων πάντων, ἐπιπτὰς ἐπὶ τὸν τοῦ ἡλίου βωμὸν τίθησιν αὐτὰ καὶ οὕτως εἰς τοὐπίσω ἀφορμᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/004.yaml
  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
translation:
  language: fr
  text: Et, en plein jour, sous les yeux de tous, il vient se poser sur l’autel du soleil, les y dépose, puis reprend le chemin du retour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας
  choice: en plein jour
  rationale: Le génitif exprime ici le moment où l’action a lieu. « En plein jour » est naturel en français et souligne que la scène se déroule publiquement, sous les yeux de tous.
- source_word: ἐπιπτὰς
  choice: vient se poser sur
  rationale: Le participe décrit l’oiseau qui descend en volant sur l’autel. Cette formulation convient au contexte sans suggérer une attaque, comme pourrait le faire « fond sur ».
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  choice: reprend le chemin du retour
  rationale: L’expression indique qu’il repart en sens inverse. La traduction restitue naturellement le mouvement de retour sans préciser une destination absente du grec.
