id: 1CLEM.25.3
reference: 1 Clement 25:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
translation:
  language: fr
  text: Mais tandis que sa chair se décompose, un certain ver naît qui, nourri de l’humidité de l’animal mort, développe des ailes. Puis, devenu vigoureux, il soulève ce réceptacle[a], où se trouvent les os de son prédécesseur. Portant ceux-ci, il va de l’Arabie jusqu’en Égypte, dans la ville appelée Héliopolis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette enceinte »; dans ce contexte, le mot grec peut désigner le contenant des os, parfois compris comme un nid.
    reason: 'Le sens contextuel de σηκός est incertain: son sens courant est celui d’un espace clos ou d’une enceinte, tandis que le récit du phénix invite certains à y voir son nid.'
lexical_decisions:
- source_word: σηπομένης
  choice: se décompose
  rationale: Le participe au génitif absolu décrit la décomposition progressive de la chair; cette formulation est naturelle et précise en français moderne.
- source_word: σκώληξ τις
  choice: un certain ver
  rationale: « Ver » rend le terme grec sans lui imposer une identification zoologique moderne; « certain » conserve l’indéfini τις.
- source_word: ἰκμάδος
  choice: l’humidité
  rationale: Le mot désigne ici le liquide ou l’humidité provenant du corps mort; « humidité » préserve cette largeur de sens.
- source_word: πτεροφυεῖ
  choice: développe des ailes
  rationale: Le verbe indique la croissance ou l’apparition d’ailes; la traduction évite une tournure artificielle tout en gardant l’image.
- source_word: γενναῖος
  choice: vigoureux
  rationale: Dans ce contexte de croissance, le terme exprime la force ou la pleine vigueur plutôt que la noblesse morale.
- source_word: σηκόν
  choice: réceptacle
  rationale: Le terme désigne fondamentalement un espace clos ou une enceinte; dans ce récit, il s’agit de ce qui contient les os. « Réceptacle » reste volontairement neutre, contrairement à « nid », qui est plus interprétatif.
- source_word: τοῦ προγεγονότος
  choice: de son prédécesseur
  rationale: L’expression désigne celui qui a existé auparavant, c’est-à-dire l’oiseau précédent; « prédécesseur » le rend avec concision.
- source_word: διανύει
  choice: il va
  rationale: Le verbe signifie accomplir ou parcourir une distance. Avec le trajet explicitement indiqué, « va de… jusqu’à… » est idiomatique sans perdre l’idée du parcours.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe relative du grec est conservée (« un certain ver… qui »), et le récit est présenté sans chercher à harmoniser ses détails avec des connaissances zoologiques modernes.
