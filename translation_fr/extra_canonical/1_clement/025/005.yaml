  yaml_path: translation/extra_canonical/1_clement/025/005.yaml
  text: So then the priests inspect the records of the times[a], and they find that it came when the five-hundredth year was completed.
translation:
  language: fr
  text: Les prêtres examinent donc les registres chronologiques et constatent qu’il est arrivé à l’achèvement de la cinq-centième année.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισκέπτονται
  choice: examinent
  rationale: Exprime une consultation attentive des documents, plutôt qu’un simple regard.
- source_word: τὰς ἀναγραφὰς τῶν χρόνων
  choice: les registres chronologiques
  rationale: Rend naturellement l’idée de relevés écrits permettant d’établir la chronologie.
- source_word: ἐληλυθέναι
  choice: qu’il est arrivé
  rationale: Le parfait infinitif, dans le discours indirect après « constatent », désigne l’arrivée déjà accomplie du référent masculin.
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  choice: à l’achèvement de la cinq-centième année
  rationale: Rend avec fluidité le génitif absolu et l’idée que cette année était parvenue à son terme.
