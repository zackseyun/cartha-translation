  to: Il existe en effet un oiseau appelé phénix. Unique en son genre, il vit cinq cents ans. Lorsqu’il approche déjà du moment de sa mort[a], il se construit un nid d’encens, de myrrhe et d’autres aromates. Quand le temps est accompli, il y entre et meurt.
