  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
translation:
  language: fr
  text: Il existe en effet un oiseau appelé phénix. Unique en son genre, il vit cinq cents ans. Lorsqu’il approche déjà du moment de sa mort[a], il se construit un nid d’encens, de myrrhe et d’autres aromates. Quand le temps est accompli, il y entre et meurt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression associe l’idée de délivrance ou de départ à celle de mourir.
    reason: La note conserve la nuance inhabituelle de ἀπόλυσις tout en laissant le texte principal exprimer clairement l’approche de la mort.
lexical_decisions:
- source_word: ὄρνεον
  choice: oiseau
  rationale: Équivalent français direct et naturel.
- source_word: προσονομάζεται φοῖνιξ
  choice: appelé phénix
  rationale: Rend simplement l’idée qu’on lui donne le nom de phénix.
- source_word: μονογενές
  choice: unique en son genre
  rationale: Dans ce contexte, le terme indique que l’oiseau est le seul de son espèce, plutôt qu’un lien de filiation.
- source_word: σηκόν
  choice: nid
  rationale: Le mot peut désigner un enclos ou un réceptacle; dans la tradition du phénix, « nid » est naturel tout en convenant à l’objet fait d’aromates.
- source_word: λίβανος
  choice: encens
  rationale: Désigne ici la résine aromatique, couramment appelée « encens » en français.
- source_word: τελευτᾷ
  choice: meurt
  rationale: Dans ce contexte, le verbe signifie arriver au terme de sa vie.
theological_decisions:
- issue: ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό
  choice: du moment où la mort le délivrera
  alternative: du moment de sa mort
  rationale: La formulation conserve à la fois la référence explicite à la mort et la nuance de délivrance ou de départ portée par ἀπόλυσις, sans imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. Syntaxe fluide, avec maintien de la progression temporelle et de la tension lexicale entre délivrance et mort.
