  text: Why are there quarrels and anger and divisions and schisms and even war among you?
translation:
  language: fr
  text: Pourquoi y a-t-il parmi vous des querelles, des colères, des dissensions, des divisions et la guerre ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρεις
  choice: querelles
  rationale: Rend naturellement le pluriel désignant des conflits et disputes au sein de la communauté.
- source_word: θυμοὶ
  choice: colères
  rationale: Conserve le pluriel grec et son sens direct de mouvements de colère, sans préciser indûment qu’il s’agit nécessairement d’explosions de colère.
- source_word: διχοστασίαι
  choice: dissensions
  rationale: Exprime les désaccords qui opposent des groupes ou des personnes, tout en restant distinct de σχίσματα.
- source_word: σχίσματα
  choice: divisions
  rationale: Rend l’idée de ruptures ou de fractures communautaires dans un français courant et digne.
- source_word: πόλεμός τε
  choice: et même la guerre
  rationale: « Guerre » conserve la force de πόλεμος; « même » fait ressortir le dernier élément culminant de l’énumération, comme le τε peut le suggérer ici.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Formulation idiomatique pour des conflits présents au sein de la communauté.
