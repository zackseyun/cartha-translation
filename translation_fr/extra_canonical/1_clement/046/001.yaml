source:
  edition: Funk 1901 (normalized OCR)
  text: Τοιούτοις οὖν ὑποδείγμασιν κολληθῆναι καὶ ἡμᾶς δεῖ, ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/001.yaml
  text: Therefore, brothers, we too must attach ourselves to such examples.
translation:
  language: fr
  text: Nous aussi, frères et sœurs,[a] nous devons donc nous attacher à de tels exemples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : frères.'
    reason: Signale la forme littérale du terme grec derrière la formulation inclusive du texte.
lexical_decisions:
- source_word: Τοιούτοις … ὑποδείγμασιν
  choice: à de tels exemples
  rationale: Rend directement le datif pluriel et conserve la valeur exemplaire des modèles évoqués dans le contexte.
- source_word: κολληθῆναι
  choice: nous attacher
  rationale: Le verbe exprime l’idée d’adhérer étroitement ou de se lier; «nous attacher» est naturel en français tout en préservant cette force.
- source_word: καὶ ἡμᾶς
  choice: Nous aussi
  rationale: Met en relief l’inclusion des destinataires, conformément à la place et à la fonction de καί.
- source_word: δεῖ
  choice: nous devons
  rationale: Exprime clairement la nécessité indiquée par l’impersonnel grec.
theological_decisions:
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Dans l’adresse communautaire, le masculin pluriel grec peut inclure l’ensemble des croyants; la formulation inclusive communique cette portée en français moderne sans modifier le référent.
translation_notes:
  register: Français moderne, sobre et digne. L’ordre «Nous aussi … donc» conserve l’accent grec sur l’inclusion des destinataires, tandis que «s’attacher à» maintient l’image d’une adhésion étroite.
