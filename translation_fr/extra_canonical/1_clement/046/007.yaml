source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
translation:
  language: fr
  text: 'Pourquoi tirons-nous de tous côtés et déchirons-nous les membres du Messie, nous révoltons-nous contre notre propre corps et en arrivons-nous à un tel degré de folie que nous oublions que nous sommes membres les uns des autres ?


    Souvenez-vous des paroles de Jésus, notre Seigneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλκωμεν καὶ διασπῶμεν
  choice: tiraillons-nous et déchirons-nous
  rationale: Le premier verbe exprime l’action de tirer en sens opposés ou de disloquer, tandis que le second renforce l’image par l’idée de déchirer. Cette paire française conserve la progression et la violence de la métaphore corporelle.
- source_word: τὰ μέλη
  choice: les membres
  rationale: « Membres » garde à la fois le sens anatomique et le sens communautaire repris à la fin du verset.
- source_word: στασιάζομεν
  choice: nous révoltons-nous
  rationale: Le verbe évoque la dissension active, la rébellion ou la sédition ; « se révolter contre » convient au complément πρὸς et maintient la gravité du propos.
- source_word: ἀπόνοιαν
  choice: folie
  rationale: Dans ce contexte, le mot désigne une perte extrême de bon sens ou de jugement. « Folie » est naturel, fort et digne en français.
- source_word: μνήσθητε
  choice: Souvenez-vous
  rationale: L’impératif aoriste appelle directement les destinataires à se rappeler les paroles citées ou connues de Jésus.
theological_decisions:
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός signifie « oint » et fonctionne ici comme un titre reconnu. « Le Messie » en conserve explicitement la portée messianique sans imposer une lecture confessionnelle supplémentaire.
- issue: Métaphore du corps collectif
  choice: notre propre corps / membres les uns des autres
  alternative: le corps qui est le nôtre / membres les uns des autres
  rationale: La traduction conserve sans l’expliquer la tension entre « les membres du Messie », « notre propre corps » et l’appartenance mutuelle.
translation_notes:
  register: Français international moderne, direct et solennel. Les questions successives ont été légèrement segmentées pour une lecture naturelle, sans atténuer l’accumulation rhétorique du grec. La répétition de « membres » préserve le lien structurant de la métaphore.
