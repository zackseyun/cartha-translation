  text: κολληθῶμεν οὖν τοῖς ἀθῴοις καὶ δικαίοις· εἰσὶν δὲ οὗτοι ἐκλεκτοὶ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/004.yaml
  text: Let us therefore join ourselves to the innocent and righteous[a], for these are God’s chosen ones.
translation:
  language: fr
  text: 'Attachons-nous donc aux innocents et aux justes[a] : ce sont eux que Dieu a choisis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ce sont eux que Dieu a choisis ».'
    reason: Le grec δὲ peut marquer ici une simple transition ou coordination aussi bien qu’une précision explicative.
lexical_decisions:
- source_word: κολληθῶμεν
  choice: Attachons-nous
  rationale: Le subjonctif exhortatif appelle la communauté à s’unir étroitement à ces personnes. « Attachons-nous » est naturel en français et conserve l’idée d’adhésion exprimée par le verbe grec.
- source_word: τοῖς ἀθῴοις καὶ δικαίοις
  choice: aux innocents et aux justes
  rationale: Les adjectifs substantivés désignent des personnes. Cette formulation rend directement les deux qualités sans les confondre.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: ce sont eux que Dieu a choisis
  rationale: Cette tournure française exprime clairement l’élection divine tout en évitant la raideur possible de « les élus de Dieu ».
theological_decisions:
- issue: Sens de l’élection dans ἐκλεκτοὶ τοῦ θεοῦ
  choice: ce sont eux que Dieu a choisis
  alternative: ce sont les élus de Dieu
  rationale: La traduction conserve l’affirmation que le choix vient de Dieu, sans préciser ici la nature, le moment ou la portée théologique de cette élection.
- issue: Lien logique introduit par δὲ
  choice: deux-points à valeur explicative
  alternative: « et ce sont eux que Dieu a choisis »
  rationale: Dans ce contexte, δὲ introduit une identification ou une précision. Les deux-points donnent un français fluide sans exclure la valeur simplement connective du grec, signalée en note.
translation_notes:
  register: Français international moderne, sobre et exhortatif. La formulation reste proche de la structure grecque tout en évitant une expression artificielle ou excessivement technique.
