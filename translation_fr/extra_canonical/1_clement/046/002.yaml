id: 1CLEM.46.2
reference: 1 Clement 46:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Κολλᾶσθε τοῖς ἁγίοις, ὅτι οἱ κολλώμενοι αὐτοῖς ἁγιασθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/002.yaml
  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: fr
  text: 'Car il est écrit : « Attachez-vous aux saints, car ceux qui s’attachent à eux seront sanctifiés. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολλᾶσθε / κολλώμενοι
  choice: Attachez-vous / ceux qui s’attachent
  rationale: Le verbe κολλάω exprime ici une union étroite ou un attachement durable. Cette formulation naturelle en français conserve la répétition du grec et convient à la relation avec des personnes.
- source_word: τοῖς ἁγίοις
  choice: aux saints
  rationale: Le pluriel substantivé désigne des personnes saintes ou consacrées. « Les saints » est une expression française claire et traditionnelle, sans préciser davantage leur identité.
- source_word: ἁγιασθήσονται
  choice: seront sanctifiés
  rationale: Le futur passif est rendu directement, en préservant l’idée que la sanctification est reçue plutôt que produite par les personnes elles-mêmes.
theological_decisions:
- issue: Identité et portée de « ceux qui sont saints »
  choice: les saints
  alternative: les personnes saintes
  rationale: Le texte ne précise ni un groupe institutionnel ni une catégorie particulière. La traduction conserve donc la désignation générale et son ambiguïté.
- issue: Rapport entre l’attachement aux saints et la sanctification
  choice: car ceux qui s’attachent à eux seront sanctifiés
  alternative: parce que ceux qui restent unis à eux deviendront saints
  rationale: La formulation maintient le lien affirmé par le texte sans expliquer son mécanisme ni importer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition verbale et le parallélisme de la phrase grecque sont conservés. Aucun marqueur de note n’est requis.
