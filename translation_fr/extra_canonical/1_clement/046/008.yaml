source:
  edition: Funk 1901 (normalized OCR)
  text: εἶπεν γάρ· Οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ· καλὸν ἦν αὐτῷ, εἰ οὐκ ἐγεννήθη, ἢ ἕνα τῶν ἐκλεκτῶν μου σκανδαλίσαι· κρεῖττον ἦν αὐτῷ περιτεθῆναι μύλον καὶ καταποντισθῆναι εἰς τὴν θάλασσαν, ἢ ἕνα τῶν ἐκλεκτῶν μου διαστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
translation:
  language: fr
  text: 'Car il a dit : « Malheur à cet homme ! Il aurait mieux valu pour lui ne pas être né que de faire tomber un seul de mes élus. Il aurait mieux valu pour lui qu’on lui attache une meule au cou et qu’il soit englouti dans la mer plutôt que d’égarer un seul de mes élus. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκανδαλίσαι
  choice: faire tomber
  rationale: Rend naturellement l’idée de provoquer la chute de quelqu’un, tout en conservant la portée morale du verbe grec.
- source_word: ἐκλεκτῶν
  choice: élus
  rationale: Équivalent français direct de « choisis », consacré mais encore clair dans ce contexte religieux.
- source_word: μύλον
  choice: meule
  rationale: Le terme grec désigne une meule; le contexte implique qu’elle est placée autour du cou de la personne.
- source_word: καταποντισθῆναι
  choice: être précipité dans la mer
  rationale: Exprime le fait d’être englouti par immersion, dans une tournure française naturelle et énergique.
- source_word: διαστρέψαι
  choice: égarer
  rationale: Préserve la distinction avec σκανδαλίσαι et traduit ici l’idée de détourner quelqu’un de la bonne voie.
theological_decisions:
- issue: Identité des « élus »
  choice: Conserver « mes élus » sans explicitation
  alternative: Préciser qu’il s’agit des croyants ou des disciples
  rationale: Le texte grec ne définit pas davantage ce groupe; l’expliciter résoudrait indûment une ambiguïté théologique.
- issue: Relation comparative après « ne pas être né »
  choice: Employer « mieux valu… que de »
  alternative: Traduire littéralement « il aurait été bon pour lui, s’il n’était pas né, plutôt que de »
  rationale: La formulation retenue restitue clairement en français la comparaison elliptique du grec sans en modifier le sens.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « Il aurait mieux valu pour lui » est conservée afin de refléter l’insistance du texte grec; « faire tomber » et « égarer » maintiennent la différence entre les deux verbes sources.
