id: 1CLEM.46.6
reference: 1 Clement 46:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
translation:
  language: fr
  text: Ou bien n’avons-nous pas un seul Dieu, un seul Messie, un seul Esprit de grâce répandu sur nous, et un seul appel dans le Messie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec passe ici au nominatif : littéralement, « et un seul appel dans le Messie ». Il peut s’agir d’une rupture de construction dans cette énumération.'
    reason: Préserver la particularité syntaxique et l’ambiguïté de la dernière proposition sans alourdir le texte principal.
lexical_decisions:
- source_word: Χριστός
  choice: Messie
  rationale: Rend le titre grec par sa valeur messianique plutôt que par sa simple translittération traditionnelle.
- source_word: πνεῦμα τῆς χάριτος
  choice: Esprit de grâce
  rationale: Conserve le rapport génitif du grec et sa densité théologique sans le préciser abusivement.
- source_word: ἐκχυθέν ἐφ’ ἡμᾶς
  choice: répandu sur nous
  rationale: Reproduit naturellement en français l’image du déversement exprimée par le participe grec.
- source_word: κλῆσις
  choice: appel
  rationale: Terme français courant qui garde ici le sens de vocation ou d’appel reçu.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Préserve la formulation relationnelle et sphérique de ἐν sans la réduire à « par ».
theological_decisions:
- issue: Identification de πνεῦμα comme l’Esprit divin
  choice: Majuscule à « Esprit »
  alternative: « esprit de grâce » avec une minuscule
  rationale: Le parallélisme avec l’unique Dieu et l’unique Messie, ainsi que l’image de l’Esprit répandu sur les croyants, favorisent la référence à l’Esprit divin, sans ajouter de formulation doctrinale au texte.
- issue: Rupture syntaxique devant μία κλῆσις
  choice: Intégrer « un seul appel » à l’énumération française et signaler la forme grecque en note
  alternative: Créer une nouvelle proposition telle que « et n’y a-t-il pas un seul appel… ? »
  rationale: Le grec passe de compléments à l’accusatif au nominatif μία κλῆσις, probablement dans une continuation rhétorique anacoluthique. Une nouvelle proposition explicite surinterpréterait la rupture.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « un seul » conserve l’insistance rhétorique du grec. « Ou bien » relie naturellement la question à son contexte antérieur.
