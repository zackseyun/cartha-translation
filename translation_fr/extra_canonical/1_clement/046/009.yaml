id: 1CLEM.46.9
reference: 1 Clement 46:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σχίσμα ὑμῶν πολλοὺς διέστρεψεν, πολλοὺς εἰς ἀθυμίαν ἔβαλεν, πολλοὺς εἰς δισταγμόν, τοὺς πάντας ἡμᾶς εἰς λύπην· καὶ ἐπίμονος ὑμῶν ἐστὶν ἡ στάσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: fr
  text: Votre division a détourné beaucoup de personnes, en a plongé beaucoup dans le découragement, beaucoup dans le doute, et nous tous dans la tristesse ; et votre dissension persiste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: division
  rationale: Rend l’idée d’une rupture au sein de la communauté dans un français naturel, sans limiter le terme à son sens ecclésiastique plus tardif de « schisme ».
- source_word: διέστρεψεν
  choice: a détourné
  rationale: Conserve l’idée que plusieurs ont été écartés ou dévoyés, tout en laissant implicite, comme en grec, ce dont ils ont été détournés.
- source_word: ἀθυμίαν
  choice: découragement
  rationale: Exprime l’abattement et la perte de courage indiqués par le terme grec.
- source_word: δισταγμόν
  choice: doute
  rationale: Rend simplement l’hésitation intérieure ou l’incertitude du grec.
- source_word: στάσις
  choice: querelles
  rationale: Dans ce contexte communautaire, désigne les dissensions et conflits de parti ; « querelles » est clair et idiomatique.
- source_word: ἐπίμονος
  choice: persistent
  rationale: Traduit la durée obstinée de la dissension sans ajouter un adverbe absent du grec.
theological_decisions:
- issue: Nature de la rupture communautaire
  choice: « division » pour σχίσμα et « querelles » pour στάσις
  alternative: « schisme » et « lutte factieuse »
  rationale: Le texte distingue la rupture produite de la dissension qui perdure. Les choix retenus préservent cette distinction sans importer un sens institutionnel ou confessionnel plus tardif.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « beaucoup » est maintenue afin de reproduire l’insistance rhétorique du grec, tandis que « en a plongé » évite une lourde répétition verbale.
