    reason: Le dernier verbe actif est employé sans complément exprimé. La traduction idiomatique rend sa valeur dans le parallélisme sans en fournir un.
  revision_rationale: La révision remplace une formulation française qui suggérait surtout la ruse et une qualité réfléchie par une formulation qui conserve l’image de torsion et le caractère actif, tout en restant idiomatique. Elle rend aussi plus explicitement ἐν ἑτέρῳ τόπῳ (« dans un autre passage »).
