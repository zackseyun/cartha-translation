revisions:
- from: 'Et ailleurs encore, il dit : « Avec un homme innocent, tu seras innocent ; avec un homme choisi, tu seras choisi ; et avec un homme retors, tu te montreras retors[a]. »'
  to: 'Et encore, dans un autre passage, il dit : « Avec un homme innocent, tu seras innocent ; avec un homme choisi, tu seras choisi ; et avec un homme tortueux, tu agiras de manière tortueuse[a]. »'
  rationale: La révision remplace une formulation française qui suggérait surtout la ruse et une qualité réfléchie par une formulation qui conserve l’image de torsion et le caractère actif, tout en restant idiomatique. Elle rend aussi plus explicitement ἐν ἑτέρῳ τόπῳ (« dans un autre passage »).
