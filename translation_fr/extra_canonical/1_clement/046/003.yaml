review_pass:
  verdict: revise
  source_fidelity: La structure proverbiale et les trois groupes humains sont bien rendus. Toutefois, στρεβλός désigne plus directement ce qui est tordu, déviant ou pervers que « retors », terme français qui évoque plus spécialement une ruse habile. Le verbe actif διαστρέψεις, sans complément exprimé, se rend plus sûrement par une conduite « de manière tortueuse » que par le réfléchi « tu te montreras retors ».
  naturalness: « Et encore, dans un autre passage, il dit » suit naturellement l’introduction grecque. « Un homme tortueux » et « tu agiras de manière tortueuse » constituent un parallélisme clair et moderne, sans donner au dernier verbe un objet absent du grec.
  terminology: « Innocent » conserve adéquatement ἀθῷος. « Choisi » rend ἐκλεκτός de façon générique et maintient la répétition, sans introduire le sens théologique plus marqué que peut parfois avoir « élu ». « Tortueux » préserve le rapprochement lexical entre στρεβλός et διαστρέψεις avec moins de spécialisation sémantique que « retors ».
  issues:
  - severity: medium
    issue: « Retors » / « tu te montreras retors » restreint et infléchit le dernier parallélisme.
    rationale: « Retors » tend à caractériser une personne astucieuse ou rusée, tandis que στρεβλός et διαστρέφω expriment l’idée plus large de torsion, de déviation ou d’action perverse. La forme réfléchie ajoute en outre une nuance copulative qui n’est pas explicitement présente dans le verbe grec actif.
  revised_text: 'Et encore, dans un autre passage, il dit : « Avec un homme innocent, tu seras innocent ; avec un homme choisi, tu seras choisi ; et avec un homme tortueux, tu agiras de manière tortueuse[a]. »'
