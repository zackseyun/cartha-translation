  text: καὶ πάλιν ἐν ἑτέρῳ τόπῳ λέγει· Μετὰ ἀνδρὸς ἀθῴου ἀθῷος ἔσῃ καὶ μετὰ ἐκλεκτοῦ ἐκλεκτὸς ἔσῃ, καὶ μετὰ στρεβλοῦ διαστρέψεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/003.yaml
  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
translation:
  language: fr
  text: 'Et encore, dans un autre passage, il dit : « Avec un homme innocent, tu seras innocent ; avec un homme choisi, tu seras choisi ; et avec un homme tortueux, tu agiras de manière tortueuse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe grec signifie « tu tordras » ou « tu détourneras » ; son complément n’est pas exprimé.
    reason: Le dernier verbe actif est employé sans complément exprimé. La traduction idiomatique rend sa valeur dans le parallélisme sans en fournir un.
lexical_decisions:
- source_word: ἀθῴου / ἀθῷος
  choice: innocent / innocent
  rationale: Conserve la répétition proverbiale du grec et exprime l’idée d’intégrité ou d’absence de faute dans un français courant.
- source_word: ἐκλεκτοῦ / ἐκλεκτός
  choice: choisi / choisi
  rationale: Rend le même lexème dans les deux occurrences tout en évitant qu’« élu » soit compris ici comme un titre théologique précis. L’indéfini respecte la valeur générique de l’adjectif substantivé sans article.
- source_word: στρεβλοῦ / διαστρέψεις
  choice: retors / tu te montreras retors
  rationale: Reproduit autant que possible le jeu de mots entre la personne au caractère dévoyé et la conduite adoptée envers elle. La tournure française rend idiomatiquement le futur grec, dont le complément n’est pas exprimé.
theological_decisions:
- issue: Portée de ἐκλεκτός
  choice: « choisi », au sens générique
  alternative: « élu »
  rationale: Le grec est sans article et s’inscrit dans une série proverbiale de types humains ; le traduire comme un titre défini introduirait une spécification théologique absente du texte.
- issue: Sens de διαστρέψεις
  choice: « tu te montreras retors »
  alternative: « tu agiras de manière tortueuse » ou, plus littéralement, « tu détourneras »
  rationale: Le verbe peut évoquer l’action de tordre, détourner ou agir de façon tortueuse. La traduction conserve la tension du parallélisme sans préciser un objet que le grec laisse inexprimé.
translation_notes:
  register: Français moderne, sobre et proverbial. La répétition des adjectifs est volontaire afin de préserver le parallélisme serré de la citation grecque.
