id: 1CLEM.58.1
reference: 1 Clement 58:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
translation:
  language: fr
  text: Soumettons-nous donc à son nom très saint et glorieux, en fuyant les menaces annoncées précédemment par la Sagesse contre ceux qui refusent d’obéir, afin que nous demeurions, pleins de confiance dans le nom très saint de sa majesté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que nous nous établissions, ayant mis notre confiance dans le nom très saint de sa majesté ».'
    reason: Le verbe κατασκηνόω peut évoquer le fait de s’établir ou de demeurer, et le participe parfait πεποιθότες peut être rendu plus formellement par « ayant mis notre confiance ».
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  choice: Soumettons-nous
  rationale: Rend naturellement l’exhortation au subjonctif aoriste passif, avec sa valeur volontaire et collective.
- source_word: τῷ ... ὀνόματι
  choice: à ... nom
  rationale: Conserve l’objet explicite de la soumission dans le grec, où le « nom » représente la personne et l’autorité divines sans les remplacer dans la traduction.
- source_word: φυγόντες
  choice: en fuyant
  rationale: Préserve le participe circonstanciel et l’idée active de se détourner des menaces annoncées.
- source_word: διὰ τῆς σοφίας
  choice: par la Sagesse
  rationale: Le contexte antérieur personnifie et cite la Sagesse; la majuscule française signale cette personnification sans imposer une identification théologique supplémentaire.
- source_word: τοῖς ἀπειθοῦσιν
  choice: contre ceux qui refusent d’obéir
  rationale: Exprime la désobéissance ou l’insoumission impliquée par ἀπειθέω, plus précisément que le seul adjectif « incrédules ».
- source_word: κατασκηνώσωμεν
  choice: nous demeurions
  rationale: Rend l’idée de s’établir ou de séjourner, sans ajouter la notion de sécurité qui appartient parfois au contexte mais n’est pas lexicalement exprimée par ce verbe seul.
- source_word: πεποιθότες ἐπὶ
  choice: pleins de confiance dans
  rationale: Rend le parfait de πείθω employé dans le sens d’une confiance établie, ainsi que son complément introduit par ἐπί, sans le traduire deux fois.
- source_word: μεγαλωσύνης
  choice: majesté
  rationale: Équivalent français digne et usuel pour la grandeur souveraine de Dieu.
theological_decisions:
- issue: Portée du « nom » divin
  choice: Maintenir littéralement « son nom » comme objet de la soumission et de la confiance
  alternative: Remplacer « son nom » par « Dieu » ou expliciter « son autorité »
  rationale: La répétition de ὄνομα est théologiquement significative dans le texte et doit être conservée sans paraphrase réductrice.
- issue: Identification de la Sagesse
  choice: Employer « la Sagesse » sans autre identification
  alternative: Identifier explicitement la Sagesse au Christ ou à une simple qualité divine
  rationale: Le grec permet la personnification dans le contexte, mais ce verset n’en précise pas davantage l’identité; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase longue et exhortative du grec est conservée, tout en employant des articulations naturelles. La répétition de « nom » et les superlatifs de sainteté sont maintenus.
