  to: Soumettons-nous donc à son nom très saint et glorieux, en fuyant les menaces annoncées précédemment par la Sagesse contre ceux qui refusent d’obéir, afin que nous demeurions, pleins de confiance dans le nom très saint de sa majesté.[a]
  rationale: La révision précise la valeur de « annoncé/déclaré auparavant » dans προειρημένας et rend l’alternative de note plus idiomatique, sans modifier le sens, le registre ni l’ambiguïté contextuelle de la Sagesse.
