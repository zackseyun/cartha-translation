  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
translation:
  language: fr
  text: Recevez notre conseil, et vous n’aurez pas à le regretter. Car Dieu est vivant, et le Seigneur Jésus Messie est vivant, ainsi que l’Esprit saint, la foi et l’espérance des élus ;[a] celui qui, dans l’humilité, avec une douceur empreinte d’ardeur, accomplit sans regret les exigences justes et les commandements donnés par Dieu sera inscrit et compté au nombre de ceux qui sont sauvés par Jésus Messie. À lui soit la gloire pour les siècles des siècles.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la phrase enchaîne : « Dieu vit, le Seigneur Jésus Messie vit, et l’Esprit saint, la foi et l’espérance des élus ». Le grec ne répète pas le verbe « vivre » après ces derniers éléments, ce qui donne à la formule une tournure volontairement abrupte.'
    reason: Préserver et expliquer la syntaxe inhabituelle de la formule solennelle grecque.
  - marker: b
    text: Le pronom grec traduit par « lui » peut être rapporté à Jésus Messie, mentionné juste avant, mais son référent n’est pas explicitement précisé.
    reason: Préserver l’ambiguïté de αὐτῷ dans la doxologie plutôt que d’identifier explicitement son référent à Dieu.
lexical_decisions:
- source_word: συμβουλήν
  choice: conseil
  rationale: Rend naturellement l’exhortation ou l’avis donné par les auteurs.
- source_word: ἐκτενοῦς ἐπιεικείας
  choice: une bienveillance fervente
  rationale: ἐκτενής exprime l’intensité ou l’empressement, tandis que ἐπιείκεια désigne une douceur raisonnable, clémente et bienveillante.
- source_word: δικαιώματα
  choice: justes prescriptions
  rationale: Conserve à la fois l’idée de normes établies et leur caractère juste, sans les confondre avec les προστάγματα qui suivent.
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  choice: inscrit et compté
  rationale: Reproduit le double mouvement d’inscription et de mise au compte dans le nombre des sauvés.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus Messie
  rationale: Rend Χριστός par son sens titulaire, « Messie », conformément à la politique indiquée dans les révisions.
theological_decisions:
- issue: Formule de serment avec la foi et l’espérance des élus
  choice: Conserver « ainsi que l’Esprit saint, la foi et l’espérance des élus » dans la série introduite par « aussi vrai que »
  alternative: Comprendre ces mots comme une relative ou fournir explicitement un verbe tel que « vivent » pour chaque élément
  rationale: Le grec porte l’article ἡ suivi de τε, non un pronom relatif. Sa syntaxe abrupte associe ces réalités à la formule solennelle sans répéter tous les verbes; la traduction conserve cette étrangeté tout en restant intelligible.
- issue: Aspect de τῶν σῳζομένων
  choice: « ceux qui sont sauvés »
  alternative: « ceux qui seront sauvés » ou « les sauvés »
  rationale: Le participe présent passif décrit les personnes en cours ou en état d’être sauvées, sans imposer ici une seule systématisation temporelle du salut.
- issue: Référent de αὐτῷ dans la doxologie
  choice: « à Dieu »
  alternative: « à lui », potentiellement référé à Jésus Messie
  rationale: Le pronom datif singulier est ambigu à distance. L’enchaînement « par lui » favorise Jésus comme médiateur, tandis que la gloire revient vraisemblablement à Dieu, mais une note signale l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et lisible. La longue période grecque est légèrement articulée par la ponctuation, sans effacer sa solennité. « Esprit saint » suit l’usage typographique français courant; « Jésus Messie » maintient la valeur titulaire de Χριστός.
