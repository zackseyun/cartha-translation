revisions:
- from: Recevez notre conseil, et vous n’aurez pas à le regretter. Car, aussi vrai que Dieu vit, que le Seigneur Jésus Messie vit, ainsi que l’Esprit saint, la foi et l’espérance des élus,[a] celui qui, dans l’humilité, avec une bienveillance fervente, accomplit sans regret les justes prescriptions et les commandements donnés par Dieu sera ainsi inscrit et compté au nombre de ceux qui sont sauvés par Jésus Messie. Par lui soit la gloire à Dieu pour les siècles des siècles. Amen.
  to: Recevez notre conseil, et vous n’aurez pas à le regretter. Car Dieu est vivant, et le Seigneur Jésus Messie est vivant, ainsi que l’Esprit saint, la foi et l’espérance des élus ;[a] celui qui, dans l’humilité, avec une douceur empreinte d’ardeur, accomplit sans regret les exigences justes et les commandements donnés par Dieu sera inscrit et compté au nombre de ceux qui sont sauvés par Jésus Messie. À lui soit la gloire pour les siècles des siècles.[b] Amen.
  rationale: La révision corrige l’explicitation injustifiée du référent de la doxologie, ajuste un choix lexical pour une expression française plus naturelle de ἐκτενοῦς ἐπιεικείας, et maintient l’anomalie rhétorique voulue de la série « l’Esprit saint, la foi et l’espérance des élus ». Les ancres de notes correspondent aux deux difficultés textuelles réellement signalées.
