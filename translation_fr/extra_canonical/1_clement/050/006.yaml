source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
translation:
  language: fr
  text: 'Car il est écrit[a] : « Heureux ceux dont les actes contraires à la loi sont pardonnés et dont les péchés sont couverts ! Heureux l’homme à qui le Seigneur ne comptera certainement pas le péché et dans la bouche de qui il n’y a aucune tromperie ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont les actes contraires à la loi ont été pardonnés et dont les péchés ont été couverts ».'
    reason: Les aoristes passifs ἀφέθησαν et ἐπεκαλύφθησαν peuvent aussi être rendus au passé composé en français ; le présent conserve la portée générale de la béatitude.
lexical_decisions:
- source_word: ἀνομίαι
  choice: actes contraires à la loi
  rationale: Rend le sens d’actions qui transgressent la loi, tout en restant compréhensible en français moderne.
- source_word: ἀφέθησαν
  choice: sont pardonnés
  rationale: Bien que l’aoriste puisse formellement être rendu au passé, le présent exprime ici l’état général décrit par la béatitude.
- source_word: ἐπεκαλύφθησαν
  choice: sont couverts
  rationale: Conserve l’image du texte grec et sa valeur générale dans cette béatitude.
- source_word: οὐ μὴ λογίσηται
  choice: ne compte certainement aucun
  rationale: La négation renforcée οὐ μή appelle une formulation emphatique, tandis que « compter » préserve l’image d’imputation ou de mise en compte.
- source_word: δόλος
  choice: tromperie
  rationale: Terme naturel qui conserve l’idée de fraude, de fausseté ou de duplicité exprimée par le grec.
theological_decisions:
- issue: Sens de la non-imputation du péché
  choice: à qui le Seigneur ne compte certainement aucun péché
  alternative: dont le Seigneur ne tiendra certainement pas compte du péché
  rationale: La formulation retenue préserve la métaphore comptable de λογίζομαι sans préciser davantage la doctrine de l’imputation.
- issue: Temps des deux premiers passifs aoristes
  choice: 'présent gnomique : « sont pardonnés… sont couverts »'
  alternative: 'passé : « ont été pardonnés… ont été couverts »'
  rationale: Dans le cadre proverbial de la béatitude, le présent français communique naturellement l’état général des personnes déclarées heureuses, tout en signalant l’autre lecture possible en note.
translation_notes:
  register: Français moderne, international et digne. La structure répétée de la béatitude ainsi que les images de couverture, de mise en compte et de bouche sans tromperie sont conservées.
