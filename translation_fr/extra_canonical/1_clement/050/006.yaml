  terminology: « Actes contraires à la loi » rend correctement ἀνομίαι, quoique plus explicatif que « actes d’iniquité » ou « transgressions ». « Compter » préserve à juste titre l’image comptable de λογίζομαι sans imposer une lecture confessionnelle de l’imputation. « Tromperie » convient pour δόλος.
