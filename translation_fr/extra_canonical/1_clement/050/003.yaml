revisions:
- from: Toutes les générations depuis Adam jusqu’à ce jour ont passé. Mais ceux qui ont été rendus parfaits dans l’amour, selon la grâce de Dieu, ont une place parmi les fidèles de Dieu[a], qui seront manifestés lors de l’avènement[b] du royaume du Messie.
  to: Toutes les générations depuis Adam jusqu’à ce jour sont passées. Mais ceux qui ont été rendus parfaits dans l’amour, selon la grâce de Dieu, ont une place parmi les personnes pieuses[a], qui seront manifestées lors de la visitation[b] du royaume du Messie.
  rationale: 'La révision retire l’ajout « de Dieu » dans le rendu de εὐσεβῶν, emploie un français plus idiomatique pour les générations révolues, et remplace « avènement » par « visitation », plus proche de ἐπισκοπή. La relative « qui seront manifestées » est conservée: elle reproduit la forme relative du grec sans trancher au-delà de ce que permet la formulation.'
