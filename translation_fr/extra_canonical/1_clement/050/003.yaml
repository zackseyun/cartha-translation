source:
  edition: Funk 1901 (normalized OCR)
  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: fr
  text: Toutes les générations depuis Adam jusqu’à ce jour sont passées. Mais ceux qui ont été rendus parfaits dans l’amour, selon la grâce de Dieu, ont une place parmi les personnes pieuses[a], qui seront manifestées lors de la visitation[b] du royaume du Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont une place parmi les pieux » ou « ont une place réservée aux pieux ».'
    reason: Le tour χῶρον εὐσεβῶν est concis et peut désigner une place au sein des pieux ou une place qui leur est réservée.
  - marker: b
    text: Le mot grec peut aussi désigner une visite, une inspection ou une intervention décisive.
    reason: Préserve l’étendue sémantique de ἐπισκοπή sans réduire le terme à une simple venue.
lexical_decisions:
- source_word: παρῆλθον
  choice: ont passé
  rationale: Rend directement l’idée que les générations antérieures ont disparu ou se sont écoulées, tout en conservant la sobriété du grec.
- source_word: ἐν ἀγάπῃ τελειωθέντες
  choice: qui ont été rendus parfaits dans l’amour
  rationale: Conserve le passif et le champ lexical de l’accomplissement ou de la perfection, sans préciser davantage l’agent que ne le fait le texte.
- source_word: χῶρον εὐσεβῶν
  choice: une place parmi les fidèles de Dieu
  rationale: Formulation française naturelle pour un génitif substantivé désignant les personnes pieuses; « de Dieu » explicite le sens religieux de εὐσεβής sans introduire une appartenance confessionnelle.
- source_word: φανερωθήσονται
  choice: seront manifestés
  rationale: Préserve le passif futur et l’idée d’une révélation publique ou eschatologique.
- source_word: ἐπισκοπῇ
  choice: avènement
  rationale: Dans ce contexte eschatologique, exprime naturellement en français la visitation ou l’intervention décisive associée au royaume, tandis qu’une note conserve l’étendue sémantique du grec.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Rend le titre grec Christos par son sens, « Messie », conformément à son arrière-plan messianique, plutôt que par sa forme francisée « Christ ».
theological_decisions:
- issue: Référent du pronom relatif οἳ
  choice: Conserver une relative française avec « qui »
  alternative: Remplacer par « et ceux-là seront manifestés »
  rationale: Le grec emploie un pronom relatif pluriel dont le rattachement grammatical peut porter sur les personnes rendues parfaites ou, par proximité, sur les fidèles de Dieu. La relative française évite de résoudre explicitement cette légère ambiguïté.
- issue: Sens eschatologique de ἐπισκοπή
  choice: « lors de l’avènement du royaume » avec note
  alternative: « lors de la visitation du royaume » ou « lors de l’intervention du royaume »
  rationale: « Avènement » est idiomatique et digne en français pour la venue décisive du royaume, mais la note signale que le grec peut aussi évoquer une visite, une inspection ou une intervention.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec, avec une ponctuation légèrement adaptée pour la lisibilité. Les termes « rendus parfaits », « manifestés » et « royaume du Messie » maintiennent la tonalité théologique sans surinterprétation confessionnelle.
