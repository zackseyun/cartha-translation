    reason: Le tour χῶρον εὐσεβῶν est concis et peut désigner une place au sein des pieux ou une place qui leur est réservée.
  - marker: b
    text: Le mot grec peut aussi désigner une visite, une inspection ou une intervention décisive.
    reason: Préserve l’étendue sémantique de ἐπισκοπή sans réduire le terme à une simple venue.
  revision_rationale: 'La révision retire l’ajout « de Dieu » dans le rendu de εὐσεβῶν, emploie un français plus idiomatique pour les générations révolues, et remplace « avènement » par « visitation », plus proche de ἐπισκοπή. La relative « qui seront manifestées » est conservée: elle reproduit la forme relative du grec sans trancher au-delà de ce que permet la formulation.'
