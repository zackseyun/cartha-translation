id: 1CLEM.50.5
reference: 1 Clement 50:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
translation:
  language: fr
  text: Heureux sommes-nous, bien-aimés, si nous accomplissons les commandements de Dieu dans la concorde de l’amour, afin que, par l’amour, nos péchés nous soient pardonnés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Rend naturellement la déclaration de bonheur ou de félicité, sans lui imposer un sens technique supplémentaire.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Terme d’adresse affectueux et digne, courant dans le registre chrétien français.
- source_word: προστάγματα
  choice: commandements
  rationale: Exprime les prescriptions divines avec un terme clair et usuel.
- source_word: ἐποιούμεν
  choice: accomplissons
  rationale: Le verbe ποιεῖν signifie ici mettre en pratique; « accomplir » est plus idiomatique que « faire les commandements ».
- source_word: ὁμονοίᾳ
  choice: concorde
  rationale: Préserve l’idée d’accord profond et d’unité de disposition, ainsi que la portée communautaire de ὁμόνοια dans 1 Clément, tout en le distinguant de ἁρμονία.
- source_word: ἀγάπης / δι’ ἀγάπης
  choice: de l’amour / par l’amour
  rationale: Maintient la répétition délibérée d’ἀγάπη et son rôle dans la concorde comme dans le pardon.
theological_decisions:
- issue: Rapport entre l’amour et le pardon des péchés
  choice: afin que, par l’amour, nos péchés nous soient pardonnés
  alternative: de sorte que nos péchés nous sont pardonnés à cause de notre amour
  rationale: La traduction conserve la construction finale εἰς τὸ et l’expression δι’ ἀγάπης sans préciser abusivement si l’amour est moyen, cadre ou motif du pardon.
- issue: Condition introduite par εἰ
  choice: si nous accomplissons
  alternative: lorsque nous accomplissons
  rationale: « Si » préserve explicitement la valeur conditionnelle du grec et la tension de l’énoncé.
translation_notes:
  register: Français international moderne, naturel et digne. « Concorde » est retenu plutôt que « harmonie » pour la précision lexicale et la portée communautaire de ὁμόνοια; la phrase reste volontairement proche de la structure grecque.
