id: 1CLEM.50.7
reference: 1 Clement 50:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
translation:
  language: fr
  text: Cette béatitude est venue sur ceux que Dieu a choisis par Jésus le Messie, notre Seigneur[a], à qui soit la gloire pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus Christ, notre Seigneur ».'
    reason: « Christ » est la forme traditionnelle issue du grec Χριστός; « Messie » en explicite le sens.
lexical_decisions:
- source_word: μακαρισμός
  choice: béatitude
  rationale: Le terme désigne l’état heureux ou bienheureux associé à une déclaration de bonheur. « Béatitude » conserve cette nuance mieux que le plus général « bénédiction », malgré son registre légèrement soutenu.
- source_word: ἐγένετο ἐπί
  choice: est venue sur
  rationale: Cette formulation garde l’image et le mouvement du grec sans ajouter de connecteur logique absent du texte.
- source_word: ἐκλελεγμένους
  choice: ceux que Dieu a choisis
  rationale: Le participe parfait exprime des personnes choisies dont le statut demeure; la tournure française est naturelle et conserve l’action divine.
- source_word: διά
  choice: par
  rationale: Le français « par » maintient la portée instrumentale ou médiatrice de la préposition sans la préciser davantage.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Rend le titre grec par son sens plutôt que par sa translittération traditionnelle, conformément à une traduction transparente en français moderne.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Formule française consacrée qui reproduit l’intensification idiomatique de la doxologie grecque.
theological_decisions:
- issue: Référent de ᾧ dans la doxologie
  choice: Conserver « à qui », dont l’antécédent le plus immédiat est Jésus le Messie, notre Seigneur
  alternative: Comprendre la doxologie comme adressée à Dieu
  rationale: Le pronom relatif masculin singulier peut grammaticalement renvoyer à Dieu ou à Jésus, mais la proximité syntaxique favorise Jésus. La traduction conserve le relatif et n’ajoute aucun nom, laissant subsister l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et lisible. « Béatitude » et « pour les siècles des siècles » relèvent d’un registre biblique soutenu, approprié à la conclusion doxologique.
