source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, πῶς μέγα καὶ θαυμαστόν ἐστιν ἡ ἀγάπη, καὶ τῆς τελειότητος αὐτῆς οὐκ ἔστιν ἐξήγησις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/001.yaml
  text: See, beloved, how great and marvelous love is, and of its perfection there is no description.
translation:
  language: fr
  text: Voyez, bien-aimés, combien l’amour est grand et merveilleux ; sa perfection est impossible à décrire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’existe pas de description de sa perfection ».'
    reason: La note conserve la formulation existentielle du grec, tandis que le texte principal l’exprime dans un français naturel.
lexical_decisions:
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Ce vocatif affectueux, traditionnel mais toujours intelligible, conserve la dignité et la chaleur de l’adresse grecque.
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est le terme français naturel et suffisamment large pour rendre ἀγάπη sans lui imposer une définition confessionnelle.
- source_word: ἐξήγησις
  choice: description
  rationale: Dans ce contexte, le mot désigne ce qui peut être exposé ou formulé par des paroles. « Description » exprime mieux cette idée qu’« explication », qui suggérerait aujourd’hui l’énoncé de causes ou de raisons.
