id: 1CLEM.50.2
reference: 1 Clement 50:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: fr
  text: Qui est capable d’être trouvé dans cet amour, sinon ceux que Dieu en jugera dignes ? Prions donc et implorons sa miséricorde, afin que nous soyons trouvés dans l’amour, sans parti pris humain, irréprochables.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανός
  choice: capable
  rationale: Conserve l’idée d’aptitude ou de capacité exprimée par le grec, sans la réduire au seul mérite moral.
- source_word: ἐν αὐτῇ
  choice: dans cet amour
  rationale: Le pronom féminin renvoie à ἀγάπη dans le contexte. La reprise explicite rend le référent naturel et clair en français.
- source_word: καταξιώσῃ
  choice: en jugera dignes
  rationale: Rend l’idée de considérer ou déclarer quelqu’un digne. Le futur français exprime ici l’éventualité portée par ἄν avec le subjonctif sans alourdir la phrase.
- source_word: δεηθῶμεν καὶ αἰτώμεθα
  choice: Prions donc et demandons
  rationale: 'Respecte les deux verbes coordonnés : adresser une supplication, puis demander.'
- source_word: ἀπὸ τοῦ ἐλέους αὐτοῦ
  choice: à sa miséricorde
  rationale: Préserve la formulation grecque inhabituelle qui présente la miséricorde divine comme celle à laquelle la demande est adressée, plutôt que d’ajouter explicitement un complément absent.
- source_word: δίχα προσκλίσεως ἀνθρωπίνης
  choice: sans parti pris humain
  rationale: πρόσκλισις évoque une inclination favorable ou partiale. « Parti pris » est actuel et intelligible tout en conservant la critique de la partialité humaine.
- source_word: ἄμωμοι
  choice: irréprochables
  rationale: Équivalent français naturel de l’adjectif signifiant sans défaut ou sans reproche dans un contexte moral.
theological_decisions:
- issue: La dignité accordée par Dieu
  choice: ceux que Dieu en jugera dignes
  alternative: ceux qui s’en rendront dignes
  rationale: Le grec fait explicitement de Dieu le sujet de καταξιώσῃ. La traduction évite donc d’attribuer cette dignité à un mérite humain autonome.
- issue: Rapport entre amour, impartialité et irréprochabilité
  choice: que nous soyons trouvés dans l’amour, sans parti pris humain, irréprochables
  alternative: que, sans parti pris humain, nous soyons trouvés irréprochables dans l’amour
  rationale: 'La ponctuation conserve la succession et l’ambiguïté syntaxique du grec : les deux derniers éléments peuvent caractériser ceux qui sont trouvés dans l’amour, sans imposer un lien explicatif absent.'
translation_notes:
  register: Français moderne, international et digne. La formulation garde la question rhétorique et la tension entre l’action souveraine de Dieu et l’appel collectif à la prière. Aucun vocabulaire confessionnel particulier n’est introduit.
