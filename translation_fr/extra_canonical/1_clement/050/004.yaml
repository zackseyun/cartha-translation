source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Εἰσέλθετε εἰς τὰ ταμεῖα μικρὸν ὅσον ὅσον, ἕως οὗ παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου, καὶ μνησθήσομαι ἡμέρας ἀγαθῆς, καὶ ἀναστήσω ὑμᾶς ἐκ τῶν θηκῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: fr
  text: 'Car il est écrit : « Entrez dans vos chambres pour un tout petit moment, jusqu’à ce que passent ma colère et ma fureur, et je me souviendrai d’un jour heureux, et je vous relèverai de vos tombeaux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταμεῖα
  choice: chambres
  rationale: Désigne des pièces retirées ou privées. « Chambres » reste naturel et proche du grec sans ajouter explicitement l’idée d’intériorité.
- source_word: μικρὸν ὅσον ὅσον
  choice: pour un tout petit moment
  rationale: La tournure répétitive insiste sur la très courte durée ; cette formulation française en restitue naturellement l’emphase.
- source_word: ὀργὴ καὶ ὁ θυμός
  choice: ma colère et ma fureur
  rationale: Conserve les deux termes coordonnés et leur intensification possible, sans les fondre en une seule notion.
- source_word: ἡμέρας ἀγαθῆς
  choice: d’un jour favorable
  rationale: « Favorable » rend ici ἀγαθός de manière idiomatique tout en maintenant l’indétermination de ce « bon jour ».
- source_word: ἀναστήσω
  choice: je vous relèverai
  rationale: Le verbe peut signifier faire se lever ou ressusciter. « Relèverai », associé aux tombeaux, préserve cette portée sans l’expliciter davantage que le grec.
- source_word: θηκῶν
  choice: tombeaux
  rationale: Dans ce contexte, le terme désigne des lieux où les morts sont déposés ; « tombeaux » exprime clairement le sens funéraire.
theological_decisions:
- issue: Portée résurrectionnelle de ἀναστήσω ὑμᾶς
  choice: je vous relèverai de vos tombeaux
  alternative: je vous ressusciterai de vos tombeaux
  rationale: La traduction choisie conserve le jeu lexical du grec entre « faire se lever » et « ressusciter », tandis que la mention des tombeaux rend la dimension résurrectionnelle évidente.
- issue: Relation temporelle de καὶ μνησθήσομαι
  choice: Alors je me souviendrai
  alternative: et je me souviendrai
  rationale: « Alors » rend naturellement la progression après la disparition de la colère, sans imposer une causalité théologique absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La citation garde un rythme solennel sans archaïsmes. Aucun ajout explicatif ni marque confessionnelle.
