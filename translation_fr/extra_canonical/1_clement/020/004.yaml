source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: fr
  text: La terre, qui porte en elle selon sa volonté, fait pousser en ses temps propres une nourriture surabondante pour les êtres humains, les animaux et tous les êtres vivants qui se trouvent sur elle, sans hésiter ni rien changer à ce qu’il a décrété.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυοφοροῦσα
  choice: portant
  rationale: Le verbe évoque le fait de porter ou d’être grosse de ce qui doit naître. « Portant » conserve cette image sans ajouter explicitement « du fruit », absent du grec.
- source_word: τοῖς ἰδίοις καιροῖς
  choice: aux saisons qui lui sont propres
  rationale: Cette formulation rend l’idée de périodes ou saisons propres à la terre, tout en conservant la nuance temporelle de καιροῖς.
- source_word: τὴν πανπληθῆ … τροφήν
  choice: une nourriture surabondante
  rationale: πανπληθῆ exprime une très grande abondance; « surabondante » garde la force du composé grec.
- source_word: ἀνατέλλει
  choice: fait pousser
  rationale: Dans ce contexte agricole, le verbe signifie faire lever ou pousser; cette expression est naturelle en français et maintient la terre comme sujet actif.
- source_word: μήτε διστατάσουσα
  choice: sans hésiter
  rationale: διστάζω peut exprimer l’hésitation ou l’incertitude. « Sans hésiter » préserve la personnification de la terre.
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  choice: ce qu’il a décrété
  rationale: Le participe passif désigne ce qui a été établi par décision ou décret; la tournure active française reste précise et naturelle.
theological_decisions:
- issue: Référent des pronoms masculins αὐτοῦ
  choice: « sa volonté » et « il a décrété », sans expliciter le référent
  alternative: Ajouter « Dieu » dans le verset
  rationale: Le grec emploie des pronoms dont le référent est fourni par le contexte. Ne pas ajouter « Dieu » préserve la cohésion du passage et évite une explicitation absente de cette phrase.
translation_notes:
  register: Français moderne, digne et lisible. La phrase conserve la personnification de la terre et le mouvement syntaxique du grec, tout en évitant une construction trop lourde.
