  text: ὠκεανὸς ἀπέραντος ἀνθρώποις καὶ οἱ μετ᾽ αὐτὸν κόσμοι ταγαῖς τοῦ δεσπότου διευθύνονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/008.yaml
  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: fr
  text: L’océan, infranchissable aux humains, et les mondes situés au-delà de l’océan sont dirigés par les ordonnances du Maître.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠκεανὸς ἀπέραντος ἀνθρώποις
  choice: L’océan, infranchissable pour les humains
  rationale: Ἀπέραντος peut signifier « sans limites » ou, dans ce contexte géographique et avec le datif ἀνθρώποις, « infranchissable pour les humains ». Cette dernière lecture s’accorde avec l’opposition entre l’océan et les mondes situés au-delà, tout en conservant la limitation humaine exprimée par le grec.
- source_word: οἱ μετ᾽ αὐτὸν κόσμοι
  choice: les mondes qui se trouvent au-delà
  rationale: Μετ᾽ αὐτόν désigne ici ce qui est après ou au-delà de l’océan. « Mondes » rend directement κόσμοι sans préciser abusivement s’il s’agit de régions terrestres, d’ensembles cosmiques ou d’autres domaines.
- source_word: ταγαῖς
  choice: les ordonnances
  rationale: La forme transmise ταγαῖς représente vraisemblablement τάγμασιν ou une forme apparentée à l’idée d’ordres et de dispositions établies. « Ordonnances » rend ces arrangements normatifs et ordonnés sans les réduire à de simples « décrets ».
- source_word: τοῦ δεσπότου
  choice: du Maître
  rationale: Δεσπότης exprime l’autorité souveraine d’un maître. La majuscule indique que le titre désigne Dieu dans ce contexte.
- source_word: διευθύνονται
  choice: sont gouvernés
  rationale: Le verbe évoque le fait de diriger, régler ou conduire selon un ordre. « Sont gouvernés » est naturel en français et conserve l’idée d’une administration souveraine.
theological_decisions:
- issue: Nature des « mondes » au-delà de l’océan
  choice: Conserver le terme général « mondes »
  alternative: Traduire par « terres » ou « régions »
  rationale: Le grec κόσμοι demeure susceptible de plusieurs compréhensions cosmologiques. La traduction ne tranche pas une question que le texte laisse ouverte.
- issue: Force des ordonnances divines
  choice: « gouvernés par les ordonnances du Maître »
  alternative: « dirigés selon les décrets du Seigneur »
  rationale: Cette formulation maintient à la fois l’ordre établi et l’action souveraine, sans importer une conception confessionnelle particulière du gouvernement divin.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la structure solennelle du grec, avec « Maître » pour le titre divin et « ordonnances » pour le vocabulaire de l’ordre établi.
