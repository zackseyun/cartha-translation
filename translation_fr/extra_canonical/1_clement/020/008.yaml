- from: L’océan, infranchissable pour les humains, et les mondes qui se trouvent au-delà sont gouvernés par les ordonnances du Maître.
  to: L’océan, infranchissable aux humains, et les mondes situés au-delà de l’océan sont dirigés par les ordonnances du Maître.
  rationale: La révision resserre la formulation française et rend plus directement διευθύνονται par « sont dirigés ». Elle conserve « mondes », « ordonnances » et « Maître », sans préciser la nature des mondes ni imposer une lecture cosmologique ou théologique.
