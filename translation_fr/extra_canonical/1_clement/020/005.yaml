source:
  edition: Funk 1901 (normalized OCR)
  text: ἀβύσσων τε ἀνεξιχνίαστα καὶ νερτέρων ἀνεκδιήγητα κρίματα τὰς αὐτὰς συνέχεται προστάξεσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
translation:
  language: fr
  text: Les profondeurs insondables des abîmes et les jugements indescriptibles des régions d’en bas sont contenus par les mêmes ordonnances[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont maintenus ensemble » ou « sont tenus en bride ».
    reason: Le grec συνέχεται peut évoquer la cohésion, le maintien dans des limites ou la contrainte exercée par les ordonnances.
lexical_decisions:
- source_word: ἀβύσσων … ἀνεξιχνίαστα
  choice: les profondeurs insondables des abîmes
  rationale: Le neutre pluriel substantivé ἀνεξιχνίαστα désigne ce qui, dans les abîmes, échappe à toute exploration; « profondeurs insondables » restitue cette image naturellement en français.
- source_word: νερτέρων
  choice: des régions d’en bas
  rationale: Le comparatif substantivé renvoie au monde ou aux régions inférieures, sans préciser davantage leur nature.
- source_word: ἀνεκδιήγητα κρίματα
  choice: les jugements inexprimables
  rationale: κρίματα signifie normalement « jugements » ou « décisions »; ἀνεκδιήγητα indique qu’ils ne peuvent être exposés ou racontés. Cette traduction conserve la formulation énigmatique du grec plutôt que de transformer κρίματα en simples « régions ».
- source_word: συνέχεται
  choice: sont contenus
  rationale: Le verbe exprime ici l’idée d’être maintenu, contenu ou tenu en bride par des prescriptions. « Sont contenus » convient au cadre cosmique et garde une part de la polysémie du verbe.
- source_word: προστάξεσιν
  choice: ordonnances
  rationale: Le terme désigne des prescriptions ou commandements qui régissent l’ordre cosmique; « ordonnances » garde un registre digne sans surspécifier leur forme.
theological_decisions:
- issue: Nature des κρίματα des régions inférieures
  choice: jugements
  alternative: divisions ou domaines
  rationale: Le sens lexical usuel de κρίματα est « jugements » ou « décisions ». Bien que certains rendus comprennent ici des divisions ou des régions du monde inférieur, le texte grec ne justifie pas de résoudre silencieusement cette difficulté en faveur d’une géographie cosmique.
- issue: Force de συνέχεται
  choice: sont contenus
  alternative: sont maintenus ensemble; sont tenus en bride
  rationale: Le contexte évoque l’ordre imposé à la création. « Contenus » peut exprimer à la fois le maintien et la limitation, tandis que la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe parallèle du grec est conservée, ainsi que son langage cosmologique et son ambiguïté, sans introduire une identification doctrinale précise des « régions d’en bas ».
