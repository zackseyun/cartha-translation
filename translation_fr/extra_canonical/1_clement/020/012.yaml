  yaml_path: translation/extra_canonical/1_clement/020/012.yaml
  text: to whom be the glory and the majesty forever and ever. Amen.
translation:
  language: fr
  text: À lui la gloire et la majesté pour les siècles des siècles. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: À lui
  rationale: Le pronom relatif au datif introduit naturellement en français le destinataire de la doxologie, dont l’antécédent se trouve dans le contexte précédent.
- source_word: ἡ δόξα καὶ ἡ μεγαλωσύνη
  choice: la gloire et la majesté
  rationale: Cette formulation conserve les deux noms grecs distincts et leur registre solennel.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Expression doxologique française traditionnelle, compréhensible et proche de l’image temporelle intensifiée du grec.
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération consacrée en français de l’acclamation liturgique sémitique transmise par le grec.
theological_decisions:
- issue: Forme elliptique de la doxologie
  choice: À lui la gloire et la majesté
  alternative: À lui soient la gloire et la majesté
  rationale: Le grec ne comporte aucun verbe exprimé. La formulation nominale française préserve cette ellipse sans imposer explicitement un optatif.
translation_notes:
  register: Français moderne, digne et liturgique. La tournure « les siècles des siècles » conserve la solennité et la structure idiomatique de la doxologie grecque.
