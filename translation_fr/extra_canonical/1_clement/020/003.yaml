source:
  edition: Funk 1901 (normalized OCR)
  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
translation:
  language: fr
  text: Le soleil, la lune et les chœurs d’étoiles suivent, selon l’ordonnance de Dieu, dans la concorde et sans le moindre écart, les parcours qui leur sont assignés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se rendre : « Le soleil, la lune et les chœurs d’étoiles progressent, selon l’ordonnance de Dieu, dans la concorde et sans le moindre écart, à l’intérieur des limites qui leur sont fixées. »'
    reason: 'Signale l’ambiguïté de ἐξελίσσουσιν … ὁρισμούς : ὁρισμούς peut désigner des limites fixées plutôt que des parcours.'
lexical_decisions:
- source_word: χοροὶ
  choice: chœurs
  rationale: Conserve l’image grecque de groupes célestes ordonnés plutôt que de la réduire à une simple multitude d’étoiles.
- source_word: διαταγήν
  choice: ordre établi
  rationale: Rend l’idée d’une disposition faisant autorité dans un français naturel; « par Dieu » explicite le référent du pronom αὐτοῦ, clairement indiqué par le contexte.
- source_word: ἐν ὁμονοίᾳ
  choice: dans la concorde
  rationale: Préserve le terme rhétorique important de 1 Clément, qui désigne l’accord et s’oppose à la discorde, sans l’affaiblir en simple « harmonie » esthétique.
- source_word: δίχα πάσης παρεκβάσεως
  choice: sans le moindre écart
  rationale: Exprime avec naturel l’absence totale de déviation marquée par πάσης.
- source_word: ἐξελίσσουσιν … ὁρισμούς
  choice: suivent … les parcours
  rationale: Dans ce contexte cosmologique, décrit idiomatiquement le mouvement régulier des astres tout en laissant à la note la valeur plus littérale et ambiguë de « limites ».
theological_decisions:
- issue: Référent de αὐτοῦ (« son »)
  choice: par Dieu
  alternative: par lui / conformément à son ordre
  rationale: Le contexte attribue l’ordonnancement du cosmos à Dieu; l’explicitation évite en français un pronom sans antécédent immédiat, sans ajouter de contenu doctrinal.
- issue: Portée de ὁμόνοια
  choice: concorde
  alternative: harmonie
  rationale: « Concorde » maintient la portée éthique et communautaire de ce mot directeur dans 1 Clément, appliqué ici à l’ordre cosmique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image élevée des « chœurs d’étoiles » et le terme thématique « concorde », tout en formulant le mouvement céleste de manière idiomatique.
