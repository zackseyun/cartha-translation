  yaml_path: translation/extra_canonical/1_clement/020/002.yaml
  text: Day and night complete the course appointed by him, hindering one another in nothing.
translation:
  language: fr
  text: Le jour et la nuit achèvent la course qu’il leur a fixée, sans se faire mutuellement obstacle en rien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον
  choice: la course qu’il leur a fixée
  rationale: « Course » conserve l’image de δρόμος, tandis que « qu’il leur a fixée » rend naturellement en français le participe passif τεταγμένον et son agent ὑπ᾽ αὐτοῦ.
- source_word: ἀνύουσιν
  choice: achèvent
  rationale: Le verbe exprime l’accomplissement ou l’achèvement du parcours prescrit.
- source_word: μηδὲν ἀλλήλαις ἐμποδίζοντα
  choice: sans se gêner l’un l’autre en rien
  rationale: Cette formulation restitue l’absence totale d’entrave mutuelle et accorde le participe neutre duel/pluriel de sens avec « le jour et la nuit ».
