  text: Οἱ οὐρανοὶ τῇ διοικήσει αὐτοῦ σαλευόμενοι ἐν εἰρήνῃ ὑποτάσσονται αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/001.yaml
  text: The heavens, revolving by his governance, submit to him in peace.
translation:
  language: fr
  text: Les cieux, mus par son gouvernement, se soumettent à lui dans la paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ébranlés ».'
    reason: Le verbe grec peut couramment signifier « ébranler » ou « secouer », bien que le contexte d’ordre cosmique favorise ici l’idée d’un mouvement régulier.
lexical_decisions:
- source_word: σαλευόμενοι
  choice: mus
  rationale: Le participe décrit ici le mouvement ordonné des cieux dans un contexte cosmologique. « Mus » conserve l’idée de mouvement sans suggérer une perturbation violente; la valeur plus courante « ébranlés » est signalée en note.
- source_word: διοικήσει
  choice: gouvernement
  rationale: Le terme désigne l’administration ou la direction ordonnée exercée par Dieu; « gouvernement » convient au registre cosmologique et maintient le lien explicite avec son action souveraine.
- source_word: ὑποτάσσονται
  choice: se soumettent
  rationale: Rend directement l’idée de mise en ordre sous l’autorité de Dieu, sans affaiblir la personnification des cieux.
- source_word: ἐν εἰρήνῃ
  choice: dans la paix
  rationale: Traduction formellement proche qui souligne l’état d’harmonie dans lequel s’accomplit cette soumission.
theological_decisions:
- issue: Rapport entre l’action divine et le mouvement des cieux
  choice: « mus par son gouvernement »
  alternative: « tournant sous sa direction »
  rationale: La formulation retenue attribue clairement l’ordre cosmique au gouvernement divin tout en évitant de préciser indûment la nature astronomique du mouvement.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la personnification des cieux et la tension lexicale de σαλευόμενοι grâce à une note; le marqueur [a] figure dans le texte principal.
