revisions:
- from: Toutes ces choses, le grand Créateur et Maître de l’univers a ordonné qu’elles demeurent dans la paix et la concorde. Il fait du bien à toutes choses, mais bien plus encore à nous qui avons cherché refuge dans sa compassion par notre Seigneur Jésus le Messie,
  to: Toutes ces choses, le grand Créateur et Maître de toutes choses a ordonné qu’elles soient dans la paix et la concorde, faisant du bien à toutes choses, mais bien plus encore à nous qui avons cherché refuge dans sa compassion par notre Seigneur Jésus le Messie,
  rationale: La révision corrige deux légers resserrements de sens sans modifier la construction, le registre ni l’ambiguïté syntaxique du participe εὐεργετῶν. La virgule finale est conservée, puisque la période se poursuit au verset suivant.
