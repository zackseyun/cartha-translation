id: 1CLEM.20.11
reference: 1 Clement 20:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα πάντα ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐν εἰρήνῃ καὶ ὁμονοίᾳ προσέταξεν εἶναι, εὐεργετῶν τὰ πάντα, ὑπερεκπερισσῶς δὲ ἡμᾶς τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: fr
  text: Toutes ces choses, le grand Créateur et Maître de toutes choses a ordonné qu’elles soient dans la paix et la concorde, faisant du bien à toutes choses, mais bien plus encore à nous qui avons cherché refuge dans sa compassion par notre Seigneur Jésus le Messie,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'δημιουργός (OCR : διμιουργός)'
  choice: Créateur
  rationale: Dans ce contexte cosmologique, le terme désigne celui qui façonne et ordonne le monde ; « Créateur » est naturel, digne et précis en français moderne.
- source_word: δεσπότης τῶν ἁπάντων
  choice: Maître de l’univers
  rationale: Rend l’autorité souveraine exprimée par δεσπότης et la totalité de τῶν ἁπάντων sans la lourdeur de « Maître de toutes choses » après « Toutes ces choses ».
- source_word: ἐν εἰρήνῃ καὶ ὁμονοίᾳ
  choice: dans la paix et la concorde
  rationale: « Concorde » exprime l’accord harmonieux de ὁμόνοια et convient au registre exhortatif de 1 Clément.
- source_word: ὑπερεκπερισσῶς δὲ
  choice: mais bien plus encore
  rationale: Restitue l’intensification très forte et la comparaison implicite avec le bien accordé à toutes choses, dans un français idiomatique.
- source_word: τοὺς προσπεφευγότας
  choice: nous qui avons cherché refuge
  rationale: Préserve l’image du recours à un refuge et la valeur accomplie du participe parfait.
- source_word: τοῖς οἰκτιρμοῖς αὐτοῦ
  choice: dans sa compassion
  rationale: Le pluriel grec désigne les manifestations de la compassion divine ; le singulier collectif est plus naturel en français sans réduire le sens.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός est un titre signifiant « Oint/Messie ». « Jésus le Messie » en maintient explicitement la valeur titulaire au lieu de le laisser fonctionner seulement comme un nom propre traditionnel.
- issue: Référent et fonction de εὐεργετῶν
  choice: 'Phrase indépendante ayant le Créateur pour sujet : « Il fait du bien »'
  alternative: 'Participe circonstanciel : « en faisant du bien »'
  rationale: Le participe masculin singulier se rapporte au Créateur et peut être rendu dans les deux constructions. La phrase indépendante clarifie le sujet sans résoudre davantage la relation circonstancielle, qui reste celle d’une action accompagnant l’ordre établi.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque est divisée en deux phrases pour la lisibilité, tandis que la virgule finale est conservée afin de signaler que la proposition se poursuit au verset suivant.
