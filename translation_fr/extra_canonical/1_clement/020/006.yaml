id: 1CLEM.20.6
reference: 1 Clement 20:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
translation:
  language: fr
  text: La masse de la mer sans limites, rassemblée conformément à son œuvre créatrice dans ses bassins, ne franchit pas les bornes qui l’entourent[a] ; mais, comme il le lui a ordonné, elle le fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les lèvres placées autour d’elle ».'
    reason: Signale l’image concrète du grec χείλη, rendue dans le texte par le terme contextuel « bornes ».
lexical_decisions:
- source_word: χύτος
  choice: masse
  rationale: Le terme désigne ici la masse ou le volume des eaux, et non le bassin qui les contient.
- source_word: ἀπείρου θαλάσσης
  choice: de la mer sans limites
  rationale: Rend directement l’idée d’une mer immense ou sans bornes, dans un français naturel.
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  choice: conformément à son œuvre créatrice
  rationale: Préserve le sens de δημιουργία comme activité ou œuvre de création et la référence pronominale du grec.
- source_word: συναγωγάς
  choice: bassins
  rationale: Dans ce contexte cosmologique, le mot désigne les lieux où les eaux sont réunies ou contenues.
- source_word: χείλη
  choice: bornes
  rationale: Le sens littéral est « lèvres », mais l’image désigne ici les limites ou rives qui retiennent la mer.
- source_word: διέταξεν
  choice: a ordonné
  rationale: Exprime l’ordre prescrit à la mer sans atténuer la personnification du texte.
theological_decisions:
- issue: Référent de αὐτοῦ et du sujet de διετάξεν
  choice: Conserver les pronoms « son » et « il »
  alternative: Expliciter « Dieu »
  rationale: Le grec emploie des pronoms dont le référent ressort du contexte antérieur ; ne pas ajouter explicitement « Dieu » respecte la formulation du verset et évite une explicitation inutile.
translation_notes:
  register: Français moderne, clair et soutenu. La structure poétique et la personnification de la mer sont conservées, tandis que l’ordre des mots est légèrement adapté pour une lecture naturelle.
