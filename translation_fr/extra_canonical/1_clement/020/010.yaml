source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
translation:
  language: fr
  text: Les cours des vents[a], chacun en sa propre saison, accomplissent leur service sans obstacle ; les sources intarissables, créées pour l’agrément et la santé, offrent sans jamais manquer leurs mamelles aux humains pour leur vie. Et les plus petits des êtres vivants tiennent leurs rassemblements dans la concorde et la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les stations des vents ».
    reason: σταθμοί peut désigner des positions ou stations assignées aussi bien que les cours réguliers des vents.
lexical_decisions:
- source_word: ἀνέμων σταθμοί
  choice: les parcours des vents
  rationale: Dans ce tableau de l’ordre du monde, σταθμοί désigne vraisemblablement les parcours ou positions assignés aux vents. « Parcours » est naturel en français et convient au mouvement des vents, tout en signalant en note le rendu plus formel.
- source_word: ἀπροσκόπως
  choice: sans rencontrer d’obstacle
  rationale: L’adverbe exprime ici un accomplissement sans entrave; ce rendu évite l’image peu naturelle de vents qui agiraient « sans trébucher ».
- source_word: ἀέναοι πηγαί
  choice: les sources intarissables
  rationale: ἀέναος qualifie ce qui coule continuellement. « Intarissables » rend idiomatiquement la continuité et l’absence de défaillance des sources.
- source_word: πρὸς ἀπόλαυσιν καὶ ὑγείαν
  choice: pour notre agrément et notre santé
  rationale: ἀπόλαυσις évoque la jouissance ou le bénéfice procuré; « agrément » reste digne et naturel. Le possessif implicite « notre » explicite les bénéficiaires humains sans modifier le sens.
- source_word: μαζούς
  choice: leurs mamelles
  rationale: Le texte personnifie les sources comme des nourrices. La métaphore concrète est conservée plutôt que remplacée par une simple mention de leur eau.
- source_word: τὰ ἐλάχιστα τῶν ζῴων
  choice: les plus petits des êtres vivants
  rationale: Rendu du superlatif ἐλάχιστα sans ajouter l’emphase « même », absente de la simple coordination grecque.
- source_word: συνελεύσεις
  choice: rassemblements
  rationale: Le mot désigne le fait de se réunir ou les assemblées ainsi formées. « Rassemblements » convient aux êtres vivants sans leur attribuer une institution humaine précise.
- source_word: ὁμονοίᾳ
  choice: concorde
  rationale: « Concorde » exprime l’accord et l’unité de disposition, en parallèle avec « paix ».
theological_decisions:
- issue: Personnification des sources dans l’ordre créé
  choice: Conserver l’image des sources qui offrent leurs « mamelles »
  alternative: Paraphraser par « fournissent leur eau »
  rationale: La métaphore appartient au texte grec et participe à sa représentation de la création comme nourricière; la neutraliser ferait perdre une image importante sans nécessité doctrinale.
- issue: Coordination du dernier exemple
  choice: « Et les plus petits »
  alternative: « Même les plus petits »
  rationale: Le τε grec poursuit la série d’exemples et n’impose pas une valeur ascendante. Le rendu retenu ne rajoute donc pas d’emphase théologique ou rhétorique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe suit les trois éléments coordonnés du grec. La métaphore nourricière des sources est volontairement préservée; les formulations archaïques ou inutilement techniques sont évitées.
