revisions:
- from: Les parcours des vents[a], chacun en sa propre saison, accomplissent leur service sans rencontrer d’obstacle. Les sources intarissables, créées pour notre agrément et notre santé, offrent sans jamais manquer leurs mamelles qui font vivre les humains. Et les plus petits des êtres vivants tiennent leurs rassemblements dans la concorde et la paix.
  to: Les cours des vents[a], chacun en sa propre saison, accomplissent leur service sans obstacle ; les sources intarissables, créées pour l’agrément et la santé, offrent sans jamais manquer leurs mamelles aux humains pour leur vie. Et les plus petits des êtres vivants tiennent leurs rassemblements dans la concorde et la paix.
  rationale: La révision retire un possessif absent du grec, corrige la relation syntaxique entre les sources, leurs « mamelles » et la vie humaine, et améliore légèrement l’idiomaticité de la première image. Elle conserve l’ordre ternaire, la personnification des sources et l’absence d’emphase ajoutée dans le dernier membre.
  reviewer_model: gpt-5.6-terra
