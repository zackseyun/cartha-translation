id: 1CLEM.53.1
reference: 1 Clement 53:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε τὰς ἱερὰς γραφάς, ἀγαπητοί, καὶ ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ. πρὸς ἀνάμνησιν οὖν ταῦτα γράφομεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
translation:
  language: fr
  text: En effet, vous connaissez les saintes Écritures, et vous les connaissez bien, bien-aimés ; vous vous êtes penchés avec attention sur les oracles de Dieu[a]. Nous vous écrivons donc ces choses pour vous les rappeler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les paroles de Dieu ».
    reason: λόγια peut désigner des déclarations divines ou des paroles faisant autorité ; « oracles » en souligne la solennité, tandis que « paroles » constitue une traduction plus courante.
lexical_decisions:
- source_word: ἐγκεκύφατε
  choice: vous vous êtes penchés avec attention
  rationale: Cette formulation conserve l’image concrète de quelqu’un qui se penche sur un texte tout en exprimant naturellement, en français, l’idée d’un examen approfondi.
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: les oracles de Dieu
  rationale: « Oracles » rend la portée autoritative de λόγια dans le contexte des saintes Écritures, plutôt que de désigner de simples propos.
- source_word: πρὸς ἀνάμνησιν
  choice: pour vous les rappeler
  rationale: 'Cette tournure française exprime clairement le but de la lettre : raviver chez les destinataires le souvenir de vérités qu’ils connaissent déjà.'
theological_decisions:
- issue: Rapport entre les « saintes Écritures » et les λόγια de Dieu
  choice: Conserver les deux expressions sans les fondre
  alternative: Répéter « les paroles des saintes Écritures »
  rationale: Le grec juxtapose deux désignations apparentées mais distinctes ; la traduction maintient cette nuance sans préciser davantage leur étendue canonique.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « connaissez… connaissez bien » est conservée pour reproduire l’insistance du grec. Le point-virgule clarifie la longue coordination sans en atténuer le mouvement.
