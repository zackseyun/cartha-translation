  yaml_path: translation/extra_canonical/1_clement/053/003.yaml
  text: And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and greater than this one.’”
translation:
  language: fr
  text: 'Et le Seigneur lui dit : « Je t’ai parlé une fois et deux fois, en disant : “J’ai vu ce peuple : le voici, il est obstiné. Laisse-moi les exterminer ; j’effacerai leur nom de dessous le ciel, et je ferai de toi une nation grande, admirable et bien plus grande que celle-ci.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκληροτράχηλος
  choice: rétif
  rationale: Littéralement « au cou raide » ; « rétif » exprime en français actuel la résistance obstinée sans imposer une tournure artificielle.
- source_word: ἐξολεθρεῦσαι
  choice: exterminer
  rationale: Rend la destruction complète et violente exprimée par le verbe, sans ajouter d’intensificateur absent du grec.
- source_word: ἐξαλείψω
  choice: j’effacerai
  rationale: Conserve l’image de l’effacement du nom, également reprise au verset suivant.
- source_word: θαυμαστόν
  choice: admirable
  rationale: Préserve l’idée de ce qui suscite l’émerveillement, plutôt que de donner au terme le sens moderne de « bizarre ».
- source_word: πολὺ μᾶλλον ἢ τοῦτο
  choice: beaucoup plus nombreuse que celle-ci
  rationale: Dans le contexte d’une nation issue de Moïse, l’ellipse comparative porte naturellement sur l’importance numérique ; l’ajout de « nombreuse » explicite ce qui est sous-entendu en grec.
theological_decisions:
- issue: Formule divine « Laisse-moi »
  choice: Laisse-moi les exterminer
  alternative: Ne m’empêche pas de les exterminer
  rationale: La formulation directe maintient la tension narrative du discours divin sans expliquer ni atténuer la possibilité d’une intercession de Moïse.
- issue: Description d’Israël comme σκληροτράχηλος
  choice: rétif
  alternative: au cou raide
  rationale: Le choix conserve l’accusation d’obstination tout en évitant un calque peu naturel ; aucune interprétation doctrinale supplémentaire n’est introduite.
translation_notes:
  register: Français moderne, digne et oralement fluide. La structure de parole enchâssée et toutes les propositions du grec sont conservées. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
