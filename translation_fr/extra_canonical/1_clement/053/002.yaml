  to: 'En effet, lorsque Moïse fut monté sur la montagne et eut passé quarante jours et quarante nuits dans le jeûne et l’humilité, Dieu lui dit : « Moïse, Moïse, descends vite d’ici, car ton peuple, que tu as fait sortir du pays d’Égypte, a agi contrairement à la loi. Ils se sont vite détournés de la voie que je leur avais prescrite ; ils se sont fabriqué des idoles de métal fondu. »'
  rationale: La révision corrige un faux ami potentiel concernant ταπείνωσις et atténue une explicitation non nécessaire de ἠνόμησεν. Elle conserve le sens, le registre et l’imagerie du texte grec, ainsi que le choix contextuellement fondé d’« idoles de métal fondu » pour χωνευτά.
