base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/002.yaml
  text: For when Moses had gone up the mountain and had spent forty days and forty nights in fasting and self-abasement, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”
translation:
  language: fr
  text: 'En effet, lorsque Moïse fut monté sur la montagne et eut passé quarante jours et quarante nuits dans le jeûne et l’humilité, Dieu lui dit : « Moïse, Moïse, descends vite d’ici, car ton peuple, que tu as fait sortir du pays d’Égypte, a agi contrairement à la loi. Ils se sont vite détournés de la voie que je leur avais prescrite ; ils se sont fabriqué des idoles de métal fondu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσαντος τεσσαράκοντα ἡμέρας καὶ τεσσαράκοντα νύκτας
  choice: eut passé quarante jours et quarante nuits
  rationale: Littéralement « ayant fait » cette durée ; en français courant, « passer » exprime naturellement le temps ainsi écoulé.
- source_word: ἐν νηστείᾳ καὶ ταπεινώσει
  choice: dans le jeûne et l’humiliation
  rationale: « Jeûne » rend directement νηστεία. « Humiliation » conserve le sens d’abaissement volontaire de ταπείνωσις sans préciser davantage sa forme.
- source_word: τὸ τάχος
  choice: vite
  rationale: Restitue l’urgence de l’expression adverbiale dans un français direct et naturel.
- source_word: ἠνόμησεν
  choice: a violé la Loi
  rationale: Le verbe signifie agir contrairement à la loi ou commettre l’iniquité. Cette formulation garde ici sa dimension juridique et morale.
- source_word: παρεβήσαν ... ἐκ τῆς ὁδοῦ
  choice: se sont ... détournés de la voie
  rationale: Rend l’image biblique de l’abandon rapide de la conduite prescrite.
- source_word: χωνευτά
  choice: des idoles de métal fondu
  rationale: Le substantif désigne des objets ou images obtenus par fonte ; « idoles » explicite leur fonction dans le contexte, tandis que « de métal fondu » en conserve le procédé de fabrication.
theological_decisions:
- issue: Référence à la Loi dans ἠνόμησεν
  choice: a violé la Loi
  alternative: a commis l’iniquité / a agi sans loi
  rationale: La majuscule indique la norme divine du contexte mosaïque, sans réduire le terme à une faute civile ni atténuer sa portée morale.
- issue: Nature des χωνευτά
  choice: idoles de métal fondu
  alternative: objets moulés / images fondues
  rationale: Le contexte de l’épisode du veau d’or justifie « idoles », tout en évitant d’introduire ici le singulier « veau », absent du texte grec de Clément.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue phrase grecque est conservée sans lourdeur excessive ; la citation divine garde un ton direct et solennel.
