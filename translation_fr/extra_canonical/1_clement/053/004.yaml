translation:
  language: fr
  text: 'Et Moïse dit : « Non, Seigneur ! Pardonne le péché de ce peuple ; sinon, efface-moi, moi aussi, du livre des vivants. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Jamais de la vie
  rationale: Négation énergique et autonome, qui rend la vive protestation de Moïse dans un français naturel sans la transformer en proposition conditionnelle.
- source_word: ἄφες
  choice: Pardonne
  rationale: Dans ce contexte, le verbe signifie remettre ou pardonner le péché.
- source_word: κἂν
  choice: moi aussi
  rationale: La particule renforce l'inclusion de Moïse dans le sort demandé pour le peuple ; « aussi » en restitue naturellement la portée.
- source_word: ἐξάλειψόν
  choice: efface-moi
  rationale: Conserve l'image concrète d'un nom supprimé d'un livre.
- source_word: βίβλου ζώντων
  choice: livre des vivants
  rationale: Traduction formellement proche de l'expression grecque, sans l'identifier explicitement à une autre formulation canonique.
theological_decisions:
- issue: Forme de la supplication de Moïse
  choice: Conserver la protestation « Jamais de la vie, Seigneur ! », suivie de deux impératifs mis en alternative.
  alternative: 'Adopter la formulation conditionnelle : « Si tu veux pardonner leur péché… sinon… »'
  rationale: Le texte grec fourni de 1 Clément porte explicitement Μηδαμῶς, κύριε et non la protase conditionnelle attestée dans une autre forme de la tradition d'Exode 32. La traduction suit donc directement cette source.
- issue: Sens du « livre des vivants »
  choice: Maintenir l'expression sans explication doctrinale.
  alternative: Préciser « livre de vie » ou expliciter le destin éternel.
  rationale: Le grec dit littéralement « livre des vivants » et ne développe pas ici la nature exacte de ce livre.
translation_notes:
  register: Français moderne, digne et oralement fluide. « Jamais de la vie » exprime avec force Μηδαμῶς ; la suite conserve le parallélisme pressant de l'intercession de Moïse.
