base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/005.yaml
  text: O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude, or even asks to be blotted out with them.
translation:
  language: fr
  text: 'Ô quel grand amour ! Ô perfection insurpassable ! Un serviteur parle avec assurance à son Seigneur : il demande le pardon pour la multitude, ou même que lui aussi soit effacé avec eux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ μεγάλης ἀγάπης
  choice: Ô quel grand amour !
  rationale: Rend naturellement en français l’exclamation grecque elliptique tout en conservant sa force admirative.
- source_word: τελειότητος ἀνυπερβλήτου
  choice: perfection insurpassable
  rationale: Préserve le sens fort de ἀνυπέρβλητος, « qu’on ne peut dépasser », sans ajouter d’interprétation théologique.
- source_word: παρρησιάζεται
  choice: parle avec assurance
  rationale: Exprime la liberté et la hardiesse de parole indiquées par le verbe, dans un français courant et digne.
- source_word: θεράπων
  choice: serviteur
  rationale: Dans ce contexte, désigne Moïse en tant que serviteur de Dieu ; « serviteur » est naturel et respecte la relation au κύριος.
- source_word: τῷ πλήθει
  choice: pour tout le peuple
  rationale: Le sens contextuel est la multitude d’Israël ; « tout le peuple » est plus idiomatique que « la multitude » et maintient la portée collective.
- source_word: ἐξαλειφθῆναι
  choice: être lui aussi effacé
  rationale: Conserve l’image d’effacement reprise de la citation précédente concernant le livre des vivants.
theological_decisions:
- issue: Nature de la demande finale de Moïse
  choice: ou même d’être lui aussi effacé avec eux
  alternative: sinon, d’être lui-même effacé avec eux
  rationale: Le grec ἢ καί présente la seconde demande comme une possibilité extrême ajoutée à la demande de pardon. La traduction conserve cette progression sans préciser au-delà du texte le mécanisme de substitution.
- issue: Titre κύριος
  choice: son Seigneur
  alternative: le Seigneur
  rationale: Le possessif explicite naturellement en français le rapport entre θεράπων et κύριος, sans identifier ici le titre de façon plus technique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les deux exclamations parallèles et la progression rhétorique du grec sont conservées. Aucun marqueur de note n’est requis.
