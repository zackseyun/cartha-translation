  text: καὶ πάλιν Ἰὼβ λέγει· Καὶ ἀναστήσεις τὴν σάρκα μου ταύτην τὴν ἀναντλήσασαν ταῦτα πάντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/003.yaml
  text: And again[a], Job says, “And you will raise up this flesh of mine, which has borne all these things.”
translation:
  language: fr
  text: 'Et Job dit encore : « Et tu relèveras cette chair qui est la mienne, elle qui a supporté toutes ces choses. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεις
  choice: tu relèveras
  rationale: Rend le futur actif à la deuxième personne tout en conservant l’image grecque du relèvement, sans expliciter davantage par « ressusciter ».
- source_word: τὴν σάρκα μου ταύτην
  choice: cette chair qui est la mienne
  rationale: Reproduit l’insistance du grec sur « cette chair » et son appartenance au locuteur, dans un français naturel et solennel.
- source_word: τὴν ἀναντλήσασαν ταῦτα πάντα
  choice: elle qui a supporté toutes ces choses
  rationale: Le participe rare ἀναντλήσασαν exprime ici le fait d’avoir porté ou enduré l’ensemble des épreuves; « supporté » garde cette nuance sans la surinterpréter.
theological_decisions:
- issue: Portée de ἀναστήσεις appliqué à la chair
  choice: tu relèveras
  alternative: tu ressusciteras
  rationale: « Relèveras » reste proche du verbe grec et préserve sa force évocatrice dans un contexte de résurrection sans transformer l’allusion en formulation doctrinale plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « Et » est maintenue parce qu’elle appartient à la structure grecque de l’introduction et de la citation. Le nom biblique Ἰώβ est rendu selon sa forme française usuelle, « Job ».
