source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ που· Καὶ ἐξαναστήσεις με, καὶ ἐξομολογήσομαί σοι· καί· Ἐκοιμήθην καὶ ὕπνωσα, ἐξηγέρθην, ὅτι σὺ μετ᾿ ἐμοῦ εἶ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/002.yaml
  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: fr
  text: 'Car il dit quelque part : « Tu me relèveras, et je te rendrai grâce » ; et encore : « Je me suis endormi et j’ai dormi ; je me suis réveillé, parce que tu es avec moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαναστήσεις
  choice: tu me relèveras
  rationale: Le verbe exprime l’action de faire se lever ou de relever. Dans ce contexte consacré à la résurrection, « relèveras » préserve cette portée sans imposer une formulation technique absente du grec.
- source_word: ἐξομολογήσομαί
  choice: je te rendrai grâce
  rationale: Avec le datif σοι, le verbe peut désigner la confession publique, la louange ou l’action de grâce adressée à Dieu. « Rendre grâce » convient au registre psalmique et reste naturel en français.
- source_word: Ἐκοιμήθην καὶ ὕπνωσα
  choice: Je me suis couché et je me suis endormi
  rationale: Cette formulation reproduit le parallélisme des deux verbes grecs tout en donnant une phrase française naturelle.
- source_word: ἐξηγέρθην
  choice: je me suis réveillé
  rationale: Le sens immédiat dans l’image du sommeil est « se réveiller », tout en conservant en contexte une possible résonance avec le relèvement des morts.
- source_word: λέγει γάρ που
  choice: En effet, il est dit quelque part
  rationale: La tournure impersonnelle française conserve l’indétermination de la formule grecque, qui n’identifie ni le locuteur ultime ni le passage cité.
theological_decisions:
- issue: Résonance de résurrection dans le vocabulaire du lever et du réveil
  choice: Conserver les images de « relever » et de « se réveiller »
  alternative: Traduire explicitement par « ressusciter » dans les deux citations
  rationale: Le contexte de 1 Clément 26 porte sur la résurrection, mais les citations emploient aussi le langage ordinaire du lever et du sommeil. La traduction maintient cette tension sans expliciter davantage que le grec.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « et encore » marque naturellement l’introduction de la seconde citation, tandis que la ponctuation conserve leur distinction.
