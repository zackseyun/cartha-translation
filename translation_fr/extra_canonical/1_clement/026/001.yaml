id: 1CLEM.26.1
reference: 1 Clement 26:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: fr
  text: Estimons-nous donc qu’il soit grand et merveilleux que le Créateur de toutes choses accomplisse la résurrection de ceux qui l’ont servi avec piété, dans l’assurance que donne une foi authentique, alors même qu’il nous montre, par un oiseau, la grandeur de sa promesse ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς τῶν ἁπάντων
  choice: le Créateur de toutes choses
  rationale: Rend naturellement le titre grec et son extension universelle.
- source_word: ἀνάστασιν ποιήσεται
  choice: accomplisse la résurrection
  rationale: Préserve la construction grecque « faire/opérer une résurrection » dans un français idiomatique, sans préciser davantage le mode de l’action.
- source_word: ὁσίως αὐτῷ δουλευσάντων
  choice: ceux qui l’ont servi saintement
  rationale: Conserve à la fois l’idée de service envers Dieu et la qualité religieuse ou sainte de ce service.
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  choice: dans l’assurance d’une foi sincère
  rationale: « Assurance » rend πεποίθησις, tandis que « sincère » exprime ici la qualité positive et droite de ἀγαθή sans suggérer plusieurs sortes techniques de foi.
- source_word: δι᾿ ὀρνέου
  choice: par un oiseau
  rationale: Traduction directe de l’expression indéfinie; le contexte suivant identifie traditionnellement l’oiseau sans qu’il soit nécessaire de l’anticiper.
- source_word: τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ
  choice: la grandeur de sa promesse
  rationale: Reproduit clairement le rapport génitif du grec et le caractère sublime de la promesse.
theological_decisions:
- issue: Portée de la résurrection mentionnée
  choice: « la résurrection de ceux qui l’ont servi saintement »
  alternative: « leur résurrection » ou une formulation explicitant une résurrection universelle
  rationale: Le texte qualifie directement les personnes concernées dans cette phrase; la traduction n’élargit ni ne restreint ce que le grec affirme.
- issue: Sens de πίστις ἀγαθή
  choice: « une foi sincère »
  alternative: « une bonne foi »
  rationale: En français moderne, « bonne foi » désigne souvent l’honnêteté subjective et risquerait de déplacer le sens religieux de πίστις; « foi sincère » maintient ce sens sans importer une définition doctrinale.
translation_notes:
  register: Français moderne, international et digne. La question rhétorique et sa tension sont conservées; la longue phrase grecque reste unifiée tout en demeurant naturelle à la lecture.
