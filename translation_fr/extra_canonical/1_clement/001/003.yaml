revisions:
- from: Car vous agissiez en tout sans favoritisme et vous marchiez selon les prescriptions de Dieu. Vous vous soumettiez à vos dirigeants et accordiez l’honneur qui convenait aux anciens parmi vous.[a] Vous recommandiez aux jeunes d’avoir des pensées mesurées et dignes. Vous demandiez aussi aux femmes de tout accomplir avec une conscience irréprochable, digne et pure, en aimant leurs propres maris comme il convient. Vous leur enseigniez encore à respecter la règle de la soumission et à tenir leur maison avec dignité, en faisant preuve d’une parfaite maîtrise d’elles-mêmes.
  to: Car vous faisiez tout sans favoritisme et vous marchiez selon les prescriptions de Dieu. Vous vous soumettiez à vos dirigeants et accordiez l’honneur qui convenait aux anciens parmi vous.[a] Vous recommandiez aux jeunes d’avoir des pensées mesurées et dignes. Vous demandiez aussi aux femmes de tout accomplir avec une conscience irréprochable, digne et pure, en aimant leurs propres maris comme il convient. Vous leur enseigniez aussi, tout en demeurant dans la règle de la soumission, à administrer dignement leur foyer, en faisant preuve d’une entière maîtrise d’elles-mêmes.
  rationale: La révision conserve le parallélisme des actions habituelles exprimées par les imparfaits et rétablit, dans la dernière proposition, la fonction circonstancielle de la participiale grecque relative aux femmes. Elle ne tranche pas davantage que le texte sur la nature de la « règle de la soumission » ni sur le statut des « anciens ».
