source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
translation:
  language: fr
  text: Car vous faisiez tout sans favoritisme et vous marchiez selon les prescriptions de Dieu. Vous vous soumettiez à vos dirigeants et accordiez l’honneur qui convenait aux anciens parmi vous.[a] Vous recommandiez aux jeunes d’avoir des pensées mesurées et dignes. Vous demandiez aussi aux femmes de tout accomplir avec une conscience irréprochable, digne et pure, en aimant leurs propres maris comme il convient. Vous leur enseigniez aussi, tout en demeurant dans la règle de la soumission, à administrer dignement leur foyer, en faisant preuve d’une entière maîtrise d’elles-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux personnes âgées parmi vous ». Le grec peut désigner soit des anciens de la communauté, soit les personnes plus âgées.'
    reason: Préserver l’ambiguïté lexicale de πρεσβυτέροις.
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  choice: sans favoritisme
  rationale: Exprime naturellement l’absence de partialité ou d’acception de personnes.
- source_word: νομίμοις
  choice: prescriptions
  rationale: Désigne ici les règles ou ordonnances établies par Dieu; « prescriptions » est clair sans redondance.
- source_word: ἡγουμένοις
  choice: dirigeants
  rationale: Terme général pour ceux qui conduisent la communauté, sans imposer un titre ecclésiastique précis.
- source_word: πρεσβυτέροις
  choice: anciens
  rationale: Conserve le terme traditionnel et son ambiguïté possible entre responsables et personnes plus âgées.
- source_word: μέτρα [probablement μέτρια]
  choice: mesurées
  rationale: Le contexte et le texte grec couramment attesté μέτρια soutiennent l’idée de modération; la forme μέτρα fournie paraît être une anomalie d’OCR.
- source_word: κανόνι τῆς ὑποταγῆς
  choice: règle de la soumission
  rationale: Rend directement l’idée d’une norme ou ligne de conduite caractérisée par la soumission.
- source_word: οἰκουρεῖν
  choice: tenir leur maison
  rationale: Expression française naturelle pour administrer et prendre soin des affaires domestiques.
- source_word: πάνυ σωφρονούσας
  choice: en faisant preuve d’une parfaite maîtrise d’elles-mêmes
  rationale: σωφρονεῖν associe pondération, retenue et maîtrise de soi; « parfaite » rend l’intensif πάνυ.
theological_decisions:
- issue: Sens de πρεσβύτεροι
  choice: anciens
  alternative: personnes âgées
  rationale: Le mot peut désigner des anciens reconnus dans la communauté ou simplement les plus âgés. Le texte distingue déjà les dirigeants, mais ne tranche pas entièrement; une note préserve cette ambiguïté.
- issue: Portée de la soumission dans la dernière proposition
  choice: Vous leur enseigniez encore à respecter la règle de la soumission et à tenir leur maison
  alternative: Vous leur enseigniez encore, tout en demeurant sous la règle de la soumission, à tenir leur maison
  rationale: Le grec rattache clairement ἐδιδάσκετε au nouvel acte d’enseignement, mais la relation syntaxique exacte entre ἐν τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας et οἰκουρεῖν permet une formulation plus intégrée ou plus circonstancielle. Le choix retenu reste lisible sans transformer la soumission en titre institutionnel.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits rendent la conduite habituelle décrite par les verbes grecs à l’imparfait. La formulation évite les titres confessionnels et conserve le parallélisme des exhortations adressées aux divers groupes.
