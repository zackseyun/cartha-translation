id: 1CLEM.1.1
reference: 1 Clement 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
translation:
  language: fr
  text: À cause des malheurs et des épreuves qui nous ont frappés soudainement et coup sur coup, frères, nous estimons avoir tardé à nous occuper des questions débattues parmi vous, bien-aimés, à savoir de cette révolte abjecte et impie, étrangère et inconnue des élus de Dieu, qu’un petit nombre de personnes irréfléchies et obstinées ont attisée jusqu’à un tel degré de folie que votre nom honorable, renommé et aimé de tous a été gravement diffamé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμφορὰς καὶ περιστάσεις
  choice: malheurs et épreuves
  rationale: 'Rend les deux termes proches sans les confondre : συμφορά désigne les malheurs subis, tandis que περίστασις évoque ici des circonstances éprouvantes ou des détresses.'
- source_word: βράδιον
  choice: avoir tardé
  rationale: Le comparatif peut avoir une valeur atténuée (« assez tardivement »), mais le français naturel exprime ici clairement le retard reconnu.
- source_word: ἐπιστροφὴν πεποιῆσθαι
  choice: nous occuper
  rationale: L’expression désigne le fait de tourner son attention vers un sujet; « nous occuper de » est idiomatique sans suggérer la conversion.
- source_word: τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων
  choice: des questions débattues parmi vous
  rationale: Dans ce contexte, ἐπιζητουμένων évoque les questions controversées ou débattues, et παρʼ ὑμῖν situe ces débats parmi les destinataires, sans introduire l’idée absente de demandes adressées à Rome.
- source_word: στάσεως
  choice: révolte
  rationale: Le mot désigne une dissension organisée, une sédition ou une révolte; « révolte » conserve ici la force du blâme.
- source_word: μιαρᾶς καὶ ἀνοσίου
  choice: abjecte et impie
  rationale: « Abjecte » exprime la souillure morale de μιαρός; « impie » rend l’opposition au sacré portée par ἀνόσιος.
- source_word: προπετῆ καὶ αὐθάδη
  choice: irréfléchies et obstinées
  rationale: προπετής décrit l’impulsivité téméraire; αὐθάδης l’attitude volontaire, arrogante et intraitable. Le choix français reste clair et dignifié.
- source_word: βλασφημηθῆναι
  choice: a été gravement diffamé
  rationale: Le passif signifie que leur réputation a été exposée à la calomnie ou au dénigrement; « diffamé » convient mieux en français moderne que « blasphémé » lorsqu’il s’agit d’un nom humain.
theological_decisions:
- issue: La relation de la révolte aux élus de Dieu
  choice: « étrangère et inconnue des élus de Dieu » qualifie la révolte
  alternative: Comprendre seulement qu’elle est étrangère aux élus, sans conserver les deux adjectifs
  rationale: Le grec accumule ἀλλοτρίας καὶ ξένης et rattache explicitement cette double caractérisation à τοῖς ἐκλεκτοῖς τοῦ θεοῦ; la traduction préserve cette emphase sans préciser davantage l’identité ou le statut théologique des élus.
- issue: Sens de « élus de Dieu »
  choice: Conserver littéralement « les élus de Dieu »
  alternative: « ceux que Dieu a choisis »
  rationale: La formule substantivée est intelligible en français et conserve la terminologie théologique du texte sans l’interpréter selon une doctrine particulière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue période grecque est divisée en deux phrases afin de préserver la lisibilité, tout en gardant l’enchaînement rhétorique et la vigueur de la réprobation.
