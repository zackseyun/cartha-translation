id: 1CLEM.1.2
reference: 1 Clement 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: fr
  text: En effet, qui donc, après avoir séjourné parmi vous, n’a pas reconnu la valeur de votre foi, riche de toute vertu et inébranlable ? Qui n’a pas admiré votre piété pleine de mesure et de douceur dans le Messie ? Qui n’a pas proclamé la noblesse de votre hospitalité ? Et qui n’a pas déclaré bienheureuse votre connaissance parfaite et sûre ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπιδημήσας
  choice: après avoir séjourné parmi vous
  rationale: Rend l’idée d’un séjour temporaire auprès de la communauté sans employer un terme français artificiel.
- source_word: πανάρετον
  choice: riche de toute vertu
  rationale: Conserve la portée intensive de « toute vertu » dans une formulation française naturelle.
- source_word: βεβαίαν
  choice: inébranlable
  rationale: Exprime ici la fermeté et la constance de la foi plutôt qu’une simple certitude intellectuelle.
- source_word: ἐδοκίμασεν
  choice: a reconnu la valeur
  rationale: Le verbe indique une appréciation favorable fondée sur l’épreuve ou l’observation.
- source_word: σώφρονα καὶ ἐπιεικῆ
  choice: pleine de mesure et de douceur
  rationale: « Mesure » traduit la maîtrise et le bon sens de σώφρων ; « douceur » restitue la modération bienveillante de ἐπιεικής.
- source_word: Χριστῷ
  choice: Messie
  rationale: Traduit le titre grec Χριστός par son sens, « Messie », conformément à son caractère de titre dans ce contexte.
- source_word: μεγαλοπρεπὲς ... ἦθος
  choice: la noblesse
  rationale: Exprime la qualité élevée et admirable de la disposition manifestée dans l’hospitalité, sans lourdeur littérale.
- source_word: ἐμακάρισεν
  choice: a déclaré bienheureuse
  rationale: Préserve le vocabulaire de la béatitude plutôt que de réduire le verbe à une simple louange.
theological_decisions:
- issue: Valeur du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le grec emploie le titre Χριστός ; « Messie » en communique directement le sens sans le traiter comme un nom propre.
- issue: Portée de ἐν Χριστῷ
  choice: dans le Messie
  alternative: chrétienne
  rationale: La formulation relationnelle du grec est conservée au lieu d’être transformée en simple adjectif confessionnel.
translation_notes:
  register: Français moderne, digne et accessible. La série de questions rhétoriques et les éloges intensifs du grec sont conservés, avec des formulations idiomatiques plutôt qu’un calque syntaxique.
