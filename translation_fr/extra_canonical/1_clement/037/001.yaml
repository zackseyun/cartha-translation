id: 1CLEM.37.1
reference: 1 Clement 37:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Στρατευώμεϑα οὖν, ἄνδρες ἀδελφοί, μετὰ πάσης ἐκτενείας ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/001.yaml
  text: Therefore let us serve as soldiers, brothers, with all earnestness under his blameless commands.
translation:
  language: fr
  text: Ainsi donc, frères, servons comme des soldats, avec le plus grand zèle, sous ses commandements irréprochables.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεϑα
  choice: servons comme des soldats
  rationale: Le verbe appelle à accomplir un service militaire; cette tournure naturelle en français conserve l’image explicite du soldat et la valeur exhortative du subjonctif.
- source_word: ἄνδρες ἀδελφοί
  choice: frères
  rationale: Formule d’adresse idiomatique grecque; «frères» est naturel, digne et suffisamment inclusif dans ce contexte communautaire, sans le lourd «hommes frères».
- source_word: μετὰ πάσης ἐκτενείας
  choice: avec le plus grand zèle
  rationale: ἐκτένεια exprime l’application soutenue, l’ardeur ou le sérieux; «le plus grand zèle» rend l’intensification de πάσης dans un français courant.
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  choice: sous ses commandements irréprochables
  rationale: Dans la métaphore militaire, ἐν peut décrire le cadre d’obéissance; «sous» est idiomatique en français. ἀμώμοις signifie sans défaut ni reproche, rendu directement par «irréprochables».
theological_decisions:
- issue: Référent du possessif αὐτοῦ
  choice: Conserver «ses» sans expliciter le référent
  alternative: «les commandements irréprochables de Dieu» ou «du Seigneur»
  rationale: Le verset grec emploie seulement le pronom et dépend du contexte antérieur; expliciter un nom lèverait une référence que cette unité textuelle laisse implicite.
- issue: Force de l’image militaire
  choice: Maintenir explicitement le service de soldats
  alternative: «engageons-nous» ou «combattons»
  rationale: Le verbe στρατεύομαι évoque le service militaire; préserver cette image évite d’atténuer l’exhortation ou de la réduire au seul combat.
translation_notes:
  register: Français international moderne, exhortatif et digne. La phrase conserve la métaphore militaire et l’ambiguïté du référent de «ses», tout en évitant un calque peu naturel de l’adresse grecque.
