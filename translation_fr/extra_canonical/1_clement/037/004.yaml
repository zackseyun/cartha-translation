source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ μεγάλοι δίχα τῶν μικρῶν οὐ δύνανται εἶναι οὔτε οἱ μικροὶ δὶχα τῶν μεγάλων· σύγκρασίς τις ἐστιν ἐν πᾶσιν, καὶ ἐν τούτοις χρῆσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
translation:
  language: fr
  text: Les grands ne peuvent exister sans les petits, ni les petits sans les grands. En toutes choses, il y a un certain mélange, et en elles se trouve une utilité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et en eux se trouve une utilité » ; le pronom grec peut renvoyer aux grands et aux petits plutôt qu’à toutes choses.'
    reason: Le pluriel ἐν τούτοις peut se rapporter soit à « toutes choses », soit aux « grands » et aux « petits » mentionnés immédiatement auparavant.
lexical_decisions:
- source_word: οἱ μεγάλοι / οἱ μικροί
  choice: les grands / les petits
  rationale: Conserve l’opposition substantivée du grec et son application générale dans le contexte.
- source_word: σύγκρασίς
  choice: union
  rationale: Exprime l’idée de combinaison ou d’association de différents éléments dans un français naturel, sans réduire le terme à une simple ressemblance.
- source_word: χρῆσις
  choice: utilité
  rationale: Rend le sens d’usage utile ou d’avantage apporté par cette association.
- source_word: ἐν τούτοις
  choice: en elles
  rationale: Respecte le pluriel grec et le rattache naturellement à « toutes choses », tout en signalant en note l’autre antécédent possible.
theological_decisions:
- issue: Antécédent de ἐν τούτοις
  choice: Le texte principal rattache le pronom à « toutes choses ».
  alternative: Le pronom peut renvoyer aux grands et aux petits.
  rationale: La forme grecque est plurielle et autorise les deux rattachements; la traduction principale reste proche de l’ordre des mots, tandis que la note préserve l’ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. « Union » évite le caractère matériel de « mélange » tout en conservant l’idée d’éléments associés; la formulation légèrement sentencieuse correspond au style de l’exhortation.
