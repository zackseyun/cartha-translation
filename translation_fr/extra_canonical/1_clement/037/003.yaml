id: 1CLEM.37.3
reference: 1 Clement 37:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
translation:
  language: fr
  text: Tous ne sont pas préfets, ni tribuns, ni centurions, ni chefs de cinquante hommes, ni ceux qui suivent dans l’ordre[a] ; mais chacun, à son propre rang, exécute les ordres donnés par le roi et par les chefs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni ce qui suit dans l’ordre ». L’expression elliptique peut désigner les grades suivants de la hiérarchie ou, plus largement, « et ainsi de suite ».'
    reason: La formule grecque τὸ καθεξῆς est elliptique; la note préserve ses deux nuances possibles sans les réduire à une seule interprétation.
lexical_decisions:
- source_word: ἔπαρχοι
  choice: préfets
  rationale: Équivalent français établi de ce titre d’autorité, adapté à l’énumération militaire.
- source_word: χιλίαρχοι
  choice: tribuns
  rationale: Dans le cadre militaire gréco-romain, le terme désigne couramment des tribuns militaires ; « tribuns » est naturel en français et évite le calque peu idiomatique « chefs de mille ».
- source_word: ἑκατόνταρχοι
  choice: centurions
  rationale: Titre militaire consacré en français et correspondant directement au grec.
- source_word: πεντηκόνταρχοι
  choice: chefs de cinquante hommes
  rationale: Rend de façon transparente ce titre moins familier sans créer un terme technique obscur.
- source_word: τάγματι
  choice: rang
  rationale: Dans cette comparaison militaire, « rang » exprime naturellement la place assignée à chacun dans l’organisation.
- source_word: ἐπιτελεῖ
  choice: exécute
  rationale: Le verbe indique l’accomplissement effectif des ordres reçus.
- source_word: ἡγουμένων
  choice: chefs
  rationale: Terme général qui conserve la portée de « ceux qui dirigent » sans préciser indûment une fonction militaire particulière.
