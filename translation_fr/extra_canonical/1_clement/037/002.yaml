id: 1CLEM.37.2
reference: 1 Clement 37:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: κατανοήσωμεν τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν, πῶς εὐτάκτως, πῶς εἰκτικῶς, πῶς ὑποτεταγμένως ἐπιτελοῦσιν τὰ διατασσόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/002.yaml
  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
translation:
  language: fr
  text: 'Considérons ceux qui servent comme soldats sous les ordres de nos chefs : avec quel ordre, quelle docilité[a] et quelle soumission ils exécutent ce qui leur est commandé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « disposition à se conformer ».
    reason: Le rare adverbe εἰκτικῶς exprime le fait de céder ou de se plier volontiers à une directive; « docilité » en donne une formulation naturelle sans épuiser cette nuance.
lexical_decisions:
- source_word: κατανοήσωμεν
  choice: Considérons
  rationale: Rend l’exhortation à observer attentivement et à réfléchir.
- source_word: τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν
  choice: ceux qui servent comme soldats sous les ordres de nos chefs
  rationale: Exprime clairement le service militaire et le rapport d’autorité indiqué par le datif.
- source_word: εὐτάκτως
  choice: avec quel ordre
  rationale: Évoque la conduite ordonnée et disciplinée attendue dans un cadre militaire, tout en conservant le premier élément de la série rhétorique.
- source_word: εἰκτικῶς
  choice: quelle docilité
  rationale: Le terme désigne une attitude conciliante, disposée à céder ou à se conformer, plutôt que la simple rapidité d’exécution.
- source_word: ὑποτεταγμένως
  choice: quelle soumission
  rationale: Conserve explicitement l’idée de se placer sous l’autorité, distincte mais proche de la docilité.
- source_word: ἐπιτελοῦσιν τὰ διατασσόμενα
  choice: ils exécutent ce qui leur est commandé
  rationale: Rend naturellement l’accomplissement effectif des directives données.
theological_decisions: []
translation_notes:
  register: 'Français moderne, clair et digne. La triple série adverbiale grecque est rendue par trois groupes nominaux parallèles, formulation plus naturelle en français tout en préservant le rythme : ordre, docilité, soumission.'
