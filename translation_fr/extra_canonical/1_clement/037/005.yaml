    issue: « se soumettent d’un commun accord »
    rationale: Cette formulation ajoute l’idée d’une entente ou décision commune (« d’un commun accord »), absente de ὑποταγῇ μιᾷ χρῆται. Le grec dit littéralement qu’ils exercent ou manifestent une seule et même soumission.
