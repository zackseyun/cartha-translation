review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement l’exhortation, le parallélisme entre tête et pieds, la nécessité des plus petits membres et la finalité de préservation du corps. « Respirent ensemble » conserve utilement l’image rare de συνεπνεῖ. En revanche, « se soumettent d’un commun accord » introduit l’idée d’un accord mutuel (non exprimée) et transforme la « même/unique soumission » du grec en une manière de se soumettre.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Font preuve d’une même soumission » est plus idiomatique que le calque « font usage d’une seule soumission », tout en restant plus proche du sens que « se soumettent d’un commun accord ».
  terminology: « Soumission » rend correctement ὑποταγή sans préciser l’autorité ou l’objet de cette soumission, que le grec ne nomme pas. « Préservé » convient à σώζεσθαι dans l’image du corps maintenu intact.
  issues:
