source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
translation:
  language: fr
  text: 'Prenons notre corps : la tête n’est rien sans les pieds, et les pieds ne sont rien non plus sans la tête. Les membres les plus petits de notre corps sont nécessaires et utiles au corps tout entier. Mais tous respirent ensemble et font preuve d’une même soumission[a], afin que le corps tout entier soit préservé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « font usage d’une seule soumission ».'
    reason: Signale la formulation grecque inhabituelle ὑποταγῇ μιᾷ χρῆται. « Font preuve d’une même soumission » rend idiomatiquement l’exercice d’une soumission commune sans ajouter l’idée d’un accord mutuel ni identifier une autorité non nommée.
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  choice: Prenons notre corps
  rationale: L’exhortatif aoriste est rendu directement. « Comme exemple » est implicite dans le grec et n’a pas besoin d’être ajouté.
- source_word: οὐδέν ἐστιν
  choice: n’est rien
  rationale: Reproduit l’expression forte et symétrique du texte grec.
- source_word: τὰ ἐλάχιστα μέλη
  choice: les membres les plus petits
  rationale: Conserve le superlatif et la métaphore organique.
- source_word: συνεπνεῖ
  choice: respirent ensemble
  rationale: Rend au plus près l’image inhabituelle de la respiration commune, sans la remplacer par une simple idée d’harmonie.
- source_word: ὑποταγῇ μιᾷ χρῆται
  choice: se soumettent d’un commun accord
  rationale: Exprime naturellement en français l’exercice collectif d’une même soumission, plutôt que le calque mécanique « font usage d’une seule soumission ».
- source_word: εἰς τὸ σώζεσϑαι
  choice: afin que … soit préservé
  rationale: Rend la valeur finale de la construction et le sens contextuel de maintien ou de conservation du corps.
theological_decisions:
- issue: Nature de la soumission commune des membres
  choice: se soumettent d’un commun accord
  alternative: obéissent tous à une même autorité
  rationale: Le grec parle d’une « seule/même soumission » sans nommer explicitement l’autorité à laquelle elle s’adresse. La traduction évite de préciser ce que le texte laisse implicite.
translation_notes:
  register: Français moderne, digne et accessible. La structure corporelle et le parallélisme sont conservés; la dernière phrase privilégie une formulation naturelle tout en maintenant l’image concrète de la respiration commune.
