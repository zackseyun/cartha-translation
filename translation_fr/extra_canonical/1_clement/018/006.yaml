source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας· τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς μοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: fr
  text: 'Car voici, tu as aimé la vérité ;

    tu m’as révélé les choses inconnues et cachées de ta sagesse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γάρ
  choice: Car voici
  rationale: Conserve à la fois la valeur explicative de γάρ et l’appel d’attention de ἰδού, dans une formulation française digne et intelligible.
- source_word: ἀλήθειαν ἠγάπησας
  choice: tu as aimé la vérité
  rationale: Traduction directe qui préserve le parfait aspectuel français naturel et le sens de l’amour porté à la vérité.
- source_word: τὰ ἄδηλα καὶ τὰ κρύφια
  choice: les choses inconnues et cachées
  rationale: 'Maintient les deux qualificatifs grecs : ἄδηλα désigne ce qui n’est pas manifeste ou connu, et κρύφια ce qui demeure caché ou secret.'
- source_word: τῆς σοφίας σου
  choice: de ta sagesse
  rationale: Conserve le génitif grec sans préciser artificiellement s’il indique le contenu, l’origine ou l’appartenance.
- source_word: ἐδήλωσάς μοι
  choice: tu m’as révélé
  rationale: Rend naturellement l’idée de faire connaître ou manifester quelque chose auparavant caché.
theological_decisions:
- issue: Rapport entre les réalités cachées et la sagesse divine
  choice: « les choses inconnues et cachées de ta sagesse »
  alternative: « les mystères secrets de ta sagesse »
  rationale: La formulation retenue préserve la construction grecque et son ambiguïté sans transformer les termes généraux en catégorie théologique spécialisée.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. Le parallélisme de la phrase source est conservé par le retour à la ligne ; le tutoiement correspond à l’adresse directe à Dieu.
