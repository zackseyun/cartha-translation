id: 1CLEM.18.17
reference: 1 Clement 18:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: θυσία τῷ θεῷ πνεῦμα συντετριμμένον· καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ θεὸς οὐκ ἐξουδενώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/017.yaml
  text: 'A sacrifice to God is a broken spirit;

    a broken and humbled heart God will not despise.”'
translation:
  language: fr
  text: 'Un sacrifice pour Dieu, c’est un esprit brisé ;


    un cœur brisé et humilié, Dieu ne le méprisera pas.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία τῷ θεῷ
  choice: Le sacrifice qui plaît à Dieu
  rationale: Le grec dit littéralement «un sacrifice pour/à Dieu». Cette formulation française naturelle exprime la destination et l’acceptabilité du sacrifice sans en modifier la nature.
- source_word: πνεῦμα συντετριμμένον
  choice: un esprit brisé
  rationale: «Brisé» rend l’image forte de συντετριμμένον, qui évoque ce qui est broyé ou profondément contrit.
- source_word: καρδίαν συντετριμμένην καὶ τεταπεινωμένην
  choice: un cœur brisé et humilié
  rationale: La coordination et les deux participes sont conservés. «Humilié» rend τεταπεινωμένην sans ajouter explicitement l’idée de volontariat ou de repentance.
- source_word: οὐκ ἐξουδενώσει
  choice: ne le méprisera pas
  rationale: Rend directement le futur grec et le sens de traiter comme négligeable ou sans valeur.
theological_decisions:
- issue: Nature du sacrifice offert à Dieu
  choice: Conserver l’identification du sacrifice à «un esprit brisé»
  alternative: Paraphraser par «le sacrifice que Dieu accepte» ou «mon sacrifice à Dieu»
  rationale: Le texte grec formule une équivalence concise et cultuelle; la traduction évite d’expliciter davantage les conditions de l’acceptation divine.
- issue: Référent du pronom objet final
  choice: Employer «le», renvoyant naturellement à «un cœur»
  alternative: Répéter «ce cœur» ou laisser la construction sans objet explicite
  rationale: Le grec place «cœur» à l’accusatif comme objet de «ne méprisera pas». Le pronom français assure une syntaxe naturelle tout en gardant ce lien.
translation_notes:
  register: Français moderne, digne et accessible, avec parallélisme poétique conservé. La ponctuation finale maintient le guillemet fermant fourni par le contexte citationnel de 1 Clément 18.
