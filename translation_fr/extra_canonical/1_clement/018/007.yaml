  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: fr
  text: 'Tu m’aspergeras avec de l’hysope, et je serai purifié ;

    tu me laveras, et je serai rendu plus blanc que la neige.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς
  choice: tu m’aspergeras
  rationale: Le verbe signifie « asperger » dans un cadre de purification rituelle ; le futur est conservé.
- source_word: ὑσσώπῳ
  choice: avec de l’hysope
  rationale: Rend directement le nom de la plante et l’emploi instrumental du datif.
- source_word: καθαρισθήσομαι
  choice: je serai purifié
  rationale: Le passif futur exprime l’obtention d’un état de pureté, avec une portée rituelle et morale que « purifié » préserve.
- source_word: πλυνεῖς
  choice: tu me laveras
  rationale: Traduction directe du futur actif, en conservant le parallélisme avec le premier membre.
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  choice: je deviendrai plus blanc que la neige
  rationale: La comparaison est rendue naturellement en français ; « deviendrai » exprime le passif de changement d’état sans lourdeur.
theological_decisions:
- issue: Nature de la purification
  choice: Conserver le vocabulaire concret et cultuel de l’aspersion, du lavage et de la purification
  alternative: Expliciter une purification exclusivement morale ou spirituelle
  rationale: Le grec maintient ensemble l’image rituelle et sa portée intérieure ; la traduction ne doit pas trancher au-delà du texte.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes, ainsi que les futurs du grec.
