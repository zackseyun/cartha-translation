  text: καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/010.yaml
  text: 'Create in me a clean heart, O God,

    and renew a right spirit within me.'
translation:
  language: fr
  text: 'Crée en moi un cœur pur, ô Dieu,

    et renouvelle au plus profond de moi un esprit droit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίαν καθαρὰν
  choice: un cœur pur
  rationale: Expression française naturelle et fidèle au sens moral et intérieur du grec.
- source_word: κτίσον
  choice: Crée
  rationale: Conserve la force du verbe grec, qui désigne l’acte de créer plutôt qu’une simple transformation.
- source_word: πνεῦμα εὐθὲς
  choice: un esprit droit
  rationale: Rend littéralement l’idée d’un esprit ferme, intègre ou bien disposé, sans réduire l’ambiguïté du terme πνεῦμα.
- source_word: ἐγκαίνισον
  choice: renouvelle
  rationale: Correspond au sens de rendre nouveau ou de restaurer.
- source_word: ἐν τοῖς ἐγκάτοις μου
  choice: au plus profond de moi
  rationale: Expression idiomatique qui restitue les « parties intérieures » comme le centre intime de la personne.
theological_decisions:
- issue: Sens de πνεῦμα
  choice: esprit
  alternative: disposition intérieure
  rationale: Le terme grec peut évoquer l’esprit ou la disposition intérieure; « esprit » préserve sa portée et son ambiguïté théologique.
- issue: Valeur de εὐθὲς
  choice: droit
  alternative: ferme
  rationale: « Droit » conserve l’image grecque de rectitude, tandis que « ferme » expliciterait une nuance possible sans l’épuiser.
translation_notes:
  register: Français moderne, digne et accessible; parallélisme poétique conservé. L’invocation « ô Dieu » maintient le ton solennel de l’original.
