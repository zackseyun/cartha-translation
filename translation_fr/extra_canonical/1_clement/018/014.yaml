  text: ῥῦσαί με ἐξ αἱμάτων, ὁ θεός, ὁ θεὸς τῆς σωτηρίας μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/014.yaml
  text: Deliver me from bloodguilt, O God, the God of my salvation.
translation:
  language: fr
  text: Délivre-moi du sang versé, ô Dieu, Dieu de mon salut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαί με
  choice: Délivre-moi
  rationale: Rend directement l’impératif aoriste et l’appel personnel à une intervention salvatrice de Dieu.
- source_word: ἐξ αἱμάτων
  choice: du sang versé
  rationale: Le pluriel grec « sangs » est une expression sémitisante pouvant évoquer le meurtre, l’effusion de sang ou la culpabilité qui en découle. « Du sang versé » reste naturel en français tout en préservant une part de cette amplitude.
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  choice: Dieu de mon salut
  rationale: Formulation fidèle et dignifiée qui conserve la relation génitive sans préciser indûment si Dieu est l’auteur, la source ou le garant du salut.
theological_decisions:
- issue: Sens de ἐξ αἱμάτων
  choice: du sang versé
  alternative: de la culpabilité du meurtre
  rationale: Le grec ne nomme pas explicitement la culpabilité. La traduction choisie évite de résoudre entièrement l’ambiguïté entre effusion de sang et responsabilité liée au sang.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. L’interjection « ô Dieu » conserve l’intensité de l’adresse grecque sans archaïsme excessif.
