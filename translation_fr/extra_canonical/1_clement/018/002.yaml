source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
translation:
  language: fr
  text: 'Mais lui-même dit aussi à Dieu :


    Aie pitié de moi, ô Dieu, selon ta grande miséricorde,


    et selon l’abondance de tes compassions, efface ma transgression.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ αὐτὸς
  choice: Mais lui-même… aussi
  rationale: Conserve à la fois le contraste marqué par ἀλλά, l’ajout exprimé par καί et l’insistance de αὐτός, dans le contexte où Dieu a parlé à David et où David, à son tour, parle à Dieu.
- source_word: ἔλεος
  choice: bonté
  rationale: Dans la formule « selon ta grande bonté », ce terme rend naturellement la miséricorde bienveillante de Dieu sans répéter « pitié » juste après l’impératif.
- source_word: οἰκτιρμῶν
  choice: compassions
  rationale: Le pluriel français préserve le pluriel grec et la nuance des manifestations abondantes de la compassion divine.
- source_word: ἐξάλειψον
  choice: efface
  rationale: Rend directement l’image de supprimer une inscription ou une faute consignée.
- source_word: ἀνόμημά μου
  choice: ma transgression
  rationale: Le singulier désigne ici la faute comme violation de la loi; « transgression » est plus naturel en français que l’abstrait littéral « illégalité » tout en conservant la nuance juridique et morale.
theological_decisions:
- issue: Rapport entre la miséricorde divine et la faute humaine
  choice: Maintenir « selon ta grande bonté » et « efface ma transgression » sans explicitation doctrinale.
  alternative: Paraphraser en termes de pardon ou d’expiation.
  rationale: Le grec demande l’effacement de la faute sur le fondement de la miséricorde divine, mais ne précise pas ici le mécanisme théologique de cet effacement.
translation_notes:
  register: Français moderne, digne et accessible. La disposition en retrait poétique signale la citation scripturaire. « Ô Dieu » conserve la solennité de l’apostrophe grecque sans archaïsme excessif.
