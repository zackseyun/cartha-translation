  text: Τί δὲ εἴπωμεν ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ; πρὸς ὃν εἶπεν ὁ θεός· Εὗρον ἄνδρα κατὰ τὴν καρδίαν μου, Δαυὶδ τὸν τοῦ Ἰεσσαί, ἐν ἐλέει αἰωνίῳ ἔχρισα αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
translation:
  language: fr
  text: 'Que dirons-nous donc de David, qui a reçu un témoignage[a] ? Dieu lui a dit : « J’ai trouvé un homme selon mon cœur, David, fils de Jessé ; je l’ai oint avec une miséricorde éternelle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de David, auquel il a été rendu témoignage ». Le grec peut aussi évoquer l’idée qu’il a été attesté ou approuvé.'
    reason: Le participe grec μεμαρτυρημένῳ peut désigner celui qui a reçu un témoignage, avec une nuance contextuelle possible d’attestation ou d’approbation.
lexical_decisions:
- source_word: μεμαρτυρημένῳ
  choice: à qui témoignage a été rendu
  rationale: Le participe parfait passif indique que David a reçu un témoignage favorable et durable. Cette formulation conserve l’idée de témoignage sans préciser au-delà du grec s’il s’agit d’attestation ou d’approbation.
- source_word: κατὰ τὴν καρδίαν μου
  choice: selon mon cœur
  rationale: Expression biblique traditionnelle, claire en français et suffisamment ouverte pour préserver la portée de l’idiome grec.
- source_word: ἐν ἐλέει αἰωνίῳ
  choice: avec une miséricorde éternelle
  rationale: ἐν peut ici exprimer la manière ou le cadre de l’onction. « Avec » reste naturel tout en conservant le lien explicite entre l’onction et la miséricorde éternelle.
- source_word: ἔχρισα
  choice: j’ai oint
  rationale: Le verbe garde l’image concrète et la portée biblique de l’onction, qu’une paraphrase comme « j’ai consacré » atténuerait.
theological_decisions:
- issue: Sens du témoignage rendu à David
  choice: à qui témoignage a été rendu
  alternative: dont Dieu a rendu un témoignage favorable
  rationale: Le grec ne nomme pas explicitement Dieu comme agent du participe, même si la citation qui suit l’implique fortement. Le texte principal préserve cette légère indétermination.
- issue: Relation entre la miséricorde éternelle et l’onction
  choice: je l’ai oint avec une miséricorde éternelle
  alternative: dans une miséricorde éternelle, je l’ai oint
  rationale: La formulation retenue conserve la construction du grec sans trancher si la miséricorde désigne surtout le moyen, la manière ou la sphère de l’onction.
translation_notes:
  register: Français moderne, digne et accessible. La tournure interrogative et le vocabulaire biblique (« selon mon cœur », « oint ») sont conservés sans archaïsmes inutiles.
