base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/016.yaml
  text: 'For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.'
translation:
  language: fr
  text: 'Car, si tu avais voulu un sacrifice, je te l’aurais offert ;

    les holocaustes ne te plairont pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠθέλησας
  choice: tu avais voulu
  rationale: Le plus-que-parfait français rend naturellement l’irréel exprimé par εἰ avec l’aoriste, en corrélation avec ἔδωκα ἄν.
- source_word: θυσίαν
  choice: un sacrifice
  rationale: Traduction directe du singulier θυσίαν, avec l’article indéfini requis en français courant.
- source_word: ἔδωκα ἄν
  choice: je te l’aurais offert
  rationale: Le conditionnel passé rend la valeur irréelle de ἄν ; « offert » convient mieux que « donné » dans le contexte cultuel, et le pronom indirect explicite naturellement le destinataire implicite.
- source_word: ὁλοκαυτώματα
  choice: les holocaustes
  rationale: Terme cultuel français traditionnel et précis pour des sacrifices entièrement consumés.
- source_word: οὐκ εὐδοκήσεις
  choice: ne te plairont pas
  rationale: Conserve le futur de l’indicatif et exprime simplement l’idée de trouver plaisir ou agrément.
theological_decisions:
- issue: Portée de la négation concernant les holocaustes
  choice: 'Conserver l’énoncé direct au futur : « ne te plairont pas »'
  alternative: « tu ne prends pas plaisir aux holocaustes »
  rationale: Le grec transmis porte le futur εὐδοκήσεις ; la traduction le maintient sans transformer l’affirmation en maxime générale au présent ni en tirer une conclusion doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La structure poétique en deux membres est conservée ; aucun marqueur de note n’est nécessaire.
