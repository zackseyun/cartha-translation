source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
translation:
  language: fr
  text: 'Car voici que j’ai été conçu dans des iniquités,


    et que, dans des péchés, ma mère m’a porté[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a conçu ».'
    reason: Le verbe grec ἐκίσσησέν, dans cette citation du grec des Psaumes, peut renvoyer à la conception ou au fait d’être enceinte ; la note préserve cette nuance lexicale.
lexical_decisions:
- source_word: ἀνομίαις
  choice: actes contraires à la loi
  rationale: Rend le pluriel de ἀνομία et son idée fondamentale de violation de la loi, dans une formulation compréhensible en français moderne.
- source_word: συνελήμφθην
  choice: j’ai été conçu
  rationale: Le passif de συλλαμβάνω désigne ici la conception.
- source_word: ἐκίσσησέν
  choice: m’a porté
  rationale: Dans ce contexte de grossesse et de naissance, « m’a porté » exprime naturellement le fait que la mère a été enceinte de l’enfant, tout en distinguant ce verbe de συνελήμφθην; une note conserve la traduction plus littérale possible.
- source_word: ἁμαρτίαις
  choice: péchés
  rationale: Conserve le pluriel grec et le vocabulaire moral et théologique courant de ἁμαρτία.
theological_decisions:
- issue: Portée de la mention des actes contraires à la loi et des péchés
  choice: Conserver la formulation à la première personne sans expliciter une doctrine sur la transmission du péché.
  alternative: Paraphraser en affirmant soit la culpabilité personnelle dès la conception, soit seulement le contexte pécheur des parents.
  rationale: Le grec demeure poétique et théologiquement tendu; la traduction ne doit pas trancher ce que le verset ne précise pas.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique et les pluriels du grec sont conservés; « Car voici » rend la transition emphatique ἰδοὺ γάρ.
