  text: ἀπόστρεψον τὸ πρόσωπόν σου ἀπὸ τῶν ἁμαρτιῶν μου, καὶ πάσας τὰς ἀνομίας μου ἐξάλειψον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/009.yaml
  text: 'Turn your face away from my sins,

    and blot out all my lawless deeds.'
translation:
  language: fr
  text: 'Détourne ton visage de mes péchés,


    et efface toutes mes transgressions.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστρεψον τὸ πρόσωπόν σου
  choice: Détourne ton visage
  rationale: Rend directement l’image grecque tout en restant naturel dans un registre biblique français.
- source_word: ἁμαρτιῶν
  choice: péchés
  rationale: Équivalent courant et précis pour les manquements envisagés devant Dieu.
- source_word: ἀνομίας
  choice: fautes
  rationale: Dans cette citation du Psaume 51, le terme désigne les actes coupables ou transgressions; « fautes » conserve la distinction avec « péchés » sans suggérer seulement des infractions juridiques.
- source_word: ἐξάλειψον
  choice: efface
  rationale: Conserve la métaphore grecque de l’effacement complet d’une inscription ou d’une dette.
theological_decisions:
- issue: Rapport entre ἁμαρτίαι et ἀνομίαι
  choice: Distinguer « péchés » et « fautes »
  alternative: Employer « actes contraires à la loi » pour ἀνομίαι
  rationale: Le parallélisme rapproche deux désignations de la culpabilité sans nécessairement les rendre identiques; « fautes » maintient cette nuance sans surinterprétation légaliste.
translation_notes:
  register: Tutoiement conforme à l’adresse directe à Dieu; formulation poétique, sobre et digne, avec parallélisme sur deux lignes.
