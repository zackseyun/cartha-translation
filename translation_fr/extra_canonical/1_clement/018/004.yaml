id: 1CLEM.18.4
reference: 1 Clement 18:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
translation:
  language: fr
  text: 'Contre toi, toi seul, j’ai péché,

    et j’ai fait ce qui est mal devant toi,

    afin que tu sois reconnu juste dans tes paroles

    et que tu l’emportes quand tu entres en jugement.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « quand tu juges » ; autre traduction possible : « quand tu es jugé ».'
    reason: La forme grecque κρίνεσθαι peut être comprise comme moyenne (« entrer en jugement », éventuellement « juger » dans ce contexte) ou comme passive (« être jugé »).
lexical_decisions:
- source_word: σοὶ μόνῳ
  choice: contre toi, toi seul
  rationale: Reproduit l’insistance du grec tout en donnant une tournure française naturelle.
- source_word: τὸ πονηρόν
  choice: ce qui est mal
  rationale: Rend le substantif neutre de façon claire sans en restreindre la portée à un acte particulier.
- source_word: δικαιωθῇς
  choice: sois reconnu juste
  rationale: Exprime ici la manifestation ou la confirmation de la justice de Dieu, plutôt qu’une transformation morale.
- source_word: νικήσῃς
  choice: tu l’emportes
  rationale: Conserve l’image de victoire dans une contestation ou un jugement, dans un français idiomatique.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: quand tu entres en jugement
  rationale: Préserve l’ambiguïté de la forme moyenne/passive et son cadre judiciaire sans décider explicitement si Dieu juge ou est jugé.
theological_decisions:
- issue: Valeur de κρίνεσθαι appliqué à Dieu
  choice: quand tu entres en jugement
  alternative: quand tu juges / quand tu es jugé
  rationale: La forme peut recevoir une lecture moyenne ou passive, et l’histoire de l’interprétation reflète cette tension. La formulation retenue conserve l’imagerie judiciaire sans imposer l’une des deux lectures.
- issue: Portée de ὅπως ἂν
  choice: afin que
  alternative: de sorte que
  rationale: Le grec reprend la formulation scripturaire et peut exprimer le résultat ou la finalité. « Afin que » conserve la construction traditionnelle et la tension théologique du texte.
translation_notes:
  register: Français moderne, digne et lisible, avec disposition poétique correspondant à la citation du psaume. La formulation évite de trancher une ambiguïté grammaticale et théologique réelle.
