source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπʼ ἐμοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: fr
  text: 'Ne me rejette pas loin de ta présence,


    et ne retire pas de moi ton Esprit saint.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου
  choice: Ne me rejette pas loin de ta présence
  rationale: « Rejeter loin de » rend la force de ἀπορίπτω, tandis que « ta présence » exprime naturellement l’idiome grec littéralement formulé « ton visage ».
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  choice: ton Esprit saint
  rationale: La formulation conserve le possessif et la qualification explicite « saint » du grec, dans un français biblique actuel.
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  choice: ne me retire pas
  rationale: ἀνταναιρέω signifie ici enlever ou retirer. La tournure française évite d’ajouter l’idée non explicite de « reprendre » au sens de reprendre ce qui avait été donné.
theological_decisions:
- issue: Nature et action de l’Esprit saint
  choice: Conserver simplement « ton Esprit saint » et la demande de ne pas le retirer
  alternative: Préciser une doctrine sur la présence, le don ou la perte de l’Esprit
  rationale: Le texte formule une supplication sans expliquer son cadre doctrinal; la traduction préserve cette tension sans interprétation confessionnelle ajoutée.
translation_notes:
  register: Français moderne, clair et digne, avec parallélisme poétique. « Présence » est préféré au littéral « visage » parce qu’il restitue ici l’expression idiomatique grecque; « Esprit saint » suit la capitalisation française usuelle du nom « Esprit ».
