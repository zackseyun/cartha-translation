  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
translation:
  language: fr
  text: 'Rends-moi la joie de ton salut,


    et soutiens-moi par un esprit bien disposé[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit directeur » ou « un esprit qui guide ». L’adjectif grec peut évoquer ce qui conduit ou gouverne; dans cette citation, il est aussi compris comme un esprit disposé à agir volontairement.
    reason: Préserve la nuance directrice de ἡγεμονικός tout en signalant l’interprétation contextuelle retenue dans le texte.
lexical_decisions:
- source_word: ἀπόδος
  choice: Rends-moi
  rationale: L’impératif signifie littéralement « rends » ou « restitue » et exprime ici le rétablissement de ce qui a été perdu.
- source_word: ἀγαλλίασιν
  choice: la joie
  rationale: Le nom désigne une joie vive, une allégresse. « Joie » est naturel en français moderne tout en convenant au registre poétique.
- source_word: τοῦ σωτηρίου σου
  choice: de ton salut
  rationale: Cette formulation conserve le rapport génitif du grec et son expression concise.
- source_word: στήριξόν με
  choice: affermis-moi
  rationale: Le verbe signifie rendre ferme, soutenir ou maintenir stable ; « affermis-moi » restitue clairement l’idée de stabilité intérieure.
- source_word: πνεύματι ἡγεμονικῷ
  choice: par un esprit bien disposé
  rationale: Le datif indique le moyen. Dans ce contexte, ἡγεμονικός peut évoquer un esprit volontaire et disposé, mais son sens directeur ou conducteur demeure possible et est signalé en note.
theological_decisions:
- issue: Sens de πνεῦμα ἡγεμονικόν
  choice: un esprit bien disposé
  alternative: un esprit qui guide / un esprit directeur
  rationale: Le grec permet une nuance de volonté généreuse ou de capacité directrice. Le texte principal retient une formulation idiomatique sans identifier explicitement cet esprit à l’Esprit saint, tandis que la note préserve l’autre lecture.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme de la citation est conservé sur deux lignes, avec un vocabulaire accessible et digne.
