  text: διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπιστρέψουσιν ἐπὶ σέ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/013.yaml
  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: fr
  text: 'J’enseignerai tes voies à ceux qui sont sans loi,


    et les impies se tourneront vers toi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάξω
  choice: J’enseignerai
  rationale: Rend directement le futur actif grec à la première personne.
- source_word: ἀνόμους
  choice: ceux qui vivent sans loi
  rationale: Exprime substantivement ἀνόμους dans un français naturel, tout en conservant l’idée de personnes qui rejettent ou transgressent la loi.
- source_word: τὰς ὁδούς σου
  choice: tes voies
  rationale: Conserve la métaphore biblique des voies, qui désigne la conduite et les desseins de Dieu.
- source_word: ἀσεβεῖς
  choice: les impies
  rationale: Terme français courant et digne pour ceux qui manquent de respect ou de fidélité envers Dieu.
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  choice: se tourneront vers toi
  rationale: Rend le mouvement d’orientation ou de conversion vers Dieu sans ajouter explicitement l’idée d’un retour, absente de la formulation grecque.
theological_decisions:
- issue: Portée de ἐπιστρέψουσιν
  choice: se tourneront vers toi
  alternative: reviendront à toi
  rationale: Le grec indique un mouvement vers Dieu, mais ne précise pas nécessairement que ces personnes lui étaient auparavant attachées; la traduction préserve cette ouverture.
translation_notes:
  register: Français moderne, clair et digne; parallélisme poétique conservé. Aucun marqueur de note n’est requis.
