source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με· ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μου ἐστιν διαπαντός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: fr
  text: 'Lave-moi encore davantage de mon iniquité,


    et purifie-moi de mon péché.


    Car je connais mon iniquité,


    et mon péché est constamment devant moi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον
  choice: toujours davantage
  rationale: Exprime naturellement en français l’idée d’un accroissement ou d’une intensification de l’action.
- source_word: πλῦνόν με
  choice: Lave-moi
  rationale: Rend directement l’image concrète du lavage, distincte du verbe suivant « purifier ».
- source_word: ἀνομία
  choice: mépris de ta loi
  rationale: Restitue ici la notion d’opposition à la loi divine plutôt qu’une simple absence abstraite de loi; l’ajout de « ta » explicite le référent divin impliqué par le contexte de la prière.
- source_word: ἁμαρτία
  choice: péché
  rationale: Équivalent français courant et précis dans ce contexte confessionnel.
- source_word: διαπαντός
  choice: constamment
  rationale: Rend la continuité exprimée par l’adverbe sans lourdeur.
theological_decisions:
- issue: Sens de ἀνομία
  choice: mépris de ta loi
  alternative: iniquité / faute / transgression
  rationale: Le choix conserve la dimension de violation ou de rejet de la loi, tout en restant intelligible; il ne confond pas entièrement ἀνομία avec ἁμαρτία, également présent dans le verset.
- issue: Présence continuelle du péché devant le locuteur
  choice: mon péché est constamment devant moi
  alternative: mon péché reste toujours sous mes yeux
  rationale: La formulation demeure littérale et préserve la tension entre conscience, culpabilité et confession sans préciser davantage la nature de cette présence.
translation_notes:
  register: Français moderne, digne et accessible, avec parallélisme poétique conservé. Le tutoiement convient à l’adresse directe à Dieu dans la prière et s’accorde avec l’impératif singulier grec.
