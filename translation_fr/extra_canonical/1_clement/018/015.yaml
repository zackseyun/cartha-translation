  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: fr
  text: 'Ma langue exultera de ta justice.


    Seigneur, tu ouvriras ma bouche,


    et mes lèvres proclameront ta louange.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: exultera
  rationale: Rend la joie intense exprimée par le verbe grec, dans un registre digne et naturel.
- source_word: τὴν δικαιοσύνην σου
  choice: à cause de ta justice
  rationale: L’accusatif grec après ἀγαλλιάσεται exprime ici vraisemblablement le motif ou l’objet de l’exultation; cette formulation française évite l’étrange «exulter ta justice».
- source_word: ἀναγγελεῖ
  choice: proclameront
  rationale: Exprime l’annonce publique et déclarative du verbe grec sans alourdir la phrase.
- source_word: τὴν αἴνεσίν σου
  choice: ta louange
  rationale: Conserve le singulier grec et la formulation traditionnelle, aisément compréhensible en français moderne.
