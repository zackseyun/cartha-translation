source:
  edition: Funk 1901 (normalized OCR)
  text: ἀκουτιεῖς με ἀγαλλίασιν καὶ εὐφροσύνην, ἀγαλλιάσονται ὀστᾶ τεταπεινωμένα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/008.yaml
  text: 'You will make me hear gladness and joy;

    the bones that have been humbled will rejoice.'
translation:
  language: fr
  text: 'Tu me feras entendre l’allégresse et la joie ;

    les os humiliés exulteront.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουτιεῖς με
  choice: Tu me feras entendre
  rationale: 'Rend directement la construction causative au futur : « tu feras que j’entende ».'
- source_word: ἀγαλλίασιν καὶ εὐφροσύνην
  choice: l’allégresse et la joie
  rationale: Conserve les deux noms coordonnés et leur nuance distincte dans un français naturel et digne.
- source_word: ἀγαλλιάσονται
  choice: exulteront
  rationale: Reproduit le verbe de vive réjouissance, apparenté au premier nom ἀγαλλίασιν, sans l’aplatir en simple « se réjouir ».
- source_word: ὀστᾶ τεταπεινωμένα
  choice: les os humiliés
  rationale: Préserve l’image corporelle et le participe passif accompli, sans préciser la nature de l’abaissement.
theological_decisions:
- issue: Sens métaphorique des « os humiliés »
  choice: Maintien littéral de l’image
  alternative: les os brisés / écrasés
  rationale: Le grec porte τεταπεινωμένα, « humiliés, abaissés », et non un terme signifiant explicitement « brisés » ; la formulation conserve donc l’ambiguïté poétique et théologique.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, ainsi que le passage de l’écoute personnelle à l’exultation des os.
source_grounding:
  english_pob_role: consult_only
