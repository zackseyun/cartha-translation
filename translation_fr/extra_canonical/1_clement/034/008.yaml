  - severity: low
    issue: Nuance d’endurance de ὑπομένουσιν limitée au renvoi de note
    rationale: Le simple « l’attendent » est possible, mais « avec persévérance » rend dans le texte la composante durable/endurance du verbe grec, que la note identifiait elle-même.
