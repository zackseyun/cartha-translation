  to: 'Car il dit : « Ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu et ce qui n’est pas venu à l’esprit d’un être humain, voilà ce qu’il a préparé pour ceux qui l’attendent avec persévérance. »'
