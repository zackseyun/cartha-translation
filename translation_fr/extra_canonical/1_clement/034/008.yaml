  text: λέγει γάρ· Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ὅσα ἡτοίμασεν τοῖς ὑπομένουσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
translation:
  language: fr
  text: 'Car il dit : « Ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu et ce qui n’est pas venu à l’esprit d’un être humain, voilà ce qu’il a préparé pour ceux qui l’attendent avec persévérance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: ce qui n’est pas monté au cœur de l’être humain
  rationale: Conserve l’image sémitisante du grec tout en restant intelligible en français; elle signifie que la chose n’est pas venue à l’esprit humain.
- source_word: τοῖς ὑπομένουσιν αὐτόν
  choice: pour ceux qui l’attendent
  rationale: Dans ce contexte, ὑπομένω avec un complément de personne exprime l’attente persévérante; « l’attendent » est naturel et conserve cette orientation vers Dieu.
- source_word: ὅσα
  choice: ce que … voilà ce que
  rationale: La reprise française donne une phrase claire et restitue la portée globale du relatif neutre pluriel sans imposer artificiellement un pluriel lexical.
- source_word: ἀνθρώπου
  choice: de l’être humain
  rationale: Rend le générique ἄνθρωπος en français moderne sans le limiter au sexe masculin.
theological_decisions:
- issue: Référent implicite de « il » dans ἡτοίμασεν
  choice: maintenir le pronom « il »
  alternative: expliciter « Dieu »
  rationale: Le grec ne nomme pas ici le sujet; conserver le pronom évite d’ajouter au texte, même si le contexte désigne Dieu.
- issue: Nuance de ὑπομένουσιν
  choice: « ceux qui l’attendent »
  alternative: « ceux qui persévèrent pour lui » ou « ceux qui mettent en lui leur espérance »
  rationale: L’attente est la valeur contextuelle la plus probable, mais elle implique une attente fidèle et persévérante; la note signale cette nuance sans la transformer en formulation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La formulation garde le parallélisme solennel de la citation et son image du cœur, tout en évitant le masculin générique par « l’être humain ».
