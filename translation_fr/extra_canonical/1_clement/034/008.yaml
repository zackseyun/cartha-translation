review_pass:
  verdict: revise
  source_fidelity: Le sens global est bien rendu, y compris le sujet implicite de « il ». Toutefois, ἀνέβη ἐπὶ καρδίαν est un idiome signifiant qu’une chose n’est pas venue à l’esprit; « n’est pas monté au cœur » est un calque peu naturel en français moderne. Le présent de ὑπομένουσιν αὐτόν comporte aussi une idée d’attente endurante que la traduction principale peut exprimer sans ambiguïté.
  naturalness: La construction avec « voilà ce que » est claire et conserve le mouvement solennel de la citation. La correction de l’idiome du « cœur » rend le français plus idiomatique tout en préservant son sens. « Attendent avec persévérance » est naturel dans ce registre.
  terminology: « être humain » rend correctement le générique ἀνθρώπου. Le pronom « il » conserve à juste titre l’implicite grec. « Attendent avec persévérance » restitue la nuance d’endurance de ὑπομένω sans imposer une interprétation doctrinale.
  issues:
