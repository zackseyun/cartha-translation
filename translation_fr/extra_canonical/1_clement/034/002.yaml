  yaml_path: translation/extra_canonical/1_clement/034/002.yaml
  text: Therefore we must be eager for doing good[a], for from him are all things.
translation:
  language: fr
  text: Il nous faut donc être pleins d’ardeur pour faire le bien, car tout vient de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖν ... ἐστὶ
  choice: Il nous faut
  rationale: Rend naturellement en français l’idée de nécessité ou d’obligation exprimée par δεῖν ἐστὶ.
- source_word: προθύμους
  choice: pleins d’ardeur
  rationale: Exprime la disposition empressée et volontaire du terme grec, dans un registre digne et courant.
- source_word: εἰς ἀγαθοποιΐαν
  choice: pour faire le bien
  rationale: Rend la direction vers l’action bienfaisante indiquée par εἰς avec le nom d’action ἀγαθοποιΐα, sans lourdeur nominale.
- source_word: ἐξ αὐτοῦ γάρ ἐστιν τὰ πάντα
  choice: car tout vient de lui
  rationale: Préserve l’origine exprimée par ἐξ et traduit τὰ πάντα de manière idiomatique.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: lui, sans explicitation
  alternative: Dieu
  rationale: Le grec emploie un pronom; ne pas remplacer celui-ci par un nom préserve la formulation et le lien avec le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « pleins d’ardeur pour faire le bien » conserve à la fois l’empressement intérieur et son orientation vers l’action.
