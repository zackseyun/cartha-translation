    issue: « ne rester » dépasse légèrement le verbe grec εἶναι
    rationale: Le grec demande simplement de « ne pas être » oisifs ou négligents; « rester » introduit une idée de persistance qui n’est pas nécessaire.
  - severity: low
    issue: « relâchés » est moins net pour παρειμένους
    rationale: Dans ce contexte, le terme désigne plus naturellement le manque de diligence ou la négligence dans l’action; « négligents » le communique clairement.
