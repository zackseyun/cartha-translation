review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’exhortation vise les croyants « de tout leur cœur » et leur demande de ne pas être ἀργούς ni παρειμένους à l’égard de toute bonne œuvre. Toutefois, « ne rester » ajoute une nuance durative non exprimée par εἶναι, et « relâchés » est moins précis dans ce contexte d’activité et de diligence.'
  naturalness: La phrase est claire et de registre approprié. « Ne pas être inactifs ni négligents dans toute bonne œuvre » est plus direct, plus idiomatique et rend plus naturellement l’opposition grecque.
  terminology: « Exhorte », « croyons en lui » et « de tout notre cœur » conviennent. « Négligents » rend ici mieux παρειμένους (« relâchés », « laxistes », « défaillants ») sans imposer d’interprétation. L’ordre usuel « toute bonne œuvre » est préférable à « toute œuvre bonne » en français moderne.
  issues:
