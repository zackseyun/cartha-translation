id: 1CLEM.34.4
reference: 1 Clement 34:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: προτρέπεται οὖν ἡμᾶς πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ, μὴ ἀργοὺς μηδὲ παρειμένους εἶναι ἐπὶ πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/004.yaml
  text: Therefore he urges us, who believe in him with our whole heart, not to be idle or negligent in every good work.
translation:
  language: fr
  text: Il nous exhorte donc, nous qui croyons en lui de tout notre cœur, à ne pas être inactifs ni négligents dans toute bonne œuvre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτρέπεται
  choice: exhorte
  rationale: Rend l’idée d’une vive incitation, dans un registre digne et naturel.
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  choice: nous qui croyons en lui de tout notre cœur
  rationale: Conserve le participe qui qualifie « nous » et exprime naturellement en français la confiance placée en lui.
- source_word: ἀργοὺς μηδὲ παρειμένους
  choice: ni inactifs ni relâchés
  rationale: « Inactifs » traduit l’absence d’œuvre, tandis que « relâchés » conserve l’idée d’un manque de vigueur ou d’application.
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  choice: dans l’accomplissement de toute œuvre bonne
  rationale: Évite l’ambiguïté française de « négligents dans toute bonne œuvre » et maintient la portée distributive de πᾶν.
theological_decisions:
- issue: Référent du pronom αὐτῷ
  choice: lui
  alternative: Dieu / le Seigneur
  rationale: Le verset grec emploie seulement un pronom; la traduction préserve ce référent contextuel sans l’expliciter théologiquement.
translation_notes:
  register: Français international moderne, clair et digne. La construction a été légèrement explicitée par « dans l’accomplissement » afin que l’exhortation porte sans ambiguïté sur l’engagement dans toute œuvre bonne.
