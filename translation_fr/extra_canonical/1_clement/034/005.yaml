id: 1CLEM.34.5
reference: 1 Clement 34:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ καύχημα ἡμῶν καὶ ἡ παρρησία ἔστω ἐν αὐτῷ· ὑποτασσώμεθα τῷ θελήματι αὐτοῦ· κατανοήσωμεν τὸ πᾶν πλῆθος τῶν ἀγγέλων αὐτοῦ, πῶς τῷ θελήματι αὐτοῦ λειτουργοῦσιν παρεστῶτες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: fr
  text: Que notre fierté et notre assurance soient en lui. Soumettons-nous à sa volonté. Considérons toute la multitude de ses anges, comment ils se tiennent auprès de lui et se mettent au service de sa volonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχημα
  choice: fierté
  rationale: Rend ici le motif légitime de se glorifier, placé « en lui », dans un français naturel, sans introduire une nuance explicitement négative.
- source_word: παρρησία
  choice: assurance
  rationale: Exprime la confiance ouverte et hardie suggérée par le terme grec; « franchise » conviendrait moins bien dans cette construction.
- source_word: ὑποτασσώμεθα
  choice: soumettons-nous
  rationale: Conserve la force exhortative du subjonctif et l’idée de se placer sous l’autorité de la volonté divine.
- source_word: κατανοήσωμεν
  choice: considérons
  rationale: Traduit l’appel à observer attentivement et à réfléchir, dans un registre courant et digne.
- source_word: λειτουργοῦσιν
  choice: servent
  rationale: Rend le service accompli par les anges sans imposer au terme une spécialisation liturgique absente du contexte immédiat.
- source_word: παρεστῶτες
  choice: ils se tiennent devant lui
  rationale: Le participe parfait décrit leur présence établie auprès de Dieu; « devant lui » rend naturellement la posture de service, bien que le pronom soit implicité en grec.
theological_decisions:
- issue: Rapport des anges à la volonté de Dieu
  choice: « servent sa volonté »
  alternative: « accomplissent un service selon sa volonté »
  rationale: La formulation conserve la construction grecque inhabituelle où la volonté est au datif, sans préciser davantage si celui-ci indique l’objet, la norme ou la conformité.
- issue: Référent des pronoms masculins
  choice: « lui / sa volonté » sans ajouter « Dieu »
  alternative: expliciter « Dieu / la volonté de Dieu »
  rationale: Le grec emploie des pronoms dont le référent vient du contexte; la traduction préserve cette cohésion sans ajouter une identification absente du verset isolé.
translation_notes:
  register: Français international moderne, exhortatif et digne. Les trois propositions grecques sont conservées, avec deux impératifs inclusifs (« Soumettons-nous », « Considérons »). Aucun marqueur de note n’est requis.
