review_pass:
  verdict: revise
  source_fidelity: La première et la deuxième exhortations rendent fidèlement le grec. Dans la troisième, le grec introduit explicitement l’observation par πῶς (« comment ») et présente les anges comme « se tenant auprès de lui » tout en accomplissant leur service envers/selon sa volonté. La version révisée restitue plus directement cette articulation.
  naturalness: Le français révisé reste fluide, moderne et digne. « Se tiennent auprès de lui » est plus neutre et plus proche de παρεστῶτες que « se tiennent devant lui », sans alourdir la phrase.
  terminology: « Fierté », « assurance », « soumettons-nous », « anges » et « volonté » conviennent au registre et n’imposent aucune lecture confessionnelle. « Se mettent au service de sa volonté » rend naturellement λειτουργοῦσιν avec le datif, sans trancher indûment entre service rendu à la volonté et action conforme à elle.
  issues:
  - severity: low
    issue: La relation introduite par πῶς n’est pas explicitement conservée.
    rationale: '« Considérons … : ils se tiennent… » transforme le « comment ils… » grec en simple assertion après deux-points. Le sens général demeure, mais la formulation source invite précisément à considérer la manière dont les anges servent.'
  - severity: low
    issue: « Devant lui » est plus spécifique que παρεστῶτες.
    rationale: Le participe signifie d’abord « se tenant auprès de / présents auprès de ». « Devant » est possible en contexte de cour, mais « auprès de » préserve mieux la nuance spatiale sans la préciser.
  revised_text: Que notre fierté et notre assurance soient en lui. Soumettons-nous à sa volonté. Considérons toute la multitude de ses anges, comment ils se tiennent auprès de lui et se mettent au service de sa volonté.
