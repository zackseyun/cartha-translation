source:
  edition: Funk 1901 (normalized OCR)
  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
translation:
  language: fr
  text: 'Car il nous dit d’avance : « Voici le Seigneur, et sa récompense est devant lui, pour rendre à chacun selon son œuvre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προλέγει
  choice: dit d’avance
  rationale: Rend le sens premier de « dire à l’avance » sans imposer la nuance plus forte d’un avertissement.
- source_word: ὁ μισθὸς αὐτοῦ
  choice: sa récompense
  rationale: « Récompense » convient au contexte de la rétribution, tout en laissant la suite préciser qu’elle est accordée selon l’œuvre de chacun.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: devant lui
  rationale: Expression française naturelle qui conserve l’idée de présence portée par le grec, sans le calque peu idiomatique « devant son visage ».
- source_word: ἀποδοῦναι
  choice: pour rendre
  rationale: Préserve la valeur de restitution ou de rétribution du verbe grec et le lien final avec la venue du Seigneur.
- source_word: κατὰ τὸ ἔργον αὐτοῦ
  choice: selon son œuvre
  rationale: Le singulier collectif du grec est maintenu; « œuvre » désigne ici l’ensemble de la conduite ou de l’action propre à chacun.
theological_decisions:
- issue: Nature de la rétribution divine
  choice: « rendre à chacun selon son œuvre »
  alternative: « récompenser chacun selon ses actes »
  rationale: La formulation retenue conserve la tension du texte entre récompense et jugement, sans réduire ἀποδοῦναι à une récompense exclusivement favorable ni expliciter une doctrine du mérite.
translation_notes:
  register: Français moderne, digne et accessible. La structure de la citation demeure proche du grec, notamment l’ouverture solennelle « Voici le Seigneur » et le singulier « son œuvre ».
