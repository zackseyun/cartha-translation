  source_fidelity: Le sens et l’antithèse du grec sont bien rendus. « Le pain de son travail » conserve justement l’image de la subsistance obtenue par le travail, et « regarder son employeur en face » exprime naturellement οὐκ ἀντοφθαλμεῖ. « Avec assurance » est une restitution recevable de μετὰ παρρησίας dans ce contexte.
