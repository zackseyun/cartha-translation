  terminology: « Ouvrier » et « employeur » sont clairs et conviennent au contraste de travail. « Paresseux et négligent » distingue de façon naturelle l’indolence (νωθρός) du manque d’application / laisser-aller (παρειμένος), sans introduire d’interprétation doctrinale.
