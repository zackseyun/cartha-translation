source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἀγαθὸς ἐργάτης μετὰ παρρησίας λαμβάνει τὸν ἄρτον τοῦ ἔργου αὐτοῦ, ὁ νωθρὸς καὶ παρειμένος οὐκ ἀντοφθαλμεῖ τῷ ἐργοδότῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/001.yaml
  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: fr
  text: Le bon ouvrier reçoit avec assurance le pain de son travail, mais celui qui est paresseux et négligent n’ose pas regarder son employeur en face.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἐργάτης
  choice: le bon ouvrier
  rationale: Rend directement l’expression grecque dans un français naturel et digne.
- source_word: μετὰ παρρησίας
  choice: avec assurance
  rationale: παρρησία évoque ici la confiance et la liberté d’attitude avec lesquelles le bon ouvrier reçoit ce qui lui revient; « assurance » préserve ce sens sans suggérer une simple audace.
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  choice: le pain de son travail
  rationale: Conserve l’image concrète du pain comme fruit ou subsistance provenant du travail.
- source_word: νωθρὸς καὶ παρειμένος
  choice: paresseux et relâché
  rationale: 'Les deux adjectifs sont maintenus: νωθρός désigne l’indolence, tandis que παρειμένος exprime le relâchement ou le manque d’application.'
- source_word: οὐκ ἀντοφθαλμεῖ
  choice: n’ose pas regarder … en face
  rationale: L’expression signifie littéralement faire face du regard; cette formulation idiomatique française en restitue la honte ou le défaut d’assurance sans surcharger le texte.
- source_word: ἐργοδότῃ
  choice: employeur
  rationale: Le mot désigne celui qui fournit ou assigne le travail; « employeur » est clair en français moderne, même si « maître d’œuvre » serait possible dans un cadre ancien.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. La structure antithétique du grec est conservée, ainsi que l’image du « pain » gagné par le travail.
