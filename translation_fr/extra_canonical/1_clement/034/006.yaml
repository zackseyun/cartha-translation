id: 1CLEM.34.6
reference: 1 Clement 34:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: fr
  text: 'Car l’Écriture dit : « Des myriades de myriades se tenaient auprès de lui, et des milliers de milliers le servaient », et ils criaient : « Saint, saint, saint est le Seigneur Sabaoth[a] ; toute la création est remplie de sa gloire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sabaoth » transcrit un terme hébreu qui signifie « armées » ; il s’agit du titre « Seigneur des armées ».
    reason: Le terme translittéré est peu transparent pour les lecteurs francophones modernes.
lexical_decisions:
- source_word: Μύριαι μυριάδες
  choice: Des myriades de myriades
  rationale: Rend directement l’expression grecque tout en évoquant une multitude innombrable, sans la réduire à un calcul précis.
- source_word: παρειστήκεισαν αὐτῷ
  choice: se tenaient devant lui
  rationale: Exprime la présence en position de service auprès d’un souverain ; « devant lui » est naturel dans ce contexte céleste.
- source_word: ἐλειτούργουν αὐτῷ
  choice: le servaient
  rationale: Rend clairement le service accompli pour Dieu sans imposer ici un sens exclusivement liturgique.
- source_word: πᾶσα ἡ κτίσις
  choice: toute la création
  rationale: Conserve la portée cosmique de κτίσις et la formulation collective du grec.
theological_decisions:
- issue: Sens du titre κύριος σαβαώθ
  choice: Seigneur Sabaoth, avec une note
  alternative: Seigneur des armées
  rationale: Le texte grec conserve la translittération σαβαώθ. La traduction maintient cette forme reçue tout en donnant son sens dans une note, sans trancher les nuances possibles du titre.
translation_notes:
  register: Français moderne, digne et accessible. La cadence solennelle de la double citation et la triple répétition de « saint » sont conservées.
