  revision_rationale: La révision restitue l’accent de ἐπὶ τὸ αὐτό («tous ensemble»), remplace une expression française peu idiomatique et légèrement surinterprétative par un rendu contextuel naturel, et conserve l’ambiguïté lexicale au moyen d’une note ancrée. Elle rend également explicite la nuance de devenir participants des promesses.
