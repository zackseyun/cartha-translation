revisions:
- from: Ainsi donc, nous aussi, rassemblés dans la concorde et unis dans une même conscience[a], crions vers lui avec ferveur, comme d’une seule bouche, afin d’avoir part à ses grandes et glorieuses promesses.
  to: Ainsi donc, nous aussi, réunis tous ensemble dans la concorde, d’un même esprit[a], crions vers lui avec ferveur, comme d’une seule bouche, afin de devenir participants de ses grandes et glorieuses promesses.
  rationale: La révision restitue l’accent de ἐπὶ τὸ αὐτό («tous ensemble»), remplace une expression française peu idiomatique et légèrement surinterprétative par un rendu contextuel naturel, et conserve l’ambiguïté lexicale au moyen d’une note ancrée. Elle rend également explicite la nuance de devenir participants des promesses.
