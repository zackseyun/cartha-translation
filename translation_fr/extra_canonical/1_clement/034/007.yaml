id: 1CLEM.34.7
reference: 1 Clement 34:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν ἐν ὁμονοίᾳ ἐπὶ τὸ αὐτὸ συναχθέντες τῇ συνειδήσει, ὡς ἐξ ἑνὸς στόματος βοήσωμεν πρὸς αὐτὸν ἐκτενῶς εἰς τὸ μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
translation:
  language: fr
  text: Ainsi donc, nous aussi, réunis tous ensemble dans la concorde, d’un même esprit[a], crions vers lui avec ferveur, comme d’une seule bouche, afin de devenir participants de ses grandes et glorieuses promesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. «avec la conscience». Le grec τῇ συνειδήσει peut évoquer une conscience, une intention ou une pensée partagée.
    reason: Le rendu «d’un même esprit» exprime naturellement le sens contextuel, tandis que la note préserve la formulation et l’ambiguïté du terme grec.
lexical_decisions:
- source_word: ὁμονοίᾳ
  choice: dans la concorde
  rationale: Rend l’idée d’accord harmonieux et d’unité collective dans un français naturel et digne.
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  choice: rassemblés
  rationale: L’expression désigne le fait de se réunir ensemble; «rassemblés» évite une redondance inutile tout en conservant l’image du rassemblement.
- source_word: τῇ συνειδήσει
  choice: unis dans une même conscience
  rationale: Conserve le sens premier de συνείδησις («conscience») tout en exprimant ici la conscience commune qui unit le groupe; «d’un même esprit» serait plus idiomatique mais lexicalement moins précis.
- source_word: βοήσωμεν
  choice: crions vers lui
  rationale: Préserve la force du verbe, qui signifie appeler ou crier à haute voix, et son orientation marquée par πρός.
- source_word: ἐκτενῶς
  choice: avec ferveur
  rationale: Dans le contexte de l’appel adressé à Dieu, exprime une prière intense et soutenue sans suggérer simplement le volume sonore.
- source_word: μετόχους ... γενέσθαι
  choice: avoir part à
  rationale: Formulation française naturelle qui rend l’idée de devenir participants ou bénéficiaires des promesses.
- source_word: ἐπαγγελιῶν
  choice: promesses
  rationale: Équivalent direct et consacré, sans ajouter de précision absente du grec.
theological_decisions:
- issue: Rapport entre l’appel collectif et la participation aux promesses
  choice: «afin d’avoir part à»
  alternative: «pour que nous devenions participants de»
  rationale: Conserve la valeur finale de εἰς τὸ avec l’infinitif et la relation exprimée par le texte, sans définir le mécanisme théologique de cette participation.
- issue: Sens de συνείδησις dans l’unité communautaire
  choice: «une même conscience»
  alternative: «un même esprit»
  rationale: Le contexte permet une notion de disposition ou de pensée commune, mais le choix retenu préserve la tension du terme grec et évite de l’assimiler sans nécessité à l’«esprit».
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le mouvement exhortatif du grec, l’image d’une seule bouche et la force de l’appel collectif. Le marqueur [a] figure dans le texte principal.
