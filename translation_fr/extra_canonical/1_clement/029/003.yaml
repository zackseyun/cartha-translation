base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/003.yaml
  text: 'And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor;

    and from that nation the Holy of Holies shall come forth.”'
translation:
  language: fr
  text: 'Et dans un autre passage, il dit :


    « Voici, le Seigneur prend pour lui une nation du milieu des nations,


    comme un homme prend les prémices de son aire de battage ;


    et de cette nation sortira ce qui est très saint[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses saintes des choses saintes », tournure intensive exprimant le plus haut degré de sainteté. On peut aussi traduire : « les choses très saintes » ou « le Saint des saints » ; le grec ne tranche pas à lui seul entre ces nuances.'
    reason: Corrige la formulation littérale de la note tout en conservant l’ambiguïté grammaticale et interprétative de ἅγια ἁγίων.
lexical_decisions:
- source_word: λαμβάνει ἑαυτῷ
  choice: prend pour lui
  rationale: Rend explicitement le datif réfléchi et l’idée d’une nation que le Seigneur se réserve.
- source_word: ἀπαρχὴν ... τῆς ἅλω
  choice: les prémices de son aire de battage
  rationale: « Prémices » conserve la notion cultuelle de première part offerte, tandis que « aire de battage » explicite le terme agricole ἅλως.
- source_word: ἅγια ἁγίων
  choice: ce qui est très saint
  rationale: Cette formulation rend l’intensification sémitique sans imposer que l’expression désigne nécessairement une personne ou le sanctuaire.
theological_decisions:
- issue: Référent de ἅγια ἁγίων
  choice: ce qui est très saint
  alternative: le Saint des saints
  rationale: Le grec neutre pluriel peut désigner des réalités ou des choses suprêmement saintes. « Le Saint des saints », masculin singulier et capitalisé, orienterait davantage le passage vers une lecture personnelle ou messianique que ne l’exige la forme grecque.
translation_notes:
  register: Français moderne, clair et digne. La disposition en lignes conserve le caractère solennel de la citation, et « aire de battage » évite l’opacité du simple mot « aire ».
