  source_fidelity: La citation reproduit fidèlement la leçon grecque de 1 Clément, notamment « les anges de Dieu », sans harmonisation avec d’autres traditions de Deutéronome 32.8. Toutefois, διέσπειρεν est un aoriste et doit être rendu par un passé simple (« dispersa »), plutôt que par l’imparfait.
  naturalness: Le français est poétique, moderne et lisible. « Jacob, son peuple » reste une apposition volontairement compacte, conforme au parallélisme de la citation ; le contexte permet de rapporter « son » au Seigneur.
  terminology: « Très-Haut », « anges de Dieu », « part du Seigneur » et « lot mesuré de son héritage » rendent de façon appropriée les termes et images du grec. « Lot mesuré » préserve l’image de σχοίνισμα sans surcharge explicative.
