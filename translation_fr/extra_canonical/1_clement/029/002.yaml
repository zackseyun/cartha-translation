base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/002.yaml
  text: 'For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    And his people Jacob became the Lord’s portion,

    Israel the measuring-line of his inheritance.”'
translation:
  language: fr
  text: 'Car il est écrit :


    « Quand le Très-Haut répartissait les nations,

    quand il dispersa les fils d’Adam,

    il fixa les frontières des peuples

    selon le nombre des anges de Dieu.


    Et Jacob, son peuple, devint la part du Seigneur,

    Israël, le lot mesuré de son héritage. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεμέριζεν
  choice: répartissait
  rationale: Rend l’idée de partager ou distribuer les nations, tout en conservant l’aspect imperfectif du verbe grec.
- source_word: διέσπειρεν
  choice: dispersait
  rationale: Exprime la dispersion des descendants d’Adam et s’accorde naturellement avec la construction temporelle.
- source_word: υἱοὺς Ἀδάμ
  choice: les fils d’Adam
  rationale: Traduction formelle de l’expression grecque, qui désigne collectivement l’humanité issue d’Adam.
- source_word: ἀγγέλων θεοῦ
  choice: des anges de Dieu
  rationale: Suit directement le texte grec cité par Clément, sans l’harmoniser avec d’autres formes textuelles de Deutéronome 32.8.
- source_word: μερὶς κυρίου
  choice: la part du Seigneur
  rationale: Conserve l’image d’une portion attribuée au Seigneur.
- source_word: σχοίνισμα κληρονομίας
  choice: le lot mesuré de son héritage
  rationale: Préserve l’image du cordeau servant à mesurer et attribuer un lot, dans une formulation française intelligible.
theological_decisions:
- issue: Référence aux anges dans la citation de Deutéronome 32.8
  choice: selon le nombre des anges de Dieu
  alternative: selon le nombre des fils d’Israël / des fils de Dieu
  rationale: Le passage doit traduire le texte grec effectivement cité dans 1 Clément, qui porte ἀγγέλων θεοῦ, sans substituer une autre tradition textuelle.
- issue: Rapport entre Jacob, Israël et l’héritage du Seigneur
  choice: Maintien du parallélisme poétique sans explicitation doctrinale
  alternative: Ajouter une explication identifiant ou interprétant le peuple choisi
  rationale: Le grec présente deux membres parallèles et ne développe pas ici leur portée théologique.
translation_notes:
  register: Français moderne, digne et lisible, avec mise en vers conservant le parallélisme de la citation scripturaire. L’imparfait dans les deux propositions temporelles reflète ὅτε avec les formes verbales du texte transmis, tandis que le passé simple marque l’action principale.
