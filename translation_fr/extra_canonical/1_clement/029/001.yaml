id: 1CLEM.29.1
reference: 1 Clement 29:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
translation:
  language: fr
  text: Approchons-nous donc de lui avec une âme sainte, levant vers lui des mains pures et sans souillure, et aimant notre Père plein de douceur et de compassion, qui a fait de nous une part choisie pour lui-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁσιότητι ψυχῆς
  choice: avec une âme sainte
  rationale: Formulation naturelle qui exprime l’état de sainteté ou de consécration de l’âme sans alourdir le français par « dans la sainteté de l’âme ».
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας
  choice: des mains pures et sans souillure
  rationale: Rend directement les deux adjectifs grecs, le second exprimant l’absence de contamination ou de profanation.
- source_word: ἐπιεικῆ καὶ εὔσπλαγχνον
  choice: plein de douceur et de compassion
  rationale: ἐπιεικής évoque ici la douceur et la bienveillance, tandis que εὔσπλαγχνος désigne une profonde compassion.
- source_word: ἐκλογῆς μέρος
  choice: la part qu’il s’est choisie
  rationale: Conserve l’idée conjointe de « part » et d’« élection » dans une tournure française idiomatique, sans réduire l’expression au seul adjectif « choisi ».
theological_decisions:
- issue: Sens de ἐκλογῆς μέρος
  choice: la part qu’il s’est choisie
  alternative: une part de son peuple choisi
  rationale: Le grec dit littéralement que Dieu a fait de « nous » une part d’élection pour lui-même. La traduction retenue préserve l’élection divine et l’idée d’appartenance, sans ajouter explicitement « peuple », absent du texte.
translation_notes:
  register: Français moderne, digne et accessible. L’impératif exhortatif pluriel et la progression participiale du grec sont conservés dans une phrase fluide.
