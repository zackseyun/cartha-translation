source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
translation:
  language: fr
  text: 'Nous t’en supplions, Maître : sois notre secours et notre protecteur. Délivre ceux d’entre nous qui sont dans la détresse ; prends pitié des humbles ; relève ceux qui sont tombés ; manifeste-toi à ceux qui sont dans le besoin ; guéris les faibles ; ramène ceux de ton peuple qui s’égarent. Nourris ceux qui ont faim ; libère nos prisonniers ; remets debout les malades ; réconforte ceux qui perdent courage. Que toutes les nations sachent que toi seul, tu es Dieu, que Jésus le Messie est ton serviteur[a], et que nous sommes ton peuple, les brebis de ton pâturage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « enfant ».
    reason: Préserver l’ambiguïté sémantique de παῖς sans introduire « fils », qui ne correspond pas directement au terme grec employé.
lexical_decisions:
- source_word: ἀξιόμεν
  choice: Nous t’en supplions
  rationale: Dans ce contexte de prière, le verbe exprime une demande pressante et respectueuse ; cette tournure est naturelle et digne en français.
- source_word: δέσποτα
  choice: Maître
  rationale: Rend l’adresse au souverain maître sans la connotation politique moderne que pourrait prendre « despote ».
- source_word: βοηθὸν ... ἀντιλήμπτορα
  choice: notre secours et notre protecteur
  rationale: 'Conserve les deux fonctions complémentaires : assistance active et soutien protecteur.'
- source_word: τοὺς πλανωμένους τοῦ λαοῦ σου
  choice: ceux de ton peuple qui s’égarent
  rationale: Le participe désigne des personnes qui errent ou s’égarent, non une abstraction.
- source_word: λύτρωσαι
  choice: délivre
  rationale: Le verbe peut évoquer une libération obtenue par rançon, mais « délivre » convient naturellement à des prisonniers sans préciser un moyen absent du texte.
- source_word: παῖς
  choice: serviteur
  rationale: Dans cette formule christologique, « serviteur » rend probablement l’écho biblique du serviteur de Dieu, tout en signalant en note l’ambivalence lexicale.
- source_word: ὀλιγοψυχούντας
  choice: ceux qui perdent courage
  rationale: Expression française courante qui restitue l’idée de découragement ou d’abattement intérieur.
theological_decisions:
- issue: Sens christologique de παῖς
  choice: serviteur
  alternative: enfant / fils
  rationale: Le mot grec permet les deux sens. Le contexte et les formulations bibliques anciennes favorisent « serviteur », mais l’autre sens est préservé en note afin de ne pas effacer l’ambiguïté.
- issue: Rendu de Ἰησοῦς Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ / Jésus Christ
  rationale: « Messie » rend explicitement le titre grec Χριστός et évite que « Christ » soit seulement perçu comme un nom propre.
translation_notes:
  register: Prière solennelle en français moderne et accessible. Les impératifs sont conservés, avec une ponctuation qui fait entendre la succession des supplications. « Toi seul, tu es Dieu » emploie une dislocation naturelle en français pour garder l’insistance du grec.
