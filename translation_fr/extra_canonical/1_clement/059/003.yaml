source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
translation:
  language: fr
  text: 'mettre notre espérance en ton nom, source première de toute la création[a], toi qui as ouvert les yeux de notre cœur afin que nous te connaissions : toi, le seul Très-Haut parmi ceux qui sont très hauts, le Saint qui reposes parmi les saints[b] ; toi qui abaisses l’insolence des orgueilleux, qui déjoues les desseins des nations, qui élèves les humbles et abaisses les puissants, qui enrichis et appauvris, qui fais mourir, donnes la vie et fais vivre ; toi, le seul bienfaiteur des esprits et Dieu de toute chair ; toi qui regardes dans les abîmes, qui observes les actions humaines, qui es le secours de ceux qui sont en danger, le sauveur de ceux qui sont sans espoir, le créateur et le gardien de tout esprit ; toi qui multiplies les nations sur la terre et qui, parmi toutes, choisis ceux qui t’aiment par Jésus le Messie, ton serviteur bien-aimé, par qui tu nous as instruits, sanctifiés et honorés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en ton nom, qui est depuis l’origine de toute la création » ; le grec peut aussi présenter le nom comme l’origine première de toute la création.'
    reason: ἀρχέγονον peut évoquer ce qui existe dès l’origine ou ce qui est à l’origine; son rapport précis à « nom » et à « toute la création » demeure discuté.
  - marker: b
    text: 'Ou : « le Saint qui reposes dans les réalités saintes » ou « dans les lieux saints » ; en grec, le pluriel peut désigner des personnes ou des réalités saintes.'
    reason: Le datif pluriel ἁγίοις peut être masculin ou neutre.
lexical_decisions:
- source_word: ἀρχέγονον
  choice: source première
  rationale: Le terme qualifie le « nom » et peut évoquer soit ce qui est à l’origine, soit ce qui existe dès l’origine. « Source première » garde l’idée d’antériorité et de provenance sans alourdir le texte.
- source_word: ὕψιστον ἐν ὑψίστοις
  choice: Très-Haut parmi les très-hauts
  rationale: Cette formulation conserve le superlatif substantivé et le pluriel grec, au lieu de transformer librement l’expression en indication spatiale comme « au plus haut des cieux ».
- source_word: ζῳοποιοῦντα καὶ ζῆν ποιοῦντα
  choice: rends la vie et fais vivre
  rationale: 'Les deux expressions grecques, proches mais distinctes, sont toutes deux représentées : la première évoque le fait de vivifier ou ramener à la vie, la seconde celui de faire vivre.'
- source_word: παιδός
  choice: serviteur
  rationale: Dans ce contexte de prière, παῖς peut signifier « enfant/fils » ou « serviteur ». « Serviteur » correspond bien à l’emploi religieux grec tout en laissant l’autre possibilité en note.
- source_word: ἐπίσκοπον
  choice: veilles sur lui
  rationale: Plutôt que le terme institutionnel moderne « évêque », le sens fonctionnel de surveillant ou gardien est rendu naturellement par « veiller sur ».
theological_decisions:
- issue: Identité des « très-hauts » et des « saints » auprès desquels Dieu est présenté
  choice: Conserver « parmi les très-hauts » et « parmi les saints »
  alternative: Interpréter les expressions comme « au plus haut des cieux » et « dans les lieux saints »
  rationale: Les formes grecques peuvent être masculines ou neutres selon le contexte. Le texte principal suit la lecture personnelle de l’anglais audité, tandis que la note signale honnêtement l’ambiguïté grammaticale.
- issue: Sens christologique de παῖς appliqué à Jésus
  choice: ton serviteur bien-aimé
  alternative: ton enfant bien-aimé ou ton fils bien-aimé
  rationale: Le grec ne tranche pas lexicalement entre enfant et serviteur. « Serviteur » convient à l’arrière-plan scripturaire probable sans introduire ici le titre théologique explicite de « Fils ».
- issue: Double expression relative au don de la vie
  choice: qui fais mourir, rends la vie et fais vivre
  alternative: qui fais mourir et donnes la vie
  rationale: La formulation retenue ne supprime pas le second membre grec comme s’il était une simple redondance ; elle maintient sa tension rhétorique.
translation_notes:
  register: Français international moderne, soutenu mais accessible, avec tutoiement conforme à l’adresse grecque singulière. La longue accumulation liturgique est conservée, mais structurée par des points-virgules et la reprise de « toi qui ». Les expressions bibliques « les yeux de notre cœur », « Dieu de tout être de chair » et « Jésus le Messie » sont maintenues pour préserver la couleur scripturaire du passage.
