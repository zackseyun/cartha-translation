  - severity: low
    issue: « parmi les très-hauts » est une substantivation peu naturelle en français moderne.
    rationale: Le grec autorise une lecture personnelle ou neutre. « parmi ceux qui sont très hauts » reste personnel sans imposer une identification précise; la note conserve les possibilités neutres.
  - severity: low
    issue: « tout être de chair » et « qui crées chaque esprit et veilles sur lui » s’éloignent de la paire de titres grecque.
    rationale: « Dieu de toute chair » et « le créateur et le gardien de tout esprit » sont à la fois plus proches du grec et plus cohérents avec le registre scripturaire.
