  source_fidelity: Révision nécessaire pour rétablir le lien syntaxique du participe grec ἀνοίξας (« toi qui as ouvert »), plutôt que d’en faire une nouvelle proposition indépendante. Le doublet ζῳοποιοῦντα καὶ ζῆν ποιοῦντα est conservé. « Dieu de toute chair » rend plus directement θεὸν πάσης σαρκός, et « créateur et gardien de tout esprit » maintient les deux titres coordonnés κτίστην καὶ ἐπίσκοπον.
  naturalness: Le texte révisé conserve l’ample période liturgique tout en employant des tournures françaises actuelles et intelligibles. « Parmi ceux qui sont très hauts » est plus idiomatique que la substantivation inhabituelle « parmi les très-hauts », sans résoudre indûment l’ambiguïté masculin/neutre du grec.
  terminology: « Très-Haut », « le Saint », « Dieu de toute chair », « Jésus le Messie » et « ton serviteur bien-aimé » sont conservés. « Gardien » rend ici fonctionnellement ἐπίσκοπος sans importer le sens institutionnel moderne d’« évêque ».
