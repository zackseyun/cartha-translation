revisions:
- from: Mais si certains désobéissent aux paroles qu’il a prononcées par notre intermédiaire, qu’ils sachent qu’ils s’exposeront à une faute et à un danger qui n’est pas mince.
  to: Mais si certains refusent d’obéir à ce qui a été dit par lui par notre intermédiaire, qu’ils sachent qu’ils se mettront eux-mêmes dans une situation de faute et de danger non négligeable.
  rationale: La révision préserve l’ambiguïté du référent de « lui », la médiation de « nous », l’avertissement solennel et la litote grecque. Elle corrige surtout une collocation française maladroite et restitue plus explicitement la valeur réflexive de « se lier/s’empêtrer soi-même ».
