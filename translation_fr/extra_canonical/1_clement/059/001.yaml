reference: 1 Clement 59:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: fr
  text: Mais si certains refusent d’obéir à ce qui a été dit par lui par notre intermédiaire, qu’ils sachent qu’ils se mettront eux-mêmes dans une situation de faute et de danger non négligeable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  choice: désobéissent
  rationale: Rend directement l’idée de refus d’obéir, plutôt qu’une simple absence de croyance.
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  choice: aux paroles qu’il a prononcées par notre intermédiaire
  rationale: Conserve l’affirmation que les paroles viennent de « lui » tout en passant par les auteurs; le pronom demeure volontairement non explicité.
- source_word: παραπτώσει
  choice: une faute
  rationale: Terme français naturel couvrant l’idée de faux pas, manquement ou transgression sans surdéterminer sa portée.
- source_word: ἑαυτοὺς ἐνδήσουσιν
  choice: ils s’exposeront
  rationale: Expression idiomatique qui communique le fait de se placer soi-même dans une situation de faute et de danger.
- source_word: κινδύνῳ οὐ μικρῷ
  choice: un danger qui n’est pas mince
  rationale: Préserve la litote grecque et son effet solennel.
theological_decisions:
- issue: Référent de αὐτοῦ (« lui »)
  choice: Conserver le pronom « il » sans identifier explicitement son référent.
  alternative: Traduire par « Dieu » ou « le Christ ».
  rationale: Le verset grec emploie seulement un pronom; préciser le référent résoudrait une ambiguïté que le texte présent laisse subsister.
- issue: Nature de la faute exprimée par παράπτωμα
  choice: Employer « faute ».
  alternative: Employer « péché » ou « transgression ».
  rationale: « Faute » garde la portée morale du terme sans imposer une catégorie théologique plus précise que le grec.
translation_notes:
  register: Français moderne, clair et digne. La structure conditionnelle et l’avertissement solennel sont conservés, ainsi que la litote finale. Aucun marqueur de note n’est nécessaire.
