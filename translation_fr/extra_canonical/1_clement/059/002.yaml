  terminology: « Créateur de toutes choses », « élus », « serviteur bien-aimé Jésus-Christ », « ténèbres », « lumière » et « connaissance » conviennent au registre de cette prière. La note sur παῖς préserve correctement une ambiguïté lexicale réelle sans imposer une lecture doctrinale.
