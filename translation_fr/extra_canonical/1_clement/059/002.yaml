  to: Mais nous, nous serons innocents de ce péché, et nous demanderons avec ferveur, dans nos prières et nos supplications, que le Créateur de toutes choses préserve intact le nombre de ses élus, qui a été compté dans le monde entier, par son serviteur[a] bien-aimé Jésus-Christ, par qui il nous a appelés des ténèbres à la lumière, de l’ignorance à la connaissance de la gloire de son nom,
  rationale: Révision limitée à des ajustements de fluidité française et de clarté syntaxique. La relative « qui a été compté » rend explicitement le parfait passif κατηριθμημένον et son lien avec « le nombre », sans transformer ce nombre en décret prédéterminé. La virgule finale est conservée, puisque la période se poursuit au verset suivant.
