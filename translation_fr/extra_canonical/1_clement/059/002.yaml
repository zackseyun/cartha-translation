source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
translation:
  language: fr
  text: Mais nous, nous serons innocents de ce péché, et nous demanderons avec ferveur, dans nos prières et nos supplications, que le Créateur de toutes choses préserve intact le nombre de ses élus, qui a été compté dans le monde entier, par son serviteur[a] bien-aimé Jésus-Christ, par qui il nous a appelés des ténèbres à la lumière, de l’ignorance à la connaissance de la gloire de son nom,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfant » ; le mot grec peut avoir les deux sens.
    reason: Préserve l’ambiguïté lexicale réelle de παῖς tout en retenant « serviteur » dans le texte principal en raison du contexte scripturaire et liturgique.
lexical_decisions:
- source_word: ἀθῷοι
  choice: innocents
  rationale: Rend directement l’idée d’être exempt de culpabilité à l’égard du péché mentionné.
- source_word: ἐκτενῆ
  choice: avec ferveur
  rationale: Exprime l’intensité et l’application soutenue de la prière sans lourdeur en français.
- source_word: διαφυλάξῃ ἄθραυστον
  choice: préserve intact
  rationale: Conserve à la fois l’idée de protection durable et celle d’un ensemble qui ne doit subir aucune rupture ni perte.
- source_word: τὸν ἀριθμὸν τὸν κατηριθμημένον
  choice: le nombre compté
  rationale: Reproduit délibérément la formulation appuyée du grec, qui associe le nombre à l’acte de compter, sans la convertir en « nombre fixé ».
- source_word: παῖς
  choice: serviteur
  rationale: Dans cette prière au registre scripturaire, « serviteur » rend vraisemblablement l’écho au Serviteur du Seigneur, tout en signalant en note l’autre sens lexical possible.
- source_word: ἐπίγνωσιν
  choice: connaissance
  rationale: Évite d’intensifier arbitrairement le terme par « pleine connaissance ».
theological_decisions:
- issue: Sens de παῖς appliqué à Jésus
  choice: serviteur
  alternative: enfant
  rationale: Le contexte liturgique et marqué par la langue des Écritures favorise « serviteur », mais le grec peut aussi désigner un enfant; l’ambiguïté est donc conservée en note.
- issue: Valeur de Χριστός
  choice: Christ
  alternative: Messie
  rationale: Dans le syntagme nominal « Jésus-Christ », la translittération traditionnelle française convient au probable emploi quasi onomastique, sans nier le sens titulaire sous-jacent.
- issue: Le nombre des élus
  choice: formulation littérale sans explication doctrinale
  alternative: expliciter un nombre fixé d’avance ou complet
  rationale: Le texte affirme que ce nombre est compté et doit rester intact, mais ne précise pas ici la manière ni le moment de cette détermination.
translation_notes:
  register: Français moderne, digne et liturgique sans archaïsmes. La longue période et la virgule finale sont maintenues parce que le passage se poursuit dans le verset suivant. Le redoublement « Mais nous, nous » marque naturellement le contraste porté par ἡμεῖς δέ.
