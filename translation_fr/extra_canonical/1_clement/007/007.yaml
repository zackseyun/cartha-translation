review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu. Toutefois, « leur destruction » introduit un possessif absent du grec, et « par leurs supplications » rend moins directement le participe ἱκετεύσαντες, qui exprime leur action de supplier Dieu. La révision conserve le COD « Dieu » de ἐξιλάσαντο et l’ambiguïté portée par σωτηρία.
  naturalness: Le français est déjà clair et de registre approprié. « En le suppliant » est plus fluide et plus immédiatement rattaché à Dieu que « par leurs supplications ». « Tout en étant étrangers à Dieu » évite le présent du subjonctif (« soient »), qui affaiblit légèrement la valeur circonstancielle du participe grec.
  terminology: « Apaisèrent Dieu » restitue correctement le sens propitiatoire de ἐξιλάσαντο avec Dieu comme objet direct, sans imposer de cadre doctrinal technique. « Le salut » et « étrangers à Dieu » sont maintenus.
  issues:
  - severity: low
    issue: Possessif ajouté dans « leur destruction »
    rationale: καταστροφή ne porte pas de possessif explicite. « La ruine » permet une formulation française naturelle sans ajouter cette précision.
  - severity: low
    issue: Rendu indirect de ἱκετεύσαντες
    rationale: « Par leurs supplications » est possible, mais « en le suppliant » rend plus directement le participe et son lien avec Dieu, tout en restant naturel.
  - severity: low
    issue: Temps de « bien qu’ils lui soient étrangers »
    rationale: Le présent du subjonctif peut suggérer un état actuel. « Tout en étant étrangers à Dieu » rend plus sobrement la circonstance concomitante exprimée par le participe ὄντες.
  revised_text: Jonas annonça aux Ninivites la ruine ; mais eux, après s’être repentis de leurs péchés, apaisèrent Dieu en le suppliant et reçurent le salut, tout en étant étrangers à Dieu.
