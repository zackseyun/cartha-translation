revisions:
- from: Jonas annonça aux Ninivites leur destruction. Mais eux, après s’être repentis de leurs péchés, apaisèrent Dieu par leurs supplications et reçurent le salut, bien qu’ils lui soient étrangers.
  to: Jonas annonça aux Ninivites la ruine ; mais eux, après s’être repentis de leurs péchés, apaisèrent Dieu en le suppliant et reçurent le salut, tout en étant étrangers à Dieu.
  rationale: 'Révision légère pour resserrer l’adhérence au grec et améliorer l’enchaînement français : suppression du possessif non exprimé, rendu verbal de la supplication, et formulation participiale de la dernière concession. Aucun changement de sens théologique n’est introduit.'
