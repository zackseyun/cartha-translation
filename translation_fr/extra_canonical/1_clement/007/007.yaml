source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
translation:
  language: fr
  text: Jonas annonça aux Ninivites la ruine ; mais eux, après s’être repentis de leurs péchés, apaisèrent Dieu en le suppliant et reçurent le salut, tout en étant étrangers à Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταστροφὴν
  choice: leur destruction
  rationale: Le nom désigne ici la ruine annoncée aux Ninivites; le possessif rend naturellement en français la portée de la proclamation.
- source_word: μετανοήσαντες
  choice: après s’être repentis
  rationale: Le participe aoriste indique que leur repentance précède l’action d’apaiser Dieu.
- source_word: ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν
  choice: de leurs péchés
  rationale: Avec μετανοέω, ἐπί introduit ce dont ils se repentent; «péchés» est clair et idiomatique.
- source_word: ἐξιλάσαντο τὸν θεὸν
  choice: apaisèrent Dieu
  rationale: Dieu est le complément d’objet direct du verbe; «apaiser» conserve cette syntaxe et le sens propitiatoire sans introduire un système doctrinal particulier.
- source_word: ἱκετεύσαντες
  choice: par leurs supplications
  rationale: Le participe exprime le moyen par lequel ils apaisèrent Dieu; «supplications» garde l’idée d’une prière instante.
- source_word: σωτηρίαν
  choice: le salut
  rationale: Équivalent français naturel qui préserve la portée potentiellement théologique du terme.
- source_word: ἀλλότριοι τοῦ θεοῦ
  choice: étrangers à Dieu
  rationale: Rend littéralement leur absence d’appartenance ou de relation préalable à Dieu, sans préciser davantage la nature de cette distance.
theological_decisions:
- issue: Sens propitiatoire de ἐξιλάσαντο avec Dieu comme objet direct
  choice: apaisèrent Dieu
  alternative: firent expiation devant Dieu / obtinrent la faveur de Dieu
  rationale: La construction grecque présente Dieu comme l’objet direct de l’action. «Apaisèrent Dieu» respecte ce trait et évite de transformer la phrase en déclaration technique sur la manière d’accomplir l’expiation.
- issue: Portée de σωτηρία
  choice: le salut
  alternative: la délivrance
  rationale: Le grec peut viser le sauvetage historique de Ninive tout en portant une résonance religieuse plus large. «Salut» préserve cette tension.
- issue: Rapport exprimé par ἀλλότριοι τοῦ θεοῦ
  choice: étrangers à Dieu
  alternative: étrangers au peuple de Dieu
  rationale: Le texte dit explicitement «de Dieu», non «du peuple de Dieu»; la formulation retenue n’ajoute pas une appartenance communautaire absente du grec.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est légèrement restructurée en deux phrases pour la lisibilité, tout en conservant l’enchaînement logique du grec et le contraste introduit par οἱ δέ.
