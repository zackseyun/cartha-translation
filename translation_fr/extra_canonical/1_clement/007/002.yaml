id: 1CLEM.7.2
reference: 1 Clement 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
translation:
  language: fr
  text: C’est pourquoi, laissons derrière nous les préoccupations vides et futiles, et tournons-nous vers la règle glorieuse et vénérable de notre tradition.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενὰς καὶ ματαίας φροντίδας
  choice: les préoccupations vides et futiles
  rationale: « Préoccupations » rend naturellement φροντίδας, tandis que « vides et futiles » conserve les deux qualificatifs grecs sans les confondre.
- source_word: ἔλθωμεν ἐπί
  choice: tournons-nous vers
  rationale: Dans ce contexte exhortatif, cette formulation française exprime naturellement le mouvement figuré consistant à délaisser une chose pour s’attacher à une autre.
- source_word: κανόνα
  choice: règle
  rationale: Le mot désigne ici une norme ou une ligne directrice faisant autorité; « règle » reste clair et n’introduit pas le sens technique plus tardif de « canon ».
- source_word: εὐκλεῆ καὶ σεμνὸν
  choice: glorieuse et vénérable
  rationale: « Glorieuse » traduit l’idée de haute renommée ou de gloire portée par εὐκλεής; « vénérable » rend σεμνός comme digne de respect et de révérence.
- source_word: τῆς παραδόσεως ἡμῶν
  choice: de notre tradition
  rationale: Cette traduction directe préserve la formulation possessive du grec sans préciser davantage l’origine ou le contenu de la tradition.
theological_decisions:
- issue: Portée de « notre tradition »
  choice: Conserver « notre tradition » sans explicitation
  alternative: « la tradition que nous avons reçue »
  rationale: Le grec emploie simplement le possessif ἡμῶν. Ajouter l’idée explicite de réception serait plausible au regard de παράδοσις, mais réduirait inutilement l’ambiguïté de l’expression.
translation_notes:
  register: Français international moderne, exhortatif et digne. La phrase conserve le parallélisme entre l’abandon des préoccupations futiles et l’orientation vers une norme tenue en haute estime.
