source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα, ἀγαπητοί, οὐ μόνον ὑμᾶς νουθετοῦντες ἐπεστέλλομεν, ἀλλὰ καὶ ἑαυτοὺς ὑπομιμνήσκοντες· ἐν γὰρ τῷ αὐτῷ ἐσμὲν σκάμματι, καὶ ὁ αὐτὸς ἡμῖν ἀγὼν ἐπίκειται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/001.yaml
  text: These things, beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us.
translation:
  language: fr
  text: Nous vous avons écrit ces choses, bien-aimés, non seulement pour vous exhorter, mais aussi pour nous les rappeler à nous-mêmes ; car nous sommes dans la même arène, et le même combat nous attend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Bien-aimés
  rationale: Reproduit l’adresse affectueuse et communautaire du grec dans un registre biblique encore clair en français moderne.
- source_word: νουθετοῦντες
  choice: pour vous avertir
  rationale: Exprime l’idée d’une mise en garde qui vise à corriger ou à orienter, sans alourdir la phrase.
- source_word: ὑπομιμνήσκοντες
  choice: pour nous les rappeler à nous-mêmes
  rationale: Conserve le caractère réflexif de ἑαυτούς et rattache explicitement le rappel aux « choses » déjà évoquées.
- source_word: σκάμματι
  choice: arène
  rationale: Dans ce contexte agonistique, le terme désigne le lieu du combat ou de l’épreuve ; « arène » rend naturellement l’image en français.
- source_word: ἀγὼν ἐπίκειται
  choice: le combat nous attend
  rationale: Rend l’épreuve imminente qui s’impose aux auteurs comme aux destinataires, dans un français naturel et vigoureux.
theological_decisions:
- issue: Solidarité entre les auteurs et les destinataires dans l’épreuve morale et spirituelle
  choice: « nous sommes dans la même arène, et le même combat nous attend »
  alternative: « nous sommes engagés dans la même épreuve, et la même lutte nous est imposée »
  rationale: La formulation retenue préserve la métaphore athlétique du grec et souligne l’égalité des participants sans préciser indûment la nature du combat.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore agonistique est conservée, tandis que la structure initiale est légèrement réorganisée pour une syntaxe française naturelle.
