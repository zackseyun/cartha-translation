review_pass:
  verdict: revise
  source_fidelity: La tournure conditionnelle « si nous vous écrivons » ne rend pas l’assertion de ἐπεστέλλομεν (« nous avons écrit / nous écrivions »). Le grec présente l’écriture comme un fait, non comme une hypothèse. « Vous avertir » est possible dans certains contextes, mais νουθετεῖν exprime plus largement l’exhortation ou l’admonition; « vous exhorter » est ici plus fidèle sans restreindre le sens à une mise en garde.
  naturalness: La phrase révisée est naturelle en français moderne tout en conservant l’adresse solennelle et la métaphore agonistique. « Bien-aimés » demeure une adresse biblique claire; « arène » et « combat » rendent de manière idiomatique σκάμμα et ἀγών.
  terminology: « Exhorter » restitue convenablement νουθετεῖν dans ce contexte parénétique. « Nous les rappeler à nous-mêmes » conserve le renvoi réflexif à ἑαυτούς et l’antécédent Ταῦτα. « Même arène » et « même combat » préservent l’imagerie athlétique sans interprétation doctrinale ajoutée.
  issues:
  - severity: medium
    issue: La proposition initiale est formulée comme une condition.
    rationale: « Si nous vous écrivons ces choses » modifie l’énoncé grec, qui affirme que les auteurs ont écrit ces choses (ἐπεστέλλομεν).
  - severity: low
    issue: « Avertir » restreint légèrement νουθετοῦντες.
    rationale: Le verbe grec vise l’admonition et l’exhortation formatrice, pas nécessairement un avertissement face à un danger précis.
  revised_text: Nous vous avons écrit ces choses, bien-aimés, non seulement pour vous exhorter, mais aussi pour nous les rappeler à nous-mêmes ; car nous sommes dans la même arène, et le même combat nous attend.
