revisions:
- from: Bien-aimés, si nous vous écrivons ces choses, ce n’est pas seulement pour vous avertir, mais aussi pour nous les rappeler à nous-mêmes ; car nous sommes dans la même arène, et le même combat nous attend.
  to: Nous vous avons écrit ces choses, bien-aimés, non seulement pour vous exhorter, mais aussi pour nous les rappeler à nous-mêmes ; car nous sommes dans la même arène, et le même combat nous attend.
  rationale: La révision rétablit l’affirmation épistolaire du grec et choisit « exhorter », terme français moderne et suffisamment large pour νουθετεῖν. Le reste de la formulation conserve fidèlement le rappel réflexif ainsi que les deux images agonistiques du texte source.
