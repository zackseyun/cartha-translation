  text: Noé proclama la repentance, et ceux qui obéirent furent sauvés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυξεν
  choice: proclama
  rationale: Rend le verbe grec par un terme naturel et digne qui conserve l’idée d’une proclamation publique.
- source_word: μετάνοιαν
  choice: la repentance
  rationale: Préserve le sens religieux de changement profond d’attitude et de conduite, sans le réduire au simple regret.
- source_word: οἱ ὑπακούσαντες
  choice: ceux qui obéirent
  rationale: Le participe aoriste désigne ceux qui répondirent par l’obéissance à la proclamation de Noé; la formulation conserve l’objet implicite du grec.
- source_word: ἐσώθησαν
  choice: furent sauvés
  rationale: Reproduit la voix passive et le langage de salut du texte grec sans préciser explicitement l’agent.
theological_decisions:
- issue: Objet implicite de l’obéissance
  choice: Conserver « ceux qui obéirent » sans complément.
  alternative: « ceux qui l’écoutèrent » ou « ceux qui répondirent à son appel »
  rationale: Le grec ne précise pas explicitement à qui ou à quoi ils obéirent; conserver cette ellipse respecte l’ambiguïté de la source.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit bref et solennel; aucun marqueur de note n’est requis.
