id: 1CLEM.7.4
reference: 1 Clement 7:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
translation:
  language: fr
  text: 'Fixons notre regard sur le sang du Messie et comprenons combien il est précieux aux yeux de son Dieu et Père[a] : répandu pour notre salut, il a apporté au monde entier la grâce de la repentance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux yeux de Dieu, son Père ».
    reason: Signale une formulation française possible où « son Père » est pris en apposition à « Dieu ». Le texte principal conserve plus directement la construction grecque τῷ θεῷ καὶ πατρὶ αὐτοῦ, dans laquelle le pronom peut naturellement porter sur les deux noms coordonnés.
lexical_decisions:
- source_word: ἀτενίσωμεν
  choice: Fixons les regards
  rationale: Rend l’exhortation à regarder avec une attention soutenue dans un français naturel et digne.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Rend le titre grec Χριστός par son sens, « Messie », conformément à son emploi comme titre.
- source_word: τίμιον
  choice: précieux
  rationale: Exprime ici la grande valeur du sang aux yeux de Dieu plutôt que le seul sens d’« honoré ».
- source_word: μετανοίας
  choice: de la repentance
  rationale: Conserve la notion de changement intérieur et de détournement du péché, dans un registre religieux compréhensible.
- source_word: διήνεγκεν
  choice: a apporté
  rationale: Rend sobrement l’idée que le sang répandu a procuré ou communiqué cette grâce au monde entier, sans préciser davantage le mécanisme.
theological_decisions:
- issue: Relation exprimée par τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: pour son Dieu et Père
  alternative: pour Dieu, son Père
  rationale: 'L’article unique régit les deux noms coordonnés, et αὐτοῦ se rapporte naturellement à l’ensemble : le texte désigne celui qui est à la fois le Dieu et le Père du Messie. La formulation retenue préserve cette affirmation relationnelle sans l’atténuer.'
- issue: Portée de παντὶ τῷ κόσμῳ
  choice: au monde entier
  alternative: à tout le monde
  rationale: « Au monde entier » conserve la portée universelle de l’expression grecque sans décider si chaque individu est visé distributivement.
- issue: Lien causal introduit par ὅτι
  choice: deux-points suivis de « répandu pour notre salut »
  alternative: car, ayant été répandu pour notre salut
  rationale: La ponctuation française rend clairement l’explication causale tout en évitant une construction participiale lourde; elle ne résout pas davantage la relation entre la valeur du sang, son effusion et le don de la repentance.
translation_notes:
  register: Français international actuel, solennel mais accessible. La phrase conserve l’exhortation collective, l’image du sang répandu et la tension théologique de « son Dieu et Père ». Le participe grec est rendu par une proposition participiale détachée naturelle en français.
