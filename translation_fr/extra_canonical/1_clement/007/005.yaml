  source_fidelity: 'Le sens général est bien rendu : l’exhortation, la répétition « de génération en génération », le titre divin et les deux notions de repentir et de se tourner vers Dieu sont conservés. Toutefois, « constatons avec soin » rend moins précisément καταμάθωμεν, qui appelle l’idée d’apprendre ou de reconnaître après examen. Le présent « veulent » affaiblit aussi légèrement l’ancrage rétrospectif de l’aoriste ἔδωκεν et du participe qui s’y rapporte.'
