source:
  edition: Funk 1901 (normalized OCR)
  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: fr
  text: Passons en revue toutes les générations et apprenons bien que, de génération en génération, le Maître a donné la possibilité de se repentir à ceux qui voulaient se tourner vers lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν εἰς τὰς γενεὰς πάσας
  choice: Parcourons toutes les générations
  rationale: Rend l’exhortation délibérative et l’idée d’examiner successivement les générations passées dans un français naturel.
- source_word: καταμάθωμεν
  choice: constatons avec soin
  rationale: Exprime l’apprentissage attentif et approfondi marqué par le préverbe κατα- sans alourdir la phrase.
- source_word: ἐν γενεᾷ καὶ γενεᾷ
  choice: de génération en génération
  rationale: Équivalent idiomatique français de la répétition sémitisante, qui souligne la continuité à travers chaque génération.
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Conserve le titre divin et sa nuance d’autorité souveraine, conformément au contexte, sans choisir un terme français inutilement dur.
- source_word: μετανοίας τόπον ἔδωκεν
  choice: a accordé la possibilité de se repentir
  rationale: Littéralement « a donné une place au repentir » ; la formulation française transmet naturellement l’idée d’une occasion ou possibilité offerte, sans réduire μετάνοια au seul regret.
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  choice: à ceux qui veulent se tourner vers lui
  rationale: Préserve le caractère volontaire exprimé par βουλομένοις et rend ἐπιστρέψαι ἐπ᾽ αὐτόν sans ajouter explicitement l’idée de « retour », absente de la formulation grecque.
theological_decisions:
- issue: Rapport entre repentir et conversion vers Dieu
  choice: « la possibilité de se repentir » et « se tourner vers lui » sont maintenus comme deux éléments liés mais distincts
  alternative: Fusionner les deux notions en « revenir à Dieu »
  rationale: Le grec mentionne à la fois μετάνοια et ἐπιστρέφω ; les conserver évite d’effacer leur tension et leur complémentarité.
- issue: Sens temporel de ἔδωκεν
  choice: 'Passé composé : « a accordé »'
  alternative: 'Présent général : « accorde »'
  rationale: Le texte grec emploie l’aoriste et invite à constater l’action de Dieu dans les générations passées ; le passé composé reste naturel en français tout en respectant ce point de vue.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement exhortatif du grec, le titre « Maître » et la répétition générationnelle, tout en reformulant l’expression idiomatique « donner une place au repentir » pour qu’elle soit immédiatement intelligible.
