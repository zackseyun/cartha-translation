- from: 'Mais appelle donc : quelqu’un te répondra-t-il ? Tourne-toi vers l’un des saints anges, si tu en vois un.[a] Car la colère fait périr l’homme insensé, et la jalousie met à mort celui qui s’égare.'
  to: 'Mais appelle donc : quelqu’un te répondra-t-il ? Ou verras-tu l’un des saints anges ? Car la colère fait périr l’insensé, et la jalousie met à mort l’égaré.'
  rationale: La révision retire l’explicitation non attestée concernant un recours aux anges et rend les deux membres coordonnés comme les questions rhétoriques que porte le grec. Elle resserre aussi la dernière expression afin de mieux refléter le participe parfait tout en préservant son ambiguïté.
