review_pass:
  verdict: revise
  source_fidelity: 'La seconde proposition grecque ne contient ni « tourne-toi vers » ni une idée explicite de recours auprès d’un ange. Elle coordonne deux interrogations indirectes introduites par εἴ : « si quelqu’un te répondra » ou « si tu verras l’un des saints anges ». L’explicitation du draft ajoute donc un élément absent de la source. Le parfait πεπλανημένον désigne l’état de « l’égaré » et ne doit pas être réduit sans nuance à une action présente d’« s’égarer ».'
  naturalness: La formulation révisée conserve le défi rhétorique dans un français moderne et net. « L’égaré » convient au registre sapientiel et maintient le parallélisme concis.
  terminology: « Saints anges », « insensé », « colère » et « jalousie » rendent de manière directe les termes grecs. « Jalousie » demeure un rendu recevable de ζῆλος dans ce parallélisme négatif.
  issues:
  - severity: high
    issue: Ajout de « Tourne-toi vers » dans la seconde proposition.
    rationale: Le grec ἢ εἴ τινα ἁγίων ἀγγέλων ὄψῃ signifie littéralement « ou si tu vois l’un des saints anges »; aucun verbe de se tourner vers, d’invoquer ou de recourir à eux n’est exprimé. La note reconnaît ce sens mais le texte principal le remplace par une interprétation ajoutée.
  - severity: medium
    issue: La note présente la construction comme elliptique et propose une lecture qui ajoute « appelle l’un des saints anges ».
    rationale: La répétition de εἴ après ἤ se lit naturellement comme la seconde branche de l’interrogation indirecte dépendant de l’impératif initial. Une note interprétative n’est pas nécessaire et risque de favoriser un sens non exprimé.
  - severity: low
    issue: « Celui qui s’égare » affaiblit la valeur résultative du parfait πεπλανημένον.
    rationale: « L’égaré » rend plus fidèlement la personne caractérisée par l’état issu de l’égarement, sans imposer l’agent ni une lecture active.
  revised_text: 'Mais appelle donc : quelqu’un te répondra-t-il ? Ou verras-tu l’un des saints anges ? Car la colère fait périr l’insensé, et la jalousie met à mort l’égaré.'
