  text: ἐπικάλεσαι δέ, εἴ τις σοι ὑπακούσεται, ἢ εἴ τινα ἁγίων ἀγγέλων ὄψῃ· καὶ γὰρ ἄφρονα ἀναιρεῖ ὀργή, πεπλανημένον δὲ θανατοῖ ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
translation:
  language: fr
  text: 'Mais appelle donc : quelqu’un te répondra-t-il ? Ou verras-tu l’un des saints anges ? Car la colère fait périr l’insensé, et la jalousie met à mort l’égaré.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικάλεσαι
  choice: appelle donc
  rationale: 'Impératif aoriste de ἐπικαλέω : « appeler, invoquer ». « Appelle donc » reste naturel tout en conservant la force du défi rhétorique.'
- source_word: ὑπακούσεται
  choice: te répondra
  rationale: Dans ce contexte d’appel, le verbe signifie répondre ou donner suite à l’appel, plutôt que simplement écouter ou obéir.
- source_word: ἁγίων ἀγγέλων
  choice: saints anges
  rationale: Rend directement le génitif pluriel, qui désigne les anges saints.
- source_word: ἄφρονα
  choice: l’homme insensé
  rationale: Désigne une personne dépourvue de bon sens; « insensé » convient au registre sapientiel.
- source_word: ζῆλος
  choice: jalousie
  rationale: Dans ce parallélisme négatif avec la colère, ζῆλος évoque une jalousie ou une ardeur envieuse destructrice.
- source_word: πεπλανημένον
  choice: celui qui s’égare
  rationale: Le participe parfait passif peut désigner celui qui a été égaré ou qui s’est égaré; cette formulation française naturelle laisse ouverte la nature exacte de l’égarement.
theological_decisions:
- issue: Sens de la proposition ἢ εἴ τινα ἁγίων ἀγγέλων ὄψῃ
  choice: Tourne-toi vers l’un des saints anges, si tu en vois un.
  alternative: ou vois si l’un des saints anges se montre à toi
  rationale: Le grec est elliptique et reprend vraisemblablement l’idée d’appel ou de recours auprès des saints anges. Le texte principal explicite légèrement cette continuité sans faire de l’ange un objet de culte; la note conserve l’ambiguïté syntaxique.
- issue: Valeur de πεπλανημένον
  choice: celui qui s’égare
  alternative: celui qui a été égaré
  rationale: Le parfait passif autorise une lecture résultative ou passive. Le français choisi évite de trancher la question de l’agent de l’égarement.
translation_notes:
  register: Français moderne, digne et accessible. Le défi rhétorique est rendu par une question directe. Le parallélisme final demeure serré et solennel.
