  text: ἐγὼ δὲ ἑώρακα ἄφρονας ῥίζας βάλλοντας, ἀλλʼ εὐθέως ἐβρώθη αὐτῶν ἡ δίαιτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/008.yaml
  text: But I have seen fools taking root, yet immediately their dwelling was consumed.
translation:
  language: fr
  text: Mais moi, j’ai vu des insensés prendre racine ; pourtant, aussitôt, leur demeure a été dévorée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονας
  choice: des insensés
  rationale: Rend le sens moral et intellectuel de « dépourvus de discernement » dans un registre biblique actuel et digne.
- source_word: ῥίζας βάλλοντας
  choice: prendre racine
  rationale: Expression française naturelle qui conserve l’image littérale de personnes en train de s’enraciner.
- source_word: δίαιτα
  choice: demeure
  rationale: Dans ce contexte, le terme désigne le lieu ou le cadre de vie ; « demeure » préserve l’image sans réduire le mot à la conduite ou au régime de vie.
- source_word: ἐβρώθη
  choice: a été dévorée
  rationale: Le verbe signifie littéralement « fut mangée/dévorée ». Ce choix conserve l’image forte et la voix passive du grec.
theological_decisions:
- issue: Nature de la disparition évoquée
  choice: Conserver l’image de la demeure dévorée
  alternative: Traduire par « leur existence a été anéantie » ou « leur prospérité a disparu »
  rationale: Le grec formule une image concrète et énigmatique ; la traduction ne doit pas en imposer une interprétation théologique ou existentielle.
translation_notes:
  register: Français moderne international, naturel et digne. La structure adversative δὲ… ἀλλά est rendue par « Mais moi… pourtant ». Le passé composé convient à une citation de témoignage en français courant, tandis que « aussitôt » maintient la soudaineté de εὐθέως.
