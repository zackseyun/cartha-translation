source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
translation:
  language: fr
  text: Que leurs fils restent loin du salut ; qu’ils soient écrasés aux portes des plus faibles, sans personne pour les délivrer. Car ce qu’ils ont préparé[a], les justes le mangeront ; eux-mêmes, cependant, n’échapperont pas aux malheurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis ici par OCR porte littéralement : « ce que tu as préparé pour eux ». La leçon cohérente de la citation est : « ce qu’ils ont préparé ».'
    reason: Signaler sans la dissimuler une corruption probable de l’OCR et justifier la leçon retenue dans le texte.
lexical_decisions:
- source_word: πόρρω γένοιντο
  choice: restent loin
  rationale: L’OCR « πρόγένοιντο » est manifestement fautif ; la leçon connue de la citation est πόρρω γένοιντο, qui exprime l’éloignement par rapport au salut.
- source_word: κολαβρισθείησαν
  choice: qu’ils soient écrasés
  rationale: Le passif optatif exprime ici un souhait de défaite violente ou d’accablement ; « écrasés » est naturel et correspond au contexte de la citation.
- source_word: ἐπὶ θύραις ἡσσόνων
  choice: aux portes des plus faibles
  rationale: Cette formulation conserve l’image des portes et le comparatif substantivé « les plus faibles / inférieurs », sans préciser indûment l’agent ou la situation judiciaire.
- source_word: ἃ γὰρ ἐκεῖνοι ἡτοίμασαν
  choice: Car ce qu’ils ont préparé
  rationale: La traduction suit la leçon cohérente de la citation, avec ἐκεῖνοι comme sujet et ἡτοίμασαν à la troisième personne du pluriel, plutôt que les formes corrompues du texte OCR fourni.
- source_word: οὐκ ἐξαίρετοι ἔσονται
  choice: n’échapperont pas
  rationale: Rend idiomatiquement l’idée qu’ils ne seront pas soustraits ou délivrés des malheurs.
theological_decisions:
- issue: Identité des « justes » et nature des « malheurs »
  choice: Conserver les termes généraux « les justes » et « les malheurs »
  alternative: Préciser une catégorie religieuse ou interpréter les malheurs comme un jugement eschatologique
  rationale: Le grec ne fournit pas ici de précision permettant de trancher ; la traduction préserve donc l’ouverture du texte.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe conserve la progression solennelle de la citation tout en évitant les calques opaques. Le point-virgule maintient le parallélisme des propositions.
