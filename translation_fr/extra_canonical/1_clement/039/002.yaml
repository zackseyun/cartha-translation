  text: For what can a mortal do? Or what strength has one born of earth?
translation:
  language: fr
  text: Car que peut un mortel ? Ou quelle force a celui qui est né de la terre ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θνητός
  choice: un mortel
  rationale: Rend directement le substantif grec et souligne la condition humaine marquée par la mortalité.
- source_word: ἰσχύς
  choice: force
  rationale: Terme français naturel qui exprime ici la capacité ou la puissance propre d’un être humain.
- source_word: γηγενοῦς
  choice: celui qui est né de la terre
  rationale: Conserve l’image étymologique et anthropologique du grec γηγενής sans la réduire au simple sens d’« humain ».
theological_decisions:
- issue: Portée des deux questions rhétoriques sur la faiblesse humaine
  choice: Maintenir leur formulation ouverte et parallèle
  alternative: Expliciter que l’être humain ne peut rien et ne possède aucune force
  rationale: Le grec interroge sans formuler directement la conclusion; la traduction préserve cette tension rhétorique sans ajouter une affirmation théologique absolue.
translation_notes:
  register: Français moderne, digne et concis. L’inversion interrogative a été évitée afin de garder une formulation naturelle, tandis que « né de la terre » conserve l’image solennelle du texte grec.
