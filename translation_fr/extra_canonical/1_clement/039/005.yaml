review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend fidèlement la comparaison rhétorique, l’image des « maisons d’argile », l’origine commune de l’argile et la disparition rapide. « Il les a frappés comme une mite » suit de manière recevable la construction δύσκολη σητὸς τρόπον et l’antécédent divin implicite du contexte.
  naturalness: Le français est moderne, clair et de registre soutenu. « Combien moins », « tirés » et « faute de pouvoir se porter secours à eux-mêmes » sont naturels dans ce contexte.
  terminology: « Purs », « maisons d’argile » et « mite » conservent les images et le registre du grec sans surinterprétation doctrinale. Aucun nom propre ni terme théologique spécialisé ne demande d’ajustement.
