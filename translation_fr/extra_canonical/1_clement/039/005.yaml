    issue: La note b présente comme possible l’analyse « Une mite les a frappés ».
    rationale: Dans la séquence transmise σητὸς τρόπον, τρόπoν (« à la manière de ») rattache σητός à l’expression comparative. La note alternative ne rend pas compte de τρόπoν et introduit une ambiguïté que le texte grec fourni ne soutient pas suffisamment.
  - severity: low
    issue: La paraphrase littérale de la note a peut être formulée avec davantage de précision.
    rationale: Le grec enchaîne de façon redondante une relative en ἐξ ὧν (« desquelles ») et ἐκ τοῦ αὐτοῦ πηλοῦ (« de la même argile »). La note doit signaler cette double expression sans laisser entendre que la formulation française proposée est une citation littérale fluide.
