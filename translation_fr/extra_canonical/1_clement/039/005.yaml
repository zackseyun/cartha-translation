source:
  edition: Funk 1901 (normalized OCR)
  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
translation:
  language: fr
  text: Même les cieux ne sont pas purs devant lui ; combien moins ceux qui habitent des maisons d’argile, de cette même argile dont nous sommes nous-mêmes tirés[a] ! Il les a frappés comme une mite, et du matin au soir ils ne sont plus ; faute de pouvoir se porter secours à eux-mêmes, ils ont péri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète de façon inhabituelle deux expressions d’origine ; plus littéralement : « desquelles nous sommes nous-mêmes aussi, de la même argile ».'
    reason: La construction relative ἐξ ὧν… ἐκ τοῦ αὐτοῦ πηλοῦ est redondante et difficile ; la note en conserve la particularité sans alourdir le texte principal.
lexical_decisions:
- source_word: καθαρὴς
  choice: purs
  rationale: Dans ce contexte de comparaison entre Dieu, les cieux et les humains, « purs » rend naturellement l’idée de pureté ou d’irréprochabilité exprimée par καθαρός.
- source_word: οἰκίας πηλίνας
  choice: maisons d’argile
  rationale: L’expression conserve l’image concrète de demeures fragiles faites d’argile, qui désigne métaphoriquement la condition corporelle humaine.
- source_word: σητὸς τρόπον
  choice: comme une mite
  rationale: Cette formulation garde l’image grecque de la mite et la rattache au verbe « frapper », sans remplacer la comparaison inhabituelle par une interprétation explicative.
- source_word: παρὰ τὸ μὴ δύνασθαι ... βοηθῆσαι
  choice: faute de pouvoir se porter secours à eux-mêmes
  rationale: « Faute de pouvoir » exprime ici la circonstance causale, tandis que la forme pronominale conserve l’insistance de ἑαυτοῖς.
theological_decisions:
- issue: La pureté des cieux devant Dieu
  choice: « Même les cieux ne sont pas purs devant lui »
  alternative: « Les cieux eux-mêmes ne sont pas irréprochables à ses yeux »
  rationale: La traduction retient l’image de pureté du grec sans préciser si elle est rituelle, morale ou ontologique.
- issue: Le sujet de l’action associée à la mite
  choice: « Il les a frappés comme une mite » avec une note signalant l’autre analyse
  alternative: « Une mite les a frappés »
  rationale: La leçon est syntaxiquement difficile. Le contexte traditionnel de la citation et la consultation anglaise favorisent Dieu comme sujet implicite, mais la forme grecque σητός peut aussi être comprise comme un nominatif sujet ; cette ambiguïté est donc conservée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La ponctuation maintient le mouvement comparatif de la phrase grecque. « Combien moins » conserve sa force rhétorique biblique tout en restant intelligible ; « du matin au soir » et « ils ne sont plus » reproduisent sobrement l’image de disparition rapide.
