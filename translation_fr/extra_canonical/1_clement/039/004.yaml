source:
  edition: Funk 1901 (normalized OCR)
  text: Τί γάρ; μὴ καθαρὸς ἔσται βροτὸς ἐναντί κυρίου; ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ, εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει, κατὰ δὲ ἀγγέλων αὐτοῦ σκολιὸν τι ἐπενόησεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
translation:
  language: fr
  text: Quoi donc ? Un mortel sera-t-il pur devant le Seigneur ? Ou un être humain sera-t-il irréprochable en raison de ses œuvres, si le Seigneur ne se fie pas à ses serviteurs[a] et a conçu quelque chose de tortueux contre ses anges[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ses enfants » : le mot grec peut désigner des enfants aussi bien que des serviteurs.'
    reason: ambiguïté lexicale de παίδων
  - marker: b
    text: 'Littéralement : « a conçu quelque chose de tortueux contre ses anges ». Dans une compréhension contextuelle, on peut rendre : « a discerné quelque chose de défectueux chez ses anges ».'
    reason: construction et sens de σκολιόν τι ἐπενόησεν avec κατά difficiles; la note signale une lecture interprétative sans la substituer au texte.
lexical_decisions:
- source_word: βροτός
  choice: un mortel
  rationale: Rend la condition humaine fragile et mortelle, en contraste implicite avec le Seigneur.
- source_word: ἐναντί κυρίου
  choice: devant le Seigneur
  rationale: Expression française naturelle qui conserve l’idée de comparaître en présence du Seigneur.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: en raison de ses œuvres
  rationale: Conserve le lien entre l’irréprochabilité supposée de l’être humain et ses propres actes, sans préciser davantage la nature logique de ce lien.
- source_word: παίδων
  choice: serviteurs
  rationale: παῖς peut désigner des enfants ou des serviteurs. Le contexte parallèle avec les anges et l’arrière-plan de Job 4.18 favorisent ici « serviteurs »; l’autre sens est signalé en note.
- source_word: σκολιόν τι ἐπενόησεν
  choice: conçoit quelque grief
  rationale: Formulation française intelligible qui maintient l’idée d’une appréciation défavorable dirigée contre les anges, sans transformer explicitement le texte en constat de culpabilité.
theological_decisions:
- issue: Sujet implicite de πιστεύει et ἐπενόησεν
  choice: Expliciter « le Seigneur » comme sujet
  alternative: Rattacher grammaticalement ces verbes à « un être humain » ou laisser le pronom « il » ambigu
  rationale: L’allusion à Job 4.18 et la progression du raisonnement indiquent que c’est le Seigneur qui ne se fie pas à ses serviteurs et porte un jugement défavorable sur ses anges. L’explicitation évite en français un contresens probable.
- issue: Nature de ce qui est attribué aux anges
  choice: « quelque grief contre ses anges »
  alternative: « quelque perversité chez ses anges »
  rationale: Le grec peut évoquer soit une chose tortueuse discernée chez eux, soit une accusation ou pensée défavorable à leur encontre. La formulation retenue respecte la construction avec κατὰ et évite d’affirmer plus précisément que le texte ne le fait.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les questions rhétoriques et le contraste entre le mortel, le Seigneur, les serviteurs et les anges sont conservés. Le nom divin est rendu par « le Seigneur » conformément au grec κυρίου.
