  text: He breathed on them, and they died because they lacked wisdom.
translation:
  language: fr
  text: Il souffla sur eux, et ils moururent parce qu’ils n’avaient pas de sagesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεφύσησεν αὐτοῖς
  choice: Il souffla sur eux
  rationale: Rend directement le verbe ἐμφυσάω et le datif αὐτοῖς dans un français naturel, sans préciser davantage la nature ni la force du souffle.
- source_word: ἐτελεύτησαν
  choice: ils moururent
  rationale: Dans ce contexte, le verbe signifie qu’ils arrivèrent au terme de leur vie, donc qu’ils moururent.
- source_word: παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν
  choice: parce qu’ils n’avaient pas de sagesse
  rationale: παρά avec l’infinitif substantivé exprime ici la cause; cette formulation conserve simplement la négation de ἔχειν et le sens de σοφία.
theological_decisions:
- issue: Identité du sujet de ἐνεφύσησεν
  choice: Conserver le pronom « Il » sans expliciter son référent
  alternative: Nommer Dieu ou le Créateur
  rationale: Le fragment grec fourni ne nomme pas le sujet; l’expliciter introduirait une interprétation contextuelle absente de cette proposition.
- issue: Lien entre l’absence de sagesse et la mort
  choice: Rendre le lien causal par « parce que »
  alternative: Employer « faute de sagesse » ou une formulation circonstancielle moins explicite
  rationale: παρὰ τό suivi de l’infinitif indique ici naturellement la cause, sans qu’il soit nécessaire d’en préciser la portée théologique.
translation_notes:
  register: Français moderne, simple et digne. Le passé simple convient au registre narratif et littéraire de l’œuvre. Aucune note n’est nécessaire.
