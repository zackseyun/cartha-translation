  text: γέγραπται· Οὐκ ἦν μορφὴ πρὸ ὀφθαλμῶν μου, ἀλλʼ ἢ αὔραν καὶ φωνὴν ἤκουονʼ
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/003.yaml
  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
translation:
  language: fr
  text: 'Il est écrit : « Il n’y avait aucune forme devant mes yeux ; je n’entendais qu’un souffle et une voix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: Il est écrit
  rationale: Rend directement le parfait passif grec employé comme formule de citation, sans ajouter de lien logique absent du texte.
- source_word: μορφή
  choice: forme
  rationale: Équivalent naturel qui conserve l’idée d’une forme ou apparence perceptible sans la préciser davantage.
- source_word: πρὸ ὀφθαλμῶν μου
  choice: devant mes yeux
  rationale: Expression française idiomatique et proche de la formulation grecque.
- source_word: ἀλλʼ ἢ
  choice: ne… que
  rationale: 'Après la négation, la tournure grecque a ici une valeur exceptive ou restrictive : « rien… sinon / seulement ».'
- source_word: αὔραν
  choice: un souffle
  rationale: Le nom peut désigner un léger souffle d’air ou une brise. « Souffle » préserve mieux la concision et l’indétermination du grec dans ce contexte auditif.
- source_word: φωνήν
  choice: une voix
  rationale: Sens courant du terme dans ce contexte ; l’article indéfini convient à la syntaxe française.
- source_word: ἤκουον
  choice: j’entendais
  rationale: L’imparfait français reflète l’imparfait grec et présente l’audition comme la perception en cours, en contraste avec l’absence de forme visible.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation par point-virgule clarifie le contraste entre l’absence de perception visuelle et la seule perception auditive. Aucune note n’est nécessaire, car les principales nuances du grec sont conservées dans le texte.
