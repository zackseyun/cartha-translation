id: 1CLEM.39.1
reference: 1 Clement 39:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄφρονες καὶ ἀσύνετοι καὶ μωροὶ καὶ ἀπαίδευτοι χλευάζουσιν ἡμᾶς καὶ μυκτηρίζουσιν, ἑαυτοὺς βουλόμενοι ἐπαίρεσθαι ταῖς διανοίαις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/001.yaml
  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: fr
  text: Des gens insensés, sans discernement, stupides et sans instruction se moquent de nous et nous tournent en dérision, désireux de s’élever dans leurs propres pensées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρονες
  choice: insensés
  rationale: Rend le manque de sagesse ou de bon sens, tout en restant distinct de ἀσύνετοι.
- source_word: ἀσύνετοι
  choice: sans discernement
  rationale: Exprime l’absence d’intelligence ou de compréhension pratique et préserve l’accumulation rhétorique grecque.
- source_word: μωροί
  choice: stupides
  rationale: Terme direct qui conserve la force péjorative de l’original sans atténuation excessive.
- source_word: ἀπαίδευτοι
  choice: sans instruction
  rationale: Désigne ceux qui manquent d’éducation ou de formation; formulation naturelle en français moderne.
- source_word: χλευάζουσιν … καὶ μυκτηρίζουσιν
  choice: se moquent de nous et nous tournent en dérision
  rationale: Préserve les deux verbes coordonnés et leur effet d’intensification; μυκτηρίζω indique une raillerie méprisante.
- source_word: βουλόμενοι ἐπαίρεσθαι
  choice: parce qu’ils veulent s’élever
  rationale: Le participe exprime ici le mobile de leur conduite; «s’élever» conserve l’image d’exaltation de soi.
- source_word: ταῖς διανοίαις αὐτῶν
  choice: dans leurs propres pensées
  rationale: Conserve la référence à leur activité mentale et la nuance réflexive implicite de l’exaltation de soi.
theological_decisions:
- issue: Nature de l’élévation exprimée par ἐπαίρεσθαι
  choice: s’élever dans leurs propres pensées
  alternative: se glorifier de leurs raisonnements
  rationale: La formulation retenue reste proche de l’image grecque et n’ajoute pas une notion théologique de gloire absente du texte.
translation_notes:
  register: Français moderne, digne et accessible. La série de quatre qualificatifs est maintenue afin de respecter l’insistance rhétorique de l’original; «des gens» évite un masculin générique inutile, le grec employant ici des adjectifs substantivés.
