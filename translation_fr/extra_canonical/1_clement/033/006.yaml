  yaml_path: translation/extra_canonical/1_clement/033/006.yaml
  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: fr
  text: 'Ainsi donc, après avoir achevé toutes ces choses, il les loua, les bénit et dit : « Soyez féconds et multipliez-vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελειώσας
  choice: après avoir achevé
  rationale: Rend naturellement le participe aoriste tout en conservant l’idée d’achèvement préalable.
- source_word: ἐπῄνεσεν
  choice: il les loua
  rationale: Correspond au sens direct de « louer, approuver »; le pronom reprend toutes les réalités créées mentionnées.
- source_word: ηὐλόγησεν
  choice: les bénit
  rationale: Traduction directe et bibliquement naturelle de εὐλογέω.
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  choice: Soyez féconds et multipliez-vous
  rationale: Formulation française idiomatique de la bénédiction de la Genèse, adaptée au contexte de reproduction plutôt qu’au simple accroissement numérique.
theological_decisions:
- issue: Référent du sujet implicite des verbes
  choice: Conserver « il » sans expliciter « Dieu »
  alternative: Dieu les loua, les bénit et dit
  rationale: Le grec laisse le sujet implicite; la traduction préserve cette formulation sans ajouter une précision absente du verset.
- issue: Portée des pronoms αὐτά
  choice: Employer « les » en référence à « toutes ces choses »
  alternative: Employer « elles » sous une forme disloquée
  rationale: Le pronom grec neutre pluriel reprend l’ensemble évoqué; les pronoms objets français rendent ce lien clairement et naturellement.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec sans devenir pesante; la citation adopte la formulation biblique française courante.
