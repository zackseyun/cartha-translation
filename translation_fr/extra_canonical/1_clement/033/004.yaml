  text: ἐπὶ πᾶσι τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν, ἄνθρωπον, ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν ἔπλασεν τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
translation:
  language: fr
  text: Par-dessus tout[a], il façonna de ses mains saintes et sans souillure l’être humain, œuvre suprême et immensément grande conçue selon sa pensée, empreinte de sa propre image.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Par-dessus tout, il façonna l’être humain, suprême et immensément grand quant à l’intelligence. »'
    reason: 'Le rattachement syntaxique de κατὰ διάνοιαν est discuté : l’expression peut, moins probablement dans ce contexte, qualifier l’être humain sous le rapport de l’intelligence.'
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  choice: Par-dessus tout
  rationale: Rend naturellement la prééminence exprimée par la locution, tout en conservant son lien avec l’ensemble des œuvres créées mentionnées dans le contexte.
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες
  choice: œuvre suprême et immensément grande
  rationale: Les adjectifs neutres substantivés présentent l’être humain comme l’œuvre par excellence; «immensément» restitue la force du préfixe παμ- sans suggérer une grandeur physique seulement.
- source_word: κατὰ διάνοιαν
  choice: conçue selon sa pensée
  rationale: Rattache l’expression à l’œuvre issue de la pensée divine, conformément au contexte créateur, sans l’interpréter comme une qualité intellectuelle de l’être humain.
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: Désigne ici l’humanité ou la personne humaine en général, plutôt que l’homme de sexe masculin.
- source_word: ἔπλασεν
  choice: façonna
  rationale: Conserve l’image concrète du modelage ou façonnage, renforcée par la mention des mains.
- source_word: χαρακτῆρα
  choice: empreinte
  rationale: Exprime une marque reproduisant un modèle, sens adapté à la relation avec l’image divine.
theological_decisions:
- issue: Rapport de κατὰ διάνοιαν à l’être humain ou à l’activité créatrice divine
  choice: L’expression qualifie l’œuvre humaine comme conçue selon la pensée de Dieu.
  alternative: Comprendre que l’être humain est suprême et très grand quant à son intelligence.
  rationale: Le contexte immédiat souligne la sagesse, le dessein et la puissance de Dieu dans la création; la forme neutre de τὸ ἐξοχώτατον καὶ παμμέγεθες favorise aussi l’idée de l’œuvre créée plutôt qu’une qualification directe de ἄνθρωπον.
- issue: Force de χαρακτὴρ τῆς ἑαυτοῦ εἰκόνος
  choice: «empreinte de sa propre image»
  alternative: «portant la marque de sa propre image» ou «à l’empreinte de sa propre image»
  rationale: La formulation conserve la densité théologique et la métaphore du grec sans expliciter davantage la nature précise de la ressemblance divine.
translation_notes:
  register: Français international moderne, soutenu mais accessible. «Mains saintes et sans souillure» garde l’anthropomorphisme du texte; «façonna» et «empreinte» préservent ses images concrètes.
