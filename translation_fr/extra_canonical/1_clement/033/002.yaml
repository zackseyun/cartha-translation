source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς γὰρ ὁ δημιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐπὶ τοῖς ἔργοις αὐτοῦ ἀγάλλεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: fr
  text: Car le Créateur et Maître de toutes choses lui-même se réjouit de ses œuvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργός
  choice: Créateur
  rationale: Dans ce contexte, le terme désigne Dieu comme celui qui a réalisé toutes choses; « Créateur » est naturel et précis en français.
- source_word: δεσπότης
  choice: Maître
  rationale: « Maître » exprime l’autorité souveraine sans la connotation négative que « despote » porte en français moderne.
- source_word: τῶν ἁπάντων
  choice: de toutes choses
  rationale: Cette formulation restitue la portée universelle du grec et convient au référent neutre pluriel implicite.
- source_word: ἀγάλλεται
  choice: se réjouit
  rationale: Le verbe indique une joie vive; « se réjouit » offre ici un français digne et naturel.
- source_word: ἐπὶ τοῖς ἔργοις αὐτοῦ
  choice: de ses œuvres
  rationale: Avec un verbe de joie, ἐπί introduit ce qui motive cette joie; « de » est l’expression idiomatique française.
theological_decisions:
- issue: Valeur intensive de αὐτός
  choice: Conserver « lui-même »
  alternative: Ne pas l’exprimer explicitement
  rationale: Le pronom grec met en relief le Créateur et Maître lui-même; la traduction préserve cette insistance sans l’interpréter davantage.
translation_notes:
  register: Français moderne, international et soutenu, avec une syntaxe proche du grec tout en restant claire pour un lectorat général.
