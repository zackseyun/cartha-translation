id: 1CLEM.33.1
reference: 1 Clement 33:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
translation:
  language: fr
  text: Que ferons-nous donc, frères ? Cesserons-nous de faire le bien[a] et abandonnerons-nous l’amour ? Que le Maître ne permette jamais que cela se produise parmi nous ! Empressons-nous plutôt d’accomplir toute bonne œuvre avec ardeur et empressement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Renoncerons-nous à faire le bien ? »'
    reason: Signale une autre formulation naturelle de ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας, qui exprime l’arrêt de la pratique du bien.
lexical_decisions:
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  choice: Cesserons-nous de faire le bien
  rationale: Avec ἀπό, ἀργέω exprime ici l’idée de cesser ou de renoncer à une activité, plutôt que de la poursuivre avec nonchalance.
- source_word: δεσπότης
  choice: le Maître
  rationale: Rend le titre d’autorité δεσπότης sans introduire une désignation théologique absente du texte.
- source_word: μετὰ ἐκτενείας καὶ προθυμίας
  choice: avec persévérance et empressement
  rationale: ἐκτένεια évoque une application soutenue et προθυμία une disposition ardente et volontaire; la paire française conserve ces deux nuances.
- source_word: ἐπιτελεῖν
  choice: accomplir
  rationale: Exprime la réalisation effective et menée à son terme de toute œuvre bonne.
theological_decisions:
- issue: Référent du titre ὁ δεσπότης
  choice: le Maître
  alternative: le Seigneur
  rationale: Le grec emploie δεσπότης, non κύριος. « Maître » préserve cette distinction lexicale et laisse au contexte l’identification du référent.
- issue: Portée de ἐφ’ ἡμῖν γε γενηθῆναι
  choice: que cela se produise parmi nous
  alternative: que cela nous arrive
  rationale: « Parmi nous » convient au caractère communautaire de l’exhortation, tout en maintenant l’idée que le Maître ne doit pas laisser cette défection advenir dans la communauté.
translation_notes:
  register: Français international moderne, digne et exhortatif. Les questions rhétoriques et le contraste introduit par ἀλλά sont conservés; « frères » traduit directement ἀδελφοί dans l’adresse communautaire.
