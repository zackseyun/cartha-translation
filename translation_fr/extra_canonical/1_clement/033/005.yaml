id: 1CLEM.33.5
reference: 1 Clement 33:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: fr
  text: 'Car voici ce que dit Dieu : « Faisons l’être humain à notre image et à notre ressemblance. » Et Dieu créa l’être humain ; homme et femme, il les créa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: Le grec désigne ici l’humain au sens générique. Cette formulation moderne conserve cette portée collective sans le confondre avec le masculin ἄρσεν qui suit.
- source_word: κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν
  choice: à notre image et à notre ressemblance
  rationale: Rend distinctement les deux substantifs grecs et conserve le parallélisme de la citation.
- source_word: ἐποίησεν
  choice: créa
  rationale: Dans cette citation du récit de la création, « créa » exprime naturellement l’acte divin tout en restant fidèle au sens contextuel de ποιέω.
- source_word: ἄρσεν καὶ θῆλυ
  choice: homme et femme
  rationale: Formulation française naturelle pour la distinction sexuelle humaine exprimée par le grec, sans reprendre « mâle et femelle », plus littéral mais moins idiomatique ici.
theological_decisions:
- issue: Le pluriel divin dans Ποιήσωμεν et ἡμετέραν
  choice: « Faisons… notre… notre »
  alternative: Reformuler au singulier ou expliciter l’identité des interlocuteurs
  rationale: Le texte grec laisse le pluriel sans explication. La traduction préserve cette tension et n’impose aucune interprétation théologique.
- issue: Portée collective de αὐτούς
  choice: « il les créa »
  alternative: « il le créa »
  rationale: Le pluriel renvoie à l’humanité présentée comme homme et femme et doit être maintenu.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation met clairement en relief la citation scripturaire. « L’être humain » évite l’ambiguïté moderne de « l’homme » comme terme générique, tandis que « homme et femme » rend naturellement le contraste final.
