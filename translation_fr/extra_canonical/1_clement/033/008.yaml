id: 1CLEM.33.8
reference: 1 Clement 33:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: ἔχοντες οὖν τοῦτον τὸν ὑπογραμμὸν ἀόκνως προσέλθωμεν τῷ θελήματι αὐτοῦ· ἐξ ὅλης τῆς ἰσχύος ἡμῶν ἐργασώμεθα ἔργον δικαιοσύνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
translation:
  language: fr
  text: Ayant donc ce modèle, allons sans hésiter vers ce qu’il veut ; de toutes nos forces, accomplissons une œuvre de justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπογραμμόν
  choice: modèle
  rationale: Le terme désigne ici un exemple ou un modèle à suivre ; « modèle » est clair, naturel et conserve cette fonction exemplaire.
- source_word: ἀόκνως
  choice: sans hésiter
  rationale: L’adverbe exprime l’absence de réticence, d’hésitation ou de recul, plutôt que le seul empressement.
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  choice: allons … vers ce qu’il veut
  rationale: Cette formulation française naturelle conserve le mouvement exprimé par προσέρχομαι et rend θελήματι αὐτοῦ sans ajouter explicitement l’idée d’obéir ou d’accomplir.
- source_word: ἐξ ὅλης τῆς ἰσχύος ἡμῶν
  choice: de toutes nos forces
  rationale: Équivalent idiomatique direct qui exprime la mobilisation entière de la capacité des destinataires.
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  choice: accomplissons une œuvre de justice
  rationale: Cette traduction évite la répétition peu naturelle « œuvrons une œuvre » tout en conservant le nom singulier ἔργον et le complément δικαιοσύνης.
theological_decisions:
- issue: Rapport à la volonté divine
  choice: « allons … vers ce qu’il veut »
  alternative: « accomplissons sa volonté »
  rationale: Le grec décrit littéralement un mouvement vers la volonté de Dieu ; traduire directement par son accomplissement résoudrait plus précisément que le texte la nature de ce rapport.
translation_notes:
  register: Français international moderne, exhortatif et digne. La syntaxe reste proche du grec tout en évitant les tournures abstraites peu naturelles en français.
