source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
translation:
  language: fr
  text: Car, par son immense puissance, il a affermi les cieux et, par son intelligence insondable, il les a mis en ordre. Il a séparé la terre de l’eau qui l’entoure et l’a établie sur le fondement solide de son propre dessein. Il a ordonné par son propre ordre que les êtres vivants qui se déplacent sur elle viennent à l’existence. Après avoir préparé la mer et les êtres vivants qu’elle contient, il l’a enfermée[a] par sa propre puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet du verbe n’est pas exprimé en grec ; il s’agit très probablement de la mer.
    reason: Préserve l’ellipse et la légère ambiguïté grammaticale de la dernière proposition.
lexical_decisions:
- source_word: παμμεγεθεστάτῳ … κράτει
  choice: immense puissance
  rationale: Rend l’intensif superlatif et l’idée de force souveraine dans un français naturel et digne.
- source_word: διεκύβευσεν
  choice: il les a gouvernés
  rationale: Le verbe évoque l’action de diriger ou de conduire avec maîtrise; « gouverner » conserve cette image sans imposer un vocabulaire technique.
- source_word: ἀκαταλήπτῳ … συνέσει
  choice: intelligence insondable
  rationale: « Insondable » exprime ce qui échappe à la compréhension humaine, tandis qu’« intelligence » rend σύνεσις.
- source_word: ἔδρασεν
  choice: l’a établie
  rationale: Exprime la fixation ferme de la terre sur un fondement sûr sans lourdeur littérale.
- source_word: διατάξει
  choice: selon l’ordre qu’il avait lui-même établi
  rationale: Préserve l’idée d’un ordre ou d’une disposition divine, plutôt que celle d’un simple commandement ponctuel.
- source_word: ἐνέκλεισεν
  choice: il l’a enfermée
  rationale: Rend directement l’idée d’enclore ou de contenir; le pronom féminin renvoie naturellement à « la mer » en français.
theological_decisions:
- issue: Fondement de la terre et volonté divine
  choice: sur le fondement sûr de sa propre volonté
  alternative: sur la base stable de son propre dessein
  rationale: Conserve la métaphore cosmologique du fondement et rend βούλημα par « volonté », sans transformer l’image en affirmation scientifique.
- issue: Venue à l’existence des êtres vivants
  choice: que les êtres vivants … viennent à l’existence
  alternative: aux êtres vivants … d’exister
  rationale: Le grec ἐκέλευσεν εἶναι présente leur existence comme résultant de l’ordre divin; la formulation retenue l’exprime clairement sans préciser davantage le mode de création.
- issue: Objet implicite du dernier verbe
  choice: le pronom renvoie à la mer
  alternative: le pronom reprendrait la mer et les êtres vivants comme un ensemble
  rationale: Le singulier implicite après « la mer et les êtres vivants » vise très probablement la mer, mais la note signale la forme elliptique du grec.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les longues périodes du grec sont réparties en phrases claires, tout en conservant leur progression solennelle et les images du fondement, du gouvernement des cieux et de la mer enfermée.
