revisions:
- from: Car, par son immense puissance, il a affermi les cieux et, par son intelligence insondable, il les a gouvernés. Il a séparé la terre de l’eau qui l’entoure et l’a établie sur le fondement sûr de sa propre volonté. Il a ordonné, selon l’ordre qu’il avait lui-même établi, que les êtres vivants qui se déplacent sur elle viennent à l’existence. Après avoir préparé la mer et les êtres vivants qu’elle contient, il l’a enfermée[a] par sa propre puissance.
  to: Car, par son immense puissance, il a affermi les cieux et, par son intelligence insondable, il les a mis en ordre. Il a séparé la terre de l’eau qui l’entoure et l’a établie sur le fondement solide de son propre dessein. Il a ordonné par son propre ordre que les êtres vivants qui se déplacent sur elle viennent à l’existence. Après avoir préparé la mer et les êtres vivants qu’elle contient, il l’a enfermée[a] par sa propre puissance.
  rationale: 'Les corrections resserrent la traduction sur le grec : les cieux sont « mis en ordre » plutôt que politiquement « gouvernés », et la διατάξις est rendue sans introduire l’idée supplémentaire qu’un ordre aurait auparavant été établi. La note finale conserve explicitement l’ellipse grecque et l’identification probable de la mer comme objet.'
