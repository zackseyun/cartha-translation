source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, ὅτι ἐν ἔργοις ἀγαθοῖς πάντες ἐκοσμήθησαν οἱ δίκαιοι, καὶ αὐτὸς δὲ ὁ κύριος ἔργοις ἀγαθοῖς ἑαυτὸν κοσμήσας ἐχάρη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
translation:
  language: fr
  text: Considérons que tous les justes ont été parés de bonnes œuvres, et que le Seigneur lui-même aussi, s’étant paré de bonnes œuvres, s’est réjoui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  choice: Voyons
  rationale: Rend directement le subjonctif d’exhortation (« voyons », « considérons »), sans ajouter une nuance déductive absente du grec.
- source_word: ἐκοσμήθησαν
  choice: ont été parés
  rationale: Conserve la voix passive et l’image de l’ornement exprimée par κοσμέω, tout en restant intelligible en français courant.
- source_word: ἔργοις ἀγαθοῖς
  choice: de bonnes œuvres
  rationale: Expression française naturelle qui garde le sens éthique de l’expression grecque et sa résonance dans la littérature chrétienne ancienne.
- source_word: καὶ αὐτὸς δὲ ὁ κύριος
  choice: et que le Seigneur lui-même aussi
  rationale: « lui-même » rend αὐτός, tandis que « aussi » restitue la valeur additive de καί…δέ sans forcer le sens ascendant « même ».
- source_word: κοσμήσας
  choice: après s’être paré
  rationale: Marque naturellement en français l’antériorité circonstancielle du participe aoriste par rapport à ἐχάρη, sans transformer cette relation en causalité explicite.
- source_word: ἐχάρη
  choice: s’est réjoui
  rationale: Rend l’aoriste passif de forme mais déponent de sens, sans préciser l’objet ou la cause de la joie, que le grec laisse implicite.
theological_decisions:
- issue: Relation entre les bonnes œuvres et la joie du Seigneur
  choice: 'Simple succession : « après s’être paré… s’est réjoui »'
  alternative: 'Lien causal : « s’est réjoui de s’être paré » ou « s’en est réjoui »'
  rationale: Le participe aoriste indique naturellement une action antérieure, mais le texte ne dit pas explicitement que les bonnes œuvres sont l’objet ou la cause de la joie; la traduction préserve cette indétermination.
translation_notes:
  register: Style exhortatif, digne et accessible. La métaphore répétée de l’ornement est maintenue dans les deux propositions, comme en grec. La répétition de « que » clarifie la coordination en français.
