    issue: Voix de ἀπέστραπται
    rationale: Le parfait ἀπέστραπται est passif. « Son visage s’est détourné » le transforme en action réflexive du sujet. Il faut rendre « son visage a été détourné », sans préciser l’agent.
  - severity: low
    issue: Sujet ambigu de « Il dit en effet »
    rationale: φησὶν peut se rendre naturellement par la tournure impersonnelle « Car il est dit », qui évite d’assigner arbitrairement le verbe à Jésus ou à l’Esprit Saint.
  - severity: low
    issue: Rendu de κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
    rationale: « avec un faste arrogant ni orgueilleux » est maladroit en français. « Dans le faste de l’arrogance ou de l’orgueil » préserve le singulier κόμπος et les deux génitifs.
