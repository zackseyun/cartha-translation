  to: 'Le sceptre de la majesté de Dieu, le Seigneur Jésus Messie, n’est pas venu dans le faste de l’arrogance ou de l’orgueil, bien qu’il en eût le pouvoir, mais dans l’humilité, comme l’Esprit Saint l’a déclaré à son sujet. Car il est dit :


    « Seigneur, qui a cru à ce que nous avons annoncé ?


    Et à qui le bras du Seigneur a-t-il été révélé ?


    Nous avons annoncé devant lui,


    comme un petit enfant,


    comme une racine dans une terre assoiffée.


    Il n’a ni apparence ni gloire ;


    nous l’avons vu,


    et il n’avait ni apparence ni beauté.


    Au contraire, son apparence était méprisée,


    défaillante par rapport à l’apparence des humains[a] ;


    un homme dans la souffrance et la peine,


    qui savait supporter la faiblesse.


    Parce que son visage a été détourné[b],


    il a été méprisé et n’a pas été estimé. »'
  rationale: 'La révision corrige la voix grammaticale du parfait passif ἀπέστραπται, améliore deux formulations françaises, et rend εἶδος uniformément par « apparence ». Elle ne résout pas artificiellement les obscurités textuelles et syntaxiques de la citation isaïenne : l’absence de complément après « nous avons annoncé », la construction difficile avec ἐκλεῖπον, et l’attachement possible de la proposition introduite par ὅτι sont conservés ou signalés en note.'
