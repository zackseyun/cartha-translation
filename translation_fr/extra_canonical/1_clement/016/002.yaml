source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
translation:
  language: fr
  text: 'Le sceptre de la majesté de Dieu, le Seigneur Jésus Messie, n’est pas venu dans le faste de l’arrogance ou de l’orgueil, bien qu’il en eût le pouvoir, mais dans l’humilité, comme l’Esprit Saint l’a déclaré à son sujet. Car il est dit :


    « Seigneur, qui a cru à ce que nous avons annoncé ?


    Et à qui le bras du Seigneur a-t-il été révélé ?


    Nous avons annoncé devant lui,


    comme un petit enfant,


    comme une racine dans une terre assoiffée.


    Il n’a ni apparence ni gloire ;


    nous l’avons vu,


    et il n’avait ni apparence ni beauté.


    Au contraire, son apparence était méprisée,


    défaillante par rapport à l’apparence des humains[a] ;


    un homme dans la souffrance et la peine,


    qui savait supporter la faiblesse.


    Parce que son visage a été détourné[b],


    il a été méprisé et n’a pas été estimé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « défaillante au-delà de l’apparence des humains » ; le grec est difficile.'
    reason: La tournure ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων est inhabituelle et admet plusieurs nuances.
  - marker: b
    text: 'On peut aussi rattacher cette proposition à ce qui précède : « qui savait supporter la faiblesse, parce que son visage a été détourné ». Le verbe grec est au passif.'
    reason: Le texte ancien ne fixe pas la ponctuation, et le rapport syntaxique de la proposition introduite par ὅτι est incertain ; ἀπέστραπται doit néanmoins être rendu au passif.
lexical_decisions:
- source_word: σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ
  choice: le sceptre de la majesté de Dieu
  rationale: Conserve la métaphore royale et la construction génitive du grec.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus Messie
  rationale: Rend Χριστός selon son sens titulaire, « Messie », plutôt que comme un simple nom propre.
- source_word: κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
  choice: avec un faste arrogant ni orgueilleux
  rationale: κόμπος évoque l’apparat ou l’ostentation, tandis que les deux génitifs expriment l’arrogance et l’orgueil.
- source_word: καίπερ δυνάμενος
  choice: bien qu’il en eût le pouvoir
  rationale: Restitue naturellement la concession participiale tout en laissant implicite, comme en grec, ce que Jésus avait le pouvoir de faire.
- source_word: ἀνηγγείλαμεν ἐναντίον αὐτοῦ
  choice: nous avons annoncé devant lui
  rationale: Ne fournit aucun complément d’objet absent du grec et conserve l’étrangeté de la formulation grecque d’Ésaïe.
- source_word: γῇ διψώσῃ
  choice: une terre assoiffée
  rationale: Préserve l’image littérale et poétique de la terre qui a soif.
- source_word: εἶδος
  choice: prestance / apparence
  rationale: Le mot désigne ici l’aspect visible ou la forme. « Prestance » convient dans le contraste avec la beauté et la gloire, tandis qu’« apparence » est plus naturel dans la proposition suivante.
- source_word: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων
  choice: amoindrie plus que celle des humains
  rationale: Tente de conserver le comparatif difficile introduit par παρά et l’idée de déficience portée par ἐκλεῖπον, sans l’aplanir entièrement.
- source_word: πληγῇ καὶ πόνῳ
  choice: souffrance et peine
  rationale: Dans ce contexte isaïen, πληγή évoque l’affliction, la blessure ou la souffrance, et non une maladie contagieuse.
- source_word: μαλακίαν
  choice: faiblesse
  rationale: Terme assez large pour couvrir la faiblesse, l’infirmité ou la maladie sans imposer une précision absente du grec.
theological_decisions:
- issue: Identification de Jésus comme « sceptre de la majesté de Dieu »
  choice: Maintien direct de la métaphore
  alternative: « Celui qui porte le sceptre de la majesté de Dieu »
  rationale: Le grec met directement en apposition le sceptre et le Seigneur Jésus ; expliciter un porteur modifierait cette christologie imagée.
- issue: Agent du discours prophétique
  choice: « comme l’Esprit Saint l’a déclaré à son sujet »
  alternative: « comme l’Écriture l’a déclaré à son sujet »
  rationale: Le texte attribue explicitement les paroles citées à l’Esprit Saint ; cette attribution est donc conservée.
- issue: Formulation obscure d’Ésaïe 53:2 selon le grec
  choice: « Nous avons annoncé devant lui »
  alternative: « Il a grandi devant lui »
  rationale: La traduction suit le texte grec cité par Clément plutôt que de le corriger d’après l’hébreu ou une traduction moderne d’Ésaïe.
- issue: Lien syntaxique de ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ
  choice: 'Rattachement à la proposition suivante : « Parce que son visage s’est détourné, il a été méprisé »'
  alternative: 'Rattachement à ce qui précède : « qui savait supporter la faiblesse, parce que son visage s’est détourné »'
  rationale: La ponctuation n’est pas originelle et la syntaxe demeure ambiguë. Le choix principal donne une lecture française possible sans prétendre lever définitivement l’ambiguïté ; une note la signale.
translation_notes:
  register: Français international moderne, digne et lisible. La citation conserve un rythme poétique et certaines aspérités du grec d’Ésaïe transmis par Clément. Les termes potentiellement trompeurs en français moderne, notamment « peste » pour πληγή, ont été évités.
