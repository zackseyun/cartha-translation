id: 1CLEM.16.8
reference: 1 Clement 16:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ . ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤκει εἰς θάνατον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/008.yaml
  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: fr
  text: 'Qui décrira sa génération ?


    Car sa vie est ôtée de la terre.


    À cause des transgressions de mon peuple, il est venu jusqu’à la mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν γενεὰν αὐτοῦ
  choice: sa génération
  rationale: Conserve l’ambiguïté du grec γενεά, qui peut évoquer la génération, la lignée ou les contemporains, sans imposer une interprétation.
- source_word: διηγήσεται
  choice: racontera
  rationale: Rend le sens de relater ou exposer, dans une formulation française naturelle.
- source_word: αἴρεται
  choice: est enlevée
  rationale: Reproduit le passif présent du grec et l’idée de retrait, sans préciser l’agent.
- source_word: ἀνομίων
  choice: actes contraires à la loi
  rationale: Exprime concrètement le pluriel grec, qui désigne des transgressions ou actes d’illégalité, plutôt qu’une abstraction générale.
- source_word: ἤκει εἰς θάνατον
  choice: il est allé à la mort
  rationale: Suit la leçon transmise par 1 Clément, distincte de certaines formes textuelles d’Ésaïe 53:8, tout en produisant un français intelligible.
theological_decisions:
- issue: Référent de « sa génération »
  choice: Maintien de la formulation littérale et ambiguë
  alternative: « Qui pourra décrire ses descendants ? » ou « ses contemporains »
  rationale: Le texte grec ne tranche pas explicitement entre ces nuances; la traduction ne doit pas résoudre cette tension.
- issue: Lien causal de la mort
  choice: « À cause des actes contraires à la loi de mon peuple »
  alternative: « Pour les transgressions de mon peuple »
  rationale: La formulation conserve le lien causal exprimé par ἀπό sans développer une théorie particulière de l’expiation.
translation_notes:
  register: Français moderne, digne et accessible. La disposition en trois lignes respecte le caractère citationnel et poétique du passage. La dernière ligne reste volontairement proche de la leçon grecque propre au texte fourni.
