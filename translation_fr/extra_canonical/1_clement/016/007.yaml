  source_fidelity: 'La traduction suit fidèlement la syntaxe et les images du grec : le Seigneur « l’a livré », le parallèle brebis/agneau est conservé, ainsi que la répétition de « n’ouvre pas la bouche ». Toutefois, κεκακῶσθαι est un parfait passif (« avoir été maltraité / avoir subi des mauvais traitements ») ; « parce qu’il est maltraité » le transforme en présent et affaiblit cet aspect accompli.'
  naturalness: Le français est globalement naturel, soutenu sans être archaïsant. « À l’abattoir », « muet » et « celui qui le tond » sont clairs dans un registre moderne. « Parce qu’il a été maltraité » est à la fois plus exact et idiomatique.
  terminology: « Brebis » / « agneau » préserve la distinction πρόβατον / ἀμνός. « Jugement » rend sobrement κρίσις et maintient l’ambiguïté judiciaire. La note proposée signale de manière appropriée l’interprétation selon laquelle la justice lui est refusée, sans l’imposer au texte.
