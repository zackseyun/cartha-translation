source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
translation:
  language: fr
  text: 'Et le Seigneur l’a livré à cause de nos péchés,


    et lui, parce qu’il a été maltraité,


    n’ouvre pas la bouche.


    Comme une brebis, il a été conduit à l’abattoir,


    et comme un agneau muet devant celui qui le tond,


    ainsi il n’ouvre pas la bouche.


    Dans son humiliation, son jugement lui a été retiré.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans son abaissement, justice lui a été refusée. »'
    reason: Le grec peut évoquer soit le retrait de son jugement, soit le déni de justice au cours de son humiliation.
lexical_decisions:
- source_word: παρέδωκεν
  choice: a livré
  rationale: Rend directement l’idée de remettre ou livrer quelqu’un, tout en conservant la portée théologique du passif subi par le serviteur.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: à cause de nos péchés
  rationale: Dans ce contexte, ὑπέρ indique le rapport entre la livraison du serviteur et nos péchés; cette formulation naturelle n’explicite pas davantage la mécanique de substitution.
- source_word: διὰ τὸ κεκακῶσθαι
  choice: parce qu’il est maltraité
  rationale: Le parfait passif infinitif exprime le fait d’avoir subi de mauvais traitements; le présent français convient au tableau prophétique sans surinterpréter la nature de l’affliction.
- source_word: σφαγήν
  choice: l’abattoir
  rationale: Équivalent français naturel de la destination où l’animal est mené pour être égorgé.
- source_word: ἄφωνος
  choice: muet
  rationale: Exprime ici l’absence de voix ou de protestation, en français idiomatique.
- source_word: κρίσις
  choice: jugement
  rationale: Conserve la polysémie judiciaire du grec plutôt que de préciser arbitrairement «justice» ou «condamnation».
- source_word: ἤρθη
  choice: lui a été retiré
  rationale: Rend le passif de αἴρω et laisse ouverte la question de savoir si le jugement a été supprimé, enlevé ou soustrait.
theological_decisions:
- issue: Sens de ὑπέρ dans «ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν»
  choice: à cause de nos péchés
  alternative: pour nos péchés
  rationale: «À cause de» exprime clairement le lien causal attesté ici sans imposer à lui seul une théorie précise de l’expiation.
- issue: Interprétation de «ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη»
  choice: Dans son humiliation, son jugement lui a été retiré
  alternative: Dans son abaissement, justice lui a été refusée
  rationale: La traduction retenue reste proche du grec et préserve l’ambiguïté de κρίσις et du passif ἤρθη; la note signale l’autre compréhension judiciaire possible.
translation_notes:
  register: Français moderne, international et digne, avec disposition poétique correspondant à la citation. «Brebis» et «agneau» conservent la distinction πρόβατον / ἀμνός. La répétition de «n’ouvre pas la bouche» et la corrélation «comme… ainsi» sont maintenues.
