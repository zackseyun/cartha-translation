  text: 'And he bore the sins of many,

    and was given over because of their sins.'
translation:
  language: fr
  text: 'Et lui-même a porté les péchés d’un grand nombre,

    et il a été livré à cause de leurs péchés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτός
  choice: Et lui-même
  rationale: Conserve l’insistance portée par αὐτός et l’enchaînement marqué par καί.
- source_word: ἁμαρτίας πολλῶν
  choice: les péchés d’un grand nombre
  rationale: Rend naturellement le génitif πολλῶν sans réduire sa portée à un groupe défini.
- source_word: ἀνήνεγκε
  choice: a porté
  rationale: Le verbe peut évoquer le fait de porter ou d’offrir; dans ce contexte citationnel, «a porté» préserve la formulation sacrificielle sans la surinterpréter.
- source_word: παρεδόθη
  choice: a été livré
  rationale: Préserve le passif et le sens de remise ou de livraison à une autorité ou à la mort, sans préciser un agent absent du grec.
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  choice: à cause de leurs péchés
  rationale: Rend διά avec l’accusatif dans son sens causal et conserve le renvoi explicite à leurs péchés.
theological_decisions:
- issue: Nature exacte de l’action exprimée par ἀνήνεγκε
  choice: a porté
  alternative: a offert
  rationale: «A porté» respecte l’ambivalence entre portage des péchés et arrière-plan sacrificiel, sans imposer une lecture exclusivement cultuelle.
- issue: Agent implicite du passif παρεδόθη
  choice: ne pas expliciter l’agent
  alternative: Dieu l’a livré / il a été livré par des hommes
  rationale: Le grec emploie un passif sans nommer l’agent; la traduction maintient cette indétermination théologiquement significative.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des deux propositions et le saut de ligne sont conservés. Aucun guillemet final n’est ajouté, puisque l’extrait grec fourni n’en comporte pas.
