source:
  edition: Funk 1901 (normalized OCR)
  text: ἐὰν δῶτε περὶ ἁμαρτίας, ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/011.yaml
  text: 'If you give for sin,

    your soul will see long-lived offspring[a].'
translation:
  language: fr
  text: Si vous présentez une offrande pour le péché[a], votre âme verra une descendance qui vivra longtemps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Si vous donnez pour le péché »; l’expression grecque peut avoir le sens sacrificiel retenu dans le texte.'
    reason: Le mot « offrande » est implicite plutôt qu'exprimé dans le grec, bien que l'expression soit courante dans un contexte sacrificiel.
lexical_decisions:
- source_word: δῶτε περὶ ἁμαρτίας
  choice: vous présentez une offrande pour le péché
  rationale: Dans la langue sacrificielle de la Septante, περὶ ἁμαρτίας peut désigner une offrande pour le péché. « Présenter » convient idiomatiquement à une offrande, même si le grec dit littéralement « donner »; la note conserve cette formulation plus stricte.
- source_word: ἡ ψυχὴ ὑμῶν
  choice: votre âme
  rationale: Reproduit le singulier collectif ψυχή associé au possessif pluriel ὑμῶν, sans le transformer en pluriel.
- source_word: σπέρμα μακρόβιον
  choice: une descendance qui vivra longtemps
  rationale: σπέρμα signifie ici « descendance »; la proposition relative rend clairement et naturellement l'adjectif μακρόβιον.
theological_decisions:
- issue: Sens sacrificiel de περὶ ἁμαρτίας
  choice: une offrande pour le péché
  alternative: pour le péché
  rationale: Le contexte scripturaire et l'usage de la Septante soutiennent le sens sacrificiel, mais l'ellipse du nom « offrande » dans le grec est signalée en note afin de ne pas masquer l'ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La structure au singulier « votre âme » est maintenue malgré son caractère légèrement marqué, afin de respecter le grec.
