  text: Ταπεινοφρονῶντω γὰρ ἐστὶν ὁ Χριστός, οὐχ ἐπιρριπμένων ἐπὶ τὸν φόβον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/001.yaml
  text: For the Messiah belongs to the humble-minded, not to those who exalt themselves over his flock.
translation:
  language: fr
  text: Car le Christ appartient aux humbles de cœur, non à ceux qui s’élèvent au-dessus de son troupeau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec issu de l’OCR fourni lit littéralement « non à ceux qui se jettent sur sa crainte », formulation manifestement corrompue. Le texte grec attesté de ce passage porte : « non à ceux qui s’élèvent au-dessus de son troupeau ».'
    reason: Signaler en toute transparence la corruption de l’OCR tout en traduisant la leçon grecque établie.
lexical_decisions:
- source_word: Ταπεινοφρονούντων
  choice: aux humbles de cœur
  rationale: Le génitif substantivé désigne ceux qui font preuve d’humilité intérieure; cette formulation française est naturelle et conserve la portée morale du terme.
- source_word: ὁ Χριστός
  choice: le Christ
  rationale: Dans ce contexte chrétien ancien, « le Christ » est la désignation française usuelle et directe du grec.
- source_word: ἐπαιρομένων ἐπὶ τὸ ποίμνιον αὐτοῦ
  choice: ceux qui s’élèvent au-dessus de son troupeau
  rationale: Cette leçon grecque attestée, à l’origine de la révision anglaise, exprime l’arrogance envers la communauté placée sous la garde du Christ.
theological_decisions:
- issue: Relation du Christ avec les humbles
  choice: « appartient aux humbles de cœur »
  alternative: « est du côté des humbles de cœur »
  rationale: Le choix retenu conserve la construction grecque avec le génitif et sa force, sans préciser davantage la nature de cette appartenance.
- issue: Image ecclésiale de ποίμνιον
  choice: « son troupeau »
  alternative: « sa communauté »
  rationale: L’image pastorale est conservée sans identifier explicitement le troupeau à une structure ecclésiastique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant immédiatement compréhensible.
