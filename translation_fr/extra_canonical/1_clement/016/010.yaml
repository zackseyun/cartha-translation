id: 1CLEM.16.10
reference: 1 Clement 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: fr
  text: '« Je donnerai les méchants à la place de sa tombe,


    et les riches à la place de sa mort,


    parce qu’il n’a commis aucune injustice


    et qu’aucune tromperie n’a été trouvée dans sa bouche.


    Et le Seigneur veut le purifier de son affliction. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: je livrerai
  rationale: Dans cette construction, « livrer » exprime plus naturellement que « donner » l’idée de remettre ou d’assigner quelqu’un, tout en conservant la première personne du grec.
- source_word: πονηρούς
  choice: les méchants
  rationale: Rend directement le substantif adjectival grec, sans préciser une catégorie absente du texte.
- source_word: ἀντὶ
  choice: en échange de
  rationale: Préserve le rapport de substitution ou de correspondance exprimé par ἀντί, sans tenter de résoudre l’étrangeté de la formulation.
- source_word: ἀνομίαν
  choice: injustice
  rationale: « Injustice » est naturel en français moderne et couvre ici l’acte contraire au droit ou à la loi, sans introduire un vocabulaire confessionnel.
- source_word: δόλος
  choice: tromperie
  rationale: Exprime la fraude ou la duplicité du terme grec dans un français courant et digne.
- source_word: πληγῆς
  choice: affliction
  rationale: Le mot peut désigner un coup, une plaie ou un fléau; « affliction » conserve ici une portée assez large et convient à l’action de purifier « de » cette atteinte.
theological_decisions:
- issue: Formulation énigmatique concernant la tombe et la mort
  choice: Conserver « les méchants en échange de sa tombe » et « les riches en échange de sa mort »
  alternative: Harmoniser avec une forme connue d’Ésaïe 53:9, par exemple « on a placé sa tombe parmi les méchants et son tombeau parmi les riches »
  rationale: Le texte grec transmis par 1 Clément présente explicitement δώσω et ἀντί. La traduction garde cette leçon et sa tension plutôt que de la corriger d’après une autre tradition textuelle.
- issue: Sens de καθαρίσαι αὐτὸν τῆς πληγῆς
  choice: « le purifier de son affliction »
  alternative: « le guérir de sa plaie » ou « le purifier du coup »
  rationale: La construction et le lexique sont inhabituels. La version retenue suit καθαρίσαι et maintient l’ambiguïté de πληγή au lieu de réduire le passage à une guérison physique.
translation_notes:
  register: Citation poétique présentée en lignes, dans un français moderne, sobre et solennel. L’étrangeté syntaxique et théologique du texte source est volontairement préservée; aucun marqueur de note n’est nécessaire.
