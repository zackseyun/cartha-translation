  rationale: La révision remplace « livrerai » par « donnerai », correspondant directement à δώσω, et « en échange de » par « à la place de », rendu français plus neutre de ἀντί. Elle conserve l’ordre, le parallélisme et l’ambiguïté de la formulation grecque, sans l’harmoniser avec d’autres formes d’Ésaïe 53:9.
  reviewer_model: gpt-5.6-terra
