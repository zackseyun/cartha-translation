  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
translation:
  language: fr
  text: 'Tous ceux qui me voyaient se sont moqués de moi ;

    ils ont parlé en remuant les lèvres,

    ils ont secoué la tête :

    « Il a mis son espérance dans le Seigneur : que le Seigneur le délivre,

    qu’il le sauve, puisqu’il prend plaisir en lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωροῦντές
  choice: qui me voyaient
  rationale: Le participe présent décrit ceux qui regardaient le locuteur, tandis que les verbes principaux sont au passé ; l’imparfait français préserve cet aspect sans créer de discordance temporelle maladroite.
- source_word: ἐξεμυκτήρισάν
  choice: se sont moqués de moi
  rationale: Rend clairement l’idée de raillerie ou de dérision exprimée par le verbe grec.
- source_word: ἐλάλησαν ἐν χείλεσιν
  choice: ils ont parlé du bout des lèvres
  rationale: Conserve l’image corporelle du grec tout en employant une expression française naturelle évoquant les paroles de mépris.
- source_word: ἐκίνησαν κεφαλήν
  choice: ils ont secoué la tête
  rationale: Le singulier grec est distributif après un sujet pluriel ; le français idiomatique emploie ici le singulier dans la locution « secouer la tête ».
- source_word: Ἤλπισεν ἐπὶ κύριον
  choice: Il a mis son espérance dans le Seigneur
  rationale: Exprime naturellement en français la confiance dirigée vers le Seigneur.
- source_word: ῥυσάσθω
  choice: que le Seigneur le délivre
  rationale: Le référent implicite de l’impératif est explicité pour éviter l’ambiguïté pronominale française, sans modifier le sens.
- source_word: θέλει αὐτόν
  choice: il prend plaisir en lui
  rationale: Dans ce contexte scripturaire, θέλει avec une personne pour objet exprime la faveur ou le plaisir pris en elle, plutôt qu’un simple vouloir.
theological_decisions:
- issue: Référent de ὅτι θέλει αὐτόν
  choice: « puisqu’il prend plaisir en lui », avec le Seigneur comme sujet implicite
  alternative: « puisqu’il le veut »
  rationale: 'La proposition donne le motif attendu de la délivrance : le Seigneur trouve son plaisir dans l’homme qui espère en lui. La formulation conserve les pronoms du texte sans ajouter d’interprétation doctrinale.'
- issue: Force des impératifs ῥυσάσθω et σωσάτω
  choice: 'Des défis ironiques : « que le Seigneur le délivre, qu’il le sauve »'
  alternative: Des souhaits ou prières sincères
  rationale: Le cadre de moquerie indique que ces impératifs rapportent les paroles provocatrices des railleurs.
translation_notes:
  register: Français international moderne, digne et lisible. La disposition poétique et le discours direct sont conservés. « Du bout des lèvres » maintient l’image des lèvres et le ton de dérision ; « secouer la tête » est l’expression française naturelle.
