source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: fr
  text: 'Mais lui, il a été blessé à cause de nos péchés,

    et affligé à cause de nos actes contraires à la loi.

    Le châtiment qui nous procure la paix est tombé sur lui ;

    par sa meurtrissure, nous avons été guéris.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: a été blessé
  rationale: Rend directement le passif de τραυματίζω et conserve l’image corporelle du texte.
- source_word: μεμαλάκισται
  choice: accablé
  rationale: Dans ce contexte de souffrance, ce terme exprime l’affliction ou l’abattement. « Accablé » est naturel en français et évite le sens moderne potentiellement trompeur de « ramolli ».
- source_word: ἀνομίας
  choice: actes contraires à la loi
  rationale: Préserve la référence explicite à la transgression de la loi, plutôt que de la réduire à une notion générale de faute.
- source_word: παιδεία
  choice: châtiment
  rationale: Dans ce contexte, le mot désigne une correction punitive ou disciplinaire subie, et non une simple instruction.
- source_word: μώλωπι
  choice: meurtrissure
  rationale: Conserve l’image d’une marque ou plaie causée par un coup, avec un registre digne et compréhensible.
- source_word: ἰάθημεν
  choice: avons été guéris
  rationale: Reproduit le passif aoriste et maintient la métaphore de la guérison.
theological_decisions:
- issue: Rapport entre le châtiment, la paix et celui qui souffre
  choice: Le châtiment qui nous procure la paix est tombé sur lui
  alternative: Le châtiment de notre paix était sur lui
  rationale: La formulation grecque, très condensée, affirme que le châtiment lié à notre paix repose sur lui. La traduction retenue rend ce rapport intelligible sans préciser davantage le mécanisme théologique.
- issue: Valeur causale de διά avec l’accusatif
  choice: à cause de nos péchés / à cause de nos actes contraires à la loi
  alternative: pour nos péchés / pour nos transgressions
  rationale: « À cause de » respecte explicitement la valeur causale et évite de décider à lui seul si le passage formule aussi une substitution, tout en laissant cette lecture possible dans l’ensemble.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition poétique et le parallélisme des quatre membres sont conservés. Le pronom disloqué « lui » souligne αὐτός sans alourdir excessivement le vers.
