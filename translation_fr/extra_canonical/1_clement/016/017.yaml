id: 1CLEM.16.17
reference: 1 Clement 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἄνδρες ἀγαπητοί, τίς ὁ ὑπογραμμὸς· δεδομένoς ἡμῖν· εἰ γὰρ ὁ κύριος οὕτως ἐταπεινοφρόνησεν, τί ποιήσωμεν ἡμεῖς οἱ ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ δι’ αὐτοῦ ἐλθόντες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
translation:
  language: fr
  text: Voyez, bien-aimés, quel modèle nous a été donné. Car si le Seigneur s’est ainsi abaissé, que devons-nous faire, nous qui, par lui, sommes venus nous placer sous le joug de sa grâce ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Voyez
  rationale: L’impératif présent pluriel appelle directement les destinataires à considérer le modèle qui vient d’être présenté.
- source_word: ἄνδρες ἀγαπητοί
  choice: bien-aimés
  rationale: Le français naturel peut omettre « hommes » dans cette adresse collective sans perdre l’affection exprimée par ἀγαπητοί.
- source_word: ὑπογραμμός
  choice: modèle
  rationale: Le mot désigne un exemple ou tracé proposé à l’imitation; « modèle » convient au contexte moral.
- source_word: ἐταπεινοφρόνησεν
  choice: s’est ainsi abaissé
  rationale: Le verbe rare exprime ici l’humilité volontaire du Seigneur; cette formulation française restitue l’action sans employer le peu naturel « s’est humilié d’esprit ».
- source_word: ζυγὸν τῆς χάριτος αὐτοῦ
  choice: le joug de sa grâce
  rationale: La métaphore du joug est conservée, ainsi que sa tension avec la grâce.
- source_word: δι’ αὐτοῦ ἐλθόντες
  choice: qui, par lui, sommes venus nous placer
  rationale: Rend le mouvement exprimé par ἐλθόντες et rattache clairement δι’ αὐτοῦ au moyen par lequel les croyants sont entrés sous ce joug.
theological_decisions:
- issue: Rapport paradoxal entre le joug et la grâce
  choice: Conserver littéralement « le joug de sa grâce »
  alternative: Paraphraser par « l’autorité bienveillante de sa grâce »
  rationale: Le grec associe délibérément ζυγός et χάρις; expliciter ou adoucir cette image supprimerait une tension significative.
- issue: Nature de l’abaissement du Seigneur
  choice: « s’est ainsi abaissé »
  alternative: « a fait preuve d’une telle humilité »
  rationale: La forme verbale et le contexte christologique favorisent un acte d’abaissement, tout en évitant de préciser davantage sa nature.
translation_notes:
  register: Français international moderne, digne et exhortatif. La phrase conserve l’impératif rhétorique initial et la métaphore biblique du joug, tout en privilégiant une syntaxe naturelle.
