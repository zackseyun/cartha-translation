  yaml_path: translation/extra_canonical/1_clement/016/006.yaml
  text: 'We all went astray like sheep;

    each man went astray in his own way[a].'
translation:
  language: fr
  text: 'Nous nous sommes tous égarés comme des brebis ;

    chacun s’est égaré sur son chemin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες ὡς πρόβατα ἐπλανήθημεν
  choice: Nous nous sommes tous égarés comme des brebis
  rationale: Cette formulation naturelle en français moderne conserve le sujet inclusif « tous », la comparaison avec les brebis et l’idée d’égarement exprimée par le verbe grec.
- source_word: ἄνθρωπος
  choice: chacun
  rationale: 'Le singulier grec a ici une valeur distributive : chaque personne suit son chemin. « Chacun » restitue clairement cette portée sans introduire une restriction masculine.'
- source_word: τῇ ὁδῷ αὐτοῦ
  choice: sur son propre chemin
  rationale: « Sur son chemin » est le sens littéral ; « propre » rend explicite la valeur distributive du possessif dans ce parallélisme.
- source_word: ἐπλανήθη
  choice: s’est égaré
  rationale: Le même verbe étant employé dans les deux membres grecs, la répétition française préserve leur parallélisme.
theological_decisions:
- issue: Portée universelle et responsabilité individuelle
  choice: Conserver à la fois « tous » et « chacun »
  alternative: Fondre les deux propositions en une seule affirmation collective
  rationale: Le texte juxtapose l’égarement collectif et sa réalisation individuelle ; la traduction maintient cette tension sans l’expliquer théologiquement.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme des deux propositions et la répétition de « s’égarer » sont conservés.
