  source_fidelity: 'Le rendu suit globalement la succession des infinitifs et conserve les termes importants : souffrance/âme, lumière, façonner, justifier, juste et porter les péchés. Toutefois, « le soustraire » introduit dans le texte un complément direct (« le ») qui n’est pas exprimé par le grec. La note signale correctement le problème, mais le texte principal peut préserver plus directement l’ellipse source.'
