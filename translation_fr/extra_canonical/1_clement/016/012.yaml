  terminology: « Le Seigneur », « la lumière », « justifier le juste » et « portera leurs péchés » sont des choix justes et non confessionnellement surdéterminés. Le défini de « le juste » est défendable dans le cadre de la citation, sans imposer une identification doctrinale.
