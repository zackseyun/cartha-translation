source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
translation:
  language: fr
  text: 'Et le Seigneur veut enlever de la souffrance de son âme[a],


    lui montrer la lumière et le façonner avec intelligence,


    justifier le juste qui sert bien un grand nombre ;


    et lui-même portera leurs péchés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ne précise pas le complément direct de « enlever ». On peut aussi comprendre : « le soustraire à la souffrance de son âme ».'
    reason: Préserve l’ambiguïté syntaxique de ἀφελεῖν avec le groupe introduit par ἀπό, sans introduire dans le texte principal un pronom absent du grec.
lexical_decisions:
- source_word: ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ
  choice: le soustraire à la souffrance de son âme
  rationale: La construction avec ἀπό indique naturellement l’éloignement hors de la souffrance; le complément d’objet « le » est implicite en grec et repris du contexte. Une note conserve l’autre analyse possible.
- source_word: δεῖξαι αὐτῷ φῶς
  choice: lui montrer la lumière
  rationale: Rendu direct qui conserve l’image et l’absence d’article devant « lumière » sans produire un français artificiel.
- source_word: πλάσαι τῇ συνέσει
  choice: le façonner par l’intelligence
  rationale: « Façonner » garde l’image forte de πλάσσω. « Par l’intelligence » maintient la formulation inhabituelle et la possible valeur instrumentale du datif, sans expliciter indûment l’agent ou le résultat.
- source_word: δικαιῶσαι δίκαιον
  choice: justifier le juste
  rationale: La répétition étymologique et la tension entre « justifier » et « juste » sont conservées; le défini français convient à cette figure présentée dans le contexte.
- source_word: εὖ δουλεύοντα πολλοῖς
  choice: qui sert bien un grand nombre
  rationale: Le participe décrit le juste; εὖ porte naturellement sur « sert », et πολλοῖς désigne les nombreuses personnes auxquelles il rend service.
- source_word: τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει
  choice: lui-même portera leurs péchés
  rationale: L’ordre français souligne αὐτός par « lui-même » et rend ἀναφέρω par le sens contextuel de porter ou prendre sur soi.
theological_decisions:
- issue: Identité et caractère défini de δίκαιον
  choice: « le juste »
  alternative: « un juste » ou « un homme juste »
  rationale: Le grec est sans article, mais le participe renvoie à la figure singulière déjà évoquée. Le français défini respecte cette continuité sans lui attribuer explicitement une identité doctrinale.
- issue: Rapport entre le juste et les péchés d’autrui
  choice: « lui-même portera leurs péchés »
  alternative: « il emportera leurs péchés »
  rationale: « Portera » conserve la portée substitutive possible du passage tout en laissant ouverte la nuance exacte de ἀνοίσει; aucune explication doctrinale n’est ajoutée.
translation_notes:
  register: Français international moderne, digne et lisible. La disposition en lignes conserve le rythme de la citation. Les formulations volontairement inhabituelles « façonner par l’intelligence » et « justifier le juste » reflètent les tensions lexicales du grec plutôt que de les lisser.
