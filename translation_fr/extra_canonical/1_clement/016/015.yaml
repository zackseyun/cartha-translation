  source_fidelity: La première ligne et l’image de « ver » rendent fidèlement καὶ πάλιν αὐτὸς φησίν et σκώληξ. En revanche, « la honte des humains » affaiblit ὄνειδος, qui désigne l’opprobre, le reproche ou l’injure plutôt que le sentiment de honte. « le mépris du peuple » peut désigner le mépris que le peuple éprouve, mais rend moins clairement ἐξουθένημα comme le statut d’objet méprisé.
  naturalness: Le français est globalement naturel et le registre convient à une citation poétique. « L’opprobre des hommes » est idiomatique dans ce registre; « l’objet du mépris du peuple » explicite naturellement la valeur du substantif grec.
  terminology: « Hommes » convient ici à ἀνθρώπων dans une formulation traditionnelle et littéraire, sans introduire de restriction masculine contextuelle. « Opprobre » rend exactement le registre et le sens de ὄνειδος. Aucune note n’est requise.
