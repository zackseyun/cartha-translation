source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
translation:
  language: fr
  text: 'Et lui-même dit encore :


    « Mais moi, je suis un ver et non un homme,


    l’opprobre des hommes et l’objet du mépris du peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκώληξ
  choice: ver
  rationale: Équivalent français direct, naturel et conforme à l’image dépréciative du texte.
- source_word: ὄνειδος ἀνθρώπων
  choice: la honte des humains
  rationale: Préserve la construction nominale et rend ὄνειδος comme ce qui fait honte ou attire l’opprobre parmi les êtres humains.
- source_word: ἐξουθένημα λαοῦ
  choice: le mépris du peuple
  rationale: Conserve le parallélisme nominal avec « la honte des humains » et exprime l’idée d’un objet de mépris sans transformer le substantif grec en forme verbale.
theological_decisions:
- issue: Identité du locuteur dans la citation
  choice: Ne pas l’expliciter au-delà de « lui-même »
  alternative: Identifier expressément le Christ
  rationale: Le contexte de 1 Clément peut fournir l’antécédent, mais le verset grec lui-même emploie seulement αὐτός ; la traduction conserve cette formulation sans ajouter une identification absente de la phrase.
translation_notes:
  register: Français moderne, digne et lisible. La disposition poétique souligne les deux groupes nominaux parallèles. « Humains » rend le pluriel générique ἀνθρώπων sans ambiguïté de genre ; « peuple » reste au singulier comme λαοῦ.
