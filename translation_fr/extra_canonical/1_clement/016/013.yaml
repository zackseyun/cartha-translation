revisions:
- from: 'C’est pourquoi il aura beaucoup d’hommes en héritage,

    et il partagera les dépouilles des puissants,

    parce que son âme a été livrée à la mort

    et qu’il a été compté parmi ceux qui sont sans loi ;'
  to: 'C’est pourquoi il héritera de beaucoup,


    et il partagera les dépouilles des puissants,


    parce que son âme a été livrée à la mort


    et qu’il a été compté parmi les hommes sans loi ;'
  rationale: La révision retire l’ajout interprétatif « hommes » du premier membre et rétablit le verbe direct « héritera », qui rend κληρονομήσει tout en laissant ouvert ce dont il hérite. Dans le dernier membre, « les hommes sans loi » offre un français moderne lisible et maintient le lien lexical avec « loi » (νόμος), sans préciser la nature de leur faute. Le parallélisme et le point-virgule final sont conservés.
