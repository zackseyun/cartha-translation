source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ’ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: fr
  text: 'C’est pourquoi il héritera de beaucoup,


    et il partagera les dépouilles des puissants,


    parce que son âme a été livrée à la mort


    et qu’il a été compté parmi les hommes sans loi ;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλούς
  choice: il aura beaucoup d’hommes en héritage
  rationale: Conserve l’idée littérale d’hériter de nombreuses personnes, plutôt que de réduire le verbe au sens plus général de « recevoir ».
- source_word: τῶν ἰσχυρῶν
  choice: des puissants
  rationale: 'Rend le substantif pluriel de façon naturelle tout en préservant son sens ouvert : personnes fortes ou puissantes.'
- source_word: μεριεῖ σκῦλα
  choice: il partagera les dépouilles
  rationale: Reproduit l’image du partage du butin pris à l’ennemi ; « dépouilles » convient au registre solennel de la citation.
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: son âme
  rationale: Traduction directe qui préserve la formulation anthropologique grecque, sans la remplacer interprétativement par « sa vie ».
- source_word: τοῖς ἀνόμοις
  choice: ceux qui sont sans loi
  rationale: Conserve le lien explicite avec νόμος, la loi, et évite de préciser indûment s’il s’agit de transgresseurs, de criminels ou d’impies.
theological_decisions:
- issue: Sens de κληρονομήσει πολλούς
  choice: il aura beaucoup d’hommes en héritage
  alternative: il recevra une grande part
  rationale: Le texte transmis par 1 Clément présente « beaucoup » comme objet personnel de « hériter ». La traduction conserve cette lecture propre au grec cité, malgré la formulation différente d’autres témoins d’Ésaïe 53:12.
- issue: Portée de ψυχή
  choice: son âme
  alternative: sa vie
  rationale: « Âme » maintient l’ambiguïté entre la personne, la vie et l’être intérieur, sans résoudre la portée théologique du terme.
translation_notes:
  register: Français international moderne, digne et lisible. La disposition en lignes respecte le parallélisme de la citation. Le point-virgule final maintient l’enchaînement avec la suite du passage.
