id: 1CLEM.16.4
reference: 1 Clement 16:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος τὰς ἁμαρτίας ἡμῶν φέρει καὶ περὶ ἡμῶν ὀδυνᾶται, καὶ ἡμεῖς ἐλογισάμεθα αὐτὸν εἶναι ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/004.yaml
  text: This one bears our sins and suffers on our behalf[a], and we considered him to be in pain and under a blow and in affliction.
translation:
  language: fr
  text: C’est lui qui porte nos péchés et souffre pour nous[a] ; et nous, nous avons estimé qu’il était dans la douleur, sous les coups et dans l’affliction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « éprouve de la douleur à cause de nous ».'
    reason: ὀδυνᾶται et περὶ ἡμῶν permettent d’expliciter davantage la douleur et peuvent présenter celle-ci comme subie à cause de nous plutôt qu’en notre faveur.
lexical_decisions:
- source_word: οὗτος
  choice: C’est lui qui
  rationale: Cette tournure française naturelle conserve la valeur démonstrative et emphatique de « celui-ci » sans produire une formulation raide.
- source_word: φέρει
  choice: porte
  rationale: Le présent grec exprime ici le fait de prendre sur soi ou de supporter les péchés ; « porte » conserve cette image et sa portée théologique sans l’expliciter davantage.
- source_word: ὀδυνᾶται
  choice: souffre
  rationale: Le verbe désigne une souffrance ou une douleur éprouvée ; « souffre » est naturel et maintient l’indétermination entre douleur physique et détresse.
- source_word: περὶ ἡμῶν
  choice: pour nous
  rationale: Dans ce contexte, la préposition exprime que la souffrance est subie en notre faveur ou à cause de nous ; la formulation concise laisse cette nuance ouverte.
- source_word: ἐν πόνῳ
  choice: dans la douleur
  rationale: Dans cette citation d’Ésaïe 53:4, πόνος désigne la douleur ou la souffrance plutôt que le travail pénible.
- source_word: ἐν πληγῇ
  choice: sous les coups
  rationale: πληγή évoque un coup ou le fait d’être frappé. Le pluriel idiomatique français rend naturellement l’image sans suggérer à tort une épidémie.
- source_word: ἐν κακώσει
  choice: dans l’affliction
  rationale: Le terme évoque l’accablement, les mauvais traitements ou la détresse ; « affliction » conserve sa largeur sémantique et le registre solennel.
theological_decisions:
- issue: Portée de la souffrance exprimée par περὶ ἡμῶν
  choice: pour nous
  alternative: à cause de nous / en notre faveur
  rationale: « Pour nous » préserve la possible valeur représentative ou bénéfique sans imposer une théorie précise de l’expiation.
- issue: Rapport du porteur aux péchés
  choice: porte nos péchés
  alternative: se charge de nos péchés
  rationale: La traduction littérale conserve l’image scripturaire et son ambiguïté entre prise en charge, endurance et portée sacrificielle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec et du caractère scripturaire de la citation, tout en évitant le calque raide « celui-ci » et l’expression peu naturelle « sous un coup ».
