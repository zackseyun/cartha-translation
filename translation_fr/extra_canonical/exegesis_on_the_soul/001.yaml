review_pass:
  verdict: revise
  source_fidelity: Le projet suit fidèlement le témoin anglais fourni, y compris l’allégorie sexuelle violente, l’alternance entre contrainte et initiative de l’âme, et les crochets signalant les restaurations ou lacunes. Une révision directe du copte reste indispensable et ne peut être anticipée à partir du seul témoin anglais.
  naturalness: 'Le français est globalement fluide et digne. Quelques formulations réclament toutefois une correction : « sein maternel » ne désigne pas l’utérus ; « je te rendrai compte » est peu idiomatique ; et « chambre où je vivais jeune fille » explicite et rétrécit indûment « maiden’s quarters ».'
  terminology: « âme », « vierge », « androgyne », « brigands », « prostitution », « Père très-haut » et « miséricorde » conviennent au registre et conservent les termes importants sans imposer de lecture confessionnelle. « utérus » est le sens corporel précis de « womb » ; son registre neutre et anatomique est préférable à « sein maternel », qui signifie normalement le sein/la poitrine.
  issues:
  - severity: medium
    issue: « sein maternel » pour « womb »
    rationale: En français moderne, « sein maternel » désigne le sein ou la poitrine de la mère, et non l’organe de gestation. « Utérus » rend le référent sans euphémisation ni déplacement anatomique.
  - severity: low
    issue: « je te [rendrai compte] »
    rationale: La construction française usuelle est « rendre compte à quelqu’un » ou « rendre des comptes à quelqu’un ». « Je te [rendrai des comptes] » conserve le futur et le signal de restitution.
  - severity: low
    issue: « chambre où je vivais jeune fille » pour « maiden’s quarters »
    rationale: La paraphrase introduit « où je vivais » et réduit des « quartiers/appartements » à une seule chambre. « mes appartements de jeune fille » demeure plus proche tout en restant naturel.
  revised_text: '[] Il y a longtemps, des sages ont donné à l’âme un nom féminin. En fait, elle est elle aussi de nature féminine. Elle a même un utérus.



    Aussi longtemps qu’elle demeurait seule avec le Père, elle était vierge et, par sa forme, androgyne. Mais lorsqu’elle tomba dans un corps et entra dans cette vie, elle tomba alors aux mains de nombreux brigands. Ces êtres cruels se la firent passer les uns aux autres et la [violèrent]. Certains abusèrent d’elle par la force, tandis que d’autres la séduisirent par un cadeau. Bref, ils la souillèrent, et elle [perdit] sa [] virginité.



    Dans son corps, elle se prostitua et se donna à tous sans exception, considérant comme son mari chacun de ceux qu’elle était prête à étreindre. Après s’être livrée à des amants adultères, cruels et infidèles, pour qu’ils abusent d’elle, elle gémit profondément et se repentit.



    Pourtant, même lorsqu’elle détournait son visage de ces amants adultères, elle courait vers d’autres. Ceux-ci la forçaient à vivre avec eux et à les servir dans leur lit, comme s’ils étaient ses maîtres. Couverte de honte, elle n’osait plus les quitter. De leur côté, ils la trompèrent longtemps en se faisant passer pour des maris fidèles et véritables, comme s’ils avaient pour elle le plus grand respect. Après tout cela, ils l’abandonnèrent et s’en allèrent.



    Elle devint alors une veuve sans secours, pauvre et abandonnée. Au temps de sa détresse, il ne lui restait pas même une bouchée de nourriture. Tout ce qu’elle avait jamais retiré d’eux, c’était la souillure provenant de rapports sexuels. Quant aux enfants qu’elle avait eus de ces amants adultères, ils étaient muets, aveugles, malades et faibles d’esprit.



    Mais lorsque le Père très-haut lui rendit visite, posa son regard sur elle et la vit gémir dans ses souffrances et sa honte, se repentant de la prostitution qu’elle avait pratiquée, elle commença à invoquer son nom afin qu’il lui vienne en aide. [Elle gémit] de tout son cœur et dit : « Sauve-moi, mon Père. Regarde-moi, car je te [rendrai des comptes], car j’ai abandonné ma maison et me suis [] enfuie de mes appartements de jeune fille. Ramène-moi de nouveau auprès de toi. »



    Lorsqu’il la verra dans cet état, il la jugera digne de lui accorder sa miséricorde, car nombreuses sont les souffrances qui l’ont frappée parce qu’elle a abandonné sa maison.[a]'
