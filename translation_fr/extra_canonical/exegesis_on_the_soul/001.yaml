translation:
  language: fr
  text: '[] Il y a longtemps, des sages ont donné à l’âme un nom féminin. De fait, elle est aussi féminine par nature. Elle a même un sein maternel.


    Aussi longtemps qu’elle demeurait seule avec le Père, elle était vierge et, par sa forme, androgyne. Mais lorsqu’elle tomba dans un corps et entra dans cette vie, elle tomba alors aux mains de nombreux brigands. Ces êtres cruels se la passèrent les uns aux autres et la [violèrent]. Certains abusèrent d’elle par la force, tandis que d’autres la séduisirent par un cadeau. Bref, ils la souillèrent, et elle [perdit] sa [] virginité.


    Dans son corps, elle se prostitua et se donna à tous sans exception, considérant chacun de ceux qu’elle était prête à étreindre comme son mari. Après s’être livrée à des amants adultères, cruels et infidèles, pour qu’ils abusent d’elle, elle gémit profondément et se repentit.


    Pourtant, même lorsqu’elle détournait son visage de ces amants adultères, elle courait vers d’autres. Ceux-ci la forçaient à vivre avec eux et à les servir dans leur lit, comme s’ils étaient ses maîtres. Couverte de honte, elle n’osait plus les quitter. De leur côté, ils la trompèrent longtemps en se faisant passer pour des maris fidèles et véritables, comme s’ils avaient pour elle le plus grand respect. Après tout cela, ils l’abandonnèrent et s’en allèrent.


    Elle devint alors une veuve sans secours, pauvre et abandonnée. Au temps de sa détresse, il ne lui restait pas même une bouchée de nourriture. Tout ce qu’elle avait jamais reçu d’eux, c’était la souillure laissée par leurs rapports sexuels. Quant aux enfants qu’elle avait eus de ces amants adultères, ils étaient muets, aveugles, malades et faibles d’esprit.


    Mais lorsque le Père très-haut lui rendit visite, posa son regard sur elle et la vit gémir dans ses souffrances et sa honte, se repentant de la prostitution qu’elle avait pratiquée, elle commença à invoquer son nom afin qu’il lui vienne en aide. [Elle gémit] de tout son cœur et dit : « Sauve-moi, mon Père. Regarde-moi, car je te [rendrai compte], moi qui ai abandonné ma maison et qui me suis [] enfuie de la chambre où je vivais jeune fille. Ramène-moi de nouveau auprès de toi. »


    Lorsqu’il la verra dans cet état, il la jugera digne de recevoir sa miséricorde, car nombreuses sont les souffrances qui l’ont frappée pour avoir abandonné sa maison.[a]'
