lexical_decisions:
- source_word: soul
  choice: âme
  rationale: Équivalent français traditionnel, naturel et théologiquement non restrictif; le genre grammatical féminin permet de conserver la personnification du témoin.
- source_word: womb
  choice: sein maternel
  rationale: Exprime l’organe ou la capacité maternelle sans employer un terme clinique; le sens exact devra être contrôlé sur le copte.
- source_word: androgynous
  choice: androgyne
  rationale: Conserve directement la tension anthropologique du témoin sans l’expliquer ni la normaliser.
- source_word: robbers
  choice: brigands
  rationale: Rend l’idée de prédateurs violents dans un registre narratif digne et courant.
- source_word: violated
  choice: violèrent
  rationale: Préserve la violence sexuelle explicite de la restauration éditoriale signalée par les crochets.
- source_word: practiced prostitution
  choice: se prostitua
  rationale: Formulation directe et naturelle qui conserve l’imagerie morale et sexuelle du passage.
- source_word: adulterers
  choice: amants adultères
  rationale: Le simple « adultères » comme substantif serait peu naturel; ce choix maintient l’infidélité sexuelle et la relation figurée.
- source_word: exalted Father
  choice: Père très-haut
  rationale: Rend l’élévation et la transcendance attribuées au Père sans ajouter un titre confessionnel.
- source_word: maiden’s quarters
  choice: chambre où je vivais jeune fille
  rationale: Évite l’ambiguïté moderne de « chambre de jeune fille » tout en préservant l’idée d’un espace virginal antérieur.
theological_decisions:
- issue: Genre et personnification de l’âme
  choice: Maintenir systématiquement le féminin et les images corporelles féminines
  alternative: Neutraliser l’imagerie en parlant abstraitement de l’âme
  rationale: Le féminin, le sein maternel, la virginité et la prostitution structurent l’allégorie et ne doivent pas être atténués.
- issue: État primordial de l’âme
  choice: « vierge » et « androgyne » côte à côte
  alternative: Harmoniser ces descriptions ou expliquer leur compatibilité
  rationale: Le témoin juxtapose ces notions; la traduction préserve cette tension sans imposer une interprétation.
- issue: Responsabilité et victimisation de l’âme
  choice: Conserver à la fois les violences subies et ses actes volontaires
  alternative: Présenter l’âme uniquement comme victime ou uniquement comme coupable
  rationale: Le texte attribue alternativement contrainte, séduction, prostitution et repentance; cette ambiguïté morale est constitutive du passage.
- issue: Visite et miséricorde du Père
  choice: « lui rendit visite » puis futur dans la conclusion
  alternative: Uniformiser tous les verbes au passé ou au futur
  rationale: La variation temporelle du témoin a été conservée autant que le permet un français intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. L’imagerie sexuelle et la violence du passage sont rendues sans euphémisme excessif, mais sans vulgarité. Les changements de temps et les zones entre crochets suivent le témoin fourni; la formulation devra être réévaluée lors de la collation directe du copte.
