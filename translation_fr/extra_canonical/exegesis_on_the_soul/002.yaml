    reason: Identifier le mot suppléé dans un passage lacunaire.
  - marker: e
    text: « Cette sorte de prostitution » est une restitution explicative du passage endommagé.
    reason: Distinguer le texte préservé de la reconstruction éditoriale.
  - marker: f
    text: La lacune après « prostitution » ne permet pas de savoir si un mot ou une expression supplémentaire figurait dans le texte.
    reason: Rendre visible une lacune qui pourrait influer sur le sens.
lexical_decisions:
- source_word: prostitution / harlotry
  choice: prostitution / se prostituer
  rationale: Conserve l’image sexuelle centrale et son application métaphorique à l’âme, sans l’atténuer par « infidélité ».
- source_word: shepherds
  choice: bergers
  rationale: Maintient le terme transmis par le témoin au lieu de l’harmoniser avec d’autres formes bibliques possibles.
- source_word: perceptible realm
  choice: domaine perceptible
  rationale: Rend le vocabulaire philosophique de façon intelligible tout en évitant d’ajouter une interprétation doctrinale.
- source_word: men great of flesh
  choice: des hommes à la chair imposante
  rationale: Préserve l’expression corporelle étrange et son ambiguïté plutôt que de la réduire explicitement à l’anatomie sexuelle.
- source_word: senseless external things
  choice: choses extérieures dépourvues de raison
  rationale: Préserve la valeur littérale et philosophique possible de « senseless », plutôt que le français ambigu « choses insensées ».
- source_word: having sex with
  choice: s’unissant sexuellement à
  rationale: Expression directe et digne, fidèle à la force du passage sans registre vulgaire.
- source_word: world rulers
  choice: dominateurs du monde
  rationale: Conserve la portée cosmique possible du composé sans l’identifier à une catégorie théologique particulière.
theological_decisions:
- issue: Nature de la prostitution de l’âme
  choice: Maintien de la métaphore sexuelle explicite
  alternative: Traduire par « infidélité spirituelle »
  rationale: Le texte distingue lui-même prostitution corporelle et prostitution de l’âme ; remplacer la métaphore par son interprétation effacerait cette tension.
- issue: Interprétation des « fils de l’Égypte »
  choice: Reproduire l’explication du traité comme une question interprétative
  alternative: Présenter l’équivalence comme une définition doctrinale incontestable
  rationale: La formulation interrogative du texte est préservée et aucune cosmologie confessionnelle supplémentaire n’est importée.
- issue: Sens de 1 Corinthiens 5.9-10
  choice: Conserver l’affirmation de l’auteur selon laquelle Paul parle ici au sens spirituel
  alternative: Corriger cette lecture selon une exégèse moderne de Paul
  rationale: Il s’agit de traduire fidèlement l’argument du traité, non de l’harmoniser avec une interprétation extérieure.
- issue: Féminisation de l’âme
  choice: Employer les accords et pronoms féminins
  alternative: Neutraliser les références personnelles à l’âme
  rationale: Le genre français de « âme » permet de conserver la personnification féminine qui structure tout le passage.
translation_notes:
  register: Français international moderne, digne et direct. Les citations bibliques suivent le libellé propre au témoin copte transmis plutôt qu’une version française canonique harmonisée. Les crochets du corps du texte signalent les restitutions, tandis que l’ellipse entre crochets signale une lacune non comblée. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe du copte reste nécessaire.
