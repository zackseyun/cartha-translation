  text: 'Now, concerning the prostitution of the soul, the Holy Spirit prophesies in many places, saying through the prophet Jeremiah:


    “If a husband divorces his wife, and she goes and takes another man, can she return to him again? Has that woman not completely defiled herself? ‘And you prostituted yourself to many shepherds, and you returned to me,’ said the Lord. ‘Look carefully and see where you prostituted yourself. Were you not sitting in the streets, polluting the land with your prostitution and wickedness? And you took many shepherds as a stumbling block for yourself. You were shameless with everyone. You did not call on me as a relative, or as a father, or as the guardian of your virginity.’” (Jeremiah 3:1–4)


    Again, it is written in the prophet Hosea:


    “Come, bring charges against your mother, for she will not be a wife to me, and I will not be a husband to her. I will remove her prostitution from before me, and I will remove her adultery from between her breasts. I will strip her naked as on the day she was born, and I will make her a wilderness, like a land without water, and I will make her [yearn in childlessness]. I will not have compassion on her children, for they are children of prostitution, because their mother prostituted herself and [acted shamefully toward her children]. [] For she said, ‘I will prostitute myself to my lovers. They gave me my bread and my water, my clothing and my garments, my wine and my oil, and everything I needed.’ Therefore, look: I will close them in so that she cannot run after her lovers. When she seeks them but does not find them, she will say, ‘I will return to my former husband; I was better off then than I am now.’” (Hosea 2:2–7)


    Again, he says in Ezekiel:


    “‘After much wickedness,’ said the Lord, ‘you built a brothel and made a place for your beauty in the streets. You built brothels on every street, squandered your beauty, spread your legs in every alley, and multiplied your acts of prostitution. You prostituted yourself to the sons of Egypt, your neighbors, men great in flesh.’” (Ezekiel 16:23–26)


    What, then, does “the sons of Egypt, men great in flesh” mean, except the kingdom of the flesh, the perceptible realm, and earthly affairs? These defile the soul here, as she obtains from them bread, as well as wine, oil, garments, and other senseless external things surrounding the body—things she believes are necessary for her.


    Concerning this prostitution, however, the Savior’s apostles insisted, “Guard yourselves from it; purify yourselves from it.” This applies not only to bodily prostitution, but especially to the prostitution of the soul. For this reason, the apostles write [to the churches] of God, so that [this kind (of prostitution)] might not happen among us.


    Nevertheless, the most difficult [challenge] concerns the prostitution [] of the soul. Bodily prostitution also originates from it. Therefore Paul, writing to the Corinthians, said, “I wrote to you in the letter, ‘Do not associate with prostitutes’—not at all referring to the prostitutes of this world, or the greedy, or robbers, or idolaters, because then you would need to leave the world.” (1 Corinthians 5:9–10) In this case he is speaking spiritually: “For our struggle is not against flesh and blood,” as he said, “but against the world rulers of this darkness and the spirits of wickedness.” (Ephesians 6:12)


    For as long as the soul continues running everywhere, having sex with everyone she meets and defiling herself, she suffers what she deserves.'
translation:
  language: fr
  text: 'Quant à la prostitution de l’âme, le Saint-Esprit prophétise à ce sujet en de nombreux endroits, disant par le prophète Jérémie :


    « Si un mari renvoie sa femme, et qu’elle s’en aille prendre un autre homme, peut-elle revenir encore auprès de lui ? Cette femme ne s’est-elle pas entièrement souillée ? “Et toi, tu t’es prostituée à de nombreux bergers, puis tu es revenue à moi”, dit le Seigneur. “Regarde bien et vois où tu t’es prostituée. N’étais-tu pas assise dans les rues, souillant le pays par tes prostitutions et ta méchanceté ? Tu as pris de nombreux bergers pour en faire une occasion de chute pour toi. Avec chacun, tu as été sans honte. Tu ne m’as pas invoqué comme un proche, comme un père ou comme le gardien de ta virginité.” » (Jérémie 3.1-4)


    Il est encore écrit dans le prophète Osée :


    « Venez, portez plainte contre votre mère, car elle ne sera pas ma femme et je ne serai pas son mari. J’ôterai de devant moi sa prostitution, et son adultère d’entre ses seins. Je la déshabillerai jusqu’à la mettre nue comme au jour de sa naissance ; je ferai d’elle un désert, comme une terre sans eau, et je la ferai [languir sans enfants].[a] Je n’aurai pas compassion de ses enfants, car ce sont des enfants de prostitution : leur mère s’est prostituée et [s’est conduite honteusement envers ses enfants].[b] […] Car elle a dit : “Je me prostituerai à mes amants. Ce sont eux qui me donnaient mon pain et mon eau, mon habit et mes vêtements, mon vin et mon huile, et tout ce dont j’avais besoin.” Voici donc : je les enfermerai[c] afin qu’elle ne puisse pas courir après ses amants. Quand elle les cherchera sans les trouver, elle dira : “Je retournerai auprès de mon premier mari, car j’étais mieux alors que maintenant.” » (Osée 2.2-7)


    Il dit encore dans Ézéchiel :


    « Après tant de méchanceté, dit le Seigneur, tu t’es bâti une maison de prostitution et tu as aménagé dans les rues un lieu pour ta beauté. Tu as bâti des maisons de prostitution à chaque rue, tu as gaspillé ta beauté, tu as écarté les jambes dans chaque ruelle et tu as multiplié tes actes de prostitution. Tu t’es prostituée aux fils de l’Égypte, tes voisins, des hommes à la chair imposante. » (Ézéchiel 16.23-26)


    Or, que signifie « les fils de l’Égypte, des hommes à la chair imposante », sinon le royaume de la chair, le domaine perceptible et les affaires terrestres ? Ceux-ci souillent ici l’âme, qui obtient d’eux du pain, mais aussi du vin, de l’huile, des vêtements et d’autres choses extérieures dépourvues de raison qui entourent le corps — des choses qu’elle croit lui être nécessaires.


    Au sujet de cette prostitution, cependant, les apôtres du Sauveur ont insisté : « Gardez-vous-en ; purifiez-vous-en. » Cela concerne non seulement la prostitution du corps, mais surtout celle de l’âme. C’est pourquoi les apôtres écrivent aux [Églises][d] de Dieu, afin que [cette sorte de prostitution][e] ne se produise pas parmi nous.


    Néanmoins, la [difficulté] la plus grande concerne la prostitution […] de l’âme.[f] C’est aussi d’elle que provient la prostitution du corps. C’est pourquoi Paul, écrivant aux Corinthiens, a dit : « Je vous ai écrit dans la lettre : “Ne fréquentez pas les personnes qui se prostituent” — sans parler absolument des personnes de ce monde qui se prostituent, ni des gens avides, des voleurs ou des idolâtres, car alors il vous faudrait sortir du monde. » (1 Corinthiens 5.9-10) Ici, il parle au sens spirituel : « Car notre lutte n’est pas contre la chair et le sang, a-t-il dit, mais contre les dominateurs du monde de ces ténèbres et contre les esprits de la méchanceté. » (Éphésiens 6.12)


    Car aussi longtemps que l’âme continue de courir partout, s’unissant sexuellement à tous ceux qu’elle rencontre et se souillant elle-même, elle subit ce qu’elle mérite.'
