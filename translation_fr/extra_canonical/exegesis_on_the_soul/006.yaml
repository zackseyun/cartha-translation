  yaml_path: translation/extra_canonical/exegesis_on_the_soul/006.yaml
  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: fr
  text: 'C’est pourquoi il est écrit chez le poète :


    « Ulysse était assis sur l’île, souffrant et affligé ;

    il détournait le visage des paroles et des charmes de Calypso,

    désirant ardemment revoir son village et la fumée qui s’en élevait.

    Et s’il n’avait pas [reçu] l’aide du Ciel,

    [il n’aurait pas pu retourner] dans son village. » (Homère, Odyssée 1.48–1.59)


    De nouveau, [Hélène aussi] dit :


    « Mon cœur changea en moi ;

    […] c’est chez moi que je voulais retourner. » (Homère, Odyssée 4.260–261)


    Car elle se lamentait en disant :


    « C’est Aphrodite qui m’a égarée

    et m’a emmenée loin de mon village.

    J’ai abandonné ma propre fille,

    et mon mari, bon, intelligent et beau. » (Homère, Odyssée 4.261–4.264)


    En effet, lorsque l’âme abandonne son époux parfait à cause de l’infidélité d’Aphrodite, qui vient à l’existence ici par l’acte d’engendrer, elle en subira du tort. Mais si elle se lamente et se repent, elle sera ramenée dans sa maison.[a]'
