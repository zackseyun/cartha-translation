  footnotes:
  - marker: a
    text: Traduction provisoire établie d’après le témoin anglais public fourni; la vérification directe du texte copte reste à faire. Les crochets signalent des restitutions ou des lacunes du manuscrit. Les références homériques sont conservées telles qu’elles figurent dans le témoin et peuvent ne pas correspondre exactement aux découpages modernes de l’Odyssée.
    reason: Signaler honnêtement la base indirecte de la traduction, expliquer les signes critiques et préserver les références reçues sans leur attribuer une précision non vérifiée.
lexical_decisions:
- source_word: village
  choice: village
  rationale: Conserve le terme du témoin fourni plutôt que de l’harmoniser avec les formulations homériques françaises usuelles telles que « patrie » ou « demeure ».
- source_word: Heaven
  choice: Ciel
  rationale: La majuscule préserve la possible portée transcendante ou divine du terme sans préciser davantage l’agent de l’aide.
- source_word: moans
  choice: se lamente
  rationale: Expression française naturelle qui garde l’idée d’une douleur exprimée à voix haute.
- source_word: repents
  choice: se repent
  rationale: Rend explicitement le retournement moral ou spirituel, central dans l’interprétation allégorique du passage.
- source_word: perfect husband
  choice: époux parfait
  rationale: « Époux » convient au registre allégorique et conserve directement la qualification absolue « parfait ».
- source_word: disloyalty
  choice: infidélité
  rationale: Dans le contexte conjugal et allégorique, « infidélité » est plus idiomatique que « déloyauté », tout en maintenant la tension sur le rapport exact entre Aphrodite et l’abandon de l’époux.
- source_word: act of begetting
  choice: acte d’engendrer
  rationale: Formulation volontairement proche du témoin, afin de ne pas réduire cette expression difficile à la seule naissance, conception ou sexualité.
- source_word: returned to her house
  choice: ramenée dans sa maison
  rationale: Le passif est conservé, laissant implicite l’agent du retour; « maison » maintient aussi l’écho du retour chez soi.
theological_decisions:
- issue: Identification de l’époux parfait
  choice: Ne pas identifier explicitement l’époux
  alternative: L’identifier au Christ, à Dieu ou à une réalité céleste déterminée
  rationale: L’extrait emploie une allégorie sans fournir ici une identification explicite; la traduction conserve cette ouverture.
- issue: Agent du retour de l’âme
  choice: Conserver le passif « elle sera ramenée »
  alternative: Nommer Dieu ou le Ciel comme agent
  rationale: Le texte laisse l’agent sous-entendu; l’expliciter résoudrait indûment une ambiguïté théologique.
- issue: Rôle d’Aphrodite et de l’engendrement
  choice: Maintenir la formulation difficile sans l’interpréter
  alternative: Paraphraser Aphrodite comme désir sexuel, monde matériel ou génération corporelle
  rationale: Le rapport exact entre Aphrodite, son infidélité et l’acte d’engendrer reste théologiquement tendu et ne doit pas être normalisé dans le corps du texte.
- issue: Aide du Ciel
  choice: Employer « Ciel » sans nommer une divinité
  alternative: Traduire par « Dieu » ou « les dieux »
  rationale: Cette solution respecte l’indétermination du témoin anglais en attendant l’examen direct du copte.
translation_notes:
  register: Français international moderne, digne et lisible. Les citations poétiques gardent une disposition en vers libres sans archaïsmes ajoutés. Le féminin grammatical de « l’âme » permet de conserver naturellement l’allégorie conjugale. La traduction demeure volontairement proche du témoin anglais public puisque la révision sur le copte est annoncée comme encore en attente.
