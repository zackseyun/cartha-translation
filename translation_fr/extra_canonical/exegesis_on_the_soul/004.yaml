translation:
  language: fr
  text: '**Exégèse de l’âme — Le mariage de l’âme[a]**


    En effet, ce mariage n’est pas comme le mariage charnel. Ceux qui ont des rapports sexuels l’un avec l’autre se contentent de cette sorte d’union. Puis, comme s’il s’agissait d’un poids, ils laissent derrière eux les tracas du désir corporel, [détournant leur visage] l’un de l’autre. Mais ce mariage-ci [est différent]. Lorsqu’ils se sont unis [l’un à l’autre], ils deviennent une seule vie.


    [] C’est pourquoi le prophète a dit au sujet du premier homme et de la première femme : « Ils deviendront une seule chair. » (Genèse 2.24)


    Car, au commencement, ils étaient unis l’un à l’autre lorsqu’ils demeuraient auprès du Père, avant que la femme n’égare l’homme, qui est son frère. Ce mariage les a réunis, et l’âme s’est unie à son véritable amour, son maître originel, comme il est écrit : « Car le maître de la femme est son mari. » (Genèse 3.16 ; Éphésiens 5.23)


    Peu à peu, elle le reconnut. Elle se réjouit de nouveau et pleura en sa présence, se rappelant la honte qu’elle avait autrefois connue dans son veuvage. Elle se fit encore plus belle afin qu’il prenne plaisir à demeurer avec elle.


    Et le prophète a dit dans les Psaumes :


    « Écoute, ma fille, regarde et tends l’oreille ;

    oublie ton peuple et la maison de ton père.

    Alors le roi désirera ta beauté,

    car il est ton seigneur. » (Psaume 45.10-11)


    Il lui ordonne en effet de détourner son regard de son peuple et de la foule de ses amants adultères, parmi lesquels elle habitait autrefois, afin de se consacrer à son roi seul, son véritable Seigneur. Elle doit oublier la maison de son père terrestre, où sa situation était effroyable, et se souvenir plutôt de son Père qui est dans les cieux.


    C’est également dans ce sens qu’il fut dit à Abraham : « Quitte ton pays, ta parenté et la maison de ton père. » (Genèse 12.1)


    Ainsi, après que l’âme se fut [de nouveau parée] de sa splendeur, [elle désira] adorer son bien-aimé, et [lui aussi] l’aima. Lorsqu’elle s’unit à lui, elle reçut [] de lui la semence de l’Esprit qui donne la vie. Par elle, l’âme met au monde des enfants droits et les élève, car telle est la grande et parfaite merveille de la naissance. Ainsi, ce mariage s’accomplit selon la volonté du Père.


    Il convient que l’âme se régénère et redevienne ce qu’elle était auparavant. Alors, l’âme se met en mouvement de son plein gré et reçoit du Père la nature divine pour son renouvellement, afin qu’elle soit rétablie au lieu où elle se trouvait au commencement :


    Voilà la résurrection d’entre les morts.

    Voilà la délivrance de l’esclavage.

    Voilà le voyage qui monte vers le ciel.

    Voilà le chemin qui monte vers le Père.


    C’est pourquoi le prophète a dit :


    « Loue le Seigneur, ô mon âme,

    et que tout ce qui est en moi loue son saint nom.

    Mon âme, loue Dieu,

    lui qui pardonne toutes tes fautes,

    qui guérit toutes tes maladies,

    qui rachète ta vie à la mort,

    qui te couronne de miséricorde,

    qui comble ton désir de bonnes choses.

    Ta jeunesse sera renouvelée comme celle de l’aigle. » (Psaume 103.1-5)


    Après avoir retrouvé sa jeunesse, elle montera, louant le Père et son frère qui l’a sauvée. C’est ainsi que l’âme est sauvée en naissant de nouveau. Cela ne vient ni de la répétition de formules, ni d’un savoir érudit, ni de ce qu’on apprend dans les livres. Cela vient plutôt de la grâce de l’[Esprit] ; c’est le don du [Dieu] compatissant. Telle est la voie de cette réalité céleste.


    C’est pourquoi le Sauveur proclame : [] « Personne ne peut venir à moi si mon Père ne l’attire et ne l’amène à moi ; et moi, je le ressusciterai au dernier jour. » (Jean 6.44)


    [a] Traduction provisoire établie à partir du témoin anglais fourni ; la vérification directe du texte copte du Codex II de Nag Hammadi reste à effectuer. Les crochets à l’intérieur du texte signalent les restitutions ou les lacunes transmises par ce témoin.'
