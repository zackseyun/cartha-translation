lexical_decisions:
- source_word: marriage
  choice: mariage
  rationale: Conserve la métaphore nuptiale structurante et son lien explicite avec Genèse 2.24.
- source_word: carnal marriage
  choice: mariage charnel
  rationale: Maintient l’opposition théologique et anthropologique avec l’union spirituelle sans l’expliciter davantage.
- source_word: sex / bodily lust
  choice: rapports sexuels / désir corporel
  rationale: Emploie un français actuel et direct tout en distinguant l’acte sexuel du désir lié au corps.
- source_word: one life
  choice: une seule vie
  rationale: Préserve la formulation propre au témoin au lieu de l’harmoniser avec la citation « une seule chair ».
- source_word: original master
  choice: maître originel
  rationale: Rend le rapport d’autorité et l’antériorité exprimés par le témoin, malgré l’étrangeté volontaire de l’expression.
- source_word: upright children
  choice: enfants droits
  rationale: Conserve la qualité morale sans imposer le vocabulaire confessionnel de « justes ».
- source_word: regenerates herself
  choice: se régénère
  rationale: Respecte la forme réfléchie du témoin et son affirmation de la participation de l’âme.
- source_word: divine nature
  choice: nature divine
  rationale: Maintient le langage ontologique du passage sans le réduire à une simple qualité morale.
- source_word: formulas
  choice: formules
  rationale: Préserve l’indétermination du témoin quant au type précis de paroles ou de pratiques visé.
theological_decisions:
- issue: Rapport entre l’âme, la femme et l’homme-frère
  choice: Conserver les identifications et les glissements métaphoriques du passage
  alternative: Identifier explicitement l’homme-frère au Sauveur ou à une figure doctrinale précise
  rationale: Le témoin associe ces figures sans fournir ici une équivalence entièrement explicite ; la traduction ne doit pas résoudre cette tension.
- issue: Action volontaire de l’âme et don du Père
  choice: Maintenir côte à côte le plein gré de l’âme et la réception de la nature divine venant du Père
  alternative: Subordonner explicitement l’un des deux aspects à l’autre
  rationale: Le passage affirme simultanément initiative humaine et don divin, puis cite Jean 6.44 ; cette tension doit demeurer visible.
- issue: Sens de la nouvelle naissance
  choice: Conserver le langage de régénération, de résurrection, de délivrance et d’ascension comme formulations parallèles
  alternative: Les réduire à une seule catégorie sotériologique
  rationale: Le texte présente plusieurs images coordonnées sans les fondre dans un système unique.
- issue: « maître de la femme »
  choice: Traduire littéralement la formulation composite et conserver les deux références bibliques
  alternative: Harmoniser la citation soit avec Genèse 3.16, soit avec Éphésiens 5.23
  rationale: Le témoin associe les deux passages ; l’harmonisation effacerait une caractéristique de sa lecture scripturaire.
- issue: Esprit et Dieu dans les restitutions
  choice: Conserver [Esprit] et [Dieu] entre crochets
  alternative: Imprimer les termes sans signaler leur caractère restitué
  rationale: Les crochets du témoin indiquent une incertitude textuelle qui ne doit pas être masquée.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe a été légèrement assouplie lorsque le témoin anglais était lourd, mais les répétitions, les images nuptiales, les ambiguïtés de référents et les tensions théologiques ont été conservées. Les citations bibliques sont traduites selon leur forme dans le témoin fourni et non harmonisées avec une version française particulière. Les crochets simples et les crochets vides sont maintenus comme signaux textuels ; l’examen direct du copte reste en attente.
