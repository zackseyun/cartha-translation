review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni et conserve les crochets, y compris les crochets vides, ainsi que les associations scripturaires non harmonisées. Deux détails demandaient correction : « leurs visages » rend le pluriel de « their faces », et « comme veuve » exprime plus directement la honte antérieure de la veuve.'
  naturalness: Le français est globalement moderne, soutenu et lisible. Les ajustements proposés rendent certains enchaînements plus naturels sans atténuer les images ou les ambiguïtés du témoin.
  terminology: Les termes structurants — mariage charnel, âme, maître originel, semence de l’Esprit, nature divine, résurrection, rédemption/délivrance — sont préservés. « Adultères » est maintenu, conformément à l’accusation imagée du témoin, sans identifier les référents.
  issues:
  - severity: low
    issue: « détournant leur visage » emploie le singulier.
    rationale: 'Le témoin porte « turning away their faces » ; le français doit conserver le pluriel : « détournant leurs visages ».'
  - severity: low
    issue: « la honte qu’elle avait autrefois connue dans son veuvage » affaiblit légèrement la qualification « as a widow ».
    rationale: « La honte qu’elle avait autrefois connue comme veuve » rend plus directement le statut métaphorique de la femme-âme, sans ajouter d’interprétation.
  - severity: low
    issue: « C’est également dans ce sens » interprète légèrement le connecteur « Accordingly ».
    rationale: « C’est pourquoi » restitue le lien argumentatif sans préciser qu’il s’agit d’un “sens” interprétatif.
