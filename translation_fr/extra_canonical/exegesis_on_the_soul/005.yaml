  footnotes:
  - marker: a
    text: 'Littéralement selon le témoin : « haïr son âme ». Le mot « âme » peut aussi englober la vie ou la personne elle-même ; la formulation forte est conservée.'
    reason: Préserver l’ambiguïté anthropologique et éviter une atténuation interprétative.
  - marker: b
    text: Ici, « repentance » désigne un retournement profond manifesté par l’aveu, la douleur et le retour à Dieu.
    reason: Éclairer un terme central dont le sens moderne peut être réduit au simple remords.
  - marker: c
    text: Les crochets et les points de suspension signalent des portions endommagées ou restituées dans le témoin utilisé. La citation est aussi attestée en 1 Clément 8.3 et combine des formulations scripturaires.
    reason: Signaler honnêtement l’état textuel et la nature composite de la citation.
  - marker: d
    text: Cette citation s’écarte sensiblement des formes bibliques courantes d’Ésaïe 30.19-20. Elle est traduite telle qu’elle apparaît dans le témoin, sans harmonisation.
    reason: Préserver la forme citationnelle propre à l’ouvrage malgré ses difficultés et changements de personne.
lexical_decisions:
- source_word: soul
  choice: âme
  rationale: Conserve le terme anthropologique récurrent et son rôle littéraire dans l’ouvrage, sans le réduire à « vie » ou à « personne ».
- source_word: repentance
  choice: repentance
  rationale: Rend la démarche de retournement accompagnée d’aveu, de douleur et de retour à Dieu ; le mot est plus précis ici que le seul « regret ».
- source_word: hollow zealotry
  choice: zèle creux
  rationale: Préserve l’association d’une ferveur intense avec son caractère vide ou sans substance, sans ajouter une qualification confessionnelle absente du témoin.
- source_word: duplicity
  choice: duplicité
  rationale: Maintient l’opposition entre la prière de tout cœur et un cœur partagé ou trompeur.
- source_word: inward parts
  choice: être intérieur
  rationale: Formulation française naturelle qui conserve l’idée d’un examen des profondeurs de la personne, en parallèle avec le cœur.
- source_word: place of lies
  choice: lieu du mensonge
  rationale: Conserve l’image spatiale énigmatique et évite de l’identifier arbitrairement à un monde, un corps ou un système précis.
theological_decisions:
- issue: « haïr son âme » et « nous haïr nous-mêmes »
  choice: Conserver le langage fort de la haine de soi ou de son âme
  alternative: Atténuer en « renoncer à soi-même » ou « préférer moins sa vie »
  rationale: Le passage applique explicitement cette parole à la repentance et à l’état présent de la personne. Une atténuation résoudrait la tension théologique et rhétorique du texte.
- issue: Dignité du salut
  choice: « digne du salut » / « mérite le salut » selon les deux occurrences
  alternative: « apte à recevoir le salut »
  rationale: Le témoin exprime explicitement une notion de dignité ou de mérite. La traduction la conserve sans élaborer une doctrine du mérite.
- issue: Fonction de l’Esprit
  choice: « par l’Esprit, il a dit au prophète »
  alternative: « l’Esprit a dit par le prophète »
  rationale: Respecte l’enchaînement syntaxique du témoin, tout en laissant ouverte l’identification exacte du sujet divin qui parle.
- issue: Compassion dans les béatitudes
  choice: « recevront compassion »
  alternative: « seront consolés »
  rationale: Suit la forme citée propre à cet ouvrage plutôt que d’harmoniser silencieusement avec la formulation canonique habituelle de Matthieu 5.4.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement segmentée pour la lisibilité, tout en conservant les répétitions, les images et les tensions du témoin. Les citations ne sont pas harmonisées avec une version biblique française standard. Le travail reste provisoire puisque la révision directe du copte du Codex II,6 est signalée comme en attente.
