  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: fr
  text: 'Il convient donc de prier le Père et de l’invoquer de toute notre âme, en soupirant, non pas extérieurement, des lèvres, mais par l’esprit intérieur qui vient des profondeurs. Repentons-nous de la vie que nous menions autrefois, confessons nos péchés, reconnaissons le mensonge vide dans lequel nous avons vécu et notre zèle creux ; lamentons-nous à cause des ténèbres et de la vague qui nous a engloutis, et pleurons sur nous-mêmes afin qu’il ait compassion de nous, en nous haïssant nous-mêmes à cause de ce que nous sommes maintenant.


    Le Sauveur a encore dit :


    « Heureux ceux qui sont dans le deuil,

    car ils recevront compassion.


    Heureux ceux qui ont faim,

    car ils seront rassasiés. » (Matthieu 5.4,6 ; Luc 6.21)


    Il a dit aussi : « Si quelqu’un ne hait pas son âme, il ne peut pas me suivre. »[a] (Luc 14.26)


    Car la repentance est le commencement du salut. Ainsi, « avant que le Christ paraisse, Jean est venu proclamer le baptême de repentance ».[b] (Actes 13.24)


    La repentance se produit dans la douleur et la tristesse. Cependant, le Père est bon et aime l’humanité. Il écoute l’âme qui l’invoque et lui envoie la lumière du salut. C’est pourquoi, par l’Esprit, il a dit au prophète :


    Dis aux enfants de mon peuple :


    « [Si] vos péchés montent [de la terre jusqu’au] ciel,


    s’ils sont [rouges] comme l’écarlate


    et plus noirs que la toile de sac,


    [et si] […] vous revenez à moi de toute votre âme


    et me dites : “Mon Père !”,


    je vous écouterai comme un peuple saint. »[c] (1 Clément 8.3)


    Un autre passage dit encore : « Ainsi parle le Seigneur, le Saint d’Israël : “Si vous revenez et pleurez, alors vous serez sauvés, et vous saurez où vous étiez lorsque vous mettiez votre espérance dans ce qui est vide.” » (Ésaïe 30.15)


    Et dans un autre passage, il a dit :


    Jérusalem a beaucoup pleuré en disant : « Aie compassion de moi. » Il te fera grâce au bruit de tes pleurs. Quand il vit, il te répondit. Le Seigneur vous donnera le pain de l’adversité et l’eau de l’affliction. Désormais, ceux qui vous mentent ne s’approcheront plus de vous. Vos yeux verront ceux qui vous mentent.[d] (Ésaïe 30.19-20)


    Il convient donc de prier Dieu nuit et jour, en étendant les mains vers lui comme ceux qui naviguent en pleine mer. Ceux-ci prient Dieu de tout leur cœur, sans duplicité, car ceux qui prient avec duplicité ne mentent qu’à eux-mêmes. En effet, afin de savoir qui est digne du salut, Dieu examine l’être intérieur et sonde les profondeurs du cœur. Car personne ne mérite le salut tant qu’il aime encore le lieu du mensonge.'
