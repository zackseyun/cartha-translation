review_pass:
  verdict: revise
  source_fidelity: La traduction suit globalement avec fidélité le témoin anglais fourni, y compris ses citations composites, ses changements de personne et son langage volontairement abrupt sur la haine de l’âme/de soi. Une correction est nécessaire pour rendre correctement et naturellement « they will be pitied » et pour reproduire plus exactement le signal de lacune du témoin dans la citation attribuée à 1 Clément 8.3.
  naturalness: Le français est globalement moderne et soutenu. « Ils recevront compassion » n’est pas idiomatique en français international ; « ils seront pris en pitié » restitue le sens sans harmoniser la citation avec « ils seront consolés ». Quelques enchaînements ont été légèrement lissés sans modification de sens.
  terminology: « âme », « repentance », « salut », « duplicité », « être intérieur » et « lieu du mensonge » sont des choix adéquats. Le langage fort de « haïr son âme » est maintenu, avec sa note, sans atténuation doctrinale.
  issues:
  - severity: medium
    issue: « car ils recevront compassion »
    rationale: Cette expression est grammaticalement compréhensible mais non naturelle et ne rend pas précisément le passif « they will be pitied ». « Car ils seront pris en pitié » est idiomatique et fidèle au témoin.
  - severity: low
    issue: Rendu du marqueur textuel « [] » dans la citation de 1 Clément 8.3
    rationale: Le témoin présente un crochet vide après « [and if] ». Le remplacer par des points de suspension entre crochets interprète le format. Le crochet vide est conservé afin de signaler exactement la lacune ou l’absence indiquée.
  - severity: low
    issue: Référent de « Ceux-ci » dans la comparaison des navigateurs
    rationale: « Ces derniers » désigne plus clairement les personnes qui naviguent, lesquelles prient dans l’image du témoin, sans changer le contenu.
