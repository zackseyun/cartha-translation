translation:
  language: fr
  text: 'Israël n’aurait certainement pas été visité dès le commencement pour être délivré du pays d’Égypte, de la maison de servitude, s’il n’avait pas gémi vers Dieu et poussé des plaintes à cause de la tyrannie de son esclavage.


    Il est encore écrit dans les Psaumes :


    « Je suis accablé de fatigue à force de gémir.

    Chaque nuit, de mes larmes, j’inonderai mon lit et ma couche.

    J’ai vieilli au milieu de tous mes ennemis.

    Éloignez-vous de moi, vous tous qui faites le mal,

    car voici, le Seigneur a entendu mes pleurs,

    et le Seigneur a accueilli ma prière. » (Psaume 6.6-9)[a]


    Si nous nous repentons, Dieu nous écoutera certainement, lui qui est patient et riche en miséricorde. À lui soit la gloire pour les siècles des siècles ! Amen.


    L’Exégèse de l’âme'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La numérotation et certaines formulations de cette citation du Psaume 6 peuvent différer selon la tradition textuelle et la version biblique consultées.
    reason: Le passage cité présente des écarts de formulation et de découpage par rapport à plusieurs versions modernes du psaume ; la note signale cette variation sans harmoniser le texte.
lexical_decisions:
- source_word: visited
  choice: visité
  rationale: Conserve le langage biblique de l’intervention favorable de Dieu sans réduire le terme à une simple délivrance, déjà exprimée ensuite.
- source_word: house of bondage
  choice: maison de servitude
  rationale: Reprend une formule biblique française familière et maintient l’image de la « maison » associée à l’asservissement.
- source_word: groaned ... moaned
  choice: gémi ... poussé des plaintes
  rationale: Maintient les deux expressions de détresse sans les fondre en un seul verbe.
- source_word: tyranny of its slavery
  choice: tyrannie de son esclavage
  rationale: Préserve la force politique et oppressive de la formulation du témoin.
- source_word: repent
  choice: nous nous repentons
  rationale: Rend directement le mouvement de retournement moral et spirituel sans lui imposer une formulation confessionnelle plus précise.
- source_word: richly merciful
  choice: riche en miséricorde
  rationale: Expression française naturelle, digne et bibliquement évocatrice, qui conserve l’idée d’une miséricorde abondante.
theological_decisions:
- issue: Sens de la visite divine accordée à Israël
  choice: « visité »
  alternative: « secouru » ou « pris soin d’Israël »
  rationale: Le terme « visité » laisse subsister la portée théologique du motif biblique de la visitation divine, tandis que la délivrance est explicitée dans la proposition suivante.
- issue: Rapport entre repentance et écoute divine
  choice: Conserver la condition « Si nous nous repentons » et l’assurance « certainement »
  alternative: Atténuer en « lorsque nous revenons à Dieu, il peut nous écouter »
  rationale: Le texte affirme nettement ce rapport ; la traduction ne doit ni affaiblir cette assurance ni développer une doctrine du salut absente du passage.
- issue: Description de Dieu
  choice: « patient et riche en miséricorde »
  alternative: « longanime et très compatissant »
  rationale: La formulation retenue garde les deux attributs tout en restant accessible en français moderne.
translation_notes:
  register: Français international moderne, sobre et dignifié. La cadence homilétique de la conclusion et le parallélisme poétique de la citation sont conservés. Le titre seul est retenu après l’amen ; les éléments de navigation du site, les coordonnées et la mention commerciale sont exclus comme paratexte non constitutif de l’œuvre. Traduction provisoire fondée sur le témoin anglais public, la vérification directe du copte restant à effectuer.
