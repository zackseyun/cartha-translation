  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/003.yaml
  text: 'However, when she realizes the trouble she is in, cries out before the Father, and repents, the Father will show mercy to her. He will cause her womb to turn away from the outward kingdom and return inward, making the soul reclaim her good character. For such is not the way of a woman, since the bodily womb is inward, like the other internal organs of the body.


    The womb of the soul, however, surrounds outwardly, like the male’s outward genitals. Therefore, when the womb of the soul turns inward by the will of the Father, it is baptized and immediately purified from the outward pollution which was forced on it, like filthy [garments] soaked [in water and] moved around until the dirt is gone and they are clean. Thus, the purification of the soul is a reclaiming of the renovation of [] her former nature, and a return to herself. That is her baptism.


    Then she will become mad at herself, acting like a woman during labor, writhing and raging in the hour of birth. However, because she is a female, on her own she is unable to conceive a child. From heaven the Father sent her a man—her brother, the firstborn. The bridegroom then went down to the bride. She stopped her earlier prostitution and purified herself from the pollutions of the adulterers. She was even renewed to become a bride. She purified herself in the bridal chamber, filling it with perfume, sitting there awaiting her true bridegroom. She no longer ran around the marketplace, having sex with everyone she wanted. Instead, she kept waiting for him: “When will he arrive?” And she continued to fear him, because she knew not what he looked like. She no more remembered the time she fell from her Father’s house. By the will of the Father, however, [. . .] And she dreamed of him like a woman who loves a man.


    Then, however, the bridegroom, agreeing with the Father’s will, went down to her, into the bridal chamber, which had been prepared, and he adorned the bridal chamber.'
translation:
  language: fr
  text: 'Cependant, lorsqu’elle prend conscience du malheur où elle se trouve, qu’elle crie devant le Père et se repent, alors le Père lui fera miséricorde. Il détournera sa matrice du royaume extérieur et la ramènera vers l’intérieur, afin que l’âme retrouve sa bonne disposition. En effet, ce n’est pas ainsi qu’est faite la femme, car la matrice du corps est à l’intérieur, comme les autres organes internes du corps.


    La matrice de l’âme, en revanche, s’étend vers l’extérieur, comme les organes génitaux externes de l’homme. Ainsi, lorsque la matrice de l’âme se tourne vers l’intérieur par la volonté du Père, elle reçoit le baptême et se trouve aussitôt purifiée de la souillure extérieure qui lui a été imposée. Elle est comme des [vêtements] sales que l’on trempe [dans l’eau et] que l’on remue jusqu’à ce que la saleté disparaisse et qu’ils soient propres. La purification de l’âme consiste donc à retrouver le renouvellement de [] sa nature première et à revenir à elle-même. Voilà son baptême.


    Alors elle entrera en fureur contre elle-même. Comme une femme en travail, elle se tordra et se déchaînera à l’heure de l’accouchement. Cependant, puisqu’elle est de sexe féminin, elle est incapable de concevoir seule un enfant. Du ciel, le Père lui envoya un homme : son frère, le premier-né. Alors l’époux descendit vers l’épouse. Elle renonça à sa prostitution passée et se purifia des souillures laissées par ses amants adultères. Elle fut même renouvelée pour devenir une épouse. Elle purifia la chambre nuptiale, l’emplit de parfum et s’y assit dans l’attente de son véritable époux. Elle ne courait plus sur la place publique pour avoir des rapports avec tous ceux qu’elle désirait. Elle ne cessait plutôt de l’attendre : « Quand arrivera-t-il ? » Elle continuait aussi à le craindre, car elle ignorait à quoi il ressemblait. Elle ne se souvenait plus du temps où elle était tombée hors de la maison de son Père. Mais, par la volonté du Père, […] Et elle rêvait de lui comme une femme qui aime
    un homme.


    Alors l’époux, conformément à la volonté du Père, descendit vers elle, dans la chambre nuptiale qui avait été préparée, et il orna la chambre nuptiale.'
