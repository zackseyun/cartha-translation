lexical_decisions:
- source_word: womb
  choice: matrice
  rationale: « Matrice » conserve le lien anatomique et symbolique répété du passage, avec un registre dignifié; « utérus » aurait été plus strictement clinique.
- source_word: outward kingdom
  choice: royaume extérieur
  rationale: Traduction formelle qui préserve l’opposition structurante entre l’extérieur et l’intérieur sans en préciser l’interprétation.
- source_word: good character
  choice: bonne disposition
  rationale: Cette expression française peut désigner l’état moral ou intérieur de l’âme sans réduire le sens à la seule réputation ou à un trait psychologique.
- source_word: is baptized
  choice: reçoit le baptême
  rationale: Formulation française naturelle qui conserve le langage rituel du témoin sans remplacer le baptême par une simple métaphore de lavage.
- source_word: firstborn
  choice: premier-né
  rationale: Équivalent traditionnel et transparent, sans identifier explicitement le personnage au-delà de ce que dit le passage.
- source_word: bridal chamber
  choice: chambre nuptiale
  rationale: Conserve l’image nuptiale et son éventuelle portée rituelle sans l’expliciter.
- source_word: adulterers
  choice: amants adultères
  rationale: Le substantif français « adultères » seul serait ambigu ou peu naturel ici; l’ajout de « amants » rend le rapport personnel explicite tout en gardant l’idée d’adultère.
theological_decisions:
- issue: Identité du frère premier-né et de l’époux
  choice: Ne pas identifier explicitement ce personnage
  alternative: Ajouter « le Christ » ou une autre identification doctrinale
  rationale: Le passage fourni emploie seulement les titres « frère », « premier-né » et « époux »; la traduction conserve cette réserve.
- issue: Nature du baptême de l’âme
  choice: Maintenir à la fois le vocabulaire baptismal et l’image de purification
  alternative: Paraphraser le baptême comme repentance, conversion ou rite précis
  rationale: Le texte associe ces notions sans en livrer ici une définition doctrinale univoque.
- issue: Métaphore sexuelle et genre grammatical de l’âme
  choice: Conserver la personnification féminine et les images corporelles explicites
  alternative: Neutraliser le genre ou atténuer les images sexuelles
  rationale: Ces éléments structurent l’argument du passage et ne peuvent être supprimés sans perte exégétique importante.
- issue: Lacunes et restaurations éditoriales
  choice: Conserver les crochets et l’ellipse tels qu’ils apparaissent dans le témoin fourni
  alternative: Combler ou lisser les passages endommagés
  rationale: La base copte n’ayant pas encore fait l’objet d’un contrôle direct, toute reconstruction supplémentaire résoudrait artificiellement l’incertitude textuelle.
translation_notes:
  register: Français international moderne, clair et digne, avec maintien du caractère audacieux des métaphores anatomiques et nuptiales. Le passage au passé simple dans le récit distingue les actions successives des énoncés généraux au présent et des perspectives introduites au futur. Projet provisoire établi d’après le témoin anglais public fourni; une vérification directe du copte du Codex II,6 de Nag Hammadi reste nécessaire. Les crochets, les crochets vides et l’ellipse signalant des restaurations ou lacunes ont été conservés sans ajout de notes conjecturales.
