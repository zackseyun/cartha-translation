source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως κεράμιον οἴνου ἢ ἐλαίου ἀνοίξας, τὴν ἀπαρχὴν λαβὼν δὸς τοῖς προφήταις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/006.yaml
  text: Likewise, when you open a jar of wine or oil, take the firstfruits and give them to the prophets.
translation:
  language: fr
  text: De même, quand tu ouvres une jarre de vin ou d’huile, prélève les prémices et donne-les aux prophètes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: De même
  rationale: Rend naturellement le lien de continuité avec les prescriptions précédentes.
- source_word: κεράμιον
  choice: jarre
  rationale: Désigne ici un récipient en terre cuite destiné notamment au vin ou à l’huile.
- source_word: ἀπαρχή
  choice: prémices
  rationale: Terme consacré et compréhensible pour la première part prélevée comme offrande; le singulier grec est rendu par le nom collectif français.
- source_word: λαβών
  choice: prélève
  rationale: Dans ce contexte distributif, « prélever » exprime plus précisément l’action de prendre une part du contenu.
theological_decisions:
- issue: Nature et quantité des prémices
  choice: Conserver le terme collectif « les prémices » sans préciser la quantité
  alternative: « la première part »
  rationale: Le grec τὴν ἀπαρχήν désigne la part initiale offerte, sans en fixer ici la proportion; « prémices » préserve le vocabulaire cultuel et l’indétermination.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier reflète les formes grecques ἀνοίξας, λαβών et δός; l’impératif reste concret et naturel.
