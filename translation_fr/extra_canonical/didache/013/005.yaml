id: DID.13.5
reference: Didache 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν σιτιαυτοῖς, τὴν ἀπαρχὴν λαβὼν δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/005.yaml
  text: If you prepare food[a], take the firstfruits and give according to the commandment.
translation:
  language: fr
  text: Si tu prépares de la nourriture[a], prends-en les prémices et donne-les conformément au commandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une compréhension plus étroite du grec : « Si tu fais du pain, prends-en les prémices ».'
    reason: La forme grecque σιτιαυτοῖς est difficile; la note conserve l’interprétation traditionnelle centrée sur le pain.
lexical_decisions:
- source_word: σιτιαυτοῖς
  choice: tu prépares de la nourriture
  rationale: La forme transmise est difficile et probablement corrompue ou agglutinée, mais le contexte et la tradition de traduction indiquent l’action de préparer des aliments. Cette formulation française conserve un sens général sans la limiter arbitrairement à la fabrication du pain.
- source_word: ἀπαρχὴν
  choice: les prémices
  rationale: Terme consacré et précis pour la première part d’une production offerte; le pluriel est idiomatique en français dans ce sens collectif.
- source_word: κατὰ τὴν ἐντολήν
  choice: conformément au commandement
  rationale: Rend directement l’idée de conformité exprimée par κατά, sans préciser quel commandement puisque le grec ne le fait pas.
theological_decisions:
- issue: Référent du « commandement »
  choice: le commandement
  alternative: ce commandement
  rationale: L’article grec désigne un commandement tenu pour connu, mais le texte ne permet pas de l’identifier davantage; la traduction préserve cette indétermination.
- issue: Nature des prémices
  choice: formulation générale liée à la nourriture
  alternative: premier morceau de pain
  rationale: Le passage peut avoir été compris en rapport avec le pain, mais la forme grecque transmise et le contexte plus large des prémices ne justifient pas de restreindre le sens dans le texte principal.
translation_notes:
  register: Français moderne, clair et digne. Tutoiement maintenu, conformément à la deuxième personne du singulier grec et au style direct des instructions de la Didachè.
