id: DID.13.2
reference: Didache 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως διδάσκαλος ἀληθινός ἐστιν ἄξιος καὶ αὐτός, ὥσπερ ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: fr
  text: De même, un véritable enseignant mérite lui aussi, comme l’ouvrier, sa nourriture.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάσκαλος ἀληθινός
  choice: un véritable enseignant
  rationale: « Véritable » rend naturellement ἀληθινός et qualifie l’enseignant comme authentique, sans ajouter de critère doctrinal absent du texte.
- source_word: ἄξιος ... τῆς τροφῆς αὐτοῦ
  choice: mérite ... qu’on lui fournisse sa nourriture
  rationale: Cette formulation française exprime l’idée d’avoir droit à son entretien et évite le calque peu naturel « digne de sa nourriture », tout en conservant le sens concret de τροφή.
- source_word: ὁ ἐργάτης
  choice: l’ouvrier
  rationale: « Ouvrier » est le correspondant courant de ἐργάτης et maintient l’écho proverbial au travailleur qui mérite sa subsistance.
- source_word: καὶ αὐτός
  choice: lui aussi
  rationale: Rend l’inclusion emphatique du véritable enseignant dans le même principe que l’ouvrier.
theological_decisions:
- issue: Nature du droit du véritable enseignant à la nourriture
  choice: Formuler un droit à recevoir sa nourriture sans préciser qui doit la fournir ni institutionnaliser ce soutien.
  alternative: « est digne de sa nourriture » ou « a droit à son entretien »
  rationale: Le génitif avec ἄξιος exprime qu’il mérite cette nourriture; le texte ne définit ni le fournisseur ni un système particulier de rémunération.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement explicitée pour éviter un calque grec maladroit, sans résoudre au-delà du texte la forme concrète du soutien matériel.
