  yaml_path: translation/extra_canonical/didache/013/004.yaml
  text: But if you do not have a prophet, give to the poor.
translation:
  language: fr
  text: Mais si vous n’avez pas de prophète, donnez aux pauvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προφήτην
  choice: prophète
  rationale: Équivalent direct et naturel, qui conserve la fonction religieuse désignée par le grec.
- source_word: τοῖς πτωχοῖς
  choice: aux pauvres
  rationale: Le datif pluriel désigne les bénéficiaires du don; « aux pauvres » rend fidèlement cette valeur sans ajouter de complément d’objet absent du grec.
theological_decisions:
- issue: Objet implicite du verbe δότε
  choice: Ne pas expliciter l’objet du don
  alternative: « donnez-le aux pauvres »
  rationale: Le grec ne comporte aucun complément d’objet direct. Garder « donnez aux pauvres » préserve cette indétermination et évite de rattacher explicitement le commandement à un bien mentionné dans le contexte.
translation_notes:
  register: Français moderne, simple et digne. Le vouvoiement pluriel rend le ἔχητε adressé à la communauté; la formulation concise suit étroitement la syntaxe grecque tout en restant naturelle.
