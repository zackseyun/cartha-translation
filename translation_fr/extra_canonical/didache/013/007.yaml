revisions:
- from: Quant à l’argent, aux vêtements et à tous les biens, prélève-en les prémices comme bon te semble, puis donne-les conformément au commandement.
  to: De l’argent, des vêtements et de tout bien, après en avoir prélevé les prémices selon ce qui te semble bon, donne-les conformément au commandement.
  rationale: La révision conserve toutes les décisions lexicales du projet tout en rendant λαβών par une construction participiale française (« après en avoir prélevé »), plus proche de la relation syntaxique du grec. « Selon ce qui te semble bon » préserve la latitude laissée au destinataire quant au prélèvement, et « conformément au commandement » maintient la référence définie mais non explicitée.
  reviewer_model: gpt-5.6-terra
