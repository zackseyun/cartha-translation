id: DID.13.7
reference: Didache 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/007.yaml
  text: And of money and clothing and every possession[a], having taken the firstfruit, as it seems good to you, give according to the commandment.
translation:
  language: fr
  text: De l’argent, des vêtements et de tout bien, après en avoir prélevé les prémices selon ce qui te semble bon, donne-les conformément au commandement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου
  choice: l’argent
  rationale: En grec koinè, ἀργύριον peut désigner littéralement l’argent-métal, mais aussi, couramment, l’argent comme moyen de paiement. Le français « argent » conserve naturellement ces deux nuances.
- source_word: ἱματισμοῦ
  choice: aux vêtements
  rationale: Ἱματισμός désigne l’habillement ou les vêtements; le pluriel français convient à cette catégorie de biens.
- source_word: παντὸς κτήματος
  choice: à tous les biens
  rationale: Κτῆμα désigne ce que l’on possède, un bien ou une propriété. « Tous les biens » rend ici la portée générale de l’expression.
- source_word: τὴν ἀπαρχήν
  choice: les prémices
  rationale: Ἀπαρχή est la première part prélevée et offerte. Le pluriel français « prémices » est l’expression biblique naturelle et peut désigner collectivement cette part initiale.
- source_word: ὡς ἂν σοὶ δοξῇ
  choice: comme bon te semble
  rationale: Cette tournure idiomatique exprime une appréciation laissée au destinataire, sans fixer de quantité.
- source_word: δὸς κατὰ τὴν ἐντολήν
  choice: donne-les conformément au commandement
  rationale: La formulation garde la référence définie mais non explicitée au « commandement ». Le pronom « les » reprend naturellement « les prémices » en français.
theological_decisions:
- issue: Identification du « commandement »
  choice: Ne pas préciser de quel commandement il s’agit
  alternative: Identifier explicitement un commandement particulier de la Torah ou une parole de Jésus
  rationale: Le texte grec emploie seulement l’expression définie τὴν ἐντολήν sans en donner ici le contenu. La traduction préserve cette référence contextuelle ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. « Quant à » marque le passage à une nouvelle catégorie d’offrandes; « prélève-en » rend le rapport partitif implicite, et « puis » clarifie sans alourdir la succession entre le prélèvement et le don.
