id: DID.13.1
reference: Didache 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: fr
  text: Mais tout véritable prophète qui désire s’établir parmi vous mérite qu’on lui fournisse sa nourriture.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προφήτης ἀληθινός
  choice: véritable prophète
  rationale: Rend directement l’expression grecque en conservant sa portée qualificative, sans préciser selon quels critères le prophète est reconnu comme véritable.
- source_word: καθῆσαι πρὸς ὑμᾶς
  choice: s’établir parmi vous
  rationale: Dans ce contexte, καθῆσαι exprime l’idée de demeurer ou de se fixer auprès de la communauté plutôt que le simple fait de s’asseoir.
- source_word: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ
  choice: mérite qu’on lui fournisse sa nourriture
  rationale: Exprime naturellement en français le droit du prophète à recevoir de quoi se nourrir; le possessif grec αὐτοῦ renvoie à la nourriture qui lui revient.
theological_decisions:
- issue: Nature du soutien dû au prophète résident
  choice: mérite qu’on lui fournisse sa nourriture
  alternative: a droit à sa nourriture
  rationale: La formulation retenue conserve la notion de dignité ou de mérite portée par ἄξιος, sans transformer explicitement l’énoncé en vocabulaire juridique.
translation_notes:
  register: Français moderne, clair et digne. « Parmi vous » présente l’installation au sein de la communauté; « qu’on lui fournisse » explicite seulement ce que suppose naturellement le génitif avec ἄξιος dans ce contexte.
