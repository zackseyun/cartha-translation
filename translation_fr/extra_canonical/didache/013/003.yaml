id: DID.13.3
reference: Didache 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: fr
  text: Ainsi donc, tu prélèveras toutes les prémices des produits du pressoir et de l’aire de battage, ainsi que des bovins et des moutons, et tu les donneras aux prophètes, car ils sont vos grands prêtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴν
  choice: les prémices
  rationale: Terme français consacré qui exprime la première part prélevée et offerte, plutôt que le simple premier produit.
- source_word: γεννημάτων
  choice: produits
  rationale: Rend naturellement le sens général de ce qui est produit, en lien ici avec le pressoir et l’aire de battage.
- source_word: ληνοῦ
  choice: du pressoir
  rationale: Désigne le lieu ou l’installation où l’on presse notamment le raisin.
- source_word: ἅλωνος
  choice: de l’aire de battage
  rationale: Expression française claire pour l’aire où les céréales sont battues ou foulées.
- source_word: βοῶν τε καὶ προβάτων
  choice: des bovins et des brebis
  rationale: « Bovins » conserve la portée générique de βοῦς; « brebis » suit le sens collectif courant de πρόβατα dans un contexte de troupeaux.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Équivalent direct et intelligible du pluriel grec, sans atténuer l’affirmation cultuelle.
theological_decisions:
- issue: Identification des prophètes aux grands prêtres
  choice: car ils sont vos grands prêtres
  alternative: car ils tiennent pour vous la place des grands prêtres
  rationale: Le grec emploie directement le verbe « être » et ne présente pas cette identification comme une simple analogie fonctionnelle; la traduction conserve donc la force et la tension de l’énoncé.
- issue: Passage du singulier au pluriel dans l’adresse
  choice: tu prélèveras… ils sont vos grands prêtres
  alternative: vous prélèverez… ils sont vos grands prêtres
  rationale: Le grec passe du participe et du verbe au singulier (λαβὼν δώσεις) au possessif pluriel (ὑμῶν). La traduction préserve ce changement plutôt que de l’uniformiser.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe explicite l’action de prélever impliquée par λαβών tout en conservant l’adresse au singulier puis le possessif pluriel du grec. Aucun marqueur de note n’est nécessaire.
