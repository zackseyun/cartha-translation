revisions:
- from: Ainsi donc, tu prélèveras les prémices de tous les produits du pressoir et de l’aire de battage, ainsi que des bovins et des brebis, et tu les donneras aux prophètes, car ils sont vos grands prêtres.
  to: Ainsi donc, tu prélèveras toutes les prémices des produits du pressoir et de l’aire de battage, ainsi que des bovins et des moutons, et tu les donneras aux prophètes, car ils sont vos grands prêtres.
  rationale: La révision restitue plus exactement la portée de « toute prémice » et évite de restreindre le sens collectif de πρόβατα. Elle conserve le passage intentionnel du singulier (« tu ») au pluriel (« vos »), ainsi que l’identification directe des prophètes aux grands prêtres.
