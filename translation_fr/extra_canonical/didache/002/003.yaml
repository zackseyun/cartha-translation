source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
translation:
  language: fr
  text: Tu ne convoiteras pas les biens de ton prochain[a] ; tu ne prêteras pas de faux serment ; tu ne porteras pas de faux témoignage ; tu ne diras pas de mal ; tu ne garderas pas de rancune.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu ne désireras pas ce qui appartient à ton prochain ».
    reason: Préserve une traduction plus littérale de ἐπιθυμήσεις et de τὰ τοῦ πλησίον.
lexical_decisions:
- source_word: ἐπιθυμήσεις
  choice: convoiteras
  rationale: Dans cette reprise du Décalogue, le verbe désigne un désir illégitime visant ce qui appartient au prochain ; « convoiter » en restitue la portée négative mieux que le terme neutre « désirer ».
- source_word: τὰ τοῦ πλησίον
  choice: les biens de ton prochain
  rationale: L’expression substantivée signifie littéralement « les choses de ton prochain » ; « les biens » est naturel en français et exprime ce qui lui appartient.
- source_word: ἐπιορκήσεις
  choice: feras pas de faux serment
  rationale: Le verbe vise le fait de prêter un serment faux, et non simplement de jurer.
- source_word: ψευδομαρτυρήσεις
  choice: porteras pas de faux témoignage
  rationale: Formulation française établie qui correspond précisément au témoignage mensonger.
- source_word: κακολογήσεις
  choice: diras pas de mal
  rationale: Rend naturellement l'idée générale de parler en mal de quelqu’un sans restreindre indûment le terme à la calomnie.
- source_word: μνησικακήσεις
  choice: garderas pas rancune
  rationale: Le verbe exprime le fait de conserver le souvenir d’un tort et d’en vouloir à son auteur ; « garder rancune » est l’équivalent idiomatique courant.
theological_decisions:
- issue: Portée de l’interdiction exprimée par ἐπιθυμέω
  choice: « convoiter » dans le texte principal
  alternative: « désirer »
  rationale: L’écho au Décalogue favorise le sens moralement négatif de désir possessif, tandis que la note conserve la traduction plus littérale et plus large.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier maintient la forme personnelle de la série d’interdictions. Les cinq propositions parallèles et leur rythme paratactique sont conservés.
