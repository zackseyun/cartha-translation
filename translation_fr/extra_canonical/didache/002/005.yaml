  text: Your word shall not be false or empty, but filled with action.c
translation:
  language: fr
  text: Que ta parole ne soit ni mensongère ni vide, mais remplie d’action.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λόγος σου
  choice: ta parole
  rationale: Désigne ici ce que la personne dit; «ta parole» conserve la formulation concise et solennelle du grec.
- source_word: ψευδής
  choice: mensongère
  rationale: Rend directement l’idée d’une parole fausse ou trompeuse.
- source_word: κενός
  choice: creuse
  rationale: Dans ce contexte, qualifie une parole vide de contenu ou sans effet; «creuse» est naturel en français et maintient le contraste avec la mise en pratique.
- source_word: μεμεστωμένος πράξει
  choice: pleinement mise en pratique
  rationale: Le participe parfait passif exprime une parole remplie ou saturée par l’action. Cette formulation française conserve le lien étroit entre parole et conduite sans calquer maladroitement «remplie d’action».
theological_decisions:
- issue: Rapport entre parole et action
  choice: La parole doit être pleinement mise en pratique.
  alternative: La parole doit être remplie d’action.
  rationale: Le grec souligne que les paroles doivent être accompagnées et confirmées par les actes. La traduction retenue exprime cette exigence éthique sans ajouter de doctrine particulière.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif grec formulé au futur normatif est rendu par «Que… ne soit… mais que…», tournure naturelle qui conserve la force d’une instruction morale.
