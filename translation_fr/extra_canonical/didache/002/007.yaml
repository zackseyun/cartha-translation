id: DID.2.7
reference: Didache 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: fr
  text: Tu ne haïras personne. Mais certains, tu les reprendras ; pour certains, tu prieras ; et certains, tu les aimeras plus que ta propre vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ἄνθρωπον
  choice: personne
  rationale: Dans la construction négative οὐ… πάντα, le sens idiomatique est « aucune personne ». « Personne » exprime naturellement en français la portée générique de ἄνθρωπον, sans restriction masculine.
- source_word: ἐλέγξεις
  choice: tu les reprendras
  rationale: Le verbe signifie ici faire voir la faute, réprimander ou corriger. « Reprendre » conserve cette portée morale dans un registre digne et courant.
- source_word: περὶ δὲ ὧν προσεύξῃ
  choice: pour certains, tu prieras
  rationale: περί avec le génitif désigne les personnes au sujet desquelles ou en faveur desquelles on prie. « Pour » est la formulation française la plus naturelle.
- source_word: ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου
  choice: tu les aimeras plus que ta propre vie
  rationale: ψυχή peut désigner l’âme, la personne ou la vie. Avec ὑπέρ au comparatif, l’expression évoque un amour supérieur à l’attachement à sa propre vie ; cette traduction française est claire sans imposer une anthropologie particulière.
theological_decisions:
- issue: Rapport entre l’interdiction de haïr et les trois attitudes qui suivent
  choice: 'Maintenir trois groupes indéterminés : certains à reprendre, certains pour qui prier, certains à aimer plus que sa vie'
  alternative: Comprendre ces attitudes comme une progression applicable aux mêmes personnes
  rationale: Les corrélatifs grecs οὓς μὲν… περὶ δὲ ὧν… οὓς δὲ distinguent grammaticalement des catégories sans expliquer leur rapport. La traduction préserve cette indétermination.
- issue: Sens de ψυχή
  choice: vie
  alternative: âme
  rationale: Dans la comparaison « aimer plus que… », « sa propre vie » rend naturellement l’idée d’un amour allant jusqu’au sacrifice de soi. « Âme » risquerait d’introduire ici une lecture métaphysique non exigée par le grec.
translation_notes:
  register: Français moderne international, direct et solennel. Le tutoiement singulier conserve la forme parénétique de la deuxième personne grecque. La répétition de « certains » reflète la structure ternaire du texte source.
