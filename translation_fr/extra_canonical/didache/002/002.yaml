  naturalness: Le français est moderne, clair et soutenu. Le futur simple et les points-virgules conviennent à cette série d’interdictions. Le remplacement de « et » par « ni » rend aussi la dernière coordination plus naturelle en français négatif.
  terminology: « meurtre » rend bien φονεύσεις dans ce contexte ; « adultère », « immoralité sexuelle », « magie » et « sorcellerie » sont appropriés. « Abuseras sexuellement de garçons » explicite de façon plausible παιδοφθορήσεις, tandis que la note maintient la réserve nécessaire. « Par avortement » est un rendu contextuellement fondé de ἐν φθορᾷ, avec une note qui signale la formulation grecque inhabituelle.
