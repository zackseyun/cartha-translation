base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: fr
  text: Tu ne commettras pas de meurtre ; tu ne commettras pas d’adultère ; tu n’abuseras pas sexuellement de garçons[a] ; tu ne commettras pas d’immoralité sexuelle ; tu ne voleras pas ; tu ne pratiqueras pas la magie ; tu ne pratiqueras pas la sorcellerie[b] ; tu ne tueras pas un enfant par avortement, ni celui qui est né[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec, rare, signifie littéralement « corrompre des garçons » et désigne probablement ici leur exploitation sexuelle, notamment dans le cadre de la pédérastie.
    reason: Préserver l’incertitude lexicale tout en expliquant la traduction contextuelle.
  - marker: b
    text: Le terme grec peut évoquer l’emploi de drogues, de philtres ou de poisons à des fins de sorcellerie.
    reason: Signaler la gamme sémantique de φαρμακεύω et sa distinction possible d’avec μαγεύω.
  - marker: c
    text: 'Littéralement : « tu ne tueras pas un enfant dans la destruction, ni celui qui est né ». La première expression était comprise comme une référence à l’avortement.'
    reason: Rendre visible la forme grecque inhabituelle et le fondement contextuel de la traduction.
lexical_decisions:
- source_word: φονεύσεις
  choice: tu ne commettras pas de meurtre
  rationale: Rend l’interdiction de l’homicide criminel sans l’élargir indistinctement à toute mise à mort.
- source_word: παιδοφθορήσεις
  choice: tu n’abuseras pas sexuellement de garçons
  rationale: Le composé désigne ici vraisemblablement l’exploitation ou l’abus sexuel de garçons ; cette formulation moderne est plus claire que le littéral ambigu « corrompre des garçons ».
- source_word: πορνεύσεις
  choice: tu ne commettras pas d’immoralité sexuelle
  rationale: Formulation englobante qui conserve la portée large de πορνεύω sans la réduire à la prostitution.
- source_word: μαγεύσεις
  choice: tu ne pratiqueras pas la magie
  rationale: Équivalent direct et intelligible de l’activité magique.
- source_word: φαρμακεύσεις
  choice: tu ne pratiqueras pas la sorcellerie
  rationale: Dans ce contexte, le verbe renvoie à l’usage de drogues, philtres ou poisons associé à la sorcellerie ; « sorcellerie » rend le sens contextuel sans imposer le seul sens d’empoisonnement.
- source_word: τέκνον ἐν φθορᾷ
  choice: un enfant par avortement
  rationale: Dans cette interdiction opposant l’enfant durant la destruction à celui déjà né, l’expression vise la mise à mort prénatale par avortement.
- source_word: ἀποκτενεῖς
  choice: tu ne feras pas mourir
  rationale: Distingue légèrement ce verbe du précédent φονεύσεις tout en exprimant clairement l’interdiction de tuer l’enfant né.
theological_decisions:
- issue: Portée de παιδοφθορήσεις
  choice: abus sexuel de garçons
  alternative: corruption de garçons / pédérastie
  rationale: Le contexte de prohibitions sexuelles favorise le sens d’exploitation sexuelle, mais une note conserve l’incertitude lexicale du terme rare.
- issue: Rapport entre φθορά et l’avortement
  choice: traduction explicite « par avortement »
  alternative: « dans la destruction » ou « dans le sein maternel »
  rationale: L’opposition avec l’enfant déjà né indique nettement l’avortement ; la traduction explicite communique le référent sans ajouter de précision sur la méthode ou le stade.
- issue: Distinction entre μαγεύσεις et φαρμακεύσεις
  choice: magie / sorcellerie
  alternative: magie / usage de poisons ou de philtres
  rationale: Le texte juxtapose deux pratiques apparentées mais distinctes ; une note signale la composante possible de drogues, philtres ou poisons dans le second terme.
translation_notes:
  register: Français moderne, international et digne. La série d’interdictions au futur simple conserve la force traditionnelle du Décalogue tout en restant naturelle. La ponctuation en points-virgules préserve le rythme paratactique grec.
