source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ διγνώμων οὐδὲ δίγλωσσος· παγὶς γὰρ θανάτου ἡ διγλωσσία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: fr
  text: Tu ne seras ni partagé ni double dans tes paroles, car le double langage est un piège mortel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διγνώμων
  choice: partagé dans tes pensées
  rationale: Le terme désigne une personne divisée ou hésitante intérieurement. Cette formulation naturelle conserve l’image d’un jugement partagé sans imposer une interprétation doctrinale.
- source_word: δίγλωσσος
  choice: hypocrite dans tes paroles
  rationale: Littéralement « à double langue », le terme évoque ici des paroles doubles ou contradictoires. La formulation retenue exprime clairement ce comportement en français courant.
- source_word: διγλωσσία
  choice: l’hypocrisie dans les paroles
  rationale: Le substantif reprend δίγλωσσος et désigne le fait de tenir un double langage. Cette traduction maintient le lien lexical avec la proposition précédente dans un français idiomatique.
- source_word: παγὶς θανάτου
  choice: un piège mortel
  rationale: Expression française naturelle qui rend l’idée d’un piège conduisant à la mort, tout en conservant la force de l’avertissement grec.
theological_decisions:
- issue: Portée morale de δίγλωσσος et διγλωσσία
  choice: hypocrisie dans les paroles
  alternative: double langage
  rationale: Le grec condamne une parole dédoublée, non une caractéristique physique. « Hypocrisie dans les paroles » rend le sens moral, tandis que « double langage » serait également possible mais relierait moins directement l’adjectif et le substantif.
- issue: Sens du génitif dans παγὶς θανάτου
  choice: piège mortel
  alternative: piège de mort
  rationale: Le génitif peut évoquer un piège caractérisé par la mort ou menant à elle. « Piège mortel » préserve cette ouverture de manière naturelle.
translation_notes:
  register: Français moderne, direct et solennel, avec tutoiement singulier conforme aux interdictions grecques à la deuxième personne. La répétition conceptuelle entre δίγλωσσος et διγλωσσία est conservée par « paroles » dans les deux membres.
