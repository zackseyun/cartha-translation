review_pass:
  verdict: revise
  source_fidelity: La première interdiction rend de façon acceptable διγνώμων, qui évoque une personne intérieurement divisée. En revanche, « hypocrite dans tes paroles » et « l’hypocrisie dans les paroles » interprètent δίγλωσσος / διγλωσσία de manière trop étroite. Le grec vise littéralement et moralement le fait d’avoir une « double langue », c’est-à-dire un double langage, sans limiter nécessairement le reproche à l’hypocrisie.
  naturalness: Le texte est globalement fluide, mais « partagé dans tes pensées » est plus lourd que nécessaire et la répétition de « dans tes paroles » manque de naturel. « Être partagé » et « tenir un double langage » sont idiomatiques en français moderne.
  terminology: « Double langage » préserve le lien lexical entre δίγλωσσος et διγλωσσία, garde l’ambiguïté pertinente (paroles duplices, contradictoires ou déloyales) et évite de réduire le sens à une catégorie psychologique précise telle que l’hypocrisie. « Piège mortel » rend naturellement παγὶς θανάτου.
