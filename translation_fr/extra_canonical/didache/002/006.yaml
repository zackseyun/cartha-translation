id: DID.2.6
reference: Didache 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
translation:
  language: fr
  text: Tu ne seras ni cupide, ni rapace, ni hypocrite, ni malveillant, ni orgueilleux. Tu ne concevras aucun mauvais dessein contre ton prochain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : Tu ne prendras aucune mauvaise résolution contre ton prochain.'
    reason: La locution λήψῃ βουλήν peut évoquer le fait de prendre une résolution aussi bien que de concevoir un dessein.
lexical_decisions:
- source_word: πλεονέκτης
  choice: cupide
  rationale: Le terme désigne celui qui cherche avidement à posséder davantage; « cupide » le distingue de ἅρπαξ.
- source_word: ἅρπαξ
  choice: rapace
  rationale: Le mot évoque quelqu’un qui s’empare avidement du bien d’autrui; « rapace » conserve cette force active.
- source_word: κακοήθης
  choice: malveillant
  rationale: Le grec qualifie un caractère mauvais, porté à la malice; « malveillant » est naturel et plus fort qu’une simple mauvaise disposition.
- source_word: ὑπερήφανος
  choice: orgueilleux
  rationale: Équivalent français courant et digne pour l’arrogance ou l’élévation de soi.
- source_word: λήψῃ βουλὴν πονηράν
  choice: tu ne concevras aucun mauvais dessein
  rationale: Cette tournure française exprime naturellement le fait d’accueillir ou de former une intention mauvaise, tout en gardant la portée délibérative de βουλή.
- source_word: πλησίον
  choice: prochain
  rationale: Terme français biblique toujours compréhensible, qui désigne ici l’autre personne envers qui s’exerce le devoir moral.
theological_decisions:
- issue: Portée de βουλή dans l’interdiction finale
  choice: mauvais dessein
  alternative: mauvais conseil ou mauvaise résolution
  rationale: βουλή peut désigner un conseil, une décision ou un projet. Dans la construction avec κατὰ τοῦ πλησίον, « dessein » rend clairement l’intention dirigée contre autrui sans préciser indûment si elle vient de soi ou d’un conseil reçu.
translation_notes:
  register: Tutoiement singulier conforme au style des interdictions sapientielles et au texte grec. La série « ni… ni… » donne une formulation actuelle, solennelle et facile à comprendre; les termes restent distincts sans lourdeur technique.
