  source_fidelity: 'La liste rend fidèlement les cinq qualificatifs grecs : « cupide » (πλεονέκτης), « rapace » (ἅρπαξ), « hypocrite », « malveillant » (κακοήθης) et « orgueilleux » (ὑπερήφανος). « Tu ne concevras aucun mauvais dessein contre ton prochain » restitue de manière idiomatique βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου, sans réduire indûment βουλή à un conseil donné ou reçu.'
