id: DID.10.6
reference: Didache 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: fr
  text: 'Que la grâce vienne,

    et que ce monde passe.

    Hosanna au Fils de David !

    Si quelqu’un est saint, qu’il vienne ;

    si quelqu’un ne l’est pas, qu’il se repente.

    Maranatha[a]. Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression araméenne pouvant se comprendre comme « Notre Seigneur, viens ! » ou « Notre Seigneur est venu ».
    reason: La translittération grecque μαρανᾰθά ne permet pas de trancher sûrement entre les segmentations araméennes possibles.
lexical_decisions:
- source_word: χάρις
  choice: la grâce
  rationale: Équivalent français naturel qui conserve la portée théologique et la possible personnification du grec.
- source_word: παρελθέτω
  choice: que … passe
  rationale: Rend directement l’impératif grec sans préciser si le monde doit disparaître ou prendre fin.
- source_word: ἅγιος
  choice: saint
  rationale: Conserve le terme cultuel et moral du grec, sans le réduire à « pur » ou « digne ».
- source_word: μετανοείτω
  choice: qu’il se repente
  rationale: Exprime l’appel à un changement intérieur et de conduite, dans un registre biblique encore courant.
- source_word: μαρανᾰθά
  choice: Maranatha
  rationale: Préserve l’acclamation araméenne transmise telle quelle par le texte grec et son ambiguïté de segmentation.
theological_decisions:
- issue: Référent de « la grâce »
  choice: Maintenir « la grâce » sans explicitation
  alternative: « Que le Seigneur vienne » ou une identification explicite au Christ
  rationale: Le grec porte χάρις ; une identification personnelle ou christologique explicite résoudrait une tension que le texte laisse ouverte.
- issue: Sens de Maranatha
  choice: Translittérer dans le texte et signaler les deux analyses possibles en note
  alternative: Traduire uniquement par « Notre Seigneur, viens ! »
  rationale: L’araméen peut être compris comme une invocation (« Notre Seigneur, viens ! ») ou comme une affirmation (« Notre Seigneur est venu »), selon la segmentation et la vocalisation.
- issue: Emploi de « saint » comme condition pour venir
  choice: Conserver la formulation absolue
  alternative: Paraphraser par « en état de sainteté » ou « digne de participer »
  rationale: Le contexte peut évoquer l’accès au repas eucharistique, mais le verset ne l’explicite pas ; la traduction ne doit pas importer cette interprétation.
translation_notes:
  register: Français moderne, sobre et liturgique. Le parallélisme et les impératifs de souhait sont conservés. « Fils de David » prend une majuscule comme titre messianique dans ce contexte d’acclamation.
