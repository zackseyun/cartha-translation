id: DID.10.2
reference: Didache 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: fr
  text: 'Nous te rendons grâce, Père saint,

    pour ton saint nom,

    que tu as fait habiter dans nos cœurs,

    et pour la connaissance, la foi et l’immortalité

    que tu nous as fait connaître par Jésus, ton serviteur.

    À toi la gloire pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν
  choice: Nous te rendons grâce
  rationale: Rend naturellement la formule grecque d’action de grâce tout en conservant son caractère liturgique.
- source_word: κατεσκήνωσας
  choice: tu as fait habiter
  rationale: Le causatif grec évoque l’établissement d’une demeure; cette formulation préserve l’image sans employer un terme artificiel.
- source_word: γνώσεως
  choice: connaissance
  rationale: Équivalent direct et intelligible de γνώσις dans cette série avec la foi et l’immortalité.
- source_word: ἀθανασίας
  choice: immortalité
  rationale: Traduction précise du nom grec, sans le remplacer par une interprétation telle que « vie éternelle ».
- source_word: παιδός
  choice: serviteur
  rationale: παῖς peut signifier « enfant/fils » ou « serviteur ». Dans cette formule ancienne, « serviteur » reste une traduction bien attestée et préserve le lien possible avec le serviteur de Dieu, sans ajouter explicitement le titre « Fils ».
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française naturelle pour la durée indéfinie de la doxologie grecque.
theological_decisions:
- issue: Sens christologique de παῖς appliqué à Jésus
  choice: Jésus, ton serviteur
  alternative: Jésus, ton enfant / ton fils
  rationale: Le mot grec demeure polysémique, mais « serviteur » convient au registre des premières prières chrétiennes et évite de transformer παῖς en υἱός (« fils »).
- issue: Mode d’habitation du nom divin
  choice: que tu as fait habiter dans nos cœurs
  alternative: que tu as établi dans nos cœurs
  rationale: La traduction conserve l’image forte de κατεσκηνόω sans préciser davantage la nature de cette présence.
translation_notes:
  register: Français moderne international, digne et accessible, avec une disposition en lignes qui respecte le rythme de la prière. Le tutoiement correspond à l’adresse directe au Père et à l’usage courant des traductions bibliques françaises contemporaines.
