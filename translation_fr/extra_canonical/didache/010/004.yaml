id: DID.10.4
reference: Didache 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ πάντων εὐχαριστοῦμέν σοι ὅτι δυνατός εἶ· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/004.yaml
  text: Before all things we give thanks to you because you are mighty; to you be the glory forever.
translation:
  language: fr
  text: Avant toute chose, nous te rendons grâce parce que tu es puissant ; à toi la gloire pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: Avant toute chose
  rationale: Rend le sens premier de priorité exprimé par la locution grecque, tout en restant naturel en français et sans le réduire au seul sens emphatique de « par-dessus tout ».
- source_word: εὐχαριστοῦμέν σοι
  choice: nous te rendons grâce
  rationale: Formulation française courante dans un contexte de prière, qui conserve l’adresse directe et l’idée d’action de grâce.
- source_word: δυνατός
  choice: puissant
  rationale: Correspond au terme grec sans ajouter l’idée plus spécifique de toute-puissance.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour les siècles
  rationale: Conserve l’image temporelle et la tonalité liturgique du grec, là où « pour toujours » serait plus idiomatique mais moins formellement proche.
theological_decisions:
- issue: Portée de δυνατός
  choice: puissant
  alternative: tout-puissant
  rationale: Le grec affirme la puissance de Dieu, mais ne porte pas explicitement le terme théologique plus précis « tout-puissant ».
- issue: Sens de Πρὸ πάντων
  choice: Avant toute chose
  alternative: Par-dessus tout
  rationale: La traduction retenue préserve le sens temporel ou ordonné le plus direct, sans exclure entièrement une nuance de primauté.
translation_notes:
  register: Français moderne, digne et liturgique, avec tutoiement conforme à l’adresse grecque au singulier. La ponctuation en point-virgule maintient les deux propositions dans une même unité de prière.
