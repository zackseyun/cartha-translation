source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τοῖς δὲ προφήταις ἐπιτρέπετε εὐχαριστεῖν ὅσα θέλουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/007.yaml
  text: But permit the prophets to give thanks as they desire.
translation:
  language: fr
  text: Mais permettez aux prophètes de rendre grâce comme ils le souhaitent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῖς δὲ προφήταις
  choice: Mais … aux prophètes
  rationale: Le datif désigne les personnes auxquelles cette liberté est accordée. « Mais » rend naturellement δέ et marque l’exception ou le contraste avec les directives liturgiques précédentes.
- source_word: ἐπιτρέπετε
  choice: permettez
  rationale: 'Impératif présent à valeur directive : la communauté doit laisser cette liberté aux prophètes.'
- source_word: εὐχαριστεῖν
  choice: rendre grâce
  rationale: Dans ce contexte de prière après le repas, le verbe signifie prononcer l’action de grâce ; « rendre grâce » conserve son sens verbal et cultuel sans le réduire à une simple formule de remerciement.
- source_word: ὅσα θέλουσιν
  choice: comme ils le souhaitent
  rationale: Formulation française naturelle exprimant la liberté laissée aux prophètes quant à leur action de grâce, sans imposer artificiellement une lecture portant seulement sur la longueur ou la quantité.
theological_decisions:
- issue: Étendue de la liberté accordée aux prophètes
  choice: « comme ils le souhaitent »
  alternative: « autant qu’ils le souhaitent »
  rationale: Le grec ὅσα peut évoquer l’étendue ou le contenu, mais le contexte ne permet pas de limiter sûrement la permission à la seule durée. La formulation retenue préserve une portée plus ouverte.
translation_notes:
  register: Français moderne, clair et digne. La tournure impérative conserve l’adresse communautaire du texte et le vocabulaire « prophètes » / « rendre grâce » maintient son cadre religieux ancien.
