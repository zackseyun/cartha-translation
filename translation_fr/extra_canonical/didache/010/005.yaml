review_pass:
  verdict: revise
  source_fidelity: 'La prière grecque dépend de « Souviens-toi » et exprime par des infinitifs le but demandé : la délivrer et la conduire à son accomplissement. Le projet transforme ces infinitifs en impératifs autonomes. Surtout, « dans ton royaume » donne au rassemblement une destination que la séquence grecque rattache plus naturellement à « sanctifiée » (« sanctifiée pour ton royaume »).'
  naturalness: Le français du projet est globalement clair et digne, mais « elle que tu as sanctifiée, dans ton royaume » est syntaxiquement ambigu et moins naturel. La construction « afin de ... » rend clairement et fluidement la dépendance des infinitifs grecs.
  terminology: « Église », « tout mal », « sanctifiée », « royaume », « puissance » et « gloire » conviennent. « Tout mal » conserve utilement l'ambiguïté de παντὸς πονηροῦ sans imposer « le Malin ». Le passif « sanctifiée » évite aussi d'expliciter inutilement l'agent divin.
  issues:
  - severity: medium
    issue: Les infinitifs grecs sont rendus comme des impératifs indépendants.
    rationale: '« délivre-la » et « rends-la parfaite » sont intelligibles dans une prière, mais Μνήσθητι ... τοῦ ῥύσασθαι ... καὶ τελειῶσαι demande plus exactement : « Souviens-toi ... afin de la délivrer ... et de la rendre parfaite ». Cela préserve la construction et le rapport syntaxique.'
  - severity: medium
    issue: La localisation « dans ton royaume » est attribuée au rassemblement.
    rationale: Dans le grec, εἰς τὴν σὴν Βασιλείαν suit immédiatement le participe féminin τὴν ἁγιασθεῖσαν et se rend naturellement par « sanctifiée pour ton royaume ». Le projet choisit une analyse moins proche et réduit la clarté de l'apposition.
  - severity: low
    issue: L'agent de la sanctification est explicité.
    rationale: « elle que tu as sanctifiée » est compatible avec la prière adressée au Seigneur, mais τὴν ἁγιασθεῖσαν est un participe passif sans agent exprimé. « elle qui est sanctifiée » maintient cette retenue.
  revised_text: Souviens-toi, Seigneur, de ton Église, afin de la délivrer de tout mal et de la rendre parfaite dans ton amour ; rassemble-la des quatre vents, elle qui est sanctifiée pour ton royaume, que tu as préparé pour elle. Car c’est à toi qu’appartiennent la puissance et la gloire pour toujours.
  revised_footnotes: []
