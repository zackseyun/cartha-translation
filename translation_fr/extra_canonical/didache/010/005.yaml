id: DID.10.5
reference: Didache 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
translation:
  language: fr
  text: Souviens-toi, Seigneur, de ton Église, afin de la délivrer de tout mal et de la rendre parfaite dans ton amour ; rassemble-la des quatre vents, elle qui est sanctifiée pour ton royaume, que tu as préparé pour elle. Car c’est à toi qu’appartiennent la puissance et la gloire pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μνήσθητι
  choice: Souviens-toi
  rationale: Impératif direct et naturel en français, conservant la forme traditionnelle de la prière biblique.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Désigne ici la communauté entière du Seigneur; la majuscule signale cette réalité collective sans ajouter de précision confessionnelle.
- source_word: ῥύσασθαι
  choice: délivre-la
  rationale: Rend l’idée d’arracher ou de préserver d’un danger, avec une formulation française fluide après «Souviens-toi».
- source_word: παντὸς πονηροῦ
  choice: de tout mal
  rationale: Le grec peut évoquer toute forme de mal; le neutre français conserve cette portée générale sans imposer le sens personnel «du Malin».
- source_word: τελειῶσαι
  choice: rends-la parfaite
  rationale: Conserve l’idée forte d’accomplissement ou de perfection plutôt que de l’atténuer en «achève» ou «fais mûrir».
- source_word: ἀπὸ τῶν τεσσάρων ἀνέμων
  choice: des quatre vents
  rationale: Expression cosmologique traditionnelle signifiant de toutes les directions, gardée sous sa forme imagée.
- source_word: τὴν ἁγιασθεῖσαν
  choice: elle que tu as sanctifiée
  rationale: Le participe aoriste passif féminin renvoie à l’Église; cette formulation explicite grammaticalement ce référent sans ajouter un second substantif.
- source_word: εἰς τὴν σὴν Βασιλείαν
  choice: dans ton royaume
  rationale: Rend naturellement le mouvement ou l’entrée visée par εἰς.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français courant et digne de la formule doxologique.
theological_decisions:
- issue: Référent de παντὸς πονηροῦ
  choice: tout mal
  alternative: le Malin
  rationale: La forme grecque permet théoriquement une lecture personnelle ou neutre, mais le contexte et l’expression générale favorisent ici «tout mal»; la traduction évite de trancher en faveur d’une personnification.
- issue: Rapport de τὴν ἁγιασθεῖσαν avec l’Église et le royaume
  choice: «elle que tu as sanctifiée» en apposition à l’Église, puis «dans ton royaume» comme destination du rassemblement
  alternative: «rassemble-la, sanctifiée pour ton royaume»
  rationale: L’accord féminin identifie clairement l’Église comme celle qui a été sanctifiée. La portée exacte de εἰς peut rester discutée, mais l’ordre grec soutient naturellement le rassemblement dans le royaume.
- issue: Sujet implicite de ἡτοίμασας et destinataire αὐτῇ
  choice: Dieu a préparé le royaume pour l’Église
  alternative: traduction laissant le pronom sans référent explicite
  rationale: Les formes de deuxième personne et le pronom féminin conduisent directement à cette relation, sans requérir d’ajout doctrinal.
translation_notes:
  register: Français international moderne, priant et digne. Le tutoiement correspond aux pronoms grecs singuliers adressés au Seigneur. La ponctuation en deux phrases et les deux-points rendent lisible la construction infinitive grecque sans transformer la prière en liste. Aucune note n’est nécessaire, puisque «elle que tu as sanctifiée» résout naturellement en français l’apposition féminine sans supprimer sa valeur.
