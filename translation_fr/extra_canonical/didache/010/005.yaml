revisions:
- from: 'Souviens-toi, Seigneur, de ton Église : délivre-la de tout mal et rends-la parfaite dans ton amour. Rassemble-la des quatre vents, elle que tu as sanctifiée, dans ton royaume que tu as préparé pour elle. Car à toi appartiennent la puissance et la gloire pour toujours.'
  to: Souviens-toi, Seigneur, de ton Église, afin de la délivrer de tout mal et de la rendre parfaite dans ton amour ; rassemble-la des quatre vents, elle qui est sanctifiée pour ton royaume, que tu as préparé pour elle. Car c’est à toi qu’appartiennent la puissance et la gloire pour toujours.
  rationale: 'La révision rétablit la dépendance des infinitifs à « Souviens-toi », rend l''apposition participiale sans ajouter d''agent, et rattache « pour ton royaume » à « sanctifiée », conformément à l''ordre et à la syntaxe les plus directs du grec. Aucun renvoi de note n''est requis : cette formulation française explicite la relation grammaticale sans résoudre une variante textuelle ni imposer une lecture confessionnelle.'
  reviewer_model: gpt-5.6-terra
