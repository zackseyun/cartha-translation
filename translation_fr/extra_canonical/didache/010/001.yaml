lexical_decisions:
- source_word: Μετὰ δὲ τὸ ἐμπλησθῆναι
  choice: Après avoir mangé à votre faim
  rationale: Dans le contexte explicite du repas, ἐμπλησθῆναι signifie parvenir à satiété. Cette formulation française naturelle exprime clairement l’achèvement du repas sans suggérer un remplissage spirituel. La particule δέ assure ici une transition légère, naturellement rendue par l’enchaînement en français plutôt que par « mais ».
- source_word: οὕτως
  choice: de cette manière
  rationale: 'Rend le sens prospectif : la formule d’action de grâce va suivre.'
- source_word: εὐχαριστήσατε
  choice: rendez grâce
  rationale: L’impératif aoriste pluriel appelle les destinataires à prononcer l’action de grâce qui suit. « Rendez grâce » conserve le registre religieux tout en restant courant et digne.
