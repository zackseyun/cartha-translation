id: DID.10.3
reference: Didache 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: fr
  text: 'Toi, Maître tout-puissant,


    tu as créé toutes choses à cause de ton nom.


    Tu as donné aux êtres humains nourriture et boisson pour leur plaisir,


    afin qu’ils te rendent grâce ;


    mais à nous, par ton serviteur[a], tu as fait don d’une nourriture et d’une boisson spirituelles,


    ainsi que de la vie éternelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enfant » ; le mot grec peut avoir les deux sens.'
    reason: Préserver l’ambiguïté lexicale réelle de παῖς.
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  choice: Maître tout-puissant
  rationale: « Maître » exprime l’autorité de δέσποτα sans la connotation moderne négative de « despote » ; « tout-puissant » rend naturellement παντοκράτορ.
- source_word: ἕνεκεν τοῦ ὀνόματός σου
  choice: pour ton nom
  rationale: Formulation française concise qui conserve l’idée que la création a pour motif ou finalité le nom de Dieu, sans préciser davantage le rapport exact.
- source_word: τοῖς ἀνθρώποις
  choice: aux êtres humains
  rationale: Rend le pluriel générique de ἄνθρωπος de manière inclusive et actuelle.
- source_word: εἰς ἀπόλαυσιν
  choice: pour leur plaisir
  rationale: Exprime ici la jouissance ou l’agrément que procurent la nourriture et la boisson, dans une langue courante.
- source_word: ἐχαρίσω
  choice: tu as fait don
  rationale: Conserve la nuance de don gracieux portée par le verbe, plutôt que le simple « donner ».
- source_word: πνευματικὴν τροφὴν καὶ ποτὸν
  choice: une nourriture et un breuvage spirituels
  rationale: Reproduit le contraste avec la nourriture et la boisson ordinaires, tout en adoptant un accord français naturel qui porte sur les deux éléments.
- source_word: διὰ τοῦ παιδός σου
  choice: par ton serviteur
  rationale: Dans ce contexte religieux ancien, παῖς peut désigner le serviteur de Dieu ; une note conserve toutefois l’autre sens lexical possible.
theological_decisions:
- issue: Sens de παῖς dans l’expression διὰ τοῦ παιδός σου
  choice: serviteur
  alternative: enfant
  rationale: « Serviteur » correspond à l’usage biblique et liturgique de παῖς pour un agent choisi de Dieu, probablement Jésus dans le contexte de la Didachè. Puisque le mot peut aussi signifier « enfant », cette ambiguïté est signalée sans être effacée.
- issue: Portée de « spirituel »
  choice: Le qualificatif porte en français sur la nourriture et le breuvage
  alternative: Ne qualifier explicitement que la nourriture
  rationale: Bien que πνευματικήν soit formellement accordé avec τροφήν, la coordination étroite suggère naturellement que la nourriture et le breuvage sont tous deux spirituels.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes maintient le rythme de prière et le contraste entre les dons accordés à l’humanité et ceux accordés à la communauté.
