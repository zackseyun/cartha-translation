    issue: « serviteurs » atténue δοῦλοι
    rationale: Dans l’opposition explicite δοῦλοι–κύριοι, le grec renvoie à des esclaves et à leurs maîtres. « Serviteurs » peut désigner en français moderne du personnel libre et ne rend pas suffisamment le statut historique.
  - severity: medium
    issue: « représentation de Dieu » est peu naturel pour des personnes
    rationale: τύπος peut ici désigner une figure ou un représentant; « représentants de Dieu » rend plus clairement la fonction d’autorité représentée et s’accorde avec le pluriel « maîtres ».
  - severity: low
    issue: « respect » affaiblit αἰσχύνῃ
    rationale: Le terme renvoie à la honte, à la pudeur ou à une retenue respectueuse. « Réserve » préserve cette nuance sans imposer une interprétation psychologique excessive.
