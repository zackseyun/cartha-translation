  verdict: revise
  source_fidelity: La relation δοῦλοι–κύριοι désigne ici des esclaves et leurs maîtres, non de simples employés ou serviteurs. « Esclaves » restitue donc plus exactement le cadre social antique. « Soumettez-vous » rend bien l’injonction. Pour ὡς τύπῳ Θεοῦ, « représentants de Dieu » exprime naturellement la valeur personnelle et représentative retenue dans la piste d’audit anglaise, sans assimiler les maîtres à Dieu. αἰσχύνῃ évoque plus précisément la réserve/la retenue (voire la honte) que le seul « respect »; « avec réserve et crainte » conserve la distinction avec φόβῳ.
  naturalness: « Vous, les esclaves » et « avec réserve et crainte » sont idiomatiques dans un français moderne et gardent un registre sobre. « Représentation de Dieu » est moins naturel lorsqu’il s’agit de personnes et peut suggérer une image ou une représentation artistique; le pluriel « représentants de Dieu » convient au référent pluriel.
  terminology: « Esclaves » est requis pour δοῦλοι dans ce contexte de dépendance juridique. « Maîtres » convient à κύριοι. La note maintient l’alternative « modèle », correspondant à une autre valeur possible de τύπος, tout en évitant de présenter cette option comme le sens principal.
  issues:
