source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you servants shall be subject to your masters as to a representative of God[a], in reverence and fear.
translation:
  language: fr
  text: Vous, les esclaves, soumettez-vous à vos maîtres comme à des représentants de Dieu[a], avec réserve et crainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme à un modèle de Dieu » ; litt. « comme à un type de Dieu ».'
    reason: τύπος peut désigner un représentant, une figure ou un modèle. La note conserve l’alternative sémantique sans affaiblir le sens personnel du texte principal.
lexical_decisions:
- source_word: δοῦλοι
  choice: serviteurs
  rationale: « Serviteurs » reste naturel et digne en français, tout en couvrant ici des personnes juridiquement soumises à des maîtres; une note signale la valeur historique plus forte du grec.
- source_word: ὑποτάγησεθε
  choice: soumettez-vous
  rationale: Le contexte et la forme transmise appellent une injonction; « soumettez-vous » rend directement l’idée de subordination.
- source_word: κυρίοις
  choice: maîtres
  rationale: Dans la relation δοῦλοι–κύριοι, « maîtres » est le correspondant français précis.
- source_word: τύπῳ Θεοῦ
  choice: une représentation de Dieu
  rationale: τύπος appliqué à une personne peut désigner une figure ou représentation visible; cette formulation exprime la fonction représentative sans identifier le maître à Dieu.
- source_word: αἰσχύνῃ
  choice: respect
  rationale: Bien que le mot puisse évoquer la honte ou la réserve, « respect » rend ici l’attitude de retenue respectueuse exigée par le contexte.
- source_word: φόβῳ
  choice: crainte
  rationale: « Crainte » conserve la force du grec et sa distinction d’avec le respect.
theological_decisions:
- issue: Portée de « comme à une représentation de Dieu »
  choice: Conserver la comparaison et la fonction représentative
  alternative: « comme à un modèle de Dieu »
  rationale: Le grec ὡς τύπῳ Θεοῦ demeure susceptible d’être compris comme « figure », « représentation » ou « modèle ». Le texte principal privilégie le sens personnel et représentatif, tandis que la note maintient l’autre possibilité.
translation_notes:
  register: Français moderne, direct et digne. « Quant à vous » marque le changement de destinataires. Le vocabulaire conserve le cadre social antique sans ajouter une approbation théologique de l’institution.
