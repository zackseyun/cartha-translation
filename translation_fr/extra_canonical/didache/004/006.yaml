  yaml_path: translation/extra_canonical/didache/004/006.yaml
  text: If you have anything, you shall give through your hands a ransom for your sins.
translation:
  language: fr
  text: Si tu as quelque chose, tu donneras de tes propres mains une rançon pour tes péchés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν ἔχῃς
  choice: Si tu as quelque chose
  rationale: La proposition conditionnelle est conservée sans préciser l’objet sous-entendu, vraisemblablement des biens à donner.
- source_word: διὰ τῶν χειρῶν σου
  choice: de tes propres mains
  rationale: Cette formulation française naturelle garde l’accent mis par le grec sur l’action personnelle et concrète du don.
- source_word: δώσεις
  choice: tu donneras
  rationale: Le futur à valeur injonctive est rendu directement par le futur français.
- source_word: λύτρωσιν
  choice: une rançon
  rationale: Le terme conserve l’image forte d’un prix de libération ou de rachat, sans l’atténuer en simple « aumône ».
- source_word: ἁμαρτιῶν σου
  choice: pour tes péchés
  rationale: La relation exprimée par le génitif est rendue sobrement, sans développer une théorie précise de l’expiation.
theological_decisions:
- issue: Rapport entre le don et les péchés
  choice: une rançon pour tes péchés
  alternative: un moyen de racheter tes péchés
  rationale: La traduction retenue préserve la métaphore et la tension théologique du texte grec, sans expliquer que l’acte charitable obtiendrait mécaniquement le pardon.
translation_notes:
  register: Tutoiement cohérent avec l’adresse grecque au singulier. Style actuel et digne; la formulation reste volontairement dense afin de préserver l’image sotériologique du texte source.
