source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μισήσεις πᾶσαν ὑπόκρισιν καὶ πᾶν ὃ μὴ ἀρεστὸν τῷ Κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/012.yaml
  text: You shall hate all hypocrisy and everything that is not pleasing to the Lord.
translation:
  language: fr
  text: Tu détesteras toute hypocrisie et tout ce qui ne plaît pas au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μισήσεις
  choice: Tu détesteras
  rationale: Le futur français à valeur impérative reproduit la forme grecque et exprime clairement une obligation morale forte.
- source_word: πᾶσαν ὑπόκρισιν
  choice: toute hypocrisie
  rationale: Traduction directe qui conserve la portée exhaustive de πᾶσαν et le sens courant de ὑπόκρισιν.
- source_word: πᾶν ὃ μὴ ἀρεστὸν
  choice: tout ce qui ne plaît pas
  rationale: Formulation française naturelle et fidèle à l'expression grecque désignant tout ce qui n'est pas agréable ou acceptable.
- source_word: τῷ Κυρίῳ
  choice: au Seigneur
  rationale: Rend le datif grec lié à ἀρεστόν et conserve le titre religieux traditionnel Κυρίῳ.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Conserver « le Seigneur » sans préciser le référent
  alternative: Expliciter « Dieu » ou « Jésus-Christ »
  rationale: Le grec emploie seulement Κυρίῳ; préciser davantage résoudrait une référence que le verset laisse implicite.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier conserve l'adresse personnelle du grec. Aucun appel de note n'est requis.
