id: DID.4.10
reference: Didache 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your servant or female servant who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
translation:
  language: fr
  text: Ne donne pas d’ordres avec aigreur à ton esclave ou à ta servante, eux qui mettent leur espérance dans le même Dieu, de peur qu’ils ne finissent par ne pas craindre le Dieu qui est au-dessus de vous deux. Car ce n’est pas selon l’apparence qu’il vient appeler, mais ceux que l’Esprit a préparés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon le visage ». L’expression peut aussi évoquer l’apparence extérieure ou le fait de faire acception de personnes.'
    reason: Le grec κατὰ πρόσωπον est idiomatique; la note préserve ses nuances possibles sans limiter le texte à la seule position sociale.
lexical_decisions:
- source_word: ἐπιτάξεις
  choice: donne pas d’ordres
  rationale: Le verbe signifie imposer, ordonner ou commander. « Donner des ordres » est naturel en français et conserve ici la relation d’autorité.
- source_word: δούλῳ σου ἢ παιδίσκῃ
  choice: à ton esclave ou à ta servante
  rationale: Le grec désigne explicitement un esclave masculin et une servante, dans le cadre social ancien. Traduire « esclave » évite d’atténuer anachroniquement la réalité du statut.
- source_word: ἐν πικρίᾳ σου
  choice: avec aigreur
  rationale: « Aigreur » exprime ici une disposition dure et amère dans la manière de commander, avec un français plus naturel que le calque « dans ton amertume ».
- source_word: ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν
  choice: mettent leur espérance dans le même Dieu
  rationale: Cette formulation explicite le sens religieux de ἐλπίζω ἐπί et maintient l’idée que maître et esclaves espèrent dans un même Dieu.
- source_word: τὸν ἐπ᾽ ἀμφοτέροις Θεόν
  choice: le Dieu qui est au-dessus de vous deux
  rationale: Le grec présente Dieu comme étant au-dessus des deux parties. « Vous deux » restitue naturellement ἀμφοτέροις en incluant le maître et la personne asservie.
- source_word: κατὰ πρόσωπον
  choice: en fonction du rang social
  rationale: Dans ce contexte, l’expression renvoie vraisemblablement à la position visible ou au statut de la personne, plutôt qu’au visage au sens littéral.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Le rôle de préparation en vue de l’appel divin favorise ici la référence à l’Esprit de Dieu, sans ajouter de précision trinitaire absente du texte.
theological_decisions:
- issue: Portée de « ceux que l’Esprit a préparés »
  choice: Conserver l’énoncé sans expliquer la nature de cette préparation ni son rapport à l’appel
  alternative: Préciser qu’il s’agit d’une prédestination, d’une disposition morale ou d’une préparation préalable par Dieu
  rationale: Le texte affirme une préparation par l’Esprit, mais n’en définit ni le mécanisme ni la portée théologique.
- issue: Force de μήποτε οὐ μὴ φοβηθήσονται
  choice: « de peur qu’ils n’en viennent à ne plus craindre »
  alternative: « de peur qu’ils ne craignent pas »
  rationale: La formulation choisie laisse entendre la forte négation du grec tout en présentant l’effet possible de l’aigreur du maître, sans transformer l’énoncé en certitude.
translation_notes:
  register: Français moderne, direct et digne. L’impératif négatif traduit naturellement le futur prohibitif grec. La reprise « eux qui » clarifie l’accord collectif du participe grec pluriel après deux noms singuliers. Le dernier membre répète « il vient » pour rendre intelligible l’ellipse grecque sans effacer le contraste.
