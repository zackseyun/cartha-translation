revisions:
- from: Ne donne pas d’ordres avec aigreur à ton esclave ou à ta servante, eux qui mettent leur espérance dans le même Dieu, de peur qu’ils n’en viennent à ne plus craindre le Dieu qui est au-dessus de vous deux. Car il ne vient pas appeler en fonction du rang social[a], mais il vient vers ceux que l’Esprit a préparés.
  to: Ne donne pas d’ordres avec aigreur à ton esclave ou à ta servante, eux qui mettent leur espérance dans le même Dieu, de peur qu’ils ne finissent par ne pas craindre le Dieu qui est au-dessus de vous deux. Car ce n’est pas selon l’apparence qu’il vient appeler, mais ceux que l’Esprit a préparés[a].
  rationale: La révision remplace une interprétation trop étroite de κατὰ πρόσωπον par « selon l’apparence », maintient l’ambiguïté pertinente en note et resserre la syntaxe finale pour que « appeler » s’applique naturellement au contraste entier. Les autres choix du projet sont conservés.
