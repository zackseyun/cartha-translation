review_pass:
  verdict: revise
  source_fidelity: La première phrase rend bien l’interdiction, le statut servile explicite, l’aigreur et l’espérance dans le même Dieu. « Au-dessus de vous deux » restitue correctement ἐπ’ ἀμφοτέροις. En revanche, « en fonction du rang social » restreint indûment κατὰ πρόσωπον, expression qui renvoie plus largement à l’apparence extérieure et, par extension, à la considération de la personne. La formulation finale révisée conserve le parallélisme elliptique grec sans lui ajouter une opposition de mouvement inutile.
  naturalness: Le français est globalement moderne et clair. « Eux qui » est recevable et aide à comprendre que les deux termes génériques sont collectivement visés. La révision de la dernière phrase est plus idiomatique et plus directe. « De peur qu’ils ne finissent par ne pas craindre » exprime clairement la négation redoublée du grec sans l’ambiguïté que pourrait créer un ne explétif français.
  terminology: '« Esclave », « servante », « espérance », « Dieu » et « l’Esprit » sont appropriés. « Selon l’apparence » est préférable à « en fonction du rang social » : il respecte l’amplitude de κατὰ πρόσωπον sans imposer une interprétation sociale exclusive.'
  issues:
  - severity: medium
    issue: Restriction interprétative de κατὰ πρόσωπον
    rationale: Le texte principal traduit l’expression par « en fonction du rang social », alors que le grec peut désigner l’apparence, le visage/la personne considérée extérieurement, ou la partialité. La note reconnaît cette amplitude, mais le texte courant ne devrait pas choisir le sens social étroit sans nécessité.
  - severity: low
    issue: « Il vient vers ceux » dans le dernier membre
    rationale: Cette reprise explicative est possible, mais elle affaiblit le parallélisme elliptique avec « appeler » et fait porter l’idée d’appel principalement sur le premier membre. Une formulation coordonnée avec l’appel est plus nette en français.
