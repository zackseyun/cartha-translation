id: DID.4.3
reference: Didache 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
translation:
  language: fr
  text: Tu ne provoqueras pas de division[a], mais tu réconcilieras ceux qui se querellent. Tu jugeras avec justice ; tu ne feras pas de favoritisme en reprenant quelqu’un pour ses fautes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « provoquer une scission ».
    reason: Signale une autre traduction possible de σχίσμα tout en évitant de faire du terme « schisme », au sens institutionnel, le rendu principal.
lexical_decisions:
- source_word: σχίσμα
  choice: division
  rationale: Dans ce contexte ancien, le mot désigne une rupture ou une dissension au sein de la communauté ; « division » évite les connotations institutionnelles plus tardives de « schisme ».
- source_word: εἰρηνεύσεις … μαχομένους
  choice: tu réconcilieras ceux qui se querellent
  rationale: Le grec exprime l’action de rétablir la paix entre des personnes en conflit ; cette formulation est naturelle en français et conserve le sens relationnel.
- source_word: κρινεῖς δικαίως
  choice: tu jugeras avec justice
  rationale: Rend directement l’adverbe δικαίως tout en gardant un français courant et digne.
- source_word: οὐ λήψῃ πρόσωπον
  choice: tu ne feras pas de favoritisme
  rationale: L’expression idiomatique grecque « recevoir/prendre le visage » signifie traiter les personnes avec partialité.
- source_word: παραπτώμασιν
  choice: fautes
  rationale: Le terme évoque des faux pas ou des transgressions ; « fautes » convient au contexte de la réprimande sans préciser indûment leur gravité.
theological_decisions:
- issue: Portée de σχίσμα
  choice: division communautaire au sens large
  alternative: schisme institutionnel formel
  rationale: Le sens ancien du terme n’exige pas l’idée plus tardive d’une rupture ecclésiastique officiellement constituée.
- issue: Objet de la réprimande dans ἐλέγξαι ἐπὶ παραπτώμασιν
  choice: reprendre quelqu’un pour ses fautes
  alternative: réprouver abstraitement des transgressions
  rationale: La tournure française explicite le complément humain sous-entendu par l’interdiction du favoritisme, sans identifier une personne ou une catégorie particulière.
translation_notes:
  register: Tutoiement injonctif conforme au style parénétique de la Didachè. Français moderne, direct et digne ; répétition de « tu » conservée pour restituer la structure des commandements grecs.
