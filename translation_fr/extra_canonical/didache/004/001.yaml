revisions:
- from: Mon enfant, tu te souviendras nuit et jour de celui qui te dit la parole de Dieu, et tu l’honoreras comme le Seigneur ; car là où la seigneurie[a] est proclamée, là est le Seigneur.
  to: Mon enfant, tu te souviendras nuit et jour de celui qui te dit la parole de Dieu, et tu l’honoreras comme le Seigneur ; car là où l’on parle de seigneurie[a], là est le Seigneur.
  rationale: La révision remplace « est proclamée » par « l’on parle de », afin de rendre λαλεῖται sans ajouter l’idée d’une déclaration publique. Le reste du texte est conservé, notamment le parallélisme des futurs prescriptifs et le jeu de mots entre « seigneurie » et « Seigneur ».
