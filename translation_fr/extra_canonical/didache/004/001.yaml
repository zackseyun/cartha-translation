source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
translation:
  language: fr
  text: Mon enfant, tu te souviendras nuit et jour de celui qui te dit la parole de Dieu, et tu l’honoreras comme le Seigneur ; car là où l’on parle de seigneurie[a], là est le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souveraineté » ou « autorité » ; le mot grec est apparenté à « Seigneur ».
    reason: Le substantif κυριότης est rare et peut désigner la seigneurie, la souveraineté ou l’autorité, tout en faisant écho à Κύριος.
lexical_decisions:
- source_word: Τέκνον μου
  choice: Mon enfant
  rationale: Rend directement l’adresse affectueuse et catéchétique, sans préciser le genre.
- source_word: τοῦ λαλούντός σοι
  choice: de celui qui te dit
  rationale: Conserve le sens simple et direct de λαλέω ainsi que la relation personnelle exprimée par σοι.
- source_word: τὸν λόγον τοῦ Θεοῦ
  choice: la parole de Dieu
  rationale: Expression française naturelle qui respecte le singulier λόγον et son sens religieux.
- source_word: μνησθήσῃ … τιμήσεις
  choice: tu te souviendras … tu l’honoreras
  rationale: Les deux futurs grecs ont ici une valeur prescriptive, selon un usage biblique. Les rendre parallèlement au futur préserve la structure catéchétique de l’original.
- source_word: ὡς Κύριον
  choice: comme le Seigneur
  rationale: Préserve la formulation forte et sa tension théologique, sans l’atténuer en « comme un maître ».
- source_word: ἡ κυριότης
  choice: la seigneurie
  rationale: Maintient le lien lexical avec Κύριος et l’idée abstraite de domination ou d’autorité souveraine, malgré le caractère moins courant du terme en français.
- source_word: λαλεῖται
  choice: est proclamée
  rationale: Dans ce contexte d’enseignement de la parole divine, « proclamée » exprime naturellement le fait d’être énoncée publiquement, sans préciser un agent absent du grec.
theological_decisions:
- issue: L’honneur rendu à l’enseignant « comme le Seigneur »
  choice: Conserver « comme le Seigneur »
  alternative: « comme un maître » ou « comme représentant le Seigneur »
  rationale: Le grec porte Κύριον sans article, mais l’usage du titre et la phrase explicative qui suit favorisent « le Seigneur ». Ajouter l’idée de représentation résoudrait une tension que le texte laisse implicite.
- issue: Sens de κυριότης
  choice: « la seigneurie »
  alternative: « l’autorité du Seigneur » ou « l’autorité souveraine »
  rationale: Le substantif peut désigner la domination, la souveraineté ou l’autorité. « Seigneurie » conserve au mieux le jeu de mots avec « Seigneur » et n’ajoute pas un complément absent du grec.
translation_notes:
  register: Français moderne, digne et catéchétique. Le tutoiement convient à l’adresse « Mon enfant ». Les futurs à valeur impérative sont conservés de façon cohérente. Le terme « seigneurie », légèrement marqué, est retenu pour préserver le jeu lexical central du grec et il est éclairé par une note.
