review_pass:
  verdict: revise
  source_fidelity: La structure prescriptive au futur (« tu te souviendras… tu l’honoreras »), l’adresse « Mon enfant », « la parole de Dieu » et l’écho voulu entre κυριότης et Κύριος sont bien rendus. Toutefois, λαλεῖται signifie littéralement « est dit / est objet de parole »; « est proclamée » introduit l’idée d’une proclamation publique, absente du grec.
  naturalness: Le français est globalement naturel et conserve un registre catéchétique sobre. « Seigneurie » est moins courant dans cet emploi abstrait, mais il est recevable ici puisqu’il préserve le jeu lexical central et qu’une note l’éclaire. « Là où l’on parle de seigneurie » est plus idiomatique que « la seigneurie est proclamée ».
  terminology: « le Seigneur » pour Κύριον et « seigneurie » pour κυριότης maintiennent de façon appropriée le lien terminologique grec, sans expliciter de relation doctrinale entre l’enseignant et le Seigneur.
  issues:
  - severity: medium
    issue: « est proclamée » est plus spécifique que λαλεῖται.
    rationale: Le passif λαλεῖται indique que la seigneurie est dite ou qu’on en parle; il ne précise ni proclamation ni publicité. Une formulation française impersonnelle conserve cette indétermination.
