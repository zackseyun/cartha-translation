revisions:
- from: Tu ne repousseras pas celui qui est dans le besoin, mais tu partageras tout avec ton frère et tu ne diras pas que ces biens t’appartiennent en propre. Car si vous avez part ensemble à ce qui est immortel, à combien plus forte raison devez-vous partager les biens mortels !
  to: Tu ne repousseras pas celui qui est dans le besoin, mais tu partageras toutes choses avec ton frère et tu ne diras pas qu’elles sont à toi. Car si vous avez part à ce qui est immortel, à combien plus forte raison aux réalités mortelles !
  rationale: La révision remplace les formulations qui limitaient le sens à des biens matériels par « toutes choses », « qu’elles sont à toi » et « les réalités mortelles ». Elle conserve l’ambiguïté de « ce qui est immortel » et la question finale elliptique, tout en restant naturelle en français moderne.
