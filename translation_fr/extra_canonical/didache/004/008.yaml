source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον, συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου καὶ οὐκ ἐρεῖς ἴδια εἶναι· εἰ γὰρ ἐν τῷ ἀθανάτῳ κοινωνοί ἐστε, πόσῳ μᾶλλον ἐν τοῖς θνητοῖς;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: fr
  text: Tu ne repousseras pas celui qui est dans le besoin, mais tu partageras toutes choses avec ton frère et tu ne diras pas qu’elles sont à toi. Car si vous avez part à ce qui est immortel, à combien plus forte raison aux réalités mortelles !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήσῃ
  choice: tu ne repousseras pas
  rationale: Le verbe gouverne ici directement la personne dans le besoin et exprime l’idée de la détourner ou de la renvoyer; « repousser » conserve cette force plus précisément que « se détourner de ».
- source_word: τὸν ἐνδεόμενον
  choice: celui qui est dans le besoin
  rationale: Rend naturellement le participe substantivé tout en gardant ouverte la nature précise du besoin.
- source_word: συγκοινωνήσεις
  choice: tu partageras
  rationale: Dans ce contexte de biens et de propriété, le verbe désigne une mise en commun ou un partage effectif.
- source_word: τῷ ἀδελφῷ σου
  choice: avec ton frère
  rationale: Conserve le langage familial de la communauté sans l’élargir explicitement à un sens non marqué dans le grec.
- source_word: ἴδια
  choice: ces biens t’appartiennent en propre
  rationale: Le neutre pluriel substantivé renvoie aux choses possédées; cette formulation explicite le référent et préserve l’idée de propriété personnelle.
- source_word: ἐν τῷ ἀθανάτῳ
  choice: à ce qui est immortel
  rationale: Maintient le singulier abstrait et son indétermination plutôt que de l’identifier à une réalité théologique précise.
- source_word: ἐν τοῖς θνητοῖς
  choice: les biens mortels
  rationale: Le pluriel neutre désigne vraisemblablement les réalités périssables, notamment matérielles; « biens » convient au contexte du partage tout en conservant le contraste avec l’immortel.
theological_decisions:
- issue: Référent de « ce qui est immortel »
  choice: Maintenir l’expression générale « ce qui est immortel »
  alternative: Préciser « la vie éternelle », « les réalités spirituelles » ou « le salut »
  rationale: Le texte grec ne nomme pas précisément le référent; le préciser résoudrait indûment une ambiguïté théologique réelle.
- issue: Force de la question finale
  choice: Rendre l’implication exhortative par « à combien plus forte raison devez-vous partager… ! »
  alternative: 'Conserver une question elliptique: « à combien plus forte raison dans les biens mortels ? »'
  rationale: Le grec omet le verbe dans le second membre, mais le reprend implicitement de l’idée de participation commune; l’explicitation produit un français naturel sans changer la logique de l’argument.
translation_notes:
  register: Français moderne, digne et direct. Le futur à valeur injonctive conserve la forme catéchétique des commandements. Le passage du singulier (« tu ») au pluriel (« vous ») suit exactement le grec.
