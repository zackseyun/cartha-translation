review_pass:
  verdict: revise
  source_fidelity: La structure exhortative, l’adresse au singulier suivie du pluriel, et l’indétermination de « ce qui est immortel » sont bien rendues. Toutefois, « ces biens » et « les biens mortels » restreignent indûment les neutres grecs πάντα / ἴδια et τοῖς θνητοῖς à des possessions matérielles, alors que le texte conserve une portée plus générale.
  naturalness: Le français est globalement fluide et d’un registre approprié. Une formulation plus proche de l’ellipse comparative grecque évite aussi d’ajouter explicitement « devez-vous partager ».
  terminology: « Repousser celui qui est dans le besoin » rend bien le verbe transitif et le participe substantivé. « Partager toutes choses » et « les réalités mortelles » préservent mieux l’ampleur des termes grecs que « biens ».
  issues:
  - severity: medium
    issue: Restriction de πάντα / ἴδια à des « biens »
    rationale: Le grec parle de « toutes choses » et de choses « propres », sans limiter expressément le propos à des biens matériels. Le contexte rend cette lecture possible, mais une traduction optimale ne doit pas la rendre exclusive.
  - severity: medium
    issue: Restriction de τοῖς θνητοῖς à « les biens mortels » et explicitation de « devez-vous partager »
    rationale: Le pluriel neutre désigne plus largement les réalités mortelles. La question grecque est elliptique; l’ajout d’une obligation de « partager les biens » interprète et resserre le parallèle au-delà du texte.
  revised_text: Tu ne repousseras pas celui qui est dans le besoin, mais tu partageras toutes choses avec ton frère et tu ne diras pas qu’elles sont à toi. Car si vous avez part à ce qui est immortel, à combien plus forte raison aux réalités mortelles !
