id: DID.4.9
reference: Didache 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπὸ τοῦ υἱοῦ σου ἢ ἀπὸ τῆς θυγατρός σου, ἀλλὰ ἀπὸ νεότητος διδάξεις τὸν φόβον τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/009.yaml
  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: fr
  text: Tu ne retireras pas ta main de ton fils ni de ta fille, mais dès leur jeunesse, tu leur enseigneras la crainte de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπό
  choice: Tu ne retireras pas ta main de
  rationale: Rend directement l’image grecque sans la réduire à une interprétation particulière comme « ne pas négliger » ou « ne pas corriger ».
- source_word: ἀπὸ νεότητος
  choice: dès leur jeunesse
  rationale: Exprime le point de départ temporel indiqué par ἀπό et explicite naturellement en français que la jeunesse est celle des enfants.
- source_word: διδάξεις
  choice: tu leur enseigneras
  rationale: Le complément indirect « leur » est requis par le français naturel et reprend le fils et la fille mentionnés auparavant.
- source_word: τὸν φόβον τοῦ Θεοῦ
  choice: la crainte de Dieu
  rationale: Conserve l’expression biblique traditionnelle et sa gamme de sens, qui va de la révérence à la crainte, sans l’aplatir en simple « respect ».
theological_decisions:
- issue: Sens de l’image « retirer sa main »
  choice: Conserver l’image littérale
  alternative: « Tu ne négligeras pas » ou « tu ne cesseras pas de corriger »
  rationale: Le grec ne précise pas si la main évoque principalement les soins, la direction, l’autorité ou la discipline; la traduction préserve cette ouverture.
- issue: Portée de « crainte de Dieu »
  choice: Maintenir « crainte de Dieu »
  alternative: « respect de Dieu »
  rationale: « Crainte » préserve la tension théologique de φόβος et ses connotations bibliques de révérence, d’obéissance et de conscience du jugement divin.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement singulier correspond à la deuxième personne du singulier grec. La répétition « de ton fils ni de ta fille » garde l’inclusion explicite des deux enfants, tandis que « leur » évite une lourdeur dans la seconde proposition.
