id: DID.4.7
reference: Didache 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διστάσεις δοῦναι οὐδὲ διδοὺς γογγύσεις· γνώσῃ γὰρ τίς ἐστιν ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: fr
  text: Tu n’hésiteras pas à donner et, en donnant, tu ne murmureras pas ; car tu sauras qui est le bon dispensateur de la récompense.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ διστάσεις
  choice: Tu n’hésiteras pas
  rationale: Rend directement l’interdiction au futur, forme normative courante dans ce passage, tout en conservant le sens d’hésiter ou de tergiverser.
- source_word: διδοὺς γογγύσεις
  choice: en donnant, tu ne murmureras pas
  rationale: Préserve la construction participiale et rend γογγύζω par « murmurer », terme naturel et digne exprimant le mécontentement à voix basse.
- source_word: ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης
  choice: celui qui récompense généreusement
  rationale: ἀνταποδότης désigne celui qui rend en retour ou rétribue ; καλός qualifie positivement cet agent. La formulation française évite l’expression lourde « le bon dispensateur de la récompense » sans réduire l’idée de rétribution.
theological_decisions:
- issue: Identité implicite de celui qui récompense
  choice: Conserver « celui qui » sans ajouter « Dieu »
  alternative: « Dieu, qui récompense généreusement »
  rationale: Le grec laisse l’agent non nommé. Même si le référent attendu est Dieu, l’expliciter supprimerait une implicitation authentique du texte.
- issue: Valeur de καλός dans l’expression finale
  choice: La rendre adverbialement par « généreusement »
  alternative: « le bon rémunérateur » ou « celui qui donne la juste récompense »
  rationale: Cette solution transmet la qualité positive de la rétribution dans un français naturel, sans préciser indûment qu’elle serait seulement juste ou strictement proportionnelle.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier conserve l’adresse directe du grec et s’accorde avec le style d’instruction morale de la Didachè.
