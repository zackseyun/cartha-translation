source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐκζητήσεις δὲ καθ’ ἡμέραν τὰ πρόσωπα τῶν ἁγίων, ἵνα ἐπαναπαῇ τοῖς λόγοις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: fr
  text: Chaque jour, tu rechercheras la présence des saints, afin de trouver du repos dans leurs paroles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκζητήσεις
  choice: tu rechercheras
  rationale: Le verbe exprime une recherche volontaire et assidue; le futur français conserve la forme prescriptive du grec.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Rendu idiomatique et direct de la fréquence quotidienne.
- source_word: τὰ πρόσωπα τῶν ἁγίων
  choice: la présence des saints
  rationale: Littéralement «les visages des saints», l’expression désigne ici leur présence personnelle ou leur fréquentation. «La présence» est naturel en français sans réduire les saints à leurs seuls enseignements.
- source_word: ἐπαναπαῇ
  choice: trouver du repos
  rationale: Le verbe évoque le fait de se reposer sur ou auprès de quelque chose; cette formulation préserve l’image sans imposer le sens plus interprétatif de «puiser du réconfort».
- source_word: τοῖς λόγοις αὐτῶν
  choice: dans leurs paroles
  rationale: «Paroles» rend λόγοις dans son sens ordinaire et «dans» exprime naturellement en français la sphère où le repos est trouvé.
theological_decisions:
- issue: Identité de «τῶν ἁγίων»
  choice: des saints
  alternative: des fidèles / des personnes saintes
  rationale: Le rendu traditionnel et formel «saints» conserve l’appellation communautaire ancienne sans préciser indûment leur statut ni leur fonction.
- issue: Nature du repos trouvé dans les paroles
  choice: trouver du repos dans leurs paroles
  alternative: être affermi par leurs paroles / trouver du réconfort dans leurs paroles
  rationale: Le texte garde ouverte la nuance de repos, de soutien ou de réconfort, au lieu de la résoudre théologiquement.
translation_notes:
  register: Français international moderne, simple et digne. Tutoiement singulier maintenu pour refléter la deuxième personne du singulier grec et le style d’exhortation directe. Aucun marqueur de note n’est requis.
