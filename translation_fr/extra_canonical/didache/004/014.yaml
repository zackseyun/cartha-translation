id: DID.4.14
reference: Didache 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: fr
  text: Dans l’assemblée, tu confesseras tes fautes, et tu ne viendras pas à la prière avec une mauvaise conscience. Tel est le chemin de la vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assemblée
  rationale: Le terme désigne ici la communauté réunie. « Assemblée » conserve ce sens concret sans imposer le sens institutionnel que peut prendre « Église ».
- source_word: ἐξομολογήσῃ
  choice: tu confesseras
  rationale: Le verbe exprime l’aveu ou la reconnaissance ouverte des fautes; « confesser » convient au contexte communautaire et religieux.
- source_word: παραπτώματά
  choice: fautes
  rationale: Le mot évoque des manquements ou transgressions. « Fautes » est naturel en français moderne et n’alourdit pas la phrase.
- source_word: προσευχήν
  choice: la prière
  rationale: Le grec ne porte pas de possessif. En français, « venir à la prière » désigne naturellement l’acte ou le moment communautaire de prière.
- source_word: συνειδήσει πονηρᾷ
  choice: une mauvaise conscience
  rationale: Traduction directe qui préserve la dimension morale de πονηρός sans préciser davantage la nature de la culpabilité.
- source_word: ἡ ὁδὸς τῆς ζωῆς
  choice: le chemin de la vie
  rationale: Cette formulation conserve l’image directrice des deux chemins propre à la Didachè.
theological_decisions:
- issue: Cadre de la confession
  choice: « Dans l’assemblée » sans préciser à qui les fautes sont confessées
  alternative: « Devant l’assemblée » ou « dans l’Église »
  rationale: Le grec indique le cadre communautaire, mais ne définit ni le destinataire exact ni une forme institutionnelle de confession; la traduction maintient cette ouverture.
- issue: Rapport entre conscience et prière
  choice: « avec une mauvaise conscience »
  alternative: « avec une conscience coupable »
  rationale: « Coupable » interpréterait plus précisément l’état intérieur, tandis que le grec emploie le terme plus large πονηρός, « mauvais ».
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier suit les formes grecques à la deuxième personne du singulier et l’adresse parénétique du passage. « Tel est » donne une conclusion naturelle tout en restant proche du grec.
