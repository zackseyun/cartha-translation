id: DID.4.13
reference: Didache 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: fr
  text: Tu n’abandonneras jamais les commandements du Seigneur, mais tu garderas ce que tu as reçu, sans rien ajouter ni rien retrancher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  choice: Tu n’abandonneras jamais
  rationale: La double négation οὐ μή avec le subjonctif exprime une interdiction fortement appuyée; « jamais » en restitue naturellement la force en français.
- source_word: ἐντολὰς Κυρίου
  choice: les commandements du Seigneur
  rationale: Rendu direct qui conserve le pluriel et le titre Κυρίου sans préciser davantage le référent.
- source_word: φυλάξεις
  choice: tu garderas
  rationale: Le verbe φυλάσσω désigne ici l’observance fidèle de ce qui a été transmis; « garder » préserve à la fois l’idée de conservation et celle de mise en pratique.
- source_word: ἃ παρέλαβες
  choice: ce que tu as reçu
  rationale: Traduction formellement proche qui maintient l’idée d’une tradition ou d’un enseignement reçu sans en expliciter indûment le contenu.
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  choice: sans rien ajouter ni rien retrancher
  rationale: Cette formulation française naturelle conserve la symétrie des deux participes et l’interdiction de modifier le dépôt reçu.
theological_decisions:
- issue: Nature de « ce que tu as reçu »
  choice: Maintenir la formulation générale
  alternative: Préciser « l’enseignement » ou « la tradition » que tu as reçu
  rationale: Le grec emploie un relatif neutre sans nom explicite; préciser son contenu résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Tutoiement singulier conforme aux formes grecques de deuxième personne du singulier. Registre moderne, digne et accessible; formulation resserrée sans archaïsmes.
