  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
translation:
  language: fr
  text: Ne sois pas de ceux qui tendent les mains pour recevoir, mais les replient quand il s’agit de donner.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνου
  choice: Ne sois pas de ceux qui
  rationale: Rend naturellement l’interdiction de devenir ou de se montrer comme une personne caractérisée par la conduite décrite.
- source_word: ἐκτείνων τὰς χεῖρας
  choice: qui tendent les mains
  rationale: Conserve l’image concrète et le pluriel grec « les mains ».
- source_word: συσπῶν
  choice: les replient
  rationale: Exprime le mouvement inverse de « tendre », celui de ramener ou resserrer les mains, et laisse le contraste indiquer le refus de donner.
- source_word: πρὸς μὲν τὸ λαβεῖν … πρὸς δὲ τὸ δοῦναι
  choice: pour recevoir … quand il s’agit de donner
  rationale: Restitue le parallélisme tout en produisant une formulation idiomatique en français moderne.
