source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διψυχήσεις, πότερον ἔσται ἢ οὔ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/004.yaml
  text: You shall not be double-minded whether it will be or not[a].
translation:
  language: fr
  text: Tu ne seras pas partagé intérieurement quant à savoir si cela sera ou non[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si cela sera ou non » ; le grec ne précise pas ce qui doit être.'
    reason: Le sujet de ἔσται est implicite. « Cela » sert seulement à rendre la construction française et ne désigne aucun référent précisé par le texte grec.
lexical_decisions:
- source_word: διψυχήσεις
  choice: tu ne seras pas partagé intérieurement
  rationale: Le verbe évoque littéralement le fait d’être « partagé en deux » et, dans ce contexte, l’hésitation ou le doute. Cette formulation française conserve l’image de la division intérieure tout en restant intelligible.
- source_word: πότερον … ἢ οὔ
  choice: si … ou non
  rationale: Cette tournure rend directement l’interrogation indirecte alternative du grec.
- source_word: ἔσται
  choice: cela arrivera
  rationale: Le futur de εἰμί signifie ici « ce sera / cela aura lieu ». « Cela arrivera » est naturel en français, sans préciser le référent que le grec laisse implicite.
theological_decisions:
- issue: Nature de l’hésitation interdite
  choice: Conserver l’idée d’une division intérieure sans préciser l’objet implicite de la foi ou de l’attente
  alternative: Traduire simplement par « Tu ne douteras pas » ou expliciter ce qui doit arriver
  rationale: Le grec emploie un terme marqué évoquant l’esprit partagé, mais ne nomme ni l’événement attendu ni une doctrine particulière. La traduction préserve donc cette tension et cette indétermination.
translation_notes:
  register: Tutoiement normatif conforme au style d’une instruction morale. Français moderne, sobre et digne ; « partagé intérieurement » préserve l’image grecque tout en évitant une formulation artificielle comme « avoir une âme double ».
