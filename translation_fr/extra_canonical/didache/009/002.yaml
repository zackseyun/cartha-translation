id: DID.9.2
reference: Didache 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πρῶτον περὶ τοῦ ποτηρίου· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ἁγίας ἀμπέλου Δαβὶδ τοῦ παιδός σου, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: fr
  text: 'D’abord, au sujet de la coupe :


    Nous te rendons grâce, notre Père,

    pour la sainte vigne de David, ton serviteur,

    que tu nous as fait connaître par Jésus, ton serviteur.

    À toi la gloire pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν
  choice: Nous te rendons grâce
  rationale: Rend naturellement le sens de remercier ou exprimer sa reconnaissance, tout en conservant le registre liturgique du passage.
- source_word: ἡ ἁγία ἄμπελος Δαβὶδ
  choice: la sainte vigne de David
  rationale: Conserve l’image grecque de la vigne et son lien explicite avec David sans en préciser davantage la portée symbolique.
- source_word: παῖς
  choice: serviteur
  rationale: Dans cette prière, le terme peut désigner un serviteur et porte aussi des résonances scripturaires. « Serviteur » convient à David comme à Jésus et préserve leur désignation parallèle.
- source_word: ἐγνώρισας
  choice: tu nous as fait connaître
  rationale: 'Reproduit le causatif du grec : Dieu a révélé ou porté cette réalité à la connaissance de la communauté.'
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française actuelle et digne correspondant à la formule doxologique grecque.
theological_decisions:
- issue: Sens de « la sainte vigne de David »
  choice: Maintenir l’image sans l’identifier explicitement au vin, à Israël, au royaume ou au Messie.
  alternative: Traduire ou développer l’expression comme une référence explicite à l’une de ces réalités.
  rationale: Le grec formule une image symbolique sans en donner ici l’interprétation; la traduction doit préserver cette ouverture.
- issue: Traduction de παῖς appliqué à David et à Jésus
  choice: Employer « serviteur » dans les deux cas.
  alternative: Employer « enfant » ou « fils », notamment pour Jésus.
  rationale: La répétition du même mot grec crée un parallèle intentionnel. « Serviteur » fonctionne naturellement pour David et Jésus et n’ajoute pas au texte une affirmation filiale absente de ce verset.
- issue: Référent du pronom relatif ἧς
  choice: Rendre le féminin par « que », renvoyant à « la sainte vigne ».
  alternative: Reformuler de manière à faire connaître David lui-même ou une interprétation de la vigne.
  rationale: L’accord féminin singulier rattache grammaticalement le relatif à ἄμπελος, « vigne ».
translation_notes:
  register: Français international moderne, sobre et liturgique. Le tutoiement suit l’adresse directe à Dieu et permet une formulation fluide. La mise en vers préserve la cadence priante du texte, sans ajouter d’explication interprétative.
