source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδεὶς δὲ φαγέτω μηδὲ πιέτω ἀπὸ τῆς εὐχαριστίας ὑμῶν, ἀλλ' οἱ βαπτισθέντες εἰς ὄνομα Κυρίου· καὶ γὰρ περὶ τούτου εἴρηκεν ὁ Κύριος· Μὴ δῶτε τὸ ἅγιον τοῖς κυσί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: fr
  text: 'Mais que personne ne mange ni ne boive de votre action de grâce, sauf ceux qui ont été baptisés au nom du Seigneur. Car c’est aussi à ce sujet que le Seigneur a dit : « Ne donnez pas ce qui est saint aux chiens. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστίας
  choice: action de grâce
  rationale: Conserve le sens premier de remerciement tout en laissant perceptible l’emploi communautaire et cultuel du terme dans ce contexte.
- source_word: ἀπὸ
  choice: de
  rationale: Rend naturellement en français l’idée de prendre part à la nourriture et à la boisson provenant de l’action de grâce communautaire.
- source_word: βαπτισθέντες εἰς ὄνομα Κυρίου
  choice: baptisés au nom du Seigneur
  rationale: Formulation française naturelle qui préserve le lien explicite entre le baptême et le nom du Seigneur sans préciser davantage l’identité ou la formule baptismale.
- source_word: τὸ ἅγιον
  choice: ce qui est saint
  rationale: Maintient la substantivation et l’indétermination du grec, sans réduire l’expression à un objet cultuel particulier.
theological_decisions:
- issue: Sens de εὐχαριστία
  choice: action de grâce
  alternative: eucharistie
  rationale: Le contexte peut viser le repas eucharistique, mais le mot garde son sens lexical d’action de grâce. La traduction choisie préserve cette double portée sans imposer une terminologie confessionnelle ultérieure.
- issue: Portée de l’exigence baptismale
  choice: sauf ceux qui ont été baptisés au nom du Seigneur
  alternative: à moins d’avoir été baptisé au nom du Seigneur
  rationale: La formulation collective suit le pluriel grec et énonce la condition d’admission sans développer une doctrine sacramentelle absente du texte.
- issue: Application de la parole du Seigneur
  choice: c’est aussi à ce sujet
  alternative: à ce propos également
  rationale: Reproduit explicitement l’application de la parole sur « ce qui est saint » à l’action de grâce, sans tenter de résoudre la tension créée par l’image des chiens.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe injonctive du grec est conservée sans lourdeur. La citation finale suit une formulation biblique naturelle, tout en maintenant l’expression ouverte « ce qui est saint ».
