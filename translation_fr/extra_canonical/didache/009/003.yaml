source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ κλάσματος· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ζωῆς καὶ γνώσεως, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: fr
  text: 'Au sujet du pain rompu :


    Nous te rendons grâce, notre Père,


    pour la vie et pour la connaissance


    que tu nous as fait connaître par Jésus, ton serviteur.


    À toi la gloire pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσματος
  choice: pain rompu
  rationale: Le nom désigne littéralement ce qui a été rompu, ici le pain eucharistique; « pain rompu » rend clairement le référent sans employer un terme français obscur.
- source_word: Εὐχαριστοῦμέν
  choice: Nous te rendons grâce
  rationale: Formule française naturelle et digne qui conserve le sens d’action de grâce du verbe grec.
- source_word: γνώσεως
  choice: connaissance
  rationale: Équivalent direct qui préserve la portée ouverte du terme grec, sans la réduire à un savoir intellectuel ni l’expliciter comme révélation.
- source_word: παιδός
  choice: serviteur
  rationale: παῖς peut signifier « enfant/fils » ou « serviteur »; dans cette formule, « serviteur » correspond à l’usage biblique et ancien de l’expression tout en évitant de trancher vers une formulation filiale absente du terme lui-même.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression idiomatique moderne qui restitue la durée indéfinie de la formule grecque.
theological_decisions:
- issue: Sens de παῖς appliqué à Jésus
  choice: serviteur
  alternative: enfant / fils
  rationale: Le grec demeure lexicalement ambigu, mais « serviteur » convient au registre de la prière et aux échos scripturaires du Serviteur; une note n’est pas indispensable dans ce bref texte, puisque « fils » imposerait une précision que le mot grec ne porte pas explicitement.
- issue: Nature de la vie et de la connaissance
  choice: Conserver les termes sans complément explicatif
  alternative: la vie éternelle et la connaissance de Dieu
  rationale: Le grec ne fournit aucun qualificatif; la traduction préserve donc l’ouverture théologique de la formule.
translation_notes:
  register: Français international moderne, simple et liturgique. La disposition en lignes conserve le rythme de la prière. Le démonstratif implicite de κλάσμα est explicité par « pain » pour une compréhension immédiate, conformément au contexte.
