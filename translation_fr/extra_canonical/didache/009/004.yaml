    issue: Ordre des mots dans l’exhortation-prière comparative
    rationale: Après « De même que… », le français moderne emploie plus naturellement « ainsi, que ton Église soit rassemblée… » que « qu’ainsi ton Église soit… ». Cette correction améliore la fluidité sans modifier le sens ni la structure grecque.
