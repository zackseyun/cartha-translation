id: DID.9.4
reference: Didache 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
translation:
  language: fr
  text: De même que ce morceau de pain était dispersé sur les montagnes et que, une fois rassemblé, il est devenu un, ainsi, que ton Église soit rassemblée des confins de la terre dans ton royaume. Car c’est à toi qu’appartiennent la gloire et la puissance, par Jésus-Christ, pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσμα
  choice: morceau de pain
  rationale: Le nom désigne littéralement un morceau détaché ou rompu. Dans le contexte immédiat de la prière sur le pain rompu, « morceau de pain » explicite naturellement le référent sans effacer l’image du fragment dispersé puis réuni.
- source_word: ἐκκλησία
  choice: Église
  rationale: Dans ce contexte chrétien, le terme désigne la communauté appartenant à Dieu dans son ensemble. « Église » est naturel en français et conserve cette portée communautaire et théologique.
- source_word: τῶν περάτων τῆς γῆς
  choice: des confins de la terre
  rationale: Cette tournure française rend l’idée des limites ou extrémités les plus lointaines du monde habité tout en gardant le registre de la prière.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: La formule idiomatique exprime une durée sans fin. « Pour toujours » est clair, actuel et digne en français moderne.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: Dans cette formule chrétienne ancienne, Χριστός fonctionne vraisemblablement comme un titre fixé étroitement associé au nom de Jésus. « Jésus-Christ » est la formulation française la plus naturelle et n’ajoute pas l’article absent du grec.
- issue: Rassemblement de l’Église εἰς τὴν σὴν βασιλείαν
  choice: dans ton royaume
  alternative: en vue de ton royaume
  rationale: La traduction conserve le mouvement exprimé par εἰς sans préciser davantage si l’accent porte sur l’entrée, la destination eschatologique ou l’intégration au royaume.
translation_notes:
  register: Français international moderne, clair et liturgique sans archaïsmes. La structure comparative et l’image paradoxale du morceau de pain dispersé sur les montagnes puis réuni sont conservées, sans chercher à les rationaliser.
