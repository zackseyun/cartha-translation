- source_word: οὕτως
  choice: ainsi
  rationale: Rend naturellement la manière prescrite et introduit les formules qui suivent.
- source_word: δὲ
  choice: quant à
  rationale: Marque la transition vers un nouveau sujet sans ajouter une valeur temporelle absente du grec.
theological_decisions:
- issue: Sens de εὐχαριστία
  choice: action de grâce
  alternative: eucharistie
  rationale: Le grec peut évoquer le repas eucharistique dans ce contexte, mais le nom reste lexicalement lié au fait de rendre grâce. « Action de grâce » préserve ce lien et l’ambiguïté sans imposer d’emblée un terme liturgique technique.
