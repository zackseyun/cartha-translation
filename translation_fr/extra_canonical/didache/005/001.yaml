id: DID.5.1
reference: Didache 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
translation:
  language: fr
  text: 'Mais voici le chemin de la mort : avant tout, il est mauvais et rempli de malédiction[a] : meurtres, adultères, convoitises, inconduites sexuelles, vols, idolâtries, pratiques magiques, pratiques de sorcellerie[b], rapines, faux témoignages, hypocrisies, duplicité de cœur, tromperie, orgueil, méchanceté, entêtement, avidité, paroles obscènes, jalousie, insolence, hauteur, vantardise ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rempli de paroles de malédiction ».'
    reason: κατάρας peut désigner la malédiction ou les malédictions proférées; la note explicite cette nuance sans transformer directement la construction en « voie maudite ».
  - marker: b
    text: Le terme grec peut désigner des pratiques de sorcellerie ou l'emploi de drogues, de poisons et d'autres substances; son sens exact reste large.
    reason: φαρμακεῖαι a un champ sémantique historique étendu. La note conserve l'ambiguïté tout en distinguant ce terme de μαγεῖαι (« pratiques magiques »).
lexical_decisions:
- source_word: κατάρας
  choice: malédiction
  rationale: Le génitif singulier désigne la malédiction ou le fait de maudire; « rempli de malédiction » conserve la formulation dense du grec.
- source_word: ἐπιθυμίαι
  choice: convoitises
  rationale: Le pluriel désigne ici, dans une liste de vices, des désirs mauvais ou déréglés sans les réduire au seul domaine sexuel.
- source_word: πορνεῖαι
  choice: inconduites sexuelles
  rationale: Expression actuelle et suffisamment large pour le pluriel πορνεῖαι, qui désigne diverses conduites sexuelles illicites.
- source_word: μαγεῖαι
  choice: pratiques magiques
  rationale: Rend clairement les actes de magie au pluriel et les distingue du terme suivant.
- source_word: φαρμακεῖαι
  choice: préparations de drogues
  rationale: Le mot peut viser l'usage ou la préparation de substances, souvent dans un contexte magique; cette traduction préserve la distinction avec μαγεῖαι sans imposer une seule interprétation.
- source_word: ἁρπαγαί
  choice: rapines
  rationale: Désigne des prises violentes, extorsions ou actes de pillage, plus précisément que de simples vols.
- source_word: διπλοκαρδία
  choice: duplicité de cœur
  rationale: Conserve l'image grecque du cœur partagé ou double tout en restant intelligible en français.
- source_word: αὐθάδεια
  choice: entêtement
  rationale: Exprime l'attitude de celui qui n'en fait qu'à sa tête, avec une nuance d'obstination arrogante.
- source_word: θρασύτης
  choice: insolence
  rationale: Rend l'audace effrontée et négative impliquée par le terme dans cette liste.
- source_word: ὕψος
  choice: hauteur
  rationale: Maintient la métaphore de l'élévation orgueilleuse, distincte de l'orgueil et de la vantardise déjà mentionnés.
- source_word: ἀλαζονεία
  choice: vantardise
  rationale: Désigne la prétention et l'ostentation; « vantardise » la distingue des termes voisins relatifs à l'orgueil.
theological_decisions:
- issue: Sens de κατάρας
  choice: rempli de malédiction
  alternative: rempli de malédictions / rempli de paroles de malédiction
  rationale: Le singulier grec peut décrire soit l'état maudit de cette voie, soit la malédiction qui la remplit. Le texte principal conserve cette tension et une note signale l'autre lecture.
- issue: Rapport entre μαγεῖαι et φαρμακεῖαι
  choice: pratiques magiques, préparations de drogues
  alternative: sorcelleries, enchantements
  rationale: Le grec juxtapose deux termes distincts. La traduction évite de les confondre, tout en signalant en note que φαρμακεῖαι peut avoir une portée magique ou liée aux poisons.
translation_notes:
  register: Français international moderne, digne et direct. La structure en liste ainsi que les pluriels du grec sont largement conservés. Quelques équivalents courants mais précis (« inconduites sexuelles », « pratiques magiques ») favorisent la compréhension, tandis que « rapines » et « duplicité de cœur » gardent la force et l'imagerie du texte source.
