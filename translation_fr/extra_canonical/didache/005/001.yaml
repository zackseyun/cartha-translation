  source_fidelity: La liste et son ordre suivent fidèlement le grec. « Préparations de drogues » restreint toutefois φαρμακεῖαι à une activité de préparation qui n'est pas exprimée par le nom grec; il peut désigner des pratiques de sorcellerie, ainsi que l'emploi de drogues ou de poisons. Une formulation plus large est préférable. La note sur κατάρας va au-delà de ce que le génitif « plein de malédiction » impose en proposant directement « une voie maudite ».
  naturalness: Le français est globalement naturel, direct et adapté au registre. « Pratiques de sorcellerie » est plus idiomatique et plus fidèle que « préparations de drogues » dans cette liste de vices.
  terminology: « Convoitises », « inconduites sexuelles », « rapines », « duplicité de cœur », « insolence », « hauteur » et « vantardise » rendent de manière satisfaisante les termes grecs et maintiennent leurs distinctions. La révision maintient la distinction entre μαγεῖαι et φαρμακεῖαι sans donner à ce dernier un sens moderne étroit de consommation ou fabrication de drogues.
