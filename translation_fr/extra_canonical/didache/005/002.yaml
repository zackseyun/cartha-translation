id: DID.5.2
reference: Didache 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
translation:
  language: fr
  text: persécuteurs des gens de bien, haïssant la vérité, aimant le mensonge, ne connaissant pas la récompense de la justice, ne s’attachant ni au bien ni à un jugement juste, veillant non pour le bien, mais pour le mal ; étrangers à la douceur et à la patience, aimant ce qui est vain, recherchant une contrepartie, sans pitié pour le pauvre, ne compatissant pas à la souffrance de l’opprimé[a], ne connaissant pas celui qui les a faits, meurtriers d’enfants, destructeurs de ce que Dieu a façonné, se détournant de celui qui est dans le besoin, accablant celui qui est dans la détresse, défenseurs des riches, juges iniques des pauvres, pécheurs en tout. Enfants, puissiez-vous être délivrés de toutes ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne prenant pas à cœur le sort de l’opprimé » ; plus littéralement, le verbe peut exprimer le fait d’éprouver de la peine à son sujet.
    reason: Le sens contextuel de πονέω avec ἐπί et le datif relève ici de la compassion ou de la peine ressentie, mais plusieurs formulations françaises peuvent en rendre la nuance.
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  choice: persécuteurs des gens de bien
  rationale: Le génitif pluriel ἀγαθῶν peut désigner des personnes bonnes ; « gens de bien » exprime naturellement cette lecture en français sans réduire l’expression à la persécution d’une abstraction.
- source_word: μισθὸν δικαιοσύνης
  choice: la récompense de la justice
  rationale: Rend directement μισθός et δικαιοσύνη, tout en conservant l’idée d’une récompense associée à la conduite juste.
- source_word: ἀγρυπνοῦντες
  choice: veillant
  rationale: Conserve l’image de rester éveillé ou vigilant en vue de quelque chose.
- source_word: ὧν μακρὰν πραΰτης καὶ ὑπομονή
  choice: étrangers à la douceur et à la patience
  rationale: Formulation française naturelle pour dire que douceur et patience sont loin d’eux, sans modifier le sens moral.
- source_word: διώκοντες ἀνταπόδομα
  choice: recherchant une contrepartie
  rationale: ἀνταπόδομα désigne ce qui est rendu en retour, une rétribution ou contrepartie ; cette traduction garde la nuance intéressée sans préciser indûment s’il s’agit d’un remboursement financier.
- source_word: οὐ πονοῦντες ἐπὶ καταπονουμένῳ
  choice: ne compatissant pas à la souffrance de l’opprimé
  rationale: Dans cette construction, πονέω exprime la peine éprouvée devant le sort d’autrui ; « compatir à la souffrance » s’accorde aussi avec le parallèle sur l’absence de pitié.
- source_word: φθορεῖς πλάσματος Θεοῦ
  choice: destructeurs de ce que Dieu a façonné
  rationale: πλάσμα désigne ce qui a été formé ou façonné. Cette formulation préserve l’image du Créateur et le lien immédiat avec les enfants.
- source_word: πλουσίων παράκλητοι
  choice: défenseurs des riches
  rationale: παράκλητος peut désigner celui qui intervient ou plaide en faveur de quelqu’un ; « défenseurs » convient au contexte judiciaire qui suit.
- source_word: πανθαμάρτητοι
  choice: pécheurs en tout
  rationale: Rend le composé intensif comme une caractérisation globale de leur conduite, sans l’alourdir.
- source_word: ῥυσθείητε
  choice: Puissiez-vous […] être délivrés
  rationale: L’optatif aoriste passif exprime ici un souhait ou une exhortation sous forme de souhait ; cette tournure française en conserve la force.
theological_decisions:
- issue: Portée de « meurtriers d’enfants, destructeurs de ce que Dieu a façonné »
  choice: Maintenir les deux désignations parallèles sans explicitation doctrinale supplémentaire
  alternative: Identifier explicitement une pratique particulière ou limiter « ce que Dieu a façonné » aux enfants
  rationale: Le grec établit un parallèle fort, mais le verset ne développe pas lui-même toute la portée de ces expressions ; la traduction ne doit pas imposer une interprétation confessionnelle ou historique plus précise.
- issue: Sens de « récompense de la justice »
  choice: Conserver la formulation ouverte
  alternative: Préciser qu’il s’agit d’une récompense divine ou eschatologique
  rationale: Le contexte peut suggérer une rétribution divine, mais le grec ne l’explicite pas ici.
- issue: Agent implicite de la délivrance finale
  choice: Employer un passif sans nommer l’agent
  alternative: Traduire « Que Dieu vous délivre »
  rationale: Le passif grec ne nomme pas explicitement Dieu comme agent ; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La longue série participiale du grec est conservée pour garder le rythme de la dénonciation, avec une ponctuation qui facilite la lecture. Le tutoiement pluriel implicite de τέκνα est rendu par « mes enfants », formule naturelle d’adresse pédagogique ; « gens de bien » évite l’ambiguïté française de « persécuteurs du bien ».
