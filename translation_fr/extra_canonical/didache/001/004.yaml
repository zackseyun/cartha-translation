  to: Tiens-toi à l’écart des désirs charnels et mondains. Si quelqu’un te frappe sur la joue droite, tends-lui aussi l’autre, et tu seras parfait. Si quelqu’un te réquisitionne pour parcourir un mille[a], fais-en deux avec lui. Si quelqu’un t’enlève ton manteau, donne-lui aussi ta tunique. Si quelqu’un te prend ce qui t’appartient, ne le réclame pas ; car tu ne le peux pas.
