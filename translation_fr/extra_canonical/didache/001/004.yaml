  source_fidelity: 'Le texte rend fidèlement la succession des impératifs et les distinctions importantes du grec : désirs « charnels et mondains », joue droite et l’autre joue, service imposé pour un mille, manteau et tunique, et finale volontairement elliptique. « Te réquisitionne » restitue bien ἀγγαρεύσῃ. Une légère révision est nécessaire pour rendre γάρ par « car », plutôt que par « d’ailleurs », qui affaiblit le lien explicatif grec.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Pour faire un mille » est compréhensible, mais « pour parcourir un mille » est plus idiomatique tout en explicitant seulement le mouvement impliqué par le contexte. « Car tu ne le peux pas » conserve l’ellipse de l’objet de δύνασαι.
  terminology: « Désirs charnels et mondains », « parfait », « manteau » et « tunique » sont des choix recevables et cohérents avec le grec. La note sur la réquisition et le mille romain est factuelle, pertinente et correctement ancrée.
