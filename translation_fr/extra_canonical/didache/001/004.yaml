id: DID.1.4
reference: Didache 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
translation:
  language: fr
  text: Tiens-toi à l’écart des désirs charnels et mondains. Si quelqu’un te frappe sur la joue droite, tends-lui aussi l’autre, et tu seras parfait. Si quelqu’un te réquisitionne pour parcourir un mille[a], fais-en deux avec lui. Si quelqu’un t’enlève ton manteau, donne-lui aussi ta tunique. Si quelqu’un te prend ce qui t’appartient, ne le réclame pas ; car tu ne le peux pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec désigne le fait de réquisitionner quelqu’un pour un service. Un mille romain correspondait à environ 1,5 kilomètre.
    reason: Éclaire le contexte historique de la contrainte et la mesure de distance sans alourdir le texte principal.
lexical_decisions:
- source_word: Ἀπέχου
  choice: Tiens-toi à l’écart
  rationale: Rend naturellement en français l’impératif moyen exprimant l’abstention ou l’éloignement volontaire.
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  choice: des désirs charnels et mondains
  rationale: Conserve les deux qualificatifs distincts et leur portée morale sans les paraphraser selon une doctrine particulière.
- source_word: ῥάπισμα
  choice: frappe
  rationale: Le terme désigne un coup ou une gifle ; « frappe » préserve cette amplitude tout en restant idiomatique avec la joue.
- source_word: τέλειος
  choice: parfait
  rationale: Équivalent direct qui maintient la force et la tension éthique du grec, plutôt que de l’atténuer en « mûr » ou « accompli ».
- source_word: ἀγγαρεύσῃ
  choice: te réquisitionne
  rationale: Le verbe évoque le fait de contraindre quelqu’un à un service, notamment au transport ; « réquisitionner » conserve cette nuance historique de contrainte.
- source_word: ἱμάτιον / χιτών
  choice: manteau / tunique
  rationale: Préserve la distinction entre le vêtement extérieur et le vêtement porté dessous.
- source_word: μὴ ἀπαίτει
  choice: ne le réclame pas
  rationale: Rend l’interdiction d’exiger la restitution sans ajouter explicitement « en retour », absent du texte grec.
- source_word: οὐδὲ γὰρ δύνασαι
  choice: d’ailleurs, tu ne le peux pas
  rationale: Conserve la conclusion abrupte et énigmatique du grec, sans préciser ce que recouvre cette impossibilité.
theological_decisions:
- issue: Portée de τέλειος
  choice: « parfait »
  alternative: « accompli » ou « mûr »
  rationale: Le texte formule une exigence forte ; traduire littéralement évite de résoudre la question théologique de la perfection demandée.
- issue: Sens de l’impossibilité finale
  choice: « d’ailleurs, tu ne le peux pas »
  alternative: « car tu ne peux pas le reprendre »
  rationale: Le complément de δύνασαι n’est pas exprimé. La traduction retenue préserve cette ambiguïté au lieu d’identifier l’action supposément impossible.
translation_notes:
  register: Français moderne, direct et digne, avec tutoiement conforme aux impératifs grecs au singulier. La syntaxe parallèle est conservée pour restituer le rythme de l’exhortation.
