review_pass:
  verdict: revise
  source_fidelity: La formulation « qu’on te fasse » restreint γίνεσθαί σοι à un acte commis par un agent, alors que le grec exprime plus largement ce qui peut « arriver » à quelqu’un. La note identifie correctement cet écart, mais une traduction principale non restrictive est possible et préférable. « Ne le fais pas non plus à autrui » rend naturellement la prohibition et conserve la valeur ajoutée de καὶ σύ.
  naturalness: Le texte est globalement clair, moderne et bien rythmé. « Tout ce que tu ne voudrais pas qu’il t’arrive » est une tournure française idiomatique qui évite l’agentivité ajoutée de « qu’on te fasse ».
  terminology: « Chemin de la vie », « Dieu », « ton prochain » et « à autrui » conviennent au registre et au vocabulaire établis. Le futur prescriptif « tu aimeras » est fidèle et naturel.
  issues:
  - severity: medium
    issue: Restriction indue de γίνεσθαί σοι par « qu’on te fasse »
    rationale: Le grec signifie littéralement que quelque chose « arrive à toi » et ne précise pas nécessairement qu’un agent humain le fait. Puisque le français peut conserver cette portée large dans le texte, il vaut mieux ne pas dépendre d’une note pour rétablir une nuance essentielle.
  revised_text: 'Voici donc le chemin de la vie : premièrement, tu aimeras Dieu, qui t’a créé ; deuxièmement, ton prochain comme toi-même. Et tout ce que tu ne voudrais pas qu’il t’arrive, ne le fais pas non plus à autrui.'
