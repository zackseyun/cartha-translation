id: DID.1.2
reference: Didache 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς ἐστιν αὕτη· πρῶτον, ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε· δεύτερον, τὸν πλησίον σου ὡς σεαυτόν· πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι, καὶ σὺ ἄλλῳ μὴ ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'This is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
translation:
  language: fr
  text: 'Voici donc le chemin de la vie : premièrement, tu aimeras Dieu, qui t’a créé ; deuxièmement, ton prochain comme toi-même. Et tout ce que tu ne voudrais pas qu’il t’arrive, ne le fais pas non plus à autrui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδὸς τῆς ζωῆς
  choice: le chemin de la vie
  rationale: Rend directement la métaphore grecque tout en restant idiomatique et digne en français moderne.
- source_word: ἀγαπήσεις
  choice: tu aimeras
  rationale: Le futur français conserve la forme grecque à valeur prescriptive, familière dans l’énoncé des commandements.
- source_word: τὸν ποιήσαντά σε
  choice: qui t’a créé
  rationale: Dans ce contexte théologique, « créer » exprime naturellement l’action de Dieu désignée par ποιέω, plutôt que le plus littéral mais moins naturel « qui t’a fait ».
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: Équivalent français établi, clair et fidèle pour désigner l’autre humain envers qui s’exerce l’amour.
- source_word: καὶ σὺ … μὴ ποίει
  choice: toi non plus, ne le fais pas
  rationale: Conserve l’insistance portée par καὶ σύ et formule naturellement en français la réciprocité négative.
- source_word: ἄλλῳ
  choice: à autrui
  rationale: Rend le datif indéfini « à un autre » par une expression française concise et générale.
theological_decisions:
- issue: Ellipse après « deuxièmement »
  choice: deuxièmement, ton prochain comme toi-même
  alternative: deuxièmement, tu aimeras ton prochain comme toi-même
  rationale: Le grec omet le verbe dans le second membre. L’ellipse demeure intelligible en français et préserve la structure resserrée de la source.
- issue: Sens de γίνεσθαί σοι dans la règle d’or
  choice: qu’on te fasse
  alternative: qu’il t’arrive
  rationale: Le grec peut littéralement évoquer ce qui « arrive » à quelqu’un, mais le parallèle avec « ne le fais pas à autrui » favorise ici le sens d’un acte subi. Une note conserve la formulation plus littérale et l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes grecques de deuxième personne et convient au style sapientiel et prescriptif. « Voici donc » rend la transition μὲν οὖν sans ajouter une indication temporelle absente du grec.
