source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: fr
  text: 'Or, l’enseignement de ces paroles est le suivant : bénissez ceux qui vous maudissent, priez pour vos ennemis et jeûnez pour ceux qui vous persécutent. Car quel mérite y a-t-il si vous aimez ceux qui vous aiment ? Les païens ne font-ils pas de même ? Mais vous, aimez ceux qui vous haïssent, et vous n’aurez pas d’ennemi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ διδαχή
  choice: l’enseignement
  rationale: Rend directement le sens d’instruction ou d’enseignement, dans un registre naturel et digne.
- source_word: Τούτων δὲ τῶν λόγων
  choice: qui découle de ces paroles
  rationale: Le génitif peut exprimer le rapport entre l’enseignement et les paroles précédentes. Cette formulation française clarifie ce lien sans en faire une simple identité.
- source_word: χάρις
  choice: mérite
  rationale: Dans la question rhétorique, le terme désigne ici le mérite ou la valeur reconnue d’une conduite, plutôt que la grâce au sens théologique technique.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Conserve le terme collectif grec désignant les peuples non juifs, sans introduire le mot religieux plus spécialisé « païens ».
- source_word: οὐχ ἕξετε ἐχθρόν
  choice: vous n’aurez pas d’ennemi
  rationale: Traduction formellement fidèle qui préserve la formulation absolue et sa tension, sans l’atténuer ni l’expliquer.
theological_decisions:
- issue: Portée de la promesse finale
  choice: « vous n’aurez pas d’ennemi »
  alternative: « vous ne considérerez personne comme un ennemi »
  rationale: Le grec emploie simplement le verbe « avoir » et le nom « ennemi ». La traduction conserve donc l’ambiguïté entre une conséquence extérieure et une disposition intérieure, sans imposer une interprétation.
- issue: Sens de χάρις dans l’éthique de la réciprocité
  choice: « quel mérite avez-vous »
  alternative: « quelle grâce avez-vous »
  rationale: Le contexte compare la valeur morale d’un amour réciproque à celui des nations. « Mérite » communique ce sens idiomatique sans transformer le passage en affirmation doctrinale sur la grâce.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. L’impératif pluriel est conservé tout au long du passage. La ponctuation met en relief la série d’exhortations et les deux questions rhétoriques.
