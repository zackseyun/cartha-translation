revisions:
- from: 'Et voici l’enseignement qui découle de ces paroles : bénissez ceux qui vous maudissent, priez pour vos ennemis et jeûnez pour ceux qui vous persécutent. Car quel mérite avez-vous si vous aimez ceux qui vous aiment ? Les nations ne font-elles pas de même ? Mais vous, aimez ceux qui vous haïssent, et vous n’aurez pas d’ennemi.'
  to: 'Or, l’enseignement de ces paroles est le suivant : bénissez ceux qui vous maudissent, priez pour vos ennemis et jeûnez pour ceux qui vous persécutent. Car quel mérite y a-t-il si vous aimez ceux qui vous aiment ? Les païens ne font-ils pas de même ? Mais vous, aimez ceux qui vous haïssent, et vous n’aurez pas d’ennemi.'
  rationale: La révision corrige la relation syntaxique initiale et la question portant sur χάρις, tout en conservant les impératifs, la structure rhétorique et l’ambiguïté délibérée de la promesse finale. « Les païens » est retenu comme équivalent français contextuellement naturel de τὰ ἔθνη / « Gentiles », sans développer d’interprétation confessionnelle.
