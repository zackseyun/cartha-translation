review_pass:
  verdict: revise
  source_fidelity: 'La formulation « qui découle de ces paroles » introduit une relation de dérivation qui n’est pas exprimée par le grec. Le génitif dans ἡ διδαχὴ ... τῶν λόγων rattache directement l’enseignement aux paroles, et αὕτη introduit ce qui suit : « l’enseignement de ces paroles est le suivant ». La question sur χάρις est impersonnelle en grec; « quel mérite y a-t-il » la rend sans ajouter « avez-vous ». Le reste suit bien le texte, y compris le singulier non articulé « un ennemi ».'
  naturalness: La révision demeure fluide en français international moderne et garde un registre exhortatif soutenu. « Les nations » est grammaticalement possible, mais demeure moins idiomatique et moins explicite dans ce contexte que « les païens » pour τὰ ἔθνη; cette dernière expression correspond aussi à l’opposition antique visée, sans exiger une note ici.
  terminology: '« Enseignement », « bénissez », « priez », « jeûnez » et « mérite » conviennent. « Les païens » rend naturellement τὰ ἔθνη dans cet emploi éthico-religieux; il ne s’agit pas d’une affirmation péjorative moderne, mais de la désignation ancienne des non-Juifs/non-chrétiens selon le contexte. La conclusion conserve volontairement son ambiguïté : « vous n’aurez pas d’ennemi ».'
  issues:
  - severity: medium
    issue: « qui découle de ces paroles »
    rationale: Cette expression transforme le simple rapport génitif entre « enseignement » et « paroles » en une relation causale ou déductive. Le grec introduit plutôt l’explication ou le contenu de l’enseignement associé à ces paroles.
  - severity: low
    issue: « quel mérite avez-vous »
    rationale: Le grec demande littéralement quel mérite/crédit il y a, sans attribuer grammaticalement ce mérite aux destinataires. Une tournure impersonnelle est plus exacte.
  - severity: low
    issue: « les nations » pour τὰ ἔθνη
    rationale: Bien que littéral, « les nations » peut évoquer l’ensemble des peuples en français contemporain. Dans ce contexte, « les païens » rend plus clairement l’usage grec traditionnel et correspond à l’audit anglais « Gentiles ».
  revised_text: 'Or, l’enseignement de ces paroles est le suivant : bénissez ceux qui vous maudissent, priez pour vos ennemis et jeûnez pour ceux qui vous persécutent. Car quel mérite y a-t-il si vous aimez ceux qui vous aiment ? Les païens ne font-ils pas de même ? Mais vous, aimez ceux qui vous haïssent, et vous n’aurez pas d’ennemi.'
