id: DID.1.6
reference: Didache 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται· Ἱδρωσάτω ἡ ἐλεημοσύνη σου εἰς τὰς χεῖράς σου, μέχρις ἂν γνῷς τίνι δῷς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: fr
  text: 'Mais à ce sujet aussi, il a été dit : « Que ton aumône transpire dans tes mains jusqu’à ce que tu saches à qui donner. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: aumône
  rationale: Le terme désigne ici le don charitable concret; « aumône » conserve ce sens précis et convient à la forme proverbiale.
- source_word: Ἱδρωσάτω
  choice: qu’elle transpire
  rationale: Le verbe signifie littéralement « transpirer ». L’image volontairement frappante est conservée plutôt que remplacée par une explication.
- source_word: εἰς τὰς χεῖράς σου
  choice: dans tes mains
  rationale: Rend directement la formulation grecque et maintient l’image d’un don retenu dans les mains avant d’être remis.
- source_word: μέχρις ἂν γνῷς
  choice: jusqu’à ce que tu saches
  rationale: 'Cette traduction garde la valeur temporelle assortie d’une condition pratique: attendre d’avoir discerné le destinataire.'
- source_word: τίνι δῷς
  choice: à qui donner
  rationale: En français, l’infinitif après « tu saches » exprime naturellement le sujet identique, sans devoir expliciter de nouveau l’objet déjà nommé, « ton aumône ».
theological_decisions:
- issue: Portée de l’injonction sur le discernement dans l’aumône
  choice: Conserver l’ordre de savoir à qui donner sans préciser les critères du discernement.
  alternative: Paraphraser en demandant de vérifier si le bénéficiaire est digne ou réellement nécessiteux.
  rationale: Le grec ne formule aucun critère et n’emploie aucun terme correspondant à « digne ». Une précision fermerait indûment l’ambiguïté du propos.
translation_notes:
  register: Français moderne, direct et digne. La tournure proverbiale et l’image corporelle inhabituelle de l’aumône qui « transpire » sont préservées. Aucun appel de note n’est requis.
