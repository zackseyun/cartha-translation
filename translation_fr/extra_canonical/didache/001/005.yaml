revisions:
- from: Donne à quiconque te demande[a], et ne réclame rien en retour, car le Père veut que ses propres dons gracieux soient donnés à tous. Heureux celui qui donne conformément au commandement, car il est innocent. Mais malheur à celui qui reçoit ! En effet, si quelqu’un reçoit parce qu’il est dans le besoin, il sera innocent ; mais celui qui reçoit sans être dans le besoin devra répondre de la raison pour laquelle il a reçu et de l’usage qu’il en a fait[b]. Une fois placé en détention, il sera interrogé sur ce qu’il a fait et il ne sortira pas de là avant d’avoir remboursé jusqu’au dernier quadrant[c].
  to: 'Donne à quiconque te demande[a], et ne réclame rien en retour, car le Père veut que ses propres dons soient distribués à tous. Heureux celui qui donne conformément au commandement, car il est innocent. Mais malheur à celui qui reçoit ; en effet, si quelqu’un reçoit alors qu’il est dans le besoin, il sera innocent ; mais celui qui reçoit sans être dans le besoin subira une peine : pourquoi a-t-il reçu, et dans quel but ? Une fois placé en détention, il sera interrogé sur ce qu’il a fait, et il ne sortira pas de là jusqu’à ce qu’il ait payé le dernier quadrant[c].'
  rationale: La révision corrige le déplacement de sens dans la responsabilité du receveur sans besoin, allège le rendu de χαρισμάτων, et ajuste la note sur συνοχή. Elle conserve l’interprétation contextuelle de la détention dans le texte courant tout en maintenant l’ambiguïté lexicale en note. La note b est supprimée, car son alternative est désormais le rendu principal le plus fidèle de la double interrogation grecque.
