source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
translation:
  language: fr
  text: 'Donne à quiconque te demande[a], et ne réclame rien en retour, car le Père veut que ses propres dons soient distribués à tous. Heureux celui qui donne conformément au commandement, car il est innocent. Mais malheur à celui qui reçoit ; en effet, si quelqu’un reçoit alors qu’il est dans le besoin, il sera innocent ; mais celui qui reçoit sans être dans le besoin subira une peine : pourquoi a-t-il reçu, et dans quel but ? Une fois placé en détention, il sera interrogé sur ce qu’il a fait, et il ne sortira pas de là jusqu’à ce qu’il ait payé le dernier quadrant[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Voir Matthieu 5.42 et Luc 6.30. Le grec peut aussi se comprendre : « car le Père veut que l’on donne à tous à partir de ses propres dons ».'
    reason: Le passage reprend étroitement une parole de Jésus transmise dans la tradition évangélique. La note conserve aussi l’ambiguïté de la construction grecque θέλει δίδοσθαι … ἐκ τῶν ἰδίων χαρισμάτων.
  - marker: c
    text: 'Le quadrant était une monnaie romaine de très faible valeur. L’expression signifie : jusqu’à la toute dernière somme due. Le grec traduit ici par « une fois placé en détention » peut aussi évoquer le fait de se trouver sous contrainte ou dans la détresse.'
    reason: Explique la monnaie antique et signale sans la supprimer l’ambiguïté de ἐν συνοχῇ γενόμενος.
lexical_decisions:
- source_word: ἀπαίτει
  choice: ne réclame rien en retour
  rationale: Le verbe signifie réclamer ou exiger la restitution ; cette formulation française explicite naturellement l’objet sous-entendu.
- source_word: χαρισμάτων
  choice: dons gracieux
  rationale: Le terme désigne des dons accordés par grâce ; « dons gracieux » conserve cette nuance sans imposer ici le sens technique de « charismes ».
- source_word: ἀθῷος
  choice: innocent
  rationale: Rend directement l’idée d’être exempt de faute ou de responsabilité.
- source_word: δώσει δίκην
  choice: devra répondre de
  rationale: L’expression idiomatique grecque signifie subir une peine ou rendre compte ; ce choix s’accorde aux questions qui suivent tout en conservant la responsabilité judiciaire.
- source_word: ἐν συνοχῇ
  choice: placé en détention
  rationale: Le syntagme peut évoquer la contrainte, l’emprisonnement ou une situation de détresse. Le contexte de sortie et de remboursement favorise l’image de la détention.
- source_word: κοδράντην
  choice: quadrant
  rationale: Nom d’une très petite monnaie romaine ; le terme historique est conservé, avec une note explicative.
theological_decisions:
- issue: Origine et distribution des dons du Père
  choice: le Père veut que ses propres dons gracieux soient donnés à tous
  alternative: le Père veut donner à tous de ses propres dons gracieux
  rationale: Le grec présente un infinitif passif et la préposition ἐκ, dont le rattachement est légèrement ambigu. Le texte principal suit la lecture selon laquelle les dons du Père doivent être distribués à tous, sans faire nécessairement du Père l’agent direct de chaque don.
- issue: Responsabilité de celui qui reçoit sans besoin
  choice: devra répondre de la raison pour laquelle il a reçu et de l’usage qu’il en a fait
  alternative: 'subira une peine : pourquoi a-t-il reçu, et dans quel but ?'
  rationale: 'La formulation française traite ἱνατί… καὶ εἰς τί comme le contenu de la reddition de comptes, tout en conservant les deux questions distinctes : le motif de la réception et sa finalité.'
- issue: Nature de la détention et du jugement
  choice: placé en détention… interrogé
  alternative: tombé dans la détresse… examiné
  rationale: Le contexte judiciaire et l’écho à la parole sur la sortie après paiement du dernier sou favorisent la détention, mais une note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases conservent la progression exhortative puis judiciaire du grec. « Quiconque », « conformément au commandement » et « malheur à » maintiennent un registre solennel sans archaïsme excessif.
