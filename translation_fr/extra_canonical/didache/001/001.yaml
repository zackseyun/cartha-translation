source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία τοῦ θανάτου, διαφορὰ δὲ πολλὴ μεταξὺ τῶν δύο ὁδῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: fr
  text: Il y a deux chemins, l’un de la vie et l’autre de la mort, et il y a une grande différence entre ces deux chemins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ
  choice: chemins
  rationale: « Chemins » exprime naturellement en français l’image grecque de voies morales ou de manières de vivre.
- source_word: ζωῆς
  choice: vie
  rationale: Équivalent direct qui conserve toute la portée physique, morale et théologique du terme grec.
- source_word: θανάτου
  choice: mort
  rationale: Équivalent direct, maintenu en contraste avec « vie ».
- source_word: διαφορὰ δὲ πολλὴ
  choice: Et la différence … est grande
  rationale: Rend clairement le contraste introduit par δέ et l’intensité de πολλή dans un français naturel.
- source_word: μεταξὺ τῶν δύο ὁδῶν
  choice: entre ces deux chemins
  rationale: « Ces » reprend idiomatiquement les deux chemins qui viennent d’être nommés, sans modifier le sens.
theological_decisions:
- issue: Portée de l’opposition entre la vie et la mort
  choice: Conserver les termes simples « vie » et « mort » sans explicitation.
  alternative: Préciser qu’il s’agit de salut et de perdition, ou de conduite juste et mauvaise.
  rationale: Le grec laisse à cette opposition sa densité morale et théologique sans en fixer ici toute la portée; la traduction préserve donc cette ouverture.
translation_notes:
  register: Français moderne, clair et digne. La structure en deux phrases met en relief l’énoncé des deux chemins puis leur contraste, tout en conservant le parallélisme du grec.
