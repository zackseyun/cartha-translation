  source_fidelity: 'La traduction rend fidèlement la structure de l’exhortation, les quatre qualités requises et la relation fonctionnelle avec les prophètes et les enseignants. Toutefois, « parmi vous » traduit imparfaitement ἑαυτοῖς (« pour vous-mêmes / pour votre communauté ») : le grec n’indique pas que les personnes désignées doivent être prises au sein du groupe. La révision corrige ce point sans trancher le mode précis de désignation.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Désignez donc pour vous-mêmes » est naturel dans ce contexte et évite l’implication indue de « parmi vous ». Les enchaînements descriptifs et la phrase finale restent fluides.
  terminology: « Responsables » est un rendu fonctionnel prudent d’ἐπίσκοποι; la note conserve à juste titre le sens littéral et le titre traditionnel « évêques ». « Diacres », « ministère », « doux », « qui n’aiment pas l’argent », « honnêtes » et « qui ont fait leurs preuves » sont recevables dans le registre retenu. La note sur χειροτονήσατε préserve correctement la possibilité d’une élection sans l’imposer.
