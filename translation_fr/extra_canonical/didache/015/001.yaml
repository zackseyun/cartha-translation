source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
translation:
  language: fr
  text: 'Désignez[a] donc pour vous-mêmes des responsables[b] et des diacres dignes du Seigneur : des hommes doux, qui n’aiment pas l’argent, honnêtes et qui ont fait leurs preuves. Car eux aussi accomplissent pour vous le ministère[c] des prophètes et des enseignants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « élisez ».
    reason: Le mode précis de désignation n’est pas explicité, et le verbe peut évoquer une élection, notamment par vote à main levée.
  - marker: b
    text: Littéralement « surveillants »; traditionnellement « évêques ».
    reason: Le terme grec peut désigner une fonction générale de supervision ou être rendu par le titre ecclésiastique traditionnel.
  - marker: c
    text: Ou « service ».
    reason: Le grec λειτουργία peut désigner un ministère, une fonction ou un service accompli pour la communauté.
lexical_decisions:
- source_word: Χειροτονήσατε
  choice: Désignez
  rationale: Le verbe peut évoquer l’élection ou la nomination, à l’origine par un vote à main levée. « Désignez » conserve ici une formulation naturelle sans préciser un mode de sélection que le contexte ne détaille pas.
- source_word: ἐπισκόπους
  choice: responsables
  rationale: Le terme désigne littéralement des personnes chargées de veiller sur une communauté. « Responsables » évite d’imposer au texte l’acception institutionnelle plus tardive que pourrait suggérer « évêques »; une note signale le sens littéral et la traduction traditionnelle.
- source_word: ἀφιλαργύρους
  choice: qui n’aiment pas l’argent
  rationale: Cette formulation directe rend précisément la négation de l’amour de l’argent, sans élargir indûment le sens à toute forme de désintéressement.
- source_word: δεδοκιμασμένους
  choice: qui ont fait leurs preuves
  rationale: Le participe indique des hommes éprouvés et reconnus comme authentiques ou approuvés; l’expression française est naturelle et garde l’idée d’une qualité vérifiée.
- source_word: λειτουργίαν
  choice: ministère
  rationale: Dans ce contexte communautaire, le mot désigne une fonction de service exercée au bénéfice d’autrui. « Ministère » convient au rôle des prophètes et des enseignants, tandis que la note conserve l’alternative plus générale « service ».
theological_decisions:
- issue: Identification des ἐπίσκοποι avec l’office ecclésiastique ultérieur d’évêque
  choice: responsables
  alternative: évêques; surveillants
  rationale: Le texte atteste une fonction de supervision, mais ne définit pas ici sa forme institutionnelle exacte. Le choix principal reste accessible et évite de résoudre cette question historique; la note préserve les autres rendus.
- issue: Rapport entre le ministère des responsables et celui des prophètes et enseignants
  choice: « eux aussi accomplissent pour vous le ministère des prophètes et des enseignants »
  alternative: « ils exercent eux aussi à votre service la fonction des prophètes et des enseignants »
  rationale: La formulation conserve l’affirmation selon laquelle leur activité correspond au ministère associé aux prophètes et aux enseignants, sans préciser s’il s’agit d’une identité d’office ou d’une continuité fonctionnelle.
translation_notes:
  register: Français moderne, clair et digne. La coordination des quatre qualités est conservée, avec de légers ajustements syntaxiques pour rester naturelle. Le vocabulaire institutionnel demeure volontairement prudent afin de préserver l’ouverture historique du passage.
