id: DID.15.2
reference: Didache 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/002.yaml
  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: fr
  text: Ne les négligez donc pas, car ce sont eux qui, avec les prophètes et les enseignants, sont tenus en honneur par vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερίδητε
  choice: négligez
  rationale: Le verbe signifie ici ne pas tenir compte de quelqu’un ou le traiter avec dédain. « Négliger » exprime naturellement l’interdiction dans ce contexte.
- source_word: τετιμημένοι
  choice: que vous honorez
  rationale: Cette tournure française naturelle rend le participe parfait passif et son idée d’honneur reconnu, sans employer le peu idiomatique « vos honorés ».
- source_word: διδασκάλων
  choice: enseignants
  rationale: « Enseignants » rend clairement et sobrement les personnes chargées d’enseigner dans la communauté.
theological_decisions:
- issue: Statut des responsables mentionnés dans le contexte
  choice: Conserver une formulation générale fondée sur l’honneur qui leur est accordé
  alternative: Préciser une fonction ou une autorité ecclésiastique particulière
  rationale: Le verset les associe aux prophètes et aux enseignants, mais ne définit pas ici la nature exacte de leur autorité; la traduction évite donc toute précision confessionnelle ajoutée.
- issue: Rapport exprimé par μετὰ τῶν προφητῶν καὶ διδασκάλων
  choice: avec les prophètes et les enseignants
  alternative: au même titre que les prophètes et les enseignants
  rationale: « Avec » préserve la formulation grecque et son éventuelle ambiguïté, sans imposer une stricte égalité de rang.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre logique introduit par οὖν est conservé par « donc ». Aucun appel de note n’est nécessaire.
