review_pass:
  verdict: revise
  source_fidelity: La structure emphatique initiale (Τὰς δὲ… ποιήσατε) et les termes principaux sont bien rendus. « Aumônes » restitue précisément ἐλεημοσύνας, et « actions » conserve l’extension générale de πράξεις. Toutefois, « comme vous le trouvez » interprète ἔχετε (« vous avez ») et introduit l’idée de découverte ou de consultation, absente du grec.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Quant à …, faites-les ainsi » rend naturellement la topicalisation grecque. « Comme vous l’avez dans l’Évangile » est à la fois idiomatique et plus proche du texte source.
  terminology: « Prières », « aumônes », « actions » et « Évangile de notre Seigneur » sont appropriés. La formulation concernant l’Évangile maintient utilement l’ambiguïté entre une tradition évangélique reçue et un écrit évangélique, sans identifier un évangile particulier.
  issues:
