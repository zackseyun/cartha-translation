    issue: « comme vous le trouvez » pour ὡς ἔχετε
    rationale: Le verbe ἔχετε signifie « vous avez »; dans ce contexte, il renvoie à ce que les destinataires ont dans l’Évangile. « Vous le trouvez » est naturel, mais ajoute une nuance de consultation/découverte qui n’est pas exprimée par le grec.
  - severity: low
    issue: Formulation de la note alternative
    rationale: La note actuelle annonce une reproduction plus étroite de l’ordre grec, mais « accomplissez ainsi vos prières… » place le verbe avant les compléments et ne reproduit donc pas cette antéposition. Une variante avec les compléments en tête rend mieux la justification annoncée.
  revised_text: Quant à vos prières, vos aumônes et toutes vos actions[a], faites-les ainsi, comme vous l’avez dans l’Évangile de notre Seigneur.
