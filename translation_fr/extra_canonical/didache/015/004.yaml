id: DID.15.4
reference: Didache 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/004.yaml
  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
translation:
  language: fr
  text: Quant à vos prières, vos aumônes et toutes vos actions[a], faites-les ainsi, comme vous l’avez dans l’Évangile de notre Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Mais vos prières, vos aumônes et toutes vos actions, faites-les ainsi. »'
    reason: Cette formulation reproduit plus directement l’antéposition des compléments avant l’impératif en grec, tout en restant recevable en français.
lexical_decisions:
- source_word: ἐλεημοσύνας
  choice: aumônes
  rationale: Le terme désigne ici concrètement les dons faits aux pauvres; «aumônes» conserve cette portée précise et l’écho aux pratiques évangéliques.
- source_word: πράξεις
  choice: actions
  rationale: «Actions» rend naturellement le terme général sans le limiter aux seules œuvres religieuses.
- source_word: οὕτω ποιήσατε
  choice: faites-les de cette manière
  rationale: Cette formulation reprend les compléments antéposés et exprime clairement l’injonction ainsi que la manière prescrite.
- source_word: ὡς ἔχετε
  choice: comme vous le trouvez
  rationale: Le grec signifie littéralement «comme vous avez»; en français, «comme vous le trouvez» exprime naturellement que ces prescriptions figurent dans l’Évangile.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν
  choice: dans l’Évangile de notre Seigneur
  rationale: Rendu direct qui préserve la référence au corpus ou à l’enseignement évangélique du Seigneur sans en préciser indûment la forme.
theological_decisions:
- issue: Sens de «l’Évangile de notre Seigneur»
  choice: Maintenir la formulation sans identifier un évangile canonique particulier ni réduire l’expression à une citation précise.
  alternative: «dans l’enseignement évangélique de notre Seigneur»
  rationale: Le grec peut renvoyer à un texte évangélique reçu ou, plus largement, à l’enseignement du Seigneur transmis comme Évangile; la traduction conserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. «Quant à» conserve la mise en relief initiale introduite par δέ; «aumônes» garde le sens concret de l’aide matérielle aux pauvres. La majuscule à «Évangile» signale ici la réalité évangélique reçue sans trancher entre texte écrit et enseignement transmis.
