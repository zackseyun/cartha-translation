base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
translation:
  language: fr
  text: Reprenez-vous les uns les autres, non pas avec colère, mais dans la paix, comme vous l’avez dans l’Évangile ; et, pour celui qui pèche contre un autre, que personne ne lui parle et qu’il n’entende rien de votre part[a], jusqu’à ce qu’il se repente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il ne soit pas écouté par vous » ou « qu’on ne lui donne pas audience ». Le grec peut aussi être compris comme l’interdiction de lui adresser la parole ou de l’écouter jusqu’à sa repentance.'
    reason: La syntaxe de μηδὲ παρ’ ὑμῶν ἀκουέτω est comprise diversement. Le texte principal suit la valeur active la plus directe, tandis que la note préserve l’autre analyse attestée sans trancher au-delà du grec.
lexical_decisions:
- source_word: Ἐλέγχετε
  choice: Reprenez
  rationale: Le verbe désigne ici le fait de reprendre ou de corriger quelqu’un en lui montrant sa faute; «reprenez» conserve cette force dans un français naturel et digne.
- source_word: ἐν ὀργῇ ... ἐν εἰρήνῃ
  choice: avec colère ... dans la paix
  rationale: La variation prépositionnelle donne une formulation française idiomatique tout en conservant l’opposition entre une correction coléreuse et une correction menée dans un esprit de paix.
- source_word: ὡς ἔχετε ἐν τῷ εὐαγγελίῳ
  choice: comme vous le trouvez dans l’Évangile
  rationale: Le grec signifie littéralement «comme vous [l’]avez dans l’Évangile». La formulation retenue explicite légèrement le rapport au contenu transmis sans identifier un passage précis.
- source_word: ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: celui qui pèche contre un autre
  rationale: ἀστοχέω évoque le fait de manquer le but ou de s’égarer; avec «contre un autre», le contexte indique une faute interpersonnelle. «Pèche contre» rend cette dimension morale sans réduire l’expression à un simple tort matériel.
- source_word: μηδεὶς λαλειτώ
  choice: que personne ne lui parle
  rationale: L’impératif grec interdit aux membres de la communauté de s’adresser à la personne fautive.
- source_word: μηδὲ παρ’ ὑμῶν ἀκουέτω
  choice: qu’il ne soit pas écouté parmi vous
  rationale: La forme active grecque peut idiomatiquement avoir le sens d’«être écouté» ou «obtenir audience». Cette traduction préserve la distinction avec l’interdiction précédente de lui parler.
- source_word: μετανοήσῃ
  choice: se repente
  rationale: Le verbe exprime ici le changement de disposition et le retour après la faute; «se repentir» est précis et courant dans ce contexte moral.
theological_decisions:
- issue: Nature de la faute exprimée par ἀστοχέω
  choice: «pèche contre un autre»
  alternative: «fait du tort à un autre» ou «s’égare à l’égard d’un autre»
  rationale: Le choix conserve la gravité morale du contexte et l’écho possible à la discipline communautaire de l’Évangile, tout en évitant de préciser une catégorie doctrinale de péché.
- issue: Portée de la discipline communautaire
  choice: Interdiction de parler au fautif et de l’écouter jusqu’à sa repentance
  alternative: Comprendre la seconde proposition comme «qu’il n’entende rien de votre part»
  rationale: La construction avec ἀκούω peut exprimer le fait d’être écouté. Cette lecture distingue naturellement les deux injonctions, mais l’ambiguïté syntaxique réelle est signalée en note.
- issue: Référence à «l’Évangile»
  choice: Maintien du singulier avec majuscule
  alternative: «la Bonne Nouvelle» ou une référence explicite à Matthieu 18
  rationale: Le texte renvoie à un enseignement évangélique reçu par les destinataires sans nommer un livre ni un passage; la traduction ne doit pas résoudre cette identification.
translation_notes:
  register: Français international moderne, sobre et communautaire. «Reprenez-vous les uns les autres» garde la réciprocité du grec; «dans l’Évangile» conserve la référence traditionnelle sans l’identifier à un écrit précis. Aucun marqueur de note n’est nécessaire, puisque les ambiguïtés principales peuvent être conservées de façon intelligible dans le corps du texte.
