id: DID.3.8
reference: Didache 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γίνου μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς καὶ τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/008.yaml
  text: Be patient and merciful and guileless and quiet and good[a], and always trembling at the words that you heard.
translation:
  language: fr
  text: Sois patient, miséricordieux, sans malice, paisible et bon, et tremble toujours devant les paroles que tu as entendues.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γίνου
  choice: Sois
  rationale: Dans cette exhortation morale, l’impératif présent de γίνομαι peut naturellement se rendre par « sois »; « deviens » insisterait davantage sur un changement d’état sans que le contexte l’exige.
- source_word: μακρόθυμος
  choice: patient
  rationale: Le terme désigne la patience durable, notamment face aux offenses ou aux difficultés.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Ce choix conserve la portée morale de la compassion active et correspond au registre digne du passage.
- source_word: ἄκακος
  choice: sans malice
  rationale: Le mot signifie littéralement « sans mal » et peut évoquer l’innocence ou l’absence de méchanceté; « sans malice » restitue clairement cette qualité morale.
- source_word: ἡσύχιος
  choice: paisible
  rationale: Dans une série de qualités personnelles, « paisible » exprime mieux le calme et l’absence d’agitation que « silencieux ».
- source_word: τρέμων
  choice: tremble
  rationale: Le participe présent dépend de Γίνου et exprime une attitude durable de crainte révérencielle; une forme verbale coordonnée est naturelle en français.
- source_word: τοὺς λόγους
  choice: les paroles
  rationale: « Paroles » convient à un enseignement entendu et évite le sens principalement lexical que « mots » pourrait suggérer.
- source_word: ἤκουσας
  choice: tu as entendues
  rationale: L’aoriste renvoie à l’enseignement reçu comme événement accompli; le passé composé est la manière naturelle de l’exprimer en français moderne.
theological_decisions:
- issue: Nature du tremblement devant les paroles reçues
  choice: « tremble toujours devant les paroles »
  alternative: « respecte toujours profondément les paroles »
  rationale: La traduction conserve l’image forte de τρέμων et sa tension théologique, sans la réduire silencieusement à une simple notion de respect.
- issue: Valeur de l’impératif Γίνου
  choice: « Sois »
  alternative: « Deviens »
  rationale: « Sois » fonctionne naturellement comme exhortation morale continue. « Deviens » reste possible, mais ferait ressortir un processus de transformation qui n’est pas nécessairement affirmé ici.
translation_notes:
  register: Français international moderne, clair et digne. La série adjectivale est conservée, tandis que le participe grec est rendu par un second impératif coordonné afin d’éviter une tournure française lourde comme « sois… tremblant toujours ».
