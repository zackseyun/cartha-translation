id: DID.3.4
reference: Didache 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
translation:
  language: fr
  text: Mon enfant, ne deviens pas interprète des présages, car cela conduit à l’idolâtrie. Ne sois ni enchanteur, ni astrologue, ni quelqu’un qui pratique des purifications, et ne veuille même pas regarder ces choses, car de toutes ces pratiques naît l’idolâtrie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰωνοσκόπος
  choice: interprète des présages
  rationale: Le terme désigne celui qui observe et interprète des signes tenus pour prémonitoires; cette formulation est claire en français moderne sans réduire le mot à une seule technique divinatoire.
- source_word: ἐπαοιδός
  choice: enchanteur
  rationale: Le mot désigne une personne qui recourt à des incantations ou formules magiques; « enchanteur » conserve cette idée dans un registre digne.
- source_word: μαθηματικός
  choice: astrologue
  rationale: Dans ce contexte antique de pratiques menant à l’idolâtrie, le terme ne signifie pas « mathématicien » au sens moderne, mais renvoie à l’astrologie.
- source_word: περικαθαίρων
  choice: quelqu’un qui pratique des purifications
  rationale: La périphrase rend le participe substantivé et conserve la référence à des purifications rituelles ou magiques sans en préciser indûment la forme.
- source_word: αὐτὰ βλέπειν
  choice: regarder ces choses
  rationale: Le neutre pluriel αὐτά renvoie aux pratiques ou objets occultes évoqués, et non aux praticiens masculins de la liste.
- source_word: γεννᾶται
  choice: naît
  rationale: La traduction garde l’image forte de l’idolâtrie engendrée par l’ensemble de ces pratiques.
theological_decisions:
- issue: Rapport entre les pratiques occultes et l’idolâtrie
  choice: « cela conduit à l’idolâtrie » et « de toutes ces pratiques naît l’idolâtrie »
  alternative: « cela mène au culte des idoles » et « toutes ces choses engendrent le culte des idoles »
  rationale: « Idolâtrie » rend directement εἰδωλολατρεία et conserve la formulation théologique du texte sans l’élargir ni la restreindre.
translation_notes:
  register: Français moderne, direct et digne. L’adresse « Mon enfant » et la succession d’interdictions sont conservées. La dernière occurrence de « ces pratiques » explicite naturellement le référent de τούτων ἁπάντων, tandis que « ces choses » maintient le neutre pluriel αὐτά.
