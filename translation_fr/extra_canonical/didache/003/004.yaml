  verdict: approve
  source_fidelity: Le texte français rend fidèlement la suite d’interdictions du grec. « Interprète des présages » exprime adéquatement οἰωνοσκόπος; « enchanteur », « astrologue » et la périphrase pour περικαθαίρων sont justifiés par le contexte. « Ces choses » préserve utilement le référent neutre pluriel de αὐτά, sans laisser entendre qu’il s’agit des personnes énumérées. La conclusion, « de toutes ces pratiques naît l’idolâtrie », conserve l’image de γεννᾶται et le lien global marqué par τούτων ἁπάντων.
  naturalness: Le français est moderne, fluide et d’un registre sobre approprié à l’instruction parénétique. La reprise « Ne sois ni… » et « ne veuille même pas regarder » est naturelle et garde la force cumulative des μηδέ grecs. La séparation en deux phrases ne modifie pas le sens.
  terminology: Les termes essentiels sont bien choisis. « Idolâtrie » correspond directement à εἰδωλολατρεία. « Astrologue » est contextuellement préférable au sens moderne de « mathématicien » pour μαθηματικός. « Purifications » reste volontairement général et ne surinterprète pas la pratique visée.
