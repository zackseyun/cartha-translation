id: DID.3.9
reference: Didache 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: fr
  text: Ne t’élève pas toi-même et ne donne pas d’insolence à ton âme. Que ton âme ne s’attache pas aux hautains, mais fréquente les justes et les humbles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώσεις σεαυτόν
  choice: t’élève pas toi-même
  rationale: Rend directement l’idée de s’exalter soi-même, dans une formulation française naturelle et digne.
- source_word: δώσεις τῇ ψυχῇ σου θράσος
  choice: ne laisse pas l’assurance effrontée gagner ton âme
  rationale: θράσος peut désigner une hardiesse excessive ou impudente. Cette formulation conserve sa valeur négative sans recourir à un littéralisme peu naturel comme « donner de la hardiesse à ton âme ».
- source_word: κολληθήσεται
  choice: ne s’attache pas
  rationale: Le verbe évoque une adhésion ou une association étroite; « s’attacher à » préserve cette force relationnelle.
- source_word: ὑψηλῶν
  choice: gens hautains
  rationale: Dans le contraste avec « justes et humbles », le terme désigne vraisemblablement des personnes élevées à leurs propres yeux, donc hautaines, plutôt que simplement des personnes de rang élevé.
- source_word: ἀναστραφήσῃ
  choice: fréquente
  rationale: Le verbe exprime ici la conduite et les relations habituelles parmi certaines personnes; « fréquenter » est idiomatique et garde l’idée d’association.
theological_decisions:
- issue: Sens moral de ὑψηλῶν
  choice: gens hautains
  alternative: gens haut placés
  rationale: Le parallélisme antithétique avec « humbles » favorise un trait moral, tout en évitant d’introduire une condamnation générale du statut social.
- issue: Force de θράσος
  choice: assurance effrontée
  alternative: hardiesse
  rationale: Le contexte d’exhortation contre l’orgueil indique une hardiesse répréhensible; « assurance effrontée » la distingue d’un courage légitime sans développer une doctrine particulière.
translation_notes:
  register: Tutoiement singulier conforme aux impératifs grecs. Registre moderne, accessible et solennel, avec parallélisme conservé entre les gens hautains et les justes et humbles.
