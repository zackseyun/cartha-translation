source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ἐπιθυμητής· ὁδηγεῖ γὰρ ἡ ἐπιθυμία πρὸς τὴν πορείαν· μηδὲ αἰσχρολόγος μηδὲ ὑψηλοόφθαλμος· ἐκ γὰρ τούτων ἀπάντων μοιχεῖαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
translation:
  language: fr
  text: Mon enfant, ne te laisse pas dominer par le désir, car le désir engage sur une voie[b]. Ne tiens pas non plus de propos obscènes et n’aie pas le regard vagabond[a], car de tout cela naissent les adultères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne sois pas aux yeux élevés ». Selon le contexte, l’expression peut désigner un regard qui se porte avec convoitise sur autrui; elle peut aussi signifier « n’aie pas le regard hautain ».'
    reason: ὑψηλοόφθαλμος est rare et son sens exact demeure discuté; la note préserve l’alternative sans l’imposer au texte.
  - marker: b
    text: Le texte grec fourni lit πορείαν, « marche, trajet, voie ». La leçon habituellement attestée et attendue dans ce contexte est probablement πορνείαν, « immoralité sexuelle »; la traduction principale conserve toutefois la leçon fournie.
    reason: Signaler une probable variante ou erreur de copie/OCR sans remplacer dans le texte principal la lecture de la source fournie.
lexical_decisions:
- source_word: ἐπιθυμητής / ἐπιθυμία
  choice: esclave du désir / le désir
  rationale: Le grec désigne celui qui se livre à la convoitise et la convoitise elle-même. « Esclave du désir » exprime naturellement l’idée d’une disposition dominée par ce désir, dans un contexte explicitement sexuel.
- source_word: αἰσχρολόγος
  choice: qui tient des propos obscènes
  rationale: Le terme vise un langage honteux, indécent ou grossier. « Propos obscènes » conserve ici le lien avec le contexte sexuel.
- source_word: ὑψηλοόφθαλμος
  choice: ne laisse pas tes yeux s’égarer
  rationale: Littéralement « aux yeux élevés », le mot peut évoquer un regard hautain, mais son association avec le désir, les propos obscènes et l’adultère favorise ici l’idée d’un regard qui se porte avec convoitise sur autrui. Une note conserve l’autre lecture.
- source_word: μοιχεῖαι γεννῶνται
  choice: naissent les adultères
  rationale: Cette formulation préserve la métaphore forte de l’engendrement présente dans γεννῶνται ainsi que le pluriel inhabituel μοιχεῖαι.
theological_decisions:
- issue: Rapport entre le désir, le regard et l’adultère
  choice: Conserver la progression morale du texte sans identifier tout désir à l’adultère lui-même
  alternative: Paraphraser en disant que ces attitudes « conduisent à commettre l’adultère »
  rationale: Le grec affirme que les adultères « naissent » de ces conduites. La traduction maintient cette causalité imagée sans la systématiser davantage.
- issue: Sens de ὑψηλοόφθαλμος
  choice: Rendre dans le texte le regard convoiteur, tout en signalant la lecture liée à l’orgueil
  alternative: « ne sois pas hautain » ou « n’aie pas le regard hautain »
  rationale: Le contexte immédiat est sexuel, mais la forme grecque permet réellement une compréhension liée au regard élevé ou hautain; la note préserve cette tension.
translation_notes:
  register: Français international moderne, direct et digne. L’adresse « Mon enfant » conserve le ton pédagogique. La répétition de « désir » et l’image des adultères qui « naissent » sont maintenues pour préserver la structure et la force du grec.
