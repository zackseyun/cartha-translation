revisions:
- from: Mon enfant, ne deviens pas quelqu’un qui murmure, car cela conduit au blasphème. Ne sois ni présomptueux ni mal intentionné, car de toutes ces dispositions naissent des blasphèmes.
  to: Mon enfant, ne deviens pas quelqu’un d’enclin aux plaintes, car il mène au blasphème. Ne sois ni entêté ni mal intentionné, car de toutes ces choses naissent des blasphèmes.
  rationale: La révision conserve l’ordre, les contrastes et la variation singulier/pluriel du grec. Elle remplace des choix français soit ambigus (« quelqu’un qui murmure »), soit sémantiquement trop étroits (« présomptueux »), et elle évite de neutraliser le référent du verbe « mène ». « Toutes ces choses » reproduit plus directement le démonstratif récapitulatif τούτων ἁπάντων sans introduire une catégorie interprétative.
