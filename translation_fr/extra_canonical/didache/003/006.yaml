source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: fr
  text: Mon enfant, ne deviens pas quelqu’un d’enclin aux plaintes, car il mène au blasphème. Ne sois ni entêté ni mal intentionné, car de toutes ces choses naissent des blasphèmes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γόγγυσος
  choice: quelqu’un qui murmure
  rationale: Le terme désigne une personne portée aux plaintes et aux récriminations. « Murmurer » conserve l’écho biblique tout en restant compréhensible en français moderne.
- source_word: αὐθάδης
  choice: présomptueux
  rationale: Le mot caractérise celui qui suit obstinément sa propre volonté, avec suffisance. « Présomptueux » rend cette attitude sans réduire le sens à la simple obstination.
- source_word: πονηρόφρων
  choice: mal intentionné
  rationale: Ce composé décrit une personne dont les pensées ou les dispositions sont mauvaises. « Mal intentionné » est naturel et conserve l’orientation morale du terme.
- source_word: τούτων ἁπάντων
  choice: toutes ces dispositions
  rationale: Le démonstratif reprend les attitudes personnelles qui viennent d’être énumérées. « Dispositions » explicite naturellement ce lien sans ajouter une doctrine étrangère au texte.
- source_word: βλασφημίαν / βλασφημίαι
  choice: blasphème / blasphèmes
  rationale: Le même lexème grec apparaît d’abord au singulier puis au pluriel; cette variation est conservée.
theological_decisions:
- issue: Portée de βλασφημία
  choice: blasphème
  alternative: parole injurieuse / calomnie
  rationale: Le grec peut désigner plus largement une parole outrageante ou diffamatoire, mais « blasphème » préserve ici la force religieuse possible du terme ainsi que l’ambiguïté du texte.
translation_notes:
  register: Français moderne, digne et direct. L’adresse « Mon enfant » et l’image des blasphèmes qui « naissent » sont conservées, tandis que la syntaxe est légèrement fluidifiée pour une lecture naturelle.
