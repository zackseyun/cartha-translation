source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, φεῦγε ἀπὸ παντὸς πονηροῦ καὶ ἀπὸ παντὸς ὁμοίου αὐτοῦ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: fr
  text: Mon enfant, fuis toute forme de mal et tout ce qui lui ressemble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Mon enfant
  rationale: Rend naturellement l’adresse affectueuse et pédagogique du grec, sans préciser le sexe.
- source_word: φεῦγε ἀπὸ
  choice: fuis
  rationale: Conserve la force de l’impératif présent, qui appelle à se tenir résolument à distance.
- source_word: παντὸς πονηροῦ
  choice: toute forme de mal
  rationale: Le substantif adjectival neutre peut désigner toute chose mauvaise ou le mal sous toutes ses formes; cette formulation est naturelle en français et garde une portée générale.
- source_word: παντὸς ὁμοίου αὐτοῦ
  choice: tout ce qui lui ressemble
  rationale: Reproduit le renvoi de αὐτοῦ au mal et l’idée de ressemblance, sans expliciter davantage la nature de cette proximité.
theological_decisions:
- issue: Portée de πονηροῦ
  choice: le mal au sens général
  alternative: le Mauvais, compris comme une personne
  rationale: Dans cette construction neutre et en parallèle avec «tout ce qui lui ressemble», le sens moral général est le plus probable; la traduction évite donc une personnification non imposée par le texte.
translation_notes:
  register: Français moderne, simple et digne. L’adresse «Mon enfant» convient au ton d’enseignement moral de la Didachè; la phrase reste concise et directement exhortative.
