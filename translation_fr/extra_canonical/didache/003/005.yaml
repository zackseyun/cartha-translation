id: DID.3.5
reference: Didache 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ψεύστης· ἐπειδὴ ὁδηγεῖ τὸ ψεῦσμα εἰς τὴν κλοπήν· μηδὲ φιλάργυρος μηδὲ κενόδοξος· ἐκ γὰρ τούτων ἁπάντων κλοπαὶ γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: fr
  text: Mon enfant, ne deviens pas menteur, car le mensonge conduit au vol. Ne sois pas non plus avide d’argent ni vaniteux, car de tout cela naissent des vols.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Mon enfant
  rationale: Rend directement l’adresse affectueuse et pédagogique du grec dans un français naturel et digne.
- source_word: μὴ γίνου ψεύστης
  choice: ne deviens pas menteur
  rationale: Conserve la valeur de γίνου (« devenir »), plutôt que de réduire l’expression à « ne mens pas ».
- source_word: τὸ ψεῦσμα
  choice: le mensonge
  rationale: Le substantif français exprime naturellement ici l’acte ou la pratique de mentir qui mène au vol.
- source_word: φιλάργυρος
  choice: ami de l’argent
  rationale: Reproduit l’image lexicale grecque tout en restant intelligible; « cupide » serait plus idiomatique mais moins formellement proche.
- source_word: κενόδοξος
  choice: vaniteux
  rationale: Exprime la recherche de vaine gloire en français courant sans formulation lourde.
- source_word: κλοπαὶ γεννῶνται
  choice: naissent des vols
  rationale: Préserve la métaphore de la naissance et le pluriel κλοπαί.
theological_decisions:
- issue: Lien moral entre les vices énumérés et le vol
  choice: « de toutes ces choses naissent des vols »
  alternative: « toutes ces choses engendrent le vol »
  rationale: La formulation choisie conserve le pluriel grec et sa métaphore sans préciser davantage le mécanisme moral ou spirituel.
translation_notes:
  register: Français moderne international, simple et exhortatif. La structure en deux phrases évite une période trop chargée tout en maintenant le parallélisme du grec. Aucun marqueur de note n’est requis.
