source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἴσθι δὲ πραῢς, ἐπεὶ οἱ πραεῖς κληρονομήσουσι τὴν γῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/007.yaml
  text: But be meek, because the meek will inherit the earth.
translation:
  language: fr
  text: Mais sois doux, car ceux qui sont doux hériteront de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς / πραεῖς
  choice: doux / ceux qui sont doux
  rationale: « Doux » rend ici la disposition de douceur et de non-violence sans suggérer la faiblesse; la répétition du grec est conservée.
- source_word: κληρονομήσουσι
  choice: hériteront
  rationale: Équivalent direct du futur grec, qui conserve la portée scripturaire de la formule.
- source_word: τὴν γῆν
  choice: la terre
  rationale: La formulation française maintient l'ambiguïté de γῆ entre la terre au sens large et le pays, sans la résoudre.
- source_word: ἐπεὶ
  choice: car
  rationale: « Car » exprime naturellement la relation causale qui fonde l'exhortation.
theological_decisions:
- issue: Portée de « la terre »
  choice: Maintenir « la terre » sans précision
  alternative: « le pays » ou « la Terre »
  rationale: Le grec γῆ permet plusieurs nuances; ajouter une précision imposerait une interprétation absente du texte.
- issue: Écho à la béatitude de Matthieu 5:5
  choice: Employer la formulation traditionnelle mais actuelle « doux » et « hériteront de la terre »
  alternative: « humbles » et « recevront la terre en héritage »
  rationale: Cette formulation préserve l'écho intertextuel manifeste tout en restant claire en français moderne.
translation_notes:
  register: Phrase brève, exhortative et digne. Le singulier « sois » correspond à l'impératif grec, tandis que la proposition justificative passe au pluriel comme dans la source.
