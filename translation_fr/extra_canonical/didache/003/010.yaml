id: DID.3.10
reference: Didache 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: fr
  text: Accueille comme bonnes les choses qui t’arrivent, sachant que rien ne se produit sans Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι ἐνεργήματα
  choice: les choses qui t’arrivent
  rationale: Cette formulation naturelle conserve l’ampleur de l’expression grecque, qui désigne ce qui survient à une personne, sans la restreindre à une catégorie précise d’événements.
- source_word: προσδέξῃ
  choice: Accueille
  rationale: L’impératif français exprime clairement l’exhortation portée ici par la forme verbale grecque et garde l’idée d’une réception consentie.
- source_word: ὡς ἀγαθὰ
  choice: comme bonnes
  rationale: La traduction maintient la qualification surprenante et exigeante du grec sans l’atténuer en « avec résignation » ou « comme venant d’un bien ».
- source_word: ἄτερ Θεοῦ
  choice: sans Dieu
  rationale: Équivalent français direct qui préserve la formulation grecque sans ajouter les notions interprétatives de volonté, de permission ou de causalité divine.
- source_word: οὐδὲν γίνεται
  choice: rien ne se produit
  rationale: « Se produire » rend naturellement γίνομαι dans le contexte d’événements qui adviennent et évite la répétition de « arriver ».
theological_decisions:
- issue: Rapport entre Dieu et ce qui arrive
  choice: rien ne se produit sans Dieu
  alternative: rien ne se produit sans la permission de Dieu
  rationale: Le grec affirme qu’aucune chose n’advient « sans Dieu », mais ne précise pas s’il est question de causalité, de volonté ou de permission. La traduction conserve cette tension théologique au lieu de la résoudre.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement convient à l’adresse personnelle au lecteur dans cette série d’exhortations. La phrase reste proche de la structure grecque tout en étant idiomatique.
