id: DID.3.2
reference: Didache 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου ὀργίλος· ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον· μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός· ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: fr
  text: Ne deviens pas prompt à la colère, car la colère conduit au meurtre. Ne sois pas non plus jaloux, querelleur ou emporté, car de tout cela naissent des meurtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργίλος
  choice: prompt à la colère
  rationale: Rend la disposition à se mettre facilement en colère tout en conservant le lien lexical avec ὀργή dans la proposition suivante.
- source_word: ὀργή
  choice: la colère
  rationale: Équivalent direct et naturel, qui préserve la répétition intentionnelle avec « prompt à la colère ».
- source_word: φόνος / φόνοι
  choice: meurtre / meurtres
  rationale: Conserve le singulier dans la première proposition et le pluriel marqué dans la seconde.
- source_word: ζηλωτής
  choice: jaloux
  rationale: Dans cette série de dispositions nuisibles, le sens négatif « jaloux » convient mieux que « zélé », tout en reflétant la valeur possible du terme grec.
- source_word: ἐριστικός
  choice: querelleur
  rationale: Exprime naturellement une personne portée aux disputes et aux rivalités.
- source_word: θυμικός
  choice: emporté
  rationale: Distingue ce terme de ὀργίλος et rend l'idée d'une personne dominée par des accès de vive colère.
- source_word: γεννῶνται
  choice: naissent
  rationale: Préserve l'image forte du grec selon laquelle les meurtres « naissent » de ces dispositions.
theological_decisions:
- issue: Nature du lien entre les dispositions intérieures et le meurtre
  choice: « conduit au meurtre » et « de tout cela naissent des meurtres »
  alternative: « peut conduire au meurtre »
  rationale: Le grec formule un lien moral direct sans modalisation. La traduction conserve cette force exhortative sans ajouter « peut ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’impératif adressé au singulier, la progression de la colère vers le meurtre, ainsi que la métaphore finale de la naissance, tout en évitant de confondre ὀργίλος et θυμικός.
