id: DID.6.2
reference: Didache 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: fr
  text: Car, si tu peux porter tout le joug du Seigneur, tu seras parfait ; mais si tu ne le peux pas, fais ce que tu peux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  choice: porter
  rationale: Rend directement l’idée de soutenir ou d’assumer un joug, tout en restant naturel en français.
- source_word: ὅλον τὸν ζυγὸν τοῦ Κυρίου
  choice: tout le joug du Seigneur
  rationale: Conserve l’image métaphorique et la portée totale exprimée par ὅλον, sans expliciter ce que le texte laisse implicite.
- source_word: τέλειος
  choice: parfait
  rationale: Correspond au sens usuel de τέλειος, qui peut évoquer la perfection, l’accomplissement ou la maturité ; « parfait » préserve ici la tension du grec.
- source_word: ὃ δύνῃ τοῦτο ποίει
  choice: fais ce que tu peux
  rationale: Formulation idiomatique qui restitue fidèlement l’injonction de faire ce dont on est capable.
theological_decisions:
- issue: Portée du « joug du Seigneur »
  choice: Maintenir l’expression sans l’expliquer
  alternative: Préciser qu’il s’agit de l’ensemble des commandements ou de la voie chrétienne
  rationale: Le référent exact n’est pas explicité dans ce verset ; le traduire par une interprétation particulière réduirait son ouverture.
- issue: Sens de τέλειος
  choice: « parfait »
  alternative: « accompli » ou « mûr »
  rationale: « Parfait » conserve la formulation forte du texte et son possible arrière-plan moral ou spirituel, sans trancher entre perfection et plein accomplissement.
translation_notes:
  register: Français moderne, simple et digne. Le tutoiement singulier reflète les formes grecques de la deuxième personne du singulier et s’accorde avec l’adresse directe du passage.
