source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῆς βρώσεως, ὃ δύνασαι βάστασον· ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε· λατρεία γάρ ἐστι θεῶν νεκρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: fr
  text: Quant à la nourriture, supporte ce que tu peux ; mais prends bien garde aux aliments sacrifiés aux idoles, car c’est un culte rendu à des dieux morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώσεως
  choice: nourriture
  rationale: Terme général qui conserve la portée du grec et le lien avec les prescriptions alimentaires du contexte.
- source_word: βάστασον
  choice: porte
  rationale: Rend directement l’image de porter une charge ou une exigence, sans la réduire à « faire » ni en préciser indûment la nature.
- source_word: εἰδωλοθύτου
  choice: viandes sacrifiées aux idoles
  rationale: Dans l’usage juif et chrétien ancien, le terme désigne couramment les aliments, notamment la viande, offerts en sacrifice aux idoles; cette formulation est claire en français moderne.
- source_word: λίαν πρόσεχε
  choice: garde-toi avec grand soin
  rationale: Exprime l’avertissement fortement accentué du grec tout en restant naturel et digne.
- source_word: λατρεία
  choice: culte rendu
  rationale: Traduit l’idée de service cultuel ou d’adoration, avec un complément qui rend la syntaxe française naturelle.
- source_word: θεῶν νεκρῶν
  choice: dieux morts
  rationale: Conserve la formulation polémique et paradoxale du texte grec sans l’atténuer.
theological_decisions:
- issue: Nature de l’instruction « porte ce que tu peux »
  choice: Conserver l’image de la charge sans préciser s’il s’agit d’observances alimentaires ou d’un renoncement ascétique.
  alternative: « Observe les règles que tu peux » ou « supporte ce que tu peux »
  rationale: Le grec βάστασον maintient une certaine ambiguïté sur ce qui doit être porté; la traduction ne doit pas imposer une interprétation particulière.
- issue: Rapport entre les viandes idolâtres et le culte
  choice: « car c’est un culte rendu à des dieux morts »
  alternative: « car en manger, c’est adorer des dieux morts »
  rationale: Le grec ne formule pas explicitement « en manger » ni ne remplace λατρεία par un verbe; la formulation retenue préserve la densité et la tension de l’énoncé.
translation_notes:
  register: Français international moderne, sobre et dignifié. Le tutoiement singulier suit les impératifs grecs au singulier. La première phrase conserve volontairement l’image inhabituelle de « porter » afin de respecter le texte source.
