    rationale: « Porte ce que tu peux » est très littéral mais inhabituel en français moderne ; « supporte ce que tu peux » conserve l’ambiguïté de l’objet à porter tout en étant plus naturel.
  revised_text: Quant à la nourriture, supporte ce que tu peux ; mais prends bien garde aux aliments sacrifiés aux idoles, car c’est un culte rendu à des dieux morts.
