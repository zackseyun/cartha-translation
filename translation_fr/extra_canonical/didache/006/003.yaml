  source_fidelity: 'Le sens général est bien rendu. Toutefois, εἰδωλόθυτον désigne ici ce qui a été offert aux idoles, sans limiter nécessairement le référent à la viande ; « aliments » préserve mieux l’extension du grec. βάστασον garde une formulation elliptique et imagée : « supporte » est plus idiomatique en français tout en conservant cette indétermination.'
