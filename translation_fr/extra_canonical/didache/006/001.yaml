id: DID.6.1
reference: Didache 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: fr
  text: Veille à ce que personne ne t’égare loin de cette voie de l’enseignement, car celui qui agit ainsi t’enseigne en dehors de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  choice: Veille à ce que personne ne t’égare
  rationale: La tournure rend naturellement en français l’impératif de vigilance suivi de μή et du subjonctif, tout en conservant l’idée d’égarement portée par πλανάω.
- source_word: ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  choice: loin de cette voie de l’enseignement
  rationale: « Voie » préserve l’image structurante de ὁδός dans la Didachè, et « de l’enseignement » maintient le génitif sans le réduire à une simple doctrine.
- source_word: ἐπεὶ
  choice: car
  rationale: Introduit clairement le motif ou la justification de l’avertissement.
- source_word: παρεκτὸς Θεοῦ
  choice: en dehors de Dieu
  rationale: Rend au plus près l’expression grecque, qui peut suggérer un enseignement séparé de Dieu, sans préciser davantage la relation théologique.
- source_word: σε διδάσκει
  choice: t’enseigne
  rationale: Conserve le destinataire singulier et le verbe central διδάσκω.
theological_decisions:
- issue: Référent implicite du sujet de « t’enseigne »
  choice: celui qui agit ainsi
  alternative: il
  rationale: Le grec laisse le sujet sous-entendu. Cette formulation rattache naturellement le verbe à la personne qui égare, sans introduire un référent masculin ambigu en français.
- issue: Sens de παρεκτὸς Θεοῦ
  choice: en dehors de Dieu
  alternative: sans Dieu
  rationale: « En dehors de Dieu » conserve la formulation relationnelle et l’ambiguïté du grec; « sans Dieu » serait plus idiomatique mais pourrait accentuer l’idée d’absence ou d’impiété.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier reflète les formes σε. La répétition liée à l’enseignement est conservée, car elle appartient au raisonnement du texte.
