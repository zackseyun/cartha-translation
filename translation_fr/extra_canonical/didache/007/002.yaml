id: DID.7.2
reference: Didache 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ μὴ ἔχῃς ὕδωρ ζῶν, εἰς ἄλλο ὕδωρ βάπτισον· εἰ δʼ οὐ δύνασαι ἐν ψυχρῷ, ἐν θερμῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: fr
  text: Mais si tu n’as pas d’eau vive, baptise dans une autre eau ; et si tu ne peux pas le faire dans de l’eau froide, fais-le dans de l’eau chaude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδωρ ζῶν
  choice: eau vive
  rationale: Expression française traditionnelle et naturelle qui conserve ici le sens concret d’eau courante, sans exclure les résonances symboliques de la formule.
- source_word: εἰς ἄλλο ὕδωρ βάπτισον
  choice: baptise dans une autre eau
  rationale: Dans ce contexte rituel, « dans » exprime naturellement le milieu où le baptême est accompli ; une traduction mécanique par « en/vers une autre eau » serait moins idiomatique.
- source_word: ἐν ψυχρῷ, ἐν θερμῷ
  choice: dans de l’eau froide… dans de l’eau chaude
  rationale: Le nom « eau » est sous-entendu en grec ; le rétablir dans les deux membres rend l’opposition claire et naturelle en français.
theological_decisions:
- issue: Sens de « eau vive »
  choice: Conserver « eau vive » dans le texte
  alternative: Traduire explicitement par « eau courante »
  rationale: « Eau vive » reproduit l’expression grecque et préserve à la fois son sens concret probable et sa possible portée symbolique, sans imposer une interprétation.
- issue: Mode précis du baptême
  choice: Employer la formulation neutre « baptise dans une autre eau »
  alternative: Préciser l’immersion ou l’aspersion
  rationale: Le verset ne précise pas à lui seul le geste exact ; la traduction ne doit pas introduire une pratique confessionnelle particulière.
translation_notes:
  register: Tutoiement conservé, conformément au singulier grec. Style direct, digne et accessible. L’ajout de « le faire » et la répétition de « eau » explicitent les ellipses grecques sans modifier le sens.
