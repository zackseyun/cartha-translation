reference: Didache 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
translation:
  language: fr
  text: 'Quant au baptême, baptisez ainsi : après avoir préalablement dit toutes ces choses,[a] baptisez au nom du Père, du Fils et du Saint-Esprit, dans de l’eau vive.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir dit auparavant toutes ces choses » ; il s’agit vraisemblablement des enseignements qui précèdent.'
    reason: Préserver la valeur temporelle de προειπόντες et signaler son référent contextuel probable sans le rendre certain.
  - marker: b
    text: C’est-à-dire de l’eau courante ou jaillissante.
    reason: Clarifier le sens idiomatique de ὕδωρ ζῶν tout en conservant « eau vive » dans le texte.
lexical_decisions:
- source_word: Περὶ δὲ τοῦ βαπτίσματος
  choice: Quant au baptême
  rationale: « Quant à » rend naturellement le changement de sujet marqué par περὶ δέ, sans ajouter un adverbe temporel absent du grec.
- source_word: ταῦτα πάντα προειπόντες
  choice: après avoir dit au préalable toutes ces choses
  rationale: προειπόντες signifie ici « avoir dit auparavant/au préalable », probablement en référence à l’enseignement précédent; « proclamé » serait plus solennel et moins précis lexicalement.
- source_word: βαπτίσατε εἰς τὸ ὄνομα
  choice: baptisez au nom
  rationale: La tournure française consacrée et naturelle « au nom de » rend la formule grecque εἰς τὸ ὄνομα sans imposer la formulation peu idiomatique « dans le nom ».
- source_word: ἐν ὕδατι ζῶντι
  choice: dans de l’eau vive
  rationale: « Eau vive » conserve l’expression ancienne désignant naturellement une eau courante ou jaillissante, tout en préservant sa force littérale.
theological_decisions:
- issue: Formule baptismale trinitaire
  choice: au nom du Père, du Fils et du Saint-Esprit
  alternative: dans le nom du Père, du Fils et du Saint-Esprit
  rationale: La formulation française usuelle reste fidèle à la construction et n’ajoute aucune interprétation doctrinale.
- issue: Nature de l’eau vive
  choice: Conserver « eau vive » dans le texte et expliciter son sens concret en note
  alternative: eau courante
  rationale: Le grec peut évoquer littéralement une eau vivante, mais désigne conventionnellement une eau qui coule; garder l’image dans le texte préserve sa texture et son éventuelle portée symbolique.
translation_notes:
  register: Français moderne, clair et digne. L’impératif pluriel « baptisez » est conservé. La répétition de « baptisez », présente dans le grec, est maintenue pour respecter la structure directive du passage.
