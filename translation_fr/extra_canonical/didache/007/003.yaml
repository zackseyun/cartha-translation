id: DID.7.3
reference: Didache 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς, ἔκχεον εἰς τὴν κεφαλὴν τρὶς ὕδωρ εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
translation:
  language: fr
  text: Mais si tu n’as ni l’une ni l’autre[a], verse trois fois de l’eau sur la tête, au nom du Père, du Fils et du Saint-Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si tu n’as pas les deux »; il s’agit des deux sortes d’eau mentionnées précédemment.'
    reason: Le référent de ἀμφότερα dépend du contexte antérieur; la note explicite cette reprise, tandis que le texte principal adopte une formulation française naturelle.
lexical_decisions:
- source_word: ἀμφότερα
  choice: ni l’une ni l’autre
  rationale: Le neutre pluriel renvoie aux deux possibilités d’eau mentionnées dans le contexte précédent. Cette formulation française exprime naturellement l’absence des deux.
- source_word: ἔκχεον
  choice: verse
  rationale: Impératif singulier de ἐκχέω, rendu directement et naturellement.
- source_word: εἰς τὴν κεφαλήν
  choice: sur la tête
  rationale: Dans ce contexte concret, le français idiomatique dit verser de l’eau « sur la tête » plutôt que « dans la tête ».
- source_word: τρὶς
  choice: trois fois
  rationale: Équivalent direct de l’adverbe grec.
- source_word: εἰς ὄνομα
  choice: au nom de
  rationale: Formule française consacrée et naturelle, qui rend ici la portée rituelle de l’expression grecque sans imposer le calque « dans le nom ».
- source_word: Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος
  choice: du Père, du Fils et du Saint-Esprit
  rationale: Les noms sans article en grec demeurent définis dans cette construction. Les articles contractés français sont donc nécessaires; « Saint-Esprit » est la désignation française courante et digne.
theological_decisions:
- issue: Formule baptismale trinitaire et absence d’articles grecs
  choice: au nom du Père, du Fils et du Saint-Esprit
  alternative: au nom de Père, Fils et Saint-Esprit
  rationale: L’absence d’articles dans la chaîne de génitifs grecque n’indique pas des référents indéfinis. La formulation retenue préserve leur caractère défini et correspond à l’usage naturel du français, sans ajouter de précision doctrinale.
translation_notes:
  register: Tutoiement conservé pour l’instruction adressée à une personne. Style direct, sobre et liturgiquement reconnaissable, tout en restant accessible en français international moderne.
