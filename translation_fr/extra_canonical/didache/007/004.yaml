id: DID.7.4
reference: Didache 7:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: fr
  text: Mais avant le baptême, que celui qui baptise, celui qui va être baptisé et tous les autres qui le peuvent jeûnent au préalable ; tu ordonneras à celui qui va être baptisé de jeûner un ou deux jours à l’avance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προνηστευσάτω
  choice: jeûnent au préalable
  rationale: Le préverbe προ- indique que le jeûne doit avoir lieu avant le baptême ; la tournure française conserve explicitement cette antériorité.
- source_word: ὁ βαπτίζων / ὁ βαπτιζόμενος
  choice: celui qui baptise / celui qui va être baptisé
  rationale: Ces formulations distinguent clairement l’officiant du récipiendaire ; « va être baptisé » rend naturellement la valeur contextuelle du participe passif avant la célébration.
- source_word: κελεύσεις
  choice: tu ordonneras
  rationale: Le futur à valeur prescriptive et le sens fort de κελεύω sont conservés sans atténuation.
- source_word: πρὸ μιᾶς ἢ δύο
  choice: un ou deux jours à l’avance
  rationale: « Jours » est l’ellipse naturellement sous-entendue en grec ; la formulation française exprime clairement les deux durées possibles.
theological_decisions:
- issue: Étendue du jeûne préparatoire
  choice: Le baptisant et le futur baptisé doivent jeûner, avec quelques autres s’ils le peuvent.
  alternative: Présenter le jeûne des autres comme une obligation générale.
  rationale: La proposition conditionnelle εἴ τινες ἄλλοι δύνανται limite explicitement la participation des autres à ceux qui en ont la capacité.
- issue: Durée du jeûne du futur baptisé
  choice: Conserver l’alternative « un ou deux jours ».
  alternative: Imposer uniformément deux jours de jeûne.
  rationale: Le grec πρὸ μιᾶς ἢ δύο maintient expressément une alternative et ne permet pas de privilégier l’une des deux durées.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prescriptive du passage est conservée, avec une ponctuation qui distingue la recommandation collective de l’ordre particulier adressé au futur baptisé.
