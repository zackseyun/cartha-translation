  verdict: revise
  source_fidelity: 'La structure exhortative, la condition de réconciliation mutuelle et la finalité cultuelle sont bien rendues. Toutefois, « prochain » élargit et moralise ἑταῖρος, qui désigne plus directement le compagnon ou associé concerné. « Assemblée » explicite un cadre contextuellement plausible, mais qui n’est pas exprimé dans ce verset : συνελθέτω ὑμῖν signifie simplement « se réunir avec vous ».'
  naturalness: La formulation révisée reste fluide, sobre et idiomatique en français moderne. Le pluriel « ils » exprime naturellement la réciprocité de la réconciliation entre la personne en conflit et son compagnon.
  terminology: « Différend » convient pour ἀμφιβολία. « Compagnon » conserve la relation indéterminée de ἑταῖρος sans l’élargir à la notion théologique de « prochain ». « Souillé » rend directement κοινωθῇ, l’idée que le sacrifice soit rendu impur ou contaminé; il n’identifie pas davantage la nature de θυσία.
