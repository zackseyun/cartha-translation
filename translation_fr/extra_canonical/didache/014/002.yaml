id: DID.14.2
reference: Didache 14:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: fr
  text: Mais que toute personne qui a un différend avec son compagnon ne se réunisse pas avec vous avant qu’ils ne se soient réconciliés, afin que votre sacrifice ne soit pas souillé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφιβολίαν
  choice: un différend
  rationale: Dans ce contexte, le terme désigne un désaccord ou une querelle entre personnes; « différend » rend naturellement cette idée sans préciser indûment sa gravité.
- source_word: ἑταίρου
  choice: son prochain
  rationale: Le mot désigne ici l’autre personne avec laquelle on est en relation. « Prochain » convient au registre communautaire et moral, sans limiter le lien à l’amitié.
- source_word: συνελθέτω ὑμῖν
  choice: ne se joigne pas à votre assemblée
  rationale: Le verbe signifie littéralement « se réunir avec ». La mention de l’assemblée explicite naturellement le rassemblement cultuel visé par le contexte.
- source_word: διαλλαγῶσιν
  choice: ils ne se soient réconciliés
  rationale: La forme réciproque appelle une réconciliation entre les deux parties; le pluriel français préserve cette réciprocité.
- source_word: κοινωθῇ
  choice: soit profané
  rationale: Le verbe exprime le fait de rendre commun ou impur ce qui est consacré. « Profané » restitue ici clairement la dimension cultuelle.
- source_word: θυσία
  choice: sacrifice
  rationale: Le terme grec désigne explicitement un sacrifice ou une offrande; la traduction littérale conserve la portée cultuelle sans en fixer davantage l’interprétation.
theological_decisions:
- issue: Nature du « sacrifice »
  choice: Conserver « votre sacrifice » sans l’identifier davantage.
  alternative: Préciser qu’il s’agit de l’eucharistie, d’une offrande ou de la prière communautaire.
  rationale: Le grec emploie simplement θυσία. Une identification plus précise importerait une interprétation que ce verset ne formule pas explicitement.
- issue: Participation de la personne en conflit
  choice: Rendre l’interdiction comme le fait de se joindre à l’assemblée.
  alternative: La limiter explicitement à la communion ou au repas eucharistique.
  rationale: συνελθέτω ὑμῖν parle du rassemblement avec la communauté; le contexte peut être liturgique, mais le texte ne nomme pas ici un rite particulier.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve l’enchaînement exhortation–réconciliation–but du grec, tout en formulant naturellement la participation au rassemblement communautaire.
