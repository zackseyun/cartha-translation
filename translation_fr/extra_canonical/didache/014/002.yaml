  - severity: medium
    issue: « son prochain » pour ἑταίρου
    rationale: Le grec vise le compagnon, associé ou partenaire de la personne, non le « prochain » au sens moral ou communautaire large. Cette dernière expression introduit une coloration absente du terme source.
  - severity: low
    issue: « votre assemblée » pour συνελθέτω ὑμῖν
    rationale: Le contexte permet de comprendre un rassemblement communautaire, mais le verset dit littéralement de ne pas se réunir « avec vous ». L’ajout d’« assemblée » réduit légèrement l’explicitation interprétative.
  - severity: low
    issue: « profané » pour κοινωθῇ
    rationale: « Profané » est possible en contexte cultuel, mais « souillé » reflète plus directement l’idée de rendre impur ou commun, sans accentuer l’idée d’une violation volontaire du sacré.
  revised_text: Mais que toute personne qui a un différend avec son compagnon ne se réunisse pas avec vous avant qu’ils ne se soient réconciliés, afin que votre sacrifice ne soit pas souillé.
