id: DID.14.1
reference: Didache 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
translation:
  language: fr
  text: Mais le jour du Seigneur, une fois rassemblés, rompez le pain et rendez grâce, après avoir d’abord confessé vos fautes, afin que votre sacrifice soit pur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  choice: Mais le jour du Seigneur
  rationale: L’expression désigne le jour appartenant au Seigneur. Cette formulation naturelle conserve l’accent redoublé de κυριακή et Κυρίου sans produire en français une répétition maladroite.
- source_word: συναχθέντες
  choice: une fois rassemblés
  rationale: Le participe aoriste indique que le rassemblement précède les actions principales; la tournure reste fluide sans préciser au-delà du grec qui organise le rassemblement.
- source_word: κλάσατε ἄρτον
  choice: rompez le pain
  rationale: Rend directement l’expression grecque traditionnelle et préserve sa possible portée communautaire ou cultuelle.
- source_word: εὐχαριστήσατε
  choice: rendez grâce
  rationale: Dans ce contexte, le verbe signifie remercier ou rendre grâce; cette expression française est naturelle et garde la tonalité cultuelle possible.
- source_word: προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν
  choice: après avoir d’abord confessé vos fautes
  rationale: προ- marque l’antériorité de la confession; « fautes » traduit παραπτώματα sans l’alourdir ni en restreindre le sens à une catégorie doctrinale précise.
- source_word: θυσία
  choice: sacrifice
  rationale: Équivalent direct qui conserve la force cultuelle et la tension théologique du texte, sans remplacer le terme par « offrande » ou l’identifier explicitement au pain.
theological_decisions:
- issue: Nature du « sacrifice »
  choice: Conserver « votre sacrifice » sans l’expliquer
  alternative: Préciser qu’il s’agit du repas eucharistique, du pain ou d’une offrande de louange
  rationale: Le grec ne définit pas explicitement le référent de θυσία dans ce verset; l’expliciter résoudrait une ambiguïté réelle.
- issue: Portée de « rendez grâce »
  choice: Employer le verbe courant « rendez grâce »
  alternative: Employer « célébrez l’eucharistie »
  rationale: εὐχαριστήσατε peut avoir une portée liturgique dans le contexte, mais le traduire par un nom institutionnel imposerait une interprétation plus précise que la forme verbale grecque.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs au pluriel sont conservés. La syntaxe marque clairement l’ordre des actions tout en évitant la répétition pesante de « après ».
