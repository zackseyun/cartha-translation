id: DID.14.3
reference: Didache 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὕτη γάρ ἐστιν ἡ ῥηθεῖσα ὑπὸ Κυρίου· Ἐν παντὶ τόπῳ καὶ χρόνῳ προσφέρειν μοι θυσίαν καθαράν· ὅτι βασιλεὺς μέγας εἰμί, λέγει Κύριος, καὶ τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
translation:
  language: fr
  text: 'Car tel est le sacrifice dont le Seigneur a parlé : « En tout lieu et en tout temps, offrez-moi un sacrifice pur, car je suis un grand Roi, dit le Seigneur, et mon nom est admirable parmi les nations. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη ... ἡ ῥηθεῖσα
  choice: tel est le sacrifice dont le Seigneur a parlé
  rationale: Le démonstratif et le participe sont féminins et renvoient naturellement à θυσία, « sacrifice », dans le contexte précédent. Cette formulation française rend explicite l’antécédent grammatical sans présenter ῥηθεῖσα comme signifiant à lui seul « sacrifice ».
- source_word: ἐν παντὶ τόπῳ καὶ χρόνῳ
  choice: en tout lieu et en tout temps
  rationale: Rend directement les deux expressions distributives tout en conservant la portée universelle de la citation.
- source_word: προσφέρειν
  choice: offrez
  rationale: L’infinitif grec dépend d’une formulation citationnelle et a ici une valeur injonctive; l’impératif est naturel en français.
- source_word: θυσίαν καθαράν
  choice: un sacrifice pur
  rationale: Traduction directe qui conserve le vocabulaire cultuel et ne précise pas davantage la nature du sacrifice.
- source_word: θαυμαστόν
  choice: admirable
  rationale: Exprime ce qui suscite l’émerveillement et le respect; « admirable » convient au registre solennel sans exagération.
- source_word: ἐν τοῖς ἔθνεσι
  choice: parmi les nations
  rationale: Conserve la portée collective de ἔθνη et l’expression biblique naturelle en français.
theological_decisions:
- issue: Antécédent de αὕτη ἡ ῥηθεῖσα
  choice: Identifier explicitement « le sacrifice » comme antécédent
  alternative: « Car voici ce qui a été dit par le Seigneur »
  rationale: L’accord féminin de αὕτη et ῥηθεῖσα s’explique le plus naturellement par le féminin θυσία du contexte immédiat. La traduction préserve ainsi l’argument du texte sans ajouter une qualification eucharistique absente de ce verset.
- issue: Nature du « sacrifice pur »
  choice: Ne pas l’expliciter dans la traduction
  alternative: Le qualifier d’offrande eucharistique ou spirituelle
  rationale: Le verset emploie simplement θυσίαν καθαράν; toute identification doctrinale plus précise doit venir du contexte et non être introduite dans le texte traduit.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde la solennité de la citation prophétique tout en évitant une tournure archaïque.
