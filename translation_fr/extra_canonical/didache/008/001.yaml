id: DID.8.1
reference: Didache 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: fr
  text: Que vos jeûnes ne coïncident pas avec ceux des hypocrites. En effet, ils jeûnent le deuxième et le cinquième jour de la semaine ; vous, jeûnez le quatrième jour et le jour de la Préparation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « jour de la Préparation » est le vendredi, jour où l’on préparait ce qui était nécessaire avant le sabbat.
    reason: Le sens historique de παρασκευή n’est pas immédiatement transparent pour tous les lecteurs modernes.
lexical_decisions:
- source_word: μετὰ τῶν ὑποκριτῶν
  choice: ne coïncident pas avec ceux des hypocrites
  rationale: Dans ce contexte de jours de jeûne, μετά exprime naturellement l’association ou la concomitance. Cette formulation française communique clairement que les jeûnes ne doivent pas avoir lieu aux mêmes jours, sans réduire l’expression à une simple proximité sociale.
- source_word: δευτέρα σαββάτων
  choice: le deuxième jour de la semaine
  rationale: Expression sémitisante désignant le lundi, littéralement le deuxième jour compté dans la semaine. La traduction conserve le mode de désignation du texte grec.
- source_word: πέμπτῃ
  choice: le cinquième jour de la semaine
  rationale: Désigne le jeudi selon le décompte hebdomadaire ; l’explicitation « de la semaine » rend le parallélisme intelligible en français.
- source_word: τετράδα
  choice: le quatrième jour
  rationale: Désigne le mercredi. Le choix maintient la nomenclature numérique du grec et le parallélisme avec les autres jours.
- source_word: παρασκευήν
  choice: le jour de la Préparation
  rationale: Terme consacré pour le jour de préparation précédant le sabbat, c’est-à-dire le vendredi. La traduction formelle préserve la coloration juive ancienne, avec une note explicative.
theological_decisions:
- issue: Sens de l’opposition avec les « hypocrites »
  choice: Présenter une différence de calendrier de jeûne sans identifier davantage le groupe.
  alternative: Identifier explicitement les « hypocrites » à un courant ou à des responsables religieux précis.
  rationale: Le verset ne nomme pas le groupe. La traduction conserve donc son indétermination et évite d’importer une identification historique ou confessionnelle non exprimée.
translation_notes:
  register: Français moderne, clair et digne. Les jours restent désignés selon le décompte antique afin de préserver la forme du grec ; la seule expression potentiellement opaque, « jour de la Préparation », est expliquée en note.
