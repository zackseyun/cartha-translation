source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
translation:
  language: fr
  text: 'Ne priez pas non plus comme les hypocrites, mais comme le Seigneur l’a ordonné dans son Évangile, priez ainsi :


    Notre Père qui es au ciel,


    que ton nom soit sanctifié,


    que ton règne vienne,


    que ta volonté soit faite,


    comme au ciel, ainsi sur la terre.


    Donne-nous aujourd’hui notre pain pour ce jour[a],


    et remets-nous notre dette,


    comme nous aussi la remettons à nos débiteurs.


    Ne nous fais pas entrer dans l’épreuve[b],


    mais délivre-nous du mal[c] ;


    car c’est à toi qu’appartiennent la puissance et la gloire pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec est rare et son sens précis est discuté. Il peut aussi désigner le pain nécessaire, le pain quotidien ou le pain du jour à venir.
    reason: Préserver l’incertitude lexicale de ἐπιούσιον.
  - marker: b
    text: Ou « dans la tentation ». Le mot grec peut désigner aussi bien une épreuve qu’une tentation.
    reason: Signaler les deux sens principaux de πειρασμόν sans trancher silencieusement.
  - marker: c
    text: Ou « du Mauvais ». Le grec τοῦ πονηροῦ peut être compris comme neutre (« le mal ») ou masculin (« le Mauvais »).
    reason: Préserver l’ambiguïté grammaticale de τοῦ πονηροῦ dans une formulation française claire.
lexical_decisions:
- source_word: Μηδὲ
  choice: Ne… pas non plus
  rationale: Rend la négation coordonnée qui prolonge les consignes précédentes, tout en restant naturelle en français.
- source_word: ἐπιούσιον
  choice: pour ce jour
  rationale: Formulation claire adaptée à la demande présente, avec une note signalant l’incertitude exceptionnelle de ce terme grec.
- source_word: ὀφειλὴν / ὀφειλέταις
  choice: dette / débiteurs
  rationale: Conserve la métaphore financière et le singulier du texte grec au lieu de l’interpréter directement comme « fautes » ou « offenses ».
- source_word: πειρασμόν
  choice: épreuve
  rationale: Le terme peut désigner une épreuve ou une tentation ; « épreuve » évite de suggérer que Dieu incite directement au péché, sans effacer l’autre sens, indiqué en note.
- source_word: τοῦ πονηροῦ
  choice: du mal
  rationale: Le génitif grec peut être compris au neutre (« le mal ») ou au masculin (« le Mauvais ») ; le texte principal retient une formulation française naturelle et la note préserve l’autre lecture.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent français actuel et digne de l’expression idiomatique grecque exprimant une durée sans fin.
theological_decisions:
- issue: Sens de τοῦ πονηροῦ
  choice: du mal
  alternative: du Mauvais / du Malin
  rationale: La forme grecque autorise aussi bien une référence impersonnelle au mal qu’une référence personnelle au Mauvais ; aucune des deux ne doit être imposée sans signaler l’autre.
- issue: Sens de πειρασμόν
  choice: l’épreuve
  alternative: la tentation
  rationale: Les deux valeurs sont possibles. « Épreuve » convient au champ sémantique large du grec, tandis que la note maintient explicitement la lecture « tentation ».
- issue: Doxologie finale
  choice: car c’est à toi qu’appartiennent la puissance et la gloire pour toujours
  alternative: car à toi sont la puissance et la gloire dans les siècles
  rationale: La traduction conserve intégralement la doxologie attestée dans la source de la Didachè, dans un français moderne plutôt que dans une tournure liturgique archaïsante.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est conservé dans la prière conformément au singulier grec et à l’usage biblique français courant. La disposition en lignes met en valeur les demandes successives sans ajouter de structure absente du texte.
