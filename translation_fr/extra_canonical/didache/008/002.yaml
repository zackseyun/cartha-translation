  terminology: Les choix « dette / débiteurs », « épreuve » et « du mal » sont défendables et les notes préservent correctement les ambiguïtés lexicales pertinentes. « Pour toujours » rend naturellement εἰς τοὺς αἰῶνας dans ce registre.
