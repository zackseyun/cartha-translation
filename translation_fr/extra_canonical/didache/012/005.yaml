id: DID.12.5
reference: Didache 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: fr
  text: Mais s’il ne veut pas agir ainsi, c’est un trafiquant du Messie. Gardez-vous de telles personnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χριστέμπορος
  choice: trafiquant du Messie
  rationale: Ce mot composé rare et péjoratif désigne quelqu’un qui fait commerce du Christ/Messie, c’est-à-dire qui exploite son nom à son profit. « Trafiquant » conserve l’image commerciale et la condamnation morale, tandis que « du Messie » suit le sens du titre χριστός.
- source_word: προσέχετε ἀπό
  choice: Gardez-vous de
  rationale: Cette tournure française naturelle rend l’impératif de vigilance et l’idée de se tenir à l’écart exprimée par ἀπό.
- source_word: τῶν τοιούτων
  choice: de telles personnes
  rationale: Le pluriel substantivé désigne des gens de cette sorte; « personnes » reste inclusif et naturel.
theological_decisions:
- issue: Rendu du composant χριστ- dans χριστέμπορος
  choice: Messie
  alternative: Christ
  rationale: χριστός est ici intégré à un composé désignant celui qui marchande ou exploite le Messie. « Messie » rend le titre grec sans faire de « Christ » un nom propre opaque, tout en préservant la force polémique du néologisme.
translation_notes:
  register: Français moderne, digne et direct. « Trafiquant du Messie » conserve le caractère frappant du composé grec; « Gardez-vous » maintient le ton ferme de l’exhortation.
source_grounding:
  english_pob_role: consult_only
