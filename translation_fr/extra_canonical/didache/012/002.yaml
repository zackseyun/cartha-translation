id: DID.12.2
reference: Didache 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
translation:
  language: fr
  text: Si celui qui arrive est de passage, aidez-le autant que vous le pouvez ; mais il ne restera chez vous que deux ou trois jours, si c’est nécessaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρόδιος
  choice: de passage
  rationale: Désigne ici une personne en voyage, qui ne fait que passer ; cette expression est naturelle en français et convient au contexte d’hospitalité.
- source_word: βοηθεῖτε
  choice: aidez-le
  rationale: Rend directement l’impératif présent, sans préciser une forme particulière d’assistance que le grec ne précise pas.
- source_word: ὅσον δύνασθε
  choice: autant que vous le pouvez
  rationale: Expression française courante qui conserve la limite imposée par les moyens des destinataires.
- source_word: πρὸς ὑμᾶς
  choice: chez vous
  rationale: Dans le contexte du séjour et de l’accueil, « chez vous » rend naturellement la présence auprès de la communauté.
- source_word: εἰ μὴ δύο ἢ τρεῖς ἡμέρας
  choice: que deux ou trois jours
  rationale: La tournure restrictive « ne… que » exprime que le séjour est limité à deux ou trois jours.
- source_word: ἐὰν ᾖ ἀνάγκη
  choice: si c’est nécessaire
  rationale: Conserve la condition explicitement exprimée, sans en faire une permission de dépasser la durée indiquée.
theological_decisions:
- issue: Portée de la condition finale ἐὰν ᾖ ἀνάγκη
  choice: La nécessité conditionne le séjour de deux ou trois jours.
  alternative: La nécessité permettrait de rester au-delà de deux ou trois jours.
  rationale: La construction οὐ… εἰ μὴ délimite le séjour autorisé ; la proposition conditionnelle finale ne constitue pas une dérogation permettant de dépasser cette limite.
translation_notes:
  register: Français international moderne, simple et digne. Le futur normatif « il ne restera » préserve le ton direct de l’instruction grecque. La ponctuation maintient le contraste marqué par δέ entre l’aide généreuse et la durée limitée du séjour.
