source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
translation:
  language: fr
  text: Mais que toute personne qui vient au nom du Seigneur soit accueillie. Ensuite, après l’avoir mise à l’épreuve, vous saurez à quoi vous en tenir,[a] car vous aurez une intelligence de la droite et de la gauche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous saurez ». Le grec n’exprime pas de complément après ce verbe.'
    reason: Préserve l'emploi absolu de γνώσεσθε sans suggérer qu'un pronom objet est présent ou requis.
  - marker: b
    text: L’expression « la droite et la gauche » évoque la capacité de distinguer et de juger, sans que les deux termes soient précisés davantage.
    reason: L'image grecque est concise et potentiellement idiomatique; la note en indique la portée générale sans l'identifier exclusivement au bien et au mal.
lexical_decisions:
- source_word: Πᾶς δὲ ὁ ἐρχόμενος
  choice: Mais que toute personne qui vient
  rationale: Rend la portée universelle de Πᾶς et le participe substantivé par une formulation française inclusive et naturelle, sans limiter le référent aux hommes.
- source_word: ἐν ὀνόματι Κυρίου
  choice: au nom du Seigneur
  rationale: Expression française consacrée qui conserve la valeur d’autorité ou de représentation portée par le grec.
- source_word: δεχξήσθω
  choice: soit accueillie
  rationale: Le texte transmis présente vraisemblablement une faute pour δεχθήσθω. Le passif impératif est rendu directement, avec le sens d’accueillir ou de recevoir une personne.
- source_word: δοκιμάσαντες αὐτόν
  choice: après l’avoir mise à l’épreuve
  rationale: δοκιμάζω désigne ici l’examen destiné à vérifier la qualité ou l’authenticité du visiteur; le pronom français s’accorde avec «personne».
- source_word: γνώσεσθε
  choice: vous saurez à quoi vous en tenir
  rationale: Le verbe est employé sans complément exprimé. Cette tournure française restitue naturellement l’idée de parvenir à un jugement après examen, sans introduire la notion de connaissance personnelle.
- source_word: σύνεσιν … δεξιὰν καὶ ἀριστεράν
  choice: le discernement de la droite et de la gauche
  rationale: Conserve l’image inhabituelle du grec et sa possible portée idiomatique sans la réduire explicitement à une seule interprétation morale.
theological_decisions:
- issue: Accueil au nom du Seigneur et examen du visiteur
  choice: Maintenir ensemble l’ordre d’accueillir et celui d’éprouver ensuite la personne
  alternative: Présenter l’examen comme une condition préalable à l’accueil
  rationale: 'La succession grecque est explicite: accueil d’abord, examen ensuite. La traduction évite de modifier cet équilibre pastoral.'
- issue: Objet implicite de γνώσεσθε
  choice: Rendre le verbe par «vous saurez à quoi vous en tenir»
  alternative: «vous la connaîtrez» ou, littéralement, «vous saurez»
  rationale: αὐτόν dépend grammaticalement de δοκιμάσαντες, tandis que γνώσεσθε n’a pas d’objet exprimé. Le choix principal indique le résultat de l’examen sans suggérer une simple connaissance personnelle; la note préserve les autres possibilités.
- issue: Sens de «la droite et la gauche»
  choice: Conserver l’image telle quelle
  alternative: Expliciter par «le bien et le mal» ou «le vrai et le faux»
  rationale: Le texte ne définit pas précisément les deux pôles. Les expliciter dans le corps du texte résoudrait une ambiguïté réelle et pourrait importer une interprétation particulière.
translation_notes:
  register: Français moderne, international et digne. La formulation reste accessible tout en conservant l’image sémitisante ou idiomatique de «la droite et la gauche». «Toute personne» évite un masculin générique inutile, et «mise à l’épreuve» exprime un examen sérieux sans connotation hostile.
