revisions:
- from: Mais que toute personne qui vient au nom du Seigneur soit accueillie. Ensuite, après l’avoir mise à l’épreuve, vous saurez[a] à quoi vous en tenir, car vous aurez le discernement de la droite et de la gauche.[b]
  to: Mais que toute personne qui vient au nom du Seigneur soit accueillie. Ensuite, après l’avoir mise à l’épreuve, vous saurez à quoi vous en tenir,[a] car vous aurez une intelligence de la droite et de la gauche.[b]
  rationale: La révision conserve le sens contextuel naturel de γνώσεσθε dans le texte, tout en corrigeant la note qui présentait à tort un objet personnel comme une autre lecture. Elle resserre aussi le rendu de σύνεσιν … δεξιὰν καὶ ἀριστεράν afin de mieux préserver l'étrangeté et l'ambiguïté syntaxique de l'original.
