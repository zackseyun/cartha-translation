review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l'impératif passif (« soit accueillie »), la séquence accueil puis examen, et le caractère absolu de γνώσεσθε. Toutefois, « le discernement de la droite et de la gauche » atténue la construction grecque, où σύνεσιν est qualifié directement par « droite et gauche »; « une intelligence de la droite et de la gauche » la reproduit plus fidèlement sans résoudre l'image.
  naturalness: Le français est globalement naturel et d'un registre approprié. « Vous saurez à quoi vous en tenir » est idiomatique et convient bien à γνώσεσθε sans objet. « Intelligence de la droite et de la gauche » est volontairement inhabituel, à l'image de l'original, mais reste compréhensible avec une note.
  terminology: '« Seigneur », « au nom de », « accueillir » et « mettre à l''épreuve » sont appropriés. La note a contient une erreur de portée : « vous la connaîtrez » ne constitue pas une autre lecture du grec tel qu''il est ponctué et analysé, mais une explicitation interprétative ajoutant un objet à γνώσεσθε. Elle devrait être retirée pour ne pas contredire l''emploi absolu retenu par l''audit anglais.'
  issues:
  - severity: medium
    issue: La note a propose « vous la connaîtrez » comme lecture alternative.
    rationale: Dans δοκιμάσαντες αὐτὸν γνώσεσθε, αὐτόν est l'objet de δοκιμάσαντες; γνώσεσθε est employé absolument. Une traduction avec « la » peut être une paraphrase contextuelle, mais ne doit pas être présentée comme une lecture alternative du grec.
  - severity: low
    issue: « le discernement de la droite et de la gauche » est légèrement plus interprétatif que la formulation grecque.
    rationale: σύνεσις signifie d'abord intelligence, compréhension ou discernement. L'adjectivation inhabituelle « droite et gauche » est mieux préservée par « une intelligence de la droite et de la gauche », qui évite de donner à « discernement » une valeur trop explicitement évaluative.
