id: DID.12.4
reference: Didache 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
translation:
  language: fr
  text: Mais s’il n’a pas de métier, voyez, selon votre discernement, comment faire pour qu’un chrétien vive parmi vous sans rester oisif.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « voyez, selon votre discernement, comment faire pour qu’il vive parmi vous en tant que chrétien sans rester oisif ».'
    reason: Le grec permet de comprendre « chrétien » soit comme le sujet générique de « vive », soit comme l’attribut du visiteur déjà mentionné.
lexical_decisions:
- source_word: τέχνην
  choice: métier
  rationale: Dans ce contexte d’accueil et de subsistance, le terme désigne une compétence professionnelle ou un moyen de gagner sa vie; « métier » est naturel et précis en français moderne.
- source_word: κατὰ τὴν σύνεσιν ὑμῶν
  choice: selon votre discernement
  rationale: σύνεσις exprime ici l’intelligence pratique et le bon jugement; « discernement » conserve cette nuance sans alourdir la phrase.
- source_word: προνοήσατε
  choice: voyez … comment faire
  rationale: L’impératif demande de prévoir et de prendre les dispositions nécessaires. Cette tournure française s’accorde naturellement avec la proposition introduite par πῶς.
- source_word: ἀργός
  choice: oisif
  rationale: Le mot décrit celui qui ne travaille pas ou demeure inactif; « oisif » convient au registre digne du texte et au contexte.
theological_decisions:
- issue: Fonction syntaxique de χριστιανός
  choice: '« qu’il vive parmi vous en chrétien » : χριστιανός est compris comme attribut du sujet implicite, le voyageur mentionné dans le contexte.'
  alternative: '« qu’un chrétien vive parmi vous » : χριστιανός peut être lu comme le sujet générique de ζήσεται.'
  rationale: La condition « s’il n’a pas de métier » maintient naturellement comme sujet l’individu accueilli. Toutefois, le grec sans article permet aussi la lecture générique; celle-ci est signalée en note afin de préserver l’ambiguïté réelle.
- issue: Portée de la prévoyance communautaire
  choice: La formulation implique des dispositions permettant au visiteur de vivre sans oisiveté, sans préciser leur nature.
  alternative: Expliciter que la communauté doit lui procurer un travail.
  rationale: Le contexte peut suggérer un travail, mais le grec dit seulement de prévoir comment il vivra sans être oisif; la traduction n’ajoute donc aucune mesure particulière.
translation_notes:
  register: Français international moderne, naturel et digne. « Voyez … comment faire » évite une construction administrative tout en exprimant la prévoyance concrète demandée. Le marqueur [a] est placé à la fin de la proposition concernée.
