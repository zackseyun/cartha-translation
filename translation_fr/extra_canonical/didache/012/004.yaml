  source_fidelity: 'Le sens global est bien rendu : τέχνη est correctement compris comme un métier ou une compétence permettant de subsister, et προνοήσατε demande à la communauté de prendre des dispositions selon son bon jugement. Toutefois, « vivre parmi vous en chrétien » peut en français évoquer la manière de vivre chrétienne, nuance que le grec n''exprime pas nécessairement. χριστιανός peut aussi être le sujet générique postposé de ζήσεται ; cette lecture doit apparaître sans introduire cette nuance comportementale.'
