source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δὲ θέλει πρὸς ὑμᾶς καθίσαι, τεχνίτης ὤν, ἐργαζέσθω καὶ φαγέτω·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/003.yaml
  text: But if he wants to settle among you and is a craftsman, let him work and eat.
translation:
  language: fr
  text: Mais, s’il veut s’établir parmi vous et qu’il est artisan, qu’il travaille et qu’il mange.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσαι
  choice: s’établir
  rationale: Dans ce contexte d’accueil durable, le verbe exprime l’idée de demeurer ou de s’installer parmi la communauté, plutôt que le simple fait de s’asseoir.
- source_word: τεχνίτης
  choice: qu’il ait un métier
  rationale: Τεχνίτης désigne un artisan ou une personne de métier. Cette formulation naturelle en français conserve l’idée d’une compétence professionnelle sans limiter indûment le terme au seul artisanat manuel.
- source_word: ἐργαζέσθω καὶ φαγέτω
  choice: qu’il travaille pour se nourrir
  rationale: Les deux impératifs, littéralement « qu’il travaille et qu’il mange », établissent ici un lien pratique entre le travail et la subsistance; « pour se nourrir » le rend clairement et idiomatiquement.
theological_decisions:
- issue: Lien entre travail et nourriture
  choice: Exprimer la finalité pratique par « qu’il travaille pour se nourrir »
  alternative: « qu’il travaille et qu’il mange »
  rationale: Le contexte règle la prise en charge d’un visiteur qui souhaite rester. La formulation choisie communique l’exigence de subvenir à ses besoins sans ajouter de doctrine sur le mérite ou la dignité spirituelle du travail.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et normative, conformément au style parénétique de la Didachè.
