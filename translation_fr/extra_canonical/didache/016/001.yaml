review_pass:
  verdict: revise
  source_fidelity: La première exhortation, les lampes et la venue du Seigneur sont bien rendues. En revanche, « vos ceintures » ne traduit pas directement αἱ ὀσφύες (« vos reins », par extension la taille), et le pluriel suggère plusieurs objets vestimentaires plutôt que l’image corporelle grecque. « Votre ceinture se desserrer » est une équivalence idiomatique française fidèle à l’image d’une tenue prête à l’action, sans imposer d’interprétation théologique.
  naturalness: La révision conserve un français moderne et direct. « Ne laissez pas … » rend naturellement les impératifs négatifs grecs à la troisième personne et maintient le parallélisme des deux images.
  terminology: « Seigneur » rend correctement Κύριος. Le présent « vient » conserve ἔρχεται; aucune idée de « retour » n’est ajoutée. « Vie » conserve l’amplitude de ζωή.
  issues:
  - severity: medium
    issue: « vos ceintures » pour αἱ ὀσφύες
    rationale: Le grec désigne littéralement les reins/la taille, non les ceintures elles-mêmes. Une formulation française au singulier, « votre ceinture », exprime plus justement l’image vestimentaire associée à la taille et évite un pluriel peu naturel.
  revised_text: Veillez sur votre vie.[a] Ne laissez pas vos lampes s’éteindre ni votre ceinture se desserrer,[b] mais tenez-vous prêts, car vous ne savez pas à quelle heure notre Seigneur vient.
