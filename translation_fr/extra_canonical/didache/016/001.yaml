id: DID.16.1
reference: Didache 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: fr
  text: Veillez sur votre vie.[a] Ne laissez pas vos lampes s’éteindre ni votre ceinture se desserrer,[b] mais tenez-vous prêts, car vous ne savez pas à quelle heure notre Seigneur vient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Veillez pour votre vie. »'
    reason: La préposition ὑπέρ peut exprimer l’attention portée à la vie ou l’action en sa faveur; la note conserve cette nuance.
  - marker: b
    text: 'Littéralement : « que vos reins ne se relâchent pas ». L’image évoque une tenue maintenue ceinte, prête à l’action.'
    reason: Le grec nomme les « reins » (ὀσφύες); « votre ceinture se desserrer » est une équivalence idiomatique française de l’image sans la confondre avec le terme grec littéral.
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: Veillez sur votre vie
  rationale: « Veillez » rend directement l’impératif de vigilance Γρηγορεῖτε. La préposition ὑπέρ exprime ici l’attention portée à la vie; le singulier collectif français « votre vie » est naturel et fidèle à ζωῆς au singulier.
- source_word: οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν
  choice: Que vos lampes ne s’éteignent pas
  rationale: La tournure conserve l’image concrète des lampes et rend l’impératif grec à la troisième personne sans préciser artificiellement qui pourrait les éteindre.
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  choice: que vos ceintures ne se relâchent pas
  rationale: Le grec parle littéralement des « reins » qui ne doivent pas se relâcher, image sémitique liée au vêtement ceint et à l’état de préparation. « Ceintures » rend l’image vestimentaire compréhensible, tandis qu’une note signale la formulation littérale.
- source_word: γίνεσθε ἕτοιμοι
  choice: tenez-vous prêts
  rationale: Le présent γίνεσθε invite à demeurer ou à se mettre continuellement en état de préparation; « tenez-vous prêts » est idiomatique et conserve cette force.
- source_word: ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται
  choice: à quelle heure notre Seigneur vient
  rationale: Le présent ἔρχεται est conservé par « vient », plutôt que transformé en futur, afin de préserver l’imminence et la formulation du grec.
theological_decisions:
- issue: Portée de « votre vie »
  choice: Conserver l’expression générale « votre vie »
  alternative: Expliciter « votre salut » ou « votre conduite »
  rationale: ζωή signifie « vie »; le contexte peut englober la conduite, la vigilance spirituelle et l’issue eschatologique. Une explicitation réduirait cette amplitude.
- issue: Venue du Seigneur
  choice: « notre Seigneur vient »
  alternative: « notre Seigneur viendra » ou « reviendra »
  rationale: Le texte emploie le présent ἔρχεται et ne contient aucun préfixe correspondant explicitement à « revenir ». La traduction préserve donc l’expression et sa tension eschatologique sans ajout doctrinal.
translation_notes:
  register: Français moderne, international et digne. Les impératifs restent directs, avec un rythme proche de l’exhortation grecque. Les images des lampes et de la tenue ceinte sont conservées, sans archaïsmes tels que « ceignez vos reins ».
