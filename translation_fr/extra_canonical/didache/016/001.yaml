  - marker: b
    text: 'Littéralement : « que vos reins ne se relâchent pas ». L’image évoque une tenue maintenue ceinte, prête à l’action.'
    reason: Le grec nomme les « reins » (ὀσφύες); « votre ceinture se desserrer » est une équivalence idiomatique française de l’image sans la confondre avec le terme grec littéral.
  revision_rationale: La seule modification nécessaire corrige l’écart lexical entre « ceintures » et « reins/taille » tout en conservant, dans un français actuel, l’image concrète de préparation. Les ancres de notes sont préservées et la note b explicite le rapport entre l’équivalence française et le grec.
