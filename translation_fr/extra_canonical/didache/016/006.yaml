  source_fidelity: 'Le texte rend avec fidélité la structure de l’énumération grecque : « les signes de la vérité », puis un premier signe lié à l’ἐκπέτασις « dans le ciel », un signe du son d’une trompette, et en troisième lieu la résurrection des morts. « Déploiement » reflète correctement l’idée d’extension ou d’étalement sans imposer l’interprétation d’une ouverture du ciel ni celle du signe de la croix.'
  naturalness: Le français est moderne, lisible et conserve un registre solennel approprié. « Le son d’une trompette » est idiomatique. L’énumération par « premièrement », « ensuite » et « troisièmement » est claire; le tiret final reproduit à juste titre la suspension syntaxique du passage.
  terminology: « La résurrection des morts » est une traduction directe, établie et théologiquement non surinterprétée de ἀνάστασις νεκρῶν. La note sur « déploiement » protège utilement l’ambiguïté lexicale de ἐκπέτασις. Elle est plus conforme au grec que la piste anglaise « opening in heaven », laquelle risque de suggérer une brèche ou une ouverture.
