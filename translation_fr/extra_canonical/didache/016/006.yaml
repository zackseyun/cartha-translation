id: DID.16.6
reference: Didache 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
translation:
  language: fr
  text: 'Alors apparaîtront les signes de la vérité : premièrement, le signe d’un déploiement dans le ciel[a] ; ensuite, le signe du son d’une trompette ; et troisièmement, la résurrection des morts —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une extension dans le ciel ». Le grec évoque quelque chose qui s’étend ou se déploie, sans en préciser la nature.'
    reason: ambiguïté lexicale de ἐκπέτασις
lexical_decisions:
- source_word: ἐκπετάσεως
  choice: d’un déploiement
  rationale: Le nom désigne l’action d’étendre ou de déployer. « Déploiement » conserve cette image sans la transformer en une ouverture ou une brèche dans le ciel.
- source_word: φωνῆς σάλπιγγος
  choice: du son d’une trompette
  rationale: Avec un instrument, φωνή désigne naturellement le son produit ; « son d’une trompette » est fidèle et idiomatique en français.
- source_word: ἀνάστασις νεκρῶν
  choice: la résurrection des morts
  rationale: Formulation française consacrée qui reproduit directement le sens du grec sans préciser l’étendue ou la nature de cette résurrection.
theological_decisions:
- issue: Nature du premier signe céleste
  choice: Traduire littéralement par « déploiement »
  alternative: « ouverture dans le ciel » ou identification explicite au signe de la croix
  rationale: Le grec évoque une extension ou un déploiement, mais n’en nomme pas l’objet. La traduction préserve cette indétermination et n’impose aucune interprétation théologique.
translation_notes:
  register: Français moderne, clair et digne. L’énumération grecque est conservée par « premièrement », « ensuite » et « troisièmement ». Le tiret final signale que la phrase se poursuit au verset suivant.
