source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ὄψεται ὁ κόσμος τὸν Κύριον ἐρχόμενον ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/008.yaml
  text: Then the world will see the Lord coming upon the clouds of heaven.j
translation:
  language: fr
  text: Alors le monde verra le Seigneur venir sur les nuées du ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation fait écho à Daniel 7.13 et à Matthieu 24.30; voir aussi Apocalypse 1.7.
    reason: Signaler l’arrière-plan scripturaire de l’image des nuées du ciel.
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Rend naturellement l’adverbe temporel qui introduit l’événement final.
- source_word: ὄψεται
  choice: verra
  rationale: Traduit le futur moyen déponent de ὁράω par un futur simple français.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: Conserve la portée collective et l’écho apocalyptique de κόσμος sans la restreindre à « l’humanité ».
- source_word: τὸν Κύριον
  choice: le Seigneur
  rationale: Équivalent consacré et non interprétativement expansif de Κύριος.
- source_word: ἐρχόμενον
  choice: venir
  rationale: L’infinitif après « verra » exprime en français la construction grecque avec participe prédicatif et présente la venue comme observée.
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: sur les nuées du ciel
  rationale: Reproduit l’imagerie biblique et le sens spatial de ἐπάνω avec le génitif.
theological_decisions:
- issue: Identité du « Seigneur »
  choice: Maintenir le titre sans explicitation
  alternative: Ajouter « Jésus » ou « Jésus-Christ »
  rationale: Le grec dit seulement « le Seigneur »; l’expliciter résoudrait une référence que le texte laisse implicite.
- issue: Sens de κόσμος
  choice: « le monde »
  alternative: « tous les humains »
  rationale: La formulation littérale préserve la dimension cosmique ou collective possible, sans réduire le terme à une seule interprétation.
translation_notes:
  register: Français moderne, sobre et digne. « Nuées » est conservé plutôt que « nuages » en raison de son emploi biblique reconnu et de la solennité apocalyptique du passage.
