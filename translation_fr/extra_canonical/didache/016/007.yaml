id: DID.16.7
reference: Didache 16:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ πάντων δέ, ἀλλ᾽ ὡς ἐρρέθη· Ἥξει ὁ Κύριος καὶ πάντες οἱ ἅγιοι μετ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/007.yaml
  text: 'but not of all, but as it was said: The Lord will come, and all the holy ones with him.'
translation:
  language: fr
  text: 'mais pas de tous, mais, comme il a été dit : « Le Seigneur viendra, et tous les saints[a] avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les êtres saints ». Le grec ne précise pas s’il s’agit d’êtres humains, d’anges, ou des deux.'
    reason: Préserver l’ambiguïté référentielle de οἱ ἅγιοι.
lexical_decisions:
- source_word: οὐ πάντων
  choice: non pas de tous
  rationale: Conserve la formulation elliptique du grec, dont le référent dépend du contexte précédent, sans l’expliciter dans ce verset.
- source_word: οἱ ἅγιοι
  choice: les saints
  rationale: Rend littéralement le substantif grec tout en conservant son ouverture référentielle; une note signale qu’il peut désigner plus largement les « êtres saints ».
theological_decisions:
- issue: Identité de « tous les saints »
  choice: Ne pas préciser s’il s’agit d’êtres humains, d’anges, ou de l’ensemble des êtres saints.
  alternative: Traduire « tous ses saints anges » ou « tous les croyants sanctifiés ».
  rationale: Le grec οἱ ἅγιοι ne tranche pas ici cette question; l’expliciter imposerait une interprétation théologique absente du texte.
translation_notes:
  register: Français moderne, digne et direct. La répétition « mais… mais » est maintenue parce qu’elle reflète le contraste appuyé du grec, malgré son caractère légèrement abrupt en français.
