id: DID.16.4
reference: Didache 16:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: fr
  text: Car, à mesure que l’illégalité augmentera, ils se haïront, se persécuteront et se trahiront les uns les autres. Alors, celui qui égare le monde apparaîtra comme un fils de Dieu[a] et accomplira des signes et des prodiges. La terre sera livrée entre ses mains, et il commettra des actes interdits, tels qu’il ne s’en est jamais produit depuis les origines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Fils de Dieu ». Le grec ne comporte pas d’article devant « fils », mais l’expression peut aussi être comprise comme un titre.'
    reason: Préserver l’ambiguïté grammaticale et théologique de υἱὸς Θεοῦ sans la résoudre dans le corps du texte.
lexical_decisions:
- source_word: ἀνομίας
  choice: mépris de la loi
  rationale: Rend concrètement l’idée d’absence ou de rejet de la loi, dans un français moderne, sans réduire le terme à une vague méchanceté.
- source_word: κοσμοπλάνος
  choice: celui qui égare le monde
  rationale: Exprime les deux éléments du composé grec, κόσμος et πλάνος, plus naturellement que le calque « trompeur du monde ».
- source_word: σημεῖα καὶ τέρατα
  choice: des signes et des prodiges
  rationale: Conserve la paire traditionnelle et la portée extraordinaire des deux termes grecs.
- source_word: ἀθέμιτα
  choice: des actes contraires à toute loi
  rationale: Restitue l’idée d’actes illicites et sacrilèges sans imposer une catégorie juridique ou cultuelle trop étroite.
- source_word: ἐξ αἰῶνος
  choice: depuis le commencement des temps
  rationale: Rend idiomatiquement la perspective temporelle remontant à l’âge le plus ancien, en accord avec οὐδέποτε, plutôt que par un calque obscur.
theological_decisions:
- issue: Valeur de υἱὸς Θεοῦ et capitalisation du titre
  choice: un fils de Dieu
  alternative: le Fils de Dieu
  rationale: L’expression grecque est sans article et décrit la manière dont l’imposteur apparaîtra. La traduction retenue préserve cette indétermination et évite d’identifier silencieusement ce personnage au véritable Fils de Dieu; une note signale toutefois l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Les verbes réciproques sont explicités par « les uns les autres ». La répétition de « et » du grec est légèrement structurée en phrases françaises pour assurer la lisibilité sans modifier la progression du passage.
