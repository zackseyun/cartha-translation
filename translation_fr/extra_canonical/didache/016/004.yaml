revisions:
- from: Car, à mesure que le mépris de la loi augmentera, ils se haïront, se persécuteront et se livreront les uns les autres. Alors, celui qui égare le monde apparaîtra comme un fils de Dieu[a] et accomplira des signes et des prodiges. La terre sera livrée entre ses mains, et il commettra des actes contraires à toute loi, tels qu’il ne s’en est jamais produit depuis le commencement des temps.
  to: Car, à mesure que l’illégalité augmentera, ils se haïront, se persécuteront et se trahiront les uns les autres. Alors, celui qui égare le monde apparaîtra comme un fils de Dieu[a] et accomplira des signes et des prodiges. La terre sera livrée entre ses mains, et il commettra des actes interdits, tels qu’il ne s’en est jamais produit depuis les origines.
  rationale: La révision resserre les rendus de ἀνομία et ἀθέμιτα, emploie une formulation française naturelle pour la trahison réciproque, et améliore la dernière expression temporelle. Elle conserve la syntaxe fondamentale, la portée eschatologique et l’ambiguïté de υἱὸς Θεοῦ, y compris la note correspondante.
