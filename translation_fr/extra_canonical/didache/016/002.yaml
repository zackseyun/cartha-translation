id: DID.16.2
reference: Didache 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: fr
  text: Réunissez-vous souvent, en recherchant ce qui convient à vos âmes ; car toute la durée de votre foi ne vous sera d’aucun profit si vous n’êtes pas rendus parfaits[a] au temps de la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « amenés à l’accomplissement » ou « parvenus à l’achèvement ».'
    reason: Le passif grec τελειωθῆτε peut désigner le fait d’être rendu parfait, mais aussi l’achèvement ou l’accomplissement ; la note préserve cette amplitude sémantique.
lexical_decisions:
- source_word: Πυκνῶς
  choice: souvent
  rationale: Rend simplement et naturellement l’idée de fréquence, sans alourdir le registre.
- source_word: συναχθήσεσθε
  choice: Réunissez-vous
  rationale: Le futur grec prend ici une valeur d’exhortation dans ce contexte parénétique ; l’impératif français exprime naturellement cette force.
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  choice: ce qui convient à vos âmes
  rationale: ἀνήκοντα désigne ce qui se rapporte à elles ou leur convient ; cette formulation reste proche du grec tout en étant idiomatique.
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  choice: toute la durée de votre foi
  rationale: « Durée » fait ressortir la totalité du temps passé dans la foi, plus naturellement que le calque « tout le temps de votre foi ».
- source_word: τελειωθῆτε
  choice: vous n’êtes pas amenés à la perfection
  rationale: Conserve la voix passive et le champ sémantique de l’achèvement ou de la perfection sans préciser indûment l’agent.
- source_word: ἐν τῷ ἐσχάτῳ καιρῷ
  choice: au dernier temps
  rationale: Maintient l’expression temporelle et sa portée eschatologique possible, sans la réduire à un simple dernier moment individuel.
theological_decisions:
- issue: Sens de τελειωθῆτε
  choice: amenés à la perfection
  alternative: parvenus à l’accomplissement
  rationale: Le choix principal garde l’idée de perfection présente dans le verbe, tandis que la note signale son sens également possible d’achèvement sans résoudre la tension.
- issue: Portée de ἐσχάτῳ καιρῷ
  choice: au dernier temps
  alternative: au temps de la fin
  rationale: La formulation retenue demeure proche du grec et laisse ouverte la portée exacte de ce temps final.
translation_notes:
  register: Français international moderne, sobre et exhortatif. La phrase conserve la solennité de l’original, avec un vocabulaire accessible et sans ajout confessionnel.
