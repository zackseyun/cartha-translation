source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
translation:
  language: fr
  text: Alors, l’humanité entrera dans le feu de l’épreuve. Beaucoup tomberont et périront, mais ceux qui auront persévéré dans leur foi seront sauvés par la malédiction elle-même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une lecture séparative : « seront sauvés de la malédiction elle-même ». La formule grecque est difficile.'
    reason: Préserve l’ambiguïté de ὑπ᾽ αὐτοῦ τοῦ καταθέματος sans introduire l’interprétation supplémentaire d’une « emprise » ni transformer le neutre κατάθεμα en personne.
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  choice: la création humaine
  rationale: Rend naturellement le génitif grec tout en conservant l’idée collective de l’humanité créée.
- source_word: τὴν πύρωσιν τῆς δοκιμασίας
  choice: le feu de l’épreuve
  rationale: πύρωσις évoque l’embrasement ou l’épreuve du feu, tandis que δοκιμασία désigne la mise à l’épreuve; cette formulation française garde les deux dimensions sans lourdeur.
- source_word: σκανδαλισθήσονται
  choice: tomberont
  rationale: Dans ce contexte eschatologique, le verbe passif exprime la chute provoquée par l’épreuve, et non une simple offense émotionnelle.
- source_word: ὑπομείναντες
  choice: ceux qui auront persévéré
  rationale: Exprime l’endurance fidèle jusqu’au terme, avec une antériorité naturelle par rapport au salut annoncé.
- source_word: κατάθεμα
  choice: malédiction
  rationale: Le substantif grec neutre signifie « malédiction »; il ne désigne pas explicitement une personne maudite.
theological_decisions:
- issue: Sens de ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  choice: par la malédiction elle-même
  alternative: délivrés de l’emprise de la malédiction elle-même
  rationale: La construction ὑπό avec le génitif se lit le plus directement comme l’expression d’un moyen ou d’un agent, mais la formule est énigmatique et peut recevoir une lecture séparative. Le texte principal conserve donc sa tension théologique, tandis que la note signale l’autre compréhension sans transformer κατάθεμα en personnage masculin.
translation_notes:
  register: Français international moderne, sobre et solennel. Les phrases sont légèrement segmentées pour la lisibilité, sans atténuer le caractère apocalyptique ni l’énigme de la dernière proposition.
