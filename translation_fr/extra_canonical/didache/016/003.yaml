id: DID.16.3
reference: Didache 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς καὶ στραφήσονται τὰ πρόβατα εἰς λύκους καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/003.yaml
  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: fr
  text: Car, dans les derniers jours, les faux prophètes et les corrupteurs se multiplieront ; les brebis se changeront en loups, et l’amour se changera en haine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... ταῖς ἐσχάταις ἡμέραις
  choice: dans les derniers jours
  rationale: Rend directement l’expression temporelle grecque dans une formulation française naturelle et traditionnelle.
- source_word: οἱ ψευδοπροφῆται
  choice: les faux prophètes
  rationale: Équivalent direct et clair du terme grec.
- source_word: οἱ φθορεῖς
  choice: les corrupteurs
  rationale: Conserve l’idée de personnes qui corrompent ou pervertissent, sans préciser indûment la nature de leur action.
- source_word: πληθυνθήσονται
  choice: se multiplieront
  rationale: Préserve la forme passive de sens et l’idée d’un accroissement numérique.
- source_word: στραφήσονται ... εἰς
  choice: se changeront en
  rationale: Exprime ici la transformation indiquée par le passif de στρέφω suivi de εἰς.
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: Rend le nom grec sans ajouter de qualification théologique absente du texte.
- source_word: μῖσος
  choice: haine
  rationale: Équivalent français direct du grec.
theological_decisions:
- issue: Nature de la transformation des brebis en loups
  choice: les brebis se changeront en loups
  alternative: les brebis seront changées en loups
  rationale: La tournure pronominale française conserve l’ambiguïté du passif grec quant à l’agent de la transformation et reste naturelle.
- issue: Portée eschatologique des « derniers jours »
  choice: dans les derniers jours
  alternative: à la fin des temps
  rationale: La traduction littérale évite d’expliciter davantage la chronologie ou le cadre eschatologique que ne le fait le grec.
translation_notes:
  register: Français moderne, sobre et dignifié. Le parallélisme des deux transformations est conservé, ainsi que la progression du verset. Aucun ajout explicatif ni marqueur confessionnel.
