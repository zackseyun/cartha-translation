source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
translation:
  language: fr
  text: 'Cependant, toute personne qui parle dans l’Esprit n’est pas pour autant prophète : elle ne l’est que si elle a la conduite du Seigneur. C’est donc par leur conduite que l’on reconnaîtra le faux prophète et le prophète.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλῶν ἐν πνεύματι
  choice: qui parle sous l’action de l’Esprit
  rationale: Cette formulation française naturelle exprime une parole inspirée ou suscitée par l’Esprit sans imposer un sens technique plus précis que le grec.
- source_word: τοὺς τρόπους Κυρίου
  choice: la conduite du Seigneur
  rationale: Dans ce contexte, τρόποι désigne les manières d’agir, le comportement ou le mode de vie. « Conduite » évite de confondre le terme avec ὁδός, la « voie » structurante des premiers chapitres de la Didachè.
- source_word: γνωσθήσεται
  choice: l’on reconnaîtra
  rationale: Le futur passif grec signifie que l’identité véritable deviendra discernable; la tournure impersonnelle est idiomatique en français.
theological_decisions:
- issue: Critère permettant de reconnaître un prophète authentique
  choice: elle ne l’est que si elle adopte la conduite du Seigneur
  alternative: mais seulement si elle a les manières du Seigneur
  rationale: Le texte subordonne la reconnaissance du prophète à une conduite conforme à celle du Seigneur, sans préciser davantage la nature de cette conformité.
- issue: Contraste final entre faux prophète et prophète
  choice: le faux prophète et le prophète
  alternative: le faux prophète et le véritable prophète
  rationale: Le grec n’ajoute pas « véritable »; conserver l’opposition nue évite une explicitation inutile.
translation_notes:
  register: Français international moderne, digne et accessible. Le genre épicène de « personne » évite un masculin générique lourd, tandis que la répétition de « conduite » préserve le lien lexical entre τρόπους et τρόπων.
