id: DID.11.2
reference: Didache 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
translation:
  language: fr
  text: Mais si l’enseignant lui-même change d’orientation et enseigne une autre doctrine afin de détruire[a], ne l’écoutez pas ; mais si c’est pour ajouter de la justice et de la connaissance du Seigneur, accueillez-le comme le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abolir » ou « renverser ». Le grec ne précise pas ce qui serait détruit, aboli ou renversé.
    reason: Signaler l’étendue sémantique de καταλύω tout en préservant l’absence d’objet explicite dans le grec.
lexical_decisions:
- source_word: στραφεὶς
  choice: change de voie
  rationale: Le participe de στρέφω signifie littéralement « s’étant tourné ». « Change de voie » exprime ici naturellement un changement d’orientation, sans préciser davantage la nature de ce changement.
- source_word: ἄλλην διδαχὴν
  choice: une autre doctrine
  rationale: « Doctrine » rend le contenu enseigné et évite la lourdeur de « un autre enseignement ».
- source_word: καταλῦσαι
  choice: renverser
  rationale: Le verbe peut signifier défaire, abolir ou renverser. L’objet n’étant pas exprimé dans le grec, la traduction conserve cette absence au lieu d’en ajouter un.
- source_word: προσθεῖναι
  choice: ajouter
  rationale: Le verbe transitif gouverne directement « justice » et « connaissance » ; « ajouter » respecte cette construction sans la transformer en « ajouter à ».
- source_word: δικαιοσύνην
  choice: justice
  rationale: Rend directement δικαιοσύνη, avec sa portée morale et religieuse ouverte.
- source_word: γνῶσιν Κυρίου
  choice: connaissance du Seigneur
  rationale: Conserve le génitif Κυρίου, dont la relation précise avec « connaissance » n’est pas explicitée.
- source_word: ὡς Κύριον
  choice: comme le Seigneur
  rationale: Préserve la formulation forte et la tension théologique du grec, sans l’atténuer en « comme un envoyé du Seigneur ».
theological_decisions:
- issue: Objet implicite de « renverser »
  choice: Ne pas ajouter d’objet dans le corps du texte
  alternative: « renverser cet enseignement » ou « renverser ces choses »
  rationale: Le grec ne donne aucun complément explicite à καταλῦσαι ; l’ajout déterminerait indûment le référent.
- issue: Accueil de l’enseignant « comme le Seigneur »
  choice: Conserver littéralement « comme le Seigneur »
  alternative: « comme si vous accueilliez le Seigneur » ou « comme un envoyé du Seigneur »
  rationale: La comparaison directe est présente dans le texte et ne doit pas être expliquée ou réduite par une interprétation confessionnelle.
- issue: Portée de « ajouter justice et connaissance »
  choice: Conserver les deux noms comme objets directs d’« ajouter »
  alternative: « faire grandir dans la justice et la connaissance »
  rationale: La construction grecque présente δικαιοσύνην et γνῶσιν comme objets directs, même si la formulation française reste volontairement marquée.
translation_notes:
  register: Français moderne, digne et accessible. « Enseignant » convient au rôle envisagé, tandis que « doctrine » donne une formulation naturelle. La syntaxe inhabituelle « ajouter justice et connaissance » est maintenue pour respecter la relation grammaticale du grec et son ambiguïté quant à ce qui est ajouté.
