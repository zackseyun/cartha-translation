revisions:
- from: Mais si l’enseignant lui-même change de voie et enseigne une autre doctrine dans le but de renverser[a], ne l’écoutez pas. En revanche, si c’est pour ajouter justice et connaissance du Seigneur, accueillez-le comme le Seigneur.
  to: Mais si l’enseignant lui-même change d’orientation et enseigne une autre doctrine afin de détruire[a], ne l’écoutez pas ; mais si c’est pour ajouter de la justice et de la connaissance du Seigneur, accueillez-le comme le Seigneur.
  rationale: La révision améliore l’idiomaticité française sans combler les ellipses du texte grec ni modifier ses relations grammaticales. « Afin de détruire » maintient le but et l’objet non exprimé de καταλῦσαι ; « ajouter de la justice et de la connaissance » garde les deux substantifs comme compléments directs de προσθεῖναι. La formule « comme le Seigneur » est conservée telle quelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:17:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien conservé : le sujet emphatique (« l’enseignant lui-même »), l’enseignement différent, le but exprimé par εἰς τὸ + infinitif, l’absence d’objet explicite de καταλῦσαι, les objets directs de προσθεῖναι et la comparaison finale sont tous pris en compte. « Change de voie » est toutefois un peu plus interprétatif que στραφείς (« s’étant tourné / ayant changé »). « Détruire » permet mieux que « renverser » de conserver en français l’absence voulue de complément d’objet, tout en restant dans le champ de καταλύω.'
  naturalness: La phrase est globalement claire et de registre adapté. Cependant, « dans le but de renverser » laisse en français un verbe transitif sans complément et sonne inachevé. « Afin de détruire » est plus idiomatique tout en préservant exactement le référent non exprimé. « Ajouter de la justice et de la connaissance du Seigneur » est plus naturel que l’absence totale de déterminants, sans transformer les noms grecs en compléments introduits par « à ».
  terminology: « Enseignant », « doctrine », « justice », « connaissance du Seigneur » et « comme le Seigneur » conviennent. La formulation finale forte doit être maintenue sans la paraphraser en termes d’envoyé ou de représentant. « Changer d’orientation » rend le mouvement implicite de στραφείς avec davantage de neutralité que « changer de voie ».
  issues:
  - severity: low
    issue: « change de voie » précise légèrement le sens de στραφείς
    rationale: Le grec indique qu’il s’est tourné ou a changé, sans qualifier explicitement ce changement comme un changement de « voie ». « Change d’orientation » demeure idiomatique tout en étant moins chargé.
  - severity: medium
    issue: « renverser » sans complément est maladroit en français
    rationale: L’absence d’objet est textuellement importante, mais « renverser » appelle normalement un objet explicite en français. « Détruire » peut être employé sans objet dans ce contexte et ne force aucun référent.
  - severity: low
    issue: Absence de déterminants dans « ajouter justice et connaissance »
    rationale: La construction vise correctement les objets directs de προσθεῖναι, mais elle est inutilement heurtée en français moderne. Les partitifs conservent la relation d’objet direct et l’indétermination des noms grecs.
  revised_text: Mais si l’enseignant lui-même change d’orientation et enseigne une autre doctrine afin de détruire[a], ne l’écoutez pas ; mais si c’est pour ajouter de la justice et de la connaissance du Seigneur, accueillez-le comme le Seigneur.
  revised_footnotes:
  - marker: a
    text: Ou « abolir » ou « renverser ». Le grec ne précise pas ce qui serait détruit, aboli ou renversé.
    reason: Signaler l’étendue sémantique de καταλύω tout en préservant l’absence d’objet explicite dans le grec.
  revision_rationale: La révision améliore l’idiomaticité française sans combler les ellipses du texte grec ni modifier ses relations grammaticales. « Afin de détruire » maintient le but et l’objet non exprimé de καταλῦσαι ; « ajouter de la justice et de la connaissance » garde les deux substantifs comme compléments directs de προσθεῖναι. La formule « comme le Seigneur » est conservée telle quelle.
