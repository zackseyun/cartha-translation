id: DID.11.10
reference: Didache 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: fr
  text: Mais tout prophète qui enseigne la vérité est un faux prophète s’il ne met pas en pratique ce qu’il enseigne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  choice: Mais tout prophète
  rationale: « Tout prophète » restitue la portée générale de πᾶς, tandis que « mais » marque naturellement le contraste introduit par δέ avec le contexte précédent.
- source_word: διδάσκων τὴν ἀλήθειαν
  choice: qui enseigne la vérité
  rationale: La proposition relative est idiomatique en français moderne et conserve le sens du participe présent grec.
- source_word: εἰ ἃ διδάσκει οὐ ποιεῖ
  choice: s’il ne met pas en pratique ce qu’il enseigne
  rationale: Dans ce contexte moral, ποιεῖ signifie accomplir ou pratiquer l’enseignement, plutôt que simplement « faire »; cette formulation rend clairement l’opposition entre parole et conduite.
- source_word: ψευδοπροφήτης ἐστί
  choice: est un faux prophète
  rationale: Traduction directe et traditionnelle du terme composé ψευδοπροφήτης, sans atténuer le jugement catégorique.
theological_decisions:
- issue: Critère d’authenticité du prophète
  choice: Conserver l’affirmation catégorique selon laquelle l’absence de mise en pratique révèle un faux prophète.
  alternative: Formuler plus faiblement qu’il « agit comme » un faux prophète.
  rationale: Le grec emploie explicitement ψευδοπροφήτης ἐστί, « il est un faux prophète »; il ne convient pas d’adoucir cette identification.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe a été légèrement réorganisée afin d’éviter une phrase lourde, tout en préservant le contraste, la condition et le jugement du texte grec.
