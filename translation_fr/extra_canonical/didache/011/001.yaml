id: DID.11.1
reference: Didache 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: fr
  text: Ainsi donc, si quelqu’un vient et vous enseigne toutes ces choses qui ont été dites auparavant, accueillez-le.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: si quelqu’un
  rationale: La tournure grecque exprime une éventualité générale; «si quelqu’un» la rend naturellement en français sans restreindre l’identité de la personne.
- source_word: οὖν
  choice: Ainsi donc
  rationale: Cette expression conserve la valeur conclusive et le lien logique avec les instructions précédentes.
- source_word: ἐλθὼν διδάξῃ
  choice: vient vous enseigner
  rationale: Le participe suivi du subjonctif décrit la venue de la personne puis son enseignement; la formulation française reste fluide et fidèle.
- source_word: ταῦτα πάντα, τὰ προειρημένα
  choice: tout ce qui vient d’être dit
  rationale: Cette formulation restitue à la fois la totalité indiquée par πάντα et le renvoi aux enseignements énoncés auparavant, sans la lourdeur d’une répétition littérale.
- source_word: δέξασθε αὐτόν
  choice: accueillez-le
  rationale: «Accueillir» rend le sens courant de recevoir favorablement une personne, ici dans le contexte d’un enseignant itinérant.
theological_decisions:
- issue: Portée de l’accueil demandé
  choice: Conserver l’impératif simple «accueillez-le»
  alternative: «Reconnaissez-le» ou «recevez son enseignement»
  rationale: Le grec vise directement la personne et ne précise pas si l’accueil est seulement matériel, communautaire ou doctrinal; la traduction préserve cette amplitude.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe est légèrement resserrée pour éviter le calque «toutes ces choses dites auparavant», peu naturel en français, tout en conservant le lien explicite avec le contexte précédent.
