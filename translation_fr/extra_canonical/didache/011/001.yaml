review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement l’injonction d’accueillir toute personne qui arrive avec l’enseignement précédemment exposé. Toutefois, « vient d’être dit » ajoute une nuance de proximité temporelle (« vient juste d’être dit ») que προειρημένα n’exprime pas nécessairement; le grec renvoie plus largement à ce qui a été dit auparavant. La coordination de la venue et de l’enseignement mérite aussi d’être explicitée.
  naturalness: Le français du projet est clair et idiomatique. « S’il vient et vous enseigne » est tout aussi naturel et rend plus distinctement les deux actions du grec.
  terminology: « Accueillez-le » est un bon rendu de δέξασθε αὐτόν et conserve, sans la préciser artificiellement, la portée relationnelle et communautaire de l’accueil. Aucun terme théologique spécialisé ne demande d’ajustement.
  issues:
  - severity: medium
    issue: « tout ce qui vient d’être dit »
    rationale: Cette expression française suggère que les propos viennent d’être énoncés. τὰ προειρημένα signifie « les choses dites auparavant / précédemment », sans imposer cette immédiateté.
  - severity: low
    issue: Relation entre « venir » et « enseigner »
    rationale: Le grec ἐλθὼν διδάξῃ présente la venue suivie de l’enseignement. « vient et vous enseigne » conserve plus explicitement cette articulation que « vient vous enseigner », qui reste possible mais la condense.
  revised_text: Ainsi donc, si quelqu’un vient et vous enseigne toutes ces choses qui ont été dites auparavant, accueillez-le.
  revised_footnotes: []
  revision_rationale: La révision remplace la nuance indûment immédiate de « vient d’être dit » par « qui ont été dites auparavant », correspondant à προειρημένα, et explicite la succession venue–enseignement. Elle maintient l’impératif « accueillez-le », qui rend naturellement δέξασθε αὐτόν sans réduire son sens.
