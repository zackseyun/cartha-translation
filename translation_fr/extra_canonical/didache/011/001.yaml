revisions:
- from: Ainsi donc, si quelqu’un vient vous enseigner tout ce qui vient d’être dit, accueillez-le.
  to: Ainsi donc, si quelqu’un vient et vous enseigne toutes ces choses qui ont été dites auparavant, accueillez-le.
  rationale: La révision remplace la nuance indûment immédiate de « vient d’être dit » par « qui ont été dites auparavant », correspondant à προειρημένα, et explicite la succession venue–enseignement. Elle maintient l’impératif « accueillez-le », qui rend naturellement δέξασθε αὐτόν sans réduire son sens.
  reviewer_model: gpt-5.6-terra
