id: DID.11.9
reference: Didache 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
translation:
  language: fr
  text: Et tout prophète qui fait dresser une table dans l’Esprit[a] n’en mangera pas ; sinon, c’est un faux prophète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui fait préparer un repas sous l’inspiration de l’Esprit ». Le mot grec traduit par « table » peut désigner, par métonymie, le repas qui y est servi.'
    reason: Clarifie le sens possible de ὁρίζων τράπεζαν ἐν πνεύματι sans remplacer dans le texte principal l’image concrète et l’ambiguïté de la formulation grecque.
lexical_decisions:
- source_word: ὁρίζων τράπεζαν
  choice: fait dresser une table
  rationale: Cette formulation reste proche de l’image grecque de la « table » tout en indiquant naturellement que le prophète demande qu’elle soit préparée. Le contexte permet aussi de comprendre τράπεζα par métonymie comme le repas servi.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: La traduction conserve la formulation grecque et son ambiguïté quant à la manière précise dont le prophète agit sous l’impulsion spirituelle.
- source_word: οὐ φάγεται ἀπ᾽ αὐτῆς
  choice: n’en mangera pas
  rationale: Le futur grec exprime ici une règle de conduite. Le pronom français renvoie naturellement à ce qui est servi sur la table.
- source_word: ψευδοπροφήτης
  choice: faux prophète
  rationale: Équivalent français courant et direct du terme grec.
theological_decisions:
- issue: Nature de l’action accomplie « dans l’Esprit »
  choice: Conserver « dans l’Esprit » sans préciser davantage
  alternative: « sous l’inspiration de l’Esprit »
  rationale: La formulation plus explicite serait naturelle, mais elle interpréterait le rapport exact entre l’Esprit et l’ordre donné. Le texte grec laisse ce rapport implicite.
- issue: Portée normative du futur οὐ φάγεται
  choice: « n’en mangera pas »
  alternative: « ne doit pas en manger »
  rationale: Le futur français maintient la forme de la règle telle qu’elle apparaît en grec, sans en modifier la force en la transformant explicitement en obligation.
translation_notes:
  register: Français moderne, sobre et digne. « Fait dresser une table » conserve l’image du texte source tout en restant idiomatique ; « dans l’Esprit » maintient la tension et la concision de la formule grecque.
