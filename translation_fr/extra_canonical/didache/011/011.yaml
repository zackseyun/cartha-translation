id: DID.11.11
reference: Didache 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: fr
  text: Mais tout prophète reconnu authentique après avoir été mis à l’épreuve, qui agit en vue d’un mystère terrestre de l’Église, sans toutefois enseigner à faire ce qu’il fait lui-même, ne sera pas jugé par vous. En effet, c’est avec Dieu qu’il a affaire pour son jugement, car les anciens prophètes ont agi de la même manière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδοκιμασμένος, ἀληθινός
  choice: reconnu authentique après avoir été mis à l’épreuve
  rationale: Rend à la fois l’épreuve accomplie exprimée par le participe parfait et la qualité de prophète véritable, dans un français naturel.
- source_word: ποιῶν εἰς
  choice: qui agit en vue de
  rationale: La construction est inhabituelle et son sens exact demeure discuté; cette formulation conserve l’idée d’action orientée vers une réalité sans préciser indûment sa nature.
- source_word: μυστήριον κοσμικὸν ἐκκλησίας
  choice: un mystère terrestre de l’Église
  rationale: Traduction volontairement proche d’une expression grecque obscure; «terrestre» préserve ici la portée possible de κοσμικόν sans l’interpréter comme simplement mondain.
- source_word: οὐ κριθήσεται ἐφ᾽ ὑμῶν
  choice: ne sera pas jugé par vous
  rationale: Reproduit directement l’interdiction ou l’exemption de jugement par la communauté.
- source_word: μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν
  choice: c’est avec Dieu qu’il a affaire pour son jugement
  rationale: Conserve la relation directe entre le prophète, son jugement et Dieu, sans trancher davantage la nuance de μετά.
- source_word: οἱ ἀρχαῖοι προφῆται
  choice: les anciens prophètes
  rationale: Équivalent direct, vraisemblablement référentiel aux prophètes des temps anciens.
theological_decisions:
- issue: Nature du «mystère terrestre de l’Église»
  choice: Maintenir l’expression énigmatique sans identifier l’acte visé
  alternative: Interpréter explicitement l’expression comme une action symbolique concernant le mariage, le monde ou l’Église
  rationale: Le grec transmis est obscur et permet plusieurs lectures historiques; une explicitation ferait entrer une interprétation contestée dans le texte.
- issue: Autorité de juger le prophète éprouvé
  choice: Dire qu’il ne sera pas jugé «par vous», tout en laissant son jugement à Dieu
  alternative: Formuler une interdiction absolue de tout discernement prophétique
  rationale: Le contexte distingue probablement l’épreuve préalable du prophète authentique et le jugement ultérieur de son geste symbolique; le verset ne supprime pas nécessairement tout discernement communautaire.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe a été légèrement restructurée pour rendre lisible la longue chaîne participiale grecque. L’expression centrale, notoirement obscure, reste délibérément littérale afin de préserver l’ambiguïté du texte source.
