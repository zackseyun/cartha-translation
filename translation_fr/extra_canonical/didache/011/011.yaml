    rationale: Cette construction n’est pas idiomatique en français moderne dans ce sens. Le grec διδάσκειν ποιεῖν se rend naturellement par « enseigner à faire ».
  revised_text: Mais tout prophète reconnu authentique après avoir été mis à l’épreuve, qui agit en vue d’un mystère terrestre de l’Église, sans toutefois enseigner à faire ce qu’il fait lui-même, ne sera pas jugé par vous. En effet, c’est avec Dieu qu’il a affaire pour son jugement, car les anciens prophètes ont agi de la même manière.
