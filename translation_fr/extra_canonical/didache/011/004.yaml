source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἀπόστολος ἐρχόμενος πρὸς ὑμᾶς δεχθήτω ὡς Κύριος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/004.yaml
  text: Let every apostle who comes to you be received as the Lord.
translation:
  language: fr
  text: Que tout apôtre qui vient chez vous soit accueilli comme le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ ἀπόστολος
  choice: Tout apôtre
  rationale: Reproduit directement l’universalité de πᾶς et conserve le titre ἀπόστολος sans en préciser davantage la fonction.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: qui vient chez vous
  rationale: Formulation française naturelle pour un visiteur arrivant auprès d’une communauté; « chez vous » garde la dimension d’accueil communautaire.
- source_word: δεχθήτω
  choice: soit accueilli
  rationale: Le passif impératif exprime la consigne donnée à la communauté; « accueillir » convient mieux au contexte d’hospitalité que le seul « recevoir ».
- source_word: ὡς Κύριος
  choice: comme le Seigneur
  rationale: Conserve la comparaison concise et sa portée théologique sans ajouter « s’il était » ni identifier davantage le référent.
theological_decisions:
- issue: Portée de « comme le Seigneur »
  choice: Conserver littéralement « comme le Seigneur »
  alternative: « comme si c’était le Seigneur »
  rationale: Le grec ὡς Κύριος est bref et peut évoquer l’accueil du messager comme représentant du Seigneur. La traduction retenue préserve cette tension sans transformer explicitement la comparaison en identification.
translation_notes:
  register: Français moderne, simple et digne. La tournure impérative « Que… soit… » restitue naturellement la force normative de l’impératif grec.
