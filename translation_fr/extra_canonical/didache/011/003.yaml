source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τῶν ἀποστόλων καὶ προφητῶν κατὰ τὸ δόγμα τοῦ εὐαγγελίου, οὕτω ποιήσατε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/003.yaml
  text: Concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: fr
  text: Quant aux apôtres et aux prophètes, agissez ainsi, conformément à la règle de l’Évangile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quant aux
  rationale: Rend naturellement en français l’introduction d’un nouveau sujet et la légère transition marquée par δέ, sans ajouter un adverbe temporel absent du grec.
- source_word: ἀποστόλων καὶ προφητῶν
  choice: apôtres et prophètes
  rationale: Correspondance directe avec les deux fonctions désignées dans le texte.
- source_word: κατὰ τὸ δόγμα τοῦ εὐαγγελίου
  choice: conformément à la règle de l’Évangile
  rationale: « Conformément à » exprime la norme indiquée par κατά. Ici, δόγμα désigne une règle ou directive faisant autorité; « règle » conserve cette force sans le sens doctrinal moderne plus étroit de « dogme ».
- source_word: οὕτω ποιήσατε
  choice: agissez ainsi
  rationale: Impératif français concis et naturel qui restitue l’ordre général exprimé par ποιήσατε avec οὕτω.
theological_decisions:
- issue: Sens de « l’Évangile » dans l’expression normative
  choice: Conserver « la règle de l’Évangile » sans préciser davantage
  alternative: « la règle donnée dans l’Évangile » ou « l’enseignement de l’Évangile »
  rationale: Le génitif τοῦ εὐαγγελίου peut exprimer l’appartenance ou la source. La formulation retenue préserve cette latitude sans identifier arbitrairement un écrit précis ni réduire δόγμα à un simple enseignement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe place d’abord le thème, comme le grec, puis donne une consigne brève. Aucun marqueur temporel tel que « maintenant » n’est ajouté.
