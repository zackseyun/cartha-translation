  source_fidelity: 'Le texte français rend fidèlement tous les éléments grecs : Περὶ δέ par « Quant aux », les deux groupes « apôtres et prophètes », κατά avec une formulation normative (« conformément à »), δόγμα par « règle », et l’impératif concis οὕτω ποιήσατε par « agissez ainsi ». L’ordre français déplace légitimement le complément normatif après l’impératif sans altérer le sens.'
