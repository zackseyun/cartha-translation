review_pass:
  verdict: revise
  source_fidelity: La traduction proposée transforme « οὐ μενεῖ ... ἡμέραν μίαν » (« il ne restera pas un jour ») en une limite interprétative (« il ne restera pas plus d’un jour »). Cette explicitation n’est pas portée par le texte grec fourni et atténue la tension avec la concession qui suit. La révision conserve donc la formulation transmise et signale sa difficulté en note.
  naturalness: Le français révisé reste lisible, tout en respectant l’ellipse et la juxtaposition quelque peu déroutante du grec. « S’il y a nécessité » rend directement ἐὰν ... ᾖ χρεία ; « le lendemain » est une restitution idiomatique de τὴν ἄλλην [ἡμέραν].
  terminology: « Faux prophète » est l’équivalent direct et établi de ψευδοπροφήτης. Aucun terme théologique ne requiert d’interprétation confessionnelle.
  issues:
  - severity: medium
    issue: La limite « pas plus d’un jour » est une harmonisation interprétative.
    rationale: Le grec fourni ne dit pas « pas plus d’un jour » ni « seulement un jour », mais comporte la négation οὐ avec « un jour ». Même si le sens contextuel ou une tradition textuelle peut conduire à une autre compréhension, le texte du corps ne devrait pas résoudre cette difficulté sans l’indiquer.
  - severity: low
    issue: La note actuelle affirme comme sens normalement compris une limite qui n’est pas exprimée dans le texte grec fourni.
    rationale: La note doit décrire la difficulté textuelle et l’ellipse plutôt que justifier dans le corps une reformulation qui modifie la portée immédiate de la négation.
  revised_text: Mais il ne restera pas un jour[a] ; s’il y a nécessité, il restera aussi le lendemain. Mais s’il reste trois jours, c’est un faux prophète.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « il ne restera pas un jour ». Dans le texte grec fourni, cette formulation est difficile à concilier avec la permission de rester aussi le lendemain en cas de nécessité. La traduction conserve la négation et restitue explicitement, dans la proposition suivante, le verbe sous-entendu.'
    reason: Préserver la formulation et la difficulté du texte source, sans introduire dans le corps une limitation interprétative (« pas plus d’un jour »).
  revision_rationale: La révision retire l’harmonisation « pas plus d’un jour », non exprimée par le grec fourni. Elle maintient le futur injonctif, rend directement la condition de nécessité et conserve le jugement catégorique « c’est un faux prophète ». La note explicite la difficulté de l’enchaînement sans proposer une solution doctrinale ou une émendation non attestée dans le texte de départ.
