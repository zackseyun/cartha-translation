source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ μενεῖ δὲ ἡμέραν μίαν· ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην· τρεῖς δὲ ἐὰν μείνῃ, ψευδοπροφήτης ἐστίν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/005.yaml
  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: fr
  text: Cependant, il ne restera pas plus d’un jour[a] ; en cas de besoin, il pourra rester aussi le lendemain. Mais s’il reste trois jours, c’est un faux prophète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne restera pas un jour ». Dans le contexte, cette expression est généralement comprise comme une limite d’un jour.'
    reason: Signaler la formulation elliptique du grec sans laisser dans le corps du texte une phrase française obscure ou apparemment contradictoire avec la permission de rester le lendemain.
lexical_decisions:
- source_word: οὐ μενεῖ δὲ ἡμέραν μίαν
  choice: Cependant, il ne restera pas plus d’un jour
  rationale: Le grec dit littéralement « il ne restera pas un jour », formulation elliptique rendue difficile par la permission qui suit de rester le jour suivant en cas de besoin. « Pas plus d’un jour » exprime naturellement en français la limite normalement comprise dans ce contexte, tout en signalant l’ellipse dans une note.
- source_word: ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην
  choice: en cas de besoin, il pourra rester aussi le lendemain
  rationale: « Le lendemain » restitue naturellement τὴν ἄλλην, littéralement « l’autre [journée] », tandis que « pourra » explicite la permission impliquée.
- source_word: ψευδοπροφήτης
  choice: faux prophète
  rationale: Équivalent français direct et traditionnel, sans ajout interprétatif.
theological_decisions:
- issue: Critère permettant de reconnaître un faux prophète
  choice: 'Conserver l’affirmation catégorique : « c’est un faux prophète »'
  alternative: « considérez-le comme un faux prophète »
  rationale: Le grec emploie simplement ἐστίν, « il est » ; la traduction ne transforme donc pas l’énoncé en consigne communautaire explicite.
translation_notes:
  register: Français moderne, clair et digne. Les enchaînements ont été légèrement fluidifiés, sans atténuer la règle ni le jugement final.
