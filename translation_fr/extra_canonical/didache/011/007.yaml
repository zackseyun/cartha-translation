id: DID.11.7
reference: Didache 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
translation:
  language: fr
  text: Vous ne mettrez à l’épreuve ni ne jugerez aucun prophète qui parle sous l’action de l’Esprit[a] ; car tout péché sera pardonné, mais ce péché-là ne sera pas pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui parle dans l’Esprit ».'
    reason: La tournure grecque ἐν πνεύματι peut être rendue formellement par « dans l’Esprit » ; la note préserve cette expression et son éventuelle nuance tout en gardant un français naturel dans le texte.
lexical_decisions:
- source_word: πειράσετε
  choice: mettrez à l’épreuve
  rationale: Le verbe désigne ici le fait de tester ou d’éprouver. « Mettre à l’épreuve » conserve cette portée sans suggérer seulement la tentation.
- source_word: διακρινεῖτε
  choice: jugerez
  rationale: Dans ce contexte, le verbe peut exprimer le fait de porter un jugement ou de trancher sur l’authenticité du prophète. « Juger » restitue sobrement cette idée.
- source_word: λαλοῦντα ἐν πνεύματι
  choice: qui parle sous l’action de l’Esprit
  rationale: Cette formulation française naturelle exprime la parole inspirée par l’Esprit tout en signalant en note l’alternative plus formelle « dans l’Esprit ».
- source_word: πάντα προφήτην ... οὐ
  choice: aucun prophète ... ne
  rationale: 'Avec la négation, πᾶς a ici une portée totale : l’interdiction concerne tout prophète parlant sous l’action de l’Esprit, et non le fait de les éprouver tous sans exception.'
- source_word: ἀφεθήσεται
  choice: sera pardonné
  rationale: Le passif est rendu directement et conserve le passif théologique implicite, sans nommer explicitement Dieu comme agent.
theological_decisions:
- issue: Portée de l’interdiction concernant le prophète
  choice: L’interdiction absolue est formulée par « aucun prophète » lorsqu’il parle sous l’action de l’Esprit.
  alternative: « Vous ne mettrez pas à l’épreuve tout prophète »
  rationale: La construction grecque πᾶς avec un verbe nié correspond ici à une négation totale ; une reproduction littérale en français créerait une ambiguïté de portée trompeuse.
- issue: Rapport avec le péché impardonnable
  choice: Conserver « ce péché-là » sans identifier davantage sa nature.
  alternative: Identifier explicitement ce péché au blasphème contre l’Esprit.
  rationale: Le texte fait écho à la tradition évangélique, mais ne donne pas ici cette désignation précise. L’expliciter dans le corps du texte résoudrait une tension que le grec laisse implicite.
translation_notes:
  register: Français moderne, international et digne. Les futurs « mettrez », « jugerez » rendent les futurs grecs employés comme interdictions. La coordination « ni… » évite de répéter inutilement la négation, tandis que « ce péché-là » marque clairement le contraste final.
