review_pass:
  verdict: approve
  source_fidelity: Le texte rend fidèlement la construction négative totale de πάντα προφήτην ... οὐ, les deux verbes coordonnés πειράσετε et διακρινεῖτε, ainsi que l’opposition entre le pardon de tout péché et l’exception finale. Le passif de ἀφεθήσεται est correctement conservé sans expliciter l’agent divin. « Sous l’action de l’Esprit » est une interprétation idiomatique raisonnable de ἐν πνεύματι, dont la formulation plus littérale est utilement signalée en note.
  naturalness: Français moderne, clair et de registre approprié. « Vous ne mettrez à l’épreuve ni ne jugerez aucun prophète » est grammatical et naturel; le futur injonctif rend bien la valeur prohibitive grecque. La ponctuation et l’enchaînement causal sont satisfaisants.
  terminology: « Mettre à l’épreuve », « jugerez », « l’Esprit », « péché » et « sera pardonné » sont cohérents, sobres et ne surdéterminent pas le sens. « Ce péché-là » maintient correctement l’allusion sans lui imposer une identification doctrinale.
