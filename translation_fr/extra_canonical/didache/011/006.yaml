id: DID.11.6
reference: Didache 11:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: fr
  text: Quand l’apôtre repart, qu’il ne prenne rien, sauf du pain jusqu’à ce qu’il soit hébergé. Mais s’il demande de l’argent, c’est un faux prophète.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξερχόμενος
  choice: repart
  rationale: Dans le contexte de l’accueil puis du départ d’un apôtre itinérant, « repart » exprime naturellement l’action de quitter le lieu où il a séjourné.
- source_word: ὁ ἀπόστολος
  choice: l’apôtre
  rationale: Le terme désigne ici un envoyé ou missionnaire itinérant; « apôtre » conserve le vocabulaire propre au document et sa portée historique.
- source_word: μηδὲ λαμβανέτω εἰμὴ ἄρτον
  choice: qu’il ne prenne rien, sauf du pain
  rationale: Rend directement l’interdiction assortie d’une unique exception.
- source_word: ἕως οὗ αὐλισθῇ
  choice: jusqu’à ce qu’il trouve où passer la nuit
  rationale: Le verbe αὐλίζομαι évoque le fait de loger ou de passer la nuit; cette formulation française explicite naturellement le sens contextuel sans préciser indûment le type d’hébergement.
- source_word: ἀργύριον
  choice: de l’argent
  rationale: Dans ce contexte, le mot désigne de l’argent comme moyen de paiement, plutôt que le métal argent au sens matériel.
- source_word: ψευδοπροφήτης
  choice: un faux prophète
  rationale: Équivalent français direct qui conserve la qualification religieuse et polémique du grec.
theological_decisions:
- issue: Relation entre les titres « apôtre » et « faux prophète »
  choice: Conserver les deux termes tels quels
  alternative: Harmoniser en disant « faux apôtre » ou rendre « apôtre » par « missionnaire »
  rationale: Le grec passe délibérément de ἀπόστολος à ψευδοπροφήτης. La traduction préserve cette tension terminologique au lieu de la corriger ou de l’interpréter.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le ton normatif du passage tout en employant une expression idiomatique pour l’hébergement nocturne.
