id: DID.11.12
reference: Didache 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
translation:
  language: fr
  text: 'Mais si quelqu’un dit dans l’Esprit : « Donne-moi de l’argent ou autre chose », ne l’écoutez pas. Mais s’il demande qu’on donne à d’autres qui sont dans le besoin, que personne ne le juge.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: Cette formulation conserve l’expression grecque et son possible sens de parole prononcée sous l’inspiration de l’Esprit, sans expliciter davantage que le texte.
- source_word: ἀργύρια
  choice: de l’argent
  rationale: Dans ce contexte de demande matérielle, le pluriel grec désigne naturellement de l’argent plutôt que le métal argent.
- source_word: ἢ ἕτερά τινα
  choice: ou autre chose
  rationale: Ces mots complètent directement l’impératif « Donne-moi » et doivent donc rester à l’intérieur de la citation.
- source_word: ὑστερούντων
  choice: qui sont dans le besoin
  rationale: Rend clairement l’idée de personnes qui manquent du nécessaire, dans un français naturel.
- source_word: οὐκ ἀκούσεσθε αὐτοῦ
  choice: vous ne l’écouterez pas
  rationale: Le futur grec a ici une valeur directive; le futur français en préserve la forme ferme et solennelle.
theological_decisions:
- issue: Portée de « dans l’Esprit »
  choice: Maintenir l’expression « dans l’Esprit »
  alternative: « sous l’inspiration de l’Esprit »
  rationale: Le choix retenu préserve la formulation et la tension du grec sans définir explicitement la nature de l’expérience prophétique.
- issue: Jugement du prophète demandant pour autrui
  choice: « que personne ne le juge »
  alternative: « que personne ne le condamne »
  rationale: κρινέτω signifie d’abord juger; « condamner » préciserait indûment l’issue du jugement.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement dans « Donne-moi » reflète le singulier grec δός, tandis que « vous ne l’écouterez pas » s’adresse à la communauté. « En revanche » marque nettement le contraste entre une demande intéressée et une demande faite pour les nécessiteux.
