    issue: Formulation française peu naturelle de la seconde proposition
    rationale: « s’il dit de donner » calque le grec εἴπῃ δοῦναι, mais sonne maladroitement en français. « s’il demande qu’on donne » garde le sens d’une instruction ou demande de don pour autrui.
  - severity: low
    issue: Futur injonctif moins idiomatique
    rationale: « vous ne l’écouterez pas » est possible dans un registre scripturaire, mais « ne l’écoutez pas » restitue clairement la force directive du futur grec dans un français moderne.
