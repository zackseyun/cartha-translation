- from: 'Mais quiconque dit dans l’Esprit : « Donne-moi de l’argent ou autre chose », vous ne l’écouterez pas. En revanche, s’il dit de donner pour d’autres qui sont dans le besoin, que personne ne le juge.'
  to: 'Mais si quelqu’un dit dans l’Esprit : « Donne-moi de l’argent ou autre chose », ne l’écoutez pas. Mais s’il demande qu’on donne à d’autres qui sont dans le besoin, que personne ne le juge.'
  rationale: 'Révision limitée à l’idiomaticité française : l’expression grecque relative à l’Esprit est conservée sans explicitation théologique, la demande de biens reste explicitement citée, et l’opposition entre intérêt personnel et aide aux nécessiteux demeure intacte.'
