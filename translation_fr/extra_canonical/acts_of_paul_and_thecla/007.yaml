review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le témoin anglais fourni. Les relations syntaxiques, l’ambiguïté de « elle ne m’appartient pas », la plainte de Thècle et la condamnation aux bêtes sont préservées. Une légère révision de 7:6 rend plus exactement la valeur temporelle de « upon her confession » : la condamnation intervient après l’aveu, non causalement parce qu’elle a avoué.'
  naturalness: Le français est naturel, moderne et d’un registre narratif approprié. « Ne me fais pas violence » rend avec justesse l’appel à ne pas être contrainte. « Devant tout le peuple » convient au contexte public.
  terminology: Les noms Onésiphore, Thècle, Antioche, Iconium et Thamyris sont cohérents. « Magistrat de la cité », « notables », « servante de Dieu », « vêtement » et « couronne » évitent de surinterpréter le témoin. Aucun ancrage de note n’est requis dans ce passage.
  issues:
  - severity: low
    issue: '7:6 : « Comme elle reconnut ce qu’elle avait fait » peut se lire en français comme une relation causale.'
    rationale: Le témoin anglais « upon her confession » situe plutôt la sentence à la suite de l’aveu. « Après qu’elle eut reconnu… » maintient clairement cette succession sans modifier le sens.
