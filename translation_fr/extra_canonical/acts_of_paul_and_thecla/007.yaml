base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: fr
  text: '**7:1** Paul renvoya Onésiphore et sa famille chez eux. Puis il prit Thècle avec lui et partit pour Antioche.


    **7:2** Dès leur entrée dans la ville, un Syrien nommé Alexandre, magistrat de la cité, vit Thècle et s’éprit d’elle. Au cours de sa magistrature, il avait rendu de nombreux services importants à la ville. Il tenta de gagner Paul à sa cause en lui offrant quantité de riches présents.


    **7:3** Mais Paul lui répondit : « Je ne connais pas la femme dont tu parles, et elle ne m’appartient pas. »


    **7:4** Alexandre, qui jouissait d’un grand pouvoir à Antioche, saisit Thècle dans la rue et l’embrassa. Elle ne le supporta pas. Cherchant Paul du regard, elle cria d’une voix forte et angoissée : « Ne me fais pas violence, moi qui suis étrangère ! Ne me fais pas violence, moi qui suis servante de Dieu ! Je compte parmi les notables d’Iconium, et j’ai été contrainte de quitter cette ville parce que j’ai refusé d’épouser Thamyris. »


    **7:5** Alors elle saisit Alexandre, déchira son vêtement, lui arracha sa couronne de la tête et le rendit ridicule devant tout le peuple.


    **7:6** Mais Alexandre, à la fois parce qu’il l’aimait et parce qu’il avait honte de ce qui s’était passé, la conduisit devant le gouverneur. Comme elle reconnut ce qu’elle avait fait, celui-ci la condamna à être livrée aux bêtes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magistrate
  choice: magistrat de la cité
  rationale: Conserve la fonction civique sans préciser abusivement un titre administratif que le témoin fourni ne permet pas d’identifier.
- source_word: fell in love with her
  choice: s’éprit d’elle
  rationale: Expression française naturelle qui rend l’attirance déclarée par le récit sans la romantiser davantage.
- source_word: engage Paul in his interest
  choice: gagner Paul à sa cause
  rationale: Rend l’idée d’obtenir la coopération de Paul au moyen de présents, sans déterminer plus précisément l’accord recherché.
- source_word: does she belong to me
  choice: elle ne m’appartient pas
  rationale: Maintient la formulation troublante du témoin et son ambiguïté quant à l’autorité ou au lien revendiqué, au lieu de la résoudre par une paraphrase.
- source_word: Force me not
  choice: Ne me fais pas violence
  rationale: Exprime la contrainte physique et potentiellement sexuelle tout en conservant la portée ouverte de l’injonction.
- source_word: one of the principal persons of Iconium
  choice: Je compte parmi les notables d’Iconium
  rationale: Rend le statut social élevé affirmé par Thècle sans imposer une charge officielle précise.
- source_word: coat
  choice: vêtement
  rationale: Choix prudent, puisque le témoin anglais ne permet pas à lui seul d’établir avec certitude la nature exacte de la pièce d’habillement.
- source_word: crown
  choice: couronne
  rationale: Conserve le terme transmis sans préciser s’il s’agit d’une couronne civique, festive ou d’un autre insigne.
- source_word: thrown among the beasts
  choice: livrée aux bêtes
  rationale: Formule idiomatique correspondant au châtiment public, sans ajouter de détail sur l’arène ou le mode d’exécution.
theological_decisions:
- issue: Désignation de Thècle comme servante de Dieu
  choice: servante de Dieu
  alternative: esclave de Dieu
  rationale: Le témoin fourni porte « servant of God ». « Servante » préserve la confession religieuse dans un registre digne sans renforcer artificiellement la nuance d’asservissement en l’absence d’un contrôle direct du grec.
- issue: Déclaration de Paul sur son lien avec Thècle
  choice: elle ne m’appartient pas
  alternative: elle n’est pas sous mon autorité
  rationale: La traduction retenue conserve la tension narrative et morale de la déclaration de Paul; l’alternative interpréterait le genre de relation niée.
translation_notes:
  register: Français international moderne, narratif et digne, avec tutoiement dans le dialogue conformément à l’usage de traduction des récits anciens. Le texte a été établi prudemment à partir du témoin anglais public fourni; la révision directe de la tradition grecque et des versions anciennes reste à effectuer. Les titres administratifs, le type de vêtement et la nature de la « couronne » n’ont donc pas été précisés au-delà de ce que permet ce témoin.
