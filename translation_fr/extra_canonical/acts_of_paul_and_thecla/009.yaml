  text: '9:1 Then Thecla was taken from Trifina, stripped naked, fitted with a belt, and thrown into the place appointed for fighting wild beasts. The lions and bears were released against her.


    9:2 But the fiercest of them all, a lioness, ran to Thecla and lay down at her feet. At this, the crowd of women shouted loudly.


    9:3 Then a female bear charged fiercely toward her, but the lioness met the bear and tore it to pieces.


    9:4 Again, a male lion that was accustomed to devouring people, and that belonged to Alexander, ran toward her. But the lioness confronted the male lion, and they killed each other.


    9:5 Then the women became even more distressed because the lioness that had helped Thecla was dead.


    9:6 Afterward, they brought out many other wild beasts. But Thecla stood with her hands stretched toward heaven and prayed. When she had finished praying, she turned around, saw a pool of water, and said, “Now is the right time for me to be baptized.”


    9:7 So she threw herself into the water and said, “In your name, O my Lord Jesus Christ, I am baptized on this last day.” When the women and the people saw this, they cried out, “Do not throw yourself into the water!” The governor himself also cried out at the thought that the fish (sea-calves) were likely to devour so much beauty.


    9:8 Despite all this, Thecla threw herself into the water in the name of our Lord Jesus Christ.


    9:9 But when the fish (sea-calves) saw the lighting and fire, they were killed and floated dead on the surface of the water. A cloud of fire surrounded Thecla, so that just as the beasts could not come near her, the people could not see her nakedness.


    9:10 Yet they released other wild beasts against her. At this, the women raised a deeply mournful cry. Some of them scattered spikenard, others cassia, others amomus [a kind of spikenard, or the herb of Jerusalem, or ladies’ rose], and others ointment. The amount of ointment was great, in proportion to the number of people. Then all the beasts lay down as though they were fast asleep and did not touch Thecla.


    9:11 Then Alexander said to the governor, “I have some very terrifying bulls. Let us bind her to them.” The governor replied with concern, “You may do what you think is appropriate.”


    9:12 Then they put a cord around Thecla’s waist that also bound her feet, and with it they tied her to the bulls. They applied red-hot irons to the bulls’ genitals so that, being tormented even more, they might drag Thecla around more violently until they had killed her.


    9:13 The bulls tore around, making a horrifying noise. But the flame surrounding Thecla burned through the cords fastened to the bulls’ members, and she stood in the middle of the arena as calmly as if she had not been bound.


    9:14 Meanwhile, Trifina, who was sitting on one of the benches, fainted and died. At this, the whole city became greatly distressed.


    9:15 Alexander himself was afraid and pleaded with the governor, saying, “I beg you, have compassion on me and on the city, and release this woman who has fought with the beasts, lest you, I, and the whole city be destroyed.


    9:16 For if Caesar receives any report of what has just happened, he will certainly destroy the city at once, because Trifina, a woman of royal descent and his relative, has died in her seat.”


    9:17 Then the governor called Thecla to him from among the beasts and said to her, “Who are you, and what is your condition, that not one of the beasts will touch you?”


    9:18 Thecla answered him, “I am a servant of the living God. As for my condition, I am a believer in Jesus Christ, his Son, in whom God is well pleased. For that reason, none of the beasts could touch me.


    9:19 He alone is the way to eternal salvation and the foundation of eternal life. He is a refuge for those in distress, a support for the afflicted, and hope and defense for the hopeless. In short, all who do not believe in him will not live but will suffer eternal death.”


    9:20 When the governor heard these things, he ordered her clothes to be brought and said to her, “Put on your clothes.”


    9:21 Thecla replied, “May the God who clothed me when I was naked among the beasts clothe your soul with the robe of salvation on the day of judgment.” Then she took her clothes and put them on. The governor immediately issued an order in these words: “I release to you Thecla, the servant of God.”


    9:22 At this, the women cried out together in a loud voice and, with one accord, praised God, saying, “There is only one God, who is the God of Thecla—the one God who has delivered Thecla.”


    9:23 Their voices were so loud that the whole city seemed to be shaken. Trifina herself heard the good news, rose again, and ran with the crowd to meet Thecla. Embracing her, she said, “Now I believe that there will be a resurrection of the dead. Now I am convinced that my daughter is alive. Therefore, come home with me, my daughter Thecla, and I will transfer to you everything I have.”


    9:24 So Thecla went with Trifina and stayed there for a few days, teaching her the word of the Lord. Through this, many young women were converted, and there was great joy in Trifina’s household.


    9:25 But Thecla longed to see Paul. She made inquiries and sent people everywhere to find him. At last, when she was told that he was at Myra in Lycia, she took many young men and women with her. She put on a belt, dressed herself in men’s clothing, and went to him at Myra in Lycia. There she found Paul preaching the word of God, and she stood beside him among the crowd.'
translation:
  language: fr
  text: '9:1 Alors Thècle fut arrachée à Tryphène, déshabillée, ceinte d’une ceinture et jetée dans l’arène destinée aux combats contre les bêtes sauvages. On lâcha contre elle les lions et les ours.


    9:2 Mais une lionne, la plus féroce de toutes, courut vers Thècle et se coucha à ses pieds. À cette vue, la foule des femmes poussa de grands cris.


    9:3 Puis une ourse fonça furieusement sur elle, mais la lionne affronta l’ourse et la mit en pièces.


    9:4 Ensuite, un lion appartenant à Alexandre, habitué à dévorer des êtres humains, courut vers elle. Mais la lionne l’affronta, et ils s’entretuèrent.


    9:5 Alors les femmes furent encore plus bouleversées, parce que la lionne qui avait secouru Thècle était morte.


    9:6 Après cela, on fit sortir beaucoup d’autres bêtes sauvages. Mais Thècle, debout, les mains tendues vers le ciel, priait. Quand elle eut fini de prier, elle se retourna, vit un bassin rempli d’eau et dit : « C’est maintenant le moment de recevoir le baptême. »


    9:7 Elle se jeta donc dans l’eau et dit : « En ton nom, ô mon Seigneur Jésus-Christ, je reçois le baptême en ce dernier jour. » En voyant cela, les femmes et le peuple crièrent : « Ne te jette pas dans l’eau ! » Le gouverneur lui-même poussa un cri à la pensée que les monstres marins[a] allaient dévorer une si grande beauté.


    9:8 Malgré tout, Thècle se jeta dans l’eau au nom de notre Seigneur Jésus-Christ.


    9:9 Mais lorsque les monstres marins virent l’éclair et le feu, ils périrent et leurs corps flottèrent à la surface. Une nuée de feu entoura Thècle : les bêtes ne pouvaient pas s’approcher d’elle, et le peuple ne pouvait pas voir sa nudité.


    9:10 Pourtant, on lâcha encore d’autres bêtes sauvages contre elle. Alors les femmes poussèrent une plainte déchirante. Certaines répandirent du nard, d’autres de la casse, d’autres de l’amome[b], et d’autres encore des parfums. La quantité de parfum fut aussi grande que la foule était nombreuse. Alors toutes les bêtes se couchèrent comme profondément endormies et ne touchèrent pas Thècle.


    9:11 Alexandre dit alors au gouverneur : « J’ai des taureaux particulièrement redoutables. Attachons-la à eux. » Le gouverneur lui répondit avec inquiétude : « Fais ce que tu juges bon. »


    9:12 Ils passèrent une corde autour de la taille de Thècle, lui lièrent aussi les pieds et l’attachèrent aux taureaux. Puis ils appliquèrent des fers rougis au feu sur les parties génitales des taureaux afin que, rendus plus furieux par la douleur, ils traînent Thècle avec une violence accrue jusqu’à la tuer.


    9:13 Les taureaux bondissaient en tous sens avec des mugissements terrifiants. Mais la flamme qui entourait Thècle brûla les cordes attachées aux membres des taureaux, et elle resta debout au milieu de l’arène, aussi calme que si elle n’avait jamais été liée.


    9:14 Pendant ce temps, Tryphène, assise sur l’un des gradins, s’évanouit et mourut. Toute la ville en fut profondément bouleversée.


    9:15 Alexandre lui-même prit peur et supplia le gouverneur : « Je t’en prie, aie pitié de moi et de la ville, et libère cette femme qui a combattu contre les bêtes, de peur que toi, moi et toute la ville ne soyons détruits.


    9:16 En effet, si César apprend ce qui vient de se passer, il détruira certainement la ville sur-le-champ, car Tryphène, femme de sang royal et sa parente, est morte sur son siège. »


    9:17 Alors le gouverneur fit venir Thècle hors du milieu des bêtes et lui demanda : « Qui es-tu ? Que se passe-t-il à ton sujet pour qu’aucune des bêtes ne te touche ? »


    9:18 Thècle lui répondit : « Je suis une servante du Dieu vivant. Quant à ce qui me concerne, je crois en Jésus-Christ, son Fils, en qui Dieu prend plaisir. Voilà pourquoi aucune des bêtes n’a pu me toucher.


    9:19 Lui seul est le chemin du salut éternel et le fondement de la vie éternelle. Il est le refuge des personnes en détresse, le soutien des affligés, l’espérance et la protection de celles qui n’ont plus d’espoir. En un mot, tous ceux qui ne croient pas en lui ne vivront pas, mais subiront la mort éternelle. »


    9:20 Après avoir entendu ces paroles, le gouverneur ordonna qu’on apporte ses vêtements et lui dit : « Remets tes vêtements. »


    9:21 Thècle répondit : « Que le Dieu qui m’a vêtue lorsque j’étais nue au milieu des bêtes revête ton âme du vêtement du salut au jour du jugement. » Elle prit alors ses vêtements et les remit. Aussitôt, le gouverneur proclama : « Je vous rends Thècle, la servante de Dieu, et je la libère. »


    9:22 Alors les femmes s’écrièrent toutes ensemble d’une voix forte et, d’un même cœur, louèrent Dieu en disant : « Il n’y a qu’un seul Dieu, le Dieu de Thècle, le seul Dieu qui a délivré Thècle ! »


    9:23 Leurs voix étaient si fortes que la ville entière semblait trembler. Tryphène elle-même entendit l’heureuse nouvelle, revint à la vie[c] et courut avec la foule à la rencontre de Thècle. Elle la serra dans ses bras et dit : « Maintenant, je crois qu’il y aura une résurrection des morts. Maintenant, je suis convaincue que ma fille est vivante. Viens donc chez moi, ma fille Thècle, et je te donnerai tout ce que je possède. »


    9:24 Thècle partit donc avec Tryphène et demeura quelques jours chez elle, lui enseignant la parole du Seigneur. Ainsi, beaucoup de jeunes femmes se convertirent, et une grande joie remplit la maison de Tryphène.


    9:25 Mais Thècle désirait ardemment revoir Paul. Elle se renseigna et envoya partout des gens à sa recherche. Quand elle apprit enfin qu’il se trouvait à Myre, en Lycie, elle emmena avec elle de nombreux jeunes hommes et jeunes femmes. Elle se ceignit d’une ceinture, revêtit des habits d’homme et alla le rejoindre à Myre, en Lycie. Elle y trouva Paul en train de proclamer la parole de Dieu et se tint près de lui au milieu de la foule.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais porte « poissons (veaux marins) ». L’identification exacte de ces créatures aquatiques reste incertaine.
    reason: Préserver l’incertitude lexicale du témoin et éviter une identification zoologique non établie.
  - marker: b
    text: L’amome est un aromate antique dont l’identification botanique exacte est incertaine; le témoin le rapproche de diverses plantes parfumées.
    reason: Le développement botanique du témoin est lui-même hésitant et ne doit pas être présenté comme une identification certaine.
  - marker: c
    text: Le récit avait déclaré que Tryphène était morte (9:14). Son retour à la vie est conservé ici sans réduire sa mort à un simple évanouissement.
    reason: Signaler une tension narrative et théologique authentique sans l’harmoniser.
lexical_decisions:
- source_word: fish (sea-calves)
  choice: monstres marins
  rationale: Le témoin anglais hésite entre poissons et « sea-calves ». « Monstres marins » rend naturellement le rôle de créatures dangereuses sans les identifier abusivement à une espèce précise; l’incertitude est signalée en note.
- source_word: amomus
  choice: amome
  rationale: Translittération française du nom antique d’un aromate dont l’identification botanique demeure incertaine.
- source_word: girdle / belt
  choice: ceinture / se ceignit d’une ceinture
  rationale: « Ceinture » est clair en français moderne et conserve le détail vestimentaire récurrent sans archaïsme inutile.
- source_word: condition / circumstances
  choice: Que se passe-t-il à ton sujet / Quant à ce qui me concerne
  rationale: Le témoin anglais est maladroit et probablement dépendant d’une formulation grecque à revoir. La traduction préserve la question sur l’identité ou le statut particulier de Thècle sans lui attribuer une doctrine précise.
- source_word: rose again
  choice: revint à la vie
  rationale: Dans le contexte immédiat où Tryphène est dite morte, cette formulation exprime naturellement une reprise de vie tout en conservant l’écho explicite à la résurrection.
theological_decisions:
- issue: Baptême de Thècle dans le bassin
  choice: « je reçois le baptême » et « se jeta dans l’eau »
  alternative: « je me baptise »
  rationale: La tournure choisie conserve l’initiative inhabituelle de Thècle sans trancher par une formulation doctrinalement chargée la question de l’auto-baptême.
- issue: Formule christologique de 9:18
  choice: « son Fils, en qui Dieu prend plaisir »
  alternative: « son Fils bien-aimé »
  rationale: La traduction suit le témoin fourni et préserve la formulation d’agrément divin sans importer une expansion confessionnelle.
- issue: Mort et retour à la vie de Tryphène
  choice: Maintien littéral de la mort en 9:14 et du retour à la vie en 9:23
  alternative: Interpréter « mourut » comme un simple évanouissement
  rationale: Le récit crée délibérément une tension reprise par la déclaration sur la résurrection; elle ne doit pas être harmonisée silencieusement.
- issue: Sort des non-croyants
  choice: « ne vivront pas, mais subiront la mort éternelle »
  alternative: « seront éternellement tourmentés »
  rationale: Cette formulation conserve l’opposition vie/mort du témoin sans préciser la nature de la peine au-delà du texte disponible.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe allégée par rapport au témoin de 1820, avec conservation des répétitions significatives, de la violence explicite du supplice et des tensions narratives. Projet provisoire fondé sur le témoin anglais public fourni; une collation directe du grec et des versions anciennes demeure nécessaire.
