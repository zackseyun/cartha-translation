  verdict: revise
  source_fidelity: 'Le projet suit globalement avec exactitude le témoin anglais fourni et préserve les éléments narratifs difficiles : les bêtes, l’immersion baptismale de Thècle, la mort puis le retour à la vie de Tryphène, ainsi que les formules christologiques. Quelques formulations interprètent ou ajoutent légèrement : « recevoir le baptême » atténue l’énoncé passif « être baptisée / je suis baptisée », et 9:21 explicite inutilement la libération après la formule de proclamation. La révision maintient l’ambiguïté et le caractère inhabituel de la scène.'
  naturalness: Le français est fluide, moderne et d’un registre narratif approprié. Les ajustements proposés rendent plus idiomatiques « on lui mit une ceinture », la comparaison quantitative de 9:10, et évitent l’alternance non motivée vers un référent féminin exclusif en 9:19.
  terminology: Les noms Thècle, Tryphène, Alexandre, Myre et Lycie sont cohérents. « Amome » est approprié avec note. Pour les créatures aquatiques, « monstres marins » demeure une solution interprétative mais la note préserve explicitement l’incertitude du témoin. Les termes « salut », « vie éternelle », « Dieu vivant » et « robe du salut » sont conservés sans surcharge doctrinale.
  issues:
  - severity: medium
    issue: '9:6–7 : formulation du baptême'
    rationale: « Recevoir le baptême » peut suggérer un rite administré par autrui, alors que le témoin dit littéralement « être baptisée » au moment où Thècle se jette elle-même dans l’eau. « Être baptisée / je suis baptisée » conserve mieux la voix passive et l’étrangeté narrative sans résoudre la question rituelle.
  - severity: low
    issue: '9:19 : référent de « celles qui n’ont plus d’espoir »'
    rationale: Le texte vise de manière générale « those who are hopeless »; le féminin exclusif est introduit par la traduction et n’est pas justifié par le contexte immédiat.
  - severity: low
    issue: '9:21 : ajout explicatif dans la proclamation'
    rationale: « Je vous rends Thècle, la servante de Dieu » traduit déjà la formule du témoin. L’ajout « et je la libère » est redondant et dépasse la formulation attestée.
  - severity: low
    issue: '9:10 : expression de proportion'
    rationale: « Aussi grande que la foule était nombreuse » est compréhensible mais moins naturel et moins proche de l’idée d’une quantité abondante proportionnée au nombre des personnes.
  revised_text: '9:1 Alors Thècle fut retirée d’auprès de Tryphène, déshabillée, on lui mit une ceinture et on la jeta dans l’arène destinée aux combats contre les bêtes sauvages. On lâcha contre elle les lions et les ours.


    9:2 Mais une lionne, la plus féroce de toutes, courut vers Thècle et se coucha à ses pieds. À cette vue, la foule des femmes poussa de grands cris.


    9:3 Puis une ourse fonça furieusement sur elle, mais la lionne affronta l’ourse et la mit en pièces.


    9:4 Ensuite, un lion appartenant à Alexandre, habitué à dévorer des êtres humains, courut vers elle. Mais la lionne l’affronta, et ils s’entretuèrent.


    9:5 Alors les femmes furent encore plus bouleversées, parce que la lionne qui avait secouru Thècle était morte.


    9:6 Après cela, on fit sortir beaucoup d’autres bêtes sauvages. Mais Thècle, debout, les mains tendues vers le ciel, priait. Quand elle eut fini de prier, elle se retourna, vit un bassin rempli d’eau et dit : « C’est maintenant le moment pour moi d’être baptisée. »


    9:7 Elle se jeta donc dans l’eau et dit : « En ton nom, ô mon Seigneur Jésus-Christ, je suis baptisée en ce dernier jour. » En voyant cela, les femmes et le peuple crièrent : « Ne te jette pas dans l’eau ! » Le gouverneur lui-même poussa un cri à la pensée que les monstres marins[a] allaient dévorer une si grande beauté.


    9:8 Malgré tout, Thècle se jeta dans l’eau au nom de notre Seigneur Jésus-Christ.


    9:9 Mais lorsque les monstres marins virent l’éclair et le feu, ils périrent et leurs corps flottèrent à la surface. Une nuée de feu entoura Thècle : les bêtes ne pouvaient pas s’approcher d’elle, et le peuple ne pouvait pas voir sa nudité.


    9:10 Pourtant, on lâcha encore d’autres bêtes sauvages contre elle. Alors les femmes poussèrent une plainte déchirante. Certaines répandirent du nard, d’autres de la casse, d’autres de l’amome[b], et d’autres encore des parfums. La quantité de parfum était considérable, à la mesure du nombre de personnes. Alors toutes les bêtes se couchèrent comme profondément endormies et ne touchèrent pas Thècle.


    9:11 Alexandre dit alors au gouverneur : « J’ai des taureaux particulièrement redoutables. Attachons-la à eux. » Le gouverneur lui répondit avec inquiétude : « Fais ce que tu juges bon. »


    9:12 Ils passèrent une corde autour de la taille de Thècle, lui lièrent aussi les pieds et l’attachèrent aux taureaux. Puis ils appliquèrent des fers rougis au feu sur les parties génitales des taureaux afin que, rendus plus furieux par la douleur, ils traînent Thècle avec une violence accrue jusqu’à la tuer.


    9:13 Les taureaux bondissaient en tous sens avec des mugissements terrifiants. Mais la flamme qui entourait Thècle brûla les cordes attachées aux membres des taureaux, et elle resta debout au milieu de l’arène, aussi calme que si elle n’avait jamais été liée.


    9:14 Pendant ce temps, Tryphène, assise sur l’un des gradins, s’évanouit et mourut. Toute la ville en fut profondément bouleversée.


    9:15 Alexandre lui-même prit peur et supplia le gouverneur : « Je t’en prie, aie pitié de moi et de la ville, et libère cette femme qui a combattu contre les bêtes, de peur que toi, moi et toute la ville ne soyons détruits.


    9:16 En effet, si César apprend ce qui vient de se passer, il détruira certainement la ville sur-le-champ, car Tryphène, femme de sang royal et sa parente, est morte sur son siège. »


    9:17 Alors le gouverneur fit venir Thècle hors du milieu des bêtes et lui demanda : « Qui es-tu ? Que se passe-t-il à ton sujet pour qu’aucune des bêtes ne te touche ? »


    9:18 Thècle lui répondit : « Je suis une servante du Dieu vivant. Quant à ce qui me concerne, je crois en Jésus-Christ, son Fils, en qui Dieu prend plaisir. Voilà pourquoi aucune des bêtes n’a pu me toucher.


    9:19 Lui seul est le chemin du salut éternel et le fondement de la vie éternelle. Il est le refuge des personnes en détresse, le soutien des affligés, l’espérance et la protection de ceux qui n’ont plus d’espoir. En un mot, tous ceux qui ne croient pas en lui ne vivront pas, mais subiront la mort éternelle. »


    9:20 Après avoir entendu ces paroles, le gouverneur ordonna qu’on apporte ses vêtements et lui dit : « Remets tes vêtements. »


    9:21 Thècle répondit : « Que le Dieu qui m’a vêtue lorsque j’étais nue au milieu des bêtes revête ton âme du vêtement du salut au jour du jugement. » Elle prit alors ses vêtements et les remit. Aussitôt, le gouverneur proclama : « Je vous rends Thècle, la servante de Dieu. »


    9:22 Alors les femmes s’écrièrent toutes ensemble d’une voix forte et, d’un même cœur, louèrent Dieu en disant : « Il n’y a qu’un seul Dieu, le Dieu de Thècle, le seul Dieu qui a délivré Thècle ! »


    9:23 Leurs voix étaient si fortes que la ville entière semblait trembler. Tryphène elle-même entendit l’heureuse nouvelle, revint à la vie[c] et courut avec la foule à la rencontre de Thècle. Elle la serra dans ses bras et dit : « Maintenant, je crois qu’il y aura une résurrection des morts. Maintenant, je suis convaincue que ma fille est vivante. Viens donc chez moi, ma fille Thècle, et je te donnerai tout ce que je possède. »


    9:24 Thècle partit donc avec Tryphène et demeura quelques jours chez elle, lui enseignant la parole du Seigneur. Ainsi, beaucoup de jeunes femmes se convertirent, et une grande joie remplit la maison de Tryphène.


    9:25 Mais Thècle désirait ardemment revoir Paul. Elle se renseigna et envoya partout des gens à sa recherche. Quand elle apprit enfin qu’il se trouvait à Myre, en Lycie, elle emmena avec elle de nombreux jeunes hommes et jeunes femmes. Elle se ceignit d’une ceinture, revêtit des habits d’homme et alla le rejoindre à Myre, en Lycie. Elle y trouva Paul en train de proclamer la parole de Dieu et se tint près de lui au milieu de la foule.'
