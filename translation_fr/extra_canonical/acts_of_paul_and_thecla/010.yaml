  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: fr
  text: '10:1 Paul fut très surpris lorsqu’il la vit avec les personnes qui l’accompagnaient, car il pensait qu’une nouvelle épreuve allait s’abattre sur eux.


    10:2 Thécla s’en aperçut et lui dit : « J’ai été baptisée, ô Paul, car celui qui t’assiste dans la prédication m’a assistée pour que je sois baptisée[a]. »


    10:3 Alors Paul l’emmena dans la maison d’Hermès. Thécla lui raconta tout ce qui lui était arrivé à Antioche. Paul en fut extrêmement étonné ; tous ceux qui l’entendirent furent affermis dans la foi et prièrent pour le bonheur de Tryphène.


    10:4 Puis Thécla se leva et dit à Paul : « Je vais à Iconium. » Paul lui répondit : « Va, et enseigne la parole du Seigneur. »


    10:5 Or Tryphène avait envoyé à Paul d’importantes sommes d’argent ainsi que des vêtements, par l’intermédiaire de Thécla, afin de secourir les pauvres.


    10:6 Thécla se rendit donc à Iconium. Arrivée dans la maison d’Onésiphore, elle se prosterna à l’endroit où Paul s’était assis pour prêcher. Mêlant ses larmes à ses prières, elle loua et glorifia Dieu en ces termes :


    10:7 « Ô Seigneur, Dieu de cette maison, dans laquelle tu m’as éclairée pour la première fois ; ô Jésus, Fils du Dieu vivant, toi qui m’as secourue devant le gouverneur, dans le feu et parmi les bêtes, toi seul es Dieu pour les siècles des siècles. Amen. »


    10:8 À son retour, Thécla trouva Thamyris mort, mais sa mère encore en vie. Elle appela donc sa mère et lui dit : « Théoclie, ma mère, peux-tu être amenée à croire qu’il n’existe qu’un seul Seigneur Dieu, qui demeure dans les cieux ? Si tu désires de grandes richesses, Dieu te les donnera par mon intermédiaire. Si tu veux retrouver ta fille, me voici. »


    10:9 Elle exposa à sa mère ces choses et beaucoup d’autres, s’efforçant de la convaincre. Mais sa mère Théoclie n’accorda aucun crédit aux paroles de Thécla, la martyre[b].


    10:10 Thécla, voyant qu’elle parlait en vain, traça le signe de la croix sur tout son corps[c], quitta la maison et se rendit à Daphné. Là, elle alla dans la grotte où elle avait trouvé Paul avec Onésiphore, se prosterna à terre et pleura devant Dieu.


    10:11 Après avoir quitté cet endroit, elle se rendit à Séleucie et éclaira beaucoup de gens en leur faisant connaître le Christ.


    10:12 Une nuée lumineuse la guida pendant son voyage.


    10:13 Arrivée à Séleucie, elle se retira en un lieu situé hors de la ville, à environ un stade[d], car elle craignait les habitants, qui adoraient des idoles.


    10:14 Elle fut conduite par la nuée[e] sur une montagne appelée Calamon, ou Rodéon[f]. Elle y demeura de nombreuses années et subit beaucoup de pénibles tentations du diable. Grâce au secours qu’elle recevait du Christ, elle les supporta comme il convenait.


    10:15 Finalement, des femmes de haut rang entendirent parler de la vierge Thécla et vinrent auprès d’elle. Elle les instruisit dans les paroles de Dieu[g], et beaucoup d’entre elles renoncèrent au monde et menèrent avec elle une vie de renoncement[h].


    10:16 Ainsi, la bonne réputation de Thécla se répandit partout, et elle accomplit plusieurs guérisons miraculeuses[i]. De toute la ville et des régions voisines, on amenait donc les malades sur cette montagne ; avant même d’atteindre l’entrée de la grotte, ils étaient aussitôt guéris de quelque maladie qu’ils aient souffert.


    10:17 Les esprits impurs étaient chassés avec fracas. Tous retrouvaient leurs malades en bonne santé et glorifiaient Dieu, qui avait accordé une telle puissance à la vierge Thécla.


    10:18 Dès lors, les médecins de Séleucie ne jouissaient plus d’aucune considération et perdaient tout le revenu de leur métier, car personne ne faisait plus appel à eux. Remplis de jalousie, ils commencèrent alors à chercher ce qu’ils pourraient entreprendre contre cette servante du Christ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation transmise peut aussi se comprendre : « m’a aidée à me baptiser ».'
    reason: Préserver l’ambiguïté relative à l’agent du baptême.
  - marker: b
    text: Ici, « martyre » est un titre donné à Thécla alors qu’elle est encore vivante dans le récit ; il peut avoir le sens ancien de témoin ou de confesseure éprouvée.
    reason: Éviter que le lecteur moderne comprenne nécessairement une mise à mort déjà accomplie.
  - marker: c
    text: Le témoin anglais signale « de la croix » comme une précision ajoutée ou textuellement incertaine.
    reason: Rendre visible le statut incertain des mots entre crochets dans la source de travail.
  - marker: d
    text: Un stade représentait environ 185 mètres, avec des variations selon les lieux et les époques.
    reason: Expliquer l’unité de distance antique.
  - marker: e
    text: La mention explicite de la nuée est signalée comme incertaine ou suppléée dans le témoin anglais.
    reason: Préserver le signal textuel fourni.
  - marker: f
    text: 'Les deux noms de la montagne sont conservés tels qu’ils apparaissent dans la tradition transmise : Calamon ou Rodéon.'
    reason: Ne pas harmoniser une variante toponymique authentique.
  - marker: g
    text: 'Littéralement dans le témoin : « les oracles de Dieu ».'
    reason: Signaler la métaphore religieuse plus marquée derrière la traduction courante.
  - marker: h
    text: Le témoin anglais porte « vie monastique », expression qui peut refléter une étape plus tardive de la transmission du récit.
    reason: Éviter de projeter sans réserve une institution monastique pleinement développée dans la scène narrative.
  - marker: i
    text: Le caractère « miraculeux » est explicite dans le sens du passage, mais le témoin anglais signale le mot lui-même comme suppléé.
    reason: Distinguer le sens contextuel du statut textuel du qualificatif.
lexical_decisions:
- source_word: baptize
  choice: pour que je sois baptisée
  rationale: La tournure évite de faire dire sans ambiguïté à Thécla qu’elle s’est administré elle-même le baptême, tout en conservant l’étrangeté du témoin anglais.
- source_word: enlightened
  choice: éclairée / éclaira
  rationale: Le motif ancien de l’illumination est conservé aux v. 7 et 11 plutôt que réduit à « instruire » ou « convertir ».
- source_word: furlong
  choice: stade
  rationale: Un furlong correspond approximativement au stade antique ; le terme historique est naturel dans ce contexte et expliqué en note.
- source_word: oracles of God
  choice: paroles de Dieu
  rationale: Expression française intelligible qui garde l’idée de déclarations divines sans suggérer les pratiques oraculaires païennes.
- source_word: monastic life
  choice: vie de renoncement
  rationale: Évite l’anachronisme institutionnel possible de « vie monastique », tout en rendant l’ascétisme communautaire décrit par le témoin.
- source_word: martyr
  choice: martyre
  rationale: Le titre traditionnel est conservé, bien que Thécla soit encore vivante dans le récit ; le terme peut désigner ici une témoin ou confesseure éprouvée.
theological_decisions:
- issue: Agent du baptême de Thécla
  choice: « m’a assistée pour que je sois baptisée »
  alternative: « m’a aidée à me baptiser »
  rationale: Le témoin anglais est grammaticalement ambigu. La formulation retenue préserve l’action du secours divin sans trancher explicitement entre auto-baptême et baptême reçu.
- issue: Confession adressée à Jésus au v. 7
  choice: « toi seul es Dieu »
  alternative: « tu es le seul Dieu » ou harmonisation trinitaire explicative
  rationale: La force et la tension christologique du texte transmis sont conservées sans ajout doctrinal destiné à les résoudre.
- issue: Signe de la croix au v. 10
  choice: dans le texte avec note de prudence
  alternative: omettre « de la croix » comme supplément
  rationale: Le témoin fourni signale ces mots comme ajout explicatif. Ils restent lisibles dans le corps du texte, mais la note indique l’incertitude de la base documentaire.
- issue: Puissance de guérison de Thécla
  choice: « puissance [...] accordée [...] par Dieu »
  alternative: attribuer directement toutes les guérisons à Thécla seule
  rationale: 'Suit la formulation du récit : Thécla agit puissamment, mais la puissance est présentée comme un don de Dieu.'
translation_notes:
  register: 'Français international moderne, narratif et dignifié. Les noms propres suivent des formes françaises usuelles : Thécla, Hermès, Tryphène, Onésiphore, Théoclie, Daphné, Séleucie. La traduction demeure provisoire, car la base fournie est un témoin anglais du domaine public et la vérification directe de la tradition grecque et des versions anciennes reste à effectuer.'
