    10:8 À son retour, Thécla trouva Thamyris mort, mais sa mère encore en vie. Elle appela donc sa mère et lui dit : « Théoclie, ma mère, peux-tu être amenée à croire qu’il n’existe qu’un seul Seigneur Dieu, qui demeure dans les cieux ? Si tu désires de grandes richesses, Dieu te les donnera par mon intermédiaire. Si tu veux retrouver ta fille, me voici. »


    10:9 Elle exposa à sa mère ces choses et beaucoup d’autres, [s’efforçant] de la persuader [d’adopter son avis]. Mais sa mère, Théoclie, n’accorda aucun crédit aux paroles de Thécla, la martyre[b].


    10:10 Thécla, voyant qu’elle parlait en vain, fit sur tout son corps le signe [de la croix][c], quitta la maison et se rendit à Daphné. Lorsqu’elle y arriva, elle alla dans la grotte où elle avait trouvé Paul avec Onésiphore, se jeta à terre et pleura devant Dieu.


