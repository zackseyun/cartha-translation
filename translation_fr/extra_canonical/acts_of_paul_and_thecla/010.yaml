    10:13 Après être arrivée à Séleucie, elle se rendit en un lieu hors de la ville, à environ un stade[d], car elle craignait les habitants, qui adoraient des idoles.


    10:14 Elle fut conduite [par la nuée][e] vers une montagne appelée Calamon, ou Rodéon[f]. Elle y demeura de nombreuses années et subit beaucoup de pénibles tentations du diable. Grâce au secours qu’elle recevait du Christ, elle les supporta comme il convenait.


    10:15 Finalement, des femmes de haut rang entendirent parler de la vierge Thécla et vinrent auprès d’elle. Elle les instruisit dans les oracles de Dieu[g], et beaucoup d’entre elles renoncèrent au monde et menèrent avec elle une vie monastique[h].


    10:16 Ainsi, la réputation de Thécla se répandit partout, et elle accomplit plusieurs guérisons [miraculeuses][i]. Toute la ville et les régions voisines amenaient donc leurs malades sur cette montagne ; avant même d’arriver à l’entrée de la grotte, ceux-ci étaient aussitôt guéris de quelque mal dont ils souffraient.


    10:17 Les esprits impurs étaient chassés avec fracas. Tous retrouvaient leurs malades en bonne santé et glorifiaient Dieu, qui avait accordé une telle puissance à la vierge Thécla.


