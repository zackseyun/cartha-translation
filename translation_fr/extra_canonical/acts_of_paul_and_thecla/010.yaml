status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Le projet est globalement fidèle au témoin anglais fourni, mais plusieurs signaux éditoriaux entre crochets ont été effacés du texte courant (10:9, 10:10, 10:14, 10:16), alors que la consigne de travail les identifie comme des marques de supplément ou d’incertitude. Certaines reformulations atténuent aussi indûment le témoin : « vie de renoncement » ne rend pas « vie monastique », et « personne ne faisait plus appel à eux » est plus étroit que « personne ne les considérait plus ».'
  naturalness: 'Le français est clair, moderne et d’un registre narratif approprié. Les ajustements proposés améliorent la précision sans alourdir le texte : « se jeta à terre » rend mieux l’action que « se prosterna » dans ce contexte, et la formulation de 10:16 évite une construction fautive ou pesante avec « souffrir d’une maladie ».'
  terminology: Les formes Thécla, Tryphène, Onésiphore, Théoclie, Daphné et Séleucie conviennent. « Éclairer » est conservé pour le motif d’illumination. « Oracles de Dieu » et « vie monastique » sont traduits directement, avec des notes descriptives plutôt que des substitutions interprétatives. La formulation baptismale reste au passif (« pour être baptisée »), ce qui ne tranche pas au-delà du témoin fourni.
  issues:
  - severity: medium
    issue: Les crochets du témoin ne sont pas conservés de manière cohérente.
    rationale: Les segments [endeavouring], [to her opinion], [of the cross], [by the cloud] et [miraculous] sont des signaux explicites de supplément ou d’incertitude dans le témoin de travail. Les notes seules ne remplacent pas leur visibilité dans le texte, surtout lorsque 10:9 les a entièrement supprimés.
  - severity: medium
    issue: « Vie de renoncement » (10:15) remplace « monastic life ».
    rationale: Cette paraphrase cherche à résoudre une possible question d’anachronisme, mais le témoin emploie explicitement « vie monastique ». Il convient de le rendre directement et, si nécessaire, de signaler en note le caractère possiblement tardif de cette désignation.
  - severity: low
    issue: « Se prosterna » (10:6, 10:10) est plus spécifique que « fell down ».
    rationale: Le témoin décrit le fait de tomber/se jeter au sol sans exprimer nécessairement le geste rituel de prosternation. « Se jeta à terre » conserve l’intensité sans précision ajoutée.
  - severity: low
    issue: La fin de 10:16 est maladroite grammaticalement.
    rationale: « De quelque maladie qu’ils aient souffert » n’est pas une formulation idiomatique ici et mélange les référents. « De quelque mal dont ils souffraient » est naturel et fidèle.
  - severity: low
    issue: 10:18 restreint « no one regarded them » à la seule consultation médicale.
    rationale: « Personne ne faisait plus appel à eux » est plausible contextuellement mais plus limité. « Personne ne les considérait plus » conserve la portée sociale du témoin.
  revised_text: '10:1 Paul fut très surpris lorsqu’il la vit avec les personnes qui l’accompagnaient, car il pensait qu’une nouvelle épreuve allait s’abattre sur eux.


    10:2 Thécla s’en aperçut et lui dit : « J’ai été baptisée, ô Paul, car celui qui t’assiste dans la prédication m’a assistée pour être baptisée[a]. »


    10:3 Alors Paul l’emmena dans la maison d’Hermès. Thécla lui raconta tout ce qui lui était arrivé à Antioche. Paul en fut extrêmement étonné ; tous ceux qui l’entendirent furent affermis dans la foi et prièrent pour le bonheur de Tryphène.


    10:4 Puis Thécla se leva et dit à Paul : « Je vais à Iconium. » Paul lui répondit : « Va et enseigne la parole du Seigneur. »


    10:5 Or Tryphène avait envoyé à Paul d’importantes sommes d’argent, ainsi que des vêtements par l’intermédiaire de Thécla, afin de secourir les pauvres.


    10:6 Thécla se rendit donc à Iconium. Arrivée dans la maison d’Onésiphore, elle se jeta à terre à l’endroit où Paul s’était assis pour prêcher. Mêlant ses larmes à ses prières, elle loua et glorifia Dieu en ces termes :


