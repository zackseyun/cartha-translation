  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/005.yaml
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
translation:
  language: fr
  text: '5:1 Enfin, on s’aperçut de l’absence de Thècle. Sa famille et Thamyris la cherchèrent dans toutes les rues, comme si elle s’était perdue. Mais l’un des compagnons de service du portier leur apprit qu’elle était sortie pendant la nuit.


    5:2 Ils interrogèrent alors le portier, qui leur dit qu’elle était allée à la prison voir l’étranger.


    5:3 Ils suivirent donc ses indications et la trouvèrent là. À leur sortie, ils rassemblèrent une foule et allèrent raconter au gouverneur tout ce qui s’était passé.


    5:4 Le gouverneur ordonna alors qu’on fasse comparaître Paul devant son tribunal.


    5:5 Pendant ce temps, Thècle restait étendue sur le sol de la prison, à l’endroit même où Paul s’était assis pour l’enseigner. Le gouverneur ordonna donc aussi qu’on la fasse comparaître devant son tribunal. Elle accueillit cette convocation avec joie et s’y rendit.


    5:6 Quand Paul fut amené, la foule cria avec encore plus de violence : « C’est un magicien ! Qu’il meure ! »


    5:7 Pourtant, le gouverneur écoutait avec plaisir les discours de Paul sur les œuvres saintes du Christ. Après avoir réuni son conseil, il fit appeler Thècle et lui demanda : « Pourquoi n’épouses-tu pas Thamyris, conformément à la loi des Iconiens ? »


    5:8 Elle resta debout en silence, les yeux fixés sur Paul. Comme elle ne répondait pas, sa mère, Théocléia, s’écria : « Qu’on brûle cette créature injuste ! Qu’on la brûle au milieu du théâtre parce qu’elle refuse Thamyris, afin que toutes les femmes apprennent par son exemple à ne pas agir ainsi ! »


    5:9 Le gouverneur en fut profondément affligé. Il ordonna que Paul soit fouetté et chassé de la ville, et que Thècle soit brûlée.


    5:10 Puis le gouverneur se leva et se rendit aussitôt au théâtre. Tout le peuple sortit pour assister à ce spectacle effroyable.


    5:11 Mais, comme un agneau dans le désert regarde de tous côtés pour trouver son berger, Thècle cherchait Paul du regard.


    5:12 En parcourant la foule des yeux, elle vit le Seigneur Jésus sous les traits de Paul et se dit : « Paul est venu me voir dans ma détresse. » Elle garda les yeux fixés sur lui ; mais, tandis qu’elle le regardait, il monta aussitôt au ciel.


    5:13 Alors les jeunes hommes et les jeunes femmes apportèrent du bois et de la paille pour brûler Thècle. Quand elle fut amenée nue au bûcher, le gouverneur contempla avec étonnement sa très grande beauté et en versa des larmes.


    5:14 Une fois le bois disposé, le peuple lui ordonna de monter sur le bûcher. Elle y monta après avoir fait le signe de la croix.


    5:15 Puis on mit le feu au bûcher. Bien que les flammes fussent immenses, elles ne la touchèrent pas, car Dieu eut compassion d’elle : il provoqua un violent jaillissement depuis les profondeurs de la terre, tandis qu’un nuage déversait d’en haut une pluie et une grêle abondantes.


    5:16 La terre s’étant ouverte, un très grand nombre de personnes coururent un grave danger et quelques-unes furent tuées. Le feu s’éteignit, et Thècle fut sauvée.[a]'
