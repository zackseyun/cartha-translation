  footnotes:
  - marker: a
    text: Traduction provisoire établie à partir d’un ancien témoin anglais du texte. Une vérification directe de la tradition manuscrite grecque et des anciennes versions reste nécessaire, notamment pour certains détails de formulation aux versets 5, 7, 13, 15 et 16.
    reason: La source fournie indique expressément que la révision dans la langue ancienne est encore en attente ; la note rend cette limite éditoriale transparente.
lexical_decisions:
- source_word: porter / gatekeeper
  choice: portier
  rationale: Le contexte paraît désigner le gardien de l’accès à la maison ; « portier » conserve aussi le lien avec ses compagnons de service.
- source_word: strange man
  choice: l’étranger
  rationale: Rend le statut de Paul comme homme venu d’ailleurs sans suggérer qu’il serait bizarre.
- source_word: judgment seat
  choice: tribunal
  rationale: Formulation française naturelle qui conserve l’idée de comparution officielle devant le gouverneur.
- source_word: wallowing / lay on the ground
  choice: restait étendue sur le sol
  rationale: Évite la connotation animale et potentiellement trompeuse de « se vautrer », tout en conservant la posture d’abandon au lieu où Paul enseignait.
- source_word: magician
  choice: magicien
  rationale: Conserve directement l’accusation antique de pratique magique sans la renforcer en « sorcier ».
- source_word: law of the Iconians
  choice: loi des Iconiens
  rationale: Maintient la formulation civique et locale du témoin sans préciser indûment la nature juridique de cette loi.
- source_word: theatre
  choice: théâtre
  rationale: Conserve le lieu public antique de spectacle et d’exécution.
- source_word: in the likeness of Paul
  choice: sous les traits de Paul
  rationale: Expression française naturelle qui préserve la distinction entre Jésus et Paul tout en indiquant une apparence semblable.
- source_word: preserved
  choice: sauvée
  rationale: Dans ce contexte de délivrance physique du bûcher, « sauvée » est idiomatique, sans exclure la portée religieuse du récit.
theological_decisions:
- issue: Apparition de Jésus sous l’apparence de Paul
  choice: « elle vit le Seigneur Jésus sous les traits de Paul »
  alternative: « elle vit le Seigneur Jésus sous la forme de Paul »
  rationale: « Sous les traits » préserve l’identification explicite du Seigneur Jésus et la ressemblance visible avec Paul sans les confondre ontologiquement.
- issue: Signe de la croix
  choice: Conserver explicitement « le signe de la croix »
  alternative: « après s’être signée »
  rationale: La formulation explicite rend la pratique rapportée par le texte sans l’assimiler davantage à une forme liturgique ultérieure particulière.
- issue: Délivrance de Thècle
  choice: « Thècle fut sauvée » avec note sur la base provisoire
  alternative: « Thècle fut préservée »
  rationale: Le contexte immédiat indique une délivrance du feu ; la traduction ne tranche pas ici une question de salut spirituel.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les phrases ont été fluidifiées sans effacer les répétitions structurantes du récit. Les noms propres suivent les formes françaises usuelles : Thècle, Thamyris, Théocléia, Iconiens. Le texte demeure provisoire puisque seule une traduction anglaise ancienne a été fournie comme témoin direct.'
