review_pass:
  verdict: revise
  source_fidelity: Révision effectuée d’après le témoin anglais fourni, la consultation directe du grec et des versions anciennes restant signalée comme en attente. Le projet suit fidèlement la séquence narrative, les accusations, la comparution, l’apparition et la délivrance. Toutefois, en 5:5, « restait étendue » atténue indûment le mouvement expressif de « lay wallowing on the ground » ; « se roulait sur le sol » le restitue sans registre artificiel.
  naturalness: Le français est moderne, clair et d’un registre narratif soutenu approprié. « Se roulait sur le sol » est naturel dans ce contexte de détresse et rend mieux le verbe du témoin que « restait étendue ».
  terminology: Les noms Thècle, Thamyris, Théocléia et Iconiens sont cohérents. « Portier », « tribunal », « magicien », « sous les traits de Paul » et « signe de la croix » sont des choix justes et non confessionnellement surinterprétatifs. « Sauvée » est acceptable ici au sens de préservée du supplice.
  issues:
  - severity: medium
    issue: 5:5 — atténuation de « lay wallowing on the ground »
    rationale: « Restait étendue sur le sol » décrit une position statique, alors que le témoin indique que Thècle se roulait sur le sol. La correction restitue cette action et l’intensité de sa détresse.
