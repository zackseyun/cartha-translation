  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: fr
  text: 'ACTES DE PAUL ET DE THÈCLE — CHAPITRE I


    1:1 Lorsque Paul monta à Iconium après avoir fui Antioche, Démas et Hermogène se joignirent à lui, bien qu’ils fussent alors pleins d’hypocrisie.


    1:2 Mais Paul, qui ne considérait que la bonté de Dieu, ne leur fit aucun mal et les aima beaucoup.


    1:3 Il s’efforçait donc de leur rendre agréables toutes les paroles divines et tous les enseignements du Christ, ainsi que le dessein de la bonne nouvelle du Fils bien-aimé de Dieu. Il les instruisait dans la connaissance du Christ, telle qu’elle lui avait été révélée.


    1:4 Un homme nommé Onésiphore apprit que Paul était arrivé à Iconium. Il partit aussitôt à sa rencontre avec sa femme, Lectra, et ses fils, Simmia et Xénon, afin de l’inviter chez eux.


    1:5 En effet, Tite leur avait décrit l’apparence de Paul. Ils ne le connaissaient pas encore de vue, mais seulement de réputation.


    1:6 Ils empruntèrent la route royale en direction de Lystre et s’y tinrent à l’attendre, comparant chaque passant au portrait que Tite leur avait fait de lui.


    1:7 Enfin, ils virent venir un homme : c’était Paul. Il était de petite taille, chauve — ou tondu[a] —, avait les cuisses arquées, de belles jambes, les yeux enfoncés et le nez courbé. Il était plein de grâce : tantôt il paraissait comme un homme, tantôt il avait le visage d’un ange. Paul vit Onésiphore et s’en réjouit.


    1:8 Onésiphore dit : « Salut à toi, serviteur du Dieu béni ! » Paul répondit : « Que la grâce de Dieu soit avec toi et ta famille. »


    1:9 Mais Démas et Hermogène furent saisis de jalousie. Affectant une grande piété, Démas dit : « Ne sommes-nous pas, nous aussi, serviteurs du Dieu béni ? Pourquoi ne nous as-tu pas salués ? »


    1:10 Onésiphore répondit : « Parce que je n’ai pas vu en vous les fruits de la justice. Toutefois, si vous êtes de ceux qui les portent, vous serez vous aussi les bienvenus chez moi. »


    1:11 Paul entra alors dans la maison d’Onésiphore, et toute la famille en éprouva une grande joie. Ils se consacraient à la prière, à la fraction du pain et à l’écoute de Paul, qui proclamait la parole de Dieu au sujet de la maîtrise de soi[b] et de la résurrection en ces termes :


    1:12 « Heureux ceux qui ont le cœur pur, car ils verront Dieu.


    1:13 « Heureux ceux qui gardent leur chair sans souillure[c], car ils seront le temple de Dieu.


    1:14 « Heureux ceux qui pratiquent la maîtrise de soi[d], car Dieu se révélera à eux.


    1:15 « Heureux ceux qui renoncent aux plaisirs de ce monde, car Dieu les accueillera favorablement.


    1:16 « Heureux ceux qui ont une femme comme s’ils n’en avaient pas, car ils deviendront des anges de Dieu.


    1:17 « Heureux ceux qui tremblent devant la parole de Dieu, car ils seront consolés.


    1:18 « Heureux ceux qui gardent pur leur baptême, car ils trouveront la paix auprès du Père, du Fils et du Saint-Esprit.


    1:19 « Heureux ceux qui recherchent la sagesse[e] de Jésus-Christ, car ils seront appelés fils du Très-Haut.


    1:20 « Heureux ceux qui observent les enseignements de Jésus-Christ, car ils demeureront dans la lumière éternelle.


    1:21 « Heureux ceux qui, par amour pour le Christ, renoncent aux gloires du monde, car ils jugeront les anges, seront placés à la droite du Christ et ne subiront pas l’amertume du jugement dernier.


    1:22 « Heureux les corps et les âmes des vierges, car ils sont agréables à Dieu et ne perdront pas la récompense de leur virginité. En effet, la parole de leur Père céleste[f] agira efficacement pour leur salut au jour de son Fils, et ils jouiront du repos pour toujours. »'
