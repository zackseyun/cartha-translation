  footnotes:
  - marker: a
    text: 'Ou : « rasé »; le témoin permet les deux compréhensions.'
    reason: Préserver l’alternative descriptive transmise par le témoin anglais.
  - marker: b
    text: Le terme peut aussi désigner la continence, particulièrement dans ce contexte ascétique.
    reason: Signaler la portée sexuelle possible de « temperance » sans la rendre exclusive dans le texte principal.
  - marker: c
