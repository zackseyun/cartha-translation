    reason: Conserver l’alternative explicite du témoin.
  - marker: d
    text: 'Ou : « ceux qui vivent dans la continence »; éventuellement « les chastes ».'
    reason: Préserver l’ambiguïté entre maîtrise de soi générale et abstinence sexuelle.
  - marker: e
    text: 'Ou : « l’enseignement ».'
    reason: Conserver l’alternative lexicale donnée par le témoin.
  - marker: f
    text: Le mot « céleste » est explicatif dans le témoin transmis.
    reason: Indiquer que cette précision parenthétique n’est peut-être pas formellement présente au même niveau textuel que le reste de la phrase.
lexical_decisions:
- source_word: oracles
  choice: paroles divines
  rationale: Rend le caractère révélé et autoritatif du terme sans employer « oracles », qui évoque souvent en français moderne la divination païenne.
- source_word: character
  choice: réputation
  rationale: Dans le contexte, la famille connaît Paul par ce qu’on leur a rapporté de lui, non par une rencontre personnelle.
- source_word: breaking of bread
  choice: fraction du pain
  rationale: Expression chrétienne ancienne consacrée, intelligible en français et assez ouverte pour ne pas trancher sa portée rituelle précise.
- source_word: temperance
  choice: maîtrise de soi
  rationale: Choix large qui conserve l’idée de discipline personnelle; une note signale la nuance possible de continence ou chasteté.
- source_word: flesh
  choice: chair
  rationale: Conserve l’anthropologie et la formulation corporelle du témoin plutôt que de généraliser en « corps ».
- source_word: wisdom
  choice: sagesse
  rationale: Préserve le sens premier du témoin tout en signalant en note la variante interprétative « enseignement ».
- source_word: rest
  choice: repos
  rationale: Conserve la métaphore eschatologique sans l’expliciter davantage.
theological_decisions:
- issue: Le statut de ceux qui vivent comme s’ils n’avaient pas de femme
  choice: « ils deviendront des anges de Dieu »
  alternative: « ils seront rendus semblables aux anges de Dieu »
  rationale: La formulation forte du témoin est conservée sans l’atténuer ni expliquer la nature de cette transformation.
- issue: La pureté du baptême
  choice: « gardent pur leur baptême »
  alternative: « demeurent purs depuis leur baptême »
  rationale: Le génitif ou rapport conceptuel reste ambigu dans le témoin; la traduction n’impose pas une doctrine précise du baptême.
- issue: Le jugement des anges et la place à la droite du Christ
  choice: Formulation directe au futur
  alternative: Lecture symbolique ou ecclésiologique explicitée
  rationale: Les affirmations eschatologiques sont conservées telles quelles, sans harmonisation confessionnelle.
- issue: La récompense de la virginité
  choice: Conservation explicite de « la récompense de leur virginité »
  alternative: Généralisation en récompense de la fidélité
  rationale: L’accent ascétique propre au texte doit rester visible, même s’il crée une tension théologique pour certains lecteurs.
- issue: La parole du Père efficace pour le salut
  choice: « agira efficacement pour leur salut »
  alternative: « leur garantira le salut »
  rationale: Évite de transformer l’efficacité affirmée en garantie systématique et conserve le mouvement verbal du témoin.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Les béatitudes conservent leur cadence solennelle et leurs affirmations ascétiques sans atténuation. Cette rédaction demeure provisoire : les données fournies reposent sur un témoin anglais ancien, et la vérification directe de la tradition manuscrite grecque et des versions anciennes reste à effectuer. Les noms propres suivent des formes françaises ou francisées cohérentes avec le témoin fourni.'
