  text: '3:1 Then Thamyris said, “Come with me to my house and refresh yourselves.” So they went to a very splendid banquet, where there was abundant wine and very rich food.


    3:2 They were brought to a richly spread table, and Thamyris gave them plenty to drink because of his love for Thecla and his desire to marry her.


    3:3 Then Thamyris said, “I want you to tell me what this Paul’s teachings are so that I may understand them. I am deeply concerned about Thecla, since she takes such delight in that stranger’s words that I am in danger of losing the woman I intend to marry.”


    3:4 Then Demas and Hermogenes answered together, “Have him brought before the governor Castillius as someone who is trying to persuade the people to adopt the new religion of the Christians. Then the governor, in accordance with Caesar’s decree, will put him to death, and in this way you will obtain your wife.


    3:5 “At the same time, we will teach her that the resurrection he speaks about has already come and consists in our having children, and that we rose again when we came to the knowledge of God.”


    3:6 When Thamyris heard this account from them, he was filled with burning resentment.


    3:7 Early the next morning, he got up and went to the house of Onesiphorus, accompanied by the magistrates, the jailer, and a great crowd of people carrying clubs. He said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is betrothed to me, so that now she will not marry me. Therefore, you must come with us to the governor Castillius.”


    3:9 Then the whole crowd cried out, “Away with this impostor (magician)! He has led the minds of our wives astray, and all the people listen to him.”'
translation:
  language: fr
  text: 'ACTES DE PAUL ET DE THÈCLE — CHAPITRE III


    3:1 Alors Thamyris leur dit : « Venez avec moi dans ma maison et reprenez des forces. » Ils se rendirent donc à un banquet somptueux, où le vin abondait et où l’on servait des mets très raffinés.


    3:2 Thamyris les fit asseoir à une table richement garnie et leur donna à boire en abondance, à cause de son amour pour Thècle et de son désir de l’épouser.


    3:3 Puis Thamyris leur dit : « Je voudrais que vous m’expliquiez les enseignements de ce Paul, afin que je les comprenne. Je suis très inquiet au sujet de Thècle : elle prend tant de plaisir à écouter les paroles de cet étranger que je risque de perdre celle que je dois épouser. »


    3:4 Démas et Hermogène répondirent ensemble : « Fais-le comparaître devant le gouverneur Castillius, en l’accusant de chercher à persuader le peuple d’adopter la nouvelle religion des chrétiens. Conformément au décret de César, le gouverneur le fera mourir, et ainsi tu obtiendras ta femme.


    3:5 « Pendant ce temps, nous enseignerons à Thècle que la résurrection dont il parle a déjà eu lieu, qu’elle consiste à avoir des enfants et que nous sommes ressuscités lorsque nous sommes parvenus à la connaissance de Dieu. »


    3:6 Après avoir entendu leurs explications, Thamyris fut rempli d’une ardente colère.


    3:7 Tôt le lendemain matin, il se leva et se rendit à la maison d’Onésiphore, accompagné des magistrats, du geôlier et d’une foule nombreuse armée de bâtons. Il dit à Paul :


    3:8 « Tu as égaré la ville d’Iconium, et notamment Thècle, qui m’est promise, si bien qu’elle refuse maintenant de m’épouser. Tu vas donc venir avec nous devant le gouverneur Castillius. »


    3:9 Toute la foule cria alors : « Qu’on se débarrasse de cet imposteur[a] ! Il a égaré l’esprit de nos femmes, et tout le peuple l’écoute. »'
