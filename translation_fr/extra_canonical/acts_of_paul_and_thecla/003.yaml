lexical_decisions:
- source_word: refresh yourselves
  choice: reprenez des forces
  rationale: Expression française naturelle qui conserve l’idée de repos et de restauration dans le cadre de l’hospitalité.
- source_word: very splendid entertainment
  choice: banquet somptueux
  rationale: « Banquet » rend clairement le repas d’apparat décrit par le contexte, tandis que « somptueux » préserve son caractère fastueux.
- source_word: doctrines
  choice: enseignements
  rationale: Terme moderne, accessible et non confessionnel, approprié aux propos attribués à Paul.
- source_word: perverted / led astray
  choice: égaré
  rationale: Ce choix conserve l’accusation d’influence nuisible sans introduire les connotations sexuelles modernes de « pervertir ».
- source_word: intended wife / betrothed
  choice: celle que je dois épouser / qui m’est promise
  rationale: Les deux formulations françaises distinguent naturellement le projet matrimonial et le statut de fiancée sans alourdir le texte.
- source_word: imposter (magician)
  choice: imposteur[a]
  rationale: Le texte principal retient la lecture du témoin anglais, tandis que la variante « magicien » est signalée en note.
theological_decisions:
- issue: Nature et moment de la résurrection selon Démas et Hermogène
  choice: « la résurrection […] a déjà eu lieu », « consiste à avoir des enfants » et « nous sommes ressuscités lorsque nous sommes parvenus à la connaissance de Dieu »
  alternative: Harmoniser ces affirmations avec une doctrine ultérieure de la résurrection corporelle
  rationale: Le passage expose une conception particulière dans la bouche des personnages. La traduction la conserve sans l’approuver ni la corriger théologiquement.
- issue: Désignation du mouvement chrétien comme « nouvelle religion »
  choice: la nouvelle religion des chrétiens
  alternative: la nouvelle foi chrétienne
  rationale: La formulation du témoin fourni est maintenue afin de préserver la nature juridique et polémique de l’accusation, sans reformulation confessionnelle.
translation_notes:
  register: 'Français international moderne, narratif et digne, avec dialogues naturels. Les noms propres suivent les formes françaises courantes : Thècle, Démas, Hermogène, Onésiphore et Iconium; « Castillius » est conservé selon le témoin fourni. Le projet repose ici sur le témoin anglais du domaine public, la révision directe du grec et des anciennes versions étant encore en attente.'
