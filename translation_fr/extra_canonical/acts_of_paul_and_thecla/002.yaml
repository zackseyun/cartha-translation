review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni et conserve les aspérités importantes du récit, notamment la comparaison de 2:8, l’opposition entre femmes et jeunes filles, ainsi que l’énoncé rapporté sur chasteté et résurrection. Une correction indispensable est requise en 2:16 : le texte source pose deux conditions coordonnées, « demeurer dans la chasteté » et « ne pas souiller sa chair ». Le projet inversait la seconde par « si vous souillez votre chair ». La consultation directe du grec et des versions anciennes restant signalée comme en attente, aucune décision ne doit prétendre résoudre les variantes éventuelles.'
  naturalness: Le français est globalement moderne, clair et adapté à un récit soutenu. « Maîtresse de maison » en 2:11 précise naturellement le rapport des servantes sans l’ambiguïté moderne possible de « leur maîtresse ». Quelques phrases ont été légèrement resserrées sans moderniser ni atténuer les propos des personnages.
  terminology: Les noms Onésiphore, Thècle, Théoclie, Thamyris, Démas et Hermogène sont cohérents. « Amour », « foi en Christ », « parole du Christ » et « chasteté » rendent les termes du témoin avec un registre moderne et sans ajout doctrinal. « Future épouse » et les périphrases de 2:16 respectent le fait que Thècle est promise, non mariée.
  issues:
  - severity: high
    issue: Négation omise en 2:16
    rationale: 'Le projet disait : « si vous ne demeurez pas dans la chasteté et si vous souillez votre chair ». Le témoin porte : « unless ye continue in chastity, and do not defile your flesh ». Il faut donc rendre les deux conditions négativement : « si vous ne demeurez pas dans la chasteté et ne souillez pas votre chair ».'
  - severity: low
    issue: « leur maîtresse » en 2:11 peut être ambigu en français contemporain
    rationale: Dans le contexte domestique, « leur maîtresse de maison » conserve le sens social de mistress et évite une lecture sexuelle moderne non voulue.
