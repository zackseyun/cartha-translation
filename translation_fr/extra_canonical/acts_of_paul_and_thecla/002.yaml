translation:
  language: fr
  text: '2:1 Pendant que Paul prononçait cet enseignement dans l’assemblée qui se réunissait chez Onésiphore, une jeune fille nommée Thècle — sa mère s’appelait Théoclie, et elle était promise en mariage à un homme nommé Thamyris — était assise à une fenêtre de sa maison.


    2:2 De là, grâce à une fenêtre de la maison où se trouvait Paul, elle entendait nuit et jour ses enseignements sur Dieu, l’amour, la foi en Christ et la prière.


    2:3 Elle ne quittait pas la fenêtre et, remplie d’une joie immense, elle finit par être gagnée aux enseignements de la foi.


    2:4 Lorsqu’elle vit de nombreuses femmes et jeunes filles entrer chez Paul, elle désira vivement être jugée digne de paraître en sa présence et d’entendre la parole du Christ. En effet, elle n’avait pas encore vu Paul lui-même : elle avait seulement entendu ses enseignements.


    2:5 Comme rien ne pouvait la convaincre de quitter la fenêtre, sa mère fit appeler Thamyris. Il vint avec une très grande joie, dans l’espoir de l’épouser bientôt. Il demanda donc à Théoclie : « Où est ma Thècle ? »


    2:6 Théoclie répondit : « Thamyris, j’ai quelque chose de très étrange à te raconter. Voilà trois jours que Thècle ne quitte pas la fenêtre, même pour manger ou boire. Elle est si absorbée par les discours habiles et trompeurs d’un certain étranger que je suis tout à fait stupéfaite, Thamyris, de voir une jeune femme connue pour sa réserve se laisser ainsi gagner.


    2:7 Cet homme a bouleversé toute la ville d’Iconium, et même ta Thècle. Toutes les femmes et tous les jeunes gens affluent vers lui pour recevoir son enseignement. Entre autres choses, il leur dit qu’il n’y a qu’un seul Dieu, que lui seul doit être adoré et que nous devons vivre dans la chasteté.


    2:8 Malgré tout, ma fille Thècle reste comme une toile d’araignée fixée à la fenêtre. Captivée par les discours de Paul, elle les écoute avec une ardeur extraordinaire et une joie immense. À force de prêter attention à ses paroles, la jeune femme se laisse égarer. Va donc lui parler, car elle t’est promise en mariage. »


    2:9 Thamyris alla donc la trouver. Après l’avoir saluée, en prenant soin de ne pas l’effrayer, il lui dit : « Thècle, ma future épouse, pourquoi restes-tu assise dans cet état d’abattement ? Quelles étranges pensées se sont emparées de toi ? Tourne-toi vers Thamyris et rougis. »


    2:10 Sa mère lui parla de la même manière : « Mon enfant, pourquoi restes-tu assise, si abattue ? Pourquoi demeures-tu sans répondre, comme frappée de stupeur ? »


    2:11 Alors tous éclatèrent en sanglots : Thamyris pleurait d’avoir perdu sa future épouse, Théoclie d’avoir perdu sa fille, et les servantes d’avoir perdu leur maîtresse. Toute la maisonnée était en deuil.


    2:12 Mais rien de tout cela ne faisait impression sur Thècle, pas même au point de la pousser à se tourner vers eux et à leur prêter attention, car elle restait attentive aux enseignements de Paul.


    2:13 Thamyris se précipita alors dans la rue pour observer ceux qui entraient chez Paul et ceux qui en sortaient. Il vit deux hommes engagés dans une discussion très vive et leur dit :


    2:14 « Messieurs, que faites-vous ici ? Qui est cet homme qui se trouve à l’intérieur avec vous et qui égare l’esprit des gens, jeunes hommes comme jeunes filles, en les persuadant de ne pas se marier, mais de rester comme ils sont ?


    2:15 Je vous promets une forte somme si vous me renseignez exactement sur lui, car je suis un personnage important de cette ville. »


    2:16 Démas et Hermogène répondirent : « Nous ne pouvons pas te dire exactement qui il est. Mais nous savons qu’il prive les jeunes hommes des femmes auxquelles ils sont promis et les jeunes filles des hommes auxquels elles sont promises, en enseignant : “Il ne peut y avoir de résurrection à venir si vous ne demeurez pas dans la chasteté et si vous souillez votre chair.” »[a]


    [a] Traduction provisoire établie à partir du témoin anglais fourni. Une révision directe d’après les manuscrits grecs et les anciennes versions reste nécessaire, en particulier pour les formulations de 2:3, 2:8 et 2:16.'
