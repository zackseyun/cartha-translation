lexical_decisions:
- source_word: church
  choice: assemblée qui se réunissait
  rationale: Dans ce cadre domestique ancien, « assemblée » évite de suggérer un bâtiment ecclésial tout en conservant l’idée de communauté réunie.
- source_word: charity
  choice: amour
  rationale: « Amour » est le terme français moderne naturel pour la vertu chrétienne visée; « charité » pourrait être compris trop étroitement comme aide matérielle.
- source_word: virgin
  choice: jeune fille
  rationale: Le contexte matrimonial indique une jeune femme non mariée; ce choix produit un français naturel sans effacer la chasteté explicitement mentionnée ensuite.
- source_word: chastity
  choice: chasteté
  rationale: Le mot garde la portée ascétique et sexuelle du témoin sans la réduire au simple célibat.
- source_word: spouse
  choice: future épouse
  rationale: Thècle est fiancée, non encore mariée; « épouse » seul créerait une incohérence narrative.
- source_word: chief person
  choice: personnage important
  rationale: Le témoin ne permet pas d’identifier avec certitude une fonction civique précise; la formulation conserve le statut social revendiqué sans surinterprétation.
- source_word: subdued to the doctrines of faith
  choice: gagnée aux enseignements de la foi
  rationale: Cette expression rend le changement intérieur sans la connotation artificiellement coercitive de « soumise » en français moderne.
theological_decisions:
- issue: Rapport entre chasteté et résurrection en 2:16
  choice: Conserver l’affirmation conditionnelle dans la bouche de Démas et Hermogène
  alternative: L’atténuer ou l’harmoniser avec une doctrine chrétienne ultérieure de la résurrection
  rationale: Il s’agit d’un propos rapporté par des personnages; la tension théologique appartient au récit et ne doit pas être résolue par la traduction.
- issue: Unicité de Dieu et adoration en 2:7
  choice: « il n’y a qu’un seul Dieu, que lui seul doit être adoré »
  alternative: Employer une formulation explicitement trinitaire ou préciser l’identité du Dieu évoqué
  rationale: Le témoin formule une affirmation monothéiste sans autre précision; la traduction n’importe aucun développement doctrinal.
- issue: « parole du Christ » en 2:4
  choice: Conserver « la parole du Christ »
  alternative: « la parole au sujet du Christ »
  rationale: La formulation peut désigner une parole venant du Christ ou le message chrétien; le français retenu préserve cette ouverture.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures archaïques du témoin anglais ont été actualisées, les noms propres francisés selon l’usage courant, et les discours directs rendus de manière naturelle. Le registre demeure soutenu sans être ecclésiastique ou confessionnel. La métaphore étrange de la toile d’araignée en 2:8 est conservée plutôt que normalisée.
