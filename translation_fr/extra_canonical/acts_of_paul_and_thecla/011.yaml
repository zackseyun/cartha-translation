review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le projet suit globalement fidèlement le témoin anglais fourni, mais le remplacement de « Diana » par « Artémis » ne peut pas être assuré sur la seule base de ce dossier, puisque la vérification directe du grec est explicitement en attente. La parenthèse narrative de 11:3 doit aussi être conservée. La révision maintient les formulations ambiguës ou théologiquement marquées du témoin, notamment « vision béatifique » et le « transfert » final de Thècle.
  naturalness: Le français est dans l’ensemble naturel et d’un registre narratif approprié. Quelques formulations ont été resserrées pour mieux rendre le dialogue (« ayez patience ») et la formule de 11:7 (« faire de toi tout ce que nous voudrons »).
  terminology: « Diane » est retenu conformément au témoin anglais audité, sans préjuger de la leçon grecque à contrôler. « Jésus-Christ », « Père, Fils et Saint-Esprit », « apôtre de Dieu » et « vision béatifique » préservent le lexique transmis sans harmonisation confessionnelle. « Le Seigneur la transporta » conserve l’indétermination de translated her sans ajouter « auprès de lui ».
  issues:
  - severity: medium
    issue: Le nom « Artémis » remplace « Diana » du témoin sans que le grec ne soit fourni.
    rationale: Bien qu’Artémis puisse être historiquement plausible, le dossier indique que l’examen direct de la tradition grecque reste à faire. La traduction doit à ce stade suivre l’audit trail anglais et ne pas résoudre cette question textuelle de manière anticipée.
  - severity: low
    issue: Les parenthèses de 11:3 ont été supprimées.
    rationale: Le témoin présente cette explication comme une remarque parenthétique ; les conserver respecte sa structuration et son effet narratif.
  - severity: low
    issue: « Attendez » en 11:8 affaiblit « have patience ».
    rationale: « Ayez patience » rend plus directement l’appel à la patience, plutôt qu’une simple demande de délai.
  - severity: low
    issue: « auprès de lui » en 11:15 explicite davantage que le témoin.
    rationale: Le témoin dit seulement que le Seigneur la “translated”. « La transporta » conserve l’idée de transfert sans préciser sa destination.
