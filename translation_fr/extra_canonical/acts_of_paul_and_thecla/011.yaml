  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: fr
  text: '11:1 Le diable leur inspira alors un mauvais dessein. Un jour, ils se réunirent pour délibérer et raisonnèrent ainsi entre eux : « La vierge est prêtresse de la grande déesse Artémis[a], et tout ce qu’elle lui demande lui est accordé, parce qu’elle est vierge et qu’elle est donc aimée de tous les dieux.


    11:2 Maintenant donc, procurons-nous quelques jeunes débauchés. Après les avoir suffisamment enivrés et leur avoir donné une forte somme d’argent, ordonnons-leur d’aller déshonorer cette vierge, en leur promettant une récompense encore plus grande s’ils le font. »


    11:3 Ils avaient en effet conclu entre eux que, s’ils parvenaient à la déshonorer, les dieux ne lui accorderaient plus leur faveur et qu’Artémis ne guérirait plus les malades à sa demande.


    11:4 Ils mirent ce projet à exécution. Les jeunes hommes se rendirent sur la montagne et arrivèrent à la grotte, féroces comme des lions, puis frappèrent à la porte.


    11:5 La sainte martyre Thècle, mettant sa confiance dans le Dieu en qui elle croyait, ouvrit la porte, bien qu’elle eût déjà été avertie de leur projet. Elle leur dit : « Jeunes gens, que voulez-vous ? »


    11:6 Ils répondirent : « Y a-t-il ici quelqu’un du nom de Thècle ? » Elle leur demanda : « Que lui voulez-vous ? » Ils dirent : « Nous voulons coucher avec elle. »


    11:7 La bienheureuse Thècle répondit : « Je ne suis qu’une humble vieille femme, mais je suis la servante de mon Seigneur Jésus-Christ. Malgré votre ignoble dessein contre moi, vous ne pourrez pas l’accomplir. » Ils répliquèrent : « Il est impossible que nous ne puissions pas faire de toi tout ce que nous voulons. »


    11:8 Tout en disant cela, ils la saisirent de force et voulurent la violer. Alors elle leur dit avec la plus grande douceur[b] : « Jeunes gens, attendez, et voyez la gloire du Seigneur. »


    11:9 Tandis qu’ils la retenaient, elle leva les yeux vers le ciel et dit : « Ô Dieu très vénérable, à qui nul ne peut être comparé, toi qui manifestes ta gloire sur tes ennemis, toi qui m’as délivrée du feu et ne m’as livrée ni à Thamyris ni à Alexandre, toi qui m’as délivrée des bêtes sauvages et préservée dans les eaux profondes, toi qui partout m’as secourue et qui as glorifié ton nom en moi,


    11:10 maintenant encore, délivre-moi des mains de ces hommes mauvais et insensés. Ne leur permets pas de déshonorer la chasteté que j’ai préservée jusqu’ici en ton honneur. Car je t’aime, je soupire après toi et je t’adore, ô Père, Fils et Saint-Esprit, pour toujours. Amen. »


    11:11 Alors une voix vint du ciel et dit : « Ne crains pas, Thècle, ma fidèle servante, car je suis avec toi. Regarde et vois le lieu qui s’est ouvert pour toi : là sera ta demeure éternelle ; là, tu recevras la vision bienheureuse[c]. »


    11:12 La bienheureuse Thècle regarda et vit que le rocher s’était ouvert assez largement pour qu’une personne puisse y entrer. Obéissant à l’ordre reçu, elle échappa courageusement à cette troupe ignoble et pénétra dans le rocher. Celui-ci se referma aussitôt si complètement qu’aucune fissure ne restait visible à l’endroit où il s’était ouvert.


    11:13 Les hommes demeurèrent absolument stupéfaits devant un miracle aussi extraordinaire et ne purent retenir la servante de Dieu. Ils réussirent seulement à saisir son voile, ou son capuchon, et à en arracher un morceau.


    11:14 Cela même arriva avec la permission de Dieu, afin d’affermir la foi de ceux qui viendraient voir ce lieu vénérable et de transmettre des bénédictions, au cours des générations suivantes, à ceux qui croiraient en notre Seigneur Jésus-Christ d’un cœur pur.


    11:15 Ainsi souffrit Thècle, cette première martyre, apôtre de Dieu et vierge. Elle était venue d’Iconium à l’âge de dix-huit ans. Ensuite, partageant sa vie entre voyages et déplacements, d’une part, et vie monastique dans la grotte, d’autre part, elle vécut encore soixante-douze ans. Elle avait donc quatre-vingt-dix ans lorsque le Seigneur la transporta auprès de lui[d].


    11:16 Ainsi s’achève sa vie.


    11:17 Le jour consacré à sa mémoire est le vingt-quatre septembre, à la gloire du Père, du Fils et du Saint-Esprit, maintenant et pour toujours. Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais porte « Diana » (Diane), nom latin de la déesse grecque Artémis.
    reason: Signaler la forme exacte du témoin tout en adoptant le nom adapté au cadre grec.
  - marker: b
    text: Le témoin transmis met « greatest » (« la plus grande ») entre parenthèses; son statut textuel devra être vérifié dans les manuscrits grecs et les anciennes versions.
    reason: Préserver la donnée inhabituelle du témoin et signaler l’incertitude en attente de collation.
  - marker: c
    text: L’expression « vision bienheureuse » traduit une formulation du témoin anglais dont la base grecque doit encore être vérifiée.
    reason: Éviter de présenter comme certaine une terminologie possiblement influencée par le vocabulaire théologique du traducteur anglais.
  - marker: d
    text: 'Littéralement selon le témoin anglais : « lorsque le Seigneur la transféra »; l’expression peut évoquer un enlèvement ou un passage auprès de Dieu plutôt qu’une mort décrite de manière ordinaire.'
    reason: Conserver l’ambiguïté théologique et narrative de « translated ».
lexical_decisions:
- source_word: Diana
  choice: Artémis
  rationale: Le témoin anglais emploie le nom latin Diana, mais le cadre grec et la tradition source renvoient à la déesse grecque Artémis; une note conserve l’équivalence.
- source_word: debauch / violate
  choice: déshonorer
  rationale: Ce choix préserve dans les versets 2, 3 et 10 le lien entre l’agression sexuelle projetée et la perte de chasteté telle que la conçoivent les personnages, sans employer un euphémisme dans le récit explicite du verset 8, où « violer » est retenu.
- source_word: unreasonable
  choice: insensés
  rationale: Rend naturellement en français l’idée d’hommes privés de raison ou moralement déraisonnables.
- source_word: beatific vision
  choice: vision bienheureuse
  rationale: Traduction intelligible et relativement formelle, sans développer une doctrine technique au-delà du témoin.
- source_word: translated her
  choice: la transporta auprès de lui
  rationale: Exprime l’idée d’un transfert divin et évite le faux sens moderne de « traduire », tout en ne remplaçant pas simplement l’expression par « mourut ».
theological_decisions:
- issue: Invocation du Père, du Fils et du Saint-Esprit
  choice: Conserver la formule trinitaire telle qu’attestée par le témoin
  alternative: Harmoniser ou reformuler selon une terminologie confessionnelle ultérieure
  rationale: La traduction doit préserver la forme propre du récit transmis sans lui importer une élaboration doctrinale externe.
- issue: Titre « apôtre de Dieu » appliqué à Thècle
  choice: Conserver « apôtre de Dieu »
  alternative: Atténuer en « envoyée » ou supprimer le titre
  rationale: Le titre est une affirmation distinctive du témoin et ne doit pas être neutralisé pour des raisons confessionnelles.
- issue: Sort final de Thècle
  choice: « le Seigneur la transporta auprès de lui »
  alternative: « le Seigneur la fit mourir » ou « elle mourut »
  rationale: Le témoin laisse entendre un transfert surnaturel; la formulation française préserve cette tension sans préciser indûment son mécanisme.
- issue: Fonction du fragment de voile et du lieu
  choice: Conserver l’affermissement de la foi et la transmission de bénédictions
  alternative: Rationaliser le passage ou introduire une doctrine des reliques
  rationale: Le texte est rendu selon son affirmation propre, sans validation ni développement confessionnel supplémentaire.
translation_notes:
  register: Français international moderne, digne et narratif. Les dialogues restent directs et compréhensibles; les termes archaïques ont été évités. Ce projet demeure provisoire, car le dossier fourni repose sur un témoin anglais ancien et indique que la révision directe du grec et des versions est encore en attente.
