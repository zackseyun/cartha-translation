review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement la trame du témoin anglais fourni : protection de la chasteté de Thècle, garde chez Tryphène, scène de l’amphithéâtre, apparition de Falconille et prière en sa faveur. Les notes conservent à juste titre les deux incertitudes explicites du témoin de base. Une correction est nécessaire en 8:1, où « demanda ... la faveur que » est un calque syntaxiquement maladroit, et en 8:9, où la construction française avec « ni de ... ni de » ne restitue pas clairement le double malheur exprimé par le témoin.'
  naturalness: Le registre narratif est globalement naturel, moderne et digne. Les corrections proposées fluidifient 8:1, clarifient 8:9 et rendent plus directement en 8:7 la réaction de Thècle à ce qu’elle vient d’entendre. Les termes solennels tels qu’« inique » restent appropriés aux cris judiciaires et religieux du passage.
  terminology: Les noms Thècle, Tryphène, Falconille et Alexandre sont conservés de façon cohérente. « Chasteté », « sacrilège », « lionne », « amphithéâtre » et « condamnée » sont adéquats. « Transportée dans un état de bonheur » conserve volontairement l’imagerie du témoin anglais sans imposer une interprétation doctrinale de l’au-delà.
  issues:
  - severity: medium
    issue: 'Syntaxe calquée en 8:1 : « demanda au gouverneur la faveur que... »'
    rationale: La construction n’est pas idiomatique en français moderne. « Sollicita du gouverneur la faveur que... » restitue le sens de requested the governor’s favour tout en introduisant correctement la proposition de but.
  - severity: medium
    issue: Construction et sens insuffisamment clairs en 8:9
    rationale: '« Personne ne vient me soulager : ni de la perte de ma fille, ni de mon impuissance... » est grammaticalement heurté et ne fait pas nettement entendre les deux motifs de détresse. La révision distingue la perte de Falconille de l’impossibilité de sauver Thècle sans ajouter d’interprétation.'
  - severity: low
    issue: Enchaînement discursif en 8:7
    rationale: « À ces mots » peut faire croire que Thècle répond à ses propres paroles ou à une parole non identifiée. « Lorsqu’elle entendit cela » suit plus exactement le témoin.
