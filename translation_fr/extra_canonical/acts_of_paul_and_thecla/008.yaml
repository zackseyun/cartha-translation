  text: '8:1 When the people saw this, they said, “The judgments passed in this city are unjust.” But Thecla asked the governor for the favor that her chastity would not be violated, but preserved until she was thrown to the beasts.


    8:2 The governor then asked who would take her in. A very rich widow named Trifina, whose daughter had recently died, asked to have her in her care, and she began to treat Thecla in her house as her own daughter.


    8:3 At last the day came when the beasts were to be brought out for display. Thecla was brought to the amphitheater and put into a den containing an exceedingly fierce lioness, in the presence of a multitude of spectators.


    8:4 Trifina accompanied Thecla without showing any alarm, and the lioness licked Thecla’s feet. The written notice stating her crime read: “Sacrilege.” Then the woman cried out, “O God, the judgments of this city are unrighteous!”


    8:5 After the beasts had been displayed, Trifina took Thecla home with her, and they went to bed. And behold, Trifina’s dead daughter appeared to her mother and said, “Mother, regard the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be transferred to a state of happiness.”


    8:6 Then Trifina said sorrowfully, “My daughter Falconilla has appeared to me and instructed me to receive you in her place. Therefore, Thecla, I ask you to pray for my daughter, so that she may be transferred to a state of happiness and to eternal life.”


    8:7 When Thecla heard this, she immediately prayed to the Lord and said, “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that her daughter Falconilla may live forever.” When Trifina heard this, she groaned again and said, “O unrighteous judgments! O senseless wickedness, that such a person should (again) be thrown to the beasts!”


    8:8 The next morning, at daybreak, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 But Trifina rushed at him so violently that he became frightened and ran away. Trifina was a member of the royal family. She expressed her sorrow in this way and said, “Alas! I have trouble in my house for two reasons, and there is no one who will relieve me—either in the loss of my daughter or in my inability to save Thecla. But now, O Lord God, be the helper of your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his own officers to bring Thecla. Trifina took her by the hand and went with her, saying, “I went with Falconilla to her grave, and now I must go with Thecla to the beasts.”


    8:11 When Thecla heard this, she prayed with tears and said, “O Lord God, in whom I have placed my confidence and found refuge, reward Trifina for her compassion toward me and for preserving my chastity.”


    8:12 Then there was a great noise in the amphitheater. The beasts roared, and the people cried out, “Bring in the criminal!”


    8:13 But the woman cried out and said, “Let the whole city suffer for such crimes, and order all of us, O governor, to receive the same punishment. O unjust judgment! O cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act. Kill us all, O governor! O cruel sight! O unrighteous judgment!”'
translation:
  language: fr
  text: '8:1 Quand les gens virent cela, ils dirent : « Les jugements rendus dans cette ville sont injustes. » Mais Thècle demanda au gouverneur la faveur que sa chasteté ne soit pas violée, mais préservée jusqu’à ce qu’elle soit livrée aux bêtes.


    8:2 Le gouverneur demanda alors qui voudrait l’accueillir. Une veuve très riche, nommée Tryphène, dont la fille était morte récemment, demanda à la prendre sous sa garde ; chez elle, elle se mit à la traiter comme sa propre fille.


    8:3 Enfin arriva le jour où les bêtes devaient être présentées au public. Thècle fut conduite à l’amphithéâtre et placée dans une fosse où se trouvait une lionne extrêmement féroce, sous les yeux d’une foule de spectateurs.


    8:4 Tryphène accompagna Thècle sans manifester la moindre crainte, et la lionne lécha les pieds de Thècle. L’écriteau indiquant son crime portait : « Sacrilège. » Alors la femme s’écria : « Ô Dieu, les jugements de cette ville sont iniques ! »


    8:5 Après la présentation des bêtes, Tryphène ramena Thècle chez elle, et elles allèrent se coucher. Or voici que la fille défunte de Tryphène apparut à sa mère et lui dit : « Mère, considère la jeune Thècle comme ta fille à ma place. Demande-lui de prier pour moi, afin que je sois transportée dans un état de bonheur. »[a]


    8:6 Alors Tryphène dit avec tristesse : « Ma fille Falconille m’est apparue et m’a demandé de te recevoir à sa place. C’est pourquoi, Thècle, je te demande de prier pour ma fille, afin qu’elle soit transportée dans un état de bonheur et dans la vie éternelle. »[a]


    8:7 À ces mots, Thècle pria aussitôt le Seigneur : « Ô Seigneur, Dieu du ciel et de la terre, Jésus-Christ, Fils du Très-Haut, accorde à sa fille Falconille de vivre éternellement. » En l’entendant, Tryphène gémit de nouveau et dit : « Ô jugements iniques ! Ô folie criminelle ! Qu’une telle personne soit de nouveau livrée aux bêtes ! »[b]


    8:8 Le lendemain, au point du jour, Alexandre vint chez Tryphène et dit : « Le gouverneur et le peuple attendent. Fais sortir la condamnée. »


    8:9 Mais Tryphène se précipita sur lui avec une telle violence qu’il prit peur et s’enfuit. Tryphène appartenait à la famille royale. Elle exprima ainsi sa douleur : « Hélas ! Deux malheurs accablent ma maison, et personne ne vient me soulager : ni de la perte de ma fille, ni de mon impuissance à sauver Thècle. Mais maintenant, ô Seigneur Dieu, viens en aide à ta servante Thècle. »


    8:10 Pendant qu’elle parlait ainsi, le gouverneur envoya l’un de ses officiers chercher Thècle. Tryphène la prit par la main et partit avec elle en disant : « J’ai accompagné Falconille jusqu’à son tombeau, et maintenant je dois accompagner Thècle jusqu’aux bêtes. »


    8:11 En entendant cela, Thècle pria en pleurant : « Ô Seigneur Dieu, en qui j’ai mis ma confiance et trouvé refuge, récompense Tryphène de sa compassion envers moi et d’avoir préservé ma chasteté. »


    8:12 Alors un grand tumulte s’éleva dans l’amphithéâtre. Les bêtes rugissaient, et le peuple criait : « Faites entrer la condamnée ! »


    8:13 Mais la femme s’écria : « Que toute la ville subisse le châtiment pour de tels crimes ! Gouverneur, ordonne que nous recevions tous la même peine ! Ô jugement injuste ! Ô spectacle cruel ! »


    8:14 D’autres disaient : « Que toute la ville soit détruite pour cet acte infâme ! Gouverneur, fais-nous tous mourir ! Ô spectacle cruel ! Ô jugement inique ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « transportée dans un état de bonheur » suit ici le témoin anglais fourni. La formulation exacte devra être vérifiée dans les témoins grecs et versionnels.
    reason: La base fournie n’est pas un texte grec directement contrôlé, et cette expression porte une importante nuance eschatologique.
  - marker: b
    text: Le mot « de nouveau » est conservé d’après le témoin anglais ; sa présence et sa portée devront être contrôlées dans la tradition manuscrite.
    reason: Le témoin anglais lui-même signale ce mot entre parenthèses, ce qui indique une incertitude textuelle ou éditoriale.
lexical_decisions:
- source_word: chastity
  choice: chasteté
  rationale: Conserve le motif explicite d’intégrité sexuelle du témoin tout en gardant un registre digne et compréhensible.
- source_word: entertain / keeping
  choice: accueillir / prendre sous sa garde
  rationale: Évite le calque vieilli « divertir » et exprime naturellement l’hébergement assorti de protection.
- source_word: she-lion
  choice: lionne
  rationale: Rend directement et sans lourdeur le sexe de l’animal, élément narratif important.
- source_word: title written
  choice: écriteau
  rationale: Désigne naturellement l’inscription publique indiquant le chef d’accusation.
- source_word: Sacrilege
  choice: Sacrilège
  rationale: Équivalent juridique et religieux direct, sans explicitation doctrinale.
- source_word: criminal
  choice: condamnée
  rationale: Dans cette scène d’exécution, « condamnée » est idiomatique et évite de valider moralement l’accusation portée contre Thècle.
- source_word: unrighteous
  choice: inique
  rationale: Maintient le registre moral et judiciaire solennel, en alternance contrôlée avec « injuste ».
theological_decisions:
- issue: Prière en faveur de Falconille défunte
  choice: Conserver sans atténuation la demande de prier pour elle et son transfert vers le bonheur et la vie éternelle.
  alternative: Reformuler en prière commémorative ou expliquer doctrinalement l’état des morts.
  rationale: Le passage présente cette demande telle quelle ; la traduction ne doit ni l’harmoniser avec une tradition confessionnelle ni résoudre sa tension théologique.
- issue: Adresse de la prière en 8:7
  choice: Conserver la séquence « Seigneur, Dieu du ciel et de la terre, Jésus-Christ, Fils du Très-Haut » sans ponctuation interprétative supplémentaire.
  alternative: Séparer nettement l’adresse à Dieu de l’invocation de Jésus, ou identifier explicitement Jésus au Dieu invoqué.
  rationale: Le témoin permet une certaine ambiguïté syntaxique et christologique qu’il convient de préserver en attendant la vérification grecque.
- issue: Protection de la chasteté
  choice: Traduire comme un motif narratif explicite de protection corporelle et sexuelle.
  alternative: Spiritualiser « chasteté » en pureté morale générale.
  rationale: Le contexte concerne le risque d’atteinte physique avant l’exposition aux bêtes.
translation_notes:
  register: Français international moderne, narratif et digne. Les formes vieillies ont été remplacées par des tournures courantes sans banaliser le ton. Les exclamations judiciaires restent solennelles. Projet provisoire fondé sur le témoin anglais public fourni ; une collation directe du grec et des versions anciennes demeure nécessaire.
