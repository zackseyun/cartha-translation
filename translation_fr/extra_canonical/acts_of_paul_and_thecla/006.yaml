  text: '6:1 Meanwhile, Paul, together with Onesiphorus, his wife, and children, was keeping a fast in a certain cave on the road from Iconium to Daphne.


    6:2 And when they had fasted for several days, the children said to Paul, “Father, we are hungry, and have not wherewithal to buy bread”; for Onesiphorus had left all his substance to follow Paul with his family.


    6:3 Then Paul, taking off his coat, said to the boy, “Go, child, buy bread, and bring it here.”


    6:4 But while the boy was buying the bread, he saw his neighbor Thecla and was surprised, and said to her, “Thecla, where are you going?”


    6:5 She replied, “I am in pursuit of Paul, having been delivered from the flames.”


    6:6 The boy then said, “I will bring you to him, for he is under great concern on your account and has been in prayer and fasting these six days.”


    6:7 When Thecla came to the cave, she found Paul on his knees praying and saying, “O holy Father, O Lord Jesus Christ, grant that the fire may not touch Thecla; but be her helper, for she is your servant.”


    6:8 Thecla then, standing behind him, cried out in these words: “O sovereign Lord, Creator of heaven and earth, the Father of your beloved and holy Son, I praise you that you have preserved me from the fire, to see Paul again.”


    6:9 Paul then arose, and when he saw her, said, “O God, who searches the heart, Father of my Lord Jesus Christ, I praise you that you have answered my prayer.”


    6:10 And there prevailed among them in the cave an entire affection for each other, Paul, Onesiphorus, and all who were with them being filled with joy.


    6:11 They had five loaves, some herbs, and water, and they solaced each other in reflections upon the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you are pleased with it, I will follow you wherever you go.”


    6:13 He replied to her, “Persons are now much given to fornication, and you being handsome, I am afraid lest you should meet with greater temptation than the former, and should not withstand, but be overcome by it.”


    6:14 Thecla replied, “Grant me only the seal of Christ, and no temptation shall affect me.”


    6:15 Paul answered, “Thecla, wait with patience, and you shall receive the gift of Christ.”'
translation:
  language: fr
  text: '6:1 Pendant ce temps, Paul, Onésiphore, sa femme et ses enfants jeûnaient dans une grotte située sur la route d’Iconium à Daphné.


    6:2 Après plusieurs jours de jeûne, les enfants dirent à Paul : « Père, nous avons faim et nous n’avons pas de quoi acheter du pain. » En effet, Onésiphore avait abandonné tous ses biens pour suivre Paul avec sa famille.


    6:3 Alors Paul ôta son manteau et dit au garçon : « Va, mon enfant, achète du pain et rapporte-le ici. »


    6:4 Pendant que le garçon achetait le pain, il aperçut sa voisine Thècle. Surpris, il lui demanda : « Thècle, où vas-tu ? »


    6:5 Elle répondit : « Je cherche Paul, car j’ai été délivrée des flammes. »


    6:6 Le garçon lui dit alors : « Je vais te conduire auprès de lui, car il est très inquiet à ton sujet et, depuis six jours, il prie et jeûne. »


    6:7 Lorsque Thècle arriva à la grotte, elle trouva Paul à genoux, en train de prier ainsi : « Ô Père saint, ô Seigneur Jésus-Christ, accorde que le feu ne touche pas Thècle, mais viens-lui en aide, car elle est ta servante. »


    6:8 Debout derrière lui, Thècle s’écria : « Ô Maître souverain, Créateur du ciel et de la terre, Père de ton Fils bien-aimé et saint, je te loue de m’avoir préservée du feu et de m’avoir permis de revoir Paul. »


    6:9 Alors Paul se releva et, quand il la vit, dit : « Ô Dieu qui sondes les cœurs, Père de mon Seigneur Jésus-Christ, je te loue d’avoir exaucé ma prière. »


    6:10 Dans la grotte, une profonde affection les unissait tous ; Paul, Onésiphore et tous ceux qui étaient avec eux étaient remplis de joie.


    6:11 Ils avaient cinq pains, quelques herbes et de l’eau, et ils se réconfortaient mutuellement en évoquant les œuvres saintes du Christ.


    6:12 Thècle dit alors à Paul : « Si tu le veux bien, je te suivrai partout où tu iras. »


    6:13 Il lui répondit : « Les gens d’aujourd’hui se livrent beaucoup à l’immoralité sexuelle et, comme tu es belle, je crains que tu ne rencontres une épreuve plus grande que la précédente, que tu ne puisses y résister et qu’elle ne triomphe de toi. »


    6:14 Thècle répondit : « Accorde-moi seulement le sceau du Christ[a], et aucune épreuve ne m’atteindra. »


    6:15 Paul lui dit : « Thècle, attends avec patience, et tu recevras le don du Christ[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sceau du Christ » est conservée telle quelle. Elle peut évoquer un rite d’initiation, souvent compris comme le baptême, mais le passage ne l’explicite pas.
    reason: Signaler une expression ancienne théologiquement importante sans imposer une interprétation unique.
  - marker: b
    text: Le « don du Christ » peut être lié au sceau demandé au verset précédent, mais le texte ne précise pas explicitement leur rapport.
    reason: Préserver l’ambiguïté entre les deux expressions successives.
lexical_decisions:
- source_word: coat (English witness; underlying Greek review pending)
  choice: manteau
  rationale: Rend naturellement un vêtement extérieur susceptible d’être ôté et utilisé comme moyen de paiement, sans préciser davantage sa forme.
- source_word: fornication (English witness; underlying Greek review pending)
  choice: immoralité sexuelle
  rationale: Expression française moderne et générale qui conserve la portée éthique du témoin sans la réduire à un acte particulier.
- source_word: seal of Christ
  choice: sceau du Christ
  rationale: Conservation littérale d’une expression ancienne à portée rituelle et théologique, sans l’identifier silencieusement à un rite précis.
- source_word: gift of Christ
  choice: don du Christ
  rationale: Préserve l’expression générale et son possible rapport contextuel au sceau, sans imposer une équivalence explicite.
- source_word: temptation
  choice: épreuve
  rationale: Le contexte permet à la fois l’idée de tentation et celle d’une épreuve menaçante ; « épreuve » préserve mieux cette amplitude.
theological_decisions:
- issue: Sens du « sceau du Christ »
  choice: Maintenir l’expression sans l’interpréter dans le corps du texte.
  alternative: L’identifier explicitement au baptême ou à un autre rite d’initiation.
  rationale: Le contexte suggère une pratique d’initiation, mais le témoin fourni ne justifie pas à lui seul une identification confessionnelle sans réserve.
- issue: Rapport entre le « sceau » et le « don du Christ »
  choice: Conserver deux formulations distinctes.
  alternative: Présenter le don comme étant explicitement le sceau demandé.
  rationale: La réponse de Paul peut établir un lien, mais elle ne formule pas une identité explicite ; la tension du dialogue doit rester visible.
- issue: Adresse de la prière en 6:7
  choice: Conserver successivement « Père saint » et « Seigneur Jésus-Christ » sans harmonisation.
  alternative: Réorganiser ou ponctuer la phrase pour n’adresser la demande qu’à l’un des deux.
  rationale: Le témoin présente une adresse double ou appositionnelle ambiguë, qu’il convient de ne pas résoudre dogmatiquement.
translation_notes:
  register: Français international moderne, narratif et digne. Les tournures archaïques du témoin anglais ont été actualisées, tandis que les expressions théologiques distinctives ont été conservées. La rédaction demeure provisoire, car une vérification directe de la tradition grecque et des versions anciennes est encore nécessaire.
