  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: fr
  text: '4:1 Alors Thamyris se tint devant le tribunal du gouverneur et déclara d’une voix forte :


    4:2 « Gouverneur, j’ignore d’où vient cet homme, mais il enseigne que le mariage est interdit. Ordonne-lui donc d’expliquer devant toi pourquoi il proclame de tels enseignements. »


    4:3 Pendant qu’il parlait ainsi, Démas et Hermogène lui soufflèrent : « Dis qu’il est chrétien, et il sera aussitôt mis à mort. »[a]


    4:4 Mais le gouverneur voulut examiner l’affaire avec plus de soin. Il fit appeler Paul et lui dit : « Qui es-tu ? Qu’enseignes-tu ? Ces gens semblent t’accuser de crimes graves. »


    4:5 Alors Paul déclara d’une voix forte : « Puisque je suis maintenant appelé à rendre compte de mon enseignement, gouverneur, je te demande de m’écouter.


    4:6 « Dieu, qui est un Dieu de juste rétribution[b] et qui ne désire rien d’autre que le salut de ses créatures, m’a envoyé pour les détourner de leur méchanceté et de leur corruption, de tous les plaisirs coupables et de la mort, et pour les persuader de ne plus pécher.


    4:7 « C’est pourquoi Dieu a envoyé son Fils, Jésus Christ. C’est lui que je proclame, et j’enseigne aux êtres humains à placer en lui leur espérance. Lui seul a eu une telle compassion pour le monde égaré que celui-ci ne soit pas condamné, gouverneur, mais qu’il ait la foi, la crainte de Dieu, la connaissance de la vraie religion[c] et l’amour de la vérité.


    4:8 « Si donc je n’enseigne que ce que j’ai reçu par révélation de Dieu, quel est mon crime ? »


    4:9 Après l’avoir entendu, le gouverneur ordonna que Paul soit enchaîné et jeté en prison, jusqu’à ce qu’il ait davantage de temps pour l’entendre plus complètement.


    4:10 Mais, pendant la nuit, Thècle retira ses boucles d’oreilles et les donna au gardien de la prison, qui lui ouvrit les portes et la laissa entrer.


    4:11 Puis elle offrit un miroir d’argent au geôlier, qui lui permit d’entrer dans la pièce où se trouvait Paul. Elle s’assit alors à ses pieds et l’écouta parler des grandes œuvres de Dieu.[d]


    4:12 Voyant que Paul ne craignait pas de souffrir, mais qu’avec l’aide de Dieu il se conduisait courageusement, elle grandit tellement dans la foi qu’elle embrassa ses chaînes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais ancien comporte ici une parenthèse autour de « soufflèrent à Thamyris et ». La formulation retenue donne le sens suivi de la phrase; la ponctuation et le détail exact devront être vérifiés dans les témoins grecs et les anciennes versions.
    reason: Signaler une particularité textuelle explicitement conservée dans le témoin fourni et la limite de la base de travail.
  - marker: b
    text: 'Littéralement, selon le témoin anglais : « un Dieu de vengeance ». Le texte peut évoquer la vengeance, le châtiment ou la juste rétribution.'
    reason: Préserver la tension théologique et la gamme sémantique sans réduire Dieu à une vindicte personnelle.
  - marker: c
    text: 'Ou : « la connaissance de la religion »; selon le terme grec qui sera établi, on pourrait aussi comprendre « la connaissance de la piété ».'
    reason: La révision directe du grec reste en attente, et le témoin anglais « religion » ne permet pas de fixer précisément le terme source.
  - marker: d
    text: 'Ou : « les grandes choses de Dieu ».'
    reason: Conserver l’ambiguïté entre les actes puissants de Dieu et les grandes vérités qui le concernent.
lexical_decisions:
- source_word: matrimony is unlawful
  choice: le mariage est interdit
  rationale: Rend directement l’accusation portée contre Paul sans préciser si l’interdiction est juridique, morale ou religieuse.
- source_word: God of vengeance
  choice: Dieu de juste rétribution
  rationale: Conserve l’idée difficile de vengeance ou de châtiment tout en évitant en français moderne une connotation de vindicte personnelle; la note signale la formulation littérale du témoin.
- source_word: needs nothing except the salvation of his creatures
  choice: ne désire rien d’autre que le salut de ses créatures
  rationale: Le tour anglais est sémantiquement tendu, puisque Dieu est dit ne manquer de rien tout en « ayant besoin » du salut; cette formulation française naturelle préserve l’orientation exclusive vers le salut sans attribuer explicitement un manque à Dieu.
- source_word: knowledge of religion
  choice: connaissance de la vraie religion
  rationale: « Religion » seul serait peu idiomatique dans cette énumération; « vraie » explicite ici le sens probable de piété ou de connaissance religieuse, tout en étant signalé par une note.
- source_word: the great things of God
  choice: les grandes œuvres de Dieu
  rationale: Expression française biblique naturelle; une note conserve l’autre possibilité, « les grandes choses de Dieu ».
- source_word: turnkey / jailer
  choice: gardien de la prison / geôlier
  rationale: Maintient la variation lexicale du témoin, sans décider s’il s’agit nécessairement de deux personnes différentes.
theological_decisions:
- issue: La caractérisation de Dieu comme « Dieu de vengeance »
  choice: Dieu de juste rétribution
  alternative: Dieu de vengeance
  rationale: La traduction conserve la fonction judiciaire du terme et la tension théologique du passage, tandis que la note donne le rendu plus littéral.
- issue: Le rapport entre Dieu et le salut des créatures
  choice: ne désire rien d’autre que le salut de ses créatures
  alternative: n’a besoin de rien, si ce n’est du salut de ses créatures
  rationale: Le choix produit un français intelligible sans transformer la phrase en affirmation métaphysique précise; l’état provisoire de la base textuelle empêche de trancher davantage.
- issue: La compassion salvatrice du Christ et le monde
  choice: Lui seul a eu une telle compassion pour le monde égaré que celui-ci ne soit pas condamné
  alternative: lui qui a eu compassion du monde égaré afin qu’il ne soit pas condamné
  rationale: Préserve l’exclusivité présente dans le témoin anglais (« He alone »), sans développer une doctrine supplémentaire sur l’étendue ou le mécanisme du salut.
- issue: Foi, crainte de Dieu, religion et vérité
  choice: qu’il ait la foi, la crainte de Dieu, la connaissance de la vraie religion et l’amour de la vérité
  alternative: qu’il ait foi, crainte de Dieu, connaissance de la piété et amour de la vérité
  rationale: Conserve les quatre éléments de l’énumération et évite de les harmoniser avec une terminologie confessionnelle particulière.
translation_notes:
  register: 'Français international moderne, narratif et digne, avec tutoiement conforme à la relation d’autorité exprimée dans le récit ancien. Les phrases ont été légèrement réorganisées pour la clarté orale, sans effacer les tensions du témoin. Ce projet demeure nécessairement provisoire : la donnée fournie est une traduction anglaise publique du XIXe siècle et indique elle-même que la vérification directe du grec et des versions anciennes reste à faire.'
