review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Plusieurs choix du projet atténuent ou interprètent le témoin au-delà de ce qu’il permet : « Dieu de juste rétribution » remplace « Dieu de vengeance », « ne désire rien d’autre » remplace l’énoncé paradoxal selon lequel Dieu « n’a besoin de rien, sinon... », « vraie religion » ajoute une qualification absente, et « grandes œuvres » interprète « great things ». La parenthèse textuellement signalée en 4:3 doit aussi être représentée dans le texte, non seulement décrite en note.'
  naturalness: Le français est globalement fluide et de registre narratif approprié. Quelques formulations gagnent en naturel et en exactitude avec « tribunal du gouverneur », « faire en sorte qu’il s’explique », « être lié », et « entendre plus en détail ».
  terminology: Conserver « mariage », « chrétien », « révélation de Dieu », « salut », « crainte de Dieu » et « Jésus Christ ». Employer « Dieu de vengeance » pour ne pas neutraliser le terme difficile. Rendre « connaissance de la religion » sans ajout confessionnel, et « les grandes choses de Dieu » afin de préserver l’ouverture de l’expression.
  issues:
  - severity: high
    issue: Atténuation de « God of vengeance » en 4:6
    rationale: « Dieu de juste rétribution » constitue une interprétation théologique explicative et ne traduit pas directement « God of vengeance ». Une note peut signaler la difficulté, mais le texte doit conserver « Dieu de vengeance ».
  - severity: high
    issue: Modification de « stands in need of nothing but the salvation... » en 4:6
    rationale: '« Ne désire rien d’autre que » substitue le désir au besoin et supprime la tension syntaxique du témoin. Il convient de rendre le paradoxe sans le résoudre : « n’a besoin de rien, sinon du salut... ».'
  - severity: medium
    issue: Ajout de « vraie » devant « religion » en 4:7
    rationale: L’adjectif n’apparaît pas dans le témoin et impose une précision absente. « La connaissance de la religion » maintient la formulation transmise, avec une note prudente sur l’incertitude du mot source.
  - severity: medium
    issue: Interprétation de « the great things of God » comme « les grandes œuvres de Dieu » en 4:11
    rationale: « Œuvres » limite l’expression aux actes divins, alors que le témoin permet aussi « grandes choses » ou enseignements. « Les grandes choses de Dieu » conserve l’ambiguïté.
  - severity: medium
    issue: La parenthèse du témoin en 4:3 n’est pas reproduite dans le texte français
    rationale: Puisque le témoin fourni marque explicitement « (whispered to Thamyris, and) », le rendu doit conserver ce segment entre parenthèses, même si son statut textuel reste incertain.
  - severity: low
    issue: « Jeté en prison » en 4:9 est plus expressif que le témoin
    rationale: Le témoin dit simplement « put in prison ». « Mis en prison » est plus exact.
