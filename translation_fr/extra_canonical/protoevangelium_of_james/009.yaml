  to: '(1) Joseph jeta sa hache et se rendit à leur rassemblement. Quand ils furent tous réunis, ils allèrent auprès du prêtre avec leurs bâtons. Le prêtre prit tous leurs bâtons, entra dans le Temple et pria. Après avoir terminé sa prière, il prit les bâtons, sortit et les leur rendit. Mais aucun des bâtons ne donna de signe. Joseph prit son bâton en dernier et, voici, une colombe sortit du bâton et vint se poser sur sa tête. Le prêtre dit à Joseph : « Tu as été choisi pour accueillir sous ta garde la vierge du Seigneur. »


    (2) Mais Joseph refusa en disant : « J’ai des fils et je suis un vieil homme, tandis qu’elle est jeune. Je ne veux pas devenir la risée du peuple d’Israël. »


