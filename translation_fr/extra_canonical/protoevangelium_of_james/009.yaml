  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: fr
  text: '(1) Joseph jeta sa hache et se rendit à leur rassemblement. Quand ils furent tous réunis, ils allèrent auprès du prêtre avec leurs bâtons. Le prêtre prit tous leurs bâtons, entra dans le Temple et pria. Après avoir terminé sa prière, il prit les bâtons, sortit et les leur rendit. Mais aucun des bâtons ne donna de signe. Joseph prit son bâton en dernier et, voici, une colombe sortit du bâton et vint se poser sur sa tête. Le prêtre dit à Joseph : « Tu as été choisi pour accueillir sous ta garde la vierge du Seigneur. »


    (2) Mais Joseph refusa en disant : « J’ai des fils et je suis un vieil homme, tandis qu’elle est jeune. Je ne veux pas devenir la risée du peuple d’Israël. »


    Le prêtre lui dit : « Joseph, crains le Seigneur ton Dieu et souviens-toi de ce que Dieu a fait à Dathan, Abiron et Coré : la terre s’est ouverte et les a tous engloutis à cause de leur révolte. Maintenant donc, crains Dieu, Joseph, afin que de telles choses n’arrivent pas dans ta maison. »


    (3) Saisi de crainte, Joseph l’accueillit sous sa garde et lui dit : « Marie, je t’ai prise du Temple du Seigneur et, maintenant, je t’emmène dans ma maison. Je pars construire des maisons, mais je reviendrai auprès de toi. Le Seigneur te protégera. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: axe
  choice: hache
  rationale: Terme concret et courant, correspondant directement à l’outil que Joseph abandonne avant de rejoindre l’assemblée.
- source_word: staffs
  choice: bâtons
  rationale: « Bâtons » convient naturellement aux objets remis au prêtre et préserve le lien avec le bâton de Joseph, sans préciser indûment qu’il s’agit de sceptres ou de baguettes.
- source_word: Temple
  choice: Temple
  rationale: La majuscule indique naturellement en français le sanctuaire de Jérusalem visé par le récit.
- source_word: welcome ... into your own care
  choice: accueillir sous ta garde
  rationale: Cette formule exprime à la fois l’accueil et la responsabilité de protection sans introduire explicitement une relation matrimoniale que le passage ne nomme pas.
- source_word: rebellion
  choice: révolte
  rationale: Rend clairement la résistance de Dathan, Abiron et Coré à l’autorité divine, dans un français actuel et digne.
- source_word: build houses
  choice: construire des maisons
  rationale: Le pluriel inhabituel est conservé plutôt que normalisé en « travailler » ou « bâtir une maison ».
theological_decisions:
- issue: Nature de la responsabilité confiée à Joseph
  choice: « accueillir sous ta garde »
  alternative: « prendre pour épouse » ou « recevoir chez toi »
  rationale: Le témoin fourni met l’accent sur la garde et la protection. La traduction n’impose donc ni un mariage explicitement formulé ni un simple hébergement.
- issue: Origine et mouvement de la colombe
  choice: « une colombe sortit du bâton et vint se poser sur sa tête »
  alternative: « une colombe s’envola du bâton au-dessus de la tête de Joseph »
  rationale: La formulation retient le signe miraculeux tel que le décrit le témoin tout en rendant naturellement le mouvement en français. La localisation exacte pourrait nécessiter une vérification directe du grec.
- issue: Motif du châtiment de Dathan, Abiron et Coré
  choice: « à cause de leur révolte »
  alternative: « à cause de leur contradiction »
  rationale: « Révolte » correspond au sens contextuel du récit de Nombres 16 sans préciser davantage la nature de leur faute.
- issue: Crainte de Joseph au verset 3
  choice: « Saisi de crainte »
  alternative: « Ayant eu peur »
  rationale: La formulation conserve le lien avec l’avertissement du prêtre et la crainte de Dieu, sans affirmer que Joseph agit seulement sous l’effet d’une terreur humaine.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes sont conservées, tandis que certaines coordinations sont allégées pour la fluidité. Aucun marqueur de note n’est requis, puisqu’aucune note de bas de page n’est ajoutée. Projet provisoire fondé sur le témoin anglais public fourni ; une collation directe de la tradition manuscrite grecque reste nécessaire, notamment pour le mouvement de la colombe et les termes relatifs à la garde de Marie.
