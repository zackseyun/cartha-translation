translation:
  language: fr
  text: '(1) La sage-femme entra et dit : « Marie, mets-toi en position, car ce n’est pas une petite épreuve qui t’attend. »


    Salomé l’examina. Puis elle poussa un cri : « Malheur à moi à cause de mon mépris de la Loi et de mon incrédulité ! Car j’ai mis à l’épreuve le Dieu vivant et voici : ma main brûle et se détache de moi ! »


    (2) Elle tomba à genoux devant le Seigneur et dit : « Dieu de mes ancêtres, souviens-toi de moi, car je descends d’Abraham, d’Isaac et de Jacob. Ne fais pas de moi un exemple devant le peuple d’Israël, mais rends-moi aux pauvres[a], car tu sais, Seigneur, que j’ai guéri des gens en ton nom et que j’ai reçu de toi mon salaire. »


    (3) Et voici : un ange du Seigneur lui apparut et lui dit : « Salomé, Salomé, le Seigneur de tous a entendu ta prière. Approche ta main de l’enfant et prends-le dans tes bras ; tu recevras salut et joie. »


    (4) Et voici : Salomé s’approcha joyeusement de l’enfant et le prit dans ses bras, en disant : « Je me prosterne devant lui, car un grand roi est né pour Israël. » Aussitôt, Salomé fut guérie et elle sortit de la grotte déclarée juste[b].


    Et voici : une voix disait : « Salomé, Salomé, ne raconte pas les merveilles que tu as vues avant que l’enfant soit entré dans Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « rends-moi aux pauvres » est difficile et son sens exact demeure incertain dans la tradition transmise ; elle est conservée ici sans interprétation ajoutée.
    reason: Signaler une formulation textuellement obscure que toute paraphrase risquerait de résoudre arbitrairement.
  - marker: b
    text: 'Ou : « justifiée ». Le terme peut évoquer à la fois son acquittement devant Dieu et son rétablissement après le jugement subi.'
    reason: Préserver la dimension judiciaire et théologique du mot, au-delà de la seule guérison.
lexical_decisions:
- source_word: lawlessness
  choice: mépris de la Loi
  rationale: Dans ce contexte juif, le terme vise vraisemblablement une transgression ou un rejet de la Loi plutôt qu’une simple absence générale de règles. Cette formulation reste claire sans préciser une faute non indiquée.
- source_word: test / tested
  choice: épreuve / mis à l’épreuve
  rationale: Préserve le lien verbal du passage entre l’examen annoncé et l’action de Salomé envers le Dieu vivant.
- source_word: Lord of All
  choice: Seigneur de tous
  rationale: Rend le titre universel sans l’identifier à une formulation confessionnelle plus spécialisée.
- source_word: lift him up
  choice: prends-le dans tes bras
  rationale: Expression française naturelle dans le contexte d’un nouveau-né, tout en conservant l’action physique demandée.
- source_word: worship
  choice: me prosterne devant
  rationale: Conserve l’ambiguïté entre geste d’hommage et adoration, que le français « adorer » résoudrait plus fortement.
- source_word: justified
  choice: déclarée juste
  rationale: Maintient la portée judiciaire et théologique du terme, plutôt que de l’affaiblir en « pardonnée » ou « rétablie ».
theological_decisions:
- issue: Nature de l’hommage rendu à l’enfant
  choice: « Je me prosterne devant lui »
  alternative: « Je l’adore »
  rationale: Le récit donne à l’enfant une dignité extraordinaire, mais la formulation source peut désigner l’adoration ou l’hommage royal. La traduction ne tranche pas cette tension.
- issue: Sens du rétablissement final de Salomé
  choice: « elle sortit de la grotte déclarée juste »
  alternative: « elle sortit de la grotte justifiée »
  rationale: La formulation explicite le sens de la justification en français courant sans la réduire à la seule guérison physique.
- issue: La main « en feu »
  choice: « ma main brûle »
  alternative: « ma main est en feu »
  rationale: Cette lecture peut décrire une sensation ou un phénomène visible. Le français retenu préserve autant que possible cette ouverture.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les répétitions de « Et voici » sont maintenues comme traits du style ancien. Le texte demeure provisoire : le dossier fourni repose sur un témoin anglais du domaine public et indique que la vérification directe du grec est encore en attente.'
