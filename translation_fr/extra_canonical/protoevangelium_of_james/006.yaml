    Elle aménagea un sanctuaire dans sa chambre et ne permit à rien de profane ni d’impur d’y entrer. Puis elle appela les filles hébraïques pures, et elles jouaient avec l’enfant.


    (2) Lorsque l’enfant eut un an, Joachim donna un grand festin. Il invita les grands prêtres, les prêtres, les spécialistes des Écritures, les anciens et tout le peuple d’Israël. Joachim présenta l’enfant aux prêtres, qui la bénirent en disant : « Dieu de nos ancêtres, bénis cette enfant et donne-lui un nom qui sera proclamé à jamais, de génération en génération. »


