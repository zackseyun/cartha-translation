  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: fr
  text: '**6. La première année de Marie**


    (1) De jour en jour, l’enfant prenait des forces. Lorsqu’elle eut six mois, sa mère la mit debout par terre pour voir si elle tiendrait. Elle fit sept pas et revint contre sa mère. Celle-ci la prit dans ses bras et dit : « Aussi vrai que le Seigneur mon Dieu est vivant, tu ne marcheras plus sur ce sol jusqu’à ce que je te conduise dans le Temple du Seigneur. »


    Elle aménagea un sanctuaire dans sa chambre et ne permit à rien de profane ni d’impur d’y entrer. Puis elle appela de jeunes Hébreues sans souillure, qui jouaient avec l’enfant.


    (2) Lorsque l’enfant eut un an, Joachim donna un grand festin. Il invita les grands prêtres, les prêtres, les spécialistes des Écritures, les anciens et tout le peuple d’Israël. Joachim présenta l’enfant aux prêtres, qui la bénirent en disant : « Dieu de nos ancêtres, bénis cette enfant et donne-lui un nom qui sera proclamé à jamais, de génération en génération. »


    Tout le peuple répondit : « Qu’il en soit ainsi ! Amen ! »


    On la présenta ensuite aux grands prêtres, qui la bénirent en disant : « Dieu Très-Haut, porte ton regard sur cette enfant et accorde-lui une bénédiction ultime, que rien ne puisse surpasser. »


    (3) Sa mère la prit et monta dans le sanctuaire de sa chambre, où elle l’allaita. Anne composa un chant pour le Seigneur Dieu :


    « Je chanterai un chant sacré au Seigneur mon Dieu,

    car Dieu est intervenu en ma faveur

    et m’a délivrée des insultes de mes ennemis.


    « Le Seigneur Dieu m’a donné le fruit de sa justice,

    unique en son genre, mais aux multiples visages devant lui.[a]


    « Qui annoncera aux descendants de Roubel[b]

    qu’Anne allaite une enfant ?

    Écoutez, écoutez, vous, les douze tribus d’Israël :

    Anne allaite une enfant ! »


    Anne coucha l’enfant dans le sanctuaire de sa chambre, puis sortit pour servir ses invités. À la fin du repas, ils repartirent pleins de joie, en glorifiant le Dieu d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « unique en son genre, mais aux multiples visages » est paradoxale et son sens exact demeure incertain. Elle est conservée sans harmonisation explicative.
    reason: Signaler une ambiguïté réelle de la formulation source et éviter une résolution théologique arbitraire.
  - marker: b
    text: « Roubel » suit la forme transmise ici. Il pourrait s’agir d’une variante ou d’une altération du nom « Ruben ».
    reason: La leçon nominale est incertaine ; elle ne doit pas être corrigée silencieusement.
lexical_decisions:
- source_word: ἁγίασμα (hagiasma)
  choice: sanctuaire
  rationale: Conserve l’idée d’un espace domestique mis à part comme sacré, sans le confondre avec le Temple mentionné auparavant.
- source_word: γραμματεῖς (grammateis)
  choice: spécialistes des Écritures
  rationale: Rend la fonction religieuse et interprétative plus clairement que le simple « scribes », tout en restant accessible au lectorat moderne.
- source_word: ὀνειδισμός (oneidismos)
  choice: insultes
  rationale: Exprime l’opprobre public et les paroles hostiles visant Anne ; « critique » serait trop faible en français.
- source_word: ἐπεσκέψατό με (epeskepsato me)
  choice: est intervenu en ma faveur
  rationale: Dans ce contexte, la « visite » divine désigne une action favorable de Dieu, non une simple venue.
- source_word: μονοειδῆ καὶ πολυπρόσωπον (monoeidē kai polyprosōpon)
  choice: unique en son genre, mais aux multiples visages
  rationale: Préserve le paradoxe poétique et son ambiguïté plutôt que de lui imposer une explication théologique.
- source_word: ἀνέπαυσεν αὐτήν (anepausen autēn)
  choice: coucha l’enfant
  rationale: Le pronom féminin renvoie naturellement à l’enfant dans le contexte ; Anne la met au repos avant de servir les convives.
- source_word: διηκόνει αὐτοῖς (diēkonei autois)
  choice: servir ses invités
  rationale: Rend explicitement le service du repas indiqué par le contexte, sans donner au verbe un sens ecclésiastique anachronique.
theological_decisions:
- issue: Nature sacrée de la chambre de Marie
  choice: « sanctuaire » pour l’espace aménagé dans la chambre
  alternative: « lieu saint » ou « espace consacré »
  rationale: Le terme cultuel fort du récit est maintenu, tout en laissant le lecteur discerner sa portée symbolique.
- issue: « Fruit de sa justice »
  choice: Conserver « le fruit de sa justice »
  alternative: Interpréter comme « le fruit accordé par sa bonté »
  rationale: La formulation dense peut renvoyer à l’acte juste de Dieu, à son don ou à l’enfant ; la traduction ne tranche pas cette tension.
- issue: Bénédiction ultime
  choice: « une bénédiction ultime, que rien ne puisse surpasser »
  alternative: « la bénédiction suprême »
  rationale: La formulation conserve à la fois l’idée de terme ou d’accomplissement et celle d’une bénédiction insurpassable, sans préciser davantage sa portée doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne, avec des phrases accessibles. Les répétitions et le parallélisme du chant sont préservés. Le projet signale que l’examen direct de toute la tradition manuscrite grecque reste à achever ; le présent draft s’appuie sur le témoin fourni, vérifié autant que possible à partir des formulations grecques identifiables, et conserve les endroits obscurs plutôt que de les lisser.
