  text: '(1) Look! An angel of the Lord stood nearby and said to her, “Anna, Anna, the Lord has heard your prayer. You will conceive and give birth, and your offspring will be spoken of throughout the whole world.”


    Anna said, “As the Lord God lives, whether I give birth to a boy or a girl, I will bring the child as a gift to the Lord my God, and the child will minister to him all the days of its life.”


    (2) Look! Two angels came and said to her, “Look, your husband Joachim is coming with his flocks.” For an angel of the Lord had gone down to Joachim and said, “Joachim, Joachim, the Lord God has heard your prayer. Go down from here. Look, your wife Anna has conceived in her womb.”


    (3) Joachim immediately went down and called the shepherds. He said to them, “Bring me ten lambs without spot or blemish, and the ten lambs will be for the Lord God. Bring me twelve tender calves for the priests and the elders, and one hundred male goats for all the people.”


    (4) Look! Joachim came with his flocks, and Anna stood at the gate. When she saw Joachim coming with his flocks, she immediately ran and threw her arms around his neck, saying, “Now I know that the Lord God has greatly blessed me. For look! The widow is no longer a widow, and look! The one without a child in her womb has conceived.”


    Joachim rested in his house for the first day.'
translation:
  language: fr
  text: '(1) Voici qu’un ange du Seigneur se tint près d’elle et lui dit : « Anne, Anne, le Seigneur a entendu ta prière. Tu concevras et tu enfanteras, et l’on parlera de ta descendance dans le monde entier. »


    Anne dit : « Aussi vrai que le Seigneur Dieu est vivant, que je mette au monde un garçon ou une fille, je l’offrirai en don au Seigneur mon Dieu, et l’enfant le servira tous les jours de sa vie. »


    (2) Voici que deux anges vinrent lui dire : « Voici que Joachim, ton mari, arrive avec ses troupeaux. » En effet, un ange du Seigneur était descendu auprès de Joachim et lui avait dit : « Joachim, Joachim, le Seigneur Dieu a entendu ta prière. Descends d’ici. Voici qu’Anne, ta femme, a conçu dans son sein.[a] »


    (3) Joachim descendit aussitôt et appela les bergers. Il leur dit : « Amenez-moi ici dix agneaux sans défaut ni tache ; ces dix agneaux seront pour le Seigneur Dieu. Amenez-moi aussi douze jeunes veaux pour les prêtres et les anciens, et cent boucs pour tout le peuple. »


    (4) Voici que Joachim arriva avec ses troupeaux, tandis qu’Anne se tenait à la porte. Lorsqu’elle le vit arriver avec ses troupeaux, elle courut aussitôt se jeter à son cou et dit : « Maintenant, je sais que le Seigneur Dieu m’a comblée de bénédictions. Car voici : la veuve n’est plus veuve, et celle qui n’avait pas d’enfant dans son sein a conçu.[b] »


    Joachim passa ce premier jour chez lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin fourni dit ici qu’Anne « a conçu », alors que l’annonce du verset 1 était formulée au futur. La tension est conservée.
    reason: Signaler une difficulté temporelle réelle sans la corriger conjecturalement, la révision directe du grec restant en attente.
  - marker: b
    text: L’expression « la veuve n’est plus veuve » est conservée telle quelle, bien que Joachim soit vivant dans le récit ; elle peut exprimer la fin de l’abandon éprouvé par Anne, mais le texte ne l’explique pas.
    reason: Préserver l’ambiguïté narrative et éviter une interprétation imposée.
lexical_decisions:
- source_word: And look! / Look!
  choice: Voici que / Voici
  rationale: Conserve le signal narratif insistant et le ton scripturaire sans employer l’archaïque « voici ! » à chaque occurrence.
- source_word: offspring
  choice: descendance
  rationale: Préserve le sens collectif ou durable du terme et évite de le réduire d’emblée au seul enfant à naître.
- source_word: minister to him
  choice: le servira
  rationale: Expression française naturelle qui garde l’idée d’un service consacré rendu à Dieu.
- source_word: without spot or blemish
  choice: sans défaut ni tache
  rationale: Maintient le vocabulaire sacrificiel et sa double formulation.
- source_word: tender calves
  choice: jeunes veaux
  rationale: Rend naturellement l’âge et la qualité des animaux sans surinterpréter l’adjectif comme une indication culinaire.
- source_word: rested ... in his house
  choice: passa ce premier jour chez lui
  rationale: Formulation française fluide qui conserve l’indication temporelle inhabituelle du témoin, sans préciser une action non attestée.
theological_decisions:
- issue: Statut de la conception d’Anne au moment de l’annonce
  choice: « a conçu dans son sein »
  alternative: « concevra dans son sein »
  rationale: Le témoin fourni emploie l’accompli « has conceived ». La traduction le conserve, malgré la tension avec l’annonce précédente au futur.
- issue: Consécration de l’enfant indépendamment de son sexe
  choice: « que je mette au monde un garçon ou une fille, je l’offrirai »
  alternative: Employer un masculin générique sans répéter l’enfant
  rationale: Cette formulation préserve explicitement le vœu portant sur l’un ou l’autre sexe et évite une ambiguïté grammaticale française.
- issue: Déclaration d’Anne se qualifiant de veuve
  choice: Conserver littéralement « la veuve n’est plus veuve »
  alternative: Paraphraser comme une fin de solitude ou d’abandon
  rationale: L’énoncé produit une tension narrative puisque Joachim est vivant. Il ne faut pas résoudre silencieusement cette image ou expression traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible, avec une légère couleur scripturaire portée par « Voici que », « aussi vrai que » et les répétitions du récit. Draft provisoire fondé sur le témoin anglais public fourni ; une vérification directe de la tradition manuscrite grecque reste nécessaire.
