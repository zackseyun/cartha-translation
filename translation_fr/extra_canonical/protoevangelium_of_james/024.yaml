translation:
  language: fr
  text: '(1) À l’heure de la salutation, les prêtres arrivèrent, mais Zacharie ne vint pas à leur rencontre pour les bénir selon la coutume. Ils restèrent là à l’attendre, afin de recevoir sa salutation accompagnée d’une bénédiction et de glorifier le Dieu Très-Haut.


    (2) Comme il tardait, ils furent tous saisis de peur. L’un d’eux prit pourtant courage, entra dans le sanctuaire et vit du sang coagulé près de l’autel du Seigneur. Une voix disait : « Zacharie a été assassiné, et son sang ne sera pas effacé jusqu’à ce que vienne celui qui le vengera ! »


    En entendant ces paroles, il eut peur. Il sortit et rapporta aux prêtres ce qu’il avait vu et entendu.


    (3) Alors ils prirent courage, entrèrent et virent ce qui était arrivé. Les panneaux du Temple poussèrent un cri[a], et les prêtres déchirèrent leurs vêtements de haut en bas. Ils ne trouvèrent pas son corps, mais constatèrent que son sang s’était changé en pierre. Saisis de peur, ils sortirent annoncer à tout le peuple que Zacharie avait été assassiné. Quand toutes les tribus du peuple l’apprirent, elles portèrent son deuil et pleurèrent pendant trois jours et trois nuits.


    (4) Après ces trois jours, les prêtres tinrent conseil pour décider qui remplacerait Zacharie. Le sort désigna Siméon, car l’Esprit Saint lui avait révélé qu’il ne verrait pas la mort avant d’avoir vu le Christ dans la chair[b].'
