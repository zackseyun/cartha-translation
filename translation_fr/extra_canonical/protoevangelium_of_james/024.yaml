lexical_decisions:
- source_word: hour of greeting
  choice: l’heure de la salutation
  rationale: Conserve l’expression rituelle du témoin sans préciser davantage une pratique dont le contexte exact demeure incertain.
- source_word: sanctuary
  choice: sanctuaire
  rationale: Terme cultuel naturel en français, distinct du Temple pris dans son ensemble.
- source_word: blood clotted
  choice: du sang coagulé
  rationale: Rend concrètement l’état du sang observé près de l’autel sans ajouter d’interprétation.
- source_word: avenger
  choice: celui qui le vengera
  rationale: Formulation française claire qui préserve l’idée d’un vengeur à venir sans l’identifier.
- source_word: panels of the Temple
  choice: les panneaux du Temple
  rationale: Traduction prudente du témoin fourni; le référent architectural exact devra être vérifié sur le grec.
- source_word: the lot fell to Simeon
  choice: le sort désigna Siméon
  rationale: Expression idiomatique qui conserve le procédé de désignation par tirage au sort.
- source_word: Christ in the flesh
  choice: le Christ dans la chair
  rationale: Maintient la formulation incarnatoire forte et sa tension théologique, plutôt que de la paraphraser par « en personne ».
theological_decisions:
- issue: Persistance du sang jusqu’à la venue du vengeur
  choice: « jusqu’à ce que vienne celui qui le vengera »
  alternative: « jusqu’à la venue de son vengeur »
  rationale: Ne précise ni l’identité ni la nature du vengeur et conserve ainsi l’ambiguïté du récit.
- issue: Révélation de l’Esprit Saint à Siméon
  choice: « l’Esprit Saint lui avait révélé »
  alternative: « il lui avait été dit par l’Esprit Saint »
  rationale: Formulation naturelle qui conserve l’Esprit Saint comme source de la révélation, sans définir son mode.
- issue: Vision du Christ incarné
  choice: « vu le Christ dans la chair »
  alternative: « vu le Messie en personne »
  rationale: Préserve explicitement le terme « Christ » et le langage de la chair, sans atténuer leur portée théologique.
