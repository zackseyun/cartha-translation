base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/013.yaml
  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: fr
  text: '(1) Elle en était à son sixième mois. Et voici que Joseph revint de ses travaux de construction. Il entra dans la maison et la trouva enceinte. Il se frappa le visage, se jeta par terre sur une toile de sac et pleura amèrement. Il disait : « Comment pourrai-je me présenter devant le Seigneur Dieu ? Quelle prière pourrai-je faire au sujet de cette jeune fille ? Je l’ai reçue vierge du Temple du Seigneur Dieu, et je ne l’ai pas protégée ! Qui m’a tendu ce piège ? Qui a commis ce mal dans ma maison ? Qui a souillé la vierge ? Ne suis-je pas en train de revivre l’histoire d’Adam ? En effet, pendant qu’Adam rendait gloire à Dieu à l’heure de la prière, le serpent est venu ; il a trouvé Ève seule et l’a trompée. Et maintenant, la même chose m’est arrivée ! »


    (2) Joseph se releva de dessus la toile de sac, appela Marie et lui dit : « Dieu a pris soin de toi. Pourquoi as-tu fait cela ? Tu as oublié le Seigneur ton Dieu. Pourquoi t’es-tu déshonorée ? Tu as été nourrie dans le Saint des saints et tu as reçu ta nourriture de la main d’un ange ! »


    (3) Elle pleura amèrement et dit : « Je suis pure et je n’ai pas connu d’homme ! »


    Joseph lui demanda : « Alors, d’où vient ce que tu portes dans ton ventre ? »


    Elle répondit : « Aussi vrai que le Seigneur mon Dieu est vivant, je ne sais pas d’où cela vient ! »'
