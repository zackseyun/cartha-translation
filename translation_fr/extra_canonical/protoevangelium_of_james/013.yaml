review_pass:
  verdict: revise
  source_fidelity: 'Le rendu suit fidèlement le témoin anglais fourni, notamment le désarroi de Joseph, l’allusion à Adam et Ève, l’euphémisme « connaître un homme » et l’absence d’explication causale de la grossesse. Une correction sûre est toutefois nécessaire : le témoin dit seulement que Joseph « l’appela » ; l’ajout de « Marie » dans ce verset n’est pas présent dans le passage et doit être évité. « Venait de ses travaux de construction » rend plus directement « came from his building » que « revint », qui peut suggérer un retour non exprimé explicitement par le témoin.'
  naturalness: Le français est globalement naturel, soutenu et accessible. « Était étendu sur une toile de sac » exprime plus idiomatiquement et clairement la position de Joseph que « se releva de dessus la toile de sac ».
  terminology: « Seigneur Dieu », « Temple », « Saint des saints », « vierge » et « connaître un homme » sont appropriés et cohérents avec un registre biblique moderne. « Prendre soin de toi » ne surcharge pas théologiquement l’énoncé. Aucun marqueur de note n’est requis par le texte fourni.
  issues:
  - severity: low
    issue: Ajout du nom « Marie » en 13.2
    rationale: Le passage source et la piste anglaise disent que Joseph l’appela, sans la nommer. Même si l’identité est connue du contexte, le nom doit être retiré pour conserver la formulation du passage.
  - severity: low
    issue: « revint de ses travaux de construction »
    rationale: « Revint » peut être défendable contextuellement, mais « venait de » reproduit plus directement « came from » sans introduire l’idée d’un retour.
  - severity: low
    issue: Formulation de 13.2 concernant le sac
    rationale: « Se releva de dessus » est moins naturel en français international. « Se releva, lui qui était étendu sur une toile de sac » conserve le détail matériel sans suggérer qu’il portait un vêtement de sac.
  revised_text: '(1) Elle en était à son sixième mois. Et voici que Joseph venait de ses travaux de construction. Il entra dans la maison et la trouva enceinte. Il se frappa le visage, se jeta par terre sur une toile de sac et pleura amèrement. Il dit : « Comment pourrai-je me présenter devant le Seigneur Dieu ? Quelle prière pourrai-je faire au sujet de cette jeune fille ? Je l’ai reçue vierge du Temple du Seigneur Dieu, et je ne l’ai pas protégée ! Qui m’a tendu ce piège ? Qui a commis ce mal dans ma maison ? Qui a souillé la vierge ? Ne suis-je pas en train de revivre l’histoire d’Adam ? En effet, pendant qu’Adam rendait gloire à Dieu à l’heure de la prière, le serpent est venu ; il a trouvé Ève seule et l’a trompée. Et maintenant, la même chose m’est arrivée ! »


    (2) Joseph se releva, lui qui était étendu sur une toile de sac, l’appela et lui dit : « Dieu a pris soin de toi. Pourquoi as-tu fait cela ? Tu as oublié le Seigneur ton Dieu. Pourquoi t’es-tu déshonorée ? Tu as été nourrie dans le Saint des saints et tu as reçu ta nourriture de la main d’un ange ! »


    (3) Elle pleura amèrement et dit : « Je suis pure et je n’ai pas connu d’homme ! »


    Joseph lui demanda : « Alors, d’où vient ce que tu portes dans ton ventre ? »


    Elle répondit : « Aussi vrai que le Seigneur mon Dieu est vivant, je ne sais pas d’où cela vient ! »'
  revised_footnotes: []
  revision_rationale: 'Révision limitée à des corrections sûres de fidélité et de fluidité : suppression du nom ajouté dans le discours narratif, formulation plus directe du déplacement de Joseph et amélioration idiomatique de la mention de la toile de sac. Le texte maintient l’ambiguïté narrative sur l’origine de la grossesse et ne lui impose aucune interprétation doctrinale.'
