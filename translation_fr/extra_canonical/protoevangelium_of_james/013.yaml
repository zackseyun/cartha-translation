lexical_decisions:
- source_word: from his building
  choice: revint de ses travaux de construction
  rationale: Le témoin anglais peut désigner l’activité de bâtir plutôt qu’un bâtiment lui appartenant. Cette formulation française naturelle conserve ce sens probable sans préciser indûment le métier de Joseph.
- source_word: struck his face
  choice: se frappa le visage
  rationale: Conserve le geste concret de détresse du témoin au lieu de le remplacer par une expression française figurée.
- source_word: in sackcloth
  choice: sur une toile de sac
  rationale: Rend le cadre matériel et pénitentiel du geste tout en évitant l’idée non attestée qu’il aurait nécessairement revêtu un vêtement de sac.
- source_word: look to the Lord God
  choice: me présenter devant le Seigneur Dieu
  rationale: Exprime naturellement la honte de Joseph devant Dieu, sans réduire la formule au simple fait de regarder.
- source_word: Holy of Holies
  choice: Saint des saints
  rationale: Expression française biblique établie pour le sanctuaire intérieur.
- source_word: known a man
  choice: connu d’homme
  rationale: Maintient l’euphémisme biblique relatif aux relations sexuelles, intelligible dans ce contexte.
- source_word: this thing in your womb
  choice: ce que tu portes dans ton ventre
  rationale: Préserve la formulation distante de Joseph tout en produisant un français naturel et sans ajouter une qualification du fœtus.
theological_decisions:
- issue: Nature de la conception de Marie
  choice: Maintenir l’affirmation de pureté et l’ignorance déclarée par Marie sans explication ajoutée
  alternative: Identifier explicitement ici une conception virginale due à l’action divine
  rationale: Le chapitre fait porter la tension sur l’interrogatoire de Joseph et ne donne pas encore lui-même d’explication causale.
- issue: Parallèle entre Marie et Ève
  choice: Présenter le parallèle comme la crainte et l’interprétation de Joseph
  alternative: L’énoncer comme un jugement narratif objectif sur Marie
  rationale: Dans le texte, cette comparaison appartient au discours affligé de Joseph et ne doit pas être transformée en verdict du narrateur.
- issue: « God cared for you »
  choice: « Dieu a pris soin de toi »
  alternative: « Dieu t’a spécialement choisie » ou « Dieu t’a favorisée »
  rationale: La formulation retenue conserve l’idée générale de sollicitude divine sans importer une doctrine plus précise que le témoin fourni.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions et les exclamations ont été conservées pour rendre l’intensité dramatique. « Et voici que » maintient la marque d’attention du récit ancien. Aucun apparat de notes n’est ajouté, puisque la consultation directe du grec reste en attente ; ce projet demeure donc provisoire et fondé sur le témoin anglais public fourni.
