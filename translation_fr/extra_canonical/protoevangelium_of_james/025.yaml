base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: fr
  text: '(1) Moi, Jacques, j’ai écrit ce récit à Jérusalem, au moment où la mort d’Hérode provoquait des troubles. Je me suis retiré au désert jusqu’à ce que les troubles se soient apaisés à Jérusalem. Je glorifiais le Seigneur Dieu, qui m’a donné la sagesse nécessaire pour écrire ce récit.


    (2) Et la grâce sera avec tous ceux qui craignent le Seigneur. Amen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: James
  choice: Jacques
  rationale: Forme française traditionnelle et naturelle du nom biblique grec Iakōbos.
- source_word: history / account
  choice: récit
  rationale: « Récit » convient à la narration rédigée sans imposer le sens moderne et historiographique de « histoire ».
- source_word: commotion / unrest
  choice: troubles
  rationale: Terme suffisamment large pour conserver l’imprécision quant à la nature de l’agitation liée à la mort d’Hérode.
- source_word: wilderness
  choice: désert
  rationale: Équivalent biblique français courant, pouvant désigner une région inhabitée sans nécessairement évoquer un désert de sable.
- source_word: fear the Lord
  choice: craignent le Seigneur
  rationale: Conserve l’expression biblique et sa gamme de sens, de la crainte au respect révérenciel.
theological_decisions:
- issue: Valeur temporelle de « grace will be with »
  choice: la grâce sera avec
  alternative: que la grâce soit avec
  rationale: Le témoin fourni présente une affirmation au futur plutôt qu’un souhait; la traduction maintient cette nuance sans la convertir en bénédiction optative.
- issue: Aspect de « was glorifying »
  choice: je glorifiais
  alternative: j’ai glorifié
  rationale: L’imparfait préserve l’action durative exprimée par le témoin, sans préciser davantage son rapport chronologique à la retraite au désert.
translation_notes:
  register: Français international moderne, digne et accessible. Ponctuation et syntaxe légèrement lissées pour la lecture, tout en conservant les répétitions significatives. Projet provisoire fondé sur le témoin anglais du domaine public; la vérification directe de la tradition manuscrite grecque reste à effectuer.
