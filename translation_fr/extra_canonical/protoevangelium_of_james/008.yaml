review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire au v. 3 : le témoin anglais dit que le grand prêtre entre « prenant le vêtement aux douze clochettes ». « Revêtu du vêtement » choisit une autre action, puis la phrase française ajoute de façon redondante qu’il « pénétra » dans le Saint des saints. Le reste rend fidèlement le témoin anglais fourni, sous réserve de la vérification directe annoncée de la tradition grecque.'
  naturalness: Le français est globalement naturel, digne et accessible. « Dans toute la région autour de la Judée » est plus idiomatiquement rendu par « dans toute la région qui entourait la Judée ».
  terminology: « Temple », « sanctuaire », « Saint des saints », « grand prêtre », « veufs », « bâton » et « hérauts » conviennent au registre et préservent les distinctions du récit. « Sa femme » restitue sans atténuation la formulation matrimoniale du témoin.
  issues:
  - severity: medium
    issue: Action du grand prêtre avec le vêtement aux douze clochettes
    rationale: « Revêtu du vêtement » ne correspond pas à « taking the robe » et la note reconnaît elle-même l’incertitude. En l’absence de contrôle direct du grec, « prenant le vêtement » conserve exactement l’ambiguïté du témoin fourni.
  - severity: low
    issue: Mouvement vers le Saint des saints répété
    rationale: « Le grand prêtre entra ... pénétra dans le Saint des saints » dédouble l’unique mouvement exprimé par le témoin. Une seule construction est plus fidèle et plus fluide.
  - severity: low
    issue: Formulation géographique
    rationale: « la région autour de la Judée » est compréhensible, mais « la région qui entourait la Judée » est plus naturel en français moderne tout en conservant le sens.
  revised_text: '(1) Ses parents redescendirent, émerveillés, louant et glorifiant le Seigneur Dieu parce que l’enfant ne s’était pas retournée. Marie demeurait dans le Temple du Seigneur. Elle y était nourrie comme une colombe et recevait de la nourriture de la main d’un ange.


    (2) Lorsqu’elle eut douze ans, les prêtres tinrent conseil et dirent : « Voici, Marie est dans le Temple du Seigneur depuis douze ans. Que devons-nous faire d’elle pour qu’elle ne souille pas le sanctuaire du Seigneur notre Dieu ? » Ils dirent au grand prêtre : « Toi qui te tiens devant l’autel du Seigneur, entre et prie à son sujet. Ce que le Seigneur Dieu te révélera, nous le ferons. »


    (3) Le grand prêtre entra dans le Saint des saints, prenant le vêtement aux douze clochettes, et pria au sujet de Marie. Et voici qu’un ange du Seigneur se tint près de lui et dit : « Zacharie, Zacharie, sors et rassemble les veufs du peuple ; que chacun apporte un bâton. Celui que le Seigneur Dieu désignera par un signe, Marie deviendra sa femme. »


    Les hérauts parcoururent toute la région qui entourait la Judée et firent retentir la trompette du Seigneur. Et voici que tous les hommes accoururent.'
  revised_footnotes: []
  revision_rationale: 'La révision retire une interprétation non garantie du geste relatif au vêtement et supprime le dédoublement narratif qui en résultait. Elle conserve les formulations potentiellement sensibles du récit — souillure rituelle, nourriture angélique et mariage annoncé — sans leur ajouter d’explication doctrinale. Aucune note n’est nécessaire : « prenant le vêtement » préserve directement l’ambiguïté disponible dans le témoin anglais.'
