base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: fr
  text: '(1) Ses parents redescendirent, émerveillés, louant et glorifiant le Seigneur Dieu parce que l’enfant ne s’était pas retournée. Marie demeurait dans le Temple du Seigneur. Elle y était nourrie comme une colombe et recevait sa nourriture de la main d’un ange.


    (2) Lorsqu’elle eut douze ans, les prêtres tinrent conseil et dirent : « Voici, Marie est dans le Temple du Seigneur depuis douze ans. Que devons-nous faire d’elle pour qu’elle ne souille pas le sanctuaire du Seigneur notre Dieu ? » Ils dirent au grand prêtre : « Toi qui te tiens devant l’autel du Seigneur, entre et prie à son sujet. Ce que le Seigneur Dieu te révélera, nous le ferons. »


    (3) Le grand prêtre entra, revêtu du vêtement aux douze clochettes,[a] pénétra dans le Saint des saints et pria au sujet de Marie. Et voici qu’un ange du Seigneur se tint près de lui et dit : « Zacharie, Zacharie, sors et rassemble les veufs du peuple ; que chacun apporte un bâton. Celui que le Seigneur Dieu désignera par un signe, Marie deviendra sa femme. »[b]


    Les hérauts parcoururent toute la région autour de la Judée et firent retentir la trompette du Seigneur. Et voici que tous les hommes accoururent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation peut aussi se comprendre : « prenant le vêtement aux douze clochettes ». Le témoin fourni ne permet pas de déterminer avec certitude s’il le prit en main ou s’il le revêtit.'
    reason: Signaler une ambiguïté concrète du geste, en attendant une vérification directe du grec.
  - marker: b
    text: 'Littéralement selon le témoin fourni : « elle sera sa femme ». Certains contextes anciens peuvent associer cette union à une garde protectrice, mais le texte présenté ici emploie le langage du mariage.'
    reason: Préserver la tension entre la formulation matrimoniale explicite et les interprétations protectrices ultérieures sans imposer celles-ci au texte.
lexical_decisions:
- source_word: went down
  choice: redescendirent
  rationale: Conserve le mouvement géographique ou narratif exprimé par le témoin, sans préciser une destination absente.
- source_word: Temple / sanctuary / Holy of Holies
  choice: Temple / sanctuaire / Saint des saints
  rationale: Maintient les distinctions spatiales du récit dans un français biblique courant et intelligible.
- source_word: was nurtured / received food
  choice: était nourrie / recevait sa nourriture
  rationale: Rend distinctement les deux formulations parallèles sans leur attribuer un sens mystique supplémentaire.
- source_word: chief priest
  choice: grand prêtre
  rationale: Équivalent français établi pour le responsable sacerdotal principal.
- source_word: widowers
  choice: veufs
  rationale: Préserve la précision du témoin selon laquelle les hommes convoqués ont perdu leur épouse, plutôt que de généraliser en « hommes non mariés ».
- source_word: staff
  choice: bâton
  rationale: Terme naturel et suffisamment large, sans anticiper la nature exacte de l’objet ou du signe.
- source_word: heralds
  choice: hérauts
  rationale: Conserve la fonction officielle de proclamation publique.
- source_word: Look!
  choice: Voici / Et voici que
  rationale: Reproduit l’effet d’attention narratif dans un registre biblique encore naturel en français moderne.
theological_decisions:
- issue: Risque de souillure du sanctuaire lorsque Marie atteint douze ans
  choice: « pour qu’elle ne souille pas le sanctuaire »
  alternative: « pour qu’elle ne rende pas impur le sanctuaire »
  rationale: La formulation conserve sans l’expliquer la logique de pureté rituelle du récit ; elle n’affirme ni la culpabilité morale de Marie ni la validité doctrinale de cette crainte.
- issue: Statut matrimonial annoncé par l’ange
  choice: « Marie deviendra sa femme »
  alternative: « elle sera confiée à cet homme »
  rationale: Suit explicitement le témoin fourni, qui parle d’épouse, sans remplacer cette relation par une tutelle issue d’une harmonisation interprétative.
- issue: Nourriture donnée par un ange
  choice: affirmation directe conservée
  alternative: lecture symbolique ou visionnaire
  rationale: Le récit présente l’événement comme un fait ; la traduction n’en impose aucune interprétation supplémentaire.
- issue: Désignation divine par un signe
  choice: « Celui que le Seigneur Dieu désignera par un signe »
  alternative: « celui à qui le Seigneur donnera un signe »
  rationale: Préserve l’ambiguïté quant à la forme précise et au bénéficiaire immédiat du signe.
translation_notes:
  register: 'Français international moderne, digne et narratif, avec un léger relief biblique (« voici », « Saint des saints »). Le chapitre reste provisoire : il est traduit à partir du témoin anglais public fourni, la vérification directe de la tradition manuscrite grecque étant encore en attente.'
