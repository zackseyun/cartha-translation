review_pass:
  verdict: revise
  source_fidelity: La formulation finale doit conserver l’interdiction de divulguer les merveilles avant l’arrivée de l’enfant à Jérusalem. Le grec traditionnellement attesté pour ce passage porte une négation; le rendu affirmatif du témoin anglais fourni (« report ») ne doit donc pas être suivi. Les référents de « elle » et la désignation « la sage-femme » restent volontairement non résolus.
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « l’installa » est plus idiomatique que « la plaça en position », sans expliciter la nature de l’examen. La phrase finale gagne en clarté avec une construction directe de l’interdiction.
  terminology: « Dieu vivant », « le Seigneur », « ange du Seigneur », « salut » et « merveilles » sont justes et cohérents. « Se prosterner en adoration » évite de préciser l’objet de l’adoration.
  issues:
  - severity: high
    issue: Le v. 4 traduit l’ordre angélique comme une injonction de raconter les merveilles jusqu’à l’entrée de l’enfant à Jérusalem.
    rationale: 'La tradition grecque de ce passage contient une négation : Salomé reçoit l’ordre de ne pas raconter ce qu’elle a vu avant l’arrivée de l’enfant à Jérusalem. La note actuelle signale utilement le problème, mais une note ne peut pas compenser un texte principal qui inverse l’injonction.'
  - severity: low
    issue: « la plaça en position » est peu idiomatique en français moderne.
    rationale: « L’installa » rend naturellement l’action préparatoire sans ajouter une précision médicale ou sexuelle absente de la formulation de base.
  revised_text: '(1) Elle entra, l’installa, et Salomé examina son état. Alors Salomé s’écria : « J’ai mis à l’épreuve le Dieu vivant et, voyez ! ma main est en feu et se détache de moi ! »


    (2) Elle pria le Seigneur, et la sage-femme fut guérie à cette heure même.


    (3) Et voici qu’un ange du Seigneur se tint devant Salomé et lui dit : « Ta prière a été entendue devant le Seigneur Dieu. Va toucher l’enfant, et tu recevras le salut. »


    (4) Elle le fit, et Salomé fut guérie. Alors qu’elle se prosternait en adoration et quittait la grotte, voici qu’une voix d’ange du Seigneur dit : « Salomé, Salomé, ne raconte pas les merveilles que tu as vues avant que l’enfant n’entre à Jérusalem. »'
  revised_footnotes: []
  revision_rationale: La révision corrige l’inversion de sens au v. 4 en intégrant la négation requise par la tradition grecque, plutôt que de la reléguer dans une note. Les ambiguïtés narratives relatives aux pronoms, à Salomé et à « la sage-femme » sont maintenues. Une légère amélioration stylistique au v. 1 rend le français plus naturel sans modifier le sens.
