translation:
  language: fr
  text: '(1) Elle entra, la plaça en position, et Salomé examina son état. Alors Salomé s’écria : « J’ai mis à l’épreuve le Dieu vivant et, voyez ! ma main est en feu et se détache de moi ! »


    (2) Elle pria le Seigneur, et la sage-femme fut guérie à cette heure même.


    (3) Et voici qu’un ange du Seigneur se tint devant Salomé et lui dit : « Ta prière a été entendue devant le Seigneur Dieu. Va toucher l’enfant, et tu recevras le salut. »


    (4) Elle le fit, et Salomé fut guérie. Tandis qu’elle se prosternait en adoration et quittait la grotte, voici qu’une voix, celle d’un ange du Seigneur, dit : « Salomé, Salomé, raconte les merveilles que tu as vues jusqu’à ce que l’enfant entre à Jérusalem. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition peut aussi se comprendre : « ne raconte pas les merveilles que tu as vues avant que l’enfant n’entre à Jérusalem ». Le témoin anglais fourni permet difficilement de trancher sans révision directe du grec.'
    reason: Signaler l’ambiguïté de portée temporelle et l’état provisoire du travail fondé sur un témoin anglais, la vérification du grec étant encore attendue.
lexical_decisions:
- source_word: examined her condition
  choice: examina son état
  rationale: Expression sobre qui conserve la nature implicite et délicate de l’examen sans ajouter de précision absente du témoin fourni.
- source_word: I’ve tested the living God
  choice: J’ai mis à l’épreuve le Dieu vivant
  rationale: « Mettre à l’épreuve » restitue l’idée d’un test présomptueux visant la réalité de l’action divine, tandis que « Dieu vivant » garde la formule théologique.
- source_word: on fire and falling away from me
  choice: est en feu et se détache de moi
  rationale: Rendu concret qui préserve les deux images fortes du témoin, sans décider s’il s’agit d’une brûlure, d’un dessèchement ou d’une mutilation.
- source_word: in that hour
  choice: à cette heure même
  rationale: Tour français naturel conservant l’idée d’une guérison immédiate.
- source_word: stood towards Salome
  choice: se tint devant Salomé
  rationale: Formulation française idiomatique exprimant la présence orientée vers elle, sans surinterpréter la posture.
- source_word: receive salvation
  choice: recevras le salut
  rationale: Conserve la portée théologique et l’éventuelle dimension de délivrance ou de guérison sans la réduire à l’une d’elles.
- source_word: worshipped
  choice: se prosternait en adoration
  rationale: Rend à la fois le geste probable de prosternation et sa valeur cultuelle, tout en restant naturel en français.
- source_word: wonderful things
  choice: les merveilles
  rationale: Terme biblique courant qui désigne des actes extraordinaires suscitant l’émerveillement.
theological_decisions:
- issue: Rapport entre le salut promis et la guérison de Salomé
  choice: Conserver « salut » au verset 3 puis « guérie » au verset 4.
  alternative: Traduire les deux expressions par « guérison » ou « délivrance ».
  rationale: Le témoin distingue la promesse de salut de son accomplissement décrit comme guérison; cette tension ne doit pas être nivelée.
- issue: Identité de « la sage-femme » au verset 2
  choice: Maintenir le groupe nominal « la sage-femme » au lieu de le remplacer par « Salomé ».
  alternative: Identifier explicitement la sage-femme à Salomé.
  rationale: Le témoin fourni alterne entre Salomé et « la sage-femme »; la traduction préserve cette ambiguïté narrative.
- issue: Objet de l’adoration au verset 4
  choice: Ne pas préciser à qui Salomé rend adoration.
  alternative: Ajouter qu’elle adore Dieu ou l’enfant.
  rationale: Le témoin ne donne pas explicitement l’objet du geste; le préciser importerait une interprétation.
translation_notes:
  register: Français international moderne, digne et narratif, avec des tournures bibliques accessibles (« voici », « Dieu vivant », « ange du Seigneur »). Le texte reste provisoire puisque la révision directe de la tradition manuscrite grecque est indiquée comme pendante. Les référents pronominaux et la distinction incertaine entre Salomé et la sage-femme ont été conservés autant que le permet un français intelligible.
