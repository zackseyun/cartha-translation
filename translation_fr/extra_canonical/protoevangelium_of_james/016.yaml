    (3) Le prêtre dit : « Si le Seigneur Dieu ne vous a pas révélé votre péché, moi non plus, je ne vous juge pas. » Puis il les laissa partir.


    Joseph prit Marie et alla chez lui, dans la joie, en glorifiant le Dieu d’Israël.'
