translation:
  language: fr
  text: '(1) Le prêtre dit : « Rends la vierge que tu as prise du Temple du Seigneur. »


    Joseph fondit en larmes.


    Alors le grand prêtre dit : « Je vais te faire boire l’eau de la réprimande du Seigneur[a], et elle fera apparaître ton péché sous tes yeux[b]. »


    (2) Le prêtre prit l’eau, la donna à Joseph et l’envoya dans le désert. Joseph revint sain et sauf.


    Il la donna aussi à Marie et l’envoya dans le désert. Elle revint saine et sauve.


    Tout le peuple fut stupéfait que leur péché n’ait pas été révélé.


    (3) Le prêtre dit : « Si le Seigneur Dieu ne vous a pas révélé votre péché, moi non plus, je ne vous condamne pas. » Puis il les relâcha.


    Joseph prit Marie et retourna chez lui, dans la joie, en glorifiant le Dieu d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’eau de l’épreuve imposée par le Seigneur ». Le sens exact de l’expression devra être confirmé par un examen direct du grec.'
    reason: Le dossier indique que la révision à partir de la tradition manuscrite grecque est encore en attente.
  - marker: b
    text: 'Littéralement, selon le témoin anglais fourni : « elle révélera ton péché à tes yeux » ; le sens paraît être que la faute deviendra manifeste.'
    reason: La tournure est inhabituelle et doit rester visible sans devenir incompréhensible.
lexical_decisions:
- source_word: virgin
  choice: la vierge
  rationale: Conserve le titre descriptif du témoin, qui souligne le statut de Marie dans le récit sans ajouter d’interprétation.
- source_word: water of the Lord’s rebuke
  choice: l’eau de la réprimande du Seigneur
  rationale: Rendu volontairement formel d’une expression probablement rituelle, en attendant la vérification directe du grec.
- source_word: wilderness
  choice: le désert
  rationale: Équivalent biblique français naturel, pouvant désigner une région inhabitée plutôt qu’un désert de sable.
- source_word: unharmed
  choice: sain et sauf / saine et sauve
  rationale: Exprime clairement le retour sans dommage après l’épreuve, avec accord selon la personne.
- source_word: set them free
  choice: les relâcha
  rationale: Rend l’issue judiciaire ou disciplinaire de la scène sans surcharger le texte.
theological_decisions:
- issue: Le singulier « leur péché » après l’épreuve des deux personnes
  choice: Conserver « leur péché » au singulier
  alternative: « leurs péchés » ou « aucun péché de leur part »
  rationale: Le singulier préserve la tension du témoin, qui semble viser une faute commune présumée.
- issue: La formule de non-jugement du prêtre
  choice: « moi non plus, je ne vous condamne pas »
  alternative: « moi non plus, je ne vous juge pas »
  rationale: Dans ce contexte d’épreuve et de libération, « condamner » communique naturellement la portée judiciaire, tout en évitant d’affirmer une absolution théologique.
- issue: Nature de l’eau rituelle
  choice: Ne pas identifier explicitement le rite à une institution biblique précise
  alternative: L’appeler « eau de l’épreuve » ou l’associer explicitement à Nombres 5
  rationale: Le passage évoque une procédure d’épreuve, mais le témoin fourni ne justifie pas une identification confessionnelle ou historique plus précise.
translation_notes:
  register: Français international moderne, digne et narratif. Les enchaînements répétitifs du récit ancien sont partiellement conservés, mais la syntaxe est rendue naturelle. Draft provisoire fondé sur le témoin anglais public fourni ; une collation directe du grec demeure nécessaire.
