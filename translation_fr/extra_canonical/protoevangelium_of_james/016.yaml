review_pass:
  verdict: revise
  source_fidelity: 'Le texte suit fidèlement le témoin anglais fourni, sous réserve explicite qu’une vérification de la tradition grecque reste nécessaire. Deux glissements méritent correction : « condamne » interprète plus fortement que « judge », et « retourna chez lui » ajoute l’idée d’un retour, absente du témoin (« went to his house »).'
  naturalness: Le français est globalement clair, digne et naturel. « Joseph fondit en larmes » est idiomatique mais plus expressif que « was tearful » ; « Joseph était en larmes » restitue plus sobrement l’énoncé. La formule « révéler votre péché à vous » conserve la répétition inhabituelle du témoin sans être incompréhensible.
  terminology: « vierge », « Temple du Seigneur », « désert », « saine et sauve » et « Dieu d’Israël » conviennent. « L’eau de la réprimande du Seigneur » demeure une restitution prudente de l’expression rituelle provisoire. « Je ne vous juge pas » doit être préféré à « je ne vous condamne pas », afin de ne pas restreindre ou intensifier le verbe source.
  issues:
  - severity: medium
    issue: « moi non plus, je ne vous condamne pas »
    rationale: Le témoin dit « neither do I judge you ». « Condamner » implique plus spécifiquement une déclaration de culpabilité ; « juger » conserve la portée et l’ambiguïté du source.
  - severity: medium
    issue: « Joseph prit Marie et retourna chez lui »
    rationale: « Retourna » ajoute que Joseph revenait chez lui. Le témoin dit seulement qu’il alla à sa maison ; il faut éviter cette information supplémentaire.
  - severity: low
    issue: « Joseph fondit en larmes »
    rationale: Cette expression évoque un débordement émotionnel plus marqué que « Joseph was tearful ». Une formulation plus neutre maintient mieux le degré d’expression du témoin.
  - severity: low
    issue: 'Note a : paraphrase alternative « l’eau de l’épreuve imposée par le Seigneur »'
    rationale: Cette alternative interprète l’expression et risque de présenter comme équivalent un sens qui n’est pas établi sur la seule base du témoin anglais. La note peut signaler l’incertitude grecque sans proposer cette paraphrase.
