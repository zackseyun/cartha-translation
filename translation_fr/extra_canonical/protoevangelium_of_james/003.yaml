translation:
  language: fr
  text: '(1) Anne leva les yeux avec attention vers le ciel et aperçut un nid de moineaux dans le laurier. Alors elle se lamenta en elle-même :


    « Malheur à moi ! Qui m’a mise au monde ? Quel ventre m’a portée ? Je suis née comme une malédiction devant le peuple d’Israël, et l’on m’a méprisée. On s’est moqué de moi et l’on m’a chassée du Temple du Seigneur, mon Dieu.


    (2) « Malheur à moi ! À quoi puis-je me comparer ? Je ne suis pas semblable aux oiseaux du ciel, car même les oiseaux du ciel sont féconds devant toi, Seigneur.


    « Malheur à moi ! À quoi puis-je me comparer ? Je ne suis pas semblable aux animaux, car même les animaux sont féconds devant toi, Seigneur.


    « Malheur à moi ! À quoi puis-je me comparer ? Je ne suis pas semblable aux bêtes sauvages de la terre, car même les bêtes sauvages de la terre sont fécondes devant toi, Seigneur.


    (3) « Malheur à moi ! À quoi puis-je me comparer ? Je ne suis pas semblable à ces eaux, car même ces eaux sont calmes et pourtant agitées, et leurs poissons te bénissent, Seigneur.


    « Malheur à moi ! À quoi puis-je me comparer ? Je ne suis pas semblable à cette terre, car la terre produit ses fruits au temps voulu et te bénit, Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Anna
  choice: Anne
  rationale: La forme française traditionnelle et immédiatement reconnaissable du nom est retenue.
- source_word: looked intently toward heaven
  choice: leva les yeux avec attention vers le ciel
  rationale: Cette formulation naturelle conserve à la fois l’orientation du regard et son caractère soutenu.
- source_word: laurel tree
  choice: laurier
  rationale: « Laurier » est le nom français courant de l’arbre ou arbuste désigné par le témoin.
- source_word: Woe is me!
  choice: Malheur à moi !
  rationale: Formule de lamentation solennelle, claire en français moderne et adaptée au registre ancien du récit.
- source_word: What womb bore me?
  choice: Quel ventre m’a portée ?
  rationale: « Ventre » garde l’image corporelle et maternelle sans introduire le registre médical de « utérus ».
- source_word: fruitful
  choice: féconds / fécondes
  rationale: Le terme maintient le thème central de la fécondité biologique qui motive la lamentation d’Anne.
- source_word: animals / wild beasts
  choice: animaux / bêtes sauvages
  rationale: La distinction du témoin est préservée sans préciser davantage la première catégorie tant que la vérification directe du grec reste à faire.
- source_word: serene yet churn
  choice: calmes et pourtant agitées
  rationale: Le paradoxe du témoin est conservé plutôt que résolu; « pourtant » rend explicitement la tension entre les deux états.
- source_word: at the proper time
  choice: au temps voulu
  rationale: Expression idiomatique qui conserve l’idée d’un moment approprié sans préciser qui le détermine.
theological_decisions:
- issue: La naissance d’Anne décrite comme une malédiction
  choice: « Je suis née comme une malédiction devant le peuple d’Israël »
  alternative: « Je suis née sous la malédiction du peuple d’Israël »
  rationale: Le texte est maintenu comme parole de détresse prononcée par Anne. La traduction n’en fait ni un jugement divin objectif ni une malédiction explicitement infligée par le peuple.
- issue: La fécondité des créatures « devant » le Seigneur
  choice: « devant toi, Seigneur »
  alternative: « sous ton regard, Seigneur »
  rationale: La formulation directe préserve la relation cultuelle et l’éventuelle nuance de comparution devant Dieu, sans la réduire à la seule idée de visibilité.
- issue: Les poissons et la terre qui bénissent Dieu
  choice: 'Conservation de la personnification : « te bénissent » et « te bénit »'
  alternative: « proclament ta bénédiction »
  rationale: Le langage poétique de la création qui bénit Dieu est maintenu sans l’expliquer ni le transformer en proposition doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible, avec conservation des répétitions qui structurent la lamentation. Le présent projet repose sur le témoin anglais public fourni; la confrontation directe avec la tradition manuscrite grecque étant encore en attente, les choix susceptibles de dépendre du grec — notamment la distinction entre les catégories animales et le paradoxe concernant les eaux — demeurent provisoires.
