  source_fidelity: 'La traduction suit fidèlement le témoin fourni : le regard vers le ciel, le nid de moineaux dans le laurier, l’auto-lamentation, l’exclusion du Temple, les comparaisons répétées et le motif de la fécondité sont tous conservés. « Devant toi » rend sobrement l’ambiguïté relationnelle de « before you ». Le paradoxe des eaux est maintenu sans tentative d’harmonisation. La révision directe du grec restant signalée comme pendante, aucune précision philologique non garantie n’est introduite.'
