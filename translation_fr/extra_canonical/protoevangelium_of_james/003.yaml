  terminology: « Anne », « Seigneur », « Temple », « peuple d’Israël », « féconds/fécondes », « bêtes sauvages » et « au temps voulu » sont cohérents avec l’usage français moderne et le registre du texte. La distinction entre « animaux » et « bêtes sauvages » est préservée. La personnification des eaux, des poissons et de la terre est correctement maintenue.
