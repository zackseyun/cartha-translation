translation:
  language: fr
  text: '(1) Dans les annales des douze tribus d’Israël, Joachim était un homme très riche. Il doublait les dons qu’il offrait au Seigneur, en se disant : « L’un, pris sur mon superflu, est pour tout le peuple ; l’autre est pour le Seigneur Dieu, afin d’obtenir le pardon et de faire l’expiation pour moi. »


    (2) Or, le grand jour du Seigneur approchait, et les Israélites présentaient leurs dons. Mais Reubel se plaça devant Joachim et lui dit : « Tu n’as pas le droit de présenter tes dons le premier, puisque tu n’as pas engendré de descendant en Israël. »


    (3) Joachim en fut profondément affligé. Il consulta les annales des douze tribus du peuple, en se disant : « Je vais examiner les annales des douze tribus d’Israël pour voir si je suis le seul à ne pas avoir engendré de descendant en Israël. » Il fit des recherches et constata que tous les justes d’Israël avaient eu des enfants. Il se souvint aussi que, dans les derniers jours du patriarche Abraham, le Seigneur Dieu lui avait donné un fils, Isaac.[a]


    (4) Joachim en fut profondément affligé. Il ne retourna pas auprès de sa femme, mais se retira au désert et y dressa sa tente. Il jeûna quarante jours et quarante nuits, en se disant : « Je ne redescendrai ni pour manger ni pour boire, jusqu’à ce que le Seigneur mon Dieu porte son regard sur moi. Ma prière sera ma nourriture et ma boisson. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dans les derniers jours du patriarche Abraham » signifie ici qu’Isaac lui fut donné dans sa vieillesse.
    reason: Évite que « derniers jours » soit compris comme une référence eschatologique, sans modifier le corps du texte.
lexical_decisions:
- source_word: histories / (history) (Greek review pending)
  choice: annales
  rationale: « Annales » rend naturellement l’idée d’archives ou de récits généalogiques des tribus sans imposer le sens moderne et abstrait d’« histoire ». La répétition maintient le lien entre les versets 1 et 3.
- source_word: doubled the gifts
  choice: doublait les dons
  rationale: Conserve l’idée d’une offrande en deux parts, explicitée par la parole de Joachim.
- source_word: for forgiveness, to atone for me
  choice: afin d’obtenir le pardon et de faire l’expiation pour moi
  rationale: Préserve les deux notions, pardon et expiation, sans les fondre ni préciser davantage leur rapport rituel.
- source_word: had a child / raised children
  choice: engendré de descendant / avaient eu des enfants
  rationale: Le premier choix exprime l’absence de descendance en Israël sans suggérer seulement l’éducation d’un enfant ; le second donne un français naturel tout en gardant le sens familial général.
- source_word: considers me
  choice: porte son regard sur moi
  rationale: Formulation française digne qui conserve l’idée d’une attention favorable de Dieu sans affirmer explicitement qu’il a déjà exaucé Joachim.
- source_word: gave himself to the wilderness
  choice: se retira au désert
  rationale: Équivalent idiomatique actuel pour un retrait volontaire et prolongé dans le désert.
theological_decisions:
- issue: Nature de la seconde offrande de Joachim
  choice: « afin d’obtenir le pardon et de faire l’expiation pour moi »
  alternative: « en vue de ma propitiation »
  rationale: La formulation choisie reste intelligible et conserve la tension entre pardon et expiation, sans importer une théorie confessionnelle précise de l’expiation.
- issue: Motif du refus opposé à Joachim
  choice: « puisque tu n’as pas engendré de descendant en Israël »
  alternative: « parce que tu n’as pas suscité de descendance en Israël »
  rationale: Le texte rapporte le jugement de Reubel sans l’approuver ni l’atténuer ; « engendré » reste direct et compréhensible.
- issue: Attente de l’intervention divine
  choice: « jusqu’à ce que le Seigneur mon Dieu porte son regard sur moi »
  alternative: « jusqu’à ce que le Seigneur mon Dieu me visite »
  rationale: « Porter son regard » évite que le lecteur moderne comprenne nécessairement une apparition physique, tout en maintenant l’attente d’une attention divine favorable.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure accessible, avec quelques termes bibliques usuels (« Seigneur », « expiation », « justes », « jeûna »). Le projet fourni signale qu’une vérification directe du grec reste à faire ; les décisions sont donc fondées sur le témoin anglais public fourni, en préservant notamment l’incertitude entourant « histories » par le terme contextuel « annales ».
