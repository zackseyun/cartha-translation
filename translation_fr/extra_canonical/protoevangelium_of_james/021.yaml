base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: fr
  text: '(1) Voici que Joseph se préparait à partir pour la Judée lorsqu’une grande agitation se produisit à Bethléem de Judée. En effet, des mages arrivèrent et demandèrent : « Où est le roi des Juifs ? Car nous avons vu son étoile en Orient[a] et nous sommes venus nous prosterner devant lui[b]. »


    (2) Quand Hérode l’apprit, il fut troublé. Il envoya des agents auprès des mages, puis fit venir les grands prêtres et les interrogea dans son palais : « Qu’est-il écrit au sujet du Christ ? Où doit-il naître ? »


    Ils lui répondirent : « À Bethléem de Judée, car c’est ce qui est écrit. » Alors il les laissa partir — les grands prêtres.


    Puis il interrogea les mages : « Quel signe avez-vous vu au sujet de celui qui est né roi ? »


    Les mages répondirent : « Nous avons vu une étoile immense briller parmi les autres étoiles et les obscurcir à tel point qu’on ne les voyait même plus. Nous avons ainsi compris qu’un roi était né pour Israël, et nous sommes venus nous prosterner devant lui[b]. »


    Hérode leur dit : « Allez, cherchez-le. Si vous le trouvez, faites-le-moi savoir, afin que moi aussi j’aille me prosterner devant lui[b]. »


    (3) Les mages partirent et voici que l’étoile qu’ils avaient vue en Orient[a] les guida jusqu’à la grotte, puis s’arrêta au-dessus de l’entrée[c]. Quand ils virent l’enfant avec Marie, sa mère, les mages sortirent de leurs sacs des présents : de l’or, de l’encens et de la myrrhe.


    Avertis par l’ange de ne pas se rendre en Judée[d], ils regagnèrent leur pays par un autre chemin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à son lever ». Le témoin anglais porte « en Orient »; une vérification directe du grec reste nécessaire.'
    reason: Préserver l’ambiguïté connue de l’expression orientale tout en signalant le caractère provisoire de la base.
  - marker: b
    text: 'Ou : « l’adorer ». L’expression peut désigner un hommage rendu à un roi ou une adoration.'
    reason: Conserver l’ambivalence théologique du geste.
  - marker: c
    text: 'Littéralement, d’après le témoin fourni : « au-dessus de la tête de la grotte ».'
    reason: Documenter l’image inhabituelle derrière la formulation française naturelle.
  - marker: d
    text: Le texte porte « en Judée », formulation difficile ici; certains lecteurs pourraient attendre « auprès d’Hérode », comme dans Matthieu 2.12.
    reason: Ne pas corriger silencieusement une lecture difficile ni harmoniser le récit.
lexical_decisions:
- source_word: magi
  choice: mages
  rationale: Le terme français traditionnel « mages » conserve la catégorie ancienne sans les réduire à des rois ni à de simples magiciens.
- source_word: worship
  choice: se prosterner devant
  rationale: Cette formulation préserve l’ambivalence du geste d’hommage ou d’adoration et convient au contexte royal sans imposer une interprétation théologique unique.
- source_word: Christ
  choice: Christ
  rationale: Le titre est maintenu, conformément au témoin, plutôt que paraphrasé par « Messie ».
- source_word: frankincense
  choice: encens
  rationale: « Encens » est le terme français courant et naturel pour cette substance aromatique offerte.
- source_word: cave
  choice: grotte
  rationale: Rend directement le lieu indiqué par le récit et maintient sa différence avec la maison du récit matthéen.
theological_decisions:
- issue: Nature de l’hommage rendu à l’enfant
  choice: « se prosterner devant lui »
  alternative: « l’adorer »
  rationale: Le verbe correspondant peut désigner aussi bien un hommage royal qu’une adoration religieuse. La traduction choisie conserve cette tension.
- issue: Destination interdite après l’avertissement angélique
  choice: « ne pas se rendre en Judée »
  alternative: « ne pas retourner auprès d’Hérode »
  rationale: Le témoin fourni dit explicitement « Judea ». Cette lecture difficile est conservée plutôt que harmonisée avec Matthieu 2.12.
- issue: Celui que les mages voient avec Marie
  choice: « l’enfant »
  alternative: « lui »
  rationale: Le référent masculin est rendu explicitement pour un français naturel, sans ajouter de nom ni de qualification christologique.
- issue: Position de l’étoile par rapport à la grotte
  choice: « au-dessus de l’entrée »
  alternative: « au-dessus de la tête de la grotte »
  rationale: L’expression littérale est peu idiomatique en français et semble désigner la partie haute ou l’entrée de la grotte; une note signale la formulation du témoin.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes (« voici », « mages », « Judée ») sont largement conservées. Le draft demeure provisoire, car les données fournies reposent sur un témoin anglais du texte grec et indiquent qu’une révision directe de la tradition manuscrite grecque reste à effectuer.
