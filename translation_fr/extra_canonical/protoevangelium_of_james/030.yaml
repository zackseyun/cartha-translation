  naturalness: Le français est globalement fluide et d’un registre narratif approprié. « Tirèrent de leurs sacs » est plus idiomatique que « sortirent de leurs sacs » pour exprimer qu’ils en retirent des présents.
  terminology: « Mages », « se prosterner devant lui », « agents », « grotte », « encens » et « myrrhe » sont appropriés. « Se prosterner devant » préserve utilement l’ambiguïté entre hommage et adoration.
  issues:
