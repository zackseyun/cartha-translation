    issue: La double formulation de l’envoi en 21.2 est atténuée.
    rationale: Le témoin dit qu’Hérode envoya des agents et fit envoyer/venir les mages. « Envoya des agents chercher les mages » communique le résultat, mais ne conserve pas aussi nettement les deux verbes. « Il envoya des agents et fit venir les mages » est naturel et plus proche.
  - severity: low
    issue: Expression des présents tirés des sacs.
    rationale: « Sortirent de leurs sacs des présents » reste compréhensible, mais « tirèrent de leurs sacs des présents » est plus naturel en français moderne tout en conservant l’image des sacs.
