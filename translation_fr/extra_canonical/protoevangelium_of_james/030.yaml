base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: fr
  text: '(1) Et voici : Joseph se préparait à partir pour la Judée lorsqu’une grande agitation se produisit à Bethléem de Judée. En effet, des mages arrivèrent et demandèrent : « Où est le roi des Juifs ? Car nous avons vu son étoile en Orient et nous sommes venus nous prosterner devant lui. »


    (2) Quand Hérode l’apprit, il fut troublé. Il envoya des agents et fit venir les mages, qui lui parlèrent de l’étoile.


    (3) Et voici : ils virent des étoiles en Orient. Celles-ci guidèrent les mages jusqu’à la grotte, puis l’étoile s’arrêta au-dessus de la tête de l’enfant. Quand les mages le virent avec Marie, sa mère, ils tirèrent de leurs sacs des présents : de l’or, de l’encens et de la myrrhe.


    Avertis par l’ange, ils regagnèrent leur pays par un autre chemin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magi
  choice: mages
  rationale: « Mages » conserve la désignation traditionnelle et l’identité volontairement peu précisée de ces visiteurs, sans les transformer en rois.
- source_word: worship
  choice: se prosterner devant
  rationale: Cette formulation garde le geste concret de révérence et évite de trancher inutilement entre hommage royal et adoration cultuelle.
- source_word: officers
  choice: agents
  rationale: Terme administratif assez large pour ne pas préciser sans preuve la fonction exacte des hommes envoyés par Hérode.
- source_word: cave
  choice: grotte
  rationale: Rend directement le lieu indiqué par ce récit, sans l’harmoniser avec d’autres traditions de la naissance.
- source_word: frankincense
  choice: encens
  rationale: Équivalent français courant et exact dans cette liste de présents.
- source_word: stood over
  choice: s’arrêta au-dessus de
  rationale: Exprime naturellement en français l’immobilisation de l’étoile à la verticale de l’enfant.
theological_decisions:
- issue: Sens de l’hommage rendu à l’enfant
  choice: « se prosterner devant lui »
  alternative: « l’adorer »
  rationale: Le choix préserve la portée possible d’un hommage royal ou religieux sans imposer une interprétation théologique unique.
- issue: Passage du pluriel « étoiles » au singulier « étoile »
  choice: Maintien du pluriel, puis du singulier
  alternative: Uniformiser tout le passage au singulier
  rationale: La variation du témoin fourni est conservée, puisqu’elle peut refléter le texte transmis et ne doit pas être corrigée silencieusement.
- issue: Identité des mages
  choice: « mages »
  alternative: « rois mages » ou « sages »
  rationale: Le texte ne les appelle ni rois ni sages; la traduction n’ajoute donc aucun titre traditionnel.
- issue: Mode de l’avertissement angélique
  choice: « Avertis par l’ange »
  alternative: « Ayant reçu en rêve un avertissement de l’ange »
  rationale: Le témoin fourni mentionne l’ange, mais ne précise pas ici qu’il intervient dans un rêve; aucun détail n’est ajouté.
translation_notes:
  register: Français international moderne, narratif et digne. Les reprises de « Et voici » gardent la vivacité du récit. La syntaxe a été légèrement fluidifiée sans effacer les répétitions significatives ni la variation entre « étoiles » et « étoile ». Le travail demeure provisoire, car la révision directe du grec est signalée comme étant en attente.
