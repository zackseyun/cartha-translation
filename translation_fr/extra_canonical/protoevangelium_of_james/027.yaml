translation:
  language: fr
  text: (1) Il trouva là une grotte, y conduisit Marie, la confia à ses fils et partit chercher une sage-femme hébraïque dans la région de Bethléem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais du domaine public fourni; une vérification directe de la tradition manuscrite grecque reste à effectuer.
