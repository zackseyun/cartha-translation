lexical_decisions:
- source_word: cave
  choice: grotte
  rationale: « Grotte » est le terme naturel et digne en français pour le lieu trouvé par Joseph.
- source_word: her
  choice: Marie
  rationale: Le pronom féminin a été explicité par le nom de Marie pour assurer une lecture naturelle en français; l’identité ressort du contexte narratif.
- source_word: stationed his sons with her
  choice: la confia à ses fils
  rationale: Cette formulation française exprime naturellement que ses fils restent auprès d’elle et en ont la charge, sans alourdir le récit.
- source_word: Hebrew midwife
  choice: sage-femme hébraïque
  rationale: « Hébraïque » conserve la désignation ethnique du témoin anglais sans la réduire à une simple indication linguistique.
- source_word: region of Bethlehem
  choice: région de Bethléem
  rationale: Traduction directe et idiomatique de l’indication géographique.
theological_decisions:
- issue: Identité des « fils » de Joseph
  choice: ses fils
  alternative: les fils de Joseph
  rationale: Le texte ne précise ni leur mère ni la nature exacte de leur lien avec Marie; la traduction maintient cette réserve.
- issue: Identité religieuse ou ethnique de la sage-femme
  choice: sage-femme hébraïque
  alternative: sage-femme juive
  rationale: Le choix conserve au plus près le terme transmis par le témoin anglais, la vérification directe du grec restant à faire.
translation_notes:
  register: Français international moderne, narratif, clair et digne. La phrase reste concise; l’explicitation de « Marie » et la tournure « la confia à ses fils » favorisent une lecture naturelle. Le texte demeure provisoire dans l’attente d’une étude directe du grec.
