review_pass:
  verdict: revise
  source_fidelity: 'La formulation « la confia à ses fils » ne rend pas exactement « stationed his sons with her » : le sujet met ses fils auprès d’elle, plutôt qu’il ne la remet à leur garde. Le reste suit fidèlement le témoin anglais fourni, sous réserve de la vérification annoncée de la tradition grecque.'
  naturalness: « Grotte », « sage-femme hébraïque » et « dans la région de Bethléem » sont naturels dans un registre narratif moderne et sobre. « Il plaça ses fils auprès d’elle » est à la fois plus exact et idiomatique.
  terminology: « Hébraïque » préserve prudemment la désignation du témoin de travail sans la remplacer interprétativement par « juive ». « Marie » est conservé comme explicitation contextuelle non doctrinale. La note provisoire est correctement ancrée et formulée.
  issues:
  - severity: medium
    issue: « la confia à ses fils » inverse la direction sémantique de l’action.
    rationale: Le témoin dit que Joseph établit/posta ses fils avec elle. Il ne dit pas qu’il confie Marie à ses fils, même si cette conséquence pratique peut être inférée.
  revised_text: (1) Il trouva là une grotte, y conduisit Marie, plaça ses fils auprès d’elle et partit chercher une sage-femme hébraïque dans la région de Bethléem.[a]
  revised_footnotes:
  - marker: a
    text: Traduction provisoire fondée sur le témoin anglais du domaine public fourni ; une vérification directe de la tradition manuscrite grecque reste à effectuer.
    reason: Le dossier indique explicitement que l’examen direct de la langue source est encore en attente.
  revision_rationale: 'La révision remplace une formulation qui présentait Marie comme confiée aux fils de Joseph par une formulation qui conserve la structure de l’action : Joseph place ses fils auprès d’elle. Aucune interprétation concernant le statut des fils ni l’identité précise de la sage-femme n’est ajoutée.'
