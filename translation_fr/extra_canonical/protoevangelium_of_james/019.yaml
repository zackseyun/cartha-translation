translation:
  language: fr
  text: '(1) Et voici qu’une femme descendait de la montagne. Elle me dit : « Homme, où vas-tu ? »


    Je répondis : « Je cherche une sage-femme hébraïque. »


    Elle me demanda : « Es-tu d’Israël ? »


    Je lui répondis : « Oui. »


    Alors elle demanda : « Et qui est celle qui accouche dans la grotte ? »


    Je répondis : « Ma fiancée. »


    Elle me dit : « Elle n’est donc pas ta femme ? »


    Je lui répondis : « Marie a été élevée dans le Temple du Seigneur, et le sort l’a désignée pour devenir ma femme. Pourtant, elle n’est pas ma femme, mais elle a conçu du Saint-Esprit. »


    La sage-femme demanda : « Est-ce vrai ? »


    Joseph lui dit : « Viens voir. »


    Et la sage-femme l’accompagna.


    (2) Ils s’arrêtèrent devant la grotte, et une nuée lumineuse couvrit la grotte de son ombre. La sage-femme dit : « Aujourd’hui, mon âme est magnifiée, car mes yeux ont vu une merveille : le salut est né pour Israël ! »


    Aussitôt, la nuée se retira de la grotte, et une grande lumière y apparut, si bien que leurs yeux ne pouvaient la supporter. Peu après, la lumière se retira progressivement, jusqu’à ce qu’un nouveau-né apparaisse. Il s’approcha et prit le sein de Marie, sa mère.


    La sage-femme s’écria : « Quel grand jour pour moi aujourd’hui, puisque j’ai vu ce miracle nouveau ! »


    (3) La sage-femme sortit de la grotte, et Salomé vint à sa rencontre.


    Elle lui dit : « Salomé, Salomé, il faut que je te raconte ce spectacle inouï : une vierge a enfanté, ce qui est contraire à sa nature ! »


    Salomé répondit : « Aussi vrai que le Seigneur mon Dieu est vivant, si je n’examine pas son état, je ne croirai pas que la vierge a enfanté. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Hebrew midwife
  choice: sage-femme hébraïque
  rationale: « Hébraïque » conserve la désignation ethnique du témoin sans la remplacer par une formulation interprétative.
- source_word: betrothed
  choice: fiancée
  rationale: Terme français courant qui exprime l’engagement matrimonial sans faire de Marie l’épouse au sens plein, maintenant ainsi la tension explicite du récit.
- source_word: overshadowed
  choice: couvrit […] de son ombre
  rationale: Formulation biblique intelligible qui préserve l’image de la nuée lumineuse projetant ou étendant son ombre.
- source_word: my soul is magnified
  choice: mon âme est magnifiée
  rationale: Tour volontairement marqué qui conserve l’écho scripturaire et le sens passif du témoin, sans le normaliser en simple expression de joie.
- source_word: Salvation
  choice: le salut
  rationale: Maintient l’abstraction personnifiée du texte et sa portée théologique sans identifier davantage le nouveau-né par une paraphrase.
- source_word: her condition
  choice: son état
  rationale: Conserve l’euphémisme du témoin concernant l’examen corporel de Marie, sans ajouter de détails absents.
theological_decisions:
- issue: Relation matrimoniale entre Joseph et Marie
  choice: « le sort l’a désignée pour devenir ma femme. Pourtant, elle n’est pas ma femme »
  alternative: « elle m’est échue comme épouse, mais elle n’est pas mon épouse »
  rationale: La traduction maintient la tension interne entre la désignation par le sort et la négation immédiate, sans l’harmoniser avec une conception confessionnelle précise des fiançailles ou du mariage.
- issue: Origine de la conception
  choice: « elle a conçu du Saint-Esprit »
  alternative: « elle est enceinte par l’Esprit Saint »
  rationale: Cette formulation conserve la déclaration causale et le vocabulaire traditionnel tout en restant naturelle en français moderne.
- issue: Naissance du salut pour Israël
  choice: « le salut est né pour Israël »
  alternative: « un sauveur est né à Israël »
  rationale: Le texte fourni emploie l’abstrait « salut » ; il n’est pas remplacé par « sauveur », afin de préserver sa formulation théologique propre.
- issue: Naissance virginale et nature
  choice: « une vierge a enfanté, ce qui est contraire à sa nature »
  alternative: « une vierge a enfanté contre les lois de la nature »
  rationale: 'Le possessif et son ambiguïté sont conservés : l’expression peut viser la condition naturelle de la vierge plutôt qu’énoncer une doctrine générale sur les lois naturelles.'
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions, les formules bibliques et les tensions du récit sont conservées sans archaïsme excessif. Projet provisoire établi à partir du témoin anglais public fourni ; une vérification directe de la tradition manuscrite grecque reste nécessaire.
