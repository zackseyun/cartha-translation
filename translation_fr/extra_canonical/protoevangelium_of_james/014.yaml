review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. Le projet rend globalement bien le déroulement et préserve l’incertitude de Joseph quant à l’origine de l’enfant. Toutefois, « garda le silence à son sujet » risque grammaticalement de renvoyer à Joseph plutôt qu’à Marie. La mention explicite de « Marie » dans la dernière phrase ajoute un nom absent du passage, alors que le pronom est suffisamment clair en français.
  naturalness: Le registre narratif est naturel dans l’ensemble. « Il ne parla pas d’elle » évite l’ambiguïté du possessif français. « Il la protégea » est à la fois direct, idiomatique et plus proche du texte que l’explicitation « prit Marie sous sa protection ».
  terminology: « faute », « d’origine angélique », « Esprit saint », « Jésus » et « péchés » sont des choix recevables. La note sur Jésus doit seulement présenter le rapprochement étymologique sans le surdéterminer.
  issues:
  - severity: medium
    issue: Ambiguïté référentielle de « garda le silence à son sujet »
    rationale: En français, le possessif masculin « son » se rattache spontanément à Joseph, sujet masculin de la phrase, et peut donc signifier qu’il se tut au sujet de lui-même. Le sens requis est qu’il ne parla pas de Marie.
  - severity: low
    issue: Ajout du nom « Marie » dans la conclusion
    rationale: Le témoin ne donne ici qu’un pronom (« her »). L’explicitation est compréhensible dans le contexte, mais elle n’est pas nécessaire et s’écarte de la formulation source. Le pronom français « la » reste clair.
  - severity: low
    issue: Note b devenue inutile
    rationale: La note justifie une explicitation qui peut être évitée. La suppression de cette explicitation permet aussi de supprimer la note.
  revised_text: '(1) Joseph fut saisi d’une grande peur et ne parla pas d’elle, tout en réfléchissant à ce qu’il devait faire d’elle. Il se dit : « Si je cache sa faute, je serai trouvé en opposition à la loi du Seigneur. Mais si je la dénonce au peuple d’Israël, je crains que ce qui est en elle ne soit d’origine angélique ; alors je serai trouvé livrant un sang innocent à une condamnation à mort. Que vais-je donc faire d’elle ? Je la renverrai secrètement. »


    La nuit le surprit. (2) Et voici qu’un ange du Seigneur lui apparut dans un rêve et lui dit : « Ne crains pas cet enfant, car celui qui est en elle vient de l’Esprit saint. Elle mettra au monde un fils, et tu lui donneras le nom de Jésus[a], car il sauvera son peuple de ses péchés. »


    Joseph se réveilla, rendit gloire au Dieu d’Israël, qui lui avait accordé sa grâce, et il la protégea.'
  revised_footnotes:
  - marker: a
    text: « Jésus » correspond à une forme grecque d’un nom hébreu ; le récit l’associe ici au fait de sauver.
    reason: La note rend perceptible le rapprochement étymologique entre le nom et « sauver », difficile à reproduire directement en français, sans préciser indûment une forme hébraïque unique.
  revision_rationale: La révision corrige l’ambiguïté produite par le possessif français, retire l’ajout non nécessaire du nom de Marie et conserve le caractère incertain de la réflexion de Joseph. Elle maintient le sens et le registre du témoin anglais fourni, tout en signalant par une note sobre le jeu sur le nom de Jésus.
