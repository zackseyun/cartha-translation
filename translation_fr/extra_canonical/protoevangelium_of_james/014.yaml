base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: fr
  text: '(1) Joseph fut saisi d’une grande peur et garda le silence à son sujet, tout en réfléchissant à ce qu’il devait faire d’elle. Il se dit : « Si je cache sa faute, je serai trouvé en opposition à la loi du Seigneur. Mais si je la dénonce au peuple d’Israël, je crains que ce qui est en elle ne soit d’origine angélique ; alors je serai trouvé livrant un sang innocent à une condamnation à mort. Que vais-je donc faire d’elle ? Je la renverrai secrètement. »


    La nuit le surprit. (2) Et voici qu’un ange du Seigneur lui apparut dans un rêve et lui dit : « Ne crains pas cet enfant, car celui qui est en elle vient de l’Esprit saint. Elle mettra au monde un fils, et tu lui donneras le nom de Jésus[a], car il sauvera son peuple de ses péchés. »


    Joseph se réveilla, rendit gloire au Dieu d’Israël, qui lui avait accordé sa grâce, et il prit Marie sous sa protection[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Jésus » correspond à une forme du nom hébreu Yéchoua ; le récit l’associe ici au fait de sauver.
    reason: La note rend perceptible le jeu étymologique entre le nom et le verbe « sauver », difficile à reproduire directement en français.
  - marker: b
    text: 'Littéralement selon le témoin utilisé : « il la protégea ».'
    reason: La note signale que la formulation française explicite le référent de « elle » et emploie une tournure idiomatique.
lexical_decisions:
- source_word: sin
  choice: faute
  rationale: « Faute » conserve l’idée d’une transgression présumée sans renforcer indûment la culpabilité de Marie par une formulation plus dogmatique.
- source_word: might be angelic
  choice: ne soit d’origine angélique
  rationale: Cette formulation naturelle maintient l’incertitude et l’étrangeté du propos, sans décider s’il est question de l’enfant lui-même ou de son origine.
- source_word: secretly set her free from me
  choice: Je la renverrai secrètement
  rationale: « Renvoyer » exprime naturellement la rupture projetée ; le français omet le littéral et maladroit « de moi » sans transformer explicitement la relation en mariage.
- source_word: the one in her
  choice: celui qui est en elle
  rationale: Le masculin est conservé parce que la suite identifie l’enfant comme un fils ; la formulation reste proche du témoin fourni.
- source_word: protected her
  choice: il prit Marie sous sa protection
  rationale: Cette expression rend clairement l’action protectrice finale. Le nom « Marie » évite une ambiguïté pronominale en français.
theological_decisions:
- issue: Nature de ce qui est en Marie
  choice: « d’origine angélique »
  alternative: « un ange » ou « quelque chose d’angélique »
  rationale: Le texte exprime la crainte incertaine de Joseph. La traduction ne transforme donc pas cette possibilité en affirmation ontologique précise.
- issue: Origine de l’enfant
  choice: « vient de l’Esprit saint »
  alternative: « est de l’Esprit saint »
  rationale: « Vient de » exprime l’origine indiquée par le texte tout en restant idiomatique et sans développer un mécanisme doctrinal.
- issue: Grâce accordée à Joseph
  choice: « qui lui avait accordé sa grâce »
  alternative: « qui lui avait fait grâce »
  rationale: Cette option préserve le sens positif de faveur divine sans suggérer nécessairement le pardon d’une faute commise par Joseph.
- issue: Conduite finale de Joseph envers Marie
  choice: « prit Marie sous sa protection »
  alternative: « la garda »
  rationale: Le choix suit le témoin fourni (« protected her ») et n’ajoute ni mariage consommé ni détail absent du passage.
translation_notes:
  register: Français international moderne, narratif et digne. Les enchaînements répétitifs sont partiellement conservés pour respecter le style ancien, tandis que les formulations les plus raides sont rendues idiomatiques. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe de la tradition manuscrite grecque demeure nécessaire.
