  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: fr
  text: '(1) Anne, sa femme, portait le deuil et se lamentait pour deux raisons. Elle disait : « Je me lamente parce que je suis veuve et parce que je n’ai pas d’enfant. »


    (2) Or, le grand jour du Seigneur approchait. Sa servante Juthine lui dit : « Jusqu’à quand vas-tu t’humilier ainsi ? Voici que le grand jour du Seigneur est arrivé, et il ne convient pas que tu t’affliges. Prends ce bandeau que m’a donné mon employeur.[a] Il ne convient pas que je le porte, puisque je suis ta servante et qu’il porte une marque royale. »


    (3) Anne répondit : « Éloigne-toi de moi ! Je ne le prendrai pas. Le Seigneur Dieu m’a profondément humiliée. Peut-être qu’un imposteur te l’a donné et que tu es venue me faire participer à ton péché. »


    Juthine, la servante, lui répondit : « Pourquoi me maudis-tu ? Tu n’as pas écouté ma voix : le Seigneur Dieu a fermé ton ventre, pour ne pas te donner de fruit en Israël. »


    (4) Anne fut saisie d’une profonde tristesse. Elle ôta son vêtement de deuil, se lava la tête et revêtit son vêtement de noces. Vers la neuvième heure,[b] elle descendit dans son jardin pour s’y promener. Elle vit un laurier et s’assit dessous. Après s’être reposée, elle pria le Seigneur : « Dieu de mes ancêtres, bénis-moi et écoute ma prière, comme tu as béni notre mère Sara et lui as donné un fils, Isaac. »'
  philosophy: optimal-equivalence
  footnotes:
