revisions:
- from: '(1) Anne, sa femme, menait deuil et se lamentait pour deux raisons. Elle disait : « Je me lamente parce que je suis veuve et parce que je n’ai pas d’enfant. »


    (2) Or, le grand jour du Seigneur approchait. Sa servante Juthine lui dit : « Jusqu’à quand vas-tu humilier ton âme ? Vois : le grand jour du Seigneur est proche, et il ne convient pas que tu sois dans le deuil. Prends plutôt ce bandeau que m’a donné le chef de l’atelier.[a] Il ne convient pas que je le porte, puisque je suis ta servante et qu’il porte une marque royale. »


    (3) Anne répondit : « Éloigne-toi de moi ! Je ne ferai pas cela. Le Seigneur Dieu m’a profondément humiliée. Peut-être qu’un trompeur t’a donné ce bandeau et que tu es venue me faire participer à ton péché. »


    Juthine, la servante, lui répondit : « Pourquoi te maudirais-je, puisque tu n’as pas écouté ma voix ? Le Seigneur Dieu a rendu ton sein stérile, afin que tu ne portes aucun fruit en Israël. »


    (4) Anne fut saisie d’une profonde tristesse. Elle ôta son vêtement de deuil, se lava la tête et revêtit son vêtement de noces.[b] Vers la neuvième heure,[c] elle descendit dans son jardin pour s’y promener. Elle vit un laurier et s’assit dessous. Après s’être reposée, elle adressa une supplication au Seigneur : « Dieu de mes ancêtres, bénis-moi et écoute ma prière, comme tu as béni notre mère Sara et lui as donné un fils, Isaac. »'
  to: '(1) Anne, sa femme, portait le deuil et se lamentait pour deux raisons. Elle disait : « Je me lamente parce que je suis veuve et parce que je n’ai pas d’enfant. »


    (2) Or, le grand jour du Seigneur approchait. Sa servante Juthine lui dit : « Jusqu’à quand vas-tu t’humilier ainsi ? Voici que le grand jour du Seigneur est arrivé, et il ne convient pas que tu t’affliges. Prends ce bandeau que m’a donné mon employeur.[a] Il ne convient pas que je le porte, puisque je suis ta servante et qu’il porte une marque royale. »


    (3) Anne répondit : « Éloigne-toi de moi ! Je ne le prendrai pas. Le Seigneur Dieu m’a profondément humiliée. Peut-être qu’un imposteur te l’a donné et que tu es venue me faire participer à ton péché. »


    Juthine, la servante, lui répondit : « Pourquoi me maudis-tu ? Tu n’as pas écouté ma voix : le Seigneur Dieu a fermé ton ventre, pour ne pas te donner de fruit en Israël. »


    (4) Anne fut saisie d’une profonde tristesse. Elle ôta son vêtement de deuil, se lava la tête et revêtit son vêtement de noces. Vers la neuvième heure,[b] elle descendit dans son jardin pour s’y promener. Elle vit un laurier et s’assit dessous. Après s’être reposée, elle pria le Seigneur : « Dieu de mes ancêtres, bénis-moi et écoute ma prière, comme tu as béni notre mère Sara et lui as donné un fils, Isaac. »'
  rationale: La révision corrige les écarts sûrs avec le grec tout en préservant les formulations difficiles du récit, notamment l’affliction volontaire, l’attribution de la stérilité à Dieu dans les paroles rapportées, et l’image du « fruit en Israël ». Elle allège aussi quelques calques pour un français moderne naturel, sans importer d’interprétation confessionnelle.
