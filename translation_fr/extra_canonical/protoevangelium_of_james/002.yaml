    reason: Aide de compréhension pour les lecteurs modernes tout en conservant la désignation antique dans le texte.
lexical_decisions:
- source_word: Anna
  choice: Anne
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom, adaptée au registre biblique français.
- source_word: humiliate your soul
  choice: humilier ton âme
  rationale: Conserve l’expression sémitisante et sa possible évocation de l’affliction ou du jeûne, sans la réduire à une simple tristesse.
- source_word: headband
  choice: bandeau
  rationale: Terme courant et suffisamment général pour une parure portée sur la tête, l’objet grec exact restant à vérifier.
- source_word: leader of the workplace
  choice: chef de l’atelier
  rationale: Rendu naturel mais prudent de la formulation du témoin anglais; une note signale l’incertitude source.
- source_word: womb
  choice: sein
  rationale: Expression française digne et biblique qui désigne ici la capacité d’enfanter sans employer un terme clinique.
- source_word: fruit in Israel
  choice: fruit en Israël
  rationale: Maintient la métaphore de la descendance et sa portée collective, plutôt que de l’expliciter comme « enfant ».
- source_word: wedding garment
  choice: vêtement de noces
  rationale: Préserve la référence nuptiale littérale et son contraste avec le vêtement de deuil.
- source_word: ninth hour
  choice: neuvième heure
  rationale: Conserve le mode antique de calcul du temps; l’équivalent approximatif est donné en note.
- source_word: petitioned the Lord
  choice: adressa une supplication au Seigneur
  rationale: Formulation française naturelle qui conserve l’intensité et la direction religieuse de la requête.
theological_decisions:
- issue: Dieu présenté comme l’auteur de l’humiliation et de la stérilité d’Anne
  choice: Conserver explicitement « Le Seigneur Dieu m’a profondément humiliée » et « a rendu ton sein stérile »
  alternative: Atténuer en disant que Dieu a permis sa stérilité ou ne l’a pas délivrée
  rationale: Le passage place ces affirmations dans la bouche des personnages. Les atténuer résoudrait une tension théologique présente dans le témoin au lieu de la préserver.
- issue: Sens de « humilier ton âme »
  choice: Maintenir la locution littérale
  alternative: Traduire « t’affliger » ou « jeûner »
  rationale: La formule peut évoquer le deuil, l’ascèse ou le jeûne. Le contexte ne permet pas de trancher avec certitude, surtout avant la révision directe du grec.
- issue: Référence à Sara comme « notre mère »
  choice: Conserver « notre mère Sara »
  alternative: Employer simplement « Sara » ou « notre ancêtre Sara »
  rationale: La formulation exprime l’identité collective d’Israël et le parallèle théologique entre deux femmes privées d’enfant.
- issue: « Pourquoi te maudirais-je ? »
  choice: Conserver la question sans en harmoniser la logique
  alternative: Reformuler « Pourquoi m’as-tu maudite ? » ou « Quelle malédiction pourrais-je prononcer ? »
  rationale: Le lien argumentatif est difficile dans le témoin fourni. En l’absence de vérification grecque, il convient de ne pas corriger conjecturalement le dialogue.
translation_notes:
  register: Français international moderne, digne et lisible, avec une légère coloration biblique dans les prières et les expressions traditionnelles. Les répétitions et tensions du récit ont été préservées. Projet provisoire fondé sur le témoin anglais public fourni; une confrontation directe avec le grec demeure nécessaire, en particulier pour le bandeau, le « chef de l’atelier », la réplique de Juthine et le vêtement de noces.
