review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire à quelques endroits où le français suit trop étroitement le témoin anglais provisoire plutôt que le grec : ἐργοδότης désigne plus naturellement celui qui emploie Juthine (« mon employeur »), et la réplique de Juthine se comprend comme « Pourquoi me maudis-tu ? », non « Pourquoi te maudirais-je ? ». « Je ne ferai pas cela » doit aussi viser explicitement l’acceptation de l’objet : « Je ne le prendrai pas. » Le reste restitue fidèlement le deuil, l’infécondité attribuée à Dieu dans le discours des personnages, la métaphore du fruit, et la prière faisant mémoire de Sara.'
  naturalness: Le registre est globalement digne et lisible. « Menait deuil » n’est pas idiomatique en français moderne ; « portait le deuil » est naturel. « Humilier ton âme » est très calqué et peu transparent ; « t’humilier ainsi » préserve l’affliction volontaire sans surinterpréter la formule. « Tu sois dans le deuil » est moins précis que « tu t’affliges ».
  terminology: « Anne », « Juthine », « bandeau », « marque royale », « vêtement de noces », « neuvième heure », « Seigneur Dieu » et « Sara » conviennent. « Fermer ton ventre » rend de façon biblique et intelligible l’image grecque de la matrice fermée, tandis que « te donner du fruit en Israël » conserve la métaphore de la descendance et Dieu comme sujet de l’action.
  issues:
  - severity: medium
    issue: « chef de l’atelier » pour l’objet donné à Juthine
    rationale: Le grec ἐργοδότης renvoie à celui qui fournit le travail ou emploie la servante, non nécessairement au responsable d’un atelier. « Mon employeur » est plus fidèle et ne suppose pas un lieu de travail précis.
  - severity: high
    issue: Sens et direction de la question de Juthine inversés au v. 3
    rationale: 'La formulation grecque se lit naturellement comme une protestation de Juthine : « Pourquoi me maudis-tu ? » La version « Pourquoi te maudirais-je ? » inverse les personnes et rend le dialogue incohérent.'
  - severity: medium
    issue: « Je ne ferai pas cela »
    rationale: La réplique d’Anne porte sur le refus de recevoir/prendre le bandeau. Une formulation explicite évite de transformer ce refus en refus d’une action non précisée.
  - severity: low
    issue: 'Calques et collocations : « menait deuil », « humilier ton âme », « être dans le deuil »'
    rationale: Ces expressions nuisent à la fluidité du français international moderne. Les corrections proposées gardent le ton élevé et l’indétermination de l’affliction.
