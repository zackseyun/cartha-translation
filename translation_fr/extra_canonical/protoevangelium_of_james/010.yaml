    Le sort désigna Marie pour la pourpre véritable et l’écarlate. Elle les emporta chez elle. C’est à cette époque que Zacharie devint muet, et Samuel le remplaça jusqu’à ce que Zacharie puisse de nouveau parler[b]. Marie prit l’écarlate et se mit à la filer.'
