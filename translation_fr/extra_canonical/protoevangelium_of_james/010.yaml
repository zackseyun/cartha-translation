base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: fr
  text: '(1) Les prêtres tinrent conseil et dirent : « Faisons un voile pour le Temple du Seigneur. »


    Le prêtre dit : « Faites venir auprès de moi les vierges pures de la tribu de David. » Les préposés partirent à leur recherche et en trouvèrent sept. Alors le prêtre se souvint que l’enfant Marie était de la tribu de David et pure devant Dieu. Les préposés allèrent donc la chercher et l’amenèrent.


    (2) Ils les firent entrer dans le Temple du Seigneur, et le prêtre dit : « Tirez au sort devant moi pour déterminer qui filera l’or, l’amiante[a], le lin fin, la soie, le violet[b], l’écarlate et la pourpre véritable. »


    Le sort attribua à Marie la pourpre véritable et l’écarlate. Elle les emporta chez elle. C’est alors que Zacharie devint muet, et Samuel prit sa place jusqu’à ce que Zacharie puisse parler. Marie prit l’écarlate et la filait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un terme qui désigne vraisemblablement l’amiante, fibre minérale utilisée dans l’Antiquité ; il s’agit ici d’un élément de la liste des matières ou fils destinés au voile.
    reason: Corrige « blanc », qui ne rend pas le terme grec, et explique brièvement ce matériau inhabituel.
  - marker: b
    text: Le terme grec désigne une couleur de la gamme hyacinthe, bleue ou bleu-violette ; « violet » en donne une équivalence moderne approximative.
    reason: Préserve l’incertitude sur la nuance exacte sans modifier la distinction avec la pourpre véritable.
lexical_decisions:
- source_word: veil
  choice: voile
  rationale: « Voile » est le terme français naturel pour la tenture du Temple et conserve la portée cultuelle du passage.
- source_word: pure virgins
  choice: jeunes filles vierges et pures
  rationale: Cette formulation conserve les deux idées distinctes de virginité et de pureté, sans réduire l’une à l’autre.
- source_word: officers
  choice: serviteurs
  rationale: Le témoin anglais ne précise pas nettement leur fonction institutionnelle; « serviteurs » reste naturel tout en évitant le sens moderne et administratif de « officiers ».
- source_word: true purple
  choice: pourpre véritable
  rationale: Traduction formelle qui maintient la distinction inhabituelle signalée par le témoin entre le violet et cette qualité de pourpre.
- source_word: fell to Mary
  choice: désigna Marie
  rationale: Expression française idiomatique pour le résultat d’un tirage au sort.
- source_word: fell silent
  choice: devint muet
  rationale: Rend la perte de parole indiquée par le contexte, sans préciser davantage sa cause ou sa durée.
theological_decisions:
- issue: La pureté de Marie « devant Dieu »
  choice: pure devant Dieu
  alternative: jugée pure par Dieu
  rationale: La formulation retenue préserve l’affirmation du témoin sans en faire explicitement un verdict divin ni définir la nature exacte de cette pureté.
- issue: Le mutisme de Zacharie
  choice: devint muet
  alternative: garda le silence
  rationale: « Devint muet » correspond au sens narratif probable d’une incapacité à parler; la note reconnaît toutefois que la vérification directe du grec reste à faire.
- issue: La fonction de Samuel
  choice: le remplaça
  alternative: prit sa place
  rationale: La traduction indique seulement une suppléance, sans attribuer à Samuel une charge sacerdotale plus précise que ne le permet le témoin fourni.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes ont été conservées lorsque naturelles, tandis que certaines coordinations ont été allégées. Projet provisoire fondé sur le témoin anglais public fourni, la consultation directe de la tradition manuscrite grecque étant encore en attente.
