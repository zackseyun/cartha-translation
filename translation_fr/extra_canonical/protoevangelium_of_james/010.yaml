revisions:
- from: '(1) Les prêtres tinrent conseil et dirent : « Faisons un voile pour le Temple du Seigneur. »


    Le prêtre dit : « Faites venir auprès de moi les jeunes filles vierges et pures de la tribu de David. » Les serviteurs partirent à leur recherche et en trouvèrent sept. Alors le prêtre se souvint que la jeune Marie était de la tribu de David et pure devant Dieu. Les serviteurs allèrent donc la chercher et l’amenèrent.


