revisions:
- from: '**Protoévangile de Jacques — Chapitre 15 : Le grand prêtre interroge Marie et Joseph**


    (1) Le scribe Anne vint trouver Joseph et lui dit : « Joseph, pourquoi ne t’es-tu pas montré parmi ceux qui voyageaient avec nous ? »


    Il lui répondit : « J’étais fatigué du voyage et je me suis reposé le premier jour de mon retour. »


