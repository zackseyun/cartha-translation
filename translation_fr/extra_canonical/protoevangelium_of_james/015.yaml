review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire sur quelques points contrôlables dans le grec : le nom est Ἄννας (« Annas »), les « hymnes » ne portent pas de possessif dans cette phrase, et les imparfaits décrivant l’éducation de Marie gagnent à être rendus comme des habitudes passées. Le reste conserve avec justesse les expressions volontairement obscures, notamment « dérober ses noces » et « pur envers elle ».'
  naturalness: Le français est globalement fluide, soutenu et accessible. « Annas » est la forme française internationale la plus sûre ici. « Qu’as-tu fait là ? » ajoute une nuance absente du texte ; « Qu’as-tu fait ? » est plus fidèle et naturel.
  terminology: « Saint des saints », « Seigneur Dieu », « connu d’homme », « faux témoignage », « descendance » et « main puissante » conviennent. « Acte contraire à la Loi » interprète légèrement ἀνομία ; « une grande iniquité » préserve mieux le lexique sans rendre le français obscur.
  issues:
  - severity: medium
    issue: Nom propre « Anne »
    rationale: Le grec donne Ἄννας. « Annas » est la transcription usuelle et évite de confondre ce personnage masculin avec le prénom français Anne.
  - severity: medium
    issue: « ses hymnes » et note b
    rationale: Le grec dit qu’elle « entendait des hymnes » (sans possessif) et « dansait devant lui » ; le pronom renvoie à l’ange. La note actuelle perpétue une ambiguïté introduite par le témoin anglais plutôt que par la formulation grecque.
  - severity: low
    issue: Aspect des verbes relatifs à l’éducation de Marie
    rationale: 'Les imparfaits grecs évoquent des pratiques habituelles : elle recevait de la nourriture de la main d’un ange, entendait des hymnes et dansait devant lui.'
  - severity: low
    issue: « qu’as-tu fait là ? »
    rationale: « Là » n’est pas exprimé dans la question grecque ; il peut être supprimé.
