translation:
  language: fr
  text: '**Protoévangile de Jacques — Chapitre 15 : Le grand prêtre interroge Marie et Joseph**


    (1) Le scribe Annas vint trouver Joseph et lui dit : « Joseph, pourquoi ne t’es-tu pas montré parmi ceux qui voyageaient avec nous ? »


    Il lui répondit : « J’étais fatigué du voyage et je me suis reposé le premier jour de mon retour. »


    Annas se retourna et vit que Marie était enceinte.


    (2) Il se rendit aussitôt auprès du prêtre et lui dit : « Joseph, dont tu t’es porté garant, a commis une grande iniquité. »


    Le prêtre demanda : « Que veux-tu dire ? »


    Il répondit : « La vierge que Joseph a reçue du Temple du Seigneur, il l’a souillée ; il a dérobé ses noces[a] et ne l’a pas fait savoir au peuple d’Israël. »


    Le prêtre lui demanda : « Joseph a-t-il fait cela ? »


    Le scribe Annas lui répondit : « Envoie des gardes, et tu constateras que la vierge est enceinte. »


    Les gardes partirent et la trouvèrent comme il l’avait dit. Ils l’amenèrent donc au tribunal avec Joseph.


    (3) Le grand prêtre lui dit : « Marie, pourquoi as-tu fait cela ? Pourquoi as-tu humilié ton âme et oublié le Seigneur ton Dieu ? Toi qui as été élevée dans le Saint des saints, qui recevais ta nourriture de la main d’un ange, qui entendais des hymnes et dansais devant lui, qu’as-tu fait ? »


    Elle pleura amèrement et dit : « Aussi vrai que le Seigneur Dieu est vivant, je suis pure devant Dieu et je n’ai pas connu d’homme ! »


    (4) Le prêtre dit alors : « Joseph, qu’as-tu fait ? »


    Joseph répondit : « Aussi vrai que le Seigneur mon Dieu est vivant, et Dieu m’en est témoin en vérité, je suis pur envers elle[b]. »


    Le prêtre reprit : « Ne porte pas de faux témoignage, mais dis la vérité. Tu as dérobé ses noces[a] sans le faire savoir au peuple d’Israël, et tu n’as pas courbé la tête sous la main puissante qui devait bénir ta descendance[c]. »


    Joseph garda le silence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dérober ses noces » est inhabituelle. Elle peut évoquer des noces tenues secrètes ou une union obtenue illicitement, mais le sens exact ne doit pas être fixé sans imposer une interprétation au texte.
    reason: Signaler une ambiguïté importante conservée dans le texte.
  - marker: b
    text: 'Littéralement : « pur envers elle ». Cette formulation affirme l’innocence de Joseph sans préciser davantage la nature de sa conduite.'
    reason: Préserver l’expression relationnelle inhabituelle et sa portée ouverte.
  - marker: c
    text: L’image de la « main puissante » et le lien exact entre le geste de courber la tête et la bénédiction de la descendance restent difficiles.
    reason: Avertir le lecteur d’une construction obscure sans la résoudre par conjecture.
lexical_decisions:
- source_word: acted very lawlessly
  choice: a commis un grave acte contraire à la Loi
  rationale: Rend la gravité et la dimension normative de l’accusation dans un français naturel, sans réduire l’expression à une simple conduite « illégale » au sens moderne.
- source_word: stolen her wedding
  choice: a dérobé ses noces
  rationale: Conserve volontairement l’image inhabituelle et l’ambiguïté du témoin fourni au lieu de l’interpréter comme mariage clandestin, rapports sexuels secrets ou enlèvement.
- source_word: known a man
  choice: connu d’homme
  rationale: Maintient l’euphémisme biblique relatif aux relations sexuelles, courant et intelligible dans un registre scripturaire français.
- source_word: pure toward her
  choice: pur envers elle
  rationale: Préserve la formulation relationnelle singulière du témoin sans la remplacer par une affirmation plus précise d’abstinence ou d’innocence.
- source_word: court
  choice: tribunal
  rationale: Exprime le lieu ou l’instance de jugement plutôt qu’une cour royale, tout en évitant de préciser une institution non établie par le témoin.
- source_word: officers
  choice: gardes
  rationale: Terme courant convenant à des agents envoyés par l’autorité religieuse, sans leur attribuer le statut moderne de policiers.
theological_decisions:
- issue: Nature exacte de l’accusation portée contre Joseph
  choice: Conserver « dérobé ses noces »
  alternative: Expliciter par « contracté secrètement mariage avec elle » ou « abusé d’elle en secret »
  rationale: Le témoin anglais signale lui-même une expression inhabituelle, et la révision directe du grec est annoncée comme encore pendante. Une explicitation trancherait prématurément entre plusieurs interprétations.
- issue: Déclaration d’innocence de Marie
  choice: « pure devant Dieu » et « je n’ai pas connu d’homme »
  alternative: Fusionner les deux affirmations en une déclaration explicite de virginité
  rationale: 'Maintient les deux volets distincts du discours : pureté devant Dieu et absence de relations avec un homme.'
- issue: Déclaration d’innocence de Joseph
  choice: « pur envers elle »
  alternative: « je ne l’ai pas touchée »
  rationale: Ne précise pas au-delà du témoin la nature de la conduite que Joseph nie.
- issue: Promesse de bénédiction liée à la main puissante
  choice: « la main puissante qui devait bénir ta descendance »
  alternative: Identifier explicitement cette main à Dieu ou reformuler en bénédiction sacerdotale
  rationale: Préserve l’image et la tension théologique sans introduire un agent ou un rite que le témoin ne nomme pas explicitement.
translation_notes:
  register: Français international moderne, digne et accessible, avec conservation du rythme narratif ancien. Les répétitions structurantes sont maintenues sans multiplier systématiquement les « et » lorsque le français naturel exige une liaison plus fluide. « Anne » est employé comme forme française traditionnelle du nom masculin Annas dans ce contexte. Projet provisoire fondé sur le témoin anglais public fourni ; une révision directe de la tradition manuscrite grecque demeure nécessaire.
