base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: fr
  text: '(1) Elle acheva le tissu pourpre et écarlate et l’apporta au prêtre.[a] Le prêtre le reçut, la bénit et dit : « Marie, le Seigneur Dieu a rendu ton nom grand, et tu seras bénie parmi toutes les générations de la terre. »


    (2) Marie se réjouit et se rendit chez sa parente Élisabeth.[b] Elle frappa à la porte. Élisabeth l’entendit, laissa tomber l’écarlate et courut à la porte. Elle ouvrit, bénit Marie et dit : « Comment m’est-il accordé que la mère de mon Seigneur vienne jusqu’à moi ? Car voici : celui qui est en moi a bondi et t’a bénie ! »


    Mais Marie avait oublié les mystères que l’ange Gabriel lui avait révélés.[c] Elle leva les yeux vers le ciel et dit : « Seigneur, qui suis-je pour que toutes les femmes de la terre me bénissent ? »


    (3) Elle resta trois mois auprès d’Élisabeth. Jour après jour, son ventre s’arrondissait, et Marie prit peur. Elle rentra chez elle et se cacha du peuple d’Israël. Elle avait seize ans lorsque ces mystères lui arrivèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le texte parle de « la pourpre et l’écarlate »; il s’agit ici de l’ouvrage textile confié à Marie.
    reason: Clarifier l’objet implicite tout en signalant la formulation du témoin.
  - marker: b
    text: Le terme peut désigner une parente sans préciser le degré exact de parenté.
    reason: Éviter de présenter « cousine » comme une précision certaine.
  - marker: c
    text: '« Mystères » est conservé tel quel : le mot peut englober les paroles de Gabriel et les réalités cachées qu’elles annoncent.'
    reason: Préserver l’ambiguïté et la portée théologique du terme.
lexical_decisions:
- source_word: purple and scarlet
  choice: le tissu pourpre et écarlate
  rationale: Le contexte antérieur concerne un ouvrage textile. « Tissu » explicite sobrement l’objet implicite et évite de faire des couleurs des objets autonomes.
- source_word: cousin
  choice: parente
  rationale: Le lien exact exprimé par le témoin anglais peut être plus large que « cousine » dans la tradition source; « parente » préserve cette indétermination.
- source_word: mysteries
  choice: mystères
  rationale: Le terme est conservé sans le réduire à des paroles, à des secrets ou à des événements, afin de maintenir sa portée narrative et théologique.
- source_word: the one in me
  choice: celui qui est en moi
  rationale: Cette formulation garde la désignation indirecte et personnelle du texte sans ajouter « enfant » ou « bébé ».
- source_word: womb grew larger
  choice: son ventre s’arrondissait
  rationale: Expression française naturelle qui décrit visiblement l’avancement de la grossesse sans registre médical.
- source_word: magnified your name
  choice: a rendu ton nom grand
  rationale: Formulation claire et digne qui conserve l’image sémitisante de la grandeur du nom plutôt que de la remplacer par « t’a glorifiée ».
theological_decisions:
- issue: La bénédiction prononcée sur Marie
  choice: « tu seras bénie parmi toutes les générations de la terre »
  alternative: « toutes les générations de la terre te diront bienheureuse »
  rationale: La formulation retenue suit le témoin fourni et maintient le passif « seras bénie », sans l’harmoniser avec une formule canonique voisine.
- issue: Le bond de celui qui est en Élisabeth
  choice: « a bondi et t’a bénie »
  alternative: « a tressailli de joie »
  rationale: Le texte attribue ici explicitement une bénédiction à celui qui bondit. Cette particularité est conservée au lieu d’être harmonisée avec Luc.
- issue: L’oubli de Marie
  choice: « avait oublié les mystères »
  alternative: « ne comprenait plus les mystères »
  rationale: La tension narrative est maintenue telle quelle; le verbe n’est pas atténué pour protéger une conception doctrinale de Marie.
- issue: L’âge de Marie
  choice: « Elle avait seize ans »
  alternative: omission ou généralisation
  rationale: Le détail transmis est conservé sans tentative de conciliation avec d’autres chronologies ou traditions.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions sémitisantes sont légèrement lissées lorsque cela améliore la lecture, mais les étrangetés porteuses de sens — l’oubli de Marie, le bond qui bénit, les « mystères » — sont maintenues. Projet provisoire fondé sur le témoin anglais public fourni; la révision directe du grec reste nécessaire.
