review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour conserver plus étroitement les images et l’aspect verbal du témoin fourni : « je suis assis » ne doit pas être remplacé par « je me tiens », et l’imminence de la royauté doit rester explicite. Le grec n’étant pas fourni directement, cette évaluation demeure provisoire et contrôlée par le témoin anglais.'
  naturalness: Le français est globalement fluide et de registre narratif digne. « Je suis assis dans le Temple de Dieu » est naturel dans ce contexte et évite de modifier l’action exprimée. « Ta vie est en mon pouvoir » rend idiomatiquement l’expression singulière « in my hand ».
  terminology: « Martyr de Dieu » est le rendu français le plus direct et le plus naturel dans une scène de mise à mort. Une note peut signaler que le mot ancien signifie fondamentalement aussi « témoin », sans substituer dans le texte un emploi français moins idiomatique. Les noms Hérode, Jean et Zacharie, ainsi que « Temple », sont cohérents.
  issues:
  - severity: medium
    issue: « je me tiens dans le Temple » remplace « I sit in God’s Temple ».
    rationale: Le changement de posture n’est pas justifié par le témoin anglais fourni. « Je suis assis dans le Temple de Dieu » préserve l’image sans être artificiel en français.
  - severity: medium
    issue: « est destiné à devenir roi » atténue et reformule « is about to be king ».
    rationale: La formulation source exprime une imminence. « Va devenir roi » conserve cette valeur sans présenter l’affirmation d’Hérode comme une validation narrative.
  - severity: medium
    issue: « témoin de Dieu » ne rend pas naturellement « martyr of God » dans le contexte immédiat.
    rationale: Puisque Zacharie annonce sa mort imminente, « martyr » est le terme français direct. Le sens étymologique de témoignage peut être conservé en note.
  - severity: low
    issue: « vous aurez répandu » transforme l’accusation liée à l’acte annoncé en futur antérieur.
    rationale: « Vous allez verser du sang innocent » maintient plus directement l’imminence et la causalité de l’énoncé.
  revised_text: '(1) Mais Hérode recherchait Jean. Il envoya des agents auprès de Zacharie pour lui demander : « Où caches-tu ton fils ? »


    Zacharie leur répondit : « Je suis un serviteur de Dieu et je suis assis dans le Temple de Dieu. Comment saurais-je où est mon fils ? »


    (2) Les agents repartirent et rapportèrent tout cela à Hérode. Hérode se mit en colère et déclara : « Son fils va devenir roi d’Israël ! »


    Il les envoya de nouveau auprès de Zacharie pour lui dire : « Dis-moi la vérité : où est ton fils ? Tu sais que ta vie est en mon pouvoir. »


    Les agents repartirent et lui rapportèrent ces paroles.


    (3) Zacharie dit : « Je serai un martyr[a] de Dieu si vous versez mon sang, car le Seigneur recevra mon esprit, puisque vous allez verser du sang innocent à l’entrée du Temple du Seigneur. »


    Aux premières lueurs du jour, Zacharie fut assassiné, sans que le peuple d’Israël sache qu’il l’avait été.'
  revised_footnotes:
  - marker: a
    text: Le terme ancien signifie d’abord « témoin » ; dans ce contexte, il désigne aussi celui qui témoigne de Dieu jusque dans la mort.
    reason: La note préserve la portée lexicale de martyr sans remplacer dans le texte français le terme naturel pour une mort subie en témoignage de Dieu.
  revision_rationale: La révision corrige les écarts de sens introduits par la posture (« se tenir »), par l’atténuation de l’imminence (« destiné à ») et par le futur antérieur. Elle emploie « martyr » dans le texte, avec une note qui conserve le sens de « témoin ». La répétition narrative et l’ambiguïté du pronom « lui » après le second envoi sont maintenues. Une vérification ultérieure contre un texte grec établi reste requise, le dossier ne fournissant ici qu’un témoin anglais.
