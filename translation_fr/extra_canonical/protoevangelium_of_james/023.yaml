translation:
  language: fr
  text: '(1) Mais Hérode recherchait Jean. Il envoya des agents auprès de Zacharie pour lui demander : « Où caches-tu ton fils ? »


    Zacharie leur répondit : « Je suis un serviteur de Dieu et je me tiens dans le Temple de Dieu. Comment saurais-je où est mon fils ? »


    (2) Les agents repartirent et rapportèrent tout cela à Hérode. Hérode se mit en colère et déclara : « Son fils est destiné à devenir roi d’Israël ! »


    Il les envoya de nouveau auprès de Zacharie pour lui dire : « Dis-moi la vérité : où est ton fils ? Tu sais que ta vie est entre mes mains. »


    Les agents repartirent et lui rapportèrent ces paroles.


    (3) Zacharie dit : « Si vous versez mon sang, je serai un témoin[a] de Dieu, car le Seigneur recevra mon esprit : vous aurez répandu un sang innocent à l’entrée du Temple du Seigneur. »


    Aux premières lueurs du jour, Zacharie fut assassiné, sans que le peuple d’Israël sache qu’il l’avait été.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « martyr ». Le mot signifie d’abord « témoin » et peut désigner ici celui qui témoigne de Dieu jusque dans la mort.'
    reason: Le français moderne « martyr » met surtout l’accent sur la mise à mort, tandis que le terme ancien conserve aussi le sens de témoignage.
lexical_decisions:
- source_word: asked for John
  choice: recherchait Jean
  rationale: Dans ce contexte de poursuite, « recherchait » exprime plus naturellement qu’Hérode voulait retrouver Jean, sans ajouter qu’il avait déjà ordonné son arrestation.
- source_word: officers
  choice: agents
  rationale: « Agents » reste assez large pour des hommes chargés d’exécuter les ordres d’Hérode, sans préciser indûment leur fonction militaire ou policière.
- source_word: minister of God
  choice: serviteur de Dieu
  rationale: « Serviteur » est naturel et digne en français moderne; « ministre » risquerait d’évoquer une fonction politique contemporaine.
- source_word: sit in God’s Temple
  choice: je me tiens dans le Temple de Dieu
  rationale: Le verbe peut décrire la présence ou le service de Zacharie dans le sanctuaire; « se tenir » évite une image française artificielle tout en conservant l’idée de sa place dans le Temple.
- source_word: about to be king over Israel
  choice: est destiné à devenir roi d’Israël
  rationale: Cette formulation garde la perspective imminente ou attendue de la royauté sans affirmer qu’il règne déjà.
- source_word: martyr
  choice: témoin
  rationale: Le terme grec associé à « martyr » signifie fondamentalement « témoin ». Dans la phrase conditionnelle, Zacharie deviendra témoin de Dieu par sa mort; la note signale aussi le sens ultérieur de martyr.
- source_word: around daybreak
  choice: aux premières lueurs du jour
  rationale: Rend idiomatiquement une indication temporelle approximative liée à l’aube.
theological_decisions:
- issue: Sens de « martyr/témoin de Dieu »
  choice: « témoin de Dieu », avec une note
  alternative: « martyr de Dieu »
  rationale: « Témoin » préserve le sens lexical ancien et l’étrangeté théologique de l’énoncé, tandis que la note rend visible l’association avec la mort subie pour Dieu.
- issue: Annonce concernant la royauté de Jean
  choice: « est destiné à devenir roi d’Israël »
  alternative: « va devenir roi d’Israël »
  rationale: Le texte attribue cette crainte à Hérode; la traduction ne la transforme ni en déclaration doctrinale du narrateur ni en prophétie certaine.
- issue: Réception de l’esprit de Zacharie
  choice: « le Seigneur recevra mon esprit »
  alternative: « le Seigneur accueillera mon âme »
  rationale: « Esprit » conserve la distinction lexicale du texte et n’harmonise pas silencieusement l’expression avec une formulation doctrinale plus familière.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes sont en partie conservées, mais les formules de discours ont été rendues naturellement. Cette proposition demeure provisoire, car elle repose sur le témoin anglais fourni; une vérification directe de la tradition manuscrite grecque est encore nécessaire.
