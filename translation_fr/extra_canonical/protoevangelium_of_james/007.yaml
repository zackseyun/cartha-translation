translation:
  language: fr
  text: '(1) Anne prit soin de son enfant au fil des mois. Lorsque celle-ci eut deux ans, Joachim dit : « Conduisons-la au Temple du Seigneur afin de tenir la promesse que nous avons faite, de peur que le Seigneur ne s’irrite contre nous et ne juge notre offrande inacceptable. »


    Mais Anne dit : « Attendons sa troisième année, pour qu’elle ne cherche ni son père ni sa mère. »


    Et Joachim dit : « Attendons. »


    (2) Lorsque l’enfant eut trois ans, Joachim dit : « Appelons les filles pures des Hébreux. Qu’elles prennent des lampes et les tiennent allumées, afin que l’enfant ne retourne pas en arrière et que son cœur ne soit pas détourné du Temple du Seigneur. » Ils firent ainsi jusqu’à leur montée au Temple du Seigneur.


    Le prêtre l’accueillit, l’embrassa et dit : « Le Seigneur Dieu a rendu ton nom grand parmi toutes les générations. Par toi, le Seigneur révélera, dans les derniers jours, la délivrance qu’il accorde au peuple d’Israël.[a] »


    (3) Il la fit asseoir sur la troisième marche de l’autel, et le Seigneur Dieu répandit sa grâce sur elle. Elle se mit à danser, et toute la maison d’Israël l’aima.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot rendu par « délivrance » peut aussi être traduit par « rédemption » ou « rachat ». La formulation demeure provisoire dans l’attente d’une révision directe du grec.
    reason: Préserver l’éventail sémantique théologique et signaler la limite documentaire du dossier fourni.
lexical_decisions:
- source_word: Temple of the Lord
  choice: Temple du Seigneur
  rationale: Formulation française courante et digne, avec une majuscule pour désigner le sanctuaire de Jérusalem.
- source_word: promise
  choice: promesse
  rationale: Conserve le terme générique du témoin sans préciser qu’il s’agit d’un vœu, faute de révision grecque directe.
- source_word: gift
  choice: offrande
  rationale: Dans ce contexte cultuel, « offrande » exprime plus naturellement le don consacré que le simple mot « don ».
- source_word: pure daughters of the Hebrews
  choice: filles pures des Hébreux
  rationale: Maintient la formulation et son possible sens rituel ou moral sans la réduire à « vierges ».
- source_word: redemption
  choice: délivrance
  rationale: Rend le sens salvifique de manière intelligible tout en évitant d’imposer une technicité théologique étrangère au contexte; l’ambiguïté est signalée en note.
- source_word: house of Israel
  choice: maison d’Israël
  rationale: Conserve l’expression collective traditionnelle plutôt que de la paraphraser par « peuple ».
theological_decisions:
- issue: Nature de la promesse faite par les parents
  choice: promesse
  alternative: vœu
  rationale: Le témoin fourni dit « promise ». En attendant la vérification du grec, le texte ne précise pas davantage la catégorie cultuelle.
- issue: Crainte de la réaction divine
  choice: « de peur que le Seigneur ne s’irrite contre nous et ne juge notre offrande inacceptable »
  alternative: « afin que le Seigneur ne se mette pas en colère contre nous et ne refuse pas notre don »
  rationale: La formulation retenue préserve le lien entre colère divine et acceptation cultuelle sans l’atténuer ni l’accentuer.
- issue: Annonce eschatologique concernant Marie
  choice: « Par toi, le Seigneur révélera, dans les derniers jours, la délivrance qu’il accorde au peuple d’Israël »
  alternative: « En toi, le Seigneur manifestera le rachat des fils d’Israël »
  rationale: Le choix garde la médiation exprimée par « through you » sans définir son mécanisme et maintient la perspective eschatologique.
- issue: Grâce répandue sur l’enfant
  choice: « le Seigneur Dieu répandit sa grâce sur elle »
  alternative: « le Seigneur Dieu mit sa grâce sur elle »
  rationale: « Répandit » restitue naturellement l’image du témoin sans expliciter la nature ou les effets de cette grâce.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions structurantes sont en grande partie conservées, mais certaines coordinations initiales ont été allégées pour une lecture française naturelle. Cette version reste provisoire, car le dossier indique qu’une révision directe de la tradition manuscrite grecque est encore nécessaire.
