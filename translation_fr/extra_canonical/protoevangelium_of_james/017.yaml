translation:
  language: fr
  text: '**Chapitre 17 — Le recensement**


    **(1)** Or, le roi Auguste donna l’ordre de recenser tous ceux qui se trouvaient à Bethléem de Judée.


    Joseph se dit : « Je vais faire inscrire mes fils. Mais que dois-je faire de cette jeune fille ? Sous quel statut vais-je la faire inscrire ? Comme ma femme ? J’en ai honte. Comme ma fille ? Mais tout le peuple d’Israël sait qu’elle n’est pas ma fille. Voici le jour du Seigneur : je ferai ce que le Seigneur voudra. »


    **(2)** Il sella l’ânesse, y fit monter Marie, puis son fils conduisit l’animal, tandis que Samuel les suivait.


    Quand ils approchèrent du troisième mille, Joseph se retourna et vit que Marie était triste. Il se dit : « C’est sans doute celui qui est en elle qui la tourmente. »


    Joseph se retourna de nouveau et la vit rire. Il lui demanda : « Marie, que t’arrive-t-il ? Je vois ton visage tantôt rire, tantôt s’attrister. »


    Elle lui répondit : « C’est que je vois devant mes yeux deux peuples[a] : l’un pleure et se lamente, tandis que l’autre se réjouit et exulte. »


    **(3)** Lorsqu’ils furent à mi-chemin, Marie lui dit : « Joseph, fais-moi descendre de l’ânesse, car celui qui est en moi pousse pour sortir. »


    Il la fit descendre de l’ânesse et lui dit : « Où puis-je t’emmener pour te mettre à l’abri et préserver ta pudeur[b] ? Cet endroit est désert. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux peuples ». Le texte ne précise pas qui ils représentent.'
    reason: Préserver une image inhabituelle et son ambiguïté théologique sans l’expliquer dans le corps du texte.
  - marker: b
    text: L’expression peut aussi se rendre plus littéralement par « couvrir ce qui est honteux » ou « cacher ta nudité » ; elle évoque ici la nécessité d’un lieu retiré pour l’accouchement.
    reason: Signaler le relief du terme source, difficile à rendre naturellement sans suggérer une honte morale.
lexical_decisions:
- source_word: register / ἀπογράφεσθαι (probable Greek reading)
  choice: recenser / faire inscrire
  rationale: « Recenser » rend l’ordre administratif collectif ; « faire inscrire » convient mieux lorsque Joseph envisage sous quel statut déclarer chaque membre de sa maisonnée.
- source_word: child / maiden (Greek source review pending)
  choice: cette jeune fille
  rationale: Marie n’est pas présentée ici comme la fille de Joseph. « Jeune fille » évite l’ambiguïté française de « cette enfant » tout en conservant sa position de jeune personne placée sous sa responsabilité.
- source_word: donkey
  choice: ânesse
  rationale: La tradition grecque de ce passage emploie vraisemblablement un terme féminin ; « ânesse » demeure naturel en français narratif.
- source_word: two peoples / δύο λαούς (probable Greek reading)
  choice: deux peuples
  rationale: Le pluriel collectif « peuples » préserve la portée visionnaire et l’ambiguïté du texte, contrairement à « deux personnes », qui individualiserait la scène.
- source_word: wilderness
  choice: endroit désert
  rationale: Dans ce contexte de voyage, l’expression désigne avant tout un lieu isolé et inhabité ; « désert » seul pourrait suggérer à tort un paysage de sable.
- source_word: awkwardness / ἀσχημοσύνη (probable Greek reading)
  choice: préserver ta pudeur
  rationale: L’expression concerne l’exposition corporelle liée à l’accouchement. Cette formulation française reste digne et intelligible sans attribuer à Marie une faute morale.
theological_decisions:
- issue: Sens des « deux peuples » vus par Marie
  choice: Conserver « deux peuples » sans les identifier
  alternative: Les expliciter comme Israël et les nations, ou comme les croyants et les incroyants
  rationale: Le passage ne donne ici aucune identification explicite. La traduction préserve donc l’image et sa tension interprétative sans importer une lecture théologique particulière.
- issue: « Voici le jour du Seigneur »
  choice: Maintenir la formule littérale
  alternative: Paraphraser comme « le Seigneur décidera aujourd’hui »
  rationale: La formule peut évoquer une intervention ou une providence divine sans que son sens exact soit développé. La conserver évite de réduire sa portée.
- issue: « celui qui est en elle »
  choice: Employer le masculin personnel « celui »
  alternative: Dire « l’enfant qu’elle porte »
  rationale: La formulation personnelle est répétée dans le récit et contribue à sa présentation de l’enfant à naître ; la paraphrase aurait atténué cet effet.
translation_notes:
  register: Français international moderne, narratif et digne. Les dialogues restent directs et accessibles. Le léger caractère sémitisant de certaines formules (« jour du Seigneur », « celui qui est en elle ») est conservé lorsqu’il porte la texture religieuse du récit. Projet provisoire fondé sur le témoin anglais fourni, avec contrôle ponctuel de lectures grecques probables ; une révision intégrale sur le grec reste nécessaire.
