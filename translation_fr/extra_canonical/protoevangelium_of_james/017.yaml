review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : le témoin fourni dit explicitement « deux personnes » (et l’anglais POB le confirme), non « deux peuples ». La note a et les décisions associées attribuent donc au texte une lecture qui n’est pas établie par les données de la tâche. La formulation concernant l’« awkwardness » est également rendue de façon trop interprétative par « préserver ta pudeur » et sa note évoque indûment la nudité.'
  naturalness: Le français est globalement fluide et d’un registre narratif approprié. « Cette situation embarrassante » rend plus directement et naturellement l’embarras pratique évoqué dans le dialogue, sans imposer une lecture morale ou corporelle précise.
  terminology: « Recenser », « faire inscrire », « ânesse », « Bethléem de Judée » et « le jour du Seigneur » conviennent. « Deux personnes » doit être retenu selon le témoin disponible. « Celui qui est en elle » conserve la formulation personnelle et répétée du récit.
  issues:
  - severity: high
    issue: « deux peuples » remplace « deux personnes »
    rationale: Le texte source fourni et l’audit anglais disent tous deux « two people ». Le remplacement par « deux peuples », ainsi que la note qui le présente comme littéral, modifie l’image et introduit une interprétation non garantie par le dossier.
  - severity: medium
    issue: Note a factuellement incompatible avec le témoin fourni
    rationale: 'Elle affirme : « Littéralement : deux peuples », alors que le témoin de base porte « deux personnes ». Elle doit être supprimée avec l’altération qu’elle justifie.'
  - severity: medium
    issue: « préserver ta pudeur » et la note b spécifient excessivement le sens
    rationale: Le témoin anglais dit « shelter you in your awkwardness ». La pudeur et surtout la « nudité » explicitée en note réduisent l’ambiguïté de l’expression et ajoutent des précisions absentes du témoin.
  revised_text: '**Chapitre 17 — Le recensement**


    **(1)** Or, le roi Auguste donna l’ordre de recenser les habitants de Bethléem de Judée.


    Joseph se dit : « Je vais faire inscrire mes fils. Mais que vais-je faire de cette jeune fille ? Comment vais-je la faire inscrire ? Comme ma femme ? J’en ai honte. Comme ma fille ? Mais le peuple d’Israël sait qu’elle n’est pas ma fille. Voici le jour du Seigneur : je ferai ce que le Seigneur voudra. »


    **(2)** Il sella l’ânesse, y fit monter Marie ; son fils la conduisait, et Samuel suivait.


    Alors qu’ils approchaient du troisième mille, Joseph se retourna et vit qu’elle était triste. Il se disait : « C’est sans doute celui qui est en elle qui la tourmente. »


    Joseph se retourna de nouveau et la vit rire. Il lui demanda : « Marie, pourquoi es-tu ainsi ? Je vois ton visage rire à un moment, puis être triste. »


    Elle lui répondit : « C’est parce que je vois deux personnes devant mes yeux : l’une pleure et se lamente, l’autre se réjouit et exulte. »


    **(3)** Lorsqu’ils arrivèrent au milieu du voyage, Marie lui dit : « Joseph, fais-moi descendre de l’ânesse, car celui qui est en moi pousse pour sortir. »


    Il la fit descendre de l’ânesse et lui dit : « Où vais-je t’emmener pour t’abriter dans cette situation embarrassante[a] ? Cet endroit est désert. »'
  revised_footnotes:
  - marker: a
    text: L’expression désigne une situation embarrassante ou délicate. Dans le contexte, Joseph cherche un lieu où Marie puisse être à l’abri.
    reason: Conserver l’indétermination de l’expression tout en éclairant sobrement le sens contextuel, sans introduire la notion de nudité ni une honte morale.
  revision_rationale: 'La révision suit le témoin textuel fourni : l’image demeure celle de deux personnes, sans identification théologique. Elle retire l’interprétation non étayée de « deux peuples » et emploie pour la dernière réplique une formulation française naturelle qui conserve l’embarras indéterminé du texte. Les autres ajustements sont stylistiques et maintiennent le sens, le registre et les répétitions significatives du récit.'
