base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/005.yaml
  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


    The midwife said, “It is a girl!”


    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: fr
  text: '(1) Le lendemain, Joachim présentait ses offrandes en se disant : « Si le Seigneur Dieu s’est réconcilié avec moi, la plaque portée par le prêtre[a] me le fera savoir. » Joachim présenta donc ses offrandes et observa attentivement la plaque du prêtre tandis que celui-ci montait vers l’autel du Seigneur. Il n’y vit aucun péché[b]. Alors Joachim dit : « Maintenant, je sais que le Seigneur Dieu s’est réconcilié avec moi et qu’il a éloigné de moi tous mes péchés. » Il descendit du Temple du Seigneur, justifié, et rentra chez lui.


    (2) Environ six mois s’accomplirent, et, au septième mois, Anne accoucha. Elle demanda à la sage-femme : « Qu’est-ce que c’est ? »


    La sage-femme répondit : « C’est une fille ! »


    Anne dit : « Mon âme a été exaltée aujourd’hui[c] ! » Puis elle coucha son enfant.


    Lorsque les jours prescrits furent accomplis, Anne se purifia de ses pertes de sang. Elle donna le sein à l’enfant et lui donna le nom de Marie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet sacerdotal ainsi désigné est probablement une plaque portée par le grand prêtre, mais le témoin fourni ne permet pas de préciser davantage sa forme ni sa fonction.
    reason: Signaler l’incertitude référentielle sans l’effacer dans le texte.
  - marker: b
    text: 'L’expression est difficile : le témoin fourni dit littéralement que Joachim ne vit « aucun péché en elle », c’est-à-dire dans la plaque. Le sens exact devra être vérifié directement dans la tradition manuscrite grecque.'
    reason: Préserver une difficulté réelle du témoin et indiquer que la révision grecque reste à faire.
  - marker: c
    text: 'Littéralement, selon le témoin fourni : « Mon âme a été magnifiée en ce jour. »'
    reason: Documenter la forme passive et le caractère marqué de l’expression.
lexical_decisions:
- source_word: plate worn by the priest
  choice: la plaque portée par le prêtre
  rationale: Le témoin désigne un objet sacerdotal sans l’identifier davantage. « Plaque » conserve cette imprécision plutôt que d’introduire une explication non attestée dans les données fournies.
- source_word: gifts
  choice: offrandes
  rationale: Dans le contexte cultuel de l’autel et du Temple, « offrandes » est plus naturel et précis que « présents », tout en restant assez large.
- source_word: justified
  choice: justifié
  rationale: Le terme conserve la portée religieuse et judiciaire de l’expression sans la réduire à « rassuré » ou « déclaré innocent ».
- source_word: my soul is magnified
  choice: mon âme a été exaltée
  rationale: Cette formulation française conserve le passif et l’élévation exprimée dans le témoin, sans ajouter explicitement celui qui exalte l’âme.
- source_word: cleansed her flow of blood
  choice: se purifia de ses pertes de sang
  rationale: La formulation garde ensemble la purification rituelle et la réalité corporelle mentionnée, dans un français compréhensible.
theological_decisions:
- issue: Le signe observé sur la plaque sacerdotale
  choice: Il n’y vit aucun péché
  alternative: Il ne vit en lui aucun péché
  rationale: Le témoin fourni rattache grammaticalement le constat à la plaque (« in it »). La traduction conserve cette ambiguïté inhabituelle au lieu de déplacer silencieusement le péché vers Joachim.
- issue: La réconciliation de Dieu avec Joachim
  choice: le Seigneur Dieu s’est réconcilié avec moi
  alternative: le Seigneur Dieu m’est favorable
  rationale: La formulation directe préserve l’idée de réconciliation exprimée par le témoin, même si la tournure théologique peut sembler tendue.
- issue: L’exaltation de l’âme d’Anne
  choice: Mon âme a été exaltée aujourd’hui
  alternative: Aujourd’hui, mon âme exalte le Seigneur
  rationale: L’alternative introduirait un complément absent et transformerait le passif en actif, en rapprochant indûment la phrase du Magnificat.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions caractéristiques du récit sont partiellement maintenues, notamment autour des offrandes et de l’accomplissement des jours. La traduction reste provisoire, car elle repose sur le témoin anglais public fourni ; une collation directe du grec est encore nécessaire.
