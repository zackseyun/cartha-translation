translation:
  language: fr
  text: '(1) Joseph trouva la sage-femme et l’amena avec lui alors qu’elle descendait de la montagne.[a] Il lui dit : « Marie est ma fiancée. Elle a conçu du Saint-Esprit, après avoir été élevée dans le Temple du Seigneur. »


    La sage-femme l’accompagna. (2) Ils s’arrêtèrent devant la grotte, et une nuée obscure la couvrit de son ombre. La sage-femme dit : « Aujourd’hui, mon âme est exaltée, car mes yeux ont vu une merveille : le salut est né pour Israël ! »


    Aussitôt, la nuée se retira de la grotte, et une grande lumière y apparut, si éblouissante que leurs yeux ne pouvaient la supporter. Peu après, la lumière diminua jusqu’à ce qu’un nouveau-né apparaisse. Il vint prendre le sein de sa mère, Marie.


    La sage-femme s’écria : « Quel grand jour pour moi ! Aujourd’hui, j’ai vu ce miracle nouveau ! »


    (3) La sage-femme sortit de la grotte, et Salomé vint à sa rencontre.


    Elle lui dit : « Salomé, Salomé, il faut que je te raconte un spectacle nouveau : une vierge a enfanté, contrairement à sa nature ! »[b]


    Salomé répondit : « Aussi vrai que le Seigneur mon Dieu est vivant, si je n’introduis pas mon doigt pour examiner son état, je ne croirai pas qu’une vierge a enfanté. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le témoignage anglais fourni est elliptique : littéralement, « il trouva (et) amena (la/elle) descendant de la montagne ». La traduction comprend que Joseph trouve la sage-femme et l’amène avec lui.'
    reason: Signaler une ambiguïté syntaxique réelle de la base disponible sans rendre le récit inutilement obscur.
  - marker: b
    text: 'Ou : « ce qui est contraire à la nature ». Le possessif peut rapporter l’impossibilité à la nature de la vierge en particulier ou à l’ordre naturel en général.'
    reason: Préserver la portée ambiguë de l’expression « against her nature ».
  - marker: c
    text: « Examiner son état » conserve l’expression indirecte du témoignage fourni ; le contexte indique un examen corporel destiné à vérifier la virginité de Marie.
    reason: Clarifier l’euphémisme sans introduire dans le corps du texte un vocabulaire anatomique absent de la base fournie.
lexical_decisions:
- source_word: midwife
  choice: sage-femme
  rationale: Terme français moderne, courant et précis pour la femme appelée auprès de Marie lors de l’accouchement.
- source_word: betrothed
  choice: fiancée
  rationale: Rend clairement le lien matrimonial promis sans supposer que la vie conjugale a déjà commencé.
- source_word: Holy Spirit
  choice: Saint-Esprit
  rationale: Forme française biblique usuelle, fidèle à la désignation théologique du témoin.
- source_word: overshadowed
  choice: couvrit de son ombre
  rationale: Conserve l’image biblique de la nuée qui projette ou étend son ombre, sans la réduire à une simple obscurité.
- source_word: My soul is magnified
  choice: mon âme est exaltée
  rationale: Préserve le tour solennel et son écho biblique, tout en restant intelligible en français moderne.
- source_word: Salvation
  choice: le salut
  rationale: Maintient la formulation personnifiée et théologiquement dense du témoin, plutôt que de l’expliciter comme un simple sauveur.
- source_word: infant
  choice: nouveau-né
  rationale: Expression naturelle qui situe précisément l’enfant dans la scène de naissance.
- source_word: condition
  choice: état
  rationale: Conserve l’euphémisme du témoin anglais au lieu d’ajouter une précision anatomique non attestée dans la base fournie.
theological_decisions:
- issue: Conception de Marie et action de l’Esprit saint
  choice: « Elle a conçu du Saint-Esprit »
  alternative: « Elle est enceinte par l’action du Saint-Esprit »
  rationale: La formulation retenue suit de près le témoignage fourni et conserve son affirmation causale sans développer une doctrine au-delà du texte.
- issue: Le salut présenté comme étant né pour Israël
  choice: « le salut est né pour Israël »
  alternative: « un sauveur est né pour Israël »
  rationale: Le texte fourni dit « Salvation », non « Savior » ; la personnification et sa tension théologique sont donc préservées.
- issue: Virginité après l’enfantement et vérification de Salomé
  choice: Maintien de l’affirmation et du geste de vérification dans leur crudité narrative
  alternative: Atténuer le geste ou l’expliquer doctrinalement
  rationale: Le passage construit son épisode autour de l’incrédulité de Salomé ; ni l’adoucissement ni une interprétation confessionnelle ne seraient justifiés.
translation_notes:
  register: 'Français international moderne, narratif et digne, avec une légère solennité adaptée au récit ancien. Les répétitions et les échos bibliques ont été conservés lorsqu’ils portent la rhétorique du passage. Ce projet reste nécessairement provisoire : la documentation fournie est un témoin anglais du domaine public, et la révision directe de la tradition manuscrite grecque est encore en attente.'
