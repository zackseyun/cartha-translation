base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: fr
  text: '(1) Quand Hérode vit que les mages l’avaient trompé, il se mit en colère. Il envoya ses tueurs avec l’ordre de tuer tous les enfants âgés de deux ans ou moins.


    (2) Quand Marie apprit qu’on tuait les enfants, elle eut peur. Elle prit son enfant, l’enveloppa de langes et le déposa dans une mangeoire pour les vaches.


    (3) Quand Élisabeth apprit qu’on recherchait Jean, elle l’emmena dans les collines et chercha des yeux un endroit où le cacher, mais il n’y avait aucune cachette. Alors Élisabeth gémit et dit : « Montagne de Dieu, accueille une mère avec son enfant ! » En effet, Élisabeth ne pouvait pas monter plus haut. Aussitôt, la montagne se fendit et l’accueillit, et une lumière brilla pour elle à travers la montagne. Car un ange du Seigneur était avec eux et les protégeait.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: magi
  choice: mages
  rationale: Terme français traditionnel et compréhensible, qui conserve l’identité particulière de ces visiteurs sans les transformer en rois.
- source_word: killers
  choice: tueurs
  rationale: Rend directement la dureté du terme transmis par le témoin anglais, sans l’atténuer en « soldats » ou « hommes ».
- source_word: infants
  choice: enfants
  rationale: Dans ce contexte, « enfants » est plus naturel que « nourrissons », puisque le groupe comprend ceux qui ont jusqu’à deux ans.
- source_word: wrapped him in cloths
  choice: l’enveloppa de langes
  rationale: « Langes » exprime naturellement en français les pièces de tissu servant à envelopper un très jeune enfant.
- source_word: manger for cows
  choice: mangeoire pour les vaches
  rationale: Conserve la précision inhabituelle du témoin fourni plutôt que de réduire l’expression au seul mot « crèche ».
- source_word: take in
  choice: accueille
  rationale: Exprime la demande adressée à la montagne de recevoir et d’abriter la mère et l’enfant.
- source_word: received her
  choice: l’accueillit
  rationale: Maintient le lien verbal avec la supplication d’Élisabeth et le caractère merveilleux de la réponse.
theological_decisions:
- issue: Identité des mages
  choice: « les mages »
  alternative: « les rois mages »
  rationale: Le texte transmis ne les appelle pas rois; la traduction n’ajoute donc pas cette tradition ultérieure.
- issue: Nature du refuge d’Élisabeth
  choice: La montagne se fend et accueille Élisabeth
  alternative: Interpréter la scène comme une simple grotte naturelle
  rationale: Le récit présente explicitement une intervention miraculeuse; il convient de préserver cette affirmation sans la rationaliser.
- issue: Référent des pronoms finaux
  choice: « avec eux et les protégeait »
  alternative: « avec elles et les protégeait » ou expliciter « Élisabeth et Jean »
  rationale: Le pluriel transmis renvoie naturellement à Élisabeth et Jean. La formulation française conserve le pronom sans ajouter une explicitation absente du témoin.
- issue: Fonction de l’ange
  choice: « était avec eux et les protégeait »
  alternative: « les gardait »
  rationale: « Protégeait » rend clairement l’action de sauvegarde sans développer une doctrine angélique au-delà du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Les enchaînements restent simples afin de préserver le rythme du récit. Le projet repose ici sur le témoin anglais public fourni; une vérification directe du grec demeure nécessaire, notamment pour « tueurs », « mangeoire pour les vaches », les verbes décrivant l’ouverture de la montagne et les pronoms de la dernière phrase.
