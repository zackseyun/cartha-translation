  text: '(1) She took the pitcher and went to fill it with water, and look! A voice said to her, “Rejoice, blessed one! The Lord is with you. Blessed are you among women.”


    Mary looked around to the right and the left to see where the voice might be coming from. She became terrified and went into her house. After setting down the pitcher, she took up the purple, sat upon her throne, and spun the purple.


    (2) And look! An angel of the Lord stood before her and said, “Do not be afraid, Mary, because you have found grace before the Lord of All. You will conceive from God’s word.”


    When Mary heard this, she questioned herself, saying, “Will I conceive from the Lord, the living God, and give birth as all women give birth?”


    (3) The angel of the Lord said to her, “Not like that, Mary, because the power of God will overshadow you. Therefore, the holy one who will be born from you will be called the Son of the Most High. You will call his name Jesus, because he will save his people from their sins.”


    Mary said, “Look, I am the servant of the Lord. May it happen to me according to your word.”'
translation:
  language: fr
  text: '(1) Elle prit la cruche et alla la remplir d’eau. Et voici qu’une voix lui disait : « Réjouis-toi, toi qui es bénie ! Le Seigneur est avec toi. Tu es bénie parmi les femmes. »


    Marie regarda à droite et à gauche pour voir d’où pouvait venir la voix. Saisie de peur, elle rentra chez elle. Après avoir posé la cruche, elle prit la pourpre, s’assit sur son siège et se mit à la filer.


    (2) Et voici qu’un ange du Seigneur se tint devant elle et lui dit : « N’aie pas peur, Marie, car tu as trouvé grâce devant le Seigneur de tous. Tu concevras par la parole de Dieu[a]. »


    À ces mots, Marie s’interrogea en elle-même : « Vais-je concevoir du Seigneur, le Dieu vivant, et enfanter comme toutes les femmes ? »


    (3) L’ange du Seigneur lui dit : « Ce ne sera pas ainsi, Marie, car la puissance de Dieu te couvrira de son ombre. C’est pourquoi l’être saint qui naîtra de toi sera appelé Fils du Très-Haut. Tu lui donneras le nom de Jésus, car il sauvera son peuple de ses péchés. »


    Marie dit : « Voici, je suis la servante du Seigneur. Qu’il m’arrive selon ta parole. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu concevras de la Parole de Dieu ». Le texte peut désigner la parole efficace de Dieu ou être compris comme une référence plus personnelle à la Parole; la formulation grecque doit encore faire l’objet d’une vérification directe.'
    reason: Signaler une ambiguïté théologiquement importante sans la résoudre dans le corps du texte, compte tenu de l’absence de révision directe du grec.
lexical_decisions:
- source_word: χαῖρε / “Rejoice” (as reflected in the witness)
  choice: « Réjouis-toi »
  rationale: Conserve la valeur impérative et l’écho scripturaire, plutôt que de réduire l’expression à une simple salutation.
- source_word: κεχαριτωμένη / “blessed one” (as reflected in the witness)
  choice: « toi qui es bénie »
  rationale: Formulation naturelle et digne en français, sans imposer une interprétation doctrinale plus précise que le témoin fourni.
- source_word: πορφύρα / “the purple”
  choice: « la pourpre »
  rationale: Désigne ici la matière ou le fil pourpre confié à Marie; le terme concret est conservé malgré son caractère inhabituel.
- source_word: θρόνος / “throne”
  choice: « siège »
  rationale: Le français « trône » risquerait de suggérer ici une royauté explicite; « siège » garde le sens spatial probable sans surinterprétation.
- source_word: χάρις / “grace”
  choice: « grâce »
  rationale: Préserve le terme théologique traditionnel ainsi que sa polysémie de faveur accordée.
- source_word: κύριος πάντων / “Lord of All”
  choice: « Seigneur de tous »
  rationale: Rend le titre de manière directe tout en laissant ouverte la portée de « tous ».
- source_word: ἐκ λόγου θεοῦ / “from God’s word”
  choice: « par la parole de Dieu »
  rationale: Rend naturellement le moyen ou l’origine exprimés, tout en conservant l’ambiguïté entre parole prononcée et Parole comprise de façon plus personnelle.
- source_word: ἐπισκιάζω / “overshadow”
  choice: « couvrir de son ombre »
  rationale: Conserve l’image biblique de l’ombre divine sans l’expliquer ni l’affaiblir.
- source_word: Ἰησοῦς / “Jesus”
  choice: « Jésus »
  rationale: Forme française établie du nom propre.
theological_decisions:
- issue: Nature de la conception « par la parole de Dieu »
  choice: Maintenir « par la parole de Dieu »
  alternative: « grâce à la parole de Dieu » ou « du Verbe de Dieu »
  rationale: Le texte peut évoquer soit la parole efficace de Dieu, soit une compréhension plus personnelle du Logos. La traduction ne tranche pas cette tension.
- issue: Question de Marie sur le Seigneur, le Dieu vivant
  choice: « Vais-je concevoir du Seigneur, le Dieu vivant »
  alternative: « Est-ce du Seigneur, le Dieu vivant, que je concevrai »
  rationale: La construction inhabituelle est conservée de façon intelligible, sans préciser un mécanisme ni harmoniser entièrement avec Luc.
- issue: Lien logique entre l’ombre divine et le titre du nouveau-né
  choice: « C’est pourquoi »
  alternative: « ainsi » ou absence de connecteur explicite
  rationale: Suit le lien causal présenté par le témoin, tout en évitant d’ajouter une explication théologique.
- issue: Formule finale de Marie
  choice: « Qu’il m’arrive selon ta parole »
  alternative: « Qu’il me soit fait selon ta parole »
  rationale: La formulation retenue est actuelle et conserve l’acceptation de Marie sans reprendre mécaniquement une tournure liturgique traditionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions de « Et voici » sont conservées lorsqu’elles structurent la scène, mais les enchaînements sont légèrement fluidifiés. Le tutoiement correspond à l’usage biblique français courant dans ce type de dialogue. Cette proposition demeure provisoire, car le dossier fourni indique qu’une vérification directe de la tradition manuscrite grecque reste à effectuer.
