review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour deux nuances : « la confia à ses fils » inverse ou modifie le rapport exprimé par « stationed his sons with her » ; il faut dire qu’il installa/laissa ses fils auprès d’elle. « Jeunes chèvres » désigne normalement de jeunes femelles, tandis que « young goats » est rendu sans marquage de sexe par « chevreaux ». « Torrent » doit aussi rester perceptible dans la description du cours d’eau.'
  naturalness: Le français est globalement fluide, narratif et accessible. « Ouvriers étendus pour manger » ajoute toutefois une finalité que le témoin ne formule pas ; « des ouvriers couchés » restitue la posture sans explicitation. Les paradoxes de l’immobilisation sont bien rendus.
  terminology: « Grotte », « sage-femme hébraïque » et « voûte du ciel » sont appropriés. « Chevreaux » est le terme générique exact ici. « Torrent de la rivière » étant peu idiomatique, « le cours torrentueux de la rivière » conserve l’intensité de l’original dans un français naturel.
  issues:
  - severity: medium
    issue: « la confia à ses fils »
    rationale: Cette formulation suggère que les fils reçoivent Marie sous leur garde. Le texte dit plutôt que Joseph place/poste ses fils auprès d’elle.
  - severity: low
    issue: « des ouvriers étendus pour manger »
    rationale: « Pour manger » est une explicitation contextuelle non exprimée par le témoin ; la posture de repas peut être rendue sans ajouter cette finalité.
  - severity: medium
    issue: « jeunes chèvres »
    rationale: En français, l’expression désigne des chèvres femelles jeunes ; « young goats » doit être traduit par « chevreaux » pour ne pas introduire un sexe.
  - severity: low
    issue: « le courant de la rivière »
    rationale: Le témoin parle d’un « torrent » ; « cours torrentueux » préserve cette caractérisation sans calquer une collocation maladroite.
  revised_text: '(1) Il trouva là une grotte, l’y conduisit, installa ses fils auprès d’elle, puis partit chercher une sage-femme hébraïque dans la région de Bethléem.


    (2) Or moi, Joseph, je marchais sans marcher. Je levai les yeux vers la voûte du ciel et la vis immobile. Je regardai dans les airs et, stupéfait, je vis que même les oiseaux du ciel ne bougeaient plus. Je regardai à terre et vis un plat posé là, ainsi que des ouvriers couchés. Leurs mains étaient dans le plat ; ils mâchaient sans mâcher, prenaient de la nourriture sans la prendre et la portaient à leur bouche sans l’y porter. Tous avaient plutôt le visage tourné vers le haut.


    Je vis des moutons que l’on conduisait, mais ils s’étaient immobilisés. Le berger leva la main pour les frapper, mais sa main resta levée. Je regardai le cours torrentueux de la rivière et vis des chevreaux : ils avaient la bouche dans l’eau, mais ne buvaient pas.


    Puis, soudain, tout reprit son cours.'
