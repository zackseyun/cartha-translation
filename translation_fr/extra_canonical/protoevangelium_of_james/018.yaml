  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: fr
  text: '(1) Il trouva là une grotte, l’y conduisit, la confia à ses fils, puis partit chercher une sage-femme hébraïque dans la région de Bethléem.


    (2) Or moi, Joseph, je marchais sans marcher. Je levai les yeux vers la voûte du ciel et la vis immobile. Je regardai dans les airs et, stupéfait, je vis que même les oiseaux du ciel ne bougeaient plus. Je regardai à terre et vis un plat posé là, ainsi que des ouvriers étendus pour manger. Leurs mains étaient dans le plat ; ils mâchaient sans mâcher, prenaient de la nourriture sans la prendre et la portaient à leur bouche sans l’y porter. Tous avaient plutôt le visage tourné vers le haut.


    Je vis des moutons que l’on conduisait, mais ils s’étaient immobilisés. Le berger leva la main pour les frapper, mais sa main resta levée. Je regardai le courant de la rivière et vis de jeunes chèvres : elles avaient la bouche dans l’eau, mais ne buvaient pas.


    Puis, soudain, tout reprit son cours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cave
  choice: grotte
  rationale: « Grotte » est le terme naturel et digne en français pour la cavité servant ici d’abri.
- source_word: Hebrew midwife
  choice: sage-femme hébraïque
  rationale: Cette formulation conserve l’adjectif identitaire du témoin sans le remplacer par une interprétation plus générale.
- source_word: dome of heaven
  choice: voûte du ciel
  rationale: Expression française courante qui préserve l’image cosmologique du firmament voûté.
- source_word: wandering but not wandering
  choice: je marchais sans marcher
  rationale: La formulation paradoxale est maintenue afin de rendre l’expérience d’un mouvement soudainement suspendu, sans l’expliquer davantage.
- source_word: workers reclining
  choice: des ouvriers étendus pour manger
  rationale: « Étendus pour manger » explicite sobrement la posture de repas impliquée par le contexte, tout en gardant l’identité des personnages comme ouvriers.
- source_word: torrent of the river
  choice: le courant de la rivière
  rationale: Ce choix conserve l’idée d’une eau vive sans produire en français l’expression maladroite « torrent de la rivière ».
- source_word: young goats
  choice: jeunes chèvres
  rationale: Rendu générique prudent du témoin anglais, dont la révision directe sur le grec reste en attente.
- source_word: resumed its course
  choice: reprit son cours
  rationale: Locution idiomatique qui exprime naturellement la reprise générale du mouvement.
theological_decisions:
- issue: Nature de l’arrêt du temps ou du mouvement
  choice: Décrire tous les êtres comme immobilisés sans définir le mécanisme du phénomène
  alternative: Affirmer explicitement que le temps lui-même s’est arrêté
  rationale: Le récit donne une série de perceptions paradoxales, mais le témoin fourni ne formule pas une doctrine explicite sur la nature du temps.
- issue: Point de vue de Joseph
  choice: 'Conserver le passage soudain à la première personne : « Or moi, Joseph »'
  alternative: Harmoniser tout le chapitre à la troisième personne
  rationale: Le changement de voix est littérairement et textuellement significatif et ne doit pas être effacé.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions et paradoxes structurants ont été conservés, mais la syntaxe a été légèrement fluidifiée. Projet provisoire fondé sur le témoin anglais public fourni ; une vérification directe de la tradition manuscrite grecque demeure nécessaire.
