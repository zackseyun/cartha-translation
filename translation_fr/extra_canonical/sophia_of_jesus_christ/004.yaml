translation:
  language: fr
  text: 'Marie lui demanda : « Alors, Seigneur, comment pouvons-nous parvenir à connaître cela ? »


    Le Sauveur parfait dit : « Partez des réalités cachées et allez jusqu’au terme des réalités visibles ; l’émanation de la Pensée vous révélera elle-même comment la foi aux réalités invisibles peut être trouvée dans ce qui est visible, réalités qui appartiennent au Père inengendré. Que celui qui a des oreilles pour entendre entende !


    « Le Seigneur du Monde n’est pas appelé “Père”, mais “Ancêtre”, <parce que le Père est> le principe originel de ceux qui deviendront visibles ; cependant, il [] est [l’]Ancêtre sans commencement. Il se contemple en lui-même, comme dans un miroir, étant apparu à sa ressemblance comme l’Auto-Père divin et <comme> celui qui réfléchit au-dessus de ceux qui réfléchissent, le premier existant, le Père inengendré. Il est en effet aussi ancien <que> la lumière qui est devant lui, mais il ne l’égale pas en puissance.


    « Ensuite, il révéla de nombreux êtres réfléchissants, auto-engendrés, égaux en ancienneté et en puissance, subsistant dans la gloire, et même innombrables. Leur peuple est appelé “la Génération au-dessus de laquelle il n’existe aucun royaume”, issue de celui dans lequel vous-mêmes êtes devenus visibles parmi ces <royaumes>. Et toute cette multitude au-dessus de laquelle il n’existe aucun royaume est appelée [] “les Enfants du Père inengendré”, “Dieu”, “[Sauveur]” et “Fils de Dieu”, lui dont la ressemblance demeure avec vous.


    « Il est l’Inconnaissable, rempli de toute gloire indestructible et d’une joie inexprimable. Tous reposent en lui, se réjouissant continuellement, d’une joie inexprimable, de sa gloire qui ne change jamais, et dans une allégresse sans mesure. Jusqu’à présent, cela n’avait jamais été entendu ni connu parmi tous les éons et leurs mondes. »'
