lexical_decisions:
- source_word: Forefather
  choice: Ancêtre
  rationale: « Ancêtre » garde la distinction explicite avec « Père » et reste naturel en français ; la majuscule signale ici un titre cosmologique.
- source_word: unbegotten Father
  choice: Père inengendré
  rationale: « Inengendré » est le terme théologique précis pour celui qui n’a pas été engendré ; « incréé » effacerait la métaphore de génération.
- source_word: emanation of Thought
  choice: émanation de la Pensée
  rationale: Conserve le vocabulaire émanationniste du témoin et traite « Pensée » comme une réalité personnifiée ou hypostatique possible.
- source_word: Self-Father
  choice: Auto-Père
  rationale: Ce composé inhabituel reproduit le caractère technique du titre et évite de le paraphraser selon une doctrine particulière.
- source_word: reflecting / reflector
  choice: réfléchissants / celui qui réfléchit
  rationale: Maintient le jeu lexical lié au miroir, tout en laissant subsister le double sens possible de réflexion intellectuelle et de reflet.
- source_word: aeons
  choice: éons
  rationale: Terme technique usuel pour les réalités ou périodes cosmologiques de ce corpus ; « siècles » serait ici trompeur.
theological_decisions:
- issue: Relation entre le Seigneur du Monde, le Père et l’Ancêtre
  choice: Conserver les titres distincts et les référents pronominaux tels qu’ils apparaissent, sans harmonisation.
  alternative: Identifier explicitement le Seigneur du Monde au Père ou à l’Ancêtre.
  rationale: Le passage présente une hiérarchie et des antécédents parfois ambigus ; une clarification doctrinale supprimerait une tension réelle du témoin.
- issue: La lumière qui est devant lui
  choice: Traduire littéralement et préserver l’inégalité de puissance.
  alternative: Identifier la lumière à une figure divine précise ou reformuler la comparaison.
  rationale: Le témoin ne fournit pas ici d’identification suffisamment sûre.
- issue: Titres collectifs ou singuliers de la multitude
  choice: Garder la série singulière « Dieu », « Sauveur », « Fils de Dieu » après le titre collectif.
  alternative: Mettre tous les titres au pluriel pour les accorder avec « multitude ».
  rationale: La discordance peut être significative et reflète le témoin ; elle ne doit pas être normalisée silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible, avec conservation du vocabulaire cosmologique technique. Les chevrons et crochets du témoin sont maintenus comme signaux de restitution ou de lacune manuscrite. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et non sur une vérification directe du copte.
