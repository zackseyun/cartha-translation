    rationale: Cette solution transforme un titre de génération universelle en titres parentaux et ne conserve pas le même lexème dans ses formes masculine et féminine. Elle ajoute ainsi une interprétation qui n'est pas requise par le témoin.
  - severity: medium
    issue: La lacune manuscrite [] est remplacée par […].
    rationale: Le témoin distingue explicitement les crochets carrés de lacune des chevrons de restitution. Le signe [] doit être conservé tel quel.
  - severity: low
    issue: « redevienne jamais déficiente » suppose un état déficient antérieur.
    rationale: Le témoin dit seulement « never again become defective »; « ne devienne plus jamais déficiente » préserve mieux cette formulation sans présupposé supplémentaire.
