  register: 'Français international moderne, soutenu mais accessible. La traduction est provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer. Les […] marquent une lacune manuscrite et les <…> une restitution éditoriale. Les titres et termes cosmologiques sont rendus sans harmonisation confessionnelle.'
