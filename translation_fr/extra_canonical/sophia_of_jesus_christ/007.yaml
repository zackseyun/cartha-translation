translation:
  language: fr
  text: 'Ses disciples reprirent la parole : « Dis-nous clairement comment ils sont descendus des réalités invisibles, de ce qui est immortel jusqu’au monde de la mortalité. »


    Le Sauveur parfait dit : « Le Fils de l’homme s’unit à sa compagne Sophia et manifesta une puissante lumière androgyne. Son nom masculin est “Sauveur, Père de tous”. Son nom féminin est “Sophia, Mère de tous” ; certains l’appellent “Pistis”.[a]


    « Comme […] une goutte de lumière, tout être qui entre dans le monde est envoyé par lui dans le monde du Tout-Puissant, afin qu’il veille sur lui.[b] Et, par la volonté de Sophia, le lien de son oubli enchaîna la lumière, afin que, par ce moyen, l’affaire puisse être <révélée> au monde entier, plongé dans la misère : l’orgueil et l’aveuglement du Tout-Puissant, ainsi que l’ignorance qui lui donna son nom.


    « Quant à moi, par la volonté de la grande Lumière, je suis venu des lieux d’en haut, <délivrant> de ce lien et mettant fin à l’activité des voleurs. J’ai éveillé cette goutte envoyée par Sophia, afin que, par moi, elle porte beaucoup de fruit, parvienne à la perfection et ne redevienne jamais déficiente, mais que, par moi, le grand Sauveur, elle soit <unie>, afin que sa gloire soit manifestée.[c] Ainsi, Sophia pourrait elle aussi être délivrée de cette déficience, afin que ses […] enfants ne deviennent plus jamais déficients, mais qu’ils reçoivent honneur et gloire, montent vers leur Père et comprennent la parole de la Lumière masculine.


    « Et vous, vous avez été envoyés par le Fils, lui-même envoyé afin que vous receviez la lumière et vous sépariez de l’oubli des autorités. Ainsi, cet oubli ne pourrait plus se manifester à cause de vous, c’est-à-dire le frottement impur qui provient du feu redoutable sorti de leur phallus.[d] Piétinez leur intention mauvaise. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pistis » est un nom grec qui peut signifier « foi » ou « fidélité ». Il est conservé ici comme nom propre.
    reason: Éclairer un nom translittéré sans imposer sa traduction dans le corps du texte.
  - marker: b
    text: Le manuscrit présente une lacune après « Comme ». La construction de la phrase et les référents de « lui » restent incertains.
    reason: Signaler à la fois le dommage textuel et une ambiguïté pronominale réelle.
  - marker: c
    text: Les chevrons signalent des mots restitués par les éditeurs ; le sujet de « soit unie » et le référent de « sa gloire » demeurent ambigus.
    reason: Préserver les marques de restauration et avertir contre une résolution interprétative excessive.
  - marker: d
    text: Le lien syntaxique entre « cet oubli » et « le frottement impur » est difficile ; la traduction conserve la formulation du témoin disponible.
    reason: Rendre visible une difficulté textuelle importante au lieu de la lisser.
lexical_decisions:
- source_word: invisibilities
  choice: réalités invisibles
  rationale: Le pluriel abstrait « invisibilités » serait peu naturel en français ; « réalités invisibles » conserve l’idée de domaines ou entités invisibles sans les préciser indûment.
- source_word: androgynous light
  choice: lumière androgyne
  rationale: Le terme technique et la dualité sexuelle explicite sont conservés.
- source_word: All-Begetter
  choice: Père de tous / Mère de tous
  rationale: Le titre exprime une fonction génératrice universelle ; son genre est accordé à la forme masculine ou féminine du nom, tout en préservant le parallélisme.
- source_word: Pistis
  choice: Pistis
  rationale: Le nom grec traditionnel est translittéré plutôt que traduit par « Foi », afin de ne pas effacer sa fonction de nom propre.
- source_word: fetter
  choice: lien / enchaîna
  rationale: Cette combinaison rend à la fois l’objet qui retient et l’action de lier, dans un français naturel.
- source_word: defective / defect
  choice: déficient / déficience
  rationale: Cette famille lexicale préserve la répétition conceptuelle du témoin et l’idée d’un manque ou défaut ontologique.
- source_word: authorities
  choice: autorités
  rationale: Le terme est gardé dans son sens cosmologique sans importer le terme confessionnel « puissances ».
- source_word: phallus
  choice: phallus
  rationale: Le caractère corporel et explicite du passage est conservé sans euphémisme.
theological_decisions:
- issue: Identité et rôle du « Tout-Puissant »
  choice: Maintenir « le Tout-Puissant » comme désignation interne au récit, y compris lorsqu’il est associé à l’orgueil, l’aveuglement et l’ignorance.
  alternative: Assimiler explicitement cette figure au Dieu suprême ou à un démiurge.
  rationale: Le passage crée une tension théologique propre à son système cosmologique, mais l’extrait seul ne justifie pas une identification interprétative ajoutée.
- issue: Genre de la lumière et des figures salvatrices
  choice: Conserver explicitement « androgyne », « masculine », ainsi que les formes Père/Mère de tous.
  alternative: Neutraliser le genre ou reformuler en catégories purement symboliques.
  rationale: La polarité masculine-féminine structure le passage et ne doit pas être harmonisée avec une doctrine extérieure.
- issue: Référents pronominaux ambigus
  choice: Préserver autant que possible les pronoms et leur ambiguïté, notamment autour de la goutte, du Sauveur et de la gloire.
  alternative: Nommer systématiquement un référent précis.
  rationale: Le témoin anglais, faute de contrôle direct du copte, ne permet pas de résoudre sûrement ces chaînes référentielles.
- issue: Langage sexuel et cosmologique final
  choice: Traduire directement « frottement impur », « feu redoutable » et « phallus ».
  alternative: Euphémiser en « union impure » ou « désir charnel ».
  rationale: Une paraphrase morale ou sexuelle plus familière imposerait une interprétation et atténuerait l’imagerie du texte.
