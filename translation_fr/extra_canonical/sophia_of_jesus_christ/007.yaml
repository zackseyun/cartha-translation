  naturalness: Le texte révisé demeure dans un français moderne, soutenu et lisible. « Engendreur/Engendreuse » est moins courant que « père/mère », mais il est ici justifié par la fidélité à un titre cosmologique technique et par son parallélisme masculin-féminin.
  terminology: « réalités invisibles », « lumière androgyne », « autorités », « phallus » et « frottement impur » sont adéquats. « Tout-Puissant » reste une désignation narrative sans identification doctrinale ajoutée. « Engendreur de tous / Engendreuse de tous » restitue plus exactement « All-Begetter ».
  issues:
