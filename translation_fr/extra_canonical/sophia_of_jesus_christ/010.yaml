lexical_decisions:
- source_word: Perfect One
  choice: le Parfait
  rationale: Rend le titre technique de manière concise et dignifiée, sans l’interpréter comme une simple qualité morale.
- source_word: aeons
  choice: éons
  rationale: Conserve le terme cosmologique technique du document plutôt que de le réduire à « siècles » ou « mondes ».
- source_word: arch-begetter
  choice: premier géniteur
  rationale: Exprime la primauté revendiquée du personnage tout en gardant la notion de génération ; « archigéniteur » serait plus technique mais nettement moins accessible.
- source_word: He Who Is
  choice: Celui qui est
  rationale: Préserve la forme titulaires et l’allusion ontologique sans ajouter une identification confessionnelle.
- source_word: Sons of Light
  choice: Fils de la Lumière
  rationale: Maintient le titre collectif traditionnel et sa majuscule distinctive.
- source_word: Sophia
  choice: Sagesse
  rationale: Dans le titre français, traduit le nom grec pour le rendre intelligible au lectorat général tout en conservant sa portée conceptuelle.
theological_decisions:
- issue: Identité de ceux qui doivent être délivrés de leur aveuglement
  choice: Conserver le pronom « les » et son antécédent immédiat possible, le premier géniteur et ses anges
  alternative: Reformuler pour faire des êtres humains les bénéficiaires de la délivrance
  rationale: Le passage demeure grammaticalement et théologiquement tendu ; la traduction ne résout pas silencieusement l’ambiguïté.
- issue: Autorité des « Fils de la Lumière »
  choice: « autorité sur toutes choses »
  alternative: Limiter explicitement cette autorité aux puissances hostiles
  rationale: Le témoin a une formulation universelle, suivie d’une application aux puissances ; la traduction garde les deux éléments sans restreindre le premier.
- issue: Sujet transcendant nommé dans la conclusion
  choice: « Dieu qui demeure au-dessus du monde »
  alternative: « Dieu supramondain »
  rationale: La formulation choisie reste claire et proche du témoin sans importer une terminologie doctrinale postérieure.
- issue: Dernière désignation, Esprit ou Père
  choice: Retenir « l’Esprit éternel et impérissable » dans le texte principal
  alternative: « le Père éternel, impérissable à jamais »
  rationale: Le segment demandé et la couche anglaise POB donnent « Spirit » ; la forme parallèle plus loin dans le témoin donne « Father ». La variante est signalée plutôt qu’harmonisée.
