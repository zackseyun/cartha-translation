  text: '“Behold! I have disclosed to you the name of the Perfect One, the entire will of the Mother of the holy angels, so that here the masculine [host] may be brought to completion, so that [in the aeons] there [could appear the infinities, as well as] those that [came into existence in the] unfathomable [riches of the Great] Invisible [Spirit, so that they] all [could partake in his benevolence], even the riches [of their repose] without any [kingdom over it].


    “I originated [from the first] sent one, that I could disclose to you He Who Is from the beginning, on account of the pride of the arch-begetter and his angels, because they boast about themselves, saying that they are gods. And I came to free them from their blindness, so that I could announce to everyone concerning the God who dwells above the world.


    [] “Tread, therefore, on their graves, shame their evil intention, break their yoke, and awaken my own. I have granted you authority over everything as the Sons of Light, so that with [your] feet you could tread on their power.”


    These are the matters [the] blessed Savior [spoke, and he vanished] from their midst. [All the disciples] were then in [great, unspeakable joy] in [the Spirit from] that day onward. [And his disciples] began preaching [the] divine Gospel of [the] eternal, indestructible [Spirit]. Amen.


    The Sophia of Jesus Christ'
translation:
  language: fr
  text: '« Voici ! Je vous ai révélé le nom du Parfait, ainsi que toute la volonté de la Mère des saints anges, afin qu’ici l’[armée masculine] parvienne à son accomplissement ; afin que [dans les éons] puissent apparaître [les immensités, ainsi que] ceux qui [sont venus à l’existence dans les] insondables [richesses du Grand] Esprit invisible ; afin qu’ils puissent tous [avoir part à sa bonté], jusqu’aux richesses [de leur repos], sans qu’aucun [royaume ne le domine].[a]


    « Je suis issu du [premier] envoyé afin de vous révéler Celui qui est depuis le commencement. Je suis venu à cause de l’orgueil du premier géniteur et de ses anges, car ils se vantent en disant qu’ils sont des dieux. Je suis venu les délivrer de leur aveuglement, afin d’annoncer à tous le Dieu qui demeure au-dessus du monde.


    « Foulez donc leurs tombeaux, couvrez de honte leur intention mauvaise, brisez leur joug et réveillez ceux qui m’appartiennent. Je vous ai donné autorité sur toutes choses en tant que Fils de la Lumière, afin que, de [vos] pieds, vous fouliez leur puissance. »


    Telles sont les paroles que [le] Sauveur bienheureux [prononça, puis il disparut] du milieu d’eux. [Tous les disciples] furent alors remplis, dès ce jour, d’[une grande joie inexprimable] dans [l’Esprit]. [Et ses disciples] commencèrent à proclamer le divin Évangile de [l’Esprit] éternel et impérissable.[b] Amen.


    La Sagesse de Jésus-Christ'
