lexical_decisions:
- source_word: perfect ones / perfect Savior
  choice: les parfaits / le Sauveur parfait
  rationale: Conserve la répétition et le vocabulaire technique du témoin sans l’interpréter comme une simple maturité morale.
- source_word: Totalities
  choice: Totalités
  rationale: La majuscule signale un terme cosmologique collectif et évite de le réduire au simple sens de « toutes choses ».
- source_word: mind
  choice: intellect
  rationale: « Intellect » convient au contexte métaphysique et se distingue naturellement de « pensée » dans l’énumération.
- source_word: foreknowledge
  choice: prescience
  rationale: Rend l’idée d’une connaissance préalable tout en préservant la formulation théologique du passage.
- source_word: unbegotten
  choice: inengendré
  rationale: Terme français précis qui conserve l’opposition avec ce qui est engendré.
- source_word: Spirit Who Is
  choice: l’Esprit qui est
  rationale: Préserve la valeur titulatoire et ontologique de l’expression sans la paraphraser.
- source_word: unmoving generation
  choice: génération immobile
  rationale: Traduction formelle d’une expression probablement technique, laissée ouverte plutôt que normalisée en « race inébranlable ».
- source_word: indestructability / imperishable
  choice: incorruptibilité / impérissable
  rationale: Distingue la qualité ou sphère abstraite désignée par le premier terme de l’opposition périssable–impérissable formulée ensuite.
- source_word: self-begotten God
  choice: Dieu autoengendré
  rationale: Conserve le terme cosmologique technique et sa tension avec le Père inengendré.
theological_decisions:
- issue: Référent du pronom « il » au début de la réponse
  choice: Conserver « il » sans explicitation
  alternative: Identifier explicitement le Père, l’Esprit ou une autre figure
  rationale: Le passage fourni ne permet pas de résoudre sûrement le référent ; l’ambiguïté doit rester visible.
- issue: Rapport entre les puissances et l’être décrit
  choice: « Toutes sont des puissances équivalentes »
  alternative: Les présenter comme des attributs strictement identiques ou hiérarchisés
  rationale: La traduction maintient leur équivalence déclarée sans imposer une doctrine de l’essence ou des émanations.
- issue: Syntaxe de « in his foreknowledge, of the infinite unbegotten Father »
  choice: « dans sa prescience, celle du Père infini et inengendré »
  alternative: « dans la prescience du Père » ou attribuer deux possesseurs distincts
  rationale: Cette formulation reproduit l’apposition probable tout en laissant perceptible la difficulté syntaxique du témoin.
- issue: Production de corps et d’esprits par d’autres esprits
  choice: Conserver l’énoncé tel quel
  alternative: Réordonner les agents pour rendre le Dieu autoengendré seul producteur
  rationale: Le témoin attribue grammaticalement cette capacité aux esprits de la génération immobile ; la tension cosmologique n’est pas corrigée.
- issue: Différence parmi les incorruptibles
  choice: « Une grande différence règne parmi les êtres incorruptibles »
  alternative: Comprendre la différence comme étant seulement entre corruptible et incorruptible
  rationale: La première phrase est conservée selon son sens immédiat, même si la suite met surtout en contraste le périssable et l’impérissable.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes cosmologiques techniques (« Totalités », « génération immobile », « autoengendré ») sont maintenus afin de ne pas banaliser le système conceptuel du texte. Le présent projet demeure provisoire, car il repose sur le témoin anglais public fourni et attend une vérification directe du copte dans les deux témoins manuscrits.
