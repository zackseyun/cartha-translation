translation:
  language: fr
  text: 'Philippe demanda : « Seigneur, comment donc s’est-il manifesté aux parfaits ? »


    Le Sauveur parfait lui répondit : « Avant que tout ce qui est visible ne devienne visible, la majesté et l’autorité existaient [a] en lui, car il embrasse la totalité des Totalités, tandis que rien ne l’embrasse. En effet, il est tout entier intellect ; il est pensée et réflexion, considération, raisonnement et puissance. Toutes sont des puissances équivalentes, les sources des Totalités. Et toute leur lignée, de la première à la dernière, se trouve dans sa prescience, celle du Père infini et inengendré. »


    Thomas lui demanda : « Seigneur, Sauveur, pour quelle raison celles-ci sont-elles venues à l’existence, et pourquoi ont-elles été révélées ? »


    Le Sauveur parfait répondit : « Je suis issu de l’Infini afin de tout vous révéler. L’Esprit qui est est celui qui engendra, possédant la puissance <d’un> géniteur [b] et la nature de celui qui [donne] forme, afin que puisse être révélée la grande richesse cachée en lui. À cause de sa miséricorde et de son amour, il désira porter du fruit par lui-même, afin de ne pas <jouir> seul de sa bonté, mais pour que d’autres esprits de la génération immobile puissent produire des corps et des esprits, la gloire et l’honneur dans l’incorruptibilité, ainsi que son don infini. De cette manière, son trésor pourrait être manifesté par le Dieu autoengendré, le Père de toute incorruptibilité et de ceux qui viendraient ensuite à l’existence, mais qui ne s’étaient pas encore manifestés visiblement. Une grande différence règne parmi les êtres incorruptibles. »


    Il s’écria : « Que celui qui a des oreilles pour entendre parler des êtres infinis entende ! » Puis : « J’ai parlé à ceux qui sont éveillés ! »


    Il poursuivit [c] : « Tout ce qui est issu de ce qui est périssable périra, parce qu’il est issu de ce qui est périssable. Mais ce qui est issu de ce qui est impérissable ne périra pas : il sera impérissable.


    Par conséquent, beaucoup se sont égarés parce qu’ils ignoraient cette différence, et ils sont morts. »'
  philosophy: optimal-equivalence
