lexical_decisions:
- source_word: He Who Is
  choice: Celui qui est
  rationale: Rend le titre ontologique de façon naturelle et solennelle, sans l’assimiler explicitement à une formule confessionnelle particulière.
- source_word: inexpressible
  choice: inexprimable
  rationale: Préserve l’idée que l’être divin échappe à l’expression, plutôt que de réduire le propos à la seule impossibilité de le décrire.
- source_word: nothing contingent
  choice: rien de contingent
  rationale: Conserve le terme philosophique et la distinction du témoin entre puissances, autorités, réalités contingentes et choses créées.
- source_word: unbegotten
  choice: non engendré
  rationale: Terme précis qui maintient la distinction avec « sans naissance » et « sans commencement ».
- source_word: enigmatic appearance
  choice: apparence énigmatique
  rationale: Préserve l’étrangeté et l’ambiguïté du passage sans transformer « apparence » en forme matérielle définie.
- source_word: cannot be traced out
  choice: on ne peut en retrouver la trace
  rationale: Expression française intelligible qui conserve l’image d’une réalité impossible à sonder ou à circonscrire.
- source_word: blessedness
  choice: béatitude
  rationale: Distingue l’état abstrait de béatitude de l’adjectif « bienheureux » employé auparavant.
- source_word: Father of the World
  choice: Père du Monde
  rationale: Reproduit le titre avec ses majuscules et sans résoudre la portée cosmologique du mot « monde ».
theological_decisions:
- issue: Référent des pronoms dans « he alone »
  choice: « Lui seul se connaît »
  alternative: « mais lui seul, ainsi que quiconque… »
  rationale: Le témoin anglais est syntaxiquement elliptique après « aucune puissance ne l’a connu ». L’ajout minimal du verbe implicite rend la phrase française compréhensible tout en conservant l’affirmation d’auto-connaissance reprise plus loin.
- issue: Passage de « Celui qui est » à « je suis le Grand Sauveur »
  choice: Conserver la transition sans identifier explicitement les deux figures
  alternative: Harmoniser les référents en faisant du Grand Sauveur Celui qui est
  rationale: Le texte maintient une tension entre Celui qui est, le révélateur issu de la Première Lumière et le locuteur. La traduction ne tranche pas cette relation.
- issue: Alternance entre le masculin et le féminin grammatical autour d’« apparence »
  choice: Employer « il » pour Celui qui est, puis « elle » lorsque le sujet grammatical est l’apparence
  alternative: Maintenir partout un pronom masculin
  rationale: Cette alternance respecte la grammaire française sans suggérer que l’apparence constitue nécessairement une entité théologique distincte.
- issue: « deathless »
  choice: « immortel »
  alternative: « exempt de mort »
  rationale: « Immortel » est naturel et digne en français ; il ne précise pas davantage si l’absence de mort est intrinsèque ou acquise.
