  register: 'Français international moderne, soutenu mais accessible. Les périodes ont été légèrement réorganisées pour la clarté, sans effacer les répétitions litaniques ni les tensions conceptuelles. Cette version reste provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte des codex de Nag Hammadi III,4 et de Berlin 8502,3 étant encore en attente.'
