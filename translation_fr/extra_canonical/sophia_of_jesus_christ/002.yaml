    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
translation:
  language: fr
  text: 'Matthieu lui dit[a] : « Seigneur, personne ne peut découvrir la vérité si ce n’est par toi ; enseigne-nous donc la vérité. »


    Le Sauveur dit : « Celui qui est est inexprimable. Aucune puissance ne l’a connu, aucune autorité, rien de contingent ni rien de créé depuis la fondation du monde jusqu’à maintenant. Lui seul se connaît, ainsi que quiconque à qui il veut accorder une révélation par l’intermédiaire de celui qui est issu de la Première Lumière. À partir de maintenant, je suis le Grand Sauveur. C’est parce qu’il est immortel et éternel.


    « Il est éternel, sans naissance, car quiconque est né sera détruit dans la mort. Il est non engendré, sans commencement, car quiconque a eu un commencement aura une fin. Puisque personne ne règne sur lui, il est sans nom, car quiconque porte un nom a été créé par quelqu’un d’autre. Et Celui qui est possède une apparence qui lui est propre[b], différente de tout ce que vous avez vu et compris. Pourtant, c’est une apparence énigmatique qui transcende toutes choses et surpasse le monde. Elle regarde dans toutes les directions à la fois et se contemple elle-même par elle-même.


    « Puisqu’il est infini, il ne peut jamais être compris.


    Il est à jamais indestructible ; rien ne lui ressemble.


    Il est le bien qui ne change jamais.


    Il est sans défaut.


    Il est éternel.


    Il est bienheureux.


    Il ne peut être connu, mais il se connaît lui-même.


    Il est sans mesure ; on ne peut en retrouver la trace.


    Il est parfait, sans imperfection.


    Sa béatitude est indestructible.


    On l’appelle “Père du Monde”. »'
