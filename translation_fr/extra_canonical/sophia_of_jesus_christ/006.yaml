lexical_decisions:
- source_word: the Human / Son of Man
  choice: l’Humain / le Fils de l’homme
  rationale: « L’Humain » conserve la portée cosmologique et le contraste terminologique du passage, tandis que « Fils de l’homme » garde la formule traditionnelle distincte.
- source_word: Primal Human
  choice: l’Humain primordial
  rationale: Rend l’antériorité cosmologique sans employer « homme », qui pourrait réduire le terme au sexe masculin.
- source_word: the Begetter
  choice: l’Engendreur
  rationale: Préserve le rôle actif d’origine exprimé par le titre.
- source_word: Self-Completed Mind
  choice: l’Intellect parvenu de lui-même à la plénitude
  rationale: Formulation explicite qui conserve à la fois l’idée d’autonomie et celle d’accomplissement ou de plénitude.
- source_word: consort
  choice: compagne
  rationale: Terme naturel et digne, sans imposer la catégorie plus précise d’épouse.
- source_word: Sophia
  choice: Sophia
  rationale: Conserve le nom-titre grec traditionnel plutôt que de le réduire silencieusement à « Sagesse ».
- source_word: androgynous
  choice: androgyne
  rationale: Maintient explicitement la double désignation masculine et féminine du premier-né.
- source_word: aeons
  choice: éons
  rationale: Terme technique approprié à la cosmologie du texte, conservé plutôt que normalisé en « siècles ».
- source_word: self-begotten
  choice: autoengendrée
  rationale: Conserve l’idée d’une origine procédant de soi ; l’accord féminin suit « Lumière » en français.
theological_decisions:
- issue: Identité entre « l’Humain » et « le Fils de l’homme »
  choice: Maintien de deux appellations distinctes dans la question
  alternative: Les harmoniser comme deux titres équivalents
  rationale: La question de Barthélemy repose précisément sur leur rapport ambigu ; la traduction ne tranche pas ce que le passage interroge.
- issue: Genre du premier-né androgyne
  choice: Maintien successif du masculin et du féminin selon les noms donnés
  alternative: Employer partout un genre grammatical unique
  rationale: Le texte attribue expressément un nom masculin et un nom féminin ; cette tension doit rester visible.
- issue: Rapport du Christ au Père
  choice: « il tient son autorité de son Père »
  alternative: « il exerce l’autorité à la place de son Père »
  rationale: Cette formulation préserve la provenance de l’autorité sans préciser davantage son mode d’exercice.
- issue: Origine finale du locuteur
  choice: « Je suis issu de la Lumière infinie, autoengendrée et primordiale »
  alternative: « J’ai pris naissance de… »
  rationale: « Suis issu » exprime l’origine sans imposer un processus biologique ou temporel plus précis.
- issue: Référent de la gloire indestructible
  choice: Conservation du possessif « sa »
  alternative: Identifier explicitement la gloire comme celle du Fils de l’homme ou du royaume
  rationale: Le témoin fourni laisse une ambiguïté de référent qu’il convient de ne pas résoudre silencieusement.
