translation:
  language: fr
  text: 'Barthélemy lui demanda alors : « Comment <est-il> appelé [a] “l’Humain” et “le Fils de l’homme” dans l’Évangile ? Lequel des deux se rapporte donc au Fils ? »


    Le Saint lui répondit : « Je veux que tu saches que l’Humain primordial est appelé “l’Engendreur”, “l’Intellect parvenu de lui-même à la plénitude”. Il contempla avec sa compagne, la grande Sophia, et manifesta son fils premier-né, androgyne. Son nom masculin est “Fils de Dieu, premier engendré”, tandis que son nom féminin est “Sophia, première engendrée, Mère de l’univers” ; certains l’appellent “Amour”. Le premier-né, appelé “Christ”, créa, à partir de l’Esprit et de la Lumière, une multitude d’anges innombrables [b] destinés au service, car il tient son autorité de son Père. »


    Ses disciples lui dirent : « Seigneur, révèle-nous ce qui concerne celui qu’on appelle “l’Humain”, afin que nous puissions, nous aussi, connaître précisément sa gloire. »


    Le Sauveur parfait dit : « Que celui qui a des oreilles pour entendre entende ! Parce qu’il tire son origine de la lumière rayonnante, le Père premier engendré est nommé “Adam, l’Œil de Lumière”. Ses saints anges, indicibles et sans ombre, se réjouissent continuellement, dans l’allégresse, des reflets qu’ils ont reçus de leur Père. Le royaume tout entier du Fils de l’homme, appelé “le Fils de Dieu”, est rempli d’une joie indicible et sans ombre, et d’une allégresse immuable : il se réjouit de sa gloire indestructible [c], dont jusqu’à présent on n’avait jamais entendu parler et qui n’avait pas été révélée dans les éons et les mondes issus d’eux par la suite. Je suis issu de la Lumière infinie, autoengendrée et primordiale, afin de tout vous révéler. »'
