  footnotes:
  - marker: a
    text: Le complément « lui » est restitué dans le témoin ; le manuscrit est lacunaire à cet endroit.
    reason: Signaler une restitution éditoriale conservée dans le texte principal.
  - marker: b
    text: Deux pages du manuscrit copte sont perdues ; le récit reprend au milieu d’une phrase.
    reason: Rendre explicite l’importante lacune matérielle.
  - marker: c
    text: L’expression peut aussi se rendre par « l’Homme immortel ». « Humain » souligne ici la figure céleste ou archétypale sans préciser son sexe.
    reason: Documenter un choix lexical théologiquement sensible.
  - marker: d
    text: Le témoin passe d’une désignation grammaticalement masculine de l’Humain immortel à un pronom féminin relatif à sa majesté. Cette discordance est conservée sans être résolue.
    reason: Préserver une ambiguïté réelle du texte transmis.
  - marker: e
    text: Sophia est le mot grec signifiant « Sagesse », employé ici comme nom propre.
    reason: Aider les lecteurs ordinaires sans remplacer le terme technique.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Conserve le terme cosmologique technique plutôt que de le réduire à « âges » ou « mondes », qui résoudraient indûment sa portée dans ce texte.
- source_word: Assembly of the Ogdoad
  choice: Assemblée de l’Ogdoade
  rationale: « Ogdoade » est le terme français établi pour un ensemble de huit dans les cosmologies anciennes ; « Assemblée » garde la valeur collective du témoin.
- source_word: Immortal Human
  choice: Humain immortel
  rationale: Formulation inclusive et littérale qui évite d’identifier automatiquement cette figure à un homme masculin ordinaire.
- source_word: simulacra / likenesses
  choice: représentations
  rationale: Rend l’idée de formes dérivées ou reproduites sans la nuance péjorative que « simulacres » porte souvent en français moderne.
- source_word: originative principle
  choice: principe originel
  rationale: Expression naturelle et digne, laissant ouverte la nature précise de ce principe.
- source_word: firmaments
  choice: firmaments
  rationale: Maintient le vocabulaire cosmologique ancien et sa pluralité inhabituelle.
- source_word: Sophia
  choice: Sophia
  rationale: Conserve le nom propre technique de la figure plutôt que de le traduire silencieusement par « Sagesse ».
theological_decisions:
- issue: Genre grammatical et identité de « Silence »
  choice: Conserver « appelé “Silence” » puis « la majesté qui est la sienne »
  alternative: Harmoniser tous les accords au masculin ou identifier explicitement Silence à une figure féminine
  rationale: Le témoin présente une tension entre l’antécédent masculin « Immortal Human » et le pronom féminin ; la traduction préserve cette tension sans l’expliquer doctrinalement.
- issue: Origine féminine de la vie des éons
  choice: « la vie de tous les éons est venue d’une femelle »
  alternative: Atténuer en « du principe féminin »
  rationale: La formulation directe du témoin est conservée, sans spiritualisation ni atténuation.
- issue: Hiérarchie des êtres célestes
  choice: Conserver la succession dieux, seigneurs, archanges et anges
  alternative: Remplacer « dieux » par « êtres divins »
  rationale: Le texte emploie explicitement une terminologie de dieux au pluriel ; la reformuler imposerait une harmonisation théologique étrangère au passage.
- issue: Rapport entre l’Humain immortel et Sophia
  choice: « sa compagne, Sophia »
  alternative: « son épouse Sophia » ou « sa parèdre Sophia »
  rationale: « Compagne » restitue le rapport sans préciser davantage sa nature conjugale ou technique.
- issue: Comparaison finale ambiguë
  choice: « plus encore que ceux-ci »
  alternative: Identifier explicitement « ceux-ci » aux éons, aux puissances ou aux habitants célestes
  rationale: Le référent demeure incertain dans le témoin ; la traduction ne tranche pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes cosmologiques spécialisés (« éons », « Ogdoade », « firmaments », « Sophia ») sont conservés. Les crochets, points de suspension et chevrons reproduisent les signaux de lacune ou de restitution du témoin anglais public, faute de révision directe du copte. La syntaxe répétitive des chaînes d’émanation est légèrement segmentée pour la lisibilité, sans modifier leur ordre.
