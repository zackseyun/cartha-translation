  language: fr
  text: 'Alors Thomas lui demanda[a] : « Seigneur, Sauveur, combien d’éons sont au-dessus des cieux ? »


    Le Sauveur parfait dit : « Je te félicite de poser une question sur les grands éons, car tes racines demeurent dans les immensités infinies. Lorsque ceux dont j’ai parlé auparavant furent révélés, il [procura…]


    (Les pages coptes 109 et 110 manquent.)[b]


    […] […] et parviennent à une unité, nous les appelons “l’Assemblée de l’Ogdoade”. Elle se manifesta comme androgyne et fut désignée comme étant en partie mâle et en partie femelle. La partie mâle est appelée “Assemblée”, tandis que la partie femelle est appelée “Vie”, afin qu’il soit montré que la vie de tous les éons est venue d’une femelle.


    « Et tous les noms furent reçus du principe originel. En effet, de son harmonie avec sa pensée surgirent très rapidement les puissances appelées “dieux”. En vertu de leur sagesse, [les] dieux des dieux révélèrent des dieux, <et les dieux>, en vertu de leur sagesse, révélèrent des seigneurs. Les seigneurs des seigneurs, en vertu de leurs actes de pensée, révélèrent des seigneurs ; les seigneurs, en vertu de leur puissance, révélèrent des archanges ; et les archanges, en vertu de leurs paroles, révélèrent des anges. […] Des représentations issues d’eux apparurent, possédant une organisation, une forme et un nom pour tous les éons et leurs mondes.


    « Tous les immortels que je viens de décrire exercent leur autorité à partir de l’Humain immortel[c], appelé “Silence”, car, lorsqu’ils contemplèrent en silence, sans parole exprimée, la majesté qui est la sienne[d] fut menée à son accomplissement. Puisque les êtres indestructibles possédaient l’autorité, chacun créa dans l’Ogdoade un grand royaume, ainsi que des trônes, des temples et des firmaments pour leurs majestés respectives, car tous vinrent à l’existence par la volonté de la Mère du Monde. »


    Alors les saints apôtres lui dirent : « Seigneur, Sauveur, parle-nous de ceux qui demeurent dans les éons, car il nous faut nous renseigner à leur sujet. »


    Le Sauveur parfait […] dit : « Vous pouvez m’interroger sur n’importe quoi, et je vous donnerai la réponse.


    « Ils créèrent des armées angéliques — d’innombrables myriades — pour le service et pour leur gloire. Ils créèrent des esprits vierges, lumières inexprimables et inébranlables, car ils ne connaissent ni infirmité ni faiblesse, mais manifestent au contraire la volonté.


    « C’est ainsi que les éons furent rapidement menés à leur accomplissement, avec les cieux et les firmaments, dans la gloire de l’Humain immortel et de sa compagne, Sophia[e]. De là, tous les éons et les mondes, ainsi que ceux qui vinrent ensuite, reçurent le modèle d’après lequel créer leurs représentations, tant dans les cieux du chaos que dans leurs mondes. Et toute nature, à commencer par la révélation du chaos, demeure dans la lumière sans ombre, dans une joie indescriptible et une allégresse inexprimable. Ils jouissent continuellement de leur gloire qui ne se flétrit jamais […] et de leur repos infini, qui est indescriptible parmi tous les éons et toutes leurs puissances venues à l’existence par la suite. Tout ce que je viens de vous dire, je l’ai dit afin que vous puissiez resplendir dans la lumière plus encore que ceux-ci. »'
