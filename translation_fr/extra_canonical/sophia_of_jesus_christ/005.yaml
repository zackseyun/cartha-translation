translation:
  language: fr
  text: '**L’Humain immortel, Sophia et l’Ogdoade**


    Matthieu lui demanda : « Seigneur, Sauveur, comment l’Humain a-t-il été révélé ? »


    Le Sauveur parfait répondit : « Je veux que vous connaissiez celui qui est apparu avant le monde.


    « Au commencement, le Père infini, issu de lui-même, [a] fait par lui-même, était rempli d’une lumière rayonnante et indicible. Lorsqu’il voulut que son image devienne une grande puissance, le principe originel de cette lumière apparut soudain sous la forme de l’Humain androgyne et immortel. Ainsi, par cet Humain immortel, ils pourraient obtenir leur salut et sortir de l’oubli grâce à celui qui a été envoyé comme interprète et qui demeure avec vous jusqu’à la fin des voleurs indigents. Sa compagne est la grande Sophia. Dès le commencement, dans cet Humain, elle fut destinée à l’union par le Père engendré par lui-même, à partir de l’Humain immortel qui apparut le premier, en tant que divinité et royauté. En effet, cela fut révélé par le Père, [b] appelé “l’Humain”, “le Père de lui-même”. Pour manifester sa propre majesté, il créa un éon puissant nommé Ogdoade, auquel fut accordée une grande autorité, jusqu’à régner sur la création indigente.


    « À partir de cette lumière et de l’Esprit mâle triple qui appartient à Sophia, sa compagne, il créa des dieux, des anges et des archanges, des myriades innombrables destinées au service. Car ce Dieu créa la divinité et la royauté, si bien qu’il fut appelé “Dieu des dieux” et “Roi des rois”. En lui, l’Humain primordial possède son intelligence et sa pensée propres : la pensée elle-même, la réflexion et la contemplation, la raison, [c] et la puissance. Toutes les qualités qui existent sont parfaites et immortelles.


    « Pour ce qui est de l’indestructibilité, elles sont véritablement égales ; mais pour ce qui est de la puissance, il existe une différence semblable à celle qui sépare le père du fils, le fils de la pensée, et la pensée de ce qui subsiste ensuite. Comme je l’ai déjà dit, parmi les êtres créés, la monade vient en premier. Et, après tout le reste, tout ce qui apparut fut révélé à partir de sa puissance. Des êtres créés vint tout ce qui fut façonné ; de ce qui fut façonné vint ce qui reçut une forme ; et de ce qui reçut une forme vint ce qui reçut un nom. C’est ainsi que, du commencement à la fin, la différence apparut parmi les êtres inengendrés. »'
