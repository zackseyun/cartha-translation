lexical_decisions:
- source_word: Human
  choice: l’Humain
  rationale: Le substantif capitalisé conserve le caractère cosmologique et archétypal du terme sans le réduire à un homme masculin ordinaire ; il convient aussi à la qualification « androgyne ».
- source_word: Sophia
  choice: Sophia
  rationale: Le nom traditionnel est conservé comme nom propre plutôt que traduit systématiquement par « Sagesse », afin de maintenir son rôle personnel dans le passage.
- source_word: aeon
  choice: éon
  rationale: Terme technique usuel pour une réalité ou émanation du monde suprasensible dans ce corpus.
- source_word: Ogdoad
  choice: Ogdoade
  rationale: Forme française consacrée, évoquant un ensemble ou domaine de huit sans imposer ici une explication doctrinale.
- source_word: self-grown / self-made / self-begotten / Self-Father
  choice: issu de lui-même / fait par lui-même / engendré par lui-même / Père de lui-même
  rationale: Des formulations distinctes conservent autant que possible les nuances du témoin anglais, puisque la vérification directe des termes coptes reste à faire.
- source_word: impoverished
  choice: indigent / indigente
  rationale: « Indigent » garde la notion de pauvreté ou de déficience sans la spiritualiser ni la corriger selon une reconstruction doctrinale.
- source_word: monad
  choice: monade
  rationale: Maintien du terme philosophique technique désignant l’unité première.
theological_decisions:
- issue: Identité de l’Humain primordial
  choice: Employer « l’Humain » avec une majuscule sans l’identifier explicitement au Christ ni à une autre figure.
  alternative: Traduire « l’Homme » ou ajouter une identification christologique.
  rationale: Le texte présente une figure cosmologique distincte, mais son identité exacte demeure théologiquement complexe et ne doit pas être résolue par ajout interprétatif.
- issue: Genre de l’Humain androgyne
  choice: Conserver explicitement « androgyne » et employer « l’Humain ».
  alternative: Masculiniser la figure comme « l’Homme immortel » ou expliciter une double nature sexuelle.
  rationale: Cette formulation préserve la tension du texte sans développer une anthropologie étrangère au témoin.
- issue: Pluralité divine et titres souverains
  choice: Traduire littéralement « des dieux » ainsi que « Dieu des dieux » et « Roi des rois ».
  alternative: Atténuer « dieux » en « êtres divins » ou harmoniser le passage avec un monothéisme systématique.
  rationale: La hiérarchie divine appartient au langage propre de l’œuvre et ne doit pas être normalisée confessionnellement.
- issue: Égalité d’indestructibilité et différence de puissance
  choice: Maintenir côte à côte l’égalité et la différence hiérarchique.
  alternative: Résoudre la tension en faveur d’une égalité absolue ou d’une subordination ontologique.
  rationale: Le passage distingue explicitement l’indestructibilité de la puissance ; la traduction conserve cette distinction.
- issue: « êtres créés » puis « êtres inengendrés »
  choice: Conserver les deux expressions contradictoires en apparence.
  alternative: Corriger la conclusion en « êtres engendrés » ou harmoniser tout le paragraphe.
  rationale: Sans examen direct des témoins coptes, il serait imprudent d’éliminer cette tension textuelle ou conceptuelle.
translation_notes:
  register: 'Français international moderne, soutenu mais lisible. Les termes cosmologiques techniques (« Sophia », « éon », « Ogdoade », « monade ») sont conservés. La syntaxe a été légèrement fluidifiée sans supprimer les enchaînements conceptuels difficiles. Cette version reste provisoire : elle repose sur le témoin anglais public fourni, la révision directe du copte des codices de Nag Hammadi III,4 et de Berlin 8502,3 étant encore en attente. Les lacunes du témoin sont rendues par des appels de note ; la restauration éditoriale « et des archanges » est intégrée au texte français pour sa lisibilité, mais devra être contrôlée sur les éditions coptes.'
