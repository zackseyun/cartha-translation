review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour préserver plus exactement les signaux éditoriaux du témoin anglais. La lacune après « self-grown » ne doit pas être comblée implicitement par la syntaxe française, et la restauration éditoriale <and> ainsi que les parenthèses du témoin doivent rester visibles. Quelques formulations ont aussi été rapprochées du texte témoin sans résoudre ses ambiguïtés syntaxiques.
  naturalness: Le français révisé demeure moderne et soutenu. Il conserve toutefois volontairement certaines séquences lourdes ou ambiguës, notamment dans la description de Sophia, car elles reflètent l’état difficile du témoin et ne doivent pas être harmonisées par interprétation.
  terminology: « l’Humain », « Sophia », « éon », « Ogdoade », « monade », « auto-engendré » et « inengendrés » conviennent au registre cosmologique du passage. « Principe générateur » rend plus précisément « originative principle » que « principe originel ».
  issues:
  - severity: medium
    issue: La lacune signalée par [] après « self-grown » était remplacée dans le corps du texte par une note attachée à « a », ce qui rendait la construction française artificiellement continue.
    rationale: Le témoin distingue explicitement une lacune entre « self-grown » et « self-made ». La traduction doit conserver ce point de dommage textuel sans prétendre le restaurer.
  - severity: medium
    issue: La restauration éditoriale <and> devant « archangels » n’était plus signalée.
    rationale: L’intégration simple de « et » efface une information textuelle fournie par le témoin. Les chevrons doivent être maintenus.
  - severity: low
    issue: Les parenthèses éditoriales autour de « thought », « else » et « thereafter » avaient été en partie lissées.
    rationale: Même si elles alourdissent le français, elles signalent des éléments éditoriaux ou explicatifs du témoin et doivent être préservées dans une traduction de contrôle.
  - severity: low
    issue: « Pour manifester sa propre majesté » ajoutait une finalité absente de « And for his own majesty ».
    rationale: « Pour sa propre majesté » reste plus proche sans expliciter le rapport causal ou intentionnel.
  revised_text: '**L’Humain immortel, Sophia et l’Ogdoade**


    Matthieu lui demanda : « Seigneur, Sauveur, comment l’Humain a-t-il été révélé ? »


    Le Sauveur parfait répondit : « Je veux que vous connaissiez celui qui est apparu avant le monde.


    « Au commencement, le Père infini, né de lui-même, [a] fait par lui-même, qui était rempli d’une lumière rayonnante et indicible, lorsqu’il voulut que son image devienne une grande puissance, le principe générateur de cette lumière apparut soudain comme l’Humain androgyne et immortel, afin que, par cet Humain immortel, ils puissent obtenir leur salut et s’éveiller de l’oubli par l’intermédiaire de celui qui fut envoyé comme interprète et qui demeure avec vous jusqu’à la fin des voleurs indigents. Sa compagne est la grande Sophia qui, en lui, fut dès le commencement destinée à l’union par le Père auto-engendré, à partir de l’Humain immortel qui apparut le premier, en tant que divinité et royauté, car cela fut révélé par le Père, [b] qui est appelé “l’Humain”, “le Père de lui-même”. Et, pour sa propre majesté, il créa un éon puissant, dont le nom est Ogdoade et à qui fut accordée une grande autorité, jusqu’à régner sur la création indigente.


    « À partir de cette lumière et du triple Esprit masculin qui appartient à Sophia, sa compagne, il créa des dieux, des anges <et> des archanges, d’innombrables myriades pour le service. Cela arriva parce que ce Dieu créa la divinité et la royauté, de sorte qu’il fut appelé “Dieu des dieux”, “Roi des rois”. En lui, l’Humain primordial possède son intellect et sa pensée uniques, étant précisément (la pensée), la réflexion et la contemplation, la raison [c] et la puissance. Toutes les qualités qui existent sont parfaites et immortelles.


    « Quant à l’indestructibilité, elles sont en fait égales ; mais quant à la puissance, il y a une différence semblable à celle qui existe entre le père et le fils, <et le fils> et la pensée, et entre la pensée et ce qui reste (par la suite). Comme je l’ai déjà dit, parmi les êtres créés, la monade vient en premier. Et, après toute chose (autre), tout ce qui apparut fut révélé à partir de sa puissance. Des êtres créés apparut tout ce qui fut façonné ; de ce qui fut façonné apparut ce qui fut formé ; et de ce qui fut formé apparut ce qui fut nommé. C’est ainsi que, du commencement à la fin, la différence apparut parmi les êtres inengendrés. »'
