review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : l’incipit du brouillon atténue le fait que les disciples et les sept femmes « continuaient à le suivre » et fait de Jésus le simple objet passif d’un suivi. La question sur la manière dont le Sauveur interagit avec eux est également réduite à son action « à leur égard ». Le reste conserve globalement les ambiguïtés, les lacunes et les enchaînements difficiles du témoin anglais.'
  naturalness: Le français est clair et d’un registre approprié. Quelques ajustements rendent l’ouverture plus exacte et la formulation de la relation du Sauveur avec les disciples plus naturelle, sans lisser les étrangetés volontaires du passage.
  terminology: Les choix « nature fondamentale », « dessein », « autorités », « esprit invisible », « chair », « providence », « destin » et « Lumière infinie » sont cohérents. « Frottement impur » doit demeurer littéral et signalé comme formulation incertaine. Les crochets de lacune sont préservés.
  issues:
  - severity: medium
    issue: L’incipit ne rend pas explicitement que les douze disciples et les sept femmes continuaient à suivre Jésus.
    rationale: « Il fut suivi par… » transforme une action continue des personnages en tournure passive et omet l’idée de continuation présente dans le témoin.
  - severity: medium
    issue: « La manière dont le Sauveur agit à leur égard » ne rend qu’imparfaitement « how the Savior interacts with them ».
    rationale: Le témoin vise la relation ou l’interaction du Sauveur avec eux, non seulement son action unilatérale à leur égard.
  - severity: low
    issue: La phrase sur la chair peut mieux rattacher la description à ce que le Sauveur avait enseigné, tout en conservant sa construction difficile.
    rationale: Une légère reformulation rend la syntaxe française plus lisible sans résoudre la tension entre esprit invisible et chair parfaite.
  revised_text: 'Après être ressuscité d’entre les morts, ses douze disciples et sept femmes continuèrent à le suivre et se rendirent en Galilée, sur la montagne […] appelée « Lieu de la moisson et de la joie ».[a] Lorsqu’ils furent réunis, ils s’interrogeaient avec perplexité sur la nature fondamentale du monde, le dessein, la providence divine, le pouvoir des autorités et la manière dont le Sauveur entre en relation avec eux dans le mystère du dessein divin.


    Le Sauveur apparut, non pas sous sa forme visible d’autrefois, mais comme l’esprit invisible. Son aspect était semblable à celui d’un grand ange rayonnant. Mais je ne dois pas décrire ce à quoi il ressemblait, car aucun être mortel ne pourrait le supporter : il s’agissait d’une chair entièrement pure et parfaite, telle que celle dont il nous avait parlé sur la montagne appelée « des Oliviers », en Galilée.[b]


    Il dit : « Que la paix soit avec vous ! Je vous donne ma paix ! » Tous furent saisis de crainte et de peur.


    Le Sauveur […] rit et leur demanda : « À quoi réfléchissez-vous ? Pourquoi êtes-vous perplexes ? Que cherchez-vous ? »


    Philippe répondit : « La nature fondamentale du monde et son dessein. »


    Le Sauveur leur dit : « Je veux que vous compreniez ceci : tous ceux qui sont nés sur la terre depuis la fondation du monde jusqu’à maintenant sont poussière. Bien qu’ils aient cherché à connaître Dieu, son être et sa ressemblance, ils ne l’ont pas trouvé. Les plus grands sages parmi eux ont formulé des conjectures à partir de l’ordre du monde et de son mouvement, mais leurs conjectures n’ont pas atteint la vérité.


    « Tous les philosophes disent que l’ordre du monde est dirigé de trois manières différentes ; ils sont donc en désaccord. Certains soutiennent que le monde se dirige lui-même. […] D’autres soutiennent que c’est la providence qui le dirige, et d’autres encore, que c’est le destin. Mais aucune de ces opinions n’est juste.


    « Je le répète : aucune des trois propositions que je viens d’exposer ne s’approche de la vérité, car ce sont des conjectures humaines. Quant à moi, je suis issu de la Lumière infinie ; je le connais et je suis ici pour vous dire exactement ce qu’est la vérité.[c] La vie de tout ce qui est issu de soi-même est impure, puisque cela s’est fait soi-même. La théorie de la providence n’a rien de judicieux, et celle du destin manque de discernement.


    « Mais à vous, il est donné de connaître. Quiconque est digne de la connaissance la recevra : quiconque n’a pas été engendré par l’ensemencement d’un frottement impur, mais par celui qui a été envoyé le premier, car celui-ci est un immortel parmi les mortels. »[d]'
