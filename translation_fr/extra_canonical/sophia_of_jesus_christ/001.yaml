translation:
  language: fr
  text: 'Après être ressuscité d’entre les morts, il fut suivi par ses douze disciples et sept femmes, qui se rendirent en Galilée, sur la montagne […] appelée « Lieu de la moisson et de la joie ».[a] Lorsqu’ils furent réunis, ils s’interrogeaient avec perplexité sur la nature fondamentale du monde, le dessein, la providence divine, le pouvoir des autorités et la manière dont le Sauveur agit à leur égard dans le mystère du dessein divin.


    Le Sauveur apparut, non pas sous sa forme visible d’autrefois, mais comme l’esprit invisible. Son aspect était semblable à celui d’un grand ange rayonnant. Mais je ne dois pas décrire ce à quoi il ressemblait, car aucun être mortel ne pourrait le supporter : c’était une chair entièrement pure et parfaite, semblable à celle dont il nous avait parlé sur la montagne appelée « des Oliviers », en Galilée.[b]


    Il dit : « Que la paix soit avec vous ! Je vous donne ma paix ! » Tous furent saisis d’un profond respect et de crainte.


    Le Sauveur […] rit et leur demanda : « À quoi réfléchissez-vous ? Pourquoi êtes-vous perplexes ? Que cherchez-vous ? »


    Philippe répondit : « La nature fondamentale du monde et son dessein. »


    Le Sauveur leur dit : « Je veux que vous compreniez ceci : tous ceux qui sont nés sur la terre depuis la fondation du monde jusqu’à maintenant sont poussière. Bien qu’ils aient cherché à connaître Dieu, son être et sa ressemblance, ils ne l’ont pas trouvé. Les plus grands sages parmi eux ont formulé des conjectures à partir de l’ordre du monde et de son mouvement, mais leurs conjectures n’ont pas atteint la vérité.


    « Tous les philosophes disent que l’ordre du monde est dirigé de trois manières différentes ; ils sont donc en désaccord. Certains soutiennent que le monde se dirige lui-même. […] D’autres soutiennent que c’est la providence qui le dirige, et d’autres encore, que c’est le destin. Mais aucune de ces opinions n’est juste.


    « Je le répète : aucune des trois propositions que je viens d’exposer ne s’approche de la vérité, car ce sont des conjectures humaines. Quant à moi, je suis issu de la Lumière infinie ; je le connais et je suis ici pour vous dire exactement ce qu’est la vérité.[c] La vie de tout ce qui est issu de soi-même est impure, puisque cela s’est fait soi-même. La théorie de la providence n’a rien d’intelligent, et celle du destin manque de discernement.


    « Mais à vous, il est donné de connaître. Quiconque est digne de la connaissance la recevra : quiconque n’a pas été engendré par l’ensemencement d’un frottement impur, mais par celui qui a été envoyé le premier, car celui-ci est un immortel parmi les mortels. »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les points de suspension entre crochets signalent ici une lacune ou un passage endommagé indiqué par le témoin de traduction disponible. Le nom de la montagne est rendu littéralement.
    reason: Informer le lecteur de l’état du texte sans proposer de restitution conjecturale.
  - marker: b
    text: La mention d’une montagne « des Oliviers » située en Galilée est conservée telle quelle, de même que la tension entre l’« esprit invisible » et la « chair » pure et parfaite.
    reason: Éviter de corriger une difficulté géographique ou d’harmoniser une tension anthropologique du texte.
  - marker: c
    text: Le pronom de « je le connais » peut se comprendre comme renvoyant à Dieu mentionné plus haut ; le lien exact devra être vérifié dans les témoins coptes.
    reason: Signaler une ambiguïté référentielle importante liée au fait que la rédaction repose provisoirement sur un témoin anglais.
  - marker: d
    text: La formulation de cette phrase est difficile. « L’ensemencement d’un frottement impur » traduit au plus près une expression corporelle inhabituelle du témoin anglais. La syntaxe laisse aussi incertain le rapport exact entre la personne digne de la connaissance, « celui qui a été envoyé le premier » et « un immortel parmi les mortels ».
    reason: Préserver l’obscurité textuelle et théologique plutôt que la résoudre sans examen direct du copte.
lexical_decisions:
- source_word: fundamental nature
  choice: nature fondamentale
  rationale: Rend le sens ontologique sans introduire le terme technique « essence », qui pourrait surdéterminer le passage.
- source_word: plan
  choice: dessein
  rationale: « Dessein » convient à un agencement intentionnel et permet de conserver le lien avec le « dessein divin » du contexte.
- source_word: authorities
  choice: autorités
  rationale: Maintient la désignation sobre de puissances gouvernantes sans préciser prématurément s’il s’agit d’êtres cosmiques ou d’autorités terrestres.
- source_word: invisible spirit
  choice: l’esprit invisible
  rationale: Conserve l’expression paradoxale et son article défini, sans la paraphraser théologiquement.
- source_word: flesh
  choice: chair
  rationale: Reproduit la matérialité surprenante du témoin, en préservant la tension entre « esprit invisible » et « chair ».
- source_word: cosmic order
  choice: ordre du monde
  rationale: Formulation française naturelle qui conserve la portée cosmologique sans recourir au calque savant « ordre cosmique ».
- source_word: providence
  choice: providence
  rationale: Conserve le terme philosophique et religieux traditionnel employé dans l’énumération des trois théories.
- source_word: fate
  choice: destin
  rationale: Terme moderne et clair pour la puissance ou nécessité supposée régir le monde.
- source_word: Infinite Light
  choice: Lumière infinie
  rationale: La majuscule indique qu’il s’agit ici d’une réalité transcendante désignée comme source, sans ajouter une identification absente du texte.
- source_word: impure rubbing
  choice: frottement impur
  rationale: Rendu volontairement proche de l’expression inhabituelle du témoin anglais afin de ne pas effacer son image corporelle ni résoudre un texte dont la vérification copte reste à faire.
theological_decisions:
- issue: Mode d’apparition du Sauveur
  choice: Conserver ensemble « esprit invisible » et « chair entièrement pure et parfaite ».
  alternative: Harmoniser le passage en comprenant la chair comme une simple apparence spirituelle.
  rationale: Le texte juxtapose ces formulations et leur tension doit rester perceptible.
- issue: Référent du pronom dans « parce que je le connais »
  choice: Employer « je le connais », avec pour antécédent grammatical Dieu.
  alternative: Employer « je la connais » en renvoyant à la Lumière infinie.
  rationale: Le témoin relie le pronom masculin à Dieu mentionné auparavant ; la traduction maintient ce lien tout en signalant l’incertitude en note.
- issue: Identité de « celui qui a été envoyé le premier »
  choice: Ne pas l’identifier davantage.
  alternative: L’identifier explicitement au Sauveur, à une figure céleste ou au premier envoyé.
  rationale: Le passage fourni ne donne pas une identification assez explicite pour l’inscrire dans le corps du texte.
- issue: « Immortel parmi les mortels »
  choice: Conserver la formule littéralement.
  alternative: Paraphraser comme une supériorité spirituelle ou une promesse d’immortalité.
  rationale: La formule peut caractériser l’envoyé ou porter une valeur plus générale ; il convient de ne pas trancher.
