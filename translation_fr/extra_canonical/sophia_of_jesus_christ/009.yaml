lexical_decisions:
- source_word: Sophia
  choice: Sophia
  rationale: Le nom technique est conservé plutôt que traduit par « Sagesse », afin de préserver son emploi comme figure personnelle dans ce traité.
- source_word: consort
  choice: compagne
  rationale: « Compagne » rend la relation corrélative sans introduire l’idée plus précise de mariage portée par « épouse ».
- source_word: male (counterpart)
  choice: partenaire masculin
  rationale: Cette formulation garde l’idée d’un correspondant masculin et évite de réduire le passage à une simple mention biologique.
- source_word: curtain
  choice: voile
  rationale: « Voile » est naturel en français et conserve la fonction de séparation entre deux ordres d’êtres.
- source_word: He Who Is from the beginning
  choice: Celui qui est depuis le commencement
  rationale: La formulation conserve le titre et son ambiguïté ontologique et temporelle.
- source_word: unbegotten
  choice: inengendré
  rationale: Terme théologique précis qui exprime l’absence d’origine par génération.
- source_word: Ogdoad
  choice: Ogdoade
  rationale: Terme français établi pour l’ensemble ou le domaine des huit, sans explicitation doctrinale ajoutée.
- source_word: Son of Man
  choice: Fils de l’homme
  rationale: Expression traditionnelle et intelligible, sans imposer ici une identification interprétative supplémentaire.
theological_decisions:
- issue: Identité et fonction de Sophia
  choice: Conserver « Sophia, la Mère du Monde et la compagne » comme une série de titres.
  alternative: Traduire Sophia par « la Sagesse » ou préciser de qui elle est la compagne.
  rationale: Le témoin fourni ne précise pas explicitement le référent de « compagne » dans cette phrase; l’ajouter résoudrait indûment une ambiguïté.
- issue: Action du Père du Monde
  choice: Maintenir que le Père crée le voile « selon [sa] volonté » afin que sa bienveillance soit manifestée.
  alternative: Reformuler pour expliquer le lien causal ou exonérer le Père des conséquences ultérieures.
  rationale: Le texte présente une tension entre bienveillance, séparation et résultat; la traduction ne doit pas l’harmoniser.
- issue: Deux destinations selon le degré de connaissance
  choice: Préserver l’opposition entre le Père inengendré et la déficience/le repos de l’Ogdoade.
  alternative: Interpréter ces destinations comme salut et condamnation, ou les rendre équivalentes.
  rationale: Le passage distingue les destinations sans en expliciter pleinement la valeur; aucune grille confessionnelle n’est ajoutée.
- issue: Donner des signes
  choice: Traduire littéralement l’acte de donner des signes à Jésus.
  alternative: Interpréter « signes » comme sacrements, mots de passe, preuves morales ou confession de foi.
  rationale: Le sens rituel, cognitif ou symbolique demeure incertain dans le témoin; il faut préserver cette ouverture.
