  text: 'Mary asked him, “Holy Lord, where did your disciples come from, where are they going, and how should they act here?”


    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: fr
  text: 'Marie lui demanda : « Saint Seigneur, d’où viennent tes disciples, où vont-ils et comment doivent-ils se conduire ici ? »


    Le Sauveur parfait leur dit : « Je veux que vous sachiez que Sophia, la Mère du Monde et la compagne, a voulu, à elle seule, sans son partenaire masculin, amener ceux-ci à l’existence. Cependant, selon la volonté du Père du Monde, afin que sa bienveillance insaisissable puisse se manifester, il créa le voile entre les immortels et ceux qui vinrent par la suite, afin que le résultat puisse s’ensuivre : [ … ][a]


    (Pages coptes 115-116 manquantes)[b]


    […] « […], et souffle, et puissent, de deux, devenir un, comme cela était au commencement, afin que vous puissiez porter beaucoup de fruit et monter vers Celui qui est depuis le commencement, dans une joie et une gloire indicibles, ainsi que dans [l’honneur et] le don du [Père du Monde].[c]


    « [Par conséquent], celui qui connaît [le Père d’une connaissance parfaite ira] vers le Père [et reposera dans] le [Père] inengendré. Mais [celui qui le connaît imparfaitement] ira [vers la déficience] et le repos [de l’Ogdoade].[d]


    « [Or], celui qui connaît en silence l’[Esprit] immortel de lumière, par la réflexion et en accord avec la vérité, s’il me donne des signes de l’Invisible, deviendra une lumière dans l’Esprit silencieux. Celui qui connaît le Fils de l’homme dans la connaissance et l’amour, s’il me donne un signe du […] Fils de l’homme, peut aller vers les demeures de ceux qui sont dans l’Ogdoade. »[e]'
