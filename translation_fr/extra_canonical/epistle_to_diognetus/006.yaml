base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: fr
  text: 'En un mot, ce que l’âme est dans le corps, les chrétiens le sont dans le monde.


    L’âme est répandue dans tous les membres du corps, et les chrétiens dans les diverses villes du monde.


    L’âme habite dans le corps, sans pourtant être du corps. De même, les chrétiens habitent dans le monde, sans pourtant être du monde.


    L’âme, qui est invisible, est gardée dans le corps visible. De même, on reconnaît que les chrétiens sont dans le monde, mais leur religion demeure invisible.


    La chair déteste l’âme et lui fait la guerre, bien qu’elle n’ait subi aucun tort de sa part, parce que l’âme l’empêche de s’abandonner aux plaisirs. De même, le monde déteste les chrétiens, bien qu’il n’ait subi aucun tort de leur part, parce qu’ils s’opposent à ses plaisirs.


    L’âme aime la chair qui la déteste, ainsi que ses membres. De même, les chrétiens aiment ceux qui les détestent.


    L’âme est enfermée dans le corps, et pourtant c’est elle qui maintient le corps uni. De même, les chrétiens sont retenus dans le monde comme dans une prison, et pourtant ce sont eux qui maintiennent le monde uni.


    L’âme, bien qu’elle soit elle-même immortelle, habite sous une tente mortelle. De même, les chrétiens vivent en étrangers parmi des réalités périssables, dans l’attente de l’incorruptibilité qui est dans les cieux.[a]


    L’âme devient meilleure lorsqu’elle est traitée durement quant à la nourriture et à la boisson. De même, lorsqu’ils sont punis, les chrétiens deviennent chaque jour de plus en plus nombreux.[b]


    Si grande est la mission à laquelle Dieu les a assignés, et il ne leur est pas permis de s’y dérober.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Incorruptibilité » désigne ici ce qui ne périt pas; le texte l’oppose aux réalités périssables parmi lesquelles vivent les chrétiens.
    reason: Clarifier un terme théologique moins courant sans résoudre davantage la nature exacte de l’espérance céleste.
  - marker: b
    text: 'L’expression peut aussi se traduire plus littéralement : « ils croissent de plus en plus chaque jour »; elle évoque probablement l’augmentation du nombre des chrétiens.'
    reason: Préserver la nuance du verbe de croissance, que la formulation principale explicite légèrement.
lexical_decisions:
- source_word: soul
  choice: âme
  rationale: Terme français naturel et traditionnel, nécessaire pour conserver l’analogie structurante entre l’âme, le corps, les chrétiens et le monde.
- source_word: religion
  choice: religion
  rationale: Conserve le terme du témoin sans le préciser en « foi » ou « culte », ce qui éviterait de résoudre indûment son étendue sémantique.
- source_word: hold together
  choice: maintient … uni
  rationale: Rend l’idée de cohésion plutôt qu’une simple conservation, tout en gardant la force de l’affirmation analogique.
- source_word: tabernacle
  choice: tente
  rationale: Restitue l’image d’une demeure provisoire et mortelle dans un français courant, sans ajouter une connotation cultuelle absente du contexte immédiat.
- source_word: imperishability
  choice: incorruptibilité
  rationale: Terme théologique français établi qui conserve l’opposition exacte avec les réalités périssables.
- source_word: office
  choice: mission
  rationale: « Mission » exprime ici une fonction confiée par Dieu plus naturellement que « office », sans préciser davantage sa nature.
theological_decisions:
- issue: Rapport des chrétiens au monde
  choice: « dans le monde, sans pourtant être du monde »
  alternative: « dans le monde, mais ils n’appartiennent pas au monde »
  rationale: La formulation choisie préserve l’écho johannique et l’ambiguïté ontologique, éthique et sociale du contraste sans la réduire à la seule appartenance.
- issue: Les chrétiens maintiennent le monde uni
  choice: Conserver l’affirmation forte sans explication
  alternative: « contribuent à préserver le monde »
  rationale: Le texte établit une analogie directe avec l’âme qui assure la cohésion du corps; une atténuation interprétative amoindrirait sa tension théologique.
- issue: Immortalité de l’âme
  choice: « bien qu’elle soit elle-même immortelle »
  alternative: Paraphraser ou nuancer l’affirmation
  rationale: Il s’agit d’une prémisse explicite de l’analogie de l’auteur; la traduction la transmet sans l’ériger en commentaire doctrinal supplémentaire.
- issue: Croissance sous la persécution
  choice: « deviennent chaque jour de plus en plus nombreux »
  alternative: « croissent de plus en plus chaque jour »
  rationale: Dans ce parallèle communautaire, l’accroissement numérique est vraisemblable, mais le témoin permet une expression plus générale; la note signale cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Les parallèles répétés entre l’âme et les chrétiens sont conservés pour respecter la structure rhétorique. Le présent dossier ne fournit pas le grec et indique qu’une révision directe de la langue ancienne reste en attente; le projet est donc nécessairement fondé sur le témoin anglais public fourni, avec prudence particulière dans les choix lexicaux et théologiques.
