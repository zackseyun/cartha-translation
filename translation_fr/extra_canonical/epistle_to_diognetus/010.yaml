base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/010.yaml
  text: 'If you also desire this faith, first grasp the full knowledge of the Father.


    For God loved those for whose sake he made the world, to whom he subjected everything on earth, to whom he gave reason and understanding, whom alone he permitted to look up to heaven, whom he created in his own image, to whom he sent his only-begotten Son, to whom he promised the kingdom in heaven, and to whom he will give it—those who have loved him.


    And when you have attained this full knowledge, with what joy do you think you will be filled? How will you love him who loved you first?


    By loving him, you will imitate his goodness. Do not be amazed that a human being can imitate God. One can, if God wills it.


    For happiness does not consist in ruling over one’s neighbors, desiring to have more than weaker people, possessing wealth, or using force against inferiors. No one can imitate God in these matters; indeed, these things lie outside his greatness.


    But whoever takes upon himself his neighbor’s burden, whoever desires to benefit someone worse off in an area where he himself is better off, and whoever supplies those in need with possessions he received from God, becoming a god to those who receive them from him—this person imitates God.


    Then, although you are placed on earth, you will see that God lives in heaven. Then you will begin to declare the mysteries of God. Then you will both love and admire those who are punished because they refuse to deny God. Then you will condemn the deceit and error of the world, when you perceive the true life that is in heaven, when you despise the apparent death that is here on earth, and when you fear the real death reserved for those who will be condemned to the eternal fire, which will punish those delivered over to it until the end.


    Then you will admire those who endure, for righteousness’ sake, the fire that lasts only for a season, and you will count them blessed when you perceive that fire...'
translation:
  language: fr
  text: 'Si toi aussi tu désires cette foi, acquiers d’abord la pleine connaissance du Père.


    Car Dieu a aimé les êtres humains : c’est pour eux qu’il a fait le monde, à eux qu’il a soumis tout ce qui est sur la terre, à eux qu’il a donné la raison et l’intelligence. À eux seuls il a permis de lever les yeux vers le ciel ; il les a créés à sa propre image ; il leur a envoyé son Fils unique ; il leur a promis le royaume qui est dans le ciel, et il le donnera à ceux qui l’auront aimé.


    Lorsque tu seras parvenu à cette pleine connaissance, de quelle joie penses-tu être rempli ? Et combien aimeras-tu celui qui t’a aimé le premier ?


    En l’aimant, tu imiteras sa bonté. Ne t’étonne pas qu’un être humain puisse imiter Dieu : il le peut, si Dieu le veut.


    Car le bonheur ne consiste pas à dominer ses semblables, à vouloir posséder plus que les faibles, à être riche ou à exercer la force contre ceux qui sont moins puissants. Personne ne peut imiter Dieu de cette manière ; bien au contraire, tout cela est étranger à sa grandeur.


    Mais celui qui prend sur lui le fardeau de son prochain, qui veut faire du bien à plus démuni que lui dans le domaine où il est lui-même avantagé, et qui donne aux nécessiteux les biens qu’il a reçus de Dieu, devenant ainsi comme un dieu pour ceux qui les reçoivent de lui, celui-là imite Dieu.


    Alors, bien que tu sois établi sur la terre, tu contempleras Dieu vivant dans le ciel. Alors tu commenceras à proclamer les mystères de Dieu. Alors tu aimeras et admireras ceux qui sont punis parce qu’ils refusent de renier Dieu. Alors tu condamneras la tromperie et l’égarement du monde, lorsque tu discerneras la vraie vie qui est dans le ciel, que tu mépriseras la mort seulement apparente d’ici-bas et que tu craindras la mort véritable. Celle-ci est réservée à ceux qui seront condamnés au feu éternel, lequel punira jusqu’à la fin ceux qui lui auront été livrés.


    Alors tu admireras ceux qui, pour la justice, endurent un feu qui ne dure qu’un temps, et tu les déclareras heureux lorsque tu discerneras ce feu…[a]'
