lexical_decisions:
- source_word: full knowledge (Greek source review pending; likely ἐπίγνωσις)
  choice: pleine connaissance
  rationale: Conserve l’idée d’une connaissance approfondie et accomplie sans la réduire à une simple information intellectuelle.
- source_word: reason and mind
  choice: la raison et l’intelligence
  rationale: Rend les deux facultés distinctes dans un français naturel et dignifié.
- source_word: only begotten Son
  choice: Fils unique
  rationale: Formulation française courante qui exprime l’unicité filiale sans imposer ici une explicitation technique supplémentaire.
- source_word: happiness
  choice: le bonheur
  rationale: Terme direct et accessible, cohérent avec le contraste entre fausse grandeur sociale et imitation de la bonté divine.
- source_word: becomes a God to those who receive
  choice: devenant ainsi comme un dieu pour ceux qui les reçoivent
  rationale: Préserve l’image audacieuse tout en indiquant sa valeur analogique, afin d’éviter de faire du bienfaiteur une divinité au sens propre.
- source_word: righteousness
  choice: la justice
  rationale: Maintient la portée morale et religieuse du terme sans le limiter à l’innocence judiciaire.
theological_decisions:
- issue: Objet de l’amour de Dieu dans la phrase initiale
  choice: Dieu a aimé les êtres humains
  alternative: Dieu a aimé ceux pour qui il a fait le monde
  rationale: Le témoin anglais fourni présente une omission apparente après « loved ». La reprise plurielle décrit l’humanité ; cette formulation restaure minimalement le référent attendu, sous réserve d’une vérification directe du grec.
- issue: Imitation de Dieu
  choice: il le peut, si Dieu le veut
  alternative: cela lui est possible, dès lors qu’il le veut
  rationale: Conserve l’attribution de la possibilité à la volonté divine telle qu’elle apparaît dans le témoin, sans la convertir en simple volonté humaine.
- issue: Le bienfaiteur « comme un dieu »
  choice: comparaison analogique explicitée par « comme »
  alternative: devenant un dieu pour ceux qui reçoivent
  rationale: Préserve la force rhétorique de la participation à la bonté divine sans suggérer une divinisation ontologique non explicitée par le passage.
- issue: Feu éternel et durée du châtiment
  choice: punira jusqu’à la fin
  alternative: punira sans fin
  rationale: La formulation transmise comporte une tension entre « éternel » et « jusqu’à la fin ». Elle est conservée plutôt que résolue doctrinalement.
- issue: Contraste entre mort apparente et mort véritable
  choice: mort seulement apparente d’ici-bas / mort véritable
  alternative: mort visible / mort spirituelle
  rationale: Évite d’identifier explicitement la seconde mort à une catégorie doctrinale absente du texte et maintient le contraste rhétorique.
translation_notes:
  register: Français international moderne, au tutoiement singulier pour conserver l’adresse personnelle continue du texte. Syntaxe rendue plus fluide sans effacer les répétitions rhétoriques (« Alors… »). Projet établi à partir du témoin anglais public fourni ; une révision directe sur le grec demeure nécessaire, en particulier pour la phrase sur l’amour de Dieu, le verbe relatif à la vie de Dieu dans le ciel et les nuances du passage final lacunaire.
