  naturalness: 'Le français est moderne, lisible et d’un registre approprié. Quelques retouches améliorent la fluidité : « Allons donc » est plus idiomatique en tête d’exhortation; la question sur les moqueries et les outrages gagne à intégrer explicitement les participes de moyen (« en laissant… tout en enfermant… »); « placer des gardes » est plus naturel que « donner des gardes ».'
  terminology: « Matière », « terre cuite », « sans âme, sans perception et immobiles », « asservis » et « victimes offertes en sacrifice » conviennent. « L’orfèvre qui travaille l’argent » rend avec davantage de précision le silversmith du témoin, sans employer un terme technique régional ou ambigu.
  issues:
  - severity: low
    issue: La relation entre « se moquer / outrager » et le fait de laisser ou d’enfermer les statues est dissociée dans le texte courant.
    rationale: Le témoin présente les actions de laisser sans garde et d’enfermer comme les moyens mêmes par lesquels les adorateurs raillent et insultent leurs objets de culte. Une construction en « en… / tout en… » préserve mieux ce lien.
  - severity: low
    issue: « L’orfèvre » seul peut désigner un artisan travaillant divers métaux précieux.
    rationale: Le témoin distingue expressément le travailleur de l’argent. Une légère explicitation conserve cette distinction au sein de l’énumération des artisans.
  - severity: low
    issue: « Leur donnez des gardes » est peu idiomatique en français contemporain.
    rationale: « Placez des gardes autour d’eux » exprime naturellement l’idée de poster des gardiens afin de prévenir le vol.
