  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are servants; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: fr
  text: 'Viens donc : débarrasse ton esprit de tous les préjugés qui l’occupent, rejette l’habitude qui t’égare et deviens, pour ainsi dire, un être nouveau, comme si tu recommençais depuis le début, prêt à écouter un récit nouveau, ainsi que tu l’as toi-même reconnu. Examine, non seulement avec les yeux, mais aussi avec l’intelligence, la matière et la forme de ceux que vous appelez et considérez comme des dieux.


    L’un n’est-il pas de pierre, comme celle que nous foulons aux pieds ? Un autre, de bronze, ne vaut pas mieux que les récipients fabriqués pour notre usage. Un autre est de bois, déjà pourri ; un autre, d’argent, et il faut quelqu’un pour le garder de peur qu’on ne le vole ; un autre, de fer, rongé par la rouille ; un autre encore, de terre cuite, pas plus beau que ce qui est destiné aux usages les plus déshonorants.


    Tous ne sont-ils pas faits d’une matière périssable ? Ne sont-ils pas façonnés à l’aide du fer et du feu ? Le sculpteur n’a-t-il pas fait l’un, le bronzier un autre, l’orfèvre un autre et le potier un autre ? Avant que le savoir-faire de ces différents artisans leur donne ces formes, chacun n’aurait-il pas pu recevoir une autre forme et ressembler à l’un de ces divers ustensiles ? Et les récipients qui sont aujourd’hui faits de la même matière ne pourraient-ils pas, s’ils passaient entre les mains des mêmes artisans, devenir semblables à ces dieux ?


    Ces objets que vous adorez maintenant ne pourraient-ils pas être transformés de nouveau par des mains humaines en récipients comme les autres ? Ne sont-ils pas tous sourds et aveugles, sans âme, sans perception et immobiles ? Ne pourrissent-ils pas tous, ne se dégradent-ils pas ?


    Voilà ce que vous appelez des dieux ; c’est à eux que vous êtes asservis, eux que vous adorez, et vous finissez par leur devenir entièrement semblables.


    Voilà pourquoi vous haïssez les chrétiens : parce qu’ils ne tiennent pas ces objets pour des dieux.


    Mais vous-mêmes, qui les considérez maintenant comme des dieux et les adorez, ne les méprisez-vous pas bien davantage ? Ne vous moquez-vous pas plutôt d’eux, ne les outragez-vous pas ? Vous laissez sans surveillance ceux qui sont de pierre ou de terre cuite, tandis que vous enfermez ceux qui sont d’argent ou d’or pendant la nuit et leur donnez des gardes pendant le jour, afin qu’on ne les vole pas.


    Quant aux honneurs que vous pensez leur rendre, s’ils peuvent les ressentir, vous les punissez plutôt par ces honneurs ; mais s’ils ne ressentent rien, vous leur faites outrage en cherchant à les apaiser avec le sang et la graisse des victimes offertes en sacrifice.


    Que l’un de vous subisse pareil traitement ; qu’il accepte qu’on lui fasse cela ! Non, personne ne consentirait de son plein gré à un tel supplice, car un être humain possède perception et raison. Mais une pierre le supporte parce qu’elle est insensible. Ainsi, vous démontrez qu’elle est sensible.[a]


    Je pourrais certes en dire bien davantage pour montrer que les chrétiens ne sont pas asservis à de tels dieux. Mais si quelqu’un juge insuffisant ce qui vient d’être dit, j’estime superflu d’en dire plus.'
