lexical_decisions:
- source_word: prepossessions
  choice: préjugés
  rationale: Terme français courant qui exprime des idées préalables occupant et orientant l’esprit, sans alourdir la phrase.
- source_word: substance
  choice: matière
  rationale: Dans cette critique d’idoles faites de pierre, de métal, de bois ou d’argile, « matière » rend concrètement le sens visé.
- source_word: regard as gods
  choice: considérez comme des dieux / tenez pour des dieux
  rationale: Évite de confondre le jugement intellectuel avec le seul fait de regarder visuellement.
- source_word: earthenware
  choice: terre cuite
  rationale: Expression naturelle désignant ici un objet façonné par le potier.
- source_word: soul-less, senseless, motionless
  choice: sans âme, sans perception et immobiles
  rationale: Préserve la série ternaire et distingue l’absence d’âme de l’absence de faculté sensible.
- source_word: victims
  choice: victimes offertes en sacrifice
  rationale: Explicite le sens sacrificiel ancien du mot « victimes » pour le lecteur moderne.
- source_word: enslaved
  choice: asservis
  rationale: Conserve la force de la métaphore de l’esclavage, centrale dans l’argument.
theological_decisions:
- issue: Statut des objets païens qualifiés de dieux
  choice: Employer « ceux que vous appelez et considérez comme des dieux », puis « ces objets »
  alternative: Les désigner simplement comme « dieux » sans qualification
  rationale: La formulation conserve la perspective polémique de l’auteur sans valider ontologiquement leur divinité.
- issue: Contradiction apparente de la dernière phrase sur la sensibilité de la pierre
  choice: Conserver littéralement la conclusion transmise et la signaler par une note
  alternative: Corriger le texte en « vous démontrez ainsi son insensibilité »
  rationale: Le témoin fourni porte une conclusion en tension avec la phrase précédente. Faute de révision directe du grec, il convient de préserver la difficulté plutôt que de la résoudre silencieusement.
- issue: Alternance entre destinataire singulier et groupe pluriel
  choice: Conserver « tu » dans l’exhortation personnelle initiale, puis « vous » dans l’adresse collective aux adorateurs
  alternative: Uniformiser tout le passage au singulier ou au pluriel
  rationale: Cette alternance reflète le témoin transmis et peut marquer le passage de Diognète personnellement au groupe auquel il appartient.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et les accumulations du passage sont maintenues, avec une syntaxe légèrement allégée. Le texte source fourni est un témoin anglais du grec perdu dans son manuscrit principal ; cette version demeure donc provisoire jusqu’à vérification directe des éditions et copies grecques disponibles.
