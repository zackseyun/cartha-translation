base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: fr
  text: 'Mes enseignements n’ont rien d’étrange, et mes questions rien de pervers. Mais, après avoir été disciple des apôtres, je me présente comme enseignant des nations et je transmets dignement à ceux qui se font disciples de la vérité les enseignements reçus de la tradition.


    En effet, celui qui a été correctement instruit et qui est entré dans l’amitié du Verbe ne cherche-t-il pas à connaître clairement ce que le Verbe a ouvertement révélé aux disciples ? Le Verbe leur est apparu et le leur a exposé en toute clarté. Sans être reconnu par les incroyants, il a communiqué ces choses aux disciples qui, jugés fidèles par lui, ont été instruits des mystères du Père.


    C’est pourquoi il a envoyé le Verbe afin qu’il apparaisse au monde : déshonoré par le peuple, proclamé par les apôtres, il a été cru parmi les nations.[a]


    Ce Verbe était dès le commencement ; il est apparu comme nouveau, tout en se révélant ancien, et il naît toujours jeune dans le cœur des saints.


    Oui, il est éternel, lui qui aujourd’hui a été reconnu comme Fils.[b] Par lui, l’Église s’enrichit, et la grâce se déploie et se multiplie parmi les saints : elle donne l’intelligence, révèle les mystères, annonce les temps, se réjouit au sujet des fidèles et se donne à ceux qui la cherchent, à ceux qui ne rompent pas les engagements de la foi et ne franchissent pas les limites établies par les pères.[c]


    Ainsi, la crainte de la Loi est chantée, la grâce des prophètes est reconnue, la foi des Évangiles est affermie, la tradition des apôtres est gardée et la joie de l’Église éclate.


    Si tu n’attristes pas cette grâce, tu comprendras les enseignements que le Verbe communique par la bouche de ceux qu’il veut, quand il le veut.


    Car, dans tout ce que la volonté du Verbe qui commande nous a poussés à exprimer au prix de grands efforts, nous partageons avec toi, par amour, les réalités qui nous ont été révélées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction distingue celui qui envoie du Verbe envoyé, sans nommer explicitement l’envoyeur dans cette phrase.
    reason: Préserver une ambiguïté référentielle et théologique du témoin disponible.
  - marker: b
    text: « A été reconnu comme Fils » traduit une expression difficile qui peut aussi signifier « a été tenu pour Fils » ou « a été déclaré Fils ».
    reason: Signaler l’incertitude d’une formule christologique susceptible de plusieurs nuances.
  - marker: c
    text: Les « pères » ne sont pas identifiés plus précisément dans le passage ; les « limites » évoquent des bornes reçues qu’il ne faut pas déplacer.
    reason: Éviter d’identifier sans preuve ces pères à un groupe doctrinal ou institutionnel déterminé.
lexical_decisions:
- source_word: Word (Greek source review pending)
  choice: Verbe
  rationale: Dans ce contexte personnel et christologique, « Verbe » est le terme français traditionnel et intelligible pour le Logos ; la majuscule signale qu’il s’agit d’une personne.
- source_word: Gentiles
  choice: nations
  rationale: « Nations » évite le ton aujourd’hui vieilli de « païens » et conserve la portée collective du terme.
- source_word: lessons / discourses
  choice: enseignements
  rationale: Ce terme naturel couvre ici les contenus transmis et les paroles communiquées sans introduire l’idée moderne de cours scolaires.
- source_word: engendered always young
  choice: naît toujours jeune
  rationale: La formulation garde l’image paradoxale d’une naissance continuellement jeune dans le cœur des saints.
- source_word: pledges of faith
  choice: engagements de la foi
  rationale: Le choix conserve l’idée d’obligations ou de gages liés à la fidélité, tout en restant naturel en français.
- source_word: boundaries of the fathers
  choice: limites établies par les pères
  rationale: La métaphore des bornes est préservée sous une forme française claire, sans préciser indûment l’identité des « pères ».
theological_decisions:
- issue: Référents des pronoms dans « He sent forth the Word »
  choice: Conserver la distinction entre celui qui envoie et le Verbe envoyé
  alternative: Faire du Verbe le sujet de toute la phrase
  rationale: Le témoin anglais indique un envoyeur distinct du Verbe, vraisemblablement le Père, mais ne le nomme pas dans cette proposition ; la traduction n’ajoute donc pas ce nom.
- issue: « Today He was accounted a Son »
  choice: « aujourd’hui a été reconnu comme Fils »
  alternative: « aujourd’hui a été engendré comme Fils » ou « est appelé Fils »
  rationale: La formulation demeure énigmatique. « Reconnu » rend l’idée d’être tenu ou compté pour tel sans transformer le passage en affirmation explicite d’un commencement ontologique.
- issue: Personnification grammaticale de la grâce
  choice: Employer « elle » pour reprendre « la grâce »
  alternative: Éviter tout pronom personnel ou reprendre systématiquement le nom
  rationale: Le féminin découle naturellement de la grammaire française et maintient la série rhétorique sans décider si la grâce est strictement personnifiée.
- issue: « faith of the gospels »
  choice: « la foi des Évangiles »
  alternative: « la foi en l’Évangile » ou « la fidélité des Évangiles »
  rationale: La formulation littérale préserve l’ambiguïté entre la foi proclamée dans les Évangiles et la foi qui s’y rapporte.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le tutoiement est conservé dans l’adresse finale pour refléter le singulier du témoin, sans archaïsmes verbaux. Draft provisoire fondé sur le témoin anglais public fourni : le codex grec est perdu, connu par des copies, et la vérification directe du grec reste à effectuer.'
