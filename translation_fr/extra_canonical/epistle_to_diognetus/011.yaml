  - marker: c
    text: Les « pères » ne sont pas identifiés plus précisément dans le passage ; les « limites » évoquent des bornes reçues qu’il ne faut pas déplacer.
    reason: Éviter d’identifier sans preuve ces pères à un groupe doctrinal ou institutionnel déterminé.
  revision_rationale: La révision suit prioritairement les tournures et les référents du texte grec disponible par l’intermédiaire du témoin fourni, tout en contrôlant le sens contre l’audit anglais. Elle corrige les faux glissements de sens, conserve les ambiguïtés christologiques et référentielles, et rétablit le pluriel final sans modifier le sens général du passage.
