base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: fr
  text: 'Quel être humain avait jamais su ce qu’est Dieu avant qu’il ne vienne ?


    Ou bien acceptes-tu les affirmations vaines et insensées de ces philosophes prétentieux ? Certains ont dit que Dieu était le feu — ils appellent Dieu ce vers quoi ils iront eux-mêmes —, d’autres, l’eau, et d’autres encore, l’un des autres éléments créés par Dieu.


    Pourtant, si l’une de ces affirmations mérite d’être acceptée, on pourrait tout aussi bien présenter n’importe quelle autre créature comme étant Dieu.


    Non, tout cela n’est que charlatanisme et tromperie de magiciens.


    Personne ne l’a vu ni connu ; mais lui-même s’est révélé.


    Et il s’est révélé par la foi, car c’est par elle seule qu’il est donné de voir Dieu.


    En effet, Dieu, le Maître et Créateur de l’univers, qui a fait toutes choses et les a disposées avec ordre, s’est montré non seulement plein d’amour pour les humains, mais aussi patient.


    Voilà ce qu’il a toujours été, ce qu’il est et ce qu’il sera : bienveillant, bon, sans passion[a] et vrai. Lui seul est bon.


    Ayant conçu un dessein grand et inexprimable, il ne l’a communiqué qu’à son Fils.


    Tant qu’il a tenu secret et gardé comme un mystère son sage projet, il semblait nous négliger et ne pas se soucier de nous.


    Mais lorsqu’il l’a révélé par son Fils bien-aimé et qu’il a manifesté ce qu’il avait préparé dès le commencement, il nous a tout donné à la fois : avoir part à ses bienfaits, voir et comprendre des mystères[b] auxquels aucun de nous ne se serait jamais attendu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sans passion » signifie ici que Dieu n’est pas dominé ni troublé par des passions ; cela ne veut pas dire qu’il est froid, insensible ou indifférent.
    reason: Le terme théologique ancien peut être gravement mal compris en français moderne.
  - marker: b
    text: 'Le mot « mystères » est sous-entendu ou suppléé dans le témoin transmis ; le sens général est : voir et comprendre ce que Dieu avait préparé.'
    reason: Signale honnêtement le caractère suppléé du terme, indiqué par les parenthèses dans le témoin anglais.
lexical_decisions:
- source_word: what God was
  choice: ce qu’est Dieu
  rationale: La tournure française naturelle conserve la portée de la question sur l’identité ou la nature de Dieu sans la réduire à « qui est Dieu ».
- source_word: pretentious philosophers
  choice: philosophes prétentieux
  rationale: Rend directement le jugement polémique du témoin tout en restant courant et intelligible.
- source_word: elements
  choice: éléments
  rationale: Conserve la référence cosmologique ancienne aux constituants fondamentaux du monde.
- source_word: quackery
  choice: charlatanisme
  rationale: Exprime la dénonciation de pratiques mensongères et pseudo-savantes sans vocabulaire inutilement archaïque.
- source_word: recognized
  choice: connu
  rationale: Dans ce contexte théologique, « connu » exprime mieux qu’« identifié » la connaissance véritable de Dieu.
- source_word: friendly to men
  choice: plein d’amour pour les humains
  rationale: Formulation française naturelle qui transmet la bienveillance divine envers l’humanité, plutôt que le faible « amical ».
- source_word: long-suffering
  choice: patient
  rationale: Terme moderne et clair pour la patience durable de Dieu.
- source_word: scheme / design / purpose
  choice: dessein / projet / ce qu’il avait préparé
  rationale: Une variation contrôlée évite les répétitions pesantes tout en maintenant l’unité du plan divin décrit dans le passage.
- source_word: unutterable
  choice: inexprimable
  rationale: Désigne ce qui ne peut être adéquatement formulé, dans un registre digne mais actuel.
theological_decisions:
- issue: Référent de « before He came »
  choice: avant qu’il ne vienne
  alternative: avant sa venue
  rationale: Le pronom est conservé sans identifier explicitement celui qui vient, puisque le témoin fourni présente une ambiguïté que la traduction ne doit pas résoudre silencieusement.
- issue: Modalité de la révélation « by faith »
  choice: il s’est révélé par la foi
  alternative: il est révélé dans la foi
  rationale: La formulation suit le témoin et maintient la tension entre l’acte divin de révélation et la foi comme seul moyen donné pour voir Dieu.
- issue: Impassibilité divine
  choice: sans passion
  alternative: impassible
  rationale: « Sans passion » reste accessible, mais nécessite une note afin d’éviter le contresens moderne d’un Dieu froid ou indifférent.
- issue: Communication du dessein au Fils seul
  choice: il ne l’a communiqué qu’à son Fils
  alternative: il en a fait part à son Fils seul
  rationale: Conserve l’exclusivité affirmée par le texte sans développer une construction trinitaire absente du passage.
- issue: Apparente négligence divine
  choice: il semblait nous négliger
  alternative: nous avions l’impression qu’il nous négligeait
  rationale: Préserve explicitement l’apparence, sans attribuer à Dieu une négligence réelle ni effacer la tension rhétorique.
- issue: Participation aux bienfaits
  choice: avoir part à ses bienfaits
  alternative: la participation à ses bienfaits
  rationale: La tournure verbale est plus naturelle en français et conserve l’idée de participation aux dons divins.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé dans l’adresse rhétorique au destinataire. La polémique du texte reste nette sans devenir familière. Projet provisoire fondé sur le témoin anglais public fourni, la révision directe du grec étant annoncée comme encore en attente.
