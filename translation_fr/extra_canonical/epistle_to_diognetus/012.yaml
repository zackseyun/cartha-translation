base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/012.yaml
  text: 'Confronted with these truths and listening to them attentively, you will know how much God bestows on those who love him rightly. They become a paradise of delight, a flourishing tree that grows within them, bears every kind of fruit, and is adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life have been planted. Yet the tree of knowledge does not kill; disobedience kills.


    For the Scriptures state clearly that from the beginning God planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge. Because our first parents did not use it genuinely, they were made naked through the serpent’s deceit.


    For there is neither life without knowledge nor sound knowledge without true life. Therefore, one tree is planted near the other.


    Discerning the force of this, and blaming the knowledge practiced apart from the truth of the injunction that leads to life, the apostle says, “Knowledge puffs up, but love builds up.”


    For the person who supposes that he knows anything without the true knowledge testified by life is ignorant. He is deceived by the serpent because he did not love life. But the one who recognizes and desires life with fear plants in hope, expecting fruit.


    Let your heart be knowledge, and your life true reason, properly understood.


    If you bear the tree and pluck its fruit, you will always gather the harvest God looks for—a harvest which the serpent does not touch and deceit does not infect. Eve is not corrupted but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order. As He teaches the saints, the Word is gladdened, through whom the Father is glorified. To him be glory forever and ever. Amen.'
translation:
  language: fr
  text: 'Mis en présence de ces vérités et les écoutant avec attention, vous saurez tout ce que Dieu accorde à ceux qui l’aiment comme il convient. Ils deviennent un paradis de délices : un arbre vigoureux, chargé de toutes sortes de fruits, qui croît en eux-mêmes et se pare de fruits variés.


    Car, dans ce jardin, un arbre de la connaissance et un arbre de la vie ont été plantés. Pourtant, ce n’est pas l’arbre de la connaissance qui donne la mort ; c’est la désobéissance qui la donne.


    En effet, les Écritures disent clairement que, dès le commencement, Dieu a planté au milieu du paradis un arbre [de la connaissance et un arbre] de la vie[a], révélant la vie par la connaissance. Mais, parce que nos premiers parents n’en ont pas fait un usage pur, la tromperie du serpent les a laissés nus.


    Car il n’y a ni vie sans connaissance, ni connaissance sûre sans vie véritable. C’est pourquoi les deux arbres ont été plantés l’un près de l’autre.


    L’apôtre a discerné la portée de cela. Reprenant la connaissance que l’on cultive en dehors de la vérité du commandement qui conduit à la vie, il dit : « La connaissance rend orgueilleux, mais l’amour fait grandir. »


    Celui qui s’imagine connaître quelque chose sans la connaissance véritable, celle dont la vie rend témoignage, ne connaît rien. Il est égaré par le serpent, parce qu’il n’a pas aimé la vie. Mais celui qui, avec crainte, reconnaît la vérité et recherche la vie plante dans l’espérance, dans l’attente du fruit.


    Que la connaissance soit ton cœur, et que ta vie soit la parole véritable accueillie en toi[b].


    Si tu portes cet arbre et en cueilles le fruit, tu récolteras toujours les fruits que Dieu désire, ceux auxquels le serpent ne touche pas et que la tromperie ne souille pas. Ève n’est pas corrompue, mais elle est crue vierge[c] ;


    le salut se manifeste, les apôtres reçoivent l’intelligence, la Pâque du Seigneur poursuit son cours, les assemblées se réunissent et [toutes choses] sont harmonieusement ordonnées[d]. Et tandis qu’elle instruit les saints, la Parole se réjouit ; par elle, le Père est glorifié. À lui soit la gloire pour les siècles des siècles. Amen.'
