    reason: Rendre transparente l’incertitude textuelle héritée de la base documentaire fournie.
lexical_decisions:
- source_word: knowledge / Greek γνώσις (as reflected in the witness)
  choice: connaissance
  rationale: Maintient le motif directeur qui relie l’arbre de la connaissance, la connaissance véritable et la citation apostolique.
- source_word: charity / Greek ἀγάπη (as reflected in the witness)
  choice: amour
  rationale: Terme français actuel et naturel, sans la restriction moderne de « charité » à l’assistance matérielle.
- source_word: builds up / Greek οἰκοδομεῖ (as reflected in 1 Co 8.1)
  choice: fait grandir
  rationale: Exprime naturellement l’effet constructif de l’amour tout en restant accessible ; « édifie » aurait été plus formel mais moins courant.
- source_word: true reason / λόγος (source-language identification provisional)
  choice: la parole véritable accueillie en toi
  rationale: Conserve l’ambivalence entre parole, discours et raison sans imposer ici une identification christologique ; une note signale la difficulté.
- source_word: the Word
  choice: la Parole
  rationale: La majuscule rend la référence personnelle probable dans la conclusion, où la Parole enseigne et où le Père est glorifié par elle.
- source_word: Passover of the Lord
  choice: la Pâque du Seigneur
  rationale: « Pâque » convient au contexte chrétien ancien et préserve la résonance pascale sans préciser davantage le référent.
theological_decisions:
- issue: Rapport entre connaissance, vie et désobéissance
  choice: Conserver l’affirmation que la connaissance ne tue pas, tandis que la désobéissance donne la mort
  alternative: Présenter l’arbre de la connaissance lui-même comme mortifère
  rationale: Le passage distingue explicitement la connaissance de son mauvais usage et attribue la mort à la désobéissance.
- issue: Référence à Ève comme vierge
  choice: « Ève n’est pas corrompue, mais elle est crue vierge »
  alternative: Harmoniser la phrase avec Marie, l’Église ou une nouvelle Ève
  rationale: Le témoin transmis formule une affirmation inhabituelle et ambiguë. La traduction la conserve sans lui imposer une interprétation doctrinale.
- issue: Identité de la « parole véritable » dans l’exhortation
  choice: Minuscule dans l’exhortation, majuscule dans la conclusion clairement personnelle
  alternative: Employer « la Parole » avec une majuscule dans les deux occurrences
  rationale: Cette distinction préserve l’ambiguïté de la première occurrence tout en rendant le caractère personnel de la dernière.
- issue: Crainte dans la recherche de la vie
  choice: Conserver « avec crainte »
  alternative: Paraphraser par « avec respect »
  rationale: La formulation garde la tension religieuse du texte sans réduire la crainte à une simple émotion ni la définir doctrinalement.
translation_notes:
  register: Français international moderne, digne et lisible. Le vouvoiement est employé dans l’ouverture adressée au groupe, puis le tutoiement est conservé dans l’exhortation individuelle, conformément au changement de nombre du témoin. Traduction provisoire fondée sur le témoin anglais public de J. B. Lightfoot et éclairée par les termes grecs identifiables ; une vérification directe et complète du grec demeure souhaitable, d’autant que le manuscrit principal est perdu et connu par des copies.
