base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: fr
  text: 'Les chrétiens ne se distinguent pas du reste de l’humanité par le pays où ils habitent, par leur langue ou par leurs coutumes.


    Ils n’habitent pas, en effet, dans des villes qui leur seraient propres, ils n’emploient pas une langue particulière et ne mènent pas un genre de vie hors du commun.


    Ils n’ont pas non plus quelque invention découverte par l’intelligence ou les recherches d’hommes ingénieux, et ils ne se font pas les maîtres d’une doctrine humaine, comme certains le font.


    Ils habitent au contraire dans des villes grecques ou barbares[a], selon le lot qui est échu à chacun, et ils suivent les coutumes locales pour les vêtements, la nourriture et les autres aspects de la vie. Pourtant, la manière dont ils vivent en citoyens est admirable et, de manière reconnue, contraire à ce qu’on attendrait.


    Ils habitent leur propre pays, mais comme des hôtes de passage. Ils prennent part à tout comme des citoyens, tout en supportant tout comme des étrangers. Toute terre étrangère est pour eux une patrie, et toute patrie leur est une terre étrangère.


    Ils se marient comme tout le monde et ont des enfants, mais ils n’abandonnent pas leurs nouveau-nés[b].


    Ils partagent leur table, mais non leur lit[c].


    Ils sont dans la chair, mais ne vivent pas selon la chair[d].


    Ils passent leur vie sur la terre, mais leur citoyenneté est dans le ciel.


    Ils obéissent aux lois établies et, par leur manière de vivre, ils vont au-delà de ce que les lois exigent.


    Ils aiment tout le monde, et tout le monde les persécute.


    On ne les connaît pas, et pourtant on les condamne. On les met à mort, et pourtant ils reçoivent la vie.


    Ils sont pauvres, et pourtant ils enrichissent beaucoup de gens. Ils manquent de tout, et pourtant ils ont tout en abondance.


    Ils sont déshonorés, et pourtant, dans leur déshonneur même, ils sont glorifiés. On dit du mal d’eux, et pourtant on leur donne raison.


    On les insulte, et ils bénissent ; on les outrage, et ils témoignent du respect.


    Ils font le bien, mais sont punis comme des malfaiteurs. Une fois punis, ils se réjouissent comme si cela leur donnait la vie.


    Ils sont combattus par les Juifs comme des étrangers, et persécutés par les Grecs[e] ; pourtant, ceux qui les détestent ne peuvent expliquer la raison de leur hostilité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’usage gréco-romain, le mot « barbares » désigne les peuples qui ne parlent pas grec ; il n’a pas ici nécessairement le sens moderne de « sauvages » ou de « cruels ».
    reason: Éviter un contresens moderne tout en conservant la catégorie historique du texte.
  - marker: b
    text: L’expression renvoie probablement à l’exposition des nouveau-nés, pratique antique consistant à abandonner un enfant dont la famille ne voulait pas.
    reason: Éclairer le contexte social antique sans surinterpréter le texte principal.
  - marker: c
    text: Le mot grec désigne le lit ou la couche. La formule oppose le partage des repas à l’absence de partage sexuel ; elle répond vraisemblablement à des soupçons d’immoralité dirigés contre les chrétiens.
    reason: Refléter le terme grec, plus précis que « femmes », et éclairer l’antithèse concise.
  - marker: d
    text: Ici, « la chair » peut désigner la condition humaine corporelle et, dans l’expression « selon la chair », une manière de vivre gouvernée par des tendances humaines désordonnées. Le parallélisme demeure volontairement dense.
    reason: Préserver la portée théologique plurielle du terme.
  - marker: e
    text: Dans ce contexte, « les Grecs » désigne les populations grecques ou gréco-romaines, mises en contraste avec « les Juifs ».
    reason: Situer la désignation ancienne sans la convertir en une catégorie religieuse plus large.
lexical_decisions:
- source_word: locality / cities of Greeks and barbarians
  choice: pays où ils habitent / villes grecques ou barbares
  rationale: Rend clairement le contraste géographique du témoin tout en conservant la terminologie antique « barbares », expliquée en note.
- source_word: constitution of their own citizenship
  choice: la manière dont ils vivent leur citoyenneté
  rationale: Évite le sens politique moderne trop étroit de « constitution » et exprime le mode de vie civique manifesté par les chrétiens.
- source_word: sojourners
  choice: résidents de passage
  rationale: Formulation moderne et naturelle qui préserve l’idée d’une présence réelle, mais non définitive.
- source_word: cast away their offspring
  choice: n’abandonnent pas leurs nouveau-nés
  rationale: Dans le contexte antique, l’expression vise vraisemblablement l’exposition des nourrissons ; le texte principal reste lisible et la note explicite la pratique.
- source_word: in the flesh / after the flesh
  choice: dans la chair / selon la chair
  rationale: Maintient le parallélisme et la tension théologique traditionnels sans réduire « chair » au seul corps physique.
- source_word: citizenship is in heaven
  choice: leur citoyenneté est dans le ciel
  rationale: Conserve la métaphore civique et son orientation céleste sans la paraphraser doctrinalement.
- source_word: Greeks
  choice: les Grecs
  rationale: Préserve la désignation du témoin ancien ; une note indique qu’elle peut viser plus largement les non-Juifs du monde gréco-romain.
theological_decisions:
- issue: Rapport entre existence corporelle et conduite « selon la chair »
  choice: « Ils vivent dans la chair, mais non selon la chair »
  alternative: « Ils ont un corps, mais ne vivent pas selon ses désirs »
  rationale: La formulation retenue conserve l’ambiguïté morale et théologique de « chair » au lieu de l’identifier exclusivement au corps ou aux désirs physiques.
- issue: Citoyenneté terrestre et céleste
  choice: Conserver simultanément la participation civique terrestre et la citoyenneté céleste
  alternative: Présenter les chrétiens comme détachés de toute responsabilité terrestre
  rationale: 'Le passage affirme les deux réalités : ils prennent part à la vie commune comme citoyens, tout en situant leur citoyenneté ultime dans le ciel.'
- issue: « Ils reçoivent la vie » malgré leur mise à mort
  choice: Préserver le paradoxe sans préciser s’il s’agit de résurrection, de vie éternelle ou de vitalité spirituelle
  alternative: « Dieu les ressuscite »
  rationale: Le témoin fourni n’explicite pas ici le mécanisme théologique ; la traduction ne doit pas résoudre cette tension.
- issue: Dépassement des lois
  choice: « ils vont au-delà de ce que les lois exigent »
  alternative: « ils sont au-dessus des lois »
  rationale: La formulation évite de suggérer qu’ils seraient dispensés d’obéir aux lois, puisque la phrase affirme explicitement leur obéissance.
translation_notes:
  register: 'Français international moderne, digne et accessible. Les antithèses et parallélismes du passage ont été conservés, avec des phrases légèrement actualisées pour la fluidité. La traduction reste provisoire : la donnée fournie est un témoin anglais du domaine public, et la vérification directe du grec transmis par les copies du Codex Argentoratensis reste à effectuer.'
