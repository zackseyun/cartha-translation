review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire. Le grec de Diognète 5 confirme la structure antithétique générale, mais le projet interprète trop librement quelques expressions : « leur enseignement » ne correspond pas à l’absence d’« invention » ou de découverte intellectuelle ; « de l’aveu de tous » ajoute une universalité absente ; et κοιτὴ (« lit », avec connotation sexuelle) ne doit pas être réduit à « femmes ». La voix passive de la dernière phrase est également mieux conservée.'
  naturalness: 'Le français est globalement clair, moderne et digne. Quelques formulations gagnent en précision et en naturel : « selon le lot qui est échu à chacun », « leur manière de vivre en citoyens », et « hôtes de passage ».'
  terminology: '« Barbares », « chair », « citoyenneté » et « Grecs » sont des choix recevables, avec des notes utiles. La note sur « les Grecs » doit éviter d’affirmer que le mot désigne les non-Juifs : dans ce contraste historique, il vise les Grecs / païens gréco-romains, sans équivaloir lexicalement à « non-Juifs ».'
  issues:
  - severity: high
    issue: « Leur enseignement n’est pas non plus une invention... »
    rationale: Le texte grec nie que les chrétiens aient une découverte ou une invention issue de la pensée et de l’application d’hommes curieux ; il ne qualifie pas directement leur enseignement. La formulation actuelle déplace le référent et atténue le parallélisme avec « doctrine humaine ».
  - severity: medium
    issue: « de l’aveu de tous »
    rationale: ὁμολογουμένως signifie « de manière reconnue / avouée », non « reconnue par tous ». L’ajout de « tous » est injustifié.
  - severity: high
    issue: « Ils partagent leur table, mais non leurs femmes »
    rationale: Le grec oppose une table commune à une couche / un lit non commun (κοινὴ τράπεζα, οὐ κοινὴ κοίτη). « Femmes » suit le témoin anglais mais ne reflète pas exactement le mot grec et introduit une asymétrie absente du texte.
  - severity: medium
    issue: « Les Juifs leur font la guerre... et les Grecs les persécutent »
    rationale: 'Le grec formule ces deux actions au passif : ils sont combattus par les Juifs et persécutés par les Grecs. Conserver le passif souligne leur condition de personnes visées.'
  - severity: low
    issue: 'Note e : « les non-Juifs »'
    rationale: Cette explication risque de transformer « Grecs » en catégorie religieuse générale. Une note historique plus limitée préserve mieux la désignation du texte.
