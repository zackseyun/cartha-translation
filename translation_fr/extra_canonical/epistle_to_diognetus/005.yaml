  rationale: La révision rétablit les référents et les images du grec tout en conservant le registre moderne et les paradoxes caractéristiques du chapitre. Elle corrige surtout « enseignement », l’universalisation de « de l’aveu de tous », et « femmes » pour « lit/couche ». Les notes sont conservées aux mêmes ancres et ajustées là où elles risquaient de surinterpréter le vocabulaire historique.
