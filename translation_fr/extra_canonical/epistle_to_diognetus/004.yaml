base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: fr
  text: 'D’autre part, leurs scrupules au sujet des aliments, leur superstition concernant le sabbat, la vanité de leur circoncision, ainsi que le faux-semblant de leurs jeûnes et de leurs nouvelles lunes sont choses ridicules et indignes de toute considération ; je ne pense [pas][a] que tu aies besoin de l’apprendre de moi.


    En effet, parmi les choses que Dieu a créées pour l’usage des êtres humains, accueillir les unes comme bien créées, mais rejeter les autres comme inutiles et superflues, n’est-ce pas impie ?


    Et mentir au sujet de Dieu, comme s’il interdisait de faire quelque bien que ce soit le jour du sabbat, n’est-ce pas sacrilège ?


    De même, se glorifier de la mutilation de la chair comme d’un signe d’élection, comme si cela leur valait d’être tout particulièrement aimés de Dieu, n’est-ce pas ridicule ?


    Observer les astres et la lune, respecter scrupuleusement les mois et les jours, puis répartir selon leurs propres impulsions les dispositions de Dieu et les changements des saisons, faisant des uns des fêtes et des autres des temps de deuil : qui y verrait une manifestation de piété plutôt qu’une grande folie ?


    Ainsi, les chrétiens ont raison de se tenir à l’écart de la sottise et de l’erreur communes des Juifs, ainsi que de leur minutie excessive et de leur orgueil : je considère que tu en as été suffisamment instruit. Mais quant au mystère de leur propre religion[b], ne t’attends pas à pouvoir en être instruit par un être humain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « pas » est une restitution signalée par le témoin anglais fourni ; l’examen direct du grec reste à effectuer.
    reason: Préserver visiblement l’incertitude textuelle indiquée dans la base documentaire.
  - marker: b
    text: 'Ou : « de leur culte propre » ou « de leur propre piété ».'
    reason: Le vocabulaire religieux peut couvrir la religion vécue, le culte ou la piété ; le témoin anglais seul ne permet pas de trancher avec certitude.
lexical_decisions:
- source_word: meats
  choice: aliments
  rationale: Le terme vise ici les distinctions alimentaires ; « aliments » est naturel et plus large que « viandes ».
- source_word: dissimulation / pretense
  choice: faux-semblant
  rationale: Conserve l’accusation d’une observance ostensible ou trompeuse sans préciser indûment le mécanisme de cette hypocrisie.
- source_word: profane
  choice: sacrilège
  rationale: Dans cette question rhétorique portant sur un mensonge attribué à Dieu, « sacrilège » rend naturellement la gravité religieuse du terme.
- source_word: token of election
  choice: signe d’élection
  rationale: Préserve le vocabulaire théologique de l’élection sans l’interpréter comme simple identité collective.
- source_word: religion
  choice: religion
  rationale: Rendu direct et intelligible ; une note signale que la notion peut aussi évoquer leur culte ou leur piété propre.
theological_decisions:
- issue: Portée de la polémique antijuive du passage
  choice: Traduire fidèlement les généralisations et jugements de l’auteur ancien, sans les adoucir ni les amplifier.
  alternative: Reformuler en visant seulement certaines pratiques ou certains groupes juifs.
  rationale: Le texte transmis formule une critique générale. Une traduction ne doit pas corriger silencieusement sa portée historique, même si celle-ci appelle une lecture contextualisée.
- issue: Interdiction du bien le jour du sabbat
  choice: Conserver la formulation polémique « comme s’il interdisait de faire quelque bien que ce soit ».
  alternative: Expliquer qu’il s’agit de l’interprétation que l’auteur prête à ses adversaires.
  rationale: La tournure « comme si » marque déjà qu’il s’agit d’une accusation rhétorique, et non d’une citation neutre de la loi juive.
- issue: Instruction humaine et mystère chrétien
  choice: Conserver l’affirmation énigmatique selon laquelle ce mystère ne peut être enseigné par un être humain.
  alternative: Préciser qu’il doit être révélé par Dieu.
  rationale: Le passage ne nomme pas explicitement la source de cette instruction ; la tension théologique doit rester ouverte.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement est conservé parce que l’épître s’adresse directement à Diognète au singulier. Les questions rhétoriques et la vigueur polémique du témoin sont maintenues. Puisque la source grecque n’a pas encore fait l’objet d’un examen direct et que le manuscrit principal est perdu, cette proposition demeure explicitement fondée sur le témoin anglais public fourni.
