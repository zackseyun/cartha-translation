lexical_decisions:
- source_word: δημιουργία / cognate wording reflected by “creating … inscrutable creation”
  choice: façonnait / œuvre
  rationale: Conserve le langage d’action créatrice sans employer « création » dans l’exclamation, où le sens paraît viser l’œuvre ou le dessein divin plutôt que le monde créé.
- source_word: λύτρον
  choice: rançon
  rationale: Terme français direct qui garde l’image du prix de délivrance sans préciser au-delà du texte à qui ce prix serait versé.
- source_word: δίκαιος / δικαιοσύνη / justified (as reflected in the witness)
  choice: Juste / justice / être déclarés justes ou rendre justes
  rationale: Maintient le réseau lexical de la justice tout en variant légèrement la syntaxe selon le contexte français.
- source_word: ἀνταλλαγή (reflected by “exchange”)
  choice: échange
  rationale: Préserve l’image centrale de la substitution réciproque sans lui imposer une construction doctrinale plus détaillée.
- source_word: τροφεύς (reflected by “nurse”)
  choice: celui qui nous nourrit
  rationale: Évite le sens moderne principalement médical de « infirmier » et exprime la fonction nourricière visée.
- source_word: νοῦς (reflected by “mind”)
  choice: intelligence
  rationale: « Intelligence » est naturel et digne en français, tout en conservant la portée intellective du terme.
- source_word: ἄφθαρτος / φθαρτός (reflected by “incorruptible / corruptible”)
  choice: Incorruptible / êtres corruptibles
  rationale: Conserve l’antithèse formelle et sa portée à la fois physique et morale potentielle.
theological_decisions:
- issue: Portée de la rançon
  choice: « livré son propre Fils en rançon pour nous »
  alternative: Préciser que la rançon est payée à Dieu, à la mort ou au diable
  rationale: Le passage ne nomme aucun destinataire ; la traduction conserve cette indétermination.
- issue: Imputation, participation ou représentation dans le « doux échange »
  choice: Conserver les formulations « cachée dans » et « rend justes »
  alternative: Employer un vocabulaire confessionnel technique d’imputation ou de transfert juridique
  rationale: Le texte associe couverture, justification et échange, mais ne systématise pas leur mécanisme.
- issue: Dignité accordée par la bonté de Dieu
  choice: « rendus dignes par la bonté de Dieu »
  alternative: « mériter la vie » ou « être jugés dignes »
  rationale: La formulation maintient l’initiative de la bonté divine et la tension du témoin anglais sans transformer le passage en affirmation explicite de mérite autonome.
- issue: Le sujet qui prend les péchés sur lui
  choice: Dieu demeure le sujet grammatical du paragraphe
  alternative: Identifier explicitement le Fils comme celui qui prend les péchés
  rationale: Le témoin fourni rattache cette action à Dieu avant de distinguer le don de son Fils ; la traduction ne résout pas silencieusement cette tension.
- issue: Titre « Fils »
  choice: Fils
  alternative: Serviteur ou Enfant
  rationale: Le contexte et le témoin fourni emploient « Son » et « Son of God ». Une vérification directe du grec demeure toutefois nécessaire pour évaluer toute nuance possible de παῖς.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les parallélismes et exclamations rhétoriques ont été conservés. Les majuscules dans les séries antithétiques mettent en relief les désignations christologiques sans ajouter de terminologie confessionnelle. La répétition « capable/incapable » et le champ lexical de la justice ont été maintenus autant que le permet un français naturel.
