    Ainsi, après avoir montré dans le temps passé que notre nature était incapable d’obtenir la vie, et après avoir maintenant révélé un Sauveur capable de sauver même des êtres qui n’en ont aucune, Dieu a voulu que, pour ces deux raisons, nous croyions en sa bonté et que nous le considérions comme notre nourricier, père, maître, conseiller, médecin, intelligence, lumière, honneur, gloire, force et vie.[a]'
