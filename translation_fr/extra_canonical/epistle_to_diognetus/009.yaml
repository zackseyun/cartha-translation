  text: 'Having already planned everything in His mind with His Son, He permitted us during the former time to be borne along by disorderly impulses as we desired, led astray by pleasures and lusts, not at all because He took delight in our sins, but because He bore with us; not because He approved of the past season of iniquity, but because He was creating the present season of righteousness. Thus, being convicted in the past time by our own deeds as unworthy of life, we might now be made deserving by the goodness of God; and, having made clear our inability to enter into the kingdom of God of ourselves, we might be enabled by the ability of God.


    And when our iniquity had been fully accomplished, and it had been made perfectly manifest that punishment and death were expected as its recompense, the season came which God had ordained, when henceforth He should manifest His goodness and power. O the exceeding great kindness and love of God! He hated us not, neither rejected us, nor bore us malice, but was long-suffering and patient; and in pity for us took upon Himself our sins, and Himself parted with His own Son as a ransom for us: the holy for the lawless, the guileless for the evil, the just for the unjust, the incorruptible for the corruptible, the immortal for the mortal.


    For what else but His righteousness would have covered our sins?


    In whom was it possible for us, lawless and ungodly people, to have been justified, save only in the Son of God?


    O the sweet exchange! O the inscrutable creation! O the unexpected benefits! That the iniquity of many should be concealed in One Righteous Man, and the righteousness of One should justify many that are iniquitous!


    Having then in the former time demonstrated the inability of our nature to obtain life, and having now revealed a Savior able to save even creatures which have no ability, He willed that for both reasons we should believe in His goodness and should regard Him as nurse, father, teacher, counselor, physician, mind, light, honor, glory, strength, and life.'
translation:
  language: fr
  text: 'Ayant donc déjà tout conçu dans sa pensée avec son Fils, Dieu nous a laissés, durant le temps passé, être emportés à notre gré par des mouvements désordonnés, égarés par les plaisirs et les convoitises. Ce n’était nullement qu’il prenait plaisir à nos péchés, mais il nous supportait ; ce n’était pas qu’il approuvait ce temps d’injustice, mais il façonnait le temps présent de justice. Ainsi, après que nos propres œuvres avaient montré, dans le temps passé, que nous étions indignes de la vie, nous pouvions maintenant en être rendus dignes par la bonté de Dieu ; et, après que notre incapacité d’entrer par nous-mêmes dans le royaume de Dieu avait été manifestée, nous pouvions en devenir capables par la puissance de Dieu.


    Lorsque notre injustice fut arrivée à son comble et qu’il fut devenu parfaitement manifeste que le châtiment et la mort nous attendaient en salaire, le temps fixé par Dieu arriva, celui où il devait désormais manifester sa bonté et sa puissance. Ô immense bonté et amour de Dieu ! Il ne nous a pas haïs, il ne nous a pas rejetés et ne nous a pas gardé rancune. Au contraire, il a été patient et plein de longue patience ; dans sa compassion pour nous, il a pris sur lui nos péchés et a lui-même livré son propre Fils en rançon pour nous : le Saint pour les sans-loi, l’Innocent pour les méchants, le Juste pour les injustes, l’Incorruptible pour les êtres corruptibles, l’Immortel pour les mortels.


    Qu’est-ce qui aurait pu couvrir nos péchés, sinon sa justice ?


    En qui pouvions-nous, sans-loi et impies, être déclarés justes, sinon dans le Fils de Dieu ?


    Ô doux échange ! Ô œuvre insondable ! Ô bienfaits inattendus ! L’injustice d’un grand nombre est cachée dans un seul Juste, et la justice d’un seul rend justes un grand nombre d’injustes !


    Ainsi, après avoir montré dans le temps passé que notre nature était incapable d’obtenir la vie, et après avoir maintenant révélé un Sauveur capable de sauver même ceux qui en sont incapables, Dieu a voulu que, pour ces deux raisons, nous croyions en sa bonté et que nous le considérions comme celui qui nous nourrit, comme père, maître, conseiller, médecin, intelligence, lumière, honneur, gloire, force et vie.[a]'
  philosophy: optimal-equivalence
