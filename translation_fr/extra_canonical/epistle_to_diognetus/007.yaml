base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: fr
  text: 'Car, comme je l’ai dit, ce qui leur a été confié n’est pas une découverte terrestre. Ils ne prennent pas tant de soin à garder une invention mortelle, et ce n’est pas non plus la gestion de mystères humains qui leur a été confiée.


    Mais, en vérité, le Créateur tout-puissant de l’univers, le Dieu invisible lui-même, a fait descendre du ciel parmi les humains la vérité et la Parole sainte qui dépasse l’intelligence humaine, et il les a fermement établies dans leur cœur. Il ne l’a pas fait, comme on pourrait l’imaginer, en envoyant aux humains quelque subordonné, un ange, un chef, l’un de ceux qui administrent les affaires terrestres ou l’un de ceux à qui l’administration des réalités célestes a été confiée. Il a envoyé l’Artisan et Créateur de l’univers lui-même : celui par qui il a fait les cieux, par qui il a enfermé la mer dans les limites qui lui conviennent, dont tous les éléments observent fidèlement les desseins mystérieux, de qui [le soleil][a] a reçu la mesure des parcours du jour qu’il doit respecter, à qui la lune obéit lorsqu’il lui ordonne de briller la nuit, à qui les étoiles obéissent en suivant le cours de la lune. C’est par lui que toutes choses sont ordonnées, délimitées et placées sous autorité
    : les cieux et ce qui est dans les cieux, la terre et ce qui est sur la terre, la mer et ce qui est dans la mer, le feu, l’air, l’abîme, ce qui est dans les hauteurs, ce qui est dans les profondeurs et ce qui se trouve entre les deux. C’est lui que Dieu leur a envoyé.


    L’a-t-il envoyé, à ton avis, comme on pourrait le supposer, pour établir une domination et inspirer la peur et la terreur ?


    Non. Il l’a envoyé dans la bonté [et] la douceur, comme un roi enverrait son fils, lui-même roi. Il l’a envoyé comme Dieu ; il l’a envoyé comme [un homme][b] aux humains ; il l’a envoyé comme Sauveur, en usant de persuasion et non de contrainte, car la contrainte n’appartient pas à Dieu.


    Il l’a envoyé pour appeler, non pour persécuter ; il l’a envoyé par amour, non pour juger.


    Car il l’enverra pour juger, et qui supportera sa présence ?


    … [Ne vois-tu pas][c] qu’on les jette aux bêtes sauvages pour les amener à renier le Seigneur, sans pourtant parvenir à les vaincre ?


    Ne vois-tu pas que plus on les châtie, plus d’autres se multiplient ?


    Cela ne ressemble pas aux œuvres d’un être humain : c’est la puissance de Dieu ; ce sont les signes de sa présence.'
