lexical_decisions:
- source_word: 'λόγον (reconstructed from the known Greek wording; supplied witness: “holy teaching”)'
  choice: la Parole
  rationale: Le terme grec λόγος peut désigner parole, message ou enseignement. « La Parole » conserve sa densité et son possible référent personnel sans imposer explicitement une interprétation.
- source_word: 'οἰκονομίαν / διοικήσεις (known Greek wording; witness: “dispensation / administration”)'
  choice: gestion / administration
  rationale: Ces termes rendent naturellement l’idée de charge et d’organisation confiées, sans le sens doctrinal moderne que pourrait suggérer « dispensation ».
- source_word: 'τεχνίτην καὶ δημιουργὸν (known Greek wording; witness: “Artificer and Creator”)'
  choice: l’Artisan et Créateur
  rationale: « Artisan » garde l’image de celui qui façonne, tandis que « Créateur » exprime clairement l’acte créateur.
- source_word: 'βία (known Greek wording; witness: “force”)'
  choice: contrainte
  rationale: Dans ce contexte, il s’agit de coercition opposée à la persuasion, non de puissance en général.
- source_word: 'παρουσία (known Greek wording; witness: “presence”)'
  choice: présence
  rationale: « Présence » préserve le sens immédiat et l’éventuelle résonance eschatologique sans traduire d’office par « retour » ou « venue ».
theological_decisions:
- issue: Identité de l’envoyé et formulation « comme Dieu »
  choice: « Il l’a envoyé comme Dieu »
  alternative: « Il a envoyé Dieu »
  rationale: La formulation retenue suit la structure du témoin, maintient le parallèle « comme Dieu / comme un homme / comme Sauveur » et évite de développer la phrase en une définition dogmatique absente du passage.
- issue: Rapport entre amour, jugement présent et jugement futur
  choice: « par amour, non pour juger » puis « il l’enverra pour juger »
  alternative: Harmoniser les deux phrases en atténuant l’une d’elles
  rationale: Le contraste voulu entre la mission présente et le jugement futur est conservé sans résoudre la tension.
- issue: Référents pronominaux dans la grande phrase cosmologique
  choice: Maintien de la distinction entre Dieu qui envoie et celui par qui toutes choses sont faites
  alternative: Remplacer tous les pronoms par des titres christologiques explicites
  rationale: Le texte présente fortement l’envoyé, mais l’explicitation systématique de son identité irait au-delà de la formulation transmise.
- issue: « Parole » comme terme potentiellement personnel
  choice: Majuscule à « Parole », sans glose doctrinale
  alternative: « enseignement saint »
  rationale: La majuscule signale la portée singulière du λόγος dans ce contexte, tout en laissant ouverte la relation exacte entre le message implanté et l’envoyé.
translation_notes:
  register: 'Français international moderne, digne et accessible, avec tutoiement singulier correspondant à l’adresse directe à Diognète. La longue période cosmologique est conservée mais ponctuée pour rester intelligible. Les crochets et la lacune du témoin sont maintenus. Projet nécessairement provisoire : le dossier fourni repose sur un témoin anglais du domaine public et indique que la vérification directe complète du grec est encore en attente ; les choix grecs mentionnés ici s’appuient seulement sur le libellé grec couramment attesté du chapitre et devront être collationnés avant publication.'
