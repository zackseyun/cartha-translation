base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: fr
  text: 'Ensuite, je pense que tu désires surtout entendre pourquoi ils ne rendent pas leur culte à Dieu de la même manière que les Juifs.


    Les Juifs font bien de s’abstenir du culte décrit plus haut et d’affirmer qu’ils révèrent le Dieu unique de l’univers, qu’ils reconnaissent comme Maître. Mais lorsqu’ils lui rendent un culte par des pratiques semblables à celles qui viennent d’être mentionnées, ils se trompent complètement.


    En effet, les Grecs étalent leur folie en offrant ces choses à des images insensibles et sourdes. Quant aux Juifs, puisqu’ils pensent les présenter à Dieu comme s’il en avait besoin, ils devraient à juste titre y voir de la folie plutôt qu’un culte rendu à Dieu.


    Car celui qui a fait le ciel, la terre et tout ce qu’ils contiennent, et qui nous procure à tous ce dont nous avons besoin, ne peut lui-même avoir besoin d’aucune des choses qu’il fournit à ceux qui s’imaginent les lui donner.


    Ceux qui pensent lui offrir des sacrifices de sang, de graisse et d’holocaustes[a], et l’honorer par de tels honneurs, ne me paraissent donc en rien différents de ceux qui témoignent le même respect à des images sourdes. Les uns jugent bon de faire des offrandes à des choses incapables de recevoir cet honneur ; les autres, à celui qui n’a besoin de rien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « holocaustes » désigne des sacrifices entièrement brûlés sur l’autel.
    reason: Le sens sacrificiel ancien risque d’être masqué, en français contemporain, par l’emploi historique moderne du mot « Holocauste ».
lexical_decisions:
- source_word: practice their religion / worship (witness; Greek review pending)
  choice: rendre leur culte à Dieu / culte
  rationale: Cette formulation française naturelle conserve le thème central du culte sans réduire le passage à une simple appartenance religieuse.
- source_word: Master
  choice: Maître
  rationale: « Maître » garde l’idée de souveraineté et la relation exprimée par le témoin, sans introduire le titre distinct « Seigneur ».
- source_word: senseless and deaf images
  choice: images insensibles et sourdes
  rationale: 'La traduction maintient les deux qualificatifs polémiques : absence de perception et incapacité d’entendre.'
- source_word: whole burnt offerings
  choice: holocaustes
  rationale: Dans son sens sacrificiel historique, « holocauste » désigne une offrande entièrement consumée ; une note prévient l’interprétation moderne la plus immédiate.
- source_word: unable to participate in/receive the honor
  choice: incapables de recevoir cet honneur
  rationale: « Recevoir » rend clairement l’incapacité des images tout en évitant une expression française artificielle comme « participer à l’honneur ».
theological_decisions:
- issue: Portée de la critique du culte juif
  choice: Conserver la critique explicite des sacrifices telle qu’elle apparaît dans le témoin
  alternative: Atténuer le propos ou le reformuler comme une critique générale du ritualisme
  rationale: Le passage établit délibérément un parallèle polémique entre les offrandes faites aux images et les sacrifices offerts à Dieu. L’atténuer effacerait la tension théologique et historique du texte.
- issue: Absence de besoin en Dieu
  choice: « celui qui n’a besoin de rien »
  alternative: « Dieu, qui se suffit à lui-même »
  rationale: La première formulation suit l’argument du passage sans importer le vocabulaire systématique de l’aséité divine.
- issue: Référent divin et capitalisation
  choice: Employer les minuscules françaises ordinaires dans les pronoms renvoyant à Dieu
  alternative: Mettre une majuscule révérentielle à tous les pronoms divins
  rationale: La majuscule révérentielle n’est pas nécessaire en français moderne et pourrait suggérer un choix confessionnel absent du contenu lexical.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement est conservé parce que le passage s’adresse personnellement à Diognète. La vigueur polémique du texte est maintenue sans amplification. Le dossier fourni signale que la vérification directe du grec ancien reste à effectuer ; les décisions présentes s’appuient donc prudemment sur le témoin anglais public et sur la couche anglaise POB fournie.
