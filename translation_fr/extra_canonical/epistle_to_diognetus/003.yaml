    En effet, les Grecs étalent leur folie en offrant ces choses à des images insensibles et sourdes. Quant aux Juifs, eux qui pensent les présenter à Dieu comme s’il en avait besoin, ils devraient à juste titre y voir de la folie plutôt qu’un acte de culte.


    Car celui qui a fait le ciel, la terre et tout ce qu’ils contiennent, et qui nous procure à tous ce dont nous avons besoin, ne peut lui-même avoir besoin d’aucune des choses qu’il fournit à ceux qui s’imaginent les lui donner.


    Ceux qui pensent lui offrir des sacrifices de sang, de graisse et d’holocaustes[a], et lui rendre de tels honneurs, ne me paraissent donc en rien différents de ceux qui témoignent le même respect à des images sourdes. Les uns jugent bon de faire des offrandes à des choses incapables de recevoir cet honneur ; les autres, à celui qui n’a besoin de rien.'
