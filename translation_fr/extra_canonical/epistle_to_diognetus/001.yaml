source:
  text: 'Since I see, most excellent Diognetus, that thou art exceedingly anxious to understand the religion of the Christians, and that thy enquiries respecting them are distinctly and carefully made, as to what God they trust and how they worship Him, that they all disregard the world and despise death, and take no account of those who are regarded as gods by the Greeks, neither observe the superstition of the Jews, and as to the nature of the affection which they entertain one to another, and of this new development or interest, which has entered into men''s lives now and not before: I gladly welcome this zeal in thee, and I ask of God, Who supplieth both the speaking and the hearing to us, that it may be granted to myself to speak in such a way that thou mayest be made better by the hearing, and to thee that thou mayest so listen that I the speaker may not be disappointed.'
