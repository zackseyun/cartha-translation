base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/001.yaml
  text: 'Most excellent Diognetus, I see that you are exceedingly anxious to understand the religion of the Christians, and that your enquiries concerning them are distinctly and carefully made: as to what God they trust and how they worship him; that they all disregard the world and despise death; that they take no account of those regarded as gods by the Greeks, neither observing the superstition of the Jews; as to the nature of the affection they have for one another; and as to this new development or interest, which has entered into human lives now and not before. I gladly welcome your zeal, and I ask God, who supplies both speaking and hearing to us, that it may be granted to me to speak in such a way that you may be made better by hearing, and to you to listen in such a way that I, the speaker, may not be disappointed.'
translation:
  language: fr
  text: 'Illustre Diognète, je vois que tu désires vivement connaître la piété des chrétiens et que tes questions à leur sujet sont formulées avec précision et soin : à quel Dieu ils se fient et comment ils lui rendent un culte ; qu’ils méprisent le monde et se moquent de la mort ; qu’ils ne tiennent aucun compte des êtres que les Grecs considèrent comme des dieux et n’observent pas la superstition des Juifs ; quelle est l’affection qu’ils se portent mutuellement ; et pourquoi ce peuple nouveau, ou ce genre de vie nouveau, est entré dans le monde maintenant, et non auparavant. J’accueille volontiers ton zèle et je demande à Dieu, qui nous donne la parole aussi bien que l’écoute, de m’accorder de parler de telle manière que tu en deviennes meilleur en m’écoutant, et de t’accorder d’écouter de telle manière que moi, qui parle, je ne sois pas déçu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: religion
  choice: religion
  rationale: Le témoin anglais emploie « religion »; ce terme français est naturel et suffisamment large pour désigner ici la foi et la pratique chrétiennes.
- source_word: trust
  choice: mettent-ils leur confiance
  rationale: Cette formulation conserve la dimension relationnelle de la confiance en Dieu sans la réduire à une simple adhésion intellectuelle.
- source_word: worship
  choice: lui rendent-ils un culte
  rationale: Expression française claire et digne qui rend l’idée d’un service religieux adressé à Dieu.
- source_word: disregard the world
  choice: méprisent-ils tous le monde
  rationale: Le verbe énergique préserve la tension ascétique du témoin; « le monde » reste volontairement non explicité.
- source_word: affection
  choice: affection
  rationale: Conserve le sens large du lien d’amour mutuel sans imposer un vocabulaire chrétien plus technique comme « amour fraternel ».
- source_word: new development or interest
  choice: réalité nouvelle, cet intérêt nouveau
  rationale: Le témoin anglais signale lui-même une hésitation lexicale; le doublet la préserve plutôt que de trancher artificiellement.
theological_decisions:
- issue: Rapport des chrétiens au monde et à la mort
  choice: « méprisent-ils tous le monde et dédaignent-ils la mort »
  alternative: « ne font-ils aucun cas du monde et ne craignent-ils pas la mort »
  rationale: La formulation retenue conserve la force et le caractère provocateur du témoin, sans expliquer théologiquement ce que « monde » désigne.
- issue: Qualification de la pratique juive
  choice: « la superstition des Juifs »
  alternative: « les pratiques religieuses des Juifs »
  rationale: Le terme polémique appartient au témoignage transmis et ne doit pas être silencieusement neutralisé; il représente la caractérisation de l’auteur ancien, non une approbation éditoriale moderne.
- issue: Action de Dieu dans la communication
  choice: « Dieu, qui nous donne aussi bien la parole que l’écoute »
  alternative: « Dieu, qui nous permet de parler et d’entendre »
  rationale: Le choix garde l’affirmation selon laquelle Dieu est la source des capacités du locuteur comme de l’auditeur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement conserve la forme d’adresse singulière du témoin ancien et convient au style épistolaire direct. La longue phrase initiale a été structurée en questions successives afin d’assurer la lisibilité sans perdre l’enchaînement rhétorique. Traduction provisoire fondée sur le témoin anglais public fourni; la révision directe du grec ancien reste à effectuer.
