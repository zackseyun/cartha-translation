  consult_excerpt: As for the others, then, may they know, where they’re at, that it’s not right 43 for me, having come to the place of rest, to say anything else, but I’ll come to be in it, and will devote myself continually to the Father of all and the true brothers (and sisters), those upon whom the Father’s love is emptied and in whose midst there is no need. They’re the ones who are revealed in Truth; they exist in the true eternal life, and they speak of the light that’s complete and that’s filled with the Father’s seed, and that’s in his heart and in the fullness. His Spirit rejoices in it, and glorifies the one in whom it existed, because he’s good. And his children are complete, and worthy of his name, because he’s the Father. It’s children like this that he loves.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/016.yaml
  text: 'As for the others, may they recognize where they stand. But as for me—having come to the Place of Rest—it is proper not to add anything further; rather, I will come to be in it, and I will devote myself without ceasing to the Father of the All and to the true siblings: those upon whom the love of the Father has been poured, and in whose midst there is no deficiency.


    These are the ones revealed in the Truth; they exist in the true life, and they speak of the Light that is complete and filled with the Father’s seed, that is in his heart and in the Fullness. His Spirit rejoices in it and glorifies the one in whom it existed, because he is good. And his children are complete and worthy of his name, for he is the Father; such are the children whom he loves.


    [… large lacuna in the manuscript …]


    Yet there are some whose thoughts are upon toil: they become drunk in seeking, and they lose their mind. But the holy ones are those whose thought has not been defiled by wickedness; their thought remains within them. For the Logos of the Thought searches out what is above—his unsayability—I have [borne/spoken] by means of the mouth of all: the Good—the Messiah.'
translation:
  language: fr
  text: 'Quant aux autres, qu’ils reconnaissent donc où ils en sont. Mais pour moi, puisque je suis parvenu au Lieu du Repos, il ne convient pas que j’ajoute quoi que ce soit. J’y demeurerai plutôt et me consacrerai sans cesse au Père du Tout[a] et aux véritables frères et sœurs[b], ceux sur lesquels se répand l’amour du Père et au milieu desquels il n’existe aucune déficience.


    Ce sont eux qui ont été révélés dans la Vérité. Ils existent dans la vraie Vie et parlent de la Lumière accomplie, remplie de la semence du Père, qui est dans son cœur et dans la Plénitude[c]. Son Esprit s’en réjouit et rend gloire à celui en qui il se trouvait, car il est bon. Ses enfants sont accomplis et dignes de son nom, car il est le Père. Tels sont les enfants qu’il aime.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Tout » désigne ici la totalité considérée comme une réalité théologique.
    reason: Le terme copte peut paraître abstrait ou inhabituel en français ; la note éclaire son emploi sans le remplacer par un terme d’école.
  - marker: b
    text: 'Littéralement : « les véritables frères » ; le pluriel peut désigner l’ensemble des membres de la communauté.'
    reason: Explique l’explicitation inclusive « frères et sœurs ».
  - marker: c
    text: « Plénitude » traduit le terme grec plērōma employé en copte.
    reason: Signale le terme technique sous-jacent tout en gardant un français accessible dans le corps du texte.
lexical_decisions:
- source_word: ⲙ̄ⲡⲙⲁ ⲛ̄ⲙ̄ⲧⲁⲛ
  choice: Lieu du Repos
  rationale: Conserve l’image spatiale et le sens théologique du repos comme lieu d’aboutissement, avec des majuscules signalant cet emploi particulier sans imposer une interprétation confessionnelle.
- source_word: ⲡⲓⲱⲧ
  choice: le Père
  rationale: Reproduit l’article défini copte et la fonction centrale du Père dans le passage.
- source_word: ⲡⲧⲏⲣϥ̄
  choice: le Tout
  rationale: Rend le sens de totalité cosmique ou théologique tout en conservant la densité du terme copte.
- source_word: ⲧⲁⲅⲁⲡⲏ
  choice: l’amour
  rationale: Équivalent français naturel du nom grec emprunté agapē, sans translittération inutile.
- source_word: ϣⲧⲁ
  choice: déficience
  rationale: Préserve l’idée d’un manque constitutif et son contraste implicite avec la Plénitude; « besoin » reste possible selon l’analyse du passage.
- source_word: ⲟⲩⲁⲉⲓⲛ
  choice: la Lumière
  rationale: Garde l’article défini et marque par la majuscule la portée révélatrice et quasi personnifiée de la lumière dans le traité.
- source_word: ϫⲏⲕ ⲉⲃⲟⲗ
  choice: accomplie / accomplis
  rationale: « Accompli » exprime à la fois l’achèvement et l’intégrité, sans réduire le terme à une perfection morale.
- source_word: ⲥⲡⲉⲣⲙⲁ
  choice: semence
  rationale: Conserve la métaphore génératrice du mot grec sperma dans un français digne et intelligible.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Plénitude
  rationale: Rend le terme théologique par un mot français transparent; la majuscule indique son emploi comme réalité ou domaine déterminé.
- source_word: ⲡⲛⲁ
  choice: Esprit
  rationale: Le contexte présente l’Esprit comme sujet lié au Père; la majuscule signale cette référence divine sans préciser davantage son statut.
theological_decisions:
- issue: Majuscules à « Tout », « Vérité », « Vie », « Lumière » et « Plénitude »
  choice: Majuscules conservées pour signaler des réalités théologiques déterminées
  alternative: Minuscules partout
  rationale: Le discours paraît réifier ces notions. Les majuscules rendent cette densité sans remplacer les termes par un vocabulaire technique importé.
- issue: Genre et portée de « véritables frères »
  choice: « véritables frères et sœurs »
  alternative: « vrais frères »
  rationale: Le pluriel copte peut désigner collectivement la communauté sans exclure les femmes. La formulation inclusive explicite cette portée probable sans modifier le rapport familial au Père.
- issue: Référent de « celui en qui elle se trouvait »
  choice: Maintien de la formulation pronominale ambiguë
  alternative: Identifier explicitement le Père, l’Esprit ou un autre référent
  rationale: La chaîne des pronoms et des antécédents ne permet pas de résoudre sûrement le référent. La traduction conserve donc la tension du texte.
- issue: Traitement des mots produits par l’OCR après la fin reconnaissable
  choice: Non intégrés au texte traduit
  alternative: Traduire le paragraphe tardif conjectural sur la recherche, le Logos et le Christ
  rationale: La transcription fournie contient une très longue série de signes parasites, puis un fragment sans assise visuelle sûre. Le texte continu et reconnu de la conclusion s’achève avec les enfants que le Père aime; intégrer le fragment tardif créerait un contenu non suffisamment attesté par la page source.
translation_notes:
  register: Français international moderne, sobre et méditatif. Les phrases ont été légèrement redistribuées pour rester lisibles, tout en maintenant les répétitions du Père, de l’accomplissement et de l’existence « dans » une réalité. Le passage final douteux généré après une longue zone de parasites OCR n’a pas été publié comme texte ancien attesté.
