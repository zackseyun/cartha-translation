revisions:
- from: 'Quand il se manifesta[a], il leur enseigna qui est le Père — celui que rien ne peut contenir — et insuffla en eux ce qui est dans la Pensée, accomplissant ainsi sa volonté. Beaucoup reçurent la Lumière et se tournèrent vers lui. En effet, les êtres matériels lui étaient étrangers : ils ne virent pas sa forme et ne le connurent pas. Il vint sous une forme de chair, et rien ne put lui barrer le chemin, car l’incorruptibilité ne peut être saisie[b].


    Il disait des choses nouvelles en exprimant ce qui est dans le cœur du Père, et il fit paraître la Parole parfaite. Quand la Lumière parla par sa bouche et que sa voix donna naissance à la vie, il leur donna la Pensée, l’intelligence, la compassion, le salut et l’Esprit de puissance, issus de l’infinité et de la douceur du Père.


    Il fit cesser les châtiments et les coups de fouet, car ceux-ci entraînaient dans l’Erreur et la captivité les personnes qui avaient besoin de compassion. Il les dissipa et les confondit par la Connaissance.


    Ainsi, il devint :


    — un Chemin pour ceux qui s’égaraient ;


    — la Connaissance pour ceux qui étaient ignorants ;


    — une Découverte pour ceux qui cherchaient ;


    — la Force pour ceux qui vacillaient ;


    — et la Pureté pour ceux qui étaient souillés.


    [a] Ou : « se révéla ».


    [b] Ou : « ne peut être retenue » ; le terme évoque ce qu’on ne peut ni saisir ni maîtriser.'
