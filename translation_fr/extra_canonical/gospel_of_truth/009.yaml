  consult_excerpt: 'When he was revealed, he taught them about the Father, the uncontainable one, and breathed into them what’s in the thought, doing his will. When many had received the light, they turned 31 to him. For the material ones were strangers, who didn’t see his form or know him. For he came by means of fleshly form, and nothing could block his path, because incorruptibility can’t be grasped. Moreover, he said new things while he spoke about what’s in the Father’s heart and brought out the complete Word. When the light spoke through his mouth, and by his voice gave birth to life, he gave them thought, wisdom, mercy, salvation, and the Spirit of power from the infinity and sweetness of the Father. He caused punishments and torments to cease, because they led astray into Error and bondage those who needed mercy. He dissolved and confounded them with knowledge. He became:

    a Way for those who were led astray,

    knowledge for those who were ignorant,

    a discovery for those who were searching,

    strength for those who were wavering, and

    purity for those who were impure.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/009.yaml
  text: 'When he was revealed[a], he taught them of the Father—the uncontainable one—and he breathed into them what is in the Thought, accomplishing his will. Many received the Light and turned to him, for the material ones were strangers; they did not behold his form nor know him. He came by means of a fleshly form, and nothing was able to block his way, because incorruptibility is ungraspable.


    He spoke things new, speaking out what is in the Father’s heart, and he brought forth the complete Word; when the Light spoke from his mouth, and his voice gave birth to life, he gave them Thought, understanding, mercy, salvation, and the Spirit of power, from the infinity and sweetness of the Father.


    He caused punishments and scourges to cease, because they were leading into Error and into captivity those who had need of mercy. He dissolved them, and he confounded them by Knowledge.


    Thus he became:

    - a Way for those who were wandering,

    - Knowledge for those who were ignorant,

    - a Discovery for those who were seeking,

    - Strength for those who were wavering,

    - and Purity for those who were defiled.'
translation:
  language: fr
  text: 'Quand il se manifesta[a], il les instruisit au sujet du Père — celui que rien ne peut contenir — et insuffla en eux ce qui est dans la Pensée, accomplissant ainsi sa volonté. Lorsque beaucoup eurent reçu la Lumière, ils se tournèrent vers lui. En effet, les êtres matériels étaient des étrangers : ils ne virent pas sa forme et ne le connurent pas. Il vint sous une forme de chair, et rien ne put lui barrer le chemin, car l’incorruptibilité ne peut être saisie[b].


    Il prononça des paroles nouvelles, exprimant ce qui est dans le cœur du Père, et fit paraître la Parole tout entière. Quand la Lumière parla par sa bouche et que sa voix donna naissance à la vie, il leur donna la Pensée, l’intelligence, la compassion, le salut et l’Esprit de puissance, issus de l’infinité et de la douceur du Père.


    Il fit cesser les châtiments et les coups de fouet, car ceux-ci entraînaient dans l’Erreur et la captivité les personnes qui avaient besoin de compassion. Il les dissipa et les confondit par la Connaissance.


    Ainsi, il devint :


    — un Chemin pour ceux qui s’égaraient ;


    — la Connaissance pour les ignorants ;


    — une Découverte pour ceux qui cherchaient ;


    — la Force pour ceux qui vacillaient ;


    — et la Pureté pour ceux qui étaient souillés.


    [a] Ou : « se révéla ».


    [b] Ou : « ne peut être retenue » ; le terme évoque ce qu’on ne peut ni saisir ni maîtriser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se révéla ».'
    reason: Le verbe peut décrire aussi bien une manifestation visible qu’une révélation ; la variante conserve cette nuance.
  - marker: b
    text: 'Ou : « ne peut être retenue » ; le terme évoque ce qu’on ne peut ni saisir ni maîtriser.'
    reason: La racine sous-jacente relève de l’action de prendre ou de tenir ; « saisie » peut être comprise intellectuellement, tandis que « retenue » garde la force concrète.
lexical_decisions:
- source_word: ⲟⲉⲓⲛ
  choice: Lumière
  rationale: La majuscule signale la Lumière comme réalité salvatrice personnifiée dans ce contexte, sans recourir à un vocabulaire spécialisé.
- source_word: ⲡϣⲉϫⲉ
  choice: Parole
  rationale: Dans ce contexte révélatoire, « Parole » rend mieux que le simple « discours » la réalité complète que le Fils fait paraître.
- source_word: ⲁⲧⲉⲙⲁϩⲧⲉ
  choice: celui que rien ne peut contenir
  rationale: Cette formulation française naturelle conserve l’image de ce qui ne peut être tenu ou enfermé et l’applique au Père comme titre descriptif.
- source_word: ⲧⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: incorruptibilité
  rationale: Le nom abstrait préserve l’affirmation métaphysique du texte et explique pourquoi rien ne peut entraver sa venue.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Connaissance
  rationale: La majuscule garde la portée salvatrice et quasi personnifiée du terme tout en restant compréhensible en français courant.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Erreur
  rationale: La majuscule rend le caractère actif et personnifié de cette puissance dans l’ouvrage.
- source_word: ⲥⲁⲓ
  choice: captivité
  rationale: Le terme exprime un état d’asservissement opposé au salut et convient au parallélisme avec l’Erreur.
- source_word: ⲕⲟⲗⲁⲥⲓⲥ / ⲙⲁⲥⲧⲓⲅⲝ
  choice: châtiments et coups de fouet
  rationale: Cette paire distingue la peine en général de l’instrument ou de l’acte punitif concret, plutôt que de fondre les deux mots en « tourments ».
- source_word: ⲙⲁⲉⲓⲧ
  choice: Chemin
  rationale: « Chemin » conserve la métaphore d’orientation salvatrice et la majuscule souligne son emploi prédicatif solennel.
theological_decisions:
- issue: Personnification de l’Erreur
  choice: « Erreur » avec une majuscule
  alternative: « égarement » ou « erreur » comme nom commun
  rationale: Dans l’Évangile de Vérité, l’Erreur agit comme une puissance hostile ; la majuscule rend cette fonction sans ajouter une entité étrangère au texte.
- issue: Nature de la venue sous une forme charnelle
  choice: « Il vint sous une forme de chair »
  alternative: « Il devint chair » ou « il ne fit que paraître dans la chair »
  rationale: Le texte parle du moyen ou de la forme de sa venue. La traduction conserve cette formulation sans trancher les questions christologiques qu’elle laisse ouvertes.
- issue: Relation entre l’incorruptibilité et l’impossibilité de saisir
  choice: « l’incorruptibilité ne peut être saisie »
  alternative: « l’incorruptibilité ne peut être retenue »
  rationale: « Saisie » maintient à la fois les nuances de compréhension et de prise physique ; la note préserve l’autre possibilité concrète.
- issue: « Esprit de puissance »
  choice: 'Conserver le génitif : « l’Esprit de puissance »'
  alternative: « l’Esprit puissant »
  rationale: Le génitif maintient la structure de la série de dons et évite de réduire la puissance à un simple adjectif.
- issue: Statut de la Pensée, de la Lumière, de la Parole et de la Connaissance
  choice: Majuscules lorsque ces mots fonctionnent comme des réalités théologiques déterminées
  alternative: Minuscules comme simples noms communs
  rationale: Le contexte leur donne une portée technique ou personnifiée, mais la traduction emploie des mots français ordinaires afin de ne pas imposer une terminologie confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. Les phrases ont été légèrement réorganisées pour la clarté sans effacer le parallélisme du texte. La liste finale est conservée comme une litanie. Les lectures fantômes produites par l’OCR au milieu de la page ne sont pas traduites.
