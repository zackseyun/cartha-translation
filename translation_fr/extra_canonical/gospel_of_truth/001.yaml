base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/001.yaml
  text: The Gospel of Truth is joy for those who have received grace from the Father of Truth[a], so that they might know him through the power of the Word that came forth from the Pleroma—the one who is in the thought and the mind of the Father. He is called “Savior”; that is the name of the work he will do to save those who had become ignorant of the Father. And the name “Gospel” is the revelation of hope, the discovery for those who seek him.
translation:
  language: fr
  text: 'L’Évangile de la vérité est une joie pour ceux qui ont reçu la grâce du Père de la vérité, afin qu’ils le connaissent par la puissance de la Parole venue du Plérôme[a] — celui qui est dans la pensée et l’intelligence du Père. On l’appelle « Sauveur » : tel est le nom de l’œuvre qu’il accomplira pour sauver ceux qui étaient devenus ignorants du Père[b]. Et le nom « Évangile » désigne la révélation de l’espérance, la découverte que font ceux qui le cherchent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Plérôme » est la « Plénitude » d’où vient la Parole.
    reason: Le terme translittéré est technique et demande une brève explication pour le lectorat général.
  - marker: b
    text: 'Ou : « pour délivrer ceux qui étaient devenus ignorants du Père ».'
    reason: Le champ du salut permet ici « sauver » ou « délivrer »; la variante préserve cette nuance sans imposer l’idée plus précise de rachat.
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Évangile
  rationale: Le mot, emprunté au grec εὐαγγέλιον, fonctionne ici comme une désignation théologique sur laquelle le texte réfléchit explicitement.
- source_word: ⲧⲙⲏⲉ
  choice: vérité
  rationale: Équivalent français direct, conservé dans « Évangile de la vérité » et « Père de la vérité ».
- source_word: ⲡⲓⲱⲧ
  choice: Père
  rationale: Le terme est employé comme titre divin; la majuscule le signale sans ajouter d’interprétation confessionnelle.
- source_word: ⲧϭⲁⲙ
  choice: puissance
  rationale: Rend l’efficacité active par laquelle la connaissance du Père devient possible.
- source_word: ⲡⲓϣⲉϫⲉ / ⲡⲥⲁϫⲉ
  choice: Parole
  rationale: Le contexte personnifie la parole venue du Plérôme; « Parole » conserve le lexème tout en indiquant cette portée personnelle.
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: Plérôme
  rationale: La translittération du grec πλήρωμα préserve le caractère technique du terme; une note en donne le sens courant.
- source_word: ⲛⲟⲩⲥ
  choice: intelligence
  rationale: Le grec νοῦς évoque la faculté intellective; « intelligence » s’accorde naturellement avec « pensée » tout en maintenant la dualité des termes cognitifs.
- source_word: ⲡⲥⲱⲧⲏⲣ
  choice: Sauveur
  rationale: Titre traditionnel et direct du grec σωτήρ, mis en relation dans le passage avec l’œuvre de sauver.
- source_word: ⲡⲟⲩⲱⲛϩ ⲃⲁⲗ
  choice: révélation
  rationale: L’expression d’ouverture ou de dévoilement prend ici le sens naturel de révélation de l’espérance.
- source_word: ⲕⲱⲧⲉ ⲛⲥⲱϥ
  choice: le cherchent
  rationale: Rend simplement et fidèlement l’action de rechercher celui dont parle le passage.
- source_word: ⲡⲣⲁⲛ
  choice: le nom
  rationale: Le manuscrit parle explicitement du « nom », créant un parallèle entre « Sauveur » et « Évangile ».
theological_decisions:
- issue: Personnification et genre grammatical de la Parole
  choice: « la Parole… celle… On l’appelle “Sauveur” »
  alternative: Employer des pronoms masculins en prenant directement la Parole comme une personne masculine
  rationale: Le français impose un accord féminin avec « Parole », tandis que le titre masculin « Sauveur » est conservé. Cette solution laisse perceptible la personnification sans remplacer le terme source par « Logos ».
- issue: Sens technique de πλήρωμα
  choice: Plérôme
  alternative: Plénitude
  rationale: « Plérôme » préserve le réseau conceptuel propre au traité; la note permet néanmoins au lecteur non spécialiste de comprendre le sens littéral.
- issue: Nature du salut décrit
  choice: « sauver ceux qui étaient devenus ignorants du Père »
  alternative: « racheter ceux qui étaient devenus ignorants du Père »
  rationale: « Sauver » fait écho au titre « Sauveur » et ne précise pas un mécanisme de rédemption que cette phrase n’explicite pas.
- issue: Fonction du nom « Évangile »
  choice: « le nom “Évangile” désigne »
  alternative: « le nom “Évangile” est »
  rationale: « Désigne » rend en français naturel l’explication étymologique ou théologique du nom, tout en conservant explicitement la catégorie de « nom » attestée par ⲡⲣⲁⲛ.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le mouvement méditatif de l’original, mais évite les calques lourds. Les termes théologiques traditionnels sont maintenus lorsqu’ils sont portés par le texte, avec une note seulement pour le terme technique « Plérôme ».
