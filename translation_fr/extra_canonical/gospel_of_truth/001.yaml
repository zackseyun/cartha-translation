revisions:
- from: 'L’Évangile de la vérité est une joie pour ceux qui ont reçu la grâce du Père de la vérité, afin qu’ils le connaissent par la puissance de la Parole venue du Plérôme[a] — celle qui demeure dans la pensée et l’intelligence du Père. On l’appelle « Sauveur » : tel est le nom de l’œuvre qu’elle accomplira pour sauver ceux qui étaient devenus ignorants du Père[b]. Et le nom « Évangile » désigne la révélation de l’espérance, la découverte offerte à ceux qui le cherchent.'
  to: 'L’Évangile de la vérité est une joie pour ceux qui ont reçu la grâce du Père de la vérité, afin qu’ils le connaissent par la puissance de la Parole venue du Plérôme[a] — celui qui est dans la pensée et l’intelligence du Père. On l’appelle « Sauveur » : tel est le nom de l’œuvre qu’il accomplira pour sauver ceux qui étaient devenus ignorants du Père[b]. Et le nom « Évangile » désigne la révélation de l’espérance, la découverte que font ceux qui le cherchent.'
  rationale: La révision remplace les pronoms féminins commandés artificiellement par « Parole » par le masculin personnel « celui » / « il », conformément au référent désigné comme « Sauveur ». Elle supprime également l’ajout interprétatif « offerte » dans la dernière expression, tout en conservant l’ambiguïté et la portée théologique du texte.
