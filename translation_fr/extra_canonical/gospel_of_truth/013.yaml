  terminology: Les choix Logos, Intellect, Pensée, Volonté, grâce, trace et connaissance sont cohérents et ne surinterprètent pas le texte. La majuscule à Volonté demeure défendable comme signal typographique de réification. « Celui qui est caché » conserve convenablement le titre sans forcer une construction doctrinale.
