  rationale: Le terme grec passé en copte fonctionne ici comme désignation technique. « Parole » est employé dans les expressions françaises qui font entendre sa valeur sémantique.
- source_word: ⲛⲟⲩⲥ
  choice: Intellect
  rationale: Ce terme conserve la portée cognitive et technique du grec νοῦς plus nettement que « esprit », qui serait théologiquement équivoque en français.
- source_word: ⲭⲁⲣⲓⲥ
