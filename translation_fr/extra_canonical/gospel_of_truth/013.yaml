  rationale: Le choix conserve la force sotériologique et l’identification explicite avec le Père sans importer une étiquette doctrinale ultérieure.
- issue: Retour de tous ceux qui sont sortis du Père
  choice: Conserver l’énoncé universel sans en préciser le mécanisme ni la portée salvifique
  alternative: Interpréter ce retour comme salut universel explicite ou simple réabsorption métaphysique
  rationale: Le texte affirme le retour mais n’en donne pas ici une explication suffisante pour trancher entre ces lectures.
