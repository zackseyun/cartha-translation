  yaml_path: translation/extra_canonical/gospel_of_truth/013.yaml
  text: 'He is the Good—within the Father’s Thought[a], in contemplation.


    The utterance of his meditation—each one, every one of his words—is the work of his Will. For they are speech in the Light, outside, belonging to his Saying: while they were still in the depths of his Thought, the Logos—the first to come forth—manifested them, with a Mind that speaks the one Word in a silent grace. He was called “the Thought,” because they were in it before they were manifested outside. And so it happened that he was the first to come forth, at the time when it pleased the will of the one who willed it.


    The Will is that in which the Father rests. Nothing happens without him, nor does anything happen without the Will of the Father. But his Will is uninvestigable; his trace is the Will. No one can know him, nor does he exist in such a way as for them to scrutinize him so that they might grasp him; rather, what he wills—this is what happens, even if their sight should not be pleasing in any way before God—the Will of the Father. For the Father knows their beginning and their end; for in their end he will greet them face to face. And the end is the knowledge of the Hidden One; and the Hidden One is the Father—from whom the beginning came forth and to whom all who came forth from him will return[c][b]. They were manifested for the glory and the joy of his Name.'
