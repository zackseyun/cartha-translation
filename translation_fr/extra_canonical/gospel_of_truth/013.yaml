revisions:
- from: '## Le paradis du Père


    Tel est l’accomplissement dans la Pensée du Père, et telles sont les paroles de sa méditation. Chacune de ses paroles est l’œuvre de son unique Volonté dans la révélation de sa Parole. Alors qu’elles se trouvaient encore dans les profondeurs de sa Pensée, le Logos — le premier à être sorti — les a manifestées avec un Intellect qui profère l’unique Parole dans une grâce silencieuse.[a] On l’a appelé « la Pensée », parce qu’elles étaient en elle avant d’être manifestées. Ainsi, il a été le premier à sortir, au moment où cela a plu à la volonté de celui qui l’avait voulu.


    La Volonté est ce en quoi le Père trouve son repos, ce en quoi il se complaît. Rien n’arrive sans lui, et rien n’arrive sans la Volonté du Père. Mais sa Volonté est insondable ; sa trace, c’est la Volonté. Personne ne peut le connaître, et il ne se prête pas à l’examen, comme si l’on pouvait ainsi le saisir. Au contraire, quand il veut, ce qu’il veut arrive — même si ce qui se donne à voir ne leur plaît en rien devant Dieu — : telle est la Volonté du Père.[b] Car le Père connaît le commencement de tous et leur fin. À leur fin, il les accueillera auprès de lui.[c] Or la fin, c’est la connaissance de Celui qui est caché ; et Celui qui est caché, c’est le Père, de qui le commencement est sorti et vers qui retourneront tous ceux qui sont sortis de lui. Ils ont été manifestés pour la gloire et la joie de son Nom.'
  to: '## Le paradis du Père


    Tel est l’accomplissement dans la Pensée du Père, et telles sont les paroles de sa méditation. Chacune de ses paroles est l’œuvre de son unique Volonté, dans la manifestation au-dehors de sa Parole. Alors qu’elles se trouvaient encore dans les profondeurs de sa Pensée, le Logos — le premier à sortir — les a manifestées avec un Intellect qui profère l’unique Parole dans une grâce silencieuse.[a] Elles ont été appelées « la Pensée », parce qu’elles étaient en elle avant d’être manifestées au-dehors. Ainsi, il a été le premier à sortir, au moment où cela a plu à celui qui le voulait.


    La Volonté est ce en quoi le Père trouve son repos, ce en quoi il se complaît. Rien n’arrive sans lui, et rien n’arrive sans la Volonté du Père. Mais sa Volonté est insondable ; sa trace, c’est la Volonté. Personne ne peut le connaître, et il n’est pas là pour qu’on le scrute afin de le saisir. Au contraire, quand il veut, ce qu’il veut arrive — même si ce qui se donne à voir ne leur plaît en rien devant Dieu — : telle est la Volonté du Père.[b] Car le Père connaît le commencement de tous et leur fin. À leur fin, il les accueillera face à face.[c] Or la fin, c’est la connaissance de Celui qui est caché ; et Celui qui est caché, c’est le Père, de qui le commencement est sorti et vers qui retourneront tous ceux qui sont sortis de lui. Ils ont été manifestés pour la gloire et la joie de son Nom.'
