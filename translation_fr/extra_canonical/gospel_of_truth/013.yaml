- source_word: ⲟⲩⲱϣ
  choice: Volonté
  rationale: La majuscule signale la réification de la volonté du Père dans ce passage, sans affirmer qu’elle constitue une personne distincte.
- source_word: ⲓⲭⲛⲟⲥ
  choice: trace
  rationale: Le mot grec désigne une trace ou une empreinte ; « trace » maintient la métaphore sans la rendre excessivement concrète.
- source_word: ⲥⲟⲟⲩⲛⲉ
  choice: connaissance
  rationale: « Connaissance » est accessible et garde la portée sotériologique du passage sans imposer dans le texte le terme spécialisé « gnose ».
- source_word: ⲡⲉⲉⲓ ⲉⲑⲏⲡ
  choice: Celui qui est caché
  rationale: Cette formulation garde la valeur de titre tout en restant naturelle en français moderne.
