lexical_decisions:
- source_word: ⲙⲁⲉⲓⲧ
  choice: forme
  rationale: « Forme » rend naturellement l’idée de configuration ou d’apparence constituée et conserve la portée conceptuelle du passage.
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: saison
  rationale: Le mot grec emprunté désigne ici un moment déterminé ou opportun; « saison » garde cette nuance sans recourir à une translittération technique.
- source_word: ⲡⲉⲧϣⲟⲟⲡ
  choice: ce qui existe / Celui-qui-est
  rationale: Le relatif substantivé porte une forte valeur ontologique; la formulation titulaire est employée lorsque le référent personnel est mis en relief.
- source_word: ⲧⲙⲛⲧⲉⲩⲛⲟⲩ
  choice: non-être
  rationale: Ce choix maintient l’opposition ontologique avec l’existence, sans transformer le passage en affirmation explicite sur une doctrine ultérieure de la création.
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: fruit
  rationale: Le terme conserve la métaphore organique liée à la racine et à la production.
- source_word: ⲛⲧⲟⲩϣⲏ
  choice: ils se dissoudront
  rationale: « Se dissoudre » préserve l’image vive de la disparition plutôt que de la réduire au simple fait de périr.
- source_word: ⲡⲓⲱⲧ
  choice: le Père
  rationale: Le titre défini est conservé conformément au registre théologique du texte.
- source_word: ⲙⲙⲁ ⲛⲓⲙ
  choice: tout espace
  rationale: Cette expression spatiale ne doit pas être confondue avec le vocabulaire technique des éons; « tout espace » en maintient la spécificité.
theological_decisions:
- issue: Vocabulaire des éons
  choice: éon
  alternative: domaine; âge
  rationale: « Éon » conserve le terme marqué du monde conceptuel valentinien, tandis que « domaine » en affaiblirait la portée et que « âge » serait trompeur ici.
- issue: Rapport entre existence et non-être
  choice: à partir du non-être
  alternative: à partir de rien; à partir du néant
  rationale: La traduction garde la tension métaphysique du texte sans importer explicitement la formulation technique d’une doctrine ultérieure de la création ex nihilo.
- issue: Désignation de la source de l’être
  choice: Celui-qui-est
  alternative: Celui qui existe; l’Existant
  rationale: La graphie composée signale une désignation quasi titulaire tout en évitant d’imposer une identification directe avec un autre texte scripturaire.
- issue: Statut de ceux qui ne sont pas encore venus à l’existence
  choice: ils existent plutôt en Celui qui voudra qu’ils viennent à l’existence
  alternative: ils ne sont rien jusqu’à leur production
  rationale: Le passage nie précisément qu’ils soient simplement rien et maintient paradoxalement leur présence en leur source avant leur manifestation.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les répétitions de « venir à l’existence », « forme », « nom », « fruit » et « révéler » sont volontairement conservées, car elles structurent l’argument. « Le Père est complet » rend l’idée de plénitude sans la normaliser en « parfait ». Aucun marqueur de note n’est requis dans ce segment.
