  rationale: Conserve l’image spatiale concrète plutôt que de l’atténuer par une paraphrase abstraite.
- source_word: ⲡⲣⲏⲧⲉ
  choice: le Tout
  rationale: La majuscule signale le collectif cosmologique réifié, sans l’identifier davantage.
- source_word: ⲙ̄ⲛ̄ⲧⲟⲩⲉⲉⲓ
  choice: l’Unité
  rationale: Préserve le caractère abstrait et métaphysique de la source qui écrit les lettres.
- source_word: ⲟⲩⲱϣ
  choice: volonté
  rationale: Exprime directement la volition divine et maintient le motif répété de l’accomplissement de cette volonté.
- source_word: ⲙⲟⲩⲧⲉ
  choice: appeler par son nom
  rationale: Rend ensemble l’appel et la nomination, jeu conceptuel central du passage.
- source_word: ⲃⲁⲑⲟⲥ
  choice: profondeur
  rationale: Traduction directe de l’emprunt grec βάθος, maintenant l’image cosmologique.
- source_word: ⲕⲧⲁⲉⲓⲧ
  choice: entourer
  rationale: 'Conserve le paradoxe spatial : celui qui entoure tout sans être lui-même entouré.'
- source_word: ⲙⲛⲧⲙⲏⲉ
  choice: la Vérité
  rationale: La majuscule restitue la valeur réifiée de l’abstraction dans ce contexte.
theological_decisions:
- issue: Valeur de ⲥⲁⲛϩⲣⲉ
  choice: la Filiation
  alternative: la condition filiale ; le Fils
  rationale: « Filiation » maintient l’abstraction hypostatique du texte et ne tranche pas en faveur d’une identification personnelle plus précise.
- issue: Double lecture du titre ⲡⲓϫⲱⲱⲙⲉ ⲉⲧⲁⲛϩ
  choice: « Livre des Vivants » à l’ouverture et « Livre vivant » dans la reprise
  alternative: uniformiser partout en « Livre des Vivants » ou en « Livre vivant »
  rationale: La construction copte admet les deux nuances ; conserver les deux formulations fait entendre à la fois l’inscription des vivants et la qualité vivante du livre.
- issue: Statut de l’Erreur, de la Vérité, du Tout et de l’Unité
  choice: majuscule sans explication dogmatique ajoutée
  alternative: minuscules ordinaires ou personnification explicite
  rationale: Les majuscules rendent leur caractère réifié dans le discours tout en préservant l’ambiguïté sur leur statut ontologique exact.
- issue: Sujet de l’action dans « il les a inscrits d’avance »
  choice: maintenir le pronom « il » dans la continuité du passage
  alternative: expliciter « le Père »
  rationale: Le référent est fortement suggéré par le contexte, mais le texte ne doit pas être sur-explicité au prix de sa fluidité et de sa tension référentielle.
