  consult_excerpt: 'Now those who will receive teaching [are] the living who are written in the Book of the Living. They receive teaching about themselves, and they receive it from the Father, returning to him again.

    Since the completion of all is in the Father, it’s necessary for all to go up to him. Then, if someone has knowledge, they receive what are their own, and he draws them to himself, because the one who’s ignorant is in need. And it’s a great need, since they need what will complete them. Since the completion of all is in the Father, it’s necessary for all to go up to him, and for each one to receive what are their own. He inscribed these things beforehand, having prepared them to give to those who came out from him.

    Those whose names he knew beforehand were called at the end, so that the one who has knowledge is the one whose name the Father has called, because those whose name hasn’t been spoken are ignorant. Indeed, how can someone hear if their name hasn’t been called? For the one who’s ignorant until the end is a delusion of forgetfulness, and they’ll dissolve with it. Otherwise, why do these miserable ones have no 22 name? Why do they have no voice?

    So if someone has knowledge, they’re from above. If they’re called, they hear, they reply, and they turn to the one who calls them. And they go up to him, and they know how they are called. Having knowledge, they do the will of the one who called them, they want to please him, and they receive rest. Each one’s name becomes their own. The one who has knowledge like this knows where they come from and where they’re going. They know like one who, having been drunk, turns from their drunkenness, and having returned to themselves, restores what are their own.

    He’s returned many from Error. He went before them to the realms from which they had moved away. They had received Error because of the depth of the one who surrounds every realm, though nothing surrounds him. It’s a great wonder that they were in the Father, not knowing him, and that they were able to come out by themselves, since they weren’t able to grasp and know the one in whom they were. He revealed his will as knowledge in harmony with all that emanated from him.

    This is the knowledge of the living book which he revealed to the 23 generations at the end, letters from him revealing how they’re not vowels or consonants, so that one might read them and think they’re meaningless, but they’re letters of the Truth – they speak and know themselves. Each letter is a complete thought, like a book that’s complete, since they’re letters written by the Unity, the Father having written them so that the generations, by means of his letters, might know the Father.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/004.yaml
  text: 'As for the names of the Living, they are written in the Book of the Living.

    They receive instruction about themselves; they receive it from the Sonship, so that the one who hears may answer, may turn back, and may look toward the one who called his name. He does his will, he follows after him, and he says that they are his who have been named by him. Each one knows from where he has been called; he does his will, he desires to please him, and he receives rest. Each one’s name becomes his own.

    Since, then, the completion of the All is in him, it is necessary for the All to go up, and for each one to receive what is his. He wrote them beforehand—having prepared them in his thought and in his will—to give to those who went forth from him.

    Those whom he knew by name beforehand were called at the end, so that the one who has knowledge is the one whose name the Father has spoken; for the one whose name has not been uttered is ignorant. And how will such a one hear, if his name has not been called? For the ignorant one until the end is a product of Error, and he will dissolve together with it. Otherwise, why do these pitiable ones have no name? Why do they have no voice?

    Thus, if someone has knowledge, he is from above. If he is called, he hears; he answers; he turns to the one who calls him; he goes up to him; and he knows the manner in which he is called. Possessing knowledge, he does the will of the one who called him, he desires to be pleasing to him, and he receives rest. His name becomes his own. Such a knower knows from where he came and where he is going. He knows like one who, having been drunk, turned away from his drunkenness, and having returned to himself, has set again in order the things that are his.

    He has brought many back from Error. He went before them to the places from which they had moved away. They had received Error because of the depth of the one who surrounds every place—though nothing surrounds him. A great wonder: that they were in the Father and did not know him, and that they were able to come forth by themselves, though they were not able to grasp and to know the one in whom they were. He revealed his will as knowledge, in harmony with all that went out from him.

    This is the knowledge of the Living Book which he revealed to the generations at the end—letters from him showing that they are not vowels nor consonants, so that someone would read them and suppose they are empty, but they are letters of the Truth: they speak, and they know themselves. Each letter is a complete thought, like a book that is complete, since they are letters written by the Unity, the Father having written them so that the generations, by means of his letters from him, might know the Father.'
translation:
  language: fr
  text: 'Quant aux noms des Vivants, ils sont écrits dans le Livre des Vivants[a].


    Ils reçoivent un enseignement sur eux-mêmes ; ils le reçoivent de la Filiation[b]. Celui qui entend répond, se tourne vers celui qui l’appelle et monte vers lui. Il sait de quelle manière il est appelé. Possédant la connaissance, il accomplit la volonté de celui qui l’a appelé, désire lui plaire et reçoit le repos. Le nom de chacun devient sien.


    Puisque l’accomplissement du Tout est en lui, il faut que le Tout monte vers lui et que chacun reçoive ce qui lui appartient. Il les a inscrits d’avance — après les avoir préparés dans sa pensée et dans sa volonté — afin de les donner à ceux qui sont sortis de lui.


    Ceux qu’il connaissait d’avance par leur nom ont été appelés à la fin. Ainsi, celui qui possède la connaissance est celui dont le Père a prononcé le nom ; car celui dont le nom n’a pas été prononcé demeure ignorant. Et comment pourrait-il entendre si son nom n’a pas été appelé ? Celui qui demeure ignorant jusqu’à la fin est une œuvre de l’Erreur[c], et il se dissoudra avec elle. Sinon, pourquoi ces malheureux n’ont-ils pas de nom ? Pourquoi n’ont-ils pas de voix ?


    Ainsi, si quelqu’un possède la connaissance, il vient d’en haut. Quand il est appelé, il entend, il répond, il se tourne vers celui qui l’appelle, il monte vers lui et il sait de quelle manière il est appelé. Puisqu’il possède la connaissance, il accomplit la volonté de celui qui l’a appelé, désire lui plaire et reçoit le repos. Son nom devient sien. Celui qui connaît de cette manière sait d’où il est venu et où il va. Il est comme un homme qui, après avoir été ivre, se détourne de son ivresse : revenu à lui-même, il remet en ordre ce qui lui appartient.


    Il en a ramené beaucoup hors de l’Erreur. Il les a précédés jusqu’aux lieux dont ils s’étaient éloignés. Ils avaient accueilli l’Erreur à cause de la profondeur de celui qui entoure tout lieu, bien que rien ne l’entoure. Quel grand prodige : ils étaient dans le Père sans le connaître, et ils ont pu sortir par eux-mêmes, alors qu’ils étaient incapables de saisir et de connaître celui en qui ils se trouvaient. Il a révélé sa volonté sous la forme de la connaissance, en accord avec tout ce qui était sorti de lui.


    Telle est la connaissance du Livre vivant[a], qu’il a révélé aux générations à la fin : des lettres venant de lui, qui montrent qu’elles ne sont ni voyelles ni consonnes ; on pourrait les lire et les croire dépourvues de sens. Ce sont, au contraire, des lettres de la Vérité : elles parlent et se connaissent elles-mêmes. Chaque lettre est une pensée complète, comme un livre complet, car ce sont des lettres écrites par l’Unité[d]. Le Père les a écrites afin que, par ses lettres, les générations connaissent le Père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression copte peut se comprendre comme « Livre des Vivants » ou « Livre vivant ». Les deux nuances sont conservées dans ce passage.
    reason: Signaler une ambiguïté grammaticale et thématique réelle sans l’effacer par une uniformisation.
  - marker: b
    text: « Filiation » traduit ici un terme abstrait qui peut désigner la condition ou la réalité d’être fils ; le passage ne dit pas simplement « le Fils ».
    reason: Éviter une identification christologique trop précise et expliquer un terme technique peu courant.
  - marker: c
    text: L’« Erreur » est présentée comme une réalité active d’égarement ; la majuscule ne décide pas si elle doit être comprise comme une personne.
    reason: Préserver la réification du terme ainsi que l’ambiguïté de son statut.
  - marker: d
    text: L’« Unité » désigne ici la source une qui écrit les lettres ; on pourrait aussi traduire « l’Unicité ».
    reason: Éclairer un abstrait métaphysique tout en indiquant une autre traduction possible.
