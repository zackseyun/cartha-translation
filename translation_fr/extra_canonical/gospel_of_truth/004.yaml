- source_word: ⲥⲁⲛϩⲣⲉ
  choice: la Filiation
  rationale: Le substantif abstrait garde la portée technique du terme et évite de le réduire sans preuve à « le Fils ».
- source_word: ⲥⲧⲏⲣⲟⲩ
  choice: le repos
  rationale: Rend le motif sotériologique du repos dans un français simple et digne.
- source_word: ⲥⲁⲩⲛⲉ
