  yaml_path: translation/extra_canonical/gospel_of_truth/003.yaml
  text: 'The Father—the one who cannot be contained—is the one who kept the All within himself[a], and the All is within him, and all have need of him. He kept their wholeness within himself; he was not jealous, for what jealousy could there be between him and his members? If, in this way, the All had already received it, they could not have come to him. He keeps it for them within himself, to give it to them so that they may return to him with a single knowledge in rest, in one body.


    Like one who is unknown, he desires to be known and to be loved—for what did all need except the Father’s knowledge? He became a guide—peaceful and unhurried. He came into the places of learning and spoke the Word as a teacher. Those who were wise in their own hearts came up to test him; yet he confounded them, for they were vain. They hated him because they were not wise in the Truth. After them the little children came also—theirs is the Father’s knowledge. When they were strengthened, they received instruction about the Father’s expressions. They knew, and they were known. They received glory and gave glory. In their heart the Living Book of the Living was revealed, written in the thought and in the mind of the Father, and before the foundation of all, within his incomprehensibility—a book that no one has the power to take, since it is appointed for the one who takes it to be killed. It is impossible that anyone be manifested among those entrusted with salvation unless that book should
    appear.


    Because of this, the merciful and faithful Jesus endured patiently until he took that book, for he knows that his death is life for many. As long as a testament has not been opened, the wealth of the deceased master of the house is hidden; so also, while the Father of the All was invisible, all things were hidden, for they are from him, from whom every realm comes. Because of this, Jesus was manifested; he put on that book; he was nailed to a tree; he published the Father’s decree on the cross.


    O the great teaching! He drew himself down to death; he clothed himself in eternal life; he stripped off the perishable rags; he put on incorruptibility, which no one can take from him. When he entered the empty places of dread, he passed by those who had been stripped by forgetfulness—being knowledge and completion—proclaiming what is in the heart to those who are ready to receive instruction.'
translation:
  language: fr
  text: '## L’Évangile


    Le Père, que rien ne peut contenir, gardait en lui leur plénitude, afin de la leur donner pour qu’ils reviennent à lui dans une connaissance unifiée, dans le repos, un dans la plénitude. C’est lui qui a fait le Tout[a] : le Tout est en lui, et le Tout a besoin de lui. Il est comme quelqu’un qui demeure inconnu, mais qui désire être connu et aimé. Car de quoi le Tout avait-il besoin, sinon de la connaissance du Père ?


    Il devint un guide, paisible et sans hâte. Il vint au milieu des lieux d’enseignement et prononça la Parole en maître. Ceux qui se croyaient sages vinrent à lui pour le mettre à l’épreuve. Mais il les confondit, car ils étaient vides. Ils le détestèrent parce qu’ils n’étaient pas véritablement sages. Après eux vinrent aussi les petits enfants, ceux à qui appartient la connaissance du Père. Une fois affermis, ils reçurent un enseignement sur les expressions du Père. Ils connurent et furent connus ; ils reçurent la gloire et rendirent gloire.


    Dans leur cœur se révéla le Livre vivant des vivants, écrit dans la pensée et l’intelligence du Père, avant la fondation du Tout, au sein de son insondable réalité. Personne n’a le pouvoir de prendre ce livre, puisqu’il est établi que celui qui le prendra sera mis à mort. Nul, parmi ceux à qui le salut avait été confié, ne pouvait être manifesté à moins que ce livre ne paraisse.


    C’est pourquoi Jésus, plein de compassion et de fidélité, supporta patiemment les souffrances jusqu’à ce qu’il prenne ce livre, car il savait que sa mort serait la vie pour beaucoup. Tant qu’un testament[b] n’a pas été ouvert, les biens du maître de maison défunt restent cachés. De même, tant que le Père du Tout demeurait invisible, le Tout restait caché, puisqu’il vient de celui dont procède tout domaine.


    C’est pourquoi Jésus fut manifesté. Il revêtit ce livre, fut cloué à un arbre et publia sur la croix le décret du Père.


    Oh ! quel grand enseignement ! Il s’abaissa lui-même jusqu’à la mort, mais se revêtit de la vie éternelle. Il se dépouilla des haillons périssables et se revêtit de l’incorruptibilité, que personne ne peut lui enlever. Lorsqu’il entra dans les lieux vides de l’effroi, il passa au milieu de ceux que l’oubli avait dépouillés. Étant lui-même connaissance et plénitude, il proclama ce qui est dans le cœur à ceux qui sont prêts à recevoir l’enseignement.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Tout » désigne ici l’ensemble ou la totalité de ce qui est en relation avec le Père ; le terme a une portée plus large et plus technique que le simple pronom « tout ».
    reason: Clarifier un emploi substantivé inhabituel sans réduire sa portée métaphysique.
  - marker: b
    text: Le mot peut aussi signifier « disposition testamentaire » ; dans cette comparaison successorale, il ne signifie probablement pas « alliance ».
    reason: Signaler la polysémie du terme grec emprunté et justifier le sens juridique retenu.
  - marker: c
    text: Le manuscrit se poursuit ici dans une phrase endommagée ; la traduction s’arrête à la limite de la présente section éditoriale.
    reason: Avertir le lecteur que la fin fournie est fragmentaire et que la phrase appartient à un contexte continu.
lexical_decisions:
- source_word: ⲡⲧⲏⲣϥ
  choice: le Tout
  rationale: Le substantif désigne la totalité dans un registre métaphysique propre au traité. « Le Tout » conserve cette valeur technique sans la réduire à l’univers matériel.
- source_word: ⲡϫⲱⲕ / ⲟⲩϫⲱⲕ
  choice: plénitude
  rationale: Dans ce passage, le mot évoque l’accomplissement ou la complétude gardée dans le Père. « Plénitude » maintient le motif théologique récurrent ; « corps » ne convient pas ici au lexème ni au contexte immédiat.
- source_word: ⲥⲁⲩⲛⲉ
  choice: connaissance
  rationale: Terme central du traité ; « connaissance » reste intelligible tout en conservant sa portée technique, sans imposer le terme spécialisé « gnose ».
- source_word: ⲥⲧⲟⲩⲱⲣⲁⲩ
  choice: repos
  rationale: Rend le motif sotériologique du repos et s’intègre naturellement à la formule associant connaissance, repos et plénitude.
- source_word: ⲡⲓϣⲉϫⲉ
  choice: la Parole
  rationale: Le contexte personnifié et pédagogique justifie la majuscule sans préciser davantage l’identité théologique du terme.
- source_word: ⲡⲓϫⲱⲱⲙⲉ ⲉⲧⲁⲛϩ ⲛⲧⲉ ⲛⲉⲧⲁⲛϩ
  choice: le Livre vivant des vivants
  rationale: Conserve le jeu de répétition entre le livre vivant et les vivants, ainsi que le statut symbolique du livre.
- source_word: ⲙⲉⲉⲩⲉ … ⲛⲟⲩⲥ
  choice: pensée et intelligence
  rationale: Maintient les deux termes distincts. « Intelligence » rend ici naturellement le grec νοῦς emprunté par le copte, sans jargon philosophique excessif.
- source_word: ⲇⲓⲁⲑⲏⲕⲏ
  choice: testament
  rationale: La comparaison porte sur les biens cachés d’un défunt et l’ouverture d’un acte successoral ; « testament » rend donc le sens juridique plutôt que « alliance ».
- source_word: ⲇⲓⲁⲧⲁⲅⲙⲁ
  choice: décret
  rationale: Le mot grec emprunté désigne une ordonnance promulguée ; « décret » convient à l’image d’une publication publique.
- source_word: ⲧⲃϣⲉ
  choice: arbre
  rationale: Le copte désigne explicitement le bois ou l’arbre auquel Jésus est cloué ; la traduction ne remplace pas ce terme par « croix ».
theological_decisions:
- issue: Valeur de ⲡⲧⲏⲣϥ
  choice: le Tout
  alternative: la totalité ; l’univers
  rationale: Le choix préserve le langage métaphysique du texte et son ambiguïté quant à l’étendue exacte de ce qui procède du Père.
- issue: Unité dans la formule ⲟⲩⲉⲉⲓ ϩⲛ ⲟⲩϫⲱⲕ
  choice: un dans la plénitude
  alternative: en un seul corps
  rationale: Le lexème ϫⲱⲕ exprime ici la complétude ou la plénitude. Traduire par « corps » résoudrait indûment la métaphore et introduirait une idée que le mot n’exprime pas directement.
- issue: Lien entre le livre et la mort de celui qui le prend
  choice: énoncé littéralement comme une disposition conduisant à la mise à mort
  alternative: interpréter directement cette mort comme sacrifice rédempteur
  rationale: Le texte relie ensuite la mort de Jésus à la vie de beaucoup, mais la traduction conserve d’abord la formulation énigmatique du livre sans explicitation doctrinale.
- issue: Instrument de supplice et lieu de proclamation
  choice: « arbre » pour le clouage, « croix » pour la proclamation
  alternative: « croix » dans les deux cas
  rationale: Le passage emploie l’image de l’arbre pour le clouage, tandis que la seconde expression est traditionnellement comprise comme la croix. La variation du texte est préservée.
- issue: La mort de Jésus comme vie pour beaucoup
  choice: « sa mort serait la vie pour beaucoup »
  alternative: « sa mort donne le salut à beaucoup »
  rationale: La formulation paradoxale du texte est conservée sans lui substituer une théorie précise de l’expiation.
translation_notes:
  register: Français international moderne, soutenu mais courant. Les périodes longues du copte ont été légèrement articulées pour la lisibilité, tout en conservant les répétitions structurantes autour du Père, du Tout, de la connaissance, du livre, de la mort et de la vie. Les images juridico-testamentaires et celles du vêtement ont été maintenues sans paraphrase confessionnelle. Le début traduit suit la portion continue et intelligible de la page 19 ; les lignes initiales mutilées ne sont pas reconstruites conjecturalement.
