  verdict: revise
  source_fidelity: 'Révision nécessaire. Le projet omet une portion substantielle de la séquence présente sur la p. 21 et réorganise le début en fusionnant deux mouvements distincts : le don du repos et de la connaissance, puis le retour au Père dans une connaissance unifiée. Il omet aussi l’énoncé selon lequel le Père n’avait pas donné leur plénitude. La révision restitue ces éléments sans résoudre les formulations volontairement abstraites du traité.'
  naturalness: Le français est globalement naturel et conserve un registre soutenu accessible. La version révisée allège quelques constructions calquées et maintient les répétitions rhétoriques du Père, du Tout, de la connaissance et de la plénitude.
  terminology: « Le Tout », « plénitude », « connaissance », « repos », « Livre vivant des vivants », « testament », « décret », « arbre » et « croix » sont conservés de façon cohérente. « Intellect » rend ici plus exactement le grec emprunté νοῦς, en parallèle avec « pensée ».
  issues:
  - severity: high
    issue: Omission de la continuation de la page 21
    rationale: Le texte source fourni se poursuit après « ceux qui sont prêts à recevoir l’enseignement » et développe le retour de chacun au Père, les noms dans le Livre des vivants et l’ignorance. La note c affirme à tort que la présente section s’arrête là.
  - severity: high
    issue: Fusion et déplacement de propositions au premier paragraphe
    rationale: Le copte distingue le don de « leur repos et [de] la connaissance, chacun dans une plénitude » de la proposition ultérieure sur le retour au Père « dans une connaissance unique, dans la plénitude ». Le projet transforme le premier mouvement en un retour et efface le refus initial de donner cette plénitude.
  - severity: medium
    issue: Temps de « il savait que sa mort serait »
    rationale: Le texte emploie le présent (« il sait que sa mort est vie pour beaucoup »). Le présent conserve mieux la portée déclarative et paradoxale de la phrase.
  - severity: low
    issue: Note c devenue inexacte
    rationale: Le passage source inclut la continuation de la phrase sur la page 21 ; l’avertissement de fin de section doit donc être supprimé.
  revised_text: '## L’Évangile


    Le Père est celui qui garde en lui leur plénitude, afin de leur donner leur repos et la connaissance, chacun dans une plénitude. C’est lui qui a fait le Tout[a] : le Tout est en lui, et le Tout a besoin de lui. Il a gardé en lui leur plénitude, sans la leur donner. Le Père n’était pas jaloux : quelle jalousie, en effet, pourrait-il y avoir entre lui et ses membres ? Car si le Tout l’avait reçue ainsi, il n’aurait pas pu venir au Père. Il garde leur plénitude en lui-même afin de la leur donner, pour qu’ils reviennent à lui dans une connaissance unique, dans la plénitude.


    Comme quelqu’un qui demeure inconnu, il désire être connu et aimé. Car de quoi le Tout avait-il besoin, sinon de la connaissance du Père ? Il devint un guide, paisible et sans hâte. Il vint dans les lieux d’enseignement et prononça la Parole en maître. Ceux qui se croyaient sages vinrent à lui pour le mettre à l’épreuve ; mais il les confondit, car ils étaient vides. Ils le détestèrent parce qu’ils n’étaient pas sages dans la vérité. Après eux vinrent aussi les petits enfants : à eux appartient la connaissance du Père. Une fois affermis, ils reçurent un enseignement sur les paroles du Père. Ils connurent et furent connus ; ils reçurent la gloire et rendirent gloire.


    Dans leur cœur se révéla le Livre vivant des vivants, écrit dans la pensée et dans l’intellect du Père, avant la fondation du Tout, au sein de son insondable réalité. Personne n’a le pouvoir de prendre ce livre, puisqu’il est établi que celui qui le prendra sera mis à mort. Nul, parmi ceux à qui le salut avait été confié, ne pouvait être manifesté à moins que ce livre ne paraisse.


    C’est pourquoi Jésus, plein de compassion et de fidélité, supporta patiemment les souffrances jusqu’à ce qu’il prenne ce livre, car il sait que sa mort est vie pour beaucoup. Tant qu’un testament[b] n’a pas été ouvert, les biens du maître de maison défunt restent cachés. De même, lorsque le Père du Tout était invisible, le Tout demeurait caché, car il vient de celui dont procède tout domaine.


    C’est pourquoi Jésus fut manifesté. Il revêtit ce livre, fut cloué à un arbre et publia sur la croix le décret du Père.


    Oh ! quel grand enseignement ! Il s’abaissa lui-même jusqu’à la mort ; il se revêtit de la vie éternelle. Il se dépouilla des haillons périssables et se revêtit de l’incorruptibilité, que personne ne peut lui enlever. Lorsqu’il entra dans les lieux vides de l’effroi, il passa parmi ceux que l’oubli avait dépouillés. Lui qui était connaissance et plénitude, il proclamait ce qui est dans le cœur ; car il enseignera ceux qui recevront l’enseignement.


    Ce sont les vivants, eux dont les noms sont inscrits dans le Livre des vivants. Ils reçoivent un enseignement sur eux-mêmes ; ils le reçoivent du Père et retournent de nouveau vers lui. Puisque la plénitude du Tout est dans le Père, il est nécessaire que le Tout monte vers lui. Alors chacun, ayant reçu ce qui lui appartient, se connaîtra lui-même et reviendra vers le Père.


    Car celui qui est dans l’ignorance est dans le manque, et grand est le manque qui lui fait défaut. Puisque la plénitude du Tout est dans le Père, il est nécessaire que le Tout monte vers lui. Dès lors que chacun recevra ce qui lui appartient, ceux qu’il a connus d’avance seront préparés ; et il les appellera du dedans de lui-même. Ceux qu’il a connus d’avance ont été appelés par leur nom. Le Père a fait sortir son nom.


    Car celui dont le nom n’est pas sorti demeure dans l’ignorance. Comment, en effet, quelqu’un pourrait-il écouter si son nom n’a pas été prononcé ? Celui qui demeure dans l’ignorance jusqu’à la fin est une créature de l’oubli ; avec lui, il sera détruit.'
