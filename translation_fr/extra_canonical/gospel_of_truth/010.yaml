  consult_excerpt: 'He’s the shepherd who left behind the ninety- 32 nine sheep which weren’t lost. He went and searched for the one which was lost. He rejoiced when he found it, because ninety-nine is a number expressed with the left hand. However, when the one is found, the numerical sum moves to the right hand. In this way, what needs the one – that is, the whole right hand – draws what it needs, takes it from the left hand, and moves it to the right, so the number becomes one hundred. This is a symbol of the sound of these numbers; this is the Father.

    Even on the Sabbath, he worked for the sheep which he found fallen in the pit. He saved the life of the sheep, having brought it up from the pit, so that you may know in your hearts – you’re children of the knowledge of the heart – what is the Sabbath, on which it isn’t right for salvation to be idle, so that you may speak of the day which is above, which has no night, and of the light that doesn’t set, because it’s complete. Speak then from the heart, because you’re the completed day, and the light that doesn’t cease dwells within you. Speak of the Truth with those who search for it, and of knowledge with those who’ve sinned in their Error.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/010.yaml
  text: 'He is the shepherd who left the ninety‑nine sheep that had not gone astray[a], and he went and sought the one that had wandered. When he found it, he rejoiced over it, because ninety‑nine is a number on the left hand. But when the one is found, the reckoning moves to the right hand. In this way, what needs the one—that is, the whole of the right hand—draws what it needs, taking it from the left hand and transferring it to the right, so that the number becomes a hundred. This is a sign of the sound of these numbers; it is the Father.


    Even on the Sabbath he labored for the sake of the sheep that he found fallen into the pit. He saved the life of the sheep, having brought it up out of the pit, so that you may know in your heart—since you are children of the knowledge of the heart—what the Sabbath is: that on it it is not fitting for salvation to be idle, so that you may speak of the Day which is above, which has no night, and of the Light that does not set, because it is complete. Speak, then, from the heart, for you are the perfect Day, and the light that does not fail dwells within you. Speak of the Truth with those who seek it[b], and of Knowledge with those who have sinned in their Error.'
translation:
  language: fr
  text: 'C’est le berger qui laissa les quatre-vingt-dix-neuf brebis qui ne s’étaient pas égarées, puis partit chercher celle qui s’était éloignée. Lorsqu’il la trouva, il s’en réjouit, car quatre-vingt-dix-neuf est un nombre qui se compte sur la main gauche. Mais quand le nombre un est retrouvé, le compte passe à la main droite. Ainsi, ce qui a besoin du nombre un — c’est-à-dire la main droite tout entière — attire ce dont il a besoin : il le prend de la main gauche et le fait passer dans la main droite, de sorte que le nombre devient cent. C’est là un signe du son de ces nombres[a] : c’est le Père.


    Même le sabbat, il travailla pour la brebis qu’il trouva tombée dans la fosse. Il sauva la vie de la brebis en la faisant remonter de la fosse, afin que vous sachiez dans vos cœurs — vous qui êtes les enfants de la connaissance du cœur[b] — ce qu’est le sabbat, où il ne convient pas que le salut reste inactif, et que vous parliez du Jour d’en haut, qui ne connaît pas de nuit, et de la Lumière qui ne se couche pas, car elle est pleinement accomplie. Parlez donc du fond du cœur, car vous êtes le Jour pleinement accompli, et la Lumière qui ne s’éteint pas demeure en vous. Parlez de la Vérité avec ceux qui la cherchent, et de la Connaissance avec ceux qui ont péché dans leur Erreur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la voix de ces nombres ».'
    reason: Le terme copte peut évoquer aussi bien le son que la voix; le contexte ne tranche pas entièrement.
  - marker: b
    text: 'Ou : « les enfants de la pensée du cœur » ou « de l’intelligence du cœur ».'
    reason: Le mot traduit par « connaissance » possède aussi les sens de pensée et d’intelligence.
lexical_decisions:
- source_word: ⲥⲁⲩ
  choice: brebis
  rationale: Le terme copte désigne normalement un mouton ou une brebis. « Brebis » convient à la parabole en français et permet de maintenir le passage du groupe à l’animal unique.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Erreur
  rationale: Dans l’œuvre, le terme grec emprunté au copte peut désigner une puissance personnifiée opposée à la Connaissance. La majuscule conserve cette valeur technique sans l’expliciter davantage.
- source_word: ⲟⲩⲱⲡⲉ
  choice: nombre / compte
  rationale: Le contexte porte sur 99, 1 et 100 ainsi que sur le calcul digital. « Nombre » désigne la valeur obtenue, tandis que « compte » rend naturellement le mouvement du calcul d’une main à l’autre.
- source_word: ⲧⲁⲉⲓⲉ / ⲙⲣⲏⲧⲉ
  choice: main gauche / main droite
  rationale: L’explicitation de « main » rend l’opposition propre à l’ancien système de numération digitale.
- source_word: ⲡⲱⲱⲛⲉ
  choice: l’unité
  rationale: Le passage parle du nombre un qui complète quatre-vingt-dix-neuf. « L’unité » garde la portée numérique sans imposer le titre métaphysique « l’Un ».
- source_word: ϫⲏⲕ
  choice: pleinement accompli(e)
  rationale: Le mot signifie achevé, complet ou parfait. La même formulation appliquée à la Lumière et au Jour préserve la reprise rhétorique du copte.
- source_word: ⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: sabbat
  rationale: Terme religieux établi en français, qui conserve la référence au jour consacré.
- source_word: ⲡⲟⲩϫⲁⲉⲓ
  choice: salut
  rationale: « Salut » maintient la portée sotériologique du substantif, au-delà du seul sauvetage matériel de la brebis.
- source_word: ⲡⲓϩⲱⲟⲩ / ⲡⲟⲩⲁⲉⲓⲛ
  choice: Jour / Lumière
  rationale: Les majuscules signalent leur emploi symbolique et transcendant dans ce passage, sans ajouter d’identification doctrinale.
theological_decisions:
- issue: Statut de ⲡⲗⲁⲛⲏ
  choice: « Erreur » avec une majuscule dans la dernière phrase
  alternative: « erreur » au sens générique
  rationale: L’usage du terme dans l’Évangile de Vérité lui donne souvent une valeur active ou personnifiée, opposée à la Connaissance. La traduction conserve cette tension.
- issue: Sens de ⲧⲣⲁⲩ dans l’expression relative aux nombres
  choice: « son »
  alternative: « voix »
  rationale: Les deux lectures sont possibles. « Son » préserve l’image acoustique sans faire nécessairement des nombres un sujet parlant; l’autre possibilité est donnée en note.
- issue: Valeur de ⲙⲉⲉⲩⲉ dans « enfants de… du cœur »
