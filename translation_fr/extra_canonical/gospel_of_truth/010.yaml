revisions:
- from: 'Il est le berger qui laissa les quatre-vingt-dix-neuf brebis qui ne s’étaient pas égarées, puis partit chercher celle qui s’était éloignée. Lorsqu’il la trouva, il s’en réjouit, car quatre-vingt-dix-neuf est un nombre qui se compte sur la main gauche. Mais quand l’unité est retrouvée, le compte passe à la main droite. Ainsi, ce qui a besoin de l’unité — c’est-à-dire la main droite tout entière — attire ce dont il a besoin : il le prend de la main gauche et le fait passer à la droite, de sorte que le nombre devient cent. C’est là un signe du son de ces nombres[a] : c’est le Père.


    Même le jour du sabbat, il travailla pour la brebis qu’il avait trouvée tombée dans la fosse. Il sauva la vie de la brebis en la faisant remonter de la fosse, afin que vous sachiez dans votre cœur — vous qui êtes les enfants de la connaissance du cœur[b] — ce qu’est le sabbat : le salut ne doit pas y rester inactif. Ainsi, vous pourrez parler du Jour d’en haut, qui ne connaît pas de nuit, et de la Lumière qui ne se couche pas, car elle est pleinement accomplie. Parlez donc du fond du cœur, car vous êtes le Jour pleinement accompli, et la Lumière qui ne s’éteint pas demeure en vous. Parlez de la Vérité avec ceux qui la cherchent, et de la Connaissance avec ceux qui ont péché dans leur Erreur.'
