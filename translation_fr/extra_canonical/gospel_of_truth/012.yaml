    La parole de la Bonne Nouvelle au sujet de la découverte de la Plénitude s’adresse à ceux qui attendent le salut qui vient d’en haut.[a] Tandis qu’ils l’attendent, l’espérance appartient à ceux dont l’image est lumière, sans aucune ombre. Quand donc la Plénitude vient, le besoin de la matière ne vient pas de l’infinité du Père ; celui-ci vient accorder un temps au besoin. Pourtant, personne ne peut dire que l’Incorruptible viendra de cette manière. Mais la Profondeur du Père s’est multipliée, et la pensée de l’Erreur n’était pas auprès de lui. L’Erreur est une chute, quelque chose qu’il est facile de redresser par la découverte de celui qui viendra vers ce à quoi il retournera. Car le retour est appelé « changement de pensée ».[b]


    C’est pourquoi l’Incorruptibilité a exhalé son souffle. Elle a suivi celui qui avait péché, afin qu’il trouve le repos. Car ce qui demeure pour la lumière dans le besoin, c’est le pardon — la Parole de la Plénitude. En effet, le médecin se hâte vers l’endroit où se trouve la maladie, parce que telle est sa volonté. Celui qui est dans le besoin ne le cache pas, car quelqu’un possède ce qui lui manque. Ainsi, la Plénitude, qui ne manque de rien, a donné de ce qui lui appartient pour combler le besoin, afin qu’ils reçoivent la grâce. En effet, lorsqu’ils étaient dans le besoin, ils n’avaient pas la grâce. C’est pourquoi une diminution s’est produite là où la grâce n’était pas. Mais lorsque ce qui avait diminué a été rétabli, ce qui manquait s’est révélé être Plénitude. Telle est la découverte de la lumière de la Vérité, qui les a éclairés, car elle est immuable.


    C’est pourquoi on a parlé du Messie[c] au milieu d’eux : « Cherchez, et ceux qui ont été troublés reviendront ; il les oindra de chrême. » Le chrême est la compassion du Père, et il aura compassion d’eux. Ceux qu’il a oints sont les accomplis, car ce sont les récipients pleins que l’on oint. Mais lorsque l’onction de l’un d’eux se dissout, il se vide. Le besoin vient alors de l’endroit par lequel l’huile s’écoule, car un souffle, avec sa puissance, l’attire au-dehors. En revanche, chez celui qui ne manque de rien, aucun sceau ne se défait et rien ne se vide. Ce qui lui manque, le Père, qui est complet, le remplit de nouveau de lui-même. Il est bon ; il connaît ceux qu’il a plantés, car c’est lui qui les a plantés dans son Paradis. Or son Paradis est son lieu de repos.'
