  consult_excerpt: 'This is the Word of the Gospel of the discovery of the fullness, which comes for those who are awaiting 35 the salvation which is coming from above. The hope for which they’re waiting is waiting for those whose image is light with no shadow in it. If at that time the fullness comes, the need of matter doesn’t come through the infinity of the Father, who comes to give time to the need – although no one can say that the incorruptible one will come like this. But the depth of the Father multiplied, and the thought of Error didn’t exist with him. It’s something that’s fallen, which is easily set upright in the discovery of the one who’s to come to what he’ll return, because the return is called “repentance.”

    Because of this, incorruptibility breathed out. It followed after the one who sinned, so that they might rest, because forgiveness is what remains for the light in need, the Word of fullness. For the doctor hurries to the place where there’s sickness, because that’s what he (or she) wants to do. The one in need, then, doesn’t hide it, because one (the doctor) has what they need. In this way the fullness, which has no need but fills the need, is what he 36 provided from himself to fill up what’s needed, so that they might receive grace; because when they were in need, they didn’t have grace. Because of this, a diminishing took place where there is no grace. When what was diminished was restored, what they needed was revealed as fullness. This is the discovery of the light of Truth which enlightened them, because it doesn’t change.

    Because of this, they spoke of Christ in their midst: “Seek, and those who were disturbed will receive a return – and he’ll anoint them with ointment.” The ointment is the mercy of the Father, who will have mercy on them. But those whom he anointed are those who have been completed, because full jars are the ones that are anointed. But when the anointing of one dissolves, it empties, and the cause of the need is the place where the ointment leaks, because a breath and its power draws it. But from the one who has no need, no seal is removed, nor is anything emptied, but what it needs is filled again by the Father, who’s complete.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/012.yaml
  text: 'The speech of the Good News about the finding of the Fullness is for those who await the salvation that comes from above[a]. While they wait for it, the hope belongs to those whose image is light with no shadow in it. When, then, the Fullness arrives, the need of hylē (matter) is not from the immeasurability of the Father; he comes to grant a season to the need. Yet no one is able to say that the Incorruptible comes in such a manner. Rather, the Depth of the Father grew and multiplied, and the thought of Error was not with him. Error is a fall—something easy to set upright by the finding of the one who will come back to that to which he returns, for the return is named change of mind.


    Because of this, Incorruptibility breathed forth; it pursued the one who had sinned, so that he might find rest. For what remains for the light in need is forgiveness—the Word of the Fullness. For the physician runs to the place where sickness is, because that is what he wills. And the one in need does not hide, for someone possesses what that one needs. In this way the Fullness—which has no need—provided from itself to fill up the need, so that they might receive grace. For when they were in need, grace was not with them. Because of this, a diminishing took place where there is no grace; and when what was diminished was restored, the need was shown as Fullness. This is the finding of the light of the Truth that enlightened them, for it is unchangeable.


    Because of this, they spoke concerning the Messiah in their midst: “Seek, and those who were disturbed will return, and he will anoint them with chrism.” The chrism is the mercy of the Father, and he will have mercy on them. Now those whom he anointed are the perfect—for full vessels are the ones anointed. But when the anointing of one dissolves, it is emptied, and the cause of the need is the place where the ointment leaks out, because a breath and its power draw it. Yet from the one who has no need no seal is loosened, and nothing is emptied; rather, what it needs the Father—who is complete—fills again with him. He is good; he knows his plantings, because it is he who planted them in his Paradise[c][b]. Now his Paradise is his place of rest.'
translation:
  language: fr
  text: '**Restaurer ce qui manquait**


    La parole de la Bonne Nouvelle au sujet de la découverte de la Plénitude s’adresse à ceux qui attendent le salut qui vient d’en haut.[a] Tandis qu’ils l’attendent, l’espérance appartient à ceux dont l’image est lumière, sans aucune ombre. Quand donc la Plénitude vient, le besoin de la matière ne vient pas de l’infinité du Père ; celui-ci vient au temps du besoin. Pourtant, personne ne peut dire que l’Incorruptible viendra de cette manière. Mais la Profondeur du Père s’est multipliée, et la pensée de l’Erreur n’était pas auprès de lui. L’Erreur est quelque chose qui est tombé, qu’il est facile de redresser par la découverte de celui qui viendra vers ce à quoi il retournera. Car le retour est appelé « changement de pensée ».[b]


    C’est pourquoi l’Incorruptibilité a exhalé son souffle. Elle a suivi celui qui avait péché, afin qu’il trouve le repos. Car ce qui demeure pour la lumière dans le besoin, c’est le pardon — la Parole de la Plénitude. En effet, le médecin se hâte vers l’endroit où se trouve la maladie, parce que telle est sa volonté. Celui qui est dans le besoin ne le cache pas, car quelqu’un possède ce qui lui manque. Ainsi, la Plénitude, qui ne manque de rien, a pourvu d’elle-même à combler le besoin, afin qu’ils reçoivent la grâce. En effet, lorsqu’ils étaient dans le besoin, ils n’avaient pas la grâce. C’est pourquoi une diminution s’est produite là où la grâce n’était pas. Mais lorsque ce qui avait diminué a été rétabli, ce qui manquait s’est révélé être Plénitude. Telle est la découverte de la lumière de la Vérité, qui les a éclairés, car elle est immuable.


    C’est pourquoi on a parlé du Messie[c] au milieu d’eux : « Cherchez, et ceux qui ont été troublés recevront un retour ; il les oindra de chrême. » Le chrême est la compassion du Père, et il aura compassion d’eux. Ceux qu’il a oints sont les accomplis, car ce sont les récipients pleins qui sont oints. Mais lorsque l’onction de l’un d’eux se dissout, elle se vide. Le besoin vient alors de l’endroit par lequel l’huile s’écoule, car un souffle, avec sa puissance, l’attire au-dehors. En revanche, chez celui qui ne manque de rien, aucun sceau ne se défait et rien ne se vide. Ce qui lui manque, le Père, qui est complet, le remplit de nouveau de lui-même. Il est bon ; il connaît ses plantations, car c’est lui qui les a plantées dans son Paradis. Or son Paradis est son lieu de repos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre construction possible : « La parole de la Bonne Nouvelle au sujet de la découverte de la Plénitude vient à ceux qui attendent le salut qui vient d’en haut ; l’espérance qu’ils attendent appartient à ceux dont l’image est lumière, sans aucune ombre. »'
    reason: La syntaxe de l’ouverture est difficile ; cette alternative conserve le salut venant d’en haut, explicitement attesté dans le texte.
  - marker: b
    text: Ou « repentance ». Le mot grec met ici l’accent sur un changement intérieur, que le passage associe au retour.
    reason: Préserve à la fois la nuance cognitive de metanoia et son équivalent religieux traditionnel.
  - marker: c
    text: Ou « Christ ».
    reason: Le copte abrège le grec Christos, qui peut être rendu comme titre (« Messie ») ou sous sa forme traditionnelle (« Christ »).
lexical_decisions:
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: la Plénitude
  rationale: Conserve la portée conceptuelle du terme grec plērōma tout en restant immédiatement intelligible en français.
- source_word: ⲧϩⲩⲗⲏ
  choice: la matière
  rationale: Rend directement le prêt philosophique grec hylē sans imposer au lecteur une translittération technique.
- source_word: ⲁⲧⲧⲉⲕⲟ / ⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: l’Incorruptible / l’Incorruptibilité
  rationale: Distingue l’emploi personnel de l’emploi abstrait, comme le fait le passage.
- source_word: ⲃⲁⲑⲟⲥ
  choice: la Profondeur
  rationale: Préserve l’épithète cosmologique sans la préciser en « Abîme », qui serait plus interprétatif.
- source_word: ⲡⲗⲁⲛⲏ
  choice: l’Erreur
  rationale: La majuscule rend perceptible la personnification présente dans le traité.
- source_word: ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: changement de pensée
  rationale: Met en relief la réorientation intérieure associée explicitement au retour ; « repentance » est conservé en note.
- source_word: ⲡⲥⲁⲉⲓⲛ
  choice: le médecin
  rationale: Correspond à l’image concrète de la maladie et des soins tout en gardant un registre digne.
- source_word: ⲧⲱϩⲥ
  choice: chrême / oindre
  rationale: Conserve la dimension rituelle de l’onction ; « huile » est employé lorsque le texte décrit matériellement l’écoulement.
- source_word: ⲧⲉⲗⲓⲟⲥ
  choice: les accomplis
  rationale: Exprime l’état d’achèvement sans suggérer d’abord une perfection morale absolue.
- source_word: ⲡⲭⲥ
  choice: le Messie
  rationale: Traduit le titre Χριστός ; la forme traditionnelle « Christ » est signalée en note.
- source_word: ⲡϣⲧⲁ
  choice: besoin / ce qui manque
  rationale: Fait entendre à la fois la nécessité et la déficience que la Plénitude vient combler.
- source_word: ϭⲱϭⲉ / ⲧⲱϭⲉ
  choice: ceux qu’il a plantés / les a plantés
  rationale: Rétablit la métaphore agricole explicite du texte copte à la fin du passage.
theological_decisions:
- issue: Le rapport entre la Plénitude et le besoin de la matière
  choice: 'Maintien de l’énoncé paradoxal : « le besoin de la matière ne vient pas de l’infinité du Père »'
  alternative: Expliquer que la déficience est entièrement étrangère au Père
  rationale: Le copte formule une relation difficile et tendue ; la traduction ne transforme pas cette formulation en système cosmologique explicite.
- issue: Sens de ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: changement de pensée
  alternative: repentance
  rationale: Le contexte définit le terme par le « retour ». La note garde l’équivalent religieux traditionnel sans réduire le champ sémantique du texte principal.
- issue: Titre ⲡⲭⲥ
  choice: Messie
  alternative: Christ
  rationale: Le terme est rendu comme un titre, tandis que la note préserve la désignation chrétienne traditionnelle.
- issue: Imagerie du chrême et du sceau
  choice: chrême, onction et sceau conservés
  alternative: huile, application et marque
  rationale: Ces termes maintiennent l’imagerie rituelle du passage sans en tirer une doctrine sacramentelle particulière.
- issue: Les « accomplis »
  choice: les accomplis
  alternative: les parfaits
  rationale: Le choix exprime l’idée d’avoir été mené à son plein accomplissement et évite de résoudre cette catégorie en perfection morale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes structurants du traité — Plénitude, Profondeur, Erreur, Incorruptibilité — gardent leur relief conceptuel. Les phrases ont été légèrement réorganisées pour la lisibilité sans effacer les ambiguïtés du copte, en particulier autour du besoin, de la matière, du retour et de l’image des récipients oints.
