revisions:
- from: '**L’Évangile de Vérité — Le lieu du repos**


    Mais ceux-ci ne se manifestent pas de cette manière[a].


    Car ils ne se sont pas élevés eux-mêmes, ils n’ont pas non plus diminué la gloire du Père. Ils ne l’ont considéré ni comme insignifiant, ni comme dur, ni comme courroucé. Au contraire, il est sans mal, sans trouble et plein de douceur. Il connaît toutes choses avant qu’elles viennent à l’existence et n’a besoin d’être instruit par personne.


    Telle est la condition de ceux qui possèdent quelque chose de la Grandeur incommensurable d’en haut. Ils attendent seulement l’Être accompli[b], qui est pour eux une Mère. Ils ne descendent pas dans l’Hadès[c] ; il n’y a parmi eux ni envie, ni gémissement, ni mort. Ils trouvent plutôt le repos en Celui qui est au repos, sans peiner ni se contorsionner à la recherche de la Vérité. Au contraire, ils sont eux-mêmes la Vérité : le Père est en eux et ils sont dans le Père. Ils sont accomplis, sans être séparés de Celui qui est véritablement bon. Ils ne manquent de rien, mais se reposent, rassasiés dans l’Esprit[d].


    Ils écouteront leur racine et s’attacheront aux réalités dans lesquelles chacun trouvera sa racine[e], afin de ne subir aucune perte dans son âme. Tel est le lieu des bienheureux ; tel est leur lieu.'
  to: '**L’Évangile de Vérité — Le lieu du repos**


    Mais ils ne se manifestent pas ainsi[a].


    Car ils ne se sont pas élevés eux-mêmes, ils n’ont pas non plus diminué la gloire du Père. Ils ne l’ont considéré ni comme insignifiant, ni comme dur, ni comme courroucé. Au contraire, il est sans mal, sans trouble et plein de douceur. Il connaît toutes choses avant qu’elles viennent à l’existence et n’a besoin d’être instruit par personne.


    Voici comment sont ceux qui possèdent quelque chose de la Grandeur incommensurable d’en haut : ils attendent l’Accompli seul[b], qui est pour eux une Mère. Ils ne descendent pas dans l’Hadès[c] ; il n’y a parmi eux ni envie, ni gémissement, ni mort. Ils trouvent plutôt le repos en Celui qui est au repos, sans peiner ni se contorsionner à la recherche de la Vérité. Au contraire, ils sont eux-mêmes la Vérité : le Père est en eux et ils sont dans le Père. Ils sont accomplis, sans être séparés de Celui qui est véritablement bon. Ils ne manquent de rien, mais se reposent, réconfortés dans l’Esprit[d].


    Ils écouteront leur racine et se consacreront aux réalités dans lesquelles chacun trouvera sa racine[e], et son âme ne subira aucune perte. Tel est le lieu des bienheureux ; tel est leur lieu.'
