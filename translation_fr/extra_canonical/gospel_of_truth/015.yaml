  consult_excerpt: 'Each one will speak about the place from which they came, and they’ll hurry to return again to the place where they received their restoration to receive from the place where they were, receiving a taste from that place and receiving nourishment, receiving growth.

    And their place of rest is their fullness. All that have emanated from the Father, then, are fullnesses, and the roots of all that have emanated from him are within the one who caused them all to grow. He gave them their destinies. Then each one was revealed, so that through their own thought […] for the place to which they send their thought is their root, which takes them up through all the heights, up to the Father. They embrace his head, which is rest for them, and they’re grasped, approaching him, as though to say that they receive his expression by means of kisses. But they’re not revealed 42 in this way, because they neither exalted themselves, nor wanted the Father’s glory, nor did they think of him as trivial or harsh or wrathful; but he’s without evil, unperturbed, and sweet. He knows every realm before they’ve come into existence, and he has no need to be instructed.

    This is the way of those who possess something of the immeasurable greatness from above, as they wait for the complete one alone, who’s a Mother for them. And they don’t go down to Hades, nor do they have envy or groaning, nor death within them, but they rest in the one who rests, not striving nor twisting around in the search for Truth. But they themselves are the Truth, and the Father is within them, and they’re in the Father, being complete. They’re undivided from the truly good one. They don’t need anything, but they rest, refreshed in the Spirit. And they’ll listen to their root. They’ll devote themselves to those things that they’ll find in their root and not suffer loss to their soul. This is the place of the blessed; this is their place.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/015.yaml
  text: 'But these are not revealed in this way[a].


    For they neither exalted themselves, nor did they diminish the Father’s glory, nor did they reckon him as small, nor as harsh, nor as wrathful; rather, he is without evil, unperturbed, and sweet. He knows everything before it comes to be, and he has no need to be instructed by anyone.


    This is the way of those who possess something of the immeasurable Greatness from above, as they await the Complete One alone, who is a Mother for them. And they do not go down to Hades, nor is there envy among them, nor groaning, nor death within them; rather, they rest in the One who rests—neither striving nor writhing in the search for the Truth. Instead, they themselves are the Truth, and the Father is within them, and they are in the Father, being complete, undivided from the truly Good One. They are not in want of anything, but they rest, refreshed in the Spirit. And they will listen to their root; they will devote themselves to the things in which they will find their root, and they will not suffer loss to their soul[c][b]. This is the place of the blessed—this is their place.'
translation:
  language: fr
  text: '**L’Évangile de Vérité — Le lieu du repos**


    Mais ils ne se manifestent pas ainsi[a].


    Car ils ne se sont pas élevés eux-mêmes, ils n’ont pas non plus diminué la gloire du Père. Ils ne l’ont considéré ni comme insignifiant, ni comme dur, ni comme courroucé. Au contraire, il est sans mal, sans trouble et plein de douceur. Il connaît toutes choses avant qu’elles viennent à l’existence et n’a besoin d’être instruit par personne.


    Voici comment sont ceux qui possèdent quelque chose de la Grandeur incommensurable d’en haut : ils attendent l’Accompli seul[b], qui est pour eux une Mère. Ils ne descendent pas dans l’Hadès[c] ; il n’y a parmi eux ni envie, ni gémissement, ni mort. Ils trouvent plutôt le repos en Celui qui est au repos, sans peiner ni se contorsionner à la recherche de la Vérité. Au contraire, ils sont eux-mêmes la Vérité : le Père est en eux et ils sont dans le Père. Ils sont accomplis, sans être séparés de Celui qui est véritablement bon. Ils ne manquent de rien, mais se reposent, réconfortés dans l’Esprit[d].


    Ils écouteront leur racine et se consacreront aux réalités dans lesquelles chacun trouvera sa racine[e], et son âme ne subira aucune perte. Tel est le lieu des bienheureux ; tel est leur lieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La première proposition achève une phrase commencée sur la page précédente du manuscrit.
    reason: Le début matériel de la page peut faire prendre à tort ⲁⲃⲁⲗ pour le commencement autonome d’une nouvelle phrase.
  - marker: b
    text: Ou « le Parfait seul » ; le terme peut exprimer aussi bien la complétude que la perfection.
    reason: Préserver l’étendue sémantique de ϫⲏⲕ, tandis que « seul » rend la portée de ⲁⲃⲁⲗ dans cette expression.
  - marker: c
    text: C’est-à-dire le séjour des morts, sans identification nécessaire avec les conceptions ultérieures de l’enfer.
    reason: Éviter une harmonisation doctrinale anachronique.
  - marker: d
    text: L’expression évoque le repos, avec l’idée d’être renouvelés ou comblés dans l’Esprit.
    reason: Signaler les nuances de l’expression copte sans imposer une image unique en français.
  - marker: e
    text: 'Le copte dit littéralement : « les choses dans lesquelles il trouvera sa racine » ; le texte passe ici du pluriel au singulier.'
    reason: Préserver la relation grammaticale corrigée et rendre visible le changement de nombre de la source.
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲁⲃⲁⲗ … ⲙⲡⲓⲣⲏⲧⲉ
  choice: se manifestent … de cette manière
  rationale: La première ligne achève une proposition commencée à la page précédente. « Se manifester » rend l’expression composée plutôt que d’isoler à tort ⲁⲃⲁⲗ comme « ouvertement ».
- source_word: ϣⲱⲱⲧ
  choice: diminuer
  rationale: Le verbe exprime ici l’idée de retrancher, amoindrir ou faire manquer, non celle de désirer.
- source_word: ⲥⲁϣ
  choice: dur
  rationale: Le terme peut signifier dur, sévère ou âpre ; « dur » reste naturel dans la série de représentations négatives du Père.
- source_word: ⲃⲁⲗⲕⲉ
  choice: courroucé
  rationale: Le terme rare désigne ici une disposition colérique, opposée à l’absence de mal, de trouble et à la douceur.
- source_word: ⲁⲧⲡⲉⲑⲁⲩ
  choice: sans mal
  rationale: La formation privative est conservée directement, sans la convertir en catégorie doctrinale comme « sans péché ».
- source_word: ⲁⲧϣⲧⲁⲣⲧⲣ
  choice: sans trouble
  rationale: La forme privative évoque l’absence d’agitation ou de bouleversement.
- source_word: ⲟⲩϩⲗⲟϭ
  choice: plein de douceur
  rationale: Le sens premier est « doux » ; cette formulation française conserve la qualité positive opposée à la dureté et au courroux.
