  consult_excerpt: 'Since all searched for the one from whom they had come – all were within him, the uncontainable, inconceivable one who’s beyond every thought – (and) since ignorance of the Father caused anguish and terror, and the anguish grew thick like a fog, so that no one could see – Error was strengthened. It worked on its own matter in vain, not knowing the Truth.

    It happened in a deluding way, as it (Error) prepared with power, in beauty, a substitute for the Truth. Now this wasn’t humiliating for the uncontainable, inconceivable one, because the anguish and forgetfulness and delusion of deceit were like nothing, whereas the Truth is established, unchangeable, unperturbed, beyond beauty. Because of this, disregard Error, since it has no root.

    It happened in a fog concerning the Father. It happens (now) since it (Error) prepares works in forgetfulness and terror, so that with them it (Error) might attract those in the middle and imprison them.

    The forgetfulness of Error wasn’t revealed; it wasn’t a 18 [thought] from the Father. Forgetfulness didn’t come into being from the Father, though it did come into being because of him. What comes into being within him is the knowledge, which was revealed so that forgetfulness might be dissolved, and the Father might be known. Forgetfulness came into being because the Father was unknown, so when the Father comes to be known, forgetfulness won’t exist anymore.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/002.yaml
  text: 'Since all were searching for the One from whom they had come forth — and they were all within him, the uncontainable, inconceivable One beyond every thought — and since ignorance of the Father brought distress and dread, and the distress thickened like a fog so that no one could see, Error was strengthened. It worked at its own matter to no purpose, because it did not know the Truth.


    It came about in a delusive manner: Error arrayed, with power and with a certain beauty, a substitute for the Truth. Yet this did not disgrace the Uncontainable, the Inconceivable; for the distress and the Forgetfulness and the illusion of deceit are as nothing, while the Truth stands firm — unchanging, untroubled, beyond beauty. Because of this, disregard Error, for it has no root.


    It happened in a fog with respect to the Father; and it happens even now: Error prepares works in Forgetfulness and in fear, so that by means of them it might draw those who are in the middle and imprison them.


    The Forgetfulness of Error was not revealed; it was not a thought from the Father. Forgetfulness did not come into being from the Father — though it did come into being on account of him. What comes into being within him is the knowledge, which was manifested so that Forgetfulness might be dissolved and the Father might be known. Since Forgetfulness arose because the Father was unknown, once the Father comes to be known, Forgetfulness will no longer exist.'
translation:
  language: fr
  text: 'Comme tous cherchaient celui dont ils étaient issus — alors qu’ils étaient tous en lui, lui que rien ne peut contenir, l’Inconcevable qui est au-delà de toute pensée —, et comme l’ignorance du Père suscitait l’angoisse et la peur, l’angoisse s’épaissit comme un brouillard, si bien que personne ne pouvait voir. Alors l’Erreur prit de la force. Elle travailla vainement sa propre matière, parce qu’elle ne connaissait pas la Vérité.


    Elle se produisit de manière trompeuse : avec puissance et dans une certaine beauté, l’Erreur prépara un substitut à la Vérité. Pourtant, cela n’abaissait en rien celui que rien ne peut contenir, l’Inconcevable ; car l’angoisse, l’Oubli et l’illusion trompeuse ne sont rien, tandis que la Vérité demeure ferme, immuable, imperturbable, au-delà de la beauté. C’est pourquoi, détournez-vous de l’Erreur, car elle n’a pas de racine.


    Cela se produisit dans un brouillard au sujet du Père ; et cela se produit encore : l’Erreur prépare des œuvres dans l’Oubli et dans la peur, afin d’attirer par elles ceux qui sont au milieu et de les emprisonner.


    L’Oubli de l’Erreur n’a pas été révélé ; il n’était pas une pensée venant du Père. L’Oubli n’est pas venu du Père, bien qu’il ait pris naissance à cause de lui[a]. Ce qui prend naissance en lui, c’est la connaissance, qui a été manifestée afin que l’Oubli soit dissous et que le Père soit connu. Puisque l’Oubli a pris naissance parce que le Père n’était pas connu, lorsque le Père sera connu, l’Oubli n’existera plus.


    Voici l’Évangile de celui qu’ils cherchaient, celui qu’il a révélé à ceux qui sont parfaits par les compassions du Père : le mystère caché, Jésus le Christ. Par lui, il illumina ceux qui étaient dans les ténèbres à cause de l’Oubli. Il les illumina et leur donna un chemin ; et ce chemin est la Vérité.


    L’Erreur fut attirée vers lui, elle le poursuivit, elle fut bouleversée par lui et fut réduite à rien ; elle devint vide, n’ayant rien en elle. La connaissance du Père est celui qui est issu de lui et qui leur donne d’être en repos en lui. Par la connaissance, il les a purifiés et a absorbé la matière en lui-même. Ils l’ont trouvé en eux-mêmes : l’Inconcevable, l’Impensable, le Père, celui qui est parfait, celui qui a fait le Tout. Le Tout est en lui et le Tout avait besoin de lui, puisqu’il retenait en lui leur accomplissement, qu’il n’avait pas donné au Tout. Le Père n’est pas jaloux, car quelle jalousie pourrait-il y avoir entre lui et ses membres ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« À cause de lui » ne signifie pas ici que le Père aurait produit l’Oubli : la suite précise que celui-ci a pris naissance parce que le Père n’était pas connu.'
    reason: La note distingue l’occasion de l’Oubli de son origine, conformément à l’enchaînement du texte, sans modifier la formulation causale.
lexical_decisions:
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: l’Erreur
  rationale: Le terme désigne ici une puissance personnifiée opposée à la Vérité. La majuscule rend cette personnification sans imposer une définition doctrinale supplémentaire.
- source_word: ⲁⲧⲙⲉⲉⲩⲉ
  choice: l’Oubli
  rationale: Le composé négatif formé sur « pensée/souvenir » désigne l’absence de mémoire ou de conscience. « Oubli » est naturel en français et la majuscule signale son rôle personnifié dans le passage.
- source_word: ⲡⲓⲱⲧ
