revisions:
- from: 'Comme tous cherchaient celui dont ils étaient issus — alors qu’ils étaient tous en lui, lui que rien ne peut contenir, l’inconcevable qui est au-delà de toute pensée —, et comme l’ignorance du Père suscitait l’angoisse et la peur, l’angoisse s’épaissit comme un brouillard, si bien que personne ne pouvait voir. Alors l’Erreur prit de la force. Elle façonna vainement sa propre œuvre, parce qu’elle ne connaissait pas la Vérité.


    Elle se manifesta sous une forme trompeuse : avec puissance et dans une certaine beauté, l’Erreur prépara un substitut à la Vérité. Pourtant, cela n’abaissait en rien celui que rien ne peut contenir, l’Inconcevable, car l’angoisse, l’Oubli et l’illusion trompeuse ne sont rien, tandis que la Vérité demeure ferme, immuable, imperturbable, au-delà de la beauté. C’est pourquoi, ne tenez aucun compte de l’Erreur, car elle n’a pas de racine.


    Elle prit naissance dans un brouillard au sujet du Père. Et voici ce qui se passe : l’Erreur prépare des œuvres dans l’Oubli et la peur afin d’attirer par elles ceux qui se trouvent au milieu et de les emprisonner.


    L’Oubli propre à l’Erreur n’a pas été révélé ; il n’était pas une pensée venant du Père. L’Oubli n’est pas venu du Père, bien qu’il ait pris naissance à cause de lui[a]. Ce qui prend naissance en lui, c’est la connaissance, qui a été manifestée afin que l’Oubli soit dissous et que le Père soit connu. En effet, l’Oubli a pris naissance parce que le Père n’était pas connu. Dès lors, quand le Père sera connu, l’Oubli n’existera plus.'
  to: 'Comme tous cherchaient celui dont ils étaient issus — alors qu’ils étaient tous en lui, lui que rien ne peut contenir, l’Inconcevable qui est au-delà de toute pensée —, et comme l’ignorance du Père suscitait l’angoisse et la peur, l’angoisse s’épaissit comme un brouillard, si bien que personne ne pouvait voir. Alors l’Erreur prit de la force. Elle travailla vainement sa propre matière, parce qu’elle ne connaissait pas la Vérité.


    Elle se produisit de manière trompeuse : avec puissance et dans une certaine beauté, l’Erreur prépara un substitut à la Vérité. Pourtant, cela n’abaissait en rien celui que rien ne peut contenir, l’Inconcevable ; car l’angoisse, l’Oubli et l’illusion trompeuse ne sont rien, tandis que la Vérité demeure ferme, immuable, imperturbable, au-delà de la beauté. C’est pourquoi, détournez-vous de l’Erreur, car elle n’a pas de racine.


    Cela se produisit dans un brouillard au sujet du Père ; et cela se produit encore : l’Erreur prépare des œuvres dans l’Oubli et dans la peur, afin d’attirer par elles ceux qui sont au milieu et de les emprisonner.


    L’Oubli de l’Erreur n’a pas été révélé ; il n’était pas une pensée venant du Père. L’Oubli n’est pas venu du Père, bien qu’il ait pris naissance à cause de lui[a]. Ce qui prend naissance en lui, c’est la connaissance, qui a été manifestée afin que l’Oubli soit dissous et que le Père soit connu. Puisque l’Oubli a pris naissance parce que le Père n’était pas connu, lorsque le Père sera connu, l’Oubli n’existera plus.


    Voici l’Évangile de celui qu’ils cherchaient, celui qu’il a révélé à ceux qui sont parfaits par les compassions du Père : le mystère caché, Jésus le Christ. Par lui, il illumina ceux qui étaient dans les ténèbres à cause de l’Oubli. Il les illumina et leur donna un chemin ; et ce chemin est la Vérité.


    L’Erreur fut attirée vers lui, elle le poursuivit, elle fut bouleversée par lui et fut réduite à rien ; elle devint vide, n’ayant rien en elle. La connaissance du Père est celui qui est issu de lui et qui leur donne d’être en repos en lui. Par la connaissance, il les a purifiés et a absorbé la matière en lui-même. Ils l’ont trouvé en eux-mêmes : l’Inconcevable, l’Impensable, le Père, celui qui est parfait, celui qui a fait le Tout. Le Tout est en lui et le Tout avait besoin de lui, puisqu’il retenait en lui leur accomplissement, qu’il n’avait pas donné au Tout. Le Père n’est pas jaloux, car quelle jalousie pourrait-il y avoir entre lui et ses membres ?'
