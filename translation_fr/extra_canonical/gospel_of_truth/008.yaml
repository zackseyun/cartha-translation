  rationale: Rend l’apparition irréelle évoquée par le terme sans la réduire à une simple image.
- source_word: ⲧⲣⲙⲣⲟⲩ
  choice: terreur
  rationale: Le contexte de cauchemar et l’intensité de l’énumération appellent un terme plus fort que « peur ».
- source_word: ⲙⲛⲧⲁⲧⲧⲁⲕⲁⲣⲉⲓⲥ
