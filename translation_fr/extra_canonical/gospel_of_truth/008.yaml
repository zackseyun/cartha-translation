    Tantôt ils courent quelque part, tantôt ils sont incapables de fuir quelqu’un ; tantôt ils se battent ou reçoivent des coups ; tantôt ils tombent de très haut ou volent dans les airs sans avoir d’ailes. Parfois encore, quelqu’un les tue alors que personne ne les poursuit ; ou bien ce sont eux qui tuent ceux qui les entourent et se couvrent de leur sang. Tant que ceux qui traversent tous ces cauchemars ne se sont pas réveillés, ils ne voient rien, car ces choses ne sont rien.


    Il en va de même pour ceux qui ont rejeté l’ignorance comme le sommeil : ils ne la tiennent pour rien et ne tiennent pas davantage ses autres œuvres pour réelles, mais ils les abandonnent comme un rêve de la nuit. Ils accordent de la valeur à la connaissance du Père comme à la lumière. Ceux qui étaient ignorants ont agi comme s’ils dormaient ; ceux qui sont parvenus à la connaissance ont agi comme s’ils étaient éveillés.


    Bon est celui qui revient et s’éveille ![a] Heureux celui qui ouvre les yeux des aveugles !


    L’Esprit a couru à leur suite afin de les faire vivre. Il a tendu la main à celui qui gisait à terre et l’a remis debout, car il ne s’était pas encore relevé. Il leur a accordé la connaissance du Père et la révélation du Fils ; car, lorsqu’ils l’ont vu et entendu, il leur a permis de le goûter et de saisir le Fils bien-aimé.'
