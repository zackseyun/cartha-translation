  rationale: Terme français ample convenant à la série d’états affectifs et mentaux.
- source_word: ⲙⲛⲧϩⲏⲧ
  choice: instabilité
  rationale: Préserve l’idée d’absence de fermeté sans préciser indûment s’il s’agit d’une instabilité morale ou mentale.
- source_word: ⲥⲛⲉⲩ
  choice: division
  rationale: Maintient le sens de séparation ou de dissension et son possible emploi intérieur ou collectif.
- source_word: ⲡⲱϣⲉ
  choice: doute
  rationale: Correspond au cadre épistémique du passage et à son association avec l’ignorance.
- source_word: ⲙⲙⲛⲧⲁ
  choice: vain néant
  rationale: Garde à la fois la notion de non-être et la vanité qui lui est associée dans ce contexte.
- source_word: ⲡϭⲁⲗ
  choice: sommeil
  rationale: Rend la métaphore structurante qui assimile l’ignorance au sommeil.
- source_word: ⲛⲉⲉⲓ
  choice: rêves
  rationale: Le contexte est celui du sommeil et des cauchemars, non de visions prophétiques.
- source_word: ⲥⲙⲙⲛⲧⲟⲩ
  choice: se réveiller
  rationale: Exprime naturellement le passage du sommeil de l’ignorance à la connaissance.
- source_word: ⲡⲓⲡⲛⲁ
  choice: l’Esprit
  rationale: La majuscule reflète son rôle personnel et vivifiant dans le passage, sans ajouter l’adjectif « Saint », absent de la forme transmise ici.
- source_word: ⲥⲁⲩⲛⲉ
  choice: connaissance
  rationale: Terme français accessible qui conserve la portée cognitive et salvatrice du mot sans recourir à la translittération « gnose ».
theological_decisions:
- issue: Identification de ⲡⲓⲡⲛⲁ
  choice: « l’Esprit »
  alternative: « l’esprit » ou « le souffle »
  rationale: Ses actions personnelles — poursuivre, vivifier, tendre la main et relever — favorisent un agent spirituel personnel ; le texte ne justifie toutefois pas l’ajout explicite de « Saint ».
- issue: Portée de la connaissance du Père
  choice: « connaissance du Père »
  alternative: « gnose du Père »
  rationale: « Connaissance » demeure compréhensible en français courant tout en laissant au contexte le soin d’exprimer sa portée révélatrice et vivifiante.
- issue: Différence entre « bon » et « bienheureux »
  choice: « C’est une bonne chose… » puis « Heureux… »
  alternative: Employer « Heureux » dans les deux propositions
  rationale: Le copte distingue une expression formée sur « bon » du prêt grec ⲙⲁⲕⲁⲣⲓⲟⲥ, « heureux/bienheureux » ; la traduction maintient cette variation au lieu de la niveler.
- issue: Réalité des œuvres de l’ignorance
  choice: « ne tiennent pas davantage ses autres œuvres pour réelles »
  alternative: « ne les tiennent pour rien »
  rationale: La formulation exprime l’analogie du rêve sans transformer celle-ci en affirmation doctrinale plus générale sur l’irréalité du monde.
