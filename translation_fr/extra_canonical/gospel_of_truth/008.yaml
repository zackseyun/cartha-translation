  register: Français international moderne, digne mais lisible. Les répétitions de « rien », « ignorance », « connaissance », « Père » et « Fils » sont conservées parce qu’elles structurent l’argument. Les changements entre pluriel et singulier dans la scène où l’Esprit relève celui qui gît à terre sont maintenus autant que le permet un français naturel.
