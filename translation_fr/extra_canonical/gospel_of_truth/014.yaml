lexical_decisions:
- source_word: ⲣⲉⲛ
  choice: nom
  rationale: Terme structurant du passage ; « nom » conserve les dimensions d’identité, d’appartenance et de révélation.
- source_word: ⲡⲓⲱⲧ / ⲡϣⲏⲣⲉ
  choice: Père / Fils
  rationale: Titres relationnels explicites, rendus selon leur valeur théologique et leur parallélisme dans le texte.
- source_word: ⲟⲩⲁⲧⲛⲉⲩ
  choice: invisible
  rationale: La formation privative sur « voir » désigne ce qui ne peut être vu.
- source_word: ⲙⲛⲧⲧⲁⲉⲓⲣⲉⲛ
  choice: acte de nommer
  rationale: Rend naturellement en français le substantif abstrait et maintient son contraste avec « mots ».
- source_word: ⲟⲩⲁⲧϯⲣⲉⲛ / ⲟⲩⲁⲧⲧⲉ / ⲟⲩⲁⲧⲙⲉⲉⲩⲉ
  choice: impossible à nommer, à dire et à concevoir
  rationale: La formulation française conserve la triple négation apophatique sans imposer un vocabulaire excessivement technique.
- source_word: ⲃⲁⲑⲟⲥ
  choice: Profondeur
  rationale: Rend le prêt grec tout en conservant sa valeur cosmologique ; la majuscule signale son emploi quasi titulaire.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Plérôme
  rationale: Le terme technique est conservé, avec une note donnant son sens littéral.
- source_word: ⲟⲩⲁⲧⲡⲉⲑⲁⲩ
  choice: sans envie
  rationale: Rend la formation privative correspondant au grec aphthonos et préserve le motif de la révélation sans rétention jalouse.
- source_word: ⲛⲉϥⲡⲉⲑⲏⲡ
  choice: ses secrets
  rationale: Le mot désigne littéralement les choses cachées ; « secrets » conserve la nuance de dévoilement.
theological_decisions:
- issue: Identité du nom du Père et du Fils
  choice: « Le nom du Père est le Fils »
  alternative: « Le nom du Père se révèle dans le Fils »
  rationale: La proposition équative du copte identifie directement le Nom et le Fils ; une paraphrase en termes de simple révélation atténuerait cette tension.
- issue: Le Père engendre le Fils « comme un nom »
  choice: Maintien littéral de l’image
  alternative: Expliquer que le Fils manifeste le nom du Père
  rationale: Le texte associe volontairement engendrement, nomination et identité ; l’explication résoudrait une formulation que la source laisse dense et paradoxale.
- issue: Le Fils bien-aimé comme nom du Père
  choice: « le nom du Père est le Fils bien-aimé »
  alternative: « le nom du Père est révélé par son Fils bien-aimé »
  rationale: La traduction conserve l’identification ontologique exprimée dans la source sans l’harmoniser avec une théologie ultérieure.
- issue: Langage apophatique
  choice: « impossible à nommer, à dire et à concevoir »
  alternative: « innommable, ineffable et indescriptible »
  rationale: Le choix retenu demeure solennel mais plus immédiatement intelligible, tout en préservant les trois prédicats négatifs.
- issue: Absence d’envie chez le Père
  choice: « le Père est sans envie »
  alternative: « le Père est sans jalousie »
  rationale: « Envie » correspond mieux au motif de celui qui ne retient pas ses secrets et les révèle.
translation_notes:
  register: Français international moderne, digne et lisible. Les répétitions de « nom », « Père » et « Fils » sont volontairement maintenues, car elles structurent l’argument. Les majuscules à Nom, Invisible, Profondeur, Lieu, Parfait et Plérôme signalent des emplois quasi titulaires ou techniques sans ajouter d’identification confessionnelle.
