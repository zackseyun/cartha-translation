  language: fr
  text: 'Le nom du Père est le Fils. C’est lui qui, le premier, donna un nom à celui qui était issu de lui-même — et qui était lui-même —, et il l’engendra comme Fils. Il lui donna le nom qui lui appartenait. Tout ce qui entoure le Père lui appartient : le nom est à lui, et le Fils est à lui. Lui peut être vu ; le nom, cependant, est invisible, car lui seul est le mystère de l’Invisible, mystère qui parvient, par lui, aux oreilles qui en sont entièrement remplies. En effet, le nom du Père n’est pas prononcé : il se révèle par un Fils.


    Ainsi donc, le nom est grand. Qui pourra prononcer un nom pour lui, le grand Nom, sinon celui-là seul à qui le nom appartient, ainsi que les enfants du Nom, ceux en qui repose le nom du Père et qui, à leur tour, reposent dans son nom ? Puisque le Père n’a pas été engendré, lui seul l’engendra pour lui-même comme un nom, avant d’avoir fait venir à l’existence les éons[a], afin que le nom du Père soit au-dessus de leur tête comme Seigneur. Tel est le vrai nom, affermi par son commandement en pleine puissance. Car son nom ne vient pas de mots ni de l’acte de nommer : il est invisible.


    Il donna un nom à lui seul, celui qui est. Car celui qui n’existe pas n’a pas de nom à recevoir. Quel nom donnerait-on à celui qui n’est pas ? Mais celui qui est existe aussi avec son nom ; lui seul le connaît, et c’est à lui seul qu’il a donné un nom.


    Tel est le Père ; son nom est le Fils. Il ne l’a donc pas caché en lui-même : au contraire, il était. Le Fils seul donna un nom. Le nom appartient donc au Père, car le nom du Père est le Fils bien-aimé. D’où, en effet, tiendrait-il un nom, sinon du Père ?


    Mais quelqu’un demandera certainement à son prochain : « Qui donnera un nom à celui qui existait avant lui ? » — comme si les enfants ne recevaient pas un nom de ceux qui les ont engendrés. Il convient donc d’examiner d’abord ce qu’est le nom. C’est le vrai nom, le nom qui vient du Père, car c’est le nom propre. Il n’a pas reçu ce nom comme un nom d’emprunt, à la manière des autres, selon la forme sous laquelle chacun vient à l’existence. Celui-ci est le nom propre : nul autre ne le lui a donné. Mais il demeure impossible à nommer, à dire et à concevoir, jusqu’au moment où le Parfait, qui seul a le pouvoir de prononcer son nom et de le voir, parla de lui.


    Lorsqu’il lui plut que son Nom bien-aimé soit le Fils, il donna le nom à celui qui était issu de la Profondeur. Il révéla ses secrets, sachant que le Père est sans envie. Voilà pourquoi il le fit venir au-dehors : pour qu’il parle du Lieu et du lieu de repos dont il était issu, et qu’il glorifie le Plérôme[b], la grandeur de son nom et la douceur du Père.'
