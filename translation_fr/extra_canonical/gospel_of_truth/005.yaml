lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: ignorance
  rationale: Terme négatif formé sur « connaître » ; il maintient l’opposition structurante avec la connaissance.
- source_word: ⲧⲙⲛⲧⲟⲩⲉⲉⲓⲛ / ⲙⲛⲧⲟⲩⲉⲉⲓ
  choice: Unité
  rationale: La majuscule signale l’emploi conceptuel de l’unité opposée à la multiplicité, sans réduire le terme au simple nombre un.
- source_word: ⲥⲭⲏⲙⲁ
  choice: apparence
  rationale: Le mot grec d’emprunt désigne ici la configuration visible de la déficience, appelée à être dissoute.
- source_word: ⲕⲟⲥⲙⲟⲥ
  choice: monde
  rationale: Rendu français courant qui convient à l’ordre présent décrit comme l’apparence de la déficience.
- source_word: ⲧϩⲩⲗⲏ
  choice: matière
  rationale: Conserve le sens philosophique du terme grec hylē dans l’image du feu qui consume.
- source_word: ⲁⲓⲱⲛ
  choice: Éon
  rationale: Translittération consacrée pour le terme cosmologique ; « âge » effacerait ici sa portée technique.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Connaissance
  rationale: La majuscule marque son emploi comme réalité salvatrice, tout en restant compréhensible sans recourir à « gnose ».
- source_word: ⲃⲱⲗ ⲁⲃⲁⲗ
  choice: dissoudre / se dissoudre
  rationale: La répétition française conserve le motif du déliement et de la disparition appliqué à l’apparence, à l’ignorance et à la déficience.
- source_word: ⲡⲏⲡ / ⲡⲉⲑⲏⲡ
  choice: sein
  rationale: Rendu naturel et digne, qui préserve l’image d’intimité et l’identification explicite avec l’Esprit saint.
- source_word: ⲡⲧⲏⲣϥ
  choice: le Tout
  rationale: La majuscule préserve la portée cosmologique du terme sans le paraphraser.
theological_decisions:
- issue: Identification du sein du Père avec l’Esprit saint
  choice: « son sein est l’Esprit saint »
  alternative: Comprendre le sein comme une simple métaphore de la présence intime
  rationale: La construction copte est explicitement équative ; la traduction conserve cette affirmation sans l’atténuer ni l’expliquer doctrinalement.
- issue: Rapport entre déficience, monde et accomplissement
  choice: Conserver la déficience comme sujet dont le monde est l’apparence
  alternative: Faire du monde une déficience en soi ou une création mauvaise
  rationale: Le texte identifie le monde à l’apparence de la déficience, non directement à son essence ; cette distinction préserve la tension du passage.
- issue: Disparition de l’apparence après la connaissance du Père
  choice: « son apparence ne se manifeste plus »
  alternative: « son apparence se manifeste »
  rationale: La négation attestée impose le sens négatif et s’accorde avec la dissolution répétée de la déficience, de l’ignorance et des ténèbres.
- issue: Termes cosmologiques techniques
  choice: Éons, Unité, Connaissance, matière et Tout
  alternative: âges, unité ordinaire, savoir, réalité matérielle et ensemble
  rationale: Ces choix gardent le relief conceptuel du discours tout en restant lisibles en français moderne.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. Les majuscules sont limitées aux notions manifestement techniques du passage. Les répétitions de « dissoudre », « Père » et « Unité » sont conservées lorsqu’elles structurent l’argument ; quelques articulations sont explicitées pour assurer une lecture orale naturelle.
