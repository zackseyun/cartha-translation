    Le Père a comblé la déficience et en a dissous l’apparence — son apparence est le monde dans lequel elle était à l’œuvre. Car là où règnent jalousie et rivalité, il y a déficience ; mais là où règne l’Unité, il y a accomplissement. Puisque la déficience est apparue parce que le Père n’était pas connu, dès que le Père sera connu, la déficience n’existera plus. De même que l’ignorance d’une personne se dissout lorsqu’elle parvient à la connaissance, et que les ténèbres se dissipent lorsque la lumière paraît, ainsi la déficience se dissout dans l’accomplissement. Dès lors, son apparence ne se manifeste plus, et elle se dissoudra dans l’harmonie de l’Unité.


    Pour le moment, leurs œuvres sont dispersées ; mais, au temps voulu, l’Unité mènera les Éons à leur accomplissement. Au sein de l’Unité, chacun se recevra lui-même et, dans la Connaissance, tous se purifieront, quittant la multiplicité pour l’Unité : ils consumeront en eux-mêmes la matière comme le feu la consume, les ténèbres par la lumière et la mort par la vie. Si tout cela est réellement arrivé à chacun de nous, il convient que nous portions notre pensée vers le Tout, afin que cette maison soit sainte et silencieuse pour l’Unité.'
  to: 'Jésus, à la douceur infinie.


    Le Père a fait connaître son sein : son sein est l’Esprit saint. Il a manifesté ce qui est caché en lui ; ce qui est caché en lui, c’est son Fils. Ainsi, par les compassions du Père, les Éons pourront le connaître, cesser de se fatiguer à chercher le Père et trouver le repos en lui, sachant que là est le Repos.


    Le Père a comblé la déficience et en a dissous l’apparence — son apparence est le monde où la déficience exerçait son office. Car là où règnent jalousie et rivalité, il y a déficience ; mais là où règne l’Unité, il y a accomplissement. Puisque la déficience est venue à l’existence parce que le Père n’était pas connu, dès que le Père sera connu, la déficience n’existera plus. De même que l’ignorance d’une personne se dissout lorsqu’elle parvient à la connaissance, et que les ténèbres se dissipent lorsque la lumière paraît, ainsi la déficience se dissout par l’accomplissement. Dès lors, son apparence ne se manifeste plus, et elle se dissoudra dans l’harmonie de l’Unité.


    Pour le moment, leurs œuvres sont dispersées ; mais, en temps voulu, l’Unité mènera les Éons à leur accomplissement. Au sein de l’Unité, chacun se recevra lui-même et, dans la Connaissance, chacun se purifiera, quittant la multiplicité pour l’Unité : ils consumeront en eux-mêmes la matière comme le feu la consume, les ténèbres par la lumière et la mort par la vie. Si tout cela est réellement arrivé à chacun de nous, il convient que nous pensions au Tout, afin que cette maison soit sainte et silencieuse pour l’Unité.'
