  consult_excerpt: '33 Strengthen the feet of those who stumble, and reach out to those who are sick. Feed those who are hungry, and give rest to those who are weary. Raise up those who want to arise, and awaken those who sleep, because you’re the understanding that’s unsheathed. If strength is like this, it becomes stronger.

    Be concerned about yourselves. Don’t be concerned about other things which you’ve rejected from yourselves. Don’t return to eat your vomit. Don’t be eaten by worms, because you’ve already shaken it off. Don’t become a dwelling-place for the devil, because you’ve already brought him to naught. Don’t strengthen your obstacles which are collapsing, as though you’re a support. For the lawless one is nothing, to be treated more harshly than the just, doing his works among others.

    Do then the Father’s will, because you’re from him. For the Father is sweet, and goodness is in his will. He knows what’s yours, that you may find rest in them. For by the fruits they know what’s yours, because the children of the Father 34 are his fragrance, since they’re from the grace of his expression. Because of this, the Father loves his fragrance, and reveals it in every place. And when it mixes with matter, it gives his fragrance to the light, and in tranquility he causes it to rise above every form and every sound. For it’s not the ears that smell the fragrance, but it’s the Spirit that smells, and draws the fragrance to itself, and sinks down into the Father’s fragrance. He shelters it, then, and takes it to the place from which it came, from the first fragrance which has grown cold. It’s something in a soul-endowed delusion, like cold water sunk into loose earth. Those who see it think that it’s just earth. Afterwards, it dissolves again. If a breath draws it, it becomes warm.
    So the fragrances which are cold are from the division. Because of this, faith came. It dissolved the division, and it brought the fullness that’s warm with love, so that the cold may not return, but rather the unitary thought of completion.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/011.yaml
  text: 'Make firm the feet of those who stumble[a]; stretch out a hand to the sick. Give food to those who are hungry, and give rest to those who are weary. Raise up those who wish to arise, and awaken those who sleep—for you are the Understanding that has been unsheathed. And if strength is of this sort, it grows stronger.


    Be concerned for yourselves; do not be concerned with other things that you have cast away from yourselves. Do not turn back to eat your vomit. Do not be moth-eaten, do not be worm-eaten, for you have already shaken it off. Do not become a house for the Devil, for you have already brought him to nothing. Do not prop up your stumbling-blocks that are collapsing, as though you were a support. For the lawless one is nothing, to be dealt with more severely than the just, while doing his works among others.


    Therefore do the Father’s will, because you are from him. For the Father is sweet, and goodness is in his will. He knows what is yours, so that you may find rest in them. For by the fruits they know what is yours, because the children of the Father are his fragrance, since they come from the grace of his Face. For this reason the Father loves his fragrance and reveals it in every place; and when it mingles with hylē, he gives his fragrance to the Light, and in his quiet he causes it to surpass every form and every sound. For it is not the ears that smell the fragrance, but the Spirit smells it, draws the fragrance to itself, and sinks down into the fragrance of the Father. Then he shelters it and leads it back to the place from which it came—from the first fragrance that had grown cold. It is something within a soul-endowed formation, like cold water sunk into a clod of loose earth[b]. Those who see it suppose it is only earth; afterward it is dissolved again. And if a breath draws it,
    it becomes warm. Thus the fragrances that are cold are from the division. Because of this, Faith came: it dissolved the division and brought the Pleroma that is warm with agapē, so that the cold would not return, but rather the unity (monad) of Thought of perfection[c]. This Logos made it manifest.'
translation:
  language: fr
  text: 'Affermissez les pieds de ceux qui trébuchent et tendez la main aux malades. Donnez à manger à ceux qui ont faim et accordez du repos à ceux qui sont épuisés. Relevez ceux qui veulent se relever et réveillez ceux qui dorment, car vous êtes l’Intelligence tirée du fourreau. Si la force agit ainsi, elle devient plus forte.


    Veillez sur vous-mêmes. Ne vous préoccupez pas d’autres choses que vous avez rejetées loin de vous. Ne retournez pas manger ce que vous avez vomi. Ne vous laissez ronger ni par les mites ni par les vers, puisque vous vous en êtes déjà débarrassés. Ne devenez pas une demeure pour le Diable, puisque vous l’avez déjà réduit à rien. Ne soutenez pas vos obstacles qui s’effondrent, comme si vous étiez un appui. Car l’être sans loi n’est rien; il doit être traité plus sévèrement que le juste, tandis qu’il accomplit ses œuvres parmi les autres.


    Faites donc la volonté du Père, puisque vous venez de lui. Car le Père est doux, et la bonté est dans sa volonté. Il connaît ce qui vous appartient, afin que vous y trouviez le repos. C’est à leurs fruits que l’on reconnaît ce qui vous appartient : les enfants du Père sont son parfum, puisqu’ils viennent de la grâce de son Visage. C’est pourquoi le Père aime son parfum et le manifeste en tout lieu. Quand celui-ci se mêle à la matière[a], il communique son parfum à la Lumière et, dans son repos, le fait surpasser toute forme et tout son. En effet, ce ne sont pas les oreilles qui sentent le parfum : c’est l’Esprit qui le sent, l’attire à lui et s’immerge dans le parfum du Père. Alors il lui donne refuge et le ramène au lieu d’où il était venu, issu du premier parfum qui s’était refroidi.


    Il se trouve dans une formation animée[b], comme de l’eau froide qui s’est enfoncée dans une terre meuble. Ceux qui la voient pensent que ce n’est que de la terre. Ensuite, elle se dissout de nouveau; si un souffle l’attire, elle se réchauffe. Ainsi, les parfums qui sont froids viennent de la division.


    C’est pourquoi la Foi[c] est venue : elle a dissous la division et apporté le Plérôme[d], réchauffé par l’amour, afin que le froid ne revienne pas, mais plutôt l’unité de la Pensée accomplie. C’est ce Logos[e] qui a manifesté la découverte du Plérôme à ceux qui le cherchent, à partir de lui-même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « hylè », terme grec qui peut désigner la matière, notamment dans un sens cosmologique.
    reason: Préserver le terme technique derrière une traduction française lisible.
  - marker: b
    text: Ou « une formation douée d’une âme »; le grec plasma, emprunté en copte, signifie « formation », « créature » ou « chose façonnée ».
    reason: Conserver la gamme sémantique de plasma sans le confondre avec « illusion » ou « égarement ».
  - marker: c
    text: La Foi est présentée ici comme venant et accomplissant des actions; elle peut donc être comprise comme personnifiée.
    reason: Signaler sans trancher la tension entre abstraction et figure hypostasiée.
  - marker: d
    text: « Plérôme » transcrit un mot grec signifiant « plénitude » ou « totalité accomplie ».
    reason: Rendre accessible un terme cosmologique conservé dans le texte.
  - marker: e
    text: « Logos » est un mot grec pouvant signifier « parole », « discours » ou « raison ».
    reason: Éclairer le terme technique sans imposer une seule équivalence théologique.
lexical_decisions:
- source_word: ⲧⲁϫⲣⲟ
  choice: affermissez
  rationale: Rend l’impératif « rendre ferme, fortifier » tout en conservant l’image concrète des pieds chancelants.
- source_word: ⲧⲙⲛⲧⲣⲙⲛϩⲏⲧ
  choice: l’Intelligence
  rationale: Le substantif abstrait est ici prédiqué des destinataires et paraît personnifié; la majuscule signale cette portée sans la définir davantage.
- source_word: ⲇⲓⲁⲃⲟⲗⲟⲥ
  choice: le Diable
  rationale: Emprunt grec employé comme désignation personnelle de la puissance hostile.
- source_word: ⲥⲧⲁⲉⲓ
  choice: parfum
  rationale: Le terme désigne une odeur ou fragrance et structure toute la métaphore de la filiation et du retour au Père.
- source_word: ϩⲩⲗⲏ
  choice: matière
  rationale: Traduction française intelligible du grec hylē; une note conserve le terme technique et sa portée possible.
- source_word: ⲥⲱⲣⲁϩⲧ
  choice: repos
  rationale: Exprime le calme ou la tranquillité; « repos » s’accorde au vocabulaire du passage sans ajouter une idée spatiale.
- source_word: ⲣ ⲥⲁⲧⲡⲉ
  choice: surpasser
  rationale: Le verbe signifie être supérieur ou excellent, non monter spatialement.
- source_word: ⲡⲗⲁⲥⲙⲁ
  choice: formation
  rationale: L’emprunt grec plasma désigne ce qui est formé ou façonné; « illusion » serait une interprétation injustifiée.
- source_word: ⲡⲱϣ
  choice: division
  rationale: Conserve l’opposition conceptuelle entre séparation et unité.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Plérôme
  rationale: Le terme grec est conservé sous sa forme française traditionnelle, avec une glose en note, car « plénitude » seule pourrait aplanir sa valeur technique.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Logos
  rationale: La translittération maintient l’épaisseur conceptuelle du terme grec; la note fournit le sens courant.
theological_decisions:
- issue: Personnification de la Foi
  choice: « la Foi » avec majuscule
  alternative: « la foi » comme qualité ou confiance abstraite
  rationale: La syntaxe présente la Foi comme venant et agissant. La majuscule laisse percevoir cette personnification sans imposer une ontologie détaillée.
- issue: Statut de la Lumière, de l’Esprit et de la Pensée
  choice: Majuscules pour préserver leur possible fonction personnifiée ou cosmologique
  alternative: Minuscules et lecture purement descriptive
  rationale: Le discours oscille entre qualités, réalités spirituelles et figures personnifiées; la typographie conserve cette tension.
- issue: Vocabulaire cosmologique grec
  choice: Traduire hylē par « matière », mais conserver « Plérôme » et « Logos »
  alternative: Tout translittérer, ou tout traduire par « matière », « plénitude » et « Parole »
  rationale: Cette combinaison vise la lisibilité française tout en maintenant les deux termes dont la fonction technique est la plus marquée dans le passage.
- issue: Référent des pronoms dans la séquence du parfum
  choice: Expliciter le Père comme sujet de l’accueil et du retour
  alternative: Conserver une suite de pronoms pouvant faire de l’Esprit le sujet
  rationale: La chaîne référentielle copte est dense et partiellement ambiguë. L’explicitation retenue suit le mouvement vers « le parfum du Père », mais l’ambiguïté générale entre l’action du Père et celle de l’Esprit demeure perceptible dans le contexte.
- issue: Dernière proposition relative au Logos
  choice: « a manifesté la découverte du Plérôme à ceux qui attendent sa venue »
  alternative: « a manifesté la découverte du Plérôme de ceux qui l’attendent »
  rationale: La construction finale est compacte; la version retenue donne à l’attente un objet personnel probable sans identifier davantage ce référent.
translation_notes:
  register: Français international actuel, digne et oralement intelligible. Les impératifs gardent leur vigueur pastorale; les images abruptes du vomi, des mites et des vers sont conservées. Le vocabulaire cosmologique n’est translittéré que lorsqu’une traduction ordinaire risquerait d’effacer une tension conceptuelle importante. Les majuscules servent avec retenue à signaler des personnifications possibles, non à fixer un système doctrinal.
