  consult_excerpt: 'It’s like some who’ve left their home, having jars that weren’t any good in places. They broke them, but the master of the house doesn’t suffer any loss. Instead he rejoices, because in place of the bad jars are ones that are full and complete. For this is 26 the judgment that’s come from above; it’s judged everyone. It’s a drawn, two-edged sword which cuts both ways. The Word, which is in the hearts of those who speak it, appeared. It isn’t just a sound, but it was incarnated (embodied).

    A great disturbance arose among the jars, because some were empty, others filled; some provided for, others poured out; some purified, others broken. All the realms were shaken and disturbed, because they didn’t have order or stability. Error was anxious. It didn’t know what to do; it grieved, mourned, and hurt itself, because it knew nothing. The knowledge, which is its (Error’s) destruction, approached it (Error) and all that emanated from it. Error is empty, with nothing inside it.

    Truth came into their midst, and all that emanated knew it. They welcomed the Father in Truth with a complete power that joins them with the Father. Truth is the Father’s mouth; the Holy Spirit is his tongue. Everyone who loves the Truth and are joined to the 27 Truth are joined to the Father’s mouth. By his tongue they’ll receive the Holy Spirit. This is the revelation of the Father and his manifestation to his generations. He revealed what was hidden of himself; he explained it, because who has anything, if not the Father alone?'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/006.yaml
  text: 'For this is the judgment that came down from above[a]; it judged everyone. It is a sword, two‑edged, that cuts on both sides. The Word, which is in the hearts of those who speak it, appeared: it is not a mere sound, but it put on a body. A great disturbance arose among the jars: some were empty, and others were filled; some were provided for, and others poured out; some were purified, and others were broken. All the realms were shaken and agitated, for they had neither order nor stability.


    Error became anxious within itself; it did not know what it should do. It grieved and mourned and struck at itself, for it knew nothing. The Knowledge that is its undoing approached it—and all that had come forth from it—for Error is empty and has nothing within it.


    Truth came in their midst, and all who are from it knew it. They greeted the Father in Truth with a complete Power that joins them to the Father. Truth is the mouth of the Father; the Holy Spirit is his tongue. Whoever is joined to the mouth of the Father will receive the Holy Spirit by his tongue. This is the revelation of the Father and his manifestation to his generations: he revealed what of himself was hidden, he explained it—for who has anything[b], if not the Father alone?'
translation:
  language: fr
  text: 'Car tel est le jugement venu d’en haut : il a jugé chacun. C’est une épée dégainée, à deux tranchants, qui coupe de part et d’autre. La Parole, présente dans le cœur de ceux qui la prononcent, est apparue. Elle n’était pas seulement un son : elle a pris corps[a].


    Un grand bouleversement se produisit parmi les jarres : les unes étaient vides, les autres pleines ; les unes avaient été pourvues, les autres vidées[b] ; les unes avaient été purifiées, les autres brisées. Tous les mondes furent ébranlés et bouleversés, car ils n’avaient ni ordre ni stabilité.


    L’Erreur fut saisie d’angoisse. Elle ne savait que faire. Elle s’affligea, se lamenta et se tourmenta elle-même, car elle ne savait rien. La Connaissance, qui entraîne sa destruction, s’approcha d’elle et de tout ce qui était issu d’elle. En effet, l’Erreur est vide : il n’y a rien en elle.


    La Vérité vint au milieu d’eux, et tous ceux qui étaient issus d’elle la reconnurent. Ils accueillirent le Père dans la Vérité, avec une puissance parfaite qui les unit au Père. Car celui qui aime la Vérité est uni à la bouche du Père : la Vérité est la bouche du Père, et l’Esprit saint est sa langue. Par cette langue, il recevra l’Esprit saint.


    Telle est la révélation du Père et sa manifestation à ses générations[c]. Il a révélé ce qui, de lui-même, était caché ; il l’a expliqué. Car qui possède quoi que ce soit, sinon le Père seul ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle devint un corps » ou « elle se fit un corps ».'
    reason: Le tour copte exprime directement l’acquisition ou la prise d’un corps ; la note conserve cette matérialité derrière l’expression française idiomatique.
  - marker: b
    text: 'Le sens précis de cette paire est incertain ; on peut aussi comprendre : « les unes furent approvisionnées, les autres répandues » ou « déversées ».'
    reason: La série oppose plusieurs états des récipients, mais le second couple verbal se prête à plusieurs analyses lexicales et contextuelles.
  - marker: c
    text: Le terme peut aussi désigner ses « âges » ou ses « éons ».
    reason: Le vocabulaire du passage peut viser à la fois des générations issues du Père et des réalités ou périodes cosmiques ; la traduction principale garde le sens relationnel le plus naturel sans effacer l’autre possibilité.
lexical_decisions:
- source_word: ⲥⲕⲉⲩⲟⲥ
  choice: jarres
  rationale: Le contexte domestique et les états décrits — pleines, vides, purifiées, brisées — appellent un récipient concret. « Jarres » conserve l’image de la parabole mieux que le terme plus abstrait « vases ».
- source_word: ⲡⲥⲁⲁⲧⲡⲉ
  choice: jugement
  rationale: Le contexte décrit une décision venue d’en haut qui évalue chacun ; « jugement » garde la portée judiciaire du terme.
- source_word: ⲡⲓⲱⲉ / ⲗⲟⲅⲟⲥ
  choice: son / Parole
  rationale: Le texte oppose un simple phénomène sonore à la Parole manifestée. La majuscule signale la personnification théologique sans ajouter d’identification doctrinale étrangère au passage.
- source_word: ⲣⲟⲩⲥⲱⲙⲁ
  choice: prendre corps
  rationale: Cette expression française naturelle conserve l’idée explicite d’incorporation sans imposer le vocabulaire doctrinal plus spécialisé d’« incarnation ».
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: l’Erreur
  rationale: 'Le terme est personnifié : elle s’angoisse, se lamente et se détruit. La majuscule rend cette personnification et maintient son opposition à la Vérité et à la Connaissance.'
- source_word: ⲡⲓⲥⲁⲩⲛⲉ
  choice: la Connaissance
  rationale: « Connaissance » préserve l’opposition conceptuelle centrale avec l’Erreur, sans introduire dans le corps du texte le terme technique moderne « gnose ».
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  choice: la Vérité
  rationale: La Vérité agit comme une réalité personnifiée et comme la bouche du Père ; la majuscule rend cette fonction littéraire.
- source_word: ⲛⲥⲕⲉⲩⲟⲥ / ⲛⲓⲁⲓⲱⲛ
  choice: jarres / mondes
  rationale: La traduction distingue les récipients de la parabole et les réalités cosmiques ensuite ébranlées. « Mondes » est plus immédiatement intelligible que « éons », tout en laissant une note signaler la portée possible du terme.
theological_decisions:
- issue: Personnification de l’Erreur, de la Vérité et de la Connaissance
  choice: Conserver les personnifications avec des majuscules
  alternative: Les rendre comme des notions abstraites en minuscules
  rationale: Les verbes et pronoms du texte leur attribuent une action propre. Les dépersonnaliser affaiblirait la tension théologique voulue.
- issue: Métaphore de la bouche et de la langue du Père
  choice: 'Traduire littéralement : la Vérité est la bouche du Père et l’Esprit saint sa langue'
  alternative: Paraphraser en termes d’expression et de parole divines
  rationale: L’imagerie corporelle structure le passage et relie la Parole qui prend corps à la communication de l’Esprit. Une paraphrase résoudrait trop vite cette métaphore.
- issue: Relation entre ceux qui aiment la Vérité, la bouche du Père et l’Esprit saint
  choice: Conserver la chaîne d’union exprimée par le texte
  alternative: La reformuler comme une doctrine systématique de la réception de l’Esprit
  rationale: Le passage présente une série d’images relationnelles plutôt qu’un exposé dogmatique ; la traduction n’en précise donc pas davantage le mécanisme.
- issue: Portée de « prendre corps »
  choice: Employer une formulation concrète mais non technique
  alternative: Traduire par « s’incarna »
  rationale: « Prendre corps » maintient la force du texte tout en évitant de déterminer à elle seule l’identité ou la nature exacte de la Parole.
translation_notes:
  register: Français international moderne, sobre et dignifié. Les phrases restent accessibles tout en conservant le rythme antithétique du copte, la répétition des personnifications et l’étrangeté voulue des images révélatrices. « Esprit saint » suit l’usage typographique français courant ; « Père », « Parole », « Vérité », « Erreur » et « Connaissance » prennent une majuscule lorsqu’ils sont personnifiés.
