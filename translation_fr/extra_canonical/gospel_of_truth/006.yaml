- from: 'Car tel est le jugement venu d’en haut : il a jugé chacun. C’est une épée dégainée, à deux tranchants, qui coupe de part et d’autre. La Parole, présente dans le cœur de ceux qui la prononcent, est apparue. Elle n’était pas seulement un son : elle a pris corps[a].


    Un grand bouleversement se produisit parmi les jarres : les unes étaient vides, les autres pleines ; les unes avaient été pourvues, les autres vidées[b] ; les unes avaient été purifiées, les autres brisées. Tous les mondes furent ébranlés et bouleversés, car ils n’avaient ni ordre ni stabilité.


    L’Erreur fut saisie d’angoisse. Elle ne savait que faire. Elle s’affligea, se lamenta et se tourmenta elle-même, car elle ne savait rien. La Connaissance, qui entraîne sa destruction, s’approcha d’elle et de tout ce qui était issu d’elle. En effet, l’Erreur est vide : il n’y a rien en elle.


    La Vérité vint au milieu d’eux, et tous ceux qui étaient issus d’elle la reconnurent. Ils accueillirent le Père dans la Vérité, avec une puissance parfaite qui les unit au Père. Car tous ceux qui aiment la Vérité — la Vérité est la bouche du Père — et qui s’unissent à elle s’unissent à la bouche du Père. Par sa langue, ils recevront l’Esprit saint. Celui-ci est la langue du Père.


    Telle est la révélation du Père et sa manifestation à ses générations[c]. Il a révélé ce qui, de lui-même, était caché ; il l’a expliqué. Car qui possède quoi que ce soit, sinon le Père seul ?'
