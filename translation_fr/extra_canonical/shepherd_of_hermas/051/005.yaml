base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/005.yaml
  text: I say to him, "Sir, since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing these things, I would ask the Lord that it might be made clear to me."
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, puisque tu es avec moi, j’ai besoin de te demander et de t’interroger, car tu me montres tout et tu parles avec moi. Mais si, sans toi, je voyais ou entendais ces choses, je demanderais au Seigneur afin que cela me soit révélé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve l’adresse respectueuse et le lien lexical avec τὸν Κύριον plus loin, sans imposer une distinction absente du grec.
- source_word: ἀνάγκην ἔχω
  choice: j’ai besoin de
  rationale: Expression française naturelle qui rend l’idée de nécessité dans ce contexte de demande d’explication.
- source_word: αἰτεῖσθαι καὶ ἐπερωτᾶν
  choice: te faire mes demandes et de t’interroger
  rationale: Maintient les deux verbes grecs, le premier portant sur la demande et le second sur l’interrogation.
- source_word: ἄτερ σοῦ
  choice: sans toi
  rationale: Rend simplement la séparation exprimée par la préposition grecque.
- source_word: δηλωθῇ
  choice: me les faire connaître
  rationale: Exprime le passif de révélation ou d’explication tout en donnant à la phrase une tournure française naturelle; le pluriel reprend « ces choses ».
theological_decisions:
- issue: Identité des deux référents appelés κύριος
  choice: Employer « Seigneur » dans les deux cas
  alternative: Employer « maître » pour l’interlocuteur et « Seigneur » pour Dieu
  rationale: Le grec emploie le même terme, Κύριε/Κύριον. La traduction conserve cette continuité et ne tranche pas explicitement l’identité ou le statut de l’interlocuteur.
- issue: Agent implicite de δηλωθῇ
  choice: Formuler « je demanderais au Seigneur de me les faire connaître »
  alternative: « je demanderais au Seigneur que cela me soit révélé »
  rationale: La formulation française indique naturellement que la demande est adressée au Seigneur, sans préciser davantage le mode de révélation.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct et l’enchaînement argumentatif du grec sont conservés; aucune note n’est nécessaire pour ce segment.
