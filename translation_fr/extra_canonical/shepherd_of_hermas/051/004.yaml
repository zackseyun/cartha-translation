base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/004.yaml
  text: '"You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, having heard them, keep them will be blessed, and they will receive understanding from the Lord."'
translation:
  language: fr
  text: « Tu observeras ces choses ainsi, toi-même avec tes enfants et toute ta maisonnée. Après les avoir observées, tu seras heureux. Et tous ceux qui les auront entendues et les observeront seront heureux, et ils recevront du Seigneur l’intelligence. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρήσεις / τηρήσας / τηρήσωσι
  choice: observeras / observes / observeront
  rationale: Le verbe τηρέω exprime ici le fait de garder fidèlement et de mettre en pratique les prescriptions données ; « observer » conserve ce sens normatif dans un français naturel.
- source_word: τέκνων
  choice: enfants
  rationale: Équivalent direct et courant, approprié au cadre familial.
- source_word: ὅλου τοῦ οἴκου σου
  choice: toute ta maisonnée
  rationale: οἶκος désigne ici l’ensemble du foyer, et pas seulement le bâtiment ; « maisonnée » préserve cette portée collective.
- source_word: μακάριος / μακάριοι
  choice: heureux
  rationale: Rend l’état favorable ou béni exprimé par μακάριος sans ajouter explicitement un agent divin absent de cette proposition.
- source_word: σύνεσιν
  choice: l’intelligence
  rationale: Le terme désigne la faculté de comprendre ou le discernement. « L’intelligence » conserve la formulation dense de la source et l’idée d’une compréhension reçue du Seigneur.
theological_decisions:
- issue: Nature de la béatitude promise
  choice: « heureux »
  alternative: « bénis »
  rationale: « Heureux » rend μακάριος sans préciser que le mot signifie une bénédiction prononcée, ce que le texte ne formule pas explicitement ici.
- issue: Don reçu du Seigneur
  choice: « l’intelligence »
  alternative: « le discernement » ou « la compréhension »
  rationale: Le choix garde ouverte la portée de σύνεσις — compréhension spirituelle, intelligence ou discernement — sans la réduire à une interprétation doctrinale particulière.
translation_notes:
  register: Français moderne, digne et accessible. Le futur injonctif de « tu observeras » reflète la force directive du grec. « Maisonnée » évite de réduire οἶκος à une habitation matérielle.
