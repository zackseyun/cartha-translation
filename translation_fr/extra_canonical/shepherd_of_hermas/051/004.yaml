    issue: Rendu de οὕτω par « donc »
    rationale: οὕτω est adverbial (« ainsi », « de cette manière ») et décrit la manière d’observer les prescriptions; il n’exprime pas ici une déduction.
  - severity: low
    issue: Antériorité des participes non exprimée
    rationale: τηρήσας et ἀκούσαντες précèdent les verbes principaux au futur. « Après les avoir... » rend cette relation sans alourdir le français.
