base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/003.yaml
  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: fr
  text: Si donc tu accomplis le jeûne de cette manière, comme je te l’ai ordonné, ton sacrifice sera agréable à Dieu, et ce jeûne sera inscrit ; le service accompli de cette manière est bon, joyeux et bien accueilli par le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσῃς
  choice: tu accomplis
  rationale: Rend l’idée de mener le jeûne à son accomplissement, sans alourdir par « mener à son terme ».
- source_word: δεκτὴ παρὰ τῷ Θεῷ
  choice: agréé de Dieu
  rationale: Formulation française naturelle et digne exprimant l’acceptation du sacrifice auprès de Dieu.
- source_word: ἔγγραφος
  choice: inscrit
  rationale: Conserve l’image d’une consignation écrite sans préciser où, puisque le grec ne le dit pas.
- source_word: λειτουργία
  choice: service
  rationale: Le terme désigne ici un service ou une œuvre accomplie; « liturgie » introduirait une connotation cultuelle plus technique que le contexte n’exige.
- source_word: καλὴ καὶ ἱλαρά
  choice: beau, joyeux
  rationale: 'Préserve les deux qualités distinctes: bonté/beauté et caractère joyeux ou de bon cœur.'
- source_word: εὐπρόσδεκτος
  choice: bien accueilli
  rationale: Exprime une réception favorable tout en évitant de répéter exactement « agréé ».
theological_decisions:
- issue: Rapport entre le jeûne, le sacrifice et l’acceptation divine
  choice: Maintenir l’énoncé conditionnel et cultuel tel quel
  alternative: Paraphraser en termes de mérite spirituel ou, à l’inverse, atténuer le lien avec l’acceptation divine
  rationale: Le texte affirme que le jeûne accompli selon l’ordre donné rend le sacrifice acceptable; la traduction conserve cette tension sans lui imposer un cadre doctrinal ultérieur.
- issue: Sens de l’inscription du jeûne
  choice: « ce jeûne sera inscrit » sans complément
  alternative: « inscrit au ciel », « porté au compte de Dieu » ou « reconnu »
  rationale: Le grec ne précise ni le registre ni le lieu de l’inscription; l’ambiguïté est donc préservée.
translation_notes:
  register: Français moderne, courant et digne; tutoiement maintenu conformément au dialogue grec. La syntaxe garde la progression solennelle de la phrase tout en restant lisible.
