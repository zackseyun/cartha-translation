  text: I say, "Sir, I do not know these parables, nor am I able to understand them unless you explain them to me."
translation:
  language: fr
  text: 'Je dis : « Seigneur, je ne comprends pas ces paraboles et je ne peux pas les saisir, à moins que tu ne me les expliques. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans ce dialogue, il s’agit d’une adresse respectueuse à la figure révélatrice; « Seigneur » conserve la dignité et l’ambivalence du grec.
- source_word: παραβολὰς
  choice: paraboles
  rationale: Équivalent français établi de παραβολή, approprié aux récits figurés de cette section.
- source_word: οὐ γινώσκω
  choice: je ne comprends pas
  rationale: Ici, γινώσκω désigne la compréhension du sens des paraboles plutôt que la simple connaissance de leur existence.
- source_word: νοῆσαι
  choice: les saisir
  rationale: Ce choix distingue νοεῖν de γινώσκειν tout en exprimant l’acte de pénétrer intellectuellement leur sens.
- source_word: ἐπιλύσῃς
  choice: tu ne me les expliques
  rationale: Le verbe signifie ici résoudre ou interpréter ce qui est obscur; « expliquer » est naturel et précis en français moderne.
theological_decisions:
- issue: Valeur du titre Κύριε
  choice: Seigneur
  alternative: Maître / Monsieur
  rationale: « Seigneur » préserve la portée honorifique et la possible résonance religieuse sans préciser davantage l’identité ou le statut théologique de l’interlocuteur.
translation_notes:
  register: Français moderne, clair et digne. La coordination négative du grec est conservée, tandis que la différence entre γινώσκω et νοῆσαι est rendue par « comprendre » et « saisir ».
