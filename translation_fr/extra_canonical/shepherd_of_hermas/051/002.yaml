  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/002.yaml
  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: fr
  text: 'Il dit : « Je t’expliquerai tout et je te montrerai tout ce dont je te parlerai. Que celui qui a reçu les préceptes de ta prudence remplisse son âme et prie le Seigneur pour toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλύσω
  choice: j’expliquerai
  rationale: Le verbe signifie ici éclaircir ou donner l’interprétation de paroles figurées; « expliquer » est naturel et précis en français.
- source_word: δείξω
  choice: je montrerai
  rationale: Conserve la distinction avec ἐπιλύσω et le caractère concret du grec.
- source_word: φροσύνης
  choice: sagesse
  rationale: Le nom désigne la prudence, le bon sens ou la sagesse pratique. « Sagesse » convient au registre exhortatif sans réduire le terme à la seule circonspection.
- source_word: ἐμπλήσῃ τὴν ἑαυτοῦ ψυχὴν
  choice: remplisse son âme
  rationale: Rendu formel de l’expression grecque, dont le complément implicite demeure non précisé dans le texte transmis.
- source_word: εὔξηται ὑπὲρ σοῦ
  choice: prie le Seigneur en ta faveur
  rationale: εὔχομαι signifie ici prier, et ὑπέρ marque l’intercession en faveur de quelqu’un.
theological_decisions:
- issue: Valeur des subjonctifs ἐμπλήσῃ et εὔξηται
  choice: 'exhortation à la troisième personne : « Que celui… remplisse… et prie… »'
  alternative: 'futur déclaratif : « celui… remplira… et priera… »'
  rationale: Le texte grec fourni porte deux subjonctifs aoristes, qui se prêtent naturellement à une exhortation. La traduction ne les transforme pas silencieusement en futurs.
- issue: Complément de « remplir son âme »
  choice: laisser l’expression sans complément ajouté
  alternative: expliciter « de sagesse » ou « de ces commandements »
  rationale: Le grec ne formule aucun complément après « remplir son âme »; en ajouter un résoudrait une difficulté réelle du texte transmis.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve l’enchaînement direct du dialogue ainsi que l’étrangeté relative de « remplir son âme », plutôt que de suppléer une interprétation absente du grec.
