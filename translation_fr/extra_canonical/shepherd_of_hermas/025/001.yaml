  source_fidelity: La structure participiale initiale, le lieu, la κλίνη, la tenue pastorale, la peau blanche, la besace, le bâton et la salutation réciproque sont rendus fidèlement. Toutefois, « à l’aspect majestueux » atténue et interprète ἔνδοξος (« glorieux, éclatant, illustre ») ; « glorieux d’apparence » conserve mieux le qualificatif sans définir la nature de cette gloire.
  naturalness: Le français est fluide, moderne et d’un registre narratif approprié. « Dans une tenue de berger » est légèrement plus naturel et plus directement lié à σχήματι que « vêtu en berger ».
  terminology: « Besace », « bâton » et « peau blanche » sont appropriés. La note sur κλίνη préserve utilement l’éventail de sens sans surcharger le texte.
  issues:
