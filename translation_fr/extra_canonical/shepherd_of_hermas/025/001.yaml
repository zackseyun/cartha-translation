base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/001.yaml
  text: After I had prayed in the house and sat down on the couch, a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.
translation:
  language: fr
  text: Après avoir prié dans la maison et m’être assis sur le lit[a], un homme glorieux d’apparence entra. Il portait une tenue de berger, était enveloppé d’une peau blanche, et avait une besace sur les épaules ainsi qu’un bâton à la main. Il me salua, et je lui rendis son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur la couche » ou « sur le divan ».'
    reason: Le grec κλίνη peut désigner un lit, une couche ou un divan.
lexical_decisions:
- source_word: ἐν τῷ οἴκῳ
  choice: dans la maison
  rationale: Rend directement le lieu sans ajouter que la maison appartient au narrateur.
- source_word: κλίνην
  choice: lit
  rationale: Sens courant du terme dans un cadre domestique; le mot peut aussi désigner une couche ou un divan, ambiguïté signalée en note.
- source_word: ἔνδοξος τῇ ὄψει
  choice: à l’aspect majestueux
  rationale: Exprime une apparence remarquable et pleine de dignité sans suggérer nécessairement une gloire surnaturelle.
- source_word: σχήματι ποιμενικῷ
  choice: vêtu en berger
  rationale: Formulation française naturelle qui conserve l’idée d’une tenue ou apparence pastorale.
- source_word: δέρμα λευκόν
  choice: une peau blanche
  rationale: Conserve l’image concrète d’une peau animale portée comme vêtement, sans préciser une espèce absente du grec.
- source_word: πήραν
  choice: besace
  rationale: Désigne le sac de voyage porté par un berger ou un voyageur et convient au registre narratif.
- source_word: ἠσπάσατό με … ἀντησπασάμην
  choice: Il me salua, et je lui rendis son salut
  rationale: Reproduit clairement la salutation réciproque en français idiomatique.
theological_decisions:
- issue: Nature de l’apparence glorieuse de l’homme
  choice: à l’aspect majestueux
  alternative: glorieux d’apparence
  rationale: Le grec décrit ici son apparence sans expliquer encore son identité; cette formulation préserve la progression narrative et n’impose pas une manifestation surnaturelle.
translation_notes:
  register: Français moderne, fluide et digne. La syntaxe suit de près la progression du grec tout en évitant les tournures pesantes; les objets et la tenue du berger restent concrets.
