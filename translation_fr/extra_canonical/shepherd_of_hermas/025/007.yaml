base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: fr
  text: 7. Si donc, après avoir entendu ces choses, vous les gardez, vous conformez votre conduite à elles et les mettez en pratique d’un cœur pur, vous recevrez du Seigneur tout ce qu’il vous a promis. Mais si, après les avoir entendues, vous ne vous repentez pas et ajoutez encore à vos péchés, vous recevrez du Seigneur l’opposé. Le Berger, l’ange de la repentance, m’a ordonné d’écrire toutes ces choses ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε
  choice: vous les gardez
  rationale: Conserve l’idée de tenir fidèlement les commandements et paraboles, plutôt que le seul fait de les observer intellectuellement.
- source_word: ἐν αὐταῖς πορευθῆτε
  choice: vous marchez selon eux
  rationale: Rend naturellement en français la métaphore biblique de la conduite de vie, avec un pronom masculin renvoyant aux commandements et aux enseignements évoqués.
- source_word: ἐργάσησθε αὐτὰς
  choice: les mettez en pratique
  rationale: Formulation française courante et précise pour l’accomplissement concret de ces prescriptions.
- source_word: μετανοήσητε / μετανοίας
  choice: vous vous repentez / repentance
  rationale: Maintient le lien lexical entre l’acte demandé et le titre de l’ange, ainsi que la portée morale et spirituelle du grec.
- source_word: τὰ ἐναντία
  choice: ce qui leur est opposé
  rationale: Préserve l’expression volontairement générale du grec sans préciser arbitrairement la nature des conséquences.
theological_decisions:
- issue: Rapport entre obéissance, repentance et réception de la promesse
  choice: Conserver les conditions formulées directement par le texte
  alternative: Atténuer le lien en parlant seulement d’encouragement moral ou de conséquences naturelles
  rationale: Le grec établit explicitement une opposition conditionnelle entre garder et pratiquer avec un cœur pur, ou ne pas se repentir et ajouter aux péchés. La traduction ne doit ni résoudre ni reformuler cette tension théologique.
- issue: Identité du Berger
  choice: « le Berger, l’ange de la repentance »
  alternative: « le Berger, c’est-à-dire l’ange chargé de conduire au repentir »
  rationale: L’apposition grecque est conservée sobrement sans développer une interprétation de sa fonction ou de son identité.
translation_notes:
  register: Français moderne, digne et accessible. La structure conditionnelle et le parallélisme du grec sont maintenus, tout en évitant une syntaxe inutilement lourde. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
