- from: 7. Si donc, après les avoir entendus, vous les gardez, si vous marchez selon eux et les mettez en pratique d’un cœur pur, vous recevrez du Seigneur tout ce qu’il vous a promis. Mais si, après les avoir entendus, vous ne vous repentez pas et continuez au contraire d’ajouter à vos péchés, vous recevrez du Seigneur ce qui leur est opposé. Voilà tout ce que le Berger, l’ange de la repentance, m’a ordonné d’écrire de cette manière.
  to: 7. Si donc, après avoir entendu ces choses, vous les gardez, vous conformez votre conduite à elles et les mettez en pratique d’un cœur pur, vous recevrez du Seigneur tout ce qu’il vous a promis. Mais si, après les avoir entendues, vous ne vous repentez pas et ajoutez encore à vos péchés, vous recevrez du Seigneur l’opposé. Le Berger, l’ange de la repentance, m’a ordonné d’écrire toutes ces choses ainsi.
  rationale: La révision clarifie le référent des pronoms, maintient les trois verbes coordonnés du grec (garder, marcher conformément aux enseignements, mettre en pratique), et conserve sans interprétation l’opposition générale annoncée par τὰ ἐναντία. Aucun ajout doctrinal ni aucune note ne sont nécessaires.
