base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/004.yaml
  text: 4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and foolishly.
translation:
  language: fr
  text: '4. Pendant qu’il parlait encore, son apparence changea, et je le reconnus : c’était celui à qui j’avais été confié. Aussitôt, je fus bouleversé, la peur me saisit et je fus entièrement accablé de tristesse, parce que je lui avais répondu avec tant de méchanceté et de sottise.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  choice: son apparence changea
  rationale: Rend directement le changement de l’aspect visible sans préciser de quelle manière il s’est produit.
- source_word: συνεχύθην
  choice: je fus bouleversé
  rationale: Exprime le trouble profond du narrateur dans un français naturel, sans réduire le terme à la seule confusion intellectuelle.
- source_word: ὅλος συνεκόπην ἀπὸ τῆς λύπης
  choice: je fus entièrement accablé de tristesse
  rationale: Conserve l’intensité de ὅλος et l’idée d’un abattement profond causé par la tristesse.
- source_word: πονηρῶς καὶ ἀφρόνως
  choice: avec tant de méchanceté et de sottise
  rationale: Préserve les deux qualifications distinctes, morale et intellectuelle, tout en rendant οὕτως par « tant » en français idiomatique.
theological_decisions:
- issue: Identité de l’homme apparu sous l’aspect d’un berger
  choice: « celui à qui j’avais été confié »
  alternative: « celui auquel j’avais été remis »
  rationale: La formulation conserve le passif et l’ambiguïté du grec quant à l’agent qui a confié Hermas, sans ajouter d’identification doctrinale.
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe reste proche du mouvement du grec tout en évitant les tournures artificielles. Aucun terme technique ni ajout interprétatif.
