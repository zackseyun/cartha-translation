  to: '5. Mais il me répondit : « Ne sois pas bouleversé, mais affermis-toi dans mes commandements, que je vais te prescrire. Car j’ai été envoyé, dit-il, afin de te montrer de nouveau tout ce que tu as vu auparavant, en particulier les points essentiels qui vous sont utiles. Avant toute chose, mets par écrit mes commandements et les paraboles. Quant aux autres choses, tu les écriras à mesure que je te les montrerai. Voilà pourquoi, dit-il, je t’ordonne de mettre d’abord par écrit les commandements et les paraboles, afin que tu puisses les lire en les ayant sous la main et que tu sois capable de les observer. »'
