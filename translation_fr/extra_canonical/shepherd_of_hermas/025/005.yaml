  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/005.yaml
  text: 5. But he answered me and says, “Do not be confounded, but be strengthened in my commandments, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my commandments and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the commandments and parables, so that you may read them readily at hand and be able to keep them.”
translation:
  language: fr
  text: '5. Mais il me répondit : « Ne sois pas bouleversé, mais affermis-toi dans mes commandements, que je vais te prescrire. Car j’ai été envoyé, dit-il, afin de te montrer de nouveau tout ce que tu as vu auparavant, en particulier les points essentiels qui vous sont utiles. Avant toute chose, mets par écrit mes commandements et les paraboles. Quant aux autres choses, tu les écriras à mesure que je te les montrerai. Voilà pourquoi, dit-il, je t’ordonne de mettre d’abord par écrit les commandements et les paraboles, afin que tu puisses les lire en les ayant sous la main et que tu sois capable de les observer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ συγχύννου
  choice: Ne sois pas bouleversé
  rationale: Le verbe exprime ici le trouble et la confusion intérieure d’Hermas; « bouleversé » est naturel en français moderne et convient au contexte émotionnel.
- source_word: ἰσχυροποιοῦ
  choice: affermis-toi
  rationale: L’impératif invite à devenir fort ou ferme; la tournure pronominale conserve cette valeur sans ajouter une source extérieure non exprimée.
- source_word: ἐντολαῖς / ἐντέλλεσθαι
  choice: commandements / donner
  rationale: « Commandements » maintient le terme structurant de l’ouvrage; « ceux que je vais te donner » évite la lourdeur de « commander des commandements » tout en conservant le sens.
- source_word: αὐτὰ τὰ κεφάλαια
  choice: à savoir les points essentiels
  rationale: κεφάλαια désigne les points principaux ou rubriques majeures. « À savoir » rattache naturellement cette apposition à l’ensemble des visions antérieures.
- source_word: σύμφορα
  choice: utiles
  rationale: Le mot signifie ce qui est avantageux, profitable ou bénéfique. « Utiles » reste sobre et direct.
- source_word: παραβολάς
  choice: paraboles
  rationale: Ce choix respecte le titre traditionnel de cette partie de l’ouvrage et la portée figurative des enseignements.
- source_word: ὑπὸ χεῖρα
  choice: en les ayant sous la main
  rationale: L’expression idiomatique indique que les écrits seront disponibles et faciles à consulter; l’expression française correspond étroitement.
- source_word: φυλάξαι
  choice: observer
  rationale: Dans le contexte de commandements, le verbe signifie garder en pratique, respecter. « Observer » exprime mieux cette dimension que le seul fait de conserver matériellement.
theological_decisions:
- issue: Nature des « points essentiels » montrés de nouveau
  choice: « tout ce que tu as vu auparavant, à savoir les points essentiels qui vous sont utiles »
  alternative: « tout ce que tu as vu auparavant, surtout les points essentiels qui vous sont utiles »
  rationale: Le grec place αὐτὰ τὰ κεφάλαια en apposition et peut souligner les éléments principaux plutôt qu’introduire une sélection explicite. « À savoir » conserve ce lien sans ajouter « surtout ».
- issue: Force de la mise en pratique finale
  choice: « que tu sois capable de les observer »
  alternative: « que tu puisses les garder »
  rationale: « Observer » rend la fidélité pratique aux commandements, sans réduire φυλάσσω à la conservation du texte ni préciser davantage la théologie de l’obéissance.
translation_notes:
  register: Français moderne, international et dignifié. Les phrases gardent le mouvement répétitif du discours grec, notamment les reprises de « dit-il » et de l’ordre d’écrire, tout en évitant les calques peu naturels. Aucun marqueur de note n’est requis.
