  text: 2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel, that I may dwell with you for the rest of the days of your life.”
translation:
  language: fr
  text: '2. Aussitôt, il s’assit à côté de moi et me dit : « J’ai été envoyé par l’ange très vénérable afin de demeurer avec toi pendant tous les jours qui te restent à vivre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Rend directement l’immédiateté exprimée par l’adverbe grec.
- source_word: παρεκάθισέν μοι
  choice: il s’assit à côté de moi
  rationale: Expression française naturelle qui conserve le sens de proximité du verbe grec.
- source_word: σεμνοτάτου ἀγγέλου
  choice: l’ange très vénérable
  rationale: Le superlatif σεμνοτάτου exprime ici la très haute dignité et appelle un rendu respectueux sans identifier davantage l’ange.
- source_word: μετὰ σοῦ οἰκήσω
  choice: demeurer avec toi
  rationale: « Demeurer » conserve la portée durable de οἰκέω et convient au registre digne du récit.
- source_word: τὰς λοιπὰς ἡμέρας τῆς ζωῆς σου
  choice: pendant tous les jours qui te restent à vivre
  rationale: Formulation idiomatique qui préserve l’idée des jours restants de la vie du destinataire.
theological_decisions:
- issue: Identité et rang de l’ange qualifié de σεμνότατος
  choice: l’ange très vénérable
  alternative: l’ange le plus vénérable
  rationale: Le contexte ne précise pas son identité ni n’établit explicitement une comparaison avec tous les autres anges. « Très vénérable » conserve la force du superlatif grec sans imposer une hiérarchie théologique plus définie.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif de λέγει est harmonisé en français par « me dit », plus fluide après le passé simple, sans modifier le contenu.
