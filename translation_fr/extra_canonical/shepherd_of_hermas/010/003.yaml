base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/003.yaml
  text: 3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.
translation:
  language: fr
  text: 3. Après avoir dit cela, elle voulut partir. Mais je tombai à ses pieds et la suppliai, au nom du Seigneur, de me montrer la vision qu’elle m’avait promise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν ἀπελθεῖν
  choice: elle voulut partir
  rationale: Rend directement l’intention exprimée par l’imparfait ἤθελεν et l’infinitif ἀπελθεῖν, dans un français naturel.
- source_word: ἠρώτησα
  choice: je la suppliai
  rationale: Dans ce contexte de prosternation et de demande solennelle, « supplier » exprime mieux l’intensité de la requête que le simple « demander ».
- source_word: κατὰ τοῦ Κυρίου
  choice: au nom du Seigneur
  rationale: La tournure grecque introduit ici un appel solennel au Seigneur comme garant de la demande; « au nom du Seigneur » reste idiomatique sans préciser davantage la nature de cet appel.
- source_word: ἐπιδείξῃ
  choice: de me montrer
  rationale: Traduction claire du verbe signifiant faire voir ou montrer, avec le bénéficiaire μοι explicitement rendu par « me ».
theological_decisions:
- issue: Force de l’expression κατὰ τοῦ Κυρίου
  choice: au nom du Seigneur
  alternative: par le Seigneur / en prenant le Seigneur à témoin
  rationale: Le grec peut évoquer une adjuration ou un appel solennel. La traduction choisie conserve cette solennité tout en restant compréhensible et sans imposer une formule technique précise.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit littéraire tout en demeurant accessible. Aucun marqueur de note n’est requis.
