base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/008.yaml
  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: fr
  text: 8. Beaucoup d’autres pierres gisaient autour de la tour, et on ne les employait pas à la construction. Certaines étaient couvertes de croûtes, d’autres étaient fendues, d’autres encore étaient mutilées ; d’autres enfin étaient blanches et rondes, impropres à la construction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: couvertes de croûtes
  rationale: Le participe évoque une affection rugueuse ou croûteuse comparable à la gale. Cette formulation concrète préserve l’image appliquée aux pierres sans leur attribuer simplement une couleur ou une usure indéterminée.
- source_word: σχισμὰς ἔχοντες
  choice: étaient fendues
  rationale: Rend naturellement l’idée de pierres présentant des fissures ou des fentes.
- source_word: κεκολοβωμένοι
  choice: étaient mutilées
  rationale: Le terme signifie qu’une partie a été retranchée, laissant les pierres incomplètes ou tronquées. « Mutilées » conserve la force imagée du grec.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: impropres à la construction
  rationale: Exprime que la forme blanche et ronde de ces pierres ne permet pas leur ajustement dans l’ouvrage, dans un français fluide et précis.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « d’autres » maintient la progression descriptive du grec, tandis que « enfin » rend lisible la dernière catégorie sans modifier le sens.
