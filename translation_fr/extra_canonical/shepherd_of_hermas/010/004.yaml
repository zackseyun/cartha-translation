  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: fr
  text: '4. De nouveau, elle me prit par la main, me releva et me fit asseoir sur le banc, à gauche ; elle-même s’assit à droite. Puis elle leva une baguette brillante et me dit : « Vois-tu quelque chose de grand ? » Je lui répondis : « Madame, je ne vois rien. » Elle me dit : « Regarde ! Ne vois-tu pas, en face de toi, une grande tour que l’on construit sur les eaux avec des pierres carrées et brillantes ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμπλέσιον
  choice: banc
  rationale: Le terme désigne ici le siège sur lequel Hermas avait été invité à s’asseoir ; « banc » est naturel en français et convient au contexte de places à gauche et à droite.
- source_word: ἐξ εὐωνύμων / ἐκ δεξιῶν
  choice: à gauche / à droite
  rationale: Rend directement l’opposition spatiale du grec sans ajouter d’interprétation symbolique.
- source_word: ῥάβδον τινα λαμπράν
  choice: une baguette brillante
  rationale: « Baguette » restitue un objet plus léger qu’un bâton, tandis que « brillante » conserve l’idée de luminosité portée par λαμπράν.
- source_word: μέγα πρᾶγμα
  choice: quelque chose de grand
  rationale: Cette formulation préserve l’indétermination du grec avant que la tour soit explicitement désignée.
- source_word: κατέναντί σου
  choice: en face de toi
  rationale: Expression française courante correspondant précisément à la position indiquée.
- source_word: ἐπὶ ὑδάτων
  choice: sur les eaux
  rationale: Le pluriel et l’image du grec sont conservés, sans les réduire à une étendue d’eau particulière.
- source_word: λίθοις τετραγώνοις λαμπροῖς
  choice: avec des pierres carrées et brillantes
  rationale: Rend les deux qualificatifs visibles et conserve le lien instrumental ou matériel exprimé par le datif.
theological_decisions:
- issue: Portée symbolique de la gauche et de la droite
  choice: Traduction spatiale littérale, sans commentaire doctrinal
  alternative: Expliciter une hiérarchie spirituelle entre les places
  rationale: Le contexte antérieur évoque une différence de gloire, mais ce verset décrit d’abord la disposition de la scène ; l’explication ne doit pas être importée dans la traduction.
- issue: Symbolisme de la tour construite sur les eaux
  choice: Conserver l’image sans l’identifier
  alternative: Nommer explicitement l’Église ou une autre réalité théologique
  rationale: L’interprétation de la vision vient dans son propre développement ; la traduction doit préserver la progression narrative.
translation_notes:
  register: Français moderne, clair et digne. Le dialogue reste direct. Le pronom isolé Σὺ, probablement incertain ou parasite dans la transmission, n’est pas traduit séparément ; l’impératif « Regarde ! » rend naturellement ἰδού sans produire en français une apostrophe maladroite.
