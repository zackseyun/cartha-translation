  text: 7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.
translation:
  language: fr
  text: 7. Quant aux autres pierres qu’on apportait de la terre ferme, ils rejetaient les unes et plaçaient les autres dans la construction ; ils mettaient les autres en morceaux et les jetaient loin de la tour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξηρᾶς
  choice: terre ferme
  rationale: Rend le substantif grec désignant la terre sèche ou ferme, en contraste avec les pierres tirées des profondeurs de l’eau dans le contexte précédent.
- source_word: ἀπέβαλλον
  choice: rejetaient
  rationale: Conserve le sens direct d’écarter des pierres jugées impropres à la construction.
- source_word: κατέκοπτον
  choice: taillaient
  rationale: Dans le contexte du travail de pierres, « tailler » est naturel tout en conservant l’idée de couper ou débiter.
- source_word: οἰκοδομήν
  choice: construction
  rationale: Désigne ici l’ouvrage en cours, c’est-à-dire la construction de la tour.
