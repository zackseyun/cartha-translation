base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/001.yaml
  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: fr
  text: '1. « Qu’ont-ils enduré ? » demandai-je. Elle répondit : « Écoute : les coups de fouet, les emprisonnements, de grandes afflictions, les croix, les bêtes sauvages — à cause du Nom.[a] Voilà pourquoi les places à droite dans le sanctuaire leur appartiennent, ainsi qu’à quiconque souffre à cause du Nom ; les places à gauche appartiennent aux autres. Pourtant, ceux qui sont assis à droite et ceux qui sont assis à gauche reçoivent les mêmes dons et les mêmes promesses ; seulement, les premiers sont assis à droite et ont une certaine gloire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Nom » désigne ici, sans autre précision dans le grec, le nom pour lequel ces personnes ont souffert.
    reason: Aide le lecteur moderne à comprendre l’emploi absolu de « Nom » tout en conservant l’implicite du texte.
lexical_decisions:
- source_word: ὑπήνεγκαν
  choice: ont-ils donc enduré
  rationale: Le verbe signifie supporter ou endurer. « Donc » rend naturellement la reprise interrogative sans surcharger le texte.
- source_word: μάστιγας
  choice: les coups de fouet
  rationale: Dans ce contexte de persécution, le pluriel désigne concrètement des flagellations plutôt que des fouets comme objets.
- source_word: φυλακάς
  choice: les emprisonnements
  rationale: Le pluriel grec peut désigner les détentions ou emprisonnements subis ; cette formulation est claire en français moderne.
- source_word: θλίψεις μεγάλας
  choice: de grandes détresses
  rationale: Conserve la portée large de θλίψεις, qui peut englober afflictions, épreuves et oppression, sans la réduire à une seule forme de souffrance.
- source_word: σταυρούς
  choice: les croix
  rationale: Traduction formelle du pluriel, probablement évocateur de supplices par crucifixion, sans explicitation ajoutée.
- source_word: εἵνεκεν τοῦ ὀνόματος / διὰ τὸ ὄνομα
  choice: à cause du Nom
  rationale: La majuscule signale l’emploi absolu et confessionnel du « Nom », tout en préservant l’implicite du grec.
- source_word: τὰ δεξιὰ μέρη τοῦ ἁγιάσματος
  choice: les places à droite dans le sanctuaire
  rationale: « Places » convient mieux que « parties » à la mention ultérieure de personnes assises ; « sanctuaire » rend ἁγίασμα sans préciser davantage sa nature.
- source_word: δόξαν τινά
  choice: une certaine gloire
  rationale: Rend à la fois δόξαν et l’indétermination de τινά, sans amplifier la distinction accordée aux martyrs.
theological_decisions:
- issue: Identité du « Nom »
  choice: Conserver « le Nom » avec une majuscule
  alternative: Expliciter « le nom du Seigneur » ou « le nom de Jésus »
  rationale: Le grec emploie absolument τοῦ ὀνόματος. L’explicitation serait théologiquement plausible, mais supprimerait une retenue réelle du texte source.
- issue: Rapport entre égalité des promesses et gloire particulière
  choice: Maintenir côte à côte les mêmes dons et promesses pour tous, avec une certaine gloire pour ceux de droite
  alternative: Harmoniser en parlant de récompenses différentes ou d’une égalité absolue sans distinction
  rationale: Le passage affirme simultanément l’égalité des dons et des promesses et une distinction de place et de gloire. La traduction préserve cette tension.
- issue: Sens de « croix »
  choice: Garder le pluriel concret « les croix »
  alternative: Interpréter comme « la crucifixion » ou métaphoriquement comme « leurs croix »
  rationale: Le contexte énumère des persécutions concrètes, mais le texte ne formule pas explicitement le type exact de supplice ; la traduction littérale évite de trancher au-delà du grec.
translation_notes:
  register: Français international moderne, digne et narratif. Le dialogue reste direct et fluide. Le vocabulaire de la persécution est concret, tandis que « sanctuaire », « promesses » et « gloire » conservent le registre religieux du texte. Le balancement entre droite et gauche a été maintenu clairement.
