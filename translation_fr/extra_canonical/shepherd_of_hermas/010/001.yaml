  source_fidelity: 'Le sens général est fidèlement rendu : la liste des souffrances, la distinction droite/gauche, l’égalité des dons et des promesses, ainsi que la gloire particulière sont préservés. Toutefois, « donc » n’est pas exprimé dans Τί ... ὑπήνεγκαν et peut être omis. « Afflictions » rend θλίψεις de façon plus directe et idiomatique que « détresses » dans cette énumération.'
  naturalness: Le français est globalement fluide et d’un registre approprié. « Ceux qui sont assis » est plus proche et plus neutre que « ceux qui siègent », et « ont une certaine gloire » reproduit plus directement ἔχουσιν δόξαν τινά que « jouissent d’une certaine gloire ».
  terminology: « Le Nom », « sanctuaire », « promesses » et « gloire » conviennent. La note conserve à juste titre l’absence d’identification explicite dans la formulation grecque et ne doit pas identifier confessionnellement le Nom au-delà du texte.
