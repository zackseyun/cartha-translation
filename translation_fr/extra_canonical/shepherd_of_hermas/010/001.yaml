    rationale: « Grandes afflictions » rend θλίψεις μεγάλας plus directement; « sont assis » et « ont » reflètent respectivement καθήμενοι et ἔχουσιν, sans la nuance institutionnelle de « siègent » ni l’intensification implicite de « jouissent ».
