base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/006.yaml
  text: 6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the joining with the other stones, and so were joined to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.
translation:
  language: fr
  text: 6. Quant aux pierres tirées des profondeurs, ils les plaçaient toutes telles quelles dans la construction, car elles étaient bien ajustées et leur jointure correspondait à celle des autres pierres. Elles se joignaient ainsi les unes aux autres, au point que leurs joints ne se voyaient pas. La tour semblait être construite d’une seule pierre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ
  choice: des profondeurs
  rationale: Rend le lieu profond d’où les pierres sont tirées sans préciser indûment s’il s’agit du fond de la mer ou d’un abîme.
- source_word: οὕτως
  choice: telles quelles
  rationale: Exprime naturellement qu’elles sont posées dans l’état même où elles ont été remontées.
- source_word: ἡρμοσμένοι
  choice: bien ajustées
  rationale: Conserve l’image architecturale de pierres déjà préparées pour s’intégrer à l’ouvrage.
- source_word: συνεφώνουν τῇ ἁρμογῇ
  choice: leur jointure correspondait
  rationale: Traduit l’idée d’accord exact entre les lignes de joint des différentes pierres.
- source_word: ἐκολλῶντο ἀλλήλοις
  choice: s’emboîtaient les unes dans les autres
  rationale: Dans ce contexte de maçonnerie sans joints visibles, cette formulation française est plus naturelle qu’un littéral « se collaient » tout en gardant l’idée d’une union étroite.
- source_word: ὡς ἐξ ἑνὸς λίθου
  choice: d’une seule pierre
  rationale: Préserve l’impression visuelle d’un ouvrage monolithique, sans affirmer qu’il l’est réellement.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de l’ajustement et des joints est conservée parce qu’elle structure l’image symbolique du texte grec.
