base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/005.yaml
  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: fr
  text: 5. La tour était bâtie en carré par les six jeunes hommes qui étaient venus avec elle. Des myriades d’autres hommes apportaient des pierres, les uns des profondeurs, les autres de la terre ferme, et les remettaient aux six jeunes hommes. Ceux-ci les prenaient et bâtissaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τετραγώνῳ
  choice: selon un plan carré
  rationale: Rend naturellement la forme carrée de la construction sans suggérer que la tour se trouvait à l’intérieur d’un carré.
- source_word: μυριάδες ἀνδρῶν
  choice: des milliers et des milliers d’autres hommes
  rationale: Le pluriel μυριάδες exprime une multitude immense; cette formulation française conserve l’effet sans imposer un nombre exact.
- source_word: ἐκ τοῦ βυθοῦ
  choice: des profondeurs
  rationale: βυθός désigne ici les profondeurs, dans le contexte immédiat celles des eaux sur lesquelles la tour est bâtie; la traduction maintient l’image sans ajouter «de la mer».
- source_word: ἐκ τῆς γῆς
  choice: de la terre ferme
  rationale: Dans l’opposition avec les profondeurs aquatiques, «terre ferme» est plus clair et idiomatique que le simple «terre».
- source_word: ἐπεδίδουν
  choice: remettaient
  rationale: Exprime le fait de transmettre les pierres aux six jeunes hommes en vue de la construction.
theological_decisions:
- issue: Valeur symbolique de la tour et des pierres
  choice: Ne pas expliciter le symbolisme dans le corps du texte
  alternative: Identifier directement la tour à l’Église ou attribuer une signification spirituelle aux ouvriers et aux pierres
  rationale: Le passage rapporte d’abord la vision; son interprétation appartient à la suite du récit et ne doit pas être anticipée dans la traduction.
translation_notes:
  register: Français moderne, clair et digne. Le rythme narratif est conservé, avec une légère explicitation idiomatique de la forme carrée et de la multitude exprimée par μυριάδες.
