base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: fr
  text: 2. « Mais toi, tu désires ardemment t’asseoir à droite avec eux ; pourtant, tes manquements sont nombreux. Tu seras cependant purifié de tes manquements, et tous ceux qui ne sont pas partagés intérieurement seront eux aussi purifiés de tous les péchés qu’ils ont commis jusqu’à ce jour. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεπίθυμος
  choice: tu désires ardemment
  rationale: Le terme exprime un désir particulièrement intense ; cette formulation garde sa force tout en restant naturelle en français moderne.
- source_word: ὑστερήματα
  choice: manquements
  rationale: Le mot désigne ici des insuffisances ou défauts personnels. « Manquements » conserve cette portée morale sans l’identifier simplement aux « péchés », terme employé ensuite pour ἁμαρτημάτων.
- source_word: διψυχοῦντες
  choice: ceux qui ne sont pas partagés intérieurement
  rationale: Le verbe évoque littéralement le fait d’avoir l’âme divisée, donc l’hésitation ou l’instabilité intérieure. Cette traduction préserve l’image et l’ambiguïté mieux que le seul terme « hésiter ».
- source_word: ἁμαρτημάτων
  choice: péchés
  rationale: Traduction française courante et théologiquement non restrictive du terme grec.
- source_word: εἰς ταύτην τὴν ἡμέραν
  choice: qu’ils ont commis jusqu’à ce jour
  rationale: La tournure grecque fixe vraisemblablement la limite temporelle des péchés concernés. L’ajout explicatif « qu’ils ont commis » rend le lien naturel en français sans modifier le sens.
theological_decisions:
- issue: Portée de la purification promise
  choice: Employer le futur affirmatif « seront purifiés » sans préciser le moyen ni les conditions au-delà de l’absence de division intérieure.
  alternative: Interpréter la phrase comme une absolution sacramentelle, une purification eschatologique ou une promesse conditionnelle détaillée.
  rationale: Le grec affirme la purification mais n’en indique ici ni le mécanisme précis ni un cadre doctrinal particulier ; la traduction conserve cette indétermination.
- issue: Sens de μὴ διψυχοῦντες
  choice: Conserver l’idée d’une division intérieure.
  alternative: Traduire par « ceux qui ne doutent pas » ou « ceux qui ont une foi ferme ».
  rationale: Ces alternatives résolvent trop étroitement une image pouvant inclure doute, hésitation, indécision ou duplicité intérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le contraste entre « manquements » et « péchés » est maintenu. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
