  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/009.yaml
  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: fr
  text: '9. Je voyais aussi d’autres pierres jetées loin de la tour : elles arrivaient sur le chemin, mais n’y restaient pas et roulaient vers un terrain sans chemin ; les unes tombaient dans le feu et étaient brûlées ; les autres tombaient près de l’eau sans pouvoir rouler jusque dans l’eau, bien qu’elles veuillent y rouler et y entrer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοδίαν
  choice: des lieux sans chemin
  rationale: Le terme désigne littéralement un espace dépourvu de chemin. Cette formulation conserve le contraste explicite avec « le chemin » sans préciser indûment s’il s’agit d’un désert ou d’une friche.
- source_word: ὑδάτων / ὕδωρ
  choice: de l’eau / dans l’eau
  rationale: Le grec passe du pluriel au singulier. En français courant, le singulier collectif est plus naturel ici et garde la même image.
- source_word: κυλιομένους / κυλισθῆναι
  choice: roulaient / rouler
  rationale: Le verbe décrit le mouvement propre aux pierres et doit être répété afin de préserver la cohérence visuelle du passage.
theological_decisions:
- issue: Portée symbolique du chemin, du feu et de l’eau
  choice: Conserver les images sans les interpréter dans le corps du texte
  alternative: Expliciter le chemin comme foi, le feu comme jugement et l’eau comme baptême
  rationale: Ce verset rapporte la vision avant son explication. Une interprétation ajoutée résoudrait prématurément les symboles et importerait des conclusions théologiques absentes de la phrase.
- issue: Volonté attribuée aux pierres
  choice: « bien qu’elles veuillent »
  alternative: « bien qu’elles semblent vouloir »
  rationale: Le grec θελόντων attribue directement une volonté aux pierres personnifiées ; l’atténuer par « semblent » modifierait l’image.
translation_notes:
  register: Français moderne, clair et digne. La structure répétitive de la vision est conservée, tout en allégeant légèrement la coordination pour une lecture naturelle. Aucun marqueur de note n’est requis.
