base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: fr
  text: « Ai-je parlé ? Ne t’ai-je pas toujours considérée comme une déesse ? Ne t’ai-je pas toujours témoigné du respect comme à une sœur ? Pourquoi m’accuses-tu faussement, femme, de ces choses mauvaises et impures ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησα
  choice: Ai-je dit cela ?
  rationale: Le verbe signifie « parler, dire ». L’ajout naturel de « cela » en français reprend l’accusation évoquée par le contexte sans en préciser davantage le contenu.
- source_word: ὡς θεὰν ἡγησάμην
  choice: considérée comme une déesse
  rationale: Rend directement l’estime ou la manière dont le locuteur regardait la femme, tout en conservant le terme explicite « déesse ».
- source_word: ἐνετράπην
  choice: témoigné du respect
  rationale: Dans ce contexte relationnel, le moyen ἐντρέπομαι exprime la déférence ou le respect plutôt que la honte.
- source_word: καταψεύδῃ
  choice: m’accuses-tu faussement
  rationale: Le composé exprime ici une allégation mensongère portée contre quelqu’un.
- source_word: πονηρὰ ... καὶ ἀκάθαρτα
  choice: mauvaises et impures
  rationale: Conserve les deux qualifications morales distinctes du grec sans en intensifier la portée.
- source_word: ὦ γύναι
  choice: femme
  rationale: L’apostrophe grecque est rendue littéralement; elle peut être solennelle ou distante selon le contexte.
theological_decisions:
- issue: Comparaison de la femme à une déesse
  choice: Conserver « comme une déesse »
  alternative: « avec une vénération divine »
  rationale: Le grec emploie explicitement θεά, « déesse ». La formulation ne doit pas être atténuée pour des raisons théologiques.
- issue: Nature des accusations
  choice: « choses mauvaises et impures »
  alternative: « pensées mauvaises et impures »
  rationale: Le grec substantivé τὰ ... ταῦτα reste général dans ce segment. Préciser « pensées » anticiperait l’explication qui suit.
translation_notes:
  register: Dialogue direct, digne et naturel. Les questions successives conservent le ton défensif et indigné du locuteur. Aucun marqueur de note n’est requis.
