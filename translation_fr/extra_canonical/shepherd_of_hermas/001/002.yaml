revisions:
- from: 'Elle rit et me dit : « Le désir du mal est monté dans ton cœur. Ne te semble-t-il donc pas que, pour un homme juste, ce soit une chose mauvaise qu’un mauvais désir monte dans son cœur ? C’est bel et bien un péché, et un grand, dit-elle. Car l’homme juste forme des projets justes. Ainsi, parce qu’il forme des projets justes, sa gloire est affermie dans les cieux, et il trouve le Seigneur disposé à la réconciliation dans tout ce qu’il fait. Mais ceux qui forment dans leur cœur des projets mauvais attirent sur eux-mêmes la mort et la captivité, surtout ceux qui cherchent à s’assurer le monde présent, qui tirent orgueil de leur richesse et qui ne s’attachent pas aux biens à venir. »'
  to: 'Elle rit et me dit : « Un mauvais désir est monté dans ton cœur. Ne te semble-t-il pas qu’il soit mauvais, pour un homme juste, qu’un mauvais désir monte dans son cœur ? C’est bien un péché, et un grand, dit-elle. Car l’homme juste forme des projets justes. Ainsi, parce qu’il forme des projets justes, sa gloire est affermie dans les cieux, et il a le Seigneur facile à apaiser dans toutes ses affaires. Mais ceux qui forment dans leur cœur des projets mauvais attirent sur eux-mêmes la mort et la captivité, surtout ceux qui cherchent à s’assurer le siècle présent, qui tirent orgueil de leur richesse et qui ne s’attachent pas aux biens à venir. »'
  rationale: 'La révision est limitée à trois ajustements sûrs : cohérence de la répétition autour du mauvais désir, rendu plus direct de la relation au Seigneur exprimée par εὐκατάλλακτον, et « siècle présent » pour conserver la portée de αἰών. Aucun ajout doctrinal ni note n’est requis.'
  reviewer_model: gpt-5.6-terra
