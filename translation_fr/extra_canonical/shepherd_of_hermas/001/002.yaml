base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/002.yaml
  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: fr
  text: 'Elle rit et me dit : « Un mauvais désir est monté dans ton cœur. Ne te semble-t-il pas qu’il soit mauvais, pour un homme juste, qu’un mauvais désir monte dans son cœur ? C’est bien un péché, et un grand, dit-elle. Car l’homme juste forme des projets justes. Ainsi, parce qu’il forme des projets justes, sa gloire est affermie dans les cieux, et il a le Seigneur facile à apaiser dans toutes ses affaires. Mais ceux qui forment dans leur cœur des projets mauvais attirent sur eux-mêmes la mort et la captivité, surtout ceux qui cherchent à s’assurer le siècle présent, qui tirent orgueil de leur richesse et qui ne s’attachent pas aux biens à venir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία τῆς πονηρίας / ἡ πονηρὰ ἐπιθυμία
  choice: le désir du mal / un mauvais désir
  rationale: Conserve le lien lexical entre le mal et le désir tout en produisant une formulation française naturelle.
- source_word: βουλεύεται / βουλευόμενοι
  choice: forme des projets / forment des projets
  rationale: Rend l’idée de délibération et d’intention intérieure, avec la répétition structurante du grec.
- source_word: κατορθοῦται
  choice: est affermie
  rationale: Exprime l’établissement ou la consolidation de la gloire sans surinterpréter le mécanisme.
- source_word: εὐκατάλλακτον
  choice: disposé à la réconciliation
  rationale: Préserve explicitement la notion de réconciliation et la disponibilité exprimée par le préfixe εὐ-, malgré une légère étrangeté voulue en français.
- source_word: τὸν αἰῶνα τοῦτον περιποιούμενοι
  choice: ceux qui cherchent à s’assurer le monde présent
  rationale: Rend l’effort pour acquérir ou conserver à son profit l’âge présent, sans réduire αἰών au seul temps chronologique.
- source_word: ἀντεχόμενοι
  choice: s’attachent à
  rationale: Traduit l’idée de tenir fermement à quelque chose ou d’y demeurer attaché.
theological_decisions:
- issue: Le statut moral du désir intérieur
  choice: Présenter la montée du mauvais désir dans le cœur comme un grand péché selon les paroles du personnage
  alternative: Atténuer en parlant seulement de tentation ou de pensée involontaire
  rationale: Le grec affirme explicitement ἁμαρτία… καὶ μεγάλη; la traduction ne doit pas résoudre la tension en distinguant ici tentation et consentement.
- issue: La faveur divine et la réconciliation
  choice: Conserver le langage de réconciliation avec le Seigneur
  alternative: Traduire simplement que le Seigneur lui est favorable
  rationale: Le terme εὐκατάλλακτον appartient au champ de la réconciliation; une paraphrase en simple faveur effacerait cette nuance théologique.
- issue: La gloire dans les cieux
  choice: Conserver le passif « est affermie »
  alternative: Faire de Dieu le sujet explicite qui affermit la gloire
  rationale: Le grec n’exprime pas l’agent; la formulation française maintient cette indétermination.
translation_notes:
  register: Français moderne, digne et accessible. Le discours conserve les répétitions du grec autour du désir, de la justice et des projets, ainsi que le présent narratif de « dit-elle ». Aucun marqueur de note n’est nécessaire.
