base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: fr
  text: '« Les âmes de ceux qui n’ont pas d’espérance, mais qui ont désespéré d’eux-mêmes et de leur vie, se repentiront. Quant à toi, prie Dieu : il guérira tes péchés, ceux de toute ta maisonnée et ceux de tous les saints. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσουσιν
  choice: se repentiront
  rationale: Le futur grec exprime ici un changement intérieur qui peut inclure le regret; « se repentiront » conserve sa portée morale dans ce contexte.
- source_word: ἀπηγνώκασι
  choice: ont désespéré
  rationale: Rend directement l’idée d’avoir perdu tout espoir concernant soi-même et sa propre vie.
- source_word: ἰάσεται
  choice: guérira
  rationale: Préserve la métaphore frappante de la guérison appliquée aux péchés, sans la réduire silencieusement à « pardonnera ».
- source_word: οἴκου
  choice: maison
  rationale: '« Maison » conserve l’étendue possible du grec : famille, maisonnée et personnes rattachées au foyer.'
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Traduction directe du terme grec désignant ici les membres consacrés du peuple de Dieu.
theological_decisions:
- issue: Guérison ou pardon des péchés
  choice: il guérira tes péchés
  alternative: il pardonnera tes péchés
  rationale: Le texte grec emploie explicitement le verbe « guérir ». La traduction maintient cette image théologique plutôt que de l’interpréter comme une simple formule de pardon.
- issue: Identité des « saints »
  choice: tous les saints
  alternative: tous ceux qui appartiennent à Dieu
  rationale: Le terme source reste collectif et non explicité; « saints » préserve cette formulation sans imposer une définition confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La structure légèrement marquée de « eux qui » reproduit l’apposition explicative du grec, tandis que « Quant à toi » souligne le contraste exprimé par ἀλλὰ σύ.
