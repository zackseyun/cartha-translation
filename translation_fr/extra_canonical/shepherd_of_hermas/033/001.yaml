base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/001.yaml
  text: He says, “I commanded you in the first commandment to keep faith and fear and self-control.” “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they are set over the righteous and the unrighteous. So you—trust the righteous, but do not trust the unrighteous; for righteousness has a straight path, but unrighteousness a crooked one. But you, walk on the straight [and level] path, and leave the crooked.
translation:
  language: fr
  text: 'Il dit : « Dans le premier commandement, je t’ai ordonné de garder la foi, la crainte et la maîtrise de soi. » Je réponds : « Oui, Seigneur. » Il reprend : « Mais maintenant, je veux aussi te faire connaître leurs capacités, afin que tu comprennes quelle capacité et quelle manière d’agir possède chacune d’elles. Car leurs manières d’agir sont doubles : elles se rapportent au juste et à l’injuste. Toi donc, fie-toi à ce qui est juste, mais ne te fie pas à ce qui est injuste. Car ce qui est juste a un chemin droit, tandis que ce qui est injuste en a un tortueux. Quant à toi, marche sur le chemin droit [et nivelé][a], et laisse le chemin tortueux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et nivelé » sont absents de certains témoins du texte.
    reason: Le groupe καὶ ὁμαλῇ est placé entre crochets dans le texte grec fourni, ce qui signale une incertitude textuelle à conserver dans la traduction.
lexical_decisions:
- source_word: πίστιν
  choice: la foi
  rationale: Rend directement le nom grec et conserve ici sa portée à la fois morale et religieuse.
- source_word: φόβον
  choice: la crainte
  rationale: Préserve le terme grec sans préciser son objet, que ce passage ne nomme pas.
- source_word: ἐγκράτειαν
  choice: la maîtrise de soi
  rationale: Expression française actuelle qui rend l’idée de retenue et de domination de ses désirs.
- source_word: δυνάμεις
  choice: forces
  rationale: Conserve la distinction avec ἐνέργεια, traduit par « action », plutôt que de fondre les deux termes en une seule notion.
- source_word: ἐνέργεια / ἐνέργειαι
  choice: action / actions
  rationale: Désigne la manière d’agir ou l’effet opérant de chacune des réalités mentionnées.
- source_word: τῷ δικαίῳ / τὸ δίκαιον
  choice: ce qui est juste
  rationale: Le neutre grec peut désigner le juste comme réalité ou principe; cette formulation évite de le transformer sans nécessité en personne.
- source_word: τῷ ἀδίκῳ / τὸ ἄδικον
  choice: ce qui est injuste
  rationale: Maintient le parallélisme neutre et l’opposition conceptuelle du grec.
- source_word: πιστεύω + datif
  choice: se fier à
  rationale: Dans l’exhortation, le sens est celui d’accorder sa confiance; « se fier à » est idiomatique et garde cette nuance.
- source_word: ὀρθὴν ὁδόν / στρεβλήν
  choice: chemin droit / chemin tortueux
  rationale: Préserve l’image morale contrastée des deux voies.
theological_decisions:
- issue: La nature personnelle ou abstraite du juste et de l’injuste
  choice: « ce qui est juste » et « ce qui est injuste »
  alternative: « le juste » et « l’injuste », compris comme des personnes
  rationale: Les formes grecques sont neutres et le contexte immédiat présente surtout deux orientations et deux chemins. La traduction conserve cette indétermination sans imposer une personnification.
- issue: Objet de la crainte
  choice: Ne pas ajouter « de Dieu »
  alternative: « la crainte de Dieu »
  rationale: Même si le contexte religieux peut le suggérer, l’objet n’est pas exprimé dans cette phrase; l’ajouter résoudrait une donnée laissée implicite par le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue est rendu naturellement, tout en conservant les répétitions structurantes, les oppositions et la métaphore des deux chemins.
