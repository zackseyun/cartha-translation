revisions:
- from: 'Il dit : « Dans le premier commandement, je t’ai ordonné de garder la foi, la crainte et la maîtrise de soi. » Je réponds : « Oui, Seigneur. » Il reprend : « Mais maintenant, je veux aussi te faire connaître leurs forces, afin que tu comprennes quelle force et quelle action chacune d’elles possède. En effet, leurs actions sont doubles : elles concernent donc ce qui est juste et ce qui est injuste. Toi donc, fie-toi à ce qui est juste, mais ne te fie pas à ce qui est injuste. Car ce qui est juste suit un chemin droit, tandis que ce qui est injuste suit un chemin tortueux. Quant à toi, avance sur le chemin droit [et uni][a], et délaisse le chemin tortueux. »'
  to: 'Il dit : « Dans le premier commandement, je t’ai ordonné de garder la foi, la crainte et la maîtrise de soi. » Je réponds : « Oui, Seigneur. » Il reprend : « Mais maintenant, je veux aussi te faire connaître leurs capacités, afin que tu comprennes quelle capacité et quelle manière d’agir possède chacune d’elles. Car leurs manières d’agir sont doubles : elles se rapportent au juste et à l’injuste. Toi donc, fie-toi à ce qui est juste, mais ne te fie pas à ce qui est injuste. Car ce qui est juste a un chemin droit, tandis que ce qui est injuste en a un tortueux. Quant à toi, marche sur le chemin droit [et nivelé][a], et laisse le chemin tortueux. »'
  rationale: La révision corrige le sens de ὁμαλῇ et améliore légèrement la lisibilité, tout en préservant les oppositions, l’ambiguïté abstraite du juste et de l’injuste, ainsi que l’incertitude textuelle signalée par les crochets.
