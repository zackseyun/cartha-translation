  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/002.yaml
  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: fr
  text: Car le chemin tortueux n’a pas de sentiers, mais des lieux sans chemin et de nombreux obstacles ; il est accidenté et couvert d’épines. Il est donc dangereux. Écoute maintenant quelles sont les œuvres de l’autre voie. Tout d’abord, si un accès de colère ou de l’amertume s’empare de toi, sache que l’ange du mal est en toi. Viennent ensuite le désir de multiplier les activités, le luxe de nombreux aliments et boissons, de nombreuses beuveries, toutes sortes de luxes et de choses inconvenantes, le désir des femmes, l’avidité, l’orgueil, la prétention, et tout ce qui leur est apparenté ou semblable. Ainsi, lorsque ces choses montent dans ton cœur, sache que l’ange du mal est avec toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεβλὴ ὁδός
  choice: le chemin tortueux
  rationale: Rend l’image morale du chemin dévié tout en conservant la métaphore concrète.
- source_word: ἀνοδίας
  choice: des passages impraticables
  rationale: Le terme désigne des lieux sans route ou sans passage praticable ; cette formulation est naturelle en français et maintient le contraste avec les sentiers.
- source_word: προσκόμματα
  choice: des obstacles
  rationale: Conserve l’idée de ce qui fait trébucher sans surcharger la phrase.
- source_word: ὀξυχολία
  choice: un accès de colère
  rationale: Exprime une colère prompte et soudaine plutôt qu’un trait de caractère permanent.
- source_word: πικρία
  choice: de l’amertume
  rationale: Équivalent direct qui garde la portée intérieure et morale du terme.
- source_word: πολυτέλεια
  choice: les excès
  rationale: Dans le contexte des aliments et boissons, le mot évoque la prodigalité ou le luxe excessif ; « excès » est clair sans réduire le sens à la seule quantité.
- source_word: κραιπαλῶν
  choice: les beuveries
  rationale: Rend concrètement les excès liés à l’ivresse et à la débauche festive.
- source_word: ποικίλων τρυφῶν
  choice: toutes sortes de plaisirs raffinés
  rationale: Préserve à la fois la variété et la nuance de luxe complaisant portée par τρυφή.
- source_word: πλεονεξία
  choice: l’avidité
  rationale: Terme assez large pour couvrir le désir insatiable d’avoir davantage, sans le limiter strictement à l’argent.
- source_word: ἀλαζονεία
  choice: la prétention
  rationale: Distingue ce vice de ὑπερηφανία, rendu par « orgueil », et évoque l’attitude fanfaronne ou présomptueuse.
- source_word: ἄγγελος τῆς πονηρίας
  choice: l’ange du mal
  rationale: Formulation française naturelle qui conserve la personnification spirituelle sans préciser davantage la nature du mal.
theological_decisions:
- issue: Référent implicite de « il est en toi »
  choice: « l’ange du mal est en toi »
  alternative: « le mal est en toi » ou « il agit en toi »
  rationale: Le contexte immédiat identifie l’agent comme l’ange du mal ; la formulation conserve l’affirmation forte du texte sans la réinterpréter comme simple influence psychologique.
- issue: Rapport entre dispositions intérieures et présence angélique
  choice: Conserver « est en toi » puis « est avec toi »
  alternative: Harmoniser les deux expressions en « agit en toi »
  rationale: La variation du texte est théologiquement suggestive et ne doit pas être nivelée ni expliquée au-delà de ce qu’il affirme.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe demeure imagée et exhortative. Les listes ont été légèrement ordonnées par la ponctuation pour rester lisibles, sans atténuer leur accumulation rhétorique.
