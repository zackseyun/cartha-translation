revisions:
- from: Car le chemin tortueux n’a pas de sentiers, mais seulement des passages impraticables et de nombreux obstacles ; il est accidenté et couvert d’épines. Il est donc dangereux. Écoute maintenant quelles sont les œuvres de l’autre voie. Tout d’abord, si un accès de colère ou de l’amertume s’empare de toi, sache que l’ange du mal est en toi. Viennent ensuite le désir de multiplier les activités, les excès de nourriture et de boisson, les beuveries répétées, toutes sortes de plaisirs raffinés et inconvenants, le désir des femmes, l’avidité, l’orgueil, la prétention, et tout ce qui leur est apparenté ou semblable. Ainsi, lorsque ces choses montent dans ton cœur, sache que l’ange du mal est avec toi.
