  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/003.yaml
  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s servants. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: fr
  text: 'Ainsi donc, lorsque tu reconnais ses œuvres, éloigne-toi de lui et ne lui fais nullement confiance, car ses œuvres sont mauvaises et nuisibles aux serviteurs de Dieu. Tu as donc les actions des deux anges : comprends-les et fais confiance à l’ange de la justice. Mais éloigne-toi de l’ange du mal, car son enseignement est mauvais en toute œuvre. En effet, si quelqu’un est un homme fidèle et que la pensée de cet ange monte dans son cœur, cet homme, ou cette femme, doit commettre quelque péché. Mais si, à son tour, un homme ou une femme est très mauvais et que les œuvres de l’ange de la justice montent dans son cœur, cette personne doit nécessairement faire quelque chose de bon.


    « Tu vois donc, dit-il, qu’il est bon de suivre l’ange de la justice et de renoncer à l’ange du mal. Quant à la foi, ce commandement montre qu’il faut faire confiance aux œuvres de l’ange de la justice et que, en les accomplissant, tu vivras pour Dieu. Mais crois que les œuvres de l’ange du mal sont pénibles ; en ne les accomplissant pas, tu vivras pour Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέργειαι
  choice: action
  rationale: Le terme désigne ici la manière d’agir ou l’influence effective de chacun des deux anges. « Action » est naturel en français et évite le sens moderne trop technique d’« activités ».
- source_word: πίστευε
  choice: fais confiance / mets ta confiance
  rationale: Dans ce contexte d’obéissance à l’une de deux influences opposées, le verbe exprime la confiance accordée plutôt qu’une simple adhésion intellectuelle.
- source_word: ἄγγελος τῆς πονηρίας
  choice: ange du mal
  rationale: Cette formulation française claire conserve le contraste avec « l’ange de la justice » sans imposer l’identification à une figure particulière.
- source_word: ἐνθύμησις
  choice: pensée inspirée par cet ange
  rationale: Le mot désigne la pensée ou suggestion intérieure attribuée à l’ange. L’explicitation évite de laisser croire qu’il s’agit de la propre pensée de l’ange montant dans le cœur.
- source_word: ζήσῃ τῷ Θεῷ
  choice: tu vivras pour Dieu
  rationale: Cette tournure conserve le datif relationnel et sa portée spirituelle sans le réduire à « rester en vie ».
- source_word: χαλεπά
  choice: funestes
  rationale: Dans ce contexte moral, le terme qualifie des œuvres pénibles, mauvaises et dommageables. « Funestes » rend leur caractère nocif avec dignité.
theological_decisions:
- issue: Nécessité de pécher ou de faire le bien sous l’influence de l’un des anges
  choice: Conserver « il faut » et « il faut nécessairement »
  alternative: Atténuer en « risque de » ou « sera porté à »
  rationale: Le grec emploie δεῖ et, dans le second cas, ἐξ ἀνάγκης δεῖ. La traduction garde cette affirmation forte et sa tension théologique sans la transformer en déterminisme doctrinal explicite ni l’affaiblir.
- issue: Nature des deux anges
  choice: Maintenir leur désignation comme « ange de la justice » et « ange du mal »
  alternative: Les interpréter comme de simples dispositions psychologiques ou les identifier à des êtres nommés
  rationale: Le texte les présente comme des anges, mais ne fournit ici ni nom propre ni développement ontologique. La traduction ne tranche donc pas au-delà du texte.
- issue: Rapport entre foi, œuvres et vie pour Dieu
  choice: Préserver l’enchaînement confiance, accomplissement des œuvres et vie pour Dieu
  alternative: Reformuler selon un système doctrinal particulier de salut
  rationale: Le passage lie directement ces éléments. La traduction conserve ce lien sans préciser une théorie de la justification ou du mérite absente du texte.
translation_notes:
  register: Français international moderne, courant mais digne. Le tutoiement est maintenu parce qu’un interlocuteur unique est directement enseigné. Les répétitions structurantes (« ange de la justice », « ange du mal », « tu vivras pour Dieu ») sont conservées, tandis que certaines constructions grecques ont été légèrement explicitées pour rester immédiatement compréhensibles.
