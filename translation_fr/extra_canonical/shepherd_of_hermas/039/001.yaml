base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: fr
  text: Revêts-toi donc de joie, qui a toujours la faveur de Dieu et lui est agréable, et fais-en tes délices. Car toute personne joyeuse fait le bien, a de bonnes pensées et méprise la tristesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱλαρότητα / ἱλαρός
  choice: joie / joyeuse
  rationale: Dans ce contexte, le terme désigne une disposition intérieure gaie et confiante. « Joie » est plus naturel en français moderne que « allégresse » ou « gaieté », tout en conservant la portée morale du grec.
- source_word: ἔχουσαν χάριν παρὰ τῷ θεῷ
  choice: jouit toujours de la faveur de Dieu
  rationale: Rend l’expression idiomatiquement sans réduire χάρις à la seule « grâce » au sens doctrinal; la joie est présentée comme bénéficiant de la faveur divine.
- source_word: ἐντρύφα ἐν αὐτῇ
  choice: trouve en elle ton bonheur
  rationale: ἐντρυφάω exprime le fait de prendre plaisir, de se délecter. Cette formulation reste digne et naturelle sans la connotation excessive que pourrait avoir « délecte-toi ».
- source_word: ἀγαθὰ φρονεῖ
  choice: nourrit de bonnes pensées
  rationale: Le verbe φρονέω concerne la pensée et la disposition intérieure; « nourrit de bonnes pensées » exprime naturellement cette activité durable.
- source_word: καταφρονεῖ τῆς λύπης
  choice: méprise la tristesse
  rationale: Traduction directe de καταφρονέω, qui signifie regarder de haut ou tenir pour peu de chose; le contraste volontairement fort du texte est conservé.
theological_decisions:
- issue: Personnification possible de la joie
  choice: « elle qui jouit… »
  alternative: « qui jouit… » sans pronom explicite
  rationale: Le participe féminin grec renvoie à ἱλαρότητα et donne presque à la joie les traits d’un vêtement ou d’une disposition personnifiée. Le pronom conserve cet effet sans l’accentuer outre mesure.
- issue: Sens de χάρις auprès de Dieu
  choice: « faveur de Dieu »
  alternative: « grâce auprès de Dieu »
  rationale: La construction ἔχειν χάριν παρά signifie ici être en faveur auprès de quelqu’un. « Faveur » évite d’imposer une lecture technique de la grâce tout en maintenant la relation à Dieu.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif imagé « Revêts-toi » conserve la métaphore du vêtement. « Toute personne » évite le masculin générique marqué de « tout homme » sans modifier la portée universelle de πᾶς… ἀνήρ.
