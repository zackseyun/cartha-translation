base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: fr
  text: 'Mais l’homme triste fait toujours le mal : d’abord, il fait le mal parce qu’il attriste l’Esprit saint, qui a été donné à l’être humain et qui est joyeux ; ensuite, en attristant l’Esprit saint, il commet ce qui est sans loi, sans adresser au Seigneur ni prière ni confession. Car la prière d’un homme triste n’a jamais la force de monter jusqu’à l’autel de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπηρὸς ἀνήρ
  choice: l’homme accablé de tristesse
  rationale: Exprime ici non une tristesse passagère, mais une personne dominée par elle, tout en évitant de qualifier moralement toute personne triste.
- source_word: πονηρεύεται
  choice: agit mal
  rationale: Rend le comportement mauvais indiqué par le verbe sans recourir au français moins naturel « agit méchamment ».
- source_word: ἱλαρόν
  choice: plein de joie
  rationale: L’adjectif qualifie grammaticalement l’Esprit donné; cette formulation conserve ce lien plutôt que de faire de la joie une qualité de l’être humain.
- source_word: ἀνομίαν ἐργάζεται
  choice: commet l’injustice
  rationale: Conserve la portée morale et religieuse d’ἀνομία sans imposer le calque peu idiomatique « pratique l’illégalité ».
- source_word: ἐντυγχάνων
  choice: prie
  rationale: Dans ce contexte cultuel, le terme désigne l’adresse ou la supplication faite au Seigneur.
- source_word: ἐξομολογούμενος
  choice: confesse ses fautes
  rationale: Le contexte associe la confession au Seigneur; l’ajout explicatif « ses fautes » donne en français le sens le plus vraisemblable, tout en reconnaissant l’ambiguïté lexicale dans la note de décision théologique.
- source_word: ἔντευξις
  choice: prière
  rationale: « Prière » est naturel et cohérent avec l’image de son ascension vers l’autel divin.
theological_decisions:
- issue: Référent et portée de τὸ δοθὲν τῷ ἀνθρώπῳ ἱλαρόν
  choice: « l’Esprit saint, qui a été donné à l’être humain plein de joie »
  alternative: « l’Esprit saint qui a été donné à l’être humain pour qu’il soit joyeux »
  rationale: L’accusatif neutre ἱλαρόν s’accorde directement avec πνεῦμα; la traduction maintient donc la joie comme qualité de l’Esprit, sans transformer explicitement l’expression en finalité pour l’être humain.
- issue: Sens de ἐξομολογούμενος τῷ κυρίῳ
  choice: « ne lui confesse pas ses fautes »
  alternative: « ne rend pas grâce au Seigneur » ou « ne fait pas profession devant le Seigneur »
  rationale: ἐξομολογέομαι peut désigner la confession ou la louange reconnaissante. Dans la séquence « prier et confesser au Seigneur » et dans le cadre de l’ἀνομία, la confession des fautes paraît la plus probable, sans certitude absolue.
- issue: Affirmation sur la prière de l’homme triste
  choice: Conserver l’énoncé absolu « n’a jamais la force »
  alternative: Atténuer en « parvient difficilement »
  rationale: Le grec πάντοτε…οὐκ ἔχει δύναμιν formule une affirmation catégorique; elle ne doit pas être adoucie, malgré sa tension pastorale et théologique.
translation_notes:
  register: Français moderne, clair et digne. La répétition « agit mal » est conservée pour refléter l’insistance du grec. « Accablé de tristesse » distingue l’état durable et envahissant visé dans le passage d’une tristesse humaine ordinaire.
