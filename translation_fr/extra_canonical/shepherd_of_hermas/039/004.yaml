review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : καθάρισον... σεαυτόν est bien rendu par « Purifie-toi », λύπη par « tristesse », et la double conclusion sur le fait de vivre pour Dieu est conservée. Toutefois, « joie entière » affaiblit la portée idiomatique de πᾶσαν ἱλαρότητα, qui désigne toute forme/plénitude de joie ou de bonne humeur, et ne correspond pas naturellement à une joie « entière » en français.'
  naturalness: Le texte est clair et de registre convenable. « Une joie entière » est toutefois peu idiomatique en français moderne dans ce contexte. « Toute joie » conserve mieux la formulation et sonne plus naturellement. La reprise « eux aussi » est acceptable, mais elle est inutile puisque « Tous ceux qui » établit déjà le lien.
  terminology: « Mauvaise tristesse » rend littéralement τῆς λύπης τῆς πονηρᾶς et convient au contexte moral. « Se revêtiront » préserve correctement la métaphore de ἐνδύσωνται. « Vivront pour Dieu » maintient l'ambiguïté concise du datif τῷ θεῷ sans imposer une interprétation doctrinale.
  issues:
  - severity: low
    issue: « d’une joie entière » pour πᾶσαν ἱλαρότητα
    rationale: πᾶσαν porte sur ἱλαρότητα et s'exprime plus directement par « toute joie ». « Entière » suggère plutôt une joie non partagée ou complète, nuance qui n'est pas explicitement portée par le grec.
  - severity: low
    issue: Ajout stylistique de « eux aussi »
    rationale: 'Ce n''est pas une erreur de sens, mais l''ajout n''est pas nécessaire et la conclusion grecque est plus sobre : « tous vivront pour Dieu, tous ceux qui... ».'
  revised_text: Purifie-toi donc de cette mauvaise tristesse, et tu vivras pour Dieu. Tous vivront pour Dieu, tous ceux qui rejetteront loin d’eux la tristesse et se revêtiront de toute joie.
