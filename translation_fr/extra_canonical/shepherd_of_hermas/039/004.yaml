  rationale: Révision limitée à l'expression de πᾶσαν ἱλαρότητα, rendue par « toute joie », et à une formulation collective plus proche de πάντες ... ὅσοι ἄν. Le vocabulaire moral, l'image du revêtement et l'ambiguïté de ζήσῃ/ζήσονται τῷ θεῷ sont préservés.
