base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/004.yaml
  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: fr
  text: Purifie-toi donc de cette mauvaise tristesse, et tu vivras pour Dieu. Tous vivront pour Dieu, tous ceux qui rejetteront loin d’eux la tristesse et se revêtiront de toute joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάρισον ... σεαυτόν
  choice: Purifie-toi
  rationale: Rend directement l’impératif réflexif et conserve l’image d’une purification morale.
- source_word: λύπη
  choice: tristesse
  rationale: Dans ce passage, le terme désigne une tristesse intérieure considérée comme nuisible; « tristesse » reste naturel tout en préservant la répétition du grec.
- source_word: ζήσῃ τῷ θεῷ
  choice: tu vivras pour Dieu
  rationale: Conserve le datif grec dans son sens relationnel ou orienté vers Dieu, sans expliciter davantage une formule théologique volontairement concise.
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  choice: se débarrasseront de
  rationale: Expression française naturelle qui maintient l’idée de rejeter loin de soi.
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  choice: se revêtiront d’une joie entière
  rationale: Préserve la métaphore vestimentaire de ἐνδύω; « joie » rend ici ἱλαρότης comme disposition joyeuse, et « entière » reflète πᾶσαν sans suggérer une simple quantité.
theological_decisions:
- issue: Sens de « vivre pour Dieu »
  choice: Maintenir la formule « vivre pour Dieu »
  alternative: « vivre en Dieu » ou « être vivant aux yeux de Dieu »
  rationale: Le datif τῷ θεῷ admet une nuance relationnelle qui ne doit pas être réduite à une seule interprétation théologique.
- issue: Portée de πάντες ... ὅσοι ἄν
  choice: « Tous ceux qui… »
  alternative: « tous vivront pour Dieu, autant qu’ils seront à… »
  rationale: Le tour grec définit l’ensemble par une proposition relative générale; la formulation choisie est claire sans transformer l’énoncé en affirmation universelle sans condition.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « tristesse » ainsi que les images de purification, de rejet et de vêtement sont conservées. « Eux aussi » marque naturellement la transition du singulier au collectif sans ajouter de contenu doctrinal.
