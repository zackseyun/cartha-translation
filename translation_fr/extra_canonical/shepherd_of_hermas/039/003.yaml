revisions:
- from: « Pourquoi, demandai-je, la prière de celui qui est dans la tristesse ne monte-t-elle pas jusqu’à l’autel ? — Parce que, répondit-il, la tristesse s’est installée dans son cœur. Mêlée à la prière, elle empêche donc celle-ci de monter pure jusqu’à l’autel. En effet, de même que le vinaigre et le vin, une fois mélangés, n’ont plus la même saveur agréable, de même la tristesse, mêlée à l’Esprit saint, fait que la prière n’est plus la même.[a] »
  to: « Pourquoi, demandai-je, la prière de celui qui est triste ne monte-t-elle pas jusqu’à l’autel ? — Parce que, répondit-il, la tristesse s’est installée dans son cœur. Ainsi, mêlée à la prière, la tristesse ne permet pas à la prière de monter pure jusqu’à l’autel. Car, de même que le vinaigre et le vin, mélangés ensemble, n’ont pas la même saveur agréable, de même la tristesse, mêlée à l’Esprit Saint, n’a pas la même prière.[a] »
  rationale: La révision supprime l'ajout temporel dans l'image du vin et du vinaigre, conserve les répétitions significatives de « tristesse » et de « prière », et rapproche la dernière proposition de la syntaxe volontairement difficile du grec. La note maintient une lecture intelligible sans transformer une possibilité interprétative en affirmation du texte.
