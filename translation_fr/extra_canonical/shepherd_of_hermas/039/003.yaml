base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/003.yaml
  text: “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasantness, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”
translation:
  language: fr
  text: « Pourquoi, demandai-je, la prière de celui qui est triste ne monte-t-elle pas jusqu’à l’autel ? — Parce que, répondit-il, la tristesse s’est installée dans son cœur. Ainsi, mêlée à la prière, la tristesse ne permet pas à la prière de monter pure jusqu’à l’autel. Car, de même que le vinaigre et le vin, mélangés ensemble, n’ont pas la même saveur agréable, de même la tristesse, mêlée à l’Esprit Saint, n’a pas la même prière.[a] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « la tristesse mêlée à l’Esprit Saint n’a pas la même prière ». La tournure est abrupte; elle peut désigner une prière qui n’est plus la même par sa qualité ou son efficacité, sans préciser davantage le rapport entre la tristesse, l’Esprit Saint et la prière.'
    reason: Préserver l’ambiguïté syntaxique et l'absence d'explication théologique explicite dans le grec.
lexical_decisions:
- source_word: ἔντευξις
  choice: prière
  rationale: Dans ce contexte cultuel, le mot désigne une supplication ou une prière adressée à Dieu. « Prière » est naturel et conserve la portée générale du terme.
- source_word: λύπη / λυπουμένου
  choice: tristesse / celui qui est dans la tristesse
  rationale: Le terme exprime ici un état intérieur affligeant. « Tristesse » garde la cohérence avec le reste du Mandement sans ajouter l’idée plus clinique de dépression.
- source_word: ἐγκάθηται
  choice: s’est installée
  rationale: Le verbe évoque quelque chose qui siège ou demeure au-dedans; cette tournure française rend clairement l’enracinement de la tristesse dans le cœur.
- source_word: θυσιαστήριον
  choice: autel
  rationale: Équivalent cultuel direct et idiomatique du grec.
- source_word: ἡδονή
  choice: saveur agréable
  rationale: Dans la comparaison du vin et du vinaigre, le sens concret est l’agrément gustatif plutôt qu’un plaisir abstrait.
theological_decisions:
- issue: Rapport entre la tristesse, l’Esprit saint et la prière
  choice: « la tristesse, mêlée à l’Esprit saint, fait que la prière n’est plus la même »
  alternative: « la tristesse mêlée à l’Esprit saint n’a pas la même prière »
  rationale: La syntaxe grecque finale est abrupte et peut se comprendre de plusieurs manières. Le texte principal reste proche de sa logique tout en étant intelligible en français, et une note signale l’ambiguïté sans imposer une explication doctrinale.
translation_notes:
  register: Français moderne, international et digne. Le dialogue est ponctué naturellement; les répétitions structurantes de « tristesse », « prière », « monter » et « autel » sont conservées.
