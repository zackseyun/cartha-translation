  to: Il prit donc le Fils et les anges glorieux comme conseillers, afin que cette chair aussi, qui avait servi l’Esprit Saint de manière irréprochable, obtienne un lieu où demeurer et ne paraisse pas avoir perdu la récompense de son service. Car toute chair trouvée sans souillure et sans tache, dans laquelle l’Esprit Saint a demeuré, recevra une récompense. Tu as maintenant aussi l’explication de cette parabole. »
