base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: fr
  text: Il prit donc le Fils et les anges glorieux comme conseillers, afin que cette chair aussi, qui avait servi l’Esprit Saint de manière irréprochable, obtienne un lieu où demeurer et ne paraisse pas avoir perdu la récompense de son service. Car toute chair trouvée sans souillure et sans tache, dans laquelle l’Esprit Saint a demeuré, recevra une récompense. Tu as maintenant aussi l’explication de cette parabole. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμβουλον ... ἔλαβε
  choice: prit conseil auprès de
  rationale: Rend naturellement en français l’idée de prendre quelqu’un comme conseiller, sans suggérer que le Fils serait lui-même l’objet d’une décision.
- source_word: τόπον τινὰ κατασκηνώσεως
  choice: un lieu où demeurer
  rationale: Exprime l’idée d’un lieu de séjour ou d’habitation sans surcharger le texte avec l’image littérale du campement.
- source_word: δουλεία
  choice: service
  rationale: Dans ce contexte, désigne le fait de servir l’Esprit; «service» est digne et naturel, tout en gardant le rapport avec le verbe précédent.
- source_word: ἀμίαντος καὶ ἄσπιλος
  choice: sans souillure et sans tache
  rationale: Conserve les deux qualificatifs grecs et leur distinction rhétorique.
- source_word: ἐπίλυσις
  choice: explication
  rationale: Terme français courant et exact pour l’interprétation explicitée d’une parabole.
theological_decisions:
- issue: Rapport entre Dieu, le Fils et les anges dans la consultation
  choice: «Il prit donc conseil auprès du Fils et des anges glorieux»
  alternative: «Il prit donc le Fils et les anges glorieux comme conseillers»
  rationale: La formulation retenue garde la consultation présentée par le grec tout en évitant une tournure française pesante; elle ne cherche pas à harmoniser la christologie particulière de ce passage avec des formulations doctrinales ultérieures.
- issue: Récompense accordée à la chair habitée par l’Esprit saint
  choice: Conserver littéralement l’affirmation universelle du passage
  alternative: Interpréter «chair» comme une référence exclusive au Christ ou au croyant
  rationale: Le grec dit «toute chair» et préserve une tension interprétative qu’il ne convient pas de résoudre dans le corps de la traduction.
translation_notes:
  register: Français moderne, international et digne. La traduction conserve la répétition de «chair», «Esprit» et «récompense», structurante dans l’argument, et emploie le tutoiement conformément à l’adresse grecque singulière.
