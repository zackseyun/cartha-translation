base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/002.yaml
  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the servant—listen.
translation:
  language: fr
  text: Ainsi, après avoir purifié les péchés du peuple, il lui montra les sentiers de la vie et lui donna la Loi qu’il avait reçue de son Père. « Tu vois, dit-il, qu’il est lui-même le Seigneur du peuple, puisqu’il a reçu toute autorité de son Père. Quant au fait que le Seigneur a pris son Fils et les anges glorieux comme conseillers au sujet de l’héritage du serviteur, écoute. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρίσας
  choice: après avoir purifié
  rationale: Rend le sens direct de purification sans préciser davantage le mécanisme par lequel les péchés sont ôtés.
- source_word: τὰς τρίβους τῆς ζωῆς
  choice: les sentiers de la vie
  rationale: Conserve l’image concrète des chemins tout en employant une expression française naturelle et digne.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: La majuscule signale ici la loi reçue du Père comme enseignement divin déterminé, sans l’identifier plus précisément à un corpus particulier.
- source_word: ἐξουσίαν πᾶσαν
  choice: toute autorité
  rationale: « Autorité » exprime ici le pouvoir légitime reçu du Père plus exactement que la seule capacité d’agir.
- source_word: σύμβουλον ἔλαβε
  choice: a pris … comme conseillers
  rationale: Suit la construction grecque et préserve l’image d’une délibération concernant l’héritage.
- source_word: κληρονομίας τοῦ δούλου
  choice: l’héritage du serviteur
  rationale: Maintient le génitif grec, qui peut concerner l’héritage destiné au serviteur ou lié à lui, sans explicitation doctrinale.
theological_decisions:
- issue: Rapport d’autorité entre le Seigneur et son Père
  choice: « puisqu’il a reçu toute autorité de son Père »
  alternative: « après avoir reçu tout pouvoir de son Père »
  rationale: La formulation conserve explicitement l’autorité reçue et donc la tension relationnelle du texte, sans l’expliquer ni l’atténuer.
- issue: Identification du Fils et du Seigneur
  choice: Majuscules à « Seigneur », « Fils » et « Père »
  alternative: Minuscules uniformes
  rationale: Le contexte désigne des figures personnelles divines; les majuscules facilitent le repérage en français sans ajouter d’identification doctrinale absente du passage.
translation_notes:
  register: Français international moderne, fluide et digne. Le discours direct et l’enchaînement argumentatif sont conservés; « au sujet de l’héritage du serviteur » maintient l’ambiguïté du génitif grec.
