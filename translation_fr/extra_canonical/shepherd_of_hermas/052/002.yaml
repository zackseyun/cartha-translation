  to: Ainsi, après avoir purifié les péchés du peuple, il lui montra les sentiers de la vie et lui donna la Loi qu’il avait reçue de son Père. « Tu vois, dit-il, qu’il est lui-même le Seigneur du peuple, puisqu’il a reçu toute autorité de son Père. Quant au fait que le Seigneur a pris son Fils et les anges glorieux comme conseillers au sujet de l’héritage du serviteur, écoute. »
  rationale: La révision se limite à remplacer « écoute pourquoi » par une formulation française qui conserve la valeur déclarative et prospective de ὅτι … ἄκουε, sans créer une question causale. Aucun autre changement n’est nécessaire.
