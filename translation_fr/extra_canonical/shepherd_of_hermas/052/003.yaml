base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/003.yaml
  text: The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.
translation:
  language: fr
  text: Le Saint-Esprit, qui préexistait et qui avait créé toute créature, Dieu l’établit dans une chair qu’il voulut. Cette chair, dans laquelle le Saint-Esprit habite, servit donc bien l’Esprit, se conduisant avec dignité et pureté, sans aucunement souiller l’Esprit. Ainsi donc, après s’être bien et purement conduite, avoir peiné avec l’Esprit et coopéré avec lui en toute chose, et s’être comportée avec force et courage, Dieu la choisit pour être associée au Saint-Esprit. Car la conduite de cette chair avait plu au Seigneur[a], parce qu’elle ne s’était pas souillée sur la terre tout en ayant le Saint-Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « au Seigneur » sont textuellement incertains et figurent entre crochets dans l’édition grecque source.
    reason: Signaler l’incertitude éditoriale relative à τῷ Κυρίῳ sans supprimer la lecture imprimée.
lexical_decisions:
- source_word: τὸ προόν
  choice: qui existait auparavant
  rationale: Rend l’antériorité exprimée par le participe sans imposer un vocabulaire théologique technique absent du grec.
- source_word: εἰς σάρκα ἣν ἠβούλετο
  choice: dans la chair qu’il avait voulue
  rationale: Conserve la formulation inhabituelle et l’ambiguïté du grec au lieu de préciser « choisie » ou d’identifier davantage cette chair.
- source_word: ἐν σεμνότητι καὶ ἁγνείᾳ πορευθεῖσα
  choice: elle se conduisit avec dignité et pureté
  rationale: « Se conduire » exprime naturellement en français la métaphore biblique de la marche appliquée au comportement.
- source_word: συγκοπιάσασαν … καὶ συνεργήσασαν
  choice: avait peiné avec l’Esprit et collaboré avec lui
  rationale: Préserve les deux idées distinctes d’effort partagé et de coopération.
- source_word: κοινωνόν
  choice: pour être associée
  rationale: Exprime la participation ou l’association sans suggérer une égalité ontologique que le terme n’explicite pas.
- source_word: ἰσχυρῶς καὶ ἀνδρείως ἀναστραφεῖσαν
  choice: menant une vie ferme et courageuse
  rationale: Rend l’idée d’une conduite vigoureuse et vaillante dans un français actuel et digne.
theological_decisions:
- issue: Rapport entre le Saint-Esprit et la chair
  choice: Conserver les affirmations selon lesquelles l’Esprit habite la chair, celle-ci le sert et Dieu l’associe à lui
  alternative: Identifier explicitement la chair à Jésus ou harmoniser le passage avec une christologie ultérieure
  rationale: Le texte présente une formulation théologiquement tendue et inhabituelle; la traduction ne doit ni l’effacer ni fournir une identification que ce segment ne formule pas.
- issue: Référent du sujet de εἵλατο
  choice: Expliciter « Dieu la choisit »
  alternative: Employer le pronom « il »
  rationale: Dieu est le sujet directeur du passage et cette explicitation évite en français une confusion immédiate avec l’Esprit, sans modifier la logique grecque.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions de « chair » et « Esprit » sont maintenues parce qu’elles structurent l’argument. Les temps narratifs et explicatifs sont rendus de façon fluide sans atténuer l’étrangeté conceptuelle du passage.
