revisions:
- from: 'Il dit : « Je te l’ai dit à l’instant : tu es rusé et présomptueux, toi qui demandes l’explication des paraboles. Mais puisque tu insistes tant, je t’expliquerai la parabole du champ et des autres éléments qui l’accompagnent.[a] Il les confia aux anges pour qu’ils les gardent ; et lui-même purifia leurs péchés, après avoir beaucoup travaillé et enduré bien des peines — car personne ne peut bêcher sans peine ni dur labeur. »'
  to: 'Il dit : « Je te l’ai dit à l’instant : tu es rusé et entêté, toi qui demandes l’explication des paraboles. Mais puisque tu t’obstines ainsi, je t’expliquerai la parabole du champ et tout ce qui s’y rattache.[a] Il les confia aux anges pour qu’ils les gardent ; et lui-même effaça leurs péchés, après avoir beaucoup travaillé et enduré bien des peines — car personne ne peut bêcher sans peine ni labeur. »'
  rationale: 'Révision limitée à deux améliorations sûres : une restitution française moins ambiguë de la portion grecque tronquée, et une formulation idiomatique de l’effacement des péchés. Les pronoms de la phrase qui suit sont conservés sans identification, car le texte fourni a perdu les éléments nécessaires à leur détermination.'
