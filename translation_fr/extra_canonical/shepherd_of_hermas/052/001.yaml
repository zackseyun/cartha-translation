base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/001.yaml
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: fr
  text: 'Il dit : « Je te l’ai dit à l’instant : tu es rusé et entêté, toi qui demandes l’explication des paraboles. Mais puisque tu t’obstines ainsi, je t’expliquerai la parabole du champ et tout ce qui s’y rattache.[a] Il les confia aux anges pour qu’ils les gardent ; et lui-même effaça leurs péchés, après avoir beaucoup travaillé et enduré bien des peines — car personne ne peut bêcher sans peine ni labeur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni est interrompu après le début d’un mot (ἀκο-) et reprend seulement au milieu de la phrase suivante. « Tout ce qui s’y rattache » est une restitution prudente du sens probable ; la transition vers « Il les confia… » demeure lacunaire.
    reason: Signaler la lacune matérielle de la source et le caractère conjectural de la restitution, sans identifier les référents omis.
lexical_decisions:
- source_word: πανοῦργος
  choice: rusé
  rationale: Le terme désigne ici une habileté quelque peu importune ou retorse; « rusé » conserve cette nuance réprobatrice sans exagération.
- source_word: αὐθάδης
  choice: présomptueux
  rationale: Le mot évoque quelqu’un qui agit selon sa propre volonté avec une assurance déplacée; « présomptueux » convient mieux ici que le simple « obstiné ».
- source_word: παράμονος
  choice: tu insistes tant
  rationale: Cette tournure naturelle rend la persistance tenace d’Hermas tout en la distinguant de αὐθάδης.
- source_word: ἐπιλύσεις / ἐπιλύσω
  choice: explication / je t’expliquerai
  rationale: Dans le contexte des paraboles, il s’agit d’en dévoiler le sens, non d’une simple traduction ni d’une solution abstraite.
- source_word: συντηρεῖν
  choice: garder
  rationale: Le verbe exprime l’action de conserver et de protéger; « garder » reste clair et laisse ouvertes ces deux nuances.
- source_word: σκαφεῦσαι
  choice: bêcher
  rationale: Le verbe renvoie au travail concret du sol et reprend l’image agricole de la parabole.
- source_word: κόπου / μόχθου
  choice: peine / dur labeur
  rationale: Deux expressions distinctes maintiennent le redoublement grec sans produire une répétition française trop plate.
theological_decisions:
- issue: Référents des pronoms dans « Il les confia… leurs péchés »
  choice: Maintien des pronoms sans identification ajoutée
  alternative: Identifier explicitement le peuple ou un personnage de la parabole
  rationale: L’extrait source fourni est lacunaire à cet endroit; préciser les référents importerait du contexte absent et résoudrait artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste vivant sans devenir familier. La répétition « peine / dur labeur » conserve l’insistance du grec, tandis que la note rend visible la corruption matérielle de l’extrait source.
