base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: fr
  text: Ces commandements sont utiles à ceux qui vont se repentir ; car s’ils ne les mettent pas en pratique, leur repentance est vaine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφοροί
  choice: utiles
  rationale: Exprime simplement l’idée de ce qui est avantageux ou salutaire pour les personnes concernées.
- source_word: τοῖς μέλλουσι μετανοεῖν
  choice: à ceux qui vont se repentir
  rationale: Conserve la valeur prospective de μέλλουσι sans préciser davantage si le repentir est imminent ou simplement envisagé.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: les mettent pas en pratique
  rationale: Rend naturellement en français l’image sémitisante de « marcher dans » les commandements, c’est-à-dire régler sa conduite sur eux.
- source_word: εἰς μάτην
  choice: vaine
  rationale: Restitue l’idée d’un repentir sans effet ni résultat.
- source_word: μετάνοια
  choice: repentance
  rationale: Terme théologique français courant qui garde ici l’idée d’un changement intérieur et pratique, sans la réduire au seul regret.
theological_decisions:
- issue: Rapport entre repentance et obéissance aux commandements
  choice: La repentance est dite vaine si les commandements ne sont pas mis en pratique.
  alternative: Paraphraser en affirmant que l’obéissance mérite ou garantit le salut.
  rationale: Le grec établit un lien nécessaire entre repentance et conduite, mais n’explicite pas ici une doctrine du mérite ou du mécanisme du salut ; la traduction préserve cette tension.
translation_notes:
  register: Français moderne, clair et digne. La métaphore grecque « marcher dans les commandements » est rendue idiomatiquement par « les mettre en pratique ».
