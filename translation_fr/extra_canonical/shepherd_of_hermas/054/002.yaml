- from: 'Tandis que je me disais cela intérieurement, je le vois soudain assis à côté de moi, qui me dit : « Pourquoi hésites-tu au sujet des commandements que je t’ai donnés ? Ils sont bons. N’hésite absolument pas, mais revêts-toi de la foi du Seigneur, et tu marcheras selon ces commandements, car je te donnerai la force de les observer. »'
  to: 'Tandis que je me disais cela intérieurement, je le vois soudain assis près de moi et me disant : « Pourquoi es-tu partagé au sujet des commandements que je t’ai donnés ? Ils sont bons. Ne sois absolument pas partagé, mais revêts-toi de la foi du Seigneur, et tu marcheras selon eux ; car je te fortifierai pour y marcher. »'
  rationale: 'La révision resserre la traduction sur les répétitions et les relations du grec : elle rend διψυχεῖν par « être partagé », conserve la métaphore de l’habillement et évite de convertir explicitement la promesse de force en une formulation d’« observation ». Aucun ajout doctrinal ni note n’est nécessaire.'
