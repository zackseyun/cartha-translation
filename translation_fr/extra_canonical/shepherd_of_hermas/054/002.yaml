    issue: Nuance de διψυχεῖς / διψυχήσῃς
    rationale: « Hésiter » est recevable, mais « être partagé » rend plus directement l’idée d’un cœur ou esprit divisé, sans imposer une interprétation doctrinale.
  - severity: low
    issue: Explicitation de ἐνδυναμώσω ἐν αὐταῖς
    rationale: « Donner la force de les observer » transforme « fortifier en elles » en objectif d’observance. « Je te fortifierai pour y marcher » demeure naturel tout en restant plus proche de la relation exprimée par le grec.
  - severity: low
    issue: Enchaînement narratif français
    rationale: « Assis près de moi et me disant » rend clairement les deux participes grecs παρακαθήμενον et λέγοντα.
