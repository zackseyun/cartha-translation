base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: fr
  text: 'Tandis que je me disais cela intérieurement, je le vois soudain assis près de moi et me disant : « Pourquoi es-tu partagé au sujet des commandements que je t’ai donnés ? Ils sont bons. Ne sois absolument pas partagé, mais revêts-toi de la foi du Seigneur, et tu marcheras selon eux ; car je te fortifierai pour y marcher. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχεῖς / διψυχήσῃς
  choice: hésites-tu / n’hésite absolument pas
  rationale: Le verbe évoque un esprit partagé, donc le doute ou l’irrésolution. « Hésiter » rend naturellement cette attitude en français sans introduire le calque peu courant « avoir l’âme partagée ».
- source_word: ἔνδυσαι
  choice: revêts-toi
  rationale: Conserve la métaphore explicite de l’habillement, reprise par l’idée de se revêtir de la foi.
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: la foi du Seigneur
  rationale: Maintient le génitif grec, qui peut désigner la foi venant du Seigneur, orientée vers lui ou caractérisée par lui, sans trancher cette ambiguïté.
- source_word: ἐν αὐταῖς πορεύσῃ
  choice: tu marcheras selon ces commandements
  rationale: La tournure idiomatique française conserve l’image biblique de la marche tout en explicitant le référent féminin pluriel, les commandements.
- source_word: ἐνδυναμώσω ἐν αὐταῖς
  choice: je te donnerai la force de les observer
  rationale: Exprime en français naturel la force accordée pour vivre selon les commandements; « observer » précise la portée pratique du syntagme grec.
theological_decisions:
- issue: Rapport entre foi, obéissance et force accordée
  choice: 'Conserver l’enchaînement : se revêtir de la foi du Seigneur, marcher selon les commandements, recevoir la force de les observer.'
  alternative: Reformuler en faisant de la foi seule ou de l’effort humain seul la cause explicite de l’obéissance.
  rationale: Le grec juxtapose ces éléments sans développer leur rapport doctrinal; la traduction ne doit pas résoudre cette tension.
- issue: Valeur du génitif dans « foi du Seigneur »
  choice: Conserver « du Seigneur ».
  alternative: « foi dans le Seigneur » ou « fidélité du Seigneur ».
  rationale: Ces variantes lèveraient une ambiguïté réelle du grec πίστιν τοῦ Κυρίου que le contexte immédiat ne permet pas de trancher avec certitude.
translation_notes:
  register: Français moderne, clair et digne. Le présent narratif de « je le vois » reproduit le βλέπω grec et donne à l’apparition sa soudaineté. La répétition autour de l’hésitation est maintenue, ainsi que la métaphore « revêts-toi ».
