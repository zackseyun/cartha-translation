  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/005.yaml
  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: fr
  text: 'Après qu’il m’eut dit cela, il me dit : « Allons dans la campagne, et je te montrerai les bergers des brebis. » « Allons-y, Seigneur », lui répondis-je. Nous arrivâmes dans une plaine, et il me montra un berger, un jeune homme vêtu d’une tenue composite, de couleur safran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγρόν
  choice: la campagne
  rationale: Le terme désigne ici un espace rural ou champêtre; « la campagne » est naturel en français et convient au déplacement vers la plaine qui suit.
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif peut signifier « maître » ou « seigneur ». La majuscule conserve ici la manière respectueuse dont Hermas s’adresse à son interlocuteur, sans l’identifier explicitement au Seigneur divin.
- source_word: πεδίον
  choice: une plaine
  rationale: Rend directement l’idée d’un terrain plat et ouvert.
- source_word: σύνθεσιν ἱματίων
  choice: un assemblage de vêtements
  rationale: L’expression grecque inhabituelle évoque un vêtement ou costume composé de plusieurs pièces; cette formulation conserve son caractère descriptif sans préciser arbitrairement « habit multicolore ».
- source_word: κροκώδη
  choice: couleur safran
  rationale: Rend la teinte jaune orangé associée au safran, plutôt que de choisir une couleur moderne trop précise.
theological_decisions:
- issue: Identité impliquée par κύριε
  choice: « Seigneur » avec majuscule, sans explicitation supplémentaire
  alternative: « maître » ou « monsieur »
  rationale: Le contexte présente une figure investie d’autorité, mais le grec ne tranche pas à lui seul son identité théologique. La traduction garde la forme traditionnelle et l’ambiguïté narrative.
translation_notes:
  register: Français moderne, narratif et digne. Les présents historiques (« il me dit », « il me montra » harmonisé au passé simple après l’introduction) ont été légèrement lissés afin d’obtenir un récit naturel, tout en gardant le dialogue direct et l’étrangeté de la description vestimentaire.
