base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: fr
  text: Il faisait paître un très grand nombre de moutons. Ces moutons semblaient vivre dans le luxe et l’extravagance ; joyeux, ils bondissaient çà et là. Le berger lui-même était très joyeux à cause de son troupeau ; son apparence même était tout à fait joyeuse, et il courait çà et là parmi les moutons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβοσκε
  choice: faisait paître
  rationale: Rend directement l’action pastorale à l’imparfait, en accord avec la scène descriptive.
- source_word: ὡσεὶ τρυφῶντα
  choice: semblaient vivre dans le luxe
  rationale: Préserve la nuance comparative de ὡσεὶ et le sens de vie molle ou luxueuse porté par τρυφάω.
- source_word: λίαν σπαταλῶντα
  choice: dans les plaisirs
  rationale: σπαταλάω évoque une vie de jouissance et de dissipation ; cette formulation reste naturelle sans réduire le terme à la seule prodigalité financière.
- source_word: ἱλαρά
  choice: joyeuses
  rationale: Dans ce contexte, ἱλαρός exprime une gaieté visible et vive.
- source_word: σκιρτῶντα ὧδε κἀκεῖ
  choice: elles bondissaient çà et là
  rationale: Rend le mouvement enjoué des brebis et conserve l’indication spatiale.
- source_word: ἐπὶ τῷ ποιμνίῳ αὐτοῦ
  choice: de son troupeau
  rationale: Avec ἱλαρός, ἐπί peut indiquer le motif de la joie ; « se réjouissait de » est idiomatique en français.
- source_word: ἡ ἰδέα τοῦ ποιμένος
  choice: son visage
  rationale: ἰδέα désigne ici l’aspect visible ou la physionomie du berger ; « visage » transmet naturellement la joie perceptible, sans suggérer une idée abstraite.
- source_word: περιέτρεχε
  choice: il courait parmi
  rationale: Conserve l’action répétée ou continue de courir autour et au milieu des brebis dans un français fluide.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition grecque de ἱλαρός est partiellement variée (« joyeuses », « se réjouissait », « rayonnait de joie ») afin de préserver l’insistance sur l’allégresse sans lourdeur artificielle.
