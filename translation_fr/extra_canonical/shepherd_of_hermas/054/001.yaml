base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/001.yaml
  text: 'While I was sitting in my house and glorifying the Lord for all the things I had seen, and pondering the commandments—that they are good and powerful and gladdening and glorious and able to save a person’s soul—I said within myself: “Blessed shall I be if I walk in these commandments, and whoever walks in them will be blessed.”'
translation:
  language: fr
  text: 'Tandis que j’étais assis chez moi, que je rendais gloire au Seigneur pour tout ce que j’avais vu et que je méditais sur les commandements — ils sont bons, puissants, réjouissants et glorieux, et ils peuvent sauver l’âme d’un être humain —, je me disais en moi-même : « Heureux serai-je si je marche selon ces commandements, et quiconque marchera selon eux sera heureux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: rendre gloire
  rationale: Expression française naturelle qui conserve l’idée de glorifier le Seigneur.
- source_word: συζητῶν
  choice: méditer sur
  rationale: Dans ce contexte de réflexion intérieure, le verbe désigne l’examen attentif des commandements plutôt qu’une discussion avec autrui.
- source_word: ἱλαραί
  choice: réjouissants
  rationale: Conserve la nuance de joie et d’allégresse sans réduire le terme à la simple amabilité.
- source_word: πορευθῶ / πορευθῇ
  choice: marcher selon
  rationale: Préserve la métaphore grecque de la conduite de vie tout en indiquant naturellement que les commandements guident cette marche.
- source_word: ψυχὴν ἀνθρώπου
  choice: l’âme d’un être humain
  rationale: Rend explicitement le générique ἀνθρώπου dans un français international inclusif, sans modifier la portée anthropologique de ψυχή.
theological_decisions:
- issue: Capacité des commandements à sauver l’âme
  choice: « ils peuvent sauver l’âme d’un être humain »
  alternative: « capables de sauver une âme humaine »
  rationale: La formulation maintient telle quelle l’affirmation du texte, sans expliquer le rapport entre commandements, foi, grâce et salut ni résoudre la tension théologique.
- issue: Sens de μακάριος
  choice: « heureux »
  alternative: « bienheureux »
  rationale: « Heureux » est actuel et intelligible, tout en conservant l’idée d’une condition favorisée ou bénie plutôt que d’un simple sentiment passager.
translation_notes:
  register: Français moderne, digne et accessible. La structure contemplative de la longue phrase grecque est conservée, avec des tirets pour rendre l’incise descriptive lisible. La répétition finale de « heureux » et la métaphore de la marche sont maintenues.
