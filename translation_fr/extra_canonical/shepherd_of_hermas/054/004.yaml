revisions:
- from: 'Vous donc qui vous repentez, rejetez les méchancetés de ce monde présent, qui vous épuisent. Revêtez-vous de toute vertu conforme à la justice : vous pourrez alors garder ces commandements et ne plus rien ajouter à vos péchés. Si donc vous n’y ajoutez plus rien, vous vous éloignerez de vos péchés passés. Suivez donc mes commandements que voici, et vous vivrez pour Dieu. Tout cela[a], je vous l’ai dit moi-même.'
  to: Vous donc qui vous repentez, rejetez les maux de ce temps-ci, qui vous épuisent. Après avoir revêtu toute vertu de justice, vous pourrez garder ces commandements et ne plus rien ajouter à vos péchés. Si donc vous n’y ajoutez plus rien, vous vous détournerez de vos péchés passés. Marchez donc selon ces commandements qui sont les miens, et vous vivrez pour Dieu. Tout cela[a], je vous l’ai dit moi-même.
  rationale: La révision conserve la structure conditionnelle et les images du grec, tout en corrigeant le mouvement plus marqué de ἀποστήσεσθε et en rendant αἰών par « temps-ci ». « Après avoir revêtu » reproduit la valeur participiale de ἐνδυσάμενοι, qui prépare la conséquence « vous pourrez ». La note conserve l’ambiguïté textuelle de [πάντα].
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu et l’enchaînement exhortatif est préservé. Deux formulations gagnent toutefois à être resserrées : ἀποστήσεσθε signifie plus directement « vous vous détournerez » que « vous vous éloignerez », et τοῦ αἰῶνος τούτου désigne « ce temps/âge-ci » plutôt que le monde au sens spatial. L’incertitude de πάντα est correctement signalée.'
  naturalness: Le français est globalement moderne et clair. « Les maux de ce temps-ci » est plus idiomatique et plus proche du grec que « les méchancetés de ce monde présent ». « Ces commandements qui sont les miens » évite le tour un peu démonstratif « mes commandements que voici » tout en conservant l’insistance de μου et ταύταις.
  terminology: « Se repentir », « justice », « commandements » et « vivre pour Dieu » conviennent au registre et n’imposent pas de lecture doctrinale. La métaphore du revêtement est maintenue.
  issues:
  - severity: medium
    issue: Rendu de ἀποστήσεσθε
    rationale: « Vous vous éloignerez de vos péchés passés » peut suggérer une simple prise de distance. Le verbe exprime plus nettement l’idée de se détourner ou de se retirer de ces péchés.
  - severity: low
    issue: Rendu de τοῦ αἰῶνος τούτου
    rationale: « Ce monde présent » est possible, mais « ce temps-ci » rend plus précisément αἰών comme époque ou ordre présent, sans privilégier un sens spatial de κόσμος.
  - severity: low
    issue: Formulation de la note textuelle
    rationale: Le texte fourni ne documente pas quels témoins omettent πάντα. Il est plus sûr de signaler l’incertitude éditoriale sans attribuer l’omission à des témoins déterminés.
