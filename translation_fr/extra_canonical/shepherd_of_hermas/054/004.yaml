base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: fr
  text: Vous donc qui vous repentez, rejetez les maux de ce temps-ci, qui vous épuisent. Après avoir revêtu toute vertu de justice, vous pourrez garder ces commandements et ne plus rien ajouter à vos péchés. Si donc vous n’y ajoutez plus rien, vous vous détournerez de vos péchés passés. Marchez donc selon ces commandements qui sont les miens, et vous vivrez pour Dieu. Tout cela[a], je vous l’ai dit moi-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot « tout » est textuellement incertain ; le texte peut aussi se lire : « Cela, je vous l’ai dit moi-même. »'
    reason: πάντα est placé entre crochets dans l’édition source ; la note préserve cette incertitude sans formuler une affirmation non étayée sur les témoins.
lexical_decisions:
- source_word: οἱ … μετανοοῦντες
  choice: vous donc qui vous repentez
  rationale: Rend le participe présent comme une démarche en cours et conserve l’adresse directe du grec.
- source_word: τὰς πονηρίας
  choice: les méchancetés
  rationale: Le pluriel désigne ici les formes ou manifestations concrètes du mal, plutôt qu’une notion abstraite unique.
- source_word: τοῦ αἰῶνος τούτου
  choice: de ce monde présent
  rationale: Dans ce contexte, αἰών évoque l’ordre ou l’époque présente; cette formulation naturelle garde sa portée temporelle et morale.
- source_word: τὰς ἐκτριβούσας ὑμᾶς
  choice: qui vous épuisent
  rationale: ἐκτρίβω peut exprimer l’usure jusqu’à l’anéantissement; « épuisent » restitue clairement l’image sans la surcharger.
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: toute vertu conforme à la justice
  rationale: Évite le calque obscur « toute vertu de justice » tout en maintenant le lien entre vertu et justice.
- source_word: πορεύεσθε … ταῖς ἐντολαῖς
  choice: Suivez … mes commandements
  rationale: Le grec emploie l’image de marcher selon les commandements; « suivre » est idiomatique en français et conserve l’idée de conduite.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: vous vivrez pour Dieu
  rationale: Conserve le datif τῷ Θεῷ sans trancher artificiellement entre vivre pour Dieu, devant lui ou en relation avec lui.
- source_word: παρ’ ἐμοῦ
  choice: moi-même
  rationale: Rend l’insistance sur l’origine personnelle des paroles dans un français naturel.
theological_decisions:
- issue: Rapport entre abandon des péchés, obéissance et repentance
  choice: Conserver l’enchaînement conditionnel et exhortatif du texte
  alternative: Reformuler en termes d’un système doctrinal explicite de salut ou de mérite
  rationale: Le passage associe étroitement repentance, rejet du mal et observation des commandements, sans exposer ici une doctrine systématique; la traduction préserve cette tension.
- issue: Sens de ζήσεσθε τῷ Θεῷ
  choice: « vous vivrez pour Dieu »
  alternative: « vous serez vivants aux yeux de Dieu » ou « vous vivrez en Dieu »
  rationale: Le datif grec permet plusieurs nuances. Le choix retenu est direct et naturel, tout en évitant d’introduire une idée d’union mystique qui n’est pas explicitement formulée.
translation_notes:
  register: Français moderne, international et digne. Le discours reste directement exhortatif. Les métaphores vestimentaires (« rejetez », « revêtez-vous ») et la progression logique du grec sont conservées, tandis que les tournures trop littérales susceptibles d’être opaques sont rendues idiomatiquement.
