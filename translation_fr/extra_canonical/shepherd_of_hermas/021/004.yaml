base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: fr
  text: Ainsi donc, ceux qui se seront entièrement repentis deviendront nouveaux et seront solidement fondés, eux qui se seront repentis de tout leur cœur. Tu as la révélation complète. Ne demande plus rien concernant la révélation ; mais si quelque chose est nécessaire, cela te sera révélé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσαντες
  choice: ceux qui se seront repentis
  rationale: Rend le participe aoriste dans sa relation future avec ἔσονται, tout en conservant le sens moral et spirituel de μετανοέω.
- source_word: ὁλοτελῶς
  choice: entièrement
  rationale: Exprime l’idée de totalité et fait écho à ὁλοτελῆ plus loin dans le verset.
- source_word: νέοι
  choice: nouveaux
  rationale: Dans ce contexte de renouvellement spirituel, « nouveaux » convient mieux que le sens purement chronologique de « jeunes ».
- source_word: τεθεμελιωμένοι
  choice: solidement fondés
  rationale: Conserve la métaphore du fondement et la valeur résultative du participe parfait.
- source_word: ἐξ ὅλης καρδίας
  choice: de tout leur cœur
  rationale: Expression française naturelle qui préserve l’idée d’un repentir sans réserve.
- source_word: ἀπέχεις
  choice: tu as reçu
  rationale: Dans cet emploi, le verbe indique que le destinataire possède désormais pleinement la révélation ; « tu as reçu » est idiomatique dans le contexte.
- source_word: ὁλοτελῆ τὴν ἀποκάλυψιν
  choice: la révélation dans son intégralité
  rationale: Préserve l’accent sur le caractère complet de la révélation reçue.
- source_word: ἐάν τι δὲ δέῃ
  choice: mais si quelque chose est nécessaire
  rationale: Garde l’impersonnalité et l’indétermination du grec sans préciser qui juge la nécessité.
theological_decisions:
- issue: Nature du renouvellement exprimé par νέοι
  choice: « deviendront nouveaux »
  alternative: « redeviendront jeunes »
  rationale: Le contexte immédiat parle du renouvellement des esprits ; la traduction retient donc la nouveauté spirituelle sans développer une doctrine particulière.
- issue: Portée de la révélation complète
  choice: « la révélation dans son intégralité »
  alternative: « une révélation complète »
  rationale: L’article grec renvoie à la révélation particulière donnée dans la vision, sans faire de cette phrase une affirmation générale sur toute révélation.
- issue: Demande future de révélation
  choice: « Ne demande plus rien au sujet d’une révélation »
  alternative: « Ne demande plus aucune révélation »
  rationale: La formulation conserve περὶ ἀποκαλύψεως, qui signifie littéralement « au sujet de révélation », et évite de transformer l’interdiction en principe absolu au-delà de la scène.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « ceux qui se seront repentis » est maintenue parce qu’elle reprend et précise le groupe initial dans le grec. Aucun marqueur de note n’est requis.
