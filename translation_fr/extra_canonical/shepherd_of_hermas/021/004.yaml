  source_fidelity: 'Le sens général est fidèlement rendu. Toutefois, ἀπέχεις exprime ici la possession suffisante ou complète de la révélation plutôt que l’acte de l’avoir « reçue »; « tu as la révélation complète » reproduit plus directement l’idiome grec. La tournure « au sujet d’une révélation » est aussi moins exacte et moins naturelle: ἀποκαλύψεως renvoie à la révélation dont il vient d’être question.'
  naturalness: Le français est globalement clair et de registre approprié. « Tu as la révélation complète » est plus direct et idiomatique que « Tu as reçu la révélation dans son intégralité ». « Concernant la révélation » rend naturellement περί avec le renvoi contextuel approprié.
  terminology: « se repentir », « nouveaux », « solidement fondés », « de tout leur cœur » et « révélé » conviennent au grec et au registre du passage. La répétition qualifiante du groupe des repentants est préservée.
