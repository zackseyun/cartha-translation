  - severity: low
    issue: Article et formulation de περὶ ἀποκαλύψεως
    rationale: « Au sujet d’une révélation » paraît indéterminé en français, alors que le contexte renvoie à la révélation présente. « Concernant la révélation » est plus naturel sans étendre la portée de l’interdiction.
