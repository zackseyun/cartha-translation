base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/003.yaml
  text: And because you saw her sitting on a bench, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.
translation:
  language: fr
  text: 'Et puisque tu l’as vue assise sur un banc, sa position est solide : en effet, le banc a quatre pieds et se tient fermement. Car le monde aussi est maintenu par quatre éléments.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλιον
  choice: banc
  rationale: Le terme désigne un siège à plusieurs places ou banc; « banc » est naturel en français et conserve le lien explicatif avec ses quatre pieds.
- source_word: ἰσχυρὰ ἡ θέσις
  choice: sa position est solide
  rationale: Rend littéralement l’idée d’une assise stable, tout en gardant le possible sens figuré de stabilité.
- source_word: κρατεῖται
  choice: est maintenu
  rationale: La voix passive exprime ici que le monde tient ou est soutenu grâce aux quatre éléments; « est maintenu » préserve cette image sans préciser indûment l’agent.
- source_word: στοιχείων
  choice: éléments
  rationale: « Éléments » est l’équivalent historique et contextuel naturel pour les quatre composantes fondamentales du monde dans la cosmologie ancienne.
theological_decisions:
- issue: Portée symbolique des quatre pieds et des quatre éléments
  choice: Conserver l’analogie telle quelle sans l’interpréter
  alternative: Identifier explicitement les quatre éléments ou donner au banc une signification ecclésiologique précise
  rationale: Le grec affirme seulement que la fermeté du banc à quatre pieds correspond à celle du monde maintenu par quatre éléments; toute identification supplémentaire dépasserait le texte.
translation_notes:
  register: Français moderne, clair et digne. La répétition de l’idée de solidité est maintenue parce qu’elle structure l’explication du passage.
