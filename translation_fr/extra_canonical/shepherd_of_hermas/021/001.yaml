  text: But in the third vision you saw her younger, beautiful, and cheerful, and her appearance was beautiful.
translation:
  language: fr
  text: Mais, dans la troisième vision, tu l’as vue plus jeune, belle et joyeuse, et son apparence était belle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέραν
  choice: plus jeune
  rationale: Le comparatif grec est conservé; il renvoie à l’apparence de la femme dans les visions précédentes.
- source_word: ἱλαράν
  choice: joyeuse
  rationale: Rend naturellement l’idée d’une disposition gaie et rayonnante.
- source_word: μορφή
  choice: visage
  rationale: Dans cette description personnelle, le terme désigne vraisemblablement l’aspect visible ou les traits; «visage» donne un français naturel tout en évitant la répétition peu élégante de «apparence».
