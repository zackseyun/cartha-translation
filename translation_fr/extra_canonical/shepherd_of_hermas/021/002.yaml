revisions:
- from: En effet, lorsqu’une bonne nouvelle parvient à quelqu’un qui est dans la tristesse, il oublie aussitôt ses peines passées et ne prête plus attention qu’à la nouvelle qu’il a entendue. Dès lors, il est fortifié en vue du bien, et son esprit est renouvelé par la joie qu’il a reçue. De même, vous aussi, en voyant ces bonnes choses, vous avez reçu le renouvellement de vos esprits.
  to: En effet, lorsqu’une bonne nouvelle parvient à quelqu’un qui est dans la tristesse, il oublie aussitôt ses peines passées et n’accueille plus rien d’autre que la nouvelle qu’il a entendue. Dès lors, il est fortifié pour le bien, et son esprit est renouvelé par la joie qu’il a reçue. De même, vous aussi, en voyant ces bonnes choses, vous avez reçu un renouvellement de vos esprits.
