base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: fr
  text: En effet, lorsqu’une bonne nouvelle parvient à quelqu’un qui est dans la tristesse, il oublie aussitôt ses peines passées et n’accueille plus rien d’autre que la nouvelle qu’il a entendue. Dès lors, il est fortifié pour le bien, et son esprit est renouvelé par la joie qu’il a reçue. De même, vous aussi, en voyant ces bonnes choses, vous avez reçu un renouvellement de vos esprits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία ἀγαθή
  choice: une bonne nouvelle
  rationale: Rend naturellement l’idée générale d’un message heureux, sans lui imposer ici le sens technique de l’Évangile.
- source_word: οὐδὲν ἄλλο προσδέχεται
  choice: ne prête plus attention qu’à
  rationale: Exprime en français courant l’attention exclusive accordée à la nouvelle; le verbe grec peut évoquer le fait d’accueillir ou d’attendre quelque chose.
- source_word: ἰσχυροποιεῖται ... εἰς τὸ ἀγαθόν
  choice: il est fortifié en vue du bien
  rationale: Conserve à la fois l’idée de renforcement et l’orientation vers ce qui est bon.
- source_word: ἀνανέωσιν ... τῶν πνευμάτων ὑμῶν
  choice: le renouvellement de vos esprits
  rationale: Préserve le pluriel grec et le lien explicite avec le renouvellement intérieur de chacun.
- source_word: ταῦτα τὰ ἀγαθά
  choice: ces bonnes choses
  rationale: Traduction volontairement large qui respecte le référent contextuel sans le préciser au-delà du grec.
theological_decisions:
- issue: Sens de ἀγγελία ἀγαθή
  choice: bonne nouvelle au sens non technique
  alternative: Évangile
  rationale: Le contexte décrit par analogie toute annonce réjouissante faite à une personne affligée; rien n’impose ici un titre théologique.
- issue: Portée de πνεῦμα / πνεύματα
  choice: esprit humain, au singulier dans l’exemple et au pluriel dans l’application collective
  alternative: Esprit saint ou disposition intérieure reformulée
  rationale: La joie renouvelle ici l’être intérieur des personnes; la traduction conserve les nombres grammaticaux et n’identifie pas le terme à l’Esprit saint.
translation_notes:
  register: Français moderne, international et digne. La phrase ample et parallèle du grec est conservée, avec une ponctuation adaptée à la lisibilité. Le tutoiement collectif du contexte est rendu par « vous ».
