  naturalness: Le français est moderne, clair et de registre approprié. « N’accueille plus rien d’autre que » est à la fois plus idiomatique dans cette construction et plus proche du grec.
  terminology: « Bonne nouvelle » conserve correctement le sens non technique de ἀγγελία ἀγαθή. « Esprit / esprits » respecte le singulier de l’exemple et le pluriel de l’application, sans interprétation théologique ajoutée. « Bonnes choses » préserve utilement l’ouverture de ταῦτα τὰ ἀγαθά.
