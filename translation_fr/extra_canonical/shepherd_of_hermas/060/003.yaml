base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/003.yaml
  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: fr
  text: 'Après que tous eurent reçu les baguettes, l’ange posa la faucille, et cet arbre était intact, comme je l’avais vu auparavant. Je m’étonnais en moi-même et me disais : « Comment l’arbre peut-il être intact, alors qu’on lui a coupé tant de branches ? » Le berger me dit : « Ne t’étonne pas que l’arbre soit resté intact malgré les nombreuses branches qu’on lui a coupées. Attends jusqu’à ce que tu aies tout vu, et il te sera montré ce que c’est. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαβδία
  choice: baguettes
  rationale: Le terme désigne ici de petites branches coupées et distribuées; « baguettes » rend leur forme sans les confondre avec les branches encore attachées à l’arbre.
- source_word: ὑγιές
  choice: intact
  rationale: Dans ce contexte, le mot souligne que l’arbre demeure indemne malgré la coupe; « intact » est plus naturel que le littéral « sain » pour un arbre ainsi décrit.
- source_word: ἐθαύμαζον
  choice: je m’étonnais
  rationale: Rend la surprise réfléchie du narrateur sans suggérer nécessairement l’admiration.
- source_word: δηλωθήσεταί
  choice: te sera révélé
  rationale: Le passif exprime qu’une explication sera donnée ultérieurement, sans préciser ici son agent.
theological_decisions:
- issue: Interprétation symbolique de l’arbre
  choice: « ce que cela signifie »
  alternative: « ce que c’est »
  rationale: Le contexte est celui d’une vision symbolique à expliquer; la formulation française naturelle indique cette portée sans anticiper l’interprétation théologique.
translation_notes:
  register: Français moderne, narratif et digne. Le dialogue est ponctué explicitement; la répétition du grec autour de l’arbre intact et des branches coupées est conservée pour préserver l’insistance du passage.
