  to: 'Après que tous eurent reçu les baguettes, l’ange posa la faucille, et cet arbre était intact, comme je l’avais vu auparavant. Je m’étonnais en moi-même et me disais : « Comment l’arbre peut-il être intact, alors qu’on lui a coupé tant de branches ? » Le berger me dit : « Ne t’étonne pas que l’arbre soit resté intact malgré les nombreuses branches qu’on lui a coupées. Attends jusqu’à ce que tu aies tout vu, et il te sera montré ce que c’est. »'
