base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: fr
  text: L’ange qui avait remis les baguettes au peuple les leur réclama de nouveau. Comme ils les avaient reçues, ils furent aussi appelés auprès de lui, et chacun rendit les baguettes. L’ange du Seigneur les recevait et les examinait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: baguettes
  rationale: Dans ce contexte, il s’agit des petits rameaux d’environ une coudée coupés du saule et distribués au peuple. « Baguettes » rend leur forme et assure la continuité avec la scène précédente.
- source_word: πάλιν ἀπῄτει ἀπ᾽ αὐτῶν
  choice: les leur réclama de nouveau
  rationale: Rend explicitement le mouvement de restitution exprimé par ἀπαιτέω, sans alourdir la phrase par « réclama en retour ».
- source_word: καθὼς ἔλαβον, οὕτω καὶ ἐκαλοῦντο
  choice: Ils furent appelés auprès de lui dans l’ordre où ils les avaient reçues
  rationale: 'Le grec est elliptique : le pronom implicite renvoie naturellement aux baguettes, et la corrélation καθὼς… οὕτω indique vraisemblablement que l’ordre de convocation correspondait à celui de la distribution.'
- source_word: κατενόει
  choice: examinait
  rationale: Le verbe désigne ici une observation attentive, comme le confirme le classement qui suit selon l’état des baguettes.
theological_decisions:
- issue: Désignation de l’ange
  choice: L’ange du Seigneur
  alternative: l’ange du Maître
  rationale: « Seigneur » est la traduction française naturelle de Κυρίου dans ce contexte religieux. La formule identifie l’ange par son appartenance ou sa mission sans préciser davantage son statut.
translation_notes:
  register: Français moderne, narratif et digne. L’imparfait final restitue les actions répétées de l’ange lorsqu’il recevait et inspectait successivement chaque baguette.
