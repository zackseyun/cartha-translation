revisions:
- from: …de tout leur cœur. Penses-tu donc que les péchés de ceux qui se repentent sont aussitôt pardonnés ? Pas tout à fait. Celui qui se repent doit plutôt affliger sa propre âme, faire preuve d’une profonde humilité dans toute sa conduite et traverser toutes sortes de détresses. S’il supporte les détresses qui lui surviennent, celui qui a créé et fortifié toutes choses sera certainement pris de compassion et lui accordera une certaine guérison. Cela arrivera lorsque [Dieu][a] verra que le cœur de celui qui se repent est pur de tout[b].
  to: …de tout leur cœur. Penses-tu donc que les péchés de ceux qui se repentent sont aussitôt pardonnés ? Pas entièrement. Celui qui se repent doit plutôt affliger sa propre âme, s’humilier profondément dans toute sa conduite et être accablé dans toutes sortes de détresses. S’il endure les détresses qui lui surviennent, celui qui a créé toutes choses et leur a donné force aura assurément compassion et lui accordera quelque guérison. Et cela, lorsque [Dieu][a] verra que le cœur de celui qui se repent est pur de tout[b].
  rationale: Les retouches resserrent l’équivalence avec le grec tout en conservant un français international moderne. Elles ne modifient ni l’enchaînement pénitentiel du passage ni l’incertitude textuelle signalée à la fin.
