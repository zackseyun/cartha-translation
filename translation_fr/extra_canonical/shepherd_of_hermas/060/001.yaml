base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: fr
  text: …de tout leur cœur. Penses-tu donc que les péchés de ceux qui se repentent sont aussitôt pardonnés ? Pas entièrement. Celui qui se repent doit plutôt affliger sa propre âme, s’humilier profondément dans toute sa conduite et être accablé dans toutes sortes de détresses. S’il endure les détresses qui lui surviennent, celui qui a créé toutes choses et leur a donné force aura assurément compassion et lui accordera quelque guérison. Et cela, lorsque [Dieu][a] verra que le cœur de celui qui se repent est pur de tout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « Dieu » est restitué par l’éditeur dans le texte grec.
    reason: Signaler honnêtement une restitution textuelle présente entre crochets dans la source.
  - marker: b
    text: La phrase s’interrompt ici dans l’extrait grec fourni ; la suite attendue après « de tout » n’y est pas conservée.
    reason: Le texte source transmis bascule ensuite sans continuité vers un autre passage ; il faut préserver cette lacune plutôt que la compléter conjecturalement.
lexical_decisions:
- source_word: μετανοούντων / μετανοοῦντα
  choice: ceux qui se repentent / celui qui se repent
  rationale: Rend directement l’idée d’un changement intérieur manifesté par la repentance, sans employer un vocabulaire confessionnel plus spécialisé.
- source_word: βασανίσαι τὴν ἑαυτοῦ ψυχήν
  choice: affliger sa propre âme
  rationale: Conserve la force de βασανίζω dans ce contexte pénitentiel sans suggérer artificiellement une torture physique.
- source_word: ταπεινοφρονῆσαι … ἰσχυρῶς
  choice: faire preuve d’une profonde humilité
  rationale: Expression française naturelle qui associe l’humilité de pensée à l’intensif ἰσχυρῶς.
- source_word: θλιβῆναι ἐν πάσαις θλίψεσι ποικίλαις
  choice: traverser toutes sortes de détresses
  rationale: Évite une répétition française pesante tout en maintenant l’idée d’être éprouvé par des afflictions diverses.
- source_word: σπλαγχνισθήσεται
  choice: sera certainement pris de compassion
  rationale: Préserve la vive compassion exprimée par le verbe grec et la certitude apportée par πάντως.
- source_word: ἴασίν τινα
  choice: une certaine guérison
  rationale: Maintient l’indétermination de τινα au lieu de transformer la guérison en promesse définie ou totale.
theological_decisions:
- issue: Rapport entre repentance, épreuves et pardon
  choice: Conserver l’enchaînement conditionnel et pénitentiel du texte
  alternative: Reformuler pour faire du pardon un acte immédiatement acquis, indépendamment des épreuves décrites
  rationale: Le grec répond οὐ παντελῶς et présente l’endurance des détresses avant la compassion et la guérison; cette tension théologique ne doit pas être harmonisée avec une doctrine extérieure au passage.
- issue: Sujet explicite de la dernière proposition
  choice: '[Dieu], signalé comme restitution éditoriale'
  alternative: Répéter sans crochets « celui qui a créé toutes choses »
  rationale: Le témoin fourni porte une insertion entre crochets à cet endroit; le français la conserve et la signale plutôt que de la présenter comme incontestablement attestée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le ton exhortatif et la rigueur pénitentielle du grec, tout en évitant des tournures archaïques. L’ellipse initiale est conservée parce que le segment commence au milieu d’une phrase.
