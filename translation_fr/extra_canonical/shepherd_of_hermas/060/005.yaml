  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/005.yaml
  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: fr
  text: 'De certains, il reçut des baguettes sèches et rongées comme par des vers[a] ; l’ange ordonna à ceux qui avaient remis de telles baguettes de se tenir à l’écart. D’autres remirent des baguettes sèches, mais qui n’étaient pas rongées par des vers ; il leur ordonna, à eux aussi, de se tenir à l’écart. D’autres remirent des baguettes à moitié sèches ; eux aussi se tinrent à l’écart. D’autres remirent leurs baguettes à moitié sèches et fendues ; eux aussi se tinrent à l’écart. D’autres remirent leurs baguettes vertes et fendues ; eux aussi se tinrent à l’écart. D’autres remirent leurs baguettes à moitié sèches et à moitié vertes ; eux aussi se tinrent à l’écart. D’autres présentèrent leurs baguettes : les deux tiers étaient verts et le troisième sec ; eux aussi se tinrent à l’écart. D’autres remirent leurs baguettes avec les deux tiers secs et le troisième vert ; eux aussi se tinrent à l’écart. D’autres remirent leurs baguettes presque entièrement vertes : seule une toute petite partie
    était sèche, juste à l’extrémité ; et elles étaient fendues. Eux aussi se tinrent à l’écart.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rongées comme par une mite ». Le terme grec peut désigner un insecte ou une larve qui ronge.'
    reason: La comparaison est lexicalement plus large que le français idiomatique « vers » appliqué au bois.
lexical_decisions:
- source_word: ῥάβδους
  choice: baguettes
  rationale: Dans cette scène, il s’agit de petites branches coupées du saule et distribuées à chacun. « Baguettes » est naturel en français et conserve l’image concrète sans suggérer des bâtons massifs.
- source_word: ξηράς / χλωράς
  choice: sèches / vertes
  rationale: Ces équivalents rendent directement le contraste entre le bois desséché et le bois encore vivant ou frais.
- source_word: βεβρωμένας ὡς ὑπὸ σητός
  choice: rongées comme par des vers
  rationale: σητός désigne un organisme qui ronge, souvent une mite ou un ver. Pour du bois, « vers » est plus idiomatique en français, tout en maintenant la comparaison introduite par ὡς.
- source_word: χωρὶς ἵστασθαι
  choice: se tenir à l’écart
  rationale: Expression naturelle qui conserve l’idée d’être placé séparément des autres groupes.
- source_word: σχισμὰς ἐχούσας
  choice: fendues
  rationale: Formulation concise et concrète pour des baguettes présentant des fentes.
- source_word: τὰ δύο μέρη … τὸ δὲ τρίτον
  choice: les deux tiers… le troisième
  rationale: Le grec parle littéralement de deux parts et d’une troisième ; dans ce contexte, « deux tiers » exprime clairement la proportion.
theological_decisions:
- issue: Portée symbolique des différents états des baguettes
  choice: Ne pas expliciter leur signification dans le corps du texte
  alternative: Ajouter des qualificatifs moraux ou spirituels anticipant l’interprétation ultérieure
  rationale: Le passage décrit d’abord la vision ; son interprétation vient ensuite. La traduction préserve cette progression narrative et l’ambiguïté symbolique.
translation_notes:
  register: Français moderne, clair et digne. La répétition délibérée de « eux aussi se tinrent à l’écart » reproduit la structure cumulative du grec sans l’alourdir inutilement.
