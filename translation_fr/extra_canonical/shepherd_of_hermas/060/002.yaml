  source_fidelity: 'Le contenu essentiel est rendu fidèlement : l’ange est présenté près du saule, muni d’une grande faucille, coupant des branches et les donnant au peuple abrité sous l’arbre, puis donnant de petites baguettes d’environ une coudée. Toutefois, « ainsi » n’a pas d’appui explicite dans le grec et affaiblit la simple coordination narrative de καί. « Il leur donnait » rend mieux l’imparfait ἐπεδίδου que « Il leur distribuait ».'
