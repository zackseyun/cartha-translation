base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/002.yaml
  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: fr
  text: Un ange du Seigneur, très glorieux et très grand, se tenait près du saule. Il tenait une grande faucille, coupait des branches du saule et les donnait au peuple qui se trouvait à l’abri sous le saule. Il leur donnait de petites baguettes, longues d’environ une coudée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une ancienne mesure correspondant approximativement à la longueur de l’avant-bras.
    reason: Aide les lecteurs modernes à comprendre la mesure tout en conservant le terme historique du texte.
lexical_decisions:
- source_word: Κυρίου
  choice: du Seigneur
  rationale: Rend directement le génitif grec et conserve le titre traditionnel sans préciser davantage l’identité du Seigneur.
- source_word: ἔνδοξος λίαν
  choice: extrêmement glorieux
  rationale: Préserve l’intensité de λίαν et la dignité du portrait de l’ange.
- source_word: ὑψηλός
  choice: de très haute taille
  rationale: Dans ce portrait visuel, le terme décrit naturellement la stature; «très» rend l’accentuation du contexte.
- source_word: ἰτέαν
  choice: saule
  rationale: Équivalent botanique courant et précis du grec ἰτέα.
- source_word: δρέπανον
  choice: faucille
  rationale: Désigne naturellement l’outil courbe servant ici à couper les branches.
- source_word: σκεπαζομένῳ
  choice: s’abritaient
  rationale: Exprime l’idée d’être couvert ou protégé sous le saule dans un français naturel.
- source_word: ῥαβδία
  choice: petites baguettes
  rationale: Conserve le diminutif et distingue les morceaux remis au peuple des branches encore attachées à l’arbre.
- source_word: πηχυαῖα
  choice: longues d’environ une coudée
  rationale: Rend la mesure ancienne sans conversion conjecturale; ὡσεὶ justifie «environ».
theological_decisions:
- issue: Référence de «Seigneur»
  choice: Conserver «du Seigneur» sans explicitation
  alternative: «de Dieu» ou «du Christ»
  rationale: Le grec ne précise pas ici le référent; l’expliciter résoudrait indûment une ambiguïté théologique.
- issue: Portée symbolique du saule et des baguettes
  choice: Traduction concrète sans interprétation ajoutée
  alternative: Introduire dans le texte leur signification ecclésiale ou morale
  rationale: La scène doit rester visionnaire à ce stade; son interprétation appartient à la suite du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement réorganisées pour éviter une accumulation pesante de coordinations, tout en conservant chaque élément de la scène grecque.
