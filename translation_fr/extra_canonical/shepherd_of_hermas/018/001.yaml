    issue: L’impératif passif ἁγιασθῆτε est rendu par le réflexif « Purifiez-vous ».
    rationale: Le français peut exprimer naturellement le passif par « Soyez purifiés ». Cette formulation respecte la voix du grec sans imposer le sens technique plus étroit de « sanctifiez-vous ».
  - severity: low
    issue: « Ne profitez pas seuls ... des créatures de Dieu » est quelque peu lourd et imprécis en français.
    rationale: Le contexte porte sur les biens reçus et consommés, notamment la nourriture. « Ne soyez pas les seuls à profiter des biens créés par Dieu » garde l’expression de la création tout en exprimant clairement l’exclusivité dénoncée.
  - severity: low
    issue: La formulation finale atténue légèrement le futur d’exclusion et emploie « devant la porte ».
    rationale: ἐκκλεισθήσεσθε annonce l’exclusion ; « vous serez exclus ... à l’extérieur de la porte » rend plus directement le futur et ἔξω τῆς θύρας.
