  source_fidelity: 'Révision nécessaire pour rendre plus exactement l’impératif passif ἁγιασθῆτε (« Soyez purifiés ») plutôt qu’un réflexif. Le reste suit fidèlement l’exhortation grecque : solidarité communautaire, contraste entre surabondance et privation, urgence avant l’achèvement de la tour, et avertissement aux riches. L’incertitude textuelle de ἀσχέτων est correctement signalée.'
  naturalness: Le français est globalement naturel et convient à un registre exhortatif. Quelques formulations sont resserrées afin de rendre plus idiomatiques la consommation exclusive des biens créés, la conséquence de l’achèvement de la tour et l’exclusion « à l’extérieur de la porte ».
  terminology: « Méchanceté », « perversité », « Seigneur », « tour » et « jugement » sont appropriés. « Biens créés par Dieu » rend plus naturellement τὰ κτίσματα τοῦ Θεοῦ dans ce contexte alimentaire, sans effacer son lien à la création. La note conserve avec prudence l’ambiguïté du mot entre crochets.
  issues:
