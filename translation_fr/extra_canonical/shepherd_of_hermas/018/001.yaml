  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/001.yaml
  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: fr
  text: 'Soyez purifiés de toute méchanceté et de toute perversité. Mais vous ne voulez pas vous détourner de votre méchanceté. Maintenant donc, écoutez-moi, vivez en paix les uns avec les autres, veillez les uns sur les autres et soutenez-vous mutuellement. Ne soyez pas les seuls à profiter des biens créés par Dieu dans une abondance débordante, mais partagez aussi avec ceux qui sont dans le besoin. En effet, certains, par leur nourriture trop abondante, attirent la faiblesse sur leur chair et la ruinent ; tandis que la chair de ceux qui n’ont pas de quoi manger se détériore faute d’une nourriture suffisante, et leur corps dépérit. Ce manque de mesure vous est donc nuisible, à vous qui possédez et ne partagez pas avec ceux qui manquent du nécessaire. Prenez garde au jugement qui vient. Vous donc qui êtes dans l’aisance, recherchez ceux qui ont faim, pendant que la tour n’est pas encore achevée. Car, une fois la tour achevée, vous voudrez faire le bien, mais vous n’en aurez plus la possibilité.
    Prenez donc garde, vous qui tirez orgueil de vos richesses : de peur que ceux qui sont dans le besoin ne se mettent à gémir, que leur gémissement ne monte jusqu’au Seigneur et que vous ne soyez exclus, avec vos biens inutiles[a], à l’extérieur de la porte de la tour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec transmis ici est incertain. La leçon imprimée peut se comprendre, dans ce contexte, comme « inutiles » ou « sans valeur » ; d’autres restitutions du texte sont possibles.
    reason: Signaler l’incertitude textuelle marquée par les crochets dans l’édition source, sans décider entre des restitutions qui ne sont pas assurées.
lexical_decisions:
- source_word: ἁγιασθῆτε
  choice: Purifiez-vous
  rationale: Dans ce contexte d’abandon de la méchanceté et de la perversité, le passif impératif appelle une purification morale. « Sanctifiez-vous » serait plus formel, mais moins naturel ici en français courant.
- source_word: σκολιότητος
  choice: perversité
  rationale: Le terme désigne littéralement ce qui est tortueux ou faussé, avec une portée morale. « Perversité » restitue cette valeur sans employer le calque moins naturel « tortuosité ».
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: vivez en paix les uns avec les autres
  rationale: Cette formulation française rend l’exhortation communautaire de manière claire et naturelle.
- source_word: ἐπισκέπτεσθε ἀλλήλους
  choice: veillez les uns sur les autres
  rationale: Le verbe peut signifier visiter, prendre soin ou veiller sur. Le contexte d’entraide favorise une expression assez large pour inclure l’attention concrète.
- source_word: τὰ κτίσματα τοῦ Θεοῦ
  choice: les créatures de Dieu
  rationale: Le choix conserve l’expression grecque, qui désigne ici les biens créés consommés comme nourriture, sans la réduire explicitement à « aliments ».
- source_word: ἐκ καταχύματος
  choice: dans une abondance débordante
  rationale: L’expression évoque un débordement ou une profusion ; la traduction préserve l’image tout en restant idiomatique.
- source_word: ἀσυνκρασία
  choice: manque de mesure
  rationale: Le mot exprime ici un déséquilibre ou une absence de juste proportion entre surabondance et privation. « Manque de mesure » convient mieux au raisonnement que le seul « intempérance ».
- source_word: τόπον
  choice: occasion
  rationale: Littéralement « lieu/place », mais dans l’avertissement eschatologique, le sens fonctionnel est qu’il ne restera plus de possibilité d’agir. La note théologique signale l’ambiguïté possible.
- source_word: ὑπερέχοντες
  choice: vous qui êtes dans l’aisance
  rationale: Le participe désigne ceux qui ont davantage ou se trouvent en position supérieure ; ici, le contexte économique appelle « dans l’aisance ».
theological_decisions:
- issue: La tour et la limite temporelle du bien à accomplir
  choice: Conserver l’image de la tour sans l’expliquer dans le corps du texte
  alternative: Identifier explicitement la tour à l’Église ou à l’achèvement eschatologique
  rationale: Le passage présuppose le symbolisme développé dans la vision, mais ne l’explicite pas ici. La traduction préserve donc l’image et son urgence sans imposer une interprétation doctrinale.
- issue: Sens de οὐχ ἕξετε τόπον
  choice: « vous n’en aurez plus l’occasion »
  alternative: « vous n’aurez plus de place »
  rationale: Le contexte immédiat porte sur la possibilité de faire le bien avant l’achèvement de la tour. Toutefois, le grec garde une métaphore spatiale qui pourrait aussi faire écho à l’exclusion mentionnée ensuite ; cette tension n’est pas développée artificiellement.
- issue: Montée du gémissement vers le Seigneur
  choice: Conserver la formulation comme avertissement direct
  alternative: Expliciter une allusion à un jugement divin particulier ou à un texte biblique précis
  rationale: Le texte affirme que le Seigneur entend la plainte des pauvres, mais ne nomme ni procédure ni passage scripturaire ; aucune précision confessionnelle n’est ajoutée.
translation_notes:
  register: Français moderne international, au ton exhortatif, digne et direct. Les répétitions rhétoriques du grec sont maintenues lorsqu’elles structurent l’avertissement, tandis que la syntaxe est légèrement assouplie pour une lecture naturelle. Le segment traduit correspond au contenu fourni par la couche anglaise auditée, soit les paragraphes grecs 1 à 6.
