base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/004.yaml
  text: And as she was going, I asked her to reveal to me about the three forms in which she had appeared to me. She answered me and said, “About these, you must ask another, so that it may be revealed to you.”
translation:
  language: fr
  text: 'Tandis qu’elle s’en allait, je lui demandai de me révéler ce qu’il en était des trois formes sous lesquelles elle m’était apparue. Elle me répondit : « À ce sujet, tu dois interroger quelqu’un d’autre, afin que cela te soit révélé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγουσαν δὲ αὐτήν
  choice: Tandis qu’elle s’en allait
  rationale: Rend naturellement le participe circonstanciel grec tout en conservant l’action en cours.
- source_word: ἀποκαλύψῃ
  choice: m’expliquer
  rationale: Dans la première proposition, le verbe signifie ici faire connaître le sens des formes; « expliquer » est idiomatique en français, tandis que la reprise passive conserve « révélé ».
- source_word: μορφῶν
  choice: formes
  rationale: Équivalent direct qui préserve la référence aux trois apparences distinctes de la femme.
- source_word: ἐνεφανίσθη
  choice: m’était apparue
  rationale: Le plus-que-parfait situe correctement les apparitions avant la demande du narrateur.
- source_word: ἕτερον
  choice: quelqu’un d’autre
  rationale: Le masculin substantivé désigne une autre personne, sans préciser son identité.
theological_decisions:
- issue: Identité de la personne à interroger
  choice: quelqu’un d’autre
  alternative: un autre
  rationale: Le grec ἕτερον ne nomme pas cette personne; la traduction préserve cette indétermination.
- issue: Langage de révélation
  choice: afin que cela te soit révélé
  alternative: pour que tu en reçoives la révélation
  rationale: La formulation passive conserve l’ambiguïté du grec quant à l’agent de la révélation.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit littéraire, avec un dialogue clair et accessible.
