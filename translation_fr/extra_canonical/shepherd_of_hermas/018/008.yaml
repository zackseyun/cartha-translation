  text: Answering him again, I said, “But from you, Lord, we shall learn these things more precisely.”
translation:
  language: fr
  text: 'Je lui répondis de nouveau : « Mais c’est de toi, Seigneur, que nous apprendrons ces choses avec plus de précision. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκριβέστερον
  choice: avec plus de précision
  rationale: Rend naturellement le comparatif adverbial tout en conservant l’idée d’une connaissance plus exacte ou plus détaillée.
theological_decisions:
- issue: Sens de κύριε dans l’adresse au jeune homme
  choice: Seigneur
  alternative: monsieur / maître
  rationale: Le contexte visionnaire et l’usage de l’adresse honorifique permettent « Seigneur »; la majuscule suit la convention française du projet sans préciser davantage l’identité du jeune homme.
translation_notes:
  register: Français moderne, digne et direct. La première personne du pluriel de γνωσόμεθα est conservée, de même que la reprise emphatique « c’est de toi » portée par ἀπὸ σοῦ.
