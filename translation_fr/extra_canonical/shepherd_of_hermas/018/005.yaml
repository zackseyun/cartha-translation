  to: Frères, dans la première vision, celle de l’année précédente, elle m’est apparue très âgée et assise sur un siège. Dans la deuxième vision, son apparence était plus jeune, mais sa chair et ses cheveux étaient plus âgés ; elle me parlait debout et était plus joyeuse qu’auparavant. Dans la troisième vision, elle était tout entière plus jeune et d’une beauté éclatante ; seuls ses cheveux étaient plus âgés. Elle demeura joyeuse jusqu’à la fin et était assise sur un siège rembourré.
