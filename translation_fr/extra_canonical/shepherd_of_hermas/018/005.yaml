base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/005.yaml
  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: fr
  text: Frères, dans la première vision, celle de l’année précédente, elle m’est apparue très âgée et assise sur un siège. Dans la deuxième vision, son apparence était plus jeune, mais sa chair et ses cheveux étaient plus âgés ; elle me parlait debout et était plus joyeuse qu’auparavant. Dans la troisième vision, elle était tout entière plus jeune et d’une beauté éclatante ; seuls ses cheveux étaient plus âgés. Elle demeura joyeuse jusqu’à la fin et était assise sur un siège rembourré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: visage
  rationale: Dans le contraste avec la chair et les cheveux, le terme désigne vraisemblablement l’aspect visible du visage plutôt que l’apparence générale.
- source_word: σάρκα
  choice: corps
  rationale: « Corps » est naturel en français pour décrire l’aspect physique d’une femme âgée, tandis que « chair » serait ici trop littéral et potentiellement trompeur.
- source_word: πρεσβυτέρας
  choice: ceux d’une femme âgée
  rationale: Le comparatif grec décrit ici l’âge apparent du corps et des cheveux ; cette formulation française évite l’étrange « plus vieux » sans point de comparaison explicite.
- source_word: ἱλαρωτέρα / ἱλαρά
  choice: plus joyeuse / parfaitement joyeuse
  rationale: ἱλαρός évoque une disposition gaie, sereine et rayonnante. « Joyeuse » convient au contexte et garde la progression du passage.
- source_word: κάλλει ἐκπρεπεστάτη
  choice: d’une beauté remarquable
  rationale: Rend le superlatif intensif de manière digne et naturelle, sans la lourdeur de « très éminente en beauté ».
- source_word: συμψελίου
  choice: banquette garnie de coussins
  rationale: Le mot rare désigne vraisemblablement un siège ou banc muni de coussins ; la traduction conserve cette image sans prétendre à une précision excessive.
theological_decisions:
- issue: Identité symbolique de la femme âgée
  choice: Maintenir le simple pronom « elle » sans explicitation
  alternative: Identifier explicitement la femme à l’Église
  rationale: Le segment décrit ses trois apparitions sans en donner ici l’interprétation ; l’expliciter dans le texte résoudrait prématurément le symbole.
- issue: Progression de l’âge apparent
  choice: Préserver la distinction entre visage, corps et cheveux
  alternative: Résumer par une apparence globalement plus jeune à chaque vision
  rationale: Ces différences physiques portent la tension symbolique du récit et ne doivent pas être harmonisées.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement allégée pour la lecture courante, tout en conservant les trois étapes, les contrastes anatomiques et la progression de la joie.
