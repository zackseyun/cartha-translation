review_pass:
  verdict: revise
  source_fidelity: La structure des trois apparitions et les contrastes entre apparence, chair/corps et cheveux sont globalement bien rendus. Toutefois, ὄψις désigne plus largement l’apparence que le seul visage, les comparatifs πρεσβυτέρα/πρεσβυτέρας doivent être conservés, et εἰς τέλος signifie « jusqu’à la fin », non « parfaitement ».
  naturalness: Le français est fluide et adapté à un récit narratif moderne. La révision maintient cette fluidité tout en rétablissant les nuances comparatives et temporelles du grec.
  terminology: « Siège rembourré » rend prudemment le rare συμψέλιον, sans surdéterminer la forme exacte du meuble. « Apparence » est préférable à « visage » pour ὄψις dans ce contexte.
  issues:
  - severity: medium
    issue: « son visage » pour ὄψιν
    rationale: Ὄψις peut désigner l’apparence visible dans son ensemble; le contraste avec la chair et les cheveux ne contraint pas le sens à « visage ». « Son apparence » préserve mieux l’étendue du terme.
  - severity: medium
    issue: Perte des comparatifs « plus âgés »
    rationale: Le grec qualifie explicitement la chair, les cheveux et, dans la troisième vision, les seuls cheveux de « plus âgés ». « Ceux d’une femme âgée » atténue cette comparaison répétée.
  - severity: medium
    issue: « parfaitement joyeuse » pour εἰς τέλος
    rationale: 'L’expression εἰς τέλος est temporelle: elle fut joyeuse « jusqu’à la fin ». Elle n’intensifie pas directement le degré de sa joie.'
