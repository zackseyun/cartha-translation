base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/003.yaml
  text: X. When she had ceased speaking with me, the six young men who were building came and carried her to the tower, and four others lifted the cushioned seat and carried it also to the tower. I did not see their faces, because they were turned away.
translation:
  language: fr
  text: X. Quand elle eut fini de me parler, les six jeunes hommes qui construisaient arrivèrent et l’emmenèrent jusqu’à la tour. Quatre autres soulevèrent le siège rembourré et l’emmenèrent lui aussi jusqu’à la tour. Je ne vis pas leur visage, car ils me tournaient le dos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἓξ νεανίσκοι οἱ οἰκοδομοῦντες
  choice: les six jeunes hommes qui construisaient
  rationale: Rend directement le participe substantivé et conserve le lien avec les bâtisseurs déjà présents dans la vision.
- source_word: ἀπήνεγκαν αὐτὴν πρὸς τὸν πύργου
  choice: l’emmenèrent jusqu’à la tour
  rationale: Le verbe implique qu’ils la transportent ou l’emmènent; «emmener» reste naturel sans préciser un mode de transport que le grec ne détaille pas.
- source_word: συμψέλιον
  choice: siège rembourré
  rationale: Terme rare désignant vraisemblablement un siège pourvu d’un coussin; cette formulation concrète évite l’imprécis «siège» tout en restant lisible.
- source_word: ἀπεστραμμένοι ἦσαν
  choice: ils me tournaient le dos
  rationale: Expression française naturelle pour indiquer que leurs visages étaient détournés du narrateur.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La numérotation «X.» est conservée comme repère de section. La répétition de «jusqu’à la tour» reflète celle du grec, tandis que «lui aussi» rend καὶ αὐτό de façon naturelle.
