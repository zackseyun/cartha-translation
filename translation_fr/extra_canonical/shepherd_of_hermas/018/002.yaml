base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/002.yaml
  text: 'I say to you who lead the church and to the first-seaters: do not become like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your heart. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together as one in a pure heart, so that you may receive mercy from the great King. Watch then, children, lest these dissensions of yours deprive you of life. How can you wish to train the Lord’s chosen ones when you yourselves do not have training? Train one another and be at peace among yourselves, so that I also, standing joyfully before the Father, may give an account on behalf of you all to your Lord.'
translation:
  language: fr
  text: 'Je m’adresse à vous qui dirigez l’Église et qui y occupez les premières places : ne devenez pas semblables à des empoisonneurs. Les empoisonneurs portent leurs drogues dans des boîtes ; mais vous, c’est dans votre cœur que vous portez votre drogue et votre poison. Vous vous êtes endurcis et vous ne voulez ni purifier vos cœurs ni unir vos pensées dans un même accord, avec un cœur pur, afin d’obtenir miséricorde auprès du grand Roi. Prenez donc garde, mes enfants, que vos divisions ne vous privent de la vie. Comment voulez-vous instruire ceux que le Seigneur a choisis, alors que vous-mêmes manquez d’instruction ? Instruisez-vous donc les uns les autres et vivez en paix entre vous, afin que moi aussi, me tenant avec joie devant le Père, je puisse rendre compte de vous tous à votre Seigneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: vous qui dirigez l’Église
  rationale: Rend naturellement le participe désignant ceux qui sont à la tête ou exercent la direction de la communauté, sans préciser une fonction ecclésiastique ultérieure.
- source_word: τοῖς πρωτοκαθεδρίταις
  choice: qui y occupez les premières places
  rationale: Préserve l’image concrète des sièges d’honneur et sa critique implicite, sans recourir au néologisme obscur « premiers-siégeants ».
- source_word: τοῖς φαρμακοῖς
  choice: des empoisonneurs
  rationale: Dans le parallèle avec φάρμακον et ἰός, le terme désigne ici ceux qui manipulent ou administrent des substances nocives; « empoisonneurs » exprime clairement la force péjorative.
- source_word: ἐνεσκιρωμένοι
  choice: Vous vous êtes endurcis
  rationale: Le mot évoque quelque chose de durci ou encroûté. « Endurcis » reste intelligible et convient à l’état moral du cœur décrit dans la suite.
- source_word: συνκεράσαι ὑμῶν τὴν φρόνησιν ἐπὶ τὸ αὐτό
  choice: unir vos pensées dans un même accord
  rationale: Traduit l’idée de mêler ou harmoniser leur disposition d’esprit vers une même fin, sans effacer l’appel à l’unité.
- source_word: παιδεύειν / παιδείαν
  choice: instruire / instruction
  rationale: Conserve la répétition lexicale grecque et couvre ici la formation, la correction et l’éducation morale.
- source_word: λόγον ἀποδῶ ὑπὲρ ὑμῶν πάντων
  choice: rendre compte de vous tous
  rationale: Expression française naturelle qui garde la notion de reddition de compte en faveur ou au sujet de tous les destinataires.
theological_decisions:
- issue: Identité et statut des dirigeants de l’Église
  choice: 'Formulation fonctionnelle : « qui dirigez l’Église » et « occupez les premières places »'
  alternative: Employer des titres ecclésiastiques précis comme « évêques », « anciens » ou « présidents »
  rationale: Le grec décrit des responsables et des détenteurs de places d’honneur sans fournir ici de titres techniques permettant d’identifier sûrement une structure ministérielle déterminée.
- issue: Sens de « ceux que le Seigneur a choisis »
  choice: « ceux que le Seigneur a choisis »
  alternative: « les élus du Seigneur »
  rationale: La formulation verbale est claire pour un lectorat moderne et préserve l’élection divine sans charger le passage d’un vocabulaire doctrinal technique.
- issue: Intercession ou reddition de compte devant le Père
  choice: « rendre compte de vous tous à votre Seigneur »
  alternative: « répondre pour vous tous devant votre Seigneur »
  rationale: Le texte associe la position devant le Père à un compte rendu adressé au Seigneur. La traduction conserve cette tension référentielle sans identifier ou distinguer davantage le Père et le Seigneur.
translation_notes:
  register: Français international moderne, digne et direct. Le ton d’admonestation est conservé, ainsi que les images fortes du poison, de l’endurcissement et de la reddition de compte. « Église » prend une majuscule comme désignation de la communauté dans son ensemble; aucun titre confessionnel postérieur n’est introduit.
