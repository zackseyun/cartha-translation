  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: fr
  text: 'À ce sujet, j’étais très troublé, car je voulais connaître cette révélation. Et je vois, dans une vision de la nuit, la femme âgée qui me dit : « Toute demande exige de l’humilité. Jeûne donc, et tu recevras du Seigneur ce que tu demandes. » Je jeûnai donc un jour et, cette même nuit, un jeune homme m’apparut et me dit : « Puisque tu ne cesses de demander des révélations dans tes prières, prends garde que, en demandant trop, tu ne fasses du mal à ton corps. Ces révélations te suffisent. Es-tu capable de voir des révélations plus puissantes que celles que tu as vues ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: profondément troublé
  rationale: Exprime une vive détresse sans suggérer uniquement la tristesse; convient au désir inquiet de comprendre la révélation.
- source_word: ἐρώτησις
  choice: demande
  rationale: Dans ce contexte de jeûne et de requête adressée au Seigneur, le mot désigne mieux une demande qu’une simple question intellectuelle.
- source_word: ταπεινοφροσύνη
  choice: humilité
  rationale: Équivalent français direct et naturel, qui conserve la portée morale et spirituelle du grec.
- source_word: ὑπὸ χεῖρα αἰτεῖς
  choice: tu ne cesses de demander
  rationale: La locution textuellement difficile semble indiquer une demande insistante ou répétée; cette formulation naturelle en restitue l’idée sans surcharger le texte.
- source_word: σάρξ
  choice: corps
  rationale: Ici, le risque causé par des pratiques ascétiques excessives concerne la condition physique; « corps » est plus clair en français courant que « chair ».
- source_word: ἰσχυροτέρας
  choice: plus puissantes
  rationale: Conserve la comparaison littérale concernant l’intensité des révélations, sans la réduire à « plus grandes » ou « plus fortes ».
theological_decisions:
- issue: Rapport entre jeûne, humilité et réception divine
  choice: « Jeûne donc, et tu recevras du Seigneur ce que tu demandes »
  alternative: « Jeûne donc afin de recevoir du Seigneur ce que tu demandes »
  rationale: La coordination grecque énonce la promesse sans expliciter un mécanisme méritoire ou causal que le texte ne formule pas.
- issue: Capacité à recevoir des révélations plus fortes
  choice: « Peux-tu supporter la vue de révélations plus puissantes… ? »
  alternative: « Es-tu capable de voir des révélations plus puissantes… ? »
  rationale: « Supporter la vue » rend explicite l’enjeu suggéré par l’avertissement concernant le corps, tout en gardant la forme interrogative et sans déterminer la nature exacte de cette incapacité.
translation_notes:
  register: Français moderne, international et digne. La narration conserve le passage soudain au présent historique (« je vois »), présent dans le grec. Les paroles rapportées restent simples et directes; aucune terminologie confessionnelle n’est ajoutée.
