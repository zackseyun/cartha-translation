revisions:
- from: 'J’étais profondément troublé par ces choses, car je voulais comprendre cette révélation. Alors, dans une vision nocturne, je vois la femme âgée qui me dit : « Toute demande exige de l’humilité. Jeûne donc, et tu recevras du Seigneur ce que tu demandes. » Je jeûnai donc un jour et, cette nuit-là, un jeune homme m’apparut et me dit : « Puisque tu ne cesses de demander des révélations dans la prière, prends garde qu’en demandant trop, tu ne fasses du mal à ton corps. Ces révélations te suffisent. Peux-tu supporter la vue de révélations plus puissantes que celles que tu as vues ? »'
