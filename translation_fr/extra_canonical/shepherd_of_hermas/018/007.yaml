base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: fr
  text: 'Je lui répondis : « Seigneur, je ne demande qu’une chose : que la révélation concernant les trois apparences de la femme âgée soit complète. » Il me répondit : « Jusqu’à quand resterez-vous sans comprendre ? Ce sont vos hésitations qui vous rendent incapables de comprendre, ainsi que le fait que votre cœur n’est pas tourné vers le Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τριῶν μορφῶν
  choice: trois apparences
  rationale: « Apparences » rend naturellement les trois formes sous lesquelles la femme âgée s’est montrée, sans suggérer trois identités distinctes.
- source_word: πρεσβυτέρας
  choice: femme âgée
  rationale: Le substantif implicite est féminin et désigne la figure féminine âgée déjà mentionnée ; cette formulation est claire en français moderne.
- source_word: ἀσύνετοί
  choice: sans comprendre / incapables de comprendre
  rationale: Le terme vise le manque d’intelligence ou de discernement. La variation française évite la lourdeur tout en conservant le même champ de sens.
- source_word: διψυχίαι
  choice: hésitations
  rationale: Le pluriel désigne des dispositions partagées, indécises ou vacillantes. « Hésitations » est idiomatique et préserve ici l’idée d’irrésolution sans imposer une terminologie doctrinale.
- source_word: μὴ ἔχειν τὴν καρδίαν ὑμῶν πρὸς τὸν Κύριον
  choice: le fait que votre cœur n’est pas tourné vers le Seigneur
  rationale: Cette tournure française exprime naturellement l’orientation intérieure indiquée par πρός.
theological_decisions:
- issue: Sens de διψυχίαι
  choice: hésitations
  alternative: duplicité / cœur partagé
  rationale: Le contexte reproche un manque de compréhension lié à une disposition intérieure vacillante. « Hésitations » conserve cette tension sans réduire le mot à l’hypocrisie morale ni figer une anthropologie particulière.
- issue: Portée du pluriel ὑμῶν après une adresse individuelle
  choice: conserver le pluriel « vos / votre »
  alternative: passer au singulier pour harmoniser avec le narrateur
  rationale: Le jeune homme élargit manifestement le reproche au-delà d’Hermas ; le pluriel grec doit rester perceptible.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct et le passage soudain du singulier au pluriel sont conservés. Aucun marqueur de note n’est requis.
