  text: “What indulgences, sir,” I say, “are harmful?”
translation:
  language: fr
  text: « Quels plaisirs sont nuisibles, Seigneur ? » demandai-je.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί
  choice: formes de plaisir
  rationale: Le pluriel désigne ici différentes manières de rechercher ou de goûter une satisfaction. « Formes de plaisir » reste naturel en français tout en préparant la distinction entre plaisirs nuisibles et salutaires dans la suite.
- source_word: κύριε
  choice: Seigneur
  rationale: Dans cette adresse respectueuse au personnage qui instruit Hermas, « Seigneur » conserve la dignité et la coloration religieuse du grec, sans réduire le terme à un simple « monsieur ».
- source_word: βλαβεραί
  choice: nuisibles
  rationale: Rend directement l'idée de ce qui cause du tort, sans préciser à tort la nature physique, morale ou spirituelle du dommage.
- source_word: φημί
  choice: demandai-je
  rationale: Le présent historique grec introduit une question du narrateur; le passé simple est idiomatique dans un récit français et « demander » explicite naturellement l'acte de parole interrogatif.
theological_decisions:
- issue: Portée morale de τρυφαί
  choice: formes de plaisir
  alternative: plaisirs coupables
  rationale: Le grec pose d'abord la question de ce qui est nuisible, puis la réponse distingue les plaisirs nuisibles des plaisirs salutaires. Ajouter « coupables » résoudrait d'avance cette distinction et importerait un jugement absent de la question.
- issue: Identification de l'interlocuteur par κύριε
  choice: Seigneur
  alternative: monsieur / maître
  rationale: Le mot peut être une adresse honorifique plutôt qu'un titre divin. La majuscule française maintient le registre traditionnel du dialogue spirituel, mais la traduction ne prétend pas identifier l'interlocuteur à Dieu ou au Christ.
translation_notes:
  register: Question brève, directe et digne. La formulation moderne évite « voluptés », trop archaïque et plus fortement connoté, ainsi que « indulgences », anglicisme sémantique peu naturel ici.
