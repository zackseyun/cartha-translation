  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: fr
  text: Ainsi, tourmenté et puni pendant toute l’année, il lui arrive de se souvenir du plaisir et de la tromperie, et il sait que c’est à cause d’eux qu’il souffre ces maux. Tous ceux qui se livrent au plaisir et se laissent tromper sont ainsi tourmentés, car, tout en ayant la vie, ils se sont livrés eux-mêmes à la mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφῶν
  choice: plaisirs / s’adonnent aux plaisirs
  rationale: Dans ce contexte, le terme désigne la jouissance complaisante d’actions mauvaises. « Plaisirs » reste naturel et maintient le lien lexical avec le contexte sans ajouter une catégorie morale absente du mot lui-même.
- source_word: ἀπάτη / ἀπατώμενος
  choice: illusion qui l’a trompé / sont trompés
  rationale: Le grec associe le nom « tromperie, illusion » au passif « être trompé ». La formulation française conserve l’idée d’égarement trompeur et le caractère passif du participe.
- source_word: βασανιζόμενος / βασανίζεται
  choice: tourmenté / subissent de tels tourments
  rationale: « Tourment » rend la force de βάσανος et distingue ce terme de τιμωρία, traduit par la punition.
- source_word: πάσχει τὰ πονηρά
  choice: endure ces maux
  rationale: Expression française naturelle qui conserve le sens général des mauvaises choses subies, sans préciser indûment leur nature.
- source_word: παραδεδώκασι
  choice: se sont livrés eux-mêmes
  rationale: Le choix garde la valeur forte de « livrer, remettre » ainsi que l’insistance du réfléchi ἑαυτούς.
theological_decisions:
- issue: Rapport entre la vie possédée et la mort choisie
  choice: « alors qu’ils ont la vie, ils se sont livrés eux-mêmes à la mort »
  alternative: « bien qu’ils fussent vivants, ils se sont voués à la mort »
  rationale: La traduction conserve la tension du grec entre ζωὴν et θάνατον et n’identifie pas explicitement ces réalités comme seulement physiques ou spirituelles.
- issue: Passage grammatical du singulier au pluriel
  choice: « Tous ceux qui… » suivi du pluriel
  alternative: « Toute personne qui… car ces personnes… »
  rationale: Le grec commence par un singulier généralisant puis passe au pluriel. Le pluriel français transmet la portée universelle tout en évitant une rupture d’accord maladroite.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « tourment » est maintenue pour refléter le réseau lexical grec. Aucun marqueur de note n’est requis.
