revisions:
- from: Celui qui, pendant un seul jour, se livre aux plaisirs, se laisse tromper et fait ce qu’il veut s’est revêtu d’une grande folie. Il ne se rend pas compte de ce qu’il fait, car, le lendemain, il oublie ce qu’il a fait la veille. En effet, les plaisirs et la tromperie n’ont pas de mémoire, à cause de la folie dont il s’est revêtu. Mais si le châtiment et le tourment s’attachent à quelqu’un pendant un seul jour, il subit châtiment et tourment jusqu’à une année entière, car le châtiment et le tourment ont une longue mémoire.
  to: Celui qui, pendant un seul jour, s’adonne au plaisir, se laisse tromper et fait ce qu’il veut s’est revêtu de beaucoup de folie. Il ne comprend pas l’acte qu’il accomplit, car, le lendemain, il oublie ce qu’il a fait la veille. En effet, le plaisir et la tromperie n’ont pas de mémoire, à cause de la folie dont il s’est revêtu. Mais lorsque le châtiment et le tourment s’attachent à quelqu’un pendant un seul jour, celui-ci est puni et tourmenté jusqu’à un an, car le châtiment et le tourment ont une mémoire tenace.
  rationale: 'La correction essentielle porte sur la durée : « jusqu’à un an » traduit la borne exprimée par μέχρις ἐνιαυτοῦ sans en faire une durée obligatoirement complète. Le singulier « le plaisir » rétablit la cohérence avec τρυφή et avec la personnification qui se poursuit dans « n’ont pas de mémoire ». « Beaucoup de folie » reflète plus directement πολλὴν ἀφροσύνην, et « mémoire tenace » rend naturellement en français la « grande mémoire » figurée du grec.'
  reviewer_model: gpt-5.6-terra
