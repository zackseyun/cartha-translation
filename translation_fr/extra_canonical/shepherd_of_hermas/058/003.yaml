base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/003.yaml
  text: “The one who indulges himself and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For indulgence and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.
translation:
  language: fr
  text: Celui qui, pendant un seul jour, s’adonne au plaisir, se laisse tromper et fait ce qu’il veut s’est revêtu de beaucoup de folie. Il ne comprend pas l’acte qu’il accomplit, car, le lendemain, il oublie ce qu’il a fait la veille. En effet, le plaisir et la tromperie n’ont pas de mémoire, à cause de la folie dont il s’est revêtu. Mais lorsque le châtiment et le tourment s’attachent à quelqu’un pendant un seul jour, celui-ci est puni et tourmenté jusqu’à un an, car le châtiment et le tourment ont une mémoire tenace.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶν / τρυφή
  choice: se livre aux plaisirs / les plaisirs
  rationale: Le verbe et le nom désignent ici la recherche complaisante du plaisir ou de la jouissance. Cette formulation naturelle en français garde la portée morale du contexte sans réduire le terme au seul luxe matériel.
- source_word: ἀπατώμενος / ἀπάτη
  choice: se laisse tromper / la tromperie
  rationale: La forme passive peut signifier « être trompé » ou « s’égarer ». « Se laisse tromper » préserve le passif tout en rendant intelligible l’implication personnelle suggérée par le contexte.
- source_word: ἀφροσύνη
  choice: folie
  rationale: « Folie » conserve la force morale et spirituelle du grec, plutôt qu’un simple manque d’intelligence.
- source_word: ἐνδέδυται
  choice: s’est revêtu
  rationale: Maintien de la métaphore vestimentaire répétée dans le grec.
- source_word: οὐ νοεῖ τὴν πρᾶξιν
  choice: il ne se rend pas compte de ce qu’il fait
  rationale: Rendu idiomatique de l’absence de compréhension ou de perception de son propre acte.
- source_word: μέχρις ἐνιαυτοῦ
  choice: jusqu’à une année entière
  rationale: Préserve la limite ou l’extension temporelle exprimée par μέχρις sans imposer une durée plus précise que le texte.
- source_word: μνήμας μεγάλας ἔχει
  choice: ont une longue mémoire
  rationale: Le pluriel grec est idiomatique; cette formulation conserve la personnification et exprime la persistance durable du souvenir de la souffrance.
theological_decisions:
- issue: Rapport entre une journée de plaisir et une année de souffrance
  choice: Conserver l’énoncé comparatif tel quel, sans l’expliquer comme une règle universelle de rétribution divine.
  alternative: Présenter explicitement chaque jour de plaisir coupable comme entraînant exactement une année de châtiment.
  rationale: Le passage emploie une image temporelle forte sur la brièveté du plaisir et la mémoire durable de la souffrance; il ne précise pas ici le mécanisme théologique de cette correspondance.
- issue: Agent du châtiment et du tourment
  choice: Employer une tournure où le châtiment et le tourment « s’attachent » à la personne, sans nommer d’agent.
  alternative: Ajouter que Dieu inflige directement le châtiment.
  rationale: Le grec personnifie τιμωρία et βάσανος et ne nomme pas explicitement l’agent dans ce verset.
translation_notes:
  register: Français moderne, international et digne. La répétition de « châtiment et tourment » ainsi que les métaphores du vêtement, de l’attachement et de la mémoire sont conservées, car elles structurent l’argument du texte grec.
