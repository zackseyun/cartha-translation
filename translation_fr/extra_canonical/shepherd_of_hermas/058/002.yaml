  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/002.yaml
  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: fr
  text: 'Il me répondit : « Ta folie persiste, et tu ne veux pas purifier ton cœur ni servir Dieu. Prends garde, de peur que le temps ne soit accompli et qu’on ne te trouve insensé. Écoute donc, puisque tu le veux, afin que tu comprennes cela. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ ἀφροσύνη σου παράμονός ἐστι
  choice: Ta folie persiste
  rationale: Cette formulation naturelle conserve l’idée d’une folie durable ou obstinée sans alourdir la phrase.
- source_word: καθαρίσαι
  choice: purifier
  rationale: Le verbe garde ici son sens moral et intérieur, appliqué au cœur.
- source_word: δουλεύειν τῷ Θεῷ
  choice: servir Dieu
  rationale: Dans ce contexte religieux, « servir » exprime naturellement le service et la soumission impliqués par δουλεύειν.
- source_word: ὁ χρόνος πληρωθῇ
  choice: le temps n’arrive à son terme
  rationale: La traduction préserve l’idée d’un temps fixé qui s’accomplit, sans préciser davantage sa nature.
- source_word: ἄφρων εὑρεθῇς
  choice: tu ne sois trouvé insensé
  rationale: La tournure conserve le motif grec d’être découvert ou reconnu dans cet état au moment décisif.
- source_word: καθὼς βούλει
  choice: comme tu le souhaites
  rationale: Cette expression renvoie naturellement à la demande préalable d’une explication plus claire.
theological_decisions:
- issue: Le service rendu à Dieu
  choice: servir Dieu
  alternative: être esclave de Dieu
  rationale: « Servir Dieu » transmet fidèlement l’usage religieux courant de δουλεύειν sans introduire en français une connotation sociale inutilement dominante.
- issue: L’accomplissement du temps
  choice: le temps n’arrive à son terme
  alternative: le temps ne soit accompli
  rationale: La formulation retenue reste intelligible en français moderne tout en maintenant l’ambiguïté sur le temps précis et sur l’événement attendu.
translation_notes:
  register: Français moderne, digne et direct. Le discours conserve l’avertissement solennel, la répétition du champ lexical de la folie et le léger contraste entre le refus actuel et le moment où l’état réel du personnage sera constaté.
