base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/001.yaml
  text: “Since,” I say, “sir, I have not understood at all about the time of deception and indulgence and torment, make it more clear to me.”
translation:
  language: fr
  text: « Puisque, dis-je, Seigneur, je n’ai absolument pas compris le temps de la tromperie, du plaisir et du tourment, explique-le-moi plus clairement. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue, le titre respectueux s’adresse à la figure qui instruit Hermas. « Seigneur » conserve le registre ancien et digne, sans identifier pour autant l’interlocuteur à Dieu.
- source_word: χρόνου
  choice: durée
  rationale: Le contexte développe une correspondance entre un jour de plaisir et une année de châtiment ; « durée » rend ici le sens temporel plus naturellement que « temps ».
- source_word: ἀπάτης
  choice: égarement
  rationale: Le terme peut désigner la tromperie ou l’illusion. Dans le contexte moral, « égarement » exprime l’état de celui qui se laisse abuser sans imposer l’idée d’une fraude commise contre autrui.
- source_word: τρυφῆς
  choice: plaisirs
  rationale: Le passage vise les satisfactions complaisantes, bonnes ou mauvaises selon leur objet. « Plaisirs » préserve cette amplitude mieux que « débauche » ou « luxe ».
- source_word: βασάνου
  choice: tourment
  rationale: Rend directement la souffrance punitive évoquée dans la suite du passage.
- source_word: τηλαυγέστερόν μοι δήλωσον
  choice: explique-le-moi plus clairement
  rationale: Formulation française naturelle qui conserve la demande d’un éclaircissement accru.
theological_decisions:
- issue: Identification de l’interlocuteur par κύριε
  choice: Seigneur
  alternative: monsieur / maître
  rationale: Le texte emploie un titre respectueux ambigu. « Seigneur » maintient le registre de l’œuvre sans ajouter une identification christologique ou divine absente de cette phrase.
- issue: Portée morale de ἀπάτη
  choice: égarement
  alternative: tromperie
  rationale: Le choix laisse ouverte la dimension d’illusion ou de séduction morale et s’accorde avec le participe passif ἀπατώμενος dans la suite.
translation_notes:
  register: Français moderne, fluide et digne. La syntaxe dialoguée est conservée, ainsi que l’intensif « absolument » correspondant à ὅλως. Aucun ajout explicatif ni particularisme confessionnel.
