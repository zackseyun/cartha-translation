base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the servants of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: fr
  text: 'Il dit : « Tout ce qu’une personne fait avec plaisir est pour elle une jouissance. En effet, même l’homme coléreux, en donnant à sa passion son content, s’y complaît ; et l’adultère, l’ivrogne, le médisant, le menteur, l’homme avide, celui qui dépouille les autres, ainsi que celui qui commet des actes semblables, donnent à leur propre maladie son content : ils se complaisent donc dans leurs actes. Toutes ces jouissances sont nuisibles aux serviteurs de Dieu. C’est donc à cause de ces tromperies que souffrent ceux qui sont punis et tourmentés. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφᾷ
  choice: jouissance / se livre à cette jouissance
  rationale: Le terme désigne ici le plaisir complaisant tiré d’une conduite, et pas seulement le luxe matériel. « Jouissance » conserve le lien avec ἡδέως et peut s’appliquer aux divers vices énumérés.
- source_word: ὀξύχολος
  choice: homme coléreux
  rationale: Rend directement le caractère prompt à la colère dans un français courant et digne.
- source_word: τῷ ἑαυτοῦ πάθει τὸ ἱκανὸν ποιῶν
  choice: donne libre cours à sa passion
  rationale: Expression française naturelle pour l’idée de satisfaire pleinement ou de rassasier sa passion.
- source_word: κατάλαλος
  choice: médisant
  rationale: Désigne celui qui parle contre autrui ou le dénigre ; « médisant » évite de limiter nécessairement le sens à une accusation juridiquement calomnieuse.
- source_word: πλεονέκτης
  choice: homme avide
  rationale: Exprime le désir d’avoir toujours davantage, sans réduire le terme à la seule cupidité financière.
- source_word: ἀποστερητής
  choice: celui qui dépouille les autres
  rationale: Rend l’idée de priver frauduleusement quelqu’un de ce qui lui revient, dans une formulation immédiatement compréhensible.
- source_word: νόσῳ
  choice: mal
  rationale: La métaphore de la maladie désigne ici le vice intérieur. « Mal » reste naturel tout en conservant sa portée morale.
- source_word: ἀπάτας
  choice: séductions
  rationale: Dans ce contexte, il s’agit de plaisirs trompeurs qui égarent. « Séductions » garde à la fois l’attrait et la tromperie, plutôt que de suggérer seulement des tromperies commises contre autrui.
- source_word: τιμωρούμενοι καὶ βασανιζόμενοι
  choice: punis et tourmentés
  rationale: Conserve la distinction entre sanction et souffrance intense présente dans les deux participes grecs.
theological_decisions:
- issue: Portée morale de πᾶσα πρᾶξις τρυφή ἐστι
  choice: « Toute action est une jouissance […] dès lors qu’elle l’accomplit avec plaisir »
  alternative: « Tout ce qu’une personne fait avec plaisir est une forme de complaisance »
  rationale: La traduction conserve la formulation générale du grec, que la suite précise par des exemples mauvais, sans transformer l’énoncé en condamnation de tout plaisir en soi.
- issue: Lien causal de διὰ ταύτας […] τὰς ἀπάτας
  choice: « à cause de ces séductions »
  alternative: « à cause de ces tromperies »
  rationale: Le choix maintient le renvoi aux jouissances nuisibles comme réalités trompeuses, conformément au vocabulaire de l’ensemble du passage, sans ajouter une doctrine particulière sur la rétribution.
translation_notes:
  register: Français international moderne, accessible et soutenu. La répétition de « jouissance » est volontaire afin de préserver le fil lexical de τρυφή/τρυφᾷ. Aucun marqueur de note n’est nécessaire pour ce segment.
