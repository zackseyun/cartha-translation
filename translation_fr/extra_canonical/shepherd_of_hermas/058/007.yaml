  verdict: approve
  source_fidelity: 'Le texte français rend fidèlement les éléments essentiels du grec : l’existence de « plaisirs » qui sauvent, le fait que beaucoup font le bien mus par leur propre plaisir, le bénéfice pour les serviteurs de Dieu, l’acquisition de la vie, et le contraste avec les plaisirs nuisibles qui entraînent tourments, châtiments et finalement la mort en cas de persistance sans repentir. « Celui qui agit ainsi » explicite de manière acceptable τῷ τοιούτῳ sans ajouter de contenu doctrinal.'
