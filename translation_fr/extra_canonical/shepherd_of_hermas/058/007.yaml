  terminology: « Plaisir » conserve la portée volontairement large de τρυφή, qui peut décrire ici une satisfaction liée aussi bien à une conduite mauvaise qu’à de bonnes œuvres. « Sauvent », « la vie », « se repentir », « tourments » et « châtiments » respectent le registre moral et sotériologique du passage sans en imposer une interprétation confessionnelle.
