base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the servants of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: fr
  text: Mais il existe aussi des plaisirs qui sauvent les êtres humains. En effet, beaucoup prennent plaisir à faire le bien, portés par la joie qu’ils y trouvent. Un tel plaisir est donc bénéfique aux serviteurs de Dieu et procure la vie à celui qui agit ainsi. En revanche, les plaisirs nuisibles mentionnés plus haut leur procurent tourments et châtiments ; et s’ils y persistent sans se repentir, ils se procurent la mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί / τρυφή
  choice: plaisirs / plaisir
  rationale: Dans ce passage, le terme désigne la satisfaction recherchée ou éprouvée dans une conduite, qu’elle soit mauvaise ou bonne. « Plaisir » conserve cette polyvalence mieux que « débauche » ou « complaisance », qui conviendraient mal aux bonnes œuvres.
- source_word: σώζουσαι
  choice: qui sauvent
  rationale: Rend directement le participe grec et préserve la force sotériologique de l’expression sans l’atténuer.
- source_word: τῇ ἑαυτῶν ἡδονῇ φερόμενοι
  choice: portés par la joie qu’ils y trouvent
  rationale: Formulation française naturelle qui exprime l’élan produit par leur propre satisfaction, sans suggérer une contrainte extérieure.
- source_word: σύμφορος
  choice: bénéfique
  rationale: Exprime ce qui est avantageux ou profitable dans un registre moderne et digne.
- source_word: περιποιεῖται
  choice: procure
  rationale: Le même verbe grec est répété pour la vie, les tourments, les châtiments et la mort ; la répétition de « procurer » maintient ce lien rhétorique.
- source_word: ἐπιμένωσι
  choice: persistent
  rationale: Le contexte renvoie à la persévérance dans les plaisirs nuisibles précédemment cités.
- source_word: μετανοήσωσι
  choice: se repentir
  rationale: Rend le sens moral et spirituel de μετανοέω dans ce contexte.
theological_decisions:
- issue: Rapport entre bonnes œuvres, plaisir et salut
  choice: Traduire littéralement « des plaisirs qui sauvent » et « procure la vie »
  alternative: Atténuer en « des plaisirs salutaires » et « contribue à la vie »
  rationale: Le grec formule un lien fort entre le plaisir pris aux bonnes œuvres et la vie. La traduction conserve cette tension sans préciser un mécanisme doctrinal absent du texte.
- issue: Portée de « leur » dans la phrase sur les tourments
  choice: Conserver « leur procurent », selon le grec αὐτοῖς
  alternative: Employer une tournure impersonnelle ou expliciter « à ceux qui s’y livrent »
  rationale: Le référent peut être compris à partir des personnes qui pratiquent les plaisirs nuisibles mentionnés plus haut ; la formulation maintient la continuité pronominale du texte.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition structurante de « plaisir » et de « procurer » reflète le contraste grec entre les conduites qui mènent à la vie et celles qui mènent aux tourments puis à la mort.
