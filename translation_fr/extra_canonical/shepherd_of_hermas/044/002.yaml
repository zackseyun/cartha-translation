base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/002.yaml
  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: fr
  text: 'Il me répond : « Si tu te mets en tête qu’on peut les observer, tu les observeras facilement, et elles ne seront pas difficiles. Mais si l’idée est déjà montée dans ton cœur qu’un être humain ne peut pas les observer, tu ne les observeras pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθῇς
  choice: tu te mets en tête
  rationale: Rend naturellement l’idée de se proposer intérieurement ou de tenir pour établi quelque chose, tout en conservant le contraste avec ce qui monte dans le cœur.
- source_word: φυλαχθῆναι / φυλάξεις
  choice: être observées / tu les observeras
  rationale: Pour des commandements, « observer » est idiomatique, digne et plus précis que « garder » en français moderne.
- source_word: σκληραί
  choice: difficiles
  rationale: Dans ce contexte, le terme qualifie la difficulté à mettre les commandements en pratique, plutôt qu’une dureté physique ou morale.
- source_word: ἐπὶ τὴν καρδίαν σου ... ἀναβῇ
  choice: l’idée est ... montée dans ton cœur
  rationale: Préserve l’image grecque du mouvement vers le cœur, avec l’ajout minimal de « l’idée » pour produire une phrase française intelligible.
- source_word: ὑπὸ ἀνθρώπου
  choice: par un être humain
  rationale: Expression inclusive et fidèle au sens générique de ἄνθρωπος.
theological_decisions:
- issue: Possibilité humaine d’observer les commandements
  choice: Conserver l’affirmation conditionnelle telle quelle
  alternative: L’atténuer en parlant seulement d’effort, ou préciser qu’elle dépend explicitement d’une aide divine
  rationale: Le segment relie directement la conviction de leur possibilité à leur observation. Ajouter ici une doctrine de la grâce ou réduire la portée de l’affirmation résoudrait une tension que le texte ne résout pas dans cette phrase.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement conserve l’adresse personnelle du grec. La répétition d’« observer » reproduit la forte reprise lexicale du passage.
