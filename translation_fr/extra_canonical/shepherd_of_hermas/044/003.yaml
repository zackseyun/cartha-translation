base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: fr
  text: 'Je te le dis : si tu n’observes pas ces commandements, mais que tu les négliges, ne suis pas les commandements du diable[a], qui sont pénibles, amers, cruels et débauchés. Ne crains pas le diable, car il n’a aucun pouvoir contre vous. En effet, je serai avec vous, moi, l’ange de la repentance, qui le domine. Le diable n’a que la peur, mais sa peur est sans force. Ne le craignez donc pas, et il s’enfuira de vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec transmis est corrompu à cet endroit. La restitution « ne suis pas les commandements du diable » s’appuie sur la syntaxe défectueuse, le contexte et l’opposition avec les commandements qui précèdent.
    reason: Signaler la corruption textuelle et la restitution minimale adoptée, sans présenter la formulation précise comme certaine.
lexical_decisions:
- source_word: φυλάσσω / τηρέω
  choice: observer
  rationale: Dans ce contexte de commandements, « observer » exprime naturellement l’idée de garder et de mettre en pratique.
- source_word: παρενθυμέομαι
  choice: négliger
  rationale: Le verbe rare indique ici qu’on écarte les commandements de sa pensée ou qu’on n’en tient pas compte; « négliger » rend clairement cette idée.
- source_word: ἀσελγής
  choice: débauché
  rationale: Le terme désigne ce qui est moralement dissolu ou licencieux; « débauché » conserve sa forte portée morale.
- source_word: κατακυριεύω
  choice: exercer son autorité sur
  rationale: Cette formulation garde l’idée d’une domination effective sans suggérer une propriété.
- source_word: τόνος
  choice: force
  rationale: Au sens figuré, le mot évoque la vigueur ou l’efficacité; « sans force » convient à l’opposition entre la peur inspirée et l’impuissance réelle du diable.
theological_decisions:
- issue: Nature de la puissance du diable
  choice: « il n’a aucun pouvoir contre vous »
  alternative: « il n’y a en lui aucune puissance contre vous »
  rationale: La formulation française naturelle préserve la limitation explicite « contre vous » et n’en fait pas une affirmation abstraite d’impuissance absolue.
- issue: Titre de l’ange
  choice: « l’ange de la repentance »
  alternative: « l’ange du repentir »
  rationale: « Repentance » rend ici la μετάνοια comme retournement moral durable, sans identifier davantage la figure ni importer une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. Le passage du singulier (« te ») au pluriel (« vous »), présent dans le grec, est conservé. Les séries d’adjectifs et les répétitions autour de la peur sont maintenues pour préserver la force exhortative du texte.
