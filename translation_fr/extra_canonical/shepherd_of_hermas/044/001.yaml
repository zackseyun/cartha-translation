  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/001.yaml
  text: But I do not know whether these commandments can be kept by a human being, because they are very hard.
translation:
  language: fr
  text: Mais je ne sais pas si ces commandements peuvent être observés par un être humain, car ils sont extrêmement difficiles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλαχθῆναι
  choice: être observés
  rationale: Dans le contexte de commandements, le verbe signifie les garder en les mettant en pratique; « observer » est naturel et précis en français.
- source_word: ὑπὸ ἀνθρώπου
  choice: par un être humain
  rationale: Rend le sens générique de ἄνθρωπος sans le restreindre au sexe masculin.
- source_word: σκληραί εἰσι λίαν
  choice: ils sont extrêmement difficiles
  rationale: Dans ce contexte, σκληραί décrit les commandements comme difficiles à observer; λίαν renforce nettement l’adjectif.
