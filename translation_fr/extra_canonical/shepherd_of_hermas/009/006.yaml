  terminology: « Jeunes hommes », « confesser mes péchés », « justice » et « maison » sont des choix recevables. « Au sujet de la justice » rétablit plus directement le parallélisme du grec περὶ τῶν ἁμαρτιῶν / περὶ δικαιοσύνης sans imposer une interprétation théologique.
