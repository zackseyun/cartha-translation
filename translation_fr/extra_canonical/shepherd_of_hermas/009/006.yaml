base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: fr
  text: 'Elle arriva avec six jeunes hommes, que j’avais déjà vus auparavant. Elle se tint près de moi et écoutait tandis que je priais et confessais mes péchés au Seigneur. Puis elle me toucha et dit : « Hermas, cesse de poser toutes tes questions au sujet de tes péchés. Demande aussi au sujet de la justice, afin d’en recevoir une part pour ta maison. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκων
  choice: jeunes hommes
  rationale: Rend précisément le masculin pluriel et l’idée de jeunesse, sans suggérer nécessairement des adolescents.
- source_word: κατηκροᾶτο
  choice: m’écouta
  rationale: Le verbe indique une écoute attentive; le français simple convient naturellement au récit.
- source_word: ἐξομολογουμένου ... τὰς ἁμαρτίας μου
  choice: confessais mes péchés
  rationale: Restitue directement l’aveu des péchés au Seigneur, sans ajouter de cadre sacramentel.
- source_word: περὶ τῶν ἁμαρτιῶν σου πάντα ἐρωτῶν
  choice: de tout demander au sujet de tes péchés
  rationale: Préserve la formulation difficile du grec, où πάντα peut porter sur l’étendue de ce qu’Hermas demande, plutôt que de réduire le sens à une simple demande de pardon.
- source_word: περὶ δικαιοσύνης
  choice: ce qui concerne la justice
  rationale: 'Conserve le parallélisme avec « au sujet de tes péchés » et laisse ouverte la portée de δικαιοσύνη : conduite juste, justice ou bienfaits qui lui sont liés.'
- source_word: οἶκόν σου
  choice: ta maison
  rationale: Maintient l’ambivalence de οἶκος, qui peut désigner la maisonnée ou le foyer autant que la maison.
theological_decisions:
- issue: Sens de la demande concernant les péchés
  choice: « cesse de tout demander au sujet de tes péchés »
  alternative: « cesse de toujours demander pour tes péchés »
  rationale: La traduction retenue évite de préciser sans nécessité s’il s’agit de pardon, d’explication ou d’autre chose; elle conserve l’indétermination du grec.
- issue: Portée de δικαιοσύνη
  choice: « ce qui concerne la justice »
  alternative: « la justice » ou « la conduite juste »
  rationale: Cette formulation garde la tension entre la justice comme qualité morale, pratique concrète et réalité dont Hermas peut recevoir une part.
- issue: Portée de οἶκος
  choice: « ta maison »
  alternative: « ta maisonnée »
  rationale: « Maison » préserve mieux la polysémie du terme source sans décider si le propos vise la famille, le foyer ou la demeure.
translation_notes:
  register: Français moderne, sobre et digne. La narration reste fluide, tandis que les ambiguïtés importantes de la parole de la femme sont conservées. Aucun marqueur de note n’est requis.
