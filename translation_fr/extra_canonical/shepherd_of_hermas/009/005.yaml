base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/005.yaml
  text: Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.
translation:
  language: fr
  text: Voyant ces objets disposés là et ne trouvant personne à cet endroit, je fus saisi de stupeur. Une sorte de tremblement s’empara de moi, mes cheveux se dressèrent et, comme j’étais seul, une sorte de frisson me saisit. Puis, revenu à moi-même, me souvenant de la gloire de Dieu et reprenant courage, je me mis à genoux et, comme auparavant, je confessai de nouveau mes péchés au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθαμβος ἐγενόμην
  choice: je fus saisi de stupeur
  rationale: Rend l’intensité de l’étonnement mêlé d’effroi exprimée par ἔκθαμβος, dans un français naturel et digne.
- source_word: ὡσεί τρόμος με ἔλαβεν
  choice: une sorte de tremblement s’empara de moi
  rationale: Conserve l’atténuation comparative de ὡσεί et l’image verbale de la saisie.
- source_word: αἱ τρίχες μου ὀρθαί
  choice: mes cheveux se dressèrent
  rationale: Expression française idiomatique correspondant directement à la réaction physique décrite.
- source_word: ὡσεί φρίκη μοι προσῆλθεν
  choice: un frisson me parcourut
  rationale: Restitue naturellement la sensation d’effroi physique; «comme» est déjà représenté par la formulation «une sorte de» dans la phrase précédente, tandis que le contexte conserve ici la nuance de réaction ressentie.
- source_word: ἐν ἐμαυτῷ οὖν γενόμενος
  choice: revenu à moi
  rationale: Équivalent français courant de l’idiome grec désignant le retour à la maîtrise de soi.
- source_word: ἐξωμολογούμην
  choice: je confessai
  rationale: Dans ce contexte, le complément explicite «mes péchés» impose le sens de confession plutôt que celui de louange ou d’action de grâce.
theological_decisions:
- issue: Sens religieux de ἐξωμολογούμην
  choice: je confessai mes péchés au Seigneur
  alternative: je reconnaissais mes péchés devant le Seigneur
  rationale: La traduction directe «confessai» respecte l’acte pénitentiel explicite sans préciser de forme rituelle ou confessionnelle absente du grec.
- issue: Référent de Κυρίῳ
  choice: au Seigneur
  alternative: devant le Seigneur
  rationale: Le datif grec désigne le destinataire de la confession; «au Seigneur» reste formellement proche et n’ajoute aucune identification doctrinale au-delà du texte.
translation_notes:
  register: Français moderne international, narratif et digne. Le rythme conserve la progression de la peur vers le ressaisissement, le courage, l’agenouillement et la confession. Aucun archaïsme ni particularisme confessionnel n’a été ajouté.
