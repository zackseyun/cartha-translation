base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/003.yaml
  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: fr
  text: 'Je lui demandai : « Dame, à quel endroit du champ ? » Elle répondit : « Où tu voudras. » Je choisis un bel endroit retiré. Mais avant que je lui parle et lui indique le lieu, elle me dit : « Je viendrai là où tu voudras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: Dame
  rationale: Terme d’adresse respectueux qui conserve la distinction avec le titre divin « Seigneur » et convient à la figure âgée de la vision.
- source_word: ἀγροῦ
  choice: champ
  rationale: Rend directement le sens courant de ἀγρός dans ce contexte rural.
- source_word: τόπον καλὸν ἀνακεχωρηκότα
  choice: un bel endroit retiré
  rationale: « Retiré » exprime naturellement l’idée d’un lieu à l’écart portée par ἀνακεχωρηκότα.
- source_word: Ἥξω ἐκεῖ ὅπου θέλεις
  choice: Je viendrai là où tu voudras
  rationale: Conserve la légère redondance spatiale du grec et l’écho à la réponse précédente.
