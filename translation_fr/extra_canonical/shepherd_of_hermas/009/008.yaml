  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/008.yaml
  text: And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”
translation:
  language: fr
  text: 'Après que les jeunes hommes se furent retirés et que nous fûmes seuls, elle me dit : « Assieds-toi ici. » Je lui dis : « Madame, que les anciens s’assoient d’abord. » « Ce que je te dis, dit-elle, c’est de t’asseoir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκους
  choice: jeunes hommes
  rationale: Rend naturellement le pluriel masculin et maintient le lien avec les six personnages mentionnés auparavant.
- source_word: Κυρία
  choice: Madame
  rationale: Terme d’adresse respectueux et naturel en français moderne, sans introduire un titre ecclésiastique absent du grec.
- source_word: πρεσβυτέρους
  choice: anciens
  rationale: Conserve l’ambiguïté entre des hommes âgés et des personnes de rang; le contexte immédiat ne permet pas de trancher nettement.
- source_word: κάθισον
  choice: assieds-toi
  rationale: Impératif direct au singulier, conforme au ton de l’échange.
