lexical_decisions:
- source_word: ἣν εἶδον … τοιαύτη
  choice: Voici … la vision que j’ai eue
  rationale: La tournure grecque est elliptique, littéralement « celle que j’ai vue… telle [était-elle] ». Cette formulation française restitue naturellement l’introduction du récit sans ajouter de contenu.
- source_word: ἀδελφοί
  choice: frères
  rationale: Terme d’adresse communautaire direct, conservé dans son sens premier et traditionnel.
