base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/002.yaml
  text: 'After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you stay, and about the fifth hour I will appear to you and show you what you must see.”'
translation:
  language: fr
  text: 'Après avoir jeûné à plusieurs reprises et supplié le Seigneur de me révéler la vision qu’il avait promis de me montrer par l’intermédiaire de cette femme âgée, celle-ci m’apparut cette nuit-là même et me dit : « Puisque tu éprouves un si grand besoin et que tu désires ardemment tout connaître, va dans le champ où tu as l’habitude de séjourner. Vers la cinquième heure[a], je t’apparaîtrai et te montrerai ce que tu dois voir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La cinquième heure correspond approximativement à la fin de la matinée, le décompte commençant au lever du soleil.
    reason: Aide le lecteur moderne à comprendre l’ancien mode de décompte des heures sans imposer une heure exacte, variable selon la saison.
lexical_decisions:
- source_word: νηστεύσας πολλάκις
  choice: Après avoir jeûné à plusieurs reprises
  rationale: Rend le participe aoriste et la répétition exprimée par πολλάκις dans un français naturel.
- source_word: τὴν ἀποκάλυψιν
  choice: la vision
  rationale: Dans ce contexte narratif, ἀποκάλυψις désigne ce qui doit être dévoilé et montré à Hermas; « vision » évite la répétition peu naturelle « révéler la révélation » tout en respectant le cadre visionnaire.
- source_word: διὰ τῆς πρεσβυτέρας ἐκείνης
  choice: par l’intermédiaire de cette femme âgée
  rationale: πρεσβυτέρα désigne ici la femme âgée déjà connue du récit; la formulation n’importe pas un titre ecclésiastique.
- source_word: οὕτως ἐνδεὴς εἶ
  choice: tu éprouves un si grand besoin
  rationale: Conserve l’idée de manque ou de besoin portée par ἐνδεής sans la transformer en simple curiosité; la construction demeure volontairement ouverte quant à l’objet précis de ce besoin.
- source_word: σπουδαῖος εἰς τὸ γνῶναι πάντα
  choice: tu désires ardemment tout connaître
  rationale: Exprime le zèle et l’empressement de σπουδαῖος dans un français idiomatique.
- source_word: ὅπου χρονίζεις
  choice: où tu as l’habitude de séjourner
  rationale: χρονίζω indique qu’Hermas y passe du temps ou y séjourne régulièrement, plutôt qu’une simple présence ponctuelle.
theological_decisions:
- issue: Nature de l’« apocalypse » promise
  choice: « la vision » dans le texte
  alternative: « la révélation »
  rationale: Le contexte immédiat insiste sur ce qui sera montré et vu. « Vision » convient à la scène sans préciser davantage la nature ou l’autorité théologique de cette révélation.
- issue: Sens de ἐνδεής appliqué à Hermas
  choice: « tu éprouves un si grand besoin »
  alternative: « tu es si démuni » ou « tu es si avide »
  rationale: La traduction retenue préserve l’ambiguïté du grec entre manque, besoin et insuffisance, sans faire de la parole de la femme soit un reproche net, soit un éloge sans réserve.
translation_notes:
  register: Français international moderne, narratif et digne. Les périodes sont légèrement allégées pour rester accessibles, tout en conservant la solennité de la scène et l’ambiguïté de ἐνδεής.
