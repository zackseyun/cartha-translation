base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/004.yaml
  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: fr
  text: Je me rendis donc dans le champ, frères. Je comptai les heures, puis j’arrivai à l’endroit où je lui avais demandé de venir. Là, je vois un lit de repos en ivoire, avec un coussin de lin posé dessus et, par-dessus le coussin, un linge déployé, fait de fine toile de lin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La désignation exacte de ces objets et de la dernière étoffe est incertaine; on pourrait aussi comprendre « une couche », « un oreiller » et « une étoffe de coton fin ».
    reason: Les termes grecs rares συμπέλιον, κεβριδάριον et καρπάσιον admettent des identifications matérielles différentes selon les lexiques et les éditions.
lexical_decisions:
- source_word: ἐγενόμην ... εἰς τὸν ἀγρόν
  choice: Je me rendis ... dans le champ
  rationale: Rend naturellement le déplacement exprimé par la tournure grecque sans calquer « je fus dans le champ ».
- source_word: συνεψήφισα τὰς ὥρας
  choice: Je comptai les heures
  rationale: Conserve l’image concrète du calcul des heures, probablement afin de déterminer l’heure convenue.
- source_word: διεταξάμην αὐτὴν ἐλθεῖν
  choice: où je lui avais demandé de venir
  rationale: Le verbe peut évoquer le fait de fixer ou d’indiquer; « demandé » évite ici le ton excessivement autoritaire de « ordonné ».
- source_word: βλέπω
  choice: je vois
  rationale: Maintient le présent historique soudain du grec au milieu du récit au passé.
- source_word: συμπέλιον ... ἐλεφάντινον
  choice: un lit de repos en ivoire
  rationale: Désigne clairement pour le lecteur moderne un meuble sur lequel on peut s’asseoir ou s’étendre; « en ivoire » suit la formulation grecque.
- source_word: κεβριδάριον λινόῦν
  choice: un coussin de lin
  rationale: Le nom rare désigne vraisemblablement un petit coussin ou oreiller; « coussin » convient au meuble décrit.
- source_word: λεντίον ... λινόῦν καρπάσιον
  choice: un linge ... fait de fine toile de lin
  rationale: « Linge » préserve la généralité de λεντίον, tandis que « fine toile de lin » restitue la qualité textile indiquée sans imposer un usage précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique « je vois » est conservé pour reproduire le changement d’aspect du grec; les objets sont nommés dans un vocabulaire courant, avec l’incertitude lexicale signalée en note.
