  text: And she raised me by the hand and leads me to the couch, and she says to the young men, “Go and build.”
translation:
  language: fr
  text: 'Elle me relève par la main et me conduit vers la banquette, puis elle dit aux jeunes hommes : « Allez construire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήγειρέ με τῆς χειρός
  choice: me releva en me prenant par la main
  rationale: Rend naturellement le geste par lequel elle aide Hermas à se relever, tout en conservant la mention explicite de la main.
- source_word: ἄγει με
  choice: me conduisit
  rationale: Le présent historique grec est rendu au passé pour assurer un récit naturel et cohérent en français.
- source_word: συμπέλιον
  choice: banquette
  rationale: Dans ce contexte, le terme désigne un siège ou banc rembourré; « banquette » reste clair et convient mieux que « couche », qui pourrait suggérer un lit.
- source_word: Ὑπάγετε καὶ οἰκοδομεῖτε
  choice: Allez construire
  rationale: Conserve les deux impératifs et le sens ouvert de οἰκοδομεῖτε, sans préciser l'objet de la construction, absent du grec.
