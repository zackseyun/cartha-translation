  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/009.yaml
  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: fr
  text: 'Comme je voulais m’asseoir à droite, elle ne me le permit pas, mais elle me fit signe de la main de m’asseoir à gauche. Alors que je réfléchissais, attristé qu’elle ne m’ait pas permis de m’asseoir à droite, elle me dit : « Tu es triste, Hermas ? La place à droite appartient à d’autres : à ceux qui ont déjà plu à Dieu et qui ont souffert à cause du Nom[a]. Quant à toi, il te manque encore beaucoup pour pouvoir t’asseoir avec eux. Mais demeure dans ta simplicité, et tu t’assiéras avec eux, tout comme tous ceux qui accompliront leurs œuvres et supporteront ce qu’ils ont eux-mêmes supporté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Le Nom » : le grec dit simplement « le nom », une désignation révérencielle dont le référent demeure implicite dans cette phrase.'
    reason: Préserver l’expression absolue et son ambiguïté réelle sans imposer une explicitation confessionnelle.
lexical_decisions:
- source_word: εἰς τὰ δεξιὰ μέρη / εἰς τὰ ἀριστερὰ μέρη
  choice: à droite / à gauche
  rationale: Formulation française naturelle qui conserve le contraste spatial et symbolique sans ajouter d’interprétation.
- source_word: διαλογιζομένου
  choice: je réfléchissais
  rationale: Rend l’activité intérieure d’Hermas sans lui donner artificiellement le sens de doute ou de contestation.
- source_word: εὐαρεστηκότων τῷ θεῷ
  choice: ont déjà plu à Dieu
  rationale: Traduction directe du parfait, qui présente leur conduite agréée par Dieu comme un fait acquis.
- source_word: εἵνεκα τοῦ ὀνόματος
  choice: à cause du Nom
  rationale: Conserve l’expression absolue et révérencielle du grec au lieu d’expliciter une identité que le texte laisse implicite.
- source_word: ἁπλότητί
  choice: simplicité
  rationale: Préserve le terme central, qui peut évoquer droiture, sincérité et absence de duplicité, sans réduire son amplitude à une seule nuance.
- source_word: ἐμμένεις … μενὸν
  choice: puisque tu demeures … persévère ainsi
  rationale: Reproduit autant que possible le jeu sur le verbe μένω tout en évitant en français une répétition maladroite.
- source_word: ὑπενέγκωσιν
  choice: supporteront
  rationale: Exprime l’endurance sous l’épreuve sans préciser indûment la nature des souffrances.
theological_decisions:
- issue: Référent de « τοῦ ὀνόματος »
  choice: le Nom, avec une majuscule et une note
  alternative: son nom / le nom du Christ
  rationale: Le grec emploie « le nom » absolument. La traduction garde cette formulation chargée de sens sans résoudre explicitement son référent.
- issue: Portée de la promesse « tu t’assiéras avec eux »
  choice: futur affirmatif conservé
  alternative: 'formulation conditionnelle explicite : « alors tu pourras t’asseoir »'
  rationale: Le texte associe persévérance et siège avec les éprouvés, mais n’énonce pas ici une condition grammaticale explicite ; la traduction ne transforme donc pas la parole en système doctrinal.
- issue: Relation entre œuvres, souffrance et place à droite
  choice: énumération fidèle sans explication sotériologique
  alternative: préciser que ces actes méritent ou attestent cette place
  rationale: Le passage rapproche les œuvres et l’endurance de la place accordée, sans définir leur relation théologique exacte.
translation_notes:
  register: Français moderne, international et digne. Le dialogue reste direct et accessible. Les répétitions structurantes sont conservées lorsqu’elles portent le contraste ou l’insistance, mais légèrement modulées quand une reproduction littérale serait peu naturelle.
