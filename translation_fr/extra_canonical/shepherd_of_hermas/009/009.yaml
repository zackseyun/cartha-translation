- from: 'Comme je voulais m’asseoir à droite, elle ne me le permit pas, mais elle me fit signe de la main de m’asseoir à gauche. Alors que je réfléchissais, attristé qu’elle ne m’ait pas permis de m’asseoir à droite, elle me dit : « Tu es triste, Hermas ? La place à droite appartient à d’autres : à ceux qui ont déjà plu à Dieu et qui ont souffert à cause du Nom[a]. Quant à toi, il te manque encore beaucoup pour pouvoir t’asseoir avec eux. Mais puisque tu demeures dans ta simplicité, persévère ainsi, et tu t’assiéras avec eux, tout comme ceux qui accompliront les mêmes œuvres qu’eux et supporteront ce qu’ils ont eux-mêmes supporté. »'
  to: 'Comme je voulais m’asseoir à droite, elle ne me le permit pas, mais elle me fit signe de la main de m’asseoir à gauche. Alors que je réfléchissais, attristé qu’elle ne m’ait pas permis de m’asseoir à droite, elle me dit : « Tu es triste, Hermas ? La place à droite appartient à d’autres : à ceux qui ont déjà plu à Dieu et qui ont souffert à cause du Nom[a]. Quant à toi, il te manque encore beaucoup pour pouvoir t’asseoir avec eux. Mais demeure dans ta simplicité, et tu t’assiéras avec eux, tout comme tous ceux qui accompliront leurs œuvres et supporteront ce qu’ils ont eux-mêmes supporté. »'
