revisions:
- from: 'Elle me répondit : « Ce n’est pas parce que tu serais plus digne que tous les autres que cela t’a été révélé. En effet, d’autres passent avant toi et sont meilleurs que toi ; c’est à eux que ces visions auraient dû être révélées. Mais afin que le nom de Dieu soit glorifié, cela t’a été révélé et te sera encore révélé, à cause de ceux qui sont partagés et qui se demandent dans leur cœur si ces choses sont réelles ou non. Dis-leur que toutes ces choses sont vraies et que rien ne s’écarte de la vérité : elles sont toutes solides, certaines et bien fondées. »'
  to: 'Elle me répondit : « Ce n’est pas parce que tu es plus digne que tous les autres que cela t’a été révélé. En effet, d’autres passent avant toi et sont meilleurs que toi, à qui il convenait que ces visions soient révélées. Mais afin que le nom de Dieu soit glorifié, cela t’a été révélé et te sera encore révélé à cause de ceux qui hésitent et se demandent en leur cœur si ces choses sont bien ainsi ou non. Dis-leur que toutes ces choses sont vraies et que rien n’est en dehors de la vérité ; elles sont toutes solides, certaines et bien fondées. »'
  rationale: 'Révision limitée à des ajustements sûrs de fidélité : « il convenait » reproduit la valeur de ἔδει sans inférer une obligation frustrée ; « sont bien ainsi ou non » préserve l’ouverture de la formule grecque ; « hésitent » explicite naturellement l’état de διψυχία décrit aussitôt par le raisonnement intérieur. Aucun appareil de note n’est requis.'
