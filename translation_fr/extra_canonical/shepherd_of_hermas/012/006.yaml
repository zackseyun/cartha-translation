base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/006.yaml
  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: fr
  text: 'Elle me répondit : « Ce n’est pas parce que tu es plus digne que tous les autres que cela t’a été révélé. En effet, d’autres passent avant toi et sont meilleurs que toi, à qui il convenait que ces visions soient révélées. Mais afin que le nom de Dieu soit glorifié, cela t’a été révélé et te sera encore révélé à cause de ceux qui hésitent et se demandent en leur cœur si ces choses sont bien ainsi ou non. Dis-leur que toutes ces choses sont vraies et que rien n’est en dehors de la vérité ; elles sont toutes solides, certaines et bien fondées. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιώτερος
  choice: plus digne
  rationale: Rend directement le comparatif de mérite sans préciser une dignité morale ou spirituelle que le grec ne définit pas.
- source_word: πρότεροι
  choice: passent avant toi
  rationale: Préserve l’idée de priorité ou de préséance sans la réduire uniquement à l’ancienneté chronologique.
- source_word: διψύχους
  choice: ceux qui sont partagés
  rationale: Exprime l’indécision intérieure suggérée par le terme grec, explicitée immédiatement par la proposition suivante.
- source_word: διαλογιζομένους
  choice: qui se demandent
  rationale: Formulation française naturelle pour le débat intérieur décrit par le grec.
- source_word: ἰσχυρὰ καὶ βέβαια καὶ τεθεμελιωμένα
  choice: solides, certaines et bien fondées
  rationale: Conserve la triple affirmation de force, de fiabilité et de fondement.
theological_decisions:
- issue: Motif de la révélation accordée à Hermas
  choice: afin que le nom de Dieu soit glorifié
  alternative: pour glorifier le nom de Dieu
  rationale: La tournure finale conserve Dieu comme bénéficiaire de la glorification sans attribuer explicitement l’action à Hermas.
- issue: Portée de διὰ τοὺς διψύχους
  choice: à cause de ceux qui sont partagés
  alternative: pour le bien de ceux qui sont partagés
  rationale: Le grec indique que ces personnes motivent la révélation, mais n’explicite pas si la nuance est causale ou bénéficiaire ; la traduction retient une formulation causale sobre.
- issue: Révélation future
  choice: te sera encore révélé
  alternative: continuera de t’être révélé
  rationale: Le futur grec est maintenu sans imposer l’idée d’un processus continu, tandis que « encore » rend naturellement la répétition après le passé.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement est conservé dans le dialogue. La structure argumentative et la triple conclusion emphatique du grec sont maintenues sans archaïsmes.
