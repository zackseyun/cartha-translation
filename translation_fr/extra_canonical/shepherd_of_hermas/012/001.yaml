base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/001.yaml
  text: Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"
translation:
  language: fr
  text: 'Je lui répondis : « Dame, cette affaire est grande et merveilleuse. Qui sont les six jeunes hommes qui bâtissent, Dame ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς λέγω
  choice: Je lui répondis
  rationale: Le participe suivi du présent historique introduit naturellement une réplique; le passé simple convient au récit littéraire français.
- source_word: Κυρία
  choice: Dame
  rationale: Conserve l’adresse respectueuse à la figure féminine sans lui donner le titre féodal plus marqué de « Madame » ou une portée théologique étrangère.
- source_word: μεγάλως καὶ θαυμαστῶς ἔχει
  choice: est grande et merveilleuse
  rationale: Rend idiomatiquement l’expression grecque indiquant le caractère grandiose et étonnant de la chose.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: cette affaire
  rationale: « Affaire » traduit la chose ou la réalité dont il est question dans un français naturel et suffisamment large.
- source_word: οἱ νεανίσκοι οἱ ἓξ
  choice: les six jeunes hommes
  rationale: Rend explicitement le masculin pluriel et l’idée de jeunesse, sans connotation moderne familière.
- source_word: οἱ οἰκοδομοῦντες
  choice: qui bâtissent
  rationale: Le présent garde l’action en cours observée dans la vision; « bâtir » convient au registre architectural et littéraire.
