lexical_decisions:
- source_word: παραφέροντες
  choice: transportent
  rationale: Le verbe désigne ici l’action d’apporter ou de déplacer les pierres jusqu’au chantier ; « transportent » est naturel en français et conserve cette idée sans préciser indûment le mode de déplacement.
- source_word: ἕτεροι
  choice: les autres
  rationale: Ce terme distingue ce second groupe des six jeunes hommes déjà mentionnés ; « les autres » rend clairement ce contraste dans le contexte.
