base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/002.yaml
  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: fr
  text: « Ce sont les saints anges de Dieu, créés les premiers, à qui le Seigneur a confié toute sa création, afin de la faire croître, de la bâtir et de régner sur toute la création. C’est donc par eux que la construction de la tour sera menée à son terme. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πρῶτοι κτισθέντες
  choice: créés les premiers
  rationale: Rend directement l’antériorité exprimée par πρῶτοι et le participe passif κτισθέντες, sans introduire la notion plus technique de « premiers-nés ».
- source_word: παρέδωκεν
  choice: a confié
  rationale: Exprime ici la remise d’une responsabilité ou d’une autorité, plus naturellement que le littéral « a livré ».
- source_word: αὔξειν
  choice: faire croître
  rationale: Conserve la valeur transitive de l’infinitif dans cette série de missions portant sur la création.
- source_word: οἰκοδομεῖν
  choice: bâtir
  rationale: Maintient le vocabulaire architectural central de la vision et son lien avec la construction de la tour.
- source_word: δεσπόζειν
  choice: régner sur
  rationale: Restitue l’exercice d’autorité indiqué par le verbe, dans une formulation française digne et intelligible.
- source_word: τελεσθήσεται
  choice: sera menée à son terme
  rationale: Rend l’idée d’achèvement complet tout en produisant une tournure naturelle avec « construction ».
theological_decisions:
- issue: Étendue et nature du rôle confié aux six anges
  choice: 'Conserver les trois infinitifs coordonnés : faire croître, bâtir et régner'
  alternative: Les résumer par « administrer toute la création »
  rationale: Le grec attribue explicitement ces trois fonctions aux anges. Les condenser effacerait une partie de l’imagerie et pourrait résoudre indûment la portée théologique de leur mission.
- issue: Sens de πρῶτοι appliqué aux anges
  choice: « créés les premiers »
  alternative: « les premiers anges créés » ou « les anges primordiaux »
  rationale: Cette formulation préserve l’affirmation d’une priorité dans l’ordre de la création sans préciser davantage leur rang ou leur nature.
- issue: Agent de l’achèvement de la tour
  choice: « C’est donc par eux »
  alternative: « Ce sont donc eux qui achèveront »
  rationale: La construction passive grecque présente les anges comme les agents par lesquels l’ouvrage sera achevé, sans leur attribuer une autonomie absente du texte.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La répétition de « création » est conservée, car elle reflète πᾶσαν τὴν κτίσιν / τῆς κτίσεως πάσης et souligne l’universalité du mandat. Aucun marqueur de note n’est requis.
