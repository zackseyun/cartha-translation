base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: fr
  text: « Eux aussi sont des saints anges de Dieu ; mais ces six-là leur sont supérieurs. La construction de la tour sera donc menée à son terme, et tous ensemble se réjouiront autour de la tour et glorifieront Dieu, parce que la construction de la tour aura été achevée. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχοντες
  choice: leur sont supérieurs
  rationale: Rend directement l’idée de prééminence ou de rang supérieur, sans préciser la nature de cette supériorité.
- source_word: συντελεσθήσεται
  choice: sera menée à son terme
  rationale: Exprime l’achèvement complet du processus de construction tout en restant naturel en français.
- source_word: εὐφρανθήσονται
  choice: se réjouiront
  rationale: Équivalent courant et digne pour la joie collective annoncée.
- source_word: δοξάσουσιν
  choice: glorifieront
  rationale: Conserve le vocabulaire théologique traditionnel et le sens d’honorer publiquement Dieu.
- source_word: ἐτελέσθη
  choice: aura été achevée
  rationale: Le futur antérieur français marque que l’achèvement précède et motive la glorification dans cette scène future.
theological_decisions:
- issue: Hiérarchie entre les anges
  choice: « ces six-là leur sont supérieurs »
  alternative: « ces six ont autorité sur eux »
  rationale: Le grec affirme une supériorité, mais n’en définit ni la nature ni l’étendue ; la traduction préserve cette indétermination.
- issue: Portée symbolique de la tour
  choice: Aucune interprétation ajoutée dans le texte
  alternative: Identifier explicitement la tour à l’Église
  rationale: Même si le contexte global peut éclairer le symbole, le segment grec ne formule pas ici cette identification ; elle ne doit donc pas être importée.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « construction de la tour » est conservée afin de refléter l’insistance du grec. « Ces six-là » distingue naturellement les six anges déjà mentionnés des autres anges qui transportent les pierres.
