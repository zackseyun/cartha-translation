  text: 3. I asked her, saying, "Lady, I wished to know the outcome of the stones and their power—what sort it is."
translation:
  language: fr
  text: '3. Je lui demandai : « Madame, je voudrais savoir ce qu’il advient des pierres et de quelle nature est leur puissance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησα αὐτὴν λέγων
  choice: Je lui demandai
  rationale: Formulation française naturelle qui rend l’acte de questionner sans conserver le pléonasme sémitisant « en disant ».
- source_word: Κυρία
  choice: Madame
  rationale: Terme d’adresse respectueux et courant, adapté à une figure féminine investie d’autorité sans lui attribuer un titre théologique.
- source_word: ἤθελον γνῶναι
  choice: je voudrais savoir
  rationale: L’imparfait grec exprime ici une demande polie; le conditionnel français en restitue naturellement la nuance.
- source_word: τῶν λίθων τὴν ἔξοδον
  choice: ce qu’il advient des pierres
  rationale: ἔξοδος peut désigner l’issue, le résultat ou le sort; cette formulation conserve l’idée d’aboutissement dans un français clair.
- source_word: τὴν δύναμιν αὐτῶν, ποταπή ἐστιν
  choice: quelle est leur puissance
  rationale: Rend δύναμις par « puissance » et intègre naturellement la question ποταπή ἐστιν (« de quelle sorte est-elle ? »), sans la lourdeur d’une reprise pronominale.
theological_decisions:
- issue: Sens de la « puissance » des pierres
  choice: Conserver le terme « puissance » sans expliquer sa nature
  alternative: Traduire par « signification » ou « vertu »
  rationale: Le grec δύναμις demeure ouvert et le contexte immédiat n’autorise pas à réduire le terme à une interprétation symbolique précise.
- issue: Issue ou sort des pierres
  choice: « ce qu’il advient des pierres »
  alternative: « l’issue des pierres » ou « le sort des pierres »
  rationale: La formulation choisie maintient l’ambiguïté de ἔξοδος entre destinée et résultat tout en restant idiomatique.
translation_notes:
  register: Français moderne, digne et accessible. La phrase est légèrement restructurée pour éviter les tournures grecques peu naturelles, tout en préservant la demande respectueuse et l’ambiguïté lexicale du passage.
