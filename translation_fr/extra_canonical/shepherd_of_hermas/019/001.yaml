review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement les §1–3, qui correspondent au segment lecteur et à l’audit anglais. Les oppositions entre le tutoiement adressé à Hermas et le pluriel visant le groupe sont bien conservées. Une formulation finale plus directe rend plus exactement ἐπαλαιώθητε ταῖς λύπαις ὑμῶν (« vous avez vieilli dans vos chagrins »), sans transformer les chagrins en agents causatifs explicites.
  naturalness: L’ensemble est fluide et de registre moderne soutenu. « Mollesses » est intelligible mais assez marqué et peu naturel dans ce reproche; « faiblesses » est plus idiomatique tout en gardant la proximité sémantique avec l’affaiblissement qui suit. « Indécisions » rend plus nettement le partage intérieur de διψυχίαι que « hésitations ».
  terminology: « Formes », « esprit », « siège », « sommeil », « Seigneur » et « affaires de la vie » sont appropriés. Le maintien de « sommeil » respecte l’euphémisme de κοίμησις. Aucun ajout confessionnel n’est introduit.
  issues:
  - severity: low
    issue: « mollesses et vos hésitations »
    rationale: « Mollesses » est stylistiquement raide en français contemporain, tandis que « hésitations » peut atténuer la notion de cœur/âme partagé(e) portée par διψυχίαι. « Faiblesses et vos indécisions » est plus naturel et plus précis sans surinterpréter.
  - severity: low
    issue: « vos chagrins vous ont fait vieillir »
    rationale: Cette tournure explicite une causalité que le datif grec exprime plus sobrement (« vous avez vieilli dans/par vos chagrins »). La reformulation proposée conserve l’image et la syntaxe conceptuelle du grec.
