base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: fr
  text: « Écoute, dit-il, ce qui concerne les trois formes au sujet desquelles tu t’interroges. Dans la première vision, pourquoi t’est-elle apparue âgée et assise sur un siège ? Parce que votre esprit est vieilli, déjà flétri et sans force, à cause de vos faiblesses et de vos indécisions. De même, en effet, que les vieillards, n’espérant plus retrouver leur vigueur, n’attendent rien d’autre que leur sommeil, de même vous aussi, affaiblis par les affaires de la vie, vous vous êtes abandonnés à l’abattement et vous n’avez pas rejeté vos soucis sur le Seigneur. Au contraire, votre pensée s’est brisée, et vous avez vieilli dans vos chagrins. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: formes
  rationale: Rend directement les trois apparences successives de la femme sans les interpréter comme des états ou des figures symboliques.
- source_word: πρεσβυτέρα
  choice: âgée
  rationale: Dans ce contexte, le comparatif a la valeur descriptive de « vieille/âgée »; « âgée » est naturel et digne en français contemporain.
- source_word: καθέδραν
  choice: siège
  rationale: Désigne ici un siège ou une chaise; « siège » conserve un registre sobre sans suggérer nécessairement une chaire officielle.
- source_word: τὸ πνεῦμα ὑμῶν
  choice: votre esprit
  rationale: Traduction formelle qui préserve la portée anthropologique ou spirituelle de πνεῦμα sans la réduire à l’attitude morale.
- source_word: μαλακιῶν
  choice: mollesses
  rationale: Le terme évoque faiblesse, relâchement et manque de vigueur. « Mollesses » maintient cette image et son reproche moral, en écho à μαλακισθέντες.
- source_word: διψυχιῶν
  choice: hésitations
  rationale: Le mot signifie littéralement un partage intérieur ou une duplicité d’âme; ici « hésitations » exprime l’irrésolution sans importer une doctrine technique.
- source_word: τοῦ ἀνανεῶσαι
  choice: retrouver leur vigueur
  rationale: L’infinitif « renouveler/être renouvelé » est elliptique. Cette formulation naturelle conserve l’idée de renouveau propre au contraste avec le vieillissement.
- source_word: τὴν κοίμησιν αὐτῶν
  choice: leur sommeil
  rationale: Conserve l’euphémisme grec pour la mort plutôt que de l’expliciter dans le texte.
- source_word: τῶν βιωτικῶν πραγμάτων
  choice: les affaires de la vie
  rationale: Rend les préoccupations et réalités de l’existence ordinaire sans les limiter aux biens matériels.
- source_word: ἀκηδίας
  choice: l’abattement
  rationale: Le pluriel grec couvre découragement, insouciance et torpeur morale. « Abattement » convient au contexte des soucis et des chagrins, sans techniciser le terme en « acédie ».
- source_word: ἐπερίψατε
  choice: avez rejeté
  rationale: Préserve l’image énergique de jeter ou déposer ses soucis sur le Seigneur, avec une résonance scripturaire naturelle.
- source_word: διάνοια
  choice: pensée
  rationale: Désigne l’intelligence ou la disposition intérieure; « pensée » évite de réduire le terme soit au seul intellect, soit au seul cœur.
theological_decisions:
- issue: Référent du vieillissement spirituel
  choice: « votre esprit est vieilli »
  alternative: « votre disposition intérieure a vieilli »
  rationale: Le grec dit explicitement πνεῦμα. La traduction conserve ce mot et laisse ouverte sa nuance anthropologique, morale ou spirituelle.
- issue: διψυχία comme état intérieur
  choice: « hésitations »
  alternative: « duplicité » ou « cœur partagé »
  rationale: Le passage reproche surtout le manque de fermeté. « Hésitations » reste accessible et ne tranche pas entre doute, indécision et double loyauté.
- issue: κοίμησις comme euphémisme de la mort
  choice: « sommeil »
  alternative: « mort »
  rationale: Le maintien de l’image respecte la formulation grecque et sa possible portée théologique sans l’expliciter.
- issue: Allusion à l’abandon des soucis au Seigneur
  choice: « rejeté vos soucis sur le Seigneur »
  alternative: « confié vos soucis au Seigneur »
  rationale: La traduction conserve le geste métaphorique du verbe grec, probablement empreint du langage scripturaire, plutôt que de le lisser.
translation_notes:
  register: Français moderne, accessible et soutenu. Le tutoiement singulier est conservé lorsque l’interlocuteur s’adresse à Hermas, puis le pluriel « vous/votre » lorsque le reproche vise la communauté. Les images du flétrissement, du sommeil, du rejet des soucis et de la pensée brisée sont maintenues. Le segment demandé correspond aux §1–3; la question et l’explication supplémentaires du §4, bien que présentes dans la source parentale, ne sont pas incluses.
