- from: « Écoute, dit-il, ce qui concerne les trois formes au sujet desquelles tu t’interroges. Dans la première vision, pourquoi t’est-elle apparue âgée et assise sur un siège ? Parce que votre esprit est vieilli, déjà flétri et sans force, à cause de vos mollesses et de vos hésitations. De même, en effet, que les vieillards, n’espérant plus retrouver leur vigueur, n’attendent rien d’autre que leur sommeil, de même vous aussi, affaiblis par les affaires de la vie, vous vous êtes abandonnés à l’abattement et vous n’avez pas rejeté vos soucis sur le Seigneur. Au contraire, votre pensée s’est brisée, et vos chagrins vous ont fait vieillir. »
