  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/002.yaml
  text: “Why then was she seated in a chair? I wanted to know, sir.” “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be supported. You have the pattern of the first vision.”
translation:
  language: fr
  text: « Pourquoi donc était-elle assise sur une chaise ? Je voulais le savoir, monsieur. » « Parce que toute personne faible s’assied sur une chaise à cause de sa faiblesse, afin de soutenir la faiblesse de son corps. Tu as l’explication de la première vision. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: siège
  rationale: Le terme désigne ici un siège sur lequel une personne affaiblie peut s’asseoir. « Siège » est naturel et évite les connotations modernes, souvent fonctionnelles ou institutionnelles, de « chaise » ou « chaire ».
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif peut signifier « seigneur » ou une adresse respectueuse comme « monsieur ». La majuscule conserve l’ambiguïté possible de l’interlocuteur céleste sans ajouter une identification explicite.
- source_word: συνκρατηθῇ
  choice: soit soutenue
  rationale: Dans ce contexte corporel, le verbe exprime l’idée de maintenir ou soutenir la faiblesse du corps; cette formulation française est claire sans prétendre que la faiblesse elle-même disparaît.
- source_word: τύπον
  choice: représentation
  rationale: Le mot renvoie au sens ou au modèle figuratif offert par la vision. « Représentation » convient au contexte visionnaire et reste accessible.
theological_decisions:
- issue: Sens de κύριε comme formule d’adresse
  choice: Seigneur
  alternative: monsieur
  rationale: Le grec ne tranche pas à lui seul entre un titre élevé et une formule respectueuse. Le choix traditionnel « Seigneur » préserve la solennité et l’éventuelle dimension céleste de l’interlocuteur, sans le nommer.
- issue: Portée de τύπος
  choice: la représentation de la première vision
  alternative: le sens figuré de la première vision
  rationale: « Représentation » maintient l’idée d’une correspondance symbolique sans développer une interprétation doctrinale qui n’est pas exprimée dans le texte.
translation_notes:
  register: Français moderne, digne et lisible. Le dialogue est ponctué naturellement; la répétition de « faiblesse » est conservée parce qu’elle structure explicitement l’explication grecque.
