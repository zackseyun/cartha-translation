base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/006.yaml
  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: fr
  text: '« Moi donc, dit-il, je ne donne pas occasion à ce que cette pratique soit ainsi menée à son terme, mais afin que celui qui a péché ne pèche plus. Quant à son péché antérieur, il y a quelqu’un qui peut lui accorder la guérison : c’est lui qui a autorité sur toutes choses. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφορμή
  choice: prétexte
  rationale: Le terme désigne ici une occasion ou un point d’appui qui pourrait servir à justifier la poursuite de la conduite évoquée; « prétexte » rend naturellement cette nuance dans le contexte.
- source_word: πρᾶξις
  choice: conduite
  rationale: « Conduite » renvoie à la manière d’agir discutée dans le contexte sans réduire le mot à un acte ponctuel.
- source_word: συντελῆται
  choice: se poursuive
  rationale: Dans ce contexte, le verbe évoque l’accomplissement ou la continuation de cette ligne de conduite; « se poursuive » donne un français naturel sans en durcir le sens.
- source_word: ἴασιν δοῦναι
  choice: apporter la guérison
  rationale: Cette expression conserve l’image grecque de la guérison appliquée au péché plutôt que de l’expliciter par « pardonner ».
- source_word: τὴν ἐξουσίαν
  choice: autorité
  rationale: « Autorité » rend le pouvoir légitime et souverain exprimé par ἐξουσία.
theological_decisions:
- issue: Identité de celui qui peut apporter la guérison
  choice: « il y en a un » en minuscules, suivi de « c’est lui »
  alternative: « il y a Quelqu’un » ou « Celui qui » avec majuscules
  rationale: Le contexte désigne clairement Dieu, mais le grec ne porte pas de capitalisation théologique distinctive. La formulation retenue garde la référence compréhensible sans ajouter un marquage confessionnel.
- issue: Finalité de l’enseignement donné
  choice: « mais je veux que celui qui a péché cesse de pécher »
  alternative: « mais afin que celui qui a péché ne pèche plus »
  rationale: La tournure explicite naturellement en français la valeur finale de εἰς τὸ μηκέτι ἁμαρτάνειν, sans suggérer que la disposition précédente autorise ou encourage le péché.
translation_notes:
  register: Français moderne, courant et digne. Le discours direct et l’incise « dit-il » sont conservés. La métaphore de la guérison et l’affirmation finale d’autorité restent intactes, sans explicitation doctrinale ajoutée.
