revisions:
- from: « Ainsi donc, dit-il, je n’offre pas un prétexte pour que cette conduite se poursuive de cette manière, mais je veux que celui qui a péché cesse de pécher. Quant à son péché passé, il y en a un qui peut lui apporter la guérison, car c’est lui qui a autorité sur toutes choses. »
  to: '« Moi donc, dit-il, je ne donne pas occasion à ce que cette pratique soit ainsi menée à son terme, mais afin que celui qui a péché ne pèche plus. Quant à son péché antérieur, il y a quelqu’un qui peut lui accorder la guérison : c’est lui qui a autorité sur toutes choses. »'
  rationale: La révision restitue la mise en relief de ἐγὼ, la valeur finale de εἰς τὸ μηκέτι ἁμαρτάνειν et le sens d'accomplissement de συντελῆται. Elle conserve l'ambiguïté graphique du grec quant à l'identité de celui qui peut donner guérison, sans imposer de capitalisation théologique.
