review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « Ainsi donc » traduit de façon trop inférentielle ἐγὼ οὖν, qui met plutôt le locuteur en relief (« Moi donc »). Surtout, εἰς τὸ μηκέτι ἁμαρτάνειν exprime la finalité de l'enseignement et non une volonté personnelle explicitement formulée par « je veux ».
  naturalness: Le français est fluide et de registre approprié. « Pour que cette conduite se poursuive de cette manière » est un peu lourd; « pour que cette pratique soit ainsi menée à son terme » reflète plus directement le grec tout en restant naturel. « Celui qui a péché » convient.
  terminology: « Prétexte » est possible pour ἀφορμή, mais « occasion » est plus direct et moins suggestif d'une excuse verbale. « Pratique » convient bien à πρᾶξις. « Guérison » conserve l'image de ἴασις, et « autorité sur toutes choses » rend correctement τὴν ἐξουσίαν πάντων.
  issues:
  - severity: medium
    issue: « je veux que » introduit une volonté qui n'est pas formulée dans le grec.
    rationale: Le texte porte ἀλλὰ εἰς τὸ μηκέτι ἁμαρτάνειν, « mais afin que [le pécheur] ne pèche plus ». Il faut conserver la construction finale sans ajouter explicitement βούλομαι ou θέλω.
  - severity: low
    issue: « Ainsi donc » et « se poursuive » affaiblissent certaines nuances du grec.
    rationale: ἐγὼ οὖν souligne « moi »; συντελῆται désigne l'accomplissement/la mise à exécution de la pratique, pas seulement sa continuation. Une légère révision améliore la fidélité.
  revised_text: '« Moi donc, dit-il, je ne donne pas occasion à ce que cette pratique soit ainsi menée à son terme, mais afin que celui qui a péché ne pèche plus. Quant à son péché antérieur, il y a quelqu’un qui peut lui accorder la guérison : c’est lui qui a autorité sur toutes choses. »'
