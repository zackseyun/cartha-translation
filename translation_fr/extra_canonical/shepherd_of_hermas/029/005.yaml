base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: fr
  text: '« Ce n’est pas seulement lorsqu’une personne souille son corps qu’il y a adultère, dit-il ; celui qui fabrique des images à la manière des païens[a] commet aussi un adultère. Si donc quelqu’un persiste dans de telles pratiques et ne se repent pas, tiens-toi loin de lui et ne vis pas avec lui ; sinon, toi aussi, tu participes à son péché. Voilà pourquoi il vous a été ordonné de rester seuls, qu’il s’agisse d’un homme ou d’une femme : dans de tels cas, en effet, il peut y avoir repentance. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « pratique les mêmes choses que les païens ». Dans ce contexte, les « images » peuvent évoquer des représentations idolâtres.'
    reason: Le tour τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν est inhabituel et peut désigner soit la fabrication d’images, soit, plus largement, l’imitation de pratiques attribuées aux nations. La note préserve cette ambiguïté.
lexical_decisions:
- source_word: μοιχεία / μοιχᾶται
  choice: adultère / commet un adultère
  rationale: Conserve la métaphore explicite de l’adultère, appliquée d’abord à la souillure sexuelle puis à une pratique païenne vraisemblablement idolâtre.
- source_word: τὴν σάρκα αὐτοῦ μιάνῃ
  choice: souille son corps
  rationale: « Corps » est plus naturel en français courant que le littéral « chair » dans ce contexte, tout en maintenant l’idée de profanation exprimée par μιάνῃ.
- source_word: τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν
  choice: fabrique des images à la manière des païens
  rationale: ὁμοιώματα peut désigner des représentations ou images, et le datif τοῖς ἔθνεσιν indique ici la conformité aux pratiques des nations païennes. La note conserve l’ambiguïté possible de l’expression.
- source_word: ἀπέχου ἀπ᾽ αὐτοῦ
  choice: tiens-toi loin de lui
  rationale: Expression française directe qui rend l’impératif de séparation sans ajouter une rupture définitive.
- source_word: μὴ συνζῆθι αὐτῷ
  choice: ne vis pas avec lui
  rationale: Rend simplement la cohabitation ou vie commune visée par συνζάω, dans la continuité du contexte conjugal.
- source_word: μέτοχος
  choice: tu participes à
  rationale: Exprime la participation ou solidarité dans le péché sans suggérer nécessairement que la faute est identique.
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  choice: rester seuls
  rationale: Dans le contexte de conjoints séparés auxquels il est interdit de se remarier, cette formulation signifie demeurer sans conjoint tout en évitant de préciser davantage que le grec.
- source_word: μετάνοια
  choice: repentance
  rationale: Terme théologique français courant qui comprend le changement de disposition et de conduite, et non le seul regret.
theological_decisions:
- issue: Portée métaphorique de l’adultère
  choice: Maintenir « commet lui aussi un adultère » pour la pratique païenne évoquée.
  alternative: Traduire par « est infidèle à Dieu » ou expliciter « idolâtrie ».
  rationale: Le texte grec emploie directement le verbe μοιχᾶται. L’expliciter comme infidélité à Dieu ou idolâtrie résoudrait une métaphore que le texte laisse formulée comme adultère.
- issue: Possibilité de repentance et statut conjugal
  choice: « la repentance reste possible » et « rester seuls ».
  alternative: « ils peuvent encore se repentir » et « ne pas se remarier ».
  rationale: Le contexte implique l’absence de remariage afin de laisser place à une réconciliation après repentance, mais le grec de ce segment formule plus largement la possibilité de repentance et le fait de rester seul. La traduction préserve cette articulation sans transformer l’implication en formulation explicite.
- issue: Participation au péché du conjoint persistant
  choice: « tu participes à son péché ».
  alternative: « tu deviens coupable du même péché ».
  rationale: μέτοχος indique le partage ou la participation. La traduction évite d’affirmer que la personne séparée et celle qui persiste ont commis matériellement le même acte.
translation_notes:
  register: Français moderne, international et digne. Les phrases restent directes et accessibles. Le dialogue est conservé, ainsi que la tension entre séparation, non-participation au péché et possibilité ultérieure de repentance.
