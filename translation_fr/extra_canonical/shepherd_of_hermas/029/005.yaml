  terminology: « Adultère », « souille son corps », « ne vis pas avec lui », « participes à son péché » et « repentance » sont appropriés. « Païens » est naturel dans ce contexte ; la note doit continuer de signaler qu'il n'est pas certain que ὁμοιώματα vise exclusivement la fabrication d'images idolâtres.
