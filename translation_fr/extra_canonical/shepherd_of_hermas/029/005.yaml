revisions:
- from: '« Il n’y a pas adultère seulement lorsqu’une personne souille son corps, dit-il ; celui qui fabrique des images à la manière des païens[a] commet lui aussi un adultère. Si donc quelqu’un persiste dans de telles pratiques et ne se repent pas, tiens-toi loin de lui et ne vis pas avec lui ; sinon, toi aussi, tu participes à son péché. Voilà pourquoi il vous a été ordonné de rester seuls, qu’il s’agisse d’un homme ou d’une femme : dans de tels cas, en effet, la repentance reste possible. »'
  to: '« Ce n’est pas seulement lorsqu’une personne souille son corps qu’il y a adultère, dit-il ; celui qui fabrique des images à la manière des païens[a] commet aussi un adultère. Si donc quelqu’un persiste dans de telles pratiques et ne se repent pas, tiens-toi loin de lui et ne vis pas avec lui ; sinon, toi aussi, tu participes à son péché. Voilà pourquoi il vous a été ordonné de rester seuls, qu’il s’agisse d’un homme ou d’une femme : dans de tels cas, en effet, il peut y avoir repentance. »'
  rationale: La révision améliore l'idiomaticité de l'ouverture et rend littéralement la possibilité de repentance, sans modifier la portée du passage. Elle conserve « images » dans le texte tout en maintenant en note l'ambiguïté de l'expression grecque.
