base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a servant of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: fr
  text: '« Car si cette pensée monte dans ton cœur, tu pécheras ; et si d’autres pensées tout aussi mauvaises y montent, tu commets un péché. Car une telle pensée est un grand péché pour un serviteur de Dieu ; et si quelqu’un accomplit cet acte mauvais, il attire sur lui-même la mort. Veille donc sur toi : tiens-toi loin de cette pensée. En effet, là où demeure la dignité morale, l’iniquité ne doit pas monter dans le cœur d’un homme juste. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθύμησις
  choice: pensée
  rationale: Dans ce contexte, le terme désigne une pensée intérieure entretenue ou envisagée. « Pensée » reste naturel et n’ajoute pas l’idée plus précise d’une intention arrêtée.
- source_word: διαμαρτήσεις
  choice: tu commettras une faute
  rationale: Le verbe exprime ici le fait de mal agir ou de transgresser. Cette formulation le distingue de ἁμαρτίαν ἐργάζῃ, rendu juste après par « tu commets un péché ».
- source_word: σεμνότης
  choice: dignité morale
  rationale: Le mot évoque une conduite digne, honorable et moralement sérieuse. Ce choix préserve sa distinction avec ἁγνεία, la pureté ou chasteté mentionnée dans le contexte précédent.
- source_word: ἀνομία
  choice: iniquité
  rationale: Le terme désigne ce qui s’oppose à la loi et à la justice. « Iniquité » convient au registre moral soutenu du passage sans imposer une référence à une législation particulière.
- source_word: θάνατον ἑαυτῷ κατεργάζεται
  choice: il attire sur lui-même la mort
  rationale: Cette tournure française exprime naturellement le résultat produit contre soi-même, sans préciser si la mort est physique, spirituelle ou eschatologique.
theological_decisions:
- issue: Nature de la mort provoquée par l’acte mauvais
  choice: Conserver simplement « la mort »
  alternative: Préciser « la mort spirituelle » ou « la condamnation »
  rationale: Le grec θάνατον ne qualifie pas cette mort. La traduction conserve donc l’indétermination théologique du texte.
- issue: Statut moral de la pensée intérieure
  choice: Affirmer avec le texte qu’une telle pensée constitue un grand péché
  alternative: Limiter le péché au consentement prolongé ou à l’acte extérieur
  rationale: Le passage qualifie explicitement αὕτη ἡ ἐνθύμησις de « grand péché » pour un serviteur de Dieu ; la traduction ne réduit ni ne systématise cette affirmation.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement est conservé parce qu’il correspond à l’adresse singulière du grec. L’ellipse de « et si d’autres choses tout aussi mauvaises » est légèrement explicitée par « s’il y monte d’autres pensées » afin d’être intelligible en français, le mouvement « monter au cœur » étant repris du membre précédent.
