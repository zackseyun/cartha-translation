revisions:
- from: '« Car si cette pensée monte à ton cœur, tu commettras une faute ; et s’il y monte d’autres pensées tout aussi mauvaises, tu commets un péché. Car une telle pensée est un grand péché pour un serviteur de Dieu ; et si quelqu’un accomplit cet acte mauvais, il attire sur lui-même la mort. Veille donc sur toi : tiens-toi loin de cette pensée. En effet, là où demeure la dignité morale, l’iniquité ne doit pas monter au cœur d’un homme juste. »'
  to: '« Car si cette pensée monte dans ton cœur, tu pécheras ; et si d’autres pensées tout aussi mauvaises y montent, tu commets un péché. Car une telle pensée est un grand péché pour un serviteur de Dieu ; et si quelqu’un accomplit cet acte mauvais, il attire sur lui-même la mort. Veille donc sur toi : tiens-toi loin de cette pensée. En effet, là où demeure la dignité morale, l’iniquité ne doit pas monter dans le cœur d’un homme juste. »'
  rationale: La révision corrige la syntaxe, rend διαμαρτήσεις par « tu pécheras » sans l’atténuer, et emploie « dans le cœur » pour une tournure française naturelle qui conserve l’image textuelle. Elle ne précise pas la nature de la mort ni ne modifie l’évaluation morale du texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:51Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu et l’ambiguïté de « la mort » est correctement préservée. Toutefois, « tu commettras une faute » atténue inutilement le champ de διαμαρτήσεις, qui appartient ici au vocabulaire du péché, et le second membre introduit une formulation grammaticalement défectueuse (« s’il y monte d’autres pensées »).
  naturalness: Le registre est globalement naturel et digne. La correction de la construction du second membre est nécessaire. « Monter dans ton cœur » est plus idiomatique en français tout en conservant l’image du grec.
  terminology: « Péché », « serviteur de Dieu », « acte mauvais », « mort », « iniquité » et « homme juste » conviennent. « Dignité morale » est défendable pour σεμνότης, en conservant une nuance distincte de la chasteté/pureté du contexte immédiat.
  issues:
  - severity: medium
    issue: Atténuation de διαμαρτήσεις par « tu commettras une faute »
    rationale: Dans ce développement, διαμαρτάνω désigne le fait de pécher; « faute » peut être compris comme une simple erreur et affaiblit la qualification morale explicite du passage.
  - severity: high
    issue: 'Construction fautive : « s’il y monte d’autres pensées »'
    rationale: Après la conjonction conditionnelle, le sujet pluriel exige « si d’autres pensées ... y montent ». La formulation actuelle nuit à l’intelligibilité.
  - severity: low
    issue: Ajout explicatif de « pensées » dans le second membre
    rationale: Le grec emploie elliptiquement « d’autres [choses] semblablement mauvaises ». Vu la référence immédiate à « cette pensée », « d’autres pensées » est une explicitation contextuelle sûre et plus naturelle en français.
  revised_text: '« Car si cette pensée monte dans ton cœur, tu pécheras ; et si d’autres pensées tout aussi mauvaises y montent, tu commets un péché. Car une telle pensée est un grand péché pour un serviteur de Dieu ; et si quelqu’un accomplit cet acte mauvais, il attire sur lui-même la mort. Veille donc sur toi : tiens-toi loin de cette pensée. En effet, là où demeure la dignité morale, l’iniquité ne doit pas monter dans le cœur d’un homme juste. »'
