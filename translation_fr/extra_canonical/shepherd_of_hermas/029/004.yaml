  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/004.yaml
  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the servants of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: fr
  text: '« Tant qu’il l’ignore, dit-il, il ne pèche pas. Mais si le mari apprend le péché de sa femme, et qu’elle ne se repente pas mais persiste dans son inconduite sexuelle, alors, s’il continue à vivre avec elle, il devient coupable de son péché et complice de son adultère.


    — Que doit donc faire le mari, Seigneur, dis-je, si sa femme persiste dans cette passion ?


    — Qu’il se sépare d’elle, dit-il, et qu’il demeure seul. Mais si, après s’être séparé de sa femme, il en épouse une autre, lui aussi commet un adultère.


    — Si donc, Seigneur, dis-je, après avoir été ainsi séparée, la femme se repent et désire retourner auprès de son mari, ne doit-il pas l’accueillir ?


    — Certainement, dit-il. Si le mari ne l’accueille pas, il pèche et se charge lui-même d’un grand péché. Il faut accueillir celui qui a péché et qui se repent — mais pas à maintes reprises, car, pour les serviteurs de Dieu, il n’y a qu’une seule repentance.[a] C’est donc à cause de la repentance que le mari ne doit pas se remarier. Cette règle vaut aussi bien pour la femme que pour l’homme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car, pour les serviteurs de Dieu, la repentance est une ». Dans ce passage, cette affirmation est liée à l’accueil du conjoint repentant ; sa portée exacte demeure discutée.'
    reason: Le grec formule de manière absolue une « repentance unique », tandis que le contexte immédiat concerne le retour du conjoint après l’adultère. La note préserve cette tension sans imposer une interprétation.
lexical_decisions:
- source_word: ἄχρι τῆς ἀγνοίας
  choice: tant qu’il l’ignore
  rationale: Rend naturellement la limite temporelle exprimée par ἄχρι et l’absence de connaissance du mari.
- source_word: πορνεία
  choice: inconduite sexuelle
  rationale: Dans ce contexte matrimonial, le terme désigne une conduite sexuelle illicite persistante; ce choix conserve une portée plus large que le seul adultère, lequel traduit explicitement μοιχεία dans la proposition suivante.
- source_word: συνζῇ / συνζῶν
  choice: vivre avec / continuer à vivre avec
  rationale: Traduit la cohabitation conjugale sans ajouter une précision sexuelle absente du verbe grec.
- source_word: μέτοχος
  choice: complice
  rationale: Exprime une participation morale au péché; « participant » serait plus formel mais moins idiomatique ici.
- source_word: ἀπολυσάτω
  choice: qu’il se sépare d’elle
  rationale: Le verbe peut signifier renvoyer ou divorcer. « Se séparer » préserve l’ambiguïté juridique et cadre avec l’ordre ultérieur de ne pas se remarier.
- source_word: πάθος
  choice: passion
  rationale: Conserve le langage moral et affectif du grec sans le réduire à un acte isolé.
- source_word: μετάνοια
  choice: repentance
  rationale: Terme théologique courant qui rend à la fois le retournement intérieur et l’abandon du péché.
- source_word: πρᾶξις
  choice: règle
  rationale: Dans la phrase finale, le mot vise la conduite prescrite dans ce cas; « règle » est intelligible et évite le littéral peu naturel « pratique ».
theological_decisions:
- issue: Portée de « μία μετάνοια »
  choice: « il n’y a qu’une seule repentance », avec note
  alternative: « la repentance n’est accordée qu’une fois » ou « on ne doit l’accueillir qu’une fois »
  rationale: Le grec rattache explicitement μία à μετάνοια et affirme une repentance unique pour les serviteurs de Dieu. La note signale la difficulté sans résoudre la tension doctrinale ni élargir artificiellement la portée de l’énoncé.
- issue: Nature de la séparation ordonnée
  choice: « se sépare d’elle »
  alternative: « divorce d’avec elle » ou « la renvoie »
  rationale: ἀπολύω peut avoir une portée de divorce, mais le texte insiste surtout sur la cessation de la vie commune et l’interdiction du remariage. Le choix français ne préjuge pas du statut juridique précis.
- issue: Obligation de recevoir le conjoint repentant
  choice: 'formulation impérative générale : « Il faut accueillir celui qui a péché et qui se repent »'
  alternative: limiter explicitement l’accueil à l’épouse adultère
  rationale: Le grec passe au masculin générique τὸν ἡμαρτηκότα καὶ μετανοοῦντα, puis précise que la règle vaut aux deux sexes; la formulation conserve cette réciprocité.
translation_notes:
  register: Français moderne, international et digne; dialogue clairement structuré. Le titre d’adresse κύριε est rendu par « Seigneur », conformément au rapport du narrateur avec le personnage qui lui donne le commandement. Les formulations restent accessibles tout en conservant les répétitions et la rigueur morale du passage.
