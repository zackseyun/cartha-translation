review_pass:
  verdict: revise
  source_fidelity: 'Le texte suit fidèlement la séquence grecque : ignorance du mari, persistance de l’épouse dans la πορνεία, responsabilité du mari qui continue à vivre avec elle, séparation, accueil du conjoint repentant et interdiction d’un nouveau mariage. « Inconduite sexuelle » maintient utilement la distinction avec μοιχεία (« adultère »). Une correction est toutefois indiquée pour διὰ τὴν μετάνοιαν : « en vue de la repentance » tend à exprimer un but, tandis que le grec donne la repentance comme motif ou considération déterminante de l’interdiction du remariage.'
  naturalness: Le français est clair, moderne et d’un registre convenant à un dialogue moral ancien. La présentation dialoguée est naturelle. « Après cette séparation » est intelligible, mais « après avoir été ainsi séparée » conserve mieux le passif du grec sans imposer un statut juridique précis.
  terminology: Les termes « repentance », « adultère », « péché » et « se séparer » sont cohérents. La note sur μία μετάνοια est prudente et respecte le caractère disputé de la portée de cette phrase. « À cause de la repentance » rend plus directement la valeur de διὰ τὴν μετάνοιαν.
  issues:
  - severity: low
    issue: Valeur de διὰ τὴν μετάνοιαν
    rationale: « C’est donc en vue de la repentance » peut suggérer une finalité. Dans le contexte, la possibilité ou l’exigence de repentance est plutôt la raison pour laquelle le mari ne doit pas se remarier.
  - severity: low
    issue: Passif de ἀπολυθῇ
    rationale: « Après cette séparation » atténue le fait que le grec présente la femme comme ayant été renvoyée/séparée. Une formulation passive française conserve cette nuance tout en évitant de trancher entre renvoi et divorce juridique.
