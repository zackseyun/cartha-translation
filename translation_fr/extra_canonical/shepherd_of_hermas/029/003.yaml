base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/003.yaml
  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, permets-moi de te poser quelques questions. » « Parle », dit-il. « Seigneur, dis-je, si un homme a une épouse fidèle dans le Seigneur et qu’il la découvre impliquée dans un adultère, le mari pèche-t-il en continuant à vivre avec elle ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans ce dialogue avec une figure investie d’autorité, « Seigneur » conserve l’adresse respectueuse et la tonalité ancienne du grec, sans identifier nécessairement l’interlocuteur au Seigneur divin.
- source_word: γυναῖκα ἔχων τις πιστὴν ἐν Κυρίῳ
  choice: si un homme a une femme fidèle dans le Seigneur
  rationale: Rend directement l’appartenance croyante exprimée par πιστὴν ἐν Κυρίῳ, tout en gardant la formulation conjugale du texte.
- source_word: εὕρῃ ἐν μοιχείᾳ τινί
  choice: qu’il la surprenne en adultère
  rationale: « Surprendre en adultère » exprime naturellement en français la découverte effective suggérée par εὕρῃ ἐν, tandis que τινί ne requiert pas ici un indéfini lourd comme « dans quelque adultère ».
- source_word: συνζῶν μετ᾿ αὐτῆς
  choice: en continuant à vivre avec elle
  rationale: Le participe décrit la cohabitation conjugale après la découverte; « continuer » rend explicite la situation temporelle impliquée par la question sans introduire une notion technique supplémentaire.
theological_decisions:
- issue: Sens de l’adresse Κύριε
  choice: Traduire par « Seigneur »
  alternative: « Maître » ou « Monsieur »
  rationale: Le mot peut être une adresse respectueuse plutôt qu’un titre divin. « Seigneur » préserve cette ambiguïté dans le registre religieux et ancien du récit, sans ajouter d’identification doctrinale.
- issue: Portée de « fidèle dans le Seigneur »
  choice: Conserver littéralement l’expression
  alternative: « une épouse chrétienne » ou « une femme croyante »
  rationale: La formulation grecque peut désigner une croyante et souligne sa relation au Seigneur; la conserver évite de réduire ou de préciser indûment sa portée ecclésiale.
translation_notes:
  register: Français moderne, clair et digne, avec dialogue direct. Le terme « adultère » et la question morale sont conservés sans atténuation ni développement interprétatif.
