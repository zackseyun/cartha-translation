  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/001.yaml
  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: fr
  text: « Je t’ordonne, dit-il, de préserver ta chasteté. Ne laisse pas monter dans ton cœur une pensée au sujet de la femme d’un autre, d’une quelconque immoralité sexuelle ou d’autres images mauvaises semblables[a]. Car, en agissant ainsi, tu commets un grand péché. Mais si tu gardes toujours ta propre femme à l’esprit, tu ne pécheras jamais. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un terme inhabituel, qui signifie littéralement « images », « ressemblances » ou « représentations ». Il peut viser des pensées, des pratiques ou d’autres réalités mauvaises semblables à celles qui viennent d’être mentionnées.
    reason: Préserve l'ambiguïté sémantique de ὁμοιωμάτων πονηρῶν tout en maintenant dans le texte la composante d'« image » ou de « représentation ».
lexical_decisions:
- source_word: ἁγνεία
  choice: chasteté
  rationale: Le terme désigne ici la pureté sexuelle; « chasteté » est naturel, digne et précis dans le contexte.
- source_word: γυναικὸς ἀλλοτρίας
  choice: la femme d’un autre
  rationale: Le contraste avec « ta propre femme » indique une femme appartenant à l’union conjugale d’un autre homme, sans surcharger le texte.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Le mot grec a un champ plus large que le seul rapport sexuel hors mariage rendu traditionnellement par « fornication »; cette formulation moderne en conserve la portée générale.
- source_word: μνημονεύων
  choice: gardes toujours ta propre femme à l’esprit
  rationale: Le verbe signifie se souvenir ou garder présent à l’esprit; la tournure française exprime naturellement l’opposition aux pensées sexuelles interdites.
- source_word: διαμαρτήσεις
  choice: tu ne pécheras jamais
  rationale: Dans ce contexte moral, le verbe exprime le fait de manquer à la règle ou de transgresser; « pécher » rend clairement sa force.
theological_decisions:
- issue: Nature du péché décrit
  choice: Conserver l’affirmation selon laquelle accueillir intérieurement de telles pensées constitue déjà un grand péché.
  alternative: Limiter le péché à l’acte sexuel extérieur.
  rationale: Le texte grec relie explicitement la montée de la pensée dans le cœur à l’accomplissement d’un grand péché; il ne faut pas atténuer cette tension morale.
- issue: Portée de πορνεία
  choice: Employer le terme général « immoralité sexuelle ».
  alternative: Employer « fornication », qui peut suggérer une catégorie plus étroite.
  rationale: Cette option préserve l’étendue possible du terme grec sans importer une taxonomie confessionnelle particulière.
translation_notes:
  register: Français international moderne, direct et digne. Le discours conserve le ton impératif du maître tout en évitant les archaïsmes. La répétition autour du cœur et de la pensée est rendue de façon idiomatique sans effacer l’accent porté sur la vie intérieure.
