revisions:
- from: 'Mais cette révélation ne t’a pas été faite à toi seul : elle l’a été pour que tu fasses connaître tout cela à tous. Après trois jours — car tu dois d’abord le comprendre —, je t’ordonne en premier lieu, Hermas, de communiquer aux oreilles des saints les paroles que je vais te dire, afin qu’après les avoir entendues et mises en pratique, ils soient purifiés de leurs méchancetés, et toi avec eux.»'
  to: '« Mais cela ne t’a pas été révélé à toi seul, mais afin que tu le fasses connaître à tous. Dans trois jours — car tu dois d’abord comprendre —, je te donne d’abord cet ordre, Hermas : fais entendre aux saints ces paroles que je vais te dire, toutes[ a ], afin que, les ayant entendues et mises en pratique, ils soient purifiés de leurs mauvaises actions, toi aussi avec eux. »'
  rationale: La révision rattache clairement le délai de trois jours à l’acte de faire entendre les paroles, remplace une expression calquée par une formulation française naturelle, et ajoute une note pour l’ajout textuellement incertain de « toutes ». Elle conserve le passif de la purification et la désignation « saints ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:43Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’opposition « pas à toi seul », la finalité de la révélation, l’écoute suivie de la mise en pratique et le passif « qu’ils soient purifiés ». Toutefois, « Après trois jours » doit modifier explicitement l’acte de transmission, et le texte grec présente « toutes » comme une addition textuellement incertaine ([πάντα]).
  naturalness: Le français est globalement clair et de registre approprié. « Communiquer aux oreilles des saints » est toutefois une tournure trop calquée ; « faire entendre aux saints » conserve l’oralité tout en étant plus idiomatique.
  terminology: « Saints » est un équivalent direct et neutre de ἁγίων. « Mauvaises actions » rend naturellement le pluriel πονηριῶν dans ce contexte d’écoute et de pratique, sans restreindre indûment le terme à une doctrine du péché.
  issues:
  - severity: medium
    issue: Portée syntaxique de « Après trois jours »
    rationale: Dans le grec, μετὰ τρεῖς ἡμέρας introduit l’instruction de parler aux saints. Dans le projet, sa position avant « je t’ordonne » rend son rattachement à la communication moins net.
  - severity: low
    issue: Omission non signalée de l’incertitude textuelle sur « toutes »
    rationale: Le mot πάντα est entre crochets dans l’édition fournie. Puisque l’anglais l’inclut et que son authenticité est disputée, il peut être traduit, mais une note doit le signaler.
  - severity: low
    issue: Tournure française trop littérale
    rationale: « Communiquer aux oreilles des saints » reproduit l’image grecque, mais n’est pas naturel en français moderne ; « faire entendre aux saints » préserve le sens oral.
  revised_text: '« Mais cela ne t’a pas été révélé à toi seul, mais afin que tu le fasses connaître à tous. Dans trois jours — car tu dois d’abord comprendre —, je te donne d’abord cet ordre, Hermas : fais entendre aux saints ces paroles que je vais te dire, toutes[ a ], afin que, les ayant entendues et mises en pratique, ils soient purifiés de leurs mauvaises actions, toi aussi avec eux. »'
  revised_footnotes:
  - marker: a
    text: '« toutes » : le mot est transmis avec incertitude dans le texte grec (πάντα entre crochets dans l’édition citée) ; son absence ne change pas l’ordre de communiquer les paroles.'
    reason: Signale l’incertitude textuelle sans trancher entre les lectures ni modifier le sens du passage.
