base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/007.yaml
  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: fr
  text: '« Mais cela ne t’a pas été révélé à toi seul, mais afin que tu le fasses connaître à tous. Dans trois jours — car tu dois d’abord comprendre —, je te donne d’abord cet ordre, Hermas : fais entendre aux saints ces paroles que je vais te dire, toutes[ a ], afin que, les ayant entendues et mises en pratique, ils soient purifiés de leurs mauvaises actions, toi aussi avec eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκαλύφθη
  choice: cette révélation ne t’a pas été faite
  rationale: Rend naturellement le passif grec et conserve l’idée de dévoilement divin sans préciser un agent absent du texte.
- source_word: δηλώσῃς
  choice: fasses connaître
  rationale: Expression française courante qui traduit l’idée de rendre manifeste ou de communiquer clairement.
- source_word: εἰς τὰ ὦτα τῶν ἁγίων
  choice: aux oreilles des saints
  rationale: Conserve l’image concrète du grec, qui souligne une proclamation orale adressée directement aux saints.
- source_word: ποιήσαντες
  choice: mises en pratique
  rationale: Dans ce contexte, «faire» les paroles signifie leur obéir et les appliquer, plutôt que simplement les répéter.
- source_word: πονηριῶν
  choice: méchancetés
  rationale: Le pluriel désigne leurs dispositions ou actes mauvais; «méchancetés» préserve cette portée sans imposer une catégorie doctrinale plus précise.
theological_decisions:
- issue: Destinataires désignés comme οἱ ἅγιοι
  choice: les saints
  alternative: les fidèles
  rationale: «Les saints» correspond directement au grec et conserve le vocabulaire religieux ancien sans l’identifier à une catégorie confessionnelle ultérieure.
- issue: Rapport entre écoute, mise en pratique et purification
  choice: afin qu’après les avoir entendues et mises en pratique, ils soient purifiés
  alternative: afin qu’en les écoutant et en les accomplissant, ils se purifient
  rationale: Le passif καθαρισθῶσιν est maintenu afin de ne pas décider si la purification est opérée par Dieu, par les paroles ou par un autre agent implicite.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe difficile et probablement altérée du verset 11 est légèrement ordonnée pour rester intelligible, sans effacer la priorité donnée à la compréhension d’Hermas ni l’ordre de transmettre les paroles. Aucun marqueur de note n’est requis.
