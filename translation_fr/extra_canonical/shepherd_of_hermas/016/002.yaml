  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/002.yaml
  text: Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.
translation:
  language: fr
  text: 'Elle me regarde, sourit et me dit : « Vois-tu sept femmes autour de la tour ? » « Oui, madame », répondis-je. « Cette tour est soutenue par elles sur l’ordre du Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασά μοι
  choice: Elle me regarda
  rationale: Rend naturellement le regard dirigé et attentif exprimé par ἐμβλέπω.
- source_word: ὑπεμειδίασεν
  choice: sourit
  rationale: Le verbe désigne un sourire; le français simple conserve le ton narratif sans surtraduire le préfixe.
- source_word: κυρία
  choice: dame
  rationale: Titre respectueux adressé à la figure féminine; « dame » garde la couleur ancienne tout en restant compréhensible.
- source_word: βαστάζεται
  choice: est soutenue
  rationale: Le passif indique que les femmes portent ou soutiennent la tour; « soutenue » convient à l’image architecturale.
- source_word: κατ’ ἐπιταγὴν τοῦ Κυρίου
  choice: sur l’ordre du Seigneur
  rationale: Expression idiomatique française qui conserve l’idée d’un commandement autoritatif.
theological_decisions:
- issue: Nature du soutien apporté à la tour
  choice: « est soutenue par elles »
  alternative: « est portée par elles »
  rationale: Le grec βαστάζεται permet les deux nuances. « Soutenue » préserve l’image sans préciser si elles portent physiquement tout le poids ou assurent son maintien.
translation_notes:
  register: 'Français moderne, digne et direct. Le présent narratif de λέγει et φημί est harmonisé avec une narration naturelle : « me dit » puis « répondis-je ». Aucun ajout interprétatif.'
