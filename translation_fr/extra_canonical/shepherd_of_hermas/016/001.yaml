  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/001.yaml
  text: When, then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.
translation:
  language: fr
  text: 'Quand donc j’eus cessé de l’interroger sur toutes ces choses, elle me dit : « Veux-tu voir autre chose ? » Comme je désirais ardemment contempler cette autre chose, je fus rempli de joie en la voyant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαυσάμην ἐρωτῶν
  choice: j’eus cessé de l’interroger
  rationale: Rend directement la cessation d’une action en cours, dans un français narratif naturel.
- source_word: ἄλλο
  choice: autre chose
  rationale: Le neutre substantivé désigne ici une autre chose à voir, sans en préciser la nature.
- source_word: κατεπίθυμος
  choice: je désirais ardemment
  rationale: Exprime l’intensité du désir portée par le préfixe renforçateur.
- source_word: θεάσασθαι
  choice: le contempler
  rationale: Distingue ce verbe de ἰδεῖν en conservant sa nuance de regard attentif ou émerveillé.
- source_word: περιχαρὴς ἐγενόμην
  choice: je fus rempli de joie
  rationale: Restitue l’intensité de περιχαρής dans une formulation française courante et digne.
