base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/005.yaml
  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: fr
  text: '« Je voudrais savoir, dis-je, ma dame, quelle puissance possède chacune d’elles. »


    « Écoute, dit-elle, quelles puissances elles possèdent. Leurs puissances se maintiennent les unes par les autres, et elles se suivent les unes les autres dans l’ordre même où elles sont nées : de la Foi naît la Maîtrise de soi ; de la Maîtrise de soi, la Simplicité ; de la Simplicité, l’Innocence ; de l’Innocence, la Dignité ; de la Dignité, la Connaissance ; et de la Connaissance, l’Amour. Leurs œuvres sont donc pures, dignes et divines. Celui qui se mettra au service de ces femmes et qui sera capable de s’attacher fermement à leurs œuvres aura sa demeure dans la tour, avec les saints de Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύναμις / δυνάμεις
  choice: puissance / puissances
  rationale: Le terme désigne ici la force ou la capacité propre à chacune des vertus personnifiées. « Puissance » conserve le lien lexical avec la question d’Hermas sans réduire le sens à une simple fonction.
- source_word: κρατοῦνται δὲ ὑπ᾽ ἀλλήλων
  choice: se soutiennent mutuellement
  rationale: Le grec exprime que leurs puissances sont tenues ou maintenues les unes par les autres. Cette formulation française rend leur interdépendance sans imposer une image physique maladroite.
- source_word: Ἐγκράτεια
  choice: Maîtrise de soi
  rationale: Cette expression moderne couvre la retenue et le contrôle de ses désirs impliqués par le terme grec, tout en convenant à une vertu personnifiée.
- source_word: Ἁπλότης
  choice: Simplicité
  rationale: Le choix conserve l’idée de droiture sans duplicité et respecte la désignation traditionnelle de cette vertu.
- source_word: Ἀκακία
  choice: Innocence
  rationale: Le mot signifie l’absence de mal ou de malice. « Innocence » est naturel comme nom personnifié, tout en gardant cette orientation morale.
- source_word: Σεμνότης
  choice: Dignité
  rationale: Le terme évoque une conduite grave, honorable et digne de respect. « Dignité » convient aussi à l’adjectif apparenté σεμνά dans la phrase suivante.
- source_word: Ἐπιστήμη
  choice: Connaissance
  rationale: Dans cette série de vertus, le mot désigne un savoir ou un discernement établi ; « Connaissance » reste large et n’introduit pas une technicité absente du contexte.
- source_word: ἅγιοι τοῦ Θεοῦ
  choice: ceux qui appartiennent à Dieu
  rationale: Le grec substantivé désigne les personnes saintes ou consacrées à Dieu. Cette formulation est immédiatement intelligible et exprime l’appartenance consacrée sans lourdeur.
theological_decisions:
- issue: Relation entre les vertus et le salut ou la demeure dans la tour
  choice: 'Conserver la condition formulée par le texte : servir ces vertus et rester attaché à leurs œuvres conduit à une demeure dans la tour.'
  alternative: Reformuler en termes d’un système doctrinal explicite de mérite, de justification ou de sanctification.
  rationale: Le passage emploie un langage moral et conditionnel sans expliquer ici le rapport systématique entre les œuvres, la foi et le salut. La traduction préserve cette tension au lieu de la résoudre confessionnellement.
- issue: Personnification des sept vertus
  choice: Employer des majuscules aux noms des vertus et reprendre le féminin collectif par « ces femmes ».
  alternative: Traiter les termes uniquement comme des qualités abstraites.
  rationale: Le contexte présente explicitement sept femmes, liées par une généalogie symbolique. La personnification doit rester visible dans la traduction.
translation_notes:
  register: Français international moderne, digne et lisible. Le dialogue conserve sa simplicité ancienne sans archaïsmes. Les vertus personnifiées prennent une majuscule. « Ma dame » rend l’adresse respectueuse κυρία sans la coloration féodale ou religieuse que pourrait porter « Dame » isolé.
