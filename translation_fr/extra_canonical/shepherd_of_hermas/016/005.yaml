    issue: « ceux qui appartiennent à Dieu » pour ἁγίων τοῦ Θεοῦ
    rationale: La formule est intelligible, mais elle atténue le substantif grec explicite ἅγιοι (« saints »), qui est aussi le terme repris dans l’instruction qui suit (v. 11). « Les saints de Dieu » est exact, naturel et théologiquement non interprétatif.
  - severity: low
    issue: « aura la force de rester attaché à leurs œuvres » pour ἰσχύσῃ κρατῆσαι τῶν ἔργων αὐτῶν
    rationale: Le grec exprime la capacité de tenir fermement aux œuvres de ces vertus. La formulation proposée ajoute légèrement l’idée de force intérieure et dilue l’objet direct de κρατῆσαι. « sera capable de s’attacher fermement à leurs œuvres » est plus proche.
