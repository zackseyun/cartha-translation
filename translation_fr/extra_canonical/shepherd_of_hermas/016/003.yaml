revisions:
- from: Écoute maintenant quelles sont leurs actions. La première d’entre elles, celle qui se tient les mains, s’appelle Foi ; c’est par elle que les élus de Dieu sont sauvés. La deuxième, celle qui a la taille ceinte et qui fait preuve de courage, s’appelle Maîtrise de soi ; elle est fille de la Foi. Celui donc qui la suit devient heureux au cours de sa vie, parce qu’il s’abstiendra de toute œuvre mauvaise, convaincu que, s’il s’abstient de tout mauvais désir, il héritera de la vie éternelle.»
  to: Écoute maintenant quelles sont leurs fonctions. La première d’entre elles, celle qui tient les mains, s’appelle Foi ; c’est par elle que les élus de Dieu sont sauvés. La deuxième, celle qui a la taille ceinte et qui fait preuve de courage, s’appelle Maîtrise de soi ; elle est fille de la Foi. Celui donc qui la suit devient heureux dans sa vie, car il s’abstiendra de toute œuvre mauvaise, croyant que, s’il s’abstient de tout désir mauvais, il héritera de la vie éternelle.»
