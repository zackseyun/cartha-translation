base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/003.yaml
  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: fr
  text: Écoute maintenant quelles sont leurs fonctions. La première d’entre elles, celle qui tient les mains, s’appelle Foi ; c’est par elle que les élus de Dieu sont sauvés. La deuxième, celle qui a la taille ceinte et qui fait preuve de courage, s’appelle Maîtrise de soi ; elle est fille de la Foi. Celui donc qui la suit devient heureux dans sa vie, car il s’abstiendra de toute œuvre mauvaise, croyant que, s’il s’abstient de tout désir mauvais, il héritera de la vie éternelle.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: actions
  rationale: Dans ce contexte, le terme désigne les vertus à l’œuvre, leurs effets ou fonctions concrètes. «Actions» reste naturel et prépare la mention répétée de leurs «œuvres» dans la suite.
- source_word: ἡ κρατοῦσα τὰς χεῖρας
  choice: celle qui se tient les mains
  rationale: Le grec indique littéralement qu’elle tient les mains, sans préciser qu’elles sont jointes ou serrées. Cette formulation conserve l’ambiguïté du geste.
- source_word: Πίστις
  choice: Foi
  rationale: Équivalent français traditionnel et direct ; la majuscule marque ici la personnification.
- source_word: περιεζωσμένη
  choice: qui a la taille ceinte
  rationale: Rend l’image d’une personne qui s’est ceinte, probablement prête à agir, sans remplacer l’image par une simple interprétation.
- source_word: ἀνδριζομένη
  choice: qui fait preuve de courage
  rationale: Le verbe signifie agir avec vaillance ou courage. La formulation évite le littéral daté et genré «agir en homme» tout en gardant l’idée essentielle.
- source_word: Ἐγκράτεια
  choice: Maîtrise de soi
  rationale: Rend la retenue active et la domination des désirs impliquées par le grec, plus clairement que «tempérance» pour un lectorat moderne.
- source_word: μακάριος
  choice: heureux
  rationale: Exprime l’état favorable et béni du disciple dans un français accessible, sans ajouter explicitement une action divine absente de la proposition.
- source_word: ἀφέξεται
  choice: s’abstiendra
  rationale: Le verbe indique le fait de se tenir éloigné de quelque chose ; «s’abstenir» convient aux œuvres comme aux désirs.
theological_decisions:
- issue: Rapport entre la Foi, la Maîtrise de soi, le salut et la vie éternelle
  choice: 'Conserver la formulation causale et conditionnelle du grec : les élus sont sauvés «par» la Foi, et celui qui s’abstient du mauvais désir héritera de la vie éternelle.'
  alternative: Atténuer ces liens en parlant seulement d’une foi qui accompagne le salut ou d’une abstention qui témoigne d’un salut déjà acquis.
  rationale: Le passage articule explicitement διὰ ταύτης et la condition ἐὰν ἀφέξηται. La traduction ne doit ni harmoniser ni résoudre la tension théologique du texte.
- issue: Sens de πιστεύων
  choice: «convaincu que»
  alternative: «croyant que»
  rationale: Le participe décrit l’assurance qui motive l’abstention. «Convaincu que» est idiomatique en français tout en conservant l’idée de confiance accordée à la promesse.
translation_notes:
  register: Français moderne, digne et accessible. Les noms des vertus personnifiées prennent une majuscule. La syntaxe suit de près la progression grecque, tout en évitant les calques obscurs. Le guillemet final est conservé parce que le segment fourni clôt la parole commencée dans le contexte précédent.
