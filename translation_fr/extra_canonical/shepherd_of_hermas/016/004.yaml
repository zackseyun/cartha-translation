base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/004.yaml
  text: “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”
translation:
  language: fr
  text: « Et les autres, Dame, qui sont-elles ? » « Elles sont filles les unes des autres. Elles s’appellent Simplicité, Connaissance, Innocence, Dignité et Amour. Donc, lorsque tu accomplis toutes les œuvres de leur mère, tu peux vivre. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁπλότης
  choice: Simplicité
  rationale: Rend directement la qualité de droiture et de simplicité sans ajouter une interprétation confessionnelle.
- source_word: Ἐπιστήμη
  choice: Connaissance
  rationale: Terme courant et digne correspondant au savoir ou à la connaissance.
- source_word: Ἀκακία
  choice: Innocence
  rationale: Exprime l’absence de mal et de malice visée par le grec dans une formulation naturelle.
- source_word: Σεμνότης
  choice: Dignité
  rationale: Conserve l’idée de noblesse morale et de conduite respectable.
- source_word: Ἀγάπη
  choice: Amour
  rationale: Équivalent français naturel, sans restreindre ici le terme à une nuance doctrinale particulière.
- source_word: δύνασαι ζῆσαι
  choice: tu pourras vivre
  rationale: Dans la construction conditionnelle, le futur français exprime naturellement la possibilité résultant de l’accomplissement des œuvres.
theological_decisions:
- issue: Identité de « leur mère »
  choice: Conserver la formulation « leur mère »
  alternative: Préciser qu’il s’agit de la vertu qui précède chacune dans la chaîne
  rationale: Le texte grec garde le référent au singulier dans une généalogie symbolique et ne l’explicite pas dans cette phrase; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Les noms des vertus prennent une majuscule puisqu’ils désignent ici des figures personnifiées. « Dame » conserve l’adresse respectueuse κυρία sans archaïsme excessif.
