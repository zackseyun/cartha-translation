  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/006.yaml
  text: And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.
translation:
  language: fr
  text: 'Je continuais à l’interroger au sujet des temps : la fin était-elle déjà là ? Mais elle s’écria d’une voix forte : « Homme sans intelligence ! Ne vois-tu pas que la tour est encore en construction ? Quand la tour aura achevé d’être construite, elle atteindra sa fin. Mais elle sera bientôt achevée. Ne m’interroge plus sur rien. Ce rappel et le renouvellement de vos esprits vous suffisent, à toi comme aux saints. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν καιρῶν
  choice: des temps
  rationale: Conserve la portée eschatologique possible de l’expression grecque sans la réduire à une simple question de dates.
- source_word: συντέλεια
  choice: la fin
  rationale: Rend naturellement l’idée d’achèvement final dans ce contexte eschatologique.
- source_word: Ἀσύνετε ἄνθρωπε
  choice: Homme sans intelligence !
  rationale: Reproduit l’interpellation sévère du grec tout en évitant le sens moderne parfois clinique de « insensé ».
- source_word: ταχὺ ἐποικοδομηθήσεται
  choice: elle sera bientôt terminée
  rationale: Exprime idiomatiquement l’achèvement rapide de la construction, implicite dans le verbe grec employé à propos de la tour.
- source_word: τοῖς ἁγίοις
  choice: aux saints
  rationale: Maintient le terme religieux du texte source sans explicitation confessionnelle.
- source_word: ἡ ἀνακαίνωσις τῶν πνευμάτων ὑμῶν
  choice: le renouvellement de votre esprit
  rationale: Le français emploie naturellement le singulier distributif après « votre » ; il s’agit du renouvellement intérieur de chacun des destinataires.
theological_decisions:
- issue: Rapport entre l’achèvement de la tour et la fin
  choice: « Quand donc la construction de la tour sera achevée, ce sera la fin. »
  alternative: « Dès que la tour aura fini d’être construite, elle parviendra à son terme. »
  rationale: La formulation retenue conserve le lien eschatologique établi par la question sur la συντέλεια, sans préciser davantage la nature de cette fin.
translation_notes:
  register: Français moderne, digne et accessible. Le ton vif de la réprimande est conservé, de même que l’imagerie de la tour en construction et la tension eschatologique du passage.
