    issue: Nuance indéfinie de καρπόν τινα non explicitée
    rationale: « Du fruit » est possible en français, mais « quelque fruit » rend plus nettement l’indéfini grec (« un certain fruit ») sans préciser une quantité.
  - severity: low
    issue: ἀπέλυσεν αὐτοὺς εἰς τὸν πύργον est rendu comme une permission d’entrer
    rationale: Le verbe signifie ici les renvoyer ou les envoyer vers/dans la tour. « Les envoya dans la tour » maintient l’action de l’ange sans ajouter l’idée principale d’autorisation.
