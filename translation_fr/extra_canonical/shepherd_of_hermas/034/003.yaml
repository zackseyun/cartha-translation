  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: fr
  text: 3. Mais crains les œuvres du diable, car elles sont mauvaises. Ainsi, en craignant le Seigneur, tu craindras les œuvres du diable et tu ne les accompliras pas, mais tu t’en tiendras éloigné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητι / φοβούμενος / φοβηθήσῃ
  choice: crains / en craignant / tu craindras
  rationale: Maintient la répétition délibérée du verbe grec φοβέομαι et le lien logique entre la crainte du Seigneur et celle des œuvres mauvaises.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: les œuvres du diable
  rationale: Rend formellement ἔργα et conserve la distinction essentielle entre le diable lui-même, qu’il ne faut pas craindre au paragraphe précédent, et ses œuvres, qu’il faut craindre ici.
- source_word: πονηρά
  choice: mauvaises
  rationale: Terme français naturel couvrant ici la valeur morale de πονηρός sans ajouter une nuance absente du texte.
- source_word: οὐκ ἐργάσῃ αὐτά
  choice: tu ne les accompliras pas
  rationale: Restitue le jeu lexical grec entre ἔργα et ἐργάσῃ avec une formulation française idiomatique.
- source_word: ἀφέξῃ ἀπ᾽ αὐτῶν
  choice: tu t’en tiendras éloigné
  rationale: Exprime l’idée de se garder à distance ou de s’abstenir, avec une tournure moderne et naturelle.
theological_decisions:
- issue: Objet de la crainte
  choice: crains les œuvres du diable
  alternative: aie peur des œuvres du diable
  rationale: « Crains » préserve le vocabulaire théologique et l’impératif du passage, tout en maintenant la tension avec l’interdiction de craindre le diable au paragraphe 2.
- issue: Valeur logique de οὖν
  choice: Ainsi
  alternative: Donc
  rationale: Marque la conséquence découlant de la crainte du Seigneur sans préciser davantage que le grec la nature de cette relation.
translation_notes:
  register: Français international moderne, direct et digne. Tutoiement conservé pour refléter les formes grecques au singulier. La répétition de « craindre » est volontaire afin de préserver l’argument du texte.
