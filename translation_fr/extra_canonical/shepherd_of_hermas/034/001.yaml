  to: 1. « Crains le Seigneur, dit-il, et garde ses commandements. En gardant les commandements de Dieu, tu seras fort dans toute entreprise, et ta conduite sera sans pareille. Car, si tu crains le Seigneur, tu feras bien toutes choses. C’est cette crainte que tu dois avoir, et tu seras sauvé. »
  rationale: 'Révision limitée à deux formulations : la première rend plus exactement la force ou capacité « dans toute action/entreprise » exprimée par le grec, et la seconde améliore l’idiomaticité française tout en préservant l’emphase du texte. Aucun ajout doctrinal ni note n’est nécessaire.'
