review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement l’impératif initial, l’opposition « Seigneur / Dieu », la répétition de « commandements », le lien entre la crainte du Seigneur, l’action droite et le salut. Toutefois, « capable d’accomplir toute œuvre » déplace légèrement δυνατὸς ἐν πάσῃ πράξει : le grec dit la capacité ou la force dans chaque action/entreprise, non nécessairement l’aptitude à accomplir toute œuvre prise collectivement.'
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. « Tu seras fort dans toute entreprise » est plus direct et plus naturel ici que « capable d’accomplir toute œuvre », tout en restant proche du grec.
  terminology: « Crains », « crainte », « garde les commandements », « Seigneur », « Dieu » et « tu seras sauvé » conviennent. « C’est cette crainte que tu dois avoir » conserve la formulation emphatique du grec sans l’expression française un peu moins idiomatique « éprouver une crainte ».
  issues:
  - severity: low
    issue: Portée de δυνατὸς ἐν πάσῃ πράξει
    rationale: « Capable d’accomplir toute œuvre » peut suggérer que toute œuvre sans exception sera accomplie. La préposition ἐν situe plutôt la force/capacité dans chaque action ou entreprise.
  - severity: low
    issue: Rendu de ὃν δεῖ σε φοβηθῆναι
    rationale: « La crainte que tu dois éprouver » est compréhensible, mais « C’est cette crainte que tu dois avoir » est plus idiomatique et maintient l’insistance déictique de οὗτος.
  revised_text: 1. « Crains le Seigneur, dit-il, et garde ses commandements. En gardant les commandements de Dieu, tu seras fort dans toute entreprise, et ta conduite sera sans pareille. Car, si tu crains le Seigneur, tu feras bien toutes choses. C’est cette crainte que tu dois avoir, et tu seras sauvé. »
