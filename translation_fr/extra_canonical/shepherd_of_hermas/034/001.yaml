base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: fr
  text: 1. « Crains le Seigneur, dit-il, et garde ses commandements. En gardant les commandements de Dieu, tu seras fort dans toute entreprise, et ta conduite sera sans pareille. Car, si tu crains le Seigneur, tu feras bien toutes choses. C’est cette crainte que tu dois avoir, et tu seras sauvé. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβήθητι / φοβούμενος / φόβος
  choice: Crains / si tu crains / crainte
  rationale: Conserve le champ lexical répété de la crainte, central dans ce mandat, tout en employant une tournure française naturelle pour le participe causal.
- source_word: φύλασσε / φυλάσσων
  choice: garde / en gardant
  rationale: « Garder les commandements » est une expression française claire qui préserve l’idée d’observer fidèlement, ainsi que la répétition grecque.
- source_word: δυνατὸς ἐν πάσῃ πράξει
  choice: capable d’accomplir toute œuvre
  rationale: Rend δυνατός comme aptitude effective plutôt que comme puissance politique ou domination; « œuvre » garde ici la portée morale de πρᾶξις.
- source_word: ἡ πρᾶξίς σου ἀσύγκριτος
  choice: ta conduite sera sans pareille
  rationale: Dans la seconde occurrence, πρᾶξις désigne plus naturellement l’ensemble de l’agir ou de la conduite; « sans pareille » rend directement ἀσύγκριτος.
- source_word: πάντα καλῶς ἐργάσῃ
  choice: tu feras bien toutes choses
  rationale: Préserve l’étendue de πάντα et le sens adverbial de καλῶς sans ajouter de précision étrangère au texte.
- source_word: σωθήσῃ
  choice: tu seras sauvé
  rationale: Traduction directe du passif futur, sans expliciter l’agent ni définir davantage la nature du salut.
theological_decisions:
- issue: Rapport entre la crainte du Seigneur, l’obéissance et le salut
  choice: 'Conserver l’enchaînement affirmé par le grec : « Voilà la crainte que tu dois éprouver, et tu seras sauvé. »'
  alternative: Atténuer le lien par « afin que tu sois sauvé » ou l’expliquer doctrinalement.
  rationale: Le texte associe directement la crainte requise et le salut, sans développer ici leur relation théologique; la traduction ne doit ni l’affaiblir ni la systématiser.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement suit l’adresse grecque au singulier. La répétition de « crains/crainte » et de « garde/gardant » est volontaire, tandis que les deux emplois de πρᾶξις sont différenciés selon leur fonction contextuelle pour conserver un français naturel.
