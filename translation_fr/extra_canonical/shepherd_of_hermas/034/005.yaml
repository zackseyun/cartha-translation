  text: 5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live to God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”
translation:
  language: fr
  text: '5. « Pourquoi, Seigneur, demandai-je, as-tu dit au sujet de ceux qui gardent ses commandements : “Ils vivront pour Dieu” ? — Parce que, répondit-il, toute la création craint le Seigneur, mais elle ne garde pas ses commandements. Ceux donc qui le craignent et gardent ses commandements ont leur vie auprès de Dieu ; mais ceux qui ne gardent pas ses commandements n’ont pas non plus de vie en lui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans l’adresse respectueuse du narrateur à son interlocuteur, « Seigneur » conserve la dignité et l’écho possible du titre grec sans imposer le sens plus familier de « monsieur ».
- source_word: τηρούντων / φυλασσόντων
  choice: gardent
  rationale: Le grec emploie deux participes proches dans ce verset. « Garder les commandements » est naturel en français biblique moderne et préserve l’idée d’observance fidèle.
- source_word: ζήσονται τῷ Θεῷ
  choice: Ils vivront pour Dieu
  rationale: Le datif τῷ Θεῷ demeure susceptible de nuances. « Pour Dieu » conserve la formulation concise et la tension avec la proposition suivante, sans la réduire à « avec Dieu ».
- source_word: πᾶσα ἡ κτίσις
  choice: toute la création
  rationale: Rend directement l’expression grecque et son ampleur collective.
- source_word: παρὰ τῷ Θεῷ
  choice: auprès de Dieu
  rationale: παρά avec le datif exprime ici la présence ou la relation auprès de Dieu ; « auprès de » évite de confondre cette tournure avec le datif de ζήσονται τῷ Θεῷ.
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  choice: n’ont pas non plus de vie en lui
  rationale: Conserve la négation renforcée οὐδέ et le pronom singulier αὐτῷ, dont le référent naturel est Dieu.
theological_decisions:
- issue: Rapport entre la crainte du Seigneur, l’observance des commandements et la vie auprès de Dieu
  choice: Conserver l’enchaînement affirmé par le texte sans préciser un système de mérite ou de causalité salvifique
  alternative: Paraphraser en termes de récompense, de preuve de foi ou de condition du salut
  rationale: Le grec associe directement crainte, observance et vie, mais n’explicite pas ici leur articulation doctrinale.
- issue: Nuance de ζήσονται τῷ Θεῷ
  choice: « Ils vivront pour Dieu »
  alternative: « Ils vivront avec Dieu » ou « ils seront vivants aux yeux de Dieu »
  rationale: Le datif autorise plusieurs nuances. La traduction retenue préserve l’ambiguïté et permet au contraste avec « leur vie auprès de Dieu » de rester perceptible.
- issue: Référent de ἐν αὐτῷ
  choice: « en lui », compris naturellement comme Dieu
  alternative: « en eux », selon la consultation anglaise
  rationale: Le texte grec transmis porte le singulier αὐτῷ, non le pluriel αὐτοῖς. La traduction suit donc la source grecque tout en gardant le pronom plutôt qu’en explicitant.
translation_notes:
  register: Français international moderne, digne et lisible. Le dialogue est ponctué de manière naturelle. Le vocabulaire conserve une légère coloration scripturaire (« garder les commandements », « auprès de Dieu ») sans archaïsmes.
