  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/002.yaml
  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: fr
  text: 2. Mais ne crains pas le diable. En effet, si tu crains le Seigneur, tu domineras le diable, car il n’y a aucune puissance en lui. Là où il n’y a pas de puissance, il n’y a rien à craindre ; mais là où la puissance est glorieuse, il y a aussi de quoi craindre. En effet, quiconque détient une puissance inspire la crainte, tandis que celui qui n’a aucune puissance est méprisé de tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβηθῇς / φοβούμενος / φόβος
  choice: craindre / crainte / avoir de quoi craindre
  rationale: Conserve le champ lexical répété de la peur tout en formulant naturellement en français les énoncés généraux.
- source_word: κατακυριεύσεις
  choice: tu domineras
  rationale: Rend l’idée forte de prendre le dessus et d’exercer sa maîtrise sur le diable.
- source_word: δύναμις
  choice: puissance
  rationale: Préserve la répétition et le sens de capacité ou pouvoir effectif, sans introduire une terminologie confessionnelle.
- source_word: ἔνδοξος
  choice: glorieuse
  rationale: Équivalent direct qui maintient le contraste entre l’impuissance du diable et la puissance digne de révérence.
- source_word: καταφρονεῖται
  choice: est méprisé
  rationale: Reproduit le sens passif de tenir quelqu’un pour négligeable ou sans valeur.
theological_decisions:
- issue: Portée de l’affirmation « aucune puissance en lui »
  choice: « il n’y a aucune puissance en lui »
  alternative: « il n’a aucun pouvoir »
  rationale: La formulation retenue suit de près le grec et conserve la tension avec les autres passages qui attribuent une activité au diable, sans expliquer ni atténuer l’affirmation.
- issue: Sens de la crainte associée à la puissance
  choice: « il y a aussi de quoi craindre » et « inspire la crainte »
  alternative: « la crainte réside en lui »
  rationale: Le grec est elliptique. Cette formulation exprime naturellement que la puissance constitue un motif de crainte, sans identifier cette crainte à la terreur ni la transformer explicitement en révérence.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement est conservé, conformément à l’adresse grecque au singulier. Les répétitions structurantes de « crainte » et « puissance » sont maintenues, avec de légers ajustements idiomatiques.
