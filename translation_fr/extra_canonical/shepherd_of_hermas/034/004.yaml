base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: fr
  text: '4. Il y a donc deux sortes de crainte : si tu veux faire le mal, crains le Seigneur et tu ne le feras pas ; si, au contraire, tu veux faire le bien, crains le Seigneur et tu le feras. Ainsi, la crainte du Seigneur est puissante, grande et glorieuse. Crains donc le Seigneur, et tu vivras pour lui ; et tous ceux qui le craignent, parmi ceux qui gardent ses commandements, vivront pour Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δισσοὶ ... οἱ φόβοι
  choice: deux sortes de crainte
  rationale: Le pluriel grec désigne deux modalités ou effets de la crainte du Seigneur, non deux objets entièrement distincts ; cette formulation est naturelle en français.
- source_word: τὸ πονηρὸν / τὸ ἀγαθὸν
  choice: le mal / le bien
  rationale: Rend directement les substantifs neutres grecs tout en restant idiomatique.
- source_word: ἐργάσασθαι
  choice: faire
  rationale: Dans ce contexte moral, « faire le mal/le bien » traduit naturellement l’action exprimée par le verbe grec.
- source_word: ἰσχυρός ... μέγας ... ἔνδοξος
  choice: puissante, grande et glorieuse
  rationale: Préserve les trois qualificatifs et leur force rhétorique, avec accord sur « crainte ».
- source_word: ζήσῃ αὐτῷ / ζήσονται τῷ Θεῷ
  choice: tu vivras pour lui / vivront pour Dieu
  rationale: Le datif peut exprimer une vie orientée vers Dieu ou vécue pour lui ; « pour » préserve cette relation sans la réduire à la simple survie.
- source_word: φυλασσόντων τὰς ἐντολὰς
  choice: ceux qui gardent ses commandements
  rationale: « Garder » conserve le sens d’observer fidèlement les commandements et fait écho au vocabulaire biblique courant.
theological_decisions:
- issue: Rapport entre la crainte du Seigneur et l’obéissance
  choice: 'Conserver les affirmations directes : la crainte empêche le mal et conduit à faire le bien.'
  alternative: Atténuer en disant qu’elle « aide » ou « encourage » à agir ainsi.
  rationale: Le grec emploie sans modalisation les futurs οὐκ ἐργάσῃ et ἐργάσῃ ; il ne faut pas affaiblir la tension morale du texte.
- issue: Sens du datif dans « vivre à/pour Dieu »
  choice: « vivre pour lui / pour Dieu »
  alternative: « vivre en Dieu » ou « être vivant aux yeux de Dieu »
  rationale: Le datif αὐτῷ / τῷ Θεῷ demeure relationnel et quelque peu ouvert. « Pour » est naturel et évite d’introduire explicitement une doctrine d’union mystique absente de la formulation.
- issue: Restriction « parmi ceux qui gardent ses commandements »
  choice: Maintenir la construction restrictive telle quelle.
  alternative: Reformuler en identifiant sans nuance tous ceux qui craignent Dieu à ceux qui gardent ses commandements.
  rationale: 'La syntaxe τῶν φυλασσόντων laisse une tension que le paragraphe suivant explicite : toute créature craint le Seigneur, mais toutes ne gardent pas ses commandements.'
translation_notes:
  register: Français moderne, international et digne. Tutoiement conservé pour l’adresse individuelle du maître au narrateur. Parallélisme et répétition de « crains le Seigneur » maintenus pour respecter la structure exhortative grecque.
