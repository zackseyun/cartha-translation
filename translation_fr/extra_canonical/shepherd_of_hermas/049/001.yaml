  naturalness: La phrase est fluide, mais « donner sa pleine valeur » sonne interprétatif. « Donner plénitude à » est naturel dans ce registre et conserve la symétrie voulue.
  terminology: « Les pauvres », « en procurant » et « ce dont ils ont besoin » rendent correctement τοῖς πένησι, χορηγοῦντες et τὰ δέοντα. Le pluriel « leurs âmes » reflète explicitement τὰς ψυχὰς αὐτῶν sans nuire au français.
