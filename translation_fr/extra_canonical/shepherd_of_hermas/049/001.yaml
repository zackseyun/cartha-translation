base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/001.yaml
  text: …they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete.
translation:
  language: fr
  text: …ils donnent ainsi plénitude à leur richesse ; et, à leur tour, les riches, en procurant aux pauvres ce dont ils ont besoin, donnent plénitude à leurs âmes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληροφοροῦσι
  choice: donnent … sa pleine valeur
  rationale: Le verbe évoque ici l’idée de mener à sa pleine mesure ou à son plein accomplissement. Cette formulation conserve le parallélisme entre la richesse des pauvres et l’âme des riches tout en restant naturelle en français.
- source_word: χορηγοῦντες
  choice: en procurant
  rationale: Le participe désigne le fait de fournir généreusement ou de pourvoir à un besoin ; « procurant » convient au contexte concret de l’aide apportée aux pauvres.
- source_word: τοῖς πένησι
  choice: aux pauvres
  rationale: πένης désigne une personne démunie ou obligée de travailler pour vivre ; « pauvres » est ici le terme français le plus clair et le plus direct.
- source_word: τὰ δέοντα
  choice: ce dont ils ont besoin
  rationale: L’expression signifie littéralement « les choses nécessaires » ou « ce qu’il faut ». La traduction choisie exprime naturellement le besoin matériel dans ce contexte.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: leur âme
  rationale: Le grec emploie le pluriel distributif, « leurs âmes ». Le singulier collectif français, après « les riches », est plus fluide et garde l’idée que chacun reçoit un bienfait spirituel.
theological_decisions:
- issue: Nature de l’accomplissement produit par l’entraide
  choice: donnent à leur richesse / à leur âme sa pleine valeur
  alternative: rendent leur richesse / leur âme complète
  rationale: Le grec construit un parallèle délibéré sans préciser exactement en quel sens richesse et âme sont « accomplies ». La traduction conserve cette tension et évite d’introduire une doctrine explicite du mérite ou du salut.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme rhétorique du grec est maintenu, de même que le caractère fragmentaire signalé par les points de suspension au début du segment.
