base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/007.yaml
  text: 3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”
translation:
  language: fr
  text: '3. En effet, de même qu’en hiver les arbres qui ont perdu leurs feuilles se ressemblent, si bien qu’on ne distingue pas lesquels sont secs et lesquels sont vivants, de même, dans le monde présent, on ne distingue ni les justes ni les pécheurs : tous se ressemblent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβεβληκότα τὰ φύλλα
  choice: qui ont perdu leurs feuilles
  rationale: Rend naturellement le participe parfait grec et l’état qui en résulte, sans suggérer que les arbres ont volontairement rejeté leurs feuilles.
- source_word: οὐ φαίνονται
  choice: on ne distingue pas
  rationale: Dans cette comparaison visuelle, le sens est non seulement qu’ils ne paraissent pas, mais qu’il est impossible de discerner leur nature respective.
- source_word: τὰ ξηρά … τὰ ζῶντα
  choice: lesquels sont secs et lesquels sont vivants
  rationale: Conserve l’opposition grecque entre arbres desséchés et arbres vivants, déterminante pour l’image.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: dans le monde présent
  rationale: Ici αἰών désigne l’ordre ou l’époque présente, en contraste avec le monde à venir dans le contexte; « monde présent » est clair et idiomatique.
- source_word: οἱ δίκαιοι … οἱ ἁμαρτωλοί
  choice: les justes … les pécheurs
  rationale: Équivalents français directs et traditionnels, compréhensibles et théologiquement non interprétatifs.
theological_decisions:
- issue: Visibilité actuelle de l’identité morale des personnes
  choice: « on ne distingue ni les justes ni les pécheurs »
  alternative: « ni les justes ni les pécheurs ne paraissent »
  rationale: Le texte n’affirme pas leur absence, mais leur caractère indiscernable dans le monde présent; la traduction préserve cette tension sans prétendre qu’aucune différence réelle n’existe.
translation_notes:
  register: Français moderne, digne et accessible. La répétition structurante « de même… de même » et l’opposition « secs/vivants », « justes/pécheurs » sont maintenues. Aucun marqueur de note n’est nécessaire.
