  verdict: revise
  source_fidelity: Le sens général est bien rendu et le contexte justifie « ceux qui possèdent des biens » pour οἱ ἔχοντες. Toutefois, « leur richesse vient du Seigneur » atténue légèrement la voix passive de πλουτίζονται (« sont enrichis »), et « bonne œuvre » restreint ἀγαθόν τι, qui désigne plus largement « quelque chose de bon ».
  naturalness: Le français est fluide, moderne et d’un registre approprié. La reformulation proposée reste naturelle tout en suivant plus directement la syntaxe et la portée du grec.
  terminology: « Seigneur » rend correctement Κυρίου. « Faire quelque chose de bon » évite de transformer le neutre indéfini ἀγαθόν τι en le terme plus technique et plus étroit « bonne œuvre ».
  issues:
  - severity: low
    issue: « leur richesse vient du Seigneur » pour παρὰ τοῦ Κυρίου πλουτίζονται
    rationale: La formulation est idiomatique, mais le grec présente les personnes comme étant enrichies par le Seigneur. « Sont enrichis par le Seigneur » conserve plus exactement cette relation sans imposer une interprétation particulière de la richesse.
  - severity: medium
    issue: « accomplir quelque bonne œuvre » pour ἀγαθόν τι ἐργάζεσθαι
    rationale: Le grec emploie un neutre indéfini, « faire/produire quelque chose de bon », et non le nom « œuvre ». La version proposée préserve l’indétermination et évite une coloration terminologique non requise.
  revised_text: 10. Heureux ceux qui possèdent des biens et comprennent qu’ils sont enrichis par le Seigneur ! En effet, ceux qui pensent ainsi pourront faire quelque chose de bon.
