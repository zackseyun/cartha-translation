base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/003.yaml
  text: 10. Blessed are those who have and understand that they are made rich by the Lord; for those who think this way will be able to do some good.
translation:
  language: fr
  text: 10. Heureux ceux qui possèdent des biens et comprennent qu’ils sont enrichis par le Seigneur ! En effet, ceux qui pensent ainsi pourront faire quelque chose de bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἔχοντες
  choice: ceux qui possèdent des biens
  rationale: Le participe substantivé signifie littéralement « ceux qui ont ». Dans ce contexte consacré aux riches et aux pauvres, l’ajout de « des biens » explicite naturellement le référent matériel sans surinterpréter.
- source_word: παρὰ τοῦ Κυρίου πλουτίζονται
  choice: leur richesse vient du Seigneur
  rationale: Cette formulation française rend l’idée qu’ils sont enrichis par le Seigneur tout en évitant la tournure lourde « sont rendus riches ». Elle maintient le Seigneur comme source de leur richesse.
- source_word: ταῦτα φρονοῦντες
  choice: ceux qui pensent ainsi
  rationale: Rend l’attitude intérieure et la compréhension pratique exprimées par φρονέω, avec pour antécédent la reconnaissance que la richesse vient du Seigneur.
- source_word: ἀγαθόν τι ἐργάζεσθαι
  choice: accomplir quelque bonne œuvre
  rationale: Conserve l’indétermination de τι et le sens actif de ἐργάζεσθαι. « Bonne œuvre » convient au registre moral du passage sans préciser abusivement sa nature.
theological_decisions:
- issue: Origine et fonction de la richesse
  choice: Présenter la richesse comme venant du Seigneur et cette reconnaissance comme permettant une bonne action
  alternative: Comprendre πλουτίζονται dans un sens exclusivement spirituel
  rationale: Le contexte immédiat porte sur l’aide matérielle des riches aux pauvres. Il favorise le sens concret, mais la traduction n’ajoute aucune doctrine sur la prospérité ni sur le mérite.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la béatitude initiale, le lien causal et la portée indéfinie de « quelque bonne œuvre ».
