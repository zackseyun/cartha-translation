    issue: 'La note affirme : « Certains témoins ajoutent... »'
    rationale: L’information fournie établit seulement que οἱ ἐλάχιστοι ὄντες est placé entre crochets dans l’édition. Elle ne justifie pas une affirmation précise sur les témoins. Il faut signaler prudemment l’incertitude textuelle sans en préciser la cause documentaire.
