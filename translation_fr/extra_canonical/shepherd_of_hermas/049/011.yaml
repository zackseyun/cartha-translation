  verdict: revise
  source_fidelity: La phrase traduit correctement le parallélisme entre les fruits des arbres en été et ceux des justes. Toutefois, la note attribue sans base fournie l’expression entre crochets à « certains témoins »; les crochets de l’édition signalent une difficulté textuelle, mais ne permettent pas à eux seuls cette précision. La formulation « tous seront reconnus comme florissants » est possible, mais « comme étant florissants » rend plus explicitement le participe grec εὐθαλεῖς ὄντες.
  naturalness: Le français est fluide et de registre approprié. « En ce temps-là » est plus naturel et plus proche de ἐν τῷ αἰῶνι ἐκείνῳ que « dans ce monde à venir » dans cette phrase, tout en gardant le renvoi contextuel à l’âge futur.
  terminology: « Justes », « fruits », « florissants » et « en été » conviennent. La métaphore végétale est préservée sans surcharge interprétative.
