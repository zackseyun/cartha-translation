  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/011.yaml
  text: 3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age.”
translation:
  language: fr
  text: 3. En effet, de même qu’en été les fruits de chaque arbre deviennent visibles et que l’on reconnaît ce qu’ils sont, de même les fruits des justes seront visibles, et tous seront reconnus comme étant florissants en ce temps-là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec comporte ici, entre crochets dans l’édition, des mots qui peuvent se traduire par « ceux qui sont les plus petits »; leur statut textuel et leur lien syntaxique avec la phrase sont incertains.
    reason: Le segment [οἱ ἐλάχιστοι ὄντες] est mis entre crochets dans l’édition source. La note préserve cette incertitude sans avancer une affirmation non étayée sur les témoins.
lexical_decisions:
- source_word: τῷ θέρει
  choice: en été
  rationale: Rend directement l’image saisonnière et maintient le contraste avec l’hiver du contexte.
- source_word: ποταποί εἰσιν
  choice: ce qu’ils sont
  rationale: Expression naturelle qui traduit l’identification de la nature ou de la qualité des fruits sans la préciser indûment.
- source_word: εὐθαλεῖς
  choice: florissants
  rationale: Conserve la métaphore végétale et l’idée de vigueur ou de prospérité.
- source_word: ἐν τῷ αἰῶνι ἐκείνῳ
  choice: dans ce monde à venir
  rationale: Le démonstratif renvoie à l’ère future déjà mentionnée; cette formulation explicite naturellement ce renvoi en français.
theological_decisions:
- issue: Référent de πάντες (« tous »)
  choice: tous seront reconnus comme florissants
  alternative: on reconnaîtra tous ceux qui sont les plus petits comme florissants
  rationale: Le texte transmis est perturbé par les mots entre crochets. La traduction rattache prudemment « tous » aux justes évoqués juste avant, sans définir une catégorie théologique supplémentaire.
- issue: Lecture de [οἱ ἐλάχιστοι ὄντες]
  choice: Omission du corps du texte avec signalement en note
  alternative: « même les plus petits » / « ceux qui sont les plus petits »
  rationale: Ces mots sont signalés comme textuellement douteux dans la source fournie et rendent la syntaxe difficile; les intégrer sans réserve imposerait une reconstruction incertaine.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « visibles » est conservée afin de refléter le parallélisme du grec; l’image arboricole demeure nette.
