revisions:
- from: 2. « Ces arbres qui bourgeonnent, dit-il, représentent les justes qui habiteront dans le monde à venir. En effet, le monde à venir est un été pour les justes, mais un hiver pour les pécheurs. Quand donc la miséricorde du Seigneur resplendira, ceux qui servent Dieu apparaîtront alors au grand jour, et tous seront manifestés. »
  to: 2. « Ces arbres qui bourgeonnent, dit-il, sont les justes, qui vont habiter dans l’âge à venir ; car l’âge à venir est un été pour les justes, mais un hiver pour les pécheurs. Quand donc la miséricorde du Seigneur resplendira, alors ceux qui servent Dieu seront manifestés, et tous seront manifestés. »
  rationale: La révision rétablit la copule directe du grec, rend la nuance prospective de μέλλοντες, traduit αἰών de manière plus précise dans son opposition avec l’âge présent, et conserve la répétition passive de φανερωθήσονται sans ajouter d’intensification interprétative. Aucune note n’est nécessaire.
