base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/010.yaml
  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: fr
  text: 2. « Ces arbres qui bourgeonnent, dit-il, sont les justes, qui vont habiter dans l’âge à venir ; car l’âge à venir est un été pour les justes, mais un hiver pour les pécheurs. Quand donc la miséricorde du Seigneur resplendira, alors ceux qui servent Dieu seront manifestés, et tous seront manifestés. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: qui bourgeonnent
  rationale: Rend l’image d’arbres qui poussent ou produisent de nouvelles pousses, en français naturel.
- source_word: οἱ δίκαιοι
  choice: les justes
  rationale: Terme français traditionnel et direct pour désigner ceux qui vivent conformément à la justice.
- source_word: ὁ αἰὼν ὁ ἐρχόμενος
  choice: le monde à venir
  rationale: Expression française claire pour l’âge ou l’ère future; elle conserve la portée eschatologique sans imposer une formulation technique.
- source_word: θέρος
  choice: un été
  rationale: Préserve le contraste saisonnier explicite avec χειμών, « hiver ».
- source_word: ἐπιλάμψῃ
  choice: resplendira
  rationale: Conserve la métaphore lumineuse du verbe grec plutôt que de la réduire à une simple manifestation.
- source_word: φανερωθήσονται
  choice: apparaîtront alors au grand jour
  rationale: Exprime naturellement l’idée d’être rendu visible ou manifeste.
- source_word: οἱ δουλεύοντες τῷ Θεῷ
  choice: ceux qui servent Dieu
  rationale: Traduction directe, actuelle et digne de la relation de service exprimée par le grec.
theological_decisions:
- issue: Sens eschatologique de αἰών
  choice: le monde à venir
  alternative: l’âge à venir
  rationale: « Monde à venir » est plus idiomatique pour un lectorat général, tout en conservant le contraste entre l’ordre présent et l’ordre futur.
- issue: Portée de πάντες dans « tous seront manifestés »
  choice: maintien du référent indéterminé « tous »
  alternative: expliciter « tous les êtres humains » ou « tous ceux qui servent Dieu »
  rationale: Le grec ne précise pas ici le groupe visé. La traduction conserve donc l’ambiguïté au lieu de la résoudre théologiquement.
- issue: Image de la miséricorde divine qui brille
  choice: maintien de la personnification métaphorique
  alternative: « quand le Seigneur manifestera sa miséricorde »
  rationale: Le grec présente la miséricorde du Seigneur comme une lumière qui se met à briller; cette image mérite d’être préservée.
translation_notes:
  register: Français moderne international, narratif et digne. Le démonstratif initial et les répétitions structurantes sont conservés, tandis que « représentent » explicite sobrement la valeur symbolique des arbres déjà établie par la parabole.
