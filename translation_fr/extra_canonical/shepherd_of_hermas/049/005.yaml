  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/005.yaml
  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: fr
  text: '1. Il me montra de nombreux arbres qui n’avaient pas de feuilles, mais qui me semblaient desséchés, car ils étaient tous semblables. Il me dit : « Vois-tu ces arbres ? » Je répondis : « Je vois, Seigneur, qu’ils sont semblables et desséchés. » Il reprit : « Ces arbres que tu vois sont ceux qui habitent dans le monde présent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans le dialogue visionnaire, ce vocatif respectueux adressé au personnage qui interprète la vision peut se rendre naturellement par « Seigneur », sans identifier pour autant explicitement celui-ci à Dieu.
- source_word: ξηρά
  choice: desséchés
  rationale: Le terme décrit des arbres secs ou sans vie apparente ; « desséchés » conserve l’image végétale et prépare la comparaison développée dans la suite.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: dans le monde présent
  rationale: αἰών désigne ici l’ordre ou l’époque présente en contraste avec le monde à venir ; « monde présent » exprime ce contraste en français courant.
- source_word: οἱ κατοικοῦντες
  choice: ceux qui habitent
  rationale: La traduction garde l’image d’une résidence dans le monde présent, importante pour la comparaison qui suit.
theological_decisions:
- issue: Identité du personnage appelé κύριε
  choice: Conserver l’adresse « Seigneur » sans préciser l’identité du personnage
  alternative: « maître » ou « monsieur »
  rationale: Le grec marque une adresse respectueuse mais le segment ne tranche pas explicitement l’identité de l’interlocuteur ; la traduction préserve cette ouverture.
- issue: Sens eschatologique de αἰών
  choice: « monde présent »
  alternative: « siècle présent » ou « époque présente »
  rationale: Le contexte oppose cet αἰών à celui qui vient. « Monde présent » rend clairement cette tension eschatologique sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, clair et digne. Le rythme narratif et les répétitions du grec sont conservés autant que possible, avec une légère explicitation de la copule finale par « représentent » afin que la métaphore soit naturelle en français.
