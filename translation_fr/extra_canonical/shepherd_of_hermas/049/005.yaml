  to: '1. Il me montra de nombreux arbres qui n’avaient pas de feuilles, mais qui me semblaient desséchés, car ils étaient tous semblables. Il me dit : « Vois-tu ces arbres ? » Je répondis : « Je vois, Seigneur, qu’ils sont semblables et desséchés. » Il reprit : « Ces arbres que tu vois sont ceux qui habitent dans le monde présent. »'
