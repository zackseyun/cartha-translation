base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/006.yaml
  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: fr
  text: '2. Je lui demande : « Pourquoi donc, Seigneur, sont-ils comme desséchés et tous pareils ? » Il répond : « Parce que, dans le monde présent, on ne distingue ni les justes ni les pécheurs : ils paraissent tous pareils. En effet, le monde présent est un hiver pour les justes, et on ne les distingue pas lorsqu’ils vivent au milieu des pécheurs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue visionnaire, le titre respectueux s’adresse au guide de Hermas. « Seigneur » conserve le registre ancien et dignifié sans identifier nécessairement l’interlocuteur à Dieu.
- source_word: ὡσεὶ ξηρά
  choice: comme desséchés
  rationale: Rend la comparaison et l’image d’arbres privés de feuillage, sans affirmer qu’ils sont réellement morts.
- source_word: ὅμοια / ὅμοιοί
  choice: tous pareils
  rationale: Exprime leur apparence indifférenciée, idée centrale de la comparaison.
- source_word: φαίνονται
  choice: on ne distingue pas / paraissent
  rationale: Le verbe concerne ici ce qui est visible ou reconnaissable. La variation française clarifie que justes et pécheurs ne peuvent être différenciés extérieurement.
- source_word: αἰὼν οὗτος
  choice: le monde présent
  rationale: Dans ce contraste eschatologique, αἰών désigne l’ordre ou l’époque présente plutôt qu’une simple durée chronologique.
- source_word: χειμών
  choice: un hiver
  rationale: Conserve littéralement la métaphore saisonnière développée dans le contexte des arbres.
- source_word: κατοικοῦντες
  choice: lorsqu’ils vivent
  rationale: Français naturel pour l’idée d’habiter ou de demeurer au milieu des pécheurs.
theological_decisions:
- issue: Invisibilité des justes et des pécheurs dans le monde présent
  choice: « on ne distingue ni les justes ni les pécheurs »
  alternative: « ni les justes ni les pécheurs ne sont visibles »
  rationale: Le contexte ne dit pas qu’ils sont matériellement invisibles, mais que leur identité morale ne se manifeste pas encore clairement. La traduction conserve cette tension sans prétendre qu’aucune différence réelle n’existe.
- issue: Sens eschatologique de αἰών
  choice: « le monde présent »
  alternative: « l’âge présent »
  rationale: « Monde présent » est idiomatique en français moderne et maintient le contraste implicite avec le monde à venir.
translation_notes:
  register: Français moderne, clair et dignifié. Le dialogue direct et la métaphore de l’hiver sont conservés. Aucun marqueur de note n’est requis.
