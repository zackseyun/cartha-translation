  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/002.yaml
  text: 9. Thus both become partners in the work of the righteous one. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living.
translation:
  language: fr
  text: 9. Ainsi, tous deux deviennent partenaires dans l’œuvre du juste. Celui qui fait ces choses ne sera donc pas abandonné par Dieu, mais il sera inscrit dans les livres des vivants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφότεροι
  choice: tous deux
  rationale: Rend explicitement la réciprocité entre le pauvre et le riche évoqués dans le contexte immédiat.
- source_word: κοινωνοὶ
  choice: partenaires
  rationale: Exprime une participation commune et active à une même œuvre.
- source_word: τοῦ ἔργου τοῦ δικαίου
  choice: dans l’œuvre du juste
  rationale: 'Conserve le génitif grec et son ambiguïté possible : l’œuvre accomplie par le juste ou l’œuvre qui relève de la justice.'
- source_word: οὐκ ἐγκαταλειφθήσεται
  choice: ne sera pas abandonné
  rationale: Traduction directe du passif, sans atténuer la promesse.
- source_word: ἔσται ἐπιγεγραμμένος
  choice: son nom sera inscrit
  rationale: Formulation française naturelle qui explicite l’objet implicite de l’inscription personnelle, sans modifier l’image.
- source_word: εἰς τὰς βίβλους τῶν ζώντων
  choice: dans les livres des vivants
  rationale: Préserve le pluriel βίβλους et désigne les personnes vivantes, conformément à la construction grecque.
theological_decisions:
- issue: Sens de « τοῦ δικαίου »
  choice: du juste
  alternative: de la justice
  rationale: Le masculin substantivé est la lecture la plus formelle et correspond à la formulation de la couche anglaise auditée, tout en laissant subsister la tension avec le sens qualitatif possible de « justice ».
- issue: Image de l’inscription céleste
  choice: les livres des vivants
  alternative: le livre de vie
  rationale: Le texte grec porte le pluriel « livres » et le génitif pluriel « des vivants » ; la formulation traditionnelle au singulier aurait harmonisé indûment le passage avec d’autres textes.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste accessible, tout en conservant l’imagerie et les ambiguïtés réelles du grec.
