  text: 4. “But the Gentiles and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …”
translation:
  language: fr
  text: '4. « Quant aux nations et aux pécheurs, ils seront trouvés, dans cet âge-là, semblables aux arbres secs que tu as vus : secs et sans fruit, et comme… »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Rend le pluriel grec de manière directe et non confessionnelle ; dans ce contexte, il désigne les peuples étrangers à la communauté croyante.
- source_word: οἱ ἁμαρτωλοί
  choice: les pécheurs
  rationale: Équivalent français courant et précis du terme grec.
- source_word: ξηροὶ καὶ ἄκαρποι
  choice: secs et sans fruit
  rationale: Préserve l’image arboricole et le parallélisme des deux adjectifs grecs.
- source_word: ἐν ἐκείνῳ τῷ αἰῶνι
  choice: dans ce monde-là
  rationale: Dans l’opposition entre l’âge présent et celui qui vient, « monde » est ici naturel en français tout en conservant la portée eschatologique de αἰών.
- source_word: εὑρεθήσονται
  choice: ils seront trouvés
  rationale: Maintient la tournure passive du grec, qui évoque leur état constaté lors de la manifestation future.
theological_decisions:
- issue: Référent de τὰ ἔθνη
  choice: les nations
  alternative: les païens
  rationale: « Les nations » conserve la formulation grecque sans imposer une qualification religieuse plus explicite que le texte.
- issue: Traduction eschatologique de αἰών
  choice: monde
  alternative: âge
  rationale: « Monde » est plus idiomatique pour le lectorat général ; l’expression « ce monde-là » reste en contraste avec le monde présent dans le contexte immédiat.
translation_notes:
  register: Français moderne, sobre et dignifié. Le fragment source s’interrompt après ὡς ξ ; les points de suspension signalent donc une lacune réelle et ne complètent pas conjecturalement la comparaison.
