- from: 6. Ce berger prit donc en charge les brebis que lui remettait le jeune berger — celles qui vivaient dans le gaspillage et les plaisirs, mais sans bondir — et il les jeta dans un endroit escarpé, couvert d’épines et de chardons. À cause des épines et des chardons, les brebis ne pouvaient pas se dégager, mais [elles s’y empêtraient ; ainsi,] prises au piège, elles broutaient parmi les épines et les chardons. Elles souffraient beaucoup sous ses coups. Il les pourchassait de-ci de-là sans leur laisser aucun repos, et ces brebis ne pouvaient absolument pas rester tranquilles.
  to: 6. Ce berger recevait donc du jeune berger les brebis qui menaient une vie de dissipation et de plaisirs, mais sans bondir ; il les jetait dans un endroit escarpé, couvert d’épines et de tribules, si bien que les brebis ne pouvaient se dégager des épines et des tribules, mais [s’y empêtraient ; ainsi,] enchevêtrées, elles broutaient parmi les épines et les tribules. Elles souffraient beaucoup sous ses coups ; il les chassait de-ci de-là, ne leur accordait aucun repos, et ces brebis ne tenaient absolument pas en place.
