  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/004.yaml
  text: 6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living wastefully and self-indulgently, but not skipping—and he cast them into a certain steep, thorny place full of thistles, so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles. They suffered greatly, being torn by him; he drove them here and there and gave them no rest, and those sheep were not at all steady.
translation:
  language: fr
  text: 6. Ce berger recevait donc du jeune berger les brebis qui menaient une vie de dissipation et de plaisirs, mais sans bondir ; il les jetait dans un endroit escarpé, couvert d’épines et de tribules, si bien que les brebis ne pouvaient se dégager des épines et des tribules, mais [s’y empêtraient ; ainsi,] enchevêtrées, elles broutaient parmi les épines et les tribules. Elles souffraient beaucoup sous ses coups ; il les chassait de-ci de-là, ne leur accordait aucun repos, et ces brebis ne tenaient absolument pas en place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαταλῶντα καὶ τρυφῶντα
  choice: vivaient dans le gaspillage et les plaisirs
  rationale: 'Rend les deux participes distinctement : σπαταλάω évoque une vie dissipée ou dépensière, tandis que τρυφάω désigne la recherche des plaisirs et du confort.'
- source_word: μὴ σκιρτῶντα
  choice: sans bondir
  rationale: Conserve l’image concrète du comportement des brebis et le contraste avec le groupe décrit dans le contexte précédent.
- source_word: κρημνώδη καὶ ἀκανθώδη καὶ τριβολώδη
  choice: escarpé, couvert d’épines et de chardons
  rationale: Expression française naturelle qui maintient les trois caractéristiques du lieu ; « chardons » rend ici les plantes épineuses désignées par τρίβολοι.
- source_word: δαιρόμενα ὑπ' αὐτοῦ
  choice: sous ses coups
  rationale: Le verbe δέρω signifie battre ou frapper. Cette formulation évite l’ambiguïté de « déchirées par lui », qui pourrait faire du berger lui-même la cause physique des écorchures dues aux épines.
- source_word: περιήλαυνεν
  choice: pourchassait de-ci de-là
  rationale: Rend l’action répétée de mener ou chasser les brebis dans plusieurs directions.
- source_word: οὐκ εὐσταθοῦσαν
  choice: ne pouvaient absolument pas rester tranquilles
  rationale: Exprime leur absence totale de stabilité ou de répit dans ce contexte de déplacement forcé.
theological_decisions:
- issue: Nature de la souffrance infligée par le berger
  choice: « sous ses coups »
  alternative: « déchirées par lui »
  rationale: Le grec attribue explicitement au berger l’action exprimée par δέρω, généralement « battre » ou « frapper » ; la traduction ne transforme donc pas la discipline figurée en simple effet des épines.
- issue: Conservation de l’opposition entre corruption et bondissement dans l’allégorie
  choice: maintenir littéralement « sans bondir »
  alternative: expliciter comme « sans blasphémer » d’après le contexte
  rationale: Le segment grec garde l’image des brebis. L’interprétation morale est donnée dans le discours environnant et ne doit pas être substituée à l’image dans ce verset.
translation_notes:
  register: Français moderne, narratif et digne. Les images pastorales restent concrètes, tandis que la syntaxe est allégée pour une lecture courante. Les crochets de la source sont conservés afin de signaler le passage textuellement incertain ; aucun appel de note n’est requis puisqu’aucune note n’est fournie.
