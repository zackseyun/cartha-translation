  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: fr
  text: '5. Nous avançâmes encore un peu, et il me montra un grand berger, d’apparence presque sauvage. Il était revêtu d’une peau de chèvre blanche et avait sur les épaules une besace, ainsi qu’un bâton très dur et noueux, et un grand fouet. Son regard était extrêmement dur, au point que j’en eus peur : tel était son regard.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα μέγαν
  choice: un grand berger
  rationale: Rend directement la taille ou la stature imposante du berger sans ajouter d’interprétation.
- source_word: ὡσεὶ ἄγριον τῇ ἰδέᾳ
  choice: d’apparence presque sauvage
  rationale: Conserve la nuance comparative de ὡσεὶ et rapporte ἄγριον à l’apparence, comme l’indique τῇ ἰδέᾳ.
- source_word: δέρμα αἴγειον λευκόν
  choice: une peau de chèvre blanche
  rationale: Traduction concrète et naturelle du vêtement ou revêtement décrit, sans préciser une forme non exprimée.
- source_word: πήραν
  choice: une besace
  rationale: Désigne naturellement en français le sac porté à l’épaule par un voyageur ou un berger.
- source_word: ῥάβδον σκληρὰν λίαν καὶ ὄζους ἔχουσαν
  choice: un bâton très dur et noueux
  rationale: « Noueux » rend idiomatiquement le fait que le bâton porte des nœuds, tandis que « très dur » préserve l’intensif λίαν.
- source_word: τὸ βλέμμα ... περίπικρον
  choice: Son regard était extrêmement sévère
  rationale: Le composé rare et intensif décrit un regard particulièrement dur ou âpre; « extrêmement sévère » reste naturel sans surcharger le français.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit visionnaire écrit. La répétition finale de « regard » est maintenue, car elle reflète l’insistance du grec plutôt que d’être lissée.
