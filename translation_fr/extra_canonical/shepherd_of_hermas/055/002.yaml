base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: fr
  text: « Les brebis que tu as vues, qui ne bondissaient pas mais broutaient en un même lieu, ce sont ceux qui se sont livrés aux plaisirs et aux tromperies, mais qui n’ont en rien blasphémé le Seigneur. Ils sont donc corrompus, loin de la vérité. Chez eux, il y a l’espoir d’une repentance, dans laquelle ils peuvent vivre. La corruption offre donc l’espoir d’un certain renouvellement, tandis que la mort entraîne une perdition éternelle. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαῖς
  choice: plaisirs
  rationale: Le terme désigne les jouissances et le luxe complaisant; « plaisirs » est naturel en français et conserve ici la portée morale du contexte.
- source_word: ἀπάταις
  choice: tromperies
  rationale: Rend le pluriel grec sans décider s’il s’agit principalement d’illusions subies ou de pratiques trompeuses.
- source_word: κατεφθαρμένοι ... ἀπὸ τῆς ἀληθείας
  choice: se sont détournés de la vérité jusqu’à se corrompre
  rationale: Cette formulation restitue à la fois l’éloignement marqué par ἀπό et l’état de corruption exprimé par le parfait passif.
- source_word: μετανοίας
  choice: repentance
  rationale: Terme français courant dans un contexte religieux, exprimant un changement profond de pensée et de conduite.
- source_word: ἀνανεώσεώς τινος
  choice: une certaine restauration
  rationale: « Restauration » exprime ici le renouvellement possible d’un état corrompu; « une certaine » préserve l’indétermination de τινος.
- source_word: ἀπώλειαν ... αἰώνιον
  choice: une perdition éternelle
  rationale: « Perdition » conserve la force existentielle et théologique d’ἀπώλεια sans la réduire à une simple disparition.
theological_decisions:
- issue: Lien entre repentance et vie
  choice: « par laquelle ils peuvent vivre »
  alternative: « dans laquelle ils peuvent vivre »
  rationale: Le relatif grec ἐν ᾗ peut être instrumental ou sphérique. « Par laquelle » suit le sens contextuel probable tout en évitant d’ajouter une doctrine précise sur le mécanisme du salut.
- issue: Contraste entre corruption et mort
  choice: « La corruption laisse donc espérer une certaine restauration, tandis que la mort mène à une perdition éternelle »
  alternative: « La corruption a donc l’espoir d’un certain renouvellement, mais la mort a une destruction éternelle »
  rationale: La traduction naturelle conserve le contraste catégorique du texte entre un état encore remédiable et la mort associée à une issue éternelle, sans identifier davantage la nature de cette mort.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct et la métaphore des brebis sont conservés; la syntaxe a été légèrement fluidifiée sans effacer la progression argumentative ni la tension théologique.
