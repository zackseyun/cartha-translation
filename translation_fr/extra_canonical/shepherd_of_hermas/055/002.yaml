revisions:
- from: '« Les brebis que tu as vues ne bondissaient pas, mais broutaient au même endroit : ce sont ceux qui se sont livrés aux plaisirs et aux tromperies, sans toutefois blasphémer le Seigneur en quoi que ce soit. Ils se sont donc détournés de la vérité jusqu’à se corrompre. Pour eux, il reste un espoir de repentance, par laquelle ils peuvent vivre. La corruption laisse donc espérer une certaine restauration, tandis que la mort mène à une perdition éternelle. »'
  to: « Les brebis que tu as vues, qui ne bondissaient pas mais broutaient en un même lieu, ce sont ceux qui se sont livrés aux plaisirs et aux tromperies, mais qui n’ont en rien blasphémé le Seigneur. Ils sont donc corrompus, loin de la vérité. Chez eux, il y a l’espoir d’une repentance, dans laquelle ils peuvent vivre. La corruption offre donc l’espoir d’un certain renouvellement, tandis que la mort entraîne une perdition éternelle. »
  rationale: La révision corrige la représentation de κατεφθαρμένοι en conservant l’état passif de corruption et le lien avec l’éloignement de la vérité, sans créer une chaîne narrative absente du texte. Elle remplace aussi « restauration » par « renouvellement », plus proche de ἀνανεώσεως, et maintient l’ambiguïté de ἐν ᾗ. Aucun appel de note n’est requis dans ce segment.
