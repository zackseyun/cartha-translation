  text: And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”
translation:
  language: fr
  text: 'Il me dit : « Vois-tu ce berger ? »

    « Oui, maître », lui répondis-je.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα
  choice: berger
  rationale: Équivalent français naturel de « berger », qui conserve ici le sens concret de la figure visionnaire.
- source_word: Βλέπεις
  choice: Vois-tu
  rationale: Rend directement le présent grec dans une question simple et naturelle.
- source_word: κύριε
  choice: maître
  rationale: Dans cette adresse respectueuse, « maître » préserve la déférence sans identifier nécessairement l’interlocuteur au Seigneur.
- source_word: φημί
  choice: lui répondis-je
  rationale: Le verbe introducteur grec signifie littéralement « dis-je » ; « lui répondis-je » explicite naturellement la fonction de la réplique en français.
theological_decisions:
- issue: Sens de κύριε dans l’adresse
  choice: maître
  alternative: Seigneur / monsieur
  rationale: La minuscule et le contexte d’une adresse à l’interlocuteur visionnaire ne permettent pas d’y voir nécessairement un titre divin. « Maître » conserve le respect et une certaine dignité, tandis que « Seigneur » risquerait de trancher théologiquement et « monsieur » serait trop moderne et socialement marqué.
translation_notes:
  register: Français moderne, clair et digne. Le dialogue bref est conservé, avec une ponctuation française naturelle et sans ajout explicatif.
