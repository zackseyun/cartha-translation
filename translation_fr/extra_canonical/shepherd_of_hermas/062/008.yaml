  text: “[Those who grappled with the devil and overcame him,” he says, “are crowned.] These are the ones who suffered for the law.
translation:
  language: fr
  text: « [Ceux qui ont lutté contre le diable et l’ont vaincu, dit-il, sont couronnés.][a] Ce sont ceux qui ont souffert pour la Loi. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase placée entre crochets est signalée comme textuellement incertaine dans l’édition grecque source.
    reason: Les crochets éditoriaux du texte source doivent être rendus visibles et expliqués sans affirmer une histoire manuscrite que les données fournies ne permettent pas de préciser.
lexical_decisions:
- source_word: συμπαλαίσαντες
  choice: ont lutté contre
  rationale: Le verbe évoque une lutte vigoureuse, voire corps à corps. « Ont lutté contre » restitue clairement l’image sans produire une tournure artificielle en français.
- source_word: ἐνίκησαν
  choice: l’ont vaincu
  rationale: Rend directement l’idée de victoire sur le diable et conserve le pronom référant à celui-ci.
- source_word: ἐστεφανωμένοι
  choice: sont couronnés
  rationale: Préserve l’image explicite de la couronne accordée aux vainqueurs.
- source_word: ὑπὲρ τοῦ νόμου παθόντες
  choice: ont souffert pour la Loi
  rationale: '« Pour » conserve la portée de ὑπέρ : ils ont souffert en raison de leur fidélité à la Loi ou pour sa défense, sans trancher davantage. La majuscule marque la Loi divine définie dans le contexte immédiat.'
theological_decisions:
- issue: Rapport entre la lutte contre le diable et la souffrance pour la Loi
  choice: Conserver les deux affirmations successives sans les fusionner
  alternative: Expliciter que la victoire consiste précisément à souffrir pour la Loi
  rationale: Le grec juxtapose l’explication de la couronne et l’identification de ceux qui ont souffert pour la Loi ; il ne formule pas explicitement une équivalence exhaustive.
- issue: Statut du νόμος dans le contexte
  choice: Traduire par « la Loi »
  alternative: « la loi » ou « la loi de Dieu »
  rationale: Le contexte identifie cette Loi à la réalité divine proclamée dans le monde entier. La majuscule signale ce référent précis sans ajouter une qualification absente de la phrase.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe du dialogue reste naturelle, et le vocabulaire conserve les images de la lutte et de la couronne.
