  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/007.yaml
  text: “Who then, Sir,” I say, “are the ones who are crowned and go into the tower?”
translation:
  language: fr
  text: « Seigneur, qui sont donc, dis-je, ceux qui sont couronnés et qui vont dans la tour ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Conserve l’adresse respectueuse au personnage céleste sans préciser davantage son identité.
- source_word: οἱ ἐστεφανωμένοι
  choice: ceux qui portent une couronne
  rationale: Rend naturellement en français le participe parfait passif, qui décrit leur état présent de personnes couronnées.
- source_word: εἰς τὸν πύργον ὑπάγοντες
  choice: qui entrent dans la tour
  rationale: Dans ce contexte, le mouvement vers la tour aboutit à l’entrée en son sein ; cette formulation est naturelle et cohérente avec la scène.
theological_decisions:
- issue: Sens de la couronne
  choice: Ne pas expliciter ce que symbolise la couronne
  alternative: ceux qui ont reçu la couronne de la victoire
  rationale: Le texte pose précisément la question de l’identité de ces personnes ; ajouter « victoire » anticiperait l’explication donnée ensuite.
translation_notes:
  register: Français moderne, sobre et dignifié. La structure dialoguée et l’incise « dis-je » sont conservées, de même que la répétition de « qui », naturelle ici et utile à la clarté.
