base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: fr
  text: Ceux qui ont remis leurs rameaux verts tels qu’ils les avaient reçus sont des personnes honorables et justes ; ils ont très bien vécu, avec un cœur pur, et ont gardé les commandements du Seigneur. Tu apprendras le reste lorsque j’examinerai attentivement ces rameaux qui ont été plantés et arrosés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: rameaux
  rationale: Dans l’image développée par le passage, il s’agit de branches ou de rameaux remis puis plantés; «rameaux» est naturel et maintient le lien avec l’arbre.
- source_word: σεμνοὶ
  choice: honorables
  rationale: Rend la dignité morale exprimée par le terme sans suggérer ici une fonction religieuse particulière.
- source_word: πορευθέντες
  choice: ont marché
  rationale: Conserve la métaphore biblique de la conduite de vie, claire en français courant.
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: avec un cœur entièrement pur
  rationale: Préserve l’expression anthropologique du grec; «entièrement» rend la force de λίαν, qui porte vraisemblablement sur la pureté de la conduite ou du cœur.
- source_word: πεφυλακότες
  choice: ont gardé
  rationale: Exprime l’observance attentive et fidèle des commandements.
- source_word: κατανοήσω
  choice: j’aurai examiné
  rationale: Le verbe indique une observation attentive, adaptée à l’inspection des rameaux.
theological_decisions:
- issue: Portée de λίαν dans λίαν πορευθέντες ἐν καθαρᾷ καρδίᾳ
  choice: «ont marché avec un cœur entièrement pur»
  alternative: «ont mené une vie tout à fait pure de cœur»
  rationale: La syntaxe grecque est quelque peu heurtée. La traduction conserve la métaphore de la marche et rattache naturellement l’intensification à la pureté du cœur, sans surinterpréter le degré de perfection morale.
- issue: Identité des «autres»
  choice: «tu apprendras qui ils sont»
  alternative: «tu apprendras le reste»
  rationale: Dans le contexte, l’examen doit révéler la situation des autres groupes représentés par les rameaux. L’explicitation minimale fournit en français le complément implicite sans trancher davantage leur sort.
translation_notes:
  register: 'Français moderne, international et digne. La formulation reste accessible tout en conservant les images structurantes du texte: les rameaux, la marche, le cœur pur et la garde des commandements.'
