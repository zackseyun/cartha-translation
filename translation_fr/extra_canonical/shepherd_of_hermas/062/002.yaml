base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/002.yaml
  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: fr
  text: « Écoute, dit-il. Ce grand arbre, qui couvre les plaines, les montagnes et toute la terre, est la loi de Dieu donnée au monde entier. Cette loi est le Fils de Dieu, proclamé jusqu’aux extrémités de la terre. Quant aux peuples qui se trouvent sous son ombre, ce sont ceux qui ont entendu la proclamation et qui ont cru en lui. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκεπάζον
  choice: qui couvre
  rationale: Rend directement l’image de l’arbre qui étend sa protection sur les territoires énumérés.
- source_word: νόμος Θεοῦ
  choice: la loi de Dieu
  rationale: Équivalent formel et théologiquement non interprétatif du syntagme grec.
- source_word: κηρυχθεὶς
  choice: proclamé
  rationale: Conserve l’idée d’une annonce publique sans préciser davantage le contenu de la proclamation.
- source_word: ὑπὸ τὴν σκέπην
  choice: sous son ombre
  rationale: Expression française naturelle pour l’abri offert par un arbre; le possessif explicite le référent sans ajouter d’interprétation.
- source_word: τοῦ κηρύγματος
  choice: la proclamation
  rationale: Maintient le lien lexical avec « proclamé » et évite d’importer un terme plus spécifiquement confessionnel.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: qui ont cru en lui
  rationale: Rend la construction personnelle de foi; le masculin renvoie au Fils de Dieu, conformément au contexte immédiat.
theological_decisions:
- issue: Identification de la loi au Fils de Dieu
  choice: « Cette loi est le Fils de Dieu »
  alternative: « Cette loi représente le Fils de Dieu »
  rationale: Le grec emploie explicitement ἐστίν, « est ». Ajouter « représente » résoudrait l’image en l’interprétant et atténuerait l’identification formulée par le texte.
- issue: Référent de αὐτόν dans « croire en lui »
  choice: le Fils de Dieu
  alternative: la proclamation ou la loi
  rationale: La forme masculine αὐτόν correspond naturellement à υἱὸς, « Fils », tandis que « loi » et « proclamation » sont féminines en grec.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement grec tout en évitant les lourdeurs; la répétition de « proclamation/proclamé » est conservée pour refléter le lien lexical du texte source.
