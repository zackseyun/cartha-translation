  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/005.yaml
  text: I say to him, “Sir, why did he send some away into the tower, but leave others to you?”
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, pourquoi en a-t-il envoyé certains dans la tour, tandis qu’il t’en a laissé d’autres ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans ce dialogue visionnaire, le terme est une adresse respectueuse à un personnage investi d’autorité; « Seigneur » conserve la dignité du grec et la cohérence du passage.
- source_word: ἀπέλυσεν
  choice: a envoyé
  rationale: Le verbe signifie ici faire partir ou renvoyer; avec la destination εἰς τὸν πύργον, « envoyer vers » rend naturellement le mouvement sans préciser indûment sa nuance.
- source_word: εἰς τὸν πύργον
  choice: vers la tour
  rationale: « Vers » exprime l’orientation du déplacement et évite de décider si les personnes sont déjà entrées dans la tour.
- source_word: σοὶ κατέλειψεν
  choice: t’en a laissé
  rationale: Cette formulation rend l’idée de laisser des personnes à la charge ou sous l’autorité de l’interlocuteur, explicitée par la réponse qui suit.
theological_decisions:
- issue: Identité de celui qui envoie les personnes vers la tour
  choice: Conserver le pronom « il »
  alternative: Nommer Michel ou « le grand ange »
  rationale: Le grec emploie un sujet implicite à la troisième personne; l’identifier dans la traduction supprimerait une part de la dépendance contextuelle du texte.
- issue: Portée symbolique de la tour
  choice: Conserver simplement « la tour »
  alternative: Expliciter « l’Église » ou une autre interprétation symbolique
  rationale: Le segment pose une question dans le cadre de la vision sans expliquer ici le symbole; la traduction ne doit pas intégrer l’interprétation au texte.
translation_notes:
  register: Français moderne, clair et digne. La structure interrogative et l’opposition grecque οὓς μὲν… οὓς δὲ sont rendues par « certains… tandis que… d’autres ». Aucun marqueur de note n’est requis.
