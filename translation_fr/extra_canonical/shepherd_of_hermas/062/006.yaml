base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: fr
  text: « Tous ceux qui ont transgressé la loi qu’ils ont reçue de lui, dit-il, il les a laissés sous mon autorité en vue de leur repentir ; mais tous ceux qui ont déjà plu à la loi et qui l’ont gardée, il les tient sous sa propre autorité. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέβησαν
  choice: ont transgressé
  rationale: Rend directement l’idée de franchir les limites prescrites par la loi, dans un registre digne et courant.
- source_word: εἰς μετάνοιαν
  choice: en vue de la repentance
  rationale: Exprime la finalité de cette remise sous autorité tout en conservant le sens religieux fort de μετάνοια, changement profond de disposition et de conduite.
- source_word: εὐηρέστησαν τῷ νόμῳ
  choice: se sont déjà rendus agréables à la loi
  rationale: Préserve la formulation grecque inhabituelle, où la loi est l’objet auquel on plaît, sans la normaliser en « ont obéi à la loi ».
- source_word: ὑπὸ τὴν ἰδίαν ἐξουσίαν ἔχει
  choice: il les tient sous sa propre autorité
  rationale: Respecte le présent ἔχει et la notion d’autorité ou de juridiction exprimée par ἐξουσία.
theological_decisions:
- issue: Rapport entre transgression, autorité et repentance
  choice: Conserver « il les a laissés sous mon autorité en vue de la repentance »
  alternative: « il me les a confiés afin qu’ils se repentent »
  rationale: La formulation retenue reste proche de la structure grecque et évite de préciser au-delà du texte le rôle exact exercé dans le processus de repentance.
- issue: Personnification implicite de la loi
  choice: « se sont déjà rendus agréables à la loi »
  alternative: « ont déjà vécu conformément à la loi »
  rationale: Le grec affirme littéralement qu’ils ont plu à la loi. Cette tension théologique et rhétorique ne doit pas être discrètement résolue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe de la parole rapportée et la répétition de « autorité » sont conservées afin de refléter la structure et les contrastes du grec.
