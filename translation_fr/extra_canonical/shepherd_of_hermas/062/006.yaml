revisions:
- from: « Tous ceux qui ont transgressé la loi qu’ils avaient reçue de lui, dit-il, il les a laissés sous mon autorité en vue de la repentance ; mais tous ceux qui se sont déjà rendus agréables à la loi et qui l’ont gardée, il les tient sous sa propre autorité. »
  to: « Tous ceux qui ont transgressé la loi qu’ils ont reçue de lui, dit-il, il les a laissés sous mon autorité en vue de leur repentir ; mais tous ceux qui ont déjà plu à la loi et qui l’ont gardée, il les tient sous sa propre autorité. »
  rationale: 'La révision améliore l’idiomaticité française tout en conservant les particularités du grec : la finalité associée au repentir, le contraste entre les deux autorités, le présent « il les tient », et surtout la personnification de la loi à laquelle certains « ont plu ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle au grec : les transgresseurs sont laissés sous l’autorité du locuteur en rapport avec la repentance, tandis que ceux qui ont plu à la loi et l’ont gardée relèvent de l’autorité propre de l’autre personnage. Toutefois, « se sont rendus agréables » ajoute l’idée de se rendre/devenir que l’aoriste εὐηρέστησαν n’exprime pas nécessairement.'
  naturalness: « En vue de la repentance » est compréhensible, mais « repentance » est moins idiomatique en français international moderne que « repentir ». « Ont déjà plu à la loi » conserve la personnification surprenante du grec tout en étant plus naturel que « se sont rendus agréables à la loi ».
  terminology: « Transgressé », « loi », « autorité » et « gardée » conviennent. « Repentir » est le terme français moderne usuel pour μετάνοια dans ce contexte, sans réduire son sens. La formulation « plaire à la loi » préserve volontairement l’image rhétorique du texte sans l’interpréter comme une simple obéissance.
  issues:
  - severity: medium
    issue: « se sont déjà rendus agréables à la loi »
    rationale: Cette expression est lourde en français et introduit une nuance réflexive/de transformation absente de εὐηρέστησαν. Le verbe grec signifie directement « ont plu » ; sa construction inhabituelle avec « la loi » doit être maintenue, mais sans ajout sémantique.
  - severity: low
    issue: « en vue de la repentance »
    rationale: La construction rend la finalité de εἰς μετάνοιαν, mais « repentir » est plus courant et plus naturel en français international moderne. L’ajout de « leur » rend explicite le référent déjà implicite dans le grec, sans changer le sens.
  revised_text: « Tous ceux qui ont transgressé la loi qu’ils ont reçue de lui, dit-il, il les a laissés sous mon autorité en vue de leur repentir ; mais tous ceux qui ont déjà plu à la loi et qui l’ont gardée, il les tient sous sa propre autorité. »
  revised_footnotes: []
