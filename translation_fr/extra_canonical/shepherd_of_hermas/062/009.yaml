revisions:
- from: Les autres, qui ont eux aussi remis leurs rameaux verts, avec de jeunes pousses mais sans fruit, sont ceux qui ont subi des épreuves à cause de la Loi, sans toutefois endurer de souffrances ni renier leur Loi.
  to: Les autres aussi, qui ont remis des bâtons verts portant des pousses latérales, mais sans fruit, sont ceux qui ont été éprouvés pour la Loi, sans avoir souffert ni renié leur Loi.
  rationale: La révision resserre la traduction sur les termes et les relations du grec, en conservant l’opposition délibérée entre l’affliction (θλιβέντες) et le fait d’avoir souffert (μὴ παθόντες), ainsi que le possessif αὐτῶν. Aucune note n’est nécessaire pour ce segment.
  reviewer_model: gpt-5.6-terra
