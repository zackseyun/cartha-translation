base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: fr
  text: Les autres aussi, qui ont remis des bâtons verts portant des pousses latérales, mais sans fruit, sont ceux qui ont été éprouvés pour la Loi, sans avoir souffert ni renié leur Loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: rameaux
  rationale: Dans l’image de l’arbre, « rameaux » est plus naturel que « bâtons » et conserve le lien organique avec les pousses et le fruit.
- source_word: παραφυάδας
  choice: jeunes pousses
  rationale: Le terme désigne des pousses latérales; « jeunes pousses » rend clairement l’image végétale en français courant.
- source_word: θλιβέντες
  choice: ont subi des épreuves
  rationale: Le participe évoque la pression ou l’affliction; cette formulation préserve une intensité moindre que παθόντες, explicitement nié ensuite.
- source_word: νόμου
  choice: Loi
  rationale: La majuscule marque ici la Loi divine identifiée dans le contexte, sans ajouter une qualification absente du grec.
- source_word: μὴ παθόντες
  choice: sans toutefois endurer de souffrances
  rationale: Cette traduction maintient la distinction voulue entre avoir été éprouvé ou opprimé et avoir effectivement souffert au sens plus fort.
- source_word: ἀρνησάμενοι
  choice: renier
  rationale: « Renier » exprime le refus public ou l’abandon de la Loi avec la force religieuse du verbe grec.
theological_decisions:
- issue: Rapport entre l’épreuve et la souffrance
  choice: Distinguer « subir des épreuves » de « endurer des souffrances »
  alternative: Traduire les deux expressions par des synonymes presque équivalents d’« être persécuté »
  rationale: Le grec oppose θλιβέντες à μὴ παθόντες; la traduction doit conserver cette tension plutôt que l’aplanir.
- issue: Sens de « leur Loi »
  choice: Conserver le possessif dans « leur Loi »
  alternative: Remplacer par « la Loi » ou « la loi de Dieu »
  rationale: Le grec porte explicitement αὐτῶν. Le possessif signale leur attachement à la Loi sans préciser davantage la relation théologique.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la structure explicative du grec tout en évitant une syntaxe trop lourde. Aucun appel de note n’est nécessaire.
