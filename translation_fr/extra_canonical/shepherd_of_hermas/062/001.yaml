base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/001.yaml
  text: I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, fais-moi savoir ce qu’est cet arbre. Je suis en effet perplexe à son sujet : bien que tant de branches en aient été coupées, l’arbre est en bon état, et rien ne semble lui avoir été retranché. Voilà donc ce qui me laisse perplexe. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans cette adresse respectueuse à l’interlocuteur visionnaire, « Seigneur » conserve la dignité du grec sans préciser davantage son identité.
- source_word: γνώρισόν μοι
  choice: fais-moi savoir
  rationale: Rend directement la demande de révélation ou d’explication exprimée par l’impératif grec.
- source_word: ἀποροῦμαι
  choice: je suis perplexe / me laisse perplexe
  rationale: Le verbe exprime l’embarras devant une énigme; la répétition française préserve l’insistance du texte grec.
- source_word: ὑγιές
  choice: intact
  rationale: Dans le contexte d’un arbre dont les branches ont été coupées sans laisser de trace, « intact » exprime mieux que « sain » l’absence visible de dommage.
- source_word: κλάδων κοπέντων
  choice: branches qui en ont été coupées
  rationale: Préserve l’image concrète de branches retranchées de l’arbre et la valeur concessive suggérée par le contexte.
