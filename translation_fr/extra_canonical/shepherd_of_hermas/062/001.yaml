  to: 'Je lui dis : « Seigneur, fais-moi savoir ce qu’est cet arbre. Je suis en effet perplexe à son sujet : bien que tant de branches en aient été coupées, l’arbre est en bon état, et rien ne semble lui avoir été retranché. Voilà donc ce qui me laisse perplexe. »'
