  source_fidelity: La traduction rend fidèlement l’adresse, la demande d’explication et l’insistance sur la perplexité. Toutefois, « toutes les branches » transforme τοσούτων (« tant de / un si grand nombre de ») en une totalité qui n’est pas exprimée par le grec.
