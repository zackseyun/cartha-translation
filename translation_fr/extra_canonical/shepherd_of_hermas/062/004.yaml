  naturalness: Le français est clair, moderne et d’un registre approprié. « Baguettes » reste un choix possible et cohérent pour les ῥάβδοι de cette scène. « Rendues inutiles » rend plus précisément le parfait passif ἠχρειωμένας que « devenues inutiles », en conservant l’idée qu’elles ont été mises dans cet état.
  terminology: « Loi » convient au νόμος divin défini dans le contexte, et « demeure » conserve utilement l’ambiguïté de κατοικία. La répétition de « baguettes » et de « Loi » reflète l’explication symbolique du grec.
