base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: fr
  text: « Tu vois les baguettes de chacun, car les baguettes sont la Loi. Tu vois donc beaucoup de baguettes rendues inutiles ; tu reconnaîtras tous ceux qui n’ont pas observé la Loi, et tu verras la demeure de chacun. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: baguettes
  rationale: Dans la scène, il s’agit de pièces de bois remises puis examinées. « Baguettes » conserve l’image concrète sans suggérer principalement un instrument de châtiment, comme pourrait le faire « verges ».
- source_word: ὁ νόμος
  choice: la Loi
  rationale: La majuscule indique qu’il s’agit ici de la Loi divine déjà définie dans le contexte, sans préciser davantage sa portée théologique.
- source_word: ἠχρειωμένας
  choice: devenues inutiles
  rationale: Rend le sens de choses rendues impropres ou sans valeur, tout en évitant d’ajouter une cause non exprimée.
- source_word: κατοικία
  choice: demeure
  rationale: Conserve le sens spatial et la possible portée eschatologique du terme sans le réduire explicitement à une récompense ou à un châtiment.
theological_decisions:
- issue: Rapport symbolique entre les baguettes et la Loi
  choice: « les baguettes représentent la Loi »
  alternative: « les baguettes sont la Loi »
  rationale: Le contexte expose explicitement une correspondance symbolique. « Représentent » donne en français naturel la fonction de la copule grecque sans modifier le contenu de l’interprétation.
- issue: Sens de la demeure attribuée à chacun
  choice: Maintien du terme général « demeure »
  alternative: Expliciter « sort final » ou « destination »
  rationale: Le grec ne précise pas ici la nature de cette demeure; l’expliciter résoudrait indûment une ambiguïté potentiellement eschatologique.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « baguettes » et de « Loi » est conservée afin de maintenir la structure explicative et symbolique du grec.
