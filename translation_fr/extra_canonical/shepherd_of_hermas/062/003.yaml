base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/003.yaml
  text: “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.
translation:
  language: fr
  text: Le grand et glorieux ange, c’est Michel, celui qui détient l’autorité sur ce peuple et qui le dirige. Car c’est lui qui leur donne la loi, la mettant dans le cœur de ceux qui croient. Il vient donc lui-même examiner ceux à qui il l’a donnée, pour voir s’ils l’ont gardée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδοξος
  choice: glorieux
  rationale: Rend directement l’idée d’honneur et de gloire attachée à l’ange, dans un registre digne et naturel.
- source_word: ἐξουσία
  choice: autorité
  rationale: Conserve le sens d’autorité ou de juridiction sans préciser indûment sa nature.
- source_word: διακυβερνῶν
  choice: dirige
  rationale: Exprime l’action de gouverner et de conduire le peuple dans un français courant.
- source_word: ὁ διδοὺς αὐτοῖς τὸν νόμον εἰς τὰς καρδίας
  choice: qui leur donne la loi, la mettant dans le cœur
  rationale: Le grec est quelque peu heurté; cette formulation préserve à la fois le don de la loi et son intériorisation sans faire croire que «dans le cœur» modifie les destinataires.
- source_word: ἐπισκέπτεται
  choice: vient […] examiner
  rationale: Dans ce contexte de vérification, le verbe signifie visiter en vue d’une inspection; «examiner» rend clairement cette fonction.
- source_word: τετηρήκασιν
  choice: ont gardée
  rationale: «Garder» maintient le motif répété de l’observance de la loi et reste naturel dans ce registre.
theological_decisions:
- issue: Rôle de Michel à l’égard de la loi et du peuple
  choice: Traduire littéralement Michel comme celui qui donne la loi aux croyants et exerce l’autorité sur ce peuple.
  alternative: Atténuer «donne» en «transmet» ou identifier théologiquement Michel à une autre figure.
  rationale: Le texte grec attribue explicitement ces fonctions à Michel. La traduction conserve cette affirmation propre à l’œuvre sans l’harmoniser avec une doctrine extérieure.
- issue: Destination intérieure de la loi
  choice: «la mettant dans le cœur de ceux qui croient»
  alternative: «aux cœurs de ceux qui croient» ou «à ceux qui croient dans leur cœur»
  rationale: Cette formulation suit le mouvement du grec vers les cœurs et évite l’ambiguïté française selon laquelle la croyance elle-même serait nécessairement qualifiée par «dans leur cœur».
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été légèrement dépliée pour clarifier la construction grecque, tout en conservant les répétitions structurantes autour de la loi, de son don et de sa garde.
