revisions:
- from: 'Il dit : « Tu raisonnes bien et avec justesse. En effet, comme serviteur de Dieu, tu devais marcher dans la vérité, ne pas laisser une mauvaise conscience habiter avec l’esprit de vérité, ni attrister l’Esprit digne de respect et vrai. » Je lui dis : « Jamais, Seigneur, je n’avais entendu de telles paroles exposées aussi clairement. »'
  to: 'Il dit : « Tu penses bien et avec vérité. En effet, comme serviteur de Dieu, tu devais marcher dans la vérité, ne pas laisser une mauvaise conscience habiter avec l’esprit de vérité, ni attrister l’esprit digne de respect et vrai. » Je lui dis : « Jamais, Seigneur, je n’ai entendu de telles paroles aussi clairement. »'
  rationale: Révision limitée au temps verbal, à la suppression d’un ajout interprétatif et à la capitalisation non imposée par le grec. La formulation conserve les répétitions de « vérité/vrai », l’image éthique de la marche et l’ambiguïté du référent de πνεῦμα.
