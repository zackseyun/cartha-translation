base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/004.yaml
  text: He says, ‘You are thinking rightly and truly; for it was necessary for you, as a servant of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth, nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’
translation:
  language: fr
  text: 'Il dit : « Tu penses bien et avec vérité. En effet, comme serviteur de Dieu, tu devais marcher dans la vérité, ne pas laisser une mauvaise conscience habiter avec l’esprit de vérité, ni attrister l’esprit digne de respect et vrai. » Je lui dis : « Jamais, Seigneur, je n’ai entendu de telles paroles aussi clairement. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς καὶ ἀληθῶς φρονεῖς
  choice: Tu raisonnes bien et avec justesse
  rationale: Rend naturellement le jugement favorable porté sur la manière de penser, sans confondre ἀληθῶς avec la simple sincérité.
- source_word: ἐν ἀληθείᾳ πορεύεσθαι
  choice: marcher dans la vérité
  rationale: Conserve l’image éthique biblique de la marche et le lien lexical avec le thème dominant de la vérité.
- source_word: πονηρὰν συνείδησιν
  choice: une mauvaise conscience
  rationale: Équivalent direct et idiomatique de l’expression grecque.
- source_word: τῷ πνεύματι τῷ σεμνῷ καὶ ἀληθεῖ
  choice: l’Esprit digne de respect et vrai
  rationale: σεμνός exprime ce qui inspire révérence et respect; cette formulation évite de l’identifier sans réserve à « saint », tout en conservant ἀληθής.
- source_word: ἀκριβῶς ἤκουσα
  choice: entendu de telles paroles exposées aussi clairement
  rationale: Dans ce contexte, ἀκριβῶς qualifie vraisemblablement la précision ou la clarté avec laquelle l’enseignement est entendu; « exposées » explicite légèrement ce rapport.
theological_decisions:
- issue: Référent et capitalisation de πνεῦμα dans la dernière proposition
  choice: « l’Esprit » avec une majuscule
  alternative: « l’esprit » avec une minuscule
  rationale: Le discours présente cet esprit comme venant de Dieu, habitant l’être humain et susceptible d’être attristé, ce qui favorise une lecture personnelle et divine; le grec demeure toutefois lexicalement compatible avec « esprit » au sens du don confié par Dieu.
- issue: Sens de σεμνός appliqué à l’Esprit
  choice: « digne de respect »
  alternative: « saint » ou « vénérable »
  rationale: Le mot grec n’est pas ἅγιος. « Digne de respect » préserve sa nuance propre sans importer une désignation théologique plus précise.
- issue: Adresse κύριε
  choice: « Seigneur »
  alternative: « monsieur » ou « maître »
  rationale: Dans le dialogue avec le mandataire angélique, κύριε est une adresse respectueuse. « Seigneur » conserve la dignité traditionnelle et l’ambiguïté de l’appellation sans identifier l’interlocuteur à Dieu.
translation_notes:
  register: Français moderne, soutenu mais accessible. La répétition de « vérité/vrai » est volontaire afin de préserver le réseau lexical central du passage. La syntaxe reste proche du grec tout en évitant une tournure artificielle.
