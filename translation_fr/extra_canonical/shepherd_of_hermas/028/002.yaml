base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/002.yaml
  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: fr
  text: Ainsi, ceux qui mentent rejettent le Seigneur et se rendent coupables de le spolier, car ils ne lui rendent pas le dépôt qu’ils ont reçu. Ils ont en effet reçu de lui un esprit exempt de mensonge. S’ils le lui rendent mensonger, ils ont souillé le commandement du Seigneur et se sont rendus coupables de le spolier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετοῦσι
  choice: rejettent
  rationale: Le verbe exprime ici le rejet ou le reniement du Seigneur; « rejettent » est direct et naturel en français.
- source_word: ἀποστερηταὶ
  choice: se rendent coupables de le spolier
  rationale: Le terme désigne ceux qui privent frauduleusement quelqu’un de ce qui lui revient. Cette formulation conserve la force morale et le lien avec le dépôt sans employer le substantif peu naturel « spoliateurs ».
- source_word: παρακαταθήκην
  choice: dépôt
  rationale: Terme usuel pour une chose confiée qui doit être gardée puis rendue; il maintient l’image juridique et fiduciaire du grec.
- source_word: πνεῦμα ἄψευστον
  choice: un esprit exempt de mensonge
  rationale: Rend littéralement l’absence de fausseté sans trancher si πνεῦμα désigne l’esprit humain donné par Dieu ou l’Esprit divin habitant l’être humain.
- source_word: ψευδὲς ἀποδώσωσιν
  choice: s’ils le lui rendent mensonger
  rationale: Préserve le contraste intentionnel entre l’esprit reçu sans mensonge et l’esprit rendu altéré par le mensonge.
- source_word: ἐμίαναν
  choice: ont souillé
  rationale: Conserve la forte image de contamination ou de profanation portée par le verbe grec.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: « un esprit », sans majuscule interprétative
  alternative: « l’Esprit » ou « leur esprit »
  rationale: Le grec n’impose pas à lui seul une identification définitive. La traduction maintient l’ambiguïté entre l’esprit donné à l’être humain et l’Esprit de Dieu habitant en lui.
- issue: Nature du dépôt confié
  choice: Maintenir simplement « le dépôt »
  alternative: Expliciter « l’esprit qui leur a été confié »
  rationale: La phrase suivante établit le rapport avec l’esprit, mais le texte conserve d’abord l’image autonome du dépôt; l’expliciter dans le corps du texte réduirait cette progression.
translation_notes:
  register: Français moderne, digne et accessible. La répétition finale de l’idée de spolier le Seigneur reproduit l’insistance du grec, tandis que la syntaxe reste naturelle.
