base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/003.yaml
  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: fr
  text: 'Après avoir entendu cela, je me mis à pleurer amèrement. Me voyant pleurer, il me dit : « Pourquoi pleures-tu ? » Je répondis : « Parce que, monsieur, je ne sais pas si je peux être sauvé. » Il demanda : « Pourquoi ? » Je répondis : « Car, monsieur, je n’ai encore jamais, de toute ma vie, prononcé une parole vraie. J’ai toujours vécu en fourbe avec tout le monde et j’ai fait passer mon mensonge pour vrai aux yeux de tous. Jamais personne ne m’a contredit, mais l’on a cru à ma parole. Comment donc, monsieur, puis-je vivre après avoir fait ces choses ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα λίαν
  choice: je fondis en larmes
  rationale: Rend naturellement en français l’intensité de λίαν avec le verbe « pleurer », sans lourdeur.
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif peut signifier « monsieur/maître », mais « Seigneur » conserve la portée respectueuse et la cohérence du registre religieux, sans identifier explicitement l’interlocuteur à Dieu.
- source_word: σωθῆναι
  choice: être sauvé
  rationale: Équivalent direct qui conserve la portée sotériologique du passif grec.
- source_word: πανοῦργος ἔζησα μετὰ πάντων
  choice: j’ai toujours usé de tromperie envers tout le monde
  rationale: Exprime un mode de vie rusé et malhonnête de façon idiomatique, sans réduire πανοῦργος à un acte isolé.
- source_word: τὸ ψεῦδός μου ἀληθὲς ἐπέδειξα
  choice: j’ai fait passer mon mensonge pour vrai
  rationale: Reproduit clairement l’idée de présenter ou faire paraître le mensonge comme vrai.
- source_word: δύναμαι ζῆσαι
  choice: puis-je vivre
  rationale: Conserve « vivre » plutôt que d’expliciter « obtenir la vie » ou « être sauvé », maintenant ainsi la formulation et la tension du grec.
theological_decisions:
- issue: Sens de « vivre » après la confession des mensonges
  choice: Traduction littérale « puis-je vivre »
  alternative: « puis-je obtenir la vie » ou « puis-je être sauvé »
  rationale: Le contexte relie la vie au salut, mais le grec emploie ζῆσαι. La traduction maintient cette formulation sans résoudre davantage sa portée théologique.
- issue: Adresse κύριε à l’interlocuteur
  choice: « Seigneur »
  alternative: « monsieur » ou « maître »
  rationale: Le terme reste ambigu entre titre de respect et appellation religieuse. « Seigneur » préserve cette élévation de registre sans ajout explicatif.
translation_notes:
  register: Français moderne, fluide et digne. Le dialogue conserve les répétitions structurantes du grec tout en évitant une syntaxe artificielle. Aucun marqueur de note n’est requis.
