revisions:
- from: 'À ces mots, je fondis en larmes. Me voyant pleurer, il me dit : « Pourquoi pleures-tu ? » Je répondis : « Parce que, Seigneur, je ne sais pas si je peux être sauvé. » Il demanda : « Pourquoi ? » Je répondis : « Car, Seigneur, de toute ma vie, je n’ai encore jamais dit une parole vraie. Au contraire, j’ai toujours usé de tromperie envers tout le monde et j’ai fait passer mon mensonge pour vrai aux yeux de tous. Jamais personne ne m’a contredit ; on a cru à ma parole. Comment donc, Seigneur, puis-je vivre après avoir fait de telles choses ? »'
  to: 'Après avoir entendu cela, je me mis à pleurer amèrement. Me voyant pleurer, il me dit : « Pourquoi pleures-tu ? » Je répondis : « Parce que, monsieur, je ne sais pas si je peux être sauvé. » Il demanda : « Pourquoi ? » Je répondis : « Car, monsieur, je n’ai encore jamais, de toute ma vie, prononcé une parole vraie. J’ai toujours vécu en fourbe avec tout le monde et j’ai fait passer mon mensonge pour vrai aux yeux de tous. Jamais personne ne m’a contredit, mais l’on a cru à ma parole. Comment donc, monsieur, puis-je vivre après avoir fait ces choses ? »'
