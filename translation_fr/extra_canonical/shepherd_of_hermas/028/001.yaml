  terminology: Les choix « vérité », « esprit », « chair », « Seigneur », « glorifié » et « mensonge » sont cohérents avec le grec et avec un registre scripturaire français contemporain. La minuscule à « esprit » préserve à juste titre l’ambiguïté du passage, sans surinterprétation théologique.
