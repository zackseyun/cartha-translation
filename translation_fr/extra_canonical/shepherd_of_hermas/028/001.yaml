  source_fidelity: 'Le texte français rend fidèlement l’unité grecque : l’impératif d’aimer la vérité, la répétition de « vérité », l’établissement de l’esprit « dans cette chair », son caractère vrai devant tous, et la glorification du Seigneur sont tous conservés. « a fait habiter » restitue bien la valeur causative de κατῴκισεν. « soit reconnu comme véridique » exprime de façon recevable ἀληθὲς εὑρεθῇ, sans résoudre l’identité de l’esprit.'
