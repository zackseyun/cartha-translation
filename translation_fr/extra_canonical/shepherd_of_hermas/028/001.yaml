base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/001.yaml
  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: fr
  text: 'Il me dit encore : « Aime la vérité, et que toute vérité sorte de ta bouche, afin que l’esprit que Dieu a fait habiter dans cette chair soit reconnu comme véridique par tous les êtres humains. Ainsi sera glorifié le Seigneur qui habite en toi, car le Seigneur est véridique en toute parole, et il n’y a en lui aucun mensonge. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθειαν / πᾶσα ἀλήθεια
  choice: la vérité / toute vérité
  rationale: Conserve la répétition insistante du grec tout en restant idiomatique en français.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: Le terme grec peut désigner l’esprit donné par Dieu sans préciser ici s’il faut le comprendre comme l’Esprit divin ou l’esprit humain; la minuscule préserve cette ambiguïté.
- source_word: κατῴκισεν
  choice: a fait habiter
  rationale: 'Rend la valeur causative du verbe: Dieu a établi l’esprit dans cette chair.'
- source_word: ἐν τῇ σαρκὶ ταύτῃ
  choice: dans cette chair
  rationale: Maintient l’image concrète et anthropologique de σάρξ plutôt que de l’atténuer en « corps ».
- source_word: ἀληθὲς εὑρεθῇ
  choice: soit reconnu comme véridique
  rationale: Exprime le sens de « être trouvé vrai » dans le jugement porté par autrui, sans suggérer que l’esprit devient vrai.
- source_word: παρὰ πᾶσιν ἀνθρώποις
  choice: par tous les êtres humains
  rationale: Formulation inclusive et naturelle correspondant à l’ensemble des personnes devant lesquelles l’esprit doit être reconnu véridique.
- source_word: δοξασθήσεται
  choice: sera glorifié
  rationale: Conserve le passif théologique explicite du grec.
- source_word: ἐν παντὶ ῥήματι
  choice: en toute parole
  rationale: Reproduit la portée générale de l’expression sans ajouter un possessif absent du grec.
- source_word: οὐδὲν παρ’ αὐτῷ ψεῦδος
  choice: il n’y a en lui aucun mensonge
  rationale: Rend naturellement l’absence totale de fausseté auprès du Seigneur.
theological_decisions:
- issue: Identité de « l’esprit » qui habite dans la chair
  choice: Employer « l’esprit » avec une minuscule et sans explicitation
  alternative: « l’Esprit » ou « l’esprit humain »
  rationale: Le passage associe cet esprit à Dieu et à la chair sans identifier de manière univoque sa nature; la traduction ne tranche donc pas la tension.
- issue: Rapport entre le Seigneur et la personne croyante
  choice: « le Seigneur qui habite en toi »
  alternative: Paraphraser comme une présence morale ou comme une identification explicite à l’Esprit
  rationale: La formulation directe respecte l’affirmation du texte sans importer une construction doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exhortative et les répétitions structurantes du grec sont conservées, avec une ponctuation légèrement adaptée à la lecture courante.
