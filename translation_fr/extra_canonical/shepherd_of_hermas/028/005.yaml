base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/005.yaml
  text: ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself. And whoever hears this command and abstains from the most evil lie will live to God.’
translation:
  language: fr
  text: '« À présent donc, dit-il, tu entends ces paroles : garde-les, afin que, si celles-ci se révèlent vraies[a], même les mensonges que tu as dits autrefois dans tes affaires deviennent eux aussi crédibles ; car eux aussi peuvent devenir crédibles. Si tu gardes ces paroles et si, dès maintenant, tu dis toute la vérité, tu pourras acquérir la vie pour toi-même. Et quiconque entendra ce commandement et s’abstiendra du mensonge le plus pervers[b] vivra pour Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile : « celles-ci » peut renvoyer aux paroles ou aux exigences qui viennent d’être énoncées. Le texte affirme ensuite, de manière paradoxale, que les mensonges passés peuvent devenir « crédibles ».'
    reason: Préserver l’ambiguïté du pronom τούτων et la tension de πιστὰ γένηται sans imposer une résolution conjecturale.
  - marker: b
    text: 'Littéralement : « du mensonge le plus mauvais » ou « le plus pervers ».'
    reason: Signaler le superlatif grec πονηροτάτου, qui qualifie « mensonge ».
lexical_decisions:
- source_word: φύλασσε αὐτά
  choice: garde-les / garde ces paroles
  rationale: Le verbe exprime ici l’observance fidèle, et le pronom renvoie aux paroles ou instructions qui viennent d’être données.
- source_word: ἐν ταῖς πραγματείαις σου
  choice: dans tes affaires
  rationale: πραγματεία peut désigner les activités, transactions ou affaires d’une personne ; « dans tes affaires » conserve cette amplitude sans limiter le propos au seul commerce.
- source_word: πιστὰ γένηται
  choice: deviennent dignes de foi
  rationale: πιστός signifie ici vraisemblablement « fiable, crédible, digne de foi ». Cette formulation maintient la tension du passage, qui associe paradoxalement cette qualité à d’anciens mensonges.
- source_word: ζήσεται τῷ Θεῷ
  choice: vivra pour Dieu
  rationale: Rendu formel du datif τῷ Θεῷ, qui conserve la portée théologique de l’expression sans l’expliciter abusivement.
theological_decisions:
- issue: Possibilité pour les mensonges passés de devenir πιστά
  choice: Conserver l’affirmation paradoxale selon laquelle ils peuvent « devenir dignes de foi »
  alternative: Reformuler comme si la véracité présente effaçait ou réparait simplement les mensonges passés
  rationale: Le grec ne dit pas explicitement que les mensonges sont effacés ou pardonnés. La traduction préserve donc la difficulté et la tension morale du texte.
- issue: Valeur de τούτων dans « τούτων εὑρεθέντων ἀληθινῶν »
  choice: Le rapporter aux paroles/instructions présentes, tout en signalant l’ambiguïté
  alternative: Le rapporter aux propos antérieurs ou à une autre réalité implicite
  rationale: Le référent grammatical et logique n’est pas entièrement transparent. Le contexte immédiat favorise les paroles présentes, mais une note empêche de présenter cette lecture comme certaine.
- issue: Expression « vivra pour Dieu »
  choice: Maintenir la formulation relationnelle et eschatologique ouverte
  alternative: Traduire « vivra devant Dieu », « vivra avec Dieu » ou « recevra la vie de Dieu »
  rationale: Ces solutions expliciteraient diversement le datif grec. « Pour Dieu » préserve davantage son indétermination.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement cohérent dans le dialogue. La syntaxe reste accessible tout en conservant le raisonnement serré et l’étrangeté réelle du grec. Les répétitions de « paroles », « vérité » et « dignes de foi » servent à rendre explicites les reprises pronominales sans surinterpréter le passage.
