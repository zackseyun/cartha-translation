revisions:
- from: '« Maintenant donc, dit-il, tu entends ces paroles : garde-les, afin que même les mensonges que tu as dits autrefois dans tes affaires deviennent eux aussi dignes de foi, lorsque ces paroles-ci se révéleront vraies[a] ; car eux aussi peuvent devenir dignes de foi. Si tu gardes ces paroles et si, dès maintenant, tu dis toute la vérité, tu pourras acquérir la vie pour toi-même. Et quiconque entendra ce commandement et s’abstiendra du mensonge, ce mal suprême[b], vivra pour Dieu. »'
  to: '« À présent donc, dit-il, tu entends ces paroles : garde-les, afin que, si celles-ci se révèlent vraies[a], même les mensonges que tu as dits autrefois dans tes affaires deviennent eux aussi crédibles ; car eux aussi peuvent devenir crédibles. Si tu gardes ces paroles et si, dès maintenant, tu dis toute la vérité, tu pourras acquérir la vie pour toi-même. Et quiconque entendra ce commandement et s’abstiendra du mensonge le plus pervers[b] vivra pour Dieu. »'
  rationale: La révision conserve la traduction et les notes là où elles respectent l’ambiguïté du grec, mais corrige la portée du superlatif final et améliore légèrement l’idiome français ainsi que la lisibilité de la phrase conditionnelle.
