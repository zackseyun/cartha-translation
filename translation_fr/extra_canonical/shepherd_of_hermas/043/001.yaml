  text: « Je voulais, dis-je, Seigneur, savoir de quelles manières je dois servir le désir… »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans le dialogue, il s’agit d’une adresse respectueuse au personnage qui instruit Hermas. « Seigneur » conserve la dignité et la portée possibles du grec, sans préciser davantage l’identité du destinataire.
- source_word: ποίοις τρόποις
  choice: de quelles manières
  rationale: Rend directement le pluriel grec et préserve l’idée de diverses modalités.
- source_word: δουλεῦσαι
  choice: me mettre au service de
  rationale: Le verbe évoque le service ou l’asservissement. Cette formulation garde sa force tout en produisant une phrase française naturelle avec le complément au datif.
- source_word: τῇ ἐπιθυμίᾳ
  choice: du désir
  rationale: Le terme peut désigner le désir, la convoitise ou une inclination. « Désir » conserve ici l’ambiguïté lexicale, le contexte fourni étant tronqué.
theological_decisions:
- issue: Valeur morale de ἐπιθυμία
  choice: désir
  alternative: convoitise
  rationale: Le fragment ne suffit pas à établir si le désir est ici explicitement mauvais ou s’il s’agit d’un emploi plus général. La traduction ne préjuge donc pas de sa valeur morale.
translation_notes:
  register: Français moderne, digne et accessible. L’incise « dis-je » suit naturellement la parole rapportée. Les points de suspension signalent que la source fournie s’interrompt au milieu de la proposition.
