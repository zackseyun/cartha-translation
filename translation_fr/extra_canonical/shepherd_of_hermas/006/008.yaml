revisions:
- from: Car le Seigneur a juré par son Fils que ceux qui ont renié leur Seigneur seraient retranchés de leur vie — ceux qui sont sur le point de le renier dans les jours à venir. Mais envers ceux qui l’avaient renié auparavant, il s’est montré clément, dans sa grande compassion.
  to: Car le Seigneur a juré par son Fils que ceux qui ont renié leur Seigneur sont retranchés de leur vie — ceux qui sont maintenant sur le point de le renier dans les jours à venir. Mais, dans sa grande compassion, il s’est montré clément envers ceux qui l’avaient renié auparavant.
  rationale: La seule correction nécessaire remplace le conditionnel par le présent afin de refléter la force assertive de l’infinitif parfait grec. Le reste de la formulation est conservé, y compris la tension temporelle du passage et l’ambiguïté de l’expression relative à « leur vie ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend bien le serment « par son Fils », le contraste entre les reniements à venir et les reniements antérieurs, ainsi que la compassion divine. Toutefois, « seraient retranchés » introduit un conditionnel futur qui n’est pas porté par l’infinitif parfait grec ἀπεγνωσθαι : l’énoncé du serment affirme leur exclusion comme un fait accompli ou établi.'
  naturalness: Le registre est sobre et naturel. La formulation « sont retranchés de leur vie » demeure volontairement un peu solennelle, mais elle préserve la formulation inhabituelle et l’ambiguïté de ἀπὸ τῆς ζωῆς αὐτῶν sans réduire « vie » à la seule mort physique ou à une doctrine déterminée.
  terminology: « Seigneur », « renié », « grande compassion » et « s’est montré clément » sont appropriés. « Retanchés de leur vie » maintient l’ambiguïté du grec et reste préférable à une explicitation telle que « condamnés » ou « exclus de la vie éternelle ».
  issues:
  - severity: medium
    issue: Le conditionnel « seraient retranchés » affaiblit et temporalise indûment l’affirmation.
    rationale: 'Le grec présente, sous la dépendance de « a juré », un infinitif parfait (ἀπεγνωσθαι), non une conséquence simplement éventuelle ou future. Le français doit exprimer un état déjà établi : « sont retranchés ».'
  revised_text: Car le Seigneur a juré par son Fils que ceux qui ont renié leur Seigneur sont retranchés de leur vie — ceux qui sont maintenant sur le point de le renier dans les jours à venir. Mais, dans sa grande compassion, il s’est montré clément envers ceux qui l’avaient renié auparavant.
  revised_footnotes: []
