base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: fr
  text: Car le Seigneur a juré par son Fils que ceux qui ont renié leur Seigneur sont retranchés de leur vie — ceux qui sont maintenant sur le point de le renier dans les jours à venir. Mais, dans sa grande compassion, il s’est montré clément envers ceux qui l’avaient renié auparavant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤμοσεν ... κατὰ τοῦ υἱοῦ αὐτοῦ
  choice: a juré par son Fils
  rationale: En contexte de serment, κατά avec le génitif désigne ici ce par quoi le serment est prononcé; «par son Fils» est naturel et fidèle.
- source_word: ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν
  choice: seraient retranchés de leur vie
  rationale: La tournure exprime une exclusion ou une perte définitive par rapport à «leur vie». Le choix conserve l’étrangeté et l’ambiguïté du grec sans préciser arbitrairement s’il s’agit de la vie présente ou éternelle.
- source_word: πολυσπλαγχνία
  choice: grande compassion
  rationale: Rend l’idée d’une miséricorde viscérale et abondante dans un français moderne et digne.
- source_word: ἵλεως ἐγένετο αὐτοῖς
  choice: il s’est montré clément
  rationale: Expression française naturelle qui conserve le sens favorable et miséricordieux de ἵλεως sans imposer un vocabulaire technique d’expiation.
theological_decisions:
- issue: Sort de ceux qui renieront le Seigneur
  choice: «seraient retranchés de leur vie»
  alternative: «n’auraient plus part à la vie» ou «seraient condamnés à perdre leur vie»
  rationale: Le grec associe ἀπογινώσκω et ἀπό à «leur vie» d’une manière inhabituelle. La traduction retenue préserve la sévérité de l’énoncé et son ambiguïté théologique.
- issue: Différence entre les reniements passés et futurs
  choice: maintenir explicitement le contraste temporel
  alternative: harmoniser les deux groupes sous une offre générale de pardon
  rationale: Le texte oppose ceux qui vont renier dans les jours à venir à ceux qui avaient renié auparavant; cette tension doit rester visible.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe a été légèrement réorganisée pour clarifier l’apposition grecque tout en conservant le contraste et la tension du passage.
