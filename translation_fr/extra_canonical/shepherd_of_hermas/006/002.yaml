revisions:
- from: « Tes descendants[a], Hermas, se sont détournés de Dieu et ont blasphémé le Seigneur. Ils ont trahi leurs parents avec une grande méchanceté et ont été reconnus comme traîtres envers eux. Leur trahison ne leur a pourtant rien apporté ; au contraire, ils ont encore ajouté à leurs péchés la débauche et toutes sortes de pratiques mêlées de méchanceté[b]. C’est ainsi que leurs actes contraires à la loi ont atteint leur pleine mesure. »
  to: « Tes descendants[a], Hermas, ont rejeté Dieu et blasphémé le Seigneur. Ils ont trahi leurs parents dans une grande méchanceté et se sont fait connaître comme traîtres à leurs parents. Bien qu’ils les aient trahis, ils n’y ont rien gagné ; au contraire, ils ont encore ajouté à leurs péchés des débauches et des mélanges de méchanceté[b]. C’est ainsi que leurs actes sans loi ont été portés à leur comble. »
  rationale: La révision rapproche le texte français du grec et de l’audit anglais, notamment par « ont rejeté Dieu ». Elle conserve une syntaxe française lisible tout en maintenant l’incertitude du tour relatif aux « traîtres à leurs parents » et du mot συμφυρμοί au moyen d’une note. Aucune interprétation confessionnelle n’est introduite.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:35Z'
