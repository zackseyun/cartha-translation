base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: fr
  text: « Tes descendants[a], Hermas, ont rejeté Dieu et blasphémé le Seigneur. Ils ont trahi leurs parents dans une grande méchanceté et se sont fait connaître comme traîtres à leurs parents. Bien qu’ils les aient trahis, ils n’y ont rien gagné ; au contraire, ils ont encore ajouté à leurs péchés des débauches et des mélanges de méchanceté[b]. C’est ainsi que leurs actes sans loi ont été portés à leur comble. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ta semence » ; il s’agit ici des enfants ou de la descendance d’Hermas.'
    reason: Le sens figuré du grec doit être signalé, car le calque littéral serait trompeur en français moderne.
  - marker: b
    text: Le grec évoque des « mélanges » ou un « entassement confus de méchanceté » ; l’expression exacte est difficile à préciser.
    reason: La locution grecque est rare et conserve une réelle ambiguïté lexicale.
lexical_decisions:
- source_word: Τὸ σπέρμα σου
  choice: Tes descendants
  rationale: Le grec signifie littéralement « ta semence », mais désigne ici les enfants ou la descendance d’Hermas. « Descendants » conserve la portée collective sans produire un calque obscur.
- source_word: ἠθέτησαν εἰς τὸν Θεόν
  choice: se sont détournés de Dieu
  rationale: Ἀθετέω exprime le rejet, le mépris ou le manquement à un engagement. Cette formulation française garde l’idée de rupture envers Dieu sans préciser abusivement sa forme.
- source_word: ἤκουσαν προδότας γονέων
  choice: ont été reconnus comme traîtres envers eux
  rationale: Le tour grec, littéralement « ils furent entendus comme traîtres de parents », paraît exprimer la réputation ou la qualification acquise. « Reconnus comme » restitue ce sens probable tout en évitant un calque peu naturel.
- source_word: ἀσελγηίας
  choice: la débauche
  rationale: Le terme désigne des conduites effrénées, honteuses ou licencieuses. « Débauche » est actuel, compréhensible et conserve sa forte valeur morale.
- source_word: συμφυρμοὺς πονηρίας
  choice: toutes sortes de pratiques mêlées de méchanceté
  rationale: Συμφυρμός évoque un mélange ou un entassement confus. La formulation rend l’image sans imposer une catégorie précise d’actes que le grec ne fournit pas.
- source_word: ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν
  choice: leurs actes contraires à la loi ont atteint leur pleine mesure
  rationale: Le passif exprime l’accomplissement ou le comble de leurs actes sans loi. « Atteint leur pleine mesure » rend l’aspect résultatif et la gravité du jugement.
theological_decisions:
- issue: Nature du rejet de Dieu
  choice: se sont détournés de Dieu
  alternative: ont renié Dieu / ont rejeté Dieu
  rationale: Le contexte condamne une infidélité grave, mais ne précise pas nécessairement un reniement formel. La traduction choisie préserve cette latitude.
- issue: Sens de l’accomplissement des actes illégaux
  choice: ont atteint leur pleine mesure
  alternative: ont été portés à leur comble
  rationale: La formule garde l’idée biblique de péchés arrivés à leur plénitude sans ajouter ici une conséquence eschatologique ou judiciaire explicite.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les phrases ont été légèrement restructurées pour éviter l’accumulation pesante du grec tout en conservant sa progression accusatrice et l’opposition marquée par « pourtant » et « au contraire ».
