base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/006.yaml
  text: Therefore you shall say to those who lead the church that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.
translation:
  language: fr
  text: Tu diras donc à ceux qui dirigent l’Église de redresser leurs voies dans la justice, afin qu’ils reçoivent pleinement les promesses, avec beaucoup de gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: à ceux qui dirigent l’Église
  rationale: Le participe désigne ceux qui sont à la tête ou assurent la conduite de la communauté, sans imposer un titre ecclésiastique plus précis que le grec.
- source_word: κατορθώσωνται τὰς ὁδοὺς αὐτῶν
  choice: rendre leurs voies droites
  rationale: Cette formulation conserve l’image des voies à rectifier tout en restant intelligible en français moderne.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: Rend directement δικαιοσύνη et maintient sa portée morale et religieuse.
- source_word: ἀπολάβωσιν ἐκ πλήρους
  choice: reçoivent pleinement
  rationale: Exprime l’idée de recevoir dans toute sa plénitude, sans la lourdeur de « recevoir en totalité ».
- source_word: μετὰ πολλῆς δόξης
  choice: avec une grande gloire
  rationale: Traduction formellement proche qui préserve l’ambiguïté quant au rapport exact de la gloire avec la réception ou les promesses.
theological_decisions:
- issue: Identité des responsables de l’Église
  choice: ceux qui dirigent l’Église
  alternative: les chefs de l’Église / les responsables de l’Église
  rationale: Le grec décrit une fonction de conduite sans préciser un office; la traduction évite donc d’introduire une structure ministérielle déterminée.
- issue: Portée de « avec une grande gloire »
  choice: maintien en fin de phrase
  alternative: les promesses accompagnées d’une grande gloire
  rationale: La syntaxe grecque permet une certaine latitude; conserver le groupe final évite de trancher artificiellement son rattachement.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse singulière faite à Hermas; « l’Église » désigne ici la communauté ecclésiale. L’image biblique des « voies » est volontairement conservée.
