  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l''injonction est adressée à Hermas, concerne les personnes qui conduisent la communauté, la rectification de leurs « voies » dans la justice, et la réception plénière des promesses. « Rendre leurs voies droites » traduit l''image, mais ne constitue pas une tournure française naturelle pour κατορθώσωνται.'
