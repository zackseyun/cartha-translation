  terminology: « Ceux qui dirigent l’Église » reste volontairement non technique et ne présume pas d'un office déterminé. « Justice » convient pour δικαιοσύνη et préserve sa résonance morale et religieuse. « Promesses » traduit correctement ἐπαγγελίας.
