  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: fr
  text: Après que tu leur auras fait connaître ces paroles que le Maître m’a ordonné de te faire connaître, alors tous les péchés qu’ils ont commis auparavant leur seront pardonnés, ainsi que les péchés de tous les saints qui ont péché jusqu’à ce jour, s’ils se repentent de tout leur cœur et ôtent de leur cœur leurs partages intérieurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Rend le titre d’autorité δεσπότης sans le confondre avec κύριος, employé ailleurs dans le contexte.
- source_word: ἀφίενται
  choice: seront pardonnés
  rationale: Dans le contexte des péchés, le verbe signifie leur remise; le futur français exprime naturellement le résultat annoncé après la transmission des paroles.
- source_word: τοῖς ἁγίοις
  choice: aux saints
  rationale: Conserve la désignation communautaire et religieuse du grec, courante et intelligible en français.
- source_word: μετανοήσωσιν
  choice: se repentent
  rationale: Exprime le retournement moral demandé, sans réduire le terme à un simple regret.
- source_word: τὰς διψυχίας
  choice: leur indécision
  rationale: Le terme désigne un cœur partagé, hésitant ou inconstant; «indécision» reste naturel tout en préservant cette tension.
theological_decisions:
- issue: Portée du pardon
  choice: Présenter le pardon comme accordé sous la condition d’un repentir de tout cœur et de l’abandon de l’indécision.
  alternative: Formuler le pardon comme automatique dès la communication des paroles.
  rationale: La proposition conditionnelle grecque ἐὰν… μετανοήσωσιν καὶ ἄρωσιν porte sur les personnes mentionnées et doit demeurer explicite.
- issue: Valeur temporelle de ἀφίενται
  choice: Employer le futur français «seront pardonnés».
  alternative: Employer le présent «sont pardonnés».
  rationale: Le présent grec suit τότε et peut avoir une force déclarative ou prospective; dans la séquence française introduite par «après que», le futur rend clairement le résultat sans modifier la théologie du passage.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve la longue articulation conditionnelle du grec tout en restant fluide; aucune précision confessionnelle n’est ajoutée.
