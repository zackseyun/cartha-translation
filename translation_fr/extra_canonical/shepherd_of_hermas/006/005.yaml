base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: fr
  text: 'Car le Maître a juré par sa gloire au sujet de ceux qu’il a choisis : si, après ce jour fixé, ils commettent encore un péché, ils n’auront pas de salut. En effet, pour les justes, le temps de la repentance a une fin. Pour tous les saints, les jours accordés pour se repentir sont arrivés à leur terme ; mais, pour les nations, la repentance reste possible jusqu’au dernier jour.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: le Maître
  rationale: Rend le titre d’autorité δεσπότης de façon naturelle et le distingue de κύριος dans le contexte voisin.
- source_word: κατὰ τῆς δόξης αὐτοῦ
  choice: par sa gloire
  rationale: Formule française idiomatique de serment qui conserve l’objet solennel du grec.
- source_word: τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: ceux qu’il a choisis
  rationale: Expression claire et actuelle qui garde le sens verbal de l’élection sans imposer un vocabulaire confessionnel technique.
- source_word: ἐὰν ὡρισμένης τῆς ἡμέρας ταύτης ἔτι ἁμάρτησις γένηται
  choice: si, après ce jour fixé, ils commettent encore un péché
  rationale: Le grec est condensé et légèrement irrégulier ; la formulation française explicite les pécheurs visés d’après le contexte tout en conservant la condition et la limite temporelle.
- source_word: μετάνοια
  choice: repentance / se repentir
  rationale: Conserve la dimension de retournement moral et spirituel ; l’alternance nominale et verbale évite une lourdeur en français.
- source_word: πεπλήρωνται αἱ ἡμέραι μετανοίας
  choice: les jours accordés pour se repentir sont arrivés à leur terme
  rationale: Restitue l’idée d’une période désormais accomplie, implicite dans le parfait πεπλήρωνται.
- source_word: τοῖς ἔθνεσιν
  choice: pour les nations
  rationale: Traduction formellement proche qui préserve l’ambiguïté entre les peuples non juifs et, dans ce contexte ecclésial, ceux du dehors.
- source_word: ἕως ἐσχάτης ἡμέρας
  choice: jusqu’au dernier jour
  rationale: Rend directement la limite eschatologique exprimée dans le grec.
theological_decisions:
- issue: Portée de la fin de la repentance pour les justes
  choice: Conserver l’affirmation abrupte selon laquelle leur temps de repentance a une fin
  alternative: Atténuer en parlant seulement d’un avertissement ou d’une occasion particulière de repentance
  rationale: Le texte grec formule réellement une limite et ne doit pas être harmonisé avec une doctrine ultérieure ; la tension théologique est donc maintenue.
- issue: Sens de « les nations »
  choice: Garder « les nations » sans identifier explicitement le groupe
  alternative: Traduire « les païens » ou « les non-croyants »
  rationale: ἔθνη peut désigner les Gentils ou plus largement ceux qui sont hors de la communauté ; une formulation ouverte préserve cette ambiguïté.
- issue: Nature du salut refusé
  choice: « ils n’auront pas de salut »
  alternative: « il n’y aura plus de salut pour eux »
  rationale: La formulation retenue suit la construction personnelle du grec et ne précise ni le mécanisme ni la portée du jugement au-delà de ce que dit le passage.
translation_notes:
  register: Français international moderne, solennel mais accessible. La syntaxe a été légèrement déployée pour rendre intelligible le grec condensé, sans adoucir la sévérité ni résoudre les tensions du passage.
