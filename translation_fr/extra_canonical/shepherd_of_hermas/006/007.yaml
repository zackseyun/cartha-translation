base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/007.yaml
  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: fr
  text: Tenez donc ferme, vous qui pratiquez la justice, et n’ayez pas le cœur partagé, afin que votre passage[a] se fasse avec les saints anges. Heureux êtes-vous, tous ceux qui endurent la grande détresse qui vient, et tous ceux qui ne renieront pas leur vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « départ »; le mot grec peut ici évoquer le passage hors de cette vie.
    reason: Signaler la portée probable de πάροδος sans réduire son ambiguïté dans le texte principal.
  - marker: b
    text: Littéralement « leur vie ». L’expression est inhabituelle; le contexte qui suit évoque le fait de renier le Seigneur.
    reason: Préserver la formulation grecque et informer le lecteur de son lien contextuel possible sans imposer une interprétation.
lexical_decisions:
- source_word: ἐμμείνατε
  choice: Tenez donc ferme
  rationale: Rend l’idée de persévérer et de demeurer résolument dans la conduite juste, dans un français naturel.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: vous qui pratiquez la justice
  rationale: « Pratiquer la justice » exprime une conduite active plutôt qu’une simple qualité morale.
- source_word: μὴ διψυχήσητε
  choice: n’ayez pas le cœur partagé
  rationale: Le verbe évoque l’irrésolution ou la division intérieure; cette formulation conserve l’image sans employer le peu naturel « double d’esprit ».
- source_word: ἡ πάροδος
  choice: votre passage
  rationale: Le terme peut désigner le passage ou le départ, probablement de cette vie; « passage » préserve cette relative indétermination.
- source_word: τὴν θλῖψιν ... τὴν μεγάλην
  choice: la grande détresse
  rationale: « Détresse » couvre l’épreuve, l’oppression et la souffrance impliquées par θλῖψις, sans imposer un vocabulaire eschatologique technique.
- source_word: οὐκ ἀρνήσονται τὴν ζωὴν αὐτῶν
  choice: ne renieront pas leur vie
  rationale: Traduction délibérément proche du grec, dont l’expression inhabituelle ne doit pas être remplacée sans preuve par « le Seigneur » ou « la foi ».
theological_decisions:
- issue: Sens de « leur vie » dans la dernière proposition
  choice: Maintenir « leur vie » dans le texte
  alternative: Interpréter comme « le Seigneur », « la foi » ou « celui qui est leur vie »
  rationale: Le grec transmis porte explicitement τὴν ζωὴν αὐτῶν. Le contexte suivant parle de renier le Seigneur, mais ce rapprochement ne justifie pas de corriger silencieusement le présent texte.
- issue: Nature du « passage » avec les saints anges
  choice: Conserver le terme général « passage »
  alternative: Expliciter « mort », « départ de ce monde » ou « entrée dans l’au-delà »
  rationale: Le contexte suggère le passage hors de la vie présente, mais πάροδος reste assez large; la traduction garde donc la tension tout en la signalant en note.
translation_notes:
  register: Français moderne, digne et accessible. L’exhortation conserve son ton collectif et solennel. « Le cœur partagé » est idiomatique tout en reflétant la division intérieure du grec; les formulations volontairement énigmatiques « passage » et « leur vie » sont maintenues et brièvement éclairées en notes.
