base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/003.yaml
  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: fr
  text: Mais fais connaître ces paroles à tous tes enfants et à ta femme, qui doit devenir ta sœur ; car elle non plus ne retient pas sa langue, dont elle fait mauvais usage. Mais, après avoir entendu ces paroles, elle se retiendra et obtiendra miséricorde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβίῳ
  choice: femme
  rationale: Le terme désigne ici la conjointe, celle qui partage la vie d’Hermas ; « femme » est naturel et fidèle dans ce contexte.
- source_word: τῇ μελλούσῃ σου ἀδελφῇ
  choice: qui est appelée à devenir ta sœur
  rationale: Cette formulation conserve l’orientation future de μελλούσῃ et la tension du texte entre l’état d’épouse et une future relation qualifiée de fraternelle, sans en imposer l’interprétation ascétique.
- source_word: οὐκ ἀπέχεται τῆς γλώσσης
  choice: ne maîtrise pas sa langue
  rationale: Littéralement, elle « ne s’abstient pas de sa langue ». L’expression française choisie rend naturellement l’idée d’un défaut de retenue dans la parole.
- source_word: πονηρεύεται
  choice: fait le mal
  rationale: Le verbe exprime une conduite mauvaise exercée au moyen de la langue ; « fait le mal » reste clair sans préciser indûment la nature exacte des paroles.
- source_word: ἀφέξεται
  choice: elle se maîtrisera
  rationale: La reprise du verbe apparenté à ἀπέχεται indique qu’elle s’abstiendra désormais de ce mauvais usage de la langue ; la formulation française maintient l’écho avec la proposition précédente.
- source_word: ἕξει ἔλεος
  choice: obtiendra miséricorde
  rationale: Rend l’expression grecque de façon idiomatique tout en conservant son registre religieux et sans expliciter l’agent de la miséricorde.
theological_decisions:
- issue: Sens de « ta sœur » appliqué à la femme d’Hermas
  choice: 'Conserver l’énoncé prospectif : « appelée à devenir ta sœur »'
  alternative: « qui devra être pour toi comme une sœur » ou « ta femme, ta future sœur »
  rationale: Le grec affirme littéralement qu’elle est « celle qui doit devenir ta sœur ». Le passage peut évoquer une future relation fraternelle ou chaste, mais le texte ne développe pas ici cette implication ; la traduction préserve donc l’ambiguïté au lieu de la transformer en prescription explicite.
- issue: Agent de la miséricorde
  choice: Ne pas ajouter « de Dieu »
  alternative: « Dieu lui fera miséricorde »
  rationale: Le grec dit seulement qu’elle « aura/obtiendra miséricorde ». L’agent divin est vraisemblablement sous-entendu, mais il convient de ne pas l’insérer dans le corps du texte.
translation_notes:
  register: Français moderne, digne et accessible. La structure adversative et causale du grec est conservée, avec une légère adaptation idiomatique pour l’usage de la langue. Aucun marqueur de note n’est nécessaire.
