  verdict: revise
  source_fidelity: La traduction rend correctement l’injonction, l’adresse aux enfants, le défaut de retenue dans la parole et la promesse de miséricorde. Toutefois, « appelée à devenir » ajoute l’idée d’une vocation/appel, absente de μελλούσῃ (« qui doit être/devenir »).
  naturalness: Le français est globalement naturel. « Ne retient pas sa langue » et « fait mauvais usage de sa langue » expriment avec plus de netteté et d’idiomaticité le lien grec entre la langue et la conduite mauvaise.
  terminology: « Femme », « sœur » et « miséricorde » conviennent au registre. La formulation révisée conserve la relation future qualifiée de fraternelle sans expliciter une interprétation ascétique ou doctrinale.
  issues:
