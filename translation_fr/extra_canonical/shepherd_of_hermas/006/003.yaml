    issue: « appelée à devenir ta sœur »
    rationale: Le grec τῇ μελλούσῃ σου ἀδελφῇ indique qu’elle est destinée à être/devenir sa sœur, mais ne dit pas qu’elle y est « appelée ». Le mot ajouté peut orienter l’interprétation.
  - severity: low
    issue: Rendu du mauvais usage de la langue
    rationale: « Ne maîtrise pas sa langue, par laquelle elle fait le mal » est possible, mais « ne retient pas sa langue, dont elle fait mauvais usage » reproduit plus explicitement la construction et le référent de ἐν ᾗ πονηρεύεται.
