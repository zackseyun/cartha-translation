base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/001.yaml
  text: 'After fifteen days, when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me. And this was written:'
translation:
  language: fr
  text: 'Après quinze jours, durant lesquels j’avais jeûné et adressé de nombreuses demandes au Seigneur, la compréhension de l’écrit me fut révélée. Voici ce qui était écrit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτήσαντος
  choice: adressé de nombreuses demandes
  rationale: Le verbe peut signifier « demander » ou « interroger ». Dans ce contexte de jeûne tourné vers le Seigneur, cette formulation naturelle conserve l’idée de demandes répétées sans préciser indûment qu’il s’agissait uniquement de questions.
- source_word: γνῶσις
  choice: compréhension
  rationale: Ici, le terme désigne la connaissance ou l’intelligence du contenu de l’écrit qui est révélée à Hermas. « Compréhension » exprime clairement ce sens en français moderne.
- source_word: γραφῆς
  choice: l’écrit
  rationale: Le contexte renvoie au document précédemment reçu plutôt qu’à « l’Écriture » au sens canonique. « L’écrit » évite cette ambiguïté théologique.
- source_word: ἀπεκαλύφθη
  choice: me fut révélée
  rationale: La tournure passive du grec est conservée, ainsi que la notion explicite de révélation.
theological_decisions:
- issue: Nature de la γραφή
  choice: « l’écrit »
  alternative: « l’Écriture » ou « le texte »
  rationale: Le grec peut désigner une écriture ou un document. La majuscule « Écriture » suggérerait sans fondement suffisant un statut canonique; « l’écrit » convient à l’objet narratif immédiat.
- issue: Objet des demandes adressées au Seigneur
  choice: Ne pas expliciter qu’il s’agit de prières ou de questions
  alternative: « beaucoup prié le Seigneur » ou « posé beaucoup de questions au Seigneur »
  rationale: ἐρωτάω permet plusieurs nuances. La traduction préserve cette ouverture plutôt que de résoudre la scène dans un sens dévotionnel ou interrogatif précis.
translation_notes:
  register: Français international moderne, digne et narratif. La structure temporelle est légèrement déployée pour éviter une accumulation lourde de participes, tout en conservant les quinze jours, le jeûne, les demandes au Seigneur et le caractère révélé de la compréhension.
