  timestamp: '2026-07-15T16:18:45Z'
review_pass:
  verdict: revise
  source_fidelity: Le grec ordonne de garder/observer le commandement afin que « ta repentance et celle de ta maison soient trouvées dans la simplicité » et que le cœur soit « pur et sans tache ». Le projet rend correctement l'ensemble, mais « reconnues simples » déplace εὑρεθῇ vers une reconnaissance externe et « simples » sonne elliptique en français dans cette construction.
  naturalness: La phrase est globalement naturelle et de registre approprié. « Se trouvent dans la simplicité » est plus idiomatique et plus proche de l'image grecque que « soient reconnues simples ». « Ta maison » demeure possible, mais « ceux de ta maison » clarifie en français moderne que la repentance concerne les personnes du foyer.
  terminology: « Repentance » est un terme recevable et conserve la portée de μετάνοια. « Simplicité » convient à ἁπλότης dans le contexte. « Pur et sans tache » rend avec naturel καθαρὰ καὶ ἀμίαντος, sans perdre la double expression.
  issues:
  - severity: medium
    issue: « soient reconnues simples »
    rationale: εὑρεθῇ signifie littéralement « soit trouvée »; la formulation proposée introduit l'idée d'une validation ou appréciation (« reconnues ») absente du grec et l'adjectif « simples » est moins naturel ici. « Se trouvent dans la simplicité » préserve le tour et le sens contextuel.
  - severity: low
    issue: « celle de ta maison »
    rationale: Le grec « de ta maison » peut désigner le foyer et ses membres. En français, « la repentance de ta maison » est compréhensible mais peut évoquer le bâtiment; « celle de ceux de ta maison » explicite les personnes sans restreindre indûment la portée domestique.
  revised_text: Garde donc ce commandement, comme je te l’ai dit, afin que ta repentance et celle de ceux de ta maison se trouvent dans la simplicité, et que ton cœur soit pur et sans tache.
  revised_footnotes: []
  revision_rationale: La révision remplace une formulation qui ajoutait l'idée de reconnaissance par le calque français naturel « se trouvent dans la simplicité », fidèle à ἐν ἁπλότητι εὑρεθῇ. Elle clarifie aussi, pour le lectorat francophone moderne, que « la maison » désigne les personnes du foyer. Aucune note n'est nécessaire, car il ne s'agit pas d'une ambiguïté textuelle substantielle.
