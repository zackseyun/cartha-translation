base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/007.yaml
  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: fr
  text: Garde donc ce commandement, comme je te l’ai dit, afin que ta repentance et celle de ceux de ta maison se trouvent dans la simplicité, et que ton cœur soit pur et sans tache.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: Garde
  rationale: Rend l’impératif présent avec l’idée de conserver et d’observer fidèlement le commandement.
- source_word: μετάνοιά
  choice: repentance
  rationale: Conserve le sens religieux de changement intérieur et de retour à Dieu, sans le réduire au seul regret.
- source_word: τοῦ οἴκου σου
  choice: celle de ta maison
  rationale: « Maison » peut désigner le foyer ou l’ensemble des personnes qui en dépendent; cette formulation préserve cette portée.
- source_word: ἐν ἁπλότητι εὑρεθῇ
  choice: soient reconnues simples
  rationale: Reproduit l’idée d’être trouvées ou constatées dans la simplicité, avec une tournure française naturelle.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: pur et sans souillure
  rationale: 'Maintient les deux qualificatifs complémentaires: propreté morale et absence de contamination.'
theological_decisions:
- issue: Portée de μετάνοια appliquée au locuteur et à sa maison
  choice: Conserver « repentance » sans expliciter son mécanisme collectif
  alternative: « conversion » ou « changement de conduite »
  rationale: Le grec attribue la μετάνοια à la personne et à sa maison sans expliquer comment celle du foyer s’opère; la traduction préserve cette tension.
- issue: Sens de ἁπλότης
  choice: « simples »
  alternative: « sincères », « sans arrière-pensée »
  rationale: Le contexte associe ἁπλότης à une générosité sans calcul et à l’innocence; « simples » garde l’amplitude du terme sans imposer une seule nuance.
translation_notes:
  register: Français moderne, digne et direct; tutoiement maintenu conformément au singulier grec. La phrase conserve la structure exhortative et la double finalité du texte source.
