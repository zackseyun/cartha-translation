revisions:
- from: Garde donc ce commandement, comme je te l’ai dit, afin que ta repentance et celle de ta maison soient reconnues simples, et que ton cœur soit pur et sans souillure.
  to: Garde donc ce commandement, comme je te l’ai dit, afin que ta repentance et celle de ceux de ta maison se trouvent dans la simplicité, et que ton cœur soit pur et sans tache.
  rationale: La révision remplace une formulation qui ajoutait l'idée de reconnaissance par le calque français naturel « se trouvent dans la simplicité », fidèle à ἐν ἁπλότητι εὑρεθῇ. Elle clarifie aussi, pour le lectorat francophone moderne, que « la maison » désigne les personnes du foyer. Aucune note n'est nécessaire, car il ne s'agit pas d'une ambiguïté textuelle substantielle.
