base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/006.yaml
  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: fr
  text: Celui qui donne est donc sans faute. En effet, puisqu’il a reçu du Seigneur un service à accomplir, il s’en est acquitté avec simplicité, sans chercher à déterminer à qui donner ou ne pas donner. Ainsi accompli avec simplicité, ce service est devenu glorieux devant Dieu. Celui qui sert Dieu de cette manière, avec simplicité, vivra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθῷος
  choice: sans faute
  rationale: Exprime ici l’absence de culpabilité du donateur quant au bon ou au mauvais usage fait du don, dans un français naturel.
- source_word: διακονία
  choice: service
  rationale: Le terme désigne la tâche confiée par le Seigneur; «service» conserve sa portée générale sans lui imposer un sens ecclésiastique technique.
- source_word: ἁπλῶς
  choice: avec simplicité
  rationale: Reprend le thème central de ἁπλότης dans le mandat et évoque un don franc, sans calcul ni discrimination.
- source_word: μηθὲν διακρίνων
  choice: sans chercher à déterminer
  rationale: Rend le discernement ou la distinction entre les bénéficiaires possibles, plutôt qu’un doute intérieur au sens moderne.
- source_word: ἔνδοξος παρὰ τῷ Θεῷ
  choice: glorieux devant Dieu
  rationale: Préserve la formulation forte du grec et l’évaluation divine du service accompli.
- source_word: ζήσεται
  choice: vivra
  rationale: Conserve sans l’expliciter la portée potentiellement eschatologique de la promesse.
theological_decisions:
- issue: Responsabilité morale du donateur
  choice: «sans faute»
  alternative: «innocent»
  rationale: Le contexte affirme que la responsabilité de l’usage incombe au bénéficiaire; «sans faute» communique clairement cette non-culpabilité sans suggérer une innocence absolue.
- issue: Nature de la διακονία reçue du Seigneur
  choice: «un service à accomplir»
  alternative: «un ministère à remplir»
  rationale: Le grec peut porter une nuance ministérielle, mais le contexte concerne la pratique de l’aumône en général; «service» évite de réserver l’exhortation à une fonction officielle.
- issue: Portée de la promesse finale
  choice: «vivra» sans ajout explicatif
  alternative: «aura la vie éternelle»
  rationale: Le texte ne précise pas directement «éternelle»; la traduction préserve donc la tension et la concision du futur grec.
translation_notes:
  register: 'Français moderne, international et digne. La répétition de «avec simplicité» est volontaire: elle reflète l’insistance lexicale du grec et relie ce segment au thème directeur du Mandat 2.'
