base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: fr
  text: Tout d’abord, ne dis du mal de personne et ne prends pas plaisir à écouter quelqu’un médire. Sinon, toi qui écoutes, tu seras toi aussi coupable du péché de celui qui médit, si tu crois à la médisance que tu entends. Car, en y croyant, toi aussi, tu auras quelque chose contre ton frère. Ainsi, tu seras coupable du péché de celui qui médit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλάλει / καταλαλοῦντος / καταλαλίᾳ
  choice: dis du mal / médit / propos malveillants
  rationale: La famille de καταλαλέω désigne le fait de parler contre quelqu’un, souvent de façon médisante. La variation française évite une répétition pesante tout en maintenant le même champ lexical.
- source_word: ἡδέως ἄκουε
  choice: ne prends pas plaisir à écouter
  rationale: Rend explicitement l’adverbe ἡδέως, qui condamne non seulement l’écoute, mais l’écoute complaisante.
- source_word: ἔνοχος
  choice: coupable
  rationale: Exprime directement la responsabilité morale partagée par l’auditeur crédule.
- source_word: ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  choice: tu en viendras toi-même à avoir quelque chose contre ton frère
  rationale: Conserve l’indétermination de l’expression grecque, qui ne précise pas exactement ce que l’auditeur aura contre son frère.
theological_decisions:
- issue: Responsabilité de celui qui écoute la médisance
  choice: La culpabilité est conditionnée par le fait de croire les propos entendus.
  alternative: Présenter toute écoute comme entraînant automatiquement la même culpabilité.
  rationale: 'La proposition ἐὰν πιστεύσῃς établit explicitement la condition : l’auditeur devient coupable s’il accorde foi à la médisance.'
translation_notes:
  register: Français moderne, clair et digne. « Frère » est conservé pour respecter le vocabulaire communautaire du texte. La répétition finale est maintenue, car elle structure l’exhortation grecque.
