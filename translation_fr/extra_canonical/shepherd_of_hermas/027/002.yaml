revisions:
- from: Tout d’abord, ne dis du mal de personne et ne prends pas plaisir à écouter celui qui médit des autres. Sinon, toi qui écoutes, tu seras toi aussi coupable du péché de celui qui médit, si tu crois les propos malveillants que tu entends. En effet, si tu les crois, tu en viendras toi-même à avoir quelque chose contre ton frère. Ainsi, tu seras coupable du péché de celui qui médit.
  to: Tout d’abord, ne dis du mal de personne et ne prends pas plaisir à écouter quelqu’un médire. Sinon, toi qui écoutes, tu seras toi aussi coupable du péché de celui qui médit, si tu crois à la médisance que tu entends. Car, en y croyant, toi aussi, tu auras quelque chose contre ton frère. Ainsi, tu seras coupable du péché de celui qui médit.
  rationale: La révision resserre le rendu sur le champ sémantique de καταλαλία, sans imposer une interprétation plus précise de « avoir quelque chose contre son frère ». Elle supprime aussi la nuance progressive non exprimée par le futur grec, tout en préservant la répétition emphatique finale.
