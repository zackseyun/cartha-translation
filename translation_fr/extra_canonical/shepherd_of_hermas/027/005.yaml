base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: fr
  text: Ainsi donc, ceux qui reçoivent rendront compte à Dieu de la raison pour laquelle ils ont reçu et dans quel but. En effet, ceux qui reçoivent dans la détresse ne seront pas jugés, mais ceux qui reçoivent par hypocrisie subiront leur peine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποδώσουσιν λόγον
  choice: devront rendre compte
  rationale: Rend naturellement l’idée d’avoir à répondre de ses actes devant Dieu, tout en conservant la portée judiciaire de l’expression grecque.
- source_word: διατί … καὶ εἰς τί
  choice: pourquoi … et dans quel but
  rationale: Préserve la distinction grecque entre le motif de la réception et sa finalité, sans les fusionner.
- source_word: θλιβόμενοι
  choice: alors qu’ils sont dans la détresse
  rationale: Exprime l’état d’affliction ou de besoin réel indiqué par le participe, dans un français courant et digne.
- source_word: ἐν ὑποκρίσει
  choice: par hypocrisie
  rationale: Conserve le terme théologiquement et moralement chargé du grec sans préciser indûment la forme exacte de la dissimulation.
- source_word: τίσουσιν δίκην
  choice: subiront leur peine
  rationale: Rend l’idée de payer la sanction ou d’en subir le châtiment dans une formulation française naturelle.
theological_decisions:
- issue: Responsabilité morale de celui qui reçoit une aide
  choice: Maintenir que Dieu juge le motif et la finalité de la réception
  alternative: Interpréter explicitement le passage comme visant uniquement ceux qui feignent d’être pauvres
  rationale: Le grec oppose la détresse réelle à l’hypocrisie, mais ne définit pas précisément la forme de celle-ci; la traduction conserve donc cette tension sans ajouter un cas particulier.
- issue: Absence de jugement pour les personnes dans la détresse
  choice: « ne seront pas jugés »
  alternative: « ne seront pas condamnés »
  rationale: δικασθήσονται désigne littéralement le fait d’être jugé. La formulation plus large préserve la force et l’éventuelle tension théologique du texte au lieu de la limiter à la condamnation.
translation_notes:
  register: Français international moderne, clair et digne. La structure argumentative (« Ainsi », « En effet », « mais ») est conservée, de même que le contraste entre besoin réel et réception hypocrite.
