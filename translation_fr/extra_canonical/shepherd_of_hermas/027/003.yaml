revisions:
- from: 'La médisance est mauvaise : c’est un démon instable, qui n’est jamais en paix, mais habite toujours au milieu des divisions. Tiens-toi donc loin d’elle, et tu vivras toujours en bonne entente avec tous.'
  to: 'La médisance est mauvaise : c’est un démon agité, jamais en paix, mais qui habite toujours au milieu des divisions. Tiens-toi donc loin d’elle, et tu jouiras toujours de la prospérité avec tous.'
  rationale: La révision rétablit pour εὐθηνία le sens de « prospérité », attesté par le grec et retenu dans l’audit anglais, tout en gardant la formulation volontairement peu explicitée de μετὰ πάντων (« avec tous »). « Agité » rend plus concrètement l’instabilité désordonnée de ἀκατάστατον; les autres éléments fidèles du projet sont maintenus.
