base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/003.yaml
  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: fr
  text: 'La médisance est mauvaise : c’est un démon agité, jamais en paix, mais qui habite toujours au milieu des divisions. Tiens-toi donc loin d’elle, et tu jouiras toujours de la prospérité avec tous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλία
  choice: médisance
  rationale: Le terme désigne le fait de parler contre quelqu’un, généralement en son absence. « Médisance » conserve la portée morale sans imposer l’idée plus étroite d’une accusation nécessairement mensongère qu’aurait « calomnie ».
- source_word: ἀκατάστατον
  choice: instable
  rationale: Le mot évoque ce qui est agité, désordonné et incapable de demeurer en repos; « instable » s’accorde naturellement avec la proposition suivante, « qui n’est jamais en paix ».
- source_word: ἐν διχοστασίαις κατοικοῦν
  choice: habite toujours au milieu des divisions
  rationale: Cette formulation préserve la personnification ainsi que l’image forte de la médisance qui fait sa demeure dans les dissensions.
- source_word: εὐθηνίαν
  choice: tu vivras … en bonne entente
  rationale: Dans ce contexte relationnel, le terme indique une situation favorable et paisible avec tous. Cette expression française naturelle rend mieux le sens contextuel qu’un littéral « prospérité », susceptible d’être compris matériellement.
theological_decisions:
- issue: Personnification démoniaque de la médisance
  choice: « c’est un démon instable »
  alternative: « elle est comme un démon instable »
  rationale: Le grec affirme directement ἀκατάστατον δαιμόνιόν ἐστιν, sans marque comparative. La traduction conserve donc cette affirmation et sa tension théologique au lieu de l’atténuer.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier correspond à l’adresse directe du texte grec. La structure sentencieuse et la personnification vigoureuse de la médisance sont conservées.
