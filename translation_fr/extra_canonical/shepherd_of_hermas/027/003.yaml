    issue: εὐθηνία est rendu par « en bonne entente ».
    rationale: Cette expression interprète le terme comme une paix relationnelle et efface son sens plus ample de prospérité ou de bien-être. La correction conserve l’ambiguïté de la prospérité « avec tous ».
