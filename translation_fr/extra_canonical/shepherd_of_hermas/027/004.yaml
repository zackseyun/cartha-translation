base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/004.yaml
  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: fr
  text: 'Mais revêts-toi de dignité : en elle, il n’y a aucun mauvais sujet de chute, mais tout y est aisé et joyeux. Pratique le bien et, du fruit de tes travaux que Dieu te donne, donne avec simplicité à tous ceux qui sont dans le besoin, sans te demander à qui tu dois donner ou ne pas donner. Donne à tous, car Dieu veut que l’on donne à tous de ses propres dons.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car Dieu veut que tous reçoivent de ses propres dons ».'
    reason: Le grec πᾶσιν … δίδοσθαι est un infinitif passif qui peut s’exprimer soit par une tournure impersonnelle centrée sur le don, soit, en français, du point de vue des bénéficiaires.
lexical_decisions:
- source_word: σεμνότητα
  choice: dignité
  rationale: Le terme désigne une gravité honorable et une conduite digne; « dignité » conserve ce registre moral sans suggérer seulement la modestie vestimentaire.
- source_word: πρόσκομμα
  choice: piège
  rationale: Le mot peut désigner ce qui fait trébucher ou une occasion de chute. « Piège » rend naturellement ici le danger moral, avec une note signalant l’image littérale.
- source_word: ὁμαλὰ καὶ ἱλαρά
  choice: uni et joyeux
  rationale: « Uni » exprime l’absence d’aspérités ou d’obstacles; « joyeux » rend la disposition sereine et bienveillante de ἱλαρά.
- source_word: ἐργάζου τὸ ἀγαθόν
  choice: Pratique le bien
  rationale: Formulation française naturelle qui garde la valeur active et continue de l’impératif.
- source_word: ἐκ τῶν κόπων σου
  choice: du fruit de tes travaux
  rationale: Le grec dit littéralement « de tes travaux/peines »; en français, l’idée distributive porte naturellement sur ce qu’ils produisent.
- source_word: ἁπλῶς
  choice: avec simplicité
  rationale: Le contexte appelle un don franc, sans calcul ni discrimination; « avec simplicité » préserve aussi le thème directeur de ἁπλότης dans ce mandat.
- source_word: ὑστερουμένοις
  choice: ceux qui sont dans le besoin
  rationale: Rend le sens de manquer du nécessaire dans un français courant et digne.
theological_decisions:
- issue: Portée de πᾶσιν dans la dernière proposition
  choice: « que tous reçoivent »
  alternative: « que l’on donne à tous »
  rationale: L’infinitif passif δίδοσθαι autorise une formulation centrée sur les bénéficiaires. Elle préserve l’universalité de l’exhortation sans ajouter de critère absent du texte.
- issue: Origine des biens distribués
  choice: « de ses propres dons »
  alternative: « de ce qui lui appartient »
  rationale: δωρημάτων désigne explicitement des dons. La formulation souligne que les ressources humaines données aux nécessiteux proviennent elles-mêmes de Dieu, sans préciser davantage le mode de cette providence.
translation_notes:
  register: Français moderne, international et digne. Les impératifs restent directs. Le texte conserve l’enchaînement des images — se revêtir, absence de piège ou d’aspérité, générosité sans calcul — tout en évitant un calque maladroit.
