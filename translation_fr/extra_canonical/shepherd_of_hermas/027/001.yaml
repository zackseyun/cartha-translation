base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/001.yaml
  text: 'He says to me: Have simplicity, and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.'
translation:
  language: fr
  text: 'Il me dit : « Aie de la simplicité, deviens sans malice, et tu seras comme les petits enfants qui ne connaissent pas le mal qui détruit la vie des êtres humains. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁπλότητα ἔχε
  choice: Garde un cœur simple
  rationale: ἁπλότης désigne ici la simplicité ou la droiture intérieure. L’ajout idiomatique de « cœur » rend cette qualité naturelle en français sans lui donner un sens intellectuel de naïveté.
- source_word: ἄκακος γίνου
  choice: deviens sans malice
  rationale: ἄκακος signifie dépourvu de mal, d’innocence ou sans malice. « Sans malice » conserve le contraste avec πονηρία et convient à la comparaison avec les petits enfants.
- source_word: τὰ νήπια
  choice: les petits enfants
  rationale: νήπια évoque de très jeunes enfants; cette traduction est courante, claire et dignifiée.
- source_word: τὴν πονηρίαν
  choice: le mal
  rationale: Dans ce contexte moral, πονηρία désigne la méchanceté ou le mal. « Le mal » préserve la portée générale de l’expression.
- source_word: τὴν ζωὴν τῶν ἀνθρώπων
  choice: la vie des êtres humains
  rationale: Rendu inclusif et fidèle de τῶν ἀνθρώπων, sans limiter le propos aux hommes de sexe masculin.
theological_decisions:
- issue: Portée de la simplicité demandée
  choice: Garde un cœur simple
  alternative: Aie de la simplicité
  rationale: La formulation choisie exprime une disposition morale intérieure sans assimiler la simplicité à la crédulité.
- issue: Nature de ce qui détruit la vie humaine
  choice: le mal
  alternative: la méchanceté
  rationale: Le grec permet les deux nuances. « Le mal » maintient volontairement une portée large et ne précise pas si la destruction est physique, morale ou spirituelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif reste direct; la répétition de « et » conserve le mouvement paratactique du grec.
