lexical_decisions:
- source_word: Διατί
  choice: Pourquoi
  rationale: Rend directement la demande de motif introduite par l’interrogatif grec.
- source_word: κύριε
  choice: Seigneur
  rationale: Conserve l’appellation respectueuse κύριε et sa portée potentiellement plus forte que le simple « monsieur ».
- source_word: τοῦτο λέγεις
  choice: affirmes-tu cela
  rationale: Dans ce dialogue, λέγεις renvoie à la déclaration qui précède ; « affirmes-tu » est naturel en français et en restitue la force sans ajouter d’explication.
theological_decisions:
- issue: Portée de l’adresse κύριε
  choice: Seigneur
  alternative: maître / monsieur
  rationale: Le grec permet une adresse polie ou titulaire. « Seigneur » préserve cette amplitude et évite de réduire d’emblée le statut de l’interlocuteur.
translation_notes:
  register: Dialogue direct, sobre et respectueux, dans un français moderne et digne. L’incise « dis-je » conserve explicitement le changement de locuteur marqué par φημί.
