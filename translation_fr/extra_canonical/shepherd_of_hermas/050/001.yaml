  text: '"Have you come?" I say, "Because, sir, I am keeping a station."'
translation:
  language: fr
  text: « Es-tu venu ? — C’est que, maître, dis-je, j’observe une station[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « station » désigne une observance religieuse comportant un jeûne.
    reason: Le mot français est technique et risque de ne pas être compris dans ce sens par le lectorat moderne.
lexical_decisions:
- source_word: στατίωνα
  choice: une station
  rationale: Le terme désigne ici une observance déterminée de jeûne. Sa traduction littérale préserve le terme technique, que le dialogue explique immédiatement après, sans anticiper cette explication.
- source_word: κύριε
  choice: maître
  rationale: Dans cette adresse respectueuse à l’interlocuteur, « maître » convient mieux au contexte que « Seigneur », qui pourrait introduire à tort une identification théologique.
- source_word: φημί
  choice: dis-je
  rationale: Le présent historique grec est rendu par une incise française naturelle qui indique clairement le changement de locuteur.
theological_decisions:
- issue: Nature de la « station »
  choice: Conserver le terme technique « station » avec une note explicative.
  alternative: Traduire directement par « jour de jeûne » ou « jeûne ».
  rationale: Le passage lui-même demande ensuite ce qu’est une station et reçoit la réponse « je jeûne ». Traduire dès maintenant par « jeûne » effacerait cette progression dialoguée et réduirait la distinction lexicale du grec.
translation_notes:
  register: Dialogue sobre et respectueux, en français moderne. Le début grec transmis (« Es-tu venu ? ») paraît abrupt, probablement parce que l’extrait commence au milieu d’un échange ; la traduction n’ajoute pas un « pourquoi » absent du texte fourni.
