base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the servant [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his servant on account of his deed. Summoning again his friends and his son, the master announced to them the deed the servant had done with his portions which he had received; and they approved all the more that the servant should become co-heir with his son."'
translation:
  language: fr
  text: Après quelque temps, le maître du serviteur [et du champ][a] vint et entra dans la vigne. Voyant que la vigne était bien clôturée, qu’elle avait aussi été bêchée et que [toutes][b] les mauvaises herbes avaient été arrachées, il se réjouit beaucoup du travail de son serviteur. Le maître convoqua de nouveau ses amis et son fils, et leur annonça ce que le serviteur avait fait avec les aliments qui lui avaient été attribués. Ils approuvèrent d’autant plus qu’il devienne cohéritier avec son fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « et du champ » sont absents de certains témoins du texte.
    reason: La source éditée les place entre crochets, signalant une incertitude textuelle.
  - marker: b
    text: Le mot « toutes » est absent de certains témoins du texte.
    reason: La source éditée place πάσας entre crochets, signalant une incertitude textuelle.
lexical_decisions:
- source_word: δεσπότης
  choice: maître
  rationale: Dans cette parabole, le terme désigne le propriétaire et maître du serviteur; « maître » restitue naturellement la relation sans la durcir inutilement.
- source_word: κεχαρακωμένον
  choice: joliment clôturée
  rationale: Le verbe renvoie à l’établissement d’une clôture ou enceinte; l’adverbe rend εὐπρεπῶς, qui souligne le bel ordre du travail.
- source_word: ἐσκαμμένον
  choice: bêchée
  rationale: Terme agricole idiomatique pour une vigne dont le sol a été travaillé en creusant.
- source_word: βοτάνας
  choice: mauvaises herbes
  rationale: Dans ce contexte, il s’agit des plantes indésirables qui étouffaient la vigne, non de végétaux en général.
- source_word: ἐδέσμασιν
  choice: provisions
  rationale: Le mot désigne des aliments ou portions de nourriture reçus par le serviteur; « provisions » convient au cadre narratif et à leur usage.
- source_word: συγκληρονόμον
  choice: cohéritier
  rationale: Conserve précisément l’idée d’un partage du même héritage avec le fils.
theological_decisions:
- issue: Identité du possesseur dans « son fils »
  choice: Conserver « son fils » sans explicitation
  alternative: Préciser « le fils du maître »
  rationale: Le grec garde le pronom αὐτοῦ, dont le référent grammatical est fourni par le récit; une explicitation dans le texte risquerait de surinterpréter la portée allégorique.
- issue: Force de συνευδόκησαν
  choice: « furent d’autant plus favorables à ce que »
  alternative: « approuvèrent d’autant plus que »
  rationale: La formulation française choisie conserve l’assentiment à la décision sans suggérer que les amis possèdent eux-mêmes l’autorité ultime de conférer l’héritage.
translation_notes:
  register: Français moderne, international et digne, avec un vocabulaire agricole accessible. La syntaxe reste proche de la progression grecque tout en évitant les lourdeurs littérales. Les crochets du texte critique sont conservés et explicités par des notes.
