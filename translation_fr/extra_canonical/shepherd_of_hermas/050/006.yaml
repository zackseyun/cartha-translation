revisions:
- from: Après quelque temps, le maître du serviteur [et du champ][a] revint et entra dans la vigne. Voyant qu’elle était joliment clôturée, qu’elle avait en outre été bêchée et que [toutes][b] les mauvaises herbes avaient été arrachées, il se réjouit vivement de ce que son serviteur avait accompli. Le maître convoqua de nouveau ses amis et son fils, et leur raconta ce que le serviteur avait fait avec les provisions qu’il avait reçues. Ils furent alors d’autant plus favorables à ce que le serviteur devienne cohéritier avec son fils.
  to: Après quelque temps, le maître du serviteur [et du champ][a] vint et entra dans la vigne. Voyant que la vigne était bien clôturée, qu’elle avait aussi été bêchée et que [toutes][b] les mauvaises herbes avaient été arrachées, il se réjouit beaucoup du travail de son serviteur. Le maître convoqua de nouveau ses amis et son fils, et leur annonça ce que le serviteur avait fait avec les aliments qui lui avaient été attribués. Ils approuvèrent d’autant plus qu’il devienne cohéritier avec son fils.
  rationale: La révision supprime l’idée non exprimée d’un retour du maître, améliore le rendu de la description de la vigne et rend ἐδέσμασιν par un terme français plus exact. Les crochets et leurs notes sont maintenus aux mêmes emplacements, sans résoudre les variantes textuelles ni expliciter l’allégorie.
