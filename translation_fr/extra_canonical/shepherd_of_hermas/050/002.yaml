  naturalness: La formulation proposée est généralement fluide. « Qu’est-ce donc ... qu’une observance ? » est toutefois un peu pesant, tandis que « station » peut être employé naturellement avec une brève note explicative. « Monsieur » est une adresse moderne de respect claire dans ce dialogue.
  terminology: Conserver « station » pour στατίων, avec une note indiquant qu’il s’agit d’un terme traditionnel pour un temps ou jour de jeûne. Rendre κύριε par « monsieur » afin de ne pas attribuer au mot grec une portée christologique que le contexte immédiat ne précise pas. Le vocabulaire de « jeûner/jeûne » est maintenu.
