  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/002.yaml
  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: fr
  text: '« Qu’est-ce donc qu’une station ? » demande-t-il. Je réponds : « Je jeûne, monsieur. » Il dit : « Et quel est ce jeûne que vous pratiquez ? » Je réponds : « Je jeûne comme j’en ai l’habitude, monsieur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στατίων
  choice: observance
  rationale: Le terme désigne ici une pratique religieuse fixée, en l’occurrence un jour ou un temps de jeûne. « Observance » rend ce sens dans un français naturel sans imposer l’obscur calque « station ».
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue avec la figure révélatrice, « Seigneur » conserve l’adresse respectueuse et la tonalité religieuse du grec.
- source_word: Νηστεύω / νηστεία / νηστεύετε
  choice: je jeûne / jeûne / vous pratiquez
  rationale: Le champ lexical du jeûne est maintenu; « pratiquer » dans la question évite une répétition lourde tout en exprimant l’action de jeûner.
- source_word: ὡς εἰώθειν
  choice: comme j’en ai l’habitude
  rationale: Cette tournure française actuelle exprime clairement une pratique coutumière.
theological_decisions:
- issue: Nature de la « station » (στατίων)
  choice: Traduire par « observance » sans préciser davantage dans le corps du texte.
  alternative: « station », « jour de jeûne » ou « pratique de jeûne »
  rationale: Le dialogue explique aussitôt que l’observance est un jeûne. Une formulation générique préserve le mouvement pédagogique et évite d’introduire une définition confessionnelle ou historique trop précise.
- issue: Passage du singulier au pluriel dans ἣν νηστεύετε
  choice: Conserver le pluriel par « vous pratiquez ».
  alternative: 'Harmoniser au singulier : « que tu pratiques »'
  rationale: Le grec passe de l’interlocuteur individuel au pluriel, qui peut viser la pratique collective. Cette tension est conservée au lieu d’être silencieusement uniformisée.
translation_notes:
  register: Français moderne, accessible et digne. Le dialogue direct et ses reprises sont conservés. « Il reprend » varie légèrement l’incise sans changer le rapport entre les interlocuteurs.
