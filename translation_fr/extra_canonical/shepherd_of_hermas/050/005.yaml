review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « un véritable jeûne » ajoute une qualification évaluative que le grec n’énonce pas explicitement dans cette phrase. Le contraste porte sur le jeûne que les destinataires pensent observer pour le Seigneur. Le reste de l’image agricole rend correctement le sens du texte, y compris l’objet non précisé de λαβών, qu’il ne faut pas reconstituer.'
  naturalness: Le français est globalement fluide et d’un registre approprié. « Une vigne sans mauvaises herbes » est compréhensible, mais « une vigne qui n’a pas de mauvaises herbes » et le pronom « elle » rendent plus nettement la relation avec l’étouffement. « Très belle et vigoureuse » rend naturellement les deux qualificatifs grecs.
  terminology: « Jeûne », « Seigneur », « mauvaises herbes » et « bêcher » conviennent. « Observer un jeûne » est plus idiomatique et plus exact ici que « pratiquer [ce que vous pensez] ».
  issues:
  - severity: medium
    issue: Ajout de « véritable »
    rationale: Le grec dit littéralement que ce n’est pas le jeûne qu’ils pensent observer, sans employer un qualificatif équivalent à « véritable ». Cette addition peut anticiper l’opposition morale développée par la suite.
  - severity: low
    issue: Reformulation du jeûne supposé
    rationale: « Ce que vous pensez pratiquer » est plus vague que le grec, qui conserve explicitement le terme « jeûne » dans la proposition relative. Une formulation avec « observer » préserve mieux ce repère lexical.
