base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/005.yaml
  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the servant took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: fr
  text: 'Il me dit : « Je te le dis : ce n’est pas là le jeûne que vous pensez observer pour le Seigneur. Écoute une parabole. Une vigne qui n’a pas de mauvaises herbes produira davantage de fruit, puisqu’elle n’est pas étouffée par les mauvaises herbes. Le serviteur se mit donc à bêcher la vigne et arracha toutes les mauvaises herbes qui s’y trouvaient. Cette vigne devint alors très belle et vigoureuse, n’ayant plus de mauvaises herbes pour l’étouffer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεία
  choice: jeûne
  rationale: Équivalent français direct, naturel et conforme au contexte religieux sans ajouter de précision doctrinale.
- source_word: δοκεῖτε νηστεύειν
  choice: ce que vous pensez pratiquer … n’est pas un véritable jeûne
  rationale: Rend l’écart entre le jeûne supposé et le jeûne authentique tout en évitant la lourdeur de « le jeûne que vous pensez jeûner ».
- source_word: βοτάνας
  choice: mauvaises herbes
  rationale: Dans le contexte viticole, le terme désigne la végétation indésirable qui étouffe la vigne.
- source_word: ἔσκαψε
  choice: bêcher
  rationale: Terme agricole courant exprimant précisément le travail de la terre dans la vigne.
- source_word: εὐπρεπέστατος καὶ εὐθαλής
  choice: très belle et vigoureuse
  rationale: Conserve les deux idées, l’aspect remarquable et la croissance florissante, dans un français naturel.
theological_decisions:
- issue: Nature du jeûne rejeté
  choice: « n’est pas un véritable jeûne »
  alternative: « ce n’est pas un jeûne »
  rationale: Le passage oppose une pratique tenue pour un jeûne au jeûne qui plaît réellement au Seigneur; la formulation ne définit toutefois pas ici le contenu doctrinal du vrai jeûne.
- issue: Destinataire du jeûne
  choice: « pour le Seigneur »
  alternative: « au Seigneur »
  rationale: « Pour le Seigneur » rend naturellement le datif τῷ Κυρίῳ sans décider si celui-ci exprime l’offrande, le bénéfice ou l’orientation religieuse.
translation_notes:
  register: 'Français moderne, digne et accessible. Le discours direct et l’image agricole sont conservés. L’objet non exprimé de λαβών n’est pas reconstitué par un outil précis : « se mit donc à bêcher » transmet l’action sans ajout conjectural.'
