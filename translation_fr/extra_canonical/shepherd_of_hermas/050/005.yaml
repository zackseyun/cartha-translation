revisions:
- from: 'Il me dit : « Je te le dis, ce que vous pensez pratiquer pour le Seigneur n’est pas un véritable jeûne. Écoute une parabole. Une vigne sans mauvaises herbes donnera davantage de fruit, puisqu’elles ne l’étouffent pas. Le serviteur se mit donc à bêcher la vigne et arracha toutes les mauvaises herbes qui s’y trouvaient. Alors cette vigne devint très belle et vigoureuse, car aucune mauvaise herbe ne l’étouffait. »'
  to: 'Il me dit : « Je te le dis : ce n’est pas là le jeûne que vous pensez observer pour le Seigneur. Écoute une parabole. Une vigne qui n’a pas de mauvaises herbes produira davantage de fruit, puisqu’elle n’est pas étouffée par les mauvaises herbes. Le serviteur se mit donc à bêcher la vigne et arracha toutes les mauvaises herbes qui s’y trouvaient. Cette vigne devint alors très belle et vigoureuse, n’ayant plus de mauvaises herbes pour l’étouffer. »'
  rationale: La révision retire l’ajout interprétatif « véritable », conserve explicitement le vocabulaire du jeûne et maintient l’ambiguïté du grec quant à l’objet sous-entendu avant l’action de bêcher. Elle améliore aussi la cohérence référentielle de l’image de la vigne sans modifier son sens.
