  text: He says, "You do not know how to fast to the Lord, nor is this useless fast that you fast to him a fast."
translation:
  language: fr
  text: 'Il dit : « Vous ne savez pas jeûner pour le Seigneur, et ce jeûne inutile que vous observez pour lui n’est pas un jeûne. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύειν τῷ Κυρίῳ
  choice: jeûner pour le Seigneur
  rationale: Le datif exprime ici l’orientation du jeûne vers le Seigneur; « pour » est naturel en français et conserve cette relation.
- source_word: ἀνωφελής
  choice: sans profit
  rationale: Rend directement l’idée d’un jeûne qui ne produit aucun bien, sans préciser de manière indue s’il est spirituellement inefficace ou simplement inutile.
- source_word: ἣν νηστεύετε αὐτῷ
  choice: que vous pratiquez pour lui
  rationale: Évite la répétition peu naturelle « jeûne que vous jeûnez » tout en conservant le verbe et le destinataire implicites dans la tournure grecque.
theological_decisions:
- issue: Portée de la négation οὐδέ ἐστιν νηστεία αὕτη
  choice: n’est pas un véritable jeûne
  alternative: n’est pas un jeûne
  rationale: « Véritable » explicite l’opposition rhétorique entre une pratique appelée jeûne et le jeûne reconnu comme tel devant Dieu, sans définir encore en quoi consiste ce dernier.
translation_notes:
  register: Français moderne, digne et oral, adapté à un dialogue d’enseignement. La répétition grecque autour de « jeûner/jeûne » est légèrement allégée pour préserver le naturel sans perdre l’insistance.
