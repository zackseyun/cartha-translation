review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend correctement οὐκ οἴδατε νηστεύειν τῷ Κυρίῳ. En revanche, « véritable » ajoute une qualification absente de οὐδέ ἐστιν νηστεία αὕτη : le grec affirme directement que cette pratique n’est pas un jeûne. L’adjectif ἀνωφελής signifie « inutile / sans profit » et qualifie explicitement le jeûne en question.'
  naturalness: La formulation est globalement naturelle et conserve le ton d’enseignement direct. « Jeûne inutile » est plus idiomatique que « jeûne sans profit » dans ce contexte, tout en restant précis. La répétition de « jeûne » dans la conclusion reproduit utilement l’insistance rhétorique grecque.
  terminology: « Seigneur » convient pour κύριος et « jeûner pour le Seigneur » est une restitution naturelle du datif τῷ Κυρίῳ. « Observer » évite en français l’expression littérale et maladroite « jeûner un jeûne », sans modifier le sens de ἣν νηστεύετε αὐτῷ.
  issues:
  - severity: medium
    issue: Ajout de « véritable »
    rationale: Le texte grec ne dit pas « n’est pas un véritable jeûne », mais « n’est pas un jeûne ». L’ajout interprète l’opposition rhétorique et doit être retiré afin de conserver la formulation catégorique de la source.
  - severity: low
    issue: « Sans profit » est moins naturel ici que « inutile »
    rationale: Les deux sens sont possibles pour ἀνωφελής, mais « jeûne inutile » est plus fluide en français moderne et garde l’absence de bénéfice exprimée par le grec.
