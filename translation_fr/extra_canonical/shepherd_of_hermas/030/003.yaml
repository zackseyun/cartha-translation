base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/003.yaml
  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: fr
  text: '« C’est donc pourquoi, Seigneur, dis-je, je te questionne avec soin sur tout : d’abord parce que je suis pécheur, ensuite parce que je ne sais pas en accomplissant quelles œuvres je vivrai, car mes péchés sont nombreux et de toutes sortes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce dialogue, Hermas s’adresse avec respect à l’être qui l’instruit. « Seigneur » conserve la portée honorifique de κύριε et son possible écho religieux, sans préciser davantage l’identité de l’interlocuteur.
- source_word: ἐξακριβάζομαι
  choice: je te questionne avec soin
  rationale: Le verbe exprime une enquête attentive et précise. Cette formulation française naturelle rend l’idée d’obtenir des éclaircissements détaillés.
- source_word: ποῖα ἔργα ἐργαζόμενος ζήσομαι
  choice: quelles œuvres accomplir pour vivre
  rationale: La tournure conserve le lien explicite entre les actes à accomplir et la vie, sans résoudre la nature exacte de cette vie, précisée par le contexte suivant.
- source_word: πολλαί ... καὶ ποικίλαι
  choice: nombreux et de toutes sortes
  rationale: « De toutes sortes » rend naturellement ποικίλαι, qui indique ici la diversité ou la variété des péchés.
theological_decisions:
- issue: Sens de « vivre » (ζήσομαι)
  choice: pour vivre
  alternative: pour être sauvé / pour avoir la vie éternelle
  rationale: Le grec dit simplement « vivre ». La traduction préserve cette indétermination et évite d’imposer une interprétation sotériologique plus explicite que le texte.
- issue: Rapport entre les œuvres et la vie
  choice: quelles œuvres accomplir pour vivre
  alternative: ce que je dois faire afin d’obtenir la vie
  rationale: La formulation reproduit le rapport exprimé par le grec sans développer une doctrine du mérite, de la grâce ou du salut absente de cette phrase.
- issue: Titre κύριε
  choice: Seigneur
  alternative: monsieur / maître
  rationale: Le terme peut être une adresse respectueuse ou avoir une portée plus élevée. « Seigneur » maintient cette tension dans le cadre religieux de l’œuvre.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe dialoguée et l’enchaînement « d’abord… ensuite… » suivent étroitement le grec tout en restant naturels.
