  source_fidelity: 'Le sens général est fidèle, y compris l’adresse « Seigneur » pour κύριε et l’indétermination de ζήσομαι (« vivre »). Toutefois, « quelles œuvres accomplir pour vivre » transforme légèrement la construction grecque ποῖα ἔργα ἐργαζόμενος ζήσομαι : le grec demande par quelles œuvres/accomplissant quelles œuvres le locuteur « vivra » (futur), plutôt qu’il n’énonce simplement un but (« pour vivre »).'
