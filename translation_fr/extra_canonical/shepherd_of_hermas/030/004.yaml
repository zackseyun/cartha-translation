  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/004.yaml
  text: '"You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them, will live to God."'
translation:
  language: fr
  text: « Tu vivras, dit-il, si tu gardes mes commandements et si tu marches dans ces commandements ; et quiconque, les ayant entendus, les gardera vivra devant Dieu. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήσῃ / ζήσεται
  choice: tu vivras / vivra
  rationale: Conserve le futur grec et le motif central de la vie.
- source_word: φυλάξῃ
  choice: gardes / gardera
  rationale: Rend l’idée d’observer fidèlement les commandements, tout en restant proche de l’image grecque.
- source_word: πορευθῇς ἐν αὐταῖς
  choice: marches selon eux
  rationale: Préserve la métaphore biblique de la marche tout en exprimant naturellement la conduite réglée par les commandements.
- source_word: ἀκούσας
  choice: entendra
  rationale: Le participe aoriste désigne celui qui a entendu; dans la formulation française générale au futur, « entendra » s’accorde naturellement avec « gardera » et « vivra ».
- source_word: τῷ Θεῷ
  choice: pour Dieu
  rationale: Traduction formelle du datif, sans trancher davantage entre une vie orientée vers Dieu et une vie reconnue comme telle devant lui.
theological_decisions:
- issue: Rapport entre l’observance des commandements et la vie
  choice: Maintenir la condition explicite « si tu gardes… »
  alternative: Reformuler en termes d’indice ou de conséquence indirecte
  rationale: Le grec énonce directement une condition; la traduction ne doit ni atténuer ni systématiser cette tension théologique.
- issue: Sens du datif τῷ Θεῷ
  choice: « vivra pour Dieu »
  alternative: « vivra devant Dieu » ou « vivra aux yeux de Dieu »
  rationale: « Pour Dieu » conserve la construction concise et l’ambiguïté du datif sans imposer une interprétation judiciaire ou seulement existentielle.
translation_notes:
  register: Français moderne, courant et digne. La répétition de « commandements », « garder » et « vivre » est conservée pour respecter la structure et l’insistance du grec.
