base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/001.yaml
  text: I asked him again, saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."
translation:
  language: fr
  text: 'Je l’interrogeai de nouveau : « Puisque le Seigneur m’a jugé digne que tu demeures toujours avec moi, supporte encore quelques paroles de ma part. En effet, je ne comprends rien, et mon cœur s’est endurci à cause de mes actes passés. Donne-moi de l’intelligence, car je suis vraiment insensé et ne saisis absolument rien. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄξιόν με ἡγήσατο
  choice: m’a jugé digne
  rationale: Rend directement l’évaluation exprimée par ἡγέομαι avec l’attribut ἄξιον, dans un français naturel et digne.
- source_word: κατοικῇς
  choice: tu demeures
  rationale: Conserve l’idée d’une présence durable ou d’une habitation auprès d’Hermas, plutôt qu’un simple accompagnement ponctuel.
- source_word: ὀλίγα μου ῥήματα ἔτι ἀνασχοῦ
  choice: supporte encore quelques paroles de ma part
  rationale: Préserve la demande patiente exprimée par ἀνέχομαι et la formulation humble de l’orateur.
- source_word: πεπώρωται
  choice: s’est endurci
  rationale: Le parfait exprime un état présent résultant du passé; « s’est endurci » restitue l’image morale sans l’expliquer excessivement.
- source_word: συνέτισόν με
  choice: Donne-moi de l’intelligence
  rationale: Rend la demande causative d’être amené à comprendre; cette formulation garde aussi le lien lexical avec σύνεσις dans la suite de la section.
- source_word: ἄφρων
  choice: insensé
  rationale: Terme courant dans le registre biblique et moral, plus précis et plus digne que « stupide ».
- source_word: νοῶ
  choice: saisis
  rationale: Évite une répétition française maladroite de « comprendre » tout en conservant la nuance de perception intellectuelle.
theological_decisions:
- issue: Cause de l’endurcissement du cœur
  choice: à cause de mes actes passés
  alternative: par suite de mes actes antérieurs
  rationale: ἀπό peut exprimer ici la source ou la cause. La traduction garde le lien entre les propres actes d’Hermas et son état intérieur, sans préciser un mécanisme théologique absent du grec.
- issue: Présence durable du personnage auprès d’Hermas
  choice: que tu demeures toujours avec moi
  alternative: que tu habites toujours avec moi
  rationale: « Demeurer » conserve la portée de κατοικέω tout en restant naturel; le texte ne précise pas davantage la nature de cette présence.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsmes. La syntaxe conserve la progression suppliante du grec et ses répétitions conceptuelles, notamment autour de l’incompréhension et de l’intelligence.
