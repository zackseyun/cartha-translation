base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: fr
  text: 'Il me répondit : « Moi, dit-il, je suis chargé de la repentance et je donne l’intelligence à tous ceux qui se repentent. Ne te semble-t-il pas, dit-il, que se repentir est en soi une marque d’intelligence ? Se repentir, dit-il, c’est faire preuve d’une grande intelligence. En effet, celui qui a péché comprend qu’il a fait le mal devant le Seigneur ; l’acte qu’il a commis lui revient au cœur, et il se repent. Il cesse alors de faire le mal, mais accomplit le bien avec générosité ; il humilie son âme et l’afflige, parce qu’il a péché. Tu vois donc que la repentance est une grande intelligence. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς μετανοίας εἰμί
  choice: je suis chargé de la repentance
  rationale: La tournure indique une responsabilité ou une autorité exercée dans le domaine de la repentance ; « chargé de » reste naturel sans préciser davantage la nature de la fonction.
- source_word: μετάνοια / μετανοεῖν
  choice: repentance / se repentir
  rationale: Ces termes rendent le changement intérieur et moral impliqué par le grec tout en conservant le vocabulaire théologique traditionnel et intelligible.
- source_word: σύνεσις
  choice: intelligence / faire preuve d’intelligence
  rationale: Le passage joue volontairement sur la répétition de σύνεσις. « Intelligence » préserve cette cohérence, tandis que la formulation verbale évite un français artificiel.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: lui revient au cœur
  rationale: Expression française naturelle qui conserve l’image de l’acte remontant à la conscience intérieure, sans la réduire à un simple souvenir mental.
- source_word: τὸ ἀγαθὸν πολυτελῶς ἐργάζεται
  choice: accomplit le bien avec générosité
  rationale: πολυτελῶς suggère une manière abondante, riche ou généreuse ; ce choix exprime l’ampleur de la pratique du bien sans connotation matérielle indue.
- source_word: ταπεινοῖ τὴν ἑαυτοῦ ψυχὴν καὶ βασανίζει
  choice: il s’humilie lui-même et s’afflige
  rationale: La traduction conserve la rigueur de la réaction pénitentielle, tout en évitant que « torture son âme » ne suggère nécessairement une automutilation absente du contexte.
theological_decisions:
- issue: Rapport entre repentance et intelligence
  choice: Préserver l’affirmation répétée selon laquelle la repentance est une grande intelligence
  alternative: Paraphraser la repentance comme simple signe de sagesse ou de discernement
  rationale: Le grec identifie fortement μετάνοια et σύνεσις ; cette tension conceptuelle ne doit pas être atténuée.
- issue: Fonction du locuteur à l’égard de la repentance
  choice: « chargé de la repentance »
  alternative: « préposé à la repentance » ou « responsable de la repentance »
  rationale: Le texte affirme une mission sans définir précisément un office institutionnel ; « chargé de » préserve cette relative indétermination.
- issue: Affliction consécutive au péché
  choice: « s’afflige d’avoir péché »
  alternative: « châtie son âme parce qu’il a péché »
  rationale: Le grec βασανίζει est fort, mais le contexte décrit l’humiliation pénitentielle. La formulation retenue conserve la souffrance intérieure sans imposer une doctrine de pénitence corporelle.
translation_notes:
  register: Français moderne, digne et accessible. Les répétitions structurantes de « repentance », « se repentir » et « intelligence » sont délibérément conservées. Les incises répétées « dit-il » reflètent la texture dialoguée du grec sans alourdir excessivement la lecture.
