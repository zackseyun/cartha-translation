  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/011.yaml
  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: fr
  text: « Tu vois donc, dit-il, que la foi vient d’en haut, du Seigneur, et qu’elle a une grande puissance ; mais l’hésitation est un esprit terrestre qui vient du diable et qui n’a aucune puissance. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: foi
  rationale: Équivalent français direct, naturel et constant dans le contexte religieux du passage.
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: Conserve l’image spatiale et l’opposition implicite avec « terrestre », sans expliciter davantage l’origine divine.
- source_word: διψυχία
  choice: hésitation
  rationale: Dans ce mandat consacré à la prière, le terme désigne l’indécision intérieure et le doute qui empêchent de demander avec confiance. « Hésitation » est idiomatique en français, tout en évitant le calque peu naturel « duplicité d’âme ».
- source_word: ἐπίγειον πνεῦμα
  choice: un esprit terrestre
  rationale: Rend formellement l’expression grecque et maintient son contraste avec ce qui vient « d’en haut ».
- source_word: δύναμις
  choice: puissance
  rationale: Préserve la répétition lexicale et l’opposition entre la grande puissance de la foi et l’impuissance de l’hésitation.
theological_decisions:
- issue: Origine de la foi et de l’hésitation
  choice: « la foi vient d’en haut, du Seigneur » et l’hésitation « vient du diable »
  alternative: Reformuler comme une simple influence morale venant de Dieu ou du mal
  rationale: Le grec exprime directement une provenance. La traduction la conserve sans construire une doctrine plus large sur la causalité divine ou démoniaque.
- issue: Personnification de l’hésitation comme esprit
  choice: « l’hésitation est un esprit terrestre »
  alternative: « l’hésitation est une disposition terrestre »
  rationale: Le mot πνεῦμα est maintenu afin de préserver la formulation et la tension théologique du texte, sans réduire l’énoncé à une psychologie moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le discours direct, le contraste « d’en haut / terrestre » et le parallélisme autour de la puissance.
