base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: fr
  text: 'Purifie donc ton cœur de toute hésitation et revêts-toi de la foi, car elle est forte. Crois Dieu : tu recevras toutes les demandes que tu lui adresses. Et si jamais, après avoir demandé quelque chose au Seigneur, tu le reçois plus tardivement, n’hésite pas parce que tu n’as pas reçu rapidement la demande de ton âme. Car c’est certainement à cause d’une épreuve ou d’une faute que tu ignores que tu reçois plus tardivement ce que tu as demandé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: hésitation
  rationale: Dans ce mandat, le terme désigne une disposition intérieure partagée qui doute lorsqu’elle demande à Dieu. « Hésitation » est naturel en français et conserve ici le lien avec le verbe διψυχήσῃς, rendu par « n’hésite pas ».
- source_word: ἔνδυσαι
  choice: revêts-toi de
  rationale: Conserve la métaphore concrète de l’habillement employée par le grec.
- source_word: πίστευε τῷ θεῷ
  choice: Crois Dieu
  rationale: Reproduit le datif personnel et l’idée de tenir Dieu pour digne de confiance, sans transformer explicitement la formule en « crois en Dieu ».
- source_word: αἴτημα τῆς ψυχῆς σου
  choice: la demande de ton âme
  rationale: Préserve l’expression anthropologique du texte plutôt que de la réduire à « ton désir ».
- source_word: πειρασμόν
  choice: épreuve
  rationale: Le mot peut signifier épreuve ou tentation. Dans l’explication d’un délai, « épreuve » convient au contexte tout en évitant de préciser un agent absent du grec.
- source_word: παράπτωμα
  choice: faute
  rationale: Terme français courant qui rend l’idée d’un manquement ou d’une transgression sans surcharger le registre.
- source_word: ὃ σὺ ἀγνοεῖς
  choice: dont tu n’as pas conscience
  rationale: Rend l’idée d’une faute ignorée par la personne, dans un français plus naturel que « que tu ignores ».
theological_decisions:
- issue: Portée de la promesse de recevoir toutes les demandes
  choice: 'Conserver l’affirmation absolue du passage : « tu recevras tout ce que tu lui demandes »'
  alternative: Ajouter une condition telle que « si cela correspond à la volonté de Dieu »
  rationale: Le verset ne formule pas cette condition. L’ajouter résoudrait la tension théologique au lieu de préserver la force propre du texte.
- issue: Cause du retard dans l’exaucement
  choice: Conserver l’alternative « à cause d’une épreuve ou d’une faute »
  alternative: Interpréter l’épreuve comme une discipline divine ou la faute comme nécessairement un péché caché
  rationale: Le grec ne précise ni l’agent de l’épreuve ni la nature exacte du manquement.
- issue: Relation entre foi et absence d’hésitation
  choice: Présenter l’hésitation comme la disposition opposée à la foi dans ce contexte de prière
  alternative: Employer systématiquement « duplicité » ou « cœur partagé »
  rationale: Le contexte immédiat porte sur le doute quant au fait de demander et de recevoir; « hésitation » communique cette fonction sans imposer une doctrine psychologique plus large.
translation_notes:
  register: Français moderne, international et digne. La traduction garde les impératifs directs, la métaphore du vêtement et la répétition autour de la demande et de sa réception, tout en allégeant légèrement les redondances grecques pour assurer une lecture naturelle.
