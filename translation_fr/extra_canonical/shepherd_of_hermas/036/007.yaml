revisions:
- from: 'Purifie donc ton cœur de toute hésitation et revêts-toi de la foi, car elle est forte. Crois Dieu : tu recevras tout ce que tu lui demandes. Et s’il arrive qu’après avoir adressé une demande au Seigneur, tu mettes plus de temps à recevoir, n’hésite pas sous prétexte que la demande de ton âme n’a pas été exaucée rapidement. Car c’est certainement à cause d’une épreuve ou d’une faute dont tu n’as pas conscience que tu mets plus de temps à recevoir ce que tu as demandé.'
  to: 'Purifie donc ton cœur de toute hésitation et revêts-toi de la foi, car elle est forte. Crois Dieu : tu recevras toutes les demandes que tu lui adresses. Et si jamais, après avoir demandé quelque chose au Seigneur, tu le reçois plus tardivement, n’hésite pas parce que tu n’as pas reçu rapidement la demande de ton âme. Car c’est certainement à cause d’une épreuve ou d’une faute que tu ignores que tu reçois plus tardivement ce que tu as demandé.'
  rationale: La révision conserve le sens, le ton exhortatif et les ambiguïtés théologiques du texte. Elle corrige l’expression française du délai afin que Dieu demeure implicitement celui qui donne et que le demandeur soit celui qui reçoit; elle supprime une nuance argumentative ajoutée et rattache explicitement l’ignorance à la faute, comme le fait la syntaxe grecque.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement les impératifs, la métaphore du vêtement, la promesse absolue et l’alternative entre épreuve et faute. Toutefois, « tu mettes plus de temps à recevoir » inverse légèrement le point de vue du grec : le sujet ne met pas du temps à recevoir, mais reçoit la demande plus tardivement. « Sous prétexte que » ajoute aussi une nuance argumentative absente du texte.'
  naturalness: Le français est globalement fluide et de registre approprié. La formulation révisée rend plus directement et naturellement le retard de la réception, sans suggérer que le demandeur en serait l’agent.
  terminology: « Hésitation » peut rendre διψυχία dans ce contexte de demande marquée par le doute; « n’hésite pas » est conservé. « Revêts-toi de la foi », « Crois Dieu », « demande de ton âme », « épreuve » et « faute » respectent convenablement le grec et le niveau de langue. La faute est explicitement présentée comme ignorée, conformément au relatif grec qui renvoie au παράπτωμα singulier.
  issues:
  - severity: medium
    issue: Agent implicite du retard formulé de façon inexacte
    rationale: Le grec βραδύτερον λαμβάνῃς signifie « tu reçois plus tardivement ». « Tu mettes plus de temps à recevoir » peut faire entendre que le demandeur est la cause active du délai.
  - severity: low
    issue: Ajout de la locution « sous prétexte que »
    rationale: μη διψυχήσῃς, ὅτι ... signifie simplement de ne pas hésiter/douter parce que la demande n’a pas été reçue rapidement; la locution française ajoute une idée de justification alléguée qui n’est pas exprimée.
  - severity: low
    issue: Antécédent de « dont tu n’as pas conscience » insuffisamment explicite
    rationale: Le relatif ὃ renvoie grammaticalement au « manquement / faute » singulier. Le préciser évite que le français laisse entendre qu’il pourrait s’agir d’une épreuve ignorée.
  revised_text: 'Purifie donc ton cœur de toute hésitation et revêts-toi de la foi, car elle est forte. Crois Dieu : tu recevras toutes les demandes que tu lui adresses. Et si jamais, après avoir demandé quelque chose au Seigneur, tu le reçois plus tardivement, n’hésite pas parce que tu n’as pas reçu rapidement la demande de ton âme. Car c’est certainement à cause d’une épreuve ou d’une faute que tu ignores que tu reçois plus tardivement ce que tu as demandé.'
