base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/003.yaml
  text: For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.
translation:
  language: fr
  text: Car Dieu n’est pas comme les êtres humains, qui gardent rancune ; lui, il ne garde pas rancune et il a compassion de ce qu’il a créé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακοῦντες
  choice: qui gardent rancune
  rationale: Le participe désigne ceux qui entretiennent le souvenir d’un tort et en veulent à son auteur ; « garder rancune » rend ce sens naturellement en français.
- source_word: ἀμνησίκακος
  choice: il ne garde pas rancune
  rationale: Cette formulation conserve l’opposition lexicale explicite avec μνησικακοῦντες, sans suggérer que Dieu manquerait littéralement de mémoire.
- source_word: σπλαγχνίζεται
  choice: il a compassion
  rationale: Le verbe exprime une profonde compassion ; cette tournure est claire, digne et adaptée au registre religieux du passage.
- source_word: ποίησιν αὐτοῦ
  choice: ce qu’il a créé
  rationale: ποίησις peut désigner l’œuvre créée ou la création de Dieu. La tournure choisie reste concrète et reproduit l’étendue indéterminée de l’expression grecque.
theological_decisions:
- issue: La manière dont Dieu ne tient pas compte des torts
  choice: « il ne garde pas rancune »
  alternative: « il ne se souvient pas des offenses »
  rationale: Le grec oppose ceux qui nourrissent le souvenir du mal à Dieu, qualifié d’ἀμνησίκακος. La traduction retenue évite d’affirmer une absence de connaissance ou de mémoire chez Dieu tout en conservant la portée morale du terme.
- issue: Référent de ποίησις
  choice: « ce qu’il a créé »
  alternative: « sa création »
  rationale: L’expression grecque peut viser l’ensemble de l’œuvre créée sans préciser ici s’il s’agit spécialement de l’humanité. La formulation retenue préserve cette amplitude.
translation_notes:
  register: Français moderne international, naturel et digne. La répétition « gardent rancune / ne garde pas rancune » reproduit l’antithèse grecque et rend la phrase accessible sans effacer sa force rhétorique.
