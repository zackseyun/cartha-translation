base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/012.yaml
  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: fr
  text: Toi donc, sers la foi, qui possède la puissance, et tiens-toi loin de l’irrésolution, qui n’en possède aucune. Alors tu vivras pour Dieu, et tous ceux qui adoptent cette manière de penser vivront pour Dieu.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλευε
  choice: sers
  rationale: Rend directement l’impératif de δουλεύω et conserve l’image d’un service soumis, sans l’alourdir par «sois esclave de».
- source_word: πίστει
  choice: la foi
  rationale: 'Correspond au sens constant du passage: la confiance ferme placée en Dieu, présentée ici sous une forme personnifiée.'
- source_word: διψυχίας
  choice: l’irrésolution
  rationale: Le terme désigne littéralement le fait d’être partagé entre deux dispositions; dans ce contexte de prière et de confiance, «irrésolution» exprime le doute hésitant sans introduire l’expression française peu naturelle «double pensée».
- source_word: ζήσῃ τῷ θεῷ
  choice: tu vivras pour Dieu
  rationale: Préserve le datif grec et la formulation théologique volontairement concise, sans préciser indûment s’il signifie vivre au service de Dieu, devant Dieu ou par rapport à Dieu.
- source_word: οἱ ταῦτα φρονοῦντες
  choice: ceux qui adoptent cette manière de penser
  rationale: φρονέω désigne ici une orientation de pensée ou une disposition; cette formulation naturelle maintient le renvoi global à l’enseignement précédent.
theological_decisions:
- issue: Nature de la puissance attribuée à la foi
  choice: «la foi, qui possède la puissance»
  alternative: «la foi puissante»
  rationale: La proposition relative conserve la personnification et le contraste explicite du grec entre la foi qui a de la puissance et l’irrésolution qui n’en a pas, sans définir la nature de cette puissance.
- issue: Sens de «vivre pour Dieu»
  choice: Maintien de la formule «vivre pour Dieu»
  alternative: «vivre en Dieu» ou «vivre aux yeux de Dieu»
  rationale: Le datif τῷ θεῷ permet une relation plus large que les alternatives; la traduction retenue préserve cette tension sans imposer une lecture mystique ou judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme rhétorique entre foi et irrésolution ainsi que la répétition finale de «vivre pour Dieu». Le tutoiement suit l’adresse personnelle continue du mandat.
