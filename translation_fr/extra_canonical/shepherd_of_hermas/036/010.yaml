base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/010.yaml
  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: fr
  text: Méprise donc le cœur partagé[a] et domine-le en toute circonstance, en revêtant la foi forte et puissante. Car la foi promet tout et mène tout à bien, tandis que le cœur partagé, faute d’avoir confiance en lui-même, échoue dans toutes les œuvres qu’il entreprend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque désigne l’état d’une personne intérieurement divisée, qui hésite et manque de confiance.
    reason: Le nom διψυχία n’a pas d’équivalent français unique qui conserve à la fois son image littérale et sa portée dans ce passage.
lexical_decisions:
- source_word: διψυχία
  choice: le cœur partagé
  rationale: Le terme désigne littéralement le fait d’être « partagé entre deux âmes », donc l’hésitation intérieure et le manque de confiance. « Le cœur partagé » est naturel en français, conserve l’image d’une personne divisée et convient à la personnification du passage.
- source_word: κατακυρίευσον
  choice: domine-le
  rationale: Le verbe exprime l’idée de prendre le dessus et d’exercer sa maîtrise sur quelque chose.
- source_word: ἐν παντὶ πράγματι
  choice: en toute circonstance
  rationale: Dans ce contexte d’exhortation générale, l’expression vise toute situation ou affaire, plutôt que chaque objet concret.
- source_word: ἐνδυσάμενος
  choice: en revêtant
  rationale: Conserve la métaphore grecque du vêtement appliquée à la foi.
- source_word: ἐπαγγέλλεται
  choice: promet
  rationale: Rend le sens usuel du verbe et maintient la personnification audacieuse de la foi sans l’atténuer.
- source_word: τελειοῖ
  choice: mène tout à bien
  rationale: Exprime l’idée d’accomplir, d’achever ou de conduire à son plein résultat dans un français naturel.
- source_word: ἀποτυγχάνει
  choice: échoue
  rationale: Le verbe indique le fait de manquer le but ou de ne pas obtenir le résultat recherché.
theological_decisions:
- issue: Portée absolue des affirmations sur la foi
  choice: « la foi promet tout et mène tout à bien »
  alternative: « la foi peut tout promettre et tout accomplir »
  rationale: La formulation garde les deux πάντα du grec et sa tension rhétorique, sans ajouter de restriction doctrinale ni transformer l’énoncé en affirmation explicite d’omnipotence humaine.
- issue: Cause de l’échec du cœur partagé
  choice: « faute d’avoir confiance en lui-même »
  alternative: « parce qu’il ne croit pas en lui-même »
  rationale: Le grec parle d’un défaut de confiance en soi dans le cadre de la personnification. « Avoir confiance » évite de confondre cette proposition avec la foi théologique en Dieu.
translation_notes:
  register: Français moderne, international et digne. La structure exhortative, la métaphore du vêtement et les personnifications de la foi et du cœur partagé sont conservées.
