review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est correctement rendu : persévérer dans la demande, recevoir, puis ne pas attribuer au donateur la faute d’un échec lié au découragement et à la διψυχία. Toutefois, « présenter la demande de ton âme » est moins fidèle à la construction αἰτούμενος τὸ αἴτημα et peu idiomatique en français. « Te mets à douter » rend une part du sens de διψυχήσῃς, mais « hésiter » conserve mieux l’idée d’une disposition intérieure partagée ou vacillante, sans introduire une formulation technique.'
  naturalness: Le tutoiement, l’impératif et le ton exhortatif conviennent. La répétition de « demande » peut être formulée plus naturellement en français par « la demande que ton âme porte », tout en conservant l’image intérieure du grec. « En demander » rattache clairement l’hésitation à l’acte de demander.
  terminology: « Celui qui te donne » respecte le participe substantivé τὸν διδόντα σοι et évite d’expliciter le référent. « Perdre courage » rend bien ἐκκακέω. « Hésiter » est préférable ici à un simple « douter », car le terme grec appartient au champ de la double disposition / de l’instabilité intérieure développé dans le contexte immédiat.
  issues:
  - severity: low
    issue: Formulation « présenter la demande de ton âme »
    rationale: Elle est quelque peu administrative et ne rend pas très naturellement le verbe αἰτέω avec son objet. Une formulation qui garde l’idée de la demande intérieure est plus fluide et plus proche du grec.
  - severity: low
    issue: Nuance de διψυχήσῃς
    rationale: « Te mets à douter » est recevable, mais peut réduire le terme à un doute intellectuel. « Hésiter » maintient mieux l’idée contextuelle de vacillation dans la confiance.
  revised_text: Toi donc, ne cesse pas de demander la demande que ton âme porte, et tu la recevras. Mais si, en demandant, tu perds courage et hésites, attribues-en la faute à toi-même, et non à celui qui te donne.
  revised_footnotes: []
