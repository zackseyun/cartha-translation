base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/008.yaml
  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: fr
  text: Toi donc, ne cesse pas de demander la demande que ton âme porte, et tu la recevras. Mais si, en demandant, tu perds courage et hésites, attribues-en la faute à toi-même, et non à celui qui te donne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς αἰτούμενος
  choice: ne cesse pas de présenter la demande
  rationale: Rend l’idée de persévérer dans l’action de demander, avec une tournure française naturelle.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: la demande de ton âme
  rationale: Conserve l’expression concrète et intérieure du grec sans la réduire à un simple « désir ».
- source_word: ἐκκακήσῃς
  choice: tu te décourages
  rationale: Le verbe désigne le fait de perdre courage ou de se lasser; « te décourages » convient au contexte de la prière persévérante.
- source_word: διψυχήσῃς
  choice: te mets à douter
  rationale: Dans ce contexte, le terme décrit une hésitation intérieure qui compromet la confiance. La traduction naturelle « douter » évite l’obscur littéralisme « avoir l’âme double ».
- source_word: σεαυτὸν αἰτιῶ
  choice: ne t’en prends qu’à toi-même
  rationale: Exprime idiomatiquement l’ordre de s’attribuer la responsabilité.
- source_word: τὸν διδόντα σοι
  choice: celui qui te donne
  rationale: Préserve la désignation indirecte du texte grec, sans remplacer explicitement le référent par « Dieu » ou « le Seigneur ».
theological_decisions:
- issue: Identité de « celui qui te donne »
  choice: Conserver « celui qui te donne »
  alternative: « le Seigneur qui te donne » ou « Dieu »
  rationale: Le contexte désigne clairement le Seigneur, mais le verset emploie un participe substantivé; conserver l’expression évite d’expliciter davantage que le grec.
- issue: Portée de la promesse « tu la recevras »
  choice: Maintenir l’affirmation sans qualification ajoutée
  alternative: Ajouter une condition telle que « si elle est conforme à la volonté de Dieu »
  rationale: Le segment formule directement la promesse. Les tensions ou qualifications théologiques ne doivent pas être importées si elles ne figurent pas dans cette unité.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement suit l’adresse singulière du grec. La formulation garde l’exhortation directe et le contraste entre persévérance, découragement et doute.
