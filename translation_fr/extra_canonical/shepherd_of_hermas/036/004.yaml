base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/004.yaml
  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: fr
  text: Toi donc, purifie ton cœur de toutes les vanités de ce monde-ci et des paroles qui t’ont été dites auparavant, puis demande au Seigneur, et tu recevras tout ; tu ne seras privé de rien de ce que tu demandes, si tu demandes au Seigneur sans hésiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ματαιωμάτων τοῦ αἰῶνος τούτου
  choice: vanités du monde présent
  rationale: « Vanités » conserve l’idée de réalités vaines et sans valeur, tandis que « monde présent » rend naturellement αἰών dans son sens d’ordre ou d’époque actuelle.
- source_word: τῶν προειρημένων σοί ῥημάτων
  choice: des pensées dont je t’ai parlé auparavant
  rationale: Dans le contexte immédiat, les paroles précédentes concernent les raisonnements intérieurs liés au doute; « pensées » explicite ce référent probable sans changer l’exhortation.
- source_word: ἀπολήψῃ πάντα
  choice: tu recevras tout
  rationale: Rend directement la promesse générale du grec, sans ajouter de restriction absente de cette phrase.
- source_word: ἀπὸ πάντων τῶν αἰτημάτων σου ἀνυστέρητος ἔσῃ
  choice: aucune de tes demandes ne restera sans réponse
  rationale: Formulation française naturelle exprimant le fait de ne rester privé d’aucune chose demandée.
- source_word: ἀδιστάκτως
  choice: sans hésiter
  rationale: Le terme désigne ici une demande faite sans vacillation ni doute intérieur; « sans hésiter » reste clair et cohérent avec le contexte.
theological_decisions:
- issue: Portée de la promesse concernant toutes les demandes
  choice: Conserver la formulation absolue du passage
  alternative: Ajouter une condition telle que « si elles sont conformes à la volonté de Dieu »
  rationale: Le verset grec ne formule pas cette restriction. L’ajouter résoudrait une tension théologique que la traduction doit préserver.
- issue: Nature de la condition imposée à la prière
  choice: « sans hésiter »
  alternative: « sans douter » ou « avec une foi parfaite »
  rationale: Le grec met l’accent sur l’absence de vacillation. « Sans hésiter » évite d’introduire ici une définition doctrinale plus développée de la foi.
translation_notes:
  register: Français moderne, digne et accessible. L’impératif et la promesse gardent leur force. Aucun marqueur de note n’est requis.
