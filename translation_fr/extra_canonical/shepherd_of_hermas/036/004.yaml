review_pass:
  verdict: revise
  source_fidelity: La structure exhortation-condition-promesse est bien rendue, et « sans hésiter » convient à ἀδιστάκτως dans ce contexte. Toutefois, τῶν προειρημένων σοί ῥημάτων signifie « les paroles qui t’ont été dites auparavant », non « les pensées dont je t’ai parlé auparavant ». Le grec ne qualifie pas ces paroles de pensées, même si le contexte traite du doute.
  naturalness: Le français du projet est fluide et d’un registre approprié. La révision conserve cette clarté tout en évitant l’explicitation non justifiée de « pensées ».
  terminology: « vanités de ce monde-ci » rend naturellement ματαιώματα τοῦ αἰῶνος τούτου. « Tu ne seras privé de rien de ce que tu demandes » exprime de façon idiomatique l’idée de n’être en défaut à l’égard d’aucune de ses demandes, sans transformer explicitement la promesse en simple réponse verbale.
  issues:
  - severity: medium
    issue: « des pensées dont je t’ai parlé auparavant » pour τῶν προειρημένων σοί ῥημάτων
    rationale: ῥημάτων désigne des paroles, propos ou déclarations précédemment adressés au destinataire. La substitution par « pensées » est une interprétation contextuelle qui dépasse le texte et supprime son ambiguïté.
  - severity: low
    issue: « aucune de tes demandes ne restera sans réponse »
    rationale: Cette formulation peut suggérer qu’une réponse, plutôt que l’obtention demandée, est promise. Le grec affirme que le demandeur ne sera privé de rien dans ses requêtes.
  revised_text: Toi donc, purifie ton cœur de toutes les vanités de ce monde-ci et des paroles qui t’ont été dites auparavant, puis demande au Seigneur, et tu recevras tout ; tu ne seras privé de rien de ce que tu demandes, si tu demandes au Seigneur sans hésiter.
  revised_footnotes: []
  revision_rationale: La révision corrige l’explicitation indue de « paroles » en « pensées » et resserre la promesse finale sur le sens de l’obtention, tout en préservant la formulation absolue et conditionnelle du texte grec.
