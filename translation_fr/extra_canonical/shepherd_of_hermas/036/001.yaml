review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’injonction porte sur la διψυχία au moment de demander à Dieu, et la question intérieure conserve l’obstacle lié aux nombreux péchés commis contre lui. Toutefois, « le cœur partagé / être partagé » déplace l’image de l’âme ou de la personne intérieurement divisée vers le « cœur » et sonne peu idiomatique dans la seconde occurrence. « Indécision » rend plus naturellement la disposition visée sans la réduire au seul doute intellectuel. L’ajout de « de lui » après « recevoir » explicite correctement la relation exprimée dans le grec.'
  naturalness: La phrase est fluide dans l’ensemble, mais « ne sois absolument pas partagé » est lourd et peu naturel en français moderne. « Ne sois absolument pas indécis » est plus direct et conserve le registre exhortatif.
  terminology: '« Seigneur », « Dieu », « péché » et « recevoir » conviennent. La note doit éviter de présenter « double âme » comme une formulation française littérale : il s’agit d’une traduction mot à mot de l’image grecque. Elle doit aussi ancrer clairement la note à « indécision ».'
  issues:
