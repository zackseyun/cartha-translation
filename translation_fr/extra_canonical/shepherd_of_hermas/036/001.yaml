base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: fr
  text: 'Il me dit : « Écarte de toi toute indécision[a] et, lorsque tu demandes quelque chose à Dieu, ne sois absolument pas indécis, en te disant : “Comment pourrais-je demander au Seigneur et recevoir de lui, moi qui ai tant péché contre lui ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec évoque littéralement le fait d’avoir « deux âmes », c’est-à-dire d’être intérieurement divisé. Dans ce contexte, il s’agit d’une hésitation qui empêche de s’adresser à Dieu avec confiance.
    reason: διψυχία est rendu par « indécision » pour une formulation française naturelle; la note préserve l’image étymologique et sa portée contextuelle.
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: le cœur partagé / être partagé
  rationale: Le terme désigne littéralement le fait d’avoir une âme divisée et, dans ce contexte, l’hésitation intérieure qui empêche de demander à Dieu avec confiance. Cette formulation française naturelle conserve l’image de la division intérieure.
- source_word: αἰτήσασθαί
  choice: demander
  rationale: Rend directement l’acte d’adresser une requête à Dieu, sans ajouter la notion plus spécialisée de prière.
- source_word: ἡμαρτηκὼς τοσαῦτα εἰς αὐτόν
  choice: moi qui ai tant péché contre lui
  rationale: Conserve la quantité exprimée par τοσαῦτα et la relation personnelle indiquée par εἰς αὐτόν.
theological_decisions:
- issue: Nature de la διψυχία dans la demande adressée à Dieu
  choice: être intérieurement partagé
  alternative: douter
  rationale: « Douter » serait plus fluide mais réduirait la métaphore grecque de la personne divisée. Le texte relie cette division au sentiment d’indignité causé par les péchés passés, sans nier la gravité de ceux-ci.
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct et la question intérieure sont conservés. « Le cœur partagé » communique naturellement en français l’image grecque de l’âme divisée.
