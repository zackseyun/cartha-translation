  to: 'Il me dit : « Écarte de toi toute indécision[a] et, lorsque tu demandes quelque chose à Dieu, ne sois absolument pas indécis, en te disant : “Comment pourrais-je demander au Seigneur et recevoir de lui, moi qui ai tant péché contre lui ?” »'
  rationale: Révision limitée à la restitution de διψυχία et à une explicitation légère de « recevoir de lui ». Elle maintient l’ambiguïté du terme grec — division intérieure, hésitation ou manque de confiance — sans lui imposer une interprétation doctrinale.
