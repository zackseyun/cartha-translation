    issue: « le cœur partagé / être partagé » ne reproduit pas de façon stable le terme grec διψυχία.
    rationale: διψυχία évoque étymologiquement une âme, ou une personne, divisée; « cœur partagé » est une adaptation possible mais l’expression verbale « être partagé » est moins naturelle ici et peut suggérer seulement un choix entre deux options.
  - severity: low
    issue: La provenance implicite de ce qui est reçu gagnerait à être exprimée.
    rationale: Dans « demander au Seigneur et recevoir », le grec situe la demande auprès du Seigneur; « recevoir de lui » conserve cette relation et évite une légère ellipse en français.
