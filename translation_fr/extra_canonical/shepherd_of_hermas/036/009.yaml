review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la διψυχία est présentée comme mauvaise, destructrice pour la foi, d’origine diabolique et hostile aux serviteurs de Dieu. Toutefois, « irrésolution » peut évoquer principalement l’incapacité à prendre une décision, alors que le contexte et le terme grec visent plus largement une hésitation intérieure, un esprit partagé dans la confiance. « Indécision » est plus immédiatement compréhensible ici, tout en évitant de lui imposer le sens moral de « duplicité ».'
  naturalness: La formulation est globalement naturelle, mais « Vois » est moins idiomatique que « Regarde » dans cette exhortation, et « agit avec une très grande méchanceté contre » est plus lourd que la tournure française directe « se montre très malfaisante envers ».
  terminology: « Déracine de la foi » conserve adéquatement l’image forte de ἐκριζοῖ. « Fille du diable » doit être conservé comme métaphore explicite. « Dénuée de discernement » rend plus précisément ἀσύνετος qu’« insensée », qui peut suggérer surtout la folie plutôt qu’un manque de compréhension.
  issues:
  - severity: medium
    issue: Nuance de διψυχία
    rationale: Dans ce passage, le mot désigne l’hésitation ou le partage intérieur qui compromet la confiance dans la prière. « Indécision » est plus accessible et plus proche de cet emploi contextuel que « irrésolution », sans surinterpréter le terme.
  - severity: low
    issue: Rendu de ἀσύνετος et de λίαν πονηρεύεται εἰς
    rationale: « Dénuée de discernement » et « se montre très malfaisante envers » reproduisent plus clairement le manque d’intelligence/discernement et l’action particulièrement malveillante dirigée vers quelqu’un.
  revised_text: 'Regarde cette indécision : elle est mauvaise et dénuée de discernement ; elle déracine beaucoup de gens de la foi, même des croyants très fidèles et forts. Car cette indécision est une fille du diable et elle se montre très malfaisante envers les serviteurs de Dieu.'
