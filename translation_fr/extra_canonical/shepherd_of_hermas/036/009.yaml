base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/009.yaml
  text: 'Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the servants of God.'
translation:
  language: fr
  text: 'Regarde cette indécision : elle est mauvaise et dénuée de discernement ; elle déracine beaucoup de gens de la foi, même des croyants très fidèles et forts. Car cette indécision est une fille du diable et elle se montre très malfaisante envers les serviteurs de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: irrésolution
  rationale: Dans ce mandat, le terme désigne l’hésitation intérieure qui empêche de demander à Dieu avec confiance. « Irrésolution » reste naturel en français et permet de conserver la personnification féminine du grec, sans réduire le mot à la duplicité morale.
- source_word: ἐκριζοῖ ἀπὸ τῆς πίστεως
  choice: déracine de la foi
  rationale: Conserve l’image forte de l’arrachement exprimée par ἐκριζόω et son lien direct avec la foi.
- source_word: λίαν πιστοὺς καὶ ἰσχυρούς
  choice: des croyants très fidèles et forts
  rationale: Reproduit les deux qualificatifs du grec sans préciser abusivement la nature de leur force.
- source_word: λίαν πονηρεύεται εἰς
  choice: agit avec une très grande méchanceté contre
  rationale: Rend l’action malveillante intense et son orientation hostile envers les serviteurs de Dieu.
theological_decisions:
- issue: Nature de la διψυχία
  choice: La rendre par « irrésolution », dans le sens d’une hésitation qui divise intérieurement la confiance en Dieu.
  alternative: « Cœur partagé », « doute » ou « duplicité ».
  rationale: Le contexte immédiat concerne le fait d’hésiter dans la prière et de ne pas se fier pleinement à Dieu. « Duplicité » introduirait surtout une idée de tromperie absente ici, tandis que « doute » atténuerait la personnification et la continuité lexicale.
- issue: Personnification comme « fille du diable »
  choice: Conserver littéralement la filiation métaphorique.
  alternative: Paraphraser comme une attitude « venant du diable ».
  rationale: Le grec attribue explicitement à l’irrésolution une origine et une action personnelles; cette image théologique forte ne doit pas être neutralisée.
translation_notes:
  register: Français international moderne, clair et digne. La structure sentencieuse et la personnification du grec sont conservées, avec une syntaxe naturelle pour la lecture publique.
