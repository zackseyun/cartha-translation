base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: fr
  text: Mais si tu hésites dans ton cœur, tu ne recevras absolument rien de ce que tu demandes. En effet, ceux qui hésitent à l’égard de Dieu sont partagés, et ils n’obtiennent absolument rien de ce qu’ils demandent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσῃς / διστάζοντες
  choice: hésites / ceux qui hésitent
  rationale: Le verbe exprime ici l’hésitation ou le doute intérieur qui empêche de demander avec confiance; « hésiter » conserve le lien lexical entre les deux occurrences.
- source_word: δίψυχοι
  choice: partagés
  rationale: Littéralement « à l’âme double »; « partagés » rend en français naturel l’idée d’une personne intérieurement divisée, sans réduire le terme à une simple indécision.
- source_word: αἰτημάτων
  choice: ce que tu demandes / ce qu’ils demandent
  rationale: Dans ce contexte de prière, le sens concret est celui des choses demandées. Cette formulation courante évite le caractère administratif de « requêtes » ou « pétitions ».
- source_word: εἰς τὸν θεόν
  choice: à l’égard de Dieu
  rationale: La préposition marque ici l’orientation ou la relation envers Dieu; cette expression préserve cette nuance sans préciser abusivement s’il s’agit de douter de Dieu, de sa fidélité ou de sa volonté de répondre.
- source_word: οὐδὲν οὐ μὴ λήψῃ / οὐδὲν ὅλως ἐπιτυγχάνουσιν
  choice: tu ne recevras absolument rien / ils n’obtiennent absolument rien
  rationale: Les négations fortement emphatiques et ὅλως appellent une formulation catégorique; les verbes français distinguent comme le grec « recevoir » et « obtenir ».
theological_decisions:
- issue: Nature du doute visé
  choice: « hésitent à l’égard de Dieu »
  alternative: « doutent de Dieu » ou « manquent de foi en Dieu »
  rationale: Le grec décrit une hésitation orientée vers Dieu sans définir ici exactement son objet. La traduction retenue préserve cette ouverture et n’assimile pas automatiquement toute question intérieure à l’incrédulité.
- issue: Sens de δίψυχοι
  choice: « sont partagés »
  alternative: « ont l’âme double » ou « sont irrésolus »
  rationale: Le terme porte une forte image d’intériorité divisée. « Partagés » la communique clairement sans introduire une catégorie doctrinale étrangère au texte.
- issue: Portée de la promesse concernant la prière
  choice: Traduction directe et absolue de l’énoncé
  alternative: Ajouter une qualification sur les demandes conformes à la volonté divine
  rationale: Le verset formule l’affirmation sans qualification explicite. Aucune précision théologique absente du passage n’est ajoutée.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement est conservé puisque l’exhortation grecque s’adresse directement à un interlocuteur singulier. La répétition de « absolument rien » reflète l’insistance du texte source.
