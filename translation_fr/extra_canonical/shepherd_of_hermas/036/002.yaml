    issue: « reviens au Seigneur »
    rationale: ἐπίστρεψον signifie « tourne-toi vers »; « reviens » introduit possiblement l’idée d’un retour préalable que le verbe seul n’explicite pas.
  - severity: medium
    issue: « il exaucera le désir de ton âme »
    rationale: Le grec τὸ αἴτημα τῆς ψυχῆς σου désigne la demande ou requête de l’âme. « Désir » élargit le référent et affaiblit le lien lexical avec la demande formulée juste avant.
