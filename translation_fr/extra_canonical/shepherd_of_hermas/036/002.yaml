  source_fidelity: Le sens général est bien rendu. Toutefois, « reviens au Seigneur » peut suggérer explicitement un retour à un état antérieur, tandis que ἐπίστρεψον demande plus sobrement de se tourner vers le Seigneur. La dernière expression contient αἴτημα, « demande/requête », et non le terme plus large « désir ».
  naturalness: Le français est fluide, moderne et d’un registre approprié. « Tourne-toi vers le Seigneur » et « répondra à la demande de ton âme » restent naturels dans un contexte religieux tout en suivant plus précisément le grec.
  terminology: « Seigneur », « cœur », « compassion » et « sans hésiter » conviennent. « Ne raisonne pas ainsi » rend bien l’interdiction de poursuivre ce raisonnement intérieur.
