base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/002.yaml
  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: fr
  text: 'Ne raisonne pas ainsi, mais tourne-toi vers le Seigneur de tout ton cœur et demande-lui sans hésiter. Alors tu connaîtras sa grande compassion : il ne t’abandonnera certainement pas, mais répondra à la demande de ton âme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλογίζου ταῦτα
  choice: Ne raisonne pas ainsi
  rationale: Dans le contexte immédiat, l’expression interdit de poursuivre le raisonnement intérieur fondé sur les péchés passés, plutôt que toute forme de réflexion.
- source_word: ἐξ ὅλης τῆς καρδίας σου ἐπίστρεψον
  choice: reviens au Seigneur de tout ton cœur
  rationale: ἐπιστρέφω exprime ici un retour ou une conversion vers le Seigneur; la formulation française conserve l’image et l’engagement total du cœur.
- source_word: ἀδιστάκτως
  choice: sans hésiter
  rationale: Le terme désigne l’absence d’hésitation ou de doute partagé; « sans hésiter » reste naturel tout en préparant le thème de la διψυχία développé dans le passage.
- source_word: γνώσῃ
  choice: tu découvriras
  rationale: Le futur indique une connaissance acquise par l’expérience; « découvriras » rend cette nuance plus naturellement que le simple « sauras ».
- source_word: πολλὴν εὐσπλαγχνίαν
  choice: sa grande compassion
  rationale: εὐσπλαγχνία désigne une compassion profonde et miséricordieuse; « grande compassion » est clair, digne et fidèle.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου πληροφορήσει
  choice: il exaucera le désir de ton âme
  rationale: πληροφορέω porte ici l’idée de mener pleinement à accomplissement ou de satisfaire la requête. « Exaucera » convient au contexte de la prière, tandis que « désir de ton âme » conserve la formulation intérieure et personnelle du grec.
theological_decisions:
- issue: Portée de la promesse d’exaucement
  choice: Conserver l’affirmation forte « il exaucera le désir de ton âme » sans en préciser les conditions dans ce seul segment.
  alternative: Ajouter une restriction explicite telle que « si cela est conforme à sa volonté ».
  rationale: Le grec de cette unité formule directement la promesse; importer ici une condition théologique absente du texte résoudrait artificiellement la tension, même si le contexte plus large développe l’attitude requise du demandeur.
- issue: Force de la négation οὐ μή
  choice: « il ne t’abandonnera certainement pas »
  alternative: « il ne t’abandonnera pas »
  rationale: La tournure grecque οὐ μή avec le subjonctif est emphatique; « certainement pas » en restitue la force sans ajouter une idée étrangère.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement est maintenu, conformément à l’adresse directe au personnage. La ponctuation en deux phrases et les deux-points rendent clairement le mouvement de l’exhortation vers sa justification.
