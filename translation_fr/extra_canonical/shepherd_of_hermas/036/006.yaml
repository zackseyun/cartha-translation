base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: fr
  text: Mais ceux dont la foi est entière demandent toutes choses avec confiance dans le Seigneur, et ils les reçoivent, parce qu’ils demandent sans hésiter, sans avoir le cœur partagé. En effet, tout homme au cœur partagé, s’il ne se repent pas, sera difficilement sauvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁλοτελεῖς ὄντες ἐν τῇ πίστει
  choice: ceux dont la foi est entière
  rationale: Rend l’idée d’intégrité ou de plénitude dans la foi sans suggérer une perfection morale absolue.
- source_word: πεποιθότες ἐπὶ τὸν κύριον
  choice: avec confiance dans le Seigneur
  rationale: Exprime naturellement en français le parfait πεποιθότες, qui décrit une confiance établie.
- source_word: ἀδιστάκτως
  choice: sans hésiter
  rationale: Conserve le sens d’une demande exempte d’hésitation ou de doute.
- source_word: μηδὲν διψυχοῦντες / δίψυχος
  choice: sans avoir le cœur partagé / au cœur partagé
  rationale: Le grec désigne une personne intérieurement divisée ou irrésolue; cette expression française est claire et préserve l’image anthropologique sans recourir au calque peu naturel «à l’âme double».
- source_word: δυσκόλως σωθήσεται
  choice: sera difficilement sauvé
  rationale: Traduction formelle qui maintient la tension du futur passif et de l’adverbe «difficilement», sans expliquer ni atténuer l’affirmation.
theological_decisions:
- issue: Portée de πάντα dans «πάντα αἰτοῦνται»
  choice: demandent toutes choses
  alternative: demandent tout ce dont ils ont besoin
  rationale: Le texte dit littéralement «toutes choses»; la traduction n’ajoute pas une restriction absente de cette unité.
- issue: Rapport entre repentance et salut
  choice: s’il ne se repent pas, sera difficilement sauvé
  alternative: s’il ne change pas, aura beaucoup de mal à être sauvé
  rationale: «Se repentir» rend le sens religieux de μετανοέω, tandis que le passif «être sauvé» conserve la formulation théologique et son ambiguïté quant à l’agent.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de «demandent» est conservée pour refléter l’insistance du grec. Aucun marqueur de note n’est nécessaire.
