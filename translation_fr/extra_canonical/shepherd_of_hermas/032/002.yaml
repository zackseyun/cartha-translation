base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/002.yaml
  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: fr
  text: Mais si un accès d’emportement survient, aussitôt l’Esprit saint, qui est délicat, se trouve à l’étroit, faute d’avoir un lieu pur, et cherche à quitter ce lieu. En effet, étouffé par l’esprit mauvais et souillé par l’emportement, il n’a pas de place pour servir le Seigneur comme il le désire. Car le Seigneur habite dans la patience, mais le diable dans l’emportement. Ainsi, lorsque les deux esprits habitent ensemble, cela est nuisible et mauvais pour la personne en qui ils habitent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: emportement
  rationale: Le terme désigne une colère prompte, une irritabilité qui éclate rapidement. « Emportement » rend naturellement cette disposition et ses manifestations sans la réduire à une simple mauvaise humeur.
- source_word: μακροθυμία
  choice: patience
  rationale: Dans ce contraste avec l’emportement, le mot évoque la maîtrise durable de la colère et la longanimité. « Patience » est clair en français moderne, tandis que « longanimité » serait moins accessible.
- source_word: τρυφερόν
  choice: délicat
  rationale: Le grec présente l’Esprit comme tendre, sensible et peu compatible avec la rudesse. « Délicat » conserve cette image inhabituelle sans suggérer la faiblesse.
- source_word: στενοχωρεῖται
  choice: se trouve à l’étroit
  rationale: Cette formulation garde la métaphore spatiale, reprise ensuite par l’absence de place pour servir le Seigneur.
- source_word: λειτουργῆσαι
  choice: servir
  rationale: Le verbe peut désigner l’accomplissement d’un service, notamment religieux. « Servir le Seigneur » est idiomatique et ne surspécifie pas la nature de ce service.
- source_word: ἀσύμφορον … καὶ πονηρόν
  choice: nuisible et mauvais
  rationale: Le doublet grec exprime à la fois ce qui n’est pas avantageux et ce qui est mauvais ou dommageable; la traduction maintient les deux qualificatifs.
theological_decisions:
- issue: Identification de τὸ πνεῦμα τὸ ἅγιον
  choice: « l’Esprit saint », avec majuscule à Esprit
  alternative: « l’esprit saint » ou « le saint esprit » comme esprit humain rendu saint
  rationale: L’expression définie, son habitation dans la personne et son service au Seigneur favorisent ici la référence à l’Esprit saint. Le contexte conserve néanmoins la tension propre au texte, qui parle aussi d’un « esprit mauvais » et des deux esprits habitant ensemble.
- issue: Langage du retrait de l’Esprit
  choice: Conserver littéralement « cherche à quitter cet endroit »
  alternative: Atténuer en parlant seulement de tristesse ou d’entrave
  rationale: Le grec décrit explicitement une recherche de départ. La traduction ne résout pas les questions doctrinales que cette formulation peut soulever et garde l’affirmation propre à l’auteur.
- issue: Habitation du Seigneur et du diable dans des dispositions
  choice: Conserver le parallélisme direct
  alternative: Paraphraser comme simple influence morale
  rationale: Le texte affirme que le Seigneur habite dans la patience et le diable dans l’emportement. Maintenir cette personnification préserve sa force et son ambiguïté théologique.
translation_notes:
  register: Français international actuel, digne et accessible. Les images concrètes d’espace, d’étouffement et d’habitation sont conservées. Le rythme reste exhortatif, avec un vocabulaire non confessionnel.
