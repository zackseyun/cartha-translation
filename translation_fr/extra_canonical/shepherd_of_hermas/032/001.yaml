base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/001.yaml
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: fr
  text: '« Sois patient, dit-il, et avisé : tu domineras toutes les œuvres mauvaises et tu pratiqueras toute justice. En effet, si tu es patient, l’esprit saint qui habite en toi sera pur, sans être obscurci par un autre esprit mauvais. Au contraire, habitant dans un espace vaste, il exultera et se réjouira avec le vase dans lequel il habite ; il servira Dieu avec une grande joie, ayant en lui-même l’abondance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακρόθυμος / μακρόθυμος ἔσῃ
  choice: fais preuve de patience / si tu fais preuve de patience
  rationale: Rend la patience durable et la maîtrise de soi impliquées par μακροθυμία, dans un français naturel, sans réduire le terme à la simple attente.
- source_word: συνετός
  choice: avisé
  rationale: Exprime le discernement pratique et le bon sens du grec dans un registre digne et courant.
- source_word: κατακυριεύσεις
  choice: tu domineras
  rationale: Conserve l’idée forte de prendre le dessus et d’exercer sa maîtrise sur les œuvres mauvaises.
- source_word: ἐργάσῃ πᾶσαν δικαιοσύνην
  choice: tu pratiqueras toute forme de justice
  rationale: Le grec parle de mettre en œuvre toute justice ; cette formulation idiomatique évite l’étrange littéralisme « travailler toute justice ».
- source_word: ἐν εὐρυχώρῳ
  choice: dans un vaste espace
  rationale: Préserve l’image spatiale du lieu ample, opposé à l’étouffement décrit dans la suite du passage.
- source_word: σκεύους
  choice: vase
  rationale: Maintient la métaphore corporelle du récipient habité par l’esprit, importante pour l’argument qui suit.
- source_word: εὐθηνίαν
  choice: la prospérité
  rationale: Reproduit le sens d’abondance et de plein épanouissement sans préciser davantage une expression grecque inhabituelle dans ce contexte.
theological_decisions:
- issue: Identification de τὸ πνεῦμα τὸ ἅγιον
  choice: l’esprit saint
  alternative: l’Esprit Saint
  rationale: La minuscule préserve l’ambiguïté du passage entre une référence explicite à l’Esprit Saint et la description d’un esprit saint ou juste habitant l’être humain ; le contexte ultérieur emploie aussi « l’esprit du juste ».
- issue: Pureté de l’esprit et patience humaine
  choice: restera pur
  alternative: sera pur
  rationale: '« Restera » explicite légèrement la valeur contextuelle : la patience empêche l’obscurcissement par l’esprit mauvais. La formulation ne tranche pas les questions doctrinales sur la présence ou le retrait de l’esprit.'
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « fais preuve de patience » conserve le terme directeur du grec. Les images du vaste espace et du vase sont maintenues afin de préparer l’opposition développée dans la suite.
