revisions:
- from: '« Fais preuve de patience, dit-il, et sois avisé : tu domineras ainsi toutes les œuvres mauvaises et tu pratiqueras toute forme de justice. En effet, si tu fais preuve de patience, l’esprit saint qui habite en toi restera pur, sans être obscurci par un autre esprit mauvais. Au contraire, habitant dans un vaste espace, il exultera et se réjouira avec le vase dans lequel il demeure ; il servira Dieu avec une grande joie, portant en lui-même la prospérité. »'
  to: '« Sois patient, dit-il, et avisé : tu domineras toutes les œuvres mauvaises et tu pratiqueras toute justice. En effet, si tu es patient, l’esprit saint qui habite en toi sera pur, sans être obscurci par un autre esprit mauvais. Au contraire, habitant dans un espace vaste, il exultera et se réjouira avec le vase dans lequel il habite ; il servira Dieu avec une grande joie, ayant en lui-même l’abondance. »'
  rationale: La révision supprime l'aspect ajouté par « restera », rend εὐθηνία par « abondance » dans un sens non matérialisant, et effectue de légers ajustements de fluidité. Elle conserve la formulation non confessionnelle « l’esprit saint », l'image du vase et l'opposition spatiale voulue par le grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:49Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu et les images du vaste espace et du vase sont conservées. Toutefois, « restera pur » ajoute une nuance de continuité absente du futur grec ἔσται (« sera pur »). « Prospérité » est trop étroit et risque d'évoquer la réussite matérielle ; εὐθηνία désigne ici plutôt l'abondance ou le bien-être intérieur.
  naturalness: Le français est clair et de registre approprié. « Dans un espace vaste » est légèrement plus naturel que « dans un vaste espace », et « ayant en lui-même l'abondance » rend plus directement la construction grecque sans alourdir la phrase.
  terminology: « patience », « avisé », « domineras », « justice » et « vase » conviennent. La minuscule à « esprit saint » préserve prudemment l'ambiguïté de l'emploi dans ce passage, sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Ajout aspectuel dans « restera pur »
    rationale: Le grec τὸ ... πνεῦμα ... καθαρὸν ἔσται signifie littéralement « sera pur ». « Restera » explicite une persistance que le texte ne formule pas.
  - severity: low
    issue: « Prospérité » pour εὐθηνία
    rationale: Dans ce contexte, le terme renvoie à une condition d'abondance, de plénitude ou de bien-être. « Prospérité » peut indûment suggérer une réussite économique ou extérieure.
