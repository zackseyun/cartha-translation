base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/006.yaml
  text: For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with harshness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded from his good understanding. Thus it happens to all who are quick-tempered.
translation:
  language: fr
  text: 'Car lorsque tous ces esprits habitent dans un même récipient, où habite aussi l’esprit saint, ce récipient ne peut les contenir : il déborde. Alors, l’esprit délicat, qui n’a pas l’habitude d’habiter avec un esprit mauvais ni avec la dureté, se retire d’une telle personne et cherche à habiter avec la douceur et la tranquillité. Puis, lorsqu’il s’est éloigné de la personne en qui il habitait, celle-ci se retrouve privée de l’esprit juste. Désormais remplie d’esprits mauvais, elle devient instable dans tout ce qu’elle fait : ballottée çà et là par ces esprits, elle perd complètement la faculté de bien comprendre. Voilà donc ce qui arrive à tous ceux qui s’emportent facilement.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγεῖον
  choice: récipient
  rationale: Conserve l’image concrète d’un contenant humain sans imposer le sens plus spécialisé de « vase » en français moderne.
- source_word: τρυφερὸν πνεῦμα
  choice: l’esprit délicat
  rationale: « Délicat » exprime ici la sensibilité et l’incompatibilité avec la dureté, sans suggérer la faiblesse.
- source_word: πραΰτης καὶ ἡσυχία
  choice: la douceur et la tranquillité
  rationale: 'Rend les deux qualités distinctes : absence de rudesse et état paisible.'
- source_word: ἀκαταστατεῖ
  choice: devient instable
  rationale: Traduit directement l’idée de désordre et d’inconstance dans la conduite.
- source_word: ὀξύχολοι
  choice: ceux qui s’emportent facilement
  rationale: Expression française naturelle pour les personnes promptes à la colère, plutôt que le terme moins courant « irascibles ».
theological_decisions:
- issue: Identification de τὸ πνεῦμα τὸ ἅγιον
  choice: « l’esprit saint » en minuscules
  alternative: « l’Esprit Saint »
  rationale: Le texte parle bien d’un esprit saint, mais son enchaînement avec plusieurs autres « esprits » et avec « l’esprit juste » maintient une certaine fluidité conceptuelle. Les minuscules préservent cette tension sans nier une possible référence à l’Esprit Saint.
- issue: Sens de τοῦ πνεύματος τοῦ δικαίου
  choice: « l’esprit juste »
  alternative: « l’esprit de justice » ou « l’Esprit du Juste »
  rationale: Le génitif articulé τοῦ δικαίου qualifie naturellement l’esprit comme juste. Cette formulation maintient le lien avec l’esprit saint déjà mentionné sans les identifier explicitement au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du récipient et du débordement est conservée, tandis que les longues périodes grecques sont légèrement articulées pour une lecture naturelle.
