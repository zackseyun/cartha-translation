base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: fr
  text: 'En effet, si tu prends un peu d’absinthe et que tu la verses dans un pot de miel, tout le miel n’est-il pas gâché ? Une quantité infime d’absinthe suffit à ruiner tant de miel : elle en détruit la douceur, et le miel n’est plus aussi apprécié de son maître, parce qu’il est devenu amer et a perdu son utilité. Mais si l’on ne met pas d’absinthe dans le miel, celui-ci demeure doux et devient utile à son maître.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀψίνθιον
  choice: absinthe
  rationale: Désigne ici la plante proverbiale pour son amertume, et non la boisson alcoolisée ; le contexte rend ce sens clair.
- source_word: κεράμιον
  choice: pot
  rationale: Terme courant et naturel pour un récipient, probablement en terre cuite, contenant du miel.
- source_word: ἀφανίζεται / ἀπόλλυται
  choice: est gâché / ruiner
  rationale: Dans l’image, le miel n’est pas anéanti matériellement, mais rendu impropre à l’usage par l’amertume.
- source_word: χάριν ἔχει παρὰ τῷ δεσπότῃ
  choice: est apprécié de son maître
  rationale: Rend l’idée de faveur ou d’agrément auprès du propriétaire sans la confondre avec la seule utilité, exprimée ensuite par χρῆσις et εὔχρηστος.
- source_word: δεσπότης
  choice: maître
  rationale: Conserve le vocabulaire de possession et de service de la métaphore, ainsi que son possible prolongement théologique.
- source_word: εὔχρηστος
  choice: utile
  rationale: Exprime directement l’aptitude du miel à servir à l’usage de son maître.
theological_decisions:
- issue: Portée du mot « maître » dans la comparaison
  choice: Conserver « son maître » sans majuscule explicative
  alternative: Traduire ou interpréter directement par « le Seigneur »
  rationale: Le référent immédiat est le propriétaire du miel dans la comparaison ; l’application au Seigneur ressort du contexte plus large, mais ne doit pas être imposée dans cette phrase.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement est conservé au début, conformément à l’adresse directe du passage grec ; la dernière phrase emploie une tournure générale naturelle. La répétition de « miel » et d’« absinthe » est maintenue pour préserver la force didactique de l’image.
