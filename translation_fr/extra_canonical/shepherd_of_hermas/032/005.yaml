revisions:
- from: La promptitude à se mettre en colère est d’abord insensée, légère et déraisonnable. Puis, de la déraison naît l’amertume ; de l’amertume, l’emportement ; de l’emportement, la colère ; et de la colère, la fureur. Alors la fureur, formée de tant de maux, devient un péché grave et incurable.
  to: La tendance à s’emporter est d’abord sotte, frivole et insensée. Puis, de l’absence de raison naît l’amertume ; de l’amertume, l’emportement ; de l’emportement, la colère ; et de la colère, la fureur. Alors la fureur, formée de tant de maux, devient un grand péché, incurable.
  rationale: Révision limitée visant une expression plus idiomatique de ὀξυχολία et une restitution plus précise de ἐλαφρά et μεγάλη, tout en maintenant la structure cumulative et le registre sentencieux de l’original.
