base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: fr
  text: La tendance à s’emporter est d’abord sotte, frivole et insensée. Puis, de l’absence de raison naît l’amertume ; de l’amertume, l’emportement ; de l’emportement, la colère ; et de la colère, la fureur. Alors la fureur, formée de tant de maux, devient un grand péché, incurable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: la promptitude à se mettre en colère
  rationale: Cette expression courante rend l’idée d’un tempérament prompt à l’irritation sans recourir au terme plus technique « irascibilité ».
- source_word: μωρά, ἐλαφρά τε καὶ ἄφρων
  choice: insensée, légère et déraisonnable
  rationale: La série conserve les trois qualificatifs grecs et leur effet cumulatif ; « légère » évoque ici le manque de sérieux et de stabilité.
- source_word: θυμός · ὀργή · μῆνις
  choice: emportement ; colère ; fureur
  rationale: Cette gradation française distingue les trois termes successifs tout en préservant l’intensification rhétorique du grec.
- source_word: ἀνίατος
  choice: incurable
  rationale: Traduction directe qui maintient la force de l’image morale employée par le texte.
theological_decisions:
- issue: La progression des dispositions jusqu’au péché
  choice: Conserver la chaîne causale formulée par le texte
  alternative: L’atténuer en parlant seulement de conséquences possibles
  rationale: Les répétitions ἐκ… γίνεται présentent explicitement une progression de l’une à l’autre ; la traduction ne doit ni l’affaiblir ni ajouter une explication doctrinale.
translation_notes:
  register: Français moderne, clair et digne. La répétition « de… naît / de… » est maintenue afin de reproduire la progression sentencieuse et pédagogique de l’original.
