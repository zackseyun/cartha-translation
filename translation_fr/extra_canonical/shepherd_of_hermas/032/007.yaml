base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: fr
  text: Tiens-toi donc loin de l’emportement, cet esprit des plus mauvais. Revêts-toi plutôt de patience, résiste à l’emportement et à l’amertume, et tu seras trouvé avec la dignité que le Seigneur aime. Veille donc à ne jamais négliger ce commandement. En effet, si tu parviens à te rendre maître de ce commandement, tu pourras aussi garder les autres commandements que je vais te donner. Sois fort dans ces commandements et fortifie-toi, et que tous ceux qui désirent marcher selon eux se fortifient aussi. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: emportement
  rationale: Le terme désigne une colère prompte et irritable. « Emportement » exprime naturellement en français cette réaction vive sans la réduire à un simple trait de caractère.
- source_word: μακροθυμία
  choice: patience
  rationale: Dans ce contraste avec l’emportement, le mot évoque la maîtrise durable de la colère et la capacité de supporter longtemps. « Patience » est clair et idiomatique, tout en conservant cette portée.
- source_word: σεμνότης
  choice: dignité
  rationale: Le nom exprime une qualité moralement noble, grave et honorable. « Dignité » rend le sens sans introduire une vertu confessionnelle particulière.
- source_word: κυριεύσῃς
  choice: tu parviens à le maîtriser
  rationale: Le verbe signifie devenir maître de quelque chose ou exercer sur lui sa domination. La formulation française conserve l’image de la maîtrise du commandement.
- source_word: πορεύεσθαι
  choice: marcher selon eux
  rationale: L’image de la marche désigne ici la conduite conforme aux commandements. Elle est conservée, avec « selon eux » pour rendre l’expression compréhensible.
- source_word: ἰσχυροῦ … ἐνδυναμοῦ
  choice: Fortifie-toi … et prends courage
  rationale: Les deux impératifs proches sont distingués en français afin de préserver leur redoublement exhortatif sans produire une répétition maladroite.
theological_decisions:
- issue: Personnification de l’emportement comme esprit mauvais
  choice: « cet esprit si mauvais »
  alternative: « ce travers si mauvais »
  rationale: Le grec appelle explicitement l’emportement un πνεῦμα. La traduction conserve cette formulation et sa tension avec le langage des esprits dans le contexte.
- issue: Relation entre la personne et la dignité aimée du Seigneur
  choice: « tu te trouveras uni à la dignité »
  alternative: « tu seras trouvé dans la dignité »
  rationale: Le grec μετὰ τῆς σεμνότητος signifie littéralement « avec la dignité ». « Uni à » conserve cette association personnifiée tout en restant naturel en français.
- issue: Maîtriser un commandement
  choice: conserver l’objet « commandement »
  alternative: interpréter comme « observer parfaitement ce commandement »
  rationale: L’expression grecque est inhabituelle mais intentionnelle. La traduction n’efface pas l’image en la remplaçant par une interprétation plus explicite.
translation_notes:
  register: Français moderne, accessible et digne, avec tutoiement singulier conforme aux impératifs grecs adressés à Hermas. Les métaphores du vêtement, de la maîtrise et de la marche sont conservées. La conclusion passe au pluriel universel comme dans le grec.
