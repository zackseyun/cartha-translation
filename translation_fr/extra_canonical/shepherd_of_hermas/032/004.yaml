base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/004.yaml
  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: fr
  text: 'Tu vois donc que la patience est plus douce que le miel et utile au Seigneur, et que le Seigneur demeure en elle. Mais l’emportement est amer et inutile. Si donc l’emportement se mêle à la patience, celle-ci est souillée et n’est plus utile à Dieu. En tout temps, la patience ne renferme aucune amertume : elle demeure toujours douce et paisible. Cette patience habite donc chez ceux dont la foi est entière.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακροθυμία
  choice: patience
  rationale: Dans ce contraste avec l’emportement, le mot désigne la maîtrise patiente qui tarde à se mettre en colère. « Patience » est naturel en français moderne et le contexte en précise le sens.
- source_word: ὀξυχολία
  choice: emportement
  rationale: Le terme évoque une irritabilité prompte et colérique. « Emportement » rend cette montée rapide de colère sans employer une expression pesante.
- source_word: εὔχρηστος / ἄχρηστος
  choice: utile / inutile
  rationale: Le contraste porte sur ce qui peut ou non servir au Seigneur; ce couple simple conserve directement l’image fonctionnelle du grec.
- source_word: πραεῖα καὶ ἡσύχιος
  choice: douce et paisible
  rationale: « Douce » exprime la maîtrise sans dureté de πραεῖα, tandis que « paisible » rend l’absence d’agitation exprimée par ἡσύχιος.
- source_word: τὴν πίστιν … ὁλόκληρον
  choice: dont la foi est entière
  rationale: Cette formulation conserve l’idée d’intégrité ou de plénitude sans préciser de façon indue s’il s’agit d’une foi parfaite, intacte ou pleinement formée.
theological_decisions:
- issue: Sujet implicite de « demeure en elle »
  choice: Répéter « le Seigneur »
  alternative: Employer simplement « il demeure en elle »
  rationale: Le contexte grec nomme explicitement le Seigneur juste avant. La répétition française lève une ambiguïté pronominale sans modifier l’affirmation théologique.
- issue: Relation entre patience et foi entière
  choice: « habite donc chez ceux dont la foi est entière »
  alternative: « se trouve chez ceux qui possèdent pleinement la foi »
  rationale: Le choix garde la métaphore d’habitation du grec et préserve l’expression dense « foi entière » sans en imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases restent proches de la progression argumentative et des images du grec, tout en évitant les archaïsmes tels que « longanimité » et « irascibilité ».
