base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: fr
  text: '« Fais-moi savoir, Seigneur, dis-je, de quoi il faut s’abstenir et de quoi il ne faut pas s’abstenir. »


    « Écoute, dit-il : abstiens-toi du mal et ne le fais pas ; mais ne t’abstiens pas du bien : fais-le. Car si tu t’abstiens de faire le bien, tu commets un grand péché ; mais si tu t’abstiens de faire le mal, tu accomplis une grande justice. Abstiens-toi donc de tout mal, en faisant le bien. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: se maîtriser / se retenir
  rationale: Le grec désigne la maîtrise de soi ou l’abstention. La variation française évite une tournure artificielle tout en conservant le jeu paradoxal entre s’abstenir du mal et ne pas s’abstenir du bien.
- source_word: τὸ πονηρόν / πονηρίας πάσης
  choice: le mal / toute forme de mal
  rationale: Ces expressions ont ici une portée morale générale. « Toute forme de mal » restitue naturellement l’idée distributive de πάσης sans limiter le propos à des actes précis.
- source_word: τὸ ἀγαθόν
  choice: le bien
  rationale: Le substantif abstrait français correspond directement à la catégorie morale générale du grec.
- source_word: ἁμαρτίαν μεγάλην ἐργάζῃ
  choice: tu commets un grand péché
  rationale: « Commettre un péché » est l’expression française naturelle pour le grec littéralement « produire/accomplir un grand péché ».
- source_word: δικαιοσύνην μεγάλην ἐργάζῃ
  choice: tu accomplis une grande œuvre de justice
  rationale: Cette formulation conserve le verbe d’action ἐργάζῃ et la notion positive de δικαιοσύνη, sans réduire celle-ci à la seule rectitude personnelle.
theological_decisions:
- issue: Sens de δικαιοσύνην μεγάλην
  choice: une grande œuvre de justice
  alternative: une grande justice
  rationale: Le contexte oppose deux conduites et leurs résultats. La formulation retenue préserve l’idée d’une justice effectivement mise en œuvre, sans introduire une doctrine particulière de mérite ou de justification.
- issue: Portée de κύριε
  choice: Seigneur
  alternative: maître
  rationale: Dans le dialogue, κύριε est une adresse respectueuse au personnage qui instruit Hermas. « Seigneur » maintient la formulation traditionnelle et l’ambiguïté du titre sans identifier davantage le locuteur.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme du grec est conservé, mais les répétitions de ἐγκρατεύεσθαι sont modulées entre « se maîtriser » et « se retenir » afin que le paradoxe reste compréhensible en français courant.
