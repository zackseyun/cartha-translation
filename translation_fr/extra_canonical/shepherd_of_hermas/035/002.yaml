revisions:
- from: '« Fais-moi savoir, Seigneur, dis-je, dans quels domaines il faut se maîtriser et dans quels domaines il ne le faut pas. »


    « Écoute, dit-il. Maîtrise-toi face au mal et ne le fais pas ; mais ne te retiens pas de faire le bien : fais-le. Car si tu te retiens de faire le bien, tu commets un grand péché ; mais si tu te maîtrises pour ne pas faire le mal, tu accomplis une grande œuvre de justice. Maîtrise-toi donc loin de toute forme de mal, tout en faisant le bien. »'
  to: '« Fais-moi savoir, Seigneur, dis-je, de quoi il faut s’abstenir et de quoi il ne faut pas s’abstenir. »


    « Écoute, dit-il : abstiens-toi du mal et ne le fais pas ; mais ne t’abstiens pas du bien : fais-le. Car si tu t’abstiens de faire le bien, tu commets un grand péché ; mais si tu t’abstiens de faire le mal, tu accomplis une grande justice. Abstiens-toi donc de tout mal, en faisant le bien. »'
  rationale: 'La révision conserve l’ambiguïté morale générale de τὸ πονηρόν et τὸ ἀγαθόν, tout en reproduisant de façon cohérente la répétition paradoxale de ἐγκρατεύεσθαι : s’abstenir du mal, mais non du bien. Elle corrige une tournure française non idiomatique et évite l’ajout interprétatif de « œuvre » devant « justice ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:16Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens central et le parallélisme de ἐγκρατεύεσθαι sont bien rendus. Toutefois, « loin de toute forme de mal » ne correspond pas naturellement à ἐγκράτευσαι ἀπὸ πονηρίας πάσης, qui appelle l’idée de s’abstenir de tout mal. « Face au mal » affaiblit également le lien direct entre la maîtrise de soi et l’abstention.
  naturalness: Le texte est globalement clair et de registre approprié. « Maîtrise-toi donc loin de… » est toutefois une construction peu idiomatique en français moderne. Employer systématiquement « s’abstenir de » rend le paradoxe grec intelligible et fluide.
  terminology: « Seigneur », « le mal », « le bien » et « grand péché » conviennent. « Une grande œuvre de justice » est interprétatif par l’ajout de « œuvre » ; « une grande justice » conserve plus directement le substantif δικαιοσύνη et le verbe d’action est déjà exprimé par « accomplir ».
  issues:
  - severity: medium
    issue: Tournure finale « Maîtrise-toi donc loin de toute forme de mal »
    rationale: Cette formulation est peu naturelle et ne rend pas explicitement l’abstention marquée par ἀπό. « Abstiens-toi donc de tout mal » est plus fidèle et idiomatique.
  - severity: low
    issue: Variation « se maîtriser / se retenir »
    rationale: La modulation est défendable, mais elle atténue le jeu rhétorique répété sur ἐγκρατεύεσθαι. Une même expression française permet de conserver plus nettement l’opposition entre s’abstenir du mal et ne pas s’abstenir du bien.
  - severity: low
    issue: « une grande œuvre de justice »
    rationale: Le nom « œuvre » n’est pas exprimé dans le grec. Le verbe « accomplir » rend déjà ἐργάζῃ ; « une grande justice » reste plus proche du texte.
  revised_text: '« Fais-moi savoir, Seigneur, dis-je, de quoi il faut s’abstenir et de quoi il ne faut pas s’abstenir. »


    « Écoute, dit-il : abstiens-toi du mal et ne le fais pas ; mais ne t’abstiens pas du bien : fais-le. Car si tu t’abstiens de faire le bien, tu commets un grand péché ; mais si tu t’abstiens de faire le mal, tu accomplis une grande justice. Abstiens-toi donc de tout mal, en faisant le bien. »'
