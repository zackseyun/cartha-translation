  to: « Ces choses te paraissent-elles bonnes ? » dit-il. « Qu’y a-t-il de meilleur que cela, Seigneur ? » dis-je. « Marche donc selon elles, ne t’en abstiens pas, et tu vivras pour Dieu. »
