  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/011.yaml
  text: “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.
translation:
  language: fr
  text: « Ces choses te paraissent-elles bonnes ? » dit-il. « Qu’y a-t-il de meilleur que cela, Seigneur ? » dis-je. « Marche donc selon elles, ne t’en abstiens pas, et tu vivras pour Dieu. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύου ἐν αὐτοῖς
  choice: marche dans cette voie
  rationale: L’expression grecque signifie littéralement « marche en elles », c’est-à-dire conduis ta vie selon les bonnes œuvres qui viennent d’être énumérées. « Dans cette voie » restitue naturellement cette image en français.
- source_word: μὴ ἐγκρατεύου ἀπ᾿ αὐτῶν
  choice: ne t’en abstiens pas
  rationale: 'Dans ce mandat, ἐγκρατεύεσθαι ἀπό signifie se retenir de quelque chose ou s’en abstenir. La traduction conserve le paradoxe voulu : la maîtrise de soi convient face au mal, mais non face au bien.'
- source_word: ζήσῃ τῷ θεῷ
  choice: tu vivras pour Dieu
  rationale: Le datif τῷ θεῷ exprime ici une vie orientée vers Dieu et vécue à son service. « Pour Dieu » reste concis et préserve cette portée.
theological_decisions:
- issue: Portée de « vivre pour Dieu »
  choice: tu vivras pour Dieu
  alternative: tu vivras en Dieu
  rationale: Le grec emploie le datif sans préposition. « Pour Dieu » exprime plus directement l’orientation de la vie vers Dieu, sans introduire explicitement l’idée d’union mystique que pourrait suggérer « en Dieu ».
translation_notes:
  register: Dialogue rendu dans un français moderne, simple et digne. L’enchaînement interrogatif est conservé, ainsi que l’image biblique de la marche comme manière de vivre.
