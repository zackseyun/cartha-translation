base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the servants of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: fr
  text: '« Écoute maintenant ce qui suit : servir les veuves ; visiter les orphelins et les personnes dans le besoin ; libérer les serviteurs de Dieu de leurs détresses ; pratiquer l’hospitalité (car dans l’hospitalité, on trouve parfois l’occasion de faire le bien) ; ne s’opposer à personne ; être paisible ; se faire plus petit que tous ; respecter les personnes âgées ; pratiquer la justice ; préserver la fraternité ; supporter les outrages ; être patient ; ne garder aucune rancune ; réconforter ceux qui sont abattus dans leur âme ; ne pas rejeter ceux qui ont trébuché loin de la foi, mais les ramener et leur rendre courage ; avertir ceux qui pèchent ; ne pas accabler les débiteurs ni les personnes dans le besoin ; et s’il y a quelque chose de semblable à cela. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπηρετεῖν
  choice: servir
  rationale: Rend directement l’idée de service concret envers les veuves.
- source_word: ἐπισκέπτεσθαι
  choice: prendre soin de
  rationale: Dans ce contexte éthique, le verbe ne désigne pas une simple visite, mais une attention active envers les personnes vulnérables.
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  choice: délivrer de leurs détresses
  rationale: Conserve l’image d’une libération sans préciser indûment s’il s’agit de rachat financier, de dettes ou d’autres situations contraignantes.
- source_word: φιλόξενον εἶναι
  choice: pratiquer l’hospitalité
  rationale: Expression française naturelle qui communique une disposition durable et sa mise en pratique.
- source_word: ἡσύχιον εἶναι
  choice: vivre paisiblement
  rationale: Exprime une conduite calme et non conflictuelle plutôt qu’un simple silence.
- source_word: ἐνδεέστερον γίνεσθαι πάντων ἀνθρώπων
  choice: se faire plus humble que tous
  rationale: Le comparatif peut littéralement évoquer le fait de devenir plus démuni ou inférieur; dans la série d’exhortations, l’humilité est le sens contextuel le plus intelligible, sans suggérer qu’il faudrait rechercher la misère matérielle.
- source_word: ἀδελφότητα συντηρεῖν
  choice: préserver la fraternité
  rationale: Garde l’ambiguïté entre le lien fraternel et la communauté des frères et sœurs.
- source_word: μακρόθυμον εἶναι
  choice: être patient
  rationale: Rend la patience durable envers autrui dans un français moderne et clair.
- source_word: κάμνοντας τῇ ψυχῇ
  choice: ceux dont l’âme est abattue
  rationale: Conserve la dimension intérieure de l’expression grecque, qui évoque des personnes épuisées ou découragées intérieurement.
- source_word: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: ceux qui se sont détournés de la foi
  rationale: Traduit l’éloignement causé par une chute ou un achoppement sans imposer une théorie précise de l’apostasie.
- source_word: εὐθύμους ποιεῖν
  choice: leur rendre courage
  rationale: Expression idiomatique française correspondant au rétablissement de la bonne disposition et de la confiance.
- source_word: θλίβειν
  choice: accabler
  rationale: Couvre l’idée de pression, d’oppression ou de harcèlement exercé sur les débiteurs et les nécessiteux.
theological_decisions:
- issue: Nature de ceux qui se sont éloignés de la foi
  choice: « ceux qui se sont détournés de la foi »
  alternative: « ceux que la foi a fait trébucher » ou « ceux qui ont trébuché loin de la foi »
  rationale: La formulation retenue conserve le mouvement d’éloignement indiqué par ἀπό et l’appel à les ramener, sans décider de leur statut spirituel ultime.
- issue: Sens de la délivrance des serviteurs de Dieu
  choice: « délivrer de leurs détresses »
  alternative: « racheter de la nécessité » ou « libérer de leurs contraintes »
  rationale: Le texte ne précise ni le mécanisme ni le type exact de détresse; la traduction évite d’en faire exclusivement un rachat d’esclaves ou de dettes.
- issue: Portée de ἀδελφότητα
  choice: « la fraternité »
  alternative: « la communauté des frères et sœurs »
  rationale: Le nom peut désigner tant le lien fraternel que le corps communautaire. « Fraternité » maintient cette amplitude sans introduire une structure ecclésiale précise.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en série de l’original est conservée par des points-virgules. Les formulations archaïques et le vocabulaire confessionnel marqué sont évités; aucune note n’est nécessaire pour cette unité.
