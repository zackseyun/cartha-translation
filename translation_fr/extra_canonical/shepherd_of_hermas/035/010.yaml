revisions:
- from: '« Écoute maintenant ce qui vient à la suite : servir les veuves ; prendre soin des orphelins et de ceux qui sont dans le besoin ; délivrer de leurs détresses les serviteurs de Dieu ; pratiquer l’hospitalité (car l’hospitalité offre parfois l’occasion de faire le bien) ; ne s’opposer à personne ; vivre paisiblement ; se faire plus humble que tous ; respecter les personnes âgées ; pratiquer la justice ; préserver la fraternité ; supporter les outrages ; être patient ; ne garder aucune rancune ; réconforter ceux dont l’âme est abattue ; ne pas rejeter ceux qui se sont détournés de la foi, mais les ramener et leur rendre courage ; avertir ceux qui pèchent ; ne pas accabler les débiteurs ni les personnes dans le besoin ; et accomplir tout ce qui est semblable à cela. »'
  to: '« Écoute maintenant ce qui suit : servir les veuves ; visiter les orphelins et les personnes dans le besoin ; libérer les serviteurs de Dieu de leurs détresses ; pratiquer l’hospitalité (car dans l’hospitalité, on trouve parfois l’occasion de faire le bien) ; ne s’opposer à personne ; être paisible ; se faire plus petit que tous ; respecter les personnes âgées ; pratiquer la justice ; préserver la fraternité ; supporter les outrages ; être patient ; ne garder aucune rancune ; réconforter ceux qui sont abattus dans leur âme ; ne pas rejeter ceux qui ont trébuché loin de la foi, mais les ramener et leur rendre courage ; avertir ceux qui pèchent ; ne pas accabler les débiteurs ni les personnes dans le besoin ; et s’il y a quelque chose de semblable à cela. »'
  rationale: La révision restitue plus exactement la portée non exhaustive de la dernière proposition, évite de présenter l’éloignement de la foi comme nécessairement volontaire et conserve plus directement la notion de visite. Elle maintient la liste paratactique, le registre accessible et les ambiguïtés du texte grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:19Z'
review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour deux points. La finale grecque (« et s’il y a quelque chose de semblable à cela ») ajoute une catégorie ouverte et ne commande pas d’« accomplir tout » ce qui est semblable. De plus, « ceux qui se sont détournés de la foi » rend le participe passif ἐσκανδαλισμένους trop volontairement et catégoriquement; une formulation qui évoque l’ébranlement ou la chute préserve mieux le grec.
  naturalness: Le français est généralement fluide, clair et adapté à un registre moral sobre. « Se faire plus petit que tous » est plus naturel que « se faire plus humble que tous » tout en conservant l’idée comparative de condition moindre. « Visiter » reste naturel dans cette liste et reproduit directement ἐπισκέπτεσθαι, sans exclure une attention concrète.
  terminology: « Servir », « hospitalité », « justice », « fraternité », « patience » et « rancune » sont appropriés. « Libérer les serviteurs de Dieu de leurs détresses » conserve l’idée de délivrance de λυτροῦσθαι sans déterminer le type de contrainte. « Ceux qui ont trébuché loin de la foi » garde l’image de scandale/chute et le mouvement d’éloignement, sans trancher quant à une apostasie définitive.
  issues:
  - severity: medium
    issue: La clausule finale est transformée en impératif exhaustif.
    rationale: καὶ εἴ τινα τούτοις ὅμοιά ἐστι signifie littéralement « et s’il y a quelque chose de semblable à cela ». « Et accomplir tout ce qui est semblable à cela » introduit à la fois un verbe injonctif et « tout », absents du grec.
  - severity: low
    issue: La formulation sur les personnes éloignées de la foi est trop interprétative.
    rationale: ἐσκανδαλισμένους est un participe passif qui évoque des personnes scandalisées, ébranlées ou ayant trébuché. « Se sont détournés » peut suggérer une décision délibérée et ne restitue pas cette voix passive.
  - severity: low
    issue: La visite des personnes vulnérables est explicitée comme prise en charge.
    rationale: ἐπισκέπτεσθαι peut impliquer un soin actif, mais son sens premier de « visiter » convient ici et évite d’élargir légèrement l’énoncé.
