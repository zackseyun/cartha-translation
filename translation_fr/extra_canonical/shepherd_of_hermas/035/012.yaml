base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: fr
  text: 'Garde donc ce commandement : si tu fais le bien et ne t’en abstiens pas, tu vivras pour Dieu, et tous ceux qui agissent ainsi vivront pour Dieu. De même, si tu ne fais pas le mal et que tu t’en abstiennes, tu vivras pour Dieu ; et tous ceux qui garderont ces commandements et marcheront dans ces commandements vivront pour Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: Garde
  rationale: Rend naturellement l’impératif présent avec l’idée d’observer fidèlement le commandement.
- source_word: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ
  choice: t’en abstenir / tu t’en abstiennes
  rationale: Dans ce contexte, ἐγκρατεύομαι ἀπό désigne le fait de se retenir ou de s’abstenir de quelque chose. La répétition française préserve le contraste volontaire entre le bien et le mal.
- source_word: ζήσῃ τῷ θεῷ
  choice: tu vivras pour Dieu
  rationale: Conserve la construction au datif et son orientation vers Dieu sans la réduire à la seule idée d’être sauvé.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: marcheront selon eux
  rationale: Préserve la métaphore biblique de la marche tout en exprimant clairement une conduite conforme aux commandements.
theological_decisions:
- issue: Sens de « vivre pour Dieu »
  choice: Maintien de la formule « vivre pour Dieu »
  alternative: « vivre devant Dieu » ou « avoir la vie auprès de Dieu »
  rationale: Le grec τῷ θεῷ est concis et peut exprimer une vie orientée vers Dieu ou en relation avec lui. La traduction retenue préserve cette tension sans préciser indûment la nature de la vie promise.
- issue: Rapport entre obéissance et vie
  choice: Conserver la condition formulée par le texte
  alternative: Reformuler pour distinguer explicitement mérite, preuve ou conséquence
  rationale: Le passage relie directement l’observation du commandement au fait de vivre pour Dieu. Toute systématisation doctrinale supplémentaire dépasserait le texte source.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement est conservé puisqu’il structure le dialogue et les impératifs du passage. La répétition rhétorique du grec est largement maintenue, avec une ponctuation française fluide.
