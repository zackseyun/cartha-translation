review_pass:
  verdict: revise
  source_fidelity: 'Le sens et la structure conditionnelle du grec sont globalement bien rendus : faire le bien sans s''en abstenir, et ne pas faire le mal en s''en abstenant. « Vivras pour Dieu » maintient de manière acceptable l''ouverture du datif τῷ θεῷ, sans surcharge doctrinale.'
  naturalness: La première coordination, « si tu fais le bien sans t’en abstenir », est compréhensible, mais elle affaiblit légèrement la répétition volontaire de l'injonction grecque et est moins parallèle à la seconde. « Marcheront selon eux » est peu naturel, car le pronom personnel renvoie maladroitement à « commandements ».
  terminology: « Garde ce commandement », « le bien », « le mal », « t'abstenir » et « vivre pour Dieu » conviennent au registre moderne et au vocabulaire du passage. « Marcher dans ces commandements » conserve mieux la métaphore et l'antécédent grec que « marcher selon eux ».
  issues:
  - severity: low
    issue: Parallélisme de la première condition
    rationale: Le grec coordonne explicitement « faire le bien » et « ne pas s'en abstenir ». Employer « et ne t'en abstiens pas » rétablit cette symétrie rhétorique sans modifier le sens.
  - severity: low
    issue: Référent de « eux » dans la dernière proposition
    rationale: En français, « marcheront selon eux » est stylistiquement lourd et son référent est moins immédiat. « marcheront dans ces commandements » reflète directement πορευθῶσιν ἐν αὐταῖς.
  revised_text: 'Garde donc ce commandement : si tu fais le bien et ne t’en abstiens pas, tu vivras pour Dieu, et tous ceux qui agissent ainsi vivront pour Dieu. De même, si tu ne fais pas le mal et que tu t’en abstiennes, tu vivras pour Dieu ; et tous ceux qui garderont ces commandements et marcheront dans ces commandements vivront pour Dieu.'
