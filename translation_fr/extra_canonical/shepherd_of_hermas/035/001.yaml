base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/001.yaml
  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: fr
  text: « Je t’ai dit, dit-il, que les choses créées par Dieu sont de deux sortes ; car la maîtrise de soi aussi est de deux sortes. En effet, il y a des choses dont il faut s’abstenir, et d’autres dont il ne faut pas s’abstenir. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  choice: les réalités créées par Dieu
  rationale: Cette formulation garde le sens large de κτίσματα sans le limiter aux êtres vivants ni suggérer ici deux actes distincts de création.
- source_word: διπλᾶ
  choice: de deux sortes
  rationale: Dans ce contexte, le terme décrit une distinction en deux catégories plutôt qu’une nature « double » au sens matériel.
- source_word: ἡ ἐγκράτεια
  choice: la maîtrise de soi
  rationale: Rend le contrôle volontaire de sa conduite dans un français actuel, tout en conservant la portée morale du terme grec.
- source_word: ἐπί τινων
  choice: dans certains domaines
  rationale: Exprime naturellement la référence à certaines catégories de conduite ou de choses, sans préciser davantage que le grec.
- source_word: δεῖ ἐγκρατεύεσθαι
  choice: il faut se maîtriser
  rationale: Préserve la nécessité morale exprimée par δεῖ et la forme verbale correspondante à ἐγκράτεια.
theological_decisions:
- issue: Portée de l’affirmation selon laquelle les créations de Dieu sont « de deux sortes »
  choice: Conserver l’énoncé général et sa tension, sans expliquer à ce stade la nature des deux catégories.
  alternative: Préciser immédiatement qu’il s’agit du bien et du mal.
  rationale: La suite du discours fournit cette explication ; l’introduire ici anticiperait le texte et pourrait faire croire que le mal est directement créé par Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue et la répétition structurante de « deux sortes » sont conservés ; la syntaxe est légèrement fluidifiée sans résoudre l’ambiguïté du premier énoncé.
