base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/007.yaml
  text: '“But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”'
translation:
  language: fr
  text: '« Quant aux choses dont tu ne dois pas t’abstenir, dit-il, mais que tu dois pratiquer, écoute : ne t’abstiens pas du bien, mais fais-le. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι
  choice: s’abstenir
  rationale: Dans ce contexte, le verbe désigne le fait de se retenir de faire quelque chose. « S’abstenir » rend naturellement en français le contraste entre éviter le mal et ne pas se retenir de faire le bien.
- source_word: ποιεῖν / ποίει
  choice: pratiquer / fais-le
  rationale: Le grec insiste sur la mise en œuvre concrète du bien. « Pratiquer » convient dans la proposition générale, tandis que « fais-le » préserve la force simple de l’impératif.
- source_word: τὸ ἀγαθόν
  choice: le bien
  rationale: Cette formulation conserve la portée morale générale du substantif grec sans en restreindre le sens à de seules bonnes actions particulières.
- source_word: ἄκουε
  choice: écoute
  rationale: L’impératif direct maintient la forme dialoguée et l’appel solennel à l’attention.
theological_decisions:
- issue: Rapport entre maîtrise de soi et accomplissement du bien
  choice: 'Employer « s’abstenir » afin de conserver le paradoxe : il ne faut pas s’abstenir du bien.'
  alternative: Employer partout « exercer la maîtrise de soi » ou « se maîtriser ».
  rationale: En français, « exercer la maîtrise de soi à l’égard du bien » serait obscur et pourrait suggérer qu’il faut modérer le bien. Le contexte grec oppose clairement l’abstention du mal au refus de s’abstenir du bien, sans nier la valeur générale de la maîtrise de soi.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement conserve l’adresse singulière du dialogue. La répétition volontaire de « s’abstenir » et de « bien » reflète la structure pédagogique du grec.
