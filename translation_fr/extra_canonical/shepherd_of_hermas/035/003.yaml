  to: '« Quelles sont, Seigneur, demandai-je, les formes de méchanceté dont nous devons nous abstenir ? — Écoute, répondit-il : de l’adultère et de l’inconduite sexuelle, de l’ivresse sans retenue, du luxe coupable, de l’abondance de nourriture, du luxe lié à la richesse, de la vantardise, de la prétention et de l’orgueil, ainsi que du mensonge, de la médisance, de l’hypocrisie, de la rancune et de toute parole outrageante. »'
