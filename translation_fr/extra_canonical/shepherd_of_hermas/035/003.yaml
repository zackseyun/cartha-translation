  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: fr
  text: '« Quelles sont, Seigneur, demandai-je, les formes de méchanceté dont nous devons nous abstenir ? — Écoute, répondit-il : de l’adultère et de l’inconduite sexuelle, de l’ivresse sans retenue, du luxe coupable, de l’abondance de nourriture, du luxe lié à la richesse, de la vantardise, de la prétention et de l’orgueil, ainsi que du mensonge, de la médisance, de l’hypocrisie, de la rancune et de toute parole outrageante. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρίαι
  choice: formes de méchanceté
  rationale: Le pluriel désigne ici les diverses manifestations concrètes du mal énumérées ensuite.
- source_word: ἐγκρατεύεσθαι
  choice: nous abstenir
  rationale: Dans ce contexte, le verbe exprime la maîtrise de soi qui consiste à se détourner de pratiques mauvaises ; « s’abstenir » est naturel en français.
- source_word: πορνείας
  choice: inconduite sexuelle
  rationale: Expression assez large pour conserver la portée générale de πορνεία sans la réduire à la prostitution.
- source_word: μεθύσματος ἀνομίας
  choice: ivresse qui méprise toute règle
  rationale: Rend le lien entre l’ivresse et ἀνομία, littéralement l’absence ou le mépris de la loi, sans produire une formule française obscure.
- source_word: τρυφῆς πονηρᾶς
  choice: plaisirs malsains
  rationale: τρυφή évoque une vie de mollesse ou de jouissance luxueuse ; la formulation française exprime ici sa qualification morale négative.
- source_word: ἐδεσμάτων πολλῶν
  choice: excès de nourriture
  rationale: Le grec parle littéralement de « nombreux aliments » ; dans cette liste morale, il vise l’abondance excessive plutôt que la simple variété.
- source_word: πολυτελείας πλούτου
  choice: luxe que procure la richesse
  rationale: Préserve l’association syntaxique du luxe et de la richesse sans confondre la richesse elle-même avec la faute dénoncée.
- source_word: καταλαλιᾶς
  choice: médisance
  rationale: Désigne le fait de parler contre autrui ou de le dénigrer.
- source_word: μνησικακίας
  choice: rancune
  rationale: Rend l’idée de garder en mémoire le tort subi et d’en vouloir durablement à quelqu’un.
- source_word: πάσης βλασφημίας
  choice: toute parole blasphématoire
  rationale: βλασφημία peut désigner une parole injurieuse ou blasphématoire ; ce choix conserve sa force religieuse traditionnelle tout en indiquant qu’il s’agit de paroles.
theological_decisions:
- issue: Portée de πορνεία
  choice: inconduite sexuelle
  alternative: débauche / fornication
  rationale: Le terme grec couvre largement les conduites sexuelles illicites ; une expression générale évite de lui imposer une définition confessionnelle ou juridique trop étroite.
- issue: Cible de πολυτελείας πλούτου
  choice: le luxe que procure la richesse
  alternative: l’extravagance de la richesse
  rationale: La traduction distingue la possession de richesse de son déploiement luxueux, conformément au nom πολυτέλεια, sans atténuer l’avertissement moral.
- issue: Sens de βλασφημία
  choice: parole blasphématoire
  alternative: injure / calomnie
  rationale: Le mot peut viser l’outrage verbal en général ou le blasphème ; la traduction retient le sens religieux usuel tout en laissant entendre sa nature verbale.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. Le dialogue est ponctué naturellement ; l’énumération garde son rythme exhortatif sans reproduire mécaniquement chaque préposition grecque.
