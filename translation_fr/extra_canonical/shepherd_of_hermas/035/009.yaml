revisions:
- from: '« Avant tout : la foi, la crainte du Seigneur, l’amour, l’entente, des paroles justes, la vérité, la persévérance. Il n’y a rien de meilleur que ces choses dans la vie humaine. Si quelqu’un les garde et ne s’en abstient pas, il devient heureux au cours de sa vie. »'
  to: '« Avant tout : la foi, la crainte du Seigneur, l’amour, l’entente, des paroles de justice, la vérité, la persévérance. Il n’y a rien de meilleur que ces choses dans la vie humaine. Si quelqu’un les garde et ne s’en abstient pas, il devient heureux dans sa vie. »'
  rationale: 'Révision limitée à deux ajustements de précision : « des paroles de justice » suit plus étroitement la construction grecque, et « dans sa vie » évite l’ajout implicite d’une idée de progression. Aucun changement doctrinal ni interprétatif n’est introduit.'
