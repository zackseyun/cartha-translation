base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: fr
  text: '« Avant tout : la foi, la crainte du Seigneur, l’amour, l’entente, des paroles de justice, la vérité, la persévérance. Il n’y a rien de meilleur que ces choses dans la vie humaine. Si quelqu’un les garde et ne s’en abstient pas, il devient heureux dans sa vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: la foi
  rationale: Équivalent français naturel qui conserve ici la portée générale du terme grec.
- source_word: φόβος κυρίου
  choice: la crainte du Seigneur
  rationale: Rend fidèlement l’expression grecque sans réduire la crainte à un simple respect.
- source_word: ὁμόνοια
  choice: l’entente
  rationale: Exprime l’accord et l’harmonie entre les personnes dans un français courant.
- source_word: ῥήματα δικαιοσύνης
  choice: des paroles justes
  rationale: Conserve la référence à des paroles caractérisées par la justice, dans une formulation idiomatique.
- source_word: ὑπομονή
  choice: la persévérance
  rationale: Dans cette liste de vertus, le terme désigne l’endurance patiente et constante; « persévérance » est clair et naturel.
- source_word: μὴ ἐγκρατεύηται ἀπ᾿ αὐτῶν
  choice: ne s’en abstient pas
  rationale: Le contexte joue sur l’exercice de la maîtrise de soi envers le mal, mais non envers le bien; cette formulation française préserve ce contraste inhabituel.
- source_word: μακάριος
  choice: heureux
  rationale: Rend le statut favorable ou béni exprimé par le grec sans imposer ici un vocabulaire confessionnel plus marqué.
theological_decisions:
- issue: Sens de « crainte du Seigneur »
  choice: Maintien de « crainte »
  alternative: respect du Seigneur
  rationale: Le grec φόβος doit rester perceptible et ne pas être interprétativement atténué.
- issue: Rapport entre vertus gardées et bonheur
  choice: Conserver la proposition conditionnelle telle quelle
  alternative: Expliciter une causalité sotériologique ou une récompense divine
  rationale: Le passage affirme simplement que celui qui garde ces vertus devient heureux dans sa vie; aucune précision doctrinale supplémentaire ne doit être importée.
translation_notes:
  register: Français moderne, international et digne. La structure en liste est conservée; la dernière phrase reste volontairement proche de la formulation paradoxale du contexte sur l’abstention.
