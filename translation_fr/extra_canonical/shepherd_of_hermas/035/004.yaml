base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/004.yaml
  text: “These deeds are the most evil of all in the life of human beings. From these works, then, the servant of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God. Listen, then, also to the things that follow these.”
translation:
  language: fr
  text: Ces actes sont les plus mauvais de tous dans la vie humaine. Le serviteur de Dieu doit donc s’abstenir de tels actes, car celui qui ne s’en abstient pas ne peut pas vivre pour Dieu. Écoute maintenant aussi ce qui leur fait suite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔργα
  choice: actes
  rationale: Dans ce contexte moral, « actes » est plus naturel en français moderne que le calque « œuvres », tout en conservant l’idée de conduites concrètes.
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: s’abstenir de
  rationale: La construction grecque désigne ici la maîtrise de soi qui consiste à éviter des conduites mauvaises; « s’abstenir de » l’exprime clairement et naturellement.
- source_word: ζῆσαι τῷ θεῷ
  choice: vivre pour Dieu
  rationale: Le datif τῷ θεῷ exprime l’orientation de la vie vers Dieu; « pour Dieu » conserve cette relation sans préciser davantage sa nature.
- source_word: τὰ ἀκόλουθα τούτων
  choice: ce qui leur fait suite
  rationale: Cette formulation garde l’ambiguïté entre les autres actes mauvais apparentés et la suite du propos, que le passage suivant développe.
theological_decisions:
- issue: Sens de « vivre pour Dieu »
  choice: Conserver la formule « vivre pour Dieu »
  alternative: « vivre devant Dieu » ou « avoir la vie auprès de Dieu »
  rationale: Le grec ne définit pas ici plus précisément la portée sotériologique ou éthique de l’expression; la traduction retenue préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition du grec est légèrement allégée par « tels actes », sans perte du lien anaphorique. Aucun marqueur de note n’est requis.
