base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the servant of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: fr
  text: '« Y a-t-il encore, dis-je, des actions mauvaises, Seigneur[a] ? — Oui, et même beaucoup, dit-il, dont le serviteur de Dieu doit s’abstenir : le vol, le mensonge, la fraude, le faux témoignage, l’avidité, les mauvais désirs, la tromperie, la vaine gloire, la vantardise et tout ce qui leur ressemble. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « maître » ; le titre grec peut être une formule de respect adressée à un supérieur.'
    reason: Éviter que « Seigneur » soit automatiquement compris comme une identification de l’interlocuteur à Dieu, tout en préservant l’ambiguïté du titre grec.
lexical_decisions:
- source_word: ἔργα
  choice: actions
  rationale: « Actions » rend naturellement les actes concrets visés par l’énumération, sans la connotation parfois technique d’« œuvres ».
- source_word: ἐγκρατεύεσθαι
  choice: s’abstenir
  rationale: Dans cette construction avec ἀπό, le verbe désigne la maîtrise de soi qui consiste à se tenir éloigné de ces conduites ; « s’abstenir » est idiomatique en français.
- source_word: ἀποστέρησις
  choice: fraude
  rationale: Le terme évoque le fait de priver quelqu’un de ce qui lui revient ou de le dépouiller ; « fraude » conserve ici la portée générale et s’intègre à la liste.
- source_word: πλεονεξία
  choice: avidité
  rationale: Le mot désigne le désir d’avoir toujours davantage, souvent aux dépens d’autrui ; « avidité » est plus large que la seule cupidité financière.
- source_word: κενοδοξία
  choice: vaine gloire
  rationale: Cette formulation conserve les composantes du grec, l’idée d’une gloire vide ou sans fondement.
- source_word: ἀλαζονεία
  choice: vantardise
  rationale: Le terme vise la prétention arrogante et l’étalage de soi ; « vantardise » le distingue de la « vaine gloire » qui précède.
theological_decisions:
- issue: Valeur de κύριε dans l’adresse au personnage qui enseigne Hermas
  choice: Seigneur
  alternative: maître / monsieur
  rationale: Le grec peut être un titre de respect adressé à un supérieur et ne désigne pas nécessairement Dieu ici. « Seigneur » maintient le titre traditionnel et la correspondance lexicale, tandis que la note signale l’autre valeur possible sans identifier abusivement l’interlocuteur à Dieu.
translation_notes:
  register: Français moderne, clair et digne. Le dialogue reste direct, et la liste morale conserve son rythme cumulatif sans archaïsmes inutiles.
