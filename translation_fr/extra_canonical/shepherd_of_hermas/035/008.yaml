  text: “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.
translation:
  language: fr
  text: '« Seigneur, dis-je, fais-moi connaître aussi la puissance des choses bonnes, afin que je marche en elles et que je les serve, pour que, les mettant en pratique, je puisse être sauvé. » Il dit : « Écoute aussi les œuvres bonnes que tu dois accomplir sans t’en abstenir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν ἀγαθῶν
  choice: des choses bonnes / du bien
  rationale: Le premier emploi substantivé au pluriel est rendu par « des choses bonnes »; dans l’expression τὰ ἔργα, « les œuvres du bien » est plus naturel tout en conservant le lien lexical.
- source_word: δύναμιν
  choice: force
  rationale: « Force » conserve l’idée de puissance ou d’efficacité propre aux bonnes choses, sans la réduire à leur simple valeur.
- source_word: πορευθῶ ἐν αὐτοῖς
  choice: je marche en elles
  rationale: La formulation garde la métaphore grecque de la conduite comme marche, ainsi que son complément inhabituel.
- source_word: δουλεύσω αὐτοῖς
  choice: je les serve
  rationale: Le verbe exprime le service ou l’assujettissement; la traduction conserve l’objet pluriel du grec malgré son caractère marqué en français.
- source_word: ἐργασάμενος αὐτά
  choice: les mettant en pratique
  rationale: Dans ce contexte moral, cette expression française rend naturellement l’accomplissement concret des choses bonnes.
- source_word: μὴ ἐγκρατεύεσθαι
  choice: sans t’en abstenir
  rationale: Le contexte oppose l’abstention du mal au refus de s’abstenir du bien; « s’abstenir » rend cette logique plus clairement que « exercer la maîtrise de soi ».
theological_decisions:
- issue: Rapport entre les œuvres bonnes et le salut
  choice: « pour que, les mettant en pratique, je puisse être sauvé »
  alternative: « afin d’être sauvé en les accomplissant »
  rationale: La traduction suit la construction grecque et conserve la possibilité exprimée par δυνηθῶ, sans préciser davantage la relation théologique entre pratique morale et salut.
translation_notes:
  register: Français moderne, digne et lisible. Les métaphores et tensions du grec sont préservées, notamment « marcher en elles », « les servir » et la formulation non explicitée du rapport entre bonnes œuvres et salut.
