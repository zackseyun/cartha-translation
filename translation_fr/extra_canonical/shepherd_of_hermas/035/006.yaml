revisions:
- from: '« Ne te semble-t-il pas que ces choses sont mauvaises ? »

    « Elles sont même très mauvaises, Seigneur, répondis-je, pour les serviteurs de Dieu. »

    « Celui qui sert Dieu doit s’abstenir de toutes ces choses. Abstiens-t’en donc, afin de vivre pour Dieu et d’être inscrit au nombre de ceux qui s’en abstiennent. Voilà donc les choses dont tu dois t’abstenir. »'
  to: '« Ces choses ne te paraissent-elles pas mauvaises ? »


    « Elles sont même très mauvaises, dis-je, pour les serviteurs de Dieu. »


    « Celui qui sert Dieu doit s’abstenir de toutes ces choses. Abstiens-t’en donc, afin que tu vives pour Dieu et que tu sois inscrit parmi ceux qui s’en abstiennent. Voilà donc les choses dont tu dois t’abstenir. »'
  rationale: La révision supprime l’adresse absente du grec et ajuste légèrement la formulation interrogative ainsi que la coordination finale (« afin que tu vives... et que tu sois inscrit »), tout en conservant les choix lexicaux et l’ambiguïté du texte source.
