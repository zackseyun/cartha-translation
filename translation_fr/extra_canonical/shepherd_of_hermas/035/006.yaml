  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/006.yaml
  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the servants of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: fr
  text: '« Ces choses ne te paraissent-elles pas mauvaises ? »


    « Elles sont même très mauvaises, dis-je, pour les serviteurs de Dieu. »


    « Celui qui sert Dieu doit s’abstenir de toutes ces choses. Abstiens-t’en donc, afin que tu vives pour Dieu et que tu sois inscrit parmi ceux qui s’en abstiennent. Voilà donc les choses dont tu dois t’abstenir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: s’abstenir / abstiens-toi
  rationale: Dans ce contexte, le verbe désigne la maîtrise de soi exercée en renonçant aux pratiques mauvaises énumérées. « S’abstenir » rend ce sens naturellement en français tout en permettant de conserver la répétition structurante du grec.
- source_word: ζῆσαι τῷ θεῷ
  choice: vivre pour Dieu
  rationale: Le datif exprime ici l’orientation de la vie vers Dieu. Cette formulation française reste concise et conserve la portée spirituelle sans préciser davantage le rapport.
- source_word: ἐγγραφήσῃ
  choice: être inscrit
  rationale: Le verbe évoque l’inscription sur une liste ou dans un registre; le passif français préserve cette image sans identifier un registre qui n’est pas nommé.
- source_word: τοῖς δούλοις τοῦ θεοῦ / τὸν δουλεύοντα τῷ θεῷ
  choice: les serviteurs de Dieu / celui qui sert Dieu
  rationale: Le choix conserve le lien lexical entre le nom et le verbe grecs, dans un français courant et digne.
theological_decisions:
- issue: Nature de l’inscription promise
  choice: « être inscrit au nombre de ceux qui s’en abstiennent »
  alternative: « être compté parmi ceux qui se maîtrisent »
  rationale: Le texte affirme une inscription parmi un groupe sans nommer ni registre céleste ni mécanisme de salut. La traduction conserve cette indétermination.
- issue: Sens de « vivre pour Dieu »
  choice: Conserver la formule sans l’expliciter
  alternative: « recevoir la vie de Dieu » ou « vivre en communion avec Dieu »
  rationale: Le grec τῷ θεῷ permet une orientation vers Dieu, mais ne formule explicitement ni la source de la vie ni la communion; il convient de ne pas résoudre cette tension.
translation_notes:
  register: Dialogue rendu dans un français moderne, clair et digne. La répétition de « s’abstenir » reproduit l’insistance rhétorique du passage. « Seigneur » est maintenu comme adresse respectueuse au personnage qui enseigne, sans lui attribuer une identité non précisée dans cette unité.
