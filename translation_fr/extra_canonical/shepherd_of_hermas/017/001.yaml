  text: Listen to me, children. I reared you in great simplicity and innocence and dignity, through the mercy of the Lord, who caused righteousness to drip upon you, so that you might be justified and …
translation:
  language: fr
  text: Écoutez-moi, enfants. Je vous ai élevés dans une grande simplicité, innocence et dignité, par la miséricorde du Seigneur, qui a fait tomber sur vous la justice goutte à goutte, afin que vous soyez justifiés et…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: mes enfants
  rationale: Rend naturellement l’adresse affectueuse; le possessif est implicite dans le rapport entre la locutrice et ses destinataires.
- source_word: ἐξέθρεψα
  choice: je vous ai élevés
  rationale: Le verbe désigne le fait de nourrir et d’élever jusqu’à la maturité; «élevés» convient au contexte parental.
- source_word: ἁπλότητι
  choice: simplicité
  rationale: Conserve la valeur de sincérité et d’absence de duplicité sans la réduire à la naïveté.
- source_word: ἀκακίᾳ
  choice: innocence
  rationale: Exprime l’absence de malice ou de méchanceté dans un français naturel.
- source_word: σεμνότητι
  choice: dignité
  rationale: Rend la gravité honorable et la respectabilité morale du terme.
- source_word: στάξαντος
  choice: a fait tomber … goutte à goutte
  rationale: Préserve l’image concrète du ruissellement ou de l’égouttement présente dans le grec.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: Maintient le terme théologique large sans le réduire ici à la seule conduite juste.
- source_word: δικαιωθῆτε
  choice: vous soyez déclarés justes
  rationale: Rend explicitement la valeur passive de δικαιόω tout en laissant ouverte la portée exacte de la déclaration.
theological_decisions:
- issue: Rapport entre δικαιοσύνη et δικαιωθῆτε
  choice: «la justice… afin que vous soyez déclarés justes»
  alternative: «la droiture… afin que vous deveniez justes»
  rationale: La formulation retenue conserve le lien lexical grec et la tension entre don de la justice et justification, sans imposer une transformation morale comme seule lecture.
- issue: Agent et moyen exprimés par διὰ τὸ ἔλεος
  choice: «grâce à la miséricorde du Seigneur»
  alternative: «à cause de la miséricorde du Seigneur»
  rationale: «Grâce à» exprime naturellement la causalité bénéfique sans préciser au-delà du grec le mécanisme théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore inhabituelle de la justice tombant goutte à goutte est conservée. L’ellipse finale indique que le segment source s’interrompt après καὶ («et»).
