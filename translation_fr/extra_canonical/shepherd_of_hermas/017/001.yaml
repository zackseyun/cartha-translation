  source_fidelity: 'Le sens général est bien rendu : l’adresse, l’éducation des destinataires, les trois qualités, la miséricorde du Seigneur et l’image de la justice qui tombe goutte à goutte sont conservés. Toutefois, « déclarés justes » restreint δικαιωθῆτε à une déclaration judiciaire. Le passif grec δικαιόω peut porter une nuance plus large ici et doit rester non interprété.'
