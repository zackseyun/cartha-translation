  terminology: « Simplicité », « innocence », « dignité » et « justice » conviennent. « Être justifiés » préserve le lien avec δικαιοσύνη et l’ambiguïté sémantique de δικαιόω sans imposer une lecture confessionnelle ou strictement déclarative.
