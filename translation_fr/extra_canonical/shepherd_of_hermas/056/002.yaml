base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/002.yaml
  text: '“I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other ways. For many, being unsettled in their plans, undertake many things, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.'
translation:
  language: fr
  text: '« Je voulais savoir, Seigneur, dis-je, en quoi consistent ces diverses punitions. » Il répondit : « Écoute. Ces diverses punitions et ces tourments sont les tourments de la vie présente. En effet, les uns sont punis par des pertes, les autres par des privations, d’autres par diverses maladies, d’autres encore par toute sorte de désordre ; certains subissent les insultes de gens indignes et souffrent de bien d’autres manières. Car beaucoup, instables dans leurs projets, entreprennent quantité de choses sans que rien leur réussisse. Ils disent que leurs entreprises ne prospèrent pas, et l’idée qu’ils ont commis le mal ne leur vient pas au cœur ; au contraire, ils accusent le Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans l’adresse au pasteur, « Seigneur » conserve le titre respectueux et la coloration ancienne de κύριε, sans l’identifier explicitement au Seigneur divin.
- source_word: τιμωρίαι
  choice: punitions
  rationale: Le contexte présente ces épreuves comme une rétribution disciplinaire ; « punitions » garde ce sens plus nettement que « châtiments », plus soutenu.
- source_word: βάσανοι βιωτικαί
  choice: les tourments de la vie présente
  rationale: βιωτικαί renvoie à la vie vécue dans le monde actuel ; cette formulation évite de suggérer des tourments après la mort.
- source_word: ὑστερήσεσιν
  choice: privations
  rationale: Le terme désigne des manques ou dénuements ; « privations » est naturel et suffisamment large.
- source_word: ἀκαταστασίᾳ
  choice: bouleversements
  rationale: Le mot évoque l’instabilité et le désordre. « Bouleversements » convient aux épreuves de l’existence sans limiter le sens à un trouble intérieur.
- source_word: ἀκαταστατοῦντες ταῖς βουλαῖς αὐτῶν
  choice: instables dans leurs projets
  rationale: Rend l’idée de plans changeants ou désordonnés en français idiomatique, tout en gardant le lien avec les nombreuses entreprises qui suivent.
- source_word: οὐδὲν αὐτοῖς ὅλως προχωρεῖ
  choice: sans que rien leur réussisse
  rationale: προχωρεῖ signifie ici avancer ou aboutir favorablement ; la tournure choisie est naturelle dans ce contexte.
- source_word: οὐκ ἀναβαίνει αὐτῶν ἐπὶ τὴν καρδίαν
  choice: l’idée … ne leur vient pas au cœur
  rationale: Conserve l’image sémitisante du cœur comme lieu de la prise de conscience, plutôt que de la remplacer entièrement par une expression abstraite.
- source_word: αἰτιῶνται τὸν Κύριον
  choice: ils accusent le Seigneur
  rationale: Rend directement l’attribution de la faute au Seigneur, sans atténuer la tension théologique.
theological_decisions:
- issue: Nature temporelle des punitions
  choice: « les tourments de la vie présente »
  alternative: « les tourments terrestres »
  rationale: Le grec βιωτικαί situe les épreuves dans l’existence actuelle ; la traduction ne les transforme ni en jugement eschatologique ni en simple adversité profane.
- issue: Rapport entre mal commis, souffrance et action divine
  choice: Maintenir le vocabulaire explicite de la punition et l’accusation portée contre le Seigneur
  alternative: Parler seulement de conséquences ou d’épreuves
  rationale: Le passage établit lui-même un rapport disciplinaire entre les actes mauvais et les souffrances. Il faut préserver cette affirmation et sa tension sans y ajouter une systématisation doctrinale.
- issue: Identité du destinataire appelé κύριε
  choice: Employer « Seigneur » sans précision explicative
  alternative: « Monsieur » ou « maître »
  rationale: Le titre s’adresse ici au pasteur interlocuteur. La majuscule et le contexte distinguent l’adresse respectueuse, mais la traduction n’ajoute aucune identification christologique.
translation_notes:
  register: Français moderne, fluide et digne, avec conservation de l’image biblique « venir au cœur ». Le rythme énumératif du grec est maintenu, tandis que les constructions sont légèrement réorganisées pour rester naturelles à la lecture.
