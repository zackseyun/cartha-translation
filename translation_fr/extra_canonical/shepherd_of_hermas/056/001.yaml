base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/001.yaml
  text: Therefore, seeing them being scourged and afflicted like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels, appointed over punishment. Therefore he takes charge of those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”
translation:
  language: fr
  text: 'Ainsi, en les voyant fouettées et maltraitées de la sorte, j’éprouvais de la peine pour elles, parce qu’elles étaient ainsi tourmentées sans avoir le moindre répit. Je dis au berger qui me parlait : « Seigneur, qui est ce berger si impitoyable et si dur, qui n’éprouve absolument aucune compassion pour ces brebis ? » Il répondit : « C’est l’ange du châtiment. Il est l’un des anges justes et il est chargé du châtiment. Il prend donc en charge ceux qui ont été égarés loin de Dieu et qui ont suivi les désirs et les tromperies du monde présent ; il les châtie comme ils le méritent, par des peines terribles et variées. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαστιγούμενα
  choice: fouettées
  rationale: Rend concrètement le sens de « frapper au fouet, flageller » tout en conservant l’image du troupeau au féminin pluriel.
- source_word: ταλαιπωρούμενα
  choice: maltraitées
  rationale: Exprime ici la souffrance et les mauvais traitements sans alourdir la phrase par un terme rare.
- source_word: ἀνοχήν
  choice: répit
  rationale: Dans ce contexte de tourments continus, le mot désigne une suspension ou un relâchement de la souffrance.
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve l’adresse respectueuse et le lien verbal avec « le Seigneur » dans le contexte de l’œuvre, sans identifier pour autant le berger à Dieu.
- source_word: ἄσπλαγχνος
  choice: impitoyable
  rationale: Rend l’absence de compassion exprimée par le terme grec et reprise explicitement dans la proposition suivante.
- source_word: ἄγγελος τῆς τιμωρίας
  choice: l’ange du châtiment
  rationale: Préserve la formulation institutionnelle du grec et distingue le châtiment de la simple vengeance.
- source_word: κείμενος ἐπὶ τῆς τιμωρίας
  choice: chargé du châtiment
  rationale: Formulation française naturelle exprimant une fonction assignée ou une responsabilité établie.
- source_word: παραλαμβάνει
  choice: prend en charge
  rationale: Traduit l’idée de recevoir ou prendre sous sa responsabilité dans le cadre de la mission punitive de l’ange.
- source_word: τοῦ αἰῶνος τούτου
  choice: du monde présent
  rationale: Restitue la valeur temporelle et cosmique de αἰών en français courant, sans réduire le sens à une simple période chronologique.
- source_word: τιμωρίαις
  choice: peines
  rationale: Évite la répétition pesante de « châtiment » tout en conservant le sens de sanctions infligées.
theological_decisions:
- issue: Statut moral de l’ange chargé de punir
  choice: « l’un des anges justes »
  alternative: « l’un des anges de justice »
  rationale: Le grec τῶν ἀγγέλων τῶν δικαίων qualifie naturellement les anges eux-mêmes comme justes. La traduction conserve la tension entre sa dureté apparente et son appartenance aux anges justes.
- issue: Cause et justice des peines
  choice: « comme ils le méritent »
  alternative: « selon ce dont ils sont dignes »
  rationale: Rend καθὼς ἄξιοί εἰσι de façon claire sans développer une théorie du châtiment absente du texte.
- issue: Éloignement par rapport à Dieu
  choice: « se sont égarés loin de Dieu »
  alternative: « ont été détournés de Dieu »
  rationale: La forme ἀποπλανηθέντας peut laisser entendre l’égarement subi ou l’état résultant. La formulation choisie reste relativement ouverte tout en s’accordant avec la suite, où ces personnes suivent les désirs et tromperies du monde présent.
translation_notes:
  register: Français moderne, international et digne. Le rythme narratif et la répétition insistante autour de la compassion et du châtiment sont conservés. Aucun terme confessionnel spécialisé n’a été ajouté.
