    issue: Nuance de τῶν πονηρῶν dans la conclusion
    rationale: « Aucun de ces malheurs » restreint légèrement et ajoute un démonstratif absent du grec. « Aucun des maux » conserve plus directement le neutre substantivé et sa portée générale.
