base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: fr
  text: Quand donc ils sont accablés par toutes sortes de détresses, ils me sont livrés pour recevoir une salutaire correction, et ils sont affermis dans la foi au Seigneur. Pendant les jours qui leur restent à vivre, ils servent le Seigneur d’un cœur pur. S’ils se repentent, les œuvres mauvaises qu’ils ont commises leur reviennent alors à l’esprit. Ils rendent alors gloire à Dieu en disant qu’il est un juge juste et que chacun a souffert justement, selon ses actes. Désormais, ils servent le Seigneur d’un cœur pur et réussissent dans tout ce qu’ils entreprennent, recevant du Seigneur tout ce qu’ils lui demandent. Alors ils rendent gloire au Seigneur de ce qu’ils m’ont été livrés, et ils ne subissent plus aucun des maux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴν παιδείαν
  choice: une salutaire correction
  rationale: Le terme παιδεία désigne ici une discipline éducative et corrective destinée au relèvement. « Salutaire correction » exprime à la fois sa sévérité et son but bénéfique.
- source_word: ἰσχυροποιοῦνται
  choice: ils sont affermis
  rationale: Cette formulation naturelle rend l’idée d’être rendu fort ou consolidé dans la foi.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν
  choice: leur reviennent à l’esprit
  rationale: L’expression grecque signifie littéralement « monte à leur cœur »; l’équivalent français courant conserve ici le sens de prise de conscience ou de retour à la mémoire.
- source_word: εὐοδοῦνται
  choice: réussissent
  rationale: Dans ce contexte d’activités et d’entreprises, le verbe exprime le fait de prospérer ou de connaître une issue favorable.
- source_word: τῶν πονηρῶν
  choice: de ces malheurs
  rationale: Après πάσχουσιν, le neutre substantivé désigne les maux ou épreuves subis, plutôt que des actes moralement mauvais commis par les personnes.
theological_decisions:
- issue: Fonction des souffrances et de la discipline
  choice: Traduire explicitement le caractère correctif et bénéfique de la παιδεία sans atténuer le lien posé par le texte entre souffrance, repentance et affermissement.
  alternative: Employer seulement « instruction » ou présenter les détresses comme de simples épreuves sans dimension punitive.
  rationale: Le passage associe l’ange du châtiment à une discipline visant le relèvement. « Salutaire correction » maintient ensemble la justice et la restauration, sans ajouter d’explication doctrinale.
- issue: Justice de la souffrance selon les actes
  choice: « chacun a souffert justement, selon ses actes »
  alternative: Reformuler en termes généraux de conséquences naturelles ou supprimer l’affirmation de juste rétribution.
  rationale: La traduction conserve la tension théologique explicite du grec δικαίως ἔπαθον ἕκαστος κατὰ τὰς πράξεις αὐτοῦ, sans la résoudre ni l’élargir au-delà du groupe décrit.
translation_notes:
  register: Français international moderne, digne et accessible. Les périodes grecques très longues ont été divisées pour assurer la lisibilité, tout en maintenant la progression logique et les répétitions théologiques du passage.
