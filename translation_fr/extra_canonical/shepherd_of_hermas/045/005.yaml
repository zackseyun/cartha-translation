review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle au grec : le diable éprouve les serviteurs de Dieu, ceux qui sont pleins de foi lui résistent, tandis que les « vides » lui laissent une place et tombent sous son asservissement. La métaphore structurante de la plénitude et du vide est correctement préservée. Une légère correction est souhaitable pour τόπον ... ποῦ εἰσέλθῃ, qui désigne un lieu où entrer plutôt qu’un passage « par où » entrer.'
  naturalness: Le français est fluide et d’un registre approprié. « Ne trouve aucun endroit où entrer » est plus idiomatique et plus exact que « aucun endroit par où entrer ». « Ayant une place » rend directement le participe grec et évite de faire de la possession d’une place une relation causale explicitée par « comme ».
  terminology: « Mettre à l’épreuve » rend bien ἐκπειράζων sans réduire le terme à la seule tentation. « Pleins de foi » et « vides » conservent délibérément l’image des récipients du contexte. « Esclaves » rend avec justesse l’asservissement fort de ὑπόδουλοι, sans ajout doctrinal.
  issues:
  - severity: low
    issue: « par où entrer »
    rationale: Le grec μή ἔχων τόπον ποῦ εἰσέλθῃ signifie littéralement « n’ayant pas de lieu où entrer ». « Par où » évoque plutôt un accès ou un chemin ; « où » restitue l’idée de place disponible.
  - severity: low
    issue: « comme il trouve une place »
    rationale: ἔχων τόπον signifie « ayant une place ». La formulation révisée conserve le lien participial sans présenter explicitement cette donnée comme une cause introduite par « comme ».
