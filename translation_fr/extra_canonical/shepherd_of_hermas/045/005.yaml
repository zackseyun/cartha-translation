base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the servants of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: fr
  text: « De même, le diable vient vers tous les serviteurs de Dieu pour les mettre à l’épreuve. Ceux donc qui sont pleins de foi lui résistent avec force, et il s’éloigne d’eux, ne trouvant aucun endroit où entrer. Il vient alors vers ceux qui sont vides ; ayant une place, il entre en eux, y fait ce qu’il veut, et ils deviennent ses esclaves. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: pour les mettre à l’épreuve
  rationale: Exprime naturellement le participe de but ou de circonstance, sans réduire le terme à une simple tentation morale.
- source_word: πλήρεις ... ἐν τῇ πίστει
  choice: pleins de foi
  rationale: Reproduit l’image du remplissage développée dans les phrases précédentes et conserve la formulation concrète du grec.
- source_word: ἀποκένους
  choice: ceux qui sont vides
  rationale: Préserve le contraste métaphorique avec « pleins », fondé sur l’image antérieure des jarres pleines ou partiellement vides.
- source_word: τόπον
  choice: endroit / place
  rationale: Le double rendu évite une répétition pesante tout en gardant l’idée d’un espace permettant l’entrée.
- source_word: ὑπόδουλοι
  choice: ses esclaves
  rationale: Rend la force du terme, qui désigne l’asservissement, plutôt qu’une simple soumission.
theological_decisions:
- issue: Nature de l’épreuve exercée par le diable
  choice: mettre à l’épreuve
  alternative: tenter
  rationale: Le grec peut inclure la tentation, mais « mettre à l’épreuve » conserve une portée plus large et ne précise pas au-delà du texte.
- issue: Sens de la plénitude de foi
  choice: pleins de foi
  alternative: fermes dans la foi
  rationale: Le choix retenu préserve l’image directrice des récipients pleins et vides, sans la transformer en abstraction doctrinale.
- issue: Degré d’emprise finale
  choice: ils deviennent ses esclaves
  alternative: ils lui sont entièrement soumis
  rationale: Le composé grec exprime un asservissement marqué ; « esclaves » en restitue directement la gravité.
translation_notes:
  register: Français international moderne, fluide et digne. La métaphore des personnes « pleines » ou « vides » est volontairement maintenue, car elle dépend de l’illustration des jarres donnée dans le contexte immédiat.
