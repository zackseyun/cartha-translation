base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: fr
  text: « Lorsqu’un homme remplit de bon vin un très grand nombre de jarres en terre cuite et que, parmi ces jarres, quelques-unes sont vides, il vient vers les jarres et n’examine pas celles qui sont pleines, car il sait qu’elles le sont. Mais il examine celles qui sont vides, de peur qu’elles ne se soient aigries. En effet, les jarres vides s’aigrissent rapidement, et le vin perd son agrément. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεράμια
  choice: jarres en terre cuite
  rationale: Le terme désigne des récipients de poterie; cette formulation conserve la matière explicitement évoquée par le grec et reste naturelle en français.
- source_word: ἀπόκενα
  choice: vides
  rationale: Dans le contraste avec πλήρη, le mot qualifie les récipients qui ne contiennent pas de vin.
- source_word: κατανοεῖ
  choice: examine / s’attarde sur
  rationale: Le verbe implique une attention ou une inspection. La variation française évite une répétition pesante tout en conservant l’opposition entre les jarres pleines et vides.
- source_word: ὀξίζουσι
  choice: s’aigrissent
  rationale: Le verbe exprime le fait de devenir aigre. Le français garde l’image ancienne où les récipients vides eux-mêmes sont dits s’aigrir.
- source_word: ἡ ἡδονὴ τοῦ οἴνου
  choice: le vin perd son agrément
  rationale: Cette tournure rend naturellement la disparition du plaisir ou de la qualité agréable du vin, sans réduire le sens à sa seule saveur.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La traduction conserve l’image concrète des jarres et son étrangeté légère, sans expliciter à ce stade son application spirituelle donnée dans le contexte suivant.
