  text: I say to him, "Lord, listen to a few words from me." He says, "Speak what you wish."
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, écoute-moi dire quelques mots. » Il dit : « Dis ce que tu veux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve l’adresse respectueuse et le titre traditionnel, sans préciser davantage l’identité de l’interlocuteur.
- source_word: ἄκουσόν μου ὀλίγων ῥημάτων
  choice: écoute les quelques mots que j’ai à te dire
  rationale: Rend naturellement en français la construction grecque signifiant littéralement « écoute de moi quelques paroles ».
- source_word: Λέγε ... ὃ βούλει
  choice: Dis ce que tu veux
  rationale: Restitue directement et simplement l’invitation de l’interlocuteur.
- source_word: φησίν
  choice: Il répond
  rationale: Dans ce bref échange, « répond » marque naturellement le changement de locuteur tout en conservant le présent narratif grec.
theological_decisions:
- issue: Identité de la personne appelée Κύριε
  choice: Ne pas expliciter l’identité et conserver « Seigneur »
  alternative: Employer « Maître » ou nommer l’interlocuteur
  rationale: Le segment grec ne précise pas à lui seul l’identité du personnage; la traduction préserve cette indétermination contextuelle.
translation_notes:
  register: Français moderne, digne et oral, avec maintien du présent narratif et de la concision du dialogue grec.
