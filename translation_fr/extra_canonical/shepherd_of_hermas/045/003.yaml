base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the servants of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: fr
  text: « Il ne peut pas, dit-il, dominer les serviteurs de Dieu qui mettent en lui leur espérance de tout leur cœur. Le diable peut lutter contre eux, mais il ne peut pas les terrasser. Si donc vous lui résistez, il s’enfuira loin de vous, vaincu et couvert de honte. Mais ceux qui sont vides, dit-il, craignent le diable comme s’il avait de la puissance. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταδυναστεύειν
  choice: dominer
  rationale: Exprime l’exercice oppressif du pouvoir sans recourir au terme plus spécialisé « tyranniser ».
- source_word: ἀντιπαλαῖσαι / καταπαλαῖσαι
  choice: lutter contre / terrasser
  rationale: Conserve l’image cohérente du combat athlétique et la distinction entre engager la lutte et vaincre totalement.
- source_word: ἐξ ὅλης καρδίας ἐλπιζόντων ἐπ’ αὐτόν
  choice: qui mettent en lui leur espérance de tout leur cœur
  rationale: Rend explicitement le mouvement de confiance exprimé par ἐλπίζειν ἐπί et préserve « de tout leur cœur ».
- source_word: ἀπόκενοί
  choice: vides
  rationale: Maintient la métaphore du vide, développée dans les phrases suivantes par l’image des jarres insuffisamment remplies.
- source_word: κατῃσχυμμένος
  choice: couvert de honte
  rationale: Restitue la honte subie après la défaite plutôt qu’un simple embarras.
- source_word: δύναμιν
  choice: puissance
  rationale: Terme naturel et suffisamment large pour préserver l’affirmation apparente de pouvoir sans en préciser la nature.
theological_decisions:
- issue: Référent du pronom αὐτόν dans « espérer en lui »
  choice: Conserver « en lui »
  alternative: Expliciter « en Dieu »
  rationale: Le grec emploie un pronom dont le référent contextuel est Dieu; conserver le pronom respecte la forme et reste intelligible en français.
- issue: Portée du pouvoir du diable
  choice: « comme s’il avait de la puissance »
  alternative: « comme s’il détenait un véritable pouvoir »
  rationale: La formulation retenue préserve la tension du texte sans ajouter que toute puissance du diable serait irréelle ou seulement apparente.
- issue: Résistance humaine et défaite du diable
  choice: Conserver la condition « Si donc vous lui résistez »
  alternative: Reformuler en promesse inconditionnelle
  rationale: Le texte relie explicitement sa fuite à la résistance des serviteurs; cette relation ne doit pas être atténuée.
translation_notes:
  register: Français moderne, courant et digne. L’image de la lutte est maintenue par le couple « lutter contre / terrasser ». Le pluriel « vous » suit le passage du discours sur les serviteurs à l’exhortation directe.
