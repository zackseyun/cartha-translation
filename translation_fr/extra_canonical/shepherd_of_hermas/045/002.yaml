base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, l’être humain désire vivement garder les commandements de Dieu, et il n’y a personne qui ne demande au Seigneur d’être fortifié dans les commandements de Dieu et de s’y soumettre ; mais le diable est impitoyable et exerce sa domination sur eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ μὲν ἄνθρωπος
  choice: l’être humain
  rationale: Expression générique désignant la personne humaine, sans restriction au sexe masculin.
- source_word: πρόθυμός ἐστι
  choice: désire vivement
  rationale: Rend la disposition empressée et volontaire exprimée par πρόθυμος dans un français naturel.
- source_word: φυλάσσειν
  choice: garder
  rationale: Conserve le vocabulaire biblique courant de l’observance des commandements tout en restant compréhensible.
- source_word: ἐνδυναμωθῇ ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: d’être fortifié dans ses commandements
  rationale: Préserve la construction et la légère tension de l’expression grecque plutôt que de préciser indûment « pour obéir ».
- source_word: ὑποταγῇ αὐταῖς
  choice: de s’y soumettre
  rationale: Le pronom reprend clairement les commandements et ὑποτάσσω exprime la soumission à leur autorité.
- source_word: σκληρός
  choice: impitoyable
  rationale: Dans ce contexte d’oppression, le terme décrit la dureté hostile du diable plus naturellement que le littéral « dur ».
- source_word: καταδυναστεύει
  choice: exerce sa domination sur
  rationale: Rend l’idée de domination oppressive sans employer le moins naturel « tyrannise ».
theological_decisions:
- issue: Référent du pluriel αὐτῶν
  choice: sur eux
  alternative: sur les êtres humains / sur ceux qui prient
  rationale: Le grec conserve un pronom pluriel dont l’antécédent exact n’est pas explicitement formulé dans la proposition précédente. La traduction maintient cette ambiguïté au lieu de la résoudre.
- issue: Portée de la capacité humaine à garder les commandements
  choice: désire vivement garder
  alternative: est prêt à garder
  rationale: La phrase affirme une disposition ou un empressement, non une capacité autonome ni une réussite effective ; la demande d’être fortifié par le Seigneur demeure intacte.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue et la syntaxe argumentative sont conservés, avec une formulation naturelle. Aucun marqueur de note n’est requis.
