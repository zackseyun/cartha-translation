base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/002.yaml
  text: “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”
translation:
  language: fr
  text: « Comment, Seigneur, dis-je, est-elle la sœur de ces deux-là ? Car il me semble que l’emportement est une chose, l’irrésolution une autre, et la tristesse encore une autre. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif peut signifier « seigneur » ou « maître » ; la majuscule convient ici à l’adresse respectueuse faite au personnage qui enseigne Hermas, sans préciser davantage son identité.
- source_word: ὀξυχολία
  choice: emportement
  rationale: Le terme désigne une disposition prompte à la colère. « Emportement » est naturel en français moderne et conserve l’idée d’une colère vive et soudaine.
- source_word: διψυχία
  choice: irrésolution
  rationale: Littéralement, le terme évoque le fait d’avoir l’âme partagée. Dans ce contexte moral, « irrésolution » exprime le manque de fermeté intérieure sans réduire le mot au simple doute intellectuel.
- source_word: λύπη
  choice: tristesse
  rationale: Équivalent direct et courant, adapté au contexte où la tristesse est personnifiée comme une disposition spirituelle.
- source_word: ἀδελφή
  choice: sœur
  rationale: La métaphore familiale du grec est conservée telle quelle.
theological_decisions:
- issue: Sens de διψυχία
  choice: irrésolution
  alternative: duplicité / cœur partagé / doute
  rationale: « Irrésolution » préserve ici l’idée d’une personne intérieurement partagée et instable. « Duplicité » suggérerait trop fortement la tromperie, tandis que « doute » serait plus étroit que le grec.
- issue: Référent de κύριε
  choice: Seigneur
  alternative: maître / monsieur
  rationale: Le texte présente une adresse déférente dans un cadre visionnaire. « Seigneur » garde cette dignité sans introduire une identification doctrinale absente de l’unité.
translation_notes:
  register: Dialogue direct, simple et digne. La répétition structurée « une chose… une autre… encore une autre » reproduit l’opposition ternaire du grec dans un français naturel.
