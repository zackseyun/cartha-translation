revisions:
- from: Mais ceux qui craignent Dieu, qui cherchent à connaître ce qui concerne Dieu et la vérité, et dont le cœur est tourné vers le Seigneur, saisissent et comprennent rapidement tout ce qui leur est dit, parce qu’ils ont en eux la crainte du Seigneur. Car là où le Seigneur demeure, là se trouve aussi une grande intelligence. Attache-toi donc au Seigneur, et tu saisiras et comprendras tout.
  to: Mais ceux qui craignent Dieu, qui cherchent à comprendre la divinité et la vérité, et dont le cœur est tourné vers le Seigneur, comprennent et saisissent rapidement tout ce qui leur est dit, parce qu’ils ont en eux la crainte du Seigneur. Car là où le Seigneur demeure, là se trouve aussi beaucoup de discernement. Attache-toi donc au Seigneur, et tu saisiras et comprendras tout.
  rationale: La révision conserve les structures, les répétitions et le registre de l’original, tout en rendant θεότης par « la divinité » et σύνεσις πολλή par « beaucoup de discernement », formulations plus fidèles et naturelles dans ce contexte. Aucun appel de note n’est nécessaire.
