base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: fr
  text: Mais ceux qui craignent Dieu, qui cherchent à comprendre la divinité et la vérité, et dont le cœur est tourné vers le Seigneur, comprennent et saisissent rapidement tout ce qui leur est dit, parce qu’ils ont en eux la crainte du Seigneur. Car là où le Seigneur demeure, là se trouve aussi beaucoup de discernement. Attache-toi donc au Seigneur, et tu saisiras et comprendras tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβον ἔχοντες θεοῦ / φόβον τοῦ κυρίου
  choice: craignent Dieu / la crainte du Seigneur
  rationale: Conserve le champ sémantique religieux de φόβος tout en employant une tournure française naturelle; il s’agit ici d’une attitude révérencieuse qui oriente la conduite.
- source_word: ἐρευνῶντες περὶ θεότητος
  choice: cherchent à connaître ce qui concerne Dieu
  rationale: Évite le français abstrait et potentiellement ambigu « enquêter sur la divinité », tout en gardant l’idée d’une recherche attentive concernant la réalité divine.
- source_word: τὴν καρδίαν ἔχοντες πρὸς τὸν κύριον
  choice: dont le cœur est tourné vers le Seigneur
  rationale: Rend naturellement l’orientation exprimée par πρός sans préciser davantage la nature de cette disposition intérieure.
- source_word: νοοῦσι καὶ συνίουσιν
  choice: saisissent et comprennent
  rationale: Maintient les deux verbes coordonnés et leur léger recouvrement sémantique, plutôt que de les réduire à un seul.
- source_word: σύνεσις πολλή
  choice: une grande intelligence
  rationale: Exprime une faculté abondante de discernement et de compréhension, conformément au contexte, sans la restreindre à un savoir intellectuel.
- source_word: κολλήθητι
  choice: attache-toi
  rationale: Préserve l’image forte d’adhésion étroite au Seigneur dans un français digne et courant.
theological_decisions:
- issue: Rapport entre la présence du Seigneur et l’intelligence
  choice: « là où le Seigneur demeure, là se trouve aussi une grande intelligence »
  alternative: « là où le Seigneur habite, la compréhension abonde »
  rationale: La formulation retenue conserve le parallélisme spatial du grec et ne définit pas davantage la manière dont la présence du Seigneur produit ou accompagne l’intelligence.
- issue: Sens de θεότης dans la recherche religieuse
  choice: « ce qui concerne Dieu »
  alternative: « la divinité »
  rationale: Dans ce contexte, le terme désigne l’objet de la recherche concernant Dieu ou les réalités divines; la traduction évite d’introduire une formulation doctrinale technique absente du passage.
translation_notes:
  register: Français international moderne, accessible et digne. Le rythme exhortatif et les répétitions du grec sont conservés, notamment « saisissent et comprennent ». Aucun marqueur de note n’est requis.
