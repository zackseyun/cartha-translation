  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/001.yaml
  text: “Remove sorrow from yourself,” he says, “for it is a sister of double‑mindedness and quick temper.”
translation:
  language: fr
  text: « Chasse de toi la tristesse, dit-il, car elle aussi est sœur de l’irrésolution et de l’emportement. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: Chasse de toi
  rationale: Rend l’impératif vigoureux et l’idée d’éloigner de soi, dans un français naturel.
- source_word: λύπην
  choice: tristesse
  rationale: Équivalent large et direct de λύπη dans ce contexte moral et spirituel, sans le restreindre au chagrin causé par un événement précis.
- source_word: διψυχίας
  choice: irrésolution
  rationale: Le terme désigne littéralement un état d’âme partagée; « irrésolution » préserve ici l’idée d’hésitation intérieure sans introduire un diagnostic psychologique moderne.
- source_word: ὀξυχολίας
  choice: emportement
  rationale: Exprime la colère prompte et vive indiquée par le composé grec, dans un registre courant et digne.
theological_decisions:
- issue: Personnification et parenté des dispositions morales
  choice: « elle aussi est sœur de »
  alternative: « elle est apparentée à »
  rationale: La formulation conserve la métaphore explicite ἀδελφή et la particule καὶ γάρ, qui rattache la tristesse aux autres dispositions sans expliquer leur relation.
translation_notes:
  register: Français moderne, direct et digne. La métaphore familiale est conservée, ainsi que la tension du texte qui présente la tristesse comme une disposition moralement liée à l’âme partagée et à la colère prompte.
