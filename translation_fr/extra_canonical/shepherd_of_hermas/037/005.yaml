  source_fidelity: Le sens du grec est globalement bien rendu. La révision rapproche toutefois ἐμπίπτοντες de « tomber dans » et rend ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν comme un égarement de la faculté de jugement plutôt que comme de simples pensées particulières. L'image des vignobles devenant en friche sous l'effet des épines et des herbes est conservée.
  naturalness: « Tomber en friche » est plus idiomatique en français moderne que « devenir incultes » appliqué à des vignes. « Leur façon de penser » rend plus naturellement ici διάνοια que « leurs pensées ».
  terminology: « Justice » convient pour δικαιοσύνη. « Dieu », assorti d'une note sur θεότης, demeure une solution française naturelle qui ne ferme pas l'ambiguïté du terme grec. « Occupations » maintient le lien avec les préoccupations mondaines énumérées dans le contexte.
