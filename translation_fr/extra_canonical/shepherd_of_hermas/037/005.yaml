  to: De même que de bonnes vignes, lorsqu’on les néglige, tombent en friche à cause des épines et de toutes sortes de mauvaises herbes, de même ceux qui ont cru et qui tombent dans ces nombreuses occupations mentionnées plus haut s’égarent dans leur façon de penser et ne comprennent absolument rien de la justice. Même lorsqu’ils entendent parler de Dieu[a] et de la vérité, leur esprit est absorbé par leurs occupations, et ils ne comprennent absolument rien.
