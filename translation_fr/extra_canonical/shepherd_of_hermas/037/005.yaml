base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: fr
  text: De même que de bonnes vignes, lorsqu’on les néglige, tombent en friche à cause des épines et de toutes sortes de mauvaises herbes, de même ceux qui ont cru et qui tombent dans ces nombreuses occupations mentionnées plus haut s’égarent dans leur façon de penser et ne comprennent absolument rien de la justice. Même lorsqu’ils entendent parler de Dieu[a] et de la vérité, leur esprit est absorbé par leurs occupations, et ils ne comprennent absolument rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la divinité » ou « du divin » ; le terme grec peut désigner Dieu ou les réalités divines.'
    reason: Le grec θεότης possède ici une nuance plus abstraite que la formulation française naturelle « parler de Dieu ».
lexical_decisions:
- source_word: χερσοῦνται
  choice: deviennent incultes
  rationale: Le verbe évoque une terre laissée sans culture, devenue stérile ou en friche; « deviennent incultes » conserve l’image agricole sans exagérer une stérilité définitive.
- source_word: βοτανῶν ποικίλων
  choice: toutes sortes de mauvaises herbes
  rationale: Dans le contexte d’une vigne négligée, βοτάναι désigne la végétation adventice; cette formulation est naturelle en français moderne.
- source_word: ἐμπίπτοντες
  choice: se laissent prendre par
  rationale: Le sens littéral est « tomber dans »; ici, l’expression choisie rend naturellement l’idée d’être entraîné et pris dans de multiples occupations.
- source_word: ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν
  choice: s’égarent dans leurs pensées
  rationale: La construction grecque est inhabituelle et évoque un détournement de la faculté de comprendre; la traduction conserve l’idée d’égarement mental sans lui imposer une précision étrangère.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le terme français large et traditionnel qui peut couvrir ici la droiture morale et ce qui est juste.
- source_word: πρᾶξιν
  choice: affaires
  rationale: Dans ce passage, le singulier collectif renvoie aux activités et préoccupations mondaines déjà citées; « affaires » assure la cohérence contextuelle.
theological_decisions:
- issue: Traduction de θεότης
  choice: Dieu
  alternative: le divin / la divinité
  rationale: Dans l’expression περὶ θεότητος, le mot peut désigner la réalité ou les choses divines. « Parler de Dieu » est idiomatique et intelligible, tandis qu’une note préserve l’étendue du grec sans introduire une formulation abstraite dans le corps du texte.
- issue: Portée de οἱ ἄνθρωποι οἱ πιστεύσαντες
  choice: ceux qui ont cru
  alternative: les croyants
  rationale: 'La formulation verbale conserve la tension du texte: la foi passée est réelle, mais elle n’empêche pas l’égarement causé par les préoccupations du siècle.'
translation_notes:
  register: Français international moderne, sobre et digne. L’image agricole est conservée, avec une syntaxe fluide pour la lecture publique. La répétition finale de « absolument rien » reproduit l’insistance du grec.
