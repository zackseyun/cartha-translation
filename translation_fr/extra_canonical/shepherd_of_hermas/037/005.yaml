    rationale: « S'égarent dans leurs pensées » peut évoquer des pensées diverses; le grec vise leur διάνοια, c'est-à-dire leur manière de comprendre ou de juger. La formulation révisée conserve l'égarement sans surinterpréter le mécanisme.
  - severity: low
    issue: Nuance de ἐμπίπτοντες
    rationale: « Se laissent prendre » est interprétatif. « Tombent dans » reprend plus directement l'image grecque tout en restant naturel.
