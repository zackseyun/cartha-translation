revisions:
- from: « Tu es dépourvu d’intelligence, homme, dit-il. Ne comprends-tu pas que la tristesse est plus mauvaise que tous les esprits, qu’elle est extrêmement redoutable pour les serviteurs de Dieu, que, plus que tous les esprits, elle corrompt l’être humain, chasse l’Esprit saint et, ensuite, sauve de nouveau[a] ? »
  to: « Tu es dépourvu d’intelligence, homme, dit-il, et tu ne comprends pas que la tristesse est plus malfaisante que tous les esprits, la plus redoutable pour les serviteurs de Dieu, et que, plus que tous les esprits, elle ruine l’être humain, épuise l’Esprit saint et, de nouveau, sauve[a] ? »
  rationale: La révision rend plus précisément les deux verbes forts de la proposition finale et le superlatif grec, tout en conservant l’enchaînement paradoxal, l’objet implicite de « sauve » et la note explicative nécessaire.
