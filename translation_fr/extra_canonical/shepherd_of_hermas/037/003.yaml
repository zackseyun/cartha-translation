base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/003.yaml
  text: “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the servants of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”
translation:
  language: fr
  text: « Tu es dépourvu d’intelligence, homme, dit-il, et tu ne comprends pas que la tristesse est plus malfaisante que tous les esprits, la plus redoutable pour les serviteurs de Dieu, et que, plus que tous les esprits, elle ruine l’être humain, épuise l’Esprit saint et, de nouveau, sauve[a] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est volontairement paradoxale : « épuise l’Esprit saint et, de nouveau, sauve ». Le complément de « sauve » n’est pas exprimé.'
    reason: Signaler l’ambiguïté grammaticale et théologique authentique sans la résoudre dans le corps du texte.
lexical_decisions:
- source_word: ἀσύνετος
  choice: dépourvu d’intelligence
  rationale: Rend le manque de compréhension indiqué par le contexte sans employer « insensé », qui pourrait suggérer surtout la folie ou servir d’injure générale.
- source_word: λύπη
  choice: tristesse
  rationale: Terme français courant qui correspond au chagrin ou à l’affliction personnifiés dans ce mandat.
- source_word: πονηροτέρα
  choice: plus mauvaise
  rationale: Conserve le comparatif moral explicite du grec, appliqué à la tristesse par rapport aux autres esprits.
- source_word: δεινοτάτη
  choice: extrêmement redoutable
  rationale: Exprime le superlatif et la menace grave que cette tristesse représente pour les serviteurs de Dieu.
- source_word: καταφθείρει
  choice: corrompt
  rationale: Préserve l’idée de détérioration profonde ou de ruine, sans réduire le verbe à une mort physique.
- source_word: ἐκτρίβει
  choice: chasse
  rationale: Traduit naturellement l’idée d’expulser ou de faire partir l’Esprit saint.
- source_word: πάλιν σώζει
  choice: ensuite, sauve de nouveau
  rationale: Maintient la formulation paradoxale et l’absence d’objet explicite dans le grec.
theological_decisions:
- issue: La tristesse chasse l’Esprit saint tout en « sauvant de nouveau »
  choice: Conserver directement les deux affirmations paradoxales
  alternative: Expliquer dans le texte qu’une forme de tristesse chasse l’Esprit tandis qu’une autre conduit au salut
  rationale: Le grec ne distingue pas ici deux sortes de tristesse et la réplique suivante souligne précisément l’incompréhension provoquée par ce paradoxe; l’expliciter résoudrait prématurément la tension.
- issue: Objet implicite de σώζει
  choice: Ne pas ajouter de complément à « sauve »
  alternative: Écrire « sauve l’être humain » ou « sauve l’Esprit saint »
  rationale: Le grec omet l’objet; le conserver évite d’imposer une interprétation incertaine.
translation_notes:
  register: Français moderne, digne et directement compréhensible. L’apostrophe « homme » est conservée pour refléter ἄνθρωπε, malgré son caractère marqué en français. La phrase interrogative et son paradoxe sont maintenus en vue de la réponse qui suit.
