base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/004.yaml
  text: “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”
translation:
  language: fr
  text: « Seigneur, dis-je, je suis sans intelligence et je ne comprends pas ces comparaisons. Car comment peut-il écarter et sauver de nouveau ? Je ne comprends pas. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσύνετος
  choice: je manque d’intelligence
  rationale: Exprime ici l’aveu d’une incapacité à comprendre, dans un français naturel et digne, sans le sens moderne trop fort de « insensé ».
- source_word: παραβολὰς
  choice: comparaisons
  rationale: Dans ce contexte, le mot désigne les formulations imagées ou énigmatiques qui viennent d’être employées, plutôt que des paraboles narratives.
- source_word: ἐκτρίβειν
  choice: chasser l’Esprit
  rationale: Le complément implicite est « l’Esprit saint » d’après la phrase précédente; « chasser » rend l’idée d’expulsion portée par le verbe.
- source_word: σῴζειν
  choice: le sauver
  rationale: Conserve le pronom masculin singulier et la tension du grec, où son référent paraît être l’être humain, malgré l’enchaînement ambigu avec l’Esprit.
theological_decisions:
- issue: Référent implicite de ἐκτρίβειν et du pronom sous-entendu avec σῴζειν
  choice: Expliciter « l’Esprit » après « chasser », mais conserver « le sauver » sans remplacer le pronom par « l’être humain »
  alternative: « chasser l’Esprit, puis sauver l’être humain »
  rationale: Le contexte immédiat fournit clairement « l’Esprit saint » comme objet de « chasser », tandis que le passage de l’Esprit à l’être humain comme objet de « sauver » produit une tension réelle dans le texte grec. Le pronom français préserve cette difficulté au lieu de l’effacer.
translation_notes:
  register: Dialogue direct, sobre et actuel. La répétition finale de « Je ne comprends pas » est maintenue pour respecter l’insistance du grec.
