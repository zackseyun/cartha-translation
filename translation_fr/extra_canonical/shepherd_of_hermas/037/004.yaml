revisions:
- from: « Moi, Seigneur, dis-je, je manque d’intelligence et je ne comprends pas ces comparaisons. Comment, en effet, la tristesse peut-elle chasser l’Esprit, puis le sauver ? Je ne comprends pas. »
  to: « Seigneur, dis-je, je suis sans intelligence et je ne comprends pas ces comparaisons. Car comment peut-il écarter et sauver de nouveau ? Je ne comprends pas. »
  rationale: La révision retire les référents ajoutés aux infinitifs et préserve ainsi la difficulté syntaxique et référentielle du grec, déjà présente dans la réplique. Elle maintient « comparaisons », la répétition finale et le registre direct du dialogue. « Écarter » rend ἐκτρίβειν sans imposer ici l'objet contextualisé, tandis que « sauver de nouveau » rend πάλιν σῴζειν.
