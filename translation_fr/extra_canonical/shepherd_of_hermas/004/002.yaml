  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/002.yaml
  text: Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations and for the apostates."
translation:
  language: fr
  text: 'Puis elle m’appela, me toucha la poitrine et me demanda : « Ma lecture t’a-t-elle plu ? » Je lui répondis : « Dame, les dernières paroles me plaisent, mais les précédentes sont pénibles et dures. » Elle me dit alors : « Les dernières s’adressent aux justes, mais les précédentes aux nations et aux apostats. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεῖται
  choice: elle m’appela
  rationale: Rend naturellement l’idée de faire venir Hermas auprès d’elle, sans ajouter un mouvement absent du grec.
- source_word: ἥψατο τοῦ στήθους μου
  choice: me toucha la poitrine
  rationale: Traduction directe de l’expression grecque ; « poitrine » convient mieux au registre moderne que « sein » dans ce contexte.
- source_word: ἡ ἀνάγνωσίς μου
  choice: ma lecture
  rationale: Conserve le sens concret de lecture à voix haute et l’écho de ἀναγινώσκουσα dans le contexte précédent.
- source_word: τὰ ἔσχατα / τὰ πρότερα
  choice: les dernières paroles / les précédentes
  rationale: Le neutre pluriel désigne ici les éléments lus. « Paroles » explicite légèrement le référent dans la première occurrence, tandis que « les précédentes » évite une répétition lourde.
- source_word: χαλεπὰ καὶ σκληρά
  choice: pénibles et dures
  rationale: 'Préserve les deux qualificatifs et leur intensité : χαλεπά évoque ce qui est difficile ou pénible, σκληρά ce qui est dur ou sévère.'
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: Maintient la formulation collective et l’ambiguïté historique de ἔθνη, plutôt que de choisir d’emblée « païens » ou « non-Juifs ».
- source_word: τοῖς ἀποστάταις
  choice: aux apostats
  rationale: Rend précisément ceux qui se sont détournés ou ont fait défection, avec le terme français traditionnel encore intelligible.
theological_decisions:
- issue: Portée de τοῖς ἔθνεσιν
  choice: aux nations
  alternative: aux païens
  rationale: « Nations » conserve l’ambiguïté du grec et évite de déterminer sans nécessité si le texte vise spécifiquement les païens, les non-croyants ou les peuples en général.
- issue: Référent de τὰ ἔσχατα et τὰ πρότερα
  choice: les dernières paroles / les précédentes
  alternative: les dernières choses / les premières choses
  rationale: Le contexte immédiat est une lecture. Cette formulation rend le référent intelligible sans interpréter le contenu ni atténuer le contraste entre les justes, les nations et les apostats.
translation_notes:
  register: Français moderne, international et digne. Syntaxe fluide, dialogue clairement ponctué, sans archaïsmes inutiles. « Dame » conserve l’adresse respectueuse Κυρία tout en évitant ici la connotation mariale plus marquée de « Madame » ou « Seigneur ».
