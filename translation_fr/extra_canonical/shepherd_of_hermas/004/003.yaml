base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/003.yaml
  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: fr
  text: 'Pendant qu’elle me parlait, deux hommes apparurent, la soulevèrent par les coudes et partirent vers l’endroit où se trouvait aussi le siège, du côté de l’orient. Elle s’en alla joyeuse et, tout en partant, me dit : « Courage, Hermas ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλούσης αὐτῆς μετʼ ἐμοῦ
  choice: Pendant qu’elle me parlait
  rationale: Rend naturellement en français le génitif absolu et l’idée d’un échange en cours.
- source_word: ἦραν αὐτὴν τῶν ἀγκώνων
  choice: la soulevèrent par les coudes
  rationale: Conserve le geste concret et quelque peu inhabituel du grec sans l’interpréter davantage.
- source_word: πρὸς τὴν ἀνατολήν
  choice: du côté de l’orient
  rationale: « Orient » garde le registre spatial et digne du texte, sans surcharger la phrase.
- source_word: ἱλαρά
  choice: joyeuse
  rationale: Exprime l’attitude enjouée ou sereinement heureuse indiquée par l’adjectif grec.
- source_word: Ἀνδρίζου
  choice: Courage
  rationale: Restitue l’exhortation idiomatiquement en français moderne; le sens est d’être ferme et courageux, plutôt que l’expression littérale genrée « sois un homme ».
