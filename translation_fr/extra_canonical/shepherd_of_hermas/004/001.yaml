  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/001.yaml
  text: So when she had finished reading and had risen from the chair, four young men came, lifted the chair, and went away toward the east.
translation:
  language: fr
  text: Ainsi donc, lorsqu’elle eut fini de lire et se fut levée de son siège, quatre jeunes hommes vinrent, emportèrent le siège et s’en allèrent vers l’orient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: siège
  rationale: Le terme désigne ici le siège sur lequel la femme était assise. « Siège » est naturel et suffisamment général, sans suggérer inutilement un meuble particulier.
- source_word: νεανίαι
  choice: jeunes hommes
  rationale: Cette expression rend directement le pluriel masculin et l’idée de jeunesse.
- source_word: πρὸς τὴν ἀνατολήν
  choice: vers l’orient
  rationale: « L’orient » conserve la valeur directionnelle du grec tout en gardant le registre narratif et symbolique du passage.
