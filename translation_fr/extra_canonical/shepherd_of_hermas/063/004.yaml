  text: 4. First those who had the dry and cut [rods] handed them in, and they were found likewise to be dry and cut; and he ordered them to stand apart.
translation:
  language: fr
  text: 4. Ceux qui avaient les bâtons secs et coupés les remirent les premiers ; ils furent trouvés de même secs et coupés, et il leur ordonna de se tenir à part.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: bâtons
  rationale: Dans cette comparaison, il s’agit de morceaux de bois plantés puis rendus; « bâtons » est naturel et conserve l’image concrète.
- source_word: κεκομμένας
  choice: entaillés
  rationale: Le participe de κόπτω indique ici des bâtons endommagés par des coupures; « entaillés » exprime cet état sans suggérer qu’ils ont été entièrement coupés en morceaux.
- source_word: ἐπέδωκαν
  choice: remettre
  rationale: Le verbe désigne l’action de rendre ou remettre les bâtons au berger.
- source_word: χωρὶς σταθῆναι
  choice: se tenir à part
  rationale: Cette formulation rend à la fois l’idée de séparation et celle de rester debout en un groupe distinct.
