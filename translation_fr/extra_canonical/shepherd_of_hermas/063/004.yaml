translation_notes:
  register: Français moderne, clair et digne. La répétition de « secs et entaillés » est conservée parce qu’elle structure l’examen symbolique des bâtons. « Toujours » rend idiomatiquement ὡσαύτως, c’est-à-dire qu’ils furent retrouvés dans le même état.
