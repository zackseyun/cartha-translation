  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: fr
  text: '2. Me voyant ceint et prêt à le servir, il me dit : « Appelle, selon leur groupe, les hommes dont les branches ont été plantées, dans l’ordre où chacun a remis ses branches. » Je me rendis dans la plaine et les appelai tous ; tous se placèrent par groupes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεζωσμένον
  choice: la ceinture nouée
  rationale: Exprime naturellement en français l’état de celui qui s’est ceint pour accomplir un service, en lien direct avec l’action du paragraphe précédent.
- source_word: διακονεῖν
  choice: servir
  rationale: Le verbe désigne ici l’assistance concrète apportée au berger ; « servir » conserve sa portée sans introduire un office ecclésiastique.
- source_word: ῥάβδοι
  choice: branches
  rationale: Dans le contexte de branches plantées susceptibles de reverdir, « branches » est plus naturel et précis que « bâtons », tout en conservant l’image végétale.
- source_word: κατὰ τὸ τάγμα / κατὰ τὰ τάγματα
  choice: selon leur rang
  rationale: Rend l’idée d’un classement en groupes ou catégories ordonnés, sans surspécifier leur organisation.
- source_word: πεδίον
  choice: plaine
  rationale: Correspond au sens courant de πεδίον et maintient le cadre spatial du récit.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le présent historique « il me dit » est conservé, comme en grec, tandis que les autres actions restent au passé. La répétition de « tous » et de « selon leur rang » reflète l’insistance du texte source.
