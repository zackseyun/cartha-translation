  to: '2. Me voyant ceint et prêt à le servir, il me dit : « Appelle, selon leur groupe, les hommes dont les branches ont été plantées, dans l’ordre où chacun a remis ses branches. » Je me rendis dans la plaine et les appelai tous ; tous se placèrent par groupes.'
  rationale: 'Révision limitée à deux ajustements de précision : « ceint » pour l''état exprimé par le participe grec, et « par groupes » pour le pluriel final τάγματα. La référence à l''ordre dans lequel les branches ont été remises est maintenue, sans décider si cet ordre est strictement chronologique ou classificatoire.'
