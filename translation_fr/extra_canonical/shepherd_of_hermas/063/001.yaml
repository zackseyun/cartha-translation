  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/001.yaml
  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: fr
  text: 'Quelques jours plus tard, nous arrivâmes au lieu. Le Berger s’assit à la place qui était celle de l’ange, et moi, je me tins auprès de lui. Il me dit : « Ceins-toi d’un vêtement de lin brut et sers-moi. » Je me ceignis donc d’un vêtement de lin brut, propre et fait de toile de sac.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ἡμέρας ὀλίγας
  choice: Quelques jours plus tard
  rationale: Formulation française naturelle qui rend exactement l’intervalle bref indiqué par le grec.
- source_word: εἰς τὸν τόπον
  choice: à l’endroit prévu
  rationale: L’article défini renvoie à un lieu déjà connu dans le contexte; « prévu » explicite légèrement cette référence sans identifier davantage le lieu.
- source_word: ὁ ποιμήν
  choice: le Berger
  rationale: Le titre narratif désignant le personnage est conservé avec une majuscule distinctive.
- source_word: παρεστάθην αὐτῷ
  choice: je me tins à ses côtés
  rationale: Rend l’idée de se placer debout auprès de lui, plutôt que le simple fait d’être présent.
- source_word: περίζωσαι
  choice: Ceins-toi
  rationale: Le verbe exprime l’action de nouer ou d’ajuster un vêtement autour de la taille; ce terme soutenu reste clair dans ce contexte ancien.
- source_word: ὠμόλινον
  choice: une étoffe de lin brut
  rationale: Le composé désigne vraisemblablement du lin non travaillé ou brut; « étoffe » évite de préciser indûment la forme exacte du vêtement.
- source_word: διακόνει μοι
  choice: sers-moi
  rationale: Le verbe signifie ici assurer un service auprès du Berger, sans imposer un sens ecclésiastique technique.
- source_word: ἐκ σάκκου γεγονός
  choice: faite de toile de sac
  rationale: Conserve la matière explicitement indiquée et la rudesse probable de l’étoffe.
- source_word: καθαρόν
  choice: propre
  rationale: Dans la description concrète du tissu, « propre » est le sens immédiat, tout en laissant ouverte une éventuelle portée symbolique.
theological_decisions:
- issue: Portée de l’ordre διακόνει μοι
  choice: « sers-moi » au sens général
  alternative: « exerce auprès de moi un ministère »
  rationale: Le contexte décrit une assistance pratique; une terminologie ministérielle introduirait une nuance ecclésiologique absente du passage.
- issue: Sens de καθαρόν
  choice: 'qualité concrète de l’étoffe : « propre »'
  alternative: « pur » avec une portée rituelle ou morale explicite
  rationale: Le grec permet une résonance symbolique, mais le texte ne la définit pas ici; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit littéraire ancien. « Ceins-toi » est légèrement soutenu mais précis et intelligible; la syntaxe environnante demeure simple.
