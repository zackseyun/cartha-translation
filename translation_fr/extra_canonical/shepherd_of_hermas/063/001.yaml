revisions:
- from: 'Quelques jours plus tard, nous arrivâmes à l’endroit prévu. Le Berger s’assit à la place de l’ange, et moi, je me tins à ses côtés. Il me dit : « Ceins-toi d’une étoffe de lin brut et sers-moi. » Je me ceignis donc d’une étoffe propre, en lin brut, faite de toile de sac.'
  to: 'Quelques jours plus tard, nous arrivâmes au lieu. Le Berger s’assit à la place qui était celle de l’ange, et moi, je me tins auprès de lui. Il me dit : « Ceins-toi d’un vêtement de lin brut et sers-moi. » Je me ceignis donc d’un vêtement de lin brut, propre et fait de toile de sac.'
  rationale: La révision retire l’ajout « prévu », rend la relation entre le siège et l’ange sans l’ambiguïté d’un remplacement, et emploie « vêtement » pour l’objet que le narrateur se ceint. Elle maintient les ambiguïtés lexicales de ὠμόλινον et de καθαρόν, sans leur imposer une interprétation symbolique ou doctrinale.
  reviewer_model: gpt-5.6-terra
