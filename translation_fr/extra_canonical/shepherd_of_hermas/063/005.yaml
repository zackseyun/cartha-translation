  text: 5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those with dry—
translation:
  language: fr
  text: 5. Ensuite, ceux qui avaient les branches sèches, mais non coupées, les remirent. Certains d’entre eux remirent leurs branches vertes, tandis que d’autres les remirent sèches et coupées, comme rongées par des vers. Il ordonna donc à ceux qui avaient remis des branches vertes de se tenir à part, mais à ceux qui avaient remis les sèches…[a]
