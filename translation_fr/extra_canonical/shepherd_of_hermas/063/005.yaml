    reason: Le segment s’interrompt après « les sèches » (τοὺς δὲ ξηρά), au milieu de la phrase; les points de suspension signalent cette coupure sans en inventer la suite.
lexical_decisions:
- source_word: ῥάβδοι
  choice: branches
  rationale: Dans cette comparaison, il s’agit de pièces végétales plantées et susceptibles de reverdir; « branches » est naturel et précis en français.
- source_word: κεκομμένας
  choice: entaillées
  rationale: Le participe de κόπτω indique qu’elles ont été coupées ou marquées par des coupures. « Entaillées » préserve la distinction avec le simple dessèchement sans suggérer qu’elles auraient été entièrement sectionnées.
- source_word: χλωράς
  choice: verdoyantes
  rationale: Le terme désigne ici des branches vertes, fraîches et vivantes; « verdoyantes » exprime clairement leur reprise végétale.
- source_word: ὡς ὑπὸ σητός
  choice: comme rongées par des vers
  rationale: σητός évoque l’action destructrice de vers ou d’insectes; la tournure comparative grecque est conservée avec « comme ».
- source_word: χωρὶς σταθῆναι
  choice: se tenir à part
  rationale: Rend directement l’ordre de former un groupe séparé.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « remirent » et de « branches » est maintenue pour refléter la structure distributive du grec et éviter les référents ambigus.
