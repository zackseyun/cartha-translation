revisions:
- from: 5. Ensuite, ceux qui avaient reçu les branches sèches, mais non entaillées, les lui remirent. Certains d’entre eux remirent leurs branches verdoyantes, tandis que d’autres les remirent sèches et entaillées, comme rongées par des vers. Il ordonna donc à ceux qui avaient remis des branches verdoyantes de se tenir à part, mais à ceux dont les branches étaient sèches…[a]
  to: 5. Ensuite, ceux qui avaient les branches sèches, mais non coupées, les remirent. Certains d’entre eux remirent leurs branches vertes, tandis que d’autres les remirent sèches et coupées, comme rongées par des vers. Il ordonna donc à ceux qui avaient remis des branches vertes de se tenir à part, mais à ceux qui avaient remis les sèches…[a]
  rationale: La révision corrige le faux sens de « avaient reçu » et remplace « entaillées » par le rendu plus direct « coupées », sans résoudre au-delà du nécessaire la nature exacte des coupures. La construction finale conserve le parallélisme grec entre ceux qui avaient remis des branches vertes et ceux qui avaient remis les sèches, tout en signalant la coupure textuelle par une note.
