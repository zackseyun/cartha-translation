    issue: « ceux qui avaient reçu les branches sèches »
    rationale: Le grec οἱ ... ἔχοντες désigne ceux qui possédaient/avaient ces branches, non ceux qui les avaient reçues. Cette formulation altère le rapport des personnes à leurs branches.
  - severity: low
    issue: « entaillées » pour κεκομμένας
    rationale: Le participe signifie directement « coupées ». « Entaillées » peut être défendable comme interprétation contextuelle, mais ajoute une précision non explicitée par le grec; « coupées » préserve mieux l’ambiguïté.
