translation:
  language: fr
  text: '3. Il leur dit : « Que chacun arrache ses propres baguettes et me les apporte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτιλάτω
  choice: arrache
  rationale: Le verbe désigne ici l’action de retirer de terre les baguettes qui avaient été plantées ; « arrache » exprime naturellement cette idée en français.
- source_word: ῥάβδους
  choice: baguettes
  rationale: Dans cette comparaison, il s’agit de petites branches ou tiges remises puis plantées ; « baguettes » maintient la continuité concrète du récit sans évoquer des bâtons massifs.
- source_word: τὰς ἰδίας
  choice: ses propres
  rationale: Cette formulation conserve l’insistance grecque sur les baguettes appartenant respectivement à chacun.
