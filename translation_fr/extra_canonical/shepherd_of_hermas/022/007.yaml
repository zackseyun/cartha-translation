base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/007.yaml
  text: 'I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”'
translation:
  language: fr
  text: 'Je me mis à pleurer et à demander au Seigneur de me délivrer de cette bête. Puis je me rappelai la parole que j’avais entendue : « Ne sois pas divisé en toi-même, Hermas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτᾶν
  choice: demander
  rationale: Dans cette construction avec ἵνα, le verbe exprime une requête adressée au Seigneur, et non une question.
- source_word: λυτρώσηται
  choice: me délivrer
  rationale: Rend naturellement l’idée de libération ou de sauvetage face à la menace de la bête.
- source_word: ἐξ αὐτοῦ
  choice: de cette bête
  rationale: Le pronom renvoie au θηρίον du contexte immédiat; expliciter le référent évite une ambiguïté artificielle en français.
- source_word: ἐπανεμνήσθην
  choice: je me rappelai
  rationale: Exprime le retour à la mémoire d’une parole entendue précédemment.
- source_word: ῥήματος
  choice: la parole
  rationale: Désigne ici l’énoncé précis entendu par Hermas.
- source_word: διψυχήσεις
  choice: ne sois pas partagé
  rationale: Préserve l’image d’un esprit ou d’un cœur divisé, plus large que le seul doute intellectuel.
theological_decisions:
- issue: Sens de διψυχέω
  choice: Ne sois pas partagé
  alternative: Ne doute pas / n’hésite pas
  rationale: Le terme peut désigner le doute ou l’hésitation, mais son image fondamentale est celle d’une personne intérieurement divisée. La formulation retenue conserve cette tension sans la réduire à une seule nuance psychologique.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit littéraire; « cette bête » explicite sobrement l’antécédent du pronom grec. La citation garde une formulation brève et solennelle.
