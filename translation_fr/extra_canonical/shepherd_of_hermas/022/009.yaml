base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/009.yaml
  text: I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.
translation:
  language: fr
  text: Je m’approche de lui, et ce monstre marin gigantesque s’étend à terre. Il ne fait rien d’autre que tirer la langue et reste absolument immobile jusqu’à ce que je l’aie dépassé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ τηλικοῦτο κῆτος
  choice: ce monstre marin gigantesque
  rationale: κῆτος désigne une immense créature marine ou un monstre marin, et τηλικοῦτο en souligne la taille extraordinaire. « Monstre marin » conserve l’imagerie sans identifier abusivement l’animal à une baleine.
- source_word: ἐκτείνει ἑαυτὸ χαμαί
  choice: s’étend à terre
  rationale: Rend directement l’idée que la créature s’allonge ou s’étale sur le sol.
- source_word: τὴν γλῶσσαν προέβαλλεν
  choice: tirer la langue
  rationale: Expression française naturelle correspondant au fait de projeter ou sortir la langue, sans ajouter d’intention moqueuse dans ce contexte.
- source_word: ὅλως οὐκ ἐκινήθη
  choice: reste absolument immobile
  rationale: 'ὅλως renforce la négation : la créature ne bouge d’aucune manière.'
- source_word: μέχρις ὅτου παρῆλθον αὐτό
  choice: jusqu’à ce que je l’aie dépassé
  rationale: παρέρχομαι indique ici qu’Hermas passe auprès de la créature et va au-delà d’elle.
