  text: The vision that I saw, brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.
translation:
  language: fr
  text: La vision que j’ai vue, frères, eut lieu vingt jours après la vision précédente ; elle était une préfiguration de la détresse à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τύπον
  choice: était une représentation de
  rationale: La tournure indique que la vision donne une forme visible ou une préfiguration de l’événement annoncé, sans l’identifier simplement à cet événement.
- source_word: θλῖψις
  choice: détresse
  rationale: « Détresse » rend naturellement l’idée d’une épreuve oppressante ou d’une grande affliction, sans imposer le sens technique que « tribulation » peut avoir dans certains milieux.
- source_word: ἐπερχομένης
  choice: à venir
  rationale: Cette expression concise conserve l’idée de la détresse qui approche ou doit survenir.
theological_decisions:
- issue: Rapport entre la vision et la détresse future
  choice: une représentation de la détresse
  alternative: un symbole de la détresse / une préfiguration de la détresse
  rationale: '« Représentation » préserve la portée souple de τύπος : la vision figure la détresse future, sans préciser si elle en est un symbole, un modèle ou une préfiguration au sens strict.'
translation_notes:
  register: Français moderne, sobre et digne. L’adresse « frères » est conservée, et la phrase est légèrement régularisée pour former une proposition française complète tout en restant proche de la syntaxe grecque.
