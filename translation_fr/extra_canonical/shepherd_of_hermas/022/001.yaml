  terminology: « Frères » convient à l’adresse ἀδελφοί. « Détresse » est un rendu moderne recevable de θλῖψις, sans imposer la terminologie confessionnelle de « tribulation ». « Préfiguration » conserve la portée figurative et anticipatrice de εἰς τύπον.
