base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: fr
  text: 'Pendant que je lui rendais gloire et le remerciais, quelque chose qui ressemblait au son d’une voix me répondit : « Ne sois pas partagé, Hermas. » Je me mis à réfléchir en moi-même et à me dire : « Pourquoi serais-je partagé, moi que le Seigneur a si solidement affermi et qui ai vu des choses glorieuses ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζοντός μου
  choice: Pendant que je lui rendais gloire
  rationale: Rend naturellement le participe circonstanciel tout en conservant l’idée explicite de glorifier Dieu.
- source_word: εὐχαριστοῦντος αὐτῷ
  choice: et le remerciais
  rationale: Traduction directe et idiomatique de l’action de rendre grâce.
- source_word: ὡς ἦχος φωνῆς
  choice: quelque chose qui ressemblait au son d’une voix
  rationale: Préserve la comparaison et l’indétermination du grec, sans identifier trop précisément l’origine de la voix.
- source_word: διψυχήσεις / διψυχῆσαι
  choice: sois partagé / serais-je partagé
  rationale: Le verbe évoque une division intérieure, l’hésitation ou le doute. « Partagé » reste naturel et conserve l’image de la double disposition sans la réduire au seul doute intellectuel.
- source_word: οὕτω τεθεμελιωμένος ὑπὸ τοῦ Κυρίου
  choice: moi que le Seigneur a si solidement affermi
  rationale: Exprime l’image d’un fondement ferme dans un français fluide; la tournure active rend clairement l’agent indiqué par ὑπό.
- source_word: ἔνδοξα πράγματα
  choice: des choses glorieuses
  rationale: Conserve le caractère général de πράγματα et la valeur religieuse de ἔνδοξα sans préciser indûment la nature des réalités vues.
theological_decisions:
- issue: Sens de διψυχέω
  choice: être partagé
  alternative: douter / avoir le cœur partagé
  rationale: « Être partagé » maintient la tension entre doute, hésitation et division intérieure. « Douter » serait plus étroit, tandis que « avoir le cœur partagé » ajouterait un terme absent du grec.
- issue: Nature de la réponse entendue
  choice: quelque chose qui ressemblait au son d’une voix
  alternative: une voix me répondit
  rationale: Le grec ὡς ἦχος φωνῆς formule une perception comparée et quelque peu indéterminée; la traduction ne transforme donc pas celle-ci en identification catégorique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « partagé » reflète volontairement celle du verbe grec. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
