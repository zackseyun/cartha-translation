base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/005.yaml
  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: fr
  text: 'Je m’avançai un peu, frères, et voici que je vois un nuage de poussière s’élever comme jusqu’au ciel. Je me mis à me dire en moi-même : « Se pourrait-il que des troupeaux arrivent et soulèvent cette poussière ? » Il était en effet à environ un stade[a] de moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un stade correspondait à environ 185 mètres.
    reason: L’unité antique est conservée dans le texte; la note permet au lecteur moderne d’en estimer la distance.
lexical_decisions:
- source_word: προσέβην μικρόν
  choice: Je m’avançai un peu
  rationale: Rend naturellement le déplacement bref exprimé par le verbe et l’adverbe.
- source_word: κονιορτόν
  choice: un nuage de poussière
  rationale: Le grec désigne de la poussière soulevée; « nuage » explicite sans excès l’image d’une masse montant vers le ciel.
- source_word: κτήνη
  choice: des troupeaux
  rationale: Le terme peut désigner des bêtes domestiques ou du bétail; dans ce contexte, le pluriel collectif « troupeaux » explique naturellement la poussière sans préciser indûment l’espèce.
- source_word: ὡς ἀπὸ σταδίου
  choice: à environ un stade de moi
  rationale: Conserve l’unité antique et la valeur approximative de ὡς.
theological_decisions: []
translation_notes:
  register: Récit vivant et dignifié, avec maintien du présent historique dans « je vois » après le déplacement au passé. L’adresse « frères » est conservée. La formulation interrogative préserve l’incertitude du narrateur.
