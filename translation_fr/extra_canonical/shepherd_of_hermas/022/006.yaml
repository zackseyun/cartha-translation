  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/006.yaml
  text: As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.
translation:
  language: fr
  text: À mesure que le nuage de poussière grossissait, je me suis dit qu’il devait s’agir de quelque chose de divin. Le soleil a percé un instant et voici que j’aperçois une bête gigantesque, semblable à quelque monstre marin. De sa gueule sortaient des sauterelles de feu. La bête mesurait environ cent pieds de long, et sa tête semblait faite de terre cuite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec κέραμος peut désigner la terre cuite, une pièce de poterie ou une tuile; la comparaison visuelle exacte est incertaine.
    reason: Préserver l’ambiguïté lexicale de κέραμος sans imposer l’image d’une jarre.
lexical_decisions:
- source_word: κονιορτός
  choice: nuage de poussière
  rationale: Dans ce contexte, le terme désigne la masse de poussière soulevée et visible de loin, plutôt que la poussière comme matière.
- source_word: θεῖον
  choice: quelque chose de divin
  rationale: Conserve la formulation indéfinie du grec et la perception d’une manifestation d’origine divine, sans préciser davantage sa nature.
- source_word: κῆτος
  choice: monstre marin
  rationale: Rend naturellement le sens d’une immense créature marine sans l’identifier à une espèce particulière.
- source_word: ἀκρίδες πύριναι
  choice: sauterelles de feu
  rationale: Reproduit l’image visionnaire littérale et frappante du grec.
- source_word: κέραμος
  choice: grande jarre en terre cuite
  rationale: Le mot renvoie à la terre cuite et peut désigner un objet ou récipient fait de cette matière; « jarre » donne en français une comparaison visuelle compréhensible, tout en signalant l’ambiguïté en note.
theological_decisions:
- issue: Nature de ce que Hermas perçoit dans le nuage de poussière
  choice: quelque chose de divin
  alternative: un signe surnaturel
  rationale: Le grec θεῖον dit explicitement « divin » tout en restant indéfini; il ne faut ni réduire l’expression à un simple phénomène surnaturel ni préciser qu’il s’agit d’un signe.
translation_notes:
  register: Français moderne, narratif et digne. Le présent visionnaire de « j’aperçois » restitue l’immédiateté de ἰδοὺ βλέπω, tandis que les formes passées assurent la fluidité du récit. « Cent pieds » conserve l’unité antique du texte plutôt que de proposer une conversion moderne incertaine.
