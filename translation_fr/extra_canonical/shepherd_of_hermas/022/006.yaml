revisions:
- from: À mesure que le nuage de poussière grossissait, je me suis dit qu’il devait s’agir de quelque chose de divin. Le soleil a percé un instant et voici que j’aperçois une bête gigantesque, semblable à une sorte de monstre marin. De sa gueule sortaient des sauterelles de feu. La bête mesurait environ cent pieds de long, et sa tête avait la forme d’une grande jarre en terre cuite[a].
  to: À mesure que le nuage de poussière grossissait, je me suis dit qu’il devait s’agir de quelque chose de divin. Le soleil a percé un instant et voici que j’aperçois une bête gigantesque, semblable à quelque monstre marin. De sa gueule sortaient des sauterelles de feu. La bête mesurait environ cent pieds de long, et sa tête semblait faite de terre cuite[a].
  rationale: La révision retire l'ajout non attesté « grande » et évite de déterminer κέραμος comme une jarre. Elle conserve une image française lisible (« semblait faite de terre cuite »), tandis que la note signale les possibilités lexicales et l'incertitude de l'image. Une légère retouche de « une sorte de » à « quelque » reproduit plus directement l'indéfini τις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:46Z'
review_pass:
  verdict: revise
  source_fidelity: La progression du nuage de poussière, l'interprétation indéfinie (« quelque chose de divin »), l'éclaircie du soleil, le monstre assimilé à un κῆτος, les sauterelles de feu et la longueur approximative de cent pieds sont bien rendus. En revanche, « une grande jarre » ajoute l'idée de grandeur et fixe indûment κέραμος sur un type précis de récipient. Le grec renvoie plus largement à la terre cuite / une pièce de poterie, et la comparaison exacte demeure incertaine.
  naturalness: Le français est fluide et convient à un récit visionnaire moderne. « Semblable à quelque monstre marin » est un peu plus direct et naturel que « semblable à une sorte de monstre marin », tout en conservant l'indéfinition de τις.
  terminology: « Nuage de poussière », « quelque chose de divin », « monstre marin » et « sauterelles de feu » sont justes. Pour κέραμος, une formulation non spécifiante dans le texte, accompagnée d'une note, préserve mieux l'ambiguïté lexicale sans imposer « jarre ».
  issues:
