base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: fr
  text: Ainsi, tandis que je marchais seul, je demandais au Seigneur d’accomplir les révélations et les visions qu’il m’avait montrées par l’intermédiaire de sa sainte Église, afin qu’il me fortifie et qu’il accorde la repentance à ses serviteurs qui ont trébuché, pour que son nom grand et glorieux soit glorifié, puisqu’il m’a jugé digne de me montrer ses merveilles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιῶ
  choice: je suppliais
  rationale: Dans ce contexte de prière adressée au Seigneur, le verbe exprime une demande pressante et respectueuse.
- source_word: τελειώσῃ
  choice: mener à leur accomplissement
  rationale: Conserve l’idée d’achever pleinement les révélations et visions, sans préciser de quelle manière cet accomplissement doit avoir lieu.
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας αὐτοῦ
  choice: par l’intermédiaire de sa sainte Église
  rationale: Rend clairement la valeur instrumentale de διά avec le génitif et évite de faire de l’Église le simple lieu de la révélation.
- source_word: μετάνοιαν
  choice: repentance
  rationale: Terme théologique français courant qui maintient l’idée d’un changement intérieur et d’un retour à Dieu.
- source_word: τοῖς ἐσκανδαλισμένοις
  choice: qui ont trébuché
  rationale: L’image du faux pas conserve la portée morale ou spirituelle du participe sans imposer l’idée moderne d’avoir été choqué ou scandalisé.
- source_word: ἄξιον ἡγήσατο
  choice: m’avait jugé digne
  rationale: Traduction directe de l’évaluation de dignité exprimée par le grec.
- source_word: τὰ θαυμάσια αὐτοῦ
  choice: ses merveilles
  rationale: Expression naturelle et digne qui garde le caractère extraordinaire des actes ou réalités montrés par Dieu.
theological_decisions:
- issue: Le bénéficiaire implicite de la demande d’accomplissement
  choice: Conserver comme objet les révélations et les visions elles-mêmes
  alternative: Comprendre qu’Hermas demande au Seigneur de compléter la révélation qu’il reçoit
  rationale: La syntaxe grecque prend explicitement « les révélations et les visions » comme objet de τελειώσῃ; la formulation française préserve cette construction sans développer une interprétation.
- issue: Le don de la repentance
  choice: « qu’il accorde la repentance »
  alternative: « qu’il donne la possibilité de se repentir »
  rationale: La formulation suit de près le grec et maintient la tension théologique d’une repentance donnée par le Seigneur, sans expliquer davantage le rapport entre grâce et réponse humaine.
translation_notes:
  register: Français international moderne, fluide et digne. La longue période du grec est conservée, mais articulée par des subordonnées claires. Aucun marqueur de note n’est nécessaire.
