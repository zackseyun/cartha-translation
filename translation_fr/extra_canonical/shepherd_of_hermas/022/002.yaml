base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/002.yaml
  text: I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.
translation:
  language: fr
  text: Je me rendais dans la campagne par la voie de Campanie. Cet endroit se trouve à environ dix stades[a] de la voie publique, et le trajet est facile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Environ 1,8 kilomètre, si l’on compte approximativement 185 mètres par stade.
    reason: La mesure antique est conservée dans le texte; la note donne au lecteur moderne un ordre de grandeur sans imposer une équivalence excessivement précise.
lexical_decisions:
- source_word: ὑπῆγον
  choice: Je me rendais
  rationale: L’imparfait rend naturellement le déplacement en cours sans préciser à tort s’il s’agit de descendre ou de partir.
- source_word: εἰς ἀγρόν
  choice: dans la campagne
  rationale: Dans ce contexte, ἀγρός désigne une zone rurale plutôt qu’un champ particulier.
- source_word: τῇ ὁδῷ τῇ Καμπανῇ
  choice: par la voie de Campanie
  rationale: La formulation conserve le nom géographique de la route et rend le datif instrumental ou locatif par « par ».
- source_word: ὁδὸς δημοσία
  choice: voie publique
  rationale: Traduction formelle du terme désignant une grande route publique.
- source_word: ῥᾳδίως δὲ ὁδεύεται ὁ τόπος
  choice: et le trajet est facile
  rationale: Le grec signifie littéralement que le lieu se parcourt aisément; cette formulation française exprime clairement l’accessibilité du parcours.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Voie de Campanie » garde la couleur historique, tandis que « le trajet est facile » évite une tournure littérale peu naturelle. Le marqueur [a] figure bien dans le texte principal.
