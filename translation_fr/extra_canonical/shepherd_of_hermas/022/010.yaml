translation:
  language: fr
  text: 'La bête avait sur la tête quatre couleurs : du noir, puis une couleur de feu et de sang, ensuite de l’or, et enfin du blanc.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: bête
  rationale: « Bête » rend naturellement le terme grec désignant ici une créature monstrueuse et préserve le registre visionnaire.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: sur la tête
  rationale: Traduction directe et idiomatique de l’emplacement des couleurs.
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: une couleur de feu et de sang
  rationale: Les deux adjectifs décrivent ensemble la deuxième des quatre couleurs. Cette formulation conserve leur association sans créer artificiellement une cinquième couleur.
- source_word: χρυσοῦν
  choice: de l’or
  rationale: Formulation française naturelle pour une couleur dorée, en parallèle avec « du noir » et « du blanc ».
