revisions:
- from: Ainsi donc, frères, après m’être revêtu de la foi au Seigneur et m’être souvenu des grandes choses qu’il m’avait enseignées, je pris courage et m’avançai à la rencontre de la bête. Or, la bête arrivait avec un tel fracas qu’elle aurait pu ravager une ville.
  to: Ainsi donc, frères, m’étant revêtu de la foi du Seigneur et m’étant souvenu des grandes choses qu’il m’avait enseignées, je pris courage et me livrai à la bête. Or, la bête arrivait avec un tel grondement qu’elle pouvait ravager une ville.
  rationale: La révision rétablit l’image de l’habillement et le geste fort de « se livrer » exprimés par le grec, sans expliquer théologiquement le génitif de « foi du Seigneur ». Elle conserve les « grandes choses » comme expression non spécialisée et la puissance sonore et destructrice de la bête.
