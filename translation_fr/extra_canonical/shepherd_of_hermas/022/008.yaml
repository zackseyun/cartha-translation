  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/008.yaml
  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: fr
  text: Ainsi donc, frères, m’étant revêtu de la foi du Seigneur et m’étant souvenu des grandes choses qu’il m’avait enseignées, je pris courage et me livrai à la bête. Or, la bête arrivait avec un tel grondement qu’elle pouvait ravager une ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυσάμενος
  choice: après m’être revêtu
  rationale: Conserve la métaphore grecque de l’habillement tout en restant naturel en français.
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: de la foi au Seigneur
  rationale: Le génitif peut désigner la foi placée dans le Seigneur; «foi au Seigneur» préserve ici une formulation claire sans ajouter une précision doctrinale.
- source_word: μεγαλείων
  choice: des grandes choses
  rationale: Désigne les actes ou réalités grandioses enseignés à Hermas; cette expression garde l’ampleur du terme sans imposer «miracles» ou «hauts faits».
- source_word: εἰς τὸ θηρίον ἐμαυτὸν ἔδωκα
  choice: je m’avançai à la rencontre de la bête
  rationale: Rend l’idée contextuelle qu’Hermas se livre hardiment à l’affrontement ou va vers la bête, sans suggérer qu’il se remet volontairement en son pouvoir.
- source_word: ῥοίζῳ
  choice: avec un tel fracas
  rationale: Le mot évoque un bruit violent, un grondement ou un sifflement; «fracas» convient à l’arrivée destructrice de la bête.
- source_word: λυμᾶναι
  choice: ravager
  rationale: Exprime l’action de dévaster ou de ruiner, plus précisément que le simple fait d’endommager.
theological_decisions:
- issue: Sens du génitif dans «πίστιν τοῦ Κυρίου»
  choice: la foi au Seigneur
  alternative: la foi du Seigneur
  rationale: Le contexte montre qu’Hermas puise son courage dans sa confiance en Dieu; toutefois, la traduction évite de développer cette confiance en une formulation confessionnelle plus précise que le grec.
- issue: Référent de l’enseignement dans «ὧν ἐδίδαξέν με μεγαλείων»
  choice: les grandes choses qu’il m’avait enseignées
  alternative: les œuvres puissantes au sujet desquelles il m’avait instruit
  rationale: Le relatif grec peut se construire avec «μεγαλείων» de manière difficile à reproduire. La formulation retenue conserve l’acte d’enseigner et l’indétermination des «grandes choses».
translation_notes:
  register: Français moderne, narratif et digne. La répétition de «la bête» est maintenue pour reproduire l’insistance du grec. Aucun marqueur de note n’est nécessaire.
