  to: 5. Toi donc, couronné de victoire sur lui, viens vers le désir de justice et, lui remettant la victoire que tu as reçue, sers-le comme il le veut. Si tu sers le bon désir et te soumets à lui, tu pourras dominer le mauvais désir et le soumettre comme tu le voudras.
