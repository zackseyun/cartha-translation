base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/005.yaml
  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: fr
  text: 5. Toi donc, couronné de victoire sur lui, viens vers le désir de justice et, lui remettant la victoire que tu as reçue, sers-le comme il le veut. Si tu sers le bon désir et te soumets à lui, tu pourras dominer le mauvais désir et le soumettre comme tu le voudras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στεφανωθεὶς κατ᾽ αὐτῆς
  choice: après avoir été couronné pour ta victoire sur elle
  rationale: Le participe évoque l’attribution d’une couronne à la suite d’une victoire; l’explicitation «pour ta victoire» rend naturellement en français la valeur contextuelle de κατά.
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: le désir de justice
  rationale: «Désir» conserve le terme directeur répété dans toute la section, tandis que «justice» rend δικαιοσύνη sans en réduire la portée morale.
- source_word: παραδοὺς αὐτῇ τὸ νῖκος
  choice: lui remettant la victoire
  rationale: La formulation garde l’image surprenante selon laquelle la victoire reçue est confiée au bon désir, sans la rationaliser.
- source_word: δούλευσον αὐτῇ
  choice: sers-le
  rationale: Le verbe δουλεύω indique un service soumis; «sers» est naturel, digne et cohérent avec l’exhortation.
- source_word: κατακυριεῦσαι
  choice: dominer
  rationale: Le verbe exprime l’exercice d’une maîtrise effective sur le mauvais désir.
- source_word: ὑποτάξαι
  choice: soumettre
  rationale: Ce choix conserve le parallèle avec la soumission volontaire au bon désir et le contraste avec l’assujettissement du mauvais.
theological_decisions:
- issue: Personnification du désir bon et du désir mauvais
  choice: Conserver les verbes personnels «veut», «sers», «te soumets» et «soumettre»
  alternative: Dépersonnaliser en parlant de suivre une bonne inclination et de maîtriser une mauvaise inclination
  rationale: Le grec personnifie explicitement les désirs dans toute la section; cette tension rhétorique et morale doit rester perceptible.
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: «Justice» préserve l’éventail sémantique et l’écho biblique de δικαιοσύνη, sans limiter le terme à la seule rectitude personnelle.
- issue: Nature de la victoire reçue
  choice: Ne pas préciser sa provenance
  alternative: «la victoire que Dieu t’a donnée»
  rationale: Le texte dit seulement «la victoire que tu as reçue»; nommer Dieu comme donateur ajouterait une précision théologique absente de cette phrase.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier conserve l’adresse directe du grec. La répétition de «désir» est volontaire afin de maintenir la structure conceptuelle et le contraste du passage.
