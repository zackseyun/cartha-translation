base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/002.yaml
  text: 2. These, then, are evil desires, putting the servants of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: fr
  text: 2. Ce sont donc là de mauvais désirs, qui font mourir les serviteurs de Dieu. Car ce mauvais désir est la fille du diable. Il faut donc s’abstenir des mauvais désirs afin qu’en vous en abstenant, vous viviez pour Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμίαι πονηραί
  choice: mauvais désirs
  rationale: Rend naturellement le pluriel grec tout en conservant sa qualification morale, sans restreindre le terme aux seuls désirs sexuels.
- source_word: θανατοῦσαι
  choice: qui font mourir
  rationale: Préserve la force causative du participe présent grec et son action continue sur les serviteurs de Dieu.
- source_word: τοῦ διαβόλου θυγάτηρ
  choice: la fille du diable
  rationale: Conserve sans atténuation la personnification et la métaphore de filiation du texte grec.
- source_word: ἀπέχεσθαι
  choice: s’abstenir
  rationale: Exprime précisément l’idée de se tenir à l’écart et convient au registre exhortatif.
- source_word: ζήσητε τῷ Θεῷ
  choice: vous viviez pour Dieu
  rationale: Le datif peut exprimer l’orientation ou la relation; «pour Dieu» reste naturel en français et préserve cette orientation sans développer le sens.
theological_decisions:
- issue: Portée de «mauvais désirs»
  choice: Maintenir la formulation générale au pluriel
  alternative: Préciser «désirs charnels» ou «convoitises»
  rationale: Le contexte précédent donne plusieurs exemples, mais ce verset les rassemble sous une catégorie générale; une précision supplémentaire réduirait indûment la portée du grec.
- issue: Effet mortel des désirs
  choice: «qui font mourir»
  alternative: «mortels» ou «qui mènent à la mort»
  rationale: Le grec emploie un participe causatif actif; la traduction conserve cette affirmation forte sans expliquer la nature exacte de la mort.
- issue: Sens de «vivre pour Dieu»
  choice: Conserver la tension relationnelle et éthique de la formule
  alternative: «vivre en Dieu» ou «vivre aux yeux de Dieu»
  rationale: Le datif grec ne justifie pas de trancher en faveur d’une interprétation mystique, judiciaire ou purement morale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de «désir(s)» et de «donc» est maintenue parce qu’elle structure l’argument grec. Aucun marqueur de note n’est requis.
