  text: 3. But all who are overmastered by them and do not resist them will die utterly; for these desires are deadly.
translation:
  language: fr
  text: 3. Mais tous ceux qui seront dominés par ces désirs et ne leur résisteront pas mourront définitivement, car ces désirs sont mortels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριευθῶσιν
  choice: se laisseront dominer
  rationale: Le passif exprime le fait de tomber sous l’emprise des mauvais désirs; cette tournure est naturelle en français tout en conservant l’idée de domination.
- source_word: ἀντισταθῶσιν
  choice: ne leur résisteront pas
  rationale: Rend directement l’opposition active aux désirs, avec un pronom dont l’antécédent demeure clair dans le contexte.
- source_word: ἀποθανοῦνται εἰς τέλος
  choice: mourront définitivement
  rationale: La locution εἰς τέλος intensifie ou qualifie l’issue de la mort. « Définitivement » conserve cette force sans préciser au-delà du grec s’il s’agit d’une destruction totale ou d’une mort spirituelle finale.
- source_word: θανατώδεις
  choice: mortels
  rationale: 'Équivalent français direct: ces désirs conduisent à la mort.'
theological_decisions:
- issue: Nature de la mort annoncée
  choice: mourront définitivement
  alternative: périront entièrement
  rationale: Le texte affirme une issue mortelle et finale sans en expliquer ici la nature précise. La formulation choisie préserve cette tension et évite d’imposer une doctrine particulière de la perdition.
translation_notes:
  register: Français moderne, clair et digne. La phrase garde le parallélisme causal du grec et reprend « ces désirs » pour assurer le lien avec le contexte immédiat.
