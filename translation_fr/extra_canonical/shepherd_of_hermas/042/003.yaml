  source_fidelity: Le grec dit littéralement « tous ceux qui seront dominés par elles et ne leur résisteront pas ». « Se laisseront dominer » introduit une nuance de consentement ou de passivité volontaire qui n’est pas exprimée par le passif κατακυριευθῶσιν. « Mourront définitivement » rend de façon recevable l’intensification εἰς τέλος sans définir la nature de cette mort.
  naturalness: La phrase est fluide et d’un registre moderne approprié. Le remplacement de « se laisseront dominer » par « seront dominés » est à la fois plus direct, plus idiomatique et plus fidèle.
  terminology: « Désirs », « résister », « mourront » et « mortels » rendent correctement le vocabulaire et conservent les reprises du grec. « Mortels » signifie ici qu’ils conduisent à la mort; le contexte rend ce sens suffisamment clair.
