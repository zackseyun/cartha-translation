  terminology: « Désir de la justice », « crainte du Seigneur », « crainte de Dieu » et « mauvais désir » respectent les choix lexicaux du grec et la variation Κυρίου/Θεοῦ. Le singulier personnifié de ἡ ἐπιθυμία ἡ πονηρά est maintenu après la reprise contextuelle du pluriel.
  issues:
