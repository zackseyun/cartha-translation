base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/004.yaml
  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: fr
  text: 4. Mais toi, revêts-toi du désir de la justice et, t’étant armé de la crainte du Seigneur, résiste à ces mauvais désirs. Car la crainte de Dieu habite dans le bon désir. Si le mauvais désir te voit armé de la crainte de Dieu et lui tenant tête, il fuira loin de toi et ne t’apparaîtra plus, redoutant tes armes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι
  choice: revêts-toi
  rationale: Conserve l’image concrète du vêtement et l’impératif du grec, dans un registre biblique encore intelligible.
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: désir de la justice
  rationale: Rend directement le génitif grec sans préciser indûment s’il s’agit du désir d’agir justement ou de parvenir à la justice.
- source_word: καθοπλισάμενος τὸν φόβον τοῦ Κυρίου
  choice: après avoir pris pour armure la crainte du Seigneur
  rationale: Explicite naturellement en français la métaphore militaire tout en conservant la crainte du Seigneur comme armure.
- source_word: ἀντίστηθι αὐταῖς
  choice: résiste à ces mauvais désirs
  rationale: Le pronom pluriel renvoie aux mauvais désirs énumérés dans le contexte précédent; le nom est repris pour éviter une ambiguïté française.
- source_word: ἡ ἐπιθυμία ἡ πονηρά
  choice: le mauvais désir
  rationale: Le singulier personnifié du grec est maintenu, en cohérence avec les verbes voir, fuir et avoir peur.
- source_word: ἀνθεστηκότα αὐτῇ
  choice: lui tenant tête
  rationale: Expression française naturelle et vigoureuse qui maintient l’idée de résistance active.
- source_word: οὐκ ἔτι σοι ὀφθήσεται
  choice: ne se montrera plus à toi
  rationale: Rend le passif de ὁράω idiomatiquement sans transformer l’affirmation en simple perception involontaire.
theological_decisions:
- issue: Relation entre la crainte de Dieu et le bon désir
  choice: « la crainte de Dieu habite dans le bon désir »
  alternative: « la crainte de Dieu demeure au sein du bon désir »
  rationale: La formulation conserve l’image d’inhabitation et la tension conceptuelle du texte sans expliquer doctrinalement leur rapport.
- issue: Référent du pluriel αὐταῖς
  choice: « ces mauvais désirs »
  alternative: « leur »
  rationale: Le contexte de la section désigne plusieurs mauvais désirs; les nommer rend le référent clair sans ajouter de contenu doctrinal.
- issue: Alternance entre « Seigneur » et « Dieu »
  choice: Conserver les deux désignations
  alternative: Uniformiser en « Dieu » ou en « Seigneur »
  rationale: Le grec emploie successivement Κυρίου puis Θεοῦ; la traduction respecte cette variation plutôt que de l’harmoniser.
translation_notes:
  register: Français moderne, international et digne. La traduction conserve les métaphores du vêtement, de l’armure et du combat, ainsi que la personnification du mauvais désir. Aucun marqueur de note n’est requis.
