  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu : l’impératif de se revêtir du désir de justice, l’armement par la crainte du Seigneur, l’opposition aux désirs mauvais et leur personnification sont conservés. Une légère révision permet de rendre plus directement le participe final φοβουμένη (« redoutant ») sans le transformer en proposition causale au futur antérieur.'
