base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the servants of God.
translation:
  language: fr
  text: Par-dessus tout, il y a le désir de la femme ou du mari d’autrui, ainsi que le désir du luxe lié à la richesse, de nombreux mets futiles, de boissons qui mènent à l’ivresse et de bien d’autres délices nombreux et insensés. Car toute vie de délices est insensée et vaine pour les serviteurs de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντων προέχουσα
  choice: Au premier rang de toutes se trouve
  rationale: Rend l’idée de prééminence tout en conservant le lien avec les différentes formes de désir énumérées.
- source_word: ἐπιθυμία
  choice: le désir
  rationale: Terme naturel et suffisamment large pour exprimer une convoitise orientée vers différents objets.
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  choice: de la femme ou du mari d’autrui
  rationale: Conserve la formulation inclusive du grec et exprime clairement l’idée d’un conjoint qui appartient à autrui.
- source_word: πολυτελείας πλούτου
  choice: du luxe que procure la richesse
  rationale: Explicite le rapport compact entre luxe et richesse sans réduire l’expression à la seule possession de biens.
- source_word: ἐδεσμάτων πολλῶν ματαίων
  choice: de quantité de mets sans valeur
  rationale: Préserve le jugement moral porté par ματαίων, plutôt que de faire de l’abondance elle-même l’unique problème.
- source_word: μεθυσμάτων
  choice: de boissons enivrantes
  rationale: Rend le sens de boissons associées à l’ivresse sans employer une tournure française artificielle.
- source_word: τρυφῶν
  choice: plaisirs
  rationale: Dans ce contexte, désigne les jouissances complaisantes ou luxueuses; « plaisirs de ce genre » garde la nuance péjorative sans lourdeur.
- source_word: κενὴ
  choice: vain
  rationale: Conserve l’idée de vacuité et d’absence de valeur pour les serviteurs de Dieu.
theological_decisions:
- issue: Portée de la condamnation de πᾶσα τρυφή
  choice: « tout plaisir de ce genre »
  alternative: « tout plaisir » ou « toute vie de délices »
  rationale: Le contexte vise les indulgences luxueuses et insensées qui viennent d’être énumérées. La formulation évite de transformer le passage en condamnation universelle de toute expérience agréable, tout en maintenant sa force morale.
- issue: Genre des objets du désir sexuel
  choice: « la femme ou le mari d’autrui »
  alternative: « une femme étrangère ou un homme »
  rationale: Le grec mentionne explicitement la femme d’autrui et l’homme; la traduction maintient cette symétrie sans imposer une lecture confessionnelle ou sociale plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure énumérative et l’intensité morale du grec, tout en évitant les calques peu naturels comme « aliments vains » ou « boissons d’ivresse ».
