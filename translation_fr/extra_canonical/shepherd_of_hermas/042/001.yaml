revisions:
- from: Au premier rang de toutes se trouve le désir de la femme ou du mari d’autrui, ainsi que le désir du luxe que procure la richesse, de quantité de mets sans valeur, de boissons enivrantes et de bien d’autres plaisirs insensés. En effet, tout plaisir de ce genre est insensé et vain pour les serviteurs de Dieu.
  to: Par-dessus tout, il y a le désir de la femme ou du mari d’autrui, ainsi que le désir du luxe lié à la richesse, de nombreux mets futiles, de boissons qui mènent à l’ivresse et de bien d’autres délices nombreux et insensés. Car toute vie de délices est insensée et vaine pour les serviteurs de Dieu.
  rationale: La révision conserve l’énumération et la force évaluative du grec, tout en évitant d’ajouter la restriction interprétative « de ce genre ». « Vie de délices » traduit τρυφή dans son sens d’indulgence ou de luxe voluptueux, plus précis que « plaisir » dans ce contexte; la formulation ne transforme pas pour autant le passage en affirmation sur chaque plaisir humain isolé. Aucun appel de note n’est requis par le texte fourni.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T18:10:14Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « tout plaisir de ce genre » restreint indûment πᾶσα τρυφή (« toute indulgence / toute vie de délices »), qui énonce une généralisation explicite. « Mets sans valeur » affaiblit ματαίων, qui qualifie les aliments comme vains/futiles dans l'évaluation morale du texte, plutôt que dépourvus de valeur au sens matériel. « Boissons enivrantes » est recevable, mais « boissons qui mènent à l’ivresse » rend plus nettement μεθυσμάτων.
  naturalness: La version est globalement fluide et de registre approprié. Toutefois, « Au premier rang de toutes se trouve » est lourd et son antécédent (« toutes ») n’est établi qu’après coup. Une formulation directe améliore la lisibilité sans perdre la hiérarchie énoncée par le grec.
  terminology: « Désir » convient à ἐπιθυμία. « Femme ou mari d’autrui » restitue fidèlement l’expression inclusive, même si « femme ou l’homme d’autrui » serait plus proche du grec; « mari » est une explicitation contextuelle légitime. « Délices » rend τρυφή plus exactement que le terme générique « plaisir ».
  issues:
  - severity: medium
    issue: Restriction ajoutée à πᾶσα τρυφή
    rationale: « Tout plaisir de ce genre » introduit une limitation contextuelle absente de la phrase grecque, dont πᾶσα (« toute ») porte explicitement sur τρυφή. Il faut conserver la généralisation, sans pour autant choisir une formulation française qui suggérerait que le grec condamne toute joie ordinaire.
  - severity: low
    issue: Rendu affaibli de ματαίων
    rationale: « Mets sans valeur » peut évoquer une absence de valeur économique ou nutritive. « Mets futiles » ou « mets vains » conserve mieux l'évaluation morale et rhétorique de ματαίων.
  - severity: low
    issue: Ouverture syntaxiquement pesante
    rationale: « Au premier rang de toutes se trouve » est intelligible, mais moins naturel en français moderne et laisse momentanément « toutes » sans référent clair. Une construction nominale directe est préférable.
  revised_text: Par-dessus tout, il y a le désir de la femme ou du mari d’autrui, ainsi que le désir du luxe lié à la richesse, de nombreux mets futiles, de boissons qui mènent à l’ivresse et de bien d’autres délices nombreux et insensés. Car toute vie de délices est insensée et vaine pour les serviteurs de Dieu.
  revised_footnotes: []
  revision_rationale: La révision conserve l’énumération et la force évaluative du grec, tout en évitant d’ajouter la restriction interprétative « de ce genre ». « Vie de délices » traduit τρυφή dans son sens d’indulgence ou de luxe voluptueux, plus précis que « plaisir » dans ce contexte; la formulation ne transforme pas pour autant le passage en affirmation sur chaque plaisir humain isolé. Aucun appel de note n’est requis par le texte fourni.
