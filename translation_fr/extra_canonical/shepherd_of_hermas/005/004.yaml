base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/004.yaml
  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: fr
  text: Je le pris donc et, m’étant retiré dans un endroit du champ, je le recopiai entièrement, lettre par lettre, car je n’arrivais pas à distinguer les syllabes. Lorsque j’eus fini de copier les lettres du livre, le petit livre me fut soudain arraché de la main ; mais je ne vis pas qui l’avait pris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετεγραψάμην
  choice: je le recopiai
  rationale: Le verbe désigne ici l’action de transcrire ou copier le contenu du livret ; « recopier » est naturel en français et conserve le sens précis.
- source_word: πάντα πρὸς γράμμα
  choice: entièrement, lettre par lettre
  rationale: Cette formulation rend à la fois πάντα (« tout, entièrement ») et πρὸς γράμμα (« lettre par lettre »), en soulignant la copie laborieuse et littérale.
- source_word: οὐχ ηὕρισκον ... τὰς συλλαβάς
  choice: je n’arrivais pas à distinguer les syllabes
  rationale: Le sens idiomatique est qu’Hermas ne parvenait pas à reconnaître ou déchiffrer les syllabes ; « distinguer » préserve cette difficulté sans préciser indûment sa cause.
- source_word: βιβλαρίδιον
  choice: le petit livre
  rationale: Le diminutif grec est conservé par « petit livre », formulation claire et digne.
- source_word: ἡρπάγη
  choice: me fut soudain arraché des mains
  rationale: Le passif exprime une saisie brusque et énergique ; la construction française garde l’agent inconnu.
theological_decisions:
- issue: Identité de l’agent qui enlève le livre
  choice: 'Maintenir l’agent indéterminé : « mais par qui, je ne le vis pas »'
  alternative: Attribuer l’action à un esprit ou à un être céleste
  rationale: Le grec ne nomme pas l’agent et le narrateur déclare explicitement ne pas l’avoir vu ; toute identification ajouterait une interprétation absente du texte.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit littéraire, tandis que les formulations restent accessibles. Aucun marqueur de note n’est requis.
