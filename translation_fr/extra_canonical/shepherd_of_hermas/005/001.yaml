base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/001.yaml
  text: As I was going to Cumae at the same season as the year before, while walking I recalled last year’s vision, and again the Spirit lifts me up and carries me away to the same place as the year before.
translation:
  language: fr
  text: Alors que je me rendais à Cumes, à la même époque que l’année précédente, je me rappelai, en marchant, la vision de l’année précédente. De nouveau, un esprit me soulève et m’emporte au même endroit que l’année précédente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κούμας
  choice: Cumes
  rationale: Forme française traditionnelle et courante du nom de la ville antique de Cumae.
- source_word: κατὰ τὸν καιρὸν ὃν καὶ πέρυσι
  choice: à la même époque que l’année précédente
  rationale: Rend naturellement la correspondance temporelle avec l’année antérieure sans préciser davantage la saison.
- source_word: περιπατῶν
  choice: je marchais
  rationale: Conserve l’action concomitante exprimée par le participe grec dans un français naturel.
- source_word: ἀνεμνήσθην
  choice: en me rappelant
  rationale: Exprime le souvenir conscient de la vision précédente tout en reliant naturellement les deux actions.
- source_word: πνεῦμα
  choice: un esprit
  rationale: Le grec n’a pas d’article et ne désigne pas explicitement l’Esprit saint; l’indéfini préserve cette ambiguïté.
- source_word: αἴρει … καὶ ἀποφέρει
  choice: me soulève et m’emporte
  rationale: Maintient le présent historique et la force successive des deux verbes.
theological_decisions:
- issue: Identité de πνεῦμα
  choice: un esprit
  alternative: l’Esprit
  rationale: L’absence d’article et l’absence de qualification dans cette phrase ne permettent pas d’identifier sans ambiguïté l’agent à l’Esprit saint; la traduction ne doit pas trancher silencieusement.
translation_notes:
  register: Français moderne, narratif et digne. Le présent historique de la seconde proposition est conservé, comme dans le grec, malgré le récit initial au passé.
