  source_fidelity: 'Le texte français rend fidèlement la progression du grec : le relèvement après la prière, la vision de la femme âgée déjà vue l’année précédente, son activité simultanée de marche et de lecture, la demande adressée aux élus de Dieu, l’incapacité alléguée à retenir tant de choses, puis le prêt conditionnel du petit livre. Le présent narratif de βλέπω, λέγει et λέγω est convenablement conservé. « Puis tu me le rendras » exprime correctement la restitution attendue (ἀποδώσεις).'
  naturalness: Le français est naturel, lisible et d’un registre narratif sobre. « Femme âgée », « petit livre », « Madame » et « recopier » sont idiomatiques dans ce contexte. La légère alternance entre le présent narratif (« je vois », « elle me dit ») et l’imparfait descriptif (« Elle marchait ») est fluide et rend bien les participes grecs.
  terminology: Les choix terminologiques sont justes et non interprétatifs. « Aux élus de Dieu » conserve le syntagme τοῖς ἐκλεκτοῖς τοῦ Θεοῦ sans en préciser théologiquement la portée. « Madame » rend Κυρία comme adresse respectueuse sans imposer le titre « Dame » ni une interprétation doctrinale. « Petit livre » préserve la valeur diminutive de βιβλαρίδιον / βιβλίδιον.
