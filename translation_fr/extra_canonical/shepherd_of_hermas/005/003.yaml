base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/003.yaml
  text: And after I rose from prayer, I see before me the elderly woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to report these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”
translation:
  language: fr
  text: 'Après m’être relevé de ma prière, je vois devant moi la femme âgée que j’avais déjà vue l’année précédente. Elle marchait tout en lisant un petit livre. Elle me dit : « Peux-tu annoncer ces choses aux élus de Dieu ? » Je lui réponds : « Madame, je ne peux pas me souvenir de tant de choses. Donne-moi plutôt le petit livre, afin que je puisse le recopier. » Elle me dit : « Prends-le, puis tu me le rendras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν
  choice: la femme âgée
  rationale: Le comparatif substantivé désigne ici la femme âgée déjà apparue; cette formulation naturelle évite le titre ecclésiastique « ancienne ».
- source_word: βιβλαρίδιον / βιβλίδιον
  choice: un petit livre / le petit livre
  rationale: Le diminutif grec est conservé; « livre » convient mieux que « rouleau », que le texte ne précise pas.
- source_word: ἀναγγεῖλαι
  choice: annoncer
  rationale: Le verbe signifie faire connaître ou rapporter un message; « annoncer » rend clairement la mission auprès des élus.
- source_word: Κυρία
  choice: Madame
  rationale: Forme d’adresse respectueuse à une femme, sans introduire la connotation féodale ou théologique que pourrait avoir « Dame ».
- source_word: μεταγράψωμαι
  choice: le recopier
  rationale: Le moyen exprime l’action de transcrire pour soi; « recopier » est naturel et fidèle au contexte.
- source_word: ἀποδώσεις
  choice: tu me le rendras
  rationale: Le verbe indique la restitution du livre à celle qui le remet.
theological_decisions:
- issue: Identité des destinataires, τοῖς ἐκλεκτοῖς τοῦ Θεοῦ
  choice: aux élus de Dieu
  alternative: à ceux que Dieu a choisis
  rationale: La formulation littérale conserve la désignation théologique du texte sans préciser davantage l’identité ou le statut des personnes concernées.
- issue: Présent historique, βλέπω / λέγει / λέγω
  choice: je vois / elle me dit / je lui réponds
  alternative: je vis / elle me dit / je lui répondis
  rationale: Le présent narratif vif du grec est conservé là où il structure directement la scène, sans résoudre artificiellement son alternance avec les temps passés.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement fluidifiée, notamment par deux phrases pour les participes décrivant la femme, tout en conservant le présent historique et le dialogue direct.
