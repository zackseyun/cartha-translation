  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/002.yaml
  text: So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.
translation:
  language: fr
  text: Arrivé donc à cet endroit, je me mis à genoux et commençai à prier le Seigneur et à glorifier son nom, parce qu’il m’avait jugé digne et m’avait fait connaître mes péchés passés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιθῶ τὰ γόνατα
  choice: je me mis à genoux
  rationale: Expression française naturelle qui rend littéralement l’action de poser les genoux.
- source_word: δοξάζειν αὐτοῦ τὸ ὄνομα
  choice: à glorifier son nom
  rationale: Conserve l’expression religieuse grecque et son objet explicite, « son nom ».
- source_word: ἄξιον ἡγήσατο
  choice: m’avait jugé digne
  rationale: Rend directement l’idée d’une estimation ou reconnaissance de dignité, sans préciser de quoi le narrateur est jugé digne.
- source_word: τὰς ἁμαρτίας μου τὰς πρότερον
  choice: mes péchés passés
  rationale: « Passés » exprime naturellement l’antériorité indiquée par πρότερον.
theological_decisions:
- issue: Objet implicite de la dignité
  choice: maintenir « m’avait jugé digne » sans complément
  alternative: « m’avait jugé digne de cette révélation »
  rationale: Le grec ne fournit aucun complément explicite; l’ajouter résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple porte les actions principales; le plus-que-parfait marque les actes divins antérieurs qui motivent la prière.
