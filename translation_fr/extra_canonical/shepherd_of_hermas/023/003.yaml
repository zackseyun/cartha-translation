base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: fr
  text: 'Ayez foi dans le Seigneur, vous qui avez le cœur partagé[a], car il peut tout : il détourne de vous sa colère et vous envoie des fléaux[b], à vous qui avez le cœur partagé. Malheur à ceux qui ont entendu ces paroles et n’y ont pas obéi ! Il aurait mieux valu qu’ils ne soient pas nés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous qui avez l’âme double » ; l’expression désigne ceux dont la confiance ou la fidélité est divisée.'
    reason: Éclairer une image grecque difficile à rendre littéralement en français courant.
  - marker: b
    text: Le mot grec peut désigner des coups de fouet, puis, au sens figuré, des châtiments ou des calamités.
    reason: Préserver l’étendue sémantique et la vigueur de μάστιγας.
lexical_decisions:
- source_word: πιστεύσατε τῷ Κυρίῳ
  choice: Mettez votre foi dans le Seigneur
  rationale: Rend naturellement l’impératif et le datif grecs en exprimant la confiance placée dans le Seigneur, plutôt qu’une simple adhésion intellectuelle.
- source_word: δίψυχοι / διψύχοις
  choice: vous qui avez le cœur partagé
  rationale: δίψυχος signifie littéralement « à l’âme double » et désigne l’indécision ou une fidélité divisée. La formulation choisie est claire en français moderne tout en conservant cette image intérieure.
- source_word: μάστιγας
  choice: fléaux
  rationale: Le terme désigne littéralement des coups de fouet, puis des châtiments ou calamités. « Fléaux » conserve la force et l’indétermination de l’image.
- source_word: παρακούσασιν
  choice: n’en auront pas tenu compte
  rationale: Le verbe peut signifier ne pas écouter, refuser d’écouter ou désobéir. Cette expression française garde ensemble l’écoute et le refus d’obtempérer.
theological_decisions:
- issue: Rapport entre le détournement de la colère et l’envoi des fléaux
  choice: Conserver la coordination grecque par « et »
  alternative: 'Introduire une opposition : « mais il envoie des fléaux »'
  rationale: Le grec coordonne les deux actions avec καί. La traduction ne résout donc pas la tension en ajoutant une opposition absente du texte source.
- issue: Portée de πάντα δύναται
  choice: « il peut tout »
  alternative: « il est tout-puissant »
  rationale: La formulation verbale traduit directement le grec et évite de convertir l’énoncé en titre doctrinal abstrait.
translation_notes:
  register: Français moderne, direct et solennel. L’adresse répétée est conservée, de même que la tension du texte entre la colère détournée et les fléaux envoyés.
