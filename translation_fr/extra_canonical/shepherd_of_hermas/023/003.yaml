  naturalness: « Ayez foi dans le Seigneur » est plus idiomatique en français moderne que « Mettez votre foi dans le Seigneur ». Le présent composé (« ont entendu », « n’y ont pas obéi ») convient mieux que le futur antérieur pour le constat proverbial et rétrospectif du grec. « Il aurait mieux valu qu’ils ne soient pas nés » est la tournure française naturelle.
  terminology: « cœur partagé » transmet bien δίψυχοι sans figer l’expression en formule doctrinale. « Fléaux » maintient l’amplitude de μάστιγες, littéralement des coups de fouet et, selon le contexte, des châtiments ou calamités.
