base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: fr
  text: Je compris que je lui échapperais si votre cœur devenait pur et sans tache, et si, pendant les jours qui vous restent à vivre, vous serviez le Seigneur d’une manière irréprochable. Rejetez sur le Seigneur tous vos soucis, et lui-même s’en occupera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκφυγεῖν αὐτήν
  choice: lui échapperais
  rationale: Le pronom féminin renvoie naturellement à la bête (τὸ θηρίον, neutre en grec mais féminin en français). « Échapper à » rend directement l’idée de fuite réussie.
- source_word: ἄμωμος
  choice: sans tache
  rationale: Expression française naturelle qui conserve l’image morale de l’absence de défaut ou de souillure.
- source_word: τὰς λοιπὰς τῆς ζωῆς ἡμέρας ὑμῶν
  choice: pendant les jours qui vous restent à vivre
  rationale: Formulation idiomatique et fidèle au sens temporel de l’expression grecque.
- source_word: ἀμέμπτως
  choice: d’une manière irréprochable
  rationale: Conserve la nuance d’une conduite qui ne donne prise à aucun reproche, sans suggérer une perfection métaphysique.
- source_word: μερίμνας
  choice: soucis
  rationale: Rend les préoccupations anxieuses ou pesantes dans un français courant et digne.
- source_word: κατορθώσει αὐτάς
  choice: s’en occupera
  rationale: Le verbe peut signifier mener à bonne fin, redresser ou régler. Avec « soucis », le français « s’en occupera » reste naturel tout en évitant l’étrange idée de « diriger » des soucis.
theological_decisions:
- issue: Condition de la délivrance et pureté du cœur
  choice: si votre cœur devenait pur et sans tache
  alternative: si votre cœur devient pur et sans tache
  rationale: L’imparfait du subjonctif français serait trop soutenu; le conditionnel avec imparfait respecte la relation conditionnelle du grec et la concordance avec « je compris que je lui échapperais », sans transformer cette exhortation en définition doctrinale du salut.
- issue: Action du Seigneur envers les soucis
  choice: lui-même s’en occupera
  alternative: lui-même les mènera à bonne fin / les réglera
  rationale: La traduction préserve l’assurance que le Seigneur agit personnellement, sans préciser au-delà du grec la manière dont il résout ou ordonne les préoccupations confiées.
translation_notes:
  register: Français international moderne, clair et digne. Le passage alterne le singulier du narrateur (« je ») et le pluriel adressé aux lecteurs (« votre », « vous »), conformément au grec transmis. Aucun marqueur de note n’est nécessaire.
