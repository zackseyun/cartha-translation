revisions:
- from: Après que la bête m’eut dépassé et que j’eus avancé d’environ trente pieds[a], voici qu’une jeune femme vint à ma rencontre. Elle était parée comme une mariée sortant de la chambre nuptiale, tout habillée de blanc et chaussée de sandales blanches. Elle était voilée jusqu’au front, et son voile formait une sorte de turban[b]. Ses cheveux étaient blancs.
  to: Après que la bête fut passée près de moi et que j’eus avancé d’environ trente pieds[a], voici qu’une jeune fille vient à ma rencontre. Elle était parée comme si elle sortait d’une chambre nuptiale, entièrement vêtue de blanc et chaussée de sandales blanches. Elle était voilée jusqu’au front ; son couvre-chef était un bandeau[b]. Ses cheveux étaient blancs.
  rationale: La révision restitue plus fidèlement παρθένος et la comparaison nuptiale sans ajouter que la figure est une mariée. Elle reformule également le détail de la μίτρα de façon plus neutre, tout en conservant la note explicative. Les autres choix du projet sont conservés lorsque le grec les soutient directement.
