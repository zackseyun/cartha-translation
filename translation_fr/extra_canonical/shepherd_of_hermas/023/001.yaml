    issue: « jeune femme » pour παρθένος
    rationale: Le choix perd la valeur usuelle de « jeune fille, vierge » et rend le référent plus adulte que ne le suggère le grec.
  - severity: medium
    issue: Ajout de « une mariée »
    rationale: ὡς ἐκ νυμφῶνος ἐκπορευομένη compare son apparence à celle de quelqu’un qui sort d’une chambre nuptiale ; le texte ne l’identifie pas explicitement comme mariée.
  - severity: low
    issue: « son voile formait une sorte de turban »
    rationale: Le grec associe la couverture de tête à une μίτρα, mais ne dit pas précisément qu’un voile « formait » un turban. Une formulation plus neutre préserve l’ambiguïté vestimentaire.
