  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/001.yaml
  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: fr
  text: Après que la bête fut passée près de moi et que j’eus avancé d’environ trente pieds[a], voici qu’une jeune fille vient à ma rencontre. Elle était parée comme si elle sortait d’une chambre nuptiale, entièrement vêtue de blanc et chaussée de sandales blanches. Elle était voilée jusqu’au front ; son couvre-chef était un bandeau[b]. Ses cheveux étaient blancs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Environ neuf mètres.
    reason: Donne au lecteur moderne l’équivalent approximatif de la mesure antique sans remplacer celle du texte.
  - marker: b
    text: Le terme grec μίτρα désigne une coiffure, un bandeau ou un couvre-chef ; sa forme exacte est incertaine.
    reason: Préserve l’incertitude lexicale et vestimentaire du terme grec.
lexical_decisions:
- source_word: παρθένος
  choice: jeune femme
  rationale: Le terme signifie normalement « vierge » ou « jeune fille ». Dans ce portrait nuptial et symbolique, « jeune femme » est naturel en français tout en évitant une formulation étrange devant la mention de cheveux blancs.
- source_word: κεκοσμημένη
  choice: parée
  rationale: Rend l’idée d’être ornée ou apprêtée, avec le registre digne qui convient à une apparition nuptiale.
- source_word: ὡς ἐκ νυμφῶνος ἐκπορευομένη
  choice: comme une mariée sortant de la chambre nuptiale
  rationale: Le grec dit littéralement qu’elle sort comme de la chambre nuptiale; l’ajout explicite de « mariée » restitue naturellement l’image suggérée par sa parure.
- source_word: μίτρα
  choice: une sorte de turban
  rationale: Désigne ici une coiffure ou un bandeau enveloppant; « une sorte de » préserve l’incertitude quant à sa forme précise.
- source_word: τριάκοντα πόδας
  choice: trente pieds
  rationale: Conserve la mesure corporelle antique du texte, avec une note donnant une approximation moderne.
