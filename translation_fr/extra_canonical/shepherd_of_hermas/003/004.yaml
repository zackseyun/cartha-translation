base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: fr
  text: '« Voici le Dieu des puissances : par sa puissance invisible et puissante, et par sa grande intelligence, il a créé le monde ; par son dessein glorieux, il a orné sa création de beauté ; par sa parole puissante, il a affermi le ciel et fondé la terre sur les eaux ; par sa propre sagesse et sa providence, il a créé sa sainte Église, qu’il a aussi bénie. Voici qu’il déplace les cieux, les montagnes, les collines et les mers, et que tout s’aplanit devant ses élus, afin de leur accorder la promesse qu’il leur a faite avec beaucoup de gloire et de joie, s’ils observent les prescriptions de Dieu qu’ils ont reçues avec une grande foi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν δυνάμεων
  choice: le Dieu des puissances
  rationale: Rend formellement l’expression grecque sans la réduire au seul sens militaire que pourrait suggérer « Dieu des armées ».
- source_word: κραταιᾷ
  choice: souveraine
  rationale: Dans le syntagme qualifiant la puissance divine, « souveraine » exprime une force irrésistible avec un français naturel et digne.
- source_word: συνέσει
  choice: intelligence
  rationale: Conserve la nuance de compréhension ou d’intelligence, distincte de σοφία, rendu ensuite par « sagesse ».
- source_word: περιθεὶς τὴν εὐπρέπειαν
  choice: il a revêtu sa création de beauté
  rationale: Reproduit l’image d’une beauté placée autour de la création, tout en restant idiomatique en français.
- source_word: πήξας
  choice: affermi
  rationale: Traduit l’idée de fixer solidement ou d’établir, sans suggérer nécessairement une cosmologie plus précise que le grec.
- source_word: προνοίᾳ
  choice: providence
  rationale: Terme français traditionnel et exact pour la prévoyance et le soin ordonnateur divins.
- source_word: μεθίστησιν
  choice: il déplace
  rationale: Préserve le mouvement concret et étonnant du verbe grec, plutôt que de l’atténuer en « transforme ».
- source_word: ὁμαλὰ
  choice: uni
  rationale: Exprime un terrain rendu égal, plan ou praticable ; « uni » convient à l’image de l’aplanissement devant les élus.
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: pour ceux qu’il a choisis
  rationale: Formulation transparente en français courant, évitant que « les élus » soit entendu comme un terme confessionnel figé.
- source_word: τὰ νόμιμα
  choice: les prescriptions
  rationale: Rend des règles ou ordonnances établies, sans imposer la nuance législative plus étroite de « lois » ni l’archaïsme de « statuts ».
theological_decisions:
- issue: Sens de « Dieu des puissances »
  choice: Conserver « puissances »
  alternative: « Dieu des armées »
  rationale: Le pluriel δυνάμεις peut évoquer les armées ou puissances célestes, mais le texte grec demeure plus large ; la traduction conserve cette amplitude.
- issue: Condition liée à l’accomplissement de la promesse
  choice: Maintenir explicitement « s’ils observent »
  alternative: Reformuler comme simple conséquence non conditionnelle
  rationale: La proposition ἐὰν τηρήσωσιν exprime réellement une condition ; elle ne doit pas être effacée ni harmonisée avec un système théologique particulier.
- issue: Identité de l’Église dans le dessein créateur
  choice: Traduire directement « il a créé sa sainte Église »
  alternative: Atténuer en « établi » ou interpréter comme prédestination
  rationale: Le grec emploie κτίσας, « ayant créé ». La formulation garde l’affirmation propre au texte sans en fournir une explication doctrinale.
- issue: Portée eschatologique du bouleversement cosmique
  choice: Conserver l’image littérale du déplacement des éléments cosmiques
  alternative: L’interpréter comme métaphore des obstacles supprimés
  rationale: Le passage permet une lecture cosmique ou figurée ; la traduction ne tranche pas cette tension.
translation_notes:
  register: Français moderne international, soutenu mais accessible. La longue période grecque est conservée avec une ponctuation structurante. Les répétitions rhétoriques de « Voici » et de « il a créé » sont maintenues, de même que la solennité cosmique du passage.
