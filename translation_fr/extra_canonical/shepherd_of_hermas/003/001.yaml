revisions:
- from: 'Mais ce n’est pas pour cela que Dieu est en colère contre toi : c’est afin que tu ramènes ta maison, qui a péché contre le Seigneur et contre nous, qui sommes leurs parents. Pourtant, parce que tu aimais tendrement tes enfants, tu ne reprenais pas ta maison, mais tu l’as laissée sombrer dans une terrible corruption. Voilà pourquoi le Seigneur est en colère contre toi. Cependant, il guérira tous les maux commis autrefois dans ta maison. En effet, à cause de leurs péchés et de leurs actes contraires à la loi, tu as toi-même été ruiné dans tes affaires de ce monde.'
  to: Mais ce n’est pas pour cela que Dieu est en colère contre toi, mais afin que tu fasses revenir vers le Seigneur et vers nous, leurs parents, ta maisonnée, qui a péché. Pourtant, parce que tu es attaché à tes enfants, tu n’as pas averti ta maisonnée, mais tu l’as laissée se corrompre gravement. Voilà pourquoi le Seigneur est en colère contre toi. Mais il guérira tous les maux qui se sont produits autrefois dans ta maisonnée. Car, à cause de leurs péchés et de leurs actes contraires à la loi, tu as toi-même été ruiné par les affaires de la vie.
  rationale: La révision restitue les compléments absents de « faire revenir », évite d’attribuer explicitement les maux passés à une action humaine, conserve la caractérisation présente de l’attachement aux enfants et rend plus directement la relation causale entre les fautes de la maisonnée et la ruine dans les affaires de la vie. Elle maintient l’ambiguïté du « nous, leurs parents » sans l’identifier ni l’expliquer doctrinalement.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:18:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'La finalité de la colère divine est mieux rendue en explicitant le double complément de ἐπιστρέψῃς (« vers le Seigneur et vers nous »). La formulation « maux commis autrefois » ajoute indûment l’idée que ces maux ont été commis : τὰ προγεγονότα πονηρά désigne les maux antérieurs/survenus auparavant. Le passif final appelle aussi plus directement l’idée d’une ruine causée « par » les affaires de la vie.'
  naturalness: Le français du projet est globalement clair et de registre approprié. « Ramener ta maison » est cependant elliptique sans les destinations explicites, et « parce que tu aimais tendrement » transforme inutilement le participe présent en affection révolue. « Maisonnée » rend naturellement le collectif familial visé par οἶκος.
  terminology: « Seigneur », « péchés », « actes contraires à la loi » et « affaires de la vie » sont des choix justes et accessibles. « Avertir » exprime νουθετεῖν sans réduire l’acte à une simple réprimande ponctuelle. Aucun terme doctrinal ne requiert de note.
  issues:
  - severity: medium
    issue: Le double complément de ἐπιστρέψῃς est incomplet.
    rationale: Le grec dit de faire revenir la maisonnée « vers le Seigneur et vers nous, leurs parents » ; le projet omet les compléments qui précisent ce retour.
  - severity: medium
    issue: « Maux commis autrefois » surinterprète τὰ προγεγονότα πονηρά.
    rationale: Le texte parle de tous les maux qui se sont produits auparavant dans la maisonnée, sans affirmer grammaticalement qu’ils ont été commis.
  - severity: low
    issue: Le temps et la portée de φιλότεκνος sont légèrement déplacés.
    rationale: Le participe présent χαρακτήrise Hermas comme étant attaché à ses enfants ; l’imparfait « tu aimais » le présente plutôt comme une disposition passée.
  - severity: low
    issue: La causalité de la ruine finale mérite d’être conservée explicitement.
    rationale: ἀπὸ τῶν βιωτικῶν πράξεων indique que la ruine est subie du fait/des suites des affaires de la vie, plutôt que simplement située « dans » celles-ci.
  revised_text: Mais ce n’est pas pour cela que Dieu est en colère contre toi, mais afin que tu fasses revenir vers le Seigneur et vers nous, leurs parents, ta maisonnée, qui a péché. Pourtant, parce que tu es attaché à tes enfants, tu n’as pas averti ta maisonnée, mais tu l’as laissée se corrompre gravement. Voilà pourquoi le Seigneur est en colère contre toi. Mais il guérira tous les maux qui se sont produits autrefois dans ta maisonnée. Car, à cause de leurs péchés et de leurs actes contraires à la loi, tu as toi-même été ruiné par les affaires de la vie.
