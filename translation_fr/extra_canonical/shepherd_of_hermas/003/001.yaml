base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/001.yaml
  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: fr
  text: Mais ce n’est pas pour cela que Dieu est en colère contre toi, mais afin que tu fasses revenir vers le Seigneur et vers nous, leurs parents, ta maisonnée, qui a péché. Pourtant, parce que tu es attaché à tes enfants, tu n’as pas averti ta maisonnée, mais tu l’as laissée se corrompre gravement. Voilà pourquoi le Seigneur est en colère contre toi. Mais il guérira tous les maux qui se sont produits autrefois dans ta maisonnée. Car, à cause de leurs péchés et de leurs actes contraires à la loi, tu as toi-même été ruiné par les affaires de la vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: maison
  rationale: Le terme désigne ici le foyer ou la maisonnée comme corps collectif. « Maison » conserve cette portée familiale et permet de préserver les reprises pronominales du grec.
- source_word: φιλότεκνος
  choice: parce que tu aimais tendrement tes enfants
  rationale: Cette formulation naturelle exprime l’affection parentale marquée du composé grec sans lui donner en elle-même une valeur négative.
- source_word: νουθετέω
  choice: reprendre
  rationale: Dans ce contexte parental, le verbe signifie avertir, corriger et remettre dans le droit chemin ; « reprendre » rend cette dimension corrective avec concision.
- source_word: καταφθαρῆναι / κατεφθάρης
  choice: sombrer dans une terrible corruption / être ruiné
  rationale: 'Le même verbe grec prend des nuances distinctes selon ses sujets : dégradation morale de la maison, puis ruine subie par Hermas dans ses affaires terrestres.'
- source_word: ἀνομήματα
  choice: actes contraires à la loi
  rationale: Cette expression garde la référence explicite à la transgression de la loi portée par le grec, plutôt que de la réduire au terme général « fautes ».
- source_word: βιωτικῶν πράξεων
  choice: affaires de ce monde
  rationale: L’expression vise les occupations et intérêts de la vie présente, probablement avec une dimension matérielle ; cette traduction reste assez large pour ne pas limiter le sens aux seules finances.
theological_decisions:
- issue: Finalité exprimée par ἵνα après la colère de Dieu
  choice: « c’est afin que tu ramènes ta maison »
  alternative: « mais il veut que tu ramènes ta maison »
  rationale: La traduction retenue conserve le lien grammatical direct entre la colère divine et son but correctif, sans l’atténuer ni préciser davantage la causalité théologique.
- issue: Promesse de guérison des maux passés
  choice: « il guérira tous les maux commis autrefois dans ta maison »
  alternative: « il réparera tout le mal survenu auparavant dans ta maison »
  rationale: « Guérira » maintient la métaphore explicite de ἰάσεται. « Commis » reflète la dimension morale du contexte, tout en laissant Dieu comme agent de restauration.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe collective de « maison » est maintenue malgré le passage grec au pluriel « leurs parents », afin de préserver la tension du texte source. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
