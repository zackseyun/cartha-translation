revisions:
- from: Mais la grande compassion du Seigneur a eu pitié de toi et de ta maison ; il te fortifiera et t’établira dans sa gloire. Toi, seulement, ne te laisse pas aller à la négligence ; prends courage et fortifie ta maison. Car, de même que le forgeron, en martelant son ouvrage, vient à bout de ce qu’il veut façonner, de même la parole juste répétée chaque jour vient à bout de toute méchanceté. Ne cesse donc pas d’avertir tes enfants, car je sais que, s’ils se repentent de tout leur cœur, ils seront inscrits dans les livres de la vie avec les saints.[a]
  to: Mais, dans sa grande compassion, le Seigneur a eu pitié de toi et de ta maison ; il te fortifiera et t’établira dans sa gloire. Seulement, ne te relâche pas ; prends courage et fortifie ta maison. Car, de même que le forgeron, en martelant son ouvrage, vient à bout de ce qu’il veut accomplir, de même la parole juste, donnée chaque jour, vient à bout de toute méchanceté. Ne cesse donc pas d’avertir tes enfants, car je sais que, s’ils se repentent de tout leur cœur, ils seront inscrits dans les livres de la vie avec les saints.[a]
  rationale: La révision élimine deux explicitations non imposées par le grec et allège une tournure française sans modifier le sens, la structure argumentative, le registre ni les termes théologiquement significatifs. La note est conservée, car le pluriel grec est bien attesté dans le texte fourni et la traduction le maintient.
