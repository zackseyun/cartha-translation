base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: fr
  text: Mais, dans sa grande compassion, le Seigneur a eu pitié de toi et de ta maison ; il te fortifiera et t’établira dans sa gloire. Seulement, ne te relâche pas ; prends courage et fortifie ta maison. Car, de même que le forgeron, en martelant son ouvrage, vient à bout de ce qu’il veut accomplir, de même la parole juste, donnée chaque jour, vient à bout de toute méchanceté. Ne cesse donc pas d’avertir tes enfants, car je sais que, s’ils se repentent de tout leur cœur, ils seront inscrits dans les livres de la vie avec les saints.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « les livres de la vie », au pluriel.
    reason: Signaler une formulation inhabituelle qu’il convient de conserver plutôt que de l’harmoniser avec le singulier biblique plus familier.
lexical_decisions:
- source_word: πολυσπλαγχνία
  choice: grande compassion
  rationale: Exprime la compassion profonde et abondante du Seigneur dans un français naturel, sans réduire le terme à la seule idée abstraite de miséricorde.
- source_word: οἶκος
  choice: maison
  rationale: Conserve l’image et la portée collective du grec, qui désigne ici la maisonnée ou le foyer, tout en assurant la cohérence avec l’exhortation concernant les enfants.
- source_word: ῥαθυμήσῃς
  choice: te laisse pas aller à la négligence
  rationale: Rend l’idée de relâchement, d’insouciance ou de mollesse morale plutôt que la seule paresse physique.
- source_word: εὐψύχει
  choice: prends courage
  rationale: Équivalent idiomatique moderne de l’appel à garder bon courage.
- source_word: περιγίνεται
  choice: vient à bout de
  rationale: Préserve dans les deux membres de la comparaison l’idée de l’emporter sur une difficulté ou de la maîtriser.
- source_word: ὁ λόγος ὁ καθημερινὸς ὁ δίκαιος
  choice: la parole juste répétée chaque jour
  rationale: Le grec qualifie la parole de quotidienne et juste ; « répétée » explicite naturellement qu’elle est prononcée jour après jour dans le contexte de l’exhortation familiale.
- source_word: νουθετῶν
  choice: avertir
  rationale: Rend une instruction correctrice et insistante dans un français courant, sans tonalité excessivement punitive.
- source_word: ἐγγραφήσονται
  choice: seront inscrits
  rationale: Reproduit l’image d’une inscription officielle dans les livres de la vie.
- source_word: ἅγιοι
  choice: saints
  rationale: Terme français traditionnel et direct pour les personnes consacrées à Dieu.
theological_decisions:
- issue: Condition entre repentance et inscription dans les livres de la vie
  choice: 'Conserver explicitement la condition : « s’ils se repentent… ils seront inscrits »'
  alternative: Reformuler comme une simple preuve qu’ils sont déjà inscrits
  rationale: La syntaxe grecque présente directement la repentance entière comme condition de l’inscription ; la traduction ne doit pas résoudre cette tension selon un système doctrinal ultérieur.
- issue: Singulier grec « maison » et pluralité des membres du foyer
  choice: Maintenir « ta maison »
  alternative: Employer partout « ta famille » ou « les membres de ton foyer »
  rationale: « Maison » conserve l’image collective du texte ancien et son lien avec l’autorité domestique d’Hermas, sans restreindre le référent aux seuls enfants.
- issue: « Livres de la vie » au pluriel
  choice: Conserver le pluriel
  alternative: Harmoniser avec la formule plus courante « le livre de vie »
  rationale: Le texte grec porte explicitement τὰς βίβλους, au pluriel ; l’harmonisation effacerait une particularité textuelle authentique.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement est maintenu parce que le discours grec s’adresse directement à Hermas au singulier. La répétition de « fortifier » et de « vient à bout de » reflète les reprises lexicales et la comparaison structurée du grec.
