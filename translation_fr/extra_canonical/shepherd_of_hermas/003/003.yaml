base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/003.yaml
  text: 'After she had stopped these words, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:'
translation:
  language: fr
  text: 'Après avoir fini de dire ces paroles, elle me dit : « Veux-tu m’entendre lire ? » Je lui répondis : « Oui, Dame. » Elle me dit : « Sois auditeur et écoute les gloires de Dieu. » J’entendis des choses grandes et merveilleuses, que je ne pus retenir ; car toutes les paroles étaient effrayantes, telles qu’un être humain ne peut les supporter. Je retins donc les dernières paroles, car elles étaient bienfaisantes et douces pour nous :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τὸ παῦσαι αὐτῆς τὰ ῥήματα ταῦτα
  choice: Après avoir fini de prononcer ces paroles
  rationale: Rend naturellement en français la construction grecque littérale « après qu’elle eut cessé ces paroles », dans le sens d’achever de les dire.
- source_word: Θέλεις ἀκοῦσαί μου ἀναγινωσκούσης
  choice: Veux-tu m’entendre lire ?
  rationale: Conserve l’idée explicite d’une lecture faite à voix haute.
- source_word: Γενοῦ ἀκροατὴς
  choice: Sois attentif
  rationale: Le littéral « deviens auditeur » serait peu naturel ; l’expression grecque appelle Hermas à se mettre en position d’écouter.
- source_word: τὰς δόξας τοῦ Θεοῦ
  choice: les gloires de Dieu
  rationale: Maintient le pluriel et l’expression théologique du grec sans la réduire à de simples « merveilles ».
- source_word: μεγάλως καὶ θαυμαστῶς
  choice: des choses grandioses et merveilleuses
  rationale: Les adverbes qualifient ici la nature impressionnante de ce qui est entendu ; cette formulation française suit le sens contextuel.
- source_word: ἔκφρικτα
  choice: redoutables
  rationale: Exprime l’effroi mêlé de saisissement suscité par ces paroles, sans imposer le sens plus étroit de « terrifiantes ».
- source_word: σύμφορα καὶ ἥμερα
  choice: bienfaisantes et douces
  rationale: Rend à la fois leur utilité favorable et leur caractère apaisé, par contraste avec les paroles précédentes.
theological_decisions:
- issue: Sens de « les gloires de Dieu »
  choice: Conserver l’expression plurielle
  alternative: Traduire par « les merveilles de Dieu » ou « la gloire de Dieu »
  rationale: Le texte grec emploie explicitement δόξας au pluriel ; la traduction préserve cette formulation ouverte, qui peut désigner des manifestations, proclamations ou réalités glorieuses.
translation_notes:
  register: Français moderne, digne et fluide. Le récit au passé est privilégié malgré les présents historiques grecs. « Dame » conserve la déférence de κυρία et la tonalité ancienne du dialogue sans employer le plus féodal « ma Dame ».
