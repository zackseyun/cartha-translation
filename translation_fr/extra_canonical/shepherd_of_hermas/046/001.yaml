  text: 'But I, the angel of repentance, say to you: do not fear the devil. For I was sent," he says, "to be with you who are repenting with all your heart and to streng—'
translation:
  language: fr
  text: '« Mais moi, l’ange de la repentance, je vous dis : ne craignez pas le diable. Car j’ai été envoyé, dit-il, pour être avec vous, ceux qui se repentent de tout leur cœur, et pour vous forti— »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοια / μετανοούντων
  choice: repentance / vous repentez
  rationale: Rend le changement intérieur et le retour moral impliqués par le grec, tout en conservant le lien lexical entre le titre de l’ange et les personnes concernées.
- source_word: μὴ φοβήθητε
  choice: ne craignez pas
  rationale: Impératif négatif naturel en français, fidèle à l’aoriste grec sans surinterpréter sa valeur aspectuelle.
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: de tout votre cœur
  rationale: Le grec passe grammaticalement à la troisième personne, mais le référent demeure les destinataires directement interpellés par ὑμῖν et μεθ’ ὑμῶν ; le français maintient cette adresse naturelle.
- source_word: ἰσχυρο-
  choice: forti—
  rationale: Le mot source est tronqué à la fin du segment ; la traduction reproduit cette coupure sans compléter conjecturalement le verbe.
theological_decisions:
- issue: Fonction de l’ange et portée de la repentance
  choice: « l’ange de la repentance » et « vous qui vous repentez »
  alternative: « l’ange du repentir » et « vous qui changez de conduite »
  rationale: La formulation retenue préserve la répétition théologique du même champ lexical grec et n’impose pas une définition confessionnelle plus étroite.
- issue: Changement de personne dans la phrase
  choice: Maintenir la deuxième personne en français
  alternative: « ceux qui se repentent de tout leur cœur »
  rationale: La troisième personne grecque est intégrée à une adresse directe (« avec vous »). La deuxième personne est plus claire en français et correspond au référent, sans modifier le contenu.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La ponctuation fait ressortir la déclaration de l’ange. Le tiret final signale que le segment source s’interrompt au milieu d’un mot ; aucune restitution du texte suivant n’est introduite.
