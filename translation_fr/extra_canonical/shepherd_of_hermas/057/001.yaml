  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: fr
  text: 'Je lui dis : « Seigneur, explique-moi encore ceci. » Il répond : « Que cherches-tu à savoir ? » Je dis : « Alors, Seigneur, ceux qui vivent dans les plaisirs et sont trompés sont-ils tourmentés pendant le même temps que dure leur tromperie ? » « Car le temps de la tromperie est d’une heure, dit-il, mais une heure de tourment équivaut à trente jours. Si donc quelqu’un vit dans les plaisirs et est trompé pendant un jour, puis subit le tourment pendant un jour, ce jour de tourment équivaut à une année entière. Ainsi, autant de jours quelqu’un vit dans les plaisirs, autant d’années il est tourmenté. Tu vois donc, dit-il, que le temps des plaisirs et de la tromperie est très court, tandis que celui du châtiment et du tourment est long. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶντες / τρυφήσῃ / τρυφῆς
  choice: ceux qui vivent dans les plaisirs / vit dans les plaisirs / plaisirs
  rationale: Le verbe et le nom évoquent une vie de jouissance ou de complaisance luxueuse. « Vivre dans les plaisirs » est naturel en français et conserve la portée morale sans ajouter une précision absente du grec.
- source_word: ἀπατώμενοι / ἀπάτης / ἀπατηθῇ
  choice: s’égarent / égarement / s’égare
  rationale: La forme passive peut signifier « être trompé » ou « s’égarer ». Le contexte associe cet état aux plaisirs coupables; « s’égarer » préserve l’idée d’erreur sans imposer l’intervention explicite d’un trompeur.
- source_word: βασανίζονται / βασάνου / βασανισθῇ
  choice: sont tourmentés / tourment / subit le tourment
  rationale: « Tourment » rend la force punitive de βάσανος et maintient sa distinction avec τιμωρία, traduit par « châtiment ».
- source_word: δύναμιν ἔχει / ἰσχύει
  choice: équivaut à
  rationale: Dans ce calcul temporel, les deux expressions indiquent la valeur ou la portée correspondante d’une unité de tourment.
- source_word: τιμωρίας
  choice: châtiment
  rationale: Ce terme désigne ici une sanction punitive et se distingue du « tourment » qui l’accompagne.
theological_decisions:
- issue: Rapport entre la durée du plaisir fautif et celle du tourment
  choice: 'Conserver littéralement la proportion énoncée : un jour de tourment équivaut à une année entière, et les jours de plaisir correspondent à des années de tourment.'
  alternative: Interpréter explicitement ce calcul comme une image symbolique ou comme une doctrine précise de la durée du châtiment.
  rationale: Le passage formule lui-même la proportion sans en expliquer le statut littéral ou figuré. La traduction ne doit pas trancher cette question théologique.
- issue: Sens passif ou moyen de ἀπατάομαι
  choice: Employer « s’égarer » dans le texte.
  alternative: « être trompé »
  rationale: Les deux nuances sont possibles. « S’égarer » s’intègre naturellement à la responsabilité morale évoquée, tout en évitant de désigner un agent trompeur que le texte ne nomme pas.
translation_notes:
  register: 'Français moderne, international et digne. Le dialogue est ponctué pour clarifier les changements de locuteur, notamment la réponse explicative après la question. Le vocabulaire reste accessible tout en conservant les répétitions structurantes du grec : plaisirs, égarement, châtiment et tourment.'
