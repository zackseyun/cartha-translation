  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/017.yaml
  text: 21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit, but keep away from the other.”
translation:
  language: fr
  text: 21. Tu vois donc que les très petites choses qui tombent d’en haut sur la terre ont une grande puissance ; de même, l’esprit divin qui vient d’en haut est puissant. Mets ta confiance en cet esprit, mais tiens-toi loin de l’autre. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἄνωθεν ἐλάχιστα
  choice: les choses qui viennent d’en haut, si petites soient-elles
  rationale: Rend naturellement en français la petitesse extrême et l’origine céleste exprimées par le grec, sans limiter l’image à un objet précis.
- source_word: μεγάλην δύναμιν ἔχει
  choice: ont une grande puissance
  rationale: Conserve le terme δύναμις et son contraste avec la petitesse des réalités évoquées.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: l’Esprit divin
  rationale: Traduction directe qui maintient l’identification explicite de cet esprit à la sphère divine.
- source_word: πίστευε
  choice: Mets donc ta confiance
  rationale: Le datif qui suit indique ici la confiance placée en quelqu’un ou quelque chose; cette formulation est idiomatique et plus précise que «crois» seul.
- source_word: ἀπέχου
  choice: tiens-toi loin
  rationale: Exprime l’idée durable de se garder à distance de l’autre esprit.
theological_decisions:
- issue: Capitalisation de πνεῦμα dans la comparaison entre l’esprit divin et l’autre esprit
  choice: «l’Esprit divin» et «cet Esprit», mais «l’autre»
  alternative: 'Tout écrire avec une minuscule: «l’esprit divin», «cet esprit»'
  rationale: La majuscule française signale clairement la référence à l’Esprit venant de Dieu, tandis que le texte conserve le contraste avec l’esprit terrestre mentionné dans le contexte, sans préciser davantage sa nature.
translation_notes:
  register: Français moderne, clair et digne. La structure comparative du grec est conservée, avec une légère réorganisation syntaxique pour éviter une tournure lourde. Aucun ajout explicatif ni précision doctrinale n’a été introduit.
