  to: 4. Ainsi donc, tous ceux qui sont forts dans la foi du Seigneur et qui ont revêtu la vérité ne s’attachent pas à de tels esprits, mais s’en tiennent éloignés. En revanche, ceux qui sont partagés et se repentent souvent pratiquent la divination comme les nations et s’attirent un péché plus grave en pratiquant l’idolâtrie. En effet, celui qui consulte un faux prophète au sujet d’une affaire quelconque est idolâtre, vide de vérité et insensé.
