  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/004.yaml
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: fr
  text: 4. Ainsi donc, tous ceux qui sont forts dans la foi du Seigneur et qui ont revêtu la vérité ne s’attachent pas à de tels esprits, mais s’en tiennent éloignés. En revanche, ceux qui sont partagés et se repentent souvent pratiquent la divination comme les nations et s’attirent un péché plus grave en pratiquant l’idolâtrie. En effet, celui qui consulte un faux prophète au sujet d’une affaire quelconque est idolâtre, vide de vérité et insensé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι
  choice: ceux qui sont partagés
  rationale: Le terme désigne des personnes intérieurement divisées ou irrésolues. « Partagés » restitue cette dualité de manière naturelle sans réduire le sens à un simple doute intellectuel.
- source_word: πυκνῶς μετανοοῦσι
  choice: se repentent souvent
  rationale: Traduction directe qui conserve la critique paradoxale de repentirs fréquents, vraisemblablement instables ou sans effet durable, sans expliciter davantage que le grec.
- source_word: μαντεύονται
  choice: consultent les devins
  rationale: Le moyen grec peut exprimer le recours à la divination. Dans le contexte immédiat, ces personnes viennent interroger un faux prophète; cette formulation française rend clairement l’action visée.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Choix formel et historiquement approprié pour les peuples non juifs ou non chrétiens, en préservant la catégorie religieuse du texte ancien.
- source_word: κενὸς ἀπὸ τῆς ἀληθείας
  choice: vide de vérité
  rationale: Conserve l’image forte de vacuité employée à plusieurs reprises dans le passage.
- source_word: ἄφρων
  choice: insensé
  rationale: Terme français digne et courant qui exprime le défaut de discernement moral et spirituel.
theological_decisions:
- issue: Rapport entre consultation d’un faux prophète et idolâtrie
  choice: « est idolâtre »
  alternative: « se rend coupable d’idolâtrie »
  rationale: Le grec εἰδωλολάτρης ἐστὶν formule directement une identité ou caractérisation. La traduction conserve cette force sans l’atténuer.
- issue: Sens de repentirs répétés
  choice: Conserver « se repentent souvent » sans commentaire interprétatif
  alternative: « changent souvent d’avis » ou « se repentent sans cesse mais sans fermeté »
  rationale: μετανοοῦσι porte normalement le sens de repentir, mais le contexte suggère l’inconstance. Il convient de préserver cette tension plutôt que de la résoudre dans le corps du texte.
translation_notes:
  register: Français moderne international, clair et digne. La syntaxe garde le contraste argumentatif du grec. « De tels esprits » renvoie aux esprits associés aux faux prophètes dans le contexte précédent; aucune précision confessionnelle n’est ajoutée.
