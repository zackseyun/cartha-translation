  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the servants of God—of the double‑minded, not of the faithful.
translation:
  language: fr
  text: '1 Il me montra des hommes assis sur un banc, et un autre homme assis sur un siège. Il me dit : « Vois-tu ceux qui sont assis sur le banc ? »


    « Oui, je les vois, maître », répondis-je.


    « Ceux-ci sont des fidèles, dit-il, et l’homme assis sur le siège est un faux prophète qui ruine le discernement des serviteurs de Dieu : il perd ceux qui ont le cœur partagé, non les fidèles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλλιον
  choice: banc
  rationale: Le terme désigne un siège où plusieurs personnes prennent place ensemble ; « banc » rend naturellement le contraste avec le siège individuel.
- source_word: καθέδρα
  choice: siège
  rationale: Le mot désigne ici un siège individuel, possiblement distinctif ou honorifique. « Siège » conserve cette portée sans préciser indûment « chaire » ou « trône ».
- source_word: κύριε
  choice: maître
  rationale: Dans cette adresse respectueuse au personnage qui instruit Hermas, « maître » est plus naturel et digne que « monsieur », sans identifier abusivement l’interlocuteur au Seigneur Dieu.
- source_word: διάνοια
  choice: intelligence
  rationale: Le terme renvoie à la faculté de comprendre et de discerner ; « intelligence » convient au contexte de l’influence trompeuse du faux prophète.
- source_word: δίψυχοι
  choice: hommes au cœur partagé
  rationale: Le grec évoque littéralement des personnes à l’âme double, divisées ou hésitantes. Cette expression française intelligible conserve l’idée d’une division intérieure sans la réduire à une simple indécision passagère.
- source_word: ἀπόλλυσι
  choice: ruine
  rationale: Le verbe exprime une destruction grave. « Ruine l’intelligence » reste fort tout en étant idiomatique en français.
theological_decisions:
- issue: Portée de la destruction exercée par le faux prophète
  choice: « celle des hommes au cœur partagé, mais non celle des fidèles »
  alternative: « il fait périr les hommes au cœur partagé, mais non les fidèles »
  rationale: La construction grecque reprend naturellement « l’intelligence » comme objet sous-entendu. La traduction maintient donc l’affirmation selon laquelle le faux prophète ruine leur discernement, plutôt que d’introduire explicitement leur perdition personnelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue est présenté avec une ponctuation naturelle, et la répétition du texte grec est largement conservée. Le contraste visuel entre le groupe sur le banc et l’homme seul sur un siège demeure perceptible sans surinterpréter le statut de ce dernier.
