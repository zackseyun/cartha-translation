  to: '1 Il me montra des hommes assis sur un banc, et un autre homme assis sur un siège. Il me dit : « Vois-tu ceux qui sont assis sur le banc ? »


    « Oui, je les vois, maître », répondis-je.


    « Ceux-ci sont des fidèles, dit-il, et l’homme assis sur le siège est un faux prophète qui ruine le discernement des serviteurs de Dieu : il perd ceux qui ont le cœur partagé, non les fidèles. »'
  rationale: 'La révision corrige l''antécédent implicite du second ἀπόλλυσιν afin de respecter la syntaxe et le sens du grec : le faux prophète ruine le discernement des serviteurs de Dieu et perd les personnes au cœur partagé, mais non les fidèles. Le reste du texte est conservé avec de légers ajustements stylistiques sans changement interprétatif.'
