  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: fr
  text: 13. De plus, il ne s’approche nullement d’une assemblée d’hommes justes, mais il les évite. Il s’attache à ceux qui ont l’âme partagée et qui sont vains, et il leur prophétise dans un coin. Il les trompe en leur disant, selon leurs désirs, toutes sortes de choses vaines ; car il répond lui aussi à des gens vains. En effet, un récipient vide, mis avec des récipients vides, ne se brise pas, mais ils s’accordent les uns avec les autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγὴν ἀνδρῶν δικαίων
  choice: une assemblée d’hommes justes
  rationale: « Assemblée » rend le sens général de συναγωγή sans suggérer nécessairement l’institution appelée synagogue; « hommes justes » conserve explicitement ἀνδρῶν δικαίων.
- source_word: διψύχοις
  choice: gens partagés
  rationale: Le terme désigne littéralement ceux qui ont une âme divisée; « partagés » conserve l’idée d’indécision intérieure dans un français naturel.
- source_word: κενοῖς / κενῶς
  choice: vides / sans aucun contenu
  rationale: La répétition autour du vide structure l’image du passage. La variation grammaticale française permet de préserver cette idée sans produire une tournure artificielle.
- source_word: κατὰ γωνίαν
  choice: à l’écart
  rationale: L’expression signifie littéralement « dans un coin » et évoque ici une activité privée, hors de l’assemblée; « à l’écart » est idiomatique tout en gardant cette opposition.
- source_word: συντιθέμενον
  choice: placé avec
  rationale: Dans l’image des récipients, cette formulation rend simplement l’association ou la mise ensemble exprimée par le participe.
- source_word: συμφωνοῦσιν ἀλλήλοις
  choice: ils sont en accord les uns avec les autres
  rationale: Rend directement l’idée d’accord mutuel, qui explique pourquoi le faux prophète et son public se conviennent.
theological_decisions:
- issue: Sens moral de διψύχοις
  choice: gens partagés
  alternative: gens indécis / hommes à l’âme double
  rationale: Le choix évite de réduire le terme à une hésitation passagère et conserve l’idée d’une division intérieure, sans lui imposer une définition doctrinale.
- issue: Portée de συναγωγή
  choice: assemblée
  alternative: synagogue / réunion
  rationale: Le contexte oppose la communauté des justes aux consultations privées du faux prophète; « assemblée » garde cette portée communautaire sans anachronisme institutionnel.
translation_notes:
  register: Français moderne, international et digne. La traduction conserve les répétitions rhétoriques sur le « vide » tout en clarifiant les rapports syntaxiques. Aucun marqueur de note n’est requis.
