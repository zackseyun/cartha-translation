revisions:
- from: '13. Ensuite, il ne s’approche jamais d’une assemblée d’hommes justes, mais il les fuit. Il s’attache plutôt aux gens partagés et vides, et il prophétise pour eux à l’écart. Il les trompe en leur disant, sans aucun contenu, tout ce qui correspond à leurs désirs, car c’est à des gens vides qu’il répond. En effet, lorsqu’un récipient vide est placé avec d’autres récipients vides, il ne se brise pas : ils sont en accord les uns avec les autres.'
  to: 13. De plus, il ne s’approche nullement d’une assemblée d’hommes justes, mais il les évite. Il s’attache à ceux qui ont l’âme partagée et qui sont vains, et il leur prophétise dans un coin. Il les trompe en leur disant, selon leurs désirs, toutes sortes de choses vaines ; car il répond lui aussi à des gens vains. En effet, un récipient vide, mis avec des récipients vides, ne se brise pas, mais ils s’accordent les uns avec les autres.
  rationale: La révision supprime une nuance absente du grec, rend διψύχοις de manière plus intelligible en français moderne et rétablit l’image concrète de « dans un coin ». Elle maintient la cohérence rhétorique entre le caractère vain du faux prophète et de ses auditeurs, puis l’image matérielle des récipients vides, sans ajout interprétatif.
  reviewer_model: gpt-5.6-terra
