review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, notamment l’évitement de l’assemblée des justes et l’image finale des récipients vides. Toutefois, « plutôt » n’est pas exprimé par le grec, « gens partagés » est peu naturel en français, et « à l’écart » atténue inutilement l’image concrète de κατὰ γωνίαν (« dans un coin »).
  naturalness: La version est globalement claire et de registre approprié, mais « des gens partagés et vides » et « c’est à des gens vides qu’il répond » sonnent artificiels. Une légère révision permet de garder la répétition voulue autour du vide avec une syntaxe française plus fluide.
  terminology: « Assemblée d’hommes justes » est fidèle à συναγωγὴν ἀνδρῶν δικαίων. « Ceux qui ont l’âme partagée » rend plus explicitement et naturellement διψύχοις, sans figer le terme dans une interprétation confessionnelle. Le champ lexical de κενός est maintenu par « vains/vaines » dans le discours et « vides » dans l’image des récipients.
  issues:
  - severity: low
    issue: Ajout de « plutôt »
    rationale: Le grec oppose les groupes par δέ (« mais »), sans marquer une préférence supplémentaire.
  - severity: medium
    issue: « gens partagés et vides » est maladroit et insuffisamment explicite
    rationale: διψύχοι désigne des personnes intérieurement divisées; « ceux qui ont l’âme partagée » est plus idiomatique et plus proche de la formation du mot. « Vides » est conservé là où l’image l’exige, tandis que « vains » convient mieux pour qualifier des personnes et leurs paroles.
  - severity: low
    issue: « à l’écart » généralise l’image spatiale
    rationale: κατὰ γωνίαν signifie littéralement « dans un coin »; cette formulation française reste naturelle et préserve le contraste avec l’assemblée.
