base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/012.yaml
  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: fr
  text: 12. Tout d’abord, cet homme qui semble avoir un esprit s’élève lui-même et veut occuper la première place. Il devient aussitôt présomptueux, effronté et bavard ; il vit au milieu de nombreux plaisirs et de bien d’autres tromperies, et il reçoit un salaire pour sa prophétie. S’il ne reçoit rien, il ne prophétise pas. Un esprit divin peut-il donc recevoir un salaire et prophétiser ? Un prophète de Dieu ne peut agir ainsi ; l’esprit de tels prophètes est au contraire terrestre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δοκῶν πνεῦμα ἔχειν
  choice: qui prétend avoir un esprit
  rationale: Dans ce portrait dénonciateur, δοκῶν indique qu’il paraît ou passe pour avoir un esprit sans que cette prétention soit validée. « Prétend » rend naturellement cette réserve en français.
- source_word: πρωτοκαθεδρίαν
  choice: la première place
  rationale: Le terme désigne la place d’honneur ou le siège principal. « La première place » conserve l’idée de préséance dans un français courant.
- source_word: ἰταμός
  choice: présomptueux
  rationale: Le mot évoque l’audace arrogante ou insolente ; « présomptueux » convient au contexte d’autoélévation.
- source_word: ἀναιδής
  choice: effronté
  rationale: Rend directement l’absence de retenue ou de honte exprimée par le grec.
- source_word: ἐν τρυφαῖς πολλαῖς ἀναστρεφόμενος
  choice: il vit au milieu de nombreux plaisirs
  rationale: ἀναστρέφομαι décrit la manière de vivre, tandis que τρυφαί évoque les plaisirs, le luxe ou la mollesse. La formulation reste naturelle sans réduire le sens à la seule richesse.
- source_word: μισθὸν λαμβάνει
  choice: il reçoit un salaire
  rationale: μισθός est une rémunération versée en contrepartie d’un service ; « salaire » préserve ici la critique de la prophétie intéressée.
- source_word: ἐπίγειον
  choice: terrestre
  rationale: Conserve le contraste explicite, développé dans le passage, entre l’esprit qui vient d’en haut et l’esprit terrestre dépourvu de puissance.
theological_decisions:
- issue: Le sens de « prophète de Dieu » dans la question rhétorique
  choice: Un prophète de Dieu ne peut agir ainsi
  alternative: Il n’est pas permis à un prophète de Dieu d’agir ainsi
  rationale: οὐκ ἐνδέχεται exprime l’impossibilité ou l’incompatibilité. La traduction retenue maintient l’affirmation absolue du texte sans préciser davantage s’il s’agit d’une impossibilité morale ou essentielle.
- issue: Identification de l’« esprit » prétendument possédé
  choice: un esprit
  alternative: l’Esprit
  rationale: Le grec πνεῦμα est sans qualificatif à cet endroit et le contexte met précisément en question sa nature. La minuscule et l’indéfini préservent cette ambiguïté jusqu’au contraste avec « un esprit divin » et « terrestre ».
translation_notes:
  register: Français moderne, clair et digne. Le rythme accumulatif du portrait grec est conservé, avec une ponctuation adaptée à la lisibilité. Aucun marqueur de note n’est requis.
