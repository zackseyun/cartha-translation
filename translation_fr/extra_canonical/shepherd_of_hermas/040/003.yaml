base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/003.yaml
  text: 3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.
translation:
  language: fr
  text: 3. En effet, puisqu’il est vide, il répond par des paroles vides à des gens vides. Car, quelle que soit la question qu’on lui pose, il répond en fonction du vide de la personne. Pourtant, il prononce aussi quelques paroles vraies, car le diable le remplit de son propre esprit, dans l’espoir de pouvoir arracher certains des justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενὸς / κενὰ / κενοῖς / κένωμα
  choice: vide / paroles vides / gens vides / vide
  rationale: La répétition insistante de la même famille lexicale structure la phrase grecque. La conserver rend le jeu rhétorique et le jugement spirituel du texte sans l’expliquer à la place de l’auteur.
- source_word: ἀποκρίνεται
  choice: il répond
  rationale: Équivalent direct et naturel, repris deux fois comme dans le grec.
- source_word: τινὰ ... ῥήματα ἀληθῆ
  choice: quelques paroles vraies
  rationale: Traduction proche qui préserve l’idée troublante qu’un faux prophète peut néanmoins énoncer certaines choses vraies.
- source_word: ῥῆξαι
  choice: arracher
  rationale: Dans ce contexte, le verbe évoque le fait de détacher violemment quelqu’un du groupe des justes ou de la foi; « arracher » conserve cette force sans préciser davantage l’objet implicite.
theological_decisions:
- issue: Le faux prophète peut prononcer des paroles vraies.
  choice: « il prononce aussi quelques paroles vraies »
  alternative: « il dit parfois la vérité »
  rationale: 'La formulation retenue suit la portée limitée du grec: certaines paroles sont vraies, sans attribuer au faux prophète une véracité générale.'
- issue: Action du diable au moyen de « son propre esprit ».
  choice: « le diable le remplit de son propre esprit »
  alternative: « le diable le remplit de son esprit »
  rationale: « Propre » rend αὐτοῦ et maintient la distinction avec l’Esprit divin développée dans le contexte.
- issue: Valeur de la proposition εἴ τινα δυνήσεται ῥῆξαι.
  choice: « dans l’espoir de pouvoir arracher certains des justes »
  alternative: « pour voir s’il pourra arracher l’un des justes »
  rationale: Le tour grec exprime une tentative ou une éventualité. « Dans l’espoir de » la restitue naturellement sans présenter la réussite comme certaine; le pluriel « certains » rend τινα, morphologiquement compatible avec le génitif pluriel τῶν δικαίων.
translation_notes:
  register: Français moderne, digne et accessible. La quadruple répétition autour du « vide » est volontairement maintenue, malgré sa rudesse, parce qu’elle porte l’effet littéraire et moral de l’original.
