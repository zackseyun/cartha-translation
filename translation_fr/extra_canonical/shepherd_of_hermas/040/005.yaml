  to: 5. En effet, aucun esprit donné par Dieu ne se consulte ; mais, puisqu’il possède la puissance de la divinité, il dit tout de lui-même, car il est d’en haut, issu de la puissance de l’Esprit divin.
  rationale: Révision limitée à des améliorations de fidélité idiomatique et de fluidité. La traduction maintient l’opposition contextuelle entre l’esprit divin, qui parle sans être interrogé, et l’esprit terrestre décrit au verset suivant. Elle ne transforme pas « de lui-même » en une affirmation d’autonomie à l’égard de Dieu.
