  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/005.yaml
  text: 5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.
translation:
  language: fr
  text: 5. En effet, aucun esprit donné par Dieu ne se consulte ; mais, puisqu’il possède la puissance de la divinité, il dit tout de lui-même, car il est d’en haut, issu de la puissance de l’Esprit divin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτᾶται
  choice: n’est consulté
  rationale: Le passif exprime le fait d’être interrogé ou sollicité pour obtenir un oracle ; « consulté » est naturel en français et convient au contexte prophétique.
- source_word: δύναμιν τῆς θεότητος
  choice: la puissance de la divinité
  rationale: Traduction formelle qui conserve la formulation abstraite du grec sans l’identifier plus précisément à une personne divine.
- source_word: ἀφ’ ἑαυτοῦ λαλεῖ πάντα
  choice: il parle de lui-même en toute chose
  rationale: Cette formulation conserve l’idée que l’esprit parle sans être sollicité. « En toute chose » rend πάντα sans suggérer nécessairement une omniscience exhaustive.
- source_word: ἄνωθέν ἐστιν
  choice: il vient d’en haut
  rationale: Dans le contexte, ἐστιν indique l’origine ; « vient d’en haut » est plus idiomatique que « est d’en haut » tout en préservant l’opposition entre céleste et terrestre.
- source_word: τοῦ θείου πνεύματος
  choice: de l’Esprit divin
  rationale: La majuscule reflète ici la référence au souffle venant de Dieu dans le contexte immédiat, sans ajouter de formulation trinitaire absente du texte.
theological_decisions:
- issue: Relation entre l’esprit donné par Dieu et l’Esprit divin
  choice: 'Conserver les deux expressions distinctes : « esprit donné par Dieu » et « Esprit divin »'
  alternative: Uniformiser les deux en « Saint-Esprit »
  rationale: Le grec emploie πνεῦμα ἀπὸ Θεοῦ δοθέν puis θεῖον πνεῦμα. La traduction respecte cette variation et n’importe pas une précision terminologique supplémentaire.
- issue: Sens de ἀφ’ ἑαυτοῦ
  choice: « de lui-même », au sens de parler spontanément sans consultation humaine
  alternative: « de sa propre autorité » ou « par lui-même »
  rationale: Le contexte oppose l’esprit divin, qui prend l’initiative de parler, à l’esprit terrestre qui ne parle que lorsqu’on l’interroge. La formule ne doit pas être comprise comme une indépendance à l’égard de Dieu.
translation_notes:
  register: Français moderne, digne et accessible. La structure antithétique du grec est rendue par « au contraire ». Aucun appel de note n’est requis.
