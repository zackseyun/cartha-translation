  to: '20. Considère maintenant la puissance qui vient d’en haut. Le grêlon est un tout petit grain ; pourtant, lorsqu’il tombe sur la tête de quelqu’un, quelle douleur il provoque ! Ou bien considère encore une goutte qui tombe d’une tuile jusqu’au sol : elle perce la pierre.'
