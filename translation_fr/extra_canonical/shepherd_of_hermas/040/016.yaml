  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/016.yaml
  text: 20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.
translation:
  language: fr
  text: '20. Considère maintenant la puissance qui vient d’en haut. Le grêlon est un tout petit grain ; pourtant, lorsqu’il tombe sur la tête de quelqu’un, quelle douleur il provoque ! Ou bien considère encore une goutte qui tombe d’une tuile jusqu’au sol : elle perce la pierre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβε
  choice: Considère
  rationale: Dans cette démonstration par analogie, l’impératif invite à prendre un exemple en considération plutôt qu’à saisir matériellement quelque chose.
- source_word: δύναμιν
  choice: puissance
  rationale: Conserve le lien conceptuel avec la puissance d’en haut et la capacité d’agir du souffle divin dans le contexte.
- source_word: χάλαζα
  choice: grêlon
  rationale: Le grec désigne ici la grêle concrétisée en un très petit grain qui tombe sur la tête.
- source_word: κοκκάριον
  choice: grain
  rationale: Rend le diminutif grec de façon naturelle avec « tout petit ».
- source_word: κεράμου
  choice: d’une tuile
  rationale: Le génitif renvoie vraisemblablement à une tuile de toiture, point depuis lequel tombe la goutte.
- source_word: τρυπᾷ
  choice: elle finit par creuser
  rationale: Exprime l’action progressive d’une goutte répétée sur la pierre, implicite dans l’image, sans employer l’étrange « percer la pierre » en français courant.
theological_decisions:
- issue: Sens de la « puissance qui vient d’en haut »
  choice: Maintenir la formule sans préciser ici qu’il s’agit du souffle divin
  alternative: « la puissance du souffle qui vient d’en haut »
  rationale: Le verset 21 explicite l’application au souffle divin ; le verset 20 présente d’abord l’analogie et sa formulation générale doit être conservée.
translation_notes:
  register: Français moderne, clair et digne. La structure parallèle des deux exemples naturels est conservée. Aucun marqueur de note n’est nécessaire.
