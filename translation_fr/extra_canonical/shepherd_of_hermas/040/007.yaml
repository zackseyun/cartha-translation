  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: fr
  text: '7. « Comment donc, dis-je, Seigneur, un homme saura-t-il lequel est prophète et lequel est faux-prophète ? » Il me répond : « Écoute ce qui concerne les deux prophètes ; selon ce que je vais te dire, tu mettras à l’épreuve le prophète et le faux-prophète. Évalue d’après sa conduite l’homme qui a l’esprit divin. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Dans le dialogue, Hermas s’adresse avec respect à son interlocuteur céleste. « Seigneur » conserve la portée honorifique du grec et la continuité du registre de l’œuvre.
- source_word: δοκιμάσεις / δοκίμαζε
  choice: discerneras / reconnaître
  rationale: Le verbe δοκιμάζω signifie mettre à l’épreuve afin d’établir l’authenticité. La variation française évite une répétition lourde tout en conservant l’idée d’un examen fondé sur des critères.
- source_word: ἀπὸ τῆς ζωῆς
  choice: à sa manière de vivre
  rationale: Le grec renvoie à la conduite observable, non au simple fait d’être vivant. Cette formulation est naturelle et rend explicitement la valeur éthique de ζωή dans le contexte.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: l’Esprit divin
  rationale: La majuscule signale que le texte parle de l’Esprit venant de Dieu, comme le contexte immédiat le précise, sans ajouter une formulation trinitaire absente de cette phrase.
- source_word: τίς αὐτῶν
  choice: lequel d’entre eux
  rationale: Cette formulation conserve le renvoi aux deux types de personnes ou de prophètes mentionnés dans la question.
theological_decisions:
- issue: Critère de discernement du véritable prophète
  choice: « C’est à sa manière de vivre que tu dois reconnaître… »
  alternative: « Éprouve par sa vie… »
  rationale: Le texte présente la conduite comme critère d’authenticité spirituelle. La traduction préserve ce lien sans suggérer que la vie elle-même doit être mise à l’épreuve.
- issue: Identification de πνεῦμα θεῖον
  choice: « l’Esprit divin »
  alternative: « un esprit divin »
  rationale: L’article défini et le contexte opposant l’Esprit venu d’en haut à l’esprit terrestre favorisent la référence déterminée à l’Esprit de Dieu, tout en évitant de développer davantage la formulation théologique.
translation_notes:
  register: Français moderne, digne et accessible. Le dialogue direct et l’enchaînement question-réponse du grec sont conservés. « Manière de vivre » exprime clairement la conduite morale visée par ζωή.
