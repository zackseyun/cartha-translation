  text: 11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.
translation:
  language: fr
  text: 11. « Écoute maintenant, dit-il, au sujet de l’esprit terrestre, vide, sans puissance et insensé. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίγειος
  choice: terrestre
  rationale: Rend directement l’opposition du contexte entre l’esprit qui vient d’en haut et celui qui appartient à la terre.
- source_word: κενός
  choice: vide
  rationale: Conserve l’image répétée du vide, importante dans le développement qui précède et qui suit.
- source_word: δύναμιν μὴ ἔχοντος
  choice: dépourvu de puissance
  rationale: Formulation française naturelle qui préserve l’absence totale de puissance affirmée par le grec.
- source_word: μωρός
  choice: qui n’est que folie
  rationale: Dans ce contexte, le qualificatif porte sur l’esprit; cette tournure dignifiée exprime son caractère insensé sans suggérer qu’il s’agit d’une personne.
theological_decisions:
- issue: Nature de « l’esprit » décrit
  choice: Maintenir le terme général « esprit » sans préciser son identité.
  alternative: Traduire ou expliciter par « esprit mauvais » ou « esprit de faux prophète ».
  rationale: Le grec dit simplement τὸ πνεῦμα et le contexte permet plusieurs nuances; l’explicitation résoudrait indûment cette ouverture.
translation_notes:
  register: Français moderne, clair et digne. Le discours direct et la formule « ce qu’il en est de » donnent une lecture naturelle tout en conservant les quatre caractérisations grecques.
