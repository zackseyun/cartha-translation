base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: fr
  text: 9. Quand donc l’homme qui a l’Esprit divin entre dans une assemblée d’hommes justes qui ont foi en l’Esprit divin, et que cette assemblée d’hommes fait intercession auprès de Dieu, alors l’ange de l’esprit prophétique qui se tient auprès de lui remplit cet homme. Rempli de l’Esprit saint, il parle à l’assemblée selon ce que veut le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγή
  choice: assemblée
  rationale: Dans ce contexte, le mot désigne un rassemblement de croyants, sans qu’il soit nécessaire d’y voir une institution particulière.
- source_word: ἔντευξις
  choice: prière
  rationale: Le terme peut désigner une requête ou une intercession adressée à Dieu. « Prière » est naturel en français et préserve ici la portée générale de l’acte collectif.
- source_word: ὁ κείμενος πρὸς αὐτόν
  choice: qui se tient auprès de lui
  rationale: Rendu proche de l’expression grecque, sans préciser davantage la nature du lien entre l’ange et l’homme.
- source_word: πληροῖ / πληρωθείς
  choice: remplit / rempli
  rationale: La répétition du grec est conservée afin de maintenir l’enchaînement entre l’action de l’ange et la parole inspirée.
- source_word: τὸ πλῆθος
  choice: l’assemblée
  rationale: Ici, la multitude est le groupe réuni auquel l’homme s’adresse; « assemblée » évite une formulation artificielle tout en restant fidèle au contexte.
theological_decisions:
- issue: Rapport entre « l’ange de l’esprit prophétique » et « l’Esprit saint »
  choice: Conserver les deux formulations distinctes telles qu’elles apparaissent dans le grec.
  alternative: Les harmoniser en identifiant explicitement l’ange à l’Esprit saint, ou faire de l’ange un simple messager extérieur.
  rationale: Le texte passe de l’action de l’ange de l’esprit prophétique au fait que l’homme est rempli de l’Esprit saint, sans expliquer précisément leur rapport. La traduction ne doit pas résoudre cette tension.
- issue: Sens de « foi en l’Esprit divin »
  choice: qui ont foi en l’Esprit divin
  alternative: qui possèdent la foi donnée par l’Esprit divin
  rationale: Le génitif grec permettrait diverses nuances, mais la construction la plus directe présente l’Esprit divin comme objet de la foi. La formulation française conserve cette lecture sans développement doctrinal.
translation_notes:
  register: Français moderne, clair et digne. La structure temporelle « quand… alors » et les répétitions essentielles du grec sont maintenues, avec une syntaxe suffisamment fluide pour la lecture publique.
